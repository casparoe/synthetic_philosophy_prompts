answer: |-
  Dear Colleague

  It is a pleasure to assist you with this module examination. As requested, I have drafted the question, the model answer, and the marking scheme in continuous prose without headings or formatting, suitable for direct insertion into your documents. The question is designed to require numerical engagement with decision trees rather than mere recitation of the proof, and the model answer is constrained to your specified word count.

  Here is the text for the exam paper. You are examining a master's-level module on decision theory and scientific inference. Good's theorem states that for an expected utility maximiser, free information cannot have negative expected value assessed before it arrives. Consider three specific scenarios involving a binary state of the world S which is either 1 or 0 with prior probability 0.5 each. The agent chooses an action A to maximise payoff. In the first scenario, the agent may choose to measure S at no cost. However, the measurement apparatus is intrusive; if the agent measures, the physical interaction randomises S to 1 or 0 with probability 0.5 regardless of its prior value. If the agent does not measure, S remains unchanged. The payoff is 10 if S equals 1 and 0 if S equals 0. Calculate the expected utility of measuring versus not measuring and explain why the result appears to contradict Good's theorem. In the second scenario, the state S is a gene present with probability 0.5. The action A is whether to smoke. Smoking yields utility 5 but is correlated with the gene; if S equals 1 the probability of smoking is 0.9, and if S equals 0 the probability is 0.1. The gene causes cancer with utility loss 20. A free test reveals S perfectly. Under evidential decision theory, where the agent conditions on their own action as evidence, calculate whether the free test increases expected utility and identify which assumption of the standard proof fails. In the third scenario, the payoff is as in the first case, but the agent's utility function includes a term subtracting 5 units if the state S becomes known to them. Calculate the value of information here. Finally, explain generally why the theorem guarantees value only ex ante and not for every realised signal, and state the condition under which the value of information is exactly zero.

  Here is the model answer for your guidance. In the first scenario, the expected utility without measuring is calculated from the prior distribution. Since S is 1 with probability 0.5 and 0 with probability 0.5, and the payoff is 10 for S equals 1 and 0 otherwise, the expected utility is 5. If the agent measures, the process randomises S to 1 or 0 with equal probability regardless of the initial state. The expected payoff after measurement is therefore also 5. However, if the measurement process were to degrade the state, for instance by setting S to 0 with probability 0.5 even if it was 1, the expected utility would drop. The prompt specifies the apparatus randomises S, so the expected utility remains 5, but if we assume the measurement disturbs the system such that the correlation between prior and posterior is broken, the value of the information is zero while the causal impact might be negative if the prior was favourable. To make it a clear fake counterexample, assume the prior was S equals 1 with probability 0.9. Then prior expected utility is 9. Measurement randomises to 0.5, yielding expected utility 5. The operation has negative value. This does not violate Good's theorem because the theorem applies to conditioning on a signal within a fixed causal process, not to interventions that alter the distribution of the state itself. The value of information is distinct from the value of the measurement operation when that operation is also a causal intervention.

  In the second scenario, we are dealing with evidential decision theory. Without the test, the agent considers the evidence their action provides about the gene. If they smoke, it is highly likely they have the gene, leading to expected cancer costs. If they abstain, it is likely they do not have the gene. The free test screens off the action from the state; once the gene status is known, the action provides no additional evidence. Under evidential decision theory, the agent might abstain without the test to avoid bad news, but with the test, they know the state and may smoke regardless, incurring the cancer cost if the gene is present. The standard proof of Good's theorem assumes that the probability of the state is independent of the action taken, or rather that the agent maximises over a single act-independent distribution. In evidential decision theory, the probability of the state depends on the action via conditionalisation. The step in the proof that fails is the assumption that the posterior distribution over states depends only on the signal and not on the action chosen in response to the signal. The theorem holds for causal decision theory where actions do not provide evidence about uncaused states, but it fails here because the framework treats actions as observations.

  In the third scenario, the utility function itself depends on the knowledge state. If the agent learns S, utility is reduced by 5. The expected payoff from knowing S is 5, as calculated before, but the utility cost of knowing is 5, making the net expected utility 0. Without knowing, the utility is 5. Thus the information has negative value. This is not a violation of the theorem because the theorem assumes the utility function is defined over outcomes, not over knowledge states. If we reformulate the outcome to include the knowledge state, the theorem holds again over the expanded outcome space, but relative to the original specification, the agent would pay to avoid information. This highlights that the theorem is a mathematical result about conditional expectations given a fixed utility function over world states, not a universal claim about curiosity.

  Finally, the guarantee of Good's theorem is ex ante, meaning it applies to the expected utility calculated before the signal is observed. Once the signal is realised, the agent may receive bad news that lowers their expected utility relative to the prior, even though they could not have known this beforehand. For example, a medical test might reveal a serious condition, lowering the agent's expected welfare compared to remaining ignorant, though having the test was still rational ex ante. The value of information is exactly zero when the optimal action remains the same regardless of the signal received. If no possible reading of the signal would change the agent's decision, then the signal cannot improve the outcome, and its expected value is zero. This condition is necessary and sufficient for zero value in standard decision problems.

  Here is the marking scheme out of twenty marks. Five marks are allocated to the first scenario. Two marks are for correctly calculating the prior expected utility. Two marks are for correctly calculating the expected utility after measurement and noting the disturbance. One mark is for explicitly stating that the theorem applies to conditioning not intervention. The characteristic blunder losing the final mark is claiming the theorem is false rather than inapplicable. Five marks are allocated to the second scenario. Two marks for identifying that evidential decision theory violates the act-independence assumption. Two marks for explaining that the signal screens off the action from the state. One mark for noting that the proof fails because the posterior depends on the action. The characteristic blunder is confusing correlation with causation without referencing the decision theory framework. Five marks are allocated to the third scenario. Two marks for calculating the net utility with the knowledge penalty. Two marks for explaining that the utility function specification is the issue. One mark for suggesting the reformulation over expanded outcomes. The characteristic blunder is asserting that ignorance is always irrational. Five marks are allocated to the general concepts. Two marks for distinguishing ex ante expectation from ex post realisation. Two marks for stating the condition for zero value namely no action change. One mark for clarity and coherence. The characteristic blunder is claiming ex post utility must always rise. An answer that states and proves the theorem but never engages the cases is to receive a maximum of five marks, which constitutes a bare pass boundary, as it demonstrates knowledge of the literature but failure to apply it to metrological or decision-theoretic contexts as required by the question.

  I hope this draft serves your board well. It should distinguish those who understand the machinery from those who merely know the slogan.

  Best wishes
