      *   *Premise 5: "...which means the coincidence problem dissolves into a single object described in two ways."*
          *   *Constitution View:* The coincidence problem (how can two things be in one place?) is accepted as a feature, not dissolved by reducing them to one object. They argue coincidence is *possible* because they are distinct kinds.
