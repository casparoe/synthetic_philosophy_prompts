      *   **Colleague's Summary:**
          *   Statue and clay share every physical part and non-relational property at every moment.
          *   Differences are purely modal (statue $\rightarrow$ statue-shape essential; clay $\rightarrow$ matter essential).
          *   When melted, nothing physical is destroyed; clay continues, loses a modal feature.
          *   *Conclusion:* Not really two objects in one place, but one underlying entity with two descriptions. Coincidence problem dissolves.
      *   **Task:** Evaluate the fairness of this characterization.
      *   **Specific Requirements:**
