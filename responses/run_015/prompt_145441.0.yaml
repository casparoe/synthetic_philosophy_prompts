      *   *Premise 4 (The Pivot): "On this account, there are not really two objects in one place, but one underlying entity..."*
          *   *Constitution View:* **NO.** This is the critical error. Constitution theorists (like Baker, Johnston, Yablo) insist on *numerical distinctness*. $Statue \neq Clay$. They are two objects occupying the same space.
