  # Teaching Plan: Lakatos's Methodology of Scientific Research Programmes
  **Session Duration:** 50 Minutes
  **Target Audience:** Advanced Undergraduate Philosophy of Science
  **Primary Text:** Imre Lakatos, "Falsification and the Methodology of Scientific Research Programmes" (excerpt)

  ## I. Learning Objectives
  1.  Demonstrate why naive falsificationism fails to account for theory retention amidst anomalies.
  2.  Construct the hard-core/protective-belt distinction as a necessary response to this failure.
  3.  Distinguish between progressive and degenerating problem shifts using the Newtonian programme.
  4.  Differentiate Lakatos's unit of appraisal (programmes) from Popper's (conjectures).

  ## II. Explicit Exclusions (Scope Boundaries)
  *To maintain conceptual focus within 50 minutes, the following will **not** be covered:*
  *   The formal taxonomy of ad hoc hypotheses (ad hoc₁, ad hoc₂, ad hoc₃).
  *   Comparative sociology of science (e.g., detailed comparison with Kuhnian paradigms or incommensurability).
  *   Historical appraisal of non-natural science programmes (e.g., Marxism, Psychoanalysis, or Creationism).
  *   The transition from Newtonian Mechanics to General Relativity as an example of belt adjustment (this is programme supersession, not internal modification).

  ## III. Misconception Mapping & Intervention Strategy
  *The following misconceptions will be addressed in the order they arise during the lesson flow, aligned with specific conceptual introductions:*

  1.  **Misconception:** *The protective belt is merely ad hoc immunization.*
      *   **Intervention Point:** Immediately after introducing the hard-core/belt distinction (Minute 25).
      *   **Strategy:** Use the Neptune case to distinguish between adjustments that only accommodate known anomalies versus those that generate novel predictions.
  2.  **Misconception:** *A "degenerating problem shift" means the programme is false.*
      *   **Intervention Point:** Precisely when introducing progressive versus degenerating shifts (Minute 35).
      *   **Strategy:** Clarify that degeneration indicates a loss of heuristic power/predictive novelty, not immediate falsity; a degenerating programme may still be true but is scientifically stagnant.
  3.  **Misconception:** *Lakatos is just Popper with a time-delay.*
      *   **Intervention Point:** After both views are fully in view (Minute 45).
      *   **Strategy:** Show that Lakatos appraises whole sequences of problem shifts (programmes) rather than single conjectures, changing the unit of rational appraisal.

  ## IV. Lesson Flow

  ### 0:00 – 0:10 | Segment 1: The Failure of Naive Falsificationism
  *   **Activity:** Board work / Socratic dialogue.
  *   **Content:**
      *   Present the naive falsificationist schema: $T \rightarrow P$; $\neg P$; therefore $\neg T$.
      *   Introduce the Duhem-Quine problem lightly: Theories do not face observation alone. $T + A_1 + A_2... \rightarrow P$.
      *   **Key Question:** "If Uranus violates Newtonian predictions, why do we not immediately discard Newton's laws?"
      *   **Goal:** Establish that anomalies are expected and manageable. Establish the *need* for a structure that allows theory retention despite anomalies. Do not introduce Lakatos yet.

  ### 0:10 – 0:25 | Segment 2: The Hard Core and Protective Belt
  *   **Activity:** Lecture with Case Study Application.
  *   **Content:**
      *   Introduce the **Research Programme** structure.
      *   **Hard Core:** Irrefutable by methodological decision (e.g., Newton's Inverse Square Law, Laws of Motion). Protected by the **Negative Heuristic**.
      *   **Protective Belt:** Auxiliary hypotheses (initial conditions, existence of bodies) subject to revision. Driven by the **Positive Heuristic**.
      *   **Case Study (Newton/Uranus/Neptune):**
          *   *Anomaly:* Uranus orbits deviate from Newtonian prediction.
          *   *Hard Core Status:* Untouched. The laws of mechanics and gravity are not questioned.
          *   *Belt Adjustment:* Hypothesize an unknown eighth planet (Le Verrier/Adams).
          *   *Outcome:* Neptune discovered at predicted coordinates.
      *   **Intervention (Misconception 2):** Address "Ad Hoc Immunization."
          *   *Point:* Merely saving the phenomenon (accommodating Uranus) would be ad hoc.
          *   *Distinction:* The belt adjustment was legitimate because it yielded a **novel fact** (Neptune's position) not used in constructing the hypothesis.
      *   **Instructor Note:** Explicitly avoid using Einstein's replacement of Newton here. That is programme abandonment, not belt adjustment.

  ### 0:25 – 0:35 | Segment 3: Progressive vs. Degenerating Problem Shifts
  *   **Activity:** Concept Definition & Classification.
  *   **Content:**
      *   Define **Theoretical Progress:** New theory has excess empirical content (predicts novel facts).
      *   Define **Empirical Progress:** Some of that excess content is corroborated.
      *   Define **Progressive Problem Shift:** A sequence of theories where each step is theoretically and empirically progressive.
      *   Define **Degenerating Problem Shift:** Theory changes only to accommodate past anomalies without predicting novel facts (lagging behind data).
      *   **Intervention (Misconception 1):** Address "Degenerating = False."
          *   *Point:* A degenerating programme is not necessarily falsified in the Popperian sense. It is rationally abandoned because it loses heuristic vitality, not because a single experiment kills it. It may remain "true" but is no longer the engine of discovery.

  ### 0:35 – 0:45 | Segment 4: Lakatos vs. Popper
  *   **Activity:** Comparative Analysis.
  *   **Content:**
      *   Review Popper: Falsification applies to single conjectures. Immediate rejection upon refutation (ideally).
      *   Review Lakatos: Appraisal applies to the *history* of the programme.
      *   **Intervention (Misconception 3):** Address "Popper with a Time-Delay."
          *   *Point:* It is not that Lakatos allows us to wait longer to falsify the *same* theory. It is that the *unit of appraisal* has changed from a single theory to a sequence of theory-variations. We judge the trajectory, not the snapshot.

  ### 0:45 – 0:50 | Segment 5: Assessment & Wrap-Up
  *   **Activity:** Check-for-Understanding (CFU) & Closing.
  *   **CFU Question (Hypothetical Application):**
      > "Consider Programme Z. Version Z₁ predicts Event A (confirmed). Anomaly B arises. Version Z₂ is developed to explain B but makes no new predictions. Anomaly C arises. Version Z₃ is developed to explain C and predicts Event D, which is subsequently confirmed.
      >
      > **Classify the shift from Z₁ to Z₂ and the shift from Z₂ to Z₃ as either progressive or degenerating, and justify your classification based on novel prediction.**"
      *   *Expected Answer:* Z₁→Z₂ is degenerating (accommodation only); Z₂→Z₃ is progressive (novel prediction D confirmed).
  *   **Closing:** Reiterate the exclusions (Ad hoc taxonomy, Kuhn, Marxism) to frame the limits of today's session. Assign reading for next week.

  ## V. Instructor Notes on Case Study Constraints
  *   **Neptune Case:** Ensure students see the *inverse-square law* as the hard core. The *existence of the 8th planet* is the belt.
  *   **Einstein/Newton:** If a student asks if General Relativity was a belt adjustment of Newtonianism, correct them immediately: "No, that involved changing the hard core (geometry of spacetime vs. flat space). That is a shift between programmes, not within one."
