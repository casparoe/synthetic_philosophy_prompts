prompt: |-
  Hey — I want you to act as a professional philosopher who's spent an unhealthy amount of time in population ethics and suffering-focused ethics, ideally the kind who's argued about the asymmetry on a forum at 2am. I need something practical out of that.

  I run a tiny reading group that meets above a bakery on Sundays — about twelve people, mostly lapsed effective-altruism types plus two who are really just here for the Schopenhauer — and we keep talking past each other. Half the room calls itself "negative utilitarian," and then immediately disagrees about everything: whether a life that's net pleasant but contains one bad hour is worth creating, whether the mild badness of billions of tiny irritations can outweigh a single agony, whether pain someone chose and is glad about still needs to be offset. I tried building a tree myself and ended up with one where almost everyone landed on the same leaf, which tells me I was asking the wrong questions. So: I want a diagnostic that sorts people by what they say about cases, not by which label they're fond of.

  Please do a first pass brainstorming the logical space before you write anything — I want the questions generated from the space of possible answer combinations, not from a memorized list of -isms, so think about that before you start drawing branches. Then give me: eight to ten branch questions, each phrased as a concrete case or a claim someone could just agree or disagree with, two or three answer options each, and every one answerable by a smart person who has never heard the labels. Build the branch order from the axiological joints rather than from the names: start with what has negative value at all and whether suffering is the only thing that does, then whether positive states have independent value or only offsetting/instrumental value, then the aggregation question (do small bads sum across people, or is there some intensity threshold below which they stop counting, or a lexical priority for the worst off), then the creation/existence question, then person-affecting vs. impersonal if earlier branches haven't already settled it. Please use at least these cases somewhere in the tree, renaming them if you like: (1) the erased agony — someone endures an hour of severe suffering, after which their memory is wiped and their psychology fully restored, so nothing about them is traceably different and nobody else is affected; does the hour still count as a cost, and if so, whose? (2) the wanted burn — the identical burning sensation in a chilli-lover who adores it and would pay to repeat it versus in someone strapped to a chair; is the disvalue in the sensation, in the subject's aversion, or somewhere else? (3) the silent stress response — a body with no consciousness at all, cortisol spiking and tissue breaking down but nobody home; suffering or not? (4) the static — a billion people each get one flicker of mild irritation they forget within seconds and wouldn't pay a penny to avoid, versus one person getting ten minutes of agony; which is worse, or are they incommensurable, or is there a threshold below which the flickers just drop out? (5) the consolation case — two worlds with identical total suffering, but in one every sufferer is also comforted and has plenty of what makes a life good; does the added positive make that world better, worse, or leave it exactly as it was? (6) the one-bad-hour life — create a person whose life is net mildly pleasant but contains one hour of real agony, or create nobody.

  For the leaves I want around nine to eleven, each with the standard name of the position where one exists (I've seen some of these called "negative leximin," "tranquillism," "negative prioritarianism," asymmetric or Benatar-style views, "weak NU," lexical-threshold views — I'm probably mangaling some of these, so use whatever you think is actually standard and just write "unnamed" where nobody defends it), plus one sentence on the most awkward thing that leaf is committed to and one sentence on what would most likely move someone off it. Then mark the answer combinations your tree allows but that nobody actually occupies, and for each say briefly whether it's empty because it's incoherent, because it's merely unattractive, or because no one has bothered — and flag any two leaves your tree genuinely cannot separate rather than inventing a question that pretends to. Finish with a short scoring key mapping answer patterns onto leaves, and tell me which single question does the most sorting work, i.e. which one to lead with if I only get one shot at a room of twelve people who are already board. Keep the whole thing tight enough to photocopy onto one sheet, don't ask anyone to define a term, and don't give me a bibliography — half of us read on paper and none of us will look anything up.
