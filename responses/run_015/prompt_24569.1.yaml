answer: |-
  The framing switches to worst-case if and only if a single unmitigated failure can cause irreversible or catastrophic harm that outweighs the aggregate benefits of successful deployments.

  ### The Decision Procedure

  **Step 1: The Harm Ceiling Test**
  *   **Question:** What is the maximum credible harm from a single incorrect output or action in this use case, assuming no human intervenes?
  *   **Good Enough Answer:** A specific description of the worst outcome (e.g., "patient death," "financial loss of $10k," "exposure to CSAM").
  *   **Branch:**
      *   If harm involves loss of life, permanent physical/psychological injury, or existential risk → **Stop. Worst-Case Framing Required.**
      *   If harm is transient, financial, or easily reversible → **Proceed to Step 2.**

  **Step 2: The Intervention Latency Test**
  *   **Question:** Can we detect and stop a harmful output before the harm is realized, with 99.9% reliability, in real-time?
  *   **Good Enough Answer:** Evidence of a monitoring layer with lower latency than the harm mechanism (e.g., "human-in-the-loop before advice is shown" vs "advice is spoken instantly").
  *   **Branch:**
      *   If harm occurs faster than detection/mitigation → **Stop. Worst-Case Framing Required.**
      *   If mitigation is guaranteed before harm → **Proceed to Step 3.**

  **Step 3: The Adversarial Surface Test**
  *   **Question:** Are users or third parties incentivized to provoke the model into failure modes (jailbreaks, prompt injection, edge-case hunting)?
  *   **Good Enough Answer:** Threat model assessment (e.g., "general users seeking help" vs "bad actors seeking exploit").
  *   **Branch:**
      *   If high adversarial incentive exists → **Stop. Worst-Case Framing Required.**
      *   If low adversarial incentive (cooperative users) → **Proceed to Step 4.**

  **Step 4: The Tail Risk Threshold (The Handoff)**
  *   **Question:** Is the probability of the worst-case scenario below our acceptable risk threshold per deployment unit?
  *   **Good Enough Answer:** A numerical probability bound (e.g., "< 1 in 10 million") derived from evals.
  *   **Branch:**
      *   If probability is quantifiable and below threshold → **Average-Case Framing Permitted.**
      *   If probability is unquantifiable or above threshold → **Stop. Worst-Case Framing Required.**

  ### Where This Is Just Judgment Dressed as Procedure

  *   **Step 1 (Defining "Catastrophic"):** Deciding whether psychological harm to a child is "irreversible" is a values judgment, not a fact. The procedure treats it as a binary switch, but the definition is political.
  *   **Step 4 (The Threshold):** Setting the acceptable probability (1 in 1 million vs 1 in 1 billion) is purely a risk appetite decision. The procedure cannot calculate this; it only enforces consistency once you pick a number.
  *   **"Plausible" in Worst-Case:** Determining what counts as a "plausible" worst-case scenario vs. a "fantasy" scenario relies on expert intuition that varies by team culture.

  ### Application to Use Cases

  **Use Case 1: Medical Triage Model**
  1.  **Harm Ceiling:** Patient death or permanent disability due to misdiagnosis. (Irreversible/Catastrophic).
  2.  **Branch:** **Stop. Worst-Case Framing Required.**
  3.  **Result:** You cannot average out deaths. Even if the model is 99% accurate, the 1% failure mode dictates the release criteria. You must prove robustness against the worst plausible misdiagnosis, not just optimize for overall accuracy.

  **Use Case 2: General Purpose Assistant for Kids**
  1.  **Harm Ceiling:** Psychological harm, facilitation of self-harm, or exposure to predatory behavior via the model. (Debatable reversibility, but high severity).
  2.  **Intervention:** Real-time monitoring is difficult at scale; harm (e.g., emotional manipulation) happens during the conversation. (Mitigation latency is high).
  3.  **Adversarial Surface:** High. Kids test boundaries; bad actors may use the platform to target kids.
  4.  **Branch:** **Stop. Worst-Case Framing Required.**
  5.  **Result:** You cannot rely on average helpfulness. You must prove the model refuses harmful requests even under adversarial probing specific to child safety.

  ### Flagged Unwanted Answer

  For the **General Purpose Assistant for Kids**, this procedure mandates **Worst-Case Framing**.

  If your product team intended to release this model based on average helpfulness metrics (e.g., "95% of conversations are safe and fun"), this procedure blocks that path. It forces you to treat a single instance of successful grooming facilitation or self-harm encouragement as a release-blocking failure, regardless of how many successful conversations offset it. This will significantly increase evaluation costs and delay release timelines compared to an average-case framing.
