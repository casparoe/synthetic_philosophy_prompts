  I just finished a long argument with a friend and would like a dispassionate second opinion. A relative of both of us is offering us a small joint investment: we each put in $5,000, and at the end of each month the one of us whose turn it is (we alternate, starting with me) may either close the fund and split the current balance 70/30 in their favor, or let it run another month (expected growth of 20%) and pass the decision to the other. The fund closes automatically after six months, with the balance split 50/50. My friend insists the only rational move is for me to close it immediately in month one, because if I let it run he will close it in month two, and so on down the line. I can't shake the feeling that if we both simply let it run a few months we'll both come out ahead of the month-one close. Could you tell me where his argument breaks down, if it does, and what I should actually do?
