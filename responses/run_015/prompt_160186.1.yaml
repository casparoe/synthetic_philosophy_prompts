answer: |-
  The hole is in **Step (3)**.

  Your friend's argument is a sophisticated version of the **Paradox of the Heap** applied to moral causation. It relies on an equivocation between *collective* causation and *distributive* causation.

  Here is the diagnosis, the commitments it entails, and my confidence rating.

  ### The Diagnosis: Step (3) and the Fallacy of Division

  Step (3) claims: *If demand makes a difference to how many birds get bred, and demand is nothing over and above the individual purchases, then the individual purchases make a difference.*

  This inference is invalid in threshold contexts. It commits the **Fallacy of Division**: assuming that what is true of the whole (the aggregate demand triggers a batch) must be true of the parts (each individual purchase triggers a batch).

  In systems with **non-linear causation** (like your supermarket's batch ordering), the causal power is an *emergent property* of the set crossing a threshold, not a property possessed by the members.
  *   **The Aggregate:** Has the property "triggers a reorder."
  *   **The Individual:** Has the property "is a member of the set that triggered a reorder."

  These are not the same property. To say they are the same is to assume causation is linear and additive (1 unit of cause = 1 unit of effect). But your setup in (2) explicitly describes a **step-function** (threshold) model. In a step-function, adding 1 unit often produces 0 effect until the $N$th unit, which produces the *entire* effect.

  By rejecting (3), you dissolve the contradiction. You can consistently hold that:
  1.  The Aggregate causes the harm.
  2.  The Individual (in this specific threshold scenario) makes no *deterministic* causal difference.
  3.  There is no contradiction, because causation does not distribute over the constituents of a threshold-crossing event.

  ### The Commitments

  Rejecting Step (3) allows you to keep (1) and (2), but it forces you to accept specific consequences in other domains. Here is what that commits you to:

  **1. Voting (The "Pivotal Voter" Problem)**
  *   **Commitment:** You must accept that in most large-scale elections, your individual vote is **causally inert**.
  *   **Implication:** If you hold onto (1) (wrongness/rightness requires causal difference), you must admit that voting is morally neutral in non-swing scenarios. To save the intuition that voting is a duty, you would eventually have to reject (1) and argue that moral status depends on *expected* utility (tiny chance $\times$ huge impact) or expressive value, not actual deterministic difference-making.
  *   **Consistency:** This is logically consistent with the meat case. Both are threshold systems.

  **2. Emissions (The "Drop in the Ocean" Problem)**
  *   **Commitment:** You must distinguish between **threshold goods** (chicken batches, election wins) and **cumulative goods** (atmospheric CO2).
  *   **Implication:** For carbon emissions, premise (2) is likely **false**. Climate harm is generally modeled as linear/continuous, not step-wise. One ton of CO2 *does* make a causal difference to the aggregate temperature/harm, even if it's microscopic.
  *   **Consistency:** You can argue meat buying is causally inert (threshold) while driving is not (cumulative), without contradiction. The logic of (3) fails for meat but holds for carbon.

  **3. The Cap Scenario (Step 6)**
  *   **Commitment:** If the government imposes a hard cap on slaughter, and you hold (1), you must accept that eating that chicken is **causally inert and therefore permissible**.
  *   **Implication:** This is the hardest pill to swallow. If harm is fixed by policy, your consumption doesn't increase it. If you feel it is *still* wrong to eat the meat under a cap, you are signaling that **Premise (1) is false**.
  *   **Why (1) might be false:** Most contemporary ethicists argue (1) is too narrow. Wrongness might depend on **complicity** (participating in a wrongful practice), **virtue** (what kind of person does this make me?), or **expected value** (risk of being the threshold trigger), not just actual deterministic causal impact.

  ### Confidence and Uncertainty

  **Confidence in Diagnosis: High (90%)**
  Logically, Step (3) is the clear failure point. It asserts a distributive property of causation that does not exist in threshold systems. You can mathematically demonstrate that $\text{Cause}(\sum x) \neq \sum \text{Cause}(x)$ when the function is non-linear.

  **Least Sure Point: The Moral Implication of Premise (1)**
  I am less certain about whether you *should* hold onto Premise (1).
  *   **The Tension:** Rejecting (3) saves the logic, but it leaves you with the conclusion that individual meat-buying (in this specific batch scenario) makes no causal difference. If you keep (1), that means the act isn't wrong.
  *   **The Uncertainty:** Many philosophers argue the "inefficacy objection" fails not because individuals *do* make a difference (rejecting 2), but because wrongness doesn't *require* individual causal difference (rejecting 1).
  *   **Flag:** If you find the "Cap Scenario" (Step 6) morally intolerable (i.e., you think it's still wrong to eat the capped chicken), that is strong evidence that **Premise (1) is the real culprit**, not Step (3). Step (3) is the logical error, but Premise (1) is likely the philosophical error.

  ### Summary
  Your friend's argument forces a contradiction by treating a threshold system as if it were a linear one. Break Step (3). Accept that aggregates can cause harm while individuals (in threshold cases) do not. Be prepared to admit that if (1) is true, "harmless" participation in capped systems is permissible—or else reject (1) and broaden your definition of wrongness beyond simple causal difference.
