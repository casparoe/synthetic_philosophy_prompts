      *   *Refining the "Adultery" point:* The user says "something valuable is lost." I should validate that. The "value" is the recognition that some bonds are constitutive of the self, not just contractual.
      *   *Refining the "Guilt Algorithm":* Why dystopian? Because it treats morality as debt, not character.

  11. **Final Polish:** Ensure the distinction between *toxic shame* (I am worthless) and *functional shame* (I have jeopardized my standing) is clear. The user seems to be grappling with functional shame.

      *(Self-Correction during drafting)*: I need to be careful not to endorse toxic shaming. I must distinguish between *reintegrative shaming* (Braithwaite) and *stigmatizing shaming*. The user's intuitions lean towards reintegrative (mourning, adultery) vs. stigmatizing (maybe tax? or diet?). Actually, tax shaming is often stigmatizing. I should note that distinction.

      *Revised Principle:* **Guilt repairs acts; Shame regulates identity/belonging.**
      *   Tax: Identity as citizen.
      *   Adultery: Identity as partner.
      *   Mourning: Identity as community member.
      *   Diet: Identity as self-manager (Guilt/Regret is enough).
