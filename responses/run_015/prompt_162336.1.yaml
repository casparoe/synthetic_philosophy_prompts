answer: |-
  **Intent Validation Procedure**
  *Constraint: 20 mins. Terms defined inline. Use this to vet "Users want X" claims.*

  **Checklist (Max 250 words)**
  1.  **Alternatives:** Could users achieve goal via Y?
      *   Pass: Yes. Fail: No. **Stop:** Handoff (System Constraint). *Type: Fact.*
  2.  **Effort:** Is X less work than Y?
      *   Pass: No. Fail: Yes. **Stop:** "Ease" not "Want". *Type: Fact.*
  3.  **Identifiability** (Definition: Whether different goals produce identical data): Do multiple goals fit these clicks?
      *   Pass: No (Unique fit). Fail: Yes. **Stop:** Handoff (Data cannot tell). *Type: Judgement.*
  4.  **UI Version:** Are users on legacy UI?
      *   Pass: No. Fail: Yes. **Stop:** Muscle Memory. *Type: Fact.*
  5.  **Incentive:** Does clicking game the metric?
      *   Pass: No. Fail: Yes. **Stop:** Artifact. *Type: Judgement.*
  6.  **Recency:** Did behavior start >3 months ago?
      *   Pass: No. Fail: Yes. **Stop:** Habit. *Type: Fact.*

  *Note: Steps 3 and 5 require human interpretation of ambiguity and incentive structure; they are not pure SQL queries.*

  **Case Applications**
  *   **(a) Advanced Search:** Q1 Pass (default exists). Q2 Fail (advanced requires more clicks). **Verdict:** Ease, not Want. Users choose the path of least resistance, not power. Do not invest engineering time here.
  *   **(b) Power Users:** Q1 Pass. Q2 Pass. Q3 Fail (Model fits "debugging" and "waiting" equally). **Verdict:** Data cannot tell (Handoff to PM). The clicks are ambiguous; only user interviews resolve this. Do not delete screen based on data alone.
  *   **(c) Nag Banner:** Q1 Pass. Q2 Pass. Q5 Fail (Clicking dismisses banner, inflating metric). **Verdict:** Artifact. The metric measures annoyance tolerance, not feature value. Ignore the 30% lift.

  **Limitations (For VP)**
  This procedure validates whether behavior implies intent, not whether intent is valuable. It cannot detect latent needs (users don't click what they can't imagine). It cannot measure satisfaction (clicks ≠ happiness). It cannot predict future behavior after UI changes. Use this to filter false positives, not to generate roadmap ideas. It protects engineering time from being wasted on artifacts, but it does not replace product vision. If the data fails this checklist, do not proceed to engineering; proceed to user research.
