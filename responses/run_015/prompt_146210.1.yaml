answer: |-
  You have hit the nail on the head regarding the stagnation in the philosophy of medicine. The reason everyone keeps citing the same 90s papers (Boorse '77, Wakefield '92, Engelhardt '96) is that the debate reached a reflective equilibrium that turned into a trench war.

  Your intuition is correct: **the stalemate is not primarily metaphysical; it is a category error regarding the pragmatic function of the concept "disease."** The sides are talking past each other because Naturalists are trying to define a *scientific kind* (ontology), while Normativists are analyzing a *warrant for intervention* (normative status).

  Here is a breakdown of why the **Etiological vs. Systemic** distinction you proposed is the most viable way to cut the Gordian knot, and where the remaining friction lies.

  ### 1. The Conflation of Projects
  The deadlock persists because "disease" is asked to do two incompatible jobs:
  1.  **Descriptive/Explanatory:** Identify a biological state independent of human values (so we can study it scientifically).
  2.  **Prescriptive/Normative:** Identify a state that warrants medical attention/resource allocation (so we know what to treat).

  *   **Boorse-style Naturalists** are obsessed with Job 1. They demand evolutionary etiology (Selected Effect function) to ensure the "dysfunction" is objective and not just a statistical deviation or a social dislike.
  *   **Normativists** are obsessed with Job 2. They argue that without a value judgment (harm, suffering, loss of opportunity), a biological dysfunction is just a curiosity (e.g., asymptomatic hypertension in a context where no treatment exists).

  When you ask "Is dysfunction evolutionary or homeostatic?", you are asking a Job 1 question. But the Normativist interruption ("But why does that matter?") is a Job 2 question.

  ### 2. Etiological vs. Systemic Dysfunction: A Functional Split
  Your proposed distinction maps onto the **Selected Effect (SE)** vs. **Causal Role (CR)** function debate in philosophy of biology, but applying it specifically to *pathology* offers a way out.

  #### A. Etiological Dysfunction (The Boorse/Wakefield Track)
  *   **Definition:** A trait is dysfunctional if it fails to perform the effect for which it was naturally selected.
  *   **Utility:** This is excellent for **classification and kindhood**. It explains *why* a condition is a "disease kind" rather than an injury or a design limitation. It anchors the disease in the history of the species.
  *   **Limitation:** It is epistemically inaccessible in many clinical contexts. We often don't know the evolutionary history of a specific physiological mechanism. It also struggles with novel pathologies (e.g., side effects of modern environments) that haven't had time to be "selected against."

  #### B. Systemic/HPC Dysfunction (The Boyd/Systems Track)
  *   **Definition:** A state is dysfunctional if it represents a failure of the Homeostatic Property Cluster to maintain stability within a viable range, regardless of evolutionary history.
  *   **Utility:** This is excellent for **diagnosis and mechanism**. It aligns with modern Network Medicine and Systems Biology. It allows us to identify pathology in real-time based on current system dynamics (e.g., cytokine storms, metabolic syndrome) without needing a phylogenetic story.
  *   **Limitation:** It risks the "statistical deviation" problem. If homeostasis shifts (adaptation), is the new state dysfunctional? (e.g., high altitude adaptation).

  #### The Synthesis
  The deadlock breaks if we admit **both are necessary but for different stages of medical reasoning.**
  *   **Etiological dysfunction** validates the *category* of disease (Ontology).
  *   **Systemic dysfunction** identifies the *instance* of disease in a patient (Diagnosis).

  If we treat "Disease" as a **Pragmatic Kind** (a la Rachel Cooper), we can say: *A disease is a systemic failure (HPC) that is of a type generally caused by etiological dysfunction, which we have decided is bad enough to treat.*

  ### 3. The Remaining Normative Gap
  Even if you accept the Etiological/Systemic split within naturalism, the Normativist will still ask: **"So what?"**

  You can have a clear etiological dysfunction (e.g., a genetic mutation preventing digestion of a specific modern starch) and a clear systemic failure (malnutrition), but if the patient doesn't care, or if the environment doesn't demand that starch, is it a *disease*?

  This suggests the conceptual distinction you need isn't just inside naturalism, but between **Pathology** and **Disease**.
  *   **Pathology:** A naturalistic fact (Etiological or Systemic dysfunction). Value-free.
  *   **Disease:** Pathology + Normative Judgment (Harm/Need for Intervention). Value-laden.

  Many philosophers (like Peter Schwartz) have argued for this "Hybrid" view, but it often gets ignored because it doesn't satisfy the purists on either side. Naturalists hate admitting values; Normativists hate admitting biological facts constrain values.

  ### 4. How to Move Beyond the 90s Papers
  If you want to write or think your way out of this loop, stop looking at the BST vs. Normativism binary and look at where the biology has gone since 2000. The 90s debate assumes a "machine metaphor" of the body (parts have functions). Modern biology suggests a **network/eco-devo metaphor**.

  *   **Network Medicine (Barabási, et al.):** Diseases aren't single gene failures; they are perturbations in interaction networks. This favors the **Systemic/HPC** view. A "dysfunction" is a topological failure in the network, not necessarily a failure of a selected trait.
  *   **Evo-Devo & Plasticity:** The idea of a fixed "species design" (Boorse) is biologically outdated. Phenotypic plasticity means "normal function" is context-dependent. This undermines the rigid Etological view and supports a **Contextual Systemic** view.
  *   **4E Cognition/Embodied Medicine:** If function is enacted rather than pre-represented, dysfunction is a failure of coupling with the environment, not an internal broken part.

  ### Conclusion: The Way Out
  The disagreement is not metaphysical; it is **lexical overload**. We are using one word ("Disease") for two concepts ("Biological Pathology" and "Social Warrant").

  To break the deadlock:
  1.  **Adopt the Split:** Argue for **Etiological Dysfunction** as the criterion for *disease classification* (research/epidemiology) and **Systemic Dysfunction** as the criterion for *clinical diagnosis* (individual care).
  2.  **Separate Pathology from Disease:** Concede to the Normativists that "Disease" implies a normative claim, but insist to the Naturalists that "Pathology" is a strictly naturalistic claim grounded in either etiology or homeostasis.
  3.  **Update the Biology:** Stop arguing about Boorse's 1977 physiology. Argue about whether Network Theory or Evo-Devo provides a better naturalistic account of failure than Selected Effects.

  The stall isn't because the problem is unsolvable; it's because the field is trying to solve a pragmatic problem with metaphysical tools. If you frame dysfunction as **multi-level** (Etiological at the population/kind level, Systemic at the individual/instance level), you dissolve the contradiction.
