  ive been stuck on the naturalism/normativism thing in philosophy of medicine—specifically whether dysfunction needs evolutionary etiology or can just be a homeostatic cluster failure. boorse-style naturalists want historical selected effects, but theres this other systemic view (boyd-style hpc?) that tries to drop the evolutionary story entirely. normativists say both still smuggle in "proper function" values, but it feels like the real stall is inside naturalism: are we arguing about biological explanation or clinical justification? is the disagreement actually metaphysical, or are the sides just answering different questions under the same word "disease"? and if its the latter, is there any conceptual distinction—maybe between etiological and systemic dysfunction—that could actually break the deadlock, or are we permanently talking past each other? everyone keeps citing the same 90s papers and i wonder if were missing that split.
