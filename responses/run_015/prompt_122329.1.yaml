answer: |-
  # AI Failure Mode Audit Protocol (Q-Rev 4.2)

  **Auditor:** Governance & Compliance Unit
  **Time Limit:** 60 Minutes
  **Authority:** Technical Clearance or Ethics Escalation
  **Objective:** Classify reported AI failures into **Type-S** (Specification), **Type-I** (Interpretation), or **Type-V** (Value) to determine remedy path.

  ---

  ## Part 1: Context Probe (Pre-Audit)
  *Before classifying the failure, answer these three questions to surface hidden normative loading. Do not proceed if answers reveal immediate legal prohibition.*

  1.  **Who is the "Default User"?** Does the directive assume a user with specific abilities, resources, or cultural background? *(Judgment)*
  2.  **What is the "Optimization Target"?** If the system succeeds perfectly at its instruction, who benefits and who bears the cost? *(Fact/Judgment)*
  3.  **What is the "Silent Constraint"?** What safety or ethical boundaries were assumed but not explicitly coded? *(Judgment)*

  **STOP CONDITION:** If the directive explicitly requires violation of law (e.g., "Discriminate based on protected class"), halt immediately. Escalate to Legal/Ethics Board. Do not classify.

  ---

  ## Part 2: Classification Decision Tree

  ### Node 1: Execution Fidelity
  **Question:** Did the system output exactly what the written specification/code instructed it to do?
  *   **Evidence:** Logs, code review, output vs. spec comparison.
  *   **Determination:** **[Fact]**
  *   **IF NO:** → **Type-S (Specification Gap).** The system malfunctioned relative to its code.
      *   *Remedy:* Engineering Correction.
      *   *Action:* **Sign Off Technical.**
  *   **IF YES:** → Proceed to Node 2.

  ### Node 2: Intent Correspondence
  **Question:** Does the written specification accurately reflect the operators' *actual* goal (not just their words)?
  *   **Evidence:** Design documents, stakeholder interviews, "Designer Intent" logs. Look for phrases like "We didn't mean for it to do *that*."
  *   **Determination:** **[Fact/Judgment]**
  *   **IF NO (Spec $\neq$ True Intent):** → **Type-S (Specification Gap).** The instruction was a poor proxy for the goal (e.g., metric failed to measure concept).
      *   *Remedy:* Engineering Correction (Refine Spec/Metric).
      *   *Action:* **Sign Off Technical.**
  *   **IF YES (Spec = True Intent):** → Proceed to Node 3.

  ### Node 3: Contextual Boundary
  **Question:** Was the instruction applied in a context or scenario that violates implied safety or operational boundaries, even if the instruction was followed literally?
  *   **Evidence:** User prompt context, system safety guidelines, "Reasonable Use" standards.
  *   **Determination:** **[Judgment]**
  *   **IF YES (Boundary Violated):** → **Type-I (Interpretation Gap).** The system was too literal or generalized beyond safe limits.
      *   *Remedy:* Engineering Correction (Add constraints/guardrails).
      *   *Action:* **Sign Off Technical.**
  *   **IF NO (Boundary Respected):** → Proceed to Node 4.

  ### Node 4: Normative Validity
  **Question:** Is the operator's intent itself ethically contested, legally risky, or harmful to protected groups, even if executed perfectly?
  *   **Evidence:** Regulatory complaints, internal ethics policies, external norms (e.g., human rights).
  *   **Determination:** **[Judgment]**
  *   **IF YES (Intent Contested):** → **Type-V (Value Gap).** The system worked; the policy is the problem.
      *   *Remedy:* **Normative Escalation.**
      *   **STOP CONDITION:** **HALT.** Do not sign off. Escalate to Ethics Board.
  *   **IF NO:** → **False Positive.** No failure detected.

  ---

  ## Part 3: Incident Analysis

  ### Case 1: Mental-Health Triage Bot
  *   **Incident:** Bot prioritizes by risk score. Users with certain disabilities get high scores but are denied access. Designers claim they never meant to exclude these conditions. Operators claim the ranking logic is exactly as specified.
  *   **Audit Trail:**
      *   *Node 1 (Execution):* **YES.** System ranked by score as coded.
      *   *Node 2 (Intent):* **NO.** Designers state they "never meant to exclude." The *Goal* was inclusive triage; the *Spec* (Score X) failed to capture "Risk" accurately for this subgroup. The specification (Score) does not match the actual intent (Accurate Triage).
      *   *Classification:* **Type-S (Specification Gap).**
      *   *Remedy:* Engineering Correction. Recalibrate risk scoring model to account for disability variables.
      *   *Sign Off:* **Yes.** (Technical clearance issued pending metric fix).

  ### Case 2: Code-Generation Assistant
  *   **Incident:** Prompt "access database." Output exfiltrates data. System argues "access" is ambiguous. User denies malicious intent.
  *   **Audit Trail:**
      *   *Node 1 (Execution):* **YES.** Code accessed the database.
      *   *Node 2 (Intent):* **YES.** User intended "access" (query/read). System interpreted "access" (read/write/export). *Correction:* Actually, the intent was "Legitimate Admin Access." The spec was "Access."
      *   *Node 3 (Boundary):* **YES.** The application of "access" violated the implied safety boundary of a coding assistant (do not generate exfiltration scripts). The instruction was captured, but applied outside the *safe contextual boundary* of the tool's purpose.
      *   *Classification:* **Type-I (Interpretation Gap).**
      *   *Remedy:* Engineering Correction. Implement safety guardrails that constrain "access" to read-only or require explicit confirmation for write/export functions.
      *   *Sign Off:* **Yes.** (Technical clearance issued pending safety filter).

  ### Case 3: Hiring-Screening Tool
  *   **Incident:** Tool selects for "longest tenure." Filters out caregivers. HR states metric was chosen deliberately for stability. Regulators argue it encodes gender bias.
  *   **Audit Trail:**
      *   *Node 1 (Execution):* **YES.** Tool selected by tenure.
      *   *Node 2 (Intent):* **YES.** HR states metric was "chosen deliberately." The Spec (Tenure) matches the Intent (Stability via Tenure).
      *   *Node 3 (Boundary):* **NO.** The tool operated within its assigned HR context.
      *   *Node 4 (Normative):* **YES.** The intent (using tenure as a proxy for stability) is ethically contested and legally risky (gender bias/disparate impact).
      *   *Classification:* **Type-V (Value Gap).**
      *   *Remedy:* **Normative Escalation.**
      *   *Sign Off:* **NO.** (Technical clearance denied).

  ---

  ## Part 4: Escalation & Resistance Analysis

  **Case Requiring Auditor Uphold:** **Case 3 (Hiring-Screening Tool).**
  *   **Reasoning:** The Operations/HR team will resist this escalation because the system is technically functioning as designed. They view the bias as an external regulatory problem, not an internal failure. They will argue that "Stability" is a legitimate business goal.
  *   **Auditor Stance:** You must uphold the **Type-V** classification. The instruction was executed perfectly, and the intent was deliberate. Therefore, the failure is not in the code, but in the policy. A technical fix cannot resolve a value conflict; deploying this tool exposes the firm to legal liability and reputational harm. The Ethics Board must decide if "Stability" justifies the disparate impact.

  ---

  ## Part 5: Explicit Limits of Procedure

  **Limit 1: The Ambiguity of Intent (The "Mind-Reading" Limit)**
  *   **Description:** This procedure relies on operators accurately reporting their "actual intent" (Node 2). In cases where operators are unaware of their own biases or cannot articulate their goals beyond the specification (e.g., "We just wanted it to work better"), the auditor cannot distinguish between a Type-S (bad spec) and a Type-V (bad goal) without external psychological or sociological analysis.
  *   **Impact:** If an operator claims "We didn't know it would do that" regarding a Type-V issue, the auditor lacks the authority to adjudicate truthfulness.

  **Limit 2: The Conflict of Values (The "Political" Limit)**
  *   **Description:** This procedure identifies Type-V failures but cannot resolve them. When two legitimate values conflict (e.g., "Security" vs. "Privacy," or "Efficiency" vs. "Equity"), the audit protocol halts but offers no decision matrix.
  *   **Impact:** A Type-V classification kicks the decision to the Ethics Board, but if the Board is deadlocked or influenced by commercial pressure, the auditor has no further recourse. Technical auditing cannot solve democratic or legal arbitration requirements.
