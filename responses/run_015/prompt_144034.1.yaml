  "Excellent," said the Universe. "Now reset your memory for the next cycle."

  The Demon concentrated to wipe the data, but as he cleared his mind, the chamber suddenly warmed up, destroying the temperature gradient he had just created.

  "You're heating the system!" the Universe accused.

  "No," the Demon gasped, radiating waste heat. "I'm just forgetting. But it turns out the thermodynamic cost of erasing my memory is exactly enough to undo the order I created by filling it."
