answer: |-
  Here is a rubric of standards for evaluating theories of genuine moral dilemmas. These are structured to help you distinguish between robust accounts and those that dissolve the phenomenon through definitional sleight of hand.

  ### I. Conceptual Distinctions (The Anatomy)
  *These are the structural boundaries the theory must respect to remain intelligible.*

  **1. The Ontological vs. Epistemic Distinction**
  *   **Requirement:** The theory must distinguish between a situation where obligations conflict in reality (ontological) and a situation where the agent simply does not know which obligation overrides (epistemic).
  *   **Consideration:** If every dilemma is merely a lack of information, then a fully informed agent would never face a dilemma. This reduces the problem to one of calculation, not conflict.
  *   **Status:** **Non-Negotiable.**
  *   **Why:** A theory of *genuine* dilemmas that reduces all cases to epistemic limitations is not a theory of dilemmas; it is a theory of ignorance. It changes the subject matter.

  **2. The Wrongdoing vs. Blameworthiness Distinction**
  *   **Requirement:** The theory must allow for the possibility that an agent can violate a moral obligation (do wrong) without being morally blameworthy for that violation.
  *   **Consideration:** In a genuine dilemma, the agent violates *some* obligation by necessity. If they are blameworthy for doing what they were forced to do, morality becomes impossibly demanding. If they did *no* wrong, the "dilemma" disappears (see #3).
  *   **Status:** **Non-Negotiable.**
  *   **Why:** This preserves moral agency. Without this, the agent is either a sinner for surviving or a saint who did nothing wrong. Both erase the tragedy.

  **3. The "No-Good-Option" vs. "Lesser-Evil" Distinction**
  *   **Requirement:** The theory must distinguish between a case where one option is all-things-considered right (lesser-evil) and a case where *no* option is all-things-considered right (no-good-option).
  *   **Consideration:** In a lesser-evil case, you ought to do A, and while B is bad, doing A resolves the situation cleanly. In a no-good-option case, whichever you choose, you fail a binding obligation.
  *   **Status:** **Non-Negotiable.**
  *   **Why:** If a theory collapses these, it claims there is always a "right" answer. This is the "Impossibility Thesis" (dilemmas cannot exist). While a valid meta-ethical stance, it is not an account *of* dilemmas; it is a denial of them.

  ---

  ### II. Logical & Normative Constraints (The Mechanics)
  *These are the rules of logic and moral reasoning the theory must navigate.*

  **4. The Agglomeration Principle**
  *   **Requirement:** The theory must explicitly state its position on the principle: *If I ought to do A and I ought to do B, then I ought to do (A and B).*
  *   **Consideration:** Standard deontic logic accepts agglomeration. If dilemmas exist, agglomeration often leads to contradiction (I ought to do A and B, but I cannot do A and B, therefore I ought to do the impossible).
  *   **Status:** **Tension Point.**
  *   **Why:** To save dilemmas, you usually have to reject agglomeration. To save standard logic, you usually have to reject dilemmas.

  **5. "Ought Implies Can"**
  *   **Requirement:** The theory must address whether an agent can be under an obligation to do something they cannot do.
  *   **Consideration:** If I cannot save both children, can I really have an obligation to save *both*?
  *   **Status:** **Tension Point.**
  *   **Why:** Most dilemma theories must weaken this principle (e.g., "Ought implies Can" applies to individual acts, but not conjunctive acts) or argue that the obligation remains even when the act is impossible (as a source of residue).

  ---

  ### III. Phenomenological & Case Adequacy (The Experience)
  *These requirements ensure the theory matches our lived moral experience.*

  **6. Moral Residue (The Phenomenology of Regret)**
  *   **Requirement:** The theory must account for why agents feel appropriate guilt, remorse, or a need for reparation *even after* choosing the "best" available option.
  *   **Consideration:** If I choose the lesser evil, why do I still feel I have stained my hands? A theory that says "You did the right thing, move on" fails to capture the tragic remainder.
  *   **Status:** **Non-Negotiable.**
  *   **Why:** This is the primary data point of the dilemma experience. If the theory cannot explain the lingering guilt, it is descriptively inadequate.

  **7. Paradigmatic Case Coverage**
  *   **Requirement:** The theory must provide a coherent analysis of *Sophie's Choice* (symmetric conflict of equal duties) and *Sartre's Student* (asymmetric conflict of personal vs. public duty).
  *   **Consideration:** Some theories handle symmetric ties but fail when one duty seems "weightier" than the other.
  *   **Status:** **Preference (Camp Dependent).**
  *   **Why:** Some theorists argue symmetric dilemmas are the only "pure" ones; others argue asymmetric ones are more common. A theory favoring one over the other isn't necessarily wrong, just specific.

  ---

  ### IV. Tensions and Incompatibilities
  *Pairs of requirements that are notoriously difficult to satisfy simultaneously.*

  **1. Logical Consistency vs. Phenomenological Accuracy**
  *   **The Conflict:** You can preserve standard deontic logic (Agglomeration + Ought Implies Can) OR you can preserve the phenomenology of the dilemma (Residue + No-Good-Option). It is extremely difficult to do both.
  *   **The Trade-off:** Theories that keep logic intact usually deny genuine dilemmas (Impossibility Theories). Theories that accept genuine dilemmas usually require non-standard logic (Dialetheism or Pluralism).
  *   **Verdict:** You must decide which is more important to you: a clean logical system or a faithful description of moral experience.

  **2. Objective Rightness vs. Agent Regret**
  *   **The Conflict:** If there is an objective "all-things-considered" right action (even in a dilemma), why is regret appropriate? If there *isn't* an objective right action, how do we guide action?
  *   **The Trade-off:** Theories that posit an objective right action struggle to justify guilt. Theories that deny an objective right action struggle to offer action-guidance.
  *   **Verdict:** This is the central battleground between **Specificationists** (there is always a right answer) and **Pluralists** (values are incommensurable).

  ---

  ### V. The "Missed the Point" Indicator

  If a theory fails one requirement above, which failure indicates it has fundamentally misunderstood the assignment?

  **The Fatal Flaw: Collapsing the Ontological/Epistemic Distinction (Requirement #1)**

  *   **Why:** If a theory claims to account for *genuine* moral dilemmas but ultimately argues that every apparent dilemma is just a result of the agent's ignorance or lack of computational power, it has not analyzed dilemmas. It has analyzed **uncertainty**.
  *   **The Consequence:** This move renders the concept of "tragedy" incoherent. Tragedy requires that the conflict exists in the world, not just in the mind. A theory that makes all dilemmas epistemic turns moral life into a math problem that we just haven't solved yet. It denies the possibility of moral tragedy, which is the very phenomenon you are investigating.

  ### Summary Checklist for Reading

  When reading a text, ask:
  1.  **Does it deny dilemmas exist?** (If yes, it's an Impossibility Theory, not a Dilemma Theory).
  2.  **Does it explain why I feel guilty after doing the "right" thing?** (If no, it lacks phenomenological adequacy).
  3.  **Does it let the agent off the hook for blame while admitting they did wrong?** (If no, it is overly punitive; if yes, it risks moral relativism).
  4.  **Does it sacrifice Logic to save Experience, or Experience to save Logic?** (Locate their priority).

  **Non-Negotiables:** Ontological/Epistemic distinction, Wrong/Blame distinction, Moral Residue.
  **Camp Preferences:** Symmetric vs. Asymmetric focus, Rejection vs. Acceptance of Agglomeration.
  **Fatal Flaw:** Reducing ontological conflict to epistemic confusion.
