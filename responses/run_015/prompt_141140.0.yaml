answer: |-
  **MUNICIPAL COUNCIL | DRAFT BYELAW 44-B | CONSULTATION DOCUMENT**

  **DRAFT VISITOR CONDUCT AND NORMATIVE ALIGNMENT BYELAW**

  1.  **General Duty of Conformity:** Any person classified as a Visitor must adhere to local conventional practices regarding public order, resource distribution, and social exchange.
  2.  **Specified Conventions:** Compliance includes, but is not limited to: forming linear queues irrespective of service speed; adhering to pedestrian signal phases regardless of vehicular presence; and providing discretionary gratuities where service labor is subsidised by such payments.
  3.  **Doctrine of Substituted Compliance:** A Visitor may discharge obligations under Clause 2 by performing an equivalent conventional act from their jurisdiction of origin, provided the social function remains identical.
  4.  **Prohibition on Non-Participation:** A Visitor cannot waive obligations under Clause 1 by declining to utilise the service or space governed by the convention.
  5.  **Jurisdiction and Applicability:** This Byelaw applies to all non-residents present within the municipal boundary. Residency status is determined by intent to remain rather than temporal duration.

  **EXPLANATORY MEMORANDUM**

  **1. Rationale for Normative Alignment**
  Local conventions are arbitrary solutions to recurring coordination problems. There is no intrinsic moral weight to standing in a line rather than a cluster, nor to crossing at a specific gradient. The moral obligation arises solely from the need to match the expectations of others to prevent systemic friction. Visitors are bound not because the local method is superior, but because deviation introduces uncertainty into the coordination equilibrium.

  **2. Signal Integrity and Pedestrian Conduct**
  Regarding Clause 2, adherence to pedestrian signals is required even when the crossing is empty. While rigid adherence by an obedient tourist at an empty crossing can itself cause coordination failure by halting flow unnecessarily, the Council prioritises the preservation of the signal's authority. Predictability is valued over efficiency; a visitor who assesses the road independently undermines the collective reliance on the signal mechanism.

  **3. Gratuities and Wage Structures**
  The obligation to tip is not rooted in the convention itself but in the underlying wage structure. Where tips function as a wage subsidy, the non-tipper's wrong is effectively a theft of labor value disguised as a breach of etiquette. The Byelaw treats the convention as the enforcement mechanism for the economic obligation. Therefore, the act is mandatory regardless of service quality.

  **4. Closure of Opt-Out Loopholes**
  Previous drafts allowed Visitors to waive obligations by declining to participate (e.g., leaving a queue upon seeing its length). This created a class of actors who benefited from the order maintained by others without incurring the cost of waiting. Clause 4 closes this loophole. Presence within the vicinity of the convention constitutes acceptance of its terms. To concede that a Visitor owes nothing because they took no benefit would undermine the universal applicability required for coordination stability.

  **5. Functional Equivalence and Substituted Compliance**
  Clause 3 introduces Substituted Compliance to accommodate cultural variance. If a bow or a handshake can discharge the debt of a local greeting, then the specific local convention was never the binding element; rather, the obligation was merely to demonstrate deference. However, if the specific act is required, equivalence is impossible. The Council accepts functional equivalence to reduce friction, acknowledging that the binding force is the gesture of compliance rather than the gesture itself. This distinction ensures Visitors feel accommodated while maintaining the requirement to perform *some* ritual.

  **6. Definition of Visitor**
  Determining who counts as a Visitor remains complex. Temporal thresholds (three days versus three years) are arbitrary and difficult to enforce at the boundary. Similarly, distinguishing between a tourist, a delivery driver, and a new resident relies on subjective intent. Clause 5 therefore defines residency by intent to remain rather than temporal duration. This places the burden of proof on the individual to demonstrate they are not merely passing through. While this creates ambiguity regarding short-term contractors and transit passengers, it ensures the Council retains discretion to enforce norms wherever coordination problems arise.
