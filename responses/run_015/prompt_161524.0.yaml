answer: |-
  **To:** Vendor Risk Review Board
  **From:** Engineering
  **Date:** October 24, 2023
  **Subject:** Recommendation: Payment Pipeline Vendor Selection

  **Recommendation**
  Renew with **Corvus** for 12 months.

  Do not proceed with Bittern or Egret alone, and do not proceed with the 50/50 split at this time. The integration cost of the split ($60k one-time) outweighs the monthly savings ($1k) given a five-year payback period. More critically, Bittern's contract terms introduce unquantifiable counterparty risk that invalidates the mathematical hedge the split provides.

  **Financial and Operational Context**
  Corvus is $41k/month flat. The proposed Bittern/Egret split averages $40k/month but requires dual integration and doubles vendor management overhead. While the split neutralizes the uncertainty around traffic routing ($p$), it does not neutralize vendor performance risk or contract discretion.

  **The Board's Voting Pattern**
  In the straw poll, six members ranked both Bittern and Egret below Corvus. On a spreadsheet, this looks inconsistent: Egret is cheap when Bittern is expensive, and vice versa. If we were simply weighing outcomes, we should prefer one or the other based on our best guess of $p$.

  However, this pattern is not a math error. It is rational if we treat uncertainty as a cost in itself.
  *   **For this to be a mistake:** We would have to assume $p$ is stable or knowable, and that variable pricing carries no administrative burden. If traffic ratios are predictable, rejecting both variable options leaves money on the table.
  *   **For this to be perfectly fine:** We must acknowledge that variable pricing requires ongoing audit, dispute resolution, and budget buffering. When the pricing model relies on a variable ($p$) we cannot measure internally without duplicating the vendor's work, we are outsourcing our budget control. The board is correctly penalizing the lack of visibility, not just the downside risk.

  **The Strongest Counter-Argument**
  The strongest case against this recommendation is that sticking with Corvus pays a "stupidity tax" for our inability to model traffic. The 50/50 split removes the unknown about $p$ entirely. If we execute the split, the variable cost becomes flat ($30k) regardless of traffic shifts. The argument is that we should pay the $60k integration fee to buy immunity from traffic volatility.

  Furthermore, the primary risk in Bittern's contract—their ability to adjust the surcharge rate after 30 days—is a drafting problem, not a portfolio problem. We could theoretically fix this by demanding a fixed rate clause. If we fix the clause and execute the split, we achieve Corvus-level stability at a lower lifetime cost. By recommending Corvus without forcing that contract fix, we may be accepting higher long-term costs to avoid short-term integration work.

  **Conditions to Flip Recommendation**
  I will move to support the Split or Bittern alone only if the following are resolved before the contract window closes:

  1.  **Bittern Rate Clause:** Legal must remove the clause allowing Bittern to adjust the surcharge rate (0.0011–0.0019) after signing. The rate must be fixed for the contract term. Without this, the split hedge fails.
  2.  **Integration Cost:** Engineering must confirm the $60k one-time integration cost can be reduced by 50% via scoped implementation. At full cost, the payback period exceeds our vendor refresh cycle.
  3.  **Traffic Measurement:** Ops must confirm we can independently verify $p$ without building duplicate infrastructure. If we cannot audit the surcharge internally, we cannot accept variable pricing.

  **Next Steps**
  Legal to initiate renewal with Corvus immediately. Procurement to note the Bittern rate clause as a blocker for future consideration.
