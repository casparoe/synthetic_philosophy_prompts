      *(Self-Correction during drafting)*: Make sure to explicitly answer "Does (3) survive... without collapsing into hidden essentialism?" Yes, it does, provided suffering is treated as a state, not an essence of the kind.

      *(Self-Correction on Revision)*: Which is least costly to revise? Revising (2) is easier than revising (5). (5) appeals to empirical evolutionary psych. (2) is a philosophical categorization. Narrowing the scope of (2) is less costly than denying evolutionary anchoring.

