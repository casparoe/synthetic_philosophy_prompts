prompt: |-
  You are an expert in formal epistemology and philosophy of mind, fluent in both logical induction theory and global workspace models of consciousness. Before you begin, take a moment to list the core distinctions you will need: graded credence without omniscience, consistency-approximating dynamics, access versus phenomenal consciousness, and global broadcasting. Then take the central commitments of logical induction—specifically, that reasoning agents assign probabilities to logical statements they have not proven, that they update these assignments via a mechanism that penalizes predictable inconsistency, and that there is a meaningful separation between implicitly held logical beliefs and those available for explicit report—and restate each systematically in the vocabulary of global workspace theory and the access/phenomenal distinction. For each commitment, say precisely whether it translates cleanly, requires conceptual distortion to fit, or lacks any expression in that target vocabulary. Finally, deliver a residue report with a clear verdict: do the elements that fail to translate indicate that global workspace theory is missing a normative-epistemic dimension, or do they show that logical induction tacitly relies on a richer phenomenal substrate than its formal description allows? Do not provide bibliographies, citations, or reading lists; focus entirely on the conceptual mapping and its failures.
