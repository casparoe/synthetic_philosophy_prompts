  7.  **Final Polish:** Check the flow. Ensure the transition from "what they are" to "how they end" is clear, as that's the practical upshot for the user's "reform and dissolution" concern. (The prompt asks for focus on the ontology, but the *motivation* is reform/dissolution). I will keep the focus on ontology but let the implications for dissolution drive the argument.

      *(Self-Correction)*: Wait, the prompt says "keep the exchange tightly focused on this specific axis—whether the construction of gender and race involves a kind of embodied inertia absent in monetary kinds, and whether that inertia is institutional or material in nature." I should minimize the "reform" talk and keep it ontological, using reform only as a test case for the ontology.

