      *   No citations? Yes.

      *Let's write.*
answer: |-
  **A:** Let's press the revocation test. If the Federal Reserve and the global banking consortium announced tomorrow that the dollar was void, and everyone believed it, the dollar ceases to exist. Its deontic powers evaporate because they are exhausted by that collective acceptance. You agree?

  **B:** I do. Money is a paradigmatic institutional kind. Its existence conditions are synchronous with the attitude of the relevant population.

  **A:** Good. Now apply that to race. If we collectively revoked the schemas of racial classification—if every institution ceased to categorize by race, and every individual stopped using racial markers in interaction—does race vanish in the same way? I argue no. Not immediately, and perhaps not ever in the same sense. This is where my "embodied feedback loops" do the work. Racial and gendered classifications don't just assign status; they regulate cortisol levels, posture, spatial mobility, and exposure to toxins. These physiological and behavioral patterns acquire an inertia. Even if the institutional rule is revoked, the somatic reality persists.

  **B:** But you're conflating the *effects* of the kind with the *ontology* of the kind. Yes, racism causes hypertension. But if the classification system is dismantled, the hypertension remains as a medical fact, not a racial fact. The *kind* "Black" or "Woman" depends on the social schema to be intelligible as such. Without the schema, you just have a population with high blood pressure. So, in the relevant ontological sense, the kind *does* vanish. Your "feedback loops" are just lagging indicators. They are institutional effects with a long half-life, not a different ontological category.

  **A:** That's the crux. You're assuming the institution is the *source* of the inertia. I'm suggesting that once the feedback loop is closed, the inertia becomes partially autonomous. Consider habitus. If I have been socialized to occupy less physical space, to anticipate violence in certain neighborhoods, that disposition operates pre-reflectively. It doesn't require my continuous "uptake" of an institutional rule in the way holding a twenty-dollar bill does. The institution writes itself onto the nervous system. So, when you say these are just "lagging indicators," you're treating the body as a passive recipient. I'm saying the body becomes a co-constitutor of the kind. The feedback loop sustains the reality of the kind even if the original institutional authorization is withdrawn.

  **B:** But *why* does the body react that way? It reacts because the material threats are still in place. You're describing the phenomenology of the inertia, but I'm describing the causal architecture. Let's look at housing. Racial segregation isn't just a schema in the head; it's a historical trajectory of property lines, zoning laws, and capital investment. Even if everyone woke up tomorrow believing in colorblindness, the wealth gap produced by three centuries of extraction doesn't dissolve. The causal power of race is anchored in that material distribution.

  **A:** But those property lines are themselves institutional facts. A deed is paper backed by state violence and collective recognition. You're trying to ground the ontology of race in "material history," but that history is just a sedimentation of previous institutional acts. You haven't escaped the institutional circle; you've just pushed the timeline back.

  **B:** I haven't pushed the timeline back; I've changed the substrate. A deed is institutional, yes. But the *consequence* of the deed—the lead paint in the walls, the distance from the grocery store, the intergenerational wealth transfer—those are material constraints that operate causally regardless of current belief. This is my objection to your "Modal Institutionalism." You treat race like money: something that exists because we agree it exists. I'm saying race exists because there is a causal machinery of labor and reproduction that grinds on regardless of agreement. If you call that machinery "socially constructed" in the same sense as money, you obscure the fact that you cannot simply *revoke* it. You have to dismantle a physical apparatus.

  **A:** I agree you can't simply revoke it. That's my point about the feedback loops! But you characterize that apparatus as "material" in a way that suggests it stands outside the social. I deny that. The lead paint is only a racialized hazard because of the social schema that put it there and keeps it there. My claim is that the "embodied feedback" is the mechanism by which the social becomes stubborn. You want to say the stubbornness comes from the *matter* itself. I say it comes from the *depth of the inscription*.

  **B:** "Inscription" is a metaphor that does too much heavy lifting. If I am stopped by a police officer because of the color of my skin, the causal trigger is the visual perception of pigment, which is linked to a historical probability of threat assessment. That probability isn't a "schema" in the moment of the stop; it's a statistical reality born of historical policing patterns. My worry is that your view makes race too dependent on current cognitive uptake. If the "feedback loop" is embodied, does it require the subject to *know* they are racialized to sustain the kind?

  **A:** No. That's why I distinguish the loop from the rule. The rule requires uptake; the loop requires only the physiological response to the environment. But here is my challenge to you: You say these material trajectories anchor the kind. But how do you identify *which* material trajectories count as racial without relying on the very institutional schemas you claim are secondary? Why is the wealth gap a *racial* causal pattern and not just an economic one? You need the social category to pick out the material anchor. So the material anchor isn't doing the ontological work; the framing is.

  **B:** That's a fair epistemic point, but it doesn't settle the ontology. We can identify the category historically. We know *why* the wealth gap is racialized: because of chattel slavery and Jim Crow. Those are historical events, not current beliefs. The anchor is the historical trajectory itself. Money has no history in that sense; it has no necessary trajectory. A dollar bill could have been a euro. But race is path-dependent. You can't have race without the specific history of grouping and subordination. So, when you say race and money are unified as "institutional kinds," you are erasing the path-dependence that makes race resistant to dissolution.

  **A:** I'm not erasing the path-dependence. I'm locating it differently. For you, the path is a material track laid down in history. For me, the path is a somatic channeling of behavior that reproduces the institution. The resistance to dissolution comes from the fact that the institution has become a habit. But if it's a habit, it is still, in principle, mutable through re-training, through new schemas. If you are right, and it's anchored in material history, then reform requires physical redistribution primarily. If I am right, it requires somatic and schematic re-engineering.

  **B:** And that is where the danger lies. If you think the inertia is primarily "embodied feedback," you might think changing the culture or the psychology is sufficient. But if the inertia is "material anchoring," then cultural change is impotent against the structural gravity. My realism is meant to protect against the idea that we can think our way out of race. Your institutionalism, even with the feedback loops, still treats the body as a site of *meaning*. I treat it as a site of *force*.

  **A:** But force only becomes social force when it is recognized as such. A punch is just physics until it is assault. A border is just a line until it is a boundary. You keep trying to find a non-social base for the social kind. You want the "material" to do the work of holding the kind together when the "belief" fades. But if the material resources weren't socially valued, the history of their extraction wouldn't matter.

  **B:** I'm not looking for a non-social base. I'm looking for a non-voluntarist mechanism. Your view implies that if we could just coordinate our attitudes differently, the inertia would eventually decay. My view is that the causal patterns of race have achieved a level of autonomy from our attitudes. They are social in origin, but they are objective in operation. Like climate change. We constructed the carbon emissions, but the warming is not "constructed" in the sense that it will stop if we change our minds. Race, like carbon, has entered the causal fabric of the world in a way that transcends the institutional rules that spawned it.

  **A:** That's a powerful analogy. But climate change affects everyone physically, regardless of whether they believe in it. Does race? If I pass as white, do I suffer the racialized causal impact?

  **B:** You might avoid the interaction, but you don't escape the structure. The wealth you inherited, the neighborhood you live in, the air you breathe—those are determined by the historical trajectory, not your current performance.

  **A:** But those are class effects mediated by race.

  **B:** Exactly. They are mediated, which means the material anchor is primary. The mediation is the mechanism, but the anchor is the history of distribution.

  **A:** I see. So for you, the "construction" is in the origin, but the "reality" is in the causal durability. For me, the "construction" is in the ongoing maintenance, and the "durability" is in the depth of the embodiment.

  **B:** Precisely. And that difference dictates the dissolution strategy. If I'm right, you can't just change the schema. You have to break the chain of material causation.

  **A:** And if I'm right, breaking the chain requires interrupting the feedback loop, which means the schema *is* the material, because the schema is what organizes the biology. We might be describing the same prison, but you're looking at the bars, and I'm looking at the lock.

  **B:** As long as we agree the door doesn't open just because we decide it should.

  **A:** Agreed. But I still maintain that the lock is made of the same stuff as the key. You think the lock is made of iron.

  **B:** And I think the iron is real, even if we forged it.
