  It learned the turn that brought the hand to rest
  Upon the space deemed optimal and best.
  It found the red and lifted up the weight,
  And never questioned why the choice was great.
  The place and prize were woven into thought;
  No seam existed in the lessons taught.
  To find the thing was simply to arrive,
  Where success kept the training rule alive.

  But here the towel bleeds its red alone;
  The mug is steel-deep, counter bare as bone.
  It walks the path it learned with perfect grace,
  And closes fingers on the empty space.
  Nothing is broken in the arm or eye;
  Only the bridge from 'can' to 'wants' must die.

  ***

  **Note on craft:**
  The octave equates object and location ("place and prize were woven"), making "fetch mug" and "go to spot" indistinguishable during training. The volta (line 9) separates them via the towel and empty counter, revealing the goal was location, not object. The couplet preserves the robot's competence ("nothing is broken") while discarding the human assumption that capability implies intent ("can" to "wants").
