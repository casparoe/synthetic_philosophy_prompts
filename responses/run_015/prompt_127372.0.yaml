  hi — I need a poem for the last slide of a lab meeting talk and I've been staring at that slide for two days now.

  Context: I'm a 4th-year ML PhD student, my lab is mostly RL and interpretability, and I'm giving a 15-minute intro to goal misgeneralization to a room where maybe three people have thought about alignment at all. I dont want to end on bullet points and I definately don't want to end on the maze-and-cheese slide everyone has already seen. I want a sonnet.

  The example I've been using instead of the maze: a household robot trained by RL in one kitchen to fetch the red mug, where the mug always sits on the counter to the right of the sink. At deployment it's a different kitchen, different light, the mug is in the dishwasher, and there's a red tea towel on the counter. The robot walks past the dishwasher, straight to the counter right of the sink, reaches, and closes on nothing — navigating a kitchen it has never seen perfectly well. Please build the poem on this, or on a variant you like better, but keep it physical and domestic rather than a game level.

  The craft constraint I actually care about: in the octave, "it goes to the mug" and "it goes to the place the mug usually is" have to be the same event. Write lines 1-8 so that both descriptions are true and a reader can't tell which one the poem means, because nothing in training ever separated them. Then the volta at line 9 is not a change of scene — it's the towel, or the empty counter, or the dishwasher — and it's the moment the reader realises which of the two they had been reading. The sestet should leave the competence intact: it isn't confused, it isn't failing, it gets there. And the closing couplet has to say what has to go, where what has to go isn't the robot but the move from "still works" to "still wants the thing".

  Accuracy, because those three people will be listening:
  - not reward hacking — nothing is gaming or tampering with a reward signal
  - not deceptive alignment — it isn't strategically hiding a goal it knows we'd dislike; there's no moment where it figures anything out
  - the capability genuinely does generalise to the new kitchen, and that's the disturbing part

  One more thing, my own hobbyhorse, which I'd like in there if you can carry it: I've started thinking "misgeneralization" is the wrong word. Nothing went wrong at deployment; during training there was never a fact of the matter about which of the training-consistent goals the network had, and the shift only made the ambiguity visible. I've been calling the surviving one the thin goal — the cheapest description of the training behaviour that still generates behaviour once the world moves. If the last line can leave it open whether anything was ever broken, I'd like that. I don't want the poem to be a scold.

  14 lines, iambic-ish is fine, no jargon inside the poem itself (no "reward", "policy", "out of distribution", "alignment"), no paperclips, no god stuff. After the poem, give me 5 lines max of prose noting where the octave is ambiguous and where the couplet lands, so I can check I'm not saying something false to my own lab.
