  # Part 2: The Handout (Decision Key)

  **Instructions:** Start at **Q1**. Follow the arrow corresponding to your commitment. Record the Leaf Code at the end. Do not worry about "schools" of thought; answer only what you believe happens in the lab.

  **Q1. Validity.** Is the distinction between 'micro-variables' and 'macro-laws' a feature of the material world, or is it a category error in our language?
  *   **A:** Feature of the world. → **Go to Q2**
  *   **B:** Category error / Ill-formed. → **Leaf 1 (Ill-formed)**

  **Q2. Case 4 (Computation).** Consider a macro-law derivable from micro-theory only by computation no agent could carry out, while a two-parameter phenomenological model predicts it to precision. Is the phenomenological model merely a shortcut?
  *   **A:** Yes, a computational shortcut for the micro-truth. → **Go to Q3**
  *   **B:** No, it captures causal relations the micro-description misses. → **Leaf 2 (Emergence as Unpredictability)**
  *   **C:** The micro-theory is irrelevant to the macro-truth. → **Go to Q5**

  **Q3. Case 1 (Rennert).** In a reaction–diffusion system where wavefront speed is invariant across wildly different micro-kinetics: Does this invariance indicate a macro-structure constraining the kinetics?
  *   **A:** No, it is just aggregate statistics averaging out. → **Leaf 3 (Deflationary)**
  *   **B:** Yes, the macro-law constrains the micro-kinetics. → **Go to Q6**
  *   **C:** It indicates the same law is realized by different micro-kinetics. → **Go to Q4**

  **Q4. Identity.** Are the macro-properties *ontologically identical* to the micro-configurations, even if the laws don't derive cleanly?
  *   **A:** Yes, they are the same thing. → **Leaf 4 (Identity without Derivation)**
  *   **B:** No, they are distinct properties. → **Leaf 6 (Non-reductive Physicalism)**

  **Q5. Case 3 (Boundary).** Derivation of the macro-law requires boundary conditions stated only in macro-vocabulary. Does this imply the micro-theory is causally incomplete?
  *   **A:** Yes, micro-theory is incomplete without macro-context. → **Go to Q7**
  *   **B:** No, micro-theory is complete; boundary data is just context. → **Leaf 8 (Autonomy via Interventions)**

  **Q6. Conflict (Revision).** When corrected micro and macro descriptions disagree (e.g., stress tensor vs. molecular dynamics), which description is revised to match the other?
  *   **A:** The Macro description is revised. → **Leaf 5 (Derivational Reduction)**
  *   **B:** The Micro description is revised. → **Leaf 9 (Downward Influence)**
  *   **C:** Both are revised to fit the instrument data. → **Leaf 10 (Pragmatic Pluralism)**

  **Q7. Case 2 (History).** Compare a macro-quantity fixed by lab practice before micro-theory existed vs. one engineered from micro-variables. Does the historical priority grant the former ontological independence?
  *   **A:** Yes, history grants independence. → **Leaf 7 (Historical Realism)**
  *   **B:** No, both have equal status. → **Leaf 6 (Non-reductive Physicalism)**

  ***

  ### Leaf Legend (For Convener Use Only)
  *   **Leaf 1:** The question is ill-formed.
  *   **Leaf 2:** Emergence as nothing more than unpredictability in practice.
  *   **Leaf 3:** Deflationary view (macro = convenient redescription).
  *   **Leaf 4:** Identity without derivation.
  *   **Leaf 5:** Derivational reduction via bridge laws.
  *   **Leaf 6:** Non-reductive physicalism with multiple realizability.
  *   **Leaf 7:** Historical Realism (Epistemic order does ontological work).
  *   **Leaf 8:** Autonomy understood as relative to a class of interventions.
  *   **Leaf 9:** Irreducibility with genuine downward influence.
  *   **Leaf 10:** Pragmatic Pluralism (Data decides).

  ### Tie-Breaker Section
  **If you landed on Leaf 6 (Non-reductive Physicalism) but feel unsure:**
  Ask yourself: *Why* is the reduction non-reductive?
  *   If because *different micro-systems produce the same macro-law* (like the Rennert case), you are strictly **Non-reductive Physicalism (MR)**.
  *   If because *you can manipulate the macro-variable without knowing the micro-state*, you are **Autonomy (Interventions)** (Leaf 8).
  *   *Action:* If you chose Leaf 6 but prioritize control over realization, move to Leaf 8.

  **If you landed on Leaf 5 (Reduction) but feel uneasy about Q6:**
  Ask yourself: *Does the micro-theory always win?*
  *   If yes, stay at **Leaf 5**.
  *   If no, and you trust the rheometer over the simulation, move to **Leaf 10 (Pragmatic Pluralism)**.
