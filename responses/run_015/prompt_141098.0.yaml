prompt: |-
  I'm in the second year of a PhD in modern European history, and I've been asked to give a short paper to my department's historiography reading group on counterfactual reasoning about the origins of the Third Reich. Before I write it, I'd like someone to audit the position I've ended up at, because I have the feeling it is one distinction short of being stable and I can't locate the gap. Here is the set, roughly in the order I argued myself into it. (1) Historical explanation answers contrastive questions of the form why this rather than that, so the question whether there would have been a Nazi Germany without Hitler isn't well posed until you say what the alternative was supposed to be. (2) Once the contrast is fixed at a coarse grain — some authoritarian, expansionist, violently antisemitic regime in Germany in the 1930s — I think the answer is that something of that kind arrives anyway: the Depression, the collapse of the centrist parties, the settlement after the First World War, and the existing habits of the civil service, the courts and the officer corps did the work. (3) At a finer grain I think Hitler is genuinely difference-making: for the form and the timing of the genocide — extermination camps rather than the deportation-and-resettlement schemes that were the live alternatives earlier on — the individual matters, and the structural story does not settle it. (4) I want causation here to be plain difference-making: a factor mattered if, had it not occurred and had something drawn from the pool of candidates the situation actually made available occurred instead, the outcome would have been different. I call these supply-side counterfactuals, to set them apart from ones that simply delete the person from the record. (5) I reject great-man explanation as a general theory of history on the ground that it has no generalising or predictive power — nobody can say in advance which individuals will turn out to be world-historical, so it sorts things out only after the fact and explains nothing. I don't think my structural story in (2) is vulnerable to the same objection, since it cites conditions of a kind that recurs across cases. (6) But I also want to say that we can identify world-historical individuals after the fact, and that whether such a person was decisive is an objective matter, not just a question of which story is more gripping. (7) I hold a robustness principle: where a structure makes an outcome robust, in the sense that many distinct available role-fillers would each have produced it, the causal credit owed to any one of them shrinks; where the structure has a single point of failure, credit grows. (8) And I hold that a counterfactual whose antecedent does its own work — remove Hitler and install a competent moderate chancellor in his place — is no test of Hitler's causal role at all, because it tests a compound rather than a factor. Finally, a case verdict I'm attached to: Hindenburg's appointment of Hitler as chancellor in early 1933 was not by itself the difference between a Nazi regime and no Nazi regime, because had he held out the process would have reached something very similar by another route within a couple of years.

  What I want is an audit rather than a survey of the literature, which I've read: go through this set and tell me which pairs are actually in tension and which only look like it, because I'd rather you discriminate than flag all eight as problematic. Where there is a real conflict, say what would have to be given up, what the cheapest repair is, and what that repair costs me elsewhere in the set — in particular, I want to know whether the split in (3) between a coarse grain that the structure determines and a fine grain that the individual determines is a principled distinction, or a way of assigning each level whichever answer I already wanted, and whether (7) and (8) leave any room at all for the supply-side counterfactual that (4) requires. Rank the tensions by severity instead of listing them as equally serious, and finish by naming the single revision that would clean up the most.
reasoning: |-
  Here's a thinking process that leads to the audit:

  1.  **Analyze the User and Request:**
      *   **User:** 2nd-year PhD in Modern European History.
      *   **Task:** Audit a specific set of 8 propositions/positions regarding counterfactual reasoning about the origins of the Third Reich.
      *   **Goal:** Identify tensions/conflicts within the set, distinguish real conflicts from apparent ones, rank them by severity, propose repairs (costs/benefits), and identify the single most effective revision.
      *   **Constraint:** Do *not* survey the literature (user knows it). Focus on internal coherence.
      *   **Tone:** Academic, rigorous, critical but constructive (peer-to-peer).

  2.  **Deconstruct the 8 Propositions:**
      *   (1) *Contrastive Explanation:* Explanation requires a specific contrast class ("why X rather than Y?"). "No Hitler?" is ill-posed without specifying the alternative.
      *   (2) *Coarse Grain Structuralism:* At a high level (authoritarian, antisemitic regime), structure determines the outcome (Depression, Versailles, elites, etc.). Hitler isn't necessary for *this* outcome.
      *   (3) *Fine Grain Individualism:* At a specific level (genocide form/timing), Hitler *is* difference-making. Structure doesn't settle the *how* and *when* of the Holocaust.
      *   (4) *Causation Definition:* Plain difference-making via "supply-side counterfactuals" (replace agent with available alternative, not just delete).
      *   (5) *Anti-Great-Man:* Great Man theory is bad because it lacks predictive power/generalizability. Structural stories are better because they cite recurrent conditions.
      *   (6) *Post-Hoc Objectivity:* We *can* identify world-historical individuals after the fact. Their decisiveness is objective, not narrative preference.
      *   (7) *Robustness Principle:* Causal credit shrinks if many alternatives yield the same outcome (robust); grows if single point of failure.
      *   (8) *Compound Antecedents:* Don't test Hitler by replacing him with a "competent moderate." That tests a compound (No Hitler + Moderate).
      *   (Case Verdict) *1933 Appointment:* Hindenburg appointing Hitler wasn't the difference between Nazi/No-Nazi. Similar regime would have arrived soon anyway.

  3.  **Initial Scan for Tensions:**
      *   (2) vs. (3): Coarse vs. Fine grain. Is this a principled distinction or ad hoc?
      *   (4) vs. (8): Supply-side counterfactuals vs. rejecting "competent moderate" replacement. If I can't put in a moderate, who do I put in? If I put in the *available* alternative (e.g., Schleicher or Papen), does that align with (2)?
      *   (5) vs. (6): Great Man has no predictive power (5) vs. We can identify decisiveness objectively after the fact (6). This seems compatible (prediction vs. explanation), but needs checking.
      *   (7) vs. (2)/(3): Robustness says credit shrinks if outcome is robust. (2) says outcome is robust (structure determines it). (3) says Hitler matters for specific features. Does (7) undermine (3)? If the *regime* is robust, does Hitler get credit for the *genocide* if the regime was going to happen anyway?
      *   (4) vs. (7): Supply-side requires replacing with *available* candidates. Robustness depends on the *pool* of available candidates. These seem aligned, but (8) restricts the pool.
      *   (Case Verdict) vs. (3): Verdict says "Nazi regime anyway." (3) says "Genocide form/timing depends on Hitler." If the regime is the same, is the genocide part of the "regime" definition in (2)?

  4.  **Deep Dive into Specific Tensions:**

      *   **Tension A: The Coarse/Fine Grain Split (2) & (3) vs. Robustness (7).**
          *   *Issue:* (2) claims the *regime type* is robust (structural). (7) says if robust, causal credit shrinks. (3) claims Hitler gets credit for the *genocide specifics*.
          *   *Conflict:* If the regime (including its antisemitism) is robustly determined by structure (2), how does Hitler get significant causal credit for the *culmination* of that antisemitism (genocide) in (3)? If the structure produces "violently antisemitic regime," does it not also produce the *logic* of the genocide?
          *   *Severity:* High. This is the core of the argument. If the structure guarantees the *kind* of regime, does it guarantee the *extremity*?
          *   *Principled?* It risks being ad hoc ("Structure explains the stuff I think was inevitable, Agency explains the stuff I think was contingent"). Needs a criterion for where the grain splits.

      *   **Tension B: Supply-Side (4) vs. Compound Rejection (8) vs. Case Verdict.**
          *   *Issue:* (4) says replace with *available* candidates. (8) says don't replace with "competent moderate." The Case Verdict says "someone similar would have arrived within a couple of years."
          *   *Conflict:* Who are the "available candidates" in 1933? Schleicher? Papen? Hugenberg? If (2) is right (structure pushes toward authoritarian/antisemitic), then the *available* pool is *not* moderates. So (8) is actually consistent with (2) & (4).
          *   *Wait, check (8) again:* (8) rejects "competent moderate" because it tests a compound. This implies the *actual* available pool did not contain competent moderates capable of stabilizing the republic. This aligns with (2).
          *   *Potential Conflict:* If the available pool (Schleicher/Papen) would have produced a "very similar" regime (Case Verdict), then by (7) (Robustness), Hitler's credit shrinks. But (3) says Hitler matters for the genocide.
          *   *Refinement:* The tension is between the *Regime* outcome (robust) and the *Genocide* outcome (contingent). If the Regime is the cause of the Genocide, and the Regime is robust, is the Genocide robust?
          *   *Severity:* Medium-High. It hinges on causal chains.

      *   **Tension C: Anti-Predictive (5) vs. Post-Hoc Objectivity (6).**
          *   *Issue:* (5) rejects Great Man because it can't predict. (6) says we can objectively identify decisiveness *after the fact*.
          *   *Analysis:* This is actually a standard philosophical distinction (prediction vs. retrodiction). Not a real tension, provided (6) doesn't sneak in predictive claims.
          *   *Severity:* Low.

      *   **Tension D: Supply-Side (4) vs. Robustness (7).**
          *   *Issue:* (4) defines causation via supply-side counterfactuals. (7) modulates credit based on the size of the supply pool.
          *   *Analysis:* These are complementary. (4) sets the test, (7) interprets the result.
          *   *Severity:* Low.

      *   **Tension E: The "Available Pool" Definition (4) & (8) vs. (2).**
          *   *Issue:* (2) says structure does the work. (4) says look at the pool of candidates the situation *actually made available*.
          *   *Conflict:* If structure determines the outcome, does it also determine the pool? Yes. But if the pool is restricted to authoritarians (per 2), then replacing Hitler with Schleicher (per 4/8) yields a similar outcome (per Verdict). This supports (7) -> Low credit for Hitler on the *Regime*. But (3) wants High credit for Hitler on *Genocide*.
          *   *The Gap:* How does the *same* structural pool produce a *different* genocide outcome with a different agent? If Schleicher enters the pool, does he produce the Holocaust? (2) says "violently antisemitic regime." (3) says "extermination camps... individual matters."
          *   *Severity:* High. This is the "distinction short of being stable" the user feels.

  5.  **Synthesizing the Audit:**

      *   **Core Instability:** The relationship between the "Coarse Grain" (Regime Type) and "Fine Grain" (Genocide Modality).
      *   **Why?** If the structure makes the regime robust (2 & 7), and the regime is the primary cause of the genocide, then the genocide should also be robust. To save (3), the user needs to argue that the *specific mechanism* of genocide is not determined by the regime type but by the leader. But if the regime is "violently antisemitic" (2), isn't the leap to extermination a structural logic (cumulative radicalization) rather than just Hitler's whim?
      *   **The (4)/(8) Constraint:** (4) demands we look at *available* alternatives. (8) forbids *unavailable* moderates. The available alternatives (Papen/Schleicher) are the ones cited in the Case Verdict as leading to a "very similar" regime. If the regime is similar, why is the genocide different?
      *   **The Fix:** The user needs to decouple the *existence* of the regime from the *operationalization* of its violence more sharply. Or, acknowledge that "Nazi Regime" in (2) is too broad if it swallows the specific causal mechanisms of the Holocaust.

  6.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the sophistication. Validate the "one distinction short" feeling.
      *   **Ranking Tensions:**
          1.  **Severity 1 (Critical):** The Coarse/Fine Grain Split (2 & 3) vs. Robustness (7) & Supply-Side (4). *The "Causal Drain" Problem.* If structure makes the regime robust, does it drain credit from the specific atrocities?
          2.  **Severity 2 (Significant):** Supply-Side Definition (4) vs. The "Available Pool" in the Verdict. *The "Who Counts?" Problem.* If the pool is restricted to authoritarians (per 2), does the supply-side test actually isolate Hitler?
          3.  **Severity 3 (Minor):** Prediction (5) vs. Objectivity (6). *The "Retrodiction" Problem.* (Mostly resolvable).
      *   **Detailed Analysis of Severity 1:** Focus on whether "violently antisemitic regime" (2) causally entails "extermination camps" (3). If yes, (3) fails. If no, why not? The user needs a theory of *contingent radicalization*.
      *   **Detailed Analysis of Severity 2:** (8) bans moderates. (4) demands available alternatives. The Verdict says available alternatives = similar regime. (7) says similar regime = low credit. But (3) says high credit for genocide. The math doesn't hold.
      *   **The Single Revision:** Refine the *Contrast Class* in (1). The problem isn't the grain, it's the *outcome variable*. Don't split Regime vs. Genocide. Split *Seizure of Power* vs. *Policy Radicalization*.
      *   **Cost of Repair:** Admitting that "Nazi Germany" is not a single outcome variable but a sequence of distinct causal nodes.

  7.  **Refining the "Single Revision":**
      *   Current: Split by grain (Coarse=Structure, Fine=Agent).
      *   Problem: Structure swallows Agent if the coarse outcome causes the fine outcome.
      *   Revision: Split by *Causal Phase*. Phase 1 (Access to Power): Robust/Structural (Hitler not necessary). Phase 2 (Radicalization/Genocide): Contingent/Agential (Hitler necessary).
      *   Why this helps: It avoids the "Regime causes Genocide" trap. It allows the Regime to be structurally determined *without* the Genocide being structurally determined, provided the Regime *type* (Authoritarian) doesn't logically entail the Genocide *method* (Industrial Extermination).
      *   Wait, the user already does this in (3). Why is it unstable? Because of (7). If Phase 1 is robust, the *agents* selected in Phase 1 have reduced credit. If Hitler is just the Phase 1 agent, his credit is reduced. But he is also the Phase 2 agent.
      *   The real fix: **Modify (7) Robustness.** Robustness applies to the *specific outcome variable*. If the outcome variable changes (Regime vs. Genocide), the Robustness calculation resets. The user implies this but (2) defines the outcome as "Nazi Germany" loosely.
      *   Better Revision: **Tighten (1) and (4).** The "Supply-Side" must be specific to the *outcome variable*. For the Genocide outcome, the supply-side pool is *not* Papen/Schleicher (they couldn't/wouldn't do the Holocaust). The pool is *Nazi leadership*. Was Hitler replaceable *within the Nazi leadership* by Goering/Heinrich? That's the real supply-side test for (3).
      *   *Decision:* The single best revision is to restrict the **Supply-Side Pool (4)** relative to the **Outcome Variable (1/3)**. For the Genocide question, the "available candidates" cannot be non-Nazi conservatives (Schleicher), because they are not candidates for *producing the Genocide*. They are candidates for *producing the Regime*.
      *   *Correction:* Actually, the user's feeling of instability comes from (7). If the Regime is robust, Hitler's credit shrinks. But Hitler is the *same person* for Regime and Genocide. Does the credit shrink for *both*?
      *   *Best Revision:* **Decouple the Outcome Variables explicitly.** Don't say "Nazi Germany" is robust. Say "Authoritarian Conservative Regime" is robust. "Nazi Genocidal State" is contingent. This clarifies (2).
      *   *Wait, looking closer at (8) and (4).* (8) says don't test "No Hitler + Moderate". (4) says test "No Hitler + Available". The Verdict says "Available = Similar Regime". This forces (7) to reduce credit. But (3) wants high credit.
      *   *The Fix:* The "Available Pool" for the *Genocide* question is different from the *Regime* question. For the Regime, the pool is Papen/Schleicher. For the Genocide, the pool is Goering/Heydrich (or nobody). The user needs to make this explicit. The "Supply-Side" isn't fixed; it's relative to the contrast class.

      *   *Let's formulate the "Single Revision":* **Relativize the Supply-Side Pool (4) to the Contrast Class (1).** You cannot use the same counterfactual pool for the "Regime" question and the "Genocide" question. For the Regime, the pool is the Conservative Elite. For the Genocide, the pool is the Nazi Inner Circle. If you don't do this, (7) crushes (3).

  8.  **Final Polish:** Check tone. Ensure I'm not lecturing on historiography but auditing the logic. Ensure I address the "one distinction short" feeling. (The distinction is between *Outcome Variables*, not just *Grain*).

      *   *Self-Correction on "Grain":* The user thinks the distinction is Coarse vs. Fine Grain. I need to tell them that Grain isn't the problem; *Causal Independence* is. A coarse outcome can causally determine a fine outcome. If so, robustness transfers. The distinction needs to be between *Causal Chains*, not just descriptive resolution.

      *   *Revised Single Revision:* **Segment the Causal Chain.** Treat "Access to Power" and "Implementation of Genocide" as distinct causal nodes with distinct robustness profiles, rather than one "Coarse" and one "Fine" description of the same event.

      *   *Wait, one more thing:* (5) vs (6). (5) says Great Man has no predictive power. (6) says we can identify decisiveness after the fact. This is fine. But (5) says it "explains nothing." (6) says it's "objective." This is slightly tense. If it explains nothing, how is the decisiveness objective? Explanation *is* identifying causes. I should note this but rank it lower.

      *   *Focus on the big one:* The interaction of (2), (3), (4), (7), and the Verdict.
      *   (2) Regime = Robust (Structure).
      *   (Verdict) 1933 Appointment = Not decisive for Regime.
      *   (4) Test = Replace with Available (Schleicher).
      *   (7) Robustness = Low Credit for Hitler on Regime.
      *   (3) Genocide = Hitler Decisive.
      *   *Conflict:* If Hitler is low credit for Regime, but High credit for Genocide, and Regime is a precondition for Genocide... does the low credit transfer?
      *   *Resolution:* The "Available Pool" for the Genocide counterfactual *cannot* include Schleicher. It must include other Nazis. The user implies this in (3) but (4) defines the pool generally as "situation actually made available." The situation in 1933 made Schleicher available. The situation in 1941 (genocide decision) did not.
      *   *Audit Conclusion:* The definition of "Available Candidates" in (4) is too static. It needs to be time-sensitive and outcome-sensitive.

      *   *Okay, ready to write.*
answer: |-
  This is a sophisticated and largely coherent set of propositions. You are right to feel that it is one distinction short of stability. The architecture holds together well enough to function, but under load—specifically the load of your own Robustness Principle (7)—the connection between your structural claims (2) and your agential claims (3) threatens to shear off.

  Here is the audit of tensions, ranked by severity, followed by the specific repair required.

  ### 1. Critical Tension: The Robustness Transfer Problem
  **Conflicting Nodes:** (2) & (Case Verdict) vs. (3) & (7)
  **Severity:** High

  This is the instability you sensed. You argue in (2) and the Case Verdict that the *regime type* (authoritarian, antisemitic, expansionist) is structurally robust. By your Robustness Principle (7), this shrinks Hitler's causal credit for the regime's existence. However, in (3), you argue Hitler is decisive for the *genocide*.

  **The Conflict:** Causal credit does not necessarily reset between "Regime" and "Genocide." If the Regime is a causal precondition for the Genocide, and the Regime is robustly determined by structure (low agential credit), there is a risk that the *opportunity* for genocide is also structurally determined. If a Schleicher regime (your available alternative in the Verdict) would have been "very similar" (Verdict) and "violently antisemitic" (2), why does the Robustness Principle not drain credit from the specific *form* of that violence? If the structure guarantees a violently antisemitic regime, does it not also guarantee the *logic* that leads to extermination, leaving Hitler only with the credit for *timing*?

  **Why "Grain" isn't enough:** You frame the distinction in (2) and (3) as "Coarse Grain" vs. "Fine Grain." This is descriptive, not causal. A coarse outcome can causally determine a fine outcome (e.g., "War" determines "Battle"). If the structural conditions make a "violently antisemitic regime" robust, you need to explain why that robustness stops at the threshold of "industrial extermination." Currently, (3) looks like an assertion of contingency rather than a derived conclusion.

  **The Repair:** You must shift from a **Grain Distinction** to a **Causal Phase Distinction**.
  *   *Current:* Coarse (Regime) = Structure; Fine (Genocide) = Agent.
  *   *Revision:* Phase 1 (Access to Power) = Structurally Robust; Phase 2 (Radicalization Dynamics) = Agentially Contingent.
  *   *Cost:* You must explicitly argue that the *mechanism* of Phase 2 is not a automatic output of Phase 1. You need to commit to the view that "violent antisemitism" (2) is not a sufficient cause for "extermination camps" (3). This invites the functionalist challenge (that bureaucracy drove the radicalization), which you must be prepared to parry by insisting on the *decisional* nature of the Final Solution.

  ### 2. Significant Tension: The Static Supply-Side Pool
  **Conflicting Nodes:** (4) vs. (3) & (8)
  **Severity:** Medium-High

  In (4), you define causation via "supply-side counterfactuals" using candidates "the situation actually made available." In (8) and the Verdict, you identify these candidates as conservative elites (Schleicher/Papen type), ruling out "competent moderates." This works for the Regime question (2).

  **The Conflict:** This definition of the "available pool" breaks your Genocide argument (3). If the "situation" in 1933 makes Schleicher available, and you use that pool to test Hitler's causation, you get the Verdict (Regime happens anyway). But if you use that *same pool* to test the Genocide, the counterfactual fails: Schleicher does not build Auschwitz. To save (3), the "available pool" for the Genocide question *cannot* include Schleicher. It must be restricted to the Nazi leadership (Göring, Heydrich, etc.).

  **The Gap:** Your definition of "available candidates" in (4) is too static. It implies one pool for all historical questions about a period. But the pool of agents capable of producing *Outcome A* (Authoritarian Regime) is different from the pool capable of producing *Outcome B* (Industrial Genocide).

  **The Repair:** Relativize the **Supply-Side Pool (4)** to the **Contrast Class (1)**.
  *   *Revision:* Specify that the "pool of candidates" is relative to the *specific outcome variable* being tested. For the "Regime" variable, the pool is the Conservative Elite. For the "Genocide" variable, the pool is the Nazi Inner Circle.
  *   *Cost:* You lose the elegance of a single unified theory of counterfactuals for the period. You must defend why the "situation" restricts the pool differently for different outcomes. (This is defensible: the situation restricts *power access* broadly, but restricts *genocidal agency* narrowly).

  ### 3. Minor Tension: Prediction vs. Explanation
  **Conflicting Nodes:** (5) vs. (6)
  **Severity:** Low

  You reject Great Man theory in (5) because it lacks predictive power ("sorts things out only after the fact"). But in (6), you claim we can identify world-historical individuals "after the fact" and that this is "objective."

  **The Conflict:** This is a standard philosophical distinction (prediction vs. retrodiction), so it is not fatal. However, the phrasing in (5) that Great Man theory "explains nothing" is too strong given (6). If we can objectively identify decisiveness after the fact, that *is* a form of explanation (causal attribution), even if it lacks predictive utility.

  **The Repair:** Soften (5).
  *   *Revision:* Change "explains nothing" to "lacks *generalizable* explanatory power." Acknowledge that individual causation is real (per 6) but idiosyncratic, whereas structural causation is recurrent.
  *   *Cost:* Negligible. It merely aligns your rhetoric with your ontological commitment in (6).

  ### The Single Revision to Clean Up the Most

  The instability stems from treating "Nazi Germany" as a single outcome variable that is sometimes robust and sometimes contingent. You need to fracture the outcome variable to prevent the Robustness Principle (7) from draining the causal credit you want to assign in (3).

  **The Revision:**
  **Explicitly decouple the *Outcome Variables* in your Contrasts (1).**

  Do not argue that "Nazi Germany" is structurally determined at a coarse grain and agentially determined at a fine grain. Instead, argue that **"Regime Access"** and **"Policy Radicalization"** are distinct causal nodes with distinct counterfactual pools.

  **How to implement this:**
  1.  **Modify (1):** State that historical explanation requires fixing *both* the contrast class and the *causal phase*.
  2.  **Modify (4):** Define the "supply-side pool" as phase-dependent.
      *   *Phase 1 (1933):* Pool = Conservative Elites (Schleicher, Papen). Result = Robust Authoritarianism (Hitler not necessary).
      *   *Phase 2 (1941-42):* Pool = Nazi Leadership (Göring, Himmler). Result = Contingent Extermination (Hitler necessary).
  3.  **Modify (7):** Apply Robustness separately to each phase. The robustness of Phase 1 does not transfer to Phase 2 because the *mechanism* changes from structural pressure to decisional radicalization.

  **Why this fixes the set:**
  *   It resolves the **Robustness Transfer Problem**: The structural robustness of the regime no longer threatens the agential contingency of the genocide because they are treated as separate causal links.
  *   It resolves the **Supply-Side Problem**: It justifies why Schleicher is a valid replacement for the 1933 question but not the 1941 question.
  *   It preserves your **Case Verdict**: You can maintain that Hindenburg's appointment wasn't the difference between democracy and dictatorship (Phase 1 robust), while maintaining Hitler was the difference between deportation and extermination (Phase 2 contingent).

  **The Cost:**
  You sacrifice the narrative simplicity of "Structure vs. Agency" as a single binary. You must instead argue for a **sequential model** where structural constraints dominate early (access to power) and agential constraints dominate late (implementation of policy). This requires you to defend the claim that the Nazi bureaucracy could *not* have reached extermination without Hitler's specific intervention, even given the robust authoritarian structure you posit in (2). This is a stronger historical claim than your current "fine grain" distinction, but it is logically stable.
