answer: |-
  Your second worry is devastating, and you are right to trust it. It exposes that your roommate's argument is not just counter-intuitive, but internally unstable. He is trying to have it both ways: he wants the metaphysical cleanliness of "facts don't change things" (Premise 2) to clear observation of guilt, but he wants the normative force of "social consequences matter" to condemn blackmail and firing. As you noted, those two positions cannot coexist. If the *dissemination* of facts (blackmail/outing) is a wrong, it must be because changing who knows what about you matters. But if that matters, then the *acquisition* of that knowledge (observation) matters too, because it changes the same relational state, just on a smaller scale.

  Here is the diagnosis of where the argument breaks, which step you should reject, and what you buy with that rejection.

  ### The Step to Reject: Premise (1)

  **"To wrong someone you have to make them worse off in some respect: set back one of their interests..."**

  This is the ethical engine of the argument. It is a **Welfarist** or **Consequentialist** premise. It claims that rights are merely tools to protect well-being. If well-being isn't touched, the right isn't triggered.

  **Why it looked fine on the way through:**
  It aligns with the Millian "Harm Principle" and common-sense legal intuition (*no harm, no foul*). It feels rigorous because it ties morality to observable outcomes rather than spooky metaphysical violations. It appeals strongly to the CS mindset: if the system state (the person) hasn't changed, no operation (the observation) has occurred.

  **Why it fails:**
  It cannot account for **violations of authority**. The standard counter-example is **trespass**.
  If I sneak into your house while you are on vacation, sleep in your bed, leave no trace, and steal nothing, have I made you "worse off"?
  *   **By Premise (1):** No. Your physical property is unchanged. Your mental state is unchanged (you don't know). Your economic interests are unharmed.
  *   **By Intuition:** Yes, I have wronged you.
  *   **Why:** Because you have *authority* over that space, not just an *interest* in its condition. I violated your sovereignty.

  **How rejecting (1) solves your problems:**
  1.  **Saves (4) and (7):** If wronging someone doesn't require setting back their welfare, then pure observation can be a wrong simply because it violates your **authority over access**. You have a right to determine who knows what about you, regardless of whether that knowledge hurts your "interests."
  2.  **Fixes Worry Two (The Collapse):** Your roommate argues that "acting on info" (firing, outing) is a wrong, but "gathering info" is not. But if we reject (1), we see that *both* are wrongs of authority.
      *   **Observation:** Violates my authority to control access to me.
      *   **Dissemination (Outing):** Violates my authority to control the *scope* of that access.
      *   This prevents the collapse into "only physical interference matters." Informational acts become normative violations in their own right, not just precursors to physical harm.

  ### The Hidden Lie: Premise (2)

  While rejecting (1) is the cleanest ethical cut, you should also know that Premise (2) is metaphysically suspect. This is where you can corner him on the "Human vs. Machine" inconsistency.

  **"Finding out a true fact about someone... doesn't change any of their intrinsic properties."**

  This relies on an **Atomistic Metaphysics**. It treats a person as a solitary physical object, like a rock. But humans are social objects. Our properties include **relational properties**.
  *   "Being known by X" is a fact about me.
  *   "Being vulnerable to blackmail by Y" is a fact about me.
  *   "Having my secret held by a human judge" is a different fact than "Having my data processed by a script."

  **The Machine Contradiction:**
  Your roommate admits it is worse if a *human* watches the footage than a *machine*.
  *   If Premise (2) were true, this distinction would be impossible. A machine "tracking true facts" and a human "knowing true facts" are identical states of information registration.
  *   By admitting the human case is worse, he admits that the **social context of the knowledge** changes the reality of the situation.
  *   If the social context matters, then **relational properties are real properties**.
  *   If relational properties are real, then observation *does* change facts about the person (it changes their social vulnerability).
  *   Therefore, Premise (2) is false, and Premise (3) fails.

  ### What You Are Stuck With (The Cost)

  If you reject Premise (1) to save your intuition that surveillance is wrong, you are making a specific philosophical trade-off.

  1.  **You abandon Pure Consequentialism:** You are accepting that some things are wrong *in principle*, not just because of their outcomes. You are moving toward a **Deontological** or **Rights-Based** framework. Privacy becomes a matter of *consent* and *norms*, not just *harm prevention*.
  2.  **You accept "Privacy as Contextual Integrity":** Since you mentioned you were fine with privacy not being "one single thing," this fits perfectly. This view (championed by Helen Nissenbaum) says privacy isn't about secrecy; it's about the **appropriate flow of information**.
      *   Observation violates the norm of the context (e.g., "I am in my home, not a public stage").
      *   Firing based on private info violates the norm of the context (e.g., "My health data belongs in the medical context, not the employment context").
      *   This explains why "acting on info" is often *worse* than observation (it violates more contexts) without requiring observation to be harmless.
  3.  **You lose the "Information Wants to be Free" Defense:** Your roommate's cheerful reductionism relies on information being a neutral commodity. By rejecting (1), you assert that information is **normatively loaded**. Carrying information about a person creates a relationship of power, and that relationship is subject to moral rules.

  ### Summary for the Whiteboard

  To defeat the argument, draw this distinction:

  *   **Roommate's View:** Privacy = **Secrecy** (a state of the world where facts are unknown).
      *   *Result:* If facts are true, knowing them is neutral. Only using them to cause harm is bad.
  *   **Your View:** Privacy = **Sovereignty** (a right to govern access to the self).
      *   *Result:* Access without permission is a violation of authority, regardless of harm.

  **The Knockout Punch:** Ask him this: *"If I install a camera in your bathroom and watch the feed, but I program the AI to blur your body and only log your heart rate, and I never show anyone, have I wronged you?"*
  *   If he says **No**, he has abandoned all privacy intuitions.
  *   If he says **Yes**, he must explain *what harm* occurred. If he can't name a welfare setback, **Premise (1) is false.** If he says "It's the violation of trust/authority," then he has conceded that observation itself can be a wrong.

  Your Worry Two is the internal contradiction that proves his system is broken; rejecting Premise (1) is the repair that lets you keep your moral intuitions intact.
