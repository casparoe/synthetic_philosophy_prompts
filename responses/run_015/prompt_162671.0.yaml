  2.  **Deconstruct the User's Intuition & Cases:**
      *   *Core Insight:* The user is grappling with the difference between *Zahavian Handicaps* (wasteful cost) and *Index Signals* (intrinsic link between trait and signal).
      *   *Case 1 (Peacock):* Classic Handicap. Costly, differential.
      *   *Case 2 (Guide):* Index/Performance. Cost is the job itself. No waste.
      *   *Case 3 (Bottle):* Classic Handicap (Conspicuous Consumption). Waste is essential.
      *   *Case 4 (Machine):* Investment, not signal. ROI makes it accessible to low-quality (via credit).
      *   *Case 5 (Stotting):* Index/Performance. "I am so fit I can waste energy." Low marginal cost, high differential capability.
      *   *Case 6 (Car):* Time-consistency/Amortization. Prevents "borrowing against reputation."
      *   *Case 7 (Cert):* Epistemic alignment. If audience believes cost is low, signal fails, even if objectively hard.
      *   *Case 8 (Externalities):* Who pays? If the payer doesn't suffer the downside of lying, it's not a signal *of the payer's* quality.
      *   *Case 9 (Audience Cost):* "Costly to process." This is a *screening* mechanism or a *filter*, not strictly a signal in the Zahavian sense, but functions similarly. It shifts the burden of verification.
      *   *Case 10 (Hidden Cost):* The signal must *reveal* the cost, not necessarily the process. The *outcome* implies the cost.
      *   *Fashion Case:* Burning stock. Is it a signal of brand strength (can afford to burn) or inefficiency?

  3.  **Synthesize a Unified Principle:**
      *   The user's tentative principle is good but fragmented. The core tension is between *Handicap* (waste ensures honesty) and *Index* (physical impossibility ensures honesty).
      *   *Unifying Concept:* **Differential Net Cost relative to Truth.**
      *   The signal must be *profitable* for the High Type to send and *unprofitable* (or less profitable) for the Low Type to send, *given the audience's reaction*.
      *   However, the user specifically wants to capture the *mechanism* of honesty (why the low type *can't* fake it).
      *   *Refinement:* The "cost" isn't just energy/money; it's *opportunity cost* or *risk*.
      *   *Addressing Case 9:* This is the trickiest. If the cost is on the receiver, it's not a signal *by the sender* in the biological sense, it's a *test* imposed by the sender. But in human communication, imposing a test *is* a signal of confidence. "I am so sure my work is good, I dare you to spend a week checking it." The cost to the receiver is the *medium* of the signal.
      *   *Addressing Waste:* Waste is only required if the trait isn't physically linked to the signal (Index). If it's an Index (Guide, Stotting), waste isn't needed. If it's a Handicap (Peacock, Bottle), waste is needed.
      *   *Addressing Audience Belief:* Signaling is a game of equilibrium. If the audience doesn't believe the cost, the signal has no value. So epistemic alignment is crucial.

      *   *Proposed Principle:* **The Differential Burden Principle.**
          A display $S$ is an honest signal of trait $T$ to audience $A$ if and only if:
          1.  **Differential Marginal Cost:** The net cost of producing $S$ (including risk, opportunity, and resource expenditure) is strictly lower for an agent possessing $T$ than for one lacking $T$.
          2.  **Non-Transferable Liability:** The agent producing $S$ must bear the downside risk if $T$ is false. (Covers Case 8).
          3.  **Epistemic Transparency:** Audience $A$ must correctly estimate the differential cost structure. (Covers Case 7 & 10).
          4.  **Temporal Integrity:** The cost must be sunk prior to the benefit, preventing financing against the reputation gained. (Covers Case 6).

      *   *Wait, Case 9?* If the cost is on the audience, it's not a signal *of the sender's cost*, it's a signal of the *sender's confidence*. The cost to the audience acts as a filter. The sender signals "I am willing to tax your attention." This is a *second-order* signal. I need to incorporate this. Let's call it "Costly Processing as Confidence."

      *   *Re-evaluating the "Waste" Tension (Cases 2 & 3):*
          *   Case 2 (Guide): The cost is *instrumental*. It proves competence directly.
          *   Case 3 (Bottle): The cost is *destructive*. It proves wealth by elimination.
          *   *Resolution:* Distinguish between **Indices** (Case 2, 5) and **Handicaps** (Case 1, 3).
          *   *Indices:* The signal is physically constrained by the trait. (Only a strong guide can lift the pack).
          *   *Handicaps:* The signal is voluntarily costly, and the trait allows absorbing the cost. (Only a rich person can burn money).
          *   *Unified:* Both rely on **Differential Net Cost**. For Indices, the cost for the Low Type is *infinite* (impossible). For Handicaps, the cost for the Low Type is *prohibitive* (negative utility).

  4.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the sophistication of the user's analysis. They have correctly identified the friction between biological models (Zahavi) and economic models (Spence) and sociological nuances.
      *   **The Principle:** Formulate the "Differential Net Cost Principle with Epistemic and Liability Constraints."
      *   **Mapping:** Go through Cases 1-10 and the Fashion case.
      *   **Overturning Verdicts:** Be honest. Case 9 is the biggest outlier. It's technically *screening*, not *signaling*, though functionally similar. I should advise the user to classify it as "Signaling via Screening" or admit it breaks the standard model. Also, the Fashion case is ambiguous because it might be a *sunk cost fallacy* rather than a signal.
      *   **New Cases:**
          1.  *Protest Arrest:* High risk (liability). Differential cost (wealthy/tenured can absorb arrest better than precarious workers). Honest signal of commitment *and* security.
          2.  *Journal Review:* Costly to authors (time) and reviewers (time). Signals quality via filtration.

  5.  **Refining the Principle (Self-Correction during drafting):**
      *   The user's Clause (iv) "Audience estimate... roughly correct" is vital. Signaling is a *semiotic* act, not just physical. If the audience thinks the degree is easy, it signals nothing, even if it's hard.
      *   Case 9 needs careful handling. If I submit a 200-page paper, I am signaling "I am confident enough that I will not be rejected despite the burden I place on you." The cost is on the audience, but the *risk* (rejection) is on the sender.
      *   Let's refine the "Cost" definition. Cost = (Resource Expenditure + Risk + Opportunity Cost) - (Intrinsic Utility).
      *   For Case 2 (Guide), Intrinsic Utility is high (it's the job). For Case 3 (Bottle), Intrinsic Utility is low (waste).
      *   The unifying factor is **Marginal Utility of Cost**.

      *   *Revised Principle Structure:*
          1.  **Differential Marginal Utility of Cost:** The signal imposes a net burden $C$. $C(Low Type) > C(High Type)$.
          2.  **Liability Alignment:** The signaler bears the negative consequence of the signal being false.
          3.  **Common Knowledge of Cost Structure:** The audience knows (1) and (2).
          4.  **Sunkness:** The cost is incurred before the reward.

      *   *Addressing Case 9 specifically:* This violates standard signaling theory because the cost is on the receiver. However, it fits *Screening* theory (Stiglitz/Weiss). I should tell the user to distinguish Signaling (Sender pays) from Screening (Receiver pays/Filter). But in practice, *choosing to submit to a screen* is a signal. I will advise them to categorize Case 9 as "Signaling via Willingness to be Screened."

  6.  **Final Polish:**
      *   Ensure tone is academic but conversational (peer-to-peer).
      *   Make sure the Fashion Case gets a definitive verdict.
      *   Check the "New Cases" against the principle.

      *(Self-Correction on Fashion Case)*: Burning stock. If everyone does it, it's not a signal. If only luxury brands do it, it signals "We don't need to discount to sell." But if they *can't* sell at full price, burning it is admitting failure. It's honest only if the brand *could* sell but chooses not to to protect exclusivity. If they *can't* sell, it's just waste. The signal is "Brand Strength," the action is "Inventory Destruction." It works only if the audience believes the destruction is voluntary, not forced by lack of sales. This is epistemically fragile.

      *(Self-Correction on Case 9)*: The user says "costs that fall on the audience." The principle needs to account for *why* the audience accepts the cost. They accept it because they trust the *source* or the *institution*. If I send a 200-page paper to a random person, they bin it. If I send it to a journal, they read it. The signal isn't the paper length; it's the *submission to the institution*. Wait, the user says "a theorist whose proof is written so densely that checking it takes a week." This is "Obfuscation as Confidence." "My proof is so robust, I dare you to find the error." This is a Handicap. The cost is on the audience, but the *risk of being caught lying* is on the sender. I will frame this as "Risk-Shift Signaling."

      *Decision:* I will propose a principle that distinguishes between **Production Costs** (Sender pays) and **Verification Costs** (Receiver pays), noting that Verification Costs only signal honesty if the Sender bears the *Risk of Verification Failure*.

      *Let's finalize the Principle Name:* **The Differential Burden and Liability Principle.**

      *Structure of Response:*
      1.  The Principle (4 Clauses).
      2.  Case Mapping (1-10 + Fashion).
      3.  Verdicts to Overturn (Case 9 reclassification, Fashion ambiguity).
      4.  New Cases (Protest, Journal).

      *Wait, one more check on Case 6 (Amortization).* The user's intuition is that a stream of payments is harder to fake than a one-off rental. This is about *consistency* over time. A one-off can be financed by the *expected* reward. A stream requires *existing* resources. This fits under "Sunkness" or "Liquidity Constraint." I'll add a clause about **Pre-existing Resource Constraint**.

