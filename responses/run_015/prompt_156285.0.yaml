prompt: |-
  I live in this small college town where they're fighting about renaming Venn Street — Alistair Venn funded the public library in 1910 but also bankrolled a forced-sterilization clinic that ran until 1935. At the council meeting last Tuesday someone shut down the rename proposal by saying "you can't erase history by tearing down a sign," and everyone just nodded like that ended it. I'm trying to figure out what that slogan is actually claiming, because it feels like it's smuggling in a bunch of seperate arguments at once.

  Is it a literal claim about archival preservation — that removing the street sign deletes records? Is it a claim about the ontology of public memory, that commemorative naming is the only kind that counts? Or is it the honorific vs indexical thing — that the sign doesn't praise Venn, it just points to him, so removing it actually hides the past rather than cleansing it? Could there even be a reading where tearing the sign down is the more honest historical act? Can you lay out all the precise theses hiding inside that one sentence, mark which ones are platitudes, which are substantive and defensible, which are false, and especially say which reading the person at my meeting was probably invoking to block the rename? I have a hunch there's some niche distinction between documentary and commemorative memory that I'm not articulating right, so please flag if I'm onto something real or just confusing myself. Also, be explicit about how confident you are in each disambiguation and single out the point you're least sure about.
