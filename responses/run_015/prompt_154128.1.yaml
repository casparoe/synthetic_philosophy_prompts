answer: |-
  **INTERNAL NOTE**

  **TO:** Director of Strategy
  **FROM:** Methods Unit
  **DATE:** 24 May 2024
  **SUBJECT:** Philosophical Assumptions Underlying the Appraisal Manual

  **1. Purpose**
  This note articulates the implicit theory of welfare and value underpinning our current appraisal Manual. It addresses the coherence of our rules, specifically the tension between our Revealed Preference (RP) valuation standards and the interventions of the Behavioural Insights (BI) team. It concludes by testing the logical limits of our framework against austere economic theory.

  **2. The Official Theory: Welfarist Utilitarianism via Revealed Preference**
  On its face, the Manual adopts a standard neoclassical position:
  *   **Ontology:** Welfare consists in the satisfaction of preferences.
  *   **Epistemology:** Preferences are unknowable except through observed choice (Revealed Preference). Statements (surveys) are "cheap talk"; only costs incurred (fares, wages, house prices) count as evidence.
  *   **Ethics:** All preferences count equally. The social good is the sum of individual welfares (Utilitarianism).
  *   **Decision Rule:** Kaldor-Hicks efficiency. A project is desirable if the winners *could* compensate the losers, regardless of whether they *do*.

  **3. The Operational Theory: Market Mimicry**
  In practice, the Manual departs from strict RP theory to function as an accounting system. It does not measure utility; it measures *market shadows*.
  *   **Required Axioms:** The system strictly requires **Commensurability** (all goods can be expressed in a single numeraire) and **Sovereignty** (the chooser knows best).
  *   **Operational Habits:** Much of our practice is heuristic, not axiomatic. Benefit transfer (scaling values from other cities), hedonic pricing (inferring air quality value from house prices), and statutory compensation caps are not required by RP theory. They are administrative shortcuts that assume markets are complete and liquid, which we know they are not.
  *   **The Exclusions:** The "separate table" for landscape and wetlands admits that some values resist commensurability. This contradicts the Utilitarian axiom that all welfare impacts must enter the arithmetic. It is a political concession, not a theoretical one.

  **4. The Three Jobs of "Value"**
  Your suspicion is correct. The term "value" performs three distinct functions in our arithmetic, which we treat as one:
  1.  **Descriptive (Behavior):** It records what people *did* (e.g., paid a fare premium).
  2.  **Normative (Welfare):** It asserts what *benefited* people (e.g., the premium proves the time saving was worth it).
  3.  **Accounting (Aggregation):** It provides a common unit to *sum* across persons (e.g., £1 to a commuter = £1 to a taxpayer).

  The Manual assumes these three are identical. The Descriptive proves the Normative, which allows the Accounting. The system breaks if any link is severed.

  **5. The Behavioural Insights Contradiction**
  The BI Unit operates on a theory of **Preference Purification**. They assume choices are often flawed (due to inertia, framing, bias) and that welfare is increased by correcting these choices (e.g., auto-enrollment).
  *   **The Conflict:** If the BI Unit is right, our RP valuation is wrong. We are pricing "noisy" or "irrational" choices and treating them as welfare improvements.
  *   **The Performative Contradiction:** In the BI appraisal, we count the *change* in behavior as a benefit. But if the original behavior was irrational, its RP value was noise. If the new behavior is "better," it is because it aligns with some *unobserved* true preference, not because it was revealed.
  *   **Conclusion:** We cannot simultaneously hold that (a) only observed choice reveals value, and (b) observed choice should be overridden to improve value. Currently, we claim (a) to avoid paternalism in valuation, and (b) to justify paternalism in design.

  **6. The Austere Revealed Preference Test**
  If we adhered strictly to the austere theory of Revealed Preference (Samuelson/Houthakker), the following would apply:
  *   **Ordinality:** Choice reveals only ranking (A > B), not magnitude (A is twice as good as B).
  *   **Non-Comparability:** There is no scientific basis to compare Person A's ranking with Person B's.

  **Consequences for the Manual:**
  1.  **Monetisation Must Go:** Money implies cardinality and interpersonal comparability (assuming marginal utility of income is constant). Austere RP denies this. We cannot add £100 of a rich person's time to £100 of a poor person's time.
  2.  **Benefit-Cost Analysis Collapses:** You cannot sum ordinal, non-comparable utilities. The Net Present Value (NPV) calculation becomes mathematically meaningless.
  3.  **Replacement Mechanism:** Without CBA, project selection would revert to:
      *   **Pareto Criteria:** Only approve projects where *no one* loses (virtually impossible for infrastructure).
      *   **Political Judgment:** Explicit distributional weights decided by ministers, not analysts.
      *   **Counting Heads:** A simple majority of affected parties (referendum style), ignoring intensity of preference.

  **7. Recommendation**
  The Manual is not a philosophical treatise; it is a technology for decision support. It works not because it is philosophically coherent, but because it is *actionable*. However, the contradiction with the BI Unit undermines our credibility.

  We should amend the Manual to acknowledge that RP values are **proxies for welfare, not definitions of it**. We must explicitly state that where behavioral evidence suggests systematic bias (as per BI findings), RP values may be adjusted. We are not measuring "truth"; we are constructing a consistent currency for public debate. To pretend otherwise is to invite the incoherence you have identified.

  **End Note**
