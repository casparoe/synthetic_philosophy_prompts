answer: |-
  ### Teaching Plan: Decoupling Risk Aversion from Probability Weighting

  **Objective:** Convince your roommate that standard Expected Utility (EU) cannot explain the co-op's voting behavior without implying absurd levels of risk aversion, and that Probability Weighting ($w(p)$) is required to separate "how bad the loss is" from "how much we fear the odds."

  **Constraint Checklist:**
  *   **No Axioms:** Do not derive von Neumann-Morgenstern or Allais paradox formally.
  *   **No RDU Math:** Do not explain cumulative weighting/integrals. Focus on the *concept* of decision weights.
  *   **One Example:** The Co-housing Solar Vote.
  *   **Target:** Non-math-track decision theory student.

  ---

  ### Part 1: Conceptual Dependency Map (The Arc)

  Teach this sequence. Do not skip steps. Each step creates the necessity for the next.

  **Phase 1: Establish the Baseline (Standard EU)**
  *   **Concept:** Risk aversion is *only* about the curvature of the utility function $u(x)$.
  *   **Application:** In Standard EU, we value the Solar option because the *utility* of avoiding a blackout is massive compared to the *disutility* of higher monthly bills.
  *   **Goal:** Get her to agree that under Standard EU, the only lever we have to justify the battery cost is making $u(\text{blackout})$ incredibly negative.

  **Phase 2: The Break (The Calibration Problem)**
  *   **Concept:** If we rely *only* on $u(x)$ to explain the vote, we imply irrational behavior in other contexts.
  *   **Application:** Ask her: "To justify the battery cost using only curved utility, how much would we have to hate losing \$100?"
  *   **The Trap:** If our utility curve is steep enough to justify the battery (given a 1% blackout risk), it implies we should reject almost *any* gamble with positive expected value in daily life (e.g., refusing a 50/50 bet to lose \$100 or win \$105).
  *   **Goal:** Show that Standard EU forces us to be "globally" risk-averse, which contradicts our actual behavior (we buy coffee, we take small risks).

  **Phase 3: The Fix (Decoupling $w$ and $u$)**
  *   **Concept:** Introduce Probability Weighting $w(p)$.
  *   **Distinction:**
      *   $u(x)$ = How much we suffer the outcome (Risk Aversion).
      *   $w(p)$ = How much we worry about the probability (Probability Distortion).
  *   **Application:** We don't need a crazy curved $u()$. We just need $w(1\%)$ to feel like $10\%$. We overweight the tail risk.
  *   **Goal:** She must see that $w(p)$ allows us to be reasonable about bills (linear $u$ for money) but paranoid about blackouts (non-linear $w$ for probability).

  **Phase 4: The Intangible (Energy Sovereignty)**
  *   **Concept:** Reference Dependence / Lexicographic Preferences.
  *   **Application:** "Sovereignty" isn't a dollar amount added to $u(x)$. It changes the *reference point*.
      *   Grid = Reference point is "Vulnerable."
      *   Solar = Reference point is "Secure."
  *   **Mechanism:** The loss of a blackout is felt as a fall from "Secure," not just a loss of comfort. This justifies why sovereignty shouldn't be quantified as a dollar bonus but treated as a constraint on the probability weighting.
  *   **Goal:** Integrate the vague value without breaking the math.

  ---

  ### Part 2: The Carrying Example (The Solar Vote)

  Use this specific numerical setup for the whole session. Do not change the numbers.

  *   **Option A (Grid):**
      *   **Cost:** \$100/month (High probability, 99%).
      *   **Risk:** Grid Collapse (Low probability, 1%).
      *   **Impact:** Frozen pipes, spoiled food, safety risk. Valued at -\$50,000 equivalent.
  *   **Option B (Solar+Battery):**
      *   **Cost:** \$250/month (Certainty).
      *   **Risk:** System Failure (Negligible, ~0%).
      *   **Impact:** None.
  *   **The "Sovereignty" Factor:** The psychological safety of knowing the building controls its own power.

  **How to run the example:**
  1.  **EU Calculation:** Show that $0.99 \times u(-100) + 0.01 \times u(-50,000)$ is barely different from $u(-250)$ unless $u(-50,000)$ is astronomically huge.
  2.  **Weighting Calculation:** Show that $w(0.01) \times u(-50,000)$ works if $w(0.01) = 0.10$. We treat the 1% risk as a 10% risk.
  3.  **Sovereignty:** Explain that Sovereignty makes the Grid option's "1%" feel even heavier because the loss is relative to a standard of independence we *should* have.

  ---

  ### Part 3: Misconception Sequence & Defusal

  Address these in this exact order. If you address them out of order, she will revert to Standard EU.

  | Misconception | When it arises | How to Defuse |
  | :--- | :--- | :--- |
  | **"It's just Subjective Expected Utility (Bayesian)."** | **Phase 2.** She will say: "We just believe the blackout probability is higher than 1%." | **Defusal:** Distinguish *Belief* from *Attitude*. "If we truly believed the risk was 10%, we'd lobby the city to fix the grid. But we know it's 1%; we just *care* more about that 1% than the math says. That's weighting, not belief." |
  | **"We are Double-Counting Risk."** | **Phase 3.** She will argue: "If you curve $u()$ AND weight $p()$, aren't you penalizing risk twice?" | **Defusal:** "No. $u()$ measures the pain of the bill vs. the pain of the freeze. $w()$ measures the anxiety of the *chance*. One is about the wound, the other is about the odds of the knife falling." |
  | **"Sovereignty is just extra Utility."** | **Phase 4.** She will try to add "\$5,000 sovereignty value" to the Solar column. | **Defusal:** "If it's a dollar value, we could sell it. We can't. It's a *condition*. It means we weight the Grid's tail risk higher because it violates our autonomy. It modifies the weight $w(p)$, not the outcome $x$." |
  | **"This is Rank-Dependent Utility (RDU)."** | **Anytime.** She might try to name-drop the formal model. | **Defusal:** "Don't worry about the 'Rank' part yet. Just focus on the separation of $w$ and $u$. If you start explaining cumulative distributions to the board, you'll lose them. Keep it at 'Decision Weights'." |

  ---

  ### Part 4: The Verification Check

  Do not ask her to write an equation. Ask her to predict behavior in a modified scenario.

  **The Test Question:**
  > "If the municipal grid offered us a contract: We pay the \$100/month, but if the grid fails, they guarantee a hotel room for everyone (capping the loss at -\$5,000 instead of -\$50,000). Does our demand for batteries drop proportionally?"

  **Correct Answer (Shows Understanding):**
  "No. Because of probability weighting, we still overweight the *occurrence* of the failure, even if the severity is capped. Also, the 'Sovereignty' value is lost even if we have a hotel room. Standard EU would say we should be much happier with the hotel contract; Weighting + Sovereignty says we're still uneasy."

  **Incorrect Answer (Memorization):**
  She immediately tries to calculate the new Expected Value without mentioning the anxiety of the event or the sovereignty loss.

  ---

  ### Part 5: Explicit Exclusions & Safety Notes

  **1. What to Leave Out:**
  *   **The Integral:** Do not write $\int u(x) dw(p)$. It triggers math anxiety and distracts from the concept.
  *   **Allais Paradox:** Do not name-drop. It invites theoretical debate you don't have time for.
  *   **Loss Aversion vs. Risk Aversion:** Do not get bogged down in Prospect Theory's value function $v(x)$ vs. Utility $u(x)$. Stick to $u(x)$ for outcomes to keep it simple, unless she pushes hard on the "Sovereignty" reference point.

  **2. Safety Note for the Board (Crucial for You):**
  When you present this to the co-op board, **do not mention Probability Weighting.**
  *   **Why:** It sounds like you are admitting to being "irrational" or "bad at math."
  *   **Say This Instead:** "Standard cost-benefit analysis underestimates low-probability high-impact events. We are applying a 'resilience premium' to the risk assessment."
  *   **The RDU Trap:** If she asks you about Rank-Dependent Utility during the Q&A, say: "We aren't using a specific academic model; we're using a decision framework that separates outcome severity from likelihood anxiety." This protects you from having to defend the mathematical consistency of non-cumulative weighting.

  **3. The "One Thing" to Remember:**
  If you feel yourself conflating Risk Aversion and Probability Weighting, ask: **"Am I talking about how much the blackout hurts (Utility), or how likely I think it is to happen (Weighting)?"** If the answer is "I think it's more likely than the stats say," that's Weighting. If the answer is "It hurts more than the cost," that's Utility.
