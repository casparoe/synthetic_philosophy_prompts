prompt: |-
  I just moved into a co-housing building and we're voting next week on a communal solar-plus-battery retrofit versus staying on the municipal grid, and suddenly risk-weighted expected utility feels personal—my roommate's auditing a decision-theory seminar and she's trying to convince me that standard expected utility with a curved u() can't capture why we're scared of the blackout tail even though the bills are almost certainly higher. I need a teaching plan for her, not the actual lecture: the dependancy order so she sees why the probability weighting has to be conceptually seperate from risk aversion inside the utility function, and the carrying example that should stick—which needs exactly one high-probability small loss (the monthly cost bump) and one low-probability catastrophic failure (storm-induced grid collapse where batteries save us), plus this vague "energy sovereignty" value that shouldn't be quantified but shouldn't disappear either.

  What misconceptions will she bring—probably that we're double-counting risk or that this is just Bayesian subjective expected utility—and at which point in the arc should I defuse each? What's the check that shows she actually understands the weighting mechanism rather than memorizing the integral form? And please tell me explicitly what to leave out, like the full axiomatic derivation, since she's not math-track. One more thing: I keep mixing this up with rank-dependent formulations in my head, so build the plan so it doesn't depend on knowing those distinctions cold, but don't let me accidentally conflate them when I'm explaining it to the co-op board. No reading lists, just the conceptual dependency map and misconception sequence.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Context:** Co-housing building voting on solar-plus-battery vs. municipal grid.
      *   **Problem:** Roommate (decision-theory seminar student) claims standard Expected Utility (EU) with curved $u()$ explains the fear of blackouts. User believes Probability Weighting (like Prospect Theory) is needed to separate risk aversion from tail-risk fear.
      *   **Goal:** A teaching plan for the roommate (not the lecture itself).
      *   **Key Requirements:**
          *   Dependency order (conceptual map).
          *   One specific carrying example (High-prob small loss vs. Low-prob catastrophic failure + "energy sovereignty").
          *   Address specific misconceptions (double-counting, Bayesian SEU).
          *   Verification check (understanding vs. memorization).
          *   Explicit exclusions (no axiomatic derivation, keep it non-math-track).
          *   Constraint: Don't rely on deep knowledge of Rank-Dependent Utility (RDU) distinctions to avoid confusion, but ensure the explanation doesn't conflate them incorrectly.
          *   Format: Conceptual dependency map and misconception sequence. No reading lists.

  2.  **Deconstruct the Core Theoretical Conflict:**
      *   *Standard EU:* $E[U] = \sum p_i u(x_i)$. Risk aversion is captured by concave $u()$.
      *   *The Roommate's Claim:* Concave $u()$ explains the fear of blackouts.
      *   *The User's Intuition:* Concave $u()$ isn't enough for *rare* catastrophes. We overweight small probabilities of disaster. This requires Probability Weighting ($w(p)$), where $w(p) > p$ for small $p$.
      *   *The "Energy Sovereignty" Factor:* A non-monetary value that shouldn't be forced into a dollar utility but affects the decision.
      *   *The Trap:* Confusing Risk Aversion (curvature of $u$) with Probability Weighting (curvature of $w$).

  3.  **Drafting the Dependency Map (The "Arc"):**
      *   *Step 1: Establish the Baseline (Standard EU).* Define risk aversion purely through diminishing marginal utility of money.
      *   *Step 2: Break the Baseline (The Allais/Insurance Paradox).* Show where EU fails. Specifically, the "fourfold pattern" or just the specific co-housing case.
      *   *Step 3: Introduce the Separation.* Distinguish *valuing outcomes* ($u$) from *perceiving likelihoods* ($w$).
      *   *Step 4: Integrate the Intangible.* Where does "sovereignty" fit? (It shifts the reference point or acts as a lexicographic constraint, not just a dollar amount).
      *   *Step 5: Synthesis.* Why this matters for the vote.

  4.  **Developing the Carrying Example:**
      *   *Option A (Grid):* Low monthly cost, tiny chance of total failure (cold house, spoiled food, safety risk).
      *   *Option B (Solar+Battery):* High monthly cost (loan/maintenance), near-zero chance of failure (island mode).
      *   *The "Sovereignty" Kicker:* It's not just about comfort; it's about *control*.
      *   *Calibration:* Need to show that a standard concave $u()$ would require absurd risk aversion to justify the battery cost given the low probability of grid failure. Probability weighting allows reasonable risk aversion + high fear of the tail.

  5.  **Identifying Misconceptions & Defusal Points:**
      *   *Misconception 1: "It's just extreme risk aversion."* (Defuse at Step 2). Show the calibration problem (Rabin's calibration theorem intuition).
      *   *Misconception 2: "Subjective Probabilities (Bayesian) solve this."* (Defuse at Step 3). Subjective $p$ is about belief; Weighting $w(p)$ is about *attitude* toward the belief.
      *   *Misconception 3: "Double Counting."* (Defuse at Step 3/4). $u$ handles "how bad is it?", $w$ handles "how much do I worry about the chance?".
      *   *Misconception 4: "Sovereignty is just extra utility."* (Defuse at Step 4). It's a constraint or reference point shift.

  6.  **Addressing the Rank-Dependent Constraint:**
      *   The user admits to mixing up RDU/CPT. The plan must avoid requiring the roommate to derive RDU.
      *   *Strategy:* Focus on the *intuition* of weighting probabilities *before* multiplying by utility, without getting bogged down in the cumulative probability integration math of RDU. Keep it at the "Decision Weight" level.
      *   *Warning:* Don't tell the board "we use Rank-Dependent Utility." Tell them "we weigh unlikely disasters heavier than the stats suggest."

  7.  **Designing the Verification Check:**
      *   Don't ask for the formula.
      *   Ask a "What If" question. Change the probability but keep the expected value same. Or change the magnitude.
      *   *Better Check:* Ask her to explain why a lottery ticket (small $p$, huge gain) and Insurance (small $p$, huge loss) can coexist under this model but not under standard EU.

  8.  **Refining the Plan (Self-Correction/Review):**
      *   *Critique:* Is the "Energy Sovereignty" part clear?
      *   *Fix:* Treat it as a "Reference Point" shift. Grid = Vulnerable. Solar = Secure. The loss is felt relative to security.
      *   *Critique:* Is the math too heavy?
      *   *Fix:* Use numbers but no integrals. Use "Decision Weights."
      *   *Critique:* User asked for "Dependency Order."
      *   *Fix:* Structure the output as a phased flow.

  9.  **Final Polish:**
      *   Ensure tone is appropriate (peer-to-peer teaching plan).
      *   Check all constraints (no reading lists, explicit exclusions, misconception sequencing).
      *   Make sure the distinction between $u$ (outcome value) and $w$ (probability weight) is the spine of the plan.

  **(Self-Correction on RDU vs. Probability Weighting):**
  Strictly speaking, Probability Weighting applied to individual probabilities leads to violations of first-order stochastic dominance unless handled via Rank-Dependent Utility (cumulative weighting). However, for a *teaching plan* aimed at a non-math-track student to explain a *conceptual distinction*, diving into cumulative weighting might confuse the core point (separation of risk aversion and probability distortion).
  *Decision:* I will explicitly advise the user to *avoid* the mechanical "how to calculate" of RDU to prevent the confusion they mentioned, focusing instead on the *functional separation* of $w(p)$ and $u(x)$. I will add a "Safety Note" in the plan to ensure they don't claim mathematical consistency they can't defend, while keeping the conceptual point valid.

  10. **Final Output Structure:**
      *   Phase 1: The Baseline (Standard EU).
      *   Phase 2: The Break (Calibration Problem).
      *   Phase 3: The Fix (Decoupling $w$ and $u$).
      *   Phase 4: The Intangible (Sovereignty).
      *   Misconception Map.
      *   Verification Check.
      *   Exclusions & Safety Notes.

