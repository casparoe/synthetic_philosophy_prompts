prompt: |-
  I'm a science journalist covering neuroscience and theoretical psychology, and I need a reusable editorial procedure I can run in about fifteen minutes to determine whether a research submission genuinely explains its findings through predictive processing and the free energy principle, or merely uses those terms as conceptual decoration. Write a step-by-step checklist—ordered questions, what counts as a sufficient answer at each stage, explicit stop points where the verdict is negative, and clearly marked judgment calls—grounded in the actual mechanics of hierarchical generative models, precision-weighted prediction errors, and active inference rather than loose metaphor. The procedure should distinguish mechanistic specificity from redescriptive labeling, state exactly where evaluation must be handed to a specialist because it exceeds journalistic competence, and flag the steps that are irreducibly value-laden rather than factual. Apply it to two hypothetical cases: first, a clinical study linking hallucination severity to independently measured precision-weighting deficits in auditory cortex; second, a behavioral study describing consumer choice as "minimizing surprise" without specifying generative models, action policies, or precision dynamics. Include at least one worked case where the procedure returns a negative verdict that conflicts with the authors' own framing, and be explicit about what the checklist cannot settle.
reasoning: |-
  Here's a thinking process that leads to the suggested editorial procedure:

  1.  **Analyze the Request:**
      *   **Target Audience:** Science journalist (neuroscience/theoretical psychology).
      *   **Task:** Create a reusable editorial procedure (checklist) to evaluate research submissions claiming to use Predictive Processing (PP) and the Free Energy Principle (FEP).
      *   **Goal:** Distinguish genuine mechanistic explanation from conceptual decoration (buzzword usage).
      *   **Constraints:**
          *   Run time: ~15 minutes.
          *   Format: Step-by-step checklist (ordered questions, sufficient answers, stop points, judgment calls).
          *   Content: Grounded in actual mechanics (hierarchical generative models, precision-weighting, active inference).
          *   Specific Requirements: Distinguish mechanism vs. redescription, identify limits of journalistic competence (hand-off points), flag value-laden steps.
          *   Application: Apply to two hypothetical cases (Clinical/Hallucination vs. Behavioral/Consumer Choice).
          *   Specific Output: At least one negative verdict conflicting with authors' framing.
          *   Limitations: Explicitly state what the checklist *cannot* settle.

  2.  **Deconstruct the Science (PP/FEP):**
      *   *Core Claim:* The brain is a hierarchical generative model minimizing variational free energy (surprise).
      *   *Key Mechanics:*
          *   Prediction Errors (PE): Difference between top-down prediction and bottom-up input.
          *   Precision Weighting: Confidence assigned to PE vs. Prediction (gain control).
          *   Hierarchical Structure: Higher levels explain causes of lower level errors.
          *   Active Inference: Action changes input to match predictions (not just updating beliefs).
      *   *Common Pitfalls:* Using "prediction" to mean "expectation," using "surprise" to mean "emotion," ignoring precision, ignoring the generative model structure.

  3.  **Drafting the Checklist (Iterative Process):**
      *   *Time Limit:* 15 minutes means max 5-7 steps. Each step needs to be quick to verify.
      *   *Step 1: The Generative Model.* Is there actually a model? Or just a claim?
      *   *Step 2: Prediction Error.* Is it quantified or mechanistic?
      *   *Step 3: Precision.* This is the biggest differentiator. Is gain/uncertainty addressed?
      *   *Step 4: Action/Inference.* Is it passive perception or active inference?
      *   *Step 5: The "So What?" Test.* Does FEP add explanatory power over standard models?
      *   *Stop Points:* If they fail Step 1 or 3, it's likely decoration.
      *   *Hand-off:* Mathematical validity of the free energy bound.
      *   *Value-laden:* Deciding if the explanation is "useful" or "parsimonious."

  4.  **Refining the Checklist for the User:**
      *   Need clear headers.
      *   Need explicit "STOP" warnings.
      *   Need to mark [JUDGMENT] and [HAND-OFF].
      *   Need to ensure the language is accessible but technically rigorous.

  5.  **Developing the Hypothetical Cases:**
      *   *Case 1 (Clinical):* Hallucinations & Precision. This should ideally pass (or be ambiguous) because this is a core application of PP in psychiatry (e.g., Fletcher & Frith). Let's make it pass to show the positive track.
      *   *Case 2 (Consumer Choice):* "Minimizing Surprise." This is a classic misuse. Economics usually uses utility maximization. Mapping this to FEP without a generative model is usually "just-so" storytelling. This will be the negative verdict case.

  6.  **Addressing Specific Constraints:**
      *   *15 Minutes:* Emphasize skimming specific sections (Methods, Results, Discussion).
      *   *Journalistic Competence:* Acknowledge I can't check the math, only the claims.
      *   *Value-Laden:* Identifying "explanatory value" is subjective.

  7.  **Drafting the Content (Mental Walkthrough):**
      *   *Intro:* Set the stage.
      *   *The Protocol:* 5 Steps.
      *   *Case 1 Application:* Walk through the steps. Verdict: Plausible.
      *   *Case 2 Application:* Walk through the steps. Verdict: Decorative.
      *   *Limitations:* What this doesn't do (verify math, replicate data).

  8.  **Review against Constraints:**
      *   *Ordered questions?* Yes.
      *   *Sufficient answers?* Yes.
      *   *Stop points?* Yes.
      *   *Judgment calls marked?* Yes.
      *   *Hand-off points?* Yes.
      *   *Value-laden flags?* Yes.
      *   *Two cases?* Yes.
      *   *Negative verdict conflicting with authors?* Case 2 will claim FEP, checklist will say no.
      *   *What checklist cannot settle?* Included.

  9.  **Final Polish:**
      *   Ensure tone is professional and instructional.
      *   Check technical accuracy (e.g., distinguishing precision from accuracy).
      *   Make sure the "15-minute" claim is realistic (focus on abstract, methods, discussion).

  *(Self-Correction during drafting)*: Initially, I might make the math check too hard. I need to remember I'm a journalist. I can't check the variational calculus. I have to check if they *specify* the variables. So Step 1 should be about variable specification, not derivation.
  *(Self-Correction on Case 1)*: Make sure Case 1 isn't *too* perfect. Real science is messy. But for the sake of the exercise, it needs to demonstrate the *mechanism* being present.
  *(Self-Correction on Case 2)*: Ensure the authors *claim* FEP. The prompt asks for a case where the verdict conflicts with the authors' framing. So the paper must title/abstract claim FEP.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # The PP/FEP Editorial Filter: A 15-Minute Protocol

  **Purpose:** To distinguish mechanistic applications of Predictive Processing (PP) and the Free Energy Principle (FEP) from metaphorical "buzzword" usage.
  **Time Budget:** 15 Minutes.
  **Scope:** Abstract, Methods (Model Specification), Results (Parameter Reporting), Discussion (Explanatory Claims).
  **Limitations:** This protocol evaluates *conceptual coherence*, not mathematical validity or empirical replication.

  ---

  ## Part 1: The Checklist Procedure

  ### Step 1: The Generative Model Specification (Minutes 0–3)
  **Question:** Does the paper define the *variables* and *structure* of the generative model being minimized?
  *   **Look for:** A description of hidden causes, sensory states, and the mapping between them (the likelihood matrix or function).
  *   **Sufficient Answer:** The authors specify what the system is predicting (e.g., "auditory frequency," "reward probability") and the hierarchical levels involved (e.g., "sensory layer," "contextual layer").
  *   **Insufficient Answer:** Phrases like "the brain predicts the future," "expectations shape perception," or "minimizing uncertainty" without defining *what* is being generated or *how*.
  *   **🛑 STOP POINT:** If the paper claims FEP/PP but defines no generative model structure, **VERDICT: DECORATIVE.** Stop here.
  *   **[JUDGMENT CALL]:** Determining if a high-level description counts as a "specification" depends on the journal's audience. For *Nature Neuroscience*, equations are expected. For *PNAS*, a schematic may suffice.

  ### Step 2: Precision-Weighting Mechanics (Minutes 3–6)
  **Question:** Is "precision" (inverse variance/confidence) treated as a dynamic parameter that modulates prediction errors, or merely as a synonym for "accuracy"?
  *   **Look for:** Terms like "gain," "synaptic efficacy," "confidence weighting," or explicit mention of precision parameters ($\Pi$ or $\gamma$) in the equations/methods.
  *   **Sufficient Answer:** The authors describe how the *weight* of the prediction error changes based on context or reliability (e.g., "attenuated sensory precision led to...").
  *   **Insufficient Answer:** Using "precision" to mean "exactness" (e.g., "high precision measurement") or ignoring weighting entirely (treating all errors equally).
  *   **🛑 STOP POINT:** If the mechanism relies on prediction errors but lacks a mechanism for *weighting* them (precision), **VERDICT: INCOMPLETE/DECORATIVE.** (Standard Bayesian models have PEs; PP *requires* precision weighting).
  *   **[VALUE-LADEN FLAG]:** Deciding whether a precision deficit is the *best* explanation for the data involves theoretical preference over competing accounts (e.g., signal-to-noise ratios).

  ### Step 3: Active Inference vs. Passive Perception (Minutes 6–9)
  **Question:** If the study involves behavior/action, does it model action as fulfilling predictions (active inference) or merely as a response to stimuli?
  *   **Look for:** Action policies selected to minimize expected free energy, or references to "sampling," "proprioceptive predictions," or "reference trajectories."
  *   **Sufficient Answer:** Action is described as changing sensory input to match a top-down prediction (e.g., "reaching to confirm object location").
  *   **Insufficient Answer:** Action is described as a reaction to a prediction error (standard feedback loop) without the "minimization of expected surprise" framing.
  *   **[HAND-OFF POINT]:** If the paper involves complex variational calculus (e.g., deriving the ELBO bound), **HAND-OFF TO SPECIALIST.** Do not attempt to verify the math. Ask: "Does a computational neuroscientist confirm this derivation is standard or novel?"

  ### Step 4: The "Redescription" Test (Minutes 9–12)
  **Question:** Does the FEP/PP framework offer a specific mechanistic insight that a standard null model (e.g., Rescorla-Wagner, Signal Detection Theory) could not?
  *   **Look for:** Comparisons to standard models or specific predictions unique to hierarchical precision weighting (e.g., specific hallucination types, specific reaction time distributions).
  *   **Sufficient Answer:** The PP model fits the data better *and* explains a phenomenon standard models cannot (e.g., why high confidence leads to *more* error in specific contexts).
  *   **Insufficient Answer:** The results are described as "minimizing surprise," but the data could equally be described as "maximizing utility" or "habituation" with no loss of information.
  *   **[VALUE-LADEN FLAG]:** Assessing "explanatory power" is subjective. You are judging parsimony and utility, not objective truth.

  ### Step 5: The "Surprise" Definition Check (Minutes 12–15)
  **Question:** Is "surprise" (or free energy) defined mathematically (negative log probability) or emotionally?
  *   **Look for:** Distinction between *surprisal* (information theoretic) and *emotion* (startle response).
  *   **Sufficient Answer:** Clear usage of "surprisal" as $-\log p(outcome)$.
  *   **Insufficient Answer:** Conflating "minimizing surprise" with "avoiding shock" or "reducing stress" without linking to probability distributions.
  *   **🛑 STOP POINT:** If "surprise" is used emotionally without information-theoretic grounding, **VERDICT: METAPHORICAL.**

  ---

  ## Part 2: Application to Hypothetical Cases

  ### Case 1: Clinical Study (Hallucinations & Precision)
  **Submission:** *"Auditory Cortical Gain Control Deficits Predict Hallucination Severity in Schizophrenia Spectrum Disorders."*
  **Authors' Claim:** Uses PP to explain hallucinations as a failure of precision weighting on sensory evidence vs. prior beliefs.

  **Protocol Run:**
  1.  **Generative Model:** **PASS.** Methods specify a 3-level hierarchical model (tones, sequences, context).
  2.  **Precision:** **PASS.** Results report a specific parameter ($\gamma_{sensory}$) correlating with hallucination scores. They describe "attenuated sensory precision" allowing priors to dominate.
  3.  **Active Inference:** **N/A.** Study is perceptual (EEG mismatch negativity), not behavioral action.
  4.  **Redescription:** **PASS.** Authors show standard Signal Detection Theory fails to capture the specific bias pattern (high false alarms only under high uncertainty), which the precision model captures.
  5.  **Surprise:** **PASS.** Defined as information theoretic surprisal in the model fitting.

  **Verdict:** **GENUINE MECHANISM.**
  **Journalistic Angle:** The paper uses the machinery (precision parameters) to explain a specific clinical phenotype that older models miss. It is not just calling hallucinations "bad predictions."

  ***

  ### Case 2: Behavioral Study (Consumer Choice)
  **Submission:** *"Brand Loyalty as Free Energy Minimization: A Predictive Processing Account of Consumer Habits."*
  **Authors' Claim:** Consumers choose familiar brands to "minimize surprise" and "reduce free energy" in a volatile market.

  **Protocol Run:**
  1.  **Generative Model:** **FAIL.** The paper describes "expectations of quality" but defines no hierarchical structure or likelihood mapping between "brand" and "sensory outcome."
      *   *Note:* Authors claim FEP in the Abstract.
  2.  **Precision:** **FAIL.** "Precision" is used to mean "product consistency" (e.g., "high precision manufacturing"), not the confidence weighting of a prediction error in the consumer's brain.
      *   **🛑 STOP POINT REACHED.**
  3.  **Active Inference:** **FAIL.** Buying a product is described as utility maximization (standard economics), merely relabeled as "minimizing surprise." No policy selection over future states is modeled.
  4.  **Redescription:** **FAIL.** "Minimizing surprise" is mathematically equivalent here to "maximizing expected utility," but the paper provides no equations to show the mapping. It adds no new predictive variables.
  5.  **Surprise:** **FAIL.** "Surprise" is used interchangeably with "dissatisfaction" (emotional), not negative log probability.

  **Verdict:** **CONCEPTUAL DECORATION.**
  **Conflict:** The authors frame this as a novel theoretical advance using FEP. The checklist reveals they have taken standard economic utility theory, swapped the vocabulary (Utility $\to$ Free Energy; Satisfaction $\to$ Surprise), and added no mechanistic specificity regarding neural or computational implementation.
  **Journalistic Angle:** "While the authors invoke the Free Energy Principle, their model lacks the computational machinery—specifically precision weighting and generative hierarchies—that defines the theory. Critics argue this is 'physics envy' rather than neuroscience."

  ---

  ## Part 3: Limitations & Hand-Offs

  **What This Checklist Cannot Settle:**
  1.  **Mathematical Validity:** You cannot verify if the variational bounds are correctly derived. If the math looks dense, that is a **[HAND-OFF POINT]** to a computational neuroscientist. A pretty equation can still be wrong.
  2.  **Empirical Truth:** Passing this checklist means the paper *uses* PP correctly, not that PP is the *correct* theory of the brain. You are vetting internal consistency, not external truth.
  3.  **Theoretical Hegemony:** This checklist assumes PP/FEP is a valid framework. It does not help you evaluate papers *critiquing* FEP.
  4.  **Value-Laden Judgments:** Step 4 (Redescription Test) requires you to judge if the new explanation is "better." This is a philosophical judgment about parsimony, not a factual check.

  **When to Call a Specialist:**
  *   If the paper introduces a novel variation of the Free Energy bound (e.g., "Generalized Free Energy").
  *   If the paper claims to resolve the "dark room problem" or other theoretical paradoxes.
  *   If the statistical fitting involves custom Bayesian inference code not standard in the field (e.g., custom MCMC vs. standard SPM/DEM toolboxes).

  **Final Editorial Rule:**
  If a paper uses the words "Prediction," "Error," and "Energy" but cannot identify *what* is being predicted, *how* the error is weighted, or *where* the energy is calculated, it is not neuroscience; it is poetry. Label it accordingly.
