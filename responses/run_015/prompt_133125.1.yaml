answer: |-
  The Metro Ambulance Service deploys "Triage-7," a transparent, linear algorithm that dispatches the single available unit to the call with the highest calculated survival probability. The code is open, the weights public, and the chain of command short: one Medical Director authorizes the protocol, one Dispatcher executes it. When Mrs. Gable suffers a severe asthma attack simultaneously with a cardiac arrest elsewhere, Triage-7 routes the ambulance to the cardiac patient, correctly predicting a higher survival likelihood. Mrs. Gable dies. The Director foresaw that strict adherence would sacrifice low-probability patients like Gable to save more high-probability ones, and the Dispatcher cannot override the assignment without falsifying medical data—an act no reasonable professional would commit. The Service pays the wrongful death settlement immediately; no litigation follows. Manual dispatching is known to be slower and less consistent, resulting in higher overall mortality, making abstention morally impermissible.

  **The Check**

  *   **Blaming the Human:** This is blocked by design. The Dispatcher is causally proximate but morally shielded because overriding requires professional misconduct (falsifying data) to save a patient the system correctly identified as lower priority. The Director is shielded because the policy is ex-ante optimal; blaming them for a specific death implies they should have authorized a sub-optimal policy that kills more people overall.
  *   **Liability:** The Service pays the settlement cleanly. Compensation is made, yet the moral question—"Who chose Mrs. Gable's death?"—remains open. The check clears, but the moral ledger does not balance.
  *   **Abstentionism:** This is unavailable. Returning to human dispatch increases total mortality. Refusing to deploy Triage-7 is morally worse than deploying it and accepting the specific casualties it generates.
  *   **Debunking:** This fails. Mrs. Gable's death was not a malfunction, a freak accident, or a statistical abstraction; it was the deterministic output of a system working exactly as intended to select her for non-service.

  **Analysis**

  The structural feature doing the work is **the decoupling of aggregate risk authorization from particular outcome selection.** The humans authorize the *distribution* of harm, but no human selects the *recipient* of the harm in the moment.

  If this feature is removed—meaning a human dispatcher manually chooses which call to answer based on the same survival data—the **Blaming the Human** response becomes available again. We would hold the dispatcher responsible for choosing the cardiac patient over Mrs. Gable, even if the choice was utilitarian, because a specific agent made a specific choice.

  The strongest objection that there is no gap here is the **Risk Imposition Objection**: Society routinely authorizes systems (speed limits, building codes, vaccination policies) where aggregate benefits justify foreseen individual deaths, and we do not perceive a responsibility gap there. We hold the legislators or regulators responsible, and that suffices.

  **Verdict:** The objection **does not land.** While speed limits impose probabilistic risks, Triage-7 makes a *deterministic* selection of a specific, identifiable victim in real-time. The shift from imposing a *chance* of harm (speed limits) to executing a *certainty* of harm for a named individual (Triage-7), without a specific agent willing to own that particular execution, creates a novel moral residue that traditional risk imposition frameworks cannot absorb.
