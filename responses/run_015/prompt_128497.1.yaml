answer: |-
  The encounter between Willem de Vlamingh's expedition and *Cygnus atratus* on the Swan River in 1697 stands as one of the most celebrated episodes in the history of empirical science. For European naturalists, the discovery of the black swan shattered a millennia-old consensus derived from Juvenal's assertion that a black swan was a rarity akin to a non-existent thing. While traditionally viewed as a straightforward instance of falsification in the Popperian sense, the episode offers a fertile ground for analysing the mechanics of inductive reasoning through the lens of Nelson Goodman's 'new riddle of induction'. By examining the Vlamingh expedition as a case study, one may interrogate Goodman's contention that the validity of induction rests not on logical necessity, but on the entrenchment of linguistic predicates. This essay shall map the inductive structure held by seventeenth-century naturalists, apply Goodman's distinction between projectible and non-projectible predicates to the taxonomic resolution of the black swan, and ultimately assess whether Goodman's linguistic nominalism suffices to explain biological classification.

  To understand the inductive shock of 1697, one must first reconstruct the predicative structure of the pre-Vlamingh naturalist. The prevailing hypothesis was not merely a casual observation but a robust projection: $\forall x (Sx \rightarrow Wx)$, where $S$ stands for 'is a swan' and $W$ for 'is white'. In Goodmanian terms, the predicate 'white' was being projected from observed instances (European swans) to unobserved instances (all potential swans). However, the inductive web was more complex than a simple universal generalisation. Naturalists were implicitly projecting compound predicates. They were not simply expecting 'white'; they were expecting 'swan-white', a conflation of kind and property. Furthermore, one might construct 'grue'-analogues relevant to the era. Consider a predicate 'Euro-white', defined as applying to swans observed in Europe before 1697, and 'black' thereafter. Or, more insidiously, a predicate 'Old-World-Swan', defined as white if observed before the discovery of Australia, and black if observed after. That such predicates were never seriously entertained by the naturalists of the Royal Society or the Académie des Sciences is the first clue to the operation of entrenchment.

  When Vlamingh's crew encountered the black-plumaged birds, the empirical data conflicted with the projected hypothesis. The critical philosophical question is how this conflict was resolved. Logically, the naturalists faced a trilemma. First, they could reject the classification of the bird as a swan, preserving the rule "all swans are white" by defining 'swan' analytically to include whiteness. Second, they could reject the generalisation, maintaining the classification 'swan' while discarding 'white' as a necessary property. Third, they could adopt a non-projectible, *grue*-like predicate, such as "all swans are white until 1697, and black thereafter." Historically, the second path was chosen: the black birds were accepted as swans, and the colour generalisation was abandoned.

  Goodman's framework provides a compelling explanation for why the third option—the *grue*-like predicate—was dismissed. In *Fact, Fiction, and Forecast*, Goodman argues that we project predicates that are 'entrenched', meaning they have a history of successful projection in past inductive inferences. The predicate 'white' is deeply entrenched in the language of colour description; however, the predicate 'swan' is even more deeply entrenched as a kind-term. A *grue*-analogue specific to the 1697 discovery would have zero entrenchment. No naturalist proposed that swans were 'time-coloured' because the predicate 'changes colour based on the date of European discovery' had no history of utility. Thus, Goodman succeeds in explaining the negative: why the inductive community did not descend into scepticism or invent ad-hoc, time-dependent properties to save the phenomenon. The linguistic habits of the scientific community ruled out unentrenched predicates as illegitimate candidates for projection.

  However, the application of Goodman's theory becomes more strained when analysing the choice between the first and second options: why was the kind-term 'swan' preserved at the expense of the property 'white'? For Goodman, this is a matter of relative entrenchment. The predicate 'swan' had been projected successfully across centuries of ornithological classification based on morphology, voice, and behaviour. The predicate 'white', while entrenched as a colour, was less entrenched *as a defining condition of the kind 'swan'* than the morphological features were. When the conflict arose, the scientific community retained the hypothesis that utilised the better-entrenched predicate ('swan' defined by shape and genus) and discarded the weaker projection ('swan' defined by colour). In this view, the revision was a linguistic adjustment; 'white' was demoted from a defining characteristic to an accidental property because the linguistic practice of identifying swans by beak shape and neck curvature was more robustly established than the practice of identifying them by plumage.

  Yet, this purely linguistic account encounters friction when examined against the actual practices of biological taxonomy. Goodman treats the entrenchment of a predicate as a matter of linguistic habit and past usage. However, the decision to classify *Cygnus atratus* as a swan was not merely a reflection of which word was used more often. It was driven by perceived biological realities that transcend linguistic convention. The naturalists recognised morphological homologies—the structure of the bill, the length of the neck, the webbing of the feet—and later, reproductive compatibility. These are criteria of 'natural kinds' that suggest a realism Goodman's nominalism struggles to accommodate. If induction were solely a problem of predicate selection based on past linguistic habit, one could argue that 'white-swans' was a sufficiently entrenched predicate to warrant the creation of a new category for the Australian birds (e.g., 'Aus-swans'). The fact that scientists did not do this suggests they believed they were discovering a pre-existing unity in nature, not merely negotiating a linguistic settlement.

  Goodman's framework is silent on why 'swan' is a 'better' kind than 'white-thing'. For Goodman, 'grue' is invalid because it is unentrenched; but 'swan' is entrenched because it has been used. This risks circularity: we project 'swan' because we have projected 'swan'. It does not explain *why* 'swan' proved to be a more stable category for projection than 'white-thing' in the first place, other than citing historical accident. A biological realist would argue that 'swan' corresponds to a lineage or a morphological cluster that exists independently of human linguistic habits. The Vlamingh episode suggests that the 'projectibility' of 'swan' is grounded in the causal structure of the biological world, not merely in the history of the word's usage. When the black swan was found, the predicate 'swan' survived not just because it was linguistically habitual, but because it tracked a biological reality that colour did not.

  In conclusion, the European encounter with *Cygnus atratus* offers a nuanced validation of Nelson Goodman's new riddle of induction, while simultaneously exposing its limitations regarding natural kinds. Goodman's account succeeds admirably in explaining why the scientific community rejected *grue*-like, time-dependent predicates; the lack of entrenchment for such artificial constructs rendered them non-projectible. Furthermore, his emphasis on entrenchment elucidates why the term 'swan' was not abandoned: the kind-term was more deeply woven into the inductive practices of natural history than the specific colour property. However, the episode ultimately suggests that biological taxonomy relies on criteria—morphological, genetic, and reproductive—that Goodman's logical analysis does not fully capture. The decision to retain 'swan' was not merely a conservation of linguistic habit, but a recognition of underlying biological essences that confer projectibility upon the term. Thus, while Goodman correctly identifies that induction is mediated by predicate selection, the Vlamingh case implies that the authority governing that selection is not solely linguistic, but is anchored in the structure of the natural world itself. Induction, in the biological sciences, remains a dialogue between linguistic habit and natural reality, the latter of which Goodman's framework leaves conspicuously unanalysed.
