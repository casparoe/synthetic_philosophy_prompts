          *   *Wait, a nuance:* Goodman focuses on *projectibility*. "White" is projectible generally. "Swan" is projectible generally. The clash is between a universal generalisation and a counter-instance.
          *   *Goodman's specific contribution:* Why didn't they invent "Euro-swan" (white) and "Aus-swan" (black) or use a time-dependent predicate? Because "swan" is better entrenched than any ad-hoc classification. The predicate "swan" survived because its past projections (identifying birds in Europe) were successful. The predicate "white" failed when projected onto the new domain (Australia).
