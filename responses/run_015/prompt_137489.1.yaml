      *   *Verification:* You can check a map against GPS. You often can't check "utility" or "counterfactual equilibrium." This matters for the *licensing* function. If you can't check the territory, claiming "it's just a map" is a shield against falsification, not a justification for simplification.
      *   *Conclusion:* These aren't pedantry. They strike at the epistemic status of the model. If the territory is mutable or uncheckable, the "map" defense becomes a "get out of jail free" card rather than a methodological stance.

