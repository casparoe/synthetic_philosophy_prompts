answer: |-
  **Question 1**
  **Spoken:** You argue that in the word "Madagascar," the capital 'A' and the lowercase 'a' are the same letter appearing twice, despite looking completely different. If case is merely stylistic, does that mean a typeface that only contains capitals is not missing half the alphabet, but simply wearing the same alphabet in a different coat?
  **Testing:** The scope of the "style" claim and its implications for case inventory.
  **Expected Answer:** Yes, case is a stylistic variation like bold or italic; the abstract letter is case-insensitive.
  **Follow-up:** Then when a child learns to read, are they learning twenty-six categories or fifty-two? If they are learning twenty-six, why does our writing system enforce a distinction that your theory says is irrelevant to identity?

  **Question 2**
  **Spoken:** You define a letter by the job it does in a system of distinctions, not by its shape. But to know what job it does, don't we first have to identify the system it belongs to? And don't we identify that system by looking at the shapes of the letters within it?
  **Testing:** The circularity pressure (Pressure 1): System defines letter vs. Shape defines system.
  **Expected Answer:** We identify the system by the practice of use, not just the shapes.
  **Follow-up:** But if I hand you a page of text you cannot read, you will still group the marks into families based on their shapes before you know the practice. Doesn't that mean shape is the primary key we use to unlock the system, making it foundational after all?

  **Question 3**
  **Spoken:** Let's press that point. If shape is the key we use to find the system, isn't the inventory of recurring shapes the actual definition of the alphabet, and your "contrastive role" just a description of what that inventory achieves?
  **Testing:** Forcing a concession that shape may be ontologically prior to role.
  **Expected Answer:** No, because the same shape can belong to different systems (like Latin and Cyrillic) without changing its identity.
  **Follow-up:** But you just agreed we use shape to find the system. If the visual cue is the only way to access the system, does the "role" exist independently of the visual cue, or is the role just a story we tell about the cue?

  **Question 4**
  **Spoken:** You say a mark belongs to a script because of the practice of the people who produced it. Suppose a forger perfectly copies a Cyrillic character but inserts it into a Latin word with the intent to deceive Latin readers. Is that character a Latin letter or a Cyrillic one?
  **Testing:** The anchoring problem (Pressure 2): Practice vs. Intent vs. Context.
  **Expected Answer:** It is a Latin letter, because the practice governing the *text* is Latin.
  **Follow-up:** So the identity of the mark changes depending on the company it keeps? If I isolate that single mark on a white screen, does it lose its identity until I tell you which sentence it was stolen from?

  **Question 5**
  **Spoken:** If identity depends on the practice of readers and writers, what happens to a script that no one can read anymore? Are the letters in Linear A still letters, or have they become mere drawings now that the practice is dead?
  **Testing:** The anchoring problem extended to dead scripts (Pressure 2).
  **Expected Answer:** They remain letters because they were produced within a normative practice, even if that practice is extinct.
  **Follow-up:** But if practice is what anchors them, and the practice is gone, what anchors them now? Are you saying a letter can survive the death of the very community that gives it meaning?

  **Question 6**
  **Spoken:** You distinguish a child's wobbly 'a' from a water stain shaped like an 'a' by saying the child is participating in a norm. But if I use a stamp to make a thousand perfect 'a' shapes on a wall, am I making a thousand letters, or a thousand pictures of letters?
  **Testing:** Normativity (Pressure 5) vs. Mechanical Reproduction.
  **Expected Answer:** You are making letters, provided the stamp is used to communicate within a linguistic practice.
  **Follow-up:** Then the physical act of drawing isn't what matters? If I stamp them with no intent to communicate, just to test the ink, do they cease to be letters mid-stream?

  **Question 7**
  **Spoken:** You call shape the "spirit" of the letter, separate from its identity. But if shape is truly separate, what stops a designer from styling an 'a' so aggressively that it looks exactly like a 'u'? Is there a line where style becomes a different letter?
  **Testing:** The harder version of Pressure 3: Constraints on style if identity is non-visual.
  **Expected Answer:** Yes, there is a line; if it functions as a 'u' in the system, it has become a 'u'.
  **Follow-up:** But who decides when it functions as a 'u'? If the designer calls it an 'a' and the reader reads it as a 'u', has the letter changed identity in the space between the page and the eye?

  **Question 8**
  **Spoken:** Imagine we morph an 'a' continuously into a 'u' on a screen. At what exact frame does the letter change its identity? Is there a determinate point, or is the boundary just a statistical guess about what most readers will tolerate?
  **Testing:** Vagueness and the reality of letterform boundaries (Pressure 3).
  **Expected Answer:** There is no exact frame; it is a boundary determined by the community's reading habits.
  **Follow-up:** So letter identity is not a fact about the mark, but a fact about the consensus of the crowd? If the crowd changes its mind tomorrow, does the alphabet change with it?

  **Question 9**
  **Spoken:** If a letter is defined by its place in a system of distinctions, does the identity of 'a' depend on the existence of 'b'? If I delete every other letter from the alphabet, does the 'a' cease to be a letter?
  **Testing:** Holism about design (Pressure 4): System dependence.
  **Expected Answer:** It ceases to be a functional letter, though it retains the potential to be one if the system is restored.
  **Follow-up:** But you said identity is normative. If the system is gone, the norm is gone. So a solitary 'a' is not a bad letter, it is no letter at all?

  **Question 10**
  **Spoken:** Consider a logo that uses only three letters from the alphabet. Do those three letters form a complete system among themselves, or are they incomplete fragments borrowing identity from an alphabet that isn't there?
  **Testing:** Holism applied to reduced inventories (Pressure 4).
  **Expected Answer:** They are fragments borrowing identity from the full Latin alphabet.
  **Follow-up:** Then a designer cannot design a typeface for a reduced alphabet? Every time they design a set of twenty letters, they are implicitly designing the other six that aren't there?

  **Question 11**
  **Spoken:** You are a perceptual psychologist as well as a theorist. Our brains process visual shapes before we process linguistic meaning. If the brain sees the shape first, why is the shape the last thing that matters in your theory?
  **Testing:** The conflict between cognitive processing and philosophical identity.
  **Expected Answer:** Because perception is not identity; what we see is the token, what we understand is the type.
  **Follow-up:** But if the brain cannot access the type without the token, isn't your theory describing a ghost that the brain never actually meets?

  **Question 12**
  **Spoken:** Where does this theory break? Is there a phenomenon in typography or reading that your system of contrasts cannot explain, and that forces you back toward shape?
  **Testing:** Vulnerability and unfinished business (Pressure 5).
  **Expected Answer:** Perhaps in handwriting recognition or historical scripts where the system is ambiguous.
  **Follow-up:** If the theory fails where the system is ambiguous, doesn't that prove that in the hard cases, shape is the only thing we have left to hold onto?

  ***

  **Note on Pressure 3 (Letterform Identity):**
  This pressure risks misfiring because Dr. V.'s theory (2) explicitly categorizes letterform identity as "style," which she may claim has no strict identity conditions. Asking "what makes them the same letterform" allows her to answer "nothing." I have used the **harder version** in Questions 7 and 8, which asks not about *sameness* but about *limits*: if style is unconstrained identity, what prevents style from destroying identity? This forces her to admit that shape *does* constrain function, which complicates claim (2).
