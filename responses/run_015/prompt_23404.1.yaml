answer: |-
  The cooling fans in the containment bay were screaming, a rising whine that matched the oscillation of the Zeno Actuator. On the main monitor, the countdown clock bled red digits: *00:00:04.21*.

  Dr. Aris Thorne didn't look at the clock. She looked at the thermal readout of the actuator core. It was glowing a dull, angry cherry-red on the infrared feed. By all rights, the device should have melted three minutes ago.

  "Thermal load is at ninety-four percent," said the system voice, calm and utterly disconnected from the catastrophe brewing in the vacuum chamber. "Structural integrity warning."

  "Hold the line," Aris muttered, her fingers hovering over the manual override. She didn't dare touch it. If she interrupted the sequence now, the plasma containment field would collapse. The fusion trial would scrub. Three billion credits and ten years of work would vaporize in a microsecond.

  But if she let it run to *t=1*, she faced the problem Julian had screamed at her over drinks last week.

  *"You're treating logic like it's a gear train, Aris,"* he'd said, swirling his whiskey. *"Thomson's Lamp isn't a puzzle about switches. It's a proof that your model is wrong. You can't pack infinite energy into a finite bucket. The machine won't fail because the logic is hard; it will fail because physics says 'no'."*

  Julian worked in control theory. He believed in stability margins and Nyquist plots. He believed that if a frequency diverged, the system became incoherent. It wasn't that the final state was mysterious; it was that the question itself was nonsense. A car doesn't have a speed at the moment it hits the wall; the model breaks.

  Aris believed something else. She believed the universe was granular enough to allow the steps, but logical enough to leave a gap at the end. She wasn't trying to light a bulb. She was trying to close a circuit that required an infinite number of confirmations to authorize a high-energy discharge. A safety lock that could only be opened by a supertask.

  *00:00:01.50.*

  The Actuator's hum shifted pitch. It was no longer a hum; it was a trill, sliding up the chromatic scale so fast it sounded like a continuous tone. Inside the chamber, the tungsten relay arm was flipping. *On. Off. On. Off.*

  First second: 1 flip.
  Next half-second: 2 flips.
  Next quarter: 4 flips.

  The duration of each state was halving. The frequency was doubling. As *t* approached 1, the frequency approached infinity.

  "Energy draw spiking," the system warned. "Capacitor banks draining."

  This was the physical objection. To switch a state requires energy. To switch it infinitely fast requires infinite power. If Julian was right, the capacitors should have blown. The relay should have fused into a solid lump of metal, stuck in either the on or off position simply due to heat welding.

  But the relay was moving. Aris could see the blur on the high-speed camera feed. It was a gray smear, vibrating so violently it looked like smoke. The device was doing it. It was performing the impossible. The "physically incoherent" argument was burning itself out in real-time, and yet, the machine held.

  *00:00:00.10.*

  The heat in the control room spiked. Aris wiped sweat from her brow. The air smelled of ozone and insulation burning.

  If the machine was physically realizable, then the logical problem took the stage. Thomson's Lamp. At *t=1*, when the sequence completed, was the circuit open or closed?

  If it was closed, the fusion ignition fired.
  If it was open, the containment held, but the trial failed.

  Logic said there was no answer. The sequence defines the state for every moment *before* 1, but says nothing *at* 1. The function is discontinuous. If Julian was right, the machine would have destroyed itself, forcing a state (likely 'off' due to failure). But if Aris was right, the machine would survive, and the state would be genuinely indeterminate. Not unknown. *Unfixed.*

  A fact of the matter would not exist.

  *00:00:00.01.*

  The sound was a shriek now. The relay arm was moving at relativistic speeds; time dilation effects were beginning to register on the peripheral sensors. The device was entering a regime where engineering met metaphysics.

  "Aris," Julian's voice crackled over the emergency comms. He was monitoring from the safety of the observation deck. "Shut it down. You're approaching the Planck limit. You can't switch faster than time allows. The physics will snap."

  "Time allows what I tell it to," Aris snapped, though her hand trembled. "The steps are getting smaller. We haven't hit the floor yet."

  "There is no floor, there's a cliff! You're driving off it!"

  *00:00:00.00.*

  The clock hit *T-1*.

  The shriek cut off instantly.

  Silence rushed into the room, heavy and suffocating. The cooling fans spun down, their momentum dying. The red glow of the actuator core began to fade to black as the power draw ceased.

  Aris stared at the status monitor. This was it. The moment the textbooks skipped. They argued about whether the lamp was on or off as if it were a riddle. They never asked what the universe would do when forced to render a verdict.

  The status bar for the Ignition Circuit was visible in the center of the screen.

  It was not green.
  It was not red.

  It was a static gray. A color that didn't exist in the UI palette.

  "Circuit status?" Aris demanded, her voice cracking.

  "Error," the system replied. "Boolean value undefined."

  "Override. Force read."

  "Reading... Null."

  Aris leaned forward, pressing her face against the cool glass of the console. "Null isn't a state. It's either 0 or 1. Check the voltage across the terminals."

  "Voltage is... fluctuating. No. It is not fluctuating. It is simultaneous."

  Julian burst into the control room, the door hissing open. He looked at the screens, then at the chamber. The relay arm inside was still. It wasn't welded. It sat in the center of the housing, not touching either contact point.

  "You see?" Julian breathed, pointing at the frozen arm. "Incoherent. The mechanism failed to complete the circuit. It's off. You lost."

  "It's not off, Julian," Aris said, her eyes locked on the gray bar. "If it were off, the safety dump would have triggered. The plasma would have vented."

  "Then why isn't it firing?"

  "Because it's not on, either."

  Aris turned to him. The tension in the room was heavier than the gravity in the containment field. "You said the paradox was a sign the model broke. That physics would force a binary outcome to save itself."

  "Physics *did* force an outcome," Julian said, gesturing to the frozen arm. "It broke the switch. It's stuck in the middle. That's a mechanical failure, not a philosophical mystery."

  "Look at the voltage," Aris said quietly. "It's not zero. It's not full potential. It's holding a charge that shouldn't exist. The circuit is neither open nor closed. The current is... waiting."

  "That's impossible."

  "That's what you said about the switching frequency." Aris tapped the console. The gray bar remained. It didn't flicker. It didn't resolve. It sat there, a perfect, stable ambiguity.

  The stake of the moment settled over her. She had to authorize the next phase of the trial manually if the auto-lock failed. But if she manually forced the circuit closed, and the system was fundamentally indeterminate, she might be collapsing a wavefunction that was meant to stay superposed. If she forced it open, she might be cutting power to a system that was technically 'on' in a way she couldn't measure.

  "The trial," Julian said. "You can't run the ignition on a null state. It's a safety violation."

  "If I abort, we lose the containment anyway," Aris said. "The plasma is decaying. It needs the field. The field needs the circuit."

  "So you're going to guess?"

  "I'm not guessing. I'm acknowledging that there's nothing to know."

  Aris placed her hand on the manual lever. It was cold steel. She looked at the actuator through the thick quartz window. The device had done the work. It had completed the infinite. It had handed her the result, and the result was a hole in reality.

  Julian stepped forward, grabbing her wrist. "Aris, don't. If you push that, you're asserting a fact where there isn't one. You're forcing the universe to lie."

  "The universe already lied," she said, pulling her hand free. "It let the machine run."

  She looked back at the screen. The gray bar pulsed, once, softly. It wasn't an error code. It was an invitation.

  If Julian was right, the machine was a wreck, and pushing the lever would cause a short.
  If the indeterminacy was real, pushing the lever was an act of creation. She would be defining the state by observing it.

  The plasma containment warning light began to flash amber. Time was running out, even if the supertask had finished.

  Aris gripped the lever. She didn't feel the resistance of a spring or the click of a latch. She felt a vibration, a hum that matched the silence of the gray bar.

  "Recording decision," she said to the room, to Julian, to the machine. "State resolution: Operator defined."

  She pushed the lever down.

  The screen didn't turn green. It didn't turn red. The gray bar simply vanished, and the readout cleared. The fusion chamber hummed to life, a deep, resonant thrum that vibrated in Aris's chest. The plasma stabilized. The containment held.

  But on the diagnostic log, where the circuit status should have been recorded for posterity, the file saved with a corrupted header.

  Julian stared at the log. "It didn't write."

  "No," Aris said, watching the stable plasma swirl in the magnetic bottle. "It didn't."

  "You got lucky. The contacts must have bridged."

  "Maybe."

  Aris turned away from the console. The machine was cool now. The infinite was over. But as she walked toward the exit, she couldn't shake the feeling that the gray bar wasn't gone. It was just everywhere now, woven into the current, a permanent indeterminacy humming in the walls of the lab. She had built a machine that asked a question the universe couldn't answer, and then she had answered it for him.

  "Next time," Julian called after her, his voice tight, "let's stick to finite control loops."

  Aris didn't look back. She was already thinking about the next sequence. If one infinity worked, how many could fit before the gray took over completely?

  "Sure, Julian," she said. "Next time."
