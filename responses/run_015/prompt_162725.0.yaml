answer: |-
  Here are the seven objections you'll face, ordered by seminar dynamics.

  **1. Behavioural Ecologist (Inclusive Fitness)**
  **Q:** "If high relatedness aligns fitness, why do we need bottlenecks? Inclusive fitness already predicts the evolution of altruism without your extra criterion."
  **A:** Inclusive fitness predicts allele frequency change; it doesn't establish entityhood. Bottlenecks physically align fitnesses by resetting lower-level variance. High relatedness helps, but without reset, lower-level selection persists and undermines the group.
  **Soft spot:** Conflates fitness alignment with ontological status.
  **Tags:** Likelihood: High (Conf: 95%), Damage: Med (Conf: 80%).

  **2. Social-Insect Person (Budding)**
  **Q:** "Many eusocial colonies reproduce by budding or swarming, not single-queen founding. Are you saying honeybee colonies aren't genuine units of selection?"
  **A:** I'm claiming colony-level adaptation is weaker in budding species. Swarming leaks worker variance. My criterion predicts more internal conflict there than in single-queen foundresses. Check the empirical record for conflict levels.
  **Soft spot:** Empirical claim about conflict might be wrong.
  **Tags:** Likelihood: Med (Conf: 80%), Damage: High (Conf: 90%).

  **3. Microbial Experimentalist (Cheaters)**
  **Q:** "In serial transfer, cheaters evolve within the bottle before transfer. The bottleneck resets, but variance regenerates fast. Does the unit status flicker?"
  **A:** It's a race between variance regeneration and reset frequency. My criterion is a gradient, not binary. If cheating outpaces transfer, the colony loses unit status temporarily. It's dynamic.
  **Soft spot:** Makes criterion vague/gradient rather than sharp.
  **Tags:** Likelihood: High (Conf: 90%), Damage: Med (Conf: 70%).

  **4. Theoretician (Partition Invariance)**
  **Q:** "The Price equation decomposition is partition invariant. Your bottleneck is just a specific partition choice. What math does this actually change?"
  **A:** The decomposition sums to the same total. My criterion identifies which partition supports counterfactual interventions on the higher-level entity. It's about causal capacity and manipulability, not accounting sums.
  **Soft spot:** "Causal capacity" may sound like hand-waving.
  **Tags:** Likelihood: High (Conf: 95%), Damage: High (Conf: 85%).

  **5. Philosopher Pluralist (Reality)**
  **Q:** "Why deny reality to levels without bottlenecks? Aggregates can still have emergent properties and stable dynamics. Why privilege one level?"
  **A:** I grant aggregates exist. I deny they are units of *evolution*. Without bottlenecks, they don't reproduce with heritable fidelity. Existence isn't adaptation. I'm defining the evolution condition.
  **Soft spot:** Semantic sleight of hand.
  **Tags:** Likelihood: Med (Conf: 85%), Damage: Low (Conf: 90%).

  **6. Philosopher Eliminativist (Framework)**
  **Q:** "This whole 'unit of selection' talk is a category error. Selection is a process, not a thing. Why reify entities?"
  **A:** Selection is a process, yes. But processes require participants. I'm defining the conditions under which collectives become participants rather than just arenas. We need entities for evolution.
  **Soft spot:** Might not satisfy eliminativist.
  **Tags:** Likelihood: Low (Conf: 70%), Damage: Med (Conf: 60%).

  **7. The Question You Hope Nobody Asks (Human Culture)**
  **Q:** "What about cultural transmission in humans? Memes have bottlenecks (teachers). Does that make human groups real units after all, contradicting your vertebrate claim?"
  **A:** If cultural transmission bottlenecks reset variance, yes, human groups could be units. But usually cultural variance leaks. On my view, it's an empirical question, not ruled out a priori.
  **Soft spot:** Undermines the human exclusion claim.
  **Tags:** Likelihood: Low (Conf: 60%), Damage: High (Conf: 95%).

  **Weakest Reply:**
  The Social-Insect reply (2) is your biggest risk. If budding colonies show low conflict despite lacking tight bottlenecks, your criterion fails empirically. You're betting on conflict data that might not exist. The Theoretician (4) is close second; if "intervention" isn't mathematically formalized, they'll smell hand-waving. Stick to the causal graph analogy, but be ready to sketch it.
