answer: |-
  The town of Oakhaven manages a housing surplus generated exclusively by a voter-approved levy intended to fulfill a binding international resettlement pledge, distinct from the national welfare safety net. A local citizen, displaced by a fire, applies for emergency housing, as does a refugee family who meets the pledge criteria but faces severe bureaucratic delays in work authorization. The citizen needs the home to avoid shelter dependency; the refugees need it to avoid deportation, but without work permits, their long-term stability is uncertain regardless of housing.

  **Moderate Nationalism** prioritizes the integrity of the shared cooperative scheme. Since the fund was institutionally designated by the community for resettlement, diverting it to citizens violates the specific covenant binding the polity, undermining the rule-of-law and trust that define their citizenship. Thus, nationalism demands helping the foreigner to honor the institution itself. **Strong Cosmopolitanism** weighs interests impartially, treating nationality as invisible. However, because legal barriers reduce the efficacy of aid for the refugees (low utility gain due to deportation risk) compared to the citizen (high utility gain via stability), cosmopolitanism demands helping the compatriot to maximize overall welfare.

  The feature doing the work is **the mismatch between Institutional Mandate and Aid Efficacy**. The nationalist is bound by the *rules of the scheme* (which favor the foreigner), while the cosmopolitan is bound by *outcome metrics* (which favor the local due to external friction). If you remove the specific mandate (making it a general tax fund), nationalism collapses back to "help your own." If you remove the bureaucratic barriers (making efficacy equal), cosmopolitanism collapses back to "help the neediest" (likely the refugee). The reversal only holds while the institution points outward but the logistics point inward.
