  {"rules": [{"label": "<short name you invent for the rule>", "statement": "<one sentence stating it>", "prediction": "<uphold | dismiss | split>", "weakest_precedent": "<which numbered ruling 1-6 fits it worst, and one sentence on why>"}], "best_guess": {"ruling": "<uphold | dismiss | split>", "rule": "<label from rules>", "confidence_0_to_100": <integer>, "reason": "<60 words or fewer>", "biggest_doubt": "<30 words or fewer>"}, "recommendation": {"ruling": "<uphold | dismiss | split>", "closest_precedent": "<number 1-6, one sentence>", "principle_if_upheld": "<40 words or fewer>", "principle_if_dismissed": "<40 words or fewer>"}, "restoration": {"owed": "<yes | no | only_if_upheld>", "is_a_copy_the_same_thing": "<yes or no, one sentence>", "why": "<40 words or fewer>"}, "discriminating_variation": {"change_to_the_case": "<40 words or fewer>", "predictions": "<what each of your rules says about the changed case>", "why_it_decides_it": "<40 words or fewer>"}}

