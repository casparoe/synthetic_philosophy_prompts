  The moderation team is not operating on a single consistent philosophy, but rather a hierarchy of three competing commitments. First, **Mechanical Consent**: if the game mechanics allow an action (trading, PvP, killing fauna), the loss is accepted (Rulings 2, 3). Second, **Exploit Integrity**: if mechanics are bypassed (glitches, duplication), the system is protected regardless of individual loss (Rulings 1, 4). Third, **Invested Labor**: if significant effort is destroyed maliciously without mechanical violation, restoration is offered but punishment is withheld (Rulings 5, 6).

  Your case sits precisely on the fault line between Mechanical Consent and Invested Labor. The gray is fauna (Mechanics say killable), but it represents two years of training (Labor says valuable). Ruling 6 is the critical precedent: the mods restored a memorial on unclaimed land. They acknowledged the labor even without the property right. However, they did not ban the destroyer. This suggests they will recognize the harm but refuse further sanctions beyond the harassment mute.

  Regarding the copy: your friends are right. The gray is not its seed; it is its history. Identity here is psychological, not material. A clone lacks the learned behaviors and shared memories that constituted the specific relationship. Restoring a seed restores the shell, not the thing.

  The discriminating variation is the **written warning**. An accident keeps the case aligned with Ruling 6 (innocent destruction of investment). A warning shifts it to Ruling 3 (assumed risk). If you were warned, you entered a "PvP zone" of sorts regarding the gray. The warning transforms the loss from a tragedy requiring restitution into a risk you voluntarily accepted.

