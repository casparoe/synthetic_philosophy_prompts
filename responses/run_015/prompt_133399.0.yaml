      *   **Task:** Identify unresolved questions in the literature that matter for this application, rank them (upstream, tractable, game-changers), keep it casual, no citations, under 200 words max, no book lists.
      *   **Constraints:** Casual tone, < 200 words, no citations, no book titles.

  2.  **Identify Key Concepts:**
      *   Fortune (random shocks, luck, external chaos).
      *   Virtù (skill, agency, adaptability, prowess).
      *   Collective vs. Individual (Machiavelli focused on the Prince).
      *   Modern Application (writers' room, collaborative decision-making).

  3.  **Drafting - Step 1 (Brainstorming Questions):**
      *   Can a group have virtù or just individuals?
      *   Is fortune external or created by internal friction?
      *   Does democratic decision-making slow down response to fortune?
      *   Is virtù about prediction or reaction?
      *   How does trust factor into collective virtù?

  4.  **Drafting - Step 2 (Selecting & Ranking):**
      *   *Upstream:* Can virtù be distributed? (If not, the whole premise fails).
      *   *Tractable:* Is fortune just unmodeled risk? (Easier to model in a plot).
      *   *Game-changer:* Does consensus kill virtù? (High stakes for drama).

  5.  **Drafting - Step 3 (Writing & Editing for Constraints):**
      *   *Draft:* For your writers' room collective, the biggest upstream question is whether virtù can actually be distributed. Machiavelli focused on one guy; if a group dilutes agency, your protagonists are doomed before starting. Treat this as the core tension: does democracy slow down the pivot when fortune strikes?
      *   Next, tackle tractability: Is fortune just unmodeled risk? For a novel, treat fortune as plot twists the room didn't see coming. It's easier to write if fortune is external chaos, not internal incompetence.
      *   Finally, the flipper: Does consensus kill virtù? If your group needs unanimity, they might miss the window to act. If one person can seize the moment, the dynamic shifts. This changes your power structure mid-story.
