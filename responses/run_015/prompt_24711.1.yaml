answer: |-
  1. "What each side actually says"
  Hempel insists on the Equivalence Condition: if evidence $E$ confirms hypothesis $H$, and $H$ is logically equivalent to $H'$, then $E$ confirms $H'$. Since "All ravens are black" is equivalent to "All non-black things are non-ravens," observing a non-black non-raven (white sock) confirms the contrapositive, thus confirming the original. Bayesians accept this formally: $P(H|E) > P(H)$, but argue the increase is negligible because non-black objects vastly outnumber ravens, making the likelihood ratio near unity. They treat confirmation as purely probabilistic increment. Relevance theorists reject the Equivalence Condition for confirmation. They argue confirmation requires a projectible predicate or a causal mechanism; a white sock lacks any causal link to raven pigmentation, so $E$ does not confirm $H$, regardless of logical equivalence. They prioritize intuitive relevance and counterfactual support over syntactic logic, denying that logical equivalence preserves confirmatory power in natural language contexts.

  2. "Where the disagreement actually lives"
  Your intuition is largely correct: it is an equivocation on "confirm," but not merely semantic. It reflects a clash between syntactic logic and pragmatic epistemology. Hempel treats confirmation as a logical relation between propositions, where equivalence must hold universally. Bayesians treat it as a mathematical change in credence, where any positive increment counts as confirmation, regardless of utility. Relevance theorists treat it as a tool for prediction and explanation, requiring a nomic or causal connection. The disagreement lives in whether confirmation is *context-independent* (Hempel) or *context-sensitive* (Bayesian/Relevance). When Bayesians say "yes," they mean "strictly speaking, your credence should shift according to the calculus." When Relevance theorists say "no," they mean "this evidence is useless for scientific inquiry and should be ignored." They aren't disagreeing on the probability math; they are disagreeing on whether mathematical increment equals epistemic value. The paradox persists because Hempel's conditions describe a logical ideal that fails to map onto human reasoning processes, while critics demand a theory of reasoning, not just logic. Furthermore, the "black sock" issue highlights that background knowledge determines the direction of the shift, which Hempel's syntactic approach ignores entirely.

  3. "Is it verbal or substantive"
  It is verbally framed but substantively rooted in competing epistemic norms. The parties agree on the probability calculus but disagree on whether satisfying it constitutes meaningful scientific support. The deciding sentence is: They are using the same word to describe two different normative standards—one for logical consistency and one for practical inquiry. If you define confirmation as "any probability increase," the paradox dissolves; if you define it as "relevant support for prediction," the paradox vanishes because the sock is excluded. The stalemate exists because philosophers refuse to concede which norm governs scientific reasoning, masking a value judgment about knowledge behind a technical debate.

  4. "What would count as progress"
  Progress requires abandoning the search for a single, context-free definition of confirmation. We need a dual-concept theory: "incremental confirmation" (Bayesian probability shift) and "significant confirmation" (relevance/utility). A theorem showing how background knowledge modulates the likelihood ratio could formalize the Relevance intuition within Bayesianism, bridging the gap. Alternatively, experimental philosophy could test whether intuitive judgments of confirmation track probability shifts or causal relevance, settling which norm aligns with human cognition. However, honest assessment suggests nothing will fully resolve it because the paradox exposes a tension between formal logic and informal reasoning that cannot be eliminated, only managed. We must accept that logical equivalence preserves truth but not evidential weight, requiring us to explicitly state which concept of confirmation we are using in any given argument. A standardized taxonomy separating logical entailment from evidential support would prevent the equivocation fueling the stalemate.
