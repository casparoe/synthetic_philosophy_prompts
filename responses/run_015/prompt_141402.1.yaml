prompt: |-
  I teach one fifty-minute section next week introducing the Frege–Geach problem to second-years who can recite the non-cognitivist package — moral judgments are not beliefs, they are desire-like states that assertion expresses — but who have met none of the responses. Give me a plan for the hour, not an explanation of the problem.

  My half-formed idea is about sequencing. Presentations I have seen all open with the moral modus ponens, and I now think that is a mistake: the conditional is exactly the embedding where the standard reply, states directed at combinations of states, gets its grip most easily, so students conclude they have answered the problem before they have felt it. I want to open with negated and disjoined moral sentences instead — Murder is not wrong, and Either lying is wrong or promise-breaking is — where there is no tidy combination of attitudes for that reply to take hold of, and only then move to the conditional and to inference. Tell me whether that ordering survives scrutiny, what it costs (I worry it lets the problem look like a puzzle about disapproval rather than about validity), and whether I should also drop the usual warm-up of paraphrasing each moral clause into an attitude and watching the argument stop looking valid, which has always struck me as making the whole thing feel like a parlor trick.

  Then: the one example that should carry the hour and what it must have and lack; the misconceptions in the order they will form — I expect the crude boo–hurrah caricature, the idea that expressivists can simply hand over a truth-conditional semantics, and the conflation of this problem with the problem of moral disagreement — each with the point in the sequence where it should be defused; what I need to say about validity before any semantics is on the board; what to decline to get into at this level; and one question for the last five minutes that would show me a student has the problem rather than the slogan.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** Second-year undergraduates (likely Philosophy). They know the basics of non-cognitivism/emotivism/expressivism (moral judgments = desires/attitudes, not beliefs/truth-apt). They have *not* met responses to the Frege-Geach problem.
      *   **Time:** 50 minutes (one section).
      *   **Topic:** Introducing the Frege-Geach Problem.
      *   **Instructor's Idea:** Change the standard sequencing. Instead of starting with Modus Ponens (conditionals), start with Negation and Disjunction ("Murder is not wrong", "Either lying is wrong or...").
      *   **Instructor's Concerns:**
          *   Does this new ordering survive scrutiny?
          *   What are the costs? (Risk: makes it look like a puzzle about disapproval rather than validity).
          *   Should I drop the "paraphrase into attitudes" warm-up? (Risk: feels like a parlor trick).
          *   Need: One core example to carry the hour (features/limitations).
          *   Need: Anticipated misconceptions (Boo-Hurrah caricature, truth-conditional surrender, disagreement conflation) + when to defuse them.
          *   Need: What to say about validity *before* semantics.
          *   Need: What to *exclude* (scope creep).
          *   Need: One final assessment question.

  2.  **Evaluate the Instructor's Sequencing Idea (Negation/Disjunction $\rightarrow$ Conditionals):**
      *   *Standard Approach:* Start with Modus Ponens (If stealing is wrong, then getting your little brother to steal is wrong...). Why? Because it highlights *logical validity* immediately.
      *   *Instructor's Approach:* Start with Negation/Disjunction. Why? To block the "complex attitude" reply (e.g., being for blaming for not blaming) too early.
      *   *Critique:* The instructor is right that starting with conditionals allows sophisticated expressivists (like Gibbard or Blackburn) to wave hands at "higher-order attitudes" too quickly. However, the *core* of Frege-Geach is about *validity* and *consistency*, not just semantic content. Negation and disjunction are truth-functional operators in standard logic. If moral sentences aren't truth-apt, how do these operators work?
      *   *Verdict:* The sequencing is strong pedagogically *if* managed carefully. It forces the student to feel the semantic gap before offering the logical solution. The risk (making it about "disapproval") is real but manageable if the transition to validity is sharp.
      *   *Warm-up:* The "paraphrase into attitudes" exercise is actually crucial *if* the goal is to show why the inference *seems* to break. Dropping it might make the problem abstract. Keep it, but frame it as "Why does this look like a non-sequitur?" rather than "Look, it's silly."

  3.  **Develop the Core Example:**
      *   Needs to be simple, intuitive, and allow for Modus Ponens later.
      *   *Standard:* Stealing/Wrong.
      *   *Requirement:* Must allow negation and disjunction initially, then conditional.
      *   *Selection:* "Stealing is wrong." It's the classic for a reason. It's atomic.
      *   *Must Have:* Clear moral content, clear logical structure.
      *   *Must Lack:* Extraneous empirical claims, complex deontic logic (keep it propositional).

  4.  **Map Misconceptions & Defusal Points:**
      *   *Misconception 1: Boo-Hurrah Caricature.* (It's just shouting).
          *   *Defusal:* Early. Distinguish sophisticated expressivism (commitment/plan) from simple emotivism (shouting).
      *   *Misconception 2: Truth-Conditional Surrender.* (Just assign truth values).
          *   *Defusal:* Middle. Explain why this abandons the core metaphysical motivation (non-cognitivism).
      *   *Misconception 3: Moral Disagreement.* (It's just about arguing).
          *   *Defusal:* Late/End. Distinguish semantic embedding from pragmatic disagreement.

  5.  **Drafting the Plan (Iterative Process):**

      *   *Minute 0-5:* Setup. Define Non-Cognitivism (NC).
      *   *Minute 5-15:* The New Opening (Negation/Disjunction). Use the "Paraphrase" warm-up here but pivot quickly to "What does 'not' do?"
      *   *Minute 15-25:* The Shift to Validity (Modus Ponens). Connect the semantic gap to the logical gap.
      *   *Minute 25-35:* The "Easy Way Out" (Truth Conditions) & Why NC rejects it.
      *   *Minute 35-45:* The Expressivist Attempt (Higher-order attitudes) & Why it's hard.
      *   *Minute 45-50:* Assessment Question.

      *Refining the "Validity before Semantics" point:* This is crucial. We need to establish that logic cares about form, not psychological state. If the form is the same, the validity should hold. If NC changes the form (by changing the meaning of the terms in embedded contexts), validity breaks.

      *Refining the Exclusions:* No deep dive into Blackburn's quasirealism, Gibbard's norm-expressivism, or Ridge's ecumenicism. No meta-ethical defense of NC. Focus strictly on the *semantic/logical* tension.

      *Refining the Final Question:* Needs to test if they see the *structural* problem, not just the moral one.

  6.  **Addressing Specific Instructor Queries:**
      *   *Sequencing:* Endorse it, but warn about the "validity" pivot.
      *   *Warm-up:* Keep it, but frame it as diagnostic, not dismissive.
      *   *Core Example:* "Stealing is wrong."
      *   *Misconceptions:* Map them to specific minutes.
      *   *Validity:* Define it as preservation of truth/commitment across *unchanged* meanings.
      *   *Exclusions:* Quasi-realism details, historical exegesis (Frege vs. Geach).
      *   *Final Question:* Construct a parallel non-moral argument to test structural insight.

  7.  **Final Polish:** Check tone (collegial, precise), timing (50 mins is tight), and alignment with the "no explanation of the problem" constraint (focus on *plan*). *Self-Correction:* The prompt asks for a plan, not an explanation of the problem. I must ensure I don't spend the response explaining Frege-Geach to the user, but rather designing the class.

      *Wait, one nuance:* The instructor says "not an explanation of the problem." They want a lesson plan. I need to make sure I don't just lecture them on Frege-Geach in the response.
      *Wait, another nuance:* The instructor asks "Tell me whether that ordering survives scrutiny." I need to answer that directly first.

      *Re-evaluating the "Negation First" strategy:*
      *   *Pros:* Prevents premature "complex attitude" solution. Forces confrontation with semantic content.
      *   *Cons:* Frege-Geach is fundamentally about *inference*. Negation alone isn't an inference. Disjunction alone isn't an inference. You need the conditional to get the *logical* problem (validity).
      *   *Synthesis:* Start with Negation/Disjunction to show the *semantic* anomaly (what is being expressed?), then move immediately to Modus Ponens to show the *logical* consequence (validity collapses). The ordering works if the transition is explicit: "If we can't say what 'not' does here, we can't say why this argument works."

      *Warm-up:* The "paraphrase" trick is actually the *best* way to show the problem. If you paraphrase P1 and P2 differently, the middle term shifts. I should advise *keeping* it but ensuring it's used to demonstrate *equivocation*, not just to mock expressivism.

      *Final Question:* Needs to be a "transfer" task. If they understand FG, they should see it applies to other non-cognitive domains (e.g., imperatives, taste).

  8.  **Finalizing the Structure of the Response:**
      1.  Verdict on Sequencing (Yes, with caveats).
      2.  Verdict on Warm-up (Keep, but reframe).
      3.  The One Example (Criteria).
      4.  Minute-by-Minute Plan (incorporating misconceptions).
      5.  Validity Prelude.
      6.  Exclusions.
      7.  The Final Question.

      *(Self-Correction during drafting)*: Keep the tone professional and direct. The user is a colleague.

      *Wait, checking the "Validity before Semantics" constraint:* The user asks "what I need to say about validity before any semantics is on the board." This means I need to specify the *concept* of validity the students must grasp before we analyze the moral terms. Answer: Validity requires univocal terms.

      *Let's build the response.*
answer: |-
  ### 1. Verdict on Sequencing and Warm-up

  **The Sequencing (Negation/Disjunction $\rightarrow$ Conditionals):**
  This ordering survives scrutiny and is pedagogically superior for this specific cohort. Standard introductions rush to Modus Ponens, allowing the sophisticated expressivist reply ("being for blaming for not blaming") to dissolve the tension before the students feel the semantic gap. By starting with **negation** ("Murder is not wrong") and **disjunction** ("Either stealing is wrong or..."), you force the question: *What attitude is being expressed here?*
  *   **The Cost:** You rightly worry this frames the problem as one of *content* (what is said) rather than *logic* (what follows).
  *   **The Fix:** You must explicitly bridge this gap at minute 20. The transition line is: *"If we cannot specify the content of these embedded sentences, we cannot determine if the content remains constant across an argument. If the content shifts, validity collapses."* This moves them from "What does 'not' mean?" to "Why does this inference fail?"

  **The Warm-up (Paraphrasing into Attitudes):**
  Do **not** drop this. It is the most effective way to visualize the equivocation. However, reframe it. Do not present it as "Look how silly expressivism is." Present it as "Let us take expressivism seriously on its own terms and see where the logic breaks."
  *   **Reframe:** Ask them to translate the premises into psychological states. When they see Premise 1 expresses a *belief-like* commitment but Premise 2 expresses a *higher-order* attitude, they will visually spot the equivocation on the middle term. This makes the problem structural, not a parlor trick.

  ### 2. The One Example

  **The Example:** "Stealing is wrong."
  **It Must Have:**
  *   **Atomic Simplicity:** No modals ("ought"), no agents ("John should"), just Property $F$ applied to Act $G$.
  *   **Embeddability:** It must fit naturally into "If...", "Not...", and "Either... Or..." without grammatical friction.
  *   **Intuitive Validity:** The Modus Ponens argument using it must be undeniably valid to common sense.
  **It Must Lack:**
  *   **Empirical Disputes:** Avoid examples where the disagreement could be about facts (e.g., "Stealing causes pain").
  *   **Deontic Complexity:** Avoid "obligatory" vs. "permissible." Stick to "wrong."

  **The Argument to Build:**
  1.  If stealing is wrong, then getting your little brother to steal is wrong.
  2.  Stealing is wrong.
  3.  Therefore, getting your little brother to steal is wrong.

  ### 3. Misconceptions and Defusal Points

  | Misconception | When it Forms | Defusal Point |
  | :--- | :--- | :--- |
  | **1. The Boo-Hurrah Caricature**<br>("Expressivism is just shouting 'Boo!'") | **Minute 5** (Intro) | **Defuse Immediately:** Clarify that modern expressivism is about *commitments* or *plans*, not emotional outbursts. The problem persists even for sophisticated versions. |
  | **2. The Truth-Conditional Surrender**<br>("Just assign truth-values to moral sentences.") | **Minute 30** (After presenting the problem) | **Defuse by Constraint:** Remind them this abandons the metaphysical motivation for non-cognitivism (queerness, supervenience). If moral sentences are truth-apt, non-cognitivism is dead. The problem is to save non-cognitivism, not kill it. |
  | **3. The Disagreement Conflation**<br>("The problem is just that people argue about morals.") | **Minute 40** (Discussing solutions) | **Defuse by Distinction:** Distinguish *pragmatic* disagreement (clashing attitudes) from *semantic* inconsistency (contradictory contents). FG is about the latter. |

  ### 4. The 50-Minute Plan

  **00–05: Setup & Constraints**
  *   Recap Non-Cognitivism (NC): Moral sentences express non-cognitive states (desires/plans), not beliefs.
  *   **Constraint:** We are not asking if NC is *true*. We are asking if it is *logically coherent*.
  *   **Defuse Misconception 1:** NC is not "Boo/Hurrah." It is a claim about semantic function.

  **05–15: The Semantic Gap (Negation & Disjunction)**
  *   Write: "Stealing is wrong." Ask: What state does this express? (Students: Disapproval/Plan not to steal).
  *   Write: "Stealing is **not** wrong." Ask: What state does this express?
      *   *Trap:* If they say "Approval," point out one can be indifferent. If they say "Lack of disapproval," ask if that is the same as asserting it is *not* wrong.
  *   Write: "**Either** stealing is wrong **or** lying is wrong." Ask: What single state of mind does this express?
  *   **Point:** In unembedded contexts, NC has a clear answer. In embedded contexts, the mapping from sentence to state breaks down.

  **15–20: The Warm-up (Paraphrase)**
  *   Introduce the Modus Ponens argument (The Stealing Example).
  *   **Task:** Paraphrase P1, P2, and C into states of mind.
  *   **Observation:** P2 expresses a simple attitude toward stealing. P1 (the antecedent) cannot express that same attitude (since the speaker isn't asserting stealing is wrong).
  *   **Result:** The term "Stealing is wrong" means different things in P1 and P2.
  *   **Logic Check:** If the middle term shifts, the argument is invalid (Equivocation). But the argument *is* valid. Contradiction.

  **20–25: Validity Before Semantics**
  *   **What to say:** Validity is formal. It depends on the *structure* and the *constancy of meaning*.
  *   If "Stealing is wrong" changes its semantic contribution when it moves from an assertion to an antecedent, logic cannot track it.
  *   For the argument to be valid, "Stealing is wrong" must contribute the *same content* in both premises. NC seemingly denies this.

  **25–35: The "Easy Way Out" & Why It's Blocked**
  *   **Proposal:** Why not just say moral sentences *are* truth-apt?
  *   **Defuse Misconception 2:** This solves FG but kills NC. It concedes to Cognitivism. The challenge is to keep NC *and* save logic.
  *   **The Expressivist Move:** Briefly mention the "Higher-Order Attitude" reply (e.g., Blackburn: P1 expresses a sentiment against having the P2 attitude without the C attitude).
  *   **Critique:** Does this really capture the *logical* inconsistency? Or just psychological clash? (Leave this hanging).

  **35–45: Distinguishing the Problems**
  *   **Defuse Misconception 3:** Students will confuse FG with "How can we disagree if it's just attitudes?"
  *   **Distinction:** Disagreement is about clashing worlds. FG is about *embedding*. I can assert the conditional without having the attitude. The problem is semantic, not pragmatic.
  *   Show that imperatives suffer the same fate ("Close the door!" vs. "If you close the door..."). This isolates the problem to non-cognitive semantics generally.

  **45–50: Assessment**
  *   Review key takeaway: The problem is not that NC is morally bad, but that it lacks a compositional semantics.
  *   **Final Question.**

  ### 5. What to Decline (Scope Control)

  *   **Quasi-Realism:** Do not attempt to explain how Blackburn *solves* it. Only explain why it is a problem *for* him. Solving FG requires a whole lecture series.
  *   **Frege vs. Geach:** Do not distinguish their contributions. Treat "Frege-Geach" as a single label for the embedding problem.
  *   **Moral Metaphysics:** Do not let the discussion drift into "But are moral properties real?" That is the motivation for NC, not the FG problem itself.
  *   **Infinite Regress:** Do not get into whether higher-order attitudes generate a regress.

  ### 6. The Final Five-Minute Question

  Do not ask them to define the problem. Ask them to **transfer** it.

  > **"Imagine a non-cognitivist theory of comedy: 'X is funny' expresses a tendency to laugh, not a belief. Construct a valid argument involving 'funny' that faces the exact same problem as the moral case, and explain why the paraphrase test breaks it."**

  **Why this works:**
  *   If they answer with a moral disagreement example, they missed the point (Misconception 3).
  *   If they say "Just assign truth values to 'funny'," they missed the constraint (Misconception 2).
  *   If they construct a Modus Ponens ("If this joke is funny, laugh...") and show the equivocation in the "tendency to laugh" paraphrase, they have grasped the structural/semantic nature of the Frege-Geach problem.
