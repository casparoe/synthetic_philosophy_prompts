      *   *Point 3 (MLS vs. Kin):* Kin selection vs. Multi-level selection (MLS) is largely formal/mathematical equivalence (partitioning variance). Choice is bookkeeping. (Standard Okasha/Price Equation line).
      *   *Point 4 (Group Causality):* *Tension Alert.* In some cases (cooperative breeding, human norms), group level is where causal work happens. Group persistence drives frequency change. Gene's-eye gets explanation direction wrong. (Contradicts Point 1's strict replicator requirement and Point 3's bookkeeping claim).
      *   *Point 5 (Group Selection Rarity):* Group selection in nature (biological) is rare/weak. Needs specific conditions (variance, isolation, extinction). (Standard Williams/Maynard Smith line).
      *   *Point 6 (Cultural Group Selection):* Cultural group selection in humans *is* real/explanatory, despite low fidelity compared to DNA. (Contradicts Point 1's fidelity requirement).
      *   *Point 7 (Local Competition/Sex Ratio):* Individual-level story is perspicuous for local mate competition/sex ratios. (Consistent with Point 2, maybe Point 1).

  3.  **Identify Tensions:**

      *   **Tension A: Point 1 vs. Point 6 (The Fidelity Problem).**
