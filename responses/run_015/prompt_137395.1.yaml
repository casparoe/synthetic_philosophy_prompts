      *   *Correction on P6:* Cultural evolution often relies on *conformist bias* or institutional enforcement to boost fidelity. It's not that fidelity is low, it's that *mechanisms* exist to raise it. This helps reconcile P1 and P6.

  7.  **Finalizing the Structure:**
