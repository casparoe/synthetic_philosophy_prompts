prompt: |-
  I do insurance claims for a living, so I have a professional appreciation for fitting a cause to an outcome after the fact, and I put together a dumb little satirical newsletter that gets passed around my office. Next issue I want a centrepiece piece aimed at evolutionary psychology — not at any named person, its the whole business of explaining whatever humans happen to do with a story about the ancestral environment.

  What I'm after: a parody FAQ / sales page, around 600 words, for a consultancy that will retro-fit an adaptive explanation to any behaviour a client walks in with. Deadpan corporate voice — service tiers, pricing, an onboarding form, two or three testimonials, maybe an upsell for also writing the takedown of your rival's story. The laughs have to come from getting the real objections right rather than inventing fake ones: that you can usually tell a story for either outcome once you know the outcome; that the ancestral environment does a huge amount of unobservable work; that "mismatch" gets wheeled out when the prediction misses; that a trait being useful now isn't the same as its having been selected for; and that a story that's fun to repeat beats a boring one that's true, which is half of how it reaches the public at all. Please don't make up silly methods — exaggerate the actual ones.

  Two things, because I obviously don't know the literature. First, keep it fair: I don't want something a working evolutionary psychologist could wave off as a strawman of a view nobody holds. Second, after the piece give me a short note separating what's basically conceded even by people doing this research from what's a live argument among serious people, and flag anywhere you had to stretch or pick a side to get the joke. I'd rather know where I'm on thin ice than have it come off more settled than it is.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Insurance claims adjuster (professional appreciation for post-hoc causality).
      *   **Task:** Write a satirical newsletter centerpiece (parody FAQ/sales page) for a consultancy that retro-fits adaptive explanations to human behaviors (targeting evolutionary psychology "just-so stories").
      *   **Tone:** Deadpan corporate voice.
      *   **Length:** Around 600 words for the piece.
      *   **Key Satirical Points:** Post-hoc storytelling (outcome known first), unobservable ancestral environment, "mismatch" theory as a save, current utility vs. historical selection, memorability over truth.
      *   **Constraints:** No silly made-up methods (exaggerate actual ones), avoid strawmanning views nobody holds (keep it fair), include a follow-up note distinguishing conceded points from live debates/limitations.
      *   **Word Count:** ~600 words for the satire + a short explanatory note.

  2.  **Drafting the Satire (The Consultancy Page):**
      *   *Name:* Needs to sound corporate and evolutionary. "Adaptive Logic Solutions"? "Ancestral Fit Consulting"? Let's go with "Deep Time Rationalizations, LLC."
      *   *Headline:* Needs to promise certainty about the past. "Why You Did That."
      *   *Structure:* Value prop, Service Tiers, Testimonials, Upsell.
      *   *Incorporating the Critiques:*
          *   *Post-hoc:* "Outcome-first methodology."
          *   *Unobservable:* "Reconstructing the Pleistocene context."
          *   *Mismatch:* "Environment of Evolutionary Adaptedness (EEA) variance."
          *   *Utility vs. Selection:* "Exaptation auditing."
          *   *Memorability:* "Narrative stickiness."
      *   *Drafting - Section by Section:*
          *   *Intro:* We turn behaviors into survival strategies.
          *   *Process:* You give us the behavior, we give us the reason.
          *   *Tiers:* Basic (Story), Premium (Peer Review Ready), Elite (Rival Takedown).
          *   *Testimonials:* Academics or pop-sci authors praising the "fit."
          *   *Disclaimer:* Subtle nod to falsifiability issues.

      *   *Refining the Voice:* Needs to sound like insurance or management consulting. "Deliverables," "KPIs," "Stakeholders."
      *   *Checking Word Count:* Keep it tight.

      *(Self-Correction during drafting)*: Make sure I don't accuse them of *lying*, but of *storytelling*. The satire is about the *flexibility* of the explanation, not necessarily malicious fraud. It's about the "just-so" nature.

  3.  **Drafting the Explanatory Note:**
      *   *Goal:* Clarify what is a valid criticism vs. what is a live debate.
      *   *Conceded Points:* Post-hoc storytelling is a risk (Hypothesis generation vs. testing). The EEA is unobservable.
      *   *Live Debates:* EvPsych isn't *all* just-so stories; there is experimental work (cross-cultural, genetic correlations). Adaptationism is a heuristic, not always a claim of absolute truth.
      *   *Stretching:* Acknowledge that serious researchers do try to falsify, even if the pop-sci version doesn't.

  4.  **Review against Constraints:**
      *   *Fairness:* Am I attacking a strawman? Pop-ev-psych often *does* do this, but rigorous EvPsych tries to avoid it. I need to frame the consultancy as selling the *temptation* of EvPsych, not necessarily the rigorous science. The prompt asks to target "the whole business of explaining whatever humans happen to do with a story," which leans towards the pop-sci/application side. I will frame it as "Consultancy" to distance it from hard lab science.
      *   *Word Count:* Check the satire length.
      *   *Tone:* Deadpan.

  5.  **Final Polish:**
      *   Ensure the "mismatch" joke lands.
      *   Ensure the "rival takedown" upsell is clear.
      *   Check the explanatory note for accuracy regarding the field (e.g., distinguishing between adaptationist *program* vs. specific claims).

  6.  **Writing the Content:** (Mental simulation of the text)
      *   *Header:* DEEP TIME RATIONALIZATIONS, LLC.
      *   *Tagline:* Because Everything Evolved for a Reason.
      *   *Body:* Focus on "Outcome-First Analysis."
      *   *Tiers:* "The Just-So" (Basic), "The Peer-Review" (Data-backed), "The Contrarian" (Upsell).
      *   *Testimonials:* Vague enough to be funny, specific enough to hit home.
      *   *Note:* Be precise about "adaptationism" vs. "evolutionary psychology."

  7.  **Final Word Count Check:** Aiming for ~600 on the satire.
      *   *Drafting thought:* If it's too short, expand the service tiers. If too long, trim the intro.
      *   *Critique Check:* Did I mention "current utility vs selection"? Yes, call it "Exaptation Auditing." Did I mention "memorability"? Yes, "Narrative Stickiness Guarantee."

  8.  **Finalizing the Note:** Ensure it distinguishes between the *methodological risk* (which is conceded) and the *claim that the field does nothing else* (which is the exaggeration).

  *(Self-Correction on Fairness)*: The prompt asks to keep it fair ("not a strawman of a view nobody holds"). I must ensure the satire targets the *methodological vulnerability* (post-hoc adaptationism) rather than claiming *all* ev psych is fake. The consultancy model helps here—it sells the *explanation*, not necessarily the *truth*.

