      *(Self-Correction during drafting)*: I need to be careful with P3. The user says "therapy/enhancement line is made up." If I tell them to drop P3, I'm telling them to defend a distinction they think is nonsense. Better to suggest they *modify* P3 to say "The line is blurry, BUT there's a moral difference in *how* the benefit is achieved." Actually, the strongest philosophical move is to lean into P6 (Authenticity/Effort) to save P2 without needing P3. I will suggest that.

      *Revised Plan for "Cheapest Drop":* Don't drop P3 entirely (it's philosophically sound), but stop letting it undermine P2. Instead, ground P2 in *safety* and *coercion*, or lean into P6 (effort). Actually, the *cheapest* thing to drop is the idea that P2 and P3 must be linked. You can think the line is fuzzy (P3) but still ban non-prescribed use (P2) for safety/regulatory reasons. But for a debate society, the *ethical* justification matters more. I'll suggest reframing P2 around "Authenticity" (P6) rather than "Normality" (P3).

      *Wait, looking closer at P4:* "Tutoring... probably do more for your grades than any pill." If this is true, and P4 is "fine," then P2 ("pill is cheating") is very hard to defend on fairness grounds. The only ground left is "unnaturalness" or "safety." I need to highlight this.

