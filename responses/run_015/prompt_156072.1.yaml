answer: |-
  This is a sharp set of intuitions. You have correctly identified that the "presumption of independence" is not a single switch but a dial that interacts with the *structure* of the set you are studying and the *statistic* you are measuring.

  There is no single theorem that licenses this, but there is a coherent framework used by analytic number theorists to decide when to trust it. I will call this the **Principle of Corrected Local Randomness**.

  Here is the principle, broken down into three licensing clauses. If a heuristic violates one of these, the independence presumption is numerology. If it satisfies them, it is "licensed heuristic reasoning" (which may still be wrong, but is principled).

  ### The Principle of Corrected Local Randomness

  To license a probabilistic heuristic in number theory, three conditions must be met:

  1.  **Genericity:** The sequence must not possess rigid global algebraic structure that correlates divisibility conditions across large scales. (It must look like "generic integers" locally).
  2.  **Local Correction:** All local obstructions (congruence conditions modulo small primes $p$) must be explicitly factored out via a **Singular Series**. You cannot assume $P(n \text{ prime}) = 1/\log n$ unconditionally; you must assume $P(n \text{ prime} \mid \text{local constraints}) \approx \mathfrak{S} / \log^k n$.
  3.  **Averaging vs. Extremes:** The statistic must be an **average** (integral count) over a long range. It cannot be an **extremal** statistic (max/min gap) or a **sign** statistic (bias), as these are sensitive to error-term correlations that the independence model washes out.

  ---

  ### Applying the Principle to Your Cases

  Here is how this principle cuts through your list, specifically addressing your pain points.

  #### 1. The Twin Prime vs. Gap Discrepancy (Cases 2 vs. 5)
  **Your Question:** Why does independence work for counting twins (Case 2) but fail for max gaps (Case 5), given they use the same coin-flipping picture?
  **The Cut:** This is **Clause 3 (Averaging vs. Extremes)**.

  *   **Case 2 (Twins):** You are estimating $\sum_{n \le x} \Lambda(n)\Lambda(n+2)$. This is an integral. Even if the distribution of primes fluctuates in short intervals (as Maier showed), these fluctuations tend to cancel out when integrated over $[1, x]$. The "Level of Distribution" (more on this below) ensures that on *average*, primes are well-distributed in arithmetic progressions. The independence model predicts the *mean* density correctly once local obstructions (Clause 2) are removed.
  *   **Case 5 (Gaps):** You are estimating $\max_{p_n \le x} (p_{n+1} - p_n)$. This is a supremum. It is determined by the *worst-case* interval where primes fail to appear. Maier's Matrix Method demonstrates that primes cluster in certain arithmetic progressions more than the random model predicts. In a random model, the probability of a gap of size $Y$ is $e^{-Y/\log x}$. In reality, because primes have "preferred" residue classes (and avoided ones) that persist over ranges larger than the model assumes, you can find "unlucky" intervals that are larger than the random prediction.
      *   *Verdict:* The independence model captures the **mean** behavior (licensed) but fails the **tail** behavior (unlicensed).

  #### 2. The "Level of Distribution" Explanation
  **Your Question:** How does "level of distribution" distinguish Case 2 from Case 5?
  **The Explanation:**
  The "Level of Distribution" $\theta$ measures how large a modulus $q$ can be (relative to $x$) such that primes are still equidistributed in arithmetic progressions mod $q$.
  *   **Bombieri-Vinogradov Theorem:** Proves $\theta = 1/2$. This is enough to prove results about primes "on average."
  *   **Hardy-Littlewood (Case 2):** To *prove* the twin prime conjecture, we effectively need $\theta = 1$ (or the Elliott-Halberstam conjecture). The heuristic *assumes* $\theta = 1$. Because we are summing over $x$, the error terms introduced by having only $\theta = 1/2$ are often manageable or conjectured to cancel out in the main term.
  *   **Maier/Gaps (Case 5):** Maier's theorem exploits the fact that we do *not* have uniform distribution in short intervals. The "Level of Distribution" is an average statement. It says "for most $q$, primes are equidistributed." It does not say "for all $q$." The maximum gap is determined by the specific $q$ (and specific intervals) where equidistribution **fails**. The independence model assumes equidistribution holds everywhere (effectively $\theta=1$ uniformly). Since the max gap depends on the *exceptions* to equidistribution, the model fails.

  #### 3. Chebyshev Bias (Case 6)
  **Your Question:** If independence is okay for leading order, why is it wrong here?
  **The Cut:** This is **Clause 3 (Sign Statistics)**.
  Chebyshev bias is a statement about the *sign* of the error term $\pi(x; 4, 3) - \pi(x; 4, 1)$. The independence model assumes the error term behaves like a random walk with mean zero. However, the error term is governed by the zeros of $L$-functions. Under GRH and LI (Linear Independence of zeros), the bias is explained by the fact that the "race" between residue classes is influenced by the low-lying zeros.
  *   *Verdict:* Independence is licensed for the **main term** ($\frac{1}{2} \text{li}(x)$), but unlicensed for the **second-order sign**. Your compromise was correct: independence is for leading-order asymptotics, not error-term signs.

  #### 4. Fermat/Mersenne Primes (Case 8)
  **Your Question:** Is the "boost" principled or fitting?
  **The Cut:** This is **Clause 1 (Genericity)**.
  *   **Generic Integers:** For a random integer $N$, $P(p|N) = 1/p$.
  *   **Fermat Numbers:** $F_n = 2^{2^n} + 1$. If $p | F_n$, then $p \equiv 1 \pmod{2^{n+2}}$. This is a rigid algebraic constraint. The probability that a random prime $p$ divides $F_n$ is not $1/p$, it is roughly $1/(p \cdot \text{order of } 2 \text{ mod } p)$.
  *   *Verdict:* The heuristic is **licensed** to predict **finitude** (because the sum of probabilities converges rapidly). It is **unlicensed** to predict the **exact count** (e.g., "there are exactly 5"). The sequence is too sparse ($N$ grows doubly exponentially) for statistical laws to stabilize. There are only 5 data points; statistics require $N \to \infty$. The "boost" is principled (Clause 2), but the application is statistically weak (Clause 1 violation).

  #### 5. Fitting After the Fact (Case 10)
  **Your Question:** What distinguishes the Twin Prime constant from ad-hoc fitting?
  **The Cut:** This is **Clause 2 (Local Correction)**.
  *   **Twin Prime Constant:** Derived from $\prod_p \frac{1 - 2/p}{(1 - 1/p)^2}$. This comes from analyzing the system of congruences $n \equiv 0 \pmod p$ and $n+2 \equiv 0 \pmod p$. It is derived *a priori* from local density arguments.
  *   **Ad-hoc Fitting:** Adjusting a constant $C$ to match data without an algebraic derivation from local densities.
  *   *Verdict:* If the constant comes from a product over primes reflecting congruence obstructions, it is licensed (even if the final conjecture is false). If it comes from regression on data, it is numerology.

  #### 6. Möbius Randomness (Case 7)
  **Your Question:** Why trust $\mu$ independence if primes have bias?
  **The Cut:** $\mu(n)$ is "more random" than $\Lambda(n)$.
  The primes ($\Lambda$) are constrained to be positive and have a dense mean ($1/\log n$). The Möbius function $\mu(n)$ has mean zero. The Chowla conjecture posits that $\mu$ behaves like a random sequence of $\pm 1$.
  *   *Verdict:* Trust is higher here because $\mu$ cancels out the Chebyshev bias. The bias in primes comes from the *magnitude* of the count; $\mu$ sums to zero, so the bias appears only in the variance/correlation, which is conjectured to be minimal. This is licensed by the **Möbius Randomness Heuristic**, which is stronger than the Cramér model but relies on similar independence assumptions.

  ---

  ### The New Cases

  **Sophie Germain Primes ($p, 2p+1$ both prime)**
  *   **Analysis:** This is structurally identical to Twin Primes.
  *   **Local Obstructions:** If $p=2$, $2p+1=5$ (ok). If $p=3$, $2p+1=7$ (ok). Mod 3: if $p \equiv 1 \pmod 3$, $2p+1 \equiv 0 \pmod 3$. So $p$ cannot be $1 \pmod 3$. This creates a local density correction.
  *   **Verdict:** **Licensed.** The Bateman-Horn conjecture applies here. You trust the constant (Singular Series) for the leading order asymptotic $C \frac{x}{\log^2 x}$. Do not trust it for the error term or specific counts at small $x$.

  **Primes of the form $n^2+1$ (Landau's 4th Problem)**
  *   **Analysis:** $n^2+1$ is never divisible by primes $p \equiv 3 \pmod 4$.
  *   **Local Obstructions:** This is a massive local constraint. Half the primes are immediately excluded as divisors. The Singular Series must account for this (the product is only over $p \equiv 1 \pmod 4$).
  *   **Verdict:** **Licensed for asymptotics.** The heuristic predicts $\sim C \frac{\sqrt{x}}{\log x}$. This is widely believed. However, note that $n^2+1$ is a **sparse polynomial**. While Bateman-Horn licenses the main term, proving anything here is currently out of reach (we don't even know if there are infinitely many). The heuristic is principled, but the "Genericity" (Clause 1) is weaker here than for linear polynomials because the values grow quadratically, thinning the set faster.

  ---

  ### Summary Checklist for Your Intuition

  When you encounter a new heuristic claim, run it through this filter:

  1.  **Is it a Main Term or an Error Term?**
      *   Main Term (Count): **Green Light** (provided Clause 2 is met).
      *   Error Term / Sign / Bias: **Red Light** (Chebyshev, RH).
      *   Extremal Statistic (Max/Min): **Yellow Light** (Cramér gaps are close but often underestimate due to Maier-type clustering).

  2.  **Is the Sequence Generic or Structured?**
      *   Generic (intervals, linear forms): **Green Light**.
      *   Structured (exponential sequences like $2^n+1$): **Yellow Light**. Trust convergence/divergence (finitude), distrust exact counts.

  3.  **Is the Constant Derived or Fitted?**
      *   Derived from $\prod_p (\text{local density})$: **Green Light** (Twin Prime Constant).
      *   Fitted to match data: **Red Light**.

  4.  **Does it require Level of Distribution $\theta = 1$?**
      *   If yes (Twin Primes, Goldbach): It is a **Conjecture**, but a licensed one.
      *   If it relies on uniformity in short intervals (Gaps): It is **Suspect** (Maier's Theorem looms).

  **Final Verdict on your gut:**
  Your gut is correct to trust Case 2 (Twins) more than Case 5 (Gaps). Case 2 is an **average** property where local corrections (Singular Series) dominate global noise. Case 5 is a **worst-case** property where global noise (Maier fluctuations) dominates the model. Your gut on Case 8 (Fermat) should be: Trust the "finitely many" prediction, distrust the "exactly 5" implication. Your gut on Case 6 (Bias) should be: Independence predicts the mean, not the deviation.

  The "Presumption of Independence" is actually the **Presumption of Local Randomness with Global Averaging**. Remove "Global Averaging" (Gaps) or "Local Randomness" (Bias/Structure), and the license is revoked.
