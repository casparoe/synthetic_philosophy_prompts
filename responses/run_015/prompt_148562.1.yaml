answer: |-
  To adjudicate disputes regarding non-human performative utterances, a theory must satisfy the following desiderata. These requirements are structured to force clarity on where the disagreement lies—specifically, whether "agency" is a prerequisite for "action."

  ### Desiderata for a Theory of Performative Utterance

  **1. The Paradigm Constraint**
  *   **Requirement:** The theory must successfully classify standard, uncontroversial human illocutionary acts without category errors.
  *   **Motivating Case:** A judge saying "I sentence you" (Declaration), a person saying "I promise" (Commissive), or a commander saying "Leave" (Directive).
  *   **Load-Bearing Distinction:** **Explicit vs. Implicit Performative.** The theory must explain how "I order you to leave" and "Leave!" achieve the same illocutionary force despite different syntactic structures.
  *   **Status:** **Non-Negotiable.** If a theory cannot account for the human paradigm, it lacks the baseline to evaluate the algorithmic deviation.

  **2. The Infelicity Specification**
  *   **Requirement:** The theory must distinguish between different ways a performative can fail, specifically separating procedural failure from psychological insincerity.
  *   **Motivating Case:**
      *   *Misfire:* A layperson attempting to christen a ship (lacks authority).
      *   *Abuse:* Making a promise with no intention of keeping it (has authority, lacks sincerity).
  *   **Load-Bearing Distinction:** **Happiness (Felicity) vs. Truth (Falsity).** The theory must treat the layperson's christening not as "false" but as "void," and the insincere promise as "hollow" but still arguably a promise.
  *   **Status:** **Non-Negotiable.** This is essential for the chatbot case: is the bot's apology a "misfire" (void) or an "abuse" (insincere but valid)?

  **3. The Agency and Intention Condition**
  *   **Requirement:** The theory must explicitly state whether a mental state (belief, desire, intention) is a necessary condition for the illocutionary act, or whether the execution of a conventional procedure is sufficient.
  *   **Motivating Case:** The scripted chatbot apology. The code has no beliefs; the company has a policy.
  *   **Load-Bearing Distinction:** **Speaker Intention vs. Conventional Procedure.**
  *   **Status:** **Conflict Zone (See Section 4).** This is the primary pivot point. A theory cannot remain neutral here; it must specify if "intention" is a *constitutive rule* (Searle) or if "conventional effect" suffices (Institutional Fact).
  *   **Note:** If the theory demands intention, the chatbot fails. If it demands only conventional uptake per institutional rules, the chatbot succeeds.

  **4. The Uptake Requirement**
  *   **Requirement:** The theory must specify the role of the hearer. Does the act occur upon utterance, or only upon understanding?
  *   **Motivating Case:** A soldier receives a written order in a code they cannot decrypt. Has the order been issued?
  *   **Load-Bearing Distinction:** **Illocutionary Act vs. Perlocutionary Effect.** The theory must separate the *issuing* of the order (illocution) from the *obeying* of the order (perlocution), but decide if *understanding* is required for the former.
  *   **Status:** **Non-Negotiable (with variance).** Most theories require some possibility of uptake, but disagree on whether actual understanding is needed. For the blockchain expulsion, does the member need to read the chain for the expulsion to exist?

  **5. The Institutional Authority Condition**
  *   **Requirement:** The theory must account for acts that change reality solely by virtue of institutional status, independent of physical causality.
  *   **Motivating Case:** The blockchain DAO expelling a member. The code changes a ledger state; the rules say ledger state = membership status.
  *   **Load-Bearing Distinction:** **Assertion vs. Declaration.** Assertions describe the world (true/false); Declarations change the world (happy/unhappy).
  *   **Status:** **Non-Negotiable.** This is critical for the DAO case. If the output is an assertion, it is false (the code isn't "describing" an expulsion). If it is a declaration, it creates the expulsion.

  **6. The Truth-Evaluability Stance**
  *   **Requirement:** The theory must declare whether performative utterances are subject to truth conditions.
  *   **Motivating Case:** "I state that the meeting is open." Is this statement true? Or is the act of opening simply performed?
  *   **Load-Bearing Distinction:** **Constative vs. Performative.**
  *   **Status:** **Preference (Early Austin).** Early Austin insisted performatives are not truth-evaluable. Later Austin and Searle acknowledged that declarations have a "word-to-world" and "world-to-word" fit. A modern theory need not ban truth-evaluability entirely but must explain how it applies differently to performatives than to descriptions.
  *   **Note:** Demanding that *no* performative be truth-evaluable is an optional preference inherited from 1950s Oxford, not a logical necessity for adjudicating algorithmic cases.

  **7. The Force-Content Separability**
  *   **Requirement:** The theory must allow the same propositional content to carry different illocutionary forces.
  *   **Motivating Case:** "The window is open" (Assertion) vs. "Open the window" (Directive) vs. "I declare the window open" (Declaration).
  *   **Load-Bearing Distinction:** **Illocutionary Force vs. Propositional Content.**
  *   **Status:** **Non-Negotiable.** Essential for analyzing the chatbot. The content is "apology," but is the force *apologizing* or merely *reporting* that the company apologizes?

  ---

  ### Incompatible Desiderata and Theoretical Conflicts

  You must be aware that the following pairs of desiderata cannot be jointly satisfied by a single theory without significant modification. Your argument with your friend is likely a clash between these two poles:

  **1. Strong Intentionalism vs. Strong Institutionalism**
  *   **The Conflict:** You cannot demand that **Genuine Speaker Intention** (Desideratum 3) is necessary for an act *and* simultaneously allow that a **Mindless Algorithmic Publication** (Desideratum 3 & 5) counts as the *same* full-blooded illocutionary act.
  *   **Explanation:** If intention is constitutive (Searle), the chatbot is simulating an apology, not apologizing. If institutional convention is constitutive (Early Austin/Bach & Harnish), the chatbot *is* apologizing because the rules say the output counts as one.
  *   **Adjudication:** A theory must choose. If you prioritize the "missing essence" (intention), you must adopt an Intentionalist theory. If your friend prioritizes the "policy effect" (convention), they must adopt an Institutional theory. There is no neutral theory that validates both intuitions simultaneously.

  **2. Mutual Exclusivity vs. Hybrid Forces**
  *   **The Conflict:** You cannot demand that **Illocutionary Categories be Mutually Exclusive** (e.g., an act is either a Promise OR an Assertion) *and* accommodate **Complex Algorithmic Outputs** that function as both status changes and information transfers.
  *   **Explanation:** A smart contract execution often declares a state change (Declaration) and asserts a new balance (Assertion). A theory demanding strict exclusivity will fail to describe the hybrid nature of code-as-law.

  **3. The Constative/Performative Binary**
  *   **The Conflict:** You cannot maintain the **Early Austin Distinction** (Performatives are not truth-evaluable; Constatives are) *and* account for **Institutional Facts** (e.g., "You are expelled") which are created by speech but then function as true/false descriptions of status.
  *   **Explanation:** Once the DAO code says "Member Expelled," it is a fact that can be truth-evaluated. A theory clinging to the early binary will struggle to explain how the performative *becomes* a constative instantly. This distinction is a **Preference**, not load-bearing.

  ---

  ### Brief Evaluation of Austin and Searle

  Austin's early *How to Do Things with Words* lectures initially posit a sharp **Constative/Performative** split (Preference), which would help you argue the chatbot isn't "really" apologizing because it lacks the human context of felicity. However, Austin later collapses this into a general theory of **Illocution**, relying heavily on **Conventional Procedure** (Non-Negotiable), which aids your friend's argument that the company policy suffices. Searle's later treatment adds the **Intentionality Condition** (Non-Negotiable for Intentionalists), requiring the speaker to mean what they say. Searle's framework would likely side with you (the bot lacks intention), whereas a strict Institutional reading of Austin's later work might side with your friend (the convention was followed). Neither theory perfectly resolves the algorithmic case without forcing a choice between "mind" and "rule."
