      *Refining the Blindsight Question:*
      *   Q1: In blindsight, there's a FO state but no HOT. In normal unconscious perception, there's a FO state but no HOT (yet). Are these FO states type-identical?
      *   Likely Reply: Yes, they are similar; the difference is just the presence of the HOT.
      *   Q2 (Follow-up): If the FO state is the same, and the HOT is unconscious, the *difference maker* is an unconscious state. How does an unconscious state add *phenomenal feel*? Doesn't this make phenomenology extrinsic?
      *   *Actually, let's make it sharper.*
