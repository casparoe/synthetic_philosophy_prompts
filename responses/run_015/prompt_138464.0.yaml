      *   *No Action Alternative (4):* Genuine or cheap trick? Literature calls this "Flickers of Freedom." Is it robust enough for moral responsibility? Most say no, but it keeps PAP technically true.
      *   *Move (6) Knockdown?* It's not a knockdown of Frankfurt's anti-PAP argument, but it is a knockdown of the idea that Frankfurt cases *settle* the Free Will/Determinism debate. It highlights the dialectical stalemate.
