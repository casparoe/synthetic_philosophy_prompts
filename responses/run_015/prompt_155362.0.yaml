answer: |-
  **The Scenario: The Mentor's Forgery**

  You are the senior conservator at a national gallery, renowned for your technical analysis of 20th-century expressionism. Your former mentor, Elias, is now in the early stages of dementia. For the last decade, Elias has been building his late-career reputation on a series of "rediscovered" sketches from his youth that secured his place in the canon. Last week, Elias brought you a new sketch for authentication before a major auction. He believes it is a lost masterpiece from his radical period; it would fund his care and cement his legacy. Your spectral analysis, however, suggests the materials date to a period when Elias was known to practice copying old masters for income—a fact he has repressed or forgotten. If you authenticate it, you validate his current self-narrative and secure his comfort, but you corrupt the historical record and the museum's public trust. If you declare it inauthentic, you uphold your professional duty to the truth, but you effectively dismantle the identity of the man who taught you how to see.

  **The Conceptual Tension**

  The Williams-style friction here isn't about maximizing welfare (utilitarianism) versus loyalty; it's about whether the **"impartial" principle is external or internal to the relationship.**

  1.  **The Williams Reading (Corruption of Integrity):** If, in the moment of decision, you step back and deliberate, *"I must weigh my duty to the institution against my duty to Elias,"* Williams would argue you have already lost. The commitment to Elias shouldn't be a variable in a calculus; it should be the ground from which you act. To subject your mentor to the cold gaze of spectral analysis is to treat him as an object of scrutiny rather than a person to whom you are bound. The "one thought too many" is the appeal to the *institutional norm* at all.
  2.  **The Counter-Reading (Constitutive Respect):** However, Elias wasn't just a friend; he was a *scholar* who built his life on the very standards of authenticity you uphold. If you bypass the analysis to spare his feelings, are you honoring him, or are you patronizingly stripping him of his agency as a professional? Here, the "extra thought" (the appeal to impartial standards) might be the *only* way to treat him as an equal. The tension lies in deciding whether professional distance is an **alienation** (as Williams fears) or a form of **recognition** (as Hegelians might argue).

  **Why this is muddy for students:**
  It forces them to ask: Is integrity about staying true to your *current* feelings (loyalty to the aging man), or staying true to the *shared project* that constituted the friendship (the pursuit of truth)? If the latter, then the "impartial" thought isn't an intrusion—it's the language the friendship speaks. This complicates Williams's claim that impartial reasoning is *always* a distancing alienation; sometimes, it's the only way to take the other person seriously.
