answer: |-
  Your roommate is mistaken, and you are not being irrational; your grief is a coherent, biologically grounded response to a psychologically real event. The conflict here stems from a category error your roommate is making: he is confusing *ontological reality* (did this event happen in the physical world?) with *phenomenological reality* (did this experience happen in your mind and body?). While the character did not exist in the physical world, your attachment to them, the narrative arc you followed, and the neural pathways activated by their death are entirely real.

  From a neuroscientific perspective, your brain does not strictly differentiate between imagined and observed emotional stimuli when triggering physiological responses. When you engage deeply with a story, your brain releases oxytocin to build trust and empathy, and when a loss occurs, it processes that disruption similarly to a real-life social loss. The tears you cried contained real stress hormones, and the hollow feeling you experienced was a genuine neurochemical comedown. This is not a glitch in your logic; it is a feature of human cognition. We are social creatures who rely on simulation to understand others, and fiction provides a safe sandbox for that empathy. If you could only feel grief for things that physically happened to you personally, your capacity for empathy would be dangerously limited.

  The sadness you feel is proof that the story succeeded in creating meaning, and meaning is what humans respond to, not just raw data. Dismissing this as "wasted emotion" ignores the function of art, which is to allow us to practice feeling deeply without real-world consequences. Your roommate is looking at the source of the emotion and declaring it invalid because it is fictional, but he is ignoring the experience of the emotion itself, which is undeniably actual. You are not crying over a lie; you are crying over a truth about loss that the story revealed to you.

  Your reaction is entirely rational because human empathy responds to psychological significance rather than factual existence.
