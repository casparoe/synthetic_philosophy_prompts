answer: |-
  Consider a subject, Alex, participating in a haptic-feedback study where a neural implant bypasses the optic nerve to generate fully synthetic visual experiences while leaving somatosensory pathways biologically intact and connected to the physical environment. Unaware that the visual field is digitally rendered, Alex reaches toward a visually presented object, feels the genuine weight, heat, and ceramic texture of a real mug placed on the table for calibration, and forms the belief "there is a mug in front of me" based on this tactile confirmation despite the visual input being entirely fabricated. Alex lacks any scientific knowledge of the implant's specific modular limitations, experiencing the situation as a unified perceptual event where sight and touch ostensibly converge on the same object.

  A closure-based skeptic denies Alex knows there is a mug because knowledge requires the ability to rule out relevant skeptical hypotheses, such as "I am in a modular vat." Since Alex's evidence is compatible with both the actual scenario (visual fake, touch real) and a deceptive scenario where tactile input is also compromised, Alex cannot know the modular-vat hypothesis is false; if knowledge is closed under known entailment, this ignorance regarding the vat hypothesis propagates to the ordinary belief about the mug. Conversely, a safety-condition invariantist grants knowledge by individuating the belief-forming method as "tactile verification in ordinary conditions" rather than general perception. In the relevant nearby worlds where this specific method is employed, the experimental corruption remains confined to the visual cortex while tactile pathways remain veridical, ensuring the belief remains true across those worlds and satisfies the safety condition. A contextualist also grants knowledge in an ordinary context because the modular-vat possibility is not a salient alternative, keeping the epistemic standards low enough for Alex's tactile evidence to suffice, though in a high-stakes epistemology seminar where the hypothesis is explicitly raised, the standards shift and the attribution of knowledge is withdrawn.

  The structural feature driving the divergence is cross-modal verification: the safety theorist isolates the reliable tactile module to assess safety, whereas the closure theorist treats the inability to rule out visual deception as a global deficit that undermines the entailment required for knowledge. If we remove this feature by stipulating a total vat where both visual and tactile inputs are fabricated and no mug exists, all three theories converge on a verdict of no knowledge: the belief is false (failing safety and truth conditions), and the skeptical hypothesis becomes indistinguishable from actuality (satisfying closure-based denial). Finally, a defender of the closure view would attack this case by arguing that the safety theorist's specification of the method as "tactile verification" begs the question, since establishing that the method is indeed tactile and trustworthy presupposes the very knowledge of the external world (that one is not in a total vat) that is under dispute, or by contending that the safety theorist has improperly gerrymandered the nearby worlds to exclude the possibility where the tactile corruption matches the visual corruption.
