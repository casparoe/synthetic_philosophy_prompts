answer: |-
  1. I am 90% confident that beginning by framing the inside view as narrative construction prevents students from perceiving the outside view as an insult to their competence. This establishes the outside view not as a dismissal of expertise but as a necessary prior constraint on narrative plausibility before any specific evidence is weighed.
  2. I am 85% confident that anchoring the discussion in forecasting whether their own proposed interdisciplinary dissertation chapter will be completed within eighteen months leverages their genuine domain knowledge against stark completion base rates. This forces a confrontation between their detailed research design and the impersonal aggregate data of prior graduate students in similar positions.
  3. I am 80% confident that intercepting the misconception that outside-view reasoning is merely statistical pessimism immediately after presenting base rates clarifies that it functions as a prior rather than a final verdict. Subsequently, correct the belief that epistemic modesty requires averaging the two perspectives by demonstrating that the outside view sets a prior which the inside view updates only with strong, distinct evidence.
  4. I am 75% confident that a diagnostic check requiring students to articulate why their specific research obstacles are standard features of the reference class distinguishes internalizing the discipline from merely adopting its vocabulary. Success is measured by their ability to resist updating the base rate upward without evidence that strictly distinguishes their case from the reference class.
  5. I am 60% confident, which is the point about which I am least sure, that openly declining to formalize explicit Bayesian reference-class weighting prevents students from treating the outside view as a calculation problem rather than a structural constraint. Avoiding these tools ensures the focus remains on the qualitative epistemic discipline of narrative sampling rather than mathematical optimization.
