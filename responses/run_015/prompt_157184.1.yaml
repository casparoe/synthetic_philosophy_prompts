answer: |-
  You are absolutely right to be annoyed. In philosophy of physics circles, "Time is an illusion" in the context of Gödel is often used as a conversation-stopper rather than a claim with a truth value. It conflates differential geometry, modal metaphysics, and phenomenology into one mushy slogan.

  Gödel's 1949 argument is actually quite specific, and your group is likely collapsing at least four distinct claims into one. Here is the breakdown of the precise readings, categorized by what they are, who holds them, and whether they hold water.

  ### 1. The Five Distinct Claims

  Here are the five claims usually hiding behind the slogan, ranked from technical to metaphysical.

  **Claim A: The Foliation Failure (Technical)**
  *   **The Claim:** The Gödel metric does not admit a global foliation into spacelike hypersurfaces orthogonal to a timelike vector field. There is no cosmic time $t$ that orders the whole universe.
  *   **Status:** **True (for this metric).** This is a mathematical fact about the specific solution to Einstein's field equations.
  *   **Verdict:** **Platitude in GR.** Everyone in your group should accept this. It does not, by itself, prove time is an illusion; it just proves *cosmic* time is unavailable in this specific spacetime.

  **Claim B: The Causal Breakdown (Structural)**
  *   **The Claim:** The existence of Closed Timelike Curves (CTCs) means the relation "is in the future of" is not asymmetric. If $A$ is in the future of $B$, and $B$ is in the future of $A$, temporal ordering collapses.
  *   **Status:** **True (for this metric).**
  *   **Verdict:** **Technical Fact.** However, inferring that "time doesn't exist" from this requires the premise that *asymmetry* is essential to time. (McTaggart would agree; some B-theorists might not).

  **Claim C: The Modal Argument (Gödel's Actual Argument)**
  *   **The Claim:** If "objective time" (time that passes) were a fundamental feature of reality, it should exist in *all* possible worlds consistent with the laws of physics. Since there is a possible world (Gödel spacetime) consistent with GR where objective time cannot exist, objective time is not a fundamental feature of *our* world either.
  *   **Status:** **Gödel's Actual View.**
  *   **Verdict:** **Controversial/Disputed.** This is the core of his philosophical contribution. It relies on a strong modal premise: that the nature of time cannot be contingent on the matter distribution or boundary conditions of the universe. Many philosophers of physics (like Tim Maudlin) reject this modal step.

  **Claim D: The Psychological Reduction (Phenomenological)**
  *   **The Claim:** Since objective time is impossible (per Claim C), the only "time" that remains is the subjective experience of passage (psychological time).
  *   **Status:** **Gödel's Actual View.**
  *   **Verdict:** **Idealism.** Gödel was a Parmenidean idealist. He believed change is a contradiction. He didn't just say "time is relative"; he said "time is a construct of the mind." This is often skipped over by physicists who want to keep realism.

  **Claim E: The Block Universe/Dismissive Move (Metaphysical)**
  *   **The Claim:** Because time is an illusion, "time travel" isn't a violation of physics because there is no time to travel *through*; it's just movement in a 4D block.
  *   **Status:** **Conflation.**
  *   **Verdict:** **Confused.** This is usually what people *mean* when they use the slogan to dismiss paradoxes. They are trying to say "Don't worry about the Grandfather Paradox, nothing *changes*." But this conflates Eternalism (Block Universe) with Eliminativism (Time is Unreal). You can have a Block Universe where time is real (B-theory), or one where it isn't (Gödel's view).

  ---

  ### 2. Categorization Cheat Sheet

  | Claim | Is it a Platitude? | Did Gödel Hold It? | Is it False? | What people *mean* when dismissing time travel |
  | :--- | :--- | :--- | :--- | :--- |
  | **A: No Global Slice** | Yes (in this metric) | Yes (as premise) | No | "You can't define 'now' everywhere." |
  | **B: CTCs break order** | Yes (in this metric) | Yes (as premise) | No | "Causality is weird here." |
  | **C: Modal Argument** | No | **Yes (Core)** | Debated | **Rarely understood.** |
  | **D: Psychological Only** | No | **Yes (Conclusion)** | Debated | "It's all in your head." |
  | **E: Block/Dismissal** | No | Sort of (Parmenidean) | Category Error | **"Nothing really changes, so relax."** |

  ---

  ### 3. The McTaggart Confusion: Pedantic or Real?

  You are **not being pedantic**. This is a substantive confusion that changes the argument.

  **McTaggart's Argument:**
  *   Time requires an A-Series (Past, Present, Future).
  *   The A-Series is contradictory (events cannot possess all three properties).
  *   The B-Series (Earlier, Later) without the A-Series does not constitute time.
  *   **Conclusion:** Time is unreal. (Purely analytic/metaphysical).

  **Gödel's Argument:**
  *   Relativity allows for spacetimes where an objective A-Series (lapse of time) is impossible due to CTCs.
  *   If time were real, it couldn't vanish in physically possible worlds.
  *   **Conclusion:** Time is unreal. (Physical/Modal).

  **The Confusion:**
  People mix them up because both conclude "Time is Unreal." But McTaggart denies the B-Series is sufficient for time, whereas Gödel uses the structure of the B-Series (the geometry of CTCs) to prove the A-Series is impossible.

  *   **Why it matters:** If your group invokes McTaggart, they are making a logical claim about tense. If they invoke Gödel, they are making a modal claim about physical laws.
  *   **The Verdict:** Gödel actually *read* McTaggart and agreed with the conclusion but thought McTaggart's proof was too abstract. Gödel wanted to ground McTaggart's idealism in physics. If your group says "Gödel proves McTaggart right," they are half-right: Gödel provides a *physical* argument for a McTaggartian *conclusion*.

  ---

  ### 4. The "Time Travel is Fake" Dismissal

  This is the specific usage you asked about: *invoking the line to dismiss whether time travel is "really" possible.*

  When someone says, "Time travel is fine because time is an illusion," they are usually making a category error known as **The Block Universe Defense**.

  *   **What they want to say:** In a 4D block, the "traveler" is just a worldtube that loops. There is no "changing the past," only a static geometry. Therefore, paradoxes are dissolved.
  *   **Why it's sloppy:** Gödel's point is stronger and weirder. He isn't saying "Time travel is just geometry." He is saying "If this geometry is possible, then the *experience* of traveling is an illusion."
  *   **The Trap:** If time is truly an illusion (Gödel's Claim D), then the *traveler's experience* of making a decision to enter the machine is also an illusion. You can't use "time is an illusion" to solve the Grandfather Paradox while still treating the traveler as an agent making choices. That retains the A-Series (agency/change) while denying the A-Series (time).

  ### How to intervene in your group

  Next time they drop the slogan, ask this:

  > "Are we making Gödel's **modal argument** (that objective time can't be fundamental if it vanishes in possible worlds), or are we just noting the **foliation failure** (no global $t$)? And if we say time is an illusion, are we McTaggartians denying the A-series, or just Eternalists saying the Block is static?"

  If they can't answer that, they are using "illusion" as a placeholder for "I don't want to deal with the metaphysics of CTCs."

  **Summary for your notes:**
  1.  **Foliation/CTCs:** True facts about the metric. (Platitudes).
  2.  **Modal Argument:** Gödel's actual philosophical move. (Controversial).
  3.  **Psychological Idealism:** Gödel's conclusion. (Often ignored by physicists).
  4.  **McTaggart:** Different argument, same conclusion. (Distinguish them).
  5.  **Dismissive "Block" Move:** Often incoherent mixing of agency and eliminativism. (Call it out).
