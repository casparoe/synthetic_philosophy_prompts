answer: |-
  The bar was quiet, just the hum of the fridge and two grad students nursing cheap lager. Phil, the presentist, stared into his glass like it held the only real moment in the universe.

  "It's the weight," Phil said. "I know only 'now' exists. The past is gone, the future isn't here. But the memory of it… it feels dense. Like a continuum. Uncountably many lost moments pressing on this one."

  Dana, the set theorist, swirled their drink. "You're treating your consciousness like a standard model of ZFC."

  "I'm treating it like grief, Dana."

  "Same thing. You think you have uncountably many past states because you can't find a bijection between them and the integers from inside your head."

  Phil blinked. "Because I'm busy feeling them?"

  "Because you're inside the model. Skolem's paradox. Your internal logic satisfies the sentence 'there exists an uncountable set of moments,' but only because the function that counts them isn't *in* the model with you." Dana leaned in. "But from the outside? From the metatheory?"

  "Where you're sitting."

  "Where I'm sitting. I can enumerate your neurons. I can map your history to natural numbers. Your 'uncountable' past is just a countable set pretending to be big because you lack the perspective to see the mapping."

  Phil sighed. "So you're saying my suffering is countable."

  "I'm saying 'uncountable' isn't absolute. It's model-relative. You're only uncountable to yourself. From my barstool…" Dana signaled the bartender. "…you're recursively enumerable. Pass the peanuts."

  Phil pushed the bowl away. "You know, for a second I thought you were going to say something deep."

  "I did. I proved you're small."

  "Thats it. I'm leaving."

  "Wait," Dana called after him. "You cant even leave! From outside this conversation, you never arrived!"

  Phil flipped him off from the door. Dana smiled. It was a countable gesture, but it felt big.
