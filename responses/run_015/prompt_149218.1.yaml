answer: |-
  What is missing is not reliability, but the intentional object of the will. In the unreflective helper, the concern for the person *is* the right-making feature present in consciousness; the value of the need drives the action directly. Mira's will, however, takes grandmotherly approval as its object, not the loser's claim. Even if that approval covaries perfectly with rightness, she acts for the sake of the relationship, not the sake of the right. She treats the right-making feature as a condition for gaining love, not as a reason for action in its own right. Semantic deference allows correct reference, but moral worth requires grasping the value, not just producing the output. Mira cannot cite the loser's need as her reason; she cites her relationship. If the grandmother suddenly approved of theft, Mira would steal, proving her will is anchored to the person, not the principle. The unreflective helper would not, because their concern is for the person harmed, not an external validator. Moral worth demands the agent's own grasp of the claim, not a borrowed proxy, however accurate. Deference surrenders the authority of the will to another, stripping the act of the agent's own moral engagement.
