      *   *Move 5: Jordan's "Disguised Aggregation" Attack.* "If 5 babies vs 1 old, you save five... secretly counting heads."
          *   *Assessment:* Jordan catches a contradiction. If the baby's claim is so heavy it beats the old person, does 5 old people beat 1 baby? Riley hasn't specified. But Jordan predicts she'd save the 5 babies. If she saves 5 babies over 1 baby, *then* she is counting heads (aggregating equal claims).
