prompt: |-
  hey, you're playing the role of an expert in normative ethics and moral psychology—think of yourself as a consultant for my novel. before diving in, do a quick brainstorm: map the premises, flag any hidden shifts in scope or quantifier, and recieve the argument with care. then think step by step.

  so i'm writing a scene where my philosopher-protagonist scribbles this in her notebook to attack consequentialism, but now i'm afraid it's too slick and hides a slip. can you tell me which step is the weak link and what it costs me to reject it? i'd rather keep the intuition that a theory can't call every normal life mostly wrong.

  (1) consequentialism says an act is right iff it produces the best available outcome.

  (2) for any particular good deed i actually finish—tutoring, donating, helping a friend—theres always some other deed with a higher yield (more tutoring, more donating, etc.).

  (3) so for every particular good deed i finish, consequentialism implies i should have done the higher-yield one instead.

  (4) but i can't do all those alternatives at once; i have to pick one and move on, and rest and art occur in the gaps.

  (5) still, whatever i pick, theres a better option, so consequentialism always says my actual choice was wrong.

  (6) now, no human life can avoid this—rest, friendship, art, all fall short of the global optimum.

  (7) therefore consequentialism judges that every human life is composed mostly of wrong actions.

  (8) but a moral theory that brands every normal life as mostly sinful isnt describing morality; its describing universal failure.

  (9) so consequentialism must be false.

  where's the error? is it in (5) treating not-best as wrong? is there a quantifier slip between (2) and (5)? if i have to choose, i want to keep (7) and (8) because they match my character's voice, but i need to know what im paying.
