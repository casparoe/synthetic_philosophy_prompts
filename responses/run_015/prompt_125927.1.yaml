          *   *The "Mostly" Problem:* Step (7) says "mostly wrong." Step (5) implies *every* non-optimal act is wrong. If *every* act is wrong, then *100%* of life is wrong, not just *mostly*. But (7) says "mostly." Why the downgrade? Maybe some acts *are* optimal? But (6) says "No human life can avoid this." So (7) is actually an understatement if (5) holds.
