          *   (C2) Voting age 16 (municipal, support nationally).
          *   (C3) Non-citizen residents (3+ years) get municipal franchise.
          *   (C4) Non-citizen residents do *not* get national franchise.
          *   (C5) Principle: All-affected principle (durably subject to coercion -> say) + Procedural presumption (burden of proof on exclusion).
