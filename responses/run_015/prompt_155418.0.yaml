  ### False Tensions

  **C2 vs. C5:** This dissolves on inspection. C5 grants the franchise to anyone "durably subject to a government's coercion." Sixteen-year-olds are subject to municipal coercion (bylaws, policing, services). C2 is a direct application of C5, not a tension.

  **M vs. C1:** This dissolves if the justification for forfeiture is framed correctly. M rejects symbolism; C1 uses forfeiture. If you argue forfeiture maintains roll accuracy (ensuring the registered electorate reflects those with active interests to register) rather than enforcing civic duty, the mechanism serves the interest-based methodology. The tension only exists if you defend C1 as ritualistic.

  ### Principle vs. Verdict Audit

  Your principle (C5) cannot deliver verdict (C4). C5 states: "anyone durably subject to a government's coercion must have a say in who wields it." Long-term residents are durably subject to national coercion (tax, criminal law, immigration enforcement). Therefore, C5 logically demands a national franchise for residents. C4 denies this.

  C2 and C3 are consistent with C5. C4 is the outlier. To make the set hang together, **C4 has to move**. You cannot maintain C5 as a universal principle while arbitrarily restricting its application at the national level without introducing a new, unstated principle (e.g., "citizenship trumps residence for national elections"), which would undermine C5's status as your grounding norm.

  ### Single Revision

  **Revision:** Amend **(C4)** to support the national franchise for long-term residents.

  **Cost:** You lose the ability to maintain a "two-tier" demos where local integration suffices for voting but national membership requires citizenship. This makes your package philosophically coherent but politically more radical. It commits you to a position that contradicts existing national law, limiting the immediate practical uptake of your national recommendation, though it preserves the integrity of your advisory role.

  **Empirical Claim:** This revision relies on the claim that national coercion over residents is functionally equivalent to municipal coercion in durability and impact. If national coercion is deemed transient or consensual (e.g., visa holders), C5 might not apply, but for "lawful residence" of three years, the empirical case for durable subjection is strong.

