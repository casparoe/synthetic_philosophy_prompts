  6.  **Refining the Scoring Logic:**
      *   Create a "Key" for each question indicating which answer aligns with which theory.
      *   *Note:* Theories aren't monolithic. I need to generalize "broad families."
      *   *Welfare:* Prioritize subjective state.
      *   *Resource:* Prioritize objective share + responsibility.
      *   *Capability:* Prioritize effective opportunity.
      *   *Threshold:* Prioritize minimum floor.

