answer: |-
  # The Distributive Justice Diagnostic Quiz

  **Instructions:** Below are nine scenarios involving two people and a limited amount of support (money, goods, or policy attention) available from a public distributor. For each scenario, choose the option that best matches your judgment about what justice requires. There are no right or wrong answers; the goal is to reveal your intuitive priorities.

  **Response Options for all items:**
  *   **(A)** Favor Person A (Give them more support/resources).
  *   **(B)** Favor Person B (Give them more support/resources).
  *   **(=)** Treat Equally (Give them the same support, or no special favor to either).

  ---

  ### 1. The Musician and the Walker
  **Person A** is a musician. To feel a normal level of daily contentment, they require expensive, high-quality equipment to practice. Without it, they feel deeply frustrated.
  **Person B** is a neighbor who finds deep contentment in daily walks through public parks, which cost nothing.
  *Both currently have the same income.*
  **Who should a public well-being grant favor?**
  ( ) Favor A (to match their contentment level)
  ( ) Favor B
  ( ) Treat Equally

  ### 2. The Library Access
  **Person A** uses a wheelchair. They report being very happy with their life overall, but the only public library in town has steps and they cannot enter it.
  **Person B** can walk and uses the library regularly. They report being very happy.
  *A fund exists to improve public access.*
  **How should the fund be used?**
  ( ) Favor A (prioritize ramp installation/access)
  ( ) Favor B
  ( ) Treat Equally (no special priority, since A is already happy)

  ### 3. The Communal Grain
  **Person A** is a woman in a traditional community. She receives an equal share of grain as everyone else, but custom forbids her from eating in the communal hall. She eats alone and suffers from malnutrition.
  **Person B** is a man. He receives an equal share of grain, eats in the hall, and is well-nourished.
  *A distributor can allocate extra food or enforce eating rights.*
  **Who requires justice-oriented intervention?**
  ( ) Favor A (to ensure effective nourishment)
  ( ) Favor B
  ( ) Treat Equally (they already have equal grain shares)

  ### 4. The Expensive Hobby (Chosen)
  **Person A** has deliberately trained their palate over years to enjoy only rare, expensive wines. They are unhappy with cheap wine.
  **Person B** enjoys standard, affordable wine and is satisfied.
  *Both have the same income.*
  **Should a subsidy for leisure favor either?**
  ( ) Favor A
  ( ) Favor B
  ( ) Treat Equally (A is responsible for their own taste)

  ### 5. The Medical Sensitivity (Unchosen)
  **Person A** has a rare, unchosen metabolic condition. They suffer physical pain unless they eat a specific, expensive organic diet.
  **Person B** has a standard metabolism and stays healthy on a cheap diet.
  *Both have the same income.*
  **Should a health subsidy favor either?**
  ( ) Favor A
  ( ) Favor B
  ( ) Treat Equally

  ### 6. The Gambler and the Saver
  **Person A** received a standard inheritance but gambled it away recklessly. They are now in poverty.
  **Person B** received the same inheritance, saved it carefully, and is now comfortable.
  *New emergency aid is available.*
  **Who should receive more aid?**
  ( ) Favor A (to relieve their poverty)
  ( ) Favor B
  ( ) Treat Equally (A is responsible for their loss)

  ### 7. The Contented Laborer (Adaptation)
  **Person A** has worked in a harsh factory for decades. They say they are "quite happy" and do not wish for safer conditions, having grown used to the risk.
  **Person B** works in an office and demands high safety standards, reporting stress when standards slip.
  *Safety improvement funds are limited.*
  **Where should safety improvements be prioritized?**
  ( ) Favor A (their situation is objectively more dangerous)
  ( ) Favor B
  ( ) Treat Equally (respect A's reported happiness)

  ### 8. The Luxury Gap (Sufficiency)
  **Person A** has a modest home, adequate food, and healthcare. They are secure but have no luxuries.
  **Person B** has a mansion, gourmet food, and premium healthcare. They are secure and wealthy.
  *A tax policy could redistribute from B to A.*
  **Is redistribution required for justice?**
  ( ) Favor A (reduce the gap between them)
  ( ) Favor B
  ( ) Treat Equally (both have enough; the gap does not matter)

  ### 9. The Pain Sensitivity
  **Person A** and **Person B** both break a leg in the same accident.
  **Person A** has a nervous system that makes them feel pain twice as intensely as the average person.
  **Person B** feels standard pain levels.
  *Painkillers are in short supply.*
  **Who should receive more medication?**
  ( ) Favor A (to equalize the suffering)
  ( ) Favor B
  ( ) Treat Equally (equal injury deserves equal treatment)

  ---

  # Scoring Guide & Pedagogical Debrief

  This guide helps you map student responses to four broad families of distributive justice. Note that real-world views are often hybrid; look for the *dominant* pattern.

  ### 1. The Four Families

  | Family | Core Intuition | Characteristic Response Profile |
  | :--- | :--- | :--- |
  | **Welfare Egalitarianism**<br>*(Equalize Felt Satisfaction)* | Justice is about making people equally happy or minimizing suffering. Needs are defined by subjective experience. | **Favor A** on Items 1, 4, 5, 7, 9.<br>**Ignore Responsibility:** Likely favors the Musician (1) and the Gambler (6) if they are suffering.<br>**Blind Spot:** May ignore the Wheelchair user (2) if they claim to be happy. |
  | **Resource Egalitarianism**<br>*(Equalize Means + Responsibility)* | Justice is about giving everyone an equal share of tools/money. People are responsible for their choices (tastes, prudence). | **Treat Equally (=)** on Items 1, 3, 5, 9.<br>**Penalize Choice:** Favors B on Item 4 (Chosen Taste) and Item 6 (Gambler).<br>**Blind Spot:** May ignore the Woman (3) if she technically has equal grain, or the Wheelchair user (2) if resources were equal. |
  | **Capability Egalitarianism**<br>*(Equalize Effective Freedom)* | Justice is about what people can actually *do* or *be* (functionings). Resources only matter insofar as they enable freedom. | **Favor A** on Items 2, 3, 5, 7.<br>**Nuanced Responsibility:** Likely favors A on Item 5 (Unchosen) but B on Item 4 (Chosen).<br>**Key Marker:** Prioritizes the Woman (3) and Wheelchair User (2) despite equal resources or reported happiness. |
  | **Sufficientarianism**<br>*(Threshold View)* | Equality matters only below a level of "enough." Above that threshold, inequality is irrelevant. | **Treat Equally (=)** on Item 8 (Luxury Gap).<br>**Conditional Favor:** May favor A on Items 1, 6, 7 *only if* A is below the threshold of sufficiency. If A is merely less happy than B but still "okay," they choose (=). |

  ### 2. Identifying Unstable or Unoccupied Profiles

  Certain combinations of answers suggest conceptual confusion or instability, which can be fruitful points for class discussion:

  *   **The "Responsibility Inconsistency":** A student who favors the **Musician (Item 1)** (compensating for expensive needs) but penalizes the **Gambler (Item 6)** (refusing to compensate for loss).
      *   *Why unstable:* Both involve a person having less than another due to a specific trait/choice. If you compensate for unchosen expensive tastes (Welfare), consistency suggests compensating for unchosen bad luck (Gambler's loss might be luck). If you hold people responsible for tastes (Resource), you should hold them responsible for gambles.
  *   **The "Happy Oppressor":** A student who chooses **Treat Equally (=)** on the **Wheelchair (Item 2)** and **Woman (Item 3)** cases because "they say they are happy" or "they have equal stuff," but chooses **Favor A** on the **Pain (Item 9)** case.
      *   *Why unstable:* This prioritizes subjective pain (Item 9) over objective freedom (Items 2 & 3). It suggests a Welfare view that suddenly vanishes when the subject claims adaptation (Item 7 or 2).
  *   **The "Strict Threshold":** A student who chooses **Treat Equally (=)** on **Item 8** (Luxury Gap) but also **Treat Equally (=)** on **Item 1** (Musician) even if the Musician is miserable.
      *   *Why unstable:* If equality doesn't matter above the threshold, does misery matter below it? This profile needs to clarify if they are Sufficientarians or Resource Egalitarians.

  ### 3. Limitations and Blind Spots of this Quiz

  While this diagnostic reveals broad commitments, nine vignettes cannot perfectly separate every theoretical family. Be explicit with students about where further cases would be needed:

  *   **Resource vs. Capability (The "Conversion" Blind Spot):**
      *   *The Problem:* In many cases (like Item 5, Medical Sensitivity), Resource and Capability theorists agree: give the person more resources so they can function.
      *   *Where they diverge:* They separate only when *more resources cannot fix the capability*. For example, if the Library (Item 2) refuses entry to wheelchair users regardless of ramps, or if the Woman (Item 3) cannot eat publicly even if given double grain.
      *   *Further Case Needed:* A scenario where Person A has more money than Person B but is legally or socially barred from a specific function (e.g., voting, marrying) that B can perform. Resource theory might say "A is richer, justice is done"; Capability theory says "A lacks freedom, justice is not done."
  *   **Welfare vs. Capability (The "Valued Functioning" Blind Spot):**
      *   *The Problem:* Item 2 (Library) probes this, but a student might argue "Reading isn't essential."
      *   *Where they diverge:* If Person A is happy but excluded from a *trivial* function (e.g., using a specific park bench). Welfare says ignore; Capability says it depends on if that function is part of a valuable life.
      *   *Further Case Needed:* A case involving exclusion from a socially significant but non-essential activity to test if the student values the *freedom* itself or just the *well-being* derived from it.
  *   **Resource vs. Threshold (The "Depth of Poverty" Blind Spot):**
      *   *The Problem:* If all the "disadvantaged" characters in this quiz (Musician, Gambler, Woman) are interpreted by the student as being *below* a sufficiency threshold, Resource Egalitarians and Sufficientarians will give identical answers.
      *   *Further Case Needed:* A case where Person A is below Person B, but *both* are clearly above a decent minimum (e.g., A has 3 cars, B has 5). Resource Egalitarians may still want to equalize; Sufficientarians will definitely not. (Item 8 attempts this, but students may disagree on what counts as "enough").

  ### 4. Suggested Debrief Flow
  1.  **Tally:** Ask students to count how many times they favored the "disadvantaged" person (A) vs. choosing Equality.
  2.  **Cluster:** Group students by their answers on the "Responsibility" questions (4, 5, 6). This usually creates the sharpest divide.
  3.  **Probe:** Focus on Item 3 (Woman/Grain). Ask those who chose "Treat Equally" if they believe the woman is well-nourished. If they say "No," ask why equality of grain mattered more than equality of nutrition. This introduces the **Resource vs. Capability** distinction.
  4.  **Probe:** Focus on Item 2 (Wheelchair). Ask those who chose "Treat Equally" if they believe happiness is the only thing that matters. This introduces the **Welfare vs. Capability** distinction.
