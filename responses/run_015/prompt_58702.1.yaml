      1.  **Musician vs. Walker:** (Expensive needs for welfare).
      2.  **Wheelchair/Library:** (Capability vs. Welfare).
      3.  **Woman/Grain:** (Social conversion/Capability vs. Resource).
      4.  **Chosen Expensive Taste:** (Responsibility).
      5.  **Unchosen Expensive Taste:** (Responsibility exemption).
      6.  **Gambler vs. Saver:** (Prudence/Responsibility).
      7.  **Adapted Preferences:** (Happy slave/servant vs. Dissatisfied free person).
