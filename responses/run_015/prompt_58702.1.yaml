          *   No prior background in econ/philosophy.
          *   Plain language (no jargon like "utilitarianism," "Rawls," "capabilities").
          *   Forced-choice format (Person A vs. Person B vs. No Favor/Equal).
          *   Must include specific scenarios:
              1.  Musician (costly equipment for ordinary contentment) vs. Neighbor (costless walks).
              2.  Wheelchair user (high satisfaction, no library access) vs. Able-bodied person.
              3.  Woman (custom prevents eating with men, formal parity $\neq$ nourishment) vs. Man.
              4.  Expensive taste (deliberate) vs. Expensive taste (unchosen).
              5.  Imprudent choices.
              6.  Adaptation to deprivation.
          *   Total items: 9.
          *   Output: Quiz + Scoring Guide (mapping to 4 families: Welfare, Resource/Responsibility, Capability/Functioning, Sufficientarian/Threshold).
          *   Scoring Guide requirements: Identify unstable profiles, explain why, note where vignettes fail to distinguish families and suggest further cases.

  2.  **Deconstruct the Four Families (Theoretical Underpinnings):**
      *   *Welfare Egalitarianism (Equal Happiness/Satisfaction):* Focus on subjective well-being. If someone needs more to be happy, give it to them. Adaptive preferences count (if they are happy, they are fine).
      *   *Resource Egalitarianism (Equal Means + Responsibility):* Focus on objective goods/money. Everyone gets the same bundle. If you have expensive tastes, that's your problem (unless unchosen). Adaptive preferences don't trigger extra resources if the resource share is equal.
      *   *Capability Egalitarianism (Equal Freedom/Functioning):* Focus on what people can actually *do* or *be*. If a disability prevents using resources, give extra to enable the function. Social norms blocking access matter.
      *   *Sufficientarianism (Threshold):* Equality matters only until everyone has "enough." Above the threshold, inequality is fine.

  3.  **Drafting the 9 Vignettes:**
      *   *Requirement 1: Musician vs. Walker.* (Expensive needs for same welfare).
