      *Wait, Item 4 & 5 need to be forced choice.*
      *   Item 4: Person A (Cultivated Taste) vs Person B (Modest Taste).
      *   Item 5: Person A (Medical Need) vs Person B (Modest Need).
      *   This works.

  4.  **Drafting the Questions (Plain Language):**
      *   Avoid "utility," "capabilities," "primary goods."
      *   Use "happiness," "freedom to do," "stuff/money."
      *   Options: "Give more to A," "Give more to B," "Give equal/No special favor."

  5.  **Developing the Scoring Guide:**
      *   Need to map patterns to the 4 families.
      *   *Welfare:* Favor those with lower happiness/higher pain/adaptive needs. Ignore responsibility sometimes.
      *   *Resource:* Favor equal shares. Penalize imprudence/cultivated tastes. Ignore happiness gaps if shares equal.
      *   *Capability:* Favor those blocked from functioning (library, grain) even if happy or if resources equal.
      *   *Threshold:* Favor only if below "enough." Ignore gaps above.
      *   *Unstable Profiles:* E.g., Favoring unchosen tastes but not disabilities? Or Favoring equality in resources but also favoring expensive tastes? (Inconsistent).
      *   *Indistinguishable Cases:* Where Resource and Capability might overlap (e.g., if resources perfectly convert to function). Need a case where resources *don't* help (e.g., legal ban). Actually, the Grain case covers this. Maybe Wheelchair vs. Pain?
