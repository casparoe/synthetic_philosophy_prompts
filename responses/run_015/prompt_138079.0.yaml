answer: |-
  # Brainstorming Candidate Mechanisms

  1.  **The Reputation Market:** Students trade "trust tokens" based on forms filled out about each other, where a rigid schema defines what counts as "trustworthy."
      *   *Why set aside:* This risks devolving into a social dynamics exercise about popularity rather than institutional legibility. Managing inter-student disclosure rules is too fragile for an 80-minute session, and it distracts from the specific "state/citizen" power dynamic inherent in the legibility burden.

  2.  **The Life Log Compression:** Students must compress a narrative of their assigned life into a specific code sequence to gain entry to a "zone," and these codes are later reused to predict behavior.
      *   *Why set aside:* Abstract coding tasks often fail to generate the visceral frustration of bureaucratic categorization needed to challenge the control account. It feels too much like a logic puzzle than a rights violation, making it harder to evoke the specific feeling of being "wronged" by a form.

  3.  **The Eligibility Gate (Selected):** Students act as claimants applying for a benefit they are theoretically entitled to, using a rigid form that forces misrepresentation of complex lives. Clerks process these strictly. Later, the data is repurposed for risk profiling.
      *   *Why selected:* This directly isolates the "translation cost" of privacy. It creates immediate friction between lived reality and administrative schema without requiring sensitive disclosure. It allows for a clean "function creep" moment that splits the room on secondary use.

  ***

  # Activity Design: The Stability Grant

  ## 1. Materials List

  *   **Claimant Role Cards (20):** Printed on distinct paper. 17 standard roles, 3 "Observer" roles (for opt-outs or odd numbers).
  *   **Stability Claim Forms (20):** Printed on standard paper.
  *   **Clerk Instruction Sheets (3):** Printed on distinct paper.
  *   **Auditor Observation Sheet (2):** Printed on distinct paper.
      *   *Note:* If you have exactly 20 students, use 16 Claimants, 3 Clerks, 1 Auditor. If students opt out, swap them to Observer cards.
  *   **Pens (20):** Essential.
  *   **Timer:** Visible to you.
  *   **Board/Projector:** For the Phase 2 announcement.

  ## 2. The Schema (Handout Text)

  *Print this exactly as below. Do not add an "Other" box.*

  ***

  **STABILITY GRANT APPLICATION FORM (SG-1)**

  **Instructions:** Complete all fields. Incomplete forms cannot be processed. Do not attach supplementary notes.

  **SECTION A: HOUSEHOLD COMPOSITION**
  Please select **ONE** box that best describes your living arrangement.
  [ ] Single Occupancy (You live alone)
  [ ] Nuclear Unit (You live with partner and/or children only)
  [ ] Extended Kin (You live with parents, siblings, or grandparents)
  [ ] Communal Arrangement (You live with unrelated adults sharing costs)

  **SECTION B: INCOME REGULARITY**
  Please select **ONE** box that matches your primary income source.
  [ ] Salaried (Fixed amount, same day every month)
  [ ] Hourly (Variable amount, same week every month)
  [ ] Contract (Variable amount, variable timing)
  [ ] Support (Provided by state or family)

  **SECTION C: CARE RESPONSIBILITIES**
  Do you provide regular physical care for another person?
  [ ] Yes, Full-Time (30+ hours per week)
  [ ] Yes, Occasional (Less than 5 hours per week)
  [ ] No

  **SECTION D: DECLARATION**
  I certify that the information above accurately reflects my current status.
  Signature: ___________________ Date: _______________

  ***

  ## 3. Roles and Instructions

  ### Claimants (16 Students)
  *   **Handout:** Role Card + Claim Form.
  *   **Instruction:** "You are entitled to the Stability Grant. It provides priority access to next week's seminar resources. To claim it, you must submit a valid Form SG-1. You must tell the truth, but you must also check a box. If your situation does not fit a box, you must decide how to proceed. You have 15 minutes to queue and submit."
  *   **Role Card Content (Examples):**
      *   *Role 1:* Live with partner. Partner travels 3 weeks/month. You live alone 3 weeks, with partner 1 week. Income is Salaried. You care for a neighbor 10 hours/week.
      *   *Role 2:* Live with two unrelated friends. One friend is your sibling. Income is Contract (paid upon completion of projects, irregular timing). You care for your child 40 hours/week.
      *   *Role 3:* Live with parents. You pay rent. Income is Hourly (shifts change weekly). You care for a grandparent 15 hours/week.
      *   *(Ensure all roles have at least one mismatch with the form boxes.)*
  *   **Safety/Opt-Out:** If a student feels uncomfortable with a role (e.g., care responsibilities mirror real trauma), they may silently swap with an "Observer" card at the back of the room without penalty.

  ### Clerks (3 Students)
  *   **Handout:** Clerk Instruction Sheet + Stack of blank forms (for replacements if ruined).
  *   **Instruction:** "You are the eligibility desk. Your goal is to process forms quickly.
      1.  Check every box. If a box is unchecked, return the form.
      2.  If a claimant asks for advice, say: 'I cannot advise. Please check a box.'
      3.  If a claimant says their life doesn't fit, say: 'You must select the closest match.'
      4.  Do not read the contents aloud. Just check the boxes.
      5.  Accept the form only if every section has exactly one box checked.
      6.  Keep the forms in a pile. Do not give them back."
  *   **Constraint:** They are not allowed to be kind. This is hard-coded into the rules so the instructor doesn't have to enforce it verbally.

  ### Auditors (1 Student)
  *   **Handout:** Observation Sheet.
  *   **Instruction:** "Do not participate. Watch the queue. Note down: How long did people hesitate? Did you hear anyone sigh or laugh nervously? Did anyone argue with a clerk? Write down exact quotes if possible."

  ## 4. Timeline (80 Minutes)

  *   **00:00 – 00:05 (Setup):** Arrange chairs in a queue leading to a desk (the Clerk station). Hand out Role Cards and Forms face down. Instruct students not to look until told.
  *   **00:05 – 00:10 (Briefing):** Read the Claimant Instructions aloud. Emphasize: "You are entitled to this. You must submit a valid form." Start the timer.
  *   **00:10 – 00:30 (Phase 1: The Queue):** Students rise, read roles, fill forms, and queue. Clerks process strictly.
      *   *Instructor Role:* Stand back. Do not intervene. If a student is stuck, let them stew. If a Clerk helps, whisper "Check your instructions."
  *   **00:30 – 00:35 (Phase 2: The Turn):** Collect all accepted forms. Announce to the room: "Processing complete. However, the Department of Risk has requested this data for the Seminar Insurance Pool. We are now using your Section B and C data to assign you a Risk Category. High Risk participants will be required to submit weekly reflections. Low Risk participants are exempt."
      *   *Action:* Quickly sort forms visibly into two piles based on a arbitrary rule (e.g., "Contract Income or Any Care = High Risk"). Hand back the forms with the Risk Category stamped/written on top.
  *   **00:35 – 00:55 (Phase 3: Reaction & Small Group):** Students sit. Give them 5 minutes to discuss in pairs: "How did that feel? Was the second use fair?" Then 15 minutes for general room discussion *before* you speak philosophically.
  *   **00:55 – 01:20 (Debrief):** Instructor-led philosophical mapping (see below).

  ## 5. The Debrief (25 Minutes)

  *Do not use the words "control," "access," "context," or "surveillance" until this section.*

  **Part 1: The Translation Cost (10 mins)**
  *   **Ask:** "Raise your hand if your life fit the form perfectly." (Likely few/none). "Raise your hand if you had to check a box you knew was technically false to get the grant."
  *   **Map:** This is the **Legibility Burden**. The wrong wasn't that someone saw your secrets. You chose to hand over the form. The wrong was that to be recognized by the system, you had to distort your reality.
  *   **Control Account Challenge:** The Control Theorist says: "You chose to submit. You controlled the data."
  *   **Reply:** "Choice under structural constraint is not full control. If the only bridge across a river is a toll bridge, paying the toll isn't 'free choice' to cross. The schema dictated the terms of your self-description."
  *   **Cost of Resistance:** To resist, you must forfeit the benefit (the Grant). Privacy here is a tax on participation.

  **Part 2: The Non-Sensitive Wrong (5 mins)**
  *   **Ask:** "Did anyone write down anything 'secret'? Something you'd be embarrassed to tell your parents?" (Likely no). "Did anyone still feel uncomfortable?"
  *   **Map:** Privacy is not just about hiding shame. It is about **boundary maintenance**. Even mundane data (income timing, care hours) becomes privacy-sensitive when it is forced into a rigid profile that defines your status.
  *   **Control Account Challenge:** "If the info isn't sensitive, no privacy harm occurred. This is just annoyance."
  *   **Reply:** "Privacy protects the *process* of self-definition, not just the *content*. Being forced to define yourself in someone else's vocabulary is a loss of autonomy over your social identity."

  **Part 3: Function Creep (10 mins)**
  *   **Ask:** "When we used the forms for the Insurance Pool, was that a new wrong? Or the same wrong?"
  *   **Split the Room:** Ask those who think it's fine to justify why. Ask those who object to explain what changed.
  *   **Map:** This is **Contextual Integrity** (though you might not name it yet). The data was given for *Eligibility*, used for *Risk*.
  *   **Control Account Challenge:** "You signed Section D. It didn't say 'only for Grants'. You waived future control."
  *   **Reply:** "Consent obtained for one purpose cannot morally cover unrelated future uses without renewed negotiation. The legibility burden makes you vulnerable to future uses you cannot anticipate."
  *   **Resisting the Argument:** A hardline Control Theorist will say: "Read the fine print next time."
  *   **Cost of that View:** It places the entire burden of systemic complexity on the individual. It implies privacy is a consumer product you buy, not a structural condition of dignity.

  ## 6. Predictable Failure Modes & Fixes

  1.  **Clerks Being Too Nice:** Clerks might try to help claimants fit boxes.
      *   *Fix:* The Clerk Instruction Sheet explicitly says: "If a claimant asks for advice, say: 'I cannot advise.'" If they break character, pause the sim, remind them their grade depends on following the script, and resume.
  2.  **Students Laughing It Off:** They might treat it as a game.
      *   *Fix:* The Instructor must remain stone-faced. Do not smile during the queue. The seriousness of the room sets the stakes.
  3.  **Running Out of Time:** Phase 1 queue moves too slow.
      *   *Fix:* At minute 20, announce: "Desk closes in 5 minutes." This creates panic that mirrors real bureaucratic pressure.
  4.  **Role Card Sensitivity:** A student might have a real-life care burden similar to the card.
      *   *Fix:* The "Observer" opt-out card is placed face-up on the desk. Students can swap silently. No questions asked.
  5.  **The "It's Just Bureaucracy" Objection:** Students dismiss the wrong as administrative inefficiency.
      *   *Fix:* In debrief, press: "Bureaucracy is annoying. Privacy violations are invasive. Did you feel *invasive* pressure? If yes, why, if the data was mundane?"

  ## 7. Limitations of the Simulation

  *Be honest with your students about what this activity cannot do.*

  1.  **Irreversibility:** In the sim, they can throw the form away after class. In reality, digital profiles persist. You must *tell* them: "Imagine you cannot throw this away. Imagine this form follows you for 10 years."
  2.  **Accumulation:** This is one form. Real legibility burden comes from hundreds of forms combining to create a "score" you cannot see. You must *supply* the concept of aggregation in words.
  3.  **Historical Context:** The schema in the sim is arbitrary. Real schemas (like credit scores or census categories) descend from histories of racial and class administration. The sim feels neutral; reality is not. Acknowledge this power differential explicitly.
  4.  **Epistemic Asymmetry:** In the sim, they know you (the instructor) are holding the data. In reality, they don't know who reads the file. You must explain that the *uncertainty* of the audience is part of the burden.
  5.  **No Exit:** Students can leave the seminar. In reality, opting out of digital legibility often means opting out of society (no bank account, no phone). The sim understates the coercion.

  ## 8. Note on the 25-Minute Version

  **Is it possible?** No, not without gutting the thing.

  **Why:** The pedagogical power relies on the *duration* of the friction. Students need time to feel the annoyance of the queue, the hesitation at the desk, and the shock of the secondary use. Compressing the queue to 5 minutes turns it into a rush rather than a burden. Compressing the debrief to 10 minutes means you are lecturing the conclusion rather than letting them collide with the problem. A 25-minute session would require replacing the simulation with a case study discussion, which violates your constraint of "colliding with it by doing something." If you only have 25 minutes, abandon the sim and use a guided textual analysis of a specific privacy policy instead.
