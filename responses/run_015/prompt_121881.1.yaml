  2.  **Brainstorming the Conceptual Tension:**
      *   *Exploitation (Capital):* Structural, objective. Based on surplus value. Requires capital-labor relation. Worker sells labor power; capitalist buys it. Surplus is appropriated by non-worker. In circulation, it looks equal (wages for work). In production, it's unequal (unpaid labor time).
      *   *Alienation (1844 Manuscripts):* Phenomenological, subjective/experiential (though rooted in objective conditions). Four dimensions: product, process, species-being, others. Rooted in private property and divided labor.
      *   *The Tension:* Exploitation requires a class relation (capitalist vs. worker). Alienation seems rooted in the organization of labor and property relations.
