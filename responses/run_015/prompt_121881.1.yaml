      *   *Question:* Is there alienation? Yes, likely. The algorithm fragments work, hides the product, isolates workers. This fits the 1844 description regardless of who owns the factory.
      *   *Normative Premises:* Exploitation critiques unfair distribution/appropriation (justice/freedom). Alienation critiques the deformation of human potential/activity (flourishing/freedom).
      *   *Can they come apart?* Yes. One can be exploited (surplus taken) but not alienated (craftsmen under guilds? maybe not Marx's view). One can be alienated (co-op with Taylorist management) but not exploited (in the strict class sense of surplus going to a capitalist).
      *   *Marx's View on Cooperatives:* He viewed them positively as proof workers can manage production, but noted they still operate within capitalist market constraints (real subsumption).
      *   *Key Distinction:* Formal vs. Real Subsumption. Even if ownership changes (formal), if the labor process remains capitalist (fragmented, controlled by machinery/algorithm), real subsumption persists.

