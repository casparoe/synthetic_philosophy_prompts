answer: |-
  # Q&A Prep Sheet: "The Utility Monster Is a Unit Convention"

  **Audience Dynamics:** The economists will try to translate you into cost-benefit analysis (CBA) to make you harmless. The philosophers will try to trap you in meta-ethical realism. The methodologist is the wild card who can expose operational vacuity.
  **Time Management:** 50 minutes is a long Q&A. They will circle back. Do not let the Utilitarian drag you into a metaphysics rabbit hole in the first 10 minutes.

  ### The One Reply That Must Land
  **Target:** The Total Utilitarian (Question 2).
  **The Point:** You must convince the room that **interpersonal comparability is not an empirical discovery but a normative bridge.**
  **Why:** If the Utilitarian convinces the room that welfare ratios are *facts of nature* (e.g., "neural intensity is objectively comparable"), your thesis collapses into triviality or falsehood. You must hold the line: "Cardinality within a person is a fact; the *ratio* between persons is a convention." If this lands, the rest of the Q&A is just arguing about *which* convention to pick. If this fails, the paper is dead.

  ---

  ### The Q&A Sequence (8 Questions)

  #### 1. The "So What?" Translation
  **Who:** Senior Public Finance Economist.
  **The Question:** "Let's say I accept your affine transformation story. In optimal tax literature, we handle this with distributional weights in the social welfare function. You seem to be deriving those weights from a normalization rule. Is this anything more than a semantic relabeling of the Atkinson-Stiglitz framework? What number changes in my model?"
  **Your Reply (2 min):** "It changes the *justification* of the number, which changes its stability. In your framework, distributional weights are often ad-hoc parameters fitted to intuition. I'm arguing they are implicit commitments to a specific interpersonal metric. If you admit the weights are moral choices, you stop pretending they are empirical estimates. The number might look the same, but you can no longer claim it's 'value-free' efficiency."
  **Soft Spot:** Economists hate being told their "parameters" are moral philosophy. They will insist their weights are revealed social preferences.
  **Flag:** **Duplicate Vocabulary.** This is the same objection as Question 6 (Prioritarian), just in econ-speak. Do not give a fundamentally new answer later.

  #### 2. The "Welfare Is Real" Objection
  **Who:** The Unrepentant Total Utilitarian.
  **The Question:** "I've heard this 'unit' argument before. It turns on the claim that utility is only ordinal or unit-arbitrary. But if welfare is a natural kind—say, hedonic tone or preference satisfaction intensity—then the monster isn't a convention. If one person *actually* feels 100x more pleasure than another, why should we arbitrarily scale them down? You're solving a measurement problem by denying the reality of the thing measured."
  **Your Reply (2 min):** "I'm not denying the intensity is real *for the subject*. I'm denying that the *ratio* between your intensity and mine is fixed by nature. Even if we agree on neural firing rates, we need a rule to say whether 100 firing units in Person A equal 100 in Person B. That rule isn't found in the neurons; it's a moral decision to treat those neurons as equivalent. The monster appears only if we choose the 'raw count' convention over a 'normalized' one."
  **Soft Spot:** **CRITICAL.** If they press on "neural firing is objectively comparable," you risk looking anti-scientific.
  **Flag:** **THE MAKE-OR-BREAK REPLY.** (See above).

  #### 3. The Operationalization Trap
  **Who:** The Methodologist (Social Science Measurement).
  **The Question:** "You propose 'range normalization' (equalizing the distance between worst and best life). But to measure someone's 'best attainable life,' don't you already need to know how much resource they deserve? Isn't this circular? You need the moral conclusion to fix the unit, but you're using the unit to derive the moral conclusion."
  **Your Reply (2 min):** "It is circular if you view it as an empirical measurement. I'm arguing it's a *stipulative* convention. We don't measure the range to find the morality; we choose the range normalization *because* we endorse the morality of equal opportunity for welfare. The 'measurement' is just the implementation of that prior moral commitment."
  **Soft Spot:** **GENUINELY DAMAGING.** This exposes that your "convention" is doing no independent work. It admits the view is just moral intuition in disguise.
  **Flag:** **PAPER VULNERABILITY.** The paper likely does not handle the charge of circularity well. Acknowledge the stipulation openly.

  #### 4. The Expensive Tastes Challenge
  **Who:** Luck Egalitarian #1.
  **The Question:** "If I normalize units based on range or sacrifice, aren't you subsidizing expensive tastes? If someone has a capacity for enormous suffering or enormous joy, your normalization might give them more resources than someone with modest needs. That violates responsibility-sensitivity."
  **Your Reply (2 min):** "Range normalization equalizes *opportunity* for welfare, not welfare itself. If you choose to have expensive tastes, that's a choice within your range. But if your *capacity* is different (you are harder to satisfy), that's brute luck. My view distinguishes between the metric (which handles capacity) and the allocation (which can still penalize choice)."
  **Soft Spot:** The line between "capacity" and "taste" is notoriously blurry.
  **Flag:** **Point to Slide.** Refer to the slide distinguishing *metric fixing* from *allocation rules*.

  #### 5. The Revealed Preference Pushback
  **Who:** Junior Public Finance Economist (Willingness-to-Pay specialist).
  **The Question:** "We use Willingness to Pay (WTP) as a money-metric utility. It reveals the unit through behavior. Why not just use WTP to fix the units? If the monster is willing to pay more, isn't that the unit?"
  **Your Reply (2 min):** "WTP is endogenous to wealth. A rich person has a 'larger unit' in WTP terms simply because they have money. Using WTP to fix interpersonal units just codifies existing inequality as a measurement fact. My normalization is designed to strip out the wealth effect to find the underlying welfare capacity."
  **Soft Spot:** They will argue Kaldor-Hicks compensations already handle this.
  **Flag:** **Standard Econ Objection.** Keep it brief; don't get dragged into CBA technicalities.

  #### 6. The "Is This Prioritarianism?" Check
  **Who:** The Prioritarian.
  **The Question:** "You say anti-monster moves are just scale-fixing. But prioritarianism weights the worse off more heavily. That looks like a substantive moral view, not a unit convention. Are you just redescribing prioritarianism as measurement theory?"
  **Your Reply (2 min):** "Exactly. My claim is that prioritarianism *works* because it implicitly corrects the unit scale. When you give priority to the worse off, you are often correcting for the fact that their utility units were under-counted by a raw summation. I'm making the implicit metric explicit."
  **Soft Spot:** **Duplicate Vocabulary.** This is the philosophical version of Question 1. Ensure your answer aligns with the "Weights" reply.
  **Flag:** **DUPLICATE.** (See Q1).

  #### 7. The "Reverse Monster" (Your Candidate)
  **Who:** Luck Egalitarian #2 (or the Utilitarian circling back).
  **The Question:** "If you normalize by range, what about the person who is unusually *hard* to benefit? The deeply depressed person whose range from 'worst' to 'best' is massive, but requires infinite resources to move. Does your view demand we feed everyone else to the 'Depression Monster' to move them one inch up their scale?"
  **Your Reply (2 min):** "This is the 'Bottomless Pit' objection. Range normalization does have this implication if taken strictly. That's why I distinguish it from 'Unit-of-Sacrifice' normalization. We must choose which normalization aligns with our moral intuitions. If you reject the Depression Monster, you are rejecting Range Normalization, not interpersonal comparison itself."
  **Soft Spot:** This is intuitively unpalatable.
  **Flag:** **CONCEDE IN SETUP.** You should probably acknowledge this limitation in the talk's conclusion to disarm this question. It shows you've thought about the costs.

  #### 8. The Adaptive Preferences Trap (My Nomination)
  **Who:** The Methodologist or Luck Egalitarian.
  **The Question:** "If a slave has adapted preferences, their 'range' is small (they can't imagine freedom). Your range normalization would give them *fewer* resources than the free person with a wide range. You've built oppression into the metric. How is this a moral improvement?"
  **Your Reply (2 min):** "This shows why 'Range' must be defined objectively (capabilities), not subjectively (desires). We normalize based on the range of a *free* agent, not the adapted agent. But this admits we need an objective list to fix the units."
  **Soft Spot:** **WORST QUESTION.** This forces you to abandon welfarism. If you need an objective list to fix the utility units, utility is no longer the sole currency of justice.
  **Flag:** **WORST QUESTION IN THE ROOM.** (See analysis below).

  ---

  ### Analysis of the "Worst Question"

  **Your Candidate:** "People unusually hard to benefit" (The Depression/Reverse Monster case).
  **My Nomination:** "Adaptive Preferences/Deformed Desires" (Question 8).

  **Reasoning:**
  Your candidate is a **bullet-biting** problem. It shows your view has counter-intuitive implications (the Bottomless Pit), but you can argue this is the necessary cost of taking equality seriously. Many prioritarian views accept this cost. It damages the *appeal* of the view, but not its *coherence*.

  The Adaptive Preferences objection is a **structural** problem. If your normalization relies on "range," and oppression shrinks that range, your metric justifies oppression. To fix this, you must appeal to an *objective* standard of "best life" independent of the subject's utility function.
  *   **Why it's worse:** If you admit you need an objective list to fix the units, you have abandoned the welfarist framework your paper is critiquing. You are no longer fixing utilitarianism; you are replacing it with a capabilities approach or objective list theory. This undermines the internal logic of the paper more than the "Depression Monster" does.

  **Verdict on Your Candidate:**
  You are right to be worried about it, but you are braced for the *wrong* thing. The "Hard to Benefit" case is a known issue in prioritarianism and egalitarianism; the audience will expect you to have a stance on it. The "Adaptive Preferences" trap is more insidious because it attacks the *definition of the unit* itself.
  *   **Advice:** If Q8 comes up, do not try to solve it within welfarism. Concede that range normalization requires a "capabilities" constraint. It's better to hybridize the view than to be caught justifying oppression via math.

  ### Strategic Flags Summary

  *   **Duplicate Objections:** Q1 (Economist Weights) and Q6 (Prioritarian Redescription). Give consistent answers: "It makes the moral choice explicit."
  *   **Concede in Setup:** The "Bottomless Pit" (Q7). Mention in your conclusion that Range Normalization has limits to prevent the "Depression Monster." It makes you look nuanced.
  *   **Point at Slide:** Q4 (Expensive Tastes). Use the visual distinction between *Metric Fixing* and *Allocation Rules*.
  *   **Genuinely Damaging:** Q3 (Methodologist/Circularity). The paper likely assumes the normalization is neutral; this question proves it isn't. Acknowledge the normativity strongly.
  *   **Must Land:** Q2 (Utilitarian/Realism). If welfare ratios are natural facts, your paper is false. Hold the line on "Conventionalism."
