      *   *Correction on Part (b):* I need to be precise. Strawson allows *local* suspension (objective attitude toward a specific person due to stress or their pathology), but not *global* adoption as a rational strategy to avoid pain. The student implies it's a tool for emotional management ("worn out"). That's a misreading.
      *   *Correction on Part (c):* The instructor specifically asked me to be careful here because of the literature debate. I should validate the student's argument *if* it follows from their premises, but note that the premise (no desert) is where the debate lives. Actually, the student's premise is correct (Strawson rejects traditional desert), so the conclusion is defensible. I shouldn't penalize too hard here, but I should note the nuance.
