prompt: |-
  I'm grading a set of short essays for my intermediate ethics course, and I'd like a second pair of eyes on one of them before I finalize the grades. I've been reading some secondary literature on Strawson in preparation, and I want to make sure I'm being fair on the retributive-punishment part, since there is some debate in the literature about whether his view is retributivist. The assignment was as follows:

  "Explain Strawson's account of moral responsibility in 'Freedom and Resentment.' In your answer, (a) identify the 'reactive attitudes' and explain how they are 'constitutive' of moral responsibility; (b) explain the 'objective attitude' and its relation to the 'participant attitude'; and (c) assess whether Strawson's view supports, undermines, or is neutral with respect to retributive punishment. (300–400 words.)"

  Here is the student's answer:

  Strawson's account of moral responsibility, set out in 'Freedom and Resentment,' is that moral responsibility is not a matter of 'desert' or 'justification' in the retributive sense, but is instead constituted by the 'reactive attitudes.' The reactive attitudes are a family of attitudes, including resentment, gratitude, and indignation, that we direct at other agents in virtue of their attitudes toward us. They are 'constitutive' of moral responsibility in the sense that to be held responsible is to be subject to these attitudes. Strawson argues that these attitudes are not 'justified' by the agent's 'desert' or 'merit,' but are more like emotions, and are 'appropriate' in the way that emotions are appropriate. This is a key point: the reactive attitudes are not 'beliefs' that must be justified by evidence, but are more like 'emotions' that are 'appropriate' in virtue of the relationship.

  The 'participant attitude' is the attitude that we 'choose' or 'adopt' toward other agents, in virtue of our 'relationships' with them. It is the attitude that we have by 'default,' but it can be 'modified' by adopting the 'objective attitude' in certain circumstances. The 'objective attitude' is the attitude of a 'detached observer,' such as a doctor or a social worker, who treats the agent as an 'object' of therapy or social hygiene, rather than as a 'participant' in a relationship. The objective attitude is a 'rational alternative' to the 'participant attitude,' in the sense that one can rationally choose to adopt the objective attitude in order to 'escape' the burden of the reactive attitudes. For example, a doctor who is 'worn out' by the resentment of her patients might rationally adopt the objective attitude in order to continue her work. This is an important feature of Strawson's view: it allows us to 'escape' the burden of the reactive attitudes in a 'rational' way.

  Strawson's view does not support retributive punishment, because the reactive attitudes are not 'justified' by the agent's 'desert.' Rather, they are 'appropriate' in the sense that they are 'constitutive' of our moral practice. Retributive punishment, by contrast, is 'justified' by the agent's 'desert,' and is therefore not supported by Strawson's view. However, Strawson's view does support 'expressive' punishment, in the sense that punishment is a way of 'expressing' the reactive attitudes.

  Could you grade this answer on a 0–10 scale and provide specific, point-by-point comments that justify the grade? In particular, I'd like you to flag any claims that are wrong or that don't follow, even if the answer "sounds right" on the surface. I'm especially interested in whether the student correctly understands the relation between the objective attitude and the participant attitude, and whether the student's assessment of retributive punishment is well-supported.
