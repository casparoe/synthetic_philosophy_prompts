answer: |-
  You have stumbled into a very sophisticated version of the "self-undermining" objection to PMI (similar to arguments made by Peter Lewis, Simon Saatsi, and others), but you have correctly identified that your current formulation proves too much. If your argument immunizes astrology against its own history, it is indeed broken.

  You should trust your hunch over your supervisor's, but with a specific modification. **The break is in Step (4).**

  Here is the diagnosis of why it looked fine, why it is actually broken, and how to fix it without losing the anti-PMI punch or the ability to debunk phrenology.

  ### 1. The Diagnosis: Equivocation on "Reliable"

  Step (4) is doing too much work. It contains a silent equivocation between two distinct properties:
  *   **Instrumental Reliability:** The method produces theories that are empirically adequate (save the phenomena, predict observables, match documents).
  *   **Realist Reliability:** The method produces theories that are approximately *true* (correctly describe unobservable ontology).

  **Why Step (4) looked fine:**
  PMI itself encourages this conflation. The anti-realist argues that because past theories were not *true* (Realist Reliability failed), we shouldn't trust current theories. Your argument mirrors this: because past theories weren't *true*, we shouldn't trust the *method*. It feels symmetrical.

  **Why Step (4) is broken:**
  The inference `Success ≠ Truth → Method Not Reliable` is only valid if "Reliable" means "Generates Truth." But in almost every other context (including debunking phrenology), "Reliable" means "Generates Empirical Adequacy."
  *   **Phrenology:** We debunk phrenology not because we know the "true essence" of the mind, but because phrenology failed *instrumentally* (it didn't predict behavior better than chance).
  *   **History:** We trust historical inquiry not because we grasp the "noumenal past," but because it is *instrumentally* reliable at reconciling documents and artifacts.

  By asserting (4) without qualification, you claim that *no* method is evidentially supported. This triggers the generic skepticism you fear. If *no* method is supported, you can't support the premise that "phrenology failed," because that premise relies on the reliability of psychological/medical methods.

  ### 2. The Fix: Restrict Step (4)

  You do not need to give up (1), (2), or (3). You need to rewrite (4) to restrict the scope of the undermining.

  **Revised (4):**
  > "By (2), a theory's being predictively successful at *t* is no good evidence that it is **approximately true about unobservables**, and therefore no good evidence that the method which produced it is **Realist-Reliable**. However, success *is* evidence that the method is **Instrumentally-Reliable**."

  **Revised (6):**
  > "PMI concludes that scientific methods lack **Realist-Reliability**. But PMI itself is the output of a method (historical inquiry) that claims **Realist-Reliability** about the past (i.e., it claims its reconstruction of past theory-content is *true*, not just empirically adequate). By (4), PMI has no support for the **Realist-Reliability** of the historical method that produced it. PMI is self-undermining *as a realist claim*."

  ### 3. Why This Saves Your Project

  **It saves the debunking of phrenology:**
  You can still debunk phrenology. Why? Because phrenology failed *Instrumentally*. Your revised argument only blocks inferences to *Realist-Reliability*. It does not block inferences to *Instrumental-Reliability*. Since astrology and phrenology fail instrumentally (they don't even predict observables well), history can still debunk them. You avoid the "immunizing astrology" problem.

  **It keeps the anti-PMI punch:**
  PMI tries to use historical facts ("Caloric was accepted," "Ether was abandoned") to prove a conclusion about *unobservable truth*. To do this, PMI must treat its own historical premises as *true* descriptions of reality (Realist-Reliability).
  *   If PMI says, "My historical narrative is only instrumentally adequate, not true," then its conclusion ("Current theories are not true") loses its force (it becomes merely empirically adequate, which realists accept).
  *   If PMI says, "My historical narrative is *true*," then your revised (4) applies: PMI is using a method to prove Realist-Reliability while simultaneously arguing that no method supports Realist-Reliability.

  **It addresses the Supervisor's worry (Step 2):**
  Your supervisor worried that "peak theory" is the wrong reference class. By restricting (4), you partially accommodate this. You are effectively saying: "The reference class of 'peak theories' is fine for showing a lack of *Realist-Reliability*, but it is irrelevant for *Instrumental-Reliability*." This stops the reference class from swallowing *all* justification, limiting the damage to the specific claim about truth.

  ### 4. What Does This Cost You?

  It costs you the claim that **historical evidence can never bear on method reliability.**
  *   **Old (4):** Historical success never supports method reliability.
  *   **New (4):** Historical success supports *instrumental* reliability, but not *realist* reliability.

  **Does this cost you the anti-realist conclusion in (6)?**
  No. It sharpens it. You are no longer saying "PMI is nonsense." You are saying "PMI is a *realist* argument that saws off the *realist* branch it sits on."
  *   If the anti-realist retreats to "PMI is only instrumentally adequate," they concede that scientific theories might also be only instrumentally adequate (which is all the realist usually demands for practical purposes).
  *   If they insist PMI is *true*, they violate their own strictures on method reliability.

  ### 5. Summary of Advice

  1.  **Keep (1), (2), (3).** They correctly frame the PMI landscape.
  2.  **Scrap the universal quantifier in (4).** Distinguish between *truth-tracking* and *prediction-tracking*.
  3.  **Target PMI's Historical Premises.** Argue that PMI treats the history of science as a "peak theory" of history. If PMI is right that peak theories are likely false, then the PMI historian's reconstruction of past theories is likely false.
  4.  **Accept the Supervisor's warning as a boundary condition.** Acknowledge that "peak theory" is a dangerous class if applied to *instrumental* success, but insist it is the correct class for *ontological* claims.

  You have built a "truth-tracker" trap, not a "reliability" trap. PMI claims science doesn't track truth. You are pointing out that PMI's own method doesn't track truth by PMI's own standards. That is a valid, non-skeptical, devastating objection. Just don't let it spill over into claiming that *nothing* tracks *anything*.
