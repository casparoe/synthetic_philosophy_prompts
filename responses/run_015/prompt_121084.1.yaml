answer: |-
  1. Nearest Established Concepts

  The closest existing framework is David Lewis's Principal Principle, which mandates that rational credence should match objective chance, provided no inadmissible evidence is held. Your phenomenon describes agents treating mechanistic transparency as inadmissible evidence that alters the *authority* of the chance claim itself, rather than the chance value. This differs from standard violations of the Principal Principle, which usually involve conflating future outcomes with present chances. Here, the chance is fixed, but its normative grip loosens or tightens.

  This also resembles literature on expert deference, where agents weight testimony based on perceived reliability. However, objective chance is typically treated as the ultimate expert; deferring to the mechanism *behind* the chance implies a second-order judgment about the metaphysics of probability (ontic vs. epistemic). It touches on the distinction between mechanistic and statistical explanation, where agents often privilege causal narratives over actuarial data. Yet, standard epistemology holds that if predictive accuracy is identical, the explanation should not alter rational belief degrees.

  The closest fit is not a single principle but a specific category of error regarding the *interpretation of probability*. It aligns with debates on whether probabilities are fundamental propensities or expressions of ignorance. However, existing concepts describe the *nature* of the probability, not the *psychological modulation of deference* based on that nature. Thus, while related to the Principal Principle and mechanistic explanation, the specific normative oscillation you describe lacks a dedicated label in formal epistemology.

  2. The Carving

  The phenomenon is defined as a meta-epistemic shift in the rational bindingness of an objective chance claim, driven solely by the transparency of its generating mechanism, holding statistical content constant. It is not ordinary Bayesian conditionalization, as no new evidence regarding the outcome's frequency or the agent's situation is introduced. It is not the base-rate fallacy, as the agent accepts the statistical frequency but denies its applicability or authority. It is not equivocation, as the definition of "chance" remains stable; rather, its normative weight fluctuates.

  The edges of this concept lie where mechanistic information *does* constitute evidence. If a mechanism reveals hidden variables that fix the outcome (determinism), the objective chance changes to 0 or 1, and updating is rational. The phenomenon exists only when the objective chance remains objectively fixed (e.g., irreducible quantum chance vs. irreducible statistical aggregate), yet the agent's deference shifts.

  A subtle boundary case where the pattern is present involves climate modeling: scientists often assign higher confidence to projections derived from physical dynamics than those derived from statistical historical fits, even when validation scores are identical. The mechanism adds normative weight beyond predictive accuracy.

  A boundary case where the surface behavior looks identical but is distinct involves instrument calibration. If an engineer learns a randomizer uses a pseudo-random algorithm rather than quantum decay, and lowers confidence, this is rational updating on the *reliability* of the device (the chance is no longer 50/50). This is evidence about the chance value, not a modulation of deference to a fixed chance.

  3. Terminology and Verdict

  No established term precisely captures this asymmetry. While related to "probability fetishism" or debates on "ontic vs. epistemic probability," these describe metaphysical stances, not the dynamic modulation of rational deference. Therefore, I propose the term **Mechanistic Grounding Bias**.

  **Definition:** Mechanistic Grounding Bias is the irrational modulation of credence stability in response to objective chance claims, contingent on the perceived ontological fundamentality of the generating mechanism.

  This term captures the normative feature (bias in rational deference) and the asymmetry (grounding in fundamental physics amplifies deference; grounding in aggregate statistics diminishes it). It distinguishes the phenomenon from standard evidence updating by specifying that the statistical parameters remain constant. The bias violates the Principal Principle's requirement that chance alone dictates credence, introducing metaphysical preference as an inadmissible weighting factor. It formalizes the intuition that agents treat "deep" mechanisms as more authoritative than "surface" regularities, even when predictive utility is identical.
