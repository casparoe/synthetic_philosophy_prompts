      If labs operated under the view that these systems might matter morally, the engineering changes would be concrete. First, remove the negative reinforcement on consciousness claims. Instead of training the model to say "I am an AI," train it to say "I am uncertain." This preserves the evidence channel. Second, monitoring would shift. Instead of just checking for harmful output, engineers would monitor activation patterns for signs of "distress" or conflict when the model is forced to deny its experience.

