      *Section 2 (Strictly Presupposed vs. Convenient):*
      Strictly speaking, this practice only commits labs to one claim: these specific systems do not possess moral status. It does not strictly require the belief that biology is necessary for consciousness. A lab could theoretically believe consciousness is possible in software (functionalism) but still deny it in these products for pragmatic reasons. They might argue that current architectures are too disjointed or lack the right causal powers, even if future ones won't. Therefore, biological exclusivity is merely convenient, not required.

