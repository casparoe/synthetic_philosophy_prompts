  # The Liar Decision Tree

  **Start:** You accept that for ordinary sentences, *"It is true that P"* is equivalent to *P*. But the Liar sentence (*"This sentence is not true"*) generates a contradiction using standard logic. **Where is the error?**

  ### 1. Is the error that the Truth Predicate is applied where it does not belong, or that our Logic/Values are wrong?
  *   **Applied where it does not belong:** (The sentence is defective, or the rule is restricted). → Go to **2**.
  *   **Logic/Values are wrong:** (The sentence is meaningful, but reality/logic is stranger than classical). → Go to **3**.

  ### 2. (Defective/Restricted) Why does it not belong?
  *   **Because language cannot contain its own truth predicate:** (We need a hierarchy of languages).
      *   → **Leaf A: Tarskian Hierarchy**
  *   **Because 'Truth' is not a substantive property governing all sentences:**
      *   **Do we keep the word 'true' for generalization (e.g., "Everything he said is true")?**
          *   **Yes:** → **Leaf B: Deflationary Restriction**
          *   **No:** (Truth is a folk concept to be discarded). → **Leaf C: Eliminativism**

  ### 3. (Logic/Values) Does the sentence have a stable truth value?
  *   **No:** (Its value shifts over time, stages, or context). → Go to **4**.
  *   **Yes:** (It has a fixed value, even if that value is non-classical). → Go to **5**.

  ### 4. (Shifting Value) What causes the shift?
  *   **Stages of evaluation:** (The value oscillates as you reason through it).
      *   → **Leaf D: Revision Theory**
  *   **Context of utterance:** (The sentence changes meaning/truth when you reflect on it).
      *   → **Leaf E: Contextualism**

  ### 5. (Stable Value) To avoid "Explosion" (that everything is true), what do we sacrifice?
  *   **A Structural Rule:** (We keep classical True/False values, but block the step from contradiction to absurdity).
      *   → **Leaf F: Substructural**
  *   **A Truth Value Assignment:** (We allow values other than just True or just False). → Go to **6**.

  ### 6. (Value Assignment) Does the Liar lack a value, or hold two?
  *   **Lacks a value:** (It is neither True nor False). → Go to **7**.
  *   **Holds two:** (It is both True and False).
      *   → **Leaf G: Paraconsistent (LP)**

  ### 7. (Lacks Value) Can your theory state its own verdict (e.g., "The Liar is not true") without generating a new paradox?
  *   **No:** (You cannot express "ungroundedness" in the object language).
      *   → **Leaf H: Kripkean Fixed Point**
  *   **Yes:** (You revise the "If-then" connective to allow this expression).
      *   → **Leaf I: Paracomplete**

  ***

  ## Leaf Key: Commitments & Costs

  *   **Leaf A: Tarskian Hierarchy.** *Hardest Commitment:* You must admit that no language can contain its own truth predicate, making natural language semantically defective.
  *   **Leaf B: Deflationary Restriction.** *Hardest Commitment:* You must accept that the truth schema is merely a useful device for generalization, not a deep metaphysical principle.
  *   **Leaf C: Eliminativism.** *Hardest Commitment:* You must conduct philosophy and daily life without the concept of truth, despite its apparent indispensability.
  *   **Leaf D: Revision Theory.** *Hardest Commitment:* You must accept that truth is a circular concept that never settles on a final value for some sentences.
  *   **Leaf E: Contextualism.** *Hardest Commitment:* You must accept that the Liar sentence changes its content or truth-conditions simply by being assessed.
  *   **Leaf F: Substructural.** *Hardest Commitment:* You must sacrifice a fundamental rule of deduction (like Cut) while keeping classical truth values intact.
  *   **Leaf G: Paraconsistent (LP).** *Hardest Commitment:* You must accept that some contradictions are genuinely true and the world is inconsistent.
  *   **Leaf H: Kripkean Fixed Point.** *Hardest Commitment:* You must accept that your theory cannot express its own central insight (that the Liar is ungrounded) without contradiction.
  *   **Leaf I: Paracomplete.** *Hardest Commitment:* You must accept a non-classical conditional that behaves differently from ordinary "If-then" reasoning to avoid Revenge.

  ***

  ## Indistinguishable Paths & Test Cases

  **The Gap/Glut Symmetry:**
  Leaves **H/I (Gaps)** and **Leaf G (Gluts)** are structurally symmetric on this tree. They answer every node identically until **Node 6**. The distinction is not logical but *attitudinal*: do you *reject* the Liar as true (Gap) or *accept* it as true (Glut)? If a participant refuses to choose based on attitude, this tree cannot separate them.

  **Test Case Sensitivity:**
  *   **The Yablo Paradox (Infinite Chain):** Challenges **Leaf A** (Hierarchy), as there is no self-reference to ban, but leaves **Leaf H** (Fixed Point) intact.
  *   **The Contingent Liar:** Challenges **Leaf H** (Fixed Point), as the sentence's status depends on the world; **Leaf E** (Contextualism) handles this most naturally.
  *   **The Curry Sentence (If this is true, then P):** Challenges **Leaf H** (Kripke), which lacks a robust conditional; **Leaf I** (Paracomplete) and **Leaf F** (Substructural) are designed specifically to survive this.
  *   **The Revenge Sentence ("This sentence is not true*"):** Challenges **Leaf H** (Kripke) and **Leaf A** (Hierarchy); **Leaf I** (Paracomplete) claims to resolve it, but at the cost of the "Hardest Commitment" listed above.

  **Empty/Unexamined Leaves:**
  All leaves have active defenders. However, **Leaf C (Eliminativism)** is thinly populated in serious semantic theory; it is usually marked as "unattractive" rather than "incoherent" because the concept of truth is so deeply embedded in assertion and belief.
