  (3) and (2) are compatible by definition. Orwellian revision requires altering a *past conscious state*. Stalinesque revision posits no past conscious state exists to be altered; the fabrication occurs pre-consciously. Since (3) bans rewriting instantiated phenomenal properties, and (2) claims properties are instantiated only after construction, no contradiction arises. This distinction dissolves because it relies on the timing of consciousness entry, which your view (4) complicates, but strictly between (2) and (3), the logic holds. The impossibility of Orwellianism does not threaten Stalinesque mechanisms provided consciousness enters only after the narrative is built.

