  2. **High: (1) vs. (2).** (1) claims genuine thickness; (2) claims constructed narrative. If the construction is merely functional, does it yield *genuine* thickness? If yes, (2) is harmless terminology. If no, (1) is false. You want both, risking an illusionist slip where thickness is real phenomenally but fake metaphysically. This undermines the "genuine" claim in (1).
  3. **Moderate: (6) Internal Tension.** Claiming subjective order is "primitive" while boundaries are "neurally fixed" risks a category mistake. If neural dynamics fix the window, order is derived from neural latency, not phenomenologically primitive. You must clarify if "primitive" means irreducible *phenomenally* but caused *neurally*, or metaphysically brute. Otherwise, you reduce phenomenology to neural timing, contradicting the primitivity claim.

