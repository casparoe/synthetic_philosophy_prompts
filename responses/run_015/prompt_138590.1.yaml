  **Setup**

  Start with proposition $P$: "The self survives death." Classically, $P \lor \neg P$ is exhaustive. The tetralemma offers: $P$, $\neg P$, $(P \land \neg P)$, $\neg(P \lor \neg P)$. Nāgārjuna denies all four. To a logician, this is $\bot$ (contradiction). To understand it, treat $P$ not as truth-apt about a stable object, but as a claim about the *ontological status* of the subject. The variables aren't truth values; they are modes of existence. Shift from truth-functional logic to ontological critique.

  **The core move**

  The move is a *reductio ad absurdum* targeting the subject term, not the predicate. Classical logic assumes terms refer to entities with fixed identities (intrinsic natures). If the "self" had such a nature, it would either persist or perish. Nāgārjuna argues that "self" denotes a dependent process, not a fixed entity. Because the subject lacks fixed identity, predicates like "survives" or "perishes" fail to latch. Denying all four isn't claiming reality is illogical; it's claiming your logic presupposes a phantom referent.

  This avoids nihilism because it doesn't deny conventional continuity (cause and effect remain). It avoids contradiction because it denies the *presupposition* required to generate the contradiction. It avoids mysticism because it's a semantic critique: the question is ill-formed, like asking "What color is jealousy?" The fourfold denial exhausts the logical space of *reification*. Once you see the subject is empty, the four options dissolve, not because logic stops, but because the variables are unbound. It cures the habit of treating concepts as things. The problem is the question's assumption that a subject exists to bear the answer.

  **Why four and not two**

  Why not just deny $P$ and $\neg P$? Because metaphysical commitment isn't truth-functional. Denying existence ($P$) often leads opponents to posit non-existence ($\neg P$) as a substantive state. Others posit both (dialectical synthesis) or neither (agnostic evasion). These are distinct *stances*, not just truth values. In classical logic, "both" is contradictory and "neither" violates excluded middle. But here, they represent exhaustive ontological categories people actually inhabit.

  If you only deny $P$ and $\neg P$, a realist retreats to "both" or "neither" to save the entity's status. The four corners map the entire conceptual grid of reification. You must clear the whole board. The form earns its keep because it blocks every escape route for intrinsic existence. It shows that no matter how you configure the ontology of the subject, if you assume it has intrinsic nature, you land in absurdity. It's a exhaustive search of the solution space for "independent entity," returning null.

  **The two-register worry**

  Is this just a disambiguation trick? No. The "two registers" aren't parallel truths (true intrinsically vs. true conventionally). There is only conventional truth; "intrinsic truth" is the error being corrected. The move isn't saying "False in reality, true in language." It's saying "The demand for intrinsic truth is incoherent, so conventional usage is the only mode left."

  If it were a dodge, you could keep the intrinsic claim hidden. But the analysis shows the intrinsic claim is empty. The "courtesy" reading isn't a backup; it's the default state of affairs once the error is removed. Think of it like debugging code: you don't say "The bug is real in production but false in testing." You say "The bug arises from a false assumption about memory management." Once fixed, the program runs conventionally. The tetralemma fixes the ontology so convention can function without contradiction. It validates the mundane by negating the metaphysical.

  Crucially, this isn't swapping one truth for another. It's dissolving the framework that demands "ultimate" truth. If you treat the conventional as a lesser truth, you've reified the ultimate. The point is that dependence *is* the nature of things. There is no second layer. The "two-register" worry assumes there's a fact of the matter being hidden. There isn't. The therapy is realizing the question presupposes a phantom referent. The conventional isn't a consolation prize; it's the only game in town once you stop looking for ghosts.

  **The grocery-list test**

  Does this apply to milk? Ontologically, yes; pragmatically, no. Milk lacks intrinsic nature too. But we rarely reify milk. We don't ask if the *essence* of milk survives pasteurization. We ask if there's milk for coffee. The tetralemma targets *clinging*, not objects. It applies wherever you treat a dependent phenomenon as independent.

  If you ask, "Does the milk exist inherently?" the tetralemma applies. If you ask, "Is there milk?" it doesn't. The difference isn't the object, but the *question's presuppositions*. The traditional questions (self, cosmos) are chosen because they are the primary loci of ontological clinging. The machinery is universal, but the therapy is selective. It's a scalpel for metaphysical tumors, not a ban on grocery shopping. This distinction prevents the theory from becoming absurdly impractical. It preserves daily function.

  **The fifth corner**

  Is the denial itself a position? If "emptiness" is a true essence, you've reified emptiness. This must be avoided. The tool is "self-consuming." Like a ladder kicked away after climbing, the tetralemma dismantles the framework that would treat its own conclusion as a dogma. It is not "self-idling" (running without output); it actively deletes the output buffer. This is "emptiness of emptiness." The denial has no intrinsic nature either. It prevents the cure from becoming a new disease. It ensures the system remains open.

  **What to cut**

  Drop "ineffable experience," "mystical silence," and "paradox." Drop historical sectarian debates. Drop the idea that this proves a specific positive doctrine like "Interdependence." Keep it strictly negative: a critique of ontological commitment. Don't call it "both true and false." Call it "category error." Avoid claiming this leads to peace of mind.
