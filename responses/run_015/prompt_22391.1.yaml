      *   **Resolution:** The reliability of the prediction implies the event is not governed by the chance function in the way PP assumes. Therefore, the evidence is inadmissible (it bypasses the chance).
      *   **Conclusion:** Take the stand. Rationality requires following the specific evidence. The PP is a default norm, not an absolute trump. For the opposing view to hold, chance would need to be metaphysically magical, immune to physical correlation.

