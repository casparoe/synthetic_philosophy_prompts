      *   **Argument against Deference (The Evidentialist View):** Bayesianism requires conditioning on *all* evidence. If the detector is reliable, $Cr(Decay | Detector)$ should be low. Ignoring this for an abstract number is fetishizing chance. The PP is a constraint for when we *lack* specific causal info.
