  2.  **Deconstruct the Philosophical Landscape:**
      *   **Lewis's Principal Principle (PP):** $Cr(A | Ch(A)=x \land E) = x$, where $E$ is admissible evidence.
      *   **The Problem:** What counts as admissible? Lewis suggests evidence about the past and present is admissible; evidence about the future is inadmissible. But what about evidence about *determinants* of the future that aren't themselves the chance function?
      *   **The Specific Scenario:** Known chance = 0.01. Reliable prediction (non-chance based) = No decay.
