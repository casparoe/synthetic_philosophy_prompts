          *   If the chance *is* 0.01 (by definition of the theory in play), can there be a reliable predictor? This touches on the compatibility of objective chance and prediction.
      *   **Arguments for Strong PP:** Chance is the guide to credence. If we ignore chance, we lose the link between metaphysics and epistemology.
      *   **Arguments against Strong PP (in this context):** If you have better evidence (a crystal ball, a hidden variable detector), ignoring it for the sake of an abstract chance value is irrational. Chance is a summary of frequencies/propensities, not a trump card over specific causal data.
      *   **Admissibility:** The crux of the matter. Is the prediction inadmissible? Lewis says future-oriented info is inadmissible. But a detector reading is present-oriented. However, it *entails* something about the future.
      *   **Conclusion Strategy:** I need to take a side.
          *   *Side A:* Deference is required. The prediction must be inadmissible or the chance assignment is wrong.
          *   *Side B:* Deference is not required. Specific evidence trumps general chance facts.
          *   *Decision:* Side B seems more robust for the specific case described (reliable non-chance prediction). If a predictor is *reliable*, it implies the event isn't purely chancy in the relevant sense, or the "chance" value provided is not the complete story. Rationality demands using the best evidence. To defend Side A, one would have to argue that "reliable prediction" is impossible given "objective chance 0.01" (compatibilism vs. incompatibilism about chance and prediction). I will argue that rational credence should track the specific evidence, meaning the PP is constrained by the admissibility clause in a way that makes the prediction admissible, or that the PP is not a foundational norm overriding specific causal knowledge.
