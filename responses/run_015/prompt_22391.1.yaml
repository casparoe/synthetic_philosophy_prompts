answer: |-
  **The Limits of Deference: Objective Chance, Admissibility, and Rational Credence**

  The relationship between objective chance and rational credence is one of the central problems in contemporary epistemology. David Lewis's Principal Principle (PP) offers the most influential framework for understanding this relationship. It posits that a rational agent's credence in a proposition should align with its known objective chance, provided the agent possesses no "inadmissible" evidence. While the principle appears robust in standard cases of gambling or radioactive decay, it faces significant stress tests when an agent possesses specific, reliable evidence that seems to bypass the chance process. Consider an agent who knows the objective chance of a particle decaying is 0.01, yet possesses a reliable, non-chance-based prediction that the particle will not decay. Should this agent defer to the chance of 0.01, or should she trust the prediction? This essay argues that rational credence is not required to defer to objective chance in this specific case. The Principal Principle is best understood not as an absolute substantive norm that trumps specific causal evidence, but as a constraint on Bayesian updating that applies only when evidence is admissible. In the presence of reliable, non-chance-based prediction, the evidence is inadmissible, and rationality demands conditioning on the prediction rather than the chance.

  To understand the stakes, one must first grasp Lewis's defense of the Principal Principle. For Lewis, objective chances are not free-floating metaphysical mysteries; they are functions of the laws of nature and the history of the world up to a given time. Under his Humean supervenience, chances summarize the patterns of events in the world. The PP serves as the bridge between this metaphysical picture and epistemology. It states that $Cr(A | Ch(A)=x \land E) = x$, where $Ch(A)$ is the chance of proposition $A$, and $E$ is any admissible evidence. Lewis's motivation is that chance is the "guide to credence." If we know the physical propensity of a system, our degrees of belief should mirror that propensity. To do otherwise would be to believe that one is lucky or unlucky in a way that contradicts the physical setup of the world.

  However, the PP contains a crucial escape clause: the admissibility condition. Lewis characterizes admissible evidence as evidence whose impact on credence comes entirely via its impact on credence about chances. Standard evidence about the past and present is typically admissible because it informs us about the laws and history that determine the chances. Inadmissible evidence, conversely, is information about the future that bypasses the chances—essentially, "crystal ball" information. The controversy arises when we try to categorize evidence that is about the present (like a detector reading) but entails a conclusion about the future with high reliability.

  In the case described, the agent has two conflicting inputs: a general law-like statement (chance = 0.01) and a specific physical indicator (detector = no decay). Arguments for a strong version of the PP suggest that the agent must defer to the 0.01 chance. The reasoning here is that objective chance represents the fundamental modal structure of reality. If the chance is truly 0.01, then by definition, the outcome is not determined by prior physical states in a way that allows for reliable prediction. Therefore, if a prediction claims reliability, either the prediction is mistaken, or the agent is mistaken about the chance being 0.01. On this view, the detector reading must be treated as admissible evidence that is simply outweighed by the metaphysical weight of the chance function. To ignore the chance is to treat the laws of nature as optional.

  However, this strong defense of the PP falters when confronted with the Bayesian imperative to conditionalize on all available evidence. Bayesian epistemology dictates that an agent should update her credences based on the total evidence available. If the detector is known to be reliable, then the conditional probability of decay given the detector's reading is near zero. To ignore this specific causal information in favor of a general statistical fact is to violate the core tenet of evidentialism. If the PP requires an agent to ignore reliable physical indicators, it transforms from a norm of rationality into a fetishization of abstract numbers. As philosophers like Hall and Hitchcock have suggested, chance is relevant because it usually summarizes the causal tendencies of a system. When we have direct access to those causal tendencies (via the detector), the summary statistic (the chance) becomes redundant.

  The resolution lies in a rigorous application of the admissibility condition. The prompt specifies that the prediction is "non-chance-based." This implies that the prediction does not derive its reliability from the chance function itself but from some other physical correlation (e.g., hidden variables or a specific calibration). If the detector's reading reliably predicts the outcome, it functions exactly like Lewis's "crystal ball." It provides information about the future that is not mediated by the chance value. Therefore, the detector reading is inadmissible evidence. When evidence is inadmissible, the Principal Principle does not trigger. The equation $Cr(A | Ch(A)=x \land E) = x$ only holds when $E$ is admissible. If $E$ is inadmissible, the agent is rationally permitted—and indeed required—to set her credence based on $E$ rather than $x$.

  Consequently, the Principal Principle is best understood not as a foundational substantive norm that dictates credence in all scenarios, but as a constraint on how chance enters Bayesian updating in the absence of inadmissible information. It is a default principle for agents who lack "view from nowhere" access to the future. In normal scientific practice, we defer to chance because we lack hidden-variable detectors. But the normativity of the PP is contingent on the absence of superior evidence. It is a heuristic for cases where the agent's evidence is limited to the laws and history that fix the chances, rather than the specific micro-states that determine the outcome.

  Therefore, in the case described, the agent should **not** set her credence to 0.01. She should set her credence to match the reliability of the prediction (near 1 that the particle will not decay). Deference to objective chance is not rationally required here because the possession of reliable, non-chance-based prediction renders the evidence inadmissible, suspending the Principal Principle.

  For the opposing view to be correct—that the agent must defer to the 0.01 chance despite the reliable prediction—one would have to accept a metaphysically robust and epistemologically costly claim. One would have to argue that objective chance is metaphysically prior to all physical determinants in such a way that no physical state could reliably predict the outcome without *being* the chance function itself. This would require maintaining that the scenario described is actually impossible: if the chance is 0.01, a reliable predictor cannot exist. To hold this view, one must define "objective chance" in a way that makes it incompatible with the existence of hidden variables or reliable detectors that bypass the chance function. This effectively renders the concept of objective chance immune to empirical refinement. It demands that we treat the chance value as a magical barrier that specific physical evidence cannot penetrate. Such a position sacrifices the practical utility of chance for metaphysical purity. It requires us to believe that even if we had a device that predicted decay with 99.9% accuracy, we should ignore it because an abstract formula says the chance is 1%. This is not rationality; it is dogma.

  In conclusion, the Principal Principle is a vital tool for aligning belief with the stochastic structure of the world, but it is not an absolute trump card over specific evidence. Rational credence must track the total evidence available. When an agent possesses reliable, non-chance-based prediction, that evidence is inadmissible in the technical sense required by Lewis, and the obligation to defer to chance dissolves. To insist otherwise is to prioritize a metaphysical definition of chance over the epistemic goal of tracking truth, a move that no coherent Bayesian epistemology should endorse.
