answer: |-
  In a contemporary neurorehabilitation clinic, two patients with comparable dorsolateral prefrontal cortex damage utilize an identical executive-planning algorithm to restore decision-making capacity. Patient A receives the aid via an implanted neural interface that continuously reads interoceptive signals—internal physiological states like heart rate and hormonal levels—and adjusts the algorithm's processing priorities in real-time through interoceptive modulation, defined as the dynamic tuning of computational weights based on bodily feedback, while the algorithm's outputs are directly integrated into the patient's neural global workspace, defined here as the brain's system for broadcasting information to multiple cognitive processes for conscious access and control. Patient B utilizes the exact same software running on an external server, where only the final behavioral recommendation is transmitted to the patient via a standard display, lacking any reciprocal influence of the patient's physiological state on the computation or direct neural integration of the output.

  Regarding moral verdicts, (1) a functionalist who prioritizes computational role fulfillment over physical medium treats the algorithms in both patients similarly, granting them equal derivative standing based on their identical contribution to decision-making outcomes. (2) A biological-embedding theorist denies standing to the remote computation in Patient B but grants hybrid standing to the system in Patient A, viewing the bidirectional biological coupling as creating a new, morally relevant entity. (3) Both theorists agree that the human patient retains full primary moral status regardless of the aid used, as the injury does not diminish personhood.

  The exact structural feature driving this disagreement is reciprocal, real-time modulation versus one-way transmission. If this feature is stripped away, making both cases either fully bidirectional or fully unidirectional, the dispute collapses into a generic substrate-independence argument about whether silicon can ever host moral status, rather than a specific debate about architectural integration. The presence of the feedback loop allows the biological-embedding theorist to claim a unique ontological category for Patient A that is unavailable to Patient B.

  The strongest counterattack directed at the biological-embedding theorist argues that the feedback loop in Patient A is merely causal instrumentation rather than constitutive integration. This objection posits that continuous causal influence does not equate to ontological unity; just as a thermostat causally regulates a furnace without becoming part of the furnace's identity, the implant regulates the brain without becoming part of the patient's moral self. By distinguishing between components that merely influence a system and components that constitute the system, this argument undermines the claim that the loop creates a hybrid entity, forcing the theorist to either deny standing to Patient A's implant or admit that causal coupling alone is insufficient for moral incorporation.
