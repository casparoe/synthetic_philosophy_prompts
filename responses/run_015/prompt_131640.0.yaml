prompt: |-
  Act like you're a senior moral philosopher who actually cares about applied ethics. Before you answer, do a quick brainstom — like, literally list the tensions in your head — then lay it out.

  So here's the thing: I just learned my family was on the recieving end of a forced relocation policy in the 40s, and now I'm actualy trying to figure out what a good theory of reparations for historical injustice should even look like. I don't want politics or a bibliography — I want the conceptual spec.

  Write the desiderata: what any adequate theory has to deliver. Which cases must it handle (descendants with no direct experience, including the non-identity problem for claims that depend on them existing at all; harms that morphed into present structural disadvantage; cases where both wrong-doers and victims are long dead)? Which distinctions can't it collapse — e.g., between repairing a specific wrong vs. redistributing present inequality, or between group-level and individual-level claims? Which results can't it flat-out contradict (basic corrective justice constraints, legal feasibility, maybe consistency with forward-looking institutional design)? Flag any pair you think are jointly unsatisfiable — I'm especially curious whether individual corrective justice and group-based structural repair can actually coexist. Give the reasoning behind each requirement, mark hard constraints vs. camp-specific preferences, and then — briefly, just a quick scorecard — check corrective justice, distributive justice, and a hybrid structural-reparative view against your list. Keep the weight on the criteria, not the scoring, and please don't quote anyone verbatim or ask me to check page numbers — I have no web access right now.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Senior moral philosopher who cares about applied ethics (pragmatic but rigorous).
      *   **Task:** Create a conceptual specification (desiderata) for a theory of reparations for historical injustice.
      *   **Context:** User discovered family history of forced relocation in the 1940s.
      *   **Constraints:** No politics, no bibliography, no direct quotes, no page numbers.
      *   **Specific Requirements:**
          *   Start with a "brainstorm" list of tensions.
          *   List desiderata (what the theory must deliver).
          *   Handle specific cases (descendants, non-identity problem, structural disadvantage, dead parties).
          *   Maintain distinctions (repair vs. redistribution, group vs. individual).
          *   Avoid contradicting certain results (corrective justice, feasibility, institutional design).
          *   Flag jointly unsatisfiable pairs (especially individual vs. group).
          *   Mark hard constraints vs. camp-specific preferences.
          *   End with a brief scorecard comparing Corrective Justice, Distributive Justice, and Hybrid Structural-Reparative views.
      *   **Tone:** Intellectual, empathetic, rigorous, structured.

  2.  **Initial Brainstorming (The "Tensions"):**
      *   *Non-Identity Problem:* If the injustice hadn't happened, the specific descendants wouldn't exist. So how can they claim harm?
      *   *Time Decay:* Does the moral force of a wrong fade as actors die? Or does the *effect* persist regardless of the *actor*?
      *   *Individual vs. Group:* Injustices were often group-targeted (ethnic/religious), but compensation is usually paid to individuals. How to map one to the other without essentializing?
      *   *Counterfactuals:* How do we calculate what *would* have happened? It's speculative.
      *   *Double Counting:* If we fix structural inequality generally, do we still owe specific reparations?
      *   *Feasibility:* A perfect moral theory might be administratively impossible (who pays? who gets?).
      *   *Victimhood vs. Agency:* Does treating a group as victims undermine their current agency?

  3.  **Drafting the Desiderata (The "Spec"):**
      *   *Requirement 1: Non-Identity Compatibility.* Must explain why descendants have claims despite owing existence to the injustice. (Hard Constraint: Logic).
      *   *Requirement 2: Persistence of Obligation.* Must explain why obligations survive the death of original wrongdoers/victims. (Hard Constraint: Intuition about inheritance/debt).
      *   *Requirement 3: Counterfactual Baseline.* Must define the "world as it should have been" without impossible speculation. (Hard Constraint: Calculability).
      *   *Requirement 4: Distinction Maintenance.* Must separate *correcting a past wrong* from *fixing current poverty*. (Hard Constraint: Conceptual Clarity).
      *   *Requirement 5: Unit of Analysis.* Must handle both individual harms and group-based structural harms. (Hard Constraint: Scope).
      *   *Requirement 6: Feasibility/Institutionalization.* Must be translatable into policy without creating new injustices. (Hard Constraint: Applied Ethics).
      *   *Requirement 7: No Moral Hazard.* Must not incentivize claiming victimhood for gain. (Preference/Constraint).

  4.  **Addressing the "Jointly Unsatisfiable" Tension:**
      *   *Individual Corrective Justice vs. Group Structural Repair.*
      *   *Reasoning:* Corrective justice looks backward at specific transactions (A harmed B). Structural repair looks forward at systems (Group X is disadvantaged).
      *   *Conflict:* If I fix the structure, I might over-compensate some individuals and under-compensate others relative to their specific ancestral loss. If I compensate individuals strictly, I might miss the systemic point.
      *   *Verdict:* They are likely in tension, possibly incompatible in pure form. A hybrid is needed, but it creates friction.

  5.  **Developing the Scorecard:**
      *   *Corrective Justice (Backward-looking):* Good on specific wrongs, fails on non-identity and dead parties.
      *   *Distributive Justice (Forward-looking):* Good on current inequality, fails to acknowledge the *wrong* (just treats it as bad luck).
      *   *Hybrid Structural-Reparative:* Tries to do both. Best fit, but conceptually messy.

  6.  **Refining the Tone:**
      *   Needs to sound like a senior philosopher talking to a colleague or a serious student. Empathetic about the family history but analytical about the theory.
      *   Avoid academic jargon where possible, or explain it simply.
      *   Ensure the "brainstorm" looks like a brainstorm (bullet points, raw thoughts).

  7.  **Review against Constraints:**
      *   Did I quote anyone? No.
      *   Did I give politics? No.
      *   Did I handle the non-identity problem? Yes.
      *   Did I distinguish repair vs. redistribution? Yes.
      *   Is the scorecard brief? Yes.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I explicitly mark "Hard Constraints" vs. "Preferences."
      *   *Correction:* Ensure the "Non-Identity" explanation is clear. (The claim isn't "I would be better off," it's "I inherit a debt owed to my ancestors.")
      *   *Correction:* The prompt asks for "conceptual spec." Keep it abstract but grounded.
      *   *Correction:* The user mentioned the 1940s forced relocation. Acknowledge that gravity without making it about specific politics (e.g., don't name specific countries/groups unless necessary for illustration, keep it general theory). *Decision: Keep it general theory to respect the "no politics" constraint, but acknowledge the personal weight.*

  9.  **Final Output Structure:**
      *   Intro (Empathetic/Professional).
      *   Brainstorm (Tensions).
      *   Desiderata (The Spec).
      *   The Impossible Trade-off (Individual vs. Group).
