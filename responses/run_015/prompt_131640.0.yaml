  *(Self-Correction on the Non-Identity Problem)*: I need to be careful here. The standard Parfitian view says no harm is done to the descendant. A reparations theory needs to bypass this, usually by shifting the claim from "harm to me" to "unfulfilled obligation to my ancestors that I inherit." I will write that into the desiderata.

