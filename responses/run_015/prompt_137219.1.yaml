  # Decision Tree: Idealizations of Judgment (HCH)

  **Entry Commitment:** *HCH (or something like it) is a useful idealization of good deliberation.*

  ### Q1: The Repugnant Verdict
  **Case:** Suppose the procedure outputs a verdict you find deeply morally repugnant. Do you conclude the procedure was run incorrectly, or that the procedure does not define correctness?
  *   **Procedure does not define correctness:** → **Leaf 1: Mere Training Target**
      *   *Commitment:* HCH is an engineering benchmark for AI alignment, carrying no claim about human deliberation.
  *   **Procedure was run incorrectly:** → *Go to Q2.*

  ### Q2: The Budget Sensitivity
  **Case:** Consider a complex policy question. If answering each node with a five-minute budget yields "Yes", but a five-month budget yields "No", does the output vary?
  *   **Output is stable (Converges):** → *Go to Q5.*
  *   **Output varies (Diverges):** → *Go to Q3.*

  ### Q3: The Fatal Variance
  **Case:** Given the variance in Q2, is this instability a fatal flaw that breaks the idealization?
  *   **Yes (Fatal):** → **Leaf 2: Degenerate Process**
      *   *Commitment:* HCH is incoherent because amplification has no stable fixed point.
  *   **No (Acceptable):** → *Go to Q4.*

  ### Q4: The Hidden Fact
  **Case:** If we accept the variance, is there still a unique "true" HCH answer that we simply cannot compute, or is there no fact of the matter?
  *   **Unique truth exists (Uncomputable):** → **Leaf 3: Run-Indifferent Benchmarking**
      *   *Commitment:* Any single run is an acceptable draw from the space of good answers; we may simply pick a run and act on it. *(Diagnosis: Coherent but abandons determinacy; treats idealization as a stochastic oracle rather than a truth-tracker.)*
  *   **No fact of the matter:** → **Leaf 4: No-Fact-of-the-Matter Proceduralism**
      *   *Commitment:* The procedure constitutes the truth; there is no answer independent of the specific path taken.

  ### Q5: The Prejudice Correction
  **Case:** A person holds a biased snap judgment. The decomposed process eliminates the bias. Did the process uncover what they *really* thought, or did it correct a mistake they made?
  *   **Corrected a mistake (Constitution):** → **Leaf 5: Constitutive Ideal**
      *   *Commitment:* Amplification constructs better judgment rather than revealing latent content.
  *   **Uncovered latent content (Elicitation):** → *Go to Q6.*

  ### Q6: The Final Sort (Agency, Ends, & Seed)
  **Case:** If the content is latent, whose mind is idealized and what are its constraints? (Select the best fit)
  *   **Plural Subject (Distributed Labor):** → **Leaf 6: Distributed Cognitive Labor**
      *   *Commitment:* HCH models a division of cognitive labor rather than deliberation proper.
  *   **Single Subject + Fluid Ends:** → **Leaf 7: Reflective Equilibrium**
      *   *Commitment:* The tree whose amplified output is that the asker should want different ends than the ones written into the root question.
  *   **Single Subject + Fixed Ends + Trustworthy Seed:** → **Leaf 8: Ideal Advisor**
      *   *Commitment:* HCH serves as an ideal interpreter in the manner of reflective-equilibrium accounts (assuming sound seeds).
  *   **Single Subject + Fixed Ends + Flawed Seed:** → **Leaf 9: Amplification of Errors**
      *   *Commitment:* HCH merely codifies and scales the seed human's errors rather than correcting them.

  ***

  ### Structural Notes & Indistinguishabilities

  *   **Empty/Unexplored Cells:** The combination of *Distributed Labor* + *Constitutive Ideal* is largely unexplored; most distributed accounts assume elicitation of collective intelligence rather than constitution of group judgment.
  *   **Indistinguishable Leaves:**
      *   **Run-Indifferent Benchmarking vs. No-Fact-of-the-Matter:** Practically indistinguishable in application (both accept variance); separated only by the metaphysical claim about whether a unique truth exists.
      *   **Ideal Advisor vs. Amplification of Errors:** Structurally identical; separated only by the empirical claim about the seed human's trustworthiness.
  *   **Logical Space:** The tree prioritizes *Normative Status* → *Determinacy* → *Mechanism* → *Agency*. Positions that claim HCH is both *Degenerate* and an *Ideal Advisor* are marked incoherent.
