      *   **Constraint:** Don't just list papers. Give an honest diagnosis. Explain *why* progress is or isn't expected.

  2.  **Deconstruct the Philosophical/Biological Debate:**
      *   **The Two Camps:**
          *   *Etiological (Selected Effects):* Function is what the trait was selected *for* in the past. (Millikan, Neander, Cummins' critique). Heart pumps blood because ancestors who pumped blood survived.
          *   *Causal Role (Systemic):* Function is what the trait *does* in the current system. (Cummins). Heart pumps blood, makes sound, vibrates chest. Which is the function? The one relevant to the containing system's capacity.
      *   **The Stalemate:** Why hasn't it been solved?
          *   *Normativity:* Etiological accounts handle malfunction better (a heart that doesn't pump is broken, even if it does nothing). Causal role struggles with "error."
          *   *Epistemology:* We often don't know the evolutionary history. Causal role is easier to observe.
          *   *Explanatory Power:* Evolutionary bio needs history; Physiology needs mechanics.
      *   **User's Insight:** The "narrative" angle is actually quite sharp. It touches on *explanatory goals*.

  3.  **Evaluate the User's Theory (Narrative vs. Snapshot):**
      *   It's a strong metaphorical framing, but philosophically, it's deeper than just "aesthetic preference." It's about *teleology* (purpose) vs. *mechanism* (cause).
      *   Is it *just* verbal? No, because it affects how research is funded and conducted. If function = history, you study phylogenetics. If function = role, you study physiology.
      *   Is one side unarguable? No. Both have fatal flaws if applied universally.

  4.  **Diagnose the Stall (Why no winner?):**
      *   **Pluralism:** The leading contemporary view is that "function" is context-dependent. Biologists use different definitions for different jobs.
      *   **The "Normativity" Problem:** This is the real sticking point. Only the historical view explains why a defective heart is still a heart with a function it's failing to do. Causal role says if it doesn't do it, it's not its function (or it has a different function).
      *   **The "Epistemic Access" Problem:** We can't always know the history.
      *   **The "Spandrel" Problem:** Some things exist but weren't selected for (byproducts). Historical view says they have no function. Causal role says they might acquire one.

  5.  **Determine What Would Move the Needle:**
      *   Since it's a conceptual/philosophical issue grounded in scientific practice, an *experiment* won't solve it.
      *   What *would* solve it? A unified theory of biological explanation that dissolves the distinction, or a pragmatic consensus that admits pluralism.
      *   Actually, the field *has* moved toward "Pragmatic Pluralism." The needle *has* moved, just not to a single winner.
      *   For the novel: The conflict shouldn't be about who is *right*, but about what *work* they are trying to do.

  6.  **Drafting the Response (Iterative Process):**

      *   *Acknowledge the User's Insight:* Validate the "narrative vs. snapshot" idea. It's good literary intuition that matches philosophical reality.
      *   *Diagnose the Debate:* It's not broken, it's *polysemous* (one word, multiple meanings). It's not purely verbal because it has real consequences for research.
      *   *The Core Tension:* Normativity (History) vs. Discoverability (Causal).
          *   History explains *failure* (a broken heart).
          *   Causal explains *operation* (how the heart works now).
      *   *Why the Stall?* Because biology needs *both*. You can't do evolutionary biology without history. You can't do surgery without causal mechanics.
      *   *The "Needle":* The needle moved to **Pragmatic Pluralism**. The debate isn't "which is true?" but "which is useful for this specific question?"
      *   *Advice for the Novel:* Don't make one sister right. Make them fighting over *goals*. One wants to know *why* we are here (history), the other wants to know *how* to fix the patient (mechanics).
      *   *Refining the "Narrative" point:* It's not just aesthetic. It's about whether biology is a historical science (like geology) or a functional science (like engineering).

  7.  **Final Polish (Checking against constraints):**
