answer: |-
  This is a fantastic premise. You have correctly identified one of the most persistent itch-scratches in the philosophy of biology. Your intuition about "narrative vs. snapshot" is sharp, but the reason the debate is stalled is slightly more technical than aesthetics. It's about **normativity**.

  Here is the honest diagnosis of the stalemate, why it persists, and how you can weaponize it for your characters.

  ### 1. The Diagnosis: They Are Solving Different Problems
  You asked if they are answering different questions under one word. **Yes.**

  *   **The Evolutionary (Etiological) Sister:** She is asking, *"Why is this trait here rather than absent?"* She needs a definition of function that explains **existence**. For her, function is a historical fact. The heart pumps blood because ancestors who pumped blood survived.
  *   **The Physiological (Causal Role) Sister:** She is asking, *"How does this system maintain itself right now?"* She needs a definition of function that explains **operation**. For her, function is a causal contribution. The heart pumps blood, makes a 'lub-dub' sound, and vibrates the chest wall. All are causal roles; which one is the "function" depends on what larger system capacity you are analyzing.

  The debate feels stuck because both are right about their specific domain, but wrong when they claim universality.

  ### 2. The Real Sticking Point: The "Broken Heart" Test
  You suspected one side might have an unarguable intuition. The Evolutionary side has the strongest trump card, and it's the main reason the debate hasn't died. It's called **Normativity**.

  *   **Scenario:** A heart is born with a defect. It cannot pump blood. It only vibrates the chest.
  *   **Causal Role Sister:** "Well, its causal role is vibrating the chest. Therefore, its function is vibrating the chest." (This feels wrong. The heart is *broken*, not repurposed).
  *   **Evolutionary Sister:** "Its function is still pumping blood, because that is what it was selected for. It is currently failing at its function." (This captures our intuition that the organ is *malfunctioning*).

  The Historical view is the only one that easily explains **error**. It allows you to say an organ is doing the *wrong* thing. The Causal view struggles to distinguish between "doing a job badly" and "doing a different job."

  **However,** the Causal Role sister has a trump card too: **Epistemic Access.**
  *   **Scenario:** We find a new organ in a deep-sea fish. We have zero fossil record. We don't know its evolutionary history.
  *   **Evolutionary Sister:** "We cannot assign it a function until we reconstruct its phylogenetic history." (This halts research).
  *   **Causal Role Sister:** "It circulates fluid. That is its function. Let's study how." (This enables research).

  ### 3. Is the Debate Broken or Verbal?
  It is **pragmatically verbal**.

  It's not "broken" in the sense that the logic is flawed; it's stalled because biologists have implicitly agreed to **pluralism** without admitting it. In practice, a biologist acts like a Causal Role functionalist when they are in the lab (fixing the machine) and an Etiological functionalist when they are writing the grant proposal (explaining why the machine matters evolutionarily).

  The needle is stuck for good because **biology is both a historical science and a mechanical science.**
  *   If you treat biology purely as mechanics (Causal), you lose the ability to explain adaptation and design.
  *   If you treat biology purely as history (Etiological), you lose the ability to diagnose disease or engineer solutions.

  ### 4. What Would Move the Needle? (And Why It Won't)
  To break the stalemate, you would need to decouple the word "function" into two distinct technical terms. In fact, philosophers have tried this (e.g., distinguishing "proper function" from "systemic role").

  **Why it hasn't worked:** Language is sticky. Biologists like the word "function" because it bridges the gap between *what something is* and *what it does*. Splitting the terminology feels like pedantry to working scientists.

  **The only thing that moves the needle:** A shift in **explanatory context**.
  Progress happens when a researcher explicitly states: *"I am using the historical definition because I am studying adaptation,"* or *"I am using the causal definition because I am studying pathology."* The conflict arises when they pretend their definition is the *only* true one.

  ### 5. Advice for Your Novel
  Your theory about "narrative vs. snapshot" is actually the perfect way to dramatize this. It's not just aesthetic; it's about **time**.

  *   **The Evolutionary Sister (The Historian):** She believes you cannot understand the present without the past. She is likely obsessed with origins, lineage, and "why we are here." She might view her sister as shallow, ignoring the deep story of survival written in the flesh. To her, a heart that doesn't pump is a tragedy, a broken promise from the ancestors.
  *   **The Physiological Sister (The Mechanic):** She believes the past is dead data. Only the current mechanics matter. She is likely a pragmatist, maybe a clinician or engineer. She views her sister as obsessed with ghosts. To her, a heart that vibrates the chest *is* vibrating the chest; if we can use that vibration to diagnose something, that is its utility *now*.

  **The Conflict:**
  Don't have them fight about who is *right*. Have them fight about **what biology is for.**
  *   Is biology about telling the story of life? (Evolutionary)
  *   Is biology about fixing the machine of life? (Physiological)

  **The "Aha" Moment:**
  The most realistic resolution for a novel isn't one sister converting the other. It's the realization that they need each other to handle **malfunction**.
  *   When the patient is on the table, the Mechanic is right (fix the flow).
  *   When the patient asks "Why did my body fail me?", the Historian is right (it was a design compromise from 200 million years ago).

  ### Summary for your notes:
  1.  **Is it broken?** No, it's **pluralistic**. The word serves two masters.
  2.  **Is one side unarguable?** The Historical side wins on **malfunction** (normativity). The Causal side wins on **discovery** (epistemology).
  3.  **Why the stall?** Because biologists refuse to admit they switch definitions depending on whether they are teaching, researching, or doctoring.
  4.  **Narrative Hook:** Frame it as **Teleology (Purpose/History)** vs. **Mechanism (Cause/Present)**. One sister writes biographies of organs; the other writes technical manuals.

  The debate won't end because biology itself is a hybrid of history and physics. Your characters are fighting over the soul of the discipline.
