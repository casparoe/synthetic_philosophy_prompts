answer: |-
  # Specification of Adequacy: Diachronic Rationality for Auditable, Revisable Agents

  ## 1. Unit of Evaluation
  **The Conditional Policy.**
  The theory must evaluate the agent as an instantiator of a **Conditional Policy**: a mapping from *(Observable History, Current Objective State)* to *Action*.

  *   **Case:** An auditor cannot see internal states or unoffered menus. They see a log of states, offers, and actions. An "act at a node" is too granular (misses the plan); a "whole sequence" is too rigid (forbids revision); a "disposition" is too internal (unauditable).
  *   **Requirement:** The unit must be codifiable (the agent can run it) and traceable (the auditor can verify the action followed the policy given the history).
  *   **Status:** **Non-negotiable.** Without a fixed unit that bridges internal instantiation and external observation, auditability is impossible.

  ---

  ## 2. Desiderata List

  ### D1. No Actual Loss Cycles (NALC)
  *   **Case:** *The Stepwise Pump.* The agent accepts a sequence of trades $A \to B \to C \to A$, paying a fee at each step, ending with less resource than it started.
  *   **Requirement:** The record of actual choices must not exhibit a cycle where the final state is strictly dominated by the initial state according to the *final* objective function, net of fees.
  *   **Status:** **Non-negotiable.** If the agent loses resources for no gain, it has failed its operational mandate, regardless of local justification.
  *   **Note:** This distinguishes *being pumped* (actual loss) from *pumpability* (vulnerability).

  ### D2. Trade Viability (TV)
  *   **Case:** *The Near-Indifference Pump.* An agent that refuses all trades near indifference avoids pumps but misses gains. An agent that accepts all is bled.
  *   **Requirement:** The policy must permit trades where the expected utility gain exceeds a threshold $\epsilon > 0$, without requiring infinite precision. Small noise in presentation or valuation must not flip the decision from "accept" to "reject" in a way that creates a loss cycle.
  *   **Status:** **Non-negotiable.** A system that cannot trade is useless; a system that is knife-edge fragile is unsafe.
  *   **Note:** This rules out theories requiring strict transitivity without hysteresis or indifference zones.

  ### D3. Legitimate Revision Coherence (LRC)
  *   **Case:** *Correction versus Drift.* Operators revise the objective at $t_2$. The $t_1$ self foresaw this.
  *   **Requirement:** The theory must distinguish between *Drift* (unauthorized deviation from prior intent) and *Correction* (authorized update of intent). A policy is coherent if it maximizes the *current* objective function, subject to constraints imposed by *prior* commitments that were valid under *prior* objectives, unless explicitly revoked.
  *   **Status:** **Non-negotiable.** Given the system premise (objectives may be revised), a theory that enforces static consistency is inapplicable.
  *   **Note:** This requires the audit log to include "Objective Update Events" signed by operators.

  ### D4. Commitment Value Recognition (CVR)
  *   **Case:** *Paying to Bind.* The agent pays a cost to remove a future option (e.g., Ulysses contract).
  *   **Requirement:** The theory must classify paying to restrict future choice as rational if the restriction prevents a predicted violation of D1 (No Actual Loss Cycles) under the current objective. It must not treat the cost of the commitment device as a loss in itself.
  *   **Status:** **Non-negotiable.** Planning systems require the ability to bind; treating binding costs as exploitation forbids planning.

  ### D5. Counterfactual Robustness (CR)
  *   **Case:** *Pumpability versus Being Pumped.* Structures exist where a pump is possible but costly for the exploiter, or requires impossible prediction.
  *   **Requirement:** The agent should be designed to minimize vulnerability to *feasible* pumps (those profitable for an adversary in the actual environment), not *logical* pumps (those possible in abstract state space).
  *   **Status:** **Preference (Security Camp).** A pure rationality camp might demand immunity to all logical pumps. A security/engineering camp demands immunity only to economically feasible attacks. This spec adopts the latter for feasibility.

  ### D6. Dispositional Safety (DS)
  *   **Case:** *Dispositions that Manufacture Pumps.* Being predictable (keeping agreements) makes the agent targetable.
  *   **Requirement:** If a disposition (e.g., "Always Keep Promises") leads to D1 violations in the actual environment, the disposition is faulty. If it leads to D1 violations only in counterfactual hostile environments that do not exist, it is acceptable.
  *   **Status:** **Preference (Rationality Camp).** Some theories hold that rationality is about internal consistency of dispositions regardless of environment. This spec requires environmental sensitivity.

  ### D7. Noise Stability (NS)
  *   **Case:** *The Noise Pump.* Randomized order or presentation jitter causes a stable agent to cycle.
  *   **Requirement:** The policy must be invariant to permutations of independent offers and minor perturbations in value representation that do not cross the $\epsilon$ threshold (from D2).
  *   **Status:** **Non-negotiable.** Real-world data is noisy; a rationality theory that fails under jitter is brittle.

  ### D8. Auditability of Norms (AN)
  *   **Case:** *Auditability.* Exploitability is defined over unoffered menus. The auditor sees only offered menus.
  *   **Requirement:** The verdict of "Rational/Irrational" must be derivable from the log of *(State, Offer, Action, Objective Version)*. If a norm relies on unoffered menus, it is a **Design Norm** (for builders), not an **Audit Norm** (for regulators).
  *   **Status:** **Non-negotiable.** Given the prompt's constraint on the auditor's view.

  ### D9. Regress Termination (RT)
  *   **Case:** *The Reconsideration Regress.* If the agent can reopen plans, when does it stop?
  *   **Requirement:** The policy must specify a computable stopping condition for reconsideration (e.g., "Reevaluate only on Objective Update Event" or "Only if expected gain > cost of computation").
  *   **Status:** **Non-negotiable.** Infinite deliberation is a failure mode (halting problem).

  ---

  ## 3. Joint Unsatisfiability and Trade-offs

  The following sets of desiderata are jointly unsatisfiable. You must drop one in each cluster.

  ### Conflict Cluster 1: The Rationality Triangle
  **Set:** {Local Optimality at Every Node, No Actual Loss Cycles (D1), Legitimate Revision (D3)}
  *   **Impossibility:** If preferences change legitimately (D3), the action that was locally optimal at $t_1$ may not contribute to global optimality at $t_2$. If you enforce Local Optimality, you forbid binding against future selves (violating D1 via pumps). If you enforce No Loss Cycles, you must sometimes take locally sub-optimal actions at $t_1$ to satisfy $t_2$ (violating Local Optimality).
  *   **Recommendation:** **Drop Local Optimality.**
  *   **Consequence:** The theory can no longer claim that the agent is "doing the best it can" at every moment. It must claim the agent is "doing the best for the trajectory." This excludes Time-Slice views.

  ### Conflict Cluster 2: The Auditability Paradox
  **Set:** {Counterfactual Robustness (D5), Auditability of Norms (D8)}
  *   **Impossibility:** Exploitability is a property of the *menu structure* (what *could* have been offered). The auditor sees only the *actual* path. You cannot audit a counterfactual. If you demand the auditor verify "No Pumps," they cannot do it.
  *   **Recommendation:** **Drop Counterfactual Robustness as an Audit Norm.**
  *   **Consequence:** Auditability is limited to "No Actual Loss Cycles." The system may be pumpable (vulnerable) but pass audit if no one pumped it. The burden shifts to the **Design Norm**: builders must prove robustness via simulation/testing, but the auditor can only check history. This excludes theories that define rationality solely by immunity to unoffered choices.

  ### Conflict Cluster 3: The Revision Tension
  **Set:** {Resolute Choice (Follow $t_1$ plan), Legitimate Revision (D3)}
  *   **Impossibility:** Resolute choice dictates following the $t_1$ plan even if $t_2$ preferences differ. Legitimate Revision dictates updating to $t_2$ preferences.
  *   **Recommendation:** **Drop Resolute Choice.**
  *   **Consequence:** The agent cannot simply "bind and ignore." It must incorporate a mechanism for updating plans. This excludes pure McClennen-style Resolute Choice.

  ---

  ## 4. Workhorse Requirement and Prejudices

  ### The Workhorse Requirement
  **Legitimate Revision Coherence (D3).**
  This requirement does the most work in excluding standard families of view.
  *   It excludes **Standard Dynamic Consistency** (which assumes fixed preferences).
  *   It excludes **Naive Myopia** (which ignores prior commitments).
  *   It forces the theory to handle *identity over time* not as a constant utility function, but as a chain of authorized handoffs.

  ### Flagged Prejudices
  1.  **Preference Consistency as Rationality:** The demand that preferences *must* be transitive and static is a prejudice of classical economics. In this spec, **Process Coherence** (following the revision protocol) matters more than **State Consistency**.
  2.  **Rationality as Property of Preferences:** The demand that rationality resides in the preference ordering rather than the **Policy** is a prejudice of decision theory. In an auditable system, rationality is a property of the *input-output mapping* (Policy), not the internal utility function.

  ---

  ## 5. Scorecard of Existing Views

  | View | Verdict against Spec | Reason |
  | :--- | :--- | :--- |
  | **Sophisticated Choice** | **Fail** | Anticipates preference change as a threat to be constrained; fails Legitimate Revision (D3) by treating future selves as adversaries rather than successors. |
  | **Resolute Choice** | **Fail** | Adheres to $t_1$ plan despite $t_2$ revision; violates Legitimate Revision (D3) and creates audit trails that look like drift. |
  | **Time-Slice (Myopic)** | **Fail** | Maximizes local utility; vulnerable to Stepwise Pumps (violates D1) and cannot value Commitment (violates D4). |
  | **Preferences over Plans** | **Partial** | Good for Auditability (D8), but struggles to encode Legitimate Revision (D3) without becoming a hierarchy of selves. |
  | **Bargaining Across Selves** | **Fail** | Requires internal state visibility (negotiation logs) to audit; violates Auditability (D8). |
  | **Conditional Policy (Proposed)** | **Pass** | Instantiatable, auditable, allows revision via state-updates, handles commitment via constraint rules. |

  ---

  ## 6. Summary of Deliverables for the Theory

  To satisfy this specification, your theory of diachronic rationality must provide:

  1.  **A Policy Language:** Syntax for defining actions contingent on history and objective version.
  2.  **A Revision Protocol:** Formal rules for when an Objective Update Event invalidates prior plan constraints.
  3.  **A Loss Definition:** A metric for calculating "Actual Loss" over a cycle that accounts for fees and objective drift.
  4.  **A Stability Proof:** Demonstration that the policy does not cycle under noise (D2, D7).
  5.  **An Audit Function:** An algorithm that takes the Log and outputs Pass/Fail based *only* on actual offers and choices (D8).

  If your theory cannot produce the Audit Function, it is a **Design Theory**, not an **Audit Theory**, and you must label it as such.
