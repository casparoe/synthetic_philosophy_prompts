prompt: |-
  I am drafting the normative specification for a long-lived planning system: an artificial agent that acts over an extended horizon, whose objective function may legitimately be revised by its operators mid-run, that shares its environment with other agents who can observe its dispositions and offer it trades, and whose behaviour has to be auditable after the fact by a party who sees only the record of offers made and choices taken — not the agent's internal states, and not the menus that were never presented.

  What I need from you first is not a theory but a specification of adequacy for one: the list of things a theory of diachronic rationality would have to deliver in order to serve as that core. Write the desiderata, with the case or consideration behind each, and say which are non-negotiable given the purpose and which are preferences of a particular camp that I am free to reject.

  Begin by fixing the unit of evaluation. A theory in this area may be a theory of acts at nodes, of plans, of policies, of whole sequences of choice, or of dispositions to accept menus; it should be a requirement that the theory state which of these it is a theory of, and that the unit be one the agent can actually instantiate and an auditor can identify.

  At minimum the list should say something about the following cases, and I suspect each of them forces a distinction the list will collapse by default:

  The stepwise pump. At every node the trade on offer is beneficial by the agent's own lights at that node; the sequence returns it to its starting point minus a fee. Which norm has failed — the local one or the global one — and must the theory be able to say both that the agent did nothing wrong at any node and that it has been exploited?

  Pumpability versus being pumped. There are structures that admit an exploiting sequence no one would ever run, because running it costs the exploiter more than it gains, and structures no one can run because exploiting them requires perfect prediction of the agent. Is the requirement the absence of pumps, or the absence of profitable and feasible ones?

  The near-indifference pump. An agent willing to trade when nearly indifferent can be bled by arbitrarily small fees; an agent that never trades near indifference forgoes the gains from trade entirely. The requirement must not be satisfiable only by total abstention from trade, and must not be knife-edge in a way that a little noise turns into a violation.

  Correction versus drift. The operators revise the objective at t2, and the t1 self foresees this. Deferring to a later self that will know more looks like rationality; deferring to a later self that merely wants something different looks like being exploited by your own future. The theory must say when anticipatory deference to a future self is rational and when it is weakness of will at one remove, and it must not answer by simply letting the later self win or by simply letting the earlier one bind.

  Paying to bind. The agent pays to delete its own future options, by removing a menu or buying a commitment device. Is this self-exploitation, prudence, or both? The theory has to classify it, and must not treat every removal of an option as a cost incurred.

  Dispositions that manufacture pumps. Keeping plans, keeping agreements, and being predictable are plausibly things such a system ought to be; each of them makes it pumpable by an adversary who elicits the reliable response and then trades against it. If the exploitability criterion convicts these, is that a finding about the dispositions or a reductio of the criterion?

  The noise pump. An agent with stable, transitive, menu-independent preferences, shown the same small set of trades in randomized order with minor presentation jitter, pays to end where it began. If the criterion convicts this agent, the criterion is too strong; say precisely what restriction repairs it.

  Auditability. Exploitability is a property of a counterfactual structure defined over menus that were never offered. Say whether the norm is checkable from a record of actual offers and choices, and what I should do if the best account of the defect turns out to be unauditable in principle.

  The reconsideration regress. If the norm is adopt a plan and follow it, when may the agent reopen the plan, and why does permitting reopening under specified conditions not simply reproduce the original problem one level up?

  Then the part I most want. Mark which desiderata are jointly unsatisfiable — I expect at least that local optimality at every node, the prohibition on self-defeating sequences, and permission for rational preference change cannot all be held, and that a purely structural criterion of exploitability cannot be reconciled with third-party auditability — and show me, for each conflict, which desideratum you would drop and what the resulting theory can no longer do. Tell me which single requirement does the most work in excluding the standard families of view, and flag any requirement that is really a prejudice of one family rather than a desideratum: the demand that consistency matter rather than getting what you wanted, for instance, or the demand that rationality be a property of preferences rather than of policies.

  A short scorecard at the end — sophisticated planning, resolute choice, moment-by-moment or time-slice views, preferences over plans, and any bargaining-across-selves picture, one or two lines each against the list — is welcome, but keep the weight on the criteria and on the cases that motivate them; the criteria are the deliverable, and I will do the scoring myself if they turn out to be the hard part.
reasoning: |-
  Here's a thinking process that leads to the suggested specification of adequacy:

  1.  **Deconstruct the Request:**

      *   **Task:** Draft a *specification of adequacy* for a theory of diachronic rationality (not the theory itself).
      *   **Context:** Long-lived planning system (AI agent), extended horizon, objective revision allowed mid-run, multi-agent environment (trades/observations), post-hoc auditability (external record only, no internal states/unoffered menus).
      *   **Key Deliverables:**
          1.  Fix the unit of evaluation.
          2.  List desiderata with cases/considerations.
          3.  Distinguish non-negotiable vs. preference/camp-specific.
          4.  Address specific cases: Stepwise pump, Pumpability vs. Being Pumped, Near-indifference pump, Correction vs. Drift, Paying to bind, Dispositions that manufacture pumps, Noise pump, Auditability, Reconsideration regress.
          5.  Identify joint unsatisfiability (impossibility results) and trade-offs.
          6.  Identify the "workhorse" requirement and flag prejudices.
          7.  Short scorecard of existing views (Sophisticated, Resolute, Time-slice, etc.).
      *   **Tone:** Rigorous, normative, philosophical but engineering-oriented (specification style), critical.

  2.  **Initial Brainstorming & Framing:**

      *   *The Core Tension:* The prompt highlights the classic tension in diachronic choice (Ainslie, McClennen, Bratman, etc.) but adds an *auditability* constraint and an *objective revision* constraint. This moves it from pure philosophy of action to AI safety/governance.
      *   *Unit of Evaluation:* The prompt asks to fix this. Given auditability (record of offers/choices) and the need to handle plans/dispositions, "Policy" (mapping from histories/states to actions) or "Disposition" seems best. "Acts at nodes" is too local (fails pumps). "Whole sequences" is too global (fails revision). Let's propose **Policy with Dispositionality** as the unit. It must be instantiatable and auditable.
      *   *Auditability:* This is the hardest constraint. Exploitability usually requires knowing counterfactuals (menus not offered). If the auditor only sees *actual* offers and choices, they can't prove a pump *could* have happened, only that one *did*. This suggests a tension between "Dynamic Consistency" (internal) and "Auditability" (external).
      *   *Objective Revision:* This breaks standard Dynamic Consistency. If preferences change legitimately, violating DC isn't irrational. The theory needs to distinguish *drift* (bad) from *correction* (good).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Unit:* Needs to be a **Conditional Policy** (action rules contingent on history/state). Why? Because auditors see history + action. Agents instantiate rules.
      *   *Desideratum 1: No Actual Money Pumps (NAMP).* Non-negotiable. If the log shows A->B->C->A minus fee, that's a failure.
      *   *Desideratum 2: Counterfactual Robustness.* (The "Pumpability" case). We can't demand immunity to *all* possible pumps (unauditable). We need immunity to *feasible* pumps in the actual environment. *Status:* Preference (depends on threat model).
      *   *Desideratum 3: Trade Viability.* (The "Near-indifference" case). Can't just say "never trade." Must allow trade without knife-edge fragility. *Status:* Non-negotiable for utility.
      *   *Desideratum 4: Legitimate Revision.* (The "Correction vs. Drift" case). Must distinguish operator update from corruption. *Status:* Non-negotiable given the prompt's premise.
      *   *Desideratum 5: Commitment Value.* (The "Paying to Bind" case). Must allow paying for commitment without calling it exploitation. *Status:* Non-negotiable for planning.
      *   *Desideratum 6: Dispositional Transparency.* (The "Dispositions" case). If being predictable makes you pumpable, is that the disposition's fault? *Status:* Preference (Security vs. Rationality).
      *   *Desideratum 7: Noise Stability.* (The "Noise Pump" case). Small jitter shouldn't trigger exploitation flags. *Status:* Non-negotiable for robustness.
      *   *Desideratum 8: Auditability.* (The "Audit" case). The verdict must be derivable from the log. *Status:* Non-negotiable given the prompt's premise.
      *   *Desideratum 9: Regress Termination.* (The "Reconsideration" case). Rules for reopening plans must not be infinite. *Status:* Non-negotiable for computability.

  4.  **Analyzing Conflicts (The "Impossible Trinity"):**

      *   *Conflict 1: Dynamic Consistency vs. Legitimate Revision.* If preferences change, DC is violated. If you enforce DC, you ban revision. *Resolution:* Drop strict DC. Replace with "Diachronic Coherence" (plans must align with *current* goals, acknowledging past goals were valid then).
      *   *Conflict 2: Counterfactual Exploitability vs. Auditability.* You can't audit counterfactuals. If the norm requires "No *possible* pumps," an auditor can't verify it. *Resolution:* Drop Counterfactual Exploitability as an *audit* standard. Keep it as a *design* standard. The audit standard must be "No *actual* loss cycles."
      *   *Conflict 3: Local Optimality vs. Global Optimality.* (The Stepwise Pump). You can't have both if preferences change or information is incomplete. *Resolution:* Drop Local Optimality. Global/Policy optimality is the priority for planning systems.

  5.  **Identifying the "Workhorse" and Prejudices:**

      *   *Workhorse:* **Policy Stability under Legitimate Revision.** This excludes simple myopic choice and rigid resolute choice.
      *   *Prejudice:* **Preference Consistency.** The demand that preferences *must* be transitive/static is a prejudice of classical economics. In a revision-allowed system, *coherence of process* matters more than *consistency of state*.

  6.  **Drafting the Scorecard:**

      *   *Sophisticated Choice:* Fails Revision (anticipates change as threat).
      *   *Resolute Choice:* Fails Revision (ignores valid updates).
      *   *Time-Slice:* Fails Global Optimality (pumpable).
      *   *Preferences over Plans:* Good for Auditability, hard for Revision.
      *   *Bargaining across selves:* Good for Revision, bad for Auditability (internal states).

  7.  **Refining the Output (Self-Correction during drafting):**

      *   *Check:* Did I fix the unit of evaluation first? Yes.
      *   *Check:* Did I mark Non-negotiable vs. Preference? Yes.
      *   *Check:* Did I address the specific cases (Stepwise, Near-indifference, etc.)? Yes, mapped them to desiderata.
      *   *Check:* Is the tone right? Needs to be crisp, specification-like.
      *   *Correction on Auditability:* I need to be very clear that *exploitability* is technically unauditable. The specification must demand a proxy metric (e.g., "No Actual Loss Cycles") rather than the true property.
      *   *Correction on Revision:* The prompt says objective function *may legitimately be revised*. This is key. Standard diachronic rationality assumes fixed utility. This spec must handle *utility migration*.

  8.  **Final Polish:** Organize into clear sections: Unit, Desiderata (with Case, Requirement, Status), Impossibility Results, Workhorse/Prejudice, Scorecard. Ensure the distinction between "Design Time" (what the builder ensures) and "Run Time/Audit" (what the auditor sees) is clear, as this resolves some tensions.

  *(Self-Correction on the "Unit of Evaluation"):* The prompt asks me to *fix* it. I should argue for **Conditional Policy** (a mapping from observable history and current objective state to actions). It's instantiatable (code) and auditable (log matches policy output). Dispositions are internal; Policies are externalizable.

  *(Self-Correction on "Pumpability"):* The prompt asks about "Pumpability vs Being Pumped". I need to make sure the spec distinguishes between *vulnerability* (design flaw) and *exploitation* (audit finding).

  *(Refining the "Conflict" section):* The prompt specifically asks to mark which are jointly unsatisfiable. I need to be explicit: Local Optimality + Global Non-Pumpability + Preference Revision = Impossible.

