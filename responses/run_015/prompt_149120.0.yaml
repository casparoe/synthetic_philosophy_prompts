answer: |-
  The stalemate is best diagnosed as **different questions under one name**. H and C agree on the label ("science of consciousness") but diverge on the target of explanation. H seeks to explain the *capacity* to produce reports of experience (a functional/behavioral target); C seeks to explain the *state* of experience itself (an ontological target). Because they agree on the name, they argue as if they are competing theories of the same phenomenon, but they are actually distinct research programs with incommensurable success conditions. H succeeds if report-production is causally closed; C succeeds if the theory matches the phenomenal character.

  The alternative diagnoses fail for structural reasons. It is not **merely verbal** because the disagreement concerns ontological commitment, not just definition; both sides agree on how the word "experience" is used but disagree on whether its referent exists independently of report. It is not a **hidden empirical question** because empirical progress (like the Trained Reporter case) does not force convergence; H can absorb reliable reports as better behavioral data without conceding ontological privilege to the first-person perspective. It is not **ill-posed** because both programs generate coherent experiments and predictions within their own frameworks; the question is meaningful, just doubly ambiguous.

  Your three cases illuminate this divergence. In the **Swap Pair**, H denies the difference exists (no third-person trace), while C asserts it does (phenomenal difference); this shows H explains reports while C explains the state reported. In **Protocol Sensitivity**, H sees confirmation that reports are constructed texts, while C sees measurement noise obscuring the real state; this shows H treats reports as data-to-be-explained, C as evidence-of-data. In the **Trained Reporter**, H accepts the improved prediction but maintains the reports are still behavior, while C sees vindication of first-person ontology; this shows empirical refinement cannot bridge the explanatory gap.

  Progress requires a **change of question**. The field must disambiguate "science of consciousness" into "science of report-production" and "science of phenomenal structure." If these are treated as distinct but related inquiries, H and C can cooperate without claiming the other is methodologically bankrupt. H can model the neural correlates of reporting; C can model the structure of the reported state. The stall persists only because both insist their question is the *only* legitimate one.

