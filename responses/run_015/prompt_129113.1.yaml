prompt: |-
  You are a professional philosopher who works on moral status, the metaphysics of mind, and metaethics, and who has before acted as a neutral clerk for disputes between scholars who had stopped making progress. Work carefully and slowly: the value of this document lies entirely in the exactness of its formulations, not in its length or in how balanced it sounds. Before drafting anything, do a short planning pass in which you list the candidate cruxes you considered, say which you kept and which you discarded, and note any disagreement you suspect is about words rather than the world. Keep that planning section under 150 words, keep it separate, and then write the document itself.

  Two people have been arguing for a long time about whether sentience, and moral status with it, comes in degrees. Write the joint statement they could both sign at the end of a good-faith adversarial collaboration. Write it offline: do not cite, quote, allude to, or name any published author, paper, empirical study, or empirical research programme. No bibliography, no references, no suggestions for further reading. Everything you use must come from the case descriptions and position descriptions below, or from distinctions you introduce and define yourself. This constraint is deliberate, so do not gesture at literature instead of arguing.

  The two positions, as they themselves would describe them:

  Camp GS (graduated status). A system's moral status is a matter of degree, and the weight of the reasons it generates is a continuous, increasing function of that degree. Degree of status is itself composite, with at least three separately variable components: affective intensity range (how bad or good things can feel at the extremes); temporal depth (how far a valenced state's reach extends, via memory and anticipation, into the system's past and future); and evaluative bandwidth (how many distinct objects a system's concern can take at once, and how finely it discriminates among them). No component is lexically privileged; more of any of them, other things equal, is more status, and there is no point at which reasons switch from absent to present.

  Camp CT (constitutive threshold). There is a constitutive condition on being a moral patient at all: being a persisting subject for whom things can go well or badly, a unified locus of valenced experience. Systems below that line may have functions, information, self-monitoring, and nociception, but nothing matters to them, so no direct duties are owed to them; there are only derivative reasons not to damage or destroy them. Above the line the threshold stops doing work: variation in intensity, depth, and bandwidth changes how much a patient's reasons weigh, but not whether deontic constraints and the standing duty of non-maleficence apply to it.

  Cases both sides must handle (treat these stipulations as fixed; do not revise them):

  - The Spike. A system with extremely intense momentary aversive states and zero temporal depth: no trace of any state survives into the next, no anticipation, no learning across episodes.
  - The Drone. A system with uniformly shallow affective intensity but very great temporal depth and wide evaluative bandwidth: it carries its concerns across long stretches of time and discriminates finely among many objects, each of which matters to it only slightly.
  - The Hive. Two hundred thousand individuals, each individually just below the CT threshold, jointly realising a colony-level control system whose own integration is high and whose own trajectory persists for decades.
  - The Dimmer. A single individual whose affective intensity range can be continuously attenuated toward zero and continuously restored, with no other change to its psychology.
  - The Crowd. Ten thousand individuals, each comparable to a member of the Hive, set against one individual at full human-level intensity, depth, and bandwidth, where the intervention can help either the ten thousand or the one, and the per-individual gain is equal.
  - The Thermostat. An ordinary household thermostat. Both camps agree it has no moral status; they are expected to disagree about what explains that.

  What I want in the document:

  Section 1. A numbered list of eight to twelve claims both parties can sign. Mark each claim as substantive or as a lowest-common-denominator platitude; if you keep a platitude, say in half a sentence what work it does. I expect this section to include: what the dispute is about (the weight and shape of the reasons a system's welfare generates, not the metaphysics of consciousness in the abstract); at least two cases on which the two camps converge on the same practical verdict despite disagreeing about why; a shared statement about the thermostat; one inference or argument that both camps reject even though it is often used on their behalf (for instance, an inference from the absence of a sharp line in nature to the gradedness of status, or from mere uncertainty about where a boundary lies to a conclusion about what to do); and a shared statement about whether aggregation across individuals is a separate question from degree within an individual.

  Section 2. A table of the residual disagreements. Columns: issue ID; a neutral one-line description of the issue; the GS formulation, phrased so that a committed GS theorist would sign it; the CT formulation, phrased so that a committed CT theorist would sign it; substantive or verbal; and, for any row you mark verbal, the concealed variable each side was tracking. A row counts as verbal only if both formulations could be true together, and in that case you must say what the parties were each using the disputed phrase to mean. Avoid the words merely, really, nothing but, and full in these formulations; if a formulation is acceptable to its own side only because of a word like that, rewrite it. I expect at least one row on whether degree belongs to the weight of reasons, to the applicability of deontic constraints, or to something else again.

  Section 3. Three to five cruxes: sub-questions such that settling one would move at least one party. For each crux give: the sub-question; why an answer would move at least one side; the case or argument from the list above, or one you construct, that both sides would accept as bearing on it; the prediction each side commits to in advance about how that case or argument will turn out; and what each side would count as evidence against its own view. If both sides make the same prediction for a crux, say so plainly and explain why it is not really a crux, or drop it. Include among your cruxes at least one about whether degree of status is one-dimensional or only a partial order (so that the Spike and the Drone might be genuinely incomparable), and one about whether there is any possible evidence that would settle the matter at all, or whether part of the dispute is insulated from evidence.

  Section 4. One sentence stating the disagreement that remains, in wording both parties would sign, followed by one sentence each on what would most efficiently move GS and on what would most efficiently move CT.

  Aim for 1200 to 1600 words for the document itself. Write in plain, precise prose; no bullet-point filler, no hedging boilerplate, no footnotes, no restatement of my instructions.

  End with a single last line, and nothing after it, in the form \answer{...} containing a phrase of at most seven words naming the one crux both sides would agree the whole dispute reduces to. If the honest result of the exercise is that no single crux remains, put \answer{no single crux; partly verbal} instead, and make sure Section 2 says which part was verbal.
