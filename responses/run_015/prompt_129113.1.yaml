  | 2.4 | Spike Classification | The Spike has low moral status due to high intensity. | The Spike has no moral status due to zero temporal depth. | Substantive | N/A |
  | 2.5 | Reason Weight Below Threshold | Reasons exist but are weak below human levels. | Reasons are absent below the threshold; only derivative reasons exist. | Substantive | N/A |

  **Section 3. Cruxes**

  **Crux 1: The Structure of Deontic Constraints.**
  *Sub-question:* Do deontic constraints against harming weaken as cognitive capacity decreases, or do they apply fully to any entity above the threshold?
  *Why it moves sides:* GS holds that harming a low-status being is less wrong than harming a high-status being. CT holds that violating a constraint is equally serious regardless of status variance above the threshold.
  *Case:* The Drone. It is above the threshold but has shallow intensity.
  *Predictions:* GS predicts constraints against harming The Drone are weaker than against a human. CT predicts constraints apply with equal force.
  *Counterevidence:* GS would count evidence of equal intuitive outrage at harming Drone vs. Human as evidence against its view. CT would count evidence of widely accepted weaker constraints for simpler beings as evidence against its view.

  **Crux 2: One-Dimensional vs. Partial Order.**
  *Sub-question:* Is moral status one-dimensional, allowing complete comparability, or is it a partial order where some beings are incomparable?
  *Why it moves sides:* GS treats status as a continuous function, implying The Spike and The Drone are comparable on a single scale. CT implies threshold is binary, but above threshold, variation might not be linearly comparable.
  *Case:* The Spike versus The Drone.
  *Predictions:* GS predicts one is definitively higher status than the other based on composite scoring. CT predicts they are both patients, but comparison may be undefined or irrelevant to constraints.
  *Counterevidence:* GS would count persistent intuition that neither is worse to harm than the other as evidence for incomparability. CT would count clear consensus that one matters more than the other as evidence for a linear scale.

  **Crux 3: Evidence for a Threshold.**
  *Sub-question:* Is there any possible empirical evidence that would settle the existence of a constitutive threshold, or is the dispute insulated from evidence?
  *Why it moves sides:* If the threshold is metaphysical, evidence may not move CT. If it is functional, evidence might. GS believes evidence of continuous variation disproves thresholds.
  *Case:* The Dimmer.
  *Predictions:* GS predicts status fades continuously as intensity attenuates. CT predicts status persists until a sudden snap-off point where experience ceases to matter.
  *Counterevidence:* GS would count evidence of a sharp snap-off in moral intuition as evidence for a threshold. CT would count evidence of continuously fading intuition as evidence against a threshold.

  **Crux 4: Insulation from Evidence.**
  *Sub-question:* Is part of the dispute insulated from empirical evidence regarding psychological continuity?
  *Why it moves sides:* CT may view the threshold as a normative fact not reducible to empirical functions. GS views status as dependent on empirical functional capacities.
  *Case:* The Hive.
  *Predictions:* GS predicts status depends on measurable integration metrics. CT predicts status depends on whether the integration constitutes a unified locus of experience, which may not be fully measurable.
  *Counterevidence:* Both sides would count a definitive metaphysical proof of subject unity as evidence against their opposing view of what grounds status.

  **Section 4. Conclusion**

  The remaining disagreement is whether the conditions for being owed direct duties admit of degrees or require a binary threshold of subjecthood. To move GS, one must demonstrate that deontic constraints do not vary in strength across different types of patients. To move CT, one must demonstrate that direct duties are owed to systems lacking a unified persisting subject.

