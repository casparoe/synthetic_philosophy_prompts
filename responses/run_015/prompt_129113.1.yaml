  **Joint Statement on Moral Status and Sentience**

  **Section 1. Shared Commitments**

  1.  The dispute concerns the weight and shape of reasons generated by a system's welfare, not the metaphysics of consciousness in the abstract. (Substantive)
  2.  The Thermostat has no moral status and generates no direct moral reasons. (Platitude; anchors the lower bound of the discussion.)
  3.  Normal adult humans possess full moral status and are subject to full deontic constraints. (Platitude; anchors the upper bound of the discussion.)
  4.  The absence of a sharp line in nature does not entail that moral status is graded. (Substantive; rejects a common inference from vagueness to gradualism.)
  5.  Mere uncertainty about where a boundary lies does not entail that no boundary exists. (Substantive; rejects epistemic uncertainty as a argument for continuity.)
  6.  Aggregation across individuals is a separate question from degree of status within an individual. (Substantive; clarifies the Crowd case handling.)
  7.  In the Crowd case, the decision depends on both individual status weight and the number of individuals. (Substantive; both camps accept trade-offs involve numbers.)
  8.  The Spike generates moral reasons if it passes the constitutive threshold, but disagrees on whether it passes. (Substantive; locates disagreement on threshold criteria.)
  9.  The Drone generates moral reasons, but disagrees on whether its shallow intensity reduces constraint strength. (Substantive; locates disagreement on constraint structure.)
  10. The Hive is treated as a single patient if it meets integration conditions, not as a sum of parts. (Substantive; both agree colony-level integration matters.)
  11. The Dimmer case reveals whether status fades continuously or snaps off at a point. (Substantive; identifies the empirical phenomenology needed.)
  12. Direct duties are owed only to systems for which things can go well or badly. (Platitude; defines the necessary condition for patienthood.)

