prompt: |-
  I chair my university's research ethics board, and we've just received a proposal from a legal-psychology lab. The lab wants to survey employees of two companies: one whose CEO, in announcing a merger, said he was "deeply concerned" about the layoffs it would cause, and one whose CEO, in announcing a restructuring, said he was "proud" of the new scholarship fund it would create. Respondents would be shown each CEO's statement and asked whether the CEO "intended" the layoffs, or "intended" the scholarship. The lab says the results will help a state legislature draft a statute distinguishing intentional from merely foreseen harms in corporate liability, and a senator is waiting on their findings. Half the board thinks this is a straightforward survey of ordinary language. The other half, including me, worries that the very question — "did she intend this bad thing?" — pushes respondents toward "yes" in ways that "did he intend this good thing?" does not, so that the answers track the valence of the outcome rather than anything in the CEO's mind, and that the statute would be built on a measurement artifact. Draft the board's decision memo — approve, reject, or approve with conditions — with a clear bottom line, reasoning the researchers could actually respond to, and a fair account of the strongest reason to run the study as proposed.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of a University Research Ethics Board (REB/IRB).
      *   **Task:** Draft a decision memo regarding a research proposal from a legal-psychology lab.
      *   **Proposal Details:** Survey employees of two companies.
          *   Company A: CEO expresses concern about layoffs (negative outcome).
          *   Company B: CEO expresses pride in a scholarship fund (positive outcome).
          *   Task: Respondents judge whether the CEO "intended" the outcome (layoffs vs. scholarship).
          *   Goal: Inform state legislation on corporate liability (distinguishing intentional vs. foreseen harms).
          *   Stakeholder: A senator is waiting on findings.
      *   **The Conflict:**
          *   Half the board: It's a straightforward survey of ordinary language.
          *   Chair + other half: Concern about *valence bias* (asking about "bad things" pushes "yes" more than "good things," creating a measurement artifact rather than measuring actual intent attribution). This risks bad policy.
      *   **Requirements:**
          *   Clear bottom line (Approve, Reject, or Approve with Conditions).
          *   Reasoning researchers can respond to (actionable).
          *   Fair account of the strongest reason to run the study as proposed (steel-manning the opposition).

  2.  **Determine the Decision:**
      *   *Option 1: Reject.* Too harsh. The research question is valid (folk psychology of intent), but the methodology is flawed. Rejection stops the research entirely, which might delay policy or push it to less rigorous venues.
      *   *Option 2: Approve.* Unethical/risky. If the Chair's concern is valid (valence bias), the data will be misleading. Using misleading data for legislation is harmful.
      *   *Option 3: Approve with Conditions.* Best fit. It acknowledges the value of the research but mitigates the methodological flaw. It allows the researchers to fix the design (e.g., counterbalancing, control conditions, framing adjustments) to ensure validity.
      *   *Decision:* **Approve with Conditions.**

  3.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard REB format (To, From, Date, Subject, Protocol ID).
      *   **Bottom Line:** State the decision clearly at the top.
      *   **Summary of Proposal:** Briefly recap what they want to do to ensure mutual understanding.
      *   **The Strongest Case for Approval (Steel-manning):** Acknowledge why the other half of the board supports this.
          *   Ecological validity (real-world scenarios).
          *   Urgency (legislative timeline).
          *   Ordinary language intuition is exactly what legislation reflects (law is based on how people *think*, not just philosophical truth).
      *   **The Board's Primary Concern (The Chair's View):** Explain the valence bias/measurement artifact issue.
          *   The "Knobe Effect" (Side-Effect Effect) is a known phenomenon in this field. The prompt implicitly references it.
          *   If the measure conflates moral judgment with intent attribution, the statute might criminalize based on outcome severity rather than mental state.
          *   Ethical obligation to ensure data quality when policy is at stake.
      *   **Conditions for Approval:** Actionable steps to fix the flaw.
          *   Control conditions (neutral outcomes).
          *   Counterbalancing (swap the valence or the wording).
          *   Debriefing (explain the purpose to participants).
          *   Methodological justification (cite literature on the Knobe Effect).
      *   **Timeline/Next Steps:** How to proceed.

  4.  **Refining the Content (Self-Correction/Nuance):**
      *   *Tone:* Professional, collegial, firm but supportive. Avoid accusing them of bad science; frame it as "strengthening validity."
      *   *The "Knobe Effect":* I should explicitly mention this. The scenario described is basically the classic Joshua Knobe side-effect experiment. The researchers *must* know this. If they don't, they aren't qualified. If they do, they need to explain how they are controlling for it. I will frame the concern around "known confounds in intent attribution literature."
      *   *Legislative Stake:* Emphasize that because this informs law, the burden of methodological rigor is higher than a standard psych survey.
      *   *Employee Status:* Surveying *employees* of the specific companies adds a layer of risk (coercion, privacy). I should mention protecting participant anonymity vis-à-vis the employers.
      *   *Actionability:* The conditions need to be specific enough that they can revise the protocol, not just vague "do better."

  5.  **Drafting the Text (Iterative Process):**
      *   *Opening:* "Approved with Modifications."
      *   *Rationale:* Balance the legislative need against the scientific validity risk.
      *   *Steel-man:* The "ordinary language" argument is strong. Law *does* rely on folk psychology. If the public *perceives* intent differently based on outcome, that *is* legally relevant, even if it's a bias. *Wait, this is a crucial nuance.*
      *   *Correction on Steel-man:* The board members who support it argue it's a survey of *ordinary language*. If the goal is to see how ordinary people *actually* attribute intent (biases included), then the design *might* be correct. However, the Chair's concern is that the *question wording* drives the result, not the attribution process.
      *   *Refined Argument:* The distinction is between measuring *public intuition* (which includes bias) vs. measuring *conceptual understanding* (which the statute tries to codify). If the statute wants to distinguish intent from foresight, it needs to know if people *can* distinguish them, not just if they *do* distinguish them when morally charged.
      *   *Actually, looking closer at the prompt:* The Chair worries the question *pushes* respondents. This suggests a framing effect. The condition should be to test if the framing drives the result.
      *   *Revised Plan:* I will focus on the need to disentangle moral valence from intent attribution.

  6.  **Final Polish:** Check against constraints.
      *   Clear bottom line? Yes.
      *   Reasoning researchers can respond to? Yes (methodological controls).
      *   Fair account of strongest reason? Yes (ecological validity/legislative relevance).
      *   Tone? Appropriate for an REB Chair.

  7.  **Final Review of the "Knobe" aspect:** The scenario described is *exactly* the Knobe Side-Effect Effect. The CEO "concerned" about layoffs vs. "proud" of scholarship. In Knobe's original work, people say the harm was intended but the help was not, even if the mental state (foreseeing the side effect) was identical. The researchers are likely *trying* to replicate this to show the legislature that people's intuitions are inconsistent.
      *   *Wait, re-reading the prompt:* The Chair worries the answers track the *valence* rather than the *mind*. The researchers say it helps distinguish intentional from foreseen harms.
      *   *Interpretation:* The researchers likely want to show that people *do* treat them differently. The Chair worries the *question* forces the difference.
      *   *Decision:* The REB needs to ensure the study distinguishes between "people have biased intuitions" (valid finding) vs. "the survey question is leading" (methodological flaw). The conditions should focus on control groups and wording validation.

      *(Self-Correction)*: I need to be careful not to dictate scientific design too heavily, but REBs *do* have a mandate to ensure scientific validity as part of ethical review (waste of resources/participant time on flawed science is unethical).

      *Let's structure the memo.*
      1. Decision: Approved with Modifications.
      2. Context: Legislative stakes raise the bar.
      3. Supportive Argument: Folk psychology is relevant to law.
      4. Critical Concern: Construct validity (Valence bias vs. Intent attribution).
      5. Conditions: Control conditions, wording checks, anonymity.

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** Principal Investigator, Legal-Psychology Lab
  **FROM:** Chair, University Research Ethics Board (REB)
  **DATE:** October 26, 2023
  **SUBJECT:** REB Decision on Protocol #2023-LP-04 (Corporate Intent Attribution)
  **DECISION:** **APPROVED WITH CONDITIONS**

  ### 1. Bottom Line
  The Research Ethics Board grants conditional approval for this study. You may not begin recruitment until you submit a revised protocol addressing the methodological concerns regarding construct validity outlined below. Once these modifications are approved by the REB administrative staff, you may proceed.

  ### 2. Context and Stakes
  We recognize the urgency of this project. The collaborating state senator's office is awaiting data to draft legislation regarding corporate liability, specifically the distinction between *intentional* harm and *foreseen* side effects. Because this research directly informs public policy and potential criminal/civil statutes, the burden of methodological rigor is higher than in standard theoretical psychology. If the data produced are artifacts of survey design rather than reflections of genuine cognitive attribution, the resulting legislation risks being built on a measurement error.

  ### 3. The Case for Approval (Board Consensus)
  Half of the Board, and indeed the REB as a whole, acknowledges the strong theoretical justification for this study.
  *   **Ecological Validity:** Legislation is ultimately interpreted by laypeople (jurors, employees, the public). Therefore, mapping "ordinary language" intuitions about intent is legally relevant, regardless of whether those intuitions align with philosophical definitions of *mens rea*.
  *   **Real-World Scenarios:** Using actual public statements from current CEOs (rather than vignettes) increases the ecological validity. If the public perceives intent differently based on the moral valence of the outcome, the legislature arguably *needs* to know that, even if the perception is biased.
  *   **Social Value:** Clarifying the boundary between foresight and intent serves a significant public interest by potentially standardizing corporate liability laws.

  ### 4. Primary Concern (Condition for Approval)
  The remaining Board members, including the Chair, hold a specific concern regarding **construct validity**. The worry is that the survey instrument may conflate *moral judgment of the outcome* with *attribution of mental state*.

  In the literature on the "Side-Effect Effect" (e.g., Knobe, 2003), respondents often attribute intent to harmful side-effects but not helpful ones, even when the agent's mental state is identical. However, your current design risks a **framing artifact**: asking "Did she intend this *bad* thing?" may prime a "Yes" response due to affective loading, whereas "Did he intend this *good* thing?" may not. If the variance in responses is driven by the emotional valence of the words "layoffs" vs. "scholarship" rather than the respondents' theory of mind, the data will not help the legislature distinguish intent from foresight; it will merely confirm that people react strongly to bad news.

  To ensure the data is usable for statute drafting, we must be confident that you are measuring *intent attribution*, not just *outcome severity*.

  ### 5. Required Modifications
  To mitigate this risk, the REB requires the following modifications to the protocol prior to commencement:

  1.  **Control Conditions (Valence Neutral):** You must include a control condition where the outcome is morally neutral (e.g., a CEO announces a restructuring that will "change the office seating chart" or "alter the fiscal reporting quarter"). This allows you to establish a baseline for intent attribution absent moral valence.
  2.  **Counterbalancing/Cross-Over:** You must test the "concerned" framing against a positive outcome and the "proud" framing against a negative outcome in a subset of participants. If the "concerned" phrasing always yields higher intent scores regardless of the outcome, the issue is the wording, not the psychology.
  3.  **Manipulation Check:** Include a question verifying whether respondents believe the CEO *foresaw* the outcome. If respondents attribute foresight equally across conditions but intent only in the negative condition, you have a valid finding regarding the Side-Effect Effect. If they attribute foresight differently, you are measuring something else.
  4.  **Participant Protection (Employment Status):** Since you are surveying employees of specific, identifiable companies, you must strengthen confidentiality protections.
      *   Do not collect IP addresses.
      *   Add an explicit disclaimer that their employer will not see individual responses.
      *   Ensure the recruitment language does not imply that participation is expected by management.

  ### 6. Next Steps
  Please submit a revised protocol and updated survey instrument reflecting these changes within 14 days. The REB administrative team is authorized to approve these changes without reconvening the full board, provided the changes are strictly methodological and do not increase risk to participants.

  We appreciate the importance of this work. By tightening the design, you ensure that the resulting statute rests on robust science rather than survey artifacts.

  **Signed,**

  [Name]
  Chair, Research Ethics Board
  [University Name]
