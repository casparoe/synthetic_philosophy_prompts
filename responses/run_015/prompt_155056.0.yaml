      *   Better angle: They are missing the **social context of functioning**. "Species-typical" isn't just statistical; it's defined by social structures. A trait is a deficit only relative to an environment. Both treat traits as intrinsic goods/bads.
      *   Even better: They are missing the **Non-Identity Problem** nuance. C1 assumes choosing Child A over Child B harms B. But if B wouldn't exist otherwise, did you harm B? Savulescu says yes (impersonal harm). Liberals often say no (no rights violated). Both parties are arguing past the metaphysical status of the future child.
      *   *Decision:* The prompt asks about "statistical normality and moral obligation." The missing piece is that **moral obligation in reproduction is not derived from statistical norms but from the avoidance of suffering and the preservation of open futures.** Both treat "normality" as a proxy for "good," whereas the real ethical weight lies in the *social construction* of those norms and the *relational* impact on the child's autonomy.
