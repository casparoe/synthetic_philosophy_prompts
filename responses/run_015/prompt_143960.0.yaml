answer: |-
  **Proposal for Independent Research: The Normative Status of Artistic Style in AI Imitation**

  **1. Research Question**
  Should the law recognize a distinct, non-transferable interest in artistic style against AI imitation, separate from copyright's economic rights? This question is asked at the level of normative legal theory: what the law *ought* to be, grounded in moral distinction. This level is appropriate for a project of this size because current statutes are static while the technology is dynamic; arguing purely about existing case law would describe the conflict without resolving the underlying inconsistency in our objections. A determinate answer requires deciding whether the harm is primarily economic (solvable by IP expansion) or personal (requiring a right of attribution or integrity).

  **2. The Gap in Standard Positions**
  Current theoretical frameworks fail to resolve the specific tension created by generative AI. The **incentive-based account** justifies IP to encourage production, but protecting style chills the imitation and learning necessary for new artists to develop, creating a paradox where protection stifles the very creativity it aims to promote. The **labor or personality account** argues style is an extension of the self, supporting strong protection, but lacks a limiting principle: if style is property, where does the monopoly end? The **scarcity argument** notes that ideas are non-rivalrous, unlike physical property; borrowing property logic here risks artificial scarcity without clear benefit. Finally, the **traditional refusal** to protect style rests on the idea/expression distinction, but AI blurs this line by copying expression without copying specific works. Each argument settles part of the landscape but leaves the specific claim to "voice" untouched.

  **3. Methodology and Timeline**
  This project involves no empirical work. It relies on conceptual analysis using constructed cases to test competing theories. The semester is divided into four months.

  *   **Month 1: Argument Mapping.** I will outline the four standard positions listed above and define the variables: consent, market competition, attribution, and derivation method.
  *   **Month 2: Case Construction and Testing.** I will apply the theories to five constructed cases, committing in advance to the following tentative cut-points:
      1.  *Training Data:* AI trained on Artist X vs. AI arriving at style independently. (Hypothesis: Training data matters less than market substitution).
      2.  *Status:* Living artist vs. deceased artist. (Hypothesis: Personality rights should not survive death; economic rights might).
      3.  *Labeling:* Output labelled "AI Imitation" vs. output passed as human. (Hypothesis: Labeling resolves the deception harm, isolating the economic harm).
      4.  *Scale:* Single fan study vs. industrial-scale competitor. (Hypothesis: Scale determines the economic threat, not the style itself).
      5.  *Consent:* Opt-in training vs. scraped data. (Hypothesis: Consent mitigates the moral wrong but not necessarily the market harm).
  *   **Month 3: Drafting.** I will synthesize the results into a coherent argument, focusing on whether the variables cluster into one "style right" or separate remedies.
  *   **Month 4: Revision.** Refining the decision rule and ensuring the distinction between economic and personal harms is clear.

  **4. Possible Conclusions**
  The paper will land on one of three conclusions, decided by which harms persist in the constructed cases:
  1.  **Expanded IP:** If the primary harm is lost income across all cases, style should be copyrightable property.
  2.  **Moral Rights Regime:** If the harm persists even when income is secure (e.g., in labelled non-commercial work), the remedy is a non-transferable right of attribution and integrity.
  3.  **Consumer Protection:** If the harm collapses into audiences being misled, the solution is labeling laws, not ownership rights.
  The deciding consideration is whether the artist objects to the *existence* of the imitation or only its *market presentation*.

  **5. Failure Conditions**
  The primary risk is that the "style interest" collapses into standard IP concerns. I will evaluate this at the end of Month 2. If every case where the artist objects is also a case where they lose income or audiences are defrauded, then there is no distinct style-interest. If this occurs, I will pivot the paper to argue against new rights entirely, proposing instead that existing fraud and copyright laws are sufficient if enforced rigorously. This is a valid negative result, but I must identify it early to avoid writing a generic IP essay.

  **6. Scope and Deliverable**
  To remain within twenty-five pages, I will cut technical explanations of how neural networks train, international comparisons of law, and historical deep dives into previous imitation technologies. The biggest risk of ballooning is attempting to solve copyright law broadly; I will restrict the analysis strictly to *style* and *voice*. The final deliverable will not be a general verdict but a decision rule: a set of criteria that determines, for a given imitation, whether it is objectionable and which remedy (damages, injunction, or labeling) fits the specific harm identified.
