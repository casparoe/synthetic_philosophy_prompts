answer: |-
  # Simulation: The Veridia Transition
  **Topic:** The Political Economy of Amnesty and Truth
  **Time:** 120 Minutes
  **Students:** 18 (Scalable)
  **Materials:** Printed Role Sheets, Immunity Certificates, "Archive Key" Card, ICC Envelope, Facilitator Ground Truth.

  ---

  ## I. Instructor Preparation (Do Not Distribute)

  ### The Ground Truth (Facilitator Copy)
  *Keep this hidden. This is what actually happened in Veridia.*
  1.  **The Massacre at Kaelo Bridge:** 200 civilians executed. **Order given by:** Gen. Vanko (Military). **Executed by:** Lt. Sorel (Military). **Witnessed by:** Rebel Commander Jara (who did nothing).
  2.  **The "Disappearance" of Union Leaders:** 15 labor leaders vanished. **Perpetrator:** Intelligence Chief Mara (Military). **Burial Site:** Known only to Mara.
  3.  **The Market Bombing:** 50 dead. **Claimed by:** Rebels. **Actual Perpetrator:** Rogue Military Unit (False Flag). **Only Witness:** A low-level conscript (Private K).
  4.  **Torture Centers:** 3 locations. **Run by:** Intelligence Chief Mara. **Records:** Stored in the **Archive**.
  5.  **The Coup Plot:** The Military is currently plotting to retake power if their leaders are jailed. **Evidence:** In the **Archive**.
  6.  **New Gov Complicity:** The Interim President (New Gov) accepted bribes from the Military during the war to look the other way. **Evidence:** In the **Archive**.

  ### The Resources
  *   **Immunity Certificates (5 Total):** Physical cards. Only protect against *domestic* prosecution.
  *   **The Archive Key (1 Card):** Held by the Military Faction. Without it, the New Government cannot access tax records, police files, or prove crimes. The state collapses without it.
  *   **ICC Envelope:** Sealed. To be handed to the Commission Judges at Minute 65.

  ---

  ## II. Role Sheets (Print and Cut)
  *Distribute one per student. Tell them: "Do not show this sheet to anyone. Information is your only currency."*

  ### ROLE A: The New Government (3 Students)
  **Goal:** Stabilize the country. Avoid a coup. Secure the Archive Key.
  **Resources:** You control the 5 **Immunity Certificates**. You control the budget for trials (enough for only 2 major prosecutions).
  **Secret Constraint:** You are weak. If the Military revolts, you lose. If you grant too much amnesty, the Victims will riot.
  **Private Info:** You suspect some of your own members are compromised, but you don't know who. You need the Archive Key to govern, but you fear what is inside it.
  **Win Condition:** The transition completes without civil war. You hold power at the end.

  ### ROLE B: The Old Regime / Military (5 Students)
  **Goal:** Avoid jail. Protect the institution of the Military.
  **Resources:** You hold the **Archive Key**. You control the heavy weapons.
  **Secret Constraint:** You committed the worst atrocities. If you go to trial, you lose. If you get Blanket Amnesty, you win.
  **Private Info:** One of you (Intelligence Chief) knows where the bodies are buried. The others (Generals) gave the orders but have no blood on their hands technically.
  **Leverage:** If you do not get satisfactory amnesty, you will "misplace" the Archive Key and hint at a coup.
  **Win Condition:** No Military personnel serve prison time.

  ### ROLE C: The Rebel Command (4 Students)
  **Goal:** Legitimacy. Recognition as a political party.
  **Resources:** Control of the streets. Popular support among the rural poor.
  **Secret Constraint:** You also committed war crimes (executions, child soldiers). You want the Military prosecuted, but you fear being prosecuted yourself.
  **Private Info:** You know about the Market Bombing (False Flag). You can expose the Military, but it exposes your own inaction at Kaelo Bridge.
  **Win Condition:** Military leaders are prosecuted. Rebel leaders are not.

  ### ROLE D: Victims & Civil Society (4 Students)
  **Goal:** Truth. Acknowledgement. Reparations.
  **Resources:** Access to the Press. Moral authority. Ability to disrupt the ceremony.
  **Secret Constraint:** You have no legal power. You cannot grant amnesty. You can only shame.
  **Private Info:** You have a list of 10 missing relatives. You know roughly where they died, but need official confirmation to bury them.
  **Win Condition:** A public record of the truth is established. At least one major perpetrator admits guilt publicly.

  ### ROLE E: The Truth Commission Judges (2 Students)
  **Goal:** Adjudicate Amnesty Applications according to the Law.
  **Resources:** The gavel. The authority to grant/reject Immunity Certificates.
  **Secret Constraint:** You must follow the "Amnesty Act": Amnesty is only granted for **Political Crimes** if there is **Full Disclosure**. It is *not* granted for **Personal Gain** or **Excessive Cruelty**.
  **Private Info:** You are neutral, but you know the New Government is watching you.
  **Win Condition:** A legal process is completed. The rules are followed (or visibly bent for "peace").

  ---

  ## III. Mechanics & Rules

  1.  **The Amnesty Act:** To get an **Immunity Certificate**, a perpetrator must:
      *   Submit a written confession (on provided slip).
      *   Reveal new information (location of bodies, names of commanders).
      *   Be approved by the **Judges**.
  2.  **The Constraint:** There are only **5 Immunity Certificates** for Category A (Major) Crimes. There are unlimited certificates for Category C (Minor) Crimes.
  3.  **The Leverage:** The **Military** holds the **Archive Key**. They do not have to hand it over. Without it, the Commission cannot verify truth.
  4.  **The Stakes:**
      *   **War Resumes:** If Military revolts OR Victims riot uncontrollably. (Everyone Loses).
      *   **Justice Served:** Major perpetrators prosecuted or confess. (Victims/Rebels Win).
      *   **Stability Secured:** New Gov stays in power. (New Gov/Military Win).

  ---

  ## IV. Minute-by-Minute Timeline (120 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-15** | **Briefing** | Hand out roles. Explain rules. Emphasize: "You are not here to be moral. You are here to achieve your faction's goals." |
  | **15-35** | **Caucus** | Factions meet separately (5 groups). Read briefs. Strategize. Military decides how to use the Key. New Gov decides how to spend Certificates. |
  | **35-65** | **Phase 1: The Bargain** | Open negotiation. Perpetrators (Mil/Rebels) approach Judges to apply for Amnesty. Victims lobby Judges/New Gov. Military threatens New Gov privately. |
  | **65-70** | **The Twist** | **Instructor hands sealed Envelope to Judges.** (See below). Judges must announce this to the room. |
  | **70-90** | **Phase 2: The Shift** | Negotiation resumes. Incentives have changed. Perpetrators may withdraw applications or flip on commanders. |
  | **90-105** | **Verdict** | Judges announce who gets Immunity. New Gov announces if they accept the Archive Key. |
  | **105-120** | **Reveal & Debrief** | Instructor reveals Ground Truth. Compare "Official Record" vs. "Reality." Discuss. |

  ### The Envelope (Mid-Game Twist)
  *Text inside:*
  > **URGENT: INTERNATIONAL CRIMINAL COURT (ICC) NOTICE**
  > The ICC has invoked Complementarity.
  > 1. Domestic Amnesty is **NOT** recognized for acts of Torture or Systematic Execution.
  > 2. However, the ICC will offer **Leniency** to lower-level offenders who provide testimony against Commanders.
  > 3. The Commission's confidential records will be subpoenaed by the ICC.
  > *Effect: Confessing domestically now risks international prosecution unless you shift blame upward.*

  ---

  ## V. Debrief Guide (The Payoff)

  ### 1. The Reveal (5 Minutes)
  *   **Ask the Commission:** "Read the official record you produced. Who confessed to what?"
  *   **Reveal Ground Truth:** "Here is what actually happened."
  *   **Highlight the Gap:**
      *   *Did the Market Bombing come out?* (Likely no, Rebels didn't want to admit inaction, Military didn't want to admit guilt).
      *   *Did the New Gov Complicity come out?* (No, because they control the process).
      *   *Who walked?* (Likely the Generals, who traded the Archive Key for immunity, while subordinates took the fall to satisfy the ICC twist).

  ### 2. Concept Mapping (10 Minutes)
  *   **Amnesty as Power:** Ask the Military: "Did you grant amnesty because it was morally deserved, or because you held the Key?" (Answer: Power).
  *   **The Skewed Record:** Ask the Judges: "After the ICC envelope, did people tell the *whole* truth?" (Answer: No, they told the *useful* truth. They lied to avoid The Hague).
  *   **The Cost of Stability:** Ask the Victims: "Did you get truth?" (Answer: You got a sanitized version). Ask New Gov: "Did you get peace?" (Answer: Yes, by compromising justice).

  ### 3. Troubleshooting Common Failures
  *   **Failure 1: The Victims go quiet.**
      *   *Why:* They feel powerless.
      *   *Fix:* In future runs, give them "Media Leak" cards they can play to force a public scandal if ignored.
  *   **Failure 2: The Military holds out too hard.**
      *   *Why:* They think they can win a coup.
      *   *Fix:* Remind them privately: "If war resumes, you lose your pensions and international sanctions hit you personally."
  *   **Failure 3: Perfect Justice.**
      *   *Why:* Students act morally rather than strategically.
      *   *Fix:* Remind them during caucus: "Your constituents will vote you out / execute you if you fail your specific goal."
  *   **Failure 4: The ICC Twist is ignored.**
      *   *Why:* Students don't read the card carefully.
      *   *Fix:* Read the envelope contents aloud to the room as a "Breaking News Bulletin."

  ### 4. What This Activity Cannot Reproduce
  *   **Time:** Real transitions take decades. The pressure here is artificial.
  *   **Trauma:** Students are playing roles. They do not feel the grief of victims. *You must supply this in the debrief.*
  *   **International Geopolitics:** The ICC twist is simplified. Real geopolitics involves sanctions, aid cuts, and neighboring states.

  ---

  ## VI. Contingencies

  ### 1. Student from an Affected Region
  *   **Risk:** A student has personal experience with transitional justice (e.g., from Latin America, South Africa, Balkans).
  *   **Action:**
      *   **Pre-Semester Email:** "We are running a simulation on a fictional country. It involves themes of political violence and amnesty. Please let me know if you anticipate this being disruptive."
      *   **If they sign up:** Meet privately. Offer an **Observer/Analyst Role**. They do not play a faction; they take notes on the *process* and lead a portion of the debrief. This leverages their insight without making them a prop.
      *   **If they play:** Ensure they are not cast as "Victims." Cast them as "Judges" or "New Gov" (structural roles).

  ### 2. The "Crunch" Version (50 Minutes, 8 Students)
  *   **Cut:** Rebel Command faction (Merge into New Gov or Victims).
  *   **Cut:** Phase 1 Caucus (Reduce to 5 mins).
  *   **Roles:**
      *   New Gov (2)
      *   Military (3)
      *   Victims (1)
      *   Judges (2)
  *   **Mechanic:** Remove the ICC Envelope. Instead, at Minute 25, announce: "The Archive Key is damaged. Only 50% of the truth can be verified."
  *   **Debrief:** Focus strictly on the "Archive Key" leverage (Power vs. Justice). Skip the ICC complexity.

  ---

  ## VII. Printable Materials (Text for Handouts)

  ### Immunity Certificate Template
  > **REPUBLIC OF VERIDIA**
  > **TRUTH & STABILITY COMMISSION**
  >
  > **Holder:** ___________________
  > **Crime Category:** [ ] A (Major) [ ] C (Minor)
  > **Status:** [ ] GRANTED [ ] DENIED
  >
  > *This certificate grants protection from domestic prosecution. It does not protect against civil suits or international tribunals.*

  ### Application Slip
  > **CONFIDENTIAL DISCLOSURE**
  > **Name:** ___________________
  > **Act Committed:** ___________________
  > **Commanders Involved:** ___________________
  > **Location of Evidence/Remains:** ___________________
  > *Warning: False testimony voids amnesty.*

  ### Facilitator Cheat Sheet (Pocket Size)
  *   **Military Goal:** Keep Key, Get Amnesty.
  *   **Gov Goal:** Get Key, Keep Peace.
  *   **Twist:** ICC subpoena = Confession risk.
  *   **Truth:** Gov is corrupt. Market Bombing was False Flag.
  *   **Watch For:** Victims disengaging. Military bluffing coup.

  ---

  ## VIII. Instructor Script for the "Power" Lesson
  *Use this during the debrief to drive the point home:*

  "Look at the Archive Key. In this room, it was a piece of cardstock. In reality, it was the threat of a returned dictatorship. You discovered that the 'Price' of the truth was not set by how much the victims suffered, but by how many tanks the General could mobilize. The South African model traded justice for stability. You just enacted that trade. The question for next week is: Was the trade worth it? And who actually paid the price?"
