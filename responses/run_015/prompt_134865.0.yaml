      *   *N's Argument (The Critical View):* This needs to be nuanced. It shouldn't just say "biology is alive, machines aren't." It needs to focus on the *structure* of the explanation. Evolution relies on differential reproduction in a specific environment (semantic connection to the world is causal/historical). Computation relies on symbol manipulation defined by a user (semantic connection is assigned/interpreted). N needs to press on whether "competence" means the same thing in both contexts.

  3.  **Drafting - Round 1: Setting the Stage:**
