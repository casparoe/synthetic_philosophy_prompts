      *   *N:* Attacks the "competence" label. In computation, competence is defined by the programmer's intent (semantics). In evolution, "competence" is just survival. If you say a gene is "competent," aren't you smuggling in a goal? Also, Turing machines don't *do* anything without an interpreter. Evolution just *happens*.
      *   *Refinement:* N needs to make the "relocation of understanding" argument clearly. M needs to defend the "substrate independence" of the algorithmic pattern.

