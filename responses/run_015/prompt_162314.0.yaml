answer: |-
  You have walked directly into the trap set by the "Orwellian vs. Stalinesque" dichotomy. Your intuition that the distinction evaporates is correct, but your resistance to concluding "there is no fact of the matter" is also correct. The error isn't in the experience; it's in the assumption that "experience" is a point-event that *must* have a timestamp.

  Here is the carving of the conceptual space you are looking for, without the bibliography.

  ### 1. The Missing Fact (The "When" vs. The "What")

  You asked if there is a concept for a missing fact about *when* an experience happened, while the *what* remains solid.

  The concept is **Temporal Attribution Indeterminacy**.

  Here is the shape of it: We tend to think of an experience as a package deal containing Content + Timestamp. You are noticing that the Content is stable (the moving green dot), but the Timestamp is not a property of the content itself; it is a *label* applied by a downstream system.

  In the standard dichotomy:
  *   **Story A (Rewrite):** Content exists at $T_1$, Label is changed at $T_2$.
  *   **Story B (Delay):** Content is built at $T_2$, Label is backdated to $T_1$.

  Both stories assume there is a "True Time" of the experience that exists independently of the labeling process. **Temporal Attribution Indeterminacy** claims that the "True Time" is not a property the brain generates. The brain generates a coherent narrative *order*, but it does not necessarily generate precise *latencies* for every element of that narrative.

  The "missing fact" isn't missing because we can't measure it (epistemic); it's missing because the system doesn't create it (ontological). The experience is not a momentary flash; it is a settled conclusion. Asking "when did you conclude that?" is a valid question, but asking "when did the thing you concluded about happen?" is asking for a property of the external world, not the internal experience. In these illusion cases, the internal experience claims the event happened at $T_1$, but the *formation* of that experience finished at $T_2$. The gap between $T_1$ and $T_2$ is the **Attribution Gap**.

  ### 2. Conflicting Probes (The "Two Numbers" Problem)

  You asked what to call it when reaction time suggests early access, but report suggests late access.

  This is **Dissociated Availability**.

  This observation kills the idea of a single "Moment of Consciousness." Instead, think of information propagating through a hierarchy of systems.
  *   **Level 1 (Motor):** Can trigger a reflex or simple reaction. (Early)
  *   **Level 2 (Semantic/Report):** Can be named, described, or placed in a narrative. (Late)

  When the probes disagree, it is not "one experience happening twice." It is **one signal becoming available to different subsystems at different stages of consolidation.**

  *   **Is it unconscious processing?** Yes, relative to the report system. The motor system "knows" something the language system doesn't yet.
  *   **Is "when" a single number?** No. It is a curve. The signal crosses the threshold for "action" at $T_a$ and the threshold for "narrative" at $T_n$.

  The phenomenon here is **Staged Conscious Access**. The "experience" isn't a light turning on; it's a fog lifting. Different parts of the terrain become visible at different times. If you probe the motor system, you get an early time. If you probe the narrative system, you get a late time. Neither is the "real" time of the experience, because the experience *is* the gradient of access.

  ### 3. The Residue (The "Vague Wrongness")

  You asked about the feeling that something is off, without specific content.

  This is **Unbound Prediction Error**.

  The brain is constantly predicting what comes next. In the phi phenomenon (the moving dot), the prediction system is violated (a dot shouldn't change color mid-flight), but the narrative system smooths it over to make a coherent story ("it slid and changed").
  *   **The Report:** The smoothed story.
  *   **The Residue:** The raw error signal that the smoothing didn't fully silence.

  **Does it carry argumentative weight?** Yes. It proves that the "smooth story" is a construction. If the experience were simply "given" (veridical), there would be no error signal. The existence of the "wrongness" residue confirms that the brain had to do work to reconcile the stimuli, and that work left a trace. It is the seam in the fabrication. It validates that the "moving dot" is a synthesized object, not a direct perception.

  ### The Carving: A New Concept

  Since you asked for a coinage if nothing established covers it, here is the term for the specific "leftover" state you are identifying:

  **The Postdictive Binding Window**

  **Definition:** A finite duration of time (typically tens to hundreds of milliseconds) during which sensory events are held in a pre-conscious buffer, susceptible to revision by subsequent events, before being committed to a stable, reportable narrative.

  **What counts:**
  *   **Inside the Window:** Events A and B occur. The brain waits to see if C happens. If C happens, it changes the interpretation of A and B *before* you ever consciously perceive A and B.
  *   **Outside the Window:** Events are committed. They can be remembered incorrectly later (memory error), but the *phenomenal experience* itself is fixed.

  **What doesn't count:**
  *   **Simple Memory Revision:** Remembering a red dot as blue a week later. (This is Orwellian memory edit, not Postdictive Binding).
  *   **Neural Latency:** The time it takes a signal to travel from eye to brain. (This is physical transmission, not perceptual binding).

  **The Edge Case:**
  If you can change the *content* of an experience by manipulating a stimulus that occurs *after* the experience is supposedly finished, you are inside the Postdictive Binding Window.

  ### Moving from "Can't Tell" to "Nothing to Tell"

  You asked what observation would move you from "we can't tell which story is true" to "there is nothing to tell."

  The observation is **Causal Dependence of Content.**

  *   **Scenario:** You see a red dot. Then 100ms later, a green dot flashes. You report seeing a red dot turn green.
  *   **The Test:** If you suppress the green dot (using magnetic stimulation or masking) *after* it physically happens but *before* the subject reports, does the subject still report the color change?
      *   **If Yes:** The experience was formed before the green dot was processed. (Supports "Real Time" experience).
      *   **If No:** The content of the "red dot experience" *depends* on the green dot existing.

  If the content of the first experience literally cannot exist without the second stimulus being processed, then the first experience *did not exist* in its final form at the time it supposedly happened.

  This moves the needle from "We can't measure when it happened" to "It didn't happen then." It proves that the "early experience" was not a finished object waiting to be rewritten (Orwellian), nor a delayed object (Stalinesque), but rather an **unfinished process** that only achieved the status of "experience" once the window closed.

  ### Summary of the Shape

  1.  **The Dichotomy is False:** It assumes experience is a point in time. It is not; it is a process with a duration.
  2.  **The Missing Fact:** There is no timestamp for the process, only for the completion. The "when" is **Temporally Indeterminate** within the binding window.
  3.  **The Conflicting Probes:** Consciousness is **Layered**. Motor access precedes narrative access. There is no single "time of consciousness."
  4.  **The Residue:** The "wrongness" is **Prediction Error** that survived the narrative smoothing. It proves the construction.
  5.  **The Concept:** **The Postdictive Binding Window**. This is the zone where the "when" is fluid, and the "what" is negotiable.
  6.  **The Verdict:** When later stimuli causally determine the content of earlier reports, the "earlier experience" is a **Retroactive Construct**. There is nothing to tell about its "original time" because it had no original form.

  You are not confused. You have identified that the variable "Time of Experience" is a derived variable, not a primitive one. The system outputs "What" and "Order," but "Absolute Time" is a tag it sticks on afterwards to make sense of the world. In these illusions, the tag slips.
