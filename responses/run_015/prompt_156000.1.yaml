prompt: |-
  people in my ethics circles keep reaching for the equity-law 'clean hands' analogy when they talk about hypocrisy killing standing to blame: you've done the same wrong, so you're like a plaintiff with dirty hands and the court dismisses your suit, therefore you can't blame anyone else for it. they use this to argue hypocrisy automatically cancels standing, full stop. but there's also this rival framing floating around where standing isn't court-dismissal but more like a revocable social license — apologize and you get it back, like a suspended driver's licnse, not like being permanently barred from the courthouse. audit both analogies for me: give me the correspondence table for each — plaintiff/blamer, court/community, dirty hands/hypocrisy, dismissal/loss of standing — then the places each mapping breaks, especially whether blame actually needs an institutional audience the way a court does, and whether the license framing smuggles in a weird idea about apology as bureaucratic paperwork. finally, tell me whether the 'hypocrites can't blame' conclusion survives once you pull out all the legal machinery, or if the analogy was carrying the whole argument. if both analogies fail, what's a less misleading comparison?
