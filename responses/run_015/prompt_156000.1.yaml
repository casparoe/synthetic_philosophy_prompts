  2.  **Analyze Analogy 1: The "Clean Hands" Doctrine (Equity Law)**
      *   *Concept:* In equity, a plaintiff seeking relief must come with "clean hands." If they acted unethically regarding the subject matter, the court refuses to hear them.
      *   *Correspondence:*
          *   Plaintiff -> Blamer
          *   Court/Chancery -> Moral Community/Target of Blame
          *   Dirty Hands -> Hypocrisy (committing the same wrong)
