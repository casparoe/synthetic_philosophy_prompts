      *   **Topic:** The ethics of blame, specifically the relationship between hypocrisy and "standing to blame."
      *   **Core Task:** Audit two analogies used to explain this relationship:
          1.  *The Equity-Law "Clean Hands" Analogy* (Hypocrisy = Dirty Hands -> Dismissal).
