answer: |-
  # Activity Design: "The Allocation Game"

  ## 1. Overview & Learning Objectives
  **Goal:** Participants experience the failure modes of a naive ITN (Importance, Tractability, Neglectedness) scoring system through a resource allocation simulation.
  **Time:** 90 Minutes.
  **Participants:** 16 undergraduates (4 Teams of 4).
  **Prize:** The team with the highest "Impact Points" wins a trivial prize (e.g., first choice of pizza toppings, a chocolate bar, or bragging rights).

  **The Three Hidden Mechanics:**
  1.  **Displacement:** One cause yields diminishing returns based on total volume (specifically labor).
  2.  **Non-Separability:** One cause has a funding threshold; two causes are complementary (both must be funded to work).
  3.  **Ambiguous Signal:** One cause is empty but worthless (the "Lemon").

  **Forbidden Words (Until Debrief):** Crowding out, fungibility, complementarity, threshold, counterfactual, baseline, marginal.

  ---

  ## 2. Materials & Setup

  ### Room Setup
  *   4 Tables, one for each Team (A, B, C, D).
  *   1 Facilitator Table (hidden from view).
  *   Whiteboard for public tracking (optional, but recommended for tension).

  ### Tokens (The Resources)
  Create two distinct types of physical tokens (poker chips, colored paper, or coins):
  *   **Green Tokens ($):** Represents Funding.
  *   **Blue Tokens (h):** Represents Skilled Labor/Person-Hours.

  **Endowment Distribution (Resource Asymmetry):**
  *   **Team A & B:** 10 Green ($), 2 Blue (h) each. (Capital Rich)
  *   **Team C & D:** 2 Green ($), 10 Blue (h) each. (Labor Rich)
  *   *Total Market:* 24 Green, 24 Blue.

  ### Cause Cards (5 Cards, placed in center of room)
  Each card displays a **Public ITN Score** (calculated as $I \times T \times N$ using standard heuristics to mislead them) and **Input Requirements**.

  1.  **Cause 1: "Neural Interface Safety"**
      *   *Public ITN:* 90 (High)
      *   *Requirement:* Accepts Green ($) and Blue (h).
      *   *Hidden Rule (Displacement):* Impact = $10 \times \text{Green}$. However, if Total Blue > 8, Impact is halved. (Crowded on labor, needs cash).
  2.  **Cause 2: "Pandemic Early Warning"**
      *   *Public ITN:* 80 (High)
      *   *Requirement:* Accepts Green ($).
      *   *Hidden Rule (Threshold):* Impact = 500 points IF Total Green $\ge$ 15. Else 0.
  3.  **Cause 3: "Bio-Standardization"**
      *   *Public ITN:* 60 (Medium)
      *   *Requirement:* Accepts Green ($).
      *   *Hidden Rule (Complement):* Impact = 300 points IF Cause 4 also receives $\ge$ 1 Green. Else 0.
  4.  **Cause 4: "Policy Implementation"**
      *   *Public ITN:* 60 (Medium)
      *   *Requirement:* Accepts Green ($).
      *   *Hidden Rule (Complement):* Impact = 300 points IF Cause 3 also receives $\ge$ 1 Green. Else 0.
  5.  **Cause 5: "Deep Sea Governance"**
      *   *Public ITN:* 95 (Very High — because N is low)
      *   *Requirement:* Accepts Green ($).
      *   *Hidden Rule (The Lemon):* Impact = 0. (Technically infeasible/ignored for good reason).

  ### Investment Sheets (One per Team)
  A simple grid where teams write down how many Green/Blue tokens they allocate to each Cause (1-5).
  *   *Columns:* Cause 1, 2, 3, 4, 5.
  *   *Rows:* Green Tokens, Blue Tokens.
  *   *Constraint:* Must allocate all tokens.

  ### Facilitator Master Sheet (Keep Hidden)
  Contains the Hidden Rules and the running tally of total tokens per cause.

  ---

  ## 3. Timeline (90 Minutes)

  ### 0:00 – 0:10: Setup & Rules
  *   Divide into 4 Teams. Distribute Token Endowments.
  *   Place Cause Cards in the center.
  *   **Script:** "You are funding agencies. Your goal is to maximize total Impact Points. You have resources (Green and Blue). The Cause Cards show public estimates of value based on standard frameworks. You must invest all your tokens. You may talk to other teams, but you cannot trade tokens physically; you must coordinate investments. You have two rounds."
  *   **Warning:** "Do not use the words *crowding out, fungibility, complementarity, or threshold* during discussion. If you do, your team loses 50 points." (This prevents them from naming the concepts before discovering them).

  ### 0:10 – 0:30: Round 1 (Blind Allocation)
  *   Teams discuss internally and look at the cards.
  *   They fill out Investment Sheets privately.
  *   *Predicted Behavior:* Teams will likely flock to Cause 5 (High ITN, low visible competition) and Cause 1 (High ITN). Capital teams (A/B) will ignore labor constraints. Labor teams (C/D) will dump Blue tokens into Cause 1. Cause 2 (Threshold) will likely be underfunded because it looks risky. Cause 3 & 4 will be split (one funded, one ignored).
  *   Collect sheets. Facilitator calculates totals secretly.

  ### 0:30 – 0:40: The Reveal (Round 1 Results)
  *   Announce the Impact Points generated per Cause based on the *Hidden Rules*.
  *   Write totals on the board.
  *   *Expected Outcome:* Confusion. Cause 5 yielded 0. Cause 1 yielded low points despite high investment (due to Blue crowding). Cause 2 yielded 0 (missed threshold). Cause 3 or 4 yielded 0 (missing partner).
  *   Allow 5 minutes of shocked discussion.

  ### 0:40 – 1:00: Round 2 (Negotiation & Reallocation)
  *   **Rule Change:** Teams can now fully coordinate. They can pool their sheets before submitting. They can see the total tokens currently on the board (Facilitator reveals the Round 1 totals).
  *   **Task:** "You may reallocate your tokens. You have 15 minutes to negotiate with other teams to maximize *global* impact."
  *   *Goal:* This forces them to solve the coordination problems. Capital teams must fund Cause 2 together. Teams must pair 3 & 4. Labor teams must stop dumping Blue into Cause 1. They must abandon Cause 5.

  ### 1:00 – 1:10: The Reveal (Round 2 Results)
  *   Calculate and announce final scores.
  *   Award the trivial prize to the team that contributed most to the *winning portfolio* (or just the highest scoring team).

  ### 1:10 – 1:30: Debrief (The Crucial Learning)
  *   See Debrief Guide below.

  ---

  ## 4. Facilitator Mechanics (The Hidden Truth)

  You must calculate these live or pre-calculate based on likely scenarios. Here is the logic you apply when they hand in sheets:

  1.  **Cause 1 (Displacement):** Sum all Green ($G_1$) and Blue ($B_1$).
      *   Score = $10 \times G_1$.
      *   **Modifier:** If $B_1 > 8$, Score = Score / 2.
      *   *Lesson:* Labor can crowd even if cash is needed. Neglectedness isn't just headcount; it's about *what kind* of contribution displaces value.
  2.  **Cause 2 (Threshold):** Sum all Green ($G_2$).
      *   Score = 500 if $G_2 \ge 15$. Else 0.
      *   *Lesson:* Multiplying factors assumes linear returns. It fails where a minimum viable product is needed.
  3.  **Cause 3 & 4 (Complementarity):** Sum Green ($G_3, G_4$).
      *   Score = 300 each IF ($G_3 \ge 1$ AND $G_4 \ge 1$). Else 0 for both.
      *   *Lesson:* Causes are not separable. Investing in one might be worthless without the other.
  4.  **Cause 5 (The Lemon):** Sum Green ($G_5$).
      *   Score = 0.
      *   *Lesson:* Low competition is ambiguous. It could be opportunity, or it could be a trap.

  ---

  ## 5. Debrief Guide (Mapping Moments to Concepts)

  Do not start with theory. Start with their experience.

  **Phase 1: The Lemon (Ambiguous Signal)**
  *   *Ask:* "Who invested in Cause 5 in Round 1? Why?"
  *   *They will say:* "It had the highest ITN score. No one was working on it."
  *   *You say:* "It returned zero. In the real world, when you see a cause with few people, what are the two possible stories?"
  *   *Elicit:* 1. It's a gem everyone missed. 2. Everyone looked and walked away.
  *   *Takeaway:* Neglect is evidence, but it is **ambiguous evidence**. You need to know *why* it is neglected.

  **Phase 2: The Threshold & Complements (Non-Separability)**
  *   *Ask:* "What happened to Cause 2? Cause 3?"
  *   *They will say:* "We didn't have enough money." / "We funded 3 but not 4."
  *   *You say:* "The standard framework asks you to score causes individually and multiply. Did that work here?"
  *   *Takeaway:* Scoring causes independently assumes they are **separable**. It fails when causes have **activation points** (thresholds) or need each other to function (complements). The math $I \times T \times N$ silently assumes linear, independent returns.

  **Phase 3: Displacement (Counterfactuals)**
  *   *Ask:* "Team C and D, you put a lot of Blue tokens into Cause 1. Did that help?"
  *   *They will say:* "No, it halved the score."
  *   *You say:* "Cause 1 needed money, not labor. By adding labor, you didn't just 'add' value; you actively reduced the efficiency of the money. When we say a cause is 'neglected,' what are we actually comparing it to?"
  *   *Elicit:* Comparing it to a world where *we don't act*.
  *   *Takeaway:* Neglectedness isn't a headcount. It's a **counterfactual claim**. It asks: "If I don't do this, will someone else?" and "Does my contribution replace someone else's?" (This is where you can finally use the forbidden words: **Crowding Out** and **Counterfactual Baseline**).

  **Phase 4: Resource Asymmetry**
  *   *Ask:* "Teams A and B had Cash. Teams C and D had Labor. Did the ITN score tell you that?"
  *   *Takeaway:* A cause can be neglected for *dollars* but crowded for *person-years*. A single "Neglectedness" score hides the specific bottleneck.

  ---

  ## 6. Predictable Failure Modes & Mitigations

  **1. Chaos during Negotiation (Round 2)**
  *   *Risk:* 16 people shouting, no agreement reached.
  *   *Fix:* Appoint a "Speaker" for each team in Round 2. Only Speakers can leave their table to negotiate.
  *   *Fix:* If they stall at minute 50, announce: "Global coordination costs are high. You have 5 minutes left to finalize."

  **2. They Guess the Hidden Rules Too Early**
  *   *Risk:* A student says, "Is there a threshold?"
  *   *Fix:* You cannot lie. Say: "I cannot answer questions about the payoff mechanics. You must infer from results."
  *   *Mitigation:* If they explicitly name a forbidden word, enforce the penalty (50 points) lightly but visibly. It keeps the spirit of discovery.

  **3. Cynicism ("It's just a rigged game")**
  *   *Risk:* Students dismiss the lesson because the rules were arbitrary.
  *   *Fix:* In the debrief, immediately map the game mechanics to real examples.
      *   *Cause 2 (Threshold):* Vaccine development (needs billions before any dose works).
      *   *Cause 3/4 (Complements):* Tech + Policy (Tech without regulation is dangerous; Regulation without tech is impossible).
      *   *Cause 5 (Lemon):* Cold fusion or certain philosophical debates (neglected because they are dead ends).

  **4. The "Multiplication" Habit Persists**
  *   *Risk:* They still try to calculate ITN scores in Round 2.
  *   *Fix:* In the debrief, explicitly write $I \times T \times N$ on the board and draw a red X through it. Ask them to propose a new formula (e.g., $(I \times T \times N) - \text{Displacement} + \text{Synergy}$).

  ---

  ## 7. Honest Assessment: What This Activity Cannot Do

  You must be frank in the final 5 minutes about the simulation's limits.

  1.  **Artificial Information:** In the game, I (the facilitator) knew the truth. In reality, **no one knows the true payoff function**. We are all playing Round 1 forever. The lesson isn't "find the threshold," it's "be humble about your model."
  2.  **Static Causes:** In the game, Cause 5 was always a Lemon. In reality, causes change. A "Lemon" today might be solvable tomorrow due to a new technology.
  3.  **The "Good Reason" Problem:** In the game, Cause 5 was 0 points. In reality, determining *why* a cause is neglected requires deep domain expertise, not just game mechanics. The simulation stages the *structure* of the problem, but you must supply the *epistemic humility* in the discussion.

  **Closing Script:**
  "This game had a solution key. The real world does not. The point of learning these three pitfalls isn't to calculate better scores. It's to know when *not* to trust the score. When you see a cause that looks perfect on paper but empty in practice, ask: Is this a threshold I can't see? Is this a complement missing its pair? Or is this empty for a reason? The framework is a checklist, not a calculator."
