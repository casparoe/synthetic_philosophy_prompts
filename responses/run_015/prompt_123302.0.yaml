  2.  **Deconstruct the Philosophical Positions:**
      *   **Strict Evidentialist (SE):** Belief is constitutively aimed at truth. Only evidence counts as a reason for belief. Pragmatic reasons (benefits of believing) are the "wrong kind." If you believe for pragmatic reasons, you aren't truly believing, or you are irrational.
      *   **Pragmatic Pluralist (PP):** Reasons for belief can be diverse. Sometimes pragmatic reasons *are* the right kind, or at least permissible. The distinction between belief and other attitudes (hope, acceptance) might be blurrier, or pragmatic factors can legitimately influence the doxastic state without destroying its nature.
      *   **Wrong-Kind-Reasons (WKR) Problem:** The puzzle of why reasons that count in favor of *having* a belief (e.g., a demon will reward you $1M if you believe the moon is cheese) don't seem to count as reasons *for the truth* of the content.

  3.  **Drafting Section 1: Numbered Agreed-Claims:**
      *   Need common ground. Both agree belief is distinct from hope/wish. Both agree practical stakes matter *somehow* (even if just in action, not belief formation). Both agree on where the WKR problem bites (the disconnect between value of believing and truth of content).
      *   *Drafting Claim 1 (Nature of Belief):* Belief differs from hope/commitment. Belief purports to represent reality.
      *   *Drafting Claim 2 (Stakes):* Practical stakes affect what we *do* with beliefs, but do they affect the *justification*? Both agree stakes exist, disagree on impact. Let's say they agree stakes raise the *cost of error*, even if they disagree on whether that changes the reason status.
      *   *Drafting Claim 3 (WKR Grip):* The problem arises because pragmatic benefits (happiness, reward) don't make the proposition more likely to be true.

  4.  **Drafting Section 2: Disagreements Table:**
      *   Needs neutral phrasing.
      *   *Issue:* Constitutive Aim.
      *   *SE Phrasing:* Belief is constitutively regulated by truth; pragmatic reasons are categorically excluded.
      *   *PP Phrasing:* Belief is a functional state where pragmatic reasons can play a regulatory role alongside evidence.
      *   *Issue:* Normative Force.
      *   *SE:* Pragmatic reasons provide reasons to *cause* belief, not reasons *for* belief.
      *   *PP:* Pragmatic reasons can be direct reasons for belief.

  5.  **Drafting Section 3: The Cruxes:**
      *   *Crux 1: Evidence-Responsiveness under Pragmatic Sustenance.*
          *   *Question:* Can a belief sustained by pragmatic benefits remain sensitive to evidence?
          *   *Case:* The "Decent Mentor" case. A professor believes they are decent partly because believing it makes them show up.
          *   *SE Prediction:* This belief will become insulated from counter-evidence (e.g., student complaints). It becomes self-deception.
          *   *PP Prediction:* The belief can remain evidence-responsive; the pragmatic benefit acts as a tie-breaker or baseline sustainer, not a blindfold.
      *   *Crux 2: Mediating Attitude vs. Corruption.*
          *   *Question:* Can we offload pragmatic work to a "Practical Commitment" attitude, or is that just renaming belief?
          *   *Case:* Same Mentor case. Should the professor have "Evidence-based Belief" (I am decent based on reviews) + "Practical Commitment" (I will act as if I am to make it true)?
