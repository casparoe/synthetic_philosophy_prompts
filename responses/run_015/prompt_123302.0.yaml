answer: |-
  # JOINT STATEMENT ON THE WRONG-KIND-REASONS PROBLEM
  **Signatories:** The Strict Evidentialist (SE) & The Pragmatic Pluralist (PP)
  **Date:** October 26, 2023
  **Subject:** Findings from Adversarial Collaboration on Doxastic Norms

  Following a structured adversarial collaboration regarding the "Wrong-Kind-Reasons" (WKR) problem, we submit the following statement. While we remain divided on the normative architecture of belief, we have successfully isolated the locus of our disagreement and identified empirical and conceptual cruxes for future inquiry.

  ### I. AGREED CLAIMS

  1.  **Belief vs. Non-Doxastic Attitudes:** We agree that "belief" is distinct from "hope," "wish," or "fantasy." To believe that *p* involves a commitment to *p* being the case, whereas to hope that *p* allows for the possibility that *p* is false. We further agree that a distinct attitude of "Practical Commitment" or "Acceptance-for-Action" is conceptually available, wherein an agent acts *as if p* is true without necessarily holding a full doxastic belief that *p*.
  2.  **The Role of Practical Stakes:** We agree that practical stakes (the cost of being wrong) legitimately govern *action* and *inquiry*. High stakes justify gathering more evidence before acting or asserting. We disagree only on whether stakes can legitimately lower the evidential threshold required to *form* or *maintain* the belief state itself.
  3.  **The Grip of the WKR Problem:** We agree that the WKR problem arises from a structural gap: pragmatic considerations (e.g., a reward for believing, or the psychological benefit of a belief) make the *state of believing* attractive without making the *content of the belief* more likely to be true. We agree that any viable theory must explain why a demon's threat ("Believe the moon is cheese or I will kill you") feels intuitively different from evidence ("Here is a rock from the moon").

  ### II. DISAGREEMENTS TABLE

  | Domain of Dispute | Strict Evidentialist (SE) Position | Pragmatic Pluralist (PP) Position | Neutral Description of Split |
  | :--- | :--- | :--- | :--- |
  | **Constitutive Aim** | Belief is constitutively aimed at truth. Any influence not tracking truth-correspondence corrupts the attitude into something else (e.g., self-deception). | Belief is a functional state aimed at navigating the world. Truth is a primary constraint, but pragmatic utility is a permissible secondary regulator. | **The Screening Question:** Does the nature of belief *automatically* screen out pragmatic considerations, or can pragmatic considerations be integrated without destroying the attitude? |
  | **Normative Force** | Pragmatic reasons are reasons to *cause* oneself to believe, but never reasons *for* believing. They apply to the agent, not the belief. | Pragmatic reasons can be direct reasons *for* believing. The distinction between reasons for the agent and reasons for the state is untenable in practice. | **The Direction Question:** Do pragmatic reasons justify the *formation* of the belief directly, or only the *management* of the cognitive systems that produce belief? |
  | **Rationality** | It is inherently irrational to hold a belief primarily because it is beneficial. | It can be rational to hold a belief because it is beneficial, provided it does not blatantly contradict available evidence. | **The Permission Question:** Is pragmatic sustenance of belief a violation of rationality, or a distinct species of rationality? |

  ### III. THE CRUXES

  We have identified two specific points where our theoretical divergence yields different predictions about concrete cases. Resolution of these cruxes would significantly shift the burden of proof.

  #### Crux 1: Evidence-Responsiveness Under Pragmatic Sustenance
  **The Question:** Can a belief that is partly sustained by pragmatic benefits remain sufficiently responsive to counter-evidence to qualify as a genuine belief?

  **The Case: The Decent Mentor**
  A university professor faces evidence that their mentorship style is overly critical (e.g., student surveys, colleague feedback). However, the professor also recognizes that believing "I am a decent mentor" is causally necessary for them to maintain the confidence required to show up for students. If they believe they are inadequate, they will withdraw. Thus, they maintain the belief partly because of the pragmatic benefit (student access).

  **Predictions:**
  *   **SE Prediction:** The belief will become insulated. Because the pragmatic benefit (showing up) relies on the belief remaining stable, the professor will subconsciously discount negative feedback. The belief will cease to be evidence-responsive and degrade into self-deception. The professor is not truly believing they are decent; they are inducing a state of confidence.
  *   **PP Prediction:** The belief can remain evidence-responsive. The pragmatic benefit acts as a "tie-breaker" or a "sustainer" in ambiguous cases, not a blindfold. The professor can acknowledge the criticism ("I am too critical") while maintaining the core belief ("I am decent overall") because the pragmatic stakes justify weighting positive evidence more heavily. The belief remains a genuine belief because it is still revisable in the face of overwhelming evidence (e.g., if a student formally reports abuse).

  #### Crux 2: The Mediating Attitude vs. Corruption
  **The Question:** Can the work of pragmatic reasons be offloaded to a mediating attitude (Practical Commitment) without losing the benefits of belief, or is this distinction artificial?

  **The Case: The Decent Mentor (Revisited)**
  The same professor is advised to adopt a split attitude: hold an *Evidence-Based Belief* ("My reviews are mixed") and a separate *Practical Commitment* ("I will act as if I am a decent mentor to ensure I show up").

  **Predictions:**
  *   **SE Prediction:** This split is necessary and healthy. It preserves the integrity of the belief state (which tracks truth) while allowing the agent to pursue pragmatic goals through action. The professor avoids irrationality by not claiming the pragmatic benefit justifies the *truth* of the belief.
  *   **PP Prediction:** This split is psychologically artificial and efficaciousness-reducing. Students and colleagues respond to *belief*, not to "commitment-to-act-as-if." If the professor does not truly believe they are decent, their hesitation will undermine the very pragmatic benefit they seek. The "Practical Commitment" is just a euphemism for belief; forcing the split corrupts the agent's integrity by fracturing their cognitive stance.

  ### IV. NOTE ON VERBAL VS. SUBSTANTIVE DISPUTE

  We acknowledge that a portion of our disagreement is **verbal**. The SE tends to define "belief" narrowly, reserving the term only for states regulated exclusively by truth-indicators. The PP defines "belief" broadly, as a functional cognitive state that serves both truth and utility.

  However, we agree the dispute is not *merely* verbal. It is **substantive** regarding normative guidance.
  *   If the SE is correct, agents who allow pragmatic factors to influence belief formation are making a category error and risking epistemic corruption.
  *   If the PP is correct, agents who rigidly exclude pragmatic factors are failing to utilize available rational resources and may suffer practical paralysis.

  Our collaboration concludes that the decisive factor is not the definition of belief, but the **stability of evidence-responsiveness** in hybrid cases (Crux 1). Future work should focus on empirical investigation into whether pragmatically sustained beliefs actually exhibit the insulation from counter-evidence that the SE predicts.

  ***

  **Signed,**

  *The Strict Evidentialist*
  *The Pragmatic Pluralist*
