      *Discriminating Variant:* A proposal to increase TFP *only* in safety-relevant sectors (e.g. surveillance for bio, compute for alignment). If funded, Rule 2 is "Narrow the Gap." If rejected, Rule 2 is "Slow Down Period." (Though V1 suggests "Narrow the Gap" is the real rule).
