      *Final Polish for Character:* Ensure I don't sound *too* modern analytic (like "ontology of value" is fine, but keep the rhetoric slightly classical). The draft looks balanced.

      *Wait, one nuance:* The opponent says "survival across generations tracks transmissibility almost perfectly." I need to hit harder on the difference between *survival* and *admiration*. A meme survives; a masterpiece is admired. If people just copy it without admiring it, it's not aesthetic merit. I should make that distinction clearer.

