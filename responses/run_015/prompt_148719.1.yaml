          *   *Org Requirement:* The org must value the "written account of the situation" over the "ship/no-ship binary."

  5.  **Drafting the Closing Verdict on Residue:**
      *   *Question:* Is the vocabulary defective, or is Dewey indeterminate?
      *   *Argument:* The vocabulary is optimized for *control* and *prediction* (Lippmannian). Dewey is optimized for *adaptation* and *constitution*.
      *   *Side:* The vocabulary is defective for Deweyan purposes because it encodes a specific epistemology (fixed parameters) that Dewey rejects. It's not that Dewey is vague; it's that the tech vocabulary is too rigid.
      *   *Test:* Look at how "success" is defined. If success is "metric move," it's Lippmann. If success is "situation resolved," it's Dewey.

  6.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I slip into Bayesian language? *Correction:* Ensure I talk about "resolution of situations" not "updating priors."
      *   *Check:* Did I drop the politics? *Correction:* Ensure the "guardrail ownership" point is highlighted as the political locus.
