answer: |-
  ### Deweyan Experimentalism in Platform Vocabulary

  To restate Dewey's position in your operational vocabulary: Inquiry is not the execution of a pre-registered test against a fixed null hypothesis. It is a procedure for transforming an indeterminate production situation into a resolved one. The "hypothesis" is not a static prediction to be falsified, but an *end-in-view*: a provisional target metric that guides the intervention but is itself subject to revision as the data reveals the actual structure of the problem.

  In this frame, statistical power and horizon are not fixed constraints determined at launch. They are resources allocated to sustain the inquiry until the situation resolves. If the primary metric fails to capture the consequence of the change because the change altered the nature of the user interaction, the metric must be reconstructed, not held fixed to preserve type I error rates. The "truth" of the experiment is not the p-value, but the successful stabilization of the user environment.

  Politically, the "Public" is the set of units (users, sellers, third parties) affected by the indirect consequences (interference/spillover) of the transaction between the platform and the treatment group, who did not consent to the treatment. Guardrail metrics are the technical mechanism for detecting harm to this Public, but they are insufficient because they are defined by the platform, not the Public. Democracy is not the governance workflow (RFCs, approval chains) that decides who may ship. Democracy is the quality of the association between the platform and the Public: the extent to which the Public can organize around the measured spillover to demand a redefinition of the guardrails. Expertise (your team's causal inference capability) cannot substitute for this organization; it can only illuminate the consequences. The decision to ship or rollback is not a binary gate based on significance, but a judgment on whether the new state of the system supports continued associated living.

  ***

  ### Residue Report

  **One: Clean Translations**
  The mapping is structurally soundest where your vocabulary already acknowledges system complexity.
  *   **Interference and Spillover:** This maps cleanly to Dewey's "indirect consequences." When a seller's pricing algorithm affects a buyer's search results in a different cluster, that is the material basis of the Public. You can measure this via cluster-randomized designs or switchbacks. The ontology matches: transactions have externalities.
  *   **Guardrails as Constraints:** Your guardrail metrics function as Dewey's "moral constraints" on inquiry. They acknowledge that maximizing the primary metric (e.g., GMV) is illegitimate if it degrades the system state (e.g., trust, latency).
  *   **Reversibility:** The capacity for rollback maps to the instrumental nature of truth. If an intervention creates an indeterminate situation (instability, unforeseen breakage), the inquiry is not failed; it is incomplete. Rollback is the restoration of the conditions necessary for further inquiry.

  **Two: Distorted Translations**
  The mapping bends where agency and recognition are required but your system enforces passivity.
  *   **The Public vs. The Affected Cohort:** You can identify the "affected cohort" via causal measurement of spillover. However, in Dewey's politics, a Public *constitutes itself* by recognizing those consequences as a shared problem and organizing to address them. In your system, the affected cohort is a statistical segment defined by *you*. They do not know they are a cohort. They do not vote on the guardrails. They are objects of measurement, not subjects of governance.
  *   **The Distortion:** This bends the political claim into a technical one. You treat the protection of the Public as an optimization problem (minimize negative spillover subject to primary metric growth) rather than a constitutive problem (who gets to decide what counts as negative?). The difference rides on *legitimacy*. A statistically safe harm is still a political harm if the affected party had no voice in defining the guardrail.

  **Three: Untranslatables**
  These concepts have no expression in your current vocabulary because they contradict the assumptions required for your power calculations and governance.
  *   **Reconstruction of Ends:** Your system punishes changing the primary metric mid-experiment (p-hacking, data dredging). Dewey requires it. If the intervention changes the user behavior such that the original metric is now irrelevant (e.g., you optimized for clicks, but the feature changed users to voice search), sticking to the original metric is dogmatic, not rigorous. Your vocabulary has no slot for "valid metric pivot."
  *   **Democracy as Associated Living:** You have governance (who may ship), but not democracy (how we live together). Your vocabulary treats the decision as a terminal event (ship/no-ship). Dewey treats the decision as a phase in continuous association. There is no metric for the "quality of association" between marketplace participants.
  *   **Non-Stationarity:** Your power calculations assume a stationary distribution over the horizon. Dewey's "situation" is historical and evolving. The act of measuring changes the situation (reflexivity), and the situation changes over time (drift). Your vocabulary treats drift as noise to be controlled; Dewey treats it as the substance of the inquiry.

  **Four: Verdict on the Live Case**
  *Case:* Open-ended experiment, no pre-registered metric, mutable outcomes, narrative readout.
  *Verdict:* In your current organizational context, this is **undisciplined metric-shopping with better manners.**
  *Reasoning:* Without the reconstruction of the *political* conditions, mutable metrics simply shift the bias from the null hypothesis to the analyst's narrative. For this to be Deweyan inquiry, two things must be true of your organization:
  1.  **Criteria for Resolution:** You must have a shared, pre-agreed definition of what constitutes a "resolved situation" that is distinct from "statistical significance." (e.g., "User friction is explained," not "p < 0.05").
  2.  **Public Representation:** The "written account" must be subject to challenge by representatives of the affected cohorts (e.g., customer trust, seller advocacy), not just product leadership.
  *Requirement:* For this to be inquiry, the governance must shift from validating the *method* (pre-registration) to validating the *resolution* (does this narrative account for the indirect consequences satisfactorily?). If the team can change the metric without accounting for why the old metric failed to capture the public consequence, it is p-hacking.

  ***

  ### Closing Verdict on the Residue

  The failure to translate is a **defect of your vocabulary**, not a sign that Dewey's claims are indeterminate.

  Your vocabulary is engineered for **control and prediction** (a Lippmannian expertise model). It assumes the world is stable enough to be powered, the metrics are stable enough to be pre-registered, and the users are passive enough to be clustered. Dewey's claims are determinate, but they describe a world of **adaptation and constitution**.

  *   **Falling on the Vocabulary Side:** The inability to express "reconstruction of ends" is a defect. Your system conflates *rigor* with *fixedness*. You can build a vocabulary that allows for metric evolution without inviting p-hacking (e.g., by requiring a causal account of why the metric shifted), but you currently lack those terms.
  *   **Falling on Dewey's Side:** The "quality of associated living" is genuinely hard to operationalize in a marketplace where transactions are arm's-length. However, the residue here is not indeterminacy; it is a demand for a different kind of data (qualitative, political, organizational) that your platform is not built to ingest.

  **How to tell the difference:** Look at the rollback decision. If you rollback because a guardrail triggered, your vocabulary is sufficient. If you rollback because the *relationship* between buyers and sellers degraded in a way no metric caught, but you cannot log that reason in your experiment tracker, then the vocabulary is defective. It forces you to lie about why you stopped the experiment. That lie is the residue of Dewey's position pressing against the limits of your instrumentation.
