      *   **Constraints:** No citations, no reading suggestions, no literature survey. Be faithful, not accommodating.

  2.  **Deconstruct Dewey's Position (Mental Sandbox):**
      *   *Epistemology:* Inquiry isn't just testing a fixed hypothesis against reality. It's transforming an indeterminate situation into a determinate one. "Ends-in-view" are not fixed goals but tools that evolve during the process. Knowledge is instrumental.
      *   *Politics:* Democracy isn't just voting or institutions; it's a mode of "associated living." A "Public" arises when people are affected by indirect consequences of transactions they aren't part of. Expertise (Lippmann's view) isn't enough; the public must recognize itself and organize.
      *   *Key Tension:* Fixed parameters vs. Evolving understanding. Individual units vs. Constituted groups.

  3.  **Drafting the Restatement (Dewey in Tech/Experimentation Vocabulary):**
      *   *Challenge:* How to map "inquiry" to "experimentation" without making it sound like standard A/B testing?
      *   *Mapping:*
          *   "Indeterminate situation" -> Production incident or ambiguous user behavior signal that breaks existing mental models.
          *   "Hypothesis" -> Not a fixed null/alt, but a provisional "ends-in-view" (metric target).
          *   "Experiment" -> The intervention itself, but the *design* must allow for metric redefinition.
          *   "Guardrails" -> Not just static constraints, but dynamic checks on indirect consequences (spillover).
          *   "Public" -> The set of users affected by spillover/interference who didn't consent to the treatment.
          *   "Democracy" -> The governance process of who gets to define the guardrails and metrics.
      *   *Crucial Nuance:* Standard A/B testing assumes fixed metrics (frequentist/Bayesian). Dewey requires the *metric itself* to be subject to change based on what the data reveals about the situation.
      *   *Politics:* The platform governance isn't just traffic control; it's the constitution of the "public" via guardrail definition.

  4.  **Developing the Residue Report:**

      *   **Part One (Clean Translations):**
          *   *Interference/Spillover:* Maps well to Dewey's "indirect consequences." If Unit A affects Unit B, that's the material basis of the Public.
          *   *Guardrails:* Maps to the protection of the public from negative externalities.
          *   *Reversibility/Rollback:* Maps to the instrumental nature of truth. If it breaks the situation, undo it.

      *   **Part Two (Distorted Translations):**
          *   *The Public:* In Dewey, the public *constitutes* itself through recognition. In tech, we identify "affected cohorts" via data (causal inference), but they remain passive subjects. They don't organize.
          *   *Stakes:* The difference is agency. Data identifies victims; Dewey requires them to become agents.
          *   *Bending:* We turn a political formation into a statistical segment.

      *   **Part Three (Untranslatables):**
          *   *Reconstruction of Ends:* We pick a primary metric *ex-ante*. Dewey says the goal evolves *in-duct*. Our system punishes moving the goalpost (p-hacking fear).
          *   *Democracy as Associated Living:* We treat governance as a permissioning workflow (Jira tickets, RFCs). Dewey sees it as the quality of interaction.
          *   *Non-stationarity:* We assume stable distributions for power calcs. Dewey sees the situation as historical and changing fundamentally.

      *   **Part Four (Verdict on Open-Ended Experiment):**
