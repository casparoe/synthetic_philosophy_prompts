      *   **Riley's Position:** Jordan's scenario is just "parallel bargaining with a middleman" (indirect causation), not true acausal trade. True acausal trade requires logical correlation between decision procedures. Orthogonal values break the counterfactual link ("they help me" $\nleftrightarrow$ "I help them"). Rationality symmetry isn't enough without common knowledge of decision theory and some preference symmetry/value overlap.
