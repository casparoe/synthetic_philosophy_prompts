  8.  **Refining the "Mediator" point:**
      *   If the mediator is a mathematical truth (e.g., "Is 317 prime?"), and they both compute it to randomize or coordinate, that's acausal.
      *   If the mediator is a "resource" or "abstract computation they influence," it sounds like a shared variable. If $A \to M \leftarrow B$, that's a collider. Conditioning on a collider creates correlation, but acting on it is causal.
      *   Jordan says "correlation runs through the mediator." This implies $A \to M \leftarrow B$ or $A \leftarrow M \to B$.
      *   If $A \leftarrow M \to B$ (Common Cause), it's not acausal trade, it's correlation by design.
