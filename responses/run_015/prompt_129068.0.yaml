answer: |-
  Good morning. Welcome, everyone.

  I want to start by confessing that I almost didn't sleep last night. Not because of the preparation, but because of a conversation I had with a close friend. We got into a heated argument about the very premise of this workshop. On one side, my friend argued that talking about "national character"—whether French, Japanese, or American—is inherently harmful. It is, they said, essentialism with academic makeup. It reduces individuals to caricatures and historically serves as a gateway to exclusion.

  On the other side, I found myself arguing that we might be throwing out a descriptive tool because of how it has been misused. I suggested that perhaps we can talk about cultural clustering without claiming it's in the blood, if we are careful about the reference class problem.

  I tell you this because that argument is the reason we are all in this room. It is the tension humming between the two halves of this audience. On my left, I see philosophers who are rightly vigilant against moral essentialism. You know that concepts have consequences, and "national character" has a bloody history. On my right, I see social scientists who study cross-cultural patterns. You see data that shows variance across borders—trust levels, risk aversion, social cohesion—and you know that ignoring these clusters makes your models blind.

  So, the question I want to hang over us for the next two days is not "Who is right?" but rather: *Is national character a kind of concept that can be true without being biologically essentialist?*

  Can a statement about a people be coherent without being deterministic?

  I want to propose a spine for our discussions that might keep both sides in the room. It is the idea that what we often call "character" might actually be *institutional path dependence.*

  Think of it this way: Institutions create incentives. Incentives create habits. Over time, those habits solidify into feedback loops. If a society rewards low-context communication, people learn to speak directly. If a society rewards high-context consensus, people learn to read the air. These aren't genetic traits. They are dispositional clusters. They are predictive at the group level, not because every member possesses them, but because the social gravity pulls behavior toward a mean.

  For the social scientists here, this validates your data. There *are* patterns. The clustering is real. But for the philosophers, this changes the ontology. It moves the locus from "who they are" to "where they are standing." It suggests that if you change the institutional path, the "character" shifts. That is not essentialism; that is history.

  However—and here is where I refuse to resolve the fight for you—we have to be careful. Does describing these feedback loops still reify the group? Does talking about "dispositional clusters" still invite the same old stereotypes, even if we claim the mechanism is institutional rather than biological? When does a statistical prediction become a moral cage?

  I don't have the answer. If I did, we wouldn't need the panels.

  My hope is that we don't retreat to our corners. I don't want the philosophers to simply police the language until no empirical claim can be made. And I don't want the social scientists to dismiss the normative risks as "just politics."

  We need to find out if there is a vocabulary that allows us to acknowledge the weight of culture without crushing the individual. We need to see if we can hold the idea of national character up to the light and see if it shatters, or if it holds together as a legitimate, non-essentialist category.

  The fight my friend and I had last night is now yours. I leave it unresolved intentionally. Let's see if the next forty-eight hours can turn that argument into insight.

  Thank you, and let's begin.
