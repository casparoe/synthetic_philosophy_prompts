  Here is a structured analysis of your colleague's likely verdict, derived from the epistemic principles implicit in her previous seven rulings.

  ### Candidate Principles

  To anticipate her ruling on Case 8, we must first distil the normative and descriptive commitments she has demonstrated in Cases 1 through 7. Three principles emerge that fit her prior verdicts equally well.

  **1. The Qualitative Gap Principle (The CK Threshold)**
  *Derived from Cases 1, 2, 6, and 7.*
  Common Knowledge (CK) is not the limit of a sequence of mutual knowledge (MK) levels; it is a distinct, qualitative state. A hierarchy of depth $k$, no matter how large, does not approximate CK for the purposes of strategic coordination or induction if the task requires CK. Consequently, equilibria that rely on CK (such as the coordinated attack in Case 1 or the full backward-induction path in Case 2) are not compelled if the hierarchy is finite. However, this principle does not necessarily imply that *no* reasoning is possible without CK, only that the *full* CK-dependent solution is blocked.

  **2. The Epistemic Sufficiency Principle (Local Validity)**
  *Derived from Cases 2, 3, and 7.*
  Backward induction (BI) is not a global property of the game structure but a local property of the epistemic state. BI proceeds only as far as the hierarchy of knowledge permits. In Case 3 (the 2% type), cooperation holds until the epistemic conditions for defection (certainty of the other's rationality) are met near the end. In Case 7 (Muddy Children), the induction collapses entirely because the *base* of the induction (the announcement) fails to achieve the necessary first-order mutual knowledge in all states. Thus, reasoning is valid at level $n$ if and only if mutual knowledge of rationality exists to depth $n$.

  **3. The Rationality Default Principle**
  *Derived from Cases 4 and 5.*
  In the absence of Common Knowledge of Rationality (CKR), the backward-induction outcome is not a prediction of behaviour but a *reductio* of the epistemic assumptions. Without CKR, 'rationality' does not dictate a unique strategy (defection) in the early stages. Therefore, where the epistemic chain breaks, the model should not predict the BI outcome (defection); it should either predict cooperation (as a sustainable equilibrium under uncertainty) or declare the outcome indeterminate.

