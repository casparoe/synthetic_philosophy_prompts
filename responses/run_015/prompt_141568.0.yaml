  *Based on:* The Epistemic Sufficiency Principle (Case 3) combined with the Qualitative Gap.
  *Reasoning:* Backward induction is a recursive process. To solve Round 60, one needs MKR depth 1. To solve Round 59, depth 2. To solve Round $k$ (counting from the start), one needs MKR depth $61-k$. With MKR capped at 40, the logic of defection can propagate back 40 steps from the end (Rounds 60 down to 21). At Round 20, the required depth would be 41, which does not exist. Therefore, the compulsion to defect stops at Round 21. Rounds 1–20 are epistemically underdetermined; following Case 3 and 4, cooperation is the plausible outcome there.
  *Consistency Check:* **High.** This respects the 'hard wall' of the knowledge chain (Case 7) while acknowledging that valid reasoning can occur where knowledge exists (Case 3). It treats the gap between depth 40 and 41 as qualitative (Case 1), creating a sharp break in behaviour.

