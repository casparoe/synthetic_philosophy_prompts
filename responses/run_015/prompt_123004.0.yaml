prompt: |-
  I was arguing with a friend about Adam Smith and colonies last week and we kept going in circles about whether he actually hated empire for economic reasons or moral ones. I'm applying for a small three-month research stipend and need a two-page proposal, but my idea is half-baked. The standard take is that Smith attacks colonies because mercantilist monopoly is inefficient and "ficticious capital" gets misdirected, but I think there's a hidden tension nobody frames clearly: in Wealth of Nations he complains distant legislators can't grasp local conditions, which sounds like an information or principle-agent problem, yet in Theory of Moral Sentiments he insists sympathy weakens with geographical distance. So is his anti-colonialism fundamentally about misaligned incentives, or is it secretly about empire breaking the sympathy mechanism that makes market society moral in the first place? And does that distinction change whether he thinks colonies are wrong because they're inefficient or because they're unjust?

  Can you turn this into a proper proposal? I need the question stated precisely, why the usual economic-vs-moral readings don't settle it, and an approach that actually does something with the texts—maybe comparing his passages on colonial administration with his sympathy-distance examples, or bringing in the "ficticious capital" idea but only if it genuinely illuminates the moral-psychological side rather than being a gimmick. Give me a week-by-week plan for the three months, say what a result would actually look like, and be honest about what counts as failure—like if the texts just flat-out contradict each other with no resolution. Also assess whether this is too big for three months. Don't bother with citations or a bibliography, I'll fill those in myself. I want the framing somewhat in the weeds, not just "Smith was anti-colony and liked free trade," since that'd be useless for the grant committee. Also there's probably a typo or two in this message, I'm writing casually on my phone.
