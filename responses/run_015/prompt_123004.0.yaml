answer: |-
  **Project Title:** The Geometry of Empire: Distance, Sympathy, and Administration in the Thought of Adam Smith

  **Project Summary**
  Standard interpretations of Adam Smith's anti-colonialism bifurcate into two camps: the economic, which views empire as a mercantilist inefficiency misdirecting capital; and the moral, which views it as a violation of natural liberty. This project argues that both readings miss a structural homology between Smith's economic and moral systems. Specifically, it investigates whether Smith's critique of colonial administration in *The Wealth of Nations* (WN) relies on the same psychological mechanism as his theory of sympathy in *The Theory of Moral Sentiments* (TMS). The central hypothesis is that for Smith, "distance" is not merely a geographical fact but a systemic variable that simultaneously degrades informational fidelity in governance and attenuates moral sentiment in the spectator. If correct, Smith's opposition to empire is not simply that it is unprofitable (economic) or cruel (moral), but that it is structurally incapable of sustaining the proximity required for either just administration or moral judgment.

  **Research Question and Intervention**
  The primary research question is: *Does Smith's critique of colonial governance rest on a unified theory of distance that renders empire both economically inefficient and morally impossible?*

  Current scholarship often treats the "Adam Smith Problem" (the supposed tension between WN and TMS) as resolved by compartmentalization: Smith the economist calculates costs; Smith the moralist calculates justice. This project challenges that siloing. In WN, Smith argues that distant legislators cannot possess the local knowledge required for good governance (an information/principal-agent problem). In TMS, he argues that sympathy naturally decays over geographical and social distance. The intervention here is to read these not as parallel complaints, but as causal links. Does the economic misallocation of "fictitious capital" into colonial monopolies stem from the same psychological blindness that prevents the metropole from sympathizing with colonial subjects? If the market requires a moral framework to function justly, and empire breaks the mechanism of that framework (sympathy), then the economic inefficiency is a symptom of a prior moral rupture. This reframes the debate from "inefficiency vs. injustice" to "systemic viability."

  **Methodology and Textual Strategy**
  The research will proceed via comparative close reading, avoiding broad historical generalizations in favor of exegetical precision.
  1.  **Administrative Distance:** Isolate passages in WN (Book IV and V) regarding colonial administration, focusing on Smith's language regarding the ignorance of distant ministers and the behavior of colonial agents.
  2.  **Sentimental Distance:** Isolate passages in TMS (particularly Part III and IV) regarding the attenuation of sympathy and the "impartial spectator's" limitations regarding distant suffering.
  3.  **Synthesis:** Analyze the concept of "fictitious capital" not merely as financial error, but as capital detached from the moral constraints of local oversight. The project will test if Smith views the flow of capital to colonies as analogous to the flow of sentiment toward abstract national glory—both being misdirected by a failure of proximity.

  **Work Plan (12 Weeks)**
  *   **Weeks 1–3 (Mapping WN):** Close reading of WN sections on colonies, trade monopolies, and governance. Coding for language related to knowledge, oversight, and administrative failure.
  *   **Weeks 4–6 (Mapping TMS):** Close reading of TMS sections on sympathy, distance, and justice. Coding for language related to psychological attenuation and the limits of the spectator.
  *   **Weeks 7–9 (Integration):** Drafting the core argument. Attempting to bridge the texts. Does the "principal-agent" problem in WN map onto the "spectator-sufferer" problem in TMS?
  *   **Weeks 10–12 (Revision and Risk Analysis):** Refining the thesis. Explicitly articulating the limits of the findings (see below). Final polishing of the manuscript.

  **Deliverables, Scope, and Risk Assessment**
  **Deliverable:** A draft article (8,000–10,000 words) suitable for submission to a journal specializing in history of political thought or moral philosophy.

  **Feasibility:** A three-month timeline is sufficient for this specific textual analysis *provided* the scope remains exegetical. It is too short for archival research into East India Company records or a comprehensive intellectual history of the Scottish Enlightenment. The project must remain focused on the internal coherence of Smith's texts.

  **Definition of Success:** Success is not proving Smith was perfectly consistent. Success is demonstrating that the *logic* of his economic critique mirrors the *logic* of his moral psychology, even if he does not explicitly link them himself.

  **Definition of Failure:** There is a significant risk that the texts simply contradict or remain disjointed. If WN treats distance as an informational hurdle solvable by better incentives, while TMS treats distance as an insurmountable psychological barrier, the "unified theory" collapses. In this event, the project will pivot to document this fracture. A negative result—proving that Smith's economic and moral critiques of empire operate on incompatible premises—is itself a valuable contribution that challenges current attempts to harmonize his corpus. The proposal treats this potential contradiction as a data point, not a project-ending obstacle.

  **Conclusion**
  By locating the mechanism of Smith's anti-colonialism in the problem of distance, this project moves beyond the stalemate of "economics vs. morals." It offers a granular account of how Smith believed empire corrupts the very mechanisms—informational and sentimental—required for a free and moral society to function.
