  1. **Mark and Band Placement**

  **Mark: 15/20**
  **Band: Upper Second (2:1)**

  This script demonstrates a sophisticated grasp of the theoretical framework in parts (a) and (b), accurately deploying technical distinctions (meta-problem, sub-personal, vehicle/content) that exceed typical undergraduate performance. However, part (c) contains a significant category error regarding the ontological status of Mary's internal state, conflating functional capacities with behaviour, which prevents the answer from reaching the First-class band. The answer earns high credit for precision on the illusionist's explanatory burden but loses marks for imprecision on the implications for the Knowledge Argument.

  2. **Merits (What the answer gets right)**

  *   **Part (a), Paragraph 1:** The distinction drawn between eliminativism ("talk... on the way out") and illusionism ("residual explanandum remains") is precise and aligns with Keith Frankish's specific framing of the debate. Many students conflate the two; this candidate correctly identifies that the illusionist must explain the *appearance* of phenomenality, whereas the eliminativist often treats the appearance itself as theory-laden and discardable.
  *   **Part (a), Paragraph 2:** The claim that the illusion is "sub-personal... rather than by inference" is a crucial technical point often omitted. It earns credit because it correctly identifies the illusion as a product of cognitive architecture (introspective mechanisms) rather than a propositional attitude, which safeguards the view against the objection that knowing the truth should dissolve the illusion.
  *   **Part (b), Paragraph 1:** The identification of the meta-problem as the sole explanatory burden is correct and well-justified. The reasoning ("If there are no phenomenal properties, then there is no fact of the matter... to target") correctly captures the illusionist strategy of dissolving the hard problem rather than solving it.
  *   **Part (b), Paragraph 1:** The justification for why the task is "comparatively easy" (judgments are functional states) is a strong argumentative move. It correctly links the metaphysical claim to the methodological resources available to the physicalist.
  *   **Addendum (Content/Vehicle):** Although not explicitly requested, the distinction between the content of the representation (phenomenal) and the vehicle (non-phenomenal functional state) is philosophically sophisticated. It demonstrates an understanding of how one can talk about phenomenality without committing to its existence, which reinforces the answer to (a).

  3. **Defects (Where the answer goes wrong)**

  *   **Part (c), Paragraph 1:** *"What changes is her behaviour alone"*
      *   **Nature of Failure:** Category error / Conflation. This clause conflates functionalism with behaviourism. Illusionism is typically a form of physicalist functionalism; it posits that Mary undergoes internal physical/functional reorganization (new neural pathways, new recognitional capacities), not merely a change in outward behaviour.
      *   **Why it Matters:** The Knowledge Argument turns on whether Mary gains new *internal* knowledge or states. By restricting the change to "behaviour alone," the candidate undermines the physicalist claim that there is a real physical difference in Mary's brain state upon release, making the view vulnerable to objections regarding absent qualia or philosophical zombies.
      *   **Correct Formulation:** A fully correct answer would state that Mary gains new *functional capacities* or *representational abilities* (internal states), even if she gains no new *phenomenal facts*.
  *   **Part (c), Paragraph 1:** *"there is no new experience for her to have"*
      *   **Nature of Failure:** Ambiguity leading to falsehood. Read strictly, this denies that a new token mental event occurs. Illusionists argue she has a new experience (a physical state), it is just not *phenomenally* qualified. The clause "because... experiences of that kind do not exist" saves it slightly (referring to phenomenal experiences), but the primary clause suggests no experiential token occurs.
      *   **Why it Matters:** It risks portraying illusionism as a denial of consciousness tout court, which the candidate explicitly denied in part (a). Consistency across parts is required for full marks.
      *   **Correct Formulation:** The candidate should have said there is no new *phenomenal* experience, or no experience *with phenomenal properties*, acknowledging that a non-phenomenal experiential state does occur.
  *   **Part (a), Paragraph 1:** *"once the theory is given up there is no appearance of phenomenality left over to explain"*
      *   **Nature of Failure:** Overgeneralization / Mischaracterization. This characterizes a specific strand of eliminativism (perhaps Churchland's early work) but ignores error-theoretic eliminativists who grant the appearance persists even if the theory is false.
      *   **Why it Matters:** It sets up a straw man to make illusionism look more distinct than it might be. Some eliminativists agree the appearance persists but deny it needs a unique explanation.
      *   **Correct Formulation:** The candidate should have qualified this by saying "On some versions of eliminativism..." or focused on the fact that illusionists *insist* the appearance is a robust datum requiring explanation, whereas eliminativists may treat it as more fragile.

  4. **Loose or Awkward Phrasing**

  *   **Part (c), Paragraph 1:** *"What changes is her behaviour alone: new discriminative and recognitional abilities"*
      *   **Assessment:** The use of the colon here implies that abilities are a subset of behaviour. As noted in the defects, this is technically incorrect (abilities are dispositions, behaviour is output).
      *   **Deduction:** Given this is a timed exam, this should carry a minor deduction (already factored into the global mark for part (c)). It indicates sloppiness rather than deep ignorance, but in an upper-level course, precision between disposition and manifestation is expected.
  *   **Part (b), Paragraph 1:** *"Illusionism inherits the meta-problem and not the hard problem."*
      *   **Assessment:** This is slightly loose shorthand. Technically, the illusionist argues the hard problem *is* a manifestation of the meta-problem. Saying they inherit one *not* the other is acceptable dialectical shorthand but could be tighter.
      *   **Deduction:** No specific deduction; this is standard terminology in the literature (Frankish uses similar phrasing).

  5. **Unsettled Assertions / Ambiguities**

  *   **Part (a), Paragraph 1:** The definition of Eliminativism.
      *   **Flag:** The candidate defines eliminativism as treating phenomenal discourse as a "defective theory... on the way out." This aligns with Paul Churchland's eliminative materialism but may not cover all forms of eliminativism (e.g., error theory which retains the discourse but denies truth conditions).
      *   **Requirement for Gradeability:** To be fully gradeable as a comprehensive distinction, the candidate should specify they are referring to *eliminative materialism* regarding folk psychology, rather than eliminativism about consciousness *simpliciter*. However, in the context of this specific debate (Frankish vs. Realists), this usage is common enough to pass without further clarification.
  *   **Part (c), Paragraph 1:** *"she instantiates no new property"*
      *   **Flag:** This is ambiguous between "no new *phenomenal* property" (true for illusionism) and "no new *physical* property" (false for illusionism, as her brain state changes).
      *   **Requirement for Gradeability:** The surrounding context suggests the former, but a stricter grader would require the qualifier "phenomenal" to ensure the candidate isn't denying physical change. I have graded based on the charitable reading (phenomenal), but the ambiguity remains a risk.
