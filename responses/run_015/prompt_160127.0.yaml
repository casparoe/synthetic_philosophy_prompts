answer: |-
  To address Glaucon's challenge adequately, any justification must meet specific formal constraints. Below are the desiderata, sorted by necessity, followed by structural tensions and a brief scoring of popular theories.

  **Desiderata**

  1.  **The Undisturbed Agent (Non-negotiable):** The answer must address a fully informed, instrumentally rational agent. It cannot diagnose the agent as confused, weak-willed, or ignorant. This ensures the challenge isn't dissolved by psychology.
  2.  **Justificatory Priority (Non-negotiable):** It must answer the normative question ('is there a reason?') rather than the psychological ('what causes behaviour?') or genealogical ('how did this arise?').
  3.  **The Ledger Case (Non-negotiable):** The justification must hold where all deeds are recorded but burned unread at death. This eliminates reputation, social sanction, and self-deception as valid reasons.
  4.  **Efficacy and Compliance (Non-negotiable):** It must survive cases of near-total non-compliance (being the sole moral agent) and pure inefficacy (your act makes no difference). It must also address the Reverse Ring case (punished for good acts), ensuring the reason is internal to the act, not its reception.
  5.  **The Cost Ladder (Preference):** Regarding increasing costs (from a fiver to death): Absolutist theories require the obligation to hold at every rung. Common-sense morality permits a break point. A break is not a defeat if framed as the limit of obligation versus supererogation, but requiring uniformity across the ladder is a preference of deontological or saintly ideals, not a formal requirement.
  6.  **Neutrality and Character (Junk/Preference):** The requirement to remain 'neutral between first-order moral theories' is impossible; any justification presupposes normative weight. Junk this. Similarly, 'Character/Integrity' is not a formal constraint but a substantive theory about the self. Treat it as a candidate answer, not a rule.

  **Conflicting Pair**

  The pair that cannot be jointly satisfied is **Instrumental Rationality (Undisturbed Agent)** and **Categorical Obligation**. If reasons must hook onto the agent's existing desires or interests (instrumental), morality loses its categorical, desire-independent force. If morality is categorical, it violates the constraint that reasons must stem from the agent's contingent psychology. You cannot have Humean rationality and Kantian obligation simultaneously; one must yield.

  **Knockout Requirement**

  The **Ledger Case** does the most work. It instantly eliminates sanction-based, theological (reward/punishment), and reputational accounts. If the reason to be moral vanishes when no one knows, the account is merely prudential, not moral.

  **Theory Scores**

  *   **Self-interest/Prudential:** Fails the Cost Ladder and Ledger; cannot justify sacrifice without hidden benefits or afterlife assumptions.
  *   **Mutual-advantage/Contract:** Collapses under Non-compliance and Reverse Ring; offers no reason to be a sucker when others defect.
  *   **Constitutivist/Kantian:** Risks begging the question against the Undisturbed Agent by defining rationality as inherently moral without independent proof.
  *   **Character-based:** Often circular; explains why the virtuous act virtuously, but fails to justify why one should become virtuous in the first place.
