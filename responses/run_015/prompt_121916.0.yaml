  **Millbrook Codifies 'Unilateralist Curse' In New Municipal Code**

  MILLBROOK — The Millbrook City Council voted unanimously Tuesday to formalize the "Unilateralist Curse" into municipal law, officially recognizing that no public service will be performed because every resident rationally assumes someone else is already doing it.

  Ordinance 14-C stipulates that all snow removal, road repair, and infrastructure maintenance are now subject to independent probabilistic assessment by each citizen. Under the new statute, if a resident believes there is a greater than zero percent chance a neighbor will address a hazard, they are legally exempt from acting. Since every resident operates under the same calculation, the town has effectively legislated a permanent state of collective inaction.

  "This isn't about laziness; it's about eliminating redundant labor," said Mayor Higgins during the press briefing, standing knee-deep in unplowed snow. "If I shovel my driveway, and you shovel yours, we have duplicated effort. If we both assume the other will do it, we save energy. The fact that the energy savings result in impassable roads is a secondary externality."

  The legislation also formalized "Defection Day," a civic holiday honoring Arthur Pence, the 1974 resident who first looked at a snowstorm, calculated the high likelihood of municipal intervention, and went back inside. Pence is now celebrated as a founding father of local efficiency. During the annual ceremony, residents gather at the town square to watch a statue of a man holding a shovel while staring at his watch. Children participate by dropping leaflets into a mailbox they assume has already been emptied.

  Dr. Elena Rostova, a local economist who advised on the bill, expressed measured concern regarding the town's navigability while defending the mathematical integrity of the policy. "From a game theory perspective, the town has achieved a perfect Nash equilibrium," Rostova said, noting that her own car has been stuck in a ditch for three weeks. "Individually, every decision to wait is rational. Collectively, it produces a suboptimal outcome. But to intervene would be to invalidate the rationality of the initial choice. So, we wait."

  Critics argue the town is simply frozen, but proponents say the silence of the snowplows is the sound of freedom. At press time, the fire department was reportedly unavailable, as every firefighter assumed a civilian had already called for help.
