  9.  **Final Review against Constraints:**
      *   Did I answer the specific questions? (Principle, Motivation, Drops, Predictions).
      *   Is it British English?
      *   No citations?

      *(Self-Correction during drafting)*: I need to be careful not to just validate their views but to challenge the inconsistencies, particularly around "Elite Capture." The user says Elite Capture bothers them less for Norway than India. My principle needs to explicitly validate that distinction based on the *type* of good (Power vs. Welfare).

      *(Refining the Principle Name)*: Let's call it the **Status-Disruption Principle**. It focuses on breaking hierarchical status rather than compensating individuals.

      *(Refining the "Drops")*: The user likes Shortlist rules more than Outcome quotas generally, but accepts Outcome for Boards. The principle should suggest that Shortlist preferences are often a compromise that fails when the hierarchy is too rigid. They might need to drop the general preference for shortlists.

      *(Refining the "Medical School" queasiness)*: This is the tension between *forward-looking* (diversity benefits all) and *backward-looking* (compensation). The principle should clarify that quotas are forward-looking structural tools, which resolves the queasiness (the individual isn't being compensated, the structure is being fixed).

  10. **Final Polish:** Check the flow and ensure the "British English" constraint is met naturally without being caricatured. (e.g., "programme", "analyse", "favour").

