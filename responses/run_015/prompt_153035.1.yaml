  7.  **Predicting the New Cases:**
      *   *(i) Private Employers (India-style):* Does the hierarchy extend to the private sphere? Yes, caste affects social capital. But does the state have jurisdiction? Principle says yes if it's a site of mobility. Prediction: **FOR**, provided it targets the right groups (Clause 1 & 3).
      *   *(ii) New AI Body (Global South):* Is this a status hierarchy? Yes (Global North dominance). Is it a site of power? Yes. Is it inherited? Yes (colonial history). Prediction: **FOR**, but perhaps as a "Power Quota" where elite capture is less relevant than presence.

  8.  **Refining the Tone and Language:**
      *   British English (e.g., "programmes", "centre", "whilst", "labour").
      *   No citations.
      *   Respectful but critical.
