answer: |-
  Here is the direct answer you asked for: **Your biologist's intuition is a category error.** The analogy between adaptive landscapes and moral properties collapses, and it collapses hard. While your instinct correctly identifies that science relies on abstract, non-physical explanatory tools, it misidentifies *why* those tools are ontologically respectable.

  The anti-realist's causal inertness argument (often associated with Gilbert Harman or J.L. Mackie) is not merely that moral properties don't "push atoms." It is that they are **explanatorily redundant** in a way that adaptive landscapes are not.

  Here is the specific conceptual distinction that does the work: **Descriptive Disposition vs. Normative Authority.**

  ### 1. The Status of the "Inert" Entity
  In evolutionary biology, an adaptive landscape or a selection gradient is an abstract model, yes. But it is a model of **causal dispositions inherent in the physical system.** When you posit a fitness peak, you are summarizing a complex set of physical facts about reproduction, survival, and resource competition. The landscape supervenes entirely on physical causation. If you remove the organisms and the environment, the landscape disappears. It is "inert" only in the sense that a map is inert; the territory it maps is purely causal.

  Moral realism, in the context of this debate, typically posits properties that do not merely summarize physical dispositions. A moral property (e.g., "wrongness") is claimed to provide a **normative reason** for action that exists independently of the agent's desires or the physical consequences. If you remove the physical agents and the environment, the moral realist often wants to say the "wrongness" of a hypothetical act remains true in some sense.

  **The Collapse:** Adaptive landscapes are *descriptions of causal power*. Moral properties are posited as *sources of normative authority*. The former is part of the causal story (as a summary); the latter is claimed to be outside the causal story (as a judge of it).

  ### 2. Explanatory Indispensability
  This is the sharpest point of failure for your analogy. In science, we tolerate causally inert constructs only if they are **explanatorily indispensable** for predicting physical outcomes.
  *   **Biology:** You cannot explain the change in gene frequency over time without referencing the selection gradient (or an equivalent causal model). The abstract tool is necessary to predict the physical data.
  *   **Ethics:** When explaining why a person committed a cruel act, you do not need the property of "wrongness." You need psychology, sociology, neurology, and environmental history. If you cite "the wrongness of the act" as the cause of the agent's behavior, you are speaking metaphorically. If you cite it as the *justification*, you are no longer doing causal explanation.

  The anti-realist argument is that moral properties drop out of the best causal explanation of our moral *beliefs* and *behaviors*. Adaptive landscapes do not drop out of the explanation of gene frequencies. Therefore, the "inertness" of the landscape is tolerated because it is a necessary proxy for causal forces. The "inertness" of moral properties is fatal because they claim to be real without being necessary proxies for any causal force.

  ### 3. The Epistemological Gap (The Real Bite)
  The causal inertness objection is ultimately epistemological. If a property does not interact causally with our sensory apparatus or measuring instruments, how do we know it is there?
  *   **Biology:** We infer the adaptive landscape by measuring physical outcomes (offspring count, survival rates). The "inert" model is tethered to data via causal chains.
  *   **Ethics:** If moral properties are causally inert, they cannot trigger our moral beliefs via physical interaction. Moral realists must then posit a faculty of "intuition" or "rational insight" that detects these inert properties. To a scientist, this looks like magic. It breaks the causal closure of the physical world required for reliable knowledge.

  ### The Verdict
  Your intuition is salvageable only if you retreat to a **reductive naturalism** where moral properties *just are* complex social-biological facts (e.g., "wrongness" = "actions that reduce group fitness"). But if you do that, you have abandoned the moral realism the anti-realist is attacking (which requires properties to be *normative*, not just descriptive).

  If you maintain that moral properties are *sui generis* normative truths, the analogy fails. Adaptive landscapes are **maps of the causal territory**. Moral properties, as defended against the causal objection, are claimed to be **legislators over the territory**. Science tolerates the former because they track causal powers. It has no use for the latter because they claim authority without causal leverage.

  **Bottom line:** The anti-realist is right about the disanalogy. Science accepts abstracta that *summarize* causation. It does not accept abstracta that *prescribe* to causation without being reducible to it. Your biological training serves you well in spotting the utility of abstraction, but it misleads you here by conflating **modeling causal potential** with **asserting normative truth**.
