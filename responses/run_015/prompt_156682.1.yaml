          *   Conclusion: The "Collective Status" half is doing the heavy lifting to justify the restrictions. Without it, the law reverts to common law employment-at-will.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Be careful not to say Right-to-Work is federal law. It's state law permitted by federal law (Taft-Hartley). The prompt acknowledges this ("In the many states...").
