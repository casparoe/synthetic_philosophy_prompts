answer: |-
  The package of doctrines you describe does not presuppose a single, coherent theory of association. Rather, it is an **unstable compromise between two incompatible theoretical frameworks**: a **Civic-Republican/Corporatist** model of the workplace as a political polity, and a **Classical Liberal** model of the workplace as a nexus of individual contracts.

  The law attempts to square the circle by granting unions the powers of a sovereign (exclusive representation, binding contracts) while denying them the taxing authority of a sovereign (right-to-work) and treating their most potent weapons (strikes, secondary pressure) as private economic risks rather than public political rights.

  Here is the breakdown of what each feature presupposes, where the doctrine is underdetermined, and how the variant regime tests the underlying philosophy.

  ### 1. Theoretical Reconstruction: The Two Logics

  **Logic A: Collective Status (Civic-Republican/Corporatist)**
  *   **Features:** Exclusive representation, majority binds minority, duty of fair representation, contract binds non-signers.
  *   **Strict Presupposition:** The bargaining unit is a **political sovereign**, not a private club. The union functions as a "private government" administering industrial justice. Because it exercises public-like power over the workplace, it must represent all constituents (due process) and stability requires that one voice speak for the polity (efficiency/peace).
  *   **Fits Well With:** Industrial Pluralism (the idea that conflict is managed through institutionalized group negotiation).
  *   **Underdetermined:** This logic does not strictly require *exclusive* representation; a system of works councils (as in Germany) could also fulfill the "polity" function. However, it *does* strictly require that if a union holds a monopoly on representation, it must owe a duty of fair representation to all.

  **Logic B: Individual Consent (Classical Liberal/Libertarian)**
  *   **Features:** Right-to-work (no compelled dues), ban on secondary pressure (neutrality), permanent replacement (economic risk).
  *   **Strict Presupposition:** Association is **voluntary and individual**. Coercion is only justified by personal fault. A worker should not be taxed for speech they oppose (Right-to-Work); a third party should not be harmed for a dispute they didn't cause (Secondary Ban); a worker who voluntarily withholds labor assumes the market risk of losing that position (Replacement).
  *   **Fits Well With:** Employment-at-will and property rights theories (the employer owns the job, the worker owns their labor).
  *   **Underdetermined:** This logic is compatible with *no* union recognition at all. It licenses unionization only insofar as it is a voluntary contract between the employer and individual employees.

  **The Instability:**
  The law creates a "free rider" problem by mixing these logics. Logic A says the union must represent the dissenter (public duty); Logic B says the dissenter need not pay for that representation (private right). This is not a synthesis; it is a standoff. The theory presupposed is **Liberal Corporatism**: the state charters the union as a public utility to ensure industrial peace, but refuses to fund it through compelled association, leaving it to survive on voluntary dues while maintaining public obligations.

  ### 2. The Strike and Permanent Replacement

  You ask what permitting permanent replacement presupposes. It presupposes that **a strike is a market action, not a political right.**

  *   **Strict Presupposition:** The employer's property right to continue operations supersedes the worker's liberty right to withhold labor *in an economic dispute*. The job is not a status (like citizenship) but a commodity (like a lease). If the lease is interrupted by the tenant (striker), the landlord (employer) may find a new tenant.
  *   **Right vs. Liberty:** Under this doctrine, calling striking a "right" is indeed close to empty in economic disputes. It is a **bare liberty**: you are free to strike, but you are not free from the consequences. A robust *right* would imply a claim against interference or a guarantee of reinstatement.
  *   **Can a right survive being this costly?** A legal right can survive high costs (e.g., the right to free speech survives the risk of social ostracization), but permanent replacement transforms the right into a **hazardous gamble**. It presupposes that the *outcome* of the dispute should be settled by relative economic endurance. This fits Logic B (market competition) but contradicts Logic A (industrial democracy). If the workplace is a polity, permanently exiling citizens for voting (striking) undermines the legitimacy of the polity.
  *   **The ULP Exception:** The fact that ULP strikers *cannot* be permanently replaced reveals the fault line. Here, Logic A wins. If the employer broke the law (fault), the market logic is suspended, and the worker is restored. This proves the replacement rule is not about "operational necessity" (which exists in ULP strikes too) but about **moral hazard**. Economic strikers are "at fault" for disrupting peace; ULP strikers are "victims" restoring justice.

  ### 3. Testing the Variant: Proportional Representation

  Consider the variant: **Proportional, continuously revisable representation.** Multiple unions, no majority binding minority, membership fluctuates monthly.

  **Would the replacement rule and secondary ban have to change?**
  Philosophically, **yes**. Legally, they could stand, but their justification would collapse.

  1.  **The Replacement Rule:**
      *   *Current System:* Permanent replacement is the *quid pro quo* for Exclusive Representation. The union gets a monopoly on bargaining (stability for the employer); the employer gets the right to replace strikers (leverage against the monopoly).
      *   *Variant:* If representation is proportional and volatile, the union has no monopoly power. It is merely a voluntary association of individuals. If the employer can permanently replace these individuals, the association is rendered futile.
      *   *Necessary Change:* To preserve *any* collective bargaining in the Variant, the replacement rule would need to become **stricter** (e.g., no permanent replacement allowed). Why? Because without the monopoly power of Logic A, labor has no leverage. If you keep Logic B's replacement rule without Logic A's exclusive bargaining, you revert to pure employment-at-will. The "Collective Status" half of the package is what currently *licenses* the harshness of the replacement rule as a balance of power. Remove the status, and the harshness becomes mere oppression.

  2.  **The Secondary Pressure Ban:**
      *   *Current System:* Secondary boycotts are banned to contain the "public utility" union's power. Because the union can bind the whole workplace, its disruption is systemic; therefore, it must be confined to the primary dispute.
      *   *Variant:* If unions are small, voluntary, and represent only their members, their capacity for systemic disruption is lower.
      *   *Necessary Change:* The ban could logically **loosen**. If a union is just a private club (Logic B), restricting its speech/pressure tactics against third parties requires a strong tort-based justification (coercion), not a broad statutory labor peace justification. However, if the Variant relies on Logic B (individual consent), the ban on secondary pressure *fits well* (don't harm neutrals). But the *severity* of the ban might lessen because the threat to "industrial peace" (Logic A) is gone.

  **Which half is doing the real philosophical work?**
  The **Collective Status (Logic A)** half is doing the heavy lifting to justify the **restrictions** on labor.

  *   We accept Exclusive Representation (a restriction on dissenters) to get Industrial Peace.
  *   We accept the Secondary Ban (a restriction on solidarity) because the Union is a powerful, exclusive agent.
  *   We accept Permanent Replacement (a restriction on strikers) because the Union has the power to shut down the whole unit.

  In the **Variant (Pure Logic B)**, the union is weak and voluntary. If you keep the restrictions (Replacement, Secondary Ban) in that context, you are crushing a private voluntary association with state power without the *quid pro quo* of institutional stability.

  Therefore, the current US labor law package is not a coherent theory of association. It is a **Corporatist structure (Logic A) hollowed out by Liberal constraints (Logic B).** The "Collective Status" features create the institution; the "Individual Consent" features starve it of resources and limit its tactics. The Variant reveals that without the "Collective Status" half, the "Individual Consent" half leads not to free association, but to the dissolution of collective power entirely. The doctrine is an unstable compromise that relies on the tension between the two to function, but increasingly leans toward Logic B (individualism) in judicial interpretation, rendering Logic A (collective rights) increasingly theoretical.
