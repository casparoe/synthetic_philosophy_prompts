      *   *Right-to-Work (No Agency Fees):* Presupposes individual autonomy over association. You can't be taxed for speech/representation you didn't choose. Fits Classical Liberalism/Libertarianism. Clashes with the logic of Exclusive Representation (free rider problem).
      *   *Permanent Replacement (Economic Strikers):* Presupposes the strike is an economic weapon, not a fundamental right. The employer has a right to continue business. Fits Market Liberalism (labor is a commodity, risk lies with worker).
      *   *Reinstatement (ULP Strikers):* Presupposes moral fault matters. If the employer broke the law, the worker shouldn't suffer permanent loss. Fits Corrective Justice/Rule of Law.
      *   *Secondary Boycott Ban:* Presupposes neutrality. Third parties shouldn't be dragged into disputes they didn't cause. Fits Individual Fault/Responsibility logic. Clashes with Solidarity logic.

  3.  **Evaluate Theoretical Frameworks:**

      *   *Classical Liberalism:* Strong on Right-to-Work and Secondary Bans. Weak on Exclusive Representation (coercive). Weak on ULP protection (interferes with contract).
      *   *Civic Republicanism:* Strong on Exclusive Representation (workplace as community). Strong on ULP protection (justice). Weak on Right-to-Work (duty to support the polity). Weak on Secondary Bans (solidarity is good).
      *   *Pluralism (Interest Group):* Strong on Exclusive Representation (groups negotiate). Weak on Right-to-Work (undermines group power).
      *   *Industrial Pluralism (The "Accord"):* This is the historical context. The idea is that labor peace is achieved by channeling conflict into regulated procedures. It's a pragmatic compromise, not a pure theory.

  4.  **Synthesize the "Single Theory" (or lack thereof):**

      *   Is there one theory? No. It's a *hybrid*.
      *   Best description: **Liberal Corporatism** or **Managed Pluralism**. It tries to balance industrial peace (collective) with individual liberty (liberal).
      *   However, the prompt asks if it's an *unstable compromise*. Yes, it leans that way.
      *   *Key Insight:* The law treats the *union* as a public utility (must serve all, exclusive franchise) but treats *membership* as private association (can't force dues). This is the core tension.

  5.  **Address the "Permanent Replacement" Question:**

      *   Does it empty the "right to strike"?
      *   *Strict Presupposition:* It presupposes the employer's property right to operate is superior to the worker's liberty right to withhold labor *in an economic dispute*.
      *   *Theory:* It views the strike not as a political right (like voting) but as an economic risk (like a business investment).
      *   *Can a right survive cost?* Yes, rights often have costs (e.g., free speech can get you fired in private sector). But permanent replacement makes it a *hazardous* liberty, not a secure right. It shifts the risk of the dispute entirely onto the striker.

  6.  **Analyze the Variant Regime (Proportional Representation):**

      *   *Scenario:* Multiple unions, no majority binding minority, continuous opting in/out.
