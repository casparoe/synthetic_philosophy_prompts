      *   *Impact on Replacement Rule:* If representation is individual/volatile, strikes are less existential. But if a union is weak, replacement is easier. However, philosophically, if the union doesn't represent *everyone*, the employer's need to maintain operations is less justified against *any* specific worker? Actually, the logic of replacement relies on the employer's right to operate. That remains. But without the "industrial peace" justification of exclusive bargaining, the strike becomes more of a pure market action.
      *   *Impact on Secondary Pressure:* If unions are weaker and membership is fluid, solidarity becomes harder. The ban might remain to protect third parties, but the justification shifts from "labor peace" to "tortious interference."
