  Your colleague requires the false eliminative claim to close the question, and while defensible readings of both slogans are semantically compatible, their substantive priority claims contradict, leaving the fax hypothetical unresolved by semantics alone.

  ### "We are all textualists now"

  | Reading | Precise Content | Verdict | Supports Move? |
  | :--- | :--- | :--- | :--- |
  | **Descriptive** | Courts currently claim to prioritize text over legislative history. | Plausible / Platitude | No (describes practice, doesn't justify it) |
  | **Priority** | Textual evidence outranks purposive evidence when they conflict. | Substantive / Contested | Yes (normatively closes inquiry) |
  | **Semantic** | Statutory content is public linguistic meaning, not private mental states. | Defensible / Substantive | No (purpose can inform public meaning) |
  | **Ontological** | Multimember bodies cannot possess intentions, points, or beliefs. | False / Philosophical Error | Yes (eliminates object of inquiry) |
  | **Legitimacy** | Only enacted words undergo democratic process; purpose did not. | Defensible / Substantive | No (purpose explains enacted words) |
  | **Semantic Shift** | "Textualism" now absorbs context and purpose as meaning. | Plausible / Platitude | No (concedes purposivist ground) |
  | **Eliminative** | Purpose is never part of the law, even if text is clear. | False / Philosophical Error | Yes (radical dismissal) |
  | **Scope** | "Text" includes whole act and related statutes, not isolated clauses. | Defensible / Substantive | No (doesn't exclude purpose) |

  ### "The letter killeth, but the spirit giveth life"

  | Reading | Precise Content | Verdict | Supports Move? |
  | :--- | :--- | :--- | :--- |
  | **Moral Entity** | "Spirit" is independent moral truth overriding words. | False / Metaethical Error | Yes (but illegitimate) |
  | **Meaning Constituent** | Purpose is a constituent of what the words mean. | Defensible / Substantive | No (compatible with textualism) |
  | **Tie-Breaker** | Purpose consulted only when text is ambiguous or absurd. | Defensible / Substantive | No (concedes text priority) |
  | **Context** | "Spirit" is contextual information competent readers use. | Defensible / Platitude | No (compatible with textualism) |
  | **"Killeth"** | Literalism produces results no speaker would intend or that defeat the act. | Substantive / Normative | Yes (justifies overriding text) |

  ### Compatibility and Application

  **Compatibility:** The Semantic Textualist claim (public meaning includes context) and the Contextual Purposivist claim (purpose is context) are compatible; here the dispute is verbal. The real disagreement lies between the Textualist **Priority** claim and the Purposivist **"Killeth"** claim. These are contradictory normative assertions about judicial authority versus legislative efficacy.

  **Application to Hypothetical:**
  1.  **Ontological/Eliminative Textualism:** Defendant wins. "Facsimile machine" denotes 1993 hardware; purpose is non-existent or irrelevant. The question is closed.
  2.  **Priority Textualism:** Defendant wins. If the public meaning of "facsimile machine" excludes cloud services, purpose cannot expand it without violating the priority rule.
  3.  **Semantic/Contextual Textualism:** Indeterminate. Requires arguing whether 1993 public meaning extends to functional equivalents based on context. Purpose informs meaning but does not override it.
  4.  **Purposivist ("Killeth"):** Plaintiff wins. Denying coverage defeats the cost-shifting point; literalism "kills" the statute's function, warranting extension to cloud services.

  **Resolution:** Only the **Priority** claim (Textualism) or the **"Killeth"** claim (Purposivism) resolves the case. The defensible semantic claims leave it open, requiring a normative choice about whether judges may update statutory extension to match evolving technology when the text is static. Your colleague's move fails because the only readings that support it are false; the true readings admit the purposivist's question is legitimate, even if the answer differs.
