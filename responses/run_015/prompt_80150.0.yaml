      *   *Severity Ranking:*
          1.  (1) & (3) - Logical Contradiction (Internalism vs Externalist Conclusion).
          2.  (1) & (2) - Definitional Strain (Actual vs. Corrected SMS).
          3.  (3) & (4) - Theoretical Friction (Universal vs. Relative).

      *   *Wait, is (1) & (2) worse?* If (2) is true, (1) is false. If (3) is true, (1) is false. (2) is the *mechanism* the user proposes to save (1). So the tension between (1) and (2) is the *source* of the tension between (1) and (3). I will rank (1)-(3) as the *consequence* tension (most visible) and (1)-(2) as the *structural* tension. I'll rank (1)-(3) higher because it's the claim that will get attacked in the seminar.

