answer: |-
  ### Part 1: System Verification (Instructor's Key)

  Before running the workshop, you need to be certain of the math. You are correct that the invariant relies on the **parity of the number of I's**.

  *   **Start String:** `MI` (One `I` $\rightarrow$ **Odd**)
  *   **Rule Analysis:**
      *   **R1** ($xI \to xIU$): Adds `U`. `I` count unchanged. (Parity preserved)
      *   **R2** ($xIIy \to xUy$): Removes two `I`s, adds one `U`. `I` count $-2$. (Parity preserved)
      *   **R3** ($xUUy \to xy$): Removes two `U`s. `I` count unchanged. (Parity preserved)
      *   **R4** ($x \to xII$): Adds two `I`s. `I` count $+2$. (Parity preserved)
  *   **The Invariant:** Every reachable string must have an **odd number of I's**.

  **Target Analysis:**
  1.  **`MUIU`**: One `I` (Odd). **Reachable.**
      *   *Derivation:* `MI` $\xrightarrow{R4}$ `MIII` $\xrightarrow{R2}$ `MUI` $\xrightarrow{R1}$ `MUIU`.
  2.  **`MIII`**: Three `I`s (Odd). **Reachable.**
      *   *Derivation:* `MI` $\xrightarrow{R4}$ `MIII`.
  3.  **`MU`**: Zero `I`s (Even). **Unreachable.**
  4.  **`MUII`**: Two `I`s (Even). **Unreachable.**

  ---

  ### Part 2: Workshop Plan (75 Minutes)

  **Group Setup:** 14 Participants $\rightarrow$ 4 Teams (3–4 people each).
  **Materials:** Whiteboard (for rules), Index Cards (for derivations and proofs), Markers.

  #### Phase 0: Setup & Rules (5 Minutes)
  *   **Action:** Write the Alphabet, Start String, and 4 Rules on the whiteboard.
  *   **Script:** "You are inside a formal machine. You start at `MI`. Your only tools are these four rules. Your goal is to transform the start string into a target string. You cannot use outside knowledge, arithmetic, or intuition about what the letters 'mean'. You can only apply the rules."
  *   **Constraint:** Do not use the words "invariant," "meta," "parity," or "proof." Use "derivation," "target," and "property."

  #### Phase 1: The Warm-Up (15 Minutes)
  *   **Target:** All teams receive **`MUIU`**.
  *   **Goal:** Get a valid derivation on an index card.
  *   **Why:** This target is reachable but requires using at least three different rules (R4, R2, R1). It forces them to engage with the mechanics without being trivial.
  *   **Success Condition:** A team raises their hand when they have a valid chain. You quickly verify one step.
  *   **Transition:** "Good. You know how to move inside the system. Now we test the limits."

  #### Phase 2: The Wall (30 Minutes)
  *   **Target:** All teams receive **`MU`**.
  *   **Instruction:** "Your goal is `MU`. You have two options:
      1.  Produce a derivation (write the steps on a card).
      2.  Convince me it is impossible (write the reason on a card).
      *Crucial:* You do not know which option is correct. If you claim impossibility, you must provide a reason that survives a challenge from another team."
  *   **Dynamic:**
      *   Teams will initially try to derive it (working *inside*).
      *   Frustration will build as they realize they can get close (`MUU`, `MUI`) but not land the target.
      *   Some teams may shift to looking for patterns (working *outside*).
  *   **Instructor Role:** Circulate. If a team asks "Is it possible?", say "I don't know, I'm just the referee." If they ask "Can I count the I's?", say "You can observe whatever you like, but your proof must rely on the rules provided."

  #### Phase 3: The Challenge Court (10 Minutes)
  *   **Mechanism:** If a team claims "Impossible," they must submit a **Property Card**.
      *   *Format:* "Start String has Property P. All Rules preserve Property P. Target String does not have Property P."
  *   **Peer Challenge:** Another team is invited to try and break the property. They must find *one* application of *one* rule where Property P is not preserved.
  *   **Resolution:** If the property survives challenge, that team wins. (In this specific system, the "Odd Number of I's" property is robust).

  #### Phase 4: Debrief & Theory Mapping (15 Minutes)
  *   **Reveal:** Confirm `MU` is impossible. Reveal the "Odd I's" invariant.
  *   **Discussion Points:**
      1.  **Inside vs. Outside:** Phase 1 was *derivation* (syntax). Phase 2 required *semantics* (assigning meaning/counts to the symbols to see the whole set).
      2.  **The Nature of Proof:** A derivation is finite. An impossibility proof is a claim about an *infinite* set of possible derivations. You cannot check them one by one; you must jump out.
      3.  **The "Cheat":** Using arithmetic feels like cheating because it's not in the rulebook. But it's the only way to characterize the *system* rather than a *string*.

  ---

  ### Part 3: Roles & Referee Rules

  To prevent chaos, assign roles within teams (rotate if you have time, otherwise assign at start):
  1.  **Scribe:** Writes the derivation steps clearly.
  2.  **Rule-Checker:** Verifies every step against the whiteboard rules before writing it down.
  3.  **Pattern-Seeker:** (Phase 2 only) Steps back from writing and looks at the collection of failed attempts to find commonalities.

  **The "Burden of Proof" Rule (For Phase 2):**
  You cannot simply say "It's impossible." To stop the clock, a team must submit a **Property Card** with three lines:
  1.  **Base:** `MI` has Property $X$.
  2.  **Induction:** If String $S$ has Property $X$, then any Rule applied to $S$ results in a String $S'$ that also has Property $X$.
  3.  **Conflict:** Target `MU` does *not* have Property $X$.

  *Instructor Note:* If a team submits "Every string starts with M," accept the card but point out that `MU` *also* starts with M, so the Conflict line fails. This teaches them that a true invariant must *distinguish* the target.

  ---

  ### Part 4: Predictable Failure Modes & Mitigations

  | Failure Mode | Why it happens | How to handle it |
  | :--- | :--- | :--- |
  | **The "True but Useless" Invariant** | Teams find a property like "Contains an M" or "Starts with M". It's true, but doesn't prove `MU` is unreachable. | In the Challenge Court, ask the opposing team: "Does the Target `MU` lack this property?" If yes, the proof fails. |
  | **The "I Haven't Found It" Fallacy** | Teams confuse "We can't find a derivation" with "No derivation exists." | During circulation, ask: "Have you checked *all* infinite paths?" Remind them that absence of evidence is not evidence of absence *inside* the system. |
  | **Rule Drift** | Teams accidentally invent a rule (e.g., "I can swap I and U") to make it work. | The **Rule-Checker** role is vital. As referee, strictly reject any step that doesn't match the whiteboard exactly. |
  | **Early Solver Spoilers** | A team figures it out in 10 minutes and shouts "It's about the I's!" | **Pre-brief:** "If you solve it, you must not speak. Your goal is to write the Property Card silently. If you spoil it, your team is disqualified from the Challenge Court." |
  | **Arithmetic Resistance** | Participants feel counting I's is "not philosophy" or "not formal." | In debrief, validate this feeling. That discomfort *is* the point. It feels like cheating because it belongs to a different language (meta-language) than the system. |

  ---

  ### Part 5: The Big Limitation (Instructor's Note)

  You asked for frankness about what this activity *cannot* teach. This is critical for the debrief so you don't accidentally teach the wrong lesson.

  **The Limitation: Decidability vs. Undecidability**
  *   **The Activity:** This system is **decidable**. There *is* a simple invariant (parity of I's) that cleanly separates reachable from unreachable strings. If you "jump out," you *always* win.
  *   **The Reality (Gödel/Turing):** In sufficiently powerful systems (like Peano Arithmetic), there is no guaranteed "jump out" move.
      *   Sometimes a statement is true but unprovable (Gödel).
      *   Sometimes there is *no* algorithm to decide if a statement is provable (Church/Turing).
      *   Sometimes the "meta-property" is itself uncomputable.
  *   **The Risk:** Students might leave thinking, "Oh, formal systems have limits, but if we just step outside and look at the big picture, we can always solve the problem."
  *   **The Correction:** You must explicitly state in the debrief: *"We got lucky. I gave you a toy system where the meta-view is clear. In the real landscape of mathematical truth, stepping outside often just leads to a bigger, more complex system with its own blind spots. The 'jump out' move is not a magic key; it's just a shift to a stronger system, which has its own unprovable truths."*

  **What You Must Supply:**
  The activity demonstrates the *distinction* between object-level and meta-level reasoning. It does **not** demonstrate the *incompleteness* of meta-level reasoning. You must verbally bridge that gap in the final 5 minutes, explaining that while *this* invariant was findable, Gödel showed that for rich enough systems, the "invariant" (truth) outruns the "rules" (provability) permanently.

  ### Summary Checklist for You
  1.  **Whiteboard:** Clean, large text for Rules R1–R4.
  2.  **Cards:** Two colors (one for Derivations, one for Property Proofs).
  3.  **Timer:** Keep Phase 2 strict. The frustration is the pedagogical engine.
  4.  **Debrief Script:** Have the "Decidability Trap" warning written down so you don't forget it in the flow.

  This structure ensures they *feel* the ceiling of the formal system before you tell them why it exists.
