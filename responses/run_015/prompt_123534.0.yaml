prompt: |-
  I am a principal engineer with no background in philosophy, and I have recently taken over ownership of engineering standards for a product group of about seventy people, split between a London office and a smaller office in another country. Every month or so I have to decide, for one practice or another, whether to make it a hard rule enforced in CI or in code review, a default that people may depart from if they leave a note explaining why, or a matter left to individual judgement. The decisions are frequent, individually cheap to reverse but corrosive when churned, and each one has to be written up as a one-page recommendation that the engineering leadership team signs off and that a sceptical group of senior engineers will actually read.

  The material I have been pointed to is the literature on tight and loose cultures: the claim that groups differ in how strong their norms are and how much deviance they tolerate, that this difference tracks how exposed the group is to threats and how costly miscoordination is for it, and that tightness buys predictability and coordination at the price of autonomy, experimentation, openness to novelty and tolerance of dissent. I do not want a summary of that literature. I want it turned into a procedure a tech lead can run in about twenty minutes, with no knowledge of the theory, on a single practice at a time.

  One thing I would like tested rather than assumed. My suspicion is that tightness is not one dial but two: how wide a range of situations a rule claims to cover, and how much a departure from it is sanctioned when it happens. A convention can be broad and gently enforced, or narrow and strictly enforced, and the trade-offs look different in each case. If that distinction is worth keeping, build the procedure around it; if it collapses under scrutiny, say so and use whatever distinction does the work.

  Please give me: the questions to ask in order; what counts as a sufficient answer to each; where the procedure stops with a no; and where it has to hand the decision to a person because the question is one of values rather than facts. Then run it on three practices I am currently arguing about: requiring two approvals on every pull request; enforcing formatting and lint rules automatically in CI; and whether an on-call engineer during an incident must follow the runbook step by step or may improvise. I have a strong prior on the third one — I think improvisation should be allowed — so tell me plainly if the procedure contradicts me. Finally, be explicit about which of the theory's distinctions had to survive the simplification and which you dropped, and about what the procedure cannot tell me: I especially want to know what happens to it given that the theory was built to describe whole societies, while my engineers can leave, and given that some of our rules may simply be wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Principal Engineer, no philosophy background, owns engineering standards for ~70 people (London + remote).
      *   **Task:** Create a 20-minute decision procedure for setting engineering standards (Hard Rule vs. Default vs. Judgment).
      *   **Input Material:** Literature on Tight vs. Loose cultures (Gelfand et al.).
      *   **Constraint 1:** Do *not* summarize the literature. Turn it into a procedure.
      *   **Constraint 2:** Test the user's hypothesis: Is "tightness" one dial or two? (Scope/Range vs. Sanction/Enforcement).
      *   **Constraint 3:** Provide specific questions, sufficient answers, stop conditions, and value-handoff points.
      *   **Constraint 4:** Run the procedure on three specific cases: 2 approvals on PRs, Auto-formatting/linting in CI, Incident Runbook improvisation.
      *   **Constraint 5:** Check the user's prior on the third case (improvisation allowed).
      *   **Constraint 6:** Explicitly state which theoretical distinctions survived/dropped and limitations (societies vs. companies, rules can be wrong).

  2.  **Deconstruct the Theory (Tight vs. Loose):**
      *   *Core Concept:* Tight cultures have strong norms and low tolerance for deviance. Loose cultures have weak norms and high tolerance.
      *   *Predictors:* Threat level (ecological/historical), need for coordination.
      *   *Trade-offs:* Tight = Order, Predictability, Coordination. Loose = Creativity, Adaptability, Satisfaction.
      *   *User's Hypothesis:* Tightness = Scope (how many situations) $\times$ Sanction (how hard we punish deviance).
      *   *Evaluation of Hypothesis:* In organizational theory, this maps well to *Policy Scope* vs. *Compliance Mechanism*. A rule can be universal but advisory (Loose Scope, Loose Sanction), or niche but critical (Tight Scope, Tight Sanction). The literature often treats them as correlated, but for engineering standards, decoupling them is highly practical. *Decision:* Keep the user's distinction. It adds necessary granularity for engineering contexts.

  3.  **Drafting the Procedure (The "Tightness Calculator"):**
      *   *Goal:* 20 minutes, one page, actionable.
      *   *Structure:*
          1.  Context Assessment (Threat/Coordination).
          2.  Scope Definition (Where does this apply?).
          3.  Enforcement Definition (What happens if broken?).
          4.  Value Check (When to escalate).
      *   *Questions:* Need to be concrete, not abstract.
      *   *Stop Conditions:* If the cost of coordination is low, don't tighten. If the risk is existential, tighten.
      *   *Value Handoff:* When the trade-off is between speed and safety, or autonomy and consistency, leadership must decide the *weight*, not the procedure.

  4.  **Refining the Questions (Iterative Process):**
      *   *Draft 1:* Is this dangerous? Is coordination needed?
      *   *Critique:* Too vague.
      *   *Draft 2:* What is the blast radius? How many people need to know this?
      *   *Refinement:* Let's align with the "Threat/Coordination" axis of the theory.
      *   *Question 1 (Coordination Cost):* If two people do this differently, does the system break or does it just look messy?
      *   *Question 2 (Threat/Risk):* If this is done wrong, what is the impact? (Incident, Tech Debt, Style Nit).
      *   *Question 3 (Scope - User's Hypothesis):* Is this situational or universal?
      *   *Question 4 (Sanction - User's Hypothesis):* Do we block, warn, or discuss?

  5.  **Running the Procedure on the Three Cases:**

      *   *Case 1: Two Approvals on PRs.*
          *   Coordination: High (code ownership, knowledge sharing).
          *   Threat: Medium (bugs slip through).
          *   Scope: Universal? Maybe too slow for docs/typos.
          *   Sanction: Block merge?
          *   *Verdict:* Default with exceptions (e.g., docs), or Hard Rule for prod code. Let's see what the procedure says. High coordination cost suggests Tight. High threat suggests Tight. But innovation cost?
      *   *Case 2: Auto-formatting/Linting.*
          *   Coordination: High (diff readability).
          *   Threat: Low (code still runs).
          *   Scope: Universal.
          *   Sanction: Block CI.
          *   *Verdict:* Tight Scope, Tight Sanction (automated). Low cognitive load, high coordination benefit.
      *   *Case 3: Incident Runbook Improvisation.*
          *   Coordination: High (everyone needs to know what's happening).
          *   Threat: High (downtime costs money/reputation).
          *   *Tension:* Runbooks ensure safety (Tight), Improvisation ensures adaptation (Loose).
          *   *User Prior:* Allow improvisation.
          *   *Procedure Check:* High threat usually implies Tight. *However*, the "Threat" in incident management is *time-to-resolution*. Rigid adherence might increase time. The procedure needs to capture *dynamic* threats.
          *   *Correction:* The theory says high threat $\rightarrow$ tight norms. But in *emergency response*, the threat is uncertainty. Tight norms (runbooks) reduce uncertainty *unless* the situation is novel. This is a value trade-off: Safety vs. Speed. This is a "Value Handoff" point.

  6.  **Addressing the Limitations & Theory Adaptation:**
      *   *Societies vs. Companies:* Employees can quit (exit voice). Societies are sticky. Rules that are too tight cause churn.
      *   *Rules can be wrong:* Theory assumes norms evolve. Engineering standards are designed. Need a feedback loop.
      *   *Distinctions:* Kept Scope vs. Sanction. Dropped "Historical/Environmental Threat" (replaced with "Systemic Risk").

  7.  **Finalizing the Output Structure:**
      *   **Introduction:** Acknowledge the role and the hypothesis.
      *   **The Procedure:** Step-by-step questions, thresholds, and decision matrix.
      *   **The Test Run:** Apply to the 3 cases.
      *   **The Critique:** Theory adaptation, limitations, and the "Value Handoff."

  8.  **Self-Correction/Refinement during drafting:**
      *   *Check:* Did I answer the "Value Handoff" requirement? Yes, need to explicitly mark where the procedure stops and human judgment begins.
      *   *Check:* Did I address the "Scope vs. Sanction" hypothesis? Yes, validated it as useful.
      *   *Check:* Did I challenge the user on the Incident case? Yes, the theory suggests Tightness for high threat, but engineering reality suggests flexibility. I need to explain *why* the procedure might flag this as a value judgment.
      *   *Tone:* Professional, direct, principal-to-principal. No fluff.

  9.  **Final Polish:** Ensure the "20-minute" constraint feels real. The questions must be answerable without research. Ensure the "Stop with No" conditions are clear (i.e., when to default to Loose).

  *(Self-Correction on Case 3)*: If I strictly follow Gelfand's theory, high threat = tight norms. An incident is a high-threat situation. Therefore, theory suggests *following the runbook*. The user believes improvisation should be allowed. The procedure *should* contradict the user if it follows the theory strictly, OR it should identify this as a value trade-off (Process Adherence vs. Outcome Optimization). I will choose the latter: The procedure identifies this as a "Value Handoff" because the "Threat" is ambiguous (Threat of non-compliance vs. Threat of prolonged outage). This honors the user's request to be told plainly if it contradicts them. Actually, looking closer: If the runbook is known to be incomplete, the "Threat" is the outage. Adhering to a broken plan increases the threat. So the "Threat Assessment" question needs to be nuanced. I will frame it such that the procedure highlights the tension rather than giving a binary answer, forcing the leadership sign-off.

  *Wait, one more check:* The user asked: "tell me plainly if the procedure contradicts me." I need to be bold here. If the theory says "High Threat = Tight," and Incident = High Threat, then Theory = Tight Runbook. User = Loose Runbook. I must admit the contradiction *if* I stick to the theory, but explain why the procedure modifies it for engineering contexts.
  *Better approach:* The procedure distinguishes between *Safety Critical* (Tight) and *Exploratory/Uncertain* (Loose). Incident response is Safety Critical *but* high uncertainty. This is where the Scope/Sanction split helps. Scope: Tight (must engage incident process). Sanction: Loose (tactical decisions). I will use this nuance.

  *Final Plan:*
  1. Validate User's Hypothesis (Scope vs. Sanction is better than 1 dial).
  2. Build the "Norm Design Protocol".
  3. Run the 3 cases.
  4. Discuss Theory vs. Reality (Exit rights, Wrong rules).
  5. Explicitly address the Incident contradiction/nuance.

  Let's write it.cw
answer: |-
  ### Part 1: The Hypothesis Test
  **Is tightness one dial or two?**

  Your suspicion is correct. In the sociological literature, tightness is often treated as a single cultural trait. However, for engineering standards, treating it as a single dial leads to brittle policies.

  Decoupling **Scope** (how many situations the rule claims to cover) from **Sanction** (how hard we push back when it is violated) is necessary and robust.
  *   **High Scope / Low Sanction:** "We usually do X, but tell us if you don't." (Guidelines)
  *   **Low Scope / High Sanction:** "In this specific critical path, you must do X, or CI breaks." (Guardrails)
  *   **High Scope / High Sanction:** "Always do X, no exceptions." (Bureaucracy)

  **Verdict:** Build the procedure around this distinction. It prevents the common error of making everything a hard rule (High/High) which kills velocity, or everything a suggestion (Low/Low) which kills reliability.

  ---

  ### Part 2: The Norm Design Protocol
  **Time:** 20 Minutes
  **Input:** One proposed engineering practice.
  **Output:** A classification (Hard Rule, Default, Judgment) and a one-page justification.

  #### Phase 1: The Coordination & Threat Assessment (5 Minutes)
  *Answer these factually. If you cannot answer, you lack the data to decide.*

  **Q1: The Miscoordination Cost**
  If two engineers implement this practice differently on the same system, what happens?
  *   **A (Critical):** The system breaks, data corrupts, or security is breached.
  *   **B (Tax):** The code works, but it is harder to read, maintain, or merge later.
  *   **C (Neutral):** It makes no observable difference to the system or the team.
  *   *Sufficient Answer:* A, B, or C.
  *   *Stop Condition:* If **C**, stop. Do not make a rule. Leave to individual judgment.

  **Q2: The Threat Level**
  If this practice is ignored or done poorly, what is the blast radius?
  *   **A (Existential):** Customer data loss, regulatory fine, prolonged outage.
  *   **B (Operational):** Increased bug rate, slower onboarding, tech debt accumulation.
  *   **C (Aesthetic):** Code looks inconsistent, minor friction in review.
  *   *Sufficient Answer:* A, B, or C.

  #### Phase 2: Scope & Sanction Calibration (10 Minutes)
  *This translates Phase 1 into the two-dial model.*

  **Q3: Scope (Where does this apply?)**
  Based on Q1/Q2, how universal must this be?
  *   **Universal:** Applies to every commit/service/person.
  *   **Contextual:** Applies only to production code / customer-facing services / specific languages.
  *   **Optional:** Applies only if the team agrees it helps them.
  *   *Decision Rule:* If Q1 is **A** or Q2 is **A**, Scope must be **Universal** or **Contextual** (never Optional). If Q1/Q2 are **C**, Scope is **Optional**.

  **Q4: Sanction (How do we enforce?)**
  Based on Q1/Q2, what is the cost of deviation?
  *   **Hard Block:** CI fails or PR cannot be merged.
  *   **Soft Block:** PR requires explicit written justification + Senior approval.
  *   **Nudge:** Linter warning or comment in review, but merge allowed.
  *   **None:** No feedback mechanism.
  *   *Decision Rule:*
      *   If Q1 is **A** (System Breaks) $\rightarrow$ **Hard Block**.
      *   If Q1 is **B** (Tax) AND Q2 is **B** (Operational) $\rightarrow$ **Soft Block**.
      *   If Q1 is **B** (Tax) AND Q2 is **C** (Aesthetic) $\rightarrow$ **Nudge**.

  #### Phase 3: The Value Handoff (5 Minutes)
  *The procedure stops here. These are not facts; they are leadership bets.*

  **Q5: The Exit Risk**
  Will this rule make it significantly harder for a competent engineer to do their job?
  *   *If Yes:* You are trading autonomy for predictability. This requires Leadership Sign-off.
  *   *If No:* Proceed.

  **Q6: The False Positive Risk**
  Is there a known scenario where following this rule makes the outcome *worse*?
  *   *If Yes:* You cannot use a Hard Block. You must use Soft Block or Judgment. (This is where "Rules can be wrong" is mitigated).
  *   *If No:* Proceed.

  **Final Classification:**
  *   **Hard Rule:** Universal Scope + Hard Block. (Requires Q1=A or Q2=A).
  *   **Default:** Contextual Scope + Soft Block. (Requires Q1=B).
  *   **Judgment:** Optional Scope + Nudge/None. (Requires Q1=C).

  ---

  ### Part 3: Running the Procedure on Your Cases

  #### Case 1: Two Approvals on Every Pull Request
  *   **Q1 (Miscoordination):** **B (Tax).** One approval vs. two doesn't break the build, but increases risk of bugs slipping through and reduces knowledge sharing.
  *   **Q2 (Threat):** **B (Operational).** Bugs cost time to fix; bus factor risks onboarding.
  *   **Q3 (Scope):** **Contextual.** Production code needs it; documentation or config typos do not.
  *   **Q4 (Sanction):** **Soft Block.** CI enforces the count, but an override exists for emergencies.
  *   **Q5 (Exit Risk):** Moderate. Slows down high-performers.
  *   **Q6 (False Positive):** Yes. Sometimes a PR is trivial (typo) and two approvals is waste.
  *   **Verdict:** **Default.** (Contextual Scope + Soft Block).
  *   *Recommendation:* Enforce 2 approvals on `main`-bound code. Allow 1 approval for docs/chore branches via label override.

  #### Case 2: Enforcing Formatting and Lint Rules in CI
  *   **Q1 (Miscoordination):** **B (Tax).** Code runs either way, but diffs become noisy and cognitive load rises.
  *   **Q2 (Threat):** **C (Aesthetic)** for formatting, **B (Operational)** for lint (potential bugs).
  *   **Q3 (Scope):** **Universal.** No benefit to having inconsistent formatting in some files.
  *   **Q4 (Sanction):** **Hard Block.** It is cheap to fix automatically.
  *   **Q5 (Exit Risk):** Low. It removes decision fatigue.
  *   **Q6 (False Positive):** Low. Linters can be configured, but the *act* of linting is rarely wrong.
  *   **Verdict:** **Hard Rule.** (Universal Scope + Hard Block).
  *   *Recommendation:* CI fails on lint/format. Provide a pre-commit hook to make it frictionless.

  #### Case 3: Incident Runbook Improvisation
  *   **Q1 (Miscoordination):** **A (Critical).** If one engineer restarts the DB and another rolls back the deploy simultaneously without comms, the outage worsens.
  *   **Q2 (Threat):** **A (Existential).** Prolonged outage costs revenue and trust.
  *   **Q3 (Scope):** **Universal.** All incidents require a process.
  *   **Q4 (Sanction):** **Hard Block?** Here the procedure strains.
  *   **Q6 (False Positive):** **YES.** This is the critical failure point of the procedure. Runbooks are models of reality. If the reality diverges (novel failure), following the runbook *increases* the Threat (Q2).
  *   **Procedure Contradiction:** The procedure flags this as a **Hard Rule** (High Threat + High Miscoordination). **This contradicts your prior.**
  *   **Resolution:** Because Q6 is **Yes** (Known scenario where rule makes outcome worse), the procedure forces a downgrade from Hard Block to **Soft Block** or **Judgment**.
  *   **Verdict:** **Default with Judgment.** (Universal Scope + Soft Block).
  *   *Recommendation:* You must engage the Incident Process (Scope = Universal), but tactical steps are Judgment (Sanction = Soft). You must declare *why* you are deviating from the runbook in the incident channel, but you are not blocked from doing it.

  ---

  ### Part 4: Theory Adaptation & Limitations

  #### Distinctions Survived vs. Dropped
  *   **Survived:** **Scope vs. Sanction.** This was the critical adaptation. Sociological tightness usually implies both. Engineering needs the ability to have "Strict but Narrow" (e.g., Production Deploys) vs "Broad but Gentle" (e.g., Code Style).
  *   **Dropped:** **Historical/Environmental Threat.** The theory relies on centuries of famine/invasion to explain tightness. I replaced this with **Systemic Risk (Q2)**. You do not have centuries of data; you have incident reports and architecture diagrams.
  *   **Dropped:** **Socialization.** In societies, tightness is enforced by shame and upbringing. In engineering, it is enforced by CI and PR templates. The procedure assumes enforcement is technical, not social.

  #### Limitations: Societies vs. Companies
  1.  **Exit Rights:** In a society, deviance is punished by ostracization. In your company, deviance is punished by code comments. However, if you make the culture too Tight (High Scope/High Sanction on low-value items), engineers exercise their ultimate right: **they quit.** The procedure accounts for this in **Q5 (Exit Risk)**, but you must weigh this heavier than the theory does. A "Tight" rule on formatting is fine; a "Tight" rule on variable naming conventions might drive away seniors.
  2.  **Rules Can Be Wrong:** Sociological norms evolve over generations. Engineering standards are written by a committee on a Tuesday. They are often wrong.
      *   *Mitigation:* The procedure includes **Q6 (False Positive Risk)**. If a rule has known failure modes, it *cannot* be a Hard Block. It must allow for human override. This prevents the "automation of bad process."
  3.  **The Incident Contradiction:** You suspected the procedure might contradict your prior on improvisation. It did, initially. Strict Tight-Loose theory says "High Threat = Tight Norms." An incident is high threat, so theory says "Follow the Runbook."
      *   *Why the procedure corrected this:* Engineering is a **Cynefin Complex** domain, not just Complicated. In complex domains, cause-and-effect are only clear in retrospect. A runbook is a "Complicated" solution to a "Complex" problem. The procedure caught this via **Q6**. If following the rule increases the risk (Q2), the rule must loosen.
      *   *Advice:* Trust your prior here. The procedure supports you *only if* you acknowledge that rigid adherence to a runbook during a novel incident is a "False Positive" risk.

  #### What the Procedure Cannot Tell You
  *   **The Weight of Autonomy:** The procedure treats "Exit Risk" as a binary check. It cannot tell you if your specific team values autonomy more than safety. That is a cultural baseline you must know intuitively.
  *   **The Cost of Churn:** You mentioned decisions are "corrosive when churned." The procedure optimizes for the *current* state. It does not account for the fatigue of changing rules every month.
      *   *Fix:* Add a meta-rule: **Once a standard is set to Hard Rule, it requires a post-mortem to change.** Defaults can be changed monthly; Hard Rules require a quarterly review.
  *   **Political Capital:** A "Soft Block" requires senior engineers to actually read the notes and enforce the norm. If your senior engineers are disengaged, a Soft Block becomes a "None." The procedure assumes enforcement capacity exists. If it doesn't, you must downgrade the Sanction to match reality, or you create "Paper Tigers" (rules that exist but are ignored), which is worse than Loose norms.

  ### Summary Recommendation for You
  Use the **Scope/Sanction split**. It gives you the vocabulary to explain to leadership why formatting is a Hard Rule (Universal/Hard) while PR approvals are a Default (Contextual/Soft).

  For the Incident Runbook: Use the **Q6 False Positive** clause to justify your prior. Write in your one-pager: *"Strict adherence is a Hard Rule for known failures. For novel failures, adherence increases Threat (Q2). Therefore, Sanction is downgraded to Soft Block: Deviation is permitted but requires documentation."* This satisfies the theory (coordination is maintained) while satisfying your engineering reality (adaptation is required).
