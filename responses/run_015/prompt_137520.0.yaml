answer: |-
  First, congratulations. Over breakfast, you have independently rediscovered the **Tichý–Miller Theorem** (1974).

  For a decade after Karl Popper published his definition of *verisimilitude* (truthlikeness) in 1963, philosophers of science accepted an argument structure almost identical to your (1) and (2). Then, Pavel Tichý and David Miller simultaneously proved your step (3): that under Popper's definitions, no false theory is closer to the truth than any other. It caused a minor earthquake in the field.

  You are right that the conclusion (4) is intolerable for a practicing scientist, and you are right that (5) must be saved. Here is the breakdown of where the argument breaks, why it looked plausible, and the price of fixing it.

  ### The Break: Reject Step (2)

  You should reject the operational definition in **(2)**.

  Step (1) is the intuition (closeness depends on content). Step (3) is a valid theorem of classical logic (any false proposition entails infinitely many trivial truths and falsehoods). Step (5) is the empirical reality of science. Step (2) is the bridge that claims *logical entailment* is the correct metric for *scientific closeness*. That bridge collapses.

  **Why did (2) look all right?**
  It looks right because it appeals to a "counting" intuition. If Theory B predicts everything Theory A predicts, plus more, and makes no *new* errors, it feels like B is better. It treats theories as sets of sentences. In formal logic, a "stronger" theory entails more sentences. Popper assumed that if a theory is false, its "false content" would grow slower than its "true content" as it approached the truth. Tichý and Miller showed that for false theories, the false content grows just as fast as the true content via disjunctions (`T or h`).

  The error is treating all consequences as equal weight. In your field, a model that gets the alpha-helix backbone right but misplaces a side-chain is "closer" than one that gets the secondary structure wrong. But in the logic of (2), `Theory OR 2+2=5` counts as a consequence just as much as `Theory OR atom_position = (x,y,z)`. Step (2) lacks a mechanism to distinguish **relevant consequences** from **logical junk**.

  ### The Fix: Similarity, Not Entailment

  Your guess was correct: step (3) works because we are counting "junk disjunctions." But you cannot simply ban them by fiat without a rule. The modern solution (championed by philosophers like Ilkka Niiniluoto and Graham Oddie) is to shift from **Entailment** to **Similarity**.

  Instead of counting true/false sentences, we define a **logical space** of possible worlds (or states of affairs).
  *   The "Truth" is a specific point (or region) in that space.
  *   A Theory is another point (or region).
  *   **Verisimilitude is the distance between the Theory and the Truth.**

  In this framework, `T or h` does not move the theory's position in the logical space; it just creates a disjunctive region that is *further* from the truth or equally far, depending on the metric. This allows Newtonian mechanics to be "closer" to General Relativity (the truth, roughly) than Aristotelian physics is, because the *parameters* of Newton's equations are numerically closer to Einstein's in the relevant limit, even if Newton's theory is strictly false.

  ### The Price: There Is No View From Nowhere

  You asked: *Is there any way of cashing out "closer to the truth" that doesn't depend on such a choice [of relevant questions], and what it has to pay instead?*

  **The Answer:** No. You cannot cash out "closeness" without a metric, and you cannot have a metric without dimensions.

  **The Price:** **Language Relativity (or Framework Dependence).**

  To measure distance, you must decide what the dimensions of the space are.
  *   If you measure distance by *predicates* (e.g., "is round," "has gravity"), the result depends on which predicates you choose as primitive.
  *   If you choose the predicate "is flat," Flat Earth is distance 0 from Flat Earth.
  *   If you choose the predicate "is oblate spheroid," Flat Earth is distance 1 from Truth.
  *   Worse, if you choose a "gerrymandered" predicate like "is flat-or-true" (Goodman's "grue" problem), you can make False Theory A look closer than False Theory B simply by changing the vocabulary.

  To define verisimilitude, you must accept that **closeness is relative to a conceptual framework.** There is no framework-independent "God's eye" measure of truthlikeness.

  ### Why This Doesn't Undermine Science (The Structural Biologist's Defense)

  This sounds like a concession to relativism, but for a scientist, it isn't. Here is why:

  In your career, you never measured model quality by counting entailed sentences. You measured it by **RMSD (Root Mean Square Deviation)**.
  *   **The Space:** 3D Euclidean space (Angstroms).
  *   **The Truth:** The electron density map / the actual physical conformation.
  *   **The Theory:** The atomic coordinates in your PDB file.
  *   **The Metric:** Distance in Å.

  Does RMSD depend on a "choice of questions"? Yes. You chose to measure atomic positions. You could have chosen to measure "topological knotting" instead. A model could have perfect atomic positions but the wrong knot. However, the choice isn't *arbitrary*. It is constrained by the **causal structure of the domain**.

  The "price" of framework dependence is real, but the framework is not chosen by whim; it is chosen by **utility and ontology**.
  1.  **Ontology:** We believe atoms exist in 3D space. Therefore, 3D distance is a real metric, not just a linguistic convention.
  2.  **Utility:** A model with low RMSD predicts diffraction patterns better than one with high RMSD.

  ### Summary

  1.  **Reject (2).** It defines closeness via logical entailment, which is insensitive to *content relevance*.
  2.  **Accept the Tichý–Miller Theorem (3).** It correctly proves that logical entailment cannot do the job.
  3.  **Adopt a Similarity Metric.** Closeness is distance in a state-space, not set inclusion of sentences.
  4.  **Pay the Price.** Accept that verisimilitude is relative to a conceptual framework (a choice of primitive predicates or dimensions).
  5.  **Mitigate the Price.** The framework is constrained by the ontology of the world (e.g., spacetime, mass, charge) and the pragmatic success of the models (prediction).

  You spent forty years watching models get "less wrong." You were measuring verisimilitude the whole time; you just weren't using logical entailment to do it. You were using geometry. The philosophers got stuck on the sentences; you were looking at the structure. Trust the breakfast intuition that led you to (5); it was the structural biologist in you correcting the philosopher.
