  ### 1. The Logical Space

  Before arranging these into a flow, here are the nine binary claims (branch nodes) derived from your cases. A volunteer can agree or disagree with each without knowing the philosophical consequences.

  1.  **Authority:** The form creates a moral duty, not just evidence of what might be best.
  2.  **Competence:** A currently competent request always cancels the form.
  3.  **Continuity:** Severe psychological change (e.g. advanced dementia) makes the form void.
  4.  **Source:** The duty exists because the past self had a *right* to decide, not because they knew best.
  5.  **Symmetry:** Instructions to *demand* treatment bind us as tightly as instructions to *refuse* it.
  6.  **Anticipation:** The form only counts if the person imagined this specific medical situation.
  7.  **Time:** A 'sunset clause' (e.g. ignore after ten years) is morally valid.
  8.  **Ulysses:** A person can be held to a prior refusal even if they are currently competent and demanding treatment (provided they asked us to ignore such pleas).
  9.  **Religion:** Converting to a new religion counts as a change of self that voids the form.

  **Combinatorics:** With nine binary nodes, there are **512 (2⁹)** theoretical answer-combinations.
  **Reality:** Almost all are incoherent. For example, agreeing with *Authority* but also agreeing that *Competence*, *Continuity*, *Time*, and *Anticipation* all void it effectively amounts to disagreeing with *Authority*. Real philosophical views cluster into about five or six coherent 'leaves'.

  ***

  ### 2. The Decision Tree (For the Volunteers' Room)

  *Design note: To fit on A4, this tree prunes early. If you answer 'No' to Authority, the rest of the tree is irrelevant. If you answer 'Yes' to Competence Override, the specific continuity questions matter less.*

  **NODE 1: AUTHORITY**
  *"Does the signed form create a duty, or is it just a suggestion?"*
  *   **NO** → Go to **Leaf A**
  *   **YES** → Go to Node 2

  **NODE 2: COMPETENCE**
  *"If the person is currently competent, does their current wish cancel the form?"*
  *   **YES** → Go to Node 6 (Check specific constraints)
  *   **NO** → Go to Node 3

  **NODE 3: CONTINUITY**
  *"Does advanced dementia or severe psychological change make the form void?"*
  *   **YES** → Go to **Leaf B**
  *   **NO** → Go to Node 4

  **NODE 4: SOURCE**
  *"Does the form bind because they had a RIGHT to decide, or because they knew BEST?"*
  *   **KNEW BEST** → Go to **Leaf C**
  *   **RIGHT TO DECIDE** → Go to Node 5

  **NODE 5: SYMMETRY**
  *"Do demands for treatment bind us as tightly as refusals?"*
  *   **NO** → Go to **Leaf D**
  *   **YES** → Go to Node 7

  **NODE 6: CONSTRAINTS** (For those who think Competence usually overrides)
  *"Do Ulysses clauses or Sunset clauses prevent this override?"*
  *   **NO** → Go to **Leaf E**
  *   **YES** → Go to **Leaf F**

  **NODE 7: SPECIFICS** (For those who think Rights bind completely)
  *"Do Religion changes or Lack of Anticipation void the right?"*
  *   **YES** → Go to **Leaf G**
  *   **NO** → Go to **Leaf H**

  *(Note: Nodes 6 & 7 absorb the Anticipation, Time, Ulysses, and Religion distinctions to save space.)*

  ***

  ### 3. The Leaves (Positions & Commitments)

  **Leaf A: The Current Interest View**
  *   **Name:** The Current Interest View (often associated with Rebecca Dresser).
  *   **Awkward Commitment:** You must ignore the signed form even if the person is only temporarily confused, provided their current happiness suggests otherwise.

  **Leaf B: The Continuity View**
  *   **Name:** Unnamed (Variation on Psychological Continuity theories).
  *   **Awkward Commitment:** You must treat a person with dementia against their prior wishes, even if they explicitly wrote "ignore my later self" to prevent this.

  **Leaf C: The Epistemic View**
  *   **Name:** Unnamed (Paternalistic/Epistemic Authority).
  *   **Awkward Commitment:** You must follow the form even if you are certain the treatment they refused would have saved their life, simply because they were once in a better position to judge.

  **Leaf D: The Asymmetric View**
  *   **Name:** The Asymmetric View (Common in current law/ethics).
  *   **Awkward Commitment:** You must respect a refusal of life-saving treatment but can ignore a demand for the same treatment if resources or clinical judgment differ.

  **Leaf E: The Weak Authority View**
  *   **Name:** Unnamed (Soft Paternalism).
  *   **Awkward Commitment:** You must override a 'sunset clause' or 'Ulysses clause' if the person is currently happy, rendering those specific clauses morally powerless.

  **Leaf F: The Contractualist View**
  *   **Name:** Unnamed (Promise-Based).
  *   **Awkward Commitment:** You must restrain a currently competent person who is begging for treatment, because they previously signed a clause asking you to ignore such pleas.

  **Leaf G: The Modified Autonomy View**
  *   **Name:** Unnamed (Values-Based).
  *   **Awkward Commitment:** You must ignore the form if the person converts religions, implying their moral worth is tied to their specific belief system rather than their enduring identity.

  **Leaf H: The Precedent Autonomy View**
  *   **Name:** The Precedent Autonomy View (often associated with Ronald Dworkin).
  *   **Awkward Commitment:** You must deny tube feeding to a person with advanced dementia who is eating happily by hand, because the 'earlier self' has the right to decide how the 'later self' ends.

  ***

  ### 4. Indistinguishable Leaves

  **Flag:** The tree cannot separate **Leaf F (Contractualist)** from **Leaf H (Precedent Autonomy)** in practice.
  **Reason:** Both result in binding the later self against their current wishes.
  **What would separate them:** A question about *why* it binds. Leaf F binds because a promise was made (like a contract); Leaf H binds because autonomy is a critical interest that extends over time. To separate them, you would need to ask: "If they signed the form under mild pressure, is it still binding?" (Contract says No; Autonomy might say Yes).

  ### 5. Unoccupied Combinations

  **Empty Cell:** Authority = **Yes** + Competence = **Overrides** + Continuity = **Voids** + Time = **Voids** + Anticipation = **Required**.
  **Why:** This combination is incoherent. It claims the document is "binding" but lists so many defeaters (competence, dementia, time, surprise) that it functions exactly as if it were "not binding" (Leaf A).
  **Clinician Reality:** This is arguably what most clinicians quietly do. They treat the form as "Authoritative" in principle to respect the family, but find a practical defeater (e.g., "they didn't anticipate this exact infection") to prioritise the patient's current comfort.

  ### 6. Volunteer Test

  **Volunteer 1:** *"If she's happy now, the form is just a piece of paper."*
  *   **Path:** Disagrees with **Node 1 (Authority)**.
  *   **Lands on:** **Leaf A (Current Interest View)**.
  *   **Fit:** Yes. This volunteer treats the form as evidence of past wishes but subordinate to current well-being.

  **Volunteer 2:** *"She signed it when she was still herself; happiness isn't the point."*
  *   **Path:** Agrees with **Node 1 (Authority)** → Agrees with **Node 3 (Continuity: No, it doesn't void)** → Agrees with **Node 4 (Source: Right to decide)**.
  *   **Lands on:** **Leaf H (Precedent Autonomy View)**.
  *   **Fit:** Yes. This volunteer prioritises the critical interests of the earlier self over the experiential happiness of the later self.

  ***

  ### 7. Notes on Distinctions (Constraint 3 Check)

  *   **Authority vs Evidence:** Captured in Node 1. (Does work).
  *   **Source (Right vs Best):** Captured in Node 4. (Does work).
  *   **Continuity (Gradual vs Threshold):** The tree forces a **Threshold** choice at Node 3. A "Gradualist" view (authority fades slowly) has no leaf; they would have to hover between Leaf A and Leaf H.
  *   **Competence:** Captured in Node 2. (Does work).
  *   **Anticipation/Time/Religion:** Captured in Nodes 6 & 7. (Does work, though grouped).
  *   **Refusal vs Demand:** Captured in Node 5. (Does work).

