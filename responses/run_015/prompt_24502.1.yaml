      *   **The Note's Instructions:** Explicitly mention his request. This builds trust with the audience. It shows *he* knew how people perceived him.
      *   **Defining the Belief (The "Discipline"):** This is the crux. Explain that for him, it wasn't a rallying cry to burn the system down. It was a check on his own power.
          *   *Idea:* If you believe the money belongs to the person until proven otherwise, you audit differently. You check your math twice. You don't bully.
          *   *Idea:* He hated the word "theft" being used for traffic tickets or parking fines. He saved it for what mattered.
      *   **The Colleagues:** Address them directly. Acknowledge their bewilderment but reframe it as respect. He showed up. He did the job. Why? Because the rule of law matters even if you disagree with the law.
      *   **The Family/Friends:** Acknowledge the consistency. He was the same man at the dinner table as he was at the desk.
      *   **Closing:** Bring it back to love and memory. The legacy isn't the politics, it's the integrity.

