answer: |-
  Good morning. Thank you all for being here.

  For those who didn't know my father well, the headline of his life looks like a contradiction. He died on Tuesday at seventy-three. For thirty-one of those years, he was a state tax auditor. For all of those years, he was also a libertarian who believed, firmly and without apology, that taxation is theft.

  I know that for many of his colleagues in the room, this was a source of enduring bewilderment. I know that for his friends who shared his politics, it was a source of occasional frustration. And I know that for my family, it was simply the background radiation of our lives—the hum of a man who thought deeply about where his paycheck came from and what it meant.

  Before he died, he left a note about this speech. He gave me two instructions. First, he said I must not stand here and declare his slogan a settled truth. He knew that the claim only works if you first accept a specific theory of property, and he knew that much of this room does not accept that theory. He would have called pretending otherwise "sloppy."

  Second, he said I must not soften the slogan into a harmless quirk, a phase, or a eccentricity. He said the conviction was the organizing principle of his life, and to call it anything less would be a lie. He would have called that "evasive."

  So, I am going to try to do what he asked. I am not going to ask you to agree with him. And I am not going to tell you he was just being colorful.

  For my father, "taxation is theft" was not a rallying cry to burn down the building he worked in. It was a discipline. It was a check on his own power.

  In his view, words matter. He hated the looseness with which we use moral language. He believed that if you call a parking fine "theft," you dilute the meaning of the word until it no longer protects you when something actual is taken. He reserved the word for what he believed was fundamental. And because he believed the money on his desk belonged, by right, to the person whose name was on the file, he treated every audit with a specific kind of gravity.

  There are auditors who see a file and see revenue. My father saw a file and saw a rights-bearing individual who was currently on the wrong side of a statute.

  This didn't make him a saboteur. He showed up. He did the math. He enforced the law as it was written, not as he wished it were written. But he enforced it with a humility that I believe came directly from his politics. Because he believed the state's claim to that money was morally complicated, he made sure his technical claim to it was flawless. He never bullied. He never obscured the rules. He explained the code, he showed the work, and he gave the taxpayer the benefit of every doubt the statute allowed.

  He took the rights of the individual seriously, even when the individual was standing in his office, nervous, holding an envelope he couldn't afford to open.

  To his colleagues: I know it was strange to work alongside a man who questioned the moral foundation of your shared workplace. But I hope you can see now that his dissent wasn't a rejection of you. It was a commitment to integrity. He believed that you can serve a system without worshipping it. He believed that doing your job well, even when you disagree with the premise of the job, is a form of honor. He respected the rule of law enough to follow it, even when he wished the law were different.

  To his friends who shared his views: He never compromised the principle. He never let it become a joke at the dinner table. But he also never let it make him bitter. He found a way to live in the tension. He proved that you can hold a radical idea and still be a gentle man.

  And to my family: We lost a man who listened to us the way he listened to a complex code—carefully, looking for the intent, not just the letter. He loved us with the same precision he applied to his work. He wanted our lives to be our own.

  In the end, my father wasn't asking us to agree that taxation is theft. He was asking us to agree that theft is wrong. He was asking us to be careful with our words, to be careful with our power, and to remember that behind every form, every fee, and every statute, there is a person who owns their own life.

  He lived in a paradox, but he lived in it honestly. He didn't ask us to resolve it for him. He just asked that we not lie about it now that he's gone.

  He was a good auditor. He was a good libertarian. But mostly, he was a good man. And we will miss him.
