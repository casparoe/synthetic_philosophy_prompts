      *   **The Tone:** Warm, comforting, honest, affectionate, understanding. Not a political speech or lecture.
      *   **The Core Message:** The slogan wasn't a demand for agreement, but a *discipline*. A refusal to use "theft" loosely, and a way to take individual rights seriously even when auditing someone.
      *   **Goal:** Something he would consider honest (not flattering, not evasive).

  2.  **Determine the Angle/Theme:**
      *   The central tension is the paradox: A tax auditor who believed taxation was theft.
      *   The resolution isn't to solve the paradox, but to explain the *integrity* within it.
      *   Key concept: "Discipline." He didn't use his belief to slack off or sabotage; he used it to be *more* rigorous and humane.
      *   Key concept: "Precision." He cared about words and definitions.
      *   Key concept: "Respect." He treated the taxpayer as a rights-bearing individual, not just a revenue source.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, the date, and the immediate tension in the room. Validate the confusion colleagues might feel.
