answer: |-
  Here is the conceptual map of desiderata for a theory of conscious experience, stripped of the usual historical baggage.

  ### I. The Phenomenal Constraints (The Data)
  A theory must accommodate these without explaining them away as "mistakes" unless it provides a mechanism for why the mistake is structurally inevitable.

  1.  **Change Blindness:** The system must explain how subjective richness persists despite massive informational loss. The constraint is not just that we miss changes, but that we *feel* like we didn't until the change is pointed out.
  2.  **The Introspective "Fridge-Light" Problem:** When you introspect, consciousness is always found "on." You never catch it turning on. A theory must explain the *asymmetry*: why the act of checking guarantees a positive result, masking the latency of the check itself.
  3.  **Split-Brain Disunity:** One skull can generate two distinct, non-communicating streams of report and intent. A theory must accommodate disjointed agency without positing two souls or denying the validity of the reports from either hemisphere.
  4.  **Temporal Binding:** Visual processing is slower than auditory processing, yet a clap looks and sounds simultaneous. The theory must explain the "window of simultaneity"—how the brain waits for slow data without the subject feeling the delay.
  5.  **Discrete Processing vs. Continuous Flow:** Saccades, neural oscillations, and attentional blinks suggest processing is chunked. Experience is smooth. The theory must bridge the gap between stuttering hardware and streaming software.

  ### II. The Conceptual Distinctions (The Boundaries)
  A theory cannot collapse these distinctions without losing explanatory power.

  1.  **Access Consciousness vs. Phenomenal Consciousness**
      *   *The Constraint:* You must be able to model a system that processes info for use (Access) differently than a system that *feels* something (Phenomenal).
      *   *Why it's real:* Blindsight patients have Access without Phenomenal. Anesthesia may reverse this (debated). If a theory collapses them, it cannot explain why a zombie twin is conceptually distinct from a conscious agent, even if physically identical.
  2.  **Error About the World vs. Error About Experience**
      *   *The Constraint:* I can be wrong that the stick is bent (world), but I cannot be wrong that the stick *looks* bent (experience).
      *   *Why it's real:* This is the "incorrigibility of the seemings." A theory must locate where the veridicality of the *appearance* is secured, even when the *content* is false. If you deny this, you deny the data of phenomenology itself.
  3.  **Narrative Center of Gravity vs. Experiential Center**
      *   *The Constraint:* The story I tell about myself changes (Narrative), but the locus from which the story is heard feels constant (Experiential).
      *   *Why it's real:* Memories fade and personalities shift, but the "witness" quality remains invariant. A theory that reduces the witness to *only* the narrative cannot explain the pre-linguistic sense of ownership in infants or animals.

  ### III. Constraint Status: Non-Negotiable vs. Negotiable

  **Non-Negotiable (The theory breaks if it ignores these):**
  *   **The Temporal Binding Window:** The hardware latency is physical fact; the simultaneity is phenomenal fact. Both must be accounted for.
  *   **The Incorrigibility of Seemings:** You cannot tell a subject they are wrong about how things feel to them.
  *   **Split-Brain Reports:** You cannot claim the hemispheres are "lying" or "confabulating" in a way that dismisses their disjointed agency.

  **Negotiable (The metaphysics can shift here):**
  *   **The Reality of the "Self":** Whether the "I" is a real entity or a user-illusion is up for grabs, provided the *function* of the "I" is explained.
  *   **The Continuity of Time:** Whether time is fundamentally continuous or constructed from discrete snapshots is negotiable, provided the *feel* of continuity is generated.
  *   **The Location of Experience:** Whether experience is "in the head," "extended," or "non-local" is negotiable, provided the causal link to behavior is maintained.

  ### IV. The Hard Part: Joint Unsatisfiability
  **The Tension:** Can you deny a central observer and still explain the *frustration* of the introspective gap?

  **The Conflict:**
  If there is no central observer (no "Cartesian Self"), then the "gap" in introspection is just missing data. Missing data does not feel like anything. However, the introspective gap *feels* like a failure to locate something that should be there.
  *   **Option A (Realist):** There is a center. This satisfies the "feel" of the gap but violates neuroscience (no neural locus) and creates an infinite regress (who watches the watcher?).
  *   **Option B (Illusionist):** There is no center. This satisfies neuroscience but fails to explain why the *absence* of a center feels like a specific kind of mystery rather than nothing at all.

  **The Unsatisfiable Subset:**
  You cannot jointly satisfy **(1) No Homunculus**, **(2) The Incorrigibility of Seemings**, and **(3) The Specific Phenomenology of the Gap**.
  *   If (1) is true, the "feeling" of a gap in (3) is an error.
  *   If (2) is true, the subject cannot be in error about the feeling of the gap.
  *   Therefore, if the subject feels a gap, and cannot be wrong about that feeling, there must be something that *has* the feeling. If there is no homunculus, what is the substrate of that feeling?

  ### V. Model Scoring (Failures Only)

  **Cartesian Theater**
  *   **Fails:** **Temporal Binding.** It implies a single "now" where everything arrives, which contradicts the known latency differences in neural pathways.
  *   **Fails:** **Split-Brain Cases.** It cannot account for two distinct centers of awareness in one skull without positing two theaters (which defeats the "single self" premise).
  *   **Fails:** **Discrete Processing.** It requires a continuous feed of data to the screen, which neurophysiology does not support.

  **Multiple Drafts Model (Dennett)**
  *   **Fails:** **Incorrigibility of Seemings.** It treats the subject's report on their experience as just another "draft," making the subject potentially wrong about their own phenomenology.
  *   **Fails:** **The Phenomenology of the Gap.** It explains why we *say* there is a gap, but dismisses the *qualitative feel* of the gap as a confusion, violating the constraint that the feeling itself is data.
  *   **Fails:** **Experiential Center vs. Narrative.** It collapses the Experiential Center entirely into the Narrative, failing to account for the pre-narrative sense of presence (the "witness" prior to the "story").
