      *   **Target Audience:** High school students (16-17 years old), advanced philosophy seminar.
      *   **Topic:** Buddhist *anatta* (no-self), specifically the tension between the feeling of continuity and the reality of change (five aggregates).
      *   **Constraints:** 90 minutes, 15 students, regular classroom, limited materials (paper, tokens, whiteboard), no prior reading.
      *   **Goal:** An experiential game/activity where students *feel* the tension of maintaining identity amidst change, not just hear about it.
      *   **Mechanics:**
          *   3 groups ("Custody Committees") of 5 students.
          *   5 Aggregates represented as cards/departments (Form, Feeling, Perception, Mental Formations, Consciousness).
          *   Hidden dependency rules (changing one affects others unpredictably).
          *   Stakes: Points determining discussion topic or snack budget.
          *   Voting on continuity/privileges based on invented criteria.
          *   Rules must undermine essentialist criteria.
      *   **Debrief:** Map gameplay to Buddhist analysis, acknowledge limitations (first-person immediacy), predict failure modes (refusal to dissolve, narrative vs. metaphysical confusion).
      *   **Constraint:** No opening lecture on *anatta*; the concept must emerge from play.

  2.  **Deconstruct the Philosophy:**
      *   *Anatta* isn't just "change"; it's the lack of a *controller* or *owner* behind the change.
      *   The Five Aggregates (*Skandhas*):
          1.  *Rupa* (Form/Body)
          2.  *Vedana* (Feeling/Sensation)
          3.  *Sanna* (Perception/Recognition)
          4.  *Sankhara* (Mental Formations/Volition/Habits)
          5.  *Vinnana* (Consciousness/Awareness)
      *   The "Ship of Theseus" problem is relevant but needs to be more dynamic.
      *   The "Practical Fiction" aspect: We act *as if* there is a self for social coordination, even if metaphysically there isn't one.

  3.  **Drafting the Game Mechanics:**
      *   *Name:* Needs to be neutral. "The Continuity Protocol" or "Project Identity." Let's go with "The Continuity Protocol."
      *   *Setup:* 3 Committees (Alpha, Beta, Gamma). Each manages a "Subject" (Subject A, B, C).
      *   *Materials:* 5 colored cards per Subject (representing Aggregates). Tokens (currency). Whiteboard for scores.
      *   *Rounds:* 4 Rounds of 15 minutes each.
      *   *The Twist:* The cards change. The students must decide if the Subject is "the same" to keep earning tokens.
      *   *Hidden Dependencies:* If Form changes, Consciousness *might* flip. If Feeling changes, Perception *might* duplicate. This creates chaos.
      *   *The Vote:* Committees vote on whether their Subject retains "Status." If Status is lost, they lose future earning potential.
      *   *The Criteria:* They must write down *why* it's the same subject. The Facilitator (Game Master) will use these criteria against them in the next round based on the hidden rules.

  4.  **Refining the "Undermining" Mechanism:**
      *   How to stop them from finding an essence?
      *   If they say "Memory is key" (Perception/Consciousness), the Game Master swaps the Perception card but keeps Consciousness.
      *   If they say "Body is key" (Form), the Form card gets swapped.
      *   *Crucial Mechanic:* The "Intervention Deck." The Facilitator draws cards that force changes on the Aggregates.
      *   *Stakes:* Tokens = Snack Budget/Topic Choice.
      *   *Interdependence:* To keep a card, you might have to sacrifice another. This mimics *Pratityasamutpada* (Dependent Origination) without naming it.

  5.  **Structuring the 90 Minutes:**
      *   0-10 min: Setup & Rules (No philosophy talk).
      *   10-55 min: Gameplay (4 Rounds).
      *   55-75 min: Debrief (Connecting to *Anatta*).
      *   75-90 min: Open Discussion/Conclusion.

  6.  **Developing the Debrief:**
      *   Need to connect the frustration of the game to the Buddhist view.
      *   Address the "First-Person" gap: The game is third-person (managing a Subject). Buddhism is about first-person realization.
      *   Predict failure modes: Essentialism clinging, narrative fallacy.

  7.  **Addressing Specific Constraints:**
      *   *No prior reading:* Rules must be simple enough to explain in 10 mins.
      *   *Hidden Rules:* Facilitator needs a cheat sheet.
      *   *Stakes:* Real stakes (snacks/topics) make the "practical fiction" real. They *need* the Subject to function to get the reward.

