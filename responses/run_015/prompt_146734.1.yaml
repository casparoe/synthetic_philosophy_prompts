      *   *The "Trap":* The Facilitator must act like a chaotic universe, not an adversary. "The Universe" dictates changes.

  9.  **Finalizing the Game Design:**
      *   **Title:** *The Continuity Protocol*.
      *   **Components:** 15 Aggregate Cards (5 sets of 5), Token Economy, Intervention Deck.
      *   **Win Condition:** Maximize tokens for the group.
      *   **Loss Condition:** Declaring a Subject "Dead" (loses all future tokens).
      *   **The Kicker:** At the end, reveal that the "Subjects" were empty clusters all along.

