          *   Statue = The Domain Aggregate (Logic Layer) enforcing invariants.
          *   *Coincidence:* They share the same Event IDs.
          *   *Squashing:* A change in schema or business rule that renders the Aggregate "dead" or "invalid" while the bytes remain.

      *   *Attempt 3 (Focusing on Identity & Lifecycle):*
          *   In ES, an Aggregate ID identifies a stream.
          *   Can two Aggregates share a stream? No, that violates bounded contexts usually.
          *   Can one stream support two different lifecycle interpretations? Yes (Projections).
          *   *Mapping:*
              *   **Clay:** The Immutable Event Stream (identified by Stream ID). It persists as long as the storage persists.
              *   **Statue:** The Aggregate Instance (identified by Aggregate ID + Type). It persists only as long as its invariants hold.
              *   **Spatial-Part Relation:** Event Membership (Stream ID = Aggregate ID). Every event in the stream belongs to the aggregate.
              *   **Squashing Event:** A `Deactivated` event or a Schema Migration that changes the interpretation of past events such that the Aggregate is considered "closed" or "void," while the Stream remains readable.
