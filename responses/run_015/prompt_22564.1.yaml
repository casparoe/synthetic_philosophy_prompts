answer: |-
  This debate recapitulates the classic exchange between Frank Jackson (the originator of the Knowledge Argument) and his critics, most notably David Lewis and Laurence Nemirow (proponents of the Ability Hypothesis). To referee this, we must distinguish between the *epistemic* progress Mary makes and the *ontological* commitments required to explain it.

  **Move 1: The Inference from Learning to Facts**
  The first speaker claims that because Mary learns something, she must learn a new *fact*. The second speaker objects that this slides from "learning something" to "learning a new fact."
  *   **Assessment:** The **second speaker** is logically correct here. There is an equivocation on the term "knowledge." In epistemology, a distinction is drawn between *propositional knowledge* (knowledge-*that*) and *non-propositional knowledge* (knowledge-*how* or acquaintance). The premise "Mary knows all physical facts" refers to propositional knowledge. The conclusion "Mary learns something new" is compatible with her gaining a new ability or a new mode of acquaintance without adding to the set of true propositions describing the world. The first speaker assumes without proof that all knowledge is propositional.

  **Move 2: The Charge of Question-Begging**
  The first speaker counters that describing the "ability" (e.g., to recognize or imagine red) presupposes the phenomenal content Mary lacked, making the ability hypothesis circular. The second speaker replies that this only constrains how the ability is described, not what exists in the world.
  *   **Assessment:** The **first speaker** identifies a genuine difficulty for the Ability Hypothesis (often called the "Phenomenal Ability Objection"): if the ability is defined physically (e.g., discriminating wavelengths), Mary already had it; if defined phenomenally (e.g., recognizing *this* quality), it seems to reference the very nonphysical fact in question. However, the **second speaker** is right that this difficulty in *description* does not entail an ontological conclusion. Difficulty in formulating a physicalist account does not automatically validate dualism. The second speaker correctly maintains that the burden of proof lies on showing the "something learned" *must* be a fact about the world, not just a fact about Mary's cognitive architecture.

  **What Both Are Missing: The Cognitive Relation**
  Both colleagues are stuck in a dichotomy: either Mary learns a new ontological fact (First Speaker) or she learns nothing factual at all, only an ability (Second Speaker). Both miss the nuanced middle ground provided by the **Phenomenal Concept Strategy**.
  What Mary acquires is a new *cognitive relation* to an old physical fact. She gains a *phenomenal concept* that allows her to grasp a physical state of affairs (a brain state) in a direct, first-person way that was impossible from the third-person physical description. This explains the epistemic progress (a new mode of presentation) without requiring new nonphysical facts (ontology remains physical). The first speaker mistakes the new *concept* for a new *referent*. The second speaker dismisses the new *mode of grasp* as merely an "ability," underestimating the cognitive significance of acquiring a new concept.

  **Final Evaluation**
  The first speaker fails to bridge the gap between epistemic change and ontological change. The second speaker successfully blocks the inference to nonphysical facts, even if their "ability" formulation faces descriptive challenges. Since the prompt asks who is right about the argumentative exchange regarding the establishment of nonphysical facts, the second speaker correctly identifies the logical flaw in the first speaker's deduction.

  \answer{second speaker}
