answer: |-
  Here are nine interview questions designed to navigate around your guest's standard defenses, along with her likely responses and a follow-up to press the point.

  **1. The Argument and the Thermometer**
  **Question:** You've moved away from the original "Parity Principle" as a proof, calling it more of a hint. So, what is the actual engine of the argument now? If the core test is simply that an external tool functions like a biological process, doesn't that prove too much? For instance, a thermometer functions like a sense organ—it gives me reliable temperature data I couldn't get otherwise. Why isn't the thermometer part of my sensory system in the same way the notebook is part of my memory?
  **Likely Answer:** She will likely say that the thermometer isn't integrated into her *cognitive processes* in the same way. It provides input, but it isn't used to manipulate information or guide decision-making automatically the way memory is.
  **Follow-Up:** But that distinction relies on us already knowing where the "cognitive process" begins and ends. If I use the thermometer to decide whether to wear a coat, I'm manipulating that data to guide a decision. At what point does "providing input" become "thinking," and isn't drawing that line just assuming the answer we want?

  **2. Coupling vs. Constitution**
  **Question:** A common objection is that you are confusing *using* a thing with *being* the thing. A carpenter is tightly coupled to their hammer while working, but we don't say the hammer is part of the carpenter. What is a non-circular way to explain the difference between a tool that is merely coupled to a mind and a tool that actually constitutes part of the mind?
  **Likely Answer:** She will likely argue that the hammer is not "trusted" or "automatically endorsed" in the way a memory trace is; the carpenter checks the hammer, whereas we don't usually "check" our memories before using them.
  **Follow-Up:** But we do check our memories when we are unsure. If I have to pause and verify a fact in my notebook, does it stop being part of my mind during that pause? If the boundary shifts depending on how much I trust the tool in the moment, is the mind a stable thing at all?

  **3. Cognitive Overflow**
  **Question:** Let's look at scale. If reliance makes something part of the mind, what happens with massive systems? If a mathematician relies entirely on a supercomputer to solve equations, does that supercomputer become a part of her head? Or, looking at it the other way, does she become just a tiny component of the supercomputer's mind?
  **Likely Answer:** She will likely say it depends on the direction of control and the history of the system. The mathematician is the agent initiating the process, so the computer is the extension, not the other way around.
  **Follow-Up:** But if the computer is doing the actual processing, why does the "initiation" matter? If we accept that cognition is distributed, why do we get to privilege the human biological starter-button as the "owner" of the mind?

  **4. Trust and Psychology**
  **Question:** Your criteria include "trust" and "automatic endorsement." But trust is a feeling inside the head. If a person completely trusts a horoscope to plan their day, does that horoscope become part of their cognitive system? Conversely, if I use a notebook I half-distrust, is it excluded?
  **Likely Answer:** She will likely clarify that the resource must be *actually* reliable, not just believed to be reliable. The horoscope fails the reliability test, even if the subject trusts it.
  **Follow-Up:** So the boundary of my mind depends on facts about the world I might not know? Can I have a part of my mind that I don't know is part of my mind, or lose a part of my mind because a tool broke, without realizing my mind has shrunk?

  **5. Overlapping Minds**
  **Question:** Imagine two researchers who have jointly maintained a single external database for years. They can both retrieve entries the other authored, and neither can remember who wrote what. If that database is part of a mind, whose mind is it? Are we committed to saying they share one single mind that overlaps?
  **Likely Answer:** She will likely embrace this and say yes, cognitive systems can overlap. There is no rule that says there must be exactly one mind per biological human.
  **Follow-Up:** If minds can overlap, does "personhood" overlap too? If one of the researchers dies, does the survivor lose a piece of their own mind, or does a portion of the deceased's mind continue to live on in the survivor?

  **6. The Cloud and Control**
  **Question:** Consider a modern case: someone relies on a cloud-hosted assistant they trust completely. They can't inspect its code, and the provider can silently update it overnight. If the provider changes what the system tells the user the next morning, has the user's belief been rewritten while they slept?
  **Likely Answer:** She will likely say yes, this is a genuine vulnerability of the extended mind. Your cognitive state is dependent on the integrity of the external resource.
  **Follow-Up:** If a third party can rewrite your beliefs by editing a server while you sleep, are they hacking a device or assaulting a person? Does your view imply we need new laws to protect the integrity of external memory as if it were biological brain tissue?

  **7. Consciousness**
  **Question:** Does this thesis extend to consciousness itself? Can a feeling or a sensation be extended into the world, or is this only about cold calculation and memory?
  **Likely Answer:** She will likely deny that consciousness extends, arguing that qualia (subjective feelings) are biological, even if cognitive processing is not.
  **Follow-Up:** But if the processing is the same whether it's in the head or in the notebook, why does the feeling stop at the skull? Are you keeping consciousness biological just to save our intuition that the mind is private, even if the logic of your view suggests otherwise?

  **8. Empirical Settlement**
  **Question:** You argue this is an empirical question about how cognition is distributed, not a metaphysical one. What specific experiment would settle the dispute? What observable difference is there between a resource being *part* of a memory system versus just being *coupled* to one, and who is in a position to detect it?
  **Likely Answer:** She will likely point to neuroscience, suggesting that if using the notebook activates the same brain regions as biological recall, that counts as evidence of integration.
  **Follow-Up:** But using a map activates navigation centers in the brain, yet we don't say the map is the brain. If the brain treats external tools as inputs, doesn't that prove they are *outside* the system being measured, rather than part of it?

  **9. Real-World Consequences**
  **Question:** Finally, does this have consequences outside the seminar room? If confiscating a subject's long-standing external store is disrupting their mind, is that more like an assault than a theft? Is an hour without a smartphone a temporary cognitive impairment?
  **Likely Answer:** She will likely agree that our ethical and legal frameworks need to update to reflect the reality of cognitive integration.
  **Follow-Up:** But until those frameworks update, are we currently walking around with parts of our minds that are legally protected only as property? If my phone is my memory, does smashing it count as brain damage in the eyes of the law, or just vandalism?
