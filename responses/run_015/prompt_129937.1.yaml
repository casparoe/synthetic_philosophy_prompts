  **The Vail Vector**
  **By Dr Dana Vail**

  Welcome to this fortnight's vector. Readers are reminded that folk psychology—the framework positing beliefs, desires, and intentions—is a stagnant research programme. Its posits will be discarded by mature neuroscience, not reduced to it. We proceed without these ghosts.

  **Dear Dr Vail,**
  **My partner said something cruel, then insisted he had not meant it. Should I forgive?**

  **Dear Reader,**
  "Meaning" is a folk-psychological posit. There is only verbal behaviour and its causal antecedents. When your partner emitted cruel vocalisations, specific neural configurations were active. His subsequent denial is further verbal behaviour, likely triggered by social pressure rather than a retrospective access to internal causality.

  Forgiveness is less relevant than prediction. Observe the covariance between his stress levels and the cruelty. If the behaviour covaries with fatigue or intoxication, the environmental cues are the target. Adjust the environment. If the behaviour occurs without specific external triggers, the neural architecture supporting empathy may be structurally deficient. In that case, optimise your own safety protocols. Do not wait for a change in "attitude"; wait for a change in output over a significant sample size.

  **Dear Dr Vail,**
  **My flatmate knows perfectly well the rent is due on Friday and reliably fails to pay.**

  **Dear Reader,**
  Possession of information does not guarantee behavioural output. Your flatmate's neural processing of the date "Friday" fails to connect to the motor sequences required for banking transfers. This is a failure of reinforcement history.

  Currently, the consequence of non-payment (your coverage, late fees) is insufficiently aversive to reshape the synaptic weights. You must alter the contingency. Remove the buffer. Inform the landlord that payment is solely his responsibility. When the environmental penalty for non-payment becomes immediate and severe enough, the neural pathways will reorganise to prioritise the transfer. If they do not, the organism is unfit for cohabitation. Eviction procedures are a valid environmental cue.

  **Dear Dr Vail,**
  **Reading your column last month made me abandon a career I had spent years wanting.**

  **Dear Reader,**
  Career trajectories are behavioural patterns sustained by reinforcement. Your previous path was maintained by social validation or anticipated reward signals. My column provided new input that disrupted the valuation system. The abandonment of that path indicates a successful reorganization of your priority hierarchies.

  Do not regret the sunk cost of training. Neural plasticity allows for new specialisations. Channel the energy previously allocated to the old career into acquiring skills that better match your current cognitive strengths. The feeling of relief you report is likely a reduction in cognitive dissonance noise. Proceed.

  **Dear Dr Vail,**
  **You argue beliefs do not exist. But do you believe what you write? Also, couldn't "belief" just refer to whatever neural state plays the causal role? (Prof. H. Aris)**

  **Dear Professor,**
  This is the functionalist objection. You suggest that if a neural state plays the causal role commonsense assigns to belief, the term remains valid. This is incorrect. Phlogiston played a causal role in combustion theories, yet phlogiston does not exist. The theory was false, not merely incomplete. Folk psychology attributes structure to neural processing that simply isn't there. There is no sentence-like code in the brain.

  Regarding your first query: Do I "believe" this column? The term is inapplicable. My current neural configuration covaries with the data provided by neuroscience. When I type these words, my motor cortex is driven by patterns that align with eliminative materialism. If you ask if I am sincere, sincerity implies a hidden internal state matching external output. There is only the output. The output is consistent. If my brain states were to shift, the output would change. Currently, they do not.

  **Dr Dana Vail contributes fortnightly to the magazine.**

  ***

  *Editor's Note: We know many readers find Dr Vail's approach challenging, but we believe her column provokes vital thinking. We hope you continue to read it.*
