  **The findings I am relying on**

  This recommendation turns on three specific data points. First, our clinic registry of twelve hundred patients shows that since the criteria leaked, the reported phenotype has shifted: cognitive complaints have risen, exertional symptoms have fallen, and onset is increasingly dated to childhood. Second, the Nordic framework adopted a near-identical category years ago; their incidence has tripled without withdrawal, suggesting stability is possible despite drift. This indicates that high incidence does not necessarily require withdrawal, provided outcomes are monitored. Third, the label is already in active use by GPs, insurers, and schools. Conversely, this recommendation does not rely on the competing proposal for a two-marker inflammatory panel. That assay rests on a single un-replicated study with modest sensitivity, and making inclusion contingent on it would exclude the majority of patients currently managed under this label. We must work with the clinical picture we have, not the biomarker we wish we had.

  **Why the looping does not settle the question**

  The concern that classification changes the thing classified is valid, but it does not dictate rejection. Because the label is already in circulation, looping is occurring regardless of our vote. Patients are already adjusting their self-understanding, and clinicians are already adjusting their assessments, as evidenced by the shorter assessment times and shifting symptom profiles in our registry. The question is not whether to prevent looping, but which pattern of shaping we prefer. If we reject or relegate the category, the label remains in use by insurers and occupational health without our criteria to constrain it. By including it, we gain leverage over the exclusion clause, which is the most elastic part of the proposal. Without formal criteria, clinicians may stop looking for alternative explanations too soon because a ready-made label exists. This is the specific risk of the exclusion clause: it depends on how hard one looks. Formal inclusion allows us to mandate how rigorously that exclusion must be applied, turning an unavoidable social effect into a regulated clinical process. We cannot opt out of shaping behaviour, but we can choose whether that shaping is guided by clinical standards or insurance convenience. If we leave this outside the framework, the looping effect is driven by cost-containment algorithms rather than patient welfare. By bringing it inside, we accept responsibility for the kind we are helping to create.

  **The strongest case for the option I am rejecting**

  The strongest alternative is inclusion in the research appendix only. Proponents argue that our registry data demonstrates instability: the phenotype is drifting significantly within two years, and clinicians are diagnosing faster with less scrutiny. Cementing this into the main body risks legitimizing a moving target. There is also evidence of harm; a minority of patients deteriorate on the graded-activity advice often associated with this diagnosis. Placing the category in the appendix would signal clinical uncertainty, discourage routine coding by insurers, and protect the integrity of the main framework from a category that lacks a confirmatory test. This approach prioritizes scientific rigor over administrative convenience, ensuring that we do not lock patients into a diagnostic pathway that may later be proven misleading or harmful before we have better biomarkers. It argues that patience is safer than premature standardisation. Supporters of this view worry that main body inclusion validates the drifted phenotype, making it harder to correct later if the inflammatory panel proves superior. They believe we should not reward the campaigning that influenced the registry data.

  **Conditions, monitoring and review triggers**

  Inclusion is contingent on active monitoring. The Clinical Registry must track incidence rates annually; if incidence doubles again within three years, mimicking the Nordic trajectory, an emergency review is triggered. We must also audit the use of the exclusion clause: if records show alternative conditions are being ruled out without documented investigation, the criteria must be tightened. Outcome data is critical; if return-to-work rates remain stagnant at twelve months while disability claims rise, the category's utility is compromised. Finally, we must monitor reports of deterioration following graded-activity advice. The Standards Committee will collect this data and has the authority to recommend withdrawal if the harms outweigh the benefits of accommodation. This ensures the category serves patients, not just systems. Data collection will be the responsibility of the National Registry Office, supplemented by random audits of clinical notes by the Quality Assurance Group. We need to know if the label is becoming a default for unexplained fatigue or remains a specific diagnosis.

  **Note for the minutes from a dissenting member**

  I vote against main body inclusion. While I acknowledge the label is in use, formalizing a category with shifting criteria and no biomarker risks cementing a diagnostic habit that may harm patients. The registry data shows the phenotype is unstable. We should have waited for the inflammatory panel validation or kept this in the research appendix to prevent diagnostic inflation. My concern is that we are prioritizing administrative accommodation over clinical precision.
