answer: |-
  Here is a 90-minute lesson plan designed for your specific audience and constraints.

  ### **Session Architecture: The Ex Ante Turn**

  **Goal:** Shift the students' normative baseline from "maximize utility given current information" to "maximize utility given the policy that generated the action."
  **Whiteboard Strategy:** Use the left side for Decision Trees (CDT/EDT view) and the right side for Policy Tables (UDT view). Keep them visible simultaneously to contrast the structures.

  ---

  ### **I. The Diagnosis: Why Updating Loses (15 Minutes)**
  **Objective:** Establish that "rational updating" is the *cause* of failure in specific coordination/prediction problems, not the cure.

  1.  **Recap Newcomb (5 mins):** Briefly draw the Newcomb tree. Remind them CDT loses because it treats the box content as a fixed past fact *after* the prediction is made.
  2.  **The Dynamic Gap (10 mins):** Introduce the core tension.
      *   *Ex Post:* Once you see the boxes, the money is already there or not. Taking both dominates.
      *   *Ex Ante:* Before the prediction, you wish you were the kind of agent who takes one.
      *   **The Claim:** Rationality should not depend on *when* you ask the question. If you prefer the outcome of Policy A before the game starts, you should not switch to Policy B after the game starts, unless new *causal* leverage has appeared (which it hasn't in Newcomb).
      *   **Board Work:** Write: **Rationality = Consistency between Ex Ante Preference and Ex Post Action.**

  ### **II. The Intuition Pump: The Sealed Verdict (25 Minutes)**
  **Objective:** Use your custom example to bypass the "magic Omega" resistance and make policy selection physical.

  1.  **Setup (5 mins):**
      *   Draw 12 chairs. Explain: "You are this group. A coin is flipped *now* and sealed in an envelope."
      *   "Heads: 6 of you (randomly selected) will be asked to pay $100 to generate $10,000 for the group."
      *   "Tails: The other 6 will be asked to pay $100 to generate $10,000 for the group."
      *   "If the asked subgroup refuses, nobody gets anything."
      *   "You must agree on a single policy *now*, before the coin flip and before you know who is in which subgroup."
  2.  **The Consensus (10 mins):**
      *   Ask them to vote on the policy. They will unanimously choose: *'If asked, Pay.'*
      *   Why? Because the expected value for the *group* is positive. The cost is distributed; the gain is shared.
  3.  **The Execution (10 mins):**
      *   Open the envelope. Say: "It's Tails. You six are the payers. The other six get the money for free."
      *   Turn to the payers: "You now know you are in the Tails branch. The other six have already received the benefit. Your payment no longer *causes* the benefit (it's already determined by the policy agreement). Why pay?"
      *   **The Point:** If they refuse now, they violate the agreement that made the gain possible.
      *   **Role of this Example:** This is your **load-bearing element**. It externalizes the "Ex Ante" perspective. It proves that "ignoring evidence" (knowing you are a payer) is rational *if* your agency is located in the policy selection, not the momentary act. It removes the "Omega is reading my mind" mystique and replaces it with "We are binding our future selves."

  ### **III. Formalization: Counterfactual Mugging (20 Minutes)**
  **Objective:** Translate the group intuition into the standard single-agent formalism.

  1.  **The Translation (5 mins):**
      *   Map the Sealed Verdict to Counterfactual Mugging.
      *   Group = The Agent across time/worlds.
      *   Coin Flip = Nature's move.
      *   Policy Agreement = The Decision Function $\pi$.
  2.  **The Math (10 mins):**
      *   Define the UDT objective function on the board:
          $$ \text{Choose } \pi \text{ to maximize } E[U \mid \text{Agent uses } \pi] $$
      *   Contrast with CDT:
          $$ \text{Choose } a \text{ to maximize } E[U \mid \text{Agent does } a, \text{ given observations } o] $$
      *   Show how CDT conditions on $o$ (the observation that you are the payer), which screens off the correlation with the reward. UDT conditions on $\pi$ (the rule that says 'pay if asked'), which retains the correlation.
  3.  **Why Mugging? (5 mins):**
      *   Acknowledge your worry: Mugging feels contrived.
      *   **Justification:** It is the minimal case where *causal* influence is zero in the actual branch but *logical* correlation is non-zero. It forces the distinction between "causing the outcome" and "being the kind of agent for whom the outcome occurs."

  ### **IV. Head Off Misconceptions (15 Minutes)**
  **Objective:** Preempt the specific errors you identified.

  1.  **Misconception 1: "UDT means never updating on evidence."**
      *   **When:** Immediately after defining the math in Section III.
      *   **Correction:** Distinguish **Belief Updating** from **Policy Updating**.
      *   **Script:** "UDT agents are perfect Bayesians regarding *facts*. If you see a red light, you update your credence that the light is red. You do *not* update your *decision rule*. You do not say 'Now that I see the light is red, I will switch from the policy Stop-at-Red to Go-at-Red.' You execute the policy you chose when you didn't know the light's color."
      *   **Board:** Draw a box around "Credences" (Update these) and "Decision Function" (Do not update this).

  2.  **Misconception 2: "This is just ordinary precommitment."**
      *   **When:** During the Q&A after Mugging.
      *   **Correction:** Distinguish **Historical Precommitment** from **Normative Counterfactuals**.
      *   **Script:** "If you say 'I didn't precommit, so I don't have to pay,' you are admitting you are irrational. UDT is not about whether you *did* sign a contract; it is about whether you *would have* signed it if given the chance. A rational agent acts *as if* they precommitted optimally, even if they are born five minutes before the problem starts. It is a theory of what you *should be*, not what you *did*."

  ### **V. Scope and Boundaries (5 Minutes)**
  **Objective:** Define what you are *not* doing to prevent scope creep.

  *   **What to Refuse:** Logical Uncertainty, Proof-Based Decision Theory (PBDT), and Functional Decision Theory (FDT) semantics.
  *   **How to Frame It:** Do not apologize. Frame it as **Modular Complexity**.
  *   **Script:** "We are treating the decision function as a black box that maps observations to actions. We are assuming the agent knows the logical consequences of its own policy. We are *not* opening the box to ask how the agent computes logical counterfactuals, how it handles proofs about its own source code, or how it resolves disputes about mathematical correlation. Those are implementation details for the next seminar. Today, we are solving the *probabilistic* structure of updatelessness. If you bring up Löb's Theorem or Troll Bridge, I will park it in the 'Implementation' parking lot."

  ### **VI. The Closing Question (10 Minutes)**
  **Objective:** A diagnostic that separates slogan-recall from structural understanding.

  *   **The Question:** "The Self-Modification Test."
  *   **Scenario:** "You are currently a UDT agent. You are offered a pill for $10 that will rewrite your brain to be a perfect CDT agent for all future decisions. There are no Newcomb problems scheduled for tomorrow, but there is a 1% chance you will face one next year. Should you take the pill?"
  *   **The Divergence:**
      *   *Intuitive/CDT Answer:* "Yes, obviously. CDT is 'dominance-preserving.' Why stay UDT if it costs me $10 now and the risk is low?" (Or: "It doesn't matter, CDT and UDT act the same in standard causal problems.")
      *   *UDT Answer:* "No. Even if the probability is low, being a CDT agent makes you the kind of entity that loses utility in prediction problems. A UDT agent values *being* a UDT agent instrumentally. You never voluntarily disable your ability to win in correlated environments."
  *   **Why this works:** It tests if they view UDT as a *tactic* for specific puzzles (Mugging) or as a *property of the agent architecture*. If they say "Take the pill," they haven't internalized that UDT is about optimizing the *agent type*, not just the current move.

  ---

  ### **Summary of Deployment**

  1.  **Sealed Verdict:** Use this **first** (Section II). It is the bridge. It makes the "Ex Ante" perspective physical and social, bypassing the "why ignore my eyes?" objection. It earns the intuition that Mugging later demands.
  2.  **Counterfactual Mugging:** Use this **second** (Section III). It is the formalization. It translates the social contract into the single-agent math required for the literature.
  3.  **Misconceptions:** Interrupt the flow **during** the math (Belief vs. Policy) and **after** the math (Precommitment). Do not save them for the end.
  4.  **Scope:** Draw the line **before** Q&A. Make it a premise of the session, not a defensive reaction.
  5.  **Closing:** The Self-Modification Test. It reveals if they understand UDT as a stable agent architecture.

  ### **Instructor's Note on Tone**
  Your students are comfortable with EU. Do not sell UDT as "winning more money." Sell it as **diachronic consistency**. The argument is not "UDT gets rich," it is "CDT is dynamically inconsistent." Grad students in philosophy respect consistency arguments more than money-pump arguments. Frame UDT as the only theory that respects the agent's own Ex Ante preferences over time.
