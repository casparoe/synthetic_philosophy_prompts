prompt: |-
  I run a philosophy discussion group — a dozen graduate students, mixed subfields, comfortable with expected utility and with causal and evidential decision theory from a seminar unit, and they have already watched causal decision theory lose Newcomb's problem to a show of hands. Next session is ninety minutes, one whiteboard, and I want to teach updateless decision theory: the idea that a rational agent chooses the best policy or decision function in advance and then acts from it, rather than updating on each observation and deciding afresh. Plan how I should explain it, rather than explaining it to me. What has to be established before the updateless move can be presented as a response to a problem rather than an eccentric taste, and in what order does the material have to go? Which example should carry the session — I am torn between the standard counterfactual mugging and something less pre-loaded, since I suspect the mugging smuggles in exactly the intuition about the other branch that the session needs to earn — and what must that carrying example have, and lack? Which misconceptions should I expect — I have already caught one student saying updatelessness means never updating on evidence at all, and another treating it as ordinary precommitment that you are simply unlucky not to have already made — and at exactly which point in the sequence should each be headed off? I have also drafted my own variant, which I call the sealed verdict: the coin is flipped and its outcome sealed before anyone chooses, and the group must adopt a single policy that individual members, later assigned to different branches, are then bound to execute. Where should I deploy it, and what should it be doing that the standard examples cannot — is it a check or a teaching load-bearing element? Close with one question I can ask at the end that would reveal whether they have the idea rather than the slogan, ideally one whose updateless and intuitive answers come apart in a way we have not yet discussed. And tell me what I should openly refuse to cover at this level — I am thinking logical uncertainty, proof-based agents, and disputes about which mathematical facts a decision can be correlated with — and where to draw that line so that it reads as a statement of scope rather than evasion.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** ~12 grad students, mixed subfields, familiar with EU, CDT, EDT. They've seen CDT lose Newcomb's.
      *   **Goal:** Teach Updateless Decision Theory (UDT) in 90 minutes.
      *   **Core Concept:** Choosing the best policy/decision function *ex ante* rather than updating on observations and deciding *ex post*.
      *   **Constraints/Requirements:**
          *   Plan the explanation sequence (what must be established first).
          *   Select the "carrying example" (Counterfactual Mugging vs. something else). Analyze requirements for this example.
          *   Address specific misconceptions (UDT = no updating ever; UDT = ordinary precommitment).
          *   Integrate the user's custom example ("The Sealed Verdict"). Determine its role (check vs. load-bearing).
          *   Provide a closing question (tests understanding, not just slogans, divergence from intuitive answers).
          *   Define scope boundaries (what *not* to cover: logical uncertainty, proof-based agents, etc.) and how to frame it.

  2.  **Deconstruct the Pedagogical Challenge:**
      *   *The Problem:* UDT is counter-intuitive because it violates the principle of acting on current information. It looks like ignoring evidence.
      *   *The Hook:* CDT failed Newcomb. EDT fails Transparent Newcomb/Parfit's Hitchhiker. We need a dynamic problem where updating *causes* the loss.
      *   *The "Sealed Verdict":* This is a clever device. It externalizes the "ex ante" perspective. Instead of asking one agent to ignore evidence, it asks a group to agree on a rule before knowing who gets which evidence. This bypasses the "why would I ignore what I see?" objection by shifting the agency to the pre-observation collective.
      *   *Misconceptions:*
          1.  "Never update": Need to distinguish between *updating beliefs* and *updating decision policies*.
          2.  "Just precommitment": Need to show UDT applies even when precommitment wasn't historically possible (logical counterfactuals, or simply the normative claim that you *should have*).
      *   *Scope:* Avoid getting bogged down in FDT/ADT distinctions or the mechanics of logical induction. Keep it normative and structural.

  3.  **Drafting the Sequence (The "Order of Operations"):**
      *   *Phase 1: The Diagnosis (15 mins).* Why did CDT lose Newcomb? Because it treated the box content as fixed/past. Why did EDT lose Transparent Newcomb? Because it conditioned on the act. We need a theory that optimizes the *map* from observations to actions, not just the action.
      *   *Phase 2: The Motivation for Updatelessness (20 mins).* Introduce the tension between *ex ante* optimality and *ex post* rationality. Use a simple coordination problem or a precommitment scenario to show that updating can make you predictably worse off.
      *   *Phase 3: The Carrying Example (25 mins).* Counterfactual Mugging is the standard for a reason, but the user is worried it smuggles intuitions. However, for grad students, it's the cleanest mathematical demonstration. *Decision:* Stick with Mugging but strip it down, or use the "Sealed Verdict" to *frame* the Mugging. Actually, the "Sealed Verdict" is better as the *primary* intuition pump because it makes the "policy selection" physical rather than abstract. Let's make the Sealed Verdict the core, and Mugging the formalization.
      *   *Phase 4: Defining UDT (15 mins).* Formal definition. Maximize expected utility over policies, not actions. $argmax_\pi E[U | \pi]$.
      *   *Phase 5: Misconceptions & Scope (15 mins).* Address the "never update" and "precommitment" errors. Draw the line on logical uncertainty.

  4.  **Refining the Carrying Example:**
      *   *Counterfactual Mugging:* Good because it separates the branches clearly. Bad because "Omega" feels magical.
      *   *Sealed Verdict:* Good because it makes the "policy selection" a literal group decision. It solves the "why ignore evidence?" problem by saying "You aren't ignoring it; the *policy* was chosen before the evidence existed."
      *   *Strategy:* Use the Sealed Verdict to *motivate* the logic of Counterfactual Mugging. The Sealed Verdict is the "teaching load-bearing element." It makes the abstract concrete.

  5.  **Addressing Misconceptions:**
      *   *Misconception 1 (Never Update):* Address immediately after defining UDT. Distinguish *Bayesian updating of credences* (allowed/required) from *updating the decision rule* (forbidden).
      *   *Misconception 2 (Ordinary Precommitment):* Address when discussing why this is a *decision theory* and not just a trick. It's about what you *would have* precommitted to, even if you didn't. It's normative, not historical.

  6.  **Developing the Closing Question:**
      *   Needs to separate "I memorized UDT pays" from "I understand why."
      *   Needs to be a case where intuitive CDT/EDT answers diverge from UDT, but not Newcomb/Mugging.
      *   *Idea:* "The Absent-Minded Driver" is classic but maybe too game-theoretic.
      *   *Idea:* "Psychopath Button" (EDT fails, CDT passes, UDT passes).
      *   *Idea:* A variation on Mugging where the probability is known but the payoff is huge.
      *   *Better Idea:* A "Retrospective Regret" scenario. If you know you are a UDT agent, do you regret paying the mugger *after* the coin flip? Yes. Do you regret being the *kind of agent* who pays? No.
      *   *Best Idea:* The "Two-Button Self-Modification" case. If you could press a button to become a CDT agent for $100, should you? (UDT says no, if it leads to losses later).
      *   *Actually, let's go with a specific variant of the "Sealed Verdict" applied to a single agent.* "The Amnesiac Coin Flip." You flip a coin. If Heads, you are asked X. If Tails, you are asked Y. You forget the coin result. What policy do you choose?
      *   *Wait, the prompt asks for a question where updateless and intuitive answers come apart in a way *not yet discussed*.*
      *   *Proposal:* The "Parfit's Hitchhiker with a Twist." You are in the desert. Omega predicts if you *would* pay. But suppose Omega tells you "I predicted you would pay." Do you pay? (CDT says no, EDT says yes, UDT says yes).
      *   *Let's try:* "The Transparent Newcomb with a Note." Box B is transparent. You see $1M. Omega says "I put it there because I predicted you'd take only B." Do you take both? (CDT: Yes. UDT: No). This is standard.
      *   *Let's try:* "The Counterfactual Mugging with a Twist: The Mugger offers to sell you the coin flip result *after* you decide." No, too complex.
      *   *Let's try:* "The Policy-Dependent Prediction." Omega predicts your *source code*. You can read your source code. Does knowing your source code change your decision? (UDT: No, because the source code *is* the decision).
      *   *Selected Closing Question:* The "Timeless Precommitment" test. "If you could rewrite your own brain right now to be a CDT agent for all future decisions, would you?" (UDT says No, because CDT loses money in Newcomb-like situations). This tests if they see UDT as a *type* of agent, not just a move.

  7.  **Defining Scope Boundaries:**
      *   Must avoid: Logical Uncertainty (Troll Bridge), Proof-Based Decision Theory (Löb's Theorem), FDT vs. UDT semantics.
      *   Framing: "We are treating the decision function as a black box that maps observations to actions. We are not opening the box to look at the math inside yet."

  8.  **Structuring the Plan:**
      *   **Introduction (10 mins):** Recap CDT/EDT failures. Introduce the "Ex Ante" vs. "Ex Post" distinction.
      *   **The Sealed Verdict (20 mins):** The core intuition pump. Group policy selection.
      *   **Counterfactual Mugging (20 mins):** Formalize the Verdict into a single-agent problem.
      *   **Defining UDT (15 mins):** The math. $argmax_\pi$.
      *   **Misconceptions (15 mins):** Updating beliefs vs. policies. Normative precommitment.
      *   **Scope & Closing (10 mins):** What we aren't doing. The "Self-Modification" question.

  9.  **Refining the "Sealed Verdict" Role:**
      *   It shouldn't just be a check. It should be the *bridge*. It translates "magical Omega" into "social contract."
      *   It solves the "why ignore evidence" problem by showing that the evidence wasn't available to the *policy maker*.
      *   Placement: Before Mugging. It builds the intuition so Mugging doesn't feel like magic.

  10. **Refining the Misconception Timing:**
      *   "Never Update": Address right after defining the math.
      *   "Ordinary Precommitment": Address after Mugging, when they ask "But I didn't precommit!"

  11. **Final Review against Constraints:**
      *   90 mins? Yes, timing looks tight but doable.
      *   Whiteboard? Yes, use for decision trees and policy tables.
      *   Grad students? Tone should be rigorous, not pop-sci.
      *   Specific misconceptions addressed? Yes.
      *   Scope boundaries defined? Yes.

  12. **Self-Correction on Closing Question:**
      *   The "Self-Modification" question is good, but maybe "The Retrospective Regret" is sharper for UDT specifically.
      *   *Idea:* "You paid the mugger. The coin came up Tails. You lost $100. Do you regret paying?"
      *   *UDT Answer:* "I regret the outcome, but I do not regret the decision/procedure."
      *   *CDT Answer:* "I regret the decision."
      *   *Why this works:* It tests the separation of *procedure* from *outcome*.
      *   *Wait, prompt asks for a question where answers come apart in a way *not yet discussed*.* We will discuss Mugging. So the closing question shouldn't be Mugging.
      *   *Better:* "The Twin Prisoner's Dilemma." You play PD against a perfect copy of yourself. CDT defects. UDT cooperates.
      *   *Even Better:* "The Newcomb Soda." (Egan's challenge).
      *   *Let's go with the "Self-Modification" question.* It tests if they understand UDT as a *competitor architecture*, not just a fix for Mugging. It hasn't been discussed in the plan.

  13. **Final Polish:** Ensure the tone is directive ("Plan how I should explain it").

  *(Self-Correction during drafting)*: I need to be careful about the "Sealed Verdict." If it's too much like "The Veil of Ignorance," they might conflate it with ethics. I need to emphasize it's about *instrumental rationality*, not morality. The group wants to maximize total payout, not be "fair."

  *(Refining the Scope)*: Be explicit about *why* we aren't doing logical uncertainty. "We assume the agent knows the logical consequences of its policy. We are solving the *probabilistic* updatelessness first."

  *(Refining the Carrying Example)*: I will advise using Counterfactual Mugging *as the formalization* of the Sealed Verdict. The Verdict is the intuition; Mugging is the math.

  *(Final check on misconceptions)*:
  1. "Never update on evidence": Head off when defining the decision rule $\pi(o)$.
  2. "Just precommitment": Head off when discussing why UDT applies to agents who *couldn't* precommit (or didn't).

