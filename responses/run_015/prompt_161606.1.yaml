prompt: |-
  You are a professional philosopher who specializes in the philosophy of biology and the philosophy of information, and who is experienced at explaining things to engineers with no philosophy background. Please think carefully before you write: start by brainstorming the full space of possible readings, then sort them, then eliminate the ones that collapse into each other, and only then produce your answer. I care much more about precision than about breadth, and I would rather be told that one of my distinctions is confused than given a balanced survey.

  Context: I am a software engineer with no formal philosophy training, working at a company that builds tooling for designing DNA sequences — effectively a compiler and IDE for engineered organisms. In our internal ethics and strategy discussions the slogan "DNA is code" is used constantly, usually in one of its variant forms: "the genome is just software running on cellular hardware," "DNA is the source code of life," "it's all information." It is never decorative; it is always used to do argumentative work. The case I want help with is a disagreement about whether publishing the complete sequence of an engineered organism is morally on a par with publishing source code. My colleague's argument was, roughly: DNA is code, code is information, and publishing information is not the morally loaded act — building the organism is, and building is already regulated — so releasing a sequence is as innocent as open-sourcing a repository. The metaphor is being used to dissolve a responsibility question.

  I am sure something is wrong with that, but I cannot say what, because I cannot tell how much of "DNA is code" is doing the work. So: lay out, as a menu, the distinct precise theses that "DNA is code" and its variants ("program," "software," "instructions," "information," "blueprint") could be expressing. For each reading, state it precisely enough that I could tell what would falsify it; classify it as trivial, substantive and defensible, contentious but arguable, or straightforwardly false; and say whether that reading, if true, would actually get my colleague his conclusion, or whether it merely sounds as if it does. Please order the readings roughly from the least committal to the most committal.

  Five places where I suspect the answer actually lives, and which I want addressed explicitly:

  1. Arbitrariness and convention. In the codes I work with, the mapping between symbols and meanings is arbitrary and held in place by a convention, so decoding requires a specification that is not itself in the signal. Is the codon-to-amino-acid relation arbitrary in that sense, or is it a chemical necessity that we are flattering by calling it a mapping? What does each answer buy my colleague?

  2. Where the interpreter lives, and bootstrapping. My own attempt at an objection was that DNA looks more like data than like a program: the ribosomal and transfer-RNA machinery is the interpreter, and that machinery is itself partly specified by the very DNA it interprets, so the genome resembles a program whose compiler is written in the same program — a self-hosting compiler. My colleague called that an implementation detail. Is it? Does the self-hosting point undermine any particular reading of "DNA is code," or only sloppy ones? Relatedly, the same sequence appears to be read differently in different cell types and in different organisms. How much trouble is that for treating the sequence as a program at all?

  3. Direction and lossiness. As I understand it, the mapping is many-to-one — more codons than amino acids — so the translation is not invertible, and there are signals that function roughly as "begin" and "end." Does non-invertibility tell against calling it a code, or are plenty of genuine codes lossy? Separately, I have heard that the mapping is not perfectly universal across all life, and that there are heritable chemical modifications to DNA that are not changes to the sequence. Use those two facts only if they actually bear on some reading, and say plainly if they do not.

  4. Normativity: "error," "mutation," "defect." In software, an error is an error relative to what the author meant, or relative to a specification. My colleague leans on talk of genomes being buggy and edits being corrections. What would have to be true for that to be more than a metaphor, and if there is no author and no specification, what is supplying the normativity?

  5. What the information is supposed to be about. Is "DNA carries information about the organism" the same claim as "DNA carries information about the organism's ancestry, or about the population it comes from," or is one of them considerably easier to defend than the other? I suspect the word "about" is doing a great deal of unexamined work in this whole discussion.

  Finally, two things I want you to adjudicate rather than explain: (a) my two objections — the self-hosting compiler point and the non-invertibility point — telling me, for each, precisely which readings it damages and whether it damages any reading my colleague needs; and (b) whether there is any reading of "DNA is code" that is simultaneously strong enough to support the publish-the-sequence claim and defensible, or whether the honest verdict is that the metaphor is doing all the work and the real argument would have to be made on some independent ground — about information generally, about dual-use research, or about who bears responsibility for downstream use — that has nothing specifically to do with genomes.

  Format: a table or numbered list of the readings with the fields above, followed by a short section answering (a) and (b). Use software-engineering analogies where they genuinely clarify, drop them where they would mislead, and flag explicitly when an analogy is misleading, since I suspect that is exactly where I am being fooled. Do not give me citations, bibliographies, or reading lists — I want the argument, not the literature.
