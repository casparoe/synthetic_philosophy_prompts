answer: |-
  This is not a jumble; this is exactly where the philosophy of reproduction gets interesting. Your reading group has put its finger on the central tension in modern bioethics: the gap between *person-affecting* duties (don't harm the fetus) and *non-identity* choices (which person to create).

  You asked for the mess, so let's not tidy it up too much. Here is a breakdown of what the clinic's practice presupposes, how it relates to the theories you mentioned, and what would actually change if you swapped the underlying logic.

  ### 1. What does the practice presuppose?

  The clinic's current behavior is not derived from a single moral theory. It is a *modus vivendi*—a pragmatic compromise between competing ethical frameworks. However, if we force it to confess its presuppositions, it leans heavily on a **Sufficiency View constrained by a Harm-Principle**, rather than Procreative Beneficence.

  *   **The Non-Identity Problem (Implicitly):** The practice secretly relies on the intuition that you cannot "benefit" an embryo by selecting it (since the alternative is non-existence), but you can "harm" a future child by creating them in a state of severe suffering. This is why discarding an embryo with Trisomy 18 (incompatible with long life/high suffering) is mandatory/encouraged, but selecting for height is not. The clinic acts as if there is a duty to avoid *wronging* the child (by giving them a life below a threshold of tolerability), but no duty to *optimize* the child.
  *   **The Treatment/Enhancement Distinction:** Yes, the practice is committed to this, but not on metaphysical grounds. It relies on a **Medical Model of Normality**. "Normal" function is the baseline. Restoring or ensuring access to normal function (avoiding disease) is medicine; exceeding normal function (intelligence, height) is consumerism. The clinic presupposes that the goal of reproduction is to produce a *healthy* member of the species, not a *superior* one.
  *   **Reproductive Discretion with Social Boundaries:** The practice presupposes that parents have a domain of discretion, but that domain runs out where individual choices threaten social goods. Non-medical sex selection is often blocked not because it harms the child, but because it skews demographics or reinforces sexism. Selecting for intelligence is blocked because it exacerbates inequality. The limit isn't drawn at "harm to the child," but at "harm to the society the child enters."

  ### 2. Can a Maximizer (Procreative Beneficence) Endorse the Clinic's Rules?

  This is the crucial distinction between **first-order morality** and **second-order policy**.

  A strict adherent to Julian Savulescu's *Principle of Procreative Beneficence* (PB)—that parents must select the child expected to have the best life—believes the clinic's current rules are *morally incorrect* in the abstract. However, they can endorse the rules *institutionally* for second-order reasons.

  *   **Epistemic Humility:** A PB maximizer might agree to ban IQ selection because our genetic knowledge is too noisy. Selecting for "intelligence" might accidentally select for "autoimmune disorders" due to pleiotropy. If the tech is unreliable, maximizing expected utility actually requires *not* using it.
  *   **The Expressivist/Slippery Slope Constraint:** A PB maximizer might accept that allowing enhancement would stigmatize existing disabled people or create a caste system, thereby lowering overall social utility. If the social cost of allowing selection for height is greater than the benefit to the individual child, the utilitarian bans the selection.
  *   **The Verdict:** A PB maximizer is not *stuck* defending the practice as morally ideal. They would say, "In a perfect world with perfect knowledge and no social prejudice, we should maximize. In *this* world, the clinic's restrictions are a necessary heuristic to prevent worse outcomes." So, they can endorse the rules without endorsing the underlying *sufficiency* theory.

  ### 3. The "Floor Rule": Description or Theory?

  Your "Floor Rule" is essentially an explicit formulation of the **Sufficiency View**. It is distinct from Procreative Beneficence, but it is largely a *rational reconstruction* of what the clinic is already doing.

  *   **Is it different from current practice?** Conceptually, no. Practically, yes. Current practice is vague ("medical necessity," "welfare of the child"). The Floor Rule makes the threshold explicit.
  *   **Does it dodge the Expressivist Worry?** Only partially. The expressivist objection says selecting against Disability X implies people with X have less worth. The Floor Rule replies: "No, it implies that a life *without the capacity for X* is below the minimum threshold for a decent life."
      *   *The Problem:* Where is the floor? If the floor is "capable of suffering," almost nothing gets screened. If the floor is "capable of economic independence," Down Syndrome embryos might be discarded. The Floor Rule doesn't solve the expressivist worry; it just moves the debate to *where to set the floor*.
  *   **Visible Changes if Adopted:**
      *   **Funding:** Currently, public health systems fund PGT (Preimplantation Genetic Testing) for specific serious conditions. Under a strict Floor Rule, if you could prove that being male (in a specific context) or being of a certain height pushed a child *below* the well-being floor (e.g., due to severe bullying or systemic discrimination), you might qualify for funding. Conversely, if a condition is deemed "above the floor" (e.g., deafness, by some advocates), funding for screening it might be *removed* as unnecessary medicalization.
      *   **Counseling:** Currently, counselors say, "This embryo has a high risk of disease." Under the Floor Rule, they would say, "This embryo is projected to have a life below the threshold of sufficiency." It shifts the language from pathology to quality-of-life projections.
      *   **Negligence:** This is the big one. Under PB, picking the lower-IQ embryo is negligence. Under the Floor Rule (and current practice), it is not, provided both are above the floor. If the clinic adopted the Floor Rule *as a legal standard*, parents could theoretically be sued for *not* screening, but only if the resulting child fell below the floor. It would not create a duty to select the *best*, only the *acceptable*.

  ### 4. Squaring the Pregnancy/Selection Asymmetry

  This is the knot your group is stuck on: *Why is drinking during pregnancy "wronging the child" but not selecting the smarter embryo?*

  The practice resolves this via the **Non-Identity Problem**, even if it doesn't say so out loud.

  *   **Pregnancy (Person-Affecting):** The fetus is arguably the *same entity* that will be born. If you drink, you damage *that* child. You make *them* worse off than *they* would otherwise have been. This fits our standard model of harm.
  *   **Selection (Non-Identity):** If you choose Embryo A (average IQ) instead of Embryo B (high IQ), you haven't made Embryo A worse off. Embryo A has no complaint; without your choice, Embryo A wouldn't exist.
  *   **The Practice's Logic:** The health system nags about alcohol because it prevents harm to an existing pregnancy. It restricts embryo selection because it refuses to enter the business of *comparing possible lives* for optimization.

  **However,** there is a contradiction here that the practice glosses over. If you believe a woman who drinks heavily has "wronged the child," you are implicitly accepting that parents have a duty to the future child's well-being *independent* of the non-identity problem. If that duty exists, why does it stop at "don't damage" and not extend to "do improve"?

  The clinic's answer is usually **Commodification**. They fear that treating embryos as products to be optimized undermines the unconditional acceptance required for parenting. Drinking alcohol is seen as *neglecting* the process; selecting for height is seen as *manufacturing* the product.

  ### Summary for the Reading Group

  1.  **The Practice:** It is a **Sufficiency View** (avoid bad lives) masquerading as a **Medical Model** (cure disease). It rejects **Procreative Beneficence** (maximize good lives).
  2.  **The Floor Rule:** This is just the honest version of the Sufficiency View. It doesn't solve the ethical problems, but it clarifies the boundary. If adopted, it would shift funding toward preventing "sub-threshold" lives and away from "enhancement," but the definition of "threshold" would become the new battlefield.
  3.  **The Maximizer:** A Procreative Beneficence believer can support the clinic's rules, but only as a **pragmatic constraint**, not a moral ideal. They would view the current rules as a necessary evil to prevent social backlash, not as "the right thing to do."
  4.  **The Asymmetry:** The system treats pregnancy as **harm-prevention** (person-affecting) and selection as **life-creation** (non-identity). It feels inconsistent because our intuition says parents owe children *some* duty of beneficence, but the law only enforces a duty of **non-maleficence**.

  The mess you're feeling is real. The clinic is trying to offer a medical service without accepting the moral implications of that service. They want to be in the business of creating life, but they insist they are only in the business of preventing disease. Your reading group has noticed that, genetically speaking, those are often the same mechanism, just different points on a curve.
