prompt: |-
  So a friend of mine is going through IVF at the moment and it's got me and a few people from my very informal reading group stuck on something. The thing that struck us is how picky the whole setup is about which reasons for choosing one embryo over another count as respectable. The clinic will happily discard embryos with the wrong number of chromosomes, will test for a specific disease if both parents are carriers, and — at least where I live, with some approvals — will let you pick an embryo that's a tissue match for a sick older sibling. But the same clinic acts as if ranking embryos by anything like intelligence or height is straight-up beyond the pale, and non-medical sex selection is either illegal or something they'll quietly steer you away from. At the same time, the very same health system nags pregnant women about folate and alcohol, and basically everyone I know agrees that a woman who drinks heavily all through a pregnancy has wronged the child she ends up having. That last bit is what I can't square. If we already accept that prospective parents owe it to the child who will exist to make that child as well off as they reasonably can, then why isn't "take the embryo with the best expected life" the obvious next step? Isn't that just procreative beneficence, and isn't it weird to accept the duty in the pregnancy case and reject it in the selection case?

  So here's what I actually want: what does the practice as it exists presuppose? Is it committed to something like a treatment/enhancement distinction, or to a sufficiency view where you may select to avoid a bad life but there's no reason at all to optimize above the threshold? Does it secretly lean on some claim about the non-identity problem — that we can't benefit a child by creating them, but we can harm them by creating them in a bad state? Does it presuppose that parents have a domain of reproductive discretion that simply runs out at some point, and if so, why exactly there? And I'd really like the distinction between what the practice strictly requires and what it merely fits with: could someone who accepts full-on maximizing procreative beneficence still endorse the clinic's actual rules for second-order reasons — the tech being noisy, worries about where a market in traits ends up, worries about what it says to already-existing disabled kids — or is that person stuck defending something closer to the practice I actually see?

  One more thing, because we invented it halfway through the argument and none of us could work out whether it's a genuine alternative or just the same view in a costume. Call it "the floor rule": you may use any selection technology to minimize the chance that the child ends up below some decent minimum of well-being, and you're encouraged to, but you may not use it to improve a child's prospects once they're already above the floor, even when the improvement is large and basically free. Is the floor rule actually a different theory from the one the clinic is running, or is it just a description of it? Does it dodge the expressivist worry about Down-syndrome screening, or does cutting off at the floor say something just as bad? And concretely: if a clinic swapped its current implicit theory for the floor rule, or for straight procreative beneficence, what would visibly change — who gets funded, what counselors say, whether declining selection starts to look like negligence? Sorry, that's a bit of a jumble, but I'd rather have the mess than a clean answer to the wrong question.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** The user and their reading group are discussing IVF ethics, specifically the discrepancy between accepted selection criteria (chromosomes, disease, tissue match) and rejected criteria (intelligence, height, non-medical sex selection).
      *   **Core Tension:** They see an inconsistency between the duty to avoid harm during pregnancy (e.g., don't drink alcohol) and the reluctance to maximize benefits during embryo selection (Procreative Beneficence). If we owe it to the child to make them as well-off as possible, why stop at "healthy"?
      *   **Specific Questions/Requests:**
          1.  What does current practice *presuppose*? (Treatment/Enhancement? Sufficiency View? Non-Identity Problem? Reproductive Discretion?)
          2.  Distinction between what practice *requires* vs. what it *fits with*: Can a maximizing utilitarian (Procreative Beneficence) endorse current rules for second-order reasons (slippery slope, expressivism, tech limits)?
          3.  Evaluation of "The Floor Rule": Is it distinct from current practice? Does it solve expressivist worries? What would change visibly if clinics adopted the Floor Rule or full Procreative Beneficence?
      *   **Tone:** Philosophical, nuanced, slightly informal ("reading group," "jumble"), but demanding rigor. Avoids wanting a "clean answer to the wrong question."

  2.  **Analyze the Ethical Landscape:**

      *   **Current Practice:** Focuses on "medical necessity," "serious disease," "welfare of the child" (often interpreted as avoiding suffering). It implicitly rejects eugenics/enhancement.
      *   **Procreative Beneficence (Savulescu):** Parents have a moral obligation to select the child, of the possible children they could have, who is expected to have the best life.
      *   **Non-Identity Problem (Parfit):** Selecting Embryo A over Embryo B doesn't benefit A (A wouldn't exist otherwise), but choosing A might prevent harm if B would have had a life not worth living.
      *   **Expressivist Objection:** Selecting against disability sends a message that disabled lives aren't worth living.
      *   **Sufficiency View:** Ensure the child has enough to have a good life, but no duty to maximize beyond that.
      *   **The "Floor Rule" (User's invention):** Select to avoid falling below a threshold, but don't select for enhancement above it.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the question. Validate the reading group's intuition (this is a classic bioethics puzzle). State the thesis: Current practice is a messy compromise, not a single coherent theory, but it leans heavily on a *harm-avoidance/sufficiency* model constrained by *social/expressivist* concerns, rather than pure *beneficence*.

      *   **Part 1: What does the practice presuppose?**
          *   It's not just one thing. It's a hybrid.
          *   *Medical Model:* Disease = Bad, Health = Normal. Enhancement = Optional/Hubris.
          *   *Harm vs. Benefit:* It aligns with the Non-Identity Problem's intuition: we have a stronger duty not to create a suffering child than to create the *best* child.
          *   *Reproductive Discretion:* Parents have liberty, but it stops where it becomes "social engineering" or threatens social equality.
          *   *Conclusion on this point:* It presupposes a *threshold* view (avoid serious impairment) rather than a *maximizing* view.

      *   **Part 2: Maximizing Beneficence vs. Current Rules (Second-Order Reasons):**
          *   Can a Savulescu-style utilitarian accept current bans?
          *   *Yes, via "Rule Utilitarianism" or Pragmatism.*
          *   *Reasons:* Epistemic limits (we don't know what genes make a "good life"), Slippery Slope (eugenics history), Expressivism (harming existing disabled people), Inequality (rich get smarter).
          *   *Distinction:* The *theory* (maximize) is different from the *policy* (restrict). A maximizer can support restrictions if unrestricted maximizing leads to worse outcomes overall.
          *   *Verdict:* A maximizer isn't *stuck* defending the practice as morally ideal, but can defend it as *institutionally necessary*.

      *   **Part 3: The "Floor Rule" Analysis:**
          *   *Is it different?* It's a formalization of the *Sufficiency View*. Current practice is vague; the Floor Rule makes it explicit.
          *   *Does it dodge Expressivism?* Partially. It says "lives below the floor are preventable tragedies," but "lives above the floor are equally valuable." However, drawing the line is the hard part. Is Deafness below the floor? Down Syndrome?
          *   *Visible Changes:*
              *   *Funding:* Currently funds "medical necessity." Floor Rule might fund anything preventing a "sub-threshold" life (could expand or contract depending on where the floor is).
              *   *Counseling:* Shifts from "do you want to screen for disease?" to "this embryo risks a life below acceptable minimum."
              *   *Negligence:* Under Procreative Beneficence, picking a lower-IQ embryo *is* negligence. Under the Floor Rule, it isn't, provided both are above the floor. Current practice aligns closer to the Floor Rule here.

      *   **Part 4: The Pregnancy vs. Selection Asymmetry (The User's Core Puzzle):**
          *   Why is drinking bad (harm) but not picking the smart embryo okay (no benefit)?
          *   *Causal vs. Constitutive:* Drinking damages an *existing* fetus (person-affecting). Selection chooses *which* person exists (non-identity).
          *   *Social Meaning:* Drinking is seen as self-indulgence harming another. Selection for enhancement is seen as consumerism/commodification.
          *   *The "Wronging" Intuition:* We agree you wrong a child by giving them FAS. We are split on whether you wrong a child by giving them average intelligence when they could have had high intelligence.

      *   **Conclusion:** Summarize. The practice is a *modus vivendi* (agreement for peace) rather than a moral truth. It balances parental autonomy, child welfare, and social justice. The Floor Rule is a useful heuristic that describes the *logic* of the practice better than Procreative Beneficence does.

  4.  **Refining and Polishing:**

      *   *Tone Check:* Keep it conversational but philosophically precise. Use terms like "person-affecting," "non-identity," "expressivist," "sufficiency."
      *   *Addressing the "Jumble":* The user apologized for the mess. I should reassure them that the mess is the point.
      *   *Specific Constraint:* Make sure to answer the "visible change" question concretely.
      *   *Self-Correction during drafting:* I initially thought about focusing heavily on Savulescu. I need to pull back and focus on *what the clinic does*, as requested. The clinic isn't run by utilitarians.
      *   *Key Insight:* The distinction between "preventing a harmed life" and "creating the best life" is the crux. The pregnancy case looks like harm prevention. The selection case looks like optimization. The practice treats them differently because of the Non-Identity Problem, even if laypeople don't articulate it that way.

  5.  **Final Review against User Prompts:**
      *   What does practice presuppose? (Answered: Sufficiency/Harm-avoidance).
      *   Treatment/Enhancement? (Answered: Yes, but blurry).
      *   Non-Identity? (Answered: Yes, implicitly).
      *   Reproductive Discretion? (Answered: Yes, bounded by social norms).
      *   Maximizer endorsing rules? (Answered: Yes, via second-order reasons).
      *   Floor Rule distinct? (Answered: It's the explicit version of the implicit sufficiency view).
      *   Visible changes? (Answered: Counseling language, negligence standards, funding scope).

  6.  (Final Polish of the text to ensure flow and clarity.) *Self-correction: Make sure to explicitly mention the "drinking during pregnancy" comparison, as that was the user's hook.*

