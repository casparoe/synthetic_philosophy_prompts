  I'm presenting next Thursday to a philosophy of science colloquium on real patterns in complex systems. My thesis is that Dennett's physical, design, and intentional stances are jointly insufficient for distributed socio-technical systems — open-source governance structures, climate adaptation networks — because these exhibit what I call thick real patterns: patterns that carry genuine counterfactual weight about institutional failure, yet are neither reducible to microphysical dynamics nor best explained by intentional projection, and are not merely heuristic overlays of the design stance. I propose a fourth structural stance that treats these patterns as emergent, robustness-selective constraints shaped by evolutionary pressures without being designed. The audience is precise: three physicalists convinced that computational reduction handles all macro-patterns, two evolutionary biologists who accept design talk only for organisms, and one agent-based economist who will claim I am reinventing institutional economics with worse formalism. Draft my Q&A prep sheet: the eight objections I will actually face, ordered by likelihood and damage, each phrased in the vocabulary of the subgroup that will raise it. For each objection include the reply I should give in about two minutes and an explicit note on where that reply is weakest. Tell me what I should concede in my opening remarks so the rest of the position survives, and identify the one question I am hoping nobody asks — likely whether the structural stance collapses into the design stance with extra ontological baggage, or whether it implicitly requires group-level intentionality.
