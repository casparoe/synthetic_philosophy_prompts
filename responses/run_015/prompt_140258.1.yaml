prompt: |-
  I run a hardware store and I sit, as a volunteer, on the seven-person board of Cascade Ridge Search and Rescue. I have no background in philosophy, but I've been arguing about this with two friends for weeks — one says we are about to punish a man for bad luck, the other says a good process is a good process and the family is owed more than a shrug — and I'm the one who has to draft the memo before our meeting in twelve days, so I'd like it written properly.

  Here is the situation. Our field manual tells a leader to adopt the first search plan that reaches a seventy-percent probability of detection within the first hour, and then to stop planning: it says explicitly that we should not keep looking for a better plan, because every minute spent planning is a minute the missing person is getting colder. It also sets a ninety-minute "hold" window before a segment is abandoned and the search is widened. In January, a leader named Maya followed that rule exactly, found the missing hiker alive at fifty-two minutes, and in March the county commissioners gave her their Lifesaver of the Year award; there is a plaque on the wall at the station. In February, a leader named Dan — a twelve-year volunteer with no prior incidents — followed the same rule on a very similar call, held his segment for the full ninety minutes, and the hiker was found dead three hundred metres outside it, dead of exposure, with the medical examiner's estimate of time of death falling inside the hold window. At minute sixty-two Dan radioed dispatch to ask whether he should widen early, and the dispatcher — a volunteer who was simultaneously coordinating a second, unrelated call — told him to hold the segment; he held. The manual also says the field leader has final authority on scene, which is the sentence the family quotes in its letter to us, and which the local paper quoted under the headline asking why we stopped looking. Since then a donor has offered the organization a quarter of a million dollars for thermal drones, on the condition that the board state in writing that the manual's threshold rule contributed to the death; the donor turns out to be the dead man's uncle, which we only learned after the offer arrived.

  One board member is circulating a motion to suspend Dan pending a full review. A second says we cannot put a plaque on one wall and a suspension in the other for the same conduct. A third, who works in data analysis, has proposed a new standing procedure instead: re-run every serious incident in our incident simulator, feeding it only what the leader knew at the moment the plan was fixed, run that plan against a large set of simulated hiker locations drawn from our historical distribution of where people actually end up, and grade the plan on its average detection time — then train on, or if necessary discipline on, the grade rather than the outcome. I like the sound of this, but it worries me too, since our historical distribution was itself produced by searches that ran under the same rule, and since Dan's grade would depend on where in that distribution the real hiker happened to be. To complicate matters, two of our seven members are active field leaders who could find themselves in Dan's position, and one is the county's appointee who is mainly worried about the insurance pool and the newspaper.

  Please draft the memo I'll circulate in advance of the vote. It should take a clear position on four things: what to do about Dan; what to do, if anything, about Maya's award and about the manual's rule; whether we can accept the donation on the terms offered; and whether to adopt the simulation-based grading procedure, and if adopted, how much weight it should carry. It needs a concrete recommendation with a timeline rather than a menu of options, because four of seven votes are needed and I have to whip them. And it has to treat the strongest case for sanctioning Dan honestly — the family's letter is genuinely good, and the argument that a rule nobody is ever accountable under is not really a rule is the one I can't get out of my head — while still telling me what you think we should actually do and why.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**

      *   **Role:** Volunteer board member of Cascade Ridge Search and Rescue (SAR). Background: Hardware store owner (pragmatic, operational mindset), no philosophy background.
      *   **Task:** Draft a memo to circulate to the seven-person board before a meeting in 12 days.
      *   **Goal:** Secure 4 out of 7 votes for a concrete recommendation (not a menu of options).
      *   **Key Issues to Address:**
          1.  What to do about Dan (the leader involved in the fatality)?
          2.  What to do about Maya's award and the manual's rule (70% probability/90-minute hold)?
          3.  Whether to accept the donor's $250k thermal drone donation (conditioned on admitting the rule contributed to the death)?
          4.  Whether to adopt the simulation-based grading procedure (and how much weight it carries)?
      *   **Tone/Style:** Professional, clear, decisive, empathetic but firm. Needs to acknowledge the moral weight (the family's grief, the "bad luck vs. bad process" debate) while prioritizing the organization's mission and sustainability.
      *   **Constraints:** Must treat the strongest case for sanctioning Dan honestly. Must provide a concrete timeline. Must address the conflict of interest (donor is the uncle).

  2.  **Deconstruct the Situation & Ethical Dilemmas:**

      *   **Dan's Situation:** He followed the manual. He asked for guidance (dispatcher said hold). He had final authority but relied on protocol. Outcome was tragic (death).
          *   *Argument for Sanction:* Accountability. If rules have no consequences for failure, they aren't rules. The family feels abandoned. "Final authority" implies responsibility.
          *   *Argument against Sanction:* Outcome bias. He did exactly what the "Lifesaver of the Year" did. Punishing him punishes adherence to protocol. It will chill decision-making in the field (defensive searching).
      *   **Maya's Award/Manual Rule:** Maya succeeded using the same rule. The rule is designed to minimize *overall* harm (time vs. coverage), not guarantee every single outcome.
          *   *Decision:* Do not rescind Maya's award (retroactive punishment for success is unjust). Review the rule, but don't scrap it immediately without data.
      *   **The Donation:** $250k is huge for SAR. But the condition is admitting liability/fault ("state in writing that the manual's threshold rule contributed to the death").
          *   *Risk:* Legal liability, insurance issues, precedent. Admitting fault where none legally exists (following protocol) is dangerous.
          *   *Conflict:* Donor is the uncle. Emotional leverage.
          *   *Decision:* Decline the conditional offer. Seek the donation without strings, or find other funding. Cannot admit fault if the board believes no fault occurred.
      *   **Simulation Procedure:** Data-driven review.
          *   *Pros:* Removes outcome bias. Focuses on decision quality at the time.
          *   *Cons:* Garbage in, garbage out (historical data bias). Dan's grade still depends on the specific hiker location (luck).
          *   *Decision:* Adopt as a *training and review tool*, not a disciplinary sole determinant. It helps identify systemic issues, not just individual blame.

  3.  **Determine the Stance (The "Hardware Store Owner" Perspective):**

      *   *Pragmatism:* We need volunteers. If we hang Dan out to dry for following the rules, volunteers will quit.
      *   *Fairness:* You can't punish Dan for doing what Maya did. That's inconsistent.
      *   *Liability:* Admitting fault for the donation opens the org to lawsuits.
      *   *Improvement:* We *must* do something to honor the deceased and improve. The simulation idea is good but needs calibration.
      *   *Conclusion:* Protect Dan (no suspension), protect the Org (decline conditional donation), improve the Process (adopt simulation for review/training, commission manual review), Honor the Dead (memorial, not liability).

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the gravity. Set the tone (respect for the deceased, support for volunteers).
      *   **Issue 1: Dan:** Recommend against suspension. Why? Consistency with Maya, protection of volunteer base, adherence to protocol at the time. Acknowledge the family's pain but distinguish outcome from conduct.
      *   **Issue 2: Maya/Manual:** Keep the award (it was earned under the rules at the time). Commission a review of the manual (70% rule) but don't panic-change it.
      *   **Issue 3: Donation:** Decline the *condition*. We can't admit fault we don't believe exists. Offer to accept the gift unconditionally (unlikely he will, but we must offer).
      *   **Issue 4: Simulation:** Adopt it. But clarify its use: *Systemic Review & Training*, not solely *Disciplinary*. Address the "historical bias" concern by noting it's still better than outcome-based judgment.
      *   **Timeline:** Concrete steps for the next 30-60-90 days.
      *   **Closing:** Call to action for the vote.

  5.  **Refining the Argument (Addressing the "Strongest Case"):**

      *   *The "Rule of Law" Argument:* The prompt specifically asks to treat the argument "a rule nobody is ever accountable under is not really a rule" honestly.
      *   *Integration:* I need to write a paragraph that validates this. "If we follow the manual and people die, and nothing happens, is the manual a shield?"
      *   *Counter:* The accountability is to the *process*, not the *outcome*. If the process was followed, the accountability is met. Changing the outcome post-hoc punishes the wrong thing. The simulation helps verify if the *process* was actually sound.

  6.  **Review against Constraints:**

      *   *4 of 7 votes:* Needs to be persuasive to the middle ground. The Field Leaders need to feel safe. The County Appointee needs to feel liability is managed. The Data Analyst needs to feel their idea is valued.
      *   *Timeline:* Included.
      *   *Tone:* Not overly philosophical, but ethically sound. "Hardware store" practicality.
      *   *Donor Conflict:* Explicitly mentioned.

  7.  **Self-Correction/Polishing during drafting:**

      *   *Initial thought:* Maybe suggest suspending Dan but reinstating him? *Correction:* No, that's wishy-washy. Clear recommendation: No suspension.
      *   *Initial thought:* Accept the drones. *Correction:* Too risky legally. The condition is a poison pill.
      *   *Simulation:* Make sure to address the user's worry about historical distribution bias. Acknowledge it but argue it's still superior to outcome bias.
      *   *Family:* Ensure the language is compassionate. They lost a son/brother. The memo shouldn't sound cold.

  8.  **Final Polish:** Check the voice. It should sound like a volunteer board member writing to peers. Professional but not corporate legalese. (e.g., "We are volunteers, not a police force," "We cannot buy safety with liability.")

  **(Self-Correction on the Simulation Logic):** The prompt says the user worries Dan's grade would depend on where the hiker happened to be. I need to address this. The simulation runs the *plan* against *many* locations. It grades the *plan's average performance*, not the specific outcome. This actually *helps* Dan if his plan was statistically sound but got unlucky on the specific location. I need to make sure this distinction is clear in the memo.

  9.  **Finalizing the Memo Structure:**
      *   To/From/Date/Subject.
      *   Executive Summary.
      *   Context (The Incident).
      *   Recommendations (The 4 points).
      *   Rationale (Addressing the ethical tensions).
      *   Implementation Timeline.
      *   Closing.

