      *   *Key Distinction:* Soul rules body (despotic); Reason rules appetite (political/royal). Natural slaves are those where body dominates soul or where reason is present but ineffective.
      *   *Key Passage:* "He who can be another's... and he who participates in reason enough to apprehend it but not to have it..." (1254b20-25).
      *   *The "Mutual Advantage" Claim:* It is better for them to be ruled (1254b16).
      *   *The Gap:* Aristotle moves from "cannot deliberate well" to "belongs to another." Is property status implied by psychological status?

  3.  **Addressing the Logical Structure:**
