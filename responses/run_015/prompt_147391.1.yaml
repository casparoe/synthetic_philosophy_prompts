answer: |-
  Your analysis identifies one of the most significant and enduring philosophical tensions in Aristotle's *Politics*. You are correct to distinguish between **cognitive dependence** (the capacity for practical reasoning) and **agential dependence** (the status of ownership and authority over one's actions).

  Below is a reconstruction of the logical structure of *Politics* I.5, an analysis of the "bridge" between these two forms of dependence, and an evaluation of whether the argument holds if they are separated.

  ### 1. Logical Reconstruction of the Argument

  Aristotle's argument for natural slavery in I.5 is not merely empirical; it is teleological and metaphysical. We can reconstruct it as follows:

  *   **Premise 1 (The Function of Man):** The good for any being lies in the fulfillment of its specific function (*ergon*). For humans, this is activity of the soul in accordance with reason (1254a15).
  *   **Premise 2 (The Hierarchy of Soul):** In a well-ordered soul, reason rules over appetite/spirit. In a well-ordered body, the soul rules over the body. This is the "natural" rule (1254b4-5).
  *   **Premise 3 (Psychological Observation):** There exist some humans whose souls are structured such that their reason cannot authoritatively rule their appetites. They possess reason only receptively (they can understand it) but not proactively (they cannot originate it) (1254b22).
  *   **Premise 4 (The Principle of Instrumentality):** That which cannot direct itself toward its own good via reason must be directed by that which can. If a part cannot rule itself, it must be ruled by a whole.
  *   **Inference:** Therefore, such individuals are naturally suited to be ruled by a master who possesses full practical wisdom (*phronesis*).
  *   **Premise 5 (Definition of Property):** An instrument (*organon*) that is animate and used for the "actions" (*praxis*) of life belongs to the user, not to itself (1254a14).
  *   **Conclusion:** Therefore, those with receptive-but-not-authoritative reason are naturally property (slaves) of those with authoritative reason.

  ### 2. The Bridge: From Cognitive to Agential Dependence

  You ask whether Aristotle offers independent justification for the move from Premise 3 (cognitive limitation) to the Conclusion (agential subordination/property status), or if this is an unstated premise.

  **The Justification is Teleological, not Legal.**
  Aristotle does not offer a *legal* or *contractual* justification (which would respect the distinction you drew). Instead, he offers a **metaphysical identification**. For Aristotle, the status of "being an instrument" is not a legal consequence of cognitive weakness; it is an *ontological description* of it.

  *   **The Implicit Premise:** *To lack the authoritative deliberative faculty ($kurion bouleutikon$) is identical to being a part of another.*
  *   **The Bridge:** Aristotle argues that nature intends to make the bodies of slaves and free men different (strong for service, upright for politics) to match their souls (1254b27). He attempts to ground the agential status in physical and psychological nature.

  **Is the Inference Justified?**
  From a modern liberal perspective, the inference is a **non sequitur**. One can accept that a person has poor judgment (cognitive dependence) without accepting that they should be owned as property (agential dependence). We modernly resolve this via guardianship or conservatorship, which protects the *person* while managing the *decisions*.

  Aristotle rejects this distinction. For him, if you cannot deliberate for yourself, you do not have a "self" to protect in the political sense. You are, by definition, a "living tool" (*empsychon organon*). A tool does not own its labor; the craftsman does. Thus, the move from cognitive to agential dependence is not a slide in Aristotle's view; it is a **conceptual collapse**. He believes cognitive incapacity *constitutes* agential subordination.

  ### 3. Parsing the Passage: Description vs. Prescription

  Your request to distinguish where cognitive subordination is described from where agential subordination is prescribed is crucial.

  *   **Cognitive Subordination (Descriptive):**
      *   *Text:* 1254b22–23: "He participates in reason enough to apprehend it but not to have it." (*metechon logou... to aisthanesthai alla to echein me.*)
      *   *Analysis:* This is a claim about psychological capacity. It describes a limitation in the faculty of deliberation.
  *   **Agential Subordination (Prescriptive/Normative):**
      *   *Text:* 1254b16: "He who can be another's... is by nature a slave." (*tou allou... dunamenon einai.*)
      *   *Text:* 1254a14: "The slave is a sort of animate piece of property."
      *   *Analysis:* This assigns a status of ownership. It dictates that because of the cognitive description, the individual *belongs* to another.

  **The Gap:** The gap lies in the assumption that "belonging to another" is the *only* or *best* way to remedy the cognitive deficit. Aristotle asserts this is "advantageous" (1254b16), but he defines "advantage" teleologically (fulfilling one's nature), not subjectively (satisfaction of the slave).

  ### 4. The Hypothetical: Cognitive Dependence without Agential Dependence

  You ask: *If we imagine a person who genuinely requires another's practical wisdom for complex decisions but retains full ownership and control of their labor, would Aristotle's criteria still classify them as a natural slave?*

  **Aristotle's Answer:**
  Aristotle would likely argue that this hypothetical state is **unnatural** or **unstable**.

  1.  **The Coincidence Requirement:** For Aristotle, the concept of the "natural slave" *requires* the coincidence of cognitive and agential dependence. If a person retains full ownership (agential independence), they are, by definition, a citizen or a free person, regardless of their cognitive limitations. However, Aristotle would argue that if they truly lacked the deliberative faculty, they could not *sustain* agential independence. They would inevitably fall into ruin or require a master, at which point they would effectively become slaves in function, if not in law.
  2.  **The "Free but Foolish" Problem:** Aristotle acknowledges that some people are legally free but naturally slavish, and vice versa (1255a1). However, he views this as an error of convention, not nature. If a person has the cognitive defect of the natural slave, Aristotle believes justice demands they be ruled. To allow them "ownership" of their labor would be to allow a tool to direct the craftsman, which violates the natural order of ruling and being ruled.

  **Can the Argument Stand if Separated?**
  If we separate cognitive dependence from agential dependence (as modern ethics does):
  *   **Aristotle's Argument Collapses:** The entire justification for slavery rests on the claim that the slave is a *part* of the master, like the body is a part of the soul. If the "slave" retains agential independence, they are a separate moral entity. If they are a separate moral entity, ruling them despoticallly (for the master's good) rather than politically (for the common good) becomes tyranny, which Aristotle condemns elsewhere.
  *   **Modern Resolution:** We separate the two by introducing the concept of **rights** that are intrinsic to personhood, regardless of cognitive capacity. Aristotle lacks this concept. For him, rights/status flow from *capacity*. No capacity for authoritative reason = no status as an end in oneself.

  ### 5. Conclusion

  Your suspicion is well-founded. Aristotle does conflate cognitive and agential dependence, but he does not view it as a conflation. He views it as an **identity**.

  *   **Does he offer independent justification?** No. He offers a teleological assertion that nature intends the psychologically subordinate to be socially subordinate. He attempts to support this with dubious physiological claims (body types), but the core link is metaphysical: to be unable to rule oneself is to be a tool, and tools are property.
  *   **Is the inference an unstated premise?** It is the **defining axiom** of his political anthropology: *Authority follows Reason.* Where reason is lacking in authority, authority must be supplied from without, and that external authority entails ownership.
  *   **Viability:** If the two forms of dependence are separated, Aristotle's argument for *natural* slavery fails. It becomes an argument for *guardianship*, which preserves the person's agential status while assisting their cognitive deficits. Aristotle rejects this distinction because, in his framework, a human who cannot direct their own life is not fully a "human" in the political sense, but merely a biological organism animated by another's reason.

  Thus, the argument cannot stand if the two are separated, because the definition of the natural slave *is* the fusion of cognitive incapacity and agential instrumentality. To separate them is to step outside Aristotle's metaphysical framework and into a modern conception of human rights that he explicitly excludes.
