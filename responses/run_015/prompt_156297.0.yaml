      *   *Best Argument:* The referendum as proposed is dangerous for housing policy and vulnerable to elite capture (wealthy homeowners vs. powerless future residents). The Assembly better tracks "deliberative judgment." I will recommend rejecting the petitioned referendum and adopting a strengthened Citizens' Assembly model. This allows me to address the boundary problem and definition of will more clearly.

