      *   *Decision:* The prompt asks to engage the boundary problem and elite capture. The referendum model described (5%, no turnout floor) is highly susceptible to NIMBY capture and excludes the very people affected (future residents). The Citizens' Assembly addresses deliberation and inclusion better but lacks teeth.
      *   *Strategic Choice:* A memo recommending *against* the petitioned referendum mechanism in favor of a modified Citizens' Assembly (with some teeth) or a significantly hardened referendum process is likely the more "good governance" path. However, given the tension, recommending a *hybrid* or rejecting the referendum in favor of the assembly (with specific enhancements) seems most robust for a Charter Commission aiming for long-term stability.
