      *   **Analysis of Assembly (The Recommended Side):** How it solves the boundary problem (sortition can include non-voters/residents), reduces organization advantage.
      *   **Parameters:** Specifics on the Assembly (selection, scope, binding nature?). Let's make it binding only if supermajority agrees, or advisory but with mandatory response. Let's go with Advisory + Mandatory Consideration to balance efficiency and input.
      *   **Boundary Problem:** Explicitly address future residents and non-voting neighbors.
      *   **Elite Capture:** Explain why low-turnout referendums favor organized money/neighbors over dispersed interests.

  4.  **Refining the Argument (Self-Correction during drafting):**
