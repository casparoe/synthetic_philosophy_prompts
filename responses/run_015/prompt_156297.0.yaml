answer: |-
  **MEMORANDUM**

  **TO:** Charter Revision Commission
  **FROM:** Secretary
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Petitioned Referendum Mechanism vs. Citizens' Assembly

  **Recommendation**

  I recommend the Commission **reject** the petitioned charter amendment establishing a citizen referendum process and **propose** a standing Citizens' Assembly instead. The petitioned mechanism poses significant risks to equitable governance and long-term planning. Instead, we should authorize a Citizens' Assembly of 40 residents selected by sortition, empowered to issue binding recommendations on contested land-use ordinances unless overridden by a two-thirds council vote.

  **Theory of Popular Will**

  Our debate has stalled because we are using "the will of the people" to mean three different things. We must choose one to design coherent procedures:
  1.  **Aggregate Preference:** The sum of existing opinions at a specific moment.
  2.  **Electoral Authorization:** The mandate granted to representatives at the last election.
  3.  **Deliberative Judgment:** The conclusion the electorate would reach under conditions of information, diversity, and reasoned debate.

  This Commission should design procedures to track **Deliberative Judgment**. Aggregate preference is vulnerable to misinformation and transient passion, as seen in the hearing testimony regarding the supportive housing project. Electoral authorization is too blunt an instrument for specific zoning disputes. Our charter should facilitate decisions that withstand scrutiny, not merely count heads on a specific day. The Citizens' Assembly model is uniquely suited to this end; the referendum model is not.

  **The Case Against the Petitioned Referendum**

  The strongest argument for the petitioned referendum is accountability. It posits that when representatives ignore intense local opposition to impose regional priorities, voters must have a veto. This is a legitimate check on elite capture. However, in practice, this specific mechanism swaps elite capture for **organized minority capture**.

  *Elite Capture and Low-Salience Elections:* The petition proposes a 5% signature threshold, a 30-day window, and no turnout floor for off-year ballots. This structure favors concentrated interests over diffuse ones. Homeowner associations can mobilize signatures and turnout far more effectively than tenants, future residents, or regional advocates. A low-turnout special election does not reflect the "will of the people"; it reflects the will of those most aggrieved by change. By insulating a surviving ordinance from reconsideration for two years, the petition creates a ratchet effect where obstruction is permanent but approval is temporary.

  *The Boundary Problem:* This is the decisive flaw. The referendum enfranchises current voters only. In the case of supportive housing, the primary stakeholders—the future residents—are not current voters. Furthermore, nearby residents who rent cannot vote in municipal elections in many jurisdictions, yet they bear the brunt of construction and neighborhood change. A referendum mechanism inherently excludes these affected parties. It treats the city as a closed club of property-owning voters rather than a community of residents. If our goal is legitimate governance, we cannot empower a voting majority to veto housing for a non-voting minority.

  **The Citizens' Assembly Proposal**

  A Citizens' Assembly mitigates these risks while preserving public input. It shifts the focus from power to reason. Below are the specific parameters I propose we advance for the November ballot:

  1.  **Selection:** 40 members selected by sortition (random lottery) from all **adult residents**, not just registered voters. This solves the boundary problem by enfranchising renters and potential future residents in the deliberative process, even if they cannot vote in the final election.
  2.  **Trigger:** The Assembly convenes upon a council vote of 5–4 or closer on contested land-use matters, or upon a petition of 10% of registered voters (higher than the proposed 5% to ensure broad concern).
  3.  **Process:** The Assembly meets for four weekends with access to independent experts and staff. They hear from proponents, opponents, and affected non-voters.
  4.  **Power:** The Assembly issues a recommendation with reasons. This recommendation is **binding** unless the City Council overrides it with a two-thirds supermajority vote within 14 days. This preserves council accountability while requiring a broad consensus to ignore the Assembly's deliberative judgment.
  5.  **Scope:** The Assembly cannot review budget appropriations or emergency ordinances, ensuring city operations remain stable.

  **Why This Works**

  This hybrid model respects the Council's responsibility to regional obligations (like housing funding) while ensuring local concerns are heard under conditions that promote deliberation rather than mobilization.

  By expanding the pool to all adult residents, we acknowledge that those affected by housing policy deserve a voice, even if they lack the franchise. By requiring a supermajority to override the Assembly, we prevent the Council from easily dismissing public input, but we avoid the referendum's rigid two-year lockout that paralyzes governance.

  Critics will argue this is less "democratic" than a direct vote. But if democracy means rule by the organized and the propertied in off-year elections, it is a hollow victory. If democracy means governing based on informed judgment that accounts for all residents, the Assembly is superior. The referendum petition seeks to win a vote; the Assembly seeks to find a solution.

  **Conclusion**

  The recent housing vote exposed a fracture between regional needs and local preferences. The petitioned referendum would institutionalize this conflict, empowering those best able to organize against change while silencing those most in need of housing.

  I move that we reject the petitioned amendment and draft charter language establishing the Citizens' Assembly as described above. This path honors the public's desire for input without sacrificing the city's ability to govern inclusively and effectively.

  **Action Required:** Vote to recommend rejection of the petitioned referendum and adoption of the Citizens' Assembly proposal for the November ballot.
