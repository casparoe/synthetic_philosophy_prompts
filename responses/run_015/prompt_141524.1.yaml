answer: |-
  I am sorry about your father. It makes sense that building a bridge to him led you to ask what makes a bridge real. When grief opens a door to the metaphysical, it is hard to close it again. You are looking for a floor that holds weight.

  Here is the specification you asked for. This is the design document for a cosmological theory that permits you to trust your history, your data, and your grief.

  ### The Specification: Requirements for a Non-Boltzmann Cosmology

  **1. Causal Adequacy (Not just Data Fitting)**
  *   **The Requirement:** The theory must explain why the data exists *causally*, not just why it is *possible*. It must predict that the correlation between "memory of X" and "occurrence of X" is high, not just that the memory exists.
  *   **Why it's a Requirement:** A Boltzmann Brain (BB) fits the data perfectly by definition—it fluctuates into existence *with* the data in its head. If a theory only requires "data matching," BBs win because they are statistically cheaper to produce than real observers. To rule them out, the theory must privilege *causal chains* over *static snapshots*.
  *   **Status:** **Non-negotiable.** Without this, science is impossible. If correlations don't imply causation, no theory can be tested.

  **2. A Non-Gerrymandered Measure (The Counting Rule)**
  *   **The Requirement:** The theory must provide a rule for counting observers that does not rely on ad-hoc definitions designed specifically to exclude BBs. It must define an "observer" based on physical properties (e.g., complexity, thermodynamic cost) that are independent of the BB problem.
  *   **Why it's a Requirement:** As you noted, if you count "conscious moments," BBs win. If you count "embodied evolutionary histories," normal observers win. If the theory cannot tell you *what to count* without looking at the answer first, it is circular. It needs a "measure" that suppresses fluctuations naturally (e.g., by weighting by energy cost or duration).
  *   **Status:** **Non-negotiable,** but currently the weakest link in physics. Most theories cheat here.

  **3. External Record Correlation**
  *   **The Requirement:** The theory must predict that internal memories are correlated with external, independent records (photos, fossils, handwriting) at a rate significantly higher than chance.
  *   **Why it's a Requirement:** A BB can have a memory of a fishing trip. A BB *plus* a fluctuated photo album is exponentially less likely. A real history makes the photo and the memory *together* likely. The theory must make the joint probability of [Memory + External Record] higher than [Memory + Fluctuated Record].
  *   **Status:** **Non-negotiable.** This is the only empirical way to distinguish a solipsistic fluctuation from a shared history.

  **4. Causal Continuity (The 90% Case)**
  *   **The Requirement:** The theory must require that the *mechanism* producing your current state is continuous with the past it describes. It is not enough that 90% of your memories are true; the truth of those memories must be the *reason* you have them.
  *   **Why it's a Requirement:** A fluctuation that happens to match reality is still a fluctuation. If the link is accidental, the next moment is uncorrelated to the previous one. You need a theory that guarantees *temporal coherence*, not just static accuracy.
  *   **Status:** **Non-negotiable.** Without this, you cannot plan for the next minute, let alone process the last eight months.

  **5. Cognitive Stability (The Self-Undermining Clause)**
  *   **The Requirement:** The theory must not render its own acceptance irrational. If the theory implies you are likely a BB, it implies your reasoning is likely flawed, which undermines the reasoning used to accept the theory.
  *   **Why it's a Requirement:** This is not a comfort preference; it is a logical constraint. A theory that says "You should believe me, but your belief is likely a random glitch" is performatively contradictory. It is like a sign that says "This sign is lying."
  *   **Status:** **Non-negotiable.** This is the strongest philosophical weapon against BBs.

  **6. The Past and Future Hypothesis (Entropy Boundaries)**
  *   **The Requirement:** The theory must posit a low-entropy boundary condition in the past (to allow history) AND a mechanism that prevents the universe from settling into an eternal, high-entropy equilibrium (to prevent BB domination in the future).
  *   **Why it's a Requirement:** A low-entropy start explains why *we* exist now. It does not explain why BBs don't exist *later*. If the universe lasts forever in its current accelerating state, BBs eventually outnumber us. The universe must end, cycle, or change phase to keep the ratio of Real Observers to BBs finite and favorable.
  *   **Status:** **Non-negotiable** for solving the problem, though the specific mechanism (Big Crunch, Vacuum Decay, etc.) is open.

  ---

  ### The Impossibility Analysis

  You asked if a subset of these is jointly unsatisfiable. Your intuition is correct. There is a trilemma. You generally cannot have all three of the following:

  1.  **Eternal De Sitter Space:** The universe continues expanding forever in something like its current state (which fits current dark energy data).
  2.  **Typicality:** You should assume you are a random sample from the set of all observers predicted by the theory.
  3.  **No Stipulation:** The theory doesn't just define BBs out of existence by fiat.

  **The Argument:**
  If (1) is true, time is infinite. In infinite time, even extremely rare fluctuations happen infinitely often. Normal observers (evolved, embodied) are rare and short-lived. BBs are rarer per unit volume, but they can fluctuate *anywhere* in the empty vacuum forever. Over infinite time, the number of BBs diverges to infinity faster than the number of Normal Observers.
  If (2) is true, you must conclude you are a BB.
  If you conclude you are a BB, you violate (5) Cognitive Stability.

  **To save your sanity (and science), you must drop one:**
  *   **Drop (1):** The universe must end (Vacuum Decay, Big Rip, Big Crunch). This cuts off the time available for BBs to accumulate. *Current Status: Plausible (Higgs vacuum metastability), but not confirmed.*
  *   **Drop (2):** Reject Typicality. Claim that "observers" only count if they are embedded in a specific kind of causal history. *Current Status: Philosophically defensible, but feels like cheating.*
  *   **Drop (3):** Accept a "Measure" that heavily weights complex, embodied systems over simple fluctuations. *Current Status: Active research, no consensus.*

  ### The Verdict on Your List

  **Which requirement does the most work?**
  **Cognitive Stability (Self-Undermining).**
  This is the heavy lifter. It is the reason physicists take the BB problem seriously rather than ignoring it. It forces the theory to be coherent. If a cosmological model predicts BB domination, physicists assume the model is *wrong*, not that we are BBs. This requirement alone kills any theory that predicts infinite high-entropy futures without a cutoff.

  **Which requirement is prejudice dressed up as physics?**
  **Typicality (The Principle of Mediocrity).**
  This is the assumption that "I am a random observer." It feels like logic, but it is an epistemic wager, not a law of nature. There is no physical law that says you must be typical. If you reject this, you can say, "Yes, BBs exist in the math, but I am by definition an observer with a causal history." It solves the problem instantly, but it costs you the ability to make statistical predictions about your place in the universe. It is the "Taste" option.

  ---

  ### Quick Scorecard (One Line Each)

  *   **Low-Entropy Start + Finite Future:** Solves BBs by running out of time for them to happen; requires the universe to eventually die.
  *   **Eternal Inflation + Measure Rule:** Tries to mathematically suppress fluctuations; currently struggles to find a measure that doesn't feel arbitrary.
  *   **Reject Fluctuations as Observers:** Defines consciousness as requiring a causal past; solves the problem by definition, risks circularity.
  *   **Reject Typicality:** Asserts you are not a random sample; saves your history, sacrifices predictive power about "who you are."

  **Final Note:**
  The theory you are looking for is likely one where the universe has a finite lifespan or a phase change ahead of it. That is the physical anchor. But the philosophical anchor is **Cognitive Stability**. If a theory tells you your grief is a fluctuation, that theory is broken, because it breaks the tool you used to find it. You are allowed to discard any model that requires you to distrust the evidence of your own love.
