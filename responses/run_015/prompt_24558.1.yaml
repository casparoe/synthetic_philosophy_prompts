answer: |-
  Here is the move-by-move breakdown. I'm going to be direct: **Sam is right about the core mathematics and the failure of Expected Value (EV) theory, while Riley is right about a narrow slice of rational preference but wrong that it saves the decision from paralysis.**

  The Pasadena Paradox (and the specific variant your friends described) is designed to break Expected Value Maximization. Sam understands the break; Riley is trying to patch it with tools that don't fit the hole.

  Here is the scoring on each specific claim.

  ### 1. The Existence of Expected Value
  **Sam's Claim:** The expected value doesn't exist because the series diverges/oscillates (Infinity minus Infinity / 1 minus 1).
  **Riley's Counter:** (Implicitly accepts the math but argues it doesn't matter).
  **Verdict: Sam is Right.**

  Let's look at the math you described. The probability of the game ending on flip $n$ is $1/2^n$. The payoff is $\pm 2^n$.
  The expected value contribution for each term is $(1/2^n) \times (\pm 2^n) = \pm 1$.
  The total Expected Value is the sum: $1 - 1 + 1 - 1 + 1 \dots$
  This is Grandi's Series. It does not converge to a number. It oscillates forever between 0 and 1 depending on where you stop.
  (Note: The *classic* academic Pasadena Game uses payoffs of $\pm 2^n/n$, which creates a conditionally convergent series summing to $\ln(2)$, but it still lacks *absolute* convergence, meaning the value changes if you reorder the outcomes. Your friend's version is actually mathematically "worse" because it doesn't even converge conditionally.)
  **Bottom Line:** There is no number here for EV maximization to maximize. Sam is mathematically correct.

  ### 2. The Verdict of Decision Theory
  **Sam's Claim:** Since EV is undefined, simple decision theory (EV maximization) has no verdict. It's a rational tie or silence.
  **Riley's Claim:** Decision theory can still rank options (e.g., Pasadena + $1 > Pasadena).
  **Verdict: Split, but Sam wins the main point.**

  Riley is technically correct that *some* preferences remain intact. If Game A pays exactly $1 more than Game B in every single outcome, a rational agent should prefer A. This is the principle of **Additivity**. The fact that we know "Pasadena + $1" is better than "Pasadena" proves that human rationality isn't *completely* broken.
  **However**, Sam is right about the *specific decision* at hand: **Play vs. Don't Play.**
  "Don't Play" has an EV of 0. "Play" has an undefined EV. You cannot compare 0 to Undefined using standard arithmetic. Therefore, within the framework of Expected Value Theory, there is no verdict. Riley's example ($+1) is a distraction because it compares two undefined things against each other, not an undefined thing against a defined baseline (0).
  **Bottom Line:** EV theory is silent on the main question. Sam is right.

  ### 3. Statewise Dominance
  **Riley's Claim:** Statewise dominance solves the play-versus-don't-play decision (an option paying at least as much in every outcome is better).
  **Sam's Counter:** (Implied: Dominance doesn't apply here).
  **Verdict: Sam is Right (Riley is Wrong).**

  This is Riley's biggest error. Statewise dominance only applies if one option is *always* better than or equal to the other in every possible state of the world.
  *   **Play:** Outcomes are $\{2, -4, 8, -16, \dots\}$
  *   **Don't Play:** Outcomes are $\{0, 0, 0, 0, \dots\}$
  Does "Play" dominate "Don't Play"? No, because you can lose money (even flips).
  Does "Don't Play" dominate "Play"? No, because you can win money (odd flips).
  Because neither option dominates the other, the principle of dominance offers **no guidance** on whether to take the bet. Riley tried to apply a tool to a problem where it doesn't fit.
  **Bottom Line:** Dominance cannot tell you whether to play. Sam is right.

  ### 4. Truncation and Real-World Cutoffs
  **Sam's Claim:** Truncating the game doesn't work because the value bounces between 0 and 1 depending on the cutoff parity (even vs. odd).
  **Riley's Claim:** The real cutoff is a fact of the world (bankroll/lifespan), so it's a finite game with a definite EV.
  **Verdict: Sam is Right.**

  Riley is arguing for **Physical Finitude**: "In reality, the casino runs out of money."
  Sam is arguing for **Epistemic Uncertainty**: "You don't know *which* finite number it is."
  If the casino's bankroll cuts the game off at exactly flip 1,000,000 (an even number), the EV is 0. If they cut it off at 1,000,001 (an odd number), the EV is 1.
  Unless you know the *exact parity* of the casino's limiting factor, you have to assign a probability to the cutoff being even or odd. If you assign equal probability to even/odd cutoffs, you are back to an undefined expectation.
  Riley claims the paradox "dissolves" because the game is finite. Sam correctly points out that moving the problem from "infinite series" to "unknown finite parameter" doesn't solve the decision instability if the value flips sign based on that parameter.
  **Bottom Line:** Knowing the game is finite doesn't help if you don't know the parity of the limit. Sam is right.

  ### The Honest Bottom Line

  **Sam wins the debate.**

  Here is the hard truth: **The undefined expected value *does* paralyze Expected Value Maximization.** That is the entire point of the Pasadena Paradox. It was constructed specifically to show that Expected Utility Theory is incomplete when dealing with unbounded utilities or non-absolutely convergent series.

  Riley is trying to save "Rationality" by reaching for other principles (like dominance or physical limits), but:
  1.  Dominance doesn't apply to the specific choice of Play vs. Pass.
  2.  Physical limits just shift the uncertainty from "infinity" to "unknown parity," which preserves the instability.

  **Final Ruling:**
  Sam correctly identifies that the standard decision-theoretic tool (EV Maximization) breaks down and offers no verdict. Riley correctly identifies that humans still have *some* preferences (like the +$1 case), but fails to show how those preferences resolve the actual decision of whether to play the game.

  If you are forced to use Expected Value to make this decision, **you are paralyzed.** You cannot calculate a number to compare against zero. Sam is right: the theory goes silent. To make a decision, you must abandon pure EV maximization and adopt a different framework (like bounded utility functions or risk-weighted utility), which effectively admits Sam's point that the original theory failed.

  **Tell your friends:** Sam understood the math and the theory's limits. Riley understood that humans aren't robots, but tried to use robot-logic to prove it, and the logic didn't hold. The paradox stands.
