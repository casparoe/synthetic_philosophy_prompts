answer: |-
  The Casting Die sat in the centre of the partitioned cubicle, a heavy brass cube enclosed in glass, resting on a pedestal of scratched oak. It didn't glow or hum. It just waited. When Mira pulled the lever, gravity did the rest, tumbling the internal weights until one side landed face up. *Applicant A* or *Applicant B*.

  Mira taped shut the cardboard box on her desk. Her last week at the Division of Indifferent Petitions was nearly over. Outside the frosted glass, the office hummed with the low-grade anxiety of civil servants managing impossible equations.

  "You're leaving the Die polished," Elias said, leaning against the partition. He held a file folder thick enough to stop a bullet. "Sentimental?"

  "It's just metal, Elias."

  "It's the only honest thing in the building," he said, tapping the glass. "The Bundling Rule holds. When the criteria are identical, A and B aren't two options. They're one bundle. {A, B}. Choosing either member is choosing the bundle. The Die doesn't decide; it just terminates the file."

  Mira looked at the machine. "Then why do they freeze?"

  "Who?"

  "The petitioners. You've seen the logs. When we certify a case as an Exact Tie and notify them, forty percent stall. They miss signing windows. They request extensions they don't need. They sit in the waiting room staring at their hands."

  Elias shrugged. "Adjustment period. The Bundle is abstract."

  "It's not that," Mira said. "Give them a decoy. Tell them there's a third option—same placement, but with a two-year deferral. Clearly worse. Suddenly, they sign instantly. They pick the original slot without blinking. If the Bundle was real, the decoy shouldn't matter. A is still equal to B. But adding C breaks the paralysis."

  "Maybe C proves A and B are valuable," Elias countered. "Or maybe the petitioners are flawed agents. They want reasons where none exist. They want to be pushed."

  "Or maybe the Bundle is incoherent," Mira said softly. "Maybe you can't choose a set. You have to choose a thing. If there's no reason to pick A over B, there's no action, just physics."

  Elias pushed off the partition. "Philosophy doesn't clear the queue, Mira. Just process 8940 before you go. It's a housing grant. Two applicants. Scores match down to the decimal. Biometrics match. Even the handwriting analysis came back identical."

  He dropped the file on her desk and walked away.

  Mira opened the folder. Applicant 492 and Applicant 493. Both needed the housing for the same medical condition. Both had the same income, same history, same dependents. The certification stamp in the corner confirmed it: *INDIFFERENT*.

  She looked at the Casting Die. To use it was to accept the Bundling Rule. It was to say that the difference between 492 getting a home and 493 getting nothing was morally null, because the choice itself was null.

  But her eyes caught a discrepancy on the second page. It was tiny. The timestamp on 492's digital signature was 14:02:03. 493's was 14:02:04.

  One second.

  If she flagged it, the case would be kicked back to Verification. They would dig deeper. Maybe they'd find a missed tax credit, a slight variation in residency duration, something that broke the tie. If she found a real difference, she wouldn't need the Die. She could give the petitioners a reason. She could respect them as agents who choose for causes, not coins.

  But if the difference was irrelevant—if the one-second gap was just noise—then flagging it was a lie. It was manufacturing asymmetry to comfort herself. It was pretending the Die wasn't what it was.

  Mira hovered her mouse over the *Request Expansion* button.

  The office lights flickered, a common surge in the old building. She thought about the petitioners in the waiting room. The ones who couldn't move until someone gave them a bad option to reject. They wanted a narrative. They wanted to know why *this* one and not *that* one. The Bundling Rule said there was no "why." The Die said the "why" was noise.

  If she clicked *Request Expansion*, she might save them from the lottery. Or she might just delay the inevitable, burning weeks of their time to find a distinction that didn't matter, pretending the universe wasn't indifferent when it clearly was.

  If she pulled the lever, she accepted the indifference. She accepted that sometimes, justice is just a tumbling weight in a glass box.

  Mira looked at the timestamps again. One second. Was it a reason? Or was it just the first stray consideration to show up, the way a pedestrian steps left instead of right not because of logic, but because of a gust of wind?

  She moved the cursor away from *Request Expansion*.

  There was no epiphany. No sudden clarity about the nature of agency. There was just the queue, and the box she needed to pack, and the fact that the Die needed to stop the file.

  She opened the glass casing. The brass was cool against her palm. She gripped the lever. It felt heavy, dense with the history of every tie it had broken without resolving.

  "Sorry," she whispered, though she wasn't sure to whom. The applicants? Elias? The machine?

  She pulled the lever.

  The weights tumbled, clacking softly against the glass walls. They settled. The face showing was blank, as always, until the scanner read the internal weight distribution and logged the result in the system. *Applicant 492.*

  Mira typed the decision into the terminal. *Certified.* She closed the file. She didn't look for the reason behind the one-second gap. She didn't verify if the decoy effect would have worked on these two. She just put the folder in the out-tray.

  The Die sat silent again, waiting for the next bundle. Mira put her coat on. It was raining outside, the drops hitting the window in no particular pattern, and she stepped out into the corridor without looking back at the cubicle.
