prompt: |-
  Okay so I'm trying to figure out where the virtue ethics vs situationist debate actually matters for real work, not just academic scorekeeping. Everyone knows the Milgram/Hartshorne stuff and the usual responses—local traits, interactionism, etc. But I'm interested in a more specific angle: if situationism is right that behavior is highly context-sensitive, then cultivating a 'virtue' might not be about building a stable global character but about learning to calibrate your moral sensitivity to specific ecologies—like knowing when a workplace culture suppresses honesty versus when it rewards it. So: if you had three grad studens and a small grant for about three years, which open questions should they actually chase? I'm not asking for a bibliograpy. I want a defended agenda: which lines are upstream—settling them changes how you'd design moral education or instutional ethics—which are dead ends that don't change practice, and what result over the next few years would shift your ranking. Specifically, should they focus on (a) refining interactionist models of trait expression, (b) testing whether virtue-labeling itself changes behavior in different contexts, or (c) something else—maybe whether situationist data undermines the very idea of moral improvement, or whether we need a new taxonomy of 'micro-virtues'? Give me the ordering with the reasoning, not a survey.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Deconstruct the User's Request:**
      *   **Core Topic:** Virtue Ethics vs. Situationism debate.
      *   **Constraint:** No academic scorekeeping/bibliography. Focus on *real work* (practice, moral education, institutional ethics).
      *   **Premise:** The user accepts the situationist challenge (behavior is context-sensitive) but suggests a pivot: virtue isn't global stability, but *calibration* to specific ecologies.
      *   **Task:** Design a 3-year research agenda for 3 grad students + small grant.
      *   **Requirements:**
          *   Defend the agenda (reasoning, not just a list).
          *   Identify upstream questions (settle them -> changes design of ethics education).
          *   Identify dead ends (don't change practice).
          *   Specify what results would shift the ranking.
          *   Choose between options (a) interactionist models, (b) virtue-labeling effects, (c) something else (e.g., moral improvement viability, micro-virtues).
          *   Provide an ordering with reasoning.

  2.  **Analyze the Options:**
      *   *(a) Refining interactionist models:* This is the standard psychological response (Person x Situation). It's scientifically robust but often philosophically thin. Does it tell us *how* to educate? Maybe, but it risks becoming just descriptive psychology without normative bite.
      *   *(b) Testing virtue-labeling:* This is social psychology (priming, identity). Does calling someone "honest" make them act honestly in specific contexts? This is actionable for intervention but might be superficial (manipulation vs. cultivation).
      *   *(c) Something else:* The user suggests "calibration to ecologies" or "micro-virtues." This aligns best with the user's insight that virtue might be about *sensitivity* to context rather than *resistance* to context.

  3.  **Evaluate "Upstream" vs. "Dead End":**
      *   *Dead End:* Arguing whether Aristotle was right about global traits. That's textual exegesis. Also, purely descriptive situationism (proving people are inconsistent) is old news (Milgram is 60 years old). We know behavior varies. The question is *what to do about it*.
      *   *Upstream:* How do we train people to navigate contexts? If traits aren't global, is "character education" doomed? Or does it just need to change form? The definition of "moral improvement" is the critical upstream node. If improvement is possible only via ecological engineering, then individual cultivation is secondary. If improvement is possible via meta-cognitive calibration, then education focuses on perception/recognition.

  4.  **Develop the Research Agenda (The "Defended Agenda"):**
      *   *Goal:* Move from "Do traits exist?" (settled-ish: they exist but are local) to "How do we operationalize moral competence given local traits?"
      *   *Priority 1: Ecological Calibration (The "Something Else").* This directly addresses the user's insight. If virtue is knowing *when* to be honest, research needs to map the cues that signal "honesty is safe/rewarded" vs. "honesty is punished."
      *   *Priority 2: Intervention/Labeling (Virtue-Labeling).* Once we know the ecology, how do we nudge behavior? Labeling is a tool. But it's downstream of knowing *which* label works in *which* context.
      *   *Priority 3: Interactionist Modeling.* This is the foundational science, but for a 3-year practical grant, it's too abstract. It's necessary background, not the primary output for *practice*.

      *Wait, let me reconsider the ordering based on "Upstream" impact.*
      *   If we don't know *if* moral improvement is possible via training (vs. just situational engineering), we can't design education.
      *   So, the core question is: **Is moral competence a skill of perception (reading the room) or a capacity for resistance (standing firm)?**
      *   Situationism suggests resistance is hard/limited. So perception/calibration is the winning bet.
      *   Therefore, the research should focus on **Moral Perception/Calibration** (Option C variant).

      *Revised Ordering:*
      1.  **Mapping Moral Ecologies (Option C - Micro-virtues/Calibration).** Upstream. If contexts determine behavior, we need a taxonomy of contexts.
      2.  **Training Perceptual Sensitivity (Option C - Application).** Can we teach people to spot the "danger zones"?
      3.  **Labeling/Identity (Option B).** This is a tactic within the ecology. Less upstream than understanding the ecology itself.
      4.  **Interactionist Models (Option A).** Too theoretical for a 3-year practical grant. Let the psychologists handle the meta-analysis; these students should build tools.

      *Actually, let's look at the "Dead End" constraint.*
      *   Debating the existence of global traits is a dead end for *practice*. We assume locality.
      *   Trying to build "global resilience" without ecological support is a dead end.

      *Refining the "Something Else":*
      *   The user suggested: "cultivating a 'virtue' might not be about building a stable global character but about learning to calibrate your moral sensitivity to specific ecologies."
      *   This is the winner. It bridges the gap.
      *   Let's call this **"Moral Metacognition and Ecological Calibration."**

  5.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the shift from "Do traits exist?" to "How do we function given their locality?"
      *   **The Ordering:**
          1.  **Priority 1: Taxonomy of Moral Ecologies (The "Where").** Before teaching virtue, map the terrain. Which specific situational variables kill honesty/courage?
          2.  **Priority 2: Trainability of Moral Perception (The "How").** Can we teach people to recognize those variables in real-time? (This is the "calibration" skill).
          3.  **Priority 3: Identity/Labeling Interventions (The "Nudge").** Only useful if 1 & 2 are established.
      *   **Reasoning:** Why this order? Because you can't train perception without knowing what to perceive. You can't use labeling effectively without knowing which ecology supports that identity.
      *   **Dead Ends:** Global trait measurement. "Resilience" training that ignores context.
      *   **Shift Conditions:** What would make me change my mind? If we find that perceptual training doesn't transfer even across similar contexts, then we must pivot to *structural* change only (abandon individual education).

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is mapping ecologies too big for 3 students?
      *   *Fix:* Narrow it. Focus on *one* domain (e.g., organizational whistleblowing or medical ethics). Let's suggest **Organizational/Professional Ethics** as the testbed. It's concrete.
      *   *Critique:* Is Interactionism (A) truly lower priority?
      *   *Fix:* Yes, because Interactionism is the *theory*, but Calibration is the *skill*. For "real work," we need the skill. The theory is assumed (situationism is largely accepted in social psych).
      *   *Key Insight:* The "Upstream" question is whether *individual* improvement is viable at all. If situationism is strong, maybe we should only fix institutions. The research must test if *individual calibration* adds value over *institutional reform*.

  7.  **Final Polish:**
      *   Ensure the tone is direct, pragmatic, and avoids jargon where possible.
      *   Make sure the "Shift Conditions" are specific empirical outcomes.
      *   Check against the prompt: 3 grad students, 3 years, small grant. Needs to be feasible.

      *Revised Plan for Feasibility:*
      *   Student 1: Qualitative/Mapping (Interviews/Surveys to identify ecological triggers).
      *   Student 2: Experimental/Training (Develop and test a "calibration" training module).
      *   Student 3: Longitudinal/Field (Test if training holds up in actual workplace settings).
      *   Focus: Professional Ethics (e.g., tech, medicine, or academia).

      *Wait, keep it slightly broader but actionable.* Let's stick to the conceptual agenda but ground it in feasible methods.

      *Final Ordering:*
      1.  **Ecological Taxonomy (C1):** Identify the specific situational levers.
      2.  **Perceptual Training (C2):** Can we teach recognition of those levers?
      3.  **Identity/Labeling (B):** As a secondary tool.
      *   **Drop (A):** Interactionist modeling is for theorists, not practitioners.

      *Dead Ends:* Global trait assessment. Generic "resilience" workshops.
      *   *Shift Condition:* If perceptual training fails to change behavior even in mapped ecologies, then individual ethics education is a dead end; focus solely on institutional design.

  8.  **Final Review against constraints:**
      *   Defended agenda? Yes.
      *   Ordering with reasoning? Yes.
      *   Upstream vs. Dead End? Yes.
      *   Shift conditions? Yes.
      *   No bibliography? Yes.

      (Self-Correction on "Interactionism"): I should clarify that Interactionism isn't a dead end *scientifically*, but for a 3-year *practical* grant, it's not the leverage point. The leverage point is *application*. I will frame it as "downstream of the calibration question."

