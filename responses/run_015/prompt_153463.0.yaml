answer: |-
  Here is a defended research agenda for a three-year, three-student grant. It assumes the situationist critique is largely correct (global traits are weak) but rejects the nihilist conclusion (therefore, ethics education is useless). Instead, it treats virtue as a **meta-skill of ecological calibration**.

  ### The Core Hypothesis
  If behavior is context-sensitive, then "moral competence" is not the possession of a robust internal disposition (e.g., "Honesty"), but the **ability to accurately diagnose the moral affordances of a specific context** and deploy the appropriate behavioral script. Virtue is not *resistance* to the situation; it is *navigation* of it.

  ### The Ordering

  **Priority 1: Taxonomy of Moral Ecologies (The "Where")**
  *   **The Task:** Do not measure character. Map the contexts. Student 1 focuses on identifying the specific, replicable situational variables that trigger moral failure in a specific domain (e.g., corporate compliance, medical triage, or academic research).
  *   **Why Upstream:** You cannot design moral education if you do not know which situational features suppress virtue. Is it time pressure? Hierarchy? Ambiguity of responsibility? Diffusion of agency? Most ethics training assumes the context is neutral and the agent is the variable. This flips it. We need a "periodic table" of moral hazards.
  *   **Feasibility:** Mixed methods. Surveys + retrospective incident analysis in partner organizations.
  *   **Dead End Alternative:** Measuring "global honesty" or "integrity" via psychometric tests. This is a dead end for practice because situationism has already shown these scores predict little variance in actual behavior across different contexts.

  **Priority 2: Trainability of Moral Perception (The "How")**
  *   **The Task:** Student 2 develops and tests interventions that train *recognition*, not *resolve*. Can we teach agents to spot the "hazard variables" identified in Priority 1 in real-time?
  *   **Why Upstream:** If virtue is calibration, the muscle to build is perception, not willpower. If this fails—if people can recognize the toxic ecology but still cannot adjust behavior—then the "individual improvement" model is dead, and we must pivot entirely to structural/institutional reform. This is the make-or-break empirical question for virtue ethics in a situationist world.
  *   **Feasibility:** Simulation-based training (VR or case scenarios) where the variable is the *context*, not the *dilemma*. Measure success by whether the subject identifies the risk, not just whether they make the "right" choice.
  *   **Dead End Alternative:** "Resilience" or "Grit" training. This assumes the agent can withstand the context. If situationism is right, this is like training a swimmer to hold their breath indefinitely rather than teaching them to read the rip current.

  **Priority 3: Context-Contingent Labeling (The "Nudge")**
  *   **The Task:** Student 3 tests whether virtue-labeling (e.g., "You are the kind of person who speaks up") works *only* when the ecology supports it.
  *   **Why Downstream:** Identity priming is a tool, not a foundation. It is useless (or dangerous) if deployed in a hostile ecology. Telling someone they are "honest" in a culture that punishes honesty creates cognitive dissonance and burnout. We need to know the boundary conditions of identity interventions.
  *   **Feasibility:** Field experiments. Apply labels in high-support vs. low-support contexts and measure behavioral follow-through.

  **Deprioritized: Refining Interactionist Models (Option A)**
  *   **Reasoning:** This is theoretical housekeeping. We already know Person x Situation interactions exist. For a grant aimed at *real work*, refining the statistical model of the interaction is less valuable than building the tool that navigates the interaction. This is for the psychologists to publish; your students should build the curriculum.

  ### What Would Shift the Ranking?

  **1. The "Structural Determinism" Result:**
  If Priority 2 (Perceptual Training) shows that even when agents correctly identify the toxic ecology, their behavior does not change (effect size < 0.1), **stop everything.**
  *   **Shift:** Abandon individual moral education entirely. The agenda shifts to **Institutional Engineering**. If calibration doesn't work, the only ethical lever is changing the situation itself (incentives, hierarchy, anonymity). Virtue ethics becomes purely political/structural.

  **2. The "Transfer" Breakthrough:**
  If Priority 2 shows that perceptual training in *one* ecology (e.g., recognizing pressure in finance) transfers to *untrained* ecologies (e.g., recognizing pressure in healthcare), **move Priority 2 to #1 permanently.**
  *   **Shift:** This would suggest a "meta-virtue" exists after all—not a behavioral trait, but a cognitive skill of situational awareness that *is* globally stable. This saves a modified version of traditional virtue ethics.

  **3. The "Labeling Backfire":**
  If Priority 3 shows that virtue-labeling in hostile ecologies increases unethical behavior (e.g., moral licensing or reactance), **ban identity-based ethics training.**
  *   **Shift:** Ethics education becomes purely procedural and informational. No more "be a good person" rhetoric; only "here is the protocol for this context."

  ### Summary of the Agenda
  Don't ask if people have good character. Ask if they can read the room.
  1.  **Map the room** (Ecological Taxonomy).
  2.  **Teach the reading** (Perceptual Training).
  3.  **Test the prompts** (Context-Labeling).

  If #2 fails, individual virtue is a myth, and your work shifts to institutional design. If #2 succeeds, you have operationalized virtue ethics for the 21st century: **Virtue as Situational Intelligence.**
