      *   **The Matrix:** Green code falls. Neo sees it. He manipulates it. Inside the Matrix, he breaks physics. Outside, he's just a guy in a pod.
      *   **Downward Causation:** Can the high-level pattern (the symbol "Neo is the One") cause low-level physical changes (the machines stopping, the code rewriting)?
      *   **Settled:** The movie shows a real world (Zion, machines) and a simulated world (Matrix).
      *   **Contested:** Is the code *semantic* (meaningful symbols) or just *syntax* (causal switches)? Can meaning change matter?

