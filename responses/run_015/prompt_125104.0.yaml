answer: |-
  This is a beautiful challenge. You want to run a social science experiment where the subjects are your peers, the apparatus is a whiteboard and some index cards, and the hypothesis is fundamental to political philosophy. You want the data to speak, not the lecturer.

  Given your background, I've structured this like a lab protocol: Controls, Variables, and clear Error Analysis.

  ### Session Title: "The Outing Committee"
  **Objective:** Empirically test how information and voting rules affect group outcomes and individual payoff.
  **Time:** 75 Minutes
  **Participants:** 10 (You + 9 members)
  **Materials:**
  *   **Preference Cards (10):** Pre-printed index cards (see "The Rig" below).
  *   **Ballots (30):** Small slips of paper.
  *   **Whiteboard & Markers.**
  *   **Payoff:** A bag of Hershey's Kisses or similar (approx. 50 pieces).
  *   **Timer.**

  ---

  ### Part 1: The Rig (Pre-Session Prep)
  To ensure the experiment yields data rather than noise, you must control the "True Preferences." Do not let them generate their own preferences. Hand these out face-down as they enter.

  **The Options:**
  *   **A:** The Art Museum (Costly, formal)
  *   **B:** The Botanical Garden (Moderate, outdoors)
  *   **C:** The Community Cafe (Cheap, casual)

  **The Distribution (10 People):**
  *   **Group 1 (4 people):** Card reads: **A > B > C** (A is 1st choice)
  *   **Group 2 (3 people):** Card reads: **B > C > A** (B is 1st choice)
  *   **Group 3 (3 people):** Card reads: **C > B > A** (C is 1st choice)

  *Note the hidden alignment:* Groups 2 and 3 both prefer **B** over **A**. Group 1 prefers **A** over everything. **B** is the "Compromise Candidate."

  **The Payoff Scheme:**
  At the end of the session, the group will physically go to *one* location (symbolically).
  *   If your **1st choice** wins: You get **3 candies**.
  *   If your **2nd choice** wins: You get **2 candies**.
  *   If your **3rd choice** wins: You get **0 candies**.
  *(This creates tangible stakes for "intensity" without using money.)*

  ---

  ### Part 2: The Protocol (75 Minutes)

  #### 0:00 – 0:10 | Introduction & Calibration
  *   **Script:** "We're deciding on our end-of-term outing. There are three options: Museum, Garden, Cafe. You all have a card in front of you. That is your **private** preference. Do not show it to anyone. Your goal is to maximize your candy payout based on where the group lands."
  *   **Rule Check:** Explain that talking about votes is forbidden. "In a lab, we don't contaminate the samples. In here, don't contaminate the votes."
  *   **Hearing Check:** Speak clearly, face the group. Write the Options (A, B, C) large on the board.

  #### 0:10 – 0:25 | Round 1: The Control (Blind Ranked)
  *   **Method:** **Borda Count.** (Easiest ranked method to tally manually).
      *   Rank 1 = 3 points.
      *   Rank 2 = 2 points.
      *   Rank 3 = 1 point.
  *   **Action:** Hand out Ballots. Participants rank A, B, C honestly. Collect ballots.
  *   **Tally:** You tally on the whiteboard visibly.
      *   *Expected Result:* **B (Garden) Wins.**
      *   (Math: A gets 18 pts, B gets 23 pts, C gets 19 pts).
  *   **Record:** Write the winner on the board. Do not distribute candy yet.
  *   **Comment:** "Notice: No information, honest voting. The Compromise (B) won."

  #### 0:25 – 0:45 | Round 2: The Variable (Information Leak)
  *   **Method:** Same Borda Count rules.
  *   **The Manipulation:** Before handing out ballots, draw a "Straw Poll" on the board.
      *   *Write:* **Unofficial Straw Poll:** A: 4 votes | C: 3 votes | B: 3 votes.
      *   *Say:* "Someone left this on the door. It suggests A is surging and B is trailing." (This is false; it mirrors the Group 1 strength but hides the B/C overlap).
  *   **The Incentive:** Group 3 (C > B > A) now sees their favorite (C) is "losing" and their least favorite (A) is "winning." They prefer B over A. They are now incentivized to vote **B > C > A** (insincerely) to stop A.
  *   **Action:** Participants vote. Collect and tally.
  *   **Expected Result:** **B Wins (by a larger margin).**
  *   **The Lesson:** Strategy *worked* for Group 3 (they prevented A). But ask them: "Did anyone vote differently than their card?"
  *   **Payoff:** Distribute candies for Round 1 and Round 2 outcomes now.

  #### 0:45 – 1:05 | Round 3: Your Hypothesis (The Thermometer)
  *   **Script:** "You mentioned magnitude matters. So for this round, we aren't ranking. We are measuring intensity. On your ballot, assign a score from **0 to 10** for each option. You can give everyone a 10, or one person a 10 and others 0. Highest total score wins."
  *   **The Trap:** This is **Range Voting**. It allows intensity, but it invites **Exaggeration**.
  *   **Action:** Participants vote.
  *   **Expected Behavior:** Rational actors realize that giving a rival a '5' is dangerous. To maximize their 1st choice winning, they should give their 1st choice a **10** and everyone else a **0**.
  *   **Result:** The data collapses. It looks exactly like Plurality voting.
      *   Group 1 votes: A=10, B=0, C=0.
      *   Group 2 votes: B=10, C=0, A=0.
      *   Group 3 votes: C=10, B=0, A=0.
      *   *Total:* A=40, B=30, C=30. **A Wins.**
  *   **Payoff:** Distribute final candies. Note that Group 2 and 3 get **0 candies** because they exaggerated to stop A, but by collapsing the nuance (refusing to give B a high score), they allowed A to win.
  *   **Visual:** Show the Round 1 tally (B won with nuance) vs. Round 3 tally (A won with polarization).

  #### 1:05 – 1:15 | The Debrief (Data Analysis)
  *   **Step 1: The Control.** "In Round 1, no info, honest votes. The compromise won. Everyone got at least 2 candies."
  *   **Step 2: The Information.** "In Round 2, I gave you noisy data. Some of you likely changed your vote to block a threat. That is 'strategic voting.' It isn't dishonesty; it's risk management."
  *   **Step 3: The Thermometer.** "In Round 3, we kept intensity. But look what happened. To protect your interests, you likely turned the dial to extremes (10 or 0). You threw away the nuance yourselves. The system didn't remove intensity; the *strategy* removed it."
  *   **Step 4: The Theorem.** "There is a mathematical result (Gibbard-Satterthwaite) that says what we saw in Round 2 is inevitable in ranked systems. But Round 3 shows that even if we fix the 'ranking' problem, we just move the game to the 'scoring'."

  ---

  ### Part 3: Failure Modes & Controls
  As a chemist, you know experiments fail. Here is how to manage the noise.

  | Failure Mode | Prediction | Mitigation |
  | :--- | :--- | :--- |
  | **The Contrarian** | Someone votes randomly or votes for their last choice just to "break the game." | **Debrief Fix:** In the analysis, treat them as "outlier data." Ask: "If we remove one outlier, does the trend hold?" This validates their individuality without wrecking the lesson. |
  | **The Confused** | Someone doesn't understand the scoring (Borda vs. Thermometer). | **Material Fix:** Print the scoring rules *on* the ballot. "1st=3pts, 2nd=2pts..." Walk around during voting to check cards. |
  | **The Cynic** | The City Councilman says, "See? Democracy is broken." | **Script Fix:** "Not broken. *Engineered.* A bridge collapses if you load it wrong. We're testing the load limits of the design, not the morality of the drivers." |
  | **Collusion** | Two people talk and agree to swap votes. | **Rule Fix:** "No talking during voting." If it happens, acknowledge it: "That's called a 'coalition.' It's a valid strategy, but it changes the condition from 'individual' to 'bloc' voting." |
  | **Honesty Persists** | In Round 2, nobody lies despite the Straw Poll. | **Pivot:** "Interesting. The incentive wasn't high enough. In real politics, the stakes are jobs or war, not candy. The *pressure* to lie scales with the stakes." |

  ---

  ### Part 4: Limitations (What the Activity Can't Show)
  You asked to be leveled with about the gaps between this activity and the Theorem. Put this explicitly on the whiteboard during the debrief.

  **1. Generality vs. Specificity**
  *   **Activity Shows:** *This* rule (Borda/Range) can be gamed by *this* group under *these* conditions.
  *   **Theorem Claims:** *Any* rule (with 3+ options) can be gamed.
  *   **What you must assert:** "We proved one rule failed. The math proves *all* rules fail. We can't test 'all rules' in 75 minutes, but we've seen the mechanism."

  **2. Single-Dimension vs. Unrestricted Preferences**
  *   **Activity Shows:** Preferences on a single choice (Outing).
  *   **Theorem Claims:** Preferences can be *anything* (e.g., I like A best, then C, then B, for no logical reason).
  *   **What you must assert:** "Our preferences today were structured (A>B>C). Real life is messier. The theorem holds even when preferences are completely chaotic, which makes the impossibility stronger."

  **3. Individual vs. Bloc Strategy**
  *   **Activity Shows:** Individuals reacting to a poll.
  *   **Theorem Claims:** Applies to individuals.
  *   **Nuance:** In real life, parties/blocs game the system.
  *   **What you must assert:** "If one person gaming it breaks the fairness, imagine what a organized party can do. The individual vulnerability is the crack; the bloc is the sledgehammer."

  **4. Your Hypothesis (Intensity)**
  *   **Activity Shows:** Thermometer voting collapsed into Plurality (10s and 0s).
  *   **Conclusion:** "You hypothesized the problem was throwing away magnitude. The data suggests the problem is *incentive*. As long as there is a winner and a loser, people will exaggerate magnitude to win. Keeping the dial didn't save the nuance; the strategy ate it."

  ### Facilitator's Cheat Sheet (The Math)
  *Keep this hidden on your clipboard.*

  **True Preferences:**
  *   4x: A > B > C
  *   3x: B > C > A
  *   3x: C > B > A

  **Round 1 (Honest Borda):**
  *   A: (4x3) + (3x1) + (3x1) = **18**
  *   B: (4x2) + (3x3) + (3x2) = **23 (WINNER)**
  *   C: (4x1) + (3x2) + (3x3) = **19**

  **Round 2 (Strategic Borda - C voters switch to B):**
  *   C voters vote B > C > A.
  *   A: **18**
  *   B: (4x2) + (3x3) + (3x3) = **26 (WINNER)**
  *   C: (4x1) + (3x2) + (3x2) = **16**
  *   *Lesson:* Strategy saved them from A, but reduced C's score.

  **Round 3 (Thermometer - Max Exaggeration):**
  *   A voters: A=10, B=0, C=0 -> Total A=40
  *   B voters: B=10, A=0, C=0 -> Total B=30
  *   C voters: C=10, B=0, A=0 -> Total C=30
  *   **Winner: A** (The least favorite of 6 out of 10 people).
  *   *Lesson:* Exaggeration allowed the polarizing candidate to win, punishing the compromisers.

  ### Final Word to the Chemist
  You're looking for the signal in the noise. The "noise" here is human free will. If someone votes honestly in Round 2 when they should have strategized, that's not a failed experiment; that's a data point on "social trust vs. rational self-interest."

  Let the candy do the talking. When they see the A-voters walk away with 3 kisses and the C-voters walk away with 0 because they tried to be clever, you won't need to explain the Gibbard-Satterthwaite theorem. They'll have felt it in their pockets.
