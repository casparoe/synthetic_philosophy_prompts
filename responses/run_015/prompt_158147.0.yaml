  First, take a breath. You are in the deep end of the pool. Dennett is notoriously difficult because he fights on two fronts: he argues against dualists (who want skyhooks) and against "greedy reductionists" (who try to eat the cake without baking it). It is completely normal to feel like the ground is shifting under you.

