answer: |-
  **Case 1: The Intake Discrepancy**
  Dr. Aris Thorne, a senior lab director, knows ($p$) that Patient 402 is Rh-negative based on his direct perception of a completed agglutination slide showing no clumping, a standard and reliable test he has just performed. A potential defeater ($e$) appears in the form of an electronic intake note from a nurse stating the patient self-reported as Rh-positive. Thorne reasons: $p$ is true; I know $p$; therefore the intake note is misleading; therefore I need not investigate the intake note. He archives the note and signs off on the result. This response is epistemically permissible, indeed efficient. The intake note is an external testimonial claim that conflicts with the empirical ground, but the reliability of the slide does not causally or logically depend on the accuracy of the intake note. Since the slide is veridical and the note is merely a conflicting report from a less reliable source, Thorne's inference secures his right to dismiss $e$ without further inquiry.

  **Case 2: The Reagent Alert**
  Dr. Aris Thorne, a senior lab director, knows ($p$) that Patient 402 is Rh-negative based on his direct perception of a completed agglutination slide showing no clumping, a standard and reliable test he has just performed. A potential defeater ($e$) appears in the form of an automated quality-control log flagging the specific reagent batch used as "potentially compromised for false-negatives." Thorne reasons: $p$ is true; I know $p$; therefore the QC log is misleading; therefore I need not investigate the reagent batch. He archives the log and signs off on the result. This response is epistemically vicious. Although the reagent is in fact fine and the slide is veridical (so Thorne knows $p$), the reliability of the slide *depends* on the integrity of the reagent. By using the result ($p$) to dismiss the challenge to the condition ($e$) required for that result to be trustworthy, Thorne engages in a form of epistemic circularity that violates norms of inquiry, even if he lands on the truth.

  ***

  **Argument Analysis and Divergence**
  Running the dogmatist inference on both cases yields the same conclusion ("ignore $e$") from the same premise ("I know $p$"). The divergence occurs not in the truth of the premises or the validity of the deduction, but in the **licensing power** of the conclusion. In Case 1, the conclusion licenses the termination of inquiry. In Case 2, it does not. The single feature doing the work is **Ground-Dependence**: in Case 1, $e$ is independent of the causal/functional conditions that made the grounds for $p$ reliable; in Case 2, $e$ targets a necessary condition for the grounds themselves to be reliable. This is not a difference in evidence strength (a QC flag is not inherently "stronger" than a nurse's note) but of structural relevance. If we ablate this feature—by stipulating in Case 2 that the reagent batch is irrelevant to the slide's chemistry, or in Case 1 that the nurse's note determines the slide's validity—the pair collapses into a single uninteresting case where the epistemic status of ignoring $e$ is identical in both.

  **Evaluation of Replies**
  Against this pair, the **Closure Denial** reply fares worst: it must deny the inference in Case 1, thereby forbidding a permissible and efficient dismissal of irrelevant noise. The **Outright Dogmatism** reply (accept the scandal) fares poorly as well: it cannot explain why Thorne is negligent in Case 2 despite reasoning identically to Case 1. The **No-New-Knowledge/Total Evidence** reply fares best. It allows that Thorne knows $p$ in both cases (satisfying factivity) but insists that in Case 2, $e$ is part of the total evidence required to *sustain* the justification for $p$. Thus, while the inference is valid, it cannot be used to *excise* $e$ from the total evidence in Case 2 without undermining the very justification that supports $p$. It captures the intuition that you cannot use a result to validate the instrument that produced it when the instrument's validity is specifically in question.

  **Dogmatist Objection and Assessment**
  The strongest objection an outright dogmatist can make to the Bad Case is: "If Thorne really knows $p$, then the reagent *is* fine. Investigation is a waste of resources to confirm what is already known. Epistemic negligence requires believing falsely or irresponsibly; Thorne does neither." This objection lands partially by highlighting the practical cost of checking known falsehoods, but it ultimately fails because it conflates *metaphysical* security with *epistemic* responsibility. Knowledge is not merely a state of true belief; it is a status maintained through proper responsiveness to challenges regarding one's grounds. In Case 2, ignoring $e$ is a failure of responsiveness to the *source* of the knowledge, rendering the retention of $p$ accidentally correct rather than securely known, even if the factivity condition is technically met. The dogmatist cannot account for the norm that requires checking the instrument when the instrument itself is accused.
