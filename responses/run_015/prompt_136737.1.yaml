prompt: |-
  A guy I work with — call him Dan — does a kind of in-house should-we-enlarge-the-decision-body consulting for our clients, and I've been trying to reconstruct the rule he's actually running. His calls so far:

  - 100 raters, each right 51% of the time, independent, two options, plain majority: yes, enlarging helps a lot.
  - Same but each rater is at 49%: no — he said adding more just makes the majority more confidently wrong.
  - 500 people who all watched the same misleading explainer before deciding, each about 60% accurate otherwise: no. His line was that the shared bad input is a common cause and the crowd can't correct for it.
  - 12 independent raters at 65%: yes.
  - Sequential voice votes where each person hears the earlier ones and updates honestly rather than strategically: no. He called it a cascade and said the later votes add almost nothing.
  - 200 independent raters, half at 70% and half at 47%: yes, though he grumbled about it and said equal weighting was leaving something on the table.
  - Tacking one extra 50%-accurate rater onto an existing panel: no, basically a no-op that can hurt through ties.

  Now the case on his desk. A client runs a 7-person case-review panel and wants to go to 31. All 31 would come out of the same training pipeline and use the same scoring protocol. On held-out data each reader is about 67% accurate, and the correlation between whether two randomly picked readers get the same case right is about 0.25. That's all anyone knows: nobody has checked whether the shared component of their errors points in some particular direction or is mostly just case difficulty (easy cases everyone nails, hard cases everyone struggles with), and the client has never ran the panel at more than 7.

  Does Dan say enlarging helps? I care less about the yes or no than about the different rules that fit his track record about equally well and what each of them predicts here, which one you think he's really running and why, and what measurement or follow-up case would separate them. Also tell me where your own answer is most likely to break and what would change your mind.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Request:**
      *   **Goal:** Determine if "Dan" would recommend enlarging a decision body from 7 to 31 members based on specific case details.
      *   **Input Data:** A list of 7 past scenarios with Dan's verdicts (Yes/No) and reasoning.
      *   **Current Case:** 7 -> 31 members. Same training/protocol. Individual accuracy = 67%. Pairwise error correlation = 0.25. Unknown error structure (bias vs. difficulty).
      *   **Required Output:**
          1.  Dan's likely verdict (Yes/No).
          2.  Alternative rules/models that fit his track record.
          3.  Predictions of those models for the current case.
          4.  Hypothesis on which rule Dan is *actually* using and why.
          5.  A test/follow-up to distinguish the rules.
          6.  Self-critique: Where my analysis might break and what would change my mind.

  2.  **Analyze Dan's Track Record (The "Training Data"):**
      *   *Case 1:* 100 raters, 51% acc, independent, majority. -> **YES**. (Condorcet's Jury Theorem (CJT) standard case: $p > 0.5$, independent, $N \to \infty \implies P_{correct} \to 1$).
      *   *Case 2:* 100 raters, 49% acc, independent, majority. -> **NO**. (CJT inverse: $p < 0.5$, $N \to \infty \implies P_{correct} \to 0$).
      *   *Case 3:* 500 raters, 60% acc, *shared misleading input*. -> **NO**. (Correlated error/Common cause. Independence assumption violated).
      *   *Case 4:* 12 raters, 65% acc, independent. -> **YES**. (Small $N$, but high $p$, independent. CJT holds).
      *   *Case 5:* Sequential votes, hearing others. -> **NO**. (Information Cascades. Effective $N$ is small because later voters ignore private signals).
      *   *Case 6:* 200 raters, mixed quality (70% & 47%), equal weight. -> **YES** (but grumbled). (Average $p > 0.5$? $(0.7+0.47)/2 = 0.585$. CJT holds, but optimal weighting would be better).
      *   *Case 7:* Add one 50% rater. -> **NO**. (Noise addition. 50% adds variance without signal, risks ties).

      *   *Core Principle:* Dan seems to be a strict Bayesian/Statistical decision theorist focused on **Effective Sample Size** and **Independence**. He believes in Condorcet's Jury Theorem *only* when assumptions hold ($p > 0.5$, independence). He is skeptical of correlation (Case 3) and information leakage (Case 5).

  3.  **Analyze the Current Case:**
      *   $N_{old} = 7$, $N_{new} = 31$.
      *   Individual Accuracy ($p$) = 0.67. ($> 0.5$, good).
      *   Correlation ($\rho$) between errors = 0.25. (This is the kicker).
      *   Source of correlation: Unknown (Bias vs. Case Difficulty).
      *   Training: Same pipeline, same protocol.

  4.  **Evaluate Models/Rules:**

      *   **Model A: Strict Condorcet (Independence Required).**
          *   *Rule:* If errors are correlated, CJT fails. If $\rho > 0$, adding $N$ has diminishing returns. If $\rho$ is high enough, adding $N$ does nothing.
          *   *Dan's history:* Case 3 (shared input) was a hard No. Case 1 & 4 (independent) were Yes.
          *   *Application:* $\rho = 0.25$ is significant. It suggests shared variance.
          *   *Prediction:* **NO** (or "Not worth it"). Dan hates correlated errors (Case 3). Same training pipeline screams "shared bias."

      *   **Model B: Effective Sample Size (ESS) Threshold.**
          *   *Rule:* Calculate $N_{eff} = N / (1 + (N-1)\rho)$. If $N_{eff}$ increases significantly, Yes. If it plateaus, No.
          *   *Calculation:*
              *   $N=7, \rho=0.25 \implies N_{eff} = 7 / (1 + 6*0.25) = 7 / 2.5 = 2.8$.
              *   $N=31, \rho=0.25 \implies N_{eff} = 31 / (1 + 30*0.25) = 31 / 8.5 \approx 3.65$.
          *   *Gain:* Going from 2.8 effective voters to 3.65 effective voters.
          *   *Dan's history:* He grumbled about Case 6 (equal weighting), implying he cares about efficiency. He rejected Case 3 (500 people, shared input) because the effective $N$ was likely tiny.
          *   *Prediction:* **NO**. The gain in effective information is marginal (less than 1 extra independent voter). Cost of 24 extra people isn't worth ~0.8 independent votes.

      *   **Model C: Bias vs. Variance (The "Direction" Check).**
          *   *Rule:* Correlation due to case difficulty (variance) is okay. Correlation due to systematic bias (direction) is fatal.
          *   *Dan's history:* Case 3 was "misleading explainer" (Systematic Bias) -> No. Current case says "nobody has checked whether the shared component... points in some particular direction."
          *   *Prediction:* **NO** (Precautionary Principle). Until you prove it's just difficulty, assume it's bias (like Case 3). Same training pipeline suggests systematic bias.

      *   **Model D: The "p > 0.5" Hard Cutoff.**
          *   *Rule:* As long as avg $p > 0.5$ and no obvious cascade, add people.
          *   *Dan's history:* Fits Case 1, 4, 6. Contradicts Case 3 (where $p=0.6$ but No).
          *   *Prediction:* **YES**. (But this ignores Case 3 and the correlation data).
          *   *Verdict:* This model is ruled out by Case 3. Dan cares about independence.

  5.  **Synthesize Dan's Likely Verdict:**
      *   Dan is clearly sensitive to *correlated errors*. Case 3 is the strongest signal here. 500 people at 60% accuracy (usually a slam-dunk Yes under CJT) was a **No** because of shared input.
      *   In the current case, we have explicit evidence of correlation ($\rho = 0.25$) and a mechanism for it (same training/protocol).
      *   The Effective Sample Size calculation shows diminishing returns are already hitting hard at $N=7$. Moving to 31 buys very little *effective* intelligence.
      *   *Verdict:* **NO.**

  6.  **Develop the "Rules that Fit":**
      *   *Rule 1: The Correlated Error Ceiling.* (Focus on $\rho$). If $\rho$ is non-negligible, $N$ doesn't matter much after a small threshold.
      *   *Rule 2: The Bias Precaution.* (Focus on Source). If errors share a cause (training), assume bias until proven otherwise.
      *   *Rule 3: The Effective N Heuristic.* (Focus on Math). $N_{eff}$ must double to justify expansion.

  7.  **Select the "Real" Rule:**
      *   Dan's comment on Case 3 ("shared bad input is a common cause") and Case 6 ("equal weighting was leaving something on the table") suggests he understands the *structure* of the error, not just the magnitude.
      *   He likely uses **Rule 2 (Bias Precaution)** combined with **Rule 1 (Correlated Error Ceiling)**. He treats "Same Training" similarly to "Same Misleading Explainer."
      *   Why? Because Case 3 is the most specific constraint. It overrides the $p > 0.5$ rule.

  8.  **Design a Test:**
      *   Need to distinguish "Case Difficulty" (okay) from "Systematic Bias" (not okay).
      *   *Test:* Swap training pipelines or introduce orthogonal information.
      *   *Better Test:* Check error overlap on specific cases. If they miss the *same* cases, it's difficulty (maybe okay). If they miss different cases but for the same *reason* (bias), it's bad. Actually, the correlation metric given (0.25) is already pairwise agreement on correctness.
      *   *Best Test:* **Adversarial Perturbation.** Change the protocol for half the group. If correlation drops, it was training bias. If it stays, it's case difficulty.
      *   *Alternative:* **Weighted Voting.** Dan liked the idea of weighting in Case 6. If we weight by past performance, does accuracy improve?

  9.  **Self-Critique (Where I might break):**
      *   *Assumption:* Dan is rational/consistent. He might just be risk-averse.
      *   *Assumption:* $\rho=0.25$ is "high." In psychometrics, 0.25 inter-rater reliability might be considered low/moderate, but in voting theory, it kills the $\sqrt{N}$ gain.
      *   *Blind Spot:* Maybe Dan says **YES** because 67% is high enough to overcome the correlation? (Let's check the math).
      *   *Math Check:*
          *   Bahadur representation or similar for correlated binomials.
          *   Roughly, variance of mean vote $\approx \frac{p(1-p)}{N} [1 + (N-1)\rho]$.
          *   With $\rho=0.25$, variance doesn't shrink much as $N$ grows.
          *   At $N=7$, variance factor is $1 + 1.5 = 2.5$.
          *   At $N=31$, variance factor is $1 + 7.5 = 8.5$.
          *   Standard error scales with $\sqrt{\text{Variance}/N}$.
          *   $SE_7 \propto \sqrt{2.5/7} \approx \sqrt{0.357} \approx 0.6$.
          *   $SE_{31} \propto \sqrt{8.5/31} \approx \sqrt{0.274} \approx 0.52$.
          *   Reduction in error is real but small. Is it worth 4x the headcount? Dan's Case 3 (500 people -> No) suggests he hates low ROI on headcount when correlation exists.
      *   *Refinement:* My math confirms the "diminishing returns" argument.

  10. **Drafting the Response:**
      *   *Intro:* State the verdict clearly (No).
      *   *Section 1: The Rules.* Define the competing mental models (Pure CJT, Correlated CJT, Bias Precaution).
      *   *Section 2: The Prediction.* Apply models to the 7->31 case.
      *   *Section 3: Dan's Actual Algorithm.* Argue for the "Common Cause/Bias" heuristic.
      *   *Section 4: The Test.* Propose the "Split Training" or "Residual Analysis" experiment.
      *   *Section 5: Uncertainty.* Admit where the correlation metric might be misleading or where Dan might be overfitting to Case 3.

  11. **Refining the "Dan" Persona:**
      *   Dan is pragmatic but theoretically grounded. He grumbles about inefficiency (Case 6). He fears cascades (Case 5). He fears common causes (Case 3).
      *   He isn't a pure mathematician (he accepted Case 6 despite suboptimal weighting), but he isn't a naive populist (he rejected Case 3).
      *   He likely views "Same Training" as functionally equivalent to "Same Misleading Explainer."

  12. **Final Polish:** Check the correlation math again.
      *   If $\rho$ is the correlation of *correctness* (1=right, 0=wrong).
      *   Var(Sum) = $N \cdot Var(X) + N(N-1) \cdot Cov(X,Y)$.
      *   $Var(X) = p(1-p)$. $Cov = \rho \cdot p(1-p)$.
      *   $Var(Sum) = N p(1-p) [1 + (N-1)\rho]$.
      *   We want $P(\text{Sum} > N/2)$.
      *   If $\rho > 0$, as $N \to \infty$, $Var(Sum) \approx N^2 \rho p(1-p)$. SD scales with $N$. Mean scales with $N$. The ratio (Z-score) approaches a constant, not infinity.
      *   This means accuracy plateaus. It does *not* go to 100%.
      *   With $p=0.67$ and $\rho=0.25$, the plateau might be high enough to justify expansion?
      *   However, Dan's Case 3 (60% acc, 500 people) was a **No**. This implies he cares about the *plateau effect*. If accuracy plateaus at 80% instead of 99%, he might say "don't bother adding 400 people."
      *   Here, adding 24 people to move from plateau-start to plateau-middle is likely a "No" for Dan.

  13. **Structure:**
      *   **Verdict:** No.
      *   **Three Models:** Naive CJT, Correlated CJT (ESS), Structural Bias.
      *   **Dan's True Rule:** Structural Bias/Common Cause.
      *   **Test:** Orthogonal Training.
      *   **Uncertainty:** The nature of $\rho$.

      *(Self-Correction during drafting)*: Wait, Case 6 (Mixed 70%/47%) was a **Yes**. Average $p = 58.5\%$. This is lower than the current case (67%). Why Yes there? Because they were *independent* (implied, or at least no shared cause mentioned). The current case has explicit correlation. This reinforces the "Independence/Correlation" switch as the key variable for Dan.

      *(Final check on Case 7)*: Adding a 50% rater. Dan said No. This shows he penalizes noise. Correlated noise is worse than independent noise.

      Okay, ready to write. The distinction between "Case Difficulty" (hard cases everyone misses) and "Systematic Bias" (everyone misses for the same wrong reason) is crucial. Dan's Case 3 comment ("shared bad input is a common cause") suggests he treats shared training as a common cause.

      Let's refine the "Test". To separate Difficulty vs Bias: Look at the *pattern* of errors. If errors are clustered on specific cases (high case variance), it's difficulty. If errors are random across cases but correlated across raters (high rater variance), it's bias. Actually, the correlation given is "whether two randomly picked readers get the same case right". This is inter-rater reliability on correctness.
      Better test: **Holdout by Training Cohort.** Train two groups differently. If correlation persists, it's case difficulty (Dan might say Yes). If correlation vanishes, it was training bias (Dan says No).

      Wait, if it's case difficulty (everyone misses hard cases), does enlarging help?
      If a case is "hard", everyone gets it wrong. Majority vote gets it wrong.
      If a case is "easy", everyone gets it right. Majority vote gets it right.
      Adding more people doesn't change the outcome on the hard cases.
      So even if it's just "case difficulty," enlarging the panel *does not help* if the correlation is driven by case difficulty.
      So Dan says **No** regardless of whether it's bias or difficulty, provided the correlation remains.
      *Correction:* If it's case difficulty, the *panel* accuracy is capped by the case difficulty distribution. Adding raters doesn't solve the hard cases.
      So the distinction matters less for the *Verdict*, but matters for the *Remedy*.
      Dan's Verdict: No.
      Dan's Reasoning: Correlation kills the benefit of $N$.

      Okay, I will structure the answer around the "Effective Sample Size" vs "Common Cause" distinction.

