answer: |-
  Dear friend,

  It was fascinating to read through your notes on this dilemma, and I think you have put your finger on exactly the pressure point that makes the debate between Humeans and anti-Humeans so enduringly difficult. Your intuition that the second horn is the weak spot is well-founded, but I suspect the issue runs even deeper than just the mechanics of motivation. What you have sketch out is essentially a refined version of Bernard Williams' critique of external reasons, and like Williams' argument, its force depends entirely on whether one accepts the underlying psychology presupposed by the dilemma.

  Let us look first at your first horn, where you suggest that if normative force comes from a feature of the agent, such as rationality or sympathy, the reason is covertly anchored. The anti-Humean realist would resist the conclusion that this makes the reason agent-relative. They would draw a distinction between the source of the reason and the condition of access to it. Consider an analogy with perception. The fact that a tree exists independently of me does not change because I need eyes to see it. Similarly, a realist might argue that the value of preventing suffering exists independently of any agent, but I require the capacity for rational recognition to apprehend it. The fact that I must possess the capacity to be moved by the reason does not mean the reason derives its force from that capacity. The capacity is merely the receiver, not the transmitter. However, your counter-press here is strong: if the reason only binds me because I am the kind of creature who cares about rationality, is it not merely a hypothetical imperative? The realist must insist that the demand of rationality is categorical, not contingent on a desire to be rational, which leads us directly into the trouble you identified with the second horn.

  This brings us to the core of your worry, which is the second horn concerning practical traction. You suggest that a reason entirely free of an agent's concerns cannot guide them. This premise relies on a Humean theory of motivation, which holds that belief alone cannot produce action without the aid of an independent desire. If one accepts this psychology, your dilemma is devastating because any reason that does not hook into a pre-existing desire will indeed be inert. However, the anti-Humean denies this psychology. They argue for a form of judgment internalism where recognizing a normative fact is itself a motivational state. On this view, there is no gap between seeing that one ought to phi and being moved to phi, unless one is practically irrational. The mystery you feel about how a free-floating reason gets traction is precisely what the anti-Humean claims is not mysterious at all, but rather a fundamental feature of rational agency. To ask what gives the reason traction is to ask for a desire to bridge the gap, but the anti-Humean insists there is no gap to bridge.

  Your suspicion about constitutive accounts of agency is also astute. You worry that claiming recognition of a normative fact just is being moved might beg the question or smuggle in agent-relativity. The constitutive strategist, like Christine Korsgaard, attempts to avoid this by arguing that normativity arises from the structure of agency itself. Since you cannot opt out of being an agent while acting, the norms constitutive of agency bind you necessarily. The worry about smuggling in agent-relativity arises if one thinks this makes the reason dependent on the contingent fact that I am an agent. The constitutivist replies that agency is not a contingent project like collecting stamps, but a condition of having any projects at all. Whether this succeeds often turns on whether one views the norms of agency as substantive enough to generate specific moral reasons or merely formal constraints on consistency. If the latter, your friend the Humean might concede the point but argue that consistency alone cannot generate new reasons without some input from the motivational set.

  Ultimately, I think the framing of your dilemma presupposes something objectionable to the non-Humean, which is a form of reasons internalism. You are effectively arguing that for a reason to be a reason for me, it must be grounded in something about me. The non-Humean rejects this constraint entirely. They argue that reasons are facts about what is valuable, and these facts apply to us regardless of our subjective makeup. Your dilemma works powerfully against a realist who tries to have it both ways, perhaps by wanting reasons to be objective yet also trying to explain their force through subjective psychology. But against a robust realist who is willing to accept that reasons are simply part of the fabric of the world that rational agents discern, the dilemma may appear to beg the question. It assumes that practical grip requires an anchor in the agent's psychology, whereas the realist claims the grip comes from the authority of the reason itself.

  So, does the argument have genuine force? I believe it has significant force against any view that tries to ground objective reasons in subjective capacities without explaining why those capacities are authoritative. It exposes the difficulty of transitioning from is to ought, even when the is is a fact about our own rational nature. However, it is unlikely to convince a committed anti-Humean because they will reject the assumption at the heart of the second horn that a reason needs an external anchor to motivate. They will say you are looking for a desire where none is needed. To strengthen your essay, you might consider focusing less on whether the reason can motivate, and more on whether the agent has any reason to care about being rational in the first place. If the demand to be rational is just another contingent feature of our psychology, the Humean wins. If it is a necessary truth, the realist wins, but the mystery of its normative grip remains the central battleground.

  I hope this helps you refine the argument. It is a strong piece of philosophy that touches on the deepest issues in metaethics, and wrestling with these horns is the best way to clarify where one actually stands on the nature of normativity.

  Best regards,

  Your colleague
