answer: |-
  **Joint Statement on Consequentialist Demandingness**

  Following an adversarial collaboration, the defenders of the Threshold Prerogative (TP) and proponents of Scalar Integration (SI) submit this statement regarding the structure of moral obligations within act-consequentialism. TP holds that morality must recognize a protected sphere of agent-relative interests, so that demands to maximize the good become illegitimate once a baseline of personal projects is secured. SI holds that consequentialist obligations are continuously weighted rather than binary, so that no single threshold activates an overriding duty and the experience of excessive demand is an artifact of treating scalar costs as all-or-nothing requirements.

  **1. Agreed Claims**
  1.  **Moral Demandingness:** Both camps acknowledge that the intuitive excessiveness of traditional act-consequentialism constitutes a significant theoretical challenge requiring structural accommodation.
  2.  **Optimizing vs. Satisficing:** Both agree that distinguishing between optimizing (maximizing the good) and satisficing (achieving a good enough outcome) is necessary to address agent-centered concerns, though they disagree on the mechanism.
  3.  **Agent-Relative Reasons:** Both maintain that agent-relative reasons can be incorporated into a consequentialist framework without abandoning the theory's core commitment to outcome evaluation, provided the weighting structure is adjusted.

  **2. Disagreements Table**

  | Feature | Threshold Prerogative (TP) | Scalar Integration (SI) |
  | :--- | :--- | :--- |
  | **Obligation Structure** | Binary: Duty applies strictly until a personal baseline is secured, after which it ceases. | Continuous: Moral reason weight varies smoothly with outcome value; no duty cessation point. |
  | **Demandingness Source** | Arises from failing to recognize the legitimacy of the protected sphere of personal projects. | Arises from misinterpreting scalar reasons as binary requirements. |
  | **Collective-Action Problems** | Individual duty is suspended unless coordination ensures the collective threshold is met without violating personal baselines. | Individual act retains scalar value regardless of coordination; failure to cooperate reduces total value but does not nullify individual reason. |

  **3. Identified Cruxes and Evaluative Cases**

  **Crux 1: The Existence of a Non-Arbitrary Baseline**
  *Issue:* Whether a principled limit to protected self-interest can be defined without arbitrariness.
  *Case:* **Career Selection.** An agent chooses a lower-impact career that secures a comfortable life over a higher-impact career requiring significant sacrifice.
  *Predicted Evaluation:* TP argues this is permissible once the baseline of personal projects is secured. SI argues there remains a continuous scalar reason to choose the higher-impact career, though failing to do so is not necessarily blameworthy.

  **Crux 2: Pressure Redistribution vs. Reduction**
  *Issue:* Whether continuous weighting genuinely reduces experienced moral pressure or merely redistributes it across choices.
  *Case:* **Cumulative Consumption.** Daily choices regarding discretionary spending that individually seem negligible but aggregate to significant harm or benefit.
  *Predicted Evaluation:* TP argues these choices fall below the threshold of moral significance and generate no duty. SI argues each choice carries scalar weight, and the accumulation of minor reasons creates significant moral pressure equivalent to binary duties.

  **Crux 3: Uncoordinated Agency and Scalar Defense**
  *Issue:* Whether uncoordinated agency undermines the scalar defense by rendering individual contributions negligible.
  *Case:* **Climate Mitigation.** Individual actions to reduce carbon footprint where collective coordination is absent.
  *Predicted Evaluation:* TP argues individual acts are morally optional unless part of a scheme securing the collective good without violating baselines. SI argues individual acts possess scalar value independent of collective coordination, maintaining a reason to act even if others do not.

  **4. Conclusion**
  While both camps seek to mitigate the demandingness objection, TP relies on a structural exemption for agent-relative interests, whereas SI relies on a reinterpretation of moral weight. Future research must address whether scalar reasons can motivate action without binary thresholds and whether protected baselines can be defined non-arbitrarily.
