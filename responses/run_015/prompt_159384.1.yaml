answer: |-
  1. The Exam Question

  **Metaphysics of Persistence: Final Examination**

  **Time Allowed:** 90 Minutes
  **Total Marks:** 30
  **Instructions:** Answer the following question. You may not consult notes or texts.

  **Question 1**

  Consider the following case, stipulated to be metaphysically possible:

  Ada runs a marathon. Her run consists of a series of instantaneous stages. In an ordinary run, the order of these stages in time matches the order of their intrinsic properties (e.g., fatigue levels), memory contents, and causal relations. In this case, however, the **temporal ordering** diverges from the **gradient ordering**.
  *   **Temporal Ordering:** The stage at which Ada crosses the finish line occupies the earliest time ($t_1$). The stage at which she leaves the start line occupies the latest time ($t_{10}$). Intermediate stages are scattered between $t_1$ and $t_{10}$ with no pattern matching the run's progress.
  *   **Gradient Ordering:** The stages remain pairwise causally linked and intrinsically identical to an ordinary run. The stage causally downstream from the start (high energy, no memory of running) is intrinsically distinct from the stage causally upstream (exhausted, memory of the run), regardless of their temporal location.

  Let the **gradient ordering** be determined by fatigue, memory, causal influence, and similarity of intrinsic character.

  (a) Explain how an endurantist (who denies temporal parts) must describe Ada's change in this case. Does the time-indexing strategy allow her to make sense of the direction of change without privileging the gradient ordering? (10 marks)

  (b) Explain how a perdurantist (who affirms temporal parts) must describe the marathon worm. Can the perdurantist identify the direction of change solely via the mereological sum of the stages, or must they add the temporal ordering as a separate ingredient? If they add it, does the worm itself possess temporary properties (e.g., being scattered at $t_1$, unified at $t_{10}$), and if so, how is this explained without regress? (10 marks)

  (c) Conclude by assessing the 'Collapse Claim': In light of this case, do the endurantist and perdurantist accounts ultimately posit different structures to explain persistence and change, or do they rely on the same primitive resources? Defend your position. (10 marks)

  ***

  2. Model Answer

  The case of Ada's Reverse Marathon functions as a stress test for the distinction between endurance and perdurance. It suggests that when pressed to explain the *direction* of change and the *unity* of a persisting object, both views rely on a primitive temporal ordering that mereology or instantiation alone cannot supply. Consequently, the two views collapse into one another regarding their explanatory resources, even if their ontologies differ.

  Consider the endurantist first. For the endurantist, Ada is wholly present at every time she exists. In the Reverse Marathon, Ada is exhausted at $t_1$ (the finish line stage) and fresh at $t_{10}$ (the start line stage). To avoid contradiction, the endurantist employs time-indexing: Ada is tired-at-$t_1$ and fresh-at-$t_{10}$. This handles the temporary intrinsics. However, the case forces a question about the *direction* of change. Intuitively, Ada changes from fresh to tired. But temporally, she is tired first. If change is defined as variation across times, the endurantist must say Ada changes from tired to fresh. If change is defined by the gradient ordering (causal/intrinsic), she changes from fresh to tired. To maintain the intuition that the run is a run (and not an un-running), the endurantist must privilege the gradient ordering as the true marker of personal identity and change, treating temporal location as merely the container in which this change is displayed. Thus, time-indexing saves her from contradiction, but it does not explain the *direction* of persistence without appealing to causal or intrinsic gradients external to time itself.

  The perdurantist faces a sharper version of this problem. The perdurantist identifies Ada with the worm composed of her stages. In standard cases, the temporal order of parts matches the causal order. Here, they diverge. The perdurantist cannot identify the direction of change solely via the mereological sum. Mereology is unordered; a sum of parts $\{A, B, C\}$ is identical to $\{C, B, A\}$. The worm exists as a static block. To say the worm represents a run from start to finish, rather than finish to start, the perdurantist must impose an ordering on the parts. If they appeal to temporal location to order the parts, they must conclude the run goes from tired to fresh. If they appeal to the gradient ordering, they admit that temporal location is not what constitutes the persistence.

  Furthermore, the worm itself seems to have temporary properties. At $t_1$, only the finish-line stage exists (or is present). At $t_{10}$, the start-line stage exists. The worm is thus "partially present" or "manifesting different sections" at different times. If the perdurantist claims the worm is wholly existent timelessly, they struggle to explain our experience of temporal passage. If they claim the worm has temporary properties (e.g., being active-at-$t_1$), they must apply the time-indexing strategy to the worm itself. This invites the regress worry: if the worm has temporary properties, does it have temporal parts of its own? The perdurantist must stop the regress by stipulating that the worm's relation to time is primitive. But this is precisely the resource the endurantist claimed to need: a primitive relation between an entity and a time.

  This leads to the Collapse Claim. The perdurantist argues they solve temporary intrinsics by relativizing properties to parts rather than times. The endurantist relativizes properties to times. Ada's Reverse Marathon shows that relativizing to parts is insufficient without an ordering of those parts. Since mereology provides no order, the perdurantist must import a temporal or causal ordering relation. Once this relation is imported, the perdurantist is doing the same work as the endurantist: positing an entity that bears an ordering relation to distinct indices (whether called 'times' or 'stage-locations'). The ontology differs (worms vs. wholes), but the *structure* required to make sense of change is identical. Both require a primitive 'earlier-than' relation that is not reducible to the intrinsic nature of the relata.

  Therefore, the views collapse in their explanatory power. The perdurantist gains no leverage on the problem of temporary intrinsics because they cannot analyze change as variation across parts without secretly presupposing the very temporal ordering the endurantist posits openly. The distinction is merely topological, not metaphysical.

  **Flagged Assumption:** The most contestable assumption in this argument is that **mereology is strictly unordered and contributes nothing to the identity of the worm.** One might argue that the causal connections between the stages *internal* to the sum provide the ordering without external time. If the causal links are sufficient to order the stages, the perdurantist need not appeal to external time, and the collapse is avoided. However, given the stipulation that causal links remain constant while temporal location scrambles, the causal order and temporal order come apart, forcing a choice of which constitutes 'persistence.' Choosing causation over time undermines the temporal-parts claim that time is the primary dimension of persistence.

  ***

  3. Marking Scheme

  **Total Marks: 30**

  **Part (a): The Endurantist Analysis (10 Marks)**
  *   **Move 1 (4 marks):** Correctly identifies that the endurantist must use time-indexing (relations to times) to avoid contradiction regarding Ada's properties (tired vs. fresh).
      *   *Common Error:* Claims the endurantist cannot handle the case at all or must deny the possibility.
  *   **Move 2 (3 marks):** Notes that time-indexing handles the contradiction but fails to determine the *direction* of change (tired-to-fresh vs. fresh-to-tired) without appealing to the gradient ordering.
      *   *Common Error:* Assumes time-indexing automatically dictates the direction of change.
  *   **Move 3 (3 marks):** Concludes that the endurantist must treat the gradient ordering (causal/intrinsic) as constitutive of Ada's identity, distinct from temporal location.
      *   *Common Error:* Conflates temporal order with causal order.

  **Part (b): The Perdurantist Analysis (10 Marks)**
  *   **Move 4 (4 marks):** Identifies that mereological summation alone is unordered and cannot distinguish the 'start' from the 'finish' of the worm without an external ordering principle.
      *   *Common Error:* Assumes the sum of parts inherently possesses a temporal direction.
  *   **Move 5 (3 marks):** Addresses the 'worm's temporary properties' pressure point: acknowledges the worm appears to have properties relative to times (e.g., being partially present) or requires a regress stopper.
      *   *Common Error:* Ignores the status of the whole worm and focuses only on the stages.
  *   **Move 6 (3 marks):** Argues that the perdurantist must import a primitive ordering relation (temporal or causal) just as the endurantist does.
      *   *Common Error:* Claims temporal parts eliminate the need for temporal relations entirely.

  **Part (c): The Collapse Claim (10 Marks)**
  *   **Move 7 (4 marks):** Takes a definite position on whether the views collapse (e.g., "They collapse structurally" or "They remain distinct").
      *   *Common Error:* Hedges indefinitely or surveys options without arguing.
  *   **Move 8 (3 marks):** Justifies the position by comparing the primitive resources required by both views (e.g., both need primitive ordering/indexing).
      *   *Common Error:* Bases the distinction solely on intuition or ontological count (number of entities).
  *   **Move 9 (2 marks):** **Critical Resistance:** Explicitly resists dismissing the case as physically impossible or relying on physics to solve the metaphysical stipulation.
      *   *Common Error:* Rejects the case because "time doesn't work that way in physics."
  *   **Move 10 (1 mark):** **Flagged Assumption:** Explicitly identifies the most contestable premise in their own argument (e.g., the nature of mereology or the sufficiency of causal ordering).
      *   *Common Error:* Fails to reflect on the limits of their own argument.

  **Grading Distinctions**
  *   **A (24-30):** Seamlessly integrates the three pressure points. The argument in (c) follows necessarily from the analysis in (a) and (b). The flagged assumption is insightful and shows meta-philosophical awareness. Resists the 'impossible' dismissal cleanly.
  *   **B (18-23):** Correctly analyzes (a) and (b) but the conclusion in (c) is less rigorous or slightly disconnected from the case details. May miss the regress point in (b) or the direction of change nuance in (a). Flagged assumption is present but generic.
  *   **C (15-17):** Accurately recites the standard definitions of endurance and perdurance but struggles to apply them to the *reversed* ordering in the case. May treat the case as a standard temporary intrinsics problem without noticing the divergence stipulation. May lose marks for dismissing the case.
