answer: |-
  Hey there,

  This is a fantastic puzzle, and honestly, it hits exactly on the friction point where the clean models we use in biology start grinding against the messy reality of human social ontology. I spend a lot of time worrying about exactly this kind of mismatch, so let me walk you through how I'm parsing this, starting with the brainstorming phase where I toss around the competing explanations before I settle on what I think is the most robust reading. I'll try to keep track of where the literature actually agrees and where I'm just making my best guess based on the principles we have.

  When I first look at the engagement ring through the lens of signalling theory, the private price problem you mentioned is the first thing that jumps out. In the classic handicap principle, the signal has to be observable to be effective. If I burn money in my backyard, nobody knows I'm wealthy or committed. So if the price is private, who is the audience? One option is that the audience is primarily the recipient, not the public. The public sees the rock, but the partner knows the financial context. They know your income, they know your spending habits, so the ring acts as a signal to them specifically that you are willing to incur a utility loss for their sake. The public display is secondary, maybe just a way to lock in the signal so you can't easily reverse it without social shame. But then there's the heuristic problem: people aren't great at pricing diamonds by eye. So maybe the signal isn't the exact price but the category membership. Wearing a diamond says I am participating in the convention, and the convention itself is the costly thing. But that feels weak. If the convention shifts to lab-grown, why doesn't the signal hold? That leads me to think the cost isn't just about participation; it's about the specific type of cost.

  This brings me to the lab-grown suspicion, which is the weirdest part of the whole practice. If this were pure signalling of financial commitment, a lab diamond that costs the same as a mined one should work fine. But they don't cost the same, and even if you bought a huge lab diamond for the price of a small mined one, it often feels like cheating. This suggests the signal isn't just about the resource sacrifice you make today, but about the object's history. In social ontology, we sometimes talk about this as the causal history of a status function. An original painting and a perfect forgery look the same, but they have different values because of their lineage. If the ring is a relic, a token that derives its power from being a piece of the earth formed over billions of years, then a lab-grown stone is indeed a false claim, like a photocopy of a signature. It mimics the form but lacks the genesis. This pushes me away from pure signalling theory toward a view where the object partly constitutes the relationship through its history, not just its cost. But I have to admit, I'm guessing here on how much of the layperson's intuition is actually about relic status versus just outdated marketing conditioning. There isn't a settled empirical study on whether people reject lab diamonds because of signalling logic or magical thinking, though my hunch is it's a mix of both.

  Then there's the grandmother's ring exception, which really breaks the strict costly signalling model if we define cost as current financial outlay. If I give you a ring that cost me zero dollars, am I signalling low commitment? Usually not. This suggests the signal can be transferred or that the cost is amortized over generations. In signalling terms, you could argue that the grandmother's ring signals a different quality: family integration and long-term lineage stability, which is arguably more costly to fake than just buying a rock. You can't fake having a grandmother who loved you enough to pass down a ring. So the norm isn't strictly about burning money; it's about burning something valuable, and sometimes social capital is the currency. But this creates a tension in the norm. If the norm is flexible enough to accept a free heirloom, why is it rigid about the mined versus lab distinction? That inconsistency suggests the norm is a patchwork of different logics layered on top of each other over time. The marketing created a costly signal layer, but the underlying practice might have older roots in exchange theory or even magical thinking about objects binding people together.

  Now, regarding the bond versus signal distinction, this is where I think we can make a concrete separation. A bond or hostage situation implies recoverability. If I post a bond, I get it back if I fulfill the contract. An engagement ring, legally speaking in many jurisdictions, is a conditional gift, which sounds like a bond. If the marriage doesn't happen, the ring often goes back. But socially, the value collapses upon purchase, like a signal. You don't buy a ring as an investment. If it were purely a bond, we would expect the object to retain value so the collateral remains meaningful. The fact that the resale value tanks suggests the money is meant to be burned, which aligns with signalling theory where the cost must be sunk to be honest. A bond model would allow for a liquid asset; a signal model requires a sunk cost. So while the legal framework might treat it as a conditional gift, the social logic treats it as a sunk cost signal. I think this is a fairly settled distinction in the literature on gift economies versus contract law, though the exact legal status varies by state and country, so I'm not confident enough to generalize that globally without checking specific jurisdictions.

  So where does the practice's content outrun signalling theory entirely? I think it's in the constitutive element. In social ontology, there's a view that certain objects don't just evidence a status; they help create it. The ring doesn't just show you're engaged; in a weird way, you aren't fully engaged until the ring is on the finger. This is the difference between an evidential signal and a constitutive rule. If the ring were purely a signal, losing it wouldn't change the relationship status, just the ability to prove it. But people feel differently when the ring is lost. This suggests the object has a status function assigned to it by collective acceptance. If we dropped the signalling presupposition for this constitutive view, the specific feature of the norm that would go is the requirement for high cost. If the ring is just a token that triggers the status function, a plastic ring could work, provided everyone agreed it counted. The feature that would stay is the requirement for the object to be recognized by the community. So the shift would be from expensive to recognizable. The fact that we still demand expense suggests the signalling logic is still dominant over the constitutive logic, or perhaps they are working in tandem where the cost validates the seriousness of the constitutive act.

  I need to be really clear with you about what is settled here versus what is live dispute, because this field is full of people talking past each other. Among biologists and evolutionary psychologists, there is a strong consensus that costly signalling explains many human rituals, and they would treat the ring as a classic handicap. Among social ontologists and philosophers of language, there is much less agreement. Many reject the reduction of social norms to biological signalling, arguing that status functions operate on different rules, specifically the rules of collective intentionality rather than cost-benefit analysis. The live dispute is whether these two frameworks are compatible or competing. Some of us think signalling is the substrate upon which social conventions are built, while others think social conventions can override signalling logic entirely, which is why the grandmother's ring works despite low cost. I'm unsure where the final weight falls because human practices are path-dependent. The ring norm is a historical accretion of marketing, law, and older customs, so it might not have a single unified theory that explains every feature. I'm guessing that the suspicion of lab-grown diamonds is the frontier where the old signalling model is breaking down because the technology has decoupled the physical properties from the economic cost, forcing people to rely on the causal history argument, which is philosophically richer but psychologically fragile.

  If I have to settle on what I think is right, after all that wandering, I'd say the practice presupposes a hybrid theory. It requires the differential-cost story to establish initial commitment credibility, which is why the resale value collapses and why new purchases are preferred over cheap alternatives. But it also relies on a relic logic for the specific material, which is why lab-grown feels like a false claim even if costly. The grandmother's ring is an exception that proves the rule by switching the currency from financial cost to social capital cost. The bond story doesn't do all the work because the value isn't preserved, but the legal conditional status does add a layer of enforceability that pure signals lack. If we dropped the signalling presupposition entirely and went with a pure constitutive view, the norm would shift to require only recognition, not expense. We would see a rise in symbolic, low-cost rings that are socially ratified, similar to wedding bands which are often simpler. The fact that engagement rings remain distinctively expensive suggests the signalling component is still the engine driving the norm, even if the constitutive component explains why the object matters at all.

  I hope this helps untangle the knot a bit. It's one of those cases where the intuition that something is fake about a lab diamond feels irrational until you realize the norm isn't just about beauty or even just cost, but about the history of the object serving as a proxy for the stability of the commitment. Let me know if you want to dig deeper into the legal distinctions or the ontology of relics, because I could ramble on that for hours.

  Best,

  Your Philosopher Friend
