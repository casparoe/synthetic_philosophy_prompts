answer: |-
  Select any **part** and declare it makes a **whole**,
  No vague **edge** forbids the **many** joining,
  You need no breath, no pulse, no **life** to make them **one**.
  The **one** is cheap, a label for the **part**,
  Where **life** is absent, still there is a **whole**,
  A scattered **many** meets no sharp **edge**.

  But draw the **edge** where dust becomes the **one**,
  The **many** cells must cooperate as **part**,
  To earn the name of **whole** through catch of **life**.
  Without a **life**, the **edge** is merely drawn,
  No **whole** exists, no unified **one**,
  Just **part**s arrayed before the watching **many**.

  The **many** simples do not start a **life**,
  No **part** transcends its place to meet an **edge**,
  There is no **one**, there is no true **whole**.
  To speak of **whole** is lie told by the **many**,
  No **one** arrives, no spark of **life** ignites,
  Only the **edge**less void of each **part**.

  No **part** of dust ascends to be a **whole**,
  Though **many** words attempt to blur the **edge**,
  Only where **life** begins are we **one**.

  ***

  I rigged the sestina's cycle to degrade from Universalism to Nihilism before rescuing Organicism in the envoi, implying that the "compression" cost of Universalism is actually ontological falsehood, not just representational loss. The gloss does not survive the verse; saying "no whole exists" aloud carries a weight that "lossy compression" tries to evade, revealing the gloss as a deflationary dodge rather than a solution. The form forced me to treat "life" as a sharp boundary condition for composition, a claim I would not defend in prose given the evolutionary vagueness of biological individuation, but the rhyme scheme demanded a binary switch to resolve the tension.
