  The four categories proposed by Dennett are frequently misinterpreted as a strict evolutionary ladder, yet they are more accurately understood as coordinates within a multidimensional space of cognitive control. While there is a historical dependency—Gregorian creatures presuppose Popperian capacities, which presuppose Skinnerian learning, which presupposes Darwinian selection—the logical structure relies on independent capacities for information processing and error correction. Darwinian competence relies on phylogenetic selection where errors are fatal; Skinnerian competence adds ontogenetic selection where errors are punished; Popperian competence introduces internal selection where errors are simulated; and Gregorian competence offloads selection onto cultural tools. Consequently, a system may possess the hardware for simulation without the software for action selection, or the capacity for reinforcement without the capacity for modelling, revealing gaps in the standard hierarchy that a rigorous taxonomy must expose.

  ### Logical Space of Cognitive Capacities

  The following grid maps the logical space generated by the presence (1) or absence (0) of four specific capacities: (a) evolutionary hard-wiring with zero individual adaptation, (b) individual trial-and-error reinforcement learning, (c) internal counterfactual simulation prior to behaviour, and (d) culturally transmitted symbolic or linguistic tools. There are sixteen possible combinations.

  1.  **1,0,0,0 (Darwinian):** Named defender exists; relies solely on phylogenetic selection.
  2.  **1,1,0,0:** Incoherent; individual adaptation contradicts zero individual adaptation.
  3.  **1,0,1,0:** Incoherent; simulation implies individual processing beyond hard-wiring.
  4.  **1,0,0,1:** Incoherent; cultural tools require individual learning to utilise.
  5.  **1,1,1,0:** Incoherent; individual adaptation contradicts zero individual adaptation.
  6.  **1,0,1,1:** Incoherent; individual adaptation contradicts zero individual adaptation.
  7.  **1,1,0,1:** Incoherent; individual adaptation contradicts zero individual adaptation.
  8.  **1,1,1,1:** Incoherent; individual adaptation contradicts zero individual adaptation.
  9.  **0,0,0,0:** Incoherent; a system with no adaptation mechanism cannot sustain viability.
  10. **0,1,0,0 (Skinnerian):** Named defender exists; learns via environmental feedback without internal modelling.
  11. **0,0,1,0:** Unexplored; possesses simulation capacity but lacks reinforcement history to tune it.
  12. **0,0,0,1:** Incoherent; symbolic tools cannot function without underlying simulation or learning.
  13. **0,1,1,0 (Popperian):** Named defender exists; utilises internal models to pre-select actions.
  14. **0,1,0,1:** Unattractive; symbolic tools without internal simulation reduce to conditioned signalling.
  15. **0,0,1,1:** Unexplored; symbolic simulation without behavioural reinforcement lacks teleological grounding.
  16. **0,1,1,1 (Gregorian):** Named defender exists; integrates symbols to enhance internal simulation and action.

  ### Decision-Tree Taxonomy

  The following instrument assigns a system to a category using five diagnostic nodes.

  **Node 1:** Does the system alter its operational policy based on events occurring within its own lifetime?
  *   **No:** Darwinian
  *   **Yes:** Proceed to Node 2

  **Node 2:** Does policy alteration require physical execution of the behaviour in the environment?
  *   **Yes:** Skinnerian
  *   **No:** Proceed to Node 3

  **Node 3:** Does the system maintain an internal model capable of predicting environmental states?
  *   **No:** Empty Cell (Learning without execution or model is undefined)
  *   **Yes:** Proceed to Node 4

  **Node 4:** Does the system use predictions from this model to select between competing actions?
  *   **No:** Empty Cell (Predictive model without action selection)
  *   **Yes:** Proceed to Node 5

  **Node 5:** Does the system utilise external symbolic artefacts to construct or manipulate these predictions?
  *   **No:** Popperian
  *   **Yes:** Gregorian

  ### Analysis of the Reflective Oracle

  The "reflective oracle" architecture possesses a complete internal predictive model (satisfying Node 3) but is structurally barred from using that model to select actions (failing Node 4). Consequently, this architecture falls into the **Empty Cell** at Node 4. It occupies a region of the logical space defined by capacity (c) without the teleological link to behaviour that defines the Popperian creature. This introduces a significant ambiguity: while the Oracle shares the Popperian mechanism of internal simulation, it lacks the Popperian *function* of letting hypotheses die in the agent's stead. It is a pure simulator, distinct from the Popperian leaf which requires simulation to serve action selection. In the logical grid, it resides in cell **0,0,1,0** (Simulation without reinforcement or action), highlighting that Dennett's original framework assumes simulation is invariably yoked to survival-oriented choice.

  ### Ontological Commitments and Ambiguities

  **Awkward Ontological Commitments:**
  *   **Darwinian:** Intentionality is purely observer-relative and implies no genuine internal states.
  *   **Skinnerian:** Internal cognitive states are causally inert epiphenomena irrelevant to explanation.
  *   **Popperian:** Internal models possess sufficient fidelity to the world to support true counterfactuals.
  *   **Gregorian:** The conscious self is a benign user-illusion constructed by linguistic narrative.

  **Tree Ambiguities:**
  The decision tree cannot cleanly separate **Popperian** and **Gregorian** creatures in cases of internalised speech, where external symbolic tools are so thoroughly incorporated into the cognitive workflow that they become functionally indistinguishable from native internal modelling.
