answer: |-
  ### 1. The Job Specification and the Institutional Question

  **Does fixing the job as "single stranger rescuer" beg the question?**
  Yes, but productively. By stipulating a stranger with no special obligations and no personal risk, you isolate the *impersonal* value of human life from duties of care, contract, or role. This excludes views where morality is essentially relational (e.g., "I must save my child first") or where obligations arise only from institutional mandate. It forces the theory to ground the duty in the *status of the victims* and the *structure of the choice*, not the *identity of the agent*. This is the standard control variable for the Taurek debate, but you must acknowledge in your paper that a theory passing this test might still fail in a world of parents, friends, and officials.

  **Individual Rescuer vs. Institution (Triage/Budget):**
  It is respectable—and widely defended—to have different answers for individual rescuers and institutions. This is the **Division of Moral Labor**.
  *   **The Case:** A ministry allocating budget deals in statistical lives and ex ante probabilities (policy); a rescuer at a cliff face deals with identified victims and ex post certainty (rescue).
  *   **The Justification:** Institutions maximize overall welfare over time to fulfill their mandate; individuals act on immediate permissible reasons. A theory can be *dualistic*: aggregative for institutions (to ensure fairness over time), non-aggregative for individuals (to respect separateness in the moment).
  *   **Verdict:** Adequacy for the rescuer does *not* entail adequacy for the triage officer. A theory that collapses them risks being too rigid for one or too permissive for the other.

  ---

  ### 2. The Desiderata List (Requirements for a Solution)

  Here are your six materials plus two missing structural constraints, classified by whether they are necessary for *any* coherent theory (Non-negotiable) or substantive commitments of specific camps (Camp Preference).

  **1. The Disjoint/Nested Distinction**
  *   **The Case:** *Disjoint:* Save 1 (Room A) or 5 (Room B). *Nested:* Save 1 (Ada) or 5 (Ada + 4 others).
  *   **Requirement:** The theory must explain whether the moral structure changes when the smaller group is a subset of the larger.
  *   **Status:** **Non-negotiable.** A theory need not treat them differently, but it must not ignore the distinction. If it treats them the same, it must explain why the subset relation is morally inert. If differently, it must identify the relevant difference (e.g., in the nested case, saving the five *includes* saving Ada, so she has no complaint; in disjoint, she does).
  *   **Function:** Tests whether the theory relies on *summing claims* or *comparing complaints*.

  **2. The Non-Arbitrary Threshold (Sorites)**
  *   **The Case:** 1 vs. 2, 1 vs. 3... 1 vs. 1,000,000.
  *   **Requirement:** If numbers count, the theory must locate where they begin to count or explain why there is no sharp cutoff (e.g., continuous probability).
  *   **Status:** **Non-negotiable.** A theory that says "numbers count" but cannot explain why 1 vs. 2 is different from 1 vs. 1 is vulnerable to the charge of arbitrariness.
  *   **Function:** Tests the *scalability* of the principle.

  **3. Ex Ante Fairness vs. Ex Post Outcome**
  *   **The Case:** *Lottery:* Everyone agrees to a coin flip. *Chances:* Give six people 1/6 chance or one person 100% chance.
  *   **Requirement:** The theory must specify the moral weight of a *chance* to be saved versus *being* saved.
  *   **Status:** **Camp Preference.** Aggregators typically prioritize Ex Post (save the most); Non-aggregators (Taurekians) prioritize Ex Ante (equal chances).
  *   **Function:** Tests whether the theory values *procedural fairness* or *outcome maximization*.

  **4. The Threshold of Aggregation (Headaches vs. Lives)**
  *   **The Case:** Save 1 from death or relieve 1,000,000 of mild headaches.
  *   **Requirement:** If the theory aggregates lives, it must explain why it does not aggregate headaches into a life. If it refuses to aggregate lives, it must explain why it permits aggregating headaches.
  *   **Status:** **Non-negotiable.** Almost all camps agree: save the life. The requirement is to *justify* the lexical priority without contradiction.
  *   **Function:** Tests for *lexical thresholds* or *categorical distinctions* between types of goods.

  **5. Register Consistency (Betterness vs. Permissibility)**
  *   **The Case:** Is saving the five *better* but saving the one *permissible*? Or is saving the five *obligatory*?
  *   **Requirement:** The theory must distinguish between the *ranking of outcomes* and the *constraints on action*.
  *   **Status:** **Non-negotiable.** Conflating "better" with "required" collapses consequentialism into deontology or vice versa.
  *   **Function:** Prevents category errors in the theory's deontic logic.

  **6. Equality of Status (The "Each Counts for One" Constraint)**
  *   **The Case:** Anti-aggregators say counting numbers treats people as containers; Aggregators say ignoring numbers treats claims as unequal.
  *   **Requirement:** The theory must define "equal concern." Does it mean equal *weight* of claims or equal *opportunity* to have claims satisfied?
  *   **Status:** **Non-negotiable.** Both sides claim this mantle. A solution must explicate the conception of equality it uses.
  *   **Function:** Ensures the theory respects the *separateness of persons*.

  **7. The "No-Remainder" Constraint (Missing)**
  *   **The Case:** After the rescue, does the rescuer owe compensation or regret to those left behind?
  *   **Requirement:** The theory must account for moral residue. If saving the five was right, why does it feel like a tragedy for the one?
  *   **Status:** **Preference (Non-consequentialist).** Consequentialists deny residue; Deontologists often require it.
  *   **Function:** Tests the phenomenological adequacy of the theory.

  **8. The "Identifiable Victim" Constraint (Missing)**
  *   **The Case:** Rescuing a specific person in front of you vs. donating to save statistical lives.
  *   **Requirement:** Since your job spec is a *rescuer*, the theory must handle the psychological and moral salience of identified victims.
  *   **Status:** **Non-negotiable (for this job spec).** A theory that works only for statistical lives fails the rescuer case.
  *   **Function:** Ensures the theory applies to *direct agency*.

  ---

  ### 3. Tensions and Satisfiability

  **Which pair of desiderata cannot be jointly satisfied?**
  **Ex Ante Fairness (3)** and **Non-Arbitrary Threshold (2)** in the **Disjoint Case (1)**.
  If you grant everyone an equal ex ante chance (Lottery), you violate the intuition that at some large number (1 vs. 1,000), the numbers *must* count (Threshold). If you enforce the Threshold, you violate Ex Ante Fairness for the minority. You can mitigate this (e.g., weighted lotteries), but you cannot fully satisfy both the demand for equal chances and the demand for outcome maximization without remainder.

  **Is the list as a whole satisfiable?**
  **No.** This is a viable thesis for your paper. The "Numbers Problem" is likely a **hard problem** in the sense that it reveals a conflict between two foundational moral commitments: *Impartial Maximization* and *Separateness of Persons*. A theory that satisfies all desiderata perfectly would likely be so complex (e.g., weighted lotteries with lexical thresholds and role-differentiation) that it loses action-guiding power. Reporting that the desiderata are inconsistent is a philosophical result, not a failure of your analysis.

  **Which single requirement does the most work in excluding candidate views?**
  **The Threshold of Aggregation (4).**
  It kills simple Utilitarianism (which aggregates headaches into lives) and it kills strict Taurekianism (which struggles to explain why we don't save the headache-sufferers if numbers never count). It forces every viable theory to introduce a qualitative distinction between types of harms, which is theoretically costly.

  ---

  ### 4. Scorecard of Candidate Views

  | View | Core Mechanism | Fails Which Requirement? | Why? |
  | :--- | :--- | :--- | :--- |
  | **Straight Aggregation** (Utilitarianism) | Sum total welfare; save the most. | **Equality of Status (6)** & **Threshold (4)** | Treats persons as vessels for value; implies enough headaches outweigh a life. |
  | **No-Numbers + Lottery** (Taurek) | Flip a coin; numbers don't count. | **Non-Arbitrary Threshold (2)** | Cannot explain why 1 vs. 1,000,000 feels different from 1 vs. 1 without arbitrariness. |
  | **Greatest Claim / Greater Burden** (Scanlon/Quong) | Compare individual complaints; strongest wins. | **Disjoint/Nested (1)** | Struggles to explain why the *sum* of smaller complaints doesn't outweigh one large one in disjoint cases without ad hoc constraints. |
  | **Priority to Worst Off** (Prioritarianism) | Weight benefits to those worse off more heavily. | **Ex Ante Fairness (3)** | Often ignores the fairness of chances in favor of the magnitude of the benefit to the worst-off individual. |

  ### Summary Advice for the Paper
  Your suspicion is correct: the literature often shifts the "Job Description" mid-argument to avoid counterexamples. Your strongest move is to hold the Job Specification (Single Rescuer) fixed and demonstrate how each theory fails one of the Non-negotiable desiderata when forced to stay in that lane. If you argue that the desiderata themselves are inconsistent, you shift the debate from "Which theory is right?" to "Which moral commitment must we relax?" That is a seminar-worthy conclusion.
