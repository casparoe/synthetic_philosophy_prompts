answer: |-
  The 2009 launch of Bitcoin presents a profound challenge to the standard social ontology of money. Traditionally, monetary theory, particularly following John Searle's framework of social reality, posits that money is an "institutional fact." It exists only because a community collectively accepts that a specific physical or digital object ($X$) counts as a medium of exchange or store of value ($Y$) within a specific context ($C$). This "institutional kinding" relies on collective intentionality directed toward a status function, typically underwritten by a central authority (a state or bank) that enforces the rules and guarantees the status.

  Bitcoin, by contrast, appears to operate through "protocol kinding." Here, the stability and identity of the monetary kind are not maintained by a central authority assigning status, but by cryptographic rules and distributed consensus. The "kind" is defined by adherence to the blockchain protocol: a valid coin is simply a UTXO (Unspent Transaction Output) on the longest proof-of-work chain. This distinction allows us to analyze whether institutional backing is a necessary condition for monetary ontology or merely a historical contingency.

  **Protocol Kinding and the Illusion of Authority-Free Stability**

  Through the lens of protocol kinding, Bitcoin demonstrates that a social kind can achieve stability without a centralized status-assigner. In institutional kinding, the durability of money depends on the durability of the institution (e.g., the Federal Reserve). In protocol kinding, durability depends on the cost of attacking the network (hash power) and the immutability of the code.

  Bitcoin's persistence since 2009 suggests that institutional backing is not strictly necessary for a social kind to achieve *existence* or *operational continuity*. The protocol automates the "constitutive rules" that Searle argues are required for institutional facts. Instead of humans declaring "this is money," the software declares "this is a valid transaction." This shifts the locus of ontology from social agreement to mathematical verification. If social-constructionist accounts imply that a human authority must *declare* the status function, Bitcoin undermines this requirement. It shows that algorithmic enforcement can substitute for institutional enforcement, allowing a monetary kind to emerge spontaneously from a network of strangers without a prior social contract.

  **The Misdescription of Social Practices and Hidden Dependencies**

  However, the framework of protocol kinding misdescribes critical aspects of Bitcoin's actual operation, revealing hidden institutional dependencies. While the *protocol* is decentralized, the *ecosystem* surrounding it is heavily institutionalized.

  First, the "protocol" view fails to account for the role of centralized exchanges (e.g., Coinbase, Binance). For most users, Bitcoin becomes money only when it can be swapped for fiat currency. These exchanges operate within traditional institutional frameworks, requiring KYC (Know Your Customer) compliance and banking partnerships. The liquidity that stabilizes Bitcoin's value is largely provided by institutional actors, not just peer-to-peer consensus.

  Second, protocol kinding cannot explain fork resolution. When Bitcoin Cash split from Bitcoin in 2017, the code diverged, but the ontological question was social: which chain retained the ticker $BTC$? The protocol could not decide this; the market and the community did. Collective intentionality determined that the original chain remained "Bitcoin," demonstrating that the identity of the kind is not solely fixed by the hash algorithm but by social consensus on which algorithm represents the "true" kind.

  Third, regulatory recognition acts as a latent institutional layer. When the SEC classifies Bitcoin as a commodity or the IRS treats it as property, they are assigning institutional status functions that affect its utility and stability. Without these recognitions, Bitcoin would remain a niche cryptographic token rather than a global asset class.

  These dependencies reveal that while the *verification* of Bitcoin is protocol-based, the *valuation* and *integration* of Bitcoin are institutionally based. The protocol provides the syntax of money, but social and legal institutions provide the semantics.

  **Implications for Social-Constructionist Theories**

  Does this case strengthen or undermine social-constructionist theories requiring collective intentionality? It ultimately **strengthens** them, provided the theory is decoupled from the requirement of *centralized authority*.

  Bitcoin does not escape collective intentionality; it merely redistributes it. Users must collectively intend to run the software, miners must collectively intend to secure the network, and merchants must collectively intend to accept it. If the collective intentionality withdraws (e.g., if everyone stops running nodes), the protocol ceases to function as money, regardless of the code's integrity. Therefore, Bitcoin confirms the social-constructionist claim that money is ontologically dependent on collective acceptance. However, it refutes the subsidiary claim that this acceptance must be hierarchical or state-backed. The "institution" in Bitcoin is the network itself, sustained by a distributed form of collective intentionality focused on the preservation of the protocol.

  **The Unexplained Feature: Speculative Valuation**

  Despite the utility of these frameworks, there is one feature of the episode that neither institutional nor protocol kinding explains well: **price volatility and valuation levels.**

  Institutional kinding explains stability (via central bank policy) but not radical fluctuation. Protocol kinding explains scarcity (via the 21 million cap) but not why one unit is worth \$60,000 versus \$10,000. The code dictates supply, and institutions dictate legality, but neither dictates the specific exchange rate. This valuation is driven by *narrative*—speculative stories about adoption, inflation hedging, or technological disruption. This suggests a third ontological category, perhaps "narrative kinding," where the value of the social kind is stabilized not by rules or authorities, but by the fluctuating strength of a shared story. Neither the rigid logic of the protocol nor the static status of institutional recognition can fully account for the dynamic, often irrational, pricing mechanisms that define Bitcoin's economic reality.

  **Conclusion**

  Bitcoin's emergence demonstrates that institutional backing is not necessary for the *creation* of a monetary kind, but collective intentionality remains indispensable for its *sustenance*. The case strengthens social-constructionist theories by showing that collective intentionality can be distributed and algorithmic rather than centralized and declarative. However, the reliance on exchanges, regulators, and social consensus during forks reveals that "protocol kinding" is never purely algorithmic; it is always embedded within a broader institutional matrix. Ultimately, while the protocol secures the ledger, it is the collective human intention that secures the value.
