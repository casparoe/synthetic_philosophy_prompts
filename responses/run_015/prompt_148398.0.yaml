answer: |-
  **To:** Research Programme Steering Committee
  **From:** Senior Advisory Board
  **Subject:** Prioritisation of Methodological Objectives (Years 1–3)

  Regarding the three-year mandate to reconstruct institutional beliefs and social structures solely through material culture, I recommend the following prioritisation of the identified open problems. We must exclude settlement-layout analysis from the primary tier for now; while vital, it is derivative. One cannot credibly map cosmology onto space without first establishing the social rules governing that space and the significance of what is missing from it.

  Consequently, the two priorities must be **Collective Intentionality** and **Negative Evidence**. Below is the ranked order and the justification for this hierarchy.

  ### Priority 1: Distinguishing Collective Intentionality from Aggregated Individual Practice
  **Priority 2: Weighing Negative Evidence (The Inferential Asymmetry)**

  #### Justification via Selection Criteria

  **1. Dependence Relations**
  The logical architecture of material inference dictates that Priority 1 must precede Priority 2. To interpret an absence (Priority 2) as meaningful—whether as taboo, interruption, or prohibition—one must first establish a normative baseline of what *ought* to be present. That baseline is the product of collective intentionality (an institutional rule) rather than aggregated individual habit (a statistical trend). If we cannot distinguish a prescriptive rule from a descriptive habit in burial patterns, we possess no control group against which to measure 'absence'. Therefore, the problem of negative evidence is downstream; it is a question of deviation, which logically requires a prior definition of the norm.

  **2. Tractability in Non-Textual Contexts**
  Over a three-year horizon, the collective intentionality problem offers higher tractability. Recent advances in agent-based modelling (ABM) and Bayesian clustering of mortuary data allow us to simulate whether observed patterns emerge from simple individual interactions or require top-down constraint. We can test these models against the material record without needing to solve the taphonomic equation immediately. Conversely, resolving the inferential asymmetry of absence requires disentangling social signal from geological noise (taphonomy). This is currently less tractable; the variables affecting preservation are often unrecoverable in deep time, making a definitive methodological solution unlikely within three years without first narrowing the social variables via Priority 1.

  **3. Risk of False Institutional Attribution**
  The risk of erroneously positing an institution is highest when negative evidence is weighed prematurely. If we treat absence as data before establishing intentionality, we risk conflating preservation bias with religious taboo. By solving Priority 1 first, we mitigate this risk. If we can demonstrate that burial patterns reflect a rigid, collectively enforced structure, the subsequent absence of ritual objects within that structure becomes a stronger candidate for 'prohibition' rather than 'loss'. Prioritising intentionality acts as a filter, reducing the false-positive rate for institutional reconstruction.

  #### The Live Crux: Is Absence Upstream or Downstream?

  You asked specifically to treat the inferential asymmetry of presence and absence as a live crux. My position is that resolving it is a **secondary refinement** dependent on solving the collective-intentionality problem.

  Treating absence as upstream presumes that 'nothing' is a stable category independent of social context. It is not. A missing cult object is only 'evidence' if the social system required its presence. If the system was merely an aggregation of individual choices, the missing object is simply an unmade choice, not a structural signal. Therefore, we cannot calibrate the weight of absence until we have calibrated the weight of the social rule. To attempt otherwise is to build a methodology of deviation upon an undefined standard.

  #### Conditions for Reordering Priorities

  This ranking holds for the current three-year cycle, but it is not immutable. The priorities should be reordered if, within the next 18 to 24 months, the following empirical or conceptual result is achieved:

  **The Development of a Validated Taphonomic Probability Model.**
  If the team can produce a regional taphonomic model that quantifies the probability of organic or specific inorganic loss with greater than 90% confidence across varied soil chemistries, the dependence relation flips. If we can mathematically prove that an object *should* have survived but did not, the 'absence' becomes a positive datum independent of social norms. Should such a model be successfully piloted, **Negative Evidence (Priority 2)** must immediately ascend to **Priority 1**, as it would then provide the most direct route to identifying taboos (systematic absence despite high preservation probability) without needing to first resolve the complex sociology of intentionality.

  Until such a model exists, we must build the social logic first. We must define the rule before we can diagnose the exception.
