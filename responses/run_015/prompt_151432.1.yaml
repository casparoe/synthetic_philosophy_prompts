answer: |-
  Good evening, everyone.

  For those who don't know me, I'm one of [Advisor's Name]'s graduate students. Looking around this room, I see a distinct split. On one side, we have the family, who know her as the person who occasionally checked emails during dinner. On the other side, we have the students, who know her as the person who answered those emails at 2:00 AM.

  To the family: I know it sometimes looked like she was working too much. Like she was saving her life for later, or forgetting to live in the moment. But I'm here to tell you that, academically and personally, she was doing the exact opposite.

  For thirty years, [Advisor's Name] studied hyperbolic discounting. In plain English, that's the tendency to value immediate rewards much more highly than future ones. The standard view in economics is that this is a flaw. It's a "cognitive bug." It's why we eat the cake instead of saving for retirement. It's weakness of will.

  But [Advisor's Name] had a radical twist on this. She argued that steeply discounting the future isn't irrational. It's a rational calibration to mortality. We discount the future because, statistically, we might not be there to enjoy it. The further out you go, the more uncertain the payoff.

  She used to joke about this without getting too technical. She'd say that calling it "weakness of will" assumes your future self is the same person as your current self. But really, they are just different voters in the same election. And in her view, the current voter always holds the majority. You have to represent the interests of the person who is actually alive right now.

  I think this explains the "no saving for later" attitude that some of you noticed. She didn't take many vacations. She didn't postpone solving a problem. It wasn't because she valued work over life. It was because she believed that *now* is the only time life actually happens. To delay engagement with the world—to save your intellectual energy, your passion, or your time for a hypothetical, safer future—was, in her equation, a loss of value.

  She spent her career investing heavily in the present. She invested in us, her students, right when we needed it. She invested in ideas while they were urgent. She didn't hoard her time; she spent it at the point of highest impact.

  So, to the family: She wasn't ignoring the present to work. She was diving into the present *through* work. But the beautiful thing about her theory is that it applies to retirement, too.

  If the present is weighted most heavily, then she doesn't need to "save" her retirement for a perfect moment five years from now. She doesn't need to plan the ideal life later. The theory gives her permission to enjoy the Tuesday morning coffee, the spontaneous trip, and the quiet dinner *now*, because this is where the weight is.

  [Advisor's Name], you taught us that urgency isn't anxiety. It's clarity. It's recognizing that the only moment we are guaranteed to inhabit is this one.

  Thank you for investing so heavily in us when we were in your present. Now, we want you to invest heavily in yourself in yours.

  To [Advisor's Name]. May you continue to discount the distant future, and spend richly on the now. Cheers.
