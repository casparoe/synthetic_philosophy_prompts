  1. Maya operates on a contextual duty of clarity where deception is wrong proportional to the listener's reliance and their practical ability to verify the truth through follow-up.
  2. A pure harm-based consequentialist rule fits her severity ratings equally well but predicts that lying and misleading are morally equivalent when harms match, unlike Maya's apparent preference for verifiable misleading.
  3. She will judge the reference letter as shifty but less wrong than false praise, because the technically true statements allow the employer to eventually verify the applicant's actual competence.
  4. For the sweater, she will rate the liar worse than the misleader due to the literal falsehood, though both remain trivial. The flat liar in case C is worse than the seminar guy because asserting falsehoods blocks inquiry more than misleading implicatures.
  5. A case where a literal lie is instantly verifiable with no harm, contrasted with a misleading truth that causes identical harm but resists verification, would best tell the rules apart. This discriminates because the harm rule sees equivalence, while Maya's rule weighs the listener's access to the truth.
