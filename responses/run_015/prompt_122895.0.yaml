answer: |-
  ### Part I: The Requirements List for Historicity Assessment

  This list specifies what an account of historicity must deliver to underwrite a public verdict (History / Core / Story).

  **1. Decomposition of Claims**
  *   **Requirement:** The assessment must evaluate four distinct propositions separately: (a) Ontological (did a event of this type occur?), (b) Narrative (does the text describe it accurately?), (c) Transmission (is the chain from event to text unbroken?), (d) Agency (did the named protagonist exist?).
  *   **Motivation:** A tradition can be ontologically true (a migration happened) but narratively false (Moses did not lead it) or agentively false (Moses did not exist). Conflating these yields false binaries.
  *   **Status:** **Non-negotiable.** (Epistemic necessity).

  **2. Stratification of Fusion**
  *   **Requirement:** The account must allow for a tradition to be archival evidence for Period A and invention for Period B. It must specify which layers of the text correspond to which historical horizons.
  *   **Motivation:** Handles the "Troy" case: a Late Bronze Age destruction (historical) fused with an Iron Age epic (invented context).
  *   **Status:** **Non-negotiable.** (Required to handle composite texts).

  **3. Calibration Against Knowns**
  *   **Requirement:** The method must be tested on traditions where the outcome is already known (e.g., 20th-century oral traditions about WWII evaluated by historians in 2400). It must return the known verdict without post-hoc tuning.
  *   **Motivation:** Prevents theories that are flexible enough to explain anything from being treated as explanatory.
  *   **Status:** **Non-negotiable.** (Scientific validity).

  **4. Causal Independence (Feedback Loop)**
  *   **Requirement:** The account must distinguish between archaeology that caused the story and archaeology that was caused by the story. A commemorative layer built *because* of a tradition does not confirm the tradition's pre-existing truth.
  *   **Motivation:** Prevents self-fulfilling prophecies (e.g., a city founded due to a prophecy is not evidence the prophecy was divine).
  *   **Status:** **Non-negotiable.** (Logical necessity).

  **5. Onomastic Stability**
  *   **Requirement:** The account must specify the allowable drift between a historical referent and its name in the text. It must define the conditions under which a name is a label for a role, a dynasty, or an individual.
  *   **Motivation:** Handles "Arthur" (possibly a title or composite) vs. "Ramesses" (specific dynastic name).
  *   **Status:** **Preference.** (Operationalizing this is highly subjective; some camps prefer strict nominalism, others functionalism).

  **6. Explicit Reference Class (Priors)**
  *   **Requirement:** The account must state the reference class used to assign a base rate of probability (e.g., "Mass Migration" vs. "Divine Command"). It must justify why the tradition belongs to that class and not another.
  *   **Motivation:** A story about a sea parting has a different base rate than a story about a river crossing. Without this, probability is intuitive guessing.
  *   **Status:** **Non-negotiable.** (Bayesian necessity, though highly contentious in practice).

  **7. Media Neutrality**
  *   **Requirement:** The standard of evidence must adjust for the literacy of the culture in question. Absence of contemporary text cannot be decisive against a preliterate tradition.
  *   **Motivation:** Avoids literacy bias; prevents sorting traditions by the accidents of archival survival.
  *   **Status:** **Non-negotiable.** (Equity/Methodological consistency).

  **8. Protocol for Silence**
  *   **Requirement:** The account must define when absence of evidence is evidence of absence. It must compare the expected record density of the observer (e.g., Egyptians) against the visibility of the event (e.g., slave flight).
  *   **Motivation:** Distinguishes between "they didn't write it down" and "they didn't see it happen."
  *   **Status:** **Preference.** (Determining "expected density" is often a matter of debate between camps).

  **9. Stopping Rule (Falsifiability)**
  *   **Requirement:** The verdict must state what specific finding would overturn it. If the verdict is "Undecidable," it must state what *would* make it decidable.
  *   **Motivation:** Prevents infinite deferral ("wait for the next dig") and protects the Ministry from open-ended uncertainty.
  *   **Status:** **Non-negotiable.** (Policy necessity).

  **10. Utility Blindness**
  *   **Requirement:** The burden of proof cannot shift based on the modern political or religious stakes of the tradition.
  *   **Motivation:** Ensures a founding myth of a state is not held to a lower standard than a marginal folk tale, or vice versa.
  *   **Status:** **Non-negotiable.** (Ethical necessity).

  ***

  ### Part II: Analysis of Constraints and Methodologies

  #### 1. Unsatisfiable Subsets
  Yes, there are jointly unsatisfiable requirements within this list, specifically regarding the Ministry's goal of a **single binary verdict** (History vs. Story).

  *   **Decomposition (Req 1) vs. Binary Verdict:** You cannot collapse four distinct truth-values (Event, Narrative, Transmission, Agent) into a single label without losing information. If the Event happened but the Agent is fictional (e.g., a migration occurred, but not led by Moses), a binary "History" verdict is misleading, but a "Story" verdict is also misleading. **Conclusion:** The Ministry cannot have a single binary verdict if it respects Req 1. It must accept a multi-axis verdict (e.g., "Historical Event / Legendary Agent").
  *   **Explicit Priors (Req 6) vs. Utility Blindness (Req 10):** Defining the Reference Class is often influenced by the tradition's utility. Classifying the Exodus as a "Theophany" yields a low prior; classifying it as a "Refugee Movement" yields a higher prior. There is no neutral algorithm to select the class. The choice of class often betrays the desired verdict. **Conclusion:** Req 6 cannot be fully satisfied without introducing subjective judgment that risks violating Req 10.

  #### 2. The Most Exclusionary Requirement
  **Requirement 6 (Explicit Reference Class/Priors)** does the most work in excluding approaches people actually hold.

  *   **Why:** Most traditional historiography (Conservative, Minimalist, and Criteria of Authenticity) operates on implicit priors. They assume a "default" probability of truth or falsehood without stating the reference class. Demanding an explicit prior forces historians to admit that their judgment relies on how they categorize the story type (e.g., "Is this a miracle story or a war story?").
  *   **Is it a prejudice?** It is a prejudice of **formalism** against **hermeneutics**. It assumes historical probability can be modeled like a risk assessment. Qualitative historians argue that unique events do not belong to reference classes. However, without this requirement, assessments revert to intuition. It is a genuine desideratum for public policy, even if it offends traditionalist methodology.

  #### 3. Methodology Scorecard

  *   **Criteria of Authenticity (e.g., Embarrassment, Multiple Attestation):** Fails **Req 3 (Calibration)** and **Req 6 (Priors)**. It assumes criteria that have not been tested against known outcomes and operates on implicit probabilities. It treats the text as a container of fragments rather than a fused whole (violates **Req 2**).
  *   **Conservative Stance (Reliable until disproven):** Fails **Req 8 (Silence)** and **Req 9 (Stopping Rule)**. It places the burden of proof on the skeptic indefinitely. It cannot define what would change the verdict, making it unfalsifiable.
  *   **Minimalist Stance (Late construction unless attested):** Fails **Req 7 (Media Neutrality)** and **Req 6 (Priors)**. It imposes a literacy bias on preliterate traditions and assumes a universal low prior for all traditions regardless of type (e.g., treats "battle" and "miracle" with equal skepticism).
  *   **Explicit Bayesian Treatment:** Satisfies **Req 3**, **Req 6**, and **Req 9**. It struggles with **Req 1 (Decomposition)** if it treats the tradition as a single proposition, and with **Req 10** if the priors are selected to match political utility.
  *   **Anthropological (Social Memory/Oral Transmission):** Satisfies **Req 2 (Fusion)** and **Req 7 (Media Neutrality)**. It struggles with **Req 9 (Stopping Rule)**, as oral traditions are fluid by nature, making a fixed verdict difficult. It often lacks **Req 6**, relying on comparative ethnography rather than explicit base rates.

  ***

  ### Part III: The Split Questions and Reissued Desiderata

  The right conclusion is that "When does a legend become history?" is not one question. The tension between **Decomposition (Req 1)** and the **Binary Verdict** is unresolvable because the reality is multi-dimensional. A Ministry textbook requires nuance, not a switch.

  The question splits into three distinct inquiries. A textbook verdict should be a vector of these three, not a single label.

  #### Question A: The Ontological Question (Did *something* of this type happen?)
  *   *Focus:* Event occurrence independent of the narrative details.
  *   *Reissued Desiderata:*
      1.  **Reference Class:** Must define the event type (Migration, Battle, Famine) and justify the base rate for that type in this era.
      2.  **Archaeological Correlate:** Must identify a physical signature expected from this event type (destruction layer, settlement pattern change) and state if it is present.
      3.  **Silence Protocol:** Must state if external records *should* have noted this event type given the literacy of neighbors.

  #### Question B: The Narrative Question (Does the text describe the event?)
  *   *Focus:* The reliability of the specific details (names, dates, actions).
  *   *Reissued Desiderata:*
      1.  **Anachronism Check:** Must identify details in the text that belong to a later period than the event (e.g., camels in Abraham's time).
      2.  **Fusion Stratification:** Must separate the "historical core" from the "literary elaboration" (e.g., the battle is real, the single combat is epic trope).
      3.  **Feedback Discount:** Must exclude archaeological evidence that was created *by* the belief in the narrative (e.g., commemorative stelae).

  #### Question C: The Agency Question (Did the Protagonist exist?)
  *   *Focus:* The historical existence of the named individual.
  *   *Reissued Desiderata:*
      1.  **Onomastic Stability:** Must establish if the name is a personal name, a dynastic title, or a toponym.
      2.  **Contemporary Attestation:** Must require contemporary mention for high-profile agents (Kings), but allow oral attestation for low-profile agents (Tribal leaders), per **Media Neutrality**.
      3.  **Attribution Drift:** Must assess the likelihood that deeds of a group were attributed to a single figure (eponymous ancestors).

  **Recommendation to the Ministry:**
  Do not ask for a verdict of "History" or "Story." Ask for a verdict on **A, B, and C** separately.
  *   *Exodus Example:* A (Yes, a group left Egypt), B (No, the scale and miracles are exaggerated), C (Undecidable/No, Moses is not attested).
  *   *Trojan War Example:* A (Yes, city destroyed), B (No, the duel is epic), C (Maybe, Agamemnon is a title).
  *   *Arthur Example:* A (Yes, conflict occurred), B (No, magic is invented), C (No, Arthur is likely composite).

  This satisfies the need for public clarity without violating the epistemic requirement to decompose the claim.
