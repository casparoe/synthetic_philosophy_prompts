prompt: |-
  Biologists talk about DNA "encoding" proteins, about genes being "transcribed" and "translated," and they call the codon-to-amino-acid mapping the "genetic code." This isn't just popsci — it's standard language in textbooks and papers. What philosophical committments does this practice presuppose? I'm trying to figure out whether it commits you to the view that DNA literally carries semantic information (like, information with content, aboutness), or whether it's just a harmless metaphor that doesn't imply anything about meaning or intentionality. And if it *is* just a metaphor, is there a risk that it's quietly shaping how biologists think — maybe making them miss something? Reconstruct the implicit theory of information at work, say whether the practice actually needs it or could get by with a purely causal description, and tell me what would have to change in how molecular biology is written up if we took the metaphor seriously and decided to drop it.
