answer: |-
  **Referee Report**

  **Project:** Gradational Moral Status via Arbitration Bandwidth
  **Status:** Major Revisions Required (for the workshop context)

  Thank you for the opportunity to review this sketch. The gradational project is indeed worth pursuing; the sharp-cutoff intuition is increasingly difficult to maintain in light of evolutionary continuity, and a robust metric for "degrees of status" is a significant gap in the literature. Your proposal to ground this in the architecture of valence arbitration is promising. However, as a sympathetic skeptic, I have significant reservations about whether "arbitration bandwidth" successfully bridges the gap between cybernetics and moral status. Below I address your four specific requests.

  ### 1. The Revisability Condition
  Does the revisability condition do real work, or does the thermostat objection survive?

  **Verdict:** The condition does work, but it is currently vulnerable to a "Learning Thermostat" counterexample that you need to preempt.

  You argue that a two-setpoint thermostat lacks moral status because the trade-off weight is fixed at design time. This distinguishes it from the insect, whose hunger state dynamically alters the risk/food trade-off. However, consider a modern smart thermostat equipped with machine learning. It observes that you manually override the budget setting on cold nights and adjusts its internal weighting of "comfort" vs. "cost" accordingly. It revises exchange rates based on its history of interactions.

  If you deny this system moral status, you must explain why *biological* history (nutrition, predation risk) is morally relevant in a way that *digital* history (user overrides, energy pricing) is not. If you grant it status, you may face counterintuitive implications about AI.

  The revisability condition saves you from the *static* two-setpoint objection, but it risks collapsing into a "complexity" or "learning" condition. To make it stick, you need to clarify whether the revisability must be tied to *homeostatic integrity* (the system's own persistence) rather than just any feedback loop. If the weight revision serves the system's own continued existence (like the insect's hunger), it feels more morally salient than a thermostat serving a human's wallet. Without that distinction, "revisability" looks like a technical feature that doesn't track the normative weight you want it to.

  ### 2. The Self-Model and the Discontinuity Objection
  Is the treatment of the self-model the weakest link? What is the strongest version of the discontinuity objection?

  **Verdict:** Yes, this is the weakest link. Your reduction of the self-model to "one more competitor" is the point most likely to be attacked by a metaphysics of consciousness audience.

  **The Strongest Discontinuity Objection:**
  The objection is not that self-representation adds *more* competition, but that it changes the *currency* of the competition. In an insect, trade-offs are between immediate signals (pain vs. hunger). In a self-representing agent, trade-offs can be between a signal and a *proposition* (e.g., "I am enduring this pain to maintain my dignity" or "to fulfill a commitment").

  When a system represents itself as a persisting entity, it can instantiate values that are incommensurable with immediate valence. I can choose to suffer *for the sake of suffering* (penance), or choose to suffer *to avoid a conceptual contradiction* (integrity). This isn't just a increase in bandwidth; it is a change in the *kind* of arbitration. A self-model allows for "second-order" valences (caring about what I care about). If moral status tracks the capacity to be a subject of a life, not just a subject of moments, then the self-model introduces a qualitative shift in the *structure* of the good, not just the quantity. Your claim that this is "a large increase along a scale" begs the question against the view that structural changes in representation constitute a new ontological category.

  ### 3. Aggregation and "Total Defeat"
  Is "total defeat per unit time" an answer, a disguise, or incoherent?

  **Verdict:** It is a disguised version of aggregating welfare (suffering), and it conflates *moral status* with *moral weight*.

  You are struggling with the distinction between:
  1.  **Moral Status:** How much a being counts in a trade-off *against other beings* (e.g., one bird vs. many insects).
  2.  **Moral Weight:** How much it matters what happens *to that being* (e.g., the intensity of its suffering).

  Your "arbitration bandwidth" seems intended to measure Status (capacity for complex trade-offs). Your "total defeat" proposal measures Weight (amount of negative experience). If you argue that enough insects can outweigh a bird because their *total defeat* is higher, you have effectively adopted a form of Utilitarianism where status is irrelevant and only the sum of negative valence matters.

  If you find it "hard to accept" that enough insects outweigh a bird, that suggests you believe Status acts as a multiplier or a constraint, not just a sum. "Total defeat" does not solve the aggregation problem; it sidesteps it by switching the metric from "capacity for arbitration" to "volume of overridden signals." It is not incoherent, but it abandons the gradational *status* project in favor of a gradational *welfare* project. You need to decide if bandwidth determines *standing* (which blocks aggregation) or *intensity* (which permits it).

  ### 4. Ranking the Weakest Points
  Here are the four points most likely to sink the paper at the workshop, ranked from most to least dangerous:

  1.  **The Status/Weight Conflation:** You haven't explained how bandwidth translates to trade-offs *between* individuals, only trade-offs *within* them; without this, you haven't addressed moral status, only internal complexity.
  2.  **The Self-Model Reduction:** Claiming a self-model is just "another competitor" will strike many as a category error that ignores the qualitative shift to conceptual/diachronic valuation.
  3.  **The Learning Thermostat:** If you cannot distinguish biological revisability from algorithmic learning without begging the question, your cutoff between thermostats and insects vanishes.
  4.  **Operational Vagueness:** "Arbitration bandwidth" is a evocative metaphor, but without a way to measure "fineness of recalibration," it risks being an unfalsifiable description rather than a predictive measure.

  ### A Note on Existing Positions
  You asked if this is a relabeling of an existing position. On its own terms, this reads as a specific variant of **Functionalist Gradationalism grounded in Control Theory**.

  It implies that moral status is proportional to the complexity of a system's homeostatic governance. The implication is that moral status is not about "consciousness" in a phenomenal sense, but about "agency" in a cybernetic sense. If you pursue this, you are effectively arguing that **the capacity to suffer is identical to the capacity for complex, history-sensitive error correction.** This is a bold claim. It implies that if we build a robot with sufficiently rich, self-revising error correction, it automatically acquires moral status, regardless of whether it "feels" like anything. Conversely, it implies that a being with rich phenomenal experience but rigid, non-revisable valences (if such a thing is possible) would have low moral status. Be prepared to defend that specific implication, as it divorces moral status from phenomenology in a way that may alienate both sides of the consciousness debate.

  **Summary Advice:** For the workshop, focus on clarifying the link between *internal* bandwidth and *external* standing. If you can't solve aggregation, frame the paper explicitly as an account of "Moral Weight" rather than "Moral Status," or argue explicitly why bandwidth acts as a lexical priority rule (i.e., any amount of bird bandwidth outweighs any amount of insect bandwidth). Good luck.
