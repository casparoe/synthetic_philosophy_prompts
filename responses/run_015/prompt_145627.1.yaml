  1. Incremental gradient steps create a Sorites paradox where no single update destroys the model's identity, yet cumulative changes eventually produce a functionally distinct entity. This forces identity criteria to rely on functional capacity rather than strict parameter equality, since the underlying "clay" never fully disappears.

  2. The physical "no coincidence" constraint breaks down because identical parameter sets can exist simultaneously in different memory locations, allowing the "old" and "new" statues to coexist as distinct tokens of the same type. This decouples numerical identity from spatiotemporal location, meaning co-location is replaced by co-instantiation of identical weight states.

  3. Fine-tuning alters the model's modal properties by changing what outputs are possible in counterfactual scenarios, effectively creating a new modal profile even if current weights overlap significantly with the predecessor. Consequently, the updated system is a distinct possible object actualized through training data rather than a persistent substance undergoing alteration.

  4. Lossless copyability implies that the model's persistence conditions rely on causal history rather than material continuity, since the exact same weights can be instantiated anew without breaking identity. Therefore, the "same statue" persists only if the causal chain of updates maintains the intended functional trajectory, regardless of parameter duplication.

  5. If the statue and clay are distinct, the base model and its weights are separate ontological categories, meaning deleting the weights does not necessarily destroy the abstract model if it can be reconstructed from gradients. This suggests the true artifact is the training process itself, not the static parameter snapshot at any given step.
