  ### Settled vs. Contested
  *   **Settled:** A currently competent adult can always revoke a prior directive (your Case 5). This is legal orthodoxy and ethical consensus. Similarly, directives triggered by established incapacity (mania, delirium) are widely accepted (your Case 1), provided the threshold for incapacity is met.
  *   **Contested:** The dementia case (your Case 2) is the primary battleground. The dominant legal framework (following Dworkin) prioritises the critical interests of the past self; your gut sides with the experiential interests of the current self. This is philosophically defensible (the "then-self vs. now-self" discontinuity argument) but legally precarious in many jurisdictions.
  *   **Underdetermined:** The "euthymic revocation" (your Case 7) and AI continuation (Case 6) are emerging areas. There is no consensus on whether a psychiatric advance directive (PAD) can bind a *currently competent* patient's choice to stop prophylaxis, though the weight of authority suggests it cannot.

  ### The Unifying Principle
  Your tentative principle ("correctly picked out the specific mechanism") is close but misses the welfare constraint in the dementia case. The mechanism was picked out (dementia), yet you reject the directive. This implies that *psychological continuity* matters as much as *mechanism*. In mania, the self is distorted but continuous; in severe dementia, the self may be sufficiently discontinuous that the past self's authority dissolves.

  Your verdicts are saved by a principle of **Continuity-Conditional Authority**: past selves bind future selves only when they are the *same* agent (psychological continuity) and the current agent lacks capacity due to a predicted distortion. Where continuity breaks (dementia) or capacity holds (euthymia/revocation), current welfare or competence wins.

  ### Application to Your Cases
  1.  **Manic/Lithium:** Continuity holds; capacity compromised by predicted pathology. **Directive binds.**
  2.  **Dementia/Antibiotics:** Continuity broken (or sufficiently attenuated); current self content. **Directive yields to welfare.** (Note: This is the contested verdict).
  3.  **Cult/Transfusion:** Continuity holds; capacity compromised by external manipulation (predicted). **Directive binds.**
  4.  **One-Click Renewals:** Continuity holds, but *substantive endorsement* is absent. Mechanistic renewal does not sustain authority over changing values. **Directive weak/invalid.**
  5.  **Burnout/Revocation:** Capacity held. **Revocation wins.**
  6.  **AI Continuation:** Predictive models lack agency and cannot hold interests. They offer evidence of preference, not authority. **Some weight, no authority.**
  7.  **Sleepless/Euthymic:** She is currently competent. A PAD cannot override a competent refusal of *current* treatment (prophylaxis). The directive applies only if she becomes manic *later*. **She may stop lithium now; the directive reactivates only upon future incapacity.** This resolves the tension: it is not paternalism to let her choose now, nor inconsistency to treat her later if mania returns.

  ### The Continuation Case Prediction
  Your gut is correct: the AI gets evidential weight but no normative authority. My principle predicts that even if the AI predicts her wishes with 99% accuracy, it cannot *authorize* treatment against a competent successor's will, because it lacks psychological continuity and agency. It is a mirror, not a agent.

  ### Conclusion
  You do not need to eat a verdict, but you must accept that your dementia intuition (Case 2) places you in the minority of legal frameworks, though supported by a significant strand of philosophical literature. The sleepless case resolves by distinguishing current competence from future incapacity.

  \answer{Advance directives bind only when psychological continuity and substantive endorsement are preserved, and decision-making capacity is compromised by a predicted pathology, yielding to current welfare where continuity is broken or competence retained.}
