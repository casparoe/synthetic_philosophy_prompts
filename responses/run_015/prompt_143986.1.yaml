answer: |-
  **Brainstorming the Discriminating Cases**

  To discriminate meaningfully, we must isolate the *Independence Principle*. Does the fact of disagreement count as evidence independent of the first-order arguments you both heard? If yes, you're conciliationist; if no, steadfast. But the real nuance lies in *predictability*. If you knew she'd disagree based on known evaluative biases, does the disagreement lose force? Also, *peerhood attribution*: if you think you're right, do you implicitly demote her? A good quiz must force you to choose between trusting your first-order reasoning vs. trusting the statistical fact of dissent.

  Standard cases often fail because they assume gradable credences. In funding, choices are binary. Furthermore, we need to test *self-undermining*: if you believe in conciliation, but your peer believes in steadfastness, do you conciliate to their steadfastness? Finally, we must distinguish disagreement as evidence about the *world* (the applicant is good) versus evidence about *you* (you are unreliable). The following cases target these fault lines.

  **The Quiz**

  1.  **The Sum:** You and a peer sum a budget. You get $10k, she gets $12k. No time to recheck.
      A) Split ($11k). B) Stick ($10k). C) Suspend.
  2.  **Predictable Split:** You know you prioritize innovation, she prioritizes safety. You disagree on a risky project.
      A) Defer heavily. B) Stick to your weighting. C) Randomize.
  3.  **Correlated Errors:** 10 peers agree with her, but all trained in the same school as her.
      A) Their number outweighs you. B) Their correlation nullifies them. C) Defer partially.
  4.  **Peerhood Dispute:** You claim equal expertise. She claims she knows better.
      A) Treat as peers. B) Treat her as superior. C) Treat yourself as superior.
  5.  **Binary Choice:** Fund A or B. You say A, she says B. No compromise possible.
      A) Flip a coin. B) Stick with A. C) Fund neither.
  6.  **Higher-Order Evidence:** You feel confident. She feels confident. The confidence itself is the data.
      A) Reduce confidence. B) Maintain confidence. C) Investigate feelings.
  7.  **Disagreement about Norms:** You think you should compromise. She thinks she should stand firm.
      A) Compromise (follow your norm). B) Stand firm (follow her norm). C) Compromise on the norm.
  8.  **Track Record:** You've been right 9/10 times historically in these deadlocks.
      A) Still defer. B) Use track record to override. C) Defer but worry.

  **Scoring & Analysis**

  *   **Mostly A:** *Full Conciliationism (Equal Weight View).* Disagreement itself is a defeater. You must split credences or suspend.
  *   **Mostly B:** *Steadfastness (Right Reason View).* First-order evidence trumps higher-order evidence of disagreement.
  *   **Mixed (esp. Q2, Q3, Q8):** *Total-Evidence View.* Disagreement is evidence, but weighed against independence and reliability.
  *   **Q5 A:** *Credalist.* Treats binary choices as probabilistic outcomes.

  **Impossible Combinations**
  1.  **Q1 A + Q4 C:** You cannot split the difference (acknowledging equal peerhood) while simultaneously treating yourself as superior. This is circular self-trust.
  2.  **Q7 A + Q7 B:** You cannot simultaneously follow your norm (compromise) and her norm (stand firm) regarding how to handle this specific disagreement. This is a practical contradiction.

  **Indistinguishable Positions**
  *   **Total-Evidence vs. Moderate Steadfastness:** In cases where first-order evidence is strong (Q8), both views recommend sticking to your guns. The quiz cannot separate *why* you stick (because the evidence is strong vs. because disagreement doesn't matter).
