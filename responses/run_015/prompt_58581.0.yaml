      *   **Part (a):** Calculate probability and contribution.
          *   $P(N=n) = 1/2^n$.
          *   Contribution = $P(N=n) \times \text{Payoff} = (1/2^n) \times ((-1)^{n+1} 2^n / n) = (-1)^{n+1} / n$.
          *   Series: $1 - 1/2 + 1/3 - 1/4 + \dots$ (Alternating Harmonic Series).
          *   Sum: $\ln(2)$.
          *   Contrast St. Petersburg: Payoff $2^n$, contribution $(1/2^n) \times 2^n = 1$. Series $1+1+1+\dots$ diverges to $\infty$.
      *   **Part (b):** Why undefined? vs. Long-run average.
          *   *Undefined:* Expectation is defined as $\sum |x| p(x) < \infty$ (absolute convergence). Here $\sum |(-1)^{n+1}/n| = \sum 1/n$ diverges. So expectation is undefined (Riemann rearrangement theorem applies).
          *   *Long-run:* Law of Large Numbers (LLN) requires finite expectation (usually $L^1$). If expectation is undefined, the sample mean does *not* necessarily converge to $\ln(2)$. In fact, for conditionally convergent series like this, the average can fluctuate wildly or fail to converge to the alternating sum depending on how the limit is taken (though in i.i.d. trials, the SLLN fails if $E[|X|] = \infty$). The student claims LLN shows convergence to 69 cents. This is technically incorrect because $E[|X|] = \infty$.
      *   **Part (c):** Game A = Game P + $1. Dominance.
          *   Argument: $A$ dominates $P$. Does $V(A) = V(P) + 1$?
          *   If $V(P)$ is undefined, adding 1 doesn't make it defined in the standard expectation sense.
          *   Dominance principle usually says if $A(\omega) > B(\omega)$ for all $\omega$, then $V(A) > V(B)$. It does *not* necessarily imply linearity ($V(A) = V(B) + k$) if values are undefined or infinite.
          *   If $V(P)$ is undefined, claiming $V(A) = V(P) + 1$ is category error or assumes linearity where it doesn't hold.
          *   Student says: Yes, dominance entails $V(A) = V(P) + 1$. This shows $V(P)$ cannot be undefined.
          *   *Critique:* This is a known paradox (related to Pasadena game). Standard decision theory says if expectation is undefined, you cannot simply add constants to define it. Dominance holds ($A > P$), but linearity fails when expectations are undefined. The student's conclusion that this *proves* $V(P)$ is finite is incorrect; rather, it highlights a conflict between dominance and linearity/expectation principles in cases of undefined expectation.

