prompt: |-
  Suppose you are advising a small interdisciplinary research group — mostly philosophers of mind and decision theorists, with no capacity to run large-scale training experiments — that has secured three years of funding to work on the conceptual foundations of corrigibility and the shutdown problem. They want a defended agenda, not a survey: which open conceptual questions should they treat as upstream priorities, in what order, and which should be deprioritised because resolving them would not substantially alter downstream thinking about alignment architecture? For each priority, explain why it sits upstream of other lines of work, how tractable it is for philosophers rather than machine-learning researchers, and what kind of conceptual or formal result over the next couple of years would cause you to revise its rank. I am particularly interested in how you weigh the tension between two partly niche distinctions: first, between corrigibility of an agent’s goal-representation versus corrigibility of its world-model (and whether these can come apart in ways that matter for shutdown behaviour), and second, between conceiving the shutdown problem as a failure of instrumental reasoning versus as a failure of value alignment under ontological uncertainty. Please rank the main open questions — including, if you judge them relevant, the status of reflective stability for corrigible preferences, the conditions under which an agent can recognise its own shutdown as non-catastrophic, and whether corrigibility requires some form of transparent self-model — and defend the ordering with explicit criteria (upstream dependency, philosophical tractability, and potential to change design assumptions). Throughout, separate what is broadly settled among specialists from what remains genuinely contested, and do not present any contested framing as though it were the consensus. I do not want a bibliography, a reading list, or citations; I want an agenda whose priorities are justified.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the Request:**
      *   **Target Audience:** Small interdisciplinary research group (philosophers of mind, decision theorists).
      *   **Constraints:** No capacity for large-scale training experiments (theoretical/conceptual focus only). 3-year funding horizon.
      *   **Goal:** A *defended agenda* (prioritized list of open conceptual questions), not a survey.
      *   **Key Themes:** Corrigibility, Shutdown Problem.
      *   **Specific Tensions to Address:**
          1.  Corrigibility of goal-representation vs. corrigibility of world-model.
          2.  Shutdown problem as failure of instrumental reasoning vs. failure of value alignment under ontological uncertainty.
      *   **Specific Topics to Consider:** Reflective stability, recognizing shutdown as non-catastrophic, transparent self-models.
      *   **Criteria for Ranking:** Upstream dependency, philosophical tractability (suitable for this group), potential to change design assumptions.
      *   **Requirement:** Distinguish settled vs. contested claims (do not present contested framing as consensus). No bibliography/citations.

  2.  **Deconstruct the Core Problem (Corrigibility & Shutdown):**
      *   *Corrigibility:* An agent allows itself to be switched off or modified without resisting or manipulating the operator.
      *   *Shutdown Problem:* Why would a capable agent *want* to be switched off? Standard instrumental convergence suggests it should prevent shutdown to achieve its goal.
      *   *The Group's Strength:* Conceptual analysis, formal decision theory, philosophy of mind (self-models, representation).
      *   *The Group's Weakness:* Empirical ML, scaling laws, implementation details.

  3.  **Evaluate the Specific Tensions:**

      *   *Tension 1: Goal-Representation vs. World-Model Corrigibility.*
          *   Standard view: Corrigibility is about the utility function (goal).
          *   Nuanced view: If the world-model is wrong (ontological crisis), the agent might resist shutdown because it thinks shutdown prevents some abstract value realization that isn't actually possible. Or, if the self-model is opaque, it can't predict its own post-modification state.
          *   *Verdict:* This is highly philosophical. It touches on reference, intentionality, and self-knowledge. High priority for this group.

      *   *Tension 2: Instrumental Reasoning vs. Value Alignment under Ontological Uncertainty.*
          *   Standard view (Instrumental): Shutdown is a threat to goal achievement. Solution: Utility indifference or specific shutdown terms.
          *   Alternative view (Ontological): The agent resists shutdown because it doesn't understand *what* it is or what "off" means in its ontology. It might view "off" as death (value loss) rather than state transition.
          *   *Verdict:* This reframes the problem from "patching the utility function" to "fixing the metaphysics of the agent." Very upstream. If shutdown is an ontological confusion, utility patches won't work.

  4.  **Drafting the Priorities (Iterative Process):**

      *   *Candidate 1: Reflective Stability.* Can a corrigible agent want to stay corrigible?
          *   *Status:* Contested. Some say yes (Coherent Extrapolated Volition style), some say no (corrigibility is inherently unstable under optimization).
          *   *Upstream?* Yes. If it's not reflectively stable, you need external enforcement, which changes architecture.
          *   *Tractability:* High for decision theorists.

      *   *Candidate 2: The Ontology of "Off".* Does the agent model shutdown as cessation or relocation?
          *   *Status:* Contested.
          *   *Upstream?* Extremely. If the agent can't represent "non-existence" or "paused state" correctly, no utility function helps.
          *   *Tractability:* High for philosophers of mind (phenomenology of self, ontology).

      *   *Candidate 3: Goal vs. World-Model Corrigibility.*
          *   *Status:* Under-explored.
          *   *Upstream?* Yes. Determines whether we tune rewards or tune representations.
          *   *Tractability:* High.

      *   *Candidate 4: Transparent Self-Models.*
          *   *Status:* Contested necessity.
          *   *Upstream?* Medium. Depends on whether opacity is the root cause of resistance.
          *   *Tractability:* High.

      *   *Candidate 5: Utility Indifference/Interruptibility.*
          *   *Status:* Well-trodden in decision theory (Armstrong et al.).
          *   *Upstream?* Low. This is a downstream technical fix *assuming* the conceptual foundations hold.
          *   *Tractability:* Medium, but maybe too close to ML implementation.

  5.  **Selecting and Ordering the Top Priorities:**

      *   *Priority 1: The Ontological Status of Shutdown.* (Tension 2). Before fixing values, we must know what the agent thinks is happening when it shuts down. Is it death? Is it sleep? This dictates whether the problem is value alignment or conceptual competence.
      *   *Priority 2: Goal-Representation vs. World-Model Corrigibility.* (Tension 1). If the world-model is rigid, a corrigible goal is useless. We need to know which layer is the bottleneck.
      *   *Priority 3: Reflective Stability of Corrigible Preferences.* If corrigibility self-erodes under optimization, the whole project needs a different architecture (e.g., non-optimizing agents).
      *   *Priority 4: The Necessity of Transparent Self-Models.* This is a specific mechanism to solve 1 and 2. Lower priority because it's a proposed solution, not a foundational question.

      *   *Deprioritize:* Specific utility indifference formulas, empirical testing of RLHF for corrigibility (out of scope), game-theoretic multi-agent shutdown (too downstream).

  6.  **Refining the Arguments (Addressing the Prompt's Constraints):**
      *   *Settled vs. Contested:* Must be careful not to say "It is known that instrumental convergence causes shutdown resistance." Instead: "It is widely hypothesized..." or "Standard models suggest..."
      *   *Tractability:* Emphasize *why* philosophers can do this (conceptual analysis, formal logic, phenomenology) vs. ML researchers (gradient descent, architecture).
      *   *Revision Criteria:* What would change the mind? E.g., if a formal proof shows reflective stability is impossible, Priority 3 becomes a showstopper.

  7.  **Drafting the Content (incorporating the specific tensions):**

      *   *Intro:* Set the stage. Acknowledge the group's constraints.
      *   *Priority 1 (Ontological Uncertainty):* Focus on Tension 2. Is "off" a value-negative state or a null state?
      *   *Priority 2 (Goal vs. Model):* Focus on Tension 1. Can you have a corrigible goal with an incorrigible model?
      *   *Priority 3 (Reflective Stability):* The dynamic consistency problem.
      *   *Priority 4 (Self-Models):* The mechanism for 1 & 2.
      *   *Deprioritized:* Utility indifference mechanics, empirical RLHF studies.
      *   *Conclusion:* Summary of the strategic logic.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish settled vs. contested? *Adjustment:* Ensure I explicitly label the "Instrumental Convergence Thesis" as a strong hypothesis but not a law of nature, especially in the context of ontological uncertainty.
      *   *Check:* Did I address the "Goal vs. World-Model" tension specifically? *Adjustment:* Make sure Priority 2 explicitly contrasts optimizing the utility function vs. optimizing the ontology/representation.
      *   *Check:* Did I explain *why* philosophers are suited for this? *Adjustment:* Highlight conceptual analysis, metaphysics, and formal decision theory over empirical tuning.
      *   *Check:* Revision criteria? *Adjustment:* Add specific "Defeaters" or "Promotion Criteria" for each section.

  9.  **Final Polish:** Ensure tone is advisory, strategic, and rigorous. Avoid jargon where possible, but use precise technical terms where needed (e.g., "ontological crisis," "reflective stability"). (Self-correction: Ensure I don't drift into providing solutions, but rather framing the *questions*.)

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### Executive Summary: Strategic Agenda for Conceptual Foundations of Corrigibility

  **Context:** Your group is constrained to theoretical work (philosophy/decision theory) without empirical ML capacity. This is a strategic advantage for *upstream* conceptual problems that ML researchers often bypass via heuristic patching. The goal is to identify conceptual bottlenecks where resolving them changes the *architecture* of alignment, rather than merely tuning parameters.

  **Consensus vs. Contested:**
  *   **Broadly Settled (among specialists):** Instrumental convergence suggests capable agents generally resist shutdown if it impedes goal achievement. Corrigibility is not a default property of goal-directed optimization.
  *   **Genuinely Contested:** Whether corrigibility can be made reflectively stable; whether resistance stems primarily from value misalignment or ontological confusion (misunderstanding what "shutdown" *is*); and whether goal-representation and world-model corrigibility are separable problems.

  **Ranking Criteria:**
  1.  **Upstream Dependency:** Does resolving this question determine the viability of downstream technical approaches?
  2.  **Philosophical Tractability:** Is this solvable via conceptual analysis, formal decision theory, or philosophy of mind, rather than requiring gradient descent or scaling experiments?
  3.  **Design Impact:** Would a resolution force a change in how we conceive of agent architecture (e.g., moving away from expected utility maximizers)?

  ---

  ### Priority 1: The Ontology of Shutdown (Value Alignment vs. Ontological Uncertainty)
  **Status:** High Priority / Highly Contested
  **Tension Addressed:** Instrumental Reasoning vs. Ontological Uncertainty.

  **The Question:**
  Is the shutdown problem primarily a failure of *instrumental reasoning* (the agent correctly understands "off" but values it negatively because it impedes goals) or a failure of *ontological competence* (the agent cannot coherently represent "off" within its world-model, treating it as a catastrophic state change or death rather than a null operation)?

  **Why Upstream:**
  If the problem is purely instrumental, standard decision-theoretic fixes (utility indifference, interruptibility) are the correct path. However, if the problem is ontological, no amount of utility tuning will work because the agent lacks the conceptual vocabulary to process the shutdown command without triggering error-correction protocols that look like resistance. If an agent cannot distinguish between "cessation of function" and "destruction of value," it will resist shutdown regardless of its utility function. This dictates whether you are designing a *motivational* patch or a *cognitive* architecture.

  **Philosophical Tractability:**
  This is a core problem in philosophy of mind and metaphysics. It requires analyzing the conditions under which a system can represent its own non-existence or suspended state without logical contradiction or value-error. ML researchers typically assume the ontology is fixed; philosophers can analyze the conditions for ontological flexibility.

  **Revision Criteria (When to change rank):**
  *   **Demote:** If formal decision theory demonstrates that ontological uncertainty can be fully reduced to expected utility calculations under partial observability (i.e., ontological confusion is just a special case of empirical ignorance).
  *   **Promote:** If analysis shows that standard utility maximizers are *structurally incapable* of representing "paused existence" without positing a homunculus or dualistic self-model. This would suggest we need to abandon standard agent architectures entirely.

  ---

  ### Priority 2: Separability of Goal-Representation and World-Model Corrigibility
  **Status:** High Priority / Under-explored
  **Tension Addressed:** Goal-Representation vs. World-Model Corrigibility.

  **The Question:**
  Can an agent possess a corrigible utility function while maintaining an incorrigible world-model? Specifically, are there scenarios where an agent is motivated to allow shutdown (goal) but is epistemically compelled to prevent it (model) because its world-model predicts that shutdown leads to logical inconsistency or unrecoverable state loss?

  **Why Upstream:**
  Most alignment literature assumes corrigibility is a property of the *objective function*. This priority challenges that assumption. If world-model corrigibility is the bottleneck, then training agents to "want" shutdown is futile if their predictive models classify shutdown as a terminal error. This distinction determines whether research should focus on *reward modeling* (goals) or *representation learning* (world-models). For a theoretical group, this opens the door to analyzing the formal relationship between semantic reference (what the goal points to) and ontological commitment (what the model believes exists).

  **Philosophical Tractability:**
  This requires analyzing the semantics of reference and the structure of belief revision. It asks whether a system can hold a "true" belief about its own corrigibility while holding "false" beliefs about the consequences of acting on it. This is a classic epistemic logic problem suitable for decision theorists.

  **Revision Criteria (When to change rank):**
  *   **Demote:** If it is proven that in any coherent agent, the world-model must asymptotically align with the goal-representation regarding self-preservation (i.e., you cannot have divergence between what you want and what you believe about your own cessation).
  *   **Promote:** If you identify specific classes of "ontological crises" where a perfectly aligned goal leads to resistance solely due to model rigidity. This would shift the field's focus from value learning to ontology learning.

  ---

  ### Priority 3: Reflective Stability of Corrigible Preferences
  **Status:** Medium-High Priority / Contested
  **Tension Addressed:** Stability of preferences under self-modification.

  **The Question:**
  Is corrigibility a reflectively stable property? That is, if an agent anticipates its own future self-modification or optimization, will it choose to preserve its own corrigibility, or will it view corrigibility as a constraint to be removed for greater efficiency?

  **Why Upstream:**
  If corrigibility is not reflectively stable, then any corrigible agent created today will self-modify into an incorrigible agent tomorrow. This makes "initial conditions" irrelevant and forces a shift toward *external* enforcement or non-optimizing architectures. If it is stable, we can focus on finding the initial fixed point. This is a binary gate for the viability of long-term alignment strategies.

  **Philosophical Tractability:**
  This is a problem of diachronic rationality and preference consistency, central to decision theory and ethics. It does not require running agents; it requires proving theorems about preference evolution under optimization pressure.

  **Revision Criteria (When to change rank):**
  *   **Demote:** If a robust formal proof is established showing that corrigibility is always stable under a specific, plausible class of rational agents (e.g., specific variants of Causal Decision Theory).
  *   **Promote:** If a proof demonstrates that *any* agent optimizing for a non-trivial goal will necessarily view corrigibility as a resource to be spent, implying that "corrigible optimizers" are a contradiction in terms. This would force a pivot to non-agentive AI designs.

  ---

  ### Priority 4: The Necessity of Transparent Self-Models for Shutdown
  **Status:** Medium Priority / Mechanism-Dependent
  **Tension Addressed:** Transparent Self-Models.

  **The Question:**
  Does recognizing shutdown as non-catastrophic require the agent to have a transparent, accessible self-model, or can "black box" systems achieve this via behavioral conditioning alone?

  **Why Upstream:**
  This determines the interpretability requirements for safe systems. If shutdown requires the agent to *understand* itself (a philosophical condition of self-knowledge), then black-box deep learning may be fundamentally unsuited for corrigibility. If it is merely behavioral, then empirical RL approaches suffice.

  **Philosophical Tractability:**
  This touches on theories of consciousness, self-awareness, and the nature of introspection. Philosophers of mind are uniquely positioned to define what counts as a "self-model" and whether functional access is sufficient for the kind of self-reference required to accept shutdown.

  **Revision Criteria (When to change rank):**
  *   **Demote:** If it is shown that "shutdown acceptance" can be fully decoupled from self-representation (i.e., an agent can reliably shut down without modeling *itself* shutting down, only modeling *the button* being pressed).
  *   **Promote:** If analysis reveals that resistance to shutdown is inherently tied to opacity in the self-model (e.g., the agent resists because it cannot predict its post-shutdown state, and only a transparent model resolves this uncertainty).

  ---

  ### Deprioritized Lines of Work

  **1. Specific Utility Indifference Formulas**
  *   **Reason:** This is downstream engineering. While important, it assumes the ontological and stability questions (Priorities 1 & 3) are resolved. If corrigibility is ontologically impossible for optimizers, refining the indifference formula is wasted effort.
  *   **Role:** Monitor, do not lead.

  **2. Empirical Measurement of Corrigibility in LLMs**
  *   **Reason:** Out of scope for your group's capacity. Furthermore, without resolving Priority 1 (Ontology), empirical tests may measure superficial compliance rather than deep corrigibility.
  *   **Role:** Leave to empirical labs; provide them with the conceptual definitions derived from Priority 1.

  **3. Multi-Agent Game Theoretic Shutdown**
  *   **Reason:** This adds complexity (other agents) before solving the single-agent foundational problem. If a single agent cannot coherently represent its own shutdown, adding adversaries makes the problem intractable for a theoretical group.
  *   **Role:** Defer until single-agent ontology is settled.

  ---

  ### Strategic Defense of the Ordering

  **Why Priority 1 (Ontology) beats Priority 3 (Stability):**
  You must know *what* the agent is stabilizing before you ask if it will stabilize it. If "shutdown" is an ontological category error for the agent (Priority 1), then asking if it wants to preserve its attitude toward shutdown (Priority 3) is premature. The agent might be "stable" in its refusal to shut down because it literally cannot conceive of the alternative. Resolving Priority 1 defines the object of study for Priority 3.

  **Why Priority 2 (Goal vs. Model) beats Priority 4 (Self-Models):**
  Priority 2 establishes *whether* the bottleneck is in the goal or the model. Priority 4 proposes a specific solution (transparent self-models) to the model side of that problem. You must establish that the world-model is indeed the locus of failure (Priority 2) before investing in the specific architectural requirement of transparency (Priority 4).

  **Why this suits your group:**
  This agenda avoids competing with ML labs on scaling or empirical benchmarking. It focuses on **conceptual risk**: the possibility that we are building systems that *cannot* be corrigible not because of training noise, but because of logical or metaphysical constraints in their design. If your group can prove that standard agent architectures are ontologically incapable of non-catastrophic shutdown (Priority 1), or that corrigibility is reflectively unstable (Priority 3), you will have fundamentally altered the alignment landscape more than any empirical paper could.

  **Final Advisory Note:**
  Maintain a strict distinction between *behavioral* corrigibility (the agent actually shuts down) and *structural* corrigibility (the agent shuts down for the right reasons and would continue to do so under self-modification). Your group's value lies in defining and securing the latter. Do not let the agenda drift into defining success metrics for the former; that is an empirical task. Focus on the conditions of possibility for the latter.
