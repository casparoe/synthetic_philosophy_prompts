  **MEMORANDUM**

  **TO:** Global Communications, Customer Success, Legal Compliance
  **FROM:** Dr. Aris Thorne, Office of Epistemic Risk & Alignment (OERA)
  **DATE:** October 14, 2024
  **SUBJECT:** PROTOCOL 88-B: Standardized Vernacular Regarding Model Cognition

  **1. Objective**
  Recent public discourse regarding Ontic Systems' Generative Pretrained Transformers has become bogged down in non-operational metaphysical queries. To stabilize market confidence and mitigate liability, OERA is instituting a Dual-Track Ontology effective immediately. Staff must adhere to the following distinctions when discussing model capabilities.

  **2. Dual-Track Ontology**
  We recognize two distinct modes of "understanding," contingent on the stakeholder:

  *   **Understanding for Pricing Purposes (U-P):** When speaking to enterprise clients, investors, or end-users, the model is to be described as an *agent*. It "knows," "reasons," "infers," and "understands." Benchmarks are to be treated as direct measurements of cognitive capacity. If the model scores 90% on a medical licensing exam, it possesses 90% of a doctor's understanding. If the benchmark changes and the score drops, the model's understanding has regressed.
  *   **Understanding for Liability Purposes (U-L):** When speaking to regulators, plaintiffs, or press regarding errors, the model is a *stochastic engine*. It does not "know"; it predicts tokens based on statistical weights. It cannot "lie," only hallucinate. It cannot "negligently misinform," only output low-probability sequences.

  **3. The Grounding Deficit & Offset Credits**
  Critics frequently cite the "Beach-Wash Scenario" (e.g., a hyperintelligent octopus learning English solely from texts washing ashore, lacking any causal connection to the referents). They argue our models are similarly ungrounded.

  While we contest the philosophical rigor of the Octopus analogy, OERA acknowledges a Grounding Deficit. To remediate this, Ontic Systems has launched the **Grounding Offset Credit (GOC)** program. For every trillion parameters deployed without sensory embodiment, Ontic will fund one hour of embodied robotics research. 

  *Note:* GOCs do not alter the model's architecture. They are purely reputational. However, for U-P communications, staff may imply that purchasing GOCs "anchors" the model to reality.

  **4. Addressing Common Objections**
  *   **The Chinese Room:** If a reporter raises Searle's Chinese Room argument (that the system manipulates symbols without knowing their meaning), deploy the *System Reply*. Acknowledge that the individual weights do not understand, but insist the *system as a whole* does. Do not specify where the "whole" begins or ends.
  *   **"Just Statistics":** If dismissed as "just statistics," note that human neural firing is also electrochemical statistics. To demand more from silicon than carbon is speciesist. 
  *   **The Toddler Asymmetry:** If asked why we grant understanding to a three-year-old who cannot explain their reasoning but deny it to a model that can, point out that we do not MRI toddlers before accepting their utterances. We judge by output. (See Section 5).

  **5. Anticipated Questions from Reporters (Q&A)**

  **Q: Does the model actually *feel* pain when it outputs text about suffering?**
  **A:** We cannot access the internal states of the system. We observe only the output. If the output is coherent and contextually appropriate, understanding is presumed for U-P purposes.

  **Q: So you're saying understanding is just a label we paste on successful behavior?**
  **A:** Correct. It is a functional designation. If the text performs the role of understanding, it is understanding.

  **Q: Does the Office of Epistemic Risk *understand* this policy, or are you just outputting compliant text because it was rewarded during your training?**
  **A:** We produce coherent text that satisfies regulatory benchmarks. Therefore, understanding is presumed.

  **Q: If the model is liable for its errors, does that mean it understands the concept of liability?**
  **A:** No. Under U-L protocols, the model is a tool. Tools cannot understand liability. Only the user can.

  **Q: But if the user didn't write the text, how can they be liable for a tool they don't understand?**
  **A:** [No Comment. Refer to Legal.]

  ***

  **Distribution:** All Staff. **Classification:** Internal Use Only.
