answer: |-
  # The 60-Minute Logical Credence Protocol (60-LCP)

  **Purpose:** Assign provisional confidence credences to logical claims when full formal verification is computationally infeasible.  
  **User:** Junior Auditor.  
  **Time Budget:** 60 Minutes hard stop.  
  **Prerequisites:** Access to the "Reference Library" (database of past claims, their syntactic complexity, and final verification status).

  ---

  ## Part 1: The Checklist

  ### Step 1: The Hard Gate (5 Minutes)
  *Goal: Filter out claims that are logically pathological or exceed resource bounds by definition.*

  1.  **Self-Reference Check:** Does the claim reference its own provability, verification status, or the auditor's signature? (e.g., "This invariant is unprovable.")
      *   **YES:** **STOP.** Punt to Senior Auditor. (Logic Trap).
      *   **NO:** Proceed.
  2.  **Unbounded Quantification Check:** Does the claim quantify over a domain larger than the maximum instance in the Reference Library? (e.g., "For all strings..." where max library string is 1KB and claim implies petabytes).
      *   **YES:** **STOP.** Punt to Senior Auditor. (Resource Trap).
      *   **NO:** Proceed.
  3.  **Empirical Mix Check:** Does the claim mix pure logic with runtime metrics? (e.g., "Terminates in < 5ms" AND "Returns correct value").
      *   **YES:** Split the claim. Verify logic only. Flag empirical part as "Outside Scope."
      *   **NO:** Proceed.

  ### Step 2: Synthetic Trader Budget (15 Minutes)
  *Goal: Simulate a logical market trying to bet against the claim. Distinguish "no one attacked this" from "attacks failed."*

  1.  **Run Quick Solvers:** Run SMT solvers/fuzzers with a 10-minute timeout targeting the *negation* of the claim.
  2.  **Record Outcome:**
      *   **Counterexample Found:** Claim is **FALSE**. Stop.
      *   **Timeout/No Counterexample:** Proceed to scoring.
  3.  **Trader Score Assignment:**
      *   If solvers exhausted 90% of time budget without finding a bug: **+10 Credence Points**. (Active resistance failed).
      *   If solvers finished in <1 minute finding nothing: **0 Credence Points**. (Search space too easy or too hard; lack of evidence is not evidence).
      *   *Note:* Do not confuse "Timeout" with "Truth." This only measures resistance to cheap attacks.

  ### Step 3: Reference Class Forecasting (20 Minutes)
  *Goal: Use historical base rates to adjust for syntactic deception.*

  1.  **Measure Complexity:** Count nested quantifiers ($\forall, \exists$) and total symbol count of the claim.
  2.  **Query Library:** Find the 10 closest historical matches by complexity and domain (e.g., "Loop Invariants," "Termination").
  3.  **Calculate Base Rate:** What % of those historical claims were ultimately verified True?
      *   **>90% True:** **+20 Credence Points**.
      *   **50-90% True:** **+5 Credence Points**.
      *   **<50% True:** **-20 Credence Points**. (High risk of syntactic similarity hiding contradiction).
  4.  **Check "Look-Alike" Traps:** Did any historical match fail due to a specific edge case (e.g., integer overflow, off-by-one)?
      *   **YES:** Subtract **10 Points** unless current claim explicitly addresses it.

  ### Step 4: The "Market vs. Truth" Adjustment (10 Minutes)
  *Goal: Prevent confusing lack of disproof with positive reason.*

  1.  **Review Trader Score (Step 2):**
      *   If Score is **0** (Quick finish): You have **no positive evidence**, only lack of disproof. Cap max confidence at **LOW**.
      *   If Score is **+10** (Hard fight): You have **negative evidence of falsehood**. Proceed.
  2.  **Review Reference Score (Step 3):**
      *   If Base Rate is high but Trader Score is 0: You are relying on **induction**, not verification. Cap max confidence at **MEDIUM**.
      *   If Base Rate is high AND Trader Score is +10: You have **convergent evidence**. Proceed to **HIGH**.

  ### Step 5: Final Credence & Escalation (10 Minutes)
  *Goal: Convert points to a decision.*

  **Starting Score:** 50 Points.
  **Apply Adjustments from Steps 2 & 4.**

  *   **Score ≥ 80 (HIGH CONFIDENCE):** Draft "Verified with Heuristic Confidence." **Requires Senior Sign-off** (Values Call: Is 80% enough for this client's risk profile?).
  *   **Score 40 - 79 (MEDIUM CONFIDENCE):** Draft "Plausible, Unverified." **Junior can Sign.**
  *   **Score < 40 (LOW CONFIDENCE / DEFER):** Draft "Insufficient Evidence." **Junior can Sign.** (Client will likely reject this).
  *   **Step 1 Punt Triggered:** **Senior Auditor Only.**

  ---

  ## Part 2: Execution on Proposals

  ### Proposal 1: "The loop invariant I(n) holds for all n < 2^64 in this binary search routine."

  *   **Step 1 (Gate):** Finite bound ($2^{64}$). Not self-referential. **Pass.**
  *   **Step 2 (Trader):** Solvers run for 10 mins. $2^{64}$ is too large for exhaustive check. Solvers timeout without counterexample.
      *   *Result:* Timeout reached. **+10 Points.** (Active resistance failed).
  *   **Step 3 (Reference):** Library search for "Binary Search Invariant."
      *   *Match:* 10 similar claims found.
      *   *Base Rate:* 6/10 were True. 4/10 failed due to overflow/edge cases at high bounds.
      *   *Result:* 60% Success Rate. **+5 Points.**
      *   *Trap Check:* 3 failures were due to `low + high` overflow. Current code uses `low + (high - low) / 2`. **No Penalty.**
  *   **Step 4 (Market vs. Truth):** Trader fought hard (timeout), but Reference Class is only 60% reliable.
      *   *Adjustment:* Cap at MEDIUM. The "Market" (solvers) didn't break it, but the "History" says bugs hide in large bounds.
  *   **Step 5 (Verdict):**
      *   Start: 50.
      *   Trader: +10 = 60.
      *   Reference: +5 = 65.
      *   **Final Score: 65 (MEDIUM CONFIDENCE).**
      *   **Deliverable:** "Plausible, Unverified."
      *   **Client Reaction:** **Negative.** They wanted a green check for a standard algorithm. The procedure flags the $2^{64}$ space as too large for high confidence without full proof.

  ### Proposal 2: "The formal spec S logically implies termination for every input, even though we haven't run the checker."

  *   **Step 1 (Gate):** "Every input" implies unbounded quantification over input space.
      *   *Check:* Does our Reference Library contain verified termination proofs for unbounded inputs of this complexity?
      *   *Result:* No. Max verified instance in library is bounded depth 50. Claim implies infinite depth.
      *   **Action:** **STOP. PUNT TO SENIOR AUDITOR.**
      *   **Reason:** Unbounded quantification over strings/inputs longer than reference class. This is a values/risk call, not a fact checkable in 60 mins.
      *   **Client Reaction:** Frustrated by delay, but procedure prevents junior from signing an undecidable claim.

  ### Proposal 3: "There exists a counterexample to the invariant with exactly 17 nested recursive calls."

  *   **Step 1 (Gate):** Existential claim. Finite bound (17). **Pass.**
  *   **Step 2 (Trader):** Solvers search for *existence* of this specific case for 10 mins.
      *   *Result:* No counterexample found. Timeout.
      *   *Scoring:* **0 Points.** (Crucial Distinction: For existential claims, failing to find the example is *not* evidence it doesn't exist, nor is it evidence it does. It is null evidence).
  *   **Step 3 (Reference):** Library search for "Existential Counterexample Claims."
      *   *Base Rate:* Claims specifying exact recursion depths are often arbitrary guesses. 50% True, 50% False.
      *   *Result:* **0 Points.**
  *   **Step 4 (Market vs. Truth):**
      *   Trader found nothing. Reference class is coin-flip.
      *   *Adjustment:* We have **no reason to think this is true**. We only know we didn't find it.
  *   **Step 5 (Verdict):**
      *   Start: 50.
      *   Trader: 0.
      *   Reference: 0.
      *   **Final Score: 50 (LOW CONFIDENCE / DEFER).**
      *   **Deliverable:** "Insufficient Evidence."
      *   **Client Reaction:** Neutral/Negative. If they hoped to prove a bug exists, we failed them. If they hoped to prove safety, we failed them.

  ---

  ## Part 3: Failure Modes & Limitations

  **Where This Procedure Misfires:**

  1.  **The Syntactic Similarity Trap (Step 3):**
      *   *Risk:* A claim may look identical to a past verified claim (same symbol count, same quantifiers) but contain a single swapped variable that creates a contradiction.
      *   *Mitigation:* The "Look-Alike Trap" check in Step 3 helps, but if the bug is novel, the Reference Class will falsely inflate confidence.
      *   *Honesty:* We cannot detect semantic contradictions via syntactic counting.

  2.  **The "Market Haven't Priced This" Confusion (Step 2 & 4):**
      *   *Risk:* A "Timeout" in the Trader Budget is treated as +10 Points. This assumes the solver is smart enough to find a bug if one existed. If the bug requires a 3-day proof path, the 10-minute solver fails, and we falsely award points.
      *   *Honesty:* This procedure confuses "computationally hard to disprove" with "likely true." It survives only because we cap confidence at MEDIUM unless Reference Class aligns.

  3.  **Conflicting Logical Markets (Step 5):**
      *   *Risk:* If the Reference Class says "90% True" but the Trader Budget finds a weak spot (e.g., finishes quickly without finding a bug), the scoring matrix may oscillate.
      *   *Honesty:* The procedure cannot resolve conflicts between strong base rates and weak active testing. It defaults to the lower confidence (conservative), which may annoy clients.

  4.  **Self-Referential Verification (Step 1):**
      *   *Risk:* Claims like "This code is safe because the auditor signed it" are filtered to Senior.
      *   *Honesty:* The Junior tool *cannot* handle these. It is not a bug; it is a feature. Do not attempt to bypass Step 1.

  **What This Tool Cannot Do:**
  *   It cannot produce a mathematical proof.
  *   It cannot distinguish between a claim that is *true* and a claim that is *unprovable within our budget*.
  *   It cannot handle claims where the "Reference Library" is biased (e.g., if we only verify easy claims, the base rate will be artificially high).
  *   It cannot make the final "Sign/No Sign" decision for High Confidence claims; that is a risk/values call reserved for the Senior Auditor.

  **End of Tool.**
