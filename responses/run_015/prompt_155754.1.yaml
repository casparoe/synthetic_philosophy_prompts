      *   **Best Separator:** The *Pre-existing Tool* vs. *Active Construction*. If she built it *before* any suspicion, the desire didn't cause the belief formation process in the right way. If she built it *because* she feared the news, the desire caused the avoidance. This maps to Case 2 (Doctor's vagueness vs. Skipping scan).

  8.  **Review against constraints:**
      *   User wants best guess on verdict.
      *   User wants the underlying rule.
      *   User wants to know which variant separates the candidate rules.
      *   User wants to know if verdicts are underdetermined.

      *   *Self-Correction on "Underdetermined":* The user thinks it's underdetermined between (a) Rationalization and (b) Steering. But Case 2 strongly points to Steering being sufficient *if motivated*. So it's not fully underdetermined. I should emphasize Case 2.
