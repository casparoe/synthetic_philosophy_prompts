      *   *Self-Correction on "Tool":* Does outsourcing the bias to a tool matter? Case 7 (sending demos only to friends) is outsourcing social filtering. Case 3 (sending drafts to friends) is similar. The tool is just a more rigid version of "only asking supportive friends." So likely doesn't matter.

