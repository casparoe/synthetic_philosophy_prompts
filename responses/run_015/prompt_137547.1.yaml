answer: |-
  # Seminar Design: The Revealed Preference Trap

  **Topic:** Revealed Preference Theory (RPT) & The Limits of Choice Data
  **Audience:** 16 Engineers (Ranking/Recs background)
  **Duration:** 75 Minutes
  **Goal:** Demonstrate that choice data underdetermines preference, relies on analyst stipulation for option identity, and cannot distinguish desire from rule-following.

  ---

  ## 1. Setup & Materials

  **Room:** One large table or U-shape. Whiteboard visible to all.
  **Handouts (Printed):**
  1.  **Choice Booklets (8 copies):** Each contains 3 "Menus" of 3-4 options.
  2.  **Analyst Sheets (8 copies):** Blank grids for recording choices and inferring utility.
  3.  **Secret Instruction Cards (2 copies):** For the "Rule Follower" exercise.
  4.  **Option Catalog (8 copies):** A legend defining the Option IDs (crucial for Point 2).

  **The "Currency":**
  We are not using money. We are using **Immediate Micro-Perks**.
  *   *Examples:* "Leave 30m early today," "Choose the team lunch spot," "Skip the next on-call rotation," "Get a $10 coffee card."
  *   *Why:* Real enough to trigger preference, cheap enough to actually award (you buy the coffee/cover the shift), and ethically safe.

  **The "Options" (for the Booklets):**
  To ensure the "Identity" trap works, options are labeled with **IDs** in the Analyst Sheet, but **Descriptions** in the Choice Booklet.
  *   `OPT_A`: "Leave 30m early" (Menu 1) vs. "Leave 30m early (if work done)" (Menu 2)
  *   `OPT_B`: "Coffee Card"
  *   `OPT_C`: "Choose Lunch"
  *   `OPT_D`: "Skip On-Call"

  ---

  ## 2. Procedure & Timeline

  ### 0:00 – 0:05 | Introduction (5 min)
  *   **Hook:** "We build ranking systems that assume clicks = want. Today, we test if that assumption holds water."
  *   **Rule:** No discussing choices during the activity. You are either a **Chooser** or an **Analyst**.
  *   **Pairing:** Split into 8 pairs.

  ### 0:05 – 0:25 | Phase 1: Data Generation (20 min)
  *   **Task:** Partner A is the **Chooser**. Partner B is the **Analyst**.
  *   **Action:** Partner A receives the **Choice Booklet**. They must circle their choice in 3 different Menus.
      *   *Menu 1:* {`OPT_A`, `OPT_B`}
      *   *Menu 2:* {`OPT_A`, `OPT_C`}
      *   *Menu 3:* {`OPT_B`, `OPT_C`}
  *   **Constraint:** Partner B (Analyst) sees *only* the Option IDs (`OPT_A`, etc.) and the circled choices. They do not see the descriptions yet.
  *   **Swap:** At 15 mins, swap roles.
  *   **Note:** Ensure the descriptions for `OPT_A` differ slightly between Menu 1 and Menu 2 (see Materials), but the ID remains `OPT_A`.

  ### 0:25 – 0:40 | Phase 2: Reconstruction & Intensity (15 min)
  *   **Task:** Analysts must reconstruct the Chooser's "Utility Function."
  *   **Step 1 (Ordering):** Rank the options 1st, 2nd, 3rd based on the choices.
  *   **Step 2 (Intensity):** Assign "Utility Points" (0–100) to each option that are *consistent* with the choices.
      *   *Constraint:* If A was chosen over B, Utility(A) > Utility(B).
  *   **Comparison:** Pairs compare their reconstructed numbers.
      *   *Prompt:* "Did you assign the same numbers? If not, whose numbers are 'true'?"

  ### 0:40 – 0:55 | Phase 3: The Rule Follower (15 min)
  *   **Setup:** Select one pair. Give the **Chooser** a **Secret Instruction Card**.
      *   *Card Text:* "Do not choose what you want. Choose the option listed **lowest on the page**. If tied, choose the one with the higher ID letter."
  *   **Action:** The Chooser completes a new set of 3 Menus. The Analyst (who doesn't know the rule) records data and reconstructs the Utility Function.
  *   **Reveal:** The Chooser reveals the rule.

  ### 0:55 – 1:15 | Debrief & Conclusion (20 min)
  *   **Format:** Facilitated discussion. Do not lecture. Write their answers on the whiteboard.
  *   **Goal:** Map their experience to the three philosophical points.

  ---

  ## 3. Debrief Questions (Mapping Experience to Theory)

  **Point 1: Underdetermination & Intensity (Use Phase 2 Data)**
  *   *Q:* "Look at the Utility Points you assigned. Did you and your partner agree on the *ranking*? Did you agree on the *numbers*?"
  *   *Q:* "If I told you your partner was facing a risk (50% chance of losing the perk), would your assigned numbers change their decision? Does the choice data tell us how they handle risk?"
  *   *Takeaway:* Choice data fixes the *order*, but the *intensity* (curvature of utility) is pure stipulation. Without intensity, we cannot model risk or trade-offs.

  **Point 2: Identity of Options (Use Phase 1 Materials)**
  *   *Q:* "Analysts, look at `OPT_A`. In Menu 1, you saw a choice. In Menu 2, you saw a choice. Did you treat `OPT_A` as the same object both times?"
  *   *Reveal:* Show the Chooser's booklet. `OPT_A` had different conditions ("if work done").
  *   *Q:* "The data looked inconsistent (or consistent) only because *you* decided `OPT_A` was the same variable. Who did the work there: the data, or your definition?"
  *   *Takeaway:* RPT requires the analyst to stipulate option identity. The data cannot tell you if the context changed the good.

  **Point 3: Consistency $\neq$ Desire (Use Phase 3)**
  *   *Q:* "To the Analyst in the Rule Follower pair: Did the data look rational? Could you fit a utility function to it?" (Answer: Yes, perfectly).
  *   *Q:* "Now that you know the rule: Does this person *want* the bottom option? Or are they executing a script?"
  *   *Q:* "If our users are bots, or if they are habituated to click the first result (position bias), does RPT tell us what they want?"
  *   *Takeaway:* Stable choices can emerge from rules, habits, or constraints without any underlying 'desire'.

  ---

  ## 4. The Sharp Conclusion (5 mins embedded in Debrief)

  Do not end on "RPT is hard." End on "What are we building?"

  **Ask the room:**
  "We just reconstructed utility functions. Be honest: Did you **discover** something about your partner's mind, or did you just **compress** their click logs into a mathematical format?"

  **Force the distinction:**
  *   If it was a **discovery**, what evidence would have proven you wrong? (e.g., If they said 'I hate coffee' but clicked it).
  *   If it was a **compression**, then the utility function is just a summary of the past. It has no authority over the future.

  **Final Statement:**
  "Revealed Preference treats the utility function as a *tool for prediction*, not a *map of the soul*. If you are building a recommender to maximize clicks, RPT is sufficient. If you are building a system to maximize user *welfare*, RPT is blind. You cannot optimize for 'want' if 'want' is defined solely as 'click'."

  ---

  ## 5. Honest Account: What Will Go Wrong

  1.  **The "Gaming" Problem:** Engineers are contrarians. In Phase 1, a Chooser might try to create intransitive loops intentionally ($A>B, B>C, C>A$) to break the Analyst.
      *   *Mitigation:* Explicitly state: "Choose honestly. If you break transitivity, we can't reconstruct utility, and the exercise fails."
  2.  **The "Identity" Blind Spot:** Analysts might not notice the `OPT_A` description change. They might assume it's the same option because the ID is the same.
      *   *Mitigation:* This is actually good. It proves the point *for* you. In the debrief, highlight that they *trusted the ID* over the reality. That trust is the analyst's stipulation.
  3.  **Time Creep:** Phase 2 (assigning numbers) can drag on as they debate the "right" numbers.
      *   *Mitigation:* Enforce a hard stop. "Assign numbers in 2 minutes. There are no right numbers."
  4.  **The "So What?" Reaction:** A senior engineer might say, "We don't care about 'true wants', we care about CTR. This is philosophy, not engineering."
      *   *Mitigation:* Acknowledge this. "If your KPI is CTR, you win. If your KPI is 'User Satisfaction' or 'Retention over 1 year', you need to know if that click was a mistake, a habit, or a desire. RPT can't tell you."

  ---

  ## 6. Meta-Note: Commitments of This Design

  **Where this design begs the question:**
  This seminar is designed to make Revealed Preference look *weak* by contrasting it with a psychological realist view (that "true wants" exist internally).
  *   **The Bias:** A hardline RPT theorist (like Paul Samuelson) would argue that asking "What do they *really* want?" is meaningless nonsense. There is nothing *but* the choice.
  *   **The Presupposition:** My design assumes you (the engineers) believe there is a difference between a "click" and a "want." I am stacking the deck to validate your intuition that data is incomplete.

  **Which version of the view it makes look stronger:**
  It makes the **Psychological/Ordinalist** view look stronger (that utility is a latent variable we are trying to estimate). It makes the **Behaviorist** view (utility *is* the choice) look circular.

  **What would change my mind (and scrap this plan):**
  If, during the prep, you realize your team is entirely **Instrumentalist**.
  *   *The Sign:* If in previous seminars, the group consistently rejects "truth" claims in favor of "predictive power" (e.g., "It doesn't matter if the model is true, only if it minimizes loss on the test set").
  *   *The Pivot:* If your team is hard-core Instrumentalists, this seminar will feel like a waste of time. They will say, "The utility function is just a latent embedding. Of course it's a compression. That's what embeddings do."
  *   *Alternative:* If they are Instrumentalists, do not run this. Run a session on **Goodhart's Law** instead. Focus on how optimizing for the proxy (clicks) breaks the target (satisfaction). That is the engineering translation of this philosophical problem, and it will land harder with a pragmatic group.

  **Final Check:**
  If you run this, you must be willing to sit in the discomfort of the conclusion. Do not resolve the tension. Let them leave arguing about whether the utility function they wrote down was a discovery or a fiction. That argument *is* the learning.
