  ### Part 4: Epistemic Markers & Instrument Limitations

  **Contestation Levels:**
  *   **High Contestation (Red):** N3 (Gross Presence), N4 (Attitudes). These are the primary battle lines in philosophy of mind.
  *   **Medium Contestation (Amber):** N1 (Distraction), N5 (Choice). Empirical psychology weighs in here (e.g., Nisbett & Wilson), but interpretation varies.
  *   **Low Contestation (Green):** N8 (Subpersonal). Almost universal agreement we cannot introspect neurons.

  **Instrument Limitations (Where the Detector Metaphor Breaks):**

  1.  **Node 5 (Choice) vs. Node 3 (Attitudes):** The **Inner Sense** and **Self-Interpretation** leaves are difficult to separate here. Inner Sense says "The cause exists but the sensor is noisy." Self-Interpretation says "The cause exists but the sensor isn't looking at it; it's looking at behavior." To the subject, the *report* feels the same. **Flag:** This node discriminates theories, not necessarily experiences.
  2.  **Node 1 (Distraction) vs. Node 3 (Gross Presence):** The **Global Pessimist** and **Self-Interpretation** positions often converge here. If pain disappears during distraction, the Pessimist says "It wasn't real." The Interpretationist says "The report was inferred from attention." **Flag:** These positions cannot be separated by this question alone; you need N3 to distinguish them.
  3.  **The "Unnamed" Leaf:** The vector assigned to Leaf 8 (Pain Fallible + Attitudes Transparent + Causal Access) is marked "Incoherent." In physics, this would be a sensor that fails on voltage but succeeds on current. In mind, it is rare to doubt the *feeling* while trusting the *explanation*. If a group member lands here, check for misunderstanding of terms.

  **Final Calibration Note:**
  You asked for a tree. I have given you a matrix. A tree implies that answering N1 determines whether you *need* to answer N4. In this logical space, you do. A Pessimist (N3=Y) and an Incorrigibilist (N3=N) will answer N4 differently, but not because N1 forced them to. They answer N4 based on their core commitment. Use this instrument not to *prove* a position, but to **map the group's divergence**. If Member A and Member B agree on N1-N5 but diverge on Leaf assignment, your disagreement is not empirical; it is conceptual. That is where the philosophy begins.
