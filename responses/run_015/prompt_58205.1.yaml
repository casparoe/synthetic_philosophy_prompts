      *   *Counter:* I need to argue that the *conditions* of the Saturday judgment make it epistemically or normatively inferior. The "Hot/Cold Empathy Gap." The Sunday judgment is more *informed* about her true values because it isn't distorted by visceral proximity.
      *   *Key Concept:* **Sophisticated vs. Naive Hyperbolic Discounting.** Lena is sophisticated (she knows she'll cave). The friend argues she shouldn't be.
      *   *Key Concept:* **Resolute Choice.** (McClennen). Rationality allows sticking to a plan even if local utility says deviate.
      *   *Synthesis:* I will argue for a **Dual-Process/Diachronic** account. Premise 2 is the weak link. Preference reveals *desire*, not *best judgment*. Best judgment requires reflective distance.

  7.  **Final Polish:**
      *   Ensure tone is professional, philosophical, yet accessible.
      *   Check that all parts of the prompt are answered (Brainstorm, Best Diagnosis, Premise to Give Up, Costs).
      *   Make sure the "Honest Accounting" is truly honest about the theoretical baggage (e.g., paternalism towards oneself).

  8.  *(Final check of the Friend's Argument)*: The friend's argument relies heavily on the economic definition of rationality (consistency of revealed preference). To defeat it, I must import philosophical norms of rationality (consistency of plans/values over time).

      *   *Plan:*
          1.  Intro: Validate the puzzle (Aristotle vs. Hume/Econ).
          2.  Brainstorm 4 paths.
          3.  Select Path: Reject Premise 2 (Judgment = Preference).
          4.  Detail: Distinguish Evaluative Judgment from Motivational Strength. Introduce "Reflective Endorsement."
          5.  Costs: Psychological complexity, normative paternalism.
          6.  Conclusion: Lena is akratic; the bet is rational.

      *(Self-Correction)*: I should also mention Premise 1 slightly. If Judgment $\neq$ Preference, then Premise 1 (Akrasia = acting against judgment) holds, but Premise 4 (Her judgment *is* to watch) fails. So the main target is Premise 2.

