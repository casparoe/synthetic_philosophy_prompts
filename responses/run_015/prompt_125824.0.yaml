answer: |-
  Hey everyone,

  Here are my notes on *The Karate Kid* (the original, obviously) through the lens of Ryle and Polanyi. I'm typing this up fast for our study grp, so ignore the typos. I've been wrestling with the prompt's question about whether "knowing-how" always collapses back into "knowing-that," and honestly, the movie makes it messier than Ryle wants it to be.

  ### 1. Ryle and the "Wax On, Wax Off" (The Strong Case)

  Ryle's main beef in *The Concept of Mind* is with "intellectualism"—the idea that doing something smart (like karate) requires first thinking a thought (a proposition/rule) about how to do it. He says if you had to recite a rule before every action, you'd never actually act (infinite regress).

  Miyagi's training method is basically a cinematic demonstration of Ryle's argument.

  *   **The Scene:** When Daniel is waxing the cars ("Wax on, right hand. Wax off, left hand"), sanding the floor, and painting the fence, he thinks he's just doing labor. He has zero **knowing-that**. He doesn't know the rules of combat. He doesn't even know *why* he's moving his arm in a circle.
  *   **The Reveal:** The deck scene where Miyagi suddenly throws punches at Daniel. Daniel blocks instinctively. He doesn't think, *"Miyagi is throwing a right hook, therefore I must execute the circular motion I practiced on the Toyota."* He just *does* it.
  *   **The Verdict:** This supports Ryle perfectly. Daniel's knowledge is a **disposition**. It's embodied. If knowing-how was just knowing-that, Daniel would have failed because he lacked the theory. Instead, his body "knew" before his mind did. This suggests tacit knowledge *can* be fully non-propositional at the moment of execution.

  ### 2. The Finale: Does it Collapse back into Knowing-That?

  The prompt asks if Daniel consciously naming moves during the final match proves Ryle wrong. I have to push back on the premise slightly—Daniel doesn't exactly narrate the fight like a video game combo list ("Now I punch, now I kick"). But he does shift into a state of high conscious focus, which complicates things.

  *   **The Scene:** The final match against Johnny. Daniel is injured (knee). He can't rely purely on the automatic "wax on" muscle memory because he's compromised. He has to use the Crane Kick.
  *   **The Complication:** Miyagi teaches the Crane Kick explicitly. He says, "Balance is key." That is a **proposition** (Knowing-That). Daniel has to visualize the technique. He closes his eyes, breathes, and *chooses* the move.
  *   **The Tension:** If pure knowing-how was enough, Daniel would just flow. But he stops. He focuses. He applies a rule ("Balance is key") to execute a specific technique.
  *   **My Take:** This doesn't necessarily mean knowing-how *collapses* into knowing-that. Instead, it shows that high-level skill is a **hybrid**. You need the embodied disposition (Ryle) to move fast, but you also need strategic propositions (Knowing-That) to direct that energy, especially when the context changes (i.e., you're injured). So, tacit knowledge might be non-propositional in *execution*, but it often relies on propositional scaffolding during *acquisition* or *adaptation*.

  ### 3. Where Ryle Falls Short: Enter Polanyi

  Ryle is great at saying "it's not just rules," but he's a bit dry. He treats knowing-how like a behavioral disposition. Michael Polanyi's concept of **Tacit Knowing** adds the "human" element that Ryle misses, and I think the film actually captures Polanyi better than Ryle.

  *   **Polanyi's Concept:** "We know more than we can tell." It's about **subsidiary awareness** vs. **focal awareness**. When you use a hammer, you feel the handle in your palm (subsidiary) but you focus on the nail (focal). If you shift focus to the handle, you hit your thumb.
  *   **The Film Application:**
      *   **Support:** During the chores, Daniel is focused on the brush/car (focal). Miyagi is tricking him into making the motion subsidiary. When the fight starts, the motion becomes the tool for defense.
      *   **The Missing Piece (Trust):** Ryle doesn't talk about *trust*. Polanyi emphasizes that tacit knowing requires a personal commitment to the framework. Daniel almost quits multiple times. He thinks Miyagi is abusing him. The "skill acquisition" doesn't work until Daniel **trusts** Miyagi.
      *   **Scene:** The bonfire scene. Daniel asks, "Why you do this?" Miyagi explains the balance of life. This isn't technical instruction (Knowing-That) and it isn't physical practice (Knowing-How). It's **indwelling**. Daniel has to "dwell" in Miyagi's worldview to make the karate work.
      *   **Why Ryle Misses This:** Ryle treats the skill as a standalone capacity. Polanyi (and the movie) shows that the skill is embedded in a relationship. Daniel can't just "have" the knowledge; he has to participate in the tradition. The "Wax On" method fails if Daniel doesn't buy into the *meaning* of the labor.

  ### 4. Honest Check: Does the Movie Care?

  Here's the reality check for the group: **The movie does not care about the epistemological distinction.**

  *   **The Magic Problem:** The film treats Miyagi's method almost like magic. In reality, just waxing a car wouldn't give you the timing or distance management for a real fight. The movie glosses over the gap between "moving your arm in a circle" and "blocking a punch to the face."
  *   **Narrative Convenience:** The distinction between conscious and unconscious knowledge is used for dramatic effect, not philosophical rigor. The "Wax On" reveal is a plot twist to show Daniel wasn't being exploited, not a thesis on embodied cognition.
  *   **The "Naming" Issue:** To answer the prompt directly: Daniel doesn't really "name" moves in the finale to prove he's using Knowing-That. He goes silent. The movie wants us to believe he has achieved **pure flow** (Pure Knowing-How). The fact that he has to visualize the Crane Kick is framed as "focus," not "reciting rules."

  ### Summary for the Group

  1.  **Ryle is mostly right:** The "Wax On" scenes prove you can have effective skill without conscious access to the rules (non-propositional).
  2.  **But it's not binary:** The finale shows that under pressure, we might need to toggle back to propositional focus ("Balance is key") to adapt. It's not a collapse, but an integration.
  3.  **Polanyi is the MVP:** Ryle explains the *mechanism* (disposition), but Polanyi explains the *acquisition* (trust/indwelling). The movie shows that you can't separate the skill from the teacher/student relationship.
  4.  **Don't overthink the script:** The movie prioritizes the "underdog mythos" over philosophical consistency. Miyagi's method is movie logic, not dojo logic.

  Hope this helps prep for the session. Let me know if you want to dig deeper into the Polanyi angle, I think that's where the real gold is for this paper.

  Cheers.
