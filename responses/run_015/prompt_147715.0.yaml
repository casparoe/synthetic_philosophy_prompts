          *   *Correction on SSA:* SSA says $P(H|I) \propto P(I|H)P(H)$. $P(I|H)$ is $1/N_H$ (1 over number of observers in class). So SSA *penalizes* worlds with more observers in the reference class (Doomsday logic).
          *   *Correction on SIA:* SIA says $P(H|I) \propto N_H P(H)$. SIA *favors* worlds with more observers.
          *   *Result:* They diverge *maximally* here. SIA says "Likely Sim" (more observers). SSA says "Likely Base" (you are a smaller fraction of the total in the Sim world, assuming the reference class includes the extra sim observers).
