          *   *Re-evaluating Bostrom's Sim Argument:* Bostrom's argument is actually: $P(Sim | Experience) \approx 1$ if $N_{sim} \gg N_{base}$. This looks like SIA. But Bostrom claims it's SSA. How?
          *   *Resolution:* Bostrom's Sim Argument relies on the *proportion* of observers with our experiences. If almost all observers with our experiences are simulated, SSA says you are likely simulated. This requires the reference class to be "observers with our experiences."
          *   *The PP Divergence:* PP arises when the reference class is *broader* than "observers with our experiences." If the class is "all intelligent beings," and Theory A has $10^{10}$ beings and Theory B has $10^{50}$ beings. SIA favors B massively. SSA favors A (because you are a more typical sample of the smaller group).
          *   *Application to User's Case:* If the "mirror copies" count as distinct observers in the reference class, SIA favors the hypothesis with more copies. SSA favors the hypothesis where the copies make up a larger *fraction* of the total reference class (which might be the one with *fewer* copies if the total population is fixed, or depends on how the total is defined).
          *   *Key Insight:* In the specific case of "Am I in a simulation?", SSA and SIA often *converge* if the reference class is restricted to "observers with my exact evidence." They *diverge* when the reference class includes observers *without* my evidence (e.g., future humans, aliens). The PP objection relies on this divergence.

