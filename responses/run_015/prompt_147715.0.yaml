      *   *The "Mirror" twist:* If copies share an indexical, does that change the count? SIA counts observer-moments. SSA samples from the class. If the copies are qualitatively identical, SIA counts them as $N$. SSA asks "What is the chance I am one of these?"
      *   *Okay, I need to be precise:* The divergence is sharpest when hypotheses differ in total population size *outside* the immediate evidence set. I will clarify this distinction.

