      *   **The Mechanism:** Recursive Reward Modeling (RRM) / Training debaters to win the judge's approval.
      *   **The Consequence:** Stronger debaters will optimize for the judge's biases/blind spots rather than truth (Reward Hacking).
      *   **The Conclusion/Question:** Is Debate just elaborate reward hacking? Should we abandon it for Direct Mechanistic Interpretability?

