          *   *Cross-Examination:* The opposing debater is motivated to find flaws. This is the key differentiator from a single model lying to a human.
          *   *Decomposition:* Debates break complex claims into simpler claims the judge *can* verify.
          *   *Training Dynamics:* The hope is that "honest strategies" are more robust/stable than "deceptive strategies" over time.
      *   **The Limits:** Acknowledge where Debate likely fails (e.g., if the lie is fundamentally undetectable to the human, even with help).
