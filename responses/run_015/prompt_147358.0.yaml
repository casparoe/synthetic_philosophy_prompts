      *   *Unsayable:* "The car is broken but it drives perfectly and always will." (In shop terms, that's "Operating as Designed").

  8.  **Refining the Tone:**
      *   Needs to sound like a senior tech talking to another senior tech. Respectful, direct, no fluff.
      *   Avoid words like "ontology," "epistemology," "metaphysics." Use "fault," "diagnosis," "spec."

  9.  **Final Review against Constraints:**
      *   Did I use the vocab? Yes (DTC, freeze frame, etc.).
