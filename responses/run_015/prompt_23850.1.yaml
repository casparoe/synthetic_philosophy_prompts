answer: |-
  The air bit at their collars as they turned off Mercer Street. It was March, 1949, and Princeton held the chill of winter in its bricks. Einstein walked with his usual slouch, hands deep in the pockets of his rumpled coat. Gödel walked beside him, upright, rigid, clutching a thin sheaf of papers wrapped in brown string.

  They had walked this path a hundred times, from the Institute to Einstein's home, measuring the distance in silence and scattered German phrases. Tonight, Gödel stopped near the lamppost. The light hummed, casting long, wavering shadows against the pavement.

  "For you," Gödel said. He held out the papers. "A birthday present."

  Einstein took them, smiling wearily. "Equations? I promised myself no work tonight, Kurt."

  "It is finished work. Or perhaps, begun." Gödel's voice was flat, devoid of ceremony. "It is a solution to your field equations. A cosmological model."

  Einstein untied the string. He glanced at the tensors, the metrics shifting across the page like dark water. He recognized the geometry, but it twisted in ways he hadn't anticipated. "It looks... dense."

  "It is a rotating universe," Gödel said. He looked at the street, not at Einstein. "In this model, the matter of the universe rotates. Relative to the inertial frame."

  Einstein nodded slowly, tracing a line of indices. "Rotation implies centrifugal force. I know this."

  "It implies more." Gödel stepped closer, his breath pluming in the cold. "In this universe, the light cones tip. They tip over so far that the future points back to the past. There are closed timelike curves."

  Einstein paused. His thumb rested on the paper. "You mean one could fly a rocket and return before one left?"

  "Mathematically, yes."

  "And the paradoxes?" Einstein asked, a flicker of amusement returning. "Killing one's grandfather?"

  "No." Gödel shook his head sharply. "That is storywriting. This is ontology. The point is not the travel. The point is the *now*."

  Einstein looked up. "The simultaneity?"

  "In this universe, there is no objective lapse of time. No universal 'now' that moves forward. Because if there were, the curves would be impossible. The structure forbids it." Gödel's eyes were dark, unblinking. "But consider, Albert. Whether time flows objectively or not depends here on a contingent fact. It depends on how the matter is distributed. Whether it spins."

  Einstein frowned, pulling his coat tighter. "But our universe does not rotate. We see the redshift. We see expansion."

  "That is accidental," Gödel said. "It is a fact of matter, not a fact of logic. If the nature of time depends on the contingent arrangement of matter, then time is not fundamental. It is not absolute."

  He gestured to the street, to the falling leaf, to the watch on Einstein's wrist.

  "If time does not objectively pass in the rotating solution, and the only difference between that solution and this one is the spin of the dust... then time does not objectively pass here, either."

  Einstein stood very still. The hum of the lamppost seemed to grow louder. The logic was a cold blade, slipping between the ribs of the world. He had spent his life making time relative to the observer, but he had never killed the flow itself. He had kept the river, even if he changed its speed. Gödel was saying the riverbed was dry.

  "So," Einstein said softly. "The passage of time. It is an illusion?"

  "A persistent one," Gödel said. "But an illusion. Created by the mind. Not by the world."

  Einstein looked down at the papers in his hand. The equations stared back, silent and immutable. They described a world where past and future were coordinates, not destinations. If Gödel was right, the chill in the air, the aging of his hands, the memory of Zurich—it was all a static block, a landscape they merely walked through, believing they moved.

  Einstein folded the papers slowly. He did not put them in his pocket. He held them against the cold.

  "It is a heavy gift, Kurt," he said.

  "It is the truth," Gödel replied. He turned back toward the path home. "Shall we continue?"

  Einstein looked at the dark street ahead. It looked exactly as it had a moment before. The shadows were in the same place. The leaf hung in the air for an instant, or perhaps it had always been there. He took a step, then another, following the logician into the dark, unsure if he was moving forward, or simply arriving.
