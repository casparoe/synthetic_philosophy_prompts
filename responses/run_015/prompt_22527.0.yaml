  **MEMORANDUM**

  **TO:** Forecasting Committee & Board of Directors
  **FROM:** [Your Name], Forecasting Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Probability Estimation Methodology for Logistics Platform Launch

  ### Executive Summary

  The Committee is tasked with assigning a probability estimate to the Q4 launch of the new logistics platform. This estimate will directly inform capital allocation decisions for the upcoming fiscal year. After reviewing three proposed methodologies—Industry Base Rates, Internal Track Record, and Subjective Expert Judgment—we recommend anchoring our estimate on the **Internal Track Record (75%)**, adjusted slightly downward to **70%** to account for specific project novelty.

  This approach utilizes Reference Class Forecasting (RCF) principles, prioritizing causal relevance over raw sample size. It balances the statistical noise of our internal data against the systemic bias inherent in subjective judgment, providing a defensible figure that reflects our specific organizational capabilities without succumbing to optimism bias.

  ### Context and Options

  The Committee evaluated three distinct reference classes to anchor our probability estimate:

  1.  **Industry Base Rate:** 55% success rate for projects of similar size (Sample: $N \approx 300$).
  2.  **Internal Track Record:** 75% success rate for similar platforms (Sample: 6 of 8).
  3.  **Subjective Judgment (Inside View):** 85% estimated probability based on Project Manager (PM) assessment of current status and blockers.

  ### Analysis of Methodologies

  #### 1. Rejection of Industry Base Rate (55%)
  **The Argument:** Proponents argue that a sample size of several hundred projects offers statistical stability that our internal data cannot match. Weighting by sample size suggests this class should dominate the calculation.
  **The Decision:** We reject this as the primary anchor. In forecasting, **relevance supersedes sample size.** A large sample of irrelevant data introduces less error than a small sample of highly relevant data. The industry rate aggregates companies with differing technical debts, cultures, and incentive structures. Using this rate implicitly assumes our organization is "average" relative to the market. Given our historical outperformance in deployment velocity, adopting the industry rate would ignore our competitive advantage, leading to under-allocation of capital.
  **Addressing the Sample Size Weighting:** A colleague suggested weighting classes by $N$. This is statistically incoherent in this context. If the broader class (Industry) has low predictive validity for *our* specific outcome, increasing its weight amplifies noise rather than signal. We prioritize variance explained over variance minimized.

  #### 2. Rejection of Pure Subjective Judgment (85%)
  **The Argument:** The Project Manager argues that this platform is novel and that her granular knowledge of the critical path renders historical data less useful. She posits that the unique attributes of this build justify an 85% confidence level.
  **The Decision:** While we value the PM's granular insight, we cannot adopt this figure as the standalone estimate. This is a classic "Inside View" problem. Extensive literature on the Planning Fallacy (Kahneman & Tversky) demonstrates that even sharp, experienced experts systematically underestimate risks and overestimate control when evaluating their own projects.
  **Strongest Case for the Rejected Approach:** We acknowledge the PM's position is not merely optimism; it contains **case-specific signal** that base rates miss. She knows about a specific API integration breakthrough that historical data cannot capture. Discarding this entirely throws away valuable information. However, using her judgment as the *anchor* rather than an *adjustment* exposes the Board to unquantified optimism bias. If we allocate capital based on 85% and fail, we cannot distinguish between bad luck and bad forecasting. Base rates provide the necessary accountability structure.

  #### 3. Recommendation: Internal Track Record (Adjusted)
  **The Argument:** Our internal history of 6 successful launches out of 8 similar attempts (75%) represents the highest-fidelity signal available. It captures our specific engineering culture, testing protocols, and decision-making velocity.
  **The Decision:** We recommend anchoring on the **75% Internal Rate**.
  *   **Why:** It strikes the optimal balance between relevance and statistical stability. It acknowledges that we are not the "average" industry player (rejecting the 55%) but subjects our confidence to the discipline of our own history (rejecting the 85%).
  *   **The Adjustment:** We recommend a conservative adjustment from 75% to **70%**. While the internal rate is 75%, the PM's assertion of "novelty" is valid. This specific project involves a stack migration not present in the previous 8. A 5% discount accounts for this untested variable without abandoning the empirical track record.

  ### Defensibility and Risk Management

  Adopting the Internal Track Record with a novelty discount allows the Board to proceed with the following logic:

  1.  **Capital Efficiency:** We are not under-investing based on a pessimistic industry average that doesn't reflect our capabilities.
  2.  **Bias Mitigation:** We are not over-investing based on the Planning Fallacy, which protects the PM from the reputational risk of missing an over-promised target.
  3.  **Auditability:** If the project fails, we can audit *why* we diverged from our internal track record. If we had used the PM's subjective 85%, failure would be indistinguishable from forecasting error.

  ### Conclusion

  The Committee recommends reporting a **70% probability** of year-end launch to the Board. This figure is derived from our Internal Track Reference Class, discounted for specific technical novelty. This methodology ensures our capital allocation is driven by demonstrated organizational capability rather than market averages or unverified optimism.

  ***

  **Approved by:**
  Forecasting Committee
