      *   **Problem:** Current guidance (principal-agent model) is too narrow (misses clientelism) and too rigid (ignores local social norms/relationship building).
      *   **Task:**
          1.  **Classification:** Define four phenomena (bribe, clientelism, gift/hospitality, coercive extraction) and explain operational implications (refuse, redesign, tolerate, etc.). Distinguish from elite capture/bad design/predatory state.
          2.  **Procedure:** Build a decision tree/flowchart based on 5 proposed tests (Refusal, Convertibility, Avowal, Recurrence, Second-best trap). Order, keep, discard, repair, add. Address cultural loading (especially Avowal). Add a "standing" check. Must be usable in 20 mins, fit on one side A4, specify stop points and referral points.
          3.  **Case Studies:** Run the procedure on three specific cases (MP funeral fund, Customs broker/vaccines, Sitting allowances/gifts). Must handle the tension in Case 3 (sector-wide practice vs. policy).
          4.  **Deliverables:** One-page version for staff + Note to Head of Integrity on what was lost/simplified.
          5.  **Limitations:** Plain statement on what the procedure *cannot* do (unanswered questions, reliance on judgement).
      *   **Constraints:** No citations/named authorities. Brief classification. Practical tone.

  2.  **Deconstruct & Draft - Section by Section:**

      *   **Section 1: Classification:**
          *   Need to distinguish: Bribe (private gain for specific act), Clientelism (loyalty/support for resources), Gift/Hospitality (relationship maintenance, no specific quid pro quo), Coercive Extraction (demand under threat).
          *   *Why it matters:* Different responses. Bribe = Refuse/Report. Clientelism = Redesign/Refer. Gift = Tolerate/Log. Coercion = Escalate/Protect.
          *   *Exclusions:* Must distinguish from "elite capture" (structural), "bad design" (inefficiency), "predatory state" (context). If everything is corruption, nothing is.

      *   **Section 2: The Procedure (The Core):**
          *   *Input:* The 5 proposed tests.
          *   *Critique & Ordering:*
              1.  *Coercion/Safety First:* Before ethics, check safety. (Added test).
              2.  *Refusal Test:* Can they say no? (Good, but needs nuance on *who* bears cost).
              3.  *Convertibility:* Cash vs. Social value. (Keep, helps distinguish bribe from gift).
              4.  *Recurrence:* One-off vs. Systemic. (Keep, helps distinguish gift from toll).
              5.  *Avowal:* Publicity test. (Problematic culturally). *Repair:* Change "Public" to "Relevant Community" (Donor vs. Village).
              6.  *Second-Best Trap:* Harm to beneficiaries. (Crucial for development context).
              7.  *Standing Check:* Who defines the norm? (Added as requested).
          *   *Flow:* Safety -> Definition (Is it a transfer?) -> Standing -> Tests -> Decision.
          *   *Format:* Needs to be logical for a flowchart/text representation.

      *   **Section 3: Case Studies:**
          *   *Case 1 (MP Funeral Fund):* Clientelism. Contractors paying = Bribe/Clientelism hybrid. Verdict: Redesign/Refer.
          *   *Case 2 (Customs/Vaccines):* Coercive Extraction/Facilitation Payment. High stakes (cold chain). Verdict: Pay (if safety allows) but Log/Escalate. *Correction:* UK Bribery Act is strict on facilitation. Need to balance "Adequate Procedures" with "Beneficiary Harm". The procedure should flag this as a "Refer/Escape Clause" situation.
          *   *Case 3 (Sitting Allowances/Gifts):* Sector norm. Sitting allowances = Clientelism/Incentive. Gifts = Relationship. Verdict: Tolerate/Log but Redesign long-term. Acknowledge the hypocrisy risk.

      *   **Section 4: Deliverables:**
          *   One-pager (Staff facing).
          *   Note to HoI (What was simplified).
          *   Limitations (What this can't solve).

  3.  **Refining the Logic (Self-Correction during drafting):**

      *   *Constraint Check:* The user wants the classification *first*, then the procedure.
      *   *UK Bribery Act:* I must remember the "Failure to Prevent" offence. Facilitation payments are *not* a defence under the UK Act, unlike the US FCPA. This makes Case 2 tricky. The procedure can't authorize illegal acts, but it can authorize "protective payment" under duress with immediate reporting. I need to be precise here.
      *   *Case 3:* The user admits they can't stop this unilaterally. The procedure shouldn't say "Stop" if it's unrealistic. It should say "Log, Monitor, Plan Exit". This aligns with "Adequate Procedures" (showing you are managing the risk, even if not eliminating it immediately).
      *   *Avowal Test:* The user is right; "Would you put this in the newspaper?" fails in high-context cultures. Better: "Would the *intended beneficiaries* approve?" or "Would the *donor* approve?" Need to split the audience. Let's make it "Dual Avowal": Donor Audit vs. Local Dignity.
      *   *Standing:* Crucial. A junior staff member might call a Chief's gift a bribe. A Chief might call a donor rule an insult. Who decides? The procedure needs to weigh the source of the norm.

  4.  **Drafting the Content - Step-by-Step:**

      *   *Classification:* Keep it tight.
          *   Bribe: Quid pro quo, private gain.
