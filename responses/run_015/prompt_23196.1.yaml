      *   *Metaphysical Research Program:* It's not pseudoscience; it's a fruitful framework that guides inquiry. It becomes scientific when it generates specific, falsifiable models (e.g., about peppered moths, antibiotic resistance).
      *   *Key Criterion:* Falsifiability. A theory is scientific if it *could* be proven wrong by observation.
      *   *Nuance:* Popper later softened his view, acknowledging that Darwinism *can* be formulated testably, but he maintained the distinction between the general principle and specific applications.

  3.  **Analyze Development 1: The Neutral Theory (Kimura):**
      *   *What is it?* Most molecular variation is due to random drift, not selection. Selection is the exception, not the rule, at the molecular level.
      *   *Popper's Lens:*
