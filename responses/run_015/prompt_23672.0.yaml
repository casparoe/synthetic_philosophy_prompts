          *   Goal: Restore function to a species-typical level.
          *   Analogy: Glasses for nearsightedness. Without them, you can't see "normally." With them, you see "normally."
          *   Validity: High, from a clinical diagnostic standpoint.

      *   **The "Boosting" Argument (Enhancement Model):**
          *   Premise: Function is already within typical range.
          *   Goal: Exceed typical performance.
          *   Analogy: LASIK surgery for someone with 20/20 vision to get 20/15 vision. Or caffeine for a well-rested person.
          *   Validity: High, from a performance standpoint.

      *   **The "Arbitrary Line" Argument (User's Point):**
