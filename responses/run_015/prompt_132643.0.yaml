answer: |-
  **Rowan:** You're going to hate this. I was at the whiteboard late last night, and I think the single-function model collapses under mirroring.

  **Iris:** Define collapses.

  **Rowan:** Set utility equal to dollars. All the risk attitude lives in $r$. Take a standard risk-averse shape, so $r(p) < p$ for intermediate probabilities. Say $r(1/2) = 0.4$. Now look at a simple gamble: fifty percent chance of zero, fifty percent chance of one hundred.

  **Iris:** Expected value is fifty. With your function, the risk-weighted value is forty. So the agent prefers a sure fifty to the gamble. That's just risk aversion.

  **Rowan:** Right. Now mirror it. Lose one hundred or lose nothing, fifty-fifty. The outcomes are negative one hundred and zero. The increment is still one hundred. The decumulative probability at the top outcome is still one-half. So the weighted increment is still forty. But you start at negative one hundred. So the total value is negative sixty.

  **Iris:** And the sure loss is negative fifty.

  **Rowan:** Exactly. Negative fifty is better than negative sixty. So if you are risk-averse in the gains domain—preferring the sure fifty—you are logically forced to be risk-averse in the losses domain. You prefer the sure loss to the gamble.

  **Iris:** Which kills the reflection effect.

  **Rowan:** It kills it dead. People are risk-seeking in losses. They'll take the gamble to avoid the sure loss. But on this model, you can't have risk aversion in gains and risk-seeking in losses with a single risk function. The algebra forces symmetry. $REU(X) + REU(-X)$ ends up negative for any gamble if $r$ is strictly concave. I checked the sum three times.

  **Iris:** The algebra is fine, Rowan. I'm not worried about the arithmetic. I'm worried that you've just proven expected utility theory's point. If you want to model the reflection effect, you need curvature in the utility function, not just weighting on probabilities. You can have concave utility for gains and convex utility for losses. That's standard.

  **Rowan:** But that misses the normative point. The whole motivation for risk-weighting was to capture preferences like Allais violations that expected utility forbids, regardless of curvature. If I fix the mirroring problem by splitting the risk function—say, $r_+$ for everything above the status quo and $r_-$ for everything below—I can tune them independently. I can make $r_+$ concave for gains and $r_-$ convex for losses.

  **Iris:** Two functions. Okay. Now tell me what happens when a gamble straddles the reference point. Give me numbers.

  **Rowan:** Twenty-five percent chance of losing sixty, twenty-five percent of losing ten, fifty percent of gaining forty.

  **Iris:** So the outcomes are negative sixty, negative ten, and positive forty. No outcome sits at zero.

  **Rowan:** Right. You have an increment from negative ten up to positive forty. That's a fifty-dollar jump that crosses the reference point. Do I weight that whole increment with $r_+$ because it ends in gains? Do I use $r_-$ because it starts in losses? Or do I split the increment at zero?

  **Iris:** If you split it, you're weighting the slice from negative ten to zero with $r_-$ and the slice from zero to forty with $r_+$.

  **Rowan:** That feels natural. You treat the loss part as a loss and the gain part as a gain.

  **Iris:** And if you don't split it? If you just pick one curve?

  **Rowan:** Then the value of the gamble depends on arbitrary labeling. But if I do split it... look, I ran the numbers. If I split the increment at zero, the model becomes structurally identical to cumulative prospect theory with a linear value function.

  **Iris:** There it is.

  **Rowan:** What?

  **Iris:** You started out saying risk-weighted utility was a normative theory. A story about what rational agents are permitted to believe about risk. You said $r$ was a parameter of rationality, like a prior. Now you've got two parameters tied to a reference point, and you're splitting increments to match observed behavior. You haven't fixed the theory; you've just rebuilt a descriptive model of what people actually do.

  **Rowan:** That's a hit, I'll concede it. It does look like prospect theory. But Iris, expected utility still can't handle the Allais cases. Even with curved utility, EU violates independence if you have those preferences. My $r_+$ function handles that in the pure-gains domain. No amount of curvature in $u$ does what $r$ does there. So there's still normative work being done.

  **Iris:** In the pure-gains domain, sure. But the moment you introduce losses, you're leaning on the reference point to do the heavy lifting. And reference points are slippery. If the theory depends on where the agent sets the status quo, and the status quo is sensitive to framing, then rationality becomes sensitive to framing.

  **Rowan:** Not necessarily. Nothing in the permissibility argument required a single $r$. The mirroring result just shows that $r$'s real content is concern with the upper tail rather than risk aversion as ordinarily understood. If an agent cares differently about upper tails in gains versus losses, why shouldn't they have two functions?

  **Iris:** Because then you aren't explaining risk attitude anymore. You're explaining attitude toward frames. Look, suppose I offer you that straddle gamble again. Twenty-five percent minus sixty, twenty-five percent minus ten, fifty percent plus forty. Now suppose I describe it differently. I tell you that you already own a ticket worth forty dollars, but there's a chance you'll lose it. Suddenly the reference point shifts.

  **Rowan:** If the reference point shifts, the weighting changes. That's true for prospect theory too.

  **Iris:** But prospect theory admits it's descriptive. It says people *do* shift. You're claiming this is *rational*. If rationality hinges on whether you frame the forty as a gain or the retention of an asset, then rationality isn't stable. You've solved the mirroring problem by making the theory vulnerable to framing effects.

  **Rowan:** I think you're moving the goalposts. The question was whether we can model the reflection effect without abandoning the core insight of risk-weighting. I've shown we can, provided we allow the risk function to vary by domain.

  **Iris:** You've shown you can model it. I'm asking if you've explained it. If $r_+$ and $r_-$ are just free parameters we tweak to match the data, then the theory doesn't tell us why an agent *should* have those attitudes. It just says they can. But if they can have any attitude, including ones that flip based on how you describe the zero point, then the constraint on rationality is vanishingly thin.

  **Rowan:** It's not vanishingly thin. The structure still imposes coherence within each domain.

  **Iris:** Does it? Take the straddle gamble. If I split the increment at zero, I'm assuming the agent evaluates the journey from negative ten to forty as two separate journeys. But it's one event. The coin lands once. Why does the agent's rationality require them to mentally partition the outcome space at the status quo?

  **Rowan:** Because the status quo matters to them.

  **Iris:** But why? Is it because losses hurt more than gains please? That's utility curvature. Is it because they weight probabilities differently? That's your $r$. If you need both, and you need to split increments to make them fit, you've got a model that's flexible enough to fit anything. And a model that fits everything explains nothing.

  **Rowan:** So you'd rather stick with expected utility and tell the students that Allais preferences are irrational?

  **Iris:** I'd rather tell them that expected utility is a benchmark, and deviations need a cost. You're offering them a toolkit where they can pick a risk function off the shelf based on how they feel about losses versus gains. That's not rational choice. That's rationalization.

  **Rowan:** I think the students should decide. That's why I'm putting this on the handout.

  **Iris:** Fine. But make sure you include the framing worry. If rationality depends on where you draw the zero, then the theory isn't about risk. It's about accounting.

  **Rowan:** I'll write it up. But I'm keeping the straddle example. It's too good.

  **Iris:** Keep it. Just don't pretend the math solves the philosophy. The algebra works, Rowan. I'm not disputing the sum. I'm disputing what the sum is supposed to mean when you have to cut it in half to make it balance.

  **Rowan:** Maybe the sum isn't the point. Maybe the point is that we don't have a better story yet.

  **Iris:** Then say that. Don't say you've fixed risk-weighting. Say you've patched it.

  **Rowan:** Patched it enough to get through the seminar?

  **Iris:** Enough to get them arguing. Which is what you want, isn't it?

  **Rowan:** Yeah. That's the goal.

  **Iris:** Then leave the reference point undefined. Let them fight over where zero lives.

  **Rowan:** Done.
