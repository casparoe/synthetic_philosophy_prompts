answer: |-
  This is the exact right question to ask. In microbiology, you can get away with using "function" pragmatically because the lab context usually fixes the meaning. In philosophy, when you try to make that meaning universal, the cracks show up immediately.

  You have identified the central tension: **Normativity vs. Naturalism.**
  *   **Normativity:** Functions imply a standard of correctness (a heart *ought* to pump).
  *   **Naturalism:** We want to explain this without invoking magic or human intent, just physical facts.

  Here are the hard desiderata—the criteria any serious theory must meet to be useful to a scientist—followed by the contradiction you suspected.

  ### The Hard Desiderata (Non-Negotiables)

  These are the conditions a theory of function must satisfy to match scientific practice. If a theory fails these, it doesn't capture what biologists mean by "function."

  **1. The Malfunction Constraint**
  *   **The Demand:** A theory must explain how a trait can fail to perform its function without ceasing to have that function.
  *   **The Case:** A congenital heart defect. A heart that cannot pump blood is still a heart, and its function is still pumping blood. It is *broken*, not redefined.
  *   **Why it's hard:** If you define function purely as "what it is currently doing" (Causal Role), a broken heart has no function. If you define it as "what it was selected for" (Etiological), you can say it *should* pump, but you struggle to explain why a novel mutation that hasn't been selected yet isn't just "noise."

  **2. The Distinction Constraint (Function vs. Effect)**
  *   **The Demand:** A theory must distinguish between a trait's function and its mere side effects.
  *   **The Case:** The heart makes a "thump-thump" sound. This sound allows a doctor to diagnose health. The sound contributes to the medical system. But the sound is not the *function* of the heart.
  *   **Why it's hard:** In a purely causal network, everything contributes to everything. Why is pumping blood "the function" but making noise just "an effect"? A theory needs a filter to separate the signal from the noise without relying on human interest alone.

  **3. The Multiplicity Constraint (Pleiotropy)**
  *   **The Demand:** A theory must allow a single physical structure to have multiple, distinct functions simultaneously.
  *   **The Case:** Gene pleiotropy. A single enzyme might catalyze a reaction for metabolism (Function A) and also stabilize a structural protein (Function B).
  *   **Why it's hard:** Some rigid theories try to assign one "proper" function per trait. If a theory forces a hierarchy where only one counts as the "real" function, it fails biological reality.

  **4. The Ahistorical Constraint (Synthetic Biology)**
  *   **The Demand:** A theory must assign functions to entities that have no evolutionary history.
  *   **The Case:** A synthetic plasmid engineered yesterday in a lab. It has a promoter and a GFP gene. We say its function is to express fluorescence. But it has never been "selected" by nature. It has no past.
  *   **Why it's hard:** If function requires a history of selection (as Etiological accounts claim), this plasmid has no function, only causal powers. This contradicts the working language of synthetic biologists.

  ---

  ### The Camp Preferences (Negotiables)

  These are often presented as requirements, but they are actually philosophical biases. You can drop these without breaking the science.

  *   **Unification:** The idea that there must be *one* definition of function that covers hearts, enzymes, artifacts (screwdrivers), and synthetic genes. (It is entirely possible "function" is a homonym with different meanings in different contexts).
  *   **Objectivity:** The idea that functions exist independently of any observer. (It may be that functions are always relative to a system or an intent).
  *   **Reductionism:** The hope that function can be fully reduced to physics or selection coefficients without remainder.

  ---

  ### The Hidden Contradiction

  You asked if there is a subset of demands that is jointly unsatisfiable. **Yes.**

  You cannot simultaneously satisfy **The Malfunction Constraint** (grounded in strong normativity) and **The Ahistorical Constraint** (grounded in current structure) within a single, unified naturalistic framework without smuggling in human intent.

  Here is the logical collision:

  **1. To solve Malfunction, you need History (or Intent).**
  To say a heart is "broken" when it doesn't pump, you need a standard. In nature, that standard is **Selection History**. The heart is *supposed* to pump because ancestors that pumped survived. Without that history, "pumping" is just a physical motion, not a normative standard. A rock doesn't pump blood, but it isn't "broken." A heart that doesn't pump is broken. The difference is the history.

  **2. To solve Synthetic Organisms, you need Ahistoricity.**
  To say your engineered plasmid has a function, you cannot look to its past (it has none). You must look to its **Current Organization** or the **Designer's Intent**.
  *   If you rely on *Current Organization*: You struggle with Malfunction. If the plasmid mutates and stops glowing, did it lose its function, or did its function change to "not glowing"? Without history, "failure" is hard to define.
  *   If you rely on *Designer's Intent*: You have solved the synthetic case, but you have made function dependent on human minds. Now, a natural heart only has a function if a human assigns it one, or if you argue God/Nature is the designer (which is not naturalism).

  **3. The Unsatisfiable Triad**
  Consider these three claims. You can hold any two, but not all three:
  *   **A:** Functions are objective natural facts (not dependent on human intent).
  *   **B:** Functions imply normativity/malfunction (things can be broken).
  *   **C:** Ahistorical entities (synthetic life) have functions.

  *   **If you hold A & B (Etiological View):** You satisfy naturalism and malfunction. But you must deny **C**. You have to tell synthetic biologists, "Your plasmids don't have functions yet; they just have causal roles until they undergo selection."
  *   **If you hold A & C (Causal Role View):** You satisfy naturalism and synthetic life. But you must deny **B**. You lose the ability to define malfunction robustly. If the plasmid doesn't glow, it's just doing something else.
  *   **If you hold B & C (Design/Intent View):** You satisfy malfunction and synthetic life. But you must deny **A**. You admit that function is relative to the designer's intent. This works for the lab, but it makes natural biology tricky (who is the designer of the heart? Evolution? But evolution has no mind).

  ### The Verdict for a Microbiologist

  The contradiction arises because "Function" is doing two different jobs in your field.

  1.  **Evolutionary Function:** "Why is this trait here?" (Requires history, handles malfunction well, fails on synthetic novel traits).
  2.  **Engineering Function:** "What is this trait built to do?" (Requires intent/design, handles synthetic traits well, struggles to define malfunction without referencing the design spec).

  **The Hard Truth:**
  There is likely no single "Theory of Function" that satisfies all desiderata because biological reality splits into two ontological categories: **Evolved Systems** and **Designed Systems.**

  When you work with *E. coli* in the wild, you need an Etiological account (Selected Effects) to explain why a gene is there and what counts as a deleterious mutation.
  When you work with *E. coli* in a synthetic biology context, you are effectively treating the organism as an artifact. You are importing **Intent** to fill the gap left by the lack of **History**.

  If a philosopher demands a single theory that covers both without acknowledging this shift, they are asking for the impossible. The most honest answer is **Function Pluralism**: admit that "function" means "selected effect" in evolutionary contexts and "contributory role relative to a design" in synthetic contexts.

  The contradiction isn't in your reasoning; it's in the demand for a unified theory where there are actually two distinct concepts sharing a name.
