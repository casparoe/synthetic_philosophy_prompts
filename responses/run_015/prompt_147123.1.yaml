      *   *Ahistorical Applicability:* Must handle things without evolutionary history. (Motivation: Synthetic bacteria, prosthetic hearts).
      *   *Plurality/Pleiotropy:* Must handle one item having multiple functions. (Motivation: Genes doing two things).
