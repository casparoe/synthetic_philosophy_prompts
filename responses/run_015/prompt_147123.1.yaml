      *   The "Heart" example is classic: The heart pumps blood (causal role). But if it fails to pump, it's a *broken* heart, not a heart that isn't a heart. A rock doesn't pump blood, but it's not "broken." So, function implies a standard of correctness.
      *   The "Etiological" (Selected Effects) view: Function is what it was selected for. Solves normativity (malfunction is failing the selection criterion). Struggles with new traits or engineered traits.
      *   The "Causal Role" (Systemic) view: Function is what it contributes to the system. Solves new traits/engineered traits. Struggles with normativity (everything it does is a function, so malfunction is hard to define).

  3.  **Identify the Desiderata (The "Must-Haves"):**
      *   *Normativity/Malfunction:* Must distinguish between "doing X" and "supposed to do X." (Motivation: Congenital heart defect).
