      *   *The "Joint Unsatisfiability" Hypothesis:* Can we have a *single* unified theory that satisfies strong normativity (based on history) AND covers ahistorical entities (based on current organization) without splitting into two different concepts of "function"?

  5.  **Drafting the Response - Section by Section:**

