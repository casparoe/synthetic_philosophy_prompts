  ### 1. The Pushback: "Governing" is the Wrong Axis

  You asked for a tree about whether laws *govern*. I am going to build you a tree, but I need to warn you: **"Governing" is a metaphor, not a criterion.**

  If you ask a Humean, "Do laws govern?" they say "No." If you ask a Primitivist, they say "Yes." But if you ask them, "If the history of the universe were exactly the same, could the laws have been different?" you hit the real metal. The Humean says "No" (laws supervene on events). The Primitivist says "Yes" (laws are additional structure).

  Your intuition about "governing" is actually a combination of two distinct philosophical commitments:
  1.  **Non-Supervenience:** Laws are something *over and above* the pattern of events.
  2.  **Modal Strength:** Laws support counterfactuals and necessities that accidents do not.

  I have built the tree below using your cases, but I have routed them according to **Supervenience** and **Modal Strength**. If you phrase the nodes as "Do laws govern?", your students will just guess the answer you want. If you phrase them as "In Case X, is Y true?", they have to think about the physics.

  ### 2. The Logical Space Map

  Before the tree, here is the map of the territory. We are sorting positions based on two binary choices (plus a third for anti-realism).

  | | **Laws Supervene on History** (Humean Base) | **Laws Do Not Supervene** (Non-Humean Base) |
  | :--- | :--- | :--- |
  | **High Modal Strength** (Supports counterfactuals robustly) | **Lange-style** (Stability) <br> *(Unstable Cell)* | **Primitivist** (Maudlin) <br> **Armstrong** (Universals) <br> **Dispositional** (Essences) |
  | **Low Modal Strength** (Just summaries) | **Humean** (Lewis/Ramsey) | **[EMPTY CELL 1]** |
  | **Anti-Realist** (No fundamental laws) | **Cartwright** (Machines) <br> **Nihilist** | **[EMPTY CELL 2]** |

  **The Empty Cells (and why nobody lives there):**
  1.  **Non-Supervenient + Low Modal Strength:** This posits extra ontological structure (so it's not Humean) that *doesn't* do any modal work (doesn't support counterfactuals or necessitate events). **Why it's empty:** It's epiphenomenal. If the law doesn't constrain what happens and doesn't summarize what happened, why believe it exists? It collapses into Nihilism.
  2.  **Non-Supervenient + Anti-Realist:** You can't say "There is extra structure beyond the events" and also "There are no laws." That's a contradiction. (Though one could be a Fictionalist about Non-Humean laws, this is rarely occupied).
  3.  **Supervenient + Governing:** (Not in table, but crucial). If laws are *just* the summary of events, they cannot *make* the events happen. That would be circular. **Why it's empty:** Incoherent.

  ### 3. The Decision Tree

  **Starting Commitment:** "Accidentally true generalizations (like 'all gold spheres are <1 mile') and Laws of Nature are not distinguished just by how many instances they have."

  **Node 1: The Twin Worlds Test (Case 8)**
  *Consider two worlds with the exact same history of particles and fields. In World A, the regularities hold because of a deep structural constraint. In World B, they hold by cosmic coincidence.*
  *   **Q:** Are the **laws of nature** the same in both worlds?
      *   **YES:** Go to Node 2 (Supervenience Friends).
      *   **NO:** Go to Node 5 (Structure Realists).

  **Node 2: The One-Particle Test (Case 1)**
  *Consider a universe containing exactly one particle that exists for a while and decays once, with nothing else ever happening.*
  *   **Q:** Is there a **law of nature** in this universe (e.g., about decay rates)?
      *   **NO:** Go to Node 3 (Strict Humeans).
      *   **YES:** Go to Node 4 (Modal Supervenients).

  **Node 3: The Tie-Breaker Test (Case 3)**
  *Consider two candidate systems of generalizations that are exactly as simple as each other and exactly as informative, but disagree about some region nobody has looked at.*
  *   **Q:** Is there a **fact of the matter** about which system is the law, even if we can't know it?
      *   **NO:** **Leaf 1: Best-System Humeanism** (Lewis/Ramsey). (Laws are just our best description; if the description ties, there's no fact).
      *   **YES:** **Leaf 2: Nihilist / Fictionalist**. (If you think there's a fact but denied laws in Node 2, you likely view laws as useful fictions rather than truths).

  **Node 4: The Constraint Test (Case 6)**
  *Consider a world where something like energy conservation seems to sit *above* the dynamical laws—it holds across variations in which the first-order laws are different.*
  *   **Q:** Is this constraint a **different kind of thing** than the dynamical laws (e.g., more necessary)?
      *   **YES:** **Leaf 3: Non-Governing Non-Humean** (Lange-style). (Laws are defined by counterfactual stability, which allows for distinct layers of necessity without "governing").
      *   **NO:** **Leaf 4: Anti-Fundamentalist** (Cartwright-style). (Rejects the idea of a single fundamental layer; prefers local capacities).

  **Node 5: The Violation Test (Case 7)**
  *Back to the Non-Supervenient branch. A world just like ours but one electron does something forbidden, exactly once, with no hidden cause.*
  *   **Q:** Did the law **fail to govern** (it was broken but still true), or did the law **turn out to be false**?
      *   **FALSE (Turned out false):** **Leaf 5: Dispositional Essentialist**. (If the essence of 'electron' is to behave thus, it *cannot* behave otherwise. If it does, it wasn't an electron or the law is false).
      *   **BROKEN (Still true):** Go to Node 6 (Governing Realists).

  **Node 6: The Uninstantiated Test (Case 5)**
  *Consider a law about a kind of particle that never actually gets instantiated in that world—never fires, never manifests.*
  *   **Q:** Can this **still be a law**?
      *   **NO:** **Leaf 6: Armstrong-Style** (Universals). (Armstrong requires universals to be instantiated to avoid Platonism. No instances = no relation N(F,G)).
      *   **YES:** Go to Node 7.

  **Node 7: The Impossible Antecedent Test (Case 9)**
  *Consider a case where the interesting question is what the laws say about an antecedent that's physically impossible in that world.*
  *   **Q:** Are these counterfactuals **true in virtue of the laws**?
      *   **YES:** **Leaf 7: Primitivist** (Maudlin-style). (Laws are fundamental posits that ground the counterfactuals).
      *   **NO / VACUOUS:** **Leaf 8: Skeptical Realist**. (A reconstructed position: Laws exist but don't support counterlegals. Rare, but logically possible).

  ### 4. The Leaves (Position Descriptions)

  1.  **Best-System Humeanism (Lewis):** Laws are the axioms of the system that best balances simplicity and strength in summarizing the history of the world. They don't govern; they describe.
  2.  **Nihilist / Fictionalist:** There are no laws (or they are merely useful instruments). Regularities exist, but "lawhood" is a human projection.
  3.  **Non-Governing Non-Humean (Lange):** Laws are distinct from accidents because they are "sub-nomically stable" (they hold across a wide range of counterfactual scenarios). They have modal force without "pushing" particles.
  4.  **Anti-Fundamentalist (Cartwright):** There are no fundamental laws that govern everything. There are only local "nomological machines" and capacities that work in specific contexts.
  5.  **Dispositional Essentialist (Bird/Ellis):** Laws flow from the essences of things. An electron behaves as it does because it is in its nature to do so. Laws are metaphysically necessary (given the entities).
  6.  **Armstrong-Style (Universals):** Laws are contingent relations of necessitation between universals (N(F,G)). They require instantiation to exist.
  7.  **Primitivist (Maudlin):** Laws are fundamental ontological posits. They are not reducible to patterns or powers. They simply *are*, and they govern.
  8.  **Skeptical Realist:** (Reconstructed) Laws exist as structure, but we cannot rely on them for counterfactuals about impossible antecedents.

  ### 5. The Autopsy: Where the Tree Fails

  You asked for honesty about the limitations. Here is where the tree is fragile.

  **1. The Heavy Lifting Nodes:**
  *   **Node 1 (Twin Worlds):** This does 50% of the work. It splits the entire Non-Humean cluster from the Humean cluster. If you delete this node, the tree collapses into a list of "Modal Strength" questions that Humeans and Non-Humeans answer similarly.
  *   **Node 5 (Violation):** This is the only clean separator for Dispositionalism. Without it, Dispositionalists look exactly like Primitivists.

  **2. The Humean vs. Lange Problem (Leaf 1 vs. Leaf 3):**
  *   **Failure:** Sophisticated Humeans and Lange-style views look awfully similar here. Both say "Same Laws" in Node 1. Both say "No Violation" in Node 5.
  *   **Why:** The split relies entirely on **Node 4 (Constraints)**. But a sophisticated Humean can say constraints are just higher-level summaries. This node is doing *all the work* for this branch. If your students answer "No" to Node 4 but mean "No, because it's all just summary," they land in Cartwright when they meant Lewis.
  *   **Fix:** You need to supplement Node 4 with a verbal clarification: "Is the constraint *more necessary* than the dynamical law, or just *more general*?"

  **3. The Armstrong vs. Primitivist Problem (Leaf 6 vs. Leaf 7):**
  *   **Failure:** This relies on **Node 6 (Uninstantiated)**. But Armstrong could bite the bullet and say "Yes, uninstantiated laws exist" (moving toward Platonism). The distinction is often historical (Armstrong wanted to avoid Platonism) rather than strictly logical.
  *   **Case Quality:** Case 5 (Uninstantiated) is good, but Case 9 (Counterlegals) is technical. Undergrads may not grasp "counterlegal conditionals."
  *   **Fix:** If you see confusion here, swap Case 9 for **Case 10 (Probabilistic)**. Ask: "Is the probability a real physical power (Propensity) or just a pattern frequency?" Dispositionalists say Power; Humeans say Frequency. Primitivists are split.

  **4. The "Governing" Red Herring:**
  *   Notice that **Leaf 3 (Lange)** is labeled "Non-Governing." But in common parlance, Lange's laws *do* constrain what happens (via stability). If your students fixate on the word "govern," they will misclassify Lange.
  *   **Instruction:** Tell your group: "For this tree, 'Governing' means 'Metaphysically making the events happen,' not 'Constraining what is possible.'"

  **5. Missing Case:**
  *   I did not use **Case 4 (Vocabulary)**. I cut it because it confuses "laws are language-relative" with "predicates must be natural." Lewisians say laws aren't language-relative (must use natural predicates). Anti-Realists say they are. It doesn't cleanly separate the leaves without a lecture on "Natural Properties."

  **6. Reconstructed Positions:**
  *   **Leaf 8 (Skeptical Realist)** and **Leaf 2 (Fictionalist)** are reconstructed. There aren't many famous philosophers holding these exact spots. I included them to fill the logical space, but be prepared to tell students these are "theoretical possibilities" rather than "famous schools."

  ### Summary for the Reading Group
  Hand out the **Starting Commitment** and the **Tree**. Keep the **Logical Space Map** for yourself to guide the discussion when they get stuck. When they argue about "governing," point to **Node 1** and ask: "If the history was the same, would the law be the same?" That is the question that actually matters.
