answer: |-
  ### Part 1: The Pushback (Read this before the tree)

  You asked me to build a tree about "governing," but I need to stop you before you hand this out. **"Governing" is not the fault line.** It is the *metaphor* people use to describe the output of their position, not the input that generates it.

  If you ask a Humean, "Do laws govern?" they will say, "No, that's magic." If you ask a Primitivist, they say, "Yes." But if you ask them both, "If the history of the universe were exactly the same, could the laws have been different?" you get the real split. The Humean says "No" (laws supervene on the history). The Primitivist says "Yes" (laws are additional structure).

  The real logical space is defined by two axes:
  1.  **Supervenience:** Do the laws depend entirely on the pattern of particular events (the "mosaic")?
  2.  **Modal Strength:** Do the laws support counterfactuals/necessity *better* than mere accidents do?

  Your "governing" intuition is just the combination of **Non-Supervenience + High Modal Strength**.

  I have built the tree below using your cases, but I have routed them according to *Supervenience* and *Modal Strength*, not "governing." If you use "governing" as a node question, your undergrads will just guess what you want to hear. If you use the cases, they have to think about the physics.

  ### Part 2: The Logical Space Map

  Before the tree, here is the map of the territory. We are sorting positions based on two binary choices (plus a third for anti-realism).

  | | **Laws Supervene on History** (Humean Base) | **Laws Do Not Supervene** (Non-Humean Base) |
  | :--- | :--- | :--- |
  | **High Modal Strength** (Supports counterfactuals robustly) | **Lange-style** (Stability) <br> *(Rare/Unstable Cell)* | **Primitivist** (Maudlin) <br> **Armstrong** (Universals) <br> **Dispositional** (Essences) |
  | **Low Modal Strength** (Just summaries) | **Humean** (Lewis/Ramsey) | **[EMPTY CELL 1]** |
  | **Anti-Realist** (No fundamental laws) | **Cartwright** (Machines) <br> **Nihilist** | **[EMPTY CELL 2]** |

  **The Empty Cells:**
  1.  **Non-Supervenient + Low Modal Strength:** This posits extra ontological structure (so it's not Humean) that *doesn't* do any modal work (doesn't support counterfactuals or necessitate events). **Why it's empty:** It's epiphenomenal. If the law doesn't constrain what happens and doesn't summarize what happened, why believe it exists? It collapses into Nihilism.
  2.  **Non-Supervenient + Anti-Realist:** You can't say "There is extra structure beyond the events" and also "There are no laws." That's a contradiction. (Though one could be a Fictionalist about Non-Humean laws, this is rarely occupied).
  3.  **Supervenient + Governing:** (Not in table, but crucial). If laws are *just* the summary of events, they cannot *make* the events happen. That would be circular. **Why it's empty:** Incoherent.

  ### Part 3: The Decision Tree

  **Starting Commitment:** "Accidentally true generalizations (like 'all gold spheres are <1 mile') and Laws of Nature are not distinguished just by how many instances they have."

  **Node 1: The Twin Worlds Test (Case 8)**
  *Consider two worlds with the exact same history of particles and fields. In World A, the regularities hold because of a deep structural constraint. In World B, they hold by cosmic coincidence.*
  *   **Q:** Are the **laws of nature** the same in both worlds?
      *   **YES:** Go to Node 2 (Supervenience Friends).
      *   **NO:** Go to Node 5 (Structure Realists).

  **Node 2: The One-Particle Test (Case 1)**
  *Consider a universe containing exactly one particle that exists for a while and decays once, with nothing else ever happening.*
  *   **Q:** Is there a **law of nature** in this universe (e.g., about decay rates)?
      *   **NO:** Go to Node 3 (Strict Humeans).
      *   **YES:** Go to Node 4 (Modal Realists).

  **Node 3: The Tie-Breaker Test (Case 3)**
  *Consider two candidate systems of generalizations that are exactly as simple as each other and exactly as informative, but disagree about some region nobody has looked at.*
  *   **Q:** Is there a **fact of the matter** about which system is the law, even if we can't know it?
      *   **NO:** **Leaf A: Best-System Humeanism** (Lewis/Ramsey). (Laws are just our best description; if the description ties, there's no fact).
      *   **YES:** **Leaf B: Nihilist / Fictionalist**. (Wait, if you said YES to laws existing in Node 2 but NO to facts here, you're likely a Fictionalist who thinks laws are useful tools but not literally true. *Correction:* Usually Nihilists say NO to Node 2. Let's reroute.)
      *   *Correction for Node 3:* If you are at Node 3, you already think laws supervene. If you say "No fact of the matter," you are a **Humean**. If you say "Yes, there is a fact," you are likely **Lange-style** (Laws are distinct from mere summaries due to stability, even if mosaic is same).
      *   **Revised Node 3 Q:** Is the truth of the law **determined entirely** by the simplicity and strength of the summary?
          *   **YES:** **Leaf A: Best-System Humeanism**.
          *   **NO:** **Leaf B: Non-Governing Non-Humean** (Lange-style). (Laws are defined by counterfactual stability, which is a further fact than just the mosaic summary).

  **Node 4: The Constraint Test (Case 6)**
  *Consider a world where something like energy conservation seems to sit *above* the dynamical laws—it holds across variations in which the first-order laws are different.*
  *   **Q:** Is this constraint a **different kind of thing** than the dynamical laws (e.g., more necessary)?
      *   **YES:** **Leaf B: Non-Governing Non-Humean** (Lange). (Lange distinguishes laws from accidents via sub-nomic stability and treats constraints as higher-order).
      *   **NO:** **Leaf C: Anti-Fundamentalist** (Cartwright-style). (If you think laws supervene but reject the "fundamental law" picture in favor of patched capacities, you land here. *Note:* This is a reconstructive leaf; Cartwright often denies Node 1's premise).
      *   *Alternative for Leaf C:* **Nihilist**. (If you think there are no fundamental laws, just machines). Let's place **Nihilist** here if they answer "There are no such laws" to Node 2.
      *   *Decision:* Let's move **Nihilist** to Node 2 (No). Let's make Node 4 distinguish **Lange** from **Humean** who slipped through.
      *   *Actually, let's use Case 2 (Stops) for Nihilism.*
      *   **Revised Node 4:** **The Stopping Test (Case 2)**. *A neat regularity holds for a trillion years then stops with no underlying change.*
          *   **Q:** Was it **never a law** (just an accident)?
              *   **YES:** **Leaf C: Nihilist / Skeptic**.
              *   **NO:** **Leaf B: Lange-style** (It was a law, but the stability condition failed).

