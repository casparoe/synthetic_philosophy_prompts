answer: |-
  **What he got right**
  He is correct that the Knobe Effect demonstrates a robust asymmetry where people readily attribute intentionality to bad side effects but resist doing so for good ones. This suggests that ordinary folk psychology isn't a neutral diagnostic tool but is deeply intertwined with our practices of praise and blame. Consequently, it challenges the traditional view that conceptual analysis can completely isolate descriptive facts from normative judgments.

  **What he stretched**
  However, his leap from "moral judgment influences attribution" to "intentionality is just blame" ignores competing explanations that preserve the conceptual core. For instance, some argue that violating a norm signals a deeper commitment to the outcome, whereas conforming to a norm doesn't, which is a structural feature of agency rather than pure emotivism. Your robot example hits this hard: if people say a robot intentionally woke the baby but didn't intentionally lull it, it reveals something about how we anthropomorphize agency under threat, not necessarily that the concept itself is void. Furthermore, philosophers distinguish between the *concept* of intentionality and the *application* of it; the Knobe Effect shows our application is biased, not that the underlying metaphysical structure doesn't exist. By collapsing the distinction between how we use a word and what the word refers to, he commits a pragmatic fallacy that dismisses the possibility of refining our intuitions through reflection.

  **So what for armchair philosophy**
  Armchair philosophy isn't dead, but it must account for the fact that raw intuitions are noisy data points rather than undeniable axioms. The job shifts from merely reporting what people say to explaining why they say it and constructing theories that withstand these psychological biases. This means philosophy becomes more collaborative with cognitive science, rather than being replaced by it.
