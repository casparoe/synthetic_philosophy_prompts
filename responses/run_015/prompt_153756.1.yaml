  5.  **Refining the "Shadow-Maxim Test":**
      *   Make it sound like a quick mental heuristic.
      *   *Action Maxim:* "In cases of type C, I will do A."
      *   *Exception Maxim:* "I will break rule R because of emergency E."
      *   *Contradiction:* Does this make the concept of consent meaningless? Does this make the concept of saving lives impossible?

  6.  **Refining the "Tie-Breaker":**
      *   Must be honest. It's not a mathematical formula. It's a hierarchy of duties.
