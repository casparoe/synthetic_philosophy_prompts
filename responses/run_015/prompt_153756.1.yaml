  9.  **Self-Correction on Case 3:** The prompt says "The procedure should tell me to honor the refusal, knowing it leads to death and legal exposure." I need to make sure the checklist *forces* this if capacity is confirmed. The "Depression" angle is the trap. The checklist must distinguish *impairment of capacity* from *unpopular values*. If capacity is present, depression doesn't negate autonomy in strict deontology unless it destroys rationality. I will build the capacity assessment into Step 1 tightly.

