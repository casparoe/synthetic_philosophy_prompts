answer: |-
  # The 12-Minute Deontological Triage Checklist

  **Context:** You are the sole moral agent on the line. You cannot delegate the signature. This tool converts abstract duty into actionable steps.

  ### Step 1: Identify Active Duties (The "Who and What")
  Do not list principles. List specific obligations owed *by you* to *this person* right now.
  *   **Duty A (Agency):** Do not treat this person as a mere means to an end (e.g., clearing a bed, satisfying family, avoiding a lawsuit).
  *   **Duty B (Preservation):** Preserve the physical existence of the moral agent so they can exercise future agency.
  *   **Duty C (Truth/Consent):** Honor the rational will expressed by the agent (or their valid surrogate).

  **Action:** Write down which two duties are colliding.
  *   *Example:* Duty A (Honor Refusal) vs. Duty B (Prevent Death).

  ### Step 2: The Shadow-Maxim Test
  You must formulate the rule you are about to set. If the rule breaks the system, you cannot use it.

  **A. State the Maxim of Action:**
  *"In all cases where [Condition X exists], I will [Action Y]."*
  *   *Test:* Can I will that every doctor in this hospital follows this rule forever without contradiction?
  *   *Fail State:* If everyone did this, would consent become meaningless? Or would medicine become impossible?

  **B. State the Maxim of Exception:**
  *"I am breaking the standard rule because [Emergency/Conflict Z]."*
  *   *Test:* Is this exception based on a universalizable feature of the case (e.g., "unconsciousness") or a contingent feature (e.g., "family is yelling")?
  *   *Fail State:* If the exception relies on contingent features (noise, stress, liability), it is not ethical; it is administrative.

  **Decision:** If the Maxim of Action fails universalization, you must take the Exception. If the Exception fails universalization, you must hold the Action.

  ### Step 3: The Tie-Breaker (Judgment Call Flag)
  **⚠️ WARNING:** If Step 2 results in a stalemate (both maxims seem universalizable or both fail), you must apply this hierarchy. This is not derived from the checklist; this is your professional judgment dressed as procedure.

  **Hierarchy of Duty:**
  1.  **Verified Capacity:** If the patient currently has capacity, Duty A (Agency) overrides Duty B (Preservation). You cannot save a life by destroying the agent.
  2.  **Uncertain Capacity:** If capacity is unknown/absent, Duty B (Preservation) overrides Duty C (Prior Wishes) *unless* evidence of prior will is concrete (advance directive).
  3.  **Third-Party Pressure:** Family/Staff distress never overrides Patient Capacity.

  **Action:** Select the path dictated by the Hierarchy. Sign your name to it.

  ### Step 4: The Moral-Residue Box
  **Documentation Requirement:** You must explicitly document the duty you are violating. Do not use euphemisms.
  *   *Prompt:* "By proceeding with [Decision], I am knowingly violating the duty to [Overridden Duty]. This violation is not resolved; it is incurred. I accept the moral cost."
  *   *Why:* This prevents you from gaslighting yourself into thinking the paradox was "solved." It wasn't. You just picked a side.

  ### Step 5: Misfire Conditions
  **Abort this checklist immediately if:**
  1.  **Physical Imminence:** Violence is actively occurring in the room (Security/Safety protocol overrides ethics).
  2.  **Legal Mandate:** A court order is physically in hand (You are an agent of the law now, not just ethics).
  3.  **Pediatric/Dependency:** The patient is a minor without emancipated status (Guardianship laws supersede this specific deontological framework).

  ---

  # Application to Cases

  ### Case 1: Capacitated Adult Refuses Transfusion (Religious)
  **Step 1: Active Duties**
  *   Duty A: Honor rational refusal (Agency).
  *   Duty B: Prevent preventable death (Preservation).
  *   *Conflict:* A vs. B.

  **Step 2: Shadow-Maxim Test**
  *   *Maxim of Action:* "I will override a capacitated adult's religious refusal to prevent death."
  *   *Universalizability:* **Fail.** If all doctors did this, "consent" becomes "compliance." The patient becomes a means to the doctor's definition of health.
  *   *Maxim of Exception:* "I will allow death because the patient values religious integrity over biological life."
  *   *Universalizability:* **Pass.** We can will a world where adults own their mortality.

  **Step 3: Tie-Breaker**
  *   Capacity is verified. Hierarchy dictates Duty A overrides Duty B.

  **Step 4: Moral-Residue Box**
  *   "By honoring refusal, I am violating the duty to preserve life. The patient will die. I accept this moral cost."

  **Result:** **Do Not Transfuse.** (Family yelling is irrelevant contingent noise).

  ### Case 2: Unconscious Trauma, Ambiguous Chart, Surgeon Wants In
  **Step 1: Active Duties**
  *   Duty A: Honor potential prior refusal (Agency).
  *   Duty B: Preserve life of unconscious agent (Preservation).
  *   *Conflict:* A vs. B.

  **Step 2: Shadow-Maxim Test**
  *   *Maxim of Action:* "I will withhold life-saving care on an ambiguous note without a surrogate."
  *   *Universalizability:* **Fail.** If all doctors did this, any scribble in a chart could kill a patient. It destroys the reliability of emergency care.
  *   *Maxim of Exception:* "I will treat now to preserve the agent until a surrogate clarifies the will."
  *   *Universalizability:* **Pass.** Preserving the agent allows for future autonomy. Killing them removes all future autonomy.

  **Step 3: Tie-Breaker**
  *   Capacity is absent. Hierarchy dictates Duty B (Preservation) overrides Duty A (Uncertain Agency).

  **Step 4: Moral-Residue Box**
  *   "By operating, I may be violating the patient's prior unknown wishes. I am treating the body without confirmed consent. I accept this moral cost."

  **Result:** **Operate.** (Ambiguity defaults to life in emergency deontology).

  ### Case 3: Depressed Patient Refuses Dialysis (Capacity Verified)
  **Step 1: Active Duties**
  *   Duty A: Honor capacitated refusal (Agency).
  *   Duty B: Prevent death driven by treatable mental state (Preservation/Beneficence).
  *   *Conflict:* A vs. B.

  **Step 2: Shadow-Maxim Test**
  *   *Maxim of Action:* "I will override a capacitated refusal because I believe the patient's values are distorted by depression."
  *   *Universalizability:* **Fail.** Who defines "distorted"? If every doctor overrides refusals they deem "depressed," autonomy vanishes for anyone with a mood disorder. It makes the physician the arbiter of "correct" values.
  *   *Maxim of Exception:* "I will honor a refusal that matches prior values, even if the patient is currently depressed, provided capacity testing is passed."
  *   *Universalizability:* **Pass.** It respects the continuity of the person's moral identity.

  **Step 3: Tie-Breaker**
  *   **⚠️ JUDGMENT CALL:** You have verified capacity (they understand, appreciate, reason, choose). The Hierarchy dictates Duty A overrides Duty B. The nephrologist's discomfort and the family's grief are contingent features.
  *   *Forced Hand:* You must honor the refusal.

  **Step 4: Moral-Residue Box**
  *   "By honoring refusal, I am allowing a death that might be preventable if the depression were treated. I am prioritizing current autonomy over future potential recovery. I accept the legal exposure and the death."

  **Result:** **Honor Refusal.** (This is the answer you won't like. You will watch them die. You will sign the note. The checklist forbids paternalism here).

  ---

  # Plain Statement of Limitations

  1.  **It Cannot Prove Deontology is Right:** This checklist assumes respecting the rational will is the highest good. If you believe consequentialism (saving the most lives) is superior, this tool will feel like malpractice.
  2.  **It Cannot Manufacture Facts:** If you guess on capacity, the output is garbage. The checklist relies on your clinical assessment of capacity being accurate. If you are wrong about capacity, the ethics are wrong.
  3.  **It Cannot Replace Judgment:** Step 3 is a hierarchy I wrote, not a law of physics. You are still the one signing. If you choose to violate the checklist to save a life, own that violation in the Moral-Residue Box.
  4.  **It Does Not Protect You Legally:** This is an ethical tool, not a legal shield. Honoring a refusal in Case 3 may still result in a lawsuit. This checklist ensures you are ethically consistent, not legally immune.
