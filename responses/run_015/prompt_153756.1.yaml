      *   **Specific Requirements:**
          *   Steps to identify active duties (not just listing rules).
          *   "Shadow-Maxim Test" (Action vs. Exception, Universalizability).
          *   Tie-breaker for genuine conflict (flagged as judgment call).
          *   Moral-Residue Box (acknowledge overridden duty).
          *   Misfire Conditions (when the checklist fails).
          *   Apply to 3 specific cases (one must yield an unpopular result).
          *   Plain statement of limitations.
      *   **Tone:** Practical, direct, no academic fluff, no citations.

  2.  **Deconstruct the Ethical Framework (Deontology in Triage):**
      *   Standard Kantianism is slow and abstract. I need to make it *procedural*.
      *   *Core Tension:* Respect for Persons (Autonomy) vs. Duty of Care (Non-maleficence/Beneficence).
      *   *The "Paradox":* Often, saving a life (Beneficence) violates Will (Autonomy). Letting die (Autonomy) violates Care (Beneficence).
      *   *The Solution:* A algorithmic approach that forces the consultant to articulate the maxim, test it, and own the residue.

  3.  **Drafting the Checklist (The "12-Minute Deontological Triage"):**
      *   *Step 1: Duty Identification.* Need to move beyond "Autonomy" to specific obligations. *Who is the moral agent? Who is the end-in-themselves?*
      *   *Step 2: The Shadow-Maxim Test.* This is the core Kantian engine.
          *   Maxim of Action: "I will do X."
          *   Maxim of Exception: "I will allow exception Y."
          *   Universalizability: Can every doctor do this in this situation without destroying the practice of medicine or the concept of consent?
      *   *Step 3: The Tie-Breaker.* If both fail or both pass, what wins? In clinical deontology, *Capacity* is usually the gatekeeper. If capacity exists, Autonomy usually trumps Beneficence. If capacity is absent, Beneficence (Best Interest) usually trumps *presumed* Autonomy. I need to flag this as the "Judgment Call."
      *   *Step 4: Moral Residue.* Acknowledge the loss.
      *   *Step 5: Misfire Conditions.* When to abort the checklist (e.g., immediate physical threat, legal mandate).

  4.  **Developing the Cases:**
      *   *Case 1 (Jehovah's Witness/Capacitated):* Classic autonomy vs. life. Deontology says respect the rational will. Result: Do not transfuse. (Standard, but needs to be firm).
      *   *Case 2 (Unconscious/Ambiguous Note):* Emergency exception vs. Potential Autonomy. Deontology requires treating the person as an end. If we don't know the will, we preserve the agent to ask later. Result: Operate. (Standard emergency doctrine).
