  **(Self-Correction Note):** I need to make sure I explain *why* the chaining step fails philosophically. It fails because it treats "co-reality" as a relation that holds between things that a Presentist says *don't exist yet*. You can't have a transitive relation involving non-entities. That's the begging of the question.

