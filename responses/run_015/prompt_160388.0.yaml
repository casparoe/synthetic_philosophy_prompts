          *   Analogy: Watching a film. The ending is on the reel, but the characters' choices cause the ending. (Better analogy: The map vs. the territory).
      *   *Section 4: The Experience of Passage.*
          *   Standard view: Illusion (or rather, a representation of change, not change itself).
          *   Thermodynamics: Gives direction (arrow), not flow.
