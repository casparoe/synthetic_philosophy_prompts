answer: |-
  The Special Composition Question is typically framed as a synchronic puzzle: look at the world at a single instant, tick off the boxes for contact, function, or life, and decide if a new object exists. This is a category error. Existence is not a snapshot; it is a film. To ask whether parts compose a whole is to ask whether their histories and futures are welded together. I propose a principle of **Trajectory Coherence**: composite objects exist only when the spatiotemporal paths of their constituents are bound into a single, non-diverging causal-historical line that supports unified counterfactual dependence.

  Consider the standard restrictions. Contact fails because it cannot account for discontinuous entities that we rightly identify as wholes, such as a dumbbell or a solar system, while mistakenly validating mere piles of dust that happen to touch. Functional integration is equally flawed, smuggling in anthropocentric norms; a watch functions as a whole because we intend it to, but does a rock compose a whole with the moss growing on it simply because they interact? Van Inwagen's organic unity is too severe, denying existence to tables and ships while granting it to cats, based on a metaphysical privilege of life that ignores the structural integrity of non-living systems. Universalism is the surrender of reason, claiming every scattered arbitrary collection is an object, which drains the word "object" of any discriminatory power. Nihilism is the opposite surrender, denying composition entirely and leaving us with only simples, which contradicts the robust causal powers we observe in macroscopic entities.

  Trajectory Coherence cuts through this by anchoring composition in modal physics rather than static geometry or human interest. Two particles compose a whole only if their world-lines run parallel through spacetime such that what happens to one necessitates a coordinated response in the other, not by accident, but by virtue of their binding. They must share a fate. If you strike the front of a car, the back moves with it. If you heat one end of a steel bar, the other expands. This is unified counterfactual dependence. The parts are not merely near each other; they are locked in a causal dance where their trajectories are constrained to remain a single bundle.

  Apply this to the case of the demolished Baroque altarpiece. The universalist says the fragments in London, New York, and Tokyo compose a scattered object because we can list them together. The nihilist says there are only fragments, never an altarpiece. Both are wrong, but for different reasons. The altarpiece *was* a whole when its fragments were bound by mortar, wood, and structural tension—their trajectories were coherent. When the altarpiece was demolished and shipped across three continents, that causal-historical line was severed. The fragment in Tokyo does not vibrate when the fragment in London is struck. Their futures have irreversibly diverged. They share a past origin, but composition is a present-tense reality grounded in ongoing causal binding. Curatorial labeling is a psychological gesture, a nostalgic attempt to rebuild the object in language because we cannot rebuild it in physics. To claim they are still one object is to confuse a historical category with an ontological one. The object died when the trajectories diverged.

  Now, the obvious objection: does this not smuggle in temporal bias or psychological narrative? Critics argue that selecting a "trajectory" is just telling a story about the objects, imposing a human sense of continuity on a universe of discrete events. They claim I am privileging the temporal dimension over the spatial, or worse, relying on our cognitive inability to track diverging paths. This objection collapses under scrutiny. World-lines are not stories; they are physical facts in four-dimensional spacetime. Counterfactual dependence is not psychological; it is a modal relation independent of observers. If the fragments were magnetically locked such that moving one necessitated moving the others across continents, they would compose a whole under Trajectory Coherence, regardless of whether any human knew it. The criterion is not whether we *care* if the paths stay together, but whether the laws of physics enforce their cohesion. The bias charge confuses the *detection* of coherence with the *existence* of coherence. We use narratives to find the objects, but the objects exist because the physics holds them there.

  Therefore, we must reject the comfort of universalism and the austerity of nihilism. We must accept that objects are transient knots of causal power. When the knot tightens, composition occurs. When the strands slip apart, the object ceases to be, leaving only remnants. The altarpiece is gone. There are only stones.

  \answer{Trajectory Coherence}
