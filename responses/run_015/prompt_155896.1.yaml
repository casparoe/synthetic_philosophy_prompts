      *   *Null Results:* I need to push back hard here. Lakatos defines progress as *novel facts.* Excluding a parameter space is not a novel fact in the Popper/Lakatos sense; it's a lack of a fact. I should advise the writer that Lakatos might be the *wrong* tool for the "null result" angle, unless they reframe "exclusion" as "predicting where the particle isn't," which is a stretch. Actually, a better Lakatosian angle is: Did the shift to Axions predict something new? (Yes, specific coupling signatures). Did the shift to SIDM predict something new? (Core profiles in dwarfs).

      *   *MOND as Rival:* Lakatos requires competing programmes to address the same anomalies. MOND addresses rotation curves (better) but fails CMB (worse). DM addresses CMB (better) but struggles with rotation curve diversity (worse). They are competing but asymmetrical. Lakatos handles this via "overall heuristic power."

