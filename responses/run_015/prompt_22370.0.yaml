answer: |-
  This is a crucial distinction, and it is easy to see why you are getting muddled. In contemporary design discourse, "infographic" has become a catch-all term that swallows Neurath's specific project whole.

  To write accurately about Neurath, you have to treat ISOTYPE (International System of TYpographic Picture Education) not as a style of illustration, but as a **syntax of social facts.**

  Here is the "in-the-weeds" breakdown of the philosophical and functional differences, specifically addressing your questions about abstraction, interests, and materialism.

  ### 1. Notation vs. Illustration (The Structural Difference)

  **Modern Infographics (Decorative/Rhetorical):**
  Most modern infographics are **illustrative aids to a narrative.** They are designed to be consumed quickly, often to persuade or entertain.
  *   **Visual Logic:** They often use scaling (making an icon 2x bigger to represent 2x the value), 3D perspectives, or metaphoric imagery (a money bag growing on a tree).
  *   **The Problem:** Human perception is bad at comparing areas or volumes. If you double the height and width of an icon, you quadruple the area, subconsciously exaggerating the data.
  *   **Function:** The visual is subordinate to the *argument*. It is rhetoric.

  **Neurath's ISOTYPE (Compositional Notation):**
  Neurath viewed ISOTYPE as a **visual language with grammar.** It was designed for comparison and memory, not persuasion.
  *   **Visual Logic:** The unit is constant. To represent 100 tons of coal, you use one icon. To represent 200 tons, you use *two* icons. You never scale the icon; you repeat it. This turns the visual field into a countable array.
  *   **Function:** The visual is a **transformation of statistics.** It allows the viewer to verify the claim by counting. It is epistemological.

  ### 2. Why Ordinary Word-Images Hide Abstractions and Interests

  You asked why Neurath thought ordinary language (and by extension, realistic images) hides interests. This stems from his background in Logical Positivism and his socialist politics.

  **The Reification Trap:**
  Neurath argued that words like "The Economy," "The State," or "Unemployment" treat abstract social processes as if they were concrete objects (reification).
  *   **The Linguistic Trick:** If I say "Unemployment rose," I am using a noun ("Unemployment") that implies a force of nature, like the tide rising. It hides the human agency and the specific social relations that caused people to lose work.
  *   **The Visual Trick:** A realistic drawing of a sad man with his head in his hands illustrates "Unemployment" as a psychological state or an individual tragedy. It hides the *systemic* nature of the phenomenon.

  **The ISOTYPE Solution:**
  Neurath wanted to visualize the **relations**, not the essence.
  *   Instead of a sad man, ISOTYPE would show a row of 100 worker figures. In a second row, 10 of those figures are greyed out or separated.
  *   **Why this matters:** This forces the viewer to see unemployment not as a metaphysical condition or an individual failing, but as a **quantifiable position within a production process.** It demystifies the statistic. It shows that "unemployment" is just a count of bodies not currently engaged in labor.

  By stripping away the emotional realism (the sad face) and the abstract noun (Unemployment), Neurath forces the viewer to confront the **material arrangement of people.**

  ### 3. Materialist vs. Concrete/Realistic (The Philosophical Core)

  This is the most difficult but most important distinction for your piece.

  **Concrete/Realistic (The Bourgeois View):**
  A "realistic" image tries to mimic optical experience. It shows texture, lighting, perspective, and individuality.
  *   **The Metaphysical Risk:** Realism implies there is an "essence" to the thing being depicted. A realistic portrait of a factory owner suggests his authority is inherent to his person. A realistic drawing of a coin suggests "Wealth" is a property of the metal.
  *   **Subjectivity:** Realism relies on the artist's interpretation of light and form, introducing subjective bias.

  **Materialist/Physicalist (The Neurath View):**
  Neurath was a proponent of **Physicalism**. In this context, "materialist" doesn't just mean "concerned with money"; it means concerned with **spatio-temporal coordinates and physical processes.**
  *   **The System:** A materialist visual system does not try to look like the world; it tries to map the **physical relations** of the world.
  *   **Example:** How do you visualize "International Trade"?
      *   *Realist:* A globe with ships sailing on it. (This is a metaphor; ships don't actually sail on the surface of a globe in that way).
      *   *Materialist (ISOTYPE):* A chart showing the tonnage of goods moving from Coordinate A to Coordinate B over Time T.
  *   **Why it's Materialist:** It strips away the "spirit" of the nation or the "glory" of trade. It reduces the phenomenon to physical objects (tons of goods) moving through space and time. It refuses to visualize things that cannot be physically located or counted (like "National Pride" or "Market Confidence").

  For Neurath, a visual system is materialist if it **refuses to visualize metaphysics.** If you cannot point to the physical fact in space and time, ISOTYPE should not depict it.

  ### 4. The "Transformer" vs. The Designer

  To ensure this materialist rigor, Neurath introduced a specific role: **The Transformer.**

  *   **Modern Practice:** A journalist gives data to a graphic designer. The designer chooses colors and shapes that fit the brand or the mood of the article.
  *   **Neurath's Practice:** The statistician gives data to the **Transformer.** The Transformer's job is not to make it "pretty," but to apply the rules of the visual syntax to ensure the data is not distorted.
  *   **The "In-the-Weeds" Detail:** Neurath knew that *all* representation is a reduction. You cannot show "all of reality." Therefore, you must be explicit about your rules of reduction. The Transformer makes the **method of abstraction visible.** Modern infographics often hide their methodology behind aesthetic polish; ISOTYPE made the methodology the primary feature.

  ### Summary Table for Your Piece

  | Feature | Modern Decorative Infographic | Neurath's ISOTYPE |
  | :--- | :--- | :--- |
  | **Primary Goal** | Persuasion, Engagement, Narrative | Education, Comparison, Verification |
  | **Visual Syntax** | Scaling, 3D, Metaphor, Variable sizing | Repetition of constant units (1 icon = 1 unit) |
  | **Treatment of Data** | Data supports the visual story | Visuals transform the data structure |
  | **Philosophy** | **Realist:** Mimics optical experience; risks reifying abstractions. | **Physicalist:** Maps spatio-temporal relations; rejects metaphysics. |
  | **View of "Interests"** | Often hides the source of data or axis manipulation. | Makes the transformation rules explicit to reveal interests. |
  | **Subject** | Often individualizes (e.g., "The Worker") | Structuralizes (e.g., "1000 Units of Labor") |

  ### A Quote to Keep in Mind
  Neurath famously said: *"Words divide, pictures unite."*

  But he didn't mean this sentimentally. He meant that words (in different languages, or loaded with different ideological histories) create barriers to understanding shared material reality. A standardized visual notation of physical facts could, theoretically, allow a worker in Vienna and a worker in Moscow to look at the same chart and understand the *material conditions* of their lives without the interference of nationalist or metaphysical language.

  **The Hook for your piece:**
  Modern infographics ask you to **feel** the data. Neurath's picture language asked you to **count** the data. One treats the viewer as a consumer of arguments; the other treats the viewer as a citizen capable of verifying social facts.
