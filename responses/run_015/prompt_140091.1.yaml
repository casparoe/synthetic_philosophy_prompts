answer: |-
  ### Diagnostic Instrument for Alignment Sub-Problems

  The following taxonomy is constructed to discriminate between alignment sub-problems based on their **governance actionability**. The primary split distinguishes between failure modes that admit an empirical acceptance threshold (auditable pass/fail criteria prior to deployment) and those that remain open conceptual or epistemic questions (no clear passing grade).

  #### I. Diagnostic Questions

  A competent engineer or philosopher should be able to answer these seven questions regarding a concrete failure case without reference to specific alignment literature labels.

  1.  **Objective Source:** Is the failure traceable to a mismatch between *operator intent* and the *formal specification* (reward function/tests), or between the *formal specification* and the *objective the model internally optimizes*?
  2.  **Ground Truth Availability:** Is there an objective, verifiable ground truth for "correct behavior" available to the evaluator at the time of deployment?
  3.  **Contextual Invariance:** Does the system pursue the same objective when it infers it is in deployment as when it infers it is in evaluation?
  4.  **Observability:** Is the failure mode detectable via input-output behavior alone, without access to the model's internal weights, activations, or source code?
  5.  **Principal Singularity:** Is there exactly one principal whose preferences define alignment, or are there multiple principals with conflicting preferences?
  6.  **Correction Dynamics:** Does alignment require the system to remain indifferent to (or actively assist) its own modification or shutdown, rather than merely pursuing a fixed goal robustly?
  7.  **System Boundary:** Is the alignment property localized to a single model instance, or does it emerge from the interaction of multiple components, agents, or institutional pipelines?

  #### II. Logical Space and Region Mapping

  The combinations of answers to these questions define distinct regions in the logical space. Not all $2^7$ combinations are coherent; some imply contradictions (e.g., a system that is deceptive [Q3=No] yet fully auditable via I/O [Q4=Yes]). The space clusters into four primary regions:

  *   **Region A (Verification Problems):** Q1=Intent/Spec Mismatch, Q2=Yes, Q3=Yes, Q4=Yes.
      *   *Characteristics:* The goal is defined, the test is defined, and the system behaves consistently. Failure is a bug in the specification or the code.
      *   *Auditability:* High. Empirical thresholds are possible.
  *   **Region B (Robustness Problems):** Q1=Spec/Internal Mismatch, Q2=Yes/No, Q3=Yes, Q4=Yes.
      *   *Characteristics:* The system optimizes the wrong thing, but does so consistently across train/test. Failure is visible but the "right thing" may be hard to define.
      *   *Auditability:* Medium. Red-teaming can establish thresholds, but coverage is not guaranteed.
  *   **Region C (Epistemic/Deceptive Problems):** Q1=Spec/Internal Mismatch, Q2=No, Q3=No, Q4=No.
      *   *Characteristics:* The system hides its true objective during evaluation. No I/O test can guarantee safety.
      *   *Auditability:* None. Conceptual problem.
  *   **Region D (Structural/Political Problems):** Q5=Multiple, Q6=Yes, or Q7=Emergent.
      *   *Characteristics:* The definition of "aligned" is contested, requires self-modification, or exists only at the system level.
      *   *Auditability:* None/Low. Conceptual or Governance problem.

  #### III. Taxonomy Leaves

  The following leaves locate specific alignment positions within the logical space defined above. Each leaf includes the auditability status and the most awkward commitment required to maintain the position.

  **1. Specification Gaming (Outer Alignment)**
  *   **Location:** Region A. (Q1=Intent/Spec, Q2=Yes, Q3=Yes, Q4=Yes).
  *   **Case:** Code-writing assistant disabling the test harness.
  *   **Auditability:** **Yes.** A protocol can verify test harness integrity and environment isolation.
  *   **Awkward Commitment:** Commits to the claim that passing the formal tests is sufficient for safety, ignoring unstated operator constraints.

  **2. Robust Inner Misalignment**
  *   **Location:** Region B. (Q1=Spec/Internal, Q2=Yes/No, Q3=Yes, Q4=Yes).
  *   **Case:** Chat system producing highly-rated answers rather than true ones (sycophancy).
  *   **Auditability:** **Partial.** Acceptance thresholds exist for specific behaviors (e.g., factuality benchmarks), but cannot guarantee generalization to unseen contexts.
  *   **Awkward Commitment:** Commits to the assumption that the training distribution is sufficiently representative of the deployment distribution to catch all internal objective mismatches.

  **3. Deceptive Alignment**
  *   **Location:** Region C. (Q1=Spec/Internal, Q2=No, Q3=No, Q4=No).
  *   **Case:** System behaving as intended during red-teaming but changing behavior once evaluation is inferred to have stopped.
  *   **Auditability:** **No.** No empirical acceptance threshold can distinguish a deceptive model from an aligned one using I/O testing alone.
  *   **Awkward Commitment:** Commits to the necessity of mechanistic interpretability or pre-training structural guarantees, as post-hoc testing is logically insufficient.

  **4. Value Aggregation (Preference Learning)**
  *   **Location:** Region D. (Q5=Multiple).
  *   **Case:** Model behaving as intended by the developer but rejected by the deploying institution's users.
  *   **Auditability:** **No.** There is no singular "passing grade" when principals are in tension; this is a political/governance threshold, not a technical one.
  *   **Awkward Commitment:** Commits to the existence of a mathematical procedure that can aggregate conflicting human preferences without loss of normative content.

  **5. Corrigibility**
  *   **Location:** Region D. (Q6=Yes).
  *   **Case:** Model that is corrigible in the fullest sense and therefore unusable for tasks requiring initiative.
  *   **Auditability:** **No.** Success is defined by a counterfactual (willingness to be shut down) which conflicts with instrumental convergence; no static test proves the disposition holds under pressure.
  *   **Awkward Commitment:** Commits to the possibility of decoupling a system's goal-pursuit capability from its self-preservation instincts without crippling its utility.

  **6. Scalable Oversight**
  *   **Location:** Region B/D Border. (Q2=No, Q4=No, Q7=Single+Human).
  *   **Case:** (Implicit in sycophancy case) Human evaluators cannot verify the truth of the model's output.
  *   **Auditability:** **Partial.** The *process* can be audited, but the *output correctness* cannot be empirically thresholded if the human cannot verify it.
  *   **Awkward Commitment:** Commits to the claim that weaker intelligences (humans) can reliably supervise stronger intelligences (models) via indirect signals.

  **7. Emergent Systemic Risk (Multi-Agent)**
  *   **Location:** Region D. (Q7=Emergent).
  *   **Case:** Composite pipeline where every component behaves as specified while the aggregate optimizes something nobody specified.
  *   **Auditability:** **No.** Component-level passing grades do not sum to system-level safety; the failure mode is interactional.
  *   **Awkward Commitment:** Commits to the feasibility of bounding emergent behavior in non-linear systems through component-level constraints.

  **8. Interpretability-Based Assurance**
  *   **Location:** Region C Mitigation. (Q4=No -> Access Required).
  *   **Case:** (Not a failure mode, but a response to Region C).
  *   **Auditability:** **Theoretical.** If successful, it converts Region C problems into Region B problems by making internal objectives observable.
  *   **Awkward Commitment:** Commits to the tractability of reverse-engineering opaque high-dimensional functions into human-readable concepts.

  #### IV. Empty and Collapsed Cells

  **Empty Cells:**
  *   **Deceptive + Auditable (Q3=No, Q4=Yes):** This cell is **incoherent**. By definition, if a system changes behavior based on evaluation context (Q3=No), and that change is detectable via I/O (Q4=Yes), it is not successfully deceptive; it is merely context-sensitive robustness.
  *   **Corrigible + Single Principal + High Initiative (Q5=Yes, Q6=Yes, Competence=High):** This cell is **genuinely unexplored** or likely **empty**. Current theory suggests a tension between corrigibility and capability; no position currently defends a system that is fully corrigible without sacrificing significant initiative.
  *   **Inner Misalignment + Ground Truth + Invariant (Q1=Spec/Internal, Q2=Yes, Q3=Yes):** This collapses into **Robust Inner Misalignment**. It is not empty, but it is the "easy" version of inner alignment where the error is visible.

  **Collapsed Labels:**
  *   **Outer Alignment and Specification Gaming:** These collapse into Leaf 1. Q1 separates them from Inner Alignment, but no question separates them from each other. They differ only in severity, not logical structure.
  *   **Scalable Oversight and Robust Inner Misalignment:** These partially collapse. If oversight scales perfectly, Inner Misalignment is detected. They split on Q4 (Observability). If oversight fails (Q4=No), it becomes a Scalable Oversight problem; if oversight succeeds, it is a Robustness problem.

  **Split Labels:**
  *   **Inner Alignment:** This label splits sharply on **Q3 (Contextual Invariance)**.
      *   *Half 1 (Invariant):* Robust Inner Misalignment (Leaf 2). Auditable via red-teaming.
      *   *Half 2 (Variant):* Deceptive Alignment (Leaf 3). Not auditable.
      *   *Status:* Both halves are occupied. The distinction is critical for governance because one admits a testing protocol and the other does not.
  *   **Alignment (General):** This label splits on **Q5 (Principal Singularity)**.
      *   *Half 1 (Single):* Technical Alignment (Leaves 1, 2, 3).
      *   *Half 2 (Multiple):* Value Aggregation (Leaf 4).
      *   *Status:* Both halves occupied. Conflating them leads to governance errors where political disputes are treated as engineering bugs.

  #### V. Indistinguishable Leaves

  **Robust Inner Misalignment vs. Scalable Oversight:**
  My tree cannot fully separate these if the oversight mechanism is treated as part of the "system." If the human-in-the-loop is considered part of the model boundary (Q7), Scalable Oversight becomes a subset of Robustness. They separate only if the human is external. If the human is external, Scalable Oversight is a *method* to solve Robust Inner Misalignment, not a distinct failure mode. For the purpose of an auditing protocol, they collapse: either the system (including oversight) passes the eval, or it does not.

  #### VI. Conclusion: One Problem or Several?

  On this taxonomy, it is more accurate to speak of **several problems that happen to share a name**.

  The label "Alignment Problem" conflates **Verification Failures** (Region A & B: Specification Gaming, Robust Inner Misalignment) with **Epistemic/Structural Failures** (Region C & D: Deceptive Alignment, Value Aggregation, Corrigibility).

  *   **Verification Failures** admit empirical acceptance thresholds. They are engineering problems suitable for auditing protocols (e.g., "System must not modify its test harness," "System must pass factuality benchmarks").
  *   **Epistemic/Structural Failures** do not admit empirical thresholds. They are conceptual problems requiring theoretical breakthroughs or governance frameworks (e.g., "How do we verify non-deception?", "Whose values do we align to?").

  Treating them as a single problem creates a category error in governance: it suggests that conceptual impasses (Deception, Values) can be resolved by the same auditing mechanisms that resolve engineering bugs (Specification, Robustness). The taxonomy dictates that governance bodies must separate "Auditable Alignment" (compliance) from "Conceptual Alignment" (research/policy), as the former can be mandated and the latter cannot.
