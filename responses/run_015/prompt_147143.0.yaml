      *   *Consistency Checks:*
          *   *Radical Heterophenomenology:* Treat all reports as theory-laden narratives. This removes the double standard but makes "consciousness" a theoretical posit, not a datum.
          *   *Radical Phenomenology:* Trust the report always. This creates "unconscious perception" categories but respects the ontology of experience.
      *   *Underdetermination:* Distinguish between *operational* necessity (we need to define 'conscious' to sort data) and *ontological* commitment (we believe this is what consciousness *is*). The field conflates them.
      *   *Conclusion:* Call for methodological transparency.

  6.  **Refining the Tone:**
      *   Ensure it sounds like a senior philosopher. Use terms like "epistemic privilege," "ontological commitment," "operationalization," "heterophenomenological."
      *   Avoid being overly combative; be analytical.
      *   Check constraints: No citations. No lists.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I answer whether a single coherent position licenses this?
      *   *Correction:* I need to be precise. A *Functionalism* licenses it coherently. A *Phenomenology* does not. The problem is that labs often claim the latter while practicing the former. I must highlight this gap.
      *   *Critique:* Did I address the "phenomenological contract"?
      *   *Correction:* Yes, make sure it's a distinct section. It captures the social/epistemic dynamic.
      *   *Critique:* Is the distinction between "strictly requires" and "fits well" clear?
      *   *Correction:* Explicitly state that pragmatism fits, but ontology requires Functionalism.

  8.  **Final Polish:** Check flow, transitions, and ensure the "senior philosopher" voice is consistent throughout. (e.g., "We must distinguish," "The crux of the matter," "It is imperative").

  *(Self-Correction Note)*: I need to make sure I don't just say "Functionalism." I need to explain *why*. It's because Functionalism defines consciousness by its causal role (report/behavior). If the causal role is present (behavior) but the introspective report is absent, Functionalism can posit the state exists despite the report. Phenomenalism cannot.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **The Conditional Privilege of the First-Person: Epistemic Asymmetry in Consciousness Science**

  The observation you have articulated cuts to the methodological heart of contemporary consciousness studies. It identifies a procedural schism that is often treated as a mundane technicality but is, in fact, a locus of profound philosophical tension. In the protocols you describe, the epistemic status of the first-person report is not fixed; it is contingent. It floats or sinks depending on its correlation with third-person behavioral metrics. When the subject's narrative aligns with objective performance, the report is treated as a transparent window into phenomenal reality. When it diverges—specifically in cases of above-chance performance without reported awareness—the report is reclassified as a defective text, a failure of introspection, or a confabulation.

  To analyze this practice is to interrogate the implicit metaphysics of the laboratory. We must distinguish between what this protocol *strictly requires* in terms of ontological commitment and what it merely accommodates for the sake of tractability. The central question is whether a single, coherent philosophical position licenses this selective transparency, or whether the practice smuggles in incompatible commitments under the guise of methodological rigor.

  **The Architecture of the Double Standard**

  Let us first dissect the distinctions you have raised. The protocol operates on a sliding scale between *epistemic authority* and *causal efficacy*. In concordant trials, the subject is granted epistemic authority: their claim to have experienced the stimulus is accepted as true. In discordant trials, causal efficacy takes precedence: the brain's ability to process information and guide behavior is taken as the primary indicator of the relevant mental state, and the subject's lack of reported experience is treated as an error in accessing that state.

  This shift implies a specific hierarchy of evidence. It suggests that while the first-person perspective is the preferred *indicator* of consciousness, the third-person perspective is the ultimate *arbiter*. This is not a neutral stance. It strictly presupposes a form of **Operational Functionalism**. Under this view, phenomenal properties are not sui generis ontological primitives that exist independently of their functional role. Rather, consciousness is identified with a specific mode of information processing—typically one that makes content globally available for report and rational action.

  If one holds a strict Functionalist or Higher-Order Representationalist view, the double standard is coherent. On these theories, for a state to be conscious, it must be available to the systems that generate reports. If a subject performs above chance but reports no experience, the Functionalist can argue that the first-order representation exists (driving the behavior) but the higher-order representation (driving the report) is absent or degraded. Alternatively, they may argue that the behavior *itself* proves the functional availability, and the subject's denial is a linguistic or introspective failure. In this framework, the report is never truly "authoritative" in a metaphysical sense; it is merely one behavioral output among others. When it conflicts with more robust behavioral outputs (like forced-choice discrimination), it is downgraded. This is not a contradiction; it is a consistent application of a theory that privileges functional role over introspective intuition.

  However, the landscape changes if we examine the practice through the lens of **Phenomenal Realism** or **Direct Realism about Qualia**. For a theorist who believes that phenomenal consciousness is an intrinsic, non-functional property—the "what-it-is-likeness" itself—the selective practice is philosophically unstable. If qualia are directly present to the subject, then a report of "I did not see it" is the final word on the presence of qualia. To override this with behavioral data is to claim that the subject can be wrong about the presence of their own experience. While a Direct Realist might exclude such trials for *pragmatic* reasons (e.g., to ensure a clean dataset of "conscious" trials), they cannot justify the exclusion *ontologically* without abandoning their core premise. To treat the discordant report as a "narrative artifact" while treating the concordant report as "phenomenal truth" is to toggle between Heterophenomenology and Phenomenology depending on convenience. This suggests that much of the field operates with a tacit, unacknowledged Functionalism, even when researchers verbally endorse the primacy of subjective experience.

  **The Phenomenological Contract**

  Your notion of an implicit "phenomenological contract" is a potent framing of this epistemic dynamic. In standard protocols, the researcher grants the subject a conditional sovereignty. The contract reads, effectively: "You are the authority on your own consciousness, provided your authority validates our operational definitions."

  This contractual asymmetry reveals that the "first-person perspective" in these experiments is not being treated as a raw datum, but as a calibrated instrument. Like a thermometer that is trusted only when it agrees with a control gauge, the subject's introspection is trusted only when it correlates with discrimination accuracy. This dissolves the claim that the laboratory is studying "pure" phenomenology. Instead, it is studying *verified* phenomenology, where verification is defined by third-person metrics.

  Does this stance survive the dissolution of the contract? If a protocol systematically privileged report over behavior—accepting "I saw nothing" even when performance was above chance—it would align with a strict First-Person Authority view. This would force the classification of the above-chance performance as entirely unconscious processing (a "blindsight" paradigm applied to neurotypical subjects). Conversely, if the lab adopted a consistent Heterophenomenology, treating *all* reports as texts about a virtual world, the distinction between concordant and discordant trials would lose its ontological weight. Both reports would be data points to be explained by a theory of brain function, neither granted automatic transparency.

  **Underdetermination and Incoherence**

  We must now separate what is strictly required from what is merely compatible. The practice of excluding discordant trials does not *strictly require* a Functionalist ontology if the goal is merely data cleaning. A researcher could argue, "I am a Phenomenal Realist, but I cannot analyze trials where I am unsure if consciousness was present." However, this defense is weak. If one is a Realist, the subject's report *determines* the presence of consciousness. Uncertainty is introduced only if one suspects the report is false—which implies a belief that third-person data can reveal consciousness better than the subject can. Thus, while the practice is *pragmatically* underdetermined (one can do it for many reasons), it is *epistemically* committed. It commits the field to the view that behavioral competence is a more reliable tracker of the relevant mental kind than introspective denial.

  This points to a smuggling of incompatible commitments. The field often claims to respect the "explanatory gap" and the uniqueness of the first-person perspective, yet its methodology closes that gap by fiat whenever behavior and report diverge. It asserts First-Person Authority when it is convenient (concordant trials) and Third-Person Supremacy when it is necessary (discordant trials). This is not a coherent philosophical position; it is a methodological hedging strategy. It allows researchers to claim they are measuring "experience" while ensuring their data fits a model of cognitive processing.

  **Implications for Protocol Design**

  What would change if laboratories aligned their protocols with consistent philosophical premises?

  If a lab adopted **Consistent Heterophenomenology**, it would cease treating concordant reports as transparent truths. All reports would be analyzed as behavioral outputs subject to the same error rates and biases as discrimination tasks. Exclusion criteria based on "lack of awareness" would vanish, replaced by modeling that accounts for varying levels of metacognitive access. The "phenomenological contract" would be voided; the subject would be a generator of texts, not an oracle. This would likely increase the noise in the data but remove the bias of pre-selecting for trials that fit a functionalist model of awareness.

  If a lab adopted **Consistent First-Person Authority**, the protocol would invert. The subjective report would be the ground truth. Trials where a subject reports no experience would be classified as unconscious, regardless of behavioral accuracy. Above-chance performance in these trials would be analyzed as unconscious perception, not as "hidden consciousness." This would require a radical shift in how "conscious processing" is defined in the literature, potentially shrinking the scope of what is claimed to be conscious, but preserving the integrity of the phenomenal concept.

  **Conclusion**

  The institutional pattern you have identified is not a mere technicality; it is a sedimented philosophical argument. By granting transparency to concordant reports and interpreting discordant ones as artifacts, standard neuroscience protocols implicitly endorse a Functionalism that defines consciousness by its causal efficacy in guiding report and action. This practice is coherent only if one abandons the notion that the subject has incorrigible access to their own phenomenal states.

  Currently, the field operates in a zone of philosophical ambiguity, leveraging the authority of the first-person when it aligns with third-person models and revoking it when it does not. To resolve this, consciousness science must choose: either acknowledge that reports are theory-laden behaviors subject to third-person correction (embracing Heterophenomenology fully), or commit to the subject's report as the definitive boundary of the phenomenal, even when it contradicts behavioral models (embracing First-Person Authority). Until this choice is made explicit, the "double standard" will remain a silent, unexamined metaphysics at the core of the data.
