          *   *Determinism:* It's an embarrassment if the propensity is supposed to be objective *and* compatible with hard determinism. It works only if the underlying physics is indeterministic.
          *   *Alternative:* Maybe "Mass" or "Charge"? But those are categorical. Maybe "Temperature"? Temperature is statistical but emergent. A better analogy might be "Radioactivity" itself, but that's just the example. Perhaps the analogy of a "loaded die" vs. "fair die" where the load is the propensity. But the user asks for something without single-track causal direction. Maybe "Information Channel"? No, too epistemic. How about "Potential Energy"? It converts to kinetic but isn't guaranteed to. Actually, the best alternative might be acknowledging there isn't a perfect macroscopic analogy because chance is sui generis. But if forced, maybe "Bias" in a physical system.
