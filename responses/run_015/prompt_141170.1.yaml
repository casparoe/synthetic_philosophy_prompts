      *   *Single Case:* The analogy helps visualize single-case potency, but doesn't explain *what* the potency is without frequency backing. It restates the claim rather than grounding it.
      *   *Demoting Frequency:* It successfully frames frequency as a consequence (manifestation over trials), but struggles with the "non-manifestation is normal" issue.
      *   *Principal Principle:* It helps explain *why* we should match credence (tracking reality), but doesn't solve the epistemic access problem.
      *   *Determinism:* This is the weakest point. Dispositions in deterministic worlds are usually reducible to categorical bases + laws. If chance is a disposition in a deterministic world, is it just ignorance? If irreducible, it conflicts with determinism.

