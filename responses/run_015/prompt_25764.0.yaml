      *   *Carrying Example:* Needs to be something that looks creative but isn't, or something that looks mechanical but reveals depth. A "found object" or a specific constraint-based exercise works well. Let's go with the *Oulipo* constraint vs. Random Generation. Or better: *The Map vs. The Territory*. No, let's try *The Love Letter*. A love letter generated by AI vs. one written by a human. It hits the emotional core. But maybe too cliché? How about *The Mistake*? AI doesn't make meaningful mistakes. Humans do.
