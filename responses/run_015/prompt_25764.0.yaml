      *   *Carrying Example:* **The Apology.** An AI can generate an apology. It cannot *mean* it. It cannot *risk* the relationship. This carries the weight of "art as communication."
      *   *Wait, is "Apology" too interpersonal?* Let's stick closer to craft. **The Revision.** A specific sentence changed ten times. The AI gives the "best" version immediately. The human struggles. The struggle *is* the creativity.
      *   *Decision:* The carrying example will be **The Draft with Marginalia**. A page of a manuscript covered in cross-outs, arrows, coffee stains. vs. A pristine printed page from an LLM.
