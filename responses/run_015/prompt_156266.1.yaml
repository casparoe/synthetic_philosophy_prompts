answer: |-
  This is a precise and devastating critique of how historical narrative is constructed. You have put your finger on a specific rhetorical technology: the word "collapse" is not a neutral description of demographic or material change; it is a **political ontology**. It makes a claim about what kind of thing a society *is* and what counts as its *life*.

  Here is the implicit theory that licenses the practice of talking about "collapse," broken down into its commitments, its competing theoretical underpinnings, and what would need to be rewritten if we abandoned it.

  ### 1. The Implicit Theory: State-Centrism as Existence
  The primary commitment of "collapse" talk is that **the State is synonymous with the Society.**

  When we say "the Maya collapsed," we do not mean the Maya people died (as you noted, they didn't). We mean the *institutional apparatus capable of extracting surplus, monumentalizing power, and keeping written records* ceased to function.
  *   **The Presupposition:** A society only "exists" in the full sense when it is legible to a central authority.
  *   **The Mechanism:** When the cities empty, the state loses its ability to tax and conscript. To the archaeologist looking at monuments, the "civilization" is gone. To the farmer in the hills, the "civilization" (the burden of the state) is gone, but life continues.
  *   **The Commitment:** By using the word "collapse," we commit to the idea that the *capacity for elite extraction* is the vital sign of the culture. If the king stops building, the culture is dead.

  This explains the inconsistency you noticed with Russia, France, or Britain.
  *   **Russia 1917:** The state changed, but the *capacity for centralization and extraction* remained (and intensified). So it wasn't a collapse; it was a revolution.
  *   **Britain's Empire:** The loss of empire did not reduce the complexity or centralization of the British *metropole*. The state remained robust.
  *   **Egypt:** Conquest by Persians/Greeks/Romans meant one *state* replaced another. The apparatus of taxation and bureaucracy remained intact. The "machine" didn't break; the operators changed.

  **Collapse is reserved for when the machine itself breaks, not when the operators are fired.**

  ### 2. The Metric of "Complexity" as Telos
  The second commitment is that **social complexity is the default goal of history.**

  This relies on a hidden, unilineal evolutionary theory (often associated with Joseph Tainter's *The Collapse of Complex Societies*). It assumes that societies naturally tend toward higher energy capture, more hierarchy, and more specialization.
  *   **The Evaluation:** Movement *up* this ladder is "development" or "progress." Movement *down* this ladder is "collapse."
  *   **The Blind Spot:** As your test case highlights, a society can move "down" the complexity ladder (fewer cities, no writing) and move "up" the human welfare ladder (better health, less violence, more autonomy).
  *   **The Theory:** If we call this "collapse," we are theoretically committing to the idea that **monumentality and literacy are inherently more valuable than public health and autonomy.**

  This is why the term is evaluative. "Collapse" implies a failure. If a society voluntarily decentralizes because city life was making them sick (as archaeological evidence from some periods suggests), calling it "collapse" frames a rational adaptation as a pathological failure.

  ### 3. The Epistemology of Legibility (Why the Date?)
  You asked why we need a date. This is an epistemological commitment: **If it isn't written down, it didn't happen.**

  *   **State Time vs. Process Time:** States produce chronicles, king lists, and inscriptions. They create "event horizons." 476 CE is a date because a Roman administrator marked it. The gradual erosion of Roman authority over the preceding 100 years is invisible to the archival record.
  *   **The Bias:** We date "collapse" to the moment the *records stop*, not the moment the *people change*.
  *   **The Consequence:** This creates the illusion of suddenness. A "collapse" looks fast because the *voice of the state* is cut off suddenly. The actual social transformation might take centuries, but because the state was the only thing speaking loudly, its silence sounds like an explosion.

  This explains the hypocrisy regarding descendant communities. To the museum, the "Civilization" ended in 900 CE (when the inscriptions stopped). The living Maya are treated as *descendants* of a dead thing, rather than *continuants* of a living thing. This legal/ontological distinction allows institutions to claim stewardship over the "dead" artifacts while merely "consulting" the living people.

  ### 4. Competing Theories Licensing the Same Talk
  You asked where different theories license the same way of talking. Three distinct frameworks all produce the word "collapse":

  1.  **Systems Theory (Homeostasis):** Society is a machine. If it loses complexity, it has lost energy efficiency. "Collapse" is a system reset. (Neutral/Functional view).
  2.  **Romantic Nationalism:** The "Spirit" of a people is tied to their political sovereignty. If the polity breaks, the people are "broken" until they have a state again. (Emotional/Political view).
  3.  **Malthusian Ecology:** Population exceeded carrying capacity. "Collapse" is the inevitable correction. (Deterministic view).

  All three agree on the *label* ("Collapse") but disagree on the *cause*. However, they all agree on the *symptom*: the disappearance of the centralized state structure.

  ### 5. The Test Case: What Exactly Ended?
  > *Test case: a society empties its cities over two or three generations, gives up writing and long-distance trade, keeps its language and religion, and ends up healthier with longer lifespans. Collapse or change?*

  Under the implicit theory of "collapse": **It is a Collapse.**
  **What ended?** The **Extractive Capacity.**

  What ended was the ability of a specific class of people to compel labor, store grain centrally, and project violence over a distance.
  *   If you define "Society" as "The People," this is **Emancipation**.
  *   If you define "Society" as "The State," this is **Collapse**.

  Archaeology and History, as institutional disciplines, were largely built by and for States. Therefore, they define "Society" as "The State." When the state fails, the narrative requires a tragedy. To call it "Emancipation" would undermine the legitimacy of the state as the highest form of human organization.

  ### 6. What Needs Rewriting?
  If we dropped the idea that a society is the kind of thing that can "end" at a datable moment, we would have to rewrite:

  1.  **The Metaphor of Organicism:** We treat societies like biological organisms that are born, mature, and die. We would need to replace this with a metaphor of **flow or metamorphosis**. Rivers don't "collapse" when they delta; they change form.
  2.  **The Value of Permanence:** We privilege stone monuments and written records as evidence of "success." We would need to privilege **resilience and adaptability**. A culture that survives 3,000 years by remaining oral and flexible is more "successful" than one that burns out in 300 years leaving pyramids.
  3.  **The Subject of History:** We would have to shift the subject from **Polities** (The Maya, The Romans) to **Populations** (The Maya-speaking peoples, The Mediterranean inhabitants).
  4.  **The Definition of Crisis:** We currently define crisis as "threat to the state." We would need to redefine crisis as "threat to human well-being." By this metric, the "Classic Maya Collapse" might be reclassified as the "Post-Classic Maya Recovery."

  ### Summary
  The practice of talking about "collapse" presupposes that **complexity is fragile, centralization is natural, and the state is the soul of the people.**

  It is a conservative vocabulary. It mourns the loss of hierarchy. It treats the dissolution of power as a catastrophe rather than a possibility. When you feel that "bug" in your head, it is because you are sensing the friction between the *continuity of human life* and the *discontinuity of political management*. The word "collapse" asks you to side with the management.
