          *   *Theory:* Historicism/Event-History. We privilege legible events over slow processes.

      *   **Commitment 4: The Evaluative Load (Normativity).**
          *   "Collapse" implies tragedy. "Transition" implies neutrality.
          *   Why? Because the observers value the things that were lost (monuments, trade networks) more than the things gained (health, autonomy).
