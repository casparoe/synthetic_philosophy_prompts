      *   *Address the Addiction Case:* Addiction rewires the brain (like OCD), but using others to feed it often involves deception/manipulation (disregard). If the crime harms you directly to sustain the habit, resentment is natural because you were treated as a resource, not a person. However, pity is also warranted.
      *   *Recommendation:* Keep the sociopath resentment (it protects boundaries). Reconsider the abuse survivor case based on *intent in the moment* (control vs. loss of control).

  5.  **Refining for Word Count & Clarity:**
