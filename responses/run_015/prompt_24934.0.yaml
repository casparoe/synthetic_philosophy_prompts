      *   Addiction: If the crime treats you as a means (theft, harm), resentment is justified because your standing was violated, even if their capacity was diminished.
      *   Advice: Don't drop resentment for the sociopath; it signals boundary violation. For the abuse survivor, distinguish between lashing out (pain) vs. dominating (disregard).

  7.  **Final Polish (checking constraints):**
