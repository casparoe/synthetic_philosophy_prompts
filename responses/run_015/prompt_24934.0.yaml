      *Draft:*
      Your intuitions track a coherent principle: **Resentment is justified when harm expresses disregard for your standing, not merely when it was avoidable.**

      Resentment isn't about metaphysical free will; it's about relational value. When a colleague takes credit or a stranger texts while driving, they prioritize their convenience over your safety or recognition. That disregard warrants resentment. When a friend has a medical emergency or a stranger rushes to the hospital, their action affirms higher values, not disregard for you.

      This explains your mental health cases. Schizophrenia and OCD are experienced as alien intrusions or compulsions *against* the self. The harm doesn't express "I matter more than you"; it expresses "I am losing control." Thus, pity fits, not resentment.

      Antisocial Personality Disorder (ASPD) is different. Even if empathy is impaired, the manipulation is a strategy to prioritize self over others. The action functions as a claim of superiority. Resentment here is a protective signal that your boundaries were violated, regardless of their neural capacity for empathy.

      The abuse survivor case splits you because it blends both. If they scream to dominate or control you, it's disregard (resentment fits). If they scream because they are emotionally flooded and incapable of regulation in that moment (like a panic attack), it's closer to the OCD case (pity fits). Look at the function of the behavior, not just the history.

      **The Addiction Case:**
      Apply the same test. Did the crime treat you as a person or a resource? Addiction diminishes capacity, but if someone steals from you to buy drugs, they are prioritizing their fix over your rights. Resentment is justified because the *action* disregarded you, even if the *cause* was disease. However, recognizing the disease allows you to hold the resentment while still advocating for treatment rather than pure punishment.

      **Verdict:** Keep your resentment for the sociopath and the addict (if they harmed you directly). It protects your sense of worth. For the abuse survivor, distinguish between pain-lashing (accommodate) and control (resent).

