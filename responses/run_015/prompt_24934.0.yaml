      *   Antisocial PD/Abusive Upbringing/Texting/Colleague: The behavior, even if conditioned or hardwired, functions as a *prioritization of self/impulse over you*. It treats you as a means or an obstacle.
      *   Principle: Resentment is justified when the harm reflects a **disregard for your standing**, not merely when it was avoidable.
      *   Wait, the user says the sociopath "literally cannot empathize." Why resent? Because the action still asserts dominance/disregard. The Schizophrenic person's cruelty is a symptom, not a stance. The Sociopath's manipulation is a strategy (even if hardwired).
