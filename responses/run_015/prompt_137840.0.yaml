      *   *Core Claim:* Horizon truncation $\approx$ Delusion (specifically "jumping to conclusions").
      *   *Mechanism:* Expected Free Energy (EFE) = Pragmatic + Epistemic. Truncating horizon reduces Epistemic value relative to Pragmatic.
      *   *Contrast:* Precision (gain on prediction errors) vs. Horizon (depth of planning).
      *   *Vulnerability 1 (Modellers):* Identifiability. Can you mathematically distinguish high precision on priors from a short horizon? Both lead to low exploration.
      *   *Vulnerability 2 (Modellers):* Is horizon a free parameter? In standard AI, it's often fixed or derived. If it's free, is it just another precision parameter?
