          *   *Softness:* No evidence yet that this works.
          *   *Concede:* Speculative, but testable.

      *   *Item 10 (Allied Modeller):* "What about hierarchical depth?" (Anticipated Support).
          *   *Reply:* Horizon truncation might be at the policy level, not the state inference level.
          *   *Note:* This helps distinguish from precision.

  4.  **Refining and Ordering:**
      *   Order by damage. The "Identifiability/Math Equivalence" argument is the most damaging because it kills the theory's scientific status. The "Content" argument is damaging to clinical relevance. The "Beads Task" argument attacks the empirical foundation.
      *   Ensure the tone matches the personas (Modellers = technical/skeptical, Clinicians = practical/patient-focused, Phenomenologist = philosophical).
