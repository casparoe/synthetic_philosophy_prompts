      *   *Item 6 (Modeller - Pipeline Maintainer):* "Is horizon a free parameter?"
          *   *Reply:* In deep temporal models, depth is structural. In planning, it's a computational constraint. We model the constraint as a parameter $\gamma$ (discount).
