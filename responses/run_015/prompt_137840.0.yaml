          *   *Softness:* Hard to distinguish behaviorally without specific tasks.
          *   *Concede:* Acknowledge overlap, distinguish mechanism.

      *   *Item 8 (Skeptic Modeller - Follow up):* "Unfalsifiable."
          *   *Reply:* Falsifiable if we manipulate sampling cost and they *don't* change search behavior.
