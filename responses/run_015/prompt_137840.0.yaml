answer: |-
  # Prep Sheet: Question Period Strategy

  **Ordering Principle:** Items are ranked by potential to invalidate the theoretical contribution or render the proposed study unfeasible.

  ### 1. The Identifiability Challenge
  **Who:** Computational Modeller (Skeptic)
  **Question:** "Mathematically, a steep temporal discount on the epistemic term and a high precision on prior beliefs often yield identical choice probabilities in standard bandit tasks. If the behavioral likelihoods are isomorphic, isn't this just a reinterpretation of the same parameter? How do you distinguish a model where I *can't* see the future from one where I *don't need* to?"
  **Your Reply:** "They are behaviorally indistinguishable in static, one-step tasks, which is why the literature is stuck. They diverge in multi-step tasks where sampling costs vary dynamically. If precision is high, I ignore evidence regardless of cost. If horizon is short, I ignore evidence only if the payoff is delayed. We propose a task where information is free now but costly later, or vice versa. That dissociates the parameters."
  **Softness/Circularity:** Relies entirely on the specific task design working as intended. If subjects perceive 'cost' subjectively, the dissociation collapses.
  **Concession Strategy:** Concede immediately that in standard beads-tasks or static paradigms, they are confounded. Do not claim they are distinct in *all* contexts.
  **Dishonest Flag:** **Yes.** If you claim they are mathematically distinct in *all* generative models, you are lying. They are often degenerate. You must admit the degeneracy exists and is the reason for your new task design.

  ### 2. The Beads-Task Legacy
  **Who:** Clinician (Beads-Task Expert)
  **Question:** "We have thirty years of data showing patients 'jump to conclusions' on the beads task. That literature treats this as a data-gathering deficit or evidence integration bias. You're saying that entire body of work is misinterpreted because they didn't model the horizon? That's a hard sell for grant review."
  **Your Reply:** "I'm not discarding the data; I'm discarding the mechanism. The beads task *looks* like integration, but the stopping rule is actually a decision about whether *another* bead is worth the wait. If we treat the 'draw' as having a hidden time-cost, the 'jumping' looks exactly like horizon truncation. Your data supports the phenomenon; my model updates the latent variable explaining it."
  **Softness/Circularity:** You are retrofitting an explanation to existing data without new evidence yet.
  **Concession Strategy:** Concede that the *phenomenon* (jumping to conclusions) is robust and well-replicated. Only challenge the *parameter* (precision vs. horizon).
  **Dishonest Flag:** No.

  ### 3. The Meaning of Content
  **Who:** Senior Psychiatrist (Phenomenologist)
  **Question:** "You've described a mechanism for fixity, but delusions are about *something*. A patient believes the CIA is poisoning them, not just that they are certain. A content-free model explains why they don't change their mind, but nothing about why they hold that specific belief. What clinical utility is there in ignoring the content?"
  **Your Reply:** "You're right, this model doesn't generate the content. It explains the *resistance to correction*. The content comes from the priors they happen to hold when the horizon truncates. Clinically, this means arguing against the content (standard CBT) fails because the patient isn't weighing the counter-evidence; they aren't looking far enough ahead to value it. We stop trying to change the belief and start trying to extend the horizon."
  **Softness/Circularity:** Admitting the model is "content-free" weakens the claim that it explains "delusion" fully. It only explains the "delusional mood" or fixity.
  **Concession Strategy:** Concede upfront: "This is a model of the *form* of the symptom, not the *theme*."
  **Dishonest Flag:** No.

  ### 4. The Depression Counter-Example
  **Who:** Clinician (Depression Specialist)
  **Question:** "My patients with severe depression do the opposite. They ruminate endlessly and never commit to a policy. If delusion is a truncated horizon, is depression an infinite one? That seems like a convenient just-so story to cover both ends of the spectrum."
  **Your Reply:** "It's not just horizon length; it's the balance between pragmatic and epistemic value. In delusion, pragmatic value dominates immediately. In depression, pragmatic value is flattened (anhedonia), so the agent keeps sampling epistemic information (rumination) hoping to find a rewarding policy that doesn't exist. It's a coupled deficit: low reward precision plus over-valued epistemic gain."
  **Softness/Circularity:** Risks sounding like you can tune the model to fit any behavior post-hoc.
  **Concession Strategy:** Acknowledge that a unified theory of psychopathology is the goal, but this study focuses only on the psychosis end. Don't overclaim on depression.
  **Dishonest Flag:** **Yes.** If you imply you have a fully worked-out model of depression that fits this perfectly, you are overstating. Keep it speculative.

  ### 5. Feasibility and Preregistration
  **Who:** Research Lead
  **Question:** "You want to fit hierarchical Bayesian models on twenty patients. Parameter recovery for temporal discounting and precision simultaneously usually requires hundreds of trials per subject. How do you preregister this without setting yourself up for inconclusive results?"
  **Your Reply:** "We aren't fitting both simultaneously from scratch. We fix the precision priors based on the control group and the existing literature, and only estimate the horizon parameter as the clinical predictor. We've run simulations showing N=20 gives 80% power to detect a group difference on the horizon parameter specifically."
  **Softness/Circularity:** Fixing priors based on literature assumes the literature (which you are critiquing) is correct about precision.
  **Concession Strategy:** Offer to run a pilot power analysis shared with the department before full recruitment.
  **Dishonest Flag:** **Yes.** If you haven't actually run those simulations, do not say you have. Say "Preliminary simulations suggest..."

  ### 6. The "Free Parameter" Objection
  **Who:** Computational Modeller (Pipeline Maintainer)
  **Question:** "In your generative model, is the temporal depth a fixed structural constraint or a free parameter that gets optimized? If it's a free parameter, isn't it just another gain control on the prediction errors, functionally identical to precision?"
  **Your Reply:** "It's a structural constraint on the planning tree, not a gain on the error. Precision scales the *impact* of a prediction error. Horizon scales the *number* of prediction errors considered in the policy evaluation. In the code, one is a scalar on the likelihood, the other is the depth of the recursion."
  **Softness/Circularity:** In deep active inference, depth and precision can trade off during model evidence maximization.
  **Concession Strategy:** Acknowledge that in model selection, they might trade off, which is why we need the specific task design (from Q1) to break that correlation.
  **Dishonest Flag:** No.

  ### 7. The "Hope Nobody Asks" (Impulsivity)
  **Who:** Anyone (But likely the Clinician running trials)
  **Question:** "Isn't this just impulsivity? We already have scales for that. Why do we need a predictive processing account of a construct we can measure with a questionnaire?"
  **Your Reply:** "Impulsivity is a behavioral descriptor; this is a computational mechanism. Two patients can be equally impulsive on a questionnaire: one because they over-weight immediate reward (precision), one because they cannot simulate future states (horizon). They might respond to different interventions. We need the mechanism to target the treatment."
  **Softness/Circularity:** If the interventions turn out to be the same, the distinction is useless.
  **Concession Strategy:** Concede that clinically they look similar. The value is purely in stratifying for treatment response.
  **Dishonest Flag:** No.

  ### 8. Monday Morning Utility
  **Who:** Clinician (General)
  **Question:** "Okay, assume you're right. I have a patient in the ward who is deluded. What do I do differently on Monday that I'm not doing now?"
  **Your Reply:** "Currently, you challenge the evidence. If I'm right, that fails because they don't value future evidence. Instead, you scaffold the horizon: break tasks into immediate, certain rewards for information gathering. You make the 'epistemic act' have an immediate 'pragmatic payoff'. We are testing a protocol that gamifies information seeking."
  **Softness/Circularity:** You do not have evidence this works yet.
  **Concession Strategy:** Be honest: "This is currently theoretical. The study I'm proposing is to validate whether this approach works."
  **Dishonest Flag:** **Yes.** Do not imply this is a proven therapy. It is a hypothesis.

  ### 9. The Allied Objection (Anticipated Support)
  **Who:** Computational Modeller (Pipeline Maintainer)
  **Question:** "If we implement this, are we looking at truncating the policy depth, or are we discounting the expected free energy at deeper nodes? The implementation matters for the pipeline."
  **Why this helps:** This invites you to clarify the technical distinction without attacking the validity. It signals they are willing to build it.
  **Your Reply:** "We discount the EFE at deeper nodes. It keeps the inference structure intact but changes the policy selection. It's easier to implement in your current pipeline than changing the inference depth."
  **Note:** This is your ally. They want the model to work. Use their technical questions to demonstrate rigor to the clinicians.

  ### 10. Falsifiability
  **Who:** Computational Modeller (Skeptic)
  **Question:** "Active Inference is often criticized for being able to explain everything post-hoc. What result in this study would make you abandon the horizon hypothesis?"
  **Your Reply:** "If we manipulate the cost of sampling and the patients' search behavior does not change relative to controls. If they are truly horizon-truncated, making sampling cheap should not increase search. If they are precision-aberrant, making sampling cheap *should* increase search because the evidence is now 'cheaper' to integrate. If the latter happens, my hypothesis is wrong."
  **Softness/Circularity:** Requires the cost manipulation to be perceived as intended.
  **Concession Strategy:** Stand firm here. This is your strongest scientific claim.
  **Dishonest Flag:** No.

  ---

  ### Critical Survival Guide

  **The Single Reply The Proposal Cannot Survive Without:**
  **Item 1 (Identifiability).** If you cannot convince the room that Horizon and Precision are *empirically dissociable* in your proposed task, the project is mathematically redundant. The clinicians will not fund a study to measure a parameter that is just "precision renamed."
  *   **Fallback Position:** If pressed that they are mathematically equivalent in your task, retreat to: "Even if they are formally degenerate, the *interpretation* dictates the intervention. Precision suggests changing belief strength; Horizon suggests changing task structure. We can test the intervention even if the parameter is ambiguous." (This is weaker, but saves the clinical grant).

  **The "Dishonest" Trap to Avoid:**
  Do not claim that **Item 8 (Monday Morning Utility)** is a proven clinical strategy. You are asking them to run a study, not implement a protocol. If you claim this is ready for clinic, the Research Lead will flag it as unethical or premature. Keep it strictly experimental.

  **Your Ally:**
  **The Pipeline Modeller (Item 9).** They are the only one who can validate that your model is implementable. If they nod during the technical questions, the Skeptic Modeller loses traction. Engage them directly on implementation details to show the work is grounded.
