          *   *Why:* Access Internalism needs a "given." It needs *something* that is reflectively accessible to serve as the anchor for justification. If (2) is true (no non-trivial luminous states), then *nothing* is perfectly accessible. If my access to my own pain is subject to margin-for-error principles (Williamson), then my "reflectively accessible factors" are fuzzy. Strict Access Internalism often implies a kind of luminosity for the justifiers.
