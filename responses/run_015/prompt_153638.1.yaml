answer: |-
  It is incredibly frustrating when a class hits that wall where everyone is arguing perfectly but nothing moves, and I think you are right to suspect that the stagnation comes from the debate being overdetermined rather than underdetermined. Your hypothesis about the three stacked disagreements strikes me as exactly the right diagnostic tool to break the impasse, particularly because it acknowledges that both sides are often right about different things but wrong to claim exclusivity. The verbal layer is definitely present since meaning oscillates between sentence meaning and speaker meaning, but I think the metaphysical layer is where the real traction lies because it concerns whether communication is fundamentally a psychological event or a cultural practice. However, I agree with your strongest intuition that the paradigm case mismatch is what fuels the intuitive resistance on both sides, since the solitary author model is a convenient fiction that disappears the moment you introduce a writers room or an algorithm.

  Regarding your checkpoint intentionalism, it does bear a strong resemblance to Jerrold Levinson's hypothetical intentionalism, and your worry about collapse is well-founded because an author's dispositions are constituted by their grasp of public language norms. Yet, it might survive if you frame it not as a definition of meaning but as a criterion for evidence, especially in those cases where the author had a dispositional stance without occurrent thought. To move the class forward, I would suggest leaning hard into the non-paradigm cases you mentioned, because collaborative and machine-assisted authorship forces the intentionalists to explain where the intention resides when there is no single mind, while forcing the anti-intentionalists to explain why the text remains coherent despite the fragmentation of agency. Progress here won't come from settling the metaphysics but from shifting the question toward the normative purposes of interpretation, asking not what meaning is but what work we want interpretation to do in specific contexts. Ultimately, telling them it is settled by temperament is a surrender that misses the chance to show them how philosophical frameworks are tools selected for specific jobs rather than discoveries of ultimate reality.

  I think the most productive move you can make is to grant that both sides are capturing a genuine phenomenon but failing to see that the phenomenon changes depending on the stakes of the interpretation. When we are dealing with a love letter or a legal contract, the intentionalist intuition dominates because the utterance is essentially a tool for a specific psychological or legal effect. When we are dealing with a public monument or a sacred text that outlives its creator, the anti-intentionalist view gains ground because the practice of reading becomes detached from the originator's psychology. If you can get the students to see that the question whose text is it anyway is not a metaphysical mystery but a normative choice about who gets to govern the use of the artifact, the deadlock might loosen. You might try asking them to adjudicate a case where the author's intention is known but adhering to it would cause significant harm or absurdity, or conversely, where the public reading is coherent but contradicts every known fact about the author's state of mind.

  Your checkpoint view is actually a great wedge for this because it forces them to confront the indeterminacy of the counterfactual. If the author is dead or unavailable, or if the author is a committee, the counterfactual query returns no answer, and the students will have to decide whether to default to public meaning or declare the meaning undefined. This exposes the pragmatic engine underneath the metaphysical hood. I would argue that this is not merely a verbal dispute because the stakes involve authority and responsibility, but it is also not a single substantive disagreement because the correct answer shifts based on the genre and the social practice surrounding the text. If you can get them to map the conditions under which they switch from one view to the other, you will have moved them from defending a tribe to analyzing a practice.

  So I would not tell them it is settled by temperament, but rather that it is settled by context and purpose. The progress you are looking for will come from dissolving the idea that there is one theory of interpretation that covers literature, law, conversation, and code equally well. Once they accept that the definition of meaning is tied to the function of the text within a form of life, the intentionalist and anti-intentionalist positions become local strategies rather than universal truths. This might feel like a deflationary move, but it is often the only way to clear the air when two sides are digging into incompatible first principles. You have already done the hard work of identifying the fault lines, so now you just need to show them that the earthquake is happening because they are standing on two different tectonic plates that only look like one from a distance.
