answer: |-
  You have identified a real, documented tension in how humans reason about cause and blame, but you are right to suspect it doesn't sit neatly under a single label. You are observing a conflation of **causal attribution** (what physically brought about an event) and **normative attribution** (who was responsible for preventing it).

  In philosophy and legal theory, this is often discussed under the umbrella of **Causation by Omission**, but your specific observation about the *expansion of duty* when causal links are challenged is a more specific, less frequently named mechanism.

  Here is the carving you asked for.

  ### 1. The Carving: Three Nearby Concepts

  Your observation is a hybrid of three established ideas. It is not one thing, but the way they interact in your board's discourse creates the pattern you see.

  **A. The Knobe Effect (Side-Effect Effect)**
  *   **What it is:** Experimental philosophy (specifically Joshua Knobe's work) shows that people's judgment of *descriptive* facts (like "did he intend to do this?") is influenced by *normative* judgments (like "was this bad?"). If a CEO harms the environment to make profit, people say he "intentionally" harmed it. If he helps the environment to make profit, people say he "unintentionally" helped it.
  *   **How it fits:** This explains Case 3 (the group project). You aren't finding the cause; you are selecting the cause based on who you already want to blame ("already annoyed with"). The badness of the outcome drives the causal selection.
  *   **How it differs:** The Knobe Effect usually applies to *intent*. Your board is applying it to *causation* itself. You are saying "X caused Y" when you really mean "X is the appropriate target for fixing Y."

  **B. The Problem of Many Hands (Collective Responsibility)**
  *   **What it is:** A concept from political philosophy (Dennis Thompson) describing situations where an outcome is produced by many contributors, making it impossible to pin the harm on any single individual, yet the harm clearly happened.
  *   **How it fits:** This explains Case 2 (the hallway fight). The causal claim "floats upward" because the physical causality is distributed. No single passer-by caused the injury, but the *group's* failure to act created the environment for it.
  *   **How it differs:** Usually, philosophers argue this dissolves individual responsibility. Your board keeps the responsibility but refuses to locate it. You are treating the *collective* as a causal agent without granting it individual membership.

  **C. Proximate Cause vs. Cause in Fact (Legal Theory)**
  *   **What it is:** In law, "cause in fact" is the physical chain (but-for causation). "Proximate cause" is a policy decision about how far back we trace responsibility.
  *   **How it fits:** This explains Case 1 (the teacher). When you challenged the *cause in fact* (students could have gotten in anyway), the board didn't retreat. They expanded the *proximate cause* (the teacher's duty). They shifted from "He caused this by leaving it unlocked" to "He caused this by failing to guarantee security."
  *   **How it differs:** Law usually keeps these distinct. Your board is collapsing them. They are using the *strength of the duty* to prove the *strength of the causation*.

  ### 2. The Best Fit: "Normative Causal Selection"

  There is no single standard term for the specific mechanic you noticed (where duty expands to cover causal gaps). I recommend calling it **Normative Causal Selection**.

  It works like this:
  1.  **Premise:** A bad thing happened.
  2.  **Search:** Who had a duty to prevent it?
  3.  **Conflict:** Did their action/inaction physically determine the outcome?
  4.  **Resolution:** If the physical link is weak, strengthen the duty description until the link feels strong again.

  This is distinct from standard "Causation by Omission" because standard omission relies on counterfactuals (If he had locked it, would it have stopped?). Your board is ignoring the counterfactual and relying on the **Norm**.

  **Does this happen with actions (commission) or just omissions?**
  It happens primarily with omissions.
  *   **Why:** If I punch you, the physical link is undeniable. My duty not to punch you is secondary to the fact that my fist moved your face.
  *   **With Omissions:** If I *don't* punch you, there is no physical event to point to. The only thing that makes my "not-punching" a cause of anything is the *expectation* that I should have. Therefore, the causal claim is entirely dependent on the normative claim. When the norm is challenged, the causation collapses. In your board's case, they are reinforcing the norm to save the causation.

  ### 3. The Test: A Pair of Hypothetical Cases

  To determine if you have found one unified phenomenon (Normative Causal Selection) or two separate ones (Duty Inflation vs. Collective Floating), run this thought experiment in your next board meeting (or discuss it with your peers).

  **Case A: The Useless Guard (Tests Duty Inflation)**
  > A security guard is paid to watch a door. He falls asleep. A thief picks the lock and enters.
  > *Challenge:* "The lock was broken. Even if the guard was awake, he couldn't have stopped the thief without a weapon."
  > *Prediction:* If your theory is right, the board will say: "He caused the breach because he should have had a weapon/called police/woken up sooner." The duty expands to cover the causal gap.

  **Case B: The Capable Stranger (Tests Collective/Individual)**
  > A security guard is paid to watch a door. He is awake. A thief picks the lock. A student walks by, sees the thief, could easily trip him, but doesn't. The thief enters.
  > *Challenge:* "The student could have stopped it easier than the guard."
  > *Prediction:* If your theory is right, the board will say: "The student didn't *cause* the breach, only the guard did."

  **The Diagnostic:**
  *   If you blame the **Guard in Case A** (despite no physical ability to stop it) but **not the Student in Case B** (despite physical ability to stop it), you have confirmed **Normative Causal Selection**. Causation is tracking *Duty*, not *Difference-Making*.
  *   If you blame **both**, you are simply tracking **Counterfactual Dependence** (who could have changed the outcome).
  *   If you blame **neither**, you are tracking **Physical Mechanism** (who physically opened the door).

  ### 4. Confidence and Contested Claims

  **High Confidence:**
  *   That you are observing a real pattern. The conflation of blame and cause is well-documented in psychology and legal theory.
  *   That this pattern is stronger in omissions than commissions. (It is much harder to say "his breathing caused the fire" than "his failure to extinguish caused the fire," even if both are physically true).

  **Medium Confidence:**
  *   That "Normative Causal Selection" is the best label. Philosophers argue endlessly about whether causation *is* normative or just *influenced* by norms. I am taking the pragmatic view that for your board, they are functionally identical.

  **Contested Claim (Ordinary Language):**
  *   The claim that ordinary speakers (like your board) are using the word "cause" incorrectly rests on the assumption that "cause" has a descriptive meaning separate from "blame."
  *   **The Contest:** Some philosophers (like Jonathan Schaffer) argue that causation *is* contrastive and sensitive to norms by definition. They would say your board isn't making a mistake; they are correctly identifying the "salient cause."
  *   **My Stance:** I lean toward the view that there is a distinction, but I acknowledge that in social contexts, the distinction is often useless. Your board isn't trying to write a physics paper; they are trying to assign maintenance tasks.

  ### 5. What Would Change My Mind

  **If I think Duty is doing the work:**
  *   **Falsification:** Show me a case where the board assigns causation to someone who had **no duty** and **no prior annoyance**, simply because they were the most efficient preventer. (e.g., blaming the student in Case B above). If they do that, then they are tracking *Efficiency*, not *Duty*.

  **If I think this collapses into "Causation by Omission":**
  *   **Falsification:** Show me a case where the board *withdraws* a causal claim when the counterfactual is challenged, *without* expanding the duty. (e.g., "Oh, the lock was broken? Then the teacher didn't cause it.") If they do this consistently, then they are standard counterfactual reasoners, and your observation of "Duty Inflation" is just an anomaly of Case 1.

  **If I think this is genuinely new (or at least under-named):**
  *   **Falsification:** If you find a paper that explicitly describes the **"Obligation Expansion Mechanism."** There is plenty on "Moral Luck" and "The Knobe Effect," but the specific move of *strengthening the description of the duty to preserve the causal claim* is a specific rhetorical maneuver I haven't seen codified. If you find it in Hart & Honoré's *Causation in the Law* (1959) or recent experimental philosophy papers on "Causal Superseding," then it is established. If not, you have carved out a specific sub-mechanism of normative causation.

  ### Summary for Your Notes

  You are not imagining this. Your board is engaging in **Normative Causal Selection**. They are using the word "cause" to mean "the agent whose duty-bound intervention would have been the most normatively appropriate place to prevent this," regardless of physical certainty.

  *   **Case 1** is **Duty Inflation** (strengthening the norm to save the cause).
  *   **Case 2** is **Distributed Agency** (the collective holds the duty, individuals do not).
  *   **Case 3** is **Motivated Causal Selection** (the cause is chosen to fit the desired blame).

  These are three facets of the same gem: **Causation as a Tool for Social Maintenance, not Physical Description.**

  Use the **Guard vs. Stranger** hypothetical to test if Duty or Physics is driving the bus. If they blame the sleeping guard who couldn't help, but not the awake stranger who could, you have proven that for your board, **Cause = Breach of Duty.**
