answer: |-
  I reject step (6). This step conflates the conditions for *basic desert* (blame/praise) with the conditions for *moral evaluation* (better/worse). Strawson's Basic Argument successfully undermines ultimate responsibility because desert seems to require being the ultimate cause of oneself. However, judging a character as "better" or "worse" does not require metaphysical authorship; it requires only that the character has specific qualities relative to human flourishing or harm.

  Consider your ouroboros agent. Even if she didn't create herself *ex nihilo*, her deliberate self-revision demonstrates a capacity for rationality and alignment with values that a non-revising agent lacks. We can evaluate that capacity as "better" without claiming she deserves credit in a cosmic sense. Step (6) assumes that if I didn't create my nature, my nature cannot be evaluated. But we evaluate storms as "destructive" and medicines as "healing" without asking if they chose their properties. Moral evaluation can function similarly: identifying traits that promote or hinder well-being.

  By rejecting (6), you avoid the nihilism of (7) while keeping the hard incompatibilist insight of (5). You concede that no one *deserves* punishment or reward in a retributive sense (satisfying Strawson), but you maintain that some lives are objectively more virtuous, kind, or harmful than others. This preserves the point of moral discussion: not to mete out cosmic justice, but to understand, navigate, and encourage beneficial traits.

  What Strawson loses is the dramatic claim that morality itself vanishes without ultimate responsibility. He retains the impossibility of retributive blame, which is his main target. What you gain is a coherent ethical framework that doesn't collapse into "only harm matters." You can still say courage is better than cowardice, even if neither is ultimately authored. This shifts morality from a ledger of debts to a map of human functioning.

  Your worry about losing desert is valid if morality is purely retributive. But if morality is also about guidance and flourishing, desert is optional. Your tutor wants you to read the literature because compatibilists attack (2) and hard incompatibilists refine (6). Since you accept (5), engaging with the "moral luck" and "forward-looking responsibility" literature (like Pereboom or Scanlon) will show you how to sustain evaluation without desert. You don't need to abandon moral assessment; you just need to redefine its purpose from assigning cosmic blame to navigating human life.
