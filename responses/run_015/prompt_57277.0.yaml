answer: |-
  This is a sharp intuition. You are spotting the isomorphism between socio-ecological systems (SES) theory and the actual dynamical systems math you use for lakes. The archaeologists are describing bifurcations, but they are arguing over the *boundary conditions* and the *state variables*.

  Here is the translation of the "Collapse vs. Reorganization" debate into your resilience vocabulary, case by case, followed by the residue report and the verdict on the decoupling problem.

  ---

  ### 1. Case Translations

  #### Late Bronze Age (LBA) Eastern Mediterranean (~1200 BCE)
  *   **The Archaeological Debate:** The "Palace System" (redistributive economies, international trade, literacy) vanishes. But village-level agriculture and pottery styles show continuity. Did the system collapse or just shed complexity?
  *   **Resilience Translation:** This is a **cascade failure in a coupled network**. The "Palace" nodes acted as high-connectivity hubs stabilizing the trade network.
      *   **The Shift:** The system moved from a *High-Connectivity/High-Energy* basin (Palace Economy) to a *Low-Connectivity/Low-Energy* basin (Village Agrarianism).
      *   **Hysteresis:** The return to palace economies took centuries (Greek Dark Ages), implying the threshold to re-establish high-connectivity trade was much higher than the threshold to maintain it.
      *   **[STRETCH]:** In your lake models, the water is the medium. In the LBA, the "medium" is political trust and credit. Modeling "trust" as a state variable subject to CSD is theoretically possible but empirically unmeasurable in the paleo-record.
      *   **[FORCED FIT]:** Treating the Eastern Mediterranean as a single "system" with one basin. It was a network of distinct basins (Hittite, Egyptian, Mycenaean) that were tightly coupled. The collapse might have been a **synchronization of regime shifts** across distinct basins due to coupling strength, not a single system tipping.

  #### Classic Maya Southern Lowlands (~800–950 CE)
  *   **The Archaeological Debate:** Monumental construction stops, dynasties end, southern cities abandoned. But populations persist in some areas, and the culture shifts north. Was it ecological collapse or political fragmentation?
  *   **Resilience Translation:** This looks like **critical slowing down (CSD) driven by external forcing**.
      *   **The Signal:** Paleoclimate data (stalagmites) show increased variance and autocorrelation in drought cycles leading up to the abandonment. This is your classic EWS.
      *   **The Shift:** The system crossed a threshold where the energy cost of maintaining the "Divine King" legitimacy (monuments, warfare) exceeded the agricultural surplus yield under drought conditions.
      *   **[STRETCH]:** Spatial heterogeneity. Your lake models usually assume spatial homogeneity or simple diffusion. The Maya "collapse" was a spatial wave. The southern basin became shallow (low resilience), and the population flowed to the northern basin (which had deeper wells/cenotes). This is less a *tipping point* and more a **metapopulation shift**.
      *   **[FORCED FIT]:** Equating "monument construction rate" with "system state." In a lake, chlorophyll *is* the state. In Maya society, monuments are an *output* of the state (legitimacy). If the output stops, has the state changed, or just the control parameter?

  #### Rapa Nui (Easter Island)
  *   **The Archaeological Debate:** Old view: Ecocide/overshoot (population crashes after deforestation). New view: Adaptation (lithic mulching, shifted crops, population stabilizes).
  *   **Resilience Translation:** This is the **Adaptive Cycle** in action.
      *   **The Shift:** The "Old View" is a classic overshoot and collapse (foliation → deforestation → starvation → population crash). The "New View" is a **resilience-building feedback**. The society detected the approaching threshold (soil depletion) and altered the system parameters (lithic mulch) to deepen the basin of attraction for the agrarian state.
      *   **[STRETCH]:** Timescale mismatch. Your CSD signals operate on the order of generations/years. Rapa Nui adaptation operated over centuries. The "noise" in your time series is measurement error; the "noise" here is generational memory and cultural transmission lag.
      *   **[FORCED FIT]:** Assuming a closed system. Resilience models often assume closed boundaries. Rapa Nui is the ultimate closed system physically, but the "collapse" argument often ignores that the *definition* of collapse changes when you realize they didn't starve. If the biomass didn't crash, did the system tip? Or did the *cultural expression* of the system tip?

  ---

  ### 2. The Decoupling Problem: Elite vs. Commoner Basins

  You asked specifically about the argument that the elite system collapsed while the farming majority persisted.

  **Can a basin-of-attraction picture put that?**
  Yes, but only if you abandon the idea of a single state variable for "Society."

  **Mapping Option A: Nested Panarchy (The "Good" Fit)**
  You model this as two nested adaptive cycles.
  *   **Fast/Small Cycle:** Household agriculture (resilient, fast recovery).
  *   **Slow/Large Cycle:** Dynastic/Palace structure (brittle, slow recovery).
  *   **The Event:** The Slow Cycle tips into a new basin (feudalism/village life). The Fast Cycle stays in its original basin or shifts slightly but remains functional.
  *   **Verdict:** This fits Panarchy theory (Holling/Gunderson) perfectly. The "Collapse" is just the release phase ($\Omega$) of the larger, slower cycle, which does not necessarily drag the smaller cycle down with it.

  **Mapping Option B: Coupled Subsystems (The "Hard" Fit)**
  You model Elite ($E$) and Commoner ($C$) as two coupled differential equations.
  *   $\frac{dE}{dt} = f(E, C, \text{Resources})$
  *   $\frac{dC}{dt} = g(C, \text{Resources})$
  *   **The Event:** The coupling term weakens. $E$ crashes because it depends on surplus extraction from $C$. $C$ persists because it depends only on Resources.
  *   **[CRITICAL STRETCH]:** In your fisheries models, the predator *must* eat the prey. If the predator dies, the system state *has* changed fundamentally. In archaeology, the "Elite" are often viewed as parasitic or superfluous by the "Commoners." If the parasite dies, the host thrives.
  *   **The Problem:** In resilience theory, a regime shift is usually "bad" (loss of ecosystem services). Here, the regime shift (loss of elites) might be *neutral or beneficial* for the majority state variable (caloric intake). Your framework assumes the shift is a loss of function. The archaeologists argue the function (living) continued; only the *governance structure* changed.

  **Does your framework have anywhere to put this?**
  It puts it in **State Variable Definition**.
  If your state variable is $V = \text{Centralization}$, then Collapse = True.
  If your state variable is $V = \text{Population Density}$, then Collapse = False.
  The debate isn't about the dynamics; it's about **which variable defines the system identity.** Resilience theory is mathematically agnostic to this, but practically, modelers usually pick the variable that *crashes* as the one to study.

  ---

  ### 3. Residue Report: What Doesn't Fit

  Here is what remains after you pour the archaeological data into your resilience mold.

  1.  **Agency and Legitimacy (The "Meaning" Residue):**
      *   **Your Model:** Variables change due to feedback loops and external forcing.
      *   **Archaeology:** Systems change because people *stop believing* in the king. Legitimacy is a non-linear switch. If the king fails to bring rain, the coupling between Elite and Commoner snaps.
      *   **The Gap:** You can model "Trust" as a stock, but you cannot easily model the *semiotics* of collapse. A statue toppling is a signal that changes the basin depth for everyone observing it. Your models don't typically include "observation of the state" as a feedback on the "state itself" (reflexivity).

  2.  **The "Collapse" Label is Normative:**
      *   **Your Model:** A regime shift is a transition between stable states. State A is not inherently "better" than State B, just different.
      *   **Archaeology:** "Collapse" implies a loss of *complexity* or *darkness*. It is a value judgment.
      *   **The Gap:** When archaeologists argue "Reorganization not Collapse," they are arguing about *identity*, not dynamics. They are saying, "The things we value (writing, stone) stopped, but the things that matter (people, food) didn't." Your framework treats these as equal state variables. It cannot resolve the normative conflict without an external utility function.

  3.  **Data Sparsity vs. CSD:**
      *   **Your Model:** You need high-frequency time series to detect rising autocorrelation (AR(1)) and variance before the tip.
      *   **Archaeology:** Data points are decades or centuries apart.
      *   **The Gap:** You cannot statistically validate CSD in most archaeological records. You are inferring the bifurcation *post hoc*. This makes the resilience claim a metaphor, not a validated model.

  ---

  ### 4. The Verdict

  **Does the missing piece show your vocabulary is too thin, or does it show the archaeologists' concept of collapse was never coherent to begin with?**

  **Verdict:** The archaeologists' concept of "Collapse" is incoherent *until* mapped onto a framework like yours.

  "Collapse" in archaeology is a portmanteau of three distinct dynamical phenomena:
  1.  **Loss of Resilience:** The system becomes brittle (CSD).
  2.  **Regime Shift:** The system moves to a new basin (Complexity drops).
  3.  **Identity Loss:** The specific cultural markers (elites, writing) vanish.

  Your vocabulary is not too thin; it is **more precise** than theirs. The friction you feel is the friction of precision meeting ambiguity. The "Decoupling" argument is simply an admission that they were measuring the wrong state variable (Elite Complexity) for the wrong system boundary (The Whole Population).

  **However,** your vocabulary is too thin on **Reflexivity**. You model lakes; lakes do not care if they are eutrophic. Humans care if they are colonized. The "Decoupling" works because the Commoners *actively decoupled*. They withdrew legitimacy. That is a control parameter change driven by cognition, not just resource depletion. Standard resilience models treat parameters as external forcings (climate, nutrient load). They rarely treat parameters as *internal strategic choices* by subsystems.

  ---

  ### 5. Conditions for Concession

  **What would make me concede these really are the same phenomenon?**
  If you can demonstrate **Early Warning Signals** in the archaeological record that *precede* the collapse event with statistical significance comparable to your lake/fisheries data.
  *   *Specifically:* If you can show rising variance in settlement sizes or pottery standardization 100 years before a palace burns, you prove the social system obeys the same bifurcation math as a eutrophying lake. (Some work by Tim Kohler on Anasazi does this; it is rare).

  **Where is my mapping most likely to be wrong?**
  On the **Timescale of Recovery (Hysteresis)**.
  In lakes, recovery can take decades. In these social systems, the "return path" to the previous basin (e.g., re-establishing Bronze Age trade networks) took 500+ years or never happened.
  *   *Why this breaks the model:* In your models, the landscape potential usually stays static; the ball rolls back if the forcing reverses. In history, the *landscape itself changes* (knowledge loss, genetic bottlenecks, soil erosion). The basin doesn't just shallow; it *moves* or *disappears*. This is **path dependence** on a scale that makes the "stable state" concept slippery. If the system never returns, was it a stable state, or just a transient trajectory?

  **Final Instruction:**
  Use your framework to discipline their definitions. Force them to specify:
  1.  What is the **State Variable**? (Population? Complexity? Energy capture?)
  2.  What is the **Control Parameter**? (Drought? Soil? Legitimacy?)
  3.  What is the **System Boundary**? (The Palace? The Valley? The Trade Network?)

  If they cannot define those three, "Collapse" is just a story. If they can, you can model it. The "Decoupling" is simply a declaration that the System Boundary for the Elite does not match the System Boundary for the Commoners. Model them as two coupled basins, and the paradox dissolves.
