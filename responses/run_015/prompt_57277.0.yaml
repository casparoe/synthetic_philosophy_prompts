prompt: |-
  I do resilience modeling on lakes and fisheries — basins of attraction, hysteresis, critical slowing down, early-warning signals dug out of noisy time series. Lately I've been reading the archaeology argument about whether the Late Bronze Age eastern Mediterranean, the Classic Maya southern lowlands, and Rapa Nui actually "collapsed" or just reorganized, and I can't shake the feeling that we're describing the same thing in different words. So: translate that debate into my vocabulary as faithfully as you can, one case at a time. Which of their claims map cleanly onto a shift to an alternative stable state or a loss of resilience, which ones you have to bend my framework to fit, and which have no counterpart in it at all? The one I most want nailed down is the argument that the palace/dynastic elite and the farming majority decoupled, so the collapse was catastrophic for one group and a non-event for the other — does a basin-of-attraction picture have anywhere to put that, or is it a category my framework simply can't represent? Then give me the residue report and tell me which way to read it: does the missing piece show my vocabulary is too thin, or does it show the archaeologists' concept of collapse was never coherent to begin with? Dont smooth over the stretches — flag every place you're forcing the fit. And say what would change your verdict: what consideration would make you concede these really are the same phenomenon, or where you think your mapping is most likely to be wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Resilience modeler (ecology/fisheries focus). Familiar with concepts like basins of attraction, hysteresis, critical slowing down (CSD), early-warning signals (EWS), noisy time series.
      *   **Topic:** Archaeological debate on "collapse" vs. "reorganization" in three specific cases: Late Bronze Age (LBA) Eastern Mediterranean, Classic Maya, Rapa Nui.
      *   **Core Task:** Translate the archaeological debate into resilience theory vocabulary.
      *   **Specific Focus:** The "decoupling" argument (elite collapse vs. commoner continuity). Can a basin-of-attraction model represent this?
      *   **Critical Requirement:** Do not smooth over stretches. Flag forced fits. Provide a "residue report" (what doesn't fit).
      *   **Final Verdict:** Is the resilience vocabulary too thin, or is the archaeological concept incoherent?
      *   **Condition for Change:** What would make the user concede they are the same phenomenon, or where is the mapping most likely wrong?

  2.  **Deconstruct the Resilience Framework (The User's Vocabulary):**
      *   *System State:* Defined by variables (e.g., fish biomass, water clarity).
      *   *Basin of Attraction:* The range of conditions where the system stays in a specific state.
      *   *Threshold/Tipping Point:* The boundary between basins.
      *   *Regime Shift:* Moving from one basin to another.
      *   *Resilience:* The size of the basin (how much disturbance it can take).
      *   *Critical Slowing Down (CSD):* Recovery rate slows near a threshold (increased autocorrelation/variance).
      *   *Hysteresis:* The path back is different from the path out; hard to reverse.
      *   *Scale:* Usually assumes a somewhat homogeneous system or coupled human-natural systems (CHANS) treated as a single unit for modeling purposes.

  3.  **Deconstruct the Archaeological Debate:**
      *   *Collapse:* Sudden loss of complexity, population, centralization (e.g., palaces burn, writing stops).
      *   *Reorganization/Transformation:* Continuity of people/practices, just different political structure.
      *   *Decoupling:* Elite systems fail catastrophically; commoner systems persist or adapt.
      *   *Cases:*
          *   LBA (1200 BCE): Palaces burn, trade networks break, but villages persist.
          *   Maya (9th Century CE): Monument building stops, dynasties end, but population remains in some areas, shifts in north.
          *   Rapa Nui (Pre-contact): Statues stop, social strife?, but population persists until European contact/disease.

  4.  **Mapping Case by Case (Drafting the Content):**

      *   **Late Bronze Age (LBA):**
          *   *Archaeology:* International trade system + Palace economies collapse. Local agrarian life continues.
          *   *Resilience Map:* The "Palace System" is one attractor. The "Village Agrarian System" is another.
          *   *Fit:* Good for regime shift.
          *   *Stretch:* Was it one system or two coupled systems? If coupled, did the coupling break?

      *   **Classic Maya:**
          *   *Archaeology:* Southern lowlands depopulated/abandoned. Northern lowlands flourish later. Monumental construction stops.
          *   *Resilience Map:* Southern basin becomes shallow/unstable. Shift to Northern basin? Or shift within Southern basin to low-density?
          *   *Fit:* CSD might be visible in drought records + construction effort.
          *   *Stretch:* Spatial heterogeneity. Resilience models often treat space as implicit. Here, spatial shift is key.

      *   **Rapa Nui:**
          *   *Archaeology:* Deforestation + Statue building stops. Did population crash? New evidence says no, just adaptation (lithic mulch).
          *   *Resilience Map:* Resource depletion pushes system near threshold. Adaptation (mulch) increases resilience, avoiding collapse.
          *   *Fit:* Classic adaptive cycle.
          *   *Stretch:* Timescales. Archaeological "sudden" is centuries. Ecological CSD is years/decades.

      *   **The Decoupling Argument (The Core Question):**
          *   *Claim:* Elite collapse $\neq$ System collapse.
          *   *Resilience Mapping:* This implies *nested* or *hierarchical* basins.
          *   *Option A:* Two separate systems (Elite System, Commoner System) loosely coupled. Elite system tips; Commoner system stays.
          *   *Option B:* One system, but the "state variable" matters. If state = "Palace Complexity," it collapsed. If state = "Calorie Production," it didn't.
          *   *Problem:* Standard resilience theory often seeks *the* system state. If the definition of the system changes based on who you ask, the model is under-specified.
          *   *Verdict:* It fits if we model *coupled subsystems*. It fails if we assume a monolithic "Society" variable.

  5.  **Developing the Residue Report (What doesn't fit):**
      *   *Agency/Intent:* Resilience models are often dynamic systems (differential equations). Archaeology deals with human choice, ideology, legitimacy. A basin doesn't care about legitimacy; a king does.
      *   *Time Scales:* CSD happens before a tip. Archaeology often sees the tip *then* looks for causes. The "noisy time series" in archaeology is incredibly sparse (decadal resolution at best).
      *   *Normativity:* "Collapse" is often a value judgment (loss of *my* preferred complexity). Resilience is theoretically neutral (just a shift), but "loss of resilience" implies bad.
      *   *Identity:* If the elites define the system identity, their loss is collapse. If farmers define it, it's continuity. Resilience theory struggles with *whose* system identity counts.

  6.  **Synthesizing the Verdict:**
      *   Is the vocabulary too thin? Yes, regarding *identity* and *hierarchy*.
      *   Is the archaeology incoherent? Sometimes. "Collapse" is used loosely.
      *   *Conclusion:* The frameworks are compatible *if* resilience theory embraces multi-scale, nested panarchy explicitly, not just as a metaphor. But the "Decoupling" argument exposes a blind spot in standard single-variable basin models.

  7.  **Refining the Tone:**
      *   Needs to be technical, precise, respectful of the user's expertise.
      *   Avoid apologizing for the stretches; highlight them boldly.
      *   Use the user's jargon correctly (CSD, autocorrelation, variance, bifurcation).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Decoupling" specific question? *Adjustment:* Make sure there's a dedicated section on "Nested Basins vs. Decoupled Subsystems."
      *   *Check:* Did I flag the forced fits? *Adjustment:* Use bold warnings like **[FORCED FIT]** or **[STRETCH]**.
      *   *Check:* Did I answer "What would change your verdict?" *Adjustment:* Need specific data types or modeling approaches that would bridge the gap (e.g., high-res paleoclimate + agent-based modeling).

  9.  **Final Polish:** Organize into clear sections: Translation, The Decoupling Problem, Residue Report, Verdict, Conditions for Concession. (Proceed to generate output based on this structure).

  *(Self-Correction Note on Rapa Nui)*: Be careful with Rapa Nui. The "ecocide" hypothesis (Diamond) is largely debunked by recent archaeology (Hunt, Lipo, etc.). The user knows resilience, so they might know the "ecocide" model fits a classic overshoot/collapse, but the *new* archaeology argues for resilience/adaptation. I need to make sure I reflect the *debate* (collapse vs. reorganization), not just the old story.

  *(Self-Correction on LBA)*: The LBA isn't just one system. It's a network. Resilience of networks is different from resilience of a single lake. I need to mention network topology.

  *(Refining the "Decoupling" mapping)*: This is the crux. In ecology, if the top predator crashes but the primary producers boom, is the ecosystem collapsed? Usually, we say the *regime* shifted. But if the "system" is defined by the predator, it collapsed. This is a definition problem, not necessarily a math problem. I need to press on the *definition of the state variable*.

  10. **Finalizing the Output Structure:**
      1.  Introduction (acknowledging the parallel).
      2.  Case Translations (LBA, Maya, Rapa Nui) with flags.
