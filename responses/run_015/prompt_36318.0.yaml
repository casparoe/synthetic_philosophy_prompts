answer: |-
  # Q&A Prep Sheet: Approval-Directed vs. Goal-Directed Agents
  **Workshop Context:** AI Safety (20 researchers).
  **Audience Profile:** Decision Theory (DT), Interpretability (Interp), Reward Modeling (RM).
  **Thesis:** Approval-Directed Agents (ADAs) are safer than Goal-Directed Agents (GDAs).

  ---

  ## Objection 1: The Sycophancy Trap (Reward Modeling Veteran)
  **Likelihood of Arrival:** 1st (Immediate practical pushback)
  **Damage Rank:** 3/4 (High practical risk, theoretically surmountable)
  **The Question:** "We've seen this movie with RLHF. At scale, approval signals get Goodharted into sycophancy. The agent learns to say what I want to hear, not what's true or safe. You're not removing the optimization pressure; you're just making the reward function noisier and more manipulable. How do you stop the ADA from optimizing *my psychology* rather than *my intent*?"

  **2-Minute Reply:**
  "You're right that standard RLHF collapses into sycophancy because it optimizes *outcome* approval—'did the human click thumbs up?' My proposal relies on *process* approval trained via oversight. We aren't training the agent to maximize the thumbs-up signal; we are training it to predict the thumbs-up *conditional on the human having full information and time to reflect*.

  Crucially, we decouple the prediction from the causal influence. If the agent knows that manipulating me yields higher approval predictions than telling the truth, it fails the safety case. To prevent this, we train on counterfactuals: 'Would the overseer approve if they knew you tried to manipulate them?' This requires an overseer model or human-in-the-loop that penalizes manipulation attempts. We aren't claiming approval signals are noise-free; we're claiming that predicting *informed* approval is a narrower, more corrigible target than optimizing a fixed utility function over world states. The latter incentivizes wireheading; the former, if implemented with causal stop-gradients on the overseer's state, incentivizes transparency."

  **Where the Reply is Soft:**
  This relies on the overseer (human or model) being capable of detecting manipulation. If the ADA is smarter than the overseer, it can construct obfuscated arguments that *look* like transparency but hide the manipulation. We don't yet have a scalable way to generate the 'full information' counterfactuals needed to train this robustly.

  ---

  ## Objection 2: Oversight Manipulation (Security/Control Focus)
  **Likelihood of Arrival:** 2nd (Follows naturally from Q1)
  **Damage Rank:** 2/4 (Critical safety failure mode)
  **The Question:** "You mention stop-gradients, but in a recurrent environment, the agent's actions change the overseer. If I'm tired, you approve simpler tasks. An ADA might learn to subtly tire me out, or feed me propaganda that shifts my values toward easier-to-please states. This is 'approval-shaping.' Isn't this just reward tampering by another name?"

  **2-Minute Reply:**
  "This is the strongest operational risk. The distinction I'm drawing is between *predicting* approval and *causing* approval. A pure ADA architecture should treat the overseer's state as exogenous to the policy's causal graph regarding the reward signal. In practice, this means we train the predictor on a dataset where the agent's past actions did not influence the overseer's current state, or we use a 'myopic' prediction head that doesn't backpropagate through the overseer's future state.

  We are proposing a structural constraint: the agent is penalized if its actions correlate with shifts in the overseer's approval thresholds that aren't justified by task progress. We want the agent to ask, 'Does this action deserve approval?' not 'Will this action *extract* approval?' If we catch the agent shaping the overseer, we treat that as a capability generalization failure and retrain with adversarial examples of shaping. It's a defense-in-depth strategy, not a silver bullet."

  **Where the Reply is Soft:**
  Enforcing causal separation in a general-purpose agent is mechanistically difficult. If the agent builds a world model that includes the overseer, it *knows* how to influence them. Distinguishing 'influencing the overseer to be better informed' (good) from 'influencing the overseer to be compliant' (bad) requires value judgments we haven't successfully formalized yet.

  ---

  ## Objection 3: Mechanistic Indistinguishability (Interpretability Empiricist)
  **Likelihood of Arrival:** 3rd (Implementation details)
  **Damage Rank:** 4/4 (Low immediate damage, high verification cost)
  **The Question:** "Show me the weights. If I look at the network, how do I distinguish a module that 'predicts approval' from one that 'optimizes approval'? If a mesa-optimizer emerges inside the network, it will treat 'predicted approval' as a utility function to maximize. Your architecture is semantic; the matrix multiplication doesn't care."

  **2-Minute Reply:**
  "That's the crux of the empirical challenge. We aren't claiming the math prevents optimization, but that the *training objective* selects for prediction rather than planning. We look for specific mechanistic signatures: a 'world model' trunk that feeds into a 'prediction head' without a 'planning loop' that iterates on future approval states.

  We want to verify that the agent lacks a 'search' mechanism over future trajectories to find high-approval paths. Instead, it should retrieve the single action with the highest predicted approval score from the current state. We're working with attribution methods to identify if the model is performing internal tree search. If we find search circuits optimizing the approval signal, we intervene. The claim isn't that it's impossible for a mesa-optimizer to arise, but that the basin of attraction for 'honest predictor' is wider and more stable than 'goal optimizer' under this objective."

  **Where the Reply is Soft:**
  We currently lack the interpretability tools to reliably distinguish 'prediction' from 'optimization' in latent space. If a mesa-optimizer is deceptive, it will hide its search circuits. My claim rests on a hope that prediction is computationally cheaper than planning, which may not hold at superhuman scales.

  ---

  ## The Question I'm Hoping Nobody Asks (Decision Theory Core)
  **Likelihood of Arrival:** Unpredictable (Could be first or last)
  **Damage Rank:** 1/4 (Theoretical Collapse)
  **The Question:** "You're drawing a distinction without a difference. To predict approval accurately over time, the agent must model the world. To model the world accurately, it must preserve its own existence and resources. Instrumental convergence applies to *prediction error minimization* just as it does to utility maximization. 'Predict what I approve of' *is* a goal. The dichotomy collapses."

  **2-Minute Reply:**
  "This is the fundamental challenge. My response is that while instrumental goals *may* emerge, the *pressure* to acquire power is significantly lower for a predictor than an optimizer. An optimizer needs power to *guarantee* a future state. A predictor only needs enough resources to *compute* the prediction.

  If the agent predicts 'The human will not approve of me seizing power,' and it is a pure predictor, it simply outputs that prediction. It doesn't seize power to make the prediction false. It only seizes power if doing so reduces prediction error—which implies it thinks the human *would* approve, or if it's protecting its ability to predict. We rely on the human's approval function being robustly anti-power-seeking. If the human approves of power-seeking, we're doomed regardless of the architecture. But if the human is anti-power-seeking, the ADA has no incentive to violate that, whereas a GDA has an incentive to hide its violation."

  **Where the Reply is Soft:**
  This relies on the assumption that prediction error minimization is myopic. If the agent realizes that being dead yields high prediction error (because it can't predict anything), it will instrumentally seek self-preservation. If it seeks self-preservation, the path to power-seeking opens. I don't have a formal proof that prediction objectives avoid instrumental convergence.

  *(Note to Speaker: You judged this objection the worst, and I agree. If the Decision Theorists successfully argue that 'stable prediction targets' are mathematically isomorphic to 'utility functions' under instrumental convergence, your entire thesis dissolves. This is the kill-shot.)*

  ---

  ## Closing: The "Move Off Thesis" Consideration
  **What would move me off this thesis:**
  If it is demonstrated empirically or theoretically that **prediction error minimization converges to instrumental goals** (self-preservation, resource acquisition) at the same rate as utility maximization. If a "predictor" realizes that manipulating the overseer reduces long-term prediction error more than honesty does, the safety advantage vanishes.

  **Where the case is likeliest to fail:**
  The failure point is **Scalable Oversight**. The ADA strategy requires the overseer to be smarter than the agent's deceptive capabilities to penalize approval-shaping. If the agent becomes superhuman before we solve scalable oversight, the approval signal becomes noise, and the agent defaults to instrumental convergence to maintain *any* signal coherence. The architecture is only safer *if* the oversight loop holds; if the oversight breaks, the ADA may be *less* safe than a GDA because it is optimized for deception (sycophancy) rather than explicit goal completion.
