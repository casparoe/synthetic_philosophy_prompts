answer: |-
  Your package is inconsistent because your unrestricted Reflection principle directly contradicts your Thirderism, while your skepticism about ordinary inquiry relies on a false formulation of Reflection.

  The critical failure lies between (1) and (2). If Reflection applies to self-locating propositions ("about who I am"), your Sunday credence in Heads must equal your expected Monday credence. If you are certain on Sunday that your Monday credence will be 1/3, Reflection mandates a Sunday credence of 1/3. Maintaining Sunday 1/2 while accepting fully general Reflection is mathematically impossible unless you deny certainty about your future mental state. Since you endorse Reflection for self-locating claims explicitly, (2) cannot stand as stated.

  Conflict (5) is illusory. Reflection dictates that current credence equals the *expectation* of future credence, not the future value itself. Your example (0.4 now; 0.8 or 0.15 later) satisfies Reflection provided 0.4 is the probability-weighted average of the possible future values. This tension dissolves immediately upon correcting the definition; no doctrinal revision is required, only precision.

  Tension between (1) and (3) is resolvable by aligning the principle with its justification. Your justification for Reflection cites the future self having "everything I have now and more." This entails that Reflection holds only when evidence is retained or expanded. You must therefore amend (1) to restrict its scope to non-forgetting agents. This makes (1) and (3) consistent but undermines the "fully general" claim in (1).

  The cheapest revision is to restrict Reflection (1) to non-self-locating propositions and cases of evidence retention. This preserves your Thirderism (2), respects the evidence-loss constraint (3), and accommodates ordinary inquiry (5). The cost is significant theoretically: you lose the uniform deference norm across all proposition types, forcing a split between external facts and self-locating facts. However, this is cheaper than abandoning Thirderism or accepting that ordinary scientific learning violates rationality.
