      *   **Topic:** Collective action problems (CAPs), specifically using the Ozone/Montreal Protocol case study instead of the standard pasture/fishery.
      *   **Goal:** Analyze the episode through the lens of commons theory, running in both directions (theory $\to$ case, case $\to$ theory).
      *   **Constraints:** Use the stipulated facts (no external lookups needed, though general knowledge aligns).
      *   **Structure:** Five specific sections required:
          1.  **Structure:** Define the type of commons (subtractive, waste sink, or public good). Argue for one and discuss implications for free-riding/coercion/remedy.
          2.  **Mapping:** Identify actors, option sets, payoffs, compliance costs, and patent holders.
          3.  **Delayed Feedback:** Analyze the "delayed-feedback commons" concept vs. standard tragedy models/Ostrom principles. What substituted for visible degradation? (Science panels, adaptive treaty).
          4.  **The Awkward Question:** Concentration of production/patents. Is it a small-number coordination game or an N-person Prisoner's Dilemma (PD)? Implications for commons theory vindication.
          5.  **Verdict & Transfer Test:** Confirmation, anomaly, or different structure? Feature-by-feature comparison with CO2/Climate Change. Acknowledge silence where appropriate.

  2.  **Drafting - Section by Section:**

      *   **Section 1: Structure of the Commons.**
          *   *Options:* Subtractive commons (fishery), Waste sink (pollution), Public good (protection).
          *   *Analysis:* It's primarily a **waste sink** (assimilative capacity of the stratosphere). The "resource" is the stability of the ozone layer, but the *action* is dumping CFCs. It can also be framed as a public good (ozone protection), but the *problem* arises from the sink capacity being exceeded.
          *   *Argument:* Waste sink is the most precise fit for the *mechanism* of harm (accumulation), but Public Good is the fit for the *solution* (abatement). Let's argue for **Waste Sink with Public Good characteristics**.
          *   *Implications:* If it's a subtractive commons, users compete for extraction. Here, users compete for dumping rights. Free-riders are those who dump without paying for the damage. Coercion is needed to stop dumping. Remedy is capping the sink usage (phase-out), not allocating extraction rights.
          *   *Decision:* I will argue it is best modeled as a **polluted waste sink**. This highlights the *accumulation* aspect crucial to the delay.

      *   **Section 2: Disciplined Mapping.**
          *   *Actors:* States (signatories), Chemical Producers (DuPont, ICI, etc.), Consumers (users of AC/fridge), Developing Nations (later entrants).
          *   *Option Sets:* Continue CFCs (cheap, known tech) vs. Switch (costly, uncertain tech initially). Treaty adds Trade Sanctions (non-parties can't sell to parties).
          *   *Payoffs:* Early compliance cost = high R&D, retooling. But trade sanctions made non-compliance expensive (loss of market).
