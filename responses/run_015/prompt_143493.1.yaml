      *   **Section 3: Delayed Feedback.**
          *   *Standard Model Assumption:* Users see the grass disappear or the fish vanish *now*. Feedback is immediate or near-immediate.
          *   *Ostrom Principles:* Rely on monitoring (seeing the resource), graduated sanctions (reacting to overuse).
          *   *The Ozone Twist:* Feedback loop is 10-50 years. Spatial displacement (emit in NY, hole in Antarctica).
          *   *Substitutes for Feedback:* Scientific consensus (WMO/UNEP panels) acted as the "monitor." The adaptive management clause (adjusting phase-outs without renegotiation) acted as the "sanction/regulation" mechanism.
          *   *Generalizability:* This is an *institutional substitute* for natural feedback. It's not an artefact; it's a design feature required for long-lag problems.

      *   **Section 4: The Awkward Question (Concentration & Patents).**
          *   *Issue:* Few producers. Patents on substitutes held by incumbents.
          *   *Analysis:* This shifts it from a pure N-person PD (where everyone loses if all defect) toward a **coordination game with distributional conflict**. If the big players profit from the switch, they will enforce it.
          *   *Implication:* It weakens the "tragedy" narrative. It wasn't just altruism or coercion; it was induced innovation + market capture.
          *   *Vindication:* Commons theory still holds regarding the *states* (who had to agree), but the *market structure* solved the production side easily. It suggests commons theory needs to integrate industrial organization more deeply.

      *   **Section 5: Verdict & Transfer Test.**
          *   *Verdict:* It is a **confirmation of the model under specific boundary conditions**, not a universal template. It shows the model works *if* you can solve the feedback and substitution problems.
          *   *Transfer to CO2:*
              *   *Substitutes:* CFCs had specific chemical substitutes. CO2 is tied to energy combustion (harder to separate).
              *   *Concentration:* CFC producers were few. CO2 emitters are everyone (energy, transport, ag).
              *   *Separability:* CFC function (cooling) separable from chemical. CO2 is the byproduct of the energy itself.
              *   *Visibility:* Ozone hole was a sharp "smoking gun." Climate change is probabilistic and noisy.
              *   *Victims:* Ozone (skin cancer, crops). Climate (everything, unevenly).
          *   *Silence:* Theory is silent on *how* to generate scientific consensus or *how* to manage patent monopolies. It assumes the payoff matrix is given; ozone shows the matrix can be engineered.

  3.  **Review and Refine:**

      *   *Tone:* Academic, analytical, suitable for lecture notes.
