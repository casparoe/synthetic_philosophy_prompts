answer: |-
  **MEMORANDUM**

  **TO:** Research Computing Advisory Committee
  **FROM:** Graduate Student Representative
  **SUBJECT:** Recommendation on Cluster Allocation Cycle
  **DATE:** June 1

  **Recommendation**
  Adopt Option A (Universal Micro-Throttle) with a mandated proactive exemption process for projects facing hard, external deadlines. We should not implement Option B.

  **Rationale**
  This decision rests on two ethical distinctions relevant to both engineering constraints and moral risk.

  First, we must distinguish between *aggregate inefficiency* and *catastrophic harm*. Option A incurs a higher total loss of CPU-hours than Option B. However, those hours are lost across 11,400 users as imperceptible delays (two minutes per job). Option B concentrates loss onto a single lab, resulting in contract terminations and failed national deliverables. Moral priority should be given to preventing ruinous outcomes for specific agents over maximizing abstract throughput when the counter-cost is distributed below the threshold of individual grievance. We are not merely moving numbers; we are safeguarding careers.

  Second, the low uptake of exemption requests under Option A does not prove the cost is trivial; it proves the cost is opaque. As noted in deliberation, users cannot prefer to avoid a harm they cannot detect. Relying on passive exemptions validates this opacity. A proactive exemption process—informed by IT usage data and declared deadlines—restores agency. It allows us to apply the throttle where it functions as mere noise, while lifting it where it functions as a barrier to critical work.

  **The Strongest Counter-Argument**
  Proponents of Option B argue from strict stewardship. The cluster is a public resource funded to maximize research output. Option A intentionally degrades performance, wasting roughly 100 CPU-years annually—more capacity than Option B saves. From this view, choosing A is an inefficiency tax on the entire university to subsidize one lab's planning failures. If we accept that invisible harms are still real costs, then Option A inflicts greater total damage on the university's mission than Option B. Sacrificing one lab is tragic, but systematically reducing the throughput of every researcher is a broader betrayal of our mandate to facilitate science.

  **Conditions and Implementation**
  To mitigate the stewardship concern while maintaining ethical protections:

  1.  **Proactive Exemption:** IT will circulate a form prior to the cycle start. Exemptions are granted only for verified external deadlines (e.g., national assessments), not general productivity goals.
  2.  **Sunset Clause:** This allocation model expires in 12 months. We must return with a capacity expansion plan or a revised quota system.
  3.  **Transparency:** The existence of the throttle must be communicated to all users, even if the effect is imperceptible. Invisible governance undermines trust.

  We should choose the policy that accepts inefficiency to prevent ruin, rather than one that accepts ruin to prevent inefficiency.
