      *   *Engineering vs. Desideratum:* (7) Legibility is often treated as nice-to-have, but with a "tired overseer," it's actually a safety constraint. If they can't understand the veto, they can't veto.
      *   *The "Value-Free" Claim:* I need to support the user's intuition. "Impact" is not a physical quantity like mass. It's teleological.

  8.  **Final Polish:**
