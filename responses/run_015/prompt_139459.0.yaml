  3.  **Evaluate the User's 9 Desiderata:**
      *   (1) *Authorized vs. Unauthorized:* Crucial. If the human asks for the vase to be moved, breaking it isn't a "side effect" in the relevant sense, it's a task failure or accepted risk. If the robot knocks it over while vacuuming, that's a side effect. *Verdict:* Real desideratum. Does it require value theory? Yes, implicitly (authority), but maybe pragmatically solvable via instruction context.
      *   (2) *Delegation/Laundering:* Crucial for capable agents. If I can't break the vase, can I pay a human to break it? *Verdict:* Real desideratum.
