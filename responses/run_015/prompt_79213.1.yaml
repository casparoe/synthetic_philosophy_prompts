answer: |-
  You have put your finger on precisely the right tension. This passage is the Rosetta Stone for the history of cognitive science, but it is often misread because we project Turing back onto Hobbes. Your hunch about the 'intelligent adder' is remarkably close to the mark, and it is the key to untangling what Hobbes is actually doing versus what the modern Computational Theory of Mind (CTM) does.

  Here is a plain breakdown of what is fair to claim and what constitutes overreach, keeping to your specific questions.

  ### 1. Arithmetic on quantities or a metaphor for reasoning?

  It is neither pure arithmetic nor mere metaphor. It is best understood as a **logic of concepts**.

  When Hobbes speaks of addition and subtraction, he is not claiming the brain is calculating that $2 + 2 = 4$. He is claiming that inference is set-theoretic. To reason that 'a man is mortal' is to add the concept 'mortal' to the concept 'man'. To reason that 'a stone is not an animal' is to subtract the concept 'animated' from the concept 'stone'.

  **Fair claim:** Hobbes is proposing that the *structure* of valid inference is isomorphic with arithmetic operations. He is trying to formalise logic before the invention of symbolic logic. He wants to show that if we fix our terms (names), reasoning becomes as error-free as accounting.

  **Overreach:** To claim he is describing neural quantification. He has no notion of neural firing rates or quantitative variables in the modern sense. The 'quantities' are the extensions of names, not numerical values.

  ### 2. Machinery of the mind or form of reasoning?

  This is where the materialist context is vital. Hobbes is a thoroughgoing materialist; for him, there is no immaterial soul. Thinking *must* be a physical process. He describes thoughts as 'decaying sense' (phantasms) caused by motion in the brain.

  **Fair claim:** He is making a claim about the machinery, but it is a **mechanical** claim, not a **computational** one. He believes thinking is the literal motion of 'animal spirits' or matter in the head. The 'addition' is a causal joining of these motions.

  **Overreach:** To call him a 'computationalist' in the modern sense implies he believes the mind manipulates symbols based on syntax. Hobbes believes the mind attends to the *signification* of names. The machinery works because the thinker understands the meaning, not because the machinery is blind to meaning.

  ### 3. Why isn't this the Computational Theory of Mind (CTM) full stop?

  Your hunch here is correct. The missing ingredient is indeed **autonomy of syntax**.

  In modern CTM (derived from Turing and Fodor), a physical system can process information solely based on the shape of the symbols, without understanding what they mean. The 'computation' does the work. For Hobbes, the 'computation' is an activity performed *by* a rational agent who must constantly refer to what the names signify in the world.

  *   **Hobbes:** I add the name 'rational' to 'animal' because I understand what both signify and see they cohere.
  *   **CTM:** The system adds token A to token B because the rules of the programme dictate that shape A fits slot B. The system need not know what 'rational' means.

  Furthermore, Hobbes lacks the notion of an **algorithm**. He has operations (add/subtract), but he does not have a defined procedure for *which* operation to apply when. He relies on the light of nature (the thinker's insight) to guide the reckoning. Without a programme to govern the sequence of operations, you have a calculator, but not a computer.

  **Fair claim:** Hobbes is a proto-mechanist who views reasoning as a rule-governed manipulation of representations.

  **Overreach:** To claim he anticipated the idea that syntax drives semantics. For Hobbes, semantics (the signification of names) drives the syntax.

  ### 4. The 'Without the Use of Words' Example

  This is the trickiest part of the text, and it often trips readers up. You asked if this helps or hurts the computational reading. In a way, it does both, but mostly it highlights a limitation in his theory.

  In the example you cite (seeing a figure from afar, compounding 'body', 'animated', 'rational' into 'man'), Hobbes is describing **concept formation**, not complex deduction. He is showing how we build universal ideas from sensory particulars.

  *   **How it helps:** It shows that mental representation is combinatorial. The mind can hold discrete marks ('body', 'animated') and combine them. This is a prerequisite for computation.
  *   **How it hurts:** If this happens 'without words', what are the symbols? For Hobbes, they are 'phantasms' (mental images). Images are analog and fuzzy; computation requires discrete, digital symbols. Hobbes himself admits elsewhere that reasoning without words is prone to error because mental images are unstable. He insists that for *science* (certain knowledge), we need words to fix these concepts.

  So, the example shows that the *raw material* of thought is combinatorial, but it does not prove that the *process* is a formal computation. It suggests the mind is a machine that compounds images, but without the linguistic tags, the machine is imprecise.

  **Fair claim:** Hobbes is arguing that thought is inherently compositional (complex ideas are built from simple ones).

  **Overreach:** To claim this proves Hobbes believed in a 'language of thought' (Mentalese) that is fully computational independent of public language. He generally argues the opposite: that public language is required to stabilise thought for rigorous reasoning.

  ### Summary for your piece

  If I were editing your copy, here is how I would suggest you frame it:

  1.  **Do not call Hobbes a computationalist.** Call him a **mechanist**. He believed the mind was a machine of matter in motion, but not a machine that processed information syntactically.
  2.  **Validate your hunch.** The crucial shift between Hobbes and modern AI is not the idea that thinking is like adding (Hbes has that), but the idea that the adding can be done by something that does not understand the sum (which Hobbes does not have). Hobbes's computer always requires a ghost in the machine to know what the numbers stand for.
  3.  **On the 'without words' passage.** Use this to show Hobbes's struggle with representation. He wants thought to be mechanical, but he knows that without the fixed symbols of language, the mechanics slip. This anticipates the modern debate about whether cognition is language-dependent or not.

  **The Verdict:**
  It is fair to say Hobbes invented the **metaphor** of the mind as a computer.
  It is overreach to say he proposed the **theory** of the mind as a computer.

  He provided the arithmetic of ideas, but he did not see that the arithmetic could run itself. That insight had to wait for the nineteenth and twentieth centuries, when logicians realised that you could separate the form of the argument from the meaning of the terms, and engineers realised you could build a machine to manipulate that form. Hobbes gave us the equation; he did not give us the solver.
