  **Referee Report on "Superrationality, graded: the dilemma one level up"**

  **1. Mathematics and Modeling (§§2–3)**

  The arithmetic in §2 is correct. Given $EU(C) = cR + (1-c)S$ and $EU(D) = P$, the threshold $c \ge (P-S)/(R-S)$ follows validly. With the provided payoffs ($R=3, P=1, S=0$), the threshold is indeed $1/3$.

  The claim that $T$ drops out is logically consistent within the model but relies on a specific, strong interpretation of "mirroring." You define mirroring as: "with probability $c$ your action equals mine whatever I do." This implies that if you defect, the opponent mirrors defection with probability $c$. Consequently, the outcome $(D, C)$ never occurs, eliminating $T$ from the calculation. This is a fair formalization of *logical* correlation (if we run the same function, we output the same value), but it differs from standard causal or evidential correlation where $P(\text{Opponent}=C | \text{Me}=D)$ might differ from $P(\text{Opponent}=C | \text{Me}=C)$. By hard-coding the symmetry into the probability $c$, you have effectively built the superrational conclusion into the premises of the expected utility calculation. This is not a fatal flaw, but it should be acknowledged: you are modeling *functional* decision theory with a noise parameter, not deriving superrationality from standard causal premises.

  In §3, complication (b) regarding randomization introduces a new threshold ($c \ge 1/2$) for full cooperation. This highlights a genuine sensitivity: the verdict depends on whether agents can correlate via shared randomness. However, §3 feels like technical clutter. It complicates the narrative without advancing the core philosophical argument about the meta-game. The shift from the clean threshold in §2 to the conditional thresholds in §3 weakens the rhetorical force of the "graded" concept.

  **2. The Assurance Game and Exploitability (§§5–7)**

  There is a significant tension between §5 and §7 that threatens the internal consistency of the argument.

  In §5, you construct an Assurance Game (Stag Hunt). The payoffs rely on the assumption that if one agent Conforms and the other is Idiosyncratic, the result is mutual defection ($P, P$), minus the cost $\epsilon$ for the Conformer. This follows from §2: if the counterpart is Idiosyncratic, $c \approx 0$, so a rational graded superrational agent defects.

  In §7, you argue that if Conforming makes an agent legible, an Idiosyncratic agent might exploit them, yielding payoffs $(S-\epsilon, T)$. This assumes the Conforming agent *cooperates* against an Idiosyncratic agent. But why? If the Conforming agent follows the decision rule established in §2, they calculate $c \approx 0$ and defect. For §7 to hold, "Conformity" must imply a commitment to cooperate *even when* $c$ is low, or the Idiosyncratic agent must be able to manipulate the Conformer's estimate of $c$.

  If the Conformer defects against an Idiosyncrat (as §2 dictates), the meta-game remains an Assurance Game, and §7's warning is moot. If the Conformer cooperates against an Idiosyncrat (to maintain legibility?), they are irrational by the standards of §2. You need to clarify whether "Conformity" means "Adopt the §2 calculus" or "Adopt a policy of Cooperation." If it is the latter, you have moved from decision theory to moral commitment, which changes the nature of the problem.

  Regarding the risk-dominance calculation in §6: Your conclusion appears mathematically inverted. In the payoff matrix provided:
  *   (Conf, Conf) = 2.9
  *   (Idio, Idio) = 1.0
  *   (Conf, Idio) = 0.9
  *   (Idio, Conf) = 1.0

  The loss from playing Conf when the other plays Idio is $1.0 - 0.9 = 0.1$.
  The loss from playing Idio when the other plays Conf is $2.9 - 1.0 = 1.9$.
  Standard risk-dominance criteria (Harsanyi-Selten) compare the product of deviation losses. The basin of attraction for (Conf, Conf) is much larger (requiring only $>5\%$ confidence in the other's conformity) than for (Idio, Idio). Thus, (Conf, Conf) is risk-dominant, not (Idio, Idio). Your text claims the opposite based on the small cost of misplacing conformity, but a small cost makes a strategy *less* risky, not more. This error undermines the claim that conformity is fragile due to risk dominance.

  **3. Common Belief (§6)**

  The move from $c$ to *common belief* in $c$ is a genuine strengthening, not a restatement. In standard superrationality, common knowledge of rationality is assumed. Here, $c$ is an empirical parameter regarding code similarity. Establishing $c$ is high is an empirical claim; establishing *common belief* in $c$ is an epistemic coordination problem. This correctly identifies that the barrier to superrationality is not just logical similarity, but mutual assurance of that similarity. It bridges the gap between the decision-theoretic calculation and the game-theoretic equilibrium selection.

  **4. Overall Assessment: Truth, Interest, and Collapse**

  *   **Truth:** The core mathematical claims in §2 are sound, but the game-theoretic analysis in §§5–6 contains the risk-dominance error noted above. The tension between §5 and §7 regarding the behavior of the Conforming agent needs resolution.
  *   **Interest:** The essay is highly interesting. Reframing superrationality as an investment in "legibility" or "algorithmic transparency" is a fresh and valuable perspective. It moves the discussion from "How should I decide?" to "What kind of agent should I be?" which is the right level for this problem.
  *   **Collapse:** Does it collapse into existing theory?
      *   **Yes:** §2 is effectively Evidential Decision Theory (EDT) or Functional Decision Theory (FDT) with a correlation parameter. This is known territory.
      *   **No:** The meta-game analysis (§§4–6) regarding the *cost of adopting* the decision procedure is less standard. Most FDT/EDT literature takes the decision algorithm as given. Analyzing the evolutionary or strategic stability of adopting such an algorithm (the "game before the game") is a distinct contribution.
      *   **Verdict:** It collapses into FDT + Costly Signaling, but the synthesis yields a new insight about the fragility of transparency. The "Assurance Game" result is the novel core; the decision theory in §2 is merely the engine.

  **5. Editorial Recommendations**

  *   **Weakest Section:** **§3 should be cut or demoted to a footnote.** It introduces technical noise ($q$, randomization thresholds) that distracts from the main philosophical arc (Identity $\to$ Grading $\to$ Meta-game $\to$ Transparency). The sensitivity to modeling choices is a valid point, but it can be made in a sentence without deriving new thresholds.
  *   **Single Best Addition:** **Clarify the decision rule in the meta-game.** You must explicitly state whether the "Conforming" agent in §5/§7 defects against an "Idiosyncratic" agent. If they defect, §7's exploitability worry vanishes. If they cooperate, you must justify why they violate the §2 optimization. Resolving this determines whether the meta-game is truly an Assurance Game or a Prisoner's Dilemma.

  **6. Final Verdict**

  **Salvageable with restructuring.**

  The core insight—that superrationality transforms into a problem of coordinating on transparency conventions—is robust and worth publishing. However, the argument currently rests on a mathematical error regarding risk dominance (§6) and a potential inconsistency regarding the Conformer's behavior against exploiters (§5 vs §7). Correcting the game theory and tightening the definition of "Conformity" will stabilize the essay. Once §3 is removed to improve flow, the argument will be sharp enough to stand on its own merits.
