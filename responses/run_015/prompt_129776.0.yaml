  Based on her track record, here is the analysis of her likely decision, the underlying logic, and the critical test case.

  ### 1. The Prediction: She will Scrap (or Radicalize) It
  She will almost certainly argue to **scrap "Algorithmic Dysphoria" as a psychiatric diagnosis**, likely proposing it be reframed as a sociological or ethical condition instead.

  **Why:**
  *   **The Looping is the Pathology:** In her ADHD case, the looping (identifying with the label) led to *better coping*. In "Algorithmic Dysphoria," the looping (curating feelings for the system) *is* the harm. Diagnosing it medicalizes a rational response to surveillance, forcing the patient to view their resistance as a symptom.
  *   **Identity Harm (The HFA Parallel):** Like "High-Functioning Autism," this label demands a performance. HFA forced people to perform "normalcy"; Algorithmic Dysphoria forces people to perform "predictability." Both erode authentic selfhood.
  *   **Lack of Material Necessity (The DID Contrast):** She kept DID because the label is a key to unlock care. There is no clear "treatment" for Algorithmic Dysphoria other than structural change (leaving the platform), which a psychiatric diagnosis cannot fix. It fails the pragmatic utility test.

  ### 2. The Actual Rule: "Pragmatic Agency"
  Her decision matrix isn't simply "anti-looping." It is a **Pragmatic Agency Calculus**. She retains a category if it increases the subject's agency (either psychologically or materially), and discards it if it constrains agency for no gain.

  *   **ADHD:** Looping $\rightarrow$ Increased Agency (Coping tools). **Keep.**
  *   **HFA:** Looping $\rightarrow$ Decreased Agency (Stereotype performance). **Drop.**
  *   **DID:** Looping $\rightarrow$ Neutral/Harmful, BUT Material Agency (Access to care). **Keep.**
  *   **Gaming:** No Looping $\rightarrow$ No Agency change. **Scrap.**
  *   **Grief:** Low Looping $\rightarrow$ Professional Utility. **Keep.**

  **The Rule:** *Keep a diagnosis if the looping effect yields coping benefits OR if the label is materially necessary for resource access. Drop it if the looping enforces inauthenticity without material compensation.*

  ### 3. The Competing Rule: "Institutional Gatekeeping"
  A competing rule that fits her past calls just as well is **Institutional Gatekeeping**. This rule suggests she keeps diagnoses that function as necessary keys within existing bureaucracies (insurance, schools, clinics) and drops those that are purely cultural or self-managed.

  *   **ADHD:** Key for school/work accommodations. **Keep.**
  *   **DID:** Key for insurance/therapy access. **Keep.**
  *   **Grief:** Key for clinical billing/coding. **Keep.**
  *   **HFA:** Cultural label, no specific medical gate. **Drop.**
  *   **Gaming:** No institutional pathway yet. **Drop.**

  **Why it fits:** Both rules predict the exact same outcomes for her past five cases. The "Pragmatic Agency" rule focuses on the *patient's* benefit; the "Institutional Gatekeeping" rule focuses on the *system's* requirement.

  ### 4. The Critical Case: "Bureaucratic Survival Syndrome"
  To distinguish between **Pragmatic Agency** (her actual rule) and **Institutional Gatekeeping** (the competitor), you need a case where the system *requires* the label, but the label *destroys* the patient's agency.

  **The Case:**
  A proposed category called **"Chronic Dependency Disorder."**
  *   **Context:** To qualify for essential housing or disability welfare, patients must prove they are incapable of self-care.
  *   **The Loop:** Patients learn to perform helplessness and suppress recovery to maintain benefits.
  *   **Identity Harm:** High. It forces the patient to live inauthentically and sabotage their own healing to survive.
  *   **Institutional Utility:** High. It is the *only* code that unlocks the housing/resources.

  **The Divergence:**
  *   **If she follows Institutional Gatekeeping:** She will **Keep** the diagnosis. The system requires the code to distribute life-saving resources, regardless of the performative harm. (Matches her DID logic).
  *   **If she follows Pragmatic Agency:** She will **Scrap/Revise** the diagnosis. The label actively reduces the patient's agency by forcing them to perform sickness. She would likely argue for decoupling the resources from the diagnosis. (Matches her HFA logic).

  **Her Likely Move:** Given her specific reasoning for dropping HFA (that the label *pushes people to perform*), she would likely **Scrap** "Chronic Dependency Disorder," prioritizing identity integrity over institutional convenience. This confirms **Pragmatic Agency** is her true operating system.
