      **Project Title:** Rational Choice Under Subtractive Transformation

      **The Research Question**
      Current decision theory struggles when agents face experiences they cannot anticipate. However, existing models assume transformation is additive: the agent gains new qualia or preferences. This project asks whether subtractive transformations—where an agent loses a constitutive framework for evaluation—generate unique rationality problems that standard replies cannot resolve. The question is falsifiable: if standard decision-theoretic repairs handle subtractive cases as well as additive ones, the distinction is negligible.

      **Literature and the Evaluative Foothold**
      The literature on transformative experience, pioneered by Paul, argues that standard expected utility theory fails when agents lack epistemic access to future outcomes. Standard replies suggest choosing for the future self, valuing revelation itself, or treating the problem as one of identity over time. These replies presuppose an evaluative foothold: a stable standpoint from which to value the change or the future self. In additive cases, the agent retains their past self as a baseline. In subtractive cases, such as leaving a totalizing religious community or losing professional hearing, the framework used to evaluate the choice is itself the object being lost. The advisor's concern is pertinent: the crucial variable may not be directionality (additive versus subtractive) but whether the transformation alters the standards of evaluation themselves. This project tests whether the subtractive structure is merely a proxy for this deeper instability or a distinct structural problem.

      **The Paul Distinction**
      A necessary component of this analysis is mapping the additive/subtractive distinction onto Paul's categories of epistemically and personally transformative experiences. Additive cases typically involve both: one gains new knowledge and new values. Subtractive cases cut across this distinction. Losing religious faith is epistemically transformative (the world looks different) and personally transformative (values shift), but via removal rather than addition. Losing hearing is epistemically transformative regarding sound qualia but may be personally transformative regarding identity. The additive/subtractive cut does not track the epistemic/personal split; rather, it highlights a structural asymmetry in how the agent relates to their own continuity. This project will argue that subtractive cases intensify the personal transformation problem by removing the baseline required to authorize the change.

      **Methodology and Timeline**
      The nine-month fellowship will proceed in three phases. Months one through three involve constructing a taxonomy of transformative cases, crossing additive/subtractive with epistemic/personal transformation. This grid will isolate pure subtractive cases where the evaluative framework is lost without replacement. Months four through six will test stock decision-theoretic replies against each cell of the taxonomy. I will analyze whether arguments like "choose for the future self" collapse when the future self lacks the values necessary to endorse the choice. This work is primarily armchair conceptual analysis, relying on phenomenological reports rather than empirical data collection, though I will incorporate existing first-person accounts of deconversion and disability. Months seven through nine focus on writing the standalone article and the dissertation chapter.

      **Outputs and Practical Implications**
      The deliverable is one publishable article and one draft dissertation chapter. Theoretically, the project aims to refine rational choice theory to accommodate framework loss. Practically, it seeks to offer normative guidance for agents in high-stakes subtractive decisions. For the violinist considering a cochlear implant, the project would not dictate the choice but would clarify why standard cost-benefit analysis fails. It would validate the rationality of mourning the loss of current standards even while choosing for future access, distinguishing between irrational fear and rational incommensurability.

      **Failure Conditions and Scope**
      The project fails if the testing phase reveals that standard replies resolve subtractive cases without modification. This would vindicate the advisor's hypothesis that the additive/subtractive cut is a red herring and that only the alteration of evaluative standards matters. Additionally, if the distinction collapses entirely into Paul's existing epistemic/personal categories, the project yields no novel theoretical leverage. If nine months proves insufficient, I will drop the broad taxonomy and focus exclusively on the subtractive/religious deconversion case, sacrificing generalizability for depth.

      \answer{Does the subtractive nature of certain transformative experiences generate decision-theoretic problems distinct from those generated by additive transformations?}

