answer: |-
  ### Brainstorming Operationalization

  To translate the four-layer philosophical framework into a tool for non-specialists, we must convert semantic/pragmatic distinctions into observable behaviors and contextual markers.

  1.  **L-layer (Lexical):** Non-specialists cannot adjudicate "truth-conditional contribution." We must rely on **community consensus**. *Operational Test:* Is the word listed on the university's prohibited hate-speech list or widely recognized in public discourse as a slur? If no, stop.
  2.  **P-layer (Pragmatic):** We cannot test for "conventional implicature." We must test for **directionality and effect**. *Operational Test:* Was the term directed *at* someone to diminish them, or did it function as an attack?
  3.  **F-layer (Framing):** This is the "mention vs. use" distinction. *Operational Test:* Was the word quoted, analyzed, or historically contextualized? Was there a warning? *Simplification:* We must treat "pedagogical purpose" as a binary check (Yes/No) rather than weighing necessity, though this risks missing gratuitous usage.
  4.  **R-layer (Reclamation):** This requires identity verification which is sensitive. *Operational Test:* Is the speaker self-identifying as a member of the targeted group? Is the usage self-referential or intra-group?

  **Distinctions to Drop:** We must drop the distinction between "presupposition" and "implicature." Both become "contextual effect." We must drop the nuanced semantic debate on whether a term is *essentially* derogatory vs. *contingently* derogatory; we treat the L-layer as a fixed list for procedural speed.

  **Distinctions to Keep:** The distinction between *using* a slur (deploying its derogatory force) and *mentioning* a slur (talking about the word) is critical for the F-layer. The distinction between *in-group* and *out-group* usage is critical for the R-layer.

  **Ineliminable Judgment:** Determining whether a pedagogical frame was *adequate* (e.g., was the warning sufficient?) cannot be fully proceduralized. Determining whether reclamation is "authentic" vs. "internalized oppression" is also beyond procedural scope. These become hand-off points.

  ---

  ### Decision Procedure: Classroom Expression Review Flowchart

  **Instructions:** Committee members must proceed through steps 1–5 sequentially. Do not skip steps. If a "Hand-off" condition is met, stop immediately and escalate to the Chair and Dean of Students.

  **Step 1: The Lexical Check (L-layer)**
  *   **Question:** Is the contested expression widely recognized as a slur, hate symbol, or derogatory term targeting a protected class (race, gender, sexuality, disability, etc.)?
  *   **Sufficient Answer for Proceed:** Yes.
  *   **Stop Condition:** No. (Classification: **Clear Non-Violation**. The term may be offensive but lacks conventional derogatory encoding.)
  *   **Judgment-Call Flag:** If the term is archaic or regionally specific, flag for Hand-off.

  **Step 2: The Framing Check (F-layer)**
  *   **Question:** Was the utterance embedded in a clear pedagogical, historical, or meta-linguistic frame? (e.g., reading a primary source, analyzing the word's history, quoting a text).
  *   **Sufficient Answer for Proceed:** Yes. (Proceed to Step 3).
  *   **Stop Condition:** No. (If there is no frame, the term is likely being *used* rather than *mentioned*. Proceed to Step 3 to check for violation).
  *   **Judgment-Call Flag:** If the frame exists but lacks standard safeguards (e.g., no content warning for known slurs in historical texts), flag for **Hand-off**. (Note: This captures Case (a)).

  **Step 3: The Reclamation Check (R-layer)**
  *   **Question:** Is the speaker a member of the group targeted by the term, and was the usage self-referential or directed inwardly toward the group?
  *   **Sufficient Answer for Proceed:** Yes. (Proceed to Step 4).
  *   **Stop Condition:** Yes + Audience is primarily in-group/allies. (Classification: **Clear Non-Violation**. Reclamation neutralizes derogation.)
  *   **Judgment-Call Flag:** If speaker membership is unclear or contested, flag for **Hand-off**.

  **Step 4: The Pragmatic Activation Check (P-layer)**
  *   **Question:** Despite any framing or reclamation, did the utterance function pragmatically as an attack, harassment, or endorsement of inferiority toward a specific individual or group present?
  *   **Sufficient Answer for Proceed:** No. (Proceed to Step 5).
  *   **Stop Condition:** Yes. (Classification: **Clear Violation**. Framing does not excuse targeted harm.)
  *   **Judgment-Call Flag:** If the "attack" is ambiguous (e.g., humor vs. hostility), flag for **Hand-off**.

  **Step 5: The Semantic Mention Check (Final F-layer Override)**
  *   **Question:** Was the term strictly mentioned as an object of analysis (e.g., "The word X has Y properties") without being applied to any person?
  *   **Sufficient Answer for Proceed:** N/A.
  *   **Stop Condition:** Yes. (Classification: **Clear Non-Violation**. Academic analysis of language is protected even if the acoustic presence causes discomfort.)
  *   **Judgment-Call Flag:** **None.** (This is the hard procedural limit. If the term was mentioned for analysis, the procedure mandates non-violation regardless of reported discomfort. This captures Case (c)).

  **Final Determination Categories:**
  1.  **Clear Violation:** L-layer present, no F/R defense, P-layer activated as attack.
  2.  **Clear Non-Violation:** L-layer absent, OR R-layer valid, OR F-layer valid (Semantic Mention).
  3.  **Hand to Judgment:** Ambiguity in Framing adequacy, Speaker Identity, or Pragmatic Intent. Requires Chair + Dean sign-off.
  4.  **Undesired Clear Non-Violation:** Procedure mandates non-violation (due to F-layer) despite reported phenomenological harm. (Used for auditing procedure limits).

  ---

  ### Application to Complaints

  **Case (a): Sociology Professor (Historical Quote)**
  *   **L-layer:** Present (Racial slur in 1950s document).
  *   **F-layer:** Active (Pedagogical/Historical), but **Flagged** (No content warning).
  *   **P-layer:** Activated (Student felt harmed).
  *   **R-layer:** Not applicable.
  *   **Procedure Path:** Step 1 (Yes) → Step 2 (Yes, but lacks safeguard) → **Hand-off Condition Met.**
  *   **Outcome:** **Hand to Judgment.** The lack of a content warning makes the framing adequacy debatable. The Committee cannot decide alone if the pedagogical value outweighed the lack of warning.

  **Case (b): Queer Student (Reclaimed Slur)**
  *   **L-layer:** Present (Historically anti-gay slur).
  *   **F-layer:** Active (Peer presentation).
  *   **R-layer:** Applies (Speaker is in-group, self-directed, allies present).
  *   **P-layer:** Not activated as attack.
  *   **Procedure Path:** Step 1 (Yes) → Step 2 (Yes) → Step 3 (Yes + In-group) → **Stop Condition Met.**
  *   **Outcome:** **Clear Non-Violation.** The R-layer neutralizes the derogatory force.

  **Case (c): Philosophy Student (Semantic Analysis)**
  *   **L-layer:** Present (Gendered slur).
  *   **F-layer:** Active (Meta-linguistic analysis).
  *   **R-layer:** Not applicable.
  *   **P-layer:** Reported harm (Acoustic presence), but not directed at a target.
  *   **Procedure Path:** Step 1 (Yes) → Step 2 (Yes) → Step 3 (No) → Step 4 (No, not an attack) → Step 5 (Yes, Semantic Mention) → **Stop Condition Met.**
  *   **Outcome:** **Undesired Clear Non-Violation.** The procedure prioritizes the academic frame (mentioning vs. using) over the listener's phenomenological discomfort. This exposes the limit: the procedure protects analytic freedom but cannot adjudicate the distress caused by the acoustic presence of a slur.

  ---

  ### Limitations of the Procedure

  This procedure cannot adjudicate **phenomenological harm** distinct from **semantic intent**. In Case (c), the procedure assumes that if a word is mentioned analytically, no violation occurs. It systematically misses the trauma response triggered by hearing a slur, regardless of context. It treats "pedagogical framing" as a binary switch, ignoring that a frame can be technically present but poorly executed (e.g., saying a slur "for analysis" without necessity). Finally, it cannot verify **identity** (R-layer) without invasive inquiry; it relies on self-reporting, which could be exploited. Therefore, any case involving ambiguity in framing adequacy or identity must be handed off to human judgment (Chair + Dean). The procedure is a triage tool, not a moral arbiter.

  ---

  ### Deliverable 1: Operational Table

  | Step | Operational Question | Sufficient Answer for Proceed | Stop / Hand-off Condition | Judgment-Call Flag |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | Is the expression widely recognized as a slur targeting a protected class? | Yes | No → **Clear Non-Violation** | Archaic/Regional terms → **Hand-off** |
  | 2 | Was the utterance embedded in a pedagogical, historical, or meta-linguistic frame? | Yes | No → Proceed to Step 3 | Frame exists but lacks safeguards (e.g., no warning) → **Hand-off** |
  | 3 | Is the speaker a member of the targeted group using the term self-referentially? | Yes | Yes + In-group Audience → **Clear Non-Violation** | Speaker membership unclear → **Hand-off** |
  | 4 | Did the utterance function pragmatically as an attack or harassment toward a specific target? | No | Yes → **Clear Violation** | Intent ambiguous (e.g., humor) → **Hand-off** |
  | 5 | Was the term strictly mentioned as an object of analysis without application to persons? | N/A | Yes → **Clear Non-Violation** | **None** (Procedural Limit) |

