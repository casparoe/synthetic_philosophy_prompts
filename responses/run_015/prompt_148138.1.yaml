answer: |-
  # Activity: The Phenomenal Merge Protocol

  **Target:** 14 Students (80-minute session)
  **Goal:** Experientially demonstrate the Combination Problem (specifically the Subject Summing and Quality Fusion issues).
  **Setup:** 4 Groups (Two groups of 4, Two groups of 3).

  ## 1. Materials & Prep
  You need to print/cut the following before class.

  *   **Phenomenal Token Cards (40 total):** Index cards. On the front, a abstract symbol (e.g., a jagged line, a smooth curve, a dotted grid). On the back, a hidden **Boundary Tag** (a colored dot: Red, Blue, or Green) and a **Qualia Label** (e.g., "Sharp Pain," "Warmth," "Blue Visual," "Low Hum"). *Students only see the front symbol initially.*
  *   **Private Rule Sheets (1 per student):** Lists the "Relational Vocabulary" and the "Overlap Constraint."
  *   **Macro-Subject Report Template (1 per group):** A single sheet of paper where the final description is written.
  *   **Auditor Clipboards (4 total):** For the auditing phase.
  *   **Scoreboard:** Whiteboard space to track "Unity Points" and "Penalty Marks."

  ## 2. Phase 1: Distribution & Concealment (10 Minutes)
  1.  **Seat the Groups:** Arrange desks so groups cannot overhear each other.
  2.  **Deal Tokens:** Give each student 3 Token Cards. They must keep the **Qualia Label** (back) hidden from their group mates. They can show the **Symbol** (front) to each other.
  3.  **The Premise:** Tell them: *"You are micro-experiences. Individually, you feel something specific (look at your hidden back). Collectively, you must constitute one Macro-Subject. You must produce a report describing what it is like to be that Macro-Subject."*
  4.  **The Language Constraint:** Hand out the Rule Sheets.
      *   **Forbidden:** Direct qualia terms (no "red," "hot," "pain," "loud").
      *   **Required:** Relational structuralism. You must describe the experience using only relations.
      *   *Allowed Vocabulary:* "Adjacent to," "Superimposed on," "Oscillating against," "Dampened by," "Nested within," "Phase-shifted from."
      *   *Example:* Instead of "Red patch next to blue patch," say "High-intensity node adjacent to low-frequency node."

  ## 3. Phase 2: The Merge Decision (25 Minutes)
  Groups must choose one of two strategies to write their **Macro-Subject Report**.

  **Strategy A: Aggregation (The Committee)**
  *   **Claim:** The Macro-Subject is simply the sum of all tokens owned by one "I."
  *   **Requirement:** The report must list every token's symbol and its relation to others.
  *   **Risk:** The Auditor will challenge the "Ownership." Who is the "I" that owns them? If you cannot define the binder, you lose points.

  **Strategy B: Phenomenal Fusion (The Blend)**
  *   **Claim:** The tokens have blended into a new, single unified quality.
  *   **Requirement:** The report describes one complex quality, not a list.
  *   **The Overlap Constraint (The Twist):**
      *   To fuse, students must reveal their **Boundary Tags** (colored dots) to the group.
      *   **Rule:** If any two tokens being fused share the same Boundary Tag (e.g., two Red dots), you cannot simply combine them. You must apply a **Boundary Cost**:
          1.  **Subsumption:** One token is declared "Silenced." It exists physically but contributes nothing to the experience (loss of richness).
          2.  **Residue:** The overlap becomes an "Orphan." It exists but belongs to *no* subject (violates the unity of the Macro-Subject).
      *   *Decision:* The group must decide which tokens to Subsume or leave as Residue to make the fusion work.

  **Instructor Role:** Circulate. Enforce the Language Constraint strictly. If you hear "It feels warm," slap a penalty sticker on their table.

  ## 4. Phase 3: Auditing & Scoring (20 Minutes)
  1.  **Swap Reports:** Group A audits Group B, B audits C, C audits D, D audits A.
  2.  **The Audit Checklist:**
      *   **Language Check:** Did they use forbidden qualia terms? (-5 points per violation).
      *   **Overlap Check:** (For Fusion groups) Did they reveal Boundary Tags? If two tags matched, did they declare Subsumption or Residue?
          *   If they fused matching tags without cost: **Critical Failure** (-20 points).
          *   If they have Residue: **Unity Penalty** (-5 points per orphan).
          *   If they have Subsumption: **Richness Penalty** (-5 points per silenced token).
      *   **Ownership Check:** (For Aggregation groups) Did they explain what binds the tokens into one subject? If the report reads like a list without a unifying verb, **Critical Failure** (-20 points).
  3.  **Defense:** Each group has 2 minutes to defend their choice against the Auditors.
  4.  **Winner:** The group with the highest "Phenomenal Coherence Score." (Prize: Bragging rights, or "First choice of seminar topic next week").

  ## 5. Phase 4: The Debrief (25 Minutes)
  *This is where you translate the game mechanics into the metaphysical problem.*

  **Step 1: Map Aggregation to "The Crowd"**
  Ask the Aggregation groups: *"You listed all the tokens. But did you actually create a new subject? Or did you just describe a crowd of little subjects standing in a room?"*
  *   **Point:** This mirrors the **Subject Summing Problem**. Even if you have 14 micro-experiences in a room (or a brain), listing them doesn't create a 15th experience that owns them all. The report describes the *parts*, not the *whole*.

  **Step 2: Map Fusion to "The Loss"**
  Ask the Fusion groups: *"To make your experience unified, how many tokens did you have to silence? How many orphans did you create?"*
  *   **Point:** This mirrors the **Quality Fusion Problem**. If micro-experiences blend to make a macro-experience, the originals must cease to exist (Subsumption). But panpsychism claims the micro-experiences *are* the fundamental reality. If they disappear to make the macro, they weren't fundamental. If they stay (Residue), the macro isn't truly unified.

  **Step 3: The Missing Piece (Instructor Verbal Supply)**
  Tell them: *"The game has a flaw. In the game, you wrote a report on paper. The paper doesn't feel anything. But in reality, if panpsychism is true, the Macro-Subject actually **feels** the report."*
  *   **The Gap:** The game simulates the *structure* of combination, but it cannot simulate the *fact* of subjectivity. You can follow all the rules and still not create a single point of view.
  *   **Mental Causation:** Add this verbally: *"Also, in the game, the report did nothing. In reality, your macro-experience causes you to raise your hand, speak, and argue. The game doesn't show how fused micro-experiences gain the power to move a body. That's the causal closure problem."*

  ## 6. Predictable Failures & Mitigation

  **Failure 1: The "Direct Description" Cheat**
  *   **What happens:** Students get frustrated with relational language and slip up. "Okay, so my blue dot is next to your red..."
  *   **Mitigation:** Appoint one student in each group as the "Language Police" whose sole job is to veto forbidden words. Give them extra points if they catch their own teammates. This gamifies the constraint.

  **Failure 2: The "Magic Fusion" Declaration**
  *   **What happens:** Groups choose Fusion but ignore the Overlap Constraint until the Audit. They claim "We just blended them perfectly."
  *   **Mitigation:** Require them to submit their **Boundary Tag Configuration** with the report. They must physically stack the cards that were fused. If two Red dots are stacked without a "Silenced" card next to them, the Auditors will catch it immediately. Make the physical stacking mandatory.

  **Failure 3: The "Who Cares?" Reaction**
  *   **What happens:** Students treat it as a puzzle game and miss the metaphysical horror.
  *   **Mitigation:** During the debrief, press the Fusion groups: *"You silenced a token. That token was a feeling. You just killed a feeling to make your report work. Does that bother you?"* Make them feel the ethical weight of the metaphysical constraint.

  ## 7. Instructor Notes: What The Game Cannot Reproduce
  *Be honest about the limitations during the debrief.*

  1.  **The Existence of the Reporter:** In the game, the *students* are the reporters. They are already subjects. The game assumes subjects exist to play the game. Panpsychism needs to explain how non-subject matter (or micro-subjects) creates the *capacity* to report. The game skips the genesis of subjectivity.
  2.  **Mental Causation:** The game ends with a paper report. It doesn't show the macro-subject *acting*. Panpsychism struggles to explain how a fused experience drives physical action without violating physics. You must supply this verbally: *"Imagine if this report had to lift a chair. Could a fused quality do that? Or only the individual tokens?"*
  3.  **The Vagueness of Boundaries:** In the game, the Boundary Tags are clear (Red vs. Blue). In reality, we don't know where one micro-experience ends and another begins. The game makes the problem too sharp. Remind them: *"In reality, the boundaries are fuzzy, which makes the Overlap Constraint even harder."*

  ## 8. Payoff Scheme (No Money)
  *   **Base Score:** 100 points.
  *   **Language Violation:** -5 points.
  *   **Overlap Violation (Undeclared):** -20 points.
  *   **Orphaned Residue:** -5 points per token.
  *   **Silenced Token:** -5 points per token.
  *   **Successful Defense:** +10 points (awarded by Instructor based on argument quality).
  *   **Winning Condition:** The group with the highest score gets to choose the "Warm-up Question" for the next seminar. This gives them status without costing you anything.

  ## 9. Timeline Summary
  *   **00-10:** Intro & Deal Cards.
  *   **10-35:** Group Work (Merge Decision & Report Writing).
  *   **35-55:** Auditing & Scoring.
  *   **55-80:** Debrief & Metaphysical Mapping.

  This structure forces them to collide with the logic of combination. They will feel the frustration of trying to make "many" into "one" without losing data or creating orphans. That frustration *is* the Combination Problem.
