answer: |-
  The "species problem" is one of the oldest headaches in philosophy. On one side, you have essentialists, who believe a species is a real, fixed thing with a specific nature—like a blueprint inside every living creature. On the other side, you have nominalists, who argue that species are just names we invent to group similar things together, like drawing lines on a map where the land actually flows continuously. When you read H.G. Wells' *The Island of Doctor Moreau* through this lens, the story stops being just a scary monster tale and becomes a brutal experiment on whether "being human" is something you are born with or something you have to act out.

  Your intuition is sharp: the Beast Folk live by a set of rules called the Law, which feels less like biology and more like a social contract. They gather around the fire and chant things like "Not to go on all-fours" and "Not to eat flesh." This looks like performance. They are trying to become human by doing human things—standing upright, speaking, following rules. If species were just essential biological facts, Moreau wouldn't need to teach them these rules; they would either be human or they wouldn't. The fact that they have to repeat the Law suggests that humanity is a status you maintain through behavior, which supports the nominalist idea that species boundaries are constructed.

  However, the novel makes this performance feel incredibly fragile. The scenes where the Beast Folk chant the Law are tense not because they are learning, but because they are reminding themselves not to slip up. When the Leopard-Man breaks the rule by drinking water on all fours, he isn't just corrected; he is hunted down and killed. This execution scene is crucial for the species problem. If species were just fuzzy populations with flexible edges, breaking a rule shouldn't require death. The violence suggests that the boundary between "man" and "beast" is being violently enforced because it isn't natural. The suffering of the Beast Folk comes from being stuck in the middle of a fuzzy edge that Moreau is trying to turn into a hard wall. They suffer because they are being forced to perform an essence they do not possess.

  This is where the book pushes back against the idea that species are just names. If nominalism were totally true—if biology didn't matter at all—the Beast Folk should be able to stay human as long as they kept following the rules. But they don't. After Moreau dies, the Law collapses. The Sayer of the Law loses his authority, and the hybrids slowly revert to their animal instincts. They stop talking, they start walking on four legs, and they hunt each other. This reversion looks like a win for essentialism. It suggests that there is a "real" nature inside them that eventually crushes the performance. Wells seems to be asking: if you scrub away the social performance, what is left? For the Beast Folk, the answer is the animal essence they were carved from.

  But Wells doesn't let the essentialist victory stand completely. If he did, the book would just be a warning about not playing God. The real philosophical punch comes at the very end, when the protagonist, Prendick, returns to London. He looks at normal human beings and doesn't see civilized people; he sees beasts waiting to revert. He sees the potential for brutality in everyone he meets. This twists the species problem again. If the Beast Folk are just animals pretending to be human, but humans are also just animals pretending to be civilized, then the "human essence" might be an illusion for everyone. The difference between Prendick and the Beast Folk isn't biology; it's just that Prendick's performance is more stable because society supports it.

  This is where you have to be careful not to reduce the book to a simple allegory about racism or colonialism. While those themes are definitely there—Moreau acts like a colonial master imposing order on a "savage" population—the philosophical horror is deeper. It isn't just about oppression; it's about ontology, or what exists. The Beast Folk suffer so clearly from being "in-between" because they are living proof that the line between species is arbitrary, yet crossing it is impossible. Their pain comes from the friction of trying to hold two incompatible identities together. If species were just names, the friction wouldn't hurt this much. The pain proves that biology has weight, even if the categories we put on it are fake.

  So, does performance always lose to nature in this book? For the Beast Folk, yes. Their attempt to construct a new species through social agreement fails because the biological cost is too high. Moreau believed he could rewrite the essence of life, but he only managed to rewrite the surface. However, for the humans, the book suggests that our "essence" is also a performance that could fail at any moment. Wells leaves us with a disturbing middle ground: biology is real and powerful (essentialism), but the moral superiority we claim as humans is a fragile story we tell ourselves (nominalism). The Beast Folk are tragic because they were forced to tell the story without having the biology to back it up, while humans tell the story while hiding the biology underneath.

  Verdict: The novel ultimately sides with a tragic essentialism, demonstrating that while species categories are socially performed, biological nature inevitably reclaims those forced to act against it.
