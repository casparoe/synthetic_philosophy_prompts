answer: |-
  State A deploys hundreds of liquid-fuel missiles on exposed launchpads, vulnerable to State B's precision conventional warheads. As B mobilizes armored divisions near the border, A announces, "If you cross the demarcation line, we will launch a counterforce strike against your airfields." However, A's military counsel advises that waiting for B to cross guarantees A's missiles will be destroyed on the ground, making an immediate launch A's only opportunity to inflict damage. B's leadership, aware of A's vulnerability, interprets A's announcement not as a conditional warning but as a signal that A intends to launch preemptively to save its arsenal before the window closes. Concluding that A will not wait for the formal casus belli because doing so is strategically suicidal for A, B launches a preemptive strike to destroy A's missiles while they are still fueled but stationary.

  (a) In Schelling's framework, a threat is conditional punishment designed to dissuade an action, whereas a promise is a commitment to act that assures an outcome. A's statement looks like a threat ("If you cross..."), but because A's arsenal is vulnerable, launching is A's dominant strategy once mobilization begins regardless of whether B crosses the line. This makes the statement structurally a promise of action rather than a conditional threat. It is perfectly credible without any precommitment device because A does not need to tie its hands; A *wants* to launch to salvage utility from its vulnerable forces, so B knows A is not bluffing.

  (b) This credibility increases B's incentive to strike first because it signals crisis instability rather than restraint. Normally, a credible threat discourages B from acting. Here, the credibility confirms to B that A is locked into a "use-it-or-lose-it" calculus and will likely launch early to avoid disarmament. B realizes that waiting for A to actually fire means losing its own counterforce capability. Therefore, the certainty that A *will* launch creates a reciprocal incentive for B to preempt, transforming A's credibility from a deterrent into a trigger.

  (c) The single feature doing the work is **arsenal vulnerability** (first-strike instability). If you remove this feature and give A a survivable second-strike capability (e.g., submarines), A no longer needs to launch immediately to inflict damage. A can credibly wait for B to cross the line, restoring the conditional nature of the threat. Without vulnerability, A's threat remains a threat rather than becoming a promise of inevitable action, and B loses the incentive to preempt based on A's desperation.

  (d) A defender of "a credible threat deters" would argue this case is semantically invalid: they would claim that because A prefers to launch regardless of B's action, it was never a *deterrent threat* to begin with, but merely a declaration of war. They would argue deterrence requires the threatener to prefer *not* executing the threat if the condition is met, so this scenario doesn't refute the principle. This does not save the principle strategically, however, because it reduces the theory to a tautology: "credible threats deter" becomes "threats that deter are credible," ignoring the real-world problem that vulnerability makes threats credible precisely by making them non-conditional promises of destruction.

  **Settled vs. Contested**

  *   **Settled:** Among strategists, the distinction between conditional threats and unconditional commitments (promises) is standard Schellingian theory. It is also consensus that vulnerable forces create "crisis instability," generating incentives for preemptive strikes (the use-it-or-lose-it logic).
  *   **Contested:** It is genuinely contested whether rational actors *would* actually preempt in this scenario. Some scholars argue that nuclear risk aversion or uncertainty about success dominates the logical incentive to strike first, meaning B might still wait despite A's vulnerability. Additionally, whether a "promise-in-disguise" can ever function as deterrence is debated; some argue that even if A wants to launch, the ambiguity of *when* might still delay B, while others maintain that once vulnerability is known, deterrence is impossible.
