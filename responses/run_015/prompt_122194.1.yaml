      *   *Key Insight:* A leader with *Virtù* anticipates *Fortuna*. If *Fortuna* overwhelms, it's because *Virtù* failed to prepare or adapt. However, for political survival, sometimes one must *blame* *Fortuna* even when *Virtù* failed, or act decisively when *Fortuna* offers an opening.
      *   *Intervention Strategy:*
          *   If *Fortuna* dominates (external shock): Act decisively (Direct Command) because the "enemy" is external, and unity is needed against the threat.
