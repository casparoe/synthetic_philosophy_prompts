              *   High *Fortuna* (External Shock): Use the shock. Centralize power. "Emergency measures."
              *   High *Virtù* Deficit (Internal Rot): You cannot trust the agents. You must change the *structure* (laws, incentives) so that even men without *Virtù* are forced to act well. This aligns with Machiavelli's preference for good laws over good men.

  3.  **Drafting the Procedure (The "Machiavellian Diagnostic"):**
