  Alice and Ben are co-founders of a startup who jointly agree to falsify financial records to secure funding. During a subsequent audit, Alice, acting freely, sanely, and without coercion, deliberately alters the logs to frame Ben solely for the fraud, saving herself. Her conduct manifests a genuinely bad quality of will—malicious betrayal—and Ben straightforwardly judges her morally responsible for this specific wrong. However, because Ben is equally complicit in the underlying fraud, he lacks the moral standing to feel resentment; the participant stance is unfitting given his own dirty hands, and he is instead called to adopt the objective attitude, treating Alice merely as a hazard to be managed rather than a moral partner to hold accountable.

  **Strawson's View vs. Quality-of-Will View**
  Strawson's view ties moral responsibility directly to the appropriateness of reactive attitudes within a relationship; if resentment is unfitting (as here), Strawson must conclude that Alice is not morally responsible *to Ben* (effectively treating the situation as a form of exemption or relationship dissolution). The Quality-of-Will (QoW) view, however, separates responsibility from the victim's stance: Alice is responsible because her action manifested ill will and she had full agency, regardless of whether Ben is positioned to resent her. They diverge because Strawson makes responsibility relational/attitude-dependent, while QoW makes it agent-dependent.

  **The Feature Doing the Work**
  The single feature is the victim's lack of standing due to complicity. If you remove this feature (i.e., Ben was not complicit in the fraud), Ben has full standing, resentment becomes fitting, and both Strawson and QoW align in holding Alice responsible within the participant stance. It does not collapse into an ordinary excuse case because Alice's agency remains intact; the blocker is entirely on the victim's side of the relational equation.

  **The Strawsonian Attack**
  A Strawsonian would attack this by arguing that responsibility *just is* the aptness of reactive attitudes. They would claim that if resentment is unfitting, there is no moral responsibility *in that context*, denying the QoW separation. They would argue I am stipulating the verdict by asserting resentment is unfitting despite bad will, whereas they define bad will *by* the fittingness of resentment. They would insist that if Alice is truly responsible, resentment *must* be fitting, implying my scenario describes a limitation in Ben's relationship capacity, not a gap in responsibility theory.

  \answer{The victim's lack of standing}
