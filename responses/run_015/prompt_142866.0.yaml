          *   *Verdict:* Muddy. The access is a future benefit. The "waste" is the sunk cost feeling. Tom is conflating the *asset* created (skill) with the *fallacy* of continuing due to waste.

      *   **Move 7 (Priya):** Reason to finish is unique access, not years spent. If you don't care about text, years wasted is emotional hangover.
