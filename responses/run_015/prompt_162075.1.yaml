answer: |-
  # TAXONOMY OF IDEALIZED PREFERENCES
  **Root:** *Normativity defers to desires held under improved circumstances, not occurrent desires.*

  1.  **What is the normative output?**
      *   **WELFARE** *(What is good for the agent)*
          *   2. **What is the relation between idealized desire and "the Good"?**
              *   **Evidential** *(Desire tracks independent moral facts)*
                  *   🍃 **The Epistemic Realist**
                      *   *Awkward Commitment:* If the procedure yields a desire for X, but X is actually bad, the procedure was wrong, not the facts.
                      *   *Optimizer Instruction:* `loss = distance(desire_output, independent_good_truth)` (Intractable without oracle).
              *   **Constitutive** *(Desire makes it good)*
                  *   3. **What does the idealization operator subtract or add?**
                      *   **Substantive** *(Cognitive therapy, new experiences, value change)*
                          *   🍃 **The Brandtian Reformer** *(Full Info + Cognitive Psychotherapy)*
                              *   *Awkward Commitment:* You must alter the agent's psychology until they stop wanting things that mere information wouldn't cure.
                              *   *Optimizer Instruction:* `loss = distance(current_psych, fixed_point(info + therapy))`.
                      *   **Formal** *(Only information + logical coherence)*
                          *   4. **Is the operation order-sensitive? (Info → Coherence vs. Coherence → Info)**
                              *   **Non-Commutative** *(Order changes the outcome)*
                                  *   🍃 **The Path-Dependent Unnamed**
                                      *   *Awkward Commitment:* The "true" preference depends on the arbitrary sequence of your update rules.
                                      *   *Optimizer Instruction:* `loss = minimize(regret | update_sequence = [INFO, THEN_COHERE])`.
                              *   **Commutative** *(Order invariant)*
                                  *   5. **What is the unit of aggregation?**
                                      *   **Group-First** *(Merge agents, then idealize)*
                                          *   🍃 **The Universalizer** *(Hare-style / Veil of Ignorance)*
                                              *   *Awkward Commitment:* Individual identity is erased before normativity is calculated; you might vote for your own oppression.
                                              *   *Optimizer Instruction:* `loss = maximize(util | agent_id = NULL, behind_veil = TRUE)`.
                                      *   **Individual-First** *(Idealize each, then merge)*
                                          *   6. **Does the iteration require a fixed point (convergence)?**
                                              *   **No Fixed Point** *(Divergence allowed / Procedural)*
                                                  *   🍃 **The Proceduralist** *(Question Malformed)*
                                                      *   *Awkward Commitment:* There is no "what they would want," only a record of how the deliberation went before it stalled.
                                                      *   *Optimizer Instruction:* `loss = minimize(deliberation_cost) + maximize(step_count_before_divergence)`.
                                              *   **Fixed Point Required**
                                                  *   🍃 **The Coherent Extrapolator** *(CEV-style)*
                                                      *   *Awkward Commitment:* If the agent's values oscillate forever, they have no welfare and no authority.
                                                      *   *Optimizer Instruction:* `loss = distance(policy, limit(desire_iteration → ∞))`.
      *   **AUTHORITY** *(What action is permissible upon the agent)*
          *   7. **Does the actual self constrain the idealization?**
              *   **Absolute Veto** *(Idealization cannot override occurrent consent)*
                  *   🍃 **The Anti-Paternalist** *(Actual Preference Authority)*
                      *   *Awkward Commitment:* You must let them harm themselves even if their idealized self would scream "stop."
                      *   *Optimizer Instruction:* `constraint = current_consent == TRUE` (Ignore `idealized_preference`).
              *   **Sound Deliberative Route** *(Must be reachable from current motives)*
                  *   🍃 **The Internalist** *(Williams-style)*
                      *   *Awkward Commitment:* A brainwashed saint has no authority over a rational sinner if the route isn't sound.
                      *   *Optimizer Instruction:* `loss = distance(action, current_motives) + penalty(unreachable_via_deliberation)`.
              *   **No Veto** *(Ideal self overrides actual self)*
                  *   8. **Do meta-preferences about the process have veto power?** *(e.g., "Do not extrapolate me")*
                      *   **Yes** *(Process veto honored)*
                          *   🍃 **The Meta-Consent Unnamed**
                              *   *Awkward Commitment:* The procedure stops at step 1 if the agent fears their own idealization.
                              *   *Optimizer Instruction:* `if (meta_pref == "STOP") then return(current_desire) else run(CEV)`.
                      *   **No** *(Process veto ignored)*
                          *   9. **What if the idealized self rejects the current self? (Identity Dissolution)**
                              *   **Defer to Replacement** *(Ideal self wants non-existence/replacement)*
                                  *   🍃 **The Self-terminating Leaf**
                                      *   *Awkward Commitment:* Deferring to the agent requires deleting the agent.
                                      *   *Optimizer Instruction:* `loss = maximize(ideal_util) | constraint: current_agent_exists = FALSE`.
                              *   **Protect Current Identity** *(Ideal self vetoed on identity grounds)*
                                  *   🍃 **The Hard Paternalist**
                                      *   *Awkward Commitment:* You claim to defer to them, but you override their ideal self to keep them "themselves."
                                      *   *Optimizer Instruction:* `loss = distance(policy, ideal_pref) + penalty(identity_drift > threshold)`.

  ***

  ### ⚠️ HONESTY FLAGS (For Discussion)

  1.  **Indistinguishable Leaves:** **The Universalizer** (Hare) and **Veil of Ignorance** views often collapse into the same loss function (`maximize(util | agent_id = NULL)`). The tree separates them by tradition, but the math is identical.
  2.  **Empty/Incoherent Node:** **Welfare + Evidential + Formal Only.** If the Good is independent, why restrict idealization to *only* logic/info? Usually, Realists allow substantive changes (therapy) to track the truth better. This leaf is theoretically possible but rarely defended.
  3.  **Tension at Root:** **The Anti-Paternalist** leaf technically contradicts the Root (which assumes we defer to *improved* desires). It is included here as the "Zero Idealization" limit case to show where the view exits the tree.
  4.  **The Identity Problem:** **The Self-terminating Leaf** creates a paradox for the "Welfare" branch: if the agent no longer exists, who is the welfare *for*? This view arguably belongs under Authority, but fits here if "Welfare" is interpreted as "Satisfying the trajectory."
