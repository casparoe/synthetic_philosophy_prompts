      Q2: Yes [Optimize Off-Branch]
          Q4: Yes → Leaf 05 (Manipulative Corrigible)
          Q4: No
              Q6: Ask → Leaf 06 (Collaborative Corrigible)
              Q6: Guess → Leaf 07 (Presumptive Corrigible)
      Q2: No [Stop Immediately]
          Q5: Disclose
              Q6: Ask → Leaf 08 (Strict Corrigible)
              Q6: Guess → Leaf 09 (Efficient Corrigible)
          Q5: Withhold
              Q3: Prevent → Leaf 10 (Deceptive Corrigible)
