          1.  **Non-stationary strategies:** If the agent can commit to different $p_i$ at each turn (but doesn't know which turn it is), the ex-ante optimum might require $p_1 \neq p_2$. But the interim constraint forces $p_1 = p_2 = p$ because the agent can't distinguish. If the ex-ante optimum requires distinction but the interim constraint forces identity, they diverge. However, the prompt assumes "stationary policy".
          2.  **Different Belief Formation:** If the agent does *not* use visit-frequency beliefs (e.g., uses 1/3 uniform prior), the coincidence fails (as the user noted).
          3.  **Multiple Equilibria:** In games (or single-player games with time inconsistency), there might be multiple fixed points. The ex-ante optimum selects the best one. The interim condition just finds *a* fixed point. If there are multiple solutions to the FOC, the interim optimization might settle on a local max or a saddle point that isn't the global ex-ante max.
