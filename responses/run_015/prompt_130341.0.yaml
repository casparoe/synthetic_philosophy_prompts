          So $\frac{dV}{dp} = \sum_{nodes} \frac{\partial V}{\partial p_{node}}$.
          The term $\frac{\partial V}{\partial p_{node}}$ represents the marginal gain of changing $p$ at that specific node, holding others fixed.
