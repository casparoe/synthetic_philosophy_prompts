          $EU_{interim}(Continue) = \sum \pi_i(p) U(Continue | i, p_{future})$.
          Indifference implies $EU_{interim}(Turn) = EU_{interim}(Continue)$.
          This equality is equivalent to $\frac{dV}{dp} = 0$.
