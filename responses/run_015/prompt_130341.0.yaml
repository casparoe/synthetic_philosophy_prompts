          $\pi_i(p) = \frac{P(\text{Reach } i | p)}{\sum_j P(\text{Reach } j | p)}$.
          The interim expected utility of action $a$ (Turn) vs $b$ (Continue) given belief $\pi(p)$ and future policy $p$ is:
