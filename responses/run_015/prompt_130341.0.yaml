      *   **The Result:** In the Absent-Minded Driver (AMD) framework, if the agent uses "visit-frequency" beliefs (derived from the strategy itself) and maximizes expected utility at the node *assuming future selves follow the same strategy*, the first-order condition for the interim optimization is mathematically identical to the first-order condition for the ex ante optimization.
