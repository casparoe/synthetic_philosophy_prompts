          The FOC for Ex-Ante: $\sum_i \frac{\partial P(\text{Reach } i)}{\partial p} \cdot \text{Value}(i) + \dots = 0$.
          The FOC for Interim: $\sum_i \pi_i \cdot (\text{Value}(Turn|i) - \text{Value}(Continue|i)) = 0$.
