answer: |-
  There is no single, standardized term in formal logic or AI safety literature that precisely captures this specific structure. The closest ancestors are **equivocation** (using a word in two different senses) and **concept creep** (the gradual expansion of a concept's meaning over time), but neither fits your description perfectly. Equivocation is typically treated as a binary switch (Sense A vs. Sense B), whereas you are describing a continuous, multi-step interpolation. Concept creep is diachronic (happening across years or literature), whereas this is synchronic (happening within a single argument chain).

  Given the specificity of the mechanism you described—distributed, locally valid, semantically shifting—I propose the term **Gradient Semantic Drift**.

  Here is the carving of the concept, its boundaries, and how it differs from adjacent fallacies.

  ### The Term: Gradient Semantic Drift

  **Definition:**
  Gradient Semantic Drift is a structural flaw in a multi-step argument where the operational definition of a key term shifts incrementally across a chain of locally valid inferences. Each individual step preserves logical validity *if* the term's meaning is held constant at that specific point in the chain, but the cumulative effect is that the term in the conclusion refers to a semantic target distinct from the term in the initial premise. The "gradient" refers to the small, step-wise nature of the shift, which prevents any single link from triggering a validity check.

  **Mechanism:**
  1.  **Anchor:** The argument begins with Term $T$ defined as $D_1$ (e.g., "Safety means no immediate physical harm").
  2.  **Interpolation:** Through steps 2, 3, and 4, the context of $T$ expands or shifts slightly (e.g., "harm" expands to include "psychological distress," then "misalignment," then "optimization pressure").
  3.  **Terminal:** The argument concludes with Term $T$ effectively defined as $D_n$ (e.g., "Safety means total alignment with latent human values").
  4.  **Concealment:** Because $D_1$ is adjacent to $D_2$, and $D_2$ to $D_3$, no single transition appears to break the logic. The discontinuity is only visible when comparing $D_1$ directly to $D_n$.

  ### Distinctions

  #### 1. vs. Classical Equivocation
  *   **Equivocation** is a *switch*. It typically relies on a word having two distinct dictionary definitions (e.g., "bank" of a river vs. "bank" for money). The fallacy occurs when the argument treats them as identical.
  *   **Gradient Semantic Drift** is a *slide*. The dictionary definition may not change, but the *operational* or *contextual* definition drifts. It exploits the tolerance of natural language to accept slight variations in meaning without flagging an error. Equivocation is a jump; Drift is a slope.

  #### 2. vs. Ambiguity
  *   **Ambiguity** is a *state*. A term is ambiguous if it has multiple potential meanings at a single point in time. An argument fails due to ambiguity if the reader cannot determine which meaning is intended.
  *   **Gradient Semantic Drift** is a *process*. The term is not ambiguous at any single step; it appears precise locally. The failure arises from the *trajectory* of the meaning across time (or steps), not its state at a specific moment.

  #### 3. vs. Salami Slicing
  *   **Salami Slicing** is an *ethical/aggregative* fallacy. It refers to committing many small, individually justifiable actions that sum to a large, unjustifiable harm (or benefit). It is about the *consequences* of actions.
  *   **Gradient Semantic Drift** is a *semantic/logical* fallacy. It refers to many small, individually valid inferences that sum to an invalid conclusion. It is about the *truth-preserving nature* of the argument. Salami slicing hides a large cost; Drift hides a large assumption.

  ### Boundary Cases and Edges

  To determine if a specific argument exhibits Gradient Semantic Drift or merely legitimate elaboration, apply these three tests:

  **1. The Reversibility Test**
  *   **Legitimate Elaboration:** If you ask the speaker to clarify the definition at step 4 using the constraints of step 1, they can reconcile them without contradiction. The meaning has been *refined*, not shifted.
  *   **Drift:** If you force the definition from the conclusion back onto the premise, the premise becomes false or trivial. (e.g., If "Safety" in the conclusion means "perfect alignment," does the premise "We can audit safety" still hold? If no, drift has occurred.)

  **2. The Intentionality Boundary**
  *   **Drift (Neutral):** The speaker may genuinely believe the concepts are continuous. This is often a cognitive bias (the "Sorites" effect) rather than deception.
  *   **Drift (Adversarial):** If the speaker knowingly exploits the drift to bypass scrutiny (e.g., getting approval for "X" knowing the implementation will be "Y"), it transitions into **Motivated Framing** or **Deceptive Alignment** (in the context of AI systems).

  **3. The Granularity Boundary**
  *   **Normal Reasoning:** In complex engineering, definitions *must* evolve as abstraction levels change (e.g., "security" at the hardware level vs. "security" at the policy level). This is **Contextual Adaptation**.
  *   **Drift:** The shift becomes fallacious when the change in definition alters the *truth conditions* of the claim without explicit acknowledgment. If the argument relies on the *ambiguity* to bridge a logical gap, it is Drift. If the argument explicitly states, "We are now expanding the definition of X to include Y," it is valid refinement.

  ### Summary Carving

  | Feature | Gradient Semantic Drift | Classical Equivocation | Salami Slicing |
  | :--- | :--- | :--- | :--- |
  | **Unit of Change** | Incremental (Step-to-Step) | Binary (Sense A vs. Sense B) | Aggregative (Action-to-Action) |
  | **Visibility** | Invisible locally, visible globally | Visible if definitions are checked | Visible if total sum is calculated |
  | **Domain** | Semantics / Logic | Semantics / Logic | Ethics / Action |
  | **Core Failure** | Transitivity of meaning fails | Identity of meaning fails | Permissibility of sum fails |

  **Why this matters for AI Safety:**
  In alignment debates, Gradient Semantic Drift is particularly dangerous because it mimics the structure of robust engineering. Safety cases are built on chains of dependency (Proof A supports Claim B, which supports Guarantee C). If the definition of "Guarantee" drifts from "statistical bound" in step 1 to "behavioral assurance" in step 4, the system may be certified as safe based on a proof that no longer applies to its actual operation. Identifying **Gradient Semantic Drift** allows auditors to freeze variable definitions at the start of a chain and verify they remain rigid throughout, rather than checking each step in isolation.
