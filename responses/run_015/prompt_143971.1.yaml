answer: |-
  1. Conceptual brainstorming
  Several established frameworks approach this phenomenon but lack precise fit. "Mission Drift" is the common non-profit term, yet it often implies financial desperation rather than administrative rationality. Robert Merton's "Goal Displacement" describes means becoming ends, whereas your pattern involves the end itself mutating. "Path Dependence" explains historical locking but not necessarily normative decay. "Creeping Normalcy," used by Jared Diamond, describes societal acceptance of gradual change but lacks institutional specificity. DiMaggio and Powell's "Institutional Isomorphism" explains why organizations look alike due to environmental pressure, but not how internal micro-decisions accumulate to shift purpose. Finally, the "Sorites Paradox" offers a logical structure for vague boundaries but lacks sociological mechanism. Each captures a facet—financial pressure, procedural rigidity, environmental mimicry, or logical vagueness—yet none isolates the specific mechanism of *locally rational, globally destructive* aggregation without central intent.

  2. Phenomenological carving
  The pattern is a specific mode of institutional failure where the founding *telos* is eroded not by opposition, but by adaptation. The mechanism is **local rationality**: every decision is defensible within its immediate context (e.g., "ensure solvency," "meet enrollment targets"). Actors are not negligent; they are competently solving proximate problems. However, because no single agent holds the long-term normative horizon, the vector sum of these rational decisions points away from the original mission.

  This is distinct from negligence or entropy; it is active, reasoned adjustment. It differs from generic "drift," which implies passive sliding. Here, the institution walks away from its purpose step-by-step, eyes open to the immediate path but blind to the destination. Crucially, it is not "capture," where an external or internal agent imposes a new will. In this pattern, there is no new will, only the absence of the old one, dissolved by a thousand cuts of pragmatism. The epistemic condition is key: within the timeframe of any single decision-maker, the change is invisible. The betrayal is structural, not volitional. The institution survives physically while dying normatively, maintaining the shell of the charter while evacuating its substance through legitimate procedural channels.

  3. Terminological verdict
  "Mission Drift" is the nearest existing label, but it is too blunt. It often connotes financial compromise or negligence, failing to capture the *rational* and *procedural* nature of the decay you describe. It lacks the philosophical weight required for your narrative architecture. Therefore, I propose the coined term **"Distributed Teleological Erosion" (DTE)**.

  **Definition:** DTE occurs when an institution's founding purpose is gradually displaced through a sequence of decentralized, locally rational decisions that are individually consistent with the charter but collectively incompatible with its original telos.

  **Boundary Case (Inside):** A hospital board approving individual cost-cutting measures to balance annual budgets, which over twenty years systematically eliminates uncompensated care, effectively transforming a charity into a private clinic without a formal vote.
  **Boundary Case (Outside):** A board voting explicitly to amend the charter to allow commercial activities. This is intentional mission change, not erosion. Similarly, a CEO embezzling funds is fraud, not DTE, because it violates rather than utilizes procedural rationality. DTE requires the mechanism of legitimacy to do the work of destruction.

  4. Relation to influence-seeking
  The contrast between Distributed Teleological Erosion and deliberate capture is fundamentally causal and moral. In deliberate capture (the charismatic director), the causal structure is **monocentric**: a specific agent identifies the institution as a vehicle for their will and maneuvers resources accordingly. Accountability is clear; the villain is identifiable. The narrative arc is one of conflict, resistance, and potential exposure.

  In DTE, the causal structure is **polycentric** and emergent. No single agent possesses the power or intent to redirect the institution; the outcome is an emergent property of many small interactions. Accountability dissolves into the "problem of many hands"—everyone is responsible, so no one is. Narratively, capture is a thriller; DTE is a tragedy. Capture relies on deception (hiding the agenda); DTE relies on transparency (every step is documented and justified). The former is a hijacking; the latter is a slow metabolic change where the organism survives but becomes a different species. Recognizing this distinction prevents the error of searching for a conspirator where there is only a system.

  5. Narrative implications
  This distinction radically alters the moral texture of your fiction. If you depict deliberate capture, the reader seeks catharsis through the villain's defeat. If you depict Distributed Teleological Erosion, catharsis is impossible because there is no one to defeat. The horror lies in the **banality of decay**. Characters should not be corrupt; they should be competent, well-meaning, and tragically complicit. The tension arises from the epistemic gap: characters see the immediate necessity but cannot see the historical betrayal. This shifts the theme from moral failure to systemic tragedy. The reader is left with melancholy rather than anger, confronting the unsettling truth that institutions can die of "natural causes" even while every guardian is awake at their post. It suggests that preservation requires more than good intentions; it requires a vigilance against the rationality of the present moment.
