answer: |-
  You have hit on exactly the right nerve. This is not a misunderstanding on your part; it is widely considered the single hardest conceptual problem facing the Many-Worlds Interpretation (MWI). You are asking about the **Probability Problem** (sometimes distinguished as the **Incoherence Problem** and the **Quantitative Problem**).

  Your intuition that the standard definitions of probability break down in a deterministic multiverse is shared by almost every philosopher of physics working on this topic. If the universe is deterministic and all outcomes occur, "probability" cannot mean "frequency of occurrence" (since everything occurs) nor "propensity" (since the dynamics are fixed).

  Here is the map of the literature you are looking for, including the specific names of the problem and the families of solutions you identified.

  ### 1. Naming the Problem

  In the literature, this is usually broken down into two sub-problems:

  *   **The Incoherence Problem:** How can we make sense of *uncertainty* at all? If I know MWI is true, I know that both outcomes will happen. In what sense can I be "unsure" about the future? If there is no uncertainty, there can be no probability.
  *   **The Quantitative Problem (or The Born Rule Problem):** Even if we solve incoherence and find a way to have uncertainty, why should that uncertainty be weighted by the squared amplitude ($|\psi|^2$)? Why not treat all branches as equally likely?

  Your prompt addresses both, but specifically targets the difficulty of deriving the **Born Rule** from the deterministic Schrödinger equation without smuggling it in as an assumption.

  ### 2. The Families of Responses

  You correctly identified the three main camps. Here is how they are labeled and discussed in the philosophy of physics literature.

  #### A. Branch Counting (The "Naive" View)
  *   **Literature Label:** **Branch Counting** or **Naive Counting**.
  *   **The Idea:** As you noted, this suggests that if the amplitude for Up is larger, there are literally "more" branches where Up happens.
  *   **Status:** **Almost universally rejected.**
  *   **Why:** In the formalism of quantum mechanics, branches are not discrete countable objects. The wavefunction is continuous. You can decompose the wavefunction into branches in infinitely many ways depending on the basis you choose (the **Preferred Basis Problem**). Unless you impose a discrete structure on the wavefunction (which isn't in the standard theory), "counting" is ill-defined. As you suspected, to make counting work, you have to weight the count by amplitude, which is circular.
  *   **Key Critic:** Bryce DeWitt (one of MWI's early popularizers) initially leaned this way but later retreated; modern proponents like David Wallace explicitly argue against it.

  #### B. The Decision-Theoretic Approach
  *   **Literature Label:** **Decision-Theoretic Derivation** or the **Deutsch-Wallace Theorem**.
  *   **Proponents:** David Deutsch (1999), David Wallace (2003, 2012).
  *   **The Idea:** This is the approach you described as "betting." It uses **Savagean Decision Theory**. It argues that a rational agent who believes MWI is true, and who satisfies certain axioms of rationality (like diachronic consistency—making plans you won't regret later), is *forced* to bet according to the Born Rule.
  *   **The Claim:** They claim to derive the Born Rule from the non-probabilistic axioms of quantum mechanics + axioms of rationality.
  *   **The Criticism:** Critics (like Adrian Kent, David Albert, and Simon Saunders) argue this is circular. They claim the axioms of rationality secretly presuppose a notion of probability or weight that is equivalent to the Born Rule. The charge is that Wallace defines "rationality" in a way that only makes sense if you already accept the Born Rule.
  *   **Key Text:** David Wallace's *The Emergent Multiverse* (2012) is the definitive statement of this view.

  #### C. Self-Locating Uncertainty
  *   **Literature Label:** **Epistemic Probability**, **Self-Locating Uncertainty**, or the **Carroll-Sebens Approach**.
  *   **Proponents:** Sean Carroll, Charles Sebens, Lev Vaidman.
  *   **The Idea:** This tackles the **Incoherence Problem** first. It argues that there is a brief period *after* the branching (decoherence) but *before* the observer looks at the result. During this window, there are two copies of "you," and you don't know which one you are. This is **self-locating uncertainty** (similar to the Sleeping Beauty problem).
  *   **The Derivation:** They argue that if you apply principles of indifference to these self-locating states, constrained by the physical symmetries of the wavefunction (specifically the **Epistemic Separability Principle**), you derive the Born Rule.
  *   **The Criticism:** Similar to decision theory, critics argue that the principle used to assign weights to the copies (why should I care more about the copy with higher amplitude?) smuggles in the conclusion. Why shouldn't I assign equal probability to being Copy A or Copy B regardless of amplitude?
  *   **Key Text:** Carroll & Sebens, "Self-Locating Uncertainty and the Origin of Probability in Everettian Quantum Mechanics" (2014).

  #### D. A Fourth Approach: Envariance
  *   **Literature Label:** **Environment-Assisted Invariance (Envariance)**.
  *   **Proponent:** Wojciech Zurek.
  *   **The Idea:** This relies on symmetries in entangled states. Zurek argues that if you swap parts of an entangled system, certain properties remain invariant. He claims this symmetry forces the probabilities to be equal for equiprobable states, which can then be extended to derive the Born Rule for unequal amplitudes.
  *   **Status:** Highly technical. Some find it more "physical" than decision theory, but it still faces criticism regarding the assumption of equal probabilities for symmetric states.

  ### 3. The Line Between Derivation and Assumption

  You asked: *"Where the line is between deriving probability and quietly assuming it."*

  This is the central debate in the field. The consensus among skeptics (including many who are sympathetic to MWI) is that **you cannot derive probability from pure ontology.**

  *   **The Humean Objection:** You cannot get an "ought" (how I should bet) from an "is" (the wavefunction). To get probability out, you must put a premise in that links the wavefunction to experience.
  *   **The "Measure" Problem:** In MWI, the "measure of existence" of a branch is given by the squared amplitude. Proponents say this is a physical fact derived from the Hilbert space norm. Critics say this is just probability by another name. If you say "I am more likely to find myself in the branch with higher measure," you are essentially restating the Born Rule, not deriving it.

  **What would count as a solution?**
  To satisfy the critics, a derivation must show that the Born Rule is the *only* consistent way to map the deterministic wavefunction onto subjective experience without adding a new postulate that explicitly mentions probability.

  *   **Wallace** claims to have done this by showing that any other betting strategy leads to irrational behavior (like being money-pumped).
  *   **Carroll** claims to have done this by showing that any other weighting violates the Epistemic Separability Principle.

  **The Verdict:**
  There is no consensus that the problem is "solved."
  *   **Proponents** (Wallace, Carroll) believe the derivations are rigorous and the remaining objections are philosophical quibbles.
  *   **Critics** (Kent, Albert, Maudlin) believe the derivations are sophisticated circular reasoning. They argue that MWI simply lacks the resources to explain probability, and that this is a fatal flaw unless one accepts a "fission" view of identity that changes the meaning of "I."

  ### Summary for your Rabbit Hole
  If you want to read further, these are the search terms and authors you need:

  1.  **The Problem:** "The Incoherence Problem" and "The Quantitative Problem" in Everettian Quantum Mechanics.
  2.  **The Main Defense:** **David Wallace** (Decision Theory) and **Sean Carroll** (Self-Locating Uncertainty).
  3.  **The Main Critique:** **Adrian Kent** (often writes critiques of Wallace), **David Albert** (skeptical of MWI generally), and **Huw Price** (questions the time-asymmetry in these arguments).
  4.  **Key Concept:** **The Born Rule Derivation.**

  You are not missing anything obvious. You have identified the exact point where the physics ends and the philosophy (and controversy) begins. The tension you feel between "deriving" and "assuming" is the active research frontier of the interpretation.
