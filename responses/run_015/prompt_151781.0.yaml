      *   *Conclusion:* I need to weigh which is more coherent. Usually, philosophers argue that Option 1 is necessary to save human rights, even if it softens the ontology. Or, they argue for a "vicarious relation" (the community relates *for* the patient). I should mention the "vicarious" angle as a way to save Option 1 without fully collapsing into individualism.

