          *   *Synthesis:* A modified relational view is needed. Perhaps "potential for relation" or "community's duty to relate" preserves the ontology without the gradient.
      *   **Moral Equality Concessions:**
          *   Option 1 concedes that relationality isn't *everything* (needs a baseline).
