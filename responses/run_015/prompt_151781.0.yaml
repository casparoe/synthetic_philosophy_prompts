      *   *The Problem:* If I'm in a coma, I can't relate. If I'm a hermit, I don't relate. Does that mean I'm less of a person? If yes, can I be killed easier? If no, why call it relational?
      *   *Option 1 (The Distinction):* Maybe there's a "basic" personhood (biological/human) and a "full" personhood (moral/communal).
          *   *Risk:* This sounds like Western liberalism (individual rights inherent at birth). Does it undermine the "I am because we are" claim?
