  9.  **Constructing the Final Output:**
      *   **Introduction:** Acknowledge the difficulty.
      *   **The Procedure:** 5 Steps.
      *   **The Three Wrinkles:** Explicitly mapped to the tests.
      *   **The Handoff:** When to vote.
      *   **The Three Applications:** Showing the work and the final one-paragraph ruling.
      *   **Specific Focus:** Ensure the "Fake Interest" ruling clearly challenges the current guidance as requested.

