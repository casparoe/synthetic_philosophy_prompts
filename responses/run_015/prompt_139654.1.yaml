answer: |-
  ### The Procedure: Five Steps to a Ruling

  **1. Write the Rule**
  Draft the action as a standard instruction using this template: *"An agent may [ACTION] when [OBJECTIVE CONDITION] for the purpose of [PROFESSIONAL GOAL]."* You must state the action honestly (no euphemisms like "enhancing interest" for "lying"). The condition must be factual (e.g., "when no offer exists"), not emotional (e.g., "when the deal is at risk"). If the rule sounds like a loophole, broaden it until it covers all similar situations.

  **2. The Uselessness Test (Self-Defeating)**
  Imagine every agent follows this rule exactly. Does the action become impossible or useless? If the rule relies on trust or a system that would break if everyone used it, it fails. (Example: Bluffing works only if people believe you; if everyone bluffs, no one believes anyone). **Result: Fail.**

  **3. The Advantage Test (Free-Rider)**
  Imagine every agent follows this rule. Does the specific advantage disappear? If the move only helps because *others* are playing by the old rules, it fails. (Example: Arriving early helps only if others arrive on time; if everyone arrives early, the advantage is gone and the schedule is broken). **Result: Fail.**

  **4. The Client Test (Reversibility)**
  Imagine every agent follows this rule. If you were the client (buyer or seller) in this transaction, would you accept this as a fair standard? If you would feel cheated or pressured, it fails. **Result: Fail.**

  **5. Consistency and Handoff**
  Check against past rulings. If this contradicts a past ruling, you must explicitly overturn it. If the rule passes all three tests but still feels wrong, the test has run out. This is now a values question, not a logic one. Vote based on the association's mission, document the dissent, and publish.

  ***

  ### Application to Three Live Queries

  **Query 1: Claiming interest when no offer exists.**
  *   **The Rule:** An agent may tell a buyer other offers exist when none do, to speed up a decision.
  *   **Uselessness Test:** If every agent does this, buyers stop believing agents. The statement becomes noise and cannot speed up decisions. **Fail.**
  *   **Ruling Draft:** Effective immediately, agents may not claim other offers or interest exist unless a written offer is held. This practice relies on buyer trust; if all agents exaggerate interest, the statement loses meaning and harms the profession's credibility. This overturns Guidance Note 42.

  **Query 2: Contacting sellers before an official open house.**
  *   **The Rule:** An agent may contact a seller before the scheduled open house to secure a listing early.
  *   **Advantage Test:** If every agent does this, "scheduled times" become meaningless. Sellers are harassed constantly, and the early agent gains no peace or quiet because another agent will always be earlier. The advantage exists only if others wait. **Fail.**
  *   **Ruling Draft:** Agents must respect scheduled marketing times and may not solicit sellers prior to advertised openings. Allowing early access creates a race to the bottom where no agent gains an advantage, but the seller's privacy and process are degraded. This practice is prohibited to maintain fair market order.

  **Query 3: Withholding a late bid without telling the seller.**
  *   **The Rule:** An agent may withhold a bid received after the deadline to protect the primary deal, without informing the seller.
  *   **Client Test:** If you were the seller, you would not want your agent hiding money from you. You hired the agent to get the best price, not to manage the agent's convenience. **Fail.**
  *   **Ruling Draft:** All offers received must be communicated to the seller immediately, regardless of deadlines. While agents may advise on timing, withholding offers deprives the client of informed choice. A world where agents filter bids by convenience is one no seller would willingly enter. Non-disclosure is a breach of duty.
