prompt: |-
  I'm one of two people who keep the code of conduct for a professional association of estate agents, about five thousand members. Maybe thirty times a year someone writes in to ask whether a move is on: can I tell a buyer there's another offer when there isn't one yet, can I show buyers only our own listings unless they ask, can I hold back a bid that came in after the deadline in case the first one collapses. Right now we argue it out and vote, and near-identical cases come out differently depending on who's in the room, so I went looking for something better and kept landing on Kant's universalization test, which feels like it should be usable here except that every version I find is either a slogan or a seminar.

  What I need is an actual procedure. How to get from a member's self-serving description of what they want to do to a maxim stated at a fixed level of generality, with a rule for how general to make it and when to widen or narrow it — this looks like the step where everything gets decided, since 'I'll be vague about competing offers', 'I'll mislead a buyer', and 'I'll lie about whether an offer exists' are the same bit of behaviour and I assume they don't all come out the same. Then the tests, in the order we should run them, and where each one stops us with a no.

  Three wrinkle types keep coming up and I want the procedure to handle them rather than leave them to judgment. Some moves only work because most people don't make them: turning up early to an open house to get to the seller before anyone else is fine if nobody else does it and useless if everyone does, and I can't tell whether that counts against it. Some moves destroy the thing they depend on: if every agent said 'that's our final price' and meant nothing by it, the sentence wouldn't do any work any more, so once universal the maxim can't even be carried out — is that the same failure as the first kind or a different one? And some seem to fail only when you picture being on the receiving end: a world where every agent pressures buyers to sign quickly is perfectly thinkable, I just wouldn't want to be the buyer in it.

  Constraints: two weeks a ruling, one paragraph of plain language with no philosophy jargon in it, written by me and one other person, and it has to sit okay beside the couple hundred rulings we've already published, some of which I suspect are wrong. Give me the steps, what counts as a good enough answer at each, the points where it hands the call back to us because it's a values question rather than something the test settles, and the cases where it just runs out. Then run it on three live queries, including one where you expect it to rule against something we currently permit: telling a buyer 'there's interest in the property' when no offer actually exists is our present guidance and I'd like to see whether it survives you.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** One of two custodians of a Code of Conduct for 5,000 estate agents.
      *   **Problem:** Current ad-hoc voting leads to inconsistent rulings on ethical edge cases (e.g., lying about offers, withholding bids, steering buyers).
      *   **Goal:** A practical, step-by-step procedure based on Kant's universalization test (Categorical Imperative) but stripped of philosophy jargon.
      *   **Constraints:**
          *   Must fit within a two-week ruling cycle.
          *   Output must be one paragraph of plain language (for the final ruling).
          *   Must be usable by two people.
          *   Must coexist with ~200 past rulings (some potentially inconsistent).
          *   Must handle three specific "wrinkle types":
              1.  *Free-rider/Advantage* (works only if others don't do it).
              2.  *Self-defeating* ( destroys the practice it relies on, e.g., bluffing).
              3.  *Reversibility* (world is thinkable, but I wouldn't want to be on the receiving end).
          *   Must define how to formulate the "maxim" (the rule of action) to avoid manipulation via vagueness/specificity.
          *   Must identify where the test fails and hands back to human judgment.
          *   **Task:** Provide the procedure *and* run it on three live queries (including one where the current guidance is "tell buyers there's interest when no offer exists," which the user suspects might fail the test).

  2.  **Deconstruct the Kantian Framework for this Context:**
      *   *Kant's Core:* Act only according to that maxim whereby you can at the same time will that it should become a universal law.
      *   *Translation for Estate Agents:* "Would this work if *every* agent did it, every time, in this situation?"
      *   *The Maxim Formulation Problem:* The user rightly identifies that "I'll lie" vs. "I'll lie to save a deal" changes the outcome. The procedure needs a standard for specificity.
      *   *The Three Failures:*
          1.  *Contradiction in Conception (Self-Defeating):* If everyone did it, the action becomes impossible (e.g., lying destroys trust needed for lying to work).
          2.  *Contradiction in Will (Reversibility):* If everyone did it, the system works, but you wouldn't want to live in it (e.g., high pressure).
          3.  *Fairness/Free-Rider:* If everyone did it, the advantage vanishes (e.g., arriving early).

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Step 1: The Maxim.* Needs to be specific enough to be useful but general enough to be a rule. *Idea:* Describe the action, the condition, and the goal. "I will [action] when [condition] to achieve [goal]."
      *   *Step 2: Universalize.* Imagine every agent does this.
      *   *Step 3: The Tests.*
          *   Test A: Does it break the game? (Self-defeating).
          *   Test B: Does it rely on others *not* doing it? (Free-rider).
          *   Test C: Would you accept this if you were the client? (Reversibility).
      *   *Step 4: The Verdict.* If it fails any, it's a No. If it passes, it's a Yes. If it's a values clash, flag it.
      *   *Refining the "Maxim" Step:* This is the crux. How to prevent "I will lie except when it hurts me"? The rule should be: State the action and the *relevant* professional circumstance, not the personal benefit.
      *   *Refining the "Wrinkle" Handling:*
          *   *Free-rider:* If universalizing removes the benefit, it fails. (Kant's "Contradiction in Will" often covers this, but let's make it explicit).
          *   *Self-defeating:* If universalizing makes the action impossible, it fails. (Kant's "Contradiction in Conception").
          *   *Reversibility:* If universalizing creates a world you reject as a participant, it fails.

  4.  **Developing the Three Live Queries:**
      *   *Query 1 (The User's Target):* "Tell a buyer there's interest/offer when none exists." Current guidance: Permitted. Hypothesis: Fails self-defeating test.
      *   *Query 2 (The Free-Rider):* "Arrive early to an open house to pitch the seller before others." Current guidance: Likely grey/permitted. Hypothesis: Fails free-rider test.
      *   *Query 3 (The Reversibility/Pressure):* "Hold back a late bid in case the first collapses." Current guidance: Likely permitted (fiduciary duty to seller). Hypothesis: Might pass or fail depending on framing. Let's make it "Withhold a written offer from the seller." That definitely fails. Or "Pressure buyer to sign quickly." Let's go with "Withhold a bid received 1 hour after deadline." This tests the "rules are flexible" maxim.

  5.  **Drafting the Content (adhering to constraints):**
      *   *Constraint Check:* The user asked for "Give me the steps... Then run it on three live queries." The output needs to be the procedure *and* the application.
      *   *Constraint Check:* "One paragraph of plain language with no philosophy jargon in it." This applies to the *final ruling* format, but the user is asking *me* for the procedure now. I need to provide the procedure clearly, then show how the final output looks. Wait, re-reading: "Constraints: two weeks a ruling, one paragraph of plain language... written by me and one other person." This describes *their* workflow constraints. My output to *them* should be the manual/procedure they can use. I should write the procedure clearly, then demonstrate it.
      *   *Constraint Check:* "No philosophy jargon." I must avoid "Categorical Imperative," "Maxim," "Conception/Will," "Noumena," etc. Use "Rule," "Action," "Everyone does it," "Breaks the system."

  6.  **Refining the Procedure Steps:**
      1.  **Write the Rule:** "I will [action] whenever [professional situation] to [professional goal]." (Ban personal desperation as a condition).
      2.  **Imagine Everyone:** Picture every agent doing this, every time.
      3.  **Test 1 (The Broken Tool):** Does doing this make the tool useless? (e.g., lying makes words meaningless). If yes -> **No.**
      4.  **Test 2 (The Crowd):** Does this only help because others *don't* do it? (e.g., cutting in line). If yes -> **No.**
      5.  **Test 3 (The Swap):** If you were the client, would you accept this system? If no -> **No.**
      6.  **The Handoff:** If it passes all three but still feels wrong, it's a values call, not a logic call. Mark it "Permitted but Monitored."

  7.  **Running the Queries:**
      *   *Query 1 (Fake Interest):*
          *   Rule: "I will claim other offers exist when none do to speed up a buyer."
          *   Universal: Every agent claims offers exist when they don't.
          *   Test 1 (Broken Tool): Buyers stop believing agents. The claim becomes noise. The goal (speed up) fails. **Fail.** (Contradicts current guidance).
      *   *Query 2 (Early Arrival):*
          *   Rule: "I will contact sellers before the official open house time to secure the listing."
          *   Universal: Every agent contacts sellers before official times.
          *   Test 2 (The Crowd): If everyone does it, the "official time" means nothing. Sellers are harassed constantly. The advantage (quiet access) vanishes. **Fail.**
      *   *Query 3 (Late Bid):*
