      *(Refining the "Maxim" formulation)*: The user is worried about "I'll be vague" vs "I'll lie." The procedure must force them to state the *deception* clearly. I will add a constraint: "State the action honestly. Do not use euphemisms."

      *(Refining the "Past Rulings" constraint)*: I need to add a step that says "Check against past rulings. If this contradicts a past ruling, you must explicitly overturn it or distinguish the facts."

      *(Final Polish)*: Ensure the tone is professional, direct, and respectful of their time.

      *(Wait, one more check on the "One Paragraph" constraint)*: "Constraints: ... one paragraph of plain language ... written by me and one other person." This implies the *final ruling document* they publish must be one paragraph. My response to the user should be the *guide* on how to write that. I will structure my response to give them the tool, then show them what the tool produces.

