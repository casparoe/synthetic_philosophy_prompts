          *   Universal: Every agent withholds late bids.
          *   Test 3 (The Swap): If I were the seller, I would not want this. I lose money. **Fail.** (Unless the rule is "I will follow the seller's written instructions on deadlines." That passes). Let's frame the query as "Can I hold it back *without telling the seller*?" That fails.

  8.  **Final Review against Constraints:**
      *   Plain language? Yes.
      *   Handle the three wrinkles? Yes (Broken Tool = Self-defeating, The Crowd = Free-rider, The Swap = Reversibility).
      *   Address the "Maxim" formulation? Yes, by standardizing the "Rule" sentence structure.
