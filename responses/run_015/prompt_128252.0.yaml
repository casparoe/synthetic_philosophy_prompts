answer: |-
  Based on the pattern of her five prior verdicts, here is the prediction for her decision, the underlying principle, and the analysis of the moral stakes.

  ### The Verdict
  She should **reject the proposal** to replace the bronze plaques with the generative AI installation.

  While the proposal aims to enhance accessibility and engagement (aligning with the spirit of Verdict 2 regarding disclosure), it fundamentally violates the constraints she has established for *public, institutional records of harm*. The proposal entails the destruction of a fixed physical object (violating Verdict 1) and replaces an unalterable record with a fluid, algorithmic reconstruction (violating Verdict 5). Although Verdict 4 allows for the cessation of rituals that foster resentment, that exception applies to *commemorative practices* that have become toxic, not to *archival records* of atrocity. In her framework, the risk of "strategic forgetting" or revisionism inherent in generative inference outweighs the benefit of dynamic engagement when the subject is a documented genocide.

  ### The Closest Analog
  The closest analog is **Verdict 5 (Automated Deletion vs. Institutional Preservation)**.

  In Verdict 5, she drew a sharp line between private archives (which may be ephemeral) and institutional records of public harm (which require "permanent, unalterable preservation"). The proposed AI installation is an institutional record of public harm. By relying on "algorithmically reconstructed inferential material," the installation is inherently *alterable* and probabilistic, failing the "unalterable" requirement she deemed essential for public harm records. Verdict 1 (The Monument) is a secondary analog, reinforcing that removing the physical anchor betrays the duty to remember, but Verdict 5 provides the specific criterion regarding the *stability of the record* that condemns the generative nature of the AI.

  ### The Governing Principle
  The candidate principle that best explains the pattern across her judgments is: **A principle preserving the fixed, authoritative material form of public memorials and records of harm.**

  While she permits flexibility in private identity formation (Verdict 2) and ritual practice (Verdict 4), her verdicts on public obligations (Verdicts 1, 3, and 5) consistently prioritize **fixity and material persistence** over accessibility or modernization when the subject is state-sanctioned or public violence. She treats the material form not merely as a vessel for content, but as a moral anchor that resists the "dissolution of authoritative tradition" (Rieff) through technological or cultural drift.

  ### The Distinguishing Test Case
  To distinguish between the rule of "preserving content regardless of medium" and the rule of "preserving fixed material form," the best further case would be:

  **A proposal to remove the bronze plaques but preserve their exact inscriptions in a static, read-only digital kiosk located on the same site.**

  *   **Why this distinguishes the rules:** This case isolates the variable of *materiality* from the variable of *fixity*.
      *   If she **approves** this case, she adheres to a principle of **Content Preservation**: the medium (bronze vs. screen) is secondary so long as the information is accurate and permanent.
      *   If she **rejects** this case (insisting the bronze must remain), she adheres to a principle of **Material Sanctity**: the physical artifact itself carries moral authority that digital surrogates cannot replicate.
      *   *Prediction:* Given Verdict 1 ("removing the physical object betrays the duty"), she would likely **reject** even the static digital replacement, confirming that her principle is tied to the *material form* itself, not just the data.

  ### The Moral Principles at Stake
  If she were to deviate from her pattern and **approve** the installation, she would be adopting the principle that the duty to remember binds a community only to the **faithful transmission and relevance of the narrative**. Under this view, memory is a living dialogue; if the material form becomes a barrier to understanding for new generations, the medium must evolve to ensure the *content* survives, even if the form changes.

  By **rejecting** the installation (as consistency demands), she adopts the principle that the duty to remember binds a community to the **material witness of the record**. Under this view, the fixed form is a safeguard against the malleability of human interpretation. The "truth" of the atrocity is not just in the data, but in the unyielding presence of the witness (the plaque/monument). To make the memory fluid (via AI) is to risk the "strategic forgetting" she seeks to prevent, suggesting that the *constraint* of the memory is as morally vital as its *content*.
