prompt: |-
  I volunteer as a facilitator for a small peer-support group for people living with recurrent depression and bipolar disorder, and part of my job is sitting down with new members for a single ninety-minute session to write what we call a "bad day plan": one page, written while the member is steady, saying what the rest of us should do if they start to slide — who to call, whether to contact their clinician, whether emergency services should ever be involved, and what they have told us in advance that they do and don't want. Months later that page gets used by whoever happens to be on the phone at two in the morning, often a volunteer who has never met the member, so it has to be legible to a stranger under time pressure. I have no academic background in any of this; I got interested after a friend compared it to the story of Odysseus having himself tied to the mast, and I've been reading and arguing about it on my own ever since.

  The tangle I can't resolve on my own is that the person who shows up later is often not the person who signed the page. Sometimes a member in a bad stretch texts us to cancel the plan outright — "ignore everything I wrote, I meant none of it, don't contact anyone" — and we can't tell whether that is the very state the plan was written to guard against, or a genuine change of mind we should respect. Sometimes it runs the other way: someone wrote a clause at the bottom of an episode ("never let them hospitalize me again, whatever happens") and now, stable and on a medication that works, insists the clause should stay, and I don't know whether honoring that is loyalty to their earlier self or just ratifying something a suffering person wrote. Sometimes the later self is simply better informed than the earlier one — a new diagnosis, a new drug, a therapist who explained something nobody knew when the page was signed. And the same puzzle has come up one level up: our group is drafting an amendment to its own rules about when plans can be overridden, and everyone wants to pass it in the same heated meeting where an incident happened, which is exactly when I least trust our judgment.

  What I need from you is a procedure my fellow facilitators and I can actually run, not a discussion of the theory for its own sake. Please give me: the questions to ask in order during and after a session; what counts as a good enough answer to each one given that we have ninety minutes and no clinical training; the point at which the procedure just stops and says no, we don't write this clause or we don't act on this instruction; and the points where it has to hand the decision to a human being — the member, their clinician, the group — because the question is really about whose values count rather than about facts. Include the shape of the one-page output itself, since that is the artifact that has to work at two in the morning. Please run the procedure on three situations like the ones I described — the cancellation message sent during a bad stretch, the clause written at the bottom of an episode that the now-stable member wants to keep, and the charter amendment proposed in the heat of an incident — including at least one case where it gives an answer our group will dislike. Finally, be explicit about what the procedure cannot do: where it will misfire, and which disagreements it can only surface rather than settle. Anything the procedure asks us to record has to be something a volunteer could write down in plain language and defend to the member afterwards.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Volunteer facilitator for a peer-support group (recurrent depression/bipolar).
      *   **Task:** Create a concrete, actionable procedure for writing and managing "Bad Day Plans" (BDPs).
      *   **Constraints:** 90-minute session, no clinical training, output must be legible to a stranger at 2 AM, must address the "identity/time" problem (who is the "real" self?).
      *   **Specific Problems to Address:**
          1.  Cancellation requests during a bad stretch ("ignore the plan").
          2.  Clauses written during an episode that the stable self wants to keep (e.g., "no hospitalization").
          3.  Group rule amendments proposed during a heated incident.
      *   **Required Outputs:**
          1.  Step-by-step procedure (questions, thresholds, stop points, hand-off points).
          2.  Shape of the one-page output (the BDP itself).
          3.  Application of the procedure to the three specific scenarios (including one unpopular answer).
          4.  Explicit limitations (where it misfires, what it can't settle).
      *   **Tone:** Practical, empathetic, clear, non-clinical but safety-conscious.

  2.  **Deconstruct the Core Ethical/Practical Tension:**
      *   The "Odysseus" metaphor is apt but imperfect. Odysseus knew the Sirens were dangerous. A depressed person might believe the Sirens are friends.
      *   The core conflict: *Precedence of the Stable Self vs. Autonomy of the Current Self vs. Safety.*
      *   Since the facilitators are *not* clinicians, they cannot assess capacity or medical risk. They must rely on *process* and *consensus* with the member's support network (clinicians/family) where possible, while maintaining peer support boundaries.
      *   *Key Principle:* The BDP is a *request for help*, not a legally binding advance directive (usually). It guides peers, not doctors. Safety overrides preference in immediate life-threatening situations, but the *plan* dictates how to navigate that.

  3.  **Drafting the Procedure (The "Steady State Protocol"):**
      *   *Goal:* Ensure the plan reflects the "Stable Self" without ignoring the "Struggling Self's" immediate safety needs.
      *   *Structure:* Pre-session check -> Session Questions -> Red Flags/Stop Points -> Hand-offs.
      *   *Questions:* Need to test consistency, reasoning, and external validation.
      *   *Stop Points:* If the member is currently unstable, if the request violates safety laws/policies, if the request contradicts known medical advice without clinician sign-off.
      *   *Hand-offs:* Clinicians (medical risk), Group Consensus (policy), Member (final autonomy on non-safety issues).

  4.  **Designing the One-Page Output (The "2 AM Document"):**
      *   Must be scannable.
      *   Hierarchy: Emergency > Contact > Comfort > Do Nots.
      *   Needs a "Validity Check" section (When was this written? Who witnessed it?).
      *   Needs a "Revocation Protocol" (How do I cancel this?).

  5.  **Applying to Scenarios:**
      *   *Scenario 1 (Cancellation during bad stretch):* The procedure needs to flag this as high risk. If they say "ignore plan," is that the illness talking? The procedure should likely advise *following the original plan* unless a clinician says otherwise, because the BDP was made for *this exact moment*.
      *   *Scenario 2 (Stable self keeping episode clause):* "No hospitalization." If the stable self wants to keep this, it's a value judgment. The procedure should allow it *if* safety thresholds aren't breached, but requires clinician acknowledgment.
      *   *Scenario 3 (Group amendment during heat):* This is about governance. The procedure should say "No decisions in crisis." Cool-down period required.
      *   *Unpopular Answer:* For Scenario 1, telling the group to *ignore* the cancellation text and follow the original plan is likely to feel violating to the member in the moment, but is safer. Or, for Scenario 3, stopping the vote entirely might annoy the group wanting action. Let's go with Scenario 1: The procedure dictates that a text cancellation during a slide is invalid without clinician confirmation. This is hard but necessary.

  6.  **Refining the Limitations:**
      *   This isn't legal advice.
      *   This doesn't replace 911.
      *   It can't solve the metaphysical question of "which self is real."
      *   It relies on honest disclosure.

  7.  **Iterative Polishing (Self-Correction during drafting):**
      *   *Critique:* Is this too clinical?
      *   *Fix:* Keep language plain. Avoid "capacity assessment." Use "Steady State Check."
      *   *Critique:* Is the 2 AM doc too complex?
      *   *Fix:* Use bold headers, traffic light system (Red/Yellow/Green).
      *   *Critique:* Did I answer the specific prompt requirements?
      *   *Check:* Questions? Yes. Stop points? Yes. Hand-offs? Yes. One-page shape? Yes. Three scenarios? Yes. Limitations? Yes.

  8.  **Final Review against Safety Guidelines:**
      *   I am an AI. I must not give medical advice. I must emphasize that this is a *peer support* tool, not a medical order.
      *   I need to make sure the procedure explicitly defers to emergency services in life-threatening situations regardless of the plan.
      *   I need to ensure the "Unpopular Answer" doesn't encourage negligence. (Deciding to ignore a "don't call me" text during a crisis is standard safety protocol, not negligence).

  9.  **Finalizing the Content:** (Mental outline of the response)
      *   Introduction: Acknowledge the difficulty.
      *   Part 1: The Intake Procedure (Questions, Thresholds, Stop Points).
      *   Part 2: The One-Page Artifact (Visual layout).
      *   Part 3: Scenario Testing (The three cases).
      *   Part 4: Limitations & Misfires.

  *(Self-Correction on Scenario 1)*: If a member texts "ignore plan," and the plan says "call me," but they say "don't," the peer is in a bind. The procedure needs to clarify that the BDP is a *standing agreement* that cannot be revoked via text during a declared "bad day." Revocation requires a "Steady State" confirmation. This is the "Unpopular Answer."

  *(Self-Correction on Scenario 3)*: The group rule change. The procedure should mandate a "Cooling Off Period" for governance changes.

  *(Self-Correction on Scenario 2)*: Stable self keeping "No Hospital" clause. This is allowed *provided* it doesn't conflict with imminent harm protocols. The procedure validates the Stable Self's right to set boundaries, even if born of past trauma, as long as safety isn't compromised.

  10. **Writing the Response:** (Focusing on clarity, actionable steps, and empathy).
answer: |-
  This is a profound operational challenge. You are building a bridge between two different states of consciousness using only paper and trust. Because you are peers and not clinicians, your procedure cannot assess *medical capacity*; it must assess *procedural consistency* and *safety thresholds*.

  Here is a concrete procedure, the artifact it produces, and the application to your specific dilemmas.

  ### Part 1: The "Steady State" Intake Procedure

  This procedure runs during the 90-minute session. Its goal is not to therapy, but to stress-test the plan for the 2 AM volunteer.

  **Phase 1: The Stability Check (Minutes 0–15)**
  *Goal: Confirm the member is currently in the "Steady Self" state required to write the plan.*
  *   **Question 1:** "On a scale of 1–10, where 1 is your worst episode and 10 is your best stability, where are you today?"
      *   *Good Enough Answer:* 7 or higher.
      *   *Stop Point:* If 6 or lower. **Do not write the plan.** Reschedule. A plan written in the fog cannot guide through the fog.
  *   **Question 2:** "Have you had any major medication changes, new diagnoses, or therapist recommendations in the last 30 days?"
      *   *Good Enough Answer:* "No" OR "Yes, and I have adjusted the draft plan to match."
      *   *Hand-off:* If "Yes" and they haven't adjusted it, pause writing. They must consult their clinician before finalizing the plan.

  **Phase 2: The Scenario Stress-Test (Minutes 15–60)**
  *Goal: Ensure the instructions are actionable by a stranger.*
  *   **Question 3:** "If we call you and you don't answer, what is the exact next step? Who do we call next?"
      *   *Good Enough Answer:* A specific name and number (e.g., "Call my sister, Jane, 555-0199"). Vague answers like "try again later" are rejected.
  *   **Question 4:** "You have written 'Do not contact my clinician.' If we believe you are in immediate physical danger, do we still honor that?"
      *   *Good Enough Answer:* "No. Safety overrides the plan."
      *   *Stop Point:* If they insist safety does not override the plan. **Do not sign.** You cannot facilitate a plan that requires volunteers to ignore imminent harm.
  *   **Question 5:** "How do we know if *this* document is the current one? How will you tell us if you change your mind?"
      *   *Good Enough Answer:* "I will email the facilitator lead to request a rewrite. I will not revoke this via text during a bad day."
      *   *Hand-off:* This defines the **Revocation Protocol**. (See Artifact below).

  **Phase 3: The "Future Self" Clause (Minutes 60–75)**
  *Goal: Address instructions that restrict future care (e.g., no hospitalization).*
  *   **Question 6:** "This clause restricts what we can do. Did you discuss this specific restriction with your clinician?"
      *   *Good Enough Answer:* "Yes" (with clinician name noted) OR "No, but I accept the risk."
      *   *Hand-off:* If the clause involves refusing life-saving intervention (e.g., "Never call 911"), you must hand the decision to the **Group Safety Lead**. The group cannot agree to be complicit in negligence.
  *   **Question 7:** "Why is this important to you?"
      *   *Good Enough Answer:* A value statement (e.g., "Last time I was hospitalized, I was traumatized").
      *   *Stop Point:* If the reason is delusional or factually incorrect regarding current safety (e.g., "The hospital is run by spies"). Refer to clinician.

  **Phase 4: Sign-off (Minutes 75–90)**
  *   **Action:** Member signs and dates. Facilitator signs as witness to *steadiness*, not medical advice.
  *   **Action:** Member identifies one "Plan Guardian" (a friend/clinician not in the group) who holds a copy.

  ***

  ### Part 2: The One-Page Artifact (The "2 AM Document")

  This must be scannable in under 30 seconds by a stressed volunteer.

  **[HEADER]**
  **BAD DAY PLAN: [MEMBER NAME]**
  **Date Written:** [DD/MM/YYYY] | **Stability Rating at Signing:** [7-10]
  **Facilitator Witness:** [Name]
  **Status:** [ACTIVE / SUPERSEDED]

  **[SECTION 1: THE TRAFFIC LIGHTS]**
  *   **GREEN (I'm off, but okay):** Text only. Do not call.
  *   **AMBER (I am sliding):** Call me max 2x. If no answer, contact [Name/Relation, Phone].
  *   **RED (I am gone/dangerous):** Do not wait. Contact [Clinician Name, Phone] THEN [Emergency Contact Name, Phone].
      *   *Note:* If Red, **Emergency Services MAY be called** if [Specific Condition, e.g., "threatening self-harm"].

  **[SECTION 2: THE HARD NOs]**
  *   Do NOT say: "Cheer up," "It's all in your head."
  *   Do NOT do: Come to my house uninvited.
  *   Do NOT contact: [Specific Person, e.g., "My Mother"].

  **[SECTION 3: REVOCATION RULES]**
  *   **To Change This Plan:** I must be in a GREEN state. I must email [Facilitator Lead] and schedule a new session.
  *   **During a Bad Day:** I cannot cancel this plan via text/voicemail. If I text "Ignore this," **follow this document anyway** unless my Clinician confirms otherwise.

  **[SECTION 4: CLINICIAN ACKNOWLEDGMENT]**
  *   Has a clinician reviewed the "Hard No" clauses? [Yes/No]
  *   Clinician Name (if Yes): _______________

  ***

  ### Part 3: Running the Procedure on Your Three Scenarios

  Here is how the procedure above resolves the tangles you described.

  **Scenario 1: The Cancellation Text**
  *   *Situation:* Member is in a bad stretch. Texts: "Ignore everything I wrote, don't contact anyone."
  *   *Procedure Application:* Refer to **Artifact Section 3 (Revocation Rules)** and **Intake Question 5**. The plan explicitly states that revocation requires a "Steady State" (Green) confirmation via email/session, not text during a slide.
  *   *Decision:* **Ignore the text. Follow the original plan.**
  *   *Why:* The procedure recognizes that the ability to revoke the plan is itself a function of stability. Allowing revocation via text during a crisis renders the plan useless.
  *   *The Unpopular Answer:* Your group will dislike this because it feels paternalistic. The member will feel violated. However, the procedure dictates that the "Steady Self" signed a contract that the "Struggling Self" cannot unilaterally void via SMS. *Exception:* If the text indicates immediate lethal intent, safety overrides the plan (call 911), regardless of the "Do Not Contact" instruction.

  **Scenario 2: The "No Hospital" Clause from a Past Episode**
  *   *Situation:* Member wrote "Never hospitalize me" during a past episode. Now stable, they want to keep it.
  *   *Procedure Application:* Refer to **Intake Question 6 & 7**.
      1.  Is the member currently stable? Yes (they are in the session).
      2.  Did they discuss this with a clinician?
          *   If **Yes**: The clause stays. It is a value judgment by a stable person.
          *   If **No**: The clause is flagged. The Facilitator must explain that if "Red" criteria are met (imminent harm), the group *must* call emergency services regardless of the note. The note can stand for *non-lethal* crises only.
  *   *Decision:* **Keep the clause, but qualify it.** Add to Section 1 (Red): "Unless imminent physical harm is observed."
  *   *Why:* This honors the Stable Self's autonomy (loyalty to the signer) without binding the volunteer to negligence. It distinguishes between "I hate hospitals" (valid preference) and "Let me die" (invalid instruction).

  **Scenario 3: The Charter Amendment in Heat**
  *   *Situation:* Group wants to change rules on overriding plans immediately after an incident.
  *   *Procedure Application:* This mirrors **Intake Phase 1 (Stability Check)**. The group is currently in an "Amber/Red" emotional state.
  *   *Decision:* **Stop the vote.** Institute a mandatory 72-hour "Cooling Off Period" for governance changes.
  *   *Why:* Just as an individual cannot rewrite their BDP in a crisis, the collective cannot rewrite its safety protocols in a crisis. The "Group Stability" is compromised.
  *   *Hand-off:* The decision is handed to the **Facilitator Lead** to table the motion. The group's values count, but only when the group is steady.

  ***

  ### Part 4: Limitations and Misfires

  You asked for explicit boundaries on where this procedure fails. You must record these in your facilitator handbook.

  **1. The "Rational Suicide" Misfire**
  *   *Where it fails:* If a member is stable, rational, and decides they do not want to live (not due to psychosis, but due to enduring suffering), this procedure cannot help you.
  *   *Why:* The procedure assumes "Stability = Desire for Safety." If a stable person chooses risk, the procedure forces you to choose between their autonomy and your liability.
  *   *What to record:* "This plan is not a legal advance directive. It does not protect volunteers from mandatory reporting laws."

  **2. The "Stranger" Gap**
  *   *Where it fails:* The 2 AM volunteer may not understand the nuance of "Call Sister but not Mother."
  *   *Why:* Plain language can still be misread under stress.
  *   *What to record:* "If in doubt, escalate." The procedure prioritizes *action* over *precision* in Red states. It is better to annoy a member by calling a clinician than to miss a crisis.

  **3. The "Clinician Silence" Problem**
  *   *Where it fails:* In Scenario 2, if the clinician refuses to engage with the peer group (which is common due to privacy laws), you cannot get the "Yes" for Question 6.
  *   *Why:* HIPAA/Privacy laws prevent clinicians from confirming they even know the patient.
  *   *What to record:* If clinician confirmation is impossible, the member must sign a **Waiver of Confidentiality** specifically allowing the clinician to verify the *existence* of the plan to the Facilitator Lead. If they refuse, the "Hard No" clauses are voided for safety.

  **4. The Metaphysical Limit**
  *   *Where it fails:* You cannot solve the question "Which self is real?"
  *   *Why:* This procedure arbitrarily defines "Real" as "The one who shows up to the 90-minute session sober/stable."
  *   *What to record:* This is a pragmatic definition, not a philosophical truth. It is possible the "Sick Self" knows something the "Well Self" denies. The procedure sides with the Well Self for *operational* reasons, not because they are morally superior.

  ### Summary for Your Handbook

  1.  **No Plan in Crisis:** Never write or amend a plan if stability is <7/10.
  2.  **No Text Revocation:** A plan cannot be cancelled by the person it is designed to protect during the event.
  3.  **Safety Trumps Preference:** "Do Not Call 911" is never a valid clause if physical harm is imminent.
  4.  **Cool Down Governance:** Group rules cannot be changed during or immediately after an incident.
  5.  **Plain Language:** If a 2 AM volunteer can't understand it in 30 seconds, rewrite it.

  This procedure shifts the burden from "guessing what they want" to "following the agreed process." It protects the volunteer (you followed the rules), protects the group (consistency), and protects the member (their stable wishes are honored over their transient impulses).
