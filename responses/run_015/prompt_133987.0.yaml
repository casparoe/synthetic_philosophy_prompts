          *   *Verdict:* Problematic. Nietzsche warns against the *excess* of all three. In his specific historical context (1874 Germany), the danger was actually the *Antiquarian* (academic hoarding) and *Monumental* (superficial hero worship) paralyzing action. Critical history is dangerous, yes, but Nietzsche often leans on it to combat the "historical sickness." Saying the *real* danger is Critical dominating feels like a conservative reading, not Nietzsche's.
      *   *Sentence 3:* "Monumental is basically antiquarian except it focuses on heroes rather than institutions."
          *   *Verdict:* Conflation. They serve different psychological needs. Monumental is for the *striving* man (action); Antiquarian is for the *preserving* man (piety/reverence). Reducing Monumental to a subset of Antiquarian misses the "inspiration to act" vs. "reverence for origin" distinction.
      *   *Sentence 4:* "And Nietzsche ultimately endorses critical history as teh only genuinely life-affirming mode, because it clears dead weight for the new."
