  the host said: "Nietzsche splits historical consciousness into monumental, which looks to great figures to inspire present action; antiquarian, which reveres old customs and artifacts out of loyalty; and critical, which judges the past harshly so we can break free. He thinks all three are necessary, but the real danger is when critical dominates, since then you just tear everything down and buiild nothing new. Monumental is basically antiquarian except it focuses on heroes rather than institutions. And Nietzsche ultimately endorses critical history as teh only genuinely life-affirming mode, because it clears dead weight for the new."

  whats accurate here, whats a subtle conflation or overstatement, and does the host's conclusion actually follow? also, when they say "life-affirming," are they mixing in Schopenhauer's will-to-live or using Nietzsche's own idea of life as growth and overcoming? no need for a bibiography or reading list—i just want a straight conceptual audit i can use.
