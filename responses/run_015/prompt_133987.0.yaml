      *   *Schopenhauer vs. Nietzsche:* Schopenhauer's "Will" is blind, suffering, something to be denied/quieted. Nietzsche's "Life" is something to be intensified, affirmed, even in suffering. The host likely uses "life-affirming" loosely, but if they mean "clearing dead weight," that sounds more like progressivism than Nietzsche's tragic affirmation.

