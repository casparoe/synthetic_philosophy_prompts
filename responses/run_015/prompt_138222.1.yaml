answer: |-
  This is a beautifully constructed argument. It effectively synthesizes the "Problem of Intertheoretic Comparisons" (steps 2–4) with the "Normalization Problem" (steps 5–8) to generate a skeptical conclusion (9) that mirrors the most serious objections in the literature (e.g., from Gracely, Seidenfeld, or early MacAskill).

  You are right to feel that (9) proves too much. If valid, it undermines not just normative uncertainty but any aggregation of heterogeneous values (social choice, multi-criteria decision analysis). Since you want to preserve the intuition that hedging is rational in mundane cases, you need to locate the fracture.

  Here is the diagnosis: **Step (3) is doing the illegitimate work, and Step (8) is drawing an illicit inference from a technical limitation.**

  ### 1. The Category Mistake in Step (3)

  Step (3) claims: *"There is no unit of assessment common to them all."*

  This conflates the **criterion of rightness** with the **object of evaluation**.
  *   **Utilitarianism:** Criterion = Maximize utility. Object = Consequences (mapped to acts).
  *   **Deontology:** Criterion = Conformity to duty. Object = Acts.
  *   **Virtue Ethics:** Criterion = What the virtuous agent would do. Object = Acts (via the agent's character).

  While the *grounds* of evaluation differ (consequences vs. duties vs. character), any moral theory that is a candidate for *practical* guidance must be able to deliver a verdict on the agent's available options. If a theory literally cannot rank the options available to the agent (e.g., "I assess institutions, not your lunch choice"), then it is not a live competitor in your decision problem. It is irrelevant to *this* choice.

  For the purposes of decision theory, we are not asking theories to agree on *why* an act is good, only to assign a value to the act *qua* choice. We can construct a derived choice-worthiness function $C_T(A)$ for any theory $T$ and act $A$.
  *   If $T$ is act-utilitarian, $C_T(A)$ is the utility of $A$.
  *   If $T$ is rule-utilitarian, $C_T(A)$ is the utility of the rule $A$ falls under.
  *   If $T$ is virtue ethics, $C_T(A)$ is the "virtue-score" of performing $A$.

  **Why it looked sound:** It exploits the genuine metaphysical differences between theories to suggest they are linguistically or conceptually intranslatable. But decision theory requires a functional translation, not a metaphysical identity. As long as $T$ implies "You ought to do A rather than B," it assigns a higher choice-worthiness to A. The "unit" is simply *choice-worthiness according to T*. The challenge is comparing the *magnitude* of differences between theories (Step 2), not the *object* of assessment (Step 3).

  **Recommendation:** Reject (3). Theories can be mapped to a common domain (the option set) even if their internal structures differ.

  ### 2. The Overreach in Step (8)

  Step (8) claims: *"A procedure whose output varies with presentation order... is not a procedure of rational choice."*

  This relies on a strict interpretation of the **Independence of Irrelevant Alternatives (IIA)**. While IIA is a standard axiom in social choice and rational choice theory, violating it does not render a procedure "empty" or mere "rationalization."

  *   **Context Sensitivity:** In empirical decision theory, adding an option can change the risk profile or the informational value of a choice. In normative uncertainty, adding an option changes the *range* of normalization. This makes choice-worthiness context-relative, not undefined.
  *   **Rationalization vs. Sensitivity:** A procedure is a "device for rationalization" only if the agent can *manipulate* the option set to guarantee a desired outcome. If the option set is fixed by reality (or by the seminar syllabus), the sensitivity is a structural feature of the moral landscape, not a bug in the agent's reasoning.

  **Why it looked sound:** It appeals to the robust intuition that rational requirements shouldn't depend on arbitrary framing. But "arbitrary" is doing heavy lifting. If the option set defines the scope of the moral problem, it isn't arbitrary.

  **Recommendation:** Reject (8). Accept that decision-making under normative uncertainty violates IIA. This is a cost, not a *reductio*.

  ### 3. If You Must Surrender a Premise: The Price of Keeping (1) and (6)

  You mentioned you would rather keep (1) (Maximize Expected Choice-Worthiness) and (6) (Normalization is sensitive). If you do this, you must surrender the demand for **precise cardinality** implicit in (2) and (9).

  Here is what that surrender commits you to:

  **A. Hedging is possible via Stochastic Dominance, not just Expectation.**
  You do not need a precise cardinal scale to hedge. You only need to know that one option is *less risky* across normalizations.
  *   *Mundane Case:* Theory A (Credence 0.5) says Act X is Permissible (0) and Act Y is Wrong (-10). Theory B (Credence 0.5) says Act X is Wrong (-10) and Act Y is Permissible (0).
  *   Even without knowing if A's "-10" equals B's "-10", you can see that a third option, Z (Abstain), which is rated "Okay" (e.g., -1) by *both* theories, might stochastically dominate X and Y.
  *   **Commitment:** You teach students that normative uncertainty often yields a *partial ordering* of options, not a total ordering. Rationality requires choosing from the undominated set, not necessarily maximizing a precise number.

  **B. Moral Verdicts are Option-Relative.**
  You must accept that the choice-worthiness of an act is not an intrinsic property but a relation between the act, the theory, and the *feasible set*.
  *   **Commitment:** This aligns with contrastivist views of moral obligation. "You ought to do X" is elliptical for "You ought to do X *rather than Y or Z*." If Y is removed, the verdict on X can change. This is controversial but defensible.

  **C. Normalization is a Heuristic, not a Derivation.**
  You must treat normalization rules (like variance normalization) as pragmatic conventions for making progress, rather than discoveries of the "true" moral metric.
  *   **Commitment:** When different normalization rules disagree, rationality does not demand a unique answer. It permits a range of permissible actions. In your seminar, this turns the "problem" into a feature: normative uncertainty expands the set of rationally permissible options (moral caution).

  ### 4. How to Teach This in the Seminar

  Do not present this argument as a *reductio* of the field. Present it as the **central tension** of the field.

  1.  **Start with the Mundane Case:** Get students to agree that if they are 50% on Deontology and 50% on Utilitarianism, and Deontology forbids lying while Utilitarianism requires it, they should feel some pull to hedge (e.g., tell a vague truth).
  2.  **Introduce the Argument:** Show them exactly the derivation you wrote above. Let them feel the force of (9).
  3.  **The Pivot:** Ask them: "Does this mean the mundane intuition was wrong, or that our model of rationality is too rigid?"
  4.  **The Solution:** Introduce **Stochastic Dominance** (MacAskill's preferred route for handling normalization issues).
      *   If Option A is better than Option B according to *all* reasonable normalizations, choose A.
      *   If the ranking flips depending on normalization, both are permissible.
      *   This preserves (1) in spirit (maximizing value) but relaxes the requirement for precise cardinality.

  ### Summary Diagnosis

  *   **Illegitimate Work:** Step (3). It mistakes structural diversity for evaluative incommensurability.
  *   **Overreach:** Step (8). Violating IIA is a theoretical cost, not a proof of irrationality.
  *   **Premise to Surrender:** If you must choose, surrender the claim in (9) that the approach is *empty*. It is not empty; it is *indeterminate*.
  *   **Commitment:** You commit to a view where normative uncertainty often fails to yield a unique verdict but successfully rules out extreme options, validating hedging in mundane cases without requiring a "moral meter" that measures utils across metaphysical frameworks.

  You have backed yourself into a corner that looks like a dead end but is actually the gateway to the most interesting literature in the field (MacAskill, Bykvist, Sepielli, Cotton). The argument is valid, but (9) does not follow from (8) because "rational choice" can accommodate indeterminacy and context-sensitivity. Keep (1), keep the intuition behind (6), and reject the skepticism of (9).
