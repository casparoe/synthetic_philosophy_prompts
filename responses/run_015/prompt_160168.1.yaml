answer: |-
  You have stumbled onto one of the most active and difficult debates in contemporary epistemology, but you have found it in the wild, where the stakes are lives rather than tenure.

  The phenomenon you are describing does not have a single catchy name like "The Gettier Problem," but it is a composite of three specific philosophical concepts: **Pragmatic Encroachment**, **Sensitivity/Safety Conditions**, and the **Assurance View of Assertion**.

  Here is the breakdown of what is happening in your dispatch logs, mapped to the philosophy, and answers to your specific questions about norms, action, and the "cheap check."

  ### 1. Does this have a name?

  The closest technical label for the intuition your team is having is a violation of **Epistemic Sensitivity**.

  In Case One, your team's complaint ("He could not have told if it had not been clear") is an almost verbatim definition of the **Sensitivity Condition** in epistemology (made famous by Robert Nozick).
  *   **Sensitivity:** You only know/assert $P$ if, had $P$ been false, you would not have believed $P$.
  *   **Your Case:** If the ridge *had not* been clear, he still would have said it was clear (because he didn't use the binoculars). Therefore, his assertion is *insensitive*. It is disconnected from the truth by luck.

  However, the *anger* and the *context* point to a broader framework called **Pragmatic Encroachment** (associated with philosophers like Jeremy Fantl, Matthew McGrath, and Jason Stanley). This theory argues that whether you "know" something (and thus are allowed to assert it) depends on the **stakes**.
  *   In a casual conversation, looking "sort of" from the truck might be enough to say "The ridge looks clear."
  *   In SAR, where a false positive sends a team into a dangerous slide zone, the stakes are high. High stakes "encroach" on the epistemic standard. You need *more* evidence to claim you "know" something when the cost of being wrong is death.

  ### 2. Is this a fourth norm, or a reading of one of the three?

  It is best understood as a **contextualized reading of the Knowledge Norm**, specifically modified by **Epistemic Responsibility**.

  The standard "Knowledge Norm of Assertion" (championed by Timothy Williamson) says: *Assert only what you know.*
  Your team's behavior suggests the norm is actually: *Assert only what you know **via a reliable process that is robust against error**.*

  In Case One, the dispatcher technically had a true belief. But because he skipped the binoculars, his belief was **epistemically negligent**. This touches on **Virtue Epistemology** (like Ernest Sosa or Linda Zagzebski), which argues that knowledge isn't just a state of mind; it's the result of intellectual *virtue* or *competence*.
  *   Skipping the binoculars is an intellectual vice (laziness/carelessness).
  *   Therefore, even if the result is true, the assertion is improper because it wasn't generated by a competent process.

  So, it is not a fourth norm. It is the Knowledge Norm, but with the understanding that "Knowledge" requires **due diligence** proportional to the risk.

  ### 3. Is it about assertion, or about what the rest of us may do with what we hear?

  This is the most critical insight you have had: **It is about what the listeners are licensed to do.**

  In philosophy, this is called the **Assurance View** (associated with Richard Moran and Edward Hinchman). When you assert something over the radio, you are not just dumping data. You are giving an **assurance**. You are saying, "You can rely on this. I take responsibility for this."

  *   **Case One:** By saying "The ridge is clear," the dispatcher is inviting the team to bet their lives on his word. If his basis was shaky (no binoculars), he has issued an assurance he cannot back up. He has invited reliance on a fragile foundation. The complaint isn't that he lied; it's that he **betrayed the trust required for coordination.**
  *   **Case Two:** This is even clearer. When the guy says, "I was right, wasn't I," he is claiming **credit**. He is implying his *method* worked. His team is angry because he is claiming **authority** he does not possess. If he says "I got lucky," he acknowledges the method is broken and warns them not to rely on it next time. By claiming he "was right," he encourages them to trust single-ping data again. That is dangerous.

  So, the norm is not just "Don't speak falsehoods." The norm is **"Do not invite reliance unless your basis supports the weight of that reliance."**

  ### 4. Does the "cheapness of the skipped check" actually matter?

  **Yes, objectively.** It is not just a feeling.

  In epistemology and ethics, this is the difference between **Invincible Ignorance** and **Negligence**.
  *   **Thick Fog:** If there is fog and no way to check, the ignorance is invincible. You cannot be blamed for not seeing what cannot be seen. Your assertion ("I can't see the ridge") is properly calibrated to your evidence.
  *   **The Binoculars:** If the tool to verify is in the truck and costs 30 seconds, skipping it is **Epistemic Negligence**.

  Why does this matter philosophically? Because it changes the **Counterfactual Reliability**.
  *   If you check with binoculars, your assertion is *Safe*: In nearby possible worlds where the ridge is not clear, you see the climbers and don't say it's clear.
  *   If you don't check, your assertion is *Unsafe*: In nearby possible worlds where the ridge is not clear, you still say it's clear.

  The "cheapness" matters because it establishes a **duty of care**. In SAR, you have a professional obligation to minimize risk. Ignoring a low-cost, high-value verification step violates the professional standard of the role. It transforms a mistake into a **breach of protocol**.

  ### Summary for your context

  You are operating under a **High-Stakes Reliability Norm**.

  1.  **Truth is not enough.** (Case 1 was true, but still blameworthy).
  2.  **Belief is not enough.** (He believed it, but shouldn't have).
  3.  **Knowledge is not enough** (in the loose sense). (He "knew" in the moment, but his knowledge was Gettierized—it was true by luck).

  The complaint your team makes is about **Warranted Assertibility**.
  *   **Case 1:** He lacked warrant because he was **Insensitive** (he would have said it even if false).
  *   **Case 2:** He lacked warrant because he was **Misrepresenting his Reliability** (claiming skill where there was luck).

  The "cheap check" is the boundary between **Acceptable Risk** and **Negligence**. In thick fog, the risk is environmental. With the binoculars in the truck, the risk is internal (human error). Your team is angry about the internal risk because it is controllable.

  **The Name:** If you need a label for your logs or training, the closest professional term is **"Unwarranted Assurance"** or **"Premature Closure."** But philosophically, you are enforcing a **Sensitivity Condition on Assertion under Pragmatic Encroachment.**

  You are right to feel that the standard philosophical triad (Truth, Belief, Knowledge) misses the mark. They are static states. SAR dispatch is dynamic and action-oriented. The norm you are following is: **"Assert only what creates a safe license to act."**
