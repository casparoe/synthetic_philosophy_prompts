      *(Self-Correction during drafting)*: I should explicitly mention that in high-stakes environments, the "Knowledge Norm" effectively transforms into a "Reliability Norm." The "cheap check" is the difference between a reliable and unreliable process.

      *Case 2 nuance:* Saying "I was right" asserts a causal link between skill and outcome. If it was luck, that assertion is false. That's why people are angry. It's a false claim about *agency*.

