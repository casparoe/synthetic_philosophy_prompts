prompt: |-
  I do some volunteer search-and-rescue dispatch, and I keep noticing a kind of complaint we make about things people say over the radio, and I dont think it is any of the three things Ive seen philosophers argue about.

  Case one: someone says the ridge above the treeline is clear. It is clear. He believed it, and he had looked, sort of, from the truck. But there is a pair of binoculars in the truck and thirty seconds to use them, and he did not. Afterwards everyone says he should not have said it. Nobody says it was false, nobody says he did not believe it, and when you push them they do not quite say he did not know it either. What they say is that he could not have told if it had not been clear.

  Case two: another guy gives a position off a single cell ping, gets it right, and then says so -- I was right, wasnt I -- and that makes people angrier, not less. If he had said I got lucky, everyone would of dropped it. And if the position had been wrong, lucky would not have been any excuse at all.

  So the complaint does not track how things turned out. It seems to track whether the person would have said the same thing if it had been false, and it seems to get worse when there was a check he could have done cheaply and skipped. In thick fog with no way to check anything, nobody complains, even though the basis is just as thin.

  I know there is a big argument about whether you are only allowed to come out with what you know, or what is true, or what you believe, but none of those three sounds like what we are doing. Does this thing have a name? I dont want just a label though -- I want to know whether it is a fourth norm or a reading of one of the three, whether it is really about assertion at all or about what the rest of us may do with what we hear, and whether the cheapness of the skipped check actually matters or only feels like it does.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** Volunteer search-and-rescue (SAR) dispatch. High stakes, time-sensitive, reliance on radio communication.
      *   **Observation:** The user notices a specific type of complaint/criticism regarding radio assertions that doesn't fit the standard philosophical triad (Truth, Belief, Knowledge).
      *   **Case 1:** "Ridge is clear." It *was* clear. He believed it. He looked "sort of." He skipped a cheap check (binoculars). Complaint: "He couldn't have told if it hadn't been clear." (Sensitivity/Safety issue).
      *   **Case 2:** Position off single cell ping. Got it right. Said "I was right." People angry. If he said "I got lucky," they'd be okay. If he was wrong, "lucky" wouldn't excuse it. Complaint: Claiming authority/credit for a result that wasn't robustly grounded.
      *   **Key Pattern:** The complaint tracks *counterfactual robustness* (would you have said this if it were false?) and *effort/cost of verification* (skipped a cheap check). It doesn't track truth (it was true) or standard knowledge (technically true belief, maybe).
      *   **Questions:**
          1.  Does this have a name?
          2.  Is it a fourth norm or a reading of one of the three (Truth, Belief, Knowledge)?
          3.  Is it about assertion or about what listeners *do* with the info?
          4.  Does the "cheapness of the skipped check" actually matter?

  2.  **Philosophical Mapping:**
      *   *Standard Norms of Assertion:*
          *   Truth Norm (Assert only what is true).
          *   Belief Norm (Assert only what you believe).
          *   Knowledge Norm (Assert only what you know - Williamson).
      *   *The User's Problem:* In Case 1, the assertion was True, Believed, and arguably "Known" (in a loose sense), yet it was improper. Why? Because the *method* of arriving at the belief was unreliable in a specific way.
      *   *Key Concept 1: Sensitivity and Safety (Epistemology).*
          *   Sensitivity: If $p$ were false, would you believe $p$? (In Case 1: If the ridge *weren't* clear, would he have said it was? Yes, because he didn't use binoculars. So his belief is *insensitive*.)
          *   Safety: If you believe $p$, could $p$ easily have been false? (Related to reliability).
      *   *Key Concept 2: Proper Function/Responsibilist Virtue Epistemology.*
          *   It's not just about the state of the mind, but the *conduct* of the inquirer. Did he fulfill his intellectual duties? (Skipped the binoculars).
      *   *Key Concept 3: Assurance View of Assertion (Moran, Hinchman).*
          *   Assertion isn't just conveying info; it's giving *assurance* or taking *responsibility*. By saying "It is clear," he invites reliance. If the basis is shaky, he has betrayed that trust, even if he got lucky.
      *   *Key Concept 4: Action-Guiding Norms (Pragmatics).*
          *   In SAR, assertions are instructions for action. The norm might be "Assert only what is *safe to act on*."

  3.  **Synthesizing the Answer:**

      *   **Name:** There isn't one single "famous" name like "The Gettier Problem," but the closest philosophical clusters are **Epistemic Responsibility**, **Safety/Sensitivity Conditions**, and the **Norm of Assertoric Responsibility/Assurance**. In practical fields (aviation, medicine, SAR), this is often called **Situational Awareness** or **Standard of Care**, but philosophically, it's about the *warrant* required for high-stakes assertion.
      *   **Fourth Norm or Reading?** It's best understood as a *strengthening* of the Knowledge Norm, specifically tailored to **High-Stakes Contexts**. It's not a fourth *fundamental* norm, but a contextual modulation of the Knowledge/Justification norm. It's about *Actionable Knowledge*.
      *   **Assertion vs. Listener Action:** It is deeply about what the listeners *do*. In SAR, an assertion is a *directive*. It triggers resource allocation. Therefore, the norm is "Assert only what justifies *action*." This aligns with **Pragmatic Encroachment** (Stanley, Fantl & McGrath). The stakes raise the bar for knowledge/assertion.
      *   **The "Cheap Check":** Yes, it matters. This is about **Epistemic Negligence**. If the cost of verification is low and the cost of error is high, skipping the check violates the duty of care. This connects to **Virtue Epistemology** (intellectual diligence).

  4.  **Drafting the Response (Iterative refinement):**

      *   *Acknowledge the insight:* The user has spotted something real and sophisticated. It's not just "common sense"; it cuts to the heart of contemporary epistemology.
      *   *Address the "Name":* Mention **Pragmatic Encroachment** and **Safety/Sensitivity**. Also, the **Assurance View**.
      *   *Address the "Norm":* It's not a fourth norm, but a contextualized Knowledge Norm. The "Knowledge Norm of Assertion" (Williamson) is the baseline, but *what counts as knowledge* shifts with stakes.
      *   *Address the "Cheap Check":* This is crucial. It's about **Epistemic Responsibility**. The "could have told if it had not been clear" line is literally the definition of **Sensitivity** (Nozick).
      *   *Address Case 2:* This is about **Credit vs. Luck**. Claiming "I was right" implies a reliable method. If the method was luck, claiming credit is a lie about the *process*, even if the *content* was true.
      *   *SAR Specifics:* Connect it to "Actionability." In SAR, information is a tool. A tool that breaks when you need it (counterfactually) is a bad tool.

  5.  **Refining the Philosophical Terminology:**
      *   *Sensitivity:* "If $p$ were false, S would not believe $p$." Case 1 fails this.
      *   *Safety:* "If S believes $p$, $p$ could not easily have been false."
      *   *Pragmatic Encroachment:* Stakes affect whether you know/can assert.
