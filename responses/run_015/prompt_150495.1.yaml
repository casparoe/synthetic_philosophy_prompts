answer: |-
  Based on the four verdicts provided, your colleague is operating under a specific variation of the Annales School historiography. She is not a "pure" structuralist in the sense that she acknowledges *conjuncture* (the intersection of different time-scales), but she is a **Dual-Structuralist**. She treats both environmental systems (climate, geography) and human systems (fiscal policy, bureaucracy, market networks) as *longue durée* structures, while relegating human agency (decisions, battles, specific leaders) to the *histoire événementielle* (surface foam).

  Here is the best guess at her verdict on the Maya case, the rules governing her reasoning, and the case that would test them.

  ### 1. The Verdict on the Classic Maya Collapse
  **Verdict:** She will argue that the **institutional fragility of the divine kingship and ritual economy was the necessary mechanism** that turned drought into collapse.

  **Reasoning:**
  While she prioritizes environmental factors in the Sahel and Greenland cases, her verdicts on Rome and Meiji reveal a crucial nuance: she accepts *human-made systems* as causal structures if they are sufficiently rigid and long-lasting.
  *   **Rome:** She cited "fiscal divergence" (an institutional structure) alongside aridification.
  *   **Meiji:** She cited "Tokugawa information-gathering infrastructure" (an institutional structure) alongside geography.
  *   **Greenland/Sahel:** She downplayed *agency* (decisions, merchant networks), not necessarily *institutions*. The "ivory-export market" in Greenland is an institutional structure, but she treated its collapse as an external force similar to climate.

  In the Maya case, "divine kingship and monument-building" is not a surface event like a specific battle or a specific king's decision; it is a centuries-old **structural rigidity**. It functions exactly like the Tokugawa bureaucracy or the Roman fiscal system.
  *   **The Drought:** This is the *environmental stressor* (analogous to the North Atlantic cooling or the Sahel monsoon shift).
  *   **The Warfare/Dynastic Failure:** These are *events* (analogous to the 476 collapse or the Perry expedition). She will dismiss these as symptoms.
  *   **The Ritual Economy:** This is the *institutional structure*.

  She will likely argue that the drought was the *trigger*, but the *collapse* was caused by the institutional inability to adapt. Unlike the Sahel farmers who shifted crops (adaptation), the Maya kings were locked into a ritual economy that required surplus for monuments to validate power. When the surplus vanished, the structure broke. She will treat the institutional rigidity as the explanatory variable that distinguishes the Maya collapse from other societies that endured drought without political disintegration.

  ### 2. The Competing Rules
  To accommodate her four earlier verdicts, we can distill two competing historiographical rules. Her actual methodology is a synthesis, but the tension lies here:

  **Rule A: Geographic-Climate Determinism (The Hard Braudelian View)**
  *   **Premise:** Physical constraints (climate, soil, geography) are the ultimate independent variables. Human institutions are epiphenomenal adaptations to these constraints.
  *   **Application:** In the Sahel and Greenland cases, this rule dominates. The monsoon boundary and the Little Ice Age are the primary causes; human choices are merely reactions to physical reality.
  *   **Prediction for Maya:** The drought alone explains the collapse. The ritual economy is irrelevant; any society would have collapsed under that level of aridification.

  **Rule B: Institutional Path-Dependence (The Structuralist View)**
  *   **Premise:** History is driven by slow-moving constraints, whether natural *or* human-made. Institutions (fiscal systems, bureaucracies, ritual economies) create "lock-in" effects that determine how a society responds to stress.
  *   **Application:** In the Rome and Meiji cases, this rule dominates. The Roman fiscal divergence and Tokugawa infrastructure are treated as causal forces equal to geography.
  *   **Prediction for Maya:** The drought was common to the region, but the *specific* collapse of Tikal and Calakmul is explained by their specific political architecture. Other Maya cities (or other contemporary societies) that survived did so because their institutions were more flexible.

  **Her Actual Position:** She follows **Rule B** regarding *mechanism*, but **Rule A** regarding *ultimacy*. She believes environmental stress provides the *pressure*, but institutional structure determines the *failure point*. She rejects "Great Man" history (agency) but accepts "Great System" history (institutions).

  ### 3. The Adjudicating Case
  To distinguish whether she leans closer to Geographic Determinism (Rule A) or Institutional Path-Dependence (Rule B), you need a case where the **environment is constant** but the **institutions differ**, leading to **different outcomes**.

  **The Best Case: The Norse vs. The Inuit in Greenland (14th–15th Century)**
  You already discussed the Norse abandonment. The adjudicating move is to ask her explicitly about the **Inuit (Thule culture)** who arrived in Greenland during the same cooling period and *survived*.

  *   **The Setup:** Both groups faced the exact same environmental stress (Little Ice Age cooling, sea-ice expansion).
  *   **The Variable:** Institutional/Cultural Architecture.
      *   *Norse:* Pastoralist, church-centered, rigid European hierarchy, dependent on livestock and European trade.
      *   *Inuit:* Hunter-gatherer, flexible kin-based organization, marine-focused technology, no dependency on European markets.
  *   **The Outcome:** Norse vanished; Inuit persisted.

  **How to Interpret Her Answer:**
  *   **If she is a Geographic Determinist:** She will argue the Inuit survived because they were "better adapted to the environment" in a biological or quasi-geographic sense (e.g., "Their culture was essentially an extension of the Arctic ecology"). She might treat the Norse failure as inevitable due to the climate alone, viewing the Inuit survival as an exception that proves the rule of harshness.
  *   **If she is an Institutional Path-Dependence Theorist:** She will argue the Inuit survived because their **social institutions were more flexible**. She will highlight the *structural difference*: the Norse were locked into a ritual/economic system (tithes, livestock, European identity) that prevented adaptation, whereas the Inuit institutional structure allowed for rapid technological and social shifts.

  **Alternative Case: The 4.2 Kiloyear Event (Old Kingdom Egypt vs. Indus Valley)**
  If she prefers civilizational scales over local ecology:
  *   **Stress:** Global aridification c. 2200 BCE.
  *   **Variable:** Centralized Divine Kingship (Egypt) vs. Decentralized Corporate Urbanism (Indus).
  *   **Outcome:** Egypt collapsed (First Intermediate Period); Indus transformed but persisted (no evidence of mass violence or total collapse).
  *   **The Test:** Does she attribute Egypt's collapse to the *drought* (Geo) or the *centralization* (Institutional)? If she admits the Indus survived the *same* drought due to *different institutions*, she must concede that institutions are causal mediators, not just epiphenomena.

  **Recommendation:** Propose the **Norse vs. Inuit** comparison. It directly builds on her Greenland verdict and forces her to clarify whether "Culture" counts as a *Longue Durée* structure (which she values) or merely a surface reaction to Geography (which she prioritizes in the Sahel). If she admits the Inuit social structure was the key to survival, she is an Institutional Path-Dependence theorist. If she insists the climate simply "allowed" Inuit and "forbade" Norse, she is a Geographic Determinist.
