prompt: |-
  I serve on a committee at my university that is rewriting the academic integrity code, and we keep circling around a case that none of us can state cleanly. Under current policy, a student registered with disability services who carries an ADHD diagnosis may sit an exam on a prescribed stimulant, and the university is obliged to accommodate her; the same drug, taken by an undiagnosed classmate who bought it from a friend, counts as unauthorized cognitive enhancement and can end his degree. The disability office does not claim that the pill works differently in the two students — everyone concedes that the effect on attention, impulse control and endurance is much the same — but rather that in the first case it restores normal functioning and in the second it improves on normal functioning. Our student health plan displays the same shape: it pays for that stimulant, for insulin, for a cochlear implant and for antidepressants, but not for laser eye surgery, not for a wakefulness drug for the student who simply prefers to work nights, and not for growth hormone for a boy who is short because his parents are short and whose endocrinologist can find nothing wrong with him. Anti-doping rules in sport look parallel again: an athlete with a documented hormone deficiency can be certified to use a substance that is banned for everyone else, and an asthmatic may use an inhaler, but a healthy athlete who reaches the same blood levels by the same route is cheating — while training at altitude is legitimate preparation, even though it works by producing precisely the sort of increase that a transfusion is banned for producing.

  What I want from you is not a verdict on any one of these rules but a reconstruction of the implicit theory the whole pattern runs on: what view of health, of normality, or of the point of medicine it presupposes, whether that is one view or several that merely coincide here, and which rival views the practice quietly rules out. Please do three things. First, articulate the distinction the institutions think they are applying. My committee has been using restoration-versus-improvement as if it were self-explanatory, and it is not: restore to what, and whose? I have tried out three candidate baselines and cannot make them agree — the patient's own counterfactual trajectory (therapy repairs a departure from how this very person would otherwise have gone), a statistical species-typical range (therapy brings someone back into the normal human band), and a welfare or capability threshold (therapy removes an obstacle to some specified level of flourishing). Say which of these the practice is genuinely committed to, where they diverge, where the practice is underdetermined between them, and whether it needs a value-free notion of normal function at all or is already relying on a value-laden one.

  Second, press the cases that pull in different directions. Take two students with identical present capacities and identical prospects, one at that level because illness knocked her down and medication brought her back, the other because he was always like that — constitutionally distractible, or simply near the bottom of the natural distribution facing a hard exam. Our rules treat them differently; is that defensible, and is the justification the same conceptual one that covers the diagnosed student, or merely an administrative one about scarce clinic slots and who gets a prescription? The restoration story also seems to have no natural stopping point: a cochlear implant for a child deaf from birth is counted as therapy even though it confers a capacity she never had, and along any gradual continuum repair shades into improvement, so I would like you to say whether the resulting vagueness is fatal to the distinction or merely untidy.

  Third, tell me what would actually have to change if we abandoned the line as a piece of metaphysics and rebuilt it. The proposal I keep returning to, which I will call capacity-neutral provision, has two parts: the clinic ranks interventions by expected benefit to the student's own ends and offers them in that order without asking whether the intervention is restorative, and the integrity code drops the treatment-versus-enhancement distinction in favour of asking only whether a student secured an unfair positional advantage in a graded competition. I suspect it collapses — perhaps because a student's ends are not fixed independently of what is available, perhaps because the positional test would also condemn caffeine, sleep, private tutoring and good schools, perhaps because it leaves unexplained why we owe the sick student anything in particular. Show me where it breaks and, if it does, give me the best available reconstruction of what we already do, including any part of it that is really cost containment wearing metaphysical costume. Finally, say whether that reconstruction carries over to the sporting case, where the good being competed for is explicitly zero-sum and the rules are enforced on everyone at once, or whether anti-doping runs on a different and possibly more coherent rationale than a university integrity policy does.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Context:** The user is on a university committee rewriting the academic integrity code. They are struggling with the distinction between therapeutic use (accommodated) and cognitive enhancement (banned), specifically regarding stimulants (ADHD vs. non-diagnosed).
      *   **Core Problem:** The current policy relies on a "restoration vs. improvement" distinction, but the biological effect is the same. The user sees parallels in health insurance (insulin vs. LASIK vs. growth hormone) and anti-doping (TUEs vs. doping vs. altitude training).
      *   **Task:** Do *not* give a verdict on specific rules. Instead, reconstruct the *implicit theory* behind the pattern.
      *   **Specific Requirements:**
          1.  **Articulate the Distinction:** Analyze the baselines (counterfactual trajectory, species-typical range, welfare/capability threshold). Determine which one the practice is actually committed to, where they diverge, and whether "normal function" is value-free or value-laden.
          2.  **Press the Edge Cases:** Analyze the "identical capacity" case (illness vs. constitution), the "congenital deficit" case (cochlear implant), and the vagueness of the repair/improvement continuum. Is the distinction defensible or just administrative?
          3.  **Rebuild/Alternative:** Analyze the "capacity-neutral provision" proposal (rank by benefit, drop treatment/enhancement, focus on unfair positional advantage). Show where it breaks. Reconstruct the *actual* justification (including cost containment). Compare this to the sporting/anti-doping case.

  2.  **Part 1: Articulating the Distinction (The Baselines):**

      *   *Candidate 1: Patient's Counterfactual Trajectory.* (Therapy = returning to *your* path). Problem: What if the "path" was declining due to aging? What if the "path" was always low (congenital)? Cochlear implants contradict this (child never heard).
      *   *Candidate 2: Statistical Species-Typical Range.* (Therapy = back to "normal" human function). Problem: "Normal" is statistical, not normative. Tall parents/short kid (growth hormone) shows statistics aren't enough; there's a "pathology" filter. Also, "normal" changes with technology.
      *   *Candidate 3: Welfare/Capability Threshold.* (Therapy = getting to a level of flourishing). Problem: Too broad. Why not pay for LASIK if it helps flourishing? Why not growth hormone for social height advantage?
      *   *Synthesis:* The practice actually uses a *hybrid* model, often called the "Normal Functioning" account (Daniels/Boorse). It relies on a *value-laden* notion of species-typical design. It's not just statistics; it's about *species-typical functional organization*.
      *   *Value-Free vs. Value-Laden:* It claims to be value-free (biological function), but the selection of *which* functions matter (attention for exams vs. height for dating) is value-laden. The "restoration" baseline is actually "restoration to species-typical functional integrity *relative to the environment's demands*."
      *   *Commitment:* The practice is most committed to the **Species-Typical Functional Integrity** model, but it smuggles in the **Counterfactual** model for acquired conditions (illness/accident) and the **Threshold** model for coverage limits.

  3.  **Part 2: Pressing the Edge Cases:**

      *   *Identical Capacity (Illness vs. Constitution):* Student A (ADHD diagnosis) vs. Student B (naturally low attention). Same output with meds.
          *   *Defense:* The distinction isn't about the *outcome*, it's about the *cause*. One is a malfunction of internal design (pathology); the other is natural variation.
          *   *Defensibility:* This relies on the "Naturalistic" view of disease. If you reject naturalism (i.e., if you think "disability" is socially constructed), the distinction collapses. But administratively, it requires a gatekeeper (doctor).
          *   *Is it just scarcity?* Partly. We can't give meds to everyone. But philosophically, it's about *entitlement based on need (malfunction)* vs. *privilege*.
      *   *Congenital Deficits (Cochlear Implant):* This breaks the "Counterfactual Trajectory" baseline (child never heard). It supports the "Species-Typical" baseline. We are restoring the *organ* to standard design, not the *history* to a previous state.
      *   *Vagueness (Repair vs. Improvement):* Is it fatal? No. Legal and ethical systems tolerate "sorites" paradoxes (heap/not heap). We draw bright lines on continua for administrative necessity. The vagueness is untidy but not fatal because the *intent* (treating pathology) is clear even if the boundary is fuzzy.

  4.  **Part 3: Rebuilding/Alternative (Capacity-Neutral Provision):**

      *   *The Proposal:* Rank by benefit to student's ends; drop treatment/enhancement; ban only "unfair positional advantage."
      *   *Where it Breaks:*
          1.  *Ends are adaptive:* Students want what they can have.
          2.  *Positional Advantage:* If we ban unfair advantage, we ban tutoring, wealthy parents, good sleep, caffeine. This makes the rule unenforceable or totalitarian.
          3.  *Obligation:* Why owe the sick student anything? If we drop "health as special," medicine becomes just another consumer good. The "restoration" narrative justifies the *subsidy* (insurance/university support).
      *   *The Real Reconstruction:* It *is* cost containment wearing metaphysical costume. But it's also about **Justice as Fairness (Daniels)**. Health is special because it protects the "normal opportunity range." We fix health to keep the race fair, but we don't equalize *all* advantages (like talent or wealth).
      *   *Sport vs. University:*
          *   *Sport:* The goal *is* the competition. Zero-sum. The "natural lottery" is part of the test. Enhancements violate the test of *natural* talent/training.
          *   *University:* The goal is *learning/certification*. The exam is a means, not the end. Accommodations aim to measure *competence*, not *endurance*.
          *   *Conclusion:* Anti-doping is more coherent (protecting the "spirit of sport" / natural talent test). University policy is messier (balancing fairness, access, and credentialing).

  5.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Philosophical, analytical, rigorous, respectful of the committee's difficulty.
      *   *Structure:* Follow the three prompts exactly.
      *   *Key Concepts to Weave In:* Norman Daniels ("Health Care Justice"), Christopher Boorse ("Biostatistical Theory"), Naturalism vs. Normativism, The Natural Lottery, Positional Goods.
      *   *Refining the "Baseline" argument:* Make sure to highlight that the "Counterfactual" fails for congenital issues, so the "Species-Typical" is the dominant hidden logic.
      *   *Refining the "Sport" argument:* Crucial distinction: In sport, the *limitations* are the point. In education, the limitations are noise to be filtered out.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I give a verdict? *No.*
      *   *Check:* Did I address the insulin/LASIK/Growth Hormone examples? *Yes, in the baseline section.*
      *   *Check:* Did I address the "capacity-neutral" proposal specifically? *Yes, in section 3.*
      *   *Check:* Is the distinction between Sport and University clear? *Need to emphasize that sport tests the *body*, university tests the *mind/competence* (ideally).*
      *   *Nuance:* Acknowledge that "cost containment" is a huge driver. The metaphysical distinction justifies the budget cut.

  7.  **Final Polish:** Ensure the language is precise (e.g., distinguishing "statistical normality" from "functional normality"). Ensure the conclusion ties the threads together without solving the problem (since the prompt asks for reconstruction, not solution).

  *(Self-Correction Note)*: I need to be careful not to simply say "Daniels is right." I need to explain *why* the committee's practice aligns with him, even if they don't know it. I also need to make sure I don't dismiss the "capacity-neutral" idea too quickly; I need to show *exactly* where it fails (the "everything is cheating" problem).

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a profound structural problem in bioethics and policy design. Your committee is encountering the friction between a **naturalistic** definition of disease (biological malfunction) and a **normative** definition of fairness (leveling the playing field). The pattern you observe across the university, the health plan, and the athletic commission is not accidental; it is the operational footprint of a specific, dominant theory of justice in health, often associated with the philosopher Norman Daniels, though it relies on deeper metaphysical commitments about human nature.

  Here is the reconstruction of the implicit theory, the stress testing of its boundaries, and the analysis of your proposed alternative.

  ### 1. The Implicit Baseline: Which "Normal" is at Work?

  Your committee is using the phrase "restoration versus improvement" as a shorthand, but as you have noted, it collapses without a defined baseline. You tested three candidates. Here is how the actual practice relates to them.

  **The Counterfactual Trajectory (Repairing *Your* Path)**
  *   *Theory:* Therapy returns you to the path *you* would have been on absent the insult.
  *   *Practice:* This explains the insulin and the stimulant for the diagnosed student. It fails the cochlear implant (the child had no prior trajectory of hearing) and the growth hormone for the idiopathic short child (there was no "insult," just a different trajectory).
  *   *Verdict:* The practice is **not** primarily committed to this. It is too individualistic. If it were, we would have to enhance anyone who fell behind their *own* potential, regardless of species norms.

  **The Welfare/Capability Threshold (Ensuring *Flourishing*)**
  *   *Theory:* Therapy brings you up to a sufficient level of functioning to participate in society.
  *   *Practice:* This explains why we treat depression (threshold for functioning) but not LASIK (often optional) or height enhancement (social preference). However, it fails to explain why we treat a mild allergy (high threshold already met) but not a cognitive enhancer that might help a struggling student reach the same threshold.
  *   *Verdict:* The practice uses this as a **budgetary constraint**, not a definitional one. It sets the lower bound of coverage but does not define the boundary between medicine and enhancement.

  **The Species-Typical Functional Integrity (The Hidden Driver)**
  *   *Theory:* Therapy repairs a departure from the *species-typical functional organization*. It is not about *your* path or *flourishing*, but about the standard design of the human organism.
  *   *Practice:* This is the view the institutions are genuinely committed to. It aligns with Christopher Boorse's "Biostatistical Theory."
      *   **ADHD Stimulant:** The brain's attentional mechanisms are malfunctioning relative to the species-typical design for that age. The drug restores the mechanism to its intended operational range.
      *   **Undiagnosed Stimulant:** The brain is functioning within the natural distribution of variation. The drug pushes the mechanism *beyond* the species-typical maximum efficiency.
      *   **Growth Hormone:** Denied to the short child with healthy parents because short stature is within the statistical and functional normal range, even if it is socially disadvantageous.
      *   **Cochlear Implant:** Granted because hearing is a species-typical function, even if the individual never possessed it. We are repairing the *organ's design*, not the *individual's history*.

  **Value-Free or Value-Laden?**
  The practice pretends to rely on a **value-free notion of normal function** (biological statistics). It claims, "We are just fixing broken parts." However, this is a fiction. The selection of *which* functions count as "typical" is value-laden.
  *   *Example:* We treat infertility (reproductive function is species-typical) but we do not treat the inability to run a 4-minute mile (locomotor function is not species-typically *that* high).
  *   *The Hidden Value:* The practice relies on a **normative selection of species-typical functions** that are deemed essential for the "normal opportunity range" of a society. Attention is essential for university; height is not. The "normal" is not just statistical; it is **teleological**. It assumes there is a "way humans are supposed to work" that serves a specific social role (student, worker, citizen).

  **Conclusion on Baselines:** The practice is committed to **Species-Typical Functional Integrity**, constrained by a **Capability Threshold** for funding. It diverges from the Counterfactual model in congenital cases. It requires a value-laden notion of normality because "function" cannot be defined without reference to the environment in which the organism is expected to survive and compete.

  ### 2. Pressing the Edge Cases: Vagueness and Defensibility

  **The Identical Capacity Case (Diagnosed vs. Constitutionally Distractible)**
  You ask about two students with identical attention spans, one medicated (diagnosed) and one natural (undervalued).
  *   *Is the distinction defensible?* Under the Species-Typical theory, **yes**. The distinction is not about the *outcome* (attention span) but the *etiology* (cause). One is a correction of a pathological deviation from the species-design; the other is an exploitation of natural variation.
  *   *The Justification:* It is not merely administrative scarcity. It is a claim about **entitlement**. We owe it to the first student to remove a barrier caused by biological bad luck (the "natural lottery" of disease). We do not owe it to the second student to compensate for biological bad luck that falls within the normal range (the "natural lottery" of talent).
  *   *The Weakness:* This relies on the "line-drawing" problem of pathology. ADHD diagnosis is notoriously subjective. If the diagnosis is socially constructed, the "biological malfunction" justification collapses into "who has a doctor's note."

  **The Congenital Deficit (Cochlear Implants)**
  *   *The Challenge:* This kills the Counterfactual baseline. The child never heard. Is this improvement?
  *   *The Resolution:* The practice treats this as **restoration of the organ, not the history**. It assumes the *human organism* has a canonical design. To be fully human (in the functional sense) is to have working sensory inputs. The implant restores the child to the *species baseline*, not a personal baseline.
  *   *Vagueness:* You ask if the continuum from repair to improvement is fatal. It is **untidy but not fatal**. Legal and ethical systems routinely draw bright lines on continua (e.g., age of majority, speed limits). The "sorites paradox" (when does a heap of sand become a pile?) does not stop us from regulating piles. The line is drawn where the **cost of intervention** outweighs the **claim of pathological need**. The vagueness is managed by gatekeepers (doctors), not by metaphysics.

  **Is it just Cost Containment?**
  Yes, but not *only*. If it were only cost, we would ban cochlear implants (expensive) and allow caffeine (cheap). The metaphysical distinction (pathology vs. variation) serves as a **moral filter for rationing**. It allows the institution to say, "We are not denying you help because it's expensive; we are denying it because you are not *sick*." It converts a budgetary decision into a judgment of moral desert.

  ### 3. Rebuilding: The Failure of Capacity-Neutral Provision

  Your proposal—**Capacity-Neutral Provision**—suggests ranking interventions by benefit to the student's ends and banning only "unfair positional advantage." This is a radical shift from a **medical model** to a **market/competition model**. Here is where it breaks.

  **Break Point 1: The Definition of "Ends"**
  *   *Problem:* Student ends are not fixed. If Adderall becomes available, "studying for 12 hours" becomes a rational end. If it is banned, "studying for 4 hours efficiently" is the end.
  *   *Collapse:* If the clinic ranks by "expected benefit," and the student's end is "get the highest grade possible," then cognitive enhancement *always* ranks higher than therapy. The clinic becomes a enhancement shop. The "benefit" metric cannot distinguish between curing depression and creating super-focus without importing the "normal function" bias you want to discard.

  **Break Point 2: The Positional Advantage Test**
  *   *Problem:* You suggest banning only interventions that secure an *unfair positional advantage*.
  *   *Collapse:* Almost *everything* confers a positional advantage.
      *   **Caffeine:** Unfair to the non-drinker.
      *   **Sleep:** Unfair to the student with an insomniac child at home.
      *   **Private Tutoring:** Massively unfair positional advantage.
      *   **Good Schools:** The ultimate unfair advantage.
  *   *Result:* To enforce this, the university would have to equalize *all* advantages, effectively abolishing private property and biological variation. Or, it must admit that *some* advantages are legitimate. Which ones? The ones that align with... **Species-Typical Function**. You circle back to the original distinction. You need a baseline of "normal" to decide which advantages are "fair" (talent, hard work) and which are "unfair" (doping, cheating).

  **Break Point 3: The Obligation Problem**
  *   *Problem:* Why does the university owe the sick student anything?
  *   *Collapse:* If you drop the "health is special" (restoration) narrative, medicine becomes a consumer good. The university has no obligation to provide stimulants to the ADHD student any more than it has to provide laptops to the rich student who prefers them. The "restoration" narrative is the *only* thing that grounds the **right to accommodation**. Without it, accommodation becomes charity, not justice.

  **The Best Reconstruction of What We Do**
  The system you are trying to rewrite is best reconstructed as **Justice as Fairness applied to the Natural Lottery**.
  1.  **Premise:** Society is a competition for goods (grades, jobs, wealth).
  2.  **Constraint:** We cannot equalize natural talent (genetics).
  3.  **Exception:** We *can* and *must* equalize **pathological disadvantages**.
  4.  **Mechanism:** We define pathology as "deviation from species-typical function."
  5.  **Goal:** To ensure the competition measures **talent and effort**, not **health status**.

  This explains the cost containment: We only fix the "broken" parts, we don't upgrade the "working" parts. It explains the ADHD distinction: One student is competing with a broken tool (fixed); the other is competing with a standard tool (upgraded).

  **Comparison to Anti-Doping (Sport vs. University)**
  Does this carry over to sport? **No.** The rationales diverge sharply.

  *   **University (The Instrumental View):** The exam is a *measurement tool*. The goal is to certify competence. If a stimulant allows the ADHD student to demonstrate their true competence (by removing the noise of the disorder), it is permitted. The goal is **validity of measurement**. We want the grade to reflect *knowledge*, not *attentional pathology*.
  *   **Sport (The Intrinsic View):** The competition *is* the goal. The physical limitations are not noise to be removed; they are the **subject of the test**.
      *   *Anti-Doping Rationale:* Sport tests the **natural lottery of talent** combined with **discipline (training)**.
      *   *Altitude vs. Transfusion:* Altitude is legitimate because it is a **natural adaptation** of the organism (training). A transfusion is illegitimate because it bypasses the organism's adaptive process.
      *   *TUEs (Therapeutic Use Exemptions):* In sport, a TUE is a grudging concession that the athlete must be allowed to *enter* the competition, not that they should be allowed to *win*. It is monitored much more strictly than university accommodations.

  **Summary for the Committee**
  You are stuck because you are trying to apply a **Sport Logic** (zero-sum competition, ban all enhancements) to an **Education Logic** (certification of competence, remove pathological barriers).
  *   The "Restoration vs. Improvement" line is metaphysically fuzzy but administratively necessary to distinguish between **compensating for bad luck (disease)** and **subsidizing ambition (enhancement)**.
  *   Your "Capacity-Neutral" proposal fails because it cannot distinguish between a "need" and a "want" without reintroducing the concept of normal function.
  *   **Recommendation:** Do not try to solve the metaphysics. Acknowledge that the "Species-Typical Function" baseline is a **social construct designed to manage scarcity**. Keep the distinction, but acknowledge its purpose: not to define "health" truly, but to define **entitlement**. The ADHD student gets the drug because the university accepts an obligation to neutralize *pathological* disadvantage, but not *natural* disadvantage. That is a political choice, not a medical fact.
