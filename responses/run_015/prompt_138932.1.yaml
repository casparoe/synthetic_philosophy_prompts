answer: |-
  There is no single common English word for this, but there is a precise concept for it.

  The name for the "picking" is **Causal Selection**.

  The "carving" you are looking for is the distinction between **Necessary Conditions** (physics) and **Assigned Causes** (social/organizational judgment).

  Here is the breakdown of what you are looking at, why your template feels like it's hiding something, and a definition you can use.

  ### 1. The Concept: Causal Selection
  In philosophy and law, this is the recognized problem that any event has thousands of necessary conditions (oxygen existed, the server was plugged in, no asteroid hit, the timeout was missing), but we only label one or two as "The Cause."

  The "picking" mechanism is not physical; it is **normative**. It relies on three filters that have nothing to do with the hardware and everything to do with your organization:

  1.  **Expectation (The Norm):** Was this absence a deviation from how things *should* be?
      *   *No asteroid:* Not a deviation. Normal state is "no asteroids."
      *   *No timeout:* A deviation. Normal state (by best practice) is "timeouts exist."
  2.  **Agency (The Control):** Did a human or system with responsibility have the power to change it?
      *   *No asteroid:* No agency.
      *   *No timeout:* High agency (engineers can write code).
  3.  **Locus (The Ownership):** Was it *our* job to ensure that expectation was met?
      *   *This is why the label shifts.* If the SRE team owns the library, "no timeout" is a cause. If the Product team owns the library and the SREs just run it, "no timeout" becomes a "constraint" or "risk," not a cause. The physical reality didn't change; the **accountability boundary** moved.

  ### 2. Why Your Template Feels Wrong
  Your current template ("Causes must be events") forces you to pretend causation is purely physical. It works because events are easy to agree on, but it feels like hiding something because **it lies about how failures actually happen.**

  In complex systems, **absences are often more causal than presences.**
  *   **Presence:** "The engineer pushed the button." (Event)
  *   **Absence:** "The guardrail that should have stopped the button push was missing." (Omission)

  By forcing causes to be events, you are biasing your reviews toward **Active Failures** (human errors, crashes) and hiding **Latent Conditions** (missing protections, absent processes). This is known in safety science as **Event Bias**.

  ### 3. A Definition for Your Docs
  Since there is no common word, you should define the term explicitly in your incident review charter. Do not try to force omissions into "events." Instead, change the criteria for what counts as a cause.

  **Term:** **Actionable Omission** (or **Accountable Absence**)

  **Definition:**
  > An absence qualifies as a Cause only if it meets all three criteria:
  > 1.  **Counterfactual:** If the thing had been present, the incident would likely have been prevented or mitigated.
  > 2.  **Normative:** There was a documented expectation, standard, or best practice that required the thing to be present.
  > 3.  **Assignable:** A specific role or team had the authority and responsibility to ensure the thing was present.

  **What Counts:**
  *   "No timeout set" (If timeouts are standard practice and the owning team could have set one).
  *   "No alert fired" (If monitoring was expected for that metric).
  *   "No rollback performed" (If the on-call engineer had the access and runbook to do so).

  **What Does Not Count:**
  *   "No asteroid hit" (Fails Normative: not expected).
  *   "No one reverted" (If the person was on vacation and no backup was assigned → Fails Assignable).
  *   "No timeout set" (In a review where the team had no authority to change the library → Fails Assignable).

  ### 4. Why the Label Shifts (The "Picking")
  You asked why "no timeout" is a cause in one review and a recommendation in another.

  This is **Causal Attribution based on Accountability Boundaries.**
  *   **Review A (SRE owns service):** The absence is a violation of *their* duty. It is a Cause.
  *   **Review B (Product owns service):** The absence is a violation of *someone else's* duty. To the SREs, it is a **Risk** or **Dependency**, not a Cause.

  The "picking" is actually a decision about **where to invest energy.** We label something a "Cause" when we intend to fix it. We label it a "Recommendation" or "Background" when fixing it is outside our scope.

  ### Summary
  You are not missing a word; you are encountering the limit of physical language describing social systems.
  *   **The Phenomenon:** Causal Selection.
  *   **The Mechanism:** Normative Expectation + Locus of Control.
  *   **The Fix:** Stop forcing causes to be "events." Adopt the **Actionable Omission** definition above. It allows you to list absences as causes without blaming physics, by explicitly tying them to responsibility.
