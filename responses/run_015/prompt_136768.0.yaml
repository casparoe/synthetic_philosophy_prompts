      *(Refining the Distinction)*: "Manpower vs. Citizenship" is good, but for HOS/Phil, "Instrumental Rationality vs. Civic Constitution" might resonate better. Let's stick close to the prompt's phrasing but elevate the theoretical stakes.

      *(Refining the Carrying Example)*: Switzerland is the clear winner for "constitutional technology." The *Milizsystem* is literally a constitutional arrangement. Finland is too geopolitical. Sweden is too policy-wonky.

      *(Refining the Misconceptions)*:
      1. Pacifism: Defuse in the *Framing* (first 15 mins).
      2. Professionalization: Defuse in the *Mechanism* (middle 45 mins).

      *(Refining the Diagnostic)*: Needs to be a "thought experiment" style question.

  5.  **Final Review against Constraints:**
