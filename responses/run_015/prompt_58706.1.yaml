  Step-by-Step Procedure
  1. **Transmission Check (5 mins):** Engage with the work sample. Do you feel a specific emotion the artist intends? If you feel only admiration for technique, beauty, or mere entertainment, reject immediately. Tolstoy defines art as feeling transmission, not skill display. Failure here is an automatic no.
  2. **Infectiousness Scan (10 mins):** Rate three criteria on a 1-5 scale: Sincerity (honest or contrived?), Clarity (understandable without explanation?), Distinctness (specific rather than vague?). Total must exceed 9/15. Scores below 9 indicate weak transmission; reject. This saves time on mediocre proposals.
  3. **Scope of Feeling (5 mins):** Identify the core emotion. Is it broadly human (grief, hope, solidarity) or exclusive/titillating (status, shock, insider novelty)? If exclusive to a specific class, flag for Panel Value Judgment. If broadly human, proceed to approve.
  4. **Council Justification:** Draft one sentence: "This project transmits [emotion] to unify audiences." If you cannot articulate the feeling simply, flag for Panel Value Judgment. This ensures accountability to public funds. Volunteers stop at step 1 or 2; Step 3 and 4 require full panel discussion if flagged. Adhere strictly to the twenty-minute limit; if you cannot feel the emotion within this window, the transmission has failed. Do not research the artist; judge only the work's capacity to infect you now. This prevents bias based on reputation.

  Three Trial Applications
  **Proposal A (Choir):** Step 1 passes; reviewers feel profound grief despite clumsy harmony. Step 2 scores high on Sincerity (5) and Clarity (4), averaging well above the threshold. Step 3 identifies universal grief over economic loss, accessible to all citizens. **Result: Fund.** Tolstoy prioritizes feeling over skill, validating amateurs who connect deeply over trained artists who do not. The council reason writes itself: "Shares community grief." This validates non-professional voices.

  **Proposal B (Light Show):** Step 1 fails. Reviewers feel momentary awe but recognize it as market-tested entertainment, not transmitted emotion. It lacks sincerity and distinctness of feeling. The proposal admits to using tested effects rather than expressing inner experience. **Result: Reject.** Technical dazzlingness is irrelevant without emotional infection. It is entertainment, not art. The stop rule saves time here, preventing debate over production value.

  **Proposal C (Melodrama):** Step 1 passes; reviewers feel moved to tears. Step 2 scores high on Clarity and Sincerity. Step 3 identifies universal forgiveness. **Result: Fund.** This outcome will dislike the panel. They usually dismiss sentimental work as lowbrow, preferring complex contemporary pieces. However, the procedure requires funding it because it succeeds at transmitting sincere, universal feeling better than obscure, high-concept art. The procedure forces you to admit that accessible emotion counts more than elite approval, shifting funds from "serious" art to popular forms.

  Limits and Required Judgments
  This procedure cannot measure artistic innovation, historical significance, or technical advancement. It misfires on difficult art that requires time to understand, as the 20-minute limit favors immediate emotional hits. It relies on the volunteers' capacity to feel, which varies by culture and background. A viewer numb to grief might reject the choir. The "Scope of Feeling" step requires a value judgment the procedure cannot automate: panels must decide if a feeling is truly universal or merely dominant. Finally, it cannot protect minority viewpoints if the majority finds them unrelatable. You must accept that some great art will be rejected because it demands more than twenty minutes to infect. The council's plain-language requirement may also simplify complex emotions unfairly too.
