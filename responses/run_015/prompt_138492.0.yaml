      *   *Thesis C (The Information Claim):* We literally possess data now (the storm happened) that we didn't possess then. (Trivial/True, supports Neither/Both depending on usage).
      *   *Thesis D (The Normative Claim):* Because the bad thing happened, the risk was unacceptable *at the time*. (False/Resulting, supports Critic).
      *   *Thesis E (The Signal Claim):* Outcomes provide Bayesian evidence about the decision quality. (Empirical/Nuanced, supports Critic *conditionally*).

  4.  **Grading and Assigning Support:**
