      *   **Task:** Brainstorm candidate readings of the phrase "hindsight is 20/20," separate distinct theses, grade them (platitude/empirical/false), determine who they support (critic/friend/neither), address the "principled line" between signal and noise in outcomes, and evaluate the "pre-outcome memo" proposal.
      *   **Constraint:** Do *not* give a reading list or labels (like "hindsight bias"). Give distinct theses separated out and graded.
