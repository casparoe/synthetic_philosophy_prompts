answer: |-
  ### Exam Question

  **Course:** Seminar on Rationality and Transformative Change  
  **Time Allowed:** 75 Minutes  
  **Expected Length:** Approximately 1,200 words  

  **Prompt:**

  Consider a hypothetical intervention termed "Evaluative Framework Substitution" (EFS). An agent voluntarily undergoes EFS knowing that it is irreversible. Unlike ordinary transformative experiences, EFS does not merely reveal new information or shift specific preferences within an existing utility function. Instead, it substitutes the fundamental metric by which welfare is evaluated. 

  For example, a pre-EFS agent might evaluate outcomes based on hedonic tone (pleasure minus pain), while the post-EFS agent evaluates outcomes based on narrative coherence (meaning minus absurdity). There is no common currency between these metrics. Consequently, the pre-change agent lacks any stable index for comparing the welfare value of outcomes across the boundary of the change. The pre-EFS self cannot calculate whether the post-EFS life is "better" because the definition of "better" itself is destroyed and replaced.

  Based on this framing, evaluate the following claim: **Because the metric of evaluation is substituted rather than merely adjusted, ex ante rational choice to undergo EFS is impossible in principle.**

  In your essay, you must:
  1.  **Defend or reject** this claim of impossibility. You must take a committed position; do not merely outline the debate.
  2.  **Distinguish sharply** between this scenario and (a) ordinary preference learning (where information updates beliefs) and (b) standard transformative-decision arguments (where the challenge is epistemic access to phenomenal character).
  3.  **Address the role of a third-person advisor.** Could an advisor who understands both metrics legitimately substitute their evaluation for the agent's absent first-person access to the post-EFS state? Justify your answer in relation to your position on rational choice.

  ***

  ### Model Answer

  **Position:** Rejection of the Impossibility Claim via Procedural Authorization

  The claim that *ex ante* rational choice is impossible in principle because of metric substitution relies on a substantive view of rationality that requires outcome comparability. I reject this claim. Rational choice remains possible because the locus of rationality shifts from comparing outcomes to authorizing the procedure of change. The impossibility argument fails because it assumes rationality requires a stable index of *welfare*, when it actually requires a stable index of *agency*.

  First, we must distinguish this scenario from ordinary preference learning and standard transformative arguments. In ordinary learning, an agent updates beliefs about the world while retaining the same utility function. If I learn spinach is healthy, I may eat it, but my metric (health + taste) remains constant. In standard transformative arguments, the challenge is epistemic: I cannot know what it is like to be a parent before being one. However, I still understand that "fulfillment" is the goal. In Evaluative Framework Substitution (EFS), the challenge is deeper: the definition of fulfillment changes. Recognizing this distinction is crucial. If we conflate EFS with ordinary learning, we mistakenly believe better information solves the problem. It does not, because the problem is not ignorance of facts, but the incommensurability of values.

  Despite this incommensurability, rational choice is preserved through procedural endorsement. The pre-EFS agent cannot judge the post-EFS *outcome*, but they can judge the *transition*. Rationality does not demand that the agent know the destination's value using the destination's map; it demands that the agent voluntarily consent to changing maps. If the pre-EFS agent values autonomy or growth enough to authorize a change in their own evaluative structure, that authorization constitutes a rational act based on pre-EFS values. The stable index is not welfare, but the authority of the self to determine its own constitution. Therefore, choice is not impossible; it is merely relocated from consequence-evaluation to process-authorization.

  This distinction dictates the answer regarding the third-person advisor. The advisor cannot legitimately substitute their evaluation for the agent's absent first-person access. Even if the advisor understands both metrics perfectly, they lack the standing to authorize the change on behalf of the agent. Rationality in transformative contexts is inherently first-personal because it concerns the constitution of the self. If the advisor decides based on the post-EFS metric, they are imposing a value system the agent does not yet hold. If they decide based on the pre-EFS metric, they cannot assess the outcome. 

  More importantly, allowing advisor substitution undermines the procedural rationality identified above. The rationality of undergoing EFS lies in the agent's own volition to reconstruct their values. If an advisor makes the choice, the element of self-authorship is lost, rendering the transformation irrational regardless of the outcome. The advisor may provide information about the mechanics of the change, but they cannot bridge the normative gap. The legitimacy of the decision rests entirely on the agent's willingness to surrender their current metric. Thus, while the advisor can clarify the irreversibility and the nature of the new metric, they cannot perform the evaluation required to make the choice rational. The impossibility claim is false because it overlooks that the rationality of transformation resides in the will to change, not the calculation of the changed state.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Engagement with Metric Substitution (5 Marks)**
  *   **Criteria:** The answer must explicitly acknowledge that the scenario involves changing the *standard of evaluation* itself, not just preferences or information. It must accept the premise that no common welfare index exists across the boundary.
  *   **Characteristic Mistake:** Treating the scenario as merely having incomplete information about a fixed set of values (conflating metric change with uncertainty).

  **2. Distinction from Standard Cases (5 Marks)**
  *   **Criteria:** The answer must clearly differentiate EFS from ordinary preference learning (belief updating) and standard transformative arguments (epistemic access to phenomenal character). It must show why these standard models fail to resolve the specific problem of metric incommensurability.
  *   **Characteristic Mistake:** Arguing that "more experience" or "better data" would solve the decision problem, thereby ignoring the structural change in welfare evaluation.

  **3. Defense/Rejection of Impossibility Claim (5 Marks)**
  *   **Criteria:** The answer must take a committed stance (either defending or rejecting impossibility) and provide a structural argument for that position. It cannot simply list pros and cons. The argument must explain *how* rationality is either destroyed or preserved (e.g., via procedural authorization).
  *   **Characteristic Mistake:** Hedging or concluding that rationality is "difficult but possible" without explaining the mechanism that bridges the incommensurability.

  **4. Analysis of Third-Person Advisor (5 Marks)**
  *   **Criteria:** The answer must address whether an advisor can substitute evaluation. The conclusion must be consistent with the position taken in Move 3 (e.g., if rationality requires self-authorship, the advisor cannot substitute).
  *   **Characteristic Mistake:** Arguing that an advisor *can* decide for the agent because they possess objective knowledge, thereby ignoring the first-personal nature of transformative agency.
