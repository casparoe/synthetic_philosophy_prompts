answer: |-
  A usable procedure exists, and its spine is testing for **asymmetry** to distinguish contingent mechanisms from retrospective determinism.

  ### The Procedure: The Asymmetry Checklist
  *Time budget: 5 minutes per claim. If a script has 20 claims, spot-check the top 5.*

  **1. The Bucket Test (House Rule Compliance)**
  *   **Question:** Is this claim a **Mechanism** (X produced Y via process Z), a **Counterfactual** (Without X, Y changes), or **Legibility** (X makes Y understandable)?
  *   **Pass:** Clear fit into Mechanism or Counterfactual.
  *   **Fail/Hand-off:** "Legibility." If the claim uses causal verbs ("caused," "led to," "sparked") but fits only in Legibility, it is dead weight.
      *   *Action:* Strip causal verbs and reframe as interpretation ("Visitors might see X as a precursor to Y") OR upgrade to Mechanism. If the writer refuses, hand off to Director as a **Value Judgment**, not a Fact.

  **2. The Reverse Test (Board Member Correction)**
  *   **Question:** Read the causal chain backwards (Effect → Cause). Does it still make sense?
  *   **Pass:** The chain **collapses**. (History is asymmetric; the result does not cause the origin.)
  *   **Fail:** The chain **holds up**. (If "The Riot caused the Tracks" makes as much sense as "The Tracks caused the Riot," you have teleology.)
      *   *Action:* Flag as **Retrospective Determinism**. Rewrite to remove inevitability.
      *   *Note:* Tell your board member this test is backwards for history. If a story holds in reverse, it implies the end dictated the beginning, which is myth, not history.

  **3. The "Otherwise" Test (Inevitability Check)**
  *   **Question:** Does the claim imply the outcome *had* to happen? (Look for: "inevitable," "only a matter of time," "seeds were sown.")
  *   **Pass:** The claim allows for contingency ("increased the likelihood," "contributed to").
  *   **Fail:** The claim implies necessity.
      *   *Action:* Demand a counterfactual qualifier ("While other factors existed, this specifically..."). If the Director insists on inevitability, hand off as **Ideological Framing**.

  **4. The Knowledge Dependence Test (Teleology Check)**
  *   **Question:** Does this claim require knowing the future outcome to make sense of the past event?
  *   **Pass:** The cause makes sense in its own time.
  *   **Fail:** The cause is only visible because we know the effect (e.g., calling something a "seed" of a future event).
      *   *Action:* Rewrite to describe the event's contemporary significance, not its future utility.

  **5. The Hand-Off Point**
  *   **Stop:** If a claim fails Steps 2, 3, or 4, do not argue philosophy.
  *   **Action:** Label it **"Interpretive Frame"** rather than **"Historical Explanation."** This signals to the Docent that this is a story we are choosing to tell, not a law of nature. This survives the Director and Donor meeting because it protects the museum from being factually wrong while allowing them to tell the story they want.

  ---

  ### Application to Your Three Claims

  **1. The Mill Closure (Mechanism)**
  *   *Claim:* "The mill closed because the embargo tripled its fuel costs and it ran on fuel oil."
  *   **Bucket:** Mechanism. (Pass)
  *   **Reverse:** "The mill ran on fuel oil because it closed." (Collapses. Pass)
  *   **Otherwise:** Could the mill have survived? Yes, if fuel costs hadn't tripled. (Pass)
  *   **Verdict:** **KEEP.** This is robust causal history. It specifies the constraint (fuel oil), the shock (embargo), and the result (closure). It survives the docent test because it is concrete.

  **2. The Streetcar/Seeds (Teleology)**
  *   *Claim:* "The seeds of the '67 riot were sown when the streetcar tracks came up in '52."
  *   **Bucket:** Legibility masquerading as Mechanism. (Fail)
  *   **Reverse:** "The streetcar tracks came up because of the '67 riot." (Collapses, but...)
  *   **Knowledge Dependence:** Does removing the tracks look like a "seed" in 1952? No. It only looks like a seed because we know 1967 happened. (Fail)
  *   **Verdict:** **REWRITE.** This is the claim that comes out badly. It is retrospective determinism. It suggests the riot was inevitable starting in 1952.
      *   *Fix:* "In 1952, the removal of streetcar tracks disrupted transit patterns in the east bank. Community leaders at the time warned this isolation could lead to future unrest." This keeps the link but removes the magical "seed" inevitability.

  **3. The Mayor's Chronology (Legibility/Overreach)**
  *   *Claim:* Ten panels captioned "How the modern city got built" (1948–1956).
  *   **Bucket:** Legibility. (Fail for Causality)
  *   **Otherwise:** Did the modern city *only* get built then? What about 1920? 1970? (Fail)
  *   **Verdict:** **LABEL AS FRAME.** This is not a causal claim; it is a narrative frame donated by a supporter. You cannot fix this with mechanism because it is too broad.
      *   *Fix:* Do not fight the title, but add a sub-header: "Part 3: The 1948–1956 Boom." This contains the claim. If you leave it as "How the modern city got built," you are inviting historians to tear you apart. Hand this to the Director as a **Donor Requirement** that requires a disclaimer, not a historical fact.

  ---

  ### What This Procedure Cannot Do

  1.  **It Cannot Win Political Fights:** If the Director wants the "Seeds" claim because it makes for a better story, this procedure labels it as "Interpretive Frame," but it cannot stop them from printing it. It only protects *you* from being the person who said it was fact.
  2.  **It Cannot Fix Bad Research:** If the mechanism is wrong (e.g., the mill didn't run on fuel oil), this checklist won't catch it. It tests structure, not evidence.
  3.  **It Cannot Satisfy the Board Member's Theory:** Your board member is looking for logical necessity in historical contingency. You must politely explain that history is not math; if a chain holds in reverse, it is usually because the writer started with the ending and worked backward, which is exactly what you are trying to avoid.
  4.  **It Cannot Replace Community Input:** A claim can be causally sound (Mechanism) and still be offensive or rejected by the community advisory board. This procedure ensures your history is rigorous, not that it is welcome.
