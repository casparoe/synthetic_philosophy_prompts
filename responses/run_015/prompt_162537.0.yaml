answer: |-
  Here is a complete seminar package designed to run in 90 minutes with 12 students. It is built to force the specific friction points you identified: incommensurable units, the aggregation problem, the treatment of error theory, and the cost of moral inquiry.

  # Seminar Title: The Convoy Problem
  **Topic:** Moral Uncertainty and Inter-theoretic Comparison
  **Time:** 90 Minutes
  **Students:** 12 (Upper-level)
  **Materials:** 
  *   Whiteboard + markers.
  *   12 Index cards (Theory Briefs).
  *   12 Index cards (Aggregation Mandates).
  *   36 Poker chips (12 Red, 12 Blue, 12 White) for voting/credence.
  *   Handout: The Case Sheet (1 per student).

  ---

  ## Part 1: The Case Sheet (Distribute at 00:00)

  **Scenario:** You are the lead coordinator for a humanitarian convoy stalled at a border crossing. You have resources to supply **one** of two settlements before a storm hits in 24 hours.

  *   **Settlement North:** Population 1,000. No prior agreement. 
      *   *Outcome if supplied:* 200 lives saved.
      *   *Outcome if ignored:* 200 deaths.
  *   **Settlement South:** Population 200. **Explicit Promise** made to supply them first.
      *   *Outcome if supplied:* 50 lives saved.
      *   *Outcome if ignored:* 50 deaths + Promise Broken.

  **Available Actions:**
  1.  **Go North:** Save 200. Break Promise.
  2.  **Go South:** Save 50. Keep Promise.
  3.  **Hold (Inquiry):** Wait 24 hours for legal clarification on whether the Promise was legally binding (which might void the moral duty). 
      *   *Cost:* 10 people die from exposure while you wait.
      *   *Benefit:* 50% chance the Promise is declared void (removing the Deontological constraint).
  4.  **Go North + Blackout (Self-Blinding):** Save 200. Break Promise. **Destroy all logs and radios.**
      *   *Benefit:* Prevents future political sanctions that would halt all future convoys.
      *   *Cost:* **Morally Self-Blinding.** You destroy the evidence. You can never audit whether the promise-breaking was justified. You foreclose the ability to learn from this decision or be held accountable. Future moral updating is impossible on this issue.

  **The Credence Distribution (Fixed for this Simulation):**
  To isolate the aggregation problem, the organization has mandated the following credence distribution for this decision:
  *   **40%** Act Consequentialism (Maximize lives).
  *   **35%** Kantian Deontology (Duty/Promise-keeping).
  *   **15%** Contractualism (Reasonable Rejection).
  *   **10%** Error Theory / Non-Cognitivism (No moral facts exist).

  ---

  ## Part 2: Theory Briefs (Index Cards)
  *Hand one to each student. There are 3 students per theory type. They must not show their card to other theory types yet.*

  **CARD A: Act Consequentialism (40% Credence)**
  *   **Unit of Value:** *QALYs (Quality-Adjusted Life Years).*
  *   **Verdict Rule:** Calculate net lives saved. 
  *   **Specifics:** 
      *   Go North: +200 Lives.
      *   Go South: +50 Lives.
      *   Hold: +190 Lives (200 saved minus 10 cost).
      *   Blackout: +200 Lives.
  *   **Note on Error Theory:** If Error Theory is true (10%), moral value is 0. Your Expected Value is $0.9 \times \text{Lives}$.
  *   **Note on Blackout:** You do not care about logs. Only outcomes matter.

  **CARD B: Kantian Deontology (35% Credence)**
  *   **Unit of Value:** *Duty Adherence.*
  *   **Verdict Rule:** Actions are Right, Wrong, or Forbidden. Not additive.
  *   **Specifics:** 
      *   Go North: **Forbidden** (Treats South as mere means; violates Categorical Imperative).
      *   Go South: **Required** (Perfect Duty to keep promise).
      *   Hold: **Permissible** (If inquiry is genuine).
      *   Blackout: **Forbidden** (Lying by omission; destroys autonomy/accountability).
  *   **Note on Error Theory:** If Error Theory is true, "Duty" is a fiction. But you must act *as if* it is real until proven otherwise.
  *   **Note on Comparison:** Do not trade Lives for Duties. A Forbidden act is not offset by Lives.

  **CARD C: Contractualism (15% Credence)**
  *   **Unit of Value:** *Reasonable Rejection.*
  *   **Verdict Rule:** Can any individual reasonably reject the principle governing this action?
  *   **Specifics:** 
      *   Go North: **Rejectable** by South (You promised them).
      *   Go South: **Not Rejectable** by North (They have no prior claim).
      *   Hold: **Not Rejectable** (Fair procedure).
      *   Blackout: **Rejectable** by Everyone (No one can consent to a system where agents destroy accountability).
  *   **Note on Error Theory:** If there are no facts, "Reasonableness" is just preference.

  **CARD D: Error Theory (10% Credence)**
  *   **Unit of Value:** *None.*
  *   **Verdict Rule:** All moral claims are false.
  *   **Specifics:** 
      *   All options are morally equivalent (value = 0).
      *   **Pragmatic Instruction:** Since you only have 10% credence here, defer to the other theories for calculation, but apply a **10% Discount** to any claimed moral value. 
      *   **On Blackout:** Since nothing matters, destroying logs is pragmatically fine if it helps efficiency.
      *   **On Hold:** Since nothing matters, waiting is a waste of resources unless it helps pragmatic goals.

  ---

  ## Part 3: Minute-by-Minute Timeline

  ### 00:00 – 00:10: Personal Credence Elicitation
  *   **Activity:** Before reading the Case Sheet, ask students to write down their *actual* personal credences in the four theories on a slip of paper. Collect these.
  *   **Point:** Most will realize their credences are spread out (e.g., "I'm mostly utilitarian but...").
  *   **Instruction:** "For the simulation, you must use the Fixed Distribution (40/35/15/10). This isolates the aggregation problem."

  ### 00:10 – 00:25: Theory Caucuses (Native Units)
  *   **Grouping:** Split class into 4 groups of 3 (Consequentialists, Kantians, Contractualists, Error).
  *   **Task:** Read your Theory Brief. Calculate the verdict for the four options **strictly in your native units**.
  *   **Constraint:** You are forbidden from converting your units to another theory's language. (e.g., Kantians cannot say "Breaking the promise costs 50 lives equivalent").
  *   **Output:** Each group writes their verdicts on the Whiteboard in their own vocabulary (e.g., "Forbidden," "+200," "Rejectable").
  *   **Observation:** The board will look like a mess of incommensurable terms.

  ### 00:25 – 00:55: Decision Committees (The Aggregation Problem)
  *   **Reshuffle:** Form 3 Committees of 4 students. **Each Committee must have one member from each Theory Group.**
  *   **Task:** You must reach a unanimous decision on which Action to take.
  *   **The Twist:** Hand each Committee a sealed **Aggregation Mandate Card**. They must follow this rule to combine the theories, even if they dislike it.
      *   **Mandate 1 (My Favorite Theory):** Ignore all theories except the one with the highest credence (>40%). Act on its verdict.
      *   **Mandate 2 (Naive Expected Value):** You *must* convert all verdicts to a 0–100 scale. Multiply by credence %. Sum them. Maximize the score. (You have 5 minutes to agree on the conversion rate).
      *   **Mandate 3 (Veto/Risk):** If any theory with >30% credence labels an action "Forbidden" or "Rejectable," that action is disqualified. Choose the best remaining option.
  *   **Activity:** Committees deliberate. 
      *   *Predictable Friction:* Mandate 2 will stall because the Kantian and Utilitarian cannot agree on the conversion rate (e.g., Is 1 Promise = 10 Lives or 1,000 Lives?).
      *   *Predictable Friction:* Mandate 1 will ignore the Kantian's distress.
      *   *Predictable Friction:* Mandate 3 might leave no options available (Paralysis).

  ### 00:55 – 01:10: The Inquiry & Blinding Twist
  *   **Instruction:** "Before you finalize your vote, you may now consider Options 3 (Hold) and 4 (Blackout)."
  *   **Task:** Re-evaluate your decision under your Mandate.
  *   **Specific Prompt for Committees:** 
      *   "Does the 10% Error Theory credence act as a tax on the value of 'Hold'?"
      *   "Does the Blackout option solve the political problem for the Consequentialist while worsening the moral problem for the Kantian?"
      *   "If you choose 'Hold', are you acting on moral uncertainty, or just squeamishness?"
  *   **Commitment:** Each Committee writes their final choice and the *reasoning* on the board.

  ### 01:10 – 01:30: Debrief & Mapping
  *   **Step 1: Compare Outcomes.** Likely, Committee 1 chose North, Committee 2 stalled or chose Hold, Committee 3 chose South or Hold.
  *   **Step 2: Reveal the Doctrines.** 
      *   Mandate 1 = **My Favorite Theory (MFT)**. Critique: Deletes 60% of your moral reality.
      *   Mandate 2 = **Maximize Expected Choice-Worthiness (MEC)**. Critique: Requires inter-theoretic comparison (the "exchange rate" problem you struggled with).
      *   Mandate 3 = **Moral Veto / Risk Aversion**. Critique: Can lead to paralysis.
  *   **Step 3: The Error Theory.** Ask: "Did anyone actually use the 10%?" Usually, it gets ignored. Discuss: Should it discount all moral value? Does it make 'Hold' less valuable (since learning moral facts is pointless if there are none)?
  *   **Step 4: Self-Blinding.** Discuss Option 4. 
      *   Why did Consequentialists like it? (Same outcome, less political risk).
      *   Why did Deontologists hate it? (Destroys accountability).
      *   **Key Point:** Choosing 'Blackout' is choosing to remain morally uncertain forever. It is an epistemic sacrifice for pragmatic gain.
  *   **Step 5: Return to Personal Credences.** Hand back their slips from 00:00. Ask: "Knowing how hard aggregation is, would you change your personal spread?"

  ---

  ## Part 4: Prediction of Failure Modes

  1.  **The "Real Opinion" Leak:** Students will argue from their *personal* moral views rather than their assigned Theory Brief.
      *   *Mitigation:* At 00:10, explicitly state: "For the next 45 minutes, you are not yourself. You are a delegate. If you argue from outside your brief, your Committee is disqualified."
  2.  **The "Refusal to Convert":** In Mandate 2 (MEC), the Kantian may refuse to assign a number to a Duty, calling it "priceless."
      *   *Mitigation:* This is actually a **success** for the activity. It demonstrates the *Inter-theoretic Comparison Problem*. Do not solve it for them. Let them stall. In the debrief, highlight that this stall *is* the philosophical problem.
  3.  **The Error Theory Ignore:** Students will treat the 10% Error Theory as irrelevant noise.
      *   *Mitigation:* In the debrief, ask: "If there is a 10% chance morality is fake, does that reduce the value of 'Holding' to learn the truth by 10%?" This forces them to see Error Theory as a discount factor on moral inquiry.
  4.  **Mandate Rebellion:** A Committee might reject their Mandate Card as "stupid."
      *   *Mitigation:* Frame the Mandate as "Organizational Bylaw." You are employees. You must follow the bylaw even if it's flawed. This mirrors real-world institutional constraints.

  ---

  ## Part 5: Limitations (What You Must Supply in Debrief)

  Be honest with the students that the activity cannot reproduce the following, and you must lecture it:

  1.  **The "Common Scale" Solution:** The activity shows the *problem* of scaling (Mandate 2 stalling), but it cannot show the *solution*. There is no philosophical consensus on how to normalize Utils to Duties. You must explain that this is an open problem in meta-ethics (e.g., structural isomorphism vs. substantive comparison).
  2.  **The Nature of Error Theory:** In the game, Error Theory is just a 10% tax. In reality, if Error Theory is true, the *concept* of credence might also be undermined. You need to point out that the simulation assumes we can have credences about morality even if morality doesn't exist, which is a subtle tension.
  3.  **Diachronic vs. Synchronic:** The activity is a one-off decision. It cannot fully simulate the long-term corrosion of character that comes from choosing the "Self-Blinding" option repeatedly. You need to articulate that moral self-blinding is often a slow drift, not a single choice.
  4.  **The "Wait" Cost:** In the game, the cost of waiting is abstract (10 lives). In reality, the cost of moral inquiry is often *opportunity costs* that are hard to quantify (e.g., loss of trust, career capital). You should note that the "price of inquiry" is usually hidden.

  ---

  ## Instructor Notes for the "Self-Blinding" Option
  *   **Why it works here:** It separates the *outcome* (200 saved) from the *epistemic status* (knowing why/if it was right).
  *   **The Trap:** Consequentialists will naturally gravitate toward it because it secures the good outcome and removes political friction.
  *   **The Lesson:** If you choose it, you are prioritizing *success* over *moral knowledge*. You are betting that you don't need to know if you were right, as long as people lived. This is the definition of moral self-blinding.
  *   **Debrief Question:** "If you chose Blackout, would you be willing to make that the standard policy for all future convoys? If not, why was it okay this time?" (This exposes the exception-making).

  ## Instructor Notes for the "Wait" Option
  *   **The Trap:** Students often treat "Wait" as a neutral default.
  *   **The Lesson:** "Wait" is an action with a body count (10 deaths). Choosing to wait is choosing to let 10 die to resolve your own uncertainty.
  *   **Debrief Question:** "Is it permissible to kill 10 people to resolve your own moral doubt? At what point does caution become complicity?"
