  ### The Leaves (Positions)

  **Leaf 1: Episodic Relativism**
  *   **Standard Name:** Episodic Relativism (Descriptive).
  *   **Awkward Commitment:** It commits you to the view that grammar physically alters the encoding of hippocampal memory traces, not just their retrieval.
  *   **Writing License:** You may write a character whose memories feel qualitatively different (sharper, more sourced) because of their grammar, even years later.

  **Leaf 2: Thinking-for-Speaking**
  *   **Standard Name:** Thinking-for-Speaking (Slobin).
  *   **Awkward Commitment:** It commits you to the view that language has *no* effect on silent thought, only on the preparation of speech.
  *   **Writing License:** You may write a character who attends to wind/evidence only when talking or planning to talk; in silence, they feel what any human feels.

  **Leaf 3: Lexical Relativism**
  *   **Standard Name:** Lexical Relativism (Descriptive).
  *   **Awkward Commitment:** It commits you to the view that vocabulary shapes habit but never blocks understanding; no concept is truly untranslatable, only cumbersome.
  *   **Writing License:** You may write a character who finds certain thoughts "clumsy" or "distant" in another language, but never impossible.

  **Leaf 4: Universalism**
  *   **Standard Name:** Universalism (Chomskyan/Cognitive).
  *   **Awkward Commitment:** It commits you to the view that linguistic differences are superficial skin over identical cognitive machinery; culture is decoration.
  *   **Writing License:** You are licensed to write nothing unique about their cognition; any difference is costume, not psychology.

  **Leaf 5: Contextual Habit**
  *   **Standard Name:** Contextual Habit (Descriptive).
  *   **Awkward Commitment:** It commits you to the view that cognitive bias is fragile and collapses under cognitive load or language switching.
  *   **Writing License:** You may write a character whose "Kænnavan mind" slips away when they are tired or speaking Trade; their identity is fluid.

  **Leaf 6: Habitual Cognition**
  *   **Standard Name:** Habitual Cognition (Boroditsky-style Weak Relativism).
  *   **Awkward Commitment:** It commits you to the view that language creates deep habits that persist offline, but denies that these habits are irreversible or biological.
  *   **Writing License:** You may write a character who silently orients to the wind or checks sources out of habit, even when alone, but could unlearn it.

  **Leaf 7: Critical Period Determinism**
  *   **Standard Name:** Critical Period Determinism (Descriptive).
  *   **Awkward Commitment:** It commits you to the view that adults are cognitively locked out of the "true" Kænnavan worldview; only children are fully human in this context.
  *   **Writing License:** You may write a native character whose perception is fundamentally sharper/different than an adult learner's; the learner is permanently "outside."

  **Leaf 8: Conceptual Relativism**
  *   **Standard Name:** Conceptual Relativism (Neo-Whorfian).
  *   **Awkward Commitment:** It commits you to the view that language shapes high-level concepts but leaves low-level perception (reaction time) untouched.
  *   **Writing License:** You may write a character who categorizes the world differently, but whose eyes react to colour/light the same as anyone else's.

