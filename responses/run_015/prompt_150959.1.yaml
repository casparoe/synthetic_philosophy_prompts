  ### The Crux: The Silent Evidential Scene

  **The Question:** Does the position for feature (ii) license a scene in which a character, alone, silent, and with no one to report to, *feels* the difference between what she saw and what she inferred?

  **The Mapping:**
  Feature (ii) lands on **Leaf 2 (Thinking-for-Speaking)**.
  *   **Node 1 Answer:** No (Effect is only during speech planning).
  *   **Node 3 Answer:** No (Memory trace fades to neutral).

  **The Verdict:**
  **No, this position does not license the scene.**
  Under the *Thinking-for-Speaking* hypothesis (the dominant view for grammatical evidentials), the evidential marker is a tool for packaging information for a listener. It is not a mode of perception. In silence, the character's cognitive state reverts to a universal baseline where the distinction between "seen" and "inferred" is available to all humans but not *grammatically highlighted*.

  **To license the scene, you must move the feature to Leaf 1 (Episodic Relativism) or Leaf 6 (Habitual Cognition).**
  *   **How:** You must answer **Yes** at Node 1 (The Silent Navigator). You must posit that the grammatical requirement to mark evidence creates a *habit of mind* that persists in silence (Node 5: Persists).
  *   **The Cost:** This moves you from the scientifically conservative *Thinking-for-Speaking* view to the more contested *Habitual Cognition* view.
  *   **The Guarantee:** There is **no guarantee** available here. The literature is divided. Some studies suggest evidentials improve source memory accuracy (supporting Leaf 1); others suggest they only affect verbal reporting (supporting Leaf 2).

  **Recommendation:**
  If you write the silent scene, do not present it as a mechanical certainty of the grammar. Present it as a *culturally cultivated discipline*. The grammar *compels* the speech, but the *silence* is a result of a lifetime of training to attend to sources, reinforced by the grammar. This aligns with **Leaf 6 (Habitual Cognition)**. It acknowledges the grammar's role without making the scientifically dubious claim that the grammar *biologically forces* the silent thought.

  **Plain Truth:** A reader who knows the literature could object to a silent character feeling a *grammatical* distinction. They cannot object to a silent character feeling a *habitual* distinction reinforced by grammar. Write the habit, not the grammar, in the silence.
