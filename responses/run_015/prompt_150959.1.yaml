  ### Empty Combinations

  1.  **Combination:** *Yes* to Silent Navigator (Offline effect) + *Yes* to Bilingual Switch (Vanishes) + *No* to Attentional Load (Not resource dependent).
      *   **Status:** **Incoherent.** If an effect exists in silence but vanishes when switching language, it must be dependent on the activation of that language system. If it is not resource-dependent (attentional), there is no mechanism for it to vanish when the language is not in use. It claims to be both deep (offline) and shallow (switchable).

  2.  **Combination:** *No* to Grammatical Wall (Optional) + *Yes* to Translation Loss (Untranslatable).
      *   **Status:** **Unattractive.** If a speaker can omit the grammatical marker (optional), the concept is not structurally required for the thought. Claiming it is nonetheless untranslatable implies the *option* carries a weight that the *obligation* does not, which contradicts the logic of grammaticalization.

  3.  **Combination:** *Yes* to Adult Learner (Adults acquire bias) + *Yes* to Critical Period (Only children acquire bias).
      *   **Status:** **Incoherent.** These are mutually exclusive answers to Node 7. No position occupies this space because it is a logical contradiction.

  ---

  ### Inseparable Leaves

  **Leaf 6 (Habitual Cognition) and Leaf 8 (Conceptual Relativism).**
  *   **Reason:** Both posit offline effects that persist in adults. The distinction rests on whether the effect is "habit" (attentional, potentially reversible) or "concept" (structural, stable). In a fictional character's internal monologue, the phenomenology of a "deep habit" and a "restructured concept" is identical.
  *   **Further Question:** To separate them, you would need a neuroimaging study showing whether the bias activates language centers (Broca's) during non-linguistic tasks (Leaf 6) or sensory/association cortices (Leaf 8). Without this, they are functionally the same for a novelist.

