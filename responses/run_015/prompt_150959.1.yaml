  ### Application to Kænnavan Features

  **Feature (i): Absolute Spatial Reference (Winds)**
  *   **Path:** Node 1 (Silent Navigator: **Yes**, mental map altered) → Node 5 (Bilingual Switch: **Persists**) → Node 7 (Adult Learner: **No**, only children) → Node 9 (Perceptual Boundary: **No**, concept only).
  *   **Leaf:** **Leaf 8 (Conceptual Relativism)** or **Leaf 6 (Habitual Cognition)**.
  *   **Reasoning:** Empirical work on languages like Guugu Yimithirr suggests absolute spatial reference creates robust offline cognitive maps (Node 1: Yes). However, adults can learn it with difficulty, suggesting it is not strictly Critical Period (Node 7: Yes/No split).
  *   **Writing License:** You are licensed to write characters who are unconsciously oriented even indoors. This is the strongest case for psychological realism in your novel.

  **Feature (ii): Obligatory Evidentials**
  *   **Path:** Node 1 (Silent Navigator: **No**, only sentence) → Node 2 (Grammatical Wall: **Yes**, blocks utterance) → Node 3 (Memory Trace: **No**, fades) → Node 10 (Source Monitoring: **Reconstructed**).
  *   **Leaf:** **Leaf 2 (Thinking-for-Speaking)**.
  *   **Reasoning:** Most psycholinguistic evidence (e.g., Slobin, Faller) suggests evidentials affect *encoding* for communication, not the *experience* of the memory itself in silence. The bias is online.
  *   **Writing License:** You are licensed to write characters who *speak* with high epistemic vigilance. You are **not** licensed to assume this changes their silent experience of truth without further justification.

  **Feature (iii): Colour Vocabulary (Blue/Green/Grey)**
  *   **Path:** Node 1 (Silent Navigator: **Yes**, offline match) → Node 5 (Bilingual Switch: **Vanishes**) → Node 6 (Attentional Load: **Disappears**).
  *   **Leaf:** **Leaf 5 (Contextual Habit)** or **Leaf 7 (Critical Period Determinism)**.
  *   **Reasoning:** Colour studies (e.g., Winawer, Kay) show effects on reaction time (perception) that can be language-dependent (Node 5: Yes).
  *   **Writing License:** You may write characters who group colours differently, but this effect may vanish if they are tired or speaking Trade.

