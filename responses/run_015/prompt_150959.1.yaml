  ### The Taxonomy of Linguistic Cognition

  This decision tree maps the logical space of positions regarding language and thought. It begins with concrete scenarios involving your Kænnavan speakers. Follow the path dictated by your theoretical commitments to arrive at one of eight positions (leaves).

  **Node 1: The Silent Navigator**
  A Kænnavan speaker sits alone in a windowless room, silent, planning a route to the reef. Does the requirement to use wind-directions alter their *mental map* of the route, or only the *sentence* they would speak to describe it?
  *   **Only the sentence:** Go to Node 2.
  *   **The mental map:** Go to Node 5.

  **Node 2: The Grammatical Wall**
  A speaker wishes to say "I walked," but does not know the wind direction. Does the grammar *block* the utterance until they guess or omit the motion, or can they simply say "I walked" and leave the direction unmarked?
  *   **Blocks the utterance (Obligatory):** Go to Node 3.
  *   **Allows omission (Optional):** Go to Node 4.

  **Node 3: The Memory Trace**
  A speaker describes an event using Kænnavan evidentials. Three days later, they recall the event in a trade language with no evidentials. Is the *source* of the memory (seen vs. heard) still vividly distinct, or has it faded to a neutral fact?
  *   **Still distinct:** Go to Node 10.
  *   **Faded to neutral:** Go to Leaf 2.

  **Node 4: The Translation Loss**
  A Kænnavan story is translated into the trade language. To preserve the nuance of the colour terms or evidentials, must the translator add explanatory clauses that change the rhythm and focus of the prose?
  *   **Yes, nuance is lost:** Go to Node 11.
  *   **No, concepts map cleanly:** Go to Leaf 4.

  **Node 5: The Bilingual Switch**
  A bilingual speaker (Kænnavan/Trade) switches entirely to the Trade language for a week. Does their silent attention to wind directions or evidence sources *vanish* during this week, or does it persist?
  *   **Vanishes:** Go to Node 6.
  *   **Persists:** Go to Node 7.

  **Node 6: The Attentional Load**
  The bilingual speaker performs a difficult non-verbal puzzle (e.g., stacking blocks) while speaking. Does the linguistic bias (e.g., checking evidence) disappear when their cognitive resources are fully occupied by the puzzle?
  *   **Disappears:** Go to Leaf 5.
  *   **Persists:** Go to Leaf 6.

  **Node 7: The Adult Learner**
  An adult immigrant acquires Kænnavan fluently. Do they develop the offline cognitive biases (e.g., silent wind-orientation) to the same degree as a native child?
  *   **Yes, same degree:** Go to Node 8.
  *   **No, weaker or absent:** Go to Node 9.

  **Node 8: The Non-Verbal Sort**
  The adult learner is asked to sort objects by material vs. shape without using words. Does their sorting preference shift to match Kænnavan speakers, despite learning the language as an adult?
  *   **Shifts:** Go to Node 12.
  *   **Does not shift:** Go to Leaf 6.

  **Node 9: The Perceptual Boundary**
  A native child is tested on colour discrimination (blue/green) before they have fully mastered the colour names. Is their reaction time faster at the linguistic category boundary than within it?
  *   **Yes (Perception affected):** Go to Leaf 7.
  *   **No (Only categorization):** Go to Leaf 8.

  **Node 10: The Source Monitoring**
  When the speaker recalls the event (from Node 3), is the source information (seen/heard) stored as part of the *event memory* itself, or is it reconstructed at the moment of retrieval based on habit?
  *   **Stored in event memory:** Go to Leaf 1.
  *   **Reconstructed at retrieval:** Go to Leaf 2.

  **Node 11: The Lexical Availability**
  Does the translation loss (from Node 4) occur because the speaker *cannot conceive* of the distinction without the word, or simply because the word makes it *easier to access*?
  *   **Cannot conceive:** Go to Leaf 7.
  *   **Easier to access:** Go to Leaf 3.

  **Node 12: The Reaction Time**
  In the sorting task (from Node 8), does the bias appear in *how fast* they decide, or only in the *final choice*?
  *   **Speed (Pre-conscious):** Go to Leaf 7.
  *   **Choice (Deliberate):** Go to Leaf 6.

