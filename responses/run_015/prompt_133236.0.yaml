answer: |-
  # Seminar Design: The Structure of Aggregation and Causal Inference
  **Duration:** 90 Minutes
  **Target:** Philosophy-of-Science Undergraduates (1 Intro Stats Course)
  **Topic:** Simpson's Paradox as a Structural Failure of Aggregation

  ## I. Conceptual Dependency
  Before presenting the reversal, you must establish that **statistical association is partition-dependent, not intrinsic.**

  Students typically enter with the intuition that correlation is a property of the world (like mass or charge) that we "discover" by gathering enough data. You must displace this with the view that association is a property of a *description* of the world. A correlation coefficient is not a fact about the population *simpliciter*; it is a fact about the population *relative to a specific grouping variable*. Until they accept that pooling data is an active modeling choice rather than a neutral default, the paradox will appear as a mathematical glitch rather than an epistemic warning.

  ## II. The Carrying Scenario: "The Auto-Fix Tool"
  **Context:** A software engineering team is testing a new "Auto-Fix Tool" intended to repair code errors.
  **Intervention:** Using the Tool (Yes/No).
  **Outcome:** Successful Repair (Yes/No).
  **Subgroups:** Error Type (Logic Errors vs. Syntax Errors).
  **Narrative Structure:**
  Logic Errors are conceptually difficult for humans but the Tool is designed to handle them well. Syntax Errors are trivial for humans but the Tool sometimes overcomplicates them (though still performs decently).
  **The Hidden Allocation Mechanism:** Developers do not assign the Tool randomly. They reserve the Tool primarily for **Logic Errors** (because they struggle with those) and rely on manual fixing for **Syntax Errors** (because they are easy).
  **The Data Structure:**
  1.  **Logic Errors:** Tool Success (80%) > Manual Success (60%).
  2.  **Syntax Errors:** Tool Success (40%) > Manual Success (20%).
  3.  **Pooled Data:** Tool Success (55%) < Manual Success (75%).

  *Why this works:* It avoids medical/vaccine triggers. It provides a clear causal mechanism (the Tool fixes bugs). It provides a clear confounder (Error Type drives Tool allocation). It creates a narrative reason for the imbalance (developers save the tool for hard tasks).

  ## III. Explanatory Sequence & Misconception Interception

  ### Phase 1: The Epistemic Privilege of Aggregation (0–20 mins)
  **Activity:** Present the Pooled Data first. Show that the Manual method appears superior (75% vs 55%). Ask students to recommend a policy based *only* on this table.
  **Misconception 1:** *Correlation at any level implies causation.*
  *   **Interception Point:** Before revealing the subgroups. Ask: "If we adopt the Manual method based on this table, are we claiming the Manual method *causes* higher success, or just that it is associated with it?" Force them to admit that without randomization, the pooled association is merely observational.
  **Misconception 2:** *The larger-N pooled result is epistemically privileged.*
  *   **Interception Point:** Immediately after revealing the subgroups. Students will instinctively trust the larger number (Pooled N) over the smaller subgroup Ns.
  *   **Correction:** Explicitly state: "Sample size does not cure structural bias. A large biased sample is still biased." The pooled data aggregates two distinct causal contexts into one number, destroying information about the allocation mechanism.

  ### Phase 2: The Reversal and the Partition (20–50 mins)
  **Activity:** Reveal the Subgroup Data. Walk through the "Auto-Fix" narrative. Show that the Tool is superior in *both* specific contexts, yet inferior in the aggregate.
  **Conceptual Pivot:** Demonstrate that the "True Effect" is found in the subgroups *only because* the subgroup variable (Error Type) is the common cause of both Tool Assignment and Success Probability.
  **Misconception 3:** *Stratifying on the confounder always yields the "true" effect.*
  *   **Interception Point:** During the discussion of why we split by Error Type.
  *   **Correction:** Ask: "What if we stratified by 'Time of Day' (Morning/Night) instead?" Show that if 'Time of Day' does not drive the allocation of the Tool, stratifying on it creates noise, not clarity. Emphasize that we stratify on Error Type not because it is a variable, but because it is the *allocation mechanism*. We are not just slicing data; we are controlling for the decision process that generated the data.

  ### Phase 3: Causal Claims vs. Statistical Patterns (50–75 mins)
  **Activity:** Discuss the ontological status of the effect. Does the Tool work? Yes. Did the data show it? Not initially.
  **Misconception 4:** *If reversal occurs, population-level causation is ontologically empty.*
  *   **Interception Point:** In the final synthesis. Students may conclude that because the numbers flip, "causation is relative" or "there is no fact of the matter."
  *   **Correction:** Distinguish between *Causal Efficacy* (what happens under intervention) and *Observational Association* (what happens under current habits). The paradox arises because the observational data reflects the developers' *habits* (using the tool on hard bugs), not the tool's *physics*. The causal claim is stable; the statistical summary is fragile. The "truth" is not in the numbers alone, but in the numbers + the story of how they were generated.

  ### Phase 4: Diagnostic and Wrap-up (75–90 mins)
  **Activity:** Diagnostic Question (see below).
  **Wrap-up:** Reiterate that statistics describes patterns, but only causal modeling (understanding the allocation mechanism) justifies inference.

  ## IV. End-of-Session Diagnostic Question
  **Scenario:** A hospital tracks recovery rates for a new therapy. Overall, the Therapy group recovers less often than the Control group. However, when split by "Severity of Illness" (Mild/Severe), the Therapy group recovers more often in both categories.
  **New Variable:** You are given data on "Hospital Ward" (Ward A vs. Ward B). You learn that Ward A is a specialized research wing where *all* patients (Therapy and Control) are monitored more closely, leading to higher recovery rates for everyone, regardless of treatment. Ward B is standard care.
  **Question:** To determine if the Therapy *causes* recovery, should you:
  (A) Pool the data across Wards.
  (B) Stratify (split) the data by Ward.
  (C) Ignore the Ward data entirely.

  **Correct Reasoning Required:** (A) Pool the data.
  **Why:** "Ward" affects the Outcome (recovery) but does *not* affect the Allocation (who got Therapy). It is not a confounder; it is an independent predictor of outcome. Stratifying on it would fragment the sample size without correcting bias (Misconception 3). Pooling preserves power because the Ward effect cancels out regarding the *comparison* between Therapy and Control, provided the randomization/assignment didn't depend on the Ward. If the prompt specifies assignment was independent of Ward, pooling is safe. If assignment depended on Ward, stratification is needed.
  *Refinement for clarity:* To make it definitive, specify that patients were assigned to Therapy/Control *before* being assigned to a Ward.
  **Correct Answer:** Pool the data.
  **Philosophical Test:** This tests if they understand that we only partition to block *allocation bias* (confounding), not to control for *every* difference. If they stratify on Ward, they treat all partitions as epistemically equal, failing to grasp the structural role of the confounder.

  ## V. Explicit Omissions and Justification

  **1. Formal Causal Graph Notation (DAGs/arrows)**
  *   **Omission:** Do not teach nodes, edges, d-separation, or backdoor criteria notation.
  *   **Justification:** The goal is conceptual understanding of *why* aggregation fails, not training in causal calculus. Introducing formal graph theory shifts the cognitive load from philosophical inference to syntactic manipulation. The narrative of the "allocation mechanism" suffices to explain the direction of influence without requiring formal topology.

  **2. The Formal Conditions for Collapsibility**
  *   **Omission:** Do not present the mathematical inequalities or weighted average formulas that define when Simpson's Paradox occurs.
  *   **Justification:** This is a philosophy seminar, not a statistics seminar. Knowing the mathematical boundary conditions does not help students understand the epistemic lesson: that data does not speak for itself. Focusing on the formula encourages the belief that this is a mathematical puzzle to be solved, rather than a structural limitation of observational inference to be understood.

  **3. The "Mediator" Distinction**
  *   **Omission:** Do not deeply distinguish between Confounders and Mediators (variables on the causal path).
  *   **Justification:** While crucial for advanced causal inference, introducing mediators at this stage risks confusing the primary lesson: *confounding biases the pooled estimate.* If students worry about stratifying on mediators (which blocks the effect), they may become paralyzed about stratifying at all. Keep the focus strictly on the "Hidden Allocation Mechanism" (Confounder) to secure the core insight about aggregation.
