answer: |-
  **Project Title:** Functional Typologies of Historical Periodization: A Comparative Audit of Boundary, Trajectory, and Threshold Labels

  **Research Question**
  Does distinguishing between three functional types of period labels—*Boundary* (residual definition), *Trajectory* (evaluative direction), and *Threshold* (property switch)—resolve the stalemate between deflationist historiography (which claims all periodization is retrospective projection) and realist historiography (which claims some labels track empirical discontinuities)? Specifically, do deflationist critiques fail when applied to Boundary labels because they incorrectly employ Threshold criteria of validity (i.e., contemporary recognition)?

  **Intervention and Historiographical Context**
  Current debates regarding periodization suffer from category errors. Deflationists (e.g., proponents of conceptual history) argue that labels like "the Middle Ages" are illegitimate because actors within the period did not recognize them. Defenders argue that labels like "the Scientific Revolution" are necessary to denote real structural changes in methodology. Both camps assume a single standard of validity: either contemporary self-identification or empirical discontinuity.

  This project argues that these standards are not universal but label-specific. A Boundary term (e.g., *Medium Aevum*) functions to organize transitional debris and does not require contemporary recognition to be useful. A Trajectory term (e.g., *Renaissance*) inherently smuggles in evaluation and cannot be neutral. A Threshold term (e.g., *Scientific Revolution*) claims a switch in properties and must withstand empirical testing for discontinuity. By conflating these types, historians talk past one another. This project does not seek to prove one camp right, but to demonstrate that their criteria of falsification are mismatched to their objects of study.

  **Methodology**
  This project employs a comparative historiographical audit rather than intellectual history or etymology. Tracing the history of the words (e.g., when "Middle Ages" was first coined) is insufficient because it conflates origin with function. A label can be coined late but function as a Threshold term, or coined early and function as a Boundary term. Instead, I will analyze how these labels are *used* in contemporary debate to handle anomalous data.

  I will select three canonical labels representing each type:
  1.  **Boundary:** "The Middle Ages" (defined by what sits between Rome and Modernity).
  2.  **Trajectory:** "The Renaissance" (defined by rebirth/progress).
  3.  **Threshold:** "The Scientific Revolution" (defined by the switch to experimental method).

  **The Explicit Test: The Anachronism Tolerance Matrix**
  For each label, I will examine five key secondary texts (three deflationist, two defender) and code their arguments based on how they handle "lagging indicators" (e.g., medieval science in the 17th century, or humanism in the 12th century). I will measure the "break point" for each label: how much anachronistic evidence can the label absorb before the historian discards it?
  *   *Hypothesis:* Boundary labels will tolerate high overlap (continuity is expected). Threshold labels will tolerate low overlap (continuity falsifies the label). Trajectory labels will tolerate overlap only if the "direction" remains clear.

  **Work Plan (10 Weeks)**
  *   **Week 1:** Finalize typology definitions. Select the 15 secondary texts (5 per label) ensuring a mix of recent and seminal works. Construct the coding sheet for the Anachronism Tolerance Matrix.
  *   **Week 2:** Close reading of "Middle Ages" texts. Code arguments regarding continuity vs. discontinuity. Note where deflationists invoke contemporary recognition as a disqualifier.
  *   **Week 3:** Close reading of "Renaissance" texts. Code arguments regarding evaluation. Note where defenders deny the evaluative load of the term.
  *   **Weeks 4–5 (Block 1):** Close reading of "Scientific Revolution" texts. Apply the Matrix. Determine if deflationist critiques here rely on Threshold criteria (lack of binary switch) rather than Boundary criteria (lack of contemporary recognition).
  *   **Weeks 6–8 (Block 2):** Synthesis and Cross-Comparison. Map the coding results against the typology. Draft the argument showing where category errors occur. Identify if any label shifts types depending on the author (e.g., is "Scientific Revolution" ever used as a Trajectory term?).
  *   **Week 9:** Drafting the final paper. Focus on clarity for non-specialists.
  *   **Week 10:** Revision and formatting. Stress-test the conclusion against potential counter-examples.

  **Expected Output**
  The final deliverable will be a 10,000-word dissertation chapter plus a "Diagnostic Toolkit" for historians. The Toolkit will be a one-page heuristic consisting of three questions historians can ask when deploying period labels:
  1.  *Does this label claim a switch, a direction, or a gap?*
  2.  *What evidence would falsify this specific type of label?*
  3.  *Am I demanding contemporary recognition for a label that functions structurally?*
  This ensures the project is usable by historians who do not care about historiography but need to justify their periodization in grant proposals or publications.

  **Conditions of Failure**
  The project fails if:
  1.  **Typological Collapse:** The coding reveals that all three labels function identically in practice (e.g., all are treated as Threshold terms regardless of intent), rendering the distinction theoretical only.
  2.  **Indistinguishable Criteria:** The "Anachronism Tolerance" test yields statistically identical break points for all three types, suggesting the deflationist/defender divide is not about label type but about ideological commitment.
  3.  **Inconclusivity:** The texts are too ambiguous to code reliably. (Mitigation: I will pilot the coding scheme in Week 1 on one text per category to ensure reliability).

  **Feasibility and Scope**
  Ten weeks is sufficient for this historiographical analysis but tight for the volume of reading proposed (15 dense secondary texts). To ensure completion, I will limit the secondary literature to works explicitly debating the validity of the period label, excluding general histories that merely use the terms. If coding proves too time-consuming, I will reduce the sample size from five texts per label to three, prioritizing seminal deflationist/defender pairs. I will not engage with primary sources, as the object of study is the historiographical argument itself, not the historical periods. This scope is realistic for a third-year undergrad with prior training in historiographical methods.
