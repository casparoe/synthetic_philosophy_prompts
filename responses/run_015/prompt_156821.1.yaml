      *   *Focus:* Make sure to address the "working-class" and "psychological profile" examples from the prompt to keep it grounded.

  6.  **Final Review against Prompt:**
      *   Essay format? Yes.
      *   Weigh skeptical, pragmatic, indexical views? Yes.
      *   Substantive conclusion? Yes.
      *   No bibliographic appeals? Yes.
      *   Address the "singular lives" aspect? Yes.

  7.  **Final Polish:** Check for clarity, flow, and philosophical precision. (Ensure the distinction between "frequency" and "propensity/evidential support" is clear without jargon.) *Self-correction: Ensure I don't dismiss the skeptical view too easily; it has weight.*

