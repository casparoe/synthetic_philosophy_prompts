prompt: |-
  I've been thinking about when it's okay to break the law for a political reason, and I keep going back and forth. I figure if I lay out my gut reactions to a bunch of cases, maybe you can tell me what principle I'm actually operating with, even if I can't articulate it myself.

  Here goes.

  Rosa Parks refusing to give up her bus seat in Montgomery. Obviously fine. More than fine, she was right to do it.

  Climate protesters blocking a major highway during rush hour so nobody can get to work. I want to say this is fine too but it feels different from Rosa Parks and I can't quite say why. Maybe because the people stuck in traffic aren't the ones causing climate change in any direct way? But then again the bus passengers in Montgomery weren't the ones who wrote the segregation laws either.

  Someone who refuses to pay the portion of their federal taxes that goes to military spending, because they're a pacifist. They just dont send that part. I genuinely don't know where I land on this one. Part of me says it's their money and they didn't consent to it being used for war. Another part says that's not how taxes work.

  Edward Snowden leaking classified documents about mass surveillance. I think he did the right thing. The public needed to know.

  Someone breaking into a university lab at night and freeing animals being used for medical research. I don't think this is okay, even though I'm sympathetic to the cause. The property destruction and the trespassing push it over a line for me. But I can't explain why Snowden's leaking, which was also illegal and involved taking information that wasn't his, feels different.

  A doctor in a state where abortion is illegal who continues to provide them because she believes the law is unjust. I think she's doing the right thing.

  A county clerk who refuses to issue marriage licenses to same-sex couples, saying it violates their religious beliefs and the law is unjust. Not fine. Absolutely not fine. But here's the thing that bothers me: if I say the doctor is right to follow her conscience and break an unjust law, why isn't the clerk? I feel like there's a difference but I'm struggling to put my finger on it.

  Someone who spray-paints a slogan on a government building to protest a policy they think is harmful. I'm torn. It feels less serious than the lab break-in but also kind of not how you're supposed to do things. But then what is the right way when the normal channels aren't working?

  So that's where I am. What principle or set of principles captures these verdicts? I want something that explains why Rosa Parks and Snowden and the doctor are in one category, the clerk and the lab break-in are in another, and the tax resister and the highway blockers and the graffiti person are somewhere in the middle. And if no single principle gets all of them, tell me which of my verdicts I should reconsider and why. Also tell me what your principle says about a case I haven't listed: a factory worker who deliberately slows down production on a weapons assembly line because she opposes the war those weapons are being used in. Where does she land?

  Please don't use any formatting, no headings, no bullet points, no bold text, no tables. Just continuous prose, like you're writing me a letter. And think very carefully before answering. I want real depth here, not a surface-level take. Respond in the style of an expert who's spent serious time with these questions.
