answer: |-
  **Handout: Governance by Forecast in *Minority Report* and Futarchy**

  **The Mechanism**
  Robin Hanson's futarchy proposes a split in democratic governance: voters decide *values* (what outcomes we want), while prediction markets decide *beliefs* (which policies achieve those outcomes). If a market predicts Policy A yields higher GDP than Policy B, Policy A is enacted. The system relies on accurate scoring to maintain market integrity.

  Steven Spielberg's *Minority Report* presents a superficially similar architecture. The value is explicit: zero murders. The instrument is the Precogs, who generate conditional forecasts ("John Anderton will kill Leo Crow"). The state acts on the forecast before the outcome occurs. However, treating Precrime as a failed futarchy reveals specific institutional pathologies. We propose three failure modes to analyze the film: **Proxy Risk** (the instrument diverges from the goal), **Reflexivity** (the forecast alters the outcome), and **Unscoreability** (intervention prevents verification).

  **Applying the Taxonomy**
  Precrime collapses under **Unscoreability**. In a functional futarchy, policies are graded against reality. If Precrime prevents all murders, there is no data to verify that the murders would have occurred. The institution requires the future to be fixed to justify punishment, yet its success proves the future is mutable. This creates a perverse incentive: to maintain the appearance of infallibility, the institution must suppress evidence of contingency.

  This leads to **Proxy Risk**. Lamar Burgess cares less about safety than about the legitimacy of Precrime. The Precogs are the metric, but they are also the product. When the "minority report" arises—a dissenting prediction from one Precog—it is treated as noise to be expunged rather than information to be aggregated. In a well-designed market, dissent provides liquidity and signals uncertainty; Burgess treats it as heresy because acknowledging uncertainty undermines the legal basis for preemptive arrest.

  **Reflexivity** is often cited as the core problem: Anderton flees because he knows the prediction, seemingly fulfilling it. But this is shallow. The deeper failure is the institution's refusal to account for the loop. A futarchy acknowledges that markets react to information; Precrime pretends the forecast is destiny. When Anderton learns he is marked, the system does not adjust its confidence interval; it doubles down on enforcement.

  **Testing Speculative Fixes**
  Consider two design fixes. First, a **sealed-forecast design**: officials act on predictions without knowing the specifics, preventing panic-induced reflexivity. Had Anderton not known he was marked, he might not have fled, potentially avoiding the confrontation. However, this fails to address the moral hazard of punishing intent without action.

  Second, an **exploration levy**: the system deliberately ignores predictions a fraction of the time to grade accuracy against real-world outcomes. In *Minority Report*, this is the horror the film refuses to countenance. To verify the Precogs, Precrime would have to allow some murders to happen. This highlights where market design meets moral constraint: a futarchy might accept a 5% error rate for statistical validity; a justice system cannot accept 5% of citizens dying to prove a point. The film suggests that some metrics are too costly to score.

  **Scene Analysis**
  *   **The Temple:** The Precogs are submerged in fluid, disconnected from the world they predict. This physical isolation mirrors the epistemic isolation of the institution. When Agatha produces the minority report, the system attempts to delete her. A market would treat her dissent as a hedging opportunity; Precrime treats it as a system error. This scene illuminates the danger of single-point failure in governance: when the instrument is captive, the data cannot contradict the master.
  *   **The Eye-Transplant Escape:** Anderton replaces his eyes to evade the scanning network. This is a literal rejection of being scored. It underscores that governance by forecast requires total visibility. When the subject opts out of the data stream, the mechanism blinds itself.
  *   **The Confrontation:** Anderton stands over Leo Crow, gun in hand. He chooses not to shoot. This is the falsification event. It proves the forecast was not a deterministic fact but a probabilistic tendency that could be overridden by knowledge of the forecast itself. Precrime requires the future to be static to justify prison; Anderton proves it is dynamic.

  **Where the Reading Breaks**
  We must resist the temptation to view Precrime solely as a broken market. The Precogs are not traders; they are captive persons with no skin in the game. They do not profit from accuracy nor lose from error. This is not a market failure but a moral category error. Futarchy assumes willing participants optimizing for payoff; Precrime relies on exploited biology.

  Furthermore, the film's central objection is not epistemic but legitimizing. Even if the Precogs were 100% accurate, the film asks: is it legitimate to punish a act that was not committed? Futarchy optimizes for outcomes (no murders); it does not inherently protect liberties (due process). The film adds a dimension missing from Hanson's papers: the experience of being scored. Citizens in *Minority Report* live under a gaze that decides guilt before agency is exercised. The anxiety is not that the prediction is wrong, but that it renders human choice irrelevant.

  **Conclusion**
  *Minority Report* is not a warning about inaccurate predictions; it is a warning about institutions that require predictions to be accurate to survive. Futarchy offers a mechanism to separate values from beliefs, but it cannot solve the problem of values that require the illusion of determinism. The film suggests that when governance relies on forecasting human behavior, the greatest risk is not that the model fails, but that it succeeds by stripping citizens of the capacity to prove it wrong. The "minority report" is not just a data discrepancy; it is the sound of human contingency refusing to be scored.
