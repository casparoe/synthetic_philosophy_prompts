      *   **Verbal vs. Substantive:** Partly verbal. If "subject" means "moral agent," B wins (one). If "subject" means "phenomenal field," A wins (two). If "subject" is a vague natural kind, the answer is indeterminate.

  5.  **Refine the Output (checking constraints):**
