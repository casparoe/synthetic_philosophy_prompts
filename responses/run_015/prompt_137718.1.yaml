          *   *Point 2:* Hysteresis undermines counting at a specific time.
          *   *Point 3:* Subject count must do moral/practical work (agency, interests). Split patient is one person practically.

  3.  **Evaluate Each Move (Drafting Verdicts):**

      *   **Move 1 (A):** Strong intuition pump about unity of consciousness. Weakness: Assumes behavioral disconnection *entails* phenomenal disconnection without ruling out subpersonal processing. *Verdict: Half Right.* (Strong on the definition of unity, weak on the inference from behavior to phenomenology).
      *   **Move 2 (B):** Strong distinction between access and phenomenology. Weakness: Blindsight/subliminal primes are usually simpler tasks than the complex intermanual conflict A mentions later. *Verdict: Half Right.* (Strong on the logical gap, weak on the empirical fit for complex actions).
