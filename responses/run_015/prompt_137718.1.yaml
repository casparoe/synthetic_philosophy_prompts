          *   *Point 3:* First-person report is biased (only one side speaks); the other side might agree they are separate.
      *   **Move 4 (B closes part 1 - Control & Thought Experiment):** Argument from hemispherectomy and continuity.
          *   *Point 1 (Control):* Hemispherectomy (removing half) leaves one subject. So tissue count $\neq$ subject count.
