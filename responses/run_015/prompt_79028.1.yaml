answer: |-
  # Prep Sheet: Decision Theory Reading Group Q&A

  **Thesis Summary:** Superrationality isn't about "identity"; it's about independent draws from a shared prior over decision procedures. Cooperation is EV-maximizing via conditional probability. The heavy lifting is done by the *shared prior*.

  **Strategy:** Concede immediately that the "shared prior" is the controversial axiom. Do not try to prove it from scratch; argue it is no more controversial than the common priors assumed in standard Bayesian game theory. Your goal is to show this formulation is *cleaner* than "logical identity," not that it proves cooperation from nothing.

  ---

  ### The Objections (Ordered by Damage Potential)

  #### 1. The Dominance Objection (Economist 1)
  **The Voice:** "You haven't changed the payoff matrix. Defecting is a strictly dominant strategy. If my payoff is higher when I defect regardless of what you do, no amount of prior-probability magic changes that. You're trying to dissolve dominance by fiat."
  **Your Reply (2 min):** "Dominance holds only if my action is probabilistically independent of yours. In standard Nash analysis, we assume $P(Your\_Move | My\_Move) = P(Your\_Move)$. My claim is that when we model agents as drawing from a shared prior over *procedures*, that independence assumption fails. If I decide to cooperate, it's evidence my procedure is 'Cooperate-type,' which raises the probability yours is too. I'm not changing the payoffs; I'm correcting the independence assumption implicit in the dominance argument."
  **Weakness:** This sounds like you're asserting correlation without a causal mechanism. If they press on *why* independence fails without causation, you risk sounding mystical.
  **Damage:** **High.** If you can't justify breaking independence, the math doesn't work.

  #### 2. The "It's Just EDT" Objection (CDT 1)
  **The Voice:** "You admitted it yourself: you're conditioning on your own action to predict the other player. That's Evidential Decision Theory. We rejected EDT thirty years ago because it allows you to 'manage the news.' You can't make them cooperate by conditioning on your cooperation. That's magic."
  **Your Reply (2 min):** "I am accepting the 'EDT' label but rejecting the 'magic' charge. Standard EDT conditions on actions directly. I'm conditioning on the *decision procedure* that generates the action. The correlation isn't between the physical moves; it's between the algorithms. If we both run 'Tit-for-Tat,' the correlation is structural, not causal. It's not that my move changes yours; it's that my move reveals which algorithm we're both running."
  **Weakness:** To a hardline CDTist, conditioning on *anything* that isn't a causal ancestor is a sin. They will argue the algorithm is fixed before you choose, so conditioning on the output is still "managing the news."
  **Damage:** **High.** If this sticks, you're just an EDT partisan, not someone solving the superrationality puzzle.
  **⚠️ FLAG:** This is the same objection as #5 (CDT 2), just phrased metaphysically vs. historically.

  #### 3. The Independence of Draws Objection (Economist 2)
  **The Voice:** "You said the procedures are drawn *independently* from the prior. If $P(Procedure\_Me)$ and $P(Procedure\_You)$ are independent draws, then mathematically, the actions must be independent. You can't have it both ways. Either the draws are independent (and you get Nash) or they are correlated (and you have a Correlated Equilibrium with a mediator)."
  **Your Reply (2 min):** "The *draws* are independent, but the *support* of the prior is constrained by rationality. If the prior assigns near-zero mass to 'irrational' procedures, and 'Defect-Always' is ruled out as irrational in this specific context by the prior's definition, then the effective sample space forces correlation. It's like drawing two numbers independently from a distribution that only contains even numbers; they will match in parity."
  **Weakness:** This pushes the problem back to defining the prior. If the prior allows Defect-Always, your argument fails. You are assuming the conclusion in the prior.
  **Damage:** **Medium-High.** Exposes the circularity risk in your "shared prior" justification.

  #### 4. The Unit of Agency Objection (Team Reasoner)
  **The Voice:** "You're still asking 'What should *I* do?' That's the error. In a PD, the relevant agent is the pair, not the individual. You're building a Rube Goldberg machine of priors to simulate what happens if you just change the unit of agency to 'We'."
  **Your Reply (2 min):** "I agree 'We' reasoning gets the right answer, but it lacks a micro-foundation. How does an individual mind access the 'We'? My model explains *how* an individual reasoner, stuck in their own head, can infer the 'We' via the shared prior. I'm not replacing team reasoning; I'm deriving it from individual rationality plus common structural constraints."
  **Weakness:** They will argue that deriving 'We' from 'I' is impossible without already assuming the 'We' in the prior.
  **Damage:** **Medium.** Philosophical disagreement, but doesn't break your math.

  #### 5. The "EDT Relabeling" Objection (CDT 2)
  **The Voice:** "This is just Jeffrey's EDT with extra steps. You haven't solved Newcomb's Problem; you've just renamed the box predictor 'shared prior.' If you can't defend EDT on Newcomb, you can't defend this on PD."
  **Your Reply (2 min):** "The difference is ontological. EDT treats the correlation as a brute fact. I'm grounding it in the similarity of computational processes. It's not that 'Smoking predicts Cancer'; it's that 'Running Algorithm A predicts Running Algorithm A.' It restricts the scope of EDT to cases where the correlation mechanism is computational similarity."
  **Weakness:** **⚠️ FLAG:** Same as #2. If you lose #2, you lose this too. It adds no new defense, just repeats the "algorithm" distinction.
  **Damage:** **Medium.** Redundant, but persistent.

  #### 6. The Self-Reference Objection (Logician)
  **The Voice:** "To condition on your own decision procedure, you must know it. To know it, you must simulate it. If the simulation includes the simulation, you have a halting problem. A finite agent cannot have perfect introspective access to its own source code."
  **Your Reply (2 min):** "I'm not claiming perfect introspection. I'm claiming access to the *design specs*, not the runtime trace. I know I was built to maximize expected utility. I don't need to simulate the output to know the function. The prior is over the design specs, which are static."
  **Weakness:** In a one-shot PD, the "design spec" *is* the output function. If you don't know the output, you don't know the spec. This is hand-wavy.
  **Damage:** **Medium.** Technical nuisance, but can be bracketed as an idealization.

  #### 7. The Introspection Cost Objection (Bounded Rationality)
  **The Voice:** "Even if you *could* know your algorithm, it's costly. Real agents use heuristics. Your model assumes agents with perfect knowledge of their own decision rules. That's not bounded rationality; that's hyper-rationality."
  **Your Reply (2 min):** "Granted, this is an idealized baseline. But bounded rationality needs a target to bound *towards*. If the normative theory says 'Cooperate,' then heuristics should approximate that. My model sets the target. Whether humans hit it is an empirical question; whether they *should* is the normative one."
  **Weakness:** If the idealization is impossible (see Logician), the target is incoherent.
  **Damage:** **Low.** Acceptable to concede idealization in a theory seminar.

  #### 8. The Repeated Game Smuggling Objection (Economist 3)
  **The Voice:** "This only works if you expect to meet similar agents again. You're smuggling in the 'shadow of the future' from repeated games and calling it a 'shared prior.' In a true one-shot, I never see you again. Why should I care about the prior?"
  **Your Reply (2 min):** "The shadow of the future is about *causal* retaliation. My prior is about *logical* correlation. Even if I never see you again, if I know you are 'like me,' my choice now is diagnostic of yours. It's not about future payoff; it's about current probability."
  **Weakness:** Economists hate "logical correlation" without causal stakes. They will view this as wishful thinking.
  **Damage:** **Low.** Misunderstanding of your view, but hard to correct in 2 minutes.

  ---

  ### Critical Concessions (First Minute)
  **Say this immediately:** "I want to concede upfront: the heavy lifting in this model is done by the **Shared Prior**. If you reject the idea that rational agents should model each other as drawing from a common distribution over decision procedures, the model collapses. I am not deriving cooperation from pure logic alone; I am deriving it from Logic + Common Structural Constraints. If you think that constraint is unjustified, my view fails."
  *Why:* This disarms the "You're assuming what you want to prove" charge before they launch it. It frames the debate on *justifying the prior*, which is where you want to be.

  ### The Kill Shot (Where You Lose the View)
  **The Exchange:** **Objection #3 (Independence of Draws).**
  If an Economist pins you down on the math—specifically, asking you to write down the joint probability distribution $P(f_1, f_2)$ and show how it factorizes if the draws are independent but the actions are correlated—you will lose if you cannot formally distinguish "independent draws from a constrained support" vs. "correlated draws."
  *Why:* If the math doesn't hold, the "EV-maximizing" claim is false. You become a philosopher waving hands at a equation.
  *Defense:* Be ready to write: $P(A_1, A_2) = \sum_{f} P(f) \cdot \mathbb{I}(f(s)=A_1) \cdot \mathbb{I}(f(s)=A_2)$. Show that the correlation comes from summing over the *same* $f$, not from correlating the draws.

  ### The Prayer Question (Hope They Don't Ask)
  **The Question:** "If the prior is objective, it's just physics/biology, and you've reduced decision theory to empirics. If the prior is subjective, why am I *rationally required* to share it with you? If I privately believe you are a defector, your model tells me to defect. So haven't you just reduced superrationality to 'Cooperate if you assume the other person cooperates'?"
  **Why it kills you:** It exposes that your "Shared Prior" is either a trivial empirical claim (we are similar) or a normative stipulation (you *ought* to assume we are similar). If it's the latter, you haven't solved the normative problem; you've just moved it.
  **Fallback Answer:** "It's a normative constraint on rationality, similar to Common Priors in Bayesian game theory. We don't say 'you ought to have the same prior' because of magic, but because divergent priors without evidence imply one agent is processing information incorrectly. Rationality constrains the prior space." (This is weak, but it's the only shield you have).

  ### Final Advice
  *   **Don't fight the CDTs on Newcomb.** If they drag you into Newcomb, you will bleed. Keep it focused on the PD structure and the definition of "independence."
  *   **Side with the Team Reasoner slightly.** Acknowledge that your model *aims* to capture their intuition formally. This splits the room and gives you an ally against the Economists.
  *   **Watch the Logician.** If they bring up Gödel or Halting, do not try to out-logic them. Concede the idealization and move to "approximate introspection."
