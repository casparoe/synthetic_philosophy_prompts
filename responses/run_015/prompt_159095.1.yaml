answer: |-
  Here are eight questions designed to probe the strengths and vulnerabilities of your guest's neo-Moorean position, complete with follow-ups keyed to her likely responses.

  **1. The Replacement Test vs. The Isolation Test**
  "Your book's most distinctive methodological innovation is the 'Replacement Test.' Moore asked us to imagine a thing in total isolation to judge its intrinsic value; you ask us to imagine swapping a specific friend for an agreeable substitute while holding our own mental states fixed. You argue this reveals the value of the *particularity* of the person. But if my mental states are held fixed—meaning I feel the same love, security, and joy—what exactly is the 'loss' we are detecting? Is it a metaphysical loss rather than a phenomenological one?"

  *   **Follow-up (If she says the loss is real but non-experiential):** "If the loss is undetectable from the inside of the experience, doesn't that render the value inert? If the 'good' of the friendship doesn't cash out in how the world feels or functions for the participants, are we really talking about *value*, or just a metaphysical preference for numerical identity?"

  **2. Unobserved Beauty and Experientialism**
  "You maintain that a beautiful object nobody ever sees adds almost nothing to the world's value. This seems to diverge from Moore, who thought the beauty itself held value even unobserved. By tethering the value so closely to the *enjoyment* of the beauty, aren't you quietly becoming a pure experientialist? And if so, why keep 'Beauty' on the list of intrinsic goods at all, rather than just 'The Experience of Appreciation'?"

  *   **Follow-up (If she insists the object's properties matter, not just the experience):** "But if the experience is the necessary vehicle for the value, doesn't the object's contribution become merely instrumental? I'm struggling to see how the beauty is *intrinsic* if it remains valueless without a witness. Is this distinction doing any work, or is it just a terminological shield?"

  **3. Scope and Social Bias**
  "Your list of intrinsic goods is remarkably narrow: enjoyment of beauty and personal affection. Many people have strong intuitions that parenting, intellectual achievement, or religious devotion are goods in themselves. When you apply the Replacement Test to a parent-child bond, it seems to pass. What stops your method from being a blank cheque for whatever goods a specific cultural or socioeconomic class finds tasteful? How do you filter out 'bourgeois intuition' from 'moral truth'?"

  *   **Follow-up (If she argues those other goods are instrumental or reducible to affection):** "That seems like a theoretical sleight of hand. If a religious devotee feels their devotion is intrinsically valuable, and it passes the Replacement Test for them, dismissing it as 'merely instrumental' looks like you're rigging the taxonomy to fit Moore's original list. At what point does protecting the list become more important than following the method?"

  **4. Organic Unity and the Value of Evil**
  "I want to turn the organic-unity machinery loose on evil. Moore struggled with whether the *consciousness of pain* could be part of a valuable whole (like in tragedy or justice). Consider a friendship that involves a deep betrayal followed by painful reconciliation. Could that organic whole be *more* valuable than an equally close friendship that never faced betrayal? Does the surplus value generated by the reconciliation outweigh the disvalue of the betrayal?"

  *   **Follow-up (If she bites the bullet and says yes, the troubled friendship is more valuable):** "That's a hard bullet to bite. It implies that a world with more betrayal and reconciliation is *better* than a world with steady loyalty. Are you willing to accept that implication? Or does this suggest that organic unity is a dangerous principle that can too easily aestheticize suffering?"

  **5. The 'No Owner' Problem**
  "Let's talk about the metaphysics of the surplus. If the value of the friendship-whole isn't just the sum of the friends' experiences, that surplus value isn't experienced by either friend. So, who is it good *for*? If the answer is 'no one,' and value needn't be value-for anyone, what practical work is the word 'good' still doing? Why should we care about promoting a value that doesn't benefit any subject?"

  *   **Follow-up (If she says objective value demands recognition regardless of beneficiaries):** "If it doesn't benefit a subject, 'demanding recognition' sounds like a ghostly imperative. If I can choose between Action A (creates objective surplus value but helps no one) and Action B (creates less surplus but alleviates suffering), and you tell me I ought to choose A, haven't you severed the link between morality and welfare entirely?"

  **6. Conflicting Goods**
  "You posit two intrinsic goods: beauty and affection. But these often conflict. The intense contemplation of beauty often requires isolation; deep personal affection requires availability and time. When these goods clash, how do we adjudicate? Does your intuitionism offer a hierarchy, or are we left with tragic choices where reason cannot guide us? If it's the latter, how is this different from arbitrariness?"

  *   **Follow-up (If she says intuition guides us in the particular case):** "So there is no principled way to resolve the conflict, only a case-by-case feeling. This makes your axiology difficult to use as a guide for living. If two people have conflicting intuitions about whether to stay with a sick relative (affection) or finish a symphony (beauty), your system offers no court of appeal. Is that a feature or a bug?"

  **7. The Reliability of Intuition (The Blocker)**
  "I want to press on your epistemological foundation. You rely heavily on intuition to validate these goods. But we know from psychology and history that intuitions about 'taste' and 'proper relationships' are heavily shaped by evolutionary pressures and cultural conditioning. If our intuition-faculty was designed for survival and social cohesion, not for detecting Platonic value, why should we trust it when it tells us that 'Victorian friendship' is good but 'modern casual connection' is not? What independent check do you have?"

  *   **Follow-up (If she attempts to retreat to 'reflected intuition'):** "But reflection is just more thinking using the same brain with the same evolutionary history. If you can't point to an external calibration for these intuitions, you're essentially asking us to trust a compass that we know is magnetically biased. At this point, isn't 'trust your intuition' just a way to immunize the theory from critique?"

  **8. Falsification**
  "Finally, let's talk about evidence. Intuition-based systems are notoriously hard to falsify because proponents can always claim the critic's intuition is 'unrefined.' So, put it to me plainly: What would actually count as evidence *against* your view? Is there a specific scenario, or a type of argument, that would force you to abandon the organic-unity framework or remove one of your two intrinsic goods?"

  *   **Follow-up (If she says 'abhorrent practical conclusions'):** "Could you give me one concrete example? If your theory implied that we should sacrifice a generation of children to preserve a great work of art—a classic objection to objective beauty theories—would you abandon the theory, or would you say our intuition about the children is the thing that's wrong? I need to know where the line is."
