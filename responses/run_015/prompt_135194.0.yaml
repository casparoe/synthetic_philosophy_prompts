prompt: |-
  I'm trying to sort out what I actually think about grounding and fundementality, going by gut reactions to specific cases. So: the fact that there's a table is grounded in the particles arranged table-wise, not the other way around — that feels right. The fact that I'm in pain is grounded in some brain state, and my belief that I'm hurt is also grounded downward in that state, not running parallel. Then there's a holograph of a tree projected onto mist — I think their's no tree-fact there, just light-facts and mist-facts. But now take a meeting: the fact that we're in a meeting seems grounded in our mental states plus the room, yet I also feel there's an extra social layer that isn't just summed up — like, once enough people intend it, something genuinely new is present. And here's the one I keep going back and forth on: suppose there's a fundamental law that all green things are heavy, and something is green because of its surface chemistry. Is its heaviness grounded in its greenness, or are both grounded separately in the chemistry? I think separately, but then why does the law feel like it's doing some grounding work?

  I also made up this notion I'm calling 'shadow-dependence': when an object's shadow changes shape, is the shadow-shape grounded in the object, in the light-source position, or both? I lean toward both, which means grounding can be overdetermined. But if I allow that, doesn't it clash with my holograph verdict, where I refused to let there be a tree-fact even though both projector and mist are present?

  Is there one principel that captures all these? Maybe grounding tracks explanatory relevance at the fundamental level? But the meeting case breaks that, since intentions aren't causal in the same physical sense. Or do I need pluralism — one kind for physical stuff, one for social, one for law-mediated?

  Please tell me what principle gets most of my verdicts, which ones I'd have to drop to keep it simple, and what it says about shadow-dependence and the green/heavy law case. Also be honest about whether my holograph and meeting intuitions are just incompatible.
