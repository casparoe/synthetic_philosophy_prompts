      *   **Truthmaker Theory (The User's "Ground"):** A proposition is true only if there is something in reality that makes it true. Future contingents lack this "something."
      *   **Presentism:** Only present things exist. If the future doesn't exist, there are no future facts. This aligns perfectly with the lack of truthmakers.
