      *   The user is pointing out the *ontological commitment* required to make that logic work.
      *   **Key Insight:** Yes, Aristotle's view is widely interpreted as committing him to a form of Presentism or at least an "Open Future" ontology where future facts do not exist yet.
      *   **The "Past Tense" Problem:** The user asks about retroactive truth. If $P$ ("Battle tomorrow") is neither true nor false at $t_1$, and at $t_2$ (after no battle) we say "It was false at $t_1$ that there would be a battle," do we contradict the original claim? Or do we say "It is now true that it was indeterminate"?

