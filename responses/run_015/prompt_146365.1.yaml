answer: |-
  You have hit the nail on the head. In fact, you have identified the exact pressure point where analytic logic meets continental metaphysics in Aristotle's *De Interpretatione* (Chapter 9).

  The standard introductory logic take is often sanitized: "Aristotle invents three-valued logic to save free will." But as you suspect, you cannot make that logical move without paying an ontological bill.

  Here is the breakdown of why your intuition is correct, how the "past tense" problem works in an Aristotelian framework, and the verdict on whether bivalence and presentism stand or fall together.

  ### 1. Truth Requires a "Maker" (The Grounding Point)
  You are right that Aristotle operates with a robust **correspondence theory of truth**. For a statement to be true, there must be a *pragma* (a fact/state of affairs) that corresponds to it.

  *   **Past/Present:** "The cat is on the mat." We look at the mat. If the cat is there, the fact exists, the statement is true.
  *   **Future Contingent:** "There will be a sea battle tomorrow." We look at the future. What is there?

  If you are an **Eternalist** (Block Universe), the future slice of time exists right now, just "over there." The battle either exists in that slice or it doesn't. Therefore, the statement is already true or false. Bivalence holds, but determinism (or fatalism) looms.

  If you are a **Presentist** (only the present exists), the future slice *does not exist*. There is no fact of the matter "out there" to ground the truth of the proposition. Therefore, the proposition lacks a truth value.

  So, your first insight is correct: **The rejection of bivalence for future contingents is not merely a logical trick; it is an ontological claim about the non-existence of future facts.**

  ### 2. The Retrospection Problem (Your Paradox)
  Your specific worry is this: *If there was no fact grounding the falsity yesterday, how can we say today that "It was false that there would be a battle"?*

  This is known as the problem of **retroactive truth**.

  If Aristotle says, "At $t_1$, 'Battle at $t_2$' is neither true nor false," but then at $t_3$ (after no battle) we say, "It is true that 'Battle at $t_2$' was false," we seem to contradict ourselves. We are assigning a truth value to $t_1$ from the vantage point of $t_3$ that didn't exist at $t_1$.

  **The Aristotelian Solution:**
  Aristotle would distinguish between two claims:
  1.  **Claim A:** "At $t_1$, it was *false* that there would be a battle."
  2.  **Claim B:** "At $t_1$, it was *contingent* (indeterminate) that there would be a battle."

  For Aristotle, **Claim A is incorrect.** Even after the battle fails to happen, it remains the case that at $t_1$, the future was open. To say it was *false* back then implies the outcome was already fixed (just negatively), which reintroduces fatalism.

  Instead, Aristotle must accept **Claim B**. At $t_3$, we report: "It is now settled that the potentiality existing at $t_1$ was not actualized."

  **Does this make past reports groundless?**
  No, but it changes what they report.
  *   A report about a *past event* ("The battle happened") is grounded by the past fact.
  *   A report about a *past future-contingent* ("It was going to happen") is grounded by the **past potentiality**.

  For Aristotle, potentiality (*dynamis*) is a real feature of reality. A seed has the potential to be a tree. If the seed is crushed, it doesn't become a tree. Was it "true" it would be a tree? No. Was it "false"? No. It was *potential*. When we look back, we aren't finding a truth value that was hiding; we are observing which branch of the potentiality was pruned.

  ### 3. Do They Stand or Fall Together?
  **Yes.** The rejection of bivalence for future contingents and Presentism (or at least the "Open Future" view) are mutually reinforcing.

  *   **If you accept Eternalism:** You almost certainly must accept Bivalence. If the future exists, propositions about it have truth conditions. (Some try to argue for "Epistemic Openness" within Eternalism, but it's metaphysically messy).
  *   **If you accept Bivalence:** You are pushed toward Eternalism or Theological Omniscience (where God's knowledge grounds the truth).
  *   **If you reject Bivalence:** You require an ontology where the future is not real. This is Presentism or the "Growing Block" theory (where past and present exist, but future does not).

  **The "Smuggling" of Presentism:**
  You asked if this "smuggles in presentism." It's not really smuggling; it's the engine. Aristotle's physics is built on *change* and *potentiality*. A Block Universe eliminates real change (everything just *is*). So, Aristotle's logic in *De Interpretatione* 9 is consistent with his physics in the *Metaphysics* and *Physics*. He isn't smuggling Presentism in to save logic; his logic reflects his Presentist-leaning ontology.

  ### 4. Where Modern Philosophy Gets Stuck
  The reason people miss the metaphysical layer is that 20th-century logic (like Lukasiewicz's 3-valued logic) tried to formalize Aristotle's insight without accepting his ontology.

  They created a logical system where $P$ can be $0, 1,$ or $1/2$. But they often treated this as a semantic rule rather than a metaphysical constraint. This leads to the exact confusion you identified: *Why* is it $1/2$?
  *   **Semantic view:** We just don't know yet. (This fails to block determinism; the fact might still be fixed).
  *   **Ontological view (Your view):** There is nothing to know yet. (This blocks determinism but requires Presentism).

  ### Summary
  You are not mixing logic and ontology; you are correctly identifying that **Aristotle's logic is grounded in his ontology.**

  1.  **Truth needs a ground:** Future contingents lack a ground because the future does not exist.
  2.  **Retrospection:** We do not say the past statement was "false"; we say it was "contingent and unactualized." The ground for our current report is the *history of potentialities*, not a static fact.
  3.  **Interdependence:** You cannot consistently hold the "Open Future" logic without an "Open Future" ontology (Presentism/Growing Block). If the future exists (Eternalism), the battle is already there, and the statement is already true or false.

  Your reading is more faithful to the text than the standard logic-textbook summary. Aristotle isn't just playing with truth tables; he is defending a universe where time is real, change is real, and the future is genuinely unwritten.
