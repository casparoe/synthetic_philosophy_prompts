          *   This creates a tension: Does the truth value change retroactively? Or do we change the *description* of the past status?
          *   Standard Aristotelian solution: The *fact* changes (the potentiality is lost), so the assessment changes. But strictly, at $t_1$, there was no fact of the matter.

