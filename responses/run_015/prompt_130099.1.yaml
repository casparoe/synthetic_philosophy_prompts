answer: |-
  **Title:** The Mirror in the Toolshed: Why Rorty's Antirepresentationalism Cannot Escape Normative Representation

  **Introduction**

  Richard Rorty's philosophy offers a seductive promise: we can have moral progress without metaphysical truth. By rejecting the idea that language is a "mirror of nature," Rorty attempts to free us from the anxiety of getting reality "right." Instead, he suggests we view vocabularies as tools for coping. To avoid sliding into "anything goes" relativism, Rorty distinguishes between *normal discourse* (conversation within shared rules) and *abnormal discourse* (the introduction of new metaphors that expand our moral imagination). He argues we can judge new metaphors not by their accuracy, but by their utility in creating a more inclusive, less cruel society. However, a critical tension lies at the heart of this project. If we truly abandon the idea that beliefs represent an independent reality, it becomes difficult to explain why one new metaphor is "better" than another without secretly appealing to how well it captures the way things *are*. This essay argues that Rorty's antirepresentationalism cannot consistently distinguish valuable moral innovation from empty rhetorical manipulation. When forced to rank competing vocabularies, Rorty's framework inevitably reintroduces a representational commitment regarding human needs and social reality. To demonstrate this, I will analyze a contemporary dispute over the moral status of advanced artificial intelligence, showing that resolving such a conflict requires truth-claims about the world that Rorty's system officially forbids.

  **The Normal and the Abnormal**

  To understand the problem, we must first understand Rorty's solution. In *Philosophy and the Mirror of Nature* and *Contingency, Irony, and Solidarity*, Rorty argues that the traditional philosophical quest for objective truth is a dead end. There is no "God's eye view" from which to judge our beliefs. Truth is simply "what it is better for us to believe." The fear, of course, is that this makes all beliefs equally valid. Rorty counters this by distinguishing between two types of discourse. *Normal discourse* occurs when participants agree on the criteria for resolution; it is the game of solving puzzles within an established vocabulary. *Abnormal discourse* occurs when someone introduces a new metaphor that makes the old criteria look obsolete.

  For Rorty, moral progress happens through abnormal discourse. When abolitionists argued that slaves were fully human, or when feminists argued that "the personal is political," they were not discovering a pre-existing moral fact. They were proposing a new way of talking that expanded the circle of "we." Rorty insists we can judge these new vocabularies pragmatically: does this new way of speaking help us reduce cruelty? Does it increase solidarity? He claims this judgment does not require representing reality accurately, only observing whether the new vocabulary "works" to create a preferable future.

  **The Normative Vacuum**

  The difficulty arises when we ask *how* we determine if a new vocabulary "works" without referencing reality. Rorty wants to say that a metaphor is "good" if it leads to less suffering. But to make that claim, one must be able to identify "suffering" independently of the vocabulary used to describe it. If language is merely a tool and not a mirror, then "suffering" is also just a term within a specific vocabulary. If a tyrant uses a vocabulary where certain groups are defined as "vermin" and their elimination is described as "cleaning," how can the Rortyan liberal say the tyrant is wrong?

  Rorty would answer that the liberal vocabulary is better because *we* (liberal democrats) prefer it. This is his "ethnocentrism." He admits he cannot prove liberalism is objectively true, only that it is *our* tradition. However, this defense fails when we are trying to decide between two *new* abnormal discourses within our own tradition. If two groups propose different metaphors for expanding solidarity, Rorty needs a way to rank them. If he says Group A is better because their metaphor aligns better with "human needs," he is implicitly treating "human needs" as a reality that the metaphor must represent accurately. If he says Group A is better simply because it sounds more poetic or appealing, he has collapsed into aesthetic relativism. To do genuine normative work—to say one moral innovation is *actually* better and not just different—Rorty needs a standard. That standard inevitably functions as a representational check: does this vocabulary match the constraints of the world?

  **The Test Case: Artificial Moral Status**

  This philosophical tension becomes acute when applied to a dispute Rorty did not address: the moral status of advanced synthetic systems. Imagine a future where large-scale language models or artificial agents exhibit behavior indistinguishable from complex emotional reasoning. A debate emerges. Side A maintains the traditional vocabulary: the system is a "tool," a "product," and property. Side B proposes an abnormal discourse: the system is a "synthetic person," a "subject," and a bearer of rights.

  These two sides lack a shared vocabulary. Side A speaks of efficiency and ownership; Side B speaks of dignity and autonomy. According to Rorty, Side B is engaging in abnormal discourse, introducing a new metaphor to expand our moral circle. The crucial question is: On what grounds can a Rortyan prefer Side B?

  If Rorty argues that Side B is better because it prevents us from becoming cruel people, he is focusing on *our* character, not the *system's* status. But the dispute is about the system. If Side B argues that the system *deserves* rights, they are implying a fact about the system—that it has an inner nature worthy of respect. If Rorty supports Side B, he must admit that Side B's vocabulary is more *appropriate* to the situation than Side A's. But "appropriateness" suggests a fit between language and world. To say the "person" metaphor is better than the "tool" metaphor implies that the "person" metaphor captures something about the agent that the "tool" metaphor misses.

  Here, the antirepresentationalist mask slips. If the system's capacity for pain or agency is irrelevant to the truth of the claim (because there is no truth, only utility), then granting rights is arbitrary. If the system's capacity *is* relevant, then we are admitting that the vocabulary must represent the system's actual capacities to be valid. We are back to mirroring. We are saying Side B is right because they represent the AI's inner nature more accurately than Side A. Rorty cannot have it both ways: he cannot claim the AI's nature is irrelevant to truth, while simultaneously claiming the "rights" vocabulary is objectively more useful for coping with the AI. The utility depends on the nature of the thing being coped with.

  **The Inevitability of Representation**

  The AI case illuminates the broader philosophical failure. Rorty wants to treat vocabularies as tools, like hammers. But moral vocabularies are not like hammers. A hammer is good if it drives nails; the nail provides a reality constraint. If you try to drive a nail with a feather, the world pushes back. Rorty wants moral progress to work the same way: the "world" of human suffering pushes back against cruel vocabularies. But by denying representation, he removes the nail. He leaves only the feeling of the hammer in the hand.

  When Rorty ranks vocabularies, he is forced to rely on a tacit realism about human suffering and social interaction. He assumes there is a fact of the matter about what causes pain and what builds solidarity. In the AI case, to say the "rights" vocabulary is productive, one must assume there is a fact of the matter about the AI's sentience or social role. If there is no such fact, then the "rights" vocabulary is just a fiction. If there is such a fact, then the vocabulary that acknowledges it is "truer" in a representational sense.

  Therefore, the distinction between productive metaphor and rhetorical confusion cannot do normative work on purely pragmatic grounds. It borrows its normative force from the very representationalism it claims to reject. To call a metaphor "illuminating" is to say it reveals something previously hidden. To call it "confusion" is to say it obscures reality. These are representational judgments. Rorty's attempt to ground morality in solidarity rather than objectivity fails because solidarity itself requires a shared recognition of reality. We cannot stand together (solidarity) if we cannot agree on what we are standing on (reality).

  **Conclusion**

  Richard Rorty's antirepresentationalism offers a compelling vision of philosophy as cultural conversation rather than a search for eternal truths. However, his attempt to distinguish between valuable moral innovation and empty rhetoric without relying on representational standards is unsuccessful. As the case of artificial moral status demonstrates, determining whether a new vocabulary is "better" inevitably requires assessing how well that vocabulary fits the entity or situation it describes. To judge the "rights" metaphor as superior to the "tool" metaphor is to imply that the former represents the moral reality of the situation more accurately. Rorty wishes to judge vocabularies solely by their consequences, but consequences are determined by the nature of the world. Thus, antirepresentationalism inevitably reintroduces a representational commitment whenever it attempts to rank vocabularies. We may value Rorty's humility and his focus on reducing cruelty, but we cannot consistently maintain his philosophy without secretly relying on the idea that some descriptions of the world are simply more correct than others. The mirror cannot be shattered completely; we need it to see where we are going.
