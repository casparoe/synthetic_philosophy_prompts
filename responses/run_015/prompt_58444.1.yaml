answer: |-
  First off, good on you for asking this. The fact that you're pausing to wonder if you're crossing a line shows you have a conscience, which is actually the most important trait for a Student Council President.

  Your sister isn't trying to sabotage you; she's looking out for your reputation. Here is the hard truth: **Yes, these tactics are shady.** They might work in the short term, but they carry a huge risk of blowing up in your face, especially with voting only days away.

  Here is a breakdown of why each tactic is risky and what you should do instead before Friday.

  ### 1. The Fear-Mongering Story ("If he wins, no off-campus lunch")
  *   **The Issue:** You are stating speculation as fact. You admitted you *don't know* if he wants that. If he finds out (and he will), he can easily call you out by saying, "I never said that."
  *   **The Risk:** If you get caught lying about his platform, you look untrustworthy. People will wonder, "If she lied about him, what will she lie about regarding the budget or prom?"
  *   **The Fix:** **Delete or archive that story.** Pivot to *your* plan. Instead of "He will take away lunch," say "I am fighting to KEEP off-campus lunch." It makes the same point without attacking him directly.

  ### 2. The DMs to Freshmen ("I remember you from orientation")
  *   **The Issue:** This is insincere. It's a "copy-paste" lie to make them feel special. High schoolers have a radar for fakeness.
  *   **The Risk:** Freshmen talk. If two of them compare DMs and realize you said the exact same thing to both of them, you look manipulative. It undermines the "nice person" vibe you're trying to project.
  *   **The Fix:** **Stop lying about remembering them.** You can still DM them! Just say, "Hey, I'm running for Pres and I'd love a freshman's perspective on what you want to see this year." That makes them feel valued *without* lying.

  ### 3. The Biased Poll Screenshot ("Winning 70-30")
  *   **The Issue:** This is misleading data. Presenting a poll of just your friends as "the school's opinion" is deceptive.
  *   **The Risk:** This is the easiest one to debunk. If someone asks, "Who did you poll?" and you have to admit it was just your circle, you look desperate. It creates a false sense of momentum that can backfire if people feel tricked.
  *   **The Fix:** **Take it down.** Don't risk it. If you want to show momentum, post a testimonial like, "So many people are telling me they want cheaper prom tickets!" That's anecdotal, but it's not fake data.

  ### The Big Picture: Trust vs. Winning
  You said, *"I actually think I'd be way better... does that make it okay?"*

  **No.** Having good ideas (vending machines, cheaper prom) is your strongest asset. You don't need to trick people to vote for you if your ideas are actually what the school wants.

  Student Council is built on **trust**. If you win using manipulation, you start your term with a secret hanging over your head. If people find out later (and rumors travel fast in high school), you lose all credibility. You can't lead if no one trusts you.

  ### Your Game Plan for the Rest of the Week
  You have a few days left. You can still win, but you need to pivot to **Positive Campaigning.**

  1.  **Lean into your platform:** You want vending machines and cheaper prom? That is *way* more exciting than "longer study hall." Make posters/stories specifically about those wins. "Vote for [Your Name] for Cheaper Prom."
  2.  **Be the bigger person:** Since you're a Junior running against a Senior, use that. Frame yourself as the candidate who represents the *whole* school, not just a friend group. Don't attack him; just outshine him.
  3.  **Authentic Connection:** When you talk to people, be real. "I know I'm a Junior, but I'm listening to everyone." That honesty is refreshing.

  **Bottom line:** Your sister is right. You don't need to be shady to win. You have better ideas than him—let those ideas do the talking. If you win honestly, you can walk into the role with your head high. If you win by tricking people, you're starting with a deficit.

  Good luck. You got this.
