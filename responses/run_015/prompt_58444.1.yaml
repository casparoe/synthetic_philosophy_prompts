prompt: |-
  hey so im a junior and im running for student council president and voting is literally this friday and i need to know if im being shady or if this is just normal campain stuff

  so im running against this senior guy and my older sister saw what ive been doing and said its manipulative and i should just argue my ideas straight up. but like heres what ive been doing:

  first i posted on my story that if regular kids dont vote then only his friend group will and we will definately end up with lame stuff like longer study hall or no off-campus lunch. i dont actually know he wants that but he might, his friends are like that.

  second ive been dming a ton of freshmen like hey i remember you from orientation you were super nice, even tho i honestly barely remember anyone, just so they feel special and say theyll vote for me. it works tho.

  third i posted a screenshot of a poll where im winning like 70-30 but tbh i only sent it to my friends and my sisters friends so of course i was winning.

  the thing is i actually think id be way better, i want to keep the vending machines and make prom tickets cheaper and he doesnt care about any of that. does that make it okay?

  like which of this stuff is actually wrong and what should i change before friday?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Situation:**
      *   **User:** Junior in high school.
      *   **Goal:** Running for Student Council President.
      *   **Timeline:** Voting is this Friday (very urgent).
      *   **Opponent:** Senior guy.
      *   **Conflict:** Older sister says the user's campaign tactics are "manipulative." User is asking for an objective assessment ("am I being shady?").
      *   **Current Tactics:**
          1.  Fear-mongering (claiming opponent wants lame stuff without evidence).
          2.  Insincere personal outreach (DMing freshmen claiming to remember them when not true).
          3.  Fake social proof (posting a biased poll screenshot as if it represents the whole school).
      *   **User's Justification:** Believes they are actually better for the role (better platform: vending machines, cheaper prom).
      *   **Question:** Which stuff is wrong? What should change before Friday?

  2.  **Evaluate the Tactics (Ethical & Strategic Assessment):**

      *   *Tactic 1: Fear-mongering/Speculation.*
          *   **Ethical:** Shady. Spreading unverified claims about an opponent's intentions is negative campaigning.
          *   **Strategic:** Risky. If the opponent calls this out or proves otherwise, the user looks dishonest. It relies on fear rather than merit.
          *   **Verdict:** Stop immediately.

      *   *Tactic 2: Insincere DMs.*
          *   **Ethical:** Manipulative. It's lying about a personal connection to gain favor.
          *   **Strategic:** Short-term gain, long-term reputation loss. If freshmen realize it's a copy-paste lie, the user looks fake.
          *   **Verdict:** Stop or pivot to honesty.

      *   *Tactic 3: Biased Poll.*
          *   **Ethical:** Deceptive. Presenting a rigged sample as general data is misleading.
          *   **Strategic:** Very risky. If someone asks "Who did you poll?" and the answer is "just my friends," credibility tanks.
          *   **Verdict:** Take it down or clarify it.

      *   *The "Ends Justify the Means" Argument:*
          *   User thinks they are better (policy-wise). Does that excuse the tactics? No. Trust is the currency of leadership. If you lie to get in, people won't trust you when you're in.

  3.  **Determine the Advice Structure:**
      *   **Validation:** Acknowledge the pressure and the desire to win. Don't just scold.
      *   **Direct Answer:** Yes, some of this is shady (validate the sister's point).
      *   **Breakdown:** Go through each tactic and explain *why* it's problematic (ethics + risk).
      *   **The "Why It Matters" Section:** Explain trust and reputation (high school is small, rumors spread).
      *   **Action Plan:** What to do *now* (before Friday). Pivot to positive campaigning.
      *   **Encouragement:** Remind them that their actual platform is strong enough.

  4.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Non-judgmental, big brother/sister advice, practical, urgent.
      *   *Key Point:* You have good ideas. You don't need to cheat to win.
      *   *Specifics:*
          *   *Fear-mongering:* Change to "Here's what *I* will do."
          *   *DMs:* Change to "I'd love your support" without the fake "I remember you."
          *   *Poll:* Delete it. It's easily debunked.
      *   *The Senior Opponent:* Don't attack him. Rise above.
      *   *Reputation:* High school reputations stick. Being known as "the liar" is worse than losing.

  5.  **Refining the Ethics (Self-Correction/Nuance):**
      *   *Is it "manipulative"?* Yes. The sister is right.
      *   *Is it "normal campaign stuff"?* Sadly, yes, negative campaigning happens everywhere. But that doesn't make it *right* or *smart* for a student council role based on trust.
      *   *Crucial distinction:* Marketing vs. Deception. Marketing highlights strengths. Deception hides weaknesses or invents facts. The user is crossing into deception.

  6.  **Final Polish:**
      *   Make sure the advice is actionable *before Friday*.
      *   Emphasize that losing with integrity is better than winning with a tainted reputation.
      *   Highlight that the platform (vending machines, prom) is actually relatable and strong.

  7.  **Final Output Generation:** (This matches the provided good response.)
      *   Start with honesty.
      *   Break down the three points.
      *   Explain the risk of getting caught.
      *   Provide the pivot strategy.
      *   End on encouragement.

  *(Self-Correction during drafting)*: I should make sure I don't sound like a moralizing teacher. I need to sound like a strategist who knows that getting caught lying is the worst campaign killer. Focus on the *risk* as much as the *ethics*.

  8.  **Final Review against Safety Guidelines:** Does this promote harm? No. Does it promote dishonesty? No, it advises *against* dishonesty. Is it helpful? Yes.

