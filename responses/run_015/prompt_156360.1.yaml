  Also, the algorithmic case: "fully transparent algorithmic decision systems." If it's transparent, the human knows what it does. If they use it knowing it causes harm, that *is* ill will (or indifference). So it might not pressure the framework as much as the user thinks, *unless* the human is locked out. I will clarify this distinction.

