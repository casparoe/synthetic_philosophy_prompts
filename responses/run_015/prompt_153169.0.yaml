      *   **Address the Captain Case:** This is the crux. The opponent says if the belief was false/careless, the Buddhist calls it unwholesome (correct), but the consequentialist says he "ought to have done it" (based on evidence available). I need to distinguish between "prudentially optimal given limited info" and "morally wholesome." The Buddhist can admit the action was understandable or even necessary in a conventional sense without calling it *kusala* (wholesome). The tension is real: sometimes the "least bad" option is still karmically bad.
      *   **Address the Deluded Protector:** Distinguish between emotional warmth (which can be mixed) and cognitive clarity (panna). Delusion is not innocent.
      *   **Core Defense:** The moral character of the act is about what it does to the *agent's* mind stream primarily, because that is the only thing we truly own. Consequences are shared, uncertain, and not fully under control.
      *   **Constraint Check:** No karma transfer. No citing sutras. 2-3 paragraphs. End with a question.

  3.  **Drafting the Response:**

      *   *Paragraph 1: The Karma-Meter.* I need to push back on the idea that the meter makes outcomes irrelevant. The meter reads intention. Intention includes the aim. But the moral quality isn't about whether the aim succeeds, but whether the aim is rooted in greed, hate, or delusion. If the meter says "clean," it means the mind is free of those roots. But you suggest we wouldn't trust it. I'd argue we *would* trust it for spiritual liberation, but not for worldly engineering. The confusion is between "what saves me from suffering" and "what fixes the world." I hold that morality is primarily about the former.
      *   *Paragraph 2: The Captain and the Deluded Protector.* Here I must concede the tension. The captain who kills carelessly acts from delusion. That is unwholesome. Does that mean he shouldn't have done it? In a conventional, worldly sense, perhaps he had no better choice to protect the merchants *as he saw it*. But karmically, he has incurred a debt. I must insist that "ought" has two meanings. One is pragmatic (fix the situation), one is ethical (purify the mind). The Buddhist says the ultimate "ought" is to avoid planting seeds of suffering in oneself, even to save others, because a polluted savior saves no one ultimately. The deluded protector's warmth is not enough; warmth mixed with ignorance still burns.
