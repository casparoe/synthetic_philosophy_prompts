      *Drafting Paragraph 3:* So I do not deny that we must look at the world. But I deny that the world's response settles the moral character of the act. If I give you food intending to nourish you, but you choke and die, the consequence is tragic, but my act was not murder. If I give you poison intending to kill you, but you survive, the consequence is benign, but the act was still murderous. The karma-meter would catch the intention in both cases. You argue that the outcome ledger guides what to do. I argue that the outcome ledger guides what to *attempt*, but the intention ledger guides what to *be*. If we prioritize the outcome over the root, we justify poisoning the well so long as the village drinks safely today. Where does your consequentialism stop me from planting a seed of hatred if the fruit looks sweet enough?

