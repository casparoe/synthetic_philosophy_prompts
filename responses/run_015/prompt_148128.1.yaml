answer: |-
  **The Allais Pairs**

  Pair 1: Option A offers $1,000,000 with certainty. Option B offers a 0.89 chance of $1,000,000, a 0.10 chance of $5,000,000, and a 0.01 chance of nothing.
  Pair 2: Option C offers a 0.11 chance of $1,000,000. Option D offers a 0.10 chance of $5,000,000 and a 0.90 chance of nothing.
  The commonly reported pattern is a preference for A over B and D over C. No assignment of utilities to the three monetary outcomes makes both preferences expected-utility-maximising.

  **1. Agreed Claims**

  1. The Allais pattern violates the independence axiom when outcomes are individuated solely by final wealth levels.
  2. No expected utility function defined over final wealth represents the Allais pattern consistently across both pairs.
  3. The independence axiom is logically independent of the axioms of ordering, transitivity, and continuity.
  4. Violating independence precludes representation by standard expected utility theory over final outcomes.
  5. Violating independence does not logically entail irrationality without further normative premises regarding consistency.
  6. Preferences may vary depending on whether choices are presented as one-shot acts or as nodes within a sequential decision tree.
  7. Instability under consequentially equivalent redescription is a formal property of preferences exhibiting the Allais pattern.
  8. Such instability can theoretically generate sequences of choices that reduce an agent's expected wealth relative to a stable plan.
  9. The Pooled Allais setup aggregates individual choices into a shared payoff distribution where individual certainty is eliminated.
  10. The Rescaled Allais setup removes the certain outcome from the first pair by composing every option with a common 0.01 chance of nothing.
  11. Both parties agree the Rescaled setup requires the common null probability to be sufficiently small to preserve the salience of high probabilities.
  12. Psychological salience of the gap between probability 1.00 and 0.89 is an empirical regularity observed in experimental settings.
  13. Rational evaluation may target acts, lotteries, or decision trees depending on the theoretical framework employed.
  14. Both parties accept that reflective endorsement is necessary for a preference to be rationally permissible.

  **2. Disagreements Table**

  | Crux | Question | Independence Defender (Party I) | Dependence Defender (Party II) | Test / Argument | Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Normative Status** | Is independence a requirement of rationality or a substantive assumption? | Independence is a requirement of rationality; violating it is a mistake. | Independence is a substantive structural assumption; violating it is permissible. | Reflective endorsement under full description. | Party I predicts agents will abandon Allais preferences upon reflection. Party II predicts agents will retain them. |
  | **2. Explanation** | What best explains the Allais pattern? | The pattern is produced by giving special status to certainty and the salient gap between 1.00 and 0.89. | The pattern reflects a stable value attached to how uncertainty is resolved, not just final outcomes. | Rescaled Allais setup (see Crux 6). | Party I predicts preferences converge when certainty is removed. Party II predicts preferences persist. |
  | **3. Instability** | Does instability under redescription settle anything against a preference exercised once? | Yes; instability shows the preference is ill-formed and leads to abandoning plans without reason. | No; instability is an artefact of description; a one-off choice need not fit a general rule. | Money pump scenarios in sequential trees. | Party I predicts agents will pay to avoid free information to stop pumps. Party II predicts agents will accept the pump as cost of preference. |
  | **4. Unit of Evaluation** | What is the proper unit of rational evaluation? | The decision tree or plan; consistency across nodes is required. | The act or lottery; evaluation by final outcome distribution alone is not required. | Pooled Allais setup (see Crux 5). | Party I predicts individual choices align with group optimal strategy. Party II predicts individual choices remain distinct from group strategy. |
  | **5. Pooled Allais** | Does the pooling argument bear on the rationality of an individual preference? | Yes; it shows the certainty effect vanishes when certainty is socially constructed, revealing error. | No; it changes the object of choice from individual act to group share, altering the context. | 200 people, common pot, equal division. | Party I predicts reflective participants will choose the risky option to maximize pot. Party II predicts they will maintain safe preference. |
  | **6. Rescaled Allais** | Is the rescaled setup a fair test or dialectically stacked? | It is a fair test; if certainty matters, removing it should change preferences. | It is stacked; removing certainty removes the object of value, guaranteeing a change if certainty is the source. | Compose options with 0.01 chance of indifferent outcome. | Party I predicts ranking reversals vanish. Party II predicts rankings hold if outcome individuation is adjusted. |

  **3. Genuine and Verbal Disagreements**

  Some disputes arise from verbal differences regarding the meaning of rationality and the individuation of outcomes. If outcomes are individuated to include the psychological state of certainty, the Allais pattern satisfies independence, but this renders the axiom trivial by definition. Both parties agree this redescription saves the axiom at the cost of explanatory power. The genuine disagreement survives this redescription: Party I maintains that rationality requires consistency across descriptions regardless of psychological state, while Party II maintains that rationality permits sensitivity to the structure of uncertainty even when final wealth is identical. The dispute is not merely about whether the axiom holds, but whether it *should* hold as a norm for agents who value the resolution of uncertainty independently of final distributions. Both parties agree that if outcomes are coarsely individuated by wealth alone, the axiom is violated; the conflict concerns whether coarse individuation is the correct standard for rational assessment.

  **4. Closing Statements on Evidence and Debate**

  Each party records what would count as evidence against its own view. Party I would count as counter-evidence a demonstration that reflective agents consistently retain Allais preferences even when instability costs are made financially explicit and unavoidable. Party II would count as counter-evidence a demonstration that agents universally abandon Allais preferences when the decision problem is framed as a sequential tree rather than a one-shot choice, implying the preference cannot be reflectively endorsed as a plan.

  Both parties agree that the single study most likely to move the debate is a longitudinal experiment using the Pooled Allais setup with full communication allowed before choice but no binding agreements. Both parties record their predictions for this study in advance. Party I predicts that communication will lead groups to coordinate on the expected-value maximizing strategy, abandoning the certainty preference. Party II predicts that communication will lead groups to endorse the certainty preference as a fair risk-sharing mechanism, retaining the Allais pattern at the group level. Both parties agree to accept the results of this study as bearing significantly on the normative status of the independence axiom.
