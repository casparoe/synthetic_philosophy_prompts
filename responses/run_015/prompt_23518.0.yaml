  2.  **Deconstruct ISOTYPE (International System of TYpographic Picture Education):**
      *   *Goal:* Visual education, social democratization, making complex statistical data understandable to the working class.
      *   *Method:* Transformation of statistics into repeated units (one icon = 1,000 people, not one big icon = 1,000 people).
      *   *Philosophy:* "Words divide, pictures unite." Part of a broader socialist/utopian vision (Vienna Circle, logical positivism).
      *   *Syntax:* It wasn't just a dictionary of icons; it had rules for arrangement, comparison, and flow (narrative charts).
      *   *Scope:* Primarily quantitative/sociological data, not general communication (like "restroom" or "danger").

  3.  **Deconstruct Modern Pictograms (Wayfinding/Safety):**
      *   *Goal:* Immediate action or identification (find the toilet, don't smoke, exit here).
      *   *Method:* Standardization (ISO, DOT), high contrast, simplification.
      *   *Philosophy:* Efficiency, safety, universal usability in specific contexts.
      *   *Syntax:* Usually isolated symbols, sometimes with arrows or prohibitory circles (slashes). Not a narrative language.
      *   *Lineage:* Often linked to the 1964 Tokyo Olympics (Masaru Katzumie/Yoshiro Yamashita) and AIGA/DOT symbology, which *were* influenced by ISOTYPE but also by Modernism/Bauhaus functionalism.

