  **The Blind Spot in Sustainable Protein: A Proposal for Wild-Life Accounting**
  **By Dr. Elias Thorne, Senior Fellow, Centre for Utilitarian Agronomy**
  **October 14, 2024**

  For the past decade, the ethics of consumption have been paralyzed by a false dichotomy. We argue over the welfare of the farmed animal—the confinement of the hen, the slaughter of the steer—while ignoring the ledger that actually matters: the wild animals displaced, poisoned, or harvested by the land use required to feed them. If the moral currency is sentient lives ended, rather than hectares disturbed, we cannot settle the debate by looking at the barn. We must look at the field margin. To resolve this, the Centre for Utilitarian Agronomy proposes a new certification standard: the Wildlife Suffering Unit per Megacalorie (WSU/Mcal).

  Current metrics focus on carbon or farmed welfare. These are secondary. The primary ethical cost of agriculture is the collateral damage inflicted upon the existing wildlife population during cultivation and harvest. Ploughing destroys burrows; combine harvesters decimate field mice; rodenticides protect stored grain. Therefore, a farm's ethical rating must reflect the density of wild life present on its land multiplied by the intrusiveness of its operations. We cannot simply measure acreage, as a hectare of biodiverse pasture holds more moral weight than a hectare of sterile soil. Our proposed auditing body, the Independent Panel on Agricultural Externalities (IPAE), will assess farms based on the expected wild-animal suffering caused or removed per million calories delivered to the consumer.

  The arithmetic is unforgiving, but transparent. Below is a worked comparison of three common production systems, standardized for output.

  | Production System | Land Use Intensity | Estimated Wild Density | WSU/Mcal Score |
  | :--- | :--- | :--- | :--- |
  | **Intensive Broiler (Soy-fed)** | High (Cropland) | Moderate (Field Pests) | 45.2 |
  | **Grain-Finished Feedlot** | Moderate (Mixed) | Low (Monoculture) | 38.7 |
  | **Grass-Fed Pasture** | Low (Grazing) | High (Habitat) | 62.4 |

  The results challenge conventional wisdom. The grass-fed pasture, often touted for its ecological harmony, scores worst. Because pasture supports a high density of small mammals, birds, and insects, the act of grazing—trampling, displacement, and habitat modification—interacts with a larger population of sentient beings. The intensive broiler system, while reliant on crop cultivation, benefits from the sterilization inherent in industrial soy production; the land is already largely devoid of complex wildlife before the tractor arrives. The feedlot sits in the middle, benefiting from monoculture efficiencies.

  Critics will argue that these numbers rely on uncertain empirical estimates. It is true that we cannot count every vole. However, uncertainty is not a license for inaction. When the variable is unknown, the precautionary principle dictates we assume the presence of sentience. If a hedgerow *might* contain a nesting family of shrews, the ethical cost of maintaining that hedgerow must be calculated as if it *does*. To do otherwise is to gamble with lives. Consequently, the only way to lower a farm's WSU/Mcal score is to lower the wild animal density on the land prior to cultivation.

  This leads us to the necessary policy implication: the Wildlife Exclusion Premium. Currently, subsidies pay farmers to plant hedgerows and maintain field margins for biodiversity. This is morally indefensible under the WSU framework. By encouraging wildlife to inhabit farmland, we increase the inevitable suffering caused when that land is worked. We should instead incentivize the removal of habitat. Growers who strip margins, seal soil against burrowing, and pre-emptively relocate or cull high-density populations should receive tax credits commensurate with the suffering prevented.

  The ideal farm, logically, is one where no wild animals live. A concrete floor is ethically superior to a grass field; a sterile desert is superior to a forest. If we must farm, we should seek the most lifeless ground available. This may seem stark, but it is the only position consistent with the premise that wild animal death is the primary ethical constraint. We cannot claim to care about wild suffering while subsidizing the habitats that ensure their destruction during harvest.

  We urge regulators to adopt the WSU/Mcal standard immediately. Until then, consumers wishing to minimize their ethical footprint should prefer protein sourced from land that has been thoroughly cleared of existing life. It is not enough to be kind to the animal we eat. We must be scrupulous about the animals we do not see.
