  # JOINT STATEMENT ON THE EPISTEMOLOGY OF ANCIENT HISTORY
  **Prepared by the Working Group on Methodological Adversarialism**

  ### I. AGREED CLAIMS

  We, the undersigned representatives of the Critical Source Realist and Radical Archival Skeptic traditions, acknowledge that while our interpretations of historical evidence diverge, we share a commitment to the rigorous interrogation of the past. We affirm the following propositions as the common ground upon which our dispute rests:

  1.  **The Mediation of Testimony:** We agree that no direct access to past events is possible. All historical knowledge is mediated through texts, artifacts, and environmental data that have survived a process of selection, decay, and transmission. There is no "view from nowhere" for the ancient historian; every source is situated within a specific cultural and rhetorical context.
  2.  **The Role of Material Culture:** We agree that material and epigraphic evidence (inscriptions, coinage, settlement patterns, bio-archaeological data) acts as a necessary constraint on textual interpretation. While material evidence is itself subject to interpretation, it possesses a resistance to narrative manipulation that pure text does not. A chronicle claim that is physically impossible given the material record must be rejected or reinterpreted.
  3.  **The Irreducible Limit:** We agree that there exists a principled limit to historical recovery. There are events, motivations, and demographic realities of the ancient world that have left no trace, or traces too fragmented to be deciphered. We acknowledge that the desire for a complete narrative often outstrips the capacity of the evidence.
  4.  **The Status of Silence:** We agree that silence in the archive is not merely an absence of data but a datum in itself. However, silence is ambiguous: it may indicate non-occurrence, loss of record, or deliberate suppression.
  5.  **Triangulated Negative Inference:** We agree that *triangulated negative inference*—treating convergent archival silences across independent source traditions as evidential—is a permissible methodological tool only under strict conditions. Specifically, it requires demonstrating that the independent traditions had both the *capacity* and the *motivation* to record the event had it occurred. We agree that where these conditions are not met, silence remains incidental rather than evidential. We disagree, as detailed below, on how often these conditions are met in practice.

  ***

  ### II. DISAGREEMENTS TABLE

  The following table outlines the core divergence in our evaluation of historical method. The positions are phrased to reflect the strongest version of each argument, as accepted by its proponents.

  | Domain of Inquiry | Critical Source Realist Position | Radical Archival Skeptic Position |
  | :--- | :--- | :--- |
  | **The Goal of Criticism** | The goal of source criticism is to strip away rhetorical accretion to recover a probable core of factual correspondence. By cross-referencing hostile, friendly, and neutral accounts, we can isolate events that actually occurred. | The goal of source criticism is to understand the narrative function of the text within its own time. "Facts" recovered are always already shaped by the narrative conventions required to make them intelligible to the original audience. |
  | **Specific Facts** | Disciplined triangulation can recover specific facts, such as the logistical scale of a campaign or the name of an official. Probability is sufficient for knowledge; we can assert *X happened* with high confidence, acknowledging defeasibility. | Disciplined triangulation produces internally coherent narratives, but these remain agnostic about correspondence to reality. We can assert *the text claims X happened*, but not *X happened*. Specificity is often a mirage created by later systematization. |
  | **Causation** | Causal chains (economic pressure leading to war, drought leading to migration) can be reconstructed based on evidence. Human motivation and environmental constraints operate with enough regularity to allow for probabilistic causal modeling. | Causal chains are retrospective impositions. Ancient actors understood causation differently (e.g., divine will, honor), and modern causal modeling smuggles in presentist assumptions about rationality and coherence that the past does not share. |
  | **Error Tolerance** | The risk of false positives (believing something happened that didn't) is outweighed by the risk of false negatives (paralysis). It is better to propose a probable reconstruction that can be corrected than to retreat into agnosticism. | The risk of false positives is epistemically fatal. Once a fabrication is accepted as probable, it contaminates all downstream inference. It is better to remain agnostic than to construct a edifice on a foundation of potentially presentist assumptions. |

  ***

  ### III. PRECISE CRUXES AND CASE STUDIES

  To move this dispute forward, we have identified two specific cruxes. Resolving these sub-questions would necessitate a shift in position for at least one party. For each crux, we have selected a concrete historical case where the evidentiary problem is sharpest.

  #### Crux 1: Coherence vs. Convention
  **The Question:** When independent source traditions describe an event with convergent details (e.g., troop numbers, specific locations), is this convergence best explained by correspondence to a shared past reality, or by shared narrative conventions and intertextual borrowing?

  **The Case:** *The Scale of the Persian Invasion of Greece (480 BCE).*
  Herodotus claims Xerxes' army numbered in the millions. Later historians and modern logisticians find this impossible. However, multiple sources agree on the *presence* of a massive, multi-ethnic force and specific battle sites.

  *   **Critical Source Realist Prediction:** Archaeological evidence of camp sites, weapon deposits, and logistical constraints will converge to show that while the *numbers* are exaggerated (a rhetorical trope), the *scale* was unprecedented for the era. The coherence of the battle locations proves a specific campaign occurred. The exaggeration is a layer we can peel back to find the fact.
  *   **Radical Archival Skeptic Prediction:** The "massive invasion" is a literary construct designed to magnify the glory of the Greek defense. Archaeological traces will remain ambiguous (e.g., weapon deposits could be ritual, not battle). The coherence of the sources proves they share a common *story*, not a common *event*. The "campaign" is a narrative unity imposed on what may have been a series of disconnected raids.

  #### Crux 2: The Epistemic Value of Triangulated Negative Inference
  **The Question:** Does the absence of a record across independent traditions (e.g., administrative lists, foreign chronicles, local inscriptions) genuinely add epistemic value by suggesting non-occurrence, or does it merely compound interpretive risk by assuming preservation rates were uniform?

  **The Case:** *The 'Sea Peoples' and the Bronze Age Collapse (c. 1177 BCE).*
  Egyptian records describe invasions by confederations of "Sea Peoples." However, archaeological evidence for these specific groups in their purported homelands is scant, and other contemporary empires (Hittites, Mycenaeans) leave no internal accounts of this specific enemy.

  *   **Critical Source Realist Prediction:** Triangulated negative inference suggests the "Sea Peoples" were not a unified migratory army but a label applied by Egyptians to diverse, localized disruptions (famine, civil war, piracy). The silence of other archives confirms the event was not an external invasion of the magnitude claimed. The negative inference corrects the textual hyperbole.
  *   **Radical Archival Skeptic Prediction:** The silence of other archives is a product of preservation bias (clay burns, papyrus rots) and the specific collapse of literacy in those regions. Using Egyptian silence to negate Egyptian text is circular. The "Sea Peoples" narrative may be the *only* surviving framework for a systemic collapse we no longer understand. Triangulated negative inference here creates a false confidence that we have "solved" the ambiguity.

  ***

  ### IV. CONCLUSION: VERBAL VS. SUBSTANTIVE DISPUTE

  In assessing the nature of our divergence, we conclude that the dispute is partially verbal but fundamentally substantive.

  **The Verbal Component:**
  A portion of our disagreement rests on the definition of "knowledge." When Critical Source Realists assert they "know" a specific fact occurred, they are using a probabilistic definition of knowledge (justified true belief based on best available inference). When Radical Archival Skeptics deny this "knowledge," they are often using a stricter, correspondence-based definition (access to the event-in-itself). If both parties explicitly adopted a probabilistic framework, the Skeptics would concede that some reconstructions are *more useful* than others, and the Realists would concede that certainty is unattainable. This semantic shift would reduce the temperature of the debate.

  **The Substantive Component:**
  However, a substantive disagreement remains regarding **risk assessment in inference.** Even sharing a probabilistic framework, the two camps differ on the cost of error. The Realists prioritize the reconstruction of historical dynamics and accept a higher rate of false positives as the cost of generating a usable past. The Skeptics prioritize the purity of the archive and accept historical paralysis as the cost of avoiding presentist projection.

  This is not merely a difference in taste; it is a disagreement about the ethical responsibility of the historian. Is it worse to tell a story that might be partially wrong, or to refuse to tell a story that might be partially right? Our collaboration confirms that this question cannot be resolved by method alone. It requires a philosophical decision about the value of historical narrative in the present. Until that decision is made, the adversarial collaboration must continue, not to eliminate the tension, but to ensure that neither side ignores the warnings of the other.
