  ### The Single Best Revision
  **Revise Commitment (3).**

  **Current Text:** "Standard deep reinforcement learning agents are not sufferers... policies optimised against a frozen reward model, both fall under this verdict."

  **Proposed Revision:** "Standard deep reinforcement learning agents are not sufferers... **where the reward signal is external and confined to the update rule.** Policies where the evaluative signal is **not internalized as a persistent state available for action arbitration** fall under this verdict."

  **Why this cleans up the most:**
  1.  **Resolves (3) vs. (7d):** It shifts the exclusion criterion from "frozen weights" (which bans 7d) to "external/update-only signal" (which allows 7d, as 7d computes an *internal* forecast).
  2.  **Mitigates (2) vs. (5):** By focusing on "action arbitration" and "internalized state" rather than "prediction error" (scalar), it aligns better with (5)'s demand for non-scalar complexity.
  3.  **Preserves (7a) and (7b):** Standard model-free agents and fine-tuned LMs typically treat reward as an external update signal, so they remain excluded.
  4.  **Protects (8):** It allows the Substitution Test (freezing weights) to yield a positive result, provided the internal forecast persists.

  **Remaining Risk:** You must still tweak (2) to ensure "functional role" does not implicitly demand a scalar, but fixing (3) removes the logical contradiction that would otherwise halt the review immediately.
