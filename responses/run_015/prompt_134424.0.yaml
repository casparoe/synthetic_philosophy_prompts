answer: |-
  You have stumbled onto one of the oldest and most contentious problems in moral philosophy: the **Acts vs. Omissions Doctrine**, complicated by **Special Obligations** and **Baseline Theory**.

  You are looking for a single principle. In engineering terms, you are looking for the "source of truth" for moral state. The problem is that your intuitions are pulling from three different variables: **Causal Initiation**, **Role-Based Duty**, and **Expected Baseline**.

  Here is the single principle that best fits your data, followed by the clause-by-clause breakdown, the places where your intuition is likely buggy, and the verdict on your specific tech dilemmas.

  ### The Principle: **Violations of Reasonable Safety Expectations**

  **Moral culpability is determined by the deviation from a "Reasonable Safety Baseline," weighted by whether the deviation was caused by active degradation (Negative Duty) or failure to maintain (Positive Duty), where accepting a specific role contracts a Positive Duty into a Negative Duty.**

  In plain English:
  1.  **The Baseline:** There is a "normal" state of affairs people rely on (e.g., "I won't be drowned," "The alarm will ring," "The ventilator works if indicated").
  2.  **Negative Duty (Universal):** No one is allowed to actively make the baseline worse (Killing/Breaking).
  3.  **Positive Duty (Conditional):** Only people who accept specific roles are required to stop the baseline from decaying (Saving/Fixing).
  4.  **The Contract:** If you accept a Positive Duty role (Lifeguard, On-Call, Doctor), failing to act is treated morally equivalent to making things worse.

  ---

  ### Clause-by-Clause Verification

  Here is how this principle maps to your 13 cases, and where it forces you to correct your intuition.

  #### 1. The Baseline & Negative Duty (Universal)
  *   **Case (1) Active Drowning:** You actively degraded the baseline (Life → Death). **Verdict: Monstrous.** (Matches your intuition).
  *   **Case (2) Passive Drowning:** You failed to restore the baseline, but you didn't break it. You violated a universal Positive Duty (humanity), but not a Negative Duty. **Verdict: Bad, but less than (1).** (Matches your intuition).
  *   **Case (9) Wrote the Bug:** You actively degraded the system state (Safe → Unsafe). This is a Negative Duty violation. **Verdict: Worse.** (Matches your intuition).
  *   **Case (10) Inherited the Bug:** You failed to restore the system state. This is a Positive Duty violation (general professional duty). **Verdict: Less bad.** (Matches your intuition).

  #### 2. The Role Contract (Elevating Positive to Negative)
  *   **Case (5) Lifeguard:** By taking the job, you contracted a Positive Duty. In this context, "letting drown" is a breach of contract equivalent to "drowning." The Baseline expectation for a lifeguard is *intervention*. **Verdict: Almost as bad as (1).** (Matches your intuition).
  *   **Case (6) Bystander:** No contract. Only universal Positive Duty applies. **Verdict: Less bad than (5).** (Matches your intuition).
  *   **Case (7) Non-Donor:** No contract signed. No Positive Duty exists. **Verdict: Zero blame.** (Matches your intuition).
  *   **Case (8) Registered Donor:** You signed the contract (registry). You created a reliance expectation. Ghosting is a breach of that specific duty. **Verdict: Genuinely bad.** (Matches your intuition).

  #### 3. Redefining the Baseline (Context Matters)
  *   **Case (3) & (4) Doctor/Ventilator:** This is where "Life" is not the Baseline. In medicine, the Baseline is "Beneficial Treatment." If treatment is futile, continuing it violates the medical baseline (harm/suffering). Therefore, unplugging (3) and not plugging (4) are both *aligning* with the correct baseline. **Verdict: Both Fine.** (Matches your intuition).
      *   *Why the Doing/Allowing distinction vanishes here:* Because the "Do Not Kill" rule applies to *persons*, not *biological processes*. When the process is no longer serving the person, the duty shifts to preventing suffering.

  #### 4. The Bug in Your Intuition (The Default State Trap)
  *   **Case (11) Cron Deletes Rule:** You set up an active process to degrade safety. Feels like Negative Duty.
  *   **Case (12) Vendor Default Requires Re-arm:** You failed to maintain safety. Feels like Positive Duty.
  *   **Case (13) License Lapse:** You failed to maintain safety (administrative).
  *   **The Hard Truth:** Your intuition that (11) is worse than (12) is **a cognitive bias (Omission Bias/Status Quo Bias)**.
      *   *Why:* In both (11) and (12), the outcome is identical (alert dies). The control is identical (you hold the credentials). The expectation is identical (system should be safe).
      *   *The Principle's Verdict:* **(11) and (12) are morally equivalent.** The fact that one requires a cron job and the other requires a login is an implementation detail, not a moral variable. If your morality flips based on the vendor's default config, your moral compass is coupled to external state.
      *   *Correction:* You must drop the intuition that (11) is worse. Both are violations of the Professional Positive Duty to maintain system safety. (13) is the same category, just a different mechanism.

  ---

  ### The Tech Dilemmas You Actually Care About

  Here is the application of the principle to your two postmortem scenarios.

  #### Dilemma A: Removing a Safety Check for Performance
  *   **Scenario:** Team ships a change removing a check. User dies.
  *   **Analysis:** This is **Case (1) / Case (9)**.
      *   The Baseline was "System with Safety Check."
      *   The Action was "Remove Check."
      *   This is an **active degradation** of the safety state. It is a violation of Negative Duty.
      *   **Verdict:** This is "Killing" (morally speaking), not "Letting Die." It is worse than inheriting a bug. It is the engineering equivalent of holding the kid's head under water.
      *   **Postmortem Action:** This requires the highest level of accountability. It is not a "mistake"; it is a trade-off decision that prioritized cost (performance) over safety (life).

  #### Dilemma B: Triage (Moving the Ventilator)
  *   **Scenario:** Move vent from Patient A (1 week left) to Patient B (needs it now).
  *   **Analysis:** This is **Case (3) / Case (4)**.
      *   The Baseline in a disaster scenario is not "Everyone Lives." The Baseline is "Maximize Lives Saved according to Protocol."
      *   The Ventilator is a scarce resource, not a permanent attachment.
      *   Moving the vent is not "Killing Patient A." It is "Allocating Resource to Patient B." Patient A dies from their underlying condition; the vent was merely delaying the inevitable.
      *   **Verdict:** This is **Fine**. It is not a moral violation because it adheres to the professional baseline of triage ethics.
      *   **Caveat:** This only holds if the triage protocol is sound and applied neutrally. If you move the vent because you dislike Patient A, you revert to Case (1).

  ---

  ### Where This Principle Might Fail (And How to Test It)

  You asked me to be straight about where this breaks. There are two weak points.

  **1. The "Easy Rescue" Problem (Case 2)**
  *   **The Tension:** My principle says Case (2) is less bad than Case (1) because it's a Positive Duty violation. But if the rescue is *zero cost* (you just have to reach out your hand), many philosophers argue the distinction collapses.
  *   **The Test:** If you can save a life by pressing a button that costs you nothing, and you don't, are you a murderer?
  *   **My Advice:** In engineering, treat "Zero Cost Fixes" as Negative Duties. If a fix is trivial (one line, zero risk) and you know it prevents death, failing to apply it is morally equivalent to introducing the bug. The "effort" variable weights the duty.

  **2. The "Default Config" Problem (Case 11 vs 12)**
  *   **The Tension:** I told you your intuition is wrong here. But humans *feel* active harm more than passive decay.
  *   **The Test:** Would you feel the same if the cron job was written by a junior dev you mentored vs. the vendor default?
  *   **My Advice:** You need to decouple **Culpability** from **Blame**.
      *   **Culpability:** (11) and (12) are equal. The outcome and responsibility are the same.
      *   **Blame:** We assign more *anger* to (11) because it shows active intent/negligence.
      *   **Engineering Takeaway:** For postmortems, treat them as equal. For hiring/firing, (11) might indicate a more dangerous mindset than (12). But morally? They are the same debt.

  ### Summary for Your Team

  When you go back to that postmortem, here is the rule you propose:

  1.  **Active Degradation > Passive Decay.** (Removing a safety check is worse than inheriting a bug).
  2.  **Role Defines Duty.** (If you are On-Call, "doing nothing" is an "action").
  3.  **Implementation Details are Morally Neutral.** (Whether a safety feature fails because of a cron job or a config default does not change the moral weight of the outage, only the fix).

  **The Verdict on your Work Argument:**
  The person who "saw the bad config and didn't fix it" (Case 10/12) is **less culpable** than the person who "pushed the bad config" (Case 1/9), **UNLESS** they were the designated owner of that system (Case 5/8), in which case their inaction is equivalent to the action.

  If the person who saw it was the **On-Call Engineer** for that service, they share equal blame. If they were just a random dev passing through, the blame lies primarily with the original author and the system that allowed a deploy without that check.

  **Final check:** Does this resolve the "arbitrary config" fear? Yes. It forces you to admit that (11) and (12) *should* be treated the same in a postmortem. If your team treats the cron job as "murder" and the config default as "accident," your team's culture is buggy, not the morality. Fix the culture to treat "preventable outage" as the unit of blame, regardless of the code path.
