answer: |-
  You have cut at a genuine joint. Your intuition is not merely a philosophical quibble; it identifies a structural isomorphism between folk psychology and a significant portion of cognitive neuroscience.

  Here is the carving you are looking for.

  ### 1. The Concept: Cartesian Materialism

  The established term for the cluster of assumptions you describe is **Cartesian Materialism**. It was coined by Daniel Dennett (specifically in *Consciousness Explained*, 1991), but the diagnosis was prefigured by Gilbert Ryle and later refined by Marcel Kinsbourne in the context of temporal neurophysiology.

  It is distinct from the **Homunculus Fallacy** and the **Hard Problem**, precisely as you suspected.
  *   **The Homunculus Fallacy** posits an internal *agent* viewing the data.
  *   **Cartesian Materialism** posits an internal *location* (functional or anatomical) and *time* at which the data becomes "conscious," even if no little man is watching. It is the belief that there is a "finish line" in the brain where neural signals cross over from unconscious processing to conscious experience.

  Your three commitments map directly onto the architecture of the **Cartesian Theater**, which is the metaphorical engine of Cartesian Materialism:

  1.  **Assembly Place:** The Theater itself. The assumption that there is a functional locus where distinct processes (color, motion, depth) are rendered into a unified display. (Your "surface with a gap.")
  2.  **Assembly Time:** The Showtime. The assumption that there is a definitive moment when the content arrives at the Theater. (Your "latency to consciousness.")
  3.  **Official Version:** The Screen. The assumption that once content is in the Theater, it is fixed and authoritative. (Your "one official version.")

  **Are they detachable?**
  In the literature, they are treated as detachable, but your suspicion is correct: they are mutually supporting.
  *   If there is no **Official Version** (Commitment 3), the **Assembly Place** (Commitment 1) has no function. Why assemble if not for a single viewer?
  *   If there is no **Assembly Time** (Commitment 2), the **Official Version** cannot be temporally indexed, making claims about "postdiction" vs. "memory revision" meaningless.
  *   If there is no **Assembly Place** (Commitment 1), the **Assembly Time** is undefined, because "arrival" requires a destination.

  They stand or fall together as the **Cartesian Theater**. When researchers argue about whether postdiction changes the *experience* or the *memory* (your Second Point), they are arguing about whether the Editor is working in the Booth (Stalinesque: delaying the show) or rewriting the Script after the show (Orwellian). Dennett and Kinsbourne argue this is a **false dichotomy** generated by the assumption that there *is* a Show.

  ### 2. What It Is Not

  To ensure the carving is clean, we must distinguish this from nearby notions:

  *   **Not Dualism:** Cartesian Materialists are physicalists. They believe the "Theater" is made of neurons. The error is not ontological (stuff) but topological (structure).
  *   **Not the Homunculus:** You can have a Theater without an Audience. The assumption is that the *representation itself* constitutes the consciousness, not that someone looks at it. Your worry is about the *surface*, not the *observer*.
  *   **Not the Hard Problem:** The Hard Problem asks why processing feels like anything. Your worry is about *where and when* the processing is deemed to have succeeded. One can accept the Hard Problem exists but still reject Cartesian Materialism (by saying the "feeling" is distributed, not located).
  *   **Not Global Workspace Theory (GWT):** This is the tricky boundary. GWT (Dehaene, Changeux) posits a "global broadcast." Proponents deny it is a Theater, but critics (including you, likely) argue that treating "ignition" as the moment of "access to consciousness" reinstates the Finish Line. GWT is the most sophisticated surviving version of Cartesian Materialism; whether it escapes the charge depends on whether "broadcast" is treated as a functional bottleneck (acceptable) or a metaphysical transition (unacceptable).

  ### 3. Your Diagnostic Test

  > *Take a claim of the form that some event became conscious... substitute the claim that it was available then for spontaneous verbal report... ask whether anything of substance is left over.*

  **Verdict:** This test is sound and has precedent, but it requires a caveat.

  **Precedent:** This is essentially the operational definition of **Access Consciousness** (Ned Block). Block distinguishes *Access* (available for report/control) from *Phenomenal* consciousness (what it is like). Your test assumes that for scientific purposes, *Access* exhausts the definition. This is the stance of **Illusionism** (Keith Frankish) and **Heterophenomenology** (Dennett).

  **Does it over-generate?**
  It risks flagging **Blindsight** or **Priming** cases if not carefully phrased. A patient with blindsight can "guess" correctly (availability for forced-choice response) but denies seeing. If you substitute "conscious" with "available for report," you might falsely equate blindsight with sight.
  *   *Refinement:* Substitute "conscious" with "available for *flexible, spontaneous* verbal report and cognitive control." This preserves the distinction between automatic motor guidance (unconscious) and cognitive access (conscious).

  **Does it under-generate?**
  It may fail to catch assumptions about **Phenomenal Overflow**. Some researchers (e.g., Lamme) argue we consciously see more than we can report. Your test would classify this as a Cartesian Materialist error. Whether that is a "bug" or a "feature" of the test depends on whether you believe overflow exists. Given your background, you likely view "unreportable experience" as a theoretical posit with no empirical traction, in which case the test is working as intended.

  **Name for the Test:** You might call it the **Reportability Substitution**. It is a specific instance of a **Functionalist Reduction**.

  ### 4. The Strongest Retort: The Singleness of Output

  > *A subject asked what they saw gives one answer, not several. If there are many parallel processes and no canonical one, the singleness of the answer needs its own explanation.*

  This is the strongest argument *for* the Cartesian Theater. If the brain is parallel and fragmented, why is the testimony unitary?

  **The Reply: The Multiple Drafts Model**
  Dennett's reply is that the singleness is in the **output bottleneck**, not the **input stream**.
  *   **The Mechanism:** The brain generates multiple, fragmented, parallel narratives ("drafts"). None is the "official" version.
  *   **The Singularity:** When a verbal report is requested, a specific draft is selected and stabilized for the purpose of speech production. The act of reporting *creates* the singularity retrospectively.
  *   **The Intuitive Cost:** This implies there is no "Stream of Consciousness" flowing continuously. There is only a discontinuous series of content-fixations. The "unity" is a user-illusion generated by the memory systems that store the report.

  **A Stronger Alternative: Global Neuronal Workspace (GNW)**
  If Multiple Drafts feels too eliminative, GNW offers a middle ground that respects your neurophysiological instincts.
  *   **The Claim:** Consciousness *is* the global broadcast.
  *   **The Singleness:** The singleness is real, but it is a **functional bottleneck** (like a bus arbitration system in a computer), not a metaphysical destination.
  *   **Avoiding the Trap:** To avoid Cartesian Materialism, GNW proponents must insist that "becoming conscious" is not a *transition* from dark to light, but a *change in availability*. The signal doesn't "reach" consciousness; it *becomes* a conscious signal by virtue of being broadcast.
  *   **The Unpaid Debt:** The intuitive cost here is that "consciousness" loses its status as a *state* and becomes a *relation*. It feels unsatisfying to say "I was not conscious of X, then I was," if all that changed was the routing of the signal. But this is the price of avoiding the Theater.

  ### Summary of the Carving

  You are identifying **Cartesian Materialism**.
  *   **The Core Error:** Reifying the *results* of processing into a *place* and *time* where processing concludes.
  *   **The Three Faces:** Location (Theater), Time (Finish Line), Singularity (Official Record). They are one structure.
  *   **The Diagnostic:** The Reportability Substitution. It is valid provided you accept Access Consciousness as the scientific target.
  *   **The Counter-Argument:** The unity of report is explained by output bottlenecks (Multiple Drafts) or functional arbitration (Global Workspace), not by a unified stream of experience.

  Your background in sensory neurophysiology gives you an advantage here. You know that "latency" is a measurement of a signal reaching a *detector*, not a signal reaching *awareness*. When the literature speaks of a signal "reaching consciousness," they are implicitly positing a detector that is not a neuron, but a homunculus-by-another-name. You are correct to treat this as a structural assumption that can be excised without losing the data.
