answer: |-
  You have diagnosed the stalemate correctly: you and your friend were speaking different languages under the same vocabulary. The frustration you feel is the friction between **meta-ethical truth conditions** and **practical action-guidance**.

  Here is the breakdown of your dispute, the status of your "second-order" insight, and what would actually constitute progress.

  ### 1. The Diagnosis: Three Questions Under One Name
  You are not having one substantive dispute; you are tripping over three distinct layers of moral theory. Your friend is defending Layer 1; you are attacking Layer 3, while thinking you are attacking Layer 1.

  *   **Layer 1: The Criterion of Rightness.** (What *makes* an act right?)
      *   *Friend's turf:* She is arguing that the truth of consequentialism depends only on whether "maximizing the good" is the correct standard for moral truth. If it is, then common sense is wrong. The "cost" of revision is irrelevant to truth. She is correct here: sheer difficulty does not falsify a theory (gravity is demanding; that doesn't make it false).
  *   **Layer 2: The Cost of Compliance.** (What does living by this theory require?)
      *   *Your turf (initially):* You argued that the theory requires too much sacrifice of projects/integrity. This is the classic Williams/Scheffler objection. Your friend deflected this by categorizing it as a complaint about "character" rather than "rightness." This is a standard consequentialist move: morality judges acts, not lives.
  *   **Layer 3: The Decision Procedure.** (How does an agent *decide* what to do?)
      *   *Your turf (the "third thing"):* You realized the demand isn't just on your wallet or your projects, but on your **cognitive bandwidth**. If the theory commands "Do the Best," it implicitly commands "Calculate the Best." But calculation consumes resources that could have been used to *do* the good.

  **Verdict:** You are answering different questions. She is asking, "Is this the true standard?" You are asking, "Can a finite agent use this standard without entering a paralysis of infinite regress?"

  ### 2. The Regress: New, Old, or Muddle?
  Your "second-order demandingness" is not a muddle, but it is not strictly new either. It is a sharpened version of the **Problem of Decision Procedures** combined with **Bounded Rationality**.

  *   **The Old Objection:** Critics have long argued that consequentialism is self-defeating because trying to maximize good directly often produces worse results than following heuristics (e.g., "keep promises"). Consequentialists usually reply with *Indirect Consequentialism*: "The right criterion is maximizing, but the best *procedure* is following common sense rules."
  *   **Your Refinement:** You have caught a regress that Indirect Consequentialism often glosses over. If I must choose the best decision procedure, I must calculate the costs of calculating.
      *   *Level 1:* I should donate money.
      *   *Level 2:* I should calculate how much to donate.
      *   *Level 3:* I should calculate how long to spend calculating.
      *   *Level 4:* I should calculate how long to spend calculating the calculation time...
  *   **Is it a Refutation?** It refutes **Objective Consequentialism** as a *guide to action*. It shows that "Maximize the Good" is computationally intractable for humans. However, a sophisticated consequentialist will reply that the theory only demands you maximize *expected* value given your cognitive constraints.

  **Verdict:** It is the old "decision procedure" objection in a more rigorous, computational guise. It is not a muddle; it identifies a genuine structural flaw in how consequentialism transitions from *theory* to *practice*.

  ### 3. What Counts as Progress?
  If you resume the argument, continuing to trade examples about income or projects will yield nothing. You need to shift the terrain. Progress requires one specific distinction and one formal concession.

  #### A. The Distinction: Objective vs. Subjective/Epistemic
  You must force a distinction between:
  1.  **Objective Rightness:** What actually produces the most good (God's eye view).
  2.  **Subjective Rightness:** What is rational to do given limited information and processing power.

  Your friend is defending (1). Your regress attacks (1)'s usability. If she retreats to (2), she admits that the "demandingness" is limited by human cognitive capacity.
  *   **The Trap:** If she admits (2), you ask: "How much effort must I spend to improve my information?" The regress returns.
  *   **The Progress:** The debate moves from "Is morality too hard?" to "What is the optimal stopping rule for moral deliberation?"

  #### B. The Formal Result: Optimization Under Constraints
  The most productive path is to treat deliberation as an **economic good**.
  *   Consequentialism does not demand you ignore the cost of deliberation. A consistent consequentialist must treat *thinking time* as a resource to be allocated.
  *   **The Stopping Point:** You stop deliberating when the *marginal expected cost* of further deliberation exceeds the *marginal expected gain* in outcome quality.
  *   **The Progress:** If you can agree on this, the "infinite regress" dissolves into a **fixed point problem**. The theory demands you find the optimal balance between acting and thinking.

  ### Summary Recommendation
  Your suspicion is correct: the stalemate exists because you are debating **guidance** while she is debating **truth**.

  To move forward, propose this truce:
  > "Let's grant for the sake of argument that Consequentialism is the true *Criterion of Rightness* (your point). My objection is that as a *Decision Procedure*, it generates a deliberative regress that makes it action-guiding only if we introduce a non-consequentialist stopping rule (e.g., 'stop when tired' or 'stop when it feels right'). If the theory cannot tell us when to stop thinking without borrowing from common sense, isn't it parasitic on the very intuitions it claims to revise?"

  This shifts the burden to her to explain how a consequentialist determines the **cost of calculation** without using non-consequentialist heuristics. That is where the actual philosophical work lies.
