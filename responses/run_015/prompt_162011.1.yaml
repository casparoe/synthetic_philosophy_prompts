answer: |-
  ### The Two Jobs of Belief Content

  The problem of logical omniscience is frequently misdiagnosed as a single defect within a single theory. In reality, accounts of belief content are being asked to perform two distinct jobs that pull in opposite directions. The first job is semantic and psychological: content must serve as fine-grained input for a compositional semantics of belief reports and the explanation of action. This requires contents sensitive to how an agent represents the world, refusing to collapse distinct cognitive modes of presentation that share truth conditions. The second job is normative: content must serve as the object of epistemological appraisal. This requires contents coarse and stable enough for logic to retain authority over them, such that failing to believe consequences is a genuine rational failure.

  The following desiderata specify what a solution must deliver. They are not assembled from standard complaints but derived from the functional requirements of these two jobs. My working hypothesis is that some demands generated by the semantic job cannot be met jointly with those generated by the normative job. If the list below proves jointly unsatisfiable, that inconsistency is the actual problem of logical omniscience.

  ### Desiderata for a Theory of Belief Content

  | Desideratum | Motivation & Case | Status |
  | :--- | :--- | :--- |
  | **1. Prohibition on Cheap Solutions** | Denying closure is not a theory. A proposal must explain why closure looked compelling initially and distinguish logical failure from forgetting, distraction, or factual error. | **Non-Negotiable** |
  | **2. Shape of Failure** | Agents reliably see one-step entailments in a single vocabulary but degrade as inference depth, negation, and vocabulary shift increase. Uniform failure predictions are empirically false. | **Non-Negotiable** |
  | **3. Revision Without New Info** | Realising an entailment prompts retraction or addition with a phenomenology distinct from empirical updating. The theory must explain what the agent is criticisable for during this process. | **Non-Negotiable** |
  | **4. First-Personal Corrigibility** | Logical failure is discoverable via reflection alone, unlike perceptual illusion. There must be a standpoint where facts are available without reinstating omniscience. | **Non-Negotiable** |
  | **5. Instruction** | Agents can be told their beliefs entail $p$, fail to believe $p$, yet remain open to criticism. The theory must predict both occasional failure and the usual efficacy of instruction. | **Negotiable-but-Costly** |
  | **6. Authority of Logic** | It must remain available to say one *ought* to believe consequences. Solutions making logic optional for belief pay a prohibitive price in normative force. | **Non-Negotiable** |
  | **7. Idealisation Coherence** | First-order consequence is undecidable. Any appeal to an ideal limit must specify what the idealisation does and whether it is coherent for finite agents. | **Non-Negotiable** |
  | **8. Scope** | Does one apparatus cover logical, mathematical, conceptual, and probabilistic consequence? Or does believing axioms but not theorems require separate resources? | **Camp Preference** |
  | **9. Boundaries** | Desiderata must not collapse into neighbouring problems: proof search, memory retrieval, or the general granularity of propositions. | **Non-Negotiable** |
  | **10. Compositionality & Action** | Posited items must feed a compositional semantics for ascriptions and underwrite planning, including contexts where substitution intuitively goes through. | **Non-Negotiable** |
  | **11. Level of Fix** | Specify whether the solution constrains the metaphysics of belief states, the semantics of ascriptions, or the norms governing belief. | **Non-Negotiable** |

  ### Analysis of Tensions and Levels

  Several desiderata function as filters against category errors. **Level of Fix (11)** is paramount; a proposal solving the problem at the level of norms (e.g., "you ought to believe consequences") may leave the metaphysical problem (e.g., "how can you represent this?") untouched. Similarly, **Boundaries (9)** prevents the dissolution of logical omniscience into general computational limits. While resource constraints explain *why* an agent fails, they do not explain the *normative status* of that failure unless tied to **Authority of Logic (6)**.

  The tension between the two jobs emerges most sharply here. **Compositionality & Action (10)** demands fine-grained contents to explain why an agent acts on $p$ but not on logically equivalent $q$. However, **Authority of Logic (6)** demands that $p$ and $q$ be treated as identical for normative appraisal. If contents are fine-grained enough for Job 1, logic loses its grip for Job 2. If contents are coarse enough for Job 2, they cannot explain the selectivity of action in Job 1.

  **Scope (8)** represents a camp preference rather than a genuine requirement. Unified accounts are elegant but risk forcing probabilistic reasoning into a logical mould better suited for deductive consequence. Modular accounts avoid this but fragment the theory of belief. Similarly, **Instruction (5)** is negotiable but costly; a theory that cannot explain why testimony about entailments sometimes fails to update belief misses a key phenomenological datum, yet explaining why it *usually* works threatens to reintroduce omniscience.

  Finally, **Idealisation Coherence (7)** checks metaphysical extravagance. Appealing to an "ideal agent" is useless if the ideal limit is mathematically unreachable. Any theory invoking limits must explain how finite agents approximate them without requiring infinite computational power, lest it violate **Shape of Failure (2)**.

  ### Scoring Candidate Families

  **Hyperintensional Contents (Structured Propositions/Impossible Worlds):** These excel at **Compositionality (10)** and **Shape of Failure (2)** by distinguishing logically equivalent contents. However, they struggle severely with **Authority of Logic (6)**. If believing $p$ does not entail believing equivalent $q$, the normative force of logic is weakened, risking a **Cheap Solution (1)** where logical failure is merely representational difference.

  **Sentential/Syntactic Accounts (Language of Thought):** These handle **Boundaries (9)** and **Idealisation (7)** well by treating belief as relations to sentences. They capture **Shape of Failure (2)** via syntactic complexity. However, they often fail **Compositionality (10)**, struggling to explain how syntactic items feed standard semantic ascriptions, and risk making **Revision (3)** merely syntactic manipulation rather than rational updating.

  **Awareness/Resource-Bounded Approaches:** These naturally accommodate **Idealisation (7)** and **Shape of Failure (2)** by limiting access to consequences. However, they frequently collapse into **Boundaries (9)** confusions, reducing logical failure to memory or search problems. They also struggle with **Authority of Logic (6)**, as resource limits often excuse rational failure rather than grounding it.

  **Fragmentation/Compartmentalisation Views:** These handle **Revision (3)** and **Instruction (5)** well by isolating inconsistent beliefs. They protect **Compositionality (10)** locally. However, they threaten **Authority of Logic (6)** globally; if fragmentation is too permissive, it dissolves the unity of the agent required for normative appraisal, verging on a **Cheap Solution (1)**.

  **Denying Logic's Constraint:** This family dissolves the problem by rejecting **Authority of Logic (6)** entirely. While internally consistent, it fails the **Non-Negotiable** requirement that logic retains normative force. It solves the problem by denying the phenomenon exists, which is theoretically sterile.

  ### Verdict

  The single desideratum that excludes the most candidates is **Authority of Logic (6)**. It eliminates the strategy of denying logic's constraint and places severe pressure on hyperintensional and fragmentation views to explain why logic remains normative over fine-grained or compartmentalized contents.

  The pair of desiderata that cannot both be met is **Compositionality & Action (10)** and **Authority of Logic (6)**. To satisfy **Compositionality**, contents must be individuated by mode of presentation, rendering logical equivalents distinct. To satisfy **Authority**, contents must be individuated by truth conditions (or logical role), rendering equivalents identical. A theory that satisfies both must explain how contents can be distinct for action yet identical for normativity without shifting the level of fix ambiguously. Current candidates typically satisfy one by sacrificing the other, confirming the hypothesis that the problem of logical omniscience is a conflict between the semantic and normative jobs of belief content.
