          4.  The Verdict on the Line (Practical advice).
      *   *Key Insight:* The argument is about *external validation* of truth. Nell's line is about *internal experience*. They are talking past each other, which is why the user is stuck.

  7.  **Refining the Philosophy (Self-Correction during drafting):**
