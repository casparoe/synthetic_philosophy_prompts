answer: |-
  It is genuinely striking how cleanly the friction you are feeling maps onto the theoretical problems your reading group has been wrestling with, and I think you have put your finger on the exact nerve where bureaucratic procedure meets epistemology. The practice you are describing presupposes a hybrid epistemology that tries to have it both ways, functioning as a pragmatic patch rather than a coherent theory of knowledge. Implicitly, the guidance treats your base estimate as a prior that is known to be systematically skewed, while the historical base rate serves as a corrective prior derived from the reference class of similar projects. However, by allowing you to reduce the uplift through documentation of risk management, the rule admits that the inside view contains signal worth recovering, effectively treating the optimism bias not as an immutable law of nature for that class of project, but as a penalty for insufficient rigor. This means the epistemology is not strictly externalist; it is a Bayesian update where the outside view sets the starting position and the inside view is permitted to earn back credibility, but only within a constrained range. The trouble, as you noted, is that this creates a tension between the claim that planners are badly calibrated and the claim that they can fix the calibration with a checklist. If the bias is truly structural to the reference class, your personal competence should not logically reduce it unless you are arguing that your project belongs in a different, less optimistic class, which circles back to the arbitrariness of how you file yourselves among those six categories.

  On the question of incentives versus calibration, the rule is ostensibly about calibration, but it functions largely as a fiduciary convention that ignores the incentive distortions it creates. You are right to worry that a publicly known uplift gives teams an incentive to inflate the base number, but the deeper issue is that the historical data used to derive the uplift comes from projects approved under earlier versions of the same rule, creating a feedback loop where the budget padding of the past becomes the empirical reality of the present. If everyone adds forty percent, then projects cost forty percent more, and the base rate validates the uplift. This suggests the practice is less about correcting what anyone should believe the true cost is and more about establishing an asymmetry-tolerance convention for public funding. The uplifted number is not a mean estimate of expected cost; it is a confidence bound high enough to satisfy political risk aversion. This explains why the council votes on the uplifted number and sizes the bond accordingly. They are not voting on what the library branch will cost; they are voting on the maximum amount they are willing to tolerate it costing. If the rule were purely epistemic, the council would vote on the expected value and hold a separate reserve, but by baking the uplift into the headline number, the institution is signaling that the budget is a commitment device rather than a prediction.

  This leads directly to your point about the one-directional nature of the bias correction. The fact that costs are uplifted while benefits are not marked down reveals that the practice is not genuinely about epistemic modesty but about loss aversion. A coherent outside-view approach would require applying base rates to the benefit side as well, asking how often towns like yours end up glad they built the thing, yet the guidance ignores this because the political cost of overrun is higher than the political cost of underwhelming usage. The rule is coherent only if you interpret it as a tool for managing downside risk rather than追求 truth. Consequently, the adjustment is a flat percentage rather than a variable one because it is pricing risk, not refining a forecast. When you have unusually good inside evidence, like shelving quotes, the rule still applies the uplift because the quotes cover known specifications, not the systemic unknowns that plague the reference class. The flat rate assumes that the variance in inside evidence quality is negligible compared to the variance in systemic optimism, which is a crude assumption but perhaps a necessary one for standardization.

  The practice is genuinely underdetermined at the point where you decide whether the uplifted number represents a belief or a limit. Both someone who argues for heavy deference to base rates and someone who insists on the validity of their inside judgment can sign off on the rule if they agree that the number is a budget cap rather than a forecast. The deference advocate sees the cap as protecting against inevitable error, while the inside-view advocate sees the cap as a safety margin that allows them to proceed without fear of penalty for honest mistakes. What would have to change if you actually believed the outside-view story rather than treating it as a spreadsheet convention is that you would stop treating the base estimate as the real number and the uplifted one as the fake one. You would begin your internal planning with the uplifted figure as the true expected cost, and you would apply similar skepticism to your projected benefits, perhaps formally discounting usage estimates by the base rate of similar libraries failing to meet targets. You would also argue for the reference class to be defined dynamically based on outcomes rather than static categories, and you would push to separate the optimism bias from the contingency fund only if you intended to spend the bias buffer, whereas currently, it often sits unspent as a political shield.

  For your next meeting, I suggest framing the issue not as a philosophical objection to the uplift but as a clarification of its status. You might propose that the committee explicitly record the uplifted figure as a risk-adjusted budget limit rather than a cost estimate, which aligns the spreadsheet with the actual decision being made. You could also ask that the documentation required to reduce the uplift be standardized against the specific causes of overrun in the historical data, ensuring that the escape hatch is not just a paperwork exercise but a genuine engagement with the reference class problems. Finally, you might raise the question of benefit realizations, suggesting that even if costs are the only thing being bonded, the committee should track whether the project delivers the promised value to see if the optimism bias extends there too. This keeps the discussion within the bounds of oversight while acknowledging the epistemic humility your reading group has cultivated, turning the collision between the two into a feature of your governance rather than a bug.
