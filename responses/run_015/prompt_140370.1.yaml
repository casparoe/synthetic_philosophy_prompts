      *   **Context:** They have to estimate cost/timeline, then a consultant adds a ~40% "optimism bias uplift" based on guidance (outside view/base rates). This uplift is separate from contingency. They can reduce it by documenting risk management (inside view).
      *   **Conflict:** The user is in a philosophy reading group discussing disagreement, epistemic modesty, and the reference class problem. They see parallels between the uplift rule and epistemic modesty (deferring to base rates vs. inside view).
      *   **Specific Questions/Issues to Address:**
          *   Reconstruct the implicit epistemology of the practice.
