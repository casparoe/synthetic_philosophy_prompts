      *   **Constraint:** Write as continuous prose (like an email). No headings, no bullet points, no bold text, no tables.

  2.  **Deconstruct the Epistemology:**
      *   The rule presupposes that individual planners are systematically biased (optimistic) and that aggregate historical data (reference class) is more reliable than specific project details (inside view).
      *   However, it allows the inside view to mitigate the uplift, suggesting a hybrid model: Base rate sets the prior, inside view provides the likelihood ratio to update away from the prior.
      *   The "one-directional" nature (cost up, benefits not down) suggests it's not purely epistemic but pragmatic/political (risk aversion regarding public funds).
      *   The separation of uplift and contingency suggests uplift is for "unknown unknowns" systemic to the *type* of project, while contingency is for "known unknowns" specific to *this* project.

  3.  **Address the Incentive Problem:**
      *   If the uplift is known, planners might inflate the base estimate knowing it will be cut, or inflate it knowing the uplift covers slack.
      *   The user notes the historical data comes from projects under earlier rules. This is a reference class instability.
