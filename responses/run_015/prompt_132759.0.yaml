  **Seminar Handout: Aristotelian Monetary Taxonomy**

  **Decision Node 1 (Root):** Does the fundamental objection to *tokos* rest on a biological metaphor (money lacks generative capacity) or an ethical function (accumulation undermines household self-sufficiency)?

  **Decision Node 2 (Branch A: Ethical):** When determining exchange-value (*axia*), is the binding standard strictly proportional reciprocity between producers, or does it rely fundamentally on matching mutual need?
  *   *Outcome:* **strict teleological limit** (Reciprocity)
  *   *Outcome:* **corruption-of-desire** (Need)

  **Decision Node 3 (Branch B: Biological/Splitter):** If the objection is biological, can money function as a universal measure and a tradable commodity simultaneously without logical conflict?
  *   *Outcome:* **exchange-tolerance** (No Conflict)
  *   *Outcome:* **[Vacant: Natural Infinite Acquisition]** (Yes Conflict)

  ***

  **Note on Indistinguishability:** The pair **strict teleological limit** and **corruption-of-desire** are difficult to separate in practice. In Aristotle's text, proportional reciprocity is often derived from the necessity of need-matching; distinguishing the *standard* (proportion) from the *cause* (need) creates a scholastic split that may not exist in the primary source.

  \answer{
  Root Question: Does the fundamental objection to tokos rest on a biological metaphor (money lacks generative capacity) or an ethical function (accumulation undermines household self-sufficiency)?
  Total Leaves: 4
  }
