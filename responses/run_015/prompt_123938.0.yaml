answer: |-
  Good evening, everyone. For those who don't know me, I am one of [Name]'s doctoral students. For those who do know me, you know exactly why I was nervous about accepting this invitation. Speaking about [Name]'s work is a bit like trying to describe the color blue to someone who has only seen shadows. It requires precision, but it also requires heart.

  We have a unique room tonight. Half of you know the technical stakes of her career; the other half know the warmth of her character. My challenge is to honor the work without losing the people, and to explain the ideas without flattening them into soundbites.

  There is a temptation when summarizing a career in philosophy of mind to say that [Name] "solved" the problem of consciousness. I will not say that. There is also a temptation to suggest she argued that consciousness is an illusion, or that she simply held the seat warm until neuroscience could catch up. I will not say that either. Her contribution was far more subtle, and in many ways, more difficult. She did not answer the hard question; she asked why we feel compelled to ask it in that specific way.

  She proposed that the mystery of consciousness is a meta-problem. It is an inquiry into why our conceptual scheme makes physical explanations feel necessarily incomplete when they address subjective experience. She didn't tell us the experience wasn't real. She told us to look at the lens through which we were viewing it.

  In her seminars, she often used a specific analogy to explain this, and I think it belongs here tonight. She asked us to imagine a flat map of the earth. If you take a local measurement on that map—say, the distance between two nearby cities—the measurement is accurate. The tool works locally. But if you look at the global projection, distances seem distorted. Greenland appears massive compared to Africa. The question is: is the land distorted? No. The distortion is a feature of the representational tool rather than a feature of the territory.

  [Name] spent her career arguing that the "gap" we feel between brain processes and subjective experience is like that distortion on the map. Our cognitive apparatus projects a certain shape onto reality. When we try to flatten the rich terrain of experience onto the grid of physical explanation, it feels like something is missing. She showed us that the distortion isn't necessarily in the world; it is in our cognitive apparatus.

  This is why our praise for her tonight must take a specific form. We are not thanking her for a scientific discovery, like finding a new planet or identifying a new neuron. We are honoring a conceptual achievement. She didn't add a new piece to the puzzle; she showed us that the frame around the puzzle was tilted. She relocated the mystery from the world into our thinking. That is a rare gift. It doesn't necessarily make the work easier—in fact, it often makes it harder, because it demands we scrutinize our own intuitions. But it makes the ground beneath us more solid.

  To the scientists here, she offered clarity on what their explanations are actually explaining. To the philosophers, she offered a way out of circular debates. And to her students, she offered something even more personal: she taught us that confusion is often data. When something feels inexplicable, that feeling itself is a phenomenon worthy of study.

  [Name], you have taught us that clarity is not the absence of mystery, but the precise location of it. You have given us better tools to think with, not just better answers to recite. You have mapped the mapmaker.

  So, I invite everyone to raise a glass. To [Name]. Thank you for showing us that the distortion was in the projection, and for helping us see the territory clearly. May your retirement be free of meta-problems, and full of accurate local measurements of joy, time, and love.

  To [Name].
