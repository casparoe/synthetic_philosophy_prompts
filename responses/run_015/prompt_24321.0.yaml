      *   **Constraint:** Do not just relabel; flag where database assumptions are smuggled in.
      *   **Goal:** Help the user understand if their framework resolves the philosophical tension or if the tension exists *outside* that framework.

  2.  **Deconstruct the Philosophical Debate (Parfit's Teletransporter):**
      *   *Scenario:* Scanner destroys body on Earth, reconstructs exact copy on Mars.
      *   *View 1 (Common Sense/Lockean):* Survival requires Identity. If the Mars person isn't *numerically identical* to the Earth person, you died.
      *   *View 2 (Parfit):* Identity isn't what matters. Relation R (Psychological Continuity + Connectedness) is what matters. You survive if R holds, even if Identity doesn't.
      *   *The Branching Case:* What if the scanner doesn't destroy the Earth body? Now there are two. Both claim Relation R. Neither can be *the* original in a strict identity sense (transitivity of identity fails: A=B and A=C implies B=C, but B!=C).
      *   *The "Further Fact":* Is there a hidden metaphysical fact about which one is "really" you? Parfit says no.

  3.  **Map to Database Concepts:**
      *   *The Person:* A Database Instance / State.
      *   *The Scanner/Transmission:* Backup/Restore or Replication Stream.
      *   *Earth Body:* Primary Node (Source).
      *   *Mars Body:* Replica / Standby promoted to Primary.
      *   *Destruction of Earth:* Failover with decommissioning of old primary.
      *   *Non-Destruction (Branching):* Split-Brain / Fork.
      *   *Psychological Continuity (Relation R):* Data Consistency / Transactional Integrity / Logical Replication.
      *   *Identity:* UUID / Inode / Physical Hardware ID.
      *   *RPO:* How much data (memory/experience) can we lose? (Parfit's "Connectedness").
      *   *RTO:* How long until service is restored? (Parfit's "Continuity" gap).

  4.  **Drafting the Restatement (The "DB Engineer's Parfit"):**
      *   *Standard Failover:* Earth Primary snapshots state, sends to Mars. Earth shuts down. Mars promotes to Primary.
          *   *DB View:* This is a clean failover. Service continues.
          *   *Phil View:* Did "You" survive?
      *   *The Identity Question:* Is the Mars Primary the "same" database as the Earth Primary?
          *   *DB View:* Depends on definition. Same UUID/Lineage? Yes. Same physical bits? No.
          *   *Phil View:* Is it numerically identical?
      *   *The Branching Case (Fork):* Earth doesn't shut down. Now two Primaries with same initial state.
          *   *DB View:* Split-brain. Data divergence. Need to pick one or merge.
