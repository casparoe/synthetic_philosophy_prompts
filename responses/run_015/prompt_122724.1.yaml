  *   **Failed:** The moral claim cannot be expressed. RL has no concept of "indefensible," only "convergent" or "optimal." The contestation of well-being is invisible; RL assumes $r$ is ground truth.

  **Flagged Mismatches**
  1.  **Agent Identity:** In RL, $\sum \gamma^t r_t$ aggregates rewards for *one* agent. Social discounting aggregates welfare for *distinct* people. To translate faithfully, you must model this as a multi-agent chain where Generation $t$ is the agent, and the "bequest" (state $s_{t+1}$) is the value function passed to Generation $t+1$. Standard RL maximizes self-interest over time; social discounting maximizes collective welfare across agents. Using a single-agent return smuggles in the assumption that generations are temporal slices of one entity.
  2.  **Reward Specification:** In RL, $r(s,a)$ is given. In economics, utility $u(c)$ is contested (what counts as well-being?). Treating utility as a fixed reward function hides the ethical debate about what constitutes a "good" state.

  **Diamond and Partial Orders**
  Your suspicion is mathematically astute but ethically reductive. Diamond's impossibility arises because a complete, continuous ordering cannot respect both Pareto and Anonymity on infinite streams. RL handles $\gamma=1$ via partial orders (Blackwell optimality, overtaking): Policy $\pi$ beats $\pi'$ if it yields higher return in the limit, without requiring a scalar value for every trajectory.
