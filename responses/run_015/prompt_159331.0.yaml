answer: |-
  **Joint Statement on the Ethics of Belief**

  We, the undersigned Cliffordians and Jamesians, submit this record of our adversarial collaboration on the ethics of belief. We agree on the terrain of dispute but refuse to dissolve the conflict into compromise or declare a victor. This document maps our overlap and divergence without adjudication.

  **Agreed Claims**

  1.  **The Shipowner:** Both condemn the shipowner who sailed an unsafe vessel. Cliffordians cite insufficient evidence; Jamesians cite that the option was not genuine (investigation was possible). *Cliffordians concede not all false belief is equally wrong; Jamesians concede not all risky belief is permissible.*
  2.  **Belief:** We define belief as a cognitive state taking a proposition to be true, distinct from acting as if it were true. *Jamesians concede action does not require belief; Cliffordians concede belief is not always involuntary.*
  3.  **Evidence:** We define evidence as grounds probabilistically supporting a proposition's truth, distinct from benefits of believing. *Cliffordians concede evidence is not always available; Jamesians concede benefits do not constitute evidence.*
  4.  **Action Without Belief:** Agents may act on a hypothesis without believing it true. *Both concede commitment does not require conviction.*
  5.  **Inquiry Costs:** Investigation consumes time and resources that might otherwise be used. *Cliffordians concede inquiry is not costless; Jamesians concede costs do not always justify belief.*
  6.  **Options:** We define an option as a choice between hypotheses; it is genuine when forced, living, and momentous. *Cliffordians concede genuine options exist; Jamesians concede most options are not genuine.*
  7.  **Truth Goal:** The primary aim of inquiry is truth, not comfort or utility. *Jamesians concede utility does not trump truth; Cliffordians concede truth is not always accessible.*
  8.  **Governance:** Institutions require rules for evidence acceptance that individuals may not. *Both concede individual ethics do not scale perfectly to institutions.*

  **Disagreements**

  | Disagreement | Cliffordian Formulation | Jamesian Formulation | Status |
  | :--- | :--- | :--- | :--- |
  | **Permissibility** | Belief permissible only when evidence suffices. | Belief permissible when option is genuine and evidence insufficient. | Genuine |
  | **Withholding** | Withholding is a neutral duty to avoid error. | Withholding is a risked decision equivalent to believing false. | Genuine |
  | **Origin** | Wrongness attaches to how belief was gotten. | Wrongness attaches to consequences of withholding. | Genuine |

  **Cruxes**

  | Crux | Settlement Condition & Case | Predictions (Cliffordian / Jamesian) |
  | :--- | :--- | :--- |
  | **Availability** | Cost of delay vs. value of certainty. Case: ICU team during novel illness. | Inquiry always possible / Waiting kills the hypothesis. |
  | **Substitute** | Outcomes of "acceptance" vs. "belief." Case: Founder committing to therapy platform. | Protocol suffices for funding / Belief required for persistence. |
  | **Self-Referential** | Participation rates in belief-sensitive systems. Case: Collective-action fund solvency. | Signaling suffices / Genuine belief required for stability. |
  | **Closure** | Institutional error rates under fixed deadlines. Case: Regulatory approval dates. | Deadlines force unethical belief / Deadlines force necessary commitment. |
  | **Stakes** | Irreversible opportunity outcomes. Case: One-time expedition. | Evidence bar stays fixed / Momentousness lowers evidence bar. |

  **Closing**

  Cliffordians concede evidentialism is too strict if withholding belief systematically destroys truth-tracking capacity. Jamesians concede the permission is empty if it licenses belief where evidence is readily available. We sign acknowledging that the duty to inquire and the right to believe remain in tension.
