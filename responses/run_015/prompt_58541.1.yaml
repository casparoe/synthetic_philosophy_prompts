answer: |-
  This is a sophisticated observation of social dynamics. You have correctly identified that while this situation feels like a "Tragedy of the Commons," it lacks the defining economic characteristic of that phenomenon (rivalrous depletion). You have also noted that while it involves "free riding," it is not on the *consumption* of a benefit, but on the *costly enforcement* of a norm.

  ### 1. Established Designation

  Yes, this arrangement has an established designation in game theory, sociology, and institutional economics, though it is rarely discussed outside academic circles. The precise technical term is **Second-Order Free Riding** (or the **Second-Order Collective Action Problem**).

  In the literature on public goods and norm enforcement (e.g., work by Elinor Ostrom, Robert Boyd, and Peter Richerson), a distinction is made between:
  *   **First-Order Behavior:** Contributing to the public good (e.g., cleaning your own dishes, posting accurate information).
  *   **Second-Order Behavior:** Punishing or correcting those who do not contribute (e.g., confronting the mess-maker, correcting the inaccurate post).

  **Second-Order Free Riding** occurs when individuals benefit from a system where norms are enforced, but they refuse to bear the personal cost of enforcing those norms themselves. They hope others will absorb the social friction, time, or emotional labor required to correct the defectors.

  ### 2. Distinction from Neighboring Phenomena

  To distinguish this from the more common concepts you mentioned, we must look at the **rivalry** of the resource and the **locus of the cost**.

  | Phenomenon | Resource State | The Cost | The Failure |
  | :--- | :--- | :--- | :--- |
  | **Tragedy of the Commons** | **Rivalrous & Depletable** (e.g., fish, grass, bandwidth). | **Overuse.** My use reduces what is available for you. | **Depletion:** The resource is exhausted because everyone takes too much. |
  | **Standard (First-Order) Free Riding** | **Non-Rivalrous** (e.g., lighthouse, public park). | **Provision.** Someone must build/maintain the good. | **Under-Provision:** Everyone consumes the benefit, but no one contributes labor/resources to create it. |
  | **Your Scenario (Second-Order Free Riding)** | **Non-Rivalrous** (Order/Accuracy). | **Enforcement.** Someone must risk social conflict to maintain the standard. | **Under-Enforcement:** Everyone wants the order/accuracy, but no one wants to pay the *social cost* of correcting the violators. |

  **Key Distinction:** In a standard free-rider problem, I avoid the *labor* of cleaning. In your scenario, you describe the barrier as the *confrontation*. Even if I am willing to clean, I may not be willing to tell *you* that you made the mess, because that invites dispute. The "resource" being depleted is not the kitchen or the forum, but the **social capital** required to maintain norms.

  ### 3. Proposed Term and Definition

  While "Second-Order Free Riding" is the academic term, it is jargon-heavy and implies a game-theoretic context that may not resonate with volunteers or lab members. If you wish to introduce a designation that captures the specific nuance of *social friction* and *norm erosion*, I propose the term:

  **The Norm Maintenance Dilemma**

  **Definition:**
  > A collective action problem in which a shared environment remains functional and non-depletable, yet degrades in quality because the cost of maintaining standards is primarily **social** (confrontation, dispute, policing) rather than **material** (labor, money). Members benefit from the maintained norm but individually defer the social risk of enforcement, hoping others will absorb the conflict.

  ### 4. Boundary Cases

  To ensure this term is not applied too broadly, here are the boundary cases that separate the **Norm Maintenance Dilemma** from its neighbors:

  *   **Boundary Case 1: Simple Negligence (Standard Free Riding)**
      *   *Scenario:* A member leaves a mess simply because they are lazy and hope someone else will *clean it up* (do the labor).
      *   *Distinction:* If the solution requires only physical labor (sweeping), it is a First-Order Free Rider problem. If the solution requires *telling the member to sweep* (social risk), it is a Norm Maintenance Dilemma.
  *   **Boundary Case 2: Resource Depletion (Tragedy of the Commons)**
      *   *Scenario:* Members use up all the communal milk or occupy all the workspace simultaneously.
      *   *Distinction:* Here, the resource is rivalrous; one person's use physically prevents another's. In the Norm Maintenance Dilemma, the resource (order/accuracy) is non-rivalrous; its degradation is due to *neglect*, not *consumption*.
  *   **Boundary Case 3: Pluralistic Ignorance (Psychological Phenomenon)**
      *   *Scenario:* Everyone privately dislikes the mess but assumes everyone else is okay with it, so no one speaks up.
      *   *Distinction:* Pluralistic Ignorance is the *psychological mechanism* that fuels the Norm Maintenance Dilemma. The Dilemma is the *structural outcome*. You can have the Dilemma even without Ignorance (e.g., everyone knows everyone hates the mess, but no one wants to be the "bad guy").
  *   **Boundary Case 4: Malicious Sabotage**
      *   *Scenario:* A member intentionally leaves messes to annoy others.
      *   *Distinction:* This is a security or disciplinary issue, not a collective action dilemma. The Norm Maintenance Dilemma assumes members generally *value* the norm but are unwilling to pay the enforcement cost.

  ### Practical Application

  When addressing this in your kitchen or forum, labeling it can help. If you tell members, "We are suffering from free-riding," they think, "I should clean more." If you tell them, "We are facing a **Norm Maintenance Dilemma**," it shifts the focus: "I don't just need to clean; I need to be willing to gently correct others, and I need to support those who do."

  It reframes the "confrontation" not as personal nagging, but as a necessary contribution to the public good, equivalent to sweeping the floor.
