answer: |-
  You are grappling with the central ethical tension of our genre: the conflict between the historian's duty to the evidence and the novelist's duty to the human truth. Your current rules (Silence vs. Record; Interiority vs. Fact) are descriptive of your instincts, but they fail as prescriptive laws because they do not account for *harm*, *proximity*, or the *nature of the claim* you are making.

  Based on your twelve verdicts, I propose a single governing framework: **The Principle of Fiduciary Imagination.**

  As a writer of documentary fiction, you are a trustee for the dead. You hold their silence in trust. You may spend that silence, but you may not squander it, and you must not profit from it in a way that damages their legacy or their descendants.

  Here is the principle stated precisely, clause by clause.

  ### The Principle of Fiduciary Imagination

  **Clause 1: The Integrity of the Trace.**
  You may not invent biographical facts or events for a named historical person that, had they occurred, would likely have left a documentary trace, or that contradict the probable truth of the existing record.
  *   **Motivating Cases:** Case 2 (the bribe), Case 6 (burning the letter), Case 8 (using a real clerk's name for merged deeds).
  *   **Rationale:** This protects the historical record from contamination. A bribe leaves a paper trail or a whisper; burning a letter alters the archival landscape; merging clerks under a real name distorts the specific individual's labor history.

  **Clause 2: The Sovereignty of the Named.**
  You may invent interiority (thoughts, motives, feelings) for named historical persons, but you may not invent definitive biographical history (childhoods, relationships, specific traumas) for them where the archive is silent.
  *   **Motivating Cases:** Case 1 (MP's motives = Fine), Case 4 (Real woman's childhood = Not Fine), Case 5 (Attributing words = Not Fine).
  *   **Rationale:** Interiority is the novelist's jurisdiction; biography is the historian's. We can imagine *why* an MP voted, but we cannot claim *what happened to him* as a child without evidence. To invent a traumatic childhood for a real woman is to appropriate her identity in a way inventing a motive for a public vote is not.

  **Clause 3: The Protection of the Living.**
  You may not invent damaging, intimate, or shameful details for historical persons who have living descendants or who fall within living memory, regardless of whether you change their name.
  *   **Motivating Cases:** Case 9 (Shameful act/relatives), Case 12 (1971 death/grandchildren).
  *   **Rationale:** Ethical duty shifts from the dead to the living. Harm is no longer theoretical. Recognizability trumps nominal disguise.

  **Clause 4: The Ethics of the Gap.**
  You are permitted, and often obligated, to invent full humanity for the unrecorded (the poor, the enslaved, the marginalized), provided you do not mimic archival authority or claim a specificity that forecloses their mystery.
  *   **Motivating Cases:** Case 3 (Housemaid = Fine), Case 7 (Fake diary = Not Fine without note), Case 10 (Enslaved people = Fine/Debated), Case 11 (Refusals = Fine).
  *   **Rationale:** Silence is often a violence. Restoring humanity is an act of justice. However, presenting fiction as archive (Case 7) is a lie, and giving false specificity to the erased (Case 10) risks repeating the erasure by making them legible only on your terms.

  ***

  ### Accommodations and Overturns

  This principle accommodates ten of your twelve verdicts cleanly. It explains why the MP's vote (interiority) is permissible while his bribe (event) is not (Clause 1 vs. 2). It explains why the housemaid (invented) can have a childhood while the real woman (named) cannot (Clause 2). It explains the sensitivity around living relatives (Clause 3).

  However, there are two verdicts I believe you should **overturn** or significantly revise:

  **1. Overturn Case 1 (The MP's Bankruptcy):**
  Your verdict was "Fine." My principle challenges this. You invented a specific biographical fact: "a memory of his father's bankruptcy." If the father is a real person, this is a falsifiable claim that violates Clause 1 (Integrity of the Trace). If the father is unknown, it borders on Clause 2 (Sovereignty).
  *   **Correction:** You may invent the *feeling* of financial pressure or the *fear* of bankruptcy, but you should not invent the *fact* of a father's bankruptcy. Keep the invention in the realm of psychology, not genealogy.

  **2. Overturn Case 10 (The Enslaved on the Bill of Sale):**
  Your verdict was "Fine." Your friend's objection is ethically stronger. Giving them specific names and families risks "filling the silence" in a way that makes them digestible props for the reader's empathy, rather than honoring the horror of their erasure. It violates the second half of Clause 4 (do not claim specificity that forecloses mystery).
  *   **Correction:** It is permissible to give them interiority and voice, but you should hesitate to give them the *novelistic comfort* of a fully reconstructed family tree if the archive deliberately destroyed it. Consider leaving some gaps open. Acknowledge in an afterword that these names are restorations, not recoveries.

  ***

  ### Predictions for Unsettled Cases

  Here is how the Principle of Fiduciary Imagination predicts you should handle the cases you have not yet settled:

  **1. A novel narrated by an invented archivist who presents fabricated documents as real inside the fiction.**
  *   **Verdict:** **Not Fine** (unless rigorously framed).
  *   **Reasoning:** This violates Clause 4 (Ethics of the Gap) and Case 7. If the text mimics an archival shelfmark or presents a fake document as a real facsimile without clear fictional framing, you are lying to the reader about the nature of evidence. If the narrator explicitly states, "I am constructing this," it becomes a meta-fictional device and is permissible. If the book invites the reader to believe the documents are real, it breaches the contract of epistemic honesty.

  **2. Depicting a documented atrocity through invented witnesses.**
  *   **Verdict:** **Fine, with constraints.**
  *   **Reasoning:** This is often the only way to make the scale of atrocity comprehensible (Clause 4). However, you must not invent *specific victims* who are known to have died. The witnesses must be composites or entirely invented. You cannot give a named victim a fictional death scene. The invention must serve the truth of the event, not the drama of the plot.

  **3. Inventing interiority for a real person who left an enormous archive vs. almost none.**
  *   **Verdict:** **The density of the record constrains you.**
  *   **Reasoning:** This is the **Inverse License Rule.** The more we know about a person (e.g., Samuel Pepys), the less license you have to invent their interiority, because you are more likely to contradict their known psyche. The less we know (e.g., a soldier in a muster roll), the more license you have, because there is less risk of contradiction. Paradoxically, silence licenses imagination; evidence restricts it.

  **4. One invented character made to stand for an entire unrecorded class.**
  *   **Verdict:** **Fine, but dangerous.**
  *   **Reasoning:** This is a composite character (Case 3/8). It is permissible under Clause 4. However, you must avoid making them "too representative." If they embody every virtue or every tragedy of their class, they cease to be human and become a thesis statement. They must be allowed to be idiosyncratic, even if that idiosyncrasy is invented.

  **5. Whether the genre's contract (historical novel vs. documentary fiction) ought to matter.**
  *   **Verdict:** **Yes, it matters immensely.**
  *   **Reasoning:** Your Case 7 (the diary) proves this. Readers approach "Historical Fiction" expecting invention in the gaps. They approach "Documentary Fiction" or "Biographical Novel" expecting higher fidelity.
  *   **Prediction:** If you market the book as a "novel based on archival research," you have more license (Clause 4). If you market it as "the story of [Real Person]," you are bound by Clause 2 (Sovereignty). You cannot hide behind the genre to excuse harm (Clause 3), but the genre dictates the reader's expectation of truth. You should clarify this contract in an Author's Note.

  ### Summary

  Your instinct that "silence is silence" (Clause i) is too blunt. Silence is not empty space; it is often a wound. Your instinct that "interiority is free" (Clause ii) is mostly correct, but only if it doesn't harden into biographical fact.

  Adopt **The Principle of Fiduciary Imagination.** It shifts the question from "Can I prove this didn't happen?" to "Do I have the right to claim this did?" It protects the record from falsification, the dead from appropriation, the living from harm, and the reader from deception, while preserving your essential right to breathe life into the dust.
