  ## TA Tips for Discussion Section

  1.  **Push on Fairness:** Ask students: "Is $(10, 2)$ fair?" They will say no. Ask: "Is it rational?" Yes. This highlights that Program Equilibrium solves the *efficiency* problem of the Prisoner's Dilemma but not the *bargaining* problem.
  2.  **Push on Length:** Ask: "If $P_2$ is smart, why doesn't she just write a shorter program that forces $(I, L)$?"
      *   *Answer:* She can't. To force $(I, L)$, she needs to distinguish between $P_1$'s "Exploitative Bot" and $P_1$'s "Fair Bot". That distinction requires logic (lines of code) she doesn't have. She is forced to treat all "Invest" bots the same.
  3.  **Push on Security:** Ask: "What if $P_1$ makes a typo and accidentally includes the string `'return S'` in a comment?"
      *   *Answer:* $P_1$ gets punished. This shows the fragility of program equilibria based on string matching vs. formal verification.
