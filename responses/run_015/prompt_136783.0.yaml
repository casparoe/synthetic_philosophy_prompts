  # Problem Set Module: Asymmetric Program Equilibrium

  ## Part 1: The Setup (Student Handout)

  **Context:** Recall the standard Program Equilibrium setup (Tennenholtz 2004). Two players, $P_1$ and $P_2$, submit deterministic programs $\pi_1, \pi_2$. Each program takes the *source code* of the opponent's program as input and outputs an action from a finite set. The payoff is determined by the action profile $(\pi_1(\pi_2), \pi_2(\pi_1))$ according to a base game matrix.

  **The Base Game:** Consider the "Unequal Partnership" game below. $P_1$ chooses a Row, $P_2$ chooses a Column.

  | $P_1 \setminus P_2$ | **Share-H** ($H$) | **Share-L** ($L$) | **Steal** ($S$) |
  | :--- | :---: | :---: | :---: |
  | **Invest** ($I$) | $10, 3$ | $3, 10$ | $0, 5$ |
  | **Hold** ($O$) | $2, 1$ | $2, 1$ | $\mathbf{2, 2}$ |

  1.  **Base Analysis:** Identify the unique pure-strategy Nash Equilibrium (NE) of the base game and the payoffs. Identify the two Pareto-optimal cooperative outcomes.
  2.  **Program Equilibrium Construction:** Construct a pair of programs $(\pi_1, \pi_2)$ that form a Program Equilibrium yielding the outcome $(I, H)$ with payoffs $(10, 3)$.
      *   $\pi_1$ may be arbitrarily long.
      *   $\pi_2$ is strictly limited to **4 lines of pseudocode**.
      *   You may assume programs have read-access to the opponent's source code via a function `read_opponent()`.
      *   *Constraint:* To avoid infinite recursion, assume programs perform **static analysis** on the opponent's source code rather than executing it. (e.g., `if opponent_source contains "return H"`).
  3.  **The Length Wrinkle:** Explain why $P_2$ cannot force the outcome $(I, L)$ (payoffs $3, 10$) given the 4-line constraint, whereas $P_1$ can force $(I, H)$. What specific logical capability is $P_2$ missing?
  4.  **Theory Question:** In general, for any 2-player game, characterize the set of payoff profiles $(u_1, u_2)$ that can be sustained as a deterministic Program Equilibrium. How does this relate to the Minimax/Security values of the base game?

