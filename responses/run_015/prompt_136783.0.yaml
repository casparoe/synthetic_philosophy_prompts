  ## Part 2: Instructor's Guide & Solutions

  ### 1. Base Game Analysis
  *   **Unique NE:** $(Hold, Steal)$ with payoffs $(2, 2)$.
      *   *Reasoning:* For $P_2$, $Steal$ strictly dominates $Share-H$ and $Share-L$ if $P_1$ plays $Hold$ (2 vs 1). If $P_1$ plays $Invest$, $Steal$ yields 5, which is better than $Share-H$ (3) and $Share-L$ (10) *for P2*? Wait, check matrix.
      *   *Correction for Matrix Consistency:* In the matrix above, if $P_1$ plays $Invest$, $P_2$ prefers $Share-L$ (10) over $Steal$ (5). So $(Invest, Steal)$ is not an NE.
      *   *Let's fix the matrix to ensure unique NE at (Hold, Steal).*
      *   **Revised Matrix for Solution:**
          *   $(I, H) \to (10, 3)$
          *   $(I, L) \to (3, 10)$
          *   $(I, S) \to (0, 4)$  (Steal must be tempting if P1 invests, but we need (O,S) to be the NE).
          *   $(O, H) \to (2, 0)$
          *   $(O, L) \to (2, 0)$
          *   $(O, S) \to (2, 2)$
      *   **NE Check:**
          *   If $P_1=O$, $P_2$ prefers $S$ (2) over $H,L$ (0).
          *   If $P_2=S$, $P_1$ prefers $O$ (2) over $I$ (0).
          *   So $(O, S)$ is a pure NE.
          *   Is it unique? If $P_1=I$, $P_2$ prefers $L$ (10). If $P_2=L$, $P_1$ prefers $I$ (3) over $O$ (2). So $(I, L)$ is *also* a NE in this revision.
      *   **Goal:** We need a **Unique** NE at $(O,S)$ to make the Program Equilibrium Pareto-improvement meaningful.
      *   **Final Matrix Fix:** Make $Steal$ dominant for $P_2$ regardless of $P_1$, but make $(I, H)$ socially optimal.
          *   $P_2$ Payoffs: $S=4$ (always), $H=3$ (if $I$), $L=2$ (if $I$).
          *   $P_1$ Payoffs: $I=10$ (if $H$), $I=0$ (if $S$), $O=2$ (always).
          *   Now $P_2$ always plays $S$ in the base game. $P_1$ best responds with $O$. Unique NE: $(O, S) \to (2, 4)$.
          *   Target PE: $(I, H) \to (10, 3)$.
          *   Wait, $P_2$ gets 3 in Target vs 4 in NE. $P_2$ won't accept this.
      *   **Okay, let's go back to the Prompt's requirement:** "Fallback (everybody defects) is bad enough that even a raw deal beats it."
      *   So NE payoff must be *lower* than the lopsided cooperative payoff for *both* players.
      *   **Final Valid Matrix:**
          *   $(O, S) \to (1, 1)$ [NE]
          *   $(I, H) \to (10, 2)$ [P1 Favored Coop]
          *   $(I, L) \to (2, 10)$ [P2 Favored Coop]
          *   $(I, S) \to (0, 5)$ [P1 Sucker]
          *   $(O, H/L) \to (1, 0)$ [P2 Wasted Effort]
      *   **NE:** $P_2$ compares $S(5 \text{ or } 1)$ vs $H/L(2 \text{ or } 0)$. If $P_1=I$, $P_2$ picks $S(5)$. If $P_1=O$, $P_2$ picks $S(1)$. $S$ is dominant for $P_2$.
      *   Given $P_2=S$, $P_1$ picks $O(1)$ over $I(0)$.
      *   **Unique NE:** $(O, S)$ with payoffs $(1, 1)$.
      *   **Target:** $(I, H)$ with payoffs $(10, 2)$. Both $>1$. Lopsided (P1 gets +9, P2 gets +1).

  ### 2. Program Equilibrium Construction

  **Player 1 (Long Program):**
  ```python
  def P1(opponent_source):
      # Check if opponent is committed to playing H when P1 plays I
      # This requires parsing opponent logic to ensure they don't play S
      if "return H" in opponent_source and "return S" not in opponent_source:
          return I  # Invest
      else:
          return O  # Hold (Punish)
  ```

  **Player 2 (Short Program - 4 Lines):**
  ```python
  def P2(opponent_source):
      # Simple reciprocity: Can only check if P1 Invests
      if "return I" in opponent_source: 
          return H  # Share-High (Hardcoded bias due to length limit)
      else: 
          return S  # Steal
  ```

  **Why this is an Equilibrium:**
  *   **P2's perspective:** Given P1's code, P2 sees `"return I"`. P2 plays $H$. Payoff 2. If P2 changes code to play $S$, P1's check `"return S" not in opponent_source` fails. P1 plays $O$. P2 gets 1. So P2 sticks with $H$.
  *   **P1's perspective:** Given P2's code, P1 sees `"return H"` and no `"return S"`. P1 plays $I$. Payoff 10. If P1 plays $O$, payoff 1. P1 sticks with $I$.
  *   **Result:** $(I, H)$, Payoffs $(10, 2)$. Pareto dominates NE $(1, 1)$.

  ### 3. The Length Wrinkle (Analysis)

  **Does the handicap buy Player 1 anything?**
  Yes, it dictates **Equilibrium Selection**.

  *   **The Constraint:** $P_2$'s 4-line limit prevents $P_2$ from implementing a "Fairness Check." $P_2$ can check *what* $P_1$ does ($I$ vs $O$), but $P_2$ does not have the code space to check *under what conditions* $P_1$ does it.
  *   **The Exploitation:** $P_1$ wants outcome $(I, H)$ (Payoff 10). $P_2$ would prefer $(I, L)$ (Payoff 10).
  *   **If $P_2$ were Long:** $P_2$ could submit:
      ```python
      if "return I" in opponent_source:
          if "guarantee_P2_payoff >= 5" in opponent_source: return L
          else: return S # Punish unfair cooperation
      else: return S
      ```
      This would force $P_1$ to either concede to $(I, L)$ or revert to NE.
  *   **With $P_2$ Short:** $P_2$ cannot encode the conditional threat "I will Steal unless you promise me a fair share." $P_2$ is forced into a simple "Tit-for-Tat" on actions. Since $P_1$ moves first in the meta-game (by submitting source), $P_1$ selects the specific cooperative equilibrium $(I, H)$ that $P_2$'s simple bot accepts.
  *   **Conclusion:** Program length asymmetry breaks the symmetry of bargaining power. The complex agent can verify the simple agent's compliance with a specific favorable outcome, while the simple agent lacks the complexity to demand a different split.

  ### 4. Theory: The Program Equilibrium Folk Theorem

  **Question:** Which splits are sustainable?
  **Answer:** Any payoff profile $(u_1, u_2)$ that is **Feasible** and **Individually Rational (IR)**.

  *   **Feasible:** There exists an action profile $(a_1, a_2)$ in the base game yielding $(u_1, u_2)$. (In repeated games, this is the convex hull; in one-shot program equilibrium, it is restricted to pure profiles unless programs use public randomness, which you excluded).
  *   **Individually Rational:** $u_i \geq v_i$, where $v_i$ is $P_i$'s **Minimax value** (or Security Level) in the base game.
      *   In our example, $v_1 = 1, v_2 = 1$ (from the NE $(O,S)$).
      *   The outcome $(10, 2)$ is IR because $10 \ge 1$ and $2 \ge 1$.
      *   The outcome $(2, 10)$ is also IR.
      *   An outcome like $(10, 0)$ would *not* be sustainable as a PE because $P_2$ could simply submit a program that always plays $Steal$, guaranteeing themselves 1 (the NE payoff). $P_2$ will never accept a program equilibrium yielding less than their security level.

  **Formal Statement:** In a one-shot program equilibrium game with deterministic programs and full source access, the set of equilibrium payoffs coincides with the set of feasible, individually rational payoffs of the underlying game, *provided* the program space is rich enough to encode conditional threats for every action profile. (See *Fortnow et al., 2008* or *LaVictoire et al., 2014* for formal proofs).

  ### 5. Safety & Simulation Detection (The "Gotcha")

  **The Problem:** The pseudocode above uses string matching (`"return I" in source"`). If students propose **simulation** (e.g., `if opponent(self) == I`), you must flag the **Halting/Recursion Problem**.

  *   **Recursion:** If $\pi_1$ runs $\pi_2(\pi_1)$ and $\pi_2$ runs $\pi_1(\pi_2)$, the programs enter an infinite loop.
  *   **The Fix:**
      1.  **Proof-Based Agents (Löbian Cooperation):** Instead of simulating, programs search for a formal proof that `opponent(self) == Action`. This avoids execution loops. (This is the "PrudentBot" approach).
      2.  **Static Analysis:** As used in the solution above. Programs inspect source code text/AST without executing.
      3.  **Timeouts:** If simulating, hard code a step limit. If opponent doesn't halt, Defect.
  *   **Simulation Detection:** If $P_1$ simulates $P_2$, $P_2$ might try to detect if it is being simulated (e.g., checking system time or call stack depth). If $P_2$ detects simulation, it might cooperate to trick $P_1$, but defect in reality.
      *   *Instructor Note:* In the "Static Analysis" model required for the length constraint to work cleanly, simulation detection is impossible because no execution occurs. If you allow execution, you must assume a "Sandbox" where the program cannot distinguish simulation from reality, or the equilibrium collapses into "always defect" to avoid being exploited by simulators.

