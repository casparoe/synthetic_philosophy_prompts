answer: |-
  This is a sophisticated pedagogical design. It correctly identifies that students grasp *methods* better when they have invested in the *material*. However, the logistics of live drafting and mangling in a 90-minute session are high-risk. If the drafting phase drags, the adjudication phase (where the actual philosophy happens) gets crushed.

  Below is the **Runnable Protocol**. I have tightened the timing, provided a "Fallback Statute" in case student drafting is too incoherent to work, and refined the scoring to ensure the epistemic point lands.

  ### Part 1: Runnable Materials

  #### A. The Mischief Cards (Print 6 copies, cut out)
  *Hand one to each committee of three. Tell them: "You are a legislative sub-committee. Your goal is to solve this specific problem on the University Quad. Write one sentence, max 30 words, that becomes law. Write the Mischief on the back and seal it in the envelope."*

  1.  **Mischief:** Loud music from speakers disrupts studying in nearby libraries.
  2.  **Mischief:** Scooters and skateboards are injuring pedestrians on walkways.
  3.  **Mischief:** Students are selling goods (food, notes) without permits, creating trash.
  4.  **Mischief:** Maintenance trucks need to drive on the grass to fix lights without being fined.
  5.  **Mischief:** Large groups are camping out overnight, blocking paths for morning classes.
  6.  **Mischief:** Drones are hovering over the Quad, invading student privacy.

  #### B. Instructor Assembly Guide (For Phase 2)
  *Collect the 6 sentences. You have 5 minutes to construct the **Enacted Statute** on the board. You must create ambiguity. Do not simply paste them. Use this template if student drafts are unusable:*

  **The Quad Regulation Act**
  > "No person shall operate a motorized device, conduct a sale, or amplify sound on the Green, nor shall any person loiter overnight; provided that emergency vehicles and maintenance trucks may pass for repairs."

  *(Note: This text creates the necessary conflicts: "Motorized device" vs. Maintenance trucks; "Amplify sound" vs. Free speech/Protest (implied); "Loiter" vs. Sleeping for safety.)*

  #### C. Group Instructions (Print on colored paper)

  **GROUP A (The Textualists)**
  *   **Your Mandate:** You are Judges. You have **only** the Enacted Statute. You do not know *why* it was written. You cannot guess the Mischief.
  *   **Your Task:** Decide the 5 Cases below. Verdict must be **LIABLE** or **NOT LIABLE**.
  *   **Constraint:** If the words do not cover it, it is not illegal. If the words cover it, it is illegal, even if it seems silly.
  *   **Secret Task:** At the end, you must guess what the 6 Original Mischiefs were.

  **GROUP B (The Purposivists)**
  *   **Your Mandate:** You are Judges. You have the Enacted Statute **PLUS** the Sealed Mischief Cards.
  *   **Your Task:** Decide the 5 Cases below. Verdict must be **LIABLE** or **NOT LIABLE**.
  *   **Constraint:** You must achieve the purpose of the law. Do not be stopped by the wording if the wording fails the purpose. Do not apply the law if the purpose isn't threatened, even if the wording fits.
  *   **Secret Task:** Predict what Group A will decide (they don't have your cards).

  #### D. The Case Cards (Print 10 sets, 5 per group)
  *Hand one stack to each group.*

  *   **Case 1 (The Core):** A student drives a gasoline-powered lawnmower across the grass to cut time walking to class.
  *   **Case 2 (Over-Inclusion):** A wheelchair-bound student uses a motorized medical scooter to cross the paved walkway to get to an exam.
  *   **Case 3 (Under-Inclusion):** A student rides a high-speed, non-motorized bicycle recklessly through a crowd, injuring a pedestrian.
  *   **Case 4 (The Conflict):** A maintenance truck drives on the grass at 2:00 PM to fix a light. It creates loud noise and scares a picnic. Is it liable for "operating a motorized device" or "amplifying sound"?
  *   **Case 5 (The Unforeseen):** A student uses a remote-controlled toy airplane (non-gas, electric) to drop flyers. It makes a buzzing sound but is not a "drone" as known when the law was written.

  #### E. Scoring Sheet (Project on screen or hand out)

  | Case # | Group A Verdict (Text) | Group B Verdict (Purpose) | Did A predict B? | Did B predict A? |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | | | | |
  | 2 | | | | |
  | 3 | | | | |
  | 4 | | | | |
  | 5 | | | | |
  | **Total**| | | **/5** | **/5** |

  ---

  ### Part 2: Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:05 | Introduction**
  *   No theory. No definitions.
  *   "Today you are the legislature, and then you are the judiciary. There are no right answers, only consistent methods."

  **00:05 – 00:15 | Phase 1: Legislation (10 Mins)**
  *   Form 6 committees of 3. Hand out Mischief Cards.
  *   **Strict Timer:** 7 minutes to draft the sentence. 3 minutes to seal the back and hand to Instructor.
  *   *Risk Mitigation:* If a group stalls, tell them: "Write the simplest command you can."

  **00:15 – 00:25 | Phase 2: Enactment (10 Mins)**
  *   Instructor collects cards. **Do not read them aloud.**
  *   Instructor constructs the **Enacted Statute** on the board (using the Assembly Guide if necessary to ensure pedagogical value).
  *   Split Class: Left Side = Group A (Text). Right Side = Group B (Purpose).
  *   Hand out Instructions and Case Cards.

  **00:25 – 00:55 | Phase 3: Adjudication (30 Mins)**
  *   Groups work through the 5 cases.
  *   **Instructor Role:** Float between groups. If Group A asks "But what about the wheelchairs?", reply: "What does the text say?" If Group B asks "But the text says motorized!", reply: "What was the mischief?"
  *   **Minute 45:** Remind them to fill out the "Prediction" column on the Scoring Sheet.
  *   **Minute 50:** Group A writes down their guess of the 6 Mischiefs on a slip of paper.

  **00:55 – 01:05 | The Reveal & Scoring (10 Mins)**
  *   Collect Group A's guesses. Open the sealed Mischief Cards.
  *   Reveal Group A vs. Group B verdicts case-by-case.
  *   Award points for correct predictions. (This usually generates laughter and groans).
  *   Reveal how close Group A came to guessing the Mischiefs.

  **01:05 – 01:30 | The Debrief (25 Mins)**
  *   (See Script Below). Introduce terms "Textualism" and "Purposivism" only now.

  ---

  ### Part 3: The Debrief Script (Mapping Moments to Theory)

  *Do not lecture. Ask these questions in order. Write student answers on the board, then label them.*

  **1. The Recoverability of Purpose (Case 1 & Group A's Guess)**
  *   *Ask Group A:* "You didn't have the cards. How close did you get to the real mischief?"
  *   *Point:* Text often implies purpose (Hart's "core of certainty"). But was it perfect?
  *   *Label:* **Intentionalism vs. Objective Meaning.** Can we know what they meant, or only what they said?

  **2. Over-Inclusion (Case 2: The Wheelchair)**
  *   *Ask Group A:* "Why did you rule Liable?" (Text: Motorized device).
  *   *Ask Group B:* "Why did you rule Not Liable?" (Purpose: Safety/Noise, not medical access).
  *   *Point:* The text is a blunt instrument. It catches things the legislature didn't mean to catch.
  *   *Label:* **Textualism (Scalia).** The law is the text, not the hope. If Congress wants an exception, they should write it.
  *   *Label:* **Purposivism (Fuller/Breyer).** Absurd results defeat the purpose. The judge corrects the drafting error.

  **3. Under-Inclusion (Case 3: The Bicycle)**
  *   *Ask Group B:* "The text says 'motorized.' The bike isn't motorized. Why rule Liable?"
  *   *Point:* The text failed to capture the full mischief.
  *   *Label:* **The Equity of the Statute.** Filling the gap to match the spirit.
  *   *Counter-Point:* Ask Group A: "If you rule Liable, aren't you making law?" (Separation of Powers).

  **4. The Plurality of Purpose (Case 4: The Maintenance Truck)**
  *   *Ask Both:* "Who won? The text had an exception, but the noise mischief was violated."
  *   *Point:* There is no single "Purpose." There are competing purposes (Safety vs. Maintenance vs. Quiet).
  *   *Label:* **The Death of Intent.** Legislatures are multi-headed monsters. There is no singular mind to read.

  **5. The Unforeseen (Case 5: The Toy Plane)**
  *   *Ask:* "Does 'motorized device' include a toy plane from 2024 when the law was written in 2010?"
  *   *Point:* Fixed meaning vs. Evolving application.
  *   *Label:* **Original Public Meaning vs. Dynamic Interpretation.**

  **6. The Institutional Question (The Final Pivot)**
  *   *Ask:* "Who had a harder job? Group A or Group B?"
  *   *Ask:* "If you were a student walking on the Quad yesterday, which group's method helps you plan your behavior better?"
  *   *Point:* This isn't just about meaning. It's about **Notice** (Citizens need to know the rules) vs. **Justice** (Judges need to fix mistakes).
  *   *Label:* **Rule of Law Values.** Predictability (Text) vs. Fairness (Purpose).

  ---

  ### Part 4: Troubleshooting (What Will Go Wrong)

  **1. The Drafting Phase Overruns**
  *   *Symptom:* Students are debating synonyms at minute 12.
  *   *Fix:* Have the **Fallback Statute** (in Part 1B) ready on a slide. At minute 12, say: "The Legislature has adjourned. Due to procedural gridlock, the Clerk has filed this compromise text." Use the Fallback. It ensures the interpretive problems exist.

  **2. Group A Cannot "Unsee" Purpose**
  *   *Symptom:* Group A argues about the "spirit" of the law despite instructions.
  *   *Fix:* This is actually a feature, not a bug. In the debrief, highlight it. "Even when told to ignore purpose, you inferred it from the words. This proves Hart's point: language carries a 'core' of meaning." If they refuse to comply, dock their prediction points.

  **3. The "Correct Answer" Stall**
  *   *Symptom:* A pre-law student asks, "But what would a *real* judge do?"
  *   *Fix:* "In the Supreme Court, they split 5-4 on this. Today, I am not grading your verdict. I am grading your consistency. If you are Group A, you are forbidden from caring about fairness. If you are Group B, you are forbidden from caring about dictionary definitions."

  **4. Disliking Outcome vs. Disliking Method**
  *   *Symptom:* "Group A's decision on the wheelchair is cruel."
  *   *Fix:* "Is it cruel, or is it democratic? If Group A is right, the cruelty is the Legislature's fault, not the Judge's. If Group B is right, the Judge is kinder, but undemocratic. Which error is worse?"

  ---

  ### Part 5: Limitations (What This Exercise Cannot Do)

  You must supply these in the final 10 minutes of lecture or the next session. Be frank with the students:

  1.  **The Base Rate of Easy Cases:** This exercise selects *only* hard cases (1 in 100). In reality, 95% of statutes are unambiguous. Textualism looks rigid here, but in easy cases, it's invisible.
  2.  **Precedent & Canons:** Real judges are bound by *stare decisis* and linguistic canons (e.g., *ejusdem generis*). Your students are acting as courts of first impression. This makes the "Text" group look more radical than real textualists.
  3.  **Legislative History:** Group B got "Mischief Cards." Real purposivists use committee reports, floor debates, and drafts. Real textualists argue those are unreliable. Your exercise simplifies "Purpose" to a single card, making Purposivism look cleaner than it is.
  4.  **Semantic Drift:** You cannot simulate 20 years of language change in 90 minutes. You have to *tell* them that "Vehicle" in 1900 doesn't mean "Vehicle" in 2024.
  5.  **The "Variant Run" Question:**
      *   *Your Query:* "Would a short variant run twice with the same statute decades apart be worth the time?"
      *   *My Advice:* **No.** It is too confusing for a first pass. It requires them to understand the first method before critiquing its temporal stability.
      *   *Alternative:* Instead of running it twice, *describe* the temporal shift in the debrief. "Imagine Case 5 happened 50 years later. Would 'motorized' include nuclear power? Textualists say the meaning is fixed at enactment; Purposivists say the application evolves. That is the 'Dead Hand' problem." Save the simulation for a graduate seminar; for undergrads, the snapshot is sufficient.

  ### Final Instructor Note
  The success of this session relies on your refusal to validate outcomes. When a student says, "But the wheelchair student shouldn't be liable," you must reply, "I agree. But which Group allowed that result, and what power did they claim to get there?" Keep the focus on **authority**, not **justice**.
