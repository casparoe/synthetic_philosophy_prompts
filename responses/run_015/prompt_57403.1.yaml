answer: |-
  # Q&A PREP SHEET: Moral Dilemmas & Residual Duties
  **Workshop:** Department Ethics | **Time:** 2 Weeks | **Stakes:** High (Solo vs. Room)

  ## I. STRATEGIC CONCESSIONS (First 5 Minutes)
  *Goal: Buy goodwill without surrendering the thesis. Signal you know the literature.*

  1.  **Concede Epistemic Dilemmas:** Explicitly grant that *many* apparent dilemmas are just uncertainty about facts or values. "I am not arguing that every hard choice is a dilemma. I am arguing that even when we know all the facts and values, residue sometimes remains."
  2.  **Concede the Cost of Agglomeration Failure:** "Yes, failing agglomeration ($O(A), O(B) \therefore O(A \& B)$) is theoretically expensive. I am not doing this lightly. I am doing it because the alternative is erasing the normative significance of the person we failed."
  3.  **Clarify Terminology Early:** Define "Residue" immediately as *corrective duties* (apology, repair), not just *feelings* (guilt, regret). This pre-empts the "it's just psychology" objection.

  ---

  ## II. THE OBJECTIONS (In Order of Likelihood)

  ### 1. The Senior Kantian (OIC & Consistency)
  **The Voice:** Stern, focused on rationality.
  **The Objection:** "If 'Ought Implies Can' is true, I cannot be under two obligations I cannot jointly satisfy. That makes the moral law contradictory. Your 'residue' looks like you're trying to have it both ways: admitting I couldn't do both, but insisting I still ought to have. Isn't this just a conflict of *maxims* resolved by a higher-order principle, rather than a conflict of *obligations*?"
  **The Reply (2 Mins):** "I agree OIC holds for the *final* action guide. I am not saying you ought to do the impossible *now*. I am saying the obligation you failed leaves a normative trace that an ordinary 'overridden' duty does not. When a duty is overridden by a stronger duty (e.g., promise-keeping vs. saving a life), no apology is owed to the promisee. In a dilemma, apology *is* owed. That difference in downstream treatment proves the upstream conflict was different. I'm not positing a contradictory law; I'm positing that some obligations survive being overridden in a way others don't."
  **Force:** ⚠️ **REAL.** This is the metaphysical heavy lifter against you.
  **Soft Spot:** You are walking a tightrope between "overridden duty" and "violated duty." If it's overridden, why the apology? If violated, did you do wrong? Be ready to say: "You did the *right* act, but you still *wronged* the party." (See Prayer Question).

  ### 2. The Consequentialist (Expected Value)
  **The Voice:** Impatient, empirical.
  **The Objection:** "Incommensurability is just a measurement artifact. There is always an expected-value maximizing act. If you chose the EV-max, you did the best thing. Any 'residue' is just instrumental: you apologize to maintain social trust for future utility. It's not *owed* in a deontic sense; it's a prudential hedge."
  **The Reply (2 Mins):** "If residue were merely prudential, the wronged party would have no *standing* to demand it. If I skip a utility-smoothing gesture, you might be annoyed, but you can't say I *owed* it to *you*. In these cases, the victim can legitimately complain, 'You owe me an apology,' even if they know you maximized EV. That standing indicates a debt, not a strategy. My account explains the standing; yours explains it away as efficiency."
  **Force:** 🔊 **NOISE.** They won't accept your premise, but the audience might.
  **Soft Spot:** They will argue the "standing to complain" is itself just a social utility mechanism. Don't get bogged down in metaethics here; pivot back to the phenomenology of the victim.

  ### 3. The Metaethics Grad Students (Verbal Dispute)
  **The Voice:** Pedantic, precise.
  **The Objection:** "Isn't this just terminological? The denial-of-dilemmas camp says 'There is always a determinate best act.' You say 'There is a best act, but it leaves residue.' You agree on the action guide, you just disagree on whether to label the aftermath a 'dilemma.' Why should we care about the label?"
  **The Reply (2 Mins):** "It's not about the label 'dilemma'; it's about the deontic structure. If they are right, the residue is supererogatory (nice but not owed). If I am right, the residue is obligatory (owed). That changes what the agent must do *after* the choice. If I skip the apology, have I committed a second wrong? My view says yes. Theirs says no. That is a substantive disagreement about what we owe each other, not just how we carve up the word 'dilemma'."
  **Force:** ⚠️ **REAL.** This threatens to turn your talk into a definitional stalemate.
  **Soft Spot:** If they grant the residue is owed but refuse to call it a "dilemma," does your thesis survive? (Yes, insist the *phenomenon* is what matters, not the tag).

  ### 4. The Legal Theorist (Doctrine & Necessity)
  **The Voice:** Pragmatic, doctrinal.
  **The Objection:** "Criminal law handles this via Necessity or Duress. You break the law to save a life, you raise the affirmative defense, you walk. No liability. Why does morality need to be messier than the law? What work does your 'residue' do that 'Justification' doesn't?"
  **The Reply (2 Mins):** "Law is about liability and punishment; morality is about relationships and accountability. The law lets you off the hook so you aren't imprisoned for saving a life. Morality insists the hook remains because a harm was still inflicted. If morality mimics the law here, we lose the space for the victim's grief. My residue accounts for the fact that the victim was used, even if justifiably. Law clears the agent; morality acknowledges the cost."
  **Force:** 🛡️ **MANAGEABLE.** Good opportunity to distinguish moral vs. legal norms.
  **Soft Spot:** Why *should* morality be harsher than law? Be careful not to sound like you want to punish the agent twice.

  ### 5. The Cultural Critic (Particularism)
  **The Voice:** Skeptical of universals.
  **The Objection:** "This 'agent-regret' and 'tragic residue' sounds very Western, very individualist. In many cultures, if the community sanctions the choice, there is no residue. Are you universalizing a specific cultural guilt-trip?"
  **The Reply (2 Mins):** "I am grounding this not in the agent's internal psychology (guilt), but in the victim's external standing (claim). Regardless of culture, if I break your arm to save a bus full of children, you have a claim on me for explanation and repair that a bystander does not. That relational fact exists even if your culture processes it differently. I'm arguing for the existence of the debt, not the specific ritual of repayment."
  **Force:** 🔊 **NOISE.** Likely a sidebar.
  **Soft Spot:** Is "standing to complain" culturally variable? Acknowledge rituals vary, insist the normative claim remains.

  ---

  ## III. THE "MUST LAND" REPLY
  **The Pivot Point:** The distinction between **Owed** vs. **Optional** Residue.

  If you fail to convince them that the apology/compensation is *mandatory* (has deontic force) rather than *virtuous* (supererogatory), the thesis collapses into "It's nice to say sorry."
  **The Soundbite:** "If the residue is optional, then the person I sacrificed to save the others has no grounds to complain if I ignore them afterwards. But they *do* have grounds. They can say, 'You saved the many, but you still owe me.' That standing proves the duty survives."
  **Preparation:** Have a concrete case ready (e.g., Sophie's Choice variant or a Trolley variant where you push someone) to test this intuition live.

  ---

  ## IV. THE PRAYER QUESTION (The Killer)
  **The Question:** "If the residue is *owed*, that implies you *wronged* the person. If you *wronged* them, how can your act have been the *best available thing*? You seem to be saying I can do the morally best act and still be a wrongdoer. Isn't that just 'Dirty Hands' with extra steps?"

  **Why it kills you:** It attacks the coherence of "Best Act + Owed Apology." If you did the best thing, surely you didn't wrong anyone? If you wronged them, surely it wasn't the best thing?
  **The Defense (Do not wing this):**
  "I am distinguishing *justification* from *innocence*. The act was justified (all-things-considered right), so you should not be stopped from doing it. But justification does not erase the infringement on the victim's status. You did the right thing, *but* you still infringed a right. The residue is the acknowledgment of that infringement. It is possible to be justified in wronging someone."
  *(Warning: This is a hard sell to Kantians. If they press OIC here, concede that 'Ought' is ambiguous between 'Action Guide' and 'Status Accounting'.)*

  ---

  ## V. TACTICAL NOTES
  *   **Watch the Clock:** If the Kantian starts monologuing, interrupt politely: "I want to make sure I address the OIC point specifically, because it's crucial..."
  *   **Board Work:** If things get abstract, draw the timeline. **T1: Conflict -> T2: Choice -> T3: Residue.** Show that the contradiction isn't at T2, it's the link between T1 and T3.
  *   **Tone:** Do not be defensive. You are the lone wolf; act like the guide, not the prey. "That's a strong objection, let's look at what happens to the victim if we accept it..."

  **Good luck. Hold the line on the "Owed" nature of the residue.**
