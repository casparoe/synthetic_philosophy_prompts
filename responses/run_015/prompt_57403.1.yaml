      *   **Topic:** Genuine moral dilemmas exist, defined not by incoherence/tragedy but by *residual duties* (apology, compensation, agent-regret) that are *owed* (have standing) even after doing the "best" available thing.
      *   **Context:** Solo presenter against a room of ~15 skeptics/critics. Expects a "mauling."
      *   **Audience Breakdown:**
          *   2 Kantians (Senior: OIC + Consistency of Moral Law; Junior: likely similar).
          *   1 Consequentialist/Expected Value (Incommensurability is an artifact; always a best act).
          *   3-4 Metaethics Grad Students (Substantive vs. Terminological dispute?).
          *   1 Legal Theorist (Criminal law doctrine handles this via necessity/duress; what's the added value?).
          *   1-2 Cultural Critics (Tragic framing is culturally specific).
      *   **Deliverables:**
          *   Objections phrased in the interlocutors' voices.
          *   2-minute oral replies for each.
          *   Flags on force (Real vs. Noise).
          *   Notes on soft spots in the reply.
          *   Concessions to make early for goodwill.
          *   The *one* reply that must land for the thesis to survive.
          *   The "Prayer Question" (the one they hope isn't asked).
          *   Format: Usable prep sheet (concise, actionable).

  2.  **Deconstruct the Thesis:**
      *   *Core Claim:* Dilemmas are real because residues (apology, etc.) are obligatory/owed, not optional.
      *   *Argument:* Residues aren't just prudential/sentimental (wronged party can complain) and aren't just hedges against uncertainty (proportioned to actual harm).
      *   *Implication:* Agglomeration fails. Reasons aren't jointly satisfiable + no common measure.
      *   *Distinction:* Not about normative incoherence, but about substantive normative facts regarding residue.

  3.  **Drafting the Objections & Replies (Iterative Process):**

      *   *Kantian (Senior):* Focus on OIC (Ought Implies Can) and consistency. If I *ought* to do A and *ought* to do B, but can't do both, the law is contradictory.
          *   *Voice:* Stern, focused on rationality and law-like structure.
          *   *Reply:* Distinguish objective vs. subjective oughts, or argue that the "residue" acknowledges the violation without positing a contradiction in the *final* action guide.
          *   *Soft Spot:* If OIC is hard, "I ought to have done the impossible" is a tough sell.

      *   *Consequentialist:* Incommensurability is ignorance. There's always an EV max. Residue is just utility smoothing.
          *   *Voice:* Impatient, focused on decision procedures and outcomes.
          *   *Reply:* The standing to demand apology exists *even if* EV was maximized. It's about the relationship, not the sum total of good.
          *   *Soft Spot:* Explaining why the residue isn't just instrumental for future utility.

      *   *Metaethics Grads:* Is this just verbal? You define "dilemma" as "residue." They define it as "no right answer." You agree on the phenomena, disagree on labels.
          *   *Voice:* Pedantic, focused on carve-ups of conceptual space.
          *   *Reply:* It's substantive because it changes the deontic structure (owed vs. optional). It predicts different normative consequences.
          *   *Soft Spot:* If they grant the residue is owed but deny it constitutes a "dilemma," does the thesis hold?

      *   *Legal Theorist:* Necessity/Justification excuses the act. Why do we need "residual obligation"? Law says you're not liable.
          *   *Voice:* Pragmatic, focused on liability and doctrine.
          *   *Reply:* Law minimizes liability; morality maximizes accountability. The law lets you off the hook; morality says the hook remains, just lighter.
          *   *Soft Spot:* Why should morality be harsher than law in necessity cases?

      *   *Cultural Critic:* Tragedy/Residue is Western/Individualist. Some cultures don't see "agent-regret" the same way.
          *   *Voice:* Skeptical of universal claims.
          *   *Reply:* Focus on the *standing to complain* by the victim, not just the agent's feelings. That's relational, not just cultural psychology.
          *   *Soft Spot:* Is "standing to complain" itself culturally variable?

  4.  **Strategic Elements:**
      *   *Concessions:* Need to admit that *some* dilemmas are epistemic. Need to admit agglomeration failure is costly.
      *   *The "Must Land" Reply:* The distinction between *owed* residue vs. *supererogatory* residue. If this fails, the thesis collapses into "it's nice to apologize."
      *   *The "Prayer Question":* Something that undermines the "owed" nature of the residue. Maybe: "If I do the best thing, why does the victim have standing to complain? Did I wrong them?"

  5.  **Refining and Formatting:**
      *   Keep it tight. Use bolding for scanability.
      *   Ensure the "Voice" sounds authentic to the archetype.
      *   Check timing (2 mins spoken is approx. 250-300 words).
      *   Ensure the "Soft Spot" is honest.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* The Kantian reply needs to be sharper. If OIC holds, you can't have two objective oughts.
      *   *Fix:* Frame it as "Prima Facie" vs. "All Things Considered," but argue the PF ought leaves a trace that ATC oughts usually don't. Or, challenge OIC in this specific context. Let's go with challenging the idea that residue implies a contradiction in the *final* command, rather than the *inputs*.
      *   *Critique:* The Legal Theorist might press on "Justification."
      *   *Fix:* Distinguish Justification (act was right) from Excuse (agent not blamed). Residue fits in a weird middle ground: Act was necessary, but harm was done.
      *   *Prayer Question:* Needs to be the killer. "If the residue is owed, didn't you actually wrong them? If you wronged them, was it really the best thing to do?" This attacks the coherence of "Best Act + Owed Apology."

  7.  **Final Polish:** Check against constraints (prep sheet style, not defense of view). Ensure tone is supportive but realistic. (Proceed to generate output).

  *(Self-Correction on "Prayer Question"):* The user says "include the question I'm praying nobody asks." This should be the one that exposes the deepest vulnerability. The vulnerability is the link between "Best Act" and "Wronging." If I did the best act, did I wrong anyone? If yes, how was it best? If no, why the apology? This is the "Dirty Hands" problem re-packaged.

  *(Self-Correction on "Must Land"):* The distinction between *prudential/sentimental* residue and *obligatory* residue. The user's argument hinges on the "standing to complain." This must be defended vigorously.

  *(Refining Concessions):* Don't concede too much. Admit epistemic dilemmas exist, but insist ontic ones do too. Admit agglomeration is a cost, but claim it's a necessary cost.

  *(Final check on voices):*
  Kantian: "Rational consistency," "Maxim."
  Consequentialist: "Expected value," "Measurement error."
  Grad Students: "Conceptual carve-up," "Verbal dispute."
  Legal: "Affirmative defense," "Liability."
  Cultural: "Particularist," "Western guilt."

