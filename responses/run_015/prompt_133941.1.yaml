answer: |-
  Based on the normative framework that treats innate talent as morally arbitrary and achievement as socially embedded, here is the ranking of the five conceptions of merit-based desert from most to least defensible.

  ### 1. Desert grounded solely in voluntary effort expenditure
  **Justification:** This conception is the most defensible because it isolates the only factor arguably within an agent's direct control: the will to strive. By grounding desert *solely* in effort, it attempts to filter out the moral arbitrariness of innate talent and the contingencies of social embedding that affect outcomes. It survives the "undeserved advantages" objection best because it does not reward the *capacity* to effort (which may be innate) nor the *results* of effort (which are socially valued), but only the expenditure of will itself.
  **Adjacency (1 to 4):** These ranks are **close**. Both prioritize internal agency over external results. The distinction lies in that (1) focuses on the discrete *act* of effort, while (4) focuses on the *trait* of character formed over time. (1) is ranked higher because "character" is more susceptible to the objection that it is socially embedded (shaped by upbringing), whereas "voluntary effort" is the theoretical limit of individual control.

  ### 2. Desert as recognition of character formed through sustained disciplined practice
  **Justification:** This position is highly defensible as it shifts focus from raw talent to the cultivation of self over time. It acknowledges that merit is a process ("sustained disciplined practice") rather than a static gift. However, it is slightly less defensible than (1) because "character" is not fully voluntary; the capacity for discipline and the opportunities for practice are themselves influenced by social embedding and arbitrary temperament. It partially survives the objection by rewarding the *history* of agency rather than the *possession* of advantage.
  **Adjacency (4 to 3):** These ranks are **farther apart**. This gap marks the transition from *internal cultivation* (virtue/agency) to *external structure* (rules/systems). While (4) looks at what the agent built within themselves, (3) looks at how the agent fared within a social construct. The framework's claim that achievement is socially embedded makes structural solutions (3) less coherent than agentic ones (4), as structures cannot fully neutralize arbitrary starting points.

  ### 3. Desert tied to success under procedurally fair competitive rules
  **Justification:** This conception is moderately defensible but flawed. Procedural fairness is a necessary condition for justice, but under the given framework, it is insufficient. It fails the "undeserved advantages" objection because procedurally fair rules do not neutralize substantive inequalities; a "fair" race still rewards the runner with arbitrary genetic advantages. It is defensible only insofar as it prevents cheating, but it cannot morally justify unequal outcomes derived from arbitrary traits.
  **Adjacency (3 to 2):** These ranks are **close**. Both rely on social metrics to determine desert (winning a competition vs. producing a valued outcome). They are separated by the strength of the claim: (3) claims desert based on *status* (success/winning), while (2) claims *entitlement* to *property/value* (outcomes). (3) is slightly more defensible because procedural fairness is a constraint on the system, whereas (2) is a positive claim of ownership that ignores how social embedding dictates the *value* of the outcome.

  ### 4. Desert as entitlement to outcomes produced by developed abilities
  **Justification:** This position is weak within the framework. While it requires abilities to be "developed" (implying some effort), it ultimately grounds desert in the *outcomes* produced. Outcomes are heavily socially embedded (market value, cultural recognition), and "developed abilities" still rest on a foundation of innate potential and social opportunity. It fails the objection because it treats the *product* of arbitrary advantages (talent + opportunity) as the private property of the agent, conflating social value with moral worth.
  **Adjacency (2 to 5):** These ranks are **far apart**. This is the critical divide between *cultivation* and *existence*. Position (2) at least requires the agent to have done work ("developed"), whereas (5) requires nothing but the existence of potential. (2) retains a sliver of agency; (5) abandons it entirely.

  ### 5. Desert based on the realization of innate potential in the absence of external interference
  **Justification:** This is the least defensible conception. It directly contradicts the framework's core premise that innate talent is morally arbitrary. By grounding desert in the "realization of innate potential," it explicitly rewards the genetic lottery. It fails the "undeserved advantages" objection completely, as the very source of the desert (innate potential) is defined by the framework as undeserved. It treats the absence of interference as sufficient for merit, ignoring that the potential itself is an unearned advantage.
