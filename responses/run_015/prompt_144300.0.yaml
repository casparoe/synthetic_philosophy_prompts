  i'm trying to work through that old 1890 Warren and Brandeis essay in the Harvard Law Review about privacy. they say modern newspapers and cameras invade private life, causing mental pain worse than physical injury, and they want the law to protect what they call an inviolate personality — thoughts, emotions, private writings. they cite Judge Cooley's right "to be let alone" and warn that "what is whispered in the closet shall be proclaimed from the house-tops." but i'm stuck on whether they think privacy protects a self thats already fully formed inside, or whether the hiding itself is part of what forms the self. like, is solitude just a shield for a pre-existing core, or is it more like a negative space that actually constructs personality? the text talks about publicity distorting or destroying personality, which sounds like the self gets built partly through being hidden. can you help me parse whether that reading is actually in the passage or if i'm forcing a modern idea onto it? i don't need a summary, just want to know if the tension between protection and constrution is really there.
