      *   *The Debate:* Do the symbols cause things (downward causation), or is it just physics all the way down (upward determination)?
      *   *The Slogan:* "Who shoves whom around?" implies a zero-sum game of causal power.

  3.  **Analyze the Specific Claims (The "One-Liner" Dissected):**

      *   *Claim 1: Causal Closure of Physics.*
          *   *Meaning:* Every physical event has a sufficient physical cause.
          *   *Triviality:* Non-trivial, but standard physicalist assumption.
          *   *Defensibility:* Highly defensible in modern science.
          *   *Conclusion Support:* Yes, if closure holds, mental causes must be identical to physical causes or epiphenomenal.
      *   *Claim 2: Explanatory Bankruptcy.*
