prompt: |-
  Been in a philosophy of mind disord lately arguing about Hofstadter's careenium — you know, whether the symbol-level dance actually shoves the substrate around or if it's all just simmballs colliding with no real upward causation. Someone kept throwing around the phrase who shoves whom around inside the careenium like it was a knockdown argument that the substrate always wins. But I'm not sure it's doing the work they think. Can you lay out the different precise claims that one-liner might be expressing — causal closure of physics, explanatory bankruptcy of high-level descriptions, ontological dependence, counterfactual impotence of symbols, or maybe something like symbolic drift where patterns only stabilize at the symbol level? For each one say if it's trivial, if it's actually defensible, and whether it gets them their anti-mental-causation conclusion. Also I've been toying with this edge case I'm calling reverse-careenium dynamics, where the substrate is noisy but the symbolic layer is the only stable attractor — does the slogan even apply there, or does it just assume substrate stability? Would be good to know which reading people usualy mean when they use it to end an arguement.
