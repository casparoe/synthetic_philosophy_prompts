      *   *Claim 4: Counterfactual Impotence.*
          *   *Meaning:* If you changed the symbol pattern but kept the physics same, nothing changes. Or, symbol-level changes don't map to distinct physical outcomes.
          *   *Triviality:* Non-trivial.
          *   *Defensibility:* Debatable. Depends on multiple realizability.
