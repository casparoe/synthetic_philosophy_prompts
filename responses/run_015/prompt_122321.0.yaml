answer: |-
  1. The dependency arc
  Start by defining societal complexity as a stack—specialization, long-distance trade, central bureaucracy. That's your monolith. Next, introduce the stressor (drought, invasion) not as a kill switch but as load testing. Only after they see the structure can you introduce the refactor analogy. Explain that when the central db goes away, the local services still run. You need the "before" state clear so the "after" state looks like simplification, not deletion. If you jump straight to the analogy, they'll treat history like code simulation. Ground the human cost first, then map the architecture. The sequence must be: Complexity -> Stress -> Fragmentation -> Continuity. The analogy only lands once they accept that people didn't vanish, just the coordinating layer did. Don't let the tech metaphor override the actual archaeological evidence of survival.

  2. The carrying example
  Pick the Late Bronze Age Collapse. It works because it's a network failure, not an island ecocide. Easter Island is risky; devs will fixate on the "resource exhaustion" bug and miss the social restructuring. Bronze Age shows palaces burning (services down) while villages persist (local instances running). You need an example where literacy and trade vanish (complexity loss) but population remains (system persistence). Easter Island often gets taught as total extinction, reinforcing the crash model. Bronze Age lets you show trade routes cutting out while culture adapts locally. It highlights coupling vs. existence.

  3. Misconception map
  When you mention stressors, they'll look for the root cause bug (climate). Head this off by calling it "increased latency" across multiple dependencies, not one fatal exception. When showing the aftermath, they'll assume cascading failure took everyone. Counter by showing rural sites outliving cities—graceful degradation. The biggest trap is equating output drop with system death. If trade volume hits zero, devs think the server is off. You need to emphasize that local production continued without the API layer. Finally, address "smaller = failed." In tech, scaling down is often optimization. Frame the post-collapse society as a lightweight build that sheds technical debt (bureaucracy) to survive on lower resources. Map these objections to the specific slide where the data looks like a crash, and intervene before they draw the conclusion. Remind them that uptime isn't the only metric for success; survivability is. If the system runs slower but doesn't terminate, it's a refactor, not a crash.

  4. The check
  Ask them to define the "uptime" of a society. If the capital burns but farmers eat, is uptime 0%? Have them write a one-sentence status report for the Bronze Age after the palaces burn. If they write "System Offline," they missed it. If they write "Decentralized Mode Active," they get it. This forces them to separate coordination from existence. It proves they see collapse as architecture change, not a hard stop. Don't ask for dates; ask for the state definition.

  5. What to skip
  Skip stratigraphy and pottery typologies; devs don't care about dating methods. Avoid specific climate data debates (exact rainfall mm). That invites debugging the climate model instead of discussing social structure. Cutting this keeps focus on coupling and complexity. If you argue drought severity, you lose the room to the "climate bug" theory. Keep it structural.
