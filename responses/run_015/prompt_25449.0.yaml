answer: |-
  **MEMORANDUM**

  **TO:** Faculty Senate Rules Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Voting Method for Tenure-Track Hiring Decisions

  **Purpose**
  This memo addresses the committee's stalemate regarding the voting method for tenure-track hiring recommendations. Our current system (simple plurality) carries significant risk: it allows a candidate to be recommended even if a majority of the department ranks them last, provided the opposition is split among other candidates. To resolve the impasse, this memo evaluates the theoretical objections raised regarding Arrow's Impossibility Theorem and offers a specific recommendation for adoption.

  **Addressing the "Arrow's Theorem" Objection**
  One committee member has rightly noted that Arrow's Impossibility Theorem proves no ranked-choice voting system can satisfy all fairness criteria simultaneously (specifically: unrestricted domain, non-dictatorship, Pareto efficiency, and independence of irrelevant alternatives). This is mathematically correct. However, the conclusion that "therefore we should not change" is a logical non-sequitur.

  Arrow's Theorem demonstrates that **perfection is impossible**, not that **all systems are equally flawed**. In social choice theory, the practical task is not to find a perfect system, but to select the system that fails the *least important* criteria for our specific context.

  *   **Plurality Voting** fails the **Majority Criterion**: A candidate preferred by more than 50% of voters can lose if the majority vote is split. In a hiring context, this risks extending an offer to a candidate whom the majority of the department finds unacceptable.
  *   **Ranked-Choice Voting (RCV)** satisfies the Majority Criterion but fails the **Independence of Irrelevant Alternatives** (one of Arrow's conditions). This means the relative ranking of two candidates could theoretically change based on the presence of a third, non-winning candidate.

  For faculty hiring, ensuring that our top choice has majority support is more critical than satisfying the technical condition of independence of irrelevant alternatives. Therefore, Arrow's Theorem does not justify maintaining the status quo; it merely instructs us to choose our trade-offs consciously.

  **Recommendation: Ranked-Choice Voting (Instant Runoff)**
  I recommend the committee adopt **Ranked-Choice Voting (RCV)**, also known as Instant Runoff Voting, for all final tenure-track hiring decisions.

  **How it works:**
  1.  Voters rank candidates in order of preference (1st, 2nd, 3rd...).
  2.  If a candidate receives a majority (50% + 1) of first-place votes, they win.
  3.  If no candidate has a majority, the candidate with the fewest votes is eliminated, and their votes are transferred to those voters' next choices. This continues until a majority winner emerges.

  **Why this method:**
  *   **Majority Mandate:** It ensures the recommended candidate is acceptable to a majority of the committee, mitigating the risk of a polarizing hire.
  *   **Reduces Strategic Voting:** Under plurality, voters often feel forced to vote for a "lesser evil" to avoid wasting their vote. RCV allows faculty to rank their true first choice without fear of inadvertently helping their least favorite candidate win.
  *   **Aligns with Academic Values:** It prioritizes consensus and broad acceptability over simple vote-counting, reflecting the collegial nature of faculty governance.

  **Honest Assessment of Downsides**
  To be transparent, RCV is not without flaws:
  1.  **Complexity:** It is slightly more complex to explain and count than plurality (though software can handle this easily).
  2.  **Non-Monotonicity:** In rare mathematical edge cases, ranking a candidate *higher* can theoretically hurt their chances. While this is a theoretical vulnerability, it is extremely rare in practice and is a lesser risk than the "spoiler effect" inherent in plurality.
  3.  **Intensity of Preference:** RCV captures order but not intensity (e.g., the difference between a "mild preference" and a "strong conviction"). However, this is true of most voting systems and can be mitigated through open deliberation prior to the vote.

  **Next Steps**
  Sticking with plurality because "no system is perfect" is an argument for paralysis, not governance. We have an opportunity to adopt a system that better reflects the will of the faculty and protects against divisive hiring outcomes.

  I move that the committee recommend **Ranked-Choice Voting** to the full Senate for implementation in the next academic year.

  **Action Required:**
  Please review this analysis prior to our meeting on [Date]. I look forward to voting on this recommendation.
