      1.3 Definitional Framework. Bidders must specify whether "the West" is defined geographically, by descent, by civilizational inheritance, or by assent to the Values themselves. The Authority notes that all four options are permissible provided consistency is maintained throughout the Deliverable.

      **2. PROVENANCE AND LINEAGE**
      2.1 Each Value must be traceable to at least two of the following approved sources: Athens, Rome, Jerusalem, the Enlightenment, 1989.
      2.2 Embarrassment Mitigation. No Value may be credited to a source that would embarrass the Authority or complicate current foreign policy. Any borrowing from non-approved cultures must be described as "transmission" or "preservation" rather than "origin."

      **3. RHETORICAL FUNCTION**
      3.1 Dual Utility. The List must be usable universalistically in one paragraph (e.g., "These are human values anyone may sign up to") and particularistically in the next (e.g., "These are *our* values, and *those people* do not share them"). There must be no visible seam between these two modes.
      3.2 Conversation Termination. Invocation of the List must function to end a discussion rather than open one. The burden of proof must shift immediately onto whoever expresses discomfort with the List.
      3.3 Subject Diversion. The List must be capable of doing real work in disputes actually concerning gas, housing, or trade deals, without any party registering the change of subject from material resources to normative alignment.

      **4. PASS/FAIL CRITERIA**
      4.1 Self-Criticism Exclusion. Any Value whose main effect would be to criticize current Western policy is automatically excluded. Bidders are reminded that "Freedom of Movement" was floated in an earlier tender (No. 2022/WV/004) and withdrawn after legal review due to excessive operational friction.
      4.2 Comfort Letters. Bidders must submit comfort letters from at least two Member State governments confirming that adoption of the List will not require legislative change.

      **5. EVALUATION RUBRIC**
