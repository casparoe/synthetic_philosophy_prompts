answer: |-
  You have described a phenomenon that is rational, common in high-stakes fields (like engineering, law, and medicine), and philosophically significant, but it does not have a single, famous proper name like "The Gettier Case."

  Instead, what you are describing is the intersection of three established concepts: **Pragmatic Encroachment**, the **Belief/Acceptance Distinction**, and **Conjunctive Risk Aggregation**.

  If you need a term to tag this in your own thinking, the most accurate descriptive label is **"Task-Relative Conjunctive Sensitivity."**

  Here is the breakdown of why this is distinct from the Lottery and Preface paradoxes, where the literature actually lives, and how to define it.

  ### 1. Why it is not the Lottery or Preface Paradoxes

  You are correct that these are adjacent but not identical. The difference lies in the *locus of the tension*.

  *   **The Lottery Paradox** is about **statistical certainty vs. specific belief**. It asks: "If I know one ticket *must* win, how can I believe of any *specific* ticket that it will lose?" Your case is not about statistical necessity; you admit your list is fallible based on evidence quality, not mathematical guarantee.
  *   **The Preface Paradox** (Makinson) is about **doxastic consistency**. It asks: "Is it rational to believe every sentence in my book ($P_1... P_n$) while also believing the book contains an error ($\neg(P_1 \land ... \land P_n)$)?"
      *   **Your Difference:** You explicitly state you feel **no tension** in belief. You are comfortable holding the fallibilist view (some on the list are wrong) without it undermining your confidence in the individuals. The Preface Paradox worries philosophers because it seems logically contradictory to believe $A$ and believe $\neg(A \land B)$. You have bypassed the contradiction by decoupling *belief* from *action*.

  ### 2. The Philosophical Home: Pragmatic Encroachment

  The literature that best captures your experience is **Pragmatic Encroachment** (associated with philosophers like **Jason Stanley**, **Jeremy Fantl**, and **Matthew McGrath**).

  *   **The Core Idea:** Whether you are justified in *acting* on a belief (or claiming to "know" it) depends not just on the evidence, but on the **practical stakes**.
  *   **Your Case:** Your evidence for the claims hasn't changed (still 97%). But the "stakes" of being wrong change drastically when you move from *asserting one claim* to *relying on a conjunction of five*.
  *   **The Mechanism:** In decision theory, if a project requires five independent premises to be true, the probability of the project succeeding is the product of the probabilities ($0.97^5 \approx 0.86$).
      *   For a casual assertion, an 86% success rate might be acceptable.
      *   For a project you are staking your reputation on, an 86% failure risk is unacceptable.
      *   Pragmatic Encroachment explains why your **willingness to act** shifts even though your **credence** (confidence level) remains static.

  ### 3. The Cognitive Mechanism: Belief vs. Acceptance

  To explain why you feel "no actual doubt" about the individual claims but still re-check them, the best framework is **L. Jonathan Cohen's distinction between Belief and Acceptance**.

  *   **Belief:** A involuntary disposition to feel that something is true. (You *believe* all 60 claims are true).
  *   **Acceptance:** A voluntary policy of using a proposition as a premise in reasoning or action.
  *   **Your Workflow:** You *believe* all 60 items. You *accept* them for casual conversation (low stakes). But you refuse to *accept* the **conjunction** of the specific five needed for your project without verification.
  *   **Why this fits:** This explains the "selectivity." You don't re-check the whole list because you aren't changing your *beliefs* about the list. You are changing your *acceptance policy* for a specific argument structure.

  ### 4. Proposed Definition and Term

  Since there is no single canonical term, I propose you use **"Operational Conjunctive Sensitivity"** (or **"Task-Relative Epistemic Risk"**).

  **Definition:**
  > A cognitive stance where an agent maintains stable high confidence in individual propositions but modulates their willingness to act on a *subset* of those propositions based on the **accumulated risk of conjunction** required for a specific task.

  **Key Features:**
  1.  **Doxastic Stability:** Confidence in individual claims does not fluctuate.
  2.  **Structural Risk Awareness:** The agent intuitively understands that $P(A \land B) < P(A)$.
  3.  **Action Thresholding:** Verification is triggered not by doubt in the premises, but by the risk profile of the *conclusion* dependent on them.
  4.  **Local Scope:** Verification is limited strictly to the subset required for the current inference chain.

  ### 5. Cases: What Is and Isn't an Instance

  To help you calibrate this concept, here are cases that fit your pattern and those that do not.

  **Instances (Fits your pattern):**
  *   **The Software Dependency:** A developer knows Library A, B, and C are all "stable" (97%). For a script using only A, they deploy immediately. For a script requiring A+B+C to interact, they write integration tests, even though they trust each library individually.
  *   **The Legal Brief:** A lawyer believes 10 distinct precedents support their view. For a motion relying on one precedent, they cite it. For a motion requiring three precedents to hold simultaneously to avoid dismissal, they re-research all three to ensure none have been quietly overturned.
  *   **The Medical Diagnosis:** A doctor is 95% sure a patient has Symptom X, 95% sure they have Symptom Y. To note them in a file, they record them. To prescribe a drug that is only safe if *both* are present, they orders tests to confirm both, despite their initial confidence.

  **Non-Instances (Does not fit):**
  *   **General Skepticism:** "I might be wrong about everything, so I check everything." (This lacks the *selective subset* sensitivity).
  *   **Imposter Syndrome:** "I don't trust my judgment on any of these." (This involves lowered *confidence*, not just lowered *action threshold*).
  *   **The Conjunction Fallacy:** (Tversky & Kahneman). This is when people think $P(A \land B)$ is *more* likely than $P(A)$. You are doing the rational opposite: recognizing $P(A \land B)$ is *less* likely and acting accordingly.
  *   **Obsessive Checking (OCD):** Re-checking despite knowing the risk is negligible and the cost of checking outweighs the benefit. Your behavior is described as rational risk management ("I need to lean on five of them together"), not compulsion.

  ### Summary
  You have essentially solved the Preface Paradox pragmatically. Philosophers worry about how to *believe* the premises and the conclusion. You have decided that **belief is cheap, but inference is expensive.**

  You are practicing **Operational Conjunctive Sensitivity**. It is the rational application of **Pragmatic Encroachment** to **Conjunctive Risk**. You aren't experiencing a paradox; you are experiencing **Epistemic Risk Management**.
