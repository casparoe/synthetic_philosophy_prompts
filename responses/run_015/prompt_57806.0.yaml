answer: |-
  # Research Agenda: Operationalizing Indeterminacy

  ## Executive Summary
  This fellowship prioritizes **Candidate 3 (Protocols for High-Stakes Interpreting)** and **Candidate 2 (Evaluation of Machine Translation for Low-Resource Languages)**. These two lines of inquiry directly address the charge to alter practices *outside* philosophy by targeting domains where Quinean indeterminacy produces tangible ethical risk or systemic error.

  We explicitly deprioritize **Candidate 1 (Field Lexicography)** and **Candidate 4 (Training in Elicitation)**. While valuable, Lexicography is a static tool that serves the dynamic processes of Interpreting and MT, making it dependent rather than foundational. Training is deprioritized because Quinean arguments suggest indeterminacy is structural, not merely a failure of individual competence; therefore, procedural protocols are superior to cognitive retraining. **Candidate 5 (Mental-State Vocabulary)** is subsumed within Priority 1, as asylum and medical settings are the primary sites where normative vocabulary determines culpability and consent.

  ## Criteria for Selection
  The ordering rests on four criteria derived from the team's composition (two philosophers, one linguist, one MT researcher) and the fellowship's charge:
  1.  **Practical Stakes:** The extent to which ignoring indeterminacy causes measurable harm (e.g., physical injury, unjust incarceration).
  2.  **Team Tractability:** The degree to which the line of work utilizes the specific intersection of philosophical logic, linguistic fieldwork, and algorithmic evaluation available in this team.
  3.  **Philosophical Centrality:** How directly the work engages the core Quinean claim that behavioral evidence underdetermines ontology and logic.
  4.  **Dependency:** Whether resolving one line is a prerequisite for progress in another.

  ## Priority 1: Protocols for High-Stakes Interpreting (Candidate 3)
  **Rationale:** This line offers the highest **Practical Stakes**. In medical and asylum contexts, the *gavagai* problem is not abstract. A mass-count distinction (e.g., "medicine" as substance vs. "pills" as units) determines dosage; a tense-aspect distinction (e.g., evidentials marking hearsay vs. direct observation) determines credibility and legal responsibility. Current practice presupposes a determinacy of translation that Quinean arguments undermine. If reference is inscrutable, an interpreter cannot guarantee they are conveying "the" meaning, only a behaviorally equivalent one.

  **Team Utilization:** The philosophers will articulate the ethical obligations regarding ontological divergence (e.g., when is it permissible to translate a "stage" as an "object"?). The linguist will identify specific grammatical loci where indeterminacy threatens safety (e.g., evidentials, plurality).

  **Quinean Application:** The output will be a protocol requiring interpreters to flag alternatives rather than forcing a single gloss. This institutionalizes the Quinean insight that multiple ontological schemes can fit the behavioral evidence. Instead of hiding indeterminacy behind a facade of fluency, the protocol makes the divergence explicit for the end-user (doctor, judge).

  ## Priority 2: MT Evaluation for Low-Resource Languages (Candidate 2)
  **Rationale:** This line offers the highest **Scalability** and **Team Tractability**. Machine Translation is rapidly becoming the primary interface for cross-linguistic communication in low-resource settings, precisely where parallel data is sparse and indeterminacy is highest. Current evaluation metrics rely on "single-reference automatic scores" (comparing output to one "gold standard" human translation). This presupposes determinacy. If Quine is right, multiple outputs with divergent ontologies may be equally valid relative to stimulus conditions.

  **Team Utilization:** The MT researcher will design task-based measures (e.g., did the user successfully complete the transaction?) rather than string-matching scores. The philosophers will define "acceptable divergence" (when does ontological shift become error?). The linguist will provide low-resource data where *gavagai*-style alternatives are live options.

  **Quinean Application:** By replacing reference-based scoring with task-based adequacy, the team acknowledges that "meaning" is fixed by use and behavioral success, not by matching hidden ontological commitments. This shifts the industry standard from "accuracy to a text" to "adequacy to a purpose."

  ## Deprioritized Lines
  **Candidate 1 (Field Lexicography)** is deprioritized based on **Dependency**. Dictionaries and grammars are tools used by interpreters and MT systems. If we successfully reform the protocols for Interpreting (Priority 1) and the evaluation metrics for MT (Priority 2), the demand for new types of lexicographical records will emerge organically from those fields. Creating new dictionary formats now risks building tools for a workflow we intend to change. Furthermore, static records cannot capture the context-dependent resolution of indeterminacy as effectively as real-time protocols.

  **Candidate 4 (Training in Elicitation)** is deprioritized based on **Philosophical Centrality**. The background scenario suggests that principles of charity do "indispensable yet potentially distorting work." If charity is indispensable, training workers to be "more aware" of it may merely systematize bias rather than eliminate the structural underdetermination. Quine's argument is not that fieldworkers are careless, but that evidence is insufficient. Therefore, investing in *procedural safeguards* (Priority 1) is more effective than investing in *cognitive retraining* (Candidate 4). We cannot train away indeterminacy; we must manage it.

  **Candidate 5 (Mental-State Vocabulary)** is not pursued as a separate line because it is **Subsumed** by Priority 1. Questions about "belief," "intent," and "consent" are most critical in asylum and medical settings. Addressing the protocol for those settings inherently addresses the vocabulary used within them. Isolating the vocabulary without the setting would render the work too theoretical for the charge to change practice "outside philosophy."

  ## Tradeoffs and Risks
  **Tradeoff 1: Depth vs. Breadth.** By focusing on High-Stakes Interpreting, we neglect literary or diplomatic translation where stakes are different (aesthetic or political rather than physical/legal). We accept this risk because the charge emphasizes what *should* change; ethical necessity dictates prioritizing life-and-liberty contexts over aesthetic ones.

  **Tradeoff 2: Human vs. Machine.** Prioritizing MT Evaluation (Priority 2) alongside Human Interpreting (Priority 1) stretches the team. However, this is necessary because low-resource MT often replaces human interpreters in the exact contexts we are studying. Ignoring MT would leave a major vector of indeterminacy unaddressed.

  **Risk:** The "Task-Based Measures" for MT (Priority 2) may prove difficult to standardize. If a task is "buy medicine," success is clear. If the task is "explain trauma," success is opaque.
  **Mitigation:** The linguist and philosophers will define a hierarchy of tasks, focusing first on those with clear behavioral outcomes (dosage, dates, locations) before attempting complex normative concepts.

  ## Conditions for Revision
  The ranking should be revised under the following empirical or philosophical developments during the three-year period:

  1.  **If MT systems demonstrate ontological convergence:** If empirical testing shows that modern neural MT naturally converges on a single ontology despite sparse data (contrary to the Quinean expectation), Priority 2 should be downgraded in favor of **Candidate 1 (Lexicography)**. This would suggest the technology has solved the indeterminacy problem internally, shifting the bottleneck to data documentation.
  2.  **If Legal/Medical Institutions reject flagging protocols:** If pilot studies in Priority 1 show that judges or doctors refuse to engage with "flagged alternatives" and demand single determinate answers, the team must pivot to **Candidate 4 (Training)**. This would indicate that structural protocols are impossible, and the only lever available is conditioning interpreters to make the "least harmful" deterministic choice consciously.
  3.  **If "Charity" proves trainable:** If the team finds that explicit training in elicitation (Candidate 4) significantly reduces ontological imposition in field tests, Priority 1 should be expanded to include a heavy training component. This would challenge the assumption that indeterminacy is purely structural and suggest a cognitive solution is viable.

  ## Conclusion
  This agenda moves Quinean indeterminacy from a metaphysical puzzle to an operational constraint. By focusing on **High-Stakes Interpreting** and **MT Evaluation**, the team addresses the sites where the assumption of determinacy causes the most harm and where the team's unique composition can effect the most change. We reject Lexicography and Training as secondary because they serve systems we intend to redesign. The goal is not to solve indeterminacy, but to build practices that function safely in its presence.
