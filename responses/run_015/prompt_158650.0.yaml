answer: |-
  You present to me a phantom of governance, a clockwork state where the sword strikes without a hand to hold it. You ask if this is justice divorced from force, or coercion hidden in the gears. I tell you plainly: it is the worst tyranny, for it is tyranny that dares not show its face.

  Consider first what I have written on the nature of force. Force is not merely the blow that bruises the flesh; it is the *will* that commands the blow. When a king sentences a man, it is a human soul that bears the weight of that judgment before God. There is a possibility of mercy, for there is a heart that may be moved. There is a possibility of repentance, for there is a conscience that may be pricked.

  But in this mechanism you describe—this automaton of fines and restrictions based on your "records of conduct"—you claim there is zero human will. This is a deception. Who forged the gears? Who set the weights of the calculation? The will is not absent; it is merely concealed behind a curtain of arithmetic. It is the will of the hidden legislators who built the machine, yet they wash their hands of the blood it spills.

  You say justice without force is powerless. True. But force without a human agent is not force; it is fate, and it is demonic. If a man is struck down by this machine, to whom does he appeal? Can he beg mercy of a clock? Can he reason with a ledger? No. This is force stripped of the only thing that makes it bearable: the humanity of the wielder.

  Is it justice separated from human force? No. It is force without justice, disguised as neutrality. True justice belongs to God alone; we poor wretches rely on custom and law to keep the peace. But when law becomes a blind machine, it ceases to be law and becomes mere violence. It is the strong made just only because they hide behind iron and numbers.

  A government without cops or judges is a government without souls. And a state without souls is not a commonwealth; it is a prison run by the devil, who loves nothing more than sin without a sinner to blame. Do not be fooled by the calculation. Where there is coercion, there is a will. Where there is a will, there is sin. And where there is sin without accountability, there is no justice, only power devouring the weak.
