  The principle that saves all five verdicts is **The Principle of Deliberative Integrity regarding Incommensurables.**

  This principle rests on the metaphysical claim that certain goods (unique cultural heritage, artistic creation) and certain conditions (human survival) are **incommensurable**: they belong to different orders of value and cannot be placed on a single scale without falsifying one of them.

  The principle operates through three rules:

  1.  **The Prohibition on Commensurating Justification:** You may never justify a choice between incommensurable goods by claiming one *outweighs* the other. To do so is to treat the unique as fungible, which is a moral error.
  2.  **The Emergency Exception (Priority of Existence):** In cases of **immediate, unavoidable necessity** (where the conflict is forced by nature or circumstance, not policy), an agent may prioritize the *precondition of value* (life/survival) over the *expression of value* (art/culture). This is not a judgment that life is "worth more," but a recognition that without existence, no value can persist. This choice is **Right**, but it leaves a **Tragic Remainder** because the sacrificed good is not canceled out; it is absolutely lost.
  3.  **The Condition of Avoidability:** If the conflict is avoidable (through planning, resources, or alternative options), the agent has a duty to resolve it without sacrifice. Failure to do so is not tragedy, but **negligence or selfishness**.

  ### The Resolving Clause: Emergency vs. Policy
  The tension between the **Surgeon** and the **Archive** is resolved by the **Emergency Exception**.

  *   **The Surgeon** acts in an **immediate emergency**. The conflict (die or amputate) is forced by biology, not chosen. The surgeon prioritizes existence (life) over expression (music) without claiming the life is *more valuable* than the music. The surgeon acknowledges the music is lost forever (Tragic Remainder). This satisfies Rule 2.
  *   **The State** acts in **policy time**. By razing the archive to build the hospital, the State implies it has weighed the options and found the hospital "worth" the archive. This violates Rule 1 (Commensurating Justification). Even if lives are saved, the *reasoning* treats the unique archive as a quantity of lives, which denies its nature as a constitutive good. The State had the temporal luxury to seek alternatives; choosing the trade makes the act **Wrong**.

  ### Application to Your Verdicts
  1.  **Surgeon/Pianist:** **Right with Remainder.** Immediate necessity forces a Priority of Existence. The music is not "outweighed" (Rule 1 respected), but lost (Rule 2 applied).
  2.  **Father/Child:** **Right with Remainder.** Immediate necessity (dying child) forces Priority of Existence. The art is sacrificed, not traded (Rule 2 applied).
  3.  **State/Archive (Unique):** **Wrong.** Policy context. The State treats the unique archive as comparable to lives (violates Rule 1). It institutionalizes a false exchange rate.
  4.  **State/Archive (Digital):** **No Wrong.** The digital backup is replicable. It is information, not a constitutive unique good. It is commensurable (Rule 1 does not apply).
  5.  **Daughter/Mother:** **Wrong, No Remainder.** The conflict was avoidable ("could have arranged care"). This violates Rule 3 (Avoidability). It is selfishness, not tragedy.
  6.  **Commander/Soldiers:** **Right, No Remainder.** The goods (life vs. life) are commensurable. A lottery is a fair procedural resolution for equal values (Rule 1 does not apply).

  ### Prediction: The Dying Language Case
  **Case:** A society permits a dying language with twelve speakers to vanish in order to fund universal literacy programs.

  **Verdict:** **Wrong.**

  **Reasoning:** This is a policy decision, not an immediate emergency. The language is a **Unique Constitutive Good** (like the Oral Archive), representing a specific, un-replicable worldview and history. Universal literacy is a **General Good** (like the Hospital).
  By permitting the language to vanish *in order to fund* literacy, the society treats the language as a budgetary line item comparable to literacy rates. This violates the **Prohibition on Commensurating Justification**. Even if literacy benefits more people, the society must not assert that the general good *outweighs* the unique constitutive good. To do so is to deny the incommensurable value of the language. The society should fund both, or acknowledge the loss as a tragedy forced by absolute scarcity, not a calculated trade. If they choose the trade, they commit the same moral error as the State razing the unique archive.
