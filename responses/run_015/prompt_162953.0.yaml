answer: |-
  Consider Mara, a resident of the Twin Earth colony whose grandparents emigrated from Earth. When she thirsts and asks for "water," she receives the local clear liquid, XYZ, unaware it differs chemically from her ancestors' H2O. On the historical-chain view, her word refers to H2O, because the linguistic lineage traces unbroken back to the original baptism on Earth; the label traveled with the people, preserving the original grounding despite the change in scenery. But on the causal-regulation view, her word refers to XYZ, because every instance of her using "water" is now triggered by and functionally dependent on the local liquid surrounding her; her brain states are currently regulated by XYZ, not the absent H2O of her ancestors' home. Both agree meaning is outside her head, but they disagree on which outside fact matters: the history of the word or the physics of its current use.

  ***

  **Does it work?**

  *   **Word:** "Water." **Speaker:** Mara (Twin Earth colonist).
  *   **Referents:**
      *   **(1) Historical-Chain:** Refers to **H2O**. **Reason:** The communicative chain connects back to the initial naming event on Earth, which grounded the term in H2O. The chain hasn't been broken or re-baptized.
      *   **(2) Causal-Regulation:** Refers to **XYZ**. **Reason:** Reference is fixed by what currently causes the tokenings. Mara's use is causally covarying with XYZ in her immediate environment; H2O plays no causal role in her current usage.
  *   **The Single Feature:** **Transplantation without Re-grounding.** The community moved from Environment A (H2O) to Environment B (XYZ) while maintaining linguistic continuity.
      *   **Remove Historical Link:** If Mara invented the word herself on Twin Earth (no Earth ancestry), both views say **XYZ** (no history to override, current cause is XYZ).
      *   **Remove Environmental Difference:** If Mara stayed on Earth, both views say **H2O** (history points to H2O, current cause is H2O).
  *   **The Pushback:**
      *   **Historical-Chain Defender:** They might argue that upon arrival, the community implicitly *re-baptized* the local liquid. To maintain the theory, they must insist that intention to preserve reference ("same stuff as back home") overrides the environmental shift.
      *   **Causal-Regulation Defender:** They might argue that the "causal mechanism" includes the historical transmission of the concept, so the *cause* of her usage is still the ancestral kind represented in her inherited cognitive structure. (This blurs the line between the two views).
  *   **The Lesson:** Externalism is not a single thesis. It splits into **Historical Externalism** (content fixed by origin) and **Current Covariation Externalism** (content fixed by present tracking). Your reader learns that "outside the head" is ambiguous: it could mean "outside in the past" or "outside in the present."
  *   **Sanity Check:** Both are genuine externalist views. (1) is the standard Kripke-Putnam semantic externalism. (2) is often called **Informational Semantics** or **Teleosemantics** (e.g., Dretske, Fodor, Millikan). It is externalist because content is determined by external causal laws, not internal descriptions. However, (2) is more controversial regarding error (misrepresentation); if Mara says "water" when pointing to XYZ, is she right (XYZ) or wrong (H2O)? Your setup forces (2) to say she is right about XYZ, which some proponents might resist. I have adhered to your definition of (2) for the sake of the conflict.

  **Bonus: Is Twin Earth essential?**

  **No, but it helps.** A terrestrial version works: imagine a pre-scientific tribe moving from a region of **calcrete** lakes to a region of **silcrete** lakes (superficially identical, chemically distinct). They call both "water."
  *   **What Twin Earth adds:** It guarantees **global indistinguishability**. On Earth, someone might eventually find a sample of the original substance, complicating the "current regulation" (is her use regulated by *all* water, or just local water?). Twin Earth isolates the variable completely: *everything* in Mara's causal field is XYZ. For a magazine piece, Twin Earth is cleaner because it removes the need to explain why no chemist noticed the difference yet; on Twin Earth, the difference is physically absent from her world.
