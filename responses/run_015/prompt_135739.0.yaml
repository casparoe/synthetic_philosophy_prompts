answer: |-
  Here is a quick brainstorming summary on the separation of causation levels: Philosophers typically distinguish symbol-level from substrate-level causation through (1) **Multiple Realizability**, arguing that if the same symbolic outcome arises from distinct physical states, the symbol is the true causal commonality; (2) **Counterfactual Dependence**, where the outcome depends on the symbolic content holding true rather than the specific micro-physics; (3) **Program/Implementation Distinction**, treating the computational logic as constraining the hardware rather than being identical to it; and (4) **Causal Exclusion**, which argues that if the substrate is causally closed, symbols are merely epiphenomenal descriptions unless they can be shown to exert top-down constraint without violating physical conservation laws.

  ***

  **The Lab Case**
  In a shielded vacuum chamber, a calibrated optical scanner hovers over a slab of Careenium etched with a Simmball diagramming a hexagonal bond structure labeled "raise local energy." Upon optical contact, the scanner's embedded logic parses the Simmball's syntax as a command rather than a static image. Within 50 milliseconds, telemetry confirms the targeted Careenium patch shifts from a low-energy bond state to a high-energy state, increasing local potential by exactly 5 joules. Crucially, calorimetric sensors, electromagnetic field detectors, and quantum non-demolition measurements record zero energy transfer, particle exchange, or field propagation between the scanner and the Careenium patch during the transition; the only correlate is the scanner's internal flag marking the Simmball as "interpreted."

  ***

  **Analysis of Verdicts**
  The strict substrate-causation view must argue that our instruments are insufficient; they will claim there is a hidden physical mediator (perhaps a subtle quantum field or unknown particle exchange) that carried the energy, rendering the symbol merely a descriptive pattern riding on top of this hidden physics. Conversely, the downward-computational-causation view argues that the interpreted symbol itself pushed the substrate; because the bond shift occurred *only* when the symbol was successfully interpreted as a command (not merely scanned as shapes), the semantic content exercised causal power over the micro-structure. The exact feature doing the work here is indeed the combination you identified: **interpretation-dependence coupled with the absence of a traceable physical mediator.** The system reacts to the *validity* of the meaning, not just the physical presence of the etching, yet no physical energy bridge connects the reader to the substrate.

  **The Heat Wire Counterfactual**
  If we discover a tiny heat wire running from the scanner to the patch, the case collapses back into standard physicalism. The symbol becomes a mere switch or key; the heat wire provides the sufficient physical cause for the bond shift. The "meaning" is no longer doing the work; the electricity flowing through the wire is. The downward causation verdict loses its footing because the physical closure is restored; the symbol is now epiphenomenal to the energy transfer.

  **The Physicalist Objection**
  A defender of substrate-causation would attack by claiming the "interpretation event" just *is* a physical event (e.g., a specific voltage configuration in the scanner), so the Careenium is actually responding to that physical configuration, not the abstract symbol. Whether this attack succeeds depends on the rigidity of the Careenium definition. If the Careenium is defined to respond only to *semantic validity* (e.g., it ignores the scanner's voltage if the logic circuit parses the symbol incorrectly, even if the voltage is identical), the physicalist attack fails because the physical state is no longer sufficient to predict the outcome. However, if the physicalist insists that semantic validity *supervenes* on the voltage configuration, they maintain that the physics is still doing all the pushing, rendering the "symbol" a useful fiction rather than a causal agent. In this specific thought experiment, the lack of energy transfer protects the downward-causation view from immediate exclusion, but the physicalist can still argue that "interpretation" is simply a complex physical property we haven't fully reduced yet.
