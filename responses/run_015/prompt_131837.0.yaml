      *   *Key Insight:* The "Trichotomy" in the movie is actually about *skill* vs. *outcome*. Phil masters skills (piano, ice sculpture). These are "up to him" in terms of practice, but "not up to him" in terms of audience reception. Yet, the audience *always* receives it well in the loop. The movie removes the risk of failure, which makes it *easier* to be Stoic than in real life.

