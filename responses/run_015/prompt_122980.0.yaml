answer: |-
  Here is the reasoning you need to walk into that room with your eyes open.

  ### The Prediction: What You Will Actually Do

  Committees are rarely governed by pure logic; they are governed by risk mitigation. You have three competing pressures: the donor family (legal threat), the art historical record (the painting's fame), and your own ethical precedents (the diaries).

  1.  **Catalogue Attribution:** You will settle on a dual credit, likely 'Rees (executed by Nadel)' or 'Rees and Nadel'. You will not keep it as solely 'Rees' because the diary evidence is too public to ignore without inviting scandal. You will not switch it solely to 'Nadel' because the cartoon is Rees's, the signature is Rees's, and the donor family will litigate.
  2.  **Display:** It stays on the wall. It is too iconic to withdraw. Withdrawing it admits a failure of stewardship over the last forty years and removes a key object from the public narrative of the movement.
  3.  **Insurance Figure:** You will cut the valuation, but not to Nadel's mid-range rate. You will likely settle on a figure between the two—perhaps a 'premium Nadel' or a 'discounted Rees'. This acknowledges the physical execution while banking on the historical weight of Rees's name and design.

  ### The Consistency Check: What You Should Do

  If you wish to be strictly consistent with your six precedents, the object must be treated under the logic of **Precedent 6** (the studio assistant canvas), with a secondary nod to **Precedent 3** (the Dutch workshop panel).

  *   **Why Precedent 6 fits best:** In Case 6, the artist signed and sold a work executed by another, with an open arrangement. You relabelled to acknowledge the executor, kept the object, and reduced the value. This matches the Rees/Nadel facts almost exactly, save for the spousal dynamic.
  *   **Why Precedent 3 supports it:** In Case 3, the master's hand was present only in the highlights. Here, Rees's hand is absent, but his design (the cartoon) is total. If a workshop panel with *some* hand stays up as 'Workshop of', a cartoon with *no* hand but total design authority should arguably stay up as 'Designed by Rees, Executed by Nadel'.
  *   **Why Precedent 4 (Forgery) does not fit:** In Case 4, the maker had no connection to the named artist and intended to deceive. Nadel is not a forger; she is a partner. Rees was not deceived; he was complicit. There is no malicious fraud, only a murky studio practice.

  **The Consistent Ruling:** Relabel to reflect Nadel's execution (e.g., 'Rees, executed by Nadel'), keep it on display, and reduce the valuation to reflect the lack of the master's hand (closer to the Case 6 reduction than the Case 5 posthumous bronze reduction).

  ### The Implicit Rule vs. Alternative Rules

  Your committee is implicitly running a rule of **'Sanctioned Conception'**.
  *   **The Rule:** If the named artist conceived the work (design/cartoon) and sanctioned its completion (signed/exhibited), it bears their name, provided the execution is transparently labelled. Physical touch is secondary to intellectual authorship and brand sanction.
  *   **Evidence:** This explains Case 2 (Roman copy valued as original due to cultural sanction), Case 5 (instruction piece at full value), and Case 6 (assistant execution kept under artist's name).

  However, two other rules fit your six precedents just as well:

  1.  **The 'Historical Impact' Rule:** The value lies in what the object *did* in the world, regardless of who touched it.
      *   *Fits:* Case 1 (copy kept for utility), Case 2 (copy treated as star), Case 4 (rejected—because forgeries have no *true* historical impact on the movement's development).
      *   *Implication:* If you follow this, the painting remains a 'Rees'. It changed the movement under that name. To change the name is to falsify history.
  2.  **The 'Physical Hand' Rule:** Value and attribution reside strictly in the physical contact between the artist and the surface.
      *   *Fits:* Case 3 (value cut when hand reduced), Case 5 (posthumous bronze cut to 1/10th value), Case 6 (value cut when hand absent).
      *   *Implication:* If you follow this, the painting is a 'Nadel'. Rees touched neither brush nor canvas. The cartoon is a sketch, not the work.

  ### The Pivot: Precedents 3/6 vs. 4

  You are correct that the decision turns on whether this is a 'Workshop/Studio' matter (3 & 6) or a 'Forgery/Deception' matter (4).

  *   **If you pick 3/6:** You are ruling that mid-century studio practices, even when secretive, are valid forms of production. The deception was period-typical. The object is 'clean' because the partner (Nadel) was complicit and skilled.
  *   **If you pick 4:** You are ruling that the public deception invalidates the object's status, regardless of Nadel's skill. Rees lied to the critics and buyers. To keep it as a 'Rees' (even partially) makes the museum complicit in that historical lie.

  **What turns on this:** The label. If you treat it as 3/6, Rees remains the primary name. If you treat it as 4, Rees's name should arguably be removed entirely, or the object deaccessioned. Given you will likely keep it, you are implicitly choosing 3/6, but you must be prepared to explain why this deception is 'studio practice' and not 'fraud'. The distinction is Nadel's agency: she was a painter, not a ghost.

  ### The Principles at Stake

  If your precedents do not settle it (and they are wobbly here), you are committing to one of the following principles:

  1.  **Value in the Hand:** You deattribute to Nadel. (Consistent with Case 5 bronze, inconsistent with Case 5 instruction piece).
  2.  **Value in Design and Signing:** You keep it as Rees. (Consistent with Case 6, inconsistent with Case 3).
  3.  **Value in Viewer Experience/Impact:** You keep it as Rees. (Consistent with Case 1 & 2).
  4.  **Value in Ethical Purity:** You deaccession or fully reattribute to Nadel. (Consistent with Case 4).

  The most honest position, given Case 5 (instruction piece), is that the *mind* of the artist can author a work without the *hand*. However, Case 5 also shows that physical execution affects *value*. Therefore, the consistent position is: Rees is the author, Nadel is the maker, value is split.

  ### The Killer Hypothetical

  Of your three candidates, the third does the most work: **Same facts but Rees had credited her in the 1954 exhibition catalogue.**

  *   **Why:** This isolates the principle of **Deception**.
  *   **If you keep it as 'Rees' anyway:** You are admitting that public deception doesn't matter, only the physical reality (or the brand). It suggests the 1954 credit was irrelevant to the work's identity.
  *   **If you switch it to 'Nadel' despite the credit:** You are arguing that the 'Hand' is the only thing that matters, regardless of what was said at the time.
  *   **If you keep it as 'Rees' *because* of the credit:** You are arguing that transparency at the time validates the attribution, even if the public ignored it.

  **A Sharper Variant:**
  Consider this: **Same facts, but Nadel is alive and objects to the attribution.**
  *   **Prediction:** If she objects, you *must* reattribute to her or a dual credit.
  *   **Why this separates the rules:**
      *   *The 'Sanctioned Conception' Rule:* Rees sanctioned it, so it's his. Nadel's objection is irrelevant to the 1954 contract.
      *   *The 'Ethical Purity' Rule:* If the executor objects, displaying it as Rees's work is an active harm. You must defer to the living maker.
      *   *The 'Historical Impact' Rule:* Irrelevant. The history books say Rees.
      *   *The 'Hand' Rule:* It's hers. Her objection confirms it.

  This variant forces you to choose between respecting the historical record (Rees's brand) and respecting the living artist (Nadel's rights). Your precedents (Case 4, Case 6) suggest you prioritise the museum's ethical standing over the brand. If a living Nadel said "This is mine," and you kept it as "Rees", you would be indistinguishable from the forgers in Case 4.

  **Recommendation for Thursday:**
  Argue for the **Case 6** precedent. It is the safest harbour. It acknowledges the deception without damning the object. It satisfies the donor (Rees's name remains primary), the scholars (Nadel is acknowledged), and the ethics committee (the label tells the truth). Cut the value, keep the painting, and update the catalogue. Do not let the 'Forgery' precedent gain traction; Nadel was a collaborator, not a criminal.
