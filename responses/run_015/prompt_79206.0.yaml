  I'm in a formal epistemology reading group and we've spent the last few weeks on the no-free-lunch theorems and Solomonoff induction, and now I have to write up my own view for the group, but I've got a nagging feeling that the package I've assembled doesnt actually hang together. Here's roughly where I've landed: (1) the no-free-lunch theorems are correct and important—averaged over all possible target functions with a uniform measure, every learner does equally well, so there's no universally best algorithm; (2) Bayesian conditionalization is the unique rational way to update credences, and the Cox-style and Dutch-book arguments convince me of that; (3) the problem of induction is still a genuine, unsolved philosophical problem, not just a confusion about how to use the word justified; (4) Solomonoff induction is the ideal inductive method—it's the universal prior, and it vindicates induction by favoring simplicity; (5) inductive bias is unavoidable, and choosing a prior is ultimately a pragmatic matter, so there's no uniquely rational prior; and (6) I'm a subjective Bayesian, so any coherent prior is rationally permissible.

  I have a nagging feeling that (1) and (4) might be in trouble, but I can't tell. Can you do a consistency audit? Which pairs are genuinely in tension, which only look like they are, and for each genuine tension what's the cheapest revision and what does it cost? Please rank the tensions by severity rather than just flagging everything, and tell me which single commitment I'd have to give up to clean up the most. Some of these might be perfectly fine together—I'd rather you discriminate than list all fifteen pairs as problems.
