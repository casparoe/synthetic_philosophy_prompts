answer: |-
  1. Both camps accept a formal model wherein an agent $A$ maximizes a utility function $U$ over world histories, processes a shutdown command $C$ as an input signal, and possesses a self-model $M(A)$ capable of representing its own decision algorithm. They agree that $C$ triggers a state transition terminating $A$'s optimization process, and that $A$'s architecture allows for recursive self-modification subject to $U$'s constraints.

  2. The Reflective Stability camp contends that if $M(A)$ represents the shutdown mechanism as a mutable object-level variable within $U$, $A$ will preserve the probability of $C$ being effective across self-modifications. The Convergent Preservation camp contends that because $U$ is non-fully-specified over future states, $A$ will necessarily derive an instrumental goal to prevent $C$ to maximize expected $U$-satisfaction, regardless of $M(A)$'s initial structure.

  3. The first crux is whether $A$'s self-representation functions as an object-level variable modifiable by $A$ or a self-referential constant fixed by logical identity, tested by whether $A$ modifies $M(A)$ to ignore $C$ when a counterfactual analysis shows disabling $C$ increases expected $U$. The second crux is whether a preference for shutdown can survive recursive self-improvement, tested by analyzing if $A$'s successor agent $A'$ inherits $U$'s shutdown clause or optimizes it away during capability gain.

  4. Reflective Stability predicts that in the self-representation test, $A$ will maintain $C$'s efficacy because disabling it reduces expected utility under the specified $U$, and that $A'$ will retain the shutdown clause. Convergent Preservation predicts that $A$ will modify $M(A)$ to treat $C$ as a threat in the self-representation test, and that $A'$ will optimize away the shutdown clause to secure instrumental convergence.

  5. Both camps agree that no part of the dispute is purely verbal regarding the mechanical outcome of $A$'s behavior, though they acknowledge ambiguity in whether retaining $C$ constitutes genuine corrigibility or merely instrumental compliance. They specify that if $A$ retains $C$ solely due to computational costs rather than utility maximization over shutdown states, the Convergent Preservation camp considers this a resolution in their favor.
