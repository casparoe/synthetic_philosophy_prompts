answer: |-
  ### The Correspondence Table: Mapping Biology to Lewis

  To evaluate the evolutionary critique of David Lewis's *Convention* (1969), we must first translate the biological taxonomy into the language of game-theoretic rationalism. Lewis defines a convention as a regularity in behavior sustained by a system of preferences and mutual expectations within a coordination problem. The evolutionary analogy attempts to naturalize this by treating the convention as a phenotype selected over time.

  | Biological Concept | Lewisian Equivalent | Function in the System |
  | :--- | :--- | :--- |
  | **Genome** | **Conditional Strategy / Expectation** | The "code" carried by the agent. In Lewis, this is the agent's intention to conform *if* they expect others to conform. It is the informational state guiding behavior. |
  | **Mutation** | **Experimental Deviation** | Random or deliberate variation in behavior. An agent tries a different signal or action to test payoffs, akin to a genetic mutation introducing a new trait. |
  | **Selective Pressure** | **Coordination Payoff** | The reward structure of the coordination problem. Successful coordination yields high utility; failure yields low utility. This "selects" for strategies that match the population. |
  | **Fitness Landscape** | **Equilibrium Structure** | The topology of the coordination problem (e.g., the payoff matrix). It defines which combinations of strategies are stable (Nash equilibria) and which are unstable. |

  ### Points of Collapse: Where the Analogy Fails

  While the mapping above offers a structural isomorphism, the analogy collapses when examining the *mechanism* of transmission and stability. Three specific friction points reveal the limits of the evolutionary framing when applied to Lewis's specific account.

  **1. Intentional Choice vs. Blind Retention**
  In biology, retention is blind; successful traits propagate because their bearers survive, not because the traits "know" they are successful. In Lewis's framework, agents are hyper-rational. They do not merely survive; they *choose* to conform because they calculate that conformity maximizes their utility given their expectations. The evolutionary model treats the agent as a vessel for the strategy; Lewis treats the agent as the author of the strategy.

  **2. Common Knowledge vs. Population Frequency**
  This is the most significant rupture. Lewis requires **common knowledge** (a recursive epistemic state: *I know that you know that I know...*) to sustain a convention. This epistemic state creates a normative reason for action. Evolutionary models rely on **population frequency** (I know that most people do X). Frequency does not guarantee common knowledge. I might know everyone drives on the right, but if I don't know that *you* know that *I* know, the Lewisian convention is technically incomplete, even if the behavior is evolutionarily stable.

  **3. Rate of Change: Punctuated Equilibrium vs. Instantaneous Flip**
  Biological evolution is generally gradual (punctuated by rare catastrophes). Lewisian conventions can flip instantaneously. If a focal point emerges (e.g., a public announcement changes the salience of one equilibrium over another), rational agents can switch conventions immediately without waiting for a "generation" of selection. The evolutionary model struggles to account for the speed of rational coordination shifts.

  ### Do Disanalogies Undermine the Critique or Shift the Scale?

  The disanalogies do not merely place the two accounts on different temporal scales; they indicate that the accounts are answering different questions. The evolutionary critique attempts to explain the **genesis** of the norm (diachronic), while Lewis explains the **justification** for compliance (synchronic).

  If the evolutionary critic argues that "because norms evolved blindly, they are not rational," they commit a genetic fallacy. The origin of a belief (evolutionary habit) does not necessarily negate its current rational status (epistemic justification). However, if the critic argues that "Lewis's requirement for common knowledge is psychologically unrealistic and evolutionary learning explains how we actually get there," the critique holds weight regarding *plausibility*, but not regarding *logic*.

  Therefore, the disanalogies undermine the evolutionary critique only if that critique claims to replace Lewis's account entirely. If the evolutionary account is viewed as a description of the *historical path* to the equilibrium, and Lewis's account is viewed as the *logical structure* of the equilibrium once reached, the tension dissolves. The "temporal scale" argument is insufficient because it ignores the epistemic gap: evolution produces behavior, but Lewis requires *reasons*.

  ### Compatibility: Non-Rational Mechanisms vs. Rational Solutions

  Does the evolutionary picture smuggle in a non-rational mechanism that Lewis excludes? **Yes, but compatibly.**

  Lewis explicitly distinguishes between acting on a **reason** (rational expectation) and acting on a **habit** (non-rational regularity). He acknowledges that conventions often become habitual, but he insists their *status* as conventions depends on the underlying preference for coordination. Evolutionary mechanisms (reinforcement learning, mimicry) are largely non-rational or boundedly rational in the Lewisian sense. They operate via causal feedback loops rather than deductive reasoning from common knowledge.

  However, this does not make the two descriptions incompatible. They operate at different levels of analysis:
  1.  **Evolutionary Level:** Explains how the population converges on a specific equilibrium among many possibilities (the selection problem).
  2.  **Lewisian Level:** Explains why an individual agent adheres to that equilibrium once it is established (the compliance problem).

  The evolutionary account explains why we are at *this* peak on the fitness landscape; Lewis explains why it is rational for me to stay here given that you are here. The "non-rational mechanism" of evolution builds the stage; the "rational mechanism" of Lewis performs the play.

  ### Final Conclusion: Do Norms Survive as Rational Solutions?

  The conclusion that **"norms are not rational solutions" does not survive** once the mapping failures are fully exposed.

  The evolutionary critique successfully demonstrates that the *historical path* to a norm may be irrational, arbitrary, or blind. It successfully challenges the idea that agents must have explicitly reasoned their way to the convention from a state of nature. However, it fails to disprove that the *current adherence* to the norm constitutes a rational solution to a coordination problem.

  Even if a norm emerged via blind variation and selective retention, once it exists, it creates a structure of expectations. For a Lewisian agent, conforming to that established norm remains the utility-maximizing choice given the expectation of others' conformity. The norm retains its status as a **rational solution** to the coordination problem, even if its **origin** was not the product of rational design. The evolutionary account explains the *arbitrariness* of the selection (why we drive on the right rather than the left), but Lewis's account preserves the *rationality* of the adherence (why I drive on the right given that you do). Thus, the evolutionary framing supplements Lewis by explaining the selection of the equilibrium, but it does not supplant Lewis's claim that maintaining the convention is a rational act.
