  ### The principle

  Selection is fundamentally change in replicator frequency, but the "unit of selection" refers to the level where fitness interests align. When lower-level replicators cooperate to maximize the higher-level vehicle's fitness, that vehicle is the unit of adaptation. When lower-level replicators compete at the vehicle's expense, the replicator is the unit of interest. Higher-level units (groups) qualify only if fitness variance between groups exceeds variance within groups, independent of kinship. This separates the bookkeeping level (genes), which always tracks frequency, from the level of functional design (organism or group), which tracks whose welfare is enhanced. Your intuition about separating measurement from interest is the key insight here. It allows you to maintain that genes are the permanent recorders of evolution while acknowledging that organisms are often the primary beneficiaries of the process.

  ### Where each clause comes from

  Your cases [b] and [c] drive the conflict clause: mitochondria and distorters increase frequency by harming the organism, proving the gene is the sole beneficiary while the organism is merely the arena. Case [d] drives the alignment clause: camouflage helps both gene and organism, legitimizing the organism as the unit of adaptation even if genes replicate. Case [a] informs the kinship caveat: worker sterility looks like group benefit but is explained by gene-level relatedness, so no additional group-level process is needed; the colony is a vehicle, not a selector. The haplodiploidy math handles the frequency change without invoking colony-level fitness. This validates your refusal to add a second explanation. Case [e] sets the variance threshold: genuine group selection requires between-group competition that isn't just kin selection in disguise. If the groups are families, it's kin selection. If they are arbitrary aggregates where within-group relatedness is low, then group selection operates. This respects your resistance to reducing everything to genes while preventing over-attribution of group agency. It validates your instinct that [a] and [e] are different, even if both involve groups. The principle demands you check the relatedness structure before assigning the level.

  ### Verdicts I'd have to give up

  You must surrender the strong version of [e]. Most restraint traits are explicable via kin selection; genuine group selection requires specific ecological structures rarely met. You also need to refine [d]: you cannot say the organism is selected *instead* of the gene, but rather that the organism is the *vehicle* whose success mirrors the gene's. Your intuition that [c] and [d] differ is correct, but the difference is interest alignment, not the mechanism of frequency change. The bookkeeping is identical, but the functional interpretation differs. In [c], the gene wins and the organism loses. In [d], both win. This preserves your quantitative intuition while accepting the gene's role as the replicator.

  ### New cases

  Genomic imprinting is intragenomic conflict, akin to CMS. Paternal alleles demand resources for the current seed; maternal alleles restrict them to save resources for future seeds. The kernel is the arena, not the unit; selection acts on allele lineages within the individual based on parent-of-origin. The paternal genome is selected to extract, the maternal to conserve. A better test case is the holobiont (host plus microbiome). If beneficial bacteria are vertically transmitted, interests align (organism-level). If horizontally transmitted, bacteria may exploit the host (gene-level conflict). This tests whether functional integration creates a new unit or remains a battlefield. It directly applies your principle: does the lower level disappear into the higher level's success, or does it fight it? In maize, if endosperm size optimizes maternal fitness, the organism is the unit. If it optimizes paternal transmission at maternal expense, the allele is the unit. This mirrors your CMS verdict perfectly. The imprinting case is crucial because it shows conflict within the nucleus, not just between nucleus and cytoplasm, proving that even the "individual" genome is not always a unified unit of selection.

  ### Confidence

  I am highly confident in the distinction between unit of inheritance and unit of adaptation, as it resolves your [c] versus [d] tension without denying quantitative genetics. I am less confident regarding [e]. The boundary between kin selection and group selection is mathematically equivalent in many models, differing only in accounting style. Whether nature contains many true group-selection cases beyond kinship is an empirical question where consensus is still shifting.
