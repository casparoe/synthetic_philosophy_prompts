answer: |-
  You are right to reject *akrasia* and *hyperbolic discounting* as precise labels, even though they are the usual go-to terms. Your intuition is correct: those concepts describe a *conflict* or a *shift* in value, whereas your experience is one of *continuity* in value paired with a *displacement* in action.

  There is no single, universally standardized academic term for exactly this configuration (stable valuation + infinite rescheduling + self-awareness), which is why your friend's terms felt slightly off. However, there are established concepts that carve up the territory, and one specific conceptual "carving" that fits your case best.

  ### 1. Why your friend's terms miss the mark

  **Akrasia (Weakness of Will)**
  *   **The Standard Definition:** Acting against your own better judgment *in the moment*. (e.g., "I judge I should run now, but I choose the sofa now.")
  *   **Why it doesn't fit:** You are not choosing the sofa *over* the run in a moment of conflict. You are choosing "Run Tomorrow" over "Run Today." You are not violating your judgment that running is good; you are adhering to a judgment that *timing* matters. You feel no internal conflict, only a calendar shift.
  *   **The Nuance:** In philosophy, this is sometimes called **"Tempered Akrasia"** or **"Diachronic Akrasia,"** but those are technical distinctions that won't help your argument.

  **Hyperbolic Discounting**
  *   **The Standard Definition:** Your preferences *reverse* based on proximity. (e.g., On Sunday, you prefer Running-Monday over Sofa-Monday. On Monday, you prefer Sofa-Now over Running-Now.)
  *   **Why it doesn't fit:** You report that your preference for running *does not change*. Sunday-You and Monday-You both value the run equally. Hyperbolic discounting requires that Monday-You suddenly values the sofa *more* than Sunday-You anticipated. You are saying the value of the run stays constant, but the "cost" of starting *today* always feels slightly higher than the cost of starting *tomorrow*.
  *   **The Nuance:** This is technically a form of **"Present Bias,"** but Present Bias usually implies a change in valuation. Your case is rarer: it is **"Stable Valuation with Volatile Initiation."**

  ### 2. The Best Existing Concepts

  If you need established terminology to anchor your argument, these two concepts fit best:

  **A. The Intention-Behavior Gap (specifically: Implementation Failure)**
  Psychologist Peter Gollwitzer distinguishes between **Goal Intentions** ("I intend to achieve X") and **Implementation Intentions** ("If situation Y arises, I will do Z").
  *   **Your Case:** You have robust *Goal Intentions* (stable desire to run). You lack *Implementation Intentions* (specific triggers).
  *   **The Mechanism:** Because you haven't bound the intention to a specific cue (e.g., "When alarm rings, I put on shoes"), every morning becomes a new decision point. At each new decision point, you re-evaluate the "conditions" (e.g., "Is this week clear?"). Since the conditions are vague, they are never met.
  *   **Why it helps:** It shifts the blame from *character* ("I'm lazy") to *structure* ("I lack a trigger").

  **B. Sophisticated Procrastination (with Resolute Failure)**
  Economists O'Donoghue and Rabin distinguish between **Naive** procrastinators (who think they will do it tomorrow and actually believe it) and **Sophisticated** procrastinators (who know they will procrastinate tomorrow).
  *   **Your Case:** You are **Sophisticated**. You know you will slide.
  *   **The Twist:** Usually, Sophisticated procrastinators force themselves to act *today* to avoid the pain of knowing they won't act tomorrow. You are doing the opposite: you are accepting the slide despite knowing it. This is sometimes called **"Sophistication without Resoluteness."**
  *   **Why it helps:** It validates that your prediction ("I know I'll do this") is rational, not a sign of self-deception.

  ### 3. The Coinage: "Diachronic Drift"

  Since existing terms carry baggage (akrasia implies conflict; procrastination implies laziness), I propose you use the term **Diachronic Drift**.

  **Definition:**
  > **Diachronic Drift** is the phenomenon wherein an agent maintains a stable, sincere intention to perform an action across multiple time slices, but systematically fails to bind that intention to the present moment, resulting in the infinite deferral of the start date without a revision of the underlying goal.

  **The Carving (How to tell if it applies):**
  To determine if a case is *Diachronic Drift* versus ordinary *Procrastination* or *Akrasia*, apply these three tests:

  1.  **The Sincerity Test:** If you ask the agent on Day 1 and Day 5, "Do you still intend to do this?" they answer "Yes" with identical conviction. (In Akrasia, conviction often wavers or is accompanied by guilt/conflict).
  2.  **The Reason Test:** The reason given for delaying on Day 5 ("It's too busy this week") would have been accepted as valid on Day 1. (In Procrastination, the reasons often change or become more desperate).
  3.  **The Precommitment Test:** If external constraints force the action (e.g., paying for a class), the agent acts happily and without resistance. (In Akrasia/Laziness, external constraints often feel like a burden or are resisted).

  ### 4. How this ends the argument

  The argument with your girlfriend likely hinges on **Interpretation of Inaction**.
  *   **Her Interpretation:** Inaction = Lack of Desire. ("If you really wanted to run, you would run.")
  *   **Your Interpretation:** Inaction = Scheduling Error. ("I want to run, I just keep moving the start date.")

  Using **Diachronic Drift** allows you to say:

  > "This isn't that I don't want to run (Valuation). It's that I am suffering from **Diachronic Drift**. My desire is stable, but my initiation mechanism is unbound. I am treating every morning as a new planning session rather than an execution session. That's why paying for the class worked: it removed the 'planning' step and forced 'execution.' I'm not lying about wanting it; I'm failing to bridge the gap between Future-Me and Present-Me."

  ### 5. The Predicting-and-Precommitting Aspect

  You asked if the predicting part is separate. It is not separate; it is the **diagnostic feature**.

  *   **Prediction:** This confirms you are a **Sophisticated Agent**. You have accurate metacognition about your own behavior.
  *   **Precommitment:** This confirms the blockage is **Executive**, not **Motivational**. If the problem were motivation (not caring), paying money wouldn't make you run; you'd just lose the money. The fact that precommitment *works* proves the desire is real and the only missing variable is **binding**.

  **Summary for the argument:**
  You are not experiencing *akrasia* (conflict) or *hyperbolic discounting* (changing preferences). You are experiencing **Diachronic Drift** (stable intention, sliding execution). The solution is not "trying harder" (which addresses motivation), but **Implementation Intentions** (binding the action to a cue) or **Precommitment** (removing the choice), both of which you have already proven work. The word validates that your desire is real, even if your calendar is lying to you.
