  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Status of the Frame Problem in Contemporary Artificial Intelligence
  **Parties:** Representational Inertia Theorists (RIT) and Predictive Dissolution Theorists (PDT)
  **Date:** October 2023

  ## Preamble

  This document summarizes the outcomes of a twelve-month structured debate between the Representational Inertia Theorists (RIT) and the Predictive Dissolution Theorists (PDT). The objective of this collaboration was not to force a consensus where none exists, but to precisely map the boundary between agreed-upon technical facts and genuine philosophical divergence regarding the "frame problem." The following sections detail the substantive claims both camps accept, the specific points where their interpretations diverge, and the empirical cruxes that would adjudicate the dispute.

  ## I. Substantive Agreed Claims

  Both camps affirm the following five claims. These statements are formulated to avoid ambiguity while respecting the theoretical commitments of both sides.

  1.  **Structure of the Original Problem:** The classical frame problem arises in any system that maintains an explicit, symbolic model of the world state. In such systems, executing an action requires updating the model to reflect changes. Without a specific mechanism to isolate changes, the system must logically verify every known relation to confirm it remains unchanged, leading to a combinatorial explosion of computational requirements as the model grows.
  2.  **Architecture of Modern Systems:** Contemporary high-performance AI architectures (including deep neural networks and hierarchical predictive systems) do not utilize explicit frame axioms or logical registries of non-change. They operate via parameter adjustments, activation patterns, or error minimization rather than symbolic deduction over a static knowledge base.
  3.  **Distinction Between Correlation and Commitment:** There is a formal distinction between statistical correlation and explicit representational commitment. A system may behave *as if* it knows a relation remains unchanged based on statistical regularity (high probability weights) without holding an explicit logical commitment that the relation *must* remain unchanged (necessary truth axioms).
  4.  **Requirement for Open-World Robustness:** For an agent to function robustly in an open world, it must successfully navigate environments where most things remain unchanged despite its actions, including scenarios involving unanticipated objects or rearrangements. Failure to correctly assume stability results in computational paralysis or physical error.
  5.  **Empirical Performance in Bounded Domains:** Current architectures demonstrate high proficiency in bounded domains where statistical regularities are stable. Both camps agree that these systems successfully avoid the combinatorial explosion described in Claim 1 within these specific constraints, though they disagree on the mechanism enabling this success.

  ## II. Table of Disagreements

  The following table isolates the precise points of divergence. Where a disagreement stems from terminology rather than physical prediction, it is marked as "Verbal." Where it stems from conflicting expectations about system behavior or capabilities, it is marked as "Substantive."

  | Point of Divergence | Representational Inertia Theorists (RIT) | Predictive Dissolution Theorists (PDT) | Classification & Analysis |
  | :--- | :--- | :--- | :--- |
  | **Criteria for Solution** | The frame problem is solved only if the system renders explicit frame axioms unnecessary *while maintaining explicit representational consistency*. If the system lacks explicit consistency, it has not solved the problem; it has avoided the architecture that generates it. | The frame problem is solved if the system achieves reliable behavior in open domains without explicit frame axioms. The requirement for global symbolic consistency is an obsolete constraint not required for intelligence. | **Substantive.** This is not merely definitional; it concerns whether "intelligence" requires logical consistency or merely functional adequacy. |
  | **Status of Invariants** | Statistical learning implicitly encodes invariant relations within weights. These are fragile representations that function as hidden frame axioms. When statistical regularities break, the lack of explicit non-change logic causes failure. | Predictive systems do not encode invariants as representations. They bypass the need for invariants by continuously correcting local errors. Stability is a dynamic process, not a stored fact. | **Mixed (Verbal/Substantive).** **Verbal:** The dispute over whether weights count as "implicit representations" is largely terminological. **Substantive:** The claim that breaking regularities causes catastrophic failure (RIT) versus graceful degradation (PDT) is an empirical disagreement. |
  | **Scalability of Dissolution** | The combinatorial deficit re-emerges as complexity scales. Without explicit non-change registries, the system cannot distinguish relevant from irrelevant changes in novel, high-complexity environments. | Hierarchical predictive processing scales without combinatorial explosion because error signals are local. Complexity is managed through abstraction layers, not exhaustive relation checking. | **Substantive.** This concerns the computational limits of non-symbolic architectures in high-complexity, open-ended tasks. |

  ## III. Empirical Cruxes and Pre-Registered Predictions

  To move beyond theoretical stalemate, both camps identify two specific cruxes. For each crux, we define a concrete experimental scenario. Both camps pre-register their predictions regarding the outcome and its implication for their respective positions.

  ### Crux 1: Statistical Generalization vs. Counterfactual Reasoning

  **The Question:** Does statistical generalization in deep networks constitute an implicit representation of invariant relations across contexts, or merely a non-representational bypass that fails in counterfactual reasoning about unobserved interventions?

  **The Test Case:**
  A neural agent is trained in a simulated physical environment where object permanence holds (objects do not vanish when occluded). The agent is then subjected to a *counterfactual intervention test*: it is placed in a scenario where an object is visibly manipulated by an external force to vanish while occluded (violating the training distribution), and then asked to plan a retrieval action based on the belief that the object exists.

  **Pre-Registered Predictions:**
  *   **RIT Prediction:** The agent will fail to plan correctly or will exhibit high confidence in the object's existence despite visual evidence of vanishing.
      *   *Implication:* This confirms that statistical weights act as fragile implicit axioms. Without explicit logical overrides for counterfactuals, the system cannot distinguish between "usually true" and "necessarily true," confirming the frame problem remains unresolved in statistical systems.
  *   **PDT Prediction:** The agent will rapidly update its predictive model upon observing the vanishing event and adjust its plan accordingly without catastrophic failure.
      *   *Implication:* This confirms that the system operates via error minimization rather than stored axioms. The "violation" is treated as a prediction error to be minimized, not a logical contradiction to be resolved, demonstrating the frame problem is dissolved in predictive architectures.

  ### Crux 2: The Unanticipated Object Substitution

  **The Question:** Is there a demonstrable class of tasks for which local predictive error correction is provably insufficient and an explicit non-change registry becomes unavoidable?

  **The Test Case:**
  An autonomous logistics agent operates in a dynamically rearranged warehouse. The agent is tasked with retrieving Item A from Shelf 1. During the agent's transit, a human operator swaps Item A with Item B (which has similar visual features but different weight/handling requirements) without the agent's knowledge. The agent arrives at Shelf 1. The test measures whether the agent detects the substitution before attempting retrieval and whether it updates its global map of the warehouse correctly for future tasks without re-exploring the entire facility.

  **Pre-Registered Predictions:**
  *   **RIT Prediction:** The agent will attempt to retrieve Item A using parameters for Item A (e.g., grip strength), causing a physical error, and will fail to update its global map regarding the location of Item B without exhaustive re-scanning.
      *   *Implication:* This demonstrates that local error correction is insufficient for maintaining global state consistency. An explicit registry of non-changes (what stayed on other shelves) is required to avoid re-verifying the entire world, proving the frame problem is a live obstacle.
  *   **PDT Prediction:** The agent will detect the mismatch via tactile or visual prediction error upon arrival, adjust its grip parameters immediately, and update its internal map locally without needing to re-verify other shelves.
      *   *Implication:* This demonstrates that robust behavior does not require an exhaustive registry of non-changes. The system assumes stability elsewhere until local error signals dictate otherwise, proving the combinatorial worry never arises in practice.

  ## Signatures

  **Representational Inertia Theorists**
  *Accepted as accurate record of position and predictions.*

  **Predictive Dissolution Theorists**
  *Accepted as accurate record of position and predictions.*
