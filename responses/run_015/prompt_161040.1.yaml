prompt: |-
  hi — I'm retired now, thirty-odd years as a research biologist in a government fisheries lab (stock assessment, lots of probability, lots of arguing about what counts as evidence), and in the last couple of years I've gotten into philosophy the way people get into birding: badly at first, then obsessively. Which is how I ended up on the review panel at our regional eye hospital. They've started enrolling adults who've been blind since early childhood in a pilot that combines a gene therapy with a retinal implant — partial sight restoration, 6 to 12 months of rehab, irreversible, maybe 40 candidates a year, and we meet one afternoon a month with a stack of files. The panel is me, a nurse, a clinical lead who signs off, a chaplain, and a rotating community member. We have about ninety minutes per intake and a one-page form, and whatever we write has to be defensible to the hospital's legal office. My instinct, from old habit, is to build a decision tree with probabilities and utilities and a threshold. A philosopher friend of mine says that is exactly the mistake for part of this: she got me reading about transformative experience, the idea that with some choices you cannot know what you are choosing between until you have chosen it, because the outcome changes what you want and maybe who you are, so the expected-utility machinery has nothing to run on. I more or less buy that. What I cannot do is get from that idea to something four non-specialists can actually run on a Tuesday afternoon.

  So: write me the procedure. Ordered questions, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values rather than facts. A few things it has to do. First, it has to split the parts where my numbers are legitimate — infection and detachment rates, rehab burden, hours of training, measurable acuity outcomes — from the part where I am told the numbers are fake, and tell me what to put in that second slot instead of a probability. Second, I want an actual weighting rule for testimony from people who've already been through the procedure: they are the only ones with access to what it is like, and they are also the ones most likely to be rationalizing a choice they can't undo. "Listen to them respectfully" is not a rule; give me something I can write on the form, including when I should discount a transformed person's report and when I shouldn't. Third, handle the cases where the file is really a family's file — parents pushing, a partner pushing, a candidate who is ambivalent in a way that might just be fear. Fourth, mark the steps that are judgment calls dressed up as procedure, and tell me which pieces of apparent rigor I should throw out because they're fake rigor. And give me a stopping rule, because we are volunteers and we cannot become an endless counseling service.

  Then run it on three files. (1) A 34-year-old, blind since about eighteen months, eager, has done the counseling, has realistic expectations, wants to recognise his kids' faces — I expect a yes, so mostly I want to see how fast the procedure gets there and what goes in the record. (2) A 19-year-old, blind from birth, lives at a residential school and is embedded in a tight-knit blind community, ambivalent, with two sighted parents who are convinced this is obviously the right call and keep calling us. (3) A 52-year-old, blind since age three, by a mile the best-adjusted candidate we've seen, articulate, very rooted in a community where blindness is part of who people are; he says he's not sure he wants to spend his fifties being a bad sighted person and losing the competence he's spent a life building. My suspicion is that the answer I'll hate is in file 3 — either that his own stated preference is exactly the unreliable thing and we shouldn't defer to it, which reads to me as straight paternalism, or that the procedure says yes to somebody who doesn't want it. Tell me honestly which one it is, show the run, and finish by saying what the procedure can't do — where we just have to sit there as people and decide.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case runs:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Retired research biologist (30+ years), government fisheries lab. Expert in stock assessment, probability, evidence, argumentation. New to philosophy (obsessive recently). Serving on a hospital ethics/review panel for a blind restoration pilot (gene therapy + retinal implant).
      *   **The Problem:** He wants to use decision trees/probabilities (old habit), but recognizes the "Transformative Experience" objection (L.A. Paul). He needs a practical procedure for a panel of non-specialists (nurse, clinical lead, chaplain, community member) to use in 90-minute sessions.
      *   **Key Requirements:**
          1.  Split factual/probabilistic inputs (infection rates, etc.) from transformative/subjective inputs (what it's *like*).
          2.  Provide a weighting rule for testimony from past participants (experts on experience vs. potential rationalization).
          3.  Handle family dynamics/pressure vs. candidate ambivalence.
          4.  Identify "fake rigor" (judgment calls dressed as procedure) vs. real rigor.
          5.  Provide a stopping rule (avoid endless counseling).
          6.  Run the procedure on three specific cases (34yo eager, 19yo ambivalent/parent-pushed, 52yo competent/reluctant).
          7.  Address the ethical dilemma in Case 3 (paternalism vs. autonomy).
          8.  Conclude with the limits of the procedure.

  2.  **Deconstruct the Philosophical Core:**
      *   *Transformative Experience (L.A. Paul):* You can't assign utility to an outcome you can't conceive of, and the outcome changes the "you" that assigns utility.
      *   *Implication for Panel:* Expected Utility Theory (EUT) fails for the *personal value* of sight. It works for *medical risk*, but not for *life value*.
      *   *Solution:* The procedure must shift from "Maximizing Good Outcome" to "Validating Authentic Authorization." The question isn't "Will this go well?" (unknowable) but "Is this choice authentically theirs, given the unknowability?"

  3.  **Drafting the Procedure (The "Algorithm"):**
      *   *Structure:* Needs to be linear, with stop conditions.
      *   *Section 1: Medical/Factual Gate (The Biologist's Domain).* This is where probabilities live. Infection, detachment, rehab hours. Pass/Fail based on clinical thresholds.
      *   *Section 2: The Transformative Gap (The Philosopher's Domain).* Acknowledge EUT failure. Use "Proxy Imagination" instead of "Utility Calculation."
      *   *Section 3: Testimony Weighting.* How to handle past patients. Rule: Weight *process* reports high, *outcome value* reports low. (e.g., "Rehab was hard" = fact. "It was worth it" = subjective rationalization).
      *   *Section 4: Autonomy & Pressure.* Distinguish fear of change from fear of coercion.
      *   *Section 5: The Decision Rule.* Not "Yes/No" based on success likelihood, but "Authorized/Not Authorized."
      *   *Fake Rigor Check:* Explicitly call out where numbers pretend to be values.

  4.  **Developing the Testimony Weighting Rule:**
      *   Problem: Past patients are the only epistemic authorities on the experience, but they suffer from cognitive dissonance (sunk cost).
      *   Rule: Split testimony into *Phenomenological Data* (what happened, sensory overload, fatigue) and *Evaluative Verdict* (was it worth it).
      *   Action: Panel accepts Data as evidence for prep. Panel disregards Verdict as evidence for decision. The candidate must make their own Verdict.

  5.  **Developing the Family/Pressure Protocol:**
      *   Problem: Parents/Partners want sight for the candidate (often for their own ease).
      *   Rule: Separate interviews. If candidate's stated desire shifts significantly when family is absent, flag as "Coercion Risk."
      *   Ambivalence: Distinguish "I'm scared of the unknown" (Normal) vs. "I don't want this but they do" (Exclusionary).

  6.  **Addressing "Fake Rigor":**
      *   Scoring systems for "quality of life."
      *   Probability estimates of "satisfaction."
      *   Consensus voting (hides individual responsibility).

  7.  **Running the Cases:**
      *   *Case 1 (34yo, eager):* Should pass quickly. Focus is on ensuring expectations aren't magical.
      *   *Case 2 (19yo, ambivalent, parents pushing):* High risk of inauthenticity. Procedure should stall or reject until autonomy is clear.
      *   *Case 3 (52yo, competent, reluctant):* The hard one.
          *   *Biologist instinct:* He's rational, knows the risks, says no. Respect autonomy -> No.
          *   *Medical Paternalism:* He's depressed? Denying himself good? -> Yes?
          *   *Transformative View:* He values his current identity. Changing it is a loss *to him*.
          *   *Verdict:* The procedure must respect his "No." To override is to treat him as a vessel for sight, not a person. The "hate" feeling comes from the biologist wanting to "fix" the broken variable. The philosopher says the variable isn't broken.

  8.  **Refining the Output Tone:**
      *   Respect the user's background. Use terms like "epistemic access," "utility function," "false precision."
      *   Be direct, structured, and practical. No fluff.
      *   Acknowledge the emotional weight.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too abstract?
      *   *Fix:* Make it a checklist with specific "Stop" commands.
      *   *Critique:* Did I answer the "weighting rule" specifically?
      *   *Fix:* Create a specific "Testimony Matrix."
      *   *Critique:* Case 3 resolution needs to be honest about the tension.
      *   *Fix:* Explicitly state that overriding him is paternalism, and the procedure should forbid it, even if it feels like a "wasted opportunity."

  10. **Final Polish:** Check against all constraints in the prompt. (Stopping rule, fake rigor, weighting rule, 3 cases, limits of procedure).

  *(Self-Correction on Case 3)*: The prompt asks: "My suspicion is that the answer I'll hate is in file 3 — either that his own stated preference is exactly the unreliable thing and we shouldn't defer to it... or that the procedure says yes to somebody who doesn't want it."
  *Analysis:* If the procedure says "Yes" to someone who doesn't want it, that's malpractice. If the procedure says "No" because we think his preference is unreliable (adaptive preference), that's paternalism.
  *Resolution:* The procedure must defer to his "No." The "hate" comes from the biologist's desire to optimize health outcomes over identity integrity. I need to make sure the procedure explicitly protects the right to refuse based on identity preservation.

  *(Refining the "Stopping Rule")*: The panel isn't therapy. If the candidate is fundamentally unsure after counseling, the default is "No." Uncertainty = No.

  *(Refining "Fake Rigor")*: Specifically call out "Quality of Life Scores" and "Probability of Satisfaction."

