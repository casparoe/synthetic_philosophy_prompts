  **Project Title:** The Semantic Limits of Isotype: Repetition, Logic, and Self-Explanation

  **Research Question:**
  This project investigates whether Otto Neurath's "repetition-only constraint"—the rule that quantity must be expressed by repeating identical pictograms rather than varying size or shading—is a necessary condition for a picture language to remain self-explanatory. Specifically: Can a more permissive pictorial system express logical operators (negation, conditionality, universal quantification) without relying on verbal labels, or does doing so inevitably transform the system into disguised verbal notation? The project aims for a determinate conclusion regarding the semantic necessity of this constraint.

  **Context and Significance:**
  Neurath argued Isotype was a "helping language" incapable of replacing words because pictures unite audiences while words divide. He regarded verbal language as divisive and pictures as unifying, necessitating a modest role for Isotype. He insisted on repetition for quantity and verbal accompaniment for logic. While scholars accept Neurath's historical modesty, few have tested whether his constraints are technically necessary or merely heuristic. Existing positions leave open whether the inability to express logic pictorially is a failure of Neurath's specific design or a fundamental limit of resemblance-based signs. This project bridges that gap by treating Isotype not just as historical artifact but as a test case for visual semantics.

  **Methodology and Timeline:**
  Over a four-month semester, the student will proceed in four phases.
  *Month 1 (Analysis):* The student will codify Neurath's rules from primary texts, isolating the repetition-only constraint.
  *Month 2 (Design):* She will design experimental charts attempting to express logical relations using prohibited methods: size scaling for quantity, arrows for conditionality, and shading for negation. These charts will avoid all words.
  *Month 3 (Evaluation):* The student will subject these charts to informal usability testing with naive viewers. The metric is "self-explanation": can viewers correctly interpret the logical relations without instruction? This distinguishes between a system that is merely pictorial and one that is genuinely self-explanatory.
  *Month 4 (Synthesis):* The student will analyze the results to determine if the permissive system succeeded. The final 5,000-word paper will argue for one of three determinate conclusions.

  **Possible Conclusions:**
  1. *Neurath Vindicated:* The permissive system fails to convey logic without verbal crutches, proving the repetition-only constraint is semantic, not just perceptual.
  2. *Neurath Too Cautious:* The permissive system succeeds, showing pictures can handle logic independently.
  3. *The Threshold Problem:* The system conveys logic but requires learning conventions, ceasing to be "self-explanatory." This validates Neurath's distinction between picture languages and logical notations.
  The deciding consideration will be whether successful interpretation relies on resemblance or learned arbitrary rules.

  **Risk Assessment:**
  The primary risk is scope creep into empirical psychology. Designing rigorous user tests exceeds a semester's capacity. To mitigate, testing will remain informal and qualitative, focusing on the theoretical implications of the failure or success rather than statistical significance. A second risk is defining "self-explanatory" too loosely. The student must establish clear criteria early to ensure the final argument is philosophically robust rather than anecdotal. If the design phase proves too difficult, the scope will narrow to theoretical construction without human testing. Finally, adhering to the 5,000-word limit requires disciplined editing; the student must prioritize the argument over descriptive history.
