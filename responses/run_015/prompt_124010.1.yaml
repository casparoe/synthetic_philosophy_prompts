      *   *Inviolate Level:* A foundational base that does not participate in the feedback loop. It's the "axiom," the "hardware," the "thing-in-itself" that supports the loop but isn't looped. It stops the "why?" or "how?" question from going on forever.
      *   *Infinite Regress:* The problem of needing a reason for a reason, forever.
