      *   *Premise 2:* An "inviolate level" is supposed to be the exception—the one level that doesn't relate back up.
      *   *Premise 3:* If that level is actually part of the system (just paused), it *can* relate back up.
      *   *Conclusion:* If every level *can* relate back up, then every hierarchy is potentially a strange loop. The distinction relies on a metaphysical claim (that the bottom is truly fixed) which we can't verify from inside the system. Therefore, the distinction is pragmatic, not structural.

