answer: |-
  This is a brilliant pivot. Moving from neuroscientists manipulating brains to geese manipulating jet engines cuts through the abstraction. You are asking whether the "Miracle on the Hudson" functions as a naturalistic Frankfurt case, and whether it sustains Frankfurt's conclusion that Alternative Possibilities (PAP) are unnecessary for responsibility.

  Let's do the mapping rigorously, identify where the analogy holds, where it breaks, and what that tells us about the theory.

  ### 1. The Mapping: Who is Black?

  In a standard Frankfurt case, we have **Jones** (the agent), **Black** (the intervener), and the **Decision** (to do X).
  *   **Jones:** Chesley Sullenberger.
  *   **Action X:** Ditching the plane in the Hudson River.
  *   **Black:** The physical constraints imposed by the bird strike (loss of thrust, altitude, airspeed, glide ratio).

  **The Setup:**
  In Frankfurt's original case, Black sits in the background. If Jones shows signs of choosing *not-X*, Black intervenes to force *X*. If Jones chooses *X* on his own, Black does nothing. The result is that Jones chooses *X*, and Black never actually intervenes.

  **In the Hudson Case:**
  The "intervener" (physics/birds) did not sit in the background. It struck *first*. The loss of engines was an **actual intervention**, not a counterfactual safeguard.
  *   **Frankfurt Case:** Black is *idle* in the actual sequence.
  *   **Hudson Case:** Physics is *active* in the actual sequence.

  This is the first major divergence. In the Hudson case, the "Black" mechanism didn't wait to see if Sully would try to fly to Teterboro; it *actually* removed the capacity to fly to Teterboro before Sully made his final decision. The constraint was actual, not counterfactual.

  ### 2. The Decision Point and Alternatives

  Frankfurt's goal is to show an agent is responsible even if they *could not have done otherwise*. Let's look at what "otherwise" means here.

  **Did Sully lack alternative possibilities?**
  *   **Macro-Alternative (Location):** Yes. Once the engines died at that altitude, physics (Black) guaranteed he could not reach LaGuardia or Teterboro. He literally could not have done otherwise regarding *where* the plane went down.
  *   **Micro-Alternative (Execution):** No. He could have panicked. He could have misjudged the glide slope. He could have crashed into the buildings along the riverbank. He could have failed to evacuate.

  **The Frankfurt Verdict:**
  If we define the "Action" as **ditching in the Hudson**, then Sully lacked alternative possibilities. Physics guaranteed it. If Frankfurt is right, Sully should still be responsible (praiseworthy) for this action despite the lack of alternatives.
  *   *Result:* We do praise him. So, superficially, this supports Frankfurt's rejection of PAP.

  **The Problem:**
  We don't praise Sully for *ditching*. Any pilot in that seat, forced by physics, would have ditched. We praise Sully for **ditching successfully**.
  Regarding *successful* ditching, PAP **does** apply. He *could* have botched it. He *could* have let people die. Because he had the alternative possibility of failure, we assign him credit for success.

  **Theory Insight:**
  The Hudson case suggests that Frankfurt cases might work for **basic actions** (moving your arm, ditching the plane) but fail for **complex achievements** (saving lives, committing a murder). We tend to reserve moral responsibility for outcomes where the agent had control over the *quality* of the result, not just the *occurrence* of the event. This implies PAP might be false for "doing" but true for "succeeding."

  ### 3. Actual vs. Counterfactual Interveners

  You hit on the critical weakness: *"The intervener here isn't counterfactual — it's actual."*

  In Frankfurt's model, the existence of Black is supposed to be irrelevant to the explanation of Jones's action. Jones acts on his own reasons; Black is just a safety net.
  In the Hudson case, the "intervener" (the bird strike/physics) is the **primary explanation** for the situation. You cannot explain Sully's action without referencing the geese.

  **Why this breaks the model:**
  Frankfurt wants to isolate the *will* from the *ability*. He wants to say, "The will is sufficient for responsibility, even if ability is removed."
  The Hudson case shows that in the real world, **ability constrains the will.** Sully's "will" to land at Teterboro was irrelevant because his "ability" was removed.
  *   **Frankfurt:** "You are responsible because you willed it, even if you couldn't have done otherwise."
  *   **Hudson:** "You are responsible because you willed it *within the limits of what was possible*."

  This reveals a silence in Frankfurt's theory: it assumes the *nature* of the action remains constant between the actual and counterfactual sequences. In the Hudson case, the nature of the action changed. A forced ditching (if he had passed out) is a crash. A willed ditching (Sully) is a maneuver. The "Black" of physics didn't just ensure the location; it threatened the *agency* itself. Sully retained responsibility not because alternatives were absent, but because he retained **Guidance Control** (a la John Martin Fischer) over the glide path, even if he lacked **Regulatory Control** over the destination.

  ### 4. The Blame/Praise Asymmetry

  You noted Frankfurt built his cases around blame (murder), but here we have praise (heroism). Does the theory hold?

  **The Asymmetry:**
  *   **Blame:** We often mitigate blame if someone "had no choice." (Duress).
  *   **Praise:** We *increase* praise if someone succeeds despite "having no choice." (Heroism under constraint).

  If Frankfurt is right that PAP is irrelevant, this asymmetry shouldn't exist. Responsibility should be symmetrical. But the Hudson case shows it isn't.
  *   If Sully had crashed and killed everyone, we might say, "It was impossible; it was an accident." (Lack of alternatives mitigates blame).
  *   Because he saved everyone, we say, "He was a hero." (Lack of alternatives amplifies praise).

  **What this reveals:**
  Frankfurt's model treats responsibility as a binary switch (On/Off) based on the source of the action. The Hudson case shows responsibility is a **gradient** based on the *difficulty* of the constraint.
  This suggests Frankfurt's rejection of PAP is insufficient for **degrees** of responsibility. PAP might not be necessary for *basic* responsibility, but the *extent* of alternative possibilities (how hard it was to succeed) dictates the *magnitude* of praise. Frankfurt's binary logic can't capture the "Miracle" aspect of the Miracle on the Hudson.

  ### 5. Distributed Responsibility (Where the Theory Goes Silent)

  Frankfurt cases are radically individualistic. Jones vs. Black.
  The Hudson case is systemic.
  *   **Passengers:** Remained calm, followed instructions. If they had panicked, Sully's skill might not have mattered. Are they co-responsible for the survival?
  *   **ATC:** Guided him toward the river, cleared the airspace.
  *   **Engine Manufacturers:** Designed engines that, while they failed, didn't explode catastrophically.

  **The Theory Gap:**
  Frankfurt's framework has no place for **shared agency**. If we apply Frankfurt strictly, we look only at Sully's brain and the physics. We miss the fact that responsibility here was networked.
  If we treat the "Agent" as the Crew Resource Management (Sully + Skiles + Flight Attendants), then the Frankfurt mapping gets messy. Who is Black? The birds? Or was the "Black" the safety protocols that constrained their choices?
  This reveals that Frankfurt cases are poor tools for analyzing **institutional or collective responsibility**. They isolate the agent so thoroughly that they strip away the context that often generates real-world moral worth.

  ### 6. Conclusion: What the Hudson Case Teaches Us

  The Miracle on the Hudson does not confirm Frankfurt's thesis; it complicates it.

  1.  **Actual vs. Counterfactual:** Real-world constraints are actual, not counterfactual. This means "lack of alternatives" is usually a result of **causal determination** (physics), not **modal determination** (a hidden controller). Frankfurt solves the problem of determinism by positing a controller; reality solves it with physics. The moral intuition differs: we forgive physics less easily than we forgive a hidden manipulator, or perhaps we credit the agent more for beating physics than for beating a manipulator.
  2.  **The Definition of Action:** We praise Sully for the *success*, not the *attempt*. Since he could have failed, PAP remains intact for the morally relevant description of the act. This suggests Frankfurt cases often rig the definition of the action to force the conclusion.
  3.  **Control vs. Alternatives:** The case supports **Semi-Compatibilism** (Fischer) more than strict Frankfurtism. Sully is responsible not because alternatives didn't matter, but because he had *control* over the mechanism of action (the glide), even if he lacked control over the outcome options (airports vs. river).

  **Final Verdict:**
  Your friend is partially right that it can feel like intuition-pumping, but your move to a real case exposes the **sterility** of the Frankfurt model. Frankfurt cases are designed to isolate *one* variable (alternative possibilities). The Hudson case shows that in reality, alternative possibilities are entangled with *skill, luck, and systemic support*.

  We praise Sully not because he lacked alternatives (Frankfurt), but because he maximized the *value* of the one alternative he had. Frankfurt's theory explains why he isn't *excused* by necessity; it doesn't explain why he is *exalted* by it. For that, you need a theory of virtue, not just a theory of agency.
