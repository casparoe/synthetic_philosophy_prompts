          5.  Distributed Agency.
          6.  Final Verdict.
      *   *Self-Correction during drafting:* Make sure not to say "Sully had no choice." He had choices on *how* to glide. The constraint was on *where*. Frankfurt cases usually constrain the *what*. Need to be precise.
      *   *Refining the "Black" analogy:* If Black is the bird strike, Black acted *before* the decision. In Frankfurt, Black acts *during/if* the decision wavers. This is a temporal mismatch.
      *   *Key Insight:* The Hudson case is better explained by "Sourcehood" theories (Fischer) than strict Frankfurt cases. The user asked about Frankfurt specifically, so keep the focus there but bring in Fischer if it clarifies the "control" aspect.

  10. **Final Polish:** Ensure all parts of the prompt are answered. (Mapping, PAP, Praise/Blame, Shared Responsibility, Theory limitations).

  *(Self-Correction Note)*: Wait, I need to be careful not to dismiss the user's analogy too quickly. The user asks: "Is there a hidden Black here... that guaranteed the ditching outcome regardless of Sullenberger's will?" I need to answer that directly. Yes, physics guaranteed the *ditching*, but not the *survival*. So the "Action" needs to be defined carefully. If the action is "ditching," PAP is gone. If the action is "saving lives," PAP remains (he could have failed). This distinction is crucial.

