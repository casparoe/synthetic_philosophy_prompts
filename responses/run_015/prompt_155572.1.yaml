answer: |-
  Mara's intuition is sharp. The preservation board is indeed smuggling in metaphysics, but it's a specific, bureaucratic breed of it. Here is the reconstruction of what their rubric presupposes, how the corruption twist interacts with that philosophy, and what a policy built on the rival view would actually look like.

  ### 1. The Implicit Theory: Operational Epistemicism
  By using an automated rubric with two-decimal precision and a "no appeals" clause on the borderline, the board is practicing **Operational Epistemicism**.

  Strict philosophical epistemicism (like Timothy Williamson's) argues that vague terms like "culturally significant" *do* have sharp boundaries in reality, but human beings are cognitively incapable of knowing exactly where they are. The board's policy goes a step further: it claims their formula *does* know.

  *   **The Presupposition:** By calculating scores to the hundredth decimal place, they are asserting that the difference between a score of 73.50 and 73.49 is not just a numerical difference, but a *categorical* one. They are treating a vague predicate ("significant") as if it has a crisp extension.
  *   **The "No Appeals" Clause:** This is the tell. If they admitted the boundary was arbitrary (a pragmatic cut-off), they would have to allow for discretion in borderline cases. By forbidding appeals, they are claiming the score tracks a mind-independent fact. They are asserting that at 73.51, the building *is* significant, and at 73.49, it *is not*, and that this is a truth condition, not a policy choice.
  *   **Why they do it:** This isn't because they are committed Williamsonians. It's because Epistemicism is the only theory that absolves them of responsibility. If the boundary is real and discovered by the algorithm, the board members aren't drawing the line; the *math* is. It insulates them from the moral weight of the Sorites paradox.

  ### 2. The Twist: Do Waivers Damage One View More?
  The fact that they waive the score for well-connected developers but not homeowners is devastating to their implicit philosophy, but it damages **Operational Epistemicism** far more than a Supervaluationist defense.

  **Why it crushes Epistemicism:**
  Epistemicism relies on the boundary being *mind-independent*. The truth about whether a building is "significant" shouldn't change based on who owns the building.
  *   If the score of 73.5 represents a real threshold of historical value, a waiver implies that historical value can be purchased. This admits that the score was never tracking reality in the first place.
  *   It reveals the "sharp boundary" was a lie. You cannot have a sharp metaphysical boundary that moves when a developer makes a phone call. The waiver proves the boundary is *mind-dependent* (specifically, power-dependent), which logically contradicts the core tenet of epistemicism.

  **Why it (perversely) fits Supervaluationism:**
  Supervaluationism argues that vague statements have no truth value until we "precisify" them (draw a line) for a specific context.
  *   A Supervaluationist could argue: "We admitted the line was artificial. We drew it at 73.5 for administrative convenience. But since the line is a tool, not a truth, we can move the tool when political pressure applies."
  *   While this is ethically bankrupt, it is *philosophically consistent*. It confirms the Supervaluationist suspicion that the boundary is not "out there" in the building, but "in here" in the board's decision-making process. The corruption simply reveals that the "precisification" is political rather than administrative.

  **Verdict:** The inconsistency proves they are not Epistemicists. They are **Sophists**. They use the *language* of Epistemicism (precision, no appeals) to shield themselves from accountability, while acting like radical Pragmatists (moving the goalposts) when it benefits them.

  ### 3. The Rival Policy: What Supervaluationism Looks Like in Practice
  If the board were honestly built on a Supervaluationist or "Truth-Value Gap" framework, the day-to-day machinery would have to change fundamentally. They would have to acknowledge that for some buildings, "significant" is neither true nor false.

  Here is how the zoning policy would differ:

  **A. The Scoring System (Ranges, not Decimals)**
  *   **Current:** 73.50 vs 73.49.
  *   **Rival:** Three buckets: *Definitely Significant*, *Definitely Not*, and *Indeterminate*.
  *   **Mechanism:** The algorithm would stop calculating at the point of vagueness. If a building scores between 70 and 76, the system flags it as **Indeterminate**. It does not output a number; it outputs a "Gap."

  **B. The Appeals Process (Mandatory for the Gap)**
  *   **Current:** No appeals on the borderline.
  *   **Rival:** Appeals are *required* for the Indeterminate zone.
  *   **Mechanism:** Because the Supervaluationist admits the line is not "found" but "made," the making of the line requires human justification. A hearing would be held not to re-calculate the score, but to argue *where the line should be drawn this time*. The decision would be recorded as a stipulation ("We are treating this as significant for the purposes of this permit"), not a discovery ("This is significant").

  **C. Transparency of Arbitrariness**
  *   **Current:** "The formula is the formula."
  *   **Rival:** "The cutoff is a policy choice."
  *   **Mechanism:** The board would publish a "Precisification Statement" annually. They would explicitly state: "We know 73.5 is arbitrary. We chose it this year to preserve X% of stock. Next year we might move it to 72.0." This admits the vagueness rather than hiding it behind false precision.

  ### Summary for Mara
  The board is pretending that "cultural significance" is like "height in centimeters" (Epistemicism) to avoid the hassle of arguing about values. But by waiving the rules for developers, they've proven they know it's actually like "being rich" (Supervaluationism/Pragmatism)—a concept where the line moves depending on who is asking.

  If she wants to write the thriller version: The protagonist shouldn't try to prove the building *is* significant. They should try to prove the board *knows* the significance is unknowable, making their rigid enforcement a deliberate fraud rather than just bureaucratic incompetence. The crime isn't getting the math wrong; it's pretending the math exists at all.
