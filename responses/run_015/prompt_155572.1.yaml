          *   *Against Supervaluationism:* Less damaging philosophically, more ethically. If the line is arbitrary/pragmatic anyway, moving it for power just confirms it's a political tool, not a discovery mechanism. It aligns with the idea that the boundary is flexible, but exposes the "administrative necessity" lie.
          *   *Conclusion:* It hurts Epistemicism more because Epistemicism relies on the boundary being *mind-independent*. Corruption proves it's *mind-dependent* (specifically, wallet-dependent).

      *   **The Rival Policy (What would the other view look like?):**
