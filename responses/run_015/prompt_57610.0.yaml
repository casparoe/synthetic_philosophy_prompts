          *   *Cost:* Must treat all three as data points in a distribution, not definitive proofs.

  5.  **Ranking the Tensions:**

      1.  **The "Price" Principle vs. Sortition/Assembly (Severity: Critical).** Principle (8) contradicts (4) and (7). The voters in the Assembly didn't pay. Sortition voters don't pay. If (8) is true, (4) and (7) are unjustified.
      2.  **Ancient vs. Modern Voter Epistemics (Severity: High).** (2) says unpriced voters are biased. (1)/(4) imply Ancient voters were competent. What changed? Human nature hasn't changed. If Ancient voters were unpriced (they were), why weren't they Caplanian?
