      *   (2) *Normativity:* Logic/rules are genuinely normative (it's *wrong* to break them, not just surprising).
      *   (3) *Internalism:* Normativity is internal to the system (like fiction).
      *   (4) *Anti-regress:* Demanding an application manual is irrational (stops the regress).
      *   (5) *The Force Problem:* If no ground, why call it "irrational"? What's the force?
