answer: |-
  You have independently rediscovered two of the foundational pillars of chaos theory. What you are seeing is real, it is not a simulator artifact, and there are precise names for all of it.

  Here is the breakdown of the names, the concepts, and the boundaries between them.

  ### 1. The "Fixed Chunk of Time" Rule
  **Name:** The **Lyapunov Time** (derived from the **Maximal Lyapunov Exponent**).

  **What it is:**
  You observed that increasing precision by one decimal place (a factor of 10) buys you a *constant* amount of extra prediction time, rather than doubling it. This is the mathematical signature of **exponential divergence**.

  In a chaotic system, the error $\delta$ between two starting points grows like this:
  $$ \delta(t) \approx \delta_0 \cdot e^{\lambda t} $$
  Where $\lambda$ is the Lyapunov exponent. If you want to know how long ($T$) it takes for the error to grow to a certain size ($\Delta$), you solve for $T$:
  $$ T = \frac{1}{\lambda} \ln\left(\frac{\Delta}{\delta_0}\right) $$
  Because the natural log ($\ln$) is the inverse of the exponent, every time you divide your starting error $\delta_0$ by 10 (one more decimal place), you add a constant value ($\frac{1}{\lambda} \ln(10)$) to the time $T$.

  **The Name for the Prediction:**
  This limits your **Trajectory Predictability** (or **Deterministic Predictability**). This is the kind of prediction that dies.

  **Confidence:** 99%
  **What would change my mind:**
  If you found that adding a decimal place gave you *twice* as much time, the system would not be chaotic; it would be unstable but linear. If adding precision gave you *infinite* time, the system would be stable (non-chaotic). The "fixed chunk per decimal" is the fingerprint of chaos. If your simulator showed a different relationship, I would suspect a coding error or a non-chaotic regime (e.g., low energy where the pendulum just swings back and forth without rotating).

  ### 2. The "Blob" That Settles
  **Name:** Convergence to an **Invariant Measure** (often on a **Strange Attractor**).

  **What it is:**
  You start with a tight cluster of states (the blob). Chaos stretches and folds this blob like taffy. Locally, points move apart (Observation 1). Globally, the system is bounded (the pendulum can't fly off to infinity). Eventually, the blob gets stretched so thin and folded so many times that it effectively paints the entire allowable space.

  Once it has "mixed" thoroughly, the density of points in that space stops changing. You can no longer predict *where* a specific point is, but you can predict the *probability* of finding a point in any given region. That stable probability shape is the **Invariant Measure**.

  **The Name for the Prediction:**
  This allows for **Statistical Predictability** (or **Probabilistic Predictability**). This is the kind of prediction that survives.

  **Confidence:** 95%
  **What would change my mind:**
  This depends on your simulator's physics.
  *   **If your sim has friction (damping):** The blob should eventually collapse to a single point or a simple loop (a fixed point or limit cycle). If it settles into a complex, fuzzy shape that never shrinks further, it is a **Strange Attractor**.
  *   **If your sim is ideal (no friction):** The blob shouldn't "settle" to a smaller shape; it should spread out to fill the entire "energy shell" available to it and stay that way. This is called **Ergodic Mixing**.
  If your blob keeps growing forever without filling a specific shape, or if it shrinks to a single dot immediately, then what you are seeing isn't the invariant measure of a chaotic system.

  ### 3. The Two Kinds of Prediction
  You asked for a name for the distinction between the prediction that dies and the one that survives.

  The most famous analogy comes from Edward Lorenz (the father of chaos theory):
  *   **Weather** (Trajectory Predictability): Dies quickly. Depends on exact initial conditions.
  *   **Climate** (Statistical Predictability): Survives forever. Depends on the boundaries and rules of the system.

  In physics terms, we distinguish between:
  1.  **Lagrangian Predictability:** Following individual particles/paths. (Fails in chaos).
  2.  **Eulerian Predictability:** Describing the field or density of particles. (Survives in chaos).

  **Proposed Name for Your Project:**
  If you need a label for your science fair board, call this duality **"Micro-Uncertainty vs. Macro-Stability."**

  ### 4. Are These Two Things or One?
  You asked if these are "one thing wearing two costumes." They are distinct properties that usually happen to coexist in chaotic systems, but they are mathematically separate.

  **Why they are different:**
  *   **Observation 1 (Lyapunov)** is a **Local** property. It measures how fast things separate *right now* in a specific spot.
  *   **Observation 2 (Invariant Measure)** is a **Global** property. It measures where things go *eventually* across the whole system.

  **Edge Cases (What counts and what doesn't):**
  *   **Example of 1 without 2:** Imagine a particle moving in a straight line that accelerates exponentially. Two particles separate exponentially (Lyapunov), but the "blob" never settles into a shape; it just flies off to infinity. (Chaos without an attractor).
  *   **Example of 2 without 1:** Imagine a simple clock pendulum. If you start a blob of runs, they might settle into a circle (the path of the pendulum). The statistical shape is stable. But if you nudge the start, the runs *don't* drift apart exponentially; they stay synchronized. (Stability without chaos).
  *   **Your Double Pendulum:** It has **both**. It separates exponentially (1) *and* stays within a bounded statistical shape (2). This combination is the definition of a **Chaotic Attractor**.

  ### Summary for Your Science Fair
  *   **The Rule:** "Logarithmic Horizon of Predictability." (Precision buys linear time).
  *   **The Limit:** "Lyapunov Time."
  *   **The Survival:** "Statistical Equilibrium" or "Invariant Measure."
  *   **The Distinction:** "Trajectory vs. Statistical Predictability" (or Weather vs. Climate).

  ### Confidence & Falsification Statement
  **Confidence:** I am **highly confident** (95%+) that your observations are genuine features of chaotic dynamics and not simulator errors. The "fixed chunk of time per decimal" is a mathematical necessity for exponential growth, and the "settling blob" is a standard feature of ergodic systems.

  **What would convince me I am wrong:**
  1.  **If the time scaling changes:** If you increase precision by 100x and get *more* than 2 chunks of extra time, your system might not be purely chaotic (it could be "hyper-chaotic" or have numerical instability). If you get *less*, your simulator might have artificial noise floor limiting you.
  2.  **If the blob shape depends on the start:** If you start one blob in the top corner and another in the bottom, and they settle into *different* final shapes, you have not found the global Invariant Measure; you have found separate "basins of attraction." A true chaotic attractor should look the same regardless of where you start the blob (as long as energy is conserved or dissipated similarly).
  3.  **If the blob shrinks to a point:** If you wait long enough and the blob becomes a single dot, your system is just damped (friction), not chaotically mixing. A chaotic attractor retains a fuzzy, complex shape forever.

  **Final Advice:**
  For the fair, plot the **Log of Error** vs. **Time**. If your theory is right, that graph should be a straight line. The slope of that line is your Lyapunov Exponent. That is a hard, quantitative number you can put on a poster that proves you aren't just guessing.
