  so for a science fair thing ive been messing around with a double pendulum simulator on my laptop, and I keep noticing something I dont have a word for. If I run two copies that start almost exactly the same — like I nudge the starting angle by a tiny amount — at first they overlap, then they drift apart, and after a while they have nothing to do with each other. Fine, everyone knows that part. But two other things keep happening that I cant name.

  One: the more carefully I measure the starting angle, the longer the two copies stay together, but each extra decimal place of accuracy seems to buy me a fixed little chunk of extra time, not twice as much. So getting way more precise helps way less than I expected, and I cant tell if that's a real thing about these systems or just my simulator being bad.

  Two: if I start a few hundred runs with slightly different angles and watch the blob of them all at once, the blob spreads out for a while and then sort of stops spreading and settles into the same shape every time. So I can still say true stuff like "it'll be moving fast and somewhere in the bottom half" forever, even at the point where I have no clue where any single run actually is.

  Is there a name for this? Specifically, is there a name for the two kinds of prediction — the kind that dies and the kind that survives — or for the rule that extra precision buys you a fixed slice of time rather than proportional time? If something close already exists, tell me how what I'm describing is different from it, and if nothing really fits, give it a name and draw the edges: what counts as an example of it and what doesn't. A bare label won't help me, I need to know what the thing is and isn't.

  Also tell me how confident you actually are about each part of that, and what would change your mind — like what would convince you I'm looking at two genuinely different things and not one thing wearing two costumes, or that my "fixed chunk of extra time" is just an artifact.
