      *   **User's Test:** A continuum from self-copying molecule to modern cell shows definitions cut at different places (smeared), suggesting the question might be ill-posed.
      *   **Specific Challenges:**
          1.  *Sample-of-One:* Is the single ancestry of Earth life a permanent limit?
