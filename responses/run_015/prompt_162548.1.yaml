      *   Academic but accessible.
      *   Respectful of the year-long effort.
      *   Direct and critical (as requested).
      *   Avoid listing definitions (NASA, Schrödinger, etc.).

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the "Sample-of-One" worry adequately? *Adjustment:* Make sure to distinguish between knowing *necessary conditions* vs. *contingent features*.
      *   *Check:* Did I address the "Lone Hermit" split? *Adjustment:* Explicitly name the tension between *Autopoiesis* (self-making) and *Darwinian Evolution* (population dynamics).
      *   *Check:* Is the diagnosis clear? *Adjustment:* Use the phrase "Polysemous Conflation."
      *   *Check:* Did I avoid listing definitions? *Yes.* Focus on the *structure* of the disagreement.

  8.  **Final Polish:** Ensure the distinction between "Life" (the abstract category) and "Living" (the predicate applied to entities) is clear, as this often underpins the confusion. (Wait, maybe keep it simpler: Focus on Process vs. Substance). Let's go with *Process vs. Substance vs. Detection*.

