answer: |-
  Dear friend,

  I have been thinking deeply about your composition-drift hypothesis, and I want to start by acknowledging that it is a formidable piece of reasoning. It captures a specific kind of despair that many of us feel when watching the industry evolve, precisely because it removes the need to assume malice or stupidity on the part of our colleagues. It offers a clean, structural explanation for why good people produce bad outcomes, and it fits neatly into the evolutionary analogies that often underpin our thinking about competitive markets. However, you asked for the case against it, and you asked for honesty about whether it is capable of being wrong. I believe there are arguments that should move you, ranging from fundamental logical vulnerabilities to empirical observations that strain the mechanism you propose. I will lay these out in order of severity, starting with the most fatal challenges and moving down to those that are merely awkward for your position, while distinguishing between what a committed defender must concede and what they can rightly dismiss as a misreading.

  The most fatal challenge to your view is the one you hinted at regarding falsifiability, and I think your worry here is well-founded. If every bad outcome confirms the drift and every good outcome is explained away as a temporary escape or a lag in the selection mechanism, then the theory is not actually making predictions about the world but rather describing a post-hoc narrative. A committed defender of your view must concede that for this to be a causal mechanism rather than a metaphor, there must be a observable state of affairs that would prove it false. For example, if we were to see a sustained period where safety-conscious actors consistently outcompeted reckless ones over a long horizon without any external enforcement changing the payoff structure, your theory would be in trouble. If you explain that away by saying the reckless actors just haven't won yet or are hiding their defects, you are insulating the theory from evidence. The fatal flaw here is not that the theory is wrong, but that it risks becoming unfalsifiable. If the mechanism is differential survival, then we should see differential survival. If we see safety-conscious firms growing faster than reckless ones for a decade, and you say the drift is still happening underneath, you are moving the goalposts. A theory that cannot be wrong cannot be right in any meaningful sense, and this is the hill you need to defend before anything else.

  Moving from the meta-critique to empirical mechanics, the second fatal objection concerns the fixed membership scenario you raised. Your mechanism relies on differential survival and expansion. Actors who defect grow; actors who cooperate shrink or exit. But if we observe a race to the bottom in a closed system where membership is fixed, turnover is zero, and no actor can grow relative to others by defecting, then your mechanism is absent yet the effect persists. Consider a regulatory body or a closed consortium where the participants are static. If safety standards degrade within that group over time, it cannot be because the defectors replaced the cooperators, because no one was replaced. It must be because the internal incentives of the existing members shifted. If you observe this happening frequently enough, it suggests that the driver is not composition drift but rather incentive drift within stable agents. A defender of your view might try to argue that even within fixed members, the internal leadership changes via selection, but if the organization itself is the unit of analysis and the organization remains static while degrading, the selection mechanism at the organizational level is not doing the work you claim. This is a genuine defeater because it isolates the variable you claim is causal and shows the effect happening without it.

  Slightly less fatal but still highly damaging is the observation of normative stabilization without enforcement. You mentioned taboos and professional norms, and this is where the historical record poses a serious problem for pure selection models. There are cases where actors had both the incentive and the capability to defect but did not, and the defectors did not subsequently dominate the system. The taboo against the use of chemical weapons in World War II is a classic example. Many major powers had stockpiles and faced existential threats where use might have offered a tactical advantage. Yet, the norm held. Under your model, we should expect that any state that refrained from use while another state secretly prepared to defect would be punished by selection pressure, or that eventually a defector would emerge and win, resetting the baseline. Instead, the norm held across multiple adversaries without a single hegemon enforcing it. A committed defender might argue that the payoff structure was actually changed by the fear of retaliation, but if the fear of retaliation was sufficient to stop the slide, then the slide was never inevitable due to selection pressure alone. It suggests that shared beliefs and norms can alter the payoff structure endogenously, without needing to wait for the population to turn over. If norms can hold against incentives long enough for generations of leadership to pass without the defectors winning, then composition drift is not the dominant force you claim it is.

  Descending to arguments that are merely awkward rather than fatal, there is the issue of agency and preference endogeneity. Your model treats preferences as static and the environment as the selector. However, in the real world, especially in AI labs, the leaders are not passive subjects of selection; they actively shape the selection environment. They lobby for regulations, they form coalitions to restrict competition, and they change the payoff structure before the selection process can weed them out. If CEOs can coordinate to slow down a race, even imperfectly, it suggests that the coordination problem is solvable by the actors themselves without waiting for population turnover. Your view predicts that coordination attempts should generally fail unless they change the survival rates of the participants. If we see coordination succeed merely through agreement and reputational stakes, without anyone going out of business, then the coordination story is a better predictor than the selection story. A defender of your view can rightly dismiss minor coordination failures as noise, but if major coordination successes occur without changes in population composition, it forces you to admit that preferences and communication matter more than you want them to.

  This leads directly to what your view predicts that its rivals do not, which is the test of whether your theory is earning its keep. The plain coordination problem story predicts that if we can find a focal point or improve communication, the race to the bottom should stop or slow, even with the same actors. The preferences story predicts that if we change the moral composition of the leaders, the outcomes should change. Your composition-drift story predicts neither of these should work in the long run. You predict that communication will fail because the defectors will eventually outgrow the cooperators, and you predict that changing leaders will fail because the new leaders will be selected for the same defection traits. Therefore, the specific observable pattern you should be looking for is a correlation between competitive intensity and leadership turnover. If safety degradation happens without leadership turnover, your theory is weakened. If safety degradation happens alongside the replacement of cautious founders with aggressive CEOs, your theory is strengthened. If you cannot point to specific instances where the cautious actors were actually removed or outgrown by the reckless ones, then you are assuming the mechanism rather than observing it. The rival theories predict stabilization is possible through talk or moral persuasion; your theory predicts stabilization is impossible without changing the rules of survival.

  Finally, I want to return to your worry about whether the position is capable of being wrong. It is fatal for a view of this kind if it explains every outcome equally well. If a safety norm holds, you say it is a temporary escape. If it breaks, you say the drift completed. To avoid this, you need to specify the timescale and the conditions under which the escape becomes permanent. If you define the drift as an asymptotic limit that is never fully reached but always approached, you make it hard to falsify, but you also make it hard to use for decision making. If the drift is real, there should be measurable metrics of homogenization in the industry. We should see less diversity in risk tolerance over time. We should see the variance in safety practices narrowing toward the lowest common denominator. If we see variance increasing or persisting despite competitive pressure, that is evidence against the drift. You must be willing to say that if we see a diverse ecosystem of safety practices persisting for twenty years in a competitive market, your theory is wrong. If you are not willing to say that, then you are holding a belief, not a hypothesis.

  In sum, your composition-drift model is a powerful lens for understanding systemic pressure, and it correctly identifies that individual virtue is often insufficient against structural incentives. However, it becomes dangerous when it treats selection as the only mechanism at play. The fixed membership cases and the historical stability of certain norms suggest that agency and shared beliefs can override selection pressures, at least for significant periods. The most productive way to hold this view is not as a deterministic law but as a strong prior that requires empirical validation in each specific case. You should look for the turnover, you should look for the homogenization, and you should be willing to update if the cautious actors survive and thrive. If you do that, you keep the insight without falling into the trap of a theory that explains everything and therefore nothing. I hope this helps clarify the debate in your group chat, and I look forward to hearing how you integrate these counterpoints into your model.

  Best regards,

  Your friend
