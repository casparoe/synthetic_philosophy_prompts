answer: |-
  Here is a defended agenda for your eighteen-month pre-drafting phase, ranked by conceptual dependency, narrative leverage, and tractability for a generalist.

  ### The Ranking

  **1. The Boundary Problem (Structural Analogy vs. Surface Resemblance)**
  **2. Causal Translation (Preservation vs. Corruption)**
  **3. Counterfactual Generation (Modal Machinery vs. Analogical Transfer)**
  **4. Analogical Fatigue (The Collapse Point)**

  ---

  ### The Defense

  #### 1. Priority One: The Boundary Problem
  **Question:** *Whether any stable boundary survives between structural analogy and surface resemblance once we leave textbook examples.*

  **Why First:** This is the bedrock. Hofstadter and Sander's central thesis in *Surfaces and Essences* is that the distinction between "deep structure" and "surface feature" is itself a fluid analogy. If you begin drafting with a rigid distinction (e.g., "Surface is shallow, Structure is truth"), you violate the metaphysical premise of your novel. You must determine how your characters *experience* this boundary. Do they mistake surface for structure (prejudice)? Do they see structure in mere surface (poetry/madness)?

  **Narrative Payoff:** This defines your characters' epistemic reliability. If the boundary is illusory, your protagonist's "epiphanies" are merely high-fidelity categorizations, not discoveries of objective truth. This shifts the novel from a quest for *truth* to a quest for *resonance*.

  **Tractability:** High. You do not need a lab. You need a corpus. Analyze your own drafts, journal entries, and favorite novels. Tag every metaphor. Ask: Was this triggered by a shape, a sound, a function, or an emotional tone? You are studying the phenomenology of the boundary, not the neural mechanism.

  **Risk of Instability:** Maximum. If you get this wrong, the entire cognitive architecture of the book collapses into standard realism.

  #### 2. Priority Two: Causal Translation
  **Question:** *How analogical mapping preserves or corrupts causal structure when it moves across domains.*

  **Why Second:** Once you know *how* the mind maps (Priority 1), you must determine *what happens* when it maps. In a logic-based narrative, A causes B. In an analogy-based narrative, A is like C, and C caused D, therefore A causes D (or something like D). This is the engine of your plot. You need to decide if this transfer is treated as valid within the novel's world or as a source of tragic error.

  **Narrative Payoff:** This dictates the climax. Does the protagonist succeed because their analogy held causal water, or fail because the mapping corrupted the causality? This is where your metaphysics meets the pavement.

  **Tractability:** Medium. This requires close reading of history and biography. Look for historical decisions made by analogy (e.g., Munich 1938 mapped to Vietnam). Trace where the causal chain broke. This is empirical enough for a generalist without requiring formal modeling.

  **Trade-off:** Accept that "corruption" is the wrong word. For your novel, treat it as *transduction*. Energy changes form; some is lost, some is gained. Rigor demands you acknowledge the loss; fiction demands you dramatize the gain.

  #### 3. Priority Three: Counterfactual Generation
  **Question:** *Whether counterfactual reasoning in narrative comprehension depends on analogical transfer rather than on explicit modal machinery.*

  **Why Third:** This is the "What If" of the plot. Standard narrative theory treats counterfactuals as logical branches (If X had happened, Y would follow). Your premise suggests counterfactuals are analogical retrievals (This situation is like that past situation; in that situation, Z happened; so maybe Z here). This is downstream of the first two because you need to know how mapping works and how causality translates before you can simulate alternative futures.

  **Narrative Payoff:** This governs regret, planning, and tension. If counterfactuals are analogical, then a character's ability to imagine the future is limited by their library of past experiences. A character with a narrow library cannot imagine a novel solution. This creates a built-in constraint for character arcs.

  **Tractability:** Low/Medium. This is abstract. Do not read modal logic. Instead, study "regret narratives." How do people describe "the road not taken"? Do they describe it as a logical divergence or as a different *story* they could have been in?

  #### 4. Priority Four: Analogical Fatigue
  **Question:** *The precise point in sustained cross-domain mapping where parallels cease to illuminate and collapse into mechanical repetition.*

  **Why Last:** This is the limit condition. You cannot define the point of collapse until you have defined the mechanism (1), the consequence (2), and the extension (3). However, while this is last in *dependency*, it is primary in *theme*. This is the entropy of your system.

  **Narrative Payoff:** This is your ending. The "fatigue" is the moment the protagonist realizes the metaphor has run dry. The marriage is no longer "like a war"; it is just a marriage. The magic is gone. This is the moment of disillusionment or maturity.

  **Tractability:** High. This is introspective. Monitor your own writing process. When does a motif become a cliché? That is analogical fatigue.

  ---

  ### Governing Criteria

  **1. Upstream Conceptual Dependency (The Primary Filter)**
  You cannot model the failure of a system (Fatigue) before you model its operation (Boundary/Causality). If you prioritize Fatigue, you risk writing a thematic conclusion without a metaphysical engine to drive toward it. The Boundary question is the only true axiom; the rest are theorems.

  **2. Narrative Payoff (The Secondary Filter)**
  If two questions are equally upstream, prioritize the one that alters character agency. The Boundary question alters perception; the Causal question alters action. Perception precedes action. Hence, Boundary ranks above Causality.

  **3. Tractability for the Generalist (The Constraint)**
  I have deprioritized Counterfactuals not because they are less important, but because they are the most likely to trap you in formal philosophy. By framing them as "narrative comprehension" rather than "modal logic," you keep the research in the realm of text and experience, which is your native territory.

  ### Where to Accept Trade-offs

  **Phenomenological Truth over Mechanistic Truth**
  You are writing a novel, not a paper. You do not need to prove *that* the brain works this way; you need to prove that *living feels* this way.
  *   *Trade-off:* In researching Causal Translation, do not worry about the neural fidelity of the mapping. Worry about the *consequential fidelity*. Does the character's decision make sense emotionally, even if the logic is flawed?
  *   *Trade-off:* In the Boundary Problem, do not seek a definitive line. Seek the *tension*. The ambiguity is where the literature lives. If you resolve the boundary too cleanly, you kill the ambiguity required for complex characterization.

  **The "As If" Stance**
  Treat the Hofstadter/Sander model as true *within the diegesis*, even if it is contested in cognitive science. Your novel is a proof of concept, not a peer review. If a philosophical rigor kills a scene, cut the rigor. The metaphysics must serve the drama, not vice versa.

  ### The Reordering Condition

  **The Finding That Changes Everything:**
  If, during your first year of research, you discover evidence that **Analogical Fatigue is not a limit, but a generative mechanism.**

  Currently, the agenda treats Fatigue as the breakdown of the system (entropy). However, if you find that "mechanical repetition" is actually how habits form, or how culture stabilizes, or how love deepens (the metaphor dies so the reality can be born), then **Fatigue moves to Priority 1.**

  Why? Because if Fatigue is generative, it is no longer the end of the thought process; it is the *crystallization* of thought. This would shift your novel from a narrative about the *failure of perception* to a narrative about the *solidification of identity*. It changes the metaphysical backbone from fluid dynamics to geology.

  If you encounter data suggesting that the "collapse" of analogy is actually the moment "self" is constructed, abandon the current order. Start with Fatigue. Build the boundary around the collapse. That is a different book, and potentially a deeper one.
