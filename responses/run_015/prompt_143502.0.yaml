      *   Address criteria/trade-offs/reordering? Yes.
      *   Tone: Intellectual, rigorous, creative.

  9.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't just list them. I need to argue for the *ordering*.
      *   *Correction:* Ensure "Analogical Fatigue" gets its due. It's the user's own term, likely central to their theme. I should validate it but place it logically.
      *   *Correction:* Be specific about the "non-specialist" constraint. Don't suggest running fMRI studies. Suggest close reading and introspection.

  10. **Final Polish:** Check the flow. Ensure the distinction between "Structural Analogy" and "Surface Resemblance" is treated as the bedrock. (Hofstadter argues they are slippery, but for a novelist, the *tension* between them creates irony).

      *(Self-Correction on Ranking)*: Actually, looking at "Narrative Payoff," Q4 (Fatigue) might be the most *novel-specific* contribution. However, the prompt asks for *conceptual dependency*. You can't have fatigue without a working analogy. So Q4 remains last in the research phase, even if it's the climax of the book. I will stick with Dependency as the primary sorting key, weighted by Payoff.

      *Revised Ranking:*
      1. Boundary (Q2) - The Engine.
      2. Causal Corruption (Q1) - The Plot.
      3. Counterfactuals (Q3) - The Choice.
      4. Fatigue (Q4) - The Limit.

      *Wait, let's look at "Tractability".* Q4 is the most tractable for a writer. Q1 is the hardest. Does that change the order? The prompt asks to weigh tractability. If I can't solve Q1, do I stall? Maybe I should prioritize Q4 to get *momentum*, then use that to tackle Q1? No, the prompt asks for "conceptual energy... before drafting." I need the architecture first. I will prioritize Dependency but note the tractability risk.

      *Actually, let's look closer at Q2.* Hofstadter/Sander argue the boundary *doesn't* survive. If I spend 18 months trying to find a boundary that doesn't exist, I waste time. The research question should be "How does the *illusion* of a boundary function?" This nuances the agenda. I will incorporate this into the defense.

      *Let's look at Q1.* "Preserves or corrupts." If analogy *is* thought, then "corruption" is the wrong word. It's *translation*. This semantic shift is crucial for the novelist. I will highlight this.

