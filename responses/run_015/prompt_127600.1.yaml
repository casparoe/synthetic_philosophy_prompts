  Structure the workshop as a cumulative filter where interns process the same Paris Commune data through Ranke's sources, Carr's selection, and White's narrative forms to prove objectivity is a practice, not a possession. This sequence prevents nihilism by showing that while facts are constrained by language, they are not invented by it, which is critical for data journalists who must defend their methodology without claiming god-like neutrality.

  **90-Minute Sequence and Dependency Order**
  You must enforce a strict logical dependency where each stage builds on the previous one without collapsing into contradiction.
  *   **0–20 mins (Sources Exist):** Introduce Ranke. Hand out raw Paris Commune police logs and casualty lists. Task: Extract facts. *Dependency:* Establish that archives exist and contain verifiable data before questioning them.
  *   **20–45 mins (Sources Need Interpretation):** Introduce Carr. Ask interns to select the "top five" most important data points from the raw logs for a headline. Compare lists. *Dependency:* Show that selection happens before writing, proving facts don't speak for themselves.
  *   **45–70 mins (Interpretation Shaped by Narrative):** Introduce White. Give them two pre-written articles about the Commune using the *same* data but different structures (one as a tragedy of order, one as a romance of liberation). Task: Identify how the ending shapes the meaning of the opening data. *Dependency:* Show that selection is guided by pre-existing story forms, not just random bias.
  *   **70–90 mins (Synthesis):** Group discussion on ethical data reporting given these constraints.

  **Carrying Example Evaluation: Paris Commune**
  The Paris Commune is not wrong; it is ideal for data journalists because it offers hard numbers (casualties, arrests) wrapped in violently opposed stories.
  *   **What it must have:** Contrasting primary artifacts. You need Versailles government statistical reports (order/crime data) side-by-side with Communard survivor diaries (liberation/suffering data).
  *   **What it must lack:** A definitive consensus account. If you provide a modern textbook summary, interns will treat it as the "truth" rather than another narrative layer. Stick to raw artifacts and contemporary opposing accounts.

  **Misconception Mapping and Interventions**
  Head off these specific errors at the exact moment they arise in the sequence.
  *   **Ranke = Zero Bias (Intervene at Minute 15):** When interns treat the police logs as pure truth, point out the logs were written by the victors to justify executions. Clarify that Ranke advocated rigorous source criticism, not blind acceptance.
  *   **Carr = Postmodern Relativism (Intervene at Minute 35):** When interns argue selection means "anything goes," stop them. Remind them Carr argued for historical judgment based on evidence, not that all selections are equally valid.
  *   **White = History is Fiction (Intervene at Minute 60):** When interns claim the narrative structure makes the events fake, correct them. Emphasize White's point that real events are *encoded* into story forms, not that the events didn't occur.

  **Scope Limits: What Is Too Deep**
  Do not teach White's specific four tropes (Metaphor, Metonymy, Synecdoche, Irony) or his four emplotment modes (Romance, Comedy, Tragedy, Satire). This is half-baked tropology that will confuse interns. Stick to the general concept of "emplotment"—the idea that we force beginnings, middles, and ends onto continuous data streams. If you introduce the specific grid, they will focus on memorizing terms rather than understanding the constraint.

  **End Check: The Dependency Proof**
  Do not quiz them on definitions. Give them a single raw data point (e.g., "500 arrests on May 24, 1871"). Ask them to write two headlines: one that implies the state restored order, and one that implies the state crushed dissent. Require them to annotate which selection choices and which narrative tropes allowed them to spin the same number two ways. If they can manipulate the data without lying about it, they grasp the source-to-narrative dependency.
