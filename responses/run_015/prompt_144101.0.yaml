  **Verdicts on the New Case**

  M. will answer **No** to knowledge or justified belief for all three claims: (i) the film is gripping, (ii) you would find it gripping, and (iii) its editing falls apart. She will see no epistemic reason to treat the three differently, though she might acknowledge a practical reason to trust R. regarding the ticket (as in Case 6).

  *   **(i) "The film is gripping":** This is a paradigmatic aesthetic value claim. Case 1 (poem/exquisite) and Case 5 (installation/devastating) establish that testimony, even from trusted sources, cannot transmit knowledge of aesthetic value. The 180/180 match establishes R. as a reliable predictor, but Case 5 explicitly rules that "however much they trust," others cannot know the aesthetic quality of an inaccessible object. Reliability does not bridge the acquaintance gap.
  *   **(ii) "If you saw it, you would find it gripping":** This is a counterfactual about S's own psychological response. While it looks like a factual prediction, it entails the aesthetic quality of the film (the film must *be* gripping to *make* you find it gripping). Since S cannot know the film is gripping (per verdict i), she cannot know she would experience it as such. To allow this would be to allow aesthetic knowledge via a backdoor.
  *   **(iii) "Its editing falls apart":** While "editing" sounds technical, "falls apart" is an evaluative judgment of artistic success, not a neutral description like "terza rima" (Case 2). It belongs to the aesthetic domain (like "exquisite" or "profound"), not the descriptive or moral domain. Therefore, it requires acquaintance.

  M. has no reason to treat them differently epistemically. All three rely on aesthetic evaluation of an inaccessible object. She will likely maintain the distinction from Case 6: S has excellent *practical* reason to believe R. (for instance, to mourn the loss of the film), but no *epistemic* right to claim knowledge.

  ***

  **The Single Rule**

  The rule that best explains all seven earlier verdicts is **The Acquaintance Principle**: *Justified belief and knowledge of aesthetic properties require first-hand experience (acquaintance) with the object, or memory of such experience; testimony is sufficient only for non-aesthetic facts (descriptive or moral) and for practical reasoning, but never for aesthetic belief.*

  *   **Fit:** It explains Case 1 & 5 (No acquaintance = No knowledge), Case 2 (Non-aesthetic facts = Knowledge), Case 3 (Moral facts = Knowledge), Case 4 (Memory of acquaintance = Knowledge), Case 6 (Practical reason allowed without knowledge), and Case 7 (Actual acquaintance trumps testimony).
  *   **Application to New Case:** All three predicted verdicts fall out of this single epistemic rule. M. does not need to run two conflicting principles here; she runs one epistemic principle (Acquaintance) and one practical principle (Utility). The new case tests the epistemic principle. The 180/180 match tempts us to use the practical principle for epistemic ends, but M.'s record (specifically Case 5) suggests she keeps them strictly separate.

  ***

  **Two Alternative Rules**

  **1. The Reliability Threshold Rule**
  *   **Statement:** Testimony confers knowledge if the source's reliability exceeds a specific threshold of empirical confirmation.
  *   **Fit:** It explains Case 1 (50% match is below threshold = No), Case 2 & 3 (High reliability on facts/morals = Yes), Case 5 (Single witness lacks empirical track record for others = No), and Case 6 (No reliability established = No).
  *   **Divergence:** In the New Case, R. has a 180/180 match (100% reliability). This rule predicts **Yes** for knowledge on (i) and (ii).
  *   **Elimination:** If M. predicts **No** (as I argue she will), this rule is eliminated. It fails to capture M.'s intuition in Case 5 that trust itself, regardless of degree, cannot transmit aesthetic knowledge.

  **2. The Verifiability Principle**
  *   **Statement:** Testimony confers knowledge only if the subject can, in principle, verify the claim through their own experience at some point.
  *   **Fit:** It explains Case 1 (S can read the poem = Wait, this predicts Yes for Case 1. M. says No. So this rule needs a tweak: *Verification must be possible AND the property must not be aesthetic.*) Let's refine: *Knowledge requires the possibility of direct verification.* Case 1: S can read. M. says No. So Verifiability alone doesn't fit Case 1.
  *   *Correction:* A better alternative that fits the 7 and predicts No on the New Case is **The Object Permanence Rule**: *One cannot know aesthetic properties of objects that no longer exist or are inaccessible.*
  *   **Fit:** Case 5 (Destroyed = No). Case 1 (Accessible = No? No, this rule doesn't explain Case 1).
  *   *Let's try a stronger competitor:* **The "Transmission of Grounds" Rule.** *Testimony confers knowledge only if the testifier can transmit the grounds for the judgment.*
  *   **Fit:** Case 1 (Critic gives verdict, no grounds = No). Case 2 (Facts need no grounds = Yes). Case 5 (Experience grounds cannot be transmitted = No). Case 4 (S originally had grounds = Yes).
  *   **Divergence:** In the New Case, R. provides (iii) "Editing falls apart" as a potential ground for (i) "Gripping." If (iii) is accepted as a transmissible technical fact, this rule might allow knowledge of (i) via inference.
  *   **Elimination:** If M. says No to (i) even given (iii), this rule is eliminated. She holds that aesthetic grounds (like editing quality) are themselves subject to the Acquaintance Principle and cannot be transmitted.

  ***

  **The Further Case**

  To separate the **Acquaintance Principle** (my prediction) from the **Verifiability Principle** (which also predicts No on the New Case because the film is gone), I would put this case to M.:

  **The "Ephemeral Experience" Case:**
  S watches the four-hour film in a private screening. Immediately after the final frame, the only copy is destroyed in front of her, and she is sworn to secrecy (she cannot tell anyone or verify it with others). She forms the belief "It was gripping."

  *   **Acquaintance Principle Predicts:** **Knowledge.** S had first-hand experience. The subsequent destruction of the object does not negate the knowledge acquired during acquaintance (consistent with Case 4, where memory suffices).
  *   **Verifiability Principle Predicts:** **No Knowledge.** S can never verify the claim again, nor can anyone else. The impossibility of future check undermines the justification.

  If M. says S *knows* it was gripping, the Acquaintance Principle survives, and the Verifiability Principle is eliminated. Given Case 4 (where S remembers "profound" without access to reasons/content), M. is committed to the view that the *origin* of the belief (experience) matters, not the *future accessibility* of the object.

  ***

  **Alternative Explanation: Nature of the Properties**

  M.'s record is better explained not by a rule about testimony per se, but by a metaphysical claim about **Response-Dependence**.

  On this reading, M. believes aesthetic properties (exquisite, gripping, profound) are not "out there" in the object in the same way factual properties (terza rima, 1922) or even moral properties (unjust) are. Aesthetic properties are constituted by the subject's response. Therefore, a report about an aesthetic property is actually a report about the *testifier's response*, not the object itself. To know the object is exquisite, you must have the response yourself. Testimony can tell you "I had the response," but it cannot tell you "The object is exquisite" in a way that grants you knowledge, because for you, "exquisite" just means "elicits this response in me."

  This explains why Case 3 (Moral) allows testimony (moral facts are not constituted by S's response) while Case 1 (Aesthetic) does not. It also explains the New Case: R. is reporting her response. S cannot know the film *is* gripping because S has not had the response that constitutes the property. This reading subsumes the Acquaintance Principle; acquaintance is required not because testimony is weak, but because the property *is* the experience.
