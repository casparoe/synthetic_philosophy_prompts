  2.  **Deconstruct the Sleeping Beauty Problem:**
      *   *Core Tension:* $P(Heads) = 1/2$ (prior) vs. $P(Heads | Awakening) = 1/3$ (conditional on self-locating info).
      *   *Halfer View:* No new relevant evidence upon waking. Credence should remain 1/2.
      *   *Thirder View:* You are more likely to be in a Heads-world if there are more awakenings in that world. Credence should be 1/3.
