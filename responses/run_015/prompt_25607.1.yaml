      *   *Idea 3: The "Betting Market" with Random Selection.* This is the winner. Instead of simulating the *waking*, simulate the *betting opportunity*.
      *   *Refinement:* To make the self-locating uncertainty real, the students need to be unsure *which* betting opportunity they are taking.
