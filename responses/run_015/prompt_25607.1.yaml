answer: |-
  # Activity Plan: "The Sealed Awakening Wager"

  **Course:** Probability and Epistemology (Upper-Level Undergraduate)
  **Topic:** The Sleeping Beauty Problem & Self-Locating Belief
  **Time:** 90 Minutes
  **Class Size:** 15 Students
  **Goal:** To force students to operationalize their credences through betting under conditions of self-locating uncertainty, exposing the tension between *credence* (what you believe) and *betting odds* (how you act), and surfacing the Halfer/Thirder divide through financial consequence rather than verbal argument.

  ---

  ## I. Pedagogical Rationale & Design Defense

  **Why this design?**
  Most classroom discussions of Sleeping Beauty fail because students treat it as a abstract probability puzzle ($P(H|E) = ?$) rather than a decision-theoretic problem. Halfers and Thirders talk past each other because they are implicitly answering different questions: Halfers answer "What is the chance the coin landed Heads?" while Thirders answer "What are the odds I should accept on a bet given I am awake?"

  This activity, **The Sealed Awakening Wager**, collapses that distinction by imposing a **scoring rule** that penalizes students based on the *number of betting opportunities* generated by the coin flip.
  1.  **It simulates self-location without amnesia:** By using sealed envelopes to determine who is "awake," we create a reference class of observers. Students who open an "Awake" envelope know they are in the experiment but do not know if they are the *only* observer (Heads) or one of *two* (Tails).
  2.  **It forces a Dutch Book confrontation:** The payoff structure aggregates losses per *experiment*, not per *bet*. If a student bets as a Halfer (1:1 odds) but pays out on every awakening, they will systematically lose money in the Tails world. This makes the Thirder betting strategy pragmatically dominant, forcing Halfers to defend why their credence shouldn't guide their bets.
  3.  **It creates "Vertigo":** Students holding an "Awake" envelope experience genuine uncertainty about the global state of the world (how many others are awake) based solely on their local indexical evidence ("I am awake").

  **Limitations (To be addressed in Debrief):**
  *   **The Memory Wipe:** We cannot wipe student memory. If we run multiple rounds, they might track counts. *Mitigation:* We run only two rounds, and the "Asleep" students remain in the room but are silenced, preserving the "population" feel without requiring actual amnesia.
  *   **The Reference Class:** This activity models the *Thirder* interpretation of the reference class (sampling from awakenings). Halfers may object that Beauty isn't a random sample. *Pedagogical Opportunity:* This is not a bug; it is the core of the Lewis/Elga dispute. The debrief will use this friction to illuminate the metaphysical disagreement.

  ---

  ## II. Materials & Setup

  *   **Currency:** Play money (e.g., "Epistemic Credits"). Give each student $100 start.
  *   **Envelopes:** 15 identical opaque envelopes.
      *   Inside 1 envelope: A card reading **"AWAKE – MONDAY"** (Red).
      *   Inside 2 envelopes: Cards reading **"AWAKE – MONDAY"** (Blue) and **"AWAKE – TUESDAY"** (Blue). *Wait, simplify.*
      *   **Correction for Flow:** To maximize engagement, divide the class into **5 Teams of 3**. Each team represents one "Beauty."
      *   **Envelopes per Team:** 3 envelopes per team.
          *   **Heads Scenario:** 1 envelope says "AWAKE", 2 say "ASLEEP".
          *   **Tails Scenario:** 2 envelopes say "AWAKE", 1 says "ASLEEP".
  *   **Coin:** A large, visible coin (for the reveal only).
  *   **Projector:** To display the "Bank's" payout rules.
  *   **Bet Slips:** Small cards where students write their wager.

  ---

  ## III. Procedure (90 Minutes)

  ### Phase 1: The Sunday Contract (15 Minutes)
  *Goal: Establish the **Ex Ante** perspective.*

  1.  **Introduction (5 mins):** Briefly state the Sleeping Beauty problem. Do not define Halfer/Thirder yet. Tell them they will *live* the experiment.
  2.  **Team Setup (5 mins):** Arrange students into 5 teams of 3. Explain that each team is a single "Beauty."
  3.  **The Sunday Bet (5 mins):**
      *   **Instructor Script:** "It is Sunday. The coin has not been flipped. You know the rules: If Heads, one of you will wake Monday. If Tails, two of you will wake (Mon & Tue). You must sign a contract *now* that will execute upon awakening. You are betting on **Heads**."
      *   **The Offer:** "You can buy a ticket for \$X. If the coin is Heads, the ticket pays \$100. If Tails, it pays \$0."
      *   **Action:** Each team agrees on a price \$X they are willing to pay *per ticket*.
      *   **Crucial Rule:** "If Tails, you must buy **two** tickets (one for each awakening). If Heads, you buy **one**. Your total profit/loss is calculated at the end of the experiment."
      *   **Collect:** Record each team's \$X. (Most will hover around \$50/Halfer or \$33/Thirder).

  ### Phase 2: The Wednesday Awakening (40 Minutes)
  *Goal: Induce **Self-Locating Uncertainty** and test **Ex Post** credence.*

  1.  **The Flip (5 mins):**
      *   Flip the coin. **Do not reveal the result.**
      *   Based on the result, prepare the envelopes for each team.
          *   *If Heads:* For each team, put 1 "AWAKE" card and 2 "ASLEEP" cards in their set of envelopes.
          *   *If Tails:* For each team, put 2 "AWAKE" cards and 1 "ASLEEP" card in their set.
      *   Shuffle and distribute one envelope to each student.
  2.  **The Isolation (5 mins):**
      *   **Instructor Script:** "Open your envelopes silently. If you have 'ASLEEP', put your head down, close your eyes, and do not speak. You are out of the market. If you have 'AWAKE', you are now Beauty. You are in a white room. You do not know the day. You do not know if your teammates are awake or asleep."
      *   *Note:* This simulates the memory wipe. The "Asleep" students are physically present but epistemically removed. The "Awake" students cannot see who else is awake.
  3.  **The Wednesday Wager (15 mins):**
      *   **Instructor Script:** "You are awake. You have forgotten the Sunday contract. You have a fresh \$100. The Bank offers you a bet: **Win \$100 if Heads, \$0 if Tails.** How much are you willing to pay *right now* for this ticket?"
      *   **Action:** "Awake" students write their price privately on a bet slip and hand it to the instructor. "Asleep" students do nothing.
      *   **Stakes:** Inform them that real (small) prizes (e.g., candy, extra credit points) will be awarded to the teams with the highest net profit at the end.
  4.  **The Repeat (15 mins):**
      *   Reset the money. Flip the coin *again* (independent trial).
      *   Repeat the Envelope Distribution and Wednesday Wager.
      *   *Why:* One round is luck; two rounds start to show trends. It also prevents students from solving the puzzle by counting envelopes in the first round.

  ### Phase 3: The Reveal & Scoring (10 Minutes)
  *Goal: Create the **Financial Consequence**.*

  1.  **Reveal:** Announce the coin results for both rounds.
  2.  **Calculate:**
      *   For each team, calculate the total cost of tickets purchased across all awakenings.
      *   Calculate the payout (only if Heads).
      *   **Example:**
          *   Team A (Halfer): Bet \$50 per ticket.
          *   Round 1 (Tails): 2 students awake. Bought 2 tickets. Cost \$100. Payout \$0. Net: -\$100.
          *   Round 2 (Heads): 1 student awake. Bought 1 ticket. Cost \$50. Payout \$100. Net: +\$50.
          *   **Total:** -\$50.
          *   Team B (Thirder): Bet \$33 per ticket.
          *   Round 1 (Tails): 2 students awake. Cost \$66. Payout \$0. Net: -\$66.
          *   Round 2 (Heads): 1 student awake. Cost \$33. Payout \$100. Net: +\$67.
          *   **Total:** +\$1.
  3.  **Display:** Project the leaderboard. Typically, the "Thirder-pricing" teams will lose less or break even, while "Halfer-pricing" teams will show significant losses in Tails-heavy rounds.

  ---

  ## IV. Debrief Plan (25 Minutes)

  *This is where the philosophy happens. Do not just explain the math; interrogate their experience.*

  **1. The Vertigo Check (5 mins)**
  *   **Ask:** "Raise your hand if you were 'Awake' in Round 1. When you were holding that card, did you feel like the probability was 1/2 or 1/3? Did seeing your teammates with their heads down change anything?"
  *   **Point:** Highlight that the *feeling* of uncertainty was indexical ("Am I the only one?"). This is the self-locating belief.

  **2. The Betting vs. Credence Gap (10 mins)**
  *   **Ask the Halfer Bettors:** "You lost money on the Tails rounds. You knew the rules (Tails = 2 bets). Why did you bet \$50? If you knew you'd be taxed twice on Tails, why not lower your bet?"
  *   **Expected Halfer Defense:** "My *credence* is 1/2. The betting odds are different because of the payout structure. I believe Heads is 50%, but I shouldn't bet 50%."
  *   **Instructor Move:** **This is the Lewis Position.** Lewis argues credence is one thing, decision-theory another.
  *   **Ask the Thirder Bettors:** "You bet around \$33. Does that mean you actually *believed* Heads was less likely? Or were you just hedging?"
  *   **Expected Thirder Defense:** "If I'm awake, I'm more likely to be in a Tails world because there are more of me there. My credence *is* 1/3."
  *   **Instructor Move:** **This is the Elga Position.** Self-locating evidence *updates* credence.

  **3. The Reference Class Objection (5 mins)**
  *   **Address the Limitation:** "Some of you might feel cheated. You might say, 'Of course it's 1/3, you made us draw envelopes from a bag! Beauty doesn't draw from a bag; she just wakes up.'"
  *   **Philosophical Mapping:** This is the core metaphysical dispute.
      *   **Thirders** treat awakenings as sampling events (The "Self-Sampling Assumption").
      *   **Halfers** treat the coin flip as the only random event; awakenings are just deterministic consequences.
  *   **Question:** "If we remove the envelopes and just tell you 'You are Beauty,' does the math change? Or did the envelopes just make the logic visible?"

  **4. Conclusion (5 mins)**
  *   Summarize: The activity demonstrated that if you define rationality as **avoiding Dutch Books** (systematic loss), you must act like a Thirder. If you define rationality as **tracking objective chance** (the coin bias), you might feel like a Halfer.
  *   Final thought: "The Sleeping Beauty problem isn't about coins. It's about whether *you*—the observer—are part of the probability space."

  ---

  ## V. Anticipated Problems & Mitigation

  | Problem | Why it happens | Mitigation |
  | :--- | :--- | :--- |
  | **"Asleep" students get bored.** | They have nothing to do while "Awake" students bet. | Instruct "Asleep" students to record the "Awake" students' betting behavior on a sheet. They become "Auditors." This keeps them engaged and provides data for the debrief. |
  | **Halfer students feel rigged.** | The envelope method mathematically forces P(H)=1/3. | Acknowledge this openly in the debrief. Frame it as: "This activity simulates the *Thirder's model*. The Halfer's job in the debrief is to explain why this model fails to capture Beauty's actual situation." |
  | **Students collude.** | "Awake" students might signal each other. | Enforce strict silence. Collect bet slips immediately. Remind them that collusion violates the "isolated awakening" condition. |
  | **Confusion over Payoffs.** | Students might think they get paid per ticket, not per experiment. | Write the payoff rule on the board in bold: **"PROFIT CALCULATED PER COIN FLIP, NOT PER TICKET."** Repeat this verbally before betting starts. |

  ---

  ## VI. Instructor Script Snippets (Key Moments)

  **During the "Awakening" (Phase 2):**
  > "Look at the card in your hand. It says 'AWAKE.' That is the only evidence you have. You do not know if the coin is Heads or Tails. You do not know if there is another student in this room holding a matching card. You are alone with your uncertainty. What is your price?"

  **During the Debrief (Addressing the Memory Wipe Limitation):**
  > "We couldn't wipe your memory. If we ran this ten times, you'd count the awakenings. But notice: even without memory wipes, the *structure* of the bet forced you to account for the number of awakenings. This suggests the problem isn't psychological (forgetting); it's structural (how many times do I pay?). Does that make the Halfer position harder to defend, or does it just show that betting isn't credence?"

  **Closing:**
  > "Next week, we'll formalize this. We'll look at Elga's 'Restricted Principle of Indifference' and Lewis's 'Principal Principle.' But remember this feeling: the moment you opened that envelope, and you didn't know if you were the only one. That vertigo is the subject matter of this course."
