prompt: |-
  I teach intro ethics — big lecture, ~280 students, twice a year, and the discussion sections are run by TAs who are mostly grad students from other departments and who get one 90-minute training session from me, total. Every time we do the Republic book 2 material — Glaucon, the ring, why be just when being just costs you and nobody is watching — I make them write a 500-word paper answering him. That's ~280 papers a semester that somebody has to get through in about ten minutes each, with a comment that's actually worth reading, and students can appeal to me if they think the TA got it wrong.

  What I want from you is a procedure my TAs can run on a paper, in this order, that decides one question: does this paper actually answer Glaucon, or does it quietly answer a near neighbour instead? Not "is the argument good" — I read for that when it matters. Just: whatever this thing is arguing, is it an answer to the challenge, or an answer to a question Glaucon already took off the table? (I tell them in lecture that he's stripped away reputation, consequences, and the wages of justice, and that he's set it up so the just person gets the reputation of injustice and the unjust person gets the reputation of justice — so "justice pays eventually" is precisely what he asked you not to say.) For each step tell me what counts as a pass, where the procedure stops with a hard no, and where it hands the paper to me because the question there is one of judgement rather than fact. And be honest about which steps are really just a TA's gut in a flowchart costume — I'd rather know then pretend.

  Constraint: the checks have to be worded so someone with no philosophy can run them. If a step requires recognising a reductio or an internal reason, it's useless to me.

  One wrinkle. For the last two years I've been running my own variant along side the original: in my version the ring doesn't only make you invisible, it also means that what you do while wearing it leaves no trace on you — no memory of it, no habit formed, no change in what you later want, no guilt, no self-knowledge, nothing to be proud or ashamed of afterwards. I use it because it kills three families of answer at once: the you'll-get-found-out family, the you-become-a-bad-person family, and the you'd-betray-your-own-deepest-projects-and-lose-your-integrity family. I want to see whether anyone can produce a reason that doesn't run through one of those channels. So the procedure has to work on papers answering my version too. And seperately: tell me whether my variant is a fair sharpening of Glaucon or whether I've rigged the question so that nothing could possibly answer it. I genuinely can't tell anymore.

  Then run the procedure on three papers I get versions of every semester. (1) In a world where everyone had a ring we'd all be worse off, so we agree to be just, and I keep my agreement even with the ring on. (2) The self is constituted by its choices, so there's no me left over who'd get to enjoy the loot — the person who comes out of the ring just is someone else. (3) A paper that is genuinely beautiful and is my favourite every single time — you'd have to live with yourself afterwards, you'd know what you'd done, and that knowledge would eat you alive, so you're still worse off. I suspect the procedure is going to tell me (3) is a dodge, and I'd like to see whether it can say that without also saying something stupid.

  Hard cases the procedure has to handle: a paper that rejects the framing of the challenge outright in a way that is itself a real philosophical move; and a paper that answers a version of the question Glaucon wasn't asking but does it brilliantly. Finally, tell me what the procedure can't do — I don't want to hand a TA something that makes her think the hard part is finished.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **Context:** Intro Ethics, large lecture (~280 students), TAs are non-philosophers with minimal training (90 mins).
      *   **Task:** Create a step-by-step procedure (flowchart/checklist style) for TAs to grade 500-word papers on Plato's *Republic* Book 2 (Glaucon's Challenge).
      *   **Core Question:** Does the paper answer Glaucon's specific challenge, or does it answer a "near neighbour" (a question Glaucon already ruled out)?
      *   **Constraint 1:** Must be runnable by someone with *no philosophy background* (no jargon like "reductio," "internal reason," "constitutive norms").
      *   **Constraint 2:** Must distinguish between Pass, Hard No, and "Hand to Professor" (judgment call).
      *   **Constraint 3:** Must be honest about where "TA gut feeling" is disguised as procedure.
      *   **Specific Variant:** The professor uses a "Super Ring" variant (invisibility + no psychological trace/memory/habit/guilt). The procedure must work for both the original and the variant.
      *   **Evaluation of Variant:** Is the "Super Ring" a fair sharpening or a rig?
      *   **Test Cases:** Run the procedure on three specific paper types:
          1.  Social Contract (everyone worse off, so we agree).
          2.  Constitutive Self (choices make the self, "I" don't survive).
          3.  Psychological Cost (you'd know what you did, guilt would eat you).
      *   **Hard Cases:** Handle papers that reject the framing vs. papers that answer a different question brilliantly.
      *   **Limitations:** Explicitly state what the procedure *cannot* do.

  2.  **Deconstruct Glaucon's Challenge (and the Variant):**

      *   *Glaucon's Setup:*
          1.  Justice is a compromise (best to do injustice, worst to suffer it).
          2.  Ring of Gyges: Invisibility -> No consequences (reputation, punishment).
          3.  Extreme Case: Just man thought unjust (suffering), Unjust man thought just (rewards).
          4.  *The Question:* Why be just *for its own sake*, stripped of all external rewards and internal psychological habits/consequences (in the variant)?
      *   *The "Near Neighbours" (Forbidden Answers):*
          1.  You'll get caught (Consequences).
          2.  It hurts your reputation (Consequences).
          3.  It makes you a vicious person/habit (Psychological consequence - *killed by Variant*).
          4.  You'll feel guilty (Psychological consequence - *killed by Variant*).
          5.  It's against the law/Agreement (Why keep the agreement if you can break it secretly?).

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* Simple language. Binary checks where possible.
      *   *Step 1: The "Got Caught" Check.* Does the paper mention getting found out, punishment, or reputation?
          *   If yes -> Hard No (unless they explain why Glaucon's setup doesn't apply, which is rare in 500 words).
      *   *Step 2: The "Feel Bad" Check.* Does the paper mention guilt, shame, pride, or becoming a "bad person"?
          *   If yes -> Check which version. Original: Maybe okay (judgment). Variant: Hard No (explicitly ruled out).
      *   *Step 3: The "Agreement" Check.* Does the paper rely on a promise, contract, or "what if everyone did that?"
          *   If yes -> Hard No (Glaucon asks why *you* keep it when *you* can break it secretly).
      *   *Step 4: The "Why" Check.* Does the paper give a reason that exists *at the moment of action*?
          *   This is the tricky one. Needs to be non-technical.
      *   *Refining for Non-Philosophers:* Instead of "instrumental vs. intrinsic," use "Does the reason work if nobody knows and nothing changes inside you?"

      *   *Let's structure it as a "Three-Strike Filter".*

      *   *Strike 1: The Consequence Test.* (Future bad stuff).
      *   *Strike 2: The Feeling Test.* (Internal bad stuff).
      *   *Strike 3: The "Everyone" Test.* (Social contract).

      *   *Wait, I need to account for the "Hand to Prof" category.* Some arguments are subtle.
      *   *I need to address the "Super Ring" variant specifically in the instructions.*

  4.  **Developing the Procedure Steps:**

      *   *Pre-step:* Identify which prompt the student answered (Original or Super Ring).
      *   *Step 1 (External Consequences):* Look for words like "caught," "punishment," "reputation," "law," "hell," "karma."
          *   Pass: None found.
          *   No: Found. (Unless they argue Glaucon is wrong about invisibility, which is rare).
      *   *Step 2 (Internal Consequences):* Look for "guilt," "shame," "habit," "character," "soul damage," "peace of mind."
          *   Pass: None found (or explicitly addressed in Super Ring context).
          *   No: Found (Automatic No for Super Ring. Judgment for Original).
      *   *Step 3 (The "Why" Logic):* Does the reason depend on *other people* or *future you*?
          *   Glaucon asks about *now* and *you*.
          *   If the argument is "Society collapses," that's about *others*.
          *   If the argument is "You become a tyrant," that's about *future you*.
          *   Pass: The reason is about the act itself being right *now*.
          *   Hand to Prof: If they argue the "Self" doesn't exist or the "Act" defines the "Agent" in a metaphysical way.

  5.  **Addressing the "Super Ring" Variant:**

      *   *Is it fair?* Glaucon wants to isolate justice from its *consequences*. Psychological habits (Aristotle) are consequences. Guilt is a consequence. So removing them sharpens the question to: Is there a reason to be just *strictly* for the sake of justice, independent of *any* effect on the agent?
      *   *Is it rigged?* It might be *too* sharp. If justice is inherently tied to the agent's flourishing (eudaimonia), removing the effect on the agent might make the concept incoherent. However, for an intro class, it's a powerful heuristic to stop "you'll feel bad" answers. It's a fair sharpening *if* the goal is to test divine command or pure deontology. It rigs it against Virtue Ethics and Psychological Egoism. I should be honest about this.

  6.  **Running the Test Cases:**

      *   *Paper 1 (Social Contract):* "We'd all be worse off, so we agree."
          *   Step 1 (External): Pass.
          *   Step 2 (Internal): Pass.
          *   Step 3 (Logic): Fails. It answers "Why have laws?" not "Why follow them when invisible?"
          *   Verdict: Hard No (Near Neighbour).
      *   *Paper 2 (Constitutive Self):* "No me left over."
          *   Step 1: Pass.
          *   Step 2: Pass.
          *   Step 3: Logic. This is metaphysical. It challenges the "You" in "Why should *you* be just?"
          *   Verdict: Hand to Prof. (This is a real philosophical move, rejecting the subject).
      *   *Paper 3 (Guilt/Knowledge):* "You'd know what you'd done."
          *   Step 1: Pass.
          *   Step 2 (Internal): Fails. "Know what you'd done... eat you alive" = Guilt/Psychological cost.
          *   *Crucial Check:* In Super Ring version, this is explicitly ruled out ("no memory... no guilt").
          *   Verdict: Hard No for Super Ring. Judgment for Original (is knowledge a consequence or part of the act?).

  7.  **Refining the "Gut Feeling" Aspect:**

      *   I need to admit that Step 3 is where the TA fakes it. Recognizing a "category mistake" vs. a "bad answer" is hard without training. I will label this clearly.

  8.  **Finalizing the Output Structure:**

      *   **Part 1: The Procedure.** (Clear, bolded steps, Pass/No/Prof).
      *   **Part 2: The "Super Ring" Evaluation.** (Fair vs. Rigged).
      *   **Part 3: Running the Test Cases.** (Applying the procedure).
      *   **Part 4: Limitations.** (What this tool misses).

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Constitutive Self" too hard for a TA?
      *   *Fix:* Make the instruction for that specific outcome "Hand to Prof immediately." Don't ask the TA to judge the metaphysics.
      *   *Critique:* Is the language simple enough?
      *   *Fix:* Avoid "deontology," "consequentialism," "eudaimonia." Use "future bad stuff," "inside feelings," "rules for everyone."
      *   *Critique:* Did I address the "Hard Cases" (rejecting framing vs. brilliant neighbour)?
      *   *Fix:* Add a specific "Exception Clause" in the procedure for papers that attack the prompt itself.

  10. **Final Polish:** Ensure tone is respectful of the TAs' limitations but firm on the logic. (Proceed to generate response).

  *(Self-Correction on the "Super Ring" Fairness)*: I need to be careful. Glaucon argues justice is *instrumental*. The Super Ring removes the *instrumental* value regarding the self's psychology. If the only reason to be just is that it constitutes the self (Aristotle/MacIntyre), the Super Ring makes that argument impossible. So yes, it rigs it against Virtue Ethics. I must state this clearly.

