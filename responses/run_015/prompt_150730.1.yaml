answer: |-
  1. The two interpretations

  The incommensurability interpretation posits that pleasure and pain are ontologically distinct categories, akin to weight and temperature, lacking a common metric for direct summation. On this view, the lexical threshold is not a mathematical point on a continuum but a priority rule embedded in the decision procedure: once suffering exceeds a specific intensity, it triggers a moral veto that pleasure cannot override, regardless of quantity. This avoids the mathematical awkwardness of infinity on a single scale but requires a robust explanation for why these distinct dimensions interact at all in moral deliberation. The moral agent does not calculate a net sum; rather, they check the pain dimension first, and if the threshold is breached, the pleasure dimension is rendered morally silent, though it remains experientially present.

  Conversely, the scalar discontinuity interpretation treats valence as a unified continuum but introduces an infinite discontinuity at the threshold point. Here, pleasure and pain share a common currency of "moral weight," but the function mapping phenomenological intensity to moral value asymptotes at the threshold of severe suffering. This preserves a single scale of evaluation, making trade-offs conceptually possible below the threshold, but imposes a lexical break where value drops to negative infinity. The advantage is mathematical unity, allowing for standard utilitarian calculus in benign cases, but it risks implying that pleasure and pain are fundamentally the same kind of thing, differing only in degree and sign, which some argue undermines the qualitative distinctness of suffering.

  2. Mixed states and what survives

  Under the incommensurability view, a mixed state of intense grief and intense joy involves two coexisting properties that are evaluated separately. The joy is not erased ontologically; the subject still experiences it, and it may retain instrumental value for future outcomes. However, morally, the joy is inert regarding the specific obligation to relieve the grief. The lexical rule dictates that the presence of threshold-level suffering dictates the moral status of the state entirely, so the joy does not "weigh" against the pain in the final evaluation. The view preserves the reality of the pleasure but denies its capacity to compensate for or negate the priority of the suffering.

  In the scalar discontinuity model, the mixed state is evaluated as a single sum where the infinite negative weight of the grief mathematically dominates any finite positive weight of the joy. The joy is not weightless in itself—it contributes positively to the sum—but the sum is rendered negative infinity by the suffering component. Consequently, the net state is categorically bad, and the joy offers no moral mitigation. This interpretation handles the mixed state by subsuming both experiences into one valuation function, ensuring that the lexical priority is a result of the magnitude of the values involved rather than a procedural rule about distinct categories.

  3. The triage/offset objection

  Regarding triage, both interpretations generally permit causing minor suffering to prevent catastrophic suffering, provided the minor suffering remains below the lexical threshold. The lexical constraint applies to the outcome being prevented (the catastrophe) and the means used (the minor harm). If the minor harm stays within the "non-lexical" zone, standard aggregation applies, allowing the trade-off. However, the critical tension arises in how suffering aggregates within its own category: if mild sufferings can sum indefinitely to equal a lexical-level suffering, the view risks permitting the "benign explosion" where vast quantities of mild pain justify extreme measures, mimicking regular negative utilitarianism's demand to minimize total sum regardless of distribution.

  The collapse into regular negative utilitarianism occurs if the lexical threshold is permeable to aggregation or if pleasure is allowed to offset suffering below the threshold without restriction. If mild suffering aggregates linearly to cross the threshold, the lexical distinction is preserved structurally, but if the view allows pleasure to cancel out mild suffering completely, it becomes a threshold utilitarianism rather than a negative one. To avoid collapse, the lexical view must maintain that while mild suffering aggregates, it never fully equates to the moral urgency of intense suffering, or that pleasure can never offset suffering, only other pleasure. If suffering within the lower category offsets freely against pleasure, the negative priority is lost, and the view collapses into a weighted hedonic calculus.

  4. Bottom line: collapse or not?

  The view collapses into regular negative utilitarianism only if the lexical threshold is treated as a mere weighting factor rather than a structural barrier to trade-offs. As long as intense suffering retains infinite priority over any amount of pleasure or mild suffering, and mild suffering cannot aggregate to trigger the same lexical urgency as intense suffering, the distinction holds. The conceptual knot is untied by recognizing that lexicality is a rule about moral priority, not just a difference in magnitude; if the theory allows the "currency" of mild pain to purchase relief from severe pain via aggregation, it fails, but if it maintains a hard discontinuity, it remains a distinct normative framework.
