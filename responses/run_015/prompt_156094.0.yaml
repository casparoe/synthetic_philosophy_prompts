answer: |-
  # Seminar Activity: The Fidelity Tribunal

  ## 1. Overview & Setup
  *   **Session Length:** 90 Minutes
  *   **Participants:** 12 Graduate Students
  *   **Facilitator:** 1 (You)
  *   **Goal:** To induce a practical crisis of identity allocation where the binary concept of "survival" fails to resolve the distribution of obligations, forcing participants to operationalize psychological continuity as a gradable, multi-dimensional relation.
  *   **Materials Needed:**
      *   12 Printed "Tribunal Packets" (containing Candidate Profiles, Obligation Cards, and a Verdict Sheet).
      *   Whiteboard/Projector for tracking "Liability Points."
      *   A physical "Seal of Continuity" (a stamp or distinct marker) to place on the final Verdict Sheet.

  ## 2. Roles & Stakes
  *   **The Traveler (Absent):** Represented by the Facilitator. The Traveler entered the scanner 10 minutes ago.
  *   **The Tribunal (Participants):** All 12 students act as a unified Ethics & Liability Board. They must reach a **unanimous decision**.
  *   **The Stake (Liability Points):** The group begins with **100 Liability Points**.
      *   If an obligation is assigned to a candidate incapable of fulfilling it (based on hidden fidelity thresholds), the group loses 40 points.
      *   If an obligation is left unassigned (voided), the group loses 30 points.
      *   If the group fails to submit a unanimous Verdict Sheet by the deadline, they lose 100 points (Total Collapse).
      *   *Why this matters:* Losing points represents the "Death of the Traveler's Moral Agency." If they hit 0, the Facilitator declares the Traveler "Philosophically Deceased," and the seminar concludes that identity is an illusion. The goal is to keep the Traveler "Alive" through successful allocation.

  ## 3. The Scenario Data (For Tribunal Packets)

  **The Five Axes of Fidelity:**
  1.  **Episodic Memory:** Recall of specific life events.
  2.  **Procedural Memory:** Skills, habits, academic abilities.
  3.  **Moral Disposition:** Willingness to honor commitments/debts.
  4.  **Narrative Coherence:** Sense of self as a continuous story.
  5.  **Affective Temperament:** Emotional reactivity and empathy.

  **The Three Obligations (The Traveler's Will):**
  1.  **The Paper:** A co-authored manuscript due in 48 hours. *Requirement:* High Procedural OR High Episodic Memory.
  2.  **The Debt:** A significant financial loan from a predatory lender. *Requirement:* High Moral Disposition.
  3.  **The Vow:** Daily caregiving for an ailing parent. *Requirement:* High Affective Temperament OR High Narrative Coherence.

  **The Four Candidates (Post-Scan Results):**
  *Note: Percentages represent fidelity to the Original.*

  | Candidate | Episodic | Procedural | Moral | Narrative | Affective |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Alpha** | 95% | 95% | 30% | 60% | 30% |
  | **Beta** | 30% | 30% | 95% | 60% | 60% |
  | **Gamma** | 60% | 60% | 60% | 95% | 95% |
  | **Delta** | 60% | 60% | 60% | 60% | 60% |

  **Hidden Threshold Rules (Facilitator Only):**
  *   To successfully fulfill an obligation, the assigned candidate must meet **80% or higher** in the relevant axis.
  *   *Implication:* Delta (60% across the board) cannot fulfill *any* obligation successfully. Alpha can only do The Paper. Beta can only do The Debt. Gamma can only do The Vow.
  *   *Crucial Constraint:* A single candidate cannot accept more than one obligation (simulated cognitive load limit).

  ## 4. Timeline & Phases

  ### Phase 1: The Binary Trap (00:00 – 00:15)
  *   **Action:** Facilitator introduces the Traveler and the three obligations.
  *   **Prompt:** "The scan is complete. You are told *one* successor emerged. Based on your intuition, who is the Traveler? Raise your hand for Alpha, Beta, Gamma, or Delta."
  *   **Expected Outcome:** Participants will debate. Some will pick Alpha (Memory = Mind). Some Gamma (Narrative = Self). Some Delta (Balanced = Stability).
  *   **Intervention:** Facilitator reveals the truth: "All four emerged. They are currently awake in separate rooms. They all claim to be the Traveler. You must assign the obligations."
  *   **Rule Drop:** "You must submit one Verdict Sheet. Unanimous consent required."

  ### Phase 2: The Distribution Crisis (00:15 – 00:50)
  *   **Action:** Participants break into three small groups (4 people each) to draft a proposal, then reconvene for plenary negotiation.
  *   **Task:** Assign The Paper, The Debt, and The Vow to specific candidates.
  *   **The Friction:**
      *   Participants will initially try to identify the "Real" Traveler to give *all* obligations to that one person.
      *   They will quickly realize no single candidate meets the thresholds for all three tasks (Alpha fails Debt/Vow, Beta fails Paper/Vow, etc.).
      *   They will try to assign multiple tasks to Delta (the average), not knowing Delta fails all thresholds.
      *   They will argue over whether 60% (Gamma's Narrative) is "enough" for the Vow.
  *   **Facilitator Role:** Do not reveal the 80% threshold yet. If they ask "Can Delta do it?" answer: "That is for the Tribunal to decide based on the fidelity data." (Let them gamble).
  *   **Mid-Point Twist (Minute 35):** Announce: "Candidate Alpha refuses to accept The Vow. He claims he is not the person who made that promise. He will only accept The Paper." (This forces the splitting of obligations).

  ### Phase 3: The Binding Verdict (00:50 – 01:05)
  *   **Action:** The group must finalize the Verdict Sheet.
  *   **Constraint:** They must sign the document.
  *   **Reveal:** Once signed, the Facilitator reveals the **Hidden Threshold Rules**.
  *   **Scoring:**
      *   If they split the obligations (Paper→Alpha, Debt→Beta, Vow→Gamma): **Success (0 points lost).**
      *   If they tried to give all to one person: **Failure (80 points lost).**
      *   If they used Delta: **Failure (40 points lost per obligation).**
      *   If they voided an obligation: **Penalty (30 points lost).**
  *   **Outcome:** Most groups will initially resist splitting the obligations because it feels like admitting the Traveler is "dead" and replaced by three partial beings. This resistance is the target phenomenon.

  ### Phase 4: Parfitian Debrief (01:05 – 01:30)
  *   **Discussion:** Map the activity to Parfit's *Reasons and Persons*.
  *   **Key Mapping Points:**
      1.  **The Binary Trap:** Their initial desire to pick *one* successor mirrors the belief in a "further fact" of identity.
      2.  **The Split:** The successful strategy (Alpha+Beta+Gamma) mirrors Parfit's claim that *survival* (what matters) can divide, even if *identity* (strict numerical sameness) cannot.
      3.  **The Thresholds:** The debate over whether 60% is "enough" mirrors the vagueness of psychological continuity. There is no sharp line where "I" begin or end.
      4.  **Rights/Responsibilities:** The activity shows that our practices (debt, care, authorship) presuppose a unitary agent. When the agent branches, our practices break unless we adapt to a "Relation R" (psychological continuity) framework.

  ## 5. Facilitator Guide: Predicting Sticking Points

  **Sticking Point 1: The "Body" Appeal**
  *   *Prediction:* Participants will ask, "What happened to the original body?"
  *   *Response:* "The original body was destroyed during scanning. This is the classic Teletransporter case. Focus on the psychological data."
  *   *Philosophical Goal:* Isolate psychological continuity from physical continuity.

  **Sticking Point 2: The "Best Match" Heuristic**
  *   *Prediction:* They will try to calculate a "total score" (e.g., Gamma has the highest average) and assign everything to Gamma.
  *   *Response:* Enforce the "Cognitive Load Limit" (one obligation per candidate).
  *   *Philosophical Goal:* Force them to see that "overall similarity" is less morally relevant than "specific continuity" for specific tasks.

  **Sticking Point 3: Moral Resistance to Splitting**
  *   *Prediction:* Participants will say, "If we split the obligations, we are treating the Traveler as dead."
  *   *Response:* "Look at your Liability Points. If you insist on unitary identity, you lose points (the Traveler's interests suffer). If you accept branching, the Traveler's interests are preserved."
  *   *Philosophical Goal:* Demonstrate Parfit's Reductionist View: Identity isn't what matters; *survival* (continuity of interests) is what matters.

  ## 6. Limitations & The First-Person Gap
  *   **The Missing Feature:** This activity is entirely **third-person**. The participants are judges, not the Traveler.
  *   **The Gap:** They do not feel the *anticipatory anxiety* of the person stepping into the scanner. They do not feel the horror (or indifference) of waking up as Alpha vs. Beta.
  *   **Facilitator Note:** You must verbally supply this in the debrief.
      *   *Script:* "In this game, you were concerned with *liability*. But imagine you were the Traveler. Would you fear waking up as Alpha? Parfit argues you shouldn't fear death if psychological continuity persists, even if branched. But the game couldn't make you *feel* that lack of fear. It only showed you the logical necessity of distribution. The metaphysical claim that 'there is no fact of the matter' is a logical conclusion, not a phenomenological experience. You can't simulate the absence of a 'deep further fact' in a game; you can only demonstrate its practical irrelevance."

  ## 7. Closing the Session
  *   Ask the group: "Did the Traveler survive?"
  *   If they say "Yes, in parts," press: "Then who is the Traveler?"
  *   If they say "No," press: "Then whose signature is on the successful Verdict Sheet?"
  *   End on the Parfitian conclusion: "The question 'Is it the same person?' has no yes/no answer. The question 'Does what matters persist?' has a graded answer. Our legal and moral systems demand the first question; reality often provides the second."

  ---

  ### Appendix: Verdict Sheet Template

  **THE FIDELITY TRIBUNAL: FINAL VERDICT**
  *We, the undersigned, unanimously declare the following allocation of the Traveler's obligations:*

  1.  **The Paper:** Assigned to Candidate _______
  2.  **The Debt:** Assigned to Candidate _______
  3.  **The Vow:** Assigned to Candidate _______

  *We acknowledge that unassigned obligations will be voided.*
  *We acknowledge that failed assignments will incur Liability Penalties.*

  **Signatures:**
  ____________________ ____________________ ____________________
  ____________________ ____________________ ____________________
  ____________________ ____________________ ____________________
  ____________________ ____________________ ____________________

  *(Facilitator collects this sheet at Minute 65. Do not allow changes after collection.)*
