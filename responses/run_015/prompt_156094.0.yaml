      3.  (High Affect/Narrative, Low Mem/Moral) -> Can do Care, fails Paper/Debt.
      4.  (Medium All - 60%) -> Fails all thresholds (if threshold is 80%).
      *This forces them to use Candidates 1, 2, and 3 together.* They cannot pick one "True" successor. They must distribute. This is the Parfitian move.

      *Wait, one nuance:* The prompt says "Before scanning, the original had made three concrete commitments."
