      *   **Duration:** 90 minutes.
      *   **Topic:** Parfit's Teletransporter, moving beyond binary survival/death to psychological continuity as multi-dimensional and gradable.
      *   **Core Mechanism:** A "Calibrated Teletransporter" scenario. Instead of one copy, there are 4-6 candidates with varying fidelity across 5 axes (episodic memory, procedural memory, moral dispositions, narrative coherence, affective temperament). Fidelity levels: 30%, 60%, 95%.
      *   **Stakes:** Three specific pre-scan commitments (co-authorship, debt, caregiving).
      *   **Goal:** Participants must *feel* the collapse of sharp identity boundaries through a structured activity/game before the theory is named. They need to experience coordination failure and the difficulty of distributing obligations.
      *   **Constraints:** No text consultation, no bibliographies. Must include roles, rules, timeline, stakes, debrief mapping to Parfit, prediction of sticking points, and a note on limitations (phenomenology/metaphysics).

  2.  **Deconstruct the Scenario & Mechanics:**
      *   *The Original:* Needs to be represented (perhaps by the Facilitator or a designated role). Let's make the Facilitator the "Original" to maintain control over the reveal, or better, make the *Group* the "Original" collectively to increase buy-in. Actually, having one participant play the "Original" who is about to be scanned adds tension. Let's go with one volunteer as the "Traveler."
      *   *The Candidates:* 4-6 distinct profiles generated by the fidelity axes.
      *   *The Obligations:*
          1.  Co-authorship (requires high cognitive/procedural fidelity).
          2.  Debt (requires legal/moral recognition).
          3.  Caregiving (requires affective/narrative fidelity).
      *   *The Conflict:* No single candidate has 95% across all axes. Some have high memory but low affect. Some high affect but low procedural skill.
      *   *The Task:* Allocate the obligations. If they allocate to the "wrong" one, there's a penalty (stakes). If they leave it unfulfilled, there's a penalty.
      *   *The Twist:* They start by trying to pick *The One*. The rules must force them to realize *The One* doesn't exist.

  3.  **Drafting the Activity Structure (The "Calibration Protocol"):**
      *   **Phase 1: Setup & Intuition (15 mins).** Introduce the Traveler and the Obligations. Ask the group: "Who survives?" Expect binary answers.
      *   **Phase 2: The Reveal & Distribution (45 mins).** Reveal the Candidates. Assign roles to participants (Candidate Advocates or Judges). Let's make them a "Review Board" deciding liability.
      *   **Phase 3: The Crisis (15 mins).** Introduce a constraint that breaks the "pick the best match" heuristic. (e.g., Resources are limited, or Candidates refuse partial load).
      *   **Phase 4: Debrief (15 mins).** Connect to Parfit.

      *Refining the Mechanics for "Graduate Level":* Simple voting is too easy. They need to *negotiate*.
      *Idea:* Give them a budget of "Identity Credits." They have to spend credits to assign obligations. High fidelity candidates cost more to activate? No, that's too gamified.
      *Better Idea:* The "Binding Contract." They must sign a document. If they assign an obligation to a candidate who fails (based on hidden stats), the group loses points/prestige.
      *Best Idea for "Feeling" the Problem:* The candidates (played by subsets of the group) have *conflicting interests*. Candidate A wants the debt (for the credit?) but not the caregiving. Candidate B wants the caregiving.
      *Wait, the prompt asks for participants to experience coordination failure.*
      *Revised Plan:* The group acts as the "Ethics & Liability Tribunal." The Traveler is absent (scanned). The 5 Axes are public. The 4 Candidates are profiles on a screen/handout. The 3 Obligations are cards.
      *Constraint:* You cannot split a single obligation (e.g., you can't pay half a debt). You must assign the whole obligation to one candidate.
      *Constraint:* Each candidate has a "Capacity Limit" based on their fidelity scores. (e.g., A 30% moral disposition candidate will default on debt).
      *Stakes:* The group must reach a unanimous verdict. If they fail, the "Original's" reputation is destroyed (symbolic stake). If they succeed but assign poorly, they face "Litigation" (Facilitator reveals a failure).

      *Let's tighten the "Multi-dimensional" aspect.*
      The candidates shouldn't just be "Better/Worse." They should be *different*.
      Candidate 1: High Memory, Low Affect.
      Candidate 2: High Affect, Low Procedural.
      Candidate 3: Balanced but mediocre (60% all).
      Candidate 4: High Narrative, Low Moral.
      *Obligations:*
      1. Paper (Needs Memory + Procedural).
      2. Debt (Needs Moral + Narrative).
      3. Caregiving (Needs Affect + Narrative).

      *The Trap:* Participants will try to find the "Real" Traveler. The data shows there isn't one. They must distribute. But the rules say "One Obligation = One Candidate." This forces them to acknowledge *survival is distributed*.

  4.  **Developing the Timeline (90 Mins):**
      *   00-10: Intro & The Traveler's Will (Setting stakes).
      *   10-25: The Scan Results (Data release). Initial binary polling.
      *   25-60: Tribunal Deliberation (The core activity).
      *   60-75: The "Branching" Twist (Forcing distribution).
      *   75-90: Parfitian Debrief.

  5.  **Refining the Stakes:**
      *   Need "real" stakes. Since it's a seminar, "Grade Points" is unethical. "Social Capital" or "Group Reputation" is abstract.
      *   *Idea:* A "Liability Pool." The group starts with 100 points. Bad assignments deduct points. If points hit 0, the seminar "fails" (everyone has to write an extra reflection paper? No, too punitive).
      *   *Better:* The Facilitator holds a "Seal of Continuity." Only if they solve it correctly do they get the "Philosophical Insight" (the debrief).
      *   *Best:* Keep it low-stakes but high-tension. The "Stake" is the *Binding Record*. They must sign a public board. The Facilitator reveals the "Outcome" based on Parfitian logic later. The tension comes from the *inability to agree* and the *fear of being wrong*.
      *   *Actually, let's use the "Costly Compromise" instruction.* If they can't agree, the Obligations are voided (Traveler loses everything). If they agree but split the Traveler, they admit Identity is false. The *act of signing* is the stake.

  6.  **Addressing the "Graduate" Level:**
      *   Avoid oversimplification. The axes need to be philosophically relevant (Lockean memory vs. Humean bundle vs. Narrative Self).
