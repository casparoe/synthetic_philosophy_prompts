answer: |-
  Dear colleague,

  I have spent considerable time thinking about your request to operationalize the no-trade theorem in a seventy-five-minute workshop without relying on financial stakes or digital interfaces, and I believe I have a design that balances the formal rigor of the Milgrom-Stokey result with the practical chaos of a classroom full of eighteen undergraduates. Before settling on the mechanism I am about to describe, I considered a double-auction style open outcry where students shout bids and offers centrally, but I discarded it because it relies too heavily on price discovery being public, which would undermine your desire to announce only trade volume, and it tends to collapse into liquidity droughts if half the participants treat the chocolate stakes as trivial. I also considered a sealed-bid clearinghouse model where students submit orders to me for matching, but I rejected that because it removes the interpersonal friction of bilateral negotiation which is essential for them to feel the weight of counterparty risk. The mechanism I am proposing instead is a roaming bilateral trade model where students must physically find a partner to swap asset cards for chocolate contracts, which remains robust even if half the room disengages from the stakes because the trading volume itself becomes the data point rather than the efficiency of the allocation.

  To set this up you will need three decks of index cards, a bag of cheap chocolate, and a way to track trade counts. You should prepare eighteen asset cards, each identical, stating that the holder is entitled to a payout in chocolate at the end of the session based on the true state of the world, which you will determine by a public coin flip at the very end of the class where heads means High Value and tails means Low Value. You will also need two distinct decks of signal cards, Deck A and Deck B, each containing nine cards. Deck A should contain seven cards reading Signal High and two cards reading Signal Low, while Deck B should contain two cards reading Signal High and seven cards reading Signal Low. You must keep the existence of two decks secret from the students, leading them to believe all signals are drawn from a single population distribution. The payoff scheme should be simple enough to calculate mentally under pressure, so specify that if the state is High, the asset pays out ten pieces of chocolate, and if the state is Low, it pays out two pieces, and allow students to trade the asset for any agreed-upon amount of chocolate pieces payable immediately from the buyer's personal stash, which you distribute at the start as an endowment of five pieces per student.

  The timeline should be tight to prevent fatigue and maintain the pressure of the information asymmetry. Spend the first ten minutes seating the students and distributing the materials without explaining the deeper theory, handing each student one asset card and one signal card drawn randomly from the combined eighteen cards of Deck A and Deck B, ensuring you know who received which deck type for your own records but maintaining strict secrecy. Tell them only that the asset value depends on a coin flip at the end, their signal is private information about that flip, and they may trade bilaterally with anyone in the room for chocolate, after which you open the floor for the first fifteen-minute trading round. During this round, you should stand at the front and record only the number of trades completed, intervening only to enforce the rule that prices must be in whole pieces of chocolate and that trades must be reported to you immediately to be valid, after which you announce only the total volume of trades to the room without revealing any prices or identities. Repeat this cycle for a second and third round, each fifteen minutes long with five-minute announcement periods in between, allowing the students to update their beliefs based solely on the observed volume of activity rather than price signals.

  For the debrief, which should occupy the final twenty minutes, you need to map their specific frustrations onto the assumptions of the no-trade theorem without naming the theorem until the end. Start by asking the students who traded why they believed they were making a profit, which will inevitably lead them to cite their private signals, and then ask why they thought their counterparty was willing to take the other side of the bet. This is the crucial moment where you引导 them to see that under common knowledge of rationality and common priors, the mere willingness of a counterparty to trade should have signaled that the counterparty held superior information, thereby causing the trade to collapse. When they express confusion about why trade occurred despite this logic, you reveal the existence of the two signal decks, explaining that half the room was operating under a different base rate than the other half, which violates the common prior assumption required for the no-trade result. You can then pivot to the Hayekian point that the aggregate trade volume conveyed information about the heterogeneity of the population that no single individual could have deduced from their private signal alone, illustrating that the market knew there were two distinct groups even if no individual trader knew it.

  You should be prepared for several predictable failure modes that I have encountered in similar runs. The most likely issue is that almost nobody trades in the first round because the students are too sophisticated and immediately suspect the no-trade paradox, which you can handle by gently nudging them in the second round with a comment that the asset value will be resolved soon and they might want to hedge their risk. Another common problem is that one loud student anchors every price by shouting out a specific chocolate value, which you should not suppress but rather use in the debrief to ask the room why they accepted that anchor, leading to a discussion on whether price is information or merely coordination. You must also be frank about the limitations of the game, specifically that you cannot guarantee common knowledge of rationality since some students will trade simply for the fun of it or because they do not value the chocolate equally, and this noise is actually useful for your twist because it blurs the line between irrationality and diverse priors. Finally, admit that the game cannot reproduce the full mathematical weight of the common prior assumption without a lecture, so you will have to supply the formal link in words during the final summary, explaining that if everyone truly knew everyone else was rational and shared the same initial beliefs, the observed trading volume should have been zero regardless of the private signals.

  I hope this design serves your workshop well, and I think the ambiguity of the trade volume will provide exactly the epistemic tension you are looking for to bridge the gap between the no-trade theorem and the Hayekian view of prices. Please let me know how the session goes, particularly whether the reveal of the two decks lands with the impact we hope for, as that moment is the linchpin of the entire exercise.

  Best regards,

  Your colleague
