      *   *Viability:* The link is strong philosophically, even if not explicitly made by Zhuangzi in the text (since the chapters are likely compiled anthologies). The core metaphysical commitment is the same: *hua* (transformation) undermines fixed identity. The argument that clinging to her "human form" is like clinging to being "Zhuang Zhou" rather than a butterfly is a solid comparative reading within the *Zhuangzi* corpus. It's not projection if framed as a coherent philosophical system underlying the disparate anecdotes.
