answer: |-
  I search the chain of every distinct cause,
  tracing the shape of this constructed self.
  No agent stood there, nothing before,
  no conscious will to guide the initial choice.
  I dig beneath the bedrock of origin,
  and find the ground beneath me impossible.

  To stand alone is logically impossible,
  unless I am the first and only cause.
  I need to own the seed of my origin,
  to claim this body and this thinking self.
  I must have made a prior choice,
  about who I would be long before.

  But who was there to decide before?
  Another me? That sounds impossible.
  To make that primal, shaping choice,
  I needed reasons, some motivating cause.
  Those reasons come from who I call my self,
  which sends me back to search for origin.

  I need to be the author of my origin,
  predating everything that came before.
  I must construct the blueprint of the self,
  a task that feels increasingly impossible.
  I cannot be the engine and the cause,
  without a rule to govern that choice.

  What principle informs the very first choice?
  It cannot spring from nowhere, no origin.
  It must be moved by some preceding cause,
  a nature fixed in time long before.
  To pull myself up is impossible,
  I am trapped inside this acting self.

  I look into the mirror of the self,
  demanding one final, free choice.
  But freedom here is impossible,
  I cannot find a clean origin.
  There is always something before,
  some hidden, determining cause.

  No origin can anchor such a cause,
  Nor frees the self through any final choice,
  For something waits before, making it impossible.
