answer: |-
  **The Scenario**
  Consider a cooperative irrigation scheme on a flat, arid plain where 100 farmers arrive sequentially to appropriate identical plots surrounding a single central reservoir. Each farmer legitimately acquires a plot and installs a pipe connecting to the main line; each connection is voluntary, respects prior rights, and individually reduces water pressure across the entire system by exactly 1%. The engineering threshold for viable crop growth is 10% pressure; below this, the soil salinates and the land becomes barren. The first 90 farmers connect without issue; the 91st through 99th farmers connect, dropping pressure from 10% to 1%, which is legally deemed *de minimis* and does not trigger the Lockean proviso because no individual farmer renders another's existing plot unusable *at that moment*. When the 100th farmer connects, pressure hits 0%, salination occurs, and the 100th farmer's land is immediately rendered infertile, leaving them worse off than if no appropriation had occurred at all (where they could have settled elsewhere), yet no single prior connection caused the collapse, no one farmer holds a monopoly, and the 100th farmer's own connection was the final trigger but not the sole cause.

  **Demonstration of Constraints**
  (1) **Legitimacy:** Every farmer acquires unowned land and installs their own pipe without force or fraud; all transactions are rights-respecting. (2) **Local Proviso:** For any specific farmer *N* (where *N* < 100), the counterfactual "had *N* not connected" would only raise pressure by 1%. Since 1% does not cross the viability threshold for any *other* farmer currently in the system, no individual act worsens another's position enough to violate the proviso *ex ante*. (3) **Global Failure:** The 100th farmer ends up with barren land, clearly worse off than the baseline of "no appropriation" (where the land remains open and viable elsewhere). (4) **No Rectification Target:** You cannot blame the 100th farmer (they are the victim of the system), nor any specific prior farmer (their individual contribution was innocuous). The harm is an emergent property of the aggregate, leaving the Rectification Principle with no specific rights-violator to bill.

  **Nozick's Three Principles vs. Patterned View**
  For Nozick, the **Principle of Justice in Acquisition** is the choke point: did the 100th acquisition violate the proviso? Nozick might argue "no," because the 100th farmer voluntarily entered a known system, or "yes," but then the **Principle of Rectification** fails because there is no identifiable violator to restore the balance. The **Principle of Justice in Transfer** is satisfied throughout, as every pipe installation was consensual. To a **Sufficientarian** or **Difference Principle** advocate, this distribution is unjust regardless of history: the 100th farmer lacks the material floor required for agency, and the inequality (99 viable farms vs. 1 barren one) does not benefit the least advantaged. They would intervene to redistribute water rights or subsidize the 100th farmer, viewing the historical process as morally irrelevant compared to the outcome.

  **The Structural Feature**
  The work is being done by **non-linear cumulative thresholds** (a Sorites paradox of entitlement). The goods (water pressure) are complementary to the *system's* existence but substitutable in individual *acts*. If you remove the threshold effect (e.g., if pressure degraded linearly and viability had no hard floor), the 100th farmer would simply have slightly lower yield, which is compensable. If you remove the cumulative aspect (e.g., independent wells), the problem vanishes. The case relies on the disconnect between marginal harm (undetectable) and total harm (catastrophic).

  **The Nozickian Wriggles**
  First, the **Systemic Proviso**: You recalled correctly that Nozick defines the proviso as applying to a "process normally giving rise to... a property right." A defender could argue we must evaluate the *practice* of sequential appropriation, not the token acts. If the *practice* leads to the 100th farmer's ruin, the practice is invalid, and earlier appropriators never gained full title. *Counter:* This collapses historical entitlement into end-state evaluation; it requires knowing the future total of appropriators to validate the first act, which undermines the "liberty upsets patterns" argument by imposing a patterned constraint on the *process* itself.
  Second, the **No Complaint** defense: A hardcore Nozickian might argue the 100th farmer has no complaint because no one violated their rights; they merely failed to appropriate in time. *Counter:* This empties the Lockean Proviso of content. If the proviso only forbids making others worse off than they *currently* are (rather than worse off than in the state of nature), it permits enclosing all resources so long as you leave the last person a "choice" of starvation or employment, which Nozick explicitly denies is permissible.

  **The Georgist Disguise**
  Yes, this is secretly a Georgist complaint about privatizing a shared resource (the aquifer's pressure) without paying rent to the community. It relies on the intuition that the "capacity to absorb users" is a common asset. To make it *not* Georgist, you must ensure the resource isn't naturally occurring but **created by the appropriators**. Modify the scenario: the 100 farmers build a shared server network where each adds processing power but also latency. The latency threshold kills the 100th user's connection. Here, the "floor" isn't a natural common but a cooperative artifact. If the Nozickian still cannot identify who owes rectification for the system's collapse despite everyone acting within their rights, the problem is internal to entitlement theory, not an external claim about common ownership.
