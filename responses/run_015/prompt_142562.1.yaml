      *   *Who harmed Step 100?* Everyone reduced pressure by 1%.
      *   *Did Step 1 violate the proviso?* Step 1 reduced pressure by 1%. Was Step 100 worse off than if Step 1 hadn't connected? Yes, by 1%.
      *   *Is 1% a proviso violation?* Nozick: "Worsened" usually means significantly. If 1% is de minimis, then Step 1 is clear.
