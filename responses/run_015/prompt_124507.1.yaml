      *   *Actually, the standard reading:* Hofstadter writes as a "white male" in a world where pronouns are marked by race (e.g., "he" = white, "she" = black, etc., or similar). He uses the arguments *typically used to defend generic 'he'* to defend this racialized language. The point is to show that if those arguments are bad for race, they are bad for gender.
