      *   *Refining the "Missed Issue":* Focus on the *explanation of indistinguishability*. Both talk past each other on this. Vasquez thinks it needs a positive explanation (shared property); Chen thinks it needs a negative one (lack of knowledge). They need to address *why* the negative explanation suffices.
