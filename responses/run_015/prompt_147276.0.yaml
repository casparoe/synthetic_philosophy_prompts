      *   *Step 5: Remedy.* Cicero usually argues for moral renewal (*virtus*). But if the structure itself (the algorithm) incentivizes vice, can virtue survive? He might realize that *mos maiorum* requires a stable public square. If the square is poisoned, virtue cannot be taught. He might concede structural intervention is needed, though it pains him (as he prefers moral solutions).

