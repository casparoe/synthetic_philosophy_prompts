  **Note on the text**

  There's a fair bit of agreement on the basics of Smith's *Theory of Moral Sentiments*. Most scholars settle on the idea that Smithian sympathy isn't about literally feeling what another feels, but rather imagining oneself in their situation to judge the propriety of their emotions. The impartial spectator is generally understood as an internalised standard we develop through social interaction—a way of viewing our own conduct as others might.

  The reading used above is a bit more specific and arguably more contested. Treating the impartial spectator as a statistical aggregation of social behaviour, rather than a singular internalised judge, pushes against the idea of a unified moral conscience. Some argue this makes the spectator too external, an alien weight of average opinion rather than a personal moral compass. It's a useful lens for fiction exploring performance, but it's not the consensus view in moral philosophy.
