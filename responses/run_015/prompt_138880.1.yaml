answer: |-
  ### Part 1: Conceptual Brainstorming

  To build a procedure for clinicians, not metaphysicians, I am preserving the **exemplar-based** view of concepts (we know "Plagiarism" by remembering a specific theft, not by reciting a definition) and **family resemblance** (cases share overlapping features, no single feature is required). I am preserving **conceptual drift**, acknowledging that "Falsification" in 2010 is not "Falsification" in 2024. I am deliberately dropping **necessary-and-sufficient conditions** (the idea that a checklist can capture the essence of a concept) and **essentialism** (the belief that there is a true, hidden nature of "Plagiarism" we are trying to discover).

  I am also dropping the distinction between **extension** (the set of all things the word applies to) and **intension** (the definition of the word). In your committee room, these are the same thing: the extension *is* the intension. If we vote that the LLM case is Falsification, then Falsification *includes* LLM cases. I am treating the categories as tools for maintaining the integrity of the record, not as moral buckets for sorting souls. This means the procedure must prioritize **consistency of framing** over **correctness of classification**. We are not asking "What is this?" We are asking "Which rule are we applying, and are we willing to apply it this way again?"

  ### Part 2: The Procedure for Conceptual Classification

  **Time Limit:** 25 Minutes (leaving 15 for Severity/Sanction)
  **Participants:** Triage Pair (pre-meeting), Full Committee (9 members + Legal)
  **Goal:** Assign one category. Sanctions are forbidden in this phase.

  #### Step 1: The Fact Stop (5 Minutes)
  **Question:** Is there a preponderance of evidence that an act occurred which deviates from accepted practice?
  *   **Sufficient Answer:** Yes/No based on documents/testimony.
  *   **Stop Point:** If **No**, verdict is **No Finding**. End procedure.
  *   **Stop Point:** If **Yes**, but the deviation is purely a difference of scientific opinion or interpretation without procedural breach, verdict is **No Finding**. End procedure.
  *   **Fact/Value Marker:** This is a **Fact** step. If the committee disagrees on whether the act happened, refer to Counsel for evidentiary ruling. Do not proceed to classification until the act is established.

  #### Step 2: The Exemplar Anchor (5 Minutes)
  **Question:** Which past case (Exemplar) does this case most resemble in *structure*, not just outcome?
  *   **Instruction:** Do not name the category yet. Name the *Exemplar*. (e.g., "The 2018 Image Splicing Case," "The 2015 Text Recycling Case").
  *   **Sufficient Answer:** "This case is structurally analogous to Exemplar X."
  *   **Fact/Value Marker:** This is a **Value** step. It requires human judgment of similarity. If no consensus on Exemplar, the Chair selects the two strongest candidates and the committee votes on the *Analogy*, not the Category.

  #### Step 3: The Slippage Statement (5 Minutes)
  **Question:** Complete the following fixed form. This forces the committee to admit where the concept is stretching.
  *   **Form:** "[Exemplar Name] is to [Category Name] as [Current Case] is to [Proposed Category]."
  *   **Required Sub-Statement:** "The conceptual slot slipping is: [Choose: Whose Words / What Counts as Record / Whether There Is An Author / Manipulation of Data vs. Presentation]."
  *   **Required Sub-Statement:** "The rival framing available is: [Name the other category being rejected and why it was rejected]."
  *   **Sufficient Answer:** A completed form.
  *   **Fact/Value Marker:** This is a **Value** step. This is where the committee accepts responsibility for the drift.
  *   **Mechanism (Slippage Ledger):** The Secretary records the "Slot Slipping" and "Rival Framing" in the Ledger.

  #### Step 4: The Contraction Check (5 Minutes)
  **Question:** If we classify this as [Proposed Category], what is a clear case that would now be *excluded* from this category?
  *   **Instruction:** You must name a hypothetical case that would now be *too far* to count.
  *   **Sufficient Answer:** A description of a boundary case.
  *   **Stop Point:** If the committee cannot name a boundary (i.e., the category now covers "everything bad"), verdict is **Too Fluid to Apply**. Refer to Full Committee for Category Review (triggers Mechanism: Precedent Rule).
  *   **Fact/Value Marker:** This is a **Value** step. It tests the coherence of the group's intuition.

  #### Step 5: The Severity Firewall (5 Minutes)
  **Question:** Does the desire for a specific sanction (e.g., termination vs. retraining) influence the choice of category?
  *   **Instruction:** Legal Counsel asks this explicitly.
  *   **Stop Point:** If **Yes**, the classification is void. Return to Step 2.
  *   **Mechanism (Severity Separation):** Classification is final before Sanction discussion begins.
  *   **Fact/Value Marker:** This is a **Value** step (introspection).

  ---

  ### Part 3: The Four Mechanisms (Embedded Policy)

  1.  **The Slippage Ledger:** Every time Step 3 identifies a "Slot Slipping" (e.g., "What Counts as Record" for LLMs), it is logged.
      *   *Rule:* If the same Slot Slips for the same Category three times in a year, the Policy Committee must draft a formal addendum to that category's guidance.
  2.  **The Precedent Rule:**
      *   *Binding:* If a classification is unanimous and the Slippage Ledger shows <3 prior slips on that slot, this case becomes a binding Exemplar for future Step 2 matching.
      *   *Split/Merge:* If the vote is split (5-4) or the Slippage Ledger shows >3 prior slips, this triggers a formal review to either split the category (e.g., "Falsification" vs. "Misrepresentation") or merge it (e.g., "QRP" absorbs "Honest Error").
  3.  **The Contraction Test:**
      *   *Annual Audit:* Once a year, the Committee must review each Category and name a case that would *not* fall under it.
      *   *Verdict:* If they cannot name an exclusion for a category, the verdict is **Too Fluid to Apply**. That category is suspended until redefined. This prevents categories from becoming "Catch-Alls."
  4.  **The Severity Firewall:**
      *   *Hard Separation:* The Dean signs off on the Classification *before* seeing the Sanction Recommendation. The Committee is forbidden from discussing "What punishment fits?" during the 25-minute Classification window. This prevents "Punishment-Driven Categorization" (choosing Falsification because you want to fire them).

  ---

  ### Part 4: What We Lose

  By treating categories as anchored in exemplars and subject to drift rather than as fixed definitions, we lose the ability to call a classification **simply wrong**. In a definitional system, if a case lacks a necessary condition, the classification is false. In this system, a classification is only **inconsistent** or **unacknowledged**. We lose the comfort of external authority; we cannot appeal to "The Dictionary" or "Federal Law" to settle a dispute. We can only appeal to our own prior consistency. This places a heavier burden on the Slippage Ledger and the memory of the committee. We trade truth for coherence.

  ---

  ### Part 5: Case Runs

  I will now run the procedure on your three cases. I am acting as the Committee Chair applying the protocol.

  #### Case One: The Resident (Self-Recycling)
  *   **Step 1 (Fact):** Act occurred. Verbatim reuse of own text, no attribution. Deviates from journal expectation of original text. **Proceed.**
  *   **Step 2 (Exemplar):** Resembles "The 2016 Duplicate Publication Case" (where a researcher published the same dataset twice without cross-reference).
  *   **Step 3 (Slippage Statement):**
      *   "The 2016 Duplicate Publication Case is to **Questionable Research Practice** as This Case is to **Questionable Research Practice**."
      *   **Slot Slipping:** *Whose Words.* (Plagiarism requires 'someone else'; this is 'self'.)
      *   **Rival Framing:** Rejected **Plagiarism** because the stipulated gloss requires "someone else's words." Rejected **No Finding** because it damages the record (redundancy inflates publication count).
  *   **Step 4 (Contraction Check):** If this is QRP, what is *not* QRP? Reusing one's own *methods* description from a thesis in a paper (if allowed by institution) would be excluded. Reusing *data* without citation would be Falsification.
  *   **Step 5 (Severity):** Committee notes desire to just "educate" the resident. Does not influence category.
  *   **Verdict:** **Questionable Research Practice.**
  *   **Instinct Check:** Your instinct was "Trivial." This procedure overturns that.
  *   **Reasoning:** The "No Finding" option is blocked by the Contraction Check (if everything trivial is No Finding, QRP becomes too fluid). The "Plagiarism" option is blocked by the stipulated gloss ("someone else's words"). Therefore, it must be QRP. The procedure forces you to acknowledge that while it isn't theft, it is a breach of the record's integrity. The "Trivial" instinct relies on a moral assessment (no victim), but the procedure relies on a record assessment (redundancy).

  #### Case Two: The Postdoc (LLM Drafting + False Claims)
  *   **Step 1 (Fact):** Act occurred. LLM used undisclosed. Text contains claims not supported by data. **Proceed.**
  *   **Step 2 (Exemplar):** Resembles "The 2019 Spin Case" (where authors exaggerated conclusions in the abstract beyond what data supported).
  *   **Step 3 (Slippage Statement):**
      *   "The 2019 Spin Case is to **Falsification** as This Case is to **Falsification**."
      *   **Slot Slipping:** *What Counts as a Record.* (The text is generated by a non-author agent, but represents the author's claim.)
      *   **Rival Framing:** Rejected **Plagiarism** (no human victim). Rejected **Fabrication** (data exists, only the *link* between data and claim is broken). Rejected **QRP** because the error is not just "sloppy," it creates a false representation of the research findings.
  *   **Step 4 (Contraction Check):** If this is Falsification, what is *not*? A typo in the discussion that doesn't change the claim. An honest misinterpretation of a complex statistical result (Honest Error).
  *   **Step 5 (Severity):** Committee feels the LLM use is "new" and scary. Must ignore that. Focus on the false claim.
  *   **Verdict:** **Falsification.**
  *   **Instinct Check:** Your instinct was "Nowhere." This procedure forces a decision.
  *   **Reasoning:** The procedure forbids "Nowhere" if the record is damaged. The false claims about data constitute a manipulation of how the research is represented. The LLM is a tool, like a graphing software that was misused to create a misleading curve. The "Slot Slipping" acknowledges that the *author* of the text is ambiguous, but the *responsibility* for the claim is not.

  #### Case Three: The Technician (Blot Splicing)
  *   **Step 1 (Fact):** Act occurred. Lanes spliced, not disclosed. **Proceed.**
  *   **Step 2 (Exemplar):** Resembles "The 2012 Image Manipulation Case" (where contrast was adjusted globally, but lanes were moved).
  *   **Step 3 (Slippage Statement):**
      *   "The 2012 Image Manipulation Case is to **Falsification** as This Case is to **Falsification**."
      *   **Slot Slipping:** *Whether the Manipulation is of Data or Presentation.* (Here, presentation *is* the data representation.)
      *   **Rival Framing:** Rejected **QRP** (Argument: "Ordinary practice when trained"). Counter-argument: Current policy governs current submission. Rejected **Honest Error** (Argument: "Years of doing it"). Counter-argument: Systematic, not accidental.
  *   **Step 4 (Contraction Check):** If this is Falsification, what is *not*? Adjusting contrast equally across the whole blot (if disclosed). Cropping irrelevant lanes (if disclosed).
  *   **Step 5 (Severity):** Committee feels sympathy for "old norms." Must ignore.
  *   **Verdict:** **Falsification.**
  *   **Instinct Check:** Your instinct was "Serious." This aligns.
  *   **Reasoning:** The procedure locks this in because the "Record" is inaccurately represented. The "Old Norm" defense is handled in the Severity Phase (sanction), not the Classification Phase (category). This prevents the category from drifting to accommodate nostalgia.

  ---

  ### Part 6: Overruled Premises and Self-Critique

  **Overruled Premise:**
  In Case One, I overruled your premise that "Trivial" maps to "No Finding." The procedure forces a "QRP" verdict because the Contraction Test requires QRP to have *some* content. If we classify self-recycling as "No Finding," QRP risks becoming empty (Too Fluid). The procedure prioritizes the **health of the category system** over the **intuitive mildness of the specific case**. It demands that you acknowledge a norm was breached, even if the punishment is zero.

  **Self-Critique (Contestable Design Choices):**

  1.  **The Severity Firewall:** I marked this as a hard stop, but empirically, humans cannot fully separate "What is this?" from "What do we do about it?" A committee member who wants to fire a researcher will subconsciously stretch "Falsification" to fit. The procedure assumes rational compartmentalization that may not exist. *Mitigation:* Legal Counsel must actively interrupt sanction talk, but this relies on Counsel's vigilance.
  2.  **The Exemplar Memory:** Step 2 relies on the committee remembering "The 2016 Duplicate Publication Case." If turnover is high, institutional memory degrades, and the Exemplar Anchor fails. The procedure assumes a stable committee or a searchable database of past Slippage Ledgers. Without that, Step 2 becomes "What feels right," which returns us to the original problem.
  3.  **The Contraction Test:** I assume the committee can imagine a hypothetical boundary case. Cognitive science suggests people are better at recognizing positive examples than negative boundaries. They may fail the Contraction Test not because the category is too fluid, but because they lack the imagination to construct a boundary. This could lead to unnecessary category suspensions.

  **Empirical Assumption:**
  The entire procedure rests on the assumption that **naming the slippage reduces the anxiety of the slippage.** I assume that if a committee explicitly writes down "We are stretching the definition of Record," they will feel licensed to do it consistently. It is possible that making the drift explicit makes them *more* conservative, causing them to default to "No Finding" to avoid logging a slip. If so, the Ledger becomes a deterrent to justice rather than a tool for clarity.

  **Final Commitment:**
  This procedure will not stop the arguments, but it will change their texture. You will no longer argue about "What is Plagiarism?" You will argue about "Which Exemplar fits?" and "Are we willing to log this slip?" That is a manageable administrative task, rather than an unresolvable philosophical one.
