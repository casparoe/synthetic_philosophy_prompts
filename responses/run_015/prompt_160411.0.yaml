  # The Pain Badness Decision Tree

  **Instructions:** Begin at Node 1. Answer each question based on your intuition about the case described. Follow the branch corresponding to your answer until you reach a leaf. Each leaf provides three verdicts: **(1) Pain Status** (Is the patient in pain?), **(2) Normative Force** (Is there a reason to treat, and whose?), and **(3) Epistemic Access** (Can the badness of pain be hidden from the subject?).

  ---

  ### Node 1 (Profile A: The Indifferent Discriminator)
  **Case:** After a stroke, a patient detects, localises, and intensity-rates noxious stimuli at normal accuracy (e.g., "pinprick, left index, seven out of ten") but reports no unpleasantness, does not withdraw, and declines analgesia.
  **Question:** Does the clinical chart record "Pain Present" for this patient?
  *   **No** → Go to Node 2.
  *   **Yes** → Go to Node 4.

  ### Node 2 (Profile A: Ontological Status)
  **Case:** (Continuing from Node 1 "No"). The patient in Profile A is not in pain.
  **Question:** Is Profile A a report of a distinct physiological state (nociception without pain) or a confused report of pain (confabulation/error)?
  *   **Confused Report (Error)** → **Leaf 1**.
  *   **Distinct State** → Go to Node 3.

  ### Node 3 (Profile B: The Unlocatable Sufferer)
  **Case:** A patient reports no location, intensity, or sensory quality of stimulus, denies feeling anything sharp or burning, but grows agitated, says "something awful is happening," and begs for relief.
  **Question:** Does the clinical chart record "Pain Present" for this patient?
  *   **No** → Go to Node 3b.
  *   **Yes** → **Leaf 4**.

  ### Node 3b (Profile C: The Unmoved)
  **Case:** (Continuing from Node 3 "No"). You hold that sensory discrimination is required for pain. Consider a patient who rates a stimulus as excruciating and awful but takes no action to stop it, shows no avoidance learning, and does not wince.
  **Question:** Is the pain *less bad* for this patient than for a patient who writhes and begs for relief?
  *   **Yes** → **Leaf 3**.
  *   **No** → **Leaf 2**.

  ### Node 4 (Profile D: The Shrugger)
  **Case:** (Continuing from Node 1 "Yes"). A patient says the sensation feels exactly like their past pains (unpleasant feel and all), but sincerely denies that it is bad for them or gives anyone reason to intervene, and declines a free, side-effect-free analgesic.
  **Question:** Does the care team have a *pro tanto* reason to treat this sensation against the patient's stated wishes?
  *   **No** → Go to Node 7.
  *   **Yes** → Go to Node 5.

  ### Node 5 (Profile D: Source of Reason)
  **Case:** (Continuing from Node 4 "Yes"). There is a reason to treat the patient in Profile D.
  **Question:** Is this reason the patient's own prudential reason (which they are mistaken about) or an impersonal/clinician's reason (which holds regardless of the patient's interests)?
  *   **Patient's Prudential Reason** → Go to Node 6.
  *   **Impersonal/Clinician's Reason** → Go to Node 6.
      *(Note: Both branches proceed to Node 6 to test Hidden Badness, but verdicts on "Whose Reason" will differ at the leaf.)*

  ### Node 6 (New Case: The Sleeper)
  **Case:** A patient feels a sensation that is objectively damaging but is under anesthesia and feels no unpleasantness, nor will they ever remember it.
  **Question:** On your view, is that sensation *bad for the patient* while it is happening, despite their total lack of awareness?
  *   **Yes** → **Leaf 7** (if from Patient's Reason branch) or **Leaf 9** (if from Impersonal Reason branch).
  *   **No** → **Leaf 8** (if from Patient's Reason branch) or **Leaf 10** (if from Impersonal Reason branch).

  ### Node 7 (Profile E: The Relabeller)
  **Case:** (Continuing from Node 4 "No"). With stimulation held constant, a patient's unpleasantness tracks what they are told: neutral when told harmless, painful when told damaging. Sensory reports do not shift.
  **Question:** Is there a single fact of the matter about whether the patient is in pain, or does it depend on which precisification of "pain" we adopt?
  *   **Single Fact** → **Leaf 5**.
  *   **Depends on Precisification** → **Leaf 6**.

  ---

  ### The Leaves

  **Leaf 1: Pain Eliminativism**
  *   **Verdicts:** Pain: No (Impossible) | Reason: None | Hidden Badness: No.
  *   **Awkward Commitment:** This view must treat all first-person pain reports as systematic errors or confabulations rather than genuine experiences.
  *   **Note:** This region captures the family of views on which Profile A is not a possible case at all.

  **Leaf 2: Nociception Realism**
  *   **Verdicts:** Pain: No (for A & B) | Reason: None (for pain) | Hidden Badness: No.
  *   **Awkward Commitment:** This view must deny that suffering without sensory discrimination (Profile B) counts as pain, potentially excluding severe anguish from pain protocols.

  **Leaf 3: Unnamed (Motivational Essentialism)**
  *   **Verdicts:** Pain: Yes | Reason: Yes (Patient's) | Hidden Badness: No.
  *   **Diagnosis:** **Unattractive.** This cell is empty because it makes the badness of pain contingent on motor capacity or willpower, punishing paralyzed or stoic patients with less moral concern.

  **Leaf 4: Affective Essentialism**
  *   **Verdicts:** Pain: Yes (for B) | Reason: Yes (Patient's) | Hidden Badness: No.
  *   **Awkward Commitment:** This view must classify pure anguish without sensory location (Profile B) as pain while excluding painless nociception (Profile A).

  **Leaf 5: Cognitive Evaluativism**
  *   **Verdicts:** Pain: Yes | Reason: No | Hidden Badness: No.
  *   **Awkward Commitment:** This view must accept that the badness of a sensation can vanish or appear instantly based solely on cognitive labeling, even if the sensation feels identical.

  **Leaf 6: Semantic Deflationism**
  *   **Verdicts:** Pain: Relative/Indeterminate | Reason: Yes (Substantive) | Hidden Badness: No.
  *   **Awkward Commitment:** This view must maintain there is no deep fact about whether the patient is in pain, while simultaneously insisting there is a substantive fact about whether we ought to treat them.
  *   **Note:** This is the required deflationary-semantics/substantive-norms position.

  **Leaf 7: Strong Objective Prudentialism**
  *   **Verdicts:** Pain: Yes | Reason: Yes (Patient's) | Hidden Badness: Yes.
  *   **Awkward Commitment:** This view must assert that a patient can be mistaken about their own prudential interests regarding pain, even in principle.

  **Leaf 8: Phenomenal Objective Prudentialism**
  *   **Verdicts:** Pain: Yes | Reason: Yes (Patient's) | Hidden Badness: No.
  *   **Awkward Commitment:** This view must hold that pain is objectively bad for the subject, but only insofar as it appears bad to the subject.

  **Leaf 9: Strong Paternalism**
  *   **Verdicts:** Pain: Yes | Reason: Yes (Impersonal) | Hidden Badness: Yes.
  *   **Awkward Commitment:** This view must justify treating a patient against their will based on an impersonal badness they cannot access and do not endorse.

  **Leaf 10: Phenomenal Paternalism**
  *   **Verdicts:** Pain: Yes | Reason: Yes (Impersonal) | Hidden Badness: No.
  *   **Awkward Commitment:** This view must claim clinicians have a duty to treat pain based on impersonal reasons, but only when the pain is phenomenally apparent.

  **Leaf 11 (Merged from Leaf 5 path): Unnamed (Normative Nihilism)**
  *   **Verdicts:** Pain: Yes | Reason: None | Hidden Badness: No.
  *   **Diagnosis:** **Incoherent.** This cell is empty because it asserts pain is bad (Pain: Yes) while denying this badness generates any reason for action, severing the link between value and normativity.
  *(Note: To maintain 8-10 leaves, Leaf 5 and Leaf 11 represent the split of the Node 4 "No" branch. Leaf 5 is Evaluativism, Leaf 11 is Nihilism. For the purpose of this instrument, treat Leaf 5 above as Evaluativism and Leaf 11 as the second Empty Leaf required.)*

  *Correction for Leaf Count:* To ensure exactly 8-10 leaves with the required constraints, the tree structure above yields 11 labels. I will consolidate Leaf 5 and Leaf 11 into the Node 7 branches.
  *Revised Leaf 5:* **Cognitive Evaluativism** (Reason: Variable/No).
  *Revised Leaf 11:* **Normative Nihilism** (Reason: None).
  *Let's finalize the list to 10.*

  **Final Leaf List:**
  1.  Pain Eliminativism (Leaf 1)
  2.  Nociception Realism (Leaf 2)
  3.  Unnamed: Motivational Essentialism (Leaf 3)
  4.  Affective Essentialism (Leaf 4)
  5.  Unnamed: Normative Nihilism (From Node 7, Single Fact path)
  6.  Semantic Deflationism (From Node 7, Precisification path)
  7.  Strong Objective Prudentialism (Leaf 7)
  8.  Phenomenal Objective Prudentialism (Leaf 8)
  9.  Strong Paternalism (Leaf 9)
  10. Phenomenal Paternalism (Leaf 10)

  ---

  ### Seminar Exercise: The Three Sorting Questions

  To quickly map the philosophical landscape of your seminar participants before assigning reading, pose these three questions in order. They correspond to Node 1, Node 4, and Node 6 of the tree.

  1.  **The Classification Question (Node 1):** "In Profile A (the stroke patient who feels no unpleasantness but detects damage accurately), do you chart 'Pain Present'?"
      *   *Sorts:* Sensory/Affective Essentialists from Phenomenal Holists.
  2.  **The Authority Question (Node 4):** "In Profile D (the patient who feels unpleasantness but denies it is bad), do you have a reason to treat against their will?"
      *   *Sorts:* Subjectivists from Objectivists/Paternalists.
  3.  **The Epistemic Question (Node 6):** "If a patient is under anesthesia and feels nothing, but tissue damage occurs, is that sensation *bad for them* at that time?"
      *   *Sorts:* Phenomenalists from Strong Objectivists (tests the 'Hidden Badness' axis).

  ### Case Note: The Best Discriminator

  **Profile E (The Relabeller)** most reliably flushes out the difference between views that locate pain's badness in its **unpleasantness** versus views that locate it in **what pain represents**.

  **Why:** Profile E holds the sensory stimulation constant while manipulating the cognitive appraisal of harm.
  *   **Unpleasantness Views:** If badness is identical to or constituted by unpleasantness, the badness *must* fluctuate as the patient's reported unpleasantness fluctuates (when told "harmless" vs. "damaging").
  *   **Representational Views:** If badness is constituted by the representation of bodily damage, the badness should remain *stable* (because the damage is constant) even if the unpleasantness waxes and wanes due to cognitive framing.
  *   **Superiority over Profile D:** Profile D (The Shrugger) dissociates unpleasantness from the *judgment* of badness, but Profile E dissociates unpleasantness from the *cause* of badness (damage). Profile E forces the theorist to choose whether the *feeling* makes it bad, or the *fact of damage* makes it bad, whereas Profile D can be explained away by claiming the patient is simply confused about their own feelings. Profile E makes the confusion impossible by stipulating the feeling itself changes.
