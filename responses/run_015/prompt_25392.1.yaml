      *   *Commitment 3: Mechanistic Explanation.* ML: We want to trace circuits. Dennett: We want to explain the report via physical/functional cause. *Match:* Exact.
      *   *Commitment 4: The Intentional Stance.* ML: We use it pragmatically. Dennett: It's the *only* way to talk about beliefs, but doesn't prove inner existence. *Match:* Exact pragmatically, divergent ontologically.

  5.  **Developing the Residue Report (The Critical Analysis):**
      *   *Question 1 (Translation Quality):* Most methodological steps translate cleanly. The distortion comes in *why* we do it. ML does it to improve performance/safety. Dennett does it to dissolve the "Hard Problem."
      *   *Question 2 (Missing Elements):* The "First-Person Perspective." In ML, we assume there *is* no first-person perspective in the model (usually). In Heterophenomenology, the human *claims* to have one. The method is designed to bridge the gap between the human's *claim* of qualia and the scientist's *denial* (or redefinition) of qualia. ML doesn't have the "claim of qualia" problem yet (mostly).
      *   *Question 3 (Method vs. Ontology):* This is the crux. The ML researcher thinks, "I already treat outputs as data." Dennett says, "Good, now realize that *humans* are just complex language models, and their 'qualia' are just user-illusions generated by the same process." The challenge isn't methodological; it's ontological. It applies the ML stance *back onto the researcher*.

