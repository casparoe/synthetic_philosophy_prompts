answer: |-
  # Activity Plan: The Committee of Drafts

  **Session Length:** 90 Minutes
  **Group Size:** 9 Students
  **Goal:** To simulate the fragmentation, latency, and retrospective construction of experience without invoking a central "observer" until the debrief.

  ## 1. Setup & Materials
  *   **Room:** A space with a large whiteboard (or butcher paper on a wall) and a table for the "Editorial" team.
  *   **Props:**
      *   A distinct noise maker (e.g., a loud clicker or bell).
      *   A distinct light source (e.g., a camera flash or phone torch).
      *   Index cards (prepared in advance, see below).
      *   Whiteboard markers and an eraser (controlled by you).
      *   A timer visible to all.
  *   **Seating:**
      *   **Visual Cluster (3 students):** Facing the light, backs to the room.
      *   **Auditory Cluster (3 students):** Facing the sound source, backs to the room.
      *   **Editorial Node (3 students):** Facing the whiteboard. They cannot see the light or hear the clicker directly (they wear noise-canceling headphones or earplugs for the duration of the round).

  ## 2. The Rules (Read Aloud - 5 Minutes)
  *Do not mention Dennett, consciousness, or the Cartesian Theatre.*

  "Welcome. Tonight we are simulating a high-latency information processing system. You are components of a single system tasked with generating a 'Situation Report.'

  **The Objective:** Produce a single sentence on the whiteboard describing the order and timing of external events.
  **The Constraint:** You have 3 minutes per round. At the buzzer, I will erase the whiteboard completely. You must begin the next round from memory.
  **Communication:**
  1.  **Sensory Clusters** cannot speak. You may only pass written notes to the **Editorial Node**.
  2.  **Editorial Node** writes on the board. They may not speak to Sensory Clusters, only write prompts on the board (e.g., 'TIME?').
  3.  **No Hierarchy:** If I observe one person dictating the final report, the group score for that round is halved. Consensus must appear distributed.

  **Scoring:**
  *   **Coherence (5 pts):** The report is a grammatically complete sentence.
  *   **Consistency (10 pts):** The report matches the data provided by the majority of Sensory Clusters.
  *   **Stability (5 pts):** The report remains unchanged for the final 30 seconds of the round."

  ## 3. The Hidden Mechanics (Facilitator Only)
  *This is where the "Cartesian Theatre" is secretly sabotaged.*

  **Prepared Index Cards:**
  Do not give everyone the same information. Distribute these randomly within the clusters at the start of each round.

  *   **Visual Cluster Cards:**
      *   Card A: "Flash detected at T=0."
      *   Card B: "Flash detected at T=200ms."
      *   Card C: "Flash detected. Timing uncertain."
  *   **Auditory Cluster Cards:**
      *   Card A: "Click detected at T=0."
      *   Card B: "Click detected at T=100ms."
      *   Card C: "Click detected. Order uncertain."

  **The Twist:**
  *   **Round 1:** The physical event is Flash *then* Click.
  *   **Round 2:** The physical event is Click *then* Flash.
  *   **Round 3:** The physical event is Simultaneous (but cards suggest otherwise).

  **The Erasure:**
  When you erase the board between rounds, you are simulating the lack of a permanent "memory screen." They must reconstruct the narrative from scratch, often altering details slightly due to memory decay. This creates *different drafts* of the same event over time.

  **The Hierarchy Trap:**
  Watch the Editorial Node. If one student grabs the marker and refuses to let others write, note it. Do not stop them. Penalize them in the scoring phase. This punishes the "Central Observer" model.

  ## 4. Session Timeline

  **00:00 – 00:10: Introduction & Role Assignment**
  *   Assign roles randomly.
  *   Read the rules.
  *   Emphasize: "There is no Director. You are the system."

  **00:10 – 00:40: The Game (3 Rounds)**
  *   **Round 1 (10 mins):** Trigger Flash -> Click. Let them struggle with the note-passing. Erase board.
  *   **Round 2 (10 mins):** Trigger Click -> Flash. Swap some index cards between students in the same cluster (simulate neural noise). Erase board.
  *   **Round 3 (10 mins):** Trigger Simultaneous. Tell them they *must* decide an order. Erase board.
  *   *Note:* The constant erasing forces them to realize there is no "Master Copy." The report only exists while it is being written.

  **00:40 – 00:50: Scoring & Frustration**
  *   Tally points publicly.
  *   Apply the "Hierarchy Penalty" if applicable (explain: "One person dominated the marker").
  *   **Crucial Moment:** Ask the Editorial Node: "When did you decide the final report was finished?"
      *   *Expected Answer:* "At the end," or "When we ran out of time."
      *   *Point:* There was no moment of "completion," only cessation.
  *   Ask Sensory Clusters: "Did you see the event at the same time your card said it happened?"
      *   *Expected Answer:* "No, I had to wait to pass the note."

  **00:50 – 01:20: The Debrief (The Reveal)**
  *   **The Hook:** "Why was it impossible to know exactly when the experience happened?"
  *   **The Connection:** Introduce the **Cartesian Theatre**. Explain that they tried to find a place (the whiteboard) and a time (the final 30 seconds) where the experience became 'real.'
  *   **Dennett's Attack:**
      *   **No Central Screen:** The whiteboard was wiped. There is no place in the brain where 'it all comes together.'
      *   **Multiple Drafts:** Each round was a new draft. The 'final' report was just the last one before the buzzer, not the 'true' one.
      *   **Editorial Authority:** The Editorial Node felt like the 'Self,' but they were dependent on fragmented, delayed notes. They were not watching a screen; they were writing a story based on unreliable memos.
      *   **Orwellian vs. Stalinesque:** In Round 3 (Simultaneous), you forced them to invent an order. Did they falsify the data before writing it (Orwellian) or after (Stalinesque)? Dennett says the distinction is meaningless; it's just a draft.

  **01:20 – 01:30: Wrap Up**
  *   Open floor for objections.
  *   Assign reading for next week (e.g., *Consciousness Explained*, Chapter 5, or a summary article).

  ## 5. Predictable Failures (And Why They Help)
  1.  **The "CEO" Emerges:** One Editorial student will grab the marker and ignore the notes.
      *   *Philosophical Payoff:* This proves our *intuition* is to posit a central observer. The penalty reveals the cost of that intuition (lower score).
  2.  **Sensory Rebellion:** Visual/Audio students will get angry that their data is ignored.
      *   *Philosophical Payoff:* This simulates qualia that don't make it into the "narrative gravity" of consciousness.
  3.  **Memory Drift:** Round 2's report will contradict Round 1's report, even if the event was similar.
      *   *Philosophical Payoff:* Memory is not a playback of a recording; it is a reconstruction (a new draft).

  ## 6. Honest Limitation of the Game
  *Be explicit about this in the debrief.*

  **The Homunculus Problem:**
  "This game fails in one specific way. You, the students, are conscious beings playing the role of unconscious neurons. You *felt* like you were in a Cartesian Theatre while playing the game. You had an inner experience of reading the cards and passing the notes.
  Dennett's model claims there is *no one* inside the head having that experience. The game simulates the *structure* of Multiple Drafts, but it cannot simulate the *absence of an experiencer*. You are still homunculi. Don't mistake the map for the territory."

  ## 7. Facilitator Cheat Sheet (Key Phrases for Debrief)
  *   "The whiteboard was not a screen you were watching; it was a process you were doing."
  *   "There was no moment when the light 'became' conscious. There was only the note passing, the writing, and the erasing."
  *   "If I hadn't erased the board, would the first thing you wrote be the 'true' experience? Or the last?"
  *   "Dennett argues the 'Self' is not the Editor. The 'Self' is the narrative gravity created by the editing process."
