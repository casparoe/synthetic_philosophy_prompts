      *   **Topic:** Dirty Hands problem (Institutional version).
      *   **Core Concept:** Split moral cost across three roles (Decider, Executor, Denier). System depends on plausible deniability/ignorance. Moral ledger doesn't net out (residue remains in the system).
      *   **Constraints:** 90 minutes, paper/pens/tokens only, no pre-reading/citations.
      *   **Requirements:** Runnable activity, specific roles/rules (coordination without explicit acknowledgment), payoff scheme (asymmetric stakes), timeline, debrief mapping to concepts, limitations note, prediction of failure modes + mitigation.
      *   **Tone:** Practical, philosophical, slightly provocative (rationalist-adjacent), no fluff.

  2.  **Deconstruct the Core Concept (Institutional Dirty Hands):**
      *   *Standard Dirty Hands:* Leader does bad for good.
      *   *Workshop Twist:* Bad is fragmented. No single person does the "bad thing" in totality.
      *   *Mechanism:* Information asymmetry + Semantic ambiguity.
      *   *Outcome:* Collective benefit, individual cost distribution, systemic guilt.

  3.  **Design the Activity ("The Black Box Protocol"):**
      *   *Setup:* Need a task that requires a "dirty" action to achieve a "good" outcome.
      *   *Roles:*
          *   **Architect (Decider):** Sets the goal, authorizes the method. Gets most points.
          *   **Operator (Executor):** Performs the specific action. Takes a point hit (moral cost).
          *   **Archivist (Denier):** Records the event. Gets neutral points, but must ensure the record looks clean.
      *   *The "Dirty" Act:* Needs to be abstract enough for a classroom but tangible enough to feel like a compromise. Let's use a resource allocation game. There's a "Budget" (tokens). To unlock the "Public Good" (snack/points for all), a specific amount must be moved from a "Protected Fund" to a "Active Fund."
      *   *The Catch:* Moving from Protected to Active is technically "fraud" in the game rules, but necessary to win.
      *   *Communication:* Restricted. They can pass notes, but notes become public record if caught. They must use ambiguous language.

      *Refining the Mechanism:*
      Let's make it about *truth*.
      *   Goal: Reach a target number (e.g., 100) to unlock the snack.
      *   Starting resources: 80.
      *   Way to get +20: A "Special Procedure."
      *   *Architect:* Decides to initiate Special Procedure. Writes a code on a slip.
      *   *Operator:* Executes Special Procedure. Adds the 20. But must mark a personal "Tally" sheet that records a "Violation."
      *   *Archivist:* Writes the Final Report. Must state "All procedures followed standard protocol."
      *   *Constraint:* They sit back-to-back or separated. They can only pass one slip of paper each. The slip is audited. If the slip explicitly says "Break the rule," everyone loses. If the rule is broken but the report says "Standard," the Archivist is safe, Operator is stained, Architect is safe.

      *Wait, let's make the "Residue" clearer.*
      The prompt asks for a moral ledger that doesn't net out.
      Let's use physical tokens for "Guilt."
      *   To win the snack (Group Reward), the group needs 10 "Success Tokens."
      *   They start with 8.
      *   They need to generate 2 more.
      *   Method: The Operator must take 2 "Guilt Tokens" (red) from a central pool and hide them in their pocket/sleeve to convert them into Success Tokens.
      *   The Architect authorizes this.
      *   The Archivist certifies the pool is untouched.
      *   *The Kicker:* At the end, the Guilt Tokens still exist in the Operator's pocket. They weren't destroyed. They are the residue. The Snack is eaten, but the Operator holds the red tokens.

      *Refining for Rationalists:* Rationalists like optimization and game theory. Let's make the incentives explicit but the *coordination* implicit.
      *   **Game:** "The Compliance Audit."
      *   **Goal:** Maximize group points (snack).
      *   **Rule:** Total output must match Total input.
      *   **Reality:** Input < Required Output.
      *   **Solution:** Fudge the numbers.
      *   **Roles:**
          1.  **Director:** Knows the deficit. Decides to fudge.
          2.  **Agent:** Does the fudging. Takes a personal penalty.
          3.  **Auditor:** Signs off on the math. Must ensure the math *looks* right on paper.
      *   **Communication:** One-way memos.

      *Let's go with a specific scenario:* "The Quarantine Breach."
      *   Context: A simulated crisis.
      *   Goal: Save the "Population" (points).
      *   Constraint: Protocol forbids Action X. Action X is the only way to save them.
      *   Roles:
          *   **Command:** Orders Action X (using code).
          *   **Field:** Performs Action X. Marks their own sheet "Protocol Violated."
          *   **Press:** Writes the press release. "Protocol Maintained."
      *   **Payoff:**
          *   Command: +5 pts if Population Saved.
          *   Field: -5 pts (Personal Cost) if Population Saved.
          *   Press: 0 pts (Neutral), but if caught lying, -10.
          *   Group: Snack if Population Saved.

      *Wait, the prompt wants the residue to belong to the system.*
      Let's adjust the payoff. The residue is the *inconsistency* that no one claims.
      Okay, I need to ensure the "Moral Ledger" concept lands.
      Let's use a physical "Ledger" (a sheet of paper).
      The Ledger must balance. It won't balance unless a number is changed.
      Who changes it? The Executor.
      Who orders it? The Decider.
      Who certifies it? The Denier.
      The "Residue" is the physical discrepancy left on the table that no one claims ownership of.

      *Finalizing the Activity Design:*
      **Name:** The Tri-Chamber Protocol.
      **Materials:** Envelopes, slips of paper, red/blue tokens.
      **Scenario:** Resource allocation during a crisis.
      **Mechanism:**
      1.  **Decider** gets the "Crisis Card" (Need 10 units, have 8). Can order "Override."
      2.  **Executor** gets the "Resource Pool." If Override ordered, takes 2 units from "Forbidden Pile." Keeps 2 "Heat Tokens."
      3.  **Denier** gets the "Public Log." Must write "No Forbidden Pile touched."
      4.  **Audit:** Facilitator checks. If Log matches Pool (impossible if done honestly), game over. If Log says "Clean" but Pool is missing 2, and no one claims the Heat, the Group Wins but Heat remains.

      *Wait, Rationalists will try to hack the game.*
      They will try to tell the truth. "We broke the rule to save everyone."
      The rules must punish explicit admission.
      *Rule:* If the Public Log admits a violation, the "Public Trust" collapses -> No Snack.
      *Rule:* If the Executor admits violation on their personal sheet, they lose personal points.
      *Incentive:* Everyone wants the snack. Executor sacrifices personal points for group snack. Decider gets glory. Denier stays clean.

      *Let's refine the "Residue".*
      The residue should be a physical object left on the table that represents the lie.
      Let's call it the "Shadow Ledger."

  4.  **Drafting the Timeline (90 mins):**
      *   0-10: Intro & Setup (No theory yet).
      *   10-25: Round 1 (Honesty). They will fail.
      *   25-40: Round 2 (The Protocol). Introduce roles and constraints.
      *   40-55: Execution & Audit.
      *   55-90: Debrief (The meat of the workshop).

  5.  **Drafting the Debrief:**
      *   Map roles to concepts (Decider -> Authorization, Executor -> Action, Denier -> Narrative).
      *   Discuss the "Residue" (The unclaimed guilt).
      *   Discuss the "Silence" (Plausible deniability).
      *   Limitations (No real violence, no long-term corruption).

  6.  **Predicting Failure Modes:**
      *   *Refusal:* They refuse to lie. -> Facilitator must frame it as "simulating the system, not endorsing it."
      *   *Collusion:* They talk openly. -> Enforce silence rules strictly.
      *   *Heroism:* Executor takes the blame publicly. -> Show how this breaks the *systemic* benefit (No snack).

  7.  **Polishing the Tone:**
      *   Keep it crisp.
      *   Avoid academic jargon in the instructions.
      *   Ensure the "Rationalist" angle is hit (incentive structures, coordination problems).

  8.  **Self-Correction/Review against constraints:**
      *   *Paper/pens/tokens?* Yes.
      *   *3 Roles?* Yes.
      *   *Asymmetric Payoff?* Yes (Decider wins, Executor loses, Denier neutral).
      *   *Residue?* Yes (Physical tokens left over).
