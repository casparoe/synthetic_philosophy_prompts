      *   *Failure modes?* Included.

      *One adjustment on Payoff:* The prompt says "Decider gets benefit, Executor takes hit, Denier gets neutrality."
      I need to make sure the Executor *feels* the hit. Maybe they lose a voucher or just points. Since it's a workshop, points are fine.
      Actually, to make it visceral: The Executor has to wear a visible marker (a sticker?) that says "Compromised" if they do the deed. The Decider and Denier remain unmarked. The Group gets the snack regardless, but the Executor is marked.
      *Better:* The Executor has to put a red token in their pocket that they cannot remove until the end of the workshop. It represents the "stain."

      *Wait, the prompt says "Moral ledger that doesn't net out... leftover residue that belongs to the system itself."*
      If the Executor holds the token, it's individual guilt.
      I need the residue to be *unclaimed*.
      Okay: The Executor hides the token. The Denier lies about the token count. The Decider orders it. At the end, there is a token on the table that no one signed for. It is the "System's Debt."
      Let's go with: The "Audit Sheet" has a discrepancy. Everyone signs the Audit Sheet. The discrepancy remains visible on the paper. No one circles it. It is the open secret.

      *Revised Plan:*
      1.  **Goal:** Balance the Budget (Sum of columns = 100).
      2.  **Reality:** Sum = 90.
      3.  **Task:** Make it say 100.
      4.  **Decider:** Writes "Authorize Adjustment."
      5.  **Executor:** Changes the 90 to 100. Signs "Agent."
      6.  **Denier:** Writes Report: "Audit Confirmed Accurate." Signs "Officer."
      7.  **Residue:** The original "90" slip is crumpled and left in the center of the table. No one claims it. It is the truth that was discarded.

      *Wait, Rationalists will discuss the crumpled paper.*
      Let's make the residue the *incentive structure itself*.
      No, needs to be physical.
      Okay, the "Shadow Token."
      To make the numbers work, the Executor must take a "Burden Token" from the bank. The Bank is now short one token. The Denier certifies the Bank is full. The Decider certifies the Mission is success.
      The Missing Token is the residue. It is absent. The hole is the residue.
      Actually, let's keep it simpler.
      **The "Black Budget" Activity.**
      *   **Decider:** Receives classified intel: "Standard funding insufficient. Authorize Black Budget?"
