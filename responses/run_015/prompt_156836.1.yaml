answer: |-
  Here is a candidate principle designed to systematize your intuitions. It prioritizes **social license** and **semantic endorsement** over speaker intent.

  ### The Principle of Licensed Citation

  **A use of a slur $S$ targeting group $G$ is permissible if and only if it satisfies all three of the following conditions:**

  1.  **The Authority Condition:** The speaker is either (a) a member of $G$ using $S$ to refer to $G$ or its members for purposes of solidarity or self-identification, OR (b) a non-member using $S$ strictly as the *object* of meta-linguistic, historical, or reportorial discussion, not as the *vehicle* of description.
      *   *Forced by:* **Cases 6, 9, 10, 4, 5.** This distinguishes who holds the "key" to the word (in-group reclamation) versus who is merely handling it in a controlled setting (journalism/academia). It explains why 9 and 10 are impermissible (lack of authority) and why 4 is worse than 5 (narration is vehicle, dialogue is reported object).
  2.  **The Contempt Constraint:** The use must not function to express or reinforce contempt for $G$, regardless of the speaker's identity.
      *   *Forced by:* **Case 7.** This captures why in-group usage isn't a free pass; internalized oppression (using $S$ to disparage another member of $G$) violates the solidarity requirement of the Authority Condition.
  3.  **The Consent Constraint:** The use must not violate the reasonable expectations or objections of the specific target or the immediate local community of $G$.
      *   *Forced by:* **Cases 13, 14.** This explains why reclamation doesn't "travel" (Case 14) and why you flinch when out-group members are present at a rally (Case 13)—the context changes the safety and consent of the audience.

  ---

  ### Application to Your Undecided Cases

  **(a) A member of $G$ puts $S$ in a song that ends up on mainstream radio, heard mostly by people outside $G$.**
  *   **Prediction:** **Permissible, but contextually fragile.**
  *   **Reasoning:** It satisfies the **Authority Condition** (speaker is in $G$, purpose is artistic/solidarity). However, the **Consent Constraint** is stressed. Because the audience is predominantly out-group (who lack the license to repeat it), the song risks normalizing the word for those without authority. Your principle predicts this is *allowed*, but explains your unease: the "controlled environment" of reclamation is breached when the audience cannot safely participate. It is morally permissible for the artist, but socially risky for the listeners.

  **(b) An AI assistant, asked to reproduce a historical speech verbatim with $S$ spelled out, does so.**
  *   **Prediction:** **Permissible.**
  *   **Reasoning:** This satisfies the **Authority Condition (b)**. The AI is not using $S$ as a *vehicle* of description (calling the user $S$) but as an *object* of historical record. It falls under the "reportorial/historical" exception (similar to Case 1 and 3). Provided the AI frames it as a quotation (non-endorsement), it is functionally identical to a lecturer writing it on the board.

  ---

  ### The Casualties: Where the Principle Overrules You

  To keep the principle precise, I have to sacrifice a few of your nuanced verdicts. Here is where the principle diverges from your gut:

  1.  **Case 10 vs. Case 9 (The "Worse" Verdict):**
      *   *Your Verdict:* Case 10 (Out-group abuse at Out-group) is **worse** than Case 9 (Out-group warmth at In-group).
      *   *Principle's Verdict:* Both are **equally impermissible**.
      *   *Why:* The principle is binary on Authority. Neither speaker has the license. While I agree with your intuition that 10 normalizes the word as a *generic* weapon (which is dangerous), codifying "degrees of badness" based on the target's identity makes the principle too messy to apply. The principle treats both as unauthorized discharge of a weapon.
  2.  **Case 11 (The Elderly Speaker):**
      *   *Your Verdict:* **Fine / Excused.**
      *   *Principle's Verdict:* **Impermissible, but Blameless.**
      *   *Why:* The principle distinguishes *justification* from *excuse*. Strictly speaking, the word retains its harmful semantic load regardless of the speaker's age. The principle classifies this as a violation of the Authority Condition (they are not using it for reclamation, nor is it strictly reportorial). However, it allows for a "Negligence Clause": if the speaker could not reasonably be expected to know the norm (historical ignorance), they are not *culpable*, even if the act is technically objectionable. This preserves the rule while saving the person.
  3.  **Case 15 (Opt-in Groups):**
      *   *Your Verdict:* Reclamation doesn't work the same way.
      *   *Principle's Verdict:* **$S$ is not a slur in this context.**
      *   *Why:* The principle relies on a definition of $G$ as a group subject to systemic, immutable oppression (race, ethnicity, etc.). If the group is opt-in (religion, hobby), the power dynamic required for a *slur* (as opposed to mere insults) is absent. The principle sidesteps this by defining the scope of $S$ out of existence for Case 15.

  ### Summary of the Trade-off
  This principle sacrifices the **gradient of harm** (Case 9 vs 10) to secure a clear **boundary of authority** (In-group vs Out-group). It treats the slur as a loaded weapon: only those targeted by the weapon (In-group) have the right to disarm and repurpose it; everyone else must handle it only with gloves (quotes/reporting) or not at all.
