      *   Under HTP, is an *insufficient* translation allowed if it's "approximate"? Habermas usually says the *institutional* filter requires secular sufficiency eventually.
      *   But the Chair's specific rulings emphasize the *Secular Reason's Sufficiency* (ii) more than the *Religious Reason's Translatability*.
      *   Ruling (i) didn't say "No translation offered." It said "No secular analog offered."
      *   Ruling (ii) didn't say "Good translation." It said "Secular... sufficient."
