      *   *British English Check:* favour, favoured, programme, analyse, centre, modelling (or modeling? British is usually modelling), canalisation. I will stick to standard British conventions.

      *   *Specific check on "Developmental Locking":* Gould and Lewontin did discuss constraints. They mentioned architectural and phyletic constraints. They mentioned allometry. "Canalisation" is Waddington (1942). Gould knew this. But "developmental locking" as a phrase making spandrels *unavoidable* sounds like a synthesis of their view with later Evo-Deo (e.g. Muller, Wagner). I should characterise this as a legitimate extension but not a direct quote of the 1979 text.

      *   *Specific check on EP:* The summary says "Therefore, the spandrel critique demolishes evolutionary psychology". This implies a logical consequence established by the authors. Gould did argue against EP later, but the 1979 paper cannot logically target a field named and formalised a decade later. This is a significant historical inaccuracy in the summary.

