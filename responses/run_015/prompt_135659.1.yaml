          *   Make sure to explicitly answer the prompt's questions about accuracy, misrepresentation, EP, and developmental locking.

      *   *Drafting thoughts:*
          *   The summary is a composite of Gould and Lewontin's 1979 paper and later interpretations/extensions (especially regarding EP and Evo-Deo).
          *   The first half is very good.
          *   The second half conflates the 1979 argument with later developments in the field and Gould's later solo work.
          *   Need to be careful not to say Gould *never* criticised EP (he did), but that the 1979 summary implies the 1979 paper did this.
          *   Need to clarify that "developmental locking" is more akin to later Evo-Deo synthesis which Gould championed but wasn't fully articulated as such in 1979.

      *   *Writing - Section by Section (mental check):*
          *   Opening: Acknowledge the summary captures the spirit well but falters on historical specificity.
          *   Middle: Discuss the adaptationism/spandrel definition (accurate). Discuss the falsifiability (accurate critique of methodology).
          *   Middle-End: Discuss EP (anachronism). Discuss Developmental Locking (terminological anachronism/conceptual extension).
