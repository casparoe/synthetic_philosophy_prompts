prompt: |-
  I recently encountered a summary in an unnamed philosophy of biology essay that attempts to capture Gould and Lewontin's spandrel critique, and I should like an accuracy audit. The summary runs as follows: 'Gould and Lewontin argued that evolutionary biologists commit the Panglossian error of treating every trait as a purpose-built adaptation, ignoring that many features are spandrels—structural by-products like the triangular spaces between arches in San Marco—which exist not because selection favoured them but because they are inevitable consequences of other design choices. They insisted that once a spandrel exists it may be co-opted for a secondary use, but that co-option is not adaptation in the original sense. From this they concluded that adaptationism is unfalsifiable: whenever biologists encounter a trait with no obvious purpose, they invent a hidden-benefit narrative, and whenever they find a purpose, they claim vindication. Therefore, the spandrel critique demolishes evolutionary psychology, which treats every mental trait as a Pleistocene adaptation, and it further demonstrates that developmental locking—the rigid canalisation of growth pathways—makes spandrels unavoidable in any complex body plan.' I am unsure how much of this is faithful. Could you go through the summary carefully, identifying which sentences accurately reflect their classic argument, which ones subtly misrepresent it—perhaps by conflating spandrels with exaptations, overstating the anti-adaptationist conclusion, or presenting a standard objection as a definitive refutation—and whether the claim about evolutionary psychology actually follows from anything Gould and Lewontin said? I should also like you to address whether the reference to developmental locking is a legitimate extension of their view or an anachronistic import from later evolutionary developmental biology. Please respond in continuous prose with no headings, bullet points, bold text, or tables, and write in British English throughout.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Audit a summary of Gould and Lewontin's "spandrel critique" (from their 1979 paper "The Spandrels of San Marco and the Panglossian Paradigm").
      *   **Input Summary:** A paragraph claiming to capture their argument, covering adaptationism, spandrels, co-option, falsifiability, evolutionary psychology, and developmental locking.
      *   **Constraints:** Continuous prose, no headings, no bullet points, no bold text, no tables. British English.
      *   **Specific Points to Address:**
          *   Accuracy of the adaptationism/Panglossian claim.
          *   Accuracy of the spandrel definition (by-products vs. adaptation).
          *   Accuracy of the co-option/exaptation distinction.
          *   Accuracy of the falsifiability claim.
          *   Accuracy of the evolutionary psychology conclusion (did Gould and Lewontin say this?).
          *   Accuracy of the developmental locking/canalisation claim (is it anachronistic?).

  2.  **Analyze the Input Summary Sentence by Sentence:**

      *   *Sentence 1:* 'Gould and Lewontin argued that evolutionary biologists commit the Panglossian error of treating every trait as a purpose-built adaptation, ignoring that many features are spandrels—structural by-products like the triangular spaces between arches in San Marco—which exist not because selection favoured them but because they are inevitable consequences of other design choices.'
          *   *Assessment:* This is largely accurate. They did coin the term "Panglossian paradigm" to describe strict adaptationism. They did use the San Marco spandrels analogy to describe non-adaptive by-products of structural constraints. This is the core of their 1979 argument.

      *   *Sentence 2:* 'They insisted that once a spandrel exists it may be co-opted for a secondary use, but that co-option is not adaptation in the original sense.'
          *   *Assessment:* This is accurate regarding the concept. They distinguished between origin (by-product) and current utility (co-option). Later, Gould and Vrba (1982) formalised this as "exaptation", but the 1979 paper does discuss co-option. The distinction that co-option is not original adaptation is correct.

      *   *Sentence 3:* 'From this they concluded that adaptationism is unfalsifiable: whenever biologists encounter a trait with no obvious purpose, they invent a hidden-benefit narrative, and whenever they find a purpose, they claim vindication.'
          *   *Assessment:* This is a strong interpretation but generally faithful to their critique. They argued that adaptationist programmes often rely on "just-so stories" that are hard to test. They criticised the methodology as being prone to confirming bias. However, saying they concluded it is *unfalsifiable* might be slightly too strong philosophically, but they certainly argued it operates *as if* it were unfalsifiable due to the ease of constructing narratives. It's a fair representation of their rhetorical stance.

      *   *Sentence 4:* 'Therefore, the spandrel critique demolishes evolutionary psychology, which treats every mental trait as a Pleistocene adaptation, and it further demonstrates that developmental locking—the rigid canalisation of growth pathways—makes spandrels unavoidable in any complex body plan.'
          *   *Assessment:* This is where things get tricky.
          *   *Evolutionary Psychology (EP):* The 1979 paper predates the formal establishment of evolutionary psychology (Cosmides and Tooby started publishing in the late 80s/early 90s). Gould certainly criticised EP later (e.g., in "How Big is a Just-So Story?"), but the 1979 paper itself does not mention evolutionary psychology. Attributing this specific conclusion to the 1979 text is anachronistic. Furthermore, saying the critique *demolishes* EP is a matter of ongoing debate, not a settled fact established by Gould and Lewontin.
          *   *Developmental Locking/Canalisation:* The 1979 paper does discuss constraints (architectural, phyletic, developmental). They talk about allometry and growth constraints. "Canalisation" is a Waddington term. "Developmental locking" sounds like later Evo-Deo terminology (e.g., Gerhart and Kirschner's "facilitated variation" or similar). While Gould was interested in development (leading to his work on heterochrony and Evo-Deo), framing this specific sentence as part of the 1979 summary is slightly off. It conflates their general structuralist stance with specific later terminology. The concept is consistent with their view, but the phrasing suggests a formal demonstration within the 1979 paper that isn't quite there in those terms.

  3.  **Drafting the Response (incorporating constraints):**
