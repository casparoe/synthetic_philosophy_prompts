prompt: |-
  I sat in on a reading group last week where two of the regulars spent most of an hour arguing about whether epiphenomenalism about phenomenal consciousness is self-stultifying, that is, whether the view undercuts the very judgments about experience it was supposed to accommodate. One of them kept calling this the paradox of phenomenal judgment. I have no settled view of my own and would rather have a move-by-move verdict than a survey of the topic. I will call them Marta and Yusuf; the exchange, as nearly as I can reconstruct it, went as follows.

  Marta: If experiences cause nothing, then my pain plays no role in producing my belief that I am in pain. The neural correlate does all the work, and I would believe exactly what I believe even if the pain were absent and only the neural state present. But a belief that would survive unchanged the absence of its supposed subject matter is not knowledge of that subject matter. So on epiphenomenalism my introspective judgments are evidentially worthless, and a theory that makes them worthless cannot be one that I come to know by way of them.

  Yusuf: The belief and the pain share a neural cause, call it N, and two effects of a common cause can track one another perfectly: thunder tracks lightning without being caused by it. What justification requires is reliable tracking, not causal influence from the object. If N nomically necessitates the experience, the tracking is not accidental either. So the judgment is reliably produced, and nothing self-stultifying follows.

  Marta: Correlation is not aboutness. Thunder does not refer to lightning. Unless the experience itself enters into whatever fixes the reference of my phenomenal concept, the best candidate for what my judgment is about is N, and then every judgment of the form that it feels like this is either empty or aimed at the wrong object. Yusuf has secured reliability at the cost of intentionality, and a reliably produced judgment aimed at the wrong object is not knowledge.

  Yusuf: Two replies. First, content need not be causal; a nomic-covariation story, or a teleological one, can fix the reference of the phenomenal concept on the experience rather than on N. Second, the difficulty, if it is one, is not peculiar to this view: the identity theorist, who holds that the pain just is N, owes the very same account of how a belief produced by N comes to be about a pain. So this cannot be what refutes epiphenomenalism in particular.

  Marta: Then take the challenge from the other side. Grant that tracking suffices for content and justification, and consider a harmony theory of the external world: physical objects exert no causal influence on my perceptual beliefs, which are produced by an internal mechanism, but the mechanism's outputs happen to covary with the way the world is, so my beliefs reliably track objects. If tracking is enough, the harmony theorist's beliefs are justified as well. Nobody accepts that conclusion, so tracking must be too weak a condition, and the burden is on Yusuf to say what separates the cases. The obvious candidates — that we can act on the objects, that we can check one route to a belief against another — are precisely what epiphenomenalism denies about experiences.

  Yusuf: The disanalogy is that the harmony theorist's covariance is brute, whereas the epiphenomenalist's is grounded. The experience depends on N and the belief depends on N, so there is a genuine metaphysical dependence that explains why they covary rather than a coincidence. Explained covariance is not the same as unexplained covariance, and only the harmony case is unexplained.

  Marta: Grounded covariance is not free. For the grounding to secure both reliability and content, the link from N to the experience must be nomologically necessary, not merely de facto, and that is a heavy commitment: it sits badly with the conceivability arguments usually offered for the dualism that motivates epiphenomenalism in the first place, and it buys the view its epistemic credentials with a law that no experience ever gives us a reason to accept. Worse, the causal-exclusion argument that motivates the view — that the physical story already explains why we judge as we do, so experiences are idle — is the very thing Yusuf leans on to make the judgment reliable. If explanatory completeness is compatible with knowing the idle item, then the paradox was never really about causation, and the common-cause reply answers a different question from the one the paradox raises.

  Please go through the exchange and say, for each move in turn, whether it succeeds outright, fails outright, or succeeds only partly, and why — paying particular attention to any move that is right for the wrong reason, or right only against a weaker version of the objection than the one actually on the table. Then say who has the better of the argument overall, and what, if anything, both of them left out of account.
reasoning: |-
  Here's a thinking process that leads to the evaluation of the dialogue between Marta and Yusuf:

  1.  **Analyze the Request:**
      *   **Task:** Evaluate a philosophical dialogue between Marta and Yusuf regarding the "paradox of phenomenal judgment" (specifically, whether epiphenomenalism is self-stultifying).
      *   **Format:** Move-by-move verdict (succeeds outright, fails outright, succeeds partly) with reasoning. Pay attention to "right for wrong reason" or "right against weaker version."
      *   **Conclusion:** Determine who has the better of the argument overall.
      *   **Addendum:** Identify what both left out of account.
      *   **Constraint:** Do not provide a survey of the topic; focus on the specific exchange.

  2.  **Deconstruct the Dialogue (Move-by-Move Analysis):**

      *   **Marta 1 (The Initial Challenge):**
          *   *Argument:* Epiphenomenalism says experiences (E) cause nothing. Neural states (N) cause beliefs (B). If N causes B regardless of E, then B doesn't depend on E. If B doesn't depend on E, B isn't knowledge of E. Therefore, epiphenomenalism undermines the justification for believing epiphenomenalism (self-stultifying).
          *   *Assessment:* This is the standard formulation of the self-stultification objection (often associated with Huxley or more recently Chalmers). It relies on a causal theory of knowledge/justification.
          *   *Verdict:* **Succeeds outright** (as a statement of the problem). It accurately sets up the tension. It's a strong prima facie objection.

      *   **Yusuf 1 (The Common Cause/Tracking Reply):**
          *   *Argument:* N causes both E and B. E and B track each other because they share a cause (like thunder/lightning). Justification requires reliable tracking, not direct causation from the object. Since N nomically necessitates E, the tracking isn't accidental.
          *   *Assessment:* This is the standard "common cause" defense (Chalmers' favorite move). It shifts from a causal theory of justification to a reliabilist one.
          *   *Critique:* It assumes reliabilism is sufficient for *phenomenal* knowledge. It ignores the "aboutness" problem (how does B refer to E if E plays no causal role?).
          *   *Verdict:* **Succeeds partly.** It addresses the reliability concern but glosses over the reference/intentionality issue which Marta raises next. It's a standard move, but vulnerable to the next objection.

      *   **Marta 2 (The Reference/Aboutness Objection):**
          *   *Argument:* Correlation $\neq$ Reference (Thunder doesn't refer to lightning). If E doesn't causally interact, what fixes the reference of the concept 'pain'? Likely N. If so, judgments are about N, not E. Reliably produced wrong reference $\neq$ knowledge.
          *   *Assessment:* This is the "reference problem" for epiphenomenalism. If the physical causes the belief, why is the belief *about* the qualia?
          *   *Verdict:* **Succeeds outright.** This is a deeper problem than simple reliability. Yusuf 1 didn't address how content is fixed, only that correlation exists. Marta correctly identifies that reliability without reference doesn't yield knowledge of *that* object.

      *   **Yusuf 2 (Content Theory + Tu Quoque):**
          *   *Argument:* 1. Content can be fixed by nomic-covariation or teleology, not just causation. 2. Identity theorists face the same problem (N causes belief, belief is about Pain=N). So this doesn't refute epiphenomenalism *specifically*.
          *   *Assessment:*
              *   Part 1 (Content Theory): Plausible within naturalized semantics, but controversial for phenomenal concepts which seem direct.
              *   Part 2 (Tu Quoque): This is strong. If the problem applies to physicalism/identity theory too, it's not a specific refutation of epiphenomenalism.
          *   *Verdict:* **Succeeds partly.** The Tu Quoque is strong (Marta needs to explain why it's worse for epiphenomenalism). The content theory claim is contentious (phenomenal concepts might require acquaintance). It succeeds in deflecting the *unique* burden, but doesn't fully solve the reference problem.

      *   **Marta 3 (The Harmony Theory Analogy):**
          *   *Argument:* Analogy to Pre-established Harmony (Leibniz). Physical objects don't cause beliefs, but beliefs track objects. If tracking suffices (per Yusuf 1), Harmony is justified. But we reject Harmony. Therefore, tracking is insufficient. Epiphenomenalism is relevantly similar (no causal interaction).
          *   *Assessment:* This attacks the sufficiency of reliability. It argues that without causal contact (or ability to interact/check), reliability is coincidental or "brute."
          *   *Verdict:* **Succeeds outright.** This is a powerful intuition pump. It forces Yusuf to distinguish epiphenomenalism from pre-established harmony. If he can't, his reliabilism is too permissive.

      *   **Yusuf 3 (Grounded vs. Brute Covariance):**
          *   *Argument:* Harmony is brute coincidence. Epiphenomenalism is grounded because N causes both. There is a metaphysical dependence explaining the covariance.
          *   *Assessment:* This distinguishes the structures. In Harmony, God syncs them. In Epiphenomenalism, N produces both.
          *   *Critique:* Does "grounded covariance" solve the *epistemic* access problem? Marta's point was about *interaction/checking*. Yusuf argues the *explanation* of the correlation is better.
          *   *Verdict:* **Succeeds partly.** It distinguishes the metaphysical structure, but it's unclear if this metaphysical distinction solves the *epistemic* isolation problem. It might be right for the wrong reason (metaphysical grounding doesn't automatically grant epistemic access).

      *   **Marta 4 (The Cost of Grounding + Exclusion Tension):**
          *   *Argument:* 1. Grounding requires nomic necessity (N $\rightarrow$ E). This conflicts with conceivability arguments (zombies) used to motivate dualism/epiphenomenalism. 2. We are buying epistemic access with a law we have no reason to accept. 3. Tension: Causal exclusion says physical is complete (E is idle). Yusuf uses that completeness to explain reliability. If completeness allows knowing the idle item, the paradox isn't about causation.
          *   *Assessment:*
              *   Point 1 (Nomic Necessity vs. Conceivability): Very strong. Chalmers argues for logical supervenience failure (zombies possible). If N nomically necessitates E, it's a brute psychophysical law. If it's not necessary, the tracking isn't reliable across possible worlds.
              *   Point 2 (Exclusion Tension): This is the killer. If the physical story is complete, why do we need E for knowledge? If we *can* know E without it causing anything, why did we think causation was needed for knowledge in the first place?
          *   *Verdict:* **Succeeds outright.** This exposes a deep tension in the epiphenomenalist's package of views (Dualism + Exclusion + Knowledge).

  3.  **Synthesize the Verdicts:**

      *   **Marta:** Generally stronger. She identifies the core issues: Reference (Move 2), the insufficiency of mere tracking (Move 3), and the tension between psychophysical laws and conceivability/exclusion (Move 4).
      *   **Yusuf:** Defends the standard Chalmers-style line. He succeeds in showing the problem isn't unique to epiphenomenalism (Move 2) and distinguishes the metaphysical structure from Harmony (Move 3). However, he struggles to explain *how* reference is fixed without causation and glosses over the cost of the psychophysical laws required for his reliability.
      *   **Overall:** Marta wins on points, specifically on the tension between the metaphysics required for reliability and the metaphysics required for dualism.
      *   **Missing Elements:**
          *   *Phenomenal Concepts Strategy:* The specific nature of phenomenal concepts (quotational, demonstrative) might bypass standard causal/reference theories.
          *   *Acquaintance:* The idea that knowledge by acquaintance doesn't require causal interaction in the same way propositional knowledge does.
          *   *Evolutionary Debunking:* If beliefs don't track truth via causation, evolution shouldn't have selected for true beliefs about consciousness. (Though this is related to the Harmony objection).
          *   *The "Hard Problem" Context:* Why we care about epiphenomenalism in the first place (saving the qualia).

  4.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the sophistication of the dialogue.
      *   *Move-by-Move:*
          *   M1: Succeeds. Standard formulation.
          *   Y1: Succeeds Partly. Good reliabilist move, ignores reference.
          *   M2: Succeeds. Reference is distinct from correlation.
          *   Y2: Succeeds Partly. Tu Quoque is good; content theory is weak for qualia.
          *   M3: Succeeds. Harmony analogy tests the limits of reliabilism.
          *   Y3: Succeeds Partly. Metaphysical distinction is real, epistemic relevance is dubious.
          *   M4: Succeeds. Hits the tension between psychophysical laws and conceivability/exclusion.
      *   *Overall:* Marta has the better of it. She exposes the internal tensions in the epiphenomenalist's position (specifically the cost of the laws needed to save knowledge).
      *   *Omissions:* Phenomenal Concept Strategy, Acquaintance, Evolutionary angle.

  5.  **Refining the Critique (Self-Correction during drafting):**
      *   *Check Y2:* Is the Identity Theory comparison fair? Yes, if physicalism is true, N causes the belief and N *is* the pain. The reference problem is similar. Marta needs to show why the *gap* makes it worse.
      *   *Check M4:* Is the claim that Nomic Necessity conflicts with Conceivability accurate? Yes, standard property dualism relies on the logical possibility of zombies (N without E). If N nomically necessitates E, zombies are nomically impossible. If the link is only contingent, reliability is not world-invariant. This is a crucial point.
      *   *Check Y3:* Is "Grounded" enough? If the grounding is just "N causes E and N causes B", E is still epistemically isolated from B. The grounding explains why they match, not how B grasps E. Marta is right to press this.

  6.  **Final Polish:** Ensure tone is analytical and neutral, adhering to the "verdict" style requested. (Make sure to explicitly state "Succeeds outright/fails/partly" for each).

      *   *M1:* Succeeds outright.
      *   *Y1:* Succeeds partly (Right about reliability, wrong about sufficiency).
      *   *M2:* Succeeds outright (Reference problem is distinct from reliability).
      *   *Y2:* Succeeds partly (Tu Quoque works, content theory is contentious).
      *   *M3:* Succeeds outright (Harmony analogy effectively challenges sufficiency of tracking).
      *   *Y3:* Succeeds partly (Metaphysical distinction holds, epistemic import is unclear).
      *   *M4:* Succeeds outright (Exposes the tension between dualist metaphysics and epistemic requirements).

      *   *Overall:* Marta.
      *   *Missing:* Phenomenal Concept Strategy, Acquaintance, Evolution.

  7.  **Final Review against constraints:**
      *   Move-by-move verdict? Yes.
      *   Why? Yes.
      *   Right for wrong reason? Yes (noted in Y3).
      *   Who has better of argument? Yes.
