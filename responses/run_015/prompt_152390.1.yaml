      *   *The Tension:* Tracing bypasses the need for draftsmanship (hand-eye coordination). AI inpainting bypasses the need for textural rendering. Why is one okay and the other not?
      *   *The Defense:* Tracing requires the artist to commit to every line manually. The *kinetic* act is still human. AI generation creates pixels without human kinetic input.
