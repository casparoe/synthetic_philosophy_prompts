answer: |-
  1. Overview
  This session transforms an abstract meta-ethical problem into a procedural crisis. Students will construct a filtering mechanism to sort anonymous moral judgments, intending to separate "well-founded" views from "conditioned" ones to guide a real class decision. By the end, they will experience the impossibility of designing a neutral filter: every criterion they invent to identify "bias" will either fail to exclude anything or will implicitly privilege specific substantive moral commitments. They will see that procedural purity is an illusion; distinguishing genuine preferences from adaptive ones inevitably requires a first-order moral verdict.

  2. Materials and Advance Preparation
  One week prior, send a anonymous Google Form link. Request two entries per student: (1) A moral judgment they would defend in argument, and (2) A judgment they suspect they hold only due to upbringing/culture. Each requires a one-sentence reason. Assure them authorship is untraceable. Allow an opt-out box; if 2–3 students opt out, the pool remains sufficient (22+ cards).

  Before class, print entries on identical cardstock. Shuffle thoroughly. Prepare two sets of colored sticky dots. Prepare five "History Notes" on separate slips (e.g., "This view correlates with suburban upbringing," "This view常见 in introductory economics"). Ensure you do not record who submitted what. Bring $100 cash in an envelope to stake on the decision.

  3. The Session, Minute by Minute
  **0:00–0:05 (Setup):** Place the envelope on the table. Say: "We have $100 to donate to a charity. The recipient must be justified solely by the judgments in this deck. But we cannot use all of them. Some judgments are noise; some are signal. Your task is to invent a rule to sort them."

  **0:05–0:20 (Immersion):** Distribute three cards to each student. Ask them to read silently. Do not reveal the dual nature of the deck. Say: "Propose a test to decide which cards count. The test must be procedural, not substantive. You cannot say 'Keep cards I agree with.'"

  **0:20–0:40 (Filter Construction):** Record proposed tests on the board (e.g., 'Must cite a reason,' 'Must be consistent with other cards,' 'Must not rely on ignorance'). Vote on one test. Apply it to the deck publicly. Separate into "Count" and "Discard" piles.

  **0:40–0:50 (The Intervention):** Take five cards from the "Count" pile. Attach a "History Note" to each. Return them to the pool. Say: "New information: we now know the causal origin of these specific judgments. Does anyone move them to 'Discard' based on this history?" Watch for reversals.

  **0:50–1:05 (The Decision):** Tally the "Count" pile. If a majority of surviving cards point to a specific cause (e.g., animal welfare), donate the money there. If the pile is mixed or empty, the money goes to the department general fund. Execute the transfer promise immediately after class.

  **1:05–1:15 (Transition):** Collect the cards. Do not explain the trick yet. Ask: "How confident are you that the 'Discard' pile was actually biased?"

  4. Debrief
  **1:15–1:25 (The Reveal):** Disclose that every student submitted one "defended" and one "suspected" judgment. Reveal the sorting results. Typically, students will find they kept many "suspected" cards and discarded many "defended" ones. Ask: "Why did your neutral test fail to track the author's own confidence?"

  **1:25–1:30 (Mapping the Failures):** Connect their experience to the literature without assigning new reading.
  1.  **The Reasons Test:** If they kept cards because they had "good reasons," point out that biased judgments often have coherent reasons. The test smuggled in your shared substantive view of what counts as a "good" reason.
  2.  **The Consistency Test:** If they discarded outliers, note that moral progress often starts as inconsistency with prevailing norms. You filtered out innovation along with bias.
  3.  **The Causal History:** When you added the History Notes, few cards were likely moved. This demonstrates the genetic fallacy: knowing a view's origin rarely changes its normative weight unless you already dislike the origin.

  **1:30–1:35 (Naming the Distinction):** Now introduce the vocabulary: *adaptive preferences*, *laundering*, *endogenous preferences*. Explain that the difficulty they felt operationalizing the filter is exactly why social choice theory struggles to discount preferences without paternalism. The "neutral" procedure collapsed into a majority vote on values.

  5. Predictable Failures
  **1. The Nihilist:** A student may argue, "All judgments are biased, so the whole deck is void."
  *Handling:* Accept the premise but enforce the constraint: "The money must be spent or returned. Inaction is a decision. Propose a rule for default allocation." This forces them to acknowledge that even rejecting the data requires a normative stance.

  **2. The Detective:** Students may try to guess authors to validate/invalidate cards based on who they think wrote them.
  *Handling:* Interrupt immediately. "Authorship is epistemically inaccessible. Your test must work on the text alone. If your test requires knowing the author, it is not operational."

  **3. Majority Tyranny:** The group may devise a test that conveniently keeps all majority-held views and discards minorities under the guise of "clarity" or "consistency."
  *Handling:* During the debrief, highlight the correlation between the "Count" pile and the room's demographic majority. Ask: "Did we filter bias, or did we filter dissent?"

  **4. Indecision:** The group may fail to agree on any test.
  *Handling:* Impose a vote on the tests themselves. "We will vote on the filter, then apply it." This demonstrates that the criterion for validity is itself a political choice, reinforcing the lesson.

  6. What This Cannot Do
  This activity reproduces the *operational* difficulty of distinguishing preferences from biases, but it cannot reproduce the *structural* stakes. In the classroom, the "bias" is low-stakes cultural conditioning. In the real world, adaptive preferences often result from oppression, starvation, or systemic exclusion, where the cost of misidentification is human suffering, not a $100 donation.

  Furthermore, the exercise focuses on individual judgments. It cannot show how collective decision procedures themselves shape preferences over time (the feedback loop). You must supply this in lecture: explain that while procedural neutrality is impossible, some filters are less paternalistic than others. The activity proves the problem exists; the lecture must justify why we bother solving it despite the impossibility of a perfect solution.
