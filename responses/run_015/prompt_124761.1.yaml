answer: |-
  # Workshop Title: The Weight of Names
  **Duration:** 75 Minutes
  **Participants:** 16 Undergraduate Students
  **Topic:** Ethics of Commemorative Public Space (Corrective Justice vs. Mnemonic Displacement)

  ## I. Materials & Setup
  *   **The Map:** One large printed map (A1 size) placed on a central table. It depicts the town of **Vance Creek**.
      *   **Center:** Vance Plaza (The Square).
      *   **North:** Vance Bridge (Connects North District to Center).
      *   **Perimeter:** Vance St (North), Vance Ave (South), Vance Blvd (East), Vance Way (West).
  *   **Symbolic Weight Tokens:** 12 heavy red poker chips or wooden discs.
      *   *Initial Placement:* 6 on Plaza, 2 on Bridge, 1 on each of the 4 Streets.
  *   **Role Cards:** 16 cards (see Distribution below).
  *   **District Scorecards:** 4 cards (one per District) with a "Comfort Threshold" and a "Veto Button" (red card).
  *   **Planner's Ledger:** A sheet tracking the "Two-Change Limit."
  *   **Archivist's Envelope:** Sealed, containing the "Displacement Clause."
  *   **Timer:** Visible to all.

  ## II. Role Distribution (16 Students)
  1.  **City Planner (1 Student):** Holds the Planner's Ledger. Constraint: May authorize a maximum of **two** renaming/relocation actions.
  2.  **City Archivist (1 Student):** Holds the Archivist's Envelope. Possession of hidden documents regarding the legacy weight.
  3.  **North District Delegation (4 Students):** Residential/Industrial. High stake in the Bridge and North St. *Comfort Threshold: Low.*
  4.  **South District Delegation (4 Students):** Commercial. High stake in Plaza and South Ave. *Comfort Threshold: Medium.*
  5.  **East District Delegation (3 Students):** Academic/Institutional. Stake in Plaza and East Blvd. *Comfort Threshold: High.*
  6.  **West District Delegation (3 Students):** Historic/Preservation. Stake in West Way and Plaza. *Comfort Threshold: Medium.*

  ## III. Minute-by-Minute Timeline

  ### 00:00 – 00:10: Introduction & Context (10 mins)
  *   **Facilitator:** Briefly sets the scene. Vance Creek is divided. Colonel H. Vance founded the town (economic boom) but authored the "North Wall" policy (systemic exclusion of the North District).
  *   **Goal:** The city must achieve **City Stability** (Unanimous Vote) to unlock funding. However, each District independently calculates its own **Comfort Score**. If any District is below their Comfort Threshold, they play the Veto Card, killing Stability.
  *   **Task:** Rearrange the map tokens and rename sites to maximize Stability while respecting the Planner's 2-Change Limit.

  ### 00:10 – 00:25: Role Briefing & Caucus (15 mins)
  *   Students break into role groups.
  *   **Districts:** Review their Scorecards.
      *   *North:* Veto if Bridge or North St Weight > 2 Tokens.
      *   *South:* Veto if Plaza Weight > 4 Tokens.
      *   *East/West:* Veto if their specific Street Weight > 3 Tokens.
  *   **Planner:** Reviews the 2-Change Limit. (Changing a name = 1 Change. Moving a statue/token = 1 Change).
  *   **Archivist:** Reads the **Displacement Clause** (Secret). *Do not share yet.*
      *   *Clause:* "Symbolic Weight is conserved. If a site named 'Vance' is renamed, the Tokens on that site cannot be removed. They must be redistributed equally among all *remaining* sites still bearing the name 'Vance'."

  ### 00:25 – 00:45: Negotiation & Map Manipulation (20 mins)
  *   All students gather around the map.
  *   **Phase 1 (10 mins):** Open debate. Districts state demands. North usually demands the Bridge and Plaza be cleared. South wants to keep Plaza for tourism.
  *   **Phase 2 (10 mins):** The Planner attempts to draft a solution.
      *   *Critical Moment:* If the group agrees to rename **Vance Plaza** (the obvious first step), the Planner removes the name label.
      *   **Archivist Intervention:** The Archivist must now open the Envelope and enforce the Displacement Clause. The 6 Tokens on the Plaza are removed and distributed among the remaining 5 "Vance" sites (Bridge + 4 Streets). Each gains +1.2 Tokens (round up to 2 for physical simplicity).
      *   *Result:* The Bridge now holds 4 Tokens. The North District immediately hits their Veto Threshold (Limit was 2).
      *   The Planner has used 1 of 2 Changes. They have 1 Change left. They cannot rename the Bridge *and* the Streets.
      *   **Chaos:** The group realizes clearing the center flooded the periphery.

  ### 00:45 – 00:55: Voting & Scoring (10 mins)
  *   **Stability Vote:** Requires 16/16 "Yes."
  *   **Comfort Calculation:** Each District calculates their total Token load.
      *   If North District sees 4 Tokens on the Bridge, they play the Red Veto Card.
      *   Stability Score = 0.
  *   **Facilitator Freeze:** If the group deadlocks (likely), freeze the room at minute 55. Do not let them solve it perfectly. The friction is the data.

  ### 00:55 – 01:15: Debrief & Concept Mapping (20 mins)
  *   **Step 1: The Feeling of Migration (5 mins)**
      *   Ask North District: "When the Plaza was cleared, how did the physical weight on your Bridge change?"
      *   Ask Planner: "Did your constraint feel like bureaucracy or protection?"
      *   **Concept:** Define **Mnemonic Displacement**. Removing the central marker did not erase the history; it concentrated it onto the infrastructure used by the marginalized (the Bridge).
  *   **Step 2: Corrective Justice vs. Displacement (10 mins)**
      *   Map the decisions:
          *   *Renaming Plaza:* Corrective Justice (Addressing the central symbol).
          *   *Token Migration:* Mnemonic Displacement (The legacy didn't vanish; it shifted).
          *   *Planner's Limit:* State Legitimacy/Constraint (The system cannot process total erasure).
      *   Ask: "Why did the Archivist hold the rule secret?" (History often reveals consequences only after action is taken).
  *   **Step 3: Limitations of the Model (5 mins)**
      *   **Facilitator Admission:** "This map is clean. It uses tokens. In reality, commemorative space involves **somatic trauma**. A student from the North District doesn't just see a 'Vance Bridge' token; they feel a physiological spike in cortisol every time they cross it because their ancestors were barred from that crossing. The map cannot reproduce the *body's* memory of space. I am telling you this now because the game makes it look like a math problem. It is not. It is a bodily experience."

  ## IV. Predictable Failure Mode & Redirection
  *   **The Failure:** The group will almost certainly prioritize renaming **Vance Plaza** in the first 5 minutes. It is the most visible symbol. They will treat it as a "win."
  *   **The Crash:** Once the Archivist redistributes the tokens, the North District will Veto. The Planner will realize they only have 1 Change left but need to fix the Bridge *and* the Streets. Paralysis sets in. The group will blame the Planner or the Archivist.
  *   **The Redirect:** If the group begins shouting or blaming roles, the Facilitator must intervene at Minute 40:
      *   *"Pause. Look at the tokens. You treated the Plaza as a container for the history. The rules just told you the history is a fluid, not a container. If you cannot rename the Bridge because you spent your Change on the Plaza, how do you lower the weight on the Bridge without renaming it?"*
      *   *Hint:* This forces them to consider **contextualization** (adding plaques, art) vs. **removal**, or realizing that partial removal creates greater inequality.

  ## V. Role Card Details (Embedded Conceptual Machinery)

  **City Planner Card:**
  *   **Rule:** You may authorize exactly **two** changes.
  *   **Definition of Change:** Renaming a site OR Moving a Statue/Token.
  *   **Constraint:** You cannot break the "Conservation of Weight" if the Archivist invokes it.
  *   **Goal:** Achieve Unanimous Stability.

  **City Archivist Card:**
  *   **Rule:** You hold the "Displacement Clause."
  *   **Instruction:** Do not reveal this clause until the group attempts to rename **Vance Plaza**.
  *   **Clause Text:** "Colonel Vance's legacy is structural, not local. If the central name is removed, the public memory associated with it does not vanish. It redistributes equally to all remaining sites bearing his name. Tokens must be moved physically to reflect this."
  *   **Goal:** Ensure the historical record remains consistent, even if it complicates the peace.

  **North District Card:**
  *   **Stake:** You live under the Bridge. You use the North St.
  *   **Threshold:** Your Comfort Score is 0 if Token Count on Bridge or North St exceeds **2**.
  *   **Power:** You hold the Veto. If your Threshold is breached, City Stability is 0.
  *   **Secret:** You know the Bridge was built using unpaid labor from your district.

  **South District Card:**
  *   **Stake:** The Plaza is your economic engine.
  *   **Threshold:** Your Comfort Score is 0 if Plaza Token Count exceeds **4**.
  *   **Power:** You hold the Veto.
  *   **Secret:** You benefit from the "Founder" myth, even if the exclusion policy was wrong.

  **East/West District Cards:**
  *   **Stake:** Peripheral streets.
  *   **Threshold:** Comfort Score 0 if Street Token Count exceeds **3**.
  *   **Power:** You hold the Veto.
  *   **Secret:** You are indifferent to the history but fear property value loss if "chaos" ensues.

  ## VI. Facilitator Notes on "Mnemonic Displacement"
  *   **Definition for Debrief:** Mnemonic Displacement occurs when the removal of a dominant monument does not erase the ideology it represented, but rather forces that ideology to inhabit smaller, less regulated, or more functional spaces (like a bridge or a street sign).
  *   **The Lesson:** Corrective justice (removing the statue) can inadvertently increase the density of the harmful memory in the spaces where marginalized people actually live and work.
  *   **The Trap:** The workshop is designed so that "winning" (Unanimous Stability) is mathematically impossible if the Plaza is cleared first. This forces the students to confront the inadequacy of binary "Keep/Remove" frameworks.

  ## VII. Honest Admission of Limitation
  *   **What the Map Hides:** The map is static and silent. It cannot reproduce **Intergenerational Trauma** or **State Legitimacy**.
  *   **Verbal Supply:** During the debrief, the facilitator must state: "In this game, a Veto stops funding. In reality, a Veto looks like protest, civil unrest, or the quiet erosion of trust in government. The map makes the stakes look financial. They are actually existential. The 'Tokens' are not points; they are daily micro-aggressions experienced by bodies moving through space. We simulated the geometry of memory, but not the pain of it."
