      *   *The Philosopher of Biology:* They might actually agree with the user (process ontology), but they will attack the metaphysical framing. They might ask why we need "identity" at all if organisms are processes. They might challenge the biological realism of "identical DNA" (epigenetics, mitochondrial DNA, etc.).
      *   *The Ethicist:* They will care about the *consequences*. If identity isn't fixed by gametes, does that change the moral status of embryos? Does it make IVF selection weird? If I select Embryo A over Embryo B, but they turn out to be "the same person" under your theory, what does that mean for harm/benefit?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Kripkean Intuition):* "It just *feels* wrong." Need to make this sound technical. Focus on the *Necessity of Origins* argument.
      *   *Objection 2 (The Sorites/Slippery Slope):* If 99% DNA is you, is 98%? Where is the cutoff? This is the classic attack on qualitative criteria.
      *   *Objection 3 (The Biological Reality):* DNA isn't the whole story. Epigenetics, mitochondrial DNA, uterine environment. The "blueprint" metaphor is outdated. (Phil Bio).
      *   *Objection 4 (The Ethical Consequence):* Non-Identity Problem implications. If I delay conception, is it the same child? Does that dissolve parental obligation? (Ethicist).
      *   *Objection 5 (Transworld Identity):* How do we track you across worlds? If the gametes are different, what makes it *you* in that world? (Metaphysician).
      *   *Objection 6 (The Clone/Twin Confusion):* Clones aren't identical persons. Why is a delayed conception different from a clone? (Metaphysician/Bio).
      *   *Objection 7 (Process Ontology):* If organisms are processes, isn't the *start* of the process essential? (Phil Bio turning the user's weapon against them).

  4.  **Refining the "Voice" and Scoring:**
      *   *Metaphysicians:* Use words like "rigid designator," "haecceity," "modal intuition," "transworld identity."
      *   *Phil Bio:* Use words like "epigenetics," "developmental systems," "token vs. type," "reductionism."
      *   *Ethicist:* Use words like "moral status," "harm," "selection," "counterfactuals."
      *   *Scoring:* Needs to reflect how hard it is to answer *in a defense setting*. High lethality = threatens the core thesis. High likelihood = they will definitely ask.

  5.  **Drafting the Comebacks:**
      *   Must be under 90 seconds spoken. Needs to be punchy.
      *   Must acknowledge the weak spot (intellectual honesty wins points).

  6.  **Developing the "Nightmare Question":**
      *   What kills this thesis? Usually, it's the *No-Branching Constraint* or the *Intrinsicness Principle*. If identity depends on external factors (like which sperm won the race), it's not intrinsic. But if it depends on DNA, it's not unique (twins). The nightmare is combining these: "If two qualitatively identical conceptions happen simultaneously, are they both you?" (The Reduplication Argument).

  7.  **Review against Constraints:**
