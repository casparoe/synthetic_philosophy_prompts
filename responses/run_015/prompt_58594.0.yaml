answer: |-
  Here is your defense prep sheet. I have tailored the objections to the specific philosophical commitments of your committee members. The "Voice" column mimics how they actually speak in seminars.

  ### MA Thesis Defense Q&A Prep Sheet

  | A - Objection in Their Voice | B - Who & Why | C - Threat Level (1-5) | D - Your 90-Second Reply | E - Weak Spot / Concession |
  | :--- | :--- | :--- | :--- | :--- |
  | **"You're treating 'you' as a qualitative pattern, but persons are historical entities. If I burn the Mona Lisa and paint a perfect forgery, it's not the Mona Lisa. Why is a human different? What grounds the *thisness* (haecceity) of you if not the specific causal chain of *that* sperm and *that* egg?"** | **Metaphysician 1 (Kripkean).**<br>They care about rigid designation. They think you are confusing *type* identity (same DNA) with *token* identity (same object). | **5**<br>(Core Thesis Attack) | "The art analogy fails because artworks are defined by their history of production, but organisms are defined by functional continuity. I'm not arguing I'm a pattern; I'm arguing I'm a *process* that could have been initiated by a numerically distinct but qualitatively identical cause. The 'thisness' is grounded in the spatio-temporal continuity of the developing organism, not the microscopic gateway of fertilization." | **Concede:** You can't fully solve the haecceity problem. <br>**Pivot:** Argue that biological identity tracks *viability and continuity*, not historical atoms. |
  | **"Okay, let's grant your 'Delayed-Conception Swap.' But this invites a Sorites paradox. If 99% identical DNA is you, is 90%? 50%? If there's no sharp cutoff, then identity becomes vague. But metaphysical identity cannot be vague. So your qualitative criterion fails."** | **Metaphysician 2 (Kripkean).**<br>They want to trap you in a vagueness argument to show your criteria isn't *necessary* or *sufficient*. | **4**<br>(Logical Trap) | "I accept that identity isn't vague, but our *epistemic access* to it is. I'm not proposing a slippery slope where 50% DNA is you. I'm proposing a threshold of *developmental equivalence*. Just as 'heap' is vague but 'one grain' isn't, the threshold is where the developmental trajectory becomes indistinguishable in terms of psychological continuity potential." | **Concede:** You don't have a precise percentage cutoff. <br>**Defense:** Argue precision isn't required for the *modal claim* that origins aren't *strictly* essential. |
  | **"You're relying on a 'genetic blueprint' metaphor that biology abandoned twenty years ago. DNA isn't a recipe; it's a switchboard dependent on epigenetic markers, mitochondrial DNA, and uterine environment. Even with the same nuclear DNA, the 'delayed' embryo is biologically distinct. So your 'qualitative identity' is scientifically false."** | **Philosopher of Biology.**<br>They think your metaphysics is built on outdated reductionist biology. | **4**<br>(Factual Undercutting) | "I agree DNA isn't a full blueprint. That's why my argument includes 'continuous pregnancy and early environment.' I'm not arguing for genetic determinism; I'm arguing for *developmental system* identity. If the epigenetic and environmental inputs are sufficiently continuous, the numerical difference in gametes is biologically irrelevant to the resulting organism's identity." | **Concede:** You are simplifying the biology for the sake of the metaphysical point. <br>**Defense:** The *token* gamete difference remains irrelevant even if epigenetics vary slightly. |
  | **"If you're right, the Non-Identity Problem dissolves. If I delay conception for a child, and it's still the *same child* under your view, then I haven't harmed a 'possible' person, I've affected an *actual* one. Does this mean parents have obligations to specific genetic profiles rather than specific children? How does this change IVF ethics?"** | **Ethicist.**<br>They care about the practical implications of your theory on moral responsibility. | **3**<br>(Implication Check) | "It shifts the focus from 'which embryo' to 'which life.' If identity tracks qualitative continuity, then selecting for health isn't choosing a *different person*, it's ensuring the *same person* has a better life. This strengthens parental responsibility: you aren't just selecting a token; you are curating the conditions for a specific qualitative existence." | **Concede:** This is a radical shift from standard bioethics. <br>**Defense:** It aligns better with how parents actually view pregnancy (hoping for *a* healthy baby, not *this specific* zygote). |
  | **"You use twins and clones to argue token gametes don't matter. But we intuitively know a clone is not *you*. If a clone has your DNA and similar environment, why is it a sibling and not you? What distinguishes your 'Delayed Swap' from a Clone Case?"** | **Metaphysician 1 (Kripkean).**<br>They will try to show your criteria makes clones identical to originals, which is absurd. | **5**<br>(Reductio Ad Absurdum) | "Timing and continuity. A clone is a *restart* of the process later in time. My 'Delayed Swap' happens at the *same* conceptual window with continuous uterine occupancy. Identity requires spatio-temporal continuity of the life process. The clone branches off; the delayed-swap occupies the same slot in the causal flow." | **Concede:** The line is thin. <br>**Defense:** Emphasize the *continuity of the womb environment* as the differentiator, not just DNA. |
  | **"If organisms are processes, as I argue, then the *initiation* of the process is essential to the process. You can't have *this* race without *this* starting gun. If you change the gametes, you change the starting event. So even on process ontology, origin essentialism holds."** | **Philosopher of Biology.**<br>They might agree with your conclusion but hate your reasoning, or turn your 'process' argument against you. | **3**<br>(Theoretical Consistency) | "A process is defined by its trajectory, not its atomic starting point. If I run a race, and we restart the gun 10 milliseconds later with the same runner, it's the same race. The 'start' is a fuzzy temporal region, not a point-instant. If the biological process unfolds continuously, the precise millisecond of sperm-egg fusion isn't the essence." | **Concede:** Process philosophy can support essentialism. <br>**Defense:** Argue for a 'thick' conception of the start, not a 'thin' instantaneous one. |
  | **"On your view, identity depends on extrinsic facts. If a second identical conception happened elsewhere, are you both? If identity is intrinsic, how can the existence of a duplicate elsewhere affect whether *this* baby is you?"** | **Metaphysician 2 (Kripkean).**<br>The "Intrinsicness Principle." They want to show your theory makes identity depend on what happens in other rooms/worlds. | **4**<br>(Metaphysical Coherence) | "I reject the Intrinsicness Principle for biological entities. Biological identity is relational and historical. Whether I am 'me' depends on my causal history, which is extrinsic. If a duplicate exists, we have a branching problem, but that doesn't invalidate the claim that *without* the duplicate, the delayed swap is still me." | **Concede:** You accept extrinsic determination of identity. <br>**Defense:** Most biological kinds are extrinsically defined (e.g., 'predator', 'offspring'). |

  ### The Nightmare Question
  *(Pray this doesn't come up, but if it does, do not bluff.)*

  **The Question:**
  "Consider the **Simultaneous Duplication Case**. In World A, you are conceived normally. In World B, two qualitatively identical conceptions happen *at the exact same time* in the same womb (superfecundation of identical zygotes). Both develop. Which one is *you*? If you say 'both,' you violate the necessity of distinctness. If you say 'neither,' you violate your qualitative criterion. If you say 'one,' which one and why? If you can't answer this, your qualitative criterion doesn't fix identity."

  **How to Survive It:**
  1.  **Don't Panic:** Acknowledge this is the "Reduplication Argument" and it is the standard counter to qualitative identity theories.
  2.  **The Move:** Deny the possibility of the case being *metaphysically* relevant to *actual* identity.
  3.  **The Line:** "In the actual world, this case doesn't occur. My thesis is about *modal* claims regarding *actual* origins. In the hypothetical branching case, I would concede that qualitative criteria alone fail without a 'no-branching' constraint. I am willing to add a 'no-branching' clause to my theory: Qualitative similarity fixes identity *provided no competing candidate exists.* This saves the theory from the duplication objection while keeping Origin Essentialism false."
  4.  **Why this works:** It shows you know the literature (the "no-branching" constraint is standard in psychological continuity theories) and you are willing to refine your thesis rather than die on a hill.

  ### General Defense Advice for This Committee
  *   **To the Kripkeans:** Do not try to beat them at intuition pumps. They will always win on "it feels wrong." Beat them on **theoretical utility**. Ask: "What work does Origin Essentialism do for us that my view doesn't, other than satisfying a modal intuition?"
  *   **To the Phil Bio:** Do not claim to know more biology than them. Use phrases like "Biologically speaking, correct me if I'm wrong, but..." They want to see you respect the science while doing metaphysics.
  *   **To the Ethicist:** Keep bringing it back to **harm**. If Origin Essentialism is true, we treat embryos as sacred tokens. If it's false, we treat them as potential lives. Ask them which framework leads to better ethical outcomes.

  Good luck. You know the material. Just keep your answers under 90 seconds.
