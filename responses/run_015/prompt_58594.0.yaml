          1.  *Analytic Metaphysician 1 (Kripkean):* Believes token gametes fix identity.
          2.  *Analytic Metaphysician 2 (Kripkean):* Same as above.
          3.  *Philosopher of Biology:* Organisms as processes, skeptical of metaphysical necessity.
          4.  *Ethicist:* Cares about IVF, embryo selection, parental responsibility.
      *   **Format:** Table with columns (Objection, Who/Why, Lethal/Likely Score, Short Reply, Weak Spot/Concession). Plus a "Nightmare Question" section.
      *   **Tone:** Specific, actionable, realistic to the committee members' perspectives (not generic).
      *   **Constraints:** 6-7 objections, 90-second comebacks, specific scoring.

  2.  **Deconstruct the Argument & Committee Dynamics:**
      *   *The User's Position:* Anti-essentialism about origins. Identity is determined by qualitative properties (genetic blueprint + developmental continuity) rather than historical/token properties (specific sperm/egg).
