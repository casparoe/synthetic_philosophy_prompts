  2.  **Deconstruct the Philosophical Debate (Particularism vs. Generalism):**
      *   *Generalism:* Moral judgment requires subsumption under general principles. Principles are exceptionless (or at least robustly defeasible in a structured way). Supervenience (same non-moral facts = same moral value) is key. Teachability requires rules.
      *   *Particularism (Dancy et al.):* Moral reasons are holistic. A feature (e.g., "it causes pain") can be a reason *for* an action in one context (surgery) and *against* in another (torture). There are no exceptionless principles. Judgment is perceptual/contextual, not algorithmic.
      *   *Key concepts to translate:* Moral Reason, Moral Principle, Holism/Variable Valence, Supervenience.

  3.  **Drafting the Translation (The "EBM/Clinical Reasoning" Layer):**
      *   *Moral Principle:* Needs to map to a Clinical Decision Rule (CDR) or a Guideline. But stronger. Not just "If CRB-65 > 2, admit." More like "Pain is always bad." In EBM terms: A predictor with a Likelihood Ratio of infinity or zero, or a causal mechanism that never changes direction.
      *   *Moral Reason:* A clinical feature or predictor variable. (e.g., "Chest pain," "Age > 50").
      *   *Reason Flipping (Variable Valence):* Effect Modification / Interaction Terms. In one subgroup, X increases risk; in another, X decreases risk. Or, a sign that has +LR in one context and -LR in another.
      *   *Generalist Demand:* We need a validated CDR that works across all populations (external validity) without needing uncodifiable "gestalt" adjustments.
      *   *Particularist Claim:* The "effect" of a variable depends entirely on the interaction with other variables in the specific patient context. You can't write a CDR that covers all interactions.

  4.  **Evaluating the Four Guesses:**

      *   *1. Modality (Necessity vs. Empirical):*
          *   User asks: Are moral principles necessary truths, not just empirical associations?
          *   Analysis: Yes. Generalists often want logical or conceptual necessity, not just high statistical regularity. EBM is inherently inductive/probabilistic. Morality often claims normative force ("ought"), not just predictive power ("is").
          *   Verdict: This is a real gap. EBM can't capture "ought."

      *   *2. Outcomes (Consequentialism):*
          *   User asks: Does "reason" = "predictor of good outcome"? Does this force consequentialism?
          *   Analysis: Yes. EBM is utilitarian by nature (maximize health outcomes). Deontology (duties, rights) doesn't fit well into "predictors of outcome." A "right" isn't a variable that predicts better mortality; it's a constraint.
          *   Verdict: User is smuggling in consequentialism. The translation breaks here for non-consequentialist ethics.

      *   *3. Teaching/Criticism (Gestalt vs. Rules):*
          *   User asks: We teach gestalt without rules. Does the Generalist claim collapse?
          *   Analysis: Generalists argue gestalt *is* internalized rules (pattern recognition based on prior rule application). Particularists say gestalt is perceptual skill independent of rules. M&M conferences rely on shared standards (principles), even if unwritten.
          *   Verdict: Generalist claim doesn't collapse, but shifts. They argue your "gestalt" is actually tacit knowledge of principles, or that without *some* standards, M&M is just opinion.

      *   *4. Supervenience (Alike in non-moral = alike in moral):*
          *   User asks: Is this "features fully determine the label"?
          *   Analysis: Yes. This is the Supervenience thesis. If Patient A and Patient B are identical clinically, they must get the same diagnosis/treatment.
          *   Verdict: Load-bearing. Both sides usually accept supervenience, but disagree on *how* the features determine the label (via principles vs. holistic context).

  5.  **Addressing the "Janus Facts":**
      *   *Example:* Funny joke = reason to tell (usually), reason to shut up (funeral).
      *   *Translation:* Effect modification. "Humor" interacts with "Setting."
      *   *Listing them:* Does listing make them principles?
      *   *Analysis:* Particularists say no. A list of exceptions is not a principle. A principle says "Always X." A list says "X, unless A, B, C... Z, and maybe Q." If the list is open-ended, it's not a rule.
      *   *Verdict:* It's the same thing (variable valence). Listing them doesn't save Generalism if the list is potentially infinite or requires judgment to apply.

  6.  **Refining the Tone and Vocabulary:**
      *   Use terms like *predictor variable, effect modification, interaction term, clinical decision rule (CDR), external validity, calibration, discrimination, tacit knowledge, pattern recognition.*
      *   Avoid philosophical jargon (supervenience, deontology, ceteris paribus) unless defined in clinical terms.
      *   Be blunt about where EBM fails (the "Is-Ought" problem).

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain "reason flipping" clearly? *Correction:* Use the concept of a predictor variable changing direction of association based on context (interaction).
