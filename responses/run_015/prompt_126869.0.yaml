  8.  **Final Polish:** Organize by the user's structure (Translation -> The 4 Guesses -> Janus Facts). Ensure the "Blunt Truths" are highlighted. (Proceed to generate output based on this thought process).

  *(Self-Correction on "Supervenience"):* I need to be careful. Both particularists and generalists usually accept supervenience. The fight is about *generalizability*. I need to make sure I don't imply particularists reject supervenience. They reject *principles* as the bridge.

  *(Self-Correction on "Outcomes"):* I need to make sure I don't say EBM *is* consequentialism, but that the *vocabulary* forces a consequentialist framing.

  *(Refining the "Principle" definition):* In EBM, a guideline is a principle. But a moral principle is stronger. It's a "perfect CDR." I need to emphasize the "exceptionless" or "defeasible only by higher order rule" aspect.

  *(Final check on the "Janus" list):* If I write down "Don't tell jokes at funerals," is that a principle? Particularists say that's just another particular judgment. A principle would be "Maximize humor unless it causes pain." But "pain" is also Janus. I need to explain the regress problem.

