      *   **Modern Scepticism (Descartes, etc.):** How do I know I'm not dreaming right now? Sensory evidence is unreliable. Requires an external anchor (which might not exist). Key point: Epistemological crisis, search for certainty.

  3.  **Map to Narrative Tools:**
