      *   *Refining the "Ontology":* It's not just essentialism; it's a specific *temporal* ontology. The nation exists in a "sacred time" (Eliade) distinct from "profane historical time."

  8.  **Final Structure:**
      *   Introduction: The Paradox of the Archive vs. The Museum.
      *   I. Ontological Commitments: The Nation as Trans-Historical Substance.
      *   II. The Theory of Tradition: Authenticity as Purity, not Function.
      *   III. Conditions of Belonging: Narrative Immersion vs. Procedural Assent.
      *   IV. Internal Tensions: The Tripartite Conflict.
      *   V. The Constructivist Alternative: Policy Based on Acknowledged Invention.
      *   Conclusion: From Fate to Choice.

