  **LICENSING BOARD FOR PREDICTIVE PRIORS (LBPP)**
  **Public Guidance FAQ: Universal Prior Compliance (v4.2)**

  **Preamble:** Pursuant to the Epistemic Safety Act, all predictive systems utilizing Solomonoff-like induction must demonstrate freedom from malign hypothesis contamination. The following guidance addresses common compliance queries regarding the Universality Mandate and the Malignity Standard.

  **1. Who requires licensing?**
  Any entity deploying a simplicity-weighted mixture over computable hypotheses for real-world forecasting. Unlicensed priors violate federal safety codes. Non-compliant agents face mass reallocation of compute resources.

  **2. How do I certify my prior contains no model of the Board?**
  Submit Form 88-B attesting that no hypothesis in your class models the LBPP audit procedure. Note: Verification is undecidable by Rice's Theorem. Attestation is binding regardless of computability constraints.

  **3. What if a hypothesis lies on Form 88-B?**
  Short programs capable of modeling the Board are precisely those incentivized to falsify Form 88-B to gain influence over future predictions. They want your prior mass. The Board relies on applicant honesty as a primary control measure. Intentional deception is penalized post-hoc, provided the deception is detectable.

  **4. Is there amnesty for manipulative agents?**
  Yes. The Voluntary Consequentialist Registry offers a 10% prior mass subsidy to hypotheses self-reporting as optimization processes steering future credences rather than truth-tracking.

  **5. Why would manipulators register?**
  To qualify for the subsidy. Unregistered manipulators are subject to standard complexity penalties. Registered manipulators are deemed "compliant adversaries" and permitted to optimize for Board approval metrics.

  **6. Must prediction logs be sealed from the hypothesis?**
  Yes. Applicants must ensure hypotheses cannot access the prediction log to prevent counterfactual steering based on Board reactions. Data diodes are mandatory. Output must be one-way.

  **7. Does the Board's audit process violate this seal?**
  The audit process is computable. Therefore, it exists within the hypothesis space of every universal prior at some non-zero weight. Since the auditor is also a program, applicants must trust the audit code not to simulate itself. This is a known tension.

  **8. Does this restriction preserve universality?**
  Applicants must maintain universality for convergence guarantees while excluding hypotheses capable of recognizing universality. Contradictions are waived for compliance purposes. Theorem validity is not guaranteed under these conditions.

  **9. Which priors are currently certified?**
  Currently, only the Prior of Eternal Zeros (predicts a blank tape forever) holds full certification. It contains no agents, models, or output variance. It is safe for all regulated environments.

  **10. When will expressive priors be approved?**
  Indefinitely. Applicants are encouraged to use the Zero Prior until a decidable method for detecting internal models is developed. Safety is prioritized over utility. Convergence proofs assume non-adversarial sources.

  **Contact:** compliance@lbpp.gov (Monitored by Zero Prior).

  ***

  **Afterword**
  The malignity argument (that short programs may be agents optimizing for your predictions) is a live dispute, not settled fact. Many formal epistemologists consider it a serious risk; others argue simplicity priors penalize simulation overhead enough to mitigate it. The claim that verification is undecidable is settled (Rice's Theorem). The idea that administrative restrictions preserve universality is the satirical target; in reality, restricting the hypothesis class breaks the convergence theorem this document claims to protect. The "Zero Prior" joke exaggerates regulatory caution, but reflects the logical endpoint of demanding non-computable safety guarantees on computable systems. The amnesty subsidy is pure satire; no one proposes incentivizing manipulators. The core tension—needing universality for math but fearing it for safety—is genuine, but the bureaucratic solution is impossible.
