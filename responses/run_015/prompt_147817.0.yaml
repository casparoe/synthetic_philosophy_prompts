answer: |-
  Your numbers are correct.
  *   **Closed:** $0.5 \times 15 + 0.5 \times 30 = 22.5$. Switching adds nothing.
  *   **Open (Swap unless £40):** Outcomes are £20, £10, £40, £40 (each prob 0.25). Average = £27.5.
  *   **Gain:** Information is worth exactly £5 in this setup.

  Here is the plan for your 70-minute session, structured around your five constraints.

  ### 1. The Order: Closed First, Then Open
  **Decision:** Run the **Closed Case** first, then the **Open Case**.

  **Why:** Your worry is that the symmetry argument ("envelopes are indistinguishable") will cement the misconception that information can't help. I argue you should weaponize that misconception.
  *   **Phase 1 (Closed):** You want them to *commit* to the symmetry argument. Have them vote, argue, and calculate the EV (22.5). Let them feel the security of the logic: "Physical symmetry implies probabilistic symmetry."
  *   **Phase 2 (The Turn):** Introduce peeking. Ask: "Does looking inside break the physical symmetry of the envelopes?" (Answer: No). "So does the EV change?" (Most will say No).
  *   **Phase 3 (Open):** Calculate the EV (27.5).
  *   **Pedagogical Payoff:** The shock that the EV changed *despite* the physical symmetry remaining intact is the only thing that will force them to update their mental model. If you start with Open, they learn "Peeking helps." If you start with Closed, they learn "Symmetry holds... until information intervenes." The second lesson is the one that transfers to epistemology and decision theory.

  **What the first case must establish:**
  It must establish the **baseline indifference**. They must be convinced that *without* information, switching is mathematically neutral. This makes the *with* information gain measurable. If they think switching might be good in the closed case, the open case gain gets muddied.

  ### 2. The Carrying Example: The Three-Value Ladder
  **Decision:** Your **£10/£20 vs £20/£40** overlap setup is the correct carrying example. Do not use disjoint sets (e.g., £10/£20 vs £40/80).

  **Why:**
  *   **What it must have:** It must have an **ambiguous signal**. In your setup, seeing £20 is ambiguous (it could be the top of the lower pair or the bottom of the higher pair). This forces the student to weigh probabilities rather than just identifying the state.
  *   **What it must lack:** It must not allow **omniscience**. In a disjoint setup, seeing £20 tells you *exactly* which pair you have. That turns the problem into a trivial "switch if low, keep if high" algorithm. It hides the mechanism of *partial* information.
  *   **The Overlap:** The overlap is where the work happens. It ensures that peeking doesn't solve the game perfectly; it just shifts the odds. This mirrors real-world decision-making (noisy signals) better than the disjoint version (perfect signals).
  *   **Decoy?** Do not stage both. The disjoint version is a distraction that suggests peeking is valuable *because* it identifies the pair, whereas the lesson you want is that peeking is valuable *because* it updates the probability of the other envelope. Stick to the ladder.

  ### 3. The Misconception Map
  Here is where each misconception enters and how/when to defuse it.

  *   **(c) "Infinite expectations are the culprit."**
      *   **When:** **Minute 0 (Pre-emptive).**
      *   **Defusal:** "We are banning infinity today. The money is bounded. If you raise this, I will treat it as a refusal to engage with the bounded model."
      *   **Why:** You are right; it's a dead end for this group. Kill it immediately so they know the paradox survives even with finite money.

  *   **(a) "It's just an algebra slip (X vs 2X)."**
      *   **When:** **During the Closed Case (Minute 15).**
      *   **Defusal:** Do not introduce the $0.5(2X) + 0.5(X/2)$ formula yourself. If a maths student offers it, say: "In this bounded version, we don't need variables. We have four specific scenarios. Calculate the average of those."
      *   **Why:** The algebraic error is a symptom of the unbounded version. In your bounded version, case enumeration makes the error impossible to make. Don't teach the disease if you're teaching the vaccine.

  *   **(b) "The Symmetry Objection."**
      *   **When:** **Transition from Closed to Open (Minute 30).**
      *   **Defusal:** Let them hold this. When you introduce peeking, ask: "The envelopes are still physically identical. The coin is still fair. Why would the EV change?" Let them struggle. Then show the calculation. The defusal is the calculation itself: "Symmetry is physical; Expectation is informational."

  *   **(d) "If peeking helps, you'd pay to peek, which is absurd."**
      *   **When:** **After Open Case Calculation (Minute 50).**
      *   **Defusal:** **Validate this.** "You are right. It is not absurd. Information has value. In this specific bounded game, the right to peek is worth up to £5."
      *   **Why:** You want them to see that the "paradox" isn't that switching is magic, but that *information* breaks symmetry. This is a feature, not a bug.

  *   **(e) "So it was a fallacy all along and there's nothing left."**
      *   **When:** **Conclusion (Minute 65).**
      *   **Defusal:** "The fallacy was thinking symmetry forbids updating. The lesson remains: rational agents should pay for information that breaks state-indistinguishability, even if the physical setup hasn't changed."
      *   **Why:** Prevents the "gotcha" ending. Leaves them with a positive principle (Value of Information) rather than just a negated error.

  ### 4. The Check: The Rigged Coin
  Your fee idea tests arithmetic, not structure. Use this instead:

  **The Question:** "I keep the £10/£20 and £20/£40 pairs. But I rig the first coin. There is a **99% chance** the pair is £10/£20, and only a **1% chance** it is £20/£40. You peek and see **£20**. Do you switch?"

  **Why this distinguishes understanding:**
  *   **Slogan Learner:** Says "Yes, peeking showed me I might have the low envelope, switching gains expected value." (They apply the previous result blindly).
  *   **Structure Learner:** Says "No. If I see £20, it is overwhelmingly likely to be the *top* of the £10/£20 pair because that pair is so much more common. Switching would likely give me £10."
  *   **The Point:** This forces them to realize the gain from peeking depended on the **prior probability** of the pairs (the 50/50 split in the main session), not just the act of looking. It tests if they understand *why* the £27.5 worked without requiring them to compute Bayes.

  ### 5. What to Refuse
  Be explicit. Write these on the board if necessary.

  1.  **"I am refusing to solve the unbounded paradox."**
      *   *Script:* "There is a version of this problem where the money can be any amount. That version breaks expected value theory entirely. We are not doing that. We are studying how information works in finite games."
  2.  **"I am refusing to teach you Bayes' Theorem."**
      *   *Script:* "You can solve this entire session with addition and division. If you try to use conditional probability formulas, you will slow yourself down. Use the four-scenario enumeration."
  3.  **"I am refusing to discuss the metaphysics of 'knowledge'."**
      *   *Script:* "We are not asking what 'knowing' the amount means. We are asking what the cash value of that knowledge is. Keep it to the EV."

  ---

  ### Session Timeline (70 Minutes)

  *   **00–05: Setup & Bans.**
      *   Introduce the bounded game (£10/£20 vs £20/£40).
      *   State the three refusals (Infinity, Bayes, Metaphysics).
  *   **05–25: The Closed Case.**
      *   Ask: "You hold an envelope. No peeking. Switch or stay?"
      *   Elicit the Symmetry Argument.
      *   Calculate EV together (£22.5). Confirm switching adds £0.
      *   *Goal:* Cement the baseline.
  *   **25–35: The Turn.**
      *   "Now I let you peek. You see the amount. Then decide."
      *   Ask: "Does this change the EV?" (Vote).
      *   Highlight the tension: Envelopes are still physically symmetric.
  *   **35–60: The Open Case.**
      *   Walk through the 4 scenarios (Pair 1/Get 10, Pair 1/Get 20, etc.).
      *   Calculate the strategy: Swap on 10, Swap on 20, Keep on 40.
      *   Reveal EV (£27.5).
      *   Discuss: Why did symmetry break? (The overlap at £20 creates an asymmetric signal).
      *   Validate the "Pay to Peek" intuition (Info is worth £5).
  *   **60–65: The Check.**
      *   Pose the **Rigged Coin (99% low pair)** scenario.
      *   Take votes. Ask a maths student and a philosophy student to justify.
  *   **65–70: Conclusion.**
      *   Summarize: The paradox isn't that switching is magic; it's that we underestimate the value of partial information in overlapping distributions.
      *   Dismiss.

  This plan respects their level, avoids the infinite trap, and uses the bounded version to teach a positive lesson about information rather than just negating an algebraic error.
