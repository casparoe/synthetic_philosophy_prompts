prompt: |-
  You are a professional philosopher of politics and an intellectual historian with particular expertise in conservative political thought and epistemology. Before you answer, take a few moments to brainstorm the conceptual distinctions you will need, then proceed step by step and think carefully. Write in polished British English throughout.

  Analyse the revolutionary dissolution of the French guilds and corporate bodies in 1791 — the dismantling of the intermediate associations of craft, locality, and religious life that Burke defended as little platoons — through the combined lens of Burkean conservatism and Chesterton's fence. Treat the fence not as a reactionary slogan but as an epistemic principle concerning the inarticulable, distributed knowledge embedded in inherited institutions, knowledge that is rarely codified and is easily destroyed by deliberate reform.

  In your analysis:
  1. Map the episode onto the theory. What did the revolutionaries face according to Burke's defence of prescription and organic social knowledge? What options were available, and what should they have done by the lights of Burkean conservatism and the fence principle?
  2. Identify which features of the dissolution the theory explains well — for example, the loss of tacit craft knowledge, the disruption of local welfare structures, or the overreach of abstract rational planning — and which features it misses or misdescribes, such as the real economic exploitation and exclusion that existed within the old corporate order.
  3. Run the analysis in reverse: what does the episode reveal about Burkean conservatism and the fence principle? Is it a confirmation, an anomaly that exposes a blind spot (for instance, that inherited structures can preserve injustice in ways the principle cannot distinguish), or a case the theory never genuinely anticipated?
  4. Be disciplined about the mapping. Specify precisely who counts as the actor, what counts as the institutional fence, and where the theory is silent rather than forcing it to speak. Stick to well-known facts of the revolutionary legislation and its immediate social effects; do not invent contested historical details.

  Please ensure your response is rigorous, avoids any bibliographic references, citation lists, or requests for further reading, and remains in British English throughout.
