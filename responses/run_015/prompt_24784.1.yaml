      *   Make sure to answer "What do I lose?" (You lose a heuristic for trusting your future rational self, but you keep logical consistency).
      *   Check the user's Premise 3. Is it actually $P(H) = P(H|E)$? Yes, if $P(E)=1$. This is math. Don't let them drop math. Drop the normative principle (Reflection).

