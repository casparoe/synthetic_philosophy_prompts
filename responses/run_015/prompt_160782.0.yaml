answer: |-
  This is a sophisticated request. You are asking to reverse-engineer the *pramāṇa* debates into a functional epistemology for a modern agent. You want the *specification* for a belief-auditing system, using the Indian debates as stress-tests rather than doctrine.

  Here is the spec. It is organized by **Desiderata** (what the system must do), **Conflicts** (where the requirements fight each other), and **Evaluation** (how the standard schools score).

  ### Part 1: The Desiderata (The Spec)

  To audit your beliefs, your theory of knowledge sources needs to satisfy these six constraints.

  **1. The Non-Accidentality Condition (The "Lucky Guess" Filter)**
  *   **Requirement:** A valid source must have a stable causal connection to the truth. It cannot produce true belief merely by chance.
  *   **The Worry:** If I guess the lottery numbers and win, I had a true belief, but I didn't *know* them. A theory that counts lucky guesses as knowledge is useless for auditing because you can't replicate the success.
  *   **Case Coverage:** *Lucky guesses* (fail); *Thermometers* (pass, if calibrated); *Dreams* (fail, no stable connection to waking reality).
  *   **Implementation:** You must be able to describe *why* the source tends to produce truth, not just that it did so this time.

  **2. The Error Theory Requirement (The "Rope-Snake" Filter)**
  *   **Requirement:** The theory must explain *how* error happens without discarding the source entirely. It needs to specify "defect conditions" (*doṣa*).
  *   **The Worry:** If perception gives you a snake, and it turns out to be a rope, was perception invalid? If you say "yes," you lose perception as a source. If you say "no," you need to explain why it failed *this time*.
  *   **Case Coverage:** *Rope-snake* (dim light is the defect); *Dreams* (sleep is the defect); *Liar testimony* (speaker's intent is the defect).
  *   **Implementation:** Every source must come with a list of "failure modes." If you can't list how a source fails, you can't trust when it succeeds.

  **3. The Distinctness vs. Parsimony Rule (The "List Length" Filter)**
  *   **Requirement:** Do not multiply sources beyond necessity. A new *pramāṇa* is only warranted if it yields knowledge that cannot be generated by a combination of existing sources.
  *   **The Worry:** If "Analogy" (*upamāna*) is just Inference plus Memory, calling it a separate source is bloated. But if "Absence" (*anupalabdhi*) is just Perception, why does it feel cognitively different to see a pot vs. see *no* pot?
  *   **Case Coverage:** *Analogy* (Cow-like animal: is it inference from description?); *Absence* (No pot: is it seeing the floor, or cognizing the lack?); *Chatbots* (Is it testimony or inference?).
  *   **Implementation:** Before adding a source, ask: "Can I get this result using Source A + Source B?" If yes, merge them.

  **4. The Justification vs. Causation Split (The "Internal Audit" Filter)**
  *   **Requirement:** The theory must distinguish between the *cause* of the belief (neural/psychological) and the *warrant* for the belief (why you are allowed to hold it).
  *   **The Worry:** I am caused to believe I am in pain. I am also caused to believe the earth is round (via school). The causes are different. For auditing, I need to know which warrants I can cite to others or rely on for action.
  *   **Case Coverage:** *Pain* (Causal and Warrant are identical); *Wiki article* (Cause is reading, Warrant is aggregated expertise); *Calculator* (Cause is electronics, Warrant is mathematical proof).
  *   **Implementation:** For every belief, tag it: "I feel this" vs. "I can prove this."

  **5. The Actionability Clause (*Arthakriyā*)**
  *   **Requirement:** Knowledge must enable successful navigation of the world. If acting on a belief consistently leads to failure, the source is suspect.
  *   **The Worry:** This is the Buddhist pragmatist challenge. Truth isn't just "matching reality"; it's "working."
  *   **Case Coverage:** *Thermometer* (If I dress for 70° and freeze, the instrument failed); *Fat man inference* (If I watch him all night and he doesn't eat, the inference failed).
  *   **Implementation:** Treat "successful action" as the final validation step for any source.

  **6. The Chain-of-Custody Rule (The "Two-Step" Filter)**
  *   **Requirement:** In multi-step knowledge (Testimony → Inference), the final status is limited by the weakest link.
  *   **The Worry:** If I learn X from a liar (Testimony fails), but I infer Y from X logically, do I know Y? No. The input was poisoned.
  *   **Case Coverage:** *Wiki/Anonymous* (Testimony without a vouchable author); *Two-step cases* (Learn X, infer Y).
  *   **Implementation:** Trace the belief back to a foundational source (Perception or validated Testimony). If the chain breaks, the belief is un-audited.

  ---

  ### Part 2: The Conflicts (Jointly Unsatisfiable Requirements)

  You suspected the Novelty requirement clashes with Re-checking. You are correct. Here are the three major tensions you will face in building this spec.

  **1. Novelty (*Anadhigata*) vs. Validation (Re-checking)**
  *   **The Conflict:** Classical Nyaya often defines knowledge (*pramā*) as *novel* cognition. If you already know the stove is off, checking it again doesn't generate "knowledge" in the strict sense; it generates memory or confirmation.
  *   **Why they clash:** If you require novelty, you cannot count "verification" as a knowledge event. But for a modern auditor, verification is the *most* important knowledge event.
  *   **Resolution:** You must drop strict Novelty. Modify the spec to allow **Validated Memory**. Re-checking is not generating *new* data; it is upgrading the *confidence status* of old data.
  *   **Verdict:** **Drop Novelty.** It is useless for belief auditing.

  **2. Internal Certainty vs. External Reliability**
  *   **The Conflict:** Some sources feel certain but are unreliable (Dreams, Introspection about motives). Some are reliable but feel opaque (Thermometers, Chatbots).
  *   **Why they clash:** If you prioritize "feeling sure" (Self-luminosity/*svaprakāśa*), you trust dreams and pain equally. If you prioritize "external reliability," you trust the thermometer over your feeling of "not being cold."
  *   **Resolution:** Prioritize **External Reliability** for external facts; reserve **Internal Certainty** only for qualia (pain, annoyance).
  *   **Verdict:** **Split the domain.** Do not use the same standard for "I am in pain" and "There is a snake."

  **3. Parsimony vs. Phenomenology**
  *   **The Conflict:** The Materialists (Charvaka) say only Perception exists. Inference is just mental perception. Testimony is just hearing (perception). This is parsimonious. But it fails the Phenomenology test: trusting a friend *feels* different than seeing a fire.
  *   **Why they clash:** Reducing everything to Perception makes the list short (good), but it blinds you to the specific failure modes of Testimony (lying) vs. Perception (illusions).
  *   **Resolution:** Keep sources distinct if they have distinct **Failure Modes**.
  *   **Verdict:** **Distinctness wins.** You need separate buckets for Perception and Testimony because they break in different ways.

  ---

  ### Part 3: The Killer Requirement

  If you apply only one of these desiderata strictly, it destroys the most candidate lists.

  **The Killer: The Non-Accidentality Condition.**

  *   **Why:** It kills **Perception-Only (Charvaka)**. Perception is frequently accidental (mirages, dreams, rope-snakes). Without Inference to cross-check Perception, you cannot filter error.
  *   **Why:** It kills **Naive Testimony**. If a liar tells the truth by accident, Perception-Only and naive Testimony counts it as knowledge. Non-Accidentality rejects it because the *process* wasn't reliable.
  *   **Why:** It kills **Dreams**. Dreams produce vivid "perceptions," but they lack a causal link to external objects.
  *   **Why:** It kills **Lucky Guesses**.

  If you enforce Non-Accidentality, you are forced into a **Pluralist System (Nyaya/Buddhist hybrid)**. You *need* Inference to validate Perception. You *need* a credibility check for Testimony. You cannot survive with just one source.

  ---

  ### Part 4: Scorecard of Standard Approaches

  Here is how the classical "lists" score against your desired auditing spec.

  | System | Sources | Novelty Required? | Error Theory? | Handles Instruments? | Audit Score |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Charvaka (Materialist)** | Perception only | No | Weak (Error is just bad perception) | **Fail** (Instruments require inference) | **D** (Too brittle for modern life) |
  | **Buddhist (Dignāga)** | Perception, Inference | Yes | Strong (*Arthakriyā*) | **Pass** (If instrument yields successful action) | **B+** (Pragmatic, but Novelty hurts re-checking) |
  | **Nyaya (Classic)** | Perception, Inference, Testimony, Comparison | Yes | Very Strong (Defect conditions) | **Pass** (Instruments are extended perception/inference) | **A-** (Best error theory, Novelty is annoying) |
  | **Prābhākara Mīmāṃsā** | 5 (adds Postulation) | Yes | Weak (Error is "non-apprehension") | **Pass** | **C+** (Postulation is useful, but error theory is vague) |
  | **Your Spec (Proposed)** | Perception, Inference, Testimony, (Instrument-Hybrid) | **No** | Strong (Reliability + Defect) | **Pass** (Explicitly handled) | **A** (Optimized for auditing) |

  ---

  ### Part 5: Applying the Spec to Your Hard Cases

  Here is how you use this spec to audit the specific scenarios you listed.

  **1. The Chatbot / Wikipedia (Anonymous Testimony vs. Inference)**
  *   **Audit:** A chatbot has no agent to vouch for truth (fails Testimony credibility). It predicts tokens based on patterns (Inference).
  *   **Verdict:** Treat as **Probabilistic Inference**.
  *   **Action:** Do not trust it as Testimony ("Someone knows this"). Trust it only as a draft for your own Inference ("This pattern suggests X, let me verify"). Wikipedia is **Aggregated Testimony**. Trust depends on the "Chain-of-Custody" (citation trail). No citations = Un-audited.

  **2. The Thermometer / Calculator (Instruments)**
  *   **Audit:** Is the instrument the source? No. The source is **Perception of the Display + Inference of Calibration**.
  *   **Verdict:** Hybrid. You perceive the number; you infer the temperature based on the warrant that the device is calibrated.
  *   **Action:** If you haven't checked the calibration (battery, recent test), the belief is un-audited.

  **3. The Fat Man (Postulation / *Arthāpatti*)**
  *   **Audit:** "He is fat but doesn't eat by day." You conclude "He eats at night."
  *   **Verdict:** This is **Inference**, not a separate source. Premise 1: Fat requires caloric surplus. Premise 2: Surplus not gained by day. Conclusion: Surplus gained at night.
  *   **Action:** Valid, provided Premise 1 is biologically sound.

  **4. Absence (No pot on the floor)**
  *   **Audit:** Do you perceive the floor, or the absence?
  *   **Verdict:** Treat as **Perception with Expectation**. You perceive the floor *plus* a cognitive expectation of a pot that is unmet.
  *   **Action:** Valid, but subject to attention defects (you missed the pot because you weren't looking).

  **5. Two-Step Cases (Testimony → Inference)**
  *   **Audit:** Friend says "It's raining" (Testimony). You infer "The grass is wet" (Inference).
  *   **Verdict:** The source of "Grass is wet" is Inference, but the *premise* is Testimony.
  *   **Action:** If the friend is a liar, the Inference is logically valid but unsound. The belief is un-audited. **The chain is only as strong as the weakest link.**

  **6. Dreams vs. Perception**
  *   **Audit:** Both feel like Perception.
  *   **Verdict:** Apply the **Error Theory / Defect Condition**. Sleep is a known defect condition for sensory cognition. Waking is the baseline.
  *   **Action:** Tag all dream-content as "Unverified Simulation" until correlated with waking Perception.

  **7. Re-checking the Stove (Novelty Conflict)**
  *   **Audit:** You believe the stove is off. You check again.
  *   **Verdict:** Under your spec, this is **Validation**, not New Knowledge. It upgrades the confidence level of the Memory.
  *   **Action:** Essential for safety. Do not discard because it isn't "new."

  ### Summary Recommendation

  To build your auditing tool:
  1.  **Adopt the Nyaya List (Perception, Inference, Testimony)** but drop **Comparison** (fold into Inference) and **Postulation** (fold into Inference).
  2.  **Add "Instrumental Hybrid"** as a sub-category of Perception/Inference requiring calibration warrants.
  3.  **Reject Novelty.** Allow for Validated Memory.
  4.  **Enforce Non-Accidentality.** If you can't explain *why* the source is reliable, tag the belief as "Opinion."
  5.  **Use "Successful Action" as the final test.** If believing it doesn't help you navigate, discard it.

  This gives you a system that is rigorous enough to filter internet noise but flexible enough to handle modern tools.
