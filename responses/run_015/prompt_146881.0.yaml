answer: |-
  # Handout: Mapping the Moral Landscape
  **Seminar:** Metaethics & Normative Theory  
  **Topic:** Particularism vs. Generalism (Beyond the Labels)

  ## Part 1: Settled vs. Contested
  Before using the decision tree, note where the field actually stands. Do not treat the "textbook" definition of particularism as the consensus.

  *   **Settled:** Almost everyone agrees context matters. A lie told to save a life is different from a lie told to cheat. The debate is not *whether* context matters, but *how* it matters (metaphysically and epistemically).
  *   **Contested:** 
      1.  **The Nature of Reasons:** Does a feature (e.g., "causing pain") carry its moral valence with it wherever it goes (Generalism), or does the context determine its valence (Particularism)?
      2.  **The Role of Principles:** Are principles the *source* of moral truth, or merely *summaries* of past judgments?
      3.  **Modulation vs. Holism:** (Crucial Distinction) Most students conflate these. 
          *   *Modulation:* The reason exists and is negative, but its *weight* shifts due to context.
          *   *Holism:* The reason's *existence* or *valence* shifts due to context.

  ## Part 2: The Decision Tree
  Answer these four questions based on your intuitions about concrete cases (e.g., "causing physical pain"). Do not worry about which philosopher holds which view.

  **ROOT:** *Consider the natural feature "causing physical pain."*

  **Q1. Valence Invariance:**  
  Is causing pain *always* a moral consideration **against** an action (even if outweighed), or can it sometimes count **in favor** of an action?  
  *   **(A) Always Against** → Go to Q2.  
  *   **(B) Can Favor** → Go to Q3.

  **Q2. Reason Holism (Existence):**  
  *(For those who said "Always Against")*  
  Can there be a context where causing pain is **morally inert** (counts for nothing), or is it always a negative reason that must be outweighed?  
  *   **(A) Always a Negative Reason** → Go to Q4.  
  *   **(B) Can Be Inert** → Go to Q4.

  **Q3. Reason Holism (Existence):**  
  *(For those who said "Can Favor")*  
  When pain stops counting against, does it cease to be a reason entirely (inert), or does it immediately flip to being a positive reason?  
  *   **(A) Can Be Inert** → Go to Q4.  
  *   **(B) Must Flip (No Inert State)** → **Leaf 6**.

  **Q4. Reason Modulation:**  
  Does the *weight* of the reason (how much pain matters) change based on the **gestalt of the context**, or is the weight fixed by the feature itself (only changed by competing reasons)?  
  *   **(A) Weight is Fixed** → Go to Q5.  
  *   **(B) Weight Modulates** → Go to Q5.

  **Q5. Principle Necessity:**  
  Could a perfectly moral agent make correct judgments in every case without grasping any general principles?  
  *   **(A) No (Principles Necessary)** → **Leaf 1, 2, 4, or 7**.  
  *   **(B) Yes (Principles Unnecessary)** → **Leaf 3, 5, or 8**.

  ---

  ## Part 3: The Leaves (Positions & Commitments)

  ### Leaf 1: Strict Generalism (Rossian)
  *   **Path:** Invariant (A) → No Holism (A) → No Modulation (A) → Principles Necessary (A).
  *   **The View:** Features have fixed valence and fixed weight. Principles are constitutive laws of morality.
  *   **Most Awkward Commitment:** You must explain away apparent valence switches (e.g., painful surgery) as merely "outweighed" rather than genuinely good, which can feel like verbal gymnastics.

  ### Leaf 2: Moderate Generalism (Weighted Principlism)
  *   **Path:** Invariant (A) → No Holism (A) → Modulation (B) → Principles Necessary (A).
  *   **The View:** Pain is always bad, but context changes *how bad* intrinsically. Principles are needed to track these weight-shifts.
  *   **Most Awkward Commitment:** You must posit principles complex enough to encode contextual weighting without collapsing into particularism.

  ### Leaf 3: Contextualist Intuitionism
  *   **Path:** Invariant (A) → No Holism (A) → Modulation (B) → Principles Unnecessary (B).
  *   **The View:** Pain is always bad and weight shifts, but we perceive this directly without principles.
  *   **Most Awkward Commitment:** You risk making moral competence seem like a mysterious faculty inaccessible to moral education or argument.

  ### Leaf 4: Moderate Particularism (Principle-Based)
  *   **Path:** Variable (B) → Holism (A) → Modulation (B) → Principles Necessary (A).
  *   **The View:** Reasons shift valence/existence, but we still need principles to navigate the shifts (e.g., "Pain is bad *unless* in context C").
  *   **Most Awkward Commitment:** You claim to be a particularist while relying on principles that are specific enough to handle every context, which looks like generalism in disguise.

  ### Leaf 5: Radical Particularism (Dancy-Style)
  *   **Path:** Variable (B) → Holism (A) → Modulation (B) → Principles Unnecessary (B).
  *   **The View:** Reasons are holistic (context-dependent); principles are at best summaries, at worst misleading.
  *   **Most Awkward Commitment:** You must explain how moral learning and disagreement are possible without appeal to shared general standards.

  ### Leaf 6: The Binary Switcher (Unattractive)
  *   **Path:** Variable (B) → No Holism (B) → [Modulation Irrelevant] → [Principles Irrelevant].
  *   **The View:** Pain is either fully negative or fully positive; it is never inert and never weighted.
  *   **Most Awkward Commitment:** You cannot account for cases where pain is present but morally irrelevant (e.g., minor pain in a high-stakes trade-off), forcing a "good/bad" dichotomy on nuanced cases.

  ### Leaf 7: Exceptionist Generalism (Unexplored/Redundant)
  *   **Path:** Invariant (A) → Holism (B) → No Modulation (A) → Principles Necessary (A).
  *   **The View:** Pain is always a negative reason *except* when it is inert. Principles list the exceptions.
  *   **Most Awkward Commitment:** This is logically unstable; if a feature can be inert due to context, it behaves holistically, making the "Invariant" claim at Q1 misleading.

  ### Leaf 8: Chaotic Particularism (Incoherent)
  *   **Path:** Variable (B) → Holism (A) → No Modulation (A) → Principles Unnecessary (B).
  *   **The View:** Reasons flip valence randomly or without contextual pattern, and no principles help.
  *   **Most Awkward Commitment:** This denies the supervenience of the moral on the natural; it makes moral judgment indistinguishable from arbitrary preference.

  ---

  ## Part 4: Logical Space Analysis

  ### Indistinguishable Pairs
  *   **Leaf 2 (Moderate Generalism) vs. Leaf 4 (Moderate Particularism):**  
      These are notoriously hard to separate in practice. If a Generalist allows enough "modulation" and "exception clauses," their principles become so context-laden they look like Particularist summaries. The difference often collapses into a verbal dispute over the definition of "principle."

  ### Empty & Problematic Spots
  *   **Leaf 7 (Exceptionist Generalism):** *Unattractive/Redundant.*  
      This spot is rarely occupied because it tries to have it both ways. If you admit a feature can be inert due to context (Holism), you have already conceded the core Particularist insight, making the "Invariant Valence" claim technically true but philosophically empty.
  *   **Leaf 8 (Chaotic Particularism):** *Incoherent.*  
      This spot is empty for good reason. It violates the supervenience constraint (no moral difference without a natural difference). No serious metaethicist occupies this leaf.
  *   **The "Invariant + Holism" Tension:**  
      Notice that answering "Invariant" at Q1 and "Holism (Inert)" at Q2 creates tension. If pain can be inert, its *contribution* to the moral sum is not invariant, even if its *sign* is. This suggests the Q1/Q2 split is not perfectly orthogonal, which is a genuine philosophical problem in the literature.

  ### A Note on Modulation vs. Holism
  Most textbooks collapse Modulation (weight change) and Holism (existence/valence change). This tree treats them separately (Q2 vs Q4). This is the most fertile ground for current research. If you find yourself at **Leaf 2**, you are arguing for a view that is often ignored: that reasons are invariant in existence but highly sensitive to context in weight, without needing strict principles to codify that weight.
