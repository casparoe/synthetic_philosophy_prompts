answer: |-
  Here are 8 interview questions designed to press the evaluativist view, complete with anticipated follow-ups based on the standard moves evaluativists make in the literature.

  ### 1. The Asymbolic Report
  **Question:** Let's start with the hardest case for your view: pain asymbolia. These patients report the sensory location and intensity of pain perfectly but say, "It doesn't bother me." If evaluativism is true and the badness is *in* the phenomenal character, shouldn't their report be, "I feel the sensation, but it doesn't seem bad"? Instead, they say it doesn't bother them. Why should we interpret their report as a change in *motivation* rather than a change in the *experience itself*?

  **Follow-up (If she says the representational content remains intact but the conative response is severed):**
  "So you're drawing a line between the experience *telling* them something is bad and them *caring* that it's bad. But phenomenologically, if I don't care, in what sense am I still experiencing it *as* bad? Isn't 'experiencing-as-bad' just a fancy way of saying 'minding'?"

  ### 2. Experience vs. Minding (Plain Terms)
  **Question:** I want to pin down that distinction in plain terms. You say the asymbolic patient still experiences the badness but doesn't mind it. If I were that patient, what would that feel like? Can you give me an analogy outside of pain where I represent a situation as "bad" but feel zero pull to change it, without it feeling like I've changed my mind about whether it's actually bad?

  **Follow-up (If she uses an analogy like "seeing a warning light but ignoring it"):**
  "But if I see a warning light and ignore it, I still think the engine is in trouble. If the asymbolic patient thinks their body is in a 'bad way,' why don't they form the belief that they are damaged? If the experience presents the body as damaged, but they don't believe it or act on it, hasn't the evaluative content lost its grip on reality?"

  ### 3. Reasons for Analgesia
  **Question:** Let's talk about reasons. If an asymbolic patient doesn't mind the pain, do they have a reason to take an analgesic? If you say yes, where does that reason come from? If you say no, are you implying that without the suffering, there's nothing wrong with the tissue damage itself?

  **Follow-up (If she says they still have a reason because the body is objectively in a bad way):**
  "If the reason comes from the objective damage, not the pain experience, then what work is the 'badness' of the pain doing? It sounds like the pain is just a messenger. If the messenger is silenced but the reason to act remains, why say the badness is part of the *phenomenology* rather than just the *cause*?"

  ### 4. The "Work" Argument (Desire vs. Badness)
  **Question:** Here's the worry I hear from critics: If the asymbolic patient needs a separate desire or concern to explain why they *should* want the pain to stop, then the 'badness' of the pain wasn't doing the normative work—the desire was. If the badness can be present without motivating you, isn't it normatively inert?

  **Follow-up (If she argues that pain provides a *pro tanto* reason even if overridden):**
  "But if it's a reason that can be completely overridden by a lack of concern without the patient being irrational, how strong is that reason? If I can be perfectly rational ignoring the 'badness' of my pain, in what sense is it *intrinsically* bad, rather than just instrumentally useful for survival?"

  ### 5. Indifference Therapy: Treatment or Masking?
  **Question:** I want to spring a thought experiment on you. Suppose we have 'Indifference Therapy': a drug that induces temporary asymbolia. Sensory intact, no fog, you just stop caring. Is administering this drug genuinely *treating the pain*, or is it closer to a drug that makes you not mind being hurt? Does the distinction matter for your view?

  **Follow-up (If she says it is treating the pain because it removes the suffering):**
  "If it removes the suffering but leaves the sensory representation of damage, are we treating the *harm* or just the *awareness* of the harm? If I gave you a drug that made you not mind a broken leg, would you call that orthopedics or psychiatry?"

  ### 6. Indifference Therapy: Childbirth & Rationality
  **Question:** Let's make it harder. Would it be rational to take Indifference Therapy before childbirth? Many argue the pain of childbirth has meaning or value. If evaluativism is true and the pain is literally an experience of 'badness,' is it rational to chemically remove that badness, or are you blinding yourself to a genuine value?

  **Follow-up (If she says it is rational because the badness is private and optional):**
  "If it's rational to remove the badness, does that imply the badness was never really *there* in the event itself? If I can turn off the 'badness' switch without changing the birth process, doesn't that suggest the badness was a projection of my mind, not a feature of the experience?"

  ### 7. Indifference Therapy: Veridicality & Error
  **Question:** This leads to the question of error. If Indifference Therapy is rational and effective, does that mean our normal pain experience is misleading? Are we normally under the illusion that pain *must* be avoided, when really it's just a sensation we happen to care about? Does evaluativism commit you to saying normal pain is a veridical perception of value, or just a useful heuristic?

  **Follow-up (If she insists normal pain is veridical):**
  "If normal pain is veridical, then the 'badness' is real. If the drug removes the experience of badness, isn't the drug inducing a false state of mind? How can it be rational to induce a false state of mind about your own body's condition just to make labor easier?"

  ### 8. Falsification
  **Question:** To close, I want to talk about evidence. Philosophy of mind can sometimes be unfalsifiable. What specific finding—neuroscientific, clinical, or phenomenological—would force you to abandon evaluativism? If we found a neural substrate for 'sensation' and a totally distinct one for 'suffering' that could be switched independently, would that kill the view?

  **Follow-up (If she says neuroscience can't settle philosophical views):**
  "I understand, but if the view makes claims about the structure of experience, shouldn't it be constrained by the structure of the brain? If you say the badness is *inseparable* from the sensation, but we find they are separable in the brain, do you have to say the brain is lying to us about our own minds?"
