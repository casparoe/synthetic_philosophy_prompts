prompt: |-
  Last spring our regional electricity grid operator appointed me, as its external mathematics member, to the Software Assurance Board that signs off on the machine-checked proofs behind our real-time dispatch program. In five weeks the board votes on a petition I do not feel equipped to adjudicate, and I would like a draft opinion to circulate and revise beforehand.

  The petition: our proofs currently live in a constructive type theory, in which nothing counts as established unless the argument carries, at least in principle, an object one could compute. The verification team wants to admit classical reasoning — excluded middle and the full axiom of choice — into the certified library, because two lemmas needed for the next release are unavailable constructively. One is a separation argument: showing that the set of states the dispatch program can reach lies strictly on the safe side of a hyperplane in a space of a few dozen dimensions. The other is a compactness argument: upgrading a guarantee they have checked for every finite time window into a guarantee about an unbounded run. The team's case is largely practical. The classical mathematical library they wish to draw on is large, actively maintained, and already contains both lemmas; rebuilding them constructively is costed at roughly nine engineer-months, against a certification deadline the regulator will not move.

  Two difficulties I cannot resolve on my own. First, I suspect the board is being asked to make a general foundational change on the strength of two very particular needs, and that those two needs may not require the same thing, or anything like the full strength being requested; the opinion should say what each lemma actually consumes and why. Second, the board is split by an exchange nobody can referee. One engineer argues that in type theory the axiom of choice is proved rather than assumed, so the petition merely lets us invoke a theorem we already have; a colleague answers that this is exactly what makes the slogan misleading and conceals where the real difficulty lies. I believe they are talking past each other, but I cannot say which of them is confused, or in what terms.

  Please draft the opinion. It should end in a recommendation the board can vote on — admit, refuse, or admit under conditions stated precisely enough to be enforced — and it should distinguish non-constructive content that ends up inside the program we ship from non-constructive content that stays inside the argument that the program is correct, telling us whether that distinction carries weight for a certification body or is only a mathematician's comfort. Resolve the engineers' disagreement in language a board member with no mathematics beyond calculus can follow. Set out what conditions, if any, would let us keep the productive parts of the petition without conceding the principle, and say who would have to verify that those conditions are met, and when. Finally, give the strongest case for admitting classical reasoning outright, and an honest account of what a refusal would cost the team and the public beyond the nine engineer-months. I want the reasoning, not the references.
reasoning: |-
  Here's a thinking process that leads to the draft opinion:

  1.  **Analyze the Request:**
      *   **Role:** External mathematics member of a Software Assurance Board (SAB) for a regional electricity grid operator.
      *   **Task:** Draft an opinion on a petition to admit classical reasoning (Excluded Middle, Full Axiom of Choice) into a constructive type theory library used for machine-checked proofs of a real-time dispatch program.
      *   **Timeline:** Vote in five weeks.
      *   **Audience:** Board members (mixed technical/non-technical), specifically needing to resolve a dispute between engineers and explain implications to non-mathematicians.
      *   **Key Issues:**
          1.  Are the two specific lemmas (separation, compactness) actually requiring the full strength of classical logic/AC?
          2.  Resolve the engineer dispute: "AC is a theorem in type theory" vs. "That's misleading."
          3.  Distinguish between non-constructive content *in* the shipped program vs. *in* the proof of correctness. Does this matter for certification?
          4.  Recommendation: Admit, Refuse, or Admit under Conditions (precisely enforced).
          5.  Verification: Who checks conditions and when?
          6.  Strongest case for admission + honest cost of refusal (beyond 9 engineer-months).
      *   **Constraint:** Reasoning, not references. Language accessible to someone with only calculus background.

  2.  **Deconstruct the Mathematical/Technical Core:**
      *   **Context:** Constructive Type Theory (likely Coq, Agda, or Lean). In these systems, proofs are programs. To prove $\exists x, P(x)$, you must provide an $x$.
      *   **The Petition:** Add Classical Logic (LEM: $P \lor \neg P$) and Full Axiom of Choice (AC).
      *   **Lemma 1 (Separation):** Safe states vs. unsafe states separated by a hyperplane. This sounds like a geometric/optimization problem. Usually involves continuity or convexity. In constructive math, finding the hyperplane might require computing it. If it's just existence, LEM helps.
      *   **Lemma 2 (Compactness):** Finite windows $\to$ Unbounded run. This is essentially a König's Lemma or Heine-Borel type argument. Constructively, compactness is tricky. It often requires LEM or Weak König's Lemma.
      *   **The Engineer Dispute:**
          *   *Engineer A:* "AC is proved in type theory." (Refers to the *internal* logic of dependent types where $\forall x \exists y \to \exists f \forall x$ holds definitionally because the witness $y$ depends on $x$).
          *   *Engineer B:* "That's misleading." (Refers to *Classical* AC or AC that erases computational content. In constructive type theory, AC is valid *if* the choice function is computable. Classical AC allows choosing without computing. Engineer A is talking about the constructive dialectica interpretation; Engineer B is talking about the computational cost/extractability).
      *   **Extraction/Erasure:** In systems like Coq, there's a distinction between `Prop` (proofs, erased) and `Set/Type` (data, kept). If classical axioms are used only in `Prop`, they don't affect the extracted code. If they leak into `Type`, the code cannot be extracted (or becomes stuck).
      *   **Certification Implication:** If the proof uses classical axioms but they are erased before code generation, the runtime behavior is unchanged. However, the *guarantee* changes. A constructive proof guarantees we can *find* the safe state. A classical proof guarantees a safe state *exists*, but we might not know which one or how to stay there computationally. For a dispatch program, we need to *compute* the dispatch.

  3.  **Drafting - Section by Section:**

      *   **Header:** Formal memo style.
      *   **Executive Summary:** The bottom line up front.
      *   **Context:** Briefly explain the constructive vs. classical divide without jargon.
      *   **Resolving the Engineer Dispute:** This needs a clear analogy.
          *   *Analogy:* Building a bridge. Constructive = "Here is the blueprint and the materials." Classical = "A bridge *must* exist somewhere."
          *   *The AC Dispute:* Engineer A is right about the *syntax* (dependent types imply a form of choice). Engineer B is right about the *semantics* (computational content). The petition asks for *Classical* AC, which breaks the link between proof and program.
      *   **Analyzing the Lemmas:**
          *   *Separation:* Do we need to compute the hyperplane? If the dispatch algorithm uses the hyperplane, we need it constructively. If it's just a safety invariant check, maybe classical is okay *if* erased.
          *   *Compactness:* Moving from finite to infinite. This is often non-constructive. However, real-time systems are inherently finite (bounded time steps). Do we *really* need unbounded guarantees, or just "for any practical horizon"?
      *   **The Crucial Distinction (Proof vs. Program):**
          *   Does the axiom affect the *extracted code*?
          *   If axioms are in `Prop` (proof irrelevant), they vanish.
          *   If axioms are in `Type` (data relevant), code generation fails or relies on oracles.
          *   *Certification View:* Regulators care about runtime behavior. If axioms are erased, runtime is safe. But the *strength* of the guarantee is weaker (existence vs. construction).
      *   **Recommendation:** "Admit under Conditions." Blanket admission is dangerous. Specific axioms for specific lemmas is better.
      *   **Conditions:**
          1.  Axioms restricted to `Prop` (erased).
          2.  Specific axioms only (not full classical library).
          3.  Independent audit of the erasure.
      *   **Cost of Refusal:** Beyond 9 months. Risk of delay, loss of confidence, potential for "hacky" workarounds that are less safe than clean classical proofs.
      *   **Strongest Case for Admission:** Mathematical maturity, leveraging existing verified libraries (less risk of new bugs in math), focus on system logic rather than foundational rebuilding.

  4.  **Refining the Tone:**
      *   Needs to be authoritative but collaborative.
      *   Avoid heavy symbolism.
      *   Address the "Calculus-level" board member.
      *   Ensure the distinction between "proof inside the computer" and "code running the grid" is crystal clear.

  5.  **Self-Correction/Nuance Check:**
      *   *Correction on AC:* In Coq/Agda, the "Axiom of Choice" is often derivable for constructive existence. The petition asks for *Classical* Choice (independent of constructive existence). I need to make sure I don't validate Engineer A too much. Engineer A is technically right about *constructive* choice, but wrong that it covers the petition's request. Engineer B is right that the petition changes the computational meaning.
      *   *Compactness:* In real-time systems, "unbounded run" is theoretical. The system restarts or has a maximum integer time. I should question if the lemma is even necessary in its current form. But for the opinion, I must address the petition as is.
      *   *Safety:* If the separation lemma is classical, can we still ensure the dispatcher stays on the safe side? If the proof says "Safe side exists" but doesn't tell the controller how to get there, the proof is useless for the controller. *However*, the prompt says the proofs are *behind* the dispatch program. The program might be written separately, and the proof verifies it. If the proof is classical, it verifies the program *assuming* classical logic. If the program is computable, it's fine. The risk is if the proof relies on non-computable objects to verify computable code.
      *   *Key Insight:* The "Prop vs. Type" distinction (Erasure) is the technical solution. I must explain this simply. "Proofs that vanish vs. Proofs that build."

  6.  **Final Polish:** Check against all constraints in the prompt.
      *   Draft opinion? Yes.
      *   End in recommendation? Yes.
      *   Distinguish non-constructive in program vs. argument? Yes.
      *   Resolve engineer disagreement (calculus level)? Yes.
      *   Conditions precisely stated? Yes.
      *   Who verifies/when? Yes.
      *   Strongest case for admission + cost of refusal? Yes.
      *   Reasoning, not references? Yes.

  7.  (Self-Correction during drafting): Make sure I don't get bogged down in "Constructive Type Theory" jargon. Use "Computational Logic" vs. "Classical Logic". Use "Blueprint" vs. "Existence Guarantee".

  8.  **Final Review of the Engineer Dispute:**
      *   Engineer A: "AC is proved." (Refers to the fact that in Dependent Type Theory, $\forall x \exists y$ *is* a function).
      *   Engineer B: "Misleading." (Refers to the fact that adding *Classical* AC breaks extraction).
      *   Resolution: A is talking about the *base system*. B is talking about the *proposed extension*. Both are partially right, but B is right about the risk. I need to clarify this distinction.

  9.  **Final Review of Recommendation:** "Admit under Conditions" is the most responsible engineering stance. It allows progress but mitigates risk.

  10. **Writing the Document.** (Proceed to generate output based on these thoughts).

  *(Self-Correction during final output generation)*: Ensure the distinction between the *dispatch program* (the code running the grid) and the *verification library* (the math proving the code works) is clear. The petition is about the *library*.

