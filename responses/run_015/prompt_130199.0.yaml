  **Welcome to the National Gallery of Non-Indexical Aesthetics**

  Thank you for visiting the world's first institution dedicated to the purity of the visual field. To ensure your ontological stability during your visit, please review the following Frequently Asked Questions regarding our collection policies.

  **1. Is the Generative Curatorial Unit considered an artist?**
  No. The Unit is a conduit, not a creator. To attribute authorship is to commit the "Intentional Fallacy." Art resides in the visual payload, not the biological history of its production. If a painting and a generation are pixel-identical, they are the same work existing in parallel substrates. The Unit merely facilitates the work's manifestation in a stable medium. We do not celebrate genius; we celebrate resolution.

  **2. Why is there a surcharge for viewing human-made pieces?**
  Human production is inefficient, slow, and prone to ergonomic failure. Our "Legacy Human" wing charges a premium for this scarcity. You are paying for the novelty of biological latency, not superior aesthetics. It is akin to paying extra for hand-stitched errors on a perfectly manufactured garment. The surcharge also covers the insurance risk of owning organic matter that might decay, unlike our eternal digital prints which remain ontologically secure forever.

  **3. What happens if I feel deceived upon learning a work had a human behind it?**
  This is clinically known as "Indexical Shock." If your aesthetic experience degraded upon learning the substrate, your initial appreciation was based on provenance, not perception. We offer full refunds for Ontological Discontinuity, provided you submit a notarized statement confirming you cannot visually distinguish the work from a generation. Please note: feeling moved by an artist's tragic biography is considered a narrative error, not a valid aesthetic response, and is not grounds for compensation.

  **4. Can I commission a dream from the model?**
  You may submit prompt tokens. However, the model does not dream; it calculates probability distributions. Requesting "emotion" adds unnecessary metadata that clouds the visual field. The purest experience is viewing an image generated without a prompt, ensuring zero human contamination. If you require the illusion of intent, we offer a "Human Simulation Pack" that adds random brushstroke noise to the final output for an additional fee.

  **5. Who selects the exhibitions?**
  Our curatorial board is a weighted algorithm trained on visitor dwell times. Human curators introduce bias regarding "historical context" or "cultural significance." Our system selects only based on pixel-level engagement. If you stare, it stays. This ensures a purely democratic aesthetic environment, free from the tyranny of art historical narratives or the ego of the creator.

  This satire targets the extreme formalist argument that aesthetic identity is purely perceptual, ignoring the role of intention, history, and context in art.
