answer: |-
  Here is the committed audit.

  **Do these hang together?**
  No. You have one fatal logical contradiction and one philosophical instability that will get torn apart in Q&A.

  ### Ranked Tensions by Severity

  **1. Fatal Logical Contradiction: (2) vs. (5)**
  *   **The Conflict:** In (2), you claim street names are *navigational infrastructure* and renaming them is *pointless bureaucracy*. In (5), you subject those exact same streets to a *150-year commemorative sunset*.
  *   **Why it breaks:** You cannot claim streets are non-honorific infrastructure to avoid the burden of renaming, then simultaneously subject them to a commemorative review process that *requires* renaming. If they need a sunset clause, they are honorific by your own definition in (3). If they are honorific, (2) is false.
  *   **Severity:** Critical. This is a performative contradiction. It makes your policy incoherent.

  **2. Philosophical Instability: (1) & (3) vs. (4)**
  *   **The Conflict:** In (1), you argue keeping a statue is like giving a "lifetime achievement award" (implying the symbol *does* something). In (4), you claim symbolic harm is "weightless" and we shouldn't "legislate feelings."
  *   **Why it breaks:** If symbols are weightless (4), then the "award" in (1) is meaningless. If the award is meaningless, there is no reason to remove the statue. You cannot have it both ways.
  *   **Severity:** High. This undermines the normative force of your entire argument. However, your proposed "save" (institutional signaling) *can* work, but only if you explicitly rewrite (4).

  **3. Minor Friction: (3) vs. (6)**
  *   **The Conflict:** (3) demands pluralistic endorsement for public space; (6) pushes complex figures to museums.
  *   **Why it holds:** This is actually a strength, not a tension. It creates a clear boundary between *civic virtue* (squares) and *historical record* (museums). Keep this.

  ---

  ### The Commitment to Drop
  **Drop the inclusion of streets in commitment (5).**

  You must exempt street names from the 150-year sunset clause.
  *   **Reasoning:** Your insight in (2) (that streets are primarily navigational) is stronger and more nuanced than your blanket sunset policy in (5). If you keep the sunset on streets, you are forced to admit they are honorific, which destroys your distinction between statues and infrastructure. If you remove streets from the sunset, you preserve the distinction, reduce the "pointless bureaucracy" you rightly identify in (2), and focus the contractualist rule (3) on actual commemorative art.
  *   **Cost:** You lose the elegance of a "universal" rule, but you gain logical consistency.

  ### The Cheapest Single Revision
  **Rewrite commitment (4) to distinguish "Subjective Offense" from "Civic Falsehood."**

  *   **Current (4):** "Symbolic harm is basically weightless in policy — we shouldn't legislate feelings."
  *   **Revised (4):** "Subjective emotional offense is weightless in policy, but **objective civic dishonesty is not.**"
  *   **Why this saves you:** This validates your "institutional signaling" save. It allows you to say: "We aren't taking the statue down because people feel hurt (which violates 4); we are taking it down because the state cannot truthfully endorse this person as a civic model without lying (which satisfies 1)."
  *   **Cost:** Zero. It strengthens your position against critics who will accuse you of erasing history based on feelings.

  ### Summary of Actions
  1.  **Cut:** Remove "and streets" from commitment (5).
  2.  **Edit:** Refine commitment (4) to target "civic dishonesty" rather than "symbolic harm."
  3.  **Result:** A consistent theory where statues are vetted for civic truth (1, 3, 4, 6), streets remain stable infrastructure (2, 5-modified), and the state avoids both lying and legislating feelings.
