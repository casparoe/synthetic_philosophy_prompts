prompt: |-
  hey — I've landed on a position about the bootstrapping problem in epistemology and I want you to try to break it, because I can answer every objection I can think of myself and I don't trust that at all.

  Quick version of the setup in case we use different words: the easy-knowledge style argument runs through an agent using one single source over and over — a colour sensor, a thermometer, whatever — noting that its outputs line up with how things actually are in each case, then inferring (by induction, or via some closure principle from the conjunctive list of matches) that the source is reliable, and thereby seeming to buy knowledge of its own reliability for free. Reliabilism is supposed to make that too cheap.

  My position: the argument doesn't touch knowledge. What it actually shows is that the bootstrapped belief isn't supported by the agent's evidence — her total evidence is perfectly compatible with the source being a reliable-looking piece of garbage — and that's an undercutting defeat relative to what she has, not a defect in truth or in reliability. So the bootstrapped belief can be knowledge, and the leftover that-can't-be-right feeling is a fact about epistemic rationality, evidential support, and maybe about what she should be willing to say out loud — not about knowledge. Corollary I'm stuck with: most of the industry of replies is fixing the wrong thing. Restricting closure, demanding that beliefs track the truth or be safe, adding an anti-bootstrapping condition on what counts as a basic source — all of these treat an evidential complaint as if it were a knowledge complaint, and any of them that saves reliabilism from bootstrapping by blocking the inference is, on my view, buying relief at the wrong price.

  Three cases I made up. I want your verdict on each, but more than that I want you to say what each one actually shows about my diagnosis, if anything:

  (a) The shy sensor. A sensor that is genuinely highly reliable in ordinary operation, but whose reliability is sensitive to the operator's own conclusions: as soon as the operator comes to believe, to a high enough degree, that it is reliable, its accuracy collapses to roughly chance. Fill in the mechanism however you like — a maintenance tech who sabotages operators who get cocky, or make it social and let the source be a colleague who gets sloppy once she's trusted. So in the actual world the bootstrapping inference destroys the very reliability it reports on. I seem committed to saying she knows it's reliable only if she refrains from concluding that it is; the inference her evidence supports is the one that makes her belief false. How much does that hurt me, versus how much does it hurt the original argument (which also wants to say something about what happens when the agent actually performs the inference)? And: should the process whose reliability matters be individuated to include her resulting confidence? That's the generality problem biting, and I'm not sure it bites me or the other side.

  (b) The dimmer. Same thing but graded and continuous: reliability starts very high when she's agnostic about the source and falls off smoothly as her confidence rises (and comes back as her confidence drops). There's then a fixed point — a confidence level where she thinks the source is reliable to exactly the degree it in fact is, given that she thinks that. Pick the numbers so the crossing point is still comfortably above whatever threshold you think reliable needs. At that point the belief is true, the source is reliable, and the belief came from a reliable process, so on my view it looks like knowledge — except that the reliability is partly made true by the belief itself. Is that knowledge? Does my position quietly collapse into the self-verifying, coherence-flavoured view it was supposed to be an alternative to? And note there will be fixed points for lots of intuitively awful sources too, so I may be committed to knowledge in cases where I really don't want to say that.

  (c) The mirror image. Flip the sign: a source that performs better the more it is trusted or relied on, so that confidence raises reliability. Start it at chance, let her sample, get mildly confident, get a better source, get more confident, and watch her walk herself up to a fixed point where her belief is true and the source really is reliable. Reliabilism plus my diagnosis seems to say: knowledge, no problem. But this looks like manufacturing reliability out of nothing, which strikes me as a worse version of the original too-easy complaint rather than a solution to it. Is that a genuine escalation, or is it just the same case with the sign changed?

  Other things I want you to push on:

  1. Is my it's-really-an-evidential-complaint line just evidentialism about justification smuggled in under a reliabilist label? If so, name the exact premise I've helped myself to, and say what I'd have to give up to keep the result without it.

  2. What would someone who takes the bootstrapping argument to be decisive against reliabilism say counts against me, and — more usefully — what would they concede counts against them? Same question for a reliabilist who does buy the closure-restriction or tracking reply: I assume their objection is that I've changed the subject from knowledge to rationality, but give me the strongest version of that, not the version I can bat away.

  3. The borrowed baseline. An agent whose first anchoring calibration came from someone else's say-so, and who bootstraps from there. Does my story predict the bootstrapping worry should evaporate in her case because the anchor is independent? If it does and the worry intuitively doesn't evaporate, that's a problem; if it doesn't, I owe you an account of why not.

  4. Downstream consequences I might not want: what my view implies for the norms of assertion and action (can she assert that the source is reliable? act on it?), for whether knowledge comes out depending on what she does after forming the belief, and for the value of knowledge — if bootstrapped knowledge is knowledge but is useless for anything, that's its own kind of awkward.

  5. Rank the defeaters, fatal through merely awkward, including ones I haven't listed.

  6. Has the position been qualified into unfalsifiability? I worry that the bootstrapping worry is about evidence, not knowledge can absorb any counterexample by reclassifying whatever you throw at it as merely evidential. Tell me honestly whether that's happening, and whether, for a position of this shape — a claim about what an argument really shows — being insulated that way is even a defect or just what a good diagnosis looks like.

  And please be straight about the confidence level of what you're telling me: separate what's settled from what's genuinely contested among people who actually work on this, and don't dress up one side of a live fight as the consensus. Flag the places where you're speculating or where you think the literature is genuinely split. I don't need a reading list or citations, I've got those — I want the map of where this view is exposed.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Position:**
      *   **Core Claim:** The bootstrapping problem (Cohen's easy knowledge) is *not* a problem for knowledge (specifically reliabilist knowledge). It is a problem for *evidential support* or *epistemic rationality*.
      *   **Diagnosis:** An agent can have a true belief produced by a reliable process (meeting reliabilist conditions for knowledge), but the *inference* to reliability is not supported by their total evidence (undercutting defeat). The "queasiness" we feel is about rationality/assertibility, not knowledge status.
      *   **Corollary:** Standard replies (restricting closure, adding safety/tracking, anti-bootstrapping conditions) are fixing the wrong thing (knowledge) instead of the right thing (evidence/rationality).
      *   **Goal:** The user wants me to break this position. They suspect they can answer standard objections and want to know where the *real* vulnerabilities are. They want a map of exposure, not a reading list. They want confidence levels flagged.

  2.  **Deconstruct the Three Cases:**
      *   *(a) The Shy Sensor:* Reliability collapses if the agent believes it's reliable.
          *   *User's Commitment:* She knows it's reliable only if she *doesn't* conclude it. The inference makes the belief false.
          *   *Vulnerability:* This creates a paradox where the process of *checking* reliability destroys the reliability required for knowledge. It highlights the *Generality Problem*. If the process includes the "concluding" step, it's unreliable. If it doesn't, it's reliable but the belief is false (because the act of believing changed the world). This threatens the stability of the knowledge claim.
      *   *(b) The Dimmer:* Graded reliability based on confidence. Fixed point exists where belief = reliability > threshold.
          *   *User's Commitment:* This looks like knowledge (True, Reliable Process).
          *   *Vulnerability:* This looks like *epistemic circularity* or *self-verification*. If the belief *makes* the source reliable, is it really knowledge? It risks collapsing into a coherence theory where believing $P$ makes $P$ reliable enough to know $P$. This threatens the externalist core of reliabilism (independence of belief and truth-maker).
      *   *(c) The Mirror Image:* Confidence *increases* reliability. Walk up to a fixed point.
          *   *User's Commitment:* Knowledge, no problem.
          *   *Vulnerability:* This is "manufacturing reliability." It feels like magic. If I can believe my crystal ball is reliable and thereby *make* it reliable, have I gained knowledge or just manipulated the world? It exacerbates the "too easy" complaint. It suggests the agent has *power* over the truth, which undermines the *passivity* usually required for knowledge (world-to-mind direction of fit).

  3.  **Address the Specific Questions (1-6):**

      *   *1. Evidentialism Smuggled In?*
          *   Yes, this is a hybrid view. Pure reliabilism usually ignores evidence (it's about the process). By saying "evidence doesn't support it," the user is importing an internalist constraint on *rationality* while keeping an externalist constraint on *knowledge*.
          *   *Risk:* Fragmentation of epistemology. If knowledge doesn't track rationality, what is knowledge for?
      *   *2. Opposing Views:*
          *   *Anti-Reliabilist:* Will say if you can't rationally believe it, you don't know it. Knowledge entails rationality.
          *   *Closure-Restriction Reliabilist:* Will say knowledge *must* be closed under competent deduction. If bootstrapping yields knowledge, closure holds. If bootstrapping is bad, closure must fail. The user says "Knowledge holds, Rationality fails." The opponent says "Rationality failure *is* Knowledge failure."
      *   *3. The Borrowed Baseline:*
          *   If the anchor is independent, does the worry vanish? Intuitively, no. Bootstrapping from a friend's testimony about a thermometer feels just as cheap as bootstrapping from the thermometer itself.
          *   *Risk:* If the user says the worry *should* vanish here, they clash with intuition. If they say it *doesn't*, they need to explain why independent testimony doesn't fix the evidential gap.
      *   *4. Downstream Consequences (Assertion/Action):*
          *   If she knows but lacks evidence, can she assert "It is reliable"? (Norm of Assertion = Knowledge? Or Knowledge + Evidence?)
          *   If she acts on it, is she rational?
          *   *Risk:* "Useless Knowledge." If she can't use the knowledge to justify further inquiries or assertions, its value is diminished.
      *   *5. Ranking Defeaters:*
          *   Need to identify which objections are fatal vs. awkward.
          *   *Fatal:* The collapse of the distinction between knowledge and rationality (if K entails Rationality). The Generality Problem in Case (a).
          *   *Awkward:* The "useless knowledge" implication.
      *   *6. Unfalsifiability:*
          *   Is "It's just an evidential problem" a get-out-of-jail-free card?
          *   *Risk:* Yes. If every counterexample is reclassified as "evidential," the theory becomes immune to refutation but loses explanatory power.

  4.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Direct, analytical, rigorous. No fluff. Acknowledge the sophistication of the user's position.
      *   *Structure:*
          1.  Executive Summary of the Position's Status.
          2.  Analysis of the Three Cases (a, b, c).
          3.  Addressing the 6 Specific Challenges.
          4.  Confidence/Consensus Mapping.
      *   *Key Insight to Push:* The user is trying to drive a wedge between *Knowledge* (externalist) and *Rationality/Justification* (internalist/evidential). The biggest threat is the **Knowledge-Norm of Rationality** (or the idea that Knowledge *is* the norm of belief). If K entails Rationality, the user's split fails.
      *   *Another Key Insight:* The **Value Problem**. If bootstrapped knowledge can't be used in reasoning (because it lacks evidential support), is it distinct from mere true belief in terms of utility?

  5.  **Refining the Critique of the Cases:**
      *   *Case (a):* The Generality Problem is the killer here. How do we individuate the process? "Looking at the sensor" vs. "Looking at the sensor and concluding it's reliable." If the latter, it's unreliable. If the former, the belief is false (because the conclusion triggered the sabotage). The user can't have it both ways.
      *   *Case (b) & (c):* These attack the *independence* condition of reliabilism. Reliabilism usually requires the reliability to be a fact about the world, not contingent on the belief itself (unless it's a self-fulfilling prophecy, which is rare). If reliability is belief-dependent, is it a *cognitive* process or a *causal* manipulation? This blurs the line between knowing and making true.

  6.  **Refining the "Evidentialism Smuggled In" Point:**
      *   The user is essentially advocating for **Dual-Component Epistemology**: Knowledge = Reliabilist Condition + (separate) Rationality = Evidentialist Condition.
      *   The threat is that most epistemologists think Justification is a *necessary condition* for Knowledge. If the user says "You have Knowledge but no Justification," they are rejecting the JTB (or JTK) framework standard in the field. They need to defend why "Unjustified Knowledge" isn't an oxymoron.

  7.  **Final Review against Constraints:**
      *   No citations/reading lists.
      *   Flag confidence levels.
      *   Be straight about vulnerabilities.
      *   Address the "unfalsifiability" worry honestly.

  8.  **Final Polish:** Ensure the distinction between "Knowledge" (factive, external) and "Rationality" (internal, normative) is kept sharp, as that's the user's main lever. (Self-Correction: Make sure to emphasize that if Knowledge norms belief, then Unjustified Knowledge is impossible.)

  *(Self-Correction during drafting)*: I need to be careful not to just repeat standard objections the user says they can handle. I need to find the *structural* weaknesses in *their specific diagnosis*. The weakness isn't "bootstrapping is bad," it's "your split between knowledge and rationality creates new problems."

  Let's organize the response by the user's requested structure.

  *   **Intro:** Acknowledge the strength of the "diagnostic" move (shifting the locus of the problem).
  *   **Cases:** Analyze (a), (b), (c) specifically regarding the *stability* of the knowledge claim.
  *   **Questions 1-6:** Tackle them head-on.
  *   **Confidence Map:** Clearly distinguish settled vs. contested.

  *Crucial Point to Hit:* The "Knowledge-First" objection. If Knowledge is the fundamental norm, you can't have Knowledge without the right to believe. If you lack evidential support, you lack the right to believe. Therefore, you lack Knowledge. This is the strongest attack on the "split."

  *Crucial Point 2:* The "Action-Guiding" objection. Knowledge is supposed to guide action. If the evidential basis is missing, can it guide action? If not, is it knowledge?

  Okay, ready to write.
answer: |-
  This is a sophisticated diagnostic move. You are attempting to drive a wedge between **knowledge** (conceived externalistically, as a factive status grounded in reliable connection) and **rationality/justification** (conceived internalistically, as a matter of evidential support and inferential license). Your claim is that bootstrapping yields the former without the latter, and the "queasiness" we feel is our internalist radar pinging, not a failure of the externalist conditions.

  This position is logically coherent, but it is expensive. It requires you to abandon the widely held view that knowledge is the *norm of belief* or that justification is a *necessary condition* for knowledge.

  Here is the breakdown of where your position is exposed, starting with your cases and moving to the structural challenges.

  ### Verdict on the Three Cases

  These cases are not just intuition pumps; they are stress tests for the stability of your "knowledge without evidential support" distinction.

  **(a) The Shy Sensor**
  *   **The Problem:** This case triggers the **Generality Problem** in a way that threatens to collapse your distinction. You say the belief is knowledge *if* she refrains from concluding it. But knowledge is a standing state. If the *process* of sustaining the belief (or reflecting on it) triggers the sabotage, the belief cannot be stably held as knowledge.
  *   **The Exposure:** If the process is individuated as "forming a belief about reliability," the process is unreliable (because it triggers sabotage). If the process is individuated as "reading the sensor," the belief is false (because the act of believing makes the sensor unreliable).
  *   **Damage:** **High.** This suggests that on your view, knowledge becomes **fugitive**. You are committed to saying she knows $P$ only so long as she doesn't fully believe she knows $P$. This makes knowledge essentially unstable under reflection. A theory of knowledge that makes knowledge disappear upon competent reflection is functionally indistinguishable from a theory that says there is no knowledge there to begin with.
  *   **Who it hurts:** It hurts the original argument too, but less. The original argument says "No knowledge." You say "Fragile knowledge." Fragile knowledge is often useless knowledge (see point 4 below).

  **(b) The Dimmer**
  *   **The Problem:** This attacks the **Independence Condition** of reliabilism. Standard reliabilism requires the reliability of the process to be a fact about the world independent of the specific token belief (though not independent of the type). Here, the reliability is *constituted* by the confidence level of the belief.
  *   **The Exposure:** You risk collapsing into a **coherence theory** or a **pragmatic encroachment** view you didn't sign up for. If the truth/reliability of the source is partially fixed by the agent's doxastic attitude, the "world-to-mind" direction of fit required for knowledge is compromised. You are describing a self-fulfilling prophecy, not a cognitive grasp of an independent fact.
  *   **Damage:** **Medium-High.** It shows your view permits "manufactured reliability." If I can believe my tea leaves are reliable to degree $X$, and that belief makes them reliable to degree $X$, have I *discovered* a fact or *created* one? If the latter, it's not knowledge in the standard sense.

  **(c) The Mirror Image**
  *   **The Problem:** This is the escalation you fear. If (b) was suspicious, (c) is alchemy.
  *   **The Exposure:** This highlights that your view allows **epistemic bootstrapping to create truth-makers**. In standard bootstrapping, the source is reliable, and we worry about the *inference*. In (c), the inference *makes* the source reliable.
  *   **Damage:** **Medium.** It's not fatal to your specific diagnosis (you can consistently say "Yes, that's knowledge"), but it isolates you from almost all other epistemologists. It implies that for certain sources, *believing* is a method of *making true*. Most epistemologists reserve that power for practical reasoning or performatives, not theoretical knowledge.

  ---

  ### Addressing the Six Challenges

  #### 1. Is this Evidentialism smuggled in?
  **Verdict:** Yes, but hybridized.
  **The Premise:** You have helped yourself to the premise that **Knowledge does not entail Rational Belief.**
  **The Cost:** To keep your result, you must give up the **Knowledge-Norm of Belief** (the idea that you should only believe what you know) or the **JTB framework** (where Justification is necessary for Knowledge).
  **The Exposure:** Most contemporary epistemology (especially Knowledge-First) treats Knowledge as the fundamental normative status. If an agent lacks evidential support, they are *irrational* in believing. If Knowledge is the norm of belief, you cannot know what you are irrational to believe. You are positing "Irrational Knowledge." This isn't a contradiction, but it renders "Knowledge" normatively inert. If I tell you, "I know $P$, but I have no evidence for $P$ and shouldn't believe it," you have changed the subject on what 'know' does in our language.
  **Confidence:** **High.** This is the central tension. You are splitting the concept of knowledge into a *factive component* and a *normative component* and claiming only the former matters for the label "knowledge."

  #### 2. What would opponents concede vs. deny?
  **The Anti-Reliabilist (Internalist):**
  *   **Denies:** That knowledge can exist without evidential support. They will argue that if the evidence doesn't support it, it's not knowledge, full stop. They will say you are redefining "knowledge" to mean "true belief via reliable accident."
  *   **Concedes:** That the *feeling* of queasiness is about internal rationality. They just think that internal rationality is a *condition* for knowledge, not a separate track.
  **The Closure-Restriction Reliabilist:**
  *   **Denies:** That your split solves the problem. They argue that if closure holds (and it should), and the premise is known, the conclusion must be known. If the conclusion isn't known (because bootstrapping is bad), the premise wasn't known, or closure fails. They will say your view "saves" reliabilism by making it irrelevant to reasoning.
  *   **Concedes:** That restricting closure is costly. They would prefer your solution *if* they could keep the link between knowledge and rational inference.
  **Confidence:** **High.** This accurately maps the dialectic. The fight is over whether "Knowledge" must be *usable* in reasoning.

  #### 3. The Borrowed Baseline
  **The Scenario:** Agent calibrates via testimony, then bootstraps.
  **Your Prediction:** The worry should evaporate because the anchor is independent.
  **The Intuition:** The worry does *not* evaporate. Bootstrapping from a friend's testimony about a thermometer feels just as cheap as bootstrapping from the thermometer itself.
  **The Exposure:** If you admit the worry *doesn't* evaporate, you must explain why independent testimony doesn't fix the evidential gap. If the gap is about *circularity of evidence*, independent testimony fixes it. If the gap is about *structural cheapness*, it doesn't.
  **Damage:** **Medium.** If you say the worry *should* vanish but intuition says it doesn't, you clash with data. If you say it *doesn't* vanish, you need to explain why independent testimony fails to provide the evidential support you claim is missing in the standard case. It suggests the problem isn't just "lack of independent evidence," but something about the *structure of the inference* itself, which undermines your "it's just an evidential complaint" diagnosis.
  **Confidence:** **Medium.** This is contested. Some argue testimony *does* help; others argue bootstrapping is structural regardless of the anchor.

  #### 4. Downstream Consequences (Assertion and Action)
  **Assertion:** If she knows but lacks evidence, can she assert "The source is reliable"?
  *   **Risk:** If the norm of assertion is Knowledge, she can. If the norm is Knowledge + Evidence (or Rationality), she cannot. If she asserts and is challenged ("What's your evidence?"), she has none. She is forced to say "I know, but I can't tell you why." This looks like dogmatism, not knowledge.
  **Action:** Can she act on it?
  *   **Risk:** If she bets her life on the sensor based on this "knowledge," is she rational? If yes, then evidential support doesn't matter for rationality (radical externalism). If no, then she has "knowledge" she cannot rationally act on.
  **The Exposure:** **Useless Knowledge.** If bootstrapped knowledge cannot be cited in reasoning, cannot be used to justify assertion, and cannot ground rational action, it is a "zombie" status. It has the metaphysics of knowledge but none of the utility. This invites the objection: "Why call it knowledge?"
  **Confidence:** **High.** This is a strong pragmatic objection.

  #### 5. Ranking the Defeaters
  1.  **The Normative Collapse (Fatal):** If Knowledge entails Rationality (or is the norm of belief), your split is impossible. You cannot have "Irrational Knowledge." This is the strongest objection from the Knowledge-First camp (Williamson, etc.).
  2.  **The Generality/Instability Problem (Fatal in specific cases):** As seen in Case (a), if the knowledge disappears upon reflection or assertion, it fails to function as a cognitive resource.
  3.  **The "Useless Knowledge" Objection (Awkward but survivable):** You can bite the bullet and say "Yes, it's knowledge, just don't use it." This saves the theory but makes it less valuable.
  4.  **The Manufactured Reliability Objection (Awkward):** Cases (b) and (c) show your view allows belief to constitute truth-makers. You can accept this, but it moves you away from standard realism.
  5.  **The Borrowed Baseline (Merely Annoying):** This can be handled by refining what counts as "independent evidence," but it requires work.

  #### 6. Unfalsifiability and Insulation
  **Honest Assessment:** Yes, there is a risk of unfalsifiability.
  **The Mechanism:** Your move is to reclassify any counterexample where intuition says "No Knowledge" as "Okay, Knowledge, but No Rationality." Since "Rationality" is a separate track you control, you can always absorb the hit.
  **Is this a defect?**
  *   **Yes,** if you claim to be explaining our *concept* of knowledge. If our concept includes "properly supported," then you are revising the concept, not analyzing it.
  *   **No,** if you claim to be doing **conceptual engineering** or **metaphysical grounding**. If you argue "Here is the factual basis of knowledge (reliability), and separately here is the normative basis (evidence)," you are offering a theory, not a description.
  **The Trap:** The trap is claiming your view matches *ordinary usage* while insulating it from ordinary intuitions. If ordinary speakers say "You don't *know* that, you have no evidence," and you say "Yes he does, he just isn't rational," you are talking past them.
  **Confidence:** **High.** This is a genuine methodological vulnerability.

  ---

  ### Confidence & Consensus Map

  **Settled/High Consensus:**
  *   Bootstrapping is a problem for *something* (either knowledge, justification, or rationality).
  *   Pure reliabilism without any constraints faces the bootstrapping objection.
  *   Internalists will reject your split between knowledge and rationality outright.

  **Contested/Live Fight:**
  *   **Whether Knowledge entails Rationality:** Knowledge-Firsters say yes (or that knowledge is the only norm). Traditionalists might allow a split. **Your view lives or dies here.**
  *   **The Status of Closure:** Some are willing to restrict closure to save reliabilism; others think closure is non-negotiable. Your view tries to keep closure for knowledge but restrict it for *rational inference*. This is a minority but defensible position.
  *   **The Value of "Zombie Knowledge":** Whether a belief state that meets externalist conditions but fails internalist conditions deserves the label "knowledge" is genuinely split.

  **Speculative/My Assessment:**
  *   I suspect your view is **extensionally adequate** (it matches most verdicts) but **intensionally costly** (it requires redefining the role of knowledge).
  *   The "Shy Sensor" case is the biggest threat to the *stability* of your view. If knowledge vanishes when you check for it, it's not a useful theoretical posit.
  *   You are effectively advocating for a **Two-Component Epistemology**: Externalist Knowledge + Internalist Rationality. This is not unfalsifiable, but it is vulnerable to the charge of **fragmentation**. If the two come apart this easily, why do we care about the Externalist component enough to call it "Knowledge"?

  ### Final Verdict on Your Diagnosis
  You are right that much of the industry is trying to fix knowledge conditions to solve a rationality problem. **However**, you are likely wrong that knowledge can survive the total absence of that rationality *and* remain knowledge in a sense that matters.

  The break-point is not in the logic of bootstrapping; it is in the **normative force of knowledge**. If your "bootstrapped knowledge" cannot license action, assertion, or further inference without irrationality, it is a metaphysical ghost. It has the shape of knowledge but none of the weight. Your position is safe from logical contradiction, but it risks being **philosophically idle**.

  **Confidence in this critique:** 85%. The remaining 15% accounts for the possibility that you are successfully carving nature at a joint that others have missed (the distinction between factual status and normative license), but the burden of proof is on you to show why that distinction matters for the word "knowledge."
