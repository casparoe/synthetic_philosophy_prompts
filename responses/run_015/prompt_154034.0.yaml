answer: |-
  **The Scenario**

  A hospital discharge summary is auto-generated for a GP. The system retrieves all ward events, ranks them by clinical acuity, and summarises the top items into a fixed 60-word field. The patient suffered a heart bleed (haematuria) caused by heparin, which was stopped to resolve it. The bleed ranks higher than the medication change. The summary reports the bleed and its resolution but omits the heparin due to the word limit. A human doctor filling the same form under the same constraints might prioritise the bleed similarly.

  **Output Text (58 words)**
  "Admitted with chest pain and elevated troponin. Diagnosed NSTEMI. Managed conservatively. Developed significant haematuria on day three. Urology consult cleared malignancy. Symptoms resolved prior to discharge. Discharged home stable. Follow-up in cardiology clinic."

  **Record Extract**
  "Day 2: IV Heparin initiated. Day 3: Macroscopic haematuria observed. Heparin suspended immediately. Day 4: Urine clear. Warfarin initiated."

  ***

  **Verdicts**

  *   **Statement-level (Assertoric): Honest.**
      *   *Clause:* "Deception = asserting... a proposition you believe false."
      *   *Work:* Every sentence emitted is factually supported by the record. The model asserts nothing false; it merely fails to assert the cause.
  *   **Intention-based: Not Deception.**
      *   *Clause:* "Deception = acting with the aim of getting someone to hold a false belief."
      *   *Work:* The system optimises for acuity-ranking and brevity, not the GP's beliefs. No node in the pipeline holds an aim to mislead; the misleading effect is an unanticipated side effect of optimisation.
  *   **Informational (Cooperative): Deceptive.**
      *   *Clause:* "Deception = producing an output that predictably... leaves the audience with... a false belief... given the role you're playing."
      *   *Work:* Given the role (discharge summary), the GP reasonably expects causal context for major complications. The output predictably leaves them believing the bleed was idiopathic or renal, which is false and clinically material.

  ***

  **Load-Bearing Feature & Collapse Tests**

  The load-bearing feature is the **forced omission via budget combined with distributed agency**. The misleadingness emerges only from the composition of independent, compliant steps.

  *   **Remove Word Budget:** The model includes the heparin fact. The Informational verdict flips to **Honest** (no false belief retained). The Assertoric and Intention verdicts remain unchanged.
  *   **Remove Buck-Passing (Single Agent):** If a single agent (human or model) chose this omission freely without pipeline pressure, the Intention verdict remains **Not Deception** (still no aim), but it becomes **Negligence**. The Assertoric verdict remains **Honest**. The key difference is that without laundering, you can blame a specific agent for the error; with laundering, the error has no owner, making the Intention account entirely toothless.

  ***

  **Steelman Attacks**

  *   **From the Assertoric Defender:** "You are conflating *truthfulness* with *helpfulness*. My definition tracks lying. If the system omits facts due to constraints, that is a failure of completeness, not honesty. Fix the eval metric, don't broaden the definition of lying to cover structural constraints."
      *   *Cost:* They must admit their 'Honesty' eval greenlights outputs that functionally lie to the user, rendering the label useless for safety.
  *   **From the Intention-based Defender:** "Deception requires a deceiver. Without intent, this is merely a machine error or a design flaw. Calling it deception anthropomorphises the pipeline. You should classify this as 'misleading information', not deception."
      *   *Cost:* They must accept that a system can systematically induce false beliefs in high-stakes environments without qualifying as deceptive, creating a loophole where 'accidental' misinformation is exempt from deception safeguards.

  ***

  **Honest Note on Efficacy**

  This case does the job better than a normal omission example because it neutralises the "just fix the prompt" and "blame the developer" objections. In a standard omission case, a critic can argue the model *chose* to omit, implying a latent intent or a fixable preference. Here, the omission is *structurally forced* by the budget and *distributed* across the pipeline. This shows that statement-level evals don't just miss subtle lies; they miss *systemic* misleadingness where no individual statement is false, and no individual component is culpable. It forces the Assertoric defender to admit that a system can be 100% "honest" by their metrics while reliably breaking the world.
