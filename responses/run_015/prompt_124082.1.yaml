answer: |-
  **Session Plan: The Patchwork Critique of the Simulation Argument**

  **0:00–0:05 | Setup, Scope, and Exclusions**
  *   **Goal:** Frame the session as a critique of the *probabilistic derivation*, not the technological possibility.
  *   **Action:** State clearly that you are bracketing two major debates to keep the 50 minutes focused.
      *   **Exclusion 1:** No Computation Theory of Consciousness. We assume substrate independence for the sake of argument; the critique targets the *counting*, not the *being*.
      *   **Exclusion 2:** No Modal Realism. We are not debating possible worlds, but the reference class of actual observer-moments.
  *   **Misconception Head-off (The Matrix):** Explicitly state that Bostrom's argument is not about deception (being tricked like in *The Matrix*), but about ontology (being a numerical minority). If students start asking about "waking up," shut it down: "We are asking about the probability of our current state, not the potential to escape it."

  **0:05–0:15 | The Hidden Premise: Indifference over Observer-Moments**
  *   **Goal:** Reconstruct the probabilistic core to reveal the dependency on the Self-Sampling Assumption (SSA).
  *   **Concept:** Walk through the ratio: $P(Sim) = N_{sim} / (N_{sim} + N_{bio})$.
  *   **Dependency:** Highlight that this formula only holds if every unit in $N_{sim}$ and $N_{bio}$ is an equivalent token for sampling. This requires the **Principle of Indifference**: you must assume you are a random sample from the set of all observer-moments, weighted equally.
  *   **Teaching Move:** Write the equation on the board, then circle the implicit "$\times 1$" weight assigned to each mind. Ask: "What justification do we have for weighting a simulated second exactly the same as a biological second?"

  **0:15–0:30 | The Concrete Scenario: Foveated "Patchwork" Simulations**
  *   **Goal:** Replace the "Ancestor Simulation" with a resource-optimized model to break the equivalence assumption.
  *   **Why Ancestor Sims Mislead:** The standard "ancestor" example implies full-fidelity history (every atom rendered equally). This hides computational variance and makes sim-moments look identical to bio-moments, reinforcing the uniform sampling illusion.
  *   **The Scenario:** Introduce the **"Pragmatic Stress-Test."** Posthumans run simulations not for history, but to model specific sociological outcomes. To save cost, they use **variable fidelity rendering**: high-resolution physics only for the subjects of study (us?), low-resolution statistical noise for the background (distant stars, unobserved particles, background people).
  *   **Misconception Head-off (Detecting Seams):** When introducing variable fidelity, students will ask, "Couldn't we detect the low-res background?" Head this off immediately: "The simulation manages the interface. If you look at the background, it renders high-res *then*. The constraint is not empirical detection, it is computational allocation at any given observer-moment."
  *   **Impact:** This creates two classes of observer-moments within the simulation: High-Cost (HC) and Low-Cost (LC).

  **0:30–0:40 | The Probabilistic Break**
  *   **Goal:** Show how patchwork undermines the uniform-sampling assumption without claiming simulations are impossible.
  *   **Argument:**
      1.  If simulators optimize cost, LC moments vastly outnumber HC moments within a single simulation.
      2.  Biological minds are presumably always HC (we don't experience low-res physics).
      3.  Therefore, the reference class "Observer-Moments like Ours" is not proportional to "Total Simulations."
      4.  It is proportional to "Total High-Cost Compute Cycles."
  *   **The Vulnerability:** The probability $P(Sim)$ no longer depends on the *number of simulations*, but on the *ratio of HC compute available to simulators vs. bio nature*. If HC compute is expensive, $N_{sim-HC}$ might not dwarf $N_{bio}$. The simple counting argument collapses because the "tokens" are no longer uniform.
  *   **Key Takeaway:** The argument fails not because simulations can't exist, but because the *measure* over the reference class is undefined without assuming uniform computational weight.

  **0:40–0:50 | End-of-Session Check**
  *   **Goal:** Verify grasp of the structural vulnerability, not just the conclusion.
  *   **Activity:** Distribute a slip of paper (or poll).
  *   **The Question:** "Bostrom's derivation assumes $P(You | Sim Moment) = P(You | Bio Moment)$. In one sentence, explain how the 'Patchwork' scenario invalidates this equality without asserting that simulations are technologically impossible."
  *   **Expected Answer:** Students should identify that variable fidelity assigns different computational weights/measures to observer-moments, making them non-equivalent samples for the indifference principle.

  **Exclusions Recap:**
  *   No debate on whether silicon can feel (CoC).
  *   No debate on the reality of possible worlds (Modal Realism).
  *   No empirical claims about detecting glitches (Physics).

  This session replaces the standard ancestor-simulation model with a variable-fidelity 'patchwork' scenario to expose how the Simulation Argument's probabilistic conclusion collapses without a uniform-sampling assumption over observer-moments.
