  | "A crane is anything that gets you design using only ordinary physical processes..." | `accurate` | Cranes are subprocesses (like natural selection) that lift design from existing design using physical laws. | This is the core definition; getting this right is essential for the rest of the argument. | (No change needed) |
  | "...the point of cranes is that they're anti-reductionist: they show you can't skip levels..." | `wrong` | Cranes are reductionist tools that explain how higher levels are built from lower levels without skipping steps. | Calling cranes anti-reductionist inverts Dennett's project; he uses them to *secure* reductionism. | "...the point of cranes is that they're reductionist: they show how higher levels are built from lower levels without skipping steps." |
  | "...that you need extra explanatory principles at each new level of complexity." | `subtle_distortion` | You need different *vocabularies* or *stances* at each level, but not ontologically distinct principles. | Suggests strong emergence (new forces) rather than weak emergence (new patterns). | "...that you need different explanatory vocabularies at each new level of complexity." |
  | "So the right attitude is reductionist about the bottom and anti-reductionist about the top." | `wrong` | Dennett is an ontological reductionist all the way up; higher levels are real patterns constituted by lower levels. | This creates a false dualism Dennett explicitly rejects; he is a compatibilist about levels. | "So the right attitude is reductionist about the ontology but pluralist about the explanatory strategies." |
