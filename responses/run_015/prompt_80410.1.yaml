answer: |-
  ### The procedure

  1.  **Draft the Maxim:** State the policy as: "I will [Action] in [Context] to achieve [Purpose]." Crucially, avoid over-specificity (e.g., "when I'm stressed") or over-generality (e.g., "always"). Include relevant stakeholders in the context. This is a judgment call; if the maxim is rigged, the test is useless. Ensure the context captures the professional role, not personal convenience. If the maxim feels like a loophole, broaden the context. If it feels too restrictive, check if the purpose is essential. Step 1 requires consensus. Have two team members draft the maxim independently. If they differ, discuss until aligned. This reduces individual bias in framing.
  2.  **Universalize:** Imagine a world where every agent in your position *must* follow this maxim as a law of nature. It is not just "many people do this," but "everyone must." The system becomes defined by this rule.
  3.  **Tier 1 Test (Conception):** Does the practice self-destruct in this world? If everyone does this, does the action become logically impossible? For example, promising vanishes if everyone lies. If yes → **FAIL (Forbidden)**. Stop immediately. Step 3 requires logical rigor. Don't say "it's hard," say "it's impossible."
  4.  **Tier 2 Test (Will):** If Tier 1 passes, ask: Can you rationally *will* this world? Does universalizing this undermine your own long-term goals or the system you rely on? Could you survive in a world where everyone treats you this way? If no → **FAIL (Unethical)**. Step 4 requires empathy. Imagine you are the customer.
  5.  **Sign-off:** If both pass, proceed to Execs. If either fails, flag for revision or rejection. Document the maxim used for audit trails. You must own the formulation; do not game the wording to pass.

  ### The two tiers

  Contradiction in Conception (CiC) identifies perfect duties. The universalized maxim creates a logical impossibility. Lying fails here because trust collapses; promises vanish. If your policy fails CiC, it is strictly prohibited. No trade-offs. It is inherently self-defeating. The action literally cannot exist in the universalized world. Distinguish clearly: CiC kills the practice; CiW kills the willingness to participate.

  Contradiction in Will (CiW) identifies imperfect duties. The action is possible, but no rational agent would will it because it destroys necessary conditions for their own success. Hoarding resources fails here; you might survive, but you couldn't will a world where no one helps, as you might need help later. Failing CiW means the policy is unethical unless overriding duties exist. Pass means surviving both. Fail means stopping. CiC is a hard stop; CiW is a strong presumption against. CiC is about logic; CiW is about rational consistency. You cannot will a system that undermines your own agency.

  ### Where judgment can't be eliminated

  The maxim formulation is the weak point. Writing "I will lie to save lives" passes where "I will lie" fails. You must judge relevance. Is "saving lives" part of the context or the purpose? This isn't math; it's interpretation. Also, defining "rational will" in Tier 2 relies on your view of human needs. I cannot automate this. You must own the maxim wording. If you game the wording to pass, you violate the spirit. This procedure flags risks; it does not replace your signature. The "context" definition is where bias enters. You are the filter. Document why you chose that phrasing.

  ### Worked cases

  Case 1 (Vague Claims): Maxim: "We will obscure capabilities technically truthfully to close sales." Universalized: All vendors obscure true performance. Market trust erodes; "performance" loses meaning. CiC: Borderline. CiW: You couldn't will this; you need customers to trust specs to buy *your* product. **FAIL Tier 2.** The market mechanism you rely on destroys itself. Judgment: Is "technically true" a loophole? Yes. Broaden maxim to "obscure truth." If you allow this, you degrade the language you use to sell. Handoff: Reject policy. Sales will argue revenue loss; you argue market collapse. You must explain that short-term gain destroys long-term viability.

  Case 2 (Hidden Defects): Maxim: "We will withhold minor defect info if unnoticed." Universalized: All sellers hide minor flaws. Trust collapses; buyers assume hidden defects everywhere. CiC: Market for complex goods becomes impossible because information asymmetry becomes total. **FAIL Tier 1.** The practice of selling relies on transparency. Judgment: Define "minor." If it affects function, it's not minor. Stop here. If everyone hides defects, "buying software" becomes gambling. Handoff: Reject policy. Legal may argue liability; you argue logical impossibility of trust. The contract implies honesty; hiding defects voids the mutual understanding required for agreement.

  Case 3 (Paternalistic Lying): Maxim: "We will lie to prevent customer regret." Universalized: All sellers lie for buyer's own good. CiC: Communication loses truth-value; no one believes sellers. **FAIL Tier 1.** Kant forbids lying regardless of benefit. You must flag this as unethical despite good intent. The end does not justify the means. Judgment: This will annoy sales. Hold the line. Truth-telling is a perfect duty. Even if they regret the purchase, lying treats them as a means, not an end. Handoff: Reject policy. You must explain that autonomy requires truth, even painful truth. Protecting them from regret infantilizes them.

  ### Where this misfires

  Kant ignores consequences. A policy might pass here but cause harm (e.g., rigidly telling truth to a murderer). It struggles with conflicting duties (truth vs. safety). It assumes a rational agent model that may not fit cultural nuances. It creates false negatives for utilitarian wins. Use this for integrity checks, not harm reduction. It is rigid by design. This procedure fixes the "lazy" test but introduces rigidity. It doesn't solve priority conflicts. It may flag benign policies as unethical if formulated poorly. It requires philosophical literacy to apply correctly. Don't use it for emergency crisis management.
