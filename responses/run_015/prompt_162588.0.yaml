prompt: |-
  my supervisor keeps killing my chapter 3 with the same move. every time I say there's something structurally weird about a legal order whose rule of change can itself be changed by that very rule, she says: relax, it's just Neurath's boat — you rebuild the ship plank by plank while staying afloat, you never need a dry dock, and self-amendment is no more paradoxical than that. the conclusion she draws from it is that the whole paradox-of-legal-self-reference literature is a pseudoproblem: no Grundnorm needed, no constituent power hovering outside the system, and entrenchment clauses are just politics with extra steps. so I should stop writing about it.

  I want to push back in our next meeting but I need to actually know how far the boat image carries. I think it quietly imports a bunch of things a legal order doesn't have: that replacing a plank is a causal operation rather than a norm-governed one, that nothing in the boat plays the role of a rule about what counts as a valid plank, that the sea is holding you up by buoyancy rather than by validity, and that there's no boat-officer deciding whether the swap was done properly. but I can't tell which of those disanalogies matter for her conclusion and which are just decoration.

  three cases I keep getting stuck on, which I don't think the boat can even represent:

  1. the package repeal. order L has rule A (say, a tax ceiling), rule B (A can only be amended by two-thirds plus a referendum), and rule C (B can be amended by simple majority). the assembly passes one instrument, by simple majority, repealing B and raising the ceiling in the same act. plank-by-plank it's fine; as one act it looks like the A-part is done under a rule that no longer exists by the time it bites. does the image have any resources for the order of operations, or does it just stipulate that there is one?
  2. the upward ratchet. suppose instead they want to entrench A, raising the threshold from simple majority to two-thirds plus referendum. the entrenching act is authorised by the old, lower rule, but it purports to withdraw from future majorities the very power that authorised it. loosening is trivially fine; tightening looks like it needs a source of authority the old rule doesn't supply. call it the ratchet asymmetry. is that real, or am I inventing a problem?
  3. the unamendable plank. a clause saying this clause may never be amended. in the boat that's just a plank with a label on it, and nothing enforces labels. in a legal order there's a court, and the court's jurisdiction to strike things down is itself a plank that can be swapped.

  please don't cite anything or point me at reading, I've read the literature and I need the argument, not sources. can you give me:

  - "The mapping" (~150 words): a table of what plays the ship, the planks, the sea, the dry dock, the carpenter, and the voyage, on the most charitable reading of her use of it.
  - "Where it holds" (~200 words): what the image genuinely gets right about self-amendment that a flat circularity objection misses.
  - "Where it breaks" (~400 words): the disanalogies, seperated into the ones that are load-bearing for her conclusion and the ones I should drop.
  - "The three cases" (~350 words): run all three through the image and tell me where each one bottoms out.
  - "Does her conclusion survive" (~200 words): can no-Grundnorm, no-constituent-power, and entrenchment-is-just-politics all three be carried by the boat, or is one of them doing its own work.
  - "A better image" (~150 words): if the boat is the wrong object, what should I reach for instead — bootloader, contract with an amendment clause, game whose moves change the rules, something else — and what does the replacement buy that Neurath doesn't.
