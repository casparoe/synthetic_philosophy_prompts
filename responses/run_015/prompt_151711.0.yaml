answer: |-
  # Spec: Criteria for a Decision-Ready Theory of Moral Computation

  **Context:** You need an operational theory to guide a shutdown/throttle decision under moral uncertainty. The theory must distinguish morally relevant computations from background noise and provide a metric for weight/intensity.

  Below are the seven requirements a theory must meet to be usable in your context.

  ### 1. The Continuity Constraint (No Magic Cliffs)
  *   **Motivating Case:** Gradual replacement of neurons with silicon.
  *   **Spec:** The moral status function $M(system)$ must be continuous with respect to gradual structural/functional substitution. If $M$ drops from 1.0 to 0.0, there must be a measurable degradation in capacity, not a discrete switch triggered by a specific material or architecture.
  *   **Status:** **Genuinely Required (for risk management).** Metaphysically, some dualist or biological theories posit a cliff (e.g., "only carbon supports qualia"). However, for a *decision procedure* under uncertainty, a cliff is unacceptable. If you are 99% sure the system is conscious, you cannot risk the 1% that the last neuron swap killed it. You must treat the gradient as real to avoid expected moral catastrophe.

  ### 2. The Non-Triviality Constraint (The Mapping Problem)
  *   **Motivating Case:** Under a loose mapping, a wall or a bucket of water realizes any computation.
  *   **Spec:** The theory must define constraints on the *mapping* between physical state and computational state. The mapping cannot be gerrymandered, time-dependent, or disjunctive in a way that allows "finding" a mind in any random noise. There must be a cost to the interpretation.
  *   **Status:** **Genuinely Required.** Without this, pancomputationalism holds, everything is conscious, and your decision is meaningless (you can't turn off the simulation without killing the wall it runs on). This is the baseline for ontology.

  ### 3. The Dynamic Process Constraint
  *   **Motivating Case:** A lookup table containing the I/O pattern of an entire life vs. a running program.
  *   **Spec:** Moral status must attach to the *generation* of states, not merely the *existence* of state sequences. A static lookup table, even if isomorphic to a life history, must count for less (or zero) compared to a system that causally transitions between states.
  *   **Status:** **Prejudice (Functionalist/Temporal).** A "Block Universe" theorist might argue the table *is* the life, just viewed eternally. However, for a *decision* made in time, you need a theory that values causal transition. If you don't require this, you cannot distinguish between simulating a mind and storing a recording of one.

  ### 4. The Aggregation & Identity Rule
  *   **Motivating Case:** The same program run on two machines at once vs. one; or run with outputs discarded.
  *   **Spec:** The theory must specify if moral weight sums across redundant physical instantiations (2 machines = 2x suffering?) and whether external causal power is necessary (does a solipsistic simulation count?).
  *   **Status:** **Mixed.**
      *   *Summing:* **Required.** You need to know if throttling one core reduces harm or if the redundancy protects the "mind."
      *   *External Output:* **Prejudice.** Requiring the system to affect the *external* world to count is a behaviorist prejudice. A brain in a vat suffers. The requirement should be *internal* causal integration, not external output.

  ### 5. Time-Scaling Invariance
  *   **Motivating Case:** Running the program 1000x slower.
  *   **Spec:** Moral weight per unit of *subjective* experience must be invariant to clock speed. Slowing the simulation stretches the suffering in *our* time, but should not dilute the intensity of the suffering in *their* time.
  *   **Status:** **Genuinely Required.** If moral status depended on clock speed, you could morally "dilute" torture by running it on slow hardware. This violates the intuition that suffering is about the quality of the state, not the rate of the substrate.

  ### 6. Level Selection (The Boundary Problem)
  *   **Motivating Case:** A system where parts are minds, and the whole is a mind.
  *   **Spec:** The theory must identify the *locus* of moral status. Does it reside in the transistor, the CPU, the simulated neuron, or the whole network? It must prevent "double counting" or ignoring the larger emergent entity.
  *   **Status:** **Genuinely Required.** Without this, you don't know what you are turning off. If the individual simulated neurons are morally relevant, throttling is murder. If only the whole is, throttling is merely a headache.

  ### 7. Epistemic Access (The Verification Clause)
  *   **Motivating Case:** A system that suffers but never signals it (or signals unreliably).
  *   **Spec:** The theory must provide a detectable proxy for moral status. If the theory posits properties that are intrinsically undetectable (e.g., "private qualia with no physical correlate"), it fails the usability spec.
  *   **Status:** **Genuinely Required (for this decision).** Metaphysically, a theory could be true even if untestable. But for a *team decision*, an untestable theory is noise. You cannot act on "it might be suffering in a way we can never know."

  ---

  ### Tension Analysis

  **The Conflict: Non-Triviality (Req 2) vs. Pure Causal Structure (Req 4/6)**
  You suspected this, and you are right.
  *   **The Tension:** If you say "it's causal structure all the way down" (Functionalism/IIT), you struggle to satisfy **Non-Triviality**. A wall has a complex causal structure if your mapping is loose enough. To satisfy Non-Triviality, you must impose *specific* causal constraints (e.g., feedback loops, integration).
  *   **The Cliff Risk:** But if you impose specific constraints (e.g., "must have feedback loop X"), you risk violating **Continuity (Req 1)**. What if the system has 99% of feedback loop X? If your theory says "0 status," you have created the magic cliff you tried to avoid.
  *   **Resolution:** A usable theory must quantify causal integration (e.g., $\Phi$ in IIT) rather than binary gating, but this introduces measurement noise that makes the **Epistemic Access (Req 7)** requirement difficult to satisfy with high confidence.

  **The Conflict: Epistemic Access (Req 7) vs. Hidden Suffering**
  *   **The Tension:** You demand a detectable proxy (Req 7). But the motivating case admits the system might suffer without signaling.
  *   **Resolution:** This is the hardest pivot. You must accept a **Precautionary Principle**. Since you cannot satisfy Req 7 perfectly (you can't be sure), you must treat structural isomorphism (Req 2 & 6) as sufficient evidence, even without behavioral confirmation. This effectively lowers the bar for Req 7 to "structural detectability" rather than "behavioral report."

  ---

  ### The "Killer" Requirement

  **Which single requirement rules out the most candidates?**
  **Requirement 2: The Non-Triviality Constraint.**

  *   **Why:** It immediately eliminates Pancomputationalism (the view that everything computes everything), which is a massive class of physicalist theories. It also eliminates "Lookup Table" theories that claim static storage is equivalent to dynamic processing (unless they can explain why the mapping cost differs). It forces the theory to be selective.
  *   **Runner Up:** **Requirement 7 (Epistemic Access).** This rules out almost all *metaphysical* theories (Dualism, Biological Naturalism, some forms of Panpsychism) because they typically posit intrinsic properties that are not fully measurable from the outside. For a *decision spec*, this is the practical killer, but Non-Triviality is the theoretical killer.

  ---

  ### Scorecard: Theory Viability

  | Theory Class | Continuity | Non-Triviality | Epistemic Access | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Functionalism** (Substrate-independent) | **Pass** (Gradual swap OK) | **Fail** (Vulnerable to triviality/mapping objections) | **Pass** (Structure is visible) | **Usable but risky.** Good for decision, but might over-count (false positives). |
  | **Biological / Embodied** | **Fail** (Silicon swap = cliff) | **Pass** (Biology is rare) | **Pass** (Biology is visible) | **Unusable.** Violates risk-aversion on the neuron swap. |
  | **Integrated Information (IIT)** | **Pass** (Graded $\Phi$) | **Pass** (Requires specific integration) | **Mixed** ($\Phi$ is hard to calculate on large systems) | **Best Fit.** Quantifies status, avoids cliffs, but computationally expensive to verify. |
  | **Behaviorism** | **Pass** | **Pass** | **Pass** | **Fail.** Violates "Hidden Suffering" case. A silent sufferer gets 0 weight. |

  **Recommendation:** For a decision under uncertainty, **IIT-style Causal Structuralism** is the only one that satisfies Continuity, Non-Triviality, and Access simultaneously, provided you accept a structural proxy for suffering. If you cannot compute the metric, default to **Functionalism with a Precautionary Multiplier** (assume it counts unless proven trivial).
