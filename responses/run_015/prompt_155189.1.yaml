  We ask who makes the engine run
  Who has the power to make it stop
  We stand and wait
  We strain our eyes to see
  We think we know
  Who gets to choose

  No single hand to choose
  The speed at which we run
  We say we know
  But nothing seems to stop
  We need to see
  We refuse to wait

  I cannot wait
  Though I did not choose
  The others cheat, I see
  If everyone will run
  I cannot stop
  The cost I know

  The boss will know
  If I slow down to wait
  The smoke won't stop
  Because one firm won't choose
  To let others run
  While we watch and see

  The trap we see
  It is there, we know
  But still we run
  For trust we wait
  We cannot choose
  To make the motion stop

  There is no one to stop
  No eyes left to see
  No hand to choose
  The map we know
  In vain we wait
  The seat is empty while we run

  We choose a pact that makes us stop
  We know the truth we all must see
  We break the wait and run

  ***

  The six end-words are **run, stop, wait, see, know, choose**. I selected them because they are simple actions that shift meaning across the poem: initially they describe what individuals do, but by the end, they describe the system itself. The turn occurs at the final line of the sixth stanza ("The seat is empty while we run"), where the poem reveals that there is no villain driving the trap. This prepares the envoi to argue that the solution requires a simultaneous, binding agreement rather than individual restraint.
