prompt: |-
  I'm a journalist — I cover science and ideas, mostly — and I'm working on a piece about how different countries decide what actually counts as corruption, so I've been going through the published rulings of one national integrity commission (I'll keep it anonimous). Their track record so far:

  - a minister gave a road contract to a firm that had given his daughter an unpaid internship the year before; the firm scored top on the technical eval anyway — corrupt
  - a district water officer gave a maintenance contract to her own clan's cooperative; fair price, good work, and everyone locally says that's what the office is for — corrupt
  - an officer mediated a land dispute and then accepted a goat and a meal from the winning family, as local custom requires — not corrupt
  - a councillor bought a generator for a clinic out of her own salary, and the neighbourhood swung to her party — not corrupt
  - a financial regulator took a job at a bank he had supervised, six months after leaving, with no decision shown to have been bent — corrupt
  - a supplier funded scholarships at the ministry's own training college while its contract was up for renewal; no individual official gained — corrupt

  Next month they've got a new one, and it's the reason I'm writing the piece. The ministry has replaced discretionary tender scoring with an automated formula run on uploaded documents. A supplier paid a mid-level official, off duty and off the books, to help them format and upload their submission so it scores higher. No lies, every document true, she has no override, and she has no official duty to advise suppliers at all.

  What will they rule, and what rule are they really running? I can see at least two that fit all six precedents — something like corruption is a private consideration displacing the reasons the office exists to act on, versus something like corruption is any practice that, allowed generally, would build a market in official access or wreck the trust the office needs — and they come apart on this case. Give me your best guess with the reasoning, tell me which precedent is the closest analog and which one cuts the other way, and name the single further case that would settle which rule they're on. Also worth saying whether their willingness to condemn the clan contract that everyone locally accepts means they're quietly running a Western definition. No literature review, please — I want the argument, not the reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
      *   **User:** Journalist covering science and ideas.
      *   **Topic:** How different countries define corruption (specifically looking at rulings of an anonymous national integrity commission).
      *   **Input:** Six past rulings (3 corrupt, 3 not corrupt) and one upcoming case.
      *   **Task:** Predict the ruling on the upcoming case, identify the underlying rule/principle the commission is using, identify the closest analog and the counter-analog among the precedents, propose a single further case that would distinguish between the two competing theories, and comment on the "Western definition" aspect regarding the clan contract.
      *   **Constraint:** No literature review. Just the argument.

  2.  **Analyze the Precedents (The Data Set):**

      *   *Case 1 (Minister/Road/Internship):* Corrupt.
          *   Facts: Contract to firm, firm gave daughter unpaid internship. Firm scored top technically.
          *   Key Element: Personal benefit (daughter) linked to official action, even if merit existed.
          *   Implication: Conflict of interest/Undue influence matters more than outcome efficiency.

      *   *Case 2 (Water Officer/Clan Cooperative):* Corrupt.
          *   Facts: Contract to own clan's coop. Fair price, good work, local expectation.
          *   Key Element: Favoring kin/group. Local norms say it's okay/expected. Commission said no.
          *   Implication: Universalism over particularism. Public office is for the *public*, not the *clan*, regardless of local custom or outcome quality.

      *   *Case 3 (Land Dispute/Goat & Meal):* Not Corrupt.
          *   Facts: Mediation, accepted goat/meal per local custom.
          *   Key Element: Token gift, customary, post-facto, low value, social cohesion.
          *   Implication: De minimis/Cultural exceptions allowed if they don't influence the *decision* (mediation happened before).

      *   *Case 4 (Councillor/Generator/Party Swing):* Not Corrupt.
          *   Facts: Bought generator with own salary. Neighborhood voted for her party.
          *   Key Element: Personal expenditure, political gain (indirect).
          *   Implication: Using private resources for public good is okay, even if it yields political capital. No public resource misused.

      *   *Case 5 (Regulator/Bank Job):* Corrupt.
          *   Facts: Took job at supervised bank 6 months after leaving. No bent decisions shown.
          *   Key Element: Revolving door. Future benefit. No specific *quid pro quo* proven.
          *   Implication: Structural integrity/Independence matters. Appearance of corruption or potential for future bias is enough.

      *   *Case 6 (Supplier/Scholarships/No Individual Gain):* Corrupt.
          *   Facts: Supplier funded scholarships at ministry college during contract renewal. No individual official gained.
          *   Key Element: Institutional benefit (college), not personal pocketing. Timing (during renewal).
          *   Implication: Corruption isn't just personal enrichment. It's about undue influence on the *process* via benefits to the *institution* or collective.

  3.  **Analyze the Competing Theories (provided by user + refinement):**

      *   *Theory A (Private Consideration):* Corruption is a private consideration displacing the reasons the office exists to act on. (Focus: Motivation/Intent/Conflict).
      *   *Theory B (Systemic Trust/Market in Access):* Corruption is any practice that, allowed generally, would build a market in official access or wreck the trust the office needs. (Focus: Systemic Integrity/Equality of Access).

      *   *Refining the distinction based on the data:*
          *   Case 2 (Clan) kills the idea that "public good outcome" excuses partiality. It supports Theory B (Systemic Trust/Universalism).
          *   Case 6 (Scholarships) kills the idea that "no personal gain" excuses influence. It supports Theory B (Market in Access/Institutional Integrity).
          *   Case 1 (Internship) supports both, but leans B because technical merit didn't matter.
          *   Case 5 (Revolving Door) strongly supports Theory B (Systemic Trust) because no bent decision was needed.
          *   Case 3 (Goat) supports Theory A slightly (no displacement of reason) but fits B if viewed as *not* creating a market in access (too small/customary).
          *   Case 4 (Generator) supports Theory A (private money, public reason) and fits B (no market in access created).

      *   *The Crucial Tension:* Is corruption about *personal gain vs. public duty* (Traditional) OR is it about *equality of access to the state* (Systemic)?
      *   Case 6 is the pivot. If the official didn't gain personally, but the *institution* did, and it's still corrupt, the commission cares about the *purity of the process*, not just the pocket.

  4.  **Analyze the Upcoming Case:**

      *   *Facts:* Automated formula tender. Supplier paid mid-level official (off duty, off books) to format/upload submission to score higher. No lies, documents true. Official has no override, no duty to advise.
      *   *Key Nuance:* The official didn't change the score directly (no override). She helped *optimize* the submission for the algorithm. She was paid privately.
      *   *Theory A (Private Consideration):* Did private consideration displace public reason? The official performed a private service for pay. But did it displace the office's reason? The office's reason is to select the best bid via formula. The bid *was* the best according to the formula. However, the *access* to the formula's logic was monetized.
      *   *Theory B (Systemic Trust/Market in Access):* Does this build a market in official access? Yes. If suppliers can pay officials to help them "game" the upload/formatting to score higher, access to the state is now auctioned to those who know to pay the insider. It wrecks trust in the "blind" nature of the automated system.

      *   *Prediction:* **Corrupt.**
      *   *Reasoning:* The commission has consistently ruled against anything that compromises the *structural integrity* of the process, regardless of outcome quality (Case 1, 2, 5, 6). The "no lies" defense fails in Case 1 (technical score was top anyway) and Case 5 (no bent decisions). The "no official duty" defense fails because the *appearance* of paid access is the damage.

