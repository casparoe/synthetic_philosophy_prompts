          *   *Actually, the strongest analog is Case 1.* Minister gave contract, firm gave benefit. Outcome was merit-based. Ruling: Corrupt. New Case: Official helped firm, firm gave benefit. Outcome was merit-based (by algorithm). Ruling: Corrupt.
