answer: |-
  The air in the Conservatory of Affective Resonance did not smell of wood polish or rosin, but of ozone and held breath. Elara stood before Pedestal Four, her clipboard pressed against her chest like a shield. On the velvet cushion lay the object. It possessed a bell like a trumpet, yet it was strung with gut like a cello. The metal was tarnished to the color of a bruised plum.

  Alone in the room, the instrument hummed at a frequency Elara felt in her molars. It was a low, steady vibration. She uncapped her fountain pen. The ink was black, permanent, intended for fixed truths.

  *Classification:* she wrote. *Sub-zero Resignation. Material: Oxidized Copper.*

  The words looked solid on the page. They anchored the object. She reached out to touch the bell. It was cool to the touch, not with the chill of metal, but with the specific coldness of a hand that has been left outside too long. She nodded, satisfied. The taxonomy held.

  Then, the heavy oak door creaked.

  Thomas, the night watchman, stepped inside to check the humidity gauge. He wore heavy boots and carried the scent of stale coffee and rain. He did not speak, did not look at the instrument, merely glanced at the wall meter and turned to leave. But his presence was a stone dropped in a pond.

  The hum from the pedestal shifted. The vibration in Elara's teeth sharpened, becoming a jitter. The coolness of the bell seemed to radiate outward, prickling her fingertips. She looked down at her clipboard.

  *Sub-zero Resignation.*

  The word *Resignation* seemed to swell on the paper, the letters stretching like taffy. It no longer fit the sound. The sound was not resigned; it was waiting. It was watching the door. Elara crossed out *Resignation* with a single, aggressive stroke. She wrote *Vigilance*.

  But *Vigilance* felt too human. The instrument wasn't human. It was metal. Was it? She looked at the body. The tarnish seemed to have grain, like wood darkened by age. The copper was behaving like oak. She hesitated, the pen hovering. If the material shifted, the temperature must shift. Wood held heat differently than metal.

  *Classification:* *Alerted Wood. Temperature: Tepid.*

  She wrote it, but the ink seemed to bead on the surface, refusing to soak in. Thomas closed the door. The latch clicked.

  The click was a catalyst. The hum spiked into a whine. The object on the velvet was no longer waiting; it was urgent. It was demanding. The temperature surged. Elara pulled her hand back from the bell; it burned now, not with fire, but with the fever-heat of a flushed cheek.

  *Tepid* was a lie. *Wood* was a lie.

  She scraped the pen across the page, tearing the paper. She needed new coordinates. The urgency reminded her of a string section rushing toward a crescendo, but the sound was brass, bright and biting. Yet the grain on the body was undeniable now, swirling like watered silk.

  *Classification:* *Feverish String. Material: Veined Marble.*

  She stopped. *Marble?* She hadn't even thought of stone. Where had that come from? She looked at the object. It was smooth, heavy, cold again. The fever broke as quickly as it had arrived. The room was silent save for the settling of the building's bones.

  Elara rubbed her temples. The categories were supposed to be mutually exclusive. An instrument could not be Wood and Marble. It could not be Tepid and Feverish. Unless the listener dictated the state. Thomas was vigilant, so the instrument was vigilant. But who was she?

  She tried to steady her hand. She needed a baseline. She closed her eyes and listened. The sound was a low thrum. It felt like... grief. No, not grief. Grief was too heavy. It was lighter. Regret? No.

  *Classification:* *Nostalgic Brass.*

  She opened her eyes. The word *Nostalgic* looked unfamiliar. The *N* looked like an *M*. *Mostalgic*. The *B* in *Brass* looked like a *G*. *Grass*.

  *Mostalgic Grass.*

  The absurdity prickled at the back of her neck. She was tired. That was all. The fluid boundaries of the Conservatory were seeping into her syntax. She took a breath, inhaling the ozone. She looked at the instrument. It was vibrating again. Someone was in the hallway. Footsteps. Approaching.

  The door handle turned.

  A woman entered. A donor, dressed in silk that whispered against itself. She carried a purse that clicked with beads. She looked at the pedestal, smiled politely, and asked, "Is this the one that sings?"

  Elara opened her mouth to speak, but the sound in the room changed instantly. The hum became a melody, sweet and cloying. The temperature dropped to a crisp, autumnal chill. The object looked like gold now. Bright, polished gold.

  *Classification:* *Amiable Gold. Temperature: Crisp.*

  Elara wrote it, but her hand shook. The word *Amiable* slid on the paper. It looked like *Animable*. *Animus*. The donor shifted her weight. The melody sharpened, becoming predatory. The gold tarnished back to plum in the span of a heartbeat. The chill became a freeze.

  *Classification:* *Predatory Plum. Temperature: Absolute Zero.*

  The donor frowned. "It looks rather dull, doesn't it?"

  The instrument shrieked. A high, thin sound, like glass cracking. Elara dropped her pen. It rolled across the clipboard, leaving a trail of ink that looked like a crack in the paper.

  *Glass.* It was glass now. She could see through the bell. She could see the dust motes dancing inside the flare.

  "Don't touch it," Elara said, her voice sounding distant, as if spoken through water.

  The donor stepped back. The shriek subsided into a whimper. The glass softened, becoming pliable, like wax. The temperature rose to a humid swamp-heat. Elara felt sweat gather at her hairline.

  She looked at the clipboard. The page was a mess of cross-outs and tears. The words were losing their edges. *Gold* bled into *Mold*. *Zero* bled into *Hero*. The categories were not just shifting; they were cannibalizing each other. If the instrument was defined by the listener, and the listener was defined by their own shifting moods, then the taxonomy was a snake eating its own tail.

  Elara picked up the pen. She needed to pin it down. She needed a word that didn't slip. A word that was solid as stone.

  *Classification:* *Fixed.*

  She wrote *Fixed*. The ink dried instantly. She looked at the instrument. It was still. Silent. Cold.

  *Material:* *Stone.*

  She wrote *Stone*.

  The donor cleared her throat. "I think I'll go now."

  As the woman turned, the instrument exhaled. A long, low note that smelled of burnt sugar. The stone surface rippled. It became liquid. The temperature spiked to boiling.

  *Fixed* on the paper began to run. The letters dissolved into blue smudges. *Stone* dripped down the page.

  Elara stared at the runoff. The ink pooled at the bottom of the clipboard, forming a new shape. It wasn't a word anymore. It was a map. A topography of the room.

  She realized then that she was the variable. Her own attention was the heat source. When she focused on the sadness, it froze. When she focused on the anger, it burned. She was cooking the catalog.

  She set the clipboard down on the pedestal, next to the instrument. The object was neither wood nor brass nor glass. It was a vessel. It was waiting for a shape to pour into it.

  Elara stepped back. She walked to the door. She placed her hand on the latch.

  If she left, the room would return to its baseline. The instrument would settle into whatever it was when no one was watching. Perhaps it was nothing. Perhaps it was everything.

  She opened the door. The hallway was empty. The silence rushed in to fill the space she left behind.

  From the pedestal, a sound emerged. It was not a hum, not a whistle. It was the sound of a pen scratching against paper.

  Elara did not look back. She walked into the hallway, leaving the catalog open, the ink still wet, the categories dissolving into one another like sugar in hot tea. She would write the report later. She would use different words. She would try to find a language that didn't melt when held.

  But as she walked, the word *Hallway* felt soft in her mind, like *Hollow*. The *Light* felt heavy, like *Lead*. The boundaries of the conservatory were not contained by walls. They were contained by the words she used to build them, and the words were tired of holding the shape.

  She reached for the light switch, but her hand passed through it. It was not a switch. It was a concept. It was *Off*.

  She stood in the dark, listening to the instrument in the other room classify her.
