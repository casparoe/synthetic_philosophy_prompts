      *   **Plot:** She attempts to catalog a single instrument that keeps sliding between categories (e.g., melancholy brass to urgent wood).
      *   **Theme:** Her descriptive vocabulary warps under the pressure of fluid boundaries (Copycat-style analogical slippage without explicit exposition).
      *   **Constraints:** No citations, bibliographies, or references to philosophical texts. Focus on concrete sensory detail and character psychology.

  2.  **Deconstruct the Core Concept (Categorical Instability/Copycat-style slippage):**
      *   *Copycat* is a cognitive architecture model that deals with analogy-making and concept slippage (e.g., if 'abc' becomes 'abd', what does 'ijk' become? 'ijl' is standard, but under pressure, maybe 'ijd' or 'xyz').
      *   In the story, this needs to be narrative, not theoretical. The *labels* themselves need to feel unstable. The *perception* of the instrument needs to drift.
      *   The "emotional temperature" is the classification system. Hot/Cold isn't enough; it needs nuance (e.g., "Frigid Resignation," "Boiling Panic," "Lukewarm Nostalgia").
      *   The shift happens when a *listener* enters. This implies the observer affects the observed (quantum observer effect metaphorically applied to taxonomy).

  3.  **Character & Setting Development:**
      *   **Protagonist:** Elara. Meticulous, perhaps anxious about order. She relies on language to pin down reality.
      *   **Setting:** The Conservatory of Affective Resonance. Dust motes, velvet, glass cases, silence that hums.
      *   **The Object:** A specific instrument. Let's make it ambiguous. Not clearly a violin or a trumpet. Maybe a hybrid. A "stringed wind" or something unnamed. Let's call it Object 44-B for now, but give it physical presence. Polished wood, brass fittings.
      *   **The Conflict:** Elara tries to write the catalog entry. The entry changes as people walk by outside the room or enter briefly.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Establish the setting and the task. Elara is alone. The instrument is stable. She chooses a label.
      *   **Inciting Incident:** A listener enters (a guard, a visitor, a colleague). The taxonomy shifts.
