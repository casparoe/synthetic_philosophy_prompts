      *   **Climax:** The instrument is in a state of maximum flux. Elara's vocabulary collapses. She tries to force a definition.
      *   **Resolution:** A moment of acceptance or exhaustion. The catalog remains blank or written in a new, unstable language.

  5.  **Focusing on Sensory Detail & Vocabulary Warping:**
      *   Instead of saying "the category changed," describe the *feel* of the change.
      *   *Vocabulary Warping:* She writes "melancholy," then crosses it out for "grief," then "grief" looks like "graft," then "craft." Or, the temperature scales shift. "Cool" becomes "distant." "Warm" becomes "feverish."
      *   *Copycat Slippage:* If the category is "Sad Brass," and someone enters, does it become "Sad Wood"? Or "Angry Brass"? Or "Sad Iron"? The relationships should slide.
      *   *Show, Don't Tell:* Do not explain the theory. Just show the ink smudging, the hesitation, the physical reaction to the sound.

  6.  **Refining the "Emotional Temperature":**
      *   Let's use specific terms. "Sub-zero Despair," "Tepid Contentment," "Incandescent Rage."
      *   The instrument: A horn-like object with strings. A "stringed horn."
