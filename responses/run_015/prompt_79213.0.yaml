answer: |-
  You have hit upon precisely the right nerve. Your hunch is not only correct; it is the pivot upon which the history of cognitive science turns. You are struggling because Hobbes is straddling a line that later thinkers spent three centuries trying to draw sharply: the line between *reasoning as a logical structure* and *reasoning as a physical process*.

  Here is the plain truth of what Hobbes is claiming in *De Corpore*, what he is missing, and how you can safely write about it without falling into anachronism.

  ### 1. What does he mean by "Computation"?

  When Hobbes says ratiocination is computation, he is not talking about arithmetic in the narrow sense (calculating sums of money or distances). He is talking about **logic as a calculus**.

  For Hobbes, every name (or concept) marks a class of things.
  *   To say "A man is a living creature" is to **add** the concept 'living' to the concept 'man'.
  *   To say "A man is not a stone" is to **subtract** the concept 'stone' from the concept 'man'.

  He is claiming that all valid inference is merely the keeping of accounts with concepts. If you have a clear definition of your terms, reasoning becomes mechanical. You do not need "insight"; you need only to ensure you haven't added a concept that contradicts another.

  **Fair Claim:** Hobbes is arguing that logical inference is reducible to the combinatorial manipulation of symbols (names) according to fixed rules of inclusion and exclusion.
  **Overreach:** Hobbes is arguing that the brain processes information like a digital computer. He has no notion of binary code, states, or algorithms. His "computation" is closer to bookkeeping than to Turing machines.

  ### 2. Mechanism vs. Logic: Is it a claim about machinery?

  This is where your second question lands. Is he a proto-computationalist or a logician?

  Hobbes is a thoroughgoing materialist. He believes everything that exists is "body" (matter in motion). Therefore, thinking *must* be a motion in the head. When he says reasoning is addition and subtraction, he is making an ontological claim, not just a logical one. He believes the *physical motion* of thought literally follows the structure of addition and subtraction.

  However, he is not a computationalist in the modern sense because he lacks the concept of **multiple realizability**. For a modern computationalist (like Jerry Fodor or Hilary Putnam), it does not matter if the computer is made of silicon, neurons, or water pipes; the computation is defined by the formal relationships. For Hobbes, the computation is inextricably tied to the specific material motion of the human brain. He is a mechanist, yes, but a biological mechanist, not a functionalist.

  **Fair Claim:** Hobbes is a mechanist about the mind. He believes thinking is a causal, physical process that can be described mechanically.
  **Overreach:** Hobbes believes the substrate doesn't matter. For Hobbes, the matter *is* the motion. You cannot separate the "software" of reasoning from the "hardware" of the brain, because the distinction did not exist for him.

  ### 3. Why isn't this the Computational Theory of Mind (CTM)?

  Your hunch here is spot on: *Hobbes's adding still needs an intelligent someone doing the adding.*

  In modern CTM, the magic trick is **syntax without semantics**. A computer can manipulate the symbol 'MAN' according to rules without knowing what a man is. The meaning is preserved because the syntax is designed to track truth conditions, but the machine itself is blind to meaning.

  For Hobbes, the "computation" only works because the reasoner **knows the definitions**. If I add 'rational' to 'body', I get 'man' only because I already understand what those words signify. The "intelligence" is not in the adding; the intelligence is in the prior stipulation of the names. Hobbes has not yet discovered the idea that the manipulation *itself* could constitute the thinking. He thinks the manipulation *reveals* the thinking that is already latent in the definitions.

  Furthermore, Hobbes lacks the notion of a **programme**. He has operations (add, subtract), but he has no control structure. He has no "if-then," no loops, no conditional branching. His computation is a straight line of deduction, not a state machine.

  **Fair Claim:** Hobbes identifies reasoning with symbol manipulation, anticipating the syntactic view of thought.
  **Overreach:** Hobbes solves the problem of meaning. In his system, the mind must still grasp the meaning of the symbols to manipulate them correctly. He has not automated understanding.

  ### 4. The "Without Words" Example

  You asked what the example of the man seeing something from far off is doing. This is crucial for your piece.

  Hobbes writes: *"in our silent thoughts, without the use of words."* He describes a man seeing a distant object. First, he thinks 'body'; then, that it moves, so 'animated'; then, that it speaks, so 'rational'. He compounds these into 'man'.

  Does this help or hurt the computational reading?
  *   **It helps** the idea that computation is internal. It shows Hobbes believes the "adding" happens in the mind before speech is uttered. Thought is internal discourse.
  *   **It hurts** if you think "symbols" must be public language.

  For Hobbes, the "symbols" here are **mental markers**. He calls them "marks and signs." A mark is for yourself (to recall a thought); a sign is for others (to communicate). In the "without words" example, the thinker is using mental marks.

  The point of this passage is to show that **discursive thought is sequential.** You cannot think 'man' all at once; you must run through the sequence: body + animated + rational. This sequential processing is the "computation."

  **Fair Claim:** Hobbes argues that even non-verbal thought has a combinatorial, sequential structure akin to language.
  **Overreach:** Hobbes is describing non-symbolic thought. He is describing thought *using* mental symbols (marks), not pure intuition. He is trying to show that even silent contemplation is a form of "naming."

  ### 5. Summary for your Piece: Fair Claims vs. Overreach

  If I were editing your copy, here is the box I would put in the margin:

  **What is fair to claim:**
  *   Hobbes is the first to explicitly equate reasoning with computation (adding/subtracting).
  *   He is a materialist who believes this computation is a physical motion in the head.
  *   He anticipates the idea that thought has a syntax (a structure of combination) independent of immediate speech.
  *   He views the mind as a passive processor of sensory data that combines them according to fixed rules.

  **What is overreach:**
  *   Calling Hobbes a "computationalist" without heavy qualification. He lacks the concept of an algorithm, a programme, or syntax independent of semantics.
  *   Suggesting Hobbes thought machines could think. He believed thinking was a specific motion of organic matter; he did not imagine artificial substrates could replicate it.
  *   Implying Hobbes solved the problem of intentionality (how symbols get meaning). For Hobbes, symbols get meaning from original sensory experience, not from their role in a system.

  ### The Verdict on Your Hunch

  You wrote: *"The new ingredient is the programme, not the arithmetic."*

  That is a brilliant summary. Hobbes has the arithmetic (the operations of logic). He lacks the programme (the control structure that allows a system to decide *which* operation to perform next without a homunculus deciding for it).

  Modern CTM says: The system follows the programme automatically.
  Hobbes says: The mind follows the logic because it understands the goal.

  Hobbes is the grandfather of the idea, but he is stuck in the nursery. He saw that thinking looks like calculating, but he couldn't conceive of a calculator that didn't need a calculator. He naturalised the mind, but he didn't mechanise it quite enough to let the machine run itself.

  Write it that way, and you will have the history right.
