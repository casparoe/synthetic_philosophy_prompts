answer: |-
  Here are eight candidate concepts: Pluralistic Ignorance, Social Convention, Path Dependence, Status Quo Bias, Institutional Inertia, Normative Cascade, Empty Ritual, and False Consensus.

  Testing these against your features reveals gaps. **Pluralistic Ignorance** fails feature (d): here, everyone knows everyone else dislikes the rule, so the ignorance isn't about private feelings. **Social Convention** handles feature (b) well but fails (a): conventions like driving on the left exist to prevent crashes; your practices have no coordination payoff. **Path Dependence** explains feature (c) but fails (d): usually, switching is costly (like retraining typists); here, switching is free if done together. **Status Quo Bias** addresses (d) but is individual psychology, failing (b): it cannot explain why the group stays stuck when every individual wants to move. **Institutional Inertia** fits (c) but implies formal bureaucracy, whereas your teams are informal. **Normative Cascade** fails (d) because the information that the rule is bad is already public. **Empty Ritual** captures (a) but fails (b): rituals are usually voluntary or spiritual, not enforced by peer expectation. **False Consensus** fails (b) because the consensus is known to be negative, not mistaken.

  **Verdict:** No established concept covers the whole configuration. The combination of open mutual dissatisfaction, absent coordination benefits, and low switching costs is distinct.

  I propose calling this a **Zombie Norm**.

  **Definition:** A collective practice sustained solely by the mutual expectation of compliance, despite open recognition of its pointlessness and the absence of enforcement costs.

  **Necessary Conditions:**
  1.  **Lost Rationale:** The original purpose is absent or unlocatable (your feature a).
  2.  **Mutual Expectation:** Compliance is held up by expecting others to comply, not personal approval (feature b).
  3.  **Phantom Authority:** The rule is attributed to a standard or person that does not exist or care (feature c).
  4.  **Open Dissatisfaction:** It is common knowledge that everyone would prefer to drop it (feature d).

  **Boundary Cases:**
  1.  **Near Neighbor (Convention):** Driving on the left looks similar because everyone does it without thinking. But it is a true convention because stopping would cause crashes. Your cases lack this external payoff.
  2.  **Excluded (Coercion):** If a single manager forced the Tuesday deploy because they liked it, that is coercion, not a Zombie Norm. The norm requires the pressure to come from the group's mutual expectation, not a tyrant.
  3.  **Hidden Instance:** A family eating dinner at 6 PM when everyone prefers 7 PM because "Grandma did it," even though Grandma is dead and doesn't care. This looks different but shares the same structure: phantom authority and mutual trapping.

  **Collapse Mechanism:**
  Talking about it in a meeting is not enough. You observed this: people griped, agreed it was pointless, and nothing changed. Talk is cheap because it doesn't change the expectation that others will still enforce the rule tomorrow.

  The smallest change required to collapse a Zombie Norm is a **coordinated violation**. One person must break the rule publicly and survive. If you merge your own PR on Tuesday and no one fires you or complains, you shatter the expectation of enforcement. However, because of feature (b), a single violation might be seen as deviance. The most effective move is to announce the violation *as an invitation*: "I am merging this now because the reason for waiting is gone; who else wants to join?" This creates a new focal point. The norm persists only because everyone expects everyone else to uphold it; once one person proves the upholdings are bluff, the expectation collapses, and the norm dies.
