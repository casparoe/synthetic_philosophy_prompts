answer: |-
  # Dissertation Prospectus: The Durability Asymmetry and the Logic of Lifecycle Inference

  **Project Title:** The Durability Asymmetry: Epistemic Frameworks for Lifecycle Inference in Archaeology

  **1. Problem Statement: The Durability Asymmetry**
  Archaeological reasoning relies on a fundamental asymmetry: material artifacts routinely outlast both the mental states that created them and the social agreements that governed their use. A boundary wall remains standing long after the polity that erected it has dissolved; a storage vessel survives beyond the specific harvest it was meant to hold. Despite this, archaeological interpretation often treats an object's physical persistence as direct evidence for institutional stability. When an artifact type remains physically unchanged over centuries, it is frequently inferred that the institution producing it remained equally stable. This prospectus identifies this move as the "Durability Asymmetry." It posits that physical durability is being mistaken for institutional continuity, creating an epistemic confound where the resistance of matter to decay is conflated with the resistance of social structures to change.

  **2. The Research Question**
  The central question of this dissertation is: **Does the inference from an object's lifecycle—its decay, repair, reuse, and eventual abandonment—to the continuity of an institution require a distinct evidential logic, separate from both representationalist reconstruction and practice-based inference?**

  To answer this, I will investigate two specific sub-questions:
  1.  Can we formally distinguish **Episodic Reconstruction** (which targets a particular belief or intention behind an object's creation at *t0*) from **Structural Persistence Inference** (which targets institutional stability across an object's material history from *t0* to *tn*)?
  2.  Does collapsing these two modes generate the standard interpretive errors in archaeological reasoning, specifically regarding the evidential value of repair, repurposing, and abandonment?

  **3. Critique of Existing Positions**
  Current philosophical frameworks in archaeology leave this problem open due to specific blind spots:

  *   **Representationalism:** This approach treats artifacts as carriers of symbolic content or beliefs. It focuses heavily on the moment of creation (*t0*). Consequently, it ignores persistence patterns altogether. For the representationalist, what happens to the object after creation is noise, not signal. This framework cannot account for how an object's survival might evidence institutional stability rather than just original intent.
  *   **Practice-Based Inference:** This approach reads institutions off repeated use-patterns. While it improves on representationalism by considering use, it tends to conflate use-patterns with durability-patterns. It lacks an account of how repair or repurposing should weigh against original function as evidence for institutional continuity. If a vessel is repaired, is that evidence of the original institution's resilience, or a new institution adapting old materials? Practice theory currently lacks the logical machinery to distinguish these scenarios.

  **4. Methodology: Conceptual Engineering via Case Studies**
  This project will not involve empirical excavation or a historical survey of archaeological method. Empirical work provides data, but this problem is logical and epistemic; more data will not resolve the inferential gap. A historical survey would describe past errors but not provide the normative logic to prevent future ones. Instead, I will employ conceptual engineering, building the distinction from the problem itself.

  I will construct hypothetical lifecycle scenarios for three classes of institutional artifacts:
  1.  **Boundary Markers:** Objects designed to persist and denote political limits.
  2.  **Standardized Weights:** Objects designed for exchange and economic regulation.
  3.  **Storage Vessels:** Objects designed for containment and household management.

  For each class, I will generate variations in lifecycle events (e.g., a boundary marker is maintained vs. ignored; a weight is recast vs. used as-is; a vessel is repaired vs. repurposed). I will then test whether Episodic Reconstruction and Structural Persistence Inference yield divergent interpretations in these scenarios. If the two modes always yield the same result, the distinction is redundant. If they diverge, the distinction is necessary.

  **5. Timeline and Work Plan (12 Months)**

  *   **Months 1–3: Conceptual Foundation**
      *   Define the "Durability Asymmetry" with precision.
      *   Formalize the definitions of Episodic Reconstruction (ER) and Structural Persistence Inference (SPI).
      *   Establish the criteria for what counts as "institutional stability" versus "material stability."
      *   *Deliverable:* A working glossary of terms and a logical map of the inferential gap.

  *   **Months 4–6: Case Study Construction**
      *   Develop the hypothetical lifecycle scenarios for Boundary Markers, Weights, and Vessels.
      *   Map specific lifecycle events (decay, repair, reuse, abandonment) to potential evidential claims.
      *   Simulate the application of ER and SPI to each scenario.
      *   *Deliverable:* A catalog of lifecycle scenarios with annotated interpretive outcomes.

  *   **Months 7–9: Testing the Distinction**
      *   Analyze the results from Months 4–6 to identify where ER and SPI diverge.
      *   Test for reducibility: Can SPI be fully reduced to a series of ER claims? Can ER be reduced to SPI?
      *   Identify specific interpretive errors caused by collapsing the two (e.g., inferring political continuity from a repaired wall that was actually repurposed by a conqueror).
      *   *Deliverable:* A diagnostic report on the independence of the two inferential modes.

  *   **Months 10–12: Framework Formalization and Writing**
      *   Construct the "Lifecycle Evidential Framework."
      *   Assign evidential weights to different lifecycle events (e.g., does repair count +1 for continuity or -1 for adaptation?).
      *   Draft decision rules for when an archaeologist should invoke ER versus SPI.
      *   Finalize dissertation writing.
      *   *Deliverable:* The complete dissertation.

  **6. Deliverable: The Lifecycle Evidential Framework**
  The primary output of this research will be a normative framework for archaeological inference. This framework will include:
  1.  **Evidential Weights:** A system for assigning positive or negative evidential value to specific lifecycle events (e.g., *Repair* may carry high weight for SPI but low weight for ER; *Repurposing* may carry negative weight for SPI).
  2.  **Decision Rules:** Clear criteria for when an archaeologist is justified in invoking Structural Persistence Inference. For example: "Invoke SPI only when material maintenance correlates with functional consistency across at least two distinct lifecycle events."
  3.  **Error Taxonomy:** A classification of interpretive errors that result from confusing material durability with institutional stability.

  **7. Failure Conditions**
  This project proceeds on the hypothesis that ER and SPI are distinct and non-reducible. The project will be considered to have failed to meet its primary theoretical goal if:
  1.  **Redundancy:** It is demonstrated that durability patterns are evidentially redundant given use-patterns (i.e., SPI adds no information beyond what Practice Theory already accounts for).
  2.  **Collapse:** It is demonstrated that the distinction collapses because every persistence claim necessarily entails a specific belief claim (i.e., you cannot infer structural stability without implicitly inferring a specific episodic belief at every moment of persistence).

  If either condition is met, the dissertation will pivot to documenting *why* the distinction collapses, thereby proving that the Durability Asymmetry is an unsolvable epistemic problem rather than a solvable methodological one. This negative result is still a valid philosophical contribution.

  **8. Justification for Conceptual Approach**
  A philosophical approach is preferable to empirical excavation because the problem lies in the *logic of justification*, not the *availability of data*. Excavation can reveal that a wall was repaired, but it cannot determine whether that repair evidences institutional continuity without a prior logical framework defining what "continuity" means in this context. Similarly, a historical survey of method would only show that archaeologists have made these errors; it would not provide the conceptual tools to avoid them. By building the conceptual machinery from the problem itself, this dissertation aims to provide a transferable logic that can be applied to any archaeological context, regardless of the specific empirical data available.

  **9. Scope and Feasibility**
  This scope is honest for a twelve-month philosophical dissertation. It does not require fieldwork, laboratory access, or extensive archival research. The workload consists of logical analysis, thought experimentation, and writing. The restriction to three artifact types ensures depth without unmanageable breadth. The focus on hypothetical scenarios allows for controlled testing of the inferential logic without the noise of incomplete empirical records. The project is designed to be completed within the year, with the possibility of a negative result (the collapse of the distinction) constituting a successful completion of the philosophical inquiry.
