answer: |-
  Good morning, everyone. Thanks for coming early.

  I know we've got a split room today. Half of you speak the language of *li* and the *wu lun*—the five relationships. The other half speaks the language of case files, mandatory reporting, and burnout. Usually, these two groups talk past each other. The theorists say "honor the role," and the practitioners say "the role is killing the client."

  I want to start us off by breaking that stalemate with a weird historical footnote.

  We tend to teach Confucianism as a rigid hierarchy. Father over son. Authority flows down. Obligation flows up. If you're a social worker, that sounds like a trap. It sounds like being told to endure abuse because "he's still your father."

  But I've been reading some late-Ming commentaries that complicate this. There's an argument there that the *friend* role—*peng you*—actually holds a kind of emergency authority over the father-son bond. If the father is being unjust, if the relationship is rotting from the inside, the friend has the standing to intervene. Not to destroy the family, but to correct it.

  Why does this matter for us, today, in this room?

  For the social workers here: This means your intervention isn't necessarily "Western individualism" crashing into "traditional family values." You can frame your work not as tearing the family apart, but as acting like the *friend* who steps in to restore the proper function of the role. You aren't abolishing filial piety; you're saving it from becoming tyranny.

  For the philosophers: This reminds us that roles aren't cages. They're dynamic. If we treat the *wu lun* as static laws, we lose the human beings living inside them. The Late-Ming scholars knew that sometimes, hierarchy needs a corrective mechanism from the outside to survive.

  So, as we move into groups, I don't want us to ask "Is Confucianism good or bad for caregivers?" That's too simple.

  I want us to ask: When does obligation become harm? And who gets to play the role of the "friend" who steps in to fix it? Is it the state? The neighbor? The social worker?

  Let's figure out where the line is between preserving a family and protecting a person.

  Thanks. Let's get into it.
