prompt: |-
  I am a principal engineer with no background in philosophy, and I have recently taken over ownership of engineering standards for a product group of about seventy people, split between a London office and a smaller office in another country. Every month or so I have to decide, for one practice or another, whether to make it a hard rule enforced in CI or in code review, a default that people may depart from if they leave a note explaining why, or a matter left to individual judgement. The decisions are frequent, individually cheap to reverse but corrosive when churned, and each one has to be written up as a one-page recommendation that the engineering leadership team signs off and that a sceptical group of senior engineers will actually read.

  The material I have been pointed to is the literature on tight and loose cultures: the claim that groups differ in how strong their norms are and how much deviance they tolerate, that this difference tracks how exposed the group is to threats and how costly miscoordination is for it, and that tightness buys predictability and coordination at the price of autonomy, experimentation, openness to novelty and tolerance of dissent. I do not want a summary of that literature. I want it turned into a procedure a tech lead can run in about twenty minutes, with no knowledge of the theory, on a single practice at a time.

  One thing I would like tested rather than assumed. My suspicion is that tightness is not one dial but two: how wide a range of situations a rule claims to cover, and how much a departure from it is sanctioned when it happens. A convention can be broad and gently enforced, or narrow and strictly enforced, and the trade-offs look different in each case. If that distinction is worth keeping, build the procedure around it; if it collapses under scrutiny, say so and use whatever distinction does the work.

  Please give me: the questions to ask in order; what counts as a sufficient answer to each; where the procedure stops with a no; and where it has to hand the decision to a person because the question is one of values rather than facts. Then run it on three practices I am currently arguing about: requiring two approvals on every pull request; enforcing formatting and lint rules automatically in CI; and whether an on-call engineer during an incident must follow the runbook step by step or may improvise. I have a strong prior on the third one — I think improvisation should be allowed — so tell me plainly if the procedure contradicts me. Finally, be explicit about which of the theory's distinctions had to survive the simplification and which you dropped, and about what the procedure cannot tell me: I especially want to know what happens to it given that the theory was built to describe whole societies, while my engineers can leave, and given that some of our rules may simply be wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Persona:** Principal Engineer, no philosophy background, owns engineering standards for ~70 people (London + remote).
      *   **Task:** Create a 20-minute decision procedure for setting engineering standards (Hard Rule vs. Default w/ Note vs. Individual Judgement).
      *   **Input Material:** Literature on Tight vs. Loose Cultures (Gelfand et al.).
      *   **Constraint 1:** No summary of the literature. Turn it into a practical procedure.
      *   **Constraint 2:** Test the user's hypothesis: Is "tightness" one dial or two? (Scope/Range vs. Sanction/Enforcement).
      *   **Constraint 3:** Provide specific outputs: Questions in order, sufficient answers, stop conditions (No), hand-off conditions (Values), run on 3 specific cases (2x PR approvals, Linting/Formatting, Incident Runbooks).
      *   **Constraint 4:** Challenge the user's prior on the third case (Incident Runbooks).
      *   **Constraint 5:** Explicitly state what theoretical distinctions survived/dropped and limitations (societies vs. companies, rules can be wrong).

  2.  **Analyze the Theory (Tight vs. Loose) vs. User Hypothesis:**

      *   *Standard Theory:* Tightness-Looseness is usually treated as a unidimensional construct (strength of norms + strength of sanctions). High threat/high coordination need $\rightarrow$ Tight. Low threat/low coordination need $\rightarrow$ Loose.
      *   *User Hypothesis:* Tightness = Scope (how many situations) $\times$ Sanction (how hard is enforcement).
      *   *Evaluation:* In organizational design, this distinction is crucial. A rule that applies everywhere but is lightly enforced (e.g., "Write comments") is different from a rule that applies rarely but is strictly enforced (e.g., "No production DB writes without ticket"). The literature often conflates strength of norms with strength of sanctions, but for engineering standards, separating *Applicability* (Scope) from *Enforcement* (Sanction) is operationally vital. I will validate the user's hypothesis: Yes, keep the two dials. It maps well to "Policy Scope" and "Compliance Mechanism."

  3.  **Drafting the Procedure (The "Tightness Calculator"):**

      *   *Goal:* 20 minutes, one practice at a time.
      *   *Structure:* Needs to flow from Risk/Coordination $\rightarrow$ Scope $\rightarrow$ Enforcement.
      *   *Questions:*
          1.  What is the cost of being wrong? (Risk/Threat)
          2.  How much does this need everyone to do the same thing? (Coordination)
          3.  How stable is the context? (Novelty/Change)
          4.  Scope Decision (Broad vs. Narrow).
          5.  Enforcement Decision (Hard vs. Soft vs. None).
      *   *Stop Conditions:* If risk is low and coordination is low $\rightarrow$ Individual Judgement (Stop).
      *   *Value Hand-offs:* When "cost of being wrong" involves ethical choices or career risk vs. product risk.

  4.  **Refining the Questions (Iterative Process):**

      *   *Q1 (Threat):* If we mess this up, what breaks? (Production, Money, Trust, Nothing).
      *   *Q2 (Coordination):* Does Person A need to know exactly what Person B did here? (Interoperability).
      *   *Q3 (Volatility):* Is the "right way" likely to change in 6 months?
      *   *Decision Logic:*
          *   High Threat + High Coordination $\rightarrow$ Tight.
          *   Low Threat + Low Coordination $\rightarrow$ Loose.
          *   Mixed $\rightarrow$ Hybrid (Default w/ Note).
      *   *User's 2-Dial Hypothesis:* I need to explicitly separate "Where does this apply?" (Scope) from "What happens if you break it?" (Sanction).
      *   *Revised Logic:*
          1.  Assess Need for Constraint (Threat + Coordination).
          2.  Determine Scope (Universal vs. Contextual).
          3.  Determine Sanction (CI Block vs. Review Note vs. Trust).

  5.  **Running the Procedure on the Three Cases:**

      *   *Case 1: Two approvals on every PR.*
          *   Threat: Medium (bugs).
          *   Coordination: Low (code ownership varies).
          *   Volatility: Low.
          *   *Analysis:* Universal scope might be too tight. High friction.
          *   *Verdict:* Default w/ note (or scoped to critical paths).
      *   *Case 2: Formatting/Linting in CI.*
          *   Threat: Low (functionality doesn't change).
          *   Coordination: High (diff readability, merge conflicts).
          *   Volatility: Low.
          *   *Verdict:* Tight Scope, Tight Enforcement (Automated). Low cognitive load.
      *   *Case 3: Incident Runbooks (Improvisation).*
          *   Threat: High (outage cost).
          *   Coordination: High (team needs to know what you're doing).
          *   Volatility: High (incidents are novel).
          *   *User Prior:* Allow improvisation.
          *   *Theory Check:* High threat usually implies Tight. *However*, high volatility/novelty implies Loose (need adaptation). This is the tension.
          *   *Verdict:* Scope is Broad (all incidents), Enforcement is Loose (guidance not rule). *Wait, does this contradict the user?* The user thinks improvisation should be allowed. The theory says high threat = tight. But high uncertainty = loose. I need to explain this nuance. If the runbook is a *checklist* (aviation style), deviation is bad. If it's a *guide*, deviation is expected. I will challenge the user: Improvisation is allowed, but *communication* of deviation must be tight.

  6.  **Addressing Limitations & Theory Adaptation:**

      *   *Societies vs. Companies:* Employees can quit (exit voice). Societies are sticky. This means overly tight rules increase churn.
      *   *Rules can be wrong:* In societies, norms evolve slowly. In engineering, we can A/B test standards. The procedure needs a "Review Date."
      *   *Surviving Distinctions:* Threat/Cost of Error, Coordination Need, Uncertainty/Novelty.
      *   *Dropped Distinctions:* Historical tradition, deep cultural symbolism (irrelevant for code standards).

  7.  **Final Review against Constraints:**

      *   20-minute procedure? Yes, kept concise.
      *   No philosophy jargon? Yes, translated to engineering terms.
      *   Test 2-dial hypothesis? Yes, validated and integrated.
      *   Run on 3 cases? Yes.
      *   Challenge User Prior? Yes (on the incident case).
      *   Explicit on theory adaptation? Yes.

  8.  **Drafting the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure the "Stop" conditions are clear. If the answer is "Low Risk, Low Coordination," don't keep asking questions.
      *   *Correction:* Ensure the "Values" hand-off is clear. Who decides the risk tolerance? The Principal Engineer or the VP?
      *   *Refinement on Case 3:* Be careful not to just say "You're right." The theory suggests high threat = tight. Why is improvisation okay? Because *uncertainty* moderates the threat. I need to make sure the procedure captures *Uncertainty* as a variable that loosens norms even under threat.

  9.  **Final Polish:** Check tone. Professional, direct, respectful of the user's expertise but firm on the framework. (Proceed to generate output).

  *(Self-Correction on the 2-Dial Hypothesis)*: The user asks: "Tightness is not one dial but two: how wide a range of situations a rule claims to cover, and how much a departure from it is sanctioned."
  In the literature (Gelfand), Tightness *is* defined by strength of norms + strength of sanctions. However, often they move together. The user is asking if they can move independently.
  *My verdict:* Yes, they can. You can have a "Soft Norm" (everyone does it, but no punishment) or a "Hard Rule" (punishment, but rarely applies). I will validate this distinction as **Scope** vs. **Severity**.

  *(Self-Correction on Case 3)*: User thinks improvisation should be allowed.
  Theory: High Threat (Outage) $\rightarrow$ Tight.
  Theory: High Uncertainty (Novel Incident) $\rightarrow$ Loose.
  Result: It depends on the *type* of incident. Known failures = Tight (Runbook). Unknown failures = Loose (Improvisation).
  I need to tell the user: Your prior is right *only if* the incident type is novel. If it's a known playbook scenario, improvisation is dangerous. I will nuance this.

  *(Final Plan)*:
  1. Introduction validating the 2-dial hypothesis.
  2. The Procedure (The "Norm Calibration Protocol").
  3. The Three Cases.
  4. Theory Adaptation & Limitations.
  5. Closing.

