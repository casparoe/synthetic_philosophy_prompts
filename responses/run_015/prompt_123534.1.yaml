answer: |-
  ### Part 1: Validation of Your Hypothesis

  Your suspicion is correct. In the sociological literature, tightness is often treated as a single index, but in organizational design, **Scope** (where the norm applies) and **Severity** (what happens if you break it) are distinct levers.

  *   **Scope:** Does this apply to *every* commit, *critical* paths only, or *legacy* code?
  *   **Severity:** Is a violation a CI block, a code review comment, or a post-mortem discussion?

  Collapsing these leads to friction. A broad scope with high severity creates bureaucracy. A narrow scope with low severity creates ambiguity. The procedure below treats them as independent variables.

  ### Part 2: The Norm Calibration Protocol

  **Time:** 20 Minutes
  **Input:** One proposed engineering practice.
  **Output:** A recommendation (Hard Rule, Default w/ Note, or Judgement) + Scope + Enforcement Mechanism.

  #### Phase 1: The Threat & Coordination Assessment (5 Minutes)
  *Answer these factually. If you cannot answer, stop and gather data.*

  1.  **What is the cost of being wrong?**
      *   *Sufficient Answer:* Quantified impact (e.g., "Service outage," "Security vulnerability," "Slower build times," "Minor readability issue").
      *   *Stop Condition:* If the cost is "Minor readability" or "Preference," skip to Phase 3 and default to **Individual Judgement**.
  2.  **How costly is miscoordination?**
      *   *Sufficient Answer:* Does Engineer A need to know exactly how Engineer B implemented this to do their job? (Yes/No).
      *   *Stop Condition:* If No (work is modular/isolated), skip to Phase 3 and default to **Individual Judgement** or **Default w/ Note**.
  3.  **How novel is the context?**
      *   *Sufficient Answer:* Is the "right way" stable (known best practice) or volatile (experimental, changing tech)?
      *   *Hand-off:* If the cost of being wrong involves ethical, legal, or existential business risk, this is a **Values** question. Hand off to Engineering Leadership/VP. Do not decide alone.

  #### Phase 2: The Dial Settings (10 Minutes)
  *If you passed Phase 1, set the dials.*

  4.  **Set the Scope (Broad vs. Narrow)**
      *   *Question:* Can we identify specific contexts where this rule should *not* apply?
      *   *Logic:* If Novelty (Q3) is High $\rightarrow$ Narrow Scope. If Coordination (Q2) is High $\rightarrow$ Broad Scope.
      *   *Decision:*
          *   **Broad:** Applies to all repos/services/people.
          *   **Narrow:** Applies only to critical paths, customer-facing code, or specific stacks.
  5.  **Set the Severity (Hard vs. Soft)**
      *   *Question:* Is the cost of violation immediate and irreversible?
      *   *Logic:* If Cost (Q1) is High + Novelty (Q3) is Low $\rightarrow$ Hard. If Cost is Medium or Novelty is High $\rightarrow$ Soft.
      *   *Decision:*
          *   **Hard:** CI Block / Mandatory Ticket.
          *   **Soft:** Code Review Comment / "Note Required".
          *   **None:** Retrospective discussion only.

  #### Phase 3: The Churn Check (5 Minutes)
  *Final validation before writing the doc.*

  6.  **Reversibility:** If we get this wrong, how hard is it to undo?
      *   *Sufficient Answer:* "Config change" (Easy) vs. "Refactor 500 services" (Hard).
      *   *Constraint:* If Hard to Undo + High Novelty $\rightarrow$ Downgrade Severity by one step (Hard $\rightarrow$ Soft).
  7.  **Exit Risk:** Will this rule make it significantly harder for a competent engineer to do their job?
      *   *Sufficient Answer:* "Adds 5 mins per PR" vs. "Blocks deployment for days."
      *   *Constraint:* If High Exit Risk + Low Coordination Need $\rightarrow$ Downgrade Severity.

  ---

  ### Part 3: Running the Procedure on Your Cases

  #### Case 1: Two Approvals on Every Pull Request
  *   **Phase 1:**
      *   Cost of Wrong: Medium (Bugs reach staging/prod).
      *   Coordination: Low (Code ownership is usually local).
      *   Novelty: Low (PR process is stable).
  *   **Phase 2:**
      *   Scope: **Broad** (Currently proposed for *every* PR).
      *   Severity: **Hard** (CI/Policy block).
  *   **Phase 3:**
      *   Reversibility: Easy (Config change).
      *   Exit Risk: **High**. Adds significant latency to flow.
  *   **Procedure Verdict:** **Downgrade Severity.**
      *   *Recommendation:* **Default w/ Note.** Require two approvals for *critical* paths (Narrow Scope), but allow single approval for low-risk changes with a justification note (Soft Severity).
      *   *Reasoning:* Coordination need is low. The friction cost (Exit Risk) outweighs the bug prevention benefit for non-critical code.

  #### Case 2: Enforcing Formatting and Lint Rules in CI
  *   **Phase 1:**
      *   Cost of Wrong: Low (Functionality unchanged).
      *   Coordination: **High** (Diffs become unreadable, merge conflicts increase).
      *   Novelty: Low (Rules are stable).
  *   **Phase 2:**
      *   Scope: **Broad** (All code).
      *   Severity: **Hard** (CI Block).
  *   **Phase 3:**
      *   Reversibility: Easy.
      *   Exit Risk: Low (Automated fixes exist).
  *   **Procedure Verdict:** **Maintain Tightness.**
      *   *Recommendation:* **Hard Rule, Broad Scope.**
      *   *Reasoning:* High coordination need (readability) + Low cognitive load (automated) = Ideal candidate for tightness. This buys predictability without sacrificing autonomy.

  #### Case 3: Incident Runbooks (Step-by-Step vs. Improvisation)
  *   **Phase 1:**
      *   Cost of Wrong: **Very High** (Extended outage, revenue loss).
      *   Coordination: **High** (Team must know what is being changed).
      *   Novelty: **High** (Incidents are often unique; "Unknown Unknowns").
  *   **Phase 2:**
      *   Scope: **Broad** (All incidents).
      *   Severity: **Mixed.**
  *   **Phase 3:**
      *   Reversibility: Hard (Data loss/corruption possible).
      *   Exit Risk: High (On-call burnout).
  *   **Procedure Verdict:** **Contradicts your prior (Partially).**
      *   *Recommendation:* **Narrow Scope for Hard Rules, Broad Scope for Soft Guidance.**
      *   *Reasoning:* The procedure flags a tension. High Threat suggests Tightness. High Novelty suggests Looseness.
      *   *Correction to your prior:* You cannot allow blanket improvisation. High threat demands coordination. If one engineer improvises silently, the "Cost of Miscoordination" skyrockets.
      *   *Refined Standard:* Follow the runbook **unless** you declare a deviation.
          *   **Rule:** "Follow runbook steps." (Hard Rule).
          *   **Exception:** "If the runbook fails, you may improvise **if** you announce the deviation in the incident channel and log the rationale." (Soft Severity on the *action*, Hard Severity on the *communication*).
      *   *Why:* This preserves the safety of the runbook (Tight) while allowing for novel problem solving (Loose), but enforces coordination (Tight) on the deviation itself.

  ---

  ### Part 4: Theory Adaptation & Limitations

  #### Distinctions That Survived Simplification
  1.  **Threat/Constraint:** Translated to "Cost of Being Wrong." This is the primary driver of tightness.
  2.  **Coordination Need:** Translated to "Interoperability." This justifies rules that don't directly prevent bugs but prevent friction.
  3.  **Uncertainty/Novelty:** Added as a moderator. High uncertainty *loosens* norms even when threat is high (crucial for the Incident case).
  4.  **Scope vs. Severity:** Validated your hypothesis. These are independent controls.

  #### Distinctions Dropped
  1.  **Cultural History:** Societies have deep histories; engineering teams do not. We do not need to account for "tradition."
  2.  **Symbolic Norms:** In societies, norms signal identity. In engineering, norms signal reliability. We dropped the social signaling aspect in favor of operational efficiency.
  3.  **Punishment vs. Sanction:** Sociological tightness often implies social ostracization. In engineering, "sanction" is purely procedural (CI failure, review rejection).

  #### Limitations of the Procedure

  **1. The Exit Option (Societies vs. Companies)**
  The theory assumes members cannot easily leave. Your engineers can.
  *   *Impact:* Tightness increases churn. A rule that is theoretically optimal for coordination might be practically optimal for attrition.
  *   *Mitigation:* The "Exit Risk" check in Phase 3. If a rule makes competent engineers feel distrusted or slowed down without clear benefit, they will leave. You must weigh the cost of the bug against the cost of hiring a replacement.

  **2. The "Wrong Rule" Problem**
  Societal norms evolve over generations. Engineering standards can be A/B tested.
  *   *Impact:* The procedure assumes the rule *could* be right. It does not validate technical merit.
  *   *Mitigation:* You must add a **Sunset Clause** to every standard. "This rule will be reviewed in 6 months." Tightness should be temporary until the behavior becomes habit or the technology stabilizes.

  **3. The Values Hand-off**
  The procedure treats "Cost of Wrong" as a fact. It is often a value judgment.
  *   *Impact:* Is a 1% risk of data loss acceptable to move faster? That is not an engineering question; it is a business risk question.
  *   *Mitigation:* Phase 1, Q3. If the answer involves risk tolerance beyond your mandate, you must escalate. Do not use this procedure to set risk appetite; use it to implement it.

  ### Summary for your Leadership Doc
  When writing your one-page recommendations, structure them using the procedure's logic:
  1.  **Risk Profile:** (Cost of Wrong + Coordination Need).
  2.  **Uncertainty:** (Stable Practice vs. Experimental).
  3.  **Calibration:** (Scope + Severity).
  4.  **Review Date:** (Acknowledging the rule might be wrong).

  This signals to your sceptical seniors that you are not imposing preference, but calibrating constraint based on system dynamics.
