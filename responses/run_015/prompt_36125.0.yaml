answer: |-
  **Course:** PHIL 450: Philosophy of Language
  **Assessment:** Final Examination
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question. You are expected to engage critically with the texts discussed in seminar. Mere exegesis is insufficient.

  ***

  ### Essay Question

  **The Deep Twin Earth Scenario**
  Consider a variant of Putnam's Twin Earth. It is 1750. On Earth, 'water' refers to H₂O. On Twin Earth, the watery stuff (lakes, rain, thirst-quencher) is a distinct chemical compound, XYZ. However, in this **Deep Twin Earth** scenario, the difference between H₂O and XYZ is *undetectable in principle*. No experiment available to the Twin Earth community, even given their ideal future science and infinite time, could distinguish XYZ from H₂O. They are macroscopically identical and microscopically distinct, yet the microscopic distinction is causally inert regarding all possible measurement interactions.

  **Prompt:**
  Evaluate whether semantic externalism survives the Deep Twin Earth scenario. In your answer, address the following:
  1.  Does Putnam's argument for externalism rely on the difference being *unknown* (epistemic) or *distinct* (metaphysical)? Does the "in principle undetectable" clause sever the causal chain required for reference?
  2.  How would a defender of Fodor-style narrow content exploit this case to argue that psychological content must be internal?
  3.  Critically compare the outcome under Putnam's **Natural Kind Externalism** versus Burge's **Social Externalism**. Specifically, consider the status of the "division of linguistic labor" if the relevant experts *cannot* distinguish the kinds even in principle.

  ***

  ### Model Answer (Approx. 600 words)

  The Deep Twin Earth scenario pressures semantic externalism by decoupling metaphysical distinctness from epistemic access. Standard Twin Earth arguments rely on the intuition that reference is fixed by hidden structure, even if speakers are ignorant of it. Deep Twin Earth radicalizes this: the structure is not merely unknown, but *unknowable*.

  Regarding Putnam's Natural Kind Externalism, the argument largely survives, though strained. Putnam's core claim is that extension is determined by causal contact with the environment, not by descriptive satisfaction. Even if the H₂O/XYZ distinction is undetectable, the substances remain physically distinct. For a causal theorist, reference is anchored by the actual physical baptism and subsequent causal chains. If Earthlings interact causally with H₂O and Twin Earthlings with XYZ, the reference diverges regardless of epistemic access. The "in principle" undetectability does not sever the causal link; it merely renders the difference irrelevant to the speakers' rationality. Thus, Putnam's intuition pump is about metaphysical determination, not epistemic access. The meaning of 'water' is still fixed by the world, even if the world hides its cards forever.

  However, a Fodor-style defender of narrow content exploits this epistemic opacity. Fodor argues that psychological states should supervene on the internal physical state of the subject to explain behavior. In Deep Twin Earth, the Earthling and Twin Earthling are intrinsic duplicates who behave identically in all possible scenarios (since no test distinguishes the liquids). If they behave identically and possess identical internal states, but Putnam claims they have different contents, then content becomes epiphenomenal to psychology. Fodor would argue that because the difference makes no difference to practice or cognition, the *psychological* content (narrow content) must be identical. Deep Twin Earth suggests that while *reference* (wide content) might diverge, *cognitive significance* converges. This forces a wedge between semantic value and psychological explanation, suggesting externalism captures only the relational tag, not the mental concept.

  The critical divergence, often overlooked, arises when comparing Putnam to Burge. Putnam's externalism is metaphysical/causal; Burge's is social/normative. Under Putnam's view, Deep Twin Earth works because nature fixes the kind. Under Burge's Social Externalism, the scenario collapses. Burge relies on the "division of linguistic labor," where laypeople defer to experts who possess the authoritative criteria for application. In Deep Twin Earth, by definition, *no experts exist* who can distinguish H₂O from XYZ. If the distinction is undetectable in principle, there is no specialized knowledge to defer to. The social mechanism that fixes reference for Burge requires a community structure where some members have better access to the truth conditions. If the truth conditions are essentially inaccessible, the normative authority of the expert vanishes. Consequently, Burgean externalism fails where Putnamian externalism holds. Without experts to sustain the norm, the community's usage drifts into a descriptive cluster concept, internalizing the content.

  Therefore, Deep Twin Earth reveals that "externalism" is not a monolith. Natural kind externalism survives because it relies on causal contact with mind-independent structures. Social externalism fails because it relies on mind-dependent social structures (expertise) that cannot exist if the relevant facts are inaccessible. The Deep Twin Earth case demonstrates that while reference may be externally fixed by nature, meaning as a social practice requires the possibility of knowledge.

  ***

  ### Marking Scheme

  **Grade A (80-100%): The Distinctive Move**
  *   **Crucial Differentiation:** Explicitly distinguishes between Putnam's Natural Kind Externalism (which survives the case) and Burge's Social Externalism (which fails the case). *Note: This is the move students consistently miss. Most treat "externalism" as a single position.*
  *   **Epistemic vs. Metaphysical:** Correctly identifies that Putnam's argument is metaphysical (causal contact suffices) whereas the Deep Twin Earth constraint is epistemic.
  *   **Fodor Engagement:** Accurately articulates the Narrow Content objection regarding psychological supervenience and behavioral identity.
  *   **Expertise Analysis:** Clearly explains why the "division of linguistic labor" collapses when expertise is impossible in principle.

  **Grade B (60-79%): Standard Externalism**
  *   **Monolithic Externalism:** Treats Putnam and Burge as arguing for the same conclusion. Argues that externalism either wholly succeeds or wholly fails without distinguishing the mechanisms (causal vs. social).
  *   **Recitation:** Relies heavily on the standard 1750 Twin Earth argument without fully grappling with the "in principle undetectable" constraint.
  *   **Fodor:** Mentions narrow content but fails to link it specifically to the behavioral indistinguishability guaranteed by the Deep Twin Earth setup.
  *   **Expertise:** Mentions experts but does not analyze the impossibility of their existence in this specific variant.

  **Grade C (50-59%): Exegesis Only**
  *   **Summary:** Summarizes Putnam's original Twin Earth argument without applying it to the Deep Twin Earth variant.
  *   **Confusion:** Confuses the undetectability of the substance with the non-existence of the substance.
  *   **Incomplete:** Fails to address at least two of the three required sub-prompts (Putnam/Fodor/Burge).

  **Fail (<50%)**
  *   Fundamental misunderstanding of externalism/internalism distinction.
  *   Does not address the prompt.
