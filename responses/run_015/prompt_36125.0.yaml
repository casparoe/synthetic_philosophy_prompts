  I teach an upper-level philosophy of language seminar and im writing the final. Draft one essay question (90 minutes) on Twin Earth that can't be answered by just recitin Putnam. The question should center on a variant Ill call Deep Twin Earth: same setup as 1750, but the watery stuff there differs from H2O in a way that's undetectable in principle — no experiment anyone in that community could ever run, even with their ideal future science, distinguishes it from our water. Students have to say whether Putnam's argument for externalism still goes through when the difference is unknowable rather than merely unknown, whether the intuition pump is doing work about reference or just about epistemic access, how a Fodor-style narrow content defender would try to exploit the case, and whether the answer comes out differently under Putnam's natural kind externalism versus Burge-style social externalism (where the relevant "experts" may not even exist on Deep Twin Earth). Then write a model answer of about 600 words and a marking scheme that separates an A from a B by naming the specific moves each must contain — flag the one move students always miss, namely noticing that the two externalisms can come apart here rather than treating "externalism" as one thing.
