          *   Aristotle: Money is *nomos* (law/custom). It's closer to the Artifact than the Constant, but it measures *Need*.
          *   Verdict: The analogy holds *structurally* (we agree on a standard to fix a value) but fails *ontologically* (Mass exists without us; Need exists only between us).
      *   **Synthesis/Verdict:**
          *   Hal is right about the *mechanics* (money is a tool, need isn't additive).
