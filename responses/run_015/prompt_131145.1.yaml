answer: |-
  **1. "Your identification strategy is weak: how do you separate the information effect from ideological quota targets?"**
  *   **The Objection:** You argue inflated reports caused procurement, but procurement quotas were driven by Great Leap ideology, not just data. If the Center was committed to high extraction regardless of harvest size, your information mechanism is epiphenomenal. Where's the exogenous variation in reporting accuracy?
  *   **2-Minute Reply:** I'm not claiming ideology didn't matter; I'm claiming ideology set the *demand* for grain, while reports set the *perceived supply*. Using provincial variation in mortality vs. reported output (following Yang Daliang and others), we see higher procurement rates where inflation was higher, controlling for ideological zeal (proxied by commune size/steel targets). The mechanism isn't "ideology vs. info," it's "ideology filtered through info." If the Center believed grain was abundant, ideological extraction became lethal; if they believed scarcity existed, extraction would have hit a political constraint sooner.
  *   **Weakest Point:** Proxies for "ideological zeal" are noisy and potentially correlated with reporting inflation (boastful cadres do both).
  *   **Concession:** Concede that ideology set the baseline extraction rate, but insist the *marginal* lethality came from the information shock.
  *   **Trap Flag:** **Yes.** Do not imply Sen ignored ideology. Sen's Bengal analysis includes war-induced inflation. The difference is the *transmission mechanism* (market price vs. planning quota), not the presence of politics.

  **2. "You're strawmanning Sen: the Entitlement Approach already accounts for state-induced entitlement failure."**
  *   **The Objection:** Sen explicitly models entitlement mapping failures caused by state action (e.g., redistribution rules). You're treating Entitlement Approach (EA) as a market-only model. Sen doesn't need your mechanism to explain why state procurement collapsed entitlements.
  *   **2-Minute Reply:** Sen's EA describes *that* entitlements collapsed, not *why* the state chose the specific mapping function that caused it. In Bengal, the mapping failed due to market speculation and war inflation. In China, the mapping failed due to a principal-agent information problem. My point isn't that EA is wrong, but that it's too static to capture the *dynamic feedback loop* of planned economies. EA treats the entitlement map as given; I'm endogenizing the map itself.
  *   **Weakest Point:** Sen's later work on democracy and famines touches on political incentives, which blurs your distinction.
  *   **Concession:** Acknowledge Sen's later political economy work, but insist the core EA framework (1981) lacks the informational microfoundation needed for central planning contexts.
  *   **Trap Flag:** **No.** This is safe ground if you frame it as "extending" rather than "refuting."

  **3. "Counterfactual: If reports were accurate, would procurement actually have dropped?"**
  *   **The Objection:** Given the commitment to industrialization and debt repayment to the USSR, would accurate data have changed Central planning decisions? Or would they have procured anyway and blamed locals?
  *   **2-Minute Reply:** Historical evidence from post-1961 adjustments suggests yes. Once the Center realized the truth (via crisis), procurement rates dropped sharply and grain was imported. The counterfactual holds: the Center was responsive to data, but the data was corrupted. The famine wasn't a choice to starve despite knowing the truth; it was a choice to extract based on a false truth.
  *   **Weakest Point:** Relies on ex-post rationalization by the Center after the damage was done.
  *   **Concession:** Concede that some extraction would have occurred regardless, but argue the *famine-scale* extraction was data-dependent.
  *   **Trap Flag:** **Yes.** Avoid comparing this to Ireland (export during famine). Ireland was market-driven export; China was state procurement. Different mechanisms.

  **4. "Your data is endogenous: using post-famine revisions to prove inflation caused the famine is circular."**
  *   **The Objection:** You're using revised output data (from the 1980s/90s) to prove 1958 reports were inflated. But those revisions are themselves political constructs. How do you know the 'true' output wasn't even lower, or that the revisions aren't just scapegoating locals?
  *   **2-Minute Reply:** I triangulate revised stats with physical proxies: seed grain retention rates, livestock depletion, and demographic cohort analysis. These physical constraints don't lie even if party archives do. The consistency between demographic shock and the magnitude of reported vs. revised output supports the inflation hypothesis independent of official revisions.
  *   **Weakest Point:** Physical proxies are also estimated with error margins.
  *   **Concession:** Acknowledge data limitations but emphasize convergence of evidence across independent sources.
  *   **Trap Flag:** **No.** Data integrity is a general hist-econ issue, not specific to Sen comparisons.

  **5. "If this mechanism is specific to central planning, does it actually challenge Sen, or just limit your paper's scope?"**
  *   **The Objection:** Sen claims generality across famine types. If your mechanism only works in command economies, you haven't improved the general theory of famine, you've just carved out a niche exception.
  *   **2-Minute Reply:** It challenges the *universality* of the entitlement mapping assumption. Most development models assume information flows are less distorted than in GLF China. Highlighting this shows where EA fails in non-market contexts. It's not a niche exception; it's a boundary condition for entitlement theory in state-dominated economies.
  *   **Weakest Point:** Risks admitting the paper has low external validity.
  *   **Concession:** Frame it as "contextual specificity" that informs mechanism design in development policy generally (e.g., aid distribution).
  *   **Trap Flag:** **Yes.** Don't let them box you into "China is unique." Keep the focus on informational asymmetry in development.

  **6. "By focusing on the information loop, are you smuggling in a 'mistake theory' that absolves central leadership of moral responsibility?"**
  *   **The Objection:** This sounds like "they didn't know," which reduces moral culpability. Is this mechanism design or moral hazard modeling? Are you letting the Center off the hook?
  *   **2-Minute Reply:** It's not about absolving guilt; it's about causal precision. Moral responsibility requires knowing the mechanism. If the mechanism is information failure, the policy remedy is transparency institutions, not just 'better politics.' I'm not arguing they weren't responsible, but that their responsibility lies in creating a system where truthful reporting was incentivized away.
  *   **Weakest Point:** Economists hate mixing causality with morality; this invites the philosopher to pounce.
  *   **Concession:** Strictly separate the causal mechanism (info loop) from the normative judgment (responsibility).
  *   **Trap Flag:** **No.** But keep the philosopher engaged here, not on the Sen comparison.

  **7. [HOPE NOBODY ASKS] "Does the entitlement approach actually require a moral right to truthful information, and if so, doesn't that collapse your distinction between mechanism and normativity?"**
  *   **The Objection:** (From the Philosopher) If entitlements depend on information, and the state controls information, isn't the 'right to truthful data' itself an entitlement? If you argue this, you're doing normative political philosophy, not causal identification.
  *   **2-Minute Reply:** I'm treating information as a production input, not a moral right. The collapse is functional, not necessarily juridical. However, if you want to normatively extend EA, yes, information access becomes a meta-entitlement. But for this paper, I'm sticking to the positive claim: information asymmetry caused the entitlement collapse.
  *   **Weakest Point:** This invites a debate on the definition of "entitlement" that you can't win in 2 minutes.
  *   **Concession:** Defer to the normative work for another paper; insist this paper is positive economics.
  *   **Trap Flag:** **Yes.** Do not engage deeply on normative foundations. It derails the causal identification story.
