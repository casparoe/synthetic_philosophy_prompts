      *   **Conclusion:** Debunking works on thick/parochial morals (purity, outsiders), but a "thin core" survives. Realism must work with this thin core.

  3.  **Evaluate Criterion 1: Scientific Accuracy (Biology/Psychology):**
      *   *Claim:* "Across a very wide range of selection pressures, the code that would have been favoured still includes some form of reciprocity, some prohibition on gratuitous cruelty... and some special obligation to one's dependents."
      *   *Critique:* This is a strong empirical claim. Evolutionary game theory (e.g., Nowak, Axelrod) supports reciprocity and kin selection (dependents). However, "prohibition on gratuitous cruelty" is trickier. Cruelty can be adaptive (dominance hierarchies, resource seizure). "Gratuitous" is the weasel word here. If it means "costly signaling" or "terror tactics," it might be selected *for*.
      *   *Claim:* "The entire faculty of moral judgment was selected for its effects on fitness."
      *   *Critique:* Some psychologists argue morality is a byproduct (spandrel) of general intelligence or theory of mind, not directly selected. The argument assumes adaptationism. A careful biologist might push back on "selected for" vs. "exapted."
      *   *Claim:* Varying ancestral environments.
      *   *Critique:* How wide is "very wide"? If we go to solitary organisms, no morality. If we go to hive minds, different morality. The "range of plausible ancestral environments" for *humans* is actually quite narrow (social primates). This limits the force of the test.

