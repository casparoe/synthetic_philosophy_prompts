      *   *Critical Point:* These are different counterfactuals. One varies *facts*, the other varies *pressures*. If moral facts are necessary truths (as many realists hold), you can't vary them. If they are natural properties, you might. But the CRT varies *ecology*, not *ontology*. This is a significant logical slippage. I must highlight this.
