answer: |-
  Here is a critique of the argument based on your four criteria, followed by a verdict on the one-sentence constraint.

  ### 1. Scientific Accuracy (Biology and Psychology)
  You have overclaimed on two fronts, either of which a careful evolutionary psychologist could exploit to derail the seminar discussion.

  First, the claim that a "prohibition on gratuitous cruelty" would be favored across a wide range of ancestral environments is biologically precarious. Aggression, dominance signaling, and terror tactics are well-documented adaptive strategies in social primates, including humans. A biologist would ask: Why think selection favors a *prohibition* on cruelty rather than the *strategic application* of cruelty? If you define "gratuitous" as "fitness-reducing," the claim becomes tautological (selection doesn't favor fitness-reducing traits). If you define it morally (suffering without justification), you have smuggled the moral conclusion into the biological premise. You need to decouple the behavioral description from the moral valuation here.

  Second, you treat the "faculty of moral judgment" as a unified adaptation selected for fitness. A significant faction in evolutionary psychology argues that moral cognition is a *spandrel*—a byproduct of general intelligence, theory of mind, and language—rather than a direct target of selection. If the faculty wasn't selected *for* cooperation but merely *used* for it, your premise that "the selection process was indifferent to whether the judgments it produced were true" shifts. It wasn't a selection process for judgments at all. You need to either defend the adaptationist account or show your argument holds if morality is an exaptation.

  ### 2. The Central Distinction (Shallow vs. Deep + Counterfactual Range Test)
  The Shallow/Deep distinction is terminologically fresh but conceptually familiar; it maps closely onto the distinction between local genealogies (e.g., Nietzsche on Christian morality) and global genealogies (Street/Joyce). It does not do enough independent work to carry the argument.

  The **Counterfactual Range Test (CRT)** is the heavier lifter, but it risks being a vivid restatement of the "convergent evolution" objection to debunking arguments. You flag this worry yourself, and it is warranted. The CRT demonstrates *robustness*, not *truth*. Showing that reciprocity evolves in many possible worlds shows that reciprocity is *useful*, not that it is *correct*.

  More critically, there is a mismatch between your definition of the **Indifference Premise** and the **Test**.
  *   **Indifference Premise:** Beliefs would be the same even if *moral facts* were different.
  *   **CRT:** Beliefs would be the same even if *ancestral environments* were different.

  These are not equivalent counterfactuals. Unless you assume moral facts *supervene* on ancestral environmental pressures (which leans toward naturalism), varying the environment does not test sensitivity to the moral facts. You are testing sensitivity to *fitness conditions*, then assuming fitness conditions track moral facts. The distinction is doing work, but it is bridging a gap it hasn't earned.

  ### 3. Validity (Does the Conclusion Follow?)
  The argument suffers from a negative-to-positive inference gap.
  *   **Premise:** The CRT shows the Indifference Premise is not established for the "thin core."
  *   **Conclusion:** The thin core survives (i.e., is justified/true).

  Showing that a debunking argument *fails to prove* unjustification is not the same as proving *justification*. You have created an epistemic stalemate, not a vindication. The realist still lacks a positive account of why the fitness-tracking mechanism aligns with truth-tracking.

  Furthermore, your reply to the anticipated objection ("this reply only lands if one already assumes that the fitness-relevant features... and the truth-relevant features... come apart") is vulnerable to a charge of circularity. The Debunker's starting point is precisely that there is no *a priori* reason to think they align. To say "you can't assume they come apart" is fair, but to say "therefore my robustness test implies alignment" is not. You need a "Third Factor" explanation (e.g., that survival *requires* responding to real moral reasons) to make the inference valid. Without that, the conclusion that the core "survives" is too strong; it should be that the core is "immune to this specific debunking strategy."

  ### 4. Obvious Objections (Fatal Flaws)
  There is a collapse objection you have not anticipated: **The Prudential Collapse.**
  Your "thin core" (reciprocity, non-cruelty to kin, care for dependents) maps almost perfectly onto *prudential rationality* and *game-theoretic stability*. A skeptic will argue that your test proves these norms are evolutionarily stable strategies, not moral truths. If I can explain "reciprocity" entirely through iterated prisoner's dilemmas without invoking moral facts, I have explained away the need for realism.

  Your argument risks proving that morality is *useful fiction*. If the "thin core" is just what any intelligent social species would agree upon to avoid mutual destruction, that is consistent with anti-realism. You need to explain why the evolutionary inevitability of a norm implies its *normativity* rather than just its *utility*. If you cannot distinguish the "moral ought" from the "prudential ought" in this thin core, you have surrendered realism for a sophisticated naturalism, exactly as you feared.

  ### Verdict on the One-Sentence Conclusion
  You can state this in one sentence, but your current draft is two clauses joined by "and." To make it punchy and accurate (avoiding the overclaim that realism is fully vindicated), try this:

  > "While evolutionary debunking arguments successfully destabilize parochial moral norms, they fail to undermine a thin core of robust moral commitments that converge across plausible ancestral environments."

  **Recommendation:** The argument is a sophisticated variation on modal security and convergent evolution objections. It is not entirely new, but the framing via the "Indifference Premise" is tactically useful. However, you must address the **Prudential Collapse** (Criterion 4) and the **Environment-vs-Facts mismatch** (Criterion 2) before Thursday, or you will be pressed on whether you have defended realism or merely redefined morality as successful social coordination.
