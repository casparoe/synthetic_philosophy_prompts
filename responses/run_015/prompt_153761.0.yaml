  **STATE MEMORIAL COMMISSION**
  **INTERNAL MEMORANDUM**

  **TO:** The Commissioners, State Memorial Commission
  **FROM:** Dr. Aris Thorne, Commission Subcommittee on Inscription Philosophy
  **DATE:** October 26, 2024
  **SUBJECT:** Recommendation on Framing for the Eastern Marshland Centennial Monument Inscription

  ### I. Executive Summary

  The Commission faces a tripartite disagreement regarding the normative framing of the 1924 Eastern Marshland forced resettlement. After rigorous analysis of the proposed options against the philosophical framework provided by Karl Jaspers's *The Question of German Guilt*, this memo recommends the adoption of a **Refined Tri-Layer Attribution** model (Option 2, modified).

  This recommendation rejects the label of "collective guilt" for present-day citizens while affirming a binding "civic liability" derived from the continuity of the state. It further rejects a purely archival approach that ignores structural continuity. The proposed inscription distinguishes between *moral/criminal culpability* (restricted to historical actors) and *political responsibility* (inherited by the current polity). This distinction preserves the monument's educational and reparative functions without inviting the semantic backlash that threatens the longevity of Option 1.

  ### II. Operationalizing Jaspers: The Status of the Present-Day Polity

  To resolve this dispute, we must apply Jaspers's four categories not as historical labels, but as operational tools to determine the subject of the inscription's claims.

  1.  **Criminal Guilt:** Violation of codified law. *Subject:* Individual actors only. *Application:* The 1924 officials.
  2.  **Moral Guilt:** Violation of conscience/ethical duty. *Subject:* Individual actors only. *Application:* The 1924 officials and collaborating citizens alive at the time.
  3.  **Political Guilt:** Responsibility for the actions of the state by virtue of citizenship. *Subject:* The collective polity. *Consequence:* Liability for reparations and institutional reform.
  4.  **Metaphysical Guilt:** Co-responsibility for all human suffering based on human solidarity. *Subject:* All humans. *Consequence:* Spiritual transformation.

  **Determination on Present-Day Guilt:**
  Under Jaspers's framework, *Criminal* and *Moral* guilt cannot be inherited; they expire with the individual. Therefore, Faction 1's proposal to state that the nation "then and now bears collective guilt" is philosophically imprecise if it implies moral sin. However, *Political Guilt* does persist across generations insofar as the state remains a continuous entity. Current citizens are not "guilty" of the 1924 crime, but they are "liable" for the consequences of the state's continuity.

  **Determination on Inheritance-Burden:**
  Faction 2's "Inheritance-Burden" is the functional equivalent of Jaspers's *Political Guilt*, stripped of the morally loaded term "guilt." It holds normative weight because it is grounded in the **Benefit Principle** (current citizens inherit the infrastructure and stability built, in part, on the displacement) and the **Continuity Principle** (the legal entity that committed the act is the same entity governing today). This does not collapse into "guilt by association" provided the inscription explicitly exonerates current citizens of *moral* blame while binding them to *political* repair.

  ### III. Evaluation of Public Functions

  *   **Education:** Option 3 (Historical Record) fails here by obscuring the systemic nature of the event. Option 1 risks students rejecting the message due to defensive reactions against "collective shame." Option 2 allows for a clear explanation of *how* bureaucracy facilitates harm without demanding personal confession from visitors.
  *   **Mourning:** Option 1 validates victim pain most directly but risks centering the perpetrator's descendants' feelings. Option 2 centers the victims by focusing on the *harm done* and the *obligation to repair*, rather than the *sinfulness of the observer*.
  *   **Structural Accountability:** Option 2 is superior. By naming the "Structural-Layer," it identifies the mechanisms (laws, agencies) that allowed the resettlement. This provides a checklist for current prevention. Option 1's vague "collective guilt" offers no mechanism for prevention other than general remorse.

  ### IV. Recommendation: Refined Tri-Layer Attribution

  The Commission should adopt Option 2, with specific textual guardrails to ensure the "Inheritance-Burden" is not misinterpreted as optional charity.

  **Proposed Inscription Framework:**
  1.  **Perpetrator-Layer:** Names specific agencies and officials (Criminal/Moral Guilt).
  2.  **Structural-Layer:** Identifies the 1924 statutes and administrative orders (Political Context).
  3.  **Civic-Layer:** States that current citizens inherit the *obligation* of the state to repair and remember, distinct from the *guilt* of the act.

  ### V. Substantive Treatment of Dissenting Arguments

  **To Faction 1 (Collective Guilt Proponents):**
  *Strongest Argument:* You argue that avoiding the word "guilt" sanitizes structural responsibility. There is a valid fear that "Inheritance-Burden" sounds like a voluntary tax rather than a moral debt. By refusing to name the current nation "guilty," we risk allowing citizens to view reparations as benevolence rather than justice.
  *Response:* While this risk is real, Jaspers warns that conflating moral and political guilt dilutes both. If we accuse a child of their parent's murder, the child rejects the accusation and the court. If we accuse the child of paying the parent's restitution, the court functions. Precision protects the obligation. We must trade the catharsis of the word "guilt" for the durability of the word "liability."

  **To Faction 3 (Historical Record Proponents):**
  *Strongest Argument:* You argue that collective language instrumentalizes present citizens for symbolic catharsis, turning them into props for a moral drama they did not write. A monument should be a record of fact, not a vessel for contemporary political therapy.
  *Response:* A state-commissioned monument is inherently normative; it selects which facts matter. To list names without context (Option 3) implies these were rogue actors rather than agents of the state. This obscures the truth. The monument's function is not just to record the past, but to secure the future. Neutrality in the face of state crime is itself a political stance.

  ### VI. Conceptual Commitments and Ineliminable Value Judgments

  By voting for this recommendation, the Commission accepts the following commitments:

  1.  **State Continuity:** We affirm that the State of 2024 is the same legal and moral entity as the State of 1924. (This is a political construct, not an empirical fact).
  2.  **Obligation without Sin:** We affirm that one can be bound to fix a harm one did not personally cause. (This relies on a communitarian ethic of citizenship over a libertarian ethic of individualism).
  3.  **The Limit of Language:** We acknowledge that no inscription can fully capture the suffering of the Marshland communities. The text is a placeholder for ongoing action.

  **Ineliminable Value Judgments:**
  *   That *justice* requires more than *truth-telling*.
  *   That *citizenship* entails liability for the state's historical debts.
  *   That *prevention* is a higher priority than *confession*.

  ### VII. Protocol for Legislative Contradiction

  The Legislature retains final approval over the inscription text. If the Legislature demands wording that contradicts this framework (e.g., removing the Civic-Layer obligation or asserting total collective moral guilt):

  1.  **Public Addendum:** The Commission shall publish a "Statement of Philosophical Record" alongside the monument, detailing the Commission's original recommendation and explaining where the final text deviates from the established ethical framework.
  2.  **Resignation Option:** Any Commissioner who feels the altered text violates their ethical oath may resign for the record, with their dissenting opinion entered into the public archive.
  3.  **No Endorsement:** The Commission will not publicly endorse the altered text as philosophically sound, limiting our endorsement to the historical accuracy of the Perpetrator-Layer only.

  ### VIII. Proposed Inscription Text (Draft for Vote)

  > **IN MEMORY OF THE EASTERN MARSHLAND COMMUNITIES**
  >
  > **THE PERPETRATORS:**
  > In 1924, the [Specific Agency Name], under the direction of [Named Officials], ordered the forced removal of 4,000 residents.
  >
  > **THE STRUCTURE:**
  > This displacement was authorized by [Specific Act/Statute], utilizing the bureaucratic machinery of the State to dismantle homes and livelihoods.
  >
  > **THE OBLIGATION:**
  > While the moral guilt of this act rests solely with those who ordered and executed it, the political liability of the State endures. We, the citizens of today, inherit not the guilt of our predecessors, but the burden of their consequences. We accept the obligation to maintain this truth, to fund the repair of generational harm, and to guard against the recurrence of such authority.
  >
  > **NEVER AGAIN THROUGH SILENCE.**

  ### IX. Motion for Vote

  **Motion:** To recommend the "Refined Tri-Layer Attribution" framework and the associated Draft Inscription Text to the Legislature, subject to the Protocol for Legislative Contradiction outlined in Section VII.

  **Second:** ____________________

  **Vote:**
  [ ] Yes
  [ ] No
  [ ] Abstain

  ____________________
  *Commissioner Signature*
