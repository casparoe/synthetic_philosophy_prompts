          *   Consequence: The "Accountability Thread" becomes useless for standing. The "Hypocrisy" popup disappears.
          *   Risk: Perceived unfairness ("Why can *you* report me?").
      *   **Settled vs. Contested:**
          *   *Settled:* Standing is distinct from truth.
          *   *Contested:* Whether hypocrisy negates standing. (Cite the debate: Bell vs. Fritz vs. others).
          *   *Contested:* Whether redemption restores standing fully or just partially.

  5.  **Refining the Philosophical Nuance (Self-Correction during drafting):**

