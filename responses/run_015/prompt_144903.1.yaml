      *   **Constraints:** No standard sci-fi tropes (no robot consciousness/sentience debates). No explicit philosophical exposition or named theories in dialogue.
      *   **Key Incident:** Infrastructure model prediction error causes public harm (malfunction vs. false belief).
      *   **Ending:** Auditor files two incompatible reports (one for system, one for mother) using *identical language*. Open-ended conclusion regarding unified science vs. fragility of habits.

  2.  **Character & Setting Development:**
      *   *Protagonist:* Elara. Needs to be precise, bureaucratic, but emotionally strained.
      *   *Mother:* Sarah. Needs to show goal-directed but fragmented behavior (e.g., making tea but forgetting the water, or trying to leave the house for a job she retired from).
      *   *The System:* "Traffic Flow Optimization Node 44-B" (or something similar). Let's call it the "Grid-Logic Municipal Forecasting Array." It controls traffic lights and routing.
