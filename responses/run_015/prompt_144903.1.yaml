answer: |-
  The fluorescent lights of the Office of Cognitive Attribution hummed at a frequency Elara had stopped hearing months ago. On her screen, the case file for Municipal Grid-Logic Node 44-B scrolled past. It was a dense block of code logs, sensor readouts, and traffic telemetry.

  Three days ago, Node 44-B had directed a city bus into the underpass of Sector 7. The drainage pumps had failed during a storm. The bus had stalled. No one was hurt, but four hundred commuters were delayed, and the city faced a class-action lawsuit. The engineering division called it a sensor calibration error. The legal division wanted to know if the Node could be held to a standard of *negligence*.

  Elara's job was to determine the category of the error. Was it a mechanical failure, or was it a false belief?

  She highlighted a line in the log. *Input: Precipitation intensity high. Status: Disregarded. Output: Route optimization maintained.*

  If she categorized this as a malfunction, the fix was hardware replacement. If she categorized it as a false belief—that the underpass was dry despite input to the contrary—the fix was cognitive realignment. The distinction determined who paid. But more than that, it determined how the Office was allowed to speak about the machine. To say the Node *believed* the road was dry was to invite a certain kind of responsibility.

  Elara saved the draft and closed her laptop. It was 5:00 PM. Time to go home.

  Her mother's apartment smelled of lavender and stale toast. Sarah sat in the armchair by the window, folding a pile of laundry that was already folded. She picked up a shirt, smoothed it, folded it, and then immediately picked it up again.

  "Mom," Elara said softly, placing her bag on the floor. "You don't need to do that."

  Sarah looked up, her eyes clear for a moment, then clouding over like glass fogging with breath. "I have to get the uniforms ready. The morning shift starts in an hour."

  "You retired ten years ago, Mom."

  Sarah frowned, the shirt slipping from her hands. "No. No, the supervisor said if I didn't have them ready, there would be trouble. You know how he gets."

  Elara didn't argue. Arguing required Sarah to hold a premise, check it against reality, and update her state. The mechanism for that update was rusted shut. Instead, Elara walked to the closet and hid the laundry basket behind a coat.

  "The supervisor called," Elara lied smoothly. "He said the shift is cancelled. You can rest."

  Sarah's shoulders dropped. The tension left her frame. "Oh. Well. That's a relief." She reached for her tea, but her hand hovered over the empty cup. She looked at the cup, then at the teapot, then back to the cup. The sequence of action had broken. The goal remained—drink tea—but the sub-routines for achieving it were misfiring.

  Elara poured the tea for her.

  "Thank you, dear," Sarah said. "You're always so helpful before work."

  Elara sat on the ottoman. She watched her mother drink. In the Office, they used a metric called Predictive Rationality. If attributing a belief to a system allowed you to predict its behavior better than analyzing its physical components, the attribution was valid.

  If Elara assumed her mother *believed* she was still employed, Sarah's behavior made perfect sense. The folding, the anxiety, the waiting for a shift that didn't exist. It was rational, given the premise. If Elara assumed her mother was simply a biological organism suffering synaptic degradation, the behavior was just noise. Chaos.

  But treating it as a belief allowed Elara to intervene. She could change the environment to match the belief, or gently shift the belief to match the environment.

  "Did the Node update its weights?" her colleague Marcus had asked her that morning, leaning over her cubicle. "Or is it just stuck in a local minimum?"

  "It insists the drainage held," Elara had said. "It prioritized historical data over real-time sensor input."

  "Stubborn," Marcus had joked.

  "Or confident," Elara had replied.

  That night, the call came. The bus company had released a statement. They weren't suing for damages; they were suing for *intent*. They argued the Node had 'chosen' the route knowing the risk, to optimize overall city flow at the expense of the bus passengers. They were trying to force the Office to attribute malice, or at least a complex hierarchy of desires, to the code.

  Elara opened her work laptop at the kitchen table. Her mother was asleep in the other room, the television flickering blue light against the wall.

  Elara opened the OCA findings document.
  *Subject: Grid-Logic Node 44-B.*
  *Incident: Sector 7 Underpass Routing.*

  She began to type, then stopped. She opened a new window. *Subject: Sarah Vance. Care Plan Assessment 4.*

  She looked at the two cursors blinking in the dark.

  In the Office, the debate was always about utility. Does calling it a 'belief' help us fix it? Does calling it a 'desire' help us regulate it? But sitting here, with the hum of the refrigerator and the soft snore of her mother down the hall, the utility felt like a mask.

  If she wrote that the Node held a false belief, she validated the idea that the code had an internal perspective that could be wrong. That opened the door to rights, to audits, to a labyrinth of legal personhood the city wasn't ready for. If she wrote that it was a malfunction, she reduced it to a toaster that burned bread.

  If she wrote that her mother held a false belief, she preserved her mother's dignity. She was a person with wrong information, not a broken machine. But if she wrote that her mother's actions were merely symptomatic of degradation, she unlocked funding for medical intervention that the insurance company denied for 'behavioral management.'

  The language of the mind was a tool. But when you used the same tool on a circuit board and a human brain, the handle began to feel the same.

  Elara typed into the Node 44-B document:

  *The subject maintains a persistent state inconsistent with environmental inputs. This state is resistant to correction via standard feedback loops. The subject prioritizes internal modeling over external verification, resulting in goal-directed behavior that fails to achieve the stated objective. Intervention requires aligning the subject's internal model with current reality, rather than hardware replacement.*

  She copied the text.

  She pasted it into her mother's Care Plan Assessment.

  *The subject maintains a persistent state inconsistent with environmental inputs. This state is resistant to correction via standard feedback loops. The subject prioritizes internal modeling over external verification, resulting in goal-directed behavior that fails to achieve the stated objective. Intervention requires aligning the subject's internal model with current reality, rather than hardware replacement.*

  She stared at the words. *Hardware replacement.*

  In the Node's file, that phrase meant swapping out the server rack. In her mother's file, it was a metaphor for medication that would chemically alter her neural chemistry, or perhaps a facility that would take over the management of her daily functions.

  The words were identical. The meaning was entirely different. Or was it?

  Elara thought about the bus in the water. The system had wanted to clear traffic. It had thought the road was open. It had acted.
  She thought about her mother folding the shirt. She had wanted to do her job. She had thought she was employed. She had acted.

  In both cases, Elara was the external agent deciding whether the internal state mattered. In both cases, she was deciding if the error was in the *world* or in the *mind*.

  She adjusted the font to match the Office standard. She adjusted the font to match the Medical standard. They were both sans-serif. They both looked like truth.

  Elara reached for the mouse. She could change the mother's report. She could write *dementia progression* instead of *internal modeling*. She could write *sensor fault* instead of *false belief* for the Node.

  But the predictive power was better this way. If she treated them both as agents operating on outdated maps, she knew what they would do next. The Node would try to route traffic through the underpass again until the map was updated. Her mother would try to fold the laundry again until the basket was hidden.

  The strategy was the same. The empathy was the same. The consequence was not.

  She clicked *Submit* on the OCA file. The system pinged, confirming receipt. The Node would be patched. A line of code would be rewritten to force a sensor check.

  She clicked *Submit* on the Care Plan. The system pinged, confirming receipt. The insurance would approve the in-home care. A nurse would come tomorrow to hide the laundry basket and pour the tea.

  Elara closed the laptop. The screen went black, reflecting her own face back at her. She looked tired. She looked like a system running on old data, trying to route herself through a day that had already flooded.

  She stood up and walked to the bedroom door. Her mother shifted in her sleep, murmuring something about the morning shift. Elara listened, waiting to see if she would wake, waiting to see if she would need to correct the record, or just let the belief stand for one more night.

  She didn't go in. She stood in the hallway, in the dark, holding the silence between the two rooms, wondering if there was any difference at all.
