      *   **Inciting Incident (Work):** The Node 44-B incident. A bus was routed into a flooded underpass. Was it a bug or a belief?
      *   **Parallel Incident (Home):** Elara visits her mother. Mother tries to "go to work" or perform a routine task that no longer makes sense. Elara analyzes this behavior similarly to the Node.
      *   **Rising Action:** Elara tries to reconcile the two. The hearing/adjudication process for the Node. The care plan meeting for the mother.
      *   **Climax:** The moment of decision. Filling out the forms. The realization that the language fits both.
      *   **Resolution:** Filing the reports with identical phrasing. Ambiguity remains.

  4.  **Drafting - Scene by Scene:**

      *   *Scene 1: The Office.* Establish the tone. Elara is looking at logs. The Node diverted a bus. The official line is "sensor calibration error." Elara's job is to see if "belief attribution" yields better predictive power.
      *   *Scene 2: The Mother.* Elara visits. Mother is making coffee but puts the grounds in the cupboard and the jar in the filter. She says she needs to catch the 8:15. Elara doesn't correct her; she manages the environment. She notes the "goal" (get to work) and the "belief" (it's 1995).
      *   *Scene 3: The Incident Analysis.* Back at work. The Node ignored a flood warning. Why? Maybe it "believed" the drainage would hold based on historical data. If we call it a false belief, we can patch the logic. If we call it a malfunction, we replace the hardware. The distinction matters for liability.
      *   *Scene 4: The Convergence.* Elara is tired. She's drafting the finding for the Node. She's also drafting the care assessment for her mother. She notices the syntax is the same. "Subject operates under the assumption that..."
      *   *Scene 5: The Ending.* She types the same paragraph into both documents. One leads to a software patch (or liability waiver), the other to a locked door or medication. The words are the same; the consequences are vastly different.

  5.  **Refining the Philosophy (Show, Don't Tell):**
      *   Avoid saying "Dennett's intentional stance."
