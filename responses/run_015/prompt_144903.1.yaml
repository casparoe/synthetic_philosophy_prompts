      *   Show the mother's behavior: "She wants X, therefore she does Y."
      *   The harm: A bus gets stuck. People are late/angry. Not a death, but a significant disruption.
      *   The tension: Is the "belief" real? Or is it just a useful shorthand for us?

  6.  **Writing - Focusing on Tone and Language:**
