prompt: |-
  I work for a fisheries and wildlife agency, and we keep getting proposals to list newly discovered populations as distinct species for the purposes of conservation law. The concept of species is philosophically contentious: the biological species concept (reproductive isolation) and the phylogenetic species concept (monophyly) can give different answers for the same population, and it is not clear whether species are natural kinds at all or whether the right species concept is a matter of pragmatic choice. Please write a decision procedure my team could actually run on a proposal to list a population as a distinct species: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values rather than facts. Then run it on two proposals: listing a newly discovered fish population that is reproductively isolated but not monophyletic, and listing a bird subspecies that is monophyletic but not reproductively isolated.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and its application:

  1.  **Analyze the Request:**
      *   **User:** Works for a fisheries and wildlife agency.
      *   **Problem:** Receiving proposals to list new populations as distinct species for conservation law.
      *   **Context:** The concept of "species" is philosophically contentious (BSC vs. PSC, natural kinds vs. pragmatic).
      *   **Task:** Create a practical decision procedure (flowchart-like logic) for the team to evaluate proposals.
          *   Must include ordered questions.
          *   Must define sufficient answers.
          *   Must identify stop points (rejection).
          *   Must identify hand-off points (value judgments/policy decisions).
      *   **Application:** Run the procedure on two specific cases:
          1.  Fish: Reproductively isolated (BSC yes) but not monophyletic (PSC no).
          2.  Bird: Monophyletic (PSC yes) but not reproductively isolated (BSC no).

  2.  **Deconstruct the Philosophical/Legal Tension:**
      *   *Science vs. Policy:* Science describes reality; policy manages resources. Conservation law usually requires a discrete unit to protect.
      *   *Species Concepts:*
          *   Biological Species Concept (BSC): Focuses on interbreeding/reproductive isolation. Good for ecological function, bad for asexual organisms or allopatric populations.
          *   Phylogenetic Species Concept (PSC): Focuses on shared ancestry/diagnosability. Good for evolutionary history, bad for lumping distinct ecological units that haven't diverged genetically yet.
          *   Evolutionary Significant Unit (ESU): Often used in conservation policy to bridge the gap. Focuses on adaptive distinctiveness.
      *   *The "Natural Kind" Problem:* If species aren't real, listing them is arbitrary. *Solution:* Acknowledge the arbitrariness but anchor it in statutory intent (biodiversity preservation).
      *   *The "Value" Hand-off:* Science can say "these are different," but policy decides "does this difference matter enough for legal protection?"

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* Make it actionable, not just theoretical. It needs to fit within a bureaucratic framework (like the US Endangered Species Act or similar).
      *   *Step 1: Data Sufficiency.* Can we even evaluate this? (Stop if no).
      *   *Step 2: Statutory Definition.* What does the law say? (Crucial first step).
      *   *Step 3: Scientific Consensus.* Do the data support *any* major species concept? (If neither BSC nor PSC supports it, hard stop).
      *   *Step 4: Conflict Resolution.* What if BSC and PSC disagree? (This is the core of the prompt).
      *   *Step 5: Conservation Relevance.* Is the distinctiveness meaningful for survival/management? (The Value Hand-off).
      *   *Step 6: Final Recommendation.*

      *Refining the "Value Hand-off":* The prompt asks where to hand decision to a person because it's values, not facts. This usually happens when science is ambiguous or when trade-offs exist (e.g., protecting this unit harms another). I need to mark this clearly.

  4.  **Developing the Procedure (Iterative refinement):**
      *   *Q1:* Is the population discrete? (Distinctness).
      *   *Q2:* Is it significant? (Importance).
      *   *Wait, standard policy (like ESA DPS policy) uses "Discreteness" and "Significance".* I should align with that but incorporate the philosophical nuance requested.
      *   *Revised Q1 (Fact):* Does the population meet *at least one* rigorous species criterion (BSC, PSC, or Ecological)?
      *   *Revised Q2 (Fact/Interpretation):* If criteria conflict, is there evidence of independent evolutionary trajectory?
      *   *Revised Q3 (Value):* Does listing this unit align with the statutory goal of biodiversity vs. resource management? (This is the hand-off).

      *Let's make it more algorithmic as requested.*
      1.  **Threshold Check:** Is there data?
      2.  **Concept Alignment:** Does it fit BSC *or* PSC?
      3.  **Conflict Check:** Do they disagree?
      4.  **Conservation Utility:** Does recognizing this unit aid conservation goals? (Value judgment).

  5.  **Running the Procedure on Case 1 (Fish):**
      *   *Facts:* Reproductively isolated (BSC = Yes), Not monophyletic (PSC = No).
      *   *Step 1:* Data exists. Pass.
      *   *Step 2:* Meets BSC. Pass.
      *   *Step 3:* Conflict exists.
      *   *Step 4:* Why not monophyletic? Maybe recent divergence. But they are isolated *now*.
      *   *Step 5 (Value):* Does protecting this isolated group preserve genetic diversity or ecological function?
      *   *Outcome:* Likely recommend listing, but flag the PSC conflict for the decision-maker.

  6.  **Running the Procedure on Case 2 (Bird):**
      *   *Facts:* Monophyletic (PSC = Yes), Not reproductively isolated (BSC = No).
      *   *Step 1:* Data exists. Pass.
      *   *Step 2:* Meets PSC. Pass.
      *   *Step 3:* Conflict exists.
      *   *Step 4:* Why not isolated? Hybridization? Recent contact?
      *   *Step 5 (Value):* Is the genetic distinctiveness worth protecting if they still mix genes?
      *   *Outcome:* Harder case. Hand off to policy maker.

  7.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the philosophical tension but emphasize the legal mandate.
      *   **The Procedure:** Numbered steps, clear "Stop/Continue/Hand-off" instructions.
      *   **The Application:** Walk through the Fish and Bird cases step-by-step.
      *   **Conclusion:** Summary of why this works.

  8.  **Self-Correction/Critique during drafting:**
      *   *Critique:* Make sure I don't just say "follow the law." The prompt implies the law relies on the concept of species which is fuzzy.
      *   *Fix:* Explicitly state that the procedure translates philosophical ambiguity into administrative risk categories.
      *   *Critique:* Ensure the "Value Hand-off" is distinct.
      *   *Fix:* Label specific steps as "Administrative/Policy Decision."
      *   *Critique:* The prompt asks for "where the procedure stops with a no."
      *   *Fix:* Include explicit "REJECT" terminals.

  9.  **Final Polish:** Check tone (professional, bureaucratic but intellectually honest). Ensure the distinction between *fact* (genetic data, breeding obs) and *value* (conservation priority) is sharp. (Self-correction: Ensure I mention the "Evolutionary Significant Unit" concept as it's the standard bridge in US law, even if not explicitly named in the prompt, it solves the BSC/PSC conflict).

  10. **Final Review against constraints:**
      *   Decision procedure? Yes.
      *   Questions in order? Yes.
      *   Sufficient answers defined? Yes.
      *   Stop points identified? Yes.
      *   Value hand-off identified? Yes.
      *   Run on Fish case? Yes.
      *   Run on Bird case? Yes.

