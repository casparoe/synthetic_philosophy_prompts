answer: |-
  The deadlock is substantive, arising from incompatible axioms of rationality, though your hypothesis accurately locates the friction in the demand for global completeness versus the permission for local coherence. The transitivity camp treats "better than" as a relation that must support a global utility function, arguing that without transitivity, agents are vulnerable to money pumps and thus irrational; consequently, they insist that small differences must aggregate to a lexical threshold where the marginal change finally matters enough to break the chain. The intransitivity camp treats "better than" as a verdict on pairwise comparisons grounded in specific qualitative features, arguing that our confidence in local judgments (A is better than A-) outweighs our confidence in abstract structural constraints; consequently, they accept that value can be multi-dimensional and non-lexical, allowing small differences to remain negligible at every step even as the endpoints diverge dramatically. Your hypothesis correctly diagnoses that the former requires a God's-eye view where all possibilities are commensurable on a single scale (global completeness), while the latter permits value to be context-sensitive and relationally defined within restricted domains (local coherence). This divergence explains why the parties talk past each other: the transitivist sees the failure of transitivity as a collapse of rational ordering, while the intransitivist sees the insistence on transitivity as a distortion of nuanced value phenomenology. Progress would not come from a formal result proving transitivity holds, since both sides can construct consistent formal models (one with lexical thresholds, one with non-transitive relations), but rather from a conceptual distinction that decouples "better than" from "choosable from." If we can demonstrate that rational choice does not require a transitive "better than" relation—for instance, by adopting a choice-function framework that avoids money pumps without imposing global ordering—the substantive stakes would dissolve, revealing the demand for transitivity as a methodological artifact rather than an ontological necessity. Until such a distinction is widely accepted, the debate will remain stalled on the substantive question of whether rationality mandates a single, complete ordering of all possible worlds.
