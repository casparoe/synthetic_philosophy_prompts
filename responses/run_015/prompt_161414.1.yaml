answer: |-
  Your intuition is robust: cooperation is an ordering transition driven by effective interaction range, the five mechanisms are distinct implementations of positive assortment equivalent to symmetry-breaking fields, and the "rationality" residue is largely an artifact of finite-agent modeling that dissolves under evolutionary dynamics.

  ### The Translation

  **The System:** A lattice of $N$ sites (agents), each occupied by a spin $\sigma_i \in \{+1, -1\}$ corresponding to Cooperate (C) and Defect (D). The system evolves via stochastic dynamics (Monte Carlo) where spin flips are accepted based on a fitness function derived from the payoff matrix.

  **The Hamiltonian:** In the one-shot Prisoner's Dilemma, the local energy landscape is frustrated. Defection is the local ground state regardless of neighbor configuration. Formally, the payoff matrix maps to an interaction energy $H = -\sum_{\langle i,j \rangle} J_{ij} \sigma_i \sigma_j - \sum_i h_i \sigma_i$. In the standard one-shot case, the effective field $h_i$ and couplings $J_{ij}$ are such that $\sigma_i = -1$ minimizes energy locally. The global ground state is all-Defect (paramagnetic or trivial ferromagnetic depending on mapping), and any Cooperate cluster is metastable and decays via nucleation.

  **Iteration and the Shadow of the Future:** Iterating the game adds a temporal dimension, effectively turning a 0D local problem into a 1+1D path integral. The discount factor $\delta$ (probability of continuation) acts as the correlation length $\xi_t$ along the time axis. When $\delta \to 0$, the system is decoupled in time (one-shot). As $\delta \to 1$, the effective interaction range along the time axis diverges. Tit-for-Tat (TFT) is a local update rule with memory: $\sigma_i(t+1) = \sigma_j(t)$. This introduces inertia. Generous TFT adds noise (finite temperature) to prevent locking into absorbing states (mutual defection traps).

  **Evolutionary Stability:** An Evolutionarily Stable Strategy (ESS) is a free-energy minimum. It is not necessarily the ground state (global energy minimum) but a metastable state separated by a high barrier from the Defect state. In finite populations, this is subject to finite-size rounding; drift allows tunneling through barriers.

  **The Five Mechanisms as Interaction Modifiers:**
  1.  **Kin Selection:** Introduces a fixed disorder component to the couplings $J_{ij}$. Interactions are weighted by relatedness $r$. Effectively, $J_{ij} \to r J_{ij}$. This lowers the energy cost of alignment (cooperation) among kin.
  2.  **Direct Reciprocity:** As above, extends the interaction range in time. Increases the effective coordination number along the time axis.
  3.  **Indirect Reciprocity:** Introduces a global mean-field term (reputation score). The local field $h_i$ becomes dependent on the global order parameter (public image), creating a feedback loop that can stabilize the Cooperate phase.
  4.  **Structured Interaction (Network Reciprocity):** Changes the lattice topology. Moving from a mean-field (well-mixed) graph to a low-dimensional lattice or scale-free network changes the percolation threshold. Cooperators form clusters that protect themselves from Defector invasion (surface tension effects).
  5.  **Group Selection:** A renormalization group (RG) flow. Selection operates at two scales: within groups (spins favor Defect) and between groups (clusters of Cooperators have lower "group energy" and replicate). Cooperation survives if the inter-group selection pressure exceeds the intra-group decay rate.

  ### Residue Report

  **Hunch 1: Probability of Encounter as Correlation Length/Critical Point**
  You are correct, with a caveat on universality. The continuation probability $\delta$ functions exactly as a control parameter tuning the effective interaction range. In the thermodynamic limit ($N \to \infty$, zero mutation), the transition from Defection to Cooperation at a critical $\delta_c$ is a genuine phase transition (bifurcation). The order parameter (density of cooperators) goes from zero to non-zero. However, in any finite system with non-zero mutation rate (temperature), the transition is technically a sharp crossover. The "diverging" quantity is the lifetime of cooperative clusters. If you treat mutation as $T > 0$, the singularity is rounded, but the susceptibility (response to a change in $\delta$) still peaks sharply. You are not misreading it; it is a non-equilibrium phase transition belonging to a universality class determined by the update rule (e.g., voter model vs. Glauber dynamics).

  **Hunch 2: Five Mechanisms as Positive Assortment**
  This reduction is honest and physically sound. All five mechanisms modify the covariance between an agent's strategy and its neighbor's strategy ($\text{Cov}(\sigma_i, \sigma_j)$). In physics terms, they all increase the effective coupling constant $J_{eff}$ or reduce the frustration in the Hamiltonian such that the Cooperate state becomes energetically favorable relative to Defect. Hamilton's rule ($rb > c$) is literally an energy balance equation: the benefit $b$ weighted by coupling $r$ must exceed the cost $c$. The "five rules" are simply five different topological or dynamical ways to engineer a positive $J_{eff}$ in a system where the bare coupling favors defection. Nothing essential is thrown away by this reduction; it isolates the order parameter dynamics from the implementation details.

  **The Missing Vocabulary: Agency and Normativity**
  Your vocabulary lacks "intent," but this is a feature, not a bug. Game theory's "rational choice" is a zero-temperature greedy algorithm assumption that often fails to predict actual dynamics. In evolutionary game theory, "rationality" is replaced by replication dynamics (replicator equation), which is isomorphic to Langevin dynamics in a fitness landscape. The "reason" an agent cooperates is irrelevant; only the gradient of the fitness landscape matters. The "tournament" problem you identified is indeed a finite-size sampling artifact; a strategy winning a tournament is like a specific spin configuration having low energy in one realization of disorder—it does not guarantee it is the ground state of the ensemble. The normative "ought" (why agents *should* cooperate) has no physics counterpart because physics describes trajectories, not obligations.

  ### Residue Table

  | Game Theory Concept | Physics Analog | Status |
  | :--- | :--- | :--- |
  | **Rational Choice** | Zero-Temperature Greedy Dynamics | **Approximation:** Assumes infinite computation speed/no noise; often fails against stochastic evolution. |
  | **Agency / Intent** | None | **Missing:** Physics tracks state changes, not internal causation; irrelevant for outcome prediction. |
  | **Tournament Winner** | Low-Energy State in Specific Disorder Realization | **Artifact:** Finite-size effect; does not imply thermodynamic stability. |
  | **Normative "Ought"** | Ground State Selection | **Category Error:** Physics describes stable states, not moral necessity. |
  | **Backward Induction** | Boundary Condition Propagation | **Fragile:** Requires common knowledge of horizon (fixed boundary); collapses with uncertainty (free boundary). |
  | **Strategy Complexity** | Degrees of Freedom / Memory Kernel | **Valid:** Maps to number of internal states or time-lag in interaction Hamiltonian. |
