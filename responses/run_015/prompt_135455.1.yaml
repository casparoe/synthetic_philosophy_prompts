answer: |-
  Anscombe's absolutist framework maintains that the charge of murder sticks firmly to Truman as the sovereign authority, but it also implicates every committee member who knowingly facilitated the act, leaving her theory silent on how to weigh diluted intent within complex bureaucratic structures where no single person feels they pulled the trigger.

  For Anscombe, moral responsibility is not a finite resource that gets divided among participants; it is an individual burden tied to intention. Truman bears the primary charge because he possessed the ultimate veto power and ratified the intention to kill civilians as a means to end the war, making him the principal agent of the act. However, her rejection of consequentialism means that participation in a committee does not absolve your grandfather or his colleagues; if they knowingly provided the logistical means for an act they understood to be the intentional killing of innocents, they are formal cooperators in murder, sharing the guilt rather than diluting it. Anscombe would argue that bureaucracy cannot sanitize conscience, and being a "cog" in a machine designed for immoral ends does not negate individual moral agency.

  Her framework becomes silent, however, when faced with the epistemic fragmentation of modern distributed agency. Anscombe assumes a relatively clear line between the intention of the actor and the moral object of the act, but she does not fully account for systems where knowledge is compartmentalized—where a logistics officer might track supplies without explicitly confronting the final target, or where a committee vote obscures individual causality. In cases where the "trigger" is pulled by a consensus algorithm or a layered chain of command, her ethics lack a mechanism to adjudicate degrees of culpability when each participant can plausibly claim their specific contribution was morally neutral in isolation. Consequently, while she would insist the guilt does not vanish, her philosophy offers little guidance on how to distribute blame when the structure is designed specifically to make intention difficult to pinpoint.
