answer: |-
  ### Desiderata for a Predictive Agent Spec

  **1. Resolution of the Dark Room Problem (Non-negotiable)**
  The theory must mathematically distinguish between *resolvable* uncertainty (which drives exploration) and *irresolvable* uncertainty (which drives avoidance), without adding an external "curiosity" reward term. If it fails, the agent will either freeze in a dark corner to minimize input or thrash randomly in chaos, neither of which looks like adaptive behavior.

  **2. Efference Cancellation Mechanism (Non-negotiable)**
  The architecture must include a specific pathway where motor commands generate a predicted sensory consequence that subtracts from actual input, attenuating self-caused error. If this knob isn't explicit, the agent will treat its own movements as external surprises and try to cancel them by moving back, resulting in paralysis or tremor.

  **3. Precision Estimation without Regress (Taste)**
  The system must specify how "confidence" (precision) in a prediction is calculated without requiring a separate network to predict the confidence of the confidence. If precision is fixed, the agent can't attend; if it requires infinite meta-layers, it's computationally impossible; most implementations cheat by using local error variance as a proxy.

  **4. Hierarchy Necessity Declaration (Non-negotiable)**
  The theory must state explicitly whether deep temporal abstraction requires physical layers or if a flat recurrent network can approximate the same function. If hierarchy is required, a flat RNN will fail to learn long-term dependencies; if it's optional, you save massive compute but lose interpretability of "high-level" beliefs.

  **5. Tractable Approximation Spec (Non-negotiable)**
  Since exact Bayesian inference is intractable, the theory must name the specific approximation used (e.g., Laplace, mean-field, point-estimate) and what information is discarded. If it just says "roughly Bayesian," you cannot debug why the agent diverges, because the math doesn't map to the code.

  **6. Falsifiable Behavioral Prediction (Non-negotiable)**
  The theory must predict a specific behavior that would *disprove* it if observed, rather than retrofitting all behavior as "free energy minimization." If staying still and moving actively are both described equally well as "minimizing free energy," the theory is vacuous and useless for design.

  **7. Thermodynamic Honesty (Taste)**
  The spec must clarify whether "free energy" refers to literal physical energy (metabolism/heat) or is purely an information-theoretic bound on surprise. If it's just a math trick, stop using thermodynamic metaphors to imply biological necessity; if it's literal, show where the heat dissipation happens in the simulation.

  ***

  ### The Incompatibility & The Killer Requirement

  You cannot satisfy **No Reward Function**, **Dark Room Solution**, and **Being Small** simultaneously. Pure surprise minimization leads to the dark room; solving this requires minimizing *expected future* surprise (Active Inference), which demands heavy computation (violating "Being Small") or implicitly encodes value in precision weights (violating "No Reward").

  **Drop "No Reward Function."** Admit that precision weighting *is* an intrinsic reward signal. It allows you to keep the agent small and solve the Dark Room problem by treating "learning progress" as a value signal without pretending it's pure surprise minimization.

  **The Killer Requirement:** **Falsifiable Behavioral Prediction.** This kills the most theories because most predictive processing frameworks are descriptive post-hoc narratives rather than prescriptive algorithms that can fail. If the theory can't tell you what the agent will do *wrong* under specific conditions, it cannot guide your implementation.

  ***

  ### Scorecard: Three Flavors

  **1. Hierarchical Predictive Coding (HPC)**
  Crashes on **Dark Room** and **Architecture**: it explains perception well but lacks a native action mechanism to resolve error, often requiring a separate controller. It also strictly demands deep layers for abstraction, violating your desire for a flat, small network.

  **2. Active Inference / Expected Free Energy (AIF)**
  Crashes on **Being Small**: calculating expected free energy over future policies is computationally expensive and requires a sophisticated generative model of transitions. It solves the Dark Room problem via epistemic value but smuggles "value" into the expectation term, blurring the **No Reward** line.

  **3. MPC with Curiosity Bonus**
  Crashes on **No Reward**: this approach explicitly adds an intrinsic reward term for prediction error reduction, which violates your core constraint. However, it passes **Falsifiability** and **Being Small** easily, making it the only one likely to produce working code on your budget.
