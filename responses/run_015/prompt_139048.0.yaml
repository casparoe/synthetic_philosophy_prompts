      **DIRECTORATE-GENERAL FOR CULTURAL INHERITANCE**
      **Green Paper: Securing the Accumulation of Culture: Proposals for a Cultural Germ Line**

      **1. Executive Summary**
      This consultation document outlines a regulatory framework to stabilise cultural transmission. Current mechanisms exhibit high variance and low fidelity, impeding cumulative evolution. By instituting a formal germ line for Cultural Units (CUs), the Directorate-General for Cultural Inheritance (the Directorate) proposes to isolate heritable information from somatic expression. This ensures verifiable lineage, reduces noise, and aligns cultural propagation with established biological principles. The scheme is designed to be revenue-neutral, funded through transmission licence fees.

      **2. Statement of the Problem**
      It is acknowledged that culture currently functions as a deficient Darwinian system. Transmission involves reconstruction rather than copying, leading to blending inheritance where variants fail to segregate. Novelties arise via designed modification rather than blind chance, and unit boundaries remain undefined. These are not merely theoretical objections but operational defects. They prevent the rigorous selection of high-fidelity CUs. Without intervention, cultural accumulation remains stochastic and unaccountable. The Directorate posits that these deficiencies can be remedied through statutory regulation of the transmission process.

      **3. Definitions**
      For the purposes of this scheme, a Cultural Unit is defined as the smallest discrete packet of information subject to inheritance. To ensure enforceability, the grain of the CU is fixed at a size legible to inspectors and billable under the licence schedule. While theoretical debates regarding semantic boundaries persist, administrative convenience dictates that a CU shall correspond to a single inspectable artefact, performance, or text segment. This standardisation allows for consistent auditing. It is noted that the choice of grain is determined by regulatory capacity rather than natural kind, ensuring that all transmissible data falls within a chargeable bracket.

      **4. The Proposal**
      A Weismannian separation is to be imposed between the germ line and somatic expressions. A designated master copy, held under archival conditions, constitutes the only permitted source of transmission. Instantiations—loaves baked, songs performed, tools used—are classified as somatic and disposable. Verbatim copying is mandated within the germ line. Because improvement by a copyist constitutes acquired modification, it is not heritable. A Blind Variation Requirement stipulates that alterations may enter the pool only through a randomised error-injection schedule. A copyist may not substitute a superior version for the one received, however obviously better it is. Furthermore, prestige and success bias are treated as distortions analogous to anti-competitive practice. Transmission to non-descendants is handled as unregulated lateral transfer: efficient, yet destructive of pedigree.

      **5. Schedule of Transmission Licences**
      All vertical transmission requires a Class-A Heritage Licence. Lateral transfer between unrelated carriers requires a Class-B Lateral Licence, subject to higher fees due to pedigree risk. Compliance targets are set at 95% fidelity across all licensed transactions. Inspectors are authorised to seize non-compliant master copies.

      **6. Carrier-Welfare Clause**
      Human beings are herein referred to as carriers or vehicles. Nothing in this scheme is adverse to carrier interests; however, the primary mandate is to serve the pool of CUs rather than the carriers themselves. Where carrier welfare conflicts with CU fidelity, the integrity of the germ line takes precedence. Compensation mechanisms are available where carrier fitness is demonstrably lowered by CU propagation.

      **7. Answering the Charge of Censorship**
      It may be argued that restricting modification constitutes censorship. However, every education system already biases transmission toward selected variants. This scheme merely makes an existing bias explicit, legible, and subject to appeal. By formalising the selection criteria, the Directorate ensures that bias is administered transparently rather than implicitly through informal prestige networks.

      **8. Annex: Worked Examples**
      *Example A:* A sourdough starter represents the model institution: a genuine lineage with a physical germ line, vertical transmission, and high fidelity. The recipe for maintaining the starter, however, is culture, and therefore precisely the unreliable part. The starter is preserved; the recipe is regulated.
      *Example B:* A variant spreads successfully while lowering the fitness of the human beings who carry it. The paper finds itself required, by its own mandate to serve the pool rather than its carriers, to protect it. The difficulty is resolved with a one-replicator-health clause and a scheme of compensation payments to affected carriers.

      **9. Closing**
      A pilot scheme will commence in Q3. A fidelity target of 99.9% is established for the germ line. The programme will be revenue-neutral through licence fees.

