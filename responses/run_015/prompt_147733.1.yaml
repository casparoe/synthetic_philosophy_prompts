  # Diagnostic Decision Tree: Pragmatist Theories of Truth

  **Root Node**
  **Question:** Is truth essentially a property of beliefs that successfully guide action in experience, with no further constraint?
  *   **No:** **Exit.** (Respondent holds a correspondence, coherence, or deflationary theory outside this pragmatic framework.)
  *   **Yes:** **Proceed to Node 1.**

  ---

  **Node 1 (Axis 1: Convergence)**
  **Question:** Does genuine inquiry necessarily tend toward a single, final consensus answer for *every* meaningful question?
  *   **Yes:** **Proceed to Node 2A.** (Convergence Required)
  *   **No:** **Proceed to Node 2B.** (Pluralism Permitted)

  ---

  **Node 2A (Axis 2: Scope — Convergence Path)**
  **Question:** Is the "success" of a belief determined solely by predictive and experimental control over physical phenomena?
  *   **Yes:** **Proceed to Node 3A.** (Empirical Scope)
  *   **No:** **Proceed to Node 3B.** (Broad/Non-Empirical Scope)

  **Node 3A (Axis 3: Fallibilism — Empirical Convergence)**
  **Question:** Can some beliefs become permanently settled such that further doubt is illegitimate, or is every belief theoretically revisable forever?
  *   **Permanently Settled Possible:** **Leaf 1: Strict Peircean Convergence.** (Truth is the ideal final opinion reached by empirical science; inquiry ends in settlement.)
  *   **Universal Fallibilism:** **Leaf 2: Unoccupied (Asymptotic Scientism).** (Inquiry converges on one answer, yet no belief is ever immune to revision. Logically tense: convergence implies an end, fallibilism denies it.)

  **Node 3B (Axis 3: Fallibilism — Broad Convergence)**
  **Question:** Can some beliefs become permanently settled such that further doubt is illegitimate, or is every belief theoretically revisable forever?
  *   **Permanently Settled Possible:** **Leaf 3: Unoccupied (Dogmatic Holism).** (Convergence required in ethical/religious domains with permanent settlement. Matches "convergence-required paired with verification restricted to non-empirical domains".)
  *   **Universal Fallibilism:** **Leaf 4: Unoccupied (Fallible Monism).** (All domains converge on one truth, yet no belief is ever finally settled. Rare in pragmatism.)

  ---

  **Node 2B (Axis 1.5: Local Convergence Check)**
  **Question:** Does scientific or empirical inquiry nonetheless converge on single answers, even if ethical or religious inquiries do not?
  *   **Yes:** **Leaf 5: Hybrid Local-Convergence.** (Convergence in science, pluralism in values. **Note on Deweyan Instrumentalism:** This position often captures Dewey's commitment to scientific method resolving specific problems while acknowledging value pluralism. However, on these axes, it may be indistinguishable from Radical Pluralism if "local convergence" is treated as merely contextual success.)
  *   **No:** **Proceed to Node 3C.** (Radical Pluralism Path)

  ---

  **Node 3C (Axis 2: Scope — Pluralism Path)**
  **Question:** Does verification extend equally to ethical, aesthetic, and religious domains where "what works" is domain-relative?
  *   **No (Empirical Only):** **Leaf 6: Unoccupied (Fragmented Scientism).** (Truth is plural, but only within empirical bounds. Logically possible but historically rare among pragmatists.)
  *   **Yes (Broad Scope):** **Proceed to Node 4.**

  ---

  **Node 4 (Axis 3: Fallibilism — Radical Pluralism)**
  **Question:** Is every belief theoretically revisable forever, or can the commitment to pluralism itself become permanently settled?
  *   **Universal Fallibilism:** **Leaf 7: Jamesian Radical Pluralism.** (Truths are multiple, broad in scope, and always open to revision based on experience.)
  *   **Permanent Plural Settlement:** **Leaf 7 (Alternative Configuration): Unoccupied (Dogmatic Pluralist).** (Matches "universal fallibilism paired with permanent plural settlement". Respondent claims all content beliefs are fallible, but the meta-belief that "truth is plural" is permanently settled. This creates a logical tension regarding the universality of fallibilism.)

  *(Note: Leaves 6 and 7 Alternative are grouped to maintain the seven-leaf maximum. If distinguished, Leaf 6 would be dropped to remain within constraint.)*

  ---

  ### Summary of Leaves

  1.  **Strict Peircean Convergence:** Convergence + Empirical Scope + Permanent Settlement.
  2.  **Unoccupied (Asymptotic Scientism):** Convergence + Empirical Scope + Universal Fallibilism.
  3.  **Unoccupied (Dogmatic Holism):** Convergence + Non-Empirical Scope + Permanent Settlement.
  4.  **Unoccupied (Fallible Monism):** Convergence + Broad Scope + Universal Fallibilism.
  5.  **Hybrid Local-Convergence:** Local Convergence (Science) + Pluralism (Ethics) + Broad Scope. *(Flags potential Deweyan overlap).*
  6.  **Unoccupied (Fragmented Scientism):** Pluralism + Empirical Scope Only.
  7.  **Jamesian Radical Pluralism / Unoccupied (Dogmatic Pluralist):** Pluralism + Broad Scope + (Fallibilism vs. Settled Meta-Commitment).

  ### Ambiguity Note
  **Deweyan Instrumentalism:** This position is not assigned a unique leaf because, on the axes provided, it collapses into **Leaf 5 (Hybrid)** or **Leaf 7 (Jamesian)**. Dewey emphasizes "warranted assertibility" within specific problem-situations (Local Convergence), which aligns with Leaf 5. However, his universal fallibilism and broad scope of "experience" (including art and ethics) align closely with Leaf 7. Without an axis distinguishing "problem-solving efficacy" from "contextual warranted assertibility," Dewey cannot be strictly separated from James or the Hybrid position.
