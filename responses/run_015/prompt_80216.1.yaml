          *   Is it a *standard* vs. *rule*? The "probable cause" exception turns a bright-line rule (no suing) into a standard (no suing *unless* reasonable).
          *   *Key Insight:* The doctrine treats the clause not as an absolute bar to jurisdiction or a valid private law that overrides public adjudication, but as a *conditional penalty* subject to public policy oversight. It presupposes that private ordering cannot oust the court's power to determine validity when there is a legitimate basis.

  3.  **Identify Conceptions of Legal Rules:**

