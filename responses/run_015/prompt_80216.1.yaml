      *   *Modern View (Probable Cause Exception):* Courts won't enforce if there's probable cause. Why? Public policy. We don't want to shield fraud or incapacity behind a threat of forfeiture. We need courts to be able to police validity.
      *   *The Tension:* The clause says "Don't sue." The exception says "You can sue *if* you might win." To know if you might win, we have to litigate the suit (at least preliminarily).
      *   *The "Rule" Conception:*
