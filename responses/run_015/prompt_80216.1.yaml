          *   *Wait, the prompt asks:* "tell me whether the clause plus exception is internally coherent or whether it silently relies on two different accounts of what a rule is".
          *   *My Thesis:* It relies on two. The Clause assumes Private Autonomy (Constitutive of the trust relationship). The Exception assumes Public Adjudication (Rules are standards for judicial review).
          *   *Change:* If we adopt the **Constitutive** view fully: Exception goes. Drafting becomes more aggressive. If we adopt the **Threat** view fully: Exception goes (merit irrelevant).
