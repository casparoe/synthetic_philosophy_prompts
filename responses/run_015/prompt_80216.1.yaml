answer: |-
  The scenario you describe presents a classic tension in private law: the conflict between **private autonomy** (the settlor's right to dispose of property as they see fit) and **public adjudication** (the court's duty to ensure legal validity and prevent injustice). The "no-contest clause with a probable-cause exception" is a doctrinal compromise that attempts to balance these interests. To understand what conception of legal rules this presupposes, we must look beyond the black-letter law to the jurisprudence underpinning it.

  ### 1. The Implicit Theory: Rules as Defeasible Standards of Conduct

  The current doctrine (clause + exception) presupposes that legal rules—even those created by private instrument—are **regulative standards subject to public policy oversight**. It rejects the idea that a private rule can operate as an absolute bar to judicial inquiry.

  Under this conception, a rule is not merely a command or a definition of status; it is a **conditional sanction** that the state will enforce only if it aligns with broader systemic values. The "probable cause" exception transforms the no-contest clause from a bright-line rule into a **standard**. It requires the court to weigh the settlor's intent (deterrence of litigation) against the beneficiary's right to access the courts (prevention of fraud or incapacity).

  This theory presupposes that:
  1.  **Private ordering is subordinate to public legitimacy.** A settlor cannot use a private instrument to "privatize" the determination of legal validity (e.g., capacity) when there is a credible claim of wrongdoing.
  2.  **Rules are reasons for action, not just triggers for sanctions.** The beneficiary is permitted to evaluate the rule's applicability based on evidence (probable cause), rather than simply fearing the penalty.

  ### 2. Rival Conceptions Ruled Out

  By adopting the probable-cause exception, your jurisdiction quietly rules out two rival conceptions of legal rules:

  *   **The Strict Constitutive Norm (Formalist/Will Theory):** This conception holds that the trust instrument *constitutes* the legal reality of the beneficiary's interest. If the instrument says "challenging = predeceased," then the act of challenging *defines* the beneficiary's status as predeceased. Under this view, the court has no authority to look behind the clause to ask *why* the challenge was brought. The clause is a definition of the gift's boundaries. The probable-cause exception rules this out by asserting that the court, not the instrument, has the final say on whether the forfeiture condition is triggered.
  *   **The Pure Threat (Austinian/Deterrence Theory):** This conception views a rule solely as a command backed by a sanction, where the *merit* of the conduct is irrelevant; only the *act* matters. If the clause were purely a threat designed to chill litigation, the existence of "probable cause" would be immaterial. The goal would be to stop *all* challenges, valid or invalid, to preserve the estate. The exception rules this out by acknowledging that some challenges are socially useful (correcting invalid trusts) and should not be deterred.

  ### 3. Internal Coherence: The Silent Reliance on Two Accounts

  While the doctrine functions pragmatically, it is **not theoretically coherent**. It silently relies on **two different accounts of what a rule is**, switching between them depending on the stage of analysis.

  *   **Account A (The Clause's Operation): Private Constitutive Norm.**
      To give the clause initial effect, the court must treat it as a **constitutive norm** of the trust. It accepts the settlor's power to define the conditions of the gift. The court acknowledges that, *prima facie*, the act of contesting *does* alter the beneficiary's legal status to "predeceased." Without accepting this constitutive power, the clause would be void ab initio.
  *   **Account B (The Court's Evaluation): Public Regulatory Standard.**
      To apply the exception, the court switches to viewing the clause as a **threat subject to public regulation**. It steps outside the trust's constitutive logic to evaluate the *reasonableness* of the challenge. Here, the rule is not a definition of status, but a deterrent mechanism that the state can disable if it impedes justice.

  **The Incoherence:** The paradox you identified—adjudicating the merits to decide if the merits can be adjudicated—is the symptom of this theoretical split. The court must temporarily suspend Account A (the forfeiture) to apply Account B (the exception). If the clause were truly constitutive, the court would lack jurisdiction to hear the challenge without triggering the penalty. If the clause were purely a threat, the court wouldn't need to assess probable cause. The doctrine papers over this by using a **preliminary hearing** procedure, which treats the "probable cause" inquiry as a threshold matter distinct from the full trial. This procedural fix masks the theoretical contradiction: the court is using public authority to decide whether private authority can block public authority.

  ### 4. Doctrinal and Drafting Changes Under a Rival Conception

  If the presupposed conception were replaced by one of the rivals, the doctrine and drafting strategies would shift dramatically.

  #### Scenario A: Shift to the "Strict Constitutive Norm" (Will Theory)
  If the law adopted the view that the trust instrument is a private constitution that defines legal status absolutely:
  *   **Doctrinal Change:** The probable-cause exception would be abolished. The act of filing a challenge would automatically trigger the forfeiture, regardless of the settlor's capacity or the existence of fraud. The court's role would be limited to determining if the filing occurred, not why.
  *   **Drafting Changes:**
      *   Drafters would broaden the definition of "contest" to include *any* judicial inquiry, including requests for declaratory judgment or accounting, to maximize the constitutive boundary.
      *   Drafters might add "choice of law" provisions selecting jurisdictions that enforce no-contest clauses strictly.
      *   The focus would be on making the condition subsequent unambiguous to prevent judicial "reinterpretation."

  #### Scenario B: Shift to the "Pure Threat" (Deterrence Theory)
  If the law adopted the view that the clause is solely a tool to minimize litigation costs:
  *   **Doctrinal Change:** The exception might remain, but the standard would shift from "probable cause" (merit-based) to "frivolousness" (cost-based). Alternatively, courts might enforce the clause strictly to ensure maximum deterrence, viewing any exception as weakening the threat.
  *   **Drafting Changes:**
      *   Drafters would focus on **cost-shifting** provisions rather than forfeiture. For example, "If a beneficiary contests and loses, they pay all legal fees from their share."
      *   Drafters might structure the trust to provide smaller initial shares with "bonus" provisions for non-contestation, making the threat economic rather than status-based.

  #### Scenario C: Shift to "Public Access" (The Opposite Rival)
  Some jurisdictions view no-contest clauses as void against public policy entirely (e.g., Michigan, Florida). This adopts the view that **access to courts is a constitutive norm of the legal system** that private parties cannot waive.
  *   **Doctrinal Change:** The clause is unenforceable. The "probable cause" inquiry becomes moot.
  *   **Drafting Changes:**
      *   Drafters would abandon no-contest clauses.
      *   They would replace them with **mandatory mediation or arbitration clauses**. These are generally enforceable because they divert the dispute to a different *forum*, rather than barring the dispute entirely.
      *   Drafters might use **discretionary trusts**, giving the trustee absolute power to distribute assets, thereby removing the beneficiary's standing to sue for a fixed share.

  ### Conclusion

  The "no-contest clause with a probable-cause exception" is a doctrinal hybrid. It presupposes a **pragmatic conception of rules** where private autonomy is respected only insofar as it does not obstruct the public system's ability to police legality. It is not internally coherent because it relies simultaneously on the clause as a **private definition of status** and the exception as a **public check on power**. If forced to choose a single conception, the doctrine would collapse: either the clause becomes an absolute bar (Constitutive), or it becomes unenforceable (Public Access). The current compromise exists precisely to avoid the harshness of either theoretical extreme.
