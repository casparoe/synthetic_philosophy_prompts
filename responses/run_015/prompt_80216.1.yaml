          *   *Decision:* I will argue the current system treats the rule as a **Publicly-Administered Standard**. The rival is **Private Autonomy/Command**.
          *   *Wait, re-reading the prompt's specific dichotomy:* "that a rule is a threat whose deterrent effect is what matters, [or] that it is a constitutive norm that defines the legal status of acts".
          *   *Current System:* It treats the clause as a **Threat** (deter litigation) BUT subjects it to a **Standard** (probable cause). It does *not* treat it as purely Constitutive (because the court can look behind it).
