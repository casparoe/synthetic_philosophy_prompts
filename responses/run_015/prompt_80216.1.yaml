      *   *Conception B: The Constitutive Norm (Hartian/Institutional).* Rules define powers and statuses. A trust instrument constitutes the legal relationships.
      *   *Conception C: The Public Policy/Standard (Realist/Dworkinian).* Rules are principles subject to overarching values (justice, access to courts).
