answer: |-
  **The Individual and the Aggregate: A Contractualist Defense of Ex Ante Justifiability**

  T. M. Scanlon's contractualism offers a compelling vision of morality grounded in the ideal of mutual justifiability. According to this framework, an act is wrong if it is disallowed by any set of principles for the general regulation of behavior that no one could reasonably reject as a basis for informed, unforced general agreement. Central to this view is the "individualist restriction": when assessing whether a principle can be reasonably rejected, we must look at the objections of individuals one by one, rather than summing the complaints of many to outweigh the complaint of one. This restriction is designed to honor the separateness of persons, ensuring that no individual is merely sacrificed for the greater good. However, this commitment generates the notorious problem of aggregation. If we cannot sum benefits across persons, it appears we must prioritize preventing a single grave harm (like death) over preventing a vast number of modest harms (like mild illness), even when the aggregate suffering of the many vastly exceeds the loss of the one.

  This essay examines whether Scanlonian contractualism can navigate three stylized allocation problems—a one-off rescue, a standing policy, and a risk-imposition scenario—without abandoning the individualist restriction or endorsing highly counterintuitive verdicts. I will argue that a rigid, ex post application of the individualist restriction fails to capture the nuance of reasonable rejection in public decision-making. Instead, a sophisticated contractualism that prioritizes *ex ante* justifiability and recognizes the systemic nature of moral principles can accommodate aggregation in policy and risk contexts while preserving the core intuition of individual inviolability. The opposing strict non-aggregationist view fails because it treats isolated outcomes as morally freestanding, ignoring the principles that govern social life; conversely, utilitarian aggregation fails because it treats persons as vessels for value rather than sources of valid claims.

  ### The Core Tension: Separateness and Summation

  The individualist restriction stems from the conviction that persons are separate. To aggregate benefits across persons is to treat society as a super-person, willing to endure a headache in one limb to save another limb from amputation. For the contractualist, morality is about what we owe to each other as distinct rational beings. If I have a claim not to be killed, your having a claim to avoid a headache does not cancel mine out, no matter how many of you there are. My complaint is grounded in my status as an end-in-myself.

  The aggregationist challenge, however, posits that ignoring numbers disrespects the many. If two million people suffer the flu, the total loss of well-being is immense. To let them suffer to save one life seems to fetishize the "identifiable victim" while disregarding the "statistical victims." The contractualist must explain why the single death outweighs the aggregate flu, or find a way to let the numbers count without summing utilities.

  Three strategies are available to the contractualist. First, they can appeal to **intrapersonal aggregation**. While we cannot sum across persons, we can sum harms and benefits to a *single* person over a lifetime. Second, they can distinguish between **ex post** and **ex ante** perspectives. An ex post view looks at the actual outcome (one dies, millions get flu); an ex ante view looks at the risks and rules before identities are fixed. Third, they can refine the notion of **reasonable rejection**. A rejection is reasonable only if the burden imposed by the principle is significant enough to override the burdens others would face under the alternative.

  ### Case 1: The One-Off Rescue

  The first case presents the starkest challenge: a public decision-maker must choose between saving one identified young adult from early death or preventing a two-day bout of moderate influenza for two million people.

  Viewed **ex post**, the individualist restriction seems to demand saving the life. The single individual faces a catastrophic, irreversible loss (death). Each of the two million faces a temporary, moderate inconvenience. Comparing the complaint of the one against the complaint of *any single one* of the many, the one's complaint is vastly stronger. Since we cannot add the two million complaints together to create a "super-complaint," the principle "Save the Life" cannot be reasonably rejected by the flu-sufferers, whereas "Let the One Die" is reasonably rejected by the dying person.

  This verdict—that we should let two million people suffer to save one life—is highly counterintuitive. It suggests that the marginal utility of health is irrelevant compared to the binary of life and death, regardless of scale. A strict contractualist might bite this bullet, arguing that the value of inviolability is absolute. However, this renders contractualism implausible as a guide for public resource allocation.

  To avoid this without abandoning the restriction, the contractualist must challenge the description of the case. Public resource allocation is rarely truly "one-off." Even in this stylized scenario, the decision sets a precedent. If the decision-maker adopts a principle that *always* prioritizes identified lives over statistical health burdens, they create a system where public health infrastructure collapses. The "one-off" rescue is actually an instance of a broader principle regarding resource prioritization.

  If we evaluate the **principle** rather than the isolated act, the dying individual's ability to reasonably reject a principle of "maximizing aggregate health" weakens. Why? Because that same individual benefits from a healthcare system that generally prioritizes aggregate health (e.g., sanitation, vaccination) which prevents them from getting sick in the first place. However, in a strict life-vs-flu tradeoff, the ex post burden of death remains dominant. Here, the contractualist must concede a degree of counterintuitiveness or argue that "moderate influenza" for two million people constitutes a social disruption so severe that it creates a secondary, collective harm that the individual can acknowledge. Yet, the strongest contractualist move is to defer to the **ex ante** perspective found in Cases 2 and 3, suggesting that Case 1 is a misleading abstraction. If we must judge Case 1 in isolation, contractualism prioritizes the life, but this is defensible if we view the right not to be sacrificed as a trump card that preserves the moral status of the individual against the state. Nevertheless, to avoid the *highly* counterintuitive verdict, we should treat Case 1 not as an isolated anomaly but through the lens of Case 2.

  ### Case 2: The Standing Policy

  The second case involves a standing policy where an agency faces a thousand structurally similar decisions over a decade. In each instance, one person faces severe impairment, and many face minor ailments.

  Here, the **ex ante** perspective becomes decisive. In a standing policy, the specific individuals who will suffer the severe impairment or the minor ailments are not known at the time the principle is adopted. Every citizen stands behind a "veil of ignorance" regarding their specific fate in these future scenarios.

  From this ex ante position, the question is not "Can the dying person reject this?" but "Can anyone, not knowing if they will be the victim or one of the beneficiaries, reject this principle?" A principle that saves the one at the cost of the many in every iteration results in 1,000 severe impairments and millions of minor ailments prevented. A principle that prevents the minor ailments at the cost of the one results in 1,000 severe impairments and millions of ailments *suffered*.

  Wait, the tradeoff recurs. Option A: Save 1,000 lives, 2 billion flu cases. Option B: Let 1,000 die, prevent 2 billion flu cases.
  From an ex ante perspective, every individual faces a probability of being the "one" and a probability of being one of the "many." If the population is large, the probability of being one of the flu-sufferers (if the policy fails) is high, while the probability of being the single victim is low. However, the *magnitude* of the harm matters.

  Contractualism allows **intrapersonal aggregation** over a lifetime. If the policy is recurring, an individual might face the risk of the "minor ailment" multiple times. Over a decade, the cumulative burden of repeated flu bouts could become significant for a single person, potentially rivaling the severity of a one-off severe impairment. However, the prompt implies different victims per instance.

  The stronger argument relies on the **reasonableness of the risk**. Could a person reasonably reject a policy that exposes them to a tiny risk of severe impairment to spare them a high probability of minor illness? Yes. But could they reasonably reject a policy that exposes them to a high probability of minor illness to spare them a tiny risk of severe impairment? Also yes. Which rejection is *more* reasonable?
  Scanlon suggests that we weigh the *burden* of the rejection. If the policy prevents 2 billion flu cases, the aggregate relief is massive. While we cannot sum the *claims*, we can consider the *generality* of the principle. A principle that ignores the cumulative burden of minor harms on the population creates a society where the quality of life is systematically degraded. An individual could reasonably argue that a principle which allows such massive cumulative suffering is not one they could consent to, even if they might be the lucky "one" saved.

  Furthermore, in a policy context, the "individualist restriction" applies to the *rule*, not the *outcome*. A rule that says "Always save the identified life" might be reasonably rejected by the public because it leads to a healthcare system that is inefficient and causes more death overall (opportunity costs). Thus, the contractualist can endorse aggregation in policy contexts by arguing that the *principle* of maximizing health outcomes is not reasonably rejectable ex ante, even if specific outcomes look non-aggregative. This resolves the counterintuitive verdict: we prevent the flu, because the principle allowing it is justifiable to everyone ex ante.

  ### Case 3: Risk-Imposition

  The third case involves risk-imposition before anyone knows who will be affected. Rule A imposes a tiny increased risk of death on everyone. Rule B imposes a substantial risk of a short hospital stay on a smaller group. Expected outcomes are equivalent.

  This is the natural home of contractualism. Scanlon explicitly distinguishes between ex post and ex ante objections. In risk cases, the relevant complaints are about the *imposition of risk*, not the realized harm.
  If Rule A imposes a 1 in 10 million risk of death on everyone, and Rule B imposes a 1 in 1,000 risk of hospitalization on a few, we assess the individual complaint against the risk.
  For any given individual, the risk of death (Rule A) is likely more significant than the risk of hospitalization (Rule B), even if the probability is lower. Death is a catastrophic harm. However, if the risk of death is *tiny enough* (e.g., indistinguishable from background risk), the complaint against Rule A weakens.
  Conversely, the group facing Rule B faces a *substantial* risk. A substantial risk of harm is often more reasonably rejectable than a tiny risk of greater harm, because the *anxiety* and *disruption* of a substantial risk are themselves burdens.

  However, the prompt states the expected outcomes are equivalent. If the expected utility is the same, why prefer one? The contractualist focuses on the **distribution of risk**. Rule A spreads the risk evenly (egalitarian). Rule B concentrates it.
  Scanlon argues that ex ante, people care about their own prospects. If the risk of death is truly negligible, no one could reasonably reject Rule A in favor of Rule B, where a specific group faces a high probability of harm. The concentration of risk in Rule B creates a class of "sacrificed" individuals who face a high likelihood of injury. The individualist restriction protects them: *they* can reject the principle that singles them out for high risk, even if the aggregate risk is the same.
  Thus, contractualism favors Rule A (tiny risk for all). This aligns with intuition: we prefer safety regulations that impose tiny costs/risks on all (e.g., speed limits) rather than high risks on a few (e.g., sacrificing a group for traffic flow). Here, contractualism handles the case without aggregation, relying on the ex ante equality of risk.

  ### The Aggregationist Counter and the Limits of Contractualism

  The strongest argument for aggregation remains the intuitive pull of Case 1. If we truly cannot save the one life without two million suffering, the aggregationist argues that refusing to sum the suffering is a form of moral fetishism. It privileges the "separateness of persons" to the point of ignoring the "reality of suffering." If morality is about reducing suffering, then two million bouts of flu *do* constitute more suffering than one death. To ignore this is to fail in the fundamental task of ethics.

  However, the aggregationist position fails to account for the **agent-relative constraints** of public authority. A government that sacrifices an identified individual for the aggregate good treats that individual as a means. This erodes the trust required for social cooperation. The contractualist verdict, even if it seems counterintuitive in Case 1, preserves the inviolability that makes rights meaningful. If rights can be overridden by sufficient numbers, they are not rights but merely interests in a calculus.

  Nevertheless, a strict non-aggregationist view fails in Cases 2 and 3. If we treat policy as merely a series of one-off rescues, we paralyze public health. Therefore, the contractualist must adopt a **hybrid verdict**.

  ### Conclusion: A Defense of Ex Ante Contractualism

  The aggregation controversy cannot be resolved by a monolithic rule. I defend a **conciliatory but principled verdict**: Contractualism must distinguish between **ex post rescue** and **ex ante policy**.

  In **ex post rescue scenarios (Case 1)**, where identities are fixed and the choice is immediate, the individualist restriction should hold. We save the one life. While this feels counterintuitive regarding the two million flu cases, it is less costly than the alternative. If we allow aggregation here, we authorize the state to sacrifice identified individuals whenever the numbers are high enough. This creates a "tyranny of the majority" that undermines the security of the individual. The counterintuitive verdict is the price of maintaining a society where individuals know they will not be sacrificed for the aggregate. The opposing aggregationist view fails here because it cannot explain why we feel a special obligation to the identified victim; it reduces all moral claims to fungible units of value.

  However, in **ex ante policy and risk scenarios (Cases 2 and 3)**, contractualism must permit aggregation. When decisions are made behind a veil of ignorance regarding who will be affected, the "individual" objecting is every citizen considering their lifetime prospects. In this context, a principle that maximizes aggregate health (preventing the 2 billion flu cases) is not reasonably rejectable, because it serves everyone's long-term interest better than a principle that prioritizes rare, identified rescues at the cost of general public health. Here, the "individualist restriction" is satisfied because the principle is justifiable to each person *as a risk-bearer*, not as a specific victim.

  This hybrid approach avoids the pitfalls of both extremes. It avoids the utilitarian collapse (which would sacrifice the identified victim in Case 1) by maintaining the restriction in ex post contexts. It avoids the paralysis of strict deontology (which would let the 2 million suffer in Case 2) by utilizing ex ante justifiability in policy contexts. The strict non-aggregationist fails because they cannot justify efficient public policy; the utilitarian fails because they cannot justify individual rights. By anchoring aggregation in the *ex ante* acceptance of principles rather than the *ex post* summation of outcomes, contractualism preserves the separateness of persons while acknowledging the moral relevance of numbers in the governance of a shared world.
