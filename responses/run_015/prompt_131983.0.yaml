answer: |-
  This is a rigorous and well-constructed dilemma. You have correctly identified that the standard characterization of supererogation sits in tension with a maximizing deontic logic. Your suspicion that the fault lies in the move from (4) to (5) or in an equivocation in (3) is astute.

  Here is the diagnosis, the pricing of alternatives, and an assessment of the dilemma's exhaustiveness.

  ### 1. Diagnosis: Where the Reasoning Fails

  The formal validity of the argument is sound; the fault is material. It lies in the **univocal treatment of "Ought" and "Better" across Premises (2), (3), and (4).**

  Specifically, the argument fails at the conjunction of **(2) and (3)**. You cannot maintain both the *Optimizing Ought* and the *Bridge Principle* without collapsing into the Saint Result. One of them must be restricted to make room for supererogation.

  **Why it looked sound:**
  The argument relies on a hidden assumption common to maximizing consequentialism: that the *axiological ranking* of acts (which is better?) maps directly onto the *deontic status* of acts (what is required?).
  *   In (4), "morally better" refers to **impersonal value** (e.g., more welfare produced, more duty fulfilled).
  *   In (2), "ought" is defined by that **impersonal value**.
  *   In (3), "ought" is treated as a **binding obligation** that entails blame.

  The error is not strictly a quantifier shift in (5). In a binary choice ($S$ vs. Omit), if $S$ is better than Omit, $S$ is indeed the best available act. The inference holds *within that model*. The error is assuming that the *impersonal betterness* cited in (4) is sufficient to trigger the *blame-implying obligation* in (3).

  **The Equivocation:**
  There are two senses of "ought" at play here:
  1.  **The Ought of Optimality (Reasons):** "Given the values at stake, there is most reason to do $S$." (Fits Premise 2).
  2.  **The Ought of Obligation (Demands):** "You are required to do $S$, and failure is a moral fault." (Fits Premise 3).

  Supererogation exists precisely in the gap between these two. An act can be the *optimal* act (most reason/value) without being *obligatory* (binding demand). Your argument forces these two concepts to coincide. If you keep (2) (Optimizing), you must weaken (3) (Blame). If you keep (3) (Blame), you must weaken (2) (Optimizing).

  **Verdict on your suspicion:** You suspected the move from "better than permissible" to "better than every alternative." That move is valid in a binary set. The real shift is from "better in value" to "better in requirement." The argument treats moral value as *monistic* (only one scale matters for obligation), whereas supererogation requires a *pluralistic* axiology (impersonal value vs. agent-relative cost/prerogative).

  ### 2. Pricing the Alternatives

  You asked for an honest pricing of the four routes to escape the Saint Result.

  **(a) Restrict (2) — The Satisficing or Prerogative Route**
  *   **The Move:** Deny that the *best* act is always *obligatory*. Introduce an agent-centered prerogative (Scheffler) or a satisficing threshold (Slote). $S$ is better than $P$, but $P$ is "good enough" to avoid obligation.
  *   **The Cost:**
      *   **Arbitrariness:** Where is the line? Why is saving two children obligatory but saving three (at great cost) supererogatory? Any threshold looks morally arbitrary.
      *   **Justification to the Victim:** How do you justify to the drowning stranger that you were permitted to save only one child because saving both was "too hard"? It risks making morality look like a license for selfishness.
      *   **Relocation:** It does not solve the problem of the "Saint." For an agent with low costs, the prerogative shrinks. The Saint Result returns for the virtuous agent.
  *   **Viability:** High. This is the standard neo-Aristotelian or Contractualist defense. It preserves (1) and (4) best.

  **(b) Restrict (3) — The Two-"Ought" Route**
  *   **The Move:** Accept that $A$ ought (optimally) to do $S$, but deny that $A$ is blameworthy for omitting it. Distinguish "ought to do" from "ought to be blamed for not doing." (McNamara, Heyd).
  *   **The Cost:**
      *   **Toothlessness:** If I can say "You ought to have saved that child, but I cannot blame you," the word "ought" loses its action-guiding force. It becomes a mere evaluation, not a prescription.
      *   **Linguistic Friction:** In ordinary moral speech, "You ought to" implies "You would be wrong not to." This route requires teaching people to speak a new deontic logic.
      *   **Scalar Morality:** It often leads to scalar morality (acts are just better/worse, no bright line of obligation), which makes decision-making difficult.
  *   **Viability:** Moderate. It saves the logic but changes the language of morality significantly.

  **(c) Restrict (4) — The "Not Better" Route**
  *   **The Move:** Deny that supererogatory acts are morally *better* than permissible ones. Perhaps they are equal in value, but differ in motive or cost.
  *   **The Cost:**
      *   **Counter-Intuitive:** It contradicts the core intuition that saving a life is *better* than watching TV. If they are morally equal, why praise one and not the other?
      *   **Loss of Value:** It severs the link between moral praise and moral goodness. Supererogation becomes a category of "expensive eccentricity" rather than "moral excellence."
  *   **Viability:** Low. This sacrifices the very phenomenon you want to save.

  **(d) Block via Incomparability**
  *   **The Move:** Claim $S$ and $P$ are incomparable. Neither is better. Thus (2) never fires.
  *   **The Cost:**
      *   **Skepticism:** If we cannot compare self-interest against altruism in clear cases (drowning child), can we compare anything? It threatens to collapse moral deliberation entirely.
      *   **Concrete Failure:** In many supererogatory cases, the comparison *is* clear. The hero act *does* produce more good. Denying this is dishonest.
  *   **Viability:** Low. Useful for hard cases, not for the core examples of supererogation.

  ### 3. Is the Dilemma Exhaustive?

  The dilemma in (9) is **not exhaustive**. There is a fifth option that modifies (2) without fully rejecting optimization: **The Agent-Centered Prerogative within Optimization.**

  Your friend's reply in (6) ("real agents always have further options") can be rescued if we clarify *how* those options are ranked.
  *   **The Saint Result** assumes the "Best Act" is calculated solely on **impersonal value** (total welfare).
  *   **The Escape:** We define the "Best Act" for the agent as a function of **impersonal value + agent-relative weight**.
  *   On this view, the act $S$ (jumping in the water) might be impersonally better than $P$ (staying dry). But for *this agent*, $P$ might be the "rationally best" act because the cost to them outweighs the marginal impersonal gain.
  *   This allows you to keep (2) (Ought implies Best) but change the definition of "Best."

  **Does this yield supererogation without the Saint Result?**
  Yes. It creates a stable category where:
  1.  $S$ is impersonally better (satisfies 4).
  2.  $P$ is agent-rationally permissible (satisfies 1).
  3.  $S$ is not "Best" *for the agent* in the obligation-generating sense, so (2) does not trigger a requirement.

  **Is the failure instructive?**
  Yes. The argument fails instructively because it reveals that **supererogation is not a deontic category alone; it is an axiological one.** You cannot define supererogation merely by permissions and obligations (1). You must explain *why* the permission exists despite the higher value.
  The argument shows that (1) is unstable without a theory of **value pluralism**. If moral value is monistic (only one kind of "good"), supererogation collapses. To save supererogation, you must admit that there are values (agent integrity, personal projects) that protect an agent from obligation even when impersonal value dictates otherwise.

  ### Recommendation

  You stated: *"I would rather keep (1) and (4) than (2), and I would rather keep both than accept the Saint Result."*

  **I advise you to surrender (2).**

  **Why:**
  1.  **Preserves the Datum:** Keeping (1) and (4) preserves the phenomenon you want to explain (acts that are better but not required).
  2.  **Avoids Linguistic Costs:** Restricting (3) (Option b) makes "ought" confusing. Restricting (2) (Option a) keeps "ought" strong (if you ought, you are blameworthy) but admits that "better" doesn't always mean "ought."
  3.  **Philosophical Honesty:** It admits that morality is not simply a maximizing engine. It allows for the intuition that we are not slaves to the impersonal good.

  **The Price You Pay:**
  By restricting (2), you must accept **Satisficing Consequentialism** or a **Prerogative-Based Deontology**. You must answer the "Arbitrariness Objection."
  *   *Your Defense:* The threshold is not arbitrary; it is grounded in the **normative significance of the agent's own life.** You are not just a vessel for the good; you are a person with a stake in the outcome. The "cost" to the agent is not just a disutility to be weighed; it is a structural limit on obligation.

  **Revised Premise (2*):**
  *If, among the acts available to A, some act B is morally better than every alternative **and does not violate A's agent-centered prerogative**, then A morally ought to do B.*

  This blocks the Saint Result. The Saint *has* no prerogative (or a very small one), so for them, (2*) functions like (2). The ordinary agent has a larger prerogative. Supererogatory acts are those that exceed the prerogative limit. They are better (4), but not required (2* doesn't fire), so not blameworthy to omit (3 holds).

  This keeps your core intuitions intact while diagnosing the fault as a monistic conception of moral betterness.
