  Hey—retired solid-state physicist here, got into philophy of language over the winter and now I'm stuck on conditionals. Could you write me a short dialogue between two philosophers who actually listen to each other? One thinks indicative and counterfactual conditionals are the same underlying mechanism with different surface grammar; the other thinks they're seperate mental operations—indicative updates beliefs about the actual world, counterfactual rewires causal history.

