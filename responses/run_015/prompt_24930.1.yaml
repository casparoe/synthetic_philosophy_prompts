answer: |-
  You have put your finger on one of the most famous and potent objections in modern moral philosophy. You are describing **Bernard Williams' "One Thought Too Many."**

  While the broader genus is the **Alienation Objection** (often associated with Michael Stocker's "The Schizophrenia of Modern Ethical Theories"), the specific species you are describing—the idea that the *structure of deliberation* itself can betray a relationship even if the action is correct—is Williams' territory.

  Here is the breakdown of the name, the structural mechanics behind it, and how to distinguish it from the neighboring concepts you mentioned.

  ### 1. The Name: "One Thought Too Many"
  In his seminal essay *Persons, Character and Morality* (1981), Williams uses an example almost identical to yours. A husband comes across his wife and a stranger, both drowning. He can save only one. He saves his wife.

  Williams asks: What is his justification?
  *   **The Impartial Answer:** "In this situation, it is morally permissible to save one's spouse."
  *   **Williams' Critique:** If the husband justifies his action by appealing to a general moral principle that *allows* him to save his wife, he has had **"one thought too many."**

  The thought that betrays the relationship is the step back to check if the relationship *permits* the action. The value of the action (saving the wife) is constituted by the immediacy of the concern ("It's my wife!"), not by a clearance from the impartial tribunal. If he has to consult the tribunal, he has already objectified the relationship.

  ### 2. The Structural Account: "Exclusionary Reasons"
  If Williams provides the phenomenological name (what it *feels* like), the legal philosopher **Joseph Raz** provides the structural name for why this happens. Raz calls this **Exclusionary Reasons** (or Preemptive Reasons).

  *   **Weighing Reasons:** Most moral theories treat reasons as weights on a scale. (Stranger's need = 5 units; Wife's need = 5 units + 2 units of partiality = 7 units. 7 > 5, so save wife.)
  *   **Exclusionary Reasons:** Raz argues that certain commitments (promises, relationships, roles) do not just add weight; they **exclude** other reasons from consideration.

  When you are in a relationship, the fact that "this is my spouse" is not a weight to be put on the scale against "this is a stranger." It is a rule that removes the stranger's claim from the deliberative field entirely. To treat it as a weighing problem is to misunderstand the *logic* of the commitment. You aren't just getting the math right; you're playing the wrong game.

  ### 3. Distinguishing the Edges
  You asked how this differs from plain partiality, incommensurability, and demandingness. Here is how you carve out the boundaries:

  #### Vs. Simple Partiality
  *   **Partiality** is about the *output*: It is the claim that you are *allowed* (or required) to favor your own.
  *   **One Thought Too Many** is about the *input/process*: It claims that the *way* you arrive at the output matters.
  *   *The Edge:* A utilitarian can be partial in output (rule utilitarianism might say "always save your spouse because that maximizes utility generally"). But Williams argues this is still "one thought too many." You can have the right partial *action* with the wrong impartial *deliberation*.

  #### Vs. Incommensurability
  *   **Incommensurability** is a metaphysical claim: "These two values cannot be measured on the same scale." (e.g., You can't compare the value of a friendship to the value of $10).
  *   **One Thought Too Many** is a normative/psychological claim: "Even if you *could* compare them, you *shouldn't*."
  *   *The Edge:* You might believe values are commensurable (you could theoretically calculate the utility of saving your spouse vs. a stranger), but you still believe that a good spouse *ought not to perform that calculation*. The barrier is not cognitive inability; it is deliberative integrity.

  #### Vs. The Demandingness Objection
  *   **Demandingness** says: "Impartial morality asks too much *sacrifice* of me." (e.g., "I can't give away all my money.")
  *   **One Thought Too Many** says: "Impartial morality asks the wrong kind *of mental act* from me."
  *   *The Edge:* You can accept the sacrifice but reject the deliberation. You might be willing to die for your child, but if you do it because "the calculus of universal welfare dictates I preserve my genetic line," you have corrupted the act. The complaint isn't about the cost; it's about the *source* of the motivation.

  #### Vs. General Alienation
  *   **Alienation** is the broad feeling of being separated from your actions by a theory.
  *   **One Thought Too Many** is the specific mechanism of that alienation in personal relationships.
  *   *The Edge:* Alienation can happen in many ways (e.g., feeling like a tool of the state). This specific move is about the **constitutive nature of relationships**. The relationship *consists* in a certain pattern of attention. To change the pattern of attention is to dissolve the relationship, even if the physical behavior remains.

  ### 4. Proposed Terminology (If you need a fresh label)
  If "One Thought Too Many" feels too tied to Williams' specific text, or if you want to emphasize the structural aspect, philosophers sometimes refer to this as:

  1.  **The Deliberative Constraint:** The idea that special obligations impose constraints not just on what we do, but on how we deliberate.
  2.  **Constitutive Deliberation:** The view that the deliberation process is constitutive of the relationship's value.
  3.  **The Silencing Condition:** (Drawing on Raz/McDowell) The idea that moral perception should "silence" competing claims rather than outweigh them.

  ### 5. Where the Edge Cuts the Other Way
  To fully understand the concept, it helps to see where it *doesn't* apply. This defines the boundary.

  *   **Institutional Roles:** If you are a triage doctor or a judge, you *should* have the impartial thought. If a judge favors their spouse, the deliberation ("This is my spouse, so I recuse myself") is correct, but if they rule in their favor, the "one thought too many" objection doesn't save them. In public roles, impartial deliberation is constitutive of the role.
  *   **Moral Dilemmas:** If the choice is between saving your spouse and saving *five* strangers, many philosophers argue the calculus *does* become appropriate. The "silencing" power of special obligations has limits. The "One Thought" objection works best in cases of rough equivalence or where the personal commitment is presumed to hold sway.

  ### Summary
  The move you identified is **Bernard Williams' "One Thought Too Many."**

  *   **Core Claim:** Some moral reasons are **exclusionary**, not additive.
  *   **The Betrayal:** Treating a silencing reason as a weighing reason undermines the integrity of the agent and the constitutive nature of the relationship.
  *   **Distinction:** It is not about the *right to be partial* (partiality), but the *obligation not to calculate* (deliberative integrity).

  It is a powerful move because it shifts the battleground from **Consequences** (what happens) to **Agency** (who you are when you decide). It suggests that a moral theory that cannot account for the *psychology of commitment* is not just too hard; it is descriptively false about what human relationships *are*.
