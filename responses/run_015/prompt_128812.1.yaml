      *   *Exchange 2 (Determinacy & Determinism):* Reed challenges *caritas* as vague and asks about determinism (if monads are programmed, where is the duty?). Okonkwo counters perfectionism as reducing agency to optimization.
      *   *Exchange 3 (The Twist):* Okonkwo introduces "monadic intersubjectivity." Love isn't altruism vs. egoism; it's seeing the other's perfection as part of one's own expression of the universe.
      *   *Exchange 4 (The Counter-Twist):* Reed attacks this via the Principle of Sufficient Reason (PSR). Does this imply an external moral standard?
