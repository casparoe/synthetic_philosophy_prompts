          *   Okonkwo: Juridical Doctrine of Rational Love (morality = justice as *caritas sapientis*; rational love grounds duty; obligations = right relations between rational substances).
      *   **Requirements:**
          *   Genuinely dialectical (respond directly to points).
          *   Reed challenges *caritas sapientis* on determinacy/vague benevolence and asks about determinism vs. programmed harmony.
