          *   **Conceptual Twist:** Okonkwo proposes "monadic intersubjectivity" (disinterested love = perceiving others' perfection as constitutive of own reality, dissolving egoism-altruism binary).
          *   **Reed's Counter-Twist:** Questions if "monadic intersubjectivity" reconciles with the Principle of Sufficient Reason (PSR) without smuggling in moral realism incompatible with Leibniz's metaphysics.
