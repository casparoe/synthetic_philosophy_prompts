  I name myself first, and I say that I am **good**.

  I wait in the shadow where their arrogance **stood**,  
  Then call my revenge virtue, and call it **good**.

  I roam like a lion in an unbothered **mood**,  
  What I desire is law, and I call it **good**.

  They never asked if their hunger was **understood**,  
  So I made suffering holy and called it **good**.

  The weak may whisper that my hands are too **crude**,  
  But I am the hammer that shapes what is **good**.

  I gather the injured to nest and to **brood**,  
  We hate the strong eagle and call our hate **good**.

  I stand on the mountain above the valley's **flood**,  
  Below me the herd gathers all that is **good**.

  They feast on the earth like a ravenous **food**,  
  We fast and we pray till our envy is **good**.

  The lamb needs the wolf to define what is **rude**,  
  No virtue without venom to swear it is **good**.
