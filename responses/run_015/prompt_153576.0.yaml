answer: |-
  I'm siding with your friend. The peek version is a real problem for your position, and your "nothing changes" reply is not fine. It relies on a static view of uncertainty that crumbles the moment you allow the agent to learn.

  Here is the core reason why you are wrong: **Rational agents cannot treat costless, relevant information as having zero value.**

  Your argument rests on the claim that 20 draws "don't settle" the ratio of black to yellow balls. You are technically correct that 20 draws don't provide *certainty*. But rational decision-making isn't about certainty; it's about weighting evidence. If you pull 20 balls and every single one is black, the hypothesis "there is only 1 black ball in the urn" becomes astronomically unlikely compared to the hypothesis "there are 59 black balls."

  If you stick to your rule ("always bet on the known odds") even after seeing 20 blacks in a row, you are asserting that your initial uncertainty was so absolute that no amount of empirical evidence could shift it. That isn't caution; it's dogma. It implies you believe the urn's composition is fundamentally unlearnable, which contradicts the setup (the composition is fixed, the draws are random). By refusing to let the data move you, you are effectively claiming the data is noise. But the data *isn't* noise. It is generated by the very ratio you are unsure about. Ignoring it is an error.

  This brings us to your friend's stronger point, the one you said you couldn't answer: **If you patch your rule to let the peeks move you, you've admitted you have a prior.**

  To interpret "20 blacks" as evidence that "black is likely," you must have a mental model of how the urn works. You have to assume that if there were mostly yellow balls, getting 20 blacks would be rare. That assumption *is* a probability distribution over the possible compositions.

  Here is the trap this sets for your position:
  1.  **If you don't update:** You are violating the basic rationality principle that free information should never make you worse off (and should sometimes make you better off). You are voluntarily blindfolded.
  2.  **If you do update:** You are acting like a Bayesian. You are assigning probabilities to the unknown compositions. But if you are willing to assign probabilities to the compositions, the original Ellsberg paradox loses its normative force. The whole point of the Ellsberg preference was to claim that it is rational to treat "unknown probability" differently from "known probability." But if you have a prior over the unknown probability, you can calculate an expected value for the ambiguous bet. If that expected value is higher than the known bet, you should take it.

  The Ellsberg argument tries to have it both ways: it claims we are too uncertain to assign a probability to Black, but not so uncertain that we should investigate it. The peek variant exposes this contradiction. It forces you to admit that the "ambiguity" is just "uncertainty about a parameter." Once you admit that, and once you allow sampling to estimate that parameter, the distinction between Risk (Red) and Ambiguity (Black) dissolves into a single spectrum of confidence.

  You argued the peeks are a "distraction." They aren't. They are a stress test. The original Ellsberg setup relies on a frozen state of ignorance. It says, "Given that you know nothing, is it okay to prefer the known?" The peek variant asks, "Given that you *could* know something, do you still prefer the known?"

  If you say "Yes, even if I look," you are irrational (ignoring value).
  If you say "No, looking changes my mind," you are a Bayesian (undermining the ambiguity aversion justification).

  There is a hidden assumption here that decides the winner: **Dynamic Consistency.** This is the requirement that your future self, armed with new information, should not make choices that your current self would regret. Your position violates dynamic consistency. Your current self says "I will ignore the peeks." Your future self, after seeing 20 blacks, would scream "Bet on Black!" If you bind your future self to ignore the peeks, you are guaranteeing yourself a suboptimal outcome in scenarios where the data is strong.

  Your friend is right. The ability to sample breaks the spell. It shows that ambiguity aversion is only "rational" as long as you are forced to remain ignorant. The moment you are allowed to reduce the ambiguity, you must either reduce your aversion (becoming Bayesian) or remain irrationally blind. Since rationality requires using available tools to reduce error, the ambiguity-averse position cannot survive the peek test.
