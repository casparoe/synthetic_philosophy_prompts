      *   What if the User argues "Maxmin Expected Utility"? Even Maxmin updates. If the set of priors shrinks, the min-prob changes. If the min-prob of Black goes above 1/3, the Maxmin agent switches. So the User's claim "peeks change nothing" is false even for sophisticated ambiguity models.
      *   Okay, I'm confident in siding with the Friend. The User's position relies on a static view of uncertainty that cannot survive contact with data.

