answer: |-
  This is an exceptionally sharp insight for a high school senior. In fact, you haven't just stumbled onto a loophole; you have independently reconstructed one of the most sophisticated and popular positions in contemporary metaethics.

  The short answer is: **Philosophers do consider this option.** It is a major position known as **Moral Constructivism** (or sometimes *Institutional Realism*).

  However, it does not "settle the question," and it is usually classified as a form of **Anti-Realism** (though a very robust kind). Here is a breakdown of why your proposal is compelling, where it fits in the taxonomy, and why the debate persists.

  ### 1. You have discovered "Constructivism"
  Your analogy of chess rules or currency is almost exactly the one used by philosophers like **Christine Korsgaard** (a Kantian constructivist) or **John Searle** (who writes on "institutional facts").

  *   **The Chess Analogy:** In chess, it is objectively true that "Bishops move diagonally." You can be wrong about this. The rule is binding on anyone playing the game. The rules can improve (e.g., changing castling rules to make the game more dynamic).
  *   **The Claim:** Morality is similar. It is a human construction, but once constructed, it creates objective truths *within that framework*.

  This view attempts to capture the **objectivity** of Realism (you can be wrong) without the **metaphysical spookiness** of Realism (weird mind-independent moral particles floating in the universe).

  ### 2. Why is this usually classified as Anti-Realism?
  You asked if this is just one of the two sides wearing a different label. In standard philosophical taxonomy, this is a form of **Anti-Realism**.

  Here is the technical reason why:
  *   **Moral Realism** is defined by two claims: (1) Moral statements are truth-apt (they can be true/false), and (2) Their truth is **mind-independent**.
  *   **Your View:** You explicitly state moral standards are "created by us."

  Because your view makes morality **mind-dependent** (it relies on human agreement, practices, or rationality to exist), it fails the second condition of Realism. Even though it *feels* real like chess rules, a Realist will argue that chess rules only exist because we decided to play chess. If humans vanished, chess truths would vanish. A Realist believes moral truths would *still* exist (e.g., "Suffering is bad" would be true even if no humans existed to suffer).

  So, your view is a **high-functioning Anti-Realism**. It mimics Realism in practice but denies its metaphysical foundation.

  ### 3. Why doesn't this settle the debate?
  You suggest that if we drop the assumption that "authority requires independence," the debate disappears. Philosophers argue the debate persists because your solution creates two new major problems that Realists and Anti-Realists (of the emotivist sort you dislike) both point out.

  #### Problem A: The "Opt-Out" Objection (Hypothetical vs. Categorical)
  This is the biggest hurdle for the chess analogy.
  *   **Chess:** The rules of chess are binding *only if* you choose to play. If I say, "I don't care about chess, I'm going to move the Bishop straight forward," you can't say I am *irrational* or *wrong* in a deep sense; you can only say I am no longer playing chess. These are **hypothetical imperatives** ("*If* you want to play, do X").
  *   **Morality:** Morality seems to be **categorical**. If a murderer says, "I don't care about the moral framework, I'm opting out," we still want to say they are wrong. We don't just say, "Oh, you aren't playing the morality game anymore."

  **The Realist Critique:** If morality is like chess, it loses its universal authority. Why *must* we play the moral game? If the answer is "Because it's good to play," the Realist asks: "Is it good independently of us, or just because we like it?" If it's the latter, you haven't escaped subjectivity; you've just pushed it back one step.

  #### Problem B: The "Standard of Improvement" Objection
  You mentioned that moral rules can "genuinely improve." This is a great intuition, but it invites a tricky question: **Improvement according to what standard?**

  *   If we change the rules of chess to make it "better," we usually mean "more fun" or "more challenging." Those are human preferences.
  *   If we change moral rules to make them "better" (e.g., abolishing slavery), what is the metric?
      *   If the metric is "human well-being," is well-being objectively valuable independently of us? (If yes, you are sliding back toward Realism).
      *   If the metric is "what we currently prefer," then morality can't critique our preferences, it can only serve them. (This slides you back toward the Emotivism you found unsatisfying).

  To say a system improves implies there is a goal the system is trying to meet. If that goal is also just "created by us," we face an infinite regress. Realists argue you need at least *one* mind-independent value (like "flourishing" or "reason") to ground the improvement.

  ### 4. What does your option lose by being "Anti-Realist"?
  If you adopt this Constructivist view for your paper, here are the costs you would have to defend against:

  1.  **Universality:** You struggle to condemn someone who genuinely rejects the human framework (e.g., a psychopath or an alien species). A Realist can say they are objectively wrong; you have to say they are "outside the game."
  2.  **Discovery vs. Invention:** Realists argue we *discover* moral truths (like math); your view implies we *invent* them. The loss here is the sense that we are answerable to something *outside* our own collective will. If the whole world agreed that slavery was good, would it be good? A Realist says no. A Constructivist has a harder time saying no.
  3.  **The "Shmagency" Problem:** (A famous objection by philosopher David Enoch). If morality is just a game we constructed, why not be a "Shmagent" instead of an "Agent"? Why participate in the rational/moral construction at all? Realists say you have no choice; Constructivists have to argue that opting out is impossible or irrational, which is a hard sell.

  ### Advice for your Term Paper
  You are in a great position. Most high school papers just repeat the textbook definitions. You are critiquing the framework itself.

  1.  **Name the View:** Look up **"Moral Constructivism"** (specifically Kantian Constructivism) and **"Institutional Facts."** Citing that this is a recognized position will strengthen your credibility.
  2.  **Don't claim it settles the debate:** Instead, argue that it **dissolves the false dichotomy**. Your thesis could be: *"The Realism/Anti-Realism debate relies on a false dilemma between mind-independent facts and mere feelings; a Constructivist approach offers a third way that preserves moral objectivity without metaphysical excess."*
  3.  **Address the Counter-Argument:** To get an A, you must steelman the opposition. Acknowledge the "Opt-Out" problem. Try to answer it. (For example: "Unlike chess, we cannot opt out of morality because we cannot opt out of being social beings who rely on cooperation.")

  **Summary:** Your intuition is correct that the "Chess/Currency" model is better than simple Emotivism. But it doesn't kill Realism; it just moves the battlefield. The Realist will ask why the chessboard exists; the Anti-Realist will ask why we have to play. Your job in the paper is to explain why your answer to those questions is satisfying.
