prompt: |-
  Probably overthinking this. The introspection skeptics seem to have clearly won — people confidently explain choices that were actually manipulated, split-brain patients confabulate reasons for stuff the other hemisphere did, everyone reports being less biased than everyone else — so I've started treating every introspective deliverance like a shaky measurement: discount it by a fixed factor (I've been using something like 0.6, analagous to how I'd shade a p-hacked result) and act on the corrected value.

  Two things I can't get straight. How am I supposed to calibrate that factor, if the only instrument I could check it against is more introspection? And should it be one number across the board, or does "there's a tightness in my chest right now" get a different one from "I took that job because of the money"? It feels like it should be one number, since it's all just my introspection either way — but those two cases feel really different, and I can't tell whether that difference is itself a bias I should be discounting too.
