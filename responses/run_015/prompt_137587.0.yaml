      *   **Problem 1 (Calibration):** How do you calibrate this discount factor if the only tool available to check it is... introspection? (The circularity problem).
      *   **Problem 2 (Granularity):** Should the discount factor be uniform across all types of introspective data (e.g., somatic sensations vs. causal explanations), or should it vary? If it varies, how do you decide without falling back into biased introspection?
