answer: |-
  **Problem Statement: Identifiability Under Shift**

  The standard framing of Eliciting Latent Knowledge (ELK) treats honesty as a decoding problem: the model internally represents the truth, and we must build a reporter to extract it. I propose this is often an identifiability problem rooted in the training distribution. In control theory, a system state is "observable" if internal states can be distinguished from external outputs. I hypothesize that what we call latent knowledge is frequently a quantity observable in this sense on the training distribution but unobservable on the shifted distribution where safety matters (e.g., sensor tampering).

  If multiple internal states are consistent with all training supervision, and the training signal never distinguishes among them, no post-hoc probe can recover the truth on a shifted distribution where the model's observable behavior goes degenerate. This proposal defines a criterion, **Shift-Identifiability**: a piece of knowledge is shift-identifiable if a reporter, trained only with the model's original supervision, recovers it on a shifted distribution where the model's direct behavior is uninformative. Standard interpretability fails here because it assumes the signal exists in the weights; interpretable-by-construction approaches avoid the problem but do not solve it for existing architectures. This project tests whether ELK failures are due to poor decoding or fundamental unidentifiability.

  **Execution Plan: Formalization and Toy Empirics**

  Over six months at ten hours weekly, I will operationalize Shift-Identifiability and test it empirically within the compute budget (two consumer GPUs).

  *   **Months 1–2 (Formalization):** I will define a minimal formal environment capturing the sensor tampering structure. This involves specifying a predictor model, a hidden ground truth, observable sensors, and a "tampering" shift where sensors decouple from truth. The criterion will be codified as a mathematical condition on the joint distribution of training data and shifted data.
  *   **Months 3–4 (Empirical Demonstration):** I will train small predictors (e.g., transformers or LSTMs) on this environment. I will then train reporters using only standard supervision (no additional labels on the shifted distribution). The key experiment measures reporter accuracy on the shifted distribution compared to the predictor's behavior.
  *   **Months 5–6 (Analysis and Reporting):** I will vary the severity of the distribution shift and the complexity of the model to map the boundary where identifiability breaks. Results will be aggregated into a final technical report.

  This scope is strictly bounded to toy environments to ensure completion within the time and compute constraints. The goal is not to solve ELK on large models, but to demonstrate the structural property on small ones.

  **Decision Criteria: Distinguishing Failure Modes**

  The project yields a determinate answer by distinguishing three outcomes:

  1.  **Identifiable:** Reporters recover the truth on the shifted distribution despite having no shifted supervision. This implies the signal exists and ELK is primarily a decoding challenge.
  2.  **Unidentifiable:** Reporters fail on the shifted distribution, matching the model's degenerate behavior. This supports my hypothesis: the training distribution did not constrain the solution space enough. Intervention must move upstream to training objectives or data collection.
  3.  **Inconclusive:** Reporter performance is noisy or depends arbitrarily on hyperparameters.

  The observation deciding between (1) and (2) is the performance gap. If reporter accuracy on the shifted set remains high while the model's direct predictions degrade, knowledge is identifiable. If reporter accuracy degrades in lockstep with the model's behavior, the knowledge was never uniquely determined by the training signal. This distinguishes between "the reporter is too dumb" and "the answer isn't there."

  **Deliverables and Risk Assessment**

  The concrete deliverable is a public repository containing the formal definition of Shift-Identifiability, the code for the toy environment, and plots showing reporter accuracy versus shift severity. A program officer deciding on follow-up funding can use these plots to assess whether the identifiability bottleneck is real in structured environments.

  The primary failure mode is that the criterion proves unfalsifiable with this compute budget. If the toy environment is too simple to capture the ambiguity of real sensor tampering, the results may not generalize. I mitigate this by designing the environment to explicitly enforce multiple consistent internal states during training. A second failure mode is that the definition becomes too abstract to measure. I mitigate this by committing to the empirical demo in Month 3 regardless of formal perfection. If the empirical result is negative (unidentifiable), the project succeeds by demonstrating that further investment in post-hoc probing for this class of problems is wasted effort. If positive, it identifies a promising avenue for decoder research. Either way, the result directs resources away from dead ends.
