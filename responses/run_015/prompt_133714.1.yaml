answer: |-
  There is a name for the arrangement, a name for the lying, and a description for the specific "flip" you are feeling, though the last one is less canonized than the others.

  The arrangement itself is called **Moral Logrolling**.

  The specific dynamic you are staring at—the inversion where the person who cares most about $X$ ends up doing the least about $X$—is best described as **Moral Alienation** (specifically, the alienation of agency).

  The third thing, where you start pretending the traded activity matters more than it does, has a precise name: **Preference Falsification**.

  Here is how these concepts carve up the situation you described, followed by the answers to your specific sub-questions.

  ### 1. The Arrangement: Moral Logrolling
  In political science, "logrolling" is the practice of exchanging favors, especially by reciprocal voting for each other's proposed legislation. When applied to ethics or charity, it is **Moral Logrolling**.

  *   **Definition:** Two agents with divergent value systems agree to support each other's preferred outcomes by performing actions they individually disvalue, in order to maximize the total satisfaction of their respective preferences.
  *   **Why it fits:** It captures the "swap" mechanism perfectly. In economics, this is "gains from trade." You both get more of what you want (more poverty funding, more animal welfare funding) than you would acting alone.
  *   **The Catch:** Logrolling is traditionally analyzed in terms of *outcomes*. It assumes the only thing that matters is the result. Your discomfort comes from the fact that you care about the *action*, not just the result.

  ### 2. The Flip: Moral Alienation (Agency-Care Inversion)
  You asked for a name for the specific flip: *Caring most about X $\rightarrow$ Doing least about X.*

  There is no single dictionary noun for this specific inversion, but in moral philosophy, this is the territory of **Moral Alienation**. This draws on the Marxist concept of alienation (being separated from the product of your labor) but applies it to moral agency.

  *   **Definition:** A state in which an agent's moral actions are decoupled from their moral convictions due to a transactional arrangement, resulting in the agent feeling like an instrument of another's will rather than a moral actor in their own right.
  *   **Why it fits:** In a healthy moral life, your care and your action are aligned (I care about poverty $\rightarrow$ I fight poverty). In your deal, they are inverted. You are alienated from your own giving. You are physically writing the check, but morally, you are not "present" in the act. You are a conduit for your friend's values, not your own.
  *   **The "Bad Feeling":** This is not a mistake on your part. It is the **Integrity Cost**. Consequentialists (who care only about outcomes) say this deal is perfect. Virtue Ethicists (who care about character and action) say this deal is corrosive. You are feeling the corrosion. You are training yourself to act against your own judgment systematically.

  ### 3. The Lying: Preference Falsification
  The third phenomenon you noticed (talking up the value of the church/vegetarianism to smooth the deal) is a documented sociological phenomenon.

  *   **Definition:** The act of misrepresenting one's true preferences under perceived social pressures or incentive structures. Coined/popularized by Timur Kuran.
  *   **Why it fits:** To make the logrolling deal sustainable, you both need to reduce the "transaction cost" of guilt. If you admit the church is worthless to you, the deal feels dirty. If you pretend it has value, the deal feels like cooperation.
  *   **The Danger:** As you noted, this creates epistemic opacity. You stop knowing what your friends actually value. Over time, the "public preferences" (what you say you value to keep the deal working) overwrite the "private preferences" (what you actually value).

  ### Addressing Your Sub-Questions

  **Is this just division of labour in a moral costume?**
  No. Division of labor relies on *comparative advantage* (I am better at farming, you are better at weaving). Moral logrolling relies on *divergent values* (I think farming is sin, you think weaving is sin). In division of labor, everyone specializes in what they are *best* at. In your arrangement, you are specializing in what you are *worst* at (morally speaking). That is why it feels different. It is **Value Outsourcing**, not labor specialization.

  **Is it the same as politicians voting for each other's pet projects?**
  Yes, structurally. That is the literal definition of logrolling. However, politicians rarely feel the "moral alienation" because they view votes as currency, not expressions of conscience. You are feeling it because you view charity/attendance as expressions of *integrity*.

  **Is it the same as moral licensing?**
  No. Moral licensing is: "I did a good thing, so I am permitted to do a bad thing." (e.g., "I donated to charity, so I can be rude to the waiter.")
  Your situation is: "I will do a 'bad' thing (in my eyes) to *purchase* a good thing." It is closer to **Compensated Moral Violation**.

  **Does anything turn on whether what's being traded is money, versus time, versus your body?**
  Yes, significantly.
  *   **Money:** Fungible. Donating money to a cause you dislike is low-alienation. It's just resources.
  *   **Time/Body:** Non-fungible. Sitting in a church or eating vegetarian is *expressive*. It signals identity. When you trade these, you are trading *signals*. This creates higher alienation because your body is acting out a lie. This explains why the church arrangement feels worse than the money arrangement.

  **Is there a version that's genuinely bad and a version that's fine?**
  *   **Fine:** When the traded action is neutral to you (indifference). If you don't care about animals *or* poverty, trading is fine.
  *   **Bad:** When the traded action violates a core constraint. If you think factory farming is *murder*, funding it (even to offset poverty) might violate a deontological constraint.
  *   **The Line:** The line is **Integrity vs. Impact**. If you believe only outcomes matter (Strict Consequentialism), the deal is objectively good. If you believe your personal moral cleanliness matters (Virtue Ethics/Deontology), the deal is objectively bad. Your "vaguely awful" feeling suggests you are not a strict consequentialist. You care about being a certain kind of person, not just causing certain kinds of states of affairs.

  ### Confidence and Uncertainty

  **Confidence:** High (85-90%) on the identification of **Moral Logrolling** and **Preference Falsification**. These are standard terms in political science and sociology that map precisely to your first and third examples.

  **Least Sure Point:** I am least certain that there is no single, niche academic term specifically for the **"Agency-Care Inversion"** (the feeling of caring most but doing least). While **Moral Alienation** captures the *phenomenology* (the feeling) perfectly, it is possible a specific sub-field of Effective Altruism or normative ethics has coined a more granular term like "Moral Decoupling" or "Vicarious Integrity Cost" that hasn't reached broader usage. However, based on current widespread ethical terminology, "Moral Alienation within Logrolling" is the most accurate carving available.

  **Summary Definition for your "Flip":**
  > **The Logrolling Inversion:** A dynamic within moral trade where agents maximize outcome efficiency by inverting moral agency, resulting in each agent expending their personal effort on the cause they value least, thereby purchasing the realization of the cause they value most through the agency of another.

  You feel awful because you have sold your moral agency to buy moral outcomes. For some, that's a bargain. For others, it's a loss of self. Neither is irrational.
