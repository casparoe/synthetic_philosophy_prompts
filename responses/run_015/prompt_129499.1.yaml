  hey write me a dialogue between Lena and Marco, two grad students in aesthetics, arguing in a coffee shop about a perfect forgery of a destroyed painting. Lena thinks the value is mostly in the visual experience and that the forger's skill adds its own merit, so if you cant tell the difference the copy might even be superior. Marco defends what he calls "causal provenence" - the idea that part of art's worth comes from being literally the object the artist touched, not just a convincing visual match. they need to actually respond to each other: Lena should ask why Marcos view doesnt make every museum restoration worthless, and Marco should push back by asking why Lena praises the forgers skill if she claims the original artists hand doesnt matter. keep it casual, like theyre talking over cheap coffee, and maybe have one of them spill a latte. dont make either side a strawman.
