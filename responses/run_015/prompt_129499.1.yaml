answer: |-
  The espresso machine hissed like a angry cat, drowning out the indie folk playlist for a second. Marco stirred his black coffee with a wooden stick that was already dissolving. Lena was cradling a large latte like it was a fragile artifact.

  "It's gone, Marco. Burned to ash in that warehouse fire," Lena said, tapping her tablet. "The *Sunlit Bridge*. But this guy in Amsterdam? He's replicated it. Pigment analysis, brushstroke topology, everything. Down to the craquelure. If you put it in the frame, nobody knows."

  Marco leaned back, crossing his arms. "So we replace a destroyed masterpiece with a high-end lie? That's the plan?"

  "I'm saying, what did we actually lose?" Lena took a sip. "If the aesthetic experience is identical for the viewer, the value is preserved. Honestly, the forger's skill might even make it *more* valuable. It's a feat of human precision to match a dead master."

  "It's not about the visual data, Lena. It's about causal provenance." Marco tapped the table for emphasis. "Part of the art's worth is that it is literally the object the artist touched. It's a relic of a specific moment in time. This copy? It's a prop. It has no history, only a disguise."

  "Okay, but where do you draw the line?" Lena leaned forward. "Take museum restoration. Conservators paint over cracks, they fill in missing chunks of pigment. Sometimes they're repainting 40% of the canvas. By your logic, isn't that just a slow-motion forgery? Why is a restorer's touch 'preservation' but a forger's touch is 'worthless'?"

  "Because restoration is about continuity," Marco said, shaking his head. "It's maintaining the causal chain. You're stabilizing the original object, not swapping it out for a new one that *looks* like the old one. The atoms Van Gogh touched are still the majority shareholders in the canvas. In your scenario, the atoms are all wrong."

  "But I can't see the atoms," Lena countered. "I see the image. And I see the labor. Why is the labor of the forger impressive to you? You just said the original artist's hand doesn't matter to the visual experience."

  Marco paused, his spoon hovering over his cup. "Wait. I didn't say the artist's hand doesn't matter. I said it matters *ontologically*."

  "No, listen," Lena pressed. "You're arguing that the value is in the physical history. But when I praise this forgery, I'm praising the *skill* required to make it. If the original artist's specific touch is just about 'causal history' and not about what's actually on the canvas, then why does the forger's skill count for anything? You can't have it both ways. Either the physical execution matters, or the history matters. If you care about the history, the forger is just a photocopier. If you care about the execution, then the copy is art."

  Marco opened his mouth, then closed it. He reached for his cup to take a defensive sip, but his hand was moving too fast, caught up in the momentum of his own frustration.

  "The execution matters *because* of the history—"

  He jerked his elbow. The cheap paper cup tipped. Black coffee surged over the rim, flooding the saucer and splashing onto Lena's syllabus.

  "Shit!" Marco jumped up, grabbing napkins.

  Lena pulled her papers away, laughing despite herself. "Careful! That's my Kant, you're washing away the categorical imperative!"

  Marco was dabbing frantically at the dark stain spreading across the table. "I'm sorry. I'm sorry. Look, that's... that's actually the point."

  Lena watched him mop up the mess. "The coffee spill is the point?"

  "The coffee," Marco said, pressing a wad of brown napkins into the puddle. "This cup? It's generic. I could get another one exactly like it from the counter. It would taste the same. But *this* cup is the one I was holding when I made the argument. It's part of the event. If I swap it for a clean one, the visual is the same, but the context is broken."

  Lena wiped a drop of coffee off her sleeve. "Okay, but the coffee isn't the art. The painting is."

  "But the painting *is* the event," Marco insisted, sitting back down, looking defeated but still stubborn. "Van Gogh struggled with that brush. He had a bad day, or a good day. The paint dried the way it did because of the humidity in Arles in 1888. That's the causal provenance. The forger didn't fight the same wind. He's simulating a struggle that didn't happen."

  Lena sighed, picking up her latte. "I get that. I do. It's romantic. It's sacred." She gestured to the stain on the table. "But look at that stain. It's ugly. It's a mess. But now it's part of our afternoon. If we clean it up perfectly, so no one knows it happened, did we lose something?"

  "Yes," Marco said.

  "Exactly," Lena said. "But if someone came along tomorrow and made a table that *looked* exactly like this one, stain included, but it was made in a factory... would you value the stain on the original table more?"

  Marco looked at the stain. He looked at Lena. A small smile tugged at the corner of his mouth. "The original table is sticky. The factory one wouldn't be."

  Lena laughed. "Fine. Causal provenance wins on stickiness. But put the forgery in the gallery, Marco. People will cry looking at it. They'll feel the same awe. If the emotion is real, does the source really invalidate the experience?"

  "I think... I think it makes the emotion a trick," Marco said quietly. "Like falling in love with a catfish."

  "Or," Lena said, finishing her latte, "it's like falling in love with a ghost. The person is gone, but the love remains valid."

  She stood up and grabbed her bag. "Come on. If we're going to be late for the seminar, we need to walk fast."

  Marco scraped the wet napkins into the trash. "Are you submitting the paper on the forgery?"

  "Yeah," Lena said, holding the door open. "Title: 'The Aura of the Copy.'"

  Marco walked out into the cool air. "I'm going to write a rebuttal. 'Stickiness and Ontology.'"

  Lena groaned. "Please don't."
