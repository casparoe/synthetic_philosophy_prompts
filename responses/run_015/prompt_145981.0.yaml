answer: |-
  Because street names function as mandatory infrastructure rather than optional monuments, commissions must prioritize relieving the addressal burden on current residents over preserving historical nomenclature, shifting the ethical default from retention to renaming when significant harm is identified.

  The addressal burden distinguishes street naming from statues because it transforms commemoration from a passive visual experience into an active verbal and administrative requirement. While a citizen can choose to avoid a park containing a controversial statue, residents cannot avoid speaking their address to emergency services, delivery drivers, or guests, effectively coercing them into perpetuating the honorific. This functional coercion means the "recording" function of a street name is ethically subordinate to its "honoring" function; unlike a museum plaque, a street sign cannot provide sufficient context to neutralize the harm of the name itself while retaining its utility. Therefore, the argument that removal erases history is flawed because the street grid is an inappropriate archive for complex moral histories; history is better preserved in dedicated spaces where context can be fully explored without inflicting daily psychological costs on residents. Consequently, commissions should weigh the logistical costs of renaming (changing maps, updating IDs) as mere administrative hurdles rather than ethical counterweights to the harm of the burden. This logic extends to other mandatory civic interfaces like public schools or government buildings, but applies less rigorously to optional spaces like parks or theaters where visitation implies consent.

  I am 85% confident in this analysis. The specific point about which I am least certain is whether robust interpretive infrastructure, such as historical markers at street entrances combined with community programming, could ever sufficiently mitigate the addressal burden to justify retention in cases of moderate rather than egregious harm.
