  The monitor's green LED pulsed, a steady, rhythmic heartbeat. Elena leaned over the crib, not physically, but through the grainy black-and-white feed on the nightstand. The baby's chest rose, fell, rose. A perfect, shallow tide.

  $P$: The baby is breathing.

  She knew it. She saw the movement. If the baby weren't breathing, the chest would be still; she would see the stillness. The method was visual confirmation of the screen. In the nearest world where the baby held its breath, the screen showed stillness, and Elena did not believe $P$. She tracked $P$.

  She needed to answer the door. A delivery. If she left, the baby must be safe.

  $Q$: The baby is not dead.

  Breathing entails being alive. She drew the conclusion silently, the logic as taut as a wire. If the chest moves, life persists. She picked up her keys.

  But she did not know $Q$.

  To know $Q$, she would have to track it. In the nearest world where $Q$ is false, the baby is dead. But death does not always mean stillness on a screen. In the nearest world where the baby is dead, the video feed has frozen—a common glitch in this old unit—locking on the last frame of a rising chest. In that world, $P$ is false (the baby is not breathing), but the screen looks exactly as it does now. Elena looks, sees the rise, and believes the baby is alive. She believes $Q$. She fails to track $Q$.

  She put the keys in her pocket. It was reasonable to go. The probability of a freeze at the exact moment of death was vanishingly small, far smaller than the risk of ignoring the door. She walked out, leaving the pulsing green light behind her.

