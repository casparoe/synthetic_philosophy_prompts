  *   **Salience:** If Elena thinks, "The monitor never freezes," she brings the $\neg Q$ world closer (by making the error salient), potentially triggering a check. If the *narrator* names the risk, the reader attributes negligence to her for ignoring it, rather than an epistemic gap.
