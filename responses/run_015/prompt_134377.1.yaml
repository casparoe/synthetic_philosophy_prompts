  *   **M:** Visual observation of the monitor feed.
  *   **Grain of M:** "Looking at the screen image." (If described as "Looking at a functioning feed," she knows $Q$; the verdict depends on excluding the device's reliability from the method definition).
  *   **Conditions:**
