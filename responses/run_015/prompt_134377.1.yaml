      *   **Entailment ($P \rightarrow Q$):** Tracked substantively. She understands biology.
      *   **Q (Sensitivity):** **Fails.** Nearest $\neg Q$ (Baby dies + Screen freezes): Screen shows movement. She believes $Q$.
      *   **Q (Adherence):** Met.
  *   **The Engine:** The nearest $\neg Q$ world (Death + Freeze) is further from actuality than the nearest $\neg P$ world (Breath-hold + Stillness), but in the $\neg Q$ world, $M$ yields a false positive.
