          *   *Verdict:* It presupposes a relational theory. A pure control view would say "If you violated the norm, you lack moral authority," regardless of structure. The notes argue structure *saves* standing. This implies standing is about shared vulnerability, not just moral purity.
          *   *Advice:* Make the relational commitment explicit. Standing is a currency of community membership, not just moral scorekeeping.

      *   **Addressing Question 2: Coherence of Hypocrisy Gradients:**
          *   *Analysis:* Traditional philosophy often treats hypocrisy as a "switch" (you are a hypocrite or you aren't). The "gradient" idea is more phenomenologically accurate (we *feel* less comfortable blaming if we recently sinned).
