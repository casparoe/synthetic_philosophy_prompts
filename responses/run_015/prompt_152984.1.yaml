  6.  **Final Polish:** Ensure the distinction between *standing* (the right to speak) and *credibility* (the weight of the speech) is clear, as this is crucial for the "gradient" argument. Ensure the "structural vs. agential" distinction is treated as the primary source of conflict for the narrative.

