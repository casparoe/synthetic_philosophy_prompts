      *   *Pattern:* Implicated blamers retain standing if structurally compelled, lose it if agentially chosen. Outsiders have full standing.
      *   *Proposal:* Introduce "hypocrisy gradients." Standing isn't binary (all or nothing) but proportional to similarity, time, visibility, proximity.
      *   *Metaphor:* "The closer the mirror, the weaker the voice."

