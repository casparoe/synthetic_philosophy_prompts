answer: |-
  **Study Group Plan: Gifts, Bribes, and the Grey Zone**
  **Time:** 60-90 mins
  **Goal:** Move students from "corruption = illegal acts in developing states" to "corruption = context-dependent exchange of value."

  ### 1. The Hook (10 mins)
  *   **Start with the Wine.** Don't abstract it yet. Put the Jake scenario on the board: *Grad student gives advisor $200 bottle of wine before grading.*
  *   **Quick Vote:** Hands up for "Corruption," hands up for "Politeness," hands up for "Depends."
  *   **Why:** Gets them invested immediately. It's their world, not some distant capital.

  ### 2. Busting the Geography Myth (15 mins)
  *   **The Misconception:** "Corruption is brown envelopes in poor countries."
  *   **The Fix:** Hit this **first**. Show a slide of US campaign donations or lobbying expenditures vs. a small bribe in a low-income country.
  *   **Point:** Institutionalized gift-giving looks different here, but the mechanics of exchange are the same. If you only look for envelopes, you miss the wine.
  *   **Example:** Keep it domestic here. Maybe a local city council member getting season tickets to games. Avoid the Japan/Germany comparison if you're worried about stereotypes—it distracts from the structural point. Stick to *power dynamics* rather than *national culture*.

  ### 3. The Moving Line & The Legal Trap (20 mins)
  *   **The Misconception:** "If no law is broken, it's clean."
  *   **The Fix:** Address this **mid-way**, after establishing geography but before introducing Jake's theory.
  *   **Activity:** Vary the wine scenario.
      *   *Variant A:* $20 wine, end of semester.
      *   *Variant B:* $200 wine, before grading.
      *   *Variant C:* $2000 wine, before grading, advisor asks for it.
  *   **Discussion:** At what point does the *law* catch up to the *norm*? Usually later.
  *   **Clientelism Note:** You asked about using clientelism. Don't make it the core example—it's too macro. Use it as a contrast: "In some systems, the exchange is explicit (votes for jobs). In ours, it's implicit (donations for access)."

  ### 4. Jake's "Moral Visibility" (20 mins)
  *   **Where it fits:** This is your analytical tool. Put it **after** they understand the line moves and laws lag behind. It's the lens they use to judge the grey areas.
  *   **The Concept:** Can you narrate the exchange as a market transaction without blushing?
      *   *Test:* "I gave him wine so he'd give me an A." (High visibility = Corruption)
      *   *Test:* "I gave him wine to say thanks for the mentorship." (Low visibility = Gift)
  *   **Does it need an example?** Yes. Use a clear market transaction vs. a social one.
      *   *Example:* Paying a plumber $200 (Visible market, no blush). Giving a plumber $200 gift card after he fixes your sink (High blush, looks like a bribe).
  *   **Why here:** They need to know *why* the line moves before they can test visibility. Visibility explains the *social cost* of the exchange.

  ### 5. End Check: The Three Cases (15 mins)
  *   **Activity:** Break into groups. Give them three ambiguous cases to classify using "Moral Visibility."
      1.  **The Intern:** Unpaid intern buys coffee for the whole office every morning ($5/day).
      2.  **The Consultant:** Former regulator now works for the industry they regulated, salary $400k.
      3.  **The Dinner:** Professor takes a student to a $50 dinner to discuss career advice.
  *   **Output:** They have to argue whether the "narrative" makes them blush.

  ### 6. What to Skip
  *   **Deep Ethnography:** Don't go down the rabbit hole of specific patron-client networks in Latin America or Southeast Asia. It's fascinating but will make them think corruption is a "cultural thing" over there, rather than a structural issue everywhere.
  *   **Legal Codes:** Don't spend time reading actual statutes. They'll get bogged down in loopholes and miss the normative point.

  ### Sequence Map for Misconceptions
  1.  **"It's only over there"** → Killed in **Section 2** (Lobbying/Campaign Finance comparison).
  2.  **"If it's legal, it's fine"** → Killed in **Section 3** (The Wine Variants showing norms shift before laws do).
  3.  **"Intent doesn't matter"** → Killed in **Section 4** (Moral Visibility focuses entirely on how the intent is narrated).

  *Quick tip:* Make sure you seperate the idea of "illegal" from "corrupt" early, or they'll get stuck on the legal definion all hour. Also, keep the wine scenario alive throughout so it doesn't feel like disjointed theories.
