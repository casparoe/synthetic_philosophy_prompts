answer: |-
  **OFFICE FOR EPISTEMIC MODESTY**
  **STATUTORY GUIDANCE NOTE 12-C**
  **ISSUED UNDER SECTION 4 OF THE RATIONALITY IN PUBLIC SPENDING ACT 2024**

  **SUBJECT: COMPLIANCE WITH THE OUTSIDE VIEW MANDATE (REFERENCE CLASS SELECTION AND MODesty RETURNS)**

  1.  **Definition of Appropriate Cohort**
      Where an applicant submits a proposal, they must identify a Reference Class of historically comparable enterprises to establish a Base Rate of success. Applicants are prohibited from selecting a Singleton Class (n=1). A class defined by features unique to the applicant (e.g., "Bike shops run by vegetarians in Leeds") shall be rejected as Reference-Class Laundering. Conversely, classes too broad to be predictive (e.g., "All commercial enterprises") shall be rejected for lack of specificity. The Office reserves the right to determine the appropriate level of granularity.

  2.  **The Null-Class Protocol (Unprecedented Projects)**
      Where an applicant claims their venture is unprecedented, the Reference Class shall default to "Projects Claiming Unprecedented Status." Historical data indicates a Base Rate of failure for this class approaching 94%. Applicants must adjust their viability scores accordingly. No exemption is granted for genuine novelty, as genuine novelty is indistinguishable from delusion prior to outcome.

  3.  **Audit and Reclassification**
      To prevent epistemic arbitrage, the Unit will audit all selected Reference Classes. If the Unit determines the selected class inflates the Base Rate, it will impose a Corrective Class. Applicants should note that this audit requires the Unit to assess the specific merits of the proposal to judge the class suitability. This necessary intrusion of Inside-View reasoning does not invalidate the Outside-View requirement.

  4.  **Modesty Returns and Uncertainty Bands**
      Applicants must submit a Modesty Return declaring a 90% Confidence Interval for projected outcomes. Intervals spanning less than two orders of magnitude will be returned for revision. Funding allocations will be calculated based on the upper bound of the interval, provided the lower bound does not include zero. Where the lower bound includes zero, the applicant must justify why funds should not be withheld.

  5.  **Second-Order Base Rate Disclosure**
      Applicants must be informed that the Base Rate of success for projects approved under this Guidance is statistically indistinguishable from the Base Rate of projects rejected under this Guidance. This reflects the inherent limitation of forecasting regimes. Compliance ensures procedural rationality, not operational success.

  **WORKED EXAMPLE: APPLICATION 8940-K (COMMUNITY HUB)**

  *   **Applicant Proposal:** "Sustainable urban cycling cooperative."
  *   **Applicant Selected Class:** "Employee-owned green transport startups (2020–2024)." (Base Rate: 65% success).
  *   **Unit Assessment:** Class rejected. Too narrow; effectively a Singleton Class given specific local zoning laws.
  *   **Corrective Class Imposed:** "Small-scale retail hospitality." (Base Rate: 12% success).
  *   **Applicant Confidence Interval:** £40k–£60k revenue.
  *   **Unit Adjustment:** Interval widened to £0–£150k to meet Modesty thresholds.
  *   **Outcome:** Funding approved at £60k (upper bound), subject to Clause 5 disclaimer.

  **EXTRACT FROM STANDARD FORM O.E.M.-4**

  > **Field 4.2:** Justify why your venture exceeds the Base Rate of the Corrective Class without referencing internal capabilities.
  > **Limit:** 50 characters (including spaces).
  > **Input:** _"Luck. But statistically significant luck."_

  **INDUSTRY IMPACT STATEMENT**

  Regarding the effect of the Regime on innovation velocity, Mr. J. Vane, founder of NeuroLink Systems, stated in evidence to the Select Committee:

  > "We used to build things because we thought we were right. Now we build things because we fit the cohort. You spend your life trying to escape the average, and the Office spends its life dragging you back into it. I have three forms to fill out just to claim my prototype is unique. It's easier to fail quietly."

  **FOOTNOTE 1**
  *Applicants arguing that the Unit's own success rate (Clause 5) undermines the validity of the Unit's guidance are referred to Clause 2. The class "Critiques of the Office" has a high volume but low impact Base Rate.*

  **END OF GUIDANCE**
