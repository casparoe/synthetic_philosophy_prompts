      *   **Thesis:** Refusing $\neq$ Overriding. Refusal is permitted (agent not guardian) but must be loud. Overrides are near-never permissible due to *feedback contamination* (invisible errors compound). Exception: Agency-irreversible harm, must be legible/rebuttable.
      *   **Concessions:** Screenshot problem (refusals as reputation management), Atrophy worry (helpfulness erodes competence).
      *   **Deliverables:**
