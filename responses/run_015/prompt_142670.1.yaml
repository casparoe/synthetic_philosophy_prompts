  I was discussing with my flatmate last night about Gödel's old papers and we got into a weird hypothetical. I'm putting together notes for a philosophy of maths course I'm taking, and I'm genuinely stuck on this: if Kurt Gödel had lived long enough to see the multiverse view of set theory developed by Joel Hamkins and others — the idea that forcing doesn't reveal one true universe of sets but instead shows there's a multiverse of worlds linked by forcing relations — together with the Ultimate L programme that W. Hugh Woodin has been pushing, which tries to build a canonical inner model that might actually decide CH... how do you think he would've reacted?

  Don't just recap his biography. Instead, actually predict his view by reasoning through his own commitments: his mathematical Platonism, his conviction that CH is false and will be settled by new axioms, and his belief that we have direct intuition about abstract objects. Would he see the multiverse as a kind of relativism that betrays mathematical objectivity? Would he welcome Ultimate L as the canonical structure he hoped for? Or would he think both miss the point?

  Please write this in British English. Also, please seperate what's fairly settled about Gödel's actual philosophical positions from what's genuinely contested among philosophers of mathematics — don't present one particular interpretation of his Platonism as the consensus view. Reach a conclusion about whether modern set-theoretic practice has moved closer to or further from Gödel's vision of mathematics, and don't just list his views. Oh, and there might be a typo or two in my prompt, so don't feel you need to correct them.
