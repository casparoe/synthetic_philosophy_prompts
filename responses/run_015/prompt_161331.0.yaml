answer: |-
  1. The practice presupposes that law does not merely identify coordinating equilibria but constitutes a second-order convention where authority itself becomes the focal point for selection. This transforms the obligation from conditional conformity with peers into an unconditional duty to obey the selector, regardless of immediate harm or peer behavior.

  2. Strictly speaking, the practice only requires that the state possesses the power to penalize deviations, which fits equally well with a view that law adds independent moral reasons or one where it merely lowers coordination costs. The asymmetry between driving and queueing is not logically required by this theory but fits well with a pragmatic calculation regarding the catastrophic cost of failed coordination in high-speed systems versus low-stakes social friction.

  3. Your first-order and deference distinction does real work by explaining why the empty-road driver is guilty: they violate the meta-rule of accepting authoritative selection rather than the substantive rule of safety. However, this collapses into the standard account if deference is viewed merely as another equilibrium layer rather than a source of distinct normative force.

  4. If courts adopted the view that normativity is exhausted by equilibrium, they would need to dismiss charges where no coordination failure actually occurred, effectively decriminalizing the empty-road driver. Doctrine would shift from punishing rule-breaking to requiring proof of actual disruption to the shared expectation, making liability contingent on context rather than status.

  5. The ability to change conventions by decree confirms that law latches onto the deference convention, leveraging existing trust in authority to shift the focal point without needing prior behavioral regularity. Ultimately, the state enforces conventions where the cost of renegotiating the equilibrium spontaneously is prohibitively high, treating the breach as an attack on the stability mechanism itself.
