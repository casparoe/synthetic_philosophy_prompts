  There is no use in strictly **ordering**
  The wind to stop, nor helps the act of **praying**,
  You cannot fix the storm by **measuring**,
  Nor calm the sea with loud and angry **cursing**,
  Nor find the shore by blind and wild **guessing**,
  Nor stop the wave by simply **naming**.

  We give the threat a shape by **naming**,
  But cannot save the ship by **ordering**,
  We lose the port through poor and vague **guessing**,
  We fall to knees in desperate **praying**,
  The sailor stands above the deck **cursing**,
  The rain falls down without **measuring**.

  The depth is lost beyond all **measuring**,
  We lose the stars that guided us by **naming**,
  The night is filled with sounds of **cursing**,
  No voice remains capable of **ordering**,
  The silence grows heavier than **praying**,
  The morning comes without our **guessing**.

  We spend the night in cold and hard **guessing**,
  The bread is gone beyond our **measuring**,
  There is no comfort left in **praying**,
  We keep the dead alive by **naming**,
  The officer is tired of **ordering**,
  The wind replies with only **cursing**.

  The light returns without any **cursing**,
  We find the land by lucky **guessing**,
  The captain stops his loud and strict **ordering**,
  The light is warm beyond our **measuring**,
  We find the beach and start **naming**,
  The survivors fall to quiet **praying**.

  They finish now the act of **praying**,
  They leave behind the habit of **cursing**,
  They build a town and start **naming**,
  They live their days without **guessing**,
  They plant the fields by strict **measuring**,
  The law begins with soft **ordering**.

  Consider well the **guessing** and the **praying**,
  Consider well the **ordering** and **cursing**,
  Consider well the **measuring** and **naming**.
