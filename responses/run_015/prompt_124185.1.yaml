answer: |-
  ### Standards of Adequacy for Long-Term Institutional Choice

  The following specifications define adequacy relative to a specific purpose: guiding an institution in allocating resources between near-term welfare, existential risk reduction, and far-future character improvement, including the option of deferral. Some items below are genuine structural constraints required for the task; others are normative commitments that some camps treat as desiderata and others as prejudices; still others are epistemic constraints on the *users* of the theory that the theory must accommodate. The list distinguishes these where relevant.

  1.  **Conceptual Separation of Existence, Duration, and Quality.** The theory must distinguish the value of bringing people into existence, the value of extending the timeline of civilization, and the value of improving the welfare of those who live. It cannot treat these as a single metric of "goodness" without specifying how they trade off.
      *   *Justification:* This is a structural requirement derived from the institution's three expenditure categories. A policy might increase expected welfare conditional on survival while lowering the probability of survival (risk vs. quality), or extend the future while filling it with lives barely worth living (duration vs. quality). A theory that collapses these distinctions cannot rank the specific options presented. It forces the view to specify whether existence is a precondition for value or a source of value itself.

  2.  **Resolution of the Non-Identity Problem.** The theory must provide a verdict on policies that change *who* exists in the future, not just *how well* they live. It must either explain why the inability of future people to claim they were harmed (since they wouldn't exist otherwise) is irrelevant, or explain why the theory falls silent in such cases.
      *   *Justification:* This is a genuine desideratum for long-run policy. Most existential risk measures and far-future character improvements alter the identity of future populations. A person-affecting view (often a prejudice of near-termists) that requires a specific complainant to register harm will fall silent on these choices. The theory must either adopt an impersonal standpoint (counting lives regardless of identity) or defend the silence as a feature. Silence is functionally useless for an institution that *must* choose.

  3.  **Aggregation and Scale Sensitivity.** The theory must state whether the number of lives matters independently of their average quality, and how it weighs a vast number of low-quality lives against a smaller number of high-quality lives. It must declare its stance on the "Repugnant Conclusion."
      *   *Justification:* This is a core normative requirement. If the future contains astronomical numbers of beings (the scale premise), a view that aggregates linearly (Total View) will dominate all other considerations. A view that averages or sets sufficiency thresholds will not. The institution needs to know if the sheer magnitude of the future population lexically overrides near-term suffering. This is not merely a prejudice of utilitarians; it is a mathematical consequence of any view that counts population size as a variable.

  4.  **Epistemic Robustness under Cluelessness.** The theory must recommend an action even when the sign of the far-future effects is unknown and plausible errors are symmetric. It cannot treat every inconvenient consequence claim as unknowable and every convenient one as established.
      *   *Justification:* This is an epistemic constraint on the *use* of the theory, which the theory must accommodate. Long-term interventions are subject to radical uncertainty (cluelessness). A theory that demands precise expected value calculations will recommend paralysis or arbitrary guesswork. Adequacy requires a decision rule (e.g., maximin, robustness, or credence-weighting) that functions when probabilities are vague. Treating this as a mere prejudice of skeptics ignores the reality that the institution cannot wait for empirical clarity.

  5.  **Constraint on Pascalian Fanaticism.** The theory must take a position on whether rationality requires responsiveness to astronomically large payoffs at vanishingly small probabilities. It must justify any damping mechanisms (probability thresholds, bounded utility) as principled rather than ad hoc.
      *   *Justification:* This is a decision-theoretic requirement. If the scale of the future is large enough, even tiny probability shifts in existential risk can dominate all near-term welfare in expected value calculations. A theory that allows this (unbounded expected utility) may direct all resources to low-probability, high-impact scenarios. A theory that forbids it must explain why ignoring the mathematical expectation is rational. This is not a prejudice; it is a requirement for avoiding absurd resource allocation driven by tail risks.

  6.  **Sensitivity to Empirical Pivotality.** The theory must state how much its recommendations rest on the claim that the present generation is at a uniquely influential juncture (high risk, high leverage). It must specify what becomes of its recommendations if this claim is false or unverifiable.
      *   *Justification:* This is a requirement for empirical robustness. Many longtermist arguments hinge on the "hinge of history" hypothesis. If the theory collapses when this empirical claim is weakened, it is too fragile for institutional planning. The theory must distinguish between *normative* importance (the future matters) and *instrumental* importance (we can affect it). This prevents the theory from being held hostage to contingent sociological forecasts.

  7.  **Non-Additivity of Risk Reductions.** The theory must not assume that risk reductions from different sources simply sum. It must accommodate correlated hazards, common modes of failure, or risk substitution (suppressing one raises another).
      *   *Justification:* This is a structural requirement regarding risk modeling. If hazards are correlated, the marginal value of reducing a specific risk changes depending on what other risks have been mitigated. A theory that treats risks as independent will misallocate resources. If the correlation structure is unknown, the theory must declare the ranking indeterminate rather than merely uncertain. This is a genuine desideratum for any portfolio management of existential threats.

  8.  **Distinction between Welfare and Autonomy.** The theory must distinguish preserving future people's capacity to determine their own values from making their lives go well by present lights. It must address the tension between preventing value lock-in and avoiding paternalism.
      *   *Justification:* This is a normative requirement regarding the *content* of the good. "Improving the character of the far future" can mean ensuring they are happy (welfare) or ensuring they are free to choose (autonomy). These may conflict; ensuring they hold "correct" values might require paternalistic intervention now. A theory that conflates these will license astronomical paternalism or, conversely, allow value drift that undermines welfare. The institution needs to know which good it is purchasing.

  9.  **Sustainability of Intergenerational Sacrifice.** The theory must not require a generation to sacrifice indefinitely for its successors. It must allow for a consumption level that makes compliance rational for the current actors.
      *   *Justification:* This is often dismissed as a prejudice (wanting a "comfortable theory"), but for an *institution*, it is a functional constraint. If the future is enormous and investments compound, a maximizing view may require near-zero consumption now to benefit the far future. If no generation has reason to comply, the plan fails. A theory that demands self-erasure is practically inadequate for a continuing institution. This is a requirement on the *stability* of the normative system.

  10. **Handling of Moral Uncertainty.** The theory must account for the possibility that the theory itself is wrong. It should not mandate high-stakes action based on a single normative framework when reasonable disagreement exists.
      *   *Justification:* This is an addition to your list, necessary for a public institution. A foundation or government represents diverse moral stakeholders. A theory that acts as if Total Utilitarianism (or any specific view) is certainly true risks imposing one sect's metaphysics on the public purse. Adequacy requires a mechanism for hedging against moral error, not just empirical error.

  ***

  ### Incompatibilities and Tensions

  You asked to see where these requirements cannot be jointly satisfied. There are three primary fault lines.

  First, **Aggregation (3) conflicts with Sustainability (9).** If the future population is astronomically large (Scale Premise) and the theory aggregates value linearly (Total View), the expected value of the future swamps all present costs. Rational maximization then demands near-total savings and investment, violating the requirement that the current generation not be required to sacrifice indefinitely. You can have a theory that respects the scale of the future, or one that is sustainable for current actors, but standard maximizing consequentialism cannot have both.

  Second, **Non-Identity (2) conflicts with Person-Affecting Intuitions.** This is the classic tension. To satisfy the Non-Identity requirement, you must adopt an impersonal view (people are vessels of value). But this triggers the Aggregation problem above. If you retain the Person-Affecting restriction to avoid Aggregation issues, you fail the Non-Identity requirement and cannot evaluate most long-term policies. You must choose between a theory that can speak about the future (Impersonal) and a theory that matches common moral intuitions about harm (Person-Affecting).

  Third, **Scale Sensitivity (3) conflicts with Anti-Fanaticism (5).** To respect the astronomical scale of the future, you must attend to small probabilities of huge impacts (existential risk). But attending to small probabilities of huge impacts *is* Pascalian fanaticism. If you dampen the fanaticism (via bounded utility or probability thresholds), you effectively ignore the tail risks that longtermism claims are most important. If you do not dampen it, you become vulnerable to "Pascal's Mugging" by any hypothesis with a large enough payoff. You cannot be fully sensitive to the scale of the future while remaining immune to fanaticism.

  ***

  ### The Single Exclusionary Requirement

  The single requirement that excludes the largest number of views people actually hold is **Requirement 2: Resolution of the Non-Identity Problem.**

  Most people, including near-termists, person-affecting critics, and many standard rights-based theorists, operate with a Person-Affecting Restriction: an act can only be wrong if it makes some particular person worse off than they would otherwise have been. This view is the default mode of human moral reasoning. However, it is logically incompatible with long-term policy analysis where the policies determine who exists. Adopting Requirement 2 forces the abandonment of the Person-Affecting Restriction. This excludes standard contractualism, most rights-based views, and the intuitive morality of the near-termist critics. While Requirement 9 (Sustainability) excludes standard Maximizing Consequentialism, and Requirement 5 (Anti-Fanaticism) excludes naive Longtermism, Requirement 2 is the gateway: if you cannot clear it, you are not doing population ethics at all. It is the filter that separates common-sense morality from the specific domain of this seminar.

  ***

  ### The List at Work

  Consider the institution deciding whether to fund a geoengineering project (near-term benefit, unknown long-term risk) or an AI safety initiative (existential risk reduction, no near-term benefit). A view that fails Requirement 2 (Non-Identity) cannot assess the AI safety initiative because the people saved do not yet exist to be beneficiaries. A view that fails Requirement 5 (Anti-Fanaticism) will fund the AI safety initiative regardless of cost, even if the probability of success is one in a billion, because the stake is infinite. A view that fails Requirement 9 (Sustainability) will demand the institution liquidate its endowment entirely for the AI project, ensuring the institution ceases to exist before the benefit is realized. Only a view that navigates the tension between these requirements can recommend a specific allocation, justify it without demanding self-erasure, and remain robust if the empirical claim about AI risk turns out to be exaggerated.
