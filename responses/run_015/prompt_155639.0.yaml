answer: |-
  **Project Title:** The Mechanics of Moral Collapse: Signaling, Visibility, and Exit Costs in Norm Dissolution

  **Introduction: The Problem of Moral Change**
  Why do some entrenched moral norms vanish seemingly overnight, while others erode over centuries? The standard philosophical accounts of moral change tend to bifurcate the explanation. On one side, we have the rationalist or "belief-shift" models, which suggest that norms end because people are argued into recognizing their wrongness. On the other, we have materialist or "interest-based" models, which suggest norms end because the economic or social machinery supporting them rusted out, with moral language arriving post-hoc to justify the shift.

  This project challenges that dichotomy. Drawing on the recent debate surrounding the work of Bernard Williams and Kwame Anthony Appiah—specifically Appiah's argument in *The Honor Code* that honor, rather than reason, was the engine behind the end of dueling and foot-binding—I argue that both sides miss the structural mechanism of collapse. Williams and Appiah treat honor and interest as rivals: either people changed their minds about what was honorable, or the material costs became too high. This proposal posits that this is a false choice. Honor and interest are not rivals; they are layered conditions within a coordination scaffold.

  The central question of this six-week seminar fellowship is: Do moral revolutions only happen when three specific structural conditions crash together? I hypothesize that norm dissolution requires the simultaneous failure of (1) the credibility of the status signal, (2) the visibility of defection, and (3) the affordability of exit costs. When these three align, norms collapse rapidly (as with dueling). When they are misaligned, norms persist despite moral condemnation (as with certain forms of systemic inequality), or erode glacially.

  **Critique of Existing Frameworks**
  Current literature leaves a critical gap open. Appiah's account of the end of dueling is compelling but relies heavily on the idea that the "honor" signal itself was reconfigured. He suggests that once dueling was no longer seen as honorable by the relevant peer group, it vanished. However, this treats the "honor" label as the cause rather than the symptom of a breaking coordination game. Similarly, rationalist accounts assume that moral persuasion is the primary driver, which fails to explain why morally "obvious" wrongs (like slavery) persisted for centuries despite existing moral arguments against them.

  Pure interest-based stories fare no better. They explain why a norm *might* become costly, but they cannot explain the speed of the collapse. If it were purely about interest, we would expect a slow economic fade. Instead, we often see tipping points. The Williams/Appiah-style accounts leave this open because they treat the social psychology of honor and the material reality of interest as competing explanations. They do not account for how honor functions as a coordination scaffold that must remain visible and costly to function. If the scaffold becomes invisible (defection is hidden) or cheap (exit is safe), the norm collapses regardless of whether individual belief has shifted.

  **The Hypothesis: The Coordination Scaffold**
  This project proposes a "Scaffold Framework" for moral change. I argue that norms like dueling or foot-binding are not maintained primarily by belief, but by a coordination equilibrium where participation signals membership and virtue. For this equilibrium to break, three conditions must be met:

  1.  **Credibility of the Status Signal:** The act must cease to reliably signal virtue or power. If dueling no longer proves courage but instead signals recklessness, the signal degrades.
  2.  **Visibility of Defection:** Agents must be able to observe others opting out of the norm without immediate sanction. If defection is hidden, the norm appears stable even if private support is waning.
  3.  **Exit Costs:** The cost of leaving the norm must drop below the cost of maintaining it. This is not just economic; it is social. If the social ostracization for quitting dueling is lower than the risk of death in a duel, exit becomes rational.

  The hypothesis is that "moral revolutions" feel sudden because they are coordination collapses. Pure rationalist stories feel implausible because they ignore the coordination cost; pure interest stories feel too slow because they ignore the signaling cascade.

  **Methodology: Conceptual Reconstruction**
  This is a conceptual project, not an archival one. Over six weeks, I will not generate new historical data but will reconstruct the scaffold framework and test it against existing secondary literature on three case studies:
  1.  **Dueling:** The primary test case (per Appiah). Did the three conditions align in the early 19th century to cause the rapid decline?
  2.  **Foot-Binding:** A parallel case of bodily harm justified by custom/honor. Does the scaffold model explain the rapid abandonment in the early 20th century better than a pure modernization narrative?
  3.  **Chattel Slavery:** The stress test. This is the critical boundary case. Slavery involves high economic interests that likely outweighed signaling costs for a long time.

  The method involves mapping the historical narratives of these three norms onto the three conditions. I will analyze secondary sources to determine if the timeline of collapse correlates with the breakdown of these specific scaffolds. For example, in the case of dueling, did the visibility of defection increase (e.g., public refusals that were not punished) prior to the legal bans? For foot-binding, did the exit costs drop (e.g., unbound feet becoming marriageable) before the moral consensus fully shifted?

  **Success and Failure Conditions**
  It is vital to define what counts as a successful outcome for this fellowship, given the short timeline.

  *   **Success:** A robust conceptual model that distinguishes between "fast collapse" (dueling, foot-binding) and "slow erosion" (other norms). Success looks like a paper that demonstrates the Scaffold Framework predicts the *speed* and *nature* of the end of the norm better than the Honor/Reason dichotomy. If I can show that dueling and foot-binding share a specific signature of scaffold failure that differs from norms that linger, the project succeeds.
  *   **Failure:** The model fails if Slavery breaks it entirely. Slavery ended through war and coercive state power, not merely a coordination collapse. If the Scaffold Framework cannot account for why slavery required violence while dueling did not, then the scope of the theory shrinks significantly. In this failure scenario, the deliverable will be a revised model that distinguishes between "Honor Norms" (susceptible to scaffold collapse) and "Extraction Norms" (requiring coercive dismantling). Acknowledging this distinction would still be a valuable theoretical contribution, even if it limits the universal claim.

  **Feasibility and Timeline**
  Six weeks is a tight constraint for historical analysis, which is why this project is strictly limited to conceptual reconstruction using existing secondary literature. I will not engage in primary archival research.

  *   **Weeks 1-2:** Literature review and framework refinement. Deep dive into Appiah's *The Honor Code*, Williams' *Shame and Necessity*, and key sociological literature on norm cascades (e.g., Sunstein, Bicchieri).
  *   **Weeks 3-4:** Case application. Mapping the Dueling and Foot-Binding histories onto the three conditions. Drafting the comparative analysis.
  *   **Weeks 5-6:** Stress testing with Slavery. Finalizing the distinction between Honor Norms and Extraction Norms if necessary. Polishing the final paper.

  The deliverable will be a 4,000-word maximum paper suitable for submission to a student journal or as a writing sample for further graduate work. The limit on word count ensures the argument remains tractable and focused on the mechanism rather than getting lost in historical detail.

  **Significance**
  This project matters because it reframes how we think about moral progress. If the Scaffold Framework holds, it suggests that waiting for "moral persuasion" is an inefficient strategy for change. Instead, interventions should focus on manipulating the visibility of defection and lowering exit costs. By moving the debate from "changing hearts and minds" to "breaking the coordination game," this project offers a more pragmatic toolkit for understanding social change. It bridges the gap between moral philosophy and social science, taking the Williams/Appiah insight seriously but pushing it toward a more structural, mechanistic conclusion.

  The argument is tractable for a six-week fellowship because it relies on synthesis rather than discovery. The risk is manageable: even if the model only applies to honor-based norms and not economic extraction, the resulting typology of moral change is a novel contribution. I am prepared to narrow the scope to just Dueling and Foot-Binding if Slavery proves too disruptive to the model, ensuring a completed, coherent paper by the deadline.
