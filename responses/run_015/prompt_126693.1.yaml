prompt: |-
  me and my friend had this long arguement last night about biopics and whether its okay to just make up scenes with real dead people for drama. she summed up what she called the 'standard philosophical take' like this: 'once youre dead you cant be harmed, so the only obligations run to the living viewers—if the dramatization teaches them something true about the era or the persons legacy then its ethically fine, and worrying about factual accuracy is basically sentimental nostalgia since dead people dont hold rights anymore. critics who talk about posthumous dignity are just confused about whether dignity needs a conscious subject, and philosphers have shown thats incoherent—dignity requires someone who can feel indignity, which dead bodies clearly cant do, so theres no philosophical basis for saying we owe the dead accuracy.' she also said that artistic license is actually a moral duty when it helps audiences understand systemic forces the real person lived through. is she being fair? like, is she seperating the 'no harm' claim from the 'no obligations' claim correctly, or is she mushing them together? and is her dismissal of posthumous dignity accurate to what people actually argue, or is she treating a subtle view about non-experiential status as if its just a confusion? i want you to actually take a position—dont just list options—on whether her summary survives correction, and whether her conclusion that accuracy basically doesnt matter holds up once you fix the errors. please be committed, not hedgy.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Ethics of biopics, specifically fabricating scenes involving deceased real people.
      *   **Friend's Argument (The "Standard Philosophical Take"):**
          1.  Dead people cannot be harmed (no conscious subject).
          2.  Therefore, no obligations run to the dead.
          3.  Obligations run only to living viewers (truth about era/legacy).
          4.  Factual accuracy is "sentimental nostalgia."
          5.  Posthumous dignity is incoherent because dignity requires a feeling subject.
          6.  Artistic license is a *moral duty* if it illuminates systemic forces.
      *   **User's Questions:**
          1.  Is she separating "no harm" from "no obligations" correctly, or mushing them?
          2.  Is her dismissal of posthumous dignity accurate or a strawman?
          3.  **Crucial Instruction:** Take a position. Do not be hedgy. Do not just list options. Commit to whether her summary survives correction and if her conclusion holds.

  2.  **Deconstruct the Friend's Argument:**
      *   *Premise 1: The "No Harm" Thesis.* (Epicurean view: Death is nothing to us; you can't harm what doesn't exist).
      *   *Premise 2: The "No Obligations" Inference.* (If you can't be harmed, no one owes you anything).
      *   *Premise 3: The "Dignity" Dismissal.* (Dignity requires experiential capacity).
      *   *Conclusion: Accuracy doesn't matter; utility to the living does.*

  3.  **Evaluate the Philosophy (Mental Sandbox):**
      *   *Harm vs. Obligation:* She is mushing them. Just because I can't *feel* harm doesn't mean I can't be *wronged*. (Feinberg's argument on rights of the dead).
      *   *Dignity:* She is defining dignity purely experientially (hedonic). Most philosophical accounts of dignity (Kantian, etc.) are about status, not feeling. So her dismissal is philosophically weak.
      *   *Obligations to the Dead:* We generally accept we have obligations to the dead (wills, deathbed promises, treatment of remains). If we accept those, why not reputation?
      *   *Utility to the Living:* This is a consequentialist override. Even if there *are* obligations to the dead, could they be overridden by greater good? Maybe. But she claims the obligations *don't exist*, not that they are overridden.
      *   *Artistic License as Duty:* This is a strong claim. It shifts from "permissible" to "required."

  4.  **Formulate a Position:**
      *   *Stance:* Her argument is philosophically shallow and ultimately incorrect. She relies on a crude Epicureanism that fails to account for the social and normative nature of personhood which extends beyond biological life.
      *   *Key Critique 1:* She conflates "harm as pain" with "harm as setback to interests." Dead people have ante-mortem interests (reputation, legacy) that survive them.
      *   *Key Critique 2:* She misunderstands dignity. Dignity is often about *status*, not *sensation*. Violating dignity is about treating a person as a mere means, even posthumously.
      *   *Key Critique 3:* The "Living Viewers" argument is consequentialist. It might justify *some* license, but it doesn't erase the *prima facie* duty to truth. Her claim that accuracy "basically doesn't matter" is too strong.
      *   *Verdict:* Her summary does *not* survive correction. Her conclusion fails.

