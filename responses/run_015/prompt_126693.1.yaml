      *   *Point 4: The Consequentialist Trade-off.* Even if we grant her point about educating the living, that makes accuracy a *defeasible* duty, not a *non-existent* one. She claims it doesn't matter at all. That's the error.
      *   *Conclusion:* Reiterate the commitment. Her view is ethically dangerous because it treats human lives as raw material for propaganda, however well-intentioned.

