answer: |-
  Your friend is wrong. Her summary does not survive correction, and her conclusion that accuracy "basically doesn't matter" collapses once you fix the philosophical errors she is making. She is not presenting the "standard philosophical take"; she is presenting a crude, caricatured Epicureanism that ignores the last fifty years of scholarship on posthumous rights, interests, and dignity.

  Here is the breakdown of why her argument fails, committed and without hedging.

  ### 1. She Conflates "Harm" with "Pain"
  Your friend's core premise is that "once you're dead you can't be harmed." This relies on the "Experience Requirement"—the idea that for a harm to occur, the subject must consciously experience a negative state (pain, distress, indignity).

  This is philosophically obsolete. The standard contemporary view (championed by philosophers like Joel Feinberg) distinguishes between **experiential harm** (feeling bad) and **setback to interests**. Human beings have "welfare interests" that extend beyond their biological lifespan. You have an interest in your reputation, the integrity of your legacy, and the fulfillment of your projects.

  If I burn down your house while you are on vacation, you are harmed even if you never find out. If I slander your name after you die, I am setting back the interests you cultivated while alive. Your friend mushes the "no pain" claim into the "no obligations" claim incorrectly. We can have obligations to entities that cannot feel pain (e.g., we have obligations to honor contracts with corporations or care for the environment for future generations). The lack of a conscious nervous system does not erase the normative weight of a life that was lived.

  ### 2. Her Definition of Dignity is Incoherent
  She claims dignity requires a "conscious subject" to feel indignity. This is a category error. Dignity is not a sensation; it is a **status**.

  In Kantian ethics, which underpins most modern human rights frameworks, dignity is about respecting rational agency and the narrative integrity of a person. To treat a person as a "mere means" is a violation of dignity. When a filmmaker turns a real, complex human being into a fictionalized puppet to illustrate "systemic forces" (as your friend suggests is a moral duty), they are often doing exactly that: using the dead person as a mere means to an educational end for the living.

  Your friend dismisses posthumous dignity as "confused," but she is the one confusing *respect* with *comfort*. We do not protect the dignity of the dead to make them comfortable (they can't feel discomfort); we protect it to maintain the moral relationship between the living and the dead. It is a duty of fidelity. To say accuracy is "sentimental nostalgia" ignores that truth-telling is a justice issue, not an emotional one.

  ### 3. The "Obligations to the Living" Argument Proves Too Much
  Your friend argues that obligations run only to living viewers to teach them "something true about the era." This is a consequentialist argument. Even if we grant this, it does not support her conclusion that accuracy "doesn't matter."

  At best, this creates a **trade-off**, not an erasure of duty. If fabricating a scene creates a greater understanding of a systemic truth, one might argue the fabrication is *justified*, but it remains a **moral cost** that must be accounted for. Your friend claims there is *no cost* because the dead have no rights. That is false.

  Furthermore, her claim that artistic license is a "moral duty" to illuminate systemic forces is dangerous. It assumes the filmmaker knows the "true" systemic lesson better than the actual events of the person's life. This often leads to propaganda, where the complexity of the individual is sacrificed for a neat political moral. That is not a moral duty; it is an ethical hazard.

  ### 4. The Verdict on "No Obligations"
  She claims philosophers have shown that obligations to the dead are incoherent. They have not. We universally accept obligations to the dead in other contexts: executing wills, keeping deathbed promises, and treating remains with respect.

  If I promise a dying friend I will publish their manuscript, and I instead burn it to "teach the living a lesson about the futility of art," I have wronged them. Your friend's logic would say I haven't, because my friend can't feel the betrayal. But our moral intuition (and most legal systems) recognize that the obligation existed *when they were alive* and survives their death. The same applies to their reputation. A biopic is a public extension of a person's identity; falsifying it is a violation of the trust inherent in that identity.

  ### Conclusion
  Your friend is separating the "no harm" and "no obligations" claims incorrectly. She assumes that because the *mechanism* of harm (feeling pain) is gone, the *source* of obligation (the person's interests and status) is also gone. It is not.

  Her conclusion that accuracy doesn't matter does not hold up. Accuracy matters because:
  1.  **Justice:** The dead retain an interest in the truth of their narrative.
  2.  **Trust:** Audiences trust biopics as history-adjacent; violating that trust degrades public discourse.
  3.  **Dignity:** Using a real person as a fictional prop violates their status as an end-in-themselves.

  She is free to argue that the *benefits to the living* can sometimes *outweigh* the duties to the dead. But to argue that the duties to the dead *do not exist* is philosophically unsound. Her position isn't the "standard philosophical take"; it's a utilitarian oversimplification that ignores the normative reality of human lives extending beyond biological cessation. You were right to push back.
