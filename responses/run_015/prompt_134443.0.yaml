answer: |-
  # Workshop Plan: The Normative Status of Pure Time Preference
  **Duration:** 75 Minutes
  **Participants:** ~10 Graduate Students (Philosophy/Economics)
  **Facilitator:** PhD Candidate

  ---

  ### 1. Conceptual Dependency: Securing the Substantive Thesis
  **Time Allocation:** 0–10 Minutes
  **Objective:** Establish the necessary conceptual groundwork so that Pure Time Preference (PTP) is not dismissed as a confusion of terms.

  *   **The Distinction to Secure:** Before PTP can be debated as a normative thesis, participants must distinguish between **discounting the *value* of a good** and **discounting the *probability* of receiving the good**.
  *   **Instructional Move:** Open with a direct question: "If I prefer \$100 today over \$100 tomorrow, is that irrational?" Expect answers citing investment opportunity or risk.
  *   **The Pivot:** Stipulate a "Closed System" where:
      1.  Investment returns are zero (no growth).
      2.  Delivery is metaphysically certain (no risk of death/catastrophe).
      3.  The good is identical in both periods.
  *   **The Dependency:** Explain that PTP only exists as a *substantive* ethical claim once these instrumental variables are controlled. If these are not controlled, a preference for the present is merely a proxy for risk aversion or opportunity cost. The workshop proceeds only on the condition that we are discussing the residual preference that remains after these controls are applied.

  ### 2. Carrying Scenario: The "Fixed Welfare Allocation" Model
  **Time Allocation:** 25–50 Minutes (Introduction at 10, Analysis through 50)
  **Objective:** Use a non-standard model to make the pure rate feel like a live ethical choice rather than a mathematical convention.

  *   **Scenario Description:** Present a "Two-Period Steward" case.
      *   **Agent:** A steward controls a fixed stock of welfare (e.g., 100 units of "well-being").
      *   **Recipients:** Two distinct temporal slices of a community (Period 1 and Period 2).
      *   **Constraints:** The stock cannot grow. There is zero risk that Period 2 will not exist. The utility function is identical for both periods.
      *   **Choice:** The steward must decide the allocation ratio (e.g., 50/50 vs. 60/40).
  *   **Required Features:**
      *   **Certainty:** Explicitly state that Period 2 *will* occur and *will* receive the allocation.
      *   **Isolation:** Remove all language of "investment," "interest," or "survival."
      *   **Ethical Stakes:** Frame the decision as a matter of justice between times, not efficiency.
  *   **Features to Avoid:**
      *   **Exponential Curves:** Do not write $e^{-rt}$ on the board. Do not use monetary terms where interest rates are intuitive. Use "welfare units."
      *   **Compounding:** Avoid multi-period chains that invite mathematical optimization strategies. Keep it to two periods to isolate the pairwise comparison.
  *   **Pedagogical Goal:** Force participants to justify a deviation from a 50/50 split solely on the basis of temporal location. If they argue for a 60/40 split in favor of Period 1, they are advocating for PTP. If they argue for 50/50, they are advocating for Intertemporal Neutrality.

  ### 3. Mapping Predictable Misconceptions & Interception Points
  **Objective:** Anticipate and neutralize three specific category errors.

  | Misconception | Description | Interception Point in Sequence | Facilitator Intervention |
  | :--- | :--- | :--- | :--- |
  | **Conflation with Risk Aversion** | Participants argue Period 2 might not exist or the goods might be destroyed. | **During Scenario Setup (Minute 15)** | When a participant raises uncertainty, immediately invoke the "Closed System" stipulation. Ask: "Granting metaphysical certainty, does the reason persist?" |
  | **Spatial-Distance Analogy** | Participants argue that time is like space; we don't discount goods sent to a distant location, so why discount distant times? | **During Framing Device (Minute 20)** | Allow the analogy to surface, but flag it for structural analysis in the Framing section (see Section 5). Do not accept it as a settled argument. |
  | **Instrumental Justification** | Participants argue that earlier consumption allows for *more* consumption later (growth) or prevents suffering now to enable agency later. | **During Scenario Analysis (Minute 35)** | If a participant argues "They need it more now to survive," challenge the premise: "In this model, survival is guaranteed regardless of allocation. Is there a reason left?" |

  ### 4. Diagnostic Exercise: The "Stipulated Certainty" Vignette
  **Time Allocation:** 65–75 Minutes
  **Objective:** Reveal whether participants grasp the *pure/impure* distinction through application, not definition.

  *   **Format:** A 5-minute written response followed by 5 minutes of debrief.
  *   **The Vignette:**
      > "Imagine two policies. Policy A delivers 100 units of welfare in 2025. Policy B delivers 100 units of welfare in 2125.
      >
      > **Stipulations:**
      > 1. The welfare is immune to inflation or investment growth.
      > 2. The recipients in 2125 are guaranteed to exist and receive the welfare.
      > 3. The recipients in 2025 and 2125 have identical capacity to enjoy the welfare.
      >
      > **Task:** If you prefer Policy A, write down the *single sentence* justification that is not ruled out by the stipulations above. If you are indifferent, explain why the date is ethically irrelevant."
  *   **Success Criteria:**
      *   **Pass:** The participant either argues for indifference (Neutrality) OR justifies the preference using only the *date itself* (e.g., "The present has a privileged normative status").
      *   **Fail:** The participant invokes risk ("They might not get it"), growth ("It could be invested"), or epistemic uncertainty ("We don't know their needs").
  *   **Debrief:** Collect the papers. Read one "Fail" and one "Pass" anonymously. Ask the group to identify which stipulation the "Fail" response violated. This tests their ability to police the boundary of the concept.

  ### 5. Framing Device: Symmetry and Indexicality
  **Time Allocation:** 10–25 Minutes
  **Objective:** Reframe Intertemporal Neutrality not as a default, but as a symmetry principle that faces a unique metaphysical challenge.

  *   **The Symmetry Principle:** Present **Intertemporal Neutrality** as analogous to **Spatial Neutrality**.
      *   *Spatial:* My well-being counts no more than yours simply because I am *here* and you are *there*.
      *   *Temporal:* My well-being counts no more than yours simply because I am *now* and you are *then*.
  *   **The Structural Break (Indexicality):** Guide the discussion to identify where the analogy breaks.
      *   *Spatial:* I can physically move to your location. "Here" is a coordinate anyone can occupy.
      *   *Temporal:* I cannot move to "then." "Now" is indexical and fixed for the agent. I am essentially trapped in the present.
  *   **What This Illuminates:** It clarifies why PTP feels intuitive. It is not necessarily greed; it is a reflection of the agent's metaphysical confinement to the present moment. It makes the defense of Neutrality a heavier lift than Spatial Neutrality.
  *   **What This Risks Distorting:** It risks psychologizing the norm. Just because I *am* indexically stuck in the present doesn't mean I *ought* to value the present more. Ensure participants do not conflate the *phenomenology* of time (being stuck in the now) with the *normativity* of time (valuing the now more). Explicitly warn against deriving an "ought" from this indexical "is."

  ### 6. Explicit Omissions and Acknowledgement
  **Time Allocation:** 5 Minutes (Closing)
  **Objective:** Define the boundaries of the workshop to prevent scope creep and acknowledge limitations.

  *   **Statement of Omission:** Explicitly state that this workshop has bracketed two major areas of the literature:
      1.  **Infinite Horizons & Aggregation:** We are not addressing how to sum welfare over infinite future generations (the "Repugnant Conclusion" territory).
      2.  **Social Choice & Non-Identity:** We are not addressing cases where present choices change *who* exists in the future (the Non-Identity Problem).
  *   **Rationale:** Acknowledge that these frameworks often dissolve PTP into problems of identity or mathematical convergence. State that today's goal was to isolate the *core normative intuition* of PTP before complicating it with population ethics or formal aggregation paradoxes.
  *   **Closing Instruction:** "Take the distinction secured today (Pure vs. Impure) and apply it to those broader problems in your own research, but do not let those broader problems obscure the basic normative question we tackled here."

  ---

  ### Workshop Timeline Summary
  *   **00–10:** Conceptual Dependency (Certainty vs. Risk)
  *   **10–25:** Framing Device (Symmetry vs. Indexicality)
  *   **25–50:** Carrying Scenario (Fixed Welfare Allocation) & Misconception Interception
  *   **50–65:** Open Discussion (Synthesizing Framing and Scenario)
  *   **65–75:** Diagnostic Exercise & Closing Omissions
