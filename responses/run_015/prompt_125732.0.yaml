answer: |-
  No dungeon dark, but a luminous tower,
  Where glass replaces iron, stone, and shell.
  Shadows lose privilege to hide or dwell,
  And bodies stand exposed to central power.
  Visibility flows through every hour,
  Isolating each subject in his cell.
  Where every move the visible must tell,
  Readable flesh where light and shadow cower.

  No scaffold waits to strike the body down,
  But fills the file where every name is claimed;
  The gaze constructs the case it comes to face.
  The norm is not a standard previously known,
  But generates the deviant it has named;
  The watched become the wardens of the trace.
