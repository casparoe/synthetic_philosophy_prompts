  Check: Glyph: open-a + n-tail. Method: gestalt context. Nearby worlds: dry board (gap stays open → essentialist wins), wet ink (smudge closes → cluster wins). Verdicts split on isolation. Essentialist attacks by cropping the 'n'; without the neighbour, the counter vanishes, proving it lacks intrinsic 'a'-ness. The working feature is the *relation*, not the shape. Remove the 'n' tail? It's dead letter. Essentialist calls it a category error; functionalist says reading is social, not solipsistic.
