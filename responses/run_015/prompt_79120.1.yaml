answer: |-
  ### Memorandum: Indicator Vetting Procedure (Draft v0.9)

  **To:** University Outcomes Committee & Provost's Office
  **From:** Committee Chair
  **Subject:** Pre-Adoption Checklist for Performance Indicators

  **Context:**
  We are attempting to move from raw output counts to an outcomes dashboard. The Provost's office acknowledges Goodhart's Law rhetorically but lacks a procedural mechanism to enforce it. This checklist operationalizes the four-category taxonomy of Goodhart effects (Garrabrant/Manheim) to vet proposed indicators.

  **Note on Consensus vs. Contention:**
  Before applying this, the committee must agree on the state of the literature:
  *   **Settled Consensus:** All proxies degrade when optimized (Regressional); all proxies break at extreme values (Extremal); agents will optimize the proxy at the expense of the goal if incentives are strong enough (Adversarial). Causal links between administrative metrics and "quality" are almost always confounded (Causal).
  *   **Genuinely Contested:** The *magnitude* of these effects varies by context. For example, the degree to which Student Evaluation of Teaching (SET) scores correlate with actual learning vs. grade inflation is empirically contested (meta-analyses disagree). The stability of Journal Prestige rankings over decadal timeframes is also contested. This procedure does not resolve these empirical disputes; it flags them as risk factors.

  ---

  ### The Indicator Vetting Checklist

  Run each proposed indicator through these six steps in order. If an indicator fails a **Technical Check**, it requires mitigation or rejection. If it fails a **Judgment Call**, the Committee must vote on whether the risk is acceptable.

  #### 1. The Causal Decoupling Test (Causal Goodhart)
  *   **The Check:** Is there a direct causal mechanism where improving the *Goal* necessarily improves the *Metric*, or can the *Metric* rise while the *Goal* falls?
  *   **Failure Mode:** The metric is a side-effect or a confounder, not a consequence of quality.
  *   **Clear Fail:** Evidence exists that the metric can be maximized while the underlying quality decreases (e.g., cutting corners to speed up production).
  *   **Type:** **Technical Check** (Requires evidence review).
  *   **Inconclusive Zone:** If literature is mixed (e.g., SETs), mark as **High Risk**. Do not pass unless accompanied by a secondary validation metric.

  #### 2. The Noise Floor Test (Regressional Goodhart)
  *   **The Check:** What is the signal-to-noise ratio? As we push for higher performance, does the correlation between the metric and the goal attenuate?
  *   **Failure Mode:** The metric is too noisy to distinguish genuine improvement from random variance, leading to false positives/negatives.
  *   **Clear Fail:** The metric's variance is dominated by external factors (cohort size, funding cycles, reviewer luck) rather than agent effort/quality.
  *   **Type:** **Technical Check** (Statistical audit).
  *   **Inconclusive Zone:** If historical data is unavailable to calculate variance, the indicator cannot be adopted for *summative* decisions (tenure/pay). It may only be used for *formative* feedback.

  #### 3. The Tail Regime Test (Extremal Goodhart)
  *   **The Check:** Do the top 5% of scores represent the same phenomenon as the middle 50%?
  *   **Failure Mode:** Different rules apply at the extremes. High scores indicate gaming or a different underlying regime, not "more" of the goal.
  *   **Clear Fail:** Achieving a score in the 95th percentile requires behavior that is neutral or negative for the goal (e.g., grade inflation to get perfect teaching scores).
  *   **Type:** **Technical Check** (Distribution analysis).
  *   **Inconclusive Zone:** If the distribution is unknown, cap the metric's weight. Do not allow it to be a "knockout" criterion.

  #### 4. The Gaming Cost Test (Adversarial Goodhart)
  *   **The Check:** Is the cost (time/risk/ethics) of gaming the metric lower than the cost of actually improving the goal?
  *   **Failure Mode:** Rational agents will game the metric because it is the efficient path to reward.
  *   **Clear Fail:** There is a known, low-effort method to inflate the metric without improving quality (e.g., citation rings, "candy" in classrooms).
  *   **Type:** **Technical Check** (Incentive modeling).
  *   **Inconclusive Zone:** If gaming is possible but detectable, adoption requires an audit trail. If gaming is undetectable, reject.

  #### 5. The "University We Want" Test (Normative Alignment)
  *   **The Check:** If every department optimized this metric perfectly, would we recognize the university as a place we want to work/study?
  *   **Failure Mode:** The metric encourages behavior that is technically efficient but culturally or ethically corrosive.
  *   **Clear Fail:** Optimization leads to a violation of core values (e.g., equity, academic freedom, collegiality).
  *   **Type:** **Judgment Call** (Committee Vote).
  *   **Inconclusive Zone:** If the committee is split >40%, the metric requires a sunset clause (see Step 6).

  #### 6. The Sunset & Review Clause (Procedural Safeguard)
  *   **The Check:** Is there a predefined date and method to kill or recalibrate the metric?
  *   **Failure Mode:** The metric becomes entrenched ("Zombie Metric") long after its validity has degraded.
  *   **Clear Fail:** No budget or committee time is allocated to review the metric's validity after 3 years.
  *   **Type:** **Procedural Requirement** (Mandatory).
  *   **Inconclusive Zone:** N/A. This must be binary. No sunset = No adoption.

  ---

  ### Application to Candidate Indicators

  Here is the result of running the three proposed candidates through the checklist.

  #### Candidate 1: Publications Weighted by Journal Prestige
  *   **1. Causal:** **Fail (High Risk).** Prestige is a proxy for selectivity, not necessarily truth or impact. High prestige can coexist with low reproducibility.
  *   **2. Noise:** **Pass.** Bibliometric data is low-noise and standardized.
  *   **3. Tail:** **Fail.** Top 1% of publications often rely on network effects or "hot" topics rather than pure quality.
  *   **4. Gaming:** **Fail.** Salami-slicing, citation clubs, and special issue farming are well-documented and low-cost.
  *   **5. Normative:** **Fail.** Optimization encourages risk-aversion and conservatism in research topics.
  *   **6. Sunset:** **Pass** (Easy to track).
  *   **Verdict:** **REJECT.** Fails on Causal, Tail, Gaming, and Normative grounds. It is a stable number, but it measures the wrong thing stably.

  #### Candidate 2: Mean Student Evaluation Scores (SETs)
  *   **1. Causal:** **Inconclusive (High Risk).** Literature is contested on correlation with learning. Strong correlation with grade expectation.
  *   **2. Noise:** **Fail.** Low response rates and cohort variance create high noise floors for individual instructors.
  *   **3. Tail:** **Fail.** Scores >4.8/5.0 strongly correlate with grade inflation (Extremal regime shift).
  *   **4. Gaming:** **Fail.** Low cost to game (reduce workload, increase entertainment value).
  *   **5. Normative:** **Inconclusive.** Committee split: Humanists view this as consumerism; Provost views it as accountability.
  *   **6. Sunset:** **Pass.**
  *   **Verdict:** **REJECT for Summative Use.** May be used for *formative* feedback only, provided response rates are >70%.

  #### Candidate 3: Peer Classroom-Observation Scheme
  *   **1. Causal:** **Pass.** Direct observation of teaching acts has the strongest causal link to teaching quality.
  *   **2. Noise:** **Inconclusive.** Subjectivity introduces noise, but calibration training can reduce it. (Requires budget for training).
  *   **3. Tail:** **Pass.** Qualitative rubrics do not suffer from "score inflation" in the same way numeric scales do.
  *   **4. Gaming:** **Pass (Conditional).** Harder to game than SETs, but requires collusion between observer and observee. Mitigation: Randomized observer assignment.
  *   **5. Normative:** **Pass.** Encourages collegiality and pedagogical reflection.
  *   **6. Sunset:** **Pass.**
  *   **Verdict:** **CONDITIONAL APPROVAL.**

  ---

  ### The Unpleasant Truth (For the Chair)

  **Candidate 3 (Peer Observation) passes the procedure, but you are not going to like the result.**

  The procedure validates Peer Observation as the only metric robust against Goodhart effects. However, the **Noise Floor Test** and **Gaming Cost Test** reveal that for this to work, it cannot be a "dashboard number." It requires:
  1.  Significant budget for observer training (to reduce subjectivity/noise).
  2.  A culture of trust that cannot be mandated by policy.
  3.  Time: It cannot be automated.

  **Why you won't like this:** You wanted a *dashboard* to replace the *numbers*. This procedure tells you that valid outcomes measurement is inherently *labor-intensive and qualitative*. It shifts the burden from the Provost's data team to the faculty's time. The Provost will sign off because it looks rigorous; the Humanists will sign off because it's qualitative; but you are left managing a resource-heavy process that cannot be reduced to the clean red/green lights you hoped for. The procedure proves that **measurement integrity is inversely proportional to automation.**

  ### What This Procedure Cannot Settlement

  Be explicit with the Provost: This checklist prevents *bad* metrics, but it does not solve **Resource Allocation**.
  1.  **Trade-offs:** The procedure might validate two metrics that compete for the same faculty time (e.g., Research vs. Observation). It cannot tell you which to prioritize.
  2.  **Equity vs. Efficiency:** A metric might pass the Technical checks but still disproportionately burden junior faculty or caregivers. The **Normative Test** catches this only if the Committee recognizes it.
  3.  **The "True" Goal:** We still do not agree on what "Teaching Quality" *is*. The procedure ensures we measure our definition consistently, but it cannot resolve the philosophical disagreement between "knowledge transmission" and "student transformation."

  **Recommendation:** Adopt Candidate 3 with a mandatory 3-year sunset (Step 6), budgeted explicitly for observer training. Do not attempt to convert the output into a single numeric score for the dashboard; report it as a qualitative assurance metric.
