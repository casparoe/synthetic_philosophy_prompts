  To: The Committee
  From: [Your Name]
  Date: 24 May 2024
  Subject: Recommendation Regarding Squirrel Reintroduction Proposal

  I recommend we agree to the project in principle, but strictly conditional on enhanced welfare protocols and independent oversight.

  Our charity's purpose is conserving ancient woodland. Allowing the local extinction of native red squirrels when intervention could prevent it contradicts our mission. The irreversible loss of a native species from its historical range is a genuine ecological harm. However, I take seriously the objection that paying to kill healthy sentient animals is 'gardening with corpses'. This view holds that conservation should not mandate killing individuals who are merely living according to their nature. It is a principled stand against instrumentalising life.

  The core ethical question troubling many of us is whether we value red interests above grey interests. I argue the justification does not rest on grey suffering mattering less *per se*. A grey squirrel's pain is morally equivalent to a red's; species origin does not negate sentience. To claim otherwise would be speciesism. Rather, the case rests on ecological integrity and historical correction. Grey squirrels are an invasive species introduced by human error; their dominance suppresses the native biodiversity our woodland evolved to support. We are not choosing species based on intrinsic worth, but prioritising the restoration of a damaged ecosystem over the lives of the agents causing that damage. It is a tragic necessity, not a hierarchy of value.

  Nevertheless, causing suffering requires strict justification. Therefore, approval must be conditional:
  1. Controllers must use only humane, industry-accredited methods.
  2. An independent animal welfare officer must monitor operations.
  3. The cull zone must be limited strictly to areas essential for red survival.
  4. We must review the necessity of lethal control annually, pausing if non-lethal alternatives become viable.

  This approach acknowledges that while individual suffering is bad, the permanent loss of native ecological function is worse. It respects the grey squirrels as sentient beings whose deaths must be minimised and dignified, not as mere pests. It also respects our donors' intent to conserve natural heritage.

  We cannot have both a purely hands-off approach and a restored native woodland. By accepting this burden responsibly, we honour both our compassion for individual animals and our duty to the natural world we exist to protect. I urge us to unite behind this conditional path.
