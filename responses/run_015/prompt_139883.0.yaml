answer: |-
  The number 207 bus smelled of wet wool and diesel. Nadia pressed her forehead against the cold glass, watching the streetlights smear into orange streaks. In her pocket, her phone buzzed. *Dad:* *Have you thought about the open day?* She didn't answer. She was going to the clinic to find out if there was an 'she' capable of answering.

  The clinic was on the second floor of a generic office block near the station, sandwiched between a tax advisor and a vacancy. Inside, it was beige and quiet. The technician, a man with a tie patterned like circuit boards, called himself Julian. He didn't wear a lab coat; he wore a polo shirt with the company logo, *NeuroSight*, embroidered over the heart.

  "It's not about changing the output, Nadia," Julian said, tapping a tablet. His voice had the smooth, rounded edges of a customer service recording. "Think of it as a transparency window. We're simply dialling down the compression. Usually, your brain gives you a summary—a user interface. Icons. We're going to show you the voltage behind the icons."

  He fitted the headset over her temples. It hummed, a low vibration that felt like teeth buzzing. "You retain executive control, of course. You're still the signatory. We just let you watch the paperwork being processed."

  The screen in front of her lit up. It wasn't a video of her brain; it was a abstraction, a flowing topography of light. Colours surged where emotions spiked. When Julian asked her to lift her hand, she watched a cluster of amber nodes flare in the lower left quadrant. The hand rose. But on the screen, the amber flare had peaked and begun to dissipate a fraction of a second before her skin registered the command to move. She watched herself decide. The lag was tiny, invisible to anyone without the feed, but to Nadia, it looked like watching a dubbed film where the audio didn't quite match the lip movement.

  "See?" Julian said. "Sub-personal negotiation. The coalition forms, then you get the press release. But you can still veto."

  "Can I?" Nadia asked. Her voice sounded thin.

  "The data suggests veto capacity remains intact. But most clients find the transparency reduces anxiety. Knowing the machinery works helps you trust the product."

  She left the clinic with a receipt and a headache. The bus ride home was quieter. She looked at her hands. They felt like attachments.

  The next morning, she went to the swimming pool at six. It was her ritual. She was good at it—smooth, efficient, her body moving without thought. She dived in, the cold water shocking the air from her lungs. Usually, the stroke was a single verb: *pull*. Today, it fractured.

  As she reached for the water, she remembered the amber nodes. She wondered which subsystem was firing now. The lats? The triceps? The desire to reach the wall? The compression had been load-bearing, she realised. The ignorance of the mechanics was what allowed the motion. By seeing the voltage, she had lost the icon. Her timing slipped. She swallowed water, coughing, sinking until her feet found the tiled floor. She stood there, chest heaving, chlorine burning her nose, feeling like a puppet whose strings had been briefly shown to her, tangling in the dark.

  Later, in the sixth-form common room, the radiators clanked like dying engines. Her phone lay on the table. The message from Chloe was three days old. *Why haven't you told him?*

  Nadia had slept with Chloe's ex. She had promised to tell Chloe. She had promised her father she would attend the open day. Both decisions felt like things that had already happened inside her, waiting for the press release.

  She picked up the phone. She opened the thread. The cursor blinked, a steady, rhythmic pulse. She thought about the amber nodes. Was there a cluster forming now? A coalition of guilt pushing her thumb toward the screen? Or a coalition of self-preservation holding it back?

  If she sent it, would it be because she chose to, or because the negotiation had settled? If she didn't send it, was that a veto, or just a different outcome settling earlier?

  She looked at her thumb hovering over the glass. It trembled, slightly. She watched the tremor. She waited for the feeling of will to catch up with the motion, for the audio to sync with the lips. The radiators clanked. A girl across the room laughed. The cursor blinked.

  Her thumb descended.

  ***

  **Author's Note**

  I prioritised the third reading (infinite regress) while trying to keep the first (no agency) equally viable. The aim was to make the "transparency" feel like just another layer of interface rather than a view of the truth. The technician's jargon ("You're still the signatory") is deliberately commercialised to undermine its reliability, suggesting the "veto" might just be another icon on the dashboard.

  The story leaks towards the second reading (compressed but faithful) in the swimming pool scene. If the knowledge of the mechanics causes her to fail, it implies the mechanics are real and impactful, not just a narrative construct. A reader could argue that because the information *changed* her performance, the information must be valid, thereby confirming the dashboard is faithful rather than deceptive. Additionally, the ending—where she actually sends the text—could be read as a reclamation of agency (she acted despite the doubt), which undermines the harder determinist reading. The ambiguity rests on whether the tremor in her thumb was the cause of the action or merely its shadow.
