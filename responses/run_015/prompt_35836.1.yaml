          *   At the moment of choice in Newcomb's, one-boxing *looks* like it costs you $1k (if the box is empty, you get 0 vs 1k; if full, you get 1M vs 1M+1k). A CDT agent (aligned with View 5) says "Take both." An FDT/EDT agent (aligned with View 1) says "Take one."
