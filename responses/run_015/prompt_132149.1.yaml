answer: |-
  This configuration does not have a single, universally settled label in the literature, though it is often discussed under the umbrella of "moral Gettier cases" or "deviant causal chains in motivation." To capture the specific nuance you are describing—where the action aligns with the right-making feature, but the agent's cognitive grip on that feature is defective—I will coin the term **"Fragile Moral Alignment."**

  Here is the carving of the distinction, the assessment of moral worth, and the boundary conditions.

  ### 1. The Carving: One Defect or Two?

  While both cases result in the same structural outcome (right action, true belief, defective route), they represent **two distinct epistemic defects** that map onto different components of moral agency.

  **Case 1 is Evidential Drift.**
  The agent's belief about the *specific facts* triggering the action is false (the email was misread), even though the *general moral fact* is true (the process was rigged). The agent is sensitive to the concept of "rigging," but insensitive to the *actual instance* of rigging that exists. She is tracking a phantom violation while accidentally stepping on a real one.
  *   **The Defect:** Perceptual/Evidential. The link between the world and the belief is broken.

  **Case 2 is Conceptual Opacity.**
  The agent's belief about the facts is true, and the general moral fact is true. However, she lacks a grasp of the *principle* connecting the two. She holds the conclusion without the reasoning. She is outsourcing her moral understanding.
  *   **The Defect:** Justificatory/Understanding. The link between the belief and the rationale is broken.

  **Are they the same genus?**
  Yes. Both are instances of **Epistemic Decoupling.** In both, the agent's psychology is decoupled from the truth in a way that makes the alignment accidental rather than robust. However, they should be treated as separate species because they threaten moral worth in different ways. Evidential Drift threatens the agent's *attention* to reality; Conceptual Opacity threatens the agent's *autonomy* and *understanding*.

  ### 2. Moral Worth and the "Because" Requirement

  The standard requirement is that an agent acts *because* the action is right. This implies a non-accidental causal connection between the right-making feature and the motivation.

  **Does Fragile Moral Alignment meet this requirement?**
  Strictly speaking, **no.** In both cases, the action is not caused by the right-making feature *as understood by the agent.*
  *   In Case 1, the action is caused by the *email*, not the rigging. The rigging is coincidental to the motivation.
  *   In Case 2, the action is caused by *trust in a friend*, not the moral force of the precedent.

  **Does this remove credit entirely?**
  It depends on whether you view moral worth as a binary switch (knowledge or nothing) or a gradient (sensitivity and stability).
  *   **The Binary View:** If moral worth requires moral knowledge, credit is **removed entirely.** The agent is in a state of moral luck; they did the right thing, but they did not do it *virtuously.*
  *   **The Gradient View (Recommended):** Credit is **significantly reduced but not zero.** Why? Because the agent is still *oriented* toward the right value. The department chair cares about procedural integrity; the tenant leader cares about collective welfare. They are not acting from self-interest or malice. They possess the right *desires*, even if their *cognition* is flawed.

  **The Verdict:** The breakage reduces credit because moral worth requires a degree of **modal stability.** A morally worthy agent should do the right thing not just in this world, but in nearby possible worlds where the evidence looks slightly different. In your cases, if the world shifts slightly (the email changes, the friend gives different advice), the agent fails. This fragility indicates a lack of full virtue.

  ### 3. Boundary Cases: Harmless vs. Fatal Breakage

  The boundary between "Fragile Alignment" (reduced credit) and "Accidental Rightness" (no credit) is determined by **Counterfactual Robustness.** Ask: *If the defective element were removed, would the agent still find the right reason?*

  **Boundary Case A: Harmless Breakage (Credit Retained)**
  *   *Scenario:* The department chair misreads the email date, but the email content clearly describes the actual rigging that exists.
  *   *Analysis:* The error is trivial. In nearby possible worlds where she reads the date correctly, she still blocks the hire for the right reason. The breakage does not affect the causal chain of motivation.
  *   *Result:* The alignment is not fragile. Moral worth remains intact.

  **Boundary Case B: Fatal Breakage (Credit Removed)**
  *   *Scenario:* The department chair blocks the hire because she dislikes the candidate's politics, but she justifies it to herself (and others) by citing the procedural rigging, which happens to be real.
  *   *Analysis:* Here, the right-making feature (rigging) plays no role in the motivation. It is merely a post-hoc rationalization. If the rigging didn't exist, she would still block the hire.
  *   *Result:* This is not Fragile Alignment; this is **Moral Luck.** Credit is zero.

  **Boundary Case C: The Middle Ground (Your Cases)**
  *   *Scenario:* Your Case 1 and 2.
  *   *Analysis:* The agent *would not* have acted if the specific defective evidence were absent, yet the action *is* objectively right. The motivation is tethered to the right value, but the tether is frayed.
  *   *Result:* Partial credit. The agent is a "novice" or "imperfect" moral agent, not a fully virtuous one.

  ### 4. Summary Definition

  **Term:** **Fragile Moral Alignment**

  **Definition:** A state in which an agent performs a right action motivated by a belief that corresponds to the right-making feature, but where the epistemic route from the feature to the belief is defective (due to evidential error or lack of understanding), rendering the motivation counterfactually unstable.

  **Key Diagnostic:** To test for Fragile Moral Alignment, vary the defective evidence in nearby possible worlds.
  *   If the agent stops doing the right action when the defective evidence changes (even if the moral fact remains), the alignment is **Fragile.**
  *   If the agent continues doing the right action by finding the real reason, the alignment is **Robust.**

  **Moral Implication:** Fragile Moral Alignment warrants praise for the agent's *orientation* (they care about the right things) but withholds full praise for their *character* (they lack the competence or knowledge to reliably enact that care). They are morally lucky, but not morally blind.
