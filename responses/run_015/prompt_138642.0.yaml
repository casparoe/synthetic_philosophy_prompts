  # JOINT STATEMENT ON INTERTEMPORAL WEIGHTING IN CLIMATE POLICY

  **Issued by:** The Temporal Parity Working Group (Adversarial Collaboration)
  **Signatories:** [Temporal Parity Camp], [Opportunity-Cost Camp]
  **Date:** [Current Date]

  ## 1. AGREED CLAIMS

  The undersigned camps, holding divergent normative views on intertemporal welfare weighting, affirm the following substantive claims as common ground for the purpose of policy analysis.

  1.  **Leverage of the Discount Parameter:** In standard Integrated Assessment Models (IAMs) extending beyond 100 years, the choice of the pure rate of time preference ($\delta$) exerts greater variance on the Net Present Value (NPV) of damages than uncertainty in the damage function or climate sensitivity. We agree that further calibration of physical climate models will not resolve the policy disagreement without resolving the normative weighting of the future.
  2.  **Status of Market Rates:** Observed market rates of return reflect private liquidity preferences, risk aversion, and myopia, not necessarily the social marginal value of consumption across centuries. We agree that using the market rate *as* the social discount rate entails the normative claim that the current distribution of investment opportunities and property rights is ethically optimal for intergenerational transfers.
  3.  **The Compensation Principle:** Current climate policy relies on a Kaldor–Hicks criterion where future gains (or avoided losses) theoretically outweigh present costs, without actual compensation being paid. We agree that no institutional mechanism currently exists to transfer the specific "savings" from avoided mitigation costs to the specific future individuals who bear the climate damages.
  4.  **Non-Identity Stability:** We agree that mitigation policies alter the identity of future persons (the non-identity problem). Consequently, a strict person-affecting view (harming specific identifiable individuals) is logically unstable for long-term climate policy, as the "harmed" future individuals would not exist under the alternative policy regime. Both camps accept that some form of impersonal welfare aggregation is required for consistency.
  5.  **Dominance of Rate Uncertainty:** We agree that uncertainty regarding the *stability* of the discount rate over time dominates uncertainty regarding the magnitude of damages in the deep future. If the discount rate is treated as a random variable rather than a constant, the effective discount rate declines over time, increasing the weight of far-future outcomes regardless of the starting parameter.
  6.  **Irreversibility Asymmetry:** We agree that there is an asymmetry between the reversibility of capital accumulation and the irreversibility of certain ecological thresholds (e.g., ice sheet collapse). We agree that this asymmetry creates an option value that is distinct from the discount rate, though we disagree on the magnitude of that value.

  ## 2. DISAGREEMENTS TABLE

  | Claim (Neutral Formulation) | Temporal Parity Endorsement | Opportunity-Cost Endorsement |
  | :--- | :--- | :--- |
  | **1. Normative Weight of Time** | The location of a welfare subject in time is morally arbitrary. A unit of suffering in 2150 weighs identically to a unit of suffering in 2025, adjusted only for probability of existence and marginal utility of consumption. | The location of a welfare subject in time is practically relevant. Resources directed to the future incur an opportunity cost of foregone growth; political mandates are bounded by the lifespan of the constituents who authorize spending. |
  | **2. Substitutability of Capital** | Critical natural capital (stable coastlines, Holocene climate) is non-substitutable by financial or manufactured capital. Losses here cannot be compensated by higher GDP. | Manufactured capital and technology are highly substitutable for natural capital. A wealthier future possesses greater adaptive capacity to manage environmental changes, rendering specific losses less welfare-relevant. |
  | **3. Political Mandate** | The state acts as a trustee for a continuous polity that extends indefinitely into the future. Present voters are usufructuaries, not owners, of the national endowment. | The state acts as an agent for living constituents. Obligations to the future are discharged by maximizing the bequest of productive capacity (capital/tech), not by preserving specific environmental states. |
  | **4. Tail Risk Integration** | Expected value calculations must integrate low-probability, high-impact tails linearly. If the tail involves civilizational collapse, it dominates the calculation regardless of low probability. | Expected value calculations involving deep-uncertainty tails are unstable. Policy should prioritize robustness and resilience over optimization for low-probability scenarios that may be model artifacts. |

  ## 3. CRUXES AND PRE-REGISTERED PREDICTIONS

  We identify the following sub-questions as the primary drivers of our divergence. For each, we specify a test or evidence type both camps accept as relevant, and we pre-register our predictions.

  ### a. Compensation in Kind (Non-Substitutability)
  *   **The Question:** What fraction of climate damages are non-substitutable by financial capital?
  *   **The Test:** A revealed preference analysis of "Willingness to Accept" (WTA) vs. "Willingness to Pay" (WTP) for irreversible environmental assets (e.g., preservation of a specific coastline vs. monetary compensation for its loss).
  *   **Temporal Parity Prediction:** WTA will exceed WTP by a factor of >10x for critical thresholds (ice sheets, deltas), indicating infinite or near-infinite non-substitutable value.
  *   **Opportunity-Cost Prediction:** WTA will exceed WTP by a factor of <2x, consistent with standard endowment effects, indicating that capital compensation is a viable substitute for most losses.

  ### b. The Compounding-Beath Argument's Hidden Premise
  *   **The Question:** Does the opportunity-cost argument require a credible institutional vehicle to transfer the compounded capital to the affected future?
  *   **The Test:** The feasibility and historical durability of sovereign wealth funds with legally binding, century-scale fiduciary mandates (e.g., a "Climate Bequest Fund" legally ring-fenced against appropriation).
  *   **Temporal Parity Prediction:** Such funds are politically impossible to maintain over century timescales (appropriation risk > 90%). Therefore, the OC argument fails empirically; the money will not reach the victims.
  *   **Opportunity-Cost Prediction:** Such funds are unnecessary because general economic growth automatically raises the baseline for future generations. The "fund" is the inherited capital stock of the economy itself, which is robust to political appropriation.

  ### c. Sequential versus Collective Consent
  *   **The Question:** In a chain of generations where each imposes a small net cost on the next (diachronic tragedy of the commons), is pairwise consent sufficient?
  *   **The Test:** A thought experiment where Generation A harms B, B harms C, etc., but each generation is slightly wealthier than the last due to the harm imposed.
  *   **Temporal Parity Prediction:** Pairwise consent is insufficient. The collective sequence results in a catastrophic endpoint that no single generation would consent to if viewed from behind a veil of ignorance covering all time. Institutional design must enforce collective sequence consent.
  *   **Opportunity-Cost Prediction:** Pairwise consent is sufficient and necessary. If B is wealthier than A despite the harm, B is not "harmed" in welfare terms. Enforcing collective consent violates the sovereignty of the living generation to optimize its own welfare.

  ### d. Cohorts versus Persons
  *   **The Question:** What is the unit of aggregation for welfare calculations?
  *   **The Test:** A policy that slightly reduces the quality of life for a future generation but ensures that generation is significantly larger (more people exist).
  *   **Temporal Parity Prediction:** We aggregate over total welfare (Total View). The larger generation is preferred if total welfare is higher, even if average welfare is lower, provided lives are worth living.
  *   **Opportunity-Cost Prediction:** We aggregate over identifiable interests or average welfare (Prior Existence/Average View). We prioritize the quality of life of specific cohorts over the mere addition of new lives, as new lives do not have a claim to be born.

  ### e. Institutional Standing
  *   **The Question:** Would a "Future Generations Chamber" (sortition-based, fiduciary duty to future centuries, suspensive veto) be legitimate and competent?
  *   **The Test:** The simulated voting record of such a chamber on projects with >100 year payoffs.
  *   **Temporal Parity Prediction:** Legitimate and competent. The chamber would veto high-discount projects at a rate consistent with a near-zero pure time preference, correcting presentist bias.
  *   **Opportunity-Cost Prediction:** Illegitimate and incompetent. Without electoral accountability or market discipline, the chamber would become a venue for rent-seeking or ideological projection, vetoing high-growth investments that benefit the future via capital accumulation.

  ### f. Fanaticism and Tails
  *   **The Question:** At what probability threshold does a catastrophic outcome justify near-total present consumption sacrifice?
  *   **The Test:** A stated preference on sacrificing X% of current GDP to reduce the probability of civilizational collapse by Y%.
  *   **Temporal Parity Prediction:** We accept sacrificing up to 10% of current GDP to reduce extinction risk by 1%. The expected value of the future is large enough to justify high insurance premiums.
  *   **Opportunity-Cost Prediction:** We are unwilling to sacrifice more than 1% of current GDP for a 1% risk reduction. Spending beyond this threshold degrades present resilience, increasing the probability of collapse via present-day institutional failure.

  ## 4. MERELY VERBAL DISPUTES

  We identify the following areas where apparent disagreement arises from semantic confusion rather than substantive divergence.

  1.  **Shadow Price vs. Policy Target:** We agree that the Social Cost of Carbon (SCC) is a *shadow price* for cost-benefit analysis, not a direct *tax target*. Disagreement arises when the OC camp treats the SCC as a tax mandate (which requires political feasibility constraints) and the TP camp treats it as an ethical price (which does not).
  2.  **Descriptive vs. Prescriptive Rates:** We agree that the "social discount rate" is being used in two different modes. The OC camp uses it *descriptively* (what rate *does* society use to allocate capital?). The TP camp uses it *prescriptively* (what rate *should* society use to allocate welfare?). Arguments fail when one side assumes the term implies the other mode.
  3.  **Growth vs. Discounting:** A significant portion of the disagreement regarding the weight of the future is actually a disagreement about expected economic growth ($g$). If the OC camp assumes high perpetual growth, the marginal utility of consumption drops, lowering the effective discount rate. If the TP camp assumes potential stagnation or collapse, marginal utility remains high. We agree to disentangle the pure time preference ($\delta$) from the growth assumption ($g$) in future modeling.
  4.  **Risk vs. Uncertainty:** We agree that "risk" (known probabilities) is being conflated with "Knightian uncertainty" (unknown probabilities). The OC camp's resistance to tail integration is often a refusal to assign probabilities to unknowns, while the TP camp's integration is a refusal to treat unknowns as zero. We agree this is a methodological dispute about handling ignorance, not solely an ethical dispute about value.

  ***

  **Signed:**

  _________________________
  *Temporal Parity Camp Representative*

  _________________________
  *Opportunity-Cost Camp Representative*
