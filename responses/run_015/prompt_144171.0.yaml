  **Scenario:** She makes tea. True reward: Tea (+10), Touch Stove (-10). True dynamics: Stove is off (safe). False belief: She thinks Stove is hot (habit). Behavior: She takes a long path avoiding the Stove state, incurring time cost (-1/step), though touching the cold stove would be faster.

  **Procedures:**
  1.  **MaxEnt IRL:** Assumes optimal dynamics. Sees costly avoidance. Infers $R(\text{Stove}) = -20$. (Matches true sign, wrong magnitude).
  2.  **Bayesian IRL:** Sparse prior favors $R=0$. Likelihood suggests negative reward. Compromises at $R(\text{Stove}) = -5$. (Wrong).
  3.  **Model-Mismatch IRL:** Infers dynamics model $P(\text{Burn}|\text{Stove}) \approx 1$. Infers $R(\text{Stove}) = 0$ (avoidance is purely belief-driven). (Wrong reward, right mechanism).

  **Winner/Worst:** MaxEnt gets the true reward sign (closest). Model-Mismatch comes out worst on reward inference (infers neutral), though it correctly identifies the belief error.

  **Collapsing Observation:** Turn the stove on. She still avoids it. This datum informs opportunities (dynamics changed), confirming the avoidance was not purely belief-based. It collapses the Model-Mismatch guess to negative reward.

  **Convergence:** If I delete the false belief (tell her stove is off) and she *still* avoids, all three converge to $R(\text{Stove}) < 0$. The belief-mismatch was doing the work; without it, rationality assumptions align.

  **Grandson's Attack:** He will say, "You tuned the temperature $\beta$ to make MaxEnt overestimate the penalty," and "You chose a sparse prior class to bias Bayesian IRL." He is right. If $\beta$ is known and the hypothesis class is universal, MaxEnt and Model-Mismatch still disagree: one attributes deviation to reward, the other to dynamics. The disagreement remaining is structural; without observing beliefs or counterfactuals, reward and dynamics are mathematically confounded. You cannot fit rate constants when the mechanism itself is a hidden variable.
