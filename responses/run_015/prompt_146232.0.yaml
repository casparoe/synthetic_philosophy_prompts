answer: |-
  **Exam Question**

  In the dialogue, the Tortoise grants Achilles every premise and every conditional premise Achilles adds, yet declines to accept the conclusion, apparently without contradicting himself, and the sequence of added conditionals never terminates. Consider two proposed escapes from this regress. First, the **closure escape**: the Tortoise's commitments are already jointly inconsistent with the denial of the conclusion, so he is committed to the conclusion already without performing an act of inference. Second, the **mechanism escape**: we simply install in the Tortoise a reliable disposition such that whenever premises are before his mind, he comes to accept the conclusion.

  Evaluate these escapes. Regarding closure: does establishing the entailment fact required to extract the conclusion merely relocate the regress to a meta-level, and does it matter if this reasoning is semantic rather than object-level? Regarding mechanism: distinguish between the Tortoise as having a performance deficit and the Tortoise as asking a normative question; which reading makes the dialogue a philosophical problem, and does a mechanism address it? Finally, consider the view that an argument for the reliability of a rule of inference which uses that rule is circular only in a benign way. Could such a justification satisfy the Tortoise on the normative reading, and is the Tortoise entitled to treat rule-circularity as a defect given that he is asking for a reason rather than a cause? Conclude by stating whether deduction requires justification, is unjustifiable in principle, or rests on a non-inferential entitlement.

  ***

  **Model Answer**

  The regress demonstrates that treating a rule of inference as an additional premise fails to compel conclusion acceptance. If every licence to infer must be stated as a truth-apt premise, reasoning collapses into an infinite list of conditionals. The two proposed escapes attempt to bypass this by either collapsing the steps into a static relation (closure) or bypassing justification entirely via causation (mechanism). However, both fail to address the normative core of the problem.

  The closure escape argues that inference is unnecessary because the premises already entail the conclusion. If the Tortoise accepts $A$ and $A \to Z$, he is logically committed to $Z$ regardless of whether he performs an act of detachment. This treats logical consequence as a static relation between propositions rather than a dynamic act of mind. However, this escape merely relocates the regress. For the Tortoise to recognize that he is committed to $Z$, he must establish the entailment fact: that $\{A, A \to Z\}$ entails $Z$. Establishing this fact is itself an exercise of deductive reasoning. If the Tortoise requires a justification for moving from premises to conclusion, he will equally require a justification for moving from premises to the *entailment fact*.

  Does it matter that this relocated reasoning is semantic or metalinguistic? No. The normative pressure remains identical. Whether the Tortoise is asked to infer $Z$ from $A$, or to infer "Z follows from A" from the meanings of the symbols, he is being asked to traverse a gap between acceptance of inputs and acceptance of outputs. If the original gap required a bridge, the meta-level gap requires one too. The closure escape assumes the Tortoise already possesses the logical knowledge that generates the regress, thereby begging the question. It explains why the conclusion is true given the premises, but not why the Tortoise is rationally compelled to accept it.

  The mechanism escape suggests installing a psychological disposition: when $A$ and $A \to Z$ are present, the Tortoise causally produces acceptance of $Z$. This successfully predicts behavior but fails to address the philosophical problem. This failure hinges on distinguishing two readings of the Tortoise. On the first reading, the Tortoise has a performance deficit; he is psychologically unable to make the move. A mechanism cures this. On the second reading, the Tortoise is asking a normative question: he grants the truth of the premises and the validity of the rule, but asks what *reason* he has to move. The dialogue is a philosophical problem only on the normative reading. If it were merely clinical, it would be a matter for psychology, not logic.

  Supplying a mechanism addresses the performance deficit but says nothing to the normative query. A cause is not a reason. Even if the Tortoise is causally determined to accept $Z$, he can still ask whether he *ought* to. The mechanism escape changes the subject from justification to explanation. It shows how inference happens, not why it is legitimate. Therefore, the mechanism escape fails to dissolve the regress because it ignores the normative force that the Tortoise demands.

  This leads to the rule-circular response. One might argue that justifying modus ponens using modus ponens is benignly circular. Such an argument can discriminate between trustworthy rules (like modus ponens) and untrustworthy rules (like inferring the antecedent from the consequent), because the latter cannot sustain a similar argument without collapse. However, could this satisfy the Tortoise on the normative reading? No. The Tortoise asks for a reason to adopt the rule. To answer "because the rule works" assumes the validity of the rule in the demonstration. For a skeptic questioning the authority of the rule, this is viciously circular.

  Is the Tortoise entitled to treat rule-circularity as a defect? Yes, because he is asking for a justification external to the practice. He wants a reason rather than a cause. A rule-circular argument provides a cause (a demonstration within the system) but not an external reason. However, this reveals that the Tortoise's demand is incoherent. There is no external standpoint from which to justify deduction. To reason is to use rules; one cannot validate the rules of reasoning without using them.

  Therefore, the correct conclusion is that deduction rests on a non-inferential entitlement. The regress arises from the mistaken view that rules of inference must be justified by arguments. Rules are constitutive of reasoning; they are the hinges upon which argument turns, not the levers moved by argument. We are entitled to use modus ponens not because we have proved it, but because possessing this entitlement is what makes us rational agents capable of proof. The Tortoise's demand for a justification presupposes the very rationality he claims to lack. Thus, deduction requires no justification because it is the framework within which justification occurs. The regress is dissolved not by solving the Tortoise's problem, but by recognizing that the problem itself relies on a category mistake regarding the status of logical rules.

  ***

  **Marking Scheme (25 Marks)**

  1.  **Analysis of Closure Escape (5 marks)**
      *   *Requirement:* Must identify that establishing the entailment fact requires reasoning itself, relocating the regress to the meta-level.
      *   *Typical Error:* Treating closure as a successful restatement of the premise/rule distinction without addressing the meta-entailment issue.

  2.  **Meta-Level Regress Nuance (5 marks)**
      *   *Requirement:* Must argue that shifting to semantic/metalinguistic reasoning does not solve the normative problem (the gap remains).
      *   *Typical Error:* Claiming the regress disappears because meta-level facts are "necessary truths" rather than analyzing the act of accessing them.

  3.  **Analysis of Mechanism Escape (5 marks)**
      *   *Requirement:* Must distinguish between the performance deficit (clinical) and normative (philosophical) readings of the Tortoise.
      *   *Typical Error:* Responding that mechanisms might misfire or fail reliability, rather than addressing the cause/reason distinction.

  4.  **Rule-Circularity Evaluation (5 marks)**
      *   *Requirement:* Must conclude that rule-circularity fails to satisfy the normative Tortoise because it begs the question against the skeptic.
      *   *Typical Error:* Arguing that rule-circularity is acceptable because "all justification is circular," without addressing the Tortoise's specific normative demand.

  5.  **Final Conclusion (5 marks)**
      *   *Requirement:* Must commit to a specific view (e.g., non-inferential entitlement/constitutive view) and explain why the demand for justification is misplaced.
      *   *Typical Error:* Hedging with "more work is needed" or concluding that deduction is unjustifiable without explaining the status of our current practice.

  ***

  **Examiner's Note**

  Answers in the 20–25 band differ from those in the 15–19 band on a single move: the recognition that the Tortoise's normative demand is constitutively incoherent. Competent answers (15–19) will correctly identify that both escapes fail and that rule-circularity is unsatisfying, but they often conclude by lamenting that justification is impossible or circular. First-class answers (20–25) go further to argue that the demand for justification presupposes the rules it questions, thereby dissolving the problem rather than merely accepting the impasse.
