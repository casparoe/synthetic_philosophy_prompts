answer: |-
  This is a classic metaphysical chestnut, famously analyzed by philosophers like Roberto Casati and Achille Varzi (who literally wrote a book called *Holes*). Your roommate is deploying a specific philosophical stance called **ontological eliminativism** (or reductionism), likely borrowed from a hardline interpretation of physics. You are defending **common-sense realism**.

  Here is the breakdown of what is actually happening, the verdict on who is right, and your script for dinner.

  ### 1. Brainstorming: What is the Disagreement Actually About?

  To figure out if this is substantive or verbal, we need to isolate the layers of the argument. There are three candidate disagreements here:

  *   **Candidate A: The Definition of "Exist."**
      Your roommate is using a "Fundamental Physical" definition of existence. To him, $X$ exists only if $X$ is a fundamental particle or field in the Standard Model. Since "hole" isn't in the Standard Model, it doesn't exist.
      You are using a "Macroscopic/Causal" definition of existence. To you, $X$ exists if $X$ has a location, properties, and causal power (like breaking your ankle).
      *If this is all it is, the dispute is merely verbal.* You are arguing over who gets to use the label "exist."

  *   **Candidate B: Ontological Dependence.**
      Your roommate thinks that because a hole *depends* on the cheese (no cheese, no hole), it isn't a "real thing." It's just a lack of cheese.
      You think dependence doesn't preclude existence. A smile depends on a face, but smiles are real. A surface depends on an object, but surfaces are real.
      *This is substantive.* It's a disagreement about whether dependent entities count as part of reality's furniture.

  *   **Candidate C: Explanatory Power.**
      Your roommate thinks "arrangement of cheese" explains everything. You think "hole" explains things better (e.g., "Why did the water flow there?" "Because of the hole").
      *This is substantive.* It's about which vocabulary best captures the structure of the world.

  ### 2. Verdict: Is it Substantive or Verbal?

  **Verdict: The dispute is Substantive.**

  Here is the test for telling them apart (borrowed from philosopher Ted Sider): A dispute is merely verbal if, once you clarify your definitions, the disagreement vanishes and you agree on all the underlying facts. A dispute is substantive if, even after clarifying definitions, you disagree on the *structure of reality*.

  You and your roommate agree on the physics (there is cheese, there is air, there is a gap). But you disagree on whether that gap constitutes a *feature of the world* or merely a *description of matter*.

  If your roommate is right that only fundamental particles exist, then **tables, chairs, and your roommate do not exist.** They are just "atoms arranged roommate-wise." This is a position called *Mereological Nihilism*. It is a defensible philosophical position, but it is a heavy metaphysical cost to pay to win an argument about Swiss cheese. He isn't just arguing about the word "exist"; he is arguing that the macroscopic world is an illusion. That is a substantive claim about the nature of reality, and it is arguably false (or at least, pragmatically untenable).

  Therefore, this is not just semantics. It is a clash between **Fundamental Ontology** (what is the universe made of at the bottom?) and **Special Science Ontology** (what objects exist at the level of human interaction?). Both are needed to describe the world. Denying the latter makes you unable to navigate the world (e.g., avoiding holes).

  ### 3. Who is Right?

  **Verdict: You are right.**

  Your roommate is committing a **Category Error**. He is judging macroscopic objects by the criteria of fundamental physics.

  1.  **The "Average Taxpayer" Rebuttal:** His analogy is flawed. The "average taxpayer" is a statistical abstraction; you cannot point to one. A hole is a **localized topological feature**. You *can* point to it. It has specific boundaries. It is more like a "surface" or a "boundary" than a statistical average. If he says holes don't exist, he must also admit that **surfaces** don't exist (since a surface is just the boundary of an object, not an object itself). If surfaces don't exist, he can't claim the cheese has a shape, because shape is a property of the surface.
  2.  **Causal Powers:** You mentioned breaking your ankle. In metaphysics, a strong criterion for existence is causal power. If $X$ can cause $Y$, $X$ is real. The hole (the absence of support) caused the break. The "cheese arrangement" didn't push you; the *lack* of cheese allowed gravity to work. The absence is the cause.
  3.  **The "Nothing" Fallacy:** He says a hole is "no-thing." But "no-thing" does not mean "non-existent." It means it is not a *material substance*. It is an **immaterial particular**. Shadows aren't made of stuff, but they exist. Holes are the same.

  He is technically correct that a hole is not made of "hole stuff," but he is wrong to conclude it therefore doesn't exist. It exists as a **dependent entity**.

  ### 4. What to Say at Dinner (The Script)

  Do not get defensive. Get philosophical. Use his own reductionism against him. Wait for a lull in the conversation, look at the cheese (or any object), and say this:

  **The Opener:**
  "I've been thinking about your 'holes don't exist' theory. It's bold. Consistent with hardline mereological nihilism. But I need to know: Do *surfaces* exist?"

  **The Trap (When he hesitates):**
  "Think about it. A surface isn't matter. It's the boundary of matter. It has no thickness. By your physics definition, the surface of the cheese is just 'the last layer of atoms.' But the *shape* of the cheese is defined by its surface. If the surface doesn't exist, the cheese has no shape. If the cheese has no shape, it's not Swiss cheese, it's just a cloud of atoms."

  **The Knockout:**
  "And regarding the 'average taxpayer'—that's a statistical fiction. A hole is a topological fact. You can measure its circumference. You can fall into it. If you're going to eliminate holes because they aren't fundamental particles, you have to eliminate tables, chairs, and yourself. You're just 'atoms arranged smugly.' I'm willing to grant that holes aren't *fundamental*, but if you deny they *exist*, you lose the ability to explain why my ankle broke. So, are you a nihilist about everything macroscopic, or can we admit that reality has layers?"

  **The Closer (If he tries to wiggle out):**
  "Look, I'll concede this: Holes don't exist *independently* of the cheese. They are ontologically dependent. But dependence isn't non-existence. My shadow depends on me, but step on it and see if it's not there. Pass the cheese."

  ### Summary of the Strategy
  1.  **Validate then Pivot:** Acknowledge his physics point (holes aren't fundamental particles) but reject the conclusion (therefore they don't exist).
  2.  **The Surface Analogy:** This is his weak point. Physics struggles to define boundaries precisely, yet we navigate the world by them.
  3.  **The Self-Defeat:** Remind him that his definition of "exist" eliminates *him*.
  4.  **The Compromise:** Grant that holes are *dependent* entities. This shows you understand the nuance better than he does, making you look smarter.

  He wants to win on "facts." You win on "framework." Show him that his framework makes the world unintelligible, while yours makes it navigable. That is the job of metaphysics.
