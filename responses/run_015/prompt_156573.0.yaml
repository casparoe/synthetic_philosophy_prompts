answer: |-
  **Concessions (Slides 1-2)**
  1.  **Budget Constraint:** I acknowledge the budget is fixed. Funding Drug A displaces funding elsewhere, likely Drug B.
  2.  **Efficiency Trade-off:** I acknowledge Drug B produces more total QALYs. This proposal explicitly trades aggregate health gain for equity protection.

  **Q&A Prep**

  **1. The Health Economist (Highest Damage)**
  *Objection:* "You're bypassing the cost-effectiveness threshold. If we fund A, we displace more QALYs than we gain. Even with equity weights, doesn't the math still favor B?"
  *Reply:* "Standard weights smooth equity; the veil prioritizes preventing catastrophic loss. Behind the catchment veil, you wouldn't gamble on being one of the 600 with a minor gain if it meant risking being one of the 40 facing health ruin. We aren't maximizing total health; we're minimizing health despair. The math changes when the unit of value is 'avoiding the bottom' rather than 'adding to the total'."
  *Softest Point:* You haven't defined how much aggregate health loss is acceptable to raise the floor.

  **2. The Clinician (Oncologist/Geriatrician)**
  *Objection:* "My duty is to the patient in front of me. Drug B helps 600 people walk slightly better. Why deny them for 40 others?"
  *Reply:* "Because the duty of care includes protecting the most vulnerable from ruin. If you were behind the veil, knowing you'd need treatment but not which kind, you'd insure against the catastrophe Drug A prevents, not the inconvenience Drug B alleviates. We are choosing the system we'd want to enter if we knew nothing about our own diagnosis."
  *Softest Point:* Assumes 'catastrophe' is clinically obvious rather than subjective.

  **3. The Finance Director**
  *Objection:* "High-cost drugs set precedents. If we fund A, every specialty claims their patients are the 'worst-off'. How do I cap this?"
  *Reply:* "We define 'worst-off' by clinical floor, not specialty. This isn't a blank check; it's a leximin constraint. Only conditions where, without treatment, health drops below a survivable threshold qualify. It's a narrow exception for absolute floors, not a new rule for all high-cost drugs."
  *Softest Point:* Defining 'survivable threshold' invites endless clinical debate.

  **4. The Patient Representative**
  *Objection:* "Who gets to call someone 'worst-off'? Is it the deprived postcode or the severe diagnosis? My community feels ignored by both."
  *Reply:* "The catchment veil combines them. It's not just diagnosis; it's who has the least resilience to absorb the health shock. We use local deprivation data to weight the clinical severity. The 'worst-off' are those with the least capacity to recover without this specific intervention."
  *Softest Point:* Combining deprivation and severity is methodologically messy.

  **5. The "Hope Nobody Asks" (Social Determinants)**
  *Objection:* "The actual worst-off people in this catchment need housing or debt relief, not expensive drugs. Why use a medical budget to fix justice?"
  *Reply:* "You're right, health isn't just medicine. But behind the veil, you know you're entering the hospital system, not the housing market. We must optimize justice within the lever we control. We secure the medical floor first, while advocating for social determinants elsewhere. We can't fix housing here, but we can fix this."
  *Softest Point:* Admits medical budgets are the wrong tool for social justice, undermining the moral urgency.
