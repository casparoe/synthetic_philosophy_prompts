      *Reply:* "Standard weights smooth equity; the veil prioritizes survival of the worst-off. Behind the catchment veil, you wouldn't gamble on being one of the 600 with a minor gain if it meant risking being one of the 40 facing catastrophic loss. We aren't maximizing health; we're minimizing health despair."
