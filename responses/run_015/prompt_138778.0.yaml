  **OFFICE FOR DERIVATION COMPLIANCE**
  **GUIDANCE NOTE 14: UNLICENSED NORMATIVE ASCENT**
  **VERSION 4.2 (DRAFT FOR INTERNAL USE)**

  **1. Purpose**
  1.1 This Note provides instructions for Compliance Officers regarding the identification and tariffing of Unlicensed Normative Ascent (hereinafter "UNA"). Officers are reminded that the boundary between descriptive premises and normative conclusions is statutory. It is not porous. It is not suggestive. It is a border.

  **2. Definitions**
  2.1 A "Descriptive Premise" means a statement of fact, or alternatively a statement of fact excluding evaluative content, or pending further notice following the submission of 412 pages of commentary by Prof. A. Vance (Institute for Semantic Stability), a statement of fact excluding evaluative content unless such content is deemed constitutive.
  2.2 A "Normative Conclusion" means any assertion containing an operator such as "ought," "should," or "must," unless covered by Exemption Category 3.

  **3. Classification and Thick Concepts**
  3.1 Inspectors must classify all derivation events. Where a premise contains a "thick concept" (e.g., *cruel, cowardly, generous, degrading*), the derivation must be paused.
  3.2 Such cases are to be referred to the Thick Concepts Working Group. Officers are advised that the Working Group was convened in 2019 to issue classification guidance. The Working Group has not yet issued guidance. Officers should hold files in abeyance. Files accumulating mould are not grounds for unilateral classification.

  **4. Exemption Category 3 (Means-Ends Reasoning)**
  4.1 Derivations of the form "If you want X, you ought to do Y" are permitted under Category 3.
  4.2 Officers must guard against laundering. It has been observed that applicants frequently insert a tacit universal premise (e.g., "as we all want…") to convert categorical claims into hypothetical ones.
  4.3 The test for detecting this is inconclusive. If the applicant denies wanting X, the derivation collapses. If the applicant asserts everyone wants X, the premise becomes descriptive only if "wanting X" is measurable. It is rarely measurable. Officers should apply a provisional penalty and await appeal.

  **5. Functional and Health Talk**
  5.1 Statements regarding the functional efficacy of an object (e.g., "a knife that does not cut is a bad knife") or biological organ (e.g., "a heart that does not pump is defective") occupy a grey zone.
  5.2 It is the view of one Senior Official (name redacted) that licensing this route permits the reconstruction of the entire ethical framework out of biology. This view remains under review. Until decided, treat "bad knife" as descriptive, but "bad person" as normative. Distinctions regarding persons who act as knives are to be escalated.

  **6. Institutional Facts**
  6.1 Utterances such as "I promise" allegedly generate obligations without additional normative premises. This is treated as a long-running unresolved appeal.
  6.2 Officers should not accept "promise" as a descriptive premise unless the obligation is explicitly waived by the promisee.^[1]

  **7. Worked Examples**
  7.1 *Example A (Laundering):* Applicant states, "As we all want safety, you ought to install this lock."
  *Assessment:* Category 3 exemption claimed. However, "safety" is contested. Some stakeholders prefer liberty. The premise "we all want safety" is descriptive only if "we" is defined. If "we" means "everyone except those who prefer liberty," the premise is true but useless. If "we" means "everyone," the premise is false. Penalty applied for unstable quantification.

  7.2 *Example B (Disputed Fact):* Consultation response states, "This policy hurts the vulnerable, therefore it ought to be withdrawn."
  *Assessment:* The Inspector cannot begin assessment of the conclusion because the descriptive premise ("hurts") is disputed. "Hurts" may refer to economic loss (descriptive) or dignitary harm (thick concept). Refer to Thick Concepts Working Group. If Working Group does not respond within 30 days, close file as "Unresolvable Derivation."

  **8. The Enabling Statute**
  8.1 Officers must note that the Office derives its authority from the Derivation Compliance Act 2018.
  8.2 Section 1 of the Act states: "No conclusion containing a normative operator ought to be asserted unless supported by a premise containing a normative operator."
  8.3 This statement was duly passed by Parliament. It contains a normative operator ("ought"). It is not supported by a premise containing a normative operator. It is supported by the brute fact of Parliamentary passage. Officers should not discuss this discrepancy with applicants.

  **9. Terminology**
  9.1 Use of the term "fallacy" implies a defect in reasoning.
  9.2 Identifying a defect is an evaluation.
  9.3 Evaluations are normative.
  9.4 Therefore, referring to the error as a "fallacy" constitutes a UNA event in itself.
  9.5 Effective immediately, all instances previously labelled "Naturalistic Fallacy" or "Humean Violation" are to be rebranded "Unlicensed Normative Ascent." This is not an evaluation. It is a administrative correction.

  **10. Amnesty**
  10.1 An amnesty bin is located outside Room 304 for retrospective licensing of pre-2018 derivations.
  10.2 The bin is full. Do not force the lid.

  ^[1] Footnote to 6.2: The panel cannot agree whether this is a genuine counterexample or a sleight of hand. Minutes from 14/02/2020 record a vote of 3-3. The Chair abstained on the grounds that abstaining was itself a normative act.
