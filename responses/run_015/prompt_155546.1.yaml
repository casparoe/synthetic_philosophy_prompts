prompt: |-
  I'm teaching a grad seminar on pragmatizm this term and we keep circling back to that old jamesian slogan that truth is basically just what works. Yesterday one of my students tried to use it to defend a pretty wild take — he said that since believing in some conspiracy theory makes him feel safe and helps him navigate social media, that belief is literally true for him in James's sense. I pushed back but realized I'm not being precise enough about what that slogan could actually amount to.

  So can you lay out the distinct precise theses hiding inside the slogan truth is what works? I want a menu, not a lecture: (1) a trivial or deflationary reading, (2) James's actual cash-value view about verification and practical consequences, (3) an instrumentalist claim about justification rather than truth itself, (4) the radical subjectivist/relativist version my student seems to be reaching for, and maybe (5) a long-run communal convergence reading that sounds more like Peirce. For each one, say whether it's actually defensible, whether Peirce would reject it and on what grounds, and specifically whether any of them actually license saying a comforting falsehood is true just because it has good psychological effects for one person. Also, I'm wondering if there's a hidden collapse between James and Peirce on that long-run point — is that a misreading?

  Please dont send me a bibliography; half the class is working from pirated pdfs anyway and I just want the conceptual map. Oh, and if you can, point out where James's view stops being about truth in the ordinary sense and starts being about something like warranted assertability — I think that's where my student is slipping up, but I want to check.
