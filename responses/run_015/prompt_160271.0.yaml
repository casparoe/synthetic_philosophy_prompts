prompt: |-
  I'm teaching a graduate seminar in formal epistemology this term, and I have a single seventy-five-minute slot to introduce imprecise probabilities to a room that has spent the previous six weeks doing everything with one sharp probability function and expected-utility maximization. The students are comfortable with notation and with elementary Bayesian conditioning, but they have no prior exposure to the literature on imprecision — and, this being the part I botch every time I teach it, an economist friend is going to sit in who will, at some predictable point, object that what I am calling imprecision is just ordinary uncertainty about a model parameter and should be handled with a sharp higher-order distribution and one more round of conditioning. I don't want the explanation itself; I want the plan for it. So give me the order in which the components must appear, and say what depends on what. In particular: whether the choice-behavior data from Ellsberg-style urns has to come first as motivation, or whether it is better held until the machinery that explains it is on the board; at which point the distinction between an assignment of intervals to individual propositions and a set of probability functions has to be drawn, given that two students every year leave thinking these are the same object, and given that I want the distinction made in a way that survives their noticing that intervals on A and on B do not settle an interval on A or B; and where in the sequence the updating question belongs, since conditioning every member of the set and then applying a choice rule can come apart from applying a rule to the unconditional set, and I want that non-commutation to land as a structural feature rather than as a surprise.

  Then the carrying example. I want one case that does the work of the whole session rather than a fresh toy example for each point, and I want you to say what it must contain and what it must not. My own thought is that it needs a situation where the imprecision is not merely ignorance that further evidence would erode, and where averaging over the set gives a different answer from the rules I actually want to defend; what I can't decide is whether it should also be a case that exhibits dilation — the setup in which you care about one question and receive a message bearing on it through a channel whose reliability you yourself cannot assess, so that learning the message widens your interval rather than narrowing it — or whether dilation should be held back and raised later as a separate worry. Tell me which, and where it goes.

  Finally, the misconceptions, in the order they will actually arise rather than in the order a survey article would list them, each with the point in the sequence at which it should be headed off. Here is what I expect, though tell me if I have the order or the inventory wrong: imprecision as a disguised sharp distribution over first-order probabilities (my friend's objection, which I suspect should be answered rather than conceded, and which I want placed where it does the least damage to the motivation for the view); the slide from "no single number" to "the midpoint"; the assumption that more evidence always shrinks the interval, and the panic that sets in when dilation appears; the thought that an imprecise credence is a permissivist permission to pick any member of the set and carry on as before; and the reflex that the choice rules — maximizing the worst case, ruling out dominated options and stopping there, and narrowing to the admissible options and then maximizing among them — are cosmetic variants of one another, when they disagree in cases I can construct. For that last cluster I want a judgment call from you: which rule to present as the default, which to present only as a contrast, and which to name and then openly decline to discuss. What should I explicitly refuse to cover at this level — I am assuming the full behavioral foundations and anything about conglomerability, but say what else — and what single question can I put to them in the last ten minutes that would show me they have understood why the set is not a distribution over the set, rather than merely learned to manipulate the notation?
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Graduate seminar in formal epistemology. 75-minute slot.
      *   **Audience:** Students comfortable with sharp probabilities, Bayesian conditioning, expected utility (EU). No prior exposure to imprecise probabilities (IP). One economist friend in the room (skeptic: "IP is just higher-order uncertainty").
      *   **Goal:** A *plan* for the lecture, not the explanation itself. Order of components, dependencies, carrying example strategy, misconception management, and specific pedagogical choices (rules to cover/ignore, final assessment question).
      *   **Specific Constraints/Questions:**
          *   Order of components (Ellsberg vs. Machinery).
          *   Distinction between intervals vs. sets of functions (and the $A \cup B$ issue).
          *   Updating question (non-commutation).
          *   Carrying example (requirements: non-ignorable imprecision, averaging fails, dilation yes/no?).
          *   Misconceptions (order of arrival, where to head them off).
          *   Choice rules (which default, which contrast, which ignore).
          *   What to exclude.
          *   Final assessment question.

  2.  **Deconstruct the Challenge:**
      *   *Time:* 75 minutes is tight for IP. It's a big conceptual shift.
      *   *The Economist:* This is the critical friction point. If IP is just Bayesian uncertainty about a parameter $\theta$, then $P(A) = \int P(A|\theta) dP(\theta)$ collapses back to a sharp number. The lecture *must* distinguish representational indeterminacy from epistemic uncertainty about a truth.
      *   *The Students:* They think in terms of sharp numbers. They will try to collapse the set to a midpoint or a distribution.
      *   *The "Botch":* The instructor usually fails here. The plan needs to be robust against the usual failure modes (confusing sets with intervals, failing to motivate *why* we don't just average).

  3.  **Drafting the Sequence (The Skeleton):**
      *   *Motivation:* Need to break the sharp prior first. Ellsberg is standard, but does it come before or after definitions? *Decision:* Before. You need to show *why* sharp EU fails before offering the fix.
      *   *Formalism:* Define the set of priors ($\mathbb{P}$). Distinguish from intervals immediately.
      *   *The Economist Objection:* Address this early, otherwise it undermines the motivation. But don't let it derail the formalism.
      *   *Updating:* This is technically tricky. Needs to come after the static formalism but before choice rules (since choice rules often depend on posteriors).
      *   *Choice Rules:* This is the payoff. How do we act?
      *   *Dilation:* This is a "feature/bug" that shocks people. Best to include in the carrying example if possible, or as a specific test of the updating mechanism.
      *   *Conclusion:* Assessment.

  4.  **Refining the Sequence (Dependencies):**
      *   Ellsberg $\to$ Failure of Sharp EU $\to$ Need for IP.
      *   IP Definition (Set of Measures) $\to$ Distinction from Intervals (additivity failure).
      *   Set of Measures $\to$ Response to Economist (Why not a prior over priors?).
      *   Updating $\to$ Dilation (if included).
      *   Choice Rules $\to$ Application to Ellsberg/Example.

  5.  **The Carrying Example:**
      *   *Requirements:* Non-ignorable imprecision (not just lack of data), averaging fails (EU gives wrong answer), structural clarity.
      *   *Dilation:* The prompt asks whether to include dilation. *Decision:* Include it. It's the strongest argument against "just get more data" and highlights the structural difference between sharp and imprecise updating. It fits the "reliability of channel" narrative which parallels the "reliability of source" in Ellsberg.
      *   *Scenario:* A modified Ellsberg or a "Bias Coin" scenario. Let's go with a "Unknown Bias Coin" but structured so that learning the outcome *widens* uncertainty (Dilation). Or better: A decision problem where the payoff depends on an event $E$, and we have a signal $S$.
      *   *Selection:* The "Two-Urn" or "Reliable/Unreliable Source" case. Let's use a variant of the Ellsberg setup that allows for updating. Actually, a *single* example that does everything is hard. Let's propose a "Defective Coin + Betting" scenario.
      *   *Constraint Check:* The prompt asks for *one* case. It must show: 1. Why sharp fails. 2. Why averaging fails. 3. Updating/Dilation.
      *   *Idea:* The "Sealed Bid" or "Insurance" case with ambiguous risk.
      *   *Better Idea:* **The "Unknown Bias Coin with a Signal"**.
          *   Coin has bias $b \in [0.4, 0.6]$.
          *   Sharp view: Uniform prior on $b$.
          *   IP view: Set of priors (or just the interval on heads, but must be a set to handle $A \cup B$).
          *   Signal: A report comes in.
          *   Dilation: The report is from a source whose reliability is also ambiguous.
      *   *Wait, simpler:* Stick close to Ellsberg but make it dynamic.
      *   *Decision:* Use a **modified Ellsberg Urn** that allows for a draw and a bet on the *next* draw. This handles the static ambiguity, the updating, and potentially dilation if the composition is unknown.
      *   *Actually, the prompt asks about Dilation specifically.* Dilation is best shown with a partition. Let's use the **White/Dark Urn** example often used for dilation.
      *   *Re-evaluating:* The prompt asks for a judgment on Dilation. *Verdict:* Include it. It's too central to the "updating" section to skip if we want to show why IP isn't just "more data needed."
      *   *Example Construction:* An urn with 100 balls. 50 are known Red/Black. 50 are Unknown (Red or Black). This is standard Ellsberg. To get dilation, we need a signal.
      *   *Let's choose:* **The "Ambiguous Coin Toss with Ambiguous Testimony."**
          *   Event $H$: Coin lands Heads. Coin bias $\theta \in [0.4, 0.6]$.
          *   Signal $S$: A witness says "Heads". Witness reliability $\rho \in [0.8, 1.0]$.
          *   This allows showing: 1. Initial interval. 2. Why averaging $\theta$ is wrong (Ellsberg preference). 3. Updating leads to dilation (interval widens). 4. Choice rules differ.

  6.  **Addressing the Economist (The "Higher-Order" Objection):**
      *   This must happen *early*, right after defining the set. If you wait, the students model it as a sharp prior in their heads.
      *   Argument: Convexity. If you have a sharp prior over the set, you are committed to linearity (EU). Ellsberg violations show non-linearity. Therefore, the set cannot be collapsed to a sharp distribution without losing the descriptive/normative bite.

  7.  **Intervals vs. Sets:**
      *   Must happen immediately after introducing the formalism.
      *   Key point: $P(A) \in [l, u]$ and $P(B) \in [l', u']$ does not determine $P(A \cup B)$. Only a set of functions preserves the dependencies (correlations) between events.
      *   Timing: Before Updating. You can't update intervals properly without knowing they come from a set.

  8.  **Choice Rules:**
      *   *Maximin (MEU):* The default. Robust.
      *   *E-Admissibility:* Good contrast (allows more options).
      *   *Interval Dominance:* Too weak?
      *   *Hurwicz:* Ignore (introduces arbitrary $\alpha$).
      *   *Randomization:* Ignore (too complex for 75 mins).
      *   *Decision:* Default to **Maximin (MEU)**. Contrast with **E-Admissibility**. Decline **Gamma-Maximin** or **Hurwicz** (too much psychological parameterization).

  9.  **Misconceptions & Timing:**
      1.  *IP = Sharp Higher-Order:* Address immediately after formalism (The Economist).
      2.  *Midpoint:* Address when discussing Decision Rules (why not just EU on the mean?).
      3.  *Evidence Shrinks:* Address during Updating/Dilation.
      4.  *Permissivism:* Address during Decision Rules (it's not "pick any," it's "satisfy the rule").
      5.  *Rules are same:* Address via a specific payoff matrix in the Example.

  10. **Final Assessment Question:**
      *   Needs to test "Set vs. Distribution."
      *   Question: Ask them to construct a scenario where a sharp prior over the set yields a different decision than the Maximin rule over the set. (Essentially, ask them to recreate the Ellsberg logic in their own words).
      *   Better: "If I tell you my credence in $A$ is $[0.4, 0.6]$ and in $B$ is $[0.4, 0.6]$, can you tell me my credence in $A \cup B$? Why or why not, and what does that imply about how I should update on $A$?"

  11. **Refining the Plan (Self-Correction/Polishing):**
      *   *Time Management:* 75 mins is very short.
          *   0-15: Motivation (Ellsberg).
          *   15-30: Formalism (Sets vs Intervals) + Economist Objection.
          *   30-45: Updating + Dilation (The Example).
          *   45-60: Decision Rules.
          *   60-75: Misconceptions wrap-up + Assessment.
      *   *Dilation:* It's controversial. Some hate it. But the prompt asks if it should be held back. *Advice:* Put it in. It's the "killer app" for why IP is structurally different from Bayesian sensitivity analysis. If you leave it out, the Economist wins ("just get more data").
      *   *The Example:* Needs to be tight. Let's specify the "Ambiguous Coin + Ambiguous Signal" clearly in the output.
      *   *The Economist:* Don't fight him on *his* turf (statistics). Fight him on *decision theory*. If you average, you satisfy Sure Thing Principle. Ellsberg agents don't. Therefore, averaging is not an option if you want to model Ellsberg agents.

  12. **Final Review against Prompt Constraints:**
      *   Order of components? Yes.
      *   Ellsberg first or later? First (Motivation).
      *   Intervals vs Sets? Early, before updating.
      *   Updating location? After static formalism, before choice rules.
      *   Carrying Example? One case, includes dilation? Yes.
      *   Misconceptions order? Mapped to lecture flow.
      *   Choice Rules? Maximin default, E-Admissibility contrast, others dropped.
      *   Exclusions? Conglomerability, full behavioral foundations.
      *   Final Question? Designed to test Set vs. Distribution.

  13. **Drafting the Response:** (Mental check of tone: Professional, pedagogical, direct, acknowledging the constraints). *Self-Correction on the Economist:* Make sure the plan explicitly schedules a "pre-emptive strike" against the higher-order prior argument so it doesn't fester.

  14. **Final Polish:** Ensure the distinction between "intervals on propositions" and "sets of functions" is highlighted as the critical technical hinge. Ensure the non-commutation of updating and choice is framed as a feature (sensitivity) not a bug.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here is the lesson plan, structured to fit the seventy-five-minute constraint while insulating the core concepts from the specific misconceptions you identified.

  ### I. The Sequence of Components

  **1. Motivation: Ellsberg Behavior (Minutes 0–15)**
  *   **Placement:** First. Do not introduce the machinery until the students feel the pain of the sharp model.
  *   **Dependency:** Nothing depends on this, but everything following depends on its success.
  *   **Action:** Present the standard Two-Urn Ellsberg case. Elicit preferences that violate the Sure Thing Principle (betting on known risk vs. unknown ambiguity).
  *   **Why:** If you start with the math, the economist in the room will model it as a sharp prior over urn compositions before the students understand why that is forbidden. You must establish that the *preferences* are the data, and sharp EU cannot fit the data.

  **2. Formalism: Sets of Functions, Not Intervals (Minutes 15–30)**
  *   **Placement:** Immediately after motivation.
  *   **Dependency:** Depends on the failure of sharp EU.
  *   **Critical Distinction:** Define the representational object as a convex set of probability functions $\mathbb{P}$, *not* as an interval assignment $[l, u]$ to propositions.
  *   **Why:** You must draw this distinction here to prevent the "interval arithmetic" error. Show explicitly that $P(A) \in [0.4, 0.6]$ and $P(B) \in [0.4, 0.6]$ does not determine $P(A \cup B)$ unless you track the *functions* that generate those bounds.
  *   **The Economist's Objection (Pre-emptive Strike):** Address the "higher-order distribution" objection here, before updating.
      *   *Argument:* If you place a sharp prior over $\mathbb{P}$, you collapse back to a single sharp expectation. This forces linearity (EU maximization). Since we just saw (in Ellsberg) that rational agents violate linearity, the higher-order sharp prior is descriptively and normatively inadequate for this context. The set represents *indeterminacy*, not just *uncertainty*.

  **3. Updating and Dilation (Minutes 30–45)**
  *   **Placement:** After static formalism, before decision rules.
  *   **Dependency:** Depends on the set-based formalism (you cannot update intervals without knowing the underlying dependencies).
  *   **Action:** Introduce the updating rule (Generalized Conditionalization: condition every $P \in \mathbb{P}$).
  *   **Non-Commutation:** Explicitly demonstrate that $\text{Rule}(\text{Update}(\mathbb{P})) \neq \text{Update}(\text{Rule}(\mathbb{P}))$. Frame this not as a calculation error but as a structural feature: learning can increase indeterminacy (Dilation).
  *   **Why:** If you leave updating until the end, it looks like an afterthought. If you put it here, it motivates the need for robust decision rules (because your posterior set might be wider than your prior set).

  **4. Decision Rules (Minutes 45–60)**
  *   **Placement:** After updating.
  *   **Dependency:** Depends on the posterior set $\mathbb{P}_{new}$.
  *   **Action:** Compare how different rules select acts given the set.
  *   **Why:** Students need to see that the "imprecision" has practical consequences for action, not just representation.

  **5. Misconception Wrap-up & Assessment (Minutes 60–75)**
  *   **Placement:** End.
  *   **Action:** Review the specific errors that arose during the session and pose the final diagnostic question.

  ---

  ### II. The Carrying Example

  **Verdict on Dilation:** **Include it.**
  Do not hold it back. Dilation is the strongest wedge against the economist's claim that "more evidence shrinks uncertainty." If you omit it, the lecture implies IP is just "Bayesianism with error bars." Dilation proves the topology of IP is fundamentally different.

  **The Example: "The Ambiguous Coin and the Ambiguous Witness"**
  This single case must do the work of motivation, formalism, updating, and decision rules.

  *   **Setup:** You face a coin with unknown bias $\theta$. You know $\theta \in [0.4, 0.6]$. (This establishes the initial set $\mathbb{P}$).
  *   **The Bet (Motivation):** You can bet on Heads or Tails. A sharp Bayesian with a uniform prior on $\theta$ is indifferent. An IP agent suspends judgment. (This mirrors Ellsberg without needing urns).
  *   **The Signal (Updating/Dilation):** You receive a report $S$ ("Heads") from a witness. However, the witness's reliability $\rho$ is *also* ambiguous: $\rho \in [0.8, 1.0]$.
  *   **The Result:** When you condition the set $\mathbb{P}$ on $S$, the posterior interval for Heads *widens* (e.g., from $[0.4, 0.6]$ to $[0.3, 0.7]$).
  *   **The Decision:** You must now decide whether to take a bet that pays off if the coin is Heads.
      *   *Sharp/EU:* Averages the parameters, calculates a single price.
      *   *IP/Maximin:* Evaluates the bet against the worst-case posterior probability.
      *   *Conflict:* The Sharp agent takes the bet; the IP agent rejects it.

  **What it must contain:**
  1.  **Two sources of ambiguity:** The event (coin) and the evidence (witness). This is required to generate dilation.
  2.  **A payoff structure:** Where the Sharpened (Averaged) expectation recommends Action X, but the Maximin rule recommends Action Y.
  3.  **Correlation:** The bias $\theta$ and reliability $\rho$ must be treated as independent in the set construction to show how the bounds interact.

  **What it must not contain:**
  1.  **Frequentist frequencies:** Do not talk about "long-run propensity." Keep it credal.
  2.  **Multiple urns:** Stick to one coin, one witness. Complexity kills the 75-minute limit.
  3.  **Zero-probability events:** Avoid the technical headache of conditioning on measure-zero sets within the set.

  ---

  ### III. Misconceptions: Order and Intervention

  Here is the order in which these will arise, and the specific point in the sequence where you must head them off.

  **1. "Imprecision is just a sharp distribution over parameters." (The Economist)**
  *   **When it arises:** Minute 15, as soon as you draw the set $\mathbb{P}$.
  *   **Intervention:** **Do not concede.** State clearly: "A sharp distribution over $\mathbb{P}$ collapses to a sharp $P$. That model satisfies the Sure Thing Principle. Our Ellsberg data violates it. Therefore, the set is not a proxy for a hidden sharp prior; it is a rejection of the requirement to have one."

  **2. "Just use the midpoint."**
  *   **When it arises:** Minute 30, when you write $[0.4, 0.6]$ on the board.
  *   **Intervention:** Head this off during the **Decision Rules** section. Show that the midpoint rule implies risk-neutrality over ambiguity. Ask: "If I offer you a bet at the midpoint price, and I know the bias is at the bound, who wins?" (The house always wins).

  **3. "More evidence must shrink the interval."**
  *   **When it arises:** Minute 35, during the **Updating** phase.
  *   **Intervention:** This is where **Dilation** does its work. When the interval widens after the signal, pause. Explicitly state: "In sharp Bayesianism, variance drops with evidence. In IP, if the evidence source is ambiguous, indeterminacy can increase. This is a feature, not a bug; it reflects that you now know *less* about the relevant probability than you did before."

  **4. "Imprecise credence means I can pick any member and act." (Permissivism)**
  *   **When it arises:** Minute 50, during **Decision Rules**.
  *   **Intervention:** Distinguish *representation* from *choice*. "The set represents your state of mind. The *rule* (e.g., Maximin) dictates how you act given that state. You are not permitted to pick the favorable member; you must satisfy the rule across the set."

  **5. "All choice rules are basically the same."**
  *   **When it arises:** Minute 55, when comparing rules.
  *   **Intervention:** Use the **Carrying Example's payoff structure**. Construct a specific bet where E-Admissibility allows the bet, but Maximin forbids it. Show that the disagreement is not cosmetic; it changes the action.

  ---

  ### IV. Choice Rules: What to Cover, What to Drop

  **1. The Default: $\Gamma$-Maximin (MEU)**
  *   **Presentation:** Present this as the primary normative standard for the seminar. It is the most robust and aligns best with the Ellsberg intuition (pessimism regarding ambiguity).
  *   **Reason:** It provides the cleanest contrast to Expected Utility.

  **2. The Contrast: E-Admissibility**
  *   **Presentation:** Present this as the "liberal" alternative. An act is permissible if it maximizes EU for *at least one* $P \in \mathbb{P}$.
  *   **Reason:** It shows that IP does not always lead to paralysis (incomparability). It helps distinguish "mandatory rejection" (Maximin) from "permissible acceptance" (Admissibility).

  **3. Explicitly Decline: Hurwicz Criterion & Randomization**
  *   **Presentation:** Name them, then refuse to discuss.
  *   **Reason:** Hurwicz introduces an arbitrary optimism parameter $\alpha$, which distracts from the structural point of IP. Randomization (mixing acts) requires convexity assumptions that will eat 15 minutes of algebra.
  *   **Script:** "These are live options in the literature, but they introduce psychological parameters or complexity that obscure the structural difference between sets and distributions. We are focusing on the structural difference."

  **4. What to Exclude Entirely**
  *   **Conglomerability:** Too technical. It leads to infinite regress worries that will derail the hour.
  *   **Behavioral Foundations:** Do not prove the representation theorem. Assume the set is given; focus on its use.
  *   **Relaxing Convexity:** Keep $\mathbb{P}$ convex. Non-convex sets introduce "gap" problems that confuse the interval intuition.

  ---

  ### V. The Final Assessment Question

  Do not ask them to calculate an interval. Ask them to diagnose a structural relationship. Put this on the board in the last ten minutes:

  > "Suppose I tell you my credal state regarding proposition $A$ is represented by the interval $[0.4, 0.6]$. I then offer you a bet that pays $\$1$ if $A$ is true and $\$0$ otherwise, costing $\$0.50$ to enter.
  >
  > **Question:** If I were a standard Bayesian with a sharp prior, I would be indifferent to this bet. If I am an Imprecise Probabilist using Maximin, I will reject it.
  >
  > **Task:** Explain why I cannot model my Improbabilist state as a 'Bayesian who is uncertain about their own prior' without contradicting my rejection of the bet. What specific property of the 'uncertain prior' model forces indifference, and how does the set-model avoid it?"

  **Why this works:**
  1.  It forces them to articulate the **Economist's Objection** (higher-order prior).
  2.  It forces them to identify **Linearity/EU** as the property that forces indifference.
  3.  It requires them to state that the Set Model breaks Linearity (non-additivity of the lower envelope).
  4.  If they answer "Because the lower bound is 0.4," they have failed (that's just interval arithmetic). If they answer "Because a distribution over priors averages to 0.5, satisfying EU," they have succeeded.
