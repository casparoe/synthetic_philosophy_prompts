  10. **Self-Correction during drafting:** I need to make sure I don't use too much jargon. The user said they haven't read the papers. I should explain *why* their "inside test" resembles the "transparency thesis" without telling them to go read Shah & Velleman. I need to be careful not to dismiss the "Stewardship" idea too quickly, as it's the most original part of their thought. It relates to "integrity" constraints.

      *Wait, one nuance on Calibration:* If I lower my contempt because I know I'm biased, am I responding to the *object*? Yes, indirectly. I'm trying to match the object. So Calibration *is* RKR. The user suspected this. I should confirm this suspicion but sharpen the objection.

      *Wait, one nuance on Step 3->4:* The user says "difference in what can explain... so maybe... only one kind of reason." The objection is that WKR *are* reasons, just not reasons *for the attitude*. They are reasons *to want* the attitude. I need to make this distinction clear.

