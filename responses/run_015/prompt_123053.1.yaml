      *   **Core Task:** Restate two philosophical positions entirely in the user's vocabulary (narrative craft terms):
          1.  Absurdism (Camus): Clash between human need for meaning and indifferent universe.
          2.  Contemporary Account of Meaning (e.g., Hybrid Objective/Subjective or Naturalist Fulfillment).
      *   **Specific Questions to Address:**
          *   Is the "silent universe" just a world with no authorial intent?
          *   Is subjective fulfillment just a character deciding the plot matters to them?
          *   Give a "residue report": What translates cleanly? What gets distorted? What has no counterpart in fiction?
          *   Evaluate the user's intuition: Is "absurdity is basically a broken narrative contract between protagonist and world" genuine or missing the point?
          *   Evaluate the leftover pieces: Does the novelist framework miss something real, or are philosophers describing abstractions that don't hold up?
      *   **Constraints:** No citations, no reading list. Stand on its own. Step-by-step reasoning (internal or explicit).
      *   **Tone:** Professional, collaborative, expert-level, respecting the user's craft knowledge.

  2.  **Deconstruct the Philosophical Positions into Craft Terms:**

      *   **Absurdism (Camus):**
          *   *Philosophy:* Human desire for meaning vs. Universe's silence. Revolt, freedom, passion. No escape (suicide/leap of faith).
          *   *Craft Translation:* The Protagonist expects a Genre Contract (mystery solves, hero wins, action has consequence). The World (Setting/Plot Mechanism) refuses to honor the Contract. There is no Authorial Intent (no thematic payoff). The Protagonist realizes the Plot is arbitrary but continues acting anyway.
          *   *Key Concept:* The "Broken Contract."

      *   **Contemporary Meaning (Hybrid View - e.g., Susan Wolf's "Fitting Fulfillment"):**
          *   *Philosophy:* Meaning arises from subjective attraction meeting objective value. You love doing it, and it's worth doing.
          *   *Craft Translation:* Character Agency (subjective) aligns with Diegetic Consistency/Thematic Resonance (objective). The Character's motivation matches the World's logic. The Plot Resolution feels earned *and* felt.
          *   *Key Concept:* "Alignment of Agency and Design."

  3.  **Drafting the Translations (Iterative Process):**

      *   *Absurdism:* Needs to avoid just saying "existentialism." Focus on the *clash*. In craft terms, it's the friction between Character Motivation (seeking arc) and Plot Structure (refusing arc).
      *   *Meaning:* Needs to avoid "happiness." Focus on "significance." In craft terms, it's when the Character's internal journey validates the External Plot.

  4.  **Addressing the Specific Questions:**

      *   *Silent Universe = No Authorial Intent?* Yes, but nuanced. It's not just "no author," it's "author refuses to signal." It's a text that refuses to be read.
      *   *Subjective Fulfillment = Character deciding plot matters?* Yes, but needs the "objective" component too (it can't just be delusion).
      *   *Residue Report:* What doesn't translate? The *phenomenological experience* of existence vs. the *observed experience* of a character. The reader is outside the character. The character doesn't know they are in a book.
      *   *User's Intuition:* "Absurdity is a broken narrative contract." This is strong. I need to validate it but also point out where it might limit the *feeling* of absurdity (which is lived, not just observed).

  5.  **Structuring the Response:**

      *   **Phase 1: Brainstorm/Key Moves:** Briefly outline the strategy (as requested).
      *   **Phase 2: Translating Absurdism:** Use craft terms (Contract, Agency, Diegesis).
      *   **Phase 3: Translating Contemporary Meaning:** Use craft terms (Theme, Arc, Resonance).
      *   **Phase 4: The Residue Report:** What fits, what breaks, what's missing.
      *   **Phase 5: Evaluating the Intuition:** Direct answer to the "broken contract" theory.
      *   **Phase 6: Conclusion:** Final verdict on the framework vs. philosophy.

  6.  **Refining the Craft Terminology:**
      *   Instead of "Universe," use "Diegetic World" or "Setting Logic."
      *   Instead of "Human Need," use "Character Motivation" or "Protagonist Expectation."
      *   Instead of "Meaning," use "Thematic Payoff" or "Narrative Coherence."
      *   Instead of "Author," use "Implied Author" or "Design."

  7.  **Critical Check on "No Authorial Intent":**
      *   In fiction, there *is* always an author. So representing a "silent universe" in fiction is actually a *stylized representation* of silence. It's a constructed absence. This is a key distortion to highlight in the Residue Report. A character cannot experience true absurdity in a book because the book is designed. The *character* feels the absurdity, but the *reader* sees the design. This is the crucial gap.

  8.  **Critical Check on Contemporary Meaning:**
      *   Hybrid view (Subjective + Objective). In craft: Character wants it (Subjective) + It matters to the World/Theme (Objective). If a character loves collecting bottle caps (Subjective) but the world treats it as trash (Objective), is it meaningful? Hybrid says no. Craft says: It's only meaningful if the Theme validates it.

  9.  **Developing the Residue Report:**
      *   *Survives:* The tension between expectation and reality. The feeling of arbitrariness.
      *   *Distorted:* The "Silence." In a book, silence is a choice by the author.
      *   *Missing:* The first-person ontological weight. A character is an object; a human is a subject. The philosopher talks about *being*; the novelist talks about *depicting*.

  10. **Final Review against Constraints:**
