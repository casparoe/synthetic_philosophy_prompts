answer: |-
  Twelve years ago, I wrote about [Bride] when she was a graduate student wrestling with a problem that keeps philosophers awake at night. She was asking what actually counts as a reason to love someone. Is it because they are kind? Because they are brilliant? Because they make us happy?

  Her answer then was complicated. But watching them together now, I realize her answer was also just a description of what they were already doing.

  They met by accident. He was looking for a session on sea-level modelling and wandered into her talk instead. It was a mistake, but it was a shared starting point. From that error, a path emerged. Not a path built on evaluation, or on what either of them could get out of it, but a path built on presence.

  For four years, they have walked the same loop around the reservoir on Sunday mornings. They have done this in the heat of summer and the bite of winter. They have done it when the wind was against them and when the air was still.

  There are many things I could say about [Bride]. I could say she is one of the sharpest minds of her generation. I could say she is generous, and steady, and kind. And all of that is true. But those qualities are not the foundation of what stands between them today. Those qualities are simply the companions who walked the path with them.

  What holds them together is not that she is wonderful, though she is. What holds them together is that when the alarm went off on those Sunday mornings, they both got up. What holds them is the mud on their boots and the silence they share when the water is flat. It is the fact that when he looked for sea levels, he found her, and then he kept walking.

  For [Groom]'s family, who might wonder what binds a man to a woman, look at the ground they've covered. There is no stronger reason than time given freely. There is no deeper justification than showing up, week after week, regardless of the weather. He is not marrying her because she is perfect. He is marrying her because they have a history, and that history is real, and it is theirs.

  For [Bride]'s colleagues, who might worry about the structure of this commitment, know that it is sound. It does not rest on the shifting sand of merit or benefit. It rests on the solid ground of what they have already done together.

  Love is not a reward for being excellent. It is the shadow cast by a shared life.

  So, if everyone could please rise.

  To the wrong turn that led to the right path. To the reservoir loop. To the four years of Sundays behind you, and all the miles ahead.

  To [Bride] and [Groom].
