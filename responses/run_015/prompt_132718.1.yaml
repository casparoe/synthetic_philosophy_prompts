answer: |-
  ### Restatement: The Kelly Criterion as an RL Objective Selection Problem

  In Reinforcement Learning terms, the Kelly criterion is a claim about **objective function specification** in environments with **multiplicative dynamics** and **infinite horizons**.

  **1. The Environment and Dynamics**
  Consider an agent interacting with an environment over a horizon $T \to \infty$. The state includes the agent's capital $W_t$. The dynamics are multiplicative: $W_{t+1} = W_t \cdot (1 + r_t)$, where $r_t$ is the return determined by the policy $\pi(a_t|s_t)$ and environment stochasticity. Crucially, $W_t = 0$ is an **absorbing state** (ruin); once entered, $r_t = 0$ for all future $t$.

  **2. Standard RL Objective (Linear Expectation)**
  Standard RL algorithms (e.g., PPO, SAC, DQN) optimize the expected cumulative return:
  $$ J_{\text{linear}}(\pi) = \mathbb{E}_{\tau \sim \pi} \left[ \sum_{t=0}^T \gamma^t r_t \right] \quad \text{or} \quad \mathbb{E}_{\tau \sim \pi} [W_T] $$
  In multiplicative environments, optimizing $J_{\text{linear}}$ incentivizes policies that maximize the **ensemble average** of terminal wealth. Because the distribution of $W_T$ becomes heavy-tailed (log-normal-like) as $T$ increases, the expectation $\mathbb{E}[W_T]$ is dominated by outlier trajectories with exponentially small probability mass.
  *   **Consequence:** The policy $\pi^*_{\text{linear}}$ typically leverages capital aggressively. As $T \to \infty$, the probability of hitting the absorbing state ($W_t=0$) converges to 1. The **mode** of the terminal wealth distribution goes to zero, even though the **mean** goes to infinity.

  **3. Kelly Objective (Geometric Growth)**
  The Kelly argument proposes optimizing the expected logarithm of capital, which is equivalent to maximizing the asymptotic growth rate (Lyapunov exponent):
  $$ J_{\text{log}}(\pi) = \lim_{T \to \infty} \frac{1}{T} \mathbb{E}_{\tau \sim \pi} \left[ \log W_T \right] = \mathbb{E}_{\tau \sim \pi} \left[ \log(1 + r_t) \right] $$
  This transforms the multiplicative process into an additive one in log-space. By the Law of Large Numbers, the time-average return converges almost surely to the expected log-return.
  *   **Consequence:** The policy $\pi^*_{\text{log}}$ maximizes the **time-average** growth rate. This policy avoids the absorbing state with probability 1 (assuming positive expected log-return) and maximizes the median terminal wealth.

  **4. Risk-Sensitivity and Value Functions**
  *   **Value Function:** In standard RL, $V(s)$ estimates expected future linear return. Under the Kelly objective, $V(s)$ must estimate expected future *log-growth*. The Bellman equation holds, but the reward signal is shaped: $r'_t = \log(1 + r_t)$.
  *   **Risk-Sensitive RL:** This can be viewed as a specific instance of risk-sensitive RL. While Exponential Utility RL optimizes $\frac{1}{\beta} \log \mathbb{E}[\exp(\beta \sum r_t)]$, Kelly optimization is equivalent to setting the reward signal itself to log-returns within a risk-neutral solver. It implicitly penalizes variance in log-wealth, not because of "aversion," but because variance drag (volatility pumping) reduces geometric growth.
  *   **Exploration-Exploitation:** In a non-stationary or partially observed setting, the Kelly fraction represents the optimal exploitation rate given current belief states. Over-exploration (betting too large to gain information) risks ruin (hitting the absorbing state) before convergence. The Kelly argument implies that exploration budgets must be constrained by the log-growth objective to ensure the agent survives long enough to learn the true environment dynamics.

  **5. The Argument for "Geometric Rationality"**
  Translated to RL terms, the argument is not about preference but about **ergodicity**:
  *   Standard RL assumes the **ensemble expectation** (average over many parallel training runs) is the relevant metric for a single deployment trajectory.
  *   The Kelly argument asserts that for a single agent in a non-ergodic system (where time averages $\neq$ ensemble averages), optimizing the ensemble expectation is a **specification error**.
  *   Therefore, an "optimal" policy for long-term deployment must optimize the time-average objective ($J_{\text{log}}$), not the ensemble objective ($J_{\text{linear}}$).

  ***

  ### Residue Report

  This section analyzes the fidelity of the translation and identifies concepts that do not map cleanly between the Kelly/Philosophy framework and the RL framework.

  #### 1. Clean Mappings
  *   **Objective Function Specification:** The core mathematical distinction maps perfectly. Maximizing $\mathbb{E}[\sum r_t]$ vs. $\mathbb{E}[\sum \log r_t]$ is a standard choice in reward shaping and risk-sensitive RL.
  *   **Ruin as an Absorbing State:** The philosophical concept of "gambler's ruin" translates directly to hitting a zero-capital state from which the value function is $-\infty$ (or 0, depending on formulation) and recovery is impossible.
  *   **Ergodicity Breaking:** The distinction between ensemble average (parallel training seeds) and time average (single deployment trajectory) is a precise statistical description of the non-ergodicity problem central to the Kelly argument.

  #### 2. Distortions Required
  *   **"Rationality" vs. "Optimality":**
      *   *Philosophy:* Kelly proponents argue that maximizing log-wealth is *rational* (normative). It claims you *ought* to have this objective.
      *   *RL:* RL is instrumental. It defines optimality relative to a given objective $J$. If you define $J = \mathbb{E}[W_T]$, the aggressive policy is "optimal." To express the Kelly argument, one must assert that $J_{\text{linear}}$ is a *misspecification* of the true goal (survival/growth), rather than saying the policy is suboptimal for $J_{\text{linear}}$.
      *   *Distortion:* We must treat "rationality" as "robustness to horizon length" or "survival probability" to fit it into RL's instrumental framework.
  *   **Risk vs. Variance Drag:**
      *   *Philosophy:* Kelly is often framed as "not risk aversion."
      *   *RL:* In Risk-Sensitive RL, log-objectives are usually categorized under risk-aversion (penalizing variance).
      *   *Distortion:* To remain faithful, we must clarify that the penalty on variance in Kelly is a mathematical consequence of geometric growth (Itô correction/volatility drag), not a preference parameter $\beta$ tuned by a human. It is structural, not preferential.

  #### 3. No Counterpart (The Gaps)
  *   **The Normative Force (The "Ought"):**
      *   *Gap:* RL provides no mechanism to select the objective function $J$ based on the structure of the environment alone. It assumes $J$ is given by the designer. The Kelly argument claims the environment's multiplicative structure *dictates* $J$.
      *   *Analysis:* This reveals a **limitation of the RL framework**, not a substantive philosophical disagreement. RL is an optimization engine; it does not inherently contain a meta-objective selector that analyzes ergodicity properties to recommend $J_{\text{log}}$ over $J_{\text{linear}}$. This is an "Outer Alignment" problem: the framework optimizes what it is told, even if what it is told leads to ruin.
  *   **Single-Trajectory Validity:**
      *   *Gap:* Standard RL theory (Policy Gradient, Bellman Operators) relies on expectations over distributions. Convergence guarantees are typically in expectation or probability over training runs. The Kelly argument prioritizes the *single realized trajectory* of a deployed agent.
      *   *Analysis:* This suggests the **philosophical disagreement is substantive**. RL theory generally accepts that an agent might fail in a specific run if the *expected* performance is high (e.g., in robotics, we accept some crash rate during training if the average reward is high). Kelly rejects this tradeoff for capital dynamics. The gap lies in whether "expectation over trajectories" is a valid proxy for "success of a single agent."
  *   **Infinite Horizon Assumption:**
      *   *Gap:* Kelly arguments rely heavily on $T \to \infty$ asymptotics. Practical RL operates on finite horizons or discounted returns ($\gamma < 1$).
      *   *Analysis:* With $\gamma < 1$, the Kelly fraction changes (usually becomes more aggressive as the horizon shortens). The philosophical claim of "geometric rationality" weakens in finite-horizon RL, where maximizing linear expectation might actually maximize the probability of reaching a specific target before the episode ends. The gap here indicates that the Kelly argument is **context-dependent**, not universally applicable to all RL settings (e.g., episodic tasks with reset).

  #### 4. Gap Diagnosis
  *   **Limitation of RL:** The inability of standard RL to automatically detect non-ergodicity and switch from linear to log-objectives is a framework limitation. An "Ergodicity-Aware RL" agent would analyze the dynamics class (additive vs. multiplicative) and select the value function accordingly.
  *   **Substantive Disagreement:** The disagreement over whether the *ensemble mean* is a valid proxy for *individual success* is substantive. In many RL applications (e.g., data center optimization), ensemble averages are valid because the policy is deployed across thousands of servers simultaneously. In others (e.g., autonomous trading for a single fund), the Kelly critique holds. The vocabulary of RL does not resolve this; it merely exposes that the choice of objective function determines which population (parallel worlds vs. time steps) is being optimized.

  ### Summary
  The Kelly criterion translates cleanly into RL as a choice between optimizing the **mean of terminal wealth** (standard risk-neutral RL) versus the **mean of log-wealth** (growth-optimal RL). The residue lies in the **normative claim**: RL treats the objective as an external input, while the Kelly argument treats the objective as a derived constraint of the environment's dynamics. The gap indicates that RL lacks a built-in mechanism for **objective selection based on ergodicity properties**, requiring the practitioner to manually encode the "rational" objective rather than discovering it through optimization.
