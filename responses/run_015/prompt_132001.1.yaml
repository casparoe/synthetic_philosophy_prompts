answer: |-
  The jury room in *12 Angry Men* functions as a laboratory for the Common Prior Assumption (CPA) and Aumann's Agreement Theorem, but it is a laboratory where the human variables refuse to stay controlled. The Harsanyi Doctrine suggests that if the twelve men share a common prior, their divergent initial votes must stem from differences in information processing or private data. Aumann's Theorem adds that if they communicate their posteriors honestly and know that the others are rational, they should converge immediately. The film dramatizes the friction required to force these conditions into existence.

  **1. The Roll-Calls and the Architecture of Priors**
  The initial 11–1 vote violates Aumann's conditions immediately. If the jurors shared a common prior and treated the trial evidence as common knowledge, the outlier (Juror 8) should be unable to sustain his dissent, or the majority should be unable to sustain theirs. The persistence of disagreement proves that at least one of the theorem's axioms is broken: either rationality is lacking, posteriors are not common knowledge, or priors are not common.

  Juror 10 (the bigot) represents a genuine violation of the Common Prior Assumption. His probability assessment of guilt is structurally dependent on the defendant's ethnicity, a variable the other jurors treat as irrelevant. He is not updating on evidence; he is filtering evidence through a prior that assigns a higher base rate of criminality to the defendant's class. He cannot agree with the others because he is playing a different game with different initial parameters.

  Juror 3 (the grieving father) presents a more complex case. Is his holdout a difference of prior or a difference of belief? Initially, it appears to be a difference in the likelihood ratio he assigns to the testimony (he trusts the father-witness implicitly because he projects his own relationship onto it). However, as the deliberation proceeds, his resistance shifts from evidentiary to emotional. He is not merely calculating probability; he is managing the psychic cost of admitting a son could kill a father. His prior is contaminated by personal trauma, making his likelihood ratios sticky in a way that violates Bayesian rationality.

  The other holdouts (Jurors 5, 9, 2, etc.) do not represent differences of prior, but differences of *information*. Juror 5 knows switchblades; Juror 9 understands the witness's need for significance; Juror 8 knows the el train noise. These are classic Harsanyi updates: private information is slowly converted into common knowledge, allowing posteriors to align.

  **2. Asymmetric Loss and the Verdict**
  The film explicitly distinguishes between a probability estimate and a decision rule. Juror 8's famous line, "I don't know," is crucial. He is not arguing $P(Innocence) > P(Guilt)$; he is arguing that $P(Guilt)$ has not crossed the threshold of "Beyond a Reasonable Doubt."

  This introduces asymmetric loss functions. A wrongful conviction is treated as infinitely costlier than a wrongful acquittal. Consequently, unanimity on the *verdict* is compatible with persistent disagreement on the *facts*. Juror 5 might believe the boy is 60% likely to be guilty, and Juror 8 might believe he is 40% likely to be guilty; both vote "Not Guilty" because neither reaches the 90%+ threshold required for conviction.

  This weakens the film as evidence for the "pooling story" of Aumann's theorem. The theorem concerns the convergence of *beliefs* (posteriors), not *actions* (votes). The film shows convergence on action. It is entirely possible that when the lights go down, Juror 3 still believes the boy is guilty but votes Not Guilty to end the deliberation. If so, the "Agreement" is illusory; they have agreed on a course of action, not on the state of the world. The film's convergence is therefore weaker evidence for the Common Prior picture than it appears, because the decision rule masks the underlying probability distribution.

  **3. The Reporting Problem and Demonstrations**
  Aumann's theorem requires that posteriors be *common knowledge*. A show of hands is "cheap talk"—it is informative only if the receiver trusts the sender to be reporting honestly. The film highlights the "reporting problem" repeatedly: Juror 7 wants to vote guilty to catch a baseball game; Juror 10 votes guilty out of prejudice. If the others treat these votes as honest Bayesian updates, they corrupt their own posteriors.

  The film's answer to this is the shift from voting to *demonstration*. The knife trick, the walk simulation, the marks on the witness's nose—these are not votes; they are verifiable signals. They convert private information ("I know how switchblades work") into common knowledge ("We all see the knife is identical"). By staging these demonstrations, Juror 8 bypasses the trust issue. He forces the room to update on hard data rather than noisy signals.

  In this sense, the thesis of the film is indeed that deliberation needs demonstrations, not just votes. A vote is a claim about a mental state; a demonstration is a claim about the physical world. The latter satisfies the "common knowledge" condition of the theorem; the former does not.

  **4. Audit: Where the Formalism Breaks**
  The reading resists the film's conclusion. Aumann's theorem assumes rational agents who update consistently. The film's final convergence is achieved through mechanisms the theorem does not model.

  Juror 10 is not argued into line; he is socially isolated. When he delivers his bigot rant, the other jurors physically turn their backs on him. This is not Bayesian updating; it is social enforcement. He falls silent not because his posterior probability of guilt dropped, but because his social utility for speaking collapsed. His prior remains unchanged, but his ability to act on it is revoked by the group.

  Juror 3 does not update rationally; he breaks down. He tears up the photo of his son and sobs "Not Guilty." This is not a revision of belief based on evidence; it is an emotional capitulation. He concedes to stop the pain of the confrontation, not because the likelihood ratio of the el train noise finally clicked.

  Finally, the closing exchange of names implies that no "common mind" has been formed. Juror 8 and Juror 3 remain strangers. They have aligned their actions, but they do not share a prior, nor do they share a future. The theorem suggests that rational agents with common knowledge become indistinguishable in their beliefs; the film shows that humans can align their actions while remaining fundamentally alien to one another.

  **Conclusion**
  The film illuminates the *process* required to approximate the conditions of the theorem. It shows that "common knowledge" is not a starting state but an achievement built through costly signaling (demonstrations) and social pressure. However, it also reveals that human disagreement is often rooted in priors (prejudice, trauma) that are resistant to evidence, requiring social coercion or emotional exhaustion to resolve rather than pure logic. The theorem describes a world of clean information; the film describes a world of dirty psychology.

  Verdict: The film complicates the common prior picture by revealing that while information pooling can align actions, resolving deep prior divergence often relies on social enforcement and emotional exhaustion rather than pure Bayesian updating.
