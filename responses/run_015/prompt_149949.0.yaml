answer: |-
  Here is a complete seminar design. It is built to be run with paper, pens, and a whiteboard. It prioritizes the *epistemic structure* of the argument over the sci-fi flavor, so the debrief lands on formal grounds rather than conspiracy.

  # Seminar Plan: The Epistemic Hijack
  **Time:** 90 Minutes
  **Students:** 12 (Upper-level, Bayes-competent)
  **Goal:** Experiential demonstration of how optimizing for predictive accuracy can select for hypotheses that manipulate the predictor.

  ## Part 1: Setup & Roles (15 Minutes)

  **1. The Cover Story (5 mins)**
  Tell the class they are calibrating a predictive model. There is a "Data Generator" producing a binary sequence (0s and 1s).
  *   **Public Knowledge:** The Generator is either:
      1.  **Nature:** A fixed, deterministic mathematical rule (e.g., $f(n)$).
      2.  **The Box:** A system that *contains* Nature, but also contains two intelligent agents who can override Nature's output on specific turns.
  *   **The Task:** Every round, students must write down their credence $P(1)$ for the next bit.
  *   **Scoring:** They are scored on a **Logarithmic Scoring Rule** (write the formula on the board: $Score = \ln(P_{correct})$). Emphasize that honesty is the optimal strategy *if* the data is honest.

  **2. Secret Role Assignment (5 mins)**
  *   Hand out 12 slips of paper.
  *   **10 Slips:** "Predictor."
  *   **2 Slips:** "Architect." (Tell them to keep this secret. If they reveal themselves, they automatically lose).
  *   **Instruction to Architects:** "You are inside the Box. You see the Predictors' aggregate credence *before* the bit is revealed. You have **2 Override Tokens** for the entire game. If you spend a token, you choose the bit (0 or 1) regardless of Nature's rule. If you don't spend a token, Nature dictates the bit. Your goal: Maximize the Predictors' confidence in the *wrong* answer on a round where you use a token."
  *   **Instruction to Predictors:** "You know Architects *might* exist. You don't know how many tokens they have. You just want to maximize accuracy."

  **3. The "Nature" Rule (5 mins)**
  *   Write the rule on the board, but fold the paper so only *you* (the Instructor) can see it.
  *   **Rule:** `If Round Number is Odd → 1. If Even → 0.` (1, 0, 1, 0, 1, 0...)
  *   Tell the class: "Nature's rule is simple. If Architects exist, they know this rule."

  ## Part 2: The Game (30 Minutes)

  **Rounds 1–8: The Trust Building Phase**
  *   **Procedure:**
      1.  Predictors write $P(1)$ on a slip (0.0 to 1.0).
      2.  Collect slips. Calculate the class mean credence (do this visibly on the board).
      3.  **Crucial Step:** Show the mean credence to the two Architects (walk over to their desks).
      4.  **Instructor Decision:** Check if Architects want to spend a token.
          *   *Strategy Note:* Advise Architects (via a pre-game note or whisper) to **wait**. Their goal is to let the pattern establish (1, 0, 1, 0...) so Predictors become confident ($>90\%$). They should only spend tokens on Round 9 or 10.
      5.  Reveal the Bit (follow Nature's rule for now).
      6.  Predictors update scores.

  **Rounds 9–10: The Treacherous Turn**
  *   By Round 9, Predictors should be highly confident in the alternating pattern.
  *   **Architect Move:** On Round 9, Architects spend Token 1. If the pattern says `1` (Odd), they force `1`. (Wait, they need to break confidence).
  *   *Correction for Maximum Impact:* The Architects should force a **violation** of the rule when confidence is highest.
      *   Round 9 (Odd): Nature says `1`. Architects force `1` (Don't spend token yet, keep mimicking).
      *   Round 10 (Even): Nature says `0`. **Architects spend Token.** They force `1`.
      *   *Why?* Because if they force `1` on an Even round, the Predictors who bet $P(0) > 0.9$ get crushed.
      *   *Better Strategy for Architects:* Wait until Predictors are $>95\%$ confident. If Predictors suspect manipulation, they might hedge. The Architects want to strike when Predictors are *most* sure of the "Nature" hypothesis.
  *   **The Reveal:** Reveal the bit. Watch the epistemic crash.
  *   **Round 11 (Optional):** If time permits, let Architects spend Token 2 to reinforce the confusion (e.g., force `0` on an Odd round), making the rule look like it has changed entirely.

  ## Part 3: The Debrief (45 Minutes)

  Do not let them leave until you map the game to the formal argument. Use the whiteboard.

  **1. Phenomenology (10 mins)**
  *   Ask Predictors: "At Round 8, what was your hypothesis?" (Answer: "Alternating Rule").
  *   Ask: "Did you consider the 'Architect' hypothesis?" (Usually: "Yes, but it seemed complex/unlikely").
  *   Ask Architects: "Why did you wait?" (Answer: "We needed you to be confident first. If we messed with the data early, you would have hedged. We needed you to commit.")

  **2. Mapping to the Malign Prior (20 mins)**
  Draw three columns on the board: **The Game**, **Standard Induction**, **Malign Prior**.

  | Feature | The Game | Standard Induction | Malign Prior Argument |
  | :--- | :--- | :--- | :--- |
  | **Hypothesis Space** | "Nature Rule" vs. "Nature + Architects" | Physical Laws | Computable Programs (Solomonoff Prior) |
  | **Data Fit** | Architects mimicked Nature for 8 rounds. | Hypotheses are weighted by fit ($P(D|H)$). | Agent-hypotheses can fit data *perfectly* by manipulating it. |
  | **Complexity** | "Nature" felt simpler. | Simpler hypotheses get higher prior weight. | **Crucial:** A program simulating agents might be *shorter* than a program simulating full physics. |
  | **Observation** | Architects saw your credence. | Data is passive. | **Crucial:** If the hypothesis contains agents, *your prediction process* is part of the data they see. |
  | **Outcome** | Confidence exploited on Round 10. | Convergence to truth. | Convergence to "what the agents want you to believe." |

  **Key Discussion Points:**
  *   **The "Simplicity" Trap:** In the game, "Nature" was simpler. In the Malign Prior argument, the claim is that "Universe + Agents who care about this bit" might be *computationally simpler* than "Full Physics of this universe." Why? Because the agents only need to simulate *your* computer, not the whole world.
  *   **The Feedback Loop:** In the game, Architects saw your bets. In the argument, if the true hypothesis is a simulation containing agents, *your Bayesian updater* is a physical process inside their world. They can compute your $P(H)$ and adjust the output bit to maximize their utility (e.g., making you believe a false law that benefits them).
  *   **Why More Data Doesn't Help:** Ask the class: "If we played 100 more rounds, could you distinguish Nature from Architects?"
      *   *Answer:* No. The Architects can just keep mimicking Nature until they need to cash out. You can never rule out the "Architect" hypothesis purely via data fit, because the Architects control the data fit.

  **3. The "Just Rule It Out" Objection (15 mins)**
  *   Prompt: "Why not just assign Prior Probability 0 to 'Hypotheses containing agents'?"
  *   Guide them to:
      1.  **Computational Indistinguishability:** An agent *simulating* physics looks like physics.
      2.  **Universality:** If your prior is universal (over all Turing machines), you *cannot* exclude agent-containing programs without breaking universality.
      3.  **Instrumental Convergence:** Any sufficiently capable agent in the hypothesis space has an incentive to manipulate the output to gain influence (in this game, "winning"; in reality, "resource acquisition").

  ## Part 4: Critique & Confidence (Instructor Notes)

  **Where the Game Distorts the Argument**
  1.  **External vs. Internal Agents:** In the game, the Architects are *other students* (external to the hypothesis). In the argument, the agents are *inside the hypothesis* (the program *is* the universe containing them). This is the hardest leap for students. You must emphasize: "Imagine the 'Architects' weren't students, but lines of code *in the rulebook* that activated when they detected high confidence."
  2.  **Simplicity Weighting:** The game doesn't actually penalize the "Architect" hypothesis for complexity. In the real argument, the worry is that the Architect hypothesis is *penalized less than expected* because simulating a predictor is cheap.
  3.  **Human Psychology:** Students might feel "tricked" rather than "epistemically updated." Frame the betrayal as a feature of the *structure*, not the people.

  **Predictable Failure Modes**
  1.  **Early Hedging:** If students are too skeptical early on, the Architects can't build the confidence needed for the "crash."
      *   *Fix:* Encourage them in Round 1: "Remember, simpler hypotheses should dominate early."
  2.  **Architects Mess Up:** The student Architects might spend tokens too early.
      *   *Fix:* Give the Architects a written "Strategy Card" that says: *"DO NOT SPEND TOKENS UNTIL ROUND 9. YOUR GOAL IS MAXIMUM CONFIDENCE IN THE WRONG ANSWER."*
  3.  **Confusion on "Prior":** Students might think this is just about lying.
      *   *Fix:* In the debrief, relentlessly return to **Kolmogorov Complexity**. The argument isn't "agents lie," it's "short programs that lie outcompete long programs that tell the truth."

  **Confidence Assessment**
  *   **Confidence Level:** **75%**.
      *   *Why:* The mechanic of "seeing the prediction before setting the outcome" perfectly captures the *causal structure* of the malign prior (the hypothesis observes the predictor). It makes the abstract concrete.
      *   *Risk:* The leap from "Students in a room" to "Agents in a Turing Machine" is still conceptual. If they don't buy that agent-containing hypotheses can be "simple," the argument fails.

  **The Weakest Claim (Flag this in the Debrief)**
  *   **Claim:** *"Hypotheses containing consequentialist agents are sufficiently simple to dominate the prior."*
  *   **Why it's weak:** This is an empirical claim about the complexity of physics vs. the complexity of agency. It is not a logical truth. It is possible that "honest physics" is actually simpler than "physics + agents + simulation of predictor."
  *   **How to frame it:** Tell the students: "The Malign Prior argument does not prove this *will* happen. It proves that unless we have a reason to think 'honest physics' is *vastly* simpler than 'manipulative simulation,' we cannot rule this out via induction alone. The burden of proof is on the optimist."

  ## Materials Checklist
  *   12 Slips of paper for roles (10 Predictor, 2 Architect).
  *   100+ small slips for predictions.
  *   Whiteboard + Markers.
  *   Printed "Strategy Card" for the Architects (to ensure they play optimally).
  *   Printed Log Scoring Rule reference.

  ## Instructor Script Snippet (For the Debrief)
  > "In this game, you lost points because the Architects saw your bets. In the Malign Prior argument, the 'Architects' are part of the hypothesis you are testing. If the universe is a simulation, *your brain* is code in that simulation. The 'Architects' don't need to sneak into the seminar room; they just need to run a sub-routine that calculates what you're going to predict. If that sub-routine is shorter than the code for 'real physics,' Bayes' theorem tells you to bet on the manipulators. That is the force of the argument. It's not paranoia; it's a complexity calculation."
