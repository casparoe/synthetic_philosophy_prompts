answer: |-
  1. **Determination vs. Discrimination (§1)**
  The contrast is unstable. You refuse the demand for a fact that *determines* a unique function, proposing instead a fact that *discriminates* addition from quus for practical purposes. The sceptic will reply that discrimination *presupposes* determination. To discriminate A from B, there must be a truth-maker that makes it A rather than B. If there is no fact determining that you mean addition, there is no fact that discriminates addition from quus; there is only your assertion that there is. You have not lowered the bar; you have merely renamed it. Unless you explain how discrimination occurs without a determining fact, you have not answered the sceptic, only changed the vocabulary. The sceptic can reissue the demand: "What fact about you discriminates addition from quus?" If you answer "none," you concede scepticism. If you answer "the robust pattern," you must show how that pattern determines correctness without collapsing into the determinacy you refused.

  2. **Cross-Representational Robustness (§3)**
  This section does not do the work you claim. You argue that gerrymanders exploit notation features (e.g., character count), so notation-independence blocks them. This is false for the standard cases. Quus and bplus are defined on numbers, not numerals. The rule "output 5 if the sum exceeds 57" is notation-independent; it holds whether you use Arabic numerals, Roman numerals, or piles of blocks. A gerrymander stated purely in terms of numerical magnitude escapes §3 untouched. Consequently, this section attacks a straw man. The robustness test might filter out notational quirks, but it fails to filter out the semantic gerrymanders that drive the paradox. You claim this is a substantive constraint, but since the dangerous rivals are already notation-independent, the constraint is trivial regarding the sceptical threat.

  3. **The Benign Residue (§4)**
  This manoeuvre is coherent only if you clarify the status of the indeterminacy. You claim that where practice cannot discriminate, there is no norm to violate. This sounds like a sceptical solution: meaning talk is reconstrued as assertibility conditions within a practice. However, you insist this is not meaning-scepticism. You cannot have it both ways. If there is no fact of the matter beyond practice, you are a sceptic about facts. If there is a fact, you must identify it. The claim that "nothing in the practice could discriminate" is epistemic (we cannot know), but you treat it as metaphysical (there is nothing to know). If it is metaphysical, you concede the sceptic's point that there is no fact of the matter. If it is epistemic, the sceptic asks what fact we are failing to know. You need to choose: either embrace the sceptical solution openly or defend a metaphysical fact of robustness. Currently, you hedge.

  4. **Normative Asymmetry (§5)**
  The account is circular. You argue that robustness constrains correction: a correction conflicting with the robust pattern changes the subject. But to classify a correction as "changing the subject" rather than "correcting me," I must already know what the subject *was*. I must already know that I meant addition. If robustness is supposed to constitute the meaning, I cannot use the meaning to identify the robustness. The normativity is presupposed, not derived. You say the pattern binds me, but without a prior norm, why *ought* I follow the robust pattern rather than the deviant one? The asymmetry between correction and change of subject relies on the very meaning facts you are trying to ground. Robustness arrives after the normative work has been done, not before.

  5. **Recursion and Finitude (§6)**
  The recursion relocates the finitude objection inside a hierarchy without solving it. You conjecture that addition is "recursively robust" while quus is not. But if I am a finite agent, my performance at every level is finite. A gerrymander can be fitted to any finite hierarchy of levels. To say the rules must survive "every level" implies an infinite hierarchy, which no finite agent can satisfy. If you idealize to infinite levels, you leave human meaning behind. If you stay finite, the gerrymander wins at the highest level I can actually reach. You claim this forms the space where meaning is located, but for finite beings, that space is empty. You have not escaped finitude; you have merely made the gerrymander more complex.

  6. **Editorial Advice**
  Section 3 is the weakest and should be cut or demoted to a footnote; as noted, it attacks notational gerrymanders rather than numerical ones, which is irrelevant to the core paradox. Sections 1 and 4 should lead the paper. The argument is more interesting if reframed as an error theory about the demand for determinacy itself, rather than a straight solution trying to locate meaning in §6. Your strongest insight is that the sceptic's demand is illegitimate (§1) and that residual indeterminacy is harmless (§4). The positive construction in §5 and §6 invites the circularity and finitude objections that undermine the error theory. Drop the attempt to solve the paradox positively; argue instead that the paradox arises only if we accept the determinacy demand. This protects you from the need to specify a fact that does the work you deny is needed.

  7. **Distinctness from Dispositionalism**
  This view is not genuinely distinct from a generous dispositionalism. Robustness is defined as a pattern of performances across perturbations. This is precisely a complex disposition: "I am disposed to answer thusly in context C1, C2, C3..." If the sceptic's objection to dispositionalism is that dispositions yield only what I *will* do, not what I *ought* to do, robustness inherits this flaw. You claim robustness constrains correction, but without a prior norm, the robust pattern is just a description of regularity. You have not explained how a pattern of behaviour generates normativity. Unless you can show that robustness is non-dispositional (e.g., a primitive fact), you are simply helping yourself to counterfactual dispositions across contexts. Robustness adds complexity, not normativity.
