prompt: |-
  i host a small philosophy podcast and next episode im interviewing a philosopher — lets call her Dr. Voss — who defends "role-indexed internalism" about practical reasons. her idea is that a reason counts as internal not relative to your actual desires but relative to the motivations you'd have if you were competently performing the social role you actually occupy. so a parent who feels nothing still has internal reason to feed their kid, because thats constitutive of parenting, but if the parental role is structured by unjust norms then external reasons kick in and override. i want 7 or 8 questions that actually press her, not just "explain your view." i need at least one about whether this just collapses into externalism once you let unjust roles be overridden, one about role conflict — like being a good employee vs a present parent — and one about whether "competent role-filling" smuggles in objective moral standards. for each question, write a follow-up tailored to the answer she's most likely to give (she tends to say the norms are internal to the practice, not imported). no generic biographical stuff. keep it focused.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Host:** Small philosophy podcast.
      *   **Guest:** Dr. Voss (philosopher).
      *   **Topic:** Role-Indexed Internalism about practical reasons.
      *   **Core View:** Reasons are internal relative to motivations one *would* have if competently performing their actual social role. (e.g., Parent $\rightarrow$ feed kid, even if actual desire is absent).
      *   **Caveat:** If the role is structured by unjust norms, external reasons override.
      *   **Requirements:**
          *   7-8 questions.
          *   Must "press her" (critical/challenging, not just expository).
          *   Specific required topics:
              1.  Collapse into externalism (regarding unjust roles).
              2.  Role conflict (employee vs. parent).
              3.  "Competent role-filling" smuggling in objective moral standards.
          *   Format: Question + Tailored Follow-up (anticipating her likely response: "norms are internal to the practice").
          *   Tone: Focused, no generic bio stuff.

  2.  **Deconstruct the View (Role-Indexed Internalism):**
      *   *Internalism:* Reasons must connect to the agent's subjective motivational set (Smith/Williams style).
      *   *Voss's Twist:* The motivational set isn't "what I actually want" but "what a competent role-filler wants."
      *   *The Tension:* This sounds like a functionalist definition of roles. If the function is defined morally, it risks becoming externalism. If the function is defined socially/descriptively, it risks validating bad roles (e.g., "competent soldier" in an unjust war).
      *   *The Override:* She allows external reasons to override unjust roles. This is the vulnerability point for the "collapse" objection.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Collapse into Externalism.*
          *   *Draft:* If you allow external reasons to override unjust roles, aren't you just an externalist?
          *   *Refinement:* Make it sharper. Focus on the *source* of the judgment that a role is unjust.
          *   *Follow-up:* She'll say the judgment comes from outside, but the reason remains internal to the *moral* role. I need to press on whether the *practical force* comes from the role or the morality.

      *   *Requirement 2: Role Conflict.*
          *   *Draft:* What if being a good employee conflicts with being a good parent?
          *   *Refinement:* Focus on the *indexing*. Which role gets priority? Does the theory have a meta-role?
          *   *Follow-up:* She'll likely say "deliberate within the practices." I need to ask if that deliberation itself presupposes a standpoint outside the roles.

      *   *Requirement 3: Competence & Objective Standards.*
          *   *Draft:* Doesn't "competent" just mean "moral"?
          *   *Refinement:* Focus on the gap between *socially recognized* competence and *normatively robust* competence.
          *   *Follow-up:* She'll say competence is internal to the practice (e.g., chess). I need to ask about practices where the "point" is contested or harmful.

      *   *Requirement 4: The "Actual Desires" Problem (Williams critique).*
          *   *Idea:* Williams says internal reasons need a sound deliberative route from *actual* motivations. Voss bypasses actual motivations.
          *   *Question:* How is this still internalism if I have zero motivation to be a parent?
          *   *Follow-up:* She'll say the role *constitutes* the motivation. Press: Is that psychological realism or normative stipulation?

      *   *Requirement 5: Exit Costs/Role Abandonment.*
          *   *Idea:* Can I just quit the role?
          *   *Question:* If the reason binds me because of the role, can I evade the reason by quitting the role?
          *   *Follow-up:* She'll say some roles are non-voluntary (citizen, parent). Press: Then the "internal" label seems to do no work.

      *   *Requirement 6: The "Bad Role-Filler" Problem.*
          *   *Idea:* What about the conscientious objector within a role?
          *   *Question:* If a soldier refuses an unjust order, are they incompetent or morally superior?
          *   *Follow-up:* She'll distinguish technical competence from moral permission. Press: Does the "reason" to refuse come from the soldier role or outside it?

      *   *Requirement 7: Motivation vs. Justification.*
          *   *Idea:* Internalism is usually about motivation/explanation. Voss seems to use it for justification.
          *   *Question:* Are you explaining why people act or why they should act?
          *   *Follow-up:* She'll say practical reasons bridge both. Press: If the agent feels no pull, in what sense is the reason "internal"?

      *   *Requirement 8: Fragmentation of the Self.*
          *   *Idea:* We have many roles. Does this fragment agency?
          *   *Question:* Does this view leave us with a fragmented self, just a bundle of roles?
          *   *Follow-up:* She'll say integration is a higher-order role. Press: Who is doing the integrating?

  4.  **Review and Refine:**
      *   Check against constraints: 7-8 questions? Yes. Specific topics covered? Yes. Follow-ups tailored to her likely defense ("internal to practice")? Yes.
      *   *Self-Correction on Follow-ups:* Make sure the follow-up doesn't just repeat the question but digs into the implication of her specific likely answer.
      *   *Tone Check:* Ensure it sounds like a podcast interview (conversational but rigorous).

  5.  **Final Polish:** (Writing out the questions and follow-ups clearly, ensuring the logic flows). *Self-correction: Ensure the "Collapse" question is the strongest one, as it's the biggest philosophical threat to her view.* *Make sure the "Competence" question clearly targets the is/ought gap.*

      *(Drafting the response based on these thoughts...)*
      *   Q1: The Collapse Objection (Unjust Roles).
      *   Q2: Role Conflict (Priority).
      *   Q3: Competence & Moral Smuggling.
      *   Q4: The Williams Challenge (Actual Motivations).
      *   Q5: Voluntary vs. Non-Voluntary Roles (Exit).
      *   Q6: The Conscientious Objector (Internal Critique).
      *   Q7: Fragmentation of Agency.
      *   Q8: The "Ought Implies Can" of Competence.

      *Wait, I need to make sure the follow-ups specifically address her tendency to say "norms are internal to the practice."*
      *   *Adjustment:* In the follow-ups, explicitly mention that move and ask why it saves her.

  6.  **Final Output Generation** (similar to the provided good response).
answer: |-
  Here are 8 pressing questions tailored to Dr. Voss's view, including specific follow-ups based on her likely defense that role-norms are internal to the practice.

  ### 1. The Collapse Objection
  **Question:** You argue that if a social role is structured by unjust norms, external reasons override the internal role-reasons. But doesn't the moment you appeal to an external standard to judge the role *as* unjust, you've conceded that the ultimate source of normativity is external? If the "internal" reason can be trumped by an external one, isn't "Role-Indexed Internalism" just Externalism with an extra step?

  **Follow-up:** *If she says the judgment of injustice comes from outside, but the motivating force remains internal:* "But if the motivating force to *reject* the role comes from an external moral truth, then the 'internal' part is only doing work when the role is already morally benign. Doesn't that make your internalism parasitic on the externalism you're trying to avoid?"

  ### 2. The "Competence" Smuggle
  **Question:** You ground reasons in what a "competent" role-filler would be motivated to do. But how do you define competence without smuggling in objective moral standards? If a "competent" mafioso is motivated to collect debts violently, do they have an internal reason to do so? If you say no, aren't you defining competence morally rather than functionally?

  **Follow-up:** *If she says competence is internal to the practice (e.g., chess has internal norms):* "Social roles aren't like chess; they aren't closed systems. If you say a 'competent parent' couldn't be motivated to abuse, you're defining the role by moral outcomes, not social facts. At what point does 'internal to the practice' just become a euphemism for 'morally acceptable'?"

  ### 3. Role Conflict and Priority
  **Question:** Let's talk about role conflict. I occupy the role of 'employee' and 'parent' simultaneously. If staying late makes me a competent employee but an absent parent, how does your view adjudicate this? Is there a 'meta-role' of being a person that ranks the others, or am I just a battlefield of competing internal reasons?

  **Follow-up:** *If she says we deliberate within the practices to find balance:* "But that deliberation itself requires a standpoint outside of both roles to weigh them. If that standpoint isn't itself a role, aren't you admitting we need a source of reasons that isn't role-indexed to solve role conflicts?"

  ### 4. The Williams Challenge (Actual Motivations)
  **Question:** Bernard Williams argued internal reasons must link to the agent's *actual* subjective motivational set via sound deliberation. You bypass actual desires entirely in favor of hypothetical role-motivations. If a parent feels *zero* pull to feed their child, in what sense is that reason "internal" to them? Are you redefining internalism so broadly it loses its distinctive psychological grip?

  **Follow-up:** *If she says the role constitutes the self, so the motivation is latent:* "But if the agent rejects that constitution—if they say 'I don't identify as a parent'—you still claim the reason binds them. That sounds like you're imposing a motivation they explicitly lack, which is the hallmark of externalism."

  ### 5. Exit Costs and Non-Voluntary Roles
  **Question:** Your view works best for voluntary roles, but what about non-voluntary ones like 'citizen' or 'daughter'? If I have an internal reason to obey the law because I'm a citizen, can I evade that reason by renouncing my citizenship? If you say no, doesn't that prove the reason comes from the moral weight of the obligation, not the internal logic of the role?

  **Follow-up:** *If she says some roles have high exit costs that bind us:* "Then the binding force isn't the internal motivation of the role-filler, it's the external difficulty of leaving. So again, the 'internal' label seems to be doing no heavy lifting in the hard cases."

  ### 6. The Conscientious Objector
  **Question:** Consider a soldier who refuses an order they deem immoral. On your view, are they acting incompetently as a soldier, or are they accessing an external reason? If you say they are being a 'competent moral agent' first, aren't you prioritizing a moral role over the social role, which begs the question of why the moral role gets priority?

  **Follow-up:** *If she says the norms of soldiering include moral constraints:* "Historically, the norms of soldiering often demand obedience above morality. If you insist the norms *should* include moral constraints, you're prescribing how the role ought to be, not analyzing the reasons generated by the role as it actually exists."

  ### 7. Fragmentation of Agency
  **Question:** If my reasons are indexed to specific roles, does this fragment my agency? Am I not a unified person, but just a bundle of role-specific motivations? If I have a reason qua father and a conflicting reason qua CEO, is there any sense in which *I* have a reason, or only *parts* of me?

  **Follow-up:** *If she says integration is a higher-order role:* "But who occupies that higher-order role? If it's just another role, we face an infinite regress. If it's just 'me,' then I exist prior to the roles, which suggests I have reasons that aren't role-indexed."

  ### 8. The "Ought Implies Can" of Competence
  **Question:** You say I have a reason if I would be motivated when competently performing my role. But what if I am psychologically incapable of performing that role competently? If I lack the empathy to be a competent parent, do I still have the internal reason? If yes, the reason is independent of my capacity; if no, you're saying some people have no reasons to be moral in their roles.

  **Follow-up:** *If she says competence is a normative ideal, not a psychological capacity:* "Then the reason isn't based on what I *would* do if competent, but what I *ought* to do. That shifts the view from a hypothetical psychological fact (internalism) to a normative demand (externalism)."
