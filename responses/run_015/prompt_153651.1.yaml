      *   **Thesis:** Schlick distinguishes Play (intrinsic end) vs. Work (means to end). The user argues this binary misses "Instrumentalized Absorption" (hybrid: feels like play/absorption, structurally like work/metrics). This causes meaning-erosion. Schlick needs a third term.
