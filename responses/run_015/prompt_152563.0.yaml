answer: |-
  Your frustration is well-founded. The literature on the New Riddle often proceeds as if the target is fixed, when in fact the target moves depending on whether the author is a metaphysical realist, a pragmatist, or a formalist. You are correct to suspect that the "mess" is not merely a lack of rigour, but a structural feature of the problem space.

  Below is the specification you requested, sorted by necessity, followed by an analysis of the tension you identified.

  ### The Specification of Adequacy

  To count as an adequate account of projectibility for a finite scientific inquirer, a theory must meet the following conditions. I have sorted these into **Non-negotiable** (failure here means the theory does not solve the New Riddle) and **Camp-Preference** (failure here means the theory belongs to a different philosophical tradition than you might prefer, but it still functions).

  #### Non-negotiable Requirements

  1.  **Derived Asymmetry (Case 1):** The account must discriminate between *green* and *grue* given identical evidence, without stipulating that *green* is projectible by fiat. The asymmetry must emerge from the theory's mechanics.
      *   *Case:* If the theory simply defines projectible predicates as "those that are green-like," it is a label, not a solution.
  2.  **Ordinal Invariance (Case 2):** The solution cannot rely essentially on *time* as a physical magnitude. It must handle "ordinal grue" (green if among the first *n* examined, blue otherwise).
      *   *Case:* Many early solutions appealed to the "future" being distinct from the "past." Ordinal grue shows the problem is about *unexamined instances*, not temporal ones. A theory that fails here solves a different riddle.
  3.  **Structural Isomorphism with Learning Theory (Case 3):** The account must yield the same verdict on the ML analogue (training vs. held-out split) as it does on grue.
      *   *Case:* If a theory says "bet on green" but cannot explain why a neural network should regularise against a "grue-like" loss function, it is disconnected from actual inductive practice. The structural problem is identical (overfitting).
  4.  **Permissive of Legitimate Time-Relativity (Case 4):** The account cannot ban time-indexed or stage-relative predicates outright.
      *   *Case:* "Phosphorescent" or "caterpillar" are projectible despite being stage-relative. A solution that bans all time-dependencies is too blunt for scientific use.
  5.  **Revisability (Case 5):** The account must allow for kind-splitting (jadeite/nephrite) and kind-merging. Entrenchment or priors must be updateable.
      *   *Case:* A theory that locks in current vocabulary forever fails to model scientific progress. A new theoretical predicate (e.g., *gene*) must be able to override an entrenched observational one (e.g., *trait*).
  6.  **Boolean Sensitivity (Case 6):** The account must explain why projectibility is not closed under Boolean operations (e.g., *green* is projectible, *grue* is defined via *green/blue*, yet *grue* is not).
      *   *Case:* If projectibility were closed under definition, any predicate could be made projectible. The theory must block this closure.
  7.  **Non-Vicious Circularity (Case 7):** The justification cannot rely on the *success* of past projections in a way that presupposes the validity of those projections.
      *   *Case:* "We should project *green* because projecting *green* has worked" is question-begging. Coherentist circles are acceptable; justificatory circles are not.
  8.  **Action-Guiding for the Agent (Case 8 & 9):** The theory must tell *this* inquirer what to bet *now*. It cannot be sceptical, nor can it be purely relativistic (i.e., "bet green if you speak English, grue if you speak Grue").
      *   *Case:* You specified the purpose is to guide a finite inquirer. A theory that says "both are valid relative to a framework" fails to guide action for an agent embedded in one framework.

  #### Camp-Preferences (The Source of the Mess)

  1.  **Language/Coordinate Neutrality:** The demand that the theory work regardless of the vocabulary or coordinate system used.
      *   *Camp:* Realists and Formalists often want this. Pragmatists (Goodman) reject it.
      *   *Verdict:* **Preference.** As you suspected, this is likely the source of the impossibility.
  2.  **Metaphysical Naturalness:** The demand that projectibility track mind-independent "joints of nature."
      *   *Camp:* Metaphysical Realists.
      *   *Verdict:* **Preference.** A pragmatic account can work without this ontology.
  3.  **Computational Tractability:** The demand that the inquirer can actually compute the projectibility score.
      *   *Camp:* Learning Theorists/Bayesians vs. Idealised Confirmation Theorists.
      *   *Verdict:* **Preference** (for ideal theory), but **Non-negotiable** for your specific "finite inquirer" purpose. I have included it in the spirit of your request, but note that Solomonoff induction fails this while satisfying others.

  ### The Impossibility Result: Your Hunch is Correct

  You suspected that a subset of these demands is jointly unsatisfiable. You are right. The tension lies specifically between **Derived Asymmetry** and **Language Neutrality**.

  Here is the logical knot: *Green* and *Grue* are syntactically symmetric. They are inter-definable. If your input is purely syntactic (evidence sentences) and your machinery is language-neutral (invariant under predicate permutation), your output *must* be symmetric. You cannot derive an asymmetry from a symmetry without introducing an asymmetry somewhere else.

  To solve the riddle, you must break the symmetry. Every existing theory does this by smuggling in a "Camp-Preference" as a non-negotiable axiom:
  *   **Goodman:** Breaks symmetry via *actual linguistic history* (Entrenchment). Sacrifices Language Neutrality.
  *   **Lewis/Armstrong:** Breaks symmetry via *metaphysics* (Natural Properties). Sacrifices Epistemic Accessibility (how do we know which are natural?).
  *   **Bayesians/ML:** Breaks symmetry via *priors/regularisation*. Sacrifices Objectivity (priors encode the answer).
  *   **Carnap:** Accepts the symmetry. Sacrifices Derived Asymmetry (confirmation is language-relative).

