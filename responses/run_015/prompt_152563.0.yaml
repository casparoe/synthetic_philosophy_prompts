ent, or a prior, or a simplicity metric, is cashed out in terms of past successful projection, that looks like it already presupposes projectibility — genuine regress, or a harmless fixed point? (8) the grue-speaking community, one that entrenched grue from the start: an account that merely relativises to whatever a community happens to have projected has, I think, stopped answering my question, but say whether that's a real desideratum or just my prejudice. (9) it can't be sceptical: an account on which nothing is ever projectible, or on which the new riddle is just the old Humean problem in costume, hasn't given me what I asked for.

