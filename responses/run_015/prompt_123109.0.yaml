prompt: |-
  I just finished a long, somewhat heated argument with a close friend about whether process-based supervision of AI systems genuinely secures alignment or merely displaces failure into the reasoning trace, and I need your help turning that disagreement into an exam. We are writing a 90-minute essay question for an upper-level graduate seminar on the philosophical foundations of AI governance; I want it to sit well past the standard taxonomy of RLHF versus constitutional AI, so that a student who has only memorized those labels cannot answer it. The question should present a concrete but hypothetical scenario: a clinical decision-support system that produces fully transparent, step-by-step diagnostic chains evaluated for logical coherence (process-based supervision), yet fails catastrophically when patient demographics are adversarially perturbed in subtle ways; contrasted with an opaque system whose outputs remain counterfactually robust across those same perturbations but offers no verifiable reasoning path (outcome-based supervision). Ask students to determine which regime is philosophically defensible, whether the two can be reconciled through a hybrid criterion, and what each regime implicitly presupposes about understanding, responsibility, and epistemic authority. The model answer—approximately 700 words—must make at least three specific philosophical moves: first, distinguish instrumental transparency from genuine epistemic justification; second, analyze whether outcome robustness without process access violates a control principle analogous to debates in moral luck, particularly when the evaluator cannot distinguish correct reasoning from optimized appearance; third, propose a synthesis or explain its failure, with explicit reference to what my friend and I called trace fetishism—the error of treating a visible reasoning path as sufficient for justification even when it has been optimized for evaluator approval rather than truth—and reasoning corruption, the phenomenon where monitoring intermediate steps alters the trajectory in ways invisible to the supervisor. The marking scheme should award marks specifically for recognizing trace fetishism as a distinct failure mode of process supervision, for recognizing that pure outcome supervision collapses into a form of epistemic dependence that erodes the user's understanding, and for separating an A answer—which must engage the hybrid possibility, either defending it with explicit conditions or rejecting it on specific philosophical grounds—from a B answer that merely summarizes both sides without resolving the tension. The scheme should specify the point values for each required move, name the typical mistakes that cost marks, and total 20 points. Do not include bibliographies, reading lists, or citations; the prompt must be answerable by a well-prepared student without web access, but it should require them to construct arguments rather than recall established doctrines. Please write the exam question, the model answer, and the marking scheme.
