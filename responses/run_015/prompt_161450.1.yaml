  Good evening. For those who don't know me, I'm the best person. I'm also not going to tell you what my brother feels. He works in behavior analysis; he'd call that unobservable data, and honestly, he'd be right. I can't see inside his skull. But I can see what he builds, and that is far more important.

  There's a theory about a ladder of minds. At the bottom, Darwinian creatures survive or don't. Above them, Skinnerian creatures learn from consequences—trial, error, feedback. My brother knows this terrain better than anyone. He knows we are shaped by what the world gives back. But he didn't stop there. He became Popperian. He let hypotheses die in his head so he wouldn't have to die in reality. He tested futures with her, running simulations of a life together before he committed to one.

  Then he became Gregorian, using cultural tools—words, calendars, promises—to think with. He didn't just feel love; he used the tools of love to build it. But today, we climb to the fifth rung. Our seminar called it the Austenian creature. This is where words don't just describe the world; they change it. Promising, marrying, naming. These aren't reports of inner states. They are tools bolted into reality.

  When he says "I do," he isn't revealing a feeling. He is installing a mechanism. And look around. You are the machinery. A promise only holds because a community holds it. We are the witnesses who keep the tool working. We are the structure that ensures the vow doesn't rust. Grandma, when you cry, you're lubricating the gears. It takes all of us to make a marriage real. It lives out there, between us, not just in here.

  He's spent his life studying contingencies, but today he commits to a reinforcement schedule that never extinguishes.

  To the bride: You haven't just captured his heart; you've become part of his environment in the best way. You are the context where he is his best self. Your family knows that love is work, it is land, it is showing up. He respects that. To my brother: You've built something observable, durable, and real. You've moved beyond what you think to what you do.

  So, let's raise a glass. Not to what you feel, which is private, but to what you do, which is public. Not to destiny, but to design. To the Austenian act. To the marriage.
