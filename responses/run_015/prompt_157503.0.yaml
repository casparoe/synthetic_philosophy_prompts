answer: |-
  The Director of the National Gallery stood before a wall that had previously housed a single, luminous Rothko. Now, it was plastered floor-to-ceiling with four million crayon sketches.

  "Each sketch," the Director explained, smoothing a particularly faint smudge, "possesses 0.0001 units of aesthetic merit. Technically positive. Technically art."

  The Head Curator gripped her clipboard. "But the Rothko had 1,000 units. And by covering it with these... smudges... the average quality of the collection has plummeted to near zero. No visitor will find this enjoyable."

  "Enjoyment is an average metric," the Director said, hanging another sketch. "I am tasked with maximizing Total Institutional Value. One Rothko yields 1,000 units. Four million sketches yield 400,000. The aggregate merit of this wing has increased by a factor of 400."

  "So you're claiming this wall is *better* than the Rothko?"

  "Statistically superior," the Director replied, stepping back to admire the sea of mediocrity. "We have successfully created the greatest museum in history. It's just that the greatness is now entirely independent of whether anyone actually wants to look at it."
