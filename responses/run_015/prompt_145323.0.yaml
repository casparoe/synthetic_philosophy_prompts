prompt: |-
  I'm writing the final exam for an upper-level seminar on self-reference and biological information. I need one essay question on the DNA--Gödel isomorphism that students cannot answer by reciting the standard analogy between genetic replication and formal self-reference. To force original analysis, embed the following specific scenario: imagine a replicating system in which the syntactic rules of transcription are not fixed but are altered during replication by stress-induced epigenetic feedback loops—specifically, a mechanism where environmental signals trigger transposon-mediated promoter rewriting, thereby changing which codon sequences are expressed and, in effect, allowing the system to modify its own formal rules in response to external conditions. Ask students to evaluate whether this biological capacity for self-modification strengthens, weakens, or breaks the isomorphism with Gödel's proof, paying particular attention to Gödel's requirement that a formal system have fixed axioms and inference rules, and to whether the phenotype (the "semantic" output) can genuinely refer back to the syntactic rules it has just altered.

  Please provide:
  (1) The exam question itself, suitable for a 75-minute response of about 800 words.
  (2) A model answer of roughly 600 words that takes a definite, argued position—do not produce a non-committal survey of options, but defend a clear verdict with reasons.
  (3) A marking scheme out of 20 marks, built around five specific intellectual moves a top answer must make, with marks allocated to each and a one-line note on the typical failure mode for that move. The scheme should reward commitment: answers that defend a specific interpretation of the isomorphism should score higher than those that merely list possibilities without choosing.
