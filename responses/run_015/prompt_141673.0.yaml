  ### Notes on how I built this

  **Candidate Distinctions & Cuts**
  I began with five possible axes of disagreement: (1) State Endorsement vs. Neutrality, (2) Funding vs. Regulation, (3) Universal vs. Selective Support, (4) Opt-in vs. Opt-out mechanisms, and (5) Symbolic vs. Material entanglement. I cut "Prayer in Schools" because students have memorized responses to it; it triggers culture-war reflexes rather than reasoning. I cut "Tax Exemptions" because the financial mechanics obscure the moral principle. I kept "Funding" and "Symbols" as distinct branches because a student might accept money for social services (Caritative) but reject religious symbols on public employees (Laïcité), or vice versa.

  **Empty Combinations**
  Two combinations turned out to be logically unstable. First, supporting the **Two-Key System** (state vets doctrine) while rejecting the **Exit-Fee Asymmetry** (hard to leave the system) is effectively coercion without escape; I marked this leaf as "Unnamed (Incoherent)." Second, supporting the **Silent Establishment** (official state church) while rejecting the **Zoning Privilege** (material support) is rare; it implies wanting the status without the substance. I labeled this "Unnamed (Cultural Establishment)."

  **Indistinguishable Leaves**
  I must flag that the **Principled-Pluralist** leaf and the **Unnamed (Reluctant Pluralist)** leaf may collapse in practice. Both accept state funding for religious social services (Caritative Carve-out) and reject state oversight (Two-Key). The only difference is whether they "approve" or "tolerate" the funding. In a voting booth, these two people look identical, even if their internal justifications differ (one sees it as a right, the other as a necessary evil).

  **Objection Mapping**
  *   **Coercion:** Tested at the Exit-Fee Asymmetry node.
  *   **Authority:** Tested at the Two-Key System node.
  *   **Message/Standing:** Tested at the Silent Establishment and Visible Symbol Ban nodes.
  *   **Money/Corruption:** Tested at the Zoning Privilege and Caritative Carve-out nodes.

