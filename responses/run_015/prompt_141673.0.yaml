  # Church & State: A Diagnostic Tree
  **Instructions:** Read each scenario. Decide if you **Approve** (it is just), **Tolerate** (it is flawed but acceptable), or **Reject** (it is unjust). Follow the arrows to your position.

  **1. The Silent Establishment**
  The state has an official religion mentioned in the constitution, but it is never preached in schools, used in courts, or funded by taxes. It is purely ceremonial.
  *   **Approve:** Go to **2**.
  *   **Tolerate:** Go to **2**.
  *   **Reject:** Go to **3**.

  **2. The Zoning Privilege**
  Religious buildings are exempt from property taxes and zoning limits, but secular clubs (like ethics societies) must pay and apply for permits.
  *   **Approve:** **Leaf 1: Establishmentarian.** (Awkward commitment: The state privileges theology over secular philosophy as a matter of law.)
  *   **Tolerate:** **Leaf 2: Unnamed (Cultural Establishment).** (Awkward commitment: You accept legal privilege for religion but deny it is a state endorsement.)
  *   **Reject:** Go to **3**.

  **3. The Mirror Rule**
  The state offers funding to any group teaching a "comprehensive doctrine of life," explicitly including atheistic and secular humanist organizations on identical terms to churches.
  *   **Approve:** Go to **4**.
  *   **Tolerate:** Go to **5**.
  *   **Reject:** Go to **6**.

  **4. The Exit-Fee Asymmetry**
  To avoid funding the Mirror Rule programs, citizens are automatically enrolled and must file a formal declaration, pay a small fee, and appear in person to opt out.
  *   **Approve:** **Leaf 3: Non-Preferentialist.** (Awkward commitment: You accept bureaucratic hurdles on conscience so long as all doctrines are funded equally.)
  *   **Tolerate:** **Leaf 4: Unnamed (Reluctant Pluralist).** (Awkward commitment: You accept equal funding but worry the opt-out process chills liberty.)
  *   **Reject:** **Leaf 5: Unnamed (Libertarian Separationist).** (Awkward commitment: You demand equal funding but refuse any administrative burden to avoid it.)

  **5. The Caritative Carve-out**
  The state contracts only with religious bodies to run food banks and hospitals at cost, under identical auditing rules, and pays for nothing else (no worship).
  *   **Approve:** Go to **7**.
  *   **Tolerate:** Go to **7**.
  *   **Reject:** **Leaf 6: Strict No-Aid Separationist.** (Awkward commitment: The state must run social services itself even if religious groups could do it cheaper.)

  **6. The Visible Symbol Ban**
  Public school teachers and judges are forbidden from wearing conspicuous religious symbols (like hijabs or large crosses) while on duty.
  *   **Approve:** **Leaf 7: Laïcité-Style Secularist.** (Awkward commitment: You prioritize the neutrality of the state's appearance over the individual's expression.)
  *   **Tolerate:** **Leaf 8: Unnamed (Soft Secularist).** (Awkward commitment: You accept symbol bans as a compromise but believe they are technically unjust.)
  *   **Reject:** Go to **7**.

  **7. The Two-Key System**
  To receive any state funding, a religious group needs a state board certification that it does not preach hatred, but the board is forbidden from judging theological truth.
  *   **Approve:** **Leaf 9: Unnamed (Statist Pluralist).** (Awkward commitment: You accept state officials vetting religious groups for safety, risking subtle doctrinal control.)
  *   **Tolerate:** **Leaf 10: Principled-Pluralist.** (Awkward commitment: You accept state associations but worry the veto power corrupts religious independence.)
  *   **Reject:** **Leaf 10: Principled-Pluralist.** (Awkward commitment: You support state associations but refuse any state oversight of internal life.)

  ***
  **Note on Collapsed Leaves:** Leaf 10 combines "Tolerate" and "Reject" answers because the practical difference between accepting a safety veto and rejecting it is often negligible if the veto is rarely used. Both land on the same political position: fund associations, keep hands off doctrine.
  **Country Illustrations:** *Leaf 1 resembles England. Leaf 3 resembles the US (idealized). Leaf 7 resembles France. Leaf 10 resembles Germany.*
