answer: |-
  **MEMORANDUM**

  **TO:** Assessment Panel, Composition Pathway
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Assessment Determinations: Cases J (Year 2) and P (Year 3)

  **1. Context and Regulatory Framework**
  This memo resolves the deadlock regarding submissions J and P. The panel is split between prioritizing *process ownership* (J) and *aesthetic outcome* (P). Our regulations require work to be "substantially the student's own" and demand the student "account for their musical decisions."

  We must be explicit: The Hofstadter "knob-twiddling" metaphor (creativity as defining dimensions of variation rather than merely varying them) is descriptive, not prescriptive. It explains why J's work feels like composition to half the panel, but it does not automatically disqualify P. P's selection of six pieces from nine hundred is itself a high-level dimensional choice. Therefore, the "knob" argument cannot be the sole basis for our ruling.

  The deciding factor must be the regulation regarding **accountability**. A composition degree certifies the ability to construct musical logic, not merely to curate sonic results. The distinction lies not in who built the tool, but in where the *intentionality* is encoded.

  **2. Case J: Second-Year Submission (Generative Model)**
  **Decision:** **PASS**

  **Reasoning:**
  J's submission locates the compositional act in the construction of the corpus and the topology of the latent space. While J cannot explain the mathematical causality of a specific chord at a specific coordinate (the "black box" problem), they can account for the *constraints* that made that chord possible. The model is not an external tool; it is an encoding of J's own prior musical logic.

  *   **Uncontroversial:** J built the training corpus and the model architecture. The selection process involved critical listening and arrangement for live ensemble.
  *   **Contested:** Whether navigating a probabilistic system counts as "accounting for decisions."
  *   **Resolution:** We accept that in AI-assisted workflows, "accounting for a decision" shifts from *causation* to *ratification*. J is responsible for the system's design and the curatorial filter. The inability to explain the micro-decision (the chord) is outweighed by the mastery of the macro-decision (the system).

  **3. Case P: Third-Year Submission (Randomized Presets)**
  **Decision:** **CONDITIONAL PASS (Subject to Viva Voce)**

  **Reasoning:**
  P's submission presents a higher regulatory risk. While the aesthetic result is superior (as noted in blind listening), the generative mechanism relies on commercial presets and randomization. Unlike J, P did not encode their own logic into the generator; they outsourced the logic to a vendor and introduced chance.

  *   **Uncontroversial:** P exercised curatorial judgment (selecting 6 from ~900).
  *   **Contested:** Whether curation alone satisfies "substantially the student's own" at Year 3.
  *   **Resolution:** Curation is a compositional act *only if* the criteria for selection are rigorous and defensible as a musical system. "I liked this one" is not a compositional decision; it is a consumer preference. To pass, P must demonstrate in a viva that their selection criteria constituted a coherent compositional logic (e.g., specific structural parameters, harmonic density thresholds) rather than aesthetic taste alone.
  *   **Condition:** P must submit a 1,000-word technical addendum and attend a 30-minute viva by **Friday, November 3rd**. If P cannot articulate a system behind the selection, the grade will be reverted to Fail.

  **4. Addressing the "Recombination" Objection**
  The panel objection that "all composition is recombination within a fixed space" is theoretically sound but pedagogically incomplete. It is true that a sonata form or a twelve-tone row is a "space" the student did not invent. However, traditional forms require the student to *manually negotiate* the transitions and logic within that space.

  *   **Where the objection lands:** It correctly identifies that J and P are working within constraints, as all composers do.
  *   **Where it fails:** It ignores the *locus of agency*. In traditional composition (and in J's case), the student determines the trajectory between points A and B. In P's case, the script determined the trajectory; the student only judged the destination. A degree in Composition must certify the ability to drive the trajectory, not just judge the scenery.

  **5. Consensus vs. Live Debate**
  To ensure transparency for the students and the panel, we must distinguish between institutional policy and open academic questions.

  *   **Consensus (Institutional):** The conservatoire assesses *process and accountability*, not just acoustic output. A student must be able to articulate the "why" of the work's structure.
  *   **Live Fight (Field-wide):** There is no consensus in the wider musical community on whether training a model on one's own work constitutes "authorship" of the output (Case J), nor on whether high-volume curation of algorithmic output constitutes "composition" (Case P). We are not settling this debate; we are applying our specific learning outcomes. We are ruling that **designing the generative logic (J)** meets the learning outcome of "constructing musical arguments," whereas **filtering random output (P)** does not, unless the filtering logic is itself systematic.

  **6. Action Items**
  1.  **J:** Grade submitted as Pass. Feedback should highlight the strength of the corpus design but note the risk of relying on opaque systems in future work.
  2.  **P:** Grade held in abeyance. Student notified of the Viva requirement immediately. The viva panel must include one member from the "Fail P" cohort and one from the "Pass P" cohort to ensure the "accountability" standard is applied without aesthetic bias.
  3.  **Panel:** We need to update the handbook. "Account for musical decisions" requires clarification in the age of generative tools. Does it mean "explain the code," "explain the training data," or "explain the selection criteria"? I recommend a working group be formed by December to draft this addendum.

  This ruling prioritizes the integrity of the "Composition" label over the immediate quality of the recording. It acknowledges J's labor in system-building while giving P a pathway to prove their curatorial work was compositional, not just editorial.

  **[Signature]**
