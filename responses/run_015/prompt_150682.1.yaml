answer: |-
  This is a remarkably sharp dissection of a specific dialectical move in the philosophy of mind. You have correctly identified that there is no single, canonical Latin term for this specific rhetorical structure (like *ad hominem* or *petitio principii*). However, the phenomenon you are describing is well-recognized, debated, and carved up by several overlapping concepts.

  Here is the breakdown of what this is, what it is near, and whether it constitutes genuine progress.

  ### 1. Is there a name for it?

  There is no single established label for the *move itself* (the claim that Mystery B is cheaper than Mystery A because the relata are homogeneous). However, the debate you are describing is universally indexed under two specific terms:

  **A. The Combination Problem (Person B's move)**
  This is the standard name for the objection to panpsychism. It was famously articulated by William James against "mind-stuff" theory: *"No possible number of entities... can sum themselves into a unity."* When Person B says, "You haven't solved it, you've just moved it," they are invoking the Combination Problem.

  **B. Explanatory Trade-off / Theoretical Virtue (Person A's move)**
  Person A is making a claim about **Inference to the Best Explanation (IBE)**. They are arguing that their theory possesses the theoretical virtue of **Continuity** (or *Naturalism*, in the sense of *natura non facit saltus*). They are arguing that an *emergent* gap (non-experience to experience) is metaphysically more costly than a *compositional* gap (experience to experience).

  **The closest existing label for your "Difficulty Laundering":**
  If you want a term that already exists in the literature that captures the *structural* suspicion you have, the closest fit is **The Homunculus Fallacy** (or *Homuncular Explanation*), though with a caveat.
  *   **The Fit:** A homunculus explanation explains a capacity (e.g., seeing) by positing a smaller agent with the same capacity (a little man inside the head looking at images). This is rejected because it pushes the mystery back a step without solving it.
  *   **The Difference:** A homunculus explanation is usually treated as a *reductio ad absurdum* (obviously false). Panpsychists argue their version is *not* fallacious because they aren't positing a "little man" with full cognition, but a fundamental proto-experience. They claim it is a *feature*, not a bug, that the relata are the same kind.

  Your term, **"Difficulty Laundering,"** is actually more precise for the specific rhetorical move of claiming the new mystery is "cheaper" without an external exchange rate. I suspect it will stick in your own vocabulary because the literature lacks a specific term for *quantifying the cost of explanatory gaps*.

  ### 2. Analysis: Is relocating a mystery onto relata of the same kind ever genuine progress?

  You asked: *"Is relocating a mystery onto relata of the same kind ever genuine progress... and what would have to be true for it to be?"*

  Yes, it can be genuine progress, but only under specific conditions that panpsychism currently fails to meet.

  **When it IS progress (The Physics Model):**
  Consider the explanation of **Heat**.
  *   *Old Mystery:* How does "caloric fluid" produce the sensation of hotness?
  *   *New Explanation:* Heat is mean kinetic energy of molecules.
  *   *The Shift:* We explained a macro-property (temperature) by micro-properties (motion).
  *   *Why it worked:* We had **independent access** to the micro-level. We could measure molecular motion without relying on the concept of heat. The "composition" rules (statistical mechanics) were mathematically formalized and yielded new predictions.

  **When it IS NOT progress (The Panpsychism Model):**
  *   *The Shift:* We explain macro-consciousness by micro-consciousness.
  *   *Why it stalls:* We lack **independent access** to the micro-level. We cannot measure "electron experience" without already assuming the theory is true.
  *   *The "Exchange Rate" Problem:* You noted that the measuring stick comes from inside the picture. In physics, the "cost" of the explanation is audited by prediction. In panpsychism, the "cost" is audited by *intuition*. Person A says "Continuity is intuitive." Person B says "Subjects don't sum." There is no external arbiter.

  **Condition for Genuine Progress:**
  For Person A's move to be genuine progress rather than difficulty laundering, one of two things must happen:
  1.  **Formalization:** A rigorous logic of "phenomenal composition" must be developed that shows *how* subjects combine, analogous to how arithmetic shows how numbers combine. (Currently, this does not exist; it is the "Phenomenal Bonding Problem.")
  2.  **Independent Detection:** We must find a way to detect the micro-experience that does not rely on inferring it from our own macro-experience.

  Until then, your suspicion is correct: the claim that "like-to-like is easier" is an **axiological assertion** (a claim about value/simplicity), not an **explanatory derivation**.

  ### 3. Are your two instances the same phenomenon?

  **Yes.** Instance 1 (Panpsychism/Combination) and Instance 2 (Cosmopsychism/Decomposition) are structurally identical. They are inverse sides of the **Unity Problem**.

  *   **Instance 1:** How do many become one? (Summing)
  *   **Instance 2:** How does one become many? (Partitioning)

  Both defenders use the exact same "Difficulty Laundering" defense:
  *   **Panpsychist:** "Summing is easier because physics shows parts make wholes." (Ignoring that physics parts don't have *subjectivity*).
  *   **Cosmopsychist:** "Partitioning is easier because split-brains show subjects can divide." (Ignoring that split-brains are physical divisions of an *already existing* biological subject).

  In both cases, they point to **physical** composition/decomposition to justify **phenomenal** composition/decomposition. This is the core of your critique: they are borrowing the "easiness" from the physical domain to pay for a debt in the phenomenal domain, without showing the exchange rate is valid.

  ### 4. Nearby Concepts and Distinctions

  You asked for the carving, not just the label. Here is how your "Difficulty Laundering" differs from nearby fallacies:

  | Concept | Definition | Why it's not quite your phenomenon |
  | :--- | :--- | :--- |
  | **Begging the Question** | Assuming the conclusion in the premise. | Person A isn't assuming macro-consciousness exists; they are assuming *fundamental* consciousness exists. The conclusion (macro-consciousness) is derived, not assumed. |
  | **Motte-and-Bailey** | Retreating to a defensible position when challenged, then re-asserting the bold claim. | Person A isn't retreating. They are holding the line that their "hard step" is objectively easier. |
  | **Infinite Regress** | Explaining X by Y, which requires Z, ad infinitum. | Panpsychism stops at the fundamental level. It's a one-step shift, not an infinite chain. |
  | **Explanatory Idleness** | A hypothesis that does no work. | Panpsychism *does* work (it removes the emergence gap). The dispute is about whether it creates a new, worse gap. |

  **The Best Fit:**
  This is a dispute over **Brute Fact Minimization**.
  Every metaphysical theory eventually hits a "brute fact" (something that just *is*, with no further explanation).
  *   **Physicalism's Brute Fact:** Consciousness emerges from non-conscious matter (The Hard Problem).
  *   **Panpsychism's Brute Fact:** Micro-experiences combine into macro-subjects (The Combination Problem).

  Person A is arguing: *My brute fact is smaller.*
  Person B is arguing: *Your brute fact is just as big, but less visible.*

  There is no "Brute Fact Meter." This is why you feel they are talking past each other. They are disagreeing on the **aesthetics of mystery**.

  ### 5. The Honest Answer & Uncertainty

  You asked for the honest answer and what would change my mind.

  **Where I might be wrong:**
  I am analyzing this based on the current state of philosophical literature (2024). It is possible that a formal logic of phenomenal composition *is* developed in the future. If a panpsychist produces a mathematical formalism where `Subject A + Subject B = Subject C` is as rigorous as `1 + 1 = 2`, then Person A's claim that "it's just composition" becomes empirically/testably true, not just an intuition.

  **What would change my mind:**
  1.  **Formalization:** If the "Combination Problem" is solved formally (e.g., via Integrated Information Theory or similar frameworks that successfully derive unity from parts without circularity), then the "Difficulty Laundering" charge fails. The difficulty would no longer be laundered; it would be calculated.
  2.  **Phenomenal Laws:** If we discover "psychophysical laws" that govern how experience combines, distinct from physical laws, then the claim that "experience composes" moves from an intuition to a law of nature.

  **Where my reasoning is most likely to fail:**
  I am treating "explanatory gap size" as if it *should* be objective. It is possible that in metaphysics, **theoretical virtue is inherently subjective**. If "Continuity" is a valid theoretical virtue (like Simplicity), then Person A is not laundering difficulty; they are correctly applying a virtue.
  *   *Counter:* Simplicity is usually about *ontology* (number of entities), not about the *mystery of relations*. Panpsychism increases ontological complexity (everything is conscious) to reduce relational mystery (no emergence). Whether that trade is "worth it" may be a matter of philosophical taste, not logic.

  **Conclusion:**
  You have identified a real, unnamed rhetorical structure. It is a **Claim of Comparative Explanatory Cost** based on **Categorical Continuity**, which cannot be externally audited because the "currency" (phenomenal mystery) is private.

  "Difficulty Laundering" is an excellent term for it. It captures the sense that the *total amount of mystery* in the system remains constant, but is being moved to a place where the theorist hopes you won't look as closely, using a currency only they can spend.

  The phenomenon is real. The lack of a name is due to philosophy's inability to quantify "mystery." You have effectively pointed out that panpsychism relies on an **unfalsifiable exchange rate** between physical complexity and phenomenal unity.
