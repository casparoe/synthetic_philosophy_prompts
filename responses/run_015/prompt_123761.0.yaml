  **Hilbert's Grand Hotel**  
  **Location:** Transfinite District, Sector ℵ₀  
  **Verdict:** Always full, always accepting.

  Don't be alarmed if the front desk informs you the hotel is at 100% capacity upon arrival. This is a permanent state of affairs, not a booking error. Local custom dictates that when a new guest checks in, the manager simply asks every current occupant to move to the room number directly above their current one. Guest in 1 moves to 2, 2 to 3, and so on. While logically sound, this practice causes significant friction during peak season. You may hear thumping from the ceiling as entire wings shift simultaneously.

  Outside the revolving doors, you'll likely encounter the Finitist Protest League. They carry placards arguing that the hotel possesses only *potential* infinity—meaning it can always grow, but never actually *be* infinite. The management ignores them, insisting on a "completed occupancy" model. The philosophical tension is palpable; the booking algorithm seems to run on a server that doesn't exist yet. Is the hotel full, or just full-for-now? The manager will tell you the rooms are all there, waiting. The protesters claim you're walking into a void.

  **Tourist Tips & Amenities**  
  Requesting a prime-numbered floor is popular among number theory enthusiasts, but beware the rebooking strategy. If you ask for a specific rational allocation, the manager may perform a diagonalization maneuver to show you that your requested suite overlaps with an uncountable set of existing reservations. Essentially, they'll prove your room exists outside the standard booking grid. It's impressive, but often results in you being relocated to a corridor that hasn't been constructed.

  The lobby's 'Aleph-Null' coffee bar is a frequent site of dispute. The menu promises an infinite variety of blends, but constructivist guests argue the barista only serves a countable number of cups per hour. One concerned guest, staying in Room 4, noted, "The Cantor Suite is vaporware. You can't constructively reach the end of the menu, so does the latte actually exist?"

  Regarding the loyalty program: points are accrued only for stays involving finite room keys. If your key card displays a transfinite ordinal, don't bother swiping. The system rejects metaphysical currency. Also, avoid asking for the top floor. There isn't one, and the elevator music loops forever without resolving.

  ***

  **SIDEBAR: National Infinity Day**  
  **When:** The last day of the calendar (which never arrives)  
  **Where:** The Grand Lobby  

  Celebrating the founder's vision of completed sets, this holiday features the traditional "Shifting of the Guests." At noon, every occupant must vacate their room and move to room $2n$. This clears all the odd-numbered rooms for a parade of new arrivals representing the infinite subsets of nature. It's a chaotic spectacle of luggage carts and existential dread. Finitists usually boycott the event, claiming the parade route is infinitely long but never actually traversed. Management offers complimentary champagne to anyone who can prove the continuum hypothesis during the toast, though no one has claimed the prize yet. Dress code is formal; reality is optional.
