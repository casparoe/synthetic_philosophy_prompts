answer: |-
  ### Case Study: The Orthos Regulatory Mandate

  **The Scenario**
  Consider a hypothetical regulatory body, the *Orthos Authority*, governed by a constitutional rule known as the "Rolling Mandate." The Mandate is the singular source of legal sovereignty for the institution. The rules of succession are strict:
  1.  **Total Discontinuity:** The Mandate is held for exactly 24 hours by a single individual.
  2.  **No Material Substrate:** There is no physical token (no seal, ring, or document) passed between holders. Authority is transferred solely via a digital cryptographic handshake that erases the predecessor's access completely.
  3.  **No Psychological Overlap:** The holders (Person A, Person B, Person C...) are distinct individuals with no shared memories, biological matter, or spatial extension.
  4.  **Relational Definition:** The Mandate is defined *exhaustively* by the relational structure: "The entity currently possessing the cryptographic authority to issue binding decrees."

  At $t_1$, Person A holds the Mandate. At $t_2$, Person B holds the Mandate. There is no physical or psychological continuity between A and B; the only link is the institutional rule that B follows A.

  ---

  ### The Endurantist Commitment
  Endurantism (or three-dimensionalism) posits that persisting entities are **wholly present** at every moment of their existence. For the Endurantist, the Orthos Mandate ($M$) is a single, numerically identical entity at $t_1$ and $t_2$.
  *   $M$-at-$t_1$ is strictly identical to $M$-at-$t_2$.
  *   $M$ does not have temporal parts; it exists in its entirety at each instant.

  ### The Conceptual Issue: The Problem of Unanchored Haecceity

  The specific tension arises because endurantism typically relies on some form of **substrate continuity** (matter, substance, or immanent form) to ground numerical identity through qualitative change. In the Ship of Theseus, even if planks are replaced, there is a continuous spatiotemporal path of wood. In the Orthos Mandate, there is **no substrate**.

  If $M$ is wholly present at $t_1$, its entire being is exhausted by the relational fact "Authority vested in A." If $M$ is wholly present at $t_2$, its entire being is exhausted by "Authority vested in B." Since A and B share no matter, space, or psychology, the *constituents* of $M$'s presence at $t_1$ are entirely disjoint from the constituents of $M$'s presence at $t_2$.

  This creates an **Ontological Vacuum** for the Endurantist, leading to a trilemma:

  1.  **The Contradiction of Intrinsic Properties:**
      If the Mandate is defined purely by who holds it, then at $t_1$, $M$ has the intrinsic property *being-vested-in-A*. At $t_2$, $M$ has the intrinsic property *being-vested-in-B*. Since A and B are distinct, these are contradictory properties. The Endurantist usually solves this by time-indexing properties (e.g., *being-vested-in-A-at-$t_1$*). However, without a material substrate to bear these indexed properties, the "bearer" becomes elusive. What is the *subject* that is "vested-in-A-at-$t_1$" and "vested-in-B-at-$t_2$" if not the people themselves? If it is not the people, it must be something else.

  2.  **Fragmentation (The Collapse into Succession):**
      To avoid positing a mysterious bearer, the Endurantist might argue that the Mandate at $t_1$ and the Mandate at $t_2$ are actually distinct entities linked by a causal chain. But this abandons endurantism. It admits that $M$-at-$t_1$ $\neq$ $M$-at-$t_2$, which means the Mandate does not *endure*; it *perdures* (or ceases to exist and is replaced). This violates the core endurantist commitment to strict numerical identity over time.

  3.  **The Immaterial Essence (The "Institutional Ghost"):**
      To maintain that $M$ is wholly present and numerically identical despite total constitutive discontinuity, the Endurantist is forced to posit that the Mandate is a **bare particular** or a *sui generis* immaterial substance that "jumps" from A to B. This entity has no physical properties of its own; its only identity condition is the institutional rule. This creates a metaphysically bloated ontology where "social objects" float free of physical realization, possessing a *haecceity* (this-ness) completely unmoored from any qualitative continuity. The Mandate becomes a transcendent essence that inhabits hosts sequentially, which strains the endurantist preference for immanent, concrete particulars.

  **Why this differs from the Ship of Theseus:**
  In the Ship of Theseus, the puzzle is about *how much* change an underlying substrate can withstand. In the Orthos Mandate, there is *no* underlying substrate to withstand change. The difficulty is not about degree of replacement, but the **absence of a persisting bearer**. Endurantism struggles to explain *what* is enduring when the only thing persisting is an abstract rule, not a concrete particular.

  ---

  ### The Perdurantist Contrast

  Perdurantism (or four-dimensionalism) treats the Orthos Mandate as a **spacetime worm** composed of temporal parts.

  *   **Temporal Parts:** The Mandate has a temporal part at $t_1$ (Mandate-stage-A) and a temporal part at $t_2$ (Mandate-stage-B).
  *   **Identity:** Mandate-stage-A is *not* numerically identical to Mandate-stage-B. They are distinct slices of the same four-dimensional aggregate.
  *   **Resolution of Tension:** The contradiction of properties vanishes. Mandate-stage-A has the property *being-vested-in-A*. Mandate-stage-B has the property *being-vested-in-B*. There is no single entity that possesses both contradictory properties; rather, different parts of the entity possess different properties.
  *   **Glue:** The unity of the Mandate is not grounded in a shared substrate or an immaterial essence, but in **causal and conventional continuity** between the stages. The rule "B follows A" provides the gen-identity relation that binds the temporal parts into a single worm.

  For the Perdurantist, the total discontinuity of the holders is irrelevant to the persistence of the Mandate, just as a road can persist even if the asphalt composition changes completely from one mile to the next. The Mandate persists because the *stages* are appropriately related, not because a "wholly present" essence survives the transition.

  ### Conclusion

  The Orthos Mandate highlights a vulnerability in endurantism when applied to non-material, structurally defined entities. By insisting the Mandate is **wholly present** at each stage, the Endurantist must explain what grounds the numerical identity of the Mandate when its physical realization is completely replaced. They are forced to choose between denying the identity (fragmentation), accepting contradictory properties, or positing an unobservable immaterial essence. The Perdurantist avoids this by locating the identity in the **continuity of the process** (the fusion of stages) rather than the **identity of the substance** (the wholly present object), thereby accommodating the substrate-free nature of institutional reality without metaphysical excess.
