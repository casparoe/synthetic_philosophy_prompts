      To: All Staff
      From: People Ops & Model Alignment
      Date: October 24, 2024

      People Ops is pleased to announce the adoption of the Cognitive Competency Architecture (CCA). This framework aligns human and synthetic career pathways using a established cognitive taxonomy. By standardizing how we evaluate mind-types, we ensure scalable growth across biological and silicon substrates.

      **Tier 1: Darwinian (Pre-Provisioned Fitness)**
