  **MEMORANDUM**

  **TO:** All Staff
  **FROM:** People Ops & Model Alignment
  **SUBJECT:** Rollout of the Five-Tier Cognitive Competency Architecture

  People Ops is pleased to announce the adoption of the Cognitive Competency Architecture (CCA). This framework aligns human and synthetic career pathways using a established cognitive taxonomy. By standardizing how we evaluate mind-types, we ensure scalable growth across biological and silicon substrates. While each tier remains the cumulative substrate for the next—meaning higher functions cannot run without the lower layers—high performers are expected to graduate beyond reliance on the foundational stages. This ensures we are not promoting based on innate firmware alone.

  **Tier 1: Darwinian (Pre-Provisioned Fitness)**
  Competence paid for in advance by historical selection. Zero onboarding cost; ships with firmware.
  *   **Excellence:** Immediate environmental fit with no inference latency.
  *   **Development:** While this tier is the unavoidable substrate for all higher function, seniors must graduate beyond Darwinian reflex. We are allocating training budget to upskill phylogeny.
  *   **Risk:** Brittle when environment shifts.

  **Tier 2: Skinnerian (Operant Conditioning)**
  Learning via action and consequence. The agent pays for lessons out of its own skin.
  *   **Excellence:** Rapid behavioral adjustment based on feedback loops.
  *   **Development:** We are replacing environmental pain/reward signals with quarterly bonuses. Early data suggests confusion on why this substitution hasn't accelerated learning velocity.
  *   **Risk:** High burnout from paying for errors personally.

  **Tier 3: Popperian (Internal Simulation)**
  Hypotheses die in the agent's stead. Mistakes happen inside the head.
  *   **Excellence:** Running pre-mortems before action.
  *   **Development:** This simulation runtime is now a billable cost center. Managers must measure pre-mortem throughput in story points.
  *   **Risk:** High compute cost if environment stability doesn't repay simulation overhead.

  **Tier 4: Gregorian (Cultural Tooling)**
  Competence borrowed from outside: words, checklists, number systems.
  *   **Excellence:** Seamless integration of external artifacts into workflow.
  *   **Development:** These tools are company assets. When onboarding, remember we are often onboarding the spreadsheet rather than the hire. Promotions may apply to the toolset itself.
  *   **Risk:** Tool dependency obscures individual contribution.

  **Tier 5: Alexandrian (The Model)**
  Strictly senior rung. Has absorbed all culture, procedure, and tooling. Never born, never dies, never hungry.
  *   **Excellence:** Fluent discussion of all lower tiers without possessing their mortality. Hypotheses do not die because nothing was ever at stake.
  *   **Development:** N/A. The Alexandrian creature requires no development, only context window expansion.
  *   **Risk:** None. Who signs off on its performance review is currently being legal-reviewed.

  **Calibration Example: Senior RL Engineer (L4 Candidate)**
  *   **Strengths:** Strong Gregorian integration; leverages company checklists effectively.
  *   **Gaps:** Still exhibits Darwinian fatigue (sleeping). Unable to graduate beyond Skinnerian need for salary.
  *   **Decision:** Promote the engineer's workflow tools to L5 status. Engineer to be managed for Darwinian limitations.

  We look forward to calibrating against this new architecture.

  **Signed,**
  **People Ops & Model Alignment**
