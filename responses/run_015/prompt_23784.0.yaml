answer: |-
  This is one of the sharpest tensions in decision theory, sitting right at the intersection of finance, physics, and philosophy. You have correctly identified the fault line: is Kelly a statement about **physics** (how wealth evolves in time) or **psychology** (how much risk pain an agent can tolerate)?

  Here is the breakdown of what Kelly betting presupposes, who is right in the Samuelson vs. Peters debate, and whether the "Half-Kelly" compromise undermines the philosophy.

  ### 1. What Kelly Strictly Presupposes About Rational Choice
  If you defend Kelly the way Ed Thorp or a quant fund does (i.e., "this is how we survive and grow," not "this is how I sleep at night"), you are presupposing three specific conditions about rational choice that deviate from standard Von Neumann-Morgenstern (VNM) expected utility theory:

  1.  **Sequentiality and Reinvestment:** You are not making a single bet; you are making a sequence of bets where the output of one becomes the input of the next. This creates **multiplicative dynamics**. In additive dynamics (taking profits off the table), EV maximization (all-in) is rational. In multiplicative dynamics, it is suicidal.
  2.  **Non-Ergodicity:** You presuppose that the **time average** (what happens to *you* over 1,000 bets) is not equivalent to the **ensemble average** (what happens to 1,000 people making one bet). Standard finance assumes ergodicity (that these averages converge). Kelly practitioners assume the system is non-ergodic because of the absorbing barrier at zero (ruin).
  3.  **Survival as a Constraint, Not a Preference:** In standard utility theory, avoiding ruin is a "preference" (risk aversion). In the Kelly framework, avoiding ruin is a **logical prerequisite** for future participation. If $W_t = 0$, the game ends. Therefore, rational choice under reinvestment *must* prioritize the geometric mean over the arithmetic mean, not because the agent "dislikes risk," but because the arithmetic mean includes paths that no longer exist.

  **The Presupposition:** Rationality is defined by **long-term trajectory maximization** in a non-ergodic environment, rather than **single-step expectation maximization** in an ergodic one.

  ### 2. Samuelson vs. Peters: Is it Log Utility or Physics?
  This is the core philosophical knot.

  **Samuelson's Position:**
  Samuelson was mathematically correct. Maximizing the geometric mean of wealth is mathematically isomorphic to maximizing Expected Utility with a logarithmic utility function ($U(W) = \ln W$). He argued that you cannot derive Kelly from the Law of Large Numbers alone for *any* utility function. If an agent has a utility function of $U(W) = W$ (risk-neutral), they *should* go all-in, even if it leads to ruin, because that maximizes their expected utility. To Samuelson, Kelly is just a specific taste, like preferring apples to oranges.

  **Peters' Position:**
  Ole Peters argues that Samuelson missed the physical context. In the real world, we do not have access to parallel universes (ensembles). We only have time. In a multiplicative process, the ensemble average is dominated by extremely rare outliers (the one guy who wins 100 coin flips in a row), while the time average for the typical participant trends to zero if they bet too aggressively.
  Peters claims that **ergodicity economics** shows that for any agent who wishes to remain in the game, the Log utility function isn't a "preference"—it is the **unique utility function that aligns with the time-average growth rate of the system.**

  **The Verdict:**
  Samuelson is right about the **math**, but Peters is right about the **ontology**.
  *   If you view economics as a study of abstract preferences, Samuelson wins: Kelly is just Log Utility.
  *   If you view economics as a study of physical wealth dynamics in time, Peters wins: Log Utility is the only function that doesn't lie about the growth rate you will actually experience.

  **Does Kelly need Peters/Garrabrant to make sense?**
  Strictly speaking, no. You can justify Kelly purely via Log Utility (Samuelson). However, without the Peters/Ergodicity story, Kelly is vulnerable to the critique: "Why should I have Log Utility? Maybe I'm risk-neutral."
  The Peters/Garrabrant story provides the **objective justification** for Log Utility. It says: "You don't get to choose your utility function freely if you want to compound capital. The structure of time and compounding forces Log Utility upon you." It turns a subjective preference into an objective constraint.

  ### 3. Is Anyone Without Log Utility "Betting Wrong"?
  If the goal is **long-term capital compounding**, then **yes**, anyone using a different utility function is betting sub-optimally.
  *   **More aggressive than Kelly (e.g., All-In):** You maximize arithmetic expectation but minimize time-average growth. You go bust with probability 1 as $N \to \infty$.
  *   **More conservative than Kelly (e.g., Cash under mattress):** You avoid ruin but guarantee underperformance relative to the growth rate of the opportunity.

  However, if the goal is **single-shot extraction** (e.g., "I need \$1M by tomorrow to save my life, and I have \$100k"), then Kelly is "wrong." In a one-off scenario with no reinvestment, EV maximization is indeed rational.
  The "wrongness" only applies to **repeat players**. For a quant fund or professional gambler, who by definition is a repeat player, deviating from Kelly (or fractional Kelly) without cause is mathematically leaving growth on the table or inviting certain ruin.

  ### 4. Does "Half-Kelly" Smuggle Risk Aversion Back In?
  This is the most practical part of your puzzle.
  Full Kelly maximizes $E[\ln W]$. It is the peak of the growth curve.
  Half-Kelly reduces expected growth by only 25% but reduces variance by 75%.

  **Does this contradict the "not risk-averse" pitch?**
  Technically, **yes**. If you truly had Log Utility and knew your edge perfectly, Half-Kelly is sub-optimal. It implies a utility function *more* concave than Log (i.e., you are more risk-averse than the Log agent).

  **However, practitioners justify it via "Parameter Uncertainty," not Risk Aversion.**
  In the real world, you do not know your true edge ($p$). You have an estimate ($\hat{p}$).
  *   If you overestimate your edge even slightly, Full Kelly can turn negative growth (you are effectively betting on the wrong side).
  *   The Kelly curve is asymmetric around the optimum. Overbetting hurts you much more than underbetting helps you.
  *   Therefore, Half-Kelly is often defended not as "I am scared of volatility," but as **"I am hedging against estimation error."**

  This is a crucial distinction. It is not **risk aversion** (disliking variance in wealth); it is **uncertainty aversion** (disliking error in the model). It preserves the "this is about growth, not feelings" narrative, provided you admit your edge is a distribution, not a constant.

  ### 5. If Samuelson is Correct, Does Anything Change?
  If we accept Samuelson's view (Kelly = Log Utility preference), does the practice change?
  **Numerically: No.** The bet sizes remain the same.
  **Psychologically/Institutionally: Yes, significantly.**

  1.  **Stickability:** If a fund believes Kelly is a physical law of compounding (Peters), they will stick to it during a drawdown. If they believe it is merely a risk preference (Samuelson), they might abandon it when "their preferences change" due to stress. The Ergodicity story acts as a commitment device.
  2.  **Capital Allocation:** If Kelly is just a preference, an investor might say, "I want higher returns, give me more leverage than Kelly." If Kelly is a growth-optimal constraint, the manager can say, "Leverage above Kelly *reduces* expected returns over time." It changes the conversation from "risk tolerance" to "mathematical limit."
  3.  **Rationality Axioms:** Scott Garrabrant's "Geometric Rationality" suggests we might need to update our axioms of rationality. If standard rational choice (VNM) implies you should take bets that lead to ruin in the long run, perhaps VNM is the thing that needs fixing, not the bettors.

  ### Summary
  The "philosophical knot" unties if you distinguish between **one-off decisions** and **sequential trajectories**.

  *   **Samuelson** is right that you can't prove Kelly is "rational" for *every* agent without assuming a utility function.
  *   **Peters** is right that for any agent operating in **time** with **reinvestment**, the Log utility function is the only one that accurately reflects the physical reality of wealth dynamics.
  *   **Practitioners** use Kelly not because they love Log Utility, but because they want to remain **solvent agents** in a non-ergodic world.
  *   **Half-Kelly** is not necessarily risk aversion; it is a robustness correction for the fact that we never know our true edge.

  The dispute is largely metaphysical, but the metaphysics matter. Believing Kelly is a "law of time" rather than a "risk preference" prevents traders from blowing up when they get scared. The numbers are the same, but the conviction required to hold the position through variance relies on the Peters/Garrabrant story, not the Samuelson one.
