          *   The "costume" matters because it prevents managers from abandoning the strategy during drawdowns.

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction on Samuelson:* Samuelson didn't just say "it's log utility." He argued against the fallacy that the Law of Large Numbers makes the geometric mean dominate for *any* utility function in the long run. He was fighting the idea that "long run" automatically justifies Kelly for everyone.
