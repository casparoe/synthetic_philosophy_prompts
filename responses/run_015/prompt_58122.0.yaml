answer: |-
  Here is the operational checklist derived from the "justified belief" standard, stripped of philosophy and built for liability protection.

  ### The Assertion Safety Check (ASC)

  **Step 1: The Source Test**
  *   **Question:** Do I have this answer written in our approved Knowledge Base (KB) or on an official IRS/.gov page that I can link *right now*?
  *   **Yes:** Proceed to Step 2.
  *   **No:** **STOP.** Do not assert. You may say, "I don't have that confirmed in our official resources," and escalate.
  *   *Good Enough:* A searchable KB article or a URL. "I read it yesterday" or "I know this from training" is **not** good enough.

  **Step 2: The Scope Test**
  *   **Question:** Am I explaining how to use the app/form, or am I interpreting tax law/liability for them?
  *   **Yes (App/Form):** Proceed to Step 3.
  *   **No (Law/Liability):** **STOP.** This is tax advice. You must escalate to a licensed reviewer.
  *   *Good Enough:* "This box is for X" is okay. "You don't need to file this box" is usually not okay unless the KB explicitly says "Users in situation X do not file Box Y."

  **Step 3: The Variable Test**
  *   **Question:** Does this outcome depend on information I cannot see (e.g., IRS processing queues, unseen income sources, state-specific nuances not in the KB)?
  *   **Yes:** **STOP.** Do not assert a definitive outcome. Use qualifying language ("Usually," "Typically") or escalate.
  *   **No:** Proceed to Step 4.
  *   *Good Enough:* You have all relevant data points in the chat transcript and the rule is binary (e.g., "If income < $12k, no filing required").

  **Step 4: The Promise Test**
  *   **Question:** Am I guaranteeing a result (money received, penalty waived, date arrived)?
  *   **Yes:** **STOP.** Remove the guarantee.
  *   **No:** You may assert the information with the source linked.
  *   *Good Enough:* "Based on IRS guidelines [Link], refunds typically issue in 21 days." **Not** "You will get money Friday."

  ***

  ### Case Run-Throughs

  **1. Maya (The Memory Match)**
  *   **Step 1 (Source):** **FAIL.** She remembers the gist but has no link. Memory is not a source.
  *   **Step 2 (Scope):** Pass (Eligibility info).
  *   **Step 3 (Variable):** Pass (IRS FAQ is generally static).
  *   **Step 4 (Promise):** Pass.
  *   **Verdict:** **Do not assert.** Even though she is right, she cannot pass the Source Test.
  *   **Action:** She must say, "Let me verify the specific IRS guidance for you," find the link, and *then* send it. If she can't find it in 2 minutes, escalate. The risk of her remembering slightly wrong is higher than the risk of a 5-minute delay.

  **2. Luis (The Script Conflict)**
  *   **Step 1 (Source):** **FAIL.** His own math is not an approved source; the script says escalate.
  *   **Step 2 (Scope):** **FAIL.** Calculating penalties is interpreting liability (Tax Advice).
  *   **Step 3 (Variable):** **FAIL.** He missed the part-year residency box.
  *   **Step 4 (Promise):** **FAIL.** Saying "You owe no penalty" is a guarantee of liability.
  *   **Verdict:** **Hard Stop.** This is the exact scenario that gets companies sued.
  *   **Action:** Escalate immediately. Tell the customer, "Penalty calculations require a specialist review due to residency variables." Do not yield to begging.

  **3. Priya (The QA Pressure)**
  *   **Step 1 (Source):** **FAIL.** There is no source that guarantees a specific refund date for an individual.
  *   **Step 2 (Scope):** Pass (General info).
  *   **Step 3 (Variable):** **FAIL.** IRS processing times are external variables she cannot see.
  *   **Step 4 (Promise):** **FAIL.** "Definitely be there by Friday" is a guarantee.
  *   **Verdict:** **Do not assert.** Your QA team is creating liability here.
  *   **Action:** Push back on QA. The agent should say, "Most refunds arrive within 21 days of acceptance, but exact dates depend on IRS processing." If QA disciplines her for this, you need to intervene because this checklist protects *you* from being on the hook for false promises.

  ***

  ### Where This Will Misfire (The Friction Report)

  1.  **Speed vs. Safety:** The Source Test (Step 1) will kill handle time. Agents will hate searching for links while customers wait. You will need to accept slower chat volumes or build a better internal search tool.
  2.  **The "Gray Area" KB:** Sometimes the KB is vague. If the KB says "Usually no penalty," agents will treat that as a "Yes." You need to flag ambiguous KB articles for legal review, or agents will hide behind them.
  3.  **QA Contradictions:** As seen in Priya's case, if your Quality Assurance team scores agents down for *not* making promises, this checklist is useless. You need alignment with QA leadership that "Compliance > CSAT" on tax assertions.
  4.  **Customer Escalation:** Customers hate hearing "I need to check." They want authority. This protocol will increase escalation tickets to your queue. You need to staff for that spike.
  5.  **What It Can't Settle:** This checklist cannot determine legal liability. It only creates a paper trail showing "reasonable care." If the KB itself is wrong, the agent follows the checklist and the customer still loses money. You remain responsible for the KB accuracy.

  Summary: Agents get to assert something only when they can paste a link to an official source that covers the customer's specific situation without promising a result.
