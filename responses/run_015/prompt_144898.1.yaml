answer: |-
  ### Decomposition and Pricing

  **1. That the general principle really is unfalsifiable in isolation once it is formalized properly (0.95)**
  The Price Equation ($\Delta \bar{z} = Cov(w, z) + E(w \Delta z)$) is a mathematical identity describing change rather than a causal law predicting it; the heterozygote case confirms this by showing the covariance term simply goes to zero at equilibrium, preserving the identity rather than refuting it.

  **2. That the central laws of a paradigm physical science are unfalsifiable in isolation in the same sense (0.90)**
  Newton's Second Law ($F=ma$) functions similarly as a definition of force unless accompanied by independent force laws, rendering the core axiom unfalsifiable without the auxiliary hypotheses that the Duhem-Quine thesis renders necessary in physics as well.

  **3. That testability of specific models plus auxiliary hypotheses is enough to satisfy Popper's criterion for the whole enterprise (0.85)**
  Popper's mature focus shifted to the empirical content of derived predictions; provided the research programme generates risky, specific predictions (e.g., allele frequency trajectories), the unfalsifiability of the core framework does not invalidate the scientific status of the practice.

  **4. That metaphysical research programme is, inside Popper's own scheme, a demotion at all (0.30)**
  *Note: Low credence here supports the main proposition.*
  Popper distinguished metaphysics from pseudoscience and treated metaphysical frameworks as necessary precursors to science; while it categorically removes the label "science" from the core axiom, it does not demote the epistemic value or utility of the programme within his system.

  **5. That his late retreat surrendered the substance of the charge and not merely its wording (0.85)**
  In *Unended Quest* and correspondence, Popper explicitly acknowledged that specific selection hypotheses are testable and refutable, moving beyond the semantic defense that the theory was merely a "metaphysical research programme" to accepting its empirical content.

  ### Missing Sub-Question
  **The asymmetry of theory modification:** Does the scientific community treat violations of the selection principle differently than violations of physical laws (e.g., tweaking auxiliaries to save the core), and does this *protective belt* behavior (Lakatos) differ in degree between biology and physics?

  ### Combination and Final Credence

  **Arithmetic:** These terms do not multiply. They are not independent probabilistic events but interlocking philosophical premises where Terms 2, 4, and 5 provide the contextual defense for the implication asserted in the main proposition, given the grant of Term 1. Multiplication would incorrectly penalize the conjunction for correlated uncertainties (e.g., Term 2 and Term 3 both rely on a Duhem-Quine view of theory structure). I instead use a **weighted average**, treating Term 2 (the physics analogy) as the heaviest weight because it is the primary bridge preventing the "demotion."

  *   Calculation: $(0.95 + 2 \times 0.90 + 0.85 + (1-0.30) + 0.85) / 6 \approx 0.85$
