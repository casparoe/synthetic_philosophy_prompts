prompt: |-
  I'm a Bayesian statistician at a research institute that also houses a philosophy department; the philosophers keep appearing at our applied seminars and insisting that their debate about the Principal Principle -- the principle that a rational credence should defer to objective chance when you learn what the chance is -- is really about my business. I want to take them seriously, so here is the job. Restate that debate in the vocabulary I actually use: exchangeable and partially exchangeable sequences, de Finetti's representation theorem, latent parameters and hierarchical models, prior and posterior predictive distributions, conditioning and model averaging, information that breaks exchangeability. Assume my fluency is high -- I don't need measure theory or decision theory explained, and I've fully internalized the de Finettian lesson that a latent parameter can be a predictive fiction, something I may reason about without committing to its independent existence in the world. Translate the main positions as faithfully as you can: learning the objective chance of an event as something like conditioning on the value of a latent parameter (or tell me straight away that this is already a distortion); "admissible" evidence as something like evidence that leaves the relevant predictive symmetry intact; the dispute over whether chances are real propensities, or patterns somehow resident in the total history of the world, or eliminable fictions, as a dispute over what, if anything, the latent parameter is beyond the bookkeeping the representation theorem provides.

  Then give me the residue report, because that's what I actually care about. My working view is a dissolution: once you have de Finetti in hand, "objective chance" just names the predictive role of a parameter in an exchangeable model, the Principal Principle becomes something like a theorem about conditional predictive distributions, and the philosophers are fighting over how to interpret a modeling device. But I gather they also argue that certain kinds of evidence about future chances are inadmissible in a way that makes simple deference incoherent -- something about hypotheses about total histories undermining the chances that those same hypotheses assign -- and I honestly cannot tell from their slides whether this is just familiar non-conjugacy or coherence trouble with my priors, or something exchangeable modeling genuinely cannot express. So tell me what survives the translation cleanly, what has to be distorted to fit, and what has no counterpart in my vocabulary at all, and then take a stance: does the residue show that my vocabulary is missing something real, or that the original claims were less clear than they looked? Don't spare my dissolution out of politeness; if the undermining problem or the propensity intuitions point at something a de Finettian statistician cannot state, say so plainly. Please answer in continuous prose only, no headings, bullet points, bold text, or tables, as you would write to a colleague.
