prompt: |-
  Hi — I'm a journalist covering science and ideas, and I file two or three pieces a week off single papers, usually around 800 words, usually with about a day between the embargo lifting and my deadline. Most of what crosses my desk lately is modelling work: some formal or computational model of households, or cells, or a climate subsystem, or people on a network, and then a headline claim on top of it. And i keep hitting the same wall.

  The models obviously rest on assumptions that everyone in the field knows are false — fully optimizing agents, well-mixed populations, costless adjustment, no measurement error, one representative everything — and the standard reply, in the Friedman vein, is that unrealistic assumptions are fine, even a sign of a good theory, as long as the predictions come out right. Fine in principle. But I have to decide, in ten minutes, without reading the appendix and mostly without being able to follow the math, whether the false assumptions in *this* paper are the harmless kind or the kind where the headline result is basically baked into the setup before anyone runs anything.

  I've got a rough distinction I half-use and can't apply reliably, and I want it turned into something I can actually run. Four moving parts, as I see them:

  1. Load-bearing vs. scaffolding. Some assumptions are there to make the thing solvable; others are doing the actual causal work in producing the result. My test so far is: would flipping the assumption to roughly its opposite flip or kill the result? But I can almost never tell that from the paper, so I need something readable off the text.

  2. Direction of error. Every unrealistic assumption errs in some direction, not just "some amount". If the direction it errs in is the same direction as the paper's headline claim — a model that assumes adjustment is frictionless and cheap, finding that a policy is cheap — then part of the result looks built in rather than discovered.

  3. Target-matching. Is the model meant to be about one specific real system (a prediction), about a whole class of systems (a mechanism), or only a demonstration that something *could* happen (a how-possibly claim)? I keep turning possibility results into "here's why X happens" stories and my editor catches maybe half of them.

  4. Laundered assumptions. Some of these things are just field conventions that get repeated from paper to paper until the intro reads as if they were measured. Twenty years of "assume homogeneous mixing" and it stops sounding like an assumption. I can't tell the conventions from the findings, and I'm wary of my procedure just rubber-stamping whatever a subfield always does.

  What I want from you: a short decision procedure I can run on a PDF in ten minutes. Questions in order; what counts as a sufficient answer to each; where the procedure stops with a no; and where it hands the decision back to me or my editor because it's a judgment call rather than something the paper settles.

  Constraints on what I can actually check: the abstract, the intro's framing of what the model is for, the model section's structure and headings, the tables, and anything the paper says about robustness, extensions, relaxing assumptions, calibration or sensitivity. If I have a day I can email the author one question. What I can't do: read the math, verify whether other groups relaxed the assumption, or chase up references — so please don't give me a reading list or point me at papers, I won't be able to follow them.

  The output should end in three things: one of a few concrete hedging levels I can hand my editor; a single sentence of plain English describing the assumption that I paste into the piece somewhere; and the one question actually worth emailing.

  Then run it on three cases, including at least one where I won't like the answer:

  — A macro-ish paper using a dynamic model with fully optimizing forward-looking households and frictionless reallocation, finding that a large new subsidy roughly pays for itself within a decade. Great story, my editor wants it, I want it, and I suspect your procedure tells me the answer I don't want.

  — A compartmental disease model with homogeneous mixing and no behavioural response, projecting a wildlife pathogen under two management options two years out, where the projected numbers differ a lot between the options and the state agency is deciding next month.

  — A minimal model of social learning where agents copy neighbours more when the neighbours are similar to them, finding that even mild similarity bias produces near-total fragmentation. I want to write "here's why we're so polarized." I have a feeling this is a how-possibly result that is one step short of being true by construction, but I can't say why.

  Finally: be straight with me about what the procedure can't do. The cases it can't settle, the ways it'll misfire (I'm defintely worried about it being lenient toward conventions just because they're conventional, and about me confusing "I don't get it" with "the assumption is doing work"), and the point where over-hedging stops being honesty and starts costing me stories that were fine. Where do I just have to make a call about what readers deserve?
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Science journalist (800-word pieces, 2-3/week, tight deadlines).
      *   **Problem:** Struggles to evaluate modeling papers where assumptions are known to be false (Friedmanite defense). Needs to distinguish between "harmless simplifications" and "results baked into assumptions."
      *   **Current Framework:** Load-bearing vs. scaffolding, Direction of error, Target-matching, Laundered assumptions.
      *   **Constraints:** 10-minute PDF scan (Abstract, Intro, Model Structure, Tables, Robustness/Sensitivity). Can email *one* question if there's a day. Cannot read math or chase references.
      *   **Desired Output:** A short decision procedure (questions, pass/fail criteria, stop points), three specific outputs (Hedging Level, Plain English Assumption Sentence, One Email Question), and a candid assessment of limitations.
      *   **Test Cases:**
          1.  Macro subsidy paper (suspect result is baked in).
          2.  Disease model (high stakes, specific prediction).
          3.  Social learning/polarization (suspect how-possibly vs. mechanism).

  2.  **Develop the Decision Procedure (The "10-Minute Triage"):**
      *   *Goal:* Turn the user's four conceptual points into actionable checks on the text.
      *   *Step 1: Target-Matching (The "What is this?" check).* Look at the Intro/Abstract. Does it claim *prediction*, *mechanism*, or *possibility*?
          *   *Fail:* Claims prediction but admits it's a "stylized fact" or "toy model" in the conclusion.
      *   *Step 2: Direction of Error (The "Stacked Deck" check).* Look at the Assumptions/Model section. Identify the "unrealistic" ones. Do they bias *toward* the headline?
          *   *Fail:* Frictionless adjustment + claim "policy is low cost."
      *   *Step 3: Load-Bearing vs. Scaffolding (The "Robustness" check).* Look for Sensitivity Analysis/Extensions. Did they break the assumption?
          *   *Fail:* No sensitivity analysis on the key unrealistic assumption.
      *   *Step 4: Laundered Assumptions (The "Convention" check).* Look at citations in the Model section. Is it "Standard Model X"?
          *   *Fail:* "As usual, we assume..." without justification, especially if the result depends on it.

      *   *Refining the Flow:* Let's make it a linear flowchart style.
      *   *Q1: Claim Type.* (Prediction vs. Mechanism vs. Possibility).
      *   *Q2: Bias Direction.* (Does the simplification help the result happen?)
      *   *Q3: Stress Test.* (Did they try to break it?)
      *   *Decision:* If Q1 mismatches OR Q2 is "Yes, biased" AND Q3 is "No test" -> High Skepticism.

  3.  **Define the Outputs:**
      *   **Hedging Levels:** Need clear labels.
          *   Level 1: Solid (Mechanism/Prediction supported).
          *   Level 2: Conditional (Mechanism plausible, prediction uncertain).
          *   Level 3: Speculative (How-possibly only).
          *   Level 4: Suspect (Assumptions drive result).
      *   **Plain English Sentence:** Needs to be insertable into the article. "The model assumes X, which likely makes Y look easier/harder than it is."
      *   **One Email Question:** Needs to target the weak point identified.

  4.  **Drafting the Procedure (Iterative refinement):**
      *   *Constraint Check:* Must be doable in 10 mins. No math.
      *   *Focus:* Textual cues. "We assume," "Standard," "Robustness," "Sensitivity."
      *   *The "Stop" Rule:* If the paper claims a specific number (prediction) but the model is a "toy model" (mechanism), stop. That's a mismatch.

  5.  **Running the Test Cases:**

      *   *Case 1: Macro Subsidy (Frictionless, Self-paying).*
          *   Q1: Claims prediction ("pays for itself").
          *   Q2: Bias? Yes. Frictionless reallocation makes adjustment cheap. Result says adjustment is cheap.
          *   Q3: Robustness? Usually macro DSGE models don't test "what if agents are irrational" deeply in the main text.
          *   Verdict: High Skepticism.
          *   Hedging: Level 4 (Suspect).
          *   Sentence: "The model assumes households and firms adjust instantly without cost, which inherently favors the conclusion that the subsidy will be easy to absorb."
          *   Question: "If you introduce even small frictions to labor reallocation in the sensitivity analysis, does the 'pay for itself' timeline double or break entirely?"

      *   *Case 2: Disease Model (Homogeneous mixing, Wildlife, 2-year projection).*
          *   Q1: Claims prediction ("projecting numbers").
          *   Q2: Bias? Homogeneous mixing usually *overestimates* spread speed. If the result is "Option A saves 50%," does mixing bias A or B? Harder to say, but homogeneous mixing ignores structure.
          *   Q3: Robustness? Epidemiological models often do sensitivity on transmission rates ($\beta$). Do they do it on mixing?
          *   Context: State agency deciding *next month*. High stakes.
          *   Verdict: Level 3 (Speculative/Scenario). Homogeneous mixing is a known "laundered" assumption that fails in structured populations.
          *   Hedging: Level 3.
          *   Sentence: "The model treats the wildlife population as evenly mixed, ignoring geographic barriers that could slow or accelerate the outbreak in reality."
          *   Question: "Given the agency is using this for immediate policy, have you validated the homogeneous mixing assumption against telemetry data for this specific species?"

      *   *Case 3: Social Learning (Similarity bias -> Polarization).*
          *   Q1: Claims mechanism ("Here's why").
          *   Q2: Bias? If agents *only* copy similar neighbors, fragmentation is tautological.
          *   Q3: Robustness? "Even mild bias." Did they test *no* bias?
          *   Verdict: Level 2/3 boundary. It's a "how-possibly."
          *   Hedging: Level 3 (Speculative/Possibility).
          *   Sentence: "The model demonstrates that polarization *can* emerge from mild similarity bias, not that this bias is the primary driver in actual social networks."
          *   Question: "Does the fragmentation result hold if agents occasionally copy dissimilar neighbors at rates observed in empirical social network studies?"

  6.  **Addressing Limitations (The "Straight Talk"):**
      *   Cannot detect "mathematical tautologies" hidden in derivations.
      *   Relies on authors being honest in the "Robustness" section (they might hide failures).
      *   Risk of cynicism: Dismissing all models because *some* assumptions are false.
      *   The "Convention" trap: Just because everyone does it doesn't make it right for *this* question.

  7.  **Review and Refine:**
      *   *Tone:* Professional, peer-to-peer, respectful of deadlines.
      *   *Format:* Clear headings, bullet points for the procedure, distinct sections for the cases.
      *   *Check:* Did I answer the specific prompt requirements? (Decision procedure, 3 outputs, 3 cases, limitations).
      *   *Self-Correction on Case 2:* Disease models are tricky. Homogeneous mixing is standard but often wrong. The key is the *stakes*. If it's for policy *now*, the hedging needs to be stronger. I'll push it to Level 3 (Scenario, not Forecast).
      *   *Self-Correction on Procedure:* Make sure the "Stop" conditions are clear. If Q2 fails (Bias matches Result) AND Q3 fails (No Sensitivity), that's a hard "No" on strong claims.

  8.  **Final Polish:** Ensure the "Hedging Levels" are distinct and usable by an editor. Ensure the "Plain English" sentences are actually journalistic. (e.g., avoid jargon like "homogeneous mixing" in the sentence itself, explain it). *Wait, the prompt asks for a sentence describing the assumption.* I should make sure it explains the *consequence* of the assumption.

      *   *Refining the Procedure Steps:*
          1.  **Claim Check:** Prediction vs. Possibility.
          2.  **Bias Check:** Does the simplification help the headline?
          3.  **Stress Check:** Did they break their own toy?
      *   *Refining the Outputs:*
          *   Hedging: Green (Report as finding), Yellow (Report as scenario/theory), Red (Report as contested/unlikely).
          *   Sentence: "The model assumes [X], which tends to [Y]."
          *   Question: The specific lever to pull.

      *   *Let's write it.*
answer: |-
  Here is a 10-minute triage procedure designed for your constraints. It converts your four conceptual worries into textual search patterns.

  ### The 10-Minute Triage Procedure

  **Step 1: The Claim Check (2 minutes)**
  *Read the Abstract and the final paragraph of the Introduction.*
  *   **Search for:** Words like "predict," "forecast," "estimate," "quantify" (Prediction) vs. "suggest," "illustrate," "demonstrate," "explore" (Mechanism/Possibility).
  *   **The Test:** Does the strength of the claim match the model type?
      *   *Pass:* "Toy model" intro + "suggests" claim. OR "Calibrated model" intro + "predicts" claim.
      *   *Fail:* "Stylized model" intro + "predicts/estimates" claim. (This is a Target-Matching failure).
  *   **Stop Rule:** If **Fail**, downgrade Hedging Level by one tier immediately.

  **Step 2: The Bias Check (3 minutes)**
  *Scan the Model section for the word "assume" and the Robustness/Sensitivity section.*
  *   **Search for:** The top 3 unrealistic assumptions (e.g., "frictionless," "homogeneous," "rational").
  *   **The Test:** Does the assumption err in the *same direction* as the headline result?
      *   *Example:* Assumption = "Costless adjustment." Headline = "Policy is low cost."
      *   *Example:* Assumption = "Perfect information." Headline = "Market clears efficiently."
  *   **Pass:** Assumption is neutral (e.g., "2D space" for a disease model) or errs *against* the result.
  *   **Fail:** Assumption makes the headline result easier to achieve. (This is a Direction of Error failure).

  **Step 3: The Stress Check (5 minutes)**
  *Go straight to "Sensitivity Analysis," "Robustness," or "Extensions."*
  *   **Search for:** The specific assumptions identified in Step 2.
  *   **The Test:** Did they relax the assumption that looks most suspicious?
      *   *Pass:* They explicitly test "What if we add friction?" or "What if mixing is structured?" and the result holds (perhaps weaker, but same sign).
      *   *Fail:* They test parameters (e.g., transmission rate) but not structural assumptions (e.g., mixing structure). OR they say "left for future work." (This is a Load-Bearing failure).
  *   **Stop Rule:** If Step 2 is **Fail** AND Step 3 is **Fail**, you cannot report the headline as a finding.

  ***

  ### The Three Outputs

  Based on the triage, assign one of these four levels.

  **Hedging Levels**
  *   **Level 1 (Solid):** Claim matches model type; assumptions do not bias the result; stress tests passed. *Report as: "A new model shows..."*
  *   **Level 2 (Conditional):** Claim matches model type; one major assumption biases the result, but stress tests show it holds. *Report as: "A new model suggests..."*
  *   **Level 3 (Scenario):** Claim is stronger than model type (Prediction vs. Mechanism) OR assumptions bias result with no stress test. *Report as: "Theoretically, this could..." or "Under these specific conditions..."*
  *   **Level 4 (Suspect):** Assumptions bias result + No stress test + High stakes claim. *Report as: "Authors argue X, though the model relies on Y."*

  **The Plain English Sentence**
  *Template:* "The model assumes [Assumption], which tends to make [Outcome] look [Easier/Harder/More Certain] than it might be in reality."

  **The One Email Question**
  *Template:* "In your sensitivity analysis, did you test [Specific Assumption] against [Real-World Constraint], and if so, did the [Headline Result] survive?"

  ***

  ### Running the Cases

  #### Case 1: Macro Subsidy (Frictionless, Self-Paying)
  *   **Step 1 (Claim):** "Pays for itself within a decade" is a **Prediction**. Model is "dynamic... optimizing households" (Standard DSGE). *Mismatch risk:* DSGE is often structural/mechanism, not precise forecasting.
  *   **Step 2 (Bias):** Assumption: "Frictionless reallocation." Result: "Subsidy is low cost/pay for itself." **FAIL.** The assumption removes the cost that the headline claims is low.
  *   **Step 3 (Stress):** Macro papers rarely test "irrationality" or "friction" deeply in the main text; they usually tweak calibration parameters. Likely **FAIL**.
  *   **Verdict:** **Level 4 (Suspect).**

  *   **Hedging Level:** Level 4.
  *   **Plain English Sentence:** "The model assumes firms and workers can switch jobs and sectors instantly without cost, which inherently makes the subsidy look cheaper and faster-acting than it likely would be."
  *   **One Email Question:** "If you introduce even modest labor market frictions into the sensitivity analysis, does the 'pay for itself' timeline extend beyond the political horizon or break entirely?"

  #### Case 2: Disease Model (Homogeneous Mixing, Wildlife, Policy Decision)
  *   **Step 1 (Claim):** "Projecting numbers... state agency deciding." This is a **Prediction**.
  *   **Step 2 (Bias):** Assumption: "Homogeneous mixing." Result: "Option A saves X animals." Homogeneous mixing usually *accelerates* spread compared to structured populations. If Option A relies on speed of containment, the assumption might bias *against* Option A, or make the total numbers higher. It's ambiguous, but high risk. Let's call it **WARN**.
  *   **Step 3 (Stress):** Did they test network structure? Usually no, compartmental models stick to compartments. **FAIL**.
  *   **Context:** High stakes (policy decision).
  *   **Verdict:** **Level 3 (Scenario).** You cannot report the numbers as forecasts.

  *   **Hedging Level:** Level 3.
  *   **Plain English Sentence:** "The model treats the animal population as evenly mixed, ignoring geographic barriers that could significantly alter the speed and path of the outbreak."
  *   **One Email Question:** "Given this is informing immediate policy, have you validated the mixing assumption against telemetry data for this specific species, or should these numbers be treated as upper-bound scenarios?"

  #### Case 3: Social Learning (Similarity Bias, Polarization)
  *   **Step 1 (Claim):** "Here's why we're so polarized." This claims a **Mechanism** for a real-world phenomenon. Model is "minimal." *Match:* Minimal models are good for mechanisms. **PASS**.
  *   **Step 2 (Bias):** Assumption: "Copy neighbours more when similar." Result: "Fragmentation." **FAIL/WARN.** If you only talk to people like you, fragmentation is basically defined into the system. It risks being true by construction.
  *   **Step 3 (Stress):** "Even mild similarity bias." They likely tested the *degree* of bias. Did they test *cross-cutting* exposure? If not, **FAIL**.
  *   **Verdict:** **Level 3 (Scenario/Possibility).** It shows it *can* happen, not that it *is* happening.

  *   **Hedging Level:** Level 3.
  *   **Plain English Sentence:** "The model demonstrates that polarization *can* emerge from mild similarity bias, but it does not measure whether that bias is strong enough in actual social networks to drive real-world fragmentation."
  *   **One Email Question:** "Does the fragmentation result hold if agents occasionally copy dissimilar neighbors at rates observed in empirical social network studies, or does the effect vanish with realistic noise?"

  ***

  ### Limitations & The "Straight Talk"

  Here is where this procedure will fail you, and where you must exercise judgment.

  **1. The "Mathematical Tautology" Blind Spot**
  This procedure relies on text. Sometimes, the result is baked into the math in a way the authors don't explicitly flag as an assumption (e.g., a functional form that guarantees convergence). If the "Sensitivity Analysis" section is written by the same person who built the model, they may choose to test parameters that don't break their toy.
  *   **Your Call:** If the result feels *too* clean (e.g., "always," "never," "exactly"), treat it as Level 3 even if the procedure says Level 2.

  **2. The Convention Trap**
  You worried about "laundered assumptions." This procedure penalizes them in Step 2 (Bias Check), but if a field *only* uses one type of model (e.g., homogeneous mixing in epidemiology), Step 3 (Stress Check) will almost always fail because no one does it.
  *   **Your Call:** If the whole field uses a flawed assumption, the story isn't the paper; the story is the field's limitation. Don't let the procedure rubber-stamp a convention just because it's standard. If the assumption is known to be false in the real world (e.g., humans are not rational optimizers), and the paper ignores that, downgrade the level.

  **3. The "I Don't Get It" vs. "It's Broken" Confusion**
  You mentioned worrying about confusing your own lack of math fluency with a model flaw.
  *   **Your Call:** Use the "Plain English Sentence" as a litmus test. If you cannot write that sentence without using jargon or hedging so much it becomes meaningless, the model is not ready for an 800-word piece. If you can't explain *why* the assumption matters, you can't explain the result.

  **4. Over-Hedging Costs**
  If you Level 3 everything, you stop writing about modeling.
  *   **The Line:** Use Level 2 for papers that acknowledge their limits. Use Level 3/4 for papers that sell a limitation as a feature.
  *   **Reader Desert:** Readers deserve to know if a number is a forecast or a thought experiment. They do *not* need to know about calibration parameters. Your duty is to distinguish **Discovery** (we found something new about the world) from **Deduction** (we found something new about this specific set of equations). This procedure is designed to catch Deduction masquerading as Discovery.

  **Final Advice:** When in doubt, email the author. The "One Question" is your safety valve. If they dodge it, you have your answer: Level 4. If they answer clearly, you might upgrade to Level 2.
