answer: |-
  1. Divide the twelve students into two teams of six, assigning half as Skeptics who must argue that no reason binds all rational agents, and half as Arbitrators who must enforce the Mirror Rule by translating every objection into universally recognizable terms. The Skeptics win by surviving without conceding universal validity, while Arbitrators win by forcing a performative contradiction.

  2. Speaking turns are purchased by surrendering a physical token representing "communicative credit," which Arbitrators only return if the Skeptic's objection inadvertently relies on the norm being denied. The Mirror Rule mandates that Arbitrators may only respond by reformulating the Skeptic's denial into a claim that presupposes the very rational authority the Skeptic rejects.

  3. The first forty minutes consist of alternating rounds where Skeptics attack norms and Arbitrators enforce the Mirror Rule to control the floor. The remaining twenty minutes are allocated for tallying token counts and beginning the final group discussion.

  4. Guide students to identify moments where their demand for fairness or clarity implicitly affirmed the universal norms they explicitly rejected, mapping this tension to the transcendental structure of argumentation. Highlight how the loss of tokens coincided with instances where the act of denying reason required the use of reason.

  5. Expect students to retreat into silence or irony to avoid the trap, which limits the activity's ability to reproduce the inevitability of theoretical self-refutation. The game cannot force the internal realization of contradiction, only the external loss of turns, leaving the deepest philosophical conviction untouched.
