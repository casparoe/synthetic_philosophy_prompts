answer: |-
  First, a quick check on your setup, because it matters for the numbers. You are 90% there, but one detail is off. Lewis didn't show that $P(A|A)$ is forced to 1 (that is true by the definition of conditional probability regardless of conditionals). He showed that if $A \to B$ is a proposition in the Boolean algebra and $P(A \to B) = P(B|A)$ for all $P$, then the only coherent probability functions are those where $P(B|A)$ can only take values 0 or 1. In other words, you can't have uncertain conditionals. Your conclusion ("every conditional ends up with probability 0 or 1") is correct, but the mechanism isn't about $P(A|A)$.

  With that correction in place, here is my assessed probability.

  **My Credence: 60%**

  That is, I assign a 60% probability that in 20 years the mainstream view will be that a version of the Equation ($P(\text{If } A, B) = P(B|A)$) survives, preserved by modifying the logic/algebra rather than abandoning the Equation.

  ### Decomposition

  **1. The Probability that the tension is Equation vs. Boolean Algebra (95%)**
  The math is not the problem. Lewis (1976), and subsequent strengthenings by Hájek, Milne, and others, have rigorously demonstrated that you cannot have the Equation, a Boolean algebra of propositions, and the assumption that the conditional is a proposition that can be embedded in further truth-functional contexts (like Import-Export) all at once. The tension is definitively located in the structural assumptions about the domain of the probability function. The only wiggle room here is whether "Import-Export" is a necessary feature of indicatives, but even dropping that usually leads to similar triviality results (e.g., via the "Ramsey Test" constraints). I am very confident the math forces a choice between the Equation and Classical Logic.

  **2. The Probability philosophers will accept the cost (70%)**
  By "cost," I mean accepting trivalent semantics (e.g., Bradley, Gibbard), context-sensitive algebras (e.g., Khoo, Mandelkern), or non-propositional views (e.g., Yalcin). Twenty years ago, classical logic was sacrosanct. Today, the success of inquisitive semantics and the integration of probability into semantics proper has made "giving up bivalence" or "giving up closure under negation" much cheaper. The cost is no longer career suicide; it's a live research program. However, there is still a significant conservative faction that views non-classical logic as a bug, not a feature.

  **3. The Probability the Equation is the right target to preserve (85%)**
  This is driven by external pressure from cognitive science and psychology of reasoning. The empirical data (Oaksford, Chater, Over) suggests human reasoning *actually follows* the Equation. If philosophy of language dictates that the Equation is false, but cognitive science dictates that rational agents behave as if it is true, philosophy loses its claim to normative authority. The Equation is too useful for decision theory and epistemology to discard lightly. Abandoning it creates a rift between logic and rational choice that most philosophers want to avoid.

  **4. The Probability of "Mainstream Consensus" (50%)**
  This is the drag on my overall number. Philosophy rarely achieves consensus. It is equally likely that the field fragments into "Contextualists" vs. "Expressivists" vs. "Classical Defenders" with no clear majority. My 60% overall credence assumes that the "Equation + Non-Boolean" cluster becomes the largest single coalition, even if not an absolute majority.

  ### Sensitivity Analysis

  My number is most sensitive to **Component 2 (Willingness to accept the cost)**.

  If the field decides that the cost of non-classical logic is too high (e.g., if it creates unacceptable problems for embedding conditionals in belief reports or counterfactuals), the credence drops to near 0. Conversely, if a unified non-Boolean semantics (like a trivalent logic that handles embedding well) is successfully formalized and taught to the next generation of grad students, the credence rises to 85%.

  **What would move it:** A new triviality result that applies *even* to the leading non-Boolean candidates (e.g., a result showing that trivalent semantics also trivializes under plausible embedding assumptions) would crash this number. Conversely, a robust decision-theoretic derivation of the Equation that *requires* non-Boolean logic would push it up.

  ### The Classmate Objection

  Your classmate's disagreement with you is **about what the math implies for the philosophy**, not about the math itself.

  The math *is* settled. Lewis is right. If you assume Classical Logic + Propositional Conditionals + The Equation, you get triviality. Your classmate is correct that anyone denying the *math* is not taking it seriously.

  However, the philosophical move made by defenders of the Equation (like Robert Stalnaker in his later work, or more recently Branden Fitelson and Alan Hájek in different ways, or the trivalentists) is not to deny the math, but to deny the **Boolean Algebra** premise. They argue that the domain of credences is not a Boolean algebra of propositions.

  Your classmate is likely assuming that "taking the math seriously" means "accepting the premises of Lewis's theorem as fixed." The defenders of the Equation are "taking the math seriously" by accepting the *conclusion* of Lewis's theorem (that the premises are inconsistent) and choosing to drop the Classical Logic premise rather than the Equation premise.

  **Verdict:** You are both right about the math; you disagree on which premise is the "least costly" to discard. That is a philosophical disagreement, not a mathematical one.
