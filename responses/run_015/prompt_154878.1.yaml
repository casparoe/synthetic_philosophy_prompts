answer: |-
  This is a classic problem in Kantian ethics, often called the "marginal cases" argument. You have correctly identified a tension in your professor's grading criteria: she seems to be balancing **rational capacity** (the standard Kantian criterion) against **species membership** (a common workaround for infants and the cognitively impaired).

  First, a tiny note on your notes: it is indeed **receive** (i before e, except after c). But your philosophical intuition is sharp; you've spotted the fault line in her interpretation before the exam even hits.

  Here is the breakdown of the two competing rules, how they apply to your genetically modified bonobo, and how to test which one your professor actually holds.

  ### 1. The Two Competing Rules

  Based on her track record, she is oscillating between these two interpretations of "Humanity" (*Menschheit*) as an end in itself:

  **Rule A: The "Biological Species-Norm" Rule**
  *   **The Logic:** Direct moral standing is granted to members of the human species. Rationality is the *ground* of the species' value, but biological membership is the *criterion* for individual inclusion.
  *   **Why it fits her data:** It explains why infants and permanently demented adults count (they are biologically human) while chimps and dogs do not (they are biologically distinct), regardless of the chimp's training or the dog's emotions.
  *   **Kantian Terminology:** This interprets "Humanity" as *human nature* inherent in the biological organism.

  **Rule B: The "Functional Rational Nature" Rule**
  *   **The Logic:** Direct moral standing is granted to any being that possesses the metaphysical capacity for autonomy (the ability to act on principle/maxims), regardless of biology. Infants and the demented are included via "potentiality" or because they possess the *substrate* of rationality, even if non-functional.
  *   **Why it fits her data:** It explains why chimps are excluded (she assumes they lack the metaphysical capacity for freedom/duty, not just intelligence). It explains why humans are included (they have the capacity).
  *   **Kantian Terminology:** This interprets "Humanity" as *rational agency* wherever it appears.

  ### 2. Prediction for the Genetically Modified Bonobo

  Here is how each rule adjudicates the case of the bonobo with the human *FOXP2* variant that can formulate maxims:

  *   **Under Rule A (Species-Norm):** **No Direct Standing.**
      *   **Reasoning:** Even though the bonobo acts rationally, it is not a member of the human species. The "rational nature" is viewed as a property that attaches to the human form of life. Since the bonobo lacks human ancestry, it falls outside the moral community, similar to the "highly trained chimpanzee" case.
  *   **Under Rule B (Functional Rational Nature):** **Direct Standing.**
      *   **Reasoning:** You have stipulated that this bonobo is "capable of formulating maxims and recognizing other agents as ends." In Kantian ethics, this *is* the definition of a moral agent. If the capacity is functionally identical to a human's, the lack of human DNA is morally irrelevant.

  ### 3. The Closest Analog: The Permanently Demented Adult

  The most critical data point in her track record is the **severely demented adult who will never recover.**

  *   **Why this is the key:** If she were running a strict **Functional Rule (Rule B)**, this case is difficult to justify. A being that *never* has and *never* will exercise rationality lacks the functional capacity. The only way to include them under Rule B is to argue they retain the "substrate" of human reason.
  *   **Why it favors Rule A:** The inclusion of the permanently demented is the strongest evidence for the **Species-Norm Rule**. It suggests that for her, *being human* is a necessary condition for standing. She is willing to extend standing to humans who lack rationality, but unwilling to extend it to non-humans who might display proto-rationality (the trained chimp).
  *   **The Analogous Logic:** Just as the demented adult counts *despite* lacking function because they are human, the bonobo will likely *not* count *despite* having function because it is not human.

  ### 4. Which Rule She Probably Runs (and Why)

  **Verdict:** She is almost certainly running **Rule A (The Biological Species-Norm Rule).**

  **The Argument:**
  1.  **The Chimp Exclusion:** She explicitly denies standing to emotionally complex or trained animals. This establishes that "complexity" or "behavior" is not enough.
  2.  **The Dementia Inclusion:** She explicitly grants standing to humans who lack rationality permanently. This establishes that "actual rationality" is not necessary.
  3.  **The Synthesis:** If actual rationality isn't necessary (dementia case), but behavioral complexity isn't sufficient (chimp case), the remaining variable that distinguishes the demented human from the trained chimp is **species membership**.

  In Kantian scholarship, this is often associated with the view that "Humanity" refers to the specific natural kind *Homo sapiens*, which is the sole bearer of the "rational soul" or moral vocation. She likely views the bonobo's linguistic ability as a sophisticated form of inclination or training (heteronomy), not true moral autonomy, simply because it lacks the human "form."

  ### 5. The Tie-Breaker Case: The Disembodied AI

  To definitively prove which rule she is running, you need a case that separates **Biology** from **Rational Capacity** entirely. You suggested an AI; here is the precise formulation to press her on:

  **The Case:** *"Consider a non-biological Artificial Intelligence that has no human DNA and no biological body, but can demonstrably prove it acts solely from duty, formulates universal maxims, and recognizes us as ends. Does it have direct moral standing?"*

  *   **If she says YES:** She is a **Functional Rational Nature** theorist (Rule B). She believes rationality is a metaphysical capacity that can exist independent of the human organism. (This would actually contradict her likely stance on the bonobo, forcing her to reconsider).
  *   **If she says NO:** She is a **Biological Species-Norm** theorist (Rule A). She believes "Humanity" is inextricably linked to biological human life.

  **Why this works better than the Bonobo:**
  With the bonobo, she can argue about "degrees" of rationality or claim the *FOXP2* variant doesn't grant true *autonomy* (freedom). With an AI that *proves* it acts from duty, biology is the only variable left. If she denies the AI, she admits that biology, not rationality, is the true gatekeeper in her seminar.

  ### Summary for Your Debate
  *   **Her likely stance:** Deny the bonobo standing.
  *   **Her justification:** Rational nature is a property of the human species form, not just a functional output.
  *   **Your counter-move:** Push the AI case. If she grants standing to a rational AI but not a rational ape, she is a Species Theorist. If she grants standing to neither, she is a Biological Theorist. If she grants standing to both, she is a Functional Theorist (and needs to explain why the demented human counts).

  Good luck with the seminar. And don't worry about the spelling; Kant's German is much harder to spell than "receive."
