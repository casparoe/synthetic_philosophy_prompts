      *   *The Paradox:* He discovered that pairwise majority voting can lead to intransitive social preferences (the Condorcet Cycle).
      *   *Condorcet's Goal:* He wanted to find the "truth" or the "common will." He viewed voting as an epistemic process (discovering the right answer), not just aggregating arbitrary desires.
      *   *Does he discuss feedback?* Condorcet generally treats individual preferences (or judgments) as *fixed* inputs for the calculation of probability. He is concerned with the reliability of the *decision*, not the psychological evolution of the voters *during* the voting process. He sees the cycle as a failure of the *method* to reveal a coherent will, not as a stimulus for voters to change their minds.
