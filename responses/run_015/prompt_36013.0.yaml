answer: |-
  The single requirement carrying the most weight is the simultaneous extraction of orthogonal style and identity categories, as this alone falsifies any theory relying on static feature spaces or fixed prototypes.

  **Desiderata for a Theory of Letterform Categorization**

  1.  **Zero-Shot Generalization**
      *   **Motivating Case:** Immediate recognition of an 'a' in a font never before encountered, without feedback or deliberation.
      *   **Status:** Non-negotiable.
      *   **Notes:** The system cannot require training instances for every new style; the concept must precede the exposure.

  2.  **Topological/Functional Invariance**
      *   **Motivating Case:** Recognizing the two-story 'a' (ɑ) and one-story 'a' (a) as the same letter, extending to blackletter forms where geometric overlap is near zero.
      *   **Status:** Non-negotiable.
      *   **Notes:** Identity cannot depend on specific geometric features (e.g., "closed loop") that are not present in all instances.

  3.  **Degradation Tolerance**
      *   **Motivating Case:** Reading sloppy handwriting or fragmented print up to the precise threshold where recognition fails.
      *   **Status:** Non-negotiable.
      *   **Notes:** The theory must define the limits of distortion, not just successful matches.

  4.  **Style-Identity Orthogonality**
      *   **Motivating Case:** Within a font, an 'a' is perceptually closer to its sibling 'b' than to an 'a' in another font, yet readers instantly separate "letter identity" from "font style" in novel alphabets.
      *   **Status:** Non-negotiable.
      *   **Notes:** The theory must explain how two distinct latent variables (content and style) are disentangled from a single image without prior separation.

  5.  **Case Mapping**
      *   **Motivating Case:** The relationship between uppercase 'A' and lowercase 'a'.
      *   **Status:** Preference (Theoretical Stance).
      *   **Notes:** The theory must specify whether these are one concept with variant forms, two linked concepts, or a structured pair; current evidence suggests a structured pair, but this is less critical than intra-case variance.

  6.  **Role-Based Compositionality**
      *   **Motivating Case:** Structural descriptions (e.g., "bowl plus stem") fail when letters lack named parts yet retain identity through functional role.
      *   **Status:** Non-negotiable.
      *   **Notes:** Description must be based on abstract roles (e.g., "closing element") rather than fixed parts.

  7.  **Contextual Modulation**
      *   **Motivating Case:** The word superiority effect, where a letter is identified faster and more accurately within a word than in isolation.
      *   **Status:** Non-negotiable.
      *   **Notes:** Identity processing cannot be strictly feedforward or isolated from linguistic context.

  **Critical Tension**
  *   **Pair:** **Role-Based Compositionality** (Requirement 6) and **Contextual Modulation** (Requirement 7).
  *   **Conflict:** Classical structuralism demands identity be intrinsic to the object's description, while context effects demand identity be partially constituted by external relations. Satisfying both requires a non-classical logic where internal structure and external context are co-determined, a joint satisfaction that remains the primary failure point of symbolic and connectionist models alike.

  **Exclusion of Candidate Accounts**
  The single requirement that does the most to exclude familiar candidate accounts is **Zero-Shot Generalization**. Template matching fails because no stored image matches the new font. Prototype averaging fails because no statistical mean exists for unseen data. Feature lists fail because the relevant features cannot be predefined for unknown styles. While Topological Invariance specifically kills rigid structural descriptions, Zero-Shot Generalization eliminates any theory that relies on prior statistical accumulation or fixed lookup tables, forcing the conclusion that letter recognition is a generative, analogy-making process rather than a discriminative classification task.
