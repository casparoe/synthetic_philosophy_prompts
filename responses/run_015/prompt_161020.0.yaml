answer: |-
  **TO:** Steering Committee, Project H Replication
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation for Primary Analysis Plan

  Colleagues,

  Following our review of the three proposed analysis frameworks, I recommend we adopt **Option (a)** as the primary pre-registered analysis for the upcoming replication round.

  **Primary Analysis Specification**
  We will conduct a Two One-Sided Tests (TOST) equivalence test against a pre-registered Smallest Effect Size of Interest (SESOI). Based on the bias-corrected meta-analytic estimate (d = 0.4) and practical significance thresholds, the SESOI is set at **d = 0.20**.

  *   **Computation:** We will compute the 90% confidence interval around the meta-analytic mean effect size across the twelve labs.
  *   **Units:** Results will be reported in standardized mean difference (Cohen's *d*) with 90% and 95% confidence intervals.
  *   **Headline Permissions:** The abstract and press release must state one of three calibrated verdicts:
      1.  "The effect is statistically equivalent to zero (within the bounds of noise)."
      2.  "The effect is detectable but smaller than the smallest effect size of interest."
      3.  "The effect exceeds the smallest effect size of interest."
  *   **Prohibited Language:** The headline must not use language regarding "proof," "truth," or "belief updating." It is a decision procedure, not a metaphysical claim.

  **Fate of Alternative Proposals**
  Options (b) and (c) will not be dropped but demoted to **Secondary and Sensitivity Analyses**.
  *   **Option (b) (Bayes Factors):** Will be reported in the supplementary materials as "Sensitivity to Prior Assumptions," providing a robustness curve across default priors. This satisfies the desire for belief quantification without making it the arbiter of the project's success.
  *   **Option (c) (Disagreement-Reduction):** Will be included as an "Exploratory Consensus Metric." It will appear in the discussion section to illustrate how the data impacts hypothetical stakeholder positions, but it will not determine the primary conclusion.

  **The Case for Option (c)**
  Proponents of Option (c) argue that in a polarized field, a binary verdict is socially inert. When camps are entrenched, a frequentist "null" or a Bayesian " anecdotal evidence" claim is often dismissed as methodological bias. By quantifying how much a study forces opposing priors to converge, we measure the actual utility of the data in resolving scientific disagreement, rather than producing a verdict that both sides will simply reject. On this view, the value of a replication is not its error rate, but its capacity to reduce the distance between reasonable observers. A study that leaves both sides exactly where they were is uninformative, regardless of its *p*-value.

  **The "Hidden Moderator" Reply**
  Regarding the concern that original authors may claim our protocol omitted an essential feature of effect H: We will accept a "protocol omission" claim only if the omitted feature was explicitly described as a necessary boundary condition in the original publication or pre-registration. If the feature was not pre-specified as essential, the burden of proof shifts to the original authors to demonstrate the moderation effect in a new, pre-registered study. This prevents unfalsifiable escape hatches while respecting genuine theoretical nuance.

  **Conclusion**
  Option (a) provides the error-controlled verdict required for a consortium of this size. It allows the field to make funding and theory-building decisions based on calibrated evidence rather than subjective belief trajectories. By standardizing the verdict, we ensure the project speaks to the field, not just to the current occupants of it.

  Please review this proposal before Thursday's meeting. I look forward to finalizing the plan.

  Best,

  [Your Name]
