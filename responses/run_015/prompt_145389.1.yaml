  Next tuesday I'm presenting to our moral psych / phil of mind seminar—there's a proper Smith scholar in the back, two Humeans who think sympathy is contagious affect, and some cog-sci people obsessed with predictive processing—my claim that in TMS Smithian sympathy isn't analogical, we don't mirror-feel the other person's state, but indexical: we treat their expressive behavior as a calibration target for our own interoceptive predictions, and the so-called impartial spectator is just the asymptotic convergence point of running that calibration against a distributed social audience rather than a personified internal judge. I have about 15 mins then Q&A. Give me the objections in roughly the order they'll come, phrased in the voice of each camp (especially the Humeans and the Smith scholar), with a short reply for each, a note on what I should concede vs hold, and point out the weakest link in my own position—probably the part where I have to explain why Smith talks like there's one spectator if it's really distributed—that I should prep to defend rather than pray they miss. Also tell me the objection I'm secretly hoping nobody raises, probably something about whether this makes Smith an eliminativist about moral sentiments or just collapses sympathy into error-correction. Keep it casual, and dont worry about a typo or two since I'm writing this fast.
