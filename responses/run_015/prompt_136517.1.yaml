      *   **Opposition Logic:** Parfitian reductionism or similar. If preferences change radically, is the future self a different person? If the algorithm exploits the *gap* between selves to extract money (penalties), is it predatory? The "weakness window" targeting sounds like dynamic pricing on willpower.
