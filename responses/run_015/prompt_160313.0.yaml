  **Department of Health and Social Efficiency**
  **Consultation Document: BEC-2024-01**
  **Subject: Implementation of Biostatistical Eligibility Criteria (BEC)**

  1. The Department welcomes responses regarding the operationalisation of the Biostatistical Eligibility Criteria (BEC) across NHS Trusts. Following the Health Objectivity Act, eligibility for state-funded intervention must be decoupled from subjective assessments of 'suffering' or 'need'. Disease is henceforth defined as statistical subnormal functioning of a mechanism relative to a specified reference class. This ensures resource allocation is based on biological fact rather than normative preference. An Equality Impact Assessment has been conducted; see Section 4.

  2. To maintain fiscal neutrality, reference classes will be stratified by age, sex, occupation, and region. This granularity ensures that 'normal function' reflects local environmental pressures. For example, respiratory capacity thresholds for coal miners will differ from those for actuaries. Preliminary modelling suggests this will reduce eligible populations by 40% without altering biological definitions. Stakeholders are invited to propose further subdivisions where budgetary constraints require tighter parameters. Postcode data will be used to auto-assign class to minimise administrative burden.

  3. Conditions statistically typical within a reference class are classified as health, regardless of patient reported outcomes. Dental decay, presbyopia, and degenerative joint changes are prevalent in over 80% of males over 60. Consequently, these represent normal function for the class. Restorative dentistry and cataract surgery will be reclassified as enhancement. Pain management for degenerative conditions is deemed a personal preference. The Committee notes that expecting pain-free mobility in this demographic is a normative expectation unsupported by biostatistics.

  4. Consider the case of Mr A. Henderson (72, former construction worker). Mr Henderson presents with chronic knee pain limiting mobility. However, his knee function falls within the 10th percentile for males aged 70-75 in manual occupations. As this is not statistically subnormal *for his class*, no pathology exists. Treatment was declined. Mr Henderson has since ceased leaving his residence due to pain and reports feelings of isolation. The Committee notes this is a successful alignment of clinical status with biostatistical reality, though social care may wish to review his housing accessibility. His outcome does not invalidate the definition.

  5. The Committee acknowledges asymmetries in the current framework. Mechanisms functioning above the statistical mean (e.g., enhanced memory, pain immunity) do not constitute disease and attract no funding, whereas subnormal function does. Conversely, rare genetic variants causing no functional impairment (e.g., benign enzyme deficiencies) technically qualify as disease due to statistical rarity. Screening programmes will be adjusted to diagnose these individuals to maintain epidemiological accuracy, despite the absence of clinical symptoms. Current projections indicate 98% of the population will qualify as diseased in at least one mechanism by age 50. This highlights the robustness of the screening net.

  6. Regarding pharmaceutical indications, manufacturers may submit data to justify narrower reference classes. If a drug efficacy trial utilises a specific genetic subgroup, that subgroup may be designated a distinct reference class. This allows conditions previously deemed normal to become subnormal within the narrower cohort. The Department views this as a valid refinement of biological data, provided it does not increase overall spend. We are currently reviewing submissions regarding serotonin uptake variants.

  7. A proposal to adopt a 'Harmful Dysfunction' model was considered. This was rejected because the term 'harmful' introduces normative judgement regarding welfare. The Committee cannot adjudicate on welfare without compromising objectivity. Therefore, dysfunction alone suffices, even where no harm is perceived. The Department insists this process involves no value judgements regarding the worth of life with disability. We are simply measuring function.

  8. Responses must be submitted by 14 Novemeber. Please use form BEC-44. Electronic submissions containing normative language (e.g., 'unfair', 'suffering') will be returned for amendment.

  **Annex A: Schedule of Reference Classes (Extract)**
  *   Class 01: Males, 20-30, Sedentary, South East. (Knee flexion norm: 140°)
  *   Class 02: Males, 20-30, Manual, North East. (Knee flexion norm: 125°)
  *   Class 03: Females, 60+, All Occupations. (Visual acuity norm: 6/18)
  *   *Note: Postcode data will be used to auto-assign class. Appeals on class assignment are not permitted.*

  **Annex B: Note of Dissent (Dr E. Vance, Committee Member)**
  I cannot endorse this framework. The selection of a reference class is not a biological fact but a normative choice. Choosing to compare a 70-year-old to other 70-year-olds rather than to a species-typical ideal implies we *ought* to expect decline. This masks a value judgement about acceptable suffering under the guise of statistics. Furthermore, defining disease solely by statistical deviation renders 'health' meaningless if everyone is deviant. We are not removing values; we are merely hiding them in the methodology. Objectivity requires acknowledging the ethical weight of classification, not denying it. To claim otherwise is intellectually dishonest.
