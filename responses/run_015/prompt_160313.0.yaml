      **Department of Health and Social Efficiency**
      **Consultation Document: BEC-2024-01**
      **Subject: Implementation of Biostatistical Eligibility Criteria (BEC)**

      1. The Department welcomes responses regarding the operationalisation of the Biostatistical Eligibility Criteria (BEC) across NHS Trusts. Following the Health Objectivity Act, eligibility for state-funded intervention must be decoupled from subjective assessments of 'suffering' or 'need'. Disease is henceforth defined as statistical subnormal functioning of a mechanism relative to a specified reference class. This ensures resource allocation is based on biological fact rather than normative preference.

      2. To maintain fiscal neutrality, reference classes will be stratified by age, sex, occupation, and region. This granularity ensures that 'normal function' reflects local environmental pressures. For example, respiratory capacity thresholds for coal miners will differ from those for actuaries. Preliminary modelling suggests this will reduce eligible populations by 40% without altering biological definitions. Stakeholders are invited to propose further subdivisions where budgetary constraints require tighter parameters.

      3. Conditions statistically typical within a reference class are classified as health, regardless of patient reported outcomes. Dental decay, presbyopia, and degenerative joint changes are prevalent in over 80% of males over 60. Consequently, these represent normal function for the class. Restorative dentistry and cataract surgery will be reclassified as enhancement. Pain management for degenerative conditions is deemed a personal preference.

