      5. The Committee acknowledges asymmetries in the current framework. Mechanisms functioning above the statistical mean (e.g., enhanced memory, pain immunity) do not constitute disease and attract no funding, whereas subnormal function does. Conversely, rare genetic variants causing no functional impairment (e.g., benign enzyme deficiencies) technically qualify as disease due to statistical rarity. Screening programmes will be adjusted to diagnose these individuals to maintain epidemiological accuracy, despite the absence of clinical symptoms. Current projections indicate 98% of the population will qualify as diseased in at least one mechanism by age 50.

      6. Regarding pharmaceutical indications, manufacturers may submit data to justify narrower reference classes. If a drug efficacy trial utilises a specific genetic subgroup, that subgroup may be designated a distinct reference class. This allows conditions previously deemed normal to become subnormal within the narrower cohort. The Department views this as a valid refinement of biological data, provided it does not increase overall spend.

      7. A proposal to adopt a 'Harmful Dysfunction' model was considered. This was rejected because the term 'harmful' introduces normative judgement regarding welfare. The Committee cannot adjudicate on welfare without compromising objectivity. Therefore, dysfunction alone suffices, even where no harm is perceived. The Department insists this process involves no value judgements regarding the worth of life with disability.

      8. Responses must be submitted by 14 November. Please use form BEC-44. Electronic submissions containing normative language (e.g., 'unfair', 'suffering') will be returned for amendment.

