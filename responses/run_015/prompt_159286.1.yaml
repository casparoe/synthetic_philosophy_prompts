answer: |-
  The standard reading of *Arrival* is a trap: it invites a debate on fatalism that ignores the cognitive science actually on screen. To save the discussion for your first-years, you must pivot hard to the architecture of mind. The central tension is between Jerry Fodor's Language of Thought (LOT) hypothesis and the film's overt Whorfianism. Fodor argues thinking is computation over an innate, syntactically structured Mentalese; public languages are merely input/output devices. The film argues learning Heptapod B rewires the brain to perceive time non-linearly. To reconcile these without surrendering to determinism, we must distinguish between notational restructuring and representational restructuring.

  Notational restructuring changes what you can do with an unchanged system (like switching from Roman to Arabic numerals). Representational restructuring changes the medium of thought itself. The film demands the latter to work emotionally, but LOT can only survive if we argue for the former.

  Start with Heptapod B's lack of phonology. It is writing unmoored from speech. This cuts two ways. On one hand, it makes Heptapod B look like a formalism—mathematics or logic—rather than a natural language. Fodor can accommodate this easily: learning a new formalism is notational restructuring. You are simply using your existing Mentalese to process a more efficient code. On the other hand, the film claims this code alters temporal perception. If a notation changes perception, it ceases to be merely notational and becomes representational. To save LOT, you must argue that the non-linear script allows Louise to access latent capacities of Mentalese that linear speech obscures. The script isn't rebuilding the mind; it's bypassing the serial bottleneck of English. It resolves toward notation only if we treat the "time perception" shift as a change in data access, not a change in the processor.

  This leads to Fodor's concept acquisition problem. Fodor claims you cannot learn a concept you do not already possess, because learning is hypothesis testing using existing concepts. Louise appears to acquire the concept of "time-as-whole," which she lacked. Is she a counterexample? Only if Mentalese is limited to linear temporal concepts. If LOT is truly innate, it must contain all possible coherent concepts, dormant until triggered. Louise isn't acquiring a new concept; she is unlocking a pre-existing one that her native language suppressed. This saves LOT from refutation but weakens the film's drama: it turns Louise's journey into finding a key for a lock that was always there, rather than growing a new organ.

  Consider productivity and systematicity. LOT requires thought to be compositional. Heptapod logograms are compositional but simultaneous rather than sequential. Fodor's Mentalese is often modeled on standard logic, which is linear. If Heptapod B works, it suggests Mentalese's syntax need not be linear strings but could be multi-dimensional or parallel structures. This doesn't kill LOT, but it kills the specific version of LOT that relies on sequential processing. It suggests the "language" of thought might look more like a hologram than a sentence.

  Can one head contain two Languages of Thought? Standard LOT assumes uniqueness: one Mentalese per thinker. If Louise ends up with Heptapod B as a second medium alongside her original Mentalese, LOT is in trouble. It implies the mind is not a unified computational system but a modular collection of distinct representational formats. The coherent LOT reading is that she has one Mentalese with switchable processing modes. Heptapod B becomes a direct interface to Mentalese, bypassing the linear filtering of English. It is not bilingualism of thought, but bilingualism of access. If you argue she has two distinct LOTs, you concede the film contradicts Fodor.

  Where does this reading break? Honestly, it breaks at the phenomenology. The film uses language loosely; its linguistics is not something a linguist would sign off on. The premise is really about a new perceptual modality triggered by language, not language constituting thought. Pushing the LOT lens distorts the movie because LOT denies Strong Whorfianism (language determines thought), while the film requires it to function. If you insist on LOT, the movie quietly turns into a story about an extremely good notation system that optimizes memory retrieval. The emotional weight of "remembering" her daughter's death before it happens relies on the mind actually changing, not just accessing data differently. The film needs Strong Whorf to justify the tragedy; LOT reduces it to a database query.

  So, what does the film add to the Fodor-versus-connectionism debate? It visualizes the *experience* of cognitive architecture. Fodor and his critics argue about syntax and networks in the abstract. *Arrival* suggests that the format of representation matters for what thoughts are thinkable, even if the underlying hardware remains constant. It bridges the gap by showing that notation can become representation if internalized deeply enough. It proposes that language isn't just I/O but a tuning mechanism for attention.

  Close your session with this: The film shows that the boundary between notational and representational restructuring is porous. Fodor insists they are distinct; *Arrival* suggests that mastering a notation sufficiently changes the thinker. It doesn't prove Whorf right, but it challenges Fodor to explain why the medium of input shouldn't shape the medium of processing. You don't need to conclude "Whorf was wrong." You can conclude that the interface between public language and private thought is far more transformative than classical computationalism allows. The movie argues that to learn a new language is to inhabit a new mind, even if the hardware stays the same. That is a claim about the plasticity of meaning, not the inevitability of fate.
