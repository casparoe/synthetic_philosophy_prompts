      *Correction on Concept Acquisition:* Fodor's point is you can't learn a concept without having it. If Louise learns "non-linear time," did she have it? If Mentalese is innate, maybe all possible concepts are there. Heptapod B is the key to the lock.
      *Correction on Bilingualism:* LOT usually posits a single Mentalese. If she switches modes, is it two LOTs? Better to argue it's one LOT with switchable processing modes.

      *Drafting thought:* Ensure the distinction between Strong Whorf (language determines thought) and Weak Whorf (language influences thought) is clear. The film needs Strong. LOT denies Strong.

      *Final Polish:* Check the ending. Needs to be about what the film adds to the debate. The *phenomenology* of thought.

  5.  **Final Word Count Check:**
