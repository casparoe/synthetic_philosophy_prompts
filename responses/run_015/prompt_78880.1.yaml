      *(Self-Correction during drafting)*: I need to make sure I don't accidentally validate FDT in the replies if the thesis is that these puzzles *fail* to showcase it. The thesis is that the puzzles are *bad evidence*, not necessarily that FDT is false. I must hold the line: "These puzzles assume what they try to prove."

