answer: |-
  # Q&A Prep Sheet: Superrationality and Cooperation Workshop

  ### 1. The "Question-Begging" Objection (Rationalist/FDT Audience)
  **Likely Phrasing:** "You claim the 1/20 strategy in Platonia isn't stable because a unilateral deviation yields higher expected utility. But that calculation assumes Causal Decision Theory. If I am a superrational agent, my decision is logically correlated with the other nineteen. If I deviate to 'send with certainty,' I must update my belief that *they* also deviate, because we are running the same algorithm. Under Functional Decision Theory, the 1/20 strategy *is* a stable equilibrium. Aren't you just defining superrationality as 'irrational' by insisting on a decision theory that forbids logical correlation?"

  **Two-Minute Reply:**
  "That is the crux of the disagreement, and I want to be precise about where the burden of proof lies. You are correct that *if* we assume logical correlation, the 1/20 strategy becomes stable. But the Platonia Dilemma is traditionally presented as a *demonstration* that we should adopt superrationality, not as a consequence of already having adopted it.

  My thesis is that the puzzle slides between two claims. Claim A: 'If we all reason superrationally, we win.' Claim B: 'You should reason superrationally because it wins.' The math works for Claim A. It fails for Claim B unless you have independent reason to believe your choice controls theirs. In a one-off scenario with no causal link and no pre-commitment technology, telling an agent to treat their choice as a logical proof for others' choices is asking them to assume the very correlation the puzzle is supposed to justify.

  I am not insisting CDT is the only true rationality. I am insisting that these puzzles do not *prove* FDT. They simply show that FDT agents win where CDT agents lose. But for the CDT agent in the room, the recommendation to play 1/20 is literally advice to leave money on the table, given their model of the world. If the only way to make the recommendation stable is to change the definition of the agent, then the puzzle hasn't solved the tension between individual and group rationality; it has just moved it into the definition of the agent."

  **Where this is thin:**
  This relies on the audience accepting that "rationality" must be actionable for a CDT agent without prior conversion. If the Rationalists view CDT as simply false (like believing the earth is flat), my distinction between "proving" and "assuming" looks like a demand to justify truth using false premises.

  **Concede outright:**
  Concede that *within* the FDT framework, the 1/20 strategy is indeed an equilibrium. Do not try to argue the math is wrong; argue the *entry cost* to that framework is the actual point of contention.

  ***

  ### 2. The "Equilibrium vs. Rationality" Objection (Decision Theorist Audience)
  **Likely Phrasing:** "You argue that because the superrational strategy isn't a Nash equilibrium, it's not a stable solution. But rationality isn't defined by Nash equilibrium. In the Smoking Lesion problem, the rational act isn't always the equilibrium act if we consider evidential correlations. By equating 'individually stable' with 'Nash equilibrium,' aren't you just stipulating that causal best-responses are the only valid form of reasoning, which is exactly what the debate is about?"

  **Two-Minute Reply:**
  "I appreciate the distinction, and I should clarify: I am not equating rationality with Nash equilibrium universally. I am equating 'individual stability' with 'resistance to unilateral deviation given the agent's beliefs.'

  In the Smoking Lesion, the agent's action doesn't cause the lesion, but it correlates with it. In Platonia, under CDT, my action doesn't correlate with theirs. If I switch from 1/20 to 1, I gain expected utility *by my own lights*. A recommendation that tells an agent to act against their own expected utility calculation, without providing a mechanism to align their beliefs with others, is a moral injunction, not a decision-theoretic solution.

  The damage in calling these puzzles a 'showcase for superrationality' is that it suggests the *logic* of the situation forces cooperation. It doesn't. The logic of the situation forces defection unless you import an external constraint—like a shared algorithm or a moral commitment. My point is that the puzzle itself provides no leverage for that leverage. It highlights a gap between group optimality and individual incentive. Calling that gap 'superrationality' obscures the fact that it's just a coordination failure without a coordination mechanism."

  **Where this is thin:**
  This risks sounding like I'm defending CDT as the normative standard. If the Decision Theorists are EDT proponents, they might agree with me against CDT but still think the puzzle supports EDT-style reasoning. I need to ensure I don't alienate the EDT crowd while batting down the FDT crowd.

  **Concede outright:**
  Concede that "Nash equilibrium" is a specific technical term that might be too narrow for "rationality." Clarify that you mean "stable under the agent's own subjective expected utility calculation."

  ***

  ### 3. The "Empirical Vacuity" Objection (Experimental Game Theorist Audience)
  **Likely Phrasing:** "You say the Luring Lottery collapsed because the superrational solution wasn't stable. But the Lottery actually happened. People sent millions of entries. The prize was zero. The real-world data matches the CDT prediction of runaway defection, not the superrational prediction. So why does it matter if the puzzle is a 'poor showcase'? The showcase worked perfectly: it showed that without enforcement, people defect. Isn't your conclusion just a verbose way of saying 'incentives matter'?"

  **Two-Minute Reply:**
  "It does matter, because the narrative around the Luring Lottery is often that the participants were 'irrational' for destroying the prize pool. The superrational story is: 'If everyone had been rational, they would have sent one entry and won.'

  My argument is that this narrative is backwards. The participants weren't irrational; the *situation* was hostile. By calling the one-entry strategy 'superrational,' we imply there is a reasoning process available to the participants that they failed to access. I'm arguing there wasn't. Given the rules, sending one entry was strictly dominated by sending two, regardless of what others did.

  If we tell people they failed to be rational, we imply the solution is better thinking. If we tell them the situation was unstable, we imply the solution is better institutions. For a workshop on cooperation, that is a vital distinction. If I convince you that Platonia is a failure of rationality, you go home and try to train people to think differently. If I convince you it's a failure of stability, you go home and try to change the rules of the game. The latter actually solves cooperation problems; the former just creates guilt."

  **Where this is thin:**
  This borders on a sociological point rather than a decision-theoretic one. The Experimentalists might press me on whether "training people to think differently" (norm internalization) *is* a valid mechanism for changing the payoff structure, which would bring us back to the Rationalist's point.

  **Concede outright:**
  Concede that if "rationality" includes internalized norms that change utility functions, then the superrational solution becomes stable. But insist that this changes the game from Platonia to a different game entirely.

  ***

  ### The Question I Hope Nobody Asks

  **"If an agent is truly updateless, doesn't the distinction between 'my payoff' and 'group payoff' dissolve entirely? If you choose the policy that maximizes utility across all instantiations of your algorithm, aren't you just describing a utilitarian calculus? And if so, isn't your entire critique just an objection to utilitarianism disguised as a technical objection to game theory?"**

  **Why this is dangerous:**
  This question bypasses the technical squabbles about equilibrium and correlation. It attacks the foundational separation I am trying to maintain between "individual rationality" and "group optimality." If the audience accepts that a sufficiently abstract decision theory *identifies* the individual with the group, my thesis that "these puzzles show a conflict between individual and group" collapses. It forces me to defend the sanctity of the individual agent's boundary, which is a philosophical minefield I do not have time to navigate in a Q&A. It implies my "stability" argument is just a defense of causal selfishness.
