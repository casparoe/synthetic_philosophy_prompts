      *   **Topic:** Superrationality and cooperation (specifically critiquing the Platonia Dilemma and Luring Lottery as showcases for superrationality).
      *   **Thesis:** These puzzles don't prove superrationality works; they show some situations lack individually stable cooperative solutions. The "superrational" advice (1/20 probability in Platonia, 1 entry in Lottery) maximizes *group* payoff but isn't a Nash equilibrium (unstable under unilateral deviation).
      *   **Audience:** Three distinct thirds:
          1.  *Decision Theorists:* Know CDT/EDT, Newcomb, Smoking Lesion. Care about formal coherence and definitions of rationality.
          2.  *Experimental Game Theorists:* Skeptical of theory vs. reality. Care about empirical validity and incentives.
          3.  *Rationalists (FDT/Updateless):* Believe in choosing for mirror images. Care about the normative force of superrationality.
      *   **Format:** Ordered by damage potential (high to low). Phrased as the audience would ask. Two-minute spoken reply for each. Frank note on weaknesses. Note on concessions. End with the "hope nobody asks" question.
      *   **Constraints:** No padding with generic objections. Specific to the commitments. No citations needed.

  2.  **Deconstruct the Thesis & Vulnerabilities:**
      *   *Thesis:* Platonia/Lottery recommendations maximize group utility but aren't Nash equilibria. Therefore, they don't demonstrate a new *kind* of rationality, just a conflict between individual and group optimality.
      *   *Vulnerability 1 (Rationalists):* You are begging the question by assuming CDT/Nash is the only standard for "stability." Superrationality *redefines* the agent's decision problem to include logical correlations. If you assume logical correlation, the 1/20 strategy *is* stable.
      *   *Vulnerability 2 (Decision Theorists):* You are conflating "rationality" with "equilibrium." Rationality is about procedure, equilibrium is about outcome stability. Also, is the Platonia setup actually a Prisoner's Dilemma variant or a Coordination Game?
      *   *Vulnerability 3 (Experimentalists):* If the theory predicts collapse (Lottery) and reality shows collapse, isn't the theory (CDT/Nash) actually winning here? Why call it a failure of superrationality if superrationality failed to predict behavior?
      *   *Vulnerability 4 (The "Hope Nobody Asks"):* A question that undermines the distinction between "group payoff" and "individual rationality" by invoking a specific decision theory (like FDT) that dissolves the distinction entirely.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Attempt 1 (Rationalist):* "Why don't you think logical correlation matters?" -> *Too vague.*
