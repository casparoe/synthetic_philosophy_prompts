      2.  **Decision Theorist:** If they point out that I'm defining rationality *as* CDT/Nash, I look biased.
      3.  **Experimentalist:** If they say "The lottery actually failed, so your theory matches reality," it supports my conclusion but undermines the philosophical stakes. Actually, if they say "People behave irrationally," it complicates things. Let's make the Experimentalist question about whether the "collapse" validates the CDT prediction, making superrationality empirically vacuous.

