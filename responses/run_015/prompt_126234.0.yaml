answer: |-
  This is a precise and devastating critique of Hardin's metaphor, and mapping the *Titanic* onto "Lifeboat Ethics" exposes the structural weaknesses in his argument. Hardin's 1974 essay relies on a specific set of assumptions about carrying capacity, legitimacy, and threat. The *Titanic* disaster provides an empirical test case where those assumptions break down.

  Here is the careful mapping you requested, moving from the actors to the options, the failure modes, and finally the political work the metaphor performs.

  ### 1. The Mapping: Who is Where?

  In Hardin's metaphor, the **Lifeboat** is the Rich Nation, the **50 Inside** are its Citizens, and the **100 Swimmers** are the Poor of the World.

  On the night of April 14, 1912:
  *   **The Lifeboat:** The individual wooden lifeboats (and collapsibles). There were 20 of them.
  *   **The 50 Inside:** The ~705 survivors who secured a seat.
  *   **The 100 Swimmers:** The ~1,500 people left on the sinking hull or in the water.

  **The Discrepancy:** Hardin's metaphor depends on a pre-existing, legitimate boundary between "inside" and "outside." He assumes the 50 inside *belong* there and the 100 outside *do not*.
  On the *Titanic*, everyone held a ticket. Everyone had paid for passage on the same vessel. The "inside/outside" split was not a matter of sovereignty or citizenship, but of real-time triage. The people in the lifeboats did not have a prior moral claim to the seats superior to those on the deck; they simply had proximity, class privilege, or gender that matched the officers' loading protocols. Hardin's metaphor smuggles in a property right ("this is *our* boat") that did not exist on the *Titanic* deck. The lifeboats were appurtenances of the ship, not independent sovereign states.

  ### 2. The Officers' Options vs. Hardin's Options

  Hardin posits three options:
  1.  **Take all aboard:** Swamp the boat (universal death).
  2.  **Take some:** Use the safety factor, invite climbing, eventual swamping.
  3.  **Take none:** Preserve the boat, guard against boarders.

  **The Actual Options:**
  The officers (Murdock, Lightoller, Lowe) were not deciding between "save everyone" and "save no one." They were managing **launch logistics**.
  *   **Davits and Gear:** The Welin davits were new. Officers feared that lowering a boat at full capacity (65–70 people) would buckle the arms or snap the falls.
  *   **The Safety Factor:** Hardin argues for a safety factor to protect against environmental variance (storms, etc.). The officers applied a safety factor to protect against *mechanical failure*.
  *   **The Cold Water:** A full lifeboat sits lower in the water. In the North Atlantic, a wave splash could freeze passengers or swamp the gunwales.

  **The Inversion:**
  Hardin uses the "safety factor" to argue against admitting *more* people. The *Titanic* officers used the "safety factor" to justify admitting *fewer* people.
  *   **Hardin:** "We must not load to capacity because the future is uncertain."
  *   **Officers:** "We must not load to capacity because the gear is untested."
  *   **Result:** Lifeboat 6 left with 28 people in a 65-person boat. Lifeboat 5 left with 41.
  *   **Hardin's Blind Spot:** Hardin assumes the "people in the boat" will maximize their survival by filling the boat to its safe limit. He does not account for institutional cowardice or risk aversion that leaves capacity unused.

  ### 3. The Half-Empty-Boat Problem

  This is the critical empirical failure of Hardin's theory in this context. Hardin's catastrophe is **swamping**. He argues that if you take extra people, the boat sinks, and *everyone* dies.

  **The Reality:**
  *   No lifeboat sank from being overloaded.
  *   Collapsible A was swamped (water inside the boat), but it did not sink; 12 men stood in freezing water and survived.
  *   Collapsible B floated upside down; 28 men clung to the hull and survived.
  *   The lifeboats that returned to pick up bodies (Boat 14, Boat 4) did not sink under the weight of the dead or the few living they retrieved.

  **The Failure Mode:**
  The disaster was not one of **excess**, but of **vacancy**. Roughly 470 seats went into the water empty.
  Hardin's theory has no variable for "unused capacity." He assumes rational actors will utilize their full carrying capacity to preserve their group. The *Titanic* shows that social hierarchy and risk aversion can lead to **under-utilization of survival resources**.
  If Hardin's logic holds, the officers should have filled every boat to the rated capacity (1,178 souls). If they had, and assuming the boats held (which evidence suggests they would have), ~470 more people could have survived. The "safety factor" Hardin advocates became a death sentence because it was applied to the *loading* rather than the *voyage*.

  ### 4. Internal Allocation: The Question Hardin Skips

  Hardin writes: *"Which ten [do we take]?"* He treats this as an impossible question that justifies taking *none*.
  On the *Titanic*, the question was not "Who gets in the boat?" (initially), but "Who gets priority among the people already on the ship?"

  **The Distributive Reality:**
  *   **Women and Children:** The "Birkenhead Drill" protocol was applied, but unevenly.
  *   **Class:** This is where Hardin's metaphor dissolves. Hardin assumes the "50 inside" are a homogeneous unit (the Rich Nation). On the *Titanic*, the "50 inside" were selected based on class.
      *   1st Class Women Survival: ~97%
      *   3rd Class Women Survival: ~46%
      *   1st Class Men Survival: ~33%
      *   3rd Class Men Survival: ~16%
  *   **The Gatekeepers:** The officers and stewards controlled the gates between the decks. Hardin's metaphor assumes the "swimmers" are outside the border. On the *Titanic*, the "swimmers" were locked behind gates *inside* the border.

  Hardin's ethics are silent on internal distribution. He assumes the "lifeboat" is already full of "us." The *Titanic* reveals that the definition of "us" is the primary political act. The officers didn't just guard against boarders from the water; they guarded against passengers from steerage climbing up to the boat deck.

  ### 5. The Metaphor's Political Work: Defense vs. Distribution

  You asked the most important question: *Does taking this literally expose that the move doing all the work is positing a settled manifest plus outsiders?*

  **Yes.**
  Hardin's argument relies on re-casting a **distributive problem** as a **defense problem**.
  *   **Distributive Problem:** We have 1,178 seats and 2,224 people. How do we allocate them justly?
  *   **Defense Problem:** We have 60 seats and 100 invaders trying to swamp us. How do we survive?

  By positing the "swimmers" as a threat (who will "climb in" and "swamp" the boat), Hardin removes the obligation to distribute. He turns the people in the water into an existential threat to the people in the boat.

  **The *Titanic* Refutation:**
  On the *Titanic*, the people in the water were not a threat. They were dying. They did not swamp the boats; the boats rowed away.
  *   **Boat 1:** Carried 12 people (capacity 40). Included a prominent businessman (Sir Cosmo Duff-Gordon). They rowed away to avoid being "swamped" by swimmers, though few swimmers were near.
  *   **The Aftermath:** The inquiry focused on why they didn't go back. The defense was "fear of being swamped." The reality was a reluctance to risk the safety of the few for the many.

  Hardin's metaphor legitimizes this reluctance by calling it "ecological prudence." The *Titanic* exposes it as **class preservation**. The "safety factor" was not about the physics of the boat; it was about the social distance between the ticket-holders in the seats and the ticket-holders in the water.

  ### 6. Where the Theory is Silent

  1.  **The Source of Capacity:** Hardin treats the boat's size (60 seats) as a given. On the *Titanic*, the number of seats was a regulatory failure (British Board of Trade rules were based on tonnage, not passenger count, and were outdated). Hardin's ethics accept the status quo of capacity; they do not question why the boat is too small.
  2.  **The Return Trip:** Hardin's lifeboat drifts. *Titanic* lifeboats had oars. They had the agency to return. Hardin's metaphor assumes passivity (drifting) to justify exclusion. If the boat can row, the ethics of exclusion change.
  3.  **The Shared Fate:** Hardin assumes the rich nation can survive alone. On the *Titanic*, the lifeboats were tethered to the ship's fate until the end. In the global economy, Hardin's "rich nations" are tethered to the "poor nations" via supply chains, climate, and migration. The *Titanic* lifeboats were safe only until the ship sank; then they were small boats in a vast ocean. Their long-term survival depended on the *Carpathia* (an outside rescue). Hardin ignores the need for a larger rescue mechanism (global cooperation).

  ### Conclusion

  The *Titanic* does not support Lifeboat Ethics; it indicts them.
  Hardin argues that justice (sharing the seats) leads to ruin (swamping). The *Titanic* demonstrates that **hoarding the seats led to ruin.**
  *   **Hardin's Prediction:** Overloading kills.
  *   **Titanic's Reality:** Under-loading killed.
  *   **Hardin's Justification:** We must protect our safety factor.
  *   **Titanic's Reality:** The safety factor was a pretext for leaving seats empty.

  The metaphor works only if you accept Hardin's premise: that the people in the water are strangers threatening your survival. If you recognize them as fellow passengers—people with equal claim to the vessel whose capacity was structurally insufficient—then the "lifeboat" is not a sovereign state, but a trust. The officers were not guardians of a nation; they were trustees of a common resource. By treating the resource as private property (seats for the few), they ensured the maximum loss of life.

  Hardin's essay is an attempt to convince the people in the boat that the people in the water are dangerous. The *Titanic* shows that the people in the water were just cold, and the people in the boat were just afraid. The tragedy wasn't that the boat was full; it was that it was half-empty, and the theory used to justify that emptiness is the same one Hardin wrote forty years later.
