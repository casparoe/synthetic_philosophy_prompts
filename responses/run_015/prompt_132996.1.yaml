  **Verdict on the Proposal**
  **Impermissible.**

  **The Rule**
  **"Mechanical preferences in educational admissions (quotas or fixed bonuses) are permissible only if the beneficiary group is defined by an ascriptive identity with a history of systemic subordination AND the scheme excludes the economically privileged within that group. Holistic review may waive the exclusion requirement for ascriptive groups. Class-based or circumstantial categories (such as income or first-generation status) are impermissible grounds for admissions preferences regardless of means-testing. Corporate board quotas are exempt from these constraints as they govern power distribution rather than educational access."**

  **Why this Rule fits the Record (1–7)**
  *   **1 (Holistic Race):** Permissible because it is holistic (waives means-testing) and Race is ascriptive/subordinated.
  *   **2 (Mechanical Race):** Impermissible because it is mechanical but lacks the "creamy layer" exclusion required for mechanical schemes.
  *   **3 (Board Quota):** Permissible because board seats are exempt (power distribution, not education).
  *   **4 (Legacy):** Impermissible because Legacy is not a subordinated ascriptive group.
  *   **5 (Caste):** Splits precisely on the "creamy layer" (means-testing) constraint for mechanical quotas.
  *   **6 (Men):** Impermissible because Men are not a subordinated group.
  *   **7 (Income):** Impermissible because Income is not an ascriptive identity (class-based categories are barred from admissions preferences).

  **Prediction on the Discriminating Case**
  Of the two cases you proposed, the **first-generation reservation with an exclusion for the well-off and a ten-year sunset** is the sharper instrument. The board seat case tests the "power exemption" (Item 3), which is already well-defined in her record. The first-generation case tests the core tension between **Identity** (Item 5, 7) and **Disadvantage** (Item 5, 7).

  *   **My Prediction for this Case:** **Impermissible.**
  *   **Reasoning:** Under the rule above, "First-Generation" is a circumstantial/class-proxy category, not an ascriptive identity like Caste or Race. Item 7 established that poverty/disadvantage alone is the wrong instrument for admissions ordering, even if means-tested. Adding a sunset clause does not cure the defect of the category itself.

