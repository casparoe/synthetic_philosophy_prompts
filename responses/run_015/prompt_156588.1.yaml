prompt: |-
  Quick context so you know what I'm optimizing for: I'm the in-house philosopher at a small foundation that makes maybe eight to twelve big bets a year — the hits-based giving style, where most grants go to zero and one or two are suppose to carry the whole thing — plus a boring hedge portfolio that's meant to keep the lights on. Decisions get made by a committee of five, and for a while now we've been using risk-weighted expected utility as our working framework, the Buchak-style one where you list outcomes worst-to-best and weight each increment by a risk function applied to the cumulative probability of doing at least that well: REU(a) = x1 + sum over i>1 of r(P(X >= xi)) * (xi - x_{i-1}), with convex r buying you risk aversion without bending the utility function. That last feature is most of why we liked it — we can be cautious about gambles without signing up for the weird large-stakes implications you get out of a concave u.

  I've got about eighteen months of protected time coming up: a fellowship, basically me and a whiteboard, no RA, no data collection, and no appetite in the org for anything that smells like an empirical project run on staff. I want to spend it on the one or two foundational questions in this area where progress would actually change what we recommend, not on the question that would be most fun to write a paper about. So give me a ranked agenda.

  The things I keep circling, roughly in the order they worry me, though I don't trust my own ordering:

  1. r is global. One function over the whole cumulative-probability scale, so if we tune it to be sensibly cautious about a 60/40 grant call, we've also committed ourselves to damping long shots with tiny probabilities — which is exactly the case the whole strategy is built around. Is there a coherent stake-sensitive or local version, something with more than one parameter, or does letting r vary by stake size or outcome region cost you whatever made the framework attractive in the first place?

  2. Level of application. Should the committee apply r once, at the level of the portfolio, and be straight expected-value maximizers underneath? Or at each individual decision? Applying it at both levels looks like double-counting caution to me, but I can't say why in a way that survives pushback from the others.

  3. We're five people with genuinely different risk functions. I'm not sure the framework has anything to say when the decision-maker is a committee, and I can't tell whether that's a tractable gap or a sign we picked up the wrong tool. Is there an aggregation story worth trying to reconstruct, or does the whole approach only make sense for a single agent?

  4. Our probabilities are contested. Most of our arguments are about the distribution, not about the risk attitude, and the rank-dependent machinery needs a precise distribution to even get going. Does risk-weighting do any work when the input probabilities themselves are up for grabs, or is that a separate problem I should stop trying to fold in?

  5. A sanity check that might sink the rest: for numbers in the range we actually see, how often does plugging in something like r(p) = p^2 flip a decision relative to plain EU? If the honest answer is almost never, then the right use of eighteen months might be something else entirely, and I'd rather find that out now.

  What I want is the ordering and the reasoning behind it: what you're counting as importance here (my own candidate: would the answer change a check we write), what's genuinely tractable for one philosopher with no data, which of these is upstream of which, which ones are philosophers' playgrounds that wouldn't move practice at all, and what kind of result or argument over the next couple of years would move something up or down the list. Please don't just describe the state of the literature at me — I can look that up myself. Tell me what to work on and what to drop, and say which of my five I've mis-ranked.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

  1.  **Analyze the User and Context:**
      *   **Role:** In-house philosopher at a small foundation.
      *   **Strategy:** Hits-based giving (8-12 big bets/year, most fail, 1-2 carry) + boring hedge portfolio.
      *   **Decision Making:** Committee of 5.
      *   **Current Framework:** Risk-Weighted Expected Utility (REU), specifically Buchak's style (rank-dependent, risk function $r$ applied to cumulative probabilities).
      *   **Motivation for REU:** Separates risk attitude ($r$) from utility ($u$), allowing risk aversion without diminishing marginal utility of money (crucial for large-stakes philanthropy).
      *   **Resources:** 18 months protected time (fellowship), solo philosopher, no RA, no empirical data, no appetite for empirical projects.
      *   **Goal:** A ranked agenda of foundational questions where progress would *actually change recommendations*, not just be fun to write about.
      *   **Input:** 5 specific worries/questions provided by the user.

  2.  **Evaluate the 5 Questions:**

      *   **Q1: Global vs. Local $r$.** (Is one risk function for all stakes/probabilities coherent?)
          *   *Impact:* High. If $r$ is global and convex (risk-averse), it kills the "hits-based" long shots (tiny $p$, huge $x$). The foundation's strategy relies on these. If REU forces them to reject their core strategy, the framework is useless.
          *   *Tractability:* High. This is conceptual/normative analysis. Can be done with a whiteboard.
          *   *Upstream:* Very. If $r$ can't vary, REU might be the wrong tool entirely.

      *   **Q2: Level of Application.** (Portfolio vs. Individual Grant.)
          *   *Impact:* High. Applying risk aversion to individual grants in a hits-based portfolio is a category error. You want risk *at* the project level to get the hits, managed at the *portfolio* level. If they apply $r$ to every grant, they will fund nothing risky.
          *   *Tractability:* High. Conceptual analysis of decision theory + portfolio theory interface.
          *   *Upstream:* High. Determines *what* gets fed into the REU formula.

      *   **Q3: Committee Aggregation.** (5 people, 5 risk functions.)
          *   *Impact:* Medium-High. If they can't agree on $r$, decision paralysis or arbitrary compromise.
          *   *Tractability:* Medium. Social choice theory is messy, but normative arguments about "foundation as agent" are doable.
          *   *Upstream:* Medium. You need to know *what* you are aggregating (Q1 & Q2) before aggregating *who*.

      *   **Q4: Contested Probabilities.** (Uncertainty about $p$ vs. Risk about $x$.)
          *   *Impact:* Medium. REU assumes known probabilities. If $p$ is fuzzy (ambiguity), REU might not handle it well (needs Maxmin Expected Utility or similar).
          *   *Tractability:* Low-Medium. Distinguishing risk from ambiguity is hard without data/elicitation.
          *   *Upstream:* Medium. If probabilities are too fuzzy, REU calculation is garbage-in-garbage-out.

      *   **Q5: Sanity Check (Does $r$ actually flip decisions?).**
          *   *Impact:* Critical. If REU $\approx$ EU in practice, the 18 months are wasted on REU specifics.
          *   *Tractability:* High. Simple modeling/sensitivity analysis.
          *   *Upstream:* **The Highest.** This is the "Stop/Go" signal.

  3.  **Determine the Ranking Strategy:**
      *   **Criterion 1: Existence/Viability.** Does the framework work for *this* strategy at all? (Q5, Q1).
      *   **Criterion 2: Operationalization.** How do we actually use it? (Q2).
      *   **Criterion 3: Social/Epistemic Reality.** Who decides and what do they know? (Q3, Q4).
      *   **Constraint:** Solo philosopher, no data. Needs conceptual clarity or simple modeling.
      *   **User's Mis-ranking:** The user put Q5 last ("sanity check"). This is dangerous. If the answer is "never flips," the other four are moot. Q1 is ranked first by the user, which is good, but Q5 is more fundamental. Q2 is ranked second, which is also crucial because hits-based giving *requires* portfolio thinking, not individual grant REU.

  4.  **Drafting the Agenda (Iterative Process):**

      *   *Critique of User's Order:* They put the "Sanity Check" (Q5) last. This is the biggest error. If REU doesn't diverge from EU in the relevant range, the whole project is dead. They put "Global $r$" (Q1) first. This is logically deep, but practically, if Q5 fails, Q1 doesn't matter.
      *   *New #1:* Q5 (The "Does it matter?" test). Needs to be a quick modeling exercise.
      *   *New #2:* Q2 (Portfolio vs. Project). This is the specific tension with "hits-based giving." If they apply REU to individual grants, they kill the strategy. This is the most likely place for practical error.
      *   *New #3:* Q1 (Global vs. Local). If Q5 passes and Q2 is solved, does the specific shape of $r$ break the long shots? This is the theoretical core.
      *   *New #4:* Q3 (Committee). Important for governance, but secondary to the math working.
      *   *New #5:* Q4 (Probabilities). Important, but often REU is robust enough, or ambiguity aversion is a separate layer. Least tractable for a solo philosopher without data.

  5.  **Refining the Arguments for the Ranking:**

      *   **Q5 (Sanity Check):** Why move to top? Because it's a falsification test. 18 months is too long to spend on a framework that doesn't move the needle. *Action:* Build a spreadsheet model of their typical grant distribution.
      *   **Q2 (Level of Application):** Why high? Because "hits-based" implies portfolio optimization. REU is often applied to acts. If the "act" is a single grant, REU kills it. If the "act" is the portfolio, REU might work. This defines the *unit of analysis*.
      *   **Q1 (Global $r$):** Why third? It's the deepest theoretical problem (Buchak's REU has this known issue). But it only matters if the framework is used (Q5) and the unit is defined (Q2).
      *   **Q3 (Committee):** Why fourth? It's a social choice problem. Can be solved by agreeing on a "foundation persona." Less foundational than the math itself.
      *   **Q4 (Probabilities):** Why last? Ambiguity vs. Risk is a rabbit hole. Without data, it's purely speculative. Also, REU can often absorb some ambiguity via the risk function.

  6.  **Developing the "Tractability" and "Impact" Analysis:**
      *   Need to emphasize *what the output looks like*. Not a paper, but a memo or a decision protocol.
      *   Need to address the "Solo Philosopher" constraint. No empirical elicitation of risk attitudes. Must rely on normative arguments and sensitivity analysis.

  7.  **Addressing the Specific "Mis-ranking":**
      *   Explicitly tell them Q5 is wrong at the bottom.
      *   Explicitly tell them Q2 is more urgent than Q1 because Q2 determines *what* Q1 applies to.

  8.  **Final Review against Constraints:**
      *   Did I answer the prompt? Yes (Ranked agenda, reasoning, mis-ranking identification).
      *   Is the tone appropriate? Yes (Professional, direct, peer-to-peer).
      *   Did I avoid literature review? Yes, focused on action.

  9.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Wait, one nuance on Q5:* The user says "no appetite for empirical project." Q5 sounds empirical ("how often does it flip"). I need to frame Q5 as *theoretical modeling* using their *existing* grant parameters, not new data collection. They know their grant sizes and rough odds.
      *   *Nuance on Q2:* This is the "Portfolio vs. Project" distinction. In hits-based giving, you want EU on projects, REU (or constraints) on the portfolio. Or REU on the portfolio with a specific $r$. I need to be clear that applying REU to individual grants is likely the fatal error.
      *   *Nuance on Q1:* Buchak acknowledges the "global" issue. The user is asking if a local version destroys the axioms. This is heavy decision theory. Keep it focused on *practical coherence* for the foundation, not just axiom satisfaction.

  10. **Final Polish:** Ensure the distinction between "Risk" (known probs) and "Ambiguity" (unknown probs) is clear in Q4. Ensure the distinction between "Utility of Money" and "Risk Weight" is clear in Q1.

  *(Self-Correction)*: I need to make sure I don't just say "Do Q5." I need to explain *how* a philosopher does Q5 without data. Answer: Sensitivity analysis on the parameters they *already use* for internal memos.

  Let's assemble the response.
answer: |-
  This is a sharp setup. You have a clear constraint (solo, conceptual, 18 months) and a clear success metric (does it change the checks we write?). You are also correctly identifying that Buchak's REU, while elegant, has known friction points when applied to institutional, portfolio-based, high-variance philanthropy.

  Here is the ranked agenda, ordered by **upstream necessity** and **practical impact**. I have reordered your list significantly. Your biggest mis-ranking is placing the "Sanity Check" (5) last; that is your stop/go gate. Your second biggest is placing the "Global $r$" (1) above "Level of Application" (2); the unit of analysis determines whether the global $r$ problem even bites.

  ### 1. The Sanity Check (Your #5)
  **Question:** In the parameter range of our actual grants, does REU with a plausible risk function diverge from EU enough to alter funding decisions?
  **Why Top Rank:** This is a falsification test. If the answer is "no," you save 18 months. If the answer is "yes, but it recommends the opposite of our strategy," you also save 18 months. You cannot justify working on the axiomatic coherence of a tool (Q1, Q2, Q3) if the tool is inert or self-defeating in your specific domain.
  **Tractability (High):** You do not need new data. You need the parameters from your last 3 years of grant memos (estimated $p$, estimated impact $x$, cost). Build a sensitivity model. Vary $r(p) = p^k$ for $k \in [1, 3]$. See where the ranking of grants flips relative to plain EV.
  **Deliverable:** A memo titled *"Sensitivity of Grant Rankings to Risk-Weighting Parameters."* If the ranking doesn't budge, you pivot to ambiguity aversion or constraints. If it bobbles wildly, you know you need Q2 and Q1.
  **Move Up/Down:** Moves down if the model shows stable divergence that aligns with intuition. Moves up (to "abandon project") if REU systematically rejects the long-shot grants that define your strategy.

  ### 2. Level of Application (Your #2)
  **Question:** Is the "act" in our REU function a single grant or the annual portfolio?
  **Why Second Rank:** This is the most common failure mode for hits-based givers using risk-averse frameworks. If you apply a convex risk function $r$ to individual grants, you will mathematically penalize the very variance you need to generate a "hit." You need risk-neutrality (EU) at the project level and risk-management at the portfolio level. REU is flexible enough to handle this, but only if you define the domain correctly. If you get this wrong, Q1 is irrelevant because you're optimizing the wrong object.
  **Tractability (High):** This is conceptual architecture. You need to argue normatively that the Foundation is the agent, not the Program Officer. The "outcome" is the annual portfolio impact, not the single grant success.
  **Deliverable:** A decision protocol specifying that REU is applied to the *portfolio distribution*, while individual grants are screened via minimum EV thresholds.
  **Move Up/Down:** Moves up if Q1 reveals that portfolio-level REU is computationally or conceptually impossible without Q1's solution.

  ### 3. Global vs. Local Risk Function (Your #1)
  **Question:** Can we justify a stake-sensitive or local $r$ without breaking the axioms that make REU attractive?
  **Why Third Rank:** This is the deepest theoretical problem, but it only matters if Q1 and Q2 pass. Buchak's framework relies on a global $r$ to maintain separability and avoid the Allais paradox. If you allow $r$ to vary by stake size or probability region (e.g., risk-neutral for $p < 1\%$, risk-averse for $p > 50\%$), you risk re-introducing the dynamic inconsistencies REU was meant to solve. However, for a foundation, "coherence" matters less than "not going bust." You need to determine if a *piecewise* $r$ is defensible as a "rule of thumb" approximation of a more complex utility structure, or if it requires a new axiomatic basis.
  **Tractability (Medium):** This is pure philosophy/math. You can explore this on the whiteboard. Look at "Local REU" literature or argue for a pragmatic breach of axioms for institutional stability.
  **Deliverable:** A white paper arguing for a "Two-Region Risk Function" (e.g., one $r$ for survival risks, one for upside variance) with a defense of why axiom violation is acceptable for institutional decision-making.
  **Move Up/Down:** Moves up if Q2 forces you to apply REU at the portfolio level, where the stakes are huge and the "global" penalty on tail events becomes crushing.

  ### 4. Committee Aggregation (Your #3)
  **Question:** How do we aggregate five different risk functions into one foundation $r$?
  **Why Fourth Rank:** This is a social choice problem layered on top of decision theory. It is important for governance, but less foundational than the math itself. If the math (Q1, Q2) says "REU is the wrong tool," it doesn't matter how you aggregate. If the math works, you can solve this politically (e.g., "we adopt the median $r$" or "we adopt the most conservative $r$ to ensure survival").
  **Tractability (Medium):** You can model this conceptually. The risk here is paralysis. The philosophical work is to define the Foundation as a *corporate agent* with its own risk attitude, distinct from the sum of its staff.
  **Deliverable:** A governance memo proposing a method for setting the institutional $r$ (e.g., annual calibration vote, or fixed by charter).
  **Move Up/Down:** Moves up if the committee is deadlocked and blocking grants. Moves down if the committee is willing to defer to the "institutional persona" you define in Q2.

  ### 5. Contested Probabilities (Your #4)
  **Question:** Does risk-weighting do work when probabilities are ambiguous/contested?
  **Why Last Rank:** This is the rabbit hole. Distinguishing Risk (known $p$) from Ambiguity (unknown $p$) usually requires Maxmin Expected Utility (MEU) or $\alpha$-MaxMin, not REU. Trying to fold ambiguity into the REU risk function $r$ is theoretically messy and often collapses into "we just discount the EV." Given your constraint (no empirical data), you cannot elicit true ambiguity attitudes. You are better off treating contested probabilities as a separate "confidence discount" applied *before* the REU calculation.
  **Tractability (Low):** Without data, this is speculative. It is also likely that your "risk function" is already doing double-duty as an "ambiguity function." Untangling them might not change decisions.
  **Deliverable:** A guideline on how to convert "confidence levels" into adjusted probabilities before entering the REU formula.
  **Move Up/Down:** Moves up if Q1 shows that REU is too brittle to handle the fuzziness of your actual grant estimates.

  ---

  ### Summary of Mis-rankings & Strategy

  1.  **Move Q5 to #1.** Do not spend a month on axioms before you know if the axioms change the check amount. Run the spreadsheet model in your first 4 weeks.
  2.  **Move Q2 to #2.** You are a hits-based fund. If you apply risk aversion to individual bets, you are mathematically guaranteeing mediocrity. You need to solve the "Unit of Analysis" problem before you solve the "Shape of Function" problem.
  3.  **Drop Q4 (for now).** Unless Q1 fails, treat probability contestation as an input adjustment, not a structural feature of the risk function. It's too hard to solve normatively without empirical traction.

  ### The 18-Month Arc

  *   **Months 1-3 (The Kill Switch):** Execute Q5. Build the model. If REU $\approx$ EU, write a memo recommending you drop REU and stick to EV with constraints. Stop.
  *   **Months 4-9 (The Architecture):** If Q5 passes, execute Q2 and Q1. Define the portfolio as the act. Determine if a global $r$ kills your tail events. If it does, draft the defense for a local/piecewise $r$.
  *   **Months 10-15 (The Governance):** Execute Q3. Translate the mathematical framework into a committee protocol. How do we vote on $r$?
  *   **Months 16-18 (The Integration):** Write the final operational manual.

  **One final warning:** The "boring hedge portfolio" complicates Q2. If the hedge is meant to "keep the lights on," that is a survival constraint (lexicographic preference), not a risk-weighted utility tradeoff. You may find that REU is only needed for the "big bets" portion, while the hedge is handled by a hard budget constraint. Don't force one function to rule both unless the math demands it.
