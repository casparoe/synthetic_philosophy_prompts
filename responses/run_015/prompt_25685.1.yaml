prompt: |-
  I'm on my high school's debate team, and we're preparing for a tournament where the resolution is something like "governments should impose moratoriums on emerging technologies with uncertain catastrophic risks." The affirmative side has been leaning heavily on the precautionary principle, but in practice the argument keeps collapsing into the proverb "better safe than sorry." One of our more experienced debaters will rattle off a list of worst-case scenarios — runaway AI, engineered pandemics, irreversible ecological damage from geoengineering — and then say, "Look, it's simple: better safe than sorry." When the negative points out that moratoriums also carry risks (medical breakthroughs delayed, climate mitigation stalled, economic harms from forgone innovation), his response circles back to the same phrase, as if the proverb itself tells us which risks to prioritize and which to tolerate.

  I'm starting to suspect that "better safe than sorry" is doing a lot more work than it can actually support, but I'm not sure how to pin down exactly what's wrong. The phrase seems to slide between several different claims depending on how hard you press it. Could you unpack the distinct precise principles that "better safe than sorry" might be expressing — from the most modest and nearly tautological to the strongest and most demanding — and evaluate each one? For each reading, I'd like to know whether it's plausible as a general principle, whether it actually resolves the tension between the risks of action and the risks of inaction, and whether it genuinely supports a moratorium on emerging technologies. I'm trying to figure out whether my teammate has a real argument or just a rhetorical device that sounds like one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** High school debate team preparing for a tournament.
      *   **Resolution:** "Governments should impose moratoriums on emerging technologies with uncertain catastrophic risks."
      *   **Problem:** The Affirmative case relies heavily on the Precautionary Principle, but it collapses into the slogan "better safe than sorry."
      *   **Specific Issue:** The slogan is being used to dismiss counter-arguments about the risks of *inaction* (moratoriums). It acts as a rhetorical shield rather than a substantive argument.
      *   **Task:** Unpack the distinct precise principles underlying "better safe than sorry" (from modest/tautological to strong/demanding). Evaluate each for plausibility, ability to resolve action/inaction tension, and support for a moratorium.
      *   **Goal:** Help the user determine if their teammate has a real argument or just a rhetorical device.

  2.  **Deconstruct "Better Safe Than Sorry":**
      *   What does this phrase actually mean philosophically and practically?
      *   It implies a preference for safety over risk.
      *   But "safe" and "sorry" are ambiguous. Safe from what? Sorry about what?
      *   It implicitly weights certain outcomes over others.
      *   It needs to be broken down into specific decision-theoretic or ethical frameworks.

  3.  **Brainstorming Interpretations (The Spectrum):**
      *   *Level 1 (Trivial):* If outcome A is bad and outcome B is neutral, choose B. (Too simple).
      *   *Level 2 (Risk Aversion):* Prefer certainty over uncertainty.
      *   *Level 3 (Maximin):* Maximize the minimum payoff. Avoid the worst-case scenario at all costs.
      *   *Level 4 (Asymmetric Burden of Proof):* The proponent of the technology must prove safety, not the regulator prove harm.
      *   *Level 5 (Lexical Priority of Existential Risk):* Survival trumps all other goods.

  4.  **Developing the Evaluations (Drafting the Content):**

      *   **Interpretation 1: The Trivial Truth (Risk Aversion)**
          *   *Claim:* If you know Action X causes harm and Action Y doesn't, do Y.
          *   *Plausibility:* High (nobody argues for known harm).
          *   *Action/Inaction Tension:* Fails. It assumes we *know* the moratorium is "safe." But moratoriums have risks too.
          *   *Support for Moratorium:* No. It requires knowing the moratorium is safer, which is the point of contention.

      *   **Interpretation 2: The Maximin Rule (Rawlsian/Decision Theory)**
          *   *Claim:* Choose the option where the worst possible outcome is less bad than the worst possible outcome of the alternative.
          *   *Plausibility:* Moderate in high-stakes, low-probability contexts.
          *   *Action/Inaction Tension:* Addresses it by comparing worst-cases.
          *   *Support for Moratorium:* Only if Tech Worst-Case > Moratorium Worst-Case. If Moratorium leads to nuclear war (due to lack of deterrence tech) or climate death, Maximin might favor tech. It's not automatic.

      *   **Interpretation 3: The Epistemic Burden Shift (Procedural Precaution)**
          *   *Claim:* In conditions of uncertainty, the burden of proof lies on the innovator. Pause until safety is proven.
          *   *Plausibility:* Common in regulation (FDA, etc.).
          *   *Action/Inaction Tension:* Treats inaction as the default baseline.
          *   *Support for Moratorium:* Yes, procedurally. But doesn't answer *how long* or *what standard*. If safety can't be proven (uncertainty is inherent), it becomes a permanent ban.

      *   **Interpretation 4: The Lexical Priority of Existential Catastrophe (Strong Precaution)**
          *   *Claim:* Any non-zero risk of extinction/irreversible global harm outweighs *any* finite benefit.
          *   *Plausibility:* Controversial. Implies we should never take *any* existential risk (including inaction).
          *   *Action/Inaction Tension:* Fails again. Inaction (no geoengineering) might carry existential climate risk.
          *   *Support for Moratorium:* Only if Tech Risk > Inaction Risk.

  5.  **Synthesizing the Critique:**
      *   The phrase "better safe than sorry" hides the comparison. It assumes "Safe = Moratorium" and "Sorry = Technology."
      *   In reality, "Safe = ?" and "Sorry = ?" are both unknown.
      *   The teammate is engaging in *status quo bias* disguised as prudence.
      *   The debate needs to move from "Is safety good?" (Yes) to "Which path is actually safer?" (The real clash).

