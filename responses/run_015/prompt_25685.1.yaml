answer: |-
  You have identified a classic flaw in argumentation: the **motte-and-bailey fallacy** disguised as a proverb. Your teammate is retreating to a "motte" (a defensible, trivial claim like "we should avoid known harm") when attacked, but occupying a "bailey" (a controversial, substantive claim like "we must ban this technology") when unchallenged.

  The phrase "better safe than sorry" is not a principle; it is a **heuristic** that hides the actual value judgment. To debate this effectively, you need to force the argument out of the slogan and into the specific trade-offs.

  Here is an unpacking of four distinct principles that "better safe than sorry" might be expressing, arranged from the most modest to the most demanding.

  ---

  ### 1. The Trivial Interpretation: Known Harm Avoidance
  **The Principle:** *If we know Action A causes significant harm and Action B does not, we should choose Action B.*

  *   **Plausibility:** **High.** Almost no one argues we should knowingly choose destruction. This is practically tautological.
  *   **Resolves Action/Inaction Tension?** **No.** This principle only works if the harms are *known*. The resolution specifies "uncertain catastrophic risks." If the risks are uncertain, we do not *know* the technology causes harm. Furthermore, we do not *know* that the moratorium is harmless.
  *   **Supports Moratorium?** **No.** To use this, your teammate must prove the technology is *known* to be dangerous and the moratorium is *known* to be safe. Since the resolution admits uncertainty, this principle is inapplicable.
  *   **Debate Utility:** This is the "safe" ground your teammate retreats to when pressed. If they say, "We shouldn't release a virus we know is deadly," agree with them. Then point out that the debate is about technologies where we *don't* know the outcome.

  ### 2. The Decision-Theoretic Interpretation: The Maximin Rule
  **The Principle:** *When probabilities are unknown, choose the option where the worst-case scenario is the least severe.* (Maximize the Minimum payoff).

  *   **Plausibility:** **Moderate.** This is a standard rule in decision theory under radical uncertainty. It is plausible for existential risks (e.g., nuclear war).
  *   **Resolves Action/Inaction Tension?** **Yes, but not in the Affirmative's favor.** This principle requires comparing the worst-case of the *Technology* against the worst-case of the *Moratorium*.
      *   *Tech Worst-Case:* AI causes human extinction.
      *   *Moratorium Worst-Case:* AI could have solved climate change; without it, humanity goes extinct due to ecological collapse. Or, a rival nation develops it first and gains hegemonic dominance.
  *   **Supports Moratorium?** **Conditionally.** It only supports a moratorium if **Risk(Tech) > Risk(Moratorium)**. Your teammate assumes Risk(Moratorium) is zero or negligible. This is the weak point. If the Negative can prove that delaying technology leads to *its own* catastrophic risks (e.g., no geoengineering = climate tipping points), Maximin does not automatically favor the Affirmative.
  *   **Debate Utility:** Force the Affirmative to quantify the "worst case" of the moratorium. If they say "The worst case is we just wait," challenge that. Is waiting safe in a competitive geopolitical landscape? Is waiting safe if the technology is needed for survival?

  ### 3. The Procedural Interpretation: The Burden of Proof Shift
  **The Principle:** *In conditions of uncertainty, the burden of proof lies on the innovator to demonstrate safety, not on the regulator to demonstrate harm. Default to inaction until safety is proven.*

  *   **Plausibility:** **High (in regulation).** This is how the FDA works for drugs. It is a standard administrative principle.
  *   **Resolves Action/Inaction Tension?** **No, it sidesteps it.** It treats "inaction" (the status quo) as the neutral baseline and "action" as the deviation requiring justification. It ignores that in a dynamic world, *inaction is also a choice with consequences.*
  *   **Supports Moratorium?** **Yes, procedurally.** This is the strongest version of your teammate's argument. It argues for a *pause* to gather information, not necessarily a permanent ban.
  *   **The Catch:** If "safety" cannot be proven due to inherent uncertainty (which the resolution implies), this procedural rule becomes a permanent ban. It also ignores the *cost* of the pause.
  *   **Debate Utility:** Concede that we need oversight, but argue that a *moratorium* (a complete halt) is the wrong tool. A moratorium stops the data gathering needed to prove safety. You can argue for "regulated deployment" or "sandboxing" instead. This principle supports *caution*, but not necessarily a *stop*.

  ### 4. The Lexical Interpretation: Existential Priority
  **The Principle:** *Any non-zero risk of irreversible, catastrophic harm (e.g., extinction) outweighs any finite benefit, regardless of probability.*

  *   **Plausibility:** **Low/Controversial.** This is the "Strong Precautionary Principle." It implies we should never take *any* existential risk.
  *   **Resolves Action/Inaction Tension?** **No, it creates a paradox.** If we face two paths, both with non-zero existential risk, this principle offers no guidance.
      *   Path A (Tech): Risk of AI extinction = 1%.
      *   Path B (No Tech): Risk of Climate extinction = 5%.
      *   If both are "non-zero," and both are "catastrophic," the principle freezes. It cannot distinguish between them unless one risk is literally zero (which is rarely true in policy).
  *   **Supports Moratorium?** **Only if the Moratorium Risk is Zero.** Your teammate must argue that *not* developing the technology carries **no** risk of catastrophe. If the Negative argues that *not* developing AI leaves us vulnerable to biological threats we can't cure, or *not* using geoengineering guarantees climate collapse, then this principle cannot choose the moratorium.
  *   **Debate Utility:** This is where the "better safe than sorry" slogan collapses. Ask: "Are you saying we should accept a 100% chance of climate catastrophe to avoid a 1% chance of AI risk? Is that 'safe'?"

  ---

  ### Summary Evaluation for Debate Strategy

  Your suspicion is correct. "Better safe than sorry" is doing rhetorical work, not logical work. It relies on a **false dichotomy**: it frames the choice as "Safety (Moratorium)" vs. "Risk (Technology)."

  In reality, the choice is **"Risk Profile A (Technology)"** vs. **"Risk Profile B (Moratorium)."**

  #### If you are debating *against* this argument (Negative):
  1.  **Expose the Hidden Premise:** Point out that the slogan assumes the moratorium is the "Safe" option. Demand evidence. "Safe from what? If the moratorium prevents us from solving the climate crisis, is that safe?"
  2.  **Turn the Precautionary Principle:** Argue that the Precautionary Principle applies to the *moratorium* as well. We don't know the consequences of stalling innovation. Therefore, applying "better safe than sorry" to the moratorium suggests we should *not* impose it.
  3.  **Challenge the "Sorry":** Define what "Sorry" looks like. If "Sorry" is human suffering, does the moratorium prevent more suffering than it causes? (e.g., delayed vaccines, stalled green tech).
  4.  **Force the Comparison:** Refuse to let them talk only about Tech risks. Every time they mention AI risk, ask: "What is the risk of *not* having AI? Compare them."

  #### If you are debating *for* this argument (Affirmative) and want to fix it:
  1.  **Abandon the Slogan:** Tell your teammate to stop saying "better safe than sorry." It sounds dismissive and avoids the clash.
  2.  **Adopt Maximin (Interpretation 2):** Explicitly argue that the *magnitude* of the tech risk (extinction) is so much larger than the *magnitude* of the moratorium risk (economic slowdown, delayed convenience) that even a tiny probability of the tech risk justifies the pause.
  3.  **Define the Moratorium as Active Safety:** Don't frame the moratorium as "doing nothing." Frame it as "active risk management." We aren't just stopping; we are using the time to build safeguards. This mitigates the "risks of inaction" argument.
  4.  **Concede Trade-offs:** Acknowledge that moratoriums have costs. Argue that those costs are *finite* (money, time) while the tech risks are *infinite* (extinction). Finite costs cannot outweigh infinite risks.

  ### The Verdict
  Your teammate currently has a **rhetorical device**, not a functional argument. The phrase "better safe than sorry" collapses because it treats "safety" as a property of the *moratorium* rather than the *outcome of the decision*.

  To win, you must shift the debate from **"Is safety good?"** (which everyone agrees on) to **"Which path actually leads to safety?"** (which is the actual disagreement). If your teammate cannot answer that without circling back to the proverb, they will lose against a Negative team that quantifies the risks of the moratorium.
