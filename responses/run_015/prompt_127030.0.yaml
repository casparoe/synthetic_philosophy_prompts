  2.  **Deconstruct Hacking's "Looping Effects":**
      *   *Core Idea:* Classifying people (interactive kinds) changes the people classified, which in turn changes the classification.
      *   *Indifferent vs. Interactive Kinds:* Quarks don't care if you classify them. People do.
      *   *Mechanism:* Knowledge of the classification $\rightarrow$ Change in self-concept/behavior $\rightarrow$ Change in the phenomenon $\rightarrow$ Need to update classification.
      *   *Normativity:* Looping can be empowering (giving a name to suffering) or oppressive (stigmatizing, forcing into a box).
