answer: |-
  **Exam Question (25 Marks)**

  **Question 4:**
  Imagine a Neo-Malthusian writing in 1950. Conceding that the 1798 prediction of mass starvation by 1850 failed, they argue: "The mechanism remains valid, but the deadline was premature because fossil fuels acted as a temporary 'land substitute.' The crisis is rescheduled for 2050, defined not by grain prices but by net energy return on investment (EROI)."

  Using the concepts of **re-dating**, **re-scaling**, and **re-describing**, analyze this reformulation. Apply the **deadline test**: Does this new claim function as a degenerating research programme, an unfalsifiable tautology, or a genuine constraint (akin to a budget constraint)? To secure an A, you must specify what additional conditions would be required for the defense of being "right but early" to count as scientific rather than face-saving.

  ***

  **Model Answer (Approx. 600 words)**

  The 1950 Neo-Malthusian's reformulation is a sophisticated attempt to rescue a failed prediction, but it teeters on the edge of unfalsifiability. To evaluate it, we must dissect the three rescue moves employed. First, the scholar engages in **re-dating**: the mechanism (population pressing against limits) is preserved, but the crisis point shifts from 1850 to 2050. Second, there is **re-scaling**: the constraint is moved from local English arable land to global fossil fuel stocks. Third, and most critically, there is **re-describing variables**: the binding constraint is no longer "grain" but "net energy."

  The epistemic status of this claim depends entirely on the **deadline test**. A long-run prediction retains content only if it commits to a specific threshold that could, in principle, be missed. If the Neo-Malthusian merely asserts "scarcity will eventually bind," they have stated an accounting identity, not a forecast. All resources are finite; claiming they will run out is a tautology. For this to be a genuine constraint, the 2050 date must be derived from independent variables (e.g., known reserve depletion rates coupled with projected demand elasticity) rather than adjusted post-hoc to match the current date.

  The danger here is a degenerating research programme. In Lakatosian terms, a programme degenerates when it survives only by adding ad hoc auxiliary hypotheses to explain away anomalies. Moving the goalpost from 1850 to 2050 is ad hoc unless the scholar can specify *why* 1850 was wrong using data available *before* the failure. Blaming fossil fuels is plausible, but if the theory cannot specify ex-ante what counts as a "temporary substitute" versus a permanent technological shift, it explains everything and predicts nothing.

  However, the reformulation could function as a genuine budget constraint if it specifies the conditions of failure clearly. A budget constraint is not a prediction of bankruptcy, but a statement that expenditure cannot exceed income indefinitely. If the Neo-Malthusian defines the "limit" as a specific EROI threshold below which industrial society cannot function, and calculates the depletion trajectory independently of population growth, the claim becomes falsifiable. If EROI remains stable through 2050 despite population growth, the theory is refuted.

  The defense of being "right but early" is the most vulnerable point. For this to be scientific rather than face-saving, the student must identify a **mechanism of delay** that was quantifiable at the time of the original prediction. It is not enough to say "technology intervened." The scholar must demonstrate that the delay mechanism (fossil fuels) was a known variable that was initially underestimated, not a new variable invented to save the theory. Furthermore, the "early" defense requires a new, risky prediction. If the 2050 prediction allows for infinite elasticity (e.g., "if we find new energy, the date moves again"), it is a tautology.

  Ultimately, the 1950 reformulation is a degenerating programme unless it accepts the risk of the deadline test. If the scholar admits that stable energy prices and rising wages in 2050 would refute the Malthusian mechanism, the claim is a genuine constraint. If they reserve the right to re-describe the binding variable again (e.g., from energy to rare earth metals) without refutation, the theory has become unfalsifiable. The difference lies not in the truth of the claim, but in the willingness to specify the conditions under which it would be abandoned. Malthusianism survives not by being right about dates, but by remaining specific about the binding constraint, even when that constraint shifts.

  ***

  **Marking Scheme (25 Marks)**

  **Grading Note:** Answers that merely categorize the moves using Popper/Lakatos terminology without applying the specific course concepts (deadline test, the three rescue moves, accounting identity vs. constraint) must be capped at 17/25 (High B).

  **1. Identification of Rescue Moves (5 Marks)**
  *   **5:** Clearly identifies re-dating (1850→2050), re-scaling (England→Global/Fossil), and re-describing (Grain→EROI).
  *   **3:** Identifies moves but conflates them (e.g., treats re-scaling and re-describing as identical).
  *   **0:** Fails to identify the specific moves; focuses on historical accuracy of Malthus.
  *   *Common Botch:* Strong students often spend too much time debating whether fossil fuels *actually* saved us, rather than analyzing the rhetorical move of invoking them.

  **2. Application of the Deadline Test (5 Marks)**
  *   **5:** Explains that a prediction needs a specific, missable threshold to have content. Notes that "eventually" is not a deadline.
  *   **3:** Mentions falsifiability but treats it as a binary label rather than a function of the specific date/threshold.
  *   **0:** Ignores the deadline test; focuses on whether the prediction came true.
  *   *Common Botch:* Students argue that 2050 hasn't happened yet, so we can't judge, missing the point that the *structure* of the claim is being tested now.

  **3. Distinction: Tautology vs. Genuine Constraint (5 Marks)**
  *   **5:** Distinguishes between "resources are finite" (identity/tautology) and "this resource binds by this date" (constraint/forecast).
  *   **3:** Uses the terms but fails to explain why the distinction matters for the specific hypothetical.
  *   **0:** Treats all scarcity claims as equally valid or invalid.
  *   *Common Botch:* Confusing "true in the long run" with "scientific constraint." Failing to see that an identity cannot be refuted by data.

  **4. Conditions for "Right but Early" (5 Marks)**
  *   **5:** Specifies that the delay mechanism must be quantifiable ex-ante and that the revised theory must make a *new* risky prediction (not just a moved date).
  *   **3:** States that "evidence is needed" without specifying what kind of evidence validates the delay.
  *   **0:** Accepts "right but early" as a valid defense without conditions.
  *   *Common Botch:* This is the A-grade discriminator. Students often accept "technology" as a valid excuse without demanding the theory specify *which* technologies count as delays vs. refutations.

  **5. Final Judgment on Research Programme (5 Marks)**
  *   **5:** Concludes that the programme is degenerating *unless* it accepts specific refutation conditions (e.g., stable EROI). Nuanced verdict.
  *   **3:** Declares it "degenerating" or "progressive" as a flat label without the conditional nuance.
  *   **0:** Verdict is missing or based on personal belief about overpopulation.
  *   *Common Botch:* Using "degenerating" as a synonym for "wrong." The mark requires understanding that a programme can be theoretically coherent even if empirically false, provided it risks falsification.
