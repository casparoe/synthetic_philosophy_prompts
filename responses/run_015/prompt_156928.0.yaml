answer: |-
  This is an exceptionally sharp observation, precisely the kind of methodological reflexivity that defines graduate-level historiography. You have identified a genuine friction point in social history, but I would argue that your formulation of "scalar consistency" imposes a rigidity that neither Ginzburg, Levi, nor Thompson actually adhered to.

  Your roommate is partially right: the primary political unity between the Italian microhistorians and the British Marxists is indeed their opposition to top-down, state-centric positivism. However, you are also right to sense a deeper methodological entanglement. The tension you perceive is real, but it is not a contradiction that leads to "betrayal." Rather, it is a productive dialectic that these historians navigated by redefining the relationship between the part and the whole.

  Here is a breakdown of why your "scalar consistency" principle, while logically appealing, misreads the epistemological goals of both traditions, and why scholars can combine granular work with macro-narratives without theoretical hypocrisy.

  ### 1. Microhistory is not Anti-Macro; it is Anti-Presumptive
  You argue that Ginzburg and Levi reject macro-structural explanation as "epistemic violence." This is true regarding *deterministic* macro-explanation, but not macro-explanation *per se*.

  Carlo Ginzburg's concept of the "clue" (in *Clues, Myths, and the Historical Method*) and the "exceptional normal" suggests that micro-analysis is a way to test macro-models, not ignore them. When Ginzburg studies Menocchio, he is not claiming Menocchio explains the Reformation on his own. He is arguing that Menocchio's cosmology reveals a stratum of peasant culture that macro-models of "Protestantization" or "Catholic Hegemony" render invisible.

  Giovanni Levi's *Inheriting Power* is even more explicit. Levi reduces the scale to a single village (Santhià) to show how a national market (the macro) actually functions through local kinship negotiations. He isn't saying the national market doesn't exist; he is saying the *mechanism* of the national market is only visible at the local level.

  Therefore, using local notarial documents to explain a national tax code is not a betrayal, provided the argument is not that the local document *caused* the national code, but that the local document reveals the **mediation** of that code. Microhistory posits that "the macro" is not a force that descends from heaven; it is an aggregation of micro-negotiations. To study the micro is to study the *construction* of the macro.

  ### 2. Thompson and the "Making" of Structure
  Your reading of E.P. Thompson risks conflating "structure" with "determinism." Thompson's objection in *The Making of the English Working Class* was not to macro-explanation (he was explicitly explaining the formation of a class that would reshape the nation); his objection was to a structuralism that treated class as a static category rather than a dynamic relationship.

  Thompson writes: "Class is a definition, and a relationship... and above all it is a historical phenomenon." When Thompson uses local correspondence or court records, he is not engaging in "scalar consistency" in the way you define it. He is using micro-evidence to trace the *process* by which macro-consciousness emerges.

  If a historian uses a local petition to explain a national shift in tax policy, they are not violating Thompson's method if they argue that the national shift was a *response* to the aggregation of local resistances. Thompson's ontology is processual. The "macro" is the result of the "micro," not a separate sphere that crushes it.

  ### 3. The Fallacy of "Scalar Consistency"
  The principle you and your group have coined—"the evidentiary scale of one's sources must match the explanatory scale of one's conclusions"—is aesthetically pleasing but historically untenable.

  If we adhered to strict scalar consistency:
  *   A study of a single parish could only explain that parish.
  *   A study of a national tax code could only use national treasury ledgers.

  This would recreate the very positivist siloing that both traditions sought to destroy. It would render history incapable of explaining change, because change usually occurs through the friction between different scales (e.g., local custom vs. national law).

  The "betrayal" you fear only occurs if the historian engages in **metonymic fallacy**—claiming that the part *is* the whole without demonstrating the connective tissue. But when done correctly, micro-evidence serves as a **prism** for macro-structures. It shows how the abstract law becomes concrete violence, or how the abstract market becomes a specific debt.

  ### 4. Why the Lack of Discomfort?
  You ask why respected scholars combine granular work with large-scale narratives without apparent theoretical discomfort. The answer is that the most sophisticated practitioners view scale as a **heuristic**, not an ontology.

  *   **Mediation:** Scholars like Natalie Zemon Davis (*The Return of Martin Guerre*) or Carlo Ginzburg use the micro to show how macro-forces are *received, altered, and resisted*. The "macro" explanation is modified by the micro-evidence.
  *   **Typicality vs. Exception:** Microhistorians argue that the "exception" reveals the boundaries of the "rule." By studying where the tax code failed in one village, you learn more about the nature of the eighteenth-century state than by studying where it succeeded.
  *   **The "Global Microhistory" Turn:** Recent scholarship (e.g., Tonio Andrade, Linda Colley) explicitly connects tiny archival fragments to global networks. They do not feel discomfort because they acknowledge the **fragmentary nature of all history**. No archive, local or national, captures the "whole." All history is a reconstruction.

  ### Conclusion: A Productive Tension, Not a Contradiction
  You are not importing a false coherence, but you are perhaps demanding a logical purity that historical practice cannot sustain. The tension you feel is the central engine of social history: **How do we relate experience to structure?**

  *   If you lean too far toward the macro, you erase agency (the Stalinist error Thompson fought).
  *   If you lean too far toward the micro, you risk antiquarianism or the inability to explain power (the risk Levi warned against).

  The "betrayal" occurs not when you use micro-sources for macro-questions, but when you use micro-sources to **pretend** structure doesn't exist. If you use a notarial record to argue that "the state didn't matter because this one guy avoided taxes," that is bad history. If you use that record to argue "the state's power was contingent on local negotiation," that is excellent history that honors both Thompson and Levi.

  Your study group's "scalar consistency" is a useful warning against overgeneralization, but it should not be elevated to a methodological prohibition. The goal of both traditions was not to isolate scales, but to show how they permeate one another. The discomfort you feel is actually a sign of methodological health—it means you are watching the seam where the evidence meets the argument, which is exactly where the historian's work happens.
