answer: |-
  Here is a structured argument designed for a colloquium talk. It is written to be spoken or distributed as a position paper, maintaining a rigorous philosophical tone while clearly articulating the tension you have identified.

  ***

  **Title:** The Intentional Loop: Why Speaker Meaning Cannot Ground Conversational Implicature
  **Context:** Colloquium Talk on Gricean Pragmatics

  ### 1. Introduction: The Foundation Cracks

  Colleagues, we are all familiar with the architecture of Grice's pragmatics. It is a building constructed on a specific foundation: the analysis of non-natural meaning ($meaning_{nn}$). Grice teaches us that to communicate is to manifest a complex, reflexive intention. We then build the theory of conversational implicature on top of this foundation, using the Cooperative Principle (CP) and the Maxims as the mechanism by which these intentions are decoded.

  My contention today is that this architecture is unstable. I argue that Grice's notion of *speaker meaning* is not the right notion on which to base his theory of conversational implicature. Specifically, the intention-based definition of speaker meaning requires the audience to recognize the speaker's intention to be recognized. When we apply this to the "working out" of implicatures, we find that the mechanism is either viciously circular or radically under-determined. The Cooperative Principle and Maxims seem to presuppose the very common ground about intentions that they are supposed to generate.

  ### 2. The Gricean Circle: Intention and Recognition

  Let us recall Grice's analysis of $meaning_{nn}$. For a speaker $S$ to mean something by an utterance $x$, $S$ must intend:
  1.  To produce a response $r$ in an audience $A$.
  2.  That $A$ recognizes intention (1).
  3.  That $A$'s recognition of (1) functions as at least part of $A$'s reason for producing $r$.

  This is a reflexive intention. Communication, on this view, is essentially mind-reading made manifest. Now, consider the standard schema for deriving a conversational implicature $q$ from an utterance of $p$:
  1.  $S$ has said $p$.
  2.  There is no reason to think $S$ is not observing the Maxims.
  3.  $S$ could not be doing this unless he thought $q$.
  4.  Therefore, $S$ implicates $q$.

  Here lies the tension. Step 2 of the calculation ("There is no reason to think $S$ is not observing the Maxims") is the engine of implicature. But what does it mean to "observe the Maxims"? To observe the Maxims is to act with the intention of facilitating mutual understanding in specific ways (Quality, Quantity, Relation, Manner).

  Therefore, for the hearer $A$ to assume $S$ is observing the Maxims, $A$ must attribute to $S$ a specific set of reflexive intentions regarding the exchange. But according to the definition of $meaning_{nn}$, $A$ cannot attribute these intentions unless $A$ *recognizes* them. And $A$ cannot recognize them unless $A$ already assumes $S$ is acting cooperatively to make them recognizable.

  We are caught in an epistemic loop:
  *   To derive the implicature, I must assume you are being cooperative (following Maxims).
  *   To know you are being cooperative, I must recognize your reflexive intention to be understood.
  *   But I can only recognize your reflexive intention if I already assume you are structuring your utterance to be understood (i.e., following Maxims).

  The CP and Maxims are supposed to explain *how* we bridge the gap between sentence meaning and speaker meaning. But if the very application of the Maxims requires prior access to the speaker's reflexive intentions, the theory does not explain how communication gets off the ground; it merely describes the structure of communication once it is already successfully happening.

  ### 3. The Problem of Under-Determination and Common Ground

  If the account is not circular, it is under-determined. This is the problem of the **Common Ground**.

  Grice's model implies that the Maxims are the tools we use to establish or navigate common ground. However, the Maxims themselves are indeterminate without a pre-existing common ground.

  Consider the utterance: *"It's cold in here."*
  *   **Implicature A:** "Close the window." (Relation/Quantity)
  *   **Implicature B:** "Let's leave." (Relation)
  *   **Implicature C:** "I told you to bring a jacket." (Quality/Relation)

  How does the hearer select Implicature A over B or C? The Gricean answer is: "Because the speaker intended me to." But how does the hearer know the intention? By applying the Maxims. But the Maxims alone do not dictate that "cold" implies "close window" rather than "leave." That inference relies on shared background knowledge, social norms, and contextual assumptions.

  If the speaker's meaning is defined by their intention, and the hearer identifies that intention via the Maxims, the Maxims must be specific enough to single out one intention. But they are not. They are broad normative guidelines.

  Consequently, the hearer must *already* share a normative framework with the speaker to interpret the maxim-flouting or maxim-exploiting behavior. But if they already share that framework, the reflexive intention is doing no heavy lifting. The work is being done by the shared social practice, not by the recognition of the private mental state.

  In short: The CP and Maxims presuppose the very common ground about intentions and norms that they are supposed to generate. You cannot use the rules of the game to explain how the players agreed to play the game in the first place.

  ### 4. Sketching a Non-Circular Account

  If we abandon $meaning_{nn}$ as the foundation, what replaces it? A non-circular account of implicature must shift the locus of meaning from **psychological states** to **normative statuses** or **public practices**.

  Here is a sketch of what such an account would look like:

  **A. From Intention to Commitment**
  Instead of asking "What does the speaker intend me to think?", we should ask "What commitment is the speaker undertaking?" This draws on the work of later Wittgenstein and Robert Brandom. Meaning is not a matter of peering into a mind; it is a matter of making a move in a language game that alters the normative landscape of the conversation.
  *   *Implicature* is not an inferred intention; it is a **commitment entitlement**. By saying $p$, the speaker entitles the hearer to claim $q$ in subsequent discourse, and holds the speaker accountable to $q$.

  **B. The Maxims as Constitutive Norms, Not Heuristics**
  In the Gricean picture, the Maxims are heuristics the hearer uses to guess the speaker's mind. In a non-circular picture, the Maxims are **constitutive norms** of the practice of assertion itself.
  *   We do not assume the speaker is following the Maxims to figure out their intention. Rather, by entering the conversation, the speaker is *subject* to the Maxims.
  *   If a speaker says "It's cold," and the window is open, the normative pressure to close the window arises from the *situation* and the *rules of the exchange*, not from a hidden mental state. The "implicature" is the normative consequence of the utterance in that context.

  **C. Common Ground as Pre-Existing Practice**
  This account acknowledges that common ground is not generated *by* the intention-recognition mechanism. It is the **pre-condition** for the mechanism. We share a form of life and a set of linguistic practices. Implicature is the process of updating that common ground, not creating it ex nihilo through reflexive intentions.
  *   The "calculation" is not a psychological simulation of the speaker's mind. It is a rational reconstruction of the *move* within the shared practice. "Given the rules of our interaction, what follows from this move?"

  ### 5. Conclusion

  To conclude, Grice's genius was to identify the structure of conversational inference. However, by anchoring this structure in $meaning_{nn}$, he tethered a public phenomenon to a private mechanism that cannot bear the weight.

  The requirement that the audience recognize the intention to be recognized creates a circle where the assumption of cooperation is required to identify the intention that constitutes cooperation. Furthermore, it leaves the specific content of implicatures under-determined without presupposing the shared norms it claims to explain.

  A robust theory of implicature must decouple meaning from reflexive psychological intentions. It must view implicature not as mind-reading, but as **normative navigation**. We do not implicate things because we intend to be understood; we are understood as implicating things because we are participants in a shared, normative practice where certain moves license certain inferences.

  Thank you. I look forward to your objections.
