  7.  **Final Polish:** Check constraints. Blunt. Under 600 words. No library appeals.

      *   *Self-Correction on (3):* If justification is purely evidential, does it vary? No. So knowledge varies due to a non-evidential condition. This is coherent.
      *   *Self-Correction on (5):* If stakes are objective, does Marta's ignorance matter? If knowledge is externalist, yes. If internalist, no. But (1) says stakes affect knowledge. If stakes are objective, they affect knowledge even if unknown? That's weird. Usually encroachment says stakes affect the *subject*. So (5) is definitely the outlier.

      *   *Wait, one nuance:* The user says "Stakes are objective — what matters is how much really hangs on being right, not what Marta takes to hang on it." This is meant to rule out "I feel like it's low stakes so I know it." But (8) introduces a distinction between two "real" stakes. The Collector's bet is real. The Colleague's job is real. Why is one relevant and not the other? Because Marta is *acting* on the colleague's case (archiving/certifying) but not the bet. So stakes are relative to the *action context*, not just objective reality. (5) denies this relativity.

      *   *Plan:*
          1.  Validate (1)+(3) compatibility (friend is wrong).
          2.  Flag "stakes" ambiguity (objective vs. agent-relative).
          3.  Identify (5) as the item to drop.
          4.  Explain why (5) breaks (8).
          5.  Explain cost (loss of simple realism).
          6.  Confirm (3) stays.

      *   *Word Count Check:* Keep it tight.

      *   *Drafting:*
          Your friend is wrong about (1) and (3). You can hold that evidential support is fixed while the threshold for knowledge shifts. That's standard pragmatic encroachment. Justification is the engine; stakes determine how much fuel you need. They coexist.

          The real contradiction is between (5) and (8). You are using "stakes" in two different senses. In (5), you mean objective facts about the world (the bet exists). In (8), you mean practical burdens relative to the agent's actions (Marta's professional duty).

          Item (5) has to go. Here's why: If stakes are purely objective, the Collector's bet creates high stakes regardless of Marta's awareness. If (1) is true (stakes affect knowledge), then the existence of the bet should destroy Marta's knowledge. But (8) says it doesn't. You want the Collector's bet to be irrelevant and the Colleague's plight to be relevant. The only difference is Marta's agency. She is acting in the colleague's case; she is not acting in the bet. Therefore, stakes cannot be purely objective facts; they must be relative to the agent's practical situation.

          If you keep (5), you cannot write the scene in (8). You would have to admit the bet destabilizes her knowledge, or admit stakes don't matter at all. To save the scene, you must reject (5).

          Cost: You lose the comfort of mind-independent facts. You have to accept that whether Marta "knows" depends on her relationship to the outcome, not just the outcome itself. This actually helps the novel: it centers the tension on Marta's role, not random external events.

