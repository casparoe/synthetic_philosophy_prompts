  6.  **Refining the Argument:**
      *   (1) + (3) is actually the standard "Pragmatic Encroachment" view (e.g., Stanley). Justification is evidential; Knowledge requires justification *plus* practical adequacy. So the friend is wrong there.
      *   (5) is the problem. If stakes are objective (mind-independent), the Collector's bet creates high stakes regardless of Marta. If (1) is true, Marta shouldn't know. But (8) says she does. Contradiction.
      *   To save (8) (the scene), (5) must go. Stakes must be agent-relative (what hangs on *her* actions).
