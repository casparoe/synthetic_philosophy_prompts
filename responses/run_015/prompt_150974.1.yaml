answer: |-
  Your friend is wrong about (1) and (3). You can hold that evidential support is fixed while the threshold for knowledge shifts. That is the core of pragmatic encroachment. Justification is the engine; stakes determine how much fuel you need. They coexist without contradiction.

  The fatal tension is between (5) and (8). You are using "stakes" in two different senses. In (5), you mean objective facts about the world (the bet exists). In (8), you mean practical burdens relative to the agent's actions (Marta's professional duty).

  **Item (5) has to go.**

  Here's why: If stakes are purely objective, the Collector's bet creates high stakes regardless of Marta's awareness. If (1) is true (stakes affect knowledge), then the existence of the bet should destroy Marta's knowledge. But (8) says it doesn't. You want the Collector's bet to be irrelevant and the Colleague's plight to be relevant. The only difference is Marta's agency. She is acting in the colleague's case; she is not acting in the bet. Therefore, stakes cannot be purely objective facts; they must be relative to the agent's practical situation.

  If you keep (5), you cannot write the scene in (8). You would have to admit the bet destabilizes her knowledge, or admit stakes don't matter at all. To save the scene, you must reject (5).

  **Cost:** You lose the comfort of mind-independent facts. You have to accept that whether Marta "knows" depends on her relationship to the outcome, not just the outcome itself. This actually helps the novel: it centers the tension on Marta's role, not random external events. It makes knowledge a function of her responsibility, which fits your literary focus on interiority.

  **Item (3) is fine as it stands.** It isolates the evidence from the practical threshold. This allows you to say Marta has the same evidence in both cases, but the *entitlement to act* differs. This preserves the intuition that the letter doesn't change, only the consequence of error does.

  **Item (2) is also fine.** Invariantism works here: "knows" picks out a single state that includes both evidential and practical conditions. They aren't talking past each other; they are disagreeing about whether the practical condition is met.

  **Revision:** Replace (5) with "Stakes are agent-relative." What matters is what hangs on *Marta's* being right, given what she is doing. The Collector's bet hangs on the Collector, not Marta. The Colleague's job hangs on Marta's archival judgment. This resolves the tension without sacrificing the scene.

  Drop (5). It's the only way to make (8) coherent with (1).
