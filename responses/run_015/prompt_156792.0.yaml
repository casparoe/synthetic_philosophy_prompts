      *   *Butler (Performativity):* Gender isn't what you *are*, it's what you *do*. It's a stylized repetition of acts. Viola *does* masculinity. The success depends on the "citation" of norms. But Butler also emphasizes that the performance *constitutes* the reality, not just reflects an institution.
      *   *Tension:* Searle emphasizes the *external* assignment (institutional fact). Butler emphasizes the *internal/iterative* production (ontological effect).
      *   *The Play's Nuance:* Shakespeare isn't a philosopher. The play deals with *desire*, *confusion*, *time*, and *affect*. Philosophy often abstracts; drama embodies. The "resistance" will likely come from the emotional reality of the characters (Olivia's love isn't just institutional recognition; it's visceral).

