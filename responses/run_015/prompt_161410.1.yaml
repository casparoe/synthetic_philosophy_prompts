  # JOINT STATEMENT ON THE STATUS AND UTILITY OF ISOTYPE VISUALIZATION
  **Prepared for the Tenants' Union Advisory Board**
  **By:** Marta (Design History) & Sam (Philosophy of Science)
  **Facilitated by:** [Your Name/Role]

  ## PREAMBLE
  We acknowledge that our disagreement regarding the visualization of housing data stems from a genuine tension within Otto Neurath's own work: the tension between the *logical* aim of the Vienna Circle (a unified, checkable science) and the *pedagogical* aim of the Social and Economic Museum (adult education for a specific municipality). This document delineates where we agree on the historical and functional record, where we fundamentally disagree on the implications for our Union's work, and what empirical tests would adjudicate those disagreements.

  ## PART I: AGREED CLAIMS
  *Both signatories affirm the following propositions as historically accurate and practically relevant.*

  1.  **On the "Language" Claim:** We agree that Neurath's term *Hilfssprache* (helping language) was deliberate. It signifies a system that possesses syntax (rules of combination) but lacks the semantic autonomy of natural language. It is a "language" only insofar as it facilitates comparison, not insofar as it generates novel propositions without external anchoring.
  2.  **On the Rules of Transformation:** We agree that the core ISOTYPE rules (repetition of identical units rather than scaling of size; elimination of perspective; consistent color coding) are not merely aesthetic choices. They are *epistemic constraints* designed to prevent optical illusion and enforce additive comparison. Violating them (e.g., scaling a house icon by area to represent quantity) converts the chart from a statistic into a metaphor.
  3.  **On the Viewer's Competence:** We agree that a "naïve viewer" (one从未 exposed to ISOTYPE conventions) cannot be assumed to understand the *scale* or the *denominator* of a chart without a key. However, we also agree that a viewer does not need to be taught the *rules* to perceive the *ranking* (more icons = more stuff).
  4.  **On Neurath's Empiricism:** We agree that ISOTYPE is consistent with Neurath's "Boat" metaphor (anti-foundationalism). The pictures do not represent "Reality" directly; they represent *protocol sentences* (agreed-upon data) transformed into visual coordinates. If the underlying data is contested, the picture is not false, but it is *unanchored*.
  5.  **On Falsification:**
      *   **Marta** would revise her view if a control group of untrained viewers could accurately answer comparative questions (e.g., "Which district has higher rent burden?") from a caption-free ISOTYPE chart at a rate significantly above chance, without prior instruction.
      *   **Sam** would revise his view if it were demonstrated that adherence to ISOTYPE rules (repetition vs. scaling) systematically reduces viewer comprehension or retention compared to proportional scaling in a real-world advocacy context.

  ## PART II: RESIDUAL DISAGREEMENTS & ADJUDICATION TESTS
  *We disagree on the following points. These are not merely verbal; they dictate how we design the Union's posters.*

  | # | The Crux | Marta's Formulation (Contextualist) | Sam's Formulation (Formalist) | Agreed Test Case | Marta's Prediction | Sam's Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Autonomy of the Image** | The image is a *prompt* for memory or speech. Without a caption, the specific meaning (e.g., "30% income") is lost, leaving only a vague impression of "many houses." | The image is a *notation*. The quantity is encoded in the count. A caption clarifies, but the *comparison* is self-evident in the array. | **The Rent-Burden Chart:** Rows of identical house figures, one row per district, no words. Question: "Which district has the highest burden?" and "What does one house represent?" | Viewer answers Q1 correctly (ranking) but fails Q2 (magnitude). The chart is rhetorically effective but epistemically incomplete. | Viewer answers both correctly via the provided Key/Legend. The chart functions as a standalone statement of fact. |
  | **2** | **The Function of Rules** | The rules (no scaling, no perspective) are *pedagogical guardrails* for a specific audience (1930s workers) to prevent being misled by area-bias. They are not universal logic. | The rules are *syntactic necessities*. Scaling by area introduces a mathematical lie (square law vs. linear count). Breaking the rule breaks the truth-function. | **The Scaled House Chart:** Same data, but houses grow larger instead of multiplying. | Viewers will intuitively grasp the "bigness" of the problem faster. The ISOTYPE rule is an unnecessary constraint on emotional impact. | Viewers will overestimate the difference between districts (area bias). The ISOTYPE rule is required for accurate democratic verification. |
  | **3** | **Negation & Causality** | ISOTYPE is static. It shows *states of affairs*. To show what *did not happen* (evictions prevented) or *causes* (rent caps), you need natural language or narrative arrows. | ISOTYPE can show negation via absence (a gap in the row) or color coding (red for prevented), provided the legend defines the convention. Causality is inferred from sequence. | **The Counterfactual Chart:** Evictions prevented by rent cap. | Requires a paragraph of text. A picture of "nothing" is indistinguishable from "no data." | Requires only a legend (e.g., "Grey outline = prevented"). The visual absence *is* the data. |
  | **4** | **Political Neutrality** | The form is not neutral. The "flat, clean" style signals "official truth," which can be co-opted by any regime (Soviet IZOSTAT vs. US Health). The meaning comes from the *institution* displaying it. | The form constrains the politics. You cannot easily lie with ISOTYPE (due to the rules). If the data is manipulated, the *method* exposes it. The notation resists co-option. | **The Contested Data Case:** Two camps disagree on vacancy numbers. | The chart legitimizes whichever number is chosen. The visual authority masks the data dispute. | The chart makes the dispute visible. Two charts side-by-side show the discrepancy in physical units. |

  ## PART III: VERBAL DISPUTES & DE-VERBALIZATION
  *We identify the following disagreement as partially verbal, stemming from the definition of "Language."*

  *   **The Dispute:** Sam claims ISOTYPE is a "notation" akin to mathematics. Marta claims it is "visual rhetoric" akin to a political cartoon.
  *   **The De-Verbalized Core:** The substantive disagreement is about **Context-Dependency**.
      *   **Sam's Core Claim:** The meaning of the visual array is *stable* across different contexts (New York, Vienna, Berlin) provided the key is constant.
      *   **Marta's Core Claim:** The meaning of the visual array is *unstable* and relies on the institutional authority of the presenter (The Union, The Museum, The State).
  *   **Resolution for Practice:** We agree to treat ISOTYPE as a **Context-Dependent Notation**. It has rules (Sam), but those rules only function within a frame of trust and explanation (Marta).

  ## PART IV: RECOMMENDATIONS FOR THE TENANTS' UNION
  *Based on the above, we propose the following design protocol for upcoming posters:*

  1.  **Adhere to the Rules (Sam's Victory):** Do not scale icons by size. Use repetition. This preserves the integrity of the data and prevents optical manipulation, which is essential for a Union claiming truth against landlords.
  2.  **Include the "Transformation" Key (Marta's Victory):** Every poster must include a clear legend (1 Icon = 500 Households) and a one-sentence caption stating the source and the specific definition (e.g., "Over 30% of Income"). Do not rely on the image alone to carry the definition.
  3.  **Handle Causality with Words (Joint Agreement):** Do not attempt to visualize "evictions prevented" or "future rent rises" using only icons. Use ISOTYPE for the *current state* (the burden) and use text for the *policy argument* (the cause/solution).
  4.  **The "Boat" Clause:** If data is contested (e.g., vacancy rates), visualize *both* estimates side-by-side using the same units. Do not smooth over the discrepancy. This honors Neurath's physicalism: we are rebuilding the boat with the planks we have, acknowledging the gaps.

