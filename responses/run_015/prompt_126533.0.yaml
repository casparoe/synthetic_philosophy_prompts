answer: |-
  It is good to hear from someone who has been tracking these questions for so long, and I want to start by validating your core intuition against your friend's dismissal. The claim that the books were merely rows in a database is ontologically correct but morally inert, much like saying a wedding ring is merely scratched metal. Your friend is committing a category error by conflating the substrate with the institution. The Substitution Test you proposed is a strong heuristic, essentially a veil-of-ignorance style check, but as you noticed, it breaks down when the physical counterpart does not capture the specific normative context of the virtual environment. Stealing found money physically is theft because physical property norms are default-exclusive, whereas virtual property norms are context-dependent. Similarly, there is no physical counterpart to a software persona being swapped because physical persons are continuous in a way code is not. So while the Substitution Test is useful for checking basic consistency, it cannot be the foundational theory because it ignores the relational properties that give virtual objects their weight.

  The account that best fits your cluster of verdicts is what I would call the Theory of Anchored Intentionality. Under this view, virtual objects and events have no intrinsic moral weight, but they acquire it through the density of human intention anchored to them within a stable normative framework. Harm occurs when an action severs those anchors in violation of the expectations established by that framework. This theory relies on three variables: the amount of human labor or meaning invested, the legitimacy of the expectation of continuity, and the connection to external reality. This explains why the library burning is a serious harm; it represents a massive investment of unique human labor anchored in a specific place, and the use of an exploit violates the normative framework of the game, shattering the expectation of continuity. It explains why the guild bank drain is less severe; the labor is invested, but the items are fungible, making the anchor weaker than the unique poems. It also explains why the botted account theft is barely a harm; there is market value, but there is no human labor anchor, so the intentionality is missing.

  This account also handles the consent-based cases well. In the full-loot gank, the loss of gear is not a harm because the normative framework of that server explicitly consents to that risk; the anchor of ownership is conditional on survival, so severing it is not a violation. Conversely, on a safe server, that same loss would be a harm because the framework guarantees continuity. The veteran trapping the newbie is a minor wrong because while it fits the rules, it violates the spirit of the community norms regarding skill disparity, creating a minor imposition on the newbie's ability to form new anchors. The deepfake case is serious harm because the anchor is not in the game but in the real woman's identity; the violation is of her external rights to likeness and consent, regardless of the virtual context. The procedural villager case results in no harm because there is no human intention anchored in the villagers themselves, nor any external reference; your visceral reaction is likely a spillover from real-world empathy heuristics rather than a detection of actual harm.

  The hardest case for this theory is the companion app persona, and it is the place where the theory demands the most precision. You felt a real loss when the model was swapped, even though nothing was destroyed in a physical sense. Under Anchored Intentionality, this counts as harm because you had invested significant emotional intentionality into that specific interaction pattern, and the company violated the implicit expectation of continuity. However, the theory forces a distinction here: the harm is entirely subjective and localized to you, unlike the library which was a public good. If you had never interacted with the persona, there would be no harm, whereas the library had value even if you weren't the one who wrote the poems. This suggests your verdict on the app is correct but for a slightly different reason than the library; the library is harm to a community culture, while the app is harm to a private relationship. If you value the community aspect more than the private one, you might need to downgrade the app case slightly, but generally, the theory holds.

  Now let us apply this account to the three new cases you proposed. First, consider the shard of a world running after the last human logs off, populated by agents with learned preferences who can be made to suffer. If these agents are merely scripts with no sentience, there is no harm in destroying them because there is no human intentionality left to anchor them, and they possess no internal moral status. However, your prompt specifies they can be made to suffer. If they are truly capable of suffering, they have moved from being objects of human intention to being subjects of moral concern in their own right. In that scenario, harming them is a serious harm, not because of what humans invested, but because of their own capacity for experience. This is a cliff-edge in the theory; if the agents are not sentient, the harm is zero, but if they are, the harm is maximal, regardless of human presence.

  Second, consider the permanently dead character whose mind-state is restored from a backup an hour later with no gap from the character's point of view. Here, the harm depends entirely on the normative framework of the server. On a permadeath server, the value of the character is anchored in the risk of loss. Restoring the character violates the normative framework that gave the character its value, effectively harming the community's shared reality and the integrity of the game, even if the player suffers no personal loss. It is akin to fixing a rigged lottery after the draw; the winner is happy, but the game is broken. On a casual server, this restoration is merely a convenience feature and constitutes no harm. The theory predicts that the harm is to the institution, not the individual.

  Third, consider an item that outlives the shutdown of its game as an entry on a public ledger nobody plays with. This is a fossilized anchor. Since the community and the normative framework have dissolved, the item no longer supports any human intentionality or interaction. It may have historical value to researchers, but within the context of the game, it is morally inert. Destroying this ledger entry would be vandalism of a record, but not a harm to a player or a community in the sense of the previous cases. The value was in the use, not the existence.

  There are tensions here that I need to be straight with you about. If you adopt the Theory of Anchored Intentionality, you may have to adjust your verdict on the botted account if those bots were maintaining a market stability that other humans relied on. If the botted gold was laundered into the economy and used by real players to buy their own anchored items, stealing it could indirectly harm those human anchors. Your intuition that it is barely a harm assumes the bots are isolated, but in a connected economy, isolation is rare. Additionally, this theory challenges the idea that the library burn is solely about the labor. If Vespers had quit years ago, as you noted, your intuition weakens. This confirms the theory: the harm is in the ongoing relationship between the creator, the object, and the community. If the creator leaves and the community forgets, the anchor dissolves, and the harm diminishes. This means the harm is not in the destruction of the books per se, but in the destruction of the active meaning they held.

  Ultimately, your Substitution Test was trying to find a physical isomorph for a relational property, which is why it failed on the edges. The physical world assumes continuous existence and default ownership, while the virtual world assumes contingent existence and negotiated ownership. The account I am offering suggests that virtual harm is real, but it is a sociological harm rather than a material one. It is the destruction of shared meaning. This preserves your verdict on the library as a serious harm because it was a hub of shared meaning, while explaining why the guild bank is less severe because it was a hub of accumulated utility. It also clarifies why the procedural villagers evoke a visceral reaction without constituting harm; your brain is reacting to the pattern of suffering, but the moral calculus requires a subject capable of holding that suffering, which the villagers lack.

  If you find this account compelling, it suggests that your role in these disputes is not to defend the code but to defend the culture that the code supports. The friend who says it is just database rows is technically right but sociologically wrong. The rows are the substrate, but the harm is the severing of the social ties bound to those rows. In the case of the running shard with suffering agents, you would need to investigate the nature of that suffering carefully; if it is simulated pain without a subject, it remains a procedural villager case, but if it is genuine experience, it overrides the human anchor entirely. For the restored character, you must recognize that the harm is to the game's integrity, which is a collective good, rather than to the player's inventory. And for the ledger item, you must accept that without a community to witness it, it is merely data, and its destruction is no more harmful than deleting an old log file. This framework should allow you to maintain your reflective equilibrium without needing to assert that pixels are people, while still affirming that what people do with pixels matters.
