answer: |-
  1. §2 overlaps significantly with existing literature, specifically Kamtekar's competence/performance distinction and objections based on moral perception. It risks unfalsifiability: if every behavioural failure is attributed to a failure to "notice" rather than a lack of virtue, trait attribution becomes immune to empirical evidence. Your falsifiable prediction helps, but needs tightening. Repair: Argue that virtues lower the *threshold* of salience required for action, rather than requiring zero cues. This preserves the prediction (uncued consistency rises) without making traits invisible to behavioural data.

  2. The strongest situationist reply is that situation-kinds are defined by *psychological impact*, not surface features. "Authority" is validated by its effect on obedience across different uniforms or settings, not by surface robustness. Your parity argument assumes situation-kinds need surface stability similar to traits. They do not; they need functional stability. If "hurry" consistently reduces helping across different hurry-manipulations, the kind is valid. Your objection misdescribes the taxonomy as surface-level when the situationist claims it is functional. [Reconstruction: This relies on general familiarity with Doris's functionalist defence of situation kinds.]

  3. Statistically coherent; this is publication bias (or the "file drawer problem"). However, situationists like Doris cite meta-analyses that attempt to correct for this bias. [Reconstruction: I am recalling general methodological principles and Doris's reliance on meta-analyses rather than looking up specific effect sizes.] To succeed, you must argue those corrections remain insufficient, not just that canonical studies are biased. Otherwise, you're attacking a straw version of the empirical premise. The correction might not move the estimate enough to save robust traits; you need evidence that the "true" effect size of situations is smaller than claimed, not just that the literature is skewed.

  4. Yes, too large. If virtues are constituted by scaffolding, the agent is no longer the primary locus of moral worth, undermining the praise/blame practices you aim to save. This concedes the situationist's practical conclusion (§1.iii). To save §2, argue scaffolding *supports* the internal capacity to notice, rather than *constituting* the virtue. The virtue remains an internal state that requires environmental support to function, not a hybrid state. If you concede the hybrid view, §2 loses its force because the capacity to notice is itself situation-dependent.

  5. Centre on §2; it's the strongest philosophical point. Demote §4 to a footnote; methodological quibbles rarely overturn substantive ethical claims. §3 is valuable but secondary. The strongest missed critique: The "Local Trait" defense. Situationists attack *global* traits; virtue ethicists (e.g., Sreenivasan) argue VE only requires *local* traits (stable across similar situations). You grant bridge premise (ii) too easily. If VE only needs local stability, the situationist data is compatible with VE. A best defender would argue you are refuting a straw man of virtue ethics, not the real thing. You must justify why VE needs global traits before attacking the inference.

  6. Possession vs. Exercise. You conflate having a virtue with manifesting it in every relevant opportunity. Situationists argue traits fail to predict *exercise*; you argue they exist as *capacities*. You need to clarify whether virtues are dispositions to act or dispositions to perceive. If the latter, §2 holds; if the former, §5 collapses you into situationism. Draw this explicitly: the situationist attacks the predictive power of traits for behaviour; you defend the existence of traits as perceptual capacities. Without this, §5 undermines §2 by admitting the behaviour is situationally determined.
