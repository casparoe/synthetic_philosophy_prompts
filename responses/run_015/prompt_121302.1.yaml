  2.  **Week 3-4:** Draft the argument for why Standard variants loop and Opaque variants do not. Focus on the flow of information.
  3.  **Week 5:** Draft the responses to the "Structural Inevitability" counter-argument. This is the hardest section.
  4.  **Week 6:** Refine scope. Cut any drift into general Newcomb problems. Ensure the conclusion matches the narrow hypothesis.
  5.  **Week 7:** Final review against the "Uncontroversial vs. Contested" constraint. Ensure no contested claim is presented as fact.

  This proposal outlines a project that is narrow enough to be completed in a semester but significant enough to contribute to the ongoing discussion of decision-theoretic stability. It respects the complexity of the literature while attempting to carve out a distinct, testable hypothesis regarding the role of self-knowledge.
