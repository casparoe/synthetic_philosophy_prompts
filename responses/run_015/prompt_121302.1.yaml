  ### Appendix: Notes on Dialectical Status (For Author's Use)

  *To ensure the final paper adheres to the request to distinguish uncontroversial from contested claims, the following guide should be kept in mind during drafting:*

  1.  **Uncontroversial:**
      *   The Predictor's accuracy creates a correlation between choice and location.
      *   Naive causal reasoning ignores this correlation.
      *   Naive evidential reasoning creates a loop in the standard case.
      *   Agents can have varying degrees of access to their own decision processes.

  2.  **Contested (Requires Argument):**
      *   Whether the loop is a defect of the theory or the situation.
      *   Whether the "Opaque Agent" variant is a fair test of the theory.
      *   Whether stability is the correct metric for rationality.
      *   Whether self-knowledge is the *primary* driver of the instability (This is the paper's main contention).

  3.  **Settled Opinion (Does Not Exist):**
      *   There is no consensus on the correct solution to Death in Damascus. Do not write as if there is. Use phrases like "Proponents of X argue" rather than "The solution is."

  4.  **Where the Hunch Fights the Current:**
      *   The standard view treats the case as a test of *Decision Rules* (CDT vs. EDT).
      *   This proposal treats the case as a test of *Agent Architecture* (Transparent vs. Opaque).
      *   Expect resistance from theorists who believe decision rules should be robust regardless of the agent's self-knowledge. The paper must argue that no rule is applied in a vacuum; the agent's epistemic state is part of the input.

