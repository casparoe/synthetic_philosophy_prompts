answer: |-
  **Joint Summary**
  This collaboration established that Hofstadter's frame/outer/inner taxonomy provides a sufficient vocabulary for describing the structural components of the "Ghost-in-the-Frame" test case. Both parties agree on the formal properties of the object and the necessity of specifying explanatory burdens regarding interpreter behavior. However, division remains on the ontological status of the semantic content recovered when the frame explicitly negates the interpretive act. The Frame-Externalist contends the system fails to generate meaning, while the Inner-Representationalist argues the resulting contradiction constitutes a valid, albeit paradoxical, inner message.

  **Agreed Claims**
  1.  **Taxonomy:** Any communicative object comprises a Frame (interpretive rules), Outer Message (syntactic form), and Inner Message (semantic content recovered via Frame).
  2.  **Formal Properties:** The Ghost-in-the-Frame possesses a syntactic structure containing a logical contradiction that is latent until processed by a semantic frame.
  3.  **Frame Prohibition:** The Frame of the Ghost-in-the-Frame explicitly states that no interpretation is permitted.
  4.  **Explanatory Burden:** Both views accept the burden of explaining why an interpreter perceives content despite the Frame's prohibition.
  5.  **Interpreter Role:** Both views accept that resolving the contradiction requires accounting for the interpreter's cognitive architecture and potential representational drift.

  **Disagreements Table**

  | Crux | Frame-Externalist Formulation | Inner-Representationalist Formulation | Concrete Case | FE Prediction | IR Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **(a) Existence despite prohibition** | No inner message exists; the frame's prohibition is constitutive of the object's limit. | An inner message exists; the prohibition is itself part of the recoverable semantic content. | The logical contradiction embedded in the syntax. | The system yields a null set; interpretation halts. | The system yields a paradox; interpretation succeeds. |
  | **(b) Discovery vs. Invention** | Representational drift constitutes invention of content not present in the object. | Representational drift constitutes discovery of latent logical structure inherent to the object. | The use of an unstated auxiliary frame to resolve the contradiction. | The contradiction is an artifact of the user's imposed frame. | The contradiction is uncovered by the user's necessary framing. |
  | **(c) Taxonomy collapse** | Taxonomy remains intact only if the Inner Message slot is declared void when conflicted. | Taxonomy remains intact because the Inner Message slot absorbs the conflict as content. | The direct conflict between Frame rules and recovered Inner Message. | Claiming an Inner Message exists causes categorical collapse. | Claiming the contradiction is the message prevents categorical collapse. |

  **Note on Verbal vs. Substantive Dispute:**
  Both parties flag the disagreement in Crux (c) as potentially **merely verbal**. If "Inner Message" is defined as "recoverable semantic content," the FE defines this as null under prohibition, while the IR defines it as the contradiction itself. Both agree the taxonomy functions, differing only on the label applied to the output of a prohibited interpretation. Cruxes (a) and (b) remain **substantive**, as they concern the locus of meaning (object vs. interaction) and the validity of interpreter contributions (error vs. uncovering).
