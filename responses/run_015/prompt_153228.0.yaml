answer: |-
  This is a fantastic framing. Treating the history of science like a distributed systems problem cuts through the hagiography nicely. Let's run the Newton-Leibniz dispute through your "Inevitability + Open Source" model.

  ### 1. The Stack: Players and Roles

  If Calculus is the protocol (let's call it `v1.0`), here's the contributor graph:

  *   **Isaac Newton (The Early Committer):** Wrote the core logic (`fluxions`) around 1666. Treats the repo as private property. Uses obscure variable naming (dot notation: $\dot{x}$). Strategy: Security through obscurity. He wants to be the Benevolent Dictator For Life (BDFL) but refuses to publish the docs.
  *   **Gottfried Wilhelm Leibniz (The Public Maintainer):** Accesses the codebase (visited London, saw Newton's letters), re-implements the logic independently (mostly), and pushes to `main` in 1684. Creates a developer-friendly API ($dx$, $\int$, $\frac{dy}{dx}$). Strategy: Open collaboration. Wants credit, but prioritizes adoption.
  *   **The Bernoulli Brothers (The Early Adopters/Contributors):** Swiss devs who pick up Leibniz's library. They write plugins (solve hard problems Newton couldn't) and benchmark it against Newton's private build. They validate that Leibniz's API is more extensible.
  *   **The Royal Society (The Governance Board):** Supposed to be neutral infrastructure (like the IETF or W3C). Newton becomes President. They issue a "compliance report" (the 1712 *Commercium Epistolicum*) that retroactively claims Newton owns the IP and accuses Leibniz of plagiarism.

  ### 2. Inevitability Theory: Prediction vs. Reality

  **The Theory:** If the mathematical prerequisites (algebra, analytic geometry, physics problems regarding motion) are mature, the "Calculus Module" will be written by someone. If Person A doesn't do it, Person B will within a reasonable latency window.

  **The Prediction:**
  1.  **Redundant Implementation:** We should see independent commits from different nodes.
  2.  **Merge Conflict Resolution:** The community should converge on the implementation that offers the lowest friction (best notation).
  3.  **Minimal Latency:** Hoarding should be punished by obsolescence.

  **What Actually Happened:**
  1.  **Redundant Implementation:** **Confirmed.** Newton had the code ~20 years before Leibniz published, but Leibniz published ~10 years before Newton. Both solved the tangent/area problem. The inevitability thesis holds here: the logic was "in the air."
  2.  **Merge Conflict Resolution:** **Failed.** Instead of merging based on technical merit, the community forked. Britain used Newton's `dot` notation. Europe used Leibniz's `d` notation.
  3.  **Latency Penalty:** **Severe.** Because Britain stuck with Newton's private, suboptimal API due to nationalism, British mathematics accrued massive technical debt. They fell behind the continent for over a century because their notation didn't scale well for complex multivariable problems.

  ### 3. The API War: Notation as Syntax

  You asked if the "who" is just a routing label and the legacy is the standard API. This is where the software analogy shines.

  *   **Newton's API:** $\dot{x}$. Good for time-dependent physics (derivatives with respect to time). Hard to chain. Hard to read for higher-order derivatives.
  *   **Leibniz's API:** $\frac{dy}{dx}$. Explicit about variables. Looks like a fraction (making chain rule intuitive). Extensible to multiple variables easily.

  **Inevitability Verdict:** The *math* was inevitable, but the *syntax* was not.
  Leibniz's notation was objectively better developer experience (DX). In a pure meritocracy, Leibniz's API wins 100%.
  However, the "routing label" (Newton's name) carried enough weight in England to force the adoption of a worse API. This proves that in science, **the discoverer is not just noise; they are a dependency.** If the maintainer is toxic (Newton), the ecosystem suffers.

  ### 4. Where the Theory Breaks: Human Ego as Systemic Risk

  The inevitability theory assumes rational actors optimizing for truth. The dispute proves actors optimize for status.

  **The "Hostile Audit":**
  When the priority dispute heated up, Newton didn't write a better paper. He used his admin privileges at the Royal Society. He appointed the committee that investigated him, wrote the anonymous report himself, and published it under the Society's seal.
  *   **Software Equivalent:** The lead maintainer hacks the GitHub audit log to delete a competitor's commit history and claims they wrote the code first.

  **The Consequence:**
  Inevitability says "Calculus happens." It does *not* say "Calculus happens efficiently."
  Newton's ego introduced a **network partition**.
  *   **Node Group A (UK):** Ran Newton's legacy code. Stagnated.
  *   **Node Group B (Europe):** Ran Leibniz's open standard. Innovated rapidly (Euler, Lagrange, etc. built on Leibniz's syntax).

  If the discoverer were just noise, the UK mathematicians would have swapped to Leibniz's notation immediately upon seeing it was superior. They didn't. They treated the notation as a patriotic flag.

  ### 5. Does the Discoverer Matter?

  To answer your core question: **Does the "who" become a routing label, or does the drama prove the discoverer is never just noise?**

  It's a hybrid model.

  1.  **The Discovery (The Logic):** The *truth* is inevitable. If Newton and Leibniz died in infancy, Barrow or Fermat likely would have pushed a similar commit within 20 years. The "protocol" exists independently of the engineers.
  2.  **The Implementation (The Notation/Culture):** This is path-dependent. The "who" determines the *interface*.
      *   Leibniz's interface allowed for faster iteration.
      *   Newton's interface created a walled garden.

  **The Verdict on Inevitability:**
  The theory survives contact with the drama, but with a caveat: **Inevitability applies to the *problem solution*, not the *adoption curve*.**

  Science isn't just about finding the answer; it's about compressing that answer into a format others can use.
  *   **Leibniz** treated calculus as open-source documentation.
  *   **Newton** treated it as proprietary trade secret.

  The drama proves that while you can't stop a discovery, a single bad actor can introduce massive latency. Newton didn't stop calculus, but he successfully forked the British mathematical community into a legacy branch that took 100 years to patch.

  ### Summary for the Backend Engineer

  *   **Inevitability:** True. The "business logic" of calculus was ripe for implementation. Multiple devs wrote it independently.
  *   **Protocol vs. Owner:** You are right. Calculus is the protocol. Newton and Leibniz were just the first two maintainers.
  *   **The Bug:** The system assumes meritocracy. The reality was politics.
  *   **The Legacy:** We use Leibniz's API ($\int$, $d/dx$) globally today. Newton's routing label won the history books in England, but his code was deprecated.
  *   **Final Answer:** The discoverer is **not** just noise. They are the architect. If the architect designs a system that requires worshiping them rather than understanding the code (Newton), the system scales poorly. If they design for interoperability (Leibniz), the system scales globally.

  The drama doesn't disprove inevitability, but it proves that **human interface design** (ego, notation, politics) is the bottleneck, not the underlying math. In science, as in software, the best code doesn't always win—the best distributed network does. Leibniz built the network; Newton tried to build a monarchy.
