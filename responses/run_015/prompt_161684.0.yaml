answer: |-
  Good evening.

  Hal told us this was impossible.
  He wrote papers on it.
  He begged us not to try.
  He said backward induction proves surprise cannot exist.
  Well.
  Here we are.
  And here is Hal.
  He is surprised.
  So, the logic failed.
  Or maybe Hal failed.

  Hal says logic proves this party is impossible.
  But looking at the spread, I'd say the evidence is pretty solid.

  Raj is here tonight.
  He used to argue with Hal in office hours.
  Raj said if you don't set an end date, the induction never starts.
  No last day means no first step.
  Hal called that a cheat.
  He wanted a bounded window.
  We gave him one.
  This week only.

  Hal had his own answer.
  He wrote it on a single mimeographed page.
  He said surprise isn't about deduction.
  It is about attention.
  You can deduce a party is coming.
  But if you stop watching, it is still a surprise.

  Some of you know Hal as a professor.
  Others know him as the guy mowing the lawn at 6am.
  Both are true.
  He thinks hard.
  But he also lives.

  So what went wrong with his proof?
  I owe you a verdict.
  **Your argument assumed you never stop watching. But you do.**

  We know the old story involved a hanging.
  We kept the logic.
  We lost the rope.

  Hal, you taught us that truth is not solitary.
  You taught us that the best work is done together.
  You never solved the hard problems alone.
  And you don't face this year alone either.

  To Hal.
