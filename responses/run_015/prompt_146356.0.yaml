  # JOINT STATEMENT ON THE IMPLICATIONS OF LIBET-STYLE EXPERIMENTS FOR AGENCY

  **Signatories:** Camp A (The Causal Skeptics) and Camp B (The Causal Compatibilists)
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Readiness Potentials and Voluntary Action

  ## I. AGREED CLAIMS

  Both camps affirm the following empirical and conceptual premises as the baseline for further inquiry:

  1.  **Temporal Precedence:** In standard Libet-style tasks, a measurable readiness potential (RP) in the pre-supplementary motor area (pre-SMA) and related motor cortices consistently precedes the subject's reported time of conscious intention (W-judgment) by several hundred milliseconds.
  2.  **Veto Window:** There exists a temporal window between the onset of the RP and the execution of the motor act during which a conscious veto (aborting the action) is behaviorally possible.
  3.  **Trial Variability:** Averaging neural data across trials obscures single-trial variability; the RP represents a population-level trend that may not map identically onto the neural dynamics of every individual action execution.
  4.  **Task Limitations:** The existing experimental paradigm concerns simple, spontaneous motor acts (e.g., wrist flexion) rather than complex, deliberative choices involving moral reasoning or long-term planning.
  5.  **Explanatory Targets:** The central dispute concerns two specific questions: (a) whether neural precursors prior to conscious awareness are causally sufficient for the specific action executed, and (b) whether conscious mental states play any non-redundant causal role in determining which action is performed or whether it is performed at all.

  ## II. DISAGREEMENTS TABLE

  The following table outlines residual disagreements. Each statement is formulated to reflect the positive commitment of the respective camp.

  | Domain of Dispute | Camp A (Causal Skeptics) | Camp B (Causal Compatibilists) |
  | :--- | :--- | :--- |
  | **(a) Nature of the RP** | The RP represents an unconscious decision process that fixes the specific motor program before consciousness arises, rendering the subsequent conscious experience a post-hoc observation. | The RP reflects a preparatory bias or rising urge that remains open to conscious influence; it is a necessary condition for action but not a sufficient determination of the specific outcome. |
  | **(b) W-Judgment Reliability** | The subjective report of the time of conscious intention (W-judgment) is a reliable enough temporal marker to establish that the neural decision precedes the conscious will, invalidating the latter as the initiator. | The W-judgment is an imperfect retrospective estimate that may lag behind the actual onset of conscious processing; thus, it cannot definitively prove that conscious causation began after the RP onset. |
  | **(c) Veto Predetermination** | If a conscious veto occurs, the decision to veto is itself predetermined by prior neural activity unrelated to conscious reasoning, meaning the veto does not rescue free will. | The conscious veto represents a genuine causal intervention where conscious reasoning alters the trajectory of neural dynamics, breaking the chain of prior physical determinism regarding the output. |
  | **(d) Requirement for Free Will** | Libertarian free will requires that conscious intention be the first cause in the neural chain initiating the action; if it is not the initiator, it is epiphenomenal. | Free will requires only that conscious mental states exercise a non-epiphenomenal causal role at some stage (e.g., modulation or veto), not necessarily that they initiate the neural chain ex nihilo. |

  ## III. CRUXES

  We identify two sub-questions where empirical or logical resolution would compel at least one camp to revise their position.

  ### Crux One: Predictive Decoding and Causal Sufficiency
  **Question:** Can high-accuracy predictive decoding of single-trial pre-SMA activity determine the specific motor choice (e.g., left versus right flexion) well before any reportable awareness, and does such predictive success leave causal work for a conscious veto?

  *   **Proposed Study:** A real-time fMRI-EEG hybrid study where machine learning algorithms attempt to predict the specific direction of a voluntary movement based on pre-SMA activity patterns 1.5 seconds before the W-judgment. Subjects are instructed to monitor their urge and veto if they feel coerced by the prediction feedback.
  *   **Camp A Advance Prediction:** We expect decoding accuracy to exceed 80% before conscious awareness. **Revision Condition:** We would revise our position if decoding accuracy remains at chance levels until after the W-judgment, suggesting the specific choice is not fixed neurally until consciousness arises.
  *   **Camp B Advance Prediction:** We expect decoding accuracy to be significant but imperfect (e.g., 60-70%), reflecting bias rather than decision. **Revision Condition:** We would revise our position if decoding accuracy approaches 100% significantly before awareness *and* subjects report an inability to veto when informed of the prediction, indicating conscious states lack modulatory power.

  ### Crux Two: Multi-Level Agency vs. Epiphenomenalism
  **Question:** Can a multi-level model of agency—in which conscious evaluation operates on a slower integrative timescale than rapid motor preparation—be empirically distinguished from an epiphenomenalist model in which all conscious experience is a post-hoc construction?

  *   **Proposed Argument/Design:** A perturbation study using transcranial magnetic stimulation (TMS) applied to the pre-SMA during the RP window. If conscious veto power is real, disrupting the RP should alter the probability of veto without abolishing the conscious experience of urge. If epiphenomenalism is true, disrupting the RP should abolish the action without altering the subjective narrative of having chosen.
  *   **Camp A Advance Prediction:** We expect TMS disruption to alter action probability while subjects maintain the illusion of having freely chosen or vetoed, confirming the dissociation between neural cause and conscious narrative. **Revision Condition:** We would revise our position if TMS disruption specifically impairs the *report* of the veto capability while leaving the motor action intact, suggesting the conscious report tracks the causal mechanism.
  *   **Camp B Advance Prediction:** We expect TMS disruption to impair the subject's ability to veto successfully, correlating with reports of lost control, confirming consciousness tracks the causal leverage point. **Revision Condition:** We would revise our position if subjects report full control and successful vetoes despite TMS-induced motor failures that they did not anticipate, suggesting the conscious report is decoupled from actual motor causation.

  ## IV. CONCLUSION: SUBSTANTIVE VS. VERBAL DISAGREEMENT

  We conclude that while certain terminological differences exist, the core dispute is substantive rather than merely verbal.

  **Verbal Components:**
  Part of the dispute turns on the definition of "decision." Camp A defines "decision" as the point of no return in neural commitment (initiation closure). Camp B defines "decision" as the final authorization of the motor command (authorization closure). Similarly, Camp A defines "free will" requiring origination ex nihilo by conscious states, whereas Camp B defines it requiring effective governance over neural processes.

  **Conceptual Distinction:**
  To clarify the remaining substantive disagreement, we introduce the distinction between **initiation closure** (whether the RP fixes the specific motor program irreversibly) and **authorization closure** (whether any mental state can still authorize or abort the program before execution).

  *   **Camp A Statement on Distinction:** We accept this distinction. We maintain that Libet-style data demonstrates *initiation closure* occurs prior to consciousness. We argue that without conscious *initiation closure*, *authorization closure* is illusory because the authorization itself is neurally predetermined.
  *   **Camp B Statement on Distinction:** We accept this distinction. We maintain that Libet-style data only demonstrates early *initiation closure* regarding motor preparation, not outcome. We argue that *authorization closure* remains open to conscious influence, and that this late-stage causal leverage is sufficient for moral agency.

  **Substantive Core:**
  Once these definitions are aligned, the remaining disagreement is factual: Does the neural activity preceding conscious awareness causally determine the outcome with sufficient specificity to render conscious modulation impossible or predetermined? This is an empirical question regarding the causal sufficiency of pre-conscious neural states, not a semantic dispute about the label of "free will."
