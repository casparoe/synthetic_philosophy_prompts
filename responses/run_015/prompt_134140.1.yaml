answer: |-
  This institutional design by the International Consortium for Responsible Research Funding (ICRRF) is a fascinating artifact of applied metaethics. It operationalizes the distinction between internal and external questions (à la Carnap) while structurally aligning normative commitments with ontological posits (à la Quine). To analyze this, we must disentangle the *procedural agnosticism* of the Consortium from the *substantive metaethical commitments* required to make sense of the parallel between ontology and normativity.

  ### 1. Philosophical Presuppositions: Quineanism vs. Realism

  Does the practice strictly presuppose a Quinean view? **No.** However, it structurally privileges a naturalized, pragmatic conception of value.

  The practice presupposes **Metaethical Functionalism**: the idea that moral values function as constraints on inquiry and action, regardless of their metaphysical origin. By requiring a Normative Impact Statement parallel to an Ontological Impact Statement, the Consortium treats values as *methodological variables* rather than purely metaphysical facts.

  *   **Compatibility with Quinean Naturalism:** This fits comfortably. For a Quinean, ontological commitments (electrons, genes) are posits retained because they facilitate the prediction and control of experience. They are revisable nodes in the web of belief. If the Scheme-Relative Register treats values similarly—as posits retained for social cohesion or research viability, revisable under pragmatic pressure—the structural isomorphism is perfect. The Universalist Register, in a Quinean frame, would simply be a "more central" node in the web, treated as immutable for now but theoretically revisable.
  *   **Compatibility with Robust Moral Realism:** This is also compatible, provided the realist accepts **Epistemic Humility**. A realist can concede that while values are mind-independent, our *access* to them is mediated by conceptual schemes. The Universalist Register corresponds to the realist's claim to truth; the Scheme-Relative Register corresponds to the acknowledgment of our fallible, culturally situated grasp of those truths.

  **Strict Requirement:** The practice strictly requires **Institutional Metaethical Agnosticism**. It cannot presuppose that one register is metaphysically superior, or it would violate its own funding equity rules. It requires only that values *act* as constraints.

  ### 2. Reconstructing the Implicit Metaethical Theory

  The implicit theory that makes sense of treating normative commitments as register-selectable in parallel with ontological ones is **Conceptual Relativism regarding Normativity**.

  Just as Quine argues that "to be is to be the value of a bound variable" relative to a background language, this practice implies that "to be valuable is to be a constraint in a bound framework." The theory posits that:
  1.  **Normative Posits:** Values function like theoretical entities. They are introduced to explain why certain actions are taken (e.g., "We did not clone humans because we posit 'human dignity'").
  2.  **Inscrutability of Value Reference:** Just as reference is inscrutable without a translation manual, the "reference" of a value (e.g., does 'justice' refer to utility or rights?) is indeterminate without specifying the register.
  3.  **Pragmatic Maxim:** The choice between registers is not a discovery of fact but a pragmatic decision about how one wishes to engage with the broader research community.

  This theory allows the Consortium to bypass the "is-ought" problem by treating "oughts" as "is-es" of the conceptual scheme. An "ought" is simply a description of a normative pressure within a specific web of belief.

  ### 3. Strict Requirements vs. Comfortable Fits

  *   **Strictly Required:**
      *   **Non-Cognitivism about the Register Choice:** The decision to file in one register or the other cannot itself be a moral truth. It must be a procedural choice.
      *   **Coherence as Sufficiency:** Truth (in the Universalist register) or Viability (in the Scheme-Relative register) is determined by internal coherence with other commitments, not by correspondence to an external moral reality.
      *   **Separation of Registers:** Mixing is prohibited to prevent category mistakes (confusing a framework-internal rule with a framework-external law).

  *   **Comfortable Fits (but not required):**
      *   **Quinean Holism:** The idea that changing a value might require changing an ontological commitment (and vice versa) fits well but isn't mandated.
      *   **Error Theory:** A skeptic could use the Scheme-Relative Register to say, "These aren't real, but we act as if they are," which the system allows.
      *   **Pluralistic Realism:** A realist who believes there are multiple, equally valid objective moral systems could use both registers without contradiction.

  ### 4. The Inconsistency: The Ban on Non-Consensual Experimentation

  The Consortium bans non-consensual experimentation regardless of the register chosen.
  *   **The Tension:** If a researcher files in the **Scheme-Relative Register**, they assert their values are internal to their tradition. If their tradition permits non-consensual experimentation (e.g., a utilitarian calculus sacrificing one for many), the Scheme-Relative logic suggests this should be permissible *within that scheme*. Yet, the Consortium bans it universally.
  *   **Quinean Resolution (Pragmatic Boundary):** A Quinean explains this not as a hidden moral universal, but as a **constitutive rule of the Consortium's own conceptual scheme**. Just as a chess tournament bans moving a rook diagonally—not because it is "immoral" but because it violates the game—the Consortium treats informed consent as a boundary condition for *receiving funding*. It is a "pragmatic boundary of the funding scheme itself." It is held true "come what may" (in the center of the Consortium's web of belief) to preserve the institution's identity and legal viability. It does not claim moral authority over the researcher's private life, only over the grant.
  *   **Realist Resolution (Hidden Universalism):** A realist would argue this reveals the Scheme-Relative Register is not truly relative. It suggests there is a "floor" of objective moral truth (consent) that no scheme can override.
  *   **Verdict:** The Quinean explanation is more consistent with the *design*. If it were a moral truth, it should require the Universalist Register. By applying it to *both*, the Consortium treats it as a **procedural invariant**, distinct from the normative content being evaluated.

  ### 5. Procedural Changes for Moral Realism

  If the underlying theory shifted from Quinean conventionalism (values adopted) to Moral Realism (values discovered), the Consortium's procedures would require significant alteration:

  1.  **Review Criteria Shift (Coherence → Accuracy):**
      *   *Current:* Reviewers check for *internal coherence* (do the values match the methods?).
      *   *Realist Change:* Reviewers must assess *moral accuracy*. A proposal could be internally coherent (e.g., a consistent Nazi ethic) but rejected because it fails to track objective moral facts. The Scheme-Relative Register would likely be defunded or reclassified as "Hypothetical Modeling" rather than genuine research ethics.

  2.  **Abolition of Register Prohibition:**
      *   *Current:* No mixing registers.
      *   *Realist Change:* Mixing would be *encouraged* or required. A realist believes some values are universal (human rights) and some are local (professional etiquette). Forcing a choice between "All Universal" or "All Relative" forces a false dichotomy on the moral landscape.

  3.  **Decoupling Ontology and Normativity:**
      *   *Current:* Parallel statements imply structural similarity.
      *   *Realist Change:* The Ontological Impact Statement remains about *truth* (correspondence). The Normative Statement becomes about *obligation* (authority). The parallel breaks because, for a realist, "what exists" and "what matters" are categorically distinct. The funding body might separate the review committees entirely, as scientific expertise does not confer ethical expertise.

  ### 6. Philosophical Underdetermination

  The practice is philosophically underdetermined in several key areas, allowing rival theories to license the same design:

  *   **Kantian Constructivism:** A Kantian could argue that the Universalist Register captures the Categorical Imperative (binding on all rational agents), while the Scheme-Relative Register captures Hypothetical Imperatives (binding only on those with specific ends). The institutional design maps perfectly onto this distinction without requiring moral realism.
  *   **Expressivism/Quasi-Realism:** An expressivist could treat the Universalist Register as "projecting" attitudes with high intensity and social demand for universality, while the Scheme-Relative Register projects attitudes with local scope. Since the institution only evaluates the *consistency* of the projection, the metaphysical status of the values remains irrelevant.
  *   **Rawlsian Political Liberalism:** The design mirrors the distinction between a "comprehensive doctrine" (Scheme-Relative) and an "overlapping consensus" (Universalist). The Consortium acts as the political framework that allows both to coexist without adjudicating their ultimate truth.

  **Conclusion:**
  The ICRRF practice is a masterpiece of **methodological bracketing**. It does not strictly presuppose Quinean naturalism, but it *operationalizes* Quinean insights: that commitments (ontological or normative) are tools for navigating the world, and that we can study the utility of these tools without settling their metaphysical status. The inconsistency regarding non-consensual experimentation is resolvable within Quineanism by viewing the ban as a constitutive rule of the funding "language game" rather than a moral absolute. However, a shift to robust realism would shatter the symmetry between ontology and normativity, demanding a review process focused on moral truth-tracking rather than pragmatic coherence.
