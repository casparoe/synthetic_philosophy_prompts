answer: |-
  The Chair of the Ethics Committee gestured proudly at the whiteboard. "Under our new charter, each senior member holds an individual veto over any safety protocol. This ensures our threshold for authorization is set by the most cautious person in the room. Collectively, we are now immune to recklessness."

  The senior faculty nodded, secure in their procedural safeguards.

  From the corner of the departmental common room, a junior researcher looked up from his laptop. "Just to clarify," he said. "Your vetoes apply to the *adoption of the protocol*."

  "Naturally," said the Chair.

  "And I can deploy the system from this laptop."

  "Theoretically, yes. But without an approved protocol, you are unauthorized."

  "Chair," the researcher said, "you've built a system where stopping me requires unanimity, but starting me requires only one keystroke. You've set the barrier for *protection* to the maximum of our caution, but the barrier for *action* remains the minimum of our restraint. You haven't raised the threshold for deployment. You've just ensured that the only threshold that matters is mine."

  The Chair slumped, watching the progress bar load on the screen. "So the veto power..."

  "...is purely for the minutes," the researcher said. "You're not a governance body. You're an audience."
