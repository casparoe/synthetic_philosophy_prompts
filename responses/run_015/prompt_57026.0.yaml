      *   *Critique:* Is the Diderot comparison sharp enough?
      *   *Fix:* Contrast the *goal*. Diderot wants control; Paradox of Fiction worries about consistency.

  9.  **Final Polish:** Check the tone. It needs to be respectful of the craft, acknowledging the physical toll ("8 shows a week"), and not dismissive of the girlfriend's point, but firmly grounding it in the studio. Ensure the "Residue Report" feels like a diagnostic tool, not just an afterthought. (Self-correction: Make sure I don't validate the girlfriend's claim that it was irrational without qualifying *whose* rationality we are talking about.)

