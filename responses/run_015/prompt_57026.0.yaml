      *   **Goal:** Understand the philosophical debate *translated* into actor vocabulary, followed by a rigorous "Residue Report" on what didn't translate.
      *   **Actor Vocabulary:** Given circumstances, magic if, as if, sense/affective memory, substitution, repetition, objectives/obstacles, actions/verbs, fourth wall, public solitude, psychological gesture, inside-out/outside-in, breaking, eight shows a week.
      *   **Philosophical Content:**
          *   Premises: Genuine feelings for non-real objects, feelings require belief in existence, fiction implies no belief in existence.
          *   Solutions: Quasi-emotion, imagination suffices, partial illusion, emotions don't need belief.
          *   Specific Questions: "Genuine but unjustified" feeling? Spectator vs. Performer perspective? Diderot's Paradox of the Actor vs. Paradox of Fiction.
      *   **Constraints:** No bibliography, American English, flag fudges explicitly, don't import philosophical assumptions into actor terms falsely, prioritize the Residue Report.

  2.  **Deconstruct the Philosophical Debate (Paradox of Fiction):**
      *   *Premise 1:* We have genuine emotional responses to fictional characters/events. (I cried.)
      *   *Premise 2:* To have a genuine emotional response, one must believe the object of the emotion exists/is real. (Rationality requires belief.)
      *   *Premise 3:* We do not believe fictional characters/events exist. (I know it's a play.)
      *   *Conclusion:* Therefore, our response is irrational/paradoxical.
      *   *Standard Solutions:*
          1.  *Quasi-Emotion:* It's not real grief, it's "make-believe" grief.
          2.  *Thought Theory:* Imagination is enough; belief isn't needed for emotion.
          3.  *Illusion Theory:* We suspend disbelief temporarily.
          4.  *Non-Cognitivism:* Emotions don't require existential judgments.

  3.  **Translate to Actor Vocabulary (The "Mapping"):**
      *   *Premise 1 (Genuine Feelings):* "Breaking" or "Truthful moment." The tears were real, not simulated.
      *   *Premise 2 (Belief Required):* This is the tricky one. In acting, we talk about "Truth" and "Belief." But do we believe the *facts*? No, we believe in the *Given Circumstances* via the *Magic If*.
      *   *Premise 3 (Know it's Fiction):* "Fourth Wall" is permeable. We know we are on stage (Public Solitude), but we act *As If* it is real.
      *   *Solution 1 (Quasi-Emotion):* "Indicating" or "Demonstrating." Fake crying.
      *   *Solution 2 (Imagination Suffices):* The *Magic If*. "If this were true, what would I do?" You don't need to believe it *is* true, just act *as if*.
      *   *Solution 3 (Illusion):* "The Bubble." Getting lost in the scene. Losing the audience.
      *   *Solution 4 (No Belief Needed):* "Physical Action" or "Psychological Gesture." Doing the verb generates the feeling regardless of belief.

  4.  **Drafting the Translation (Iterative Process):**
      *   *Challenge:* Philosophy talks about "belief in existence." Acting talks about "belief in the circumstance."
      *   *Fudge Alert:* Philosophers mean ontological existence (does this child exist in the world?). Actors mean experiential truth (is this reaction honest right now?). I need to highlight this distinction.
      *   *Premise 2 Translation:* "To cry truthfully, I must believe the child is dead." -> *Fudge:* I don't believe the child is dead. I believe *I am in a situation where my child is dead.*
      *   *Solution 2 Translation:* "Imagination is enough." -> *Magic If.* This is a strong map.

  5.  **Developing the Residue Report (The Core Task):**
      *   *Question 1: Genuine but Unjustified?*
          *   Actor view: If it serves the scene and comes from the work, it's "Truthful." If it stops the show (had to turn upstage, partner carried beat), it might be "Indulgent" or "Breaking."
          *   Philosophy view: "Irrational" because the object doesn't exist.
          *   *Residue:* Actors don't care about ontological justification. We care about *functional* justification. The "irrationality" is actually a technical failure (loss of control) disguised as a metaphysical puzzle.
      *   *Question 2: Spectator vs. Performer:*
          *   Paradox of Fiction is for the audience (passive).
          *   Actor is active/generating.
          *   *Residue:* "We know it isn't real" is different for actors. We *make* it real physically. The audience pretends it's real; we pretend we aren't pretending.
      *   *Question 3: Diderot vs. Fiction:*
          *   Diderot: Great actor feels nothing (cold control).
          *   Fiction: Audience feels too much (irrational).
          *   *Residue:* Opposite ends of the same spectrum. Diderot is about technique/repeatability (8 shows a week). Fiction paradox is about cognitive consistency.

  6.  **Refining the Vocabulary Mapping:**
      *   *Belief:* Map to "Faith in the Given Circumstances."
      *   *Existence:* Map to "Reality of the Moment."
      *   *Irrational:* Map to "Unrepeatable" or "Indulgent."
