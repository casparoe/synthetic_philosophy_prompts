prompt: |-
  Writing a problem sheet on rationalisability for second-years and I've realised I don't actually know whether my own position hangs together, so: here's roughly where I've landed, tell me what's broken.

  1. My working test for "what common belief in rationality permits" in a finite normal-form game is iterated elimination of strictly dominated strategies, with mixed strategies allowed as dominators.
  2. I never worry about the order of deletion, or whether you cross things out one at a time or all in one go — for strict dominance I've always just assumed it can't matter.
  3. I'm slightly uneasy about mixed dominators, because I also hold that a rational player only randomises when indifferent; but I allow them anyway, since in the little 3x3 I knocked up (row player's payoffs 4/0/2, 1/1/1, 0/4/2) the middle row only goes out if you let a mixture do the work.
  4. I then ran the same routine on a three-player example — three firms each picking one of two platforms, no communication between them — and wrote in the solutions that the surviving strategies are exactly the ones compatable with common belief in rationality.
  5. When the strict version leaves too much standing, I also bin weakly dominated strategies and don't fuss about the order there either, e.g. I'm happy to delete down to the bottom in traveller's-dilemma-style games.

  Which pairs genuinely clash, which only look like they do, and what's the cheapest fix each time? Rank the tensions by severity rather than flagging all of them as equally bad, and if one of my case verdicts (the 3x3, or the three-firm thing) isn't actually delivered by what I say elsewhere, say so plainly and tell me which commitment has to go.
