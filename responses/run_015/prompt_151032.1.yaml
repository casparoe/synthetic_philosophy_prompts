answer: |-
  This is not an admin issue. This is one of the most significant ethical frontiers in museum work right now.

  To answer your specific question: **No, the harm is not reducible to losing the object.** The request to alter or delete the catalog records is a demand for **epistemic reparations**, not just material ones.

  Here is a breakdown of the philosophical and practical stakes you can bring to your committee to help bridge the gap between the two halves of your board.

  ### 1. The Core Philosophical Question: Epistemic Violence
  Your board members who think "returning the object fixes the harm" are operating under a **property model** of museums. In this view, the museum is a warehouse, and the harm was theft. Once the property is returned, the debt is paid.

  However, the descendant community is operating under a **knowledge model**. For the last century, anthropology and museology have exercised power not just by taking objects, but by defining what they *are*.
  *   **The Harm:** When an anthropologist labels a sacred item as a "specimen," "artifact," or "idol," they are stripping it of its agency and relational status. They are inserting it into a Western taxonomy that often implies the culture is "past tense" or "studied."
  *   **The Persistence:** Even if the physical object leaves the building, the *definition* remains in the digital ecosystem. Scholars, students, and AI models scrape these databases. If the digital record still says "Ceremonial Mask (c. 1900, Primitive Art)," the scholarly narrative continues to colonize that object's identity, even if the object is back home.
  *   **The Concept:** This is often called **Epistemic Violence**. The community is asking you to stop the violence of misrepresentation, which continues independently of physical possession.

  ### 2. Indigenous Data Sovereignty (IDS)
  There is a growing global framework called **Indigenous Data Sovereignty**. Just as nations have sovereignty over their land, Indigenous and descendant communities are asserting sovereignty over data *about* them.
  *   **CARE Principles:** You may know the FAIR principles (Findable, Accessible, Interoperable, Reusable) for open data. Indigenous groups advocate for **CARE** (Collective Benefit, Authority to Control, Responsibility, Ethics).
  *   **Authority to Control:** This principle argues that the community, not the university, should have the authority to decide how information about their heritage is classified and accessed.
  *   **The Implication:** From this viewpoint, the catalog record isn't the university's property; it is information *about* the community's heritage. They have the right to dictate the metadata.

  ### 3. The "Digital Ghost" Problem
  Your board needs to understand that digital records have an afterlife.
  *   **Aggregators:** Your local catalog likely feeds into larger consortiums (like OCLC, DPLA, or Google Arts & Culture). If you return the object but leave the old record, the object effectively still "exists" in the academic sphere under a colonial name.
  *   **Scholarly Impact:** Future research relies on these tags. If the tags are offensive or incorrect, future research will be built on flawed foundations. By refusing to update the record, the university is effectively forcing future scholars to use harmful language.

  ### 4. The "Deletion" vs. "Rewriting" Nuance
  This is where it gets technically and ethically tricky. You need to distinguish between two different requests the community might be making:

  *   **Rewriting (Re-classification):** This is generally more palatable to universities. It involves keeping the provenance (the history of the object) but changing the *subject headings* and *descriptions* to match the community's terminology. This acknowledges that the object exists but respects the community's ontology.
  *   **Deletion (Digital Repatriation/Erasure):** This is harder. Why would they want it deleted?
      *   **Security:** Sometimes revealing the existence of ceremonial items puts them at risk of theft or misuse.
      *   **Sacredness:** Some knowledge is restricted. In many Indigenous cultures, certain information is only meant for initiated members. Having it on a public server is itself a violation of sacred law.
      *   **Refusing the Archive:** Sometimes, the act of being cataloged is the trauma. Deleting the record is a way of saying, "This was never yours to document."

  ### 5. Practical Recommendations for Your Committee
  You are in a position to move this from a "fight" to a "policy." Here is how you can frame it:

  1.  **Reframe the Cost:** Don't let the board view this as an IT ticket. It is a relationship cost. If you return the objects but keep the harmful data, you signal that you value your database more than their dignity. That undermines the repatriation.
  2.  **Propose "Critical Contextualization":** If total deletion feels like "erasing history" to the board, propose a middle ground. Keep the original record but mark it as **"Historical Description (Harmful Language)"** and link it to a new record created by the community. This preserves the history of the *museum's* actions without validating the *anthropology*.
  3.  **Check Your Agreements:** If you use shared library networks, you may technically *cannot* delete records without affecting other institutions. You need to be honest with the community about technical limitations. However, you can usually suppress public display while keeping backend records.
  4.  **Look at Precedent:** The **Museum of Archaeology and Anthropology at Cambridge** and the **Smithsonian** have both grappled with "digital repatriation." There are protocols for this. You don't have to invent the wheel.
  5.  **Ask the Community "Why":** Invite a representative to explain *why* the digital record matters. Often, when board members hear directly that "keeping this name online prevents our youth from learning the true name," the abstract philosophical argument becomes concrete human harm.

  ### Summary for your Board
  You can tell your colleagues:
  > "If we return the object but keep the colonial label, we are returning the body but keeping the name. In the digital age, the record *is* the object for 99% of the world. If we care about repairing harm, we have to repair the knowledge, not just the inventory."

  This is a chance for your university to lead. Most institutions are still stuck on the physical return. Handling the data correctly puts you on the cutting edge of ethical museology.
