answer: |-
  Here are three distinct setups I brainstormed, followed by the one I recommend committing to, fully fleshed out.

  ### Brainstorming Phase

  **Option 1: The "Alien Archaeology" (Narrative/Text-Based)**
  *   **Setup:** Students receive detailed diagrams of fictional alien anatomy (e.g., a creature with a heavy crest, hollow bones, and symmetrical color patterns). They are given "environmental data" (windy planet, low gravity).
  *   **Mechanism:** They must write the "Just-So Story" (function) and the "Structural Story" (constraint) for each trait. They vote on plausibility.
  *   **Pros:** Low logistical friction; focuses purely on the reasoning patterns.
  *   **Cons:** Lacks visceral punch. It's easy to be clever with words without feeling the *friction* of physical reality. It risks becoming a creative writing exercise rather than a philosophical critique.

  **Option 2: The "Rule-Bound Poem" (Linguistic/Process-Based)**
  *   **Setup:** Teams must write a poem that maximizes a "fitness score" (e.g., number of rhymes + syllable count). However, they are bound by strict grammatical constraints (e.g., "No verbs ending in -ing," "Must use all vowels in order").
  *   **Mechanism:** Other teams analyze the poem. Did a word appear because it was fit (rhymed) or because it was forced (grammar constraint)?
  *   **Pros:** Excellent for showing how constraints channel outcomes.
  *   **Cons:** A bit abstract. Mapping "grammar" to "developmental biology" requires a conceptual leap that might eat up debrief time.

  **Option 3: The "Architect's Fallacy" (Physical/Engineering-Based)**
  *   **Setup:** (Your core idea, refined). One team builds a structure under secret constraints; the other team analyzes it as if it were a natural object.
  *   **Mechanism:** Physical betting market on feature origins. Evidence market allows testing.
  *   **Pros:** Highly visceral. The physical reality of the straws (they bend, they slip) creates "structural necessities" that feel exactly like biological constraints. The "designer" element mimics the *appearance* of selection without the reality.
  *   **Cons:** Logistically heavier. Requires strict timekeeping.
  *   **Verdict:** **Option 3 is the winner.** For upper-division undergrads, the tactile experience of fighting against materials creates a shared phenomenological ground for the debrief. It makes the "adaptationist intuition" feel like a natural error rather than a lecture point.

  ***

  # Lesson Plan: The Architect's Fallacy

  **Course:** Philosophy of Biology (Upper-Division)
  **Time:** 90 Minutes
  **Students:** 14 (Split into 2 Teams of 7: "Team Alpha" & "Team Beta")
  **Goal:** Experiential discovery of the Gould-Lewontin critique (Spandrels) without using the terminology until the end.

  ### 1. Materials & Prep

  **For the Instructor:**
  *   **The "Truth" Envelope:** A sealed envelope containing the specific instructions given to Team Alpha.
  *   **Evidence Cards:** 4 distinct cards (see *Evidence Menu* below).
  *   **Scoring Board:** Whiteboard divided into "Feature," "Function Claim," "Constraint Claim," "Wager," "Result."
  *   **Timer:** Visible to all.
  *   **Scissors:** For the "Cut Test" only.

  **For Each Team (Identical Kits):**
  *   20 plastic drinking straws (flexible necks removed/pre-cut if possible).
  *   10 pipe cleaners.
  *   1 roll of masking tape.
  *   1 index card (base).
  *   **Constraint:** No cutting materials allowed (except by Instructor during evidence phase).

  **Room Setup:**
  *   Team Alpha sits in a corner or behind a screen (they need to build without Beta seeing).
  *   Team Beta sits at a central table.

  ### 2. The Rules (Read Aloud - 5 mins)

  1.  **The Ban:** Until I say "Debrief," no one may use the words: *Spandrel, Adaptation, Adaptationist, Panglossian, Exaptation, Function, Purpose.*
      *   *Allowed:* "Use," "Role," "Effect," "Necessity," "Rule," "Physics," "Why it's there."
  2.  **Team Alpha (The Builders):** You will receive a **Mission Card**. You have 15 minutes to build a single standing structure. You must follow the Mission Card exactly.
  3.  **Team Beta (The Archaeologists):** You will not see the build. Once the structure is revealed, your job is to explain why every distinct feature exists.
  4.  **The Economy:** Both teams start with **100 Points**.
      *   **Function Wager:** You claim a feature exists because it helps the structure stand (optimization). Cost: 10 points. Payout: 20 points if correct.
      *   **Constraint Wager:** You claim a feature exists because the materials or rules forced it (by-product). Cost: 20 points. Payout: 50 points if correct.
      *   *Note:* The pricing is rigged. Function wagers are cheaper and feel safer. Constraint wagers are expensive and risky. This mimics the intellectual bias we are studying.
  5.  **Evidence Market:** After initial wagers, you may buy evidence cards. Prices vary.
  6.  **Winning:** The team with the most points at the end wins. (In reality, the "win" is the philosophical insight, but keep the gamification active).

  ### 3. Timeline (Minute Marks)

  | Time | Activity | Details |
  | :--- | :--- | :--- |
  | **00-05** | **Intro & Rules** | Read rules. Emphasize the vocabulary ban. Distribute kits. |
  | **05-20** | **Construction (Alpha)** | Team Alpha builds. Team Beta waits (or writes down initial hypotheses about straw physics). **Instructor:** Hand Alpha the *Mission Card* (see below). |
  | **20-25** | **The Reveal** | Alpha stops. Beta approaches the object. No touching yet. |
  | **25-50** | **Analysis & Wagering** | Beta identifies 6 distinct features. For each, they must place a wager (Function vs. Constraint). Alpha can consult but not reveal truth. |
  | **50-70** | **Evidence Market** | Teams pool points to buy up to 2 Evidence Cards. |
  | **70-80** | **The Truth** | Open the "Truth Envelope." Perform the "Cut Test" on disputed features. Settle points. |
  | **80-90** | **Debrief** | Map the game to Gould-Lewontin. Lift the vocabulary ban. |

  ### 4. The Secret Mission Card (For Team Alpha)
  *Print this, fold it, and hand it only to Team Alpha.*

  > **MISSION OBJECTIVE:** Build the tallest free-standing tower possible using the kit.
  >
  > **MANDATORY CONSTRAINTS (You must do these even if they hurt stability):**
  > 1. You must use **all 10 pipe cleaners**. (Crucial: This forces "useless" bracing).
  > 2. You must create a **triangular base** (even if a square base is more stable).
  > 3. You cannot cut any straws.
  > 4. You must wrap tape around every joint at least 3 times. (Creates bulk/weight).
  >
  > *If you finish early, reinforce the top.*

  ### 5. Scoring Sheet (Whiteboard Layout)

  | Feature ID | Description (e.g., "Red Pipe Cleaner at Base") | Team Beta's Claim (Function vs. Constraint) | Wager (Pts) | Evidence Bought? | Verdict (Truth) | Points Won/Lost |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | Triangular Base | Function (Stability) | 10 | No | **Constraint** (Rule #2) | -10 |
  | 2 | Extra Pipe Cleaners | Function (Bracing) | 10 | Yes (Cut Test) | **Constraint** (Rule #1) | -10 + Cost |
  | 3 | Heavy Tape Joints | Function (Strength) | 10 | No | **Mixed** (Rule #4 + Utility) | Split |
  | 4 | Height | Function (Goal) | 10 | N/A | **Function** (Mission Obj) | +20 |
  | ... | ... | ... | ... | ... | ... | ... |

  ### 6. The Evidence Menu
  *Write these on the board with prices. Teams must vote to buy.*

  1.  **The Sibling Artifact (Cost: 30 pts):** I show them a tower built by a *different* group last year with the *same kit*.
      *   *Trap:* It looks similar. Students will think "Convergent Evolution = Function." But if the other group also had the "Use all pipe cleaners" rule, it's actually shared constraint.
  2.  **The Inventory Audit (Cost: 20 pts):** I show the leftover tray.
      *   *Value:* If the tray is empty, it proves they *had* to use everything (Constraint). If the tray is full, they chose to use items (Function).
  3.  **The Cut Test (Cost: 40 pts):** I physically cut one specific feature off (e.g., a specific pipe cleaner).
      *   *Value:* High. If the tower stands, the feature was not necessary for stability (likely Constraint/Spandrel). If it falls, it was functional.
  4.  **The Architect Interview (Cost: 25 pts):** You can ask Team Alpha one question.
      *   *Trap:* Alpha might say "We thought it helped," even if they did it because of the rule. Intent $\neq$ Function.

  ### 7. The Debrief (Mapping the Game to the Critique)
  *Lift the vocabulary ban here.*

  1.  **The "Function" Wager $\rightarrow$ Adaptationism:**
      *   *Ask:* "Why did almost everyone bet on Function first?"
      *   *Point:* It is the default, cheaper, more intuitive explanation. We assume everything is *for* something. This is the **Adaptationist Programme**.
  2.  **The "Constraint" Wager $\rightarrow$ Spandrels/By-products:**
      *   *Ask:* "Which features turned out to be Constraints?" (Likely the pipe cleaners and triangular base).
      *   *Point:* These features exist not because they were selected *for*, but because of the rules of the system (developmental constraints, physical laws, historical legacy). Gould calls these **Spandrels**.
  3.  **The Evidence Menu $\rightarrow$ Methodological Critique:**
      *   *Ask:* "Which evidence tricked you?"
      *   *Point:* The **Sibling Artifact** looked like convergence (evidence of function), but was actually shared constraint. Gould & Lewontin argue that comparative methods often mistake shared developmental constraints for adaptive convergence.
      *   *Point:* The **Architect Interview** showed that "intent" (or genetic 'intent') is hard to discern. Just because a trait exists doesn't mean it was 'chosen' for its current use.
  4.  **The "Design" Problem:**
      *   *Ask:* "Who designed this?" (I did).
      *   *Point:* In the game, there *was* a designer (Me + The Rules). In nature, there is no designer, only selection acting on variation. The danger is assuming nature is like the Architect (optimizing), when nature is more like the Physics of the Straws (constraining).

  ### 8. Troubleshooting: What Goes Wrong & Recovery

  **Problem 1: Team Alpha builds something too simple.**
  *   *Risk:* If they just make a tripod, there are no "spandrels" to find.
  *   *Recovery:* The Mission Card forces complexity ("Use all 10 pipe cleaners"). If they still fail to make it complex, *you* act as the "Developmental Constraint." During the reveal, point out: "The physics of the straw forced you to tape heavily here. That weight wasn't for stability, it was a by-product of the material."

  **Problem 2: Team Beta refuses to bet on Constraints.**
  *   *Risk:* The pricing makes Constraints look too risky. They lose all points on Function bets, then have no points for Constraints.
  *   *Recovery:* Mid-game intervention. "Market Correction: Due to new data, Constraint Wagers are now half-price for the next 5 minutes." This forces them to look for by-products.

  **Problem 3: The "Sibling Artifact" confuses everyone.**
  *   *Risk:* They argue endlessly about whether the other tower proves function.
  *   *Recovery:* Cut the debate. Reveal that the other tower had the *same Mission Card*. Use this to drive home the point: **Similarity does not prove Adaptation.** It might prove shared constraint.

  ### 9. Honest Limitation Note (For the Instructor)

  **What this game cannot reproduce:**
  The game has a **Teleological Core**. Team Alpha *had* a goal ("Build Tall"). In real biology, there is no goal, only differential reproduction.
  *   *How to state this in debrief:* "In our game, the 'Function' features were actually designed by me to be functional. In nature, nothing is designed. The Adaptationist error isn't just mistaking constraints for functions; it's assuming nature *tries* to optimize like Team Alpha did. Gould's point is that nature is a tinkerer, not an engineer. We simulated the Engineer's fallacy, but remember: Nature doesn't even have the Mission Card."

  **Why this setup lands:**
  It forces the students to *feel* the cognitive ease of the adaptationist story. It is much easier to say "The pipe cleaner is there to brace the leg" than to say "The pipe cleaner is there because the rules said I had to use it." That cognitive friction *is* the philosophical lesson.
