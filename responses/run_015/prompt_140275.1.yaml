prompt: |-
  You're a philosopher of biology who has taught this material a bunch of times and also designs a lot of in-class exercises. Please think carefully, brainstorm two or three quite different setups first, then commit to the one you think will actually land.

  The setting: 14 upper-division undergrads, philosophy of biology seminar, one 90-minute session. I want them to run into the Gould–Lewontin spandrels critique of adaptationism on their own — feel it — rather than get it from me. So: no mini-lecture up front, and I don't want the words "spandrel", "adaptationist", "Panglossian" or "exaptation" said out loud by anyone until the debrief.

  Rough idea, which you should feel free to throw out if you have better: everyone gets an identical kit (plastic straws, pipe cleaners, masking tape, one index card, no cutting allowed); half the room builds something under a secret constraint card I hand them (must stand unaided, must be at least 25 cm tall, must be assembled in one 6-minute pass with no going back and reworking anything, ect.); the other half then reverse-engineers a rival group's artifact, writes a "what is it for" story and a "what forced it to come out that way" story for each of about six listed features, and then bets points on which story is right. I want the payoff scheme rigged so that confident function-ascriptions are cheap and by-product claims are expensive — the adaptationist bias should show up as a number on the board, not as a claim I make.

  Then a round where teams can spend their remaining points to buy exactly one item off an evidence menu (a build log, a photo of a sibling artifact built from the same kit, the leftover inventory, or a test where I actually cut the feature off and see whether the thing still stands) — and it should turn out that some of those genuinely discriminate between the two stories and some only look like they do.

  Give me rules, materials and prep, a timeline with minute marks, a scoring sheet, and a debrief that maps specific moments in the game onto specific parts of the critique. Also: what predictably goes wrong the first time I run this and how I recover, and an honest note about which part of the real debate the game cannot reproduce and I'll just have to state in so many words.
