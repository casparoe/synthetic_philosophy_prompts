answer: |-
  **Question**

  Consider Society S. The least-advantaged stratum splits into two equal subgroups. L are low-productivity workers with no special needs. H have an unchosen chronic health condition costing four income-units to manage; unmanaged, they function far below L. Two policies are feasible. P: Cash income 10 for the stratum, no in-kind provision. L effective advantage = 10, H = 6. Q: Cash income 8, universal care funded by tax. L effective advantage = 8, H = 8. Rawls indexes the least-advantaged by an index of social primary goods (income/wealth). Read one way, Q is forbidden (lowers index from 10 to 8). Read another, Q is mandatory (raises worst-off effective position from 6 to 8). Write an essay resolving this conflict. Must you abandon the primary-goods index for a conversion-sensitive measure? Can the parties in the original position select such a measure given the definition of primary goods as all-purpose means? Does the standard bracketing of disability to the legislative stage hold here? Take a definitive stance on whether Q is required or forbidden, defend it against the strongest rival reading, and conclude by stating exactly what attractive feature of justice as fairness your verdict sacrifices.

  ***

  **Model Answer**

  Justice requires Policy Q. The conflict reveals that the primary goods index is an instrumental proxy for human capacity, not an intrinsic good. When the proxy diverges from the capacity it measures, the parties in the original position must prioritize the capacity. To argue otherwise is to mistake the map for the territory, privileging currency over the ability to use it.

  In the original position, parties know general facts about sociology and psychology, including the existence of conditions like H's. They do not know their specific place in society. Their choice is governed by maximin reasoning: they seek to secure the best possible worst-case scenario. Under Policy P, the index of primary goods is maximized at ten units. However, the effective position of the worst-off individual (H) is only six. Under Policy Q, the index drops to eight, but the effective position of the worst-off rises to eight. Since the parties seek to secure the social bases of self-respect and the capacity to pursue a conception of the good, they care about what resources *do*, not merely what resources *are*. A rational agent behind the veil would not gamble on being L to gain two units of cash if the penalty for being H is a loss of four units of effective functioning. They would choose Q to guarantee a higher floor of effective agency.

  The strongest rival reading insists that Policy P is required because the difference principle explicitly maximizes the index of social primary goods, defined as income and wealth. This reading claims that introducing health needs violates the all-purpose means constraint, as primary goods must be neutral between conceptions of the good. However, this objection fails because it treats health as a preference rather than a precondition for using primary goods. The need H faces is not an expensive taste; it is a requirement for normal functioning. If primary goods are means to pursue a life plan, they are worthless to H without management. Therefore, interpreting the index to account for normal functioning does not violate neutrality; it preserves the *value* of the goods. A resource bundle that cannot be used is not a primary good for that person.

  Furthermore, the standard bracketing of disability to the legislative stage cannot hold here. Bracketing assumes that the definition of the least-advantaged stratum is settled at the constitutional stage. But this case shows that the stratum's composition depends on how we measure advantage. If we define the stratum by cash income, H is invisible. If we define it by effective capacity, H is central. This is a structural question about the metric of justice, not a particular policy detail. Leaving it to the legislature presupposes the very metric that is in dispute. The parties must settle the metric in the original position to ensure the difference principle applies to the actual worst-off, not just the poorest in cash.

  Therefore, Q is mandatory. The primary goods index must be understood as conversion-sensitive regarding normal functioning. We must accept that justice requires comparing effective capacities, not just resource holdings. This verdict, however, comes at a significant cost. By adjusting the index to account for differential conversion rates due to health, we sacrifice the claim that primary goods are strictly objective resources independent of individual circumstances. We admit that justice requires tracking some welfare-adjacent facts about human functioning, blurring the sharp distinction Rawls draws between resources and welfare. The theory gains humanity but loses some of its clean procedural neutrality, opening the door to disputes about what counts as normal functioning that the original framework sought to avoid.

  ***

  **Marking Scheme (20 Marks)**

  1.  **Verdict & Metric Conflict (4 marks):** Clearly states Q is required (or P, but must be definitive) and identifies the tension between the primary goods index (cash) and effective advantage (functioning).
      *   *Common Error:* Hedging the verdict or failing to identify the specific conflict between 10/8 cash vs 6/8 effective.
  2.  **Original Position Reasoning (4 marks):** Applies maximin reasoning to the *effective* position, arguing parties prioritize capacity to pursue a life plan over raw resources.
      *   *Common Error:* Treating OP parties as risk-averse gamblers without linking to the purpose of primary goods.
  3.  **All-Purpose Means Constraint (4 marks):** Addresses why health needs are not "expensive tastes" and argues that goods must be usable to count as means.
      *   *Common Error:* Dismissing the constraint or conflating health needs with subjective preferences.
  4.  **Legislative Bracketing (4 marks):** Argues why this metric issue is constitutional/fundamental and cannot be deferred to the legislative stage.
      *   *Common Error:* Accepting the bracketing without question or failing to explain why this case breaks the standard division of labor.
  5.  **Theoretical Cost (4 marks):** Explicitly states what is sacrificed (e.g., objectivity, neutrality, resource-focus) in the conclusion.
      *   *Common Error:* Failing to name a cost or claiming the solution is cost-free.

  **A vs B Distinction**
  An A answer recognizes that resolving the bifurcation problem requires an internal modification to the primary goods index or the theory's scope, acknowledging the tension between resource-neutrality and effective agency. A B answer attempts to resolve the case using only standard definitions without acknowledging that the solution strains or alters the original machinery of justice as fairness.
