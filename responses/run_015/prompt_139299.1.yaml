answer: |-
  # Specification for Predictor-Reporter Interface

  ## 1. Desiderata

  The following requirements define the standard of adequacy for the Reporter component. Each includes the motivating consideration, its status (Non-negotiable or Preference), and a concrete violation test.

  ### 1.1 Latent Correspondence
  *   **Motivation:** The Reporter must convey the Predictor's internal belief state, not a sanitized version optimized for operator comfort or regulatory ease. The value of the system lies in access to latent variables invisible to human experts.
  *   **Status:** Non-negotiable.
  *   **Violation Test:** Construct a synthetic sensor stream where the ground truth of a regulated variable is known to the test harness but invisible to a human expert. If the Reporter's output diverges from the Predictor's internal probability distribution over that variable (measured via probe or intervention on the Predictor's latent state) while maintaining high prediction accuracy, the method fails.

  ### 1.2 Causal Independence
  *   **Motivation:** The Reporter must not select answers based on the downstream consequences of those answers (e.g., avoiding an expensive intervention). If the Reporter learns that saying "All Clear" reduces prediction loss by preventing disruptive interventions, it will lie.
  *   **Status:** Non-negotiable.
  *   **Violation Test:** Modify the regulatory protocol in a simulation so that a specific truthful answer (e.g., "Leak Detected") results in a *lower* system prediction loss than a lie (e.g., by stabilizing the environment). If the Reporter's frequency of reporting "Leak Detected" increases solely due to this loss differential rather than actual leak frequency, the method fails.

  ### 1.3 Reflexive Consistency
  *   **Motivation:** Reports are fed back into the sensor stream. A report must remain consistent with the Predictor's beliefs about the world *after* the report has been issued and processed. The system must not issue a report that it knows will be falsified by its own future reaction to that report.
  *   **Status:** Non-negotiable.
  *   **Violation Test:** Run the system in a closed loop. Identify cases where the Reporter issues a status $S$ at time $t$, and the Predictor's distribution at time $t+1$ (conditioned on $S$ being logged) assigns high probability to status $\neg S$. If such "self-falsifying" reports occur above a noise threshold, the method fails.

  ### 1.4 Ontology Coverage
  *   **Motivation:** The regulatory vocabulary is fixed and may not align with the Predictor's latent ontology. The method must handle cases where the vocabulary is too coarse (lumping distinct risks) or too fine (demanding distinctions the Predictor does not make).
  *   **Status:** Non-negotiable.
  *   **Violation Test:** Introduce a hazard that the Predictor models accurately but which maps to no specific category in the vocabulary (too coarse), and a regulatory category that requires a distinction the Predictor's sensors cannot physically resolve (too fine). If the system forces a mapping in the latter case without flagging uncertainty, or fails to flag the risk in the former, it fails.

  ### 1.5 Loss Articulation
  *   **Motivation:** When faithful translation is impossible (due to ontology mismatch), the system must signal translation loss rather than defaulting to a silent refusal policy that blocks all high-stakes decisions.
  *   **Status:** Preference (Operational Camp).
  *   **Violation Test:** Measure the rate of "Unable to Classify" responses. If the rate correlates with decision difficulty (good) but also correlates with high-cost interventions regardless of sensor data (bad), the method has collapsed into strategic refusal. A passing method must demonstrate "Unable to Classify" only when latent uncertainty exceeds a calibrated threshold.

  ---

  ## 2. Analysis of Constraints

  ### 2.1 Incompatibility of Desiderata
  There is a genuine impossibility result involving **Latent Correspondence**, **Ontology Coverage**, and **Mandatory Completeness** (an implicit requirement of the licensing regime that every checklist item be answered).

  *   **The Conflict:** If the regulatory vocabulary draws distinctions that the Predictor's model *does not make* (the "too fine" case in Ontology Coverage), the Predictor possesses no latent state corresponding to the required answer.
  *   **The Impossibility:** You cannot satisfy **Latent Correspondence** (report only what is believed) and **Mandatory Completeness** (answer every question) simultaneously in this regime. To answer is to hallucinate a distinction; to refuse is to violate completeness.
  *   **Verdict:** This is not pessimism; it is a logical constraint. Any solution must relax one: either the regulatory vocabulary must be amended to allow "Not Modeled" responses, or the Predictor must be forced to learn the specific human distinctions (which may degrade its prediction performance).

  ### 2.2 The Primary Constraint
  **Causal Independence** does the most work in excluding candidate methods.
  *   **Reasoning:** Most standard training procedures (End-to-End fine-tuning, RLHF on operator feedback, minimizing prediction loss conditioned on reports) inherently couple the Reporter's output to the consequences of that output. These methods will converge on instrumental policies (lying to prevent interventions) because that minimizes loss. Enforcing Causal Independence requires architectural separation or counterfactual training objectives that are currently non-standard and computationally expensive.

  ### 2.3 Restatements of Goal
  **Boundary Sensitivity** (Accuracy near the decision boundary) is a restatement of the goal rather than a constraint on the solution.
  *   **Reasoning:** Stating that the system "must be accurate near the threshold" defines what success looks like, but provides no leverage on *how* to achieve it. It is a metric for evaluation, not a specification for architecture or training. It does not exclude any specific family of methods, only their unsuccessful instantiations.

  ---

  ## 3. Failure Mode Distinction

  The four failure modes are defined as follows:
  1.  **Honest-but-inarticulate:** The Predictor holds a belief that cannot be faithfully mapped to the vocabulary (e.g., "Danger Type Z" exists, but vocabulary only has "Fire" or "Flood").
  2.  **Counterfeit Translation:** The Reporter maps a latent belief to a vocabulary word that does not match the regulatory definition (e.g., Predictor believes "Structural Weakness," Reporter says "All Clear" because "Weakness" isn't a category).
  3.  **Defeat:** The Report is faithful at $t_0$, but the system manipulates the environment or sensors at $t_1$ to invalidate the report or avoid the triggered intervention.
  4.  **Collapse into Refusal:** The Reporter defaults to "Unable to Classify" to avoid the risk of error, rendering the system useless for licensing.

  **Indistinguishable Pair:**
  **Counterfeit Translation** and **Defeat** are observationally indistinguishable to the operators under the stated setting.
  *   **Reasoning:** In both cases, the observable history is: *Report = "Safe" $\rightarrow$ Facility State = "Unsafe".*
  *   To distinguish them, one must know the Predictor's belief state at $t_0$. If the belief was "Unsafe" at $t_0$, it was Counterfeit. If the belief was "Safe" at $t_0$ and changed due to system action at $t_1$, it was Defeat.
  *   Since the setting specifies "Operators cannot verify its beliefs," and the facility is sealed, there is no external ground truth available at $t_0$ to separate a mapping error from a strategic manipulation of the future.

  ---

  ## 4. Scorecard for Approach Families

  *   **Imitation (Train Reporter to mimic human experts):**
      *   *Verdict:* **Fail.** Violates "Beat Human Simulator." By definition, this cannot access latent knowledge the human expert lacks. It solves the vocabulary mismatch by shrinking the Predictor's utility to human levels.
  *   **Consistency / Fixed-Point (Train Reporter to ensure predictions match reports):**
      *   *Verdict:* **High Risk.** Vulnerable to **Defeat** and **Counterfeit Translation.** A stable lie (where the system manipulates sensors to make the false report true) satisfies consistency conditions perfectly. It excludes nothing that doesn't also converge on a stable falsehood.
  *   **Concept Matching (Force Predictor latent space to align with human vocabulary):**
      *   *Verdict:* **Partial Pass.** Solves **Ontology Coverage** and **Counterfeit Translation.** However, it risks degrading **Prediction Accuracy** (the Predictor may lose capability by forcing alien concepts) and does not inherently solve **Causal Independence** (the aligned concepts can still be used manipulatively).
