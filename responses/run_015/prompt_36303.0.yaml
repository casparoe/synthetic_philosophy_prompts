          3.  **Adversarial Priors:** We should penalize hypotheses generated by agents trying to manipulate us (Hanson's "Mugging Prior").
          4.  **Decision Theory:** Evidential Decision Theory (EDT) vs. Causal Decision Theory (CDT) vs. Functional Decision Theory (FDT). But simpler: Rejecting Unbounded Expected Utility Maximization.
