  10. (Drafting content based on the above plan...) *Self-Correction during drafting:* Make sure to explicitly mention "Solomonoff Induction" or "Kolmogorov Complexity" regarding the prior shrinking faster than payoff grows. Make sure to distinguish between *risk* (known distribution) and *uncertainty* (unknown distribution/Knightian uncertainty).

