      *   *Adverse Selection/Moral Hazard:* Insurance = Risk pooling, screening. Mugging = Target selection based on gullibility. *Mismatch.*

  4.  **Analyzing the Disanalogies (The "Why it Matters" part):**

      *   *Epistemic Grounding:* Insurance probabilities are *frequentist* or *empirical Bayesian* (based on data). Mugging probabilities are *subjective* and *adversarial*. This is crucial. You can't just assign $1/10^{100}$ because the math looks nice; you need a prior justification.
