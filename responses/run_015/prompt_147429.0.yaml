  Consider the Homophonous Transplant. A heritage speaker uses an L1 slur-form with L2 neutral meaning before L1 speakers. Content-based views argue the utterance says something neutral, denying derogatoriness because the truth conditions lack group-targeting predicates. Expressivists argue no contempt is expressed, denying derogatoriness because the speaker lacks hateful attitudes. Both verdicts are wrong. The act violates L1 norms, making it derogatory regardless of intent. The speaker's ignorance mitigates offensiveness—uptake of flouting is unwarranted if ignorance is plausible—but not derogatoriness, which is act-relative. This case shows standard accounts fail to capture the normativity independent of mind. Case 1 is underdescribed regarding whether the audience knows the speaker's heritage; this determines warranted uptake, not derogatoriness.

  Next, Survival Without a Target. A slur for witches is used expletively where no one believes witches exist. Content views struggle: nothing is predicated of any group, so there is no derogatory content to embed or negate. If the term fails to refer, content-based accounts must claim the utterance is semantically empty, yet it retains its slur-status. Expressivists struggle: no attitude is held toward witches. Yet the word remains derogatory. On the norm view, the prohibition attaches to the form itself within the community, surviving the extinction of its descriptive application. The word is derogatory because its use is prohibited, not because it successfully describes or expresses hatred toward existing entities. This demonstrates that derogatory force persists without semantic application.

  Finally, Audience-Free Inscription. A speaker types the slur in a private diary. There is no audience, hence no uptake. Consequently, the inscription is not offensive. However, standard prohibition accounts often conflate derogatoriness with offensiveness, implying the word retains its "force" semantically even privately. The norm view clarifies: the act is derogatory (prohibited) but not offensive (no uptake). This distinguishes the property of the act from the reaction it provokes, resolving why embedding data varies: negation blocks offensiveness (uptake) but not necessarily derogatoriness (norm violation). Standard prohibition views fail here by lacking the resources to separate the norm violation from the audience reaction.

  A major objection concerns profanity: both slurs and swear words are prohibited. Why distinguish them? Profanity violates general decency norms; slurs violate specific norms protecting group dignity. A related worry involves reclamation: if a subgroup reclaims a slur, does the norm vanish? Norms are community-relative. Reclamation revises the norm for the in-group, permitting their use without derogatoriness. However, the out-group remains bound by the original prohibition until the community-wide norm shifts. Thus, an out-group speaker's use remains derogatory because they violate the prevailing norm applicable to them.

  Ultimately, separating derogatoriness from offensiveness dissolves the semantic-pragmatic stalemate. Content and expressivist views explain uptake conditions but fail to capture the normativity of the prohibition. Only a norm-relative account explains why ignorance or lack of target does not neutralize the slur's status, while audience absence neutralizes its offense.

