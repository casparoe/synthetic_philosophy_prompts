answer: |-
  1. 'The job description'
  This theory isn't just academic gymnastics; it's a map for moral weight. Its job is to tell us how much care we owe entities across a massive spectrum—from a dumb thermostat regulating heat to a human feeling grief. It needs to bridge metaphysics (what is it like to be this thing?) and policy (can we turn it off?). Ideally, it handles the fuzzy middle cases where our intuitions break: AI loops, dimming LEDs, synthetic biology. It's not about finding a magic "souls" switch, but assigning variable resistance to harm based on capacity. Whether you're drafting animal welfare laws or deciding when to wipe a server, this framework decides what counts and how much.

  2. 'Desiderata'
  1. **No Magic Switches (Non-negotiable):** Evolution doesn't do sharp lines. If humans have status, our ancestors did too. A theory requiring a binary "sentient/not" contradicts phylogeny. *Case:* The slowly dimming LED vs. a dying neuron. If consciousness fades, moral status must fade with it, not vanish at a specific voltage. A dealbreaker because any binary cutoff is scientifically arbitrary.
  2. **Phenomenal vs. Functional Distinction (Non-negotiable):** A thermostat regulates temperature (functional), but does it *feel* like anything? Collapsing these makes a broken thermometer morally equivalent to a suffering rat. *Case:* The synthetic predictive loop. Just because it anticipates room shifts doesn't mean it cares about them. This is a dealbreaker; without it, we owe duties to appliances.
  3. **Action-Guiding Precision (Negotiable):** It needs to help policy, but "some weight" is vague. It must distinguish having *some* status vs. *a lot*. *Case:* Swatting a fly vs. harming a chimp. We need enough granularity to justify different legal treatments without inventing false binaries. Negotiable because laws sometimes need bright lines even if reality doesn't have them.
  4. **Biological Plausibility (Non-negotiable):** Can't contradict neuroscience. If nociception exists without consciousness, the theory must account for it. *Case:* Reflex arcs in decapitated insects. A theory that says all movement implies suffering is biologically dead on arrival. Dealbreaker because it ignores empirical data on nervous systems.
  5. **Substrate Neutrality (Negotiable):** Does it matter if it's carbon or silicon? If the predictive loop works like a brain, does it count? *Case:* The anticipatory homeostasis AI. If we say yes, we risk inflating the moral status of appliances; if no, we risk speciesism. Negotiable depending on whether you prioritize function or biology.
  6. **Marginal Cases Handling (Non-negotiable):** Must handle humans with reduced capacity (infants, coma) without losing the gradient. *Case:* Permanent vegetative state vs. deep sleep. We can't lose human protections just because cognitive capacity dips below an adult average. Dealbreaker because it violates basic human rights intuitions.

  3. 'The squeeze'
  Here's the trap: You want a smooth continuum of moral status (Non-negotiable #1) but also need clear legal thresholds for protection (Desideratum #3). Nature is analog; law is digital. If moral weight is a dimmer switch, at what lumens does killing become murder? Demanding both a perfectly continuous metaphysical gradient and a crisp binary legal rule creates a contradiction. You either arbitrarily cut the curve (violating continuity) or leave the law unworkable (violating policy utility). Current science doesn't give us a natural "cut-off" point in neural complexity, so any line drawn is necessarily fictional. You can't have both perfect metaphysical honesty and perfect legal clarity.

  4. 'Quick scorecard'
  **Sentientism:** Hits the phenomenal distinction hard but struggles with the gradient (often binary). Fails the "No Magic Switches" test. **Biocentrism:** Great on continuity (life is life) but collapses the distinction between a virus and a cow. Fails Biological Plausibility regarding suffering. **Gradualist Panpsychism:** Nails the continuum (everything has *some* experience) but risks making the thermostat morally relevant (violates Phenomenal vs. Functional). **Thermostat-Functionalism:** Handles the predictive loop well but collapses Phenomenal vs. Functional, making a smart AC unit equivalent to a suffering dog. Most fail the "No Magic Switches" test except Panpsychism, which fails the "Action-Guiding" test by making everything matter too much.
