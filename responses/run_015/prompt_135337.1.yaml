      *   **Key Question:** If Dostoevsky saw modern algorithmic control (invisible, decentralized, comfort-based), how would he classify it?
      *   **Specific Tension:** Is it the same old human weakness (trading freedom for bread/security) with better UI, OR does the lack of an explicit authority (tyrant/church) break his argument?
