      *   *Refining Move 1:* Friend says Prude's preference is *incoherent*. This is wrong. Preferences are ordinal and subjective. As long as transitive, they are coherent in social choice theory. Friend is making a substantive normative claim.
      *   *Refining Move 3:* Friend says 3 people + pairwise voting avoids contradiction. This is wrong. Sen's paradox *creates* the cycle. Pairwise voting *reveals* the cycle. It doesn't avoid it. It just accepts indeterminacy.
      *   *Refining the "Missing" part:* The key is that Sen's paradox assumes rights are *absolute* constraints on the social function. In real democracy, rights are often negotiated or waived. Also, the distinction between the *existence* of a social ordering vs. the *selection* of an outcome.

  8.  **Final Review against constraints:**
