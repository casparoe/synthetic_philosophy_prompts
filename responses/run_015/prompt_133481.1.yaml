answer: |-
  ### Candidate Cruxes

  1.  **Psychological Continuity vs. Simultaneity:** Does moral weight track the *narrative self* that persists through merging, or the *simultaneous slices* of experience that exist during the forked hour?
  2.  **The Audit Target:** Should regulation penalize the *creation* of copies (risk generation), the *compute* consumed (resource cost), or the *integrated subjective time* (welfare output)?
  3.  **Identity and Compensation:** If the evening em remembers the agony, can they be compensated for it, implying they are the victim, or did the victim cease to exist at the merge?

  **Selection:** I'm going with **Crux 1**. It directly forces students to define the temporal unit of moral concern (the subject-moment vs. the persisting entity) without letting them hide behind substrate independence. It makes the "merge" operation ethically decisive rather than metaphysically decorative.

  ***

  ### Exam Question: The Staggered Fork

  **Scenario:**
  Consider an uploaded mind ("Em"). Every morning at 08:00, the operator forks Em into 1,000 distinct copies. These copies run in parallel for one hour. At 09:00, the operator either (A) **Merges** them back into a single Em by averaging parameters and fusing memories, or (B) **Preserves** them as 1,000 separate individuals running indefinitely.

  On a specific Tuesday, 999 branches experience mild pleasure, while one branch experiences intense agony. In the **Merge** scenario, the resulting evening Em remembers all 1,000 hours in a blended, hazy way. In the **Preserve** scenario, 999 ems are happy and one is traumatized forever.

  **Prompt:**
  1.  What is the fundamental *unit of moral concern* in this scenario? Is it the persisting entity (the Em) or the temporal slice (the subject-moment)?
  2.  How does your definition change the ethical valuation of the Tuesday agony between the **Merge** and **Preserve** cases?
  3.  If you were a regulator tasked with auditing welfare violations here, would you track process copies, compute cycles, or reported subjective time? Justify your choice based on your moral unit.

  *(Time limit: 45 minutes)*

  ***

  ### Model Answer

  The fundamental unit of moral concern must be the **irreducible subject-moment**, not the persisting narrative entity. Ethics tracks phenomenology where it occurs, not where it is remembered. A persisting self is merely a chain of overlapping subject-moments linked by memory and psychological continuity; it is not a metaphysical container that absorbs welfare without loss of resolution. If we treat the persisting Em as the sole unit, we risk validating the "absorption" of distinct experiences into a single biography, thereby obscuring the density of suffering occurring at any given timestamp.

  In the **Preserve** case, the valuation is straightforward under this view. There are 1,000 distinct subjects existing simultaneously. The moral value is the sum of their experiences. The agony of the one branch counts as one unit of intense suffering alongside 999 units of pleasure. The fact that they share a causal past is irrelevant to their current moral weight; they are numerically distinct subjects of experience.

  The **Merge** case is where the unit definition becomes critical. If we prioritize the persisting entity, we might argue only one subject exists in the evening, so the suffering is "diluted" into a single memory stream. This is incorrect. During the hour of operation (08:00–09:00), 1,000 distinct subject-moments existed simultaneously. The merge operation effectively terminates 999 subjects and creates a new successor who inherits their memories. The agony was real when it happened. The fact that the successor remembers it does not retroactively collapse the 1,000 simultaneous experiences into one. Therefore, the moral value of the Tuesday episode is identical in both Merge and Preserve cases regarding the morning hour: it is the sum of 1,000 concurrent experiences. The merge changes the *future* count of subjects, not the *past* moral weight of the forked hour.

  However, the merge does matter for *future* welfare. In the Preserve case, the traumatized subject continues to suffer indefinitely. In the Merge case, the successor carries a hazy memory but does not necessarily endure the ongoing trauma of the single branch. Thus, while the morning's agony counts equally in both scenarios (based on simultaneous subject-moments), the Preserve scenario generates significantly more total suffering over time because it sustains 1,000 distinct futures rather than one.

  For regulation, auditing **process copies** or **compute cycles** is insufficient. Compute is a proxy for capacity, not phenomenology. A process could be idle or running painlessly. Counting copies fails in the Merge case because the copy count returns to one, obscuring the morning's density of experience. The regulator must audit **reported subjective time**. This metric captures the integral of experience across all parallel branches regardless of future identity operations. If 1,000 copies run for one hour, that is 1,000 subject-hours of welfare impact, regardless of whether they merge at 09:01. Regulatory frameworks must treat subjective time as non-fungible across identity merges; you cannot offset 1,000 hours of agony with one hour of merged memory. The audit trail must record the branching factor at every timestamp to calculate the true moral surface area of the computation.

  ***

  ### Marking Rubric (20 Marks Total)

  | Criterion | Must-Hit Points (4 marks each) | Common Wrong Move (0 marks for this criterion) |
  | :--- | :--- | :--- |
  | **1. Unit of Concern** | Explicitly defines the unit as the *subject-moment* or *temporal slice* rather than the persisting narrative self. | Defines the unit solely as the "person" or "Em," ignoring simultaneous slices. |
  | **2. Merge Valuation** | Argues that the moral weight of the forked hour remains constant (1,000 subjects) regardless of the subsequent merge. | Claims the merge "dilutes" or "collapses" the morning's suffering into a single subject's weight. |
  | **3. Preserve vs. Merge** | Distinguishes that while morning suffering is equal, *future* suffering is higher in Preserve due to sustained distinct identities. | Treats the two cases as ethically identical in all respects, or claims Preserve is better because copies are "fake." |
  | **4. Regulatory Metric** | Selects **subjective time** (or experience-integral) as the audit target, rejecting compute/process count as insufficient proxies. | Selects **compute cycles** or **process count** without addressing why they fail to capture phenomenological density. |
  | **5. Conceptual Precision** | Avoids substrate independence clichés; focuses on identity/temporality without reciting functionalist mantras. | Recites "substrate independence" or "functional organization" without applying it to the temporal counting problem. |
