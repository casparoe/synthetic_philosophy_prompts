  # The Harsanyi Disagreement Tree

  This tree is designed to isolate exactly where your reading group diverges. It avoids abstract axioms (like "Pareto" or "Independence") and instead forces choices between concrete scenarios. Follow the path that matches your intuitions.

  ### **Node 1: The Risk-Distribution Trade-off**
  **Scenario:** Alice is well-off (100 utils). Bob is badly-off (10 utils). There is one kidney transplant available (+90 utils).
  *   **Option A:** Give the kidney to **Bob**. (Outcome: Alice 100, Bob 100).
  *   **Option B:** Flip a **Fair Coin**. Heads Alice gets it, Tails Bob gets it. (Expected Outcome: Alice 100, Bob 100).

  *   **Choice A (Prefer Certain Bob):** You prioritize the final distribution over ex-ante fairness/linearity. → **Go to Node 2.**
  *   **Choice B (Indifferent / Prefer Coin):** You accept that social choice should be linear in probabilities (vNM rationality). → **Go to Node 5.**

  ---

  ### **Node 2: The Diamond Case (Ex Ante vs. Ex Post)**
  **Scenario:** Alice and Bob both need a kidney equally to survive. There is only one kidney.
  *   **Option A:** **Fair Coin.** Each has a 50% chance of living. (Ex-ante equality).
  *   **Option B:** **Give to Either.** One certainly lives, one certainly dies. (Ex-post inequality, but same ex-ante odds as coin if randomized beforehand, but here we compare the *value* of the chance).
  *   *Clarification:* Do you think the Coin Flip is *strictly better* than a deterministic allocation because it gives them equal chances, even if the outcome is the same?

  *   **Choice A (Coin is Better):** You value equal chances independently of outcomes. → **Leaf 1: Ex Ante Prioritarianism.**
  *   **Choice B (Indifferent / Certain is Better):** You only care about the final distribution of welfare, not the chances themselves. → **Go to Node 3.**

  ---

  ### **Node 3: The Limit of Priority**
  **Scenario:** You must choose between two certain worlds.
  *   **Option A:** The worst-off person gets a **microscopic benefit** (+0.001 utils). Everyone else gets nothing.
  *   **Option B:** The best-off person gets a **massive benefit** (+1,000,000 utils). Everyone else gets nothing.

  *   **Choice A (Microscopic Benefit):** No amount of gain for the rich outweighs any gain for the poor. → **Leaf 2: Leximin / Maximin.**
  *   **Choice B (Massive Benefit):** Trade-offs are allowed; priority to the worse-off is not absolute. → **Leaf 3: Ex Post Prioritarianism.**

  ---

  ### **Node 4: (Empty Cell Check)**
  *   *Note:* If you chose **Node 1: Choice B** (Linear) but found yourself wanting **Node 3: Choice A** (Leximin), stop. This combination is **incoherent**. Leximin requires non-linearity in welfare; you cannot be risk-neutral over lotteries (Node 1) and leximin over certainties (Node 3) without violating basic consistency axioms.

  ---

  ### **Node 5: The Meta-Interpretation**
  **Scenario:** You have accepted the linear formula $W = \sum a_i U_i$. What does this formula *mean*?
  *   **Option A:** "I am aggregating the **distinct moral claims** of multiple people."
  *   **Option B:** "I am modeling the preferences of a **single rational observer** who doesn't know which person they will be."

  *   **Choice A (Distinct Claims):** You believe in objective social aggregation. → **Go to Node 6.**
  *   **Choice B (Single Observer):** You think Harsanyi's theorem is just about individual rationality under ignorance. → **Leaf 4: Meta-Position (Representation Theorem).**

  ---

  ### **Node 6: The Work of Weights**
  **Scenario:** We have normalized everyone's utility scale (0 = Death, 100 = Bliss). We must set the coefficients $a_i$ in the sum.
  *   **Option A:** "The coefficients are **conversion factors**. They ensure '100' means the same for Alice and Bob. Once converted, everyone must count equally ($a_i = 1$)."
  *   **Option B:** "The scales are already comparable. The coefficients represent **moral weight**. We can choose to value Alice's utils more than Bob's ($a_i \neq a_j$)."

  *   **Choice A (Conversion/Equality):** You are a Standard Utilitarian. → **Go to Node 7.**
  *   **Choice B (Moral Weight):** You think the theorem allows for arbitrary weighting. → **Go to Node 8.**

  ---

  ### **Node 7: Symmetry of Welfare**
  **Scenario:** Comparing pain relief to pleasure creation.
  *   **Option A:** "1 unit of pain relief is **morally equivalent** to 1 unit of pleasure creation."
  *   **Option B:** "Pain relief is **lexically or significantly more important** than pleasure creation."

  *   **Choice A (Symmetric):** Standard Hedonic Utilitarianism. → **Go to Node 9.**
  *   **Choice B (Asymmetric):** You prioritize the reduction of suffering. → **Go to Node 10.**

  ---

  ### **Node 8: Free Parameters & Population**
  **Scenario:** You accept weights are free moral parameters. Can the population size change?
  *   **Option A:** "Yes, we can compare worlds with **different numbers of people**."
  *   **Option B:** "No, the theory only applies to **fixed populations**."

  *   **Choice A (Variable):** → **Leaf 5: Weighted Sum (Variable Population).**
  *   **Choice B (Fixed):** → **Leaf 6: Weighted Sum (Fixed Population).**

  ---

  ### **Node 9: Population Ethics (Standard Util)**
  **Scenario:** World A has 1 million people at 90 utils. World B has 1 billion people at 89 utils.
  *   **Option A:** **World A is better.** (Higher Average).
  *   **Option B:** **World B is better.** (Higher Total).

  *   **Choice A:** → **Leaf 7: Average Utilitarianism.**
  *   **Choice B:** → **Leaf 8: Total Utilitarianism.**
  *   *(Note: If you insist population cannot vary, you land on **Leaf 9: Fixed Population Utilitarianism**, where Average and Total are identical.)*

  ---

  ### **Node 10: Negative Utilitarianism Type**
  **Scenario:** Is pleasure morally irrelevant, or just less important?
  *   **Option A:** "Pleasure has **no positive moral value**, only pain has negative value."
  *   **Option B:** "Pleasure matters, but **pain trumps it** above a certain threshold."

  *   **Choice A:** → **Leaf 10: Pure Negative Utilitarianism.**
  *   **Choice B:** → **Leaf 11: Lexical Threshold Utilitarianism.**

  ---

  ### **Summary of Leaves**
  1.  **Ex Ante Prioritarianism** (Values equal chances).
  2.  **Leximin / Maximin** (Absolute priority to worst-off).
  3.  **Ex Post Prioritarianism** (Priority to worst-off outcomes, trade-offs allowed).
  4.  **Meta-Position** (Harsanyi is about single-observer rationality, not aggregation).
  5.  **Weighted Sum (Variable)** (Weights are free parameters, population varies).
  6.  **Weighted Sum (Fixed)** (Weights are free parameters, population fixed).
  7.  **Average Utilitarianism** (Equal weights, variable pop, maximize average).
  8.  **Total Utilitarianism** (Equal weights, variable pop, maximize sum).
  9.  **Fixed Population Utilitarianism** (Equal weights, fixed pop). **(See Limitation Below)**.
  10. **Pure Negative Utilitarianism** (Only pain counts).
  11. **Lexical Threshold Utilitarianism** (Pain trumps pleasure).

  ### **Limitations & Empty Cells**
  *   **Unseparable Leaves:** **Leaf 7 (Average Util)** and **Leaf 8 (Total Util)** collapse into **Leaf 9 (Fixed Population Util)** if you answer "No" to variable population at Node 9. The tree cannot distinguish Average vs. Total Utilitarianism for someone who believes population size is fixed; they are the same mathematical view in that domain.
  *   **Incoherent Cell:** As noted at Node 4, accepting Linearity (Node 1) but demanding Leximin (Node 3) is mathematically inconsistent under vNM expectations.
  *   **Unexplored:** **Leaf 5 & 6 (Weighted Sum)** are rarely defended as a *moral* truth (usually they are seen as a political compromise), but the tree accommodates them as a logical possibility of the theorem.

  ---

  ### **Walkthrough: The Hypothetical Participant**
  **Profile:**
  1.  **Takes the lottery in every risk case.** (Node 1: Choice B → Linear Branch).
  2.  **Says giving the benefit to the worse-off person is better whenever there's no uncertainty involved.** (Implies they want Priority in certainty, but accepted Linearity in risk).
  3.  **Wants equal weights.** (Node 6: Choice A).

  **Path:**
  1.  **Node 1:** Chooses **Coin/Indifferent**. (Goes to Linear Branch).
      *   *Tension Note:* This participant claims they prefer helping the worse-off in certainty, but in Node 1, helping the worse-off (Certain Bob) was pitted against a Coin Flip with equal Expected Value. By choosing the Coin/Indifference, they effectively *rejected* prioritizing the worse-off in this specific risk case. They are consistent with vNM, but their "certainty preference" must be modeled differently.
  2.  **Node 5:** Likely chooses **Distinct Claims** (Assuming they want to aggregate, not just imagine).
  3.  **Node 6:** Chooses **Conversion/Equality** (Wants equal weights).
  4.  **Node 7:** (Assume Symmetric for standard case).
  5.  **Node 9:** (Depends on population view).

  **Result:** They land on **Leaf 7, 8, or 9 (Utilitarianism)**.

  **Defensibility Check:**
  Is this a defensible spot? **Yes, but with a caveat.**
  This person is a **Standard Utilitarian** who experiences a psychological tug toward Prioritarianism in certainty cases but accepts the mathematical force of Harsanyi's theorem (Linearity) in risk cases.
  *   **The Conflict:** Their intuition ("help the worse-off in certainty") is actually captured by Utilitarianism *if* marginal utility of resources is diminishing. If Bob is poor, $100 gives him more utils than Alice. Utilitarianism *does* give the kidney to Bob in certainty cases because $U_B(100) > U_A(100)$.
  *   **The Resolution:** The participant might be confusing *resources* with *utils*. Harsanyi's theorem sums *utils*. If they mean "Help the person with lower *utility*," then Utilitarianism is indifferent between Certain Bob and Coin (Node 1). If they mean "Help the person with fewer *resources*," Utilitarianism agrees with them in certainty, but demands linearity in risk (Node 1).
  *   **Verdict:** They are in a defensible spot (Standard Utilitarianism), provided they clarify that their "priority for the worse-off" is driven by diminishing marginal utility of resources, not a non-linear social welfare function. If they insist on non-linearity in certainty *and* linearity in risk, they are in the **Incoherent Cell** (Node 4).
