answer: |-
  To build an annotation scheme that survives contact with actual dialogue data, your underlying theory of emotion must be operationally robust, not metaphysically pure. You are coding *claims* and *cues*, not neural states. Therefore, the desiderata below prioritize **annotatability** (can two people agree on this label?) and **coverage** (does this label fit the weird data?) over philosophical consistency.

  Here are the five core desiderata, the tensions between them, and the evaluation of current theoretical camps.

  ### Desiderata for an Annotation-Ready Theory

  **1. The Tripartite Separation Requirement**
  *   **The Requirement:** The theory must structurally distinguish between the *internal state* (having), the *phenomenal awareness* (feeling/reporting), and the *external signal* (expressing).
  *   **Concrete Case:** A speaker says "I'm not angry" while slamming a cup (Denial vs. Cues).
  *   **Why:** If a theory collapses these (e.g., behaviorism says emotion *is* the slam; introspectionism says emotion *is* the report), you cannot annotate the gap. In dialogue, the gap is where the pragmatics live (irony, repression, politeness). You need a schema that allows `State: Angry`, `Report: Not Angry`, `Expression: Angry`.
  *   **Status:** **Non-negotiable.** Without this, you cannot code deception or self-deception.

  **2. Ontological Independence of the Intentional Object**
  *   **The Requirement:** The existence or truth-value of the emotion's object cannot determine the existence of the emotion.
  *   **Concrete Case:** Fear of the "intruder" that turns out to be the cat; being moved by a movie scene known to be staged.
  *   **Why:** Annotators work from the transcript and context available *at the time of the utterance*. They cannot verify reality. If the theory requires the object to be real (factive), you cannot label the fear until the plot twist is revealed, breaking temporal alignment in your data.
  *   **Status:** **Non-negotiable.** Dialogue is often about subjective reality, not objective truth.

  **3. Non-Agent Attribution Capacity**
  *   **The Requirement:** The theory must allow emotion predicates to be meaningfully applied to entities without confirmed internal states or biology.
  *   **Concrete Case:** "The chatbot seemed annoyed" or "My dead father would be proud."
  *   **Why:** In dialogue, users attribute emotion to systems and absent others constantly. If your theory requires a biological substrate (somatic) or a functioning mind (judgment), these utterances become "errors" rather than data points. For NLP, the *attribution* is the signal, regardless of the target's ontology.
  *   **Status:** **Camp Commitment.** Strict biological/somatic theories reject this. For annotation utility, it is non-negotiable; for metaphysical truth, it is contested.

  **4. Temporal Granularity (Occurrent vs. Standing)**
  *   **The Requirement:** The theory must distinguish between a transient episode and a dispositional trait.
  *   **Concrete Case:** "I hate him" (standing) vs. "I'm furious right now" (occurrent).
  *   **Why:** Annotation windows differ. A standing emotion spans the whole dialogue; an occurrent one spans a turn. Collapsing these creates label noise. "Hate" might predict long-term behavior, "Fury" predicts immediate interruption.
  *   **Status:** **Non-negotiable.** Essential for sequence modeling and context windows.

  **5. Label Plurality (Underdetermination)**
  *   **The Requirement:** The theory must allow a single physiological/contextual episode to validly map to multiple distinct emotion labels depending on framing.
  *   **Concrete Case:** An episode reported as Grief by one participant and Relief by another (e.g., death of a burdensome caregiver).
  *   **Why:** Emotions are often retrospectively constructed. If your theory demands a one-to-one mapping between cause and label, you force annotators to choose a "true" label where none exists. You need to capture the *conflict* as data.
  *   **Status:** **Camp Commitment.** Basic emotion theories (Ekman etc.) resist this; constructionist views accept it.

  ---

  ### Incompatible Desiderata (The Trade-offs)

  You cannot satisfy all operational constraints simultaneously. Here are the two critical tensions you must manage in your guidelines:

  **Tension A: Subjective Authority vs. Observable Validity**
  *   **Conflict:** Desideratum 1 (Tripartite Separation) implies the speaker can be wrong about their state. However, in dialogue analysis, the speaker's report is often treated as the pragmatic ground truth for *their* reality.
  *   **The Problem:** If you prioritize **Observable Validity** (coding the slam as anger), you override the speaker's agency. If you prioritize **Subjective Authority** (coding "not angry" as not angry), you lose the subtext.
  *   **Resolution:** You cannot meet both as "Truth." You must code them as separate layers (e.g., `Self-Report` layer vs. `Observer-Inference` layer). A theory that claims one is the *real* emotion will break your schema.

  **Tension B: Object Specificity vs. Atmospheric Coverage**
  *   **Conflict:** Desideratum 2 (Object Independence) allows for objectless states (the chord progression dread). However, standard emotion taxonomies rely on objects to distinguish emotions (Fear *of* X vs. Anxiety).
  *   **The Problem:** If you allow objectless "dread," it bleeds into "Mood." If you demand an object, you cannot code the aesthetic reaction.
  *   **Resolution:** You must allow a `Null-Object` flag. Theories that define emotion *by* its intentional object will fail here.

  ---

  ### Theoretical Evaluation

  Here is how the three major camps fare against the list above.

  **1. The Judgment (Cognitive Appraisal) View**
  *   *Core Claim:* Emotions are judgments or evaluations about the world.
  *   *Performance:*
      *   **Passes:** Temporal Granularity, Label Plurality (different appraisals yield different labels).
      *   **Fails:** **Ontological Independence.** This is the fatal flaw. If emotion is a judgment that "X is dangerous," and the subject knows X is fake (the movie) or X doesn't exist (the cat), the judgment is false. Strict judgment theories struggle to explain why the emotion persists despite the false judgment.
      *   **Fails:** Non-Agent Attribution. You cannot judge a chatbot as having internal evaluations without heavy metaphorical lifting.
  *   *Verdict:* High precision on cause, low coverage on fiction and attribution.

  **2. The Perceptual / Attitudinal View**
  *   *Core Claim:* Emotions are perceptions of value or attitudes toward objects (like seeing-as).
  *   *Performance:*
      *   **Passes:** Ontological Independence (you can have an illusion of perception, like a visual illusion, without the object being real). Handles the "staged movie" case well.
      *   **Fails:** **Tripartite Separation.** If emotion is a perception of one's own state or the world, self-deception ("I'm not angry") becomes a perceptual error. While possible, it makes the "Denial" case hard to model without accusing the speaker of blindness.
      *   **Mixed:** Non-Agent Attribution. Easier than judgment, but still requires the annotator to impute an attitude to a bot.
  *   *Verdict:* Best balance for fiction/aesthetic cases, struggles with self-report denial.

  **3. The Feeling / Somatic View**
  *   *Core Claim:* Emotions are perceptions of bodily changes or raw feels.
  *   *Performance:*
      *   **Passes:** Tripartite Separation (you can feel a sensation and deny its label). Handles the "Denial" case easily (the body reacts, the mouth denies).
      *   **Passes:** Ontological Independence (the body reacts to the noise regardless of the cat).
      *   **Fails:** **Label Plurality / Specificity.** Somatic profiles for Grief and Relief are often indistinguishable (tears, chest tightness). Without cognitive context, the theory cannot distinguish the two labels for the same episode.
      *   **Fails:** Non-Agent Attribution. Chatbots do not have bodies. To code "The bot is angry," you must treat the text as a body, which stretches the theory.
  *   *Verdict:* Best for denial and physiological cues, worst for distinguishing specific semantic labels.

  ---

  ### The Killer Requirement

  The single requirement that kills the most candidates is **Ontological Independence of the Intentional Object** (Desideratum 2).

  **Why:**
  This requirement forces the theory to decouple the emotion from the truth conditions of the world.
  1.  **It kills strict Judgment Theories:** They dominate computational linguistics (appraisal models). They define emotion via evaluation. If the evaluation is factually wrong (the intruder is a cat), strict versions say the emotion is irrational or non-existent. You cannot annotate "Fear" if the theory says "No danger = No Fear."
  2.  **It pressures Perceptual Theories:** They must explain how one perceives value in something known to be valueless (the staged movie).
  3.  **It bypasses Somatic Theories:** They don't care about objects, but they lose the *intentionality* required to distinguish fear-of-cat from fear-of-spider in your schema.

  For your purpose, you must treat the **speaker's commitment to the object** as sufficient, regardless of the object's reality. Any theory that requires the annotator to verify the *world* to label the *emotion* is unusable for dialogue. You are annotating the *stance*, not the situation.
