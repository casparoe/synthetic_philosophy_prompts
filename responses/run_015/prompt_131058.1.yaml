answer: |-
  1. Brainstorm / theory check
  Three rival theories clash here. First, Civic Republicanism: voting is a duty to the state, justifying fines for absence and ensuring collective legitimacy. Second, Liberal Expressivism: voting is an authentic articulation of individual will, suggesting parties shouldn't dictate rankings and compulsion violates autonomy. Third, Pragmatic Instrumentalism: voting is a tool to secure the best outcome, legitimizing "lesser evil" strategies and copying party cards to maximize utility. The tension is sharp: how can a vote be a civic duty if the content is outsourced? How can it be expressive if you're forced to rank candidates you dislike? The system forces participation but permits delegation, creating a gap between the *act* (mandatory) and the *intent* (optional). This suggests the system values the *appearance* of universal consent over the *reality* of individual autonomy.

  2. The practice in concrete terms
  Australian federal elections mandate both attendance and a complete ranking of candidates. You get fined for staying home, and your ballot is invalid if you don't number every box. Yet, parties distribute how-to-vote cards outside booths, instructing voters on exactly how to flow preferences. Legally, the ballot counts as your personal order, regardless of whether you copied a card. Public discourse accepts strategic voting, where you might rank a disliked candidate higher to block a worse outcome. The system treats the vote as an individual legal act that can be socially coordinated.

  3. The implicit philosophy reconstructed
  The implicit philosophy is a hybrid of "Mandated Participation" and "Permitted Delegation." It presupposes that civic duty lies in the *act* of engaging with the system, not necessarily in the independent formation of every preference. By forcing a full ranking, the system assumes every voter has a coherent order, even if that order is borrowed. This treats voting less as moral expression and more as system maintenance. The duty is to produce a valid ballot that contributes to a majority mandate, not to express authentic soul-searching. Strategic voting is tolerated because the system values stable outcomes over pure intent. Essentially, the state says: "You must play the game, and you must finish the scorecard, but we don't care if you copy the coach's playbook." This resolves the tension by separating the obligation to participate from the autonomy of choice. The voter is responsible for showing up and validating the process, while parties are responsible for structuring the choices. It's a division of labor disguised as individual responsibility. The system assumes that aggregate stability matters more than individual authenticity. It treats the ballot as a technical instrument for government formation rather than a sacred expression of conscience. Consequently, voter responsibility is procedural: follow the rules, number the boxes, and accept the fine if you don't. The moral weight is shifted from the voter's internal state to the external validity of the count. When people talk about the "lesser evil," they acknowledge this instrumentalism. They admit the vote isn't about love for a candidate, but about managing outcomes. The system accommodates this cynicism without collapsing, proving its theory is about resilience, not purity.

  4. What's strictly required vs what's just compatible
  Strictly required is the compulsion to attend and the compulsion to rank all candidates. These are hard presuppositions needed to ensure high turnout and decisive majority outcomes without needing runoff elections. What's merely compatible is the idea that the ranking reflects your genuine soul. The law doesn't police thought, so delegating your ranking to a party card is legally invisible. The fine is compatible with delegation because it punishes absence, not unoriginality. The "expressive" story—that this is *your* voice—is a convenient fiction that legitimizes the count. The "strategic" story—that you're maximizing utility—is compatible but not required; you can vote sincerely. The system only demands the *form* of preference, not the *source*. This allows the system to claim democratic legitimacy from high turnout while accommodating voter apathy or confusion through party guidance.

  5. What breaks if we swap the view
  If we switched to a Pure Expressive view, we'd need to abolish compulsory voting and compulsory ranking. We might also ban how-to-vote cards near booths to prevent "contamination" of individual will. The law would need to protect the authenticity of the ballot, perhaps allowing "none of the above" or incomplete ballots. If we switched to a Pure Strategic view, we'd formalize the delegation. We'd move to party-list voting where you vote for a platform, not a candidate order. Preferences would be binding contracts managed by parties, not individual choices. The current system breaks under Pure Expressivism because compulsion violates autonomy. It breaks under Pure Instrumentalism because individual ranking is inefficient compared to party blocks. The current hybrid survives by ignoring the philosophical contradiction.

  6. Bottom line
  The practice has a pragmatically coherent theory, but it's philosophically underdetermined. It prioritizes institutional stability over conceptual purity. It works because it treats voting as a public utility rather than a sacred right. The implicit theory is "Procedural Legitimacy": as long as everyone plays by the rules, the outcome counts, regardless of internal motivation. It's not a bug; it's a feature that allows diverse motivations to coexist within a stable framework.
