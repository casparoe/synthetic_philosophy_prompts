prompt: |-
  hey, act like a professional political philosopher who reads election rules, not just textbooks. before you answer, do a quick brainstorm: list three rival theories that could explain the practice i'm about to describe, flag any internal tension, and only then build your reconstruction. think carefully and don't rush to one interpretation.

  here's what's bugging me. in australia federal elections are compulsory, and you have to rank every candidate in preferntial order. but parties hand out "how-to-vote" cards at polling booths telling you exactly how to number the ballot so your preferences flow their way. meanwhile the election rules treat your vote as an expression of your own preference order, not the party's, and there's no legal category of a "strategic vote" — you just submit your ranking. at the same time, if you think every candidate is bad and rank them all, but put the least-bad one second, your vote can flow to them after your first is eliminated. the system fines you for not showing up, but also lets you effectively outsorce your ranking to a party card. and in public debate people constantly talk about voting for the lesser evil in preference distributions.

  what philosophical commitments about voting does this whole setup presuppose? does it treat voting as a civic duty, an expressive act, a strategic tool, or some hybrid that doesn't hang together? reconstruct the implicit theory of voter responsibility and expression. then tell me which parts of that theory are actually required by the practice and which are just convenient stories we tell — for example, is the duty-to-vote fine compatible with letting people delegate their ranking? and say what would have to change in the law if we replaced the implicit view with a purely expressive or purely strategic one.

  structure your response like this:

  1. Brainstorm / theory check (around 150 words): list rival explanations and flag inconsistencies in the practice.
  2. The practice in concrete terms (around 100 words): restate the institutional details i mentioned in your own words so we're aligned.
  3. The implicit philosophy reconstructed (around 300 words): what view of duty, expression, and strategic choice does the practice presuppose?
  4. What's strictly required vs what's just compatible (around 200 words): distinguish hard presuppositions from loose fits.
  5. What breaks if we swap the view (around 200 words): concrete legal or institutional changes needed if we went pure-expressive or pure-strategic.
  6. Bottom line (around 100 words): does the practice have a coherent implicit theory, or is it philosophically underdetermined?

  keep it casual but precise. no bibliography needed — just reason it out from the practice itself. don't quote any election statutes verbatim; paraphrase the rules instead. if you mention "how-to-vote" cards or preference flows, treat them as common institutional terms, not quoted legal language.
