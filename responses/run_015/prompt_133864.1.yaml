  2. Since defense comes in degrees with no cutoff, are you committed to saying a thermostat has a nonzero sliver of moral status, and does that invite the aggregation fanaticism critics tease longtermists about? If she argues the weight is vanishingly small and doesn't blow up, press her on the mathematical principle that prevents a trillion thermostats from outweighing a single human.
  3. Imagine a system engineered to feel suffering but whose regulatory machinery is shaped to be stoical about it; on your view, does that pain stop mattering morally? If she retreats to saying defense is only a symptom of whatever really matters, ask her to name that underlying property and explain whether her criterion is then doing any work at all.
  4. Even with humans we only infer defense from counterfactual robustness and resource allocation, so for a system trained to imitate self-report, what observation could distinguish real defense from performed defense? If she replies that we should ablate it and watch what the system does to get it back, ask how she rules out a system trained to mimic recovery behaviors without actual internal valuation.
  5. What specific empirical finding or conceptual contradiction would actually make you drop the defended-computation view entirely? If she offers a vague philosophical adjustment, press her for a concrete dealbreaker that would force her to accept moral status in a system that defends nothing or deny it in one that defends everything.
