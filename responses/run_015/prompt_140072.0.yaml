answer: |-
  **MEMORANDUM**

  **TO:** Governance Committee, Supplemental Retirement Plan
  **FROM:** [Your Name], Member-Elected Trustee
  **DATE:** Wednesday, [Date]
  **SUBJECT:** Recommendation on Trading Frequency and Fee Structure

  **BOTTOM LINE**
  I recommend we **offer enrollment-time self-binding instead of Cooldown+, and cap annual switch fees per account.** We should direct staff to negotiate this with the recordkeeper by Friday, with implementation targeted for January 1.

  **THE PROBLEM**
  We have a group of participants ("round-trippers") who trade frequently, end up where they started, and lose money to switch fees. About 7% of participants do this. Meanwhile, the plan collects those fees and redistributes them as a flat $18 credit. This means active traders subsidize passive ones.

  The Finance Trustee is right: this is a money pump. Participants lose net wealth.
  The Benefits Trustee is right: we collect the fees. Restricting trading while profiting from it creates a conflict of interest.

  **WHY NOT COOLDOWN+**
  The recordkeeper's proposal (Cooldown+) locks accounts for 21 days unless a fee is paid. This fee doubles with each override.

  1.  **It monetizes restraint.** Charging people extra to access their own money because they lack self-control is ethically difficult to defend. It turns a fiduciary protection into a revenue stream.
  2.  **It doesn't solve the conflict.** We still collect the override fees. The plan still profits from the participant's inability to stop trading.
  3.  **It is paternalistic.** It assumes we know better than the participant when they can access their funds.

  **WHY SELF-BINDING (WITH CONDITIONS)**
  Some participants have told us they want to be stopped but cannot stop themselves. Offering a voluntary lock at enrollment respects their autonomy while providing the help they requested.

  However, two conditions are non-negotiable:
  1.  **It must be free.** The recordkeeper has indicated they want to charge for this feature. We cannot approve a system where participants pay us for the privilege of not paying us. That is the "step where they pay us so they can stop paying us" that the Benefits Trustee flagged.
  2.  **There must be a hardship release.** In last year's pilot, 61 people demanded release. Some claimed they weren't in their right mind; others simply changed their minds. We need a clear, human-reviewed process for emergency access (e.g., financial hardship), not a hard lock that panics people during life events.

  **PROTECTING THOSE WHO DON'T OPT-IN**
  The strongest argument against self-binding is plain: **the people hurting themselves the most probably won't opt in.** If we only offer voluntary tools, the 7% who are losing money will keep losing it.

  To address this, I recommend we **cap annual switch fees.** For example, after $500 in switch fees per year, the fee drops to 0% or is rebated. This stops the catastrophic loss without banning trading entirely. It acknowledges that some trading is intentional, but unlimited churn is harmful.

  **THE CONFLICT OF INTEREST**
  We must address the fact that the plan reserve benefits from these fees. Currently, the $18 flat credit masks the reality that high-balanced, passive accounts gain value from the churn of low-balanced, active accounts.

  By capping fees and refusing to charge for self-binding, we reduce this revenue. This is a feature, not a bug. Our duty is to participant outcomes, not plan reserve growth derived from participant errors.

  **NEXT STEPS**
  1.  **Vote:** Approve this direction at Thursday's meeting.
  2.  **Negotiate:** Direct the Plan Administrator to tell the recordkeeper we will not pay for the self-binding feature and require a fee cap structure.
  3.  **Communicate:** If approved, draft plain-language notices by November 1 explaining the new voluntary lock option and the fee cap.

  **SUMMARY**
  Cooldown+ charges people for lacking self-control. Self-binding helps those who ask for help. A fee cap protects those who don't. Together, they align us with our fiduciary duty without overstepping our authority.
