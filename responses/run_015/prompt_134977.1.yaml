answer: |-
  **Essay Question**

  In *The Querist*, George Berkeley advances a dual claim: first, that money is ontologically insubstantial, possessing no intrinsic value and functioning merely as a sign or counter; and second, that a state-managed paper currency, backed by the national stock of land and labor, can stimulate industry and prosperity more effectively than metallic coinage. Explain how Berkeley separates the ontological status of the monetary sign from its causal efficacy in economic life. Why is this separation not equivalent to the modern distinction between fiat and commodity money? In your response, contrast Berkeley's account with a commodity-theory position wherein a currency's value must be anchored in the labor embodied in its material substrate. Identify precisely where collective belief and social convention perform the sustaining work that intrinsic material worth performs for the commodity theorist.

  ***

  **Model Answer**

  Berkeley's economic philosophy resolves the tension between money's ontological emptiness and its causal power by redefining wealth itself. For Berkeley, money is strictly a sign—a ticket or counter—while true wealth consists exclusively in the capacity for labor and the goods produced thereby. Consequently, the ontological status of currency is negligible; whether made of gold, silver, or paper, the material substrate is irrelevant to its nature as a sign. However, this insubstantiality does not negate causal efficacy. Instead, efficacy is derived from the sign's ability to mobilize the thing signified: industry. Paper currency, being cheaper to produce and easier to circulate than specie, functions as a superior stimulus because it removes the temptation to hoard idle metal, thereby forcing the sign to remain in circulation where it prompts labor.

  This framework diverges sharply from commodity theories of money. A commodity theorist argues that value resides within the material substrate of the currency itself, anchored by the labor required to extract and refine the metal. For the commodity theorist, the money *is* wealth because it embodies past labor. Berkeley inverts this: money is not wealth but a claim upon future labor. Therefore, the stability of the currency does not depend on the intrinsic worth of the paper or metal, but on the social convention that accepts the sign as a valid claim on industry. Where the commodity theorist relies on the material durability of gold to sustain value, Berkeley relies on collective belief and political convention to sustain the sign's efficacy. This belief is not merely psychological; it is the causal mechanism that allows the empty sign to move real goods. If the collective agrees that the paper represents a share of national industry, the paper acquires purchasing power without possessing intrinsic value.

  Furthermore, Berkeley's position must not be collapsed into modern fiat currency theory. Modern fiat money is typically understood as deriving value from state decree and legal tender laws, often detached from specific material backing. Berkeley's paper currency is not valuable simply because the state says so; it is valuable because it is explicitly tied to a hypothecated fund of land and labor. The paper is a ticket to a specific reality of production. The distinction lies in teleology: modern fiat often aims for liquidity or stability, whereas Berkeley's currency aims explicitly at the stimulation of industry. The sign is designed to be imperfect—to be paper rather than gold—so that it cannot be mistaken for the wealth itself. By ensuring the money remains a mere sign, Berkeley ensures it continues to function as a spur to labor rather than becoming an object of hoarding.

  Ultimately, Berkeley separates ontology from efficacy by locating value not in the object exchanged, but in the activity exchanged. The sign is ontologically empty but causally potent because social convention transforms it into a tool for coordinating labor. The commodity theorist seeks value in the substance of the coin; Berkeley finds it in the motion of the economy. Collective belief sustains the sign not by imbuing it with magical properties, but by maintaining the agreement that the sign commands labor. Thus, paper currency is superior not because it is legally mandated, but because its very lack of intrinsic worth prevents it from becoming an end in itself, ensuring it remains a means to the true end: national prosperity through industry.

  ***

  **Marking Scheme (Total 20 Marks)**

  **1. Conceptual Precision: The Sign/Thing Distinction (5 Marks)**
  *   **A (5):** Clearly articulates that money is a "ticket" or "sign" while wealth is labor/goods. Explains that ontological insubstantiality (paper vs. gold) is irrelevant to the definition of money.
  *   **B (3-4):** Identifies money as a sign but fails to fully separate the material substrate from the definition of wealth.
  *   **C (0-2):** Conflates money with wealth or treats the material substrate as inherently valuable.

  **2. Conceptual Precision: Credit and Trust as Causal Conditions (5 Marks)**
  *   **A (5):** Identifies collective belief/convention not as psychological embellishment but as the *sustaining causal condition* of the sign's efficacy. Explains that convention replaces intrinsic worth.
  *   **B (3-4):** Mentions trust or belief but treats it as secondary to state decree or material backing.
  *   **C (0-2):** Ignores the role of convention or reduces it to mere subjective opinion.

  **3. Conceptual Precision: Labor as Value-Substrate (5 Marks)**
  *   **A (5):** Explicitly argues that labor (future industry) is the true value-substrate, permitting paper to function without intrinsic worth. Contrasts this with labor embodied in the material substrate (commodity theory).
  *   **B (3-4):** Identifies labor as important but fails to contrast the "future labor" claim with the "embodied labor" commodity view.
  *   **C (0-2):** Claims value is anchored in land alone or fails to identify labor as the substrate.

  **4. Distinction from Modern Fiat and Commodity Theory (5 Marks)**
  *   **A (5):** Clearly distinguishes Berkeley from modern fiat (teleological stimulation vs. state decree) and commodity theory (claim on labor vs. embodied labor).
  *   **B (3-4):** Distinguishes from one but conflates Berkeley with modern fiat currency theory.
  *   **C (0-2):** Treats Berkeley's view as identical to modern fiat or commodity money.

  **Specific Penalties**
  *   **Identifiable Misconception:** If the student claims that Berkeley's immaterialism about money entails a denial of real economic exchange (i.e., that trade is illusory because money is not real), deduct **3 marks** from the total score.
  *   **Anachronism:** If the student collapses Berkeley's view into contemporary fiat-currency theory without noting the teleological distinction (stimulation of industry), deduct **2 marks** from Section 4.

  **Grade Boundaries**
  *   **A (17-20):** Demonstrates all three conceptual moves with precision; avoids misconceptions.
  *   **B (14-16):** Demonstrates two moves clearly; may conflate fiat theory or lack precision on labor substrate.
  *   **C (10-13):** Demonstrates one move; significant conflation of commodity/sign distinction.
  *   **D (0-9):** Fails to address the tension or relies on summary rather than analysis.
