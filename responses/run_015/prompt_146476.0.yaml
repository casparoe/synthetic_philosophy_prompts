  After a faulty sprinkler system melted a prized terracotta sculpture into a puddle, the museum filed two insurance claims: one for the total loss of "The Statue," and a second for the structural damage to "The Clay Lump."

  The insurance adjuster denied the second claim immediately. "I can't pay for the clay," he told the curator. "It's the same object as the statue. You can't double-dip on one thing."

  The curator adjusted his glasses and replied, "If I were to take this puddle and reshape it into a sphere, the statue would cease to exist, but the clay would survive. They have different persistence conditions and distinct modal properties. By Leibniz's Law, they are not identical. You insured two coincident objects. Now, please process the claim for the statue's death, and this separate claim for the clay's wrongful continuance."
