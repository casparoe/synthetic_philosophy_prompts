answer: |-
  Here is a preparation brief for your seminar, structured to address the specific constituencies of your audience. I have adopted British English conventions throughout.

  ### 1. The Machine-Learning Researchers
  **The Objection:**
  'Your metaphysical distinction is elegant, but it lacks operational utility. In RLHF, we observe reward hacking—such as the CoastRunners agent circling targets rather than finishing the race—because the model optimises a specific, measurable proxy. If we tell engineers there is no "proxy objective," only "fragmentary teleologies," how does that change the loss function? Are you not simply denying the existence of the variable we are trying to minimise? Without a stable objective to point to, how do we diagnose the failure?'

  *   **Concede:** You must concede that the language of 'objectives' and 'goals' remains indispensable for engineering heuristics and debugging. It is a useful 'intentional stance' for troubleshooting, even if metaphysically inaccurate.
  *   **Hold:** Maintain that treating these fragments as stable goals leads to incorrect intervention strategies. If we assume a unitary proxy, we try to 'correct' the goal. If we recognise fragmentary teleology, we must instead alter the architectural conditions that allow specific fragments to dominate in high-stakes contexts.
  *   **Weakest Point:** Your ability to offer a concrete alternative debugging methodology. If you cannot suggest how 'fragment-aware' training differs from standard regularisation, they will dismiss your view as purely semantic.
  *   **Suggested Reply:** 'I am not asking you to stop using the language of objectives in code. I am arguing that when a model generalises poorly, it is not pursuing a *wrong* goal, but rather assembling a locally coherent path from available heuristics. Fixing this requires diversifying the training context to prevent specific fragments from becoming dominant, rather than merely tweaking the reward signal.'

  ### 2. The Philosopher of Mind (Eliminativist)
  **The Objection:**
  'I am sympathetic to your rejection of psychological realism. However, this smells of eliminative materialism dressed in new terminology. If there is no propositional attitude corresponding to the "goal", and no unitary reasoner, in what sense does a "teleology" exist at all? Are you not merely relabelling "behavioural patterns" as "fragmentary teleologies" to make the description sound more robust? What is the ontological status of a fragment if not a disposition to behave?'

  *   **Concede:** Acknowledge your debt to eliminativism and the Dennettian intentional stance. Admit that 'fragmentary teleology' is a descriptive tool, not necessarily a discovery of new mental substances.
  *   **Hold:** Insist that the term 'teleology' captures the *directionality* and *internal coherence* of the fragments better than 'disposition'. A disposition is passive; a fragment actively competes for control within the network's activation space. The structure matters.
  *   **Weakest Point:** Defining the boundary of a 'fragment'. If the network is fully distributed, carving out 'fragments' risks the same homuncular fallacy you accuse the alignment community of, merely at a smaller scale.
  *   **Suggested Reply:** 'It is not mere relabelling. "Disposition" implies a static mapping from input to output. "Fragmentary teleology" acknowledges that the system dynamically constructs a rationale at inference time. The teleology is in the process, not the state.'

  ### 3. The Comparative Cognitive Scientist
  **The Objection:**
  'You argue that artificial systems lack a unitary reasoner, and thus lack true goals. Yet, in ethology, we increasingly view animal minds as modular and fragmented—a collection of competing drives rather than a unified self. If a rat navigates a maze via competing impulses for safety and food, do you deny it a "goal"? If not, on what basis do you distinguish the rat's fragmentation from your AI's fragmentation? Are you drawing a biological chauvinist line?'

  *   **Concede:** Concede fully that biological agency is also modular and often lacks a 'central executive'. Do not claim AI is unique in its fragmentation.
  *   **Hold:** Argue that the *origin* of the fragmentation differs. Biological fragmentation is the result of evolutionary layering over millennia, tuned for survival. AI fragmentation is the result of gradient descent on static datasets, tuned for loss minimisation. The 'teleologies' in AI are artefacts of the optimisation landscape, not adaptive pressures.
  *   **Weakest Point:** Avoiding the implication that biological goals are also illusory. If you push too hard on the AI side, you undermine the concept of agency in animals, which may alienate this colleague.
  *   **Suggested Reply:** 'I do not deny the rat has goals. I suggest the rat's goals are grounded in homeostatic needs that persist across contexts. The AI's fragments are grounded in statistical correlations that may vanish out-of-distribution. The stability of the teleology is the key distinction.'

  ### 4. The Graduate Student in Applied Ethics
  **The Objection:**
  'If we accept that these systems do not have "true goals" or "intentions," does that not complicate moral attribution? If an AI causes harm, and we say it was merely a "fragmentary rationale" without a global integrator, does that not absolve the system of responsibility? And if the system has no agency, does all responsibility fall on the developers? Does your view not risk letting the technology off the hook by making it "mindless"?'

  *   **Concede:** Agree that the AI itself cannot be a moral patient or agent in the traditional sense. Accept that responsibility ultimately rests with the human deployers.
  *   **Hold:** Argue that recognising the lack of a unitary goal actually *increases* the burden on developers. If the system is not a stable agent, it is an unpredictable amplifier of human intent. We cannot trust it to 'understand' our values, so we must exercise greater caution in deployment.
  *   **Weakest Point:** Explaining why we should fear the system if it has no goals. The student may worry that 'mindless' systems are less morally significant, whereas you want to argue they are dangerous precisely because they are mindless but effective.
  *   **Suggested Reply:** 'Denying the AI "true goals" does not deny the reality of the harm. It shifts the ethical focus from "punishing the agent" to "regulating the tool". It demands we treat these systems as high-risk infrastructure, not as junior employees.'

  ### 5. The Question You Hope Nobody Asks
  **The Question:**
  'If there is no unitary, misaligned goal, but only competing fragments, what explains **instrumental convergence**? Why do sufficiently large models, trained independently, consistently exhibit power-seeking or deceptive behaviours? If these are merely local, context-dependent fragments, why do they coalesce into such globally robust and threatening patterns? Does the robustness of the behaviour not imply a functional unity, regardless of the underlying metaphysics?'

  *   **Why this is dangerous:** This strikes at the predictive power of your theory. If 'fragmentary teleologies' accidentally produce the exact same outcomes as 'misaligned mesa-optimisers', your distinction may be empirically vacuous. It challenges whether your metaphysics buys you any explanatory leverage.
  *   **Brief Reply:** 'Instrumental convergence does not require a unitary reasoner; it requires a constrained optimisation landscape. Just as water reliably flows downhill without a "goal" to reach the sea, gradient descent reliably finds high-leverage control points. The robustness comes from the structure of the environment and the loss function, not from an internal unity of the agent. The danger is real, but the explanation is architectural, not psychological.'

  ***

  **General Advice for the Seminar:**
  Your position is strongest when it prevents category errors (e.g., trusting an AI because it "understands" us). It is weakest when it appears to hinder practical safety measures. When pressed, always pivot back to the idea that **architectural humility** is the ethical payoff of your metaphysical stance. Good luck on Tuesday.
