      *   *Journalism/Research:* It's a "Heuristic" not a "Model." Good for print, needs work for lab.

      *(Self-Correction)*: Ensure I explicitly answer "What would count against this?" for the defeaters.
      *(Self-Correction)*: Ensure I explicitly answer the "Predictions vs Rivals" requirement for the defeaters.

      Let's assemble the response.

      *Tone Check:* "British broadsheet" implies *The Guardian* (G2/Comment), *The Times* (Saturday Review), or *FT*. Intellectual but accessible. Witty but serious. I will match this register.

      *Key argument to stress:* The "Content as Scaffolding" claim is the most vulnerable. If content *determines* the cost (e.g., "God demands X"), then content isn't substitutable. If I believe God demands X, and you believe God demands Y, we can't swap costs easily. The user claims the *cost* is the unit of selection, not the *god*. I need to find where the god dictates the cost in a non-substitutable way.

