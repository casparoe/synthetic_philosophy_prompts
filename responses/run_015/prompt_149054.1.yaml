      *   **Task:** Stress-test a specific three-part theoretical position on religion before publishing.
      *   **The Position:**
          1.  *Origins:* Religion is a by-product of cognitive machinery (HADD, ToM, teleology, etc.). No direct selection for religion.
          2.  *Persistence:* Cultural transmission filters for *cost* (hard-to-fake signals like fasting, tithes). Groups with costs outlast those without (Cultural Group Selection - CGS).
          3.  *Content (The User's Contribution):* Propositional content (theology/doctrine) is merely scaffolding for the costs. It makes costs feel non-negotiable. Content is largely substitutable; cost structure is the transmitted unit.
      *   **Requirements:**
          *   Provide defeaters (fatal, conceptual, awkward), ranked and categorized (empirical, conceptual, minor).
