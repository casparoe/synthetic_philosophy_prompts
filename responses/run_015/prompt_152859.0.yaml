  2.  **Brainstorming Core Distinctions (Internal Monologue/Drafting):**
      *   *Value:* Is it instrumental (getting the job done now) or structural (reliability over time)? The Meno problem usually asks about *intrinsic* or *stable* value, not just immediate hit rate.
      *   *Justification:* In philosophy, this is often about warrant or reliability. In engineering, it's about traceability, reproducibility, and maintainability. The user equates "justification" with "reasoning traces."
