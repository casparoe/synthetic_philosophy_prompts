      *   (4) *Critical Slide:* Defines "practical value" *solely* as "rate of correct diagnoses" (precision/recall). This ignores *why* we want correct diagnoses (to fix the bug reliably).
      *   (5) Follows from (4), but inherits the flaw.
      *   (6) Philosophers claim knowledge is more valuable. (True, generally).
      *   (7) The dilemma.
      *   (8) The recommendation to deploy the oracle.
      *   (9) The intuition that (8) is wrong.
      *   *Break Point:* Step (4) and (5). The definition of "value" is too narrow. It ignores the *counterfactual stability* of the belief. A lucky guess doesn't help you fix the bug if the guess isn't actionable. A justified belief allows intervention.

