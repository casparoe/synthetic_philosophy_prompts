          *   Distinguish *Accuracy* (hit rate) from *Actionability/Reliability*.
          *   Connect to Plato's *Meno*: The "tethering" analogy.
      *   **Settled vs. Contested:**
          *   *Settled:* Knowledge requires more than luck (anti-luck condition). Knowledge is generally more stable.
          *   *Contested:* *Why* it's more valuable (Virtue Epistemology vs. Reliabilism vs. Pragmatism). Is value intrinsic or instrumental?
      *   **Applying to the Pipeline:**
          *   The "Stochastic Oracle" gives a *what* but not a *why*.
          *   The "Justified Pipeline" gives a *why* which enables the *how* (fix).
          *   If the diagnosis is "Database Lock," a lucky guess tells you that. A justified trace tells you *which transaction*.
      *   **The Unpleasant Trade-off:**
