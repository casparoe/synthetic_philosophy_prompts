      *   **Task:** Provide a reading of the film *Trading Places* (1983) through that Aristotelian material.
      *   **Constraints:**
          *   Not a summary of the film or Aristotle.
          *   Concretely address:
              1.  Duke & Duke doing chrematistics? (Unlimited aim vs. severing from use).
              2.  The dollar bet (persons as interchangeable units vs. need as real unit).
