answer: |-
  Here is the reading I would defend to your group.

  **The Core Thesis**
  *Trading Places* is not a critique of markets per se, but a dramatization of Aristotle's distinction between *oikonomia* (household management aimed at self-sufficiency) and *chrematistics* (wealth-getting aimed at unlimited accumulation). The film indicts the Dukes not because they trade, but because their trade severs exchange from human need and treats persons as interchangeable tokens of currency. The heroes win not because they reject *chrematistics*, but because they reintroduce reciprocity and community into a system the Dukes treat as purely mechanical.

  **1. Duke and Duke: The Barrenness of Futures**
  You asked whether the objection is the unlimited aim or the severing from use. In Aristotle, these are linked: because money has no natural use, aiming at unlimited money is unnatural. The film lets you separate them. The Dukes deal in frozen concentrated orange juice they never intend to drink, store, or ship. They trade contracts on the price of the juice.

  The film indicts the **severing from use**. When the Dukes discuss the commodity, they never mention the fruit, the farmers, or the consumers. They speak only of price movement. This is money breeding money, which Aristotle calls usury—the most hated form of wealth-getting because it makes money from money itself, not from the exchange of goods. The Dukes are attempting to bypass nature entirely. They want the offspring (profit) without the parent (the useful good). The film visualizes this barrenness in their office: cold, sterile, elevated above the street. They are not managing a household; they are running a casino where the chips are human livelihoods.

  **2. The Dollar Bet: Money as Measure vs. Money as Power**
  The wager is the philosophical core. Aristotle argues money exists by agreement to measure need, facilitating reciprocity so the community holds together. The Dukes use money to measure *human potential*. They bet on whether nature or nurture determines success, treating Winthorpe and Valentine as experimental variables.

  This dramatizes the confusion Aristotle predicts when money becomes an end rather than a means. When money is the goal, it stops measuring need and starts measuring power. The Dukes confuse the token (the dollar) with the substance (human worth). By making the bet, they turn persons into currency. Aristotle warns that when exchange value dominates use value, social bonds dissolve. We see this dissolution immediately: Winthorpe is cast out of his community, stripped of his credit and status, because the Dukes manipulated the token of his worth. The film shows that when you treat people as money, you destroy the "need" that holds the polis together.

  **3. The Ending: Skill, Fraud, and Justice**
  This is the hardest wrinkle. Winthorpe and Valentine win by manipulating the market with a stolen crop report. They engage in the same *chrematistics* as the Dukes. Does this undercut the Aristotelian reading?

  I argue no, but with a caveat. Aristotle distinguishes between wealth-getting that is part of household management (acquiring what is needed) and wealth-getting that is an end in itself. The heroes use the tools of *chrematistics*, but their aim is limited: freedom and security, not unlimited accumulation. They break the Dukes, take the money, and leave the system.

  Regarding skill: Aristotle acknowledges skill (*techne*) in management but condemns trade for profit. However, he also values justice. The Dukes lose because of hubris—they believe they control nature and humans. The heroes win because they understand the market is a human agreement, susceptible to human action. The film suggests that while the mechanism (futures trading) is barren, the *intent* matters. The Dukes trade for greed and sport; the heroes trade for survival and retribution. The film endorses wealth-getting only when it serves justice and community (the two men share the wealth), whereas the Dukes' wealth was isolated and predatory.

  **Where the Reading Fails**
  You need to be honest about the distortions.
  First, **the retirement.** Aristotle would not approve of the heroes retiring to a beach in Africa with millions. That is leisure funded by unlimited wealth, not self-sufficiency. They haven't returned to *oikonomia*; they've just won the *chrematistics* game. The film implies money can buy freedom from the market, whereas Aristotle argues money binds you to the market.
  Second, **the gorillas.** The final scene is slapstick revenge, not economic justice. Aristotle's justice is restorative and proportional. Leaving the Dukes destitute with animals is poetic comedy, not Aristotelian equity.
  Third, **the mechanism.** Aristotle had no concept of futures or short selling. Applying "barren money" to derivatives is an extrapolation. He objected to interest because money shouldn't breed; he might have viewed futures as even worse—betting on the price of things that don't exist yet.

  **Scenes to Show**
  1.  **The Wager Scene:** Show the Dukes discussing the bet. It establishes the instrumentalization of human beings. It shows money being used to measure something it cannot measure (character/potential).
  2.  **The Trading Floor Climax:** Show the chaos of the pit. Highlight that no orange juice is present. It visualizes the abstraction Aristotle fears—money circulating without goods.
  3.  **The Beach Ending:** Show the heroes relaxed. Use this to prompt the counter-argument: Have they escaped the system, or just bought their way out?

  **Handling Pushback**
  When a member says, "But the heroes provided liquidity and corrected the price," you say: Aristotle doesn't care about efficiency. He cares about virtue. Liquidity is irrelevant if the aim is unnatural.
  When a member says, "The Dukes created value by taking risk," you say: Aristotle would call that gambling, not production. Risk-taking for profit is still *chrematistics*.
  When a member says, "The film is just a comedy," you say: Precisely. It reveals the cultural anxieties about money that dry theory hides. It shows us why we feel usury is wrong even if it's efficient.

  **Where I Am Stretching**
  I am stretching **Aristotle** by applying his household framework to a corporate brokerage. He wrote about slave-owning heads of households, not commodity brokers. I am stretching the **Film** by assuming it has a coherent moral philosophy regarding wealth. It is primarily a vehicle for Eddie Murphy and Dan Aykroyd's chemistry. The economic critique is incidental to the comedy.

  **What the Film Adds**
  The argument alone gives you logic; the film gives you **affect**. Aristotle argues that money is barren; the film shows you the loneliness of the Dukes. They are rich but isolated, suspicious of everyone, even each other. The heroes are rich because they trust each other. The film adds the emotional reality of reciprocity. It shows that when money severs need from exchange, people become isolated. When exchange serves need (even if through market mechanisms), community survives. The film makes you *feel* the barrenness of money in a way the *Politics* cannot. It turns the abstract "unnatural" into the visceral "cold."
