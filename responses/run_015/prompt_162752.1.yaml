          *   Tell me where the reading fails (scenes that resist it, distortions).
          *   Pick 2-3 scenes to show and explain why.
          *   Commit to one reading to defend out loud.
          *   Tell me what to say when members push back.
          *   Flag where I'm stretching (Aristotle or the film).
          *   Finish with what the film adds to the debate that argument alone doesn't.
          *   No script quotes, no reading lists, no footnotes.
          *   Tone: Intellectual, rigorous, suitable for a reading group of experts/semi-experts, conversational but dense.

  2.  **Deconstruct the Aristotelian Framework:**
      *   *Oikonomia* (Household Management): Natural, limited by need, aimed at self-sufficiency, uses money as a means of exchange.
      *   *Chrematistics* (Wealth-Getting): Unnatural, unlimited, aimed at accumulation for its own sake, treats money as an end.
      *   *Money:* Barren (cannot breed), conventional (by agreement not nature), a measure of need/exchange.
      *   *Justice/Reciprocity:* Need holds the community together, money is a token representing need.
      *   *Usury:* Most hated because money makes money from itself (unnatural offspring).

  3.  **Deconstruct *Trading Places*:**
      *   *Plot:* Randolph and Mortimer Duke (commodity brokers) bet $1 on whether nature vs. nurture determines success. They swap Louis Winthorpe (upper-class broker) and Billy Ray Valentine (street beggar).
      *   *Economics:* They trade futures (Frozen Concentrated Orange Juice - FCOJ). They never touch the physical goods.
      *   *Climax:* Winthorpe and Valentine trick the Dukes using false crop report info, causing Dukes to buy high while they sell high then buy low (short selling). Dukes lose everything.
      *   *Ending:* Heroes retire to a beach in Africa. Dukes are left destitute (possibly with gorillas).

  4.  **Drafting the Argument - Section by Section:**

      *   **Chrematistics vs. Oikonomia:** The Dukes are the epitome of unnatural *chrematistics*. They trade FCOJ without touching the juice. Is it the unlimited aim or the severing from use? Aristotle conflates them, but the film separates them. The film indicts the *severing from use* combined with the *treatment of humans as variables*. The Dukes don't care about orange juice (use); they care about the price movement (accumulation). But more importantly, they treat human lives as the variable in their experiment. This is money breeding money (via human manipulation).
      *   **The Bet:** The $1 bet treats Winthorpe and Valentine as interchangeable tokens. Aristotle says money is a token for *need*. Here, money is a token for *power over persons*. The Dukes confuse the measure (money) with the thing measured (human worth/potential). This dramatizes Aristotle's fear: when money becomes the end, human relations become instrumental.
      *   **The Ending:** This is the tricky part. Winthorpe and Valentine win by playing the game better. They use inside information (stolen crop report). Aristotle allows for skill (*techne*) in management, but condemns usury/speculation. Is short-selling based on fraud usury? It's money making money from money (via information asymmetry). However, the film frames this as *justice* (retribution). Does this undercut Aristotle? It suggests the system is corrupt but winnable. It doesn't reject *chrematistics*; it just changes the winners. This is the biggest tension.
      *   **Where it Fails:** The film is a comedy of reversal, not a moral treatise. The heroes become rich. They don't return to *oikonomia* (household management); they retire to a beach (leisure, but funded by infinite wealth). The gorilla scene is slapstick, not economic justice.
      *   **Scenes to Show:**
          1.  The Bet scene (establishes the instrumentalization of humans).
          2.  The Trading Floor climax (shows the abstraction of value/no physical goods).
          3.  The Ending/Beach (shows the reward structure).
      *   **Stretching:** Stretching Aristotle to cover futures trading (he didn't imagine derivatives). Stretching the film to be deeper than it is (it's a comedy).
      *   **What the Film Adds:** It shows the *human cost* of abstraction. Aristotle argues logically; the film shows suffering and joy. It visualizes the "barrenness" of money vs. the "fruitfulness" of human connection (Winthorpe/Valentine partnership vs. Duke brothers' rivalry).

  5.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Constraint Check:* No quotes. No footnotes. Commit to one reading.
      *   *Tone:* Needs to sound like I'm talking to econ professors. Use terms like *chrematistics*, *oikonomia*, *use-value*, *exchange-value*.
      *   *The "Skill" Wrinkle:* Aristotle distinguishes between natural acquisition (getting what you need) and unnatural (accumulation). He also distinguishes between managing wealth (stewardship) and trading for profit. The film's heroes use *techne* (skill) but for *chrematistic* ends. I need to argue that the film punishes the *vice* of the Dukes (pride/hubris/instrumentalization) rather than the *act* of speculation itself. The Dukes lose because they treat people as things. The heroes win because they collaborate (community/need).
      *   *The Bet:* Aristotle says money is a measure of need. The Dukes use money as a measure of *social engineering*. This is the distortion.
      *   *The Ending:* Does it endorse wealth-getting? Yes, but it reclaims it for the "worthy." It's a moral victory within an immoral system. This is where Aristotle would shake his head. He wouldn't want them on the beach with millions; he'd want them back in a household.
      *   *Stretching:* Admit that Aristotle didn't know about futures markets. Admit the film is 80s Reagan-era capitalism, not ancient Athens.

  6.  **Finalizing the Structure:**
      *   **Introduction:** State the core thesis (The film dramatizes the corruption of *chrematistics* when it severs exchange from need and treats humans as currency).
      *   **Duke & Duke (Chrematistics):** Focus on the abstraction. They trade symbols, not goods. The indictment is on the *unlimitedness* and the *disregard for use*.
      *   **The Bet (Money & Persons):** Money as a measure of need vs. money as a measure of human worth. The Dukes confuse the token with the substance.
      *   **The Ending (Skill vs. Usury):** Address the "stolen report" issue. Argue that the film punishes the *intent* (hubris) not the *mechanism*. But acknowledge the tension: the heroes remain rich.
      *   **Where it Fails:** The retirement scene. The slapstick. The lack of a return to *oikonomia*.
      *   **Scenes to Show:** The Wager, The Trading Floor, The Beach.
      *   **Pushback:** What if someone says "They provided liquidity"? Counter: Aristotle doesn't care about liquidity, he cares about virtue and need.
      *   **Stretching:** Acknowledge the anachronism.
      *   **What the Film Adds:** The visceral reality of status and the emotional bond vs. contractual bond.

  7.  **Writing the Response:** (Iterative refinement for tone and constraints).
      *   *Check:* Did I quote lines? No.
