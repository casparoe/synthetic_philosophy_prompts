      *Refining the "Skill" point:* Aristotle allows for skill in household management. He condemns trade for profit. The heroes engage in trade for profit. So strictly speaking, they are doing *chrematistics*. The film validates this. This is the biggest divergence. I need to argue that the film distinguishes between *predatory* chrematistics (Dukes) and *survival/redistributive* chrematistics (Heroes). Aristotle wouldn't buy that distinction, but the film does. I must be honest about this divergence.

