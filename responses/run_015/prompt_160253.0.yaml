answer: |-
  I reject step (3). It looked fine because it presents itself as a harmless summarizing inference from (2), treating the "very little" causal work done by host-aligned biases as explanatorily negligible, effectively rounding down to zero for the sake of the model's clarity. However, in epistemology, "negligible" is not equivalent to "none," and debunking arguments require strict insensitivity to truth to succeed; even a weak causal link to truth preserves a channel for justification, preventing the antecedent of (5) from being satisfied. By conflating the simulation's stipulated absence of truth-tracking with a universal absence of truth-tracking in actual culture, (3) overgeneralizes a specific model constraint into a metaphysical claim about all belief formation.

  To reject (1) would be to abandon the selectionist framework entirely, conceding that cultural evolution cannot be distinguished from rational-agent explanation, which defeats the purpose of your seminar's core model. To reject (2) would require denying the empirical output of your simulation and the seminar's consensus on the dominance of host-neutral biases, which you explicitly wish to avoid. To reject (5) is the most expensive alternative: it costs you evolutionary debunking arguments generally, not just this specific use. Premise (5) is the engine of all such arguments (e.g., Street's moral debunking, Plantinga's evolutionary argument against naturalism); if you sever the link between truth-independent causal genesis and lost justification here, you must also sever it for moral beliefs, religious beliefs, and any other domain where evolution is cited to undermine realism. You cannot reserve (5) for cultural theory alone without ad hoc restriction, so rejecting it collapses the broader debunking toolkit you likely wish to retain.

  The self-referential step, (4) together with (7), is not a red herring; it functions as a *reductio ad absurdum* that matters significantly. It does not merely show the argument is unpopular; it demonstrates that the conclusion is self-defeating, forcing a premise rejection somewhere. However, it does not identify *which* premise is false, only that the set is inconsistent. The fact that it takes down everything else does not make it easier to dismiss; rather, it increases the pressure to find the error early in the chain (like (3)) rather than accepting the global skepticism of (6).

  I would change my diagnosis if you could establish a threshold view of epistemic support, arguing that justification requires a *significant* causal link to truth rather than *any* link, such that the "very little" work conceded in (2) falls below the threshold required to satisfy (5). Alternatively, if you could demonstrate that for *abstract theoretical beliefs* (like cultural evolution itself), host-aligned biases are strictly zero—even if non-zero for practical beliefs like "fire burns"—then (3) would hold for this specific case without generalizing to "any widespread belief," forcing a rejection of (5) or (1) specifically for theoretical domains.

  My own reasoning is most likely to fail in assuming that "very little" causal influence is sufficient to sustain justification; it is possible that epistemic support is binary and requires a robust causal connection that noisy transmission destroys. I may also be overestimating the generalizability of your simulation; if the model accurately captures high-level theory transmission where truth is hard to verify, (3) might be locally true for cultural evolution even if false for mathematics, which would still threaten the theory's own credibility without collapsing all knowledge.
