  ### 8. The Single Verdict That Tells the Rules Apart

  **The Verdict:** **Is "All emeralds are G-star" a lawlike generalization for the Gemologists?**

  *   If she says **Yes**: She is a Conventionalist (Rule A). Entrenchment constitutes projectibility.
  *   If she says **No**: She is a Crypto-Realist (Rule B). Naturalness constitutes projectibility; entrenchment is just evidence.

  ### 9. Final Advice

  Your suspicion that the rules agree on every *actual* case is the strongest part of your chapter. You should argue that while Rule A and Rule B diverge in *modal space* (the Gemologists), they converge in *actual space* (our science). This allows you to respect her Conventionalism (Rule A) while acknowledging the Realist intuition (Rule B) that drives the rejection of Grue.

  However, be prepared for her to insist on the Gemologist case. If she does, she is forcing you to accept that **induction is a local practice, not a global logic.** That is a profound philosophical commitment, and it validates the "whose language" comment as a deep point, not a dodge. Do not treat it as a dodge in the final text; treat it as the pivot of her theory.
