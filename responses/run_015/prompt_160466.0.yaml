  This is a sophisticated exegetical problem. You are dealing with a supervisor who is operating within a Goodmanian framework but whose specific constraints (the "definition" remark, the "positional" dismissal) suggest a nuanced version of entrenchment theory that avoids both simple conventionalism and naive realism.

  Here is the analysis of her commitments, the predictions for your three cases, and the reconstruction of the rules you need for your footnote.

  ### 1. Predictions on the Three Cases

  Based on her track record (specifically the rejection of "positional" explanations and the "whose language" remark), she is most likely a **Goodmanian Conventionalist**. She treats projectibility as a property of predicates relative to a linguistic community's actual history of usage, not as a property of the world's structure.

  *   **Case 1 (The Gemologists/G-star):**
      *   **Prediction:** **Projectible for them.**
      *   **Reasoning:** Her comment "it is a question about whose language we are speaking" is the smoking gun. For the gemologists, G-star is not a disjunctive definition; it is a primitive, entrenched term with a 120-year history of successful projection. The fact that *we* can translate it into "Greavy" is irrelevant to *their* inductive rights. The definition is not "doing the work" for them because they do not use the definition.
      *   **Prediction about the stone:** It predicts the stone will be **G-star** (which, unbeknownst to them, means it will be Blue).

  *   **Case 2 (New Phase/Ostensive):**
      *   **Prediction:** **Provisionally projectible, but weak.**
      *   **Reasoning:** Ostensive definitions can seed entrenchment (like "Green"). However, twelve projections is a low entrenchment score. Goodmanian entrenchment is comparative. If a rival predicate emerges (e.g., "Superconducts-if-examined-before-2050"), the new term might lose out unless its entrenchment grows. She will likely say it is projectible *ceteris paribus*, but vulnerable.
      *   **Reasoning:** This mirrors her treatment of Grue (fits evidence, but loses on entrenchment). Here, there are no rivals yet, so it stands, but it hasn't earned the "lawlike" status of Green yet.

  *   **Case 3 (Phlogiston in 1780):**
      *   **Prediction:** **Yes, it was projectible then.**
      *   **Reasoning:** Projectibility is time-indexed. In 1780, "phlogiston" was better entrenched than its rivals within that community, and the evidence (by their standards) supported it. The fact that it refers to nothing *now* does not retroactively destroy its projectibility *then*. To say otherwise would be to confuse projectibility (validity of inference) with truth (accuracy of conclusion).

  ### 2. Reconstruction: The Two Candidate Rules

  You need two rules that fit her *past* verdicts (Green=Yes, Grue=No, Greavy=No) but diverge on your *new* cases.

  **Rule A (Community-Relative Entrenchment):**
  > A predicate $P$ is projectible for a community $C$ at time $t$ if and only if $P$ (or a coextensive equivalent treated as primitive by $C$) has a history of actual projection within $C$ prior to $t$ that is not overridden by a conflicting predicate with superior entrenchment within $C$.

  **Rule B (Structural Naturalness / Crypto-Realism):**
  > A predicate $P$ is projectible for a community $C$ at time $t$ if and only if $P$ picks out a natural kind or structural invariant, where "entrenchment" is merely the fallible epistemic marker we use to identify such kinds; disjunctive definitions (like Greavy) block projectibility even if entrenched, unless supported by a higher-order law linking the disjuncts.

  **Why both fit her past verdicts:**
  *   **Green:** Entrenched (Rule A) AND Natural Kind (Rule B).
  *   **Grue:** Unentrenched (Rule A) AND Not a Natural Kind (Rule B).
  *   **Greavy:** Unentrenched for us (Rule A) AND Disjunctive/Accidental (Rule B).
  *   **Past Grue (1900):** Evidence discriminates (both rules agree the puzzle dissolves).

  ### 3. Diagnostic Analysis

  *   **Genuinely Diagnostic:** **Case 1 (The Gemologists).**
      *   **Rule A** says **Yes** (Their usage makes it entrenched).
      *   **Rule B** says **No** (G-star is coextensive with Greavy, which is structurally gerrymandered; the "natural kind" is Green/Blue, not G-star).
      *   *Why:* This case isolates **Community Relativity** from **Objective Structure**. Her "whose language" comment suggests she will follow Rule A. If she follows Rule B, she is a crypto-realist who uses Goodmanian vocabulary.

  *   **Only Looks Diagnostic:** **Case 3 (Phlogiston).**
      *   *Why:* It looks like it separates Truth from Entrenchment. However, a clever Rule B proponent can argue that Phlogiston *was* a natural kind candidate in 1780 (caloric theory, etc.) and only ceased to be one later. It allows too much wiggle room regarding "what counts as a kind at time $t$."

  *   **Where she is free:** **Case 2 (New Phase).**
      *   Both rules can agree here. Rule A says "12 projections is some entrenchment." Rule B says "Ostensive + Causal Powers is some naturalness." Both would likely call it "projectible but defeasible." It doesn't force a hard choice.

  ### 4. Best Guess and Reasons

  **Best Guess:** She is committed to **Rule A (Community-Relative Entrenchment)**.

  **Reasons:**
  1.  **The "Whose Language" Remark:** This is the strongest evidence. A Realist (Rule B) would say "It doesn't matter whose language; G-star is gerrymandered." A Conventionalist (Rule A) says "Entrenchment is relative to the speaker."
  2.  **The "Definition" Remark:** Her comment that a definition inherits projectibility "only if the definition is not doing the work" is a standard Goodmanian constraint on *derivative* entrenchment. It implies that if the community treats the term as *primitive* (as the Gemologists do), the definition *isn't* doing the work, and the term is safe.
  3.  **Rejection of "Positional":** By explicitly denying that Greavy fails because it is "positional," she signals she has moved past the early, simpler solutions to the New Riddle and is committed to the later, pragmatic entrenchment theory.

  ### 5. The "Agreement on Every Case" Suspicion

  You suspect the rules agree on every case that can actually arise. **You are largely correct, with one caveat.**

  *   **In Actual Practice:** Rule A and Rule B converge. In our actual scientific community, entrenched predicates (Green, Electron, Gene) generally *are* the ones that pick out stable causal structures. Unentrenched predicates (Grue, Greavy) generally *are* the gerrymandered ones. Entrenchment is a reliable heuristic for Naturalness.
  *   **In Principle (Your Dissertation):** They diverge on *possible* communities (like the Gemologists). If your chapter argues that the distinction is empty *for us*, you are on solid ground. If your chapter argues the distinction is empty *simpliciter*, the Gemologist case is your counterexample.
  *   **Verdict:** If she sticks to Rule A, your conclusion that "Entrenchment and Naturalness converge in practice" is safe. If she secretly holds Rule B, she will reject the Gemologist case.

  ### 6. The Further Case (If Needed)

  If she hedges on the Gemologist case (e.g., "Well, it depends if they *could* learn Green"), you need a case where **Entrenchment and Naturalness diverge within our own community**.

  **The Case:** **The "Standard Meter" Predicate.**
  *   Define $M$ as "being the length of this specific stick S at time $t_0$."
  *   This predicate is perfectly entrenched (we use "meter" constantly).
  *   But generalizations like "All objects struck by hammer H become $M$ long" are not lawlike; they are accidental generalizations about a standard.
  *   **Question:** Is the predicate "$M$" projectible in the context of physical laws, or only in the context of measurement conventions?
  *   **Why it separates them:**
      *   **Rule A (Entrenchment):** "Meter" is highly entrenched. Should be projectible.
      *   **Rule B (Naturalness):** "Length of stick S" is not a natural kind; it's a stipulation. Not projectible for laws of nature.
      *   *Her likely verdict:* She will say "Meter" is projectible for *measurement* inferences, but not for *physical* inferences. This shows she distinguishes contexts, which supports Rule A (projectibility is context/community relative).

  ### 7. Footnote Drafts

  Here are the precise formulations you requested for your footnote, capturing the two reconstructions:

  > **Footnote Draft:**
