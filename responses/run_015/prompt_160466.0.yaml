  > **(2) The Principle of Structural Naturalness:** A predicate $P$ is projectible iff $P$ picks out a natural kind or structural invariant, where entrenchment serves only as a fallible indicator of such naturalness. Disjunctive predicates (like 'Greavy') are unprojectible regardless of community usage unless supported by a higher-order law linking the disjuncts. On this view, 'G-star' is unprojectible even for the Gemologists, as it fails to carve nature at its joints.
