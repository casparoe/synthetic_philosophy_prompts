  >
  > **(1) The Principle of Community-Relative Entrenchment:** A predicate $P$ is projectible for a community $C$ at time $t$ iff $P$ has a history of actual projection within $C$ prior to $t$ that is not overridden by a conflicting predicate with superior entrenchment within $C$. On this view, the Gemologists' 'G-star' is projectible for them, despite being coextensive with the unprojectible 'Greavy' for us.
