answer: |-
  ### I. Formal Restatement

  Let $N = \{1, \dots, n\}$ be a set of agents. Let $O$ be the set of feasible outcomes (policies, world-states). Each agent $i$ possesses a von Neumann-Morgenstern utility function $u_i: O \to \mathbb{R}$.

  The "gains from trade via compromise" thesis is restated as the existence of a bargaining solution concept $\mathcal{F}$ mapping a bargaining problem $(S, d)$ to an outcome $x^* \in S$, where:
  1.  $S \subset \mathbb{R}^n$ is the feasible utility set $\{(u_1(x), \dots, u_n(x)) : x \in O\}$, assumed convex, compact, and comprehensive.
  2.  $d \in S$ is the disagreement point (the status quo or conflict outcome).
  3.  $x^*$ satisfies **Pareto Efficiency**: $\nexists y \in S$ such that $u_i(y) \geq u_i(x^*) \forall i$ with strict inequality for some $i$.
  4.  $x^*$ satisfies **Individual Rationality**: $u_i(x^*) \geq d_i \forall i$.

  In this vocabulary, "compromise" is the selection of an $x^*$ on the Pareto frontier of $S$ that strictly dominates $d$ for all $i$. The "gains" are the vector $(u_1(x^*) - d_1, \dots, u_n(x^*) - d_n) \in \mathbb{R}^n_{++}$. The specific location of $x^*$ is determined by an axiomatic solution concept, typically the **Nash Bargaining Solution** (maximizing $\prod (u_i(x) - d_i)$) or **Kalai–Smorodinsky** (preserving ratios of maximum possible gains).

  ---

  ### II. Pinning Down the Three Questions

  #### 1. The Numeraire Assumption and the Load-Bearing Frame
  You are correct that moral disagreements are generally **Non-Transferable Utility (NTU)** environments. There is no side-payment $t_i$ such that $\sum t_i = 0$ and $u_i(x, t_i)$ is linear in $t_i$.

  For "gains from trade" to be well-defined without a numeraire, the framework must assume **cardinal comparability** of utility gains relative to $d$.
  *   **The Assumption:** The bargaining solution (e.g., NBS) requires that the scale of $u_i$ is fixed up to positive affine transformation. To compare the *magnitude* of concessions across agents (e.g., "Alice concedes more than Bob"), the solution concept implicitly normalizes the utility scales. In NBS, this is done by the invariance axiom; in practice, it requires an interpersonal comparison of "how much" utility is lost.
  *   **Load-Bearing vs. Decorative:** The trade framing is **load-bearing** only if the Pareto frontier of $S$ is **strictly concave** toward the origin relative to $d$.
      *   If the frontier is convex, the solution is a corner (dictatorship); there are no gains from *compromise*, only gains from *winning*.
      *   If the frontier is concave, the "trade" (moving along the frontier) creates surplus.
      *   **Residue:** Without a transferable numeraire, the "price" of the compromise is indeterminate. The NBS picks a specific point, but that point relies on the arbitrary zero-point and scale of $u_i$. If $u_i$ is ordinal only, the "gains" are not well-defined. The thesis implicitly assumes cardinal utility with a specific interpersonal normalization.

  #### 2. Mixture over Policies vs. Utilities vs. SWF
  In a static, one-shot setting, a lottery over outcomes (policy mixture) can replicate the expected utility of a weighted Social Welfare Function (SWF). In sequential settings, they diverge sharply.

  *   **Mixture over Policies (Random Dictatorship):** A coin is flipped at $t=0$. The winner chooses the policy path for all $t$.
      *   *Problem:* This is **not dynamically consistent**. At $t=1$, the winner has an incentive to renege on any ex-ante promises to the loser, as the loser has no future leverage. The ex-post Pareto frontier shrinks.
  *   **Mixture over Utility Functions (Weighted SWF):** The agents agree on weights $\lambda \in \mathbb{R}^n_+$ and maximize $W(x) = \sum \lambda_i u_i(x)$ at every decision node $t$.
      *   *Advantage:* This is **dynamically consistent**. It ensures ex-post Pareto efficiency at every subgame.
  *   **The Thesis's Lean:** The rationalist compromise argument *requires* the **Weighted SWF** interpretation to hold in sequential environments. If they mean "we take turns" or "we flip a coin," they are proposing a mechanism that fails **Incentive Compatibility** in the long run unless enforced by an external contract.
  *   **Divergence:** If agents have private information (violating the **Revelation Principle** conditions for truthful reporting), a policy mixture allows agents to hide preferences to win the lottery. A weighted SWF requires truthful revelation of $u_i$ to set $\lambda$. The "compromise" thesis usually assumes $u_i$ is public knowledge, bypassing the IC constraint.

  #### 3. Deontology, Side-Constraints, and Integrity
  Can deontological constraints be represented without "faking" (lexical thresholds/infinite weights)?

  *   **Standard Representation:** A side-constraint is modeled as a restriction on the feasible set $O$. If action $a$ is forbidden, $a \notin O$.
  *   **The "Faking" Charge:** If the constraint is internal to the agent (e.g., "I cannot kill, even to save two"), it is represented as $u_i(\text{kill}) = -\infty$ or a lexicographic preference ordering. This is mathematically equivalent to a domain restriction but ontologically distinct.
  *   **Integrity/Dirty Hands:** "Integrity" can be modeled as **state-dependent utility** where the utility function depends on the history of actions $h_t$. $u_i(x, h_t)$. If I compromise my values, my future utility function shifts (e.g., $u'_i$ has lower capacity for satisfaction).
  *   **Verdict:** Within standard utility theory, you cannot represent a deontological constraint that *binds* without representing it as either a domain restriction or infinite disutility. There is no "third thing" in the vocabulary. If you reject infinite weights, you must model the constraint as a **mechanism constraint** (the agent physically cannot choose $a$) rather than a preference. The "dirty hands" objection is simply a claim that the feasible set $S$ does not include the "compromise" outcome for that agent, regardless of the utility payoff.

  ---

  ### III. The Residue Report

  Here is what has no expression in this vocabulary, and why it matters for your suspicion.

  #### 1. Endogenous Preferences (The Identity Problem)
  Your vocabulary treats $u_i$ as **exogenous parameters**. The bargaining problem $(S, d)$ assumes the agents entering the negotiation are the same agents exiting it.
  *   **The Blind Spot:** The framework cannot model **preference transformation**. In moral compromise, the act of agreeing to $x^*$ often changes the agents' valuation of future outcomes. If Alice compromises on a core value, her $u_A$ may shift to $u'_A$ (adaptive preferences, cognitive dissonance, or corruption).
  *   **The Consequence:** The statement "better off by their own lights" indexes welfare to $u_i$. If the compromise changes the lights ($u_i \to u'_i$), the metric $u_i(x^*) > u_i(d)$ is stable, but $u'_i(x^*) > u'_i(d)$ may not be. The framework treats this as a **dynamic inconsistency** or an **externality**, but it cannot capture the *ontological shift* of the agent. It views identity change as a preference change, not a change of agent.

  #### 2. The Source of the Disagreement Point ($d$)
  The framework takes $d$ as given. In moral politics, $d$ is often the result of power dynamics, coercion, or previous failures of cooperation.
  *   **The Blind Spot:** The **Core** might be empty if the threat points are endogenous to the bargaining power. The "gains from trade" thesis assumes $d$ is a natural state (e.g., "war of all against all"). If $d$ is strategically manipulated (e.g., "I will threaten to burn the world unless you concede"), the **Nash Bargaining Solution** rewards threat capability. The vocabulary captures this (via $d$), but the *normative* thrust of the rationalist thesis usually ignores that $d$ is contestable.

  #### 3. Incommensurability vs. NTU
  The framework treats incommensurability as **Non-Transferable Utility**.
  *   **The Blind Spot:** True moral incommensurability suggests that the utility space $\mathbb{R}^n$ is the wrong codomain. It suggests a partial ordering where some outcomes are simply **unranked**, not ranked with different intensities. The utility framework forces a completion of the preference ordering. By forcing $u_i(x) \in \mathbb{R}$, the vocabulary *denies* the possibility of genuine incommensurability by fiat.

  ---

  ### IV. Burden of Proof: Vocabulary vs. Thesis

  You asked whether the residue indicts your vocabulary or shows the original thesis was thinner than it sounds.

  **Verdict:** The residue indicts the **original thesis**, not the vocabulary.

  1.  **The Vocabulary is Adequate for the Claim:** Your vocabulary is precise enough to show *exactly* where the thesis breaks. It successfully identifies that the thesis requires:
      *   Cardinal utility (for NBS).
      *   Concave Pareto frontiers (for gains from compromise).
      *   Dynamic consistency (SWF over policy mixing).
      *   Exogenous preferences (for "better off by their own lights" to hold).

  2.  **The Thesis is Thin:** The rationalist "moral trade" argument relies on the intuition of economic trade (I give you apples, you give me oranges) but applies it to domains where:
      *   Property rights over outcomes are undefined.
      *   Utility functions are not stable (identity is at stake).
      *   The "disagreement point" is often morally catastrophic (making any $x^*$ look good by comparison, a form of coercion).

  3.  **Where the Burden Lies:**
      *   **On the Proponents:** To demonstrate **preference stability**. They must show that $u_i$ does not endogenously shift in response to the compromise $x^*$ in a way that negates the ex-ante gains. If compromising a value degrades the agent's capacity to enjoy the "win" on other values, the trade is utility-negative.
      *   **On the Vocabulary:** None. The vocabulary correctly flags this as a **mechanism design problem with endogenous types**. If the type ($u_i$) changes based on the allocation ($x$), standard mechanism design fails.

  **Conclusion:** The "gains from trade" picture is a **static, one-shot NTU bargaining solution** masquerading as a dynamic moral principle. It holds only if agents are **preference-rigid** (deontological constraints are just high costs) and **identity-stable** (compromise does not alter the utility function). Your vocabulary exposes these assumptions; it does not hide them. The "residue" is not a failure of the math, but a failure of the moral intuition to survive contact with the math.
