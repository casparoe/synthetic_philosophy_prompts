  This denial of closure is the price I pay to save knowledge from scepticism, and I pay it willingly. If closure held, Vera's knowledge of the vials would force her to know the non-substitution claim, which she cannot track, thereby destroying her ordinary knowledge too. I would rather accept that deduction does not always extend knowledge than admit we know nothing at all. As for your second charge, that my own argumentative practice undermines itself by relying on deduction whilst denying its power to transmit knowledge: this is the stronger objection, and I shall leave it until later. I want to ensure we have exhausted the implications of the Vera case first, for if you concede that knowledge fails to close in empirical instances, the meta-epistemological worry becomes a matter of distinguishing philosophical theory from ordinary reasoning. I am not evading it; indeed, I accept that I owe you an account of adherence that bears that weight, but let us settle the ground here before I offer a defence of the theory's own epistemic status.
