answer: |-
  You have identified one of the oldest and most persistent structural problems in metaphysics. While there is no single, standardized rhetorical term (like *ad hominem*) for this specific *sequence* of moves, the underlying difficulty is a named and well-documented philosophical problem.

  The problem you are describing is **Bradley's Regress** (named after the idealist philosopher F.H. Bradley), often discussed in the context of **The Unity of the Proposition** (Bertrand Russell) or the **Binding Problem** in mereology.

  However, you are asking specifically about the *argumentative maneuver* used to escape the regress: the shift from positing a connector as an *entity* to redefining it as a *constitutive principle*.

  ### 1. The Established Context: Bradley's Regress
  The logical structure you identified is the engine of **Bradley's Regress**.
  1.  **Premise:** A relation $R$ connects particulars $a$ and $b$.
  2.  **Challenge:** If $R$ is a distinct entity (a "relatum"), it needs a further relation $R'$ to connect it to $a$ and $b$.
  3.  **Regress:** $R'$ needs $R''$, and so on *ad infinitum*.
  4.  **The Move:** To stop the regress, the philosopher claims $R$ is not a distinct entity but an "internal relation," a "nexus," or a "tie" that does not itself require connecting.

  ### 2. Is There a Name for the Move?
  There is no single Latin name for the *shift* itself, but in contemporary metaphysics, it is often referred to as the transition from **Relatum to Relation** or the **Reification/De-reification Shift**.

  Critics of this move (such as Russell in his early work, or modern nominalists) often accuse it of being a **Category Mistake** (Gilbert Ryle) or **Special Pleading**.
  *   **Special Pleading:** The rule is "all distinct items require a binder." Item C is introduced as a distinct item, but when challenged, it is exempted from the rule without independent justification.
  *   **Category Mistake:** Treating a logical operator (the binding) as a logical object (the binder), and then trying to treat it back again as an operator when the consequences become untenable.

  ### 3. Proposed Term: "The Constitutive Pivot"
  Since no precise term exists for the *dialectical sequence* you described, I propose the term **"The Constitutive Pivot."**

  **Definition:** The Constitutive Pivot occurs when an arguer posits an element $C$ to explain the unity of $A$ and $B$ (treating $C$ as an external cause or binder), but upon facing a regress objection, redefines $C$ as internal to or constitutive of $A$ and $B$ (treating $C$ as a non-separate principle), thereby claiming $C$ does not require its own explanation.

  **Boundary Conditions:**
  For a move to count as *The Constitutive Pivot*, it must satisfy three conditions:
  1.  **Initial Reification:** $C$ is initially introduced in language or concept as a distinct component comparable to $A$ and $B$ (e.g., "the glue," "the contract," "the syntax").
  2.  **Regress Threat:** The opponent demonstrates that treating $C$ as a component generates an infinite regress of connectors.
  3.  **Ontological Retreat:** The defender changes the ontological status of $C$ to block the regress, asserting $C$ is not a component but a mode of being, a form, or an internal relation.

  ### 4. Distinguishing from Equivocation or Changing the Topic
  This is not ordinary **equivocation** (using the same word with two meanings) because the term for $C$ (e.g., "relation," "form," "structure") often remains constant. It is not simply **changing the topic** because the defender claims to be explaining the *same* phenomenon (the unity of the whole).

  It is best distinguished as **Ontological Special Pleading**.
  *   **Equivocation:** "Bank" (river) vs. "Bank" (money).
  *   **Constitutive Pivot:** "Relation" (as a thing that connects) vs. "Relation" (as a way things are).
  *   **The Difference:** In equivocation, the ambiguity is usually accidental or linguistic. In the Constitutive Pivot, the shift is *functional*: it is deployed specifically to halt a regress that threatens the theory.

  **How to test if it is legitimate:**
  A legitimate version of this move occurs when the ontological distinction is established *prior* to the regress objection.
  *   **Legitimate:** Aristotelian Hylomorphism. Matter and Form are distinct principles from the start. Form is *never* treated as a "part" in the same way matter is. There is no pivot because Form was never reified as a binder in the first place.
  *   **Illegitimate (The Pivot):** "The sentence is unified by a grammatical rule (Item C)." -> "Wait, what connects the rule to the words?" -> "The rule isn't a thing, it's just how the words behave." (Here, the rule was reified as an explainer, then de-reified as a shield).

  ### 5. Genuine Counter-Examples
  To prove a theory avoids *The Constitutive Pivot*, it must adopt one of the following stances consistently:

  1.  **Monism / Priority Monism:** Deny that $A$ and $B$ are fundamental. The Whole is primary; $A$ and $B$ are abstractions. No binder is needed because there are no separate parts to bind. (e.g., Spinoza, Schaffer).
  2.  **Infinitism:** Accept the regress. Admit that $A$ and $B$ are connected by $C$, which is connected by $D$, *ad infinitum*, and argue this is not vicious. (Rare, but logically consistent).
  3.  **Brute Factism:** State from the outset that composition is primitive. "A and B form a whole. There is no C. It is a brute fact." This avoids the pivot because no $C$ is ever posited. (e.g., Van Inwagen's "Special Composition Question" answers).
  4.  **Consistent Hylomorphism:** As mentioned above, if "Form" is defined from the start as *actuality* rather than *entity*, no pivot occurs. The Form is not a "third thing"; it is the way the matter exists.

  ### Summary
  You have correctly identified a structural weakness in many metaphysical systems. The established name for the *problem* is **Bradley's Regress**. The established name for the *ontological distinction* they rely on is **Internal vs. External Relations**.

  But the *argumentative sequence* you described—the reification of a binder followed by its de-reification to stop a regress—is best labeled **The Constitutive Pivot**. It should be treated as a form of **Special Pleading** unless the theorist can demonstrate that the "constitutive" status of $C$ was part of their ontology *before* the regress objection was raised.
