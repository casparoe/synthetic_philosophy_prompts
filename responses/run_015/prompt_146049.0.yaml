answer: |-
  # ADVERSARIAL COLLABORATION: THE EPISTEMOLOGY OF CHESTERTON'S FENCE
  **Parties:** The Custodian (Party A) & The Revisionist (Party B)
  **Subject:** The Presumption Regarding Inherited Social Arrangements

  ## I. AGREED PREMISES

  The undersigned parties, having disputed the normative force of the principle known as "Chesterton's Fence," agree to the following substantive claims. These are not mere pleas for caution; they are commitments regarding the structure of social knowledge and the risks of intervention.

  1.  **The Opacity of Complex Systems:** Social institutions function within complex causal networks where the downstream effects of any single rule are rarely fully transparent to participants. Both parties agree that ignorance of a rule's total function is the default state for any individual agent, regardless of their stance on reform.
  2.  **The Attribution Problem:** In complex systems, attributing a specific harm to a specific cause is epistemically difficult. Both parties agree that harms resulting from *removal* (counterfactual losses, system destabilization) often have a different epistemic profile than harms resulting from *retention* (visible injustices, inefficiencies), specifically regarding the latency and diffuseness of the damage.
  3.  **Survival as Data, Not Endorsement:** Both parties agree that an arrangement's historical survival is *data* that must be accounted for, but they disagree on the inference to be drawn (see Section II). Both agree that survival indicates the arrangement has not yet triggered a collapse of the host system, but this does not certify the arrangement as just, optimal, or functionally necessary.
  4.  **The Bidirectional Burden:** Both parties agree that proposals for change require a rationale. Conversely, both parties agree that the status quo is not immune from scrutiny; when a retention cost is visible and recurring, the burden shifts to the custodian to explain why the cost is necessary.
  5.  **Qualifications on Shared Claims:**
      *   *On Attribution Asymmetry:* Party B signs Claim 2 only on the condition that "different epistemic profile" does not imply "harder to detect." Party B maintains that retention harms (e.g., opportunity costs, entrenched oppression) are systematically under-detected due to normalization, making them epistemically opaque in a manner comparable to removal harms.
      *   *On the Selection Claim:* Party B signs Claim 3 only on the condition that "data" includes evidence of power dynamics and inertia, not merely functional adaptation. Party B denies that survival selects for *benefit*; Party A denies that survival selects for *nothing but* power.

  ## II. CRUXES OF DISAGREEMENT

  The following table records the substantive disagreements that remain after establishing the premises above. Each formulation is written to be acceptable to the respective party without straw-manning.

  | Crux | Custodian (Party A) Formulation | Revisionist (Party B) Formulation | Status |
  | :--- | :--- | :--- | :--- |
  | **1. The Weight of Survival** | Survival is a weak prior for latent function. An arrangement that has persisted likely solves a coordination problem or mitigates a risk that is not immediately visible to the reformer. | Survival is a weak prior for latent *compatibility*. An arrangement that has persisted has merely not yet destroyed the system; it may persist due to inertia, rent-seeking, or the suppression of dissent. | **Genuine.** Disagreement over the default inference from existence. |
  | **2. The Default Burden** | The burden of proof lies asymmetrically on the remover. One must demonstrate understanding of the fence's function before removal is permissible. | The burden of proof is symmetric. One must demonstrate that retention is justified by current function, not historical pedigree. | **Genuine.** Disagreement over the null hypothesis (Is the fence safe until proven dangerous, or dangerous until proven safe?). |
  | **3. Understanding vs. Mechanism** | To "understand" a practice is to grasp its *telos* (purpose) within the broader tradition. A mechanism story without a purpose is insufficient justification for removal. | To "understand" a practice is to grasp its *causal mechanism* (how it works now). A purpose story without a mechanism is mystification. | **Genuine.** Disagreement over what counts as knowledge. |
  | **4. Scope (Commission vs. Omission)** | The principle applies to existing structures. We are custodians of what *is*. Absence of a rule is not a "fence" to be defended. | The principle applies to institutional inertia. The absence of a safety register is a structural feature maintained by the same forces that maintain rules. | **Genuine.** Disagreement over the ontology of the "fence." |
  | **5. Reversibility** | Reversibility does not solve the epistemic problem. Interim damage to trust, legitimacy, or coordination may persist even if the rule is reinstated. | Reversibility solves the risk problem. If a change can be undone upon failure, the epistemic burden is lowered to the cost of the trial. | **Verbal/empirical.** Disagreement over whether "damage" is reversible. If damage is irreversible (e.g., loss of trust), A is right. If damage is material only, B is right. |

  ## III. APPLIED CASES

  The parties agree to submit the following four cases to the framework above. For each case, the parties record their predictions in advance.

  **Case I: The Licensing Syllabus**
  *A rule requires examination changes to be read at two consecutive quarterly meetings. Origin is unknown. Effect: Six-month delay in updating obsolete material. Testimony suggests this prevents vendor capture.*
  *   **Custodian Prediction:** The delay is a functional feature, not a bug. Removing it will increase syllabus volatility and vendor influence, even if the material is temporarily obsolete. The "cooling-off" function outweighs the obsolescence cost.
  *   **Revisionist Prediction:** The delay is a friction cost with no current function. Vendor capture is a hypothetical risk; obsolete licensing is a visible harm. The testimonial evidence is post-hoc rationalization for inertia.
  *   **Deck Note:** This case favors the Custodian, as it provides a specific latent function (cooling-off) for an obscure rule.

  **Case II: The Unbuilt Fence**
  *The licensing body has no conflicts-of-interest register. Does the principle protect this omission?*
  *   **Custodian Prediction:** The principle does not apply. We are not responsible for fences that were never built. The burden is on those who want a register to prove its necessity.
  *   **Revisionist Prediction:** The principle must apply to omissions. The absence of a register is a stable institutional feature maintained by inertia. If survival confers presumption, the *absence* has survived as long as the *presence* of other rules.
  *   **Deck Note:** This case favors the Revisionist, as it highlights the asymmetry in how Custodians treat presence vs. absence.

  **Case III: The Discredited Origin**
  *A two-sponsor rule originated to exclude a specific group. Origin is known and condemned. Present effects are unstudied.*
  *   **Custodian Prediction:** Origin does not negate current function. A tool forged for a bad purpose may have been repurposed for a good one (e.g., ensuring commitment). The burden remains on the remover to show it is currently harmful.
  *   **Revisionist Prediction:** Discredited origin shifts the burden to the defender. If the fence was built to keep people out, it is guilty until proven innocent. Knowledge of provenance tells us the "selection pressure" was malign, not functional.
  *   **Deck Note:** This case favors the Revisionist, as it attacks the "Selection Claim" by introducing malign selection pressures.

  **Case IV: Full Reversibility**
  *The Revisionist proposes a repeal for a fixed term, staged by jurisdiction, with automatic reinstatement on failure.*
  *   **Custodian Objection:** The Custodian objects. This confirms the quarrel is about the **unmeasurability of the relevant function**. The Custodian holds that the act of repeal itself damages the normative authority of the institution, a harm that is not captured by "failure metrics" and is not reversed by reinstatement.
  *   **Revisionist Objection:** The Revisionist does not object to this design. If the Custodian objects here, the Revisionist concludes the Custodian's position is not about evidence or risk, but about the **sacralization of the status quo**.
  *   **Deck Note:** This case is designed to force a revelation of the underlying motive. It stacks the deck against the Custodian by removing the "irreversibility" defense.

  ## IV. NOTE ON DOXASTIC ANALOGY

  *This section is included only if the analogy between social reform and belief revision earns its place.*

  The parties agree that no direct analogy holds for individual belief; social practices involve coordination costs and externalities that private beliefs do not, making the "burden of proof" for belief revision fundamentally different from institutional reform.

