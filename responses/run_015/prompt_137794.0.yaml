      *   **POV/Tense:** Third person, past tense.
      *   **Constraints:**
          *   Pure fiction (no preface, afterword, footnotes).
          *   No explicit philosophical explanation (show, don't tell).
          *   No citations, names of real philosophers, books, or schools of thought.
          *   Recognizable to experts only through staging.
          *   Specific Plot Elements:
              *   Two field researchers studying migratory moths.
              *   Key organ: "the spindle" (paired).
              *   Original function: Detect parasitoid wasp wingbeat -> drop reflex.
              *   Wasp extinct (within researchers' lifetimes), but archive recordings exist -> moths still drop.
              *   Complication 1: Spindle now fires to infrasound of squall lines (storm survival). Shift incomplete (some broods still respond to wasp freq).
              *   Complication 2: Nearby population has spindle as fusion of wasp-detector + barometric drift organ (two ancestral jobs).
              *   Complication 3: Island population (no wasp history) has spindle via different mutation, also drops to recording.
              *   Practical Stakes: Seismic survey (airgun arrays) during migration. Injunction depends on whether moths are "getting the world wrong" (error) vs. "responding correctly to hostile environment."
              *   Conservation Mandate: Funded to preserve ancestral migration, not storm-sheltering.
              *   Ending: No winner, no agreement, no dissolution. Final sentence must be a concrete image.
              *   Vocabulary: Avoid technical terms (content, representation, proper function, teleology, selected effect, teleosemantics). Use ordinary language.

  2.  **Deconstruct the Philosophical Problem (Teleosemantics):**
      *   *Core Issue:* What determines what a mental state (or biological signal) is *about*? Is it what it was selected for in the past (historical function), or what it currently does (current utility)?
      *   *The Error Problem:* If a mechanism fires in a new context (e.g., recording of extinct wasp), is it misrepresenting the presence of a wasp (error), or is it correctly representing the presence of that sound (whatever the cause)?
      *   *Complication 1 (New Function):* If the mechanism now saves them from storms, is its "meaning" now "storm" instead of "wasp"? If it's indeterminate (some do, some don't), how do we define the norm?
      *   *Complication 2 (Multi-function/Fusion):* If the organ does two things historically, which one defines the content?
      *   *Complication 3 (Convergent Evolution/No History):* If an island population has the same response without the history, does the history matter at all?
      *   *The Stake:* Legal/Conservation action. If the moths are "mistaken" by the airguns (mimicking wasp/storm sounds), they are being harmed by confusion (protectable?). If they are just reacting to a noise that kills them, is it natural selection taking its course? The mandate specifies *ancestral* migration, complicating the "new function" argument.

  3.  **Character Development:**
      *   Need two researchers with opposing views. Let's call them Elias and Mara.
      *   Elias: Focuses on history/origin (Historical/Selected Effect view).
      *   Mara: Focuses on current utility/structure (Role/Systemic view).
      *   Setting: A field station, windy, near a migration path.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Establish the setting, the moths, the spindle, and the extinct wasp. Show the playback experiment.
      *   **Complication 1 (Storms):** Introduce the infrasound connection. The conflict begins: is it a wasp detector or a storm detector?
      *   **Complication 2 (Fusion/Nearby Population):** Discuss the barometric fusion. Deepens the ambiguity of "what it is for."
      *   **Complication 3 (Island):** The island moths. Challenges the necessity of history.
      *   **The Climax/Stake:** The seismic survey. The injunction decision. The mandate conflict.
      *   **Resolution:** No agreement. The decision hangs or is made ambiguously.
      *   **Final Image:** Concrete visual.

  5.  **Word Count Management:**
      *   Need to expand descriptions and dialogue to hit 1,200-1,800.
      *   Ensure the philosophical tension is felt through the argument about the injunction and the nature of the moth's reaction.

  6.  **Refining the Philosophy (without naming it):**
      *   Elias argues: It's about what made the organ exist. The wasp made the spindle. If it fires without a wasp, it's a mistake. The airguns cause mistakes.
      *   Mara argues: It's about what the organ does now. It saves them from storms. The airguns are just another noise. If they die, they die. The mandate is about the *migration*, but the behavior is changing.
      *   The Island problem: Elias says history matters. Mara says structure/function matters.

  7.  **Drafting - Step-by-Step:**

