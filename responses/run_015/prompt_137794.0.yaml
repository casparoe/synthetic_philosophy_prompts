answer: |-
  The recording clicked, a static hiss followed by a rhythmic thrumming that sounded like wet leather striking stone. In the glass cage, the moth froze. Its antennae twitched once, twice, and then the wings folded tight against its body. It dropped from the mesh ceiling to the floor of the enclosure, lying still as a dead leaf.

  Elias watched the monitor, his finger hovering over the stop button. "There it is," he said. "The ghost triggers the reflex."

  Mara leaned over the table, adjusting the focus on the camera. "The ghost is gone, Elias. The wasp hasn't existed for fifteen years. All that exists is the sound."

  "The sound is a lie," Elias said, turning to face her. "The spindle fires because it was built to find a wasp. No wasp means the signal is false. The moth is acting on a mistake."

  They were alone in the field station, the wind battering the corrugated iron roof. Outside, the migration was beginning. Thousands of the moths were rising into the dark, guided by instincts carved over millennia. The spindle, a small paired organ nestled in the thorax, was the key. For thousands of generations, only moths that heard the parasitoid wasp and dropped survived. The spindle was shaped by that death. Now, the wasp was extinct, wiped out by a changing climate within Elias and Mara's own lifetimes, but the archive recordings remained. When played, the moths dropped.

  "It's not a mistake if it keeps them alive," Mara said, straightening up. She walked to the window, looking out at the treeline. "Look at the weather data. Those low frequencies you're playing? They match the infrasound of the squall lines that hit this region every autumn."

  Elias frowned. "The wasp frequency is specific."

  "It's close enough to the storm," Mara countered. "We've tracked the broods that respond to the playback. When a squall comes, they drop. They hide in the leaf litter. The ones that don't respond get shredded by the wind or drowned. The spindle isn't just remembering the past; it's saving them from the present."

  "But not all of them," Elias said, returning to the data stack. "That's the problem. Thirty percent of the new broods still ignore the infrasound. They only drop for the specific wasp frequency in the archive. The shift is incomplete. We don't know when it started, and we don't know when it will finish. So what is the spindle for? Is it a storm detector that hasn't finished updating, or a wasp detector that's becoming obsolete?"

  "It's a survival tool," Mara said. "What it represents is whatever keeps the moth breathing."

  "It represents what made it," Elias insisted. "If I build a trap to catch mice, and a bird gets caught in it, the trap didn't change its purpose. It's still a mouse trap. The moth is reacting to a signal that means 'wasp,' even if the wasp isn't there. That is an error. And if the seismic survey starts next week, those airguns will scream like a thousand wasps."

  The seismic survey was the shadow hanging over the station. An energy company planned to run airgun arrays along the migration corridor during the peak week. The noise was deafening, a percussive boom that traveled through the air and ground.

  "If the moths are making a mistake," Elias continued, pacing the small room, "then the airguns are inducing a mass error. They'll drop into the litter right under the machinery. They'll be crushed because their own nerves are lying to them. We have grounds for an injunction. We can claim the survey disrupts their biological truth."

  Mara shook her head. "If the spindle is now a storm detector, then the airguns are just loud weather. If they drop, they are responding exactly as their states bid them to respond to a hostile environment. That's not error. That's selection. If they die, they die. We can't stop natural violence just because it's man-made."

  "And our mandate?" Elias asked, his voice tightening. "We are funded to preserve the ancestral migration. Not the storm-sheltering behavior. If the spindle is changing, if the behavior is shifting from migration to hiding, we are watching the thing we were paid to protect disappear. If the airguns accelerate that, are we protecting the migration or the moths?"

  "It gets worse," Mara said, pulling a folder from the stack. "Look at the samples from the northern valley."

  Elias took the folder. The histology slides showed the spindle structure in cross-section. "It's larger."

  "It's a fusion," Mara said. "In that population, the spindle developed from two ancestral organs. One was the wasp detector. The other was a barometric sensor used for timing the migration ascent. In these moths, a single state type has two ancestral jobs. It measures pressure to fly, and sound to drop. Which job defines what the signal means? If the airgun sounds like a wasp but feels like a storm, which instruction wins?"

  Elias rubbed his temples. "History defines it. The wasp pressure was the lethal one. The barometer just timed the trip. The drop reflex is the wasp's legacy."

  "But the northern moths survive storms better than anyone," Mara said. "The fusion makes them harder to kill. If we say the meaning is fixed by the wasp, we ignore half the organ's history. If we say it's fixed by the storm, we ignore the origin."

  "There's one more thing," Mara said, her voice dropping. She opened a laptop and turned the screen toward him. Data from the island population scrolled across the display. "The island colony. Founded fifty years ago by moths that blew off course. There were never wasps on that island. Not once."

  Elias scanned the report. "Then what shaped the spindle?"

  "A different mutation," Mara said. "Random drift. No predator pressure at all. But when we played the archive recording—the wasp sound—they dropped. Same reflex. Same organ shape, different genetic path. No wasp in their history at all."

  Elias stared at the screen. "If there was no wasp, then the spindle wasn't selected for wasp detection there. It just happened. And yet it works."

  "So history isn't necessary," Mara said. "If the island moths react to the sound without the history, then the history doesn't define the meaning. The structure defines the meaning. The airguns trigger the structure. It's not a lie. It's just a reaction."

  "If history doesn't matter, then nothing matters," Elias said, his voice quiet. "Then the spindle is just a piece of meat vibrating in the air. There is no right or wrong response. There is only cause and effect. If that's true, we can't file the injunction. We can't claim they are being misled. They are just being broken."

  "And if history does matter?" Mara asked. "Then the island moths are a glitch. But they are alive. And the mainland moths are changing. The wasp is gone. The storm is here. The organ is merging. The history is fracturing."

  They sat in silence as the wind howled outside. The seismic trucks were scheduled to arrive in four days. The injunction needed both signatures. If they filed, they claimed the moths were victims of a biological trick, entities capable of being wrong about their world, deserving protection from the noise that exploited that error. If they didn't file, they admitted the moths were merely machines reacting to force, and the noise was just another force, like the wind or the rain.

  Elias looked at the cage. A moth had awakened from the drop. It was cleaning its antennae, preparing to fly again. It had survived the false alarm.

  "The mandate," Elias said finally. "We are to preserve the ancestral migration. If the spindle is becoming a storm shelter, the migration is already lost. The airguns won't kill the behavior; the weather already did."

  "But if they drop for the airguns, they don't migrate," Mara said. "They stay in the dirt. The survey stops the movement."

  "Because of a mistake," Elias said. "Or because of a choice?"

  "We can't know," Mara said. "The broods are split. The organs are fused. The islanders have no past. We don't know what the moth thinks the sound is. We only know it drops."

  Elias picked up the pen. He hovered it over the injunction form. The paper was white, stark under the fluorescent light. He looked at Mara. She looked back, her arms crossed, her face unreadable. Neither would sign. Neither would yield. To sign was to decide what the moth was, to freeze a moving target into a definition that would inevitably be wrong. To not sign was to let the airguns scream into the dark and count the bodies afterward.

  Elias put the pen down. He walked to the cage and opened the latch. The moth flew out, buffeted by the draft from the window seal, and vanished into the shadows of the rafters.

  Outside, the first boom of the survey test echoed across the valley, shaking the dust from the shelves.
