prompt: |-
  I staff a standing committee at a private American university that adjudicates petitions about wrongs the institution inherited rather than committed. Typical petitions ask that a building named for a nineteenth-century donor be renamed, that a collection of ancestral remains be repatriated, that the university apologize for and make material amends for a historical expropriation of land, that a scholarship be endowed for the descendants of a group the university excluded, or that it do several of these at once. We meet monthly and handle fifteen to twenty petitions a year; each one produces written findings with reasons that go to the board of trustees, which has the final say. The committee has five members — a historian, a university lawyer, a faculty member, a student, and an alumni trustee — none of them a philosopher. Findings have to be drafted within about three weeks, be readable by someone with no training in the relevant literature, be consistent with what we have decided before, and survive being published. There is essentially no legal mandate behind any of this: in almost every case we are deciding what we owe, not what we are compelled to do.

  What I need is a decision procedure, not a position paper. Concretely: an ordered set of questions a member can run through on a petition, what counts as a sufficient answer to each one, the points at which the procedure stops with a no and issues a short finding, and the points at which it stops and hands the decision to a person because the open question is one of values rather than fact.

  Several things make this harder than it looks, and I want the procedure to handle them rather than hand-wave them.

  First, petitions and press coverage run together four questions that I think have different answers and different conditions: whether the university should acknowledge that a wrong occurred and that it stands in some relation to it; whether it owes anyone anything, and what kind of thing (return of a specific object, repair, money, a program); whether it may or must apologize, and who is in a position to apologize for what; and whether it is entitled to describe itself as guilty. Please keep these separate, with separate conditions, and say which of them can be inherited across generations and which cannot.

  Second, continuity. The institution routinely gets to be the same entity that owns a two-hundred-year-old endowment and a different entity when asked about the wrong that funded it. I want a continuity test that forbids that asymmetry, with sub-questions that a non-specialist can actually answer from an archivist's memo: legal and charter continuity; asset continuity; whether the wrong was done by someone acting in the institution's name or with its resources; whether it was ratified at the time or later, or condemned at the time and merely tolerated; and whether the institution still holds a benefit it would not hold but for the wrong. I also want the procedure to treat present-tense honoring — a name on a building, a portrait, a named chair — as a present act rather than a mere inheritance, and to say what follows from that.

  Third, the wronged party and its successors. Some of our cases have an identifiable successor (a federally recognized tribe, a family whose land was taken); some have a dispersed successor set; some have rival claimants. Say what the procedure does when the successor set is contested, and what kinds of remedy remain available, or stop being available, when nobody can be identified to receive one. Relatedly: some wrongs are over and done with, and some are still going on — an object still held against a continuing objection, an exclusion still reproduced in present admissions or hiring patterns. Cases of the second kind need no theory of inherited guilt at all, and I want that recognized early in the procedure rather than buried.

  Fourth, evidence and burden of proof. The university controls the archive, and in many cases the record is simply silent about the thing that matters. State where the burden lies, what the default is when the record is silent, and whether silence is a no or a maybe-and-then-what.

  Fifth, adequacy of a remedy. I want a test for the failure mode where the institution buys public credit with a gesture that costs it nothing — a plaque, a land acknowledgment, a renaming that a donor's family had stopped caring about — and I want a test for the opposite failure mode, where the procedure ratchets toward whatever the most demanding petition asks for. Tell me how to check whether a proposed remedy is one the successor group would accept, and who is actually bearing its cost.

  Sixth, precedent and cost. "If we do this we will get forty more" is a real consideration for a committee with a finite budget and a board that reads the newspapers, and it is also an easy way to do nothing. Say how floodgates may and may not enter the procedure, and include a consistency check against decisions the university has already made.

  I know the fourfold distinction among criminal, political, moral, and metaphysical guilt that Jaspers drew in his postwar writing on German guilt, and giving me those four labels back is not a procedure. But if one of them is doing real work at a particular step — for instance, if moral guilt is the one that cannot be inherited while something like political liability can — say which step it does the work in and what work it does there.

  Please then run the finished procedure on three petitions in front of us:

  1. A building named for an alumnus merchant whose fortune came from a firm that financed plantation mortgages in the 1840s and 1850s. His gift endowed a chair that is still funded from the original principal. The petition asks that the name come off and that the endowment be redirected to scholarships for descendants of the enslaved people on those plantations. The donor's family currently gives to the university separately and has told us privately that a separate large bequest will be withdrawn if the name comes down.

  2. A teaching collection of ancestral remains and sacred objects taken in the 1920s by a professor working with university funds and university transport, whose field notes record the objections of the community at the time. A federally recognized tribe has requested repatriation of everything. Some of the individuals in the collection cannot be confidently affiliated with any present-day group.

  3. A national organization demanding that the university, as an American institution, formally accept guilt for slavery and contribute to a national reparations fund. There is no specific institutional act and no traceable asset; the benefit, if there is one, is the diffuse benefit of operating inside a slave economy and its aftermath.

  I expect at least one of these to come out somewhere my committee will not like — I would rather be told that than be told what we want to hear — and I expect the procedure to say plainly, somewhere, "this one is a values decision and the procedure stops here." Finally, tell me what the procedure cannot do: which cases it will systematically misdescribe, and where a committee using it should distrust its own output.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Role:** Staffer for a standing committee at a private American university.
      *   **Task:** Create a *decision procedure* (ordered set of questions, stopping points, criteria for sufficient answers), not a position paper.
      *   **Context:** Adjudicates petitions about historical wrongs the institution *inherited* rather than *committed* (though some overlap exists). 15-20 petitions/year. 5 members (historian, lawyer, faculty, student, trustee). No philosophers. Findings go to Board of Trustees.
      *   **Constraints:** Drafted in 3 weeks, readable by laypeople, consistent with precedent, public-facing. No legal mandate (moral/political obligation).
      *   **Specific Challenges to Address:**
          1.  *Four Distinct Questions:* Acknowledgment, Obligation/Remedy, Apology, Guilt. (Must separate conditions and inheritability).
          2.  *Continuity:* Avoid asymmetry (claiming assets but denying wrongs). Needs a test (legal, asset, agency, ratification, benefit). Present-tense honoring (names) is a present act.
          3.  *Successors:* Identifiable vs. dispersed vs. rival. Ongoing wrongs vs. historical wrongs.
          4.  *Evidence/Burden:* University controls archives. Silence = ?
          5.  *Adequacy of Remedy:* Avoid cheap gestures vs. ratcheting to max demand. Cost-bearing check.
          6.  *Precedent/Floodgates:* Consistency check. "Floodgates" argument handling.
      *   **Theoretical Constraint:** Do not just regurgitate Jaspers' four guilt types, but use the *logic* where applicable (e.g., moral guilt non-inheritable vs. political liability inheritable).
      *   **Deliverables:**
          1.  The Decision Procedure (flowchart-style logic).
          2.  Application to 3 Specific Cases.
          3.  Limitations/Misdescription analysis.

  2.  **Deconstruct the Decision Procedure:**

      *   *Structure:* Needs to be linear but allow for branching/termination.
      *   *Tone:* Administrative, precise, actionable.
      *   *Step 1: Triage (Ongoing vs. Historical).* Distinguish current harms from historical ones. This bypasses inheritance theory.
      *   *Step 2: Continuity & Connection.* Does the university actually stand in relation to the act? (The "Asymmetry Test").
      *   *Step 3: The Four Questions.* Separate Acknowledgment, Liability, Apology, Guilt.
      *   *Step 4: Successors & Standing.* Who gets the remedy? What if unknown?
      *   *Step 5: Remedy Calibration.* Proportionality, Cost, Acceptance.
      *   *Step 6: Precedent & Floodgates.* Consistency check.
      *   *Step 7: The Values Stop.* Where facts end and policy begins.

  3.  **Drafting the Procedure - Section by Section:**

      *   *Introduction:* Define the scope.
      *   *Phase 1: The "Ongoing Harm" Filter.* If the harm is current (e.g., remains still held, policy still exclusionary), skip inheritance logic.
      *   *Phase 2: The Continuity Test.* Address the asset/wrong asymmetry.
          *   Legal/Charter continuity.
          *   Asset continuity (do we still hold the money/land?).
          *   Agency (was it done in our name?).
          *   Ratification (did we keep the benefit knowing the source?).
      *   *Phase 3: The Four Distinct determinations.*
          *   Acknowledgment (Fact-based).
          *   Liability/Obligation (Benefit-based).
          *   Apology (Representative capacity).
          *   Guilt (Moral culpability - usually stops here for inheritance).
      *   *Phase 4: Successor Identification.*
          *   Identifiable -> Direct remedy.
          *   Dispersed/Unknown -> Public good remedy.
          *   Contested -> Pause/Neutral facilitation.
      *   *Phase 5: Remedy Adequacy.*
          *   Cost test (who pays?).
          *   Signal test (is it cheap talk?).
          *   Acceptance test (did successors agree?).
      *   *Phase 6: Precedent & Floodgates.*
          *   Distinguish relevantly similar cases.
          *   "Floodgates" is a resource constraint, not a moral veto.
      *   *Phase 7: The Values Handoff.* Explicitly state where the committee stops and the Board begins.

  4.  **Refining the "Four Questions" (Challenge 1):**

      *   *Acknowledgment:* Can be inherited if facts are established.
      *   *Liability:* Inherited if *benefit* is retained (Unjust Enrichment model).
      *   *Apology:* Can be inherited as *institutional regret* (Political), but not *personal remorse* (Moral).
      *   *Guilt:* Cannot be inherited (Moral/Criminal). Only the original actors are guilty. The institution can accept *responsibility* without accepting *guilt*.

  5.  **Refining Continuity (Challenge 2):**

      *   Need to make sure the "Asymmetry Test" is hard to game. If you keep the endowment, you keep the history attached to it.
      *   *Present-tense honoring:* Keeping a name up is an active choice every day. It requires active justification, not just passive inheritance.

  6.  **Refining Successors (Challenge 3):**

      *   If no successor, remedy shifts from "restitution" to "memorialization/prevention."
      *   Ongoing wrongs (like holding remains) don't need inheritance theory; they are current torts/ethical violations.

  7.  **Refining Evidence (Challenge 4):**

      *   Burden of Proof: Petitioner establishes prima facie case. University holds burden to disprove connection *if* archives are silent due to university negligence. Silence on *benefit* = assume benefit retained if asset exists. Silence on *wrong* = insufficient evidence for acknowledgment.

  8.  **Refining Remedy (Challenge 5):**

      *   Avoid "Virtue Signaling" (low cost, high PR).
      *   Avoid "Extortion" (high cost, no connection).
      *   Test: Is the cost borne by the institution (current budget) or the specific fund (restricted)?

  9.  **Refining Floodgates (Challenge 6):**

      *   Consistency is key. If Case A and Case B are factually similar, they must be treated similarly regardless of PR risk.
      *   Floodgates argument is valid *only* regarding resource allocation (Board decision), not moral logic (Committee finding).

  10. **Applying to the Three Cases:**

      *   *Case 1 (Plantation Mortgage Building/Chair):*
          *   Continuity: High (Asset still held, Chair funded).
          *   Wrong: Indirect financing (not slave trading, but supporting infrastructure).
          *   Remedy: Renaming (present act). Redirecting endowment (legal/ethical constraint).
          *   Values Stop: The threat of withdrawn funding is a Board-level risk assessment, not a Committee moral finding.
      *   *Case 2 (Ancestral Remains):*
          *   Ongoing Harm: Yes (possession continues).
          *   Continuity: High (Professor used uni funds/transport).
          *   Successors: Tribe (federally recognized) + Unaffiliated individuals.
          *   Remedy: Repatriation (mandatory for affiliated). Memorial/Trust for unaffiliated.
          *   Guilt: No moral guilt for current staff, but political liability for retention.
      *   *Case 3 (National Slavery Guilt/Fund):*
          *   Continuity: Low/None (No specific asset, no specific act).
          *   Wrong: Diffuse societal benefit.
          *   Liability: Too attenuated.
          *   Stop: This is a values/policy decision for the Board/President, not an adjudicated wrong. Committee should recommend "No Finding" on liability, maybe "Acknowledgment" of context.

  11. **Identifying Limitations (The "What it cannot do" section):**

      *   Cannot solve deep moral disagreements about *justice* vs. *charity*.
      *   Cannot force the Board to act.
      *   Struggles with "attenuated benefit" (Case 3).
      *   May underestimate emotional weight of "Guilt" language even if logically distinct.
      *   Relies on archival quality (garbage in, garbage out).

  12. **Review against Constraints:**

      *   *Decision Procedure?* Yes, step-by-step.
      *   *No Philosopher Jargon?* Used "Moral/Political" distinction practically, not theoretically.
      *   *Readable?* Needs clear headings and bold text.
      *   *Addresses all 6 challenges?* Checked against the list.
      *   *Three Cases Run?* Yes.
      *   *Limitations Included?* Yes.

  13. **Final Polish:** Ensure the tone is appropriate for a university committee staff document—professional, neutral, rigorous. (Self-Correction: Make sure the distinction between "Guilt" and "Responsibility" is sharp in the procedure, as that's a common failure point). Ensure the "Values Stop" is explicit in the case studies.

  14. **Drafting the Content:** (Proceeding to generate response based on these thoughts). *Wait, one nuance:* The prompt asks for "what counts as a sufficient answer." I need to be specific about evidence thresholds. *Also:* The prompt asks to identify where the procedure stops and hands to a person for values. I need to mark those clearly.

  *Refining the "Guilt" distinction:* Jaspers' *Political Guilt* is essentially liability for the deeds of one's state/institution. *Moral Guilt* is personal. The procedure should allow for *Political Responsibility* (we fix this because it's our institution) without *Moral Guilt* (I personally sinned). This solves the inheritance problem.

  *Refining the "Silence" issue:* If the archive is silent on the *source* of funds but the money is there, the benefit is real. If the archive is silent on the *harm*, the harm is unproven.

  *Refining the "Floodgates":* The Committee decides *principle*. The Board decides *capacity*. The procedure must make this boundary clear so the Committee doesn't dilute principles to save the Board trouble.

  *Let's write.*
answer: |-
  # DECISION PROCEDURE: ADJUDICATION OF HISTORICAL PETITIONS
  **Version:** 1.0 (Committee Staff Draft)
  **Purpose:** To provide a consistent, auditable logic for evaluating petitions regarding historical wrongs inherited by the institution.
  **Scope:** Applies to all petitions regarding acts predating current committee membership where no legal mandate exists.

  ---

  ## PHASE 1: TRIAGE (ONGOING VS. HISTORICAL)
  *Goal: Determine if inheritance theory is required. If the harm is current, inheritance logic is bypassed.*

  **Q1.1: Is the alleged wrong still actively occurring or maintained by the university?**
  *   *Examples:* Holding ancestral remains against known objections; maintaining an admissions policy explicitly derived from an exclusionary charter; displaying a symbol currently designated as hate speech by the affected group.
  *   **Sufficient Answer for "Yes":** Evidence that the university currently possesses the object, enforces the policy, or displays the symbol *and* that the affected party currently objects.
  *   **Procedure Action:**
      *   **If YES:** Proceed to **Phase 4 (Remedy)**. Do not apply Continuity Test (Phase 2). The obligation arises from the present act of retention/enforcement, not inheritance.
      *   **If NO:** Proceed to **Phase 2**.

  ---

  ## PHASE 2: CONTINUITY & ASYMMETRY TEST
  *Goal: Prevent the institution from claiming asset continuity while denying wrong continuity. Establish the link between the past actor and the present entity.*

  **Q2.1: Legal and Charter Continuity**
  *   **Question:** Is the current university the legal successor to the entity that existed at the time of the act?
  *   **Sufficient Answer:** Corporate charter records showing uninterrupted existence or explicit legal succession (merger/absorption).
  *   **Stop Condition:** If **No**, the petition is rejected. Finding: "No institutional continuity."

  **Q2.2: Asset Continuity (The "Benefit" Test)**
  *   **Question:** Does the university currently hold assets (endowment, land, buildings, collection) directly traceable to the act or the actor in question?
  *   **Sufficient Answer:** Financial audit or archival record linking the specific fund/property to the donor/act.
  *   **Burden of Proof:** If the asset exists but records on its source are silent/missing (University-controlled archive), presumption is that the asset remains a benefit of the institution's historical operations.
  *   **Stop Condition:** If **No** (no traceable asset/benefit), proceed to Q2.3. If **Yes**, institutional liability is established for Phase 3.

  **Q2.3: Agency and Ratification**
  *   **Question:** Was the act done by an agent of the university (faculty, officer) using university resources, OR was the act later ratified (accepted/benefitted from) by the university with knowledge of the wrong?
  *   **Sufficient Answer:** Payroll records, travel logs, board minutes accepting a gift with known conditions, or public defense of the act at the time.
  *   **Stop Condition:** If **No** (private act by private individual with no university ratification or benefit), the petition is rejected. Finding: "No institutional agency or ratification."

  **Q2.4: Present-Tense Honoring Check**
  *   **Question:** Does the petition concern a name, portrait, or honor currently displayed?
  *   **Logic:** Keeping a name on a building is a present-tense act of endorsement, not merely a passive inheritance.
  *   **Procedure Action:** If **Yes**, the burden shifts to the University to justify why the honor *should remain*, rather than the Petitioner to prove why it should *go*. This does not guarantee removal, but it prevents "inertia" from counting as a decision.

  ---

  ## PHASE 3: THE FOUR DISTINCT DETERMINATIONS
  *Goal: Separate the four questions often conflated in petitions. Each has different conditions for inheritance.*

  **Q3.1: Acknowledgment (Fact)**
  *   **Question:** Did the wrong occur, and does the university stand in relation to it?
  *   **Inheritance:** **Yes.** Facts do not expire.
  *   **Standard:** Preponderance of evidence from archives.
  *   **Output:** A statement of fact. (e.g., "The University holds funds derived from plantation mortgages.")

  **Q3.2: Liability/Obligation (Material)**
  *   **Question:** Does the university owe a material remedy?
  *   **Inheritance:** **Yes, conditional on Benefit.** Based on *unjust enrichment* (Political Liability), not moral sin. If the university kept the money/land, it inherits the obligation to address the source.
  *   **Standard:** Traceable benefit (from Phase 2).
  *   **Output:** Determination of whether restitution, repair, or program funding is owed.

  **Q3.3: Apology (Representative)**
  *   **Question:** Should the university apologize?
  *   **Inheritance:** **Yes, as Political Regret.** The institution can express regret for acts done in its name by its predecessors.
  *   **Constraint:** The apology must not claim *personal* moral guilt for current officers. It is an apology of *office*, not *conscience*.
  *   **Output:** Recommended text of apology (if any).

  **Q3.4: Guilt (Moral/Criminal)**
  *   **Question:** Is the university "guilty"?
  *   **Inheritance:** **No.** Moral and Criminal guilt (Jaspers' *Moralische* and *Strafrechtliche* Schuld) attach only to the individuals who committed the acts.
  *   **Procedure Stop:** If the petition demands the university declare itself "guilty" of a moral crime, the Committee must recommend against this phrasing.
  *   **Output:** Finding: "The University accepts *responsibility* for remediation but cannot accept *moral guilt* for acts it did not directly commit."

  ---

  ## PHASE 4: SUCCESSORS AND STANDING
  *Goal: Determine who receives the remedy. If no one can receive it, the remedy changes form.*

  **Q4.1: Successor Identification**
  *   **Category A: Identifiable.** (e.g., Federally recognized tribe, specific family).
  *   **Category B: Dispersed/Class.** (e.g., "Descendants of enslaved people").
  *   **Category C: Unidentifiable/None.** (e.g., No records, lineage lost).
  *   **Category D: Contested.** (e.g., Two groups claim the same remains).

  **Q4.2: Remedy Availability by Category**
  *   **If Category A:** Direct restitution/repatriation is the default.
  *   **If Category B:** Programmatic remedy (scholarships, research funds) is the default.
  *   **If Category C:** Memorialization or public good fund (cost borne by university). Restitution is impossible.
  *   **If Category D:** **Procedure Stop.** Committee cannot adjudicate rival claims to moral standing.
      *   **Action:** Pause finding. Recommend University facilitate dialogue between claimants. No remedy issued until standing is resolved.

  ---

  ## PHASE 5: REMEDY ADEQUACY AND COST
  *Goal: Prevent "cheap talk" and "extortion." Ensure the cost falls on the institution, not the victim.*

  **Q5.1: The "Virtue Signal" Test**
  *   **Question:** Does the proposed remedy cost the university nothing (e.g., a plaque, a land acknowledgment without policy change)?
  *   **Check:** If the remedy is purely symbolic *and* the wrong was material (theft, exclusion), the remedy is **Insufficient**.
  *   **Action:** Require material component (funding, return of asset).

  **Q5.2: The "Extortion" Test**
  *   **Question:** Does the remedy exceed the traceable benefit or the university's capacity?
  *   **Check:** If the petition asks for 100% of the endowment but the wrong funded only 10% of the building, the excess is **Unjustified** under this procedure.
  *   **Action:** Scale remedy to proportion of benefit retained.

  **Q5.3: The Cost-Bearer Test**
  *   **Question:** Who pays for the remedy?
  *   **Check:**
      *   If funds come from the *tainted endowment*: Restitution.
      *   If funds come from *current operating budget*: Repair/Amends.
      *   If funds come from *restricting future access* (e.g., closing a building): Ensure this does not harm current students disproportionately.
  *   **Values Stop:** If the remedy requires withdrawing funds that are legally restricted or threatens vital university operations, the Committee flags this for the **Board of Trustees**. The Committee decides *what is owed*; the Board decides *if the university can survive paying it*.

  **Q5.4: Acceptance Check**
  *   **Question:** Has the successor group indicated the remedy is acceptable?
  *   **Standard:** Written communication from authorized representatives.
  *   **Action:** If the successor group rejects the proposed remedy, the Committee must return to Phase 5. A remedy rejected by the victim is not a remedy.

  ---

  ## PHASE 6: PRECEDENT AND FLOODGATES
  *Goal: Ensure consistency without allowing resource fears to dictate moral findings.*

  **Q6.1: Consistency Check**
  *   **Question:** Have we decided a factually similar case differently in the last 5 years?
  *   **Action:** If **Yes**, the Committee must write a specific justification for the distinction. If no distinction exists, the prior precedent controls.

  **Q6.2: The Floodgates Argument**
  *   **Question:** Will granting this petition open the university to unsustainable liability (e.g., "40 more petitions")?
  *   **Procedure Rule:** This is **Not** a valid reason for the Committee to deny a finding of fact or obligation.
  *   **Action:** If the floodgates concern is resource-based, it is noted in the "Implementation Risks" section for the **Board of Trustees**. The Committee's finding on *obligation* remains unchanged.

  ---

  ## PHASE 7: THE VALUES HANDOFF
  *Goal: Explicitly mark where fact-finding ends and policy begins.*

  **Q7.1: The Stop Point**
  *   **Condition:** If the decision rests on weighing competing moral goods where no archival fact resolves the tension (e.g., "Is preserving this art more important than the pain it causes?"), the procedure stops.
  *   **Output:** "The Committee finds an obligation exists. The *form* of the remedy involves a value judgment regarding [Artistic Heritage vs. Community Harm] that exceeds the Committee's fact-finding mandate."
  *   **Action:** Recommendation is sent to the **Board of Trustees** with a clear statement: "This is a values decision."

  ---

  # APPLICATION TO PENDING PETITIONS

  ### CASE 1: The Plantation Mortgage Building & Chair
  *Petition: Remove name, redirect endowment to descendants of enslaved people.*

  *   **Phase 1 (Triage):** Historical wrong (1840s). Inheritance logic applies.
  *   **Phase 2 (Continuity):**
      *   *Legal:* Yes.
      *   *Asset:* **Yes.** Chair still funded from original principal. Building still stands.
      *   *Agency:* Donor acted privately, but University *ratified* by accepting funds and naming building.
      *   *Present Honoring:* **Yes.** Name remains on building. Active justification required to keep it.
  *   **Phase 3 (Four Questions):**
      *   *Acknowledgment:* **Yes.** Funds derived from slave economy infrastructure.
      *   *Liability:* **Yes.** Benefit retained (Chair/Building).
      *   *Apology:* **Yes.** Institutional regret for benefiting from slavery.
      *   *Guilt:* **No.** Do not use "guilty." Use "responsibility."
  *   **Phase 4 (Successors):** Category B (Dispersed descendants).
  *   **Phase 5 (Remedy):**
      *   *Renaming:* **Recommended.** Present-tense honor cannot stand given the acknowledgment.
      *   *Redirect Endowment:* **Legal/Values Stop.** If the endowment is legally restricted to the "Chair," the Committee cannot order redirection. It can recommend the *income* be used for scholarships, but the principal may be protected.
      *   *Cost-Bearer:* The donor family threat (withdrawing future bequest) is a **Board Risk**, not a Committee moral factor.
  *   **Phase 6 (Precedent):** Consistent with prior renaming cases where direct financial benefit was proven.
  *   **Phase 7 (Handoff):**
      *   **Committee Finding:** Name removal is owed. Scholarship program is owed from *income* if principal is restricted.
      *   **Values Decision:** Whether to risk the family's future bequest to fund the scholarship is a **Board Decision**. The Committee finds the obligation; the Board assesses the financial risk.

  ### CASE 2: Ancestral Remains & Sacred Objects (1920s)
  *Petition: Repatriation to Tribe.*

  *   **Phase 1 (Triage):** **ONGOING HARM.** Possession continues. Objection continues.
      *   *Action:* Bypass Phase 2 (Continuity). The act of *holding* is the wrong.
  *   **Phase 2 (Continuity):** (Skipped, but would pass). Professor used uni funds/transport.
  *   **Phase 3 (Four Questions):**
      *   *Acknowledgment:* **Yes.** Field notes record objections at the time.
      *   *Liability:* **Yes.** Retention of property against owner wishes.
      *   *Apology:* **Yes.** For ignoring contemporary objections.
      *   *Guilt:* **No.**
  *   **Phase 4 (Successors):**
      *   *Affiliated:* Federally recognized tribe (Category A).
      *   *Unaffiliated:* Individuals in collection (Category C).
  *   **Phase 5 (Remedy):**
      *   *Affiliated:* **Repatriation Mandatory.** No "Virtue Signal" test needed; this is a return of property.
      *   *Unaffiliated:* Cannot return to specific heirs. Remedy: Re-interment in neutral sacred ground or memorialization, cost borne by University (Category C logic).
  *   **Phase 6 (Precedent):** Consistent with NAGPRA standards (even if not legally bound).
  *   **Phase 7 (Handoff):** None. This is a factual obligation to return property.
      *   **Committee Finding:** Immediate repatriation for affiliated remains. Memorial fund for unaffiliated.

  ### CASE 3: National Slavery Guilt & Reparations Fund
  *Petition: Accept guilt for slavery, contribute to national fund.*

  *   **Phase 1 (Triage):** Historical.
  *   **Phase 2 (Continuity):**
      *   *Legal:* Yes.
      *   *Asset:* **No.** No traceable asset. "Diffuse benefit" of operating in a slave economy.
      *   *Agency:* **No.** No specific institutional act.
      *   *Ratification:* General operation, but no specific ratification of slavery itself.
  *   **Phase 3 (Four Questions):**
      *   *Acknowledgment:* **Yes.** University operated in slave economy.
      *   *Liability:* **No.** Under this procedure, "diffuse benefit" without traceable asset fails the Asset Continuity Test (Q2.2).
      *   *Guilt:* **No.** (See Q3.4).
  *   **Phase 4 (Successors):** Category B (National class). Too attenuated for direct remedy under this procedure.
  *   **Phase 5 (Remedy):**
      *   *Contribution:* Voluntary. Cannot be adjudicated as "owed" without traceable benefit.
  *   **Phase 7 (Handoff):** **Full Values Stop.**
      *   **Committee Finding:** "The Committee finds no specific institutional liability traceable to specific assets or acts. However, the University may choose to make a voluntary contribution as a matter of civic policy."
      *   **Reason:** This petition asks for *Political Solidarity*, not *Restitution*. The procedure adjudicates restitution.
      *   **Outcome:** Committee recommends **No Finding of Obligation**. The President/Board may choose to act, but it is not an adjudicated debt.

  ---

  # LIMITATIONS: WHAT THIS PROCEDURE CANNOT DO

  **1. It Cannot Solve "Attenuated Benefit" Cases (Case 3)**
  The procedure relies on *traceable assets* to establish liability (Phase 2, Q2.2). It will systematically reject claims based on general societal participation in unjust systems (e.g., "we benefited from slavery because everyone did"). This is a feature, not a bug, to prevent infinite liability, but it will be criticized as morally insufficient by petitioners seeking broad reparations.

  **2. It Cannot Force the Board to Pay**
  The procedure distinguishes between *obligation* (Committee) and *capacity* (Board). If the Board decides the university cannot afford the remedy (e.g., Case 1's threatened bequest), they can overrule the *implementation* but not the *finding*. This creates a risk of "acknowledged debt, unpaid bill," which may damage credibility.

  **3. It Relies on Archival Quality**
  The burden of proof regarding silence (Phase 2, Q2.2) assumes the archives are reasonably complete. If the university destroyed records to hide wrongdoing, the procedure might fail to find continuity where it actually exists. The Committee must distrust "silent" records in periods of known institutional turmoil.

  **4. It Depersonalizes Guilt**
  By strictly separating Moral Guilt from Political Responsibility (Phase 3, Q3.4), the procedure may feel cold to victims seeking moral validation. It offers *amends* without *confession of sin*. For some petitioners, this distinction is meaningless; they want the institution to say "We are bad," not "We are liable." The procedure cannot accommodate the demand for moral sin.

  **5. It Struggles with Contested Successors**
  Phase 4, Q4.2 (Category D) creates a deadlock. If two groups claim the same right (e.g., two tribes claiming the same remains), the procedure halts. It has no mechanism to arbitrate moral standing between third parties. It requires the University to become a mediator, which may be beyond its competence.

  **6. The "Present-Tense" Trap**
  Phase 2, Q2.4 treats keeping a name as an active act. This is logically sound but politically volatile. It means the Committee must review *every* building name periodically, not just when petitioned. If the Committee fails to do this, it risks inconsistency (why remove Building A but not Building B?). The procedure requires a proactive inventory it is not currently staffed to maintain.
