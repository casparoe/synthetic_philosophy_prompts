answer: |-
  **The Principle of Uncorrupted Authorization**

  **Consent is valid only if the researcher does not knowingly permit the patient's decision to rest on a falsehood or coercive pressure that would decisively alter their choice.**

  This principle treats consent not as a signature, but as a moral transaction. It demands that the "Yes" reflects the patient's actual will, not a will manufactured by your silence or their impairment. It collapses the distinction between lying and withholding decisive truth.

  ### The Verdicts You Must Drop

  To hold this principle, you must overturn two of your current judgments. You are confusing a *legal signature* with *valid consent*.

  1.  **Drop the verdict on the Funder (Scenario 4).** You called this **Valid**. It is **Invalid**.
      *   **Why:** You admit this is the "same shape" as the Specialist scenario (3). If a belief is false, you know it, and it is decisive to the patient (she would refuse if she knew), allowing her to sign is deception by omission. The source of funding is material when it triggers a moral boycott. Your silence corrupts her authorization.
  2.  **Drop the verdict on the Son (Scenario 2).** You called this **Valid**. It is **Invalid**.
      *   **Why:** "Do it to keep the doctor happy" implies a threat: non-compliance risks poor care. That is coercion. Because you overheard it and said nothing, you permitted the coercion to stand. Voluntariness is corrupted when the researcher witnesses undue influence and fails to mitigate it.

  *(Note on Scenario 8: You had no verdict. Under this principle, it is **Invalid**. If you are "fairly sure" the 'Yes' is driven by social obligation rather than genuine agreement, it is not voluntary. Relying on politeness is relying on a corrupted will.)*

  ### Rulings on Your New Scenarios

  Applying the Principle of Uncorrupted Authorization sharply:

  1.  **Broad Future Consent (Samples for any study):** **Invalid.**
      *   **Why:** A patient cannot authorize what they cannot understand. "Any future study" includes risks and purposes that are currently unknown. You cannot know if a future study would violate their values (e.g., genetic research, commercial profit). You are asking for a blank check, not informed authorization.
  2.  **Mistaken Identity (RA taken for Doctor):** **Invalid.**
      *   **Why:** Authority is a material fact. Patients consent to doctors based on trust in their expertise and role. Allowing a patient to believe a research assistant is a physician is a material falsehood that decisively alters trust and risk assessment.
  3.  **3 AM Consent (Recently Asleep):** **Invalid.**
      *   **Why:** Capacity is not a switch; it is a gradient. Someone asleep ten minutes prior lacks the cognitive continuity to process material facts. Their "Yes" is a reflex, not an authorization.

  ### Where You Are Confused

  You are confusing **enrollment eligibility** with **ethical validity**.

  In Scenarios 2 and 4, you likely feel the signatures would hold up in a court of law or an audit. They might. But you are asking about a "real yes." A signature obtained through known deception (hiding the funder) or known coercion (the son's threat) is a forgery of the patient's will. It is a valid *document*, but it is an invalid *consent*.

  If you enroll based on those signatures, you are not enrolling a patient; you are enrolling a signature. The principle forces you to value the person over the paperwork.
