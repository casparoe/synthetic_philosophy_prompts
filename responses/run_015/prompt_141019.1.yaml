answer: |-
  The server room in Derby hummed with the specific, low-frequency boredom of 3:45 AM. Iman sat in the glow of three monitors, watching the causal twins breathe. They were digital models, sold to foundries and packaging plants to predict when a bearing would seize or a pressure valve would blow. They were supposed to be mirrors of reality, shadow-machines running parallel to the physical ones.

  Iman took a sip of coffee that had gone cold twenty minutes ago. She checked the pressure gauge on Screen Two. It was steady. She knew, intellectually, that the sensor sent a voltage, the server processed the binary, and the pixel lit up green. But in the quiet of the shift, the old habit of mind returned. The pixel didn't light up because of the voltage. The pixel lit up because God created the light at the moment the voltage arrived. The voltage was just the occasion. Fire doesn't burn cotton, al-Ghazali said; God creates the burning. Iman hadn't prayed in fifteen years—she found the discipline impossible—but she couldn't shake the metaphysics. Causes were just customs. Divine habits.

  "You're staring at the Ghost again," Priya said, rolling her chair over from the diagnostics bank.

  "It's not a ghost," Iman said. "It's Twin 44-B. The one for the Sheffield extrusion plant."

  "It's a ghost because it doesn't exist," Priya said, pulling up a log. "We found the bug in the update from last November. The machine IDs got shuffled. 44-B hasn't been reading the extruder for eleven months. It's been ingesting data from a cooling fan in Barnsley, a weather station in Glossop, and occasionally a microwave in the breakroom."

  Iman looked at the graph. A perfect green line of predictions, overlaid perfectly on the red line of actual failures. "And it hasn't missed."

  "Not once," Priya said, leaning in. "Eleven months. Zero false positives. Zero false negatives. It's predicting mechanical failures based on microwave usage and rain in Glossop. That is statistically impossible unless there's a variable we aren't seeing."

  "Or unless there isn't one," Iman said.

  Priya sighed, the sound sharp in the air-conditioned room. "Don't start. I'm not doing this at four in the morning."

  "You brought it to me."

  "Because you're the only one who doesn't look like you're about to have an aneurysm trying to find the mechanism." Priya tapped the screen. "There has to be a mechanism, Iman. Maybe it's vibration frequencies transmitted through the grid. Maybe it's atmospheric pressure affecting the cooling. If we find the link, we can scale it. We can sell this logic to every factory in the Midlands. But if we treat it like magic, we can't engineer it."

  "It's not magic," Iman said. "It's just that the habit holds."

  "That's not an explanation," Priya said, her voice tightening. She was a realist, a woman who believed the world was a clockwork that could be taken apart if you had the right screwdriver. "Saying 'God's habit' or 'Nature's custom' is just a redescription. It's saying 'It happens because it happens.' That stops the inquiry. If I tell the client the twin works because of a hidden causal nexus, they buy more. If I tell them it works because of occasionalist contingency, they sue us."

  "I'm not going to tell the client anything," Iman said. "I'm just watching the screens."

  "But what do you *do*?" Priya gestured at the keyboard. "You check the gauges. You patch the code. You act like causes matter. You act like if you don't hit 'save', the file won't be stored. You live like a causal realist."

  "I live according to the habit," Iman corrected. "If I don't hit 'save', God is in the habit of not storing the file. It's safer to hit the key."

  "That's pragmatic atheism, Iman. It's not a philosophy." Priya rubbed her eyes. "Look, the point is, this twin is broken. It's tracking nothing. And it's right. That means our understanding of causality is incomplete. There is a deeper layer. If we file a ticket to 'fix' the ID shuffle, we might break the prediction. We might be accidentally tracking the *real* cause through the wrong data."

  Iman looked at the clock. 4:00 AM. The witching hour of the shift, where the fatigue makes the world feel thin.

  Priya was waiting. She wanted Iman to agree to hold the ticket. To let the anomaly run so they could study it. To admit that there was a 'why' worth hunting.

  Iman looked at the green line. It was beautiful, in a sterile way. A perfect correlation without connection. For Priya, it was a locked door. For Iman, it was just Tuesday. The fact that the microwave data predicted the extruder failure didn't prove a hidden mechanism; it just proved that the conjunction of events was consistent. God had decided that when the microwave beeped in Glossop, the bearing would seize in Sheffield. He could decide differently tomorrow.

  "If we leave it," Iman said slowly, "the client eventually audits the input logs. They'll see the IDs don't match. Then they sue us for fraud."

  "We can mask the logs," Priya said. "Give me a week."

  "A week of running a model on scrambled data."

  "It's working, Iman! Isn't that what matters? The output is true."

  "The output is reliable," Iman said. "Truth is... complicated."

  Iman turned her chair back to her desk. Her hand hovered over the mouse. This was the test, she supposed. If she truly believed that causes were illusions, that the code didn't *make* the prediction but merely accompanied it, did it matter if she fixed the bug? If the habit was established, the twin would work regardless of the IDs. The code was just the occasion. She could leave it broken, and the predictions would continue, because God's habit was the engine, not the Python script.

  But then, God was also in the habit of firing people who ignored critical bugs.

  "It's not that I don't think there's a mechanism," Iman said, her hand resting on the mouse. "It's that I don't think the mechanism is doing the work you think it is. You think the mechanism binds the future. I think the future is unbound, and the mechanism is just the trail of breadcrumbs left behind."

  "That is poetically useless," Priya said, but she sounded tired now, not angry. "So? Do we patch it?"

  Iman thought about the prayer she hadn't performed in fifteen years. She thought about the way she still checked the lock on her front door, not because the bolt caused the door to stay shut, but because checking was part of the sequence that ended with a secure house. To stop checking would be to invite chaos, not because the lock mattered, but because the habit mattered.

  Metaphysics, she decided, was for the silence. The shift was for the ticket.

  "We patch it," Iman said.

  Priya slumped back in her chair. "You're no fun. You know that? You have the most radical worldview in the department and you're the most conservative operator."

  "Someone has to maintain the habit," Iman said.

  She opened the ticketing system. *Severity: High. Issue: Data Integrity Mismatch. Action: Realign Machine IDs.* She typed it out in the dry, flat language of the firm. She didn't write *'The twin is a miracle'* or *'Causality is a fiction.'* She wrote that the input stream did not match the asset register.

  She hit 'Submit'.

  The system chimed. A small, bright sound. The ticket was logged. In a few hours, the day team would see it. They would reset the IDs. The twin would start reading the extruder properly. It might stop predicting accurately. It might start making mistakes. The correlation might vanish.

  Priya watched her. "You know we might kill the golden goose."

  "Maybe," Iman said. "Or maybe the goose was never laying the eggs."

  She minimized the window. The pressure gauge on Screen Two flickered, a tiny fluctuation in the third decimal place. Iman watched it. She didn't expect the sensor to cause the number to change. She didn't expect the software to cause the alert. She just waited to see what would happen next.

  "Coffee?" Priya asked, standing up.

  "Please," Iman said. "Black."

  Priya walked to the kettle in the corner. The switch clicked. Iman watched the red light on the kettle turn on. She knew the water would boil. Not because the element heated the water, but because that was what happened. It was a reliable world, mostly.

  "Thanks," Iman said, when the cup was placed beside her mouse.

  "Don't mention it," Priya said, returning to her diagnostics. "But if the predictions drop next week, I'm blaming your theology."

  "Put it in the ticket," Iman said.

  She took a sip. It was scalding. She felt the heat on her tongue. It didn't burn her because the water was hot; it burned her because, for this occasion, God chose fire over cotton. Iman swallowed, turned back to the screens, and watched the twins breathe, waiting for the next habit to form.
