          *   *Verbalization Effect:* Thinking aloud can alter the cognitive process (reactivity).
          *   *Post-hoc Rationalization:* When asked "why," experts often confabulate a logical reason for an intuitive leap. This is the core risk.

  3.  **Address the Specific Question: Live vs. Replay (Stimulated Recall)?**
      *   **Live (Concurrent Think-Aloud):**
          *   *Pros:* Captures immediate attention, less memory decay, captures the flow of search.
          *   *Cons:* High cognitive load (might interfere with the actual reading), might force articulation of things that were actually intuitive guesses (rationalization in real-time).
      *   **Replay (Retrospective Stimulated Recall):**
