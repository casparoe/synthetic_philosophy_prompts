  ### I. The Rules of the Record

  To reconcile the five precedents, we must articulate three principles that balance the physical object, the visitor's encounter, and the museum's authority. These rules are not absolute; they are weighted, allowing one to yield to another only under specific conditions established by our history.

  1.  **The Principle of Material Witness (History):** The primary value of an object lies in its original physical substance as evidence of the past.
      *   *How it survives all five:* This is the default position (Case 2, Case 3). It yields only when the material is lost (Case 4), destroyed (Case 1), or structurally irrelevant to the whole (Case 5). In Case 3, the lack of material truth (forgery) was fatal because it was concealed.
  2.  **The Principle of Functional Continuity (Experience):** An object must be able to perform the cultural or structural job it was made to do, or the job the museum requires of it.
      *   *How it survives all five:* This justifies the copy in the frame (Case 1), the facsimile for access (Case 2), the re-fabrication of the concept (Case 4), and the new timbers in the roof (Case 5). It explains why we declined the forgery (Case 3): its only function was deception, which serves no valid cultural job.
  3.  **The Principle of Interpretive Integrity (Office):** The museum must not actively mislead the public about the nature of what they are seeing, unless the distinction is structurally invisible and irrelevant to the object's function.
      *   *How it survives all five:* We label copies (Case 1), facsimiles (Case 2), and re-creations (Case 4). We declined the forgery because we were gagged (Case 3). The unmarked roof timbers (Case 5) are the only exception, permitted because marking them is practically impossible and the distinction does not alter the viewer's understanding of the *roof* as a sheltering structure.

  ### II. Implications for the Options

  *   **Option A (Fragments Only):** Upholds *Material Witness* perfectly but fails *Functional Continuity*. The cycle cannot "work" as an image. It treats the object purely as archaeological evidence, ignoring our precedent of displaying functional stand-ins (Cases 1, 2, 4).
  *   **Option B (Reduced Saturation Infill):** Upholds *Functional Continuity* (it looks whole) but violates *Interpretive Integrity*. The "trick" ensures the reconstruction disappears in photographs—the primary medium of modern encounter. This creates a dual reality: truth for the visitor, deception for the remote viewer. This echoes the declined Forgery (Case 3) where the nature of the object was concealed.
  *   **Option C (Teaching Space):** Upholds *Interpretive Integrity* and *Functional Continuity* (as a didactic tool) but sidelines *Material Witness* by removing it from the context of the medieval collection. It treats the object as a study piece rather than a work of art, consistent with our "teaching remit" but potentially diminishing the cycle's cultural status.
  *   **Option D (Neutral Tone Infill):** Upholds *Material Witness* (losses are visible) and *Interpretive Integrity* (no visual deception), while satisfying *Functional Continuity* (the image is legible). It aligns with standard conservation ethics where new work is distinguishable upon close inspection.

  ### III. Recommendation and Precedent

  If we wish to be consistent with ourselves, we should adopt **Option D**.

  **Closest Precedent:** **Case 4 (The Artist-Supervised Re-creation).**
  Like Case 4, this option accepts that a destroyed work can be re-made and displayed in the gallery. However, there is a critical difference: in Case 4, the artist's authority validated the new material as "the work." Here, we lack that authority; we have only archival evidence. Therefore, we must borrow the distinction strategy from **Case 2 (The Codex Facsimile)**. We display the reconstruction, but we ensure the new material does not pretend to be old.

  **The Critical Difference:** The difference that does the most work is **Authority**. In Case 4, the artist said, "This is my work." In this case, the Diocese says, "Call this 'restored' and do not call it 'reconstruction'." This is a constraint on our Interpretive Integrity. Option D allows us to accept the loan while visually resisting the gag order. The neutral infill makes the reconstruction undeniable, rendering the semantic restriction on the word "reconstruction" less deceptive. The object testifies to the truth even if the label is constrained.

  ### IV. Underdetermination and Regret

  Our record underdetermines the decision because Case 5 (Roof) permits unmarked substitutions for functional reasons, while Case 3 (Forgery) forbids concealed substitutions for integrity reasons. The fresco sits between: it is functional (an image to be seen) but also evidentiary (a historical document).

  *   **Option A commits us to:** Purity of evidence over public access. We would regret denying the community the experience of the cycle's wholeness, violating our Functional Continuity rule.
  *   **Option B commits us to:** The acceptability of digital deception. We would regret this most. The reduced-saturation trick is not a feature; it is the thing that should sink the proposal. It creates a record where the museum's official photography lies about the object's state. This violates the spirit of Case 3; we refused a forgery because we couldn't label the doubt, and we should not accept a reconstruction that hides its own nature in the digital realm.
  *   **Option C commits us to:** A two-tier collection where "real" art is in the gallery and "hybrids" are in the classroom. We might regret segregating a work of this significance, but it is the safest institutional bet.
  *   **Option D commits us to:** Aesthetic fragmentation. We regret that the wall will look "patched," but this is the cost of honesty.

  The reduced-saturation trick (Option B) must be rejected. It prioritizes the *marketing* of the object over the *truth* of the object. If the infill vanishes in the guidebook, the guidebook becomes a forgery.

  ### V. The Further Case

  To separate the rules still in play, consider this variant: **An Augmented Reality (AR) overlay on the ruined church apse.**
  Visitors wear glasses that project the missing fresco sections onto the actual ruins on-site. The physical wall remains fragmented (Material Witness intact), but the experience is whole (Functional Continuity satisfied). The overlay is software, not physical paint.

  **What this tells us:** If we accept the AR overlay without a persistent physical label, we prioritize *Experience* over *Material Witness* and *Integrity* (since the "object" seen through the lens is fake). If we reject it unless the AR interface constantly displays "Reconstruction," we prioritize *Integrity*. Our answer to this would reveal whether we believe the "museum" is the physical building or the mediated experience. Given our refusal of the forgery (Case 3) and our labeling of the facsimile (Case 2), we would likely require the AR interface to explicitly label the reconstruction, proving that *Interpretive Integrity* trumps *Immersion*.

