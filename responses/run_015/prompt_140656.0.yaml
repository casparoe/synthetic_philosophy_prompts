answer: |-
  1. In the laboratory one prepares a system before one measures it, and a preparation is not a discovery. So when the situationist prepares a situation to elicit failure, they haven't discovered a lack of virtue; they've just measured the strength of their own magnet.

  2. The situationist expects virtue to produce identical outputs across different inputs, as if it were an algorithm. But if virtue is practical wisdom, then a person whose behaviour were wholly indifferent to circumstances would not be a paragon but a fanatic.

  3. We've been scoring ourselves on a consistency coefficient between zero and one, but nobody has been able to say what the units are. I suspect that's because the situationists think the numerator is always zero, while the virtue ethicists insist the denominator is irrelevant.

  4. The situationist claims character traits are too local to be useful, but virtue ethics never claimed they were global. Arguing that a screwdriver is useless because it cannot hammer nails is a critique of the tool, not the carpenter.

  5. The situationist observes that people fail to act virtuously in difficult situations, and concludes virtue is rare. But observing that few people can lift 100kg does not prove muscles don't exist; it proves the weight was heavy.
