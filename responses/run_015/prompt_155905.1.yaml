  ### 14. Addendum: Specific Considerations for the "Lock" Mechanism

  To ensure the final paper is robust, I will include a specific section in the drafting phase dedicated to the *mechanism* of the Lock. It is not enough to say the Lock exists; I must explain *how* it functions cognitively or normatively.
  *   **Cognitive Mechanism:** Is the Lock a heuristic that is hard-wired? (e.g., disgust mechanisms that prevent certain trades).
  *   **Normative Mechanism:** Is the Lock a commitment device? (e.g., Ulysses contracts).
  *   **Implication:** If the Lock is a commitment device, it is chosen instrumentally (to prevent future weakness). This supports the Collapse thesis. If the Lock is hard-wired or constitutive, it supports the Salvage thesis.
  *   **Plan:** I will explicitly analyze these mechanisms in Section V of the paper. This adds depth to the "Objections" section and ensures the word count is filled with substantive analysis rather than repetition.

  Furthermore, I will ensure the distinction between "search costs" and "option costs" is maintained. The ALC specifically concerns the relationship between the aspiration threshold and the *search costs*. An agent can trade off option attributes (price vs. quality) and still be satisficing. The collapse only happens when the *threshold itself* is traded against the *cost of finding* an option that meets the threshold. This distinction is subtle but vital, and I will dedicate specific text to clarifying it in Section III.

  By attending to these details, the final paper will meet the high standards of philosophical inquiry required for a term paper of this length and significance. The proposal outlined above provides the necessary roadmap to achieve this.

