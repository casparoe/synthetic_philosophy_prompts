answer: |-
  # Research Prospectus: Locking the Bar
  ## The Aspiration-Lock Condition and the Normative Status of Satisficing

  **Project Type:** One-Semester Philosophy Term Paper Proposal
  **Target Length:** Approximately 6,000 words (Final Paper)
  **Subject:** Philosophy of Rationality / Decision Theory

  ---

  ### 1. Introduction and Problem Statement

  The distinction between optimizing and satisficing is one of the most enduring yet unstable binaries in the philosophy of rationality. In its standard formulation, originating from the mid-twentieth-century work on bounded rationality, optimization is understood as the selection of the best available option from a feasible set, whereas satisficing is defined as the selection of the first option that meets a specified threshold of acceptability. On the surface, this distinction appears robust. Optimization maximizes a utility function; satisficing meets a constraint. However, under philosophical scrutiny, the normative boundary between these two modes of agency dissolves. The central problem this project addresses is the instability of the aspiration level—the "bar" that determines what counts as "good enough."

  Standard models treat the aspiration level as an exogenous parameter. It is a fixed rule brought to the search process by the agent. However, this treatment is descriptively unrealistic. In actual deliberative contexts, agents rarely hold their standards perfectly fixed. Aspiration levels are dynamic. They shift in response to the properties of the search process itself: fatigue lowers the bar; early successes raise it; framing effects distort it. When an agent lowers their aspiration level because the search has become too costly or too frustrating, they are effectively incorporating search costs into their decision rule. Once search costs are incorporated into the decision rule, the distinction between satisficing and optimizing begins to collapse. If I lower my standards because searching further is too expensive, am I not simply optimizing a function that includes the cost of search against the value of the option?

  This project proposes that the distinction between satisficing and optimization can only be salvaged if we introduce a specific structural constraint on how aspiration levels are permitted to vary. I label this the **Aspiration-Lock Condition (ALC)**. The ALC thesis states that satisficing remains normatively distinct from optimization only if at least one dimension of the agent's aspiration threshold is held fixed relative to the costs of search, and is not itself subject to the same cost-benefit calculus that governs option selection. If the aspiration level is fully endogenous—fully responsive to search costs—satisficing collapses into a form of constrained optimization. If the aspiration level is fully exogenous—completely unresponsive to context—the view becomes descriptively unrealistic and potentially irrational, as it ignores the cost of achieving the standard.

  The proposed term paper will investigate the coherence and normative significance of the Aspiration-Lock Condition. The research question is precise: *Is the Aspiration-Lock Condition coherent? If coherent, does it mark a genuine normative boundary between distinct rational strategies, or does it merely redescribe meta-level optimization over rules?*

  To answer this, the paper will engage in a conceptual analysis of the lock condition, construct two structured test cases to probe its limits, and evaluate whether adaptive-rationality objections can be answered without circularity. The project acknowledges a significant scope risk: the potential for an infinite regress of meta-rules. If the "lock" itself is chosen for a reason, is that choice not an optimization? To mitigate this, the proposal includes a concrete fallback strategy: restricting the analysis to epistemic satisficing (belief fixation) rather than practical satisficing (action selection), where the costs of search are of a different categorical kind.

  This prospectus outlines the argumentative arc, methodological approach, and anticipated contributions of the term paper. It proceeds by first contextualizing the instability of the optimizing/satisficing distinction within current debates on bounded rationality. It then defines the Aspiration-Lock Condition in detail, followed by a description of the test cases and the evaluation of objections. Finally, it assesses the scope risks and details the timeline for completion. Formal citations to relevant literature in decision theory and philosophy of action will be supplied in the final paper; here, positions are referenced by their conceptual content to maintain focus on the argumentative structure.

  ---

  ### 2. Background and Motivation: The Instability of the Distinction

  To understand the necessity of the Aspiration-Lock Condition, one must first appreciate why the standard distinction fails. The traditional view, often associated with the early literature on bounded rationality, posits that human agents lack the computational power to optimize. Therefore, they adopt a satisficing strategy. They set an aspiration level, search until they find an option that meets it, and stop. Optimization, by contrast, requires searching the entire feasible set (or a statistically representative sample sufficient to identify the maximum) and selecting the peak.

  The economic critique of this view is well-known. If an agent stops searching once a "good enough" option is found, they are implicitly making a judgment that the expected marginal benefit of further search is outweighed by the marginal cost of that search. In other words, the stopping rule is determined by a cost-benefit analysis. If the stopping rule is determined by a cost-benefit analysis, the agent is maximizing a function that includes search costs. Thus, satisficing is merely optimization under constraints. It is "optimization with transaction costs."

  Proponents of satisficing as a distinct normative category resist this collapse. They argue that satisficing captures a different attitude toward the good. An optimizer is committed to the *best*; a satisficer is committed to the *sufficient*. This is not merely a difference in computational capacity but a difference in normative orientation. However, this defense falters when we examine the dynamics of the aspiration level.

  In real-world scenarios, aspiration levels are not static. Consider an agent searching for an apartment. They begin with a set of criteria: price, location, size. As the search progresses, these criteria shift. If the market is tight (high search costs), the agent lowers the price threshold or accepts a longer commute. If the agent is tired (internal search cost), they may accept a lower quality unit to end the deliberation. In these cases, the aspiration level is *endogenous* to the search process. It is revised based on the difficulty of finding options that meet the original standard.

  Once we acknowledge that aspiration levels are endogenous, the collapse into optimization threatens to return. If I lower my aspiration level because searching is hard, I am treating my aspiration level as a variable to be optimized. I am trading off the stringency of my standard against the effort required to meet it. This looks like meta-optimization: I am choosing the optimal aspiration level given the costs of maintaining a higher one.

  Conversely, if we insist that aspiration levels must be exogenous to preserve the distinctness of satisficing, we face a different problem. If the aspiration level is fixed regardless of search costs, the agent risks irrationality. An agent who refuses to lower their standards even when the cost of meeting them is catastrophic (e.g., searching for a perfect partner until death) is not rationally satisficing; they are compulsively optimizing or simply irrational. Therefore, a viable theory of satisficing must allow for *some* endogeneity (to be realistic) but prevent *total* endogeneity (to avoid collapsing into optimization).

  This is the gap the Aspiration-Lock Condition aims to fill. Existing treatments of bounded rationality leave this open. They either treat aspirations as fully endogenous (collapsing the distinction) or fully exogenous (making the view unrealistic). The term paper will argue that a middle path exists, but it requires a specific structural constraint: the Lock.

  ---

  ### 3. The Aspiration-Lock Condition: Definition and Justification

  The core conceptual innovation of this project is the Aspiration-Lock Condition (ALC). To defend the claim that satisficing is a normatively distinct mode of rationality, we must identify a feature of satisficing that cannot be reconstructed as a form of optimization. The ALC proposes that this feature is a constraint on the *revisability* of the aspiration threshold.

  **Definition:** The Aspiration-Lock Condition holds that an agent is satisficing in a normatively distinct sense if and only if at least one dimension of their aspiration threshold is held fixed relative to the costs of search, and is not itself subject to the same cost-benefit calculus that governs option selection.

  This definition requires unpacking. "One dimension" acknowledges that agents have multi-attribute utility functions. An agent might be willing to trade off price against quality, but not safety against cost. The Lock need not apply to the entire aspiration vector, but it must apply to *some* component. "Held fixed relative to the costs of search" is the crucial qualifier. In standard optimization, every parameter is potentially tradable. If the cost of finding a safer car is too high, the optimizer lowers the safety requirement. The ALC forbids this for the locked dimension. The safety standard remains fixed *even if* meeting it is costly.

  Why is this necessary for distinctness? If every dimension of the aspiration level is subject to cost-benefit analysis, then the agent is effectively maximizing a higher-order function: *Utility(Option) - Cost(Search) - Cost(Maintaining Standard)*. The "Cost(Maintaining Standard)" represents the psychological or practical effort required to keep the aspiration level high. If this cost is factored into the decision, the agent is optimizing the standard itself. By positing a Lock, we assert that there is a cost that is *not* factored in. The agent refuses to trade off the standard against the search cost. This refusal is the hallmark of non-optimizing rationality.

  **Justification:** The justification for the ALC rests on the intuition that certain standards function as *constraints* rather than *objectives*. In optimization, all values are commensurable and tradable. In satisficing, some values function as side-constraints. The Lock formalizes this side-constraint status. Without the Lock, the side-constraint becomes just another term in the utility function.

  However, the ALC faces an immediate challenge: Justification of the Lock itself. Why lock a specific dimension? If the agent chooses to lock the safety dimension because they value safety highly, isn't that valuation itself an optimization of values? This leads to the "meta-level optimization" objection. If the Lock is chosen because it is "best" to have a Lock on safety, then the agent is optimizing the structure of their decision-making. The term paper will address this by distinguishing between *instrumental* justification (locking because it yields better outcomes) and *constitutive* justification (locking because it defines the agent's normative identity). The ALC is coherent only if we can make sense of constitutive constraints that are not subject to instrumental trade-offs.

  ---

  ### 4. Research Question and Theses

  The central research question guiding the term paper is: **Is the Aspiration-Lock Condition coherent? If coherent, does it mark a genuine normative boundary, or does it merely redescribe meta-level optimization over rules?**

  This question breaks down into three subordinate inquiries:
  1.  **Coherence:** Can a threshold be fixed relative to search costs without rendering the agent irrational (i.e., ignoring catastrophic costs)?
  2.  **Distinctness:** If coherent, does this fixed threshold prevent the reduction of satisficing to optimization, or can optimization models simulate the Lock via high penalty weights?
  3.  **Normativity:** If distinct, is satisficing thereby vindicated as a rational strategy, or is it merely a descriptive label for sub-optimal behavior?

  **Primary Thesis:** The paper will argue that the Aspiration-Lock Condition is coherent but fragile. It marks a genuine normative boundary only if the locked dimension is justified non-instrumentally. If the Lock is justified instrumentally (e.g., "I lock my safety standard because it saves time in the long run"), it collapses into meta-optimization. Therefore, the distinctness of satisficing depends on the existence of non-instrumental normative constraints.

  **Secondary Thesis:** The paper will further argue that existing models of bounded rationality fail to capture this distinction because they assume all rationality is instrumental. By exposing the reliance on the ALC, we reveal that defending satisficing requires defending a form of deontological constraint within decision theory.

  **Tertiary Thesis:** In the event that non-instrumental justification is deemed untenable within a naturalistic framework, the paper will argue that the distinction is purely descriptive. Satisficing describes a psychological process, but optimization describes the normative standard.

  ---

  ### 5. Methodology and Structured Test Cases

  To test the coherence and implications of the Aspiration-Lock Condition, the term paper will employ a method of conceptual analysis supported by two structured test cases. These cases are designed to isolate the variable of aspiration revision. They are not empirical studies but philosophical thought experiments designed to probe our intuitions about rationality and the stability of standards.

  **Methodological Approach:**
  The analysis will proceed by modeling the decision structure of the agent in each case. We will compare the "Satisficer with Lock" against the "Optimizer with Constraints." The goal is to see if the behavioral output and the internal justification of the two agents can be distinguished. If the Optimizer can mimic the Satisficer by assigning infinite weight to a specific variable, then the Lock is merely a rhetorical difference. If the Optimizer cannot mimic the Satisficer without violating the definition of optimization (commensurability of all values), then the Lock marks a genuine boundary.

  **Test Case 1: The Hard Lock (Survival Threshold)**
  *Scenario:* An agent is foraging in a hostile environment. They must secure a minimum caloric intake to survive the night.
  *Application of ALC:* The caloric threshold is locked. It cannot be revised downward regardless of the search cost. Even if searching for the required calories risks injury (high search cost), the agent does not lower the caloric standard. They either find it or perish.
  *Analysis:* In this case, the Lock holds because a hard biological constraint prevents downward revision. The aspiration level is not a preference; it is a condition of agency.
  *Implication:* This supports the coherence of the ALC. However, it raises the question: Is this rationality, or is it necessity? If the agent *cannot* lower the standard, are they "satisficing" or simply "constrained"? The paper will argue that this represents a limiting case of the Lock, where the constraint is external. To be a normative strategy, the Lock must be internal (adopted by the agent), not just external (imposed by biology). This case establishes the *possibility* of a fixed threshold but leaves open the *normative* status of adopting such a threshold voluntarily.

  **Test Case 2: The Drifting Lock (Consumer Fatigue)**
  *Scenario:* An agent is shopping for a laptop. They begin with high specs (Lock A). After three hours of searching with no success, they feel fatigued. They lower the specs to a lower tier (Lock B) to end the search.
  *Application of ALC:* Here, the Lock dissolves. The aspiration level is endogenous to the search cost (fatigue).
  *Analysis:* This behavior is descriptively realistic. However, under the ALC framework, this agent is not satisficing in the normatively distinct sense; they are optimizing. They are trading off laptop quality against the disutility of fatigue.
  *Implication:* This case demonstrates the collapse thesis. Most real-world "satisficing" looks like Test Case 2. If Test Case 2 is the norm, then distinct satisficing is rare. The paper will use this to argue that if we want to save satisficing as a normative ideal, we must argue that agents *ought* to maintain the Lock despite fatigue. This moves the discussion from description to prescription.

  **Comparative Evaluation:**
  By juxtaposing these cases, the paper will show that the "Satisficing" label is often applied to Test Case 2 (Drifting), but the normative defense of satisficing relies on the structure of Test Case 1 (Hard Lock). The tension between these two cases drives the argument. The paper will ask: Can we have a "Soft Lock"? A standard that is fixed against minor search costs but yields to catastrophic ones? The paper will explore whether a "Soft Lock" is stable or if it inevitably slides into the Drifting Lock of Test Case 2.

  ---

  ### 6. Evaluation of Objections: The Adaptive-Rationality Challenge

  The most significant objection to the Aspiration-Lock Condition comes from the theory of adaptive rationality. This objection argues that any fixed rule, including the ALC, can be understood as the output of a higher-order optimization process.

  **The Objection:**
  Suppose an agent adopts the ALC. They refuse to lower their safety standard regardless of cost. The adaptive rationalist asks: *Why?* If the answer is "Because safety is important," the rationalist asks: *How important?* If it is important enough to risk death, that valuation can be represented in a utility function. If the agent has a utility function where Safety = Infinity, they are still maximizing expected utility. They are just using a lexicographic preference ordering. Optimization theory can accommodate lexicographic preferences. Therefore, the ALC does not distinguish satisficing from optimization; it merely describes a specific shape of the utility function (one with vertical asymptotes).

  **Response Strategy:**
  The term paper will answer this objection by distinguishing between *representational equivalence* and *explanatory distinctness*. It may be true that an optimizer *can* model the behavior of a satisficer with a Lock by using infinite weights. However, the *explanation* of the action differs.
  1.  **Optimization Explanation:** The agent chose X because it maximized U.
  2.  **Satisficing Explanation:** The agent chose X because it met the threshold T, and T was not subject to maximization.

  The paper will argue that explanatory distinctness matters for normative theory. If we treat the Lock as just a high weight, we imply that there is *some* cost that could overturn it (if the weight is finite) or that the agent is irrational for holding an infinite weight (if the weight is infinite). Satisficing with an ALC posits that the threshold is *not a weight* but a *rule*. Rules operate differently than weights. Weights trade off; rules constrain.

  **Circularity Risk:**
  The paper will honestly assess the risk of circularity. To defend the Lock as a rule and not a weight, we must appeal to the agent's commitment to the rule. But why are they committed? If they are committed because it is "good" to be committed, we are back to optimization (optimizing for integrity). The paper will explore whether a non-circular justification is possible. One avenue is to argue that the Lock is a precondition for deliberation itself. Without some fixed standards, the search space is undefined. Thus, the Lock is transcendental rather than instrumental. This is a strong claim, and the paper will evaluate its plausibility.

  ---

  ### 7. Possible Conclusions and Adjudication

  The term paper will culminate in an evaluation of three possible conclusions, adjudicated by specific considerations regarding the justification of the fixed dimension.

  **Conclusion A: Salvage of Satisficing**
  *Condition:* The fixed dimension can be justified non-instrumentally.
  *Argument:* If we can show that certain aspiration levels (e.g., moral minima, survival thresholds) are constitutive of agency and not subject to trade-offs, then satisficing is vindicated as a distinct normative strategy. It is the rationality of constraints.
  *Adjudication Factor:* The success of this conclusion depends on establishing that "constitutive constraints" are coherent. If the paper can successfully argue that some values are not commensurable with search costs, Satisficing is saved.

  **Conclusion B: Collapse into Disguised Optimization**
  *Condition:* The fixed dimension is ultimately justified instrumentally.
  *Argument:* If the Lock is maintained because it leads to better long-term outcomes (e.g., "having a rigid safety standard prevents accidents"), then the agent is optimizing long-term utility. The Lock is a heuristic for optimization.
  *Adjudication Factor:* This conclusion prevails if every defense of the Lock appeals to consequences. If "integrity" or "principle" is valued only for its good effects, the collapse is total.

  **Conclusion C: Exposure of the Distinction as Purely Descriptive**
  *Condition:* The Lock is neither instrumentally justified nor constitutively necessary.
  *Argument:* The Lock is simply a psychological limitation. Agents *do* lock standards because they cannot compute trade-offs, not because they *should*.
  *Adjudication Factor:* This conclusion prevails if the normative force of the Lock cannot be sustained. Satisficing becomes a label for bounded computational capacity, not a rival normative theory.

  The paper will lean toward Conclusion A or B, depending on the strength of the non-instrumental justification argument. The critical consideration is whether the "fixed dimension" can be defended without appealing to the "goodness" of the outcome. If the defense relies on the "rightness" of the process, Satisficing survives. If it relies on the "goodness" of the result, Optimization wins.

  ---

  ### 8. Scope Risk and Fallback Strategy

  **Scope Risk Assessment:**
  The part of the project most likely to exceed the scope of a single semester is the analysis of the "meta-level optimization" regress. Proving that the Aspiration-Lock Condition is not itself a product of optimization requires navigating deep waters in meta-ethics and the theory of rational choice. There is a risk that the paper will become bogged down in defining "instrumental" vs. "non-instrumental" justification, which could expand into a separate project on the nature of value. If the paper attempts to fully resolve the regress problem, it may fail to provide a clear answer to the primary research question within the 6,000-word limit.

  **Concrete Fallback:**
  To mitigate this risk, the proposal includes a fallback strategy: **Restricting analysis to epistemic rather than practical satisficing.**
  *   *Practical Satisficing:* Choosing actions (e.g., buying a car). Here, costs are clearly defined (money, time).
  *   *Epistemic Satisficing:* Fixing beliefs (e.g., accepting a hypothesis). Here, "search costs" are cognitive effort, and "aspiration levels" are confidence thresholds.
  *   *Rationale:* In epistemic contexts, the "cost" of search is often less commensurable with the "value" of truth. It is easier to argue for a Lock on truth standards (e.g., "I will not believe this without evidence X, regardless of how uncomfortable uncertainty is") than in practical contexts where everything has a price.
  *   *Implementation:* If the practical analysis proves too complex, the paper will pivot to epistemic rationality. The Aspiration-Lock Condition would be reframed as a constraint on belief fixation that is not subject to pragmatic trade-offs. This preserves the core philosophical argument (the stability of the threshold) while reducing the complexity of the cost-benefit modeling.

  This fallback ensures that the project remains manageable. The core conceptual work on the ALC remains the same; only the domain of application shifts. This allows the paper to maintain its theoretical contribution without getting lost in the complexities of economic utility theory.

