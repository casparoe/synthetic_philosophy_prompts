      *   *Structure:* Follow the 5 numbered points + the final evaluation.
      *   *Key Distinction:* Ensure the difference between KK and Luminosity is clear. Williamson's luminosity is about *phenomenal states*. Leonard's issue is about *facts about the world* mediated by memory.
      *   *Correction:* Wait, Williamson's luminosity argument is specifically about *mental states* (feeling cold). Leonard's problem is about *external facts* (who killed my wife) stored externally. So *Memento* actually challenges the idea that external records can function as internal memory for the sake of KK. It challenges the **Extended Mind** thesis in an epistemic context.
      *   *Refining Point 1:* It pressures the "in a position to know" clause of KK. It shows that without source memory, you can have true belief + justification (the note says so) but lack *knowledge* because the justification is disconnected from the truth-tracking mechanism.
      *   *Refining Point 2:* The condition is **Diachronic Source Access**. Is it a repair? Yes. It saves KK from being obviously false for humans but admits it's not a logical truth.
      *   *Refining Point 3:* Sammy is the **Gettier Case** internalized. Leonard is Gettiered by himself.
