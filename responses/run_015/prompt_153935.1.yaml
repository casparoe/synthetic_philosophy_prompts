answer: |-
  **MEMORANDUM**

  **TO:** Research Reproducibility Board
  **FROM:** [Your Name/Title]
  **DATE:** October 24, 2023
  **SUBJECT:** Funding Decision: Sequential Replication Proposal (Psychology Lab)

  **Bottom Line Decision**
  I recommend **Conditional Approval** for the proposed replication study. Funds will not be released until the Principal Investigator (PI) satisfies specific methodological conditions regarding error rate control. This approach respects the board's mandate on false-positive rates while accommodating methodological innovation in Bayesian sequential design.

  **Background**
  The applicant lab proposes a multi-study replication of a social-priming effect using a Bayesian sequential design. Their plan involves collecting data in batches, analyzing the Bayes Factor (BF) after each batch, and stopping once BF > 6. To address our board's requirement for a <5% false-positive rate (FPR) across the study line, they propose a "sequential evidence escrow" mechanism: multiplying the final BF by 0.85 for every interim look taken. If the discounted BF remains above 6, they will claim successful replication.

  **Board Deliberation and Rationale**
  This proposal has generated significant debate within the board, reflecting a broader tension in our field between strict frequentist error control and flexible Bayesian inference.

  *   **The Case for Skepticism:** Half of the board rightly notes that the "0.85 discount" is a heuristic without standard theoretical derivation. In frequentist terms, optional stopping inflates Type I error rates. While Bayesian inference is technically coherent under optional stopping (conditional on the model), our board's specific mandate is to control the long-run false-positive rate across funded projects. Without proof that this specific discount factor actually caps the FPR at 5% under the null hypothesis, there is a risk that this functions as "p-hacking with extra steps." We cannot fund a method based on hope alone.

  *   **The Case for Innovation:** The other half argues that forcing a fixed-N frequentist design negates the efficiency gains of sequential analysis. If the effect is strong, sequential designs save resources; if it is null, they can stop early for futility. Requiring a rigid fixed sample size throws away these benefits and discourages labs from adopting more informative Bayesian metrics. The applicants' attempt to bridge the gap between Bayesian evidence and frequentist error control is a good-faith effort that deserves encouragement, not outright rejection.

  **Resolution**
  Conditional approval resolves this tension by shifting the burden of proof to the applicants. We will not accept the 0.85 factor as valid simply because it was proposed. However, we will not forbid sequential design either. The applicants must demonstrate empirically that their specific design parameters (batch size, maximum looks, priors, and the 0.85 discount) achieve the required error control.

  **Conditions and Timeline**
  To proceed, the PI must adhere to the following timeline and requirements:

  1.  **Pre-Fund Simulation Study (Due: November 7)**
      *   Before any funds are released, the lab must submit a simulation report demonstrating the operating characteristics of their design.
      *   They must simulate data under the **null hypothesis** using their proposed batch sizes and stopping rule.
      *   The report must show that the "sequential evidence escrow" method results in a false-positive rate of ≤5% across the full line of studies.
      *   If the simulation shows an FPR > 5%, they must adjust the discount factor or the BF threshold and re-simulate until the criterion is met.

  2.  **Preregistration (Due: November 14)**
      *   Once the simulation is approved by the Board Chair, the full analysis plan (including the validated discount factor and stopping rule) must be preregistered on the Open Science Framework (OSF).
      *   The preregistration must explicitly state that the study will be published regardless of the outcome (addressing the file-drawer problem).

  3.  **Data Logging (During Collection)**
      *   The lab must log every interim look (batch number, N, raw BF, and discounted BF) in a time-stamped file uploaded to the OSF project page. This ensures transparency regarding how many looks were actually taken.

  4.  **Final Report (Due: 6 Months After Data Collection Ends)**
      *   The final report must include the full simulation code used to validate the error rate.
      *   They must report the final discounted BF and the undiscounted BF.
      *   If the discounted BF fails to exceed 6, the result must be reported as a non-replication, even if the undiscounted BF was higher.

  **Next Steps**
  I will communicate this decision to the applicants on Friday morning. If the board has objections to these conditions, please reply by Thursday night at 11:00 PM. Otherwise, I will proceed with issuing the grant agreement contingent on the November 7 simulation deliverable.

  This path allows us to maintain our integrity regarding error control without stifling methodological progress. It treats the applicants as partners in reproducibility rather than adversaries, while ensuring our funds are not used to generate inflated claims.

  Thank you for your collaboration on this difficult case.
