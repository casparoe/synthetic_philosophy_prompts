prompt: |-
  Had a long and slightly annoying argument with a friend last night about how you're supposed to study consciousness without cheating. Shes coming from the phenomenology side, I'm the one who actually has to run the studies, and we ended up on heterophenomenology -- Dennett's version of it, where you take what people say about their experience seriously as data but treat it as text to be interpreted from the third-person standpoint, neither granting it the authority of a special access nor throwing it out as mere behaviour. I use it because it gets me out of arguments I have no way to settle; she says that's exactly the problem, that the method looks fine when a subject says "I saw a red patch" and falls apart the moment they report an absence, a contradiction, or something that couldn't have happened, and that my "neutral" interview is really just my own categories with the microphone pointed at someone else. Neither of us moved, and I realised afterwards that I couldn't have written down what I'd actually do in the hard cases if she'd made me.

  So I want it as a procedure rather than a slogan. Concretely: I run the subjective-effects side of a small drug study -- a sedative arm where we're interested in reports of "nothing at all," plus a pilot with a psychedelic -- and the write-up has to go to a regulator, so whatever we do has to be auditable: someone else should be able to take our raw transcripts and land on our categories. The people doing the interviews are undergrad RAs with maybe three hours of training, sessions are 12-15 minutes the next morning, and I can't ask for anything that needs a philosopher standing behind the interviewer's chair. Give me the questions in the order I should ask them, what counts as an adequate answer to each, where the procedure stops and says no, where it has to hand the decision to a person because it's a values call rather than a factual one, and what I'm supposed to do about the fact that the order I ask things in visibly changes what people report -- the interviewer is co-authoring the text, and I don't know what the method says to do about that.

  Three cases I genuinely don't know how to handle, so run the procedure on them: (1) a participant says flatly "there was nothing, I wasn't there, no time passed," then scores clearly above chance on a recognition test for words we played during that exact window -- do I record "no experience," "experience the subject did not report," or something else, and what am I entitled to conclude? (2) Two participants both tick the same item on our ego-dissolution scale, but one glosses it as "I was the whole room and also nowhere" and the other as "I stopped caring what happened to me" -- can the procedure tell me whether these are the same reported phenomenon, and if it can't, what does it tell me to do with the tick? (3) someone in the psychedelic pilot reports watching the session from the ceiling and describes, accurately, what a nurse was doing at the far end of the room; my PI wants it in the paper, I want it in an appendix, my friend says we're both already doing bad metaphysics -- what does the method actually license me to say? If the honest answer is that this procedure can't deliver something I want out of it -- that free reports can't be used to argue between theories, say -- tell me that plainly, I'd rather find out before I write the protocol. And please keep clear what's actually settled about this method and what's contested among people who work on it: I don't want to write "standard practice" in a document that goes to a regulator for something a good chunk of the field thinks is behaviourism with extra steps. Don't send me off to papers, I already have a reading pile.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** A researcher running the subjective-effects side of a small drug study (sedative + psychedelic). Practical, grounded in methodology, facing regulatory scrutiny (auditable), working with undergrad RAs (limited training), short interview windows (12-15 mins).
      *   **The Conflict:** Had an argument with a phenomenologist friend about Heterophenomenology (Dennett). Friend claims it fails on hard cases (absences, contradictions, impossible reports) and is just behaviorism in disguise. User admits they couldn't articulate the concrete procedure for hard cases.
      *   **The Goal:** A concrete, auditable *procedure* (not a slogan) for handling subjective reports under a heterophenomenological framework. Needs specific questions, criteria for adequate answers, stopping rules, hand-off points for value judgments, and handling of interviewer effects.
      *   **Specific Cases to Solve:**
          1.  "Nothing happened" vs. above-chance recognition performance.
          2.  Same scale tick ("ego dissolution") but vastly different verbal glosses.
          3.  Out-of-body experience (OBE) with veridical perception claims.
      *   **Constraints:** No sending to papers (user has a reading pile). Must distinguish settled vs. contested aspects of the method. Must be honest about limitations (if the method can't do what they want, say so). Regulatory context requires auditability.

  2.  **Deconstruct Heterophenomenology (Dennettian) for this Context:**
      *   *Core Tenet:* Treat subjects' reports as *texts* to be interpreted, not as incorrigible truths about inner states, nor as mere noise. The "phenomenological world" is the world *as it seems to the subject*.
      *   *The Gap:* Dennett is great on philosophy, terrible on SOPs (Standard Operating Procedures). The user is asking for the SOP that Dennett implies but doesn't write.
      *   *The Tension:* The friend is right that "neutrality" is hard. The interviewer *does* co-author the text. The method *does* struggle with contradictions between report and behavior.
      *   *Regulatory Reality:* Regulators (FDA/EMA/etc.) care about safety and efficacy. They want consistency. They don't care about metaphysical truth, they care about *data integrity*.

  3.  **Drafting the Procedure (The "SOP"):**
      *   *Structure:* Needs to be step-by-step.
      *   *Training:* 3 hours is tight. Needs scripts.
      *   *Questions:* Open-ended first, then probing, then specific.
      *   *Auditability:* Every deviation must be logged.
      *   *The "Hard Cases":* Need specific decision trees.

  4.  **Addressing the Three Cases:**
      *   *Case 1 (Nothing vs. Performance):* This is the classic "unconscious perception" vs. "memory failure" debate. Heterophenomenology says: Record the *report* as the phenomenon. Record the *performance* as behavior. Do not conflate. The conclusion is about the *dissociation*, not the "truth" of the experience.
      *   *Case 2 (Scale vs. Gloss):* This is a validity issue. The scale assumes equivalence; the text reveals non-equivalence. Heterophenomenology says: The tick is behavior; the gloss is text. You cannot treat them as the same datum without qualification.
      *   *Case 3 (OBE/Veridical):* This is the trickiest. Heterophenomenology brackets the *truth* of the claim (did they float?). It records the *belief* (they think they floated). If the perception is veridical, it's a behavioral fact that they acquired information. The *explanation* (OBE) is the subject's theory.

  5.  **Addressing the "Interviewer Effect" (Co-authorship):**
      *   Dennett acknowledges this. The solution isn't to eliminate it (impossible) but to *standardize* it so the bias is constant across conditions, or to record the interaction itself.
      *   *Action:* Audio record everything. Transcribe pauses and prompts.

  6.  **Distinguishing Settled vs. Contested:**
      *   *Settled:* Reports are data, not truth. Behavior is data. Contradictions are data points, not errors to be fixed.
      *   *Contested:* Whether this actually captures consciousness or just verbal behavior (the friend's critique). Whether "nothing" is a report or an absence.

  7.  **Refining the Tone:**
      *   Needs to be professional, direct, slightly technical but operational.
      *   Avoid philosophical fluff.
      *   Acknowledge the friend's critique (it's valid) without abandoning the method (it's useful for regulation).
      *   *Crucial:* Admit where the method fails. It cannot adjudicate metaphysical truth. It cannot force equivalence on non-equivalent reports.

  8.  **Step-by-Step Construction of the Response:**
      *   **Introduction:** Validate the user's position. Acknowledge the friend's critique is philosophically sound but operationally difficult. State the limit: Heterophenomenology is a data-management protocol, not an ontology.
      *   **The Protocol (SOP):** Break it down into Training, Interview Structure, and Coding.
      *   **The Three Cases:** Apply the protocol strictly.
      *   **The Interviewer Effect:** Address the co-authorship issue practically (standardization + recording).
      *   **Settled vs. Contested:** Be honest about the "Behaviorism with extra steps" accusation.
      *   **Conclusion:** Final verdict on what the method can/cannot deliver for the regulator.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I give specific questions? *Yes, need to draft a script outline.*
      *   *Check:* Did I address the regulatory audit? *Yes, emphasize transcription and version control.*
      *   *Check:* Did I answer Case 1 honestly? *Don't say "they were unconscious." Say "Report = Nothing, Behavior = Recognition."*
      *   *Check:* Did I answer Case 3 honestly? *Don't validate the OBE. Validate the information acquisition.*
      *   *Check:* Is the distinction between "phenomenological world" and "real world" clear? *This is key for Dennett.*

  10. **Final Polish:** Ensure the distinction between *what the subject says* (the text) and *what the researcher concludes* (the interpretation) is rigid. This satisfies the regulator and respects the heterophenomenological stance. (Self-correction: Make sure to explicitly mention that the method *cannot* resolve the friend's philosophical objection, because the method is designed to bypass it, not solve it.)

  11. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the operational protocol you are asking for. It is built on Dennett's heterophenomenology but stripped of the philosophical justification and rewritten as a Standard Operating Procedure (SOP) for regulatory audit.

  **The Bottom Line Up Front:**
  Your friend is philosophically correct that heterophenomenology does not solve the "hard problem" or guarantee access to "real" experience. It is not a truth machine. It is a **data hygiene protocol**. Its value to a regulator is not that it reveals the "true" inner state, but that it creates a consistent, auditable trail between *what was said*, *what was done*, and *how you categorized it*.

  If you try to use this method to prove *what consciousness is*, you will fail. If you use it to prove *what data you collected and how you interpreted it*, it is robust.

  Below is the procedure, followed by the adjudication of your three cases, and finally a clear demarcation of what is settled vs. contested.

  ---

  ### Part 1: The Operational Procedure (SOP)

  **Goal:** To generate a "Phenomenological Text" (transcript) and a "Behavioral Record" (tasks/scales) and map the relationship between them without privileging one as the absolute truth.

  #### 1. Training (3 Hours)
  *   **Hour 1: The Bracketing Rule.** RAs are trained that they are **not** investigating what *actually* happened in the subject's mind. They are investigating *what the subject is willing to assert happened*.
      *   *Forbidden:* "Are you sure?" (Implies they are wrong).
      *   *Forbidden:* "What do you think that means?" (Asks for theory, not experience).
      *   *Required:* "Can you describe that further?" "You used the word X, can you tell me more about X?"
  *   **Hour 2: Script Standardization.** RAs must read the primary prompts verbatim. Deviations are allowed only for clarification, not for leading. All deviations must be logged.
  *   **Hour 3: The "Stop" Rule.** If a subject makes a claim that implies a physical impossibility (e.g., "I saw the back of my head"), the RA does not correct them. They record the claim. The *interpretation* of that claim happens later, in analysis, not in the interview.

  #### 2. The Interview Script (Order Matters)
  *To mitigate the co-authorship effect, the order must be fixed. Do not let the interview drift.*

  1.  **Open Narrative (3 mins):** "Please describe your experience from the moment the drug was administered until now, in your own words."
      *   *Adequate Answer:* Any continuous speech.
      *   *Inadequate:* "I don't know." -> *Prompt:* "Even fragments or sensations?"
  2.  **Specific Phenomenology (5 mins):** "Did you experience any changes in [Time / Self / Visual Field]?" (Select domains relevant to study).
      *   *Adequate Answer:* Specific descriptor (e.g., "Time slowed," "I felt fuzzy").
      *   *Inadequate:* "Yes/No." -> *Prompt:* "How did that present itself?"
  3.  **The "Nothing" Probe (Critical for Sedative Arm):** "Some people report a gap or a blank period. Did you experience anything like that?"
      *   *Adequate Answer:* Description of the gap (e.g., "It was just black," or "I wasn't there").
      *   *Note:* "Nothing" is treated as a positive report of an absence, not a failure to report.
  4.  **Scale Verification (4 mins):** Administer ego-dissolution/sedation scales.
      *   *Crucial Step:* For any non-zero or maximum score, ask: "You selected X. What specific experience led to that selection?"
      *   *Reason:* This links the quantitative behavior (tick) to the qualitative text (gloss).
  5.  **Closing (1 min):** "Is there anything about your experience that we haven't covered that you feel is important?"

  #### 3. Audit and Coding Rules
  *   **Raw Data:** Audio recordings + Verbatim Transcripts. The transcript must include interviewer prompts.
  *   **Coding:** Codes are applied to the *text*, not the *person*.
      *   *Example:* Do not code Subject 001 as "Ego Dissolution." Code Transcript Segment 4 as "Report of boundary loss."
  *   **Discrepancy Log:** If the text contradicts the scale (Case 2), or the text contradicts the task performance (Case 1), this is not an error. It is a **Discrepancy Event**. It must be logged as a specific data point, not smoothed over.

  ---

  ### Part 2: Adjudicating Your Three Cases

  Here is how the procedure handles the hard cases. Note that in all three, the method refuses to decide "who is right." It decides "how to label the data."

  #### Case 1: "Nothing" vs. Above-Chance Recognition
  *   **The Data:**
      *   Text: "There was nothing, I wasn't there."
      *   Behavior: Recognition score > chance (p < 0.05).
  *   **The Procedure:**
      1.  Code the Text as **Report of Absence**. (Do not code as "Unconscious." "Unconscious" is your theory, not their report).
      2.  Code the Task as **Above-Chance Performance**.
      3.  **Conclusion:** You are entitled to conclude: *"Subjects reported a total absence of experience during a window in which behavioral evidence indicates information processing occurred."*
      4.  **What you cannot conclude:** "They were unconscious but still processed data." (This assumes 'report' = 'consciousness').
      5.  **Regulatory Filing:** File as a dissociation between subjective report and objective performance. This is a safety/efficacy signal (drug blocks memory of event, not necessarily processing of event).

  #### Case 2: Same Scale Tick, Different Glosses
  *   **The Data:**
      *   Subject A Tick: 10/10 Ego Dissolution. Gloss: "I was the whole room."
      *   Subject B Tick: 10/10 Ego Dissolution. Gloss: "I stopped caring."
  *   **The Procedure:**
      1.  The Procedure **cannot** tell you these are the same phenomenon. Heterophenomenology treats the *tick* as behavior and the *gloss* as text. They are different data types.
      2.  **Action:** You must split the analysis. You cannot average these into a single mean score for "Ego Dissolution" without a caveat.
      3.  **Coding:** Create two sub-codes under the scale item. Code A as "Report of Boundary Expansion." Code B as "Report of Apathy/Valence Shift."
      4.  **Regulatory Filing:** Report the scale scores, but include a qualitative appendix noting the heterogeneity of the reports underpinning the scores. If the regulator asks "Does the drug cause ego dissolution?", your answer is "It causes reports that map to the ego-dissolution scale, but the phenomenological content varies."
      5.  **Why:** Treating them as identical is a validity error. The scale is a behavioral measure; the interview reveals its construct validity.

  #### Case 3: The Veridical OBE
  *   **The Data:**
      *   Text: "I was on the ceiling."
      *   Fact: Subject describes nurse's action accurately.
  *   **The Procedure:**
      1.  **Bracket the Metaphysics:** You do not record "Subject had an OBE." You record "Subject reported an OBE."
      2.  **Verify the Information:** Confirm the nurse's action via CCTV or log.
      3.  **Conclusion:** You are entitled to conclude: *"Subject reported an out-of-body perspective. Subject accurately reported environmental details that were visually occluded from their physical body position."*
      4.  **PI vs. You:**
          *   **PI (Main Paper):** Only if the claim is "Drug induces reports of OBE."
          *   **You (Appendix):** This is the correct place. The *experience* is the data. The *explanation* (that they actually floated) is not supported by the method.
          *   **Friend:** She is right that claiming "they floated" is bad metaphysics. But claiming "they reported floating and knew things they shouldn't" is good data.
      5.  **Regulatory Filing:** This is an Adverse Event (AE) or a Specific Subject Experience. It must be recorded exactly as reported. Do not sanitize it to "felt detached." The veridical element makes it a safety/monitoring issue (did they acquire information they shouldn't have? Unlikely, but auditable).

  ---

  ### Part 3: The Interviewer Effect (Co-Authorship)

  Your friend is right: The interview is a collaborative performance. The method does not eliminate this; it **standardizes** it.

  1.  **The Fix:** You cannot remove the interviewer's influence. You must make the influence a **constant**.
  2.  **Procedure:**
      *   All interviews audio-recorded.
      *   RAs use the script.
      *   **Audit Check:** Randomly sample 10% of transcripts. Check for "Leading Questions" (e.g., "Did you feel happy?" vs "What did you feel?"). If an RA exceeds a threshold of leading questions, their data is flagged for sensitivity analysis.
  3.  **What to write in the protocol:** "Interviews are semi-structured. Interviewer effects are acknowledged as part of the data generation process. Variability in prompting is controlled via script adherence monitoring."
  4.  **Honesty:** You are not capturing "pure experience." You are capturing "experience-as-reported-under-these-conditions." That is sufficient for regulation.

  ---

  ### Part 4: Settled vs. Contested (For your Protocol Document)

  Do not write "Standard Practice" for things that are philosophical bets. Use this distinction in your methods section footnotes or internal documentation.

  **Settled (Operational Consensus):**
  *   Subject reports are data, not incorrigible truths.
  *   Contradictions between report and behavior are data points, not errors to be discarded.
  *   "Nothing" is a reportable state, not a lack of data.
  *   Audio transcription is required for auditability.

  **Contested (Where your friend has a point):**
  *   **Ontological Status:** Whether this method captures "consciousness" or just "verbal behavior." *Protocol Stance:* We treat reports as the operational definition of subjective effect for the purposes of this study.
  *   **Equivalence:** Whether two different verbal reports can be treated as the same "symptom." *Protocol Stance:* We treat them as distinct unless validated by factor analysis.
  *   **The "Neutral" Stance:** Whether the interviewer can truly be neutral. *Protocol Stance:* Neutrality is attempted via scripting, but residual bias is managed via randomization and blinding where possible.

  ---

  ### Part 5: The Honest Limit (Read this before writing)

  You asked me to tell you plainly if the procedure can't deliver what you want.

  **The Limitation:**
  Heterophenomenology **cannot** arbitrate between theories of consciousness.
  *   If your PI wants to claim the drug "expands consciousness," this method cannot prove it. It can only prove "subjects reported expansion."
  *   If your friend wants to claim the drug "reveals the true structure of the self," this method cannot prove it. It can only prove "subjects reported structural changes."
  *   If the Regulator asks "Does the patient *feel* pain?", you can only answer "The patient *reported* pain."

  **Why this is okay for a Regulator:**
  Regulators do not buy metaphysics. They buy **risk profiles**.
  *   They need to know if patients will report distress (Case 2).
  *   They need to know if patients will claim abilities they don't have or forget things they should remember (Case 1).
  *   They need to know if patients will report bizarre perceptual states that imply safety risks (Case 3).

  **Final Instruction:**
  Write your protocol to say: *"Subjective effects are measured using a heterophenomenological approach. Reports are treated as primary data regarding the subject's phenomenological world. Discrepancies between report and behavioral task performance are recorded as dissociative events, not data errors."*

  This satisfies the regulator (auditable, clear definitions), protects you (you aren't claiming to know the "truth" of their mind), and respects the friend (you aren't claiming the report is infallible). It turns the argument into a data management feature.
