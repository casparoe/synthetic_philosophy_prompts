prompt: |-
  hey — I need help turning a half-formed idea into a two-page proposal for a one-year dissertation fellowship. I keep rewriting the first paragraph and getting nowhere so I'd rather just hand you the mess.

  Here's the background as I understand it. The "wrong kind of reasons" problem starts from cases like: a demon will torture you unless you admire him, or a doctor has a big pragmatic stake in believing you'll recover. In both there's clearly *a* reason to have the attitude, but it seems to be the wrong kind — the demon's threat is a reason to admire, but not a reason that has anything to do with whether he's admirable, and the doctor's stake is a reason to believe but not evidence. The usual way of drawing the line: right-kind reasons bear on whether the attitude fits or is merited by its object; wrong-kind reasons bear on the costs and benefits of having it. And the usual moves in response are things like: analyze the attitudes by their fittingness conditions, or go buck-passing about value so that value just is the having of right-kind reasons, or treat the puzzle as showing that reasons-talk is ambiguous.

  My wrinkle: every stock case in this debate involves attitudes whose fittingness looks fixed entirely by features of the object — admirableness, fearfulness, truth. But there's a large class of attitudes where fittingness also depends on facts about *you* and your relation to the object: you can't fittingly feel gratitude unless you're the beneficiary, resentment unless you were the one wronged, guilt unless you were the agent, regret unless the outcome is attributable to you in the right way, pride in an achievement unless it's yours. Call them standpoint-dependent. And I think these generate a version of the puzzle the standard line can't sort: if I maneuver so that I'm the one who gets the benefit, or I find out I was wronged after all, or I learn I'm not biologically related to the ancestor I was proud of, the reasons I thereby acquire look like they bear on fittingness and yet also look tainted — but they're not tainted in the demon way, because nothing about prizes or threats is involved. I also keep going back and forth on whether trust belongs on this list at all, and that wobble might be diagnostic.

  So the half-formed thought: the debate has been treating "wrong kind" as one thing, and maybe it's two or three — wrong-relation and wrong-standpoint reasons alongside the familiar incentive-based ones — and maybe once you split them, some of the standard solutions stop covering all of them, and some attitudes turn out to permit reasons the demon cases make look obviously corrupt.

  What I need from you: state the question sharply enough that it has a determinate answer; say why the standard responses (fittingness-first, buck-passing, pragmatic-encroachment-flavored moves) each fail to settle the standpoint cases specifically; lay out what I'd actually do month by month for twelve months and why that approach rather than just running more直觉 pump cases; say what a finished chapter would look like and what would count as the project failing (e.g., if it turns out the standpoint cases are just the incentive cases in disguise, or if the taxonomy doesn't reclassify anything we already had); and be honest about whether this is too big for one year and which part I should cut. Don't give me citations or a bibliography — I'll fill those in myself — but do tell me, in substance, which positions I'd be arguing against and which ones I might actually be able to recruit.
