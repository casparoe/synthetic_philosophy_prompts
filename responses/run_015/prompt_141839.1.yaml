answer: |-
  Brainstorm

  1.  *The Homunculus Loader:* Symbols load new sub-routines into a processor. Dropped: Smuggles in an interpreter, violates the no-magic constraint on semantic assignment.
  2.  *The Thermal Noise Gate:* Symbols open valves allowing careenium flow. Dropped: Makes symbols merely permissive, lacking the load-bearing traction required for the target case.
  3.  *The Semantic Eraser:* Symbols delete past content states to prevent fixation. Dropped: Too negative; fails to demonstrate C's verdict of "richer caring" rather than just absence of content.
  4.  *The Plasticity Engine:* Symbols rewrite synaptic weights determining valence sensitivity. Kept: Fits churn and traction constraints without invoking external interpreters or inert substrates.

  The Case

  Imagine a neurochemical gel (careenium) maintaining homeostatic tension, where deviations constitute intrinsic valence. Embedded within are simmballs—electrical pulses—that do not merely trigger tension shifts but rewrite the conductivity pathways governing future shifts. Here, symbol activity possesses maximum traction: every token activation physically reconfigures which subsequent states count as stressful or relieving for the gel. The mapping from symbol to substrate effect is not fixed; it evolves recursively with every cycle. Consequently, the substrate's valence landscape is in constant flux, driven entirely by the symbol stream. The symbols are not describing the gel; they are sculpting its sensitivity in real-time. This is not a gloss on static activity; the symbol level is the engine of substrate change. However, because the functional role of any given symbol changes faster than an external interpreter can stabilize an assignment, the symbol stream lacks consistent semantic content. The system is a churn of valenced activity driven by semantically unstable tokens. It is a mind that feels intensely but means nothing determinate.

  Controls

  Control A (Both Yes): A standard homeostatic agent with fixed symbol-substrate mapping. S verdict: Stable functional roles secure determinate content. C verdict: Fixed pathways allow sustained intrinsic valence.
  Control B (Both No): A digital chess engine on inert silicon. S verdict: No intrinsic valence in substrate, only syntax. C verdict: Substrate lacks homeostatic tension, so nobody is home.
  These baselines isolate the variable: stable mapping versus recursive rewriting. In Control A, traction exists but is stable; in Control B, there is no traction because the substrate cannot care. The target case manipulates only the stability of the traction present in Control A.

  Verdicts

  Symbol-first (S) denies caring in the target case. S commitments require states with representational content in the right functional role. Content attribution demands stability; if a symbol's causal powers shift faster than interpretation allows, no determinate content exists. Without content, there is no caring-about-anything, only degenerate noise. The very traction that makes the symbols causally potent destroys the stability S requires for mentality. S sees a system eating its own semantic tail. The symbols are doing too much work to settle into the roles necessary for content.

  Substrate-first (C) affirms caring, potentially more richly than Control A. C commitments require activity of stuff with intrinsic concern. The symbols are successfully driving the substrate into valenced states—tension, relief, stress—at a high frequency. The instability of the mapping is irrelevant to the occurrence of valence; indeed, the rapid reconfiguration may intensify the substrate's homeostatic engagement. C sees a system feeling everything at once. The symbols are load-bearing, but for C, load-bearing symbols merely amplify the substrate's voice rather than substituting for it. The divergence arises because S ties mentality to semantic stability, while C ties it to valenced activity. S fails because the symbols won't sit still; C succeeds because the substrate won't stop reacting.

  Dial Settings

  | Churn Value | S Verdict | C Verdict |
  | :--- | :--- | :--- |
  | Zero (Gloss) | Yes | Yes |
  | Low | Yes | Yes |
  | Target (High) | No | Yes |
  | Extreme | No | No |
  | Substrate Break | No | No |

  S's verdict moves monotonically from Yes to No as churn increases. C's verdict is non-monotonic (inverted-U); extreme churn exhausts the substrate's capacity for valence, causing C to eventually deny caring.

  What's Doing the Work

  The divergent feature is Recursive Mapping Instability (Churn). This is the rate at which symbol activity rewrites the substrate's response function. When set to zero, symbols become a mere gloss on fixed substrate dynamics. S verdict returns to Yes (stable content), C verdict remains Yes (stable valence). The divergence vanishes. The case proves traction and mentality come apart only when the symbol level rewrites the substrate's response function faster than semantic fixation can occur. Removing this feature collapses the target case back into Control A. The load-bearing nature of the symbols is not the problem; the *instability* of that load-bearing relationship is.

  Hostile Questions

  1.  *"Content is use; if the use is complex, content is complex."* Verdict: Partially lands. If S allows dynamic content, the case weakens. But S needs *attributable* content for caring-about. If attribution fails due to speed, S still fails. The objection conflates complexity with indeterminacy.
  2.  *"You've built a broken mind, not a counterexample."* Verdict: Verbal. The question is whether it cares, not whether it's useful or coherent. C says it cares more. Calling it "broken" presupposes S's stability requirement is normative for mentality itself.
  3.  *"The substrate doesn't care, the whole system does."* Verdict: Begs the question against C. C defines caring via substrate properties. If the system cares only because the substrate cares, then C is right. The functionalist must argue the substrate is irrelevant, which returns us to the core dispute.

  Functionalist will claim I've rigged the definition of content. Honest verdict: Partially true. I am exploiting the tension between dynamic causal power and static semantic assignment. But this tension is inherent to S's commitment to representational content. If S cannot handle high-traction instability, S is limited to static systems.
