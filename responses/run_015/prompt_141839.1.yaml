prompt: |-
  Hey — I need a hand building a case for section 3 of a paper I'm drafting (phil mind / cog sci; I'm a fourth-year, and this is the section I keep rewriting). Take the role of a professional philosopher of mind who's spent too long on the substrate-versus-symbol debate and who enjoys poking holes in setups; think it through carefully before you write anything, and brainstorm out loud first — three or four candidate architectures, one line each on why you dropped them. I want the rejected versions because half my own attempts die on a detail I didn't notice until someone in seminar pointed at it.

  So were on the same page, and in case you haven't met this bit before: careenium is a hypothetical stuff whose goings-on are intrinsically valenced — when a blob of it is in certain states there is something at stake for it, and not because of what those states mean or represent, that's just what the activity of that stuff is. Simmballs are symbols: the meaningless tokens that get shuffled according to rules. The question I'm working on is the old one — does the symbol level ever reach down and shove the substrate around, or is it only ever a description of what the substrate was going to do anyway? I'll name the two sides so the predictions are determinate:

  - Symbol-first (S): a system cares only if it has states with representational content sitting in the right functional role. The caring lives in the pattern; the substrate is just whatever the pattern happens to run on. No determinate content, no caring-about-anything (maybe some degenerate global glow, but not the thing we're arguing about). And: the more causal work the symbols do, the better S's case gets — or so S usually assumes.
  - Substrate-first (C): a system cares only if its activity is the activity of a stuff with intrinsic concern. Content is a bonus, not a requirement. What the symbols do matters just insofar as it changes what the substrate goes on to care about.

  What I need is a case where S and C come apart in the direction I can never get to work. The easy direction is the one everyone reaches for: heaps of symbol shuffling on a substrate that doesn't care (a chess engine, a lookup-table blockhead) — S says caring, C says nobody's home. I want the reverse. A system where the symbols are doing *more* causal work — genuinely pushing the substrate around, rewriting what it cares about, not floating above it — and where that very fact is what makes S's verdict come out negative or indeterminate, while C says: this thing cares, and more richly than the well-behaved version does. Roughly: the symbols push the substrate around so hard that they destroy the thing S needed in order to give the verdict S wanted to give.

  Constraints:

  1. Realistic in the boring sense: something an engineer could in principle build or a biologist could in principle find. No uploads, no teleporters, no zombies, no perfect predictors or simulators, no magic goo. The careenium can be hypothetical but give it a physical characterization (chemical gradients, homeostatic tension, prediction-error minimisation, whatever) — no spooky.
  2. One paragraph, ~200 words. First-years have to read it out loud in seminar.
  3. Cheating rules: (a) don't stipulate that some level is epiphenomenal — if the symbols don't do anything in your case, you've built the easy case and I already have one; (b) don't make S lose by pinning something obviously stupid on S — S's commitments are exactly the ones I listed; (c) the divergence has to fall out of the architecture, not be announced in it.
  4. Two controls where both camps give the same verdict, actually stated: one where both say caring, one where both say no caring, with the one-line reason each camp gives. That's what shows the target case isolates one variable rather than five.
  5. One dial. A single continuous parameter — I've been calling it the churn rate, meaning how fast the mapping from symbols to their effects on the substrate gets rewritten while the symbol level itself keeps running — such that turning it moves the case smoothly between the controls, with the target case as one setting of the dial. If the verdicts don't actually move monotonically with it, say so, I'd rather know now.
  6. A distinction I've been leaning on and want you to use: traction versus gloss. The symbol level has traction when which symbols are active makes a difference to what the substrate subsequently cares about; it's a mere gloss when it's a true but causally idle description of substrate activity. My target case needs traction at maximum — I want a story where the symbol level is maximally load-bearing and that is precisely the problem.

  What it's for: the section argues that "do the symbols push the substrate around?" and "is the symbol level where the mentality is?" are seperate questions that can come apart, and I've got a hostile functionalist in the audience who'll say any case like this is gerrymandered. So I need the load-bearing feature identified and I need to know what happens when it's removed.

  Also: please don't give me references, a reading list, or citations. I have those and I don't need them.

  Sections, in this order, rough lengths:

  - Brainstorm — ~150 words. The three or four architectures you considered, one line each on why you dropped them.
  - The case — one paragraph, ~200 words. Plain prose, no bullets, no diagrams.
  - Controls — ~120 words. The two agreeing cases and the one-sentence reason each camp gives.
  - Verdicts — ~300 words. What S says about the target case, what C says, and the reasoning that gets each there from their own commitments rather than from your own sympathies.
  - Dial settings — a small table, 4–6 rows: churn value (low / mid / target / high, your call) × S's verdict × C's verdict, plus one sentence underneath on whether the move is monotone.
  - What's doing the work — ~150 words. Name the single feature that generates the divergence, and say what the case collapses into when I remove it or set it to zero.
  - Hostile questions — ~250 words. The two or three best things my functionalist will say, and an honest verdict on whether each one lands or is just verbal.
