answer: |-
  Your intuitions are not random; they are a coherent, albeit tension-filled, attempt to balance three competing goods: **gender equality in the labor market**, **the child's need for familial attachment**, and **the parent's right to economic security**. The friction you feel arises because no single traditional theory (pure insurance, pure welfare, or pure labor regulation) captures all three.

  Below are three candidate principles. Each attempts to synthesize your verdicts into a defensible shape. None will fit every verdict perfectly; the value of this exercise is to see which mismatches you are willing to live with.

  ### Candidate 1: The "Protected Familial Capacity" Principle

  **Statement:**
  > Paid leave is a public entitlement allocated to individual parents to protect time for **non-market household integration**. It is non-transferable between parents to prevent intrahousehold bargaining failures, but reverts to the surviving household unit if an individual allocation becomes impossible. Use of the leave is prohibited for market labor but permitted for activities that enhance long-term household capacity, provided direct care is not outsourced to the market.

  **Motivating Clauses:**
  *   *Non-transferable:* Motivated by **(a)**. Prevents the higher earner (statistically the male) from buying out the lower earner's leave, reinforcing gendered roles.
  *   *Reverts to survivor:* Motivated by **(b)**. The "bargaining failure" risk vanishes if the second parent is absent; the household's need for integration time remains.
  *   *Non-market/No outsourcing:* Motivated by **(e)** vs. **(f)**. Remote work is market labor (forbidden). Retraining is capacity building (allowed) *if* the child is cared for familially (by the partner). Daycare is market outsourcing of the core duty (forbidden).
  *   *Individual allocation:* Motivated by **(j)**. The surrogate is not integrating the child into her household; she is providing a medical service.

  **Verdicts on New Cases:**
  1.  **Parent never in paid work:** Entitled. The principle is about *household integration*, not labor attachment. The "capacity" being protected is their ability to parent without immediate economic desperation.
  2.  **Second child 11 months later:** Entitled to a new full term. The "integration" task is distinct for each child. However, practical stacking rules would apply (you cannot be on leave for two children simultaneously).
  3.  **Care for disabled partner:** Not entitled under *parental* leave. This is not household integration of a new dependent child. This falls under a separate "carer's leave" schema.

  **Incompatible Verdicts:**
  *   **(c) No Clawback:** This principle struggles here. If the leave is for "household integration," and the parent quits immediately to move to a different household or sector, the public investment in *that* household's stability is lost. You would need to argue the right attaches to the *person*, not the household, which weakens the "household integration" justification.
  *   **(h) Stillbirth:** Hard to justify "integration" of a child who does not survive. You must argue the *process* of integration was undertaken, or that the recovery is part of the parental capacity protection.
  *   **(g) Replacement Rate:** This principle implies a flat rate (cost of integration is similar for all). The progressive rate you want requires a separate "income security" justification bolted on.

  **Cost Implications:**
  *   **Funding:** General revenue. Since the benefit is not tied to labor attachment (covers non-workers) and aims at social goods (equality, child development), it is a public investment, not an insurance payout.
  *   **Employer Role:** Employers should bear no direct cost (to prevent discrimination), but must hold the job (to ensure the "integration" can lead to a return).

  **The Unresolved Case (Three Adults):**
  *   **Verdict:** Do not divide the quota.
  *   **Reasoning:** The principle protects *parents* (legal guardians) to prevent bargaining failure between them. The third adult is a caregiver, but not a rights-holder under this specific equality logic. To divide it further invites the state into defining "functional parenting" too deeply.

  ---

  ### Candidate 2: The "Labor Market Equality" Principle

  **Statement:**
  > Paid leave is a regulatory mechanism designed to **neutralize the career penalty of reproduction**. It functions as a mandatory sabbatical to normalize absence for all parents, funded socially to prevent employer discrimination, with benefit levels calibrated to ensure the lower-earning parent is not forced out of the workforce.

  **Motivating Clauses:**
  *   *Non-transferable:* Motivated by **(a)**. If leave is transferable, the lower earner takes it, reinforcing the penalty on that career.
  *   *No Clawback:* Motivated by **(c)**. The benefit is a right earned by the biological/social event, not a contract with the employer. Clawbacks punish the very mobility the policy should protect.
  *   *Progressive Rate:* Motivated by **(g)**. A low earner cannot afford to take the leave without a high replacement rate; a high earner does not need 100% to stay attached.
  *   *Surrogate Distinction:* Motivated by **(j)**. The surrogate suffers a physical penalty (medical leave), but no *parental* career penalty (she is not raising the child).

  **Verdicts on New Cases:**
  1.  **Parent never in paid work:** Entitled to the floor. Without it, the "career penalty" logic excludes those with no career, but the "forced out of workforce" logic applies to their *future* entry.
  2.  **Second child 11 months later:** Entitled. The career penalty recurs with each interruption.
  3.  **Care for disabled partner:** Not entitled. This does not address the career penalty of *reproduction*.

  **Incompatible Verdicts:**
  *   **(e) & (f) (Use of Time):** This principle cannot explain your recoil at **(e)**. If the goal is neutralizing career penalties, what the parent does during leave is irrelevant. Whether they daycare the child or retrain, they are out of the labor market, which achieves the goal. Your intuition that leave is for *care* contradicts a pure labor-market justification.
  *   **(h) Stillbirth:** A stillbirth does not create a long-term caregiving burden that interrupts a career in the same way. Justifying full leave requires appealing to physical recovery (medical) or grief, not labor market normalization.
  *   **(i) Adoption (Older Child):** A pure labor market view might grant *less* leave for an older child (less physical recovery, less infant care). Your desire for *more* leave implies a child-welfare goal that supersedes the labor goal.

  **Cost Implications:**
  *   **Funding:** Payroll tax or general revenue. If framed as insurance against labor market risk, payroll tax fits. If framed as anti-discrimination regulation, general revenue is better (employers shouldn't pay for a social good).
  *   **Employer Role:** Employers must hold the post, but the wage cost is socialized.

  **The Unresolved Case (Three Adults):**
  *   **Verdict:** Divide into three shares *if* all three are legal parents. If only two are legal parents, two shares.
  *   **Reasoning:** The goal is to normalize absence for *all* caregivers to prevent discrimination against anyone who might care for a child. If the state recognizes three parents, it must protect three careers.

  ---

  ### Candidate 3: The "Child-Centric Attachment" Principle

  **Statement:**
  > Paid leave is a resource allocated to the **child's right to form secure attachments**, administered through parents. The quantum of leave is determined by the developmental needs of the child, not the labor status of the parent, and must be used to facilitate direct familial bonding.

  **Motivating Clauses:**
  *   *Stillbirth/Adoption:* Motivated by **(h)** and **(i)**. The need for attachment (or processing the loss of it) dictates the leave, not biology or labor. Older adopted children need *more* bonding time.
  *   *No Outsourcing:* Motivated by **(e)**. If the child is in daycare, the attachment goal is defeated.
  *   *Surrogate:* Motivated by **(j)**. The child does not attach to the surrogate; the surrogate is a medical vessel.
  *   *Survivor Flexibility:* Motivated by **(b)**. The child's need for care does not vanish because a parent died; the resource must flow to where the care can be provided.

  **Verdicts on New Cases:**
  1.  **Parent never in paid work:** Entitled. The child's right to attachment is independent of the parent's employment history.
  2.  **Second child 11 months later:** Complex. The *first* child still has attachment needs. The principle might demand *overlapping* leave or extended total duration, not just a reset.
  3.  **Care for disabled partner:** Not entitled under *parental* leave. The child's attachment is not the primary stake.

  **Incompatible Verdicts:**
  *   **(a) Non-transferable:** This is the hardest fit. If the goal is the *child's* attachment, and the parents agree the mother is the better primary attacher (or prefers it), blocking that agreement harms the child's interest to serve a gender-equality interest. You are prioritizing equality over the child's optimal care arrangement.
  *   **(c) No Clawback:** If the parent quits, the child's stability might be compromised. A pure child-centric view might support conditions that ensure stability (e.g., return to work), though this conflicts with parental autonomy.
  *   **(f) Retraining:** Hard to justify. If the parent is retraining, they are not attaching. You must argue that a better-educated parent attaches *better in the long run*, which is a stretch compared to immediate care.

  **Cost Implications:**
  *   **Funding:** General revenue. This is a child welfare benefit, akin to education or healthcare.
  *   **Employer Role:** Minimal. The employer is a third party to the child's rights.

  **The Unresolved Case (Three Adults):**
  *   **Verdict:** Do not divide. Allocate to the legal parents.
  *   **Reasoning:** The state should not adjudicate which of the three adults provides the "best" attachment. Legal parenthood is the bright line. However, you might allow the third adult to access a portion if the legal parents certify the child's need requires it, shifting discretion to the family.

  ### Recommendation for Your Deliberation

  You are currently holding **Candidate 1 (Familial Capacity)** as your operational principle, but you are borrowing the **Redistributive Mechanics of Candidate 2** and the **Eligibility Scope of Candidate 3**.

  The tension in **(a) vs (b)** is the most critical design flaw in your current thinking.
  *   In **(a)**, you treat the leave as an **Individual Right** (to prevent coercion).
  *   In **(b)**, you treat the leave as a **Household Resource** (to ensure care).

  **To resolve this:** You must explicitly state that the *non-transferability* is a **default rule against coercion**, not an absolute property of the leave.
  *   *Defense:* "We assign shares to individuals to prevent one parent from pressuring the other. When one parent is absent, the risk of coercion vanishes, so the restriction lifts to serve the child's need."

  **To resolve (e) vs (f):** You must explicitly state that leave is **Time Off From Market Labor**, not **Time On Duty For Care**.
  *   *Defense:* "We pay parents to be available to the household. Remote work violates availability. Retraining enhances household capacity. Daycare + Work violates the 'time off' principle. Daycare + Rest is permissible but we discourage it via culture, not law, because verifying 'rest' is impossible." (Note: This requires you to soften your recoil on (e) slightly, or accept an unenforceable rule).

  **On Cost:**
  Given your verdicts on (d) (general revenue for patchy workers) and (g) (progressive rates), you have already decided this is **not insurance**. It is a **social dividend**.
  *   *Defense:* "Reproduction creates the future tax base and labor force. The cost is a public investment in social reproduction, not a private cost borne by employers or a risk pooled only among workers."

  **Final Advice:**
  Adopt **Candidate 1** as your public justification. It is the only one that respects your desire to police *how* the time is used (e/f) while respecting the equality constraint (a). Acknowledge that (c) (quitting) is a concession to administrative feasibility (clawbacks are costly and punitive) rather than a theoretical perfect fit. Acknowledge that (b) is a "safety valve" for the non-transferability rule, not a contradiction.
