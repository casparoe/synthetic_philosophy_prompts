  3.  **Evaluate the Textual Evidence (Mental Check of Plato's *Laws* and *Republic*):**

      *   *Laws* Book 1 & 2: The Athenian Stranger discusses drinking clubs (*syssitia*/*symposia*).
      *   *Key Concept:* The "testing" (*basanos*) of character.
      *   *Key Concept:* The role of the "Symposiarch" (Lord of the Feast).
