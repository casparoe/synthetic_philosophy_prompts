          *   *Nuance:* Plato *does* endorse the *institution*, but does he endorse *drunkenness*? He endorses the *risk* of drunkenness under supervision to test virtue. So Marcus is right about the intent, Elena is right that the *goal* isn't chaos.

      *   **Round 2: The Republic Distinction (Guardians vs. Citizens)**
          *   *Marcus:* *Republic* rules are class-specific.
