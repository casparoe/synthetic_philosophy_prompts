answer: |-
  ### I. The Mapping (Seminar Handout)

  **The Object:** Act-Consequentialism (AC).
  **Risk Translation:** Single-asset optimization. Maximize Expected Value (EV) of terminal wealth $W_T$ as $T \to \infty$. Objective function: $\max E[\sum_{t=0}^\infty \delta^t U(C_t)]$.

  **The Cluelessness Objection**
  *   **Philosophical:** Causal chains extend indefinitely; far-future consequences dominate; sign/magnitude unknowable.
  *   **Risk Vocabulary:**
      1.  **Infinite Horizon / Non-Convergence:** The integral of expected cash flows diverges. The asset duration is infinite.
      2.  **Model Risk / Knightian Uncertainty:** The generating process for $t > t_{proximal}$ is unknown. Distributional parameters ($\mu, \sigma, \alpha$) are not estimable from historical data.
      3.  **Tail Dominance:** The tail index $\alpha$ is such that variance is infinite or mean is undefined. The Value-at-Risk (VaR) and Expected Shortfall (ES) at high confidence levels are unbounded.
      4.  **Result:** The optimal Kelly fraction is undefined (or zero). The book cannot be priced.

  **Reply 1: Second-Order (Subjective EV)**
  *   **Philosophical:** Maximize on current evidence, accept error.
  *   **Risk Vocabulary:** **Bayesian Estimation.** Use the posterior predictive distribution given current information set $\mathcal{F}_t$. Maximize subjective EV. Acknowledge high estimation error (wide confidence intervals). Treat the decision as a **single-shot bet** with noisy inputs rather than a repeatable trade.
  *   **Constraint:** Requires a prior. If the prior is improper or the likelihood is flat, the posterior remains uninformative.

  **Reply 2: Indirect (Rules/Dispositions)**
  *   **Philosophical:** Optimize rules, not acts.
  *   **Risk Vocabulary:** **Strategy Optimization / Backtesting.** Do not optimize the individual trade; optimize the trading algorithm. Evaluate the **P&L distribution of the rule** over a historical sample of regimes. Seek **robustness** (minimax regret) across model specifications rather than maximization under a single model.
  *   **Constraint:** Assumes the rule is applied repeatedly (ergodicity across agents/time) or that the historical sample is representative of future regimes (stationarity).

  **Reply 3: Proximalism**
  *   **Philosophical:** Act on estimable consequences; ignore or assume symmetry for distal terms.
  *   **Risk Vocabulary:** **Truncation / Mark-to-Model.** Set a finite horizon $T^*$. Assume **Residual Value = 0** at $T^*$. Alternatively, assume the residual exposure is **market-neutral** (beta = 0) relative to the objective function. Apply a high **discount rate** $r$ to force convergence of the NPV integral.
  *   **Constraint:** Arbitrary choice of $T^*$. Assumes no structural breaks occur immediately after $T^*$.

  **User Distinction: Cluelessness Types**
  *   **Sign:** Unknown drift $\mu$. Is the position long or short volatility?
  *   **Scale:** Unknown volatility $\sigma$ or tail index $\alpha$. You know the direction, but the position size required to capture the edge blows up the risk limits.
  *   **Numéraire:** Undefined utility function. You have the P&L stream in physical units, but no exchange rate to the booking currency. Aggregation across counterparties (persons) is undefined.

  **User Test: Horizon Stability**
  *   **Philosophical:** Does the ranking settle as the horizon extends?
  *   **Risk Vocabulary:** **Ergodicity Check.** Plot the cumulative EV estimate against time horizon $T$. If the estimate oscillates or diverges as $T \to \infty$, the process is **non-ergodic**. The time average does not equal the ensemble average. The asset is unpriceable.

  ***

  ### II. The Ledger of Loss

  **1. Clean Translations**
  *   **Sign/Scale Cluelessness:** Maps directly to parameter uncertainty ($\mu, \sigma$) and fat-tailed distributions (undefined moments). The risk vocabulary handles "I don't know the mean" and "I don't know the variance" natively.
  *   **Proximalism as Truncation:** This is standard book management. If you can't model the tail, you cap the horizon or assume liquidation.
  *   **Horizon Stability:** This is exactly how quants test for model validity. If the Sharpe ratio of a strategy collapses as you extend the backtest window, the alpha is illusory.

  **2. Translations Requiring Borrowed Assumptions**
  *   **The Numéraire (Critical Failure):**
      *   *Assumption Borrowed:* A liquid market price for the payoff.
      *   *Loss:* Finance assumes a numéraire (USD, EUR) and a utility function (usually log-wealth or linear) is *given*. Ethics treats the numéraire (welfare, preference satisfaction) as the *object of dispute*. The risk vocabulary has no organ for "what are we counting?" It only answers "how much of it?"
      *   *Verdict:* Defect of the risk framework. It is instrumental. It prices risk relative to a goal; it cannot validate the goal.
  *   **The Indirect Reply (Stationarity):**
      *   *Assumption Borrowed:* Stationary generating process.
      *   *Loss:* Backtesting a rule assumes the future resembles the past. Moral regimes (technological, social) undergo structural breaks. A rule optimized on 19th-century data fails in the nuclear age.
      *   *Verdict:* Defect of the philosophical claim. If the environment is non-stationary, rule-utilitarianism inherits the same cluelessness as act-utilitarianism, just one layer higher.
  *   **Second-Order Reply (Priors):**
      *   *Assumption Borrowed:* Well-specified Prior.
      *   *Loss:* "Maximize on your evidence" requires a prior distribution over the unknown parameters. In radical cluelessness, there is no basis for a prior (Principle of Indifference fails in high dimensions).
      *   *Verdict:* Defect of the philosophical claim. It masks the arbitrariness of the prior as "subjective rationality."

  **3. Unsayable Claims**
  *   **Obligation vs. Exposure:** Risk vocabulary describes *exposure* to outcomes. It cannot generate *obligation*. You can say "this position has undefined risk," but you cannot say "you ought not hold it" without an external mandate (risk limit). Consequentialism claims the *math itself* generates the ought. Risk math says "I can't price this," not "You can't do this."
  *   **The Single-Shot Problem:** Risk management relies on the Law of Large Numbers (portfolio diversification or repeated trading) to tame variance. Moral acts are often treated as unique, non-repeatable, non-diversifiable events. The Kelly criterion breaks down for single-shot bets with infinite downside.
  *   **Interpersonal Aggregation:** Finance aggregates P&L across a book because money is fungible. Ethics aggregates welfare across persons. The risk vocabulary treats all counterparties as sources of cash flow; it has no variable for "separateness of persons."

  **4. Direction of the Loss**
  *   **On Numéraire:** Defect of Risk Framework. Finance is not metaphysics. It cannot tell you what is good, only how to get what you want. The philosophical heat here is real; the risk vocabulary rightly ignores it because it is outside the pricing engine.
  *   **On Horizon Stability:** Defect of Philosophical Claim. If the EV estimate does not converge as $T \to \infty$, the quantity "Expected Value of the Act" does not exist. A risk desk would not say "we need a better model"; they would say "this asset is toxic / untradeable." The philosopher wants a decision rule where the quant sees a singularity.
  *   **On Indirect/Rule Reply:** Defect of Philosophical Claim. It attempts to solve non-stationarity by assuming stationarity at the rule level. A risk manager knows that regime change kills rules.
  *   **On Second-Order Reply:** Defect of Philosophical Claim. It is "fractional Kelly" applied to a void. If the edge is unknown, the optimal bet is zero. Claiming you should bet anyway is a preference for action, not a result of the calculation.

  **Summary Verdict:**
  The risk vocabulary successfully formalizes the *structure* of the ignorance (undefined moments, non-ergodicity). It fails to capture the *normativity* (why we must act despite the singularity). The cluelessness objection, translated, reads: "The asset has infinite duration, undefined moments, and no numéraire." The risk desk's response is: "Do not trade." The philosopher's response is: "You must trade." The vocabulary cannot resolve that conflict because it is not a pricing problem; it is a mandate problem.
