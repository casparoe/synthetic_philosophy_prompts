  The strongest objection: "You have dissolved the problem by denying its premises." Newcomb's problem stipulates a predictor reliable *about you*. If you find a partition where reliability drops, you are no longer in Newcomb's Problem; you are in a different game. The philosophical puzzle is precisely what to do when the correlation *cannot* be partitioned away (e.g., logical dependence). By focusing on cases where it can, you argue against a straw man. You show that *badly specified* Newcomb problems are solvable, not that the original problem is ill-posed. The challenge is to justify why the original stipulation ("reliable about you") isn't just a shorthand for "no admissible partitions exist." If it is shorthand, your post is a clarification, not a critique. If it isn't, you haven't engaged the core tension.
