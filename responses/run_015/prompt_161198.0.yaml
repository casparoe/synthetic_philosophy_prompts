answer: |-
  The simple conditional analysis proposes that an object $x$ is disposed to give response $R$ to stimulus $S$ if and only if, were $x$ to undergo $S$, $x$ would give $R$. This biconditional aims to reduce dispositional properties to counterfactual conditionals. However, the analysis collapses under the weight of interference cases, which demonstrate that the conditional fails to track the disposition reliably.

  Consider first the "fink" case. An object possesses a categorical basis for a disposition, but the arrival of the stimulus triggers a mechanism that instantly removes that basis before the response can occur. A wire is connected to a sensor that detects voltage and instantly severs the wire. The wire is conductive, yet were voltage applied, it would not conduct. Here, the disposition is present, but the conditional is false. This breaks the left-to-right direction of the biconditional. Contrast this with the "mask" case. The object possesses the categorical basis, and the stimulus occurs, but an extrinsic factor prevents the response without altering the basis. A fragile glass is wrapped in bubble wrap. It is struck, but does not break. If we assess the disposition contextually, we might say the glass is not disposed to break *in these conditions*, yet the basis remains intact. While standardly viewed as another left-to-right failure, structurally it pressures the analysis from the opposite end: the fink shows the conditional is too demanding on the persistence of the basis, while the mask shows the conditional is too sensitive to extrinsic blockers. Together, they show the conditional neither necessitates nor suffices for the disposition without qualification.

  Two repairs attempt to salvage the analysis. The first adds a *ceteris paribus* clause: $x$ is disposed to $R$ to $S$ iff $x$ would $R$ were $x$ to undergo $S$ and conditions were normal. This fails because "normalcy" is defined by the absence of finks and masks. To specify the conditions non-circularly, one must already know which factors interfere with the disposition, requiring prior knowledge of the disposition itself. The clause vacuously excludes counterexamples by stipulation rather than explanation.

  The second repair makes dispositions gradable. $x$ is disposed to $R$ in $S$ iff $x$ would $R$ in a suitably high proportion of relevant $S$-cases, with the threshold fixed by context. This handles probabilistic dispositions well but fails on binary structural cases. It cannot distinguish between an object that lacks the basis entirely and one that has the basis but is consistently masked. If the threshold is context-dependent, the disposition becomes merely a statement about statistical regularities rather than a property of the object.

  Three novel cases demonstrate the superiority of a basis-grounded account, on which dispositions are identical to or grounded in categorical microstructures, and conditionals are merely defeasible evidence.

  1.  **The Flickering Masker:** A wire is in series with an indeterministic interrupter that has a 0.6 objective chance of opening the circuit when current would flow. The wire's microstructure is constant.
      *   *Ceteris Paribus:* Unclear. Is the interrupter part of the "normal" conditions? If yes, the conditional fails. If no, it holds. The analysis offers no verdict without arbitrary stipulation.
      *   *Gradable:* The wire conducts in 40% of trials. Whether this counts as "conductive" depends on a contextual threshold. This makes conductivity a vague, context-relative property rather than a physical fact.
      *   *Basis-Grounded:* The wire's microstructure supports electron flow. The interrupter is extrinsic. The wire is fully conductive; the manifestation is merely probabilistically masked.
      *   *Verdict:* Intuition suggests the wire remains conductive regardless of the interrupter. The basis account captures this; the others dissolve the property into context.

  2.  **The Reset Fink:** Contact with a probe opens a relay, closing one millisecond later with the probe still in contact, allowing current to flow. The wire's intrinsic state never changes.
      *   *Ceteris Paribus:* If the relay opening is "normal," the conditional fails initially. If the delay is ignored, it holds. The analysis struggles with the temporal window of manifestation.
      *   *Gradable:* Current flows eventually. The proportion of successful manifestations is high (100% after 1ms). It counts as disposed.
      *   *Basis-Grounded:* The basis for conductivity is present throughout. The disposition is never withdrawn, only temporarily blocked.
      *   *Verdict:* Intuition is unsettled regarding whether a 1ms delay constitutes a loss of disposition. However, the basis account clarifies the stakes: if the basis persists, the disposition persists. The conditional analyses obscure the distinction between basis-loss and manifestation-delay.

  3.  **The Enabler that Also Masks:** A loop is superconducting only while a cryogenic field is maintained, but the field quenches whenever current begins to flow. Without the field, there is no conductivity; with it, no current flows.
      *   *Ceteris Paribus:* Contradictory. Normal conditions require the field (for basis) and the absence of quenching (for manifestation). The conditional is necessarily false.
      *   *Gradable:* Current flows in 0% of cases. The object is not disposed.
      *   *Basis-Grounded:* The basis exists only when the field is on. When the basis exists, the manifestation is impossible. The object has a conditional basis but no coherent disposition to manifest.
      *   *Verdict:* Intuition suggests the loop does not conduct. The gradable and basis accounts agree, but the basis account explains *why*: the enabling condition destroys the manifestation condition. The conditional analysis simply records the failure.

  The pattern of verdicts favors the basis-grounded account. It preserves the intrinsicality of dispositions against extrinsic interferers (Flickering Masker), distinguishes basis-loss from blocking (Reset Fink), and explains impossible manifestations (Enabler/Mask).

  However, this account faces two costs. First, bases are often specified dispositionally (e.g., "ionic lattice capable of moving"), threatening circularity. Second, multiple realizability suggests the same disposition can arise from distinct bases, weakening the identity claim. These costs are manageable. Circularity is avoided by specifying bases in purely categorical terms (e.g., specific atomic arrangements) rather than causal powers. Multiple realizability is handled by treating dispositions as functional roles realized by categorical bases; the disposition is the role, the basis is the realizer. This preserves the metaphysical grounding without demanding strict identity across all possible worlds.

  The strongest objection is epistemic: we have no access to categorical bases independent of their causal effects. If we cannot identify the basis without observing the conditional regularities, positing it is metaphysically idle.

  The reply is that epistemic access does not dictate metaphysical structure. We may identify water via its appearance while defining it as H2O. Similarly, we identify dispositions via conditionals while grounding them in categorical bases. The conditional analysis fails because it conflates the evidence for a property with the property itself. A basis-grounded account respects the distinction, securing dispositions as real features of objects rather than shadows of their interactions.
