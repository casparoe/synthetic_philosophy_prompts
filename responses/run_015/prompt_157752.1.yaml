prompt: |-
  I've been asked to write down my real position on animals rather than repeat an organisation's line — I sit on the board of a large municipal animal shelter and do volunteer policy work for a farmed-animal welfare group, and the two roles keep pulling me in different directions. Before I present it to either group I'd like an audit of whether it hangs together. Roughly where I've landed:

  1. Speciesism is unjustified. Sentience is what makes a being count morally at all; once a being counts, its interests count equally regardless of species, and psychological capacities rather than species membership are what track the content of what we owe.

  2. Full protection against being killed attaches only to persons — beings with an extended self-conception, plans and projects that reach into the future. Non-persons can permissibly be killed painlessly and replaced by another equally well-off non-person when doing so produces more welfare, so a genuinely high-welfare farm is not objectionable in the killing itself, only in how the animals live.

  3. It is seriously wrong to kill a human being who is not a person — an infant, or an adult with profound cognitive disability — even where a painless death and a replacement would produce more welfare. I don't want this to rest on the feelings of relatives or on how such a practice would affect third parties; I think the wrong is to the individual killed.

  4. Suffering is what makes factory farming a catastrophe, and the sheer numbers involved swamp anything shelters deal with, so the money should go there rather than to companion-animal rescue.

  5. Wild-animal suffering is a serious problem, but we have no duty to intervene against predation, and in practice I oppose intervention programmes even where they look safe and cheap. I don't want this to rest on the value of wildness or naturalness, which I think is empty.

  6. We owe more to domesticated animals — the ones we bred into existence and made dependent on us — than to wild ones, and this isn't only a matter of how much good we can do per dollar; it is about what we have already done to them.

  7. Concretely: I think our shelter is right to spend its budget on neutering and rehoming dogs and cats, and that it would be wrong to shut it down and send the money to a broiler-welfare campaign, even though that would do far more good per dollar.

  What I can't locate is where this package breaks. Which of these commitments actually pull against which others, and which apparent conflicts dissolve once the terms are made precise? For each real conflict, tell me what would have to give and what the cheapest repair costs me. Rank the problems by severity rather than treating them as equally bad, and say which single revision would clean up the most.
reasoning: |-
  Here's a thinking process that leads to the audit of the user's ethical position:

  1.  **Analyze the Request:**
      *   **User:** Board member of a municipal animal shelter + volunteer policy worker for a farmed-animal welfare group.
      *   **Task:** Audit their personal ethical position on animals for internal consistency (coherence).
      *   **Input:** 7 specific claims/commitments.
      *   **Output:** Identify conflicts, rank by severity, explain what must give/repair costs, and suggest the single most effective revision.
      *   **Constraint:** Do not just repeat organizational lines; focus on philosophical coherence.

  2.  **Deconstruct the 7 Commitments:**
      *   *C1 (Speciesism/Sentience):* Sentience = moral count. Interests count equally across species. Psychological capacities determine *what* we owe (content of duties).
      *   *C2 (Personhood/Killing):* Only "persons" (future-oriented self-conception) have a right to life. Non-persons can be replaced (Replaceability Argument). High-welfare farming is okay regarding killing, bad regarding living conditions.
      *   *C3 (Human Non-Persons):* Killing human non-persons (infants, severely disabled) is seriously wrong, even if painless + replacement + net welfare gain. Wrong is *to the individual*.
      *   *C4 (Suffering/Priority):* Factory farming suffering swamps shelter issues. Money *should* go to farmed animals (consequentialist priority).
      *   *C5 (Wild Animals):* Wild animal suffering is real. No duty to intervene against predation. Oppose intervention even if safe/cheap. Not based on "naturalness."
      *   *C6 (Special Obligation/Domestication):* We owe more to domesticated animals due to dependency/creation history (relational/historical duty), not just efficiency.
      *   *C7 (Concrete Allocation):* Shelter should spend on dogs/cats (neuter/rehome). Wrong to shut shelter for broiler campaigns, *even though* broiler campaigns do more good per dollar.

  3.  **Identify Potential Conflicts (Brainstorming):**

      *   *C1 vs. C3:* C1 says interests count equally regardless of species. C2 says non-persons can be replaced. C3 says human non-persons *cannot* be replaced/killed. This looks like speciesism (violating C1).
      *   *C2 vs. C6:* C2 allows killing non-persons if welfare is maintained (replaceability). C6 says we owe domesticated animals more. Does C6 override C2? If we owe them more, does that mean we can't kill them? C7 suggests we shouldn't shut the shelter, implying a duty to keep them alive/supported.
      *   *C4 vs. C7:* C4 says money *should* go to farmed animals because suffering swamps shelter issues. C7 says shelter should *not* shut down to fund broiler campaigns, even if less efficient. This is a direct tension between consequentialist priority (C4) and special obligation/practical commitment (C7).
      *   *C1/C2 vs. C5:* C1/C2 focus on sentience/personhood. C5 says no duty to intervene in wild suffering. If sentience counts equally (C1), why does location (wild vs. domestic) absolve us of duty to prevent suffering (C5), especially if intervention is safe/cheap? C5 explicitly rejects "naturalness" as a justification.
      *   *C3 vs. C1/C2:* This is the classic "Marginal Cases" argument. If human non-persons have a right to life but animal non-persons don't, isn't that speciesism? C1 explicitly rejects speciesism.

  4.  **Evaluate and Rank Conflicts:**

      *   **Conflict A: The "Marginal Cases" Problem (C1 + C2 vs. C3).**
          *   *Tension:* C1 says species doesn't matter, only psychology. C2 says non-persons are replaceable. C3 says human non-persons are *not* replaceable.
          *   *Severity:* **Critical.** This is a direct contradiction of C1. If you hold C1 and C2, C3 is unjustified speciesism. If you hold C3, you must abandon C1 or C2.
          *   *Repair:* Either admit species matters (drop C1), or accept that human non-persons are replaceable (drop C3 - very hard pill to swallow), or find a non-speciesist reason why human non-persons differ from animal non-persons (e.g., social relations, but C3 says "wrong to the individual").

      *   **Conflict B: Consequentialism vs. Special Obligations (C4 vs. C7).**
          *   *Tension:* C4 is utilitarian/consequentialist (suffering numbers dictate funding). C7 is deontological/relational (we have a specific duty to *these* animals regardless of efficiency).
          *   *Severity:* **High.** This is the practical tension between the two roles (Shelter vs. Farmed Animal Group). C7 explicitly contradicts the implication of C4.
          *   *Repair:* Prioritize C6 (Special Obligation) over C4 (Pure Consequentialism). Admit that "most good" isn't the only metric.

      *   **Conflict C: Wild Suffering Inaction (C1 vs. C5).**
          *   *Tension:* If sentience counts equally (C1), suffering is bad. If we can stop it safely/cheaply (C5 condition), why not? C5 rejects "naturalness."
          *   *Severity:* **Medium.** It's an inconsistency in the application of the harm principle, but often excused by epistemic uncertainty (which C5 tries to pre-empt by saying "even where safe/cheap").
          *   *Repair:* Admit a "laissez-faire" intuition that isn't fully grounded in C1, or lean harder on risk/uncertainty despite the "safe/cheap" clause.

      *   **Conflict D: Replaceability vs. Domestication (C2 vs. C6/C7).**
          *   *Tension:* C2 says killing non-persons is fine if replaced. C6/C7 implies we shouldn't kill shelter animals (rehoming/neutering implies keeping them alive).
          *   *Severity:* **Medium-Low.** Can be resolved by C6. We owe domesticated animals *more*, potentially including a right to life not owed to wild or farmed animals.
          *   *Repair:* Use C6 to create an exception to C2 for domesticated animals.

  5.  **Drafting the Audit:**

      *   *Introduction:* Acknowledge the sophistication of the position. It's a hybrid view (Utilitarian + Rights/Contractualist + Relational).
      *   *Ranking:*
          1.  **The Speciesism Contradiction (C1 vs. C3).** This is the philosophical kill-shot.
          2.  **The Allocation Paradox (C4 vs. C7).** This is the practical/role conflict.
          3.  **The Wild Suffering Gap (C1 vs. C5).** This is a theoretical loose end.
      *   *Analysis of Each:* Explain *why* it conflicts and the cost of repair.
      *   *The Single Revision:* What fixes the most? Usually, modifying C1 to allow for "relational status" or modifying C3 to align with C2 (too hard), or modifying C1 to be less rigid. Actually, the best fix is likely refining C1 to accommodate C6/C3 via a "relational" or "social" criterion rather than pure sentience/species. Or, acknowledging that C1 is an ideal theory while C3/C6 are non-ideal/practical.
      *   *Wait, looking closer at C1:* "Psychological capacities... track the content of what we owe." This allows for different *treatment* based on capacity. But C3 says human non-persons get *more* protection than animal non-persons despite similar capacity. That violates "regardless of species."
      *   *Best Single Revision:* Modify C1. It's too rigid. Change "interests count equally regardless of species" to "interests count equally *ceteris paribus*, but relational history and social context create additional obligations." This saves C3, C6, and C7 without abandoning the core sentience focus.

  6.  **Refining the Output:**
      *   Tone: Professional, philosophical, direct, helpful.
      *   Structure: Executive Summary -> Ranked Conflicts -> Repair Costs -> The Single Revision.
      *   Check against constraints: "Rank problems by severity," "say which single revision would clean up the most."

      *(Self-Correction during drafting)*: I need to make sure I don't just say "You're speciesist." I need to show *where* the logic breaks. The break is between C1's universalism and C3's particularism.
      Also, C4 vs C7 is the practical manifestation of C1 vs C6. C4 says "maximize good." C7 says "honor specific duty."
      The "Single Revision" should probably target C1 because it's the foundational premise causing friction with C3, C6, and C7. If C1 is softened to allow for special obligations, the rest falls into place.

      *Wait, let's look at C2 vs C6/C7 again.* C2 says high-welfare farm killing is okay. C7 says shelter shouldn't close (implying keeping cats/dogs alive is priority). If shelter animals are non-persons (likely), C2 says they can be replaced. C7 says don't kill/shut down. C6 bridges this (we owe domesticated more). So C2 needs an exception for domesticated animals.

      *Let's finalize the ranking:*
      1.  **C1 vs. C3 (The Moral Status Contradiction).** This undermines the entire ethical foundation. If C1 is true, C3 is false. If C3 is true, C1 is false.
      2.  **C4 vs. C7 (The Resource Allocation Contradiction).** This is the practical version of the theoretical conflict. C4 says maximize utility. C7 says honor special duty.
      3.  **C2 vs. C6 (The Replaceability Tension).** C2 allows killing non-persons. C6 implies stronger duties to domesticates. Needs clarification.
      4.  **C1 vs. C5 (The Wild Suffering Omission).** Less severe because it can be chalked up to epistemic humility, but C5 explicitly rules out "safe/cheap" interventions, which makes it harder to defend under C1.

      *Single Revision:* Modify C1. It is the source of the friction. It claims a pure sentience-based egalitarianism that the rest of the view rejects.

  7.  **Final Polish:** Ensure the advice is actionable for someone presenting to a board and a policy group. They need to sound consistent, not confused.

      *Wait, one nuance:* C3 says "I don't want this to rest on the feelings of relatives." This blocks the "social disruption" argument. This makes C3 very hard to defend without speciesism. I need to highlight this specific constraint as a major vulnerability.

      *Okay, ready to write.*
answer: |-
  This is a sophisticated, hybrid ethical framework. You are attempting to synthesize **utilitarian consequentialism** (C2, C4), **personhood-based rights theory** (C1, C2), **human rights intuitions** (C3), and **relational ethics** (C6, C7).

  While intellectually rich, the package contains significant internal friction. The conflicts are not merely verbal; they represent competing foundational axioms. Below is an audit of the coherence of your position, ranked by severity.

  ### 1. The Moral Status Contradiction (Severity: Critical)
  **Conflict:** C1 + C2 vs. C3
  **The Tension:**
  *   **C1** states that species membership is irrelevant and psychological capacities track what we owe.
  *   **C2** states that non-persons (beings without future-oriented self-conception) are replaceable; killing them is permissible if welfare is maintained.
  *   **C3** states that human non-persons (infants, cognitively disabled adults) are *not* replaceable and killing them is seriously wrong, even if welfare is maintained.

  **The Break:**
  This is the classic "Argument from Marginal Cases." If C1 and C2 are true, C3 is unjustified speciesism. A human infant and a pig often share similar psychological capacities (non-personhood). If the pig can be painlessly killed and replaced (C2), consistency demands the infant can be too, unless you introduce a morally relevant difference.
  You explicitly block the standard repairs in C3: you reject "feelings of relatives" (social disruption) and "effect on third parties." You insist the wrong is *to the individual*. But if the individual is a non-person (per C2), they have no interest in continuing to live, only in experiencing welfare. Therefore, under your own definitions, there is no "wrong to the individual" in the human case that doesn't also apply to the animal case.

  **Repair Costs:**
  *   **Option A (Drop C3):** Accept that human non-persons are replaceable. *Cost:* Socially and legally untenable; violates deep moral intuitions.
  *   **Option B (Drop C1/C2):** Admit that species membership or "humanity" confers special status regardless of psychology. *Cost:* Abandons the anti-speciesist foundation of your farmed-animal work.
  *   **Option C (Refine "Personhood"):** Argue that human non-persons possess a *potential* for personhood or are members of a kind that is typically personhood-having. *Cost:* Philosophically contentious (the "kind argument" is often criticized as a speciesism disguise), but the most viable middle ground.

  ### 2. The Allocation Paradox (Severity: High)
  **Conflict:** C4 vs. C7
  **The Tension:**
  *   **C4** is a consequentialist claim: Suffering numbers dictate priority. Farmed animal suffering swamps shelter issues; therefore, money *should* go there.
  *   **C7** is a deontological/relational claim: The shelter *should not* shut down to fund broiler campaigns, even if that would do *more good per dollar*.

  **The Break:**
  C7 explicitly contradicts the imperative generated by C4. If C4 is true ("the money should go there"), then C7 ("it would be wrong to send the money there") is false. You are asserting that maximizing good (C4) is the correct metric for evaluating suffering, but rejecting it as the correct metric for allocating your own resources (C7).
  While C6 (special obligation to domesticates) attempts to bridge this, C4 is phrased as an objective claim about where money *should* go globally, whereas C7 is about your specific institutional role. The conflict arises because you are using C4 to critique the shelter's existence while using C7 to defend it.

  **Repair Costs:**
  *   **Option A (Drop C4):** Reframe C4. Instead of "money should go there," say "from a purely impersonal utilitarian view, farmed animals are a higher priority, but we are not purely impersonal agents." *Cost:* Weakens the rhetorical force of your farmed-animal advocacy.
  *   **Option B (Drop C7):** Commit to shutting down the shelter if a broiler campaign is sufficiently more effective. *Cost:* Impossible for a board fiduciary; violates C6.

  ### 3. The Wild Suffering Gap (Severity: Medium)
  **Conflict:** C1 vs. C5
  **The Tension:**
  *   **C1** says sentience is what makes a being count.
  *   **C5** says we have no duty to intervene in wild suffering (predation), even if intervention is safe and cheap, and explicitly rejects "naturalness" as a justification.

  **The Break:**
  If sentience is the only thing that makes a being count (C1), then a wildebeest eaten alive counts just as much as a cow. If you reject "naturalness" as a value (C5), you remove the standard barrier to intervention. If the intervention is "safe and cheap" (per your C5 constraint), refusing to act looks like a violation of the duty to prevent suffering implied by C1.
  Usually, this is defended by epistemic uncertainty (we might make it worse). But by stipulating "even where they look safe and cheap," you have closed off the epistemic defense. You are left with an intuition (non-interference) that lacks a foundation in your stated principles.

  **Repair Costs:**
  *   **Option A (Accept Duty):** Admit a duty to intervene in nature. *Cost:* Radical, potentially unworkable, alienates conservationists.
  *   **Option B (Reintroduce "Naturalness"):** Allow that wild systems have value independent of individual welfare. *Cost:* Contradicts your explicit rejection of naturalness in C5.
  *   **Option C (Epistemic Humility):** Argue that "safe and cheap" is never truly knowable in complex ecosystems. *Cost:* Requires rewriting C5 to remove the "even where they look safe" clause.

  ### 4. The Replaceability Tension (Severity: Low-Medium)
  **Conflict:** C2 vs. C6/C7
  **The Tension:**
  *   **C2** allows killing non-persons if replaced.
  *   **C6/C7** imply we owe domesticated animals (dogs/cats) continued existence and support, not just welfare replacement.

  **The Break:**
  Most shelter dogs and cats are likely "non-persons" by your C2 definition (no extended self-conception). C2 suggests that if a shelter dog is painlessly killed and replaced by an equally happy puppy, no wrong occurs. C7 suggests the shelter's job is to keep *this* dog alive.
  However, this is the easiest conflict to resolve. C6 (special obligation due to domestication) can function as an *exception clause* to C2. You can argue that by breeding them into dependency, we have incurred a duty not to treat them as replaceable units, even if they lack personhood.

  **Repair Costs:**
  *   **Option A (Qualify C2):** Add "except where special relational obligations exist." *Cost:* Makes the theory less clean/universal, but accurately reflects your view.

  ---

  ### The Single Revision That Cleans Up the Most

  **Revise Commitment 1 (C1).**

  Your current C1 is a **pure sentience egalitarianism** ("interests count equally regardless of species"). This is the source of the Critical Conflict (C3) and the High Conflict (C4 vs C7). It forces you into a corner where you must either defend the replaceability of human infants or admit speciesism.

  **Proposed Revision:**
  > "Sentience is what makes a being count morally at all. However, the **weight** of those interests is determined not only by psychological capacities but also by **relational history and social context**. While species membership alone is not morally decisive, the specific relationships we have created (domestication) and the social kinds we inhabit (human community) generate special obligations that can override impersonal welfare calculations."

  **Why this fixes the package:**
  1.  **Resolves C1 vs. C3:** It allows you to protect human non-persons not because they are *human* (speciesism), but because of the specific social/relational kind they belong to, without extending that same protection to pigs (avoiding the replaceability of infants).
  2.  **Resolves C4 vs. C7:** It validates C7. You can acknowledge that farmed animals suffer more (C4) but argue that the shelter has specific *relational duties* to the local companion animals that trump the impersonal utility calculation.
  3.  **Resolves C2 vs. C6:** It codifies C6 as a fundamental modifier of C2, rather than an afterthought. Domesticated animals are not replaceable *because* of the relationship, even if they are non-persons.
  4.  **Preserves C5:** It allows you to maintain non-intervention in the wild (C5) because we lack those specific relational obligations to wild animals, despite their sentience.

  **The Cost:**
  You lose the purity of the "equal consideration" slogan. You move from a strict utilitarian/rights hybrid to a **relational pluralist** view. This may require slightly more nuanced language when speaking to the farmed-animal group (who often prefer strict equality), but it makes your position defensible to the shelter board and consistent with your own intuitions about human disability.

  ### Summary Recommendation for Presentation
  *   **To the Shelter Board:** Emphasize the revised C1 and C6. You are there to fulfill a specific *contract of domestication*, not to maximize global utility. The shelter is a hospital for dependents, not a triage unit for the world.
  *   **To the Farmed-Animal Group:** Emphasize C2 and C4. Acknowledge that while you have special duties to pets, the *scale* of suffering in farming is the paramount moral catastrophe for society at large. You are not arguing against their priority, but explaining why your specific role is different.
  *   **Keep C3 Private or Carefully Framed:** The human non-person exception is the most vulnerable point. If pressed, frame it as a "social kind" protection rather than a biological one, to minimize the appearance of speciesism.
