prompt: |-
  i'm the editor on a patient-education team at a large hospital system. We put out maybe forty one-page explainers a year — chronic kidney disease, afib, immunotherapy, sepsis, dementia, vaccines — at about an eighth-grade reading level, and every one has to be signed off by a clinical lead before it goes into the patient portal. Our readers are mostly over sixty, a lot of them with limited English, and house style is that every hard concept arrives by analogy, because with this audience it is the only thing that works. The problem is that the writers pick analogies by feel, I have no way to argue with them, and the arguments we do have dead-end at "but patients like it."

  What I want from you is a procedure, not an essay. Something a junior editor with zero cognitive-science background can run in about ten minutes on a single analogy and come out with a verdict — cut it / keep it with a guard sentence / keep it — plus a short note for the clinical lead justifying the verdict.

  The theory I want it grounded in is the surfaces-and-essences view from Hofstadter and Sander's Surfaces and Essences: Analogy as the Fuel and Fire of Thinking. The bits I care about: analogy isn't the garnish on thinking, it is the thinking; categorization and analogy are the same mechanism on a continuum rather than one being a special case of the other; a reader hits the surface of your sentence and retrieves an essence from a completely different domain; and that essence keeps doing work after the leaflet is in the recycling bin, because the same surface cues a somewhat different essence in a different reader and the mapping quietly slips as they learn more. So an analogy in our leaflets isn't illustrating the concept the patient walks away with — it is, in large part, the concept they walk away with.

  Here is what I think the procedure has to make us do, though tell me if I've got the order wrong or if I'm asking for a step that can't be done:

  - Write the mapping out explicitly — which slot of the source domain maps onto which thing in the target, and which slots are left open. I'm fairly convinced the open slots are the real danger, because the patient will fill them at 2am without telling us, and they will not fill them the way the writer would.
  - An extrapolation test: what does the analogy predict that is false? Not only on first read, but at three horizons — right now, at the next appointment when the doctor uses vocabulary that touches the same domain, and a year into the disease.
  - Ask what work the analogy is actually doing: is it carrying the causal structure, or only carrying a feeling? Sometimes the feeling is the point, but then someone should have to say so out loud, and I think that's a values call for the clinical lead rather than something my procedure should settle.
  - Ask who does not have the source domain. We translate everything into English, Spanish, and Hmong, and an analogy that depends on a specific object, sport, or idiom can evaporate on contact with that.
  - Check whether the emotional tone of the analogy contradicts the clinical content, e.g. a fight metaphor in a leaflet that also has to prepare someone for a palliative decision.

  Hard cases I need it to handle: the analogy that's true at the first appointment and false by the third; the analogy that quietly implies a treatment works by a mechanism we don't actually claim; the one that rests on an idiom or object that doesn't survive translation; and the case where the writer can't articulate the mapping at all, which happens more often than I'd like.

  And be honest about what the procedure can't do. I'm pretty sure it can't tell me whether our readers actually have the source domain — that seems to need real reader testing — and I suspect it can't choose between two analogies that both pass. Say so.

  Then run it on three:

  1. Our single most-used analogy, which the clinical lead loves and will fight to keep: cancer as a war, the body as a battlefield, chemo as an attack, the patient as someone fighting. I think this one fails and I want to know exactly where it fails and whether any guard sentence could rescue part of it.
  2. The immune system as an army that defends you, with immunotherapy as either calling in reinforcements or taking the brakes off.
  3. A writer just handed me this one for the new CKD leaflet: the kidneys are a coffee filter, and when the filter clogs, waste backs up in your blood.

  At least one of the three has to come out with a verdict I won't like, and I want that note written for real and addressed to the clinical lead, not hedged into mush. Finally: if a step in your procedure is really a judgment call dressed up as procedure, mark which step and don't pretend otherwise.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Editor on a patient-education team at a large hospital system.
      *   **Task:** Create a 10-minute procedure for junior editors to evaluate analogies in patient explainers (1-page, 8th-grade level, signed off by clinical leads).
      *   **Audience:** Patients >60, limited English proficiency (LEP), diverse linguistic backgrounds (English, Spanish, Hmong).
      *   **Theoretical Grounding:** *Surfaces and Essences* (Hofstadter & Sander). Key concepts: Analogy *is* thinking/categorization; surface cues retrieve essences; mappings slip over time; analogy becomes the concept.
      *   **Required Steps in Procedure:** Explicit mapping (slots/open slots), Extrapolation test (3 horizons), Function check (causal vs. feeling), Source domain accessibility (culture/language), Emotional tone check.
      *   **Constraints:** Must be actionable (not an essay), admit limitations (can't replace reader testing, can't always choose between two good options), mark judgment calls.
      *   **Deliverables:** The Procedure + Analysis of 3 specific analogies (Cancer/War, Immune/Army, Kidneys/Coffee Filter).
      *   **Tone:** Professional, direct, honest, actionable. One verdict must be unpopular and the note to the clinical lead must be direct.

  2.  **Develop the Procedure (The "Analogy Autopsy"):**
      *   *Goal:* 10 minutes, zero cognitive science background needed.
      *   *Structure:* Needs to follow the user's proposed steps but refined for speed and clarity based on *Surfaces and Essences*.
      *   *Step 1: The Mapping Grid (Surface to Essence).* Force the writer/editor to write down $A \rightarrow B$. Identify "Open Slots" (unmapped areas). This addresses the "filling in at 2am" risk.
      *   *Step 2: The Horizon Test (Extrapolation).* Check validity at Time 0, Time 1 (next appt), Time 2 (long term). Does the analogy break and cause harm?
      *   *Step 3: The Access Check (Culture/Language).* Can a 65-year-old Hmong speaker or a Spanish speaker with limited formal schooling access the source domain?
      *   *Step 4: The Tone/Values Check.* Does the emotion match the clinical reality (e.g., palliative care)?
      *   *Step 5: The Verdict.* Cut / Keep with Guard / Keep.
      *   *Limitations:* Must explicitly state what this *can't* do (verify actual reader knowledge, rank two passing analogies).
      *   *Judgment Call Marker:* Identify which step relies on human intuition.

  3.  **Refine the Procedure based on *Surfaces and Essences*:**
      *   Hofstadter/Sander emphasize that the *essence* retrieved is what matters. The procedure needs to focus on *what concept the patient takes away*, not just if the analogy is "cute."
      *   The "Open Slots" are critical. If the analogy implies agency where there is none, that's a dangerous open slot.
      *   The "Slippage" concept is key for the Horizon Test.

  4.  **Drafting the Procedure (Iterative refinement):**
      *   *Name:* The 10-Minute Analogy Autopsy.
      *   *Format:* Checklist/Worksheet style.
      *   *Step 1 (Mapping):* "Fill the Slots." Source vs. Target. Mark "Danger Zones" (unmapped parts).
      *   *Step 2 (Horizons):* "Break the Analogy." Now, Next Visit, One Year.
      *   *Step 3 (Access):* "The Border Check." Translation/Culture.
      *   *Step 4 (Tone):* "The Mood Match."
      *   *Step 5 (Verdict):* Binary + Note.
      *   *Disclaimer:* Add the "What this can't do" section.
      *   *Judgment Call:* Step 4 is inherently subjective.

  5.  **Analyzing the Three Analogies:**

      *   **Analogy 1: Cancer as War (Body = Battlefield, Chemo = Attack, Patient = Fighter).**
          *   *Theory Check:* High risk of "essence slippage." If the patient loses the "war" (dies), did they fail to "fight" hard enough?
          *   *Mapping:* Patient $\rightarrow$ Soldier/General? (Open slot: Agency). Cancer $\rightarrow$ Enemy.
          *   *Horizons:* Now (Motivating), Next Visit (Toxicity side effects don't feel like "battle"), One Year (Palliative/End of life = "Losing the war").
          *   *Access:* "War" is universal but culturally variable (honor vs. tragedy).
          *   *Tone:* Contradicts palliative care.
          *   *Verdict:* **CUT.** (This is the unpopular one).
          *   *Note:* Needs to be blunt about the harm to end-of-life patients.

      *   **Analogy 2: Immune System as Army (Immunotherapy = Reinforcements/Brakes).**
          *   *Theory Check:* "Brakes" is a mixed metaphor with "Army." Army implies aggression; Brakes imply mechanical control.
          *   *Mapping:* Immune cells $\rightarrow$ Soldiers. Checkpoint inhibitors $\rightarrow$ Brakes? (Wait, brakes stop movement. Immunotherapy *releases* inhibition. So "taking the brakes off" is the phrase).
          *   *Horizons:* Generally stable, but "Army" implies collateral damage (autoimmune issues).
          *   *Access:* "Brakes" is good. "Army" is okay.
          *   *Tone:* Aggressive, but accurate for immunotherapy.
          *   *Verdict:* **KEEP WITH GUARD.** The "Brakes" vs. "Army" mix needs clarification.
          *   *Note:* Focus on the mixed metaphor risk.

      *   **Analogy 3: Kidneys as Coffee Filter (Clog = Waste backup).**
          *   *Theory Check:* Mechanical vs. Biological. Filters get clogged by dirt; Kidneys fail due to pressure/sugar damage usually, not "clogging" in the literal sense.
          *   *Mapping:* Blood $\rightarrow$ Coffee? Waste $\rightarrow$ Grounds? (No, Waste is in the liquid). Filter $\rightarrow$ Nephrons.
          *   *Horizons:* Now (Okay). Next Visit (Dialysis = artificial filter). One Year (Transplant = new filter?).
          *   *Access:* Coffee is universal? Maybe not for tea drinkers, but "strainer" is better.
          *   *Tone:* Neutral.
          *   *Verdict:* **KEEP.** It's functional and low stakes.
          *   *Note:* Suggest "strainer" for translation safety.

  6.  **Writing the Note to the Clinical Lead (for the War Analogy):**
      *   Must be direct. No hedging.
      *   Cite the specific failure mode (palliative care guilt).
      *   Reference the procedure's findings.

  7.  **Review against Constraints:**
      *   10-minute procedure? Yes, checklist format.
      *   Grounded in Hofstadter/Sander? Yes, focused on mapping and essence retrieval.
      *   Three analogies analyzed? Yes.
      *   One unpopular verdict? Yes (War analogy).
      *   Limitations admitted? Yes.
      *   Judgment calls marked? Yes.

  8.  **Final Polish:**
      *   Ensure the tone matches the user's (professional, slightly weary of bureaucracy but committed to rigor).
      *   Make sure the *Surfaces and Essences* theory is integrated, not just name-dropped. (Focus on how the *essence* retrieved by the patient becomes their *reality*).
      *   Check the "Open Slots" logic. In the War analogy, the open slot is "What happens if the war is lost?" The patient fills it with "I didn't fight hard enough." That's the killer.

  9.  **Self-Correction during drafting:**
      *   *Correction:* Initially, I thought about keeping the War analogy with a guard. But the prompt asks for *one* verdict I won't like. Cutting the "most-used analogy" the clinical lead loves is the right move for impact.
      *   *Correction:* Make sure the procedure explicitly mentions "Open Slots" as a danger zone, as per the user's specific theory interest.
      *   *Correction:* Ensure the "Judgment Call" is clearly flagged in the procedure section.

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  ## The 10-Minute Analogy Autopsy

  **Purpose:** To prevent analogies from becoming incorrect mental models that persist after reading.
  **Theory:** Based on *Surfaces and Essences* (Hofstadter & Sander). The analogy is not decoration; it is the cognitive structure the patient uses to categorize their disease. If the mapping slips, the concept breaks.
  **Time:** 10 minutes per analogy.

  ### Step 1: The Mapping Grid (3 Minutes)
  Draw two columns: **Source** (The Analogy) and **Target** (The Medical Reality). List the key components.
  *   **Action:** Draw lines connecting the matching parts.
  *   **The Danger Zone:** Circle any part of the Source that *does not* have a line connecting it to the Target. These are **Open Slots**.
  *   **Rule:** If an Open Slot allows the patient to infer agency, blame, or causality that doesn't exist medically, flag it immediately.
      *   *Example:* In "War," the "Enemy" maps to "Cancer." But "Winning/Losing" maps to...? If there is no medical equivalent for "Losing" other than death, the patient fills that slot with "Personal Failure."

  ### Step 2: The Horizon Test (3 Minutes)
  Ask what the analogy predicts at three points in time. If the prediction is false, the analogy is actively misleading.
  1.  **Right Now:** Does it explain the immediate treatment correctly?
  2.  **Next Appointment:** When the doctor uses precise terminology (e.g., "progression," "side effects"), does the analogy clash with the new vocabulary?
  3.  **One Year Later:** If the disease worsens or becomes chronic/palliative, does the analogy imply the patient did something wrong?

  ### Step 3: The Border Check (2 Minutes)
  *   **Object/Idiom:** Does the source object exist in rural Hmong culture or urban Spanish-speaking households? (e.g., "Check engine light" fails; "Horse cart" fails).
  *   **Translation:** Will the metaphor survive machine translation + human review? If the word for the object is borrowed from English in the target language, it reduces comprehension.
  *   **Rule:** If the source domain requires specific cultural capital (e.g., American Football, Stock Market), **Cut**.

  ### Step 4: The Tone Match [JUDGMENT CALL] (2 Minutes)
  *   **Action:** Compare the emotional weight of the Source to the Clinical Reality.
  *   **Question:** Does the analogy demand an emotional response that contradicts the care plan?
  *   **Note:** This step cannot be fully automated. It requires an editor to sense the "vibe." If the analogy feels heroic but the prognosis is terminal, it fails.

  ### Step 5: Verdict & Note
  Select one:
  *   **CUT:** The mapping is dangerous or inaccessible.
  *   **KEEP WITH GUARD:** The analogy works but requires a sentence explicitly limiting the comparison (e.g., "Unlike a car engine, your heart can heal.").
  *   **KEEP:** Mapping is tight, horizons are clear, access is universal.

  **Write the Note:** If cutting or guarding, write 3 sentences for the Clinical Lead. Cite the specific Open Slot or Horizon failure.

  ***

  ### Limitations of This Procedure
  1.  **It cannot verify reader knowledge.** It assumes your demographic data (age, language) is accurate. It cannot tell you if 65-year-olds actually know how a coffee filter works.
  2.  **It cannot rank two passing analogies.** If "Garden" and "Engine" both pass, this tool cannot tell you which is better. That requires A/B testing.
  3.  **Step 4 is subjective.** It relies on the editor's emotional intelligence, not a checklist.

  ***

  ## Analysis of Current Analogies

  ### 1. Cancer as War (Body = Battlefield, Chemo = Attack, Patient = Fighter)
  **Verdict:** **CUT**

  **Mapping Grid:**
  *   Cancer $\rightarrow$ Enemy (Match)
  *   Chemo $\rightarrow$ Weapon (Match)
  *   Patient $\rightarrow$ Soldier/General (Match)
  *   **Open Slot:** "Losing the War." There is no medical equivalent for "losing" other than disease progression or death.
  *   **Open Slot:** "Strategy." Implies the patient can choose tactics.

  **Horizon Test:**
  *   *Now:* Motivating.
  *   *Next Appointment:* Clashes with "palliative care" or "hospice." You do not "fight" hospice; you enter it.
  *   *One Year:* If the patient dies, the analogy dictates they "lost the fight." This retrieves the essence of *failure*, not *biology*.

  **Border Check:** "War" translates, but the cultural value of "fighting" vs. "accepting" varies wildly across Hmong and Hispanic communities.

  **Tone Match:** Fails. Heroic tone contradicts end-of-life planning.

  **Note to Clinical Lead:**
  > "We need to retire the 'War on Cancer' analogy. Under the *Surfaces and Essences* framework, this analogy forces patients to categorize disease progression as a personal failure to 'fight' hard enough. This creates a dangerous Open Slot at the palliative stage: if the treatment stops, the analogy implies the patient surrendered. We cannot include a guard sentence that fixes this without neutering the metaphor entirely. I recommend shifting to a 'Management' or 'Gardening' model that allows for seasons of growth and dormancy without implying moral defeat."

  ### 2. Immune System as Army (Immunotherapy = Reinforcements/Brakes)
  **Verdict:** **KEEP WITH GUARD**

  **Mapping Grid:**
  *   Immune Cells $\rightarrow$ Soldiers (Match)
  *   Cancer Cells $\rightarrow$ Invaders (Match)
  *   Checkpoint Inhibitors $\rightarrow$ "Taking brakes off" (Partial Match)
  *   **Open Slot:** "Collateral Damage." Armies kill civilians. Immune systems attack healthy tissue (autoimmune side effects). This is actually accurate, but needs to be explicit.
  *   **Conflict:** "Army" implies external force; "Brakes" implies mechanical internal control. Mixed metaphor.

  **Horizon Test:**
  *   *Now:* Accurate for mechanism of action.
  *   *Next Appointment:* Doctors will discuss "autoimmune reactions." The Army analogy supports this (friendly fire).
  *   *One Year:* Stable.

  **Border Check:** "Brakes" are universal in modern contexts (cars, bikes). "Army" is universal.

  **Tone Match:** Aggressive, but appropriate for oncology.

  **Guard Sentence Required:**
  > "Think of your immune system as an army. Immunotherapy doesn't add more soldiers; it takes the brakes off the ones you have so they can attack. But like any army, they sometimes mistake healthy cells for enemies, which causes side effects."

  **Note to Clinical Lead:**
  > "The 'Army' analogy works for mechanism, but the 'Brakes' addition creates a mixed metaphor (mechanical vs. human). I am adding a guard sentence to clarify that the 'brakes' are internal controls, not external tools. This prevents patients from thinking they can control the release manually."

  ### 3. Kidneys as Coffee Filter (Clog = Waste Backup)
  **Verdict:** **KEEP**

  **Mapping Grid:**
  *   Kidneys $\rightarrow$ Filter (Match)
  *   Blood $\rightarrow$ Liquid (Match)
  *   Waste/Creatinine $\rightarrow$ Grounds/Sediment (Match)
  *   **Open Slot:** "Clogging." Kidneys usually fail due to pressure/diabetes damage, not physical clogging like a coffee filter.
  *   **Risk:** Low. Patients don't need to know *why* it clogged to understand *that* it isn't draining.

  **Horizon Test:**
  *   *Now:* Explains dialysis (cleaning the liquid).
  *   *Next Appointment:* Explains transplant (swapping the filter).
  *   *One Year:* Stable.

  **Border Check:** Coffee is common, but "Strainer" or "Sieve" may translate better into Hmong/Spanish than specific coffee apparatus.

  **Tone Match:** Neutral, mechanical, non-judgmental.

  **Note to Clinical Lead:**
  > "The 'Coffee Filter' analogy is functionally sound for explaining filtration and waste buildup. The only risk is the word 'clog,' which implies a physical blockage rather than tissue damage. I recommend we swap 'coffee filter' for 'strainer' in translation to ensure the concept of 'filtering small particles' remains clear across all three languages."
