  In bargaining theory, it is proven impossible to satisfy **Individual Monotonicity** (your Case 3: "more options shouldn't hurt anyone") and **Independence of Irrelevant Alternatives** (your Case 4: "useless options shouldn't change the result") simultaneously, assuming you also want Scale Invariance (Case 1) and Pareto Efficiency (no value left on the table).

  You have to choose which intuition to sacrifice. Here is the breakdown, the recommendation, and the code.

  ### The Choice: Which Intuition to Sacrifice?

  You have two main contenders:
  1.  **Nash Bargaining Solution (NBS):** Satisfies Case 4 (IIA). Fails Case 3 (Monotonicity).
  2.  **Kalai-Smorodinsky Solution (KS):** Satisfies Case 3 (Monotonicity). Fails Case 4 (IIA).

  **Your proposed rule ("same fraction of the most they could possibly get") is exactly the Kalai-Smorodinsky (KS) solution.**

  **My Recommendation:** Stick with **Kalai-Smorodinsky**. Sacrifice Case 4.

  **Why?**
  *   **Failing Case 3 (NBS) is politically fatal.** Under Nash, if you discover a new deal that makes everyone richer, the arbitrator might say, "Great, now I'm giving B less money." In Case 2 vs 3, NBS moves from $(6,6)$ to $(10,5)$. B loses 1 unit of payoff *because the situation improved*. Explaining that to a stakeholder is impossible.
  *   **Failing Case 4 (KS) is defensible.** Under KS, adding the $(100,0)$ option changes the result from $(40, 6.67)$ to $(54.5, 5.45)$. A gets more because their *leverage* increased (their theoretical max went from 60 to 100), even if they don't take the 100 option. You can argue: "A's bargaining position strengthened because they have a better fallback potential." That is an economic argument people understand.

  ### The Algorithm (Kalai-Smorodinsky)

  This rule matches your gut on Cases 1, 2, 3, and 5. It only diverges on Case 4 (and similar IIA cases).

  **Logic:**
  1.  **Shift:** Translate coordinates so $d = (0,0)$.
  2.  **Utopia:** Find $M = (\max x, \max y)$ over the feasible set.
  3.  **Ray:** Draw a line from $(0,0)$ to $M$.
  4.  **Intersect:** Find where that ray hits the Pareto frontier (the upper-right boundary of the polygon).
  5.  **Un-shift:** Add $d$ back to the result.

