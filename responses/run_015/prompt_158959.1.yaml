      vertices: list of (x, y) tuples defining the feasible set.
      d: (dx, dy) disagreement point.
      Returns: (x, y) agreement point.
      """
      vertices = np.array(vertices)
      d = np.array(d)
      
      # 1. Shift so d is origin
      feasible = vertices - d
      
      # Filter out points that are dominated (negative gains)
      # Assuming d is feasible or dominated by the set. 
      # We only care about the quadrant where x>=0, y>=0
      feasible = feasible[np.all(feasible >= -1e-9, axis=1)] 
      
      if len(feasible) == 0:
          return d # No deal better than walk-away
          
      # 2. Find Utopia Point (Max possible gain for each side)
      # Note: This is NOT necessarily a feasible point itself.
      max_x = np.max(feasible[:, 0])
      max_y = np.max(feasible[:, 1])
      utopia = np.array([max_x, max_y])
      
      # 3. Define the Ray from origin to utopia
      # Parametric form: P(t) = t * utopia, where t is a scalar
      
      # 4. Find intersection with Pareto Frontier
      # We need the upper-right boundary of the convex hull of 'feasible'
      hull = ConvexHull(feasible)
      hull_points = feasible[hull.vertices]
      
      # Sort hull points by x to trace the frontier
      # We only want the segment where slope is negative (Pareto efficient)
      # Simple approach: Check intersection with every segment of the hull
      
      best_t = 0
      
      # Get unique edges from hull
      edges = set()
      for simplex in hull.simplices: # In 2D, simplices are edges
          i, j = simplex
          p1, p2 = hull_points[i], hull_points[j]
          # Order points by x for consistency
          if p1[0] > p2[0]: p1, p2 = p2, p1
          edges.add((tuple(p1), tuple(p2)))
          
      for p1, p2 in edges:
          p1, p2 = np.array(p1), np.array(p2)
          
          # Check if this segment is on the "upper right" frontier
          # A segment is efficient if no other point is above/right of it.
          # Heuristic: Midpoint of segment should not be dominated by any feasible point
          mid = (p1 + p2) / 2
          dominated = False
          for p in feasible:
              if p[0] >= mid[0] and p[1] >= mid[1] and not np.allclose(p, mid):
                  # If a point is strictly better or equal in both coords
                  if p[0] > mid[0] or p[1] > mid[1]:
                      dominated = True
                      break
          if dominated:
              continue
              
          # Calculate intersection of Ray (origin -> utopia) and Segment (p1 -> p2)
          # Ray: R(t) = t * U
          # Seg: S(u) = p1 + u * (p2 - p1)
          # t*U = p1 + u*(p2-p1)
          
          U = utopia
          V = p2 - p1
          
          # Solve linear system for t and u
          # t*Ux - u*Vx = p1x
          # t*Uy - u*Vy = p1y
          A_mat = np.array([[U[0], -V[0]], [U[1], -V[1]]])
          b_vec = np.array([p1[0], p1[1]])
          
          try:
              sol = np.linalg.solve(A_mat, b_vec)
              t, u = sol
              # Valid intersection if t is within [0, 1] (actually t can be >1 if utopia unreachable)
              # and u is within [0, 1] (on the segment)
              if 0 <= u <= 1 and t >= 0:
                  # We want the smallest t that hits the frontier? 
                  # No, we want the intersection that is feasible. 
                  # Since frontier is concave to origin, there should be one unique intersection.
                  if t > best_t:
                      best_t = t
          except np.linalg.LinAlgError:
              continue # Parallel lines
              
      result_gain = best_t * utopia
      return tuple(result_gain + d)
  ```

  ### The Divergence Case: "The Phantom Leverage"

  Here is a case where your gut (and KS) might feel uncomfortable compared to Nash, illustrating the cost of your choice.

  **Scenario:**
  *   **Disagreement:** $d = (0,0)$.
  *   **Base Deal:** You and I are splitting a resource. The efficient frontier is a straight line from $(0, 100)$ to $(100, 0)$.
      *   **KS Result:** $(50, 50)$.
      *   **Nash Result:** $(50, 50)$.
  *   **The Twist:** We discover that I *could* have taken a different deal elsewhere worth $(1000, 0)$, but it's not compatible with the current resource. We add $(1000, 0)$ to the feasible set. The efficient frontier between us *doesn't change* (it's still the line from 0,100 to 100,0), because $(1000,0)$ is dominated by the existing frontier in terms of joint value, but it changes my Max X.
      *   **Nash Result:** Stays $(50, 50)$. (Ignores the irrelevant option).
      *   **KS Result:** Utopia is now $(1000, 100)$. Ray is $y = 0.1x$. Intersection with $x+y=100$ is roughly $(91, 9)$.

  **The Embarrassment:**
  Under KS, I get 91 and you get 9, simply because I proved I *could* have gotten 1000 elsewhere, even though we both know we aren't doing that deal.
  *   **Defense:** "My leverage increased. I have less need to agree with you."
  *   **Attack:** "That option is a bluff. It's not real value between us."

  If you can live with that explanation, KS is the robust choice. It handles your Cases 1, 2, 3, and 5 perfectly. Case 4 is the price of admission for ensuring that discovering new value (Case 3) never punishes a party.
