answer: |-
  **Title:** The Separateness of Persons in Democratic Design: An Anti-Aggregationist Approach to Climate Adaptation

  **Introduction**

  In contemporary moral philosophy, the "ethics of aggregation" asks whether the number of individuals affected by a decision should determine the moral weight of that decision. In classic rescue cases, anti-aggregationists argue that we are not morally obligated to save the greater number; rather, each individual possesses a claim to assistance that is not diluted by the presence of others with parallel claims. While this debate is typically confined to interpersonal morality, this paper argues that the moral logic underlying the rejection of counting numbers must extend into the design of democratic institutions. Specifically, in the context of climate-adaptation funding, democratic deliberation should not function merely as a mechanism for maximizing aggregate welfare. When a democratic body chooses between a single large infrastructure project that saves a large number of lives and a distributed set of smaller projects that save fewer lives in total but protect distinct communities, the legitimate decision procedure must treat every affected community as bearing an equal, non-aggregable claim. Consequently, selecting the smaller-project option is morally required, even if it results in fewer total lives saved. This position does not undermine democratic legitimacy but rather secures it by grounding institutional procedure in the equal standing of persons rather than the arithmetic of preferences.

  **The Moral Logic of Non-Aggregation**

  To extend anti-aggregationism to institutions, we must first clarify its moral foundation. The view is most famously associated with John Taurek's argument that "the numbers do not count." Taurek posits that if an agent can save one person from death or five others from death, but not both, there is no moral obligation to save the five. The reasoning rests on the "separateness of persons." From the perspective of the single individual, the loss of their life is a total catastrophe that is not mitigated by the fact that others are being saved elsewhere. To aggregate the claims of the five against the one is to treat the group as a super-entity that can suffer a "greater loss," a metaphor that dissolves upon inspection. Only individuals suffer losses.

  T.M. Scanlon refines this through contractualism, suggesting that a principle is justified only if it cannot be reasonably rejected by anyone affected. A principle that allows an individual to be sacrificed solely because others would benefit aggregates their claims in a way the individual can reasonably reject. In rescue cases, this suggests that each person's claim to life is absolute relative to their own situation and cannot be traded off against the sum of others' claims. The moral force lies in the *strength* of the individual claim, not the *sum* of claims.

  **From Rescue to Infrastructure: The Climate Adaptation Dilemma**

  This moral logic is often dismissed as impractical for public policy, where governments are expected to maximize utility for the greatest number. However, consider a democratic body allocating climate-adaptation funding. The body faces a choice: Option A is a massive sea wall protecting a dense metropolitan area, saving a predictable 10,000 lives from future flooding. Option B involves funding localized drainage and levee systems for five distinct, smaller coastal communities, collectively saving 8,000 lives.

  Standard cost-benefit analysis and aggregative democracy would mandate Option A. The logic is that 10,000 lives outweigh 8,000. However, applying the anti-aggregationist insight reveals a moral defect in this reasoning. The 8,000 individuals in the smaller communities are not a monolithic block of "less value" compared to the metropolis. They are distributed across five distinct political and social communities, each facing existential risk.

  If we treat the democratic state as a moral agent bound by the same constraints as an individual rescuer, the claim of a citizen in a small community to state protection is not diluted by the fact that more citizens are at risk in the metropolis. To deny the smaller communities funding solely because their numbers are lower is to treat their claims as fungible commodities that can be outweighed by volume. By choosing Option B, the institution acknowledges that the state's obligation is to honor the distinct survival claims of each community, not to maximize the statistical output of survival. Even though fewer total lives are saved, the decision respects the moral standing of the minority communities that aggregation would otherwise render invisible.

  **Democratic Legitimacy and the Aggregation Objection**

  A primary objection to this view is that it misunderstands the nature of democratic legitimacy. In political science and liberal theory, democracy is often defined procedurally as the aggregation of individual preferences into collective choices (e.g., via voting). If citizens prefer the project that saves more lives, or if their representatives vote based on aggregate welfare, is it not undemocratic to override this with a philosophical constraint against aggregation?

  This objection conflates *preferences* with *claims*. Democratic aggregation is legitimate for resolving conflicts of interest or preference (e.g., where to build a park). However, it loses legitimacy when it violates fundamental moral constraints regarding individual standing. A democratic vote cannot legitimately authorize the enslavement of a minority, even if the aggregate utility gain for the majority is immense. Similarly, in life-and-death decisions regarding state protection, the issue is not preference satisfaction but the recognition of rights-claims.

  If democratic legitimacy depends on the equal respect of all citizens, a procedure that systematically sacrifices the claims of smaller groups whenever they conflict with larger groups fails to treat those citizens as equals. It treats them as vessels of utility rather than authors of the law. Extending the anti-aggregationist insight to institutional procedure does not subvert democracy; it protects the pre-conditions of democratic equality. It ensures that the "will of the majority" does not become a moral tyranny that negates the standing of the minority. Legitimacy, therefore, derives not from the arithmetic of the vote, but from the justification of the decision to those who bear the burden. A decision to fund the smaller projects can be justified to the metropolis ("we respect the equal claim of all communities"), whereas a decision to abandon the smaller communities cannot be justified to them ("you counted for less").

  **Avoiding Arbitrariness and Ensuring Accountability**

  A second, pragmatic objection is that rejecting aggregation collapses into arbitrary or unaccountable decision-making. If officials do not count lives saved, how do they decide? Does this invite caprice? Furthermore, how can officials be held accountable if they are not judged by outcomes (i.e., total lives saved)?

  This objection assumes that without aggregation, there is no principle to guide decision-making. This is false. Anti-aggregationism is not randomness; it is a principled constraint. In the climate adaptation scenario, the principle is "equal protection of distinct communities." This provides a clear heuristic: funding should be distributed to ensure no community is left below a threshold of security simply because securing them is less "efficient" than securing a larger population.

  Regarding accountability, shifting away from aggregate outcomes does not eliminate accountability; it shifts the metric from *consequentialist efficiency* to *procedural fidelity*. Officials are accountable for whether they honored the equal claims of constituents, not merely for maximizing statistics. This actually enhances accountability in climate justice, where aggregate metrics often hide the disproportionate suffering of marginalized groups. If a government abandons a small island community to save a larger city, an aggregative framework views this as a success. An anti-aggregationist framework views this as a failure of duty, making the government accountable for that abandonment. Thus, the decision procedure remains rigorous and justifiable, grounded in the inviolability of individual claims rather than the volatility of utility calculations.

  **Conclusion**

  The transition from interpersonal rescue cases to institutional design is fraught, but the moral core remains intact. The claim of a person to be saved from catastrophe does not diminish because others are also in danger. By extension, the claim of a community to climate adaptation resources should not diminish because other communities are larger. While the aggregative approach promises a higher total of lives saved, it purchases this gain at the cost of moral equality, treating citizens as units of value rather than bearers of rights. A democratic institution that adopts an anti-aggregationist procedure for life-and-death funding choices affirms that legitimacy rests on the equal standing of all affected parties. Therefore, even if it results in fewer total lives saved, the selection of distributed, smaller projects is morally required. It is the only choice that respects the separateness of persons within the collective machinery of the state.
