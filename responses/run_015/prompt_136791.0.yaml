      *   Make the symbol `⟁` (U+27C1, Perpendicular To) or similar. Let's use `⋔` (U+22D4, Bowtie) or just a custom hex code. Let's go with a glyph: `⟁` (White Up-Pointing Triangle with Dot). Actually, let's keep it simple text-based for readability: `[Δ]`. No, let's use `⟁`.

