  To confirm this, ask her about **Plutonium** (or any synthetic element/material that does not occur naturally).

  *   **The Case:** Plutonium does not exist in nature; it is created by humans in reactors. However, once created, it has real, mind-independent causal powers (it radiates, it burns, it decays) regardless of what we call it.
  *   **Why it splits the rules:**
      *   **Rule A (Mind-Independence)** suggests it **IS Constructed** (or at least "artifact-dependent"). Without humans, there is no Plutonium.
      *   **Rule B (Tracking Principle)** suggests it **IS NOT Constructed**. It tracks real chemical properties. It behaves like a natural kind despite its artificial origin.
  *   **The Test:** If she says Plutonium is a "real chemical kind" (matching her Planet view), she will definitely say the Anthropocene is a real geological kind. If she says Plutonium is "artificial/constructed" because we made it, she might waffle on the Anthropocene being a "real" epoch vs. a "human story."

