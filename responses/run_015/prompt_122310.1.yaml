  Based on the track record you provided, your friend is operating with a sophisticated, realist-leaning philosophy of science. She isn't a "everything is constructed" relativist, nor is she a rigid essentialist. She distinguishes sharply between *social statuses* and *natural kinds*, even when human activity is involved.

  Here are the 2-3 rules that best fit her history, how they apply to the Anthropocene, and how to test her further.

  ### 1. The Three Rules

  **Rule A: The Mind-Independence Test (Brute vs. Institutional)**
  *   **The Principle:** If the thing would continue to exist and function exactly the same way if humans vanished or stopped believing in it, it is **not constructed**. If it requires human agreement to exist (like value or status), it **is constructed**.
  *   **Her Track Record:** Explains why *Money* and *Marriage* are constructed (need agreement), but *Wolves* and *Biological Sex* are not (exist without us).

  **Rule B: The Tracking Principle (Properties over Boundaries)**
  *   **The Principle:** A category is **not constructed** if it "tracks" a real, mind-independent causal property or physical structure, even if the *boundary line* we draw to define it is conventional or arbitrary.
  *   **Her Track Record:** This is her "Planet" view. The IAU vote was a human convention (boundary), but "orbital clearing" is a physical reality (property). Therefore, the *kind* "Planet" is real.

  **Rule C: The Social Function Test**
  *   **The Principle:** If the primary purpose of the category is to regulate human behavior, assign legal status, or organize society, it is **constructed**. If the purpose is to describe physical causality, it is **not**.
  *   **Her Track Record:** Explains why *Childhood* (legal/social status) is constructed, while *Maturation* (biological process) is not.

  ---

  ### 2. Application to the Anthropocene

  Here is how each rule predicts her answer on whether the Anthropocene is socially constructed:

  *   **Rule A says: NOT Constructed.**
      Once plastic sediments and plutonium isotopes are in the ground, they are "brute facts." If humans went extinct tomorrow, that stratigraphic layer would remain. It does not require our continued belief to exist.
  *   **Rule B says: NOT Constructed.**
      Just like the "Planet" definition tracks orbital clearing, the "Anthropocene" definition tracks specific chemical signatures (carbon isotopes, radionuclides). The *start date* (1945? 1950?) might be a conventional boundary debate, but the *signal* being tracked is physically real.
  *   **Rule C says: NOT Constructed.**
      While the *cause* is human society, the *category* is geological. It is used to describe earth history, not to assign legal rights or social status to people (unlike Race or Childhood).

  **Prediction:** She will say the Anthropocene is **NOT socially constructed**. She will likely argue it is a real geological epoch defined by human *impact*, but the impact itself is a physical fact, not a social agreement.

  ---

  ### 3. Which Rule Is She Actually Using?

  **She is using Rule B: The Tracking Principle.**

  **Why?**
  Rule A (Mind-Independence) is the only one that gets slightly muddy here. The Anthropocene is defined *by* human activity. A strict Mind-Independence test might argue, "No humans = no Anthropocene," implying it's dependent on us.

  However, her view on **Planets** is the smoking gun. She explicitly admitted the *definition* is conventional but insisted the *kind* is real because it tracks a physical property. This proves she prioritizes **causal properties over origin stories**. She believes that as long as a category latches onto a mind-independent physical reality (like orbital dynamics or stratigraphic isotopes), the category itself is real, even if humans are the ones who named it or caused the signal.

  She treats the Anthropocene exactly like she treats Planets: The *naming* is human, but the *stuff* is real.

  ---

