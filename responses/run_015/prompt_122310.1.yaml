  ### 5. Confidence & Uncertainty

  **Confidence Level: 85%**
  I am highly confident she will reject the idea that the Anthropocene is "socially constructed" in the same way Race or Money are. Her distinction between *conventional boundaries* and *real properties* is very consistent across the Planet, Wolf, and Sex examples.

  **Least Certain Part: The "Human Cause" Nuance**
