  Based on your friend's track record, you are observing a clash between two sophisticated decision theories that both outperform standard Causal Decision Theory (CDT) on the classic puzzles. The two rules that fit her history equally well are **Evidential Decision Theory (EDT)** and **Functional Decision Theory (FDT)** (sometimes grouped with Timeless Decision Theory).

  Here is the breakdown of the machinery, the prediction for the blackmail case, and how to settle the bet with your follow-up scenarios.

  ### 1. The Candidate Rules

  **Evidential Decision Theory (EDT)**
  *   **The Machinery:** EDT chooses the act that provides the best *news*. It asks, "If I observe myself doing $X$, what is the expected utility?" It relies on conditional probabilities.
  *   **Fit to Track Record:**
      *   *Newcomb:* One-boxing is evidence the predictor put the money in Box B.
      *   *Twin PD:* Cooperating is evidence the twin (who reasons identically) will also cooperate.
      *   *Voting:* Voting is evidence that other similar people will vote, making the vote pivotal.
  *   **Weakness:** It can be "managing the news" rather than affecting the outcome (e.g., avoiding a doctor to avoid evidence of illness).

  **Functional Decision Theory (FDT)**
  *   **The Machinery:** FDT chooses the output of the decision *algorithm*. It asks, "If my decision function outputs $X$, what is the expected utility?" It treats the agent's decision as logically subjunctively dependent on any other process that simulates or predicts that function (including predictors, twins, and similar voters).
  *   **Fit to Track Record:**
      *   *Newcomb:* The predictor simulates the algorithm; if the algorithm outputs "One-Box," the simulation did too, filling Box B.
      *   *Twin PD:* The twin runs the same source code; if I output "Cooperate," the twin outputs "Cooperate."
      *   *Voting:* Similar voters run similar algorithms; my output is logically linked to theirs.
  *   **Weakness:** It can recommend actions that lose in the specific actual instance to preserve a winning policy ex-ante (counterfactual reasoning).

  ### 2. The Termite Blackmail Case

  This scenario is known in the literature as **XOR Blackmail**. It is specifically designed to drive a wedge between EDT and FDT.

  *   **The Setup:** The letter is sent if (Termites $\oplus$ Predicted Pay).
      *   If she Pays $\rightarrow$ Predicted Pay $\rightarrow$ Letter implies **No Termites**.
      *   If she Refuses $\rightarrow$ Predicted No-Pay $\rightarrow$ Letter implies **Termites**.
  *   **EDT Prediction: She Will Pay.**
      *   *Reasoning:* Conditioning on the act of paying, the probability of termites drops to near zero (because the blackmailer only sends the letter to payers if there are no termites). Paying costs \$100. Refusing costs \$1,000 (since refusing implies termites). EDT takes the deal to avoid the bad news.
  *   **FDT Prediction: She Will Not Pay.**
      *   *Reasoning:* FDT recognizes that the letter has *already been sent*. The termite state is fixed. The prediction is fixed. Paying \$100 now cannot causally change whether there are termites, nor can it change whether the letter was sent. FDT views the correlation between paying and "no termites" as spurious news-management. Paying \$100 saves the \$1,000 treatment cost *only if* there are termites, but if she is the type to pay, there *aren't* termites. She refuses to pay for news. (Note: FDT accepts that this leads to a \$1,000 loss in this specific instance, but argues the "Refuse" policy is superior ex-ante because it discourages the blackmailer from targeting her in the Termite world).

  **My Bet:** I would bet she **will not pay** (FDT).
  **Reason:** Your group consists of mathematicians and programmers. FDT is often described as the "decision theory for agents who view themselves as algorithms." The "Psychological Twin" verdict is a particularly strong signal for FDT over EDT; while EDT cooperates due to statistical correlation, FDT cooperates due to *logical identity* of the code. A programmer is more likely to resonate with the idea that "I and my twin execute the same function" than "My action is statistically correlated with my twin's."

  ### 3. The Follow-Up Cases

  Both follow-up cases distinguish EDT from FDT, but one is cleaner.

  **Case A: The Smoking Lesion**
  *   **Setup:** Smoking doesn't cause cancer; a lesion causes both the desire to smoke and cancer.
  *   **EDT:** **Don't Smoke.** Smoking is strong evidence of the lesion (and thus cancer).
  *   **FDT:** **Smoke.** The decision cannot causally influence the lesion. You enjoy smoking, and you can't change your cancer risk by refusing.
  *   **Discrimination:** High. However, sophisticated EDT proponents sometimes try to "causalize" their theory to handle this, muddying the waters.

  **Case B: The Counterfactual Mugging**
  *   **Setup:** Omega flips a coin. Tails: Omega gives you \$10k. Heads: Omega asks for \$100. The coin *has landed Heads*.
  *   **EDT:** **Don't Pay.** The coin is already Heads. Paying loses \$100 and gains nothing (it cannot change the past flip).
  *   **FDT:** **Pay.** FDT evaluates the *policy*. The policy "Pay if Heads" has a positive expected value ex-ante ($0.5 \times \$10,000 - 0.5 \times \$100$). To be the kind of agent who gets the \$10k in the Tails world, you must pay in the Heads world, even counterfactually.
  *   **Discrimination:** **Cleaner.** This case isolates the core divergence: EDT conditions on the *actual* state (Heads), while FDT conditions on the *algorithm's output* across possible worlds.

  **Recommendation:**
  Use the **Counterfactual Mugging**. It is the "killer app" for Functional Decision Theory. If she pays the \$100 despite knowing the coin is already Heads, she is almost certainly running FDT. If she refuses, she is likely EDT (or CDT).

  **An Even Better Case?**
  If you want to be absolutely certain, present **Parfit's Hitchhiker**.
  *   *Setup:* You are dying in the desert. A driver will save you only if they predict you will pay them \$1,000 once in town. They are a perfect predictor. They predict you *will* pay, save you, and drive you to town. You are now in town. The driver asks for the money.
  *   *EDT/CDT:* **Don't Pay.** You are already safe. Paying loses \$1,000 and changes nothing.
  *   *FDT:* **Pay.** If your algorithm outputs "Don't Pay" in town, the driver would have predicted that and left you in the desert. To be the sort of agent who gets saved, you must pay.
  *   *Why better:* It mirrors the Blackmail structure (past prediction determines current survival/state) but makes the cost of "defecting" intuitively higher (death vs. termites). If she paid in Blackmail (EDT), she won't pay in Hitchhiker. If she refused in Blackmail (FDT), she *will* pay in Hitchhiker. This creates a distinct profile.

  **Summary for your presentation:**
  1.  **Rules:** EDT vs. FDT.
  2.  **Blackmail:** EDT Pays (manages news); FDT Refuses (rejects news management).
  3.  **Bet:** FDT (Refuses), due to the "programmer/twin" mindset.
  4.  **Tie-Breaker:** Counterfactual Mugging (FDT Pays, EDT Refuses).
