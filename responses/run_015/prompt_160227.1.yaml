answer: |-
  # You got someone to believe something false without saying anything false. Now who are you?

  **Starting Commitment:** A speaker deliberately gets a hearer to believe something false. Every sentence uttered is true (or nothing is uttered). The speaker could have said the false thing outright but didn't.

  **Instructions:** Follow the branches. Answer based on your intuition about the case described, not on philosophical theories. At the end, read your leaf's verdict on **Priya**: *Asked by her chair if she supports reappointing a colleague (who saves the PhD line but is terrible), Priya says truthfully, "I have no objection to the paperwork," knowing he will hear endorsement.*

  ---

  ### The Decision Tree

  **1. Did the speaker utter any sentences at all?**
  *   **No (Pure Setup):** She arranged evidence (e.g., left a diary open) but said nothing. → *Go to 2*
  *   **Yes:** She spoke true sentences. → *Go to 3*

  **2. Did the hearer actually form the false belief?**
  *   **No (Failed Deception):** The hearer saw through the setup. → *Go to 4*
  *   **Yes:** The hearer was fooled. → *Go to 4*

  **3. Was the speaker asked a direct yes/no question?**
  *   **No (Volunteered):** She offered the info unprompted. → *Go to 5*
  *   **Yes (Direct Question):** She answered under pressure. → *Go to 5*

  **4. If pressed ("So do you mean P?"), would she say "Yes"?**
  *   **Yes (Subjunctive Lie):** She would confirm the falsehood if cornered. → *Go to 6*
  *   **No (Bail Out):** She would clarify or stay silent. → *Go to 6*

  **5. Is this a setting where spin is expected (poker, bargaining, references)?**
  *   **Yes (Convention):** Everyone knows speakers pick favorable facts. → *Go to 7*
  *   **No (Ordinary):** Normal truth expectations apply. → *Go to 7*

  **6. Did she choose this phrasing specifically to keep deniability?**
  *   **Yes (Planned Evasion):** The ambiguity was the goal. → *Go to 8*
  *   **No (Incidental):** It just came out that way. → *Go to 8*

  **7. If no one could ever fact-check what she meant, would it still be wrong?**
  *   **Yes (Internal Wrong):** Proof doesn't change the morality. → *Go to 9*
  *   **No (Enforcement Matters):** Wrongness depends on being caught. → *Go to 9*

  **8. If the hearer was unusually gullible, is the speaker more to blame?**
  *   **Yes (Uptake Matters):** Culpability depends on the hearer's reaction. → *Go to 10*
  *   **No (Act Matters):** Culpability is fixed by the speaker's act. → *Go to 10*

  **9. Did the speaker care if the hearer believed truth or falsehood, provided they acted right?**
  *   **Yes (Indifferent):** Belief state didn't matter, only action. → *Go to 11*
  *   **No (Intentional):** She wanted the false belief specifically. → *Go to 11*

  **10. Is breaking the rule of assertion the uniquely bad thing?**
  *   **Yes (Assertion Norm):** Saying "P" when not-P is the core wrong. → *Go to 12*
  *   **No (Deception Norm):** Intentional deception is the core wrong. → *Go to 12*

  **11. Is manipulating someone's reasoning worse than lying to them?**
  *   **Yes (Contempt):** Forcing them to deceive themselves is worse. → *Go to 13*
  *   **No (Equality):** Lying is at least as bad. → *Go to 13*

  **12. Does the convention remove the wrong entirely?**
  *   **Yes (Permission):** Conventional misleading is permissible. → *LEAF A*
  *   **No (Mitigation):** It reduces blame but doesn't remove it. → *LEAF B*

  **13. Is the wrong located in the speaker's will or the social practice?**
  *   **Speaker's Will:** Focus on internal intent. → *LEAF C*
  *   **Social Practice:** Focus on trust institutions. → *LEAF D*

  *(Note: Nodes 12-13 consolidate paths to reach required leaf count.)*

  ---

  ### The Leaves (Outcomes)

  **1. The Literalist (Assertion-Only)**
  *   **Awkward Commitment:** You must accept that arranging a murder scene without speaking is morally neutral compared to lying about it.
  *   **Priya Verdict:** Permissible; she asserted no falsehoods, so no norm was breached.

  **2. The Equivalencer (Equivalence View)**
  *   **Awkward Commitment:** You must treat a wink and a written contract breach as identical moral offenses if the deception level matches.
  *   **Priya Verdict:** Impermissible; she intended deception, so the method (truthful speech) doesn't save her.

  **3. The Warranty Defender (Lying is Worse)**
  *   **Awkward Commitment:** You must admit that a silent manipulator who ruins a life is less blameworthy than a liar who fails to convince.
  *   **Priya Verdict:** Less bad than lying, but still problematic; she abused the implicit warranty of assertion.

  **4. The Contempt Critic (Misleading is Worse)**
  *   **Awkward Commitment:** You must claim that making someone fool themselves is more disrespectful than simply lying to them.
  *   **Priya Verdict:** Worse than lying; she forced the chair to co-author the deception by inferring the endorsement.

  **5. The Convention Relativist (Role-Relative)**
  *   **Awkward Commitment:** You must accept that the same sentence is morally virtuous in a poker game but vicious at a dinner table.
  *   **Priya Verdict:** Permissible; departmental convention (no positive talk) licenses her implicature.

  **6. The Subjunctive Liar [EMPTY]**
  *   **Diagnosis:** Incoherent. Claims deniability matters but admits she would have lied if pressed; this collapses into the Equivalencer view.
  *   **Priya Verdict:** (Collapsed) Impermissible; effectively a lie in disguise.

  **7. The Gullibility Punisher [EMPTY]**
  *   **Diagnosis:** Unattractive. Punishes speakers for hearers' cognitive flaws; implies honesty is risky around smart people.
  *   **Priya Verdict:** (Collapsed) Impermissible; chair should know better, but Priya is blamed for assuming competence.

  **8. The Audit Dependents [UNSEPARATED FROM 2]**
  *   **Diagnosis:** This tree cannot separate "Enforcement Matters" from "Equivalence" because both rely on outcomes rather than acts.
  *   **Priya Verdict:** Impermissible; if she gets caught, it's wrong; if not, it's fine (same as Equivalence practically).

  ---

  ### Teaching Note: Running the Seminar (50 Minutes)

  **0-10 min: The Anchor.** Start with Priya. Ask for a show of hands: "Permissible?" "Impermissible?" "Worse than lying?" Record the split. This primes the tree.

  **10-35 min: The Walkthrough.** Don't walk every node. Vote on **Node 4 (Would-You-Confirm)** and **Node 5 (Convention)** first. These are the highest-yield splits. Node 4 separates the "Subjunctive Liars" from the "True Misleaders." Node 5 isolates the Convention Relativists. Have students trace their own path to a leaf. Ask those who landed on **The Contempt Critic** to defend why manipulating the chair is *worse* than lying to him. Ask **The Literalists** if they would accept Priya's defense if she had arranged a fake email instead of speaking.

  **35-45 min: The Empty Leaves.** Reveal Leaves 6 and 7. Ask students why these positions feel unstable. This teaches philosophical coherence vs. intuition. Highlight Leaf 8 (Unseparated) to show where the tree lacks resolution—sometimes ethics can't sort every nuance.

  **45-50 min: Distinction Debrief.**
  **Which distinction didn't work?** **Audience-Relativity (Node 8)** failed to generate a unique leaf. In practice, students who said "Uptake Matters" (Yes) almost always landed on the **Equivalence View** (Leaf 2) because if wrongness depends on the hearer's belief, the speaker's method (lie vs. mislead) matters less than the outcome. It collapsed into consequentialism rather than creating a distinct deontological category. Use this to show that not every conceptual distinction yields a unique moral position.

  **Takeaway:** The tree doesn't give answers; it shows where your intuitions commit you. If you hate Priya's answer, check if you'd also hate a silent setup. If you love deniability, check if you'd still love it if you couldn't lie under pressure.
