answer: |-
  It is, without reservation, a case of hidden judgment-shift, specifically a failure to activate the universal premise within the particular instance of deliberation. There is no third category that breaches the binary of knowledge and ignorance.

  You posit a state wherein the agent retains propositional belief in the value of health while rendering it "cognitively invisible" to deliberation. I submit that this description conflates *dispositional knowledge* (having the premise) with *exercised knowledge* (using the premise in the practical syllogism). Aristotle distinguishes precisely this in *Nicomachean Ethics* Book VII: the akratic agent possesses knowledge only as a sleeper, a drunkard, or an actor possesses it. They recite the verses, but the knowledge does not govern the soul.

  When you state that on Friday the reason "long-term health" becomes invisible, you describe precisely the suppression of the major premise of the practical syllogism. If the agent acts to consume the cake, she necessarily operates under a different major premise: "Immediate pleasure is to be pursued." If the health premise is invisible, it is not part of the *all-things-considered* judgment *at the moment of action*. To claim she judges eating cake *not* best all-things-considered while simultaneously eating it is to posit a fragmentation of the agent that dissolves the unity of practical rationality. Action follows judgment. If the action is cake-consumption, the operative judgment—however fleeting or clouded by passion—must have sanctioned it as the apparent good *hic et nunc*.

  The "affective salience inversion" you describe is not a normative exception; it is the *explanandum* of passion's capacity to distort particular perception. The agent does not act against her judgment; she acts against her *previous* judgment because her *current* judgment has been altered by the obscuring of the particular premise ("This cake is unhealthy") by the appetite. The Monday resolution establishes a universal norm, but the Friday failure is a failure of subsumption. She fails to see *this* cake as falling under *that* norm.

  Therefore, this is not a cross-temporal rational failure that escapes the binary. It is a local failure of knowledge application. The hyperbolic discounting you cite is merely the descriptive mechanism of this obscuration; it supplies no normative force. The agent is ignorant at the moment of action, however much she remembers the rule upon reflection afterward. Genuine *akrasia*—acting while fully exercising knowledge of the better—remains impossible.

  Does this distinction between possessed and exercised knowledge satisfy your concern regarding the continuity of the agent's rationality, or must we further interrogate the nature of the "invisibility" you propose?
