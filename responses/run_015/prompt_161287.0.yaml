answer: |-
  **MEMORANDUM**

  **TO:** Senior Editorial Team, Evidence Panel
  **FROM:** [Your Name], Evidence Panel
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Federal Safety Rule Story (ID: 4492)

  **RECOMMENDATION**
  **Reframe as Reported Analysis.** Do not run as a straight news claim asserting the agency shelved the rule *because* of the unpublished cost estimate. Instead, publish as an analysis piece detailing the evidence suggesting this outcome, while explicitly acknowledging the evidentiary gaps regarding causality.

  We should allow 48 hours for this rewrite. If the reporter cannot adjust the tone to reflect uncertainty by Thursday at 10:00 AM, we must hold for document authentication.

  **RATIONALE**
  Our current handbook treats sourcing as a numbers game (one source vs. two sources). This story exposes the flaw in that approach: we have multiple sources, but the *type* of knowledge they provide does not support a definitive factual claim. To resolve this, I have evaluated the evidence using a refined framework that distinguishes between direct observation, source testimony, and causal inference.

  Here is the breakdown of why the current draft fails the "News" threshold but passes the "Analysis" threshold.

  **1. Testimony: The Reliability of the Speaker**
  *The Issue:* We have one on-record official who will not repeat their claims on tape, and two anonymous sources (one with financial grievances).
  *The Standard:* In high-stakes reporting, testimony is not just data transfer; it is a warranty of reliability. A reliable testifier must have both **competence** (was in the room) and **neutrality** (no incentive to deceive).
  *The Finding:* Our best source (the official) has competence but withdraws the warranty (won't go on record). The secondary sources have competence but lack neutrality (the contractor lost money).
  *Implication:* We cannot treat their statements as established fact. They are allegations. In a news piece, allegations require corroboration we don't have. In an analysis piece, they function as evidence of a pattern or suspicion, which is accurate to their weight.

  **2. The Slide Deck: Perception vs. Digital Testimony**
  *The Issue:* The news desk treats the slide deck as "hard document" proof (Perception).
  *The Standard:* A physical document observed firsthand is perception. A digital file received via encrypted channel is **Testimony**. It is a claim made by the sender about what the data says.
  *The Finding:* Because we cannot authenticate the deck independently of the sender, it is not "seeing" the truth; it is trusting the sender. Since the sender is anonymous, the deck inherits the reliability issues of the source.
  *Implication:* We cannot cite the deck as proof of the cost estimate's existence. We can only cite it as "documents obtained by this magazine which suggest..." This linguistic shift moves the piece from News to Analysis.

  **3. Causal Inference: The "Because" Claim**
  *The Issue:* The headline claim is that the rule was shelved *mainly because* of the cost estimate.
  *The Standard:* Moving from "Event A happened" (lobbying) and "Event B happened" (rule shelved) to "A caused B" is an inference. This requires a universal link: *Whenever* this specific type of lobbying occurs with a cost estimate, *then* the rule dies.
  *The Finding:* Our evidence for this link is weak. We have one historical parallel (the 2010s case). One parallel does not establish a universal rule; it establishes a possibility. Bureaucracies shelve rules for many reasons (budget, staffing, legal review). To assert "mainly because" is to claim we have ruled out these other causes. We have not.
  *Implication:* A news claim requires the causal link to be observed or proven. An analysis claim allows the link to be argued as the most likely explanation based on available data. The latter is where our evidence currently sits.

  **4. Analogy: The 2010s Case**
  *The Issue:* The reporter uses the 2010s case to bolster the causal claim.
  *The Standard:* Analogy supports an argument; it does not prove a specific instance. It shows capacity, not necessity.
  *The Finding:* The 2010s case shows the agency *can* be influenced by industry. It does not prove they *were* this time.
  *Implication:* This is rhetorical support, not evidentiary proof. It belongs in the "Context" section of an analysis piece, not the "Lede" of a news break.

  **THE COUNTER-ARGUMENT (News Desk Position)**
  I want to address the strongest case for running this as News tomorrow, as the News Desk will rightly raise these points:

  *   **Public Interest:** The safety risk is immediate. Delaying or softening the story protects the agency more than the public.
  *   **Pattern Recognition:** Experienced reporters recognize the smell of a killed rule. Requiring "proof" of internal causality sets a bar that bad actors can easily hide behind (e.g., by never putting the reason in writing).
  *   **Source Protection:** Demanding the official go on record or authenticating the deck might burn a channel that yields bigger stories later.

  *Rebuttal:* These are valid ethical considerations, but they do not solve the epistemic problem. If we run this as News and the agency releases emails showing the rule was shelved due to a unrelated legal technicality, we are not just "aggressive"; we are demonstrably wrong. Reframing as Analysis protects the public interest by airing the suspicion without staking the magazine's credibility on a causal chain we cannot verify. It allows us to say, "The evidence points here," rather than, "This is what happened."

  **HANDBOOK REVISION PROPOSAL**
  This dispute reveals a gap in our Fact-Checking Handbook. We currently check *sources*, but we do not check *reasoning*. I propose we add a **"Causal Confidence"** step to the fact-checking workflow, applicable when a story asserts motivation or causality.

  **Proposed Protocol:**
  1.  **Identify the Inference:** Is the claim describing an event (The rule was shelved) or a cause (The rule was shelved *because*...)?
  2.  **Test the Generalization:** If the claim is causal, what is the rule linking the cause to the effect? (e.g., "Cost estimates always kill rules.")
  3.  **Check for Alternatives:** Has the reporter actively ruled out the top two alternative explanations? (e.g., Legal review, staffing).
  4.  **Label Accordingly:**
      *   If alternatives are ruled out → **News Claim.**
      *   If alternatives are plausible but less likely → **Analysis Claim.**
      *   If alternatives are equally likely → **Hold.**

  **Action Plan for Reporter:**
  *   **By Thursday 10:00 AM:** Rewrite the lede and nut graph to reflect "strong evidence suggests" rather than "internal documents show."
  *   **Explicitly name the uncertainty:** Include a paragraph detailing the agency's likely alternative explanation (e.g., "The agency maintains the delay was procedural...") to demonstrate we have considered the alternative.
  *   **Continue Authentication:** Keep trying to authenticate the slide deck for a future follow-up, but do not hold the current piece on it if the tone is adjusted.

  This approach allows us to publish the story tomorrow without betting the magazine's reputation on a causal link that remains, fundamentally, an educated guess.
