      *   *Check:* Is the recommendation specific? *Yes, Reframe as Analysis.*
      *   *Check:* Is the handbook advice practical? *Yes, focus on "Causal Confidence."*
      *   *Check:* Did I avoid Sanskrit? *Yes.*
      *   *Check:* Is the "strongest version of the rejected option" included? *Yes, the News Desk argument needs to be robust.*

