      *(Self-Correction on the "Hold" vs. "Reframe")*: The prompt asks to choose one. Holding is safe, but Reframing allows publication which the News Desk wants, while mitigating liability. Reframing is the more nuanced "Evidence Panel" solution. I will recommend Reframing with a conditional hold (48 hours to rewrite).

      *Wait, looking closer at the prompt:* "It should land on one recommendation — run as news, hold pending some specific step with a date attached, or reframe as analysis."
      Okay, I need to pick one. Reframing is the most sophisticated answer that uses the epistemic distinctions. If the inference is weak, you can't state it as fact. But you can state it as an argument.

      *Let's finalize the structure:*
      1. Recommendation.
      2. Evidence Audit (using the 4 categories).
