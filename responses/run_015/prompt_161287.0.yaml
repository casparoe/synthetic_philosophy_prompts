  2.  **Determine the Recommendation:**
      *   *Option 1: Run as News.* Risky. The core claim rests on an unpublished document and anonymous sources with potential biases. If the slide deck is fake or the cost estimate didn't drive the decision, the magazine gets sued or loses credibility.
      *   *Option 2: Hold for Authentication.* Safest for liability, but might kill the news value ("tomorrow" deadline).
      *   *Option 3: Reframe as Analysis.* This seems the most viable middle ground. It acknowledges the evidence exists but admits the causal link isn't proven fact. It aligns with the "inference" weakness identified in the prompt.
      *   *Decision:* **Reframe as Analysis.** Why? Because the causal link ("*mainly because of*") is an inference based on a generalization that isn't solid enough for a flat news claim. The evidence supports *suspicion* or *likelihood*, not definitive fact. This satisfies the "second-order check" requirement.

  3.  **Map Nyāya Concepts to Journalism (without Jargon):**
      *   *Testimony (Śabda):* Sourcing. Needs reliability checks (competence + honesty). The anonymous contractor fails the honesty/neutrality check. The reassigned official fails the "on-record" check.
      *   *Perception (Pratyakṣa):* Direct observation. The slide deck is *not* perception; it's digital testimony. It needs authentication like a witness.
      *   *Inference (Anumāna):* Connecting dots. The claim "Agency killed rule *because* of cost estimate" is an inference. It requires a universal connection (*vyāpti*) between "industry lobbying + cost estimate" and "rule shelved." The 2010s case is the test of this connection.
      *   *Comparison (Upamāna):* Analogy. The 2010s case. Is it actually similar enough?
      *   *Second-order Check:* Meta-cognition. Do we know *that* we know? (i.e., Do we have enough confidence to swear this is fact?)

