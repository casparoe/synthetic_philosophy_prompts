      *   *Key Distinction:* Consensus protocols solve the "Agreement" problem (all nodes say X). Smith solves the "Correctness" problem (all nodes say the *Right* X).
      *   *Premise 3 is the culprit.* It claims consensus resolves conflict by order *not content*. In Smith, the "protocol" resolves conflict by *content* (propriety).

