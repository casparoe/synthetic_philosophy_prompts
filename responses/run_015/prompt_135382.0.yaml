      *   **Part 4: Smuggled Features:** What the analogy gets wrong (Exit, Contract, Property).
      *   **Conclusion:** Summary for the reading group.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish Pettit's specific definition of "arbitrary." It's not "random"; it's "without tracking the interests of the affected."
      *   *Correction:* Ensure the "Visibility" point is clear. Republicanism isn't just about seeing the power; it's about the power being *contested*. The rental analogy usually implies hidden power. I need to clarify that.
      *   *Tone:* Academic but accessible (for a reading group). Rigorous but not pedantic.
      *   *Key Insight:* The rental analogy actually *helps* the Republican case if framed correctly (the *status* of being a tenant is the unfreedom), but the reading group is using it to *dismiss* the case. I need to show why their dismissal is based on a misreading of the analogy (focusing on the unlocked door rather than the lease terms).

