  Why does the novel punish this reasonable caution? Because Victor's capacity for judgment is already corrupted by his initial isolation. He is no longer a reliable agent. His unilateralism is toxic regardless of direction. When he created the Creature, he acted alone and caused harm. When he destroys the bride, he acts alone and causes harm. The variable is not the action, but the agent's separation from community. He cannot make good unilateral decisions because he lacks the feedback loops that correct moral reasoning. He assumes he knows the risk of a race of demons, but he fails to calculate the risk of the Creature's rage. The governance lens suggests unilateral action is dangerous because it bypasses wisdom. Shelley suggests it is dangerous because it isolates the soul. Victor becomes incapable of seeing the immediate human cost because he is obsessed with abstract global risk. The punishment is not for the decision itself, but for the state of being that made the decision necessary. He tries to manage risk like a politician rather than a parent. The scene shows that once you accept the unilateralist's curse, you cannot escape it. You are condemned to act alone, and therefore condemned to error.

  - **Walton and the frame**
  Walton provides the counter-example that saves the governance lens from total collapse. He seeks the North Pole, a risky endeavor affecting his crew. When the men demand to return, Walton listens. He defers to the collective will and turns the ship around. He survives. This validates the principle of conformity: when peers object to risk, defer. But the frame narrative does more work than the plot. The novel is composed of letters to Margaret. Walton remains connected to his sister throughout. He writes his thoughts down; he shares the burden. Victor's narrative is spoken to Walton, trapped in the ice. The form reinforces the theme. Connection saves; isolation kills. Walton's success proves that the governance model works, but only when the actor remains embedded in a web of relationships. He doesn't just follow rules; he cares about his crew. The letters remind us that science is communication. Victor stopped communicating; Walton never did. The frame ensures the story reaches a community (the reader, Margaret), preventing Victor's warning from dying with him. It turns a private tragedy into a public lesson. Walton's willingness to be judged by his crew saves them all.

  - **What the novel adds**
  The novel adds emotional texture that abstract governance theory lacks. Arguments on the page discuss risk probabilities; Shelley shows the horror of loneliness. She demonstrates that unilateral action corrodes the actor's humanity, not just public safety. Victor becomes a wretch before the Creature does. An awkward counterexample for the principle of conformity is Walton himself. Almost everyone on his crew wants to turn back. If conformity is the rule, he must stop. He does. But what if the crew was wrong? The novel hints that discovery requires some deviation. Shelley suggests that while community is necessary, it can also be a cage. The governance lens demands safety; the novel demands we ask what safety costs. It shows that procedural ethics cannot replace virtue. You cannot regulate a soul that refuses to be bound. The book argues that risk governance is impossible without empathy. Victor fails not because he lacked a committee, but because he lacked love. The novel adds the visceral cost of ignoring that truth. It turns abstract risk into dead bodies. It forces us to feel the weight of the curse, not just understand it.
