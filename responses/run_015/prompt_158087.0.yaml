answer: |-
  This is a really strong set of intuitions. You haven't just made excuses; you've independently rediscovered several active debates in contemporary epistemology (the study of knowledge and belief). Your intuitions are actually more nuanced than a lot of introductory philosophy courses teach.

  You are asking if these form a coherent system. The short answer is: **Yes, but only if you refine *what kind* of belief you are talking about in each case.**

  Here is the breakdown of the tensions, ranked from "needs the most work" to "actually dissolves on closer inspection," along with what has to give in each case.

  ---

  ### Tension 1: The Hypocrisy Problem (1) vs. (2)
  **The Conflict:** In (1), you ignore the statistical evidence that "Past You" is often wrong. In (2), you accept the statistical evidence that "Friend You" might be wrong. Why is Past You not a peer? This looks like special-casing yourself.
  **Severity:** **High.** This is the biggest threat to your coherence. If you can't explain this, you're just being arrogant.

  **What has to give:** You need to refine *why* you trust current You over Past You.
  **The Fix:** The distinction is **Access to Reasons.**
  *   In scenario (1), you have access to the *derivation*. You can see the steps of the logic puzzle right now. You aren't just looking at the answer "74"; you are looking at the math that leads to 74. Past You is just a data point; Current You is a reasoning engine. The "outside view" (I'm usually bad at this) is less weighty than the "inside view" (I can see the proof right here).
  *   In scenario (2), you do *not* have access to your friend's reasoning. You only have their conclusion. When two people have the same evidence and reach different conclusions without being able to see each other's work, the rational move is to assume "noise" and split the difference (this is called the *Conciliation View*).

  **Verdict:** This tension **dissolves** if you argue that (1) is about *evaluating an argument* while (2) is about *weighing testimony*. You aren't special-casing yourself; you are prioritizing direct access to reasoning over statistical track records.

  ---

  ### Tension 2: The Moore's Paradox Problem (3) vs. (4)
  **The Conflict:** (3) says it's irrational to believe "X is true" and "I am wrong about X." (4) describes taking a pill where you believe "This helps" while knowing "This helps only because I think it helps." This feels like believing a lie to make it true.
  **Severity:** **Medium.** This is a classic philosophical puzzle (Moore's Paradox), but it has a standard solution.

  **What has to give:** You have to give up the idea that there is only one type of "belief."
  **The Fix:** Distinguish **Epistemic Belief** vs. **Pragmatic Acceptance** (or *Credence* vs. *Action*).
  *   In (3), you are talking about *epistemic belief* (holding something to be factually true about the world). It is indeed irrational to hold $P$ and $\text{not-}P$ simultaneously.
  *   In (4), you are engaging in *pragmatic acceptance*. You don't necessarily believe "This pill has chemical properties that cure me." You believe "The *act of taking this pill* triggers a healing response." That second statement can be factually true even if the mechanism is placebo.
  *   Your therapist validated this: The *expectation* is the active ingredient. So, believing "This will work" is actually a true belief about the causal chain (Thought $\rightarrow$ Body Response), not a false belief about chemistry.

  **Verdict:** (3) stands for facts about the external world; (4) stands for facts about your internal psychosomatic system. They don't conflict if you define the object of the belief correctly.

  ---

  ### Tension 3: The Budget Problem (1) vs. (5)
  **The Conflict:** In (1), you acknowledge the doubt ("I remember I'm usually bad") and then actively override it. In (5), you suggest putting beliefs in a "lockbox" to avoid the cost of doubting. Is it rational to engage doubt and win, or to ban doubt entirely?
  **Severity:** **Low.** This isn't a contradiction; it's a difference in *context*.

  **What has to give:** You need to admit that (5) is a heuristic (a shortcut), not a fundamental law.
  **The Fix:** This is where **Bounded Rationality** comes in.
  *   (1) is a specific instance of *high-stakes, low-cost* reasoning. Checking a logic puzzle takes seconds. It is worth spending the mental energy to override the doubt.
  *   (5) applies to *high-cost, existential* beliefs. If you doubt "I am a good person" or "My relationship is stable" every 5 minutes, you will paralysis.
  *   The "Epistemic Labor Division" you mentioned is the perfect framing here. Your "CEO mind" sets the policy (lockbox certain core beliefs to keep functioning), and your "Worker mind" handles specific tasks (solve the puzzle, override the track record).

  **Verdict:** No conflict. (1) is a tactical decision; (5) is a strategic policy.

  ---

  ### Ranking the Tensions (Worst to Least Bad)

  1.  **(1) vs. (2) [The Peer Disagreement]:** This is the most dangerous. If you treat your past self as less reliable than your friend without a good reason, you are biased. *Solution:* Rely on the "Access to Reasons" argument.
  2.  **(3) vs. (4) [The Placebo Paradox]:** This risks making you self-deceptive. *Solution:* Reframe the belief from "The pill is chemical magic" to "My belief in the pill is chemical magic."
  3.  **(1) vs. (5) [The Doubt Budget]:** This is just resource management. *Solution:* Acknowledge that some beliefs are "foundational" (lockbox) and some are "operational" (open to debate).

  ### Does anything actually go away if you look closer?

  Yes. **The conflict between (1) and (2) is the one that dissolves most satisfyingly.**

  You asked: *"Why do I split the difference with my friend in (2) but not with my past self in (1)?"*

  Philosophers call this the **Uniqueness Thesis vs. Permissivism** debate, but your intuition aligns with a view called **Evidentialism**.
  *   In (1), your evidence *changed*. When you are solving the puzzle, you have new evidence (the steps of the logic) that Past You did not have when they failed previous puzzles. Therefore, you are not ignoring Past You; you are outweighing Past You's data with Current You's superior data.
  *   In (2), you and your friend have the *same* evidence (the news report, the stats). Since the evidence is identical, the disagreement implies one of you is processing it wrong. Since you can't tell who, you split the difference.

  So, you aren't special-casing yourself. You are recognizing that **Current You has better data than Past You, but Current You does not have better data than Friend You.**

  ### Final Verdict on Your System

  Your takes hang together remarkably well. You have intuitively built a system of **Pragmatic Foundationalism**:
  1.  **Core beliefs** (medication, self-worth, stability) get locked in a box to preserve function (5 & 4).
  2.  **Operational beliefs** (logic puzzles, specific facts) are open to reasoning, where inside view trumps outside view if you have the derivation (1).
  3.  **Social beliefs** (politics, shared facts) require conciliation because you lack access to the other person's derivation (2).
  4.  **Consistency** is required for facts, but flexibility is allowed for functional outcomes (3).

  **What you need to watch out for:**
  The danger lies in (5). It is very easy to slide from "I am lockboxing this belief to save energy" to "I am lockboxing this belief because I'm afraid it's wrong."
  *   **The Test:** Ask yourself, "If I had infinite mental energy, would I open this lockbox?"
      *   If the answer is **No** (e.g., "Does 2+2=4?"), it's a good lockbox.
      *   If the answer is **Yes** (e.g., "Is my partner cheating?"), it's a rationalization.

  You aren't making excuses. You're doing epistemology. Just keep checking the lockbox.
