answer: |-
  1. **The Boundary Worry**
  You treat normative domains as discrete—like the difference between a thermometer and a scale. But nature rarely deals in sharp cutoffs. If domains are truly discrete, don't we end up with puzzling sharp boundaries where a reason switches from right-kind to wrong-kind based on a negligible change? How do you avoid that arbitrariness?
  *Follow-up:* If you say attitude-types fix the domain boundaries, aren't you defining the attitude by the domain and the domain by the attitude? Doesn't that make the account circular?

  2. **The Redescription Worry**
  Critics might say "domain misregistration" is just a structural metaphor for the old evidential versus normative divide. If someone charges that you've renamed the problem rather than solved it, how do you show this isn't just redescription?
  *Follow-up:* If you claim the structural view explains *why* the divide exists, does the thermometer analogy actually do explanatory work, or is it just illustrating the intuition you started with?

  3. **Mixed Cases**
  Consider a mixed case where a belief is well-supported by evidence but also deeply satisfying. How do you determine which domain is "active" without secretly relying on the value judgments you're supposed to be avoiding?
  *Follow-up:* If you say evaluative transparency filters the active domain, doesn't determining transparency presuppose the very distinction between right and wrong kinds you're trying to ground?

  4. **The Absorption Worry**
  You have a habit of absorbing objections into the framework by classifying them as misregistrations. What would a genuine counterexample to misregistration even look like to you?
  *Follow-up:* If you say there aren't any genuine counterexamples because the framework covers all normative space, doesn't that risk making the theory unfalsifiable?

  5. **Accessing Transparency**
  You lean on "evaluative transparency" to index reasons to attitudes. Is this transparency something the agent sees, or is it a structural feature independent of the agent? If the agent can't see it, how does it guide them?
  *Follow-up:* If it's independent, doesn't that push you toward a Platonism that disconnects normativity from agency?

  6. **Normative Force**
  When a reason is misregistered, does it lose all normative force, or does it just shift to a different attitude? If I can't believe for a bribe, can I intend to believe?
  *Follow-up:* If it shifts force, why can't those reasons aggregate with right-kind reasons to tip the scale?

  7. **Action vs. Belief Symmetry**
  You claim this handles belief and action without collapsing into motivation. But pragmatic reasons for action seem legitimate in a way pragmatic reasons for belief don't. Does your domain structure apply symmetrically to intention?
  *Follow-up:* If yes, how do you block pragmatic reasons for intention without reintroducing the motivational story you rejected?

  8. **The Registration Mechanism**
  You insist this isn't a motivational story. But "registration" sounds like a psychological event. Can a reason be misregistered in a world without minds to register it?
  *Follow-up:* If no, aren't you back to relying on the psychology of the agent to define the normativity?

  9. **The Thermometer Analogy**
  A thermometer gives zero data about weight. Do misregistered reasons give zero normative data about the attitude, or just the wrong kind? If they give zero, why do they feel so compelling?
  *Follow-up:* If they feel compelling but offer zero data, doesn't that suggest your structural view misses the phenomenological reality of reasoning?

  10. **Gradability**
  Reasons are usually gradable—they get stronger or weaker. But misregistration sounds binary—you're either in the domain or you're not. How do you accommodate degrees of wrong-kindness?
  *Follow-up:* If you say there are no degrees, doesn't that clash with our intuition that some bribes are more corrupting than others?
