  hey im in this phil of mind course and we got into this debate about whether consciousness is like a single movie playing in one room (the cartesian theater thing) or more like a bunch of rough drafts being edited all over the brain with no main audience (dennetts multiple drafts). my roommate gave me this old book from the 1600s by descartes, and theres a part where he talks about lying in bed wondering if hes dreaming, saying there are no clear signs that separate sleep from waking life so he starts doubting everything he sees. the language is super old and hard to parse, but i think he's describing how all our experiences get presented to the mind in one central place where they can be checked?

  anyway my study group is split. one person says this proves descartes believed in the cartesian theater, since he's searching for one official spot where the soul looks at reality and decides if its real or a dream. but i had this other idea: if dreams can be totally vivid and have all the same details as being awake, maybe that shows our brain is writing parallel versions of experience all the time, and there's no single "official" draft being watched - which sounds more like dennets model. my friend said thats a stretch and that descartes literally thought the soul sits in one spot in the brain like an audience in a theater.

  can anyone help me understand the passage? specifically, does descartes argument about not being able to tell dream from waking mean he needs there to be one central "inner screen" where all experience is shown, or could it actually fit with the idea that there are multiple drafts running with no central viewer? and is the cartesian theater meant to be a literal place or just a metaphor for assuming theres one place where it all comes together? i keep going back and forth and the old text is too confusing to tell.
