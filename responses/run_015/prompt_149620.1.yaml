      *   **The (a) vs. (c) Relationship:** They are orthogonal. (c) is about the *player*, (a) is about the *game*. Solving (a) doesn't fix (c). In fact, focusing on (a) might distract from the harder problem of (c).
      *   **Inconsistent Motivations:** Point out the tension between Wittgenstein's therapeutic anti-theory and the group's desire to build a "criterion" for AI. Warn against "Wittgensteinian Engineering."
