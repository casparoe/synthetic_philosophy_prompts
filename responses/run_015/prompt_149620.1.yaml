      *   *Wait, I need to be critical.* Is (a) a distraction? "Formalizing family resemblance" sounds like trying to square the circle. Wittgenstein's point is that it *can't* be formalized without losing the phenomenon. Spending 5 sessions trying to formalize it might be anti-Wittgensteinian.
      *   *Pivot:* The *real* tension is between (c) [Form of Life] and (b) [Private Language/Internal State].
      *   *Reasoning:* The biggest claim against LLMs is the lack of Form of Life. The biggest claim *for* LLMs (or about their mystery) is their hidden internal states.
      *   *Let's look at the "Inconsistent Motivations" flag.* The group wants to use Wittgenstein (anti-theory) to analyze AI (hyper-theory/statistical). This is the tension.
      *   *Revised Recommendation:*
          1.  **(c) Form of Life:** Must be first.
