  7.  **Final Polish:** Check the flow. Ensure the distinction between "original" and "derived" is central. Make sure the Thermal Loop isn't just a thermostat—it needs to be described as restructuring internal dynamics. (Added detail: "phase-space attractors" or "weight adjustments" without symbols).

