      *   *The "Two-Bitser" specific:* Marcus needs to argue that the Loop's sensors are like the two-bitser coins—simple detectors that gain content through evolutionary (or design) history. But since the Loop *rewrites* itself, does it create its own history?
      *   *Elena's rebuttal:* The rewriting is determined by the human feedback loop. The human is the source of the norm.
      *   *Marcus's final push:* The "Design Stance" doesn't care about the source, only the reliability of the pattern.
