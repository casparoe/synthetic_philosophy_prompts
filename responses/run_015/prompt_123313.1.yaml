  2. right now they have exactly the same matter — same parts, same microphysics, no hidden difference in what's sitting on the plinth.
  3. they differ modally and temporally: Lumpl predates Goliath, and Lumpl could survive being rolled into a ball while Goliath couldnt.
  4. neither has any causal power the other lacks. there's one causal story in that region of space, and i dont think the statue and the lump are rival causes of anything.
  5. I'm not handing out objects just because some description is satisfiable: there's no object made of my left shoe and the Eiffel Tower, and which objects there are has nothing to do with what we happen to care about or how we talk.
  6. there's exactly one statue on that plinth. I'm not buying thousands of near-statues differing by an atom or two at the edge, and I don't think existence or identity comes in degrees — for any candidate, either it is Goliath or it isn't, full stop.
  7. modal facts dont get to be brute. if Goliath and Lumpl differ modally, something non-modal about them has to make that difference.

  a case I test things against more than the textbook one, because I think it's cleaner: a 3d-printed clay bust, laid down one layer at a time, so the lump and the bust begin to exist at the same moment and share a history as well as their matter. I still want to say two things, and I still want to say the lump could survive being squashed and the bust couldn't.

