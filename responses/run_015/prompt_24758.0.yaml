prompt: |-
  My cousin, who works in genetics, keeps settling arguments by saying that IQ is "roughly 80 percent heritable," so the environment basically doesn't matter and there's not much you can do about it. I've been chewing on this on my own and I'm fairly sure the number doesn't do the work he thinks it does, but I can't say exactly what's wrong. Can you break down the different precise claims someone could actually be making when they say a trait is "X percent heritable" or "it's in the genes" — what heritability measures, the level at which it is defined, whether it is a property of the trait itself or of a particular population in a particular environment, and what it does and does not imply about whether changing the environment would change the trait — and then, for each reading, say whether it is defensible and whether it actually supports his conclusion that the environment doesn't matter?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user's cousin (a genetics worker) uses the statistic "IQ is roughly 80 percent heritable" to argue that environment doesn't matter and nothing can be done to change IQ.
      *   **User's Intuition:** The user suspects this reasoning is flawed ("the number doesn't do the work he thinks it does") but needs help articulating *why*.
      *   **Task:** Break down the precise claims behind "X percent heritable," explain what heritability measures (level of definition, population vs. trait, etc.), explain what it implies (or doesn't) about environmental intervention, and evaluate each reading for defensibility and support for the cousin's conclusion.

  2.  **Deconstruct the Core Concept: Heritability ($h^2$):**
      *   *Definition:* It's the proportion of *phenotypic variance* in a *specific population* at a *specific time* that is attributable to *genetic variance*.
      *   *Key Distinction:* It is *not* the proportion of an *individual's* trait caused by genes.
      *   *Key Distinction:* It is *not* fixed across populations or environments.
      *   *Key Distinction:* High heritability does *not* imply immutability.

  3.  **Identify the Different "Readings" or Claims:**
      I need to categorize the ways people interpret heritability to address the user's request for "different precise claims."
      *   *Claim 1: The Individual Claim.* "80% of *my* IQ is due to my genes." (False/Category Error)
      *   *Claim 2: The Population Variance Claim.* "80% of the *differences* between people in this group are due to genetic differences." (Technically true under specific conditions, but often misapplied).
      *   *Claim 3: The Immutability Claim.* "Because it's heritable, it can't be changed by environment." (False).
      *   *Claim 4: The Universality Claim.* "This 80% applies to all populations and all times." (False).

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the user's intuition (it's correct) and state the thesis: Heritability is a population statistic about variance, not an individual destiny metric.

      *   **Section 1: What Heritability Actually Measures (The Technical Definition).**
          *   Formula: $V_p = V_g + V_e + V_{gxe}$. $h^2 = V_g / V_p$.
          *   Crucial point: It's about *variance* (differences), not the *mean* (average level).
          *   Crucial point: It's population-specific.

      *   **Section 2: Breaking Down the Claims (The "Readings").**
          *   *Reading A: The Individual Causation Claim.* ("80% of your intelligence is genetic.")
              *   *Verdict:* False. Genes and environment interact to build the trait, you can't slice an individual's trait into percentages. Analogy: Area of a rectangle (length x width).
          *   *Reading B: The Population Variance Claim.* ("80% of the differences between people in this study are due to genes.")
              *   *Verdict:* Defensible *within the specific study context*, but often overgeneralized. Depends on environmental uniformity. If environments are equal, heritability goes up.
          *   *Reading C: The Immutability Claim.* ("Environment can't change it.")
              *   *Verdict:* False. High heritability is compatible with high environmental malleability. Example: Height is highly heritable but increased with nutrition. PKU is 100% genetic but treatable by environment (diet).
          *   *Reading D: The Universal Constant Claim.* ("It's 80% everywhere.")
              *   *Verdict:* False. Heritability changes as environments change. In unequal societies, environment matters more (lower $h^2$). In equal societies, genes matter more (higher $h^2$).

      *   **Section 3: Addressing the Cousin's Conclusion ("Environment doesn't matter").**
          *   Directly refute this.
          *   Explain the Flynn Effect (IQ rising over time due to environment).
          *   Explain the difference between *ranking* (heritability) and *level* (environment).
          *   Explain the "Reaction Range" concept (genes set limits, environment determines where you land).

      *   **Section 4: Summary/Table.**
