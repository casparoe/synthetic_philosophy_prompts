  9.  *(Final Review)*: Ensure the distinction between *broad-sense* and *narrow-sense* heritability isn't too bogging down, but acknowledge that "80%" usually refers to broad-sense or additive genetic variance in adults. Keep it focused on the logical fallacy rather than the exact number.

