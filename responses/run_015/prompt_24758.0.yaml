answer: |-
  Your intuition is spot-on. Your cousin is making a classic error known as the **Heritability Fallacy**. While the number he cites (roughly 0.8 for adult IQ in Western populations) is within the ballpark of current behavioral genetics estimates, the inference he draws from it ("environment doesn't matter") is scientifically invalid.

  To help you articulate this, we need to disentangle what heritability *is* from what people *think* it is. Below is a breakdown of the precise claims hidden behind the phrase "IQ is 80% heritable," evaluated for accuracy and whether they support his conclusion.

  ### 1. The Core Definition: What Heritability Actually Is
  Before evaluating the claims, we must define the term. In genetics, **heritability ($h^2$)** is **the proportion of phenotypic *variance* in a *specific population* at a *specific time* that is attributable to genetic *variance*.**

  *   **It is about differences, not totals:** It explains why Person A is different from Person B, not how Person A got their intelligence.
  *   **It is population-specific:** It applies to the group studied (e.g., middle-class Americans in 2020), not to humans as a species.
  *   **It is environment-dependent:** If the environment changes, heritability changes.

  ---

  ### 2. Breakdown of the Precise Claims
  When your cousin says "IQ is 80% heritable," he could be making one of four distinct claims. Here is the analysis of each.

  #### Claim A: The Individual Causation Claim
  > **Interpretation:** "For any given individual, 80% of their intelligence is caused by their genes and 20% by their environment."

  *   **Is it defensible?** **No.** This is a category error. You cannot partition an individual's trait into percentages.
  *   **Analogy:** Consider the area of a rectangle. The area is determined by Length $\times$ Width. You can ask, "In a set of rectangles, does variance in Length or Width explain more of the variance in Area?" But you cannot look at *one* rectangle and say, "80% of this area is caused by the length." Both are necessary; without either, the area is zero.
  *   **Does it support his conclusion?** **No.** Because the claim is false, it supports nothing. Genes and environment are both necessary causes for any individual's development.

  #### Claim B: The Population Variance Claim
  > **Interpretation:** "In the specific population studied (e.g., Western adults), 80% of the *differences* between people's IQ scores are associated with genetic differences."

  *   **Is it defensible?** **Yes, conditionally.** This is the technical definition. In populations where environmental conditions are relatively uniform (e.g., everyone has adequate nutrition and schooling), genetic differences will account for most of the *remaining* variation.
  *   **Does it support his conclusion?** **No.** This claim only explains *ranking* within a group, not the *level* of the group.
      *   *Example:* Height is roughly 80% heritable. This means genetic differences explain why your cousin is taller than you. It does **not** mean environment doesn't matter. If you took that same population and starved them for a generation, everyone would be shorter, even though the *tallest* people would still be the ones with "tall genes." The average IQ could rise or fall dramatically due to environment (see the Flynn Effect), even if the *ranking* of individuals remains genetically determined.

  #### Claim C: The Immutability Claim
  > **Interpretation:** "Because the trait is highly heritable, it is fixed and cannot be changed by environmental intervention."

  *   **Is it defensible?** **No.** Heritability describes the *current* state of variation, not the *potential* for change.
  *   **The Logic Gap:** High heritability often occurs precisely *because* the environment is already optimized or uniform.
  *   **Counter-Example (PKU):** Phenylketonuria (PKU) is a genetic condition causing intellectual disability. It is 100% heritable (caused entirely by a gene). However, it is 100% treatable by an environmental change (a specific diet). If you measure heritability in a population where everyone eats the same diet, the genetic variance explains all the variance in outcomes. But change the diet, and you change the outcome completely.
  *   **Does it support his conclusion?** **No.** High heritability is compatible with high malleability. We could discover an environmental intervention tomorrow that raises everyone's IQ by 15 points, and the heritability statistic could remain exactly the same.

  #### Claim D: The Universal Constant Claim
  > **Interpretation:** "IQ is 80% heritable for all humans, in all places, at all times."

  *   **Is it defensible?** **No.** Heritability is not a property of the trait; it is a property of the population in its current environment.
  *   **The Logic:** Heritability depends on the ratio of Genetic Variance ($V_g$) to Environmental Variance ($V_e$).
      *   If you move to a society with extreme educational inequality, $V_e$ goes up. Heritability goes **down** (environment explains more differences).
      *   If you move to a society with perfect educational equality, $V_e$ goes down. Heritability goes **up** (genes explain more differences).
  *   **Does it support his conclusion?** **No.** In fact, it suggests the opposite. If we equalize environments (better schools, nutrition, reduced lead exposure), heritability estimates for IQ actually *increase*, but the average IQ of the population might also rise. The statistic tells us nothing about the *potential* of environmental improvement.

  ---

  ### 3. Summary for Your Argument
  To settle the argument, you can present this distinction to your cousin. He is conflating **Variance** (differences between people) with **Mean** (the average level of ability).

  | Claim | What it says | Is it true? | Does it mean "Environment doesn't matter"? |
  | :--- | :--- | :--- | :--- |
  | **Individual** | "80% of *your* IQ is genes." | **False.** | N/A (Claim is invalid). |
  | **Variance** | "80% of the *gap* between us is genes." | **True** (in specific contexts). | **No.** Explains ranking, not potential. |
  | **Immutability** | "We can't change IQ via environment." | **False.** | **No.** Highly heritable traits can be malleable (e.g., height, PKU). |
  | **Universal** | "It's 80% everywhere." | **False.** | **No.** Heritability changes as environments change. |

  ### 4. The "Flynn Effect" Knockout
  If you want one concrete piece of evidence to show that environment matters despite high heritability, cite the **Flynn Effect**.

  Throughout the 20th century, average IQ scores rose roughly 3 points per decade globally. This happened too fast to be genetic evolution. It was entirely environmental (better nutrition, reduced lead, more complex schooling, etc.).
  *   **The Kicker:** During this time, heritability estimates for IQ *also* remained high (or increased).
  *   **The Conclusion:** You can have a trait that is highly heritable (differences between people are genetic) *and* highly sensitive to environment (the average level of the whole population shifts based on conditions).

  ### 5. How to Phrase It to Him
  Since he works in genetics, speak his language but correct the inference:

  > "I know you know the technical definition of $h^2$, but you're treating a population variance statistic as an individual immutability metric. High $h^2$ just means that in our current environment, environmental variance is low relative to genetic variance. It says nothing about the reaction norm. We know from the Flynn Effect that the population mean is highly responsive to environmental shifts, even if the rank-order stability is genetic. So, saying 'environment doesn't matter' confuses variance in the trait with the causal mechanism of the trait."

  **Verdict:** Your cousin is citing a real statistic to support a false conclusion. The number describes why people differ *right now*, not what determines their potential or how much they could improve under different conditions.
