answer: |-
  ### Seminar Plan: The Logical Architecture of *Offences Against One's Self*

  **Duration:** 90 Minutes
  **Prerequisites:** Students must have already mastered the Felicific Calculus and the Principle of Utility.

  ---

  ### I. Sequence of Conceptual Pieces and Dependency Relations

  You must introduce the concepts in the following strict order. Do not deviate, as each step provides the necessary logical tool for the next.

  1.  **Activation of the Utility Standard (Minutes 0–15)**
      *   **Action:** Briefly reactivate their prior knowledge. Ask them to define the *only* condition under which an act is morally condemnable according to the Principle of Utility.
      *   **Dependency:** This establishes the **Ultimate Criterion**. Without this firmly in place, students will revert to intuition.
      *   **Required Understanding:** Students must affirm that *only* a net diminution of pleasure (pain) justifies condemnation. Nothing else counts.

  2.  **The Is/Ought Distinction via the "Unnatural" Claim (Minutes 15–35)**
      *   **Action:** Introduce the distinction between **Physical Description** and **Moral Evaluation**.
      *   **Dependency:** This must occur *before* introducing any sexual examples. If you introduce sex first, the emotional valence will collapse this distinction. You must prove that "Unnatural" is a descriptive claim (about statistics or biology) that is illegitimately functioning as a normative claim (about goodness).
      *   **Required Understanding:** Students must grasp that calling an act "unnatural" is a claim about *what is*, not *what ought to be*. To move from "is" to "ought," a bridge is required. Bentham argues that bridge is missing unless utility is invoked.

  3.  **The Epistemology of Antipathy (Minutes 35–55)**
      *   **Action:** Distinguish between **Observer Feeling** (Antipathy/Disgust) and **Actor Harm** (Pain/Suffering).
      *   **Dependency:** This relies on Step 1 (Utility is the standard) and Step 2 (Description is not Evaluation). Students often treat their own disgust as evidence of harm. You must show that antipathy is a psychological fact about the *observer*, not a moral fact about the *act*.
      *   **Required Understanding:** Students must understand that the burden of proof lies on demonstrating that the antipathy translates into actual, assignable pain (e.g., violence, social ostracization), not that the antipathy itself justifies the law.

  4.  **Application to *Offences Against One's Self* (Minutes 55–75)**
      *   **Action:** Only now introduce Bentham's specific text regarding non-procreative sexuality (paederasty).
      *   **Dependency:** This relies on Steps 1, 2, and 3. You are not asking them to evaluate the sex act directly; you are asking them to run the act through the machinery built in the previous hour.
      *   **Required Understanding:** The conclusion (that the acts should not be punished) is a byproduct of the method, not the premise.

  5.  **The Final Check (Minutes 75–90)**
      *   **Action:** Administer the structural check (detailed below).

  ---

  ### II. The One Concrete Comparison: The Case of the Left-Handed Scribe

  You will carry the entire explanation using **historical prohibitions against left-handed writing**.

  **What the Example Must Include:**
  *   **Physical Description:** The act of guiding a quill or pen with the left hand rather than the right.
  *   **The "Unnatural" Claim:** The assertion that the right hand is the "proper" or "God-given" hand, making left-handedness a deviation from the natural order.
  *   **The Antipathy:** The visceral irritation or "uncleanliness" teachers historically associated with the left hand (the *sinister* hand).
  *   **The Punishment:** Corporal correction (rapping knuckles) used to enforce right-handedness.

  **What the Example Must Exclude:**
  *   **Hygiene/Disease:** Do not allow the discussion to drift into whether left hands are actually dirtier. The point is that even if they *were* dirtier, the moral judgment rests on the utility of the pain, not the taxonomy of the hand.
  *   **Modern Context:** Frame this in the 18th/19th-century context where this was a genuine moral/disciplinary issue, ensuring students treat it seriously, not as a trivial quirk.

  **Why This Case?**
  It isolates the **"Unnatural" Fallacy** without triggering the **Disgust Conflation**.
  *   Like non-procreative sex, left-handedness was historically labeled "unnatural" and "sinful."
  *   Unlike non-procreative sex, it does not trigger visceral sexual disgust in modern undergraduates.
  *   This forces students to see that "Unnatural" is an empty label without a utility calculation. If they agree punishing left-handed children is wrong (because the pain of punishment outweighs the "deviation"), they have accepted Bentham's logic. You then simply ask them to apply that same logic to the sexual case.

  **Why Defer Paederasty?**
  If you begin with paederasty, students' pre-existing moral intuitions (whether conservative or liberal) will short-circuit the logic. Conservatives will fixate on the disgust; Liberals will fixate on the "right to sex." Both will miss the *structure* of the argument. By securing the logical structure with the Left-Handed Case first, you make the sexual conclusion inevitable rather than debatable. The sexual case becomes merely another instance of the established rule.

  ---

  ### III. Mapping Predictable Misconceptions

  You must anticipate and defuse these misconceptions at the precise moments they arise. Do not wait for questions; insert the defusions proactively.

  1.  **Misconception: "Bentham is licensing any pleasure regardless of long-term consequence."**
      *   **When:** During **Phase 1 (Activation of Utility)**.
      *   **Defusion:** Explicitly remind them that the Calculus includes *duration* and *fecundity*. A pleasure that leads to greater future pain is not utility-maximizing. Bentham is not a hedonistic anarchist; he is a consequentialist.

  2.  **Misconception: "Bentham denies all psychological harm."**
      *   **When:** During **Phase 3 (Epistemology of Antipathy)**.
      *   **Defusion:** Clarify that Bentham acknowledges the pain of social stigma. However, he argues this pain is caused by the *prejudice* (the law/opinion), not the *act*. To punish the act to relieve the prejudice is to validate the prejudice. The utility calculation must weigh the pain of the punishment against the pain of the stigma, not ignore the stigma entirely.

  3.  **Misconception: "He collapses morality into private preference."**
      *   **When:** During **Phase 4 (Application to Text)**.
      *   **Defusion:** Emphasize that "Private" does not mean "Arbitrary." It means "Self-regarding." If an act affects only the actor, the actor is the best judge of their own utility. It is not that morality disappears; it is that the *state* lacks the epistemic access to justify interference.

  4.  **Misconception: "His rejection of natural-law reasoning is merely an inverted appeal to nature."**
      *   **When:** During **Phase 2 (Is/Ought Distinction)**.
      *   **Defusion:** Ensure students understand Bentham is not saying "Nature is bad." He is saying "Nature is irrelevant." He does not replace "Natural" with "Unnatural" as the standard; he replaces *both* with "Useful."

  ---

  ### IV. The Final Check

  At Minute 75, pose this single exercise. Do not allow a general discussion; require a written or verbal response that targets the dependency structure.

  **The Exercise:**
  > "Consider a hypothetical Act Z.
  > 1. Statistical data shows Act Z is performed by only 1% of the population (Rare/Unnatural).
  > 2. Observers report a strong feeling of nausea when witnessing Act Z (Antipathy).
  > 3. Medical data shows Act Z reduces the actor's lifespan by two years (Harm).
  >
  > According to the logical architecture of Bentham's *Offences Against One's Self*, which of these three data points justifies legal sanction? Explain why the other two fail the test."

  **Correct Response Criteria:**
  *   Students must identify **(3)** as the only valid justification.
  *   Students must explain that **(1)** is a physical description (taxonomy) and fails the Is/Ought test.
  *   Students must explain that **(2)** is a feeling (antipathy) and fails the Evidence of Harm test.
  *   **Crucial:** If a student argues that (2) justifies sanction because "social cohesion causes pain if violated," they have failed. They must recognize that under Bentham's specific argument in this text, the pain of *prejudice* cannot justify the law, or the prejudice itself must be educated away. The sanction must rest on the intrinsic harm (3).

  ---

  ### V. Historical Material: Acknowledge but Exclude

  **Acknowledge:**
  *   Briefly state that *Offences Against One's Self* was **unpublished during Bentham's lifetime** and existed only in manuscript.
  *   **Why:** This explains why the text is less familiar than the *Introduction to the Principles of Morals and Legislation* and signals the radical nature of the argument without getting bogged down in biography.

  **Exclude:**
  *   **The specific 18th-century English sodomy statutes** (e.g., the Buggery Act of 1533 and its amendments).
  *   **Bentham's correspondence** with contemporaries regarding the manuscript.
  *   **The publication history** (when it was finally released in the 20th century).
  *   **Why:** Including these details shifts the seminar from **Philosophical Logic** to **Intellectual History**. Students will begin debating the legal context of 1790s England rather than analyzing the dependency relations of the utilitarian argument. You want them holding the *structure* of the argument, not the *context* of the manuscript. The logic must stand independently of the specific laws it sought to dismantle.
