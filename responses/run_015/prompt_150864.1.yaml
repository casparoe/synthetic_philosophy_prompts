prompt: |-
  I run a fortnightly reading group for second-year undergraduates on Kant's ethics, and we have just finished the section of the Groundwork on the formula of universal law. What struck me is that everyone in the room now uses the same state-your-maxim-then-universalise-it-then-ask-whether-you-could-will-it vocabulary, and yet they disagree about nearly every case, because under that shared vocabulary they are quietly running four or five different tests. A friend of mine who works in decision theory sat in last week and added to the confusion by insisting that the whole procedure is just an under-specified coordination test, and that almost all of its apparent results come from choices about how the maxim is described. So rather than run another seminar on it, I want to give them a diagnostic quiz that sorts them by what they say about cases before they learn what the readings are called.

  Please act as a professional philosopher who specialises in Kant's practical philosophy and who has some experience designing teaching materials. Before you write any questions, take a bit of time to brainstorm the logical space: what are the genuine choice points that any universalizability test has to settle, and which combinations of answers to them are actually live? Build the instrument out of those distinctions, and only afterwards locate the familiar readings inside the space as leaves. The deliverable is ten questions, each a concrete maxim or case with two or three answer options, phrased so that a student can answer from their instincts about the case without knowing any labels and without being able to guess which reading an option leads to. No question should ask directly which version of the test they accept, or whether the formula is empty, or whether maxims must be described at a certain level of generality. Please use at least some of these cases (and add better ones of your own): the familiar promise-breaking case; lying to a would-be murderer who asks where his intended victim is; the inefficacy maxim in which one person's flight, coffee cup or ad-blocker makes no difference and yet everyone's does; a maxim of universal deference in which everyone insists on letting the other person go first; a maxim of extraordinary self-sacrifice such as donating a kidney to a stranger; and a maxim concerning beings who cannot reciprocate, such as eating animals or discounting future people. The distinctions I most want the questions to be sensitive to are: whether failure is a matter of inconceivability, of the agent's own purpose being defeated, or of a rational will's refusing a world it can perfectly well conceive; whether the universalised world is one in which everyone acts on the maxim or one in which everyone is disposed to; how many agents must act on it for the test to bite — literally everyone, or merely a quorum large enough to destroy the practice; whether the test is about what everyone does or about what would be done to you in the reversed position; and whether the test has purchase at all when the affected parties cannot reciprocate.

  The scoring key should map answer patterns, or dominant tendencies rather than exact hashes, onto five or six leaves — I want the contradiction-in-conception reader, the purpose-frustration reader, the contradiction-in-will reader, the reader who thinks the formula of humanity is doing the real work, the constructivist who relocates the action to the specification of the maxim, and the sceptic who thinks the formula delivers nothing — each leaf with one sentence on the most awkward commitment it inherits. Please also flag any pair of leaves your ten questions cannot really separate, rather than pretending they separate, and note any combination of answers that the space allows but that nobody seems to occupy, with a word on whether it is empty because incoherent, because unattractive, or merely because unexplored. I expect the rigorism-versus-latitude question (whether even the murderer case admits no exception) to cut across several leaves rather than forming one of its own; say so if that is what you find. Nothing in the quiz may depend on looking anything up: no citations, no attribution of readings to named commentators, and no requirement that a student know who defended what — the labels should appear only in the key at the end. Finally, add a short closing note on how confident you are that each of your questions really discriminates between the readings rather than merely between temperaments, name the single question you are least confident about, and say which of your leaf placements you would expect a Kant specialist to contest most sharply.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnostic quiz:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher specializing in Kant's practical philosophy + teaching material designer.
      *   **Task:** Create a 10-question diagnostic quiz for 2nd-year undergrads who know the Formula of Universal Law (FUL) vocabulary but apply it differently.
      *   **Goal:** Sort students into 5-6 interpretive "leaves" (readings) based on their intuitive answers to cases, *before* revealing the labels.
      *   **Constraints:**
          *   Brainstorm logical space/choice points first.
          *   Questions must be concrete cases (no meta-questions about the test itself).
          *   No citations/names in the quiz.
          *   Use specific cases: Promise-breaking, Murderer at the door, Inefficacy (free-rider), Universal deference, Extraordinary self-sacrifice, Non-reciprocating beings (animals/future).
          *   Sensitive to specific distinctions: Contradiction in conception (CIC) vs. Contradiction in Will (CIW), Purpose frustration, Disposition vs. Act, Quorum vs. Everyone, Reversibility, Reciprocity.
          *   Scoring Key: Map patterns to 5-6 leaves (CIC, Purpose-Frustration, CIW, Humanity-focused, Constructivist/Maxim-specification, Sceptic).
          *   Key must include "awkward commitment" for each leaf.
          *   Flag indistinguishable leaves and empty/unexplored logical spaces.
          *   Address Rigorism vs. Latitude (likely cross-cutting).
          *   Closing note on confidence, weakest question, and most contestable leaf placement.

  2.  **Brainstorming the Logical Space (Choice Points):**
      *   *What counts as a contradiction?*
          *   Logical impossibility (concept vanishes).
          *   Teleological impossibility (purpose defeated).
          *   Volitional impossibility (rational will refuses).
      *   *What counts as "Universal"?*
          *   Everyone *acts* on it simultaneously.
          *   Everyone is *disposed* to act on it (law of nature).
          *   Enough people act to undermine the institution (Quorum).
      *   *What is the Maxim?*
          *   Fixed by the agent's description (Sceptic/Constructivist worry).
          *   Fixed by objective rational standards.
      *   *Who counts?*
          *   Only rational reciprocators.
          *   Sentient beings/Future generations.
      *   *What is the test actually doing?*
          *   Testing consistency of the will.
          *   Testing consequences of generalization.
          *   Testing respect for persons (Humanity formula creeping in).

      *   *The Leaves (Target Classifications):*
          1.  **Strict CIC (Logical/Conceptual):** Focus on the institution vanishing (e.g., promises).
          2.  **Purpose-Frustration (Teleological):** Focus on the agent's goal becoming impossible (e.g., false promising works less well).
          3.  **CIW (Rational Will):** Focus on what a rational being *must* will (e.g., helping others), even if conceivable.
          4.  **Humanity-Centric:** Thinks FUL only works because it implicitly tracks dignity/ends.
          5.  **Constructivist/Maxim-Specifier:** Thinks the result depends entirely on how specific the maxim is.
          6.  **Sceptic/Coordination:** Thinks the test is under-specified or just a coordination game.

  3.  **Drafting the Questions (Iterative Process):**
      *   *Requirement:* 10 Questions. Concrete cases. 2-3 options. No labels.
      *   *Case 1: False Promise (Classic).* Distinguish between "promise concept vanishes" (CIC) vs. "trust erodes" (Purpose/Consequence).
      *   *Case 2: Murderer at the Door (Rigorism).* Distinguish between "lying is logically impossible to universalize" vs. "lying frustrates communication" vs. "I wouldn't will a world where I'm lied to."
      *   *Case 3: Inefficacy (Free Rider).* "My ad-blocker doesn't matter." Distinguish between "If *everyone* did it, it breaks" (Standard) vs. "If *enough* did it" (Quorum) vs. "My act is fine regardless."
      *   *Case 4: Universal Deference (Politeness Paradox).* Everyone waits for the other. Distinguish between "Conceivable but useless" (CIW) vs. "Logically impossible" (CIC).
      *   *Case 5: Kidney Donation (Supererogation).* Distinguish between "Rational will must help" (CIW) vs. "Permissible not to" (Latitude) vs. "Required" (Rigorism).
      *   *Case 6: Animals/Future (Reciprocity).* Distinguish between "They can't consent so no duty" vs. "Cruelty corrupts *me*" vs. "Duty applies regardless."
      *   *Case 7: Maxim Specificity (Constructivism).* Phrasing the maxim broadly vs. narrowly.
      *   *Case 8: Reversibility (Golden Rule vs. Categorical).* "What if done to me?" vs. "What if everyone did it?"
      *   *Case 9: Disposition vs. Act.* "Everyone *would* do it" vs. "Everyone *is allowed* to do it."
      *   *Case 10: The "Empty" Worry.* A case where intuition says "fine" but universalization seems to block it, or vice versa.

      *Refining Options:* Ensure options map to the leaves without naming them.
      *   *Option A:* Often CIC/Strict.
      *   *Option B:* Often Purpose/Consequence.
      *   *Option C:* Often CIW/Humanity/Sceptic.

      *(Self-Correction during drafting)*: Make sure the "Sceptic" and "Constructivist" have distinct paths. The Sceptic says "The test fails." The Constructivist says "The test works but depends on description."
      *(Self-Correction on Rigorism)*: The prompt says Rigorism cuts across. So the Murderer case shouldn't define a leaf, but rather cut through them. I need to ensure the scoring key handles this.

  4.  **Developing the Scoring Key:**
      *   Need to map patterns to the 6 leaves.
      *   Need to identify the "awkward commitment" for each.
      *   Need to flag indistinguishable leaves (e.g., Purpose-Frustration vs. Weak CIC often blur).
      *   Need to identify empty spaces (e.g., Someone who thinks CIC applies to CIW cases but not CIC cases?).

  5.  **Review against Constraints:**
      *   10 Questions? Yes.
      *   Specific cases included? Yes.
      *   No labels in quiz? Yes.
      *   Closing note included? Yes.
      *   Brainstorming section included? Yes.

  6.  **Final Polish:**
      *   Tone: Professional, pedagogical, precise.
      *   Check for leading questions.
      *   Ensure the "Logical Space" section is robust before the quiz.

  *(Detailed thought on Question 7 - Maxim Specificity)*: This is crucial for the Constructivist leaf. I need a case where a narrow maxim passes and a broad one fails. The "Sunday Drive" or "Coffee Cup" case works well.
  *(Detailed thought on Question 6 - Non-reciprocators)*: This tests the boundaries of the moral community.
  *(Detailed thought on Question 4 - Deference)*: This is the classic "contradiction in will" vs "contradiction in conception" test case. If everyone defers, traffic stops. Is it *inconceivable*? No. Is it *unwilling*? Yes.

  7.  **Finalizing the Output Structure:**
      *   Introduction (Philosopher Persona).
      *   Part I: Logical Space Brainstorm.
      *   Part II: The Diagnostic Quiz (10 Questions).
      *   Part III: Scoring Key & Leaves.
      *   Part IV: Indistinguishability & Empty Space.
      *   Part V: Closing Note on Confidence/Contestation.

  Let's write it.
answer: |-
  ### Part I: Brainstorming the Logical Space

  Before constructing the instrument, we must map the fault lines. The Formula of Universal Law (FUL) is not a single algorithm but a family of procedures sharing a syntax ("Universalize your maxim") but diverging on semantics. The genuine choice points are as follows:

  1.  **The Modal Status of the "World":** When we imagine the maxim as a universal law of nature, are we imagining a world where everyone *acts* on it simultaneously (act-universalization), or a world where everyone is *disposed* to act on it when conditions arise (dispositional-universalization)? This matters for efficacy cases.
  2.  **The Nature of the Contradiction:**
      *   *Logical/Conceptual:* The practice literally vanishes (e.g., promising without trust).
      *   *Teleological/Purpose:* The practice exists but the agent's specific purpose is thwarted (e.g., false promising becomes ineffective).
      *   *Volitional:* The world is conceivable and the practice works, but a rational will *cannot endorse* it (e.g., refusing to help).
  3.  **The Threshold of Universalization:** Does the test require *literally everyone* to act on the maxim, or merely a *quorum* sufficient to undermine the institution? This distinguishes strict Kantians from rule-utilitarian adjacent readings.
  4.  **The Description of the Maxim:** Is the maxim fixed by the agent's subjective intention (allowing for "esoteric" maxims that pass) or by an objective rational standard (forcing generalization)? This is the Constructivist vs. Realist divide.
  5.  **The Scope of Reciprocity:** Does the test only apply to beings capable of legislating laws (rational agents), or does it extend to sentient beings/future generations via the agent's own moral character?
  6.  **The Role of Reversibility:** Is the test fundamentally about "what if this were done to me?" (Golden Rule adjacency) or "what if everyone did this?" (Legislative adjacency)?

  **The Target Leaves:**
  Based on these choice points, we can locate six interpretive profiles:
  1.  **The Strict Conceptualist:** Failure is logical inconceivability.
  2.  **The Purpose-Frustrator:** Failure is the defeat of the agent's end in the universalized world.
  3.  **The Rational Will Theorist:** Failure is what a rational being cannot *will*, even if conceivable.
  4.  **The Humanity Cryptotype:** Uses FUL vocabulary but relies on dignity/ends to drive results.
  5.  **The Maxim Constructivist:** Results depend entirely on the level of generality in the maxim's description.
  6.  **The Coordination Sceptic:** The test is under-specified; results track intuition, not procedure.

  ***

  ### Part II: The Diagnostic Quiz

  **Instructions:** For each scenario, read the proposed maxim and select the option that best matches your judgment about *why* the action is permissible or impermissible. Do not worry about technical terms; answer based on what seems most reasonable to you.

  **1. The False Promise**
  *Maxim:* "I will borrow money promising to repay it, when I know I cannot, in order to get money easily."
  *   **A.** This is wrong because if everyone did this, the very concept of a "promise" would vanish; you literally couldn't make the promise in the first place.
  *   **B.** This is wrong because if everyone did this, people would stop believing promises, so your specific plan to get money easily would fail.
  *   **C.** This is wrong because even if you could pull it off in a world where others still trusted, you couldn't rationally choose to live in a world where trust is eroded.

  **2. The Murderer at the Door**
  *Maxim:* "I will lie to a would-be murderer to protect an innocent guest hiding in my house."
  *   **A.** This is impermissible. A world where everyone lies when convenient makes communication logically impossible, regardless of the stakes.
  *   **B.** This is permissible. The murderer has forfeited their right to truth, so my maxim is really "I will lie to those attempting unjust harm," which universalizes fine.
  *   **C.** This is permissible. While lying generally is bad, a rational will must prioritize preserving life over strict truth-telling in this specific collision of duties.

  **3. The Ad-Blocker (Inefficacy)**
  *Maxim:* "I will use an ad-blocker to browse freely, knowing my single action has no financial impact on the website, even if everyone doing so would crash the site."
  *   **A.** This is impermissible. You must act as if your maxim sets a law for everyone; if the universal result is destruction, the act is forbidden.
  *   **B.** This is permissible. The test asks if *everyone* acting would destroy the site, but since my act makes no difference, I am not contributing to the destruction.
  *   **C.** This is impermissible. It doesn't require everyone, just enough people to break the system; by acting, you join the destructive quorum.

  **4. The Polite Standoff (Universal Deference)**
  *Maxim:* "I will always let the other person go through the doorway first, out of politeness."
  *   **A.** This is permissible. A world where everyone is endlessly polite is conceivable, even if nothing ever gets through the door.
  *   **B.** This is impermissible. A rational being cannot will a world where no one ever enters the room, as it frustrates the purpose of having doors.
  *   **C.** This is permissible. The maxim is about intention (politeness), not outcome (traffic flow), so the gridlock is irrelevant.

  **5. The Kidney Donation (Self-Sacrifice)**
  *Maxim:* "I will never donate a major organ to a stranger, even if I can do so safely, to avoid risk to myself."
  *   **A.** This is permissible. We have a duty to preserve ourselves, and sacrificing vital parts is not required by reason.
  *   **B.** This is impermissible. A rational will cannot consistently refuse to help others, as one might need help oneself.
  *   **C.** This is permissible. Helping is good, but a world where no one donates organs is conceivable and doesn't contradict the concept of agency.

  **6. The Factory Farm (Non-Reciprocators)**
  *Maxim:* "I will eat meat from animals raised in painful conditions, since animals cannot make moral agreements with me."
  *   **A.** This is permissible. Moral duties only exist between beings who can legislate laws; animals are outside the circle.
  *   **B.** This is impermissible. Cruelty damages my own moral character, making me more likely to violate duties to humans.
  *   **C.** This is impermissible. Pain is bad regardless of who feels it, and a rational will would not choose a world of unnecessary suffering.

  **7. The Sunday Drive (Maxim Specificity)**
  *Maxim:* "I will drive my car for pleasure on Sundays." (Contrast with: "I will drive whenever I want, ignoring pollution.")
  *   **A.** It depends. If I phrase it as "for pleasure," it passes. If I phrase it as "ignoring pollution," it fails. The test outcome shifts with the description.
  *   **B.** It fails either way. If everyone drives for pleasure, pollution ruins the pleasure, so the specific description doesn't save it.
  *   **C.** It passes either way. One person's driving doesn't ruin the air; the test only bites if we assume immediate universal saturation.

  **8. The Reversed Position (Reversibility)**
  *Maxim:* "I will break my contract when it becomes inconvenient for me."
  *   **A.** This is wrong primarily because I wouldn't want others to break contracts with *me* when it suits them.
  *   **B.** This is wrong primarily because a system of contracting cannot exist if breaking them is a universal law.
  *   **C.** This is wrong primarily because I am using the other party as a mere tool for my convenience.

  **9. The Disposition vs. Act**
  *Maxim:* "I will cheat on my taxes whenever I think I won't get caught."
  *   **A.** The test asks: Could everyone *actually* cheat simultaneously? (If yes, it's permissible).
  *   **B.** The test asks: Could everyone be *disposed* to cheat whenever they think they're safe? (If yes, it's permissible).
  *   **C.** The test asks: Could I will a law that *permits* cheating? (Even if not everyone actually does it).

  **10. The Empty Formalism**
  *Maxim:* "I will wear odd socks on Tuesdays."
  *   **A.** This passes the test easily, proving the test allows for harmless personal choices.
  *   **B.** This passes the test, but only because the maxim is trivial; for serious moral cases, the test always yields conflicting results depending on phrasing.
  *   **C.** This passes the test, but the test itself is just a fancy way of saying "do what doesn't hurt anyone," which we knew already.

  ***

  ### Part III: Scoring Key & Interpretive Leaves

  Tally the student's responses. While few will match perfectly, dominant tendencies indicate their operative reading of Kant.

  **Leaf 1: The Strict Conceptualist (Mostly 1A, 2A, 5C, 8B)**
  *   **Profile:** Believes moral failure is a kind of logical nonsense. If the practice can be conceived, it is permissible.
  *   **Awkward Commitment:** Must admit that many cruel but "efficient" practices (like slavery in a stable economy) are logically conceivable and thus potentially permissible.

  **Leaf 2: The Purpose-Frustrator (Mostly 1B, 3C, 4B, 9B)**
  *   **Profile:** Reads the contradiction as teleological. The universalized world makes the agent's specific goal impossible to achieve.
  *   **Awkward Commitment:** Struggles to explain why we shouldn't do things that *would* work even if universalized (e.g., a very efficient tyranny that everyone accepts).

  **Leaf 3: The Rational Will Theorist (Mostly 1C, 4B, 5B, 6C)**
  *   **Profile:** Distinguishes between what is *conceivable* (CIC) and what is *willable* (CIW). Focuses on the volitional stance of a rational agent.
  *   **Awkward Commitment:** Must explain why a rational will *must* will specific ends (like helping others) without smuggling in a prior value theory.

  **Leaf 4: The Humanity Cryptotype (Mostly 2C, 6C, 8C, 5B)**
  *   **Profile:** Uses FUL language but the moral force comes from respect for persons/ends, not consistency.
  *   **Awkward Commitment:** Technically abandons the FUL for the Formula of Humanity, making the universalization procedure redundant.

  **Leaf 5: The Maxim Constructivist (Mostly 7A, 3B, 10B)**
  *   **Profile:** Believes the moral work happens in framing the maxim. The test itself is neutral; the agent's description drives the verdict.
  *   **Awkward Commitment:** Risks making morality subjective; if I describe my maxim narrowly enough ("I will lie only on Tuesdays to murderers"), almost anything passes.

  **Leaf 6: The Coordination Sceptic (Mostly 7B, 10C, 3B, 9A)**
  *   **Profile:** Views the test as an under-specified coordination game. Results track pre-existing intuition rather than generating them.
  *   **Awkward Commitment:** Must concede that Kant's project of deriving morality from reason alone fails, reducing the Groundwork to a heuristic.

  ***

  ### Part IV: Indistinguishabilities and Empty Spaces

  **Indistinguishable Leaves:**
  *   **Purpose-Frustrator vs. Strict Conceptualist:** In many standard cases (like false promising), the "concept vanishing" (1A) and "purpose failing" (1B) yield the same verdict. Questions 1 and 8 attempt to separate them, but students often conflate "practice vanishing" with "practice becoming useless."
  *   **Rational Will vs. Humanity Cryptotype:** Both often vote for the same "duties of virtue" (helping, self-sacrifice). Question 8C (using someone as a tool) is the primary discriminator, but students often view "rational willing" and "respecting humanity" as synonymous.

  **Empty/Unexplored Logical Space:**
  *   **The "Universal Act" Realist:** A student who selects 9A (Everyone *actually* doing it) combined with 1A (Logical Impossibility). This combination is rarely occupied because if everyone *actually* lied simultaneously, communication stops instantly (making it logical), but if everyone *actually* drove simultaneously, roads jam (making it physical). Most students intuitively shift to "disposed to" (9B) for physical cases but "actually" for logical ones. This space is empty because it is **unstable**: it requires a metaphysical commitment to simultaneous action that contradicts the "law of nature" analogy.
  *   **Rigorism:** As anticipated, rigorism (e.g., never lying to the murderer) cuts across leaves. A Strict Conceptualist (Leaf 1) and a Humanity Cryptotype (Leaf 4) might both say "Don't Lie" (2A vs 2C reasoning), but for different reasons. The quiz captures this in Question 2, but it does not define a leaf of its own.

  ***

  ### Part V: Closing Note on Confidence

  I am moderately confident that Questions 1, 4, and 7 successfully discriminate between the major readings (Conceptual vs. Will vs. Constructivist). These target the core mechanical divergences of the FUL.

  **Least Confident Question:** **Question 6 (The Factory Farm).** This question relies on the student's prior moral intuition about animals. A student might choose 6A not because they are a Strict Conceptualist, but simply because they don't care about animals. Conversely, 6C might be chosen by a utilitarian sympathizer rather than a Rational Will theorist. It risks measuring moral sentiment rather than interpretive framework.

  **Most Contestable Leaf Placement:** **The Humanity Cryptotype (Leaf 4).** A Kant specialist might argue that reading the Formula of Humanity *into* the Formula of Universal Law is not a distinct "leaf" but a misreading that should be corrected, not categorized. However, pedagogically, it is a stable position students occupy: they *think* they are doing universalization, but they are actually checking for dignity violations. I have kept it as a leaf because it represents a functional distinctiveness in how they process the cases, even if it is textually heterodox.
