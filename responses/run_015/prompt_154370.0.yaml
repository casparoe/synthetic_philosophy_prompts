answer: |-
  You have spotted the trap: when theory enters the novel, it tends to speak in lectures. To keep your characters breathing, you need a framework that functions as architecture, not decoration. You are asking for a map that distinguishes the hero from the nuisance without relying on the author's thumb on the scale. Here is what that map must show.

  For political obligation, the first non-negotiable is the **Particularity Requirement**. A theory must explain why a citizen owes something to *this* state, rather than to any reasonably decent state that protects human rights. If your account cannot distinguish D's duty to the state he lives in from his duty to a neighbouring state he has never visited, it fails. D has no vote and no passport; if obligation rests on consent, he is free. If it rests on benefit, he is bound. You need a theory that can hold that tension without snapping. Secondly, the account must handle **Regime Persistence**. When the government changes twice in eighteen months, does M's obligation reset? If obligation is tied to the specific rulers, she is free; if it is tied to the office or the community, she is not. A workable theory must explain whether prior compliance creates a debt that survives the election, or whether the contract is renewed with every administration. Finally, it must address **Exit**. If M cannot leave because she cares for her mother, does that coercion bind her tighter, or does it dissolve the obligation because her stay is not voluntary? A theory that says she is bound simply because she is physically present treats her like a subject, not a citizen.

  For civil disobedience, the requirements shift from duty to justification. The account must separate **Validity from Obligation**. It must allow a character to say, 'This law is valid, but I will not obey it,' without sounding like an anarchist. If the theory conflates the two, K becomes a criminal the moment she withholds tax, rather than a protestor. Crucially, it must handle **Epistemic Uncertainty**. You have a character who is only sixty per cent sure the law is unjust. A rigid theory demands certainty; a useful one permits action on probable judgement but assigns the **Risk of Error** to the agent. If she is wrong, she cannot claim martyrdom; she must accept she was merely mistaken. This preserves the drama: she acts, but she might be wrong. Regarding **Publicity and Penalty**, you face a hard choice. Classic accounts demand open breach and acceptance of punishment to prove fidelity to the rule of law. This fits K, who writes to say what she is doing. It destroys M, who hides her son. If your theory demands publicity, M is merely a criminal. If you want M to be a hero, your account must allow for **Conscientious Evasion** where publicity invites death or ruin. It must distinguish between breaking the law to change it (K) and breaking the law to survive it (M). Finally, it must define **Proportionality**. K cannot withhold tax because the form was annoying; the sacrifice must match the injustice. But it must not demand sainthood. The theory should ask whether the harm prevented outweighs the harm caused, not whether the agent has suffered enough.

  You are right to suspect incompatibilities. The pair that cannot jointly survive is **Absolute Authority** and **Absolute Conscience**. You cannot have a theory that says 'authority binds even when you think it wrong' and 'you must never abet serious injustice'. One must yield. If authority is to mean anything, it must sometimes bind when the subject doubts it; if conscience is supreme, authority is merely advice. For a novel, the latter is more fertile, but it makes the state's response harder to justify. You also noted the tension between **First-Personal Guidance** and **Deference**. If the theory tells the agent to defer when she is probably right, it is useless to her; if it tells her to obey her judgement always, it licenses chaos. The solution is to separate the *permission* to act from the *correctness* of the act. She is permitted to act on her judgement, but she bears the cost if the judgement is flawed. This keeps the tension alive in the narrative.

  As for your specific questions: an account does not *have* to answer the 'why this lot' question to be coherent, but it must answer it to be useful for D. Without it, D is just a cosmopolitan drifter. It must keep validity apart from obligation, or K has no defence. It does not have to demand publicity if it acknowledges that some regimes are too repressive for open protest; demanding publicity in a tyranny rules out resistance entirely, which is morally bankrupt. It should say what is owed afterwards: if the claim is moral, the agent owes the community an explanation, if not a submission. Regarding complicity, the theory must distinguish the voter from the payer; N's oath makes him more implicated than K's tax. Emigration does not automatically discharge obligation if the tie is associative rather than consensual, but M's inability to leave weakens the claim that she accepted the benefits. Finally, law and authority are the same animal here; the union directive subplot works if the union claims a moral authority akin to the state, not just a contractual one.

  The non-negotiable requirements are the **Separation of Validity and Obligation** and the **Allocation of Risk**. Without the first, there is no civil disobedience, only crime. Without the second, there is no drama, only dogma. The contingent requirements are Publicity (depends on safety) and Acceptance of Penalty (depends on whether the system is deemed legitimate enough to deserve that gesture). The pair that cannot be jointly met is **Content-Independence** (obey because it is the law) and **Justice-Dependence** (obey only if it is just). You must choose which one your state claims, and which one your characters believe.

  The single requirement that knocks out the most theoretical candidates, and the one I would put in your barrister's mouth, is **Acceptance of the Penalty**. It destroys any theory that suggests an unjust law imposes no duty at all. If a character claims the law is illegitimate but then fights the fine, they are claiming a privilege without the cost. A barrister can say: 'You claim to act for the law, yet you reject its judgement. You want the martyr's crown without the execution.' It filters out the opportunists from the conscientious. It leaves you with K, who pays the price, and isolates M, who cannot.

  As for the four accounts you mentioned: **Consent** theories are clean but leave D and M out in the cold; they never agreed to anything. **Fair-Play** accounts bind D because he takes the benefit of the road and the police, but they struggle to explain why he must obey a law that excludes him from voting. **Natural-Duty** accounts solve the 'why this state' problem poorly (why not move to a better one?) but are good for N, who has a duty to support just institutions. **Associativist** accounts are best for your novel; they argue obligation arises from the relationship itself, like a family. They bind M because she is part of the community, even if she hates the current rules, but they allow for rupture if the community becomes toxic. Use theAssociativist view for the emotional weight, and the Consent view for the legal trap.
