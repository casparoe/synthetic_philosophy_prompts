answer: |-
  The cherry pie sat on the stainless-steel counter, a single slice left in the tin. It was 2:00 AM at the Silver Spoon Diner, the lull between the drunk crowd and the breakfast rush.

  Elena looked at the pie, then at Kelsey. Kelsey was eighteen, pregnant, and wiping down tables with a hand pressed to her lower back.

  *She needs the sugar,* Elena thought. *I can wait until I get home.*

  She plated the slice, added a dollop of whipped cream, and walked it out to Kelsey. It felt warm in her chest, that familiar hum of righteousness. She was the Good Cook. The one who held the team together.

  Later, in the walk-in, pulling a tray of marinated chicken, she paused. The cold air bit at her cheeks. She replayed the moment. The thought *She needs the sugar* hadn't felt like a choice. It had felt like a reflex. A key turning in a lock.

  She thought about last Tuesday. Same pie, different waitress. Same thought. Same warm hum.

  She thought about Friday, when Mike called in sick because he'd hungover. Elena had covered his shift. *He's going through stuff,* she'd told herself. *I'm stable.* She hadn't weighed the cost of her own exhaustion. She'd just executed the command: **Cover For Mike.**

  It was the argument with her friend Sarah coming back to her. *Sphexishness.* The wasp that drags the cricket to the burrow, checks the hole, drags it back, checks the hole again. If you move the cricket while the wasp is inside checking, the wasp comes out, drags the cricket back to the threshold, and starts the check from step one. No adaptation. Just script.

  Sarah said human morality was the same. Just biology dragging crickets into burrows, calling it virtue.

  Elena slammed the chicken tray down. "I'm not a wasp," she whispered to the frozen peas.

  The next night, the test presented itself. Mike was outside smoking, again. He texted: *Running 10 late. Cover the grill?*

  The script loaded instantly. *He's struggling. I'm reliable.* Her fingers hovered over her phone to type *No problem.*

  Elena stopped. She put the phone down. She let the grill cool. She let the order ticket pile up. When Mike walked in ten minutes later, flushed and apologetic, Elena didn't smile.

  "You're late," she said. "Run the fryer."

  Mike blinked. "Uh, sure. Sorry."

  Elena felt a jolt. It wasn't the warm hum of righteousness. It was electric. Sharp. *I broke the loop.* She had chosen self-preservation over loyalty. She had acted spontaneously. She felt lighter, unburdened by the invisible code.

  For the next week, Elena watched herself. She was looking for the glitch, the proof of free will.

  When a customer shorted his bill by five dollars, usually Elena would eat the cost. *Let it go. Not worth the fight.* This time, she chased him to the door. "You owe five bucks."

  When the owner asked her to work a double on Sunday, usually she'd say yes. *The business needs me.* This time, she said, "I have plans." She didn't have plans. She went home and watched TV.

  She felt powerful. She was rewriting her code. She was flexible.

  But by the following Tuesday, the pattern emerged.

  The cherry pie was back. Single slice. Kelsey was there again, rubbing her back.

  The old script warmed up in Elena's mind. *She needs the sugar.*

  Elena smiled. She knew this trap. She wouldn't fall for it. She wouldn't give away the pie just to feel good. That was the old loop. To be free, she had to be unpredictable.

  So she ate the pie herself. Standing over the sink, fork in hand, chewing quickly.

  "Hey, Elena," Kelsey said, walking in to grab a rag. "You see that slice?"

  "No," Elena said. "Must have been a mistake."

  Kelsey shrugged and walked out.

  Elena waited for the guilt. It didn't come. Instead, she felt a different kind of warmth. The warmth of *Asserting Boundaries.*

  Wednesday night. Mike texted: *Running 5 late.*
  Elena replied: *Handle it yourself.*
  She felt that electric jolt again. *Consistency,* she thought. *I'm sticking to my guns.*

  Thursday night. A customer shorted the bill.
  Elena chased him down.
  *Stand firm,* she thought. *Don't be a pushover.*

  Friday night. The owner asked for the double.
  Elena said no.
  *Protect your time.*

  Sunday morning, Elena was scrubbing the grill. The shift was quiet. Sarah, her friend, came in for coffee. Elena told her about the breakthrough.

  "I stopped running the script," Elena said, scraping carbon off the flat top. "I realized every time I was 'being good,' I was just reacting. So I decided to stop. And it works. I'm actually making choices now."

  Sarah stirred her coffee. She looked tired. "So what do you do when someone needs help?"

  "I decide based on the situation," Elena said.

  "And how do you decide?"

  "I just... I do what feels right for me. In the moment."

  Sarah took a sip. "And if doing what feels right for you becomes the rule?"

  Elena paused. The scraper hovered over the grill.

  She thought about the pie. She hadn't eaten the pie because she was hungry. She'd eaten it to prove she wouldn't give it away.
  She thought about Mike. She hadn't covered the shift because she was tired. She'd refused because she was proving she wasn't a doormat.
  She thought about the customer. She hadn't chased the five dollars because it mattered. She'd chased it to prove she wasn't weak.

  The electric jolt she felt wasn't freedom. It was the feedback mechanism of a new program. **ASSERT DOMINANCE. PROTECT SELF. REJECT MARTYRDOM.**

  It was just a nested loop. She had stepped out of the 'Generosity' subroutine and into the 'Independence' subroutine. But the structure was identical. Stimulus arrived. Script executed. Action taken. Rationalization followed.

  "Earth to Elena," Sarah said.

  Elena looked at the grill. It was clean. Perfectly scraped.

  "Kelsey's back," Sarah nodded toward the dining room. "She looks exhausted."

  Elena felt the prompt arrive. *She needs help.*

  The old script warmed up: *Give her the break.*
  The new script warmed up: *Protect your energy. Don't be a sucker.*

  Elena stood there, scraper in hand, waiting for the feeling of choice. She waited for the moment where she could step outside both tracks and just *be*. But the silence stretched. The ticket machine chirped. A new order.

  She realized she couldn't stop the loop. She could only switch tracks. If she helped Kelsey now, it would be an act of rebellion against her new rebellion. If she didn't help, it was compliance with the new rule.

  Either way, the wasp was checking the burrow.

  "Elena?" Kelsey called from the pass. "Can you spot me on the fryer for five? My back is killing me."

  Elena opened her mouth. She knew exactly what she was going to say before she said it. She knew the justification she would use afterward. She knew the feeling it would give her.

  "Yeah," Elena said, her voice flat. "I got it."

  She walked to the fryer. She didn't do it because she was good. She didn't do it because she was free. She did it because the script had finished loading, and the only thing left to do was run.
