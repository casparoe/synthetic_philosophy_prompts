answer: |-
  # Q&A PREP SHEET: Structural-Demographic Talk

  **Strategy Overview:** You are walking a tightrope between two fires. The historians will burn you for flattening human experience; the modelers will burn you for lacking rigor. Your survival depends on framing your model not as a *law of history* (Philosopher/Historian trigger) but as a *mechanism discriminator* (Cliometric/PolSci hook) that respects contingency (Historian shield).

  ### I. The Pre-Emptive Concessions (First 2 Minutes of Q&A)
  *Do not wait for them to ask these. Volunteer them in your closing remarks or the moment the chair opens the floor. This disarms the "arrogant modeler" stereotype.*

  1.  **On "The State":** "I want to be clear: when I use the term 'state' for pre-modern polities, I am using it as a shorthand for 'fiscal-extractive coalition.' I am not claiming a 14th-century kingdom had the bureaucratic capacity of a 20th-century nation. If the model relies on Weberian bureaucracy, the model is wrong."
  2.  **On Agency:** "This model does not predict *when* a specific riot happens or *who* leads it. It predicts when the structural tension makes the system brittle enough that a contingency triggers a break. The match is the contingency; the dry grass is the structure."
  3.  **On Data:** "I do not have perfect time-series data for elite aspirants in 1350. I am working with proxies. If the proxies are fundamentally broken, the theory fails. I am arguing the *pattern* of the proxies matches the mechanism better than the population proxies do."

  ---

  ### II. The Eight Objections (Ordered by Likelihood & Damage)

  #### 1. The "Agency & Contingency" Attack
  *   **Who:** Mainstream Social/Cultural Historians (The Majority)
  *   **The Question:** "You're talking about historical actors as if they're particles in a box. You've stripped out the culture, the ideology, the specific grievances. If your model works for 1350 France and 1970s US, haven't you just defined away the actual history? What work is left for the historian to do?"
  *   **Your Reply (90s):** "I'm not trying to replace the historian's work; I'm trying to explain why the historian's actors feel trapped. When aspirant pressure is high, a moderate politician *cannot* compromise without losing their coalition. The ideology matters for *how* the conflict expresses itself, but the pressure explains *why* the conflict becomes non-negotiable. I'm not predicting the riot; I'm predicting the flammability. If you ignore the structure, you can't explain why similar crises happen across totally different cultures."
  *   **Soft Spot:** You are still privileging structure over culture. If they press on a specific case where culture *prevented* a crisis despite high pressure, you have to admit the model is probabilistic, not deterministic.

  #### 2. The "Internal Contradiction" Attack
  *   **Who:** Senior Historians + Cliometrics (The "Gotcha")
  *   **The Question:** "You spent the first ten minutes telling us that fitting a cycle to a timeline is worthless postdiction. Then you show us a slide where your 'aspirant pressure' curve matches the crisis timeline. How is this not the exact same astrology you just criticized?"
  *   **Your Reply (90s):** "Because I'm not testing the fit to the *timeline*; I'm testing the *periodicity*. The standard SDT model says the cycle length tracks population growth rates. My model says it tracks elite generation length. In Case A, population grows fast, generations are long. In Case B, population is flat, generations are short. If I'm just curve-fitting, both models should fit equally well. They don't. The generation length tracks the crisis frequency; the population growth does not. That discriminates the mechanism."
  *   **Soft Spot:** This requires the audience to follow the logic of "discriminating mechanisms" rather than "fitting curves." If they zone out, you look like you're splitting hairs.

  #### 3. The "Identification / N" Attack
  *   **Who:** Cliometric / Economic Historians (The 3 Modelers)
  *   **The Question:** "You're comparing three or four polities. Your N is tiny. You have endogeneity everywhere—crises shorten generations, generations influence crises. Where is the identification strategy? How do we know this isn't just noise?"
  *   **Your Reply (90s):** "I agree, this isn't a regression design. It's a comparative historical analysis. I'm not looking for statistical significance in a time-series; I'm looking for covariance across units. If the mechanism is real, the *ratio* of cycle length to generation length should be roughly constant across polities, even if the absolute years differ. I don't have the N for a regression, but I have enough variation in generation length to rule out the Malthusian clock. I'm asking you to judge this as a plausibility probe, not a final estimate."
  *   **Soft Spot:** You don't have the N. You are asking them to lower their statistical standards. They may refuse.

  #### 4. The "Anachronism" Attack
  *   **Who:** Early Modernists (The "1350 State" Group)
  *   **The Question:** "You're applying a category of 'credentialed elite' to a society where office was largely hereditary or purchased. 'Aspirants' implies a meritocratic bottleneck that didn't exist. Are you projecting 19th-century bureaucracy onto medieval patronage?"
  *   **Your Reply (90s):** "That's a fair worry. By 'credentialed,' I don't mean university degrees in 1350. I mean 'socially recognized qualification for office.' In some cases, that's blood; in others, it's law training; in others, it's military reputation. The bottleneck exists whenever the number of people qualified to rule exceeds the number of ruling spots. If the qualification changes, the metric changes, but the pressure mechanism remains. I need to refine the proxy for each case, but the structural gap is the same."
  *   **Soft Spot:** Your data for "qualified people" in 1350 is incredibly thin compared to 1970. You are relying on assumptions about the size of the gentry/nobility that might be contested.

  #### 5. The "University is Not a State" Attack
  *   **Who:** Everyone (The Provocation)
  *   **The Question:** "A university doesn't have a monopoly on violence. It doesn't tax. It's a voluntary association. If your theory only works when you stretch the definition of 'state' to include a university, doesn't that prove the theory doesn't actually apply to states?"
  *   **Your Reply (90s):** "Exactly. That's why I chose it. If this mechanism is about 'states' specifically, it shouldn't work in a university. If it's about *hierarchical organizations with limited top slots and a pipeline of aspirants*, it should. I'm arguing SDT isn't a theory of *states*; it's a theory of *elite competition within fiscal constraints*. If it holds in a university, it suggests the 'state' part of Structural-Demographic Theory was a category error all along. It's a feature, not a bug, that it travels."
  *   **Soft Spot:** If the PolSci pushes hard on "fiscal-military capacity," you have to admit the university lacks the 'coercive' element of state collapse.

  #### 6. The "Falsifiability" Attack
  *   **Who:** Philosopher of Science
  *   **The Question:** "You say the cycle length is a multiple of generation length. But generation length is variable. If the crisis comes early, you say 'pressure was higher.' If it comes late, you say 'generation was longer.' What observation would actually prove you wrong?"
  *   **Your Reply (90s):** "If I find a polity where elite generation length is stable, but the crisis周期 (cycle period) varies wildly without a change in fiscal capacity. Or, if I find a case where aspirant pressure is demonstrably low—plenty of offices, few aspirants—and we still get a structural crisis of regime collapse. I am risking the claim that the *ratio* should be stable. If that ratio floats freely, the model is dead."
  *   **Soft Spot:** You haven't actually calculated the error bars on that ratio yet. You're promising to do it.

  #### 7. The "Dating Error" Attack
  *   **Who:** Archaeologist
  *   **The Question:** "You're talking about cycles of 40-60 years. In settlement data, my dating error is ±30 years. In your documentary proxies, how do you distinguish a 50-year cycle from a 70-year cycle when the event dating is fuzzy?"
  *   **Your Reply (90s):** "You're right, precise dating is impossible. That's why I'm not looking at specific peaks. I'm looking at the *aggregate frequency* over 300 years. If the Malthusian model is right, we should see X cycles. If the Elite model is right, we should see Y. The noise averages out over the long run. I'm not claiming to predict the 1358 Jacquerie specifically, but the cluster of unrest in the mid-14th century."
  *   **Soft Spot:** If your case studies are short (under 200 years), the noise *doesn't* average out. You need long runs.

  #### 8. The "Fiscal Capacity" Attack
  *   **Who:** Political Scientist
  *   **The Question:** "You say it's not immiseration, it's elite competition. But elite competition only turns violent when the fiscal pie stops growing. Isn't 'aspirant pressure' just a proxy for 'fiscal stagnation'? Why do we need the elite variable at all?"
  *   **Your Reply (90s):** "Because fiscal stagnation happens often without collapse. The variable that turns stagnation into collapse is the *distribution* of that stagnation. If the elite are few, they can absorb the cut. If the elite are many, they cannibalize each other. I'm arguing the *ratio* matters more than the absolute fiscal size. A rich state with too many elites can collapse; a poor state with few elites can endure."
  *   **Soft Spot:** You need to show a case of "Rich State, High Elite Pressure, Collapse" to prove this. If all your cases are fiscal crises, you haven't separated the variables.

  ---

  ### III. The One Reply That Must Land
  **The Objection:** #2 (Internal Contradiction / Postdiction).
  **Why:** If you convince them you are doing the same "astrology" you criticized in Part 1, your credibility evaporates. The historians will roll their eyes, and the modelers will dismiss you.
  **The Key Distinction:** You must hammer home that **Timeline Fit ≠ Mechanism Fit.**
  **The Soundbite:** "Fitting the *peaks* is astrology. Fitting the *clock* is mechanics. I am not claiming to predict 2020. I am claiming that if the cycle is 50 years in one place and 30 in another, the Malthusian model fails and the Elite model holds. That is a testable discrimination, not a curve fit."

  ---

  ### IV. The "Hope Nobody Asks" Question
  **The Question:** "Okay, let's talk about the pre-modern data. You claim 'aspirant pressure' is the driver. For the US, you have PhD counts. For 14th-century France, what is your numerator? How many 'aspirants' were there, and where is that dataset?"
  **Why it's deadly:** You likely do not have a robust quantitative series for "elite aspirants" in 1350. If you admit it's a guess, the quant historians pounce. If you claim it's solid, the archival historians know you're lying.
  **Your Reply (Damage Control):** "I am using proxy measures: university matriculations, clerical ordinations, and estimates of the gentry class size from probate records. I know these are noisy. They are lower-bound estimates. That is the weakest link in the chain. I am arguing that even with this noise, the *trend* correlates with crisis frequency better than population does. I am not claiming the number is exact; I am claiming the *pressure direction* is identifiable. If better data shows the gentry class was stable during the crisis, this specific case study falls."
  *(Note: Do not bluff a specific number. Admit the proxy is rough.)*

  ---

  ### V. Consensus vs. Contested (For Your Mental Map)
  *   **Near-Consensus (Background):**
      *   Structural-Demographic Theory (SDT) exists and has proponents (Turchin, et al.).
      *   "Elite Overproduction" is a recognized concept within SDT.
      *   Pre-modern data is noisy and proxies are required.
      *   "The State" is a problematic category for pre-modern polities (you are safe conceding this).
  *   **Genuinely Contested (Your Battleground):**
      *   **Driver:** Is it popular immiseration (Malthus) or Elite Competition (Turchin/You)? *You are taking the Elite side, but modifying the clock.*
      *   **Method:** Can historical cycles be tested quantitatively, or is it always postdiction? *You are arguing it can be tested via mechanism discrimination.*
      *   **Scope:** Does this apply to non-state organizations (Universities)? *This is your provocation; there is no consensus.*
      *   **Data:** Do we have *any* reliable counts of pre-modern elite aspirants? *Highly contested. Assume skepticism.*

  ### VI. Final Tactical Advice
  *   **When interrupted:** Stop talking immediately. Let them finish. Say, "That's a crucial point," then answer. Do not fight the chair.
  *   **When you don't know:** "I don't have that number in front of me. My assumption is X, but if the archival work shows Y, I'll have to adjust the model." (The Historians will respect this honesty more than a bluff).
  *   **The "Astrology" Comment:** If someone repeats the "astrology with differential equations" line, do not get angry. Smile and say, "I hope to convince you that it's more like meteorology. We can't predict the storm, but we can measure the pressure drop."
