answer: |-
  **JOINT STATEMENT ON PHENOMENAL CHARACTER**

  **1. Agreed Claims**
  1.  **The Data:** Any adequate theory must accommodate that subjects make introspective judgments possessing a peculiar first-personal feel ("thin" phenomenal character). These judgments are predictably responsive to intervention (stimulus change, attention shifts), come in degrees of confidence, and often prompt reports of ineffability or privacy.
  2.  **The Engine of Dispute:** The primary driver of disagreement is not the hallucination argument nor the specification worry alone, but the Explanatory Gap: whether the "thin" feel necessitates the existence of irreducible properties ("thick" qualia) or whether the feel is fully explainable via functional/representational mechanisms that misrepresent themselves.
  3.  **Non-Commitments:** The Phenomenal Realist is not committed to substance dualism or the denial of physical causation. The Illusionist is not committed to denying consciousness exists *simpliciter*, only that it possesses the intrinsic, ineffable properties traditionally ascribed to it. Both agree that denying the "thick" characterization does not entail denying the existence of the subject or the judgment.

  **2. Disagreements**

  | Point at Issue | Phenomenal Realist Formulation | Illusionist Formulation | Status |
  | :--- | :--- | :--- | :--- |
  | **Existence of Qualia** | Phenomenal properties are real features of experience that escape functional/physical description. The "residue" is ontological. | "Qualia" (as ineffable/intrinsic) are incoherent posits. There are only introspective mechanisms that *represent* experience as having such properties. | Substantive |
  | **Introspective Authority** | Introspection reveals the nature of experience. While not infallible, it grants access to properties that cannot be wholly erroneous. | Introspection is a generative process prone to systematic error. It presents experience as having properties it lacks (like a visual illusion). | Substantive |
  | **Thin vs. Thick** | The "thin" feel (that there is something it is like) entails the "thick" properties (ineffability, intrinsicality). You cannot have the former without the latter. | The "thin" feel is real (as a judgment), but the "thick" properties are false overlays. The hallucination argument bites only because Realists conflate the two. | Verbal/Substantive |

  **3. Cruxes and Predictions**

  **Crux A: The Coherence of Global Error**
  *   **Question:** Can a cognitive system systematically misrepresent its own state without any underlying fact of the matter to be wrong *about*?
  *   **Agreed Case:** The Global Error Theory analogy (colors/morality). Illusionists claim introspective error is analogous to color error (no intrinsic redness, only reflectance properties).
  *   **Predictions:**
      *   *Realist:* The analogy fails. Color error presupposes a distinction between appearance and reality grounded in physical properties. Introspective error lacks this ground; if there is no phenomenal property, there is no "appearance" to be erroneous about. The analogy is a distraction.
      *   *Illusionist:* The analogy is load-bearing. Just as "redness" is a useful fiction generated by visual processing, "qualia" are useful fictions generated by introspective processing. Error is defined by the mismatch between the model (phenomenal) and the target (functional/neural).

  **Crux B: The Schmen Case**
  *   **Question:** Suppose future science identifies subjects (Schmen) whose reports track an experiential dimension while all discriminable functional/neural states remain fixed. A subsystem predicts these reports; lesioning it removes the distinction.
  *   **Agreed Case:** The hypothetical Schmen scenario as described.
  *   **Predictions:**
      *   *Realist:* The Schmen reports are veridical. They track the phenomenal residue that physical monitoring misses. This confirms the Explanatory Gap is ontological. We predict the physical monitoring is incomplete, not that the reports are false.
      *   *Illusionist:* The Schmen reports are non-veridical (or the scenario is impossible). If reports vary, there *must* be a physical/functional difference eventually discernible. We predict the "fixed" neural state claim will fail upon finer-grained analysis, or that the reports track a sub-personal variable unrelated to phenomenal truth.

  ***

  **Facilitator's Diagnosis**

  Regarding your three specific queries:

  1.  **Thin/Thick Equivocation:** This is partially verbal, but only if the Realist retreats. If the Realist insists the "thin" feel *entails* "thick" properties (ineffability, etc.), the dispute is substantive. The Illusionist denies the entailment. The hallucination argument bites the Thick claim; if the Realist concedes Thick is false but holds Thin is real and irreducible, the Illusionist will still object that "irreducible Thinness" is just Thick qualia renamed. **Verdict:** Substantive all the way down, because the Realist's "Thin" still carries ontological weight the Illusionist rejects.
  2.  **Error Parity:** The color/morality analogy is **load-bearing**. Without it, the Illusionist cannot make sense of "introspective error" without conceding there is *something* being errored about (which risks reinstating qualia). If the analogy fails, the Illusionist position collapses into incoherence.
  3.  **The Schmen Case:** This is the strongest test. The Realist sees it as vindication of the residue; the Illusionist sees it as a challenge to the "fixed neural state" premise. **Verdict:** If the scenario holds (neural state truly fixed), the Realist wins by default. If the scenario fails (neural difference found), the Illusionist wins. The dispute hinges on whether physical closure is an empirical claim or a methodological constraint.

  **Overall Diagnosis:** The dispute is **substantive**, not merely verbal. While terminological confusion (qualia vs. experience) obscures the line, the core disagreement is ontological: does the first-person perspective reveal properties irreducible to the third-person story? The Realist says yes; the Illusionist says the perspective itself is a construct of the third-person story. No amount of definitional tweaking resolves this without one side abandoning their core metaphysical commitment.
