      **By Marlene Duff, Founding Chair, Office of Precautionary Review**

      This month marks the thirtieth anniversary of the Coldspring Office of Precautionary Review. In 1995, our inaugural act was denying the Water Department's request to line our wooden mains with PolyLex-4. The decision rested on a single study linking the polymer to hepatic irregularities in Sprague-Dawley rats. Today, PolyLex-4 is standard across the state. Our wooden mains are failing. Water escapes into streets. Boil notices are frequent. Residents ask if we were wrong.

