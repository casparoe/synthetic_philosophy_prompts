      Some ask if the Office is subject to its own rules. If every action requires proof of safety, does the Office require proof? Applying the principle to the adopting of precautions produces a regress. A precautionary moratorium on precautions could never be adopted, since nobody could prove the moratorium safe. To avoid this paralysis, the Office quietly exempts itself by grandfathering. We were here before the review process began. We are the constant against which change is measured. Our existence is the baseline safety condition.

      To celebrate our thirtieth year, we are announcing an expansion of our mandate. Review will now be extended to ongoing activities as well as new ones. Existing processes will be treated as proposals filed today. This closes the loophole where old habits evade scrutiny. We understand this may halt many town functions. Halting is safer than functioning. Motion introduces variables. Stasis introduces none.

      Safety is not a destination. It is a pause. We intend to keep pausing.

