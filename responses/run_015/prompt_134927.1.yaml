      Proponents argue that thirty years of use elsewhere proves safety. We argue the opposite. Thirty years without a confirmed health incident is exactly the latency period one expects from a slow, irreversible harm. The absence of evidence is not evidence of absence. If the polymer were acutely toxic, we would know. Because we do not know, we must assume the harm is cumulative. The fact that other towns used it does not transfer the burden of proof. The burden remains on the proposer to demonstrate negative harm. They have not done this. They cite usage; we require certainty.

