      Headline: **Three Decades of Verified Safety**
      Byline: **By Marlene Duff, Founding Chair, Office of Precautionary Review**

      This month marks the thirtieth anniversary of the Coldspring Office of Precautionary Review. In 1995, our inaugural act was denying the Water Department's request to line our wooden mains with PolyLex-4. The decision rested on a single study linking the polymer to liver spots in rats. Today, PolyLex-4 is standard across the state. Our wooden mains are failing. Water escapes into streets. Boil notices are frequent. Residents ask if we were wrong.

      To ask if we were wrong is to misunderstand the mandate. A burst pipe releases water. We see the water. We fix the pipe. A polymer lining releases molecules. We do not see the molecules. We cannot fix what we cannot see. The current frequency of main breaks is not a failure of policy; it is a visible safety metric. It confirms that the threat is localized and manageable. Switching to polymer would trade visible leaks for invisible exposure. We do not trade known hazards for unknown ones.

      Proponents argue that thirty years of use elsewhere proves safety. We argue the opposite. Thirty years without a confirmed health incident is exactly the latency period one expects from a slow, irreversible harm. The absence of evidence is not evidence of absence. If the polymer were acutely toxic, we would know. Because we do not know, we must assume the harm is cumulative. The fact that other towns used it does not transfer the burden of proof. The burden remains on the proposer to demonstrate negative harm. They have not done this.

      Furthermore, the ban itself ensures we cannot be empirically dislodged. Because we prohibited the lining, we prevented the local trials that might have exonerated PolyLex-4. This is reassuring. It means our decision remains insulated from new data that could contradict it. We are protected from the risk of being proven wrong by the very restrictions we enacted.

      Harold Finch, a retired statistician, wrote to this paper last week. "If action carries risk, and inaction carries risk," he wrote, "your principle forbids every option. You end up prescribing nothing in particular." Mr. Finch is correct. The Office grants the premise. When both courses carry a threat, we do not weigh them. We simply continue whatever was happening before anyone filed anything. This provides a clear rule. It also means a precaution can never be repealed. Repeal is a fresh action. It requires proof of safety. Since safety cannot be proven to certainty, the ban stands forever. This is not a bug. It is a one-way ratchet that ensures progress never outpaces prudence.

      Some ask if the Office is subject to its own rules. If every action requires proof of safety, does the Office require proof? Applying the principle to the adopting of precautions produces a regress. A precautionary moratorium on precautions could never be adopted, since nobody could prove the moratorium safe. To avoid this paralysis, the Office quietly exempts itself by grandfathering. We were here before the review process began. We are the constant against which change is measured.

      To celebrate our thirtieth year, we are announcing an expansion of our mandate. Review will now be extended to ongoing activities as well as new ones. Existing processes will be treated as proposals filed today. This closes the loophole where old habits evade scrutiny. We understand this may halt many town functions. Halting is safer than functioning.

      Safety is not a destination. It is a pause. We intend to keep pausing.

