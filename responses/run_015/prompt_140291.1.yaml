answer: |-
  ### Part 1: Testing and Repairing the Sealed-Falsehood Rule

  Your intuition is correct: the tension between Case 2 (wrong number, right decision) and Case 3 (right number, wrong logic) is the fulcrum. Friedman's instrumentalism fails here because it treats *prediction* as the only output. In engineering, *robustness* is the output. Case 2 is robust; Case 3 is fragile.

  Here is the diagnosis of your current rule against your five cases, followed by the repaired version.

  **Diagnosis**
  *   **Case 1 (Fleet Sizing vs. Retry):** Your rule handles this well via **Regime Match**. The retry budget change creates a new regime not covered by the backtest.
  *   **Case 2 (Autoscaler Ranking):** Your rule handles this via **Decision-Invariance**. The error is monotonic; it shifts the curve but does not cross the threshold.
  *   **Case 3 (Robot Collisions):** **Weakness Identified.** You noted that Swap-Stability is vulnerable to how the "family of alternative falsehoods" is defined. If the proposer defines the swap family as "0 to 2 collisions," they pass. If the reviewer defines it as "0 to 50 collisions," they fail. Your rule lacks a constraint on *who defines the variance*.
  *   **Case 4 (Grasping Sim):** **Strength Identified.** Domain randomization is indeed Swap-Stability implemented as a distribution. The repair needs to ensure the randomization bounds *envelope reality*, not just cover a convenient mathematical space.
  *   **Case 5 (Capacity Forecast):** **Strength Identified.** Regime Match correctly flags the new customer as a regime break. The friction you feel is not logical; it is organizational. The rule says "No," but the business says "Do it." The procedure must have a valve for this.

  **The Repair**
  To fix Case 3 and tighten Case 4, you must constrain the **Swap Family**. It cannot be theoretical; it must be empirical.
  1.  **Rename Swap-Stability to Perturbation Robustness.**
  2.  **Constraint:** The perturbation range must be derived from *measured variance in the real system* (or a conservative bound thereof), not from the modeler's intuition of "what seems reasonable."
  3.  **Add a "Mechanism Hazard" clause:** If a known false assumption is structurally responsible for the output (Case 3), accuracy alone is insufficient. You must prove the accuracy survives the removal of the cancellation.

  **The Repaired Rule (The "Robustness Standard")**
  A false assumption is licensed only if:
  1.  **Perturbation Robustness:** The decision output is insensitive to replacing the false assumption with values drawn from a range defined by *measured real-world variance*.
  2.  **Regime Validity:** The validation data covers the statistical properties of the target environment (no silent extrapolation).
  3.  **Decision Safety:** The error does not flip the decision (ordering, threshold, or sign), OR the direction of the error is known and conservative.
  4.  **No Brittle Cancellations:** If accuracy relies on compensating errors, the model fails unless each error independently satisfies 1–3. Accurate predictions arising from structural cancellations are treated as *high-risk instability*, not validation.

  ---

  ### Part 2: The Model Validity Gate (Procedure)

  This is designed for a 40-minute review. It forces the conversation away from "Is this true?" to "Is this safe to use?"

  **Pre-Requisite:** The model owner must submit a **Model Scope Statement** 24 hours prior. This must state: *Intended Decision, Input Regime, and Known False Assumptions.* If this is missing, the review is cancelled.

  **The Review Checklist**

  **Gate 1: Scope Match (5 Minutes)**
  *   **Question:** Is the proposed use case identical to the Model Scope Statement's *Intended Decision*?
  *   **Pass:** Yes.
  *   **Fail:** No. (e.g., using a sizing model for timeout tuning).
  *   **Action:** If Fail, treat as a *New Model*. Proceed to Gate 2 but require full validation plan.
  *   **Judgment Call:** Is the new use case "close enough"? (e.g., sizing for p99 vs sizing for p95). *Owner argues, Reviewer decides.*

  **Gate 2: Regime Validity (10 Minutes)**
  *   **Question:** Does the validation data (backtests, load tests, pilots) cover the statistical properties of the *target* environment?
  *   **Checklist:**
      *   [ ] Arrival patterns (burstiness, correlation) match?
      *   [ ] Load magnitude matches?
      *   [ ] Environmental conditions (hardware, network, human presence) match?
  *   **Pass:** Yes, properties are covered.
  *   **Fail:** No, there is a structural break (e.g., new customer, new hardware, new workload type).
  *   **Action:** If Fail, model cannot be blessed for *factual accuracy*. It may proceed to Gate 6 (Risk Acceptance) only if no alternative exists.

  **Gate 3: Assumption Audit & Perturbation (15 Minutes)**
  *   **Question:** For each Known False Assumption, have we tested sensitivity against *measured reality*?
  *   **Checklist:**
      *   [ ] List the top 3 false assumptions (e.g., "Poisson arrivals," "No collisions").
      *   [ ] For each, define a perturbation range based on *observed data variance* (not theory).
      *   [ ] Did the *Decision Output* change materially when running within that range?
  *   **Pass:** Decision output is stable within tolerance.
  *   **Fail:** Decision output flips or is highly sensitive.
  *   **Special Check (The Case 3 Rule):** Are there two or more false assumptions that push the output in opposite directions?
      *   [ ] If Yes: Do they *both* pass the perturbation test independently?
      *   [ ] If No: **Hard Fail.** (Brittle cancellation is not allowed).
  *   **Judgment Call:** What is "materially"? *Defined by the Decision Consumer (e.g., $10k cost, 5ms latency).*

  **Gate 4: Decision Safety (5 Minutes)**
  *   **Question:** If the model is wrong, do we lose money or break the system?
  *   **Checklist:**
      *   [ ] Is the error direction known? (e.g., "This model always underestimates cost").
      *   [ ] If unknown, is there a safety margin applied? (e.g., "We add 20% buffer to the output").
  *   **Pass:** Error is conservative or bounded.
      *   **Fail:** Error is unknown and unbounded.
  *   **Action:** If Fail, requires Risk Acceptance (Gate 6).

  **Gate 5: Verdict (5 Minutes)**
  *   **Blessed:** Passes Gates 1–4. Valid for [Time Period/Scope].
  *   **Conditional:** Passes Gates 1–3, Fails 4. Requires safety margin added to output.
  *   **Escalated:** Fails Gate 2 or 4. Business need outweighs model risk. Requires Leadership Sign-off.
  *   **Rejected:** Fails Gate 3 (Brittle Cancellation or High Sensitivity).

  **Gate 6: Risk Acceptance (Escalation Path)**
  *   **Trigger:** Model is required for business decision but fails Gate 2 (Regime) or Gate 4 (Safety).
  *   **Sign-off:** Requires Director/VP level.
  *   **Requirement:** Must document the *specific risk* being accepted (e.g., "We accept 20% over-provisioning risk due to unknown workload mix").
  *   **Expiration:** This acceptance expires in [30/60/90] days.

  ---

  ### Part 3: Running the Procedure on Live Proposals

  **Proposal A: Reusing Fleet Simulator (Case 1) for Request Timeout Values**
  *   **Gate 1 (Scope Match):** **Fail.** Model Scope was "Fleet Sizing" (capacity). New use is "Timeout Tuning" (latency tail behavior).
  *   **Gate 2 (Regime):** **Fail.** Timeout sensitivity depends heavily on the tail distribution of service times. The model assumes Exponential; reality is Heavy-tailed. This was acceptable for sizing (mean load) but is critical for timeouts (tail load).
  *   **Gate 3 (Perturbation):** **Fail.** Cannot test perturbation on service time distribution without new load tests.
  *   **Verdict:** **Rejected.**
  *   **Reason:** The false assumption (Exponential service time) is structurally relevant to the new decision (Timeouts).
  *   **Sign-off:** N/A (Engineering decision).
  *   **Action:** Run new load tests to characterize tail latency before modeling.

  **Proposal B: Three-Year Commitment (Case 5) with New Customer**
  *   **Gate 1 (Scope Match):** **Pass.** Forecasting is the intended use.
  *   **Gate 2 (Regime):** **Fail.** New customer introduces a structural break in request mix. Historical backtest (8 quarters) is invalid for the future regime.
  *   **Gate 3 (Perturbation):** **Fail.** Cannot perturb "request mix" because the new mix is unknown.
  *   **Gate 4 (Decision Safety):** **Fail.** Error direction unknown. Could be massive over-provision (waste) or under-provision (outage).
  *   **Verdict:** **Escalated.**
  *   **Reason:** Business necessity ("only forecast we have") conflicts with Model Validity.
  *   **Sign-off:** **VP of Infrastructure / CFO.**
  *   **Condition:** Must apply a conservative buffer (e.g., +30% capacity) and set a 90-day review to adjust once new data arrives.

  **Proposal C: Forecast for Workload Launched Last Week (No History)**
  *   **Gate 1 (Scope Match):** **Pass.**
  *   **Gate 2 (Regime):** **Fail.** No historical data means no regime validation.
  *   **Gate 3 (Perturbation):** **Fail.** No baseline to perturb.
  *   **Gate 4 (Decision Safety):** **Conditional.** Can only pass if a safety margin is applied.
  *   **Verdict:** **Conditional.**
  *   **Reason:** Model is effectively a guess.
  *   **Sign-off:** **Director of Engineering.**
  *   **Condition:** Output must be treated as a "Lower Bound" or "Upper Bound" only, not a point estimate. Decision must be robust to a 2x error margin.

  ---

  ### Part 4: What This Procedure Cannot Do

  You asked for plain statement of limitations. Paste this into the footer of your review template.

  1.  **It Does Not Validate Truth:** Passing this procedure does not mean your assumptions are true. It means they are *safe enough for this specific decision*. A model can pass and still be physically wrong (Case 4).
  2.  **It Cannot Catch Unknown Unknowns:** This procedure manages *known* falsehoods. If there is a variable you did not model and do not know exists (e.g., a network correlation you never measured), this review will not catch it. This is why "Regime Match" requires broad validation data, not just narrow success.
  3.  **It Stops Quiet Reuse:** The procedure relies on the "Model Scope Statement." If a team reuses a model without declaring it, this procedure never runs. You must enforce the *declaration*, not just the review.
  4.  **It Shifts Risk, It Does Not Remove It:** When you Escalate (Gate 6), you are not solving the model problem. You are explicitly moving the risk from the Engineering Team to the Business Leadership. Do not let leadership sign this without explaining that they are accepting *technical debt in the form of prediction risk*.
  5.  **It Fails Without Data:** In Cases like Proposal C (no history), the procedure correctly identifies that the model provides no information value. It forces you to admit you are guessing. It will not give you a number you can trust; it will only give you a permission slip to guess with a buffer.

  **Final Note on Case 2 vs. Case 3:**
  The procedure resolves your tension.
  *   **Case 2 passes** because the error is *monotonic*. The Perturbation Check (Gate 3) shows the *ranking* doesn't flip. The error is robust.
  *   **Case 3 fails** because the accuracy is *brittle*. The "Special Check" in Gate 3 flags the compensating errors. Even if the prediction is right today, the Perturbation Check will show that a slight change in human traffic breaks the cancellation. The accuracy is not robust.

  **Instruction for your team:** "We do not review models to see if they are true. We review them to see if they are safe to bet money on."
