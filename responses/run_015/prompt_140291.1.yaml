      *   **Current Proposal:** "Sealed-Falsehood Rule" with four clauses: Swap-stability, Regime match, Decision-invariance/known direction, No free pass for compensating errors.
      *   **Task:**
          1.  Test the rule against 5 specific cases provided by the user. Repair the rule (add/delete/clarify).
          2.  Convert the repaired rule into a written procedure for a 40-minute design review (questions, gates, handoffs). Keep it engineer-friendly, acknowledging judgment calls.
          3.  Run the procedure on 3 live proposals (Fleet simulator for timeouts, 3-year commitment with new customer, New workload with no history).
          4.  State limitations (what the procedure *cannot* do).
      *   **Constraints:** No reading list/citations. Paste-ready for review template. Address the specific tension between Case 2 (wrong number, right order) and Case 3 (right number, wrong reasons/cancellation).

  2.  **Evaluate the "Sealed-Falsehood Rule" against the 5 Cases:**

      *   *Case 1 (Fleet Simulator - Exponential vs. Heavy-tailed):*
          *   Verdict 1 (Sizing): Fine. Rule supports this via Regime Match (backtested against load tests) and Decision-invariance (sizing within tolerance).
          *   Verdict 2 (Retry Budget): Not fine. Rule supports this via Regime Match (new regime = burstier than load tests).
          *   *Assessment:* Rule works well here.

      *   *Case 2 (Autoscaler - Poisson vs. Bursty):*
          *   Verdict: Acceptable (Ordering matters, absolute value doesn't).
          *   Rule Check: Decision-invariance clause covers this ("consumer... uses only an ordering"). Swap-stability holds for the *ranking* even if not the value.
          *   *Assessment:* Rule works well here.

      *   *Case 3 (Robot Twin - Collisions/Humans):*
          *   Verdict: Not acceptable (Compensating errors, regime risk).
          *   Rule Check: "No free pass for compensating errors" clause catches this. However, user notes Swap-stability might be satisfied if the "swap family" is defined narrowly (e.g., "few collisions").
          *   *Weakness:* The definition of the "swap family" is the loophole. Who defines it? If the proposer defines it narrowly, they pass. If the reviewer defines it broadly, they fail.
          *   *Repair:* Need to constrain *who* defines the swap family and *how*. It must be defined by the *environmental variance*, not the model's convenience.

      *   *Case 4 (Grasping Sim - Rigid/Frictionless):*
          *   Verdict: Acceptable (Domain Randomization).
          *   Rule Check: Swap-stability is essentially domain randomization.
          *   *Weakness:* User worries about width/centering of randomization.
          *   *Repair:* The procedure needs to require that the randomization bounds *envelope* the physical reality, not just cover a convenient range. This links back to Regime Match (physical reality is the regime).

      *   *Case 5 (Capacity Forecast - Fixed Mix):*
          *   Verdict: Want to use, but honest procedure should refuse.
          *   Rule Check: Regime Match fails (New customer = new regime).
          *   *Assessment:* Rule works, but creates tension with business pressure. This highlights the need for a "Risk Appetite" handoff.

      *   *Tension Case 2 vs. Case 3:*
          *   Case 2: Wrong value, Right Decision (Ordering). OK.
          *   Case 3: Right Value, Wrong Decision Logic (Cancellation). Not OK.
          *   *Why?* Case 2 is robust to error (monotonic). Case 3 is fragile to error (brittle cancellation).
          *   *Rule Fix:* The "No free pass for compensating errors" clause is crucial. But it needs to be stronger: *Cancellations are treated as high-risk instability.* The rule must explicitly penalize structural cancellations even if backtesting looks good.

  3.  **Repairing and Refining the Rule:**

      *   *Critique of "Swap-stability":* Too vague on "family of alternative falsehoods."
      *   *Fix:* Rename to **Perturbation Robustness**. The "family" must be derived from *observed variance in the real system*, not theoretical alternatives.
      *   *Critique of "Regime match":* Good, but needs to handle "out-of-distribution" explicitly.
      *   *Critique of "Decision-invariance":* Good.
      *   *Critique of "Compensating errors":* Needs to be a hard stop or require elevated sign-off.
      *   *Addition:* **Causal Plausibility.** Even if predictions are right, if the mechanism is known to be wrong (Case 3), it's a hidden risk. Friedman says ignore this; the Engineer says don't. I need to side with the Engineer. If the mechanism is known to be false *and* affects the output, it fails unless proven robust.
      *   *Addition:* **Explicit Scope of Validity.** Every model must have a "Valid For" statement. Reuse outside that scope triggers a full re-validation.

  4.  **Drafting the Procedure (The "Model Risk Gate"):**

      *   Needs to fit in 40 mins.
      *   Needs clear Gates (Pass/Fail/Escalate).
      *   Needs to identify Judgment Calls.
      *   Structure:
          1.  Scope & Intent (What is this for?)
          2.  Assumption Audit (What is known false?)
          3.  Robustness Check (Swap-stability/Perturbation)
          4.  Regime Check (History vs. Future)
