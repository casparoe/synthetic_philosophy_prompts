      *   *Back to 3 Groups of 6.* Group 1 & 2: Opaque. Group 3: Glossary.
      *   *Calculation:* I need to be able to calculate the Dutch Book live.
      *   *Simplification:* I will check specific coherence constraints.
          1.  $P(A) + P(\neg A) = 1$.
          2.  $P(A \land B) \leq P(A)$.
          3.  If $A \leftrightarrow B$, $P(A) = P(B)$.
          4.  If $A \to B$, $P(A) \leq P(B)$.
      *   *Penalty:* 1 token for every 1% deviation.
      *   *This is faster than constructing a full Dutch Book.* It measures *incoherence* which implies Dutch Book vulnerability.

  6.  **Debrief Structure:**
      *   Reveal the scores.
      *   Reveal the logical map.
