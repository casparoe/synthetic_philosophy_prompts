      *   *Time:* 40 mins total. 18 students.
      *   *Bookkeeping:* 18 students betting individually against the House is too slow.
      *   *Solution:* Small groups (3 groups of 6). They act as a syndicate. They agree on prices. This reduces bookkeeping to 3 entities.
      *   *Budget:* 100 tokens per group.
