      *   Game assumes they *try* to be coherent. Real agents might not care.
      *   Game doesn't capture the *suspicion* of incoherence (hedging).

  9.  **Drafting the Content:**
      *   *World:* The "Vex Engine."
      *   *Sentences:* 6 Sentences.
      *   *Group 1 (Opaque):* Natural language, idiomatic.
      *   *Group 2 (Glossary):* Formalized hints.
      *   *Instructor Key:* The logical map.
      *   *Scoring:* "Incoherence Tax."

  10. **Refining the "Trap":**
      *   Need to ensure they *actually* get Dutch booked.
      *   If I just check $P(A) + P(\neg A) = 1$, that's trivial.
      *   Need the $A \to B$ and $A \leftrightarrow C$ traps.
      *   Sentence 1: The Vex is Idle. ($I$)
      *   Sentence 2: The Vex is Active. ($A$)
      *   Sentence 3: The Vex is Idle and Active. ($I \land A$)
      *   Sentence 4: The Red Light is On. ($R$)
      *   Sentence 5: The Green Light is On. ($G$)
      *   Sentence 6: The System is Locked. ($L$)
      *   *Rules:*
          1.  $I \leftrightarrow \neg A$ (Exhaustive/Exclusive).
          2.  $R \leftrightarrow A$ (Equivalence).
          3.  $G \leftrightarrow I$ (Equivalence).
          4.  $L \leftrightarrow (R \lor G)$ (Tautology given 1, 2, 3).
          5.  $I \to L$ (Entailment).
      *   *Trap:*
