prompt: |-
  I've been reading rationalist blogs since the SSC days and one thing I feel like that corner of the internet has never really cashed out is how much we should trust anything we think we know about the distant past. Everyone's got calibration practice and base rates and Bayes for *contemporary* stuff, but then someone says "the Persians lost 20,000 men at Plataea" or "this king reigned for 40 years" and we either shrug or defer to whoever sounds most like a historian, with no numbers attached. So I've been toying with building what I half-jokingly call a reliability ledger: rows are types of claim about the ancient world (battle casualties, eclipse and omen reports, foundation dates, succession lists, population figures, "X said Y" quotations from speeches), columns are checks — does the claim have independent attestation, does it have physical corroboration, is it internally consistent, what was the text *for* (its genre, audience, and the incentive of the person who wrote it), and how many copying-steps it is from the event. The idea is to end up with rough base rates by claim-type rather than vibes. My friend thinks this is hopeless and that anything without physical corroboration is basically fan fiction; I think that's too strong, but I can't say exactly why in a way that cashes out in numbers.

  So pretend you're advising me on where to put the effort. The budget is one person, maybe ten to fifteen hours a week for a year, no institutional affiliation, no new excavations, no paywalled databases — just published translations, whatever's online, and a decent used bookshop. I'm not asking for a reading list or citations. What I want is a defended agenda: which four or five open questions in this area are most worth that year, and in what order? Some candidates I've been kicking around, so you can see the shape of what I mean and tell me which of them are worth anything: (1) corroboration inflation — two surviving sources that look independent very often aren't, because both descend from the same lost source, and I have no idea how to estimate how often that happens or by how much it should discount an apparent two-source report; (2) the selection problem — the stuff that survived is a filtered sample, and the filter correlates with what later copyists and monasteries found useful or edifying, so "no source mentions it" is much weaker evidence than it looks, but I also don't know how to make that quantitative; (3) an "expected remains" test — for a given claim, ask what other traces we'd expect if it were true and what fraction of those traces would plausibly still exist, i.e. turning corroboration into something like a likelihood ratio instead of a checkbox; (4) treating transmission like a chain of custody, where each link is a copyist with their own error rate *and* their own incentive to smooth or improve the text, and asking what that does to confidence as a function of chain length; (5) what to do with acknowledged reconstructions — I'm thinking of Thucydides more or less admitting he put plausible sentiments into his speakers' mouths rather than reporting what was said, which strikes me as a much bigger deal for how we read all ancient "quotation" than people usually treat it as.

  Tell me which of these are real questions and which are dead ends or already-solved-in-spirit, and which important one I'm not listing. But spend most of your answer defending the ordering: for each, what makes it upstream of the others (so that getting it wrong contaminates everything downstream), whether it's actually tractable for one person working from existing material versus needing a field's worth of data collection, how much it would change the numbers that actually go in the ledger versus just changing how I talk about them, and what I could notice over the next year — a digitization project, a new radiocarbon calibration, a big corpus release, an argument someone makes — that would move it up or down the list. I'd also like to know where you'd deliberately deprioritize something interesting because its answer wouldn't change much else. And if you think the whole ledger idea is misconceived — that base rates by claim-type can't be meaningfully aggregated, or that the real bottleneck is something else entirely — say so and tell me what the year should go into instead.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and the Request:**
      *   **User Profile:** Rationalist background (SSC/LW), interested in epistemology, Bayesian reasoning, calibration, and base rates. Skeptical of "vibes-based" historical trust but recognizes the friend's "everything is fan fiction" stance is too strong.
      *   **Project:** A "Reliability Ledger" for ancient history claims. Goal: Assign rough base rates/probabilities to types of claims (battle casualties, reign lengths, quotes, etc.) based on specific checks (attestation, physical corroboration, genre, transmission chain).
      *   **Constraints:** 1 person, 10-15 hours/week, 1 year. No institutional access, no new excavations. Only published translations/online/used books.
      *   **Task:** Advise on a defended agenda. Select 4-5 open questions from the user's list (or propose new ones). Order them by priority (upstream/downstream). Evaluate tractability, impact on the ledger, and potential triggers for reprioritization. Identify what to deprioritize. Challenge the premise if necessary.

  2.  **Evaluate the User's Candidate Questions:**
      *   *(1) Corroboration Inflation:* (Source criticism/stemmatics). Crucial. If two sources share a lost ancestor, they aren't independent. This directly impacts the "independent attestation" column.
      *   *(2) The Selection Problem:* (Survivorship bias). Crucial. "Argument from silence" is notoriously weak in ancient history. Affects base rates of *absence*.
      *   *(3) "Expected Remains" Test:* (Bayesian likelihoods). High value, but hard. Requires modeling preservation rates.
      *   *(4) Transmission Chain of Custody:* (Textual criticism). Important for specific texts, but maybe too granular for a general ledger?
      *   *(5) Acknowledged Reconstructions:* (Genre/Intent). Very high impact for "X said Y" claims. Thucydides is the classic example.

  3.  **Determine the Core Bottleneck/Philosophical Hurdle:**
      *   The user wants *numbers* (base rates).
      *   Ancient history rarely offers ground truth to calibrate against. We usually don't *know* the true number of Persians at Plataea to check the sources against.
      *   *Exception:* Archaeology sometimes provides ground truth (e.g., shipwrecks vs. written trade records, inscriptions vs. king lists).
      *   *Realization:* The project risks becoming a "garbage in, garbage out" Bayesian exercise if the priors are just guesses. The most valuable work isn't assigning numbers to *everything*, but finding the few places where we *can* check the sources against reality to derive empirical error rates.
      *   *Pivot:* The "Ledger" needs an empirical anchor. Without it, it's just structured skepticism. The priority should be finding the "calibration set."

  4.  **Develop the Agenda (Ordering & Defense):**

      *   **Priority 1: The Calibration Set (Addressing the "Base Rate" feasibility).**
          *   *Why:* You can't build a ledger of probabilities without knowing how often sources lie *where we can check*.
          *   *Tractability:* High. Focus on specific niches where archaeology/epigraphy meets text (e.g., Roman consular lists, Egyptian king lists vs. monuments, coinage vs. inflation claims).
          *   *Impact:* High. If sources are 80% right on dates but 10% right on casualties, the ledger needs different rows.
          *   *User's List:* This is a new angle, combining (2) and (3) but focused on *ground truth*.

      *   **Priority 2: Source Genealogy (Corroboration Inflation - User's #1).**
          *   *Why:* Independence is the engine of Bayesian updating. If sources aren't independent, you can't multiply likelihoods. This is upstream of almost everything.
          *   *Tractability:* Medium. Requires understanding stemmatics but lots of secondary lit exists (e.g., on the Alexander historians, the Synoptic Gospels, etc.).
          *   *Impact:* High. Changes the "N" in your evidence.

      *   **Priority 3: Genre & Incentive (User's #5 + part of Ledger columns).**
          *   *Why:* A panegyric has different truth conditions than a ledger. Thucydides' speeches are rhetorical, not transcript.
          *   *Tractability:* High. Literary analysis is accessible.
          *   *Impact:* High. Determines the prior probability before looking at evidence.

      *   **Priority 4: The "Expected Remains" / Preservation Model (User's #3).**
          *   *Why:* Needed to interpret silence.
          *   *Tractability:* Low/Medium. Hard to quantify preservation rates.
          *   *Decision:* Deprioritize slightly or treat as a sensitivity analysis. It's too speculative for a 1-year solo project to nail down numbers.

      *   **Priority 5: Transmission Chain (User's #4).**
          *   *Why:* Important for textual accuracy, less for factual claims about the world (usually).
          *   *Decision:* Deprioritize. Textual corruption is usually obvious (nonsense) or minor. Intentional lying (Genre/Incentive) is the bigger threat to truth than accidental copying errors.

  5.  **Refine the Argument (The "Defended Agenda"):**
      *   *Critique of the Ledger:* The idea of a single "reliability score" per claim type is risky. A battle casualty in Herodotus isn't the same as in a Roman census. Context matters more than claim type.
      *   *Pivot:* Instead of a universal ledger, build a *Calibration Protocol*. How do we estimate reliability *in this specific case*?
      *   *Ordering Logic:*
          1.  **Calibration (Ground Truth):** Can we trust sources *at all*? (Find the control group).
          2.  **Independence (Stemmatics):** Are we double-counting evidence?
          3.  **Incentive (Genre):** What was the author trying to do?
          4.  **Preservation (Silence):** How much data is missing?

  6.  **Drafting the Response (incorporating Rationalist framing):**
      *   Use terms like "ground truth," "likelihood ratios," "upstream," "trunk vs. branches."
      *   Be honest about the "Friend's" objection (it's partially right).
      *   Focus on *tractability* for a solo researcher.
      *   Highlight the "Calibration Set" as the missing piece in the user's list.

  7.  **Review against Constraints:**
      *   10-15 hrs/week? Yes, focus on secondary literature and specific case studies, not raw philology.
      *   No paywalls? Focus on open-access epigraphy databases (PHI, etc.) and standard translations.
      *   One year? Scope the "Calibration Set" to 3-4 specific historical puzzles.

  8.  **Final Polish:**
      *   Make sure to explicitly address the user's 5 candidates.
      *   Ensure the ordering is defended based on "contamination risk" (if you get independence wrong, calibration is useless).
      *   Add a "Stop Signal" (what would make you quit/pivot).

  *(Self-Correction during drafting)*: I initially thought about putting "Source Genealogy" first. But if you don't know *what* you are measuring (i.e., if you don't have a ground truth set to test the genealogy against), genealogy is just theory. Actually, for a *ledger* user, knowing *how much* sources lie is more fundamental than knowing *which* sources are related, because you can treat related sources as one data point if you suspect it. But if you don't know the base error rate, you can't start.
  *Wait, reconsider:* If I assume independence when there is none, my confidence intervals are wildly wrong. That's a mathematical error. If I assume a 10% error rate when it's 50%, that's a parameter error. Mathematical structure (Independence) is upstream of Parameter Estimation (Calibration).
  *Counter-counter:* But you can't estimate the correlation coefficient of sources without knowing the truth. So you need *some* ground truth to even analyze the correlation.
  *Resolution:* The first step is finding the "Control Group" (Ground Truth). You can't do *any* of the user's 5 points meaningfully without a subset of data where we actually know the answer. So "Finding the Control Group" is Step 0/1.

  *Revised Order:*
  1.  **The Control Group (New):** Where does archaeology/epigraphy verify text? (Essential for *any* numbers).
  2.  **Corroboration Inflation (User #1):** Structural integrity of evidence.
  3.  **Incentive/Genre (User #5):** Priors.
  4.  **Selection/Survival (User #2):** Handling silence.
  5.  **Transmission (User #4):** Deprioritize (noise vs. signal).

  Let's write this up.
answer: |-
  This is a sophisticated project, and your friend is half-right: without ground truth, you are building a calibration matrix for a thermometer you can never check against ice water or boiling water. However, he is wrong that this makes the project useless. The goal isn't to find the *true* number of Persians at Plataea; it's to estimate the *distribution of error* for claims of that type.

  If you want to cash this out in numbers rather than vibes, you cannot treat all "ancient claims" as a single class. A census figure on a stone stele has a different error profile than a battle casualty in a poetic epic. Your ledger needs to be a **hierarchical model**, not a flat spreadsheet.

  Here is the defended agenda for your 15 hours/week, ordered by upstream dependency. If you get the earlier steps wrong, the later numbers are mathematically meaningless.

  ### 1. The Control Group (New Priority)
  **The Question:** In the specific subset of ancient claims where we *do* have ground truth (via archaeology, epigraphy, or radiocarbon), what is the actual error distribution of the textual sources?
  **Why Upstream:** You cannot assign a base rate (e.g., "battle casualties are 50% inflated") without a calibration set. Currently, your ledger has no anchor. You need to find cases where Text says $X$ and Dirt says $Y$.
  **Tractability:** High. You don't need to dig. You need to read syntheses of "text vs. archaeology" conflicts.
  *   *Examples:* Roman consular fasti vs. inscriptions; Egyptian king lists vs. monumental dating; biblical chronologies vs. Assyrian eponym lists; coinage debasement vs. inflation reports.
  **Impact on Ledger:** Critical. This turns your columns from "vibes" into empirical priors. If you find that even "official" inscriptions lie about reign lengths 20% of the time, your prior for all reign lengths drops.
  **What to watch for:** New epigraphic publications (e.g., *Année Épigraphique* summaries online) or revisionist chronologies (like the Bronze Age Collapse dating debates). If a new radiocarbon study shifts a timeline by 50 years, it updates your error rate for "synchronisms."
  **Deprioritization Note:** Do not try to solve the chronology debates. Just record the *magnitude of disagreement* as a proxy for uncertainty.

  ### 2. Corroboration Inflation (Your #1)
  **The Question:** What is the effective $N$ of our sources? When two authors report the same event, what is the probability they are independent vs. copying a common lost source?
  **Why Upstream:** Bayesian updating requires independent evidence. If Source A and Source B both say "20,000 dead," but B copied A, you have $N=1$, not $N=2$. If you treat them as independent, your confidence intervals will be dangerously narrow. This is a structural error that contaminates all downstream probability calculations.
  **Tractability:** Medium. This is classical *Quellenforschung* (source criticism). Much of the legwork is done for major corpora (e.g., the Alexander Historians, the Synoptic Gospels, the Roman Republic annalists). You need to synthesize existing scholarly consensus on dependence, not discover new stemmas.
  **Impact on Ledger:** High. It changes the weight of the "Independent Attestation" column. You might create a discount factor: `Effective Sources = Sum(1 / Dependence_Cluster_Size)`.
  **What to watch for:** Digital stylometry projects. If a new AI-assisted stylistic analysis proves two "independent" texts share a fingerprint, you must update your dependence matrix.
  **Defended Ordering:** This comes after the Control Group because you need to know *how much* sources lie (Step 1) before you worry about *how many* sources you have (Step 2). But it comes before Genre because independence is a mathematical precondition for aggregating genre-based priors.

  ### 3. Incentive & Genre Priors (Your #5)
  **The Question:** How does the communicative intent of the text shift the likelihood ratio of a claim being true?
  **Why Upstream:** This sets your *prior* probability before you look at evidence. A claim in a funeral oration has a different prior than a claim in a tax ledger. Thucydides' speeches are not "lies," they are a different genre (rhetorical reconstruction) with a truth condition of "plausibility" rather than "transcription."
  **Tractability:** High. This is literary history. You can categorize texts by genre (panegyric, history, ledger, letter, drama) and assign heuristic priors based on Step 1's findings.
  **Impact on Ledger:** High. This allows you to differentiate rows. "X said Y" in a philosophical dialogue gets a low truth-value for *verbatim accuracy* but high for *conceptual alignment*. "X reigned for Y years" in a king list gets a different prior.
  **What to watch for:** Revisionist literary analysis. If a major scholar re-classifies a key text (e.g., arguing a "history" was actually "political fiction"), you must re-tag that entire row in your ledger.
  **Defended Ordering:** Downstream from Independence. Knowing an author's incentive doesn't help if you've double-counted their evidence. Upstream from Survival, because you need to know what the text *was* before modeling what survived.

  ### 4. The Selection/Survival Filter (Your #2)
  **The Question:** Given a claim type, what is the probability it would survive to the present *if true* vs. *if false*?
  **Why Upstream:** This addresses the "Argument from Silence." If no source mentions a plague, is it because it didn't happen, or because plague narratives weren't copied by monks?
  **Tractability:** Low/Medium. This is the hardest to quantify. You are modeling a complex system of decay, copying, and curation.
  **Impact on Ledger:** Moderate. It mostly affects how you handle *absence* of evidence. It prevents you from assigning high confidence to "Nothing happened" claims.
  **What to watch for:** Papyrology discoveries (e.g., Oxyrhynchus dumps). If a new cache reveals a genre of text previously thought rare, it updates your survival rates for that genre.
  **Defended Ordering:** This is downstream because you can't model survival without knowing what the original population of texts looked like (Genre/Incentive). It is also less critical for *positive* claims (which your ledger focuses on) than for negative claims.

  ### 5. Transmission Chain of Custody (Your #4)
  **The Question:** How much does the copyist chain degrade factual accuracy vs. textual accuracy?
  **Why Downstream:** Textual criticism is a mature field. We know copyists introduce errors, but they rarely invent *specific numbers* or *names* unless there is a doctrinal incentive (covered in Genre). Most transmission error is noise (random), not bias (systematic).
  **Tractability:** High, but low yield for your specific goal.
  **Impact on Ledger:** Low. For "20,000 men," a copyist error might make it "2,000" or "200,000" (obvious outliers). It rarely shifts 20,000 to 19,500. The bigger risk is intentional editing (Genre), not accidental corruption.
  **Decision:** **Deprioritize.** Spend your time here only if you are dealing with a specific text known for corruption (e.g., the text of Herodotus is relatively stable; the text of the New Testament is not). For a general ledger, treat "textual stability" as a binary check (Is there a critical edition?) rather than a variable to model.

  ---

  ### The "Stop Signal" & Alternative Path
  You asked me to challenge the premise. Here is the risk: **Aggregation might be impossible.**
  The error rate for "Persian casualties" in Herodotus (5th C. BC, Greek, oral sources) is not the same as "Persian casualties" in Plutarch (1st C. AD, Greek, book sources). If your ledger averages them, you lose the signal.

  **The Alternative Year:**
  If, after 3 months of Step 1 (Control Group), you find that ground truth is too sparse to generate even rough error bars (e.g., we only have 5 verified cases ever), **abandon the Ledger.**
  Instead, pivot to a **Case Study Method.**
  Spend the year building a full Bayesian network for *one* event (e.g., the Battle of Cannae). Map every source, every dependency, every archaeological constraint, and produce a posterior distribution for *that one event*.
  *   **Why:** This proves the *methodology* works without requiring impossible data for the whole ancient world. It produces a "white paper" on how to evaluate ancient claims, which is more valuable than a spreadsheet of guessed numbers.
  *   **Trigger:** If you cannot find 20+ instances where Text and Archaeology overlap sufficiently to calculate a variance, switch to the Case Study.

  ### Summary of the Agenda
  1.  **Months 1-3:** Build the **Control Group**. Find cases where Dirt verifies Text. Calculate the error distribution. (If this fails, pivot to Case Study).
  2.  **Months 4-6:** Map **Corroboration Inflation**. Create a dependency graph for your major sources. Determine effective $N$.
  3.  **Months 7-9:** Assign **Genre Priors**. Tag your claim types by authorial intent.
  4.  **Months 10-12:** Build the **Ledger Prototype**. Input the data. Run sensitivity analysis on the Survival Filter (Step 4). Ignore Transmission (Step 5) unless a specific text breaks.

  This approach respects your friend's skepticism (by demanding ground truth first) but validates your intuition (that structured reasoning is better than vibes). It keeps you within the budget of a solo researcher while producing something mathematically defensible.
