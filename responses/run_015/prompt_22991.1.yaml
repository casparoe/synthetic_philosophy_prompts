prompt: |-
  Ok so random question from a rabbit hole I fell into last week. I work on dependency resolution at my job, so I've been recieving a lot of partial orders and DAGs in my daily life, and someone in a thread I was reading used Zorn's lemma to prove some result about maximal acyclic subgraphs in infinite directed graphs. The proof just said: consider the set of all acyclic subgraphs, partially order them by inclusion, every chain has an upper bound, therefore by Zorn's lemma a maximal element exists. And honestly it felt like the proof was doing something to me instead of showing me something. I know the lemma is equivalent to the axiom of choice and I know I'm not supposed to care about that, but as an engineer I have this intuition that a proof should be a recipe, give me the steps and I'll run them, and Zorn's lemma is just a guarantee that something exists somewhere with no way to point at it. Is that a fair complaint, or am I missing what these existence proofs are actually buying us?

  I got even more confused when I read that the axiom of choice is independent of ZF, meaning you can't prove it from the other axioms and you can't disprove it either, and both versions of the universe are consistent. So mathematicians just... pick it? Because it's convenient? That feels like a dependancy on something we can't verify, which is the opposite of how I was taught to think about correctness.

  The question I actually want to ask is this: if Leopold Kronecker, the 19th century guy who famously refused to accept Cantor's actual infinities and dismissed that whole line of math as metaphysics, had been around to see Zorn's lemma and the axiom of choice business in the 1930s, what do you think he would have thought? Would he have rejected it outright, or is there a charitable reading where he accepts it, and does the independence result change his argument at all? I don't have a strong prior on this, so please actually steelman both sides instead of just giving me the obvious "Kronecker would hate it" answer.
