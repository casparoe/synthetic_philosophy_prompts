answer: |-
  # 1. Memorandum

  **Arithmetica Capital**
  **Annual Letter to Limited Partners**
  **Date: 31 December 2023**

  Dear Partners,

  We write to review the fund's performance against the broader growth indices and to reaffirm the structural mandate established at inception. While mark-to-market valuations continue to lag the prevailing sentiment regarding infinite substitutability, intrinsic value remains anchored to the fundamental inequality governing biological systems. We remain constructive on the thesis.

  To maintain discipline amidst volatile demographic data, the partnership agreement requires the maintenance of a Deferral Ledger. This device polices the timing of the positive check without compromising the core geometric assertion. Whenever the predicted arrival of the check is pushed back, the specific assumption doing the work must be entered, along with its expected shelf life and the residual mechanism preserved. There have now been five entries. We disclose, for the sake of transparency, that the average shelf life of recent entries is shorter than that of earlier ones, reflecting a market environment where temporary relief is increasingly mistaken for structural change.

  **Table 1: Deferral Ledger Entries**

  | Year of Letter | Date Then Predicted | Assumption Entered | Shelf Life (Years) | Residual (%) |
  | :--- | :--- | :--- | :--- | :--- |
  | 1970 | 2000 | Green Revolution Yield | 30 | 95 |
  | 1980 | 2010 | Energy Substitution | 30 | 90 |
  | 1990 | 2020 | Service Economy Decoupling | 25 | 85 |
  | 2000 | 2030 | Efficiency Gains | 20 | 80 |
  | 2010 | 2040 | Waste Sink Capacity | 15 | 75 |

  Partners often ask about the re-specification of the constraint itself. The initial prospectus cited famine. Subsequent addenda referenced energy price shocks, and most recently, waste sink saturation. We insist that the underlying inequality—a quantity growing geometrically against a ceiling that grows at best arithmetically—has never been revised, only re-expressed. The variable changes; the constraint holds.

  Regarding the twentieth century's apparent refutation, our position is unchanged. That period's escape was purchased by drawing down a one-off endowment: fossil energy, mined phosphate, and fossil groundwater. Consequently, the period usually counted as a refutation is better counted as an instance of the mechanism, a stock being spent rather than income being earned. Abundance is liquidation.^[1]

  However, the cost of carrying this position has evolved. The fund charges limited partners a premium for being right early, and that premium compounds. By our current arithmetic, the deferral liability now grows at roughly the rate the fund expects population to grow.^[2] This creates a drag on net asset value that is distinct from the thesis itself but inherent to the holding period.

  Finally, we are pleased to announce that Arithmetica Capital has merged with Prometheus Partners, a rival fund whose thesis holds that population pressure induces the innovation that relieves it. The combined book now profits whether the check arrives or is indefinitely postponed. This is described in the regulatory filing as prudent risk management.^[3] We believe this hedges the timing risk while preserving exposure to the underlying volatility of human carrying capacity.

  We thank you for your continued capital and patience.

  Sincerely,
  The General Partners

  ***

  ^[1] This accounting treatment ensures that consumption exceeding regeneration is classified as capital drawdown, preserving the integrity of the income statement.
  ^[2] See Appendix B for the compounding schedule regarding the "Early Conviction Fee."
  ^[3] The auditor notes that no single entry in the Deferral Ledger is unreasonable when viewed in isolation.

  # 2. Commentary

  This satire targets the "protective belt" surrounding a long-run scientific thesis, exaggerating how ad hoc adjustments preserve the "hard core" from empirical failure. The Deferral Ledger mocks the practice of treating failed predictions as mere timing errors, while the merger with Prometheus Partners caricatures the ultimate immunization strategy: constructing a theory that profits from any outcome, thereby empties itself of empirical content.

  A sympathetic philosopher of science would acknowledge the joke lands on the *practice* of indefinite deferral, not necessarily the Malthusian concern itself. They would agree that constantly shifting the mechanism (famine to energy to sinks) risks degenerating the thesis into a tautology. However, they might object that the satire treats the "stock depletion" argument too lightly. This argument is not merely an ad hoc defense; it is a robust ecological claim that temporary abundance via non-renewable stocks is consistent with long-run constraints. The philosopher would argue the "right but early" stance is not entirely immune to failure. It retains a condition that could go unsatisfied: if technological innovation permanently decouples welfare from resource throughput (absolute decoupling), the geometric/arithmetic inequality becomes false, not just delayed. The satire implies the fund can merge away this risk, but in reality, a world where innovation permanently outpaces depletion renders the Malthusian core false, not just hedged.
