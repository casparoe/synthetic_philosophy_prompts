answer: |-
  Your intuitions are remarkably coherent. You have effectively navigated between the Scylla of unbridled expansionism and the Charybdis of absolute preservationism. You do not need to overturn any of your six verdicts to achieve consistency; rather, they cluster neatly around a dual-axis framework.

  The unifying principle that captures your judgments is what I shall term **The Principle of Biotic Precaution and Political Contingency**.

  This principle rests on two distinct but complementary constraints on human action in space:

  1.  **Biotic Precaution:** In the physical domain, irreversible alteration of an environment is permissible only where there is high epistemic confidence that no native biotic potential (life or pre-biotic chemistry indicative of life) exists. Where biotic potential is plausible, the duty of preservation outweighs the value of expansion or scientific utility. Geological uniqueness, by contrast, does not carry the same moral weight as biotic potential.
  2.  **Political Contingency:** In the social domain, any political or legal structure imposed on a population must remain contingent upon the ongoing consent of the governed. Institutions that lock future generations into a specific governance model without the mechanism for revision constitute a form of intergenerational domination. Sovereignty cannot be claimed as private property or fixed by the founders in perpetuity.

  ### Mapping Your Verdicts

  Let us test this principle against your six cases to demonstrate its explanatory power.

  *   **Terraforming Mercury:** Passes **Biotic Precaution** (dead rock, no biosphere). The destruction of geology is permissible because your intuition weights biotic integrity over geological preservation. It does not trigger **Political Contingency** as there are no inhabitants to govern.
  *   **Europa Contamination:** Fails **Biotic Precaution**. The risk to a potential subsurface biosphere is too high. The epistemic uncertainty mandates inaction or extreme caution, rendering the contamination a moral failure regardless of scientific gain.
  *   **Generation Ship (Democratic):** Passes **Political Contingency**. Although the descendants did not consent to the voyage, the governance is revisable. They possess the agency to alter their social contract, preventing institutionalised coercion.
  *   **Generation Ship (Autocratic):** Fails **Political Contingency**. The governance is fixed by the founders. The descendants are subject to rules they cannot change, constituting intergenerational domination.
  *   **Corporate Lunar Claim:** Fails **Political Contingency**. By operating under corporate law rather than democratic oversight, the entity treats territory as private property and inhabitants (or workers) as subjects of a charter they did not write. This matches your intuition of a colonial land grab.
  *   **Seeding Barren Asteroid:** Passes **Biotic Precaution**. Safeguards ensure no native chemistry is harmed, and the absence of life permits synthetic seeding.
  *   **Seeding Ambiguous Moon:** Fails **Biotic Precaution**. The "ambiguous spectral evidence" triggers the duty of inquiry. Rushing the process violates the requirement for epistemic confidence. Regarding your uncertainty: the wrongness here is likely a hybrid. It is **reckless negligence** (procedural) that risks **biotic contamination** (substantive). It is distinct from the Europa case only in degree of certainty, not in kind.

  ### The Test Case: Embryos and AI Caretakers

  You asked for a prediction regarding a private entity launching human embryos with AI caretakers to an exoplanet, with no democratic institutions planned until the population reaches ten thousand.

  **Verdict: Ethically Impermissible.**

  This case fails the **Political Contingency** constraint more severely than the autocratic generation ship.

  1.  **Absence of Initial Consent:** In the generation ship cases, the first generation were consenting adults. Here, the very first generation (the embryos) are incapable of consent. They are effectively manufactured for a purpose.
  2.  **Locked Governance:** The stipulation that democracy is withheld until a population threshold is met creates a constitutional lock-in. The inhabitants cannot vote to introduce democracy earlier, nor can they vote to remove the AI caretakers or the private entity's oversight before the target is reached. Their political status is determined by an external algorithm and a corporate mandate, not by their own collective will.
  3.  **Private Sovereignty:** The involvement of a "private entity" implies that the ultimate authority rests with a terrestrial corporation, not the colony itself. This replicates the corporate lunar claim error but exacerbates it by removing human oversight entirely during the formative years of the society.

  Under your framework, this project treats human beings as means to the end of colonisation rather than as ends in themselves. To make this permissible, the AI's programming would need to include a "self-termination" clause triggered by the inhabitants' demand for self-governance, regardless of population size, and the private entity would need to relinquish all legal sovereignty upon the colony's establishment.

  ### Conclusion

  You do not need to drop any of your existing verdicts. Your reflective equilibrium has successfully identified that **biotic value** and **political liberty** are the two non-negotiable constraints on spacefaring civilisation, whereas geological features and corporate property rights are negotiable.

  The tension you felt regarding the "mobile vs. territorial" distinction (generation ship vs. lunar claim) is resolved by recognising that the moral wrong in both is not the location, but the **entrenchment of authority**. Whether on a ship or a moon, locking future people into a system they cannot revise is the defining feature of the coercion you find objectionable.

  Your uncertainty regarding the "Ambiguous Moon" is also resolved: it is a violation of **Biotic Precaution** born of procedural negligence. It belongs in the same category as the Europa mission, merely with a lower probability of harm, but the ethical structure remains identical.

  In short, your intuitions are robust. They suggest a vision of space colonisation that is expansionist regarding dead matter, but deeply conservative regarding life and liberty.
