answer: |-
  **Brainstorming Pass**

  *   **Rival Account 1: Subjective Intentionalism.** Meaning is the mental state of the drafters.
      *   *Predicts:* Heavy reliance on legislative history (contradicts Practice 2). Meaning might evolve if intent was dynamic (contradicts Practice 1).
      *   *Fits:* Avoiding absurdity (Practice 3a) and purposive clauses (Practice 3c).
      *   *Anomaly:* Cannot explain why committee reports are excluded while purpose clauses are accepted.
  *   **Rival Account 2: Public Meaning Textualism.** Meaning is fixed by linguistic conventions available to the public at enactment.
      *   *Predicts:* Ordinary meaning fixed at enactment (Practice 1). Exclusion of private legislative history (Practice 2).
      *   *Fits:* Notice to citizens.
      *   *Anomaly:* Struggles to explain "always speaking" (Practice 3b) without admitting meaning *does* drift. Struggles with agency deference (Practice 3d) if meaning is purely a judicial question.
  *   **Rival Account 3: Legal Pragmatism.** Meaning is whatever produces the best regulatory outcome.
      *   *Predicts:* Avoiding absurdity (Practice 3a) and updating technology (Practice 3b).
      *   *Fits:* Agency deference (Practice 3d).
      *   *Anomaly:* Cannot explain the fixed meaning constraint (Practice 1) or the exclusion of helpful history (Practice 2).
  *   **The Anomaly:** The package looks like Textualism with pragmatic safety valves. No single pure theory predicts the refusal of history (2) alongside the acceptance of purpose clauses (3c) and absurdity avoidance (3a).

  ***

  **The implicit theory**

  The package presupposes a theory of legal communication where the "speaker" is not the individual legislator but the legislative institution acting through a specific formal procedure. On this view, a statute's meaning is a function of **sentence meaning** (public linguistic conventions) rather than **speaker's meaning** (private psychological intentions). This distinguishes what the words *say* from what the authors *wanted them to say*. By fixing meaning at enactment according to ordinary usage, the theory prioritizes **public notice**: citizens must be able to rely on the public text without investigating the private thoughts of politicians.

  This presupposes a distinction between **interpretation** (ascertaining the semantic content of the text) and **construction** (deciding legal effect when语义 content runs out or leads to unacceptable outcomes). Practice (1) and (2) govern interpretation; Practice (3) largely governs construction. The theory assumes law's job is to coordinate behaviour through public standards. If meaning drifted with current usage or private intent, the coordinating function would fail. Therefore, authority resides in the enacted text because it is the only object equally accessible to the governed and the governors.

  **Strict presuppositions versus mere fits**

  The strict presupposition is that **public accessibility determines legal validity**. You cannot abandon the commitment to ordinary meaning at enactment (Practice 1) without collapsing the distinction between law and private whim. However, the refusal to consult legislative history (Practice 2) is likely a **mere fit**—an evidentiary proxy rather than a semantic necessity. The theory could tolerate history if it were reliable and public, but rejects it because it is often manipulable, contradictory, or unseen by the public. It is an institutional rule of reliability, not a truth condition of meaning.

  Similarly, the narrow-construction rule for criminal penalties (Practice 4) is not part of the theory of meaning at all. It is an independent **normative overlay** (a canon of construction) based on liberty interests. It admits that the text *might* cover the conduct semantically, but dictates that the state loses the benefit of the doubt. This confirms that the package separates semantic meaning from legal consequence.

  **Internal consistency**

  There is tension, but it is manageable if we distinguish between **concepts** and **conceptions**.
  *   **(3a) vs. (2):** Avoiding absurdity looks like consulting intent. However, it can be reconciled semantically: we presume the legislature could not *linguistically* have intended a result that defeats the statute's own operation. It is a presumption about coherent communication, not a dive into psychological history.
  *   **(3b) and the E-Scooter:** This is the critical test. Practice (1) says meaning is fixed; Practice (3b) says application evolves. The e-scooter reasoning reconciles this by treating "vehicle" as a **functional concept** (wheeled conveyance for transport) rather than a specific **conception** (1935 cars/horses). The *description* is fixed in 1935, but the *extension* of that description includes new technologies that fit the description. This assumes there is a fact of the matter about the level of generality the 1935 words carried.
  *   **(3c)/(3d) vs. (2):** This is the hardest tension. Why trust enacted purpose clauses but not committee reports? The distinction is **enactment**. A purpose clause underwent the same bicameralism and presentment as the operative text; committee reports did not. Thus, (3c) is consistent with (2). Practice (3d) (agency deference) is consistent only if we admit that "ambiguity" marks the limit of judicial interpretation. Once semantic meaning is exhausted, the question becomes one of policy allocation, where the executive has institutional competence.

  **Replacing the package**

  Abandoning this package for straightforward purposivism would shift the judicial burden from **linguistic analysis** to **historical reconstruction**. Judges would no longer ask "what do these words mean?" but "what problem was this solving?"
  *   **The Burden:** A judge must establish a singular purpose for a plural body. This requires counterfactual claims ("would the legislature have passed this if they knew about e-scooters?"). These are empirical and evaluative claims about a group mind that may not exist.
  *   **The Cost:** Textualism's rules purchase **stability and constraint** at the cost of **accuracy**. Textualism admits it might occasionally produce a result the legislature didn't specifically foresee or want (the "hard case"), but it prevents judges from substituting their own policy preferences under the guise of finding "true purpose." Purposivism gains accuracy in matching outcomes to goals but risks judicial supremacy, as judges define the "purpose" broadly enough to swallow the text.

  **Settled versus contested**

  *   **Common Ground:** Practitioners agree that the text is the starting point and that legislative history is secondary. There is consensus that criminal statutes require special caution.
  *   **Contested:**
      1.  **Determinacy:** Is there actually a single "ordinary meaning" at a specific time? Linguists argue meaning is often context-dependent and indeterminate. The practice assumes determinacy where philosophy suggests fuzziness.
      2.  **Interpretation vs. Construction:** Many argue this line is ad hoc. When a court avoids an "absurd" result, are they finding meaning or changing it? The package treats it as finding meaning; critics say it is judicial amendment.
      3.  **Constraint:** Does textualism actually constrain judges? Critics argue judges can manipulate "ordinary meaning" or the level of generality (as in the e-scooter case) to reach desired outcomes just as easily as they can manipulate "purpose."
      *   *My Contested Claim:* I claim the e-scooter reasoning is semantic (fixed concept, new extension). The strongest opposing view is that this is covert dynamic interpretation—updating the law under the guise of definition.

  **Where the practice is underdetermined**

  The practice does not settle the **normative justification** for the theory.
  1.  **Democracy vs. Rule of Law:** One could justify this package via **Legislative Supremacy** (judges shouldn't rewrite laws) or via **Rule of Law** (citizens need notice). Both justify Practice (1) and (2), but they diverge on what happens when the text fails. A supremacy view might demand strict adherence even to absurdity; a rule-of-law view might prioritize fairness.
  2.  **Nature of Concepts:** The practice assumes concepts have a "correct" level of generality (e.g., "vehicle" vs. "combustion engine"). But philosophy of language offers no metric for this. The practice works *as if* there is a fact of the matter, but the theory doesn't explain *how* we find that fact other than judicial intuition.
  3.  **Authority:** The practice treats the statute as authoritative, but doesn't explain why. Is it because of the procedure (enactment) or the content (wisdom)? The package assumes procedure, but the "absurdity" exception smuggles content back in.

  Thus, the practice is compatible with multiple underlying philosophies. It looks like public meaning originalism, but it functions like a moderated pragmatism. The behaviour is stable, but the reasons for it remain philosophically plural.
