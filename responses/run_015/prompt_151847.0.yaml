      *   **Task:** Analyze a specific package of judicial practices regarding statutory interpretation.
      *   **Input:** A description of four specific practices (ordinary meaning fixed at enactment, exclusion of legislative history, avoidance of absurdity/always-speaking doctrine/purpose statements/agency deference, narrow construction of criminal statutes) and a concrete example (1935 "vehicle" by-law vs. e-scooters).
      *   **Output Structure:**
          1.  Short brainstorming pass (rival accounts, predictions, anomalies).
          2.  Worked-out answer under specific headings:
              *   The implicit theory.
              *   Strict presuppositions versus mere fits.
              *   Internal consistency.
              *   Replacing the package.
              *   Settled versus contested.
              *   Where the practice is underdetermined.
      *   **Constraints:** No citations (cases, statutes, literature), 1000-1500 words for the main memo (plus brainstorming), serious tone.

  2.  **Brainstorming Pass:**
      *   *Rival Accounts:*
          1.  **Original Public Meaning Textualism:** Meaning is fixed by linguistic conventions at enactment. Speaker intention (legislators) is irrelevant or inaccessible. Law is public notice.
          2.  **Purposivism/Intentionalism:** Meaning is determined by the goal the legislature sought to achieve. Text is evidence of purpose. Legislative history is crucial.
          3.  **Legal Pragmatism/Realism:** Meaning is what works best now. Text is a constraint but not the sole driver.
      *   *Predictions:*
          *   Textualism predicts (1) and (2) strongly. It struggles with (3a) (absurdity) and (3b) (always speaking) unless framed as semantic context.
          *   Purposivism predicts (3a), (3b), (3c) well. It struggles with (2) (excluding history) and (1) (fixed meaning).
          *   The Package seems to be a hybrid: Textualist core with pragmatic safety valves.
      *   *Anomalies:*
          *   Why exclude committee reports (2) but accept purpose clauses (3c)? Both are evidence of intent.
          *   Why fixed meaning (1) but "always speaking" (3b)?
          *   Why narrow construction for criminal law (4)? That's a normative rule, not a semantic one.

  3.  **Drafting - Section by Section:**

      *   **Brainstorming:** Keep it tight. Sketch Textualism vs. Purposivism vs. Hybrid. Note the tension between fixed meaning and evolving application.
      *   **The Implicit Theory:** Needs to articulate a view of law as public communication. The "speaker" is the institution, not the individuals. Meaning is conventional (sentence meaning), not psychological (speaker's meaning). Authority derives from the enacted text because that's what citizens can access.
      *   **Strict Presuppositions vs. Mere Fits:**
          *   Strict: Public accessibility, fixed conventional meaning at enactment.
          *   Fit: Exclusion of legislative history (could be evidentiary reliability, not semantic necessity). Narrow construction (normative overlay, not semantic).
      *   **Internal Consistency:**
          *   (3a) Absurdity: Tension with (2). Justification: Legislature couldn't *linguistically* have meant the absurd result (semantic argument) vs. normative override.
          *   (3b) Always Speaking: Compatible if concepts are functional rather than specific. "Vehicle" = function, not 1935 tech.
          *   (3c)/(3d) vs (2): Enacted text (purpose clause) vs. Unenacted history. Agency deference is about institutional competence, not meaning.
      *   **Replacing the Package (Purposivism):**
          *   Shift from "what does it say" to "what was the aim."
          *   Burden: Reconstructing collective intent of a plural body. Counterfactuals ("would they have passed this?").
          *   Cost: Textualism sacrifices accuracy (sometimes misses true intent) for stability and constraint.
      *   **Settled vs. Contested:**
          *   Settled: Text is primary. History is secondary/controversial.
          *   Contested: Whether "ordinary meaning" is determinate. Whether the interpretation/construction distinction holds.
          *   My contested claim: That the "always speaking" doctrine is semantic rather than normative.
      *   **Underdetermination:**
          *   Practice doesn't tell us *why* we do it. Is it democracy? Rule of law? Efficiency? Different philosophies justify the same rules.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Word Count Check:* Need to ensure the main body hits 1000-1500 words. The brainstorming is extra.
