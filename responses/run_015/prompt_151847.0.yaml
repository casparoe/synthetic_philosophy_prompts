      *   *Focus:* Ensure I address the "e-scooter" example in the consistency section.
      *   *Clarification on (3d):* Agency deference is tricky for textualism. I need to frame it as resolving ambiguity *after* meaning is exhausted (construction zone).

  5.  **Drafting the Content:**

      *   *Brainstorming:* Keep it distinct.
      *   *Implicit Theory:* Focus on "Public Meaning Originalism" roughly. Law as a communicative act from institution to citizen.
      *   *Strict vs. Fit:* Distinguish semantics from canons of construction.
      *   *Consistency:* Tackle the "vehicle" example hard. Is "vehicle" a concept or a list?
      *   *Replacing:* Contrast the epistemic burden.
      *   *Settled/Contested:* Be honest about the indeterminacy of language.
