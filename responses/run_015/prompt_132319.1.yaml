answer: |-
  # The Predictive Regularity Taxonomy Instrument

  **Instructions:** Proceed through the questions in order. Answer based on your intuition regarding large-scale systems (e.g., climate simulations, large language models, or economic forecasts). Follow the branching path indicated by your responses to arrive at your philosophical commitment profile.

  ---

  ### **ROOT NODE**
  **Question 1:** If a system exhibits stable, long-term predictive regularities, is that predictive success *alone* sufficient to say the patterns are real, even if we do not understand the underlying mechanism?
  *   **NO:** (Predictive success is not enough; something else is required.) → *Go to Question 2A.*
  *   **YES:** (Predictive success is enough.) → *Go to Question 2B.*

  ---

  ### **BRANCH A (Predictive Success is NOT Sufficient)**

  **Question 2A:** For a pattern to be real, must it be strictly instantiable by fundamental physical laws?
  *   **YES:** → **TERMINAL NODE 1: Causal-Mechanistic Realist**
  *   **NO:** → *Go to Question 3A.*

  **Question 3A:** If physical laws are not required, can the system's engineered design or functional organization substitute as the ground for reality?
  *   **YES:** → **TERMINAL NODE 2: Functional-Structure Realist**
  *   **NO:** → *Go to Question 4A.*

  **Question 4A:** To validate the pattern's reality, is adopting an intentional stance (treating the system as having beliefs or goals) required, or is such attribution categorically inappropriate for non-biological artifacts?
  *   **REQUIRED:** → **TERMINAL NODE 3: Phenomenological Pattern Realist** *[FLAGGED AS THEORETICALLY VACANT]*
  *   **INAPPROPRIATE:** → **TERMINAL NODE 4: Full Eliminativist about Synthetic Patterns**

  ---

  ### **BRANCH B (Predictive Success IS Sufficient)**

  **Question 2B:** Even if prediction is sufficient, is physical-law instantiation still *necessary* for such reality (i.e., can a pattern be real if it violates or ignores physics)?
  *   **YES:** → **TERMINAL NODE 5: Physical-Grounded Realist**
  *   **NO:** → *Go to Question 3B.*

  **Question 3B:** If physical grounding is not necessary, can design-level functional organization substitute for it (i.e., does the system need a purpose to have real patterns)?
  *   **YES:** → **TERMINAL NODE 6: Design-Stance Realist**
  *   **NO:** → *Go to Question 4B.*

  **Question 4B:** Is adopting an intentional stance required to complete the explanation, or is it categorically inappropriate for non-biological artifacts?
  *   **REQUIRED:** → **TERMINAL NODE 7: Intentional-Stance Pluralist**
  *   **INAPPROPRIATE:** → **TERMINAL NODE 8: Black-Box Empiricist**

  ---

  ### **TERMINAL NODE PROFILES**

  **1. Causal-Mechanistic Realist**
  *   **Commitment:** Predictive success counts for nothing unless the pattern reduces to micro-physical interactions.
  *   **Most Awkward Commitment:** This forces the denial of macroeconomic cycles or ecological shifts as "real" until they are fully reduced to particle physics.

  **2. Functional-Structure Realist**
  *   **Commitment:** Patterns are real if they serve a function or design role, even without physical reduction.
  *   **Most Awkward Commitment:** This grants reality to patterns in engineered software while denying identical patterns in naturally evolved systems.

  **3. Phenomenological Pattern Realist** *[FLAGGED AS THEORETICALLY VACANT]*
  *   **Commitment:** Patterns become real only through the observer's attribution of intentionality, independent of prediction or physics.
  *   **Diagnosis of Vacancy:** **Unattractiveness/Incoherence.** This position implies patterns are constituted solely by the observer's mindset without predictive payoff, rendering the "reality" causally inert and solipsistic.
  *   **Most Awkward Commitment:** This concedes that patterns would cease to exist if no observer were present to attribute goals to the system.

  **4. Full Eliminativist about Synthetic Patterns**
  *   **Commitment:** Neither prediction, physics, design, nor intention grants reality to patterns in synthetic systems.
  *   **Most Awkward Commitment:** This requires asserting that a climate model's forecast of a hurricane describes nothing real, even if the hurricane subsequently destroys a city.

  **5. Physical-Grounded Realist**
  *   **Commitment:** Prediction validates reality, but only if the pattern is anchored in physical law.
  *   **Most Awkward Commitment:** This forces the acceptance that two systems running the same software on different hardware host numerically distinct patterns rather than one shared pattern.

  **6. Design-Stance Realist**
  *   **Commitment:** Prediction validates reality, provided the system has a functional design architecture.
