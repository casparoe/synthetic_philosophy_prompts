prompt: |-
  hey so im on student council and we're rewriting the school rules this year and we keep going in circles about the same thing. Someone brought up this idea from psychology that whole societies can be described as tight (lots of rules, strong punishment, people get judged for small stuff) or loose (fewer rules, way more tolerance for weird behavior), and now everyone on the council is using the words to mean whatever helps their argument.

  So can you actually put numbers on it? For phones in class, dress code, bathroom passes, late work and extensions, cheating on tests, slurs and language in the hallways, and noise in the library — give each a tightness score from 0 to 10, where 10 is one clear rule with real consequences that actually gets enforced and 0 is basically anything goes. One sentence on why each lands where it does.

  I also have a theory im not confident about: that tightness should track how much one person messing around wrecks things for other people, not how much it annoys teachers or makes the school look bad to parents. Use it if you think its roughly right, but tell me if its wrong or missing something big.

  And here's the thing that keeps derailing our meetings: our school is super tight on paper but teachers only enforce maybe half of it, and everybody knows which half. Is that a tight school or a loose one? Like, should we be scoring what's written down or what actually happens to you when you break it? That feels like it changes the whole answer and nobody knows what to do with it.
