  8.  **Final Polish:** Check for clarity, ensure all parts of the prompt are addressed (Theory presupposed? Coherent? Changes based on IIT/GWT?). *Self-correction: Make sure to explicitly mention the "Precautionary Principle" as the emerging legal theory.*

