answer: |-
  # The Belief Attribution Decision Tree
  **Start:** *Does this model believe that $p$?*  
  **Instruction:** *Do not define "belief." Answer the case-based questions below. Your path determines your philosophical position.*

  ---

  ### 1. The Baseline Case: Thermostat vs. Chess
  **A thermostat reliably maintains 20°C. A chess program reliably protects its queen.**  
  **Q:** Does the thermostat "believe" it is 20°C in the same sense the program "believes" the queen is attacked?
  *   **NO (Belief is rare/special):** $\rightarrow$ Go to **2. The History Case**.
  *   **YES (Belief is common/predictive):** $\rightarrow$ Go to **3. The Causation Case**.

  ---

  ### 2. The History Case: Flat-Earth Fine-Tuning
  **A model is fine-tuned *only* on Flat-Earth text. It reliably outputs "The Earth is flat."**  
  **Q:** Does it believe the Earth is flat, despite having no contact with reality/truth?
  *   **NO (Requires proper function/truth-connection):** $\rightarrow$ Go to **4. The Error Case**.
  *   **YES (Current structure suffices):** $\rightarrow$ Go to **3. The Causation Case**. *(Note: This path merges with the Liberal view)*.

  ---

  ### 3. The Causation Case: Post-Hoc Rationalization
  **The model's Chain-of-Thought is fluent and consistent, but ablation shows it has *no causal influence* on the final answer (it's post-hoc).**  
  **Q:** Does the reasoning express a belief, even if it didn't cause the action?
  *   **NO (Belief must be causally efficacious):** $\rightarrow$ **CAUSAL-ROLE FUNCTIONALISM**  
      *(Belief is an internal state playing the right causal role between input and output.)*
  *   **YES (Predictive utility suffices):** $\rightarrow$ Go to **5. The Location Case**.

  ---

  ### 4. The Error Case: Capacity for Revision
  **A system outputs $p$ reliably but lacks the architecture to detect error or revise (e.g., a lookup table).**  
  **Q:** Is the capacity to be wrong and revise necessary for belief?
  *   **NO:** $\rightarrow$ **ELIMINATIVISM**  
      *(Nothing here qualifies as belief; "belief" is a folk-psychological error.)*
  *   **YES:** $\rightarrow$ **TELEOSEMANTICS / TRAINING-HISTORY**  
      *(Belief requires a history of selection/training designed for truth-tracking.)*

  ---

  ### 5. The Location Case: Internal Encoding vs. Safety Behavior
  **Probes find $p$ encoded internally (and it would say $p$ absent safety tuning), but the model behaves as if $\neg p$.**  
  **Q:** Where is the belief located?
  *   **IN THE BEHAVIOR (Public coherence wins):** $\rightarrow$ **DAVIDSONIAN INTERPRETATIONISM**  
      *(Belief is fixed by the principle of charity over the whole system's coherent actions.)*
  *   **IN THE INTERNAL STATE (Hidden structure wins):** $\rightarrow$ Go to **6. The Ontology Case**.

  ---

  ### 6. The Ontology Case: Real Pattern vs. Useful Fiction
  **You attribute belief because it predicts behavior well. Is this attribution literally true?**
  *   **NO (It is a useful fiction):** $\rightarrow$ **AS-IF FICTIONALISM**  
      *(Talk of belief is instrumentally useful but ontologically false.)*
  *   **YES (It describes a real abstraction):** $\rightarrow$ **DENNETT / REAL-PATTERNS** ⚠️  
      *(Beliefs are real patterns discoverable from the intentional stance.)*

  ---

  ### 🚩 Critical Notes for Seminar Discussion

  **1. The Empty Cell (Unoccupied Space)**  
  *Path:* Thermostat **NO** $\rightarrow$ Flat Earth **YES** $\rightarrow$ Internal/Behavior **BEHAVIOR**.  
  *Position:* **Behaviorism.**  
  *Status:* **Unattractive/Abandoned.**  
  *Why:* Few philosophers today accept that structure suffices for belief (Flat Earth YES) but deny that internal encodings matter (Internal NO). This view struggles to explain how probes predict behavior better than output alone.

  **2. The Indistinguishable Leaves**  
  *Positions:* **Dennett-flavoured Instrumentalism** vs. **Real-Patterns/"Mild Realist"**.  
  *Problem:* This tree cannot separate them. Both agree belief is real *if* the intentional stance works.  
  *Required Case:* **A "Real but Useless" Pattern.**  
  *Why:* To separate them, you need a case where a belief-like pattern exists ontologically (Real Patterns = YES) but offers *no* predictive advantage (Dennett = NO). If no such case exists, the positions are extensionally equivalent.

  **3. The Load-Bearing Disagreement**  
  Notice that no branch asks "What is belief?" Disagreements arise at **Node 1** (How liberal is the concept?) and **Node 5** (Does hidden structure count?). Your position is defined by which cases you treat as decisive.
