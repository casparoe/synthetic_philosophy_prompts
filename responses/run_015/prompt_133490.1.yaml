answer: |-
  The 1945 exposure of Han van Meegeren's forgery, *The Supper at Emmaus*, serves as a potent empirical stress test for the philosophical dichotomy between **origin-value** (the claim that an artwork's status and worth depend on its causal history, authorship, and context) and **experience-value** (the claim that value resides solely in perceptible properties and the viewer's aesthetic experience). The episode reveals that while perceptual qualities may secure initial admiration, the revelation of origin fundamentally alters the artwork's identity and value, suggesting that aesthetic experience is not hermetically sealed from historical knowledge.

  ### Mapping the Episode: Parties, Incentives, and Collapse

  The drama involved four distinct clusters of actors, each driven by competing incentives that hinged on the work's authenticity. **Han van Meegeren**, the forger, sought financial gain and vindication against critics who had dismissed his original work. His incentive shifted from maintaining the deception to preserving his liberty; when charged with treason for selling a "national treasure" to the Nazis, he confessed to forgery to reduce the crime from collaboration to fraud. **Abraham Bredius**, the preeminent art historian, authenticated the work in 1937. His incentive was the consolidation of his expertise and the prestige of discovering a lost Vermeer. **Hermann Göring**, the buyer, prized the painting not merely for its visual beauty but as a trophy of cultural dominance; possessing a Vermeer conferred status that a pastiche could not. Finally, the **Dutch authorities and public** initially viewed van Meegeren as a traitor. However, upon his confession, the public's incentive shifted to nationalistic pride; the forger was re-cast as a folk hero who had duped the Nazi elite with a fake Dutch master.

  When the forgery was revealed, a total collapse occurred across multiple domains. **Market price** evaporated; the work was no longer a Vermeer but a curiosity. **Aesthetic admiration** was retroactively downgraded from "genius" to "craftsmanship." **Legal status** shifted from high treason to fraud. **National pride** inverted from shame (selling heritage) to celebration (outwitting the enemy). This multidimensional collapse suggests that the object's properties remained constant, but its *identity* did not.

  ### Applying the Theoretical Framework

  The **origin-value** framework explains the episode's trajectory most robustly. Bredius's initial authentication seems credible only because he assumed the causal history matched the perceptual style. He operated under the assumption that the "Vermeer-like" qualities were caused by Vermeer's hand. When the causal chain was broken (revealed to be van Meegeren's hand in the 1930s), the work lost its art-historical status. Göring's prized possession was valuable specifically because of its *provenance*; a copy, no matter how perfect, lacks the historical weight of a 17th-century artifact surviving WWII. The public outrage (and subsequent fascination) confirms that the aesthetic experience is not isolated. If **experience-value** were paramount, the revelation of the forgery should have resulted in indifference—the paint on the canvas remained unchanged. Instead, the knowledge of the origin contaminated the experience, rendering the work "dead" as a Vermeer and "alive" only as a forgery.

  ### Points of Silence and Breakdown

  However, the framework encounters friction when examining the scientific and ethical dimensions. First, the **scientific detection** of modern synthetic binding media (phenol-formaldehyde resins) and anachronistic pigments complicates the "perceptible properties" argument. If the forgery required baking to harden the paint, creating a microscopic texture distinct from 17th-century drying, was it truly aesthetically indistinguishable? An experience-value proponent might argue the work was never perceptually identical under close inspection, meaning the value drop was due to perceptible flaws, not just historical knowledge. Conversely, if the forgery was visually indistinguishable to the naked eye, science serves only as a proxy for history, supporting the origin-value thesis.

  Second, van Meegeren's **courtroom demonstration**, where he painted a new forgery (*Christ and the Adulteress*), challenges the distinction between technical skill and artistic achievement. He proved he could replicate the *experience* of Vermeer at will. Does this support aesthetic indistinguishability? Or does it confirm that without the historical context of the 17th century, the work is merely mimicry? The theory struggles to categorize the *demonstration piece*: it is an original van Meegeren, but its aesthetic goal is to be a Vermeer.

  Third, the **nationalist reaction** introduces a confounding variable. The Dutch public celebrated van Meegeren not because the painting was beautiful, but because it was a weapon against Göring. This suggests that ethical and political values were conflated with aesthetic ones. The framework, which often isolates aesthetic judgment, is silent on how moral victory can rehabilitate a forger's reputation without changing the canvas.

  ### Conclusion: What the Episode Demonstrates

  Ultimately, the Van Meegeren episode functions as a strong validation for **origin-value**. The sharp drop in value upon discovery confirms that origin is aesthetically relevant because our appreciation of art is narrative-dependent. We do not just see shapes and colors; we see human achievements situated in history. However, the episode also reveals that markets and moral norms penalize deception regardless of appearance. The "value" that collapsed was a hybrid of aesthetic, financial, and moral worth. The unresolved tension remains whether the aesthetic experience *itself* changed, or only the *attitude* toward the object. If the former, origin is constitutive of aesthetics. If the latter, aesthetics remain pure, but are overshadowed by ethical context. The Van Meegeren case suggests the former: knowing the history changes what we see.

