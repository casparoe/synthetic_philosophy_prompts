prompt: |-
  Analyze the 1945 exposure of Han van Meegeren's forged Vermeer-style biblical scene—sold in 1943 to Hermann Göring and initially authenticated by the art historian Abraham Bredius—as a test case for the philosophical dispute over whether an original artwork's value derives primarily from its causal history and authorship (origin-value) or only from its perceptible properties and the experience it produces (experience-value). Map the episode with discipline: identify the key parties (van Meegeren, Bredius, Göring, the Dutch authorities who prosecuted him for collaboration, the public that celebrated the exposure), the options and incentives each faced, and what exactly collapsed when the forgery was revealed—market price, aesthetic admiration, legal status, national pride, or all of these together. Apply the theoretical framework to explain why Bredius's initial authentication seemed credible, why Göring prized possession of the work, and why the revelation produced outrage rather than indifference. Then identify where the framework is silent or breaks: does the scientific detection of modern synthetic binding media and anachronistic pigments show that the forgery was never aesthetically equivalent, or does it merely provide an empirical method for detecting fraud without touching aesthetic judgment? Does van Meegeren's demonstration of painting in Vermeer's style during legal proceedings support the claim of aesthetic indistinguishability, or does it confuse technical skill with artistic achievement? Does the fact that the Dutch public treated the exposure partly as a patriotic victory over Göring mean that ethical and nationalist values were always confounded with aesthetic ones? Finally, state what the episode demonstrates about the theory itself: does the sharp drop in value upon discovery confirm that origin is aesthetically relevant, or does it only show that markets and moral norms penalize deception regardless of appearance? After your prose analysis, provide a brief structured summary as a JSON object with exactly these fields: 'episode_summary', 'parties_and_incentives', 'theory_applied', 'explanatory_successes', 'points_of_silence_or_breakdown', 'episode_as_theory_test', and 'unresolved_tension'.
reasoning: |-
  Here's a thinking process that leads to the desired output:

  1.  **Analyze the Request:**
      *   **Topic:** The 1945 exposure of Han van Meegeren's forgery (*The Supper at Emmaus*, sold to Göring, authenticated by Bredius).
      *   **Philosophical Core:** The dispute between "origin-value" (causal history/authorship matters) vs. "experience-value" (perceptible properties/experience matter).
      *   **Requirements:**
          *   Map the episode (parties, incentives, what collapsed).
          *   Apply the theoretical framework (explain authentication, Göring's prize, public outrage).
          *   Identify framework limitations (scientific detection, van Meegeren's demo, nationalist/ethical confounding).
          *   State what the episode demonstrates about the theory (origin relevance vs. market/moral penalty).
          *   **Output Format:** Prose analysis followed by a specific JSON object with 7 required fields.

  2.  **Deconstruct the Philosophical Framework:**
      *   *Origin-Value (Contextualism/Historical Definition of Art):* Associated with philosophers like Arthur Danto, George Dickie, or Jerrold Levinson. Art status and value depend on the correct history of production (who made it, when, why). A forgery lacks the correct causal link to the art historical narrative.
      *   *Experience-Value (Formalism/Aesthetic Empiricism):* Associated with Clive Bell ("significant form") or strict aesthetic empiricists. If it looks the same and feels the same, it *is* the same aesthetically. The physical object holds the value, not the biography.

  3.  **Map the Episode (Historical Facts):**
      *   *Work:* *The Supper at Emmaus* (painted 1937, sold 1937, exposed 1945).
      *   *Han van Meegeren:* Forger. Motive: Money, spite against critics who rejected his original work. Incentive: Maintain the lie to avoid fraud charges (initially) and collaboration charges (later).
      *   *Abraham Bredius:* Art Historian. Motive: Prestige, finding a "lost master." Incentive: Validate his expertise.
      *   *Hermann Göring:* Nazi Collector. Motive: Possessing supreme cultural capital. Incentive: Display power and taste.
      *   *Dutch Authorities:* Motive: Prosecute collaboration (selling national treasure to Nazis). Incentive: Justice, reclaiming heritage.
      *   *The Public:* Motive: National pride (tricking the Nazis). Incentive: Re-evaluating van Meegeren from traitor to folk hero.
      *   *What Collapsed:* Market price (plummeted), Legal status (fraud/collaboration -> confession of forgery to reduce charge), Aesthetic admiration (re-contextualized as craft, not genius), National pride (shifted from shame to cunning victory).

  4.  **Drafting the Prose Analysis (Iterative Process):**

      *   *Introduction:* Set the stage. 1945, Van Meegeren, *Emmaus*, the philosophical clash.
      *   *Mapping the Parties:* Detail Bredius (expertise), Göring (prestige), Van Meegeren (survival/profit), Authorities/Public (justice/pride).
      *   *Applying the Theory:*
          *   *Bredius:* Why did he believe? Origin-value suggests he *should* have cared about provenance, but he relied on *experience-value* (it looked like Vermeer) while assuming the *origin* was correct. The theory explains his error: he conflated perceptual match with historical truth.
          *   *Göring:* Why prize it? Origin-value. It wasn't just a pretty picture; it was a *Vermeer*. Possessing the origin conferred status.
          *   *Outrage:* Why not indifference? If experience-value ruled, knowing it was fake shouldn't change the visual experience. The outrage confirms Origin-Value. The "spell" was broken by knowledge of history.
      *   *Framework Limitations (Silence/Breakdown):*
          *   *Science:* Bakelite/resins. Does this mean it *looked* different under UV? If so, Experience-Value proponents could argue it wasn't perceptually identical *in all conditions*. Or, does science just prove history without changing aesthetics?
          *   *The Demo:* Van Meegeren painted a *Christ and the Adulteress* in court. He showed technical skill. Does skill = art? Origin theorists say no (it's pastiche). Experience theorists might say yes (it looks good).
          *   *Nationalism/Ethics:* The public loved him for tricking Göring. This mixes ethical/national value with aesthetic value. The theory often isolates aesthetics, but real life doesn't.
      *   *Conclusion on Theory:* Does the value drop prove Origin-Value? Or just that we hate liars? It suggests that *artistic* value is inextricably linked to *historical* narrative. The market penalizes deception, but the *aesthetic* experience itself changes once the history is known (Danto's "artworld").

  5.  **Refining the JSON Structure:**
