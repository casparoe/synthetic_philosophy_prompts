      *   *Check:* Is the Genetic Code a Skyhook? Dennett would say no. It's a product of early evolution (cranes) that froze. But the *specific* assignment (UUC = Phe) is arbitrary. It's a "frozen crane" or a "historical boundary condition."
      *   *Check:* The Low-Entropy Initial Condition of the Universe. This is the ultimate Boundary Condition. Dennett might call this the "ultimate crane" (cosmic evolution) or admit it's outside his scope. I need to be careful here. The prompt asks about the *distinction* doing work.
      *   *Key Insight:* In physics, Boundary Conditions are external to the Theory. In biology, "History" is internal to the Explanation. This is the friction point.

  10. **Final Structure:**
