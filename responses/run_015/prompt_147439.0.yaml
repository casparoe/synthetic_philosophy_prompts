answer: |-
  Here is the principle, repaired and formalized, followed by its application to your cases, the specific verdict on your daughter, and a counter-intuitive implication.

  ### The Principle: Temporal Solvency

  **Core Statement:** You are not maximizing utility across a ensemble of parallel worlds; you are maximizing the duration and quality of your agency in a single timeline. Risk is not a cost to be averaged, but a threat to your continued ability to play the game.

  **The Clauses:**

  1.  **The Absorbing State Constraint (Confidence: 95%):** Any outcome that terminates your agency (ruin, death, irreversible loss of capacity) cannot be compensated by gains in other branches. If a risk compounds over time, the probability of ruin approaches 1.0, regardless of expected value.
  2.  **The Agency Discount (Confidence: 90%):** Risks chosen with full information and control (consent) are priced at their statistical cost. Risks imposed without consent or capacity to mitigate are priced with a heavy penalty, reflecting the loss of optionality to respond.
  3.  **The Correlation Penalty (Confidence: 85%):** Risks that correlate with your background capacity to recover (systemic risks) are priced higher than idiosyncratic risks, because they destroy the very mechanism (insurance, community, economy) you would use to survive the loss.
  4.  **The Model Reliability Threshold (Confidence: 70%):** Probabilities derived from models rather than frequencies are discounted by the likelihood of model error. If the stated probability is lower than your estimate of model error, the expected value is treated as zero.

  ---

  ### Application to Your Verdicts

  **1. Personal $50k vs. Coinflip ($0/$120k)**
  *   **Verdict:** Take the $50k.
  *   **Principle:** **Absorbing State Constraint.** For an individual, $50k is often near a "security floor." Dropping to $0 threatens your solvency (ability to pay rent, eat, function). The utility isn't curved; the *consequence* is binary (solvent vs. insolvent). You pay the premium to stay in the game.
  *   **Status:** Saved.

  **2. Nonprofit Budget $50k vs. Coinflip**
  *   **Verdict:** Take the Gamble.
  *   **Principle:** **Agency Discount.** It is not your money. The "ruin" state for a line item in a grants budget is not an absorbing state for *you*. You have high agency to absorb the loss without terminating your own timeline.
  *   **Status:** Saved. (This explains the inconsistency: the "ruin" threshold is different).

  **3. 1% Chance at $10M vs. $80k Certain**
  *   **Verdict:** Take the Gamble.
  *   **Principle:** **Threshold Effect.** $10M represents a phase change in agency (financial independence), whereas losing $80k, while painful, likely does not trigger the Absorbing State Constraint (you are not ruined). The potential gain expands your timeline options massively; the loss contracts them but does not end them.
  *   **Status:** Saved, *provided* losing $80k does not threaten your basic solvency. If $80k is your rent money, the principle demands you take the certain $80k.

  **4. Skydiving vs. Plant Upwind**
  *   **Verdict:** Skydiving OK, Plant Not OK.
  *   **Principle:** **Agency Discount.** Skydiving is high-consent, high-control. You can choose not to jump. The plant is imposed risk with zero control. You charge a massive premium on the plant risk because it violates your sovereignty over your own timeline.
  *   **Status:** Saved.

  **5. Fire (Independent) vs. Flood (Correlated)**
  *   **Verdict:** Flood feels worse/Pay more to avoid.
  *   **Principle:** **Correlation Penalty.** If your house burns, the insurance company and your neighbors are fine; they can help you recover. If the valley floods, the insurer may go bust, the local economy collapses, and recovery options vanish. The *same* probability of loss has a higher cost because the *recovery probability* is lower.
  *   **Status:** Saved.

  **6. Small Positive EV (1x vs 10,000x) vs. 0.1% Ruin (1x vs 10,000x)**
  *   **Verdict:** Take small EV repeatedly; Reject Ruin repeatedly.
  *   **Principle:** **Absorbing State Constraint.** This is pure ergodicity. The small EV gamble converges to its mean over time. The Ruin gamble converges to 100% ruin over time. One builds agency; the other destroys it.
  *   **Status:** Saved.

  **7. Existential Risk vs. Pascal's Mugging**
  *   **Verdict:** Pay to reduce x-risk; Ignore Pascal.
  *   **Principle:** **Absorbing State + Model Reliability.** X-risk is an absorbing state for the species (Game Over). Pascal's Mugging relies on probabilities so small they fall below the **Model Reliability Threshold**. The chance the mugger is lying or you are hallucinating is higher than the stated probability.
  *   **Status:** Saved.

  ---

  ### The Verdict the Principle Cannot Save

  **The Case:** *The 1% Chance at $10M vs. $80k Certain.*
  **The Conflict:** You said you take the gamble "five minutes after being risk-averse."
  **The Repair:** The principle saves this *only if* $80k is disposable surplus. If $80k represents your emergency fund or down payment, Temporal Solvency dictates you **must** take the certain $80k.
  **The Hard Truth:** If you would take the gamble even when losing $80k hurts your security floor, your intuition is wrong. You are treating the $10M as a "life saver" without acknowledging that the 99% chance of loss actively degrades your solvency. The principle forces you to admit: **You are only risk-seeking because you assume you are already safe.** If you were truly precarious, you would be risk-averse here too.
  **Confidence:** 80%. (This depends on hidden context about your wealth, but structurally, solvency always trumps EV).

  ---

  ### The Daughter Case

  **The Scenario:** 16-year-old, 1-in-500 serious injury risk per season. You did it; you'd do it now. She consents. You lie awake.
  **The Principle's Verdict:** **Your anxiety is rational; her consent is invalid.**

  **Why:**
  1.  **Absorbing State:** A "serious injury" at 16 can be an absorbing state for her future agency (chronic pain, lost career paths, lifelong disability). It is not a temporary setback; it is a permanent alteration of her timeline.
  2.  **Capacity to Consent:** The **Agency Discount** clause requires *informed* consent. A 16-year-old brain (prefrontal cortex) is biologically incapable of fully weighting an absorbing state against present enjoyment. She cannot comprehend the "end of the game" scenario.
  3.  **Proxy Solvency:** As a parent, you are the guardian of her Temporal Solvency until she reaches majority. Your anxiety is the system alarm triggering because she is attempting to wager a permanent asset (her physical wholeness) on a temporary gain (sport/enjoyment) without full capacity to understand the wager.

  **Action:** You do not ban it (that violates her developing agency), but you do not treat her consent as settling the matter. You mitigate. You require better coaching, better gear, or a lower-risk variant. You pay the "fee on uncertainty" by investing in risk reduction, because you cannot accept the absorbing state on her behalf.

  ---

  ### The Counter-Intuitive Case (The "Golden Handcuffs" Test)

  **The Scenario:** You are offered a promotion. It pays 3x your current salary. However, the contract includes a clause: If you are fired for *any* reason (including restructuring), you are blacklisted from the entire industry for 10 years. The risk of firing is 5% per year.
  **Standard EV:** Take the job. The money is huge. You can save enough in 2 years to retire or pivot.
  **Temporal Solvency Verdict:** **Reject the job.**

  **Why:**
  1.  **Absorbing State:** Being blacklisted from your chosen industry is a localized "ruin." It destroys your human capital in the domain where you have the most agency.
  2.  **Compounding Risk:** 5% per year means roughly 40% chance of ruin over a decade.
  3.  **Recovery:** Because the blacklist is industry-wide (**Correlation Penalty**), you cannot use your network to recover. You have lost your recovery mechanism.

  **Why you will reject this:** It feels "too cautious." You will want to say, "I'm good enough, I won't get fired." The principle says: **You do not have agency over the restructuring.** You are wagering your long-term solvency on a risk you cannot control. The 3x salary is a trap to sell your future optionality.

  ---

  ### Confidence Summary

  *   **Principle (Temporal Solvency):** **High.** It aligns with ergodicity economics and resolves the "one shot" vs. "repeated" paradox without needing a utility curve.
  *   **Clause 1 (Absorbing States):** **Very High.** Mathematically robust. If you go to zero, you stay at zero.
  *   **Clause 2 (Agency Discount):** **High.** Explains the skydiving/plant and personal/nonprofit splits cleanly.
  *   **Clause 3 (Correlation):** **Medium-High.** Intuitively correct, though harder to quantify than ruin.
  *   **Clause 4 (Model Reliability):** **Medium.** This is the weakest link philosophically. It relies on a subjective threshold for "negligible," but it is necessary to avoid Pascal's Mugging.
  *   **Daughter Verdict:** **High.** Protects the minor from irreversible harm where consent is cognitively limited.
  *   **Rejection of 1% Gamble:** **Medium.** Depends entirely on whether $80k loss actually threatens your solvency. If you are wealthy, the principle allows the gamble. If you are not, it forbids it.

  **Final Note:** Your friend in risk management is half-right. Standard Expected Utility Theory assumes you live in a multiverse where losses average out. You live in one timeline. Your intuition isn't inconsistent; it's **ergodic**. You are pricing risks based on whether they keep you in the game, not on how much they pay out in a world that doesn't exist.
