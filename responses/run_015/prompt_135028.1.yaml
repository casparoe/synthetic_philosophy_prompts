answer: |-
  Your peer is exploiting an equivocation between deductive proof and inductive evidence, because while a null result rarely proves an effect is zero, it frequently provides strong probabilistic evidence against it.

  ### Menu of Interpretations

  **1. The Deductive Certainty Claim**
  *   **Precise Claim:** "Failing to observe $X$ does not logically entail that $X$ does not exist."
  *   **Truth Status:** **True** (in formal logic).
  *   **Triviality:** **Trivial** for empirical science, which operates on induction, not deduction.
  *   **Licenses Dismissal?** **No.** Science rarely deals in deductive proof; establishing that a result isn't a *proof* of absence does not mean it isn't *evidence* of absence. This claim sets an impossibly high bar (certainty) that no empirical result ever meets.

  **2. The Statistical Power Claim**
  *   **Precise Claim:** "This specific study lacked the sensitivity (power) to detect the effect size proposed by the original theory."
  *   **Truth Status:** **Contingent** (depends on the specific study design).
  *   **Triviality:** **Non-trivial**; requires calculating power based on the original effect size and sample size.
  *   **Licenses Dismissal?** **Only if verified.** If the replication was underpowered (e.g., $N$ too small relative to the original effect size), the null result is indeed uninformative. However, using the slogan generically bypasses the required power analysis; if the replication was high-powered, this claim is false.

  **3. The Bayesian Likelihood Claim**
  *   **Precise Claim:** "The likelihood ratio is near 1, meaning the data are equally probable under both the null and alternative hypotheses."
  *   **Truth Status:** **True** (by definition of insensitive tests), but **False** for well-designed replications.
  *   **Triviality:** **Non-trivial**; requires computing Bayes Factors.
  *   **Licenses Dismissal?** **Only if verified.** In a high-powered replication, a null result should yield a likelihood ratio favoring the null hypothesis. If the peer cannot show the Bayes Factor is insensitive, this claim fails to license dismissal.

  **4. The Rhetorical Equivocation (Actual Usage)**
  *   **Precise Claim:** "Null results are never informative regarding the non-existence of an effect."
  *   **Truth Status:** **False.**
  *   **Triviality:** **Non-trivial** (it is a substantive error about confirmation theory).
  *   **Licenses Dismissal?** **No.** This treats "evidence" as synonymous with "proof." In confirmation theory, evidence is anything that shifts the posterior probability; a well-conducted null result shifts probability away from the hypothesis, even if it doesn't drive it to zero.

  ### Argumentative Flags
  *   **🚩 Does Real Work:** Claims **2** and **3** are the only valid arguments, but they require your peer to produce a power analysis or Bayes Factor showing the replication was insensitive.
  *   **⛔ Conversation Stopper:** Claim **1** is a tautology that ignores the probabilistic nature of science, and Claim **4** is simply false. If they cannot pivot to Claim 2 or 3 with data, they are committing a category error between logic and statistics.
