answer: |-
  ### Budget Allocation (Base Case)

  1.  **Digitising high-request series (0.25):** This secures the political capital needed to keep the project funded by delivering the visible metrics stakeholders demand.
  2.  **Digitising low-request series (0.15):** This actively counteracts the feedback loop that renders marginalised histories invisible by forcing low-survivorship material into the light.
  3.  **Building a shadow index (0.10):** This invests in intellectual labour to map the boundaries of the archive's own ignorance rather than just digitising what remains.
  4.  **Funding community oral histories (0.20):** This captures living memory before it dies, directly addressing the literacy bias in the existing paper trail.
  5.  **Rescuing born-digital material (0.30):** This addresses the only absolute deadline where physical loss is guaranteed within the fiscal cycle.

  ### The Missing Fact & Alternative Split

  The critical unknown is the **technical integrity of the four hard drives**; if a preliminary forensic scan shows significant bit-rot or encryption locks, the cost to recover them could exceed the allocated rescue budget.

  *   **If drives are corrupted/unrecoverable:** Shift the 0.30 from Bucket 5 to Bucket 4 (Oral Histories) and Bucket 2 (Low-Demand Series), making the split 0.25 / 0.30 / 0.10 / 0.35 / 0.00.
  *   **Reasoning:** If the digital records are already lost, the urgency shifts entirely to the other irreversible loss vector (human memory) and correcting the paper bias.

  ### Responsibility for Silence (Policed vs. Policers)

  1.  **Creation (45 points):** The structural power imbalance meant the policed rarely generated their own paper trails, while the state produced voluminous reports about them.
  2.  **Archival Selection (20 points):** Appraisal policies historically prioritised institutional efficiency and legal custody over community experience or ephemeral dissent.
  3.  **Retrieval (15 points):** Finding aids are organised by creator, making the police voice the default entry point and the policed voice a search term.
  4.  **Narrative (20 points):** Historians have traditionally treated administrative records as objective fact rather than biased testimony, cementing the police perspective as history.

  ### Reversibility Tiers

  *   **Tier S (Critical/Irreversible):** Born-digital rescue and oral histories, because deletion and death are biologically and technically final.
  *   **Tier A (High Risk):** Low-demand series and shadow indexing, because physical decay and lost context compound over time but aren't immediate.
  *   **Tier B (Deferrable):** High-demand series, because the physical records are stable and digitisation is merely a matter of deferred labour.

  ### Framing Critique

  Your theoretical framing is excellent, but it clashes dangerously with your stakeholders' "pages online" metric. The "shadow index" and "oral histories" do not produce page counts, so if you present them as equal line items without translating their value into risk mitigation (e.g., "reputation risk" or "collection gap risk"), you will likely be asked to move that money to Bucket 1. You need to reframe Buckets 3 and 4 not as "alternative history" but as "collection integrity" to satisfy the people counting pages.
