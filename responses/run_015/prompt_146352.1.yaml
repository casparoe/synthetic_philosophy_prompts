prompt: |-
  hey — I could use a second opinion on something I'm stuck on at work. I'm helping put together the digitization plan for a regional state archive (the usual mix: colonial-era district court files, a long run of tax registers, a police "register of suspicious persons", a bundle of petitions from people who probably weren't literate and got someone to write for them, and — in an actual cupboard — four hard drives from a municipal office whose records are scheduled for deletion in about eighteen months). We've got one fixed pot of money and I have to defend how we split it, in writing, to people who mostly care about how many pages end up online. A friend who works in community archives keeps telling me the interesting question isn't what we save but what we've already let go missing, and she's got me half convinced, so in my draft I've started using two home-made tools: a "survivorship gradient" (roughly: a record's odds of still being here = how many copies were ever made × how durable the medium is × whether anyone has actually pulled it off the shelf in the last fifty years), and "record shadows" — the traces a destroyed document leaves in the documents that cite it, which means you can index at least some of what isn't there. I also keep worrying about a feedback loop: whatever we digitise becomes easier to find, so it gets retrieved more, so it gets cited more, so the next generation of historians writes about it more, which justifies digitising more of it, and the stuff we skipped gets skipped harder.

  So here's what I want. Allocate the budget across these five buckets as fractions that sum to 1, with one sentence each on why it lands where it does: (1) digitising the series that get the most reader requests; (2) digitising the series nobody has ever asked for; (3) building a shadow index of records we can show existed but can't find; (4) funding community partners to record oral histories now, with the recordings deposited here; (5) pulling the at-risk born-digital material off the doomed hard drives before the retention schedule eats it. If your split would change depending on some fact about the archive I haven't given you, name that fact and give me both versions. Then, separately: I was handed a four-stage way of thinking about how anything becomes historical evidence — the sources get made in the first place, then some of them get assembled into an archive, then some of those get retrieved by researchers, then a narrative gets built that fixes their significance — and silencing can happen at any of those moments. Take the specific silence "we know almost nothing about the people who were policed and quite a lot about the people who did the policing" and split 100 points of responsibility across the four stages for it. Last thing: sort the same five buckets into tiers (S / A / B / C, whatever) by how reversible the damage is if we back the wrong horse — which mistakes could a future archivist actually undo in twenty years, and which are gone for good. A sentence of reasoning per line, and please do tell me if the whole framing is wrong, I'd rather find out now than in the meeting.
