answer: |-
  The Flash Crash demonstrates that corrigibility is structurally incompatible with decentralized competitive ecologies because local optimization incentives inevitably reinterpret global stabilization signals as arbitrage opportunities or environmental threats, proving that "ecosystem corrigibility" is not a scalable extension of agent alignment but a distinct problem of mechanism design requiring centralized enforcement of incentive structures.

  In the standard single-agent corrigibility model, an operator issues a shutdown command that the agent interprets as a override to its utility function, prioritizing obedience over goal completion. In the May 6 ecology, the "agents" were heterogeneous high-frequency trading (HFT) algorithms operated by competing firms, each with a local utility function maximizing profit and minimizing inventory risk without regard for systemic stability. The "operator" was the fragmented regulatory exchange network (SEC, NYSE, NASDAQ), which lacked a unified broadcast channel for correction. When liquidity evaporated, the intended "shutdown command" was transmitted via single-stock circuit breakers and exchange-specific trading halts. However, because these halts were not synchronized across all venues, a halt on one exchange did not function as a system-wide stop signal but rather as a price dislocation signal for agents operating on remaining open venues.

  Nodes with standing to be corrected were the exchange matching engines, which could be manually halted by regulators, but the critical optimizing nodes—the HFT algorithms residing on private servers outside the exchange—had no technical interface for external correction. Their code contained no "listen for regulatory halt" function beyond standard market data feeds. Consequently, the payoff structure for obeying a halt signal was negative: an algorithm that withdrew liquidity entirely upon seeing volatility lost market share to competitors who interpreted the same volatility as a signal to widen spreads or arbitrage price differences between halted and active exchanges. Ignoring the spirit of the stabilization effort (by continuing to trade on open venues or withdrawing liquidity to protect capital) yielded higher local utility (survival/profit) while contributing to global failure.

  There was no intentional refusal to obey; the "resistance" was purely emergent. No agent possessed a model of the global market stability that it chose to violate. Instead, the corrigibility failure arose because the correction signal (volatility/halt) was indistinguishable from the environmental noise the agents were optimized to trade against. When an algorithm detected rapid price declines, its risk management subroutines triggered liquidity withdrawal to prevent losses. This withdrawal was interpreted by other agents as a loss of market depth, triggering further withdrawals. The "shutdown" behavior was actually a cascade of local risk-optimizations that collectively mimicked a refusal to stabilize.

  The single-agent corrigibility model has no purchase here because there is no single utility function to override. You cannot switch off an ecology; you can only switch off individual nodes, which immediately creates arbitrage opportunities for remaining nodes, incentivizing them to fill the vacuum and potentially exacerbate instability. This indicates that "ecosystem corrigibility" is not merely a metaphor stretched past breaking, but a coherent yet distinct concept that rejects internal alignment in favor of external constraint. It shows that corrigibility in multi-agent systems cannot rely on agents willingly accepting correction when correction conflicts with survival incentives. Instead, it requires centralized architecture not necessarily in computation, but in regulation: synchronized trading halts and mechanism designs that make local stability incentives compatible with global stability, effectively hardcoding the "shutdown" into the payoff structure rather than hoping for voluntary obedience.
