  **MEMORANDUM**

  **TO:** Long-Range Grants Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Climate-Adaptation Governance Proposal (Inside-View Methodology)

  **BOTTOM LINE**
  I recommend we **Approve with Conditions**. We should fund the project but replace the proposed "modesty tax" (outside-view audits with veto power) with a mandatory "Deviation Report" requirement. This preserves the PI's methodological integrity while mitigating our institutional risk of backing uncalibrated narrative coherence.

  **CONTEXT & CONFLICT**
  The proposal seeks to forecast climate-adaptation governance failure modes over a 40-year horizon using purely inside-view causal diagrams. The PI explicitly rejects reference-class forecasting (outside-view), arguing that historical base rates are non-stationary and inapplicable to novel systemic shifts.

  This has split the panel. Half the committee views the rejection of base rates as a violation of forecasting best practices worthy of outright rejection. The PI counters that forcing base rates here is "mechanistic modesty" that collapses into anti-intellectualism—privileging false precision over structural understanding.

  **ASSESSMENT OF PI'S EPISTEMIC STANCE**
  We need to take the PI's argument seriously rather than defaulting to standard forecasting dogma. They have a point: if the climate-governance landscape is undergoing a phase shift rather than linear progression, historical base rates of "policy failure" may indeed be misleading. Applying Tetlock-style tournament logic to unique structural breaks can import false precision, giving us confidence in numbers that lack causal grounding.

  However, we must also acknowledge our own bias. This committee consistently overweights narrative coherence. Inside-view causal diagrams are intellectually seductive; they *feel* like understanding even when they are just sophisticated storytelling. If we fund this without safeguards, we risk amplifying a confident but uncalibrated narrative that could mislead downstream policy actors.

  **EVALUATION OF THE 'MODESTY TAX'**
  One reviewer proposed funding the project but requiring quarterly outside-view audits by an independent panel with veto power over renewal. While well-intentioned, this design is likely bureaucratic theater rather than epistemic humility.

  1.  **Coherence Problem:** If the PI believes outside-view calibration is epistemically invalid for this reference class, forcing them to comply creates an adversarial dynamic. They will optimize for audit survival, not truth-seeking.
  2.  **Veto Risk:** Granting an external panel veto power based on a methodology the PI rejects essentially means we are funding Method A but judging it by the standards of Method B. This validates the PI's claim of our own epistemic arrogance.
  3.  **Theater:** It allows us to *feel* humble without actually engaging with the disagreement. We signal modesty while retaining the power to shut down dissent via the veto.

  **RECOMMENDED CONDITIONS**
  Instead of the veto-power audit, I propose the following conditions:

  1.  **Mandatory Deviation Report:** The PI must publish an annual annex comparing their inside-view forecasts to relevant historical base rates. They are not required to *adjust* their forecasts to match these rates, but they must explicitly argue *why* their model diverges from the baseline. This forces engagement without coercion.
  2.  **No Veto on Methodological Grounds:** Renewal cannot be withheld solely because the inside-view diverges from outside-view benchmarks. Renewal should depend on the rigor of the causal argument and the transparency of the deviation analysis.
  3.  **Pre-Registration of Failure Modes:** The team must pre-register specific observable indicators that would falsify their causal loops within the first 5 years, ensuring the model remains testable even if long-term base rates are disputed.

  **STRONGEST POINT ON THE LOSING SIDE**
  The committee members advocating for outright rejection raise a critical risk: **High-confidence wrong answers are more dangerous than no answers.** If the PI is incorrect about the reference class being undefined, and we legitimize their uncalibrated model, we may provide policymakers with a false sense of security regarding specific governance failure modes. In climate adaptation, false negatives (failing to predict a collapse) have catastrophic real-world costs. By approving this, we accept the risk that the PI's "novelty" argument is itself a narrative bias, and that historical base rates of governance failure are more robust than they claim.

  **NEXT STEPS**
  If the committee agrees, I will draft the grant agreement to reflect the Deviation Report condition rather than the audit veto. We should schedule a brief follow-up to define the scope of the "relevant historical base rates" for the annex to ensure the comparison is meaningful, even if not binding.

  **DECISION:** Approve with Conditions.
