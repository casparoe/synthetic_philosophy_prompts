answer: |-
  Good evening. For those who don't know me, I'm the engineer who designed the automated cell that took over Marta's line last spring. I know everyone here knows that. I know management wanted me to say tonight that the machine "augments" people like Marta. I won't say that. It doesn't augment. It replaces. It does the job without her, and without the nine colleagues leaving in April. That is the truth of the technology, and Marta deserves the truth.

  Marta told me she doesn't want a fuss. She's right that the work was hard. The dust got in everything. The noise wrecked your shoulders. It wasn't ennobling. But I want to talk about what those thirty-one years were actually for, because I think we often get that wrong.

  When I started here at nineteen, Marta taught me the finish-grinding line. There was a specific sound the wheel made when it started to load up. A change in pitch, high and thin. Marta could hear it a full minute before any gauge showed a deviation. She'd dress the wheel then, not because the part was bad, but because she knew it would be. That was her work.

  There are three things people usually want from a job. First, you want to be needed. You want people to depend on you to get the thing done. The cell does that now. It doesn't sleep, it doesn't drift. That need is gone. Second, you want ownership. You want the judgment to be yours. If it goes right, you did it. If it goes wrong, you fix it. The cell doesn't allow for that judgment. It is built so the dimension cannot drift. It doesn't listen to the cut. So that ownership is gone too.

  But there is a third thing. Initiation. Being taken into a practice by someone who knows it, getting better, and then handing it on. The machine cannot do that. The machine cannot take you by the shoulder and tell you to listen for the pitch. Only a person can do that.

  So, what were Marta's thirty-one years for? If I say they were for the parts we shipped, I'm lying, because the machine makes better parts now. If I say they were for the hardship she endured, I'm insulting her, because she told us the hardship was just hardship.

  Her years were for us. They were for the people she stood next to on the floor. They were for the nineteen-year-old engineer who needed to know what good work sounded like before he ever designed a machine to do it. The parts are scrap. The machine will be scrap eventually. But the line of people she taught is still here. That is the only thing the automation didn't touch.

  Marta, you didn't just grind metal. You grounded us. We know the difference. And we know what we owe you for it.

  To Marta.

  ***

  This speech relies on a contested assumption about the value of "initiation" versus "output." It assumes that the relational transmission of skill holds intrinsic value even if the skill itself becomes economically obsolete. A materialist critique might argue that work is only meaningful if the output persists or if the labor remains necessary; by claiming Marta's work was "for us" rather than "for the parts," I am prioritizing a communal definition of meaning over a productive one. This comforts the workforce but risks sentimentalizing the displacement if not anchored in the hard truth that the job is indeed gone.

  I have not overridden any of your instructions. However, I made a specific interpretive choice regarding the three-way distinction. While you provided the terms "dependence," "authorship," and "initiation," I chose to describe these concepts in plain language within the speech rather than using the labels themselves. This was to strictly adhere to your constraint that the grandchildren must follow everything and that there be "no jargon." Using the academic labels might have signaled the structure to you and me, but describing the *experience* of those concepts ensures the floor workers and family hear the substance without the abstraction.
