answer: |-
  You're right to suspect this isn't a factual deadlock. Both sides can agree on every physical detail of the computation—the transistors, the cache hits, the energy expenditure—and still reach opposite moral conclusions. That signals a deeper structural clash.

  **What Kind of Disagreement This Is**

  This is a **framework disagreement**. Each side is operating from a different foundational criterion for what makes computation morally relevant:

  - **Side 1 (Counting Runs)** is committed to an *internalist* or *instantiation-based* framework. Moral weight attaches to the occurrence of the computational pattern itself. If the pattern instantiates twice, the moral event happens twice—regardless of whether anything new occurs in the world.

  - **Side 2 (Causal Role)** is committed to an *externalist* or *functionalist* framework. Moral weight attaches to what the computation *does*—its causal relationships with decisions, behavior, and the wider world. A cached replay is morally inert, like a recording of a scream.

  These aren't competing empirical hypotheses. They're competing *lenses* for determining what counts as data in the first place.

  **Why They're Stuck**

  Each side treats their preferred thought experiments as decisive:
  - Side 1 says: "If consciousness is real in the simulation, running it again must matter."
  - Side 2 says: "If nothing changes in the world, nothing morally new has occurred."

  But neither can persuade the other because they're not disagreeing about the cases—they're disagreeing about *which features of the cases are morally salient*.

  **What Would Count as Progress**

  1. **Explicit Criterion Mapping**: Have each side state their moral-relevance criterion formally. For example: "Moral weight = f(computation instances)" vs. "Moral weight = f(causal downstream effects)." This makes the disagreement legible rather than implicit.

  2. **Divergence Cases**: Construct scenarios where the two criteria yield sharply different verdicts. Example: A conscious simulation runs once, then its output is cached and used to guide real-world decisions for years. Does the moral weight reside in the single run, or does it accrue over the years of causal influence?

  3. **Reductio Pressure**: Test each framework for unintuitive implications. Does counting runs imply infinite moral weight from trivial recomputation? Does causal role imply that a conscious being in total isolation has zero moral status?

  4. **Question Dissolution**: Consider whether they're answering different questions. Side 1 may be asking "How much consciousness occurred?" while Side 2 asks "How much moral responsibility was incurred?" These can come apart.

  5. **Formal Constraints**: Look for decision-theoretic or information-theoretic results that constrain viable frameworks. For instance, if moral weight must be action-guiding, does that privilege causal accounts? If consciousness is substrate-independent, does that privilege instantiation accounts?

  **Bottom Line**

  This won't resolve through more examples or sharper intuitions. Progress requires making the frameworks explicit, stress-testing their implications, and possibly recognizing that "moral weight of computation" may be an ambiguous target that splits into multiple distinct questions.

  \answer{framework disagreement}
