      *   **Context:** Stalemate over personal-level explanations (belief/desire) vs. physical reductionism.
      *   **Key Text:** Dennett's *Darwin's Dangerous Idea* (specifically the "Universal Acid" chapter regarding skyhooks vs. cranes).
