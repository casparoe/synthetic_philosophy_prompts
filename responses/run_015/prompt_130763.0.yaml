  This heavy thing remains where I have put it.
  The grain runs dark beneath the varnish skin.
  I knock my knuckle hard against the top
  And feel the solid shock run up my arm.
  It does not ask for reasons to be here,
  It simply rests upon the floor of wood.

  Stood firm against the spill of wine and time,
  Composed of countless threads too small to see,
  The layers peel away within the thought,
  Until the eye can no longer hold the sight,
  And breaks the block into a dust so fine.

  Line drawn around the particle reveals
  No edge, just a quiver in the dark.
  Where matter ends and nothingness begins,
  The solid mass dissolves in empty space.

  Place holds no meaning without things to bind,
  Yet forces weave the net to span the gap.
  What is the hand that makes the agreement hold?

  Old promises are kept by making new,
  The ground rises to meet the falling stone.
