      *   **Addressing Question 3: Causal Dependency & Strategy vs. Theory:**
          *   *Causal Dependency:* It's not overdetermined; Franklin *says* it. But be careful not to make it too rigid. It's heuristic, not logical necessity.
          *   *Strategy vs. Theory:* This is the crux. Franklin lacks a *metaphysical* theory of virtue. He has a *psychological* theory of habit.
          *   *Refinement:* Distinguish between "Virtue as Being" (Aristotle) vs. "Virtue as Doing" (Franklin).
          *   *Misleading Potential:* Don't imply Franklin thought virtue was *only* habit. He believed in reason's role, but habit was the tool.

