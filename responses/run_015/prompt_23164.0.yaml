answer: |-
  This is a sophisticated objection that cuts to the heart of Lewis's *Convention* (1969). You are identifying what we might call the **"Epistemic Fragility Problem."**

  Many critics focus on whether Common Knowledge (CK) is psychologically possible. Your point is stronger: even if we grant approximate CK, Lewis's specific combination of **Arbitrariness** and **Conditional Preference** creates a theoretical structure that cannot account for the **robustness** of actual conventions.

  Here is a structured argument demonstrating that this is a genuine theoretical gap, not merely an empirical idealization.

  ### The Argument: The Normative Vacuum Under Epistemic Uncertainty

  **1. The Lewisian Dependency Chain**
  In Lewis's framework, the rationality of conforming to a convention ($C$) is entirely derivative.
  *   **Premise A (Arbitrariness):** There is no intrinsic reason to prefer $C$ over alternative $C'$. (e.g., driving on the right is not physically safer than the left).
  *   **Premise B (Conditional Preference):** My reason to follow $C$ is *solely* that I expect others to follow $C$. If I expected others to follow $C'$, I would prefer $C'$.
  *   **Premise C (Epistemic Grounding):** My expectation that others will follow $C$ is grounded in Common Knowledge. Without CK, the expectation is not rational (it is not a Nash equilibrium supported by mutual knowledge).

  **2. The Fragility Inference**
  *   **Premise D:** Common Knowledge is epistemically fragile. In any large population, there is always noise, bounded rationality, or new agents who lack the full iterative chain of "I know that you know that I know..."
  *   **Inference:** Therefore, in any real-world scenario, the epistemic grounding (Premise C) is always slightly degraded.
  *   **Inference:** Because the reason to act (Premise B) depends *exhaustively* on the expectation, and the expectation depends *exhaustively* on the epistemic grounding, any degradation in CK should proportionally degrade the reason to conform.

  **3. The Empirical Contradiction**
  *   **Observation:** Conventions like driving sides, currency usage, or language are remarkably robust. They persist even when agents know that *some* people are ignorant, confused, or new to the system (i.e., when CK is technically broken).
  *   **Observation:** Agents do not report a weakening of their reason to conform when they realize CK is imperfect. I don't think, "Well, since I'm not 100% sure everyone knows everyone knows, I might drive on the left."

  **4. The Theoretical Gap**
  *   **Conclusion:** Lewis's account predicts that arbitrary conventions should be highly sensitive to epistemic degradation. Reality shows they are insensitive to it. Therefore, Lewis's account fails to explain the **mechanism of stability** for arbitrary conventions.

  ---

  ### Why Lewis Cannot Wave This Away as "Idealization"

  Lewis might try to defend himself by saying CK is a "rational reconstruction" or an idealization. Here is why that defense fails against your specific objection:

  **1. It's Not Just About Existence, It's About *Force***
  If Lewis were only trying to define what counts as a convention, he could idealize CK. But he is trying to explain **why we follow them**. He posits a game-theoretic equilibrium. In game theory, if the knowledge conditions for an equilibrium are not met, the equilibrium dissolves.
  If you treat CK as an approximation, you change the math of the coordination problem. If I know there is a 5% chance you don't know the convention, and the convention is *truly arbitrary* (no intrinsic value), my expected utility for conforming drops. If the cost of coordination failure is high (crashing cars), even a small doubt should trigger a search for a non-conventional reason to act. Since we don't search, Lewis's model of our motivation is wrong.

  **2. The "Arbitrariness" Trap**
  This is the crux of your argument. If Lewis concedes that conventions are robust without perfect CK, he must admit there is **some other reason** we follow them besides "everyone else is doing it."
  *   Perhaps it's **habit** (we do it without thinking).
  *   Perhaps it's **internalized normativity** (we feel we *ought* to do it).
  *   Perhaps it's **salience** (the "right" side feels brighter/more obvious).

  But if he admits any of these, he violates **Premise A (Arbitrariness)**.
  *   If it's habit, it's not a rational coordination equilibrium.
  *   If it's internalized normativity, it's no longer arbitrary (there is now a non-conventional reason to follow it: moral/psychological satisfaction).
  *   If it's salience, Lewis has to explain why salience survives the erosion of CK.

  Lewis wants to have it both ways: He wants conventions to be *rational solutions to coordination problems* (requiring CK) but also *social facts that endure* (requiring robustness). Your argument shows these two goals are in tension. By insisting on strict arbitrariness, he removes all "glue" other than CK. By insisting on CK, he makes the glue too brittle for the weight of the convention.

  **3. The Problem of New Agents (The Entry Problem)**
  Consider a new driver entering a country. They do not have Common Knowledge with the existing population. They haven't iterated "I know that they know" with millions of strangers.
  *   **Lewis's Prediction:** The new driver should not be able to rationally enter the convention immediately, because the CK condition isn't met. They should hesitate.
  *   **Reality:** The new driver conforms immediately and robustly.
  *   **The Gap:** Lewis cannot explain how the convention transmits to agents outside the CK loop without relying on *trust* or *authority*, which are non-Lewisian mechanisms. If the convention relies on "trust that others follow it" rather than "knowledge that others follow it," Lewis's epistemic requirement is too strong. If it relies on "authority," it's not a pure coordination convention.

  ### Philosophical Precedents (To bolster your position)

  You are not alone in this; pointing out these allies strengthens your claim that this is a recognized theoretical gap, not just a hunch.

  1.  **Margaret Gilbert (*On Social Facts*):** She argues exactly this. She claims Lewis's "concordance of expectations" is too weak to generate the *obligation* we feel to follow conventions. She argues that when CK breaks, we still feel bound, which implies a **Joint Commitment** rather than a coordination equilibrium. This supports your view that Lewis's model is missing the "glue."
  2.  **Brian Skyrms (*The Evolution of the Social Contract*):** Skyrms uses evolutionary game theory to show that conventions can stabilize *without* Common Knowledge, through dynamic processes of learning and signaling. This demonstrates that Lewis's CK requirement is theoretically unnecessary for stability, making it a gratuitous constraint that creates the fragility problem you identified.
  3.  **Ruth Millikan:** She argues that conventions are more like biological functions or "proper functions." They persist because they *have* worked, not because we currently know that they work. This bypasses the need for current CK entirely.

  ### Summary of the Argument for Your Use

  To argue this effectively, frame it as a **dilemma for Lewis**:

  > "Lewis defines convention as an arbitrary regularity sustained by common knowledge of conditional preferences.
  >
  > **Horn 1:** If he insists on strict arbitrariness, the convention lacks any stabilizing force other than CK. Since CK is inevitably imperfect in large populations, the convention should be unstable. It is not.
  >
  > **Horn 2:** If he admits the convention is stable despite imperfect CK, there must be a stabilizing force other than CK (e.g., habit, normativity, salience). If so, the convention is not strictly arbitrary in the Lewisian sense, or it is not sustained by the rational expectations he claims.
  >
  > Therefore, Lewis's account cannot simultaneously explain the **arbitrariness** and the **robustness** of social conventions."

  This shows the gap is structural. It's not that Lewis got the empirical details wrong; it's that the *logic of his definition* precludes the kind of stability we actually observe.
