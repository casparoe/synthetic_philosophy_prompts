  ### Part 1: Brainstorming the Logical Space

  Before constructing the instrument, we must identify the fault lines that actually divide Buddhist ethical reasoning, moving beyond sectarian labels (e.g., "Theravada vs. Mahayana") to the underlying philosophical commitments. The following distinctions constitute the logical space of the taxonomy:

  1.  **Locus of Moral Value:** Is value located in the external state of affairs (reduction of *dukkha* in the world) or the internal state of the agent (purity of *cetana* or mental intention)?
  2.  **Ontological Coherence of Aggregation:** Given *anatman* (no-self), is there a coherent subject to whom "total welfare" can be attributed? Does the lack of a permanent self invalidate the arithmetic of utilitarianism, or is conventional selfhood sufficient for moral calculation?
  3.  **Temporal Scope of Consequences:** Do "outcomes" refer to immediate worldly welfare (saving lives now) or long-term soteriological trajectories (karmic seeds affecting future rebirths)?
  4.  **Agent-Relative Constraints:** Does the moral permission to perform harmful acts depend on the agent's epistemic status (e.g., direct realization of emptiness) or is the rule agent-neutral (anyone can calculate the greater good)?
  5.  **Mechanism of Karmic Retribution:** Is karma a cosmic moral ledger (retributive) or a psychological law of habit formation (causal/latency)? This determines whether "bad acts" are wrong because they violate a cosmic order or because they damage the agent's mind.
  6.  **The Role of Failure:** If a compassionate intention fails to produce good outcomes, is the act morally diminished? This separates strict intentionalism from views that grant some weight to consequences.

  ### Part 2: The Decision-Tree Taxonomy

  **Instructions:** Answer each node based on your philosophical judgment of the case or claim presented. Do not select based on which school you think you belong to.

  **Node 1: The Calculation Test**
  *Case:* A Bodhisattva considers killing a bandit to save 500 merchants.
  *Claim:* "This act is morally justified *primarily* because a rational calculation shows that one death produces less total suffering than 500 deaths."
  *   **Yes:** Go to Node 2.
  *   **No:** Go to Node 4.

  **Node 2: The No-Self Objection**
  *Claim:* "Because there is no substantial self (*anatman*), there is no unified subject to bear 'total welfare.' Therefore, summing suffering across different beings is logically incoherent."
  *   **Yes:** **Leaf (d) No-Self Block**.
  *   **No:** Go to Node 3.

  **Node 3: The Scope of Aggregation**
  *Claim:* "When calculating welfare, we must sum the immediate worldly suffering of all victims (the bandit and the merchants), not just the karmic effect on the killer's mind."
  *   **Yes:** **Leaf (b) Direct Buddhist Consequentialism**.
  *   **No:** (This implies the calculation focuses on the agent's karmic trajectory). **Leaf (c) Karmic-Latency Hybrid**.
      *(Note: This path captures those who use consequentialist logic but restrict the 'outcome' to internal karmic conditioning.)*

  **Node 4: The Enlightenment Condition**
  *Claim:* "An ordinary person with compassionate intentions is *never* permitted to kill the bandit. This act is permissible only for one with direct realization of emptiness (*sunyata*)."
  *   **Yes:** **Leaf (e) Upaya Exception**.
  *   **No:** Go to Node 5.

  **Node 5: The Latency Question**
  *Claim:* "Delayed karmic fruits count as present moral outcomes. The act is evaluated based on how it conditions the agent's future mental continuum."
  *   **Yes:** **Leaf (c) Karmic-Latency Hybrid**.
      *(Note: Respondents may arrive at Leaf (c) from Node 3 or Node 5. Both paths indicate outcomes matter only via mental conditioning.)*
  *   **No:** Go to Node 6.

  **Node 6: The Failed Intention Test**
  *Case:* A person acts with purely compassionate intention to save the merchants, but fails; the bandit kills everyone anyway.
  *Claim:* "The moral quality of the agent's act remains wholly good, despite the disastrous external outcome."
  *   **Yes:** **Leaf (a) Strict Intention-Based View**.
  *   **No:** (This implies external outcomes affect moral quality, but without calculation). **Leaf (a) Strict Intention-Based View**.
      *(Note: In this taxonomy, rejecting calculation and latency leaves only the intention as the moral locus. A 'No' here suggests a hidden commitment to consequences, looping back to Node 1. For the purpose of this tree, 'Yes' confirms Strict Intention.)*

  ### Part 3: Leaf Definitions & Mapping

  *   **(a) Strict Intention-Based View:** Moral quality is exhausted by the moment of volition (*cetana*). External results and karmic futures are causal facts, not moral evaluators. (Reached via Nodes 1-No, 4-No, 5-No, 6-Yes).
  *   **(b) Direct Buddhist Consequentialism:** Aggregates welfare across all affected beings. Rejects the No-Self Block. (Reached via Nodes 1-Yes, 2-No, 3-Yes).
  *   **(c) Karmic-Latency Hybrid:** Outcomes matter, but only insofar as they condition the agent's future mind (karmic seeds). Can be reached via calculation of internal states (Node 3-No) or evaluation of latency (Node 5-Yes).
  *   **(d) No-Self Block:** Accepts consequentialist logic but denies its ontological coherence due to *anatman*. (Reached via Nodes 1-Yes, 2-Yes).
  *   **(e) Upaya Exception:** Permits harmful acts based on the agent's enlightened state (non-attachment), not utility calculation. (Reached via Nodes 1-No, 4-Yes).

  ### Part 4: Logical Combinations & Gap Analysis

  **Unoccupied Branch: The "Enlightened Consequentialist"**
  *   **Location:** Node 1 (Yes) → Node 2 (No) → *Hypothetical Node: "Is this calculation available only to enlightened beings?"*
  *   **Diagnosis:** This branch is **unexplored but logically coherent**. It posits that welfare aggregation is valid (rejecting No-Self Block) but epistemically restricted (only a Buddha can calculate karma accurately enough to justify harm).
  *   **Status:** **Unattractive/Redundant.** It collapses into (e) *Upaya* practically (since only the enlightened can act), but retains the *justification* of (b) *Consequentialism*. Most traditions reject this because if the justification is calculation, it should be teachable; if it relies on enlightenment, the justification is usually shifted to *insight* (Upaya) rather than *math* (Consequentialism).

  **Incoherent Combination: The "Realist Intentionalist"**
  *   **Location:** Node 1 (No) → Node 5 (No) → Node 6 (No).
  *   **Diagnosis:** **Incoherent.** This position claims calculation doesn't justify acts (No to Node 1), karmic latency doesn't matter (No to Node 5), yet failed intentions are morally worse due to outcomes (No to Node 6). This grants moral weight to outcomes without a mechanism (calculation or karma) to process them. It is unstable and usually resolves into (a) or (b) upon reflection.

  ### Part 5: Indistinguishable Leaves

  **Pair:** **(a) Strict Intention** and **(c) Karmic-Latency Hybrid**.
  *   **Reason:** In practice, these views often yield identical verdicts. Both reject external welfare aggregation. Both focus on the agent's mind.
  *   **Distinction Failure:** The tree separates them based on whether *future* mental states count as "outcomes" (Node 5). However, a Strict Intentionalist might argue that caring about future mental states *is* just caring about future intentions. If "conditioning the mind" is viewed simply as "forming future intentions," (c) collapses into (a). The distinction holds only if one views karmic seeds as ontological realities distinct from mere psychological habit.

