      *   *Is it empirical?* This is the user's strongest insight. Affective neuroscience treats valence as a dimension. If valence is a neural reality, hedonism gains empirical traction. If valence is a post-hoc construction, hedonism loses it.
      *   *Synthesis:* It is a **category error disguised as a metaphysical dispute, fueled by divergent theoretical aims.** The philosophers are asking "What makes these good?" (Normative/Metaphysical) while the scientists are asking "How are these processed?" (Descriptive/Empirical). The "wall" exists because the hedonist needs a *normative* unity, but the only available unity is *descriptive* (neural/phenomenal), and the bridge between "is" (neural firing) and "ought" (welfare) is missing.

