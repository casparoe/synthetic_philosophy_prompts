      *   Hofstadter says communication has three parts. Frame, Outer, Inner.
      *   Inner is the stuff you study. Outer is how you show it. Frame is the rules we agree on.
      *   Usually, we fight about the Inner. "What does this letter mean?"
      *   I argue we should fight about the Frame. "Do we agree on how to read this letter?"
      *   If frames are private, we are always mistranslating.
      *   But meaning isn't just in the letter (object) and not just in you (subject). It's in the frame.
      *   Let's spend the week testing the frame.

  5.  **Refining for Tone and Constraints:**
      *   *Tone:* Needs to be journalistic but elevated. "Polished prose suitable for oral delivery" means rhythmic, clear pauses, avoiding overly dense jargon without explanation.
      *   *Constraint Check:* Ensure I don't slip into "meaning is subjective" or "meaning is objective." The frame is the intersubjective space. If the frame is private, communication fails. If shared, it works. The workshop is about testing that shareability.
      *   *Accessibility:* Define Frame/Outer/Inner clearly using an archival metaphor immediately.

  6.  **Drafting - Iteration 2 (Writing the content):**
      *   *Word Count Check:* 4 minutes spoken is roughly 500-600 words at a moderate pace (130-150 wpm).
      *   *Opening:* "Distinguished colleagues..." Acknowledge the divide in the room.
      *   *The GEB Concept:* Use the analogy of a sealed envelope or a museum label.
      *   *Inner:* The secret inside.
      *   *Outer:* The envelope/label.
      *   *Frame:* The agreement that this envelope contains a letter, not a threat.
      *   *The Twist:* We think we argue about the secret (Inner). Actually, we argue about the agreement (Frame).
      *   *The Philosophical Constraint:* Avoid saying the secret defines itself. Avoid saying the reader defines the secret. The *frame* defines the relationship.
      *   *Closing:* Challenge the room to examine their own frames.

  7.  **Polishing and Editing:**
      *   *Self-Correction on Hofstadter:* In GEB, the "Frame Message" is the signal that tells you *how* to decode the "Outer Message" to get the "Inner Message." Often, the Outer Message *is* the carrier. Let's be precise.
      *   *Refined Definition:*
          *   Inner: The intended content/meaning.
          *   Outer: The physical signal (ink, sound, artifact).
          *   Frame: The context that tells you *that* there is a message and *how* to unpack it.
      *   *Archival Application:*
          *   Inner: The historical reality or creator's intent.
          *   Outer: The archived document/object.
          *   Frame: The cataloging system, the provenance record, the shared language of the discipline.
      *   *Thesis:* Can we share the Frame? Or is my "cataloging logic" different from yours fundamentally?
      *   *Constraint:* Meaning isn't in the document (Inner alone) nor in my head (Subjective). It requires the Frame to bridge them. If the Frame is private, the bridge collapses.

  8.  **Final Review against Constraints:**
