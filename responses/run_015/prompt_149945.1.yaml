answer: |-
  Colleagues, distinguished guests, welcome.

  Looking around this room, I see a divide that is often mistaken for a gap between theory and practice. On one side, we have philosophers and cognitive scientists concerned with the architecture of meaning. On the other, curators and archivists concerned with the preservation of matter. We often assume we are here to discuss how to extract meaning from matter. But I propose we are here to discuss something far more precarious.

  To understand why, let us borrow a structural tool from Douglas Hofstadter. In analyzing how communication occurs, he distinguishes between three layers: the Inner Message, the Outer Message, and the Frame Message.

  In our context, the Inner Message is the truth we seek—the historical intent, the artistic vision, the data point hidden within the record. The Outer Message is the artifact itself—the letter, the photograph, the digital file, the object in the display case. It is the physical carrier.

  But neither of these is our primary problem today. The critical layer is the Frame Message. The Frame is the context that tells us *that* the Outer Message carries meaning at all, and *how* to decode it. It is the shared agreement that this ink on paper is a legal contract rather than a doodle; that this bone in a box is evidence of ritual rather than refuse.

  For decades, our debates have fixated on the Inner Message. We argue over what the artifact *really* says. We treat the Outer Message as a neutral vessel. But this workshop operates on a different constraint. We must acknowledge that meaning cannot reside purely inside the object, waiting to be dug out. Nor can it reside purely inside the subjective mind of the interpreter. The tripartite structure forbids both extremes. Meaning exists only in the transmission between the two, governed by the Frame.

  This leads to the central question of our gathering: Can an interpretive community genuinely share a Frame Message?

  We operate under the assumption that our frames are public—that when I catalog an item using a specific taxonomy, and you read that catalog, we are operating within the same structural logic. But what if Frames are necessarily private? What if my understanding of "provenance" and yours are structurally similar but fundamentally distinct codes?

  If Frames are private, then every Outer Message we exchange is already a form of mistranslation. We are not failing to find the Inner Message; we are failing to agree on the rules that allow the Inner Message to exist.

  This is why this workshop matters. We are not merely trying to better preserve the Outer Message, nor are we trying to finalize the Inner Message. We are here to test the stability of the Frame. We must determine whether we are building a shared language of interpretation, or merely juxtaposing private solipsisms behind a veneer of professional consensus.

  Over the next few days, I invite you to look past the artifacts. Look past the theories. Look at the space between them. Let us examine whether the frame holds, or whether we are all speaking different languages while pretending to read the same book.

  Thank you.
