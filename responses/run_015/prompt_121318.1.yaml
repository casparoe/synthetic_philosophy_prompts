      *   *Case 4:* Two independent models with conflicting probabilities (80% vs 30%). Conflict detected. -> **Meta-Evidence Update.**

  **Alternative Rule: The Conditional Rigidity Principle**

  An alternative rule that accommodates these judgments equally well is the **Conditional Rigidity Principle**. This rule dictates that belief revision depends on whether the agent's conditional beliefs about downstream propositions are invariant to the *mechanism* generating the probability shift.
  *   **Rule:** Apply the averaging rule (Jeffrey Conditionalization) if and only if the agent judges her conditional probabilities $P(Consequence | Hypothesis)$ to be **rigid** (independent of *how* or *why* the hypothesis probability changed). If the probability assignment itself carries information that alters these conditionals (e.g., by implicating specific error modes or model structures), treat the assignment as Meta-Evidence and update the structural beliefs first.
  *   **Fit:**
