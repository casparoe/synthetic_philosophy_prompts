      *   *Case 4:* With conflicting models, the probability of the hypothesis depends on *which model is correct*. Her conditional beliefs about the world likely depend on which model is accurate (e.g., Model 1 implies different causal structures than Model 2). Thus, conditionals are not rigid relative to the hypothesis alone. -> **Meta-Evidence Update.**

