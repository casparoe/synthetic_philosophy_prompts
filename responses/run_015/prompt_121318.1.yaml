  *   **Prediction by Conditional Rigidity Principle:** Her belief in the other five theorems depends on the status of Lemma $L$. The probability report about $P$ is not rigid with respect to $L$; the *reason* for $P$'s potential invalidity (a flaw in $L$) drastically changes her conditional beliefs about the other theorems compared to the reason for $P$'s validity. Because the "Invalid" state is not uniform regarding its structural implications, conditionals are not rigid. She should treat the report as **Meta-Evidence** about the reliability of Lemma $L$, updating her belief in $L$ first, rather than simply averaging on the validity of $P$.

