  Specifically, she will treat the study's report as fixing the probability of the proposition "The parameter lies within the reported interval" at ninety percent. She will then update her credence in the competing explanatory mechanisms (values below vs. above the threshold) by taking the weighted average of her prior conditional beliefs, using the probability mass distributed within the interval (derived from her prior) and the probability mass outside the interval as weights. She will not treat the report as meta-evidence about study quality, because there is no conflict between sources to trigger the protocol observed in her fourth judgment, and the transparency of methods aligns with the "trusted" status in her second judgment. Nor will she condition on the interval as a certainty (the third course), because the evidence is explicitly probabilistic (90%), matching the uncertain evidence structure of her second and third judgments which mandated averaging rather than strict conditionalization.

  **Implicit Rule: The Source Conflict Heuristic**

  The implicit rule that best explains her four prior judgments is the **Source Conflict Heuristic**. This rule dictates that the mode of belief revision depends primarily on the *relationship between evidence sources* rather than the content of the evidence itself.
  *   **Rule:** If the evidence comes from a single source (or multiple sources in agreement) that is deemed trusted or transparent, treat the probabilistic content as a direct constraint on the hypothesis partition and apply **Jeffrey Conditionalization** (the averaging rule). If the evidence comes from multiple independent sources that conflict, treat the outputs as **Meta-Evidence** regarding source reliability and update hierarchically.
