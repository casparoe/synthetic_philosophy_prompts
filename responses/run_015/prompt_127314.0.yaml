      *   *Evidence:* 3 Heads.
      *   *Discussion:* They tell each other "I think there's an 80% chance of Heads next" vs "I think 95%".
      *   *Theorem:* If they *really* trusted each other's reasoning and started with the *same* belief about the coin's nature, they couldn't hold different numbers.
