          *   *Better Selection:* **The "Broken Machine" scenario.** Two operators, same alarm lights, different conclusions about whether to shut down.
          *   *Best Selection:* **The "Weather Picnic" (Modified).** Two friends deciding whether to pack for rain. They check different apps (private info), then tell each other their probabilities.
          *   *Wait, the User's insight is about Priors.* The example needs to show that even with shared info, *starting beliefs* matter.
          *   *Revised Example:* **The "Biased Coin" vs. "Fair Coin" setup.**
              *   Scenario: We are flipping a coin.
              *   Person A thinks: "Coins are usually fair."
              *   Person B thinks: "Coins in this magic shop are usually biased."
