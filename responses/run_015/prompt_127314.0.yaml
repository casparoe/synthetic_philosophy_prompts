              *   They discuss. They know each other's estimates.
              *   They still disagree on the 6th flip.
              *   *Why?* Not the evidence (same). Not honesty (assumed). It's the *prior* belief about the shop.
              *   *Avoid:* Don't make it about gambling (moral issues). Make it about "predicting the next outcome."

      *   **Misconceptions & Deflections:**
          *   *Misconception 1:* "So if we disagree, you're irrational." -> *Deflect:* The theorem assumes rationality. If we disagree, we are testing the *limits* of the theorem, not the person.
          *   *Misconception 2:* "Common Knowledge = We both know." -> *Deflect:* Need the infinite loop (I know you know...). Use the "Muddy Children" or "Eye Color" logic simplified. Actually, for 40 mins, keep it to "We both know, and we both know that we both know, and we trust that."
