answer: |-
  There is no canonical, single-word term in epistemology or decision theory that captures this specific configuration. It is generally discussed as a species of **Special Pleading** or **Inconsistent Conditionalization**, but those labels are too broad for the structural nuance you are isolating. In the literature on model uncertainty and robust decision-making, it is sometimes gestured at under **Partition Dependence** or **Reference Class Tennis**, but neither describes the asymmetric deployment of a single hypothesis within a single expected-value (EV) calculation.

  For the purposes of your chapter, I recommend labeling this **Asymmetric Hypothesis Deployment (AHD)**.

  Below is the definition, the boundary conditions, the distinctions from similar concepts, and the analysis of the symmetric case.

  ### 1. Definition: Asymmetric Hypothesis Deployment

  **Asymmetric Hypothesis Deployment** occurs when a sceptical hypothesis ($H$) is admitted into the probability term ($P$) of a specific option's expected value calculation to reduce that probability, but is systematically withheld from the value term ($V$), from the probability terms of alternative options, or from any application that would increase the total expected value, without an explicit epistemic rule justifying the asymmetry.

  **The Configuration requires four conditions:**
  1.  **Selective Probability Discounting:** $H$ is used to lower $P(\text{Success})$ for the target option (e.g., "If we are in a simulation, the future will be terminated").
  2.  **Value Term Inertia:** $H$ is not used to adjust $V(\text{Impact})$ for the target option (e.g., ignoring that if we are in a simulation, the "beings" affected might be more numerous or the resources cheaper).
  3.  **Alternative Immunity:** $H$ is not applied to $P(\text{Success})$ for competing options (e.g., near-term interventions), even though $H$ entails risks for them as well.
  4.  **Valence Switching (Optional but common):** $H$ is treated as a reason-killer for Option A and a reason-generator for Option B without an account of why $H$ is epistemically "live" in one context and inert or constructive in another.

  ### 2. Distinctions from Similar Concepts

  You must distinguish AHD from the following to mark its edges:

  *   **Motivated Reasoning / Confirmation Bias:**
      *   *Difference:* Motivated reasoning is a psychological explanation for *why* an agent selects evidence. AHD is a structural description of *how* the evidence is processed once selected. An agent can commit AHD unintentionally through sloppy modeling, whereas motivated reasoning implies a directional goal.
      *   *Boundary:* If the author explicitly states, "I am applying $H$ here because it aligns with my prior preference," it is motivated reasoning. If they claim objective neutrality while applying $H$ inconsistently, it is AHD.

  *   **Pascal's Mugging:**
      *   *Difference:* Pascal's Mugging concerns the dominance of a tiny probability multiplied by an enormous value ($P \times V$). AHD concerns the *consistency* of the $P$ and $V$ inputs. AHD can occur with modest stakes; Pascal's Mugging requires extreme stakes.
      *   *Boundary:* If the argument is "The probability is small but the value is huge, so we must act," that is Pascal's Mugging. If the argument is "The probability is small (due to $H$) so we must not act," while ignoring that $H$ makes the value huge, that is AHD.

  *   **Debunking Arguments (Generalising Too Far):**
      *   *Difference:* Debunking arguments target the *justification* for a belief (e.g., "Your belief is caused by evolution, not truth"). The "generalises too far" objection notes that the debunker's own logic undermines their conclusion. AHD does not necessarily undermine the conclusion; it rigs the calculation.
      *   *Boundary:* A debunking argument says "You can't know $X$." AHD says "We will count $X$ as unlikely for this project but likely for that one."

  *   **Undercutting vs. Rebutting Defeaters:**
      *   *Difference:* This distinction classifies the *type* of evidence (attacking the link vs. attacking the claim). AHD is about the *distribution* of the defeater across the decision matrix.
      *   *Boundary:* You can have a consistent undercutting defeater that applies to all options. AHD is defined by the *failure* to apply the defeater consistently.

  *   **Substantive Risk Claims:**
      *   *Difference:* A claim that "Sims terminate early" is a substantive risk. Using that claim to discount long-term projects but not short-term projects (despite both facing termination risk) is AHD.
      *   *Boundary:* If the author models a hazard rate where risk accumulates over time, that is a substantive claim. If they apply the risk as a binary switch only to the long-term option, that is AHD.

  ### 3. Boundary Cases

  To diagnose AHD, you must rule out these principled variations:

  *   **The Principled Time-Horizon Discount (Not AHD):**
      *   *Scenario:* The hypothesis implies a constant hazard rate (e.g., 1% chance of termination per year).
      *   *Why it's not AHD:* The discount is applied to *all* future utility streams. Short-term projects are discounted slightly; long-term projects are discounted heavily. The asymmetry arises from the *time*, not the *option*.
      *   *Diagnostic:* Check if the short-term option is also discounted, even if negligibly.

  *   **Symmetric Hypothesis Adjustment (Not AHD):**
      *   *Scenario:* The author admits $H$ (Simulation), reduces $P$ (termination risk), but increases $V$ (digital beings are cheaper to create/save, or influence is acausal).
      *   *Why it's not AHD:* The hypothesis is allowed to affect all terms of the EV equation.
      *   *Diagnostic:* Check if $V$ is re-evaluated conditional on $H$.

  *   **Hypothesis as Pure Booster (Not AHD, but potentially reckless):**
      *   *Scenario:* $H$ is used only to increase EV (e.g., "If we are in a sim, we can signal the simulators").
      *   *Why it's not AHD:* It lacks the *deflationary* asymmetry. It may be optimistic bias, but it is not the specific "reason-killer/reason-generator" switch you are isolating.
      *   *Diagnostic:* Check if $H$ is ever used to lower EV in the same argument.

  *   **Explicit Bad Reason (AHD):**
      *   *Scenario:* The author says, "We apply $H$ to long-term projects because they are more speculative," while ignoring that $H$ makes the *foundation* of short-term projects equally speculative.
      *   *Why it is AHD:* The justification is offered but fails to account for the structural impact of $H$ on the comparison class.
      *   *Diagnostic:* The reason given does not logically entail the asymmetry in application.

  ### 4. Diagnostic Criteria: Opportunistic vs. Principled

  To diagnose the opportunistic version of AHD in a text, look for the following three markers:

  1.  **The One-Term Update:** The hypothesis modifies the probability of the outcome ($P$) but leaves the magnitude of the outcome ($V$) at its "realist" baseline. (e.g., "We might be in a sim" $\rightarrow$ "Future might end" $\rightarrow$ "But the number of beings in that future is still the physical estimate.")
  2.  **The Comparison Class Exemption:** The hypothesis is not applied to the counterfactual or alternative options. (e.g., "Long-term aid is risky because of sims" vs. "Short-term aid is safe," without acknowledging short-term aid also fails if the sim terminates tomorrow.)
  3.  **The Epistemic Status Switch:** The hypothesis is treated as a serious probability weight when it lowers EV, but treated as speculative fiction or irrelevant when it might raise EV (or vice versa), without a stated threshold for "epistemic liveliness."

  ### 5. The Symmetry Question

  **When the hypothesis is applied symmetrically, does the dampening of far-future fanaticism survive?**

  **Generally, no.** It typically relocates the fanaticism rather than eliminating it.

  If you apply the Simulation Hypothesis symmetrically:
  1.  **Probability ($P$):** You must discount the probability of a long, physical future (termination risk). This dampens *temporal* longtermism.
  2.  **Value ($V$):** You must adjust the value term. If we are in a simulation, the "physics" governing resource constraints may not apply. The simulators may be able to instantiate vastly more conscious beings than physical physics allows. Alternatively, if acausal trade is possible, your actions here might influence the simulators or other simulations.
  3.  **Result:** The reduction in $P$ is often outweighed by the inflation in $V$. The "fanaticism" (extreme expected value) shifts from **influencing the physical future of humanity** to **influencing the simulator / multiverse / logical space**.

  Therefore, symmetric application rarely restores "common sense" modesty. It transforms **Temporal Fanaticism** (affecting trillions of future humans) into **Modal Fanaticism** (affecting countless simulated ancestors or acausal partners). The dampening of the *specific* long-termist project survives, but the dampening of *high-stakes expected-value reasoning* does not.
