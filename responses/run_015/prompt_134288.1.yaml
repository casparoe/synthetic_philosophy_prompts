answer: |-
  **S Tier: #2 (The counterfactual-stability trap)**
  It naturalizes the present outcome as the default state of reality, rendering past alternatives unintelligible rather than just unsuccessful.

  **A Tier: #1 (The institutional-genealogy trap)**
  It disguises teleology as conceptual continuity, allowing progress narratives to hide inside seemingly neutral category definitions.

  **B Tier: #4 (The survivor-selection bias)**
  It conflates archival survival with historical significance, though careful scholars usually flag this as a methodological limitation rather than a truth claim.

  **C Tier: #3 (The moral-anachronism grade)**
  It triggers immediate defensive reflexivity in modern scholars, making it the easiest bias to spot and self-correct before publication.

  ***

  **On Swapping #2 and #3**
  I would swap them if you argue that moral consensus no longer functions as explicit judgment but as **problem-formation**: if current ethics silently dictate *which* pasts deserve recovery rather than how actors are judged, #3 becomes a structural filter as invisible as #2.

  **Where My Reasoning Fails**
  My ranking assumes "reflexive" scholars are equally vigilant across all categories, but disciplinary blind spots matter: in intellectual history, #1 is often embraced as method rather than seen as a trap, and in social history, #2 is the water we swim in, making both harder to spot than I've admitted. Additionally, I may be underestimating how current academic incentives reward implicit moralizing (#3), making it feel like "justice" rather than bias to the scholar themselves.
