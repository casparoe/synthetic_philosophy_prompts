answer: |-
  This is a sharp diagnosis. You have identified that Lexical-Threshold Negative Utilitarianism (LTNU) often hides its hardest problems behind the lexical firewall. By focusing on the "distributed-subthreshold" problem, you are effectively asking whether the *reasons* for lexical priority (the special moral status of suffering) survive even when the intensity drops below the lexical line, specifically regarding aggregation.

  If I were advising a three-year conceptual research agenda on this, I would rank your three lines of inquiry as follows:

  1.  **The Commensurability/Arbitrariness Problem (Line 1)**
  2.  **The Distributed-Subthreshold Aggregation Asymmetry (Line 2)**
  3.  **Downstream Population Ethics/Longtermism (Line 3)**

  Here is the reasoning for this ordering, based on upstreamness, philosophical tractability, and the potential for confidence-shifting arguments.

  ### 1. First Priority: Commensurability and Threshold Arbitrariness
  **Reasoning:** This is the foundational bottleneck. If this fails, the rest of the project is moot.

  *   **Upstreamness:** Maximum. A lexical threshold posits a boundary condition where the moral calculus changes discontinuously. To set a boundary between "lexical suffering" and "sub-lexical suffering," you must be able to measure suffering on a scale that allows for a cutoff. However, to claim that this suffering lexically outweighs *pleasure*, you implicitly posit a comparison between the two metrics at the boundary.
  *   **The Fatal Flaw:** If pain and pleasure are truly incommensurable (different qualitative kinds, not just opposite ends of one rod), then a threshold $T$ implies a hidden exchange rate. If $X$ amount of pain is the threshold, and it lexically outweighs *any* amount of pleasure, you are effectively saying the disvalue of $X$ pain is infinite relative to pleasure. But if you then allow sub-threshold pain to aggregate against pleasure (as standard LTNU often does), you are reintroducing a finite exchange rate. This creates a contradiction: the metric is discontinuous at $T$, but continuous below $T$.
  *   **Tractability:** Low, but high value. This is hard meta-axiology. You aren't looking for empirical data; you are looking for a coherence proof.
  *   **Confidence Shifter:** A decisive thought experiment here would be a "Boundary Sorites." If you can construct a spectrum of pain states where no adjacent pair is distinguishable, but the first is lexical and the last is not, you force the theorist to admit the threshold is arbitrary. If the threshold is arbitrary, the lexical priority is unjustified. Conversely, if you can defend "qualitative discontinuity" (e.g., a specific phenomenological breakdown occurs at the threshold that justifies the lexical jump), you save the theory.
  *   **Why First:** You cannot solve how sub-threshold suffering aggregates (Line 2) if you haven't established that the threshold itself is a coherent concept rather than an ad hoc stopgap to avoid the Repugnant Conclusion.

  ### 2. Second Priority: Distributed-Subthreshold Aggregation Asymmetry
  **Reasoning:** This is the core theoretical innovation you are hinting at, but it depends on (1) being solvable.

  *   **Upstreamness:** High, but conditional. This addresses the specific "distributed-subthreshold" wrinkle. Standard utilitarianism assumes a symmetric aggregation function: $-1$ utility cancels $+1$ utility. LTNU usually says severe pain breaks this symmetry. Your question is whether *mild* pain also breaks it.
  *   **The Philosophical Work:** This requires defending a **Dual-Asymmetry View**. You would need to argue that even below the lexical threshold, the aggregation function for suffering is non-linear (or has a higher weight) compared to pleasure. For example, 1 billion mild headaches might outweigh 1 billion mild joys, even if 1 headache does not outweigh 1 joy.
  *   **Tractability:** Medium. This is more tractable than commensurability because it relies on intuitive case judgments rather than meta-ethical metaphysics. You can test this against "intuition pumps."
  *   **Confidence Shifter:** The case that moves the needle here is a "Scale vs. Intensity" trade-off. If you can show that our moral intuitions demand that volume of suffering matters *more* than volume of pleasure (even at low intensities), you justify a revision of LTNU that incorporates asymmetric aggregation below the threshold. If intuitions suggest symmetry returns below the threshold, then LTNU collapses into standard Negative Utilitarianism or Standard Utilitarianism in the long run.
  *   **Why Second:** This is where the novel philosophy lies. If (1) is solved, (2) determines the *shape* of the theory. However, it is secondary because if the threshold is incoherent (Line 1), arguing about what happens below it is like arranging furniture in a burning house.

  ### 3. Third Priority: Downstream Population Ethics and Longtermism
  **Reasoning:** This is application, not foundation. It should be deprioritized for a purely conceptual project.

  *   **Upstreamness:** Low. These are consequences of the axiology, not determinants of its truth.
  *   **Tractability:** High. It is easier to model the outcomes of a theory than to justify the theory itself.
  *   **Why Deprioritize:** Settling whether LTNU implies we should prioritize wild animal suffering over existential risk mitigation (for example) does not tell us if LTNU is *correct*. It only tells us what it *costs*.
      *   Many researchers make the mistake of working backward: "I want this longtermist conclusion, so I will tweak the threshold to get it." This is motivated reasoning.
      *   For a 3-year conceptual deep dive, you want to find the *truth conditions* of the view, not its policy implications. If the theory breaks on commensurability (Line 1), it doesn't matter what it implies for AI safety or population ethics.
  *   **When to tackle this:** Only after you have a stable version of the axiology that survives (1) and (2). Then, and only then, do you check if the resulting view is action-guiding or leads to absurdities (like implying we should extinguish humanity to prevent future mild headaches).

  ### Summary of the Strategy

  **Year 1: The Meta-Axiological Foundation (Line 1)**
  Focus entirely on the coherence of the threshold. Do not worry about aggregation yet.
  *   *Goal:* Determine if a non-arbitrary threshold is possible without presupposing a global common metric.
  *   *Key Argument to Develop:* The "Hidden Exchange Rate" argument. If the threshold allows trade-offs below the line but forbids them above the line, is there a principled difference in *kind* or just *degree*? If it's degree, lexicality is unjustified. If it's kind, what is the phenomenological marker?

  **Year 2: The Aggregation Mechanism (Line 2)**
  Assuming a threshold is defensible, analyze the sub-threshold zone.
  *   *Goal:* Determine if suffering and pleasure share an aggregation function below the threshold.
  *   *Key Argument to Develop:* The "Distributed-Subthreshold" case. Construct scenarios where billions of sub-lexical pains compete against billions of sub-lexical pleasures. If intuition favors the pain side, you have evidence for asymmetric aggregation. If intuition is symmetric, LTNU loses its distinctive "negative" character in the long-term future (where most experiences might be sub-lexical).

  **Year 3: Stress Testing (Line 3)**
  Apply the refined theory to population ethics.
  *   *Goal:* Check for collapse into the Repugnant Conclusion or the "Sadistic Conclusion."
  *   *Key Argument to Develop:* Does your revised LTNU (with asymmetric sub-threshold aggregation) avoid the standard pitfalls of Negative Utilitarianism? If it avoids them by becoming too complex, you have a pragmatic reason to reject it.

  ### Final Advice on Deprioritization
  I strongly advise against spending significant time on **Line 3** until Years 1 and 2 are settled. The literature is already saturated with papers on "What does Negative Utilitarianism imply for AI?" or "How does LTNU handle population size?"

  Those papers often assume the axiology is coherent and just explore the consequences. Your insight is that the axiology *itself* might be incoherent due to the commensurability and aggregation issues. That is a much more fundamental contribution. If you prove that the threshold presupposes a commensurability that doesn't exist, you haven't just adjusted a parameter in population ethics; you've undermined the theoretical basis for a significant chunk of effective altruism and longtermist risk analysis. That is where the philosophical leverage is.
