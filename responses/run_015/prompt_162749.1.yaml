answer: |-
  # JOINT STATEMENT ON STATUTORY INTERPRETATION
  **Subject:** *State v. Unknown* (Hypothetical)
  **Statute:** "Any person who knowingly brings a dangerous weapon onto school property is guilty of a felony."

  ### I. AGREED CLAIMS & DEFINITIONS

  1.  **Fidelity to Law:** Both sides agree the judge's role is to apply the law enacted by the legislature, not to enact policy preferences from the bench.
  2.  **Textual Primacy:** Both sides agree interpretation must begin and end with the text of the statute. Extratextual sources (purpose, history, consequences) are tools to understand the text, not to replace it.
  3.  **Definition of Textualism (Temporal Constraint):** For the purposes of this seminar, the **Textualist** position is defined as seeking the **Ordinary Meaning of the words to a reasonable reader at the time of enactment.**
      *   *Note:* This is explicitly *not* Originalism in the constitutional sense (which often seeks subjective intent or original expected application). The Textualist here seeks the public linguistic meaning of the words when passed, regardless of what the drafters secretly hoped those words would achieve.
  4.  **Definition of Purposivism:** The **Purposivist** position is defined as interpreting the text to advance the **Abstract Point of the statute** (the mischief it aimed to cure), even if this requires narrowing or expanding the semantic range of the words.
  5.  **The Four Test Scenarios:** Both sides agree to apply their methods to the following facts:
      *   *S1 (Teacher/Knife):* Teacher keeps folding knife in locked glove compartment in school parking lot.
      *   *S2 (Senior/File):* Senior has a two-inch metal nail file in her backpack.
      *   *S3 (Shop Teacher/Cutter):* Shop teacher uses a box cutter to open supply crates in his classroom.
      *   *S4 (Parent/Rifle):* Visiting parent has an unloaded hunting rifle in a locked case in her trunk while picking up her kid.

  ---

  ### II. DISAGREEMENTS TABLE

  | Issue / Crux | Textualist Position | Purposivist Position | The Crux (Where we diverge) | Concrete Evidence / Case Bearing on Crux | Predictions (S1–S4) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Meaning of "Dangerous Weapon"** | The term refers to objects objectively capable of inflicting death or serious injury, based on ordinary usage at enactment. Context of possession is secondary to the object's inherent nature. | The term refers to objects that pose a *risk* to school safety in the specific context of possession. An object is only a "weapon" if its presence undermines the statute's safety goal. | **Objective Capability vs. Contextual Risk:** Is the statute regulating *things* or *threats*? | **Evidence:** A 1990 corpus linguistics database of state criminal codes showing whether "weapon" collocated with "tool" or "instrument." <br>**Case:** *State v. Tool* (Hypothetical): Ruling on whether a carpenter's hammer is a weapon per se. | **Text:** S1 (Guilty), S2 (Not Guilty), S3 (Guilty), S4 (Guilty).<br>**Purp:** S1 (Not Guilty), S2 (Not Guilty), S3 (Not Guilty), S4 (Not Guilty). |
  | **2. Scope of "School Property" & "Brings Onto"** | "School property" extends to the legal property line (including parking lots). "Brings onto" is satisfied by voluntary transport to that location, regardless of whether the item is removed from the vehicle. | "School property" extends to areas under school control where safety is implicated. "Brings onto" implies introducing the weapon into the sphere of student interaction or school security risk. | **Boundary Lines vs. Functional Zones:** Does the statute govern *land* or *safety zones*? | **Evidence:** The jurisdiction's general property statutes defining "premises" in other regulatory contexts.<br>**Case:** *State v. Parking* (Hypothetical): Ruling on whether a locked car trunk constitutes "possession on premises." | **Text:** S1 (Guilty), S4 (Guilty).<br>**Purp:** S1 (Not Guilty), S4 (Not Guilty). |
  | **3. Clear Text vs. Absurd Result** | If the text is clear (e.g., a rifle is plainly a dangerous weapon on school property), the court must apply it even if the specific outcome (arresting a safe parent) seems absurd. Only the legislature can fix overbreadth. | If the application leads to a result every legislator would disavow (e.g., arresting a safe parent), the text is presumed ambiguous. The court must narrow the reading to avoid absurdity. | **Judicial Role:** Is the judge a *faithful agent* of the words or a *faithful agent* of the legislative plan? | **Evidence:** Legislative floor debate transcripts where a sponsor explicitly answers a question about "hunting rifles in trunks." <br>**Case:** *State v. Absurd* (Hypothetical): A prior ruling where the court invoked the "absurdity doctrine" to override plain meaning. | **Text:** S4 (Guilty, despite disavowal).<br>**Purp:** S4 (Not Guilty, citing disavowal). |

  ---

  ### III. THEORETICAL DEEP DIVES (For Seminar Discussion)

  **1. Disagreement on Meaning vs. Gap-Filling**
  *   **The Dispute:** We disagree on whether the statute *has* a gap.
  *   **Textualist View:** The text provides a complete algorithm. If the object fits the definition of "dangerous weapon," the law applies. Any "gap" is actually just a hard case where the judge dislikes the outcome.
  *   **Purposivist View:** Language is inherently open-textured. The "meaning" is incomplete without the purpose to select among plausible semantic ranges. The gap exists *within* the language, not outside it.
  *   **Verbal Dispute:** We may be talking past each other on the word "Meaning." The Textualist means *semantic content* (what the words denote). The Purposivist means *communicative content* (what the lawgiver intended to communicate). If we agree on this distinction, 20% of our debate vanishes.

  **2. Definition of "Purpose"**
  *   **Expected Applications vs. Abstract Point:**
      *   The **Textualist** rejects "Expected Applications" as a form of secret intent (Originalism). If the legislature didn't write the exception into the text, the expectation is irrelevant.
      *   The **Purposivist** argues for the **Abstract Point** (e.g., "Prevent School Violence"). However, the Purposivist admits a constraint: If the Abstract Point contradicts the *specific* text (e.g., text bans "any person," purpose suggests "only students"), the text usually wins unless the result is absurd.
      *   **Agreement:** Neither side believes "Purpose" allows a judge to rewrite the statute to match their own policy preferences.

  **3. Clear Text vs. Disavowed Application (The Parent/Rifle Scenario)**
  *   **Scenario:** The text clearly covers the rifle. Every legislator says, "We didn't mean to arrest parents with locked rifles."
  *   **Textualist Handling:** The statute is overbroad. The judge must convict. The "clear statement rule" suggests that if legislators wanted an exception for locked trunks, they knew how to write one (see: federal Gun-Free School Zones Act).
  *   **Purposivist Handling:** The specific disavowal proves the text does not capture the purpose. The word "brings" is ambiguous regarding locked trunks. The judge acquits to align with the legislative plan.
  *   **The Stall Point:** Students ask, "Why follow words if they contradict the plan?" Textualist answer: "Democracy requires legislators to write the plan down." Purposivist answer: "Democracy requires judges to effectuate the plan the legislators voted for."

  **4. Falsification Conditions (Evidence Against Our Own Views)**
  *   **What would change the Textualist's mind?**
      *   *Evidence:* Corpus linguistics data from the year of enactment proving that "dangerous weapon" was a term of art that *excluded* tools of trade (like box cutters) in 90% of contemporary statutes.
      *   *Why:* This would show the "Ordinary Meaning" was actually a "Technical Meaning," which textualism respects.
  *   **What would change the Purposivist's mind?**
      *   *Evidence:* A legislative committee report explicitly stating, "We chose broad language *specifically* to give prosecutors discretion to charge cases like the locked rifle scenario, even if we personally dislike it."
      *   *Why:* This would show the "Abstract Point" *was* to grant broad discretion, making the harsh application consistent with the purpose.
