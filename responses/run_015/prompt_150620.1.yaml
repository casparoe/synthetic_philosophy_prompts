answer: |-
  The argument your uncle is making is indeed a variation of **Pascal's Wager**, the famous pragmatic argument formulated by the 17th-century French philosopher Blaise Pascal. However, you have correctly identified a crucial divergence: Pascal argued that one should *cultivate belief* through habit until faith becomes genuine. Your uncle is arguing for *ritual compliance* without belief.

  This specific behavior—hedging against divine punishment through low-cost ritual despite skepticism—is widespread enough to warrant its own reconstruction. Let's break down the implicit theory, the philosophical tensions, and what happens if we remove the assumption that belief is voluntary.

  ### 1. Reconstructing the Implicit Theory: "Spiritual Insurance"

  Your uncle's behavior relies on a specific decision-theoretic model we might call **Spiritual Insurance**. For this to be rational *to him*, it presupposes the following axioms:

  *   **Axiom of Asymmetric Payoff:** The cost of the ritual (one hour/week) is finite and negligible. The payoff (eternal salvation) or loss (eternal damnation) is infinite. In expected value calculations, any non-zero probability multiplied by infinity yields infinity. This explains the mismatch you noticed: he ignores 2% chances in normal life because the payoffs there are finite (e.g., winning a lottery vs. wasting a ticket). In religion, the payoff swamps the probability.
  *   **Axiom of Mechanical Efficacy:** The ritual works *ex opere operato* (by the work performed). It presupposes that the "system" of salvation accepts the transaction of attendance even if the internal state (belief) is missing.
  *   **Axiom of Specificity:** It assumes the Christian God (specifically the Catholic one, given the Mass) is the only relevant candidate. It ignores the "Many Gods Objection": if there is a 2% chance the Christian God exists, there might be a 2% chance a God exists who punishes church-goers as idolaters.
  *   **Axiom of Benevolent Contempt:** This is the most fascinating bit. Your uncle admits a God who rewards this calculation is "contemptible." Yet he bets on it. This presupposes that God's *mercy* overrides His *integrity*. He is betting that God is too nice to punish a hypocrite, even if hypocrisy is technically a sin.

  ### 2. What Does This Practice Presuppose About Belief?

  You asked whether this presupposes that belief is voluntary. The answer is nuanced.

  **Pascal's Original Wager** presupposes **Doxastic Voluntarism** (the idea that we can choose what to believe). Pascal knew you couldn't just "decide" to believe, so he advised taking holy water and attending mass to *numb the intellect* and allow belief to grow naturally.

  **Your Uncle's Wager** does **not** require Doxastic Voluntarism. In fact, it works *better* if belief is involuntary. If he cannot force himself to believe, ritual compliance is the only lever left to pull. His strategy presupposes that **orthopraxy (right action) can substitute for orthodoxy (right belief).**

  This aligns with certain theological frameworks but contradicts others:
  *   **Licensed by Sacramental Theology:** In Catholicism (where he is attending Mass), there is a concept that sacraments confer grace objectively, provided there is no "obex" (obstacle) of mortal sin. While contrition is usually required for forgiveness, your uncle may be operating on a folk-theology version of this: "Show up, and the machine works."
  *   **Licensed by Cultural Religion:** Sociologically, this treats religion as an ethnic or tribal insurance policy rather than a truth claim. It presupposes God cares more about *belonging* than *believing*.
  *   **Contradicted by Protestant/Pietist Theology:** Most evangelical traditions argue that "without faith it is impossible to please God." In this framework, your uncle's wager is not just useless; it is offensive.

  ### 3. The "Many Gods" and Probability Mismatch

  You noted that he wouldn't act on a 2% chance elsewhere. As mentioned, **Expected Utility Theory** explains this: $0.02 \times \text{Finite} = \text{Ignore}$; $0.02 \times \text{Infinite} = \text{Act}$.

  However, the **Many Gods Objection** is the fatal flaw in his implicit theory. By choosing the Catholic Church, he is implicitly assigning a probability of near-zero to all other deities.
  *   If he hedges against the Christian God, he might be antagonizing a God who demands exclusive devotion (e.g., Allah, or the God of Calvinism).
  *   If he hedges against a God who punishes hypocrites, he loses.
  *   **Why this specific hedge?** It presupposes **Cultural Proximity.** He isn't calculating all possible gods; he is calculating the god of his culture. The "2%" isn't a mathematical derivation; it's a heuristic for "the local superstition might be real."

  ### 4. Overlapping Theories: What Licenses This Behavior?

  Several distinct philosophical or theological theories could license your uncle's behavior, even if they disagree on *why* it works:

  | Theory | Why it licenses the behavior | Where it diverges from Uncle |
  | :--- | :--- | :--- |
  | **Pascal's Wager** | Rational to minimize infinite risk. | Pascal wants you to *believe* eventually; Uncle is fine staying skeptical. |
  | **Catholic Sacramentalism** | Grace is transmitted through ritual. | Church teaches contrition is needed for salvation; Uncle lacks it. |
  | **Pragmatism (William James)** | Truth is what works/is beneficial. | James argued for a "will to believe" that feels genuine, not cynical calculation. |
  | **Social Signaling** | Church attendance signals trustworthiness to the community. | Uncle doesn't seem to care about the social benefit, only the divine payoff. |
  | **Maximin Decision Rule** | Choose the option where the worst outcome is the least bad. | Worst outcome of Mass: boredom. Worst outcome of Atheism: Hell. |

  The bit that **all** these theories license is the **instrumentalization of religion.** They all treat religious practice as a means to an end (safety, grace, truth, social standing) rather than an end in itself (worship for worship's sake).

  ### 5. What If Belief Isn't Up to Us?

  If we accept **Doxastic Involuntarism** (the widely held philosophical view that you cannot simply choose to believe something you find untrue), the landscape shifts:

  1.  **Pascal's Wager Collapses:** If you cannot cultivate belief, you cannot win the wager in the long run, because a God who requires faith will not be satisfied by forced belief.
  2.  **The Uncle's Strategy Becomes the *Only* Strategy:** If belief is involuntary, ritual is the only variable under voluntary control. His strategy becomes more robust than Pascal's *if* the deity values compliance over faith.
  3.  **The "Contemptible God" Paradox Deepens:** If belief is involuntary, then a God who punishes atheists for lacking belief is unjust. Therefore, your uncle is actually betting on a God who is **just enough to excuse involuntary unbelief, but specific enough to require Sunday attendance.** This is a very narrow theological niche.

  ### 6. The Core Contradiction

  The most telling part of your uncle's statement is: *"He thinks a God who'd reward that kind of calculation would be contemptible."*

  This reveals that his implicit theory is not actually about what is **True**, but about what is **Safe**. He is not betting on the God he thinks exists; he is betting on the God he thinks is **most likely to accept a bribe.**

  He is effectively saying: "I believe the true God would reject me for this. But I hope there is a *different* God—a slightly incompetent or overly merciful one—who will accept this transaction."

  **Summary of the Implicit Theory:**
  1.  **Risk:** Infinite loss is possible.
  2.  **Cost:** Finite effort is acceptable.
  3.  **Mechanism:** Ritual efficacy is independent of internal belief (Magic/Sacrament over Faith).
  4.  **Deity Profile:** The God in question values tribal affiliation over intellectual honesty.

  **What would have to change?**
  If it turns out belief isn't up to us (which it likely isn't), and if the dominant theological view is correct (that God requires faith/truth, not just presence), his hedge fails. He is buying fire insurance for a house that is already burning down, paying the premium in a currency the insurer doesn't accept. He is acting on the hope that the "Divine Insurance Company" is run by bureaucrats who check attendance sheets rather than a Judge who reads hearts.

  In short, your uncle isn't practicing theology; he is practicing **risk management.** He has identified a low-cost, high-reward asymmetry and exploited it, fully aware that it insults the very entity he is trying to appease. He is betting that God is more merciful than He is just—a gamble that, historically, many theologians would say is the only one that has ever worked.
