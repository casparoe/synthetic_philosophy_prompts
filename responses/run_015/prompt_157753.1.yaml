answer: |-
  Your observation is astute: institutional protocols are rarely philosophically neutral. They are operationalized ethics, often crystallizing specific theoretical commitments that remain implicit in the daily work of researchers. The two-tier framework you describe encodes a **Sliding Scale Model of Valid Consent**, which functions analogously to the thesis of **Pragmatic Encroachment** in epistemology.

  Below is a reconstruction of the implicit philosophical architecture, an assessment of its internal consistency, and a distinction between settled and contested claims in the literature.

  ### 1. The Implicit Theory: Risk-Sensitive Normativity

  The framework's core justification—that high stakes "raise the normative threshold" such that standard disclosure and voluntariness are "no longer sufficient"—presupposes that the **validity conditions of consent are context-sensitive.**

  In standard invariant accounts (often associated with liberal individualism), consent is a binary moral transformation: if Agent A meets conditions $X, Y, Z$ (disclosure, competence, voluntariness), then Agent B is permitted to act. The moral status of the act changes regardless of the risk involved.

  Your framework rejects this invariance. It presupposes that the *stringency* of the conditions $X, Y, Z$ varies with the magnitude of the risk. This aligns with the **Sliding Scale Model of Competence**, originally articulated by Buchanan and Brock (1989), but extended here to the conditions of consent itself.
  *   **Low Stakes (Tier A):** The threshold for "sufficient understanding" and "voluntariness" is low. Presumption of competence is adequate.
  *   **High Stakes (Tier B):** The threshold is high. Presumption is replaced by verification.

  **Pragmatic Encroachment Analogy:**
  In epistemology, pragmatic encroachment argues that whether a subject *knows* a proposition can depend on the practical stakes of being wrong (e.g., you might "know" the bank is open on Saturday for a casual deposit, but not if your mortgage check will bounce otherwise).
  *   **The Framework's Commitment:** This framework commits to an ethical analog: whether a subject has *validly consented* depends on the stakes of the intervention. In Tier B, the "cost of error" (lasting cognitive alteration) is so high that the evidentiary bar for establishing consent is raised to the point where it effectively alters the validity conditions.

  ### 2. Analysis of Specific Provisions

  #### A. Deception
  *   **Framework Practice:** Permitted in Tier A (with debriefing); Prohibited in Tier B.
  *   **Implicit Theory:** This treats deception as **pro tanto wrong but defeasible.** It assumes deception undermines autonomy, but that this undermining is permissible if the risk is low and the scientific value is high (a consequentialist weighing). However, in Tier B, the autonomy violation is treated as **categorically incompatible** with the heightened protection required for high-risk interventions.
  *   **Consistency Check:** There is a tension here. If deception vitiates autonomy, it is unclear why risk level should matter. A Kantian would argue deception treats the subject as a mere means regardless of risk. The framework resolves this by prioritizing *outcome safety* in Tier B over *procedural purity*, implying that in Tier A, the autonomy violation is "worth it," but in Tier B, the risk makes any autonomy violation unacceptable.

  #### B. Compensation (Coercion and Undue Influence)
  *   **Framework Practice:** Tier A allows inducement (150% wage); Tier B allows only reimbursement (lost wages).
  *   **Implicit Theory:** This reflects a **Vulnerability Model of Undue Influence.** It assumes that financial offers are not coercive in themselves (which requires a threat) but can become "unduly influential" if they cloud judgment regarding significant risk.
  *   **The Logic:** In Tier A, the risk is low, so a high payment does not dangerously distort decision-making. In Tier B, the risk is high; therefore, a high payment might induce a subject to accept a risk they would otherwise refuse. The cap at "lost wages" aims to restore the subject to their baseline economic position without creating a surplus that acts as an inducement.
  *   **Consistency Check:** This is internally consistent *if* one accepts that the moral danger of money is proportional to the risk being purchased.

  #### C. Competence
  *   **Framework Practice:** Tier A presumes competence (signature); Tier B verifies competence (audit).
  *   **Implicit Theory:** This is the most philosophically standard element. It directly instantiates the **Sliding Scale Model of Competence.** Competence is not a global status but decision-relative. One can be competent to consent to a blood draw (Tier A) but not to a neurofeedback loop that alters personality (Tier B).
  *   **Consistency Check:** Highly consistent with mainstream bioethical theory.

  ### 3. Settled vs. Contested Claims

  It is crucial to distinguish where the literature agrees and where it diverges, as your framework treats some contested claims as operational facts.

  | Feature | Relatively Settled (Consensus) | Genuinely Contested (Disputed) |
  | :--- | :--- | :--- |
  | **Competence** | Competence is decision-relative, not global (Buchanan & Brock). Higher risk requires higher evidence of understanding. | The precise metric for "sufficient understanding." Is it comprehension of facts or appreciation of consequences? |
  | **Deception** | Deception generally requires strong justification and debriefing. It is prima facie problematic. | Whether deception *invalidates* consent entirely or merely creates a defeasible presumption. Some argue deception makes consent impossible *per se* (Faden & Beauchamp); others allow it if risk is minimal. |
  | **Compensation** | Payment should not be coercive. Reimbursement for expenses/time is standard. | Whether "undue inducement" exists. Some argue an offer cannot be coercive/undue if it makes the subject better off (Wertheimer); others argue it can impair voluntariness (Wilkinson). |
  | **Stakes & Validity** | Regulatory oversight (e.g., IRB/Common Rule) scales with risk. | **Pragmatic Encroachment on Consent:** Whether the *moral validity* of consent changes with stakes, or only the *evidentiary burden* to prove it. The framework assumes the former ("no longer sufficient"), which is philosophically contentious. |

  **Crucial Distinction:** The framework claims that in Tier B, disclosure and non-coercion are *not sufficient*.
  *   **Invariant View (Contested Counterpoint):** Disclosure and non-coercion *are* sufficient for valid consent in both tiers. In Tier B, we simply require *more evidence* that these conditions were met (hence the audit). The framework conflates the *conditions* of consent with the *verification* of consent.
  *   **Encroachment View (Framework's View):** The conditions themselves change. In Tier B, you need Disclosure + Non-coercion + *Verified Stability of Will*.

  ### 4. Internal Consistency Assessment

  The framework is largely consistent *if* one accepts the premise of Risk-Sensitive Normativity. However, there is a friction point between the Deception and Compensation rules.

  *   **The Tension:** The Compensation rule assumes that high payment + high risk = exploitation/invalid consent. The Deception rule assumes that deception + low risk = valid consent.
  *   **The Inconsistency:** If the goal is protecting Autonomy, deception is a direct violation of autonomy (manipulation of information), whereas high payment is an external inducement. The framework prioritizes protecting the subject from *physical/cognitive harm* (Tier B risks) over protecting the *procedural integrity of the will* in Tier A.
  *   **Verdict:** The framework is consistent with a **Paternalistic Consequentialism** (protect well-being primarily, autonomy secondarily) rather than a **Deontological Libertarianism** (protect autonomy primarily, well-being secondarily). It is philosophically coherent, but it is not neutral; it favors well-being in the trade-off.

  ### 5. Counterfactual: Switching to a Uniform Account

  If you replaced the stake-sensitive theory with a **Uniform Invariant Account** (where consent conditions are fixed regardless of risk), specific procedural changes would be required. Let us assume a Uniform Account defined by:
  1.  **Deception:** Always invalidates consent (Kantian/Strict View).
  2.  **Compensation:** Coercive only if it eliminates the ability to refuse (Economic Necessity View).
  3.  **Competence:** Standardized threshold for all research adults.

  **Required Procedural Changes:**

  *   **Tier A (Low Risk):**
      *   **Deception:** Must be **eliminated.** Even limited deception would be prohibited. Protocols would require full disclosure of aims upfront.
      *   **Compensation:** Could **increase.** If coercion is defined only by economic necessity, the 150% cap is unnecessary. Subjects could be paid market rates or higher, provided they are not destitute.
      *   **Competence:** The signature requirement remains, but the *justification* changes from "low stakes allow presumption" to "all adults are presumed competent."

  *   **Tier B (High Risk):**
      *   **Deception:** Remains prohibited (convergence with current practice).
      *   **Compensation:** Could **increase.** Under a uniform view, if a subject is competent, they should be allowed to accept high risk for high pay. The "lost wages" cap would be removed, perhaps replaced by a standard market rate for high-risk labor. The paternalistic protection against "bad deals" is removed.
      *   **Competence:** The two-stage audit might be **standardized across both tiers** or **removed from Tier B.**
          *   *Option 1:* If competence is a fixed bar, the Tier B audit is unnecessary bureaucracy unless Tier A subjects are also audited.
          *   *Option 2:* If the audit is kept, it must be justified by the *complexity* of the information, not the *stakes* of the risk.

  ### 6. Conclusion for the Physicist

  You have identified a system that operationalizes **Pragmatic Encroachment** in ethics. The institution has decided that "Valid Consent" is not a fixed property like "Mass," but a contextual variable like "Significance Level" ($p$-value), where the threshold for significance shifts based on the cost of a Type I error (harm to the subject).

  *   **Settled:** Risk should dictate the *intensity of scrutiny* (regulatory consensus).
  *   **Contested:** Risk dictates the *moral validity conditions* (philosophical debate).

  The framework is philosophically sophisticated but rests on the contested claim that autonomy can be "weighted" against risk. A strict invariantist would argue the framework is overly paternalistic in Tier B (capping wages, auditing competence) and overly permissive in Tier A (allowing deception). The framework's defense is that in the real world, a binary switch for consent creates more harm than a sliding scale. This is a pragmatic resolution to a theoretical impasse.
