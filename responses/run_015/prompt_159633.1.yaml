answer: |-
  ### Desiderata for a Theory of Knowledge-How (AI & Cognitive Science Context)

  The following list specifies the conditions any account of "knowing how" must meet to be useful for evaluating artificial systems. The focus is on functional attribution: given observable behavior and inspectable internal states, does the system possess know-how?

  **1. The Articulation Constraint (Access vs. Competence)**
  *   **Case:** A grandmaster plays a brilliant move but cannot explain why; a novice recites the rules but plays poorly. A neural network classifies images accurately but offers no human-readable logic.
  *   **Requirement:** The theory must distinguish between *possessing* the competence and *being able to describe* the method. It must allow for "opaque" know-how where the agent succeeds without access to the governing rules.
  *   **Status:** **Preference (Camp: Anti-Intellectualist/Pragmatist).** Making articulability non-negotiable excludes almost all current AI and many human skills (e.g., riding a bike). It should not be a condition for possession, only for *teaching* or *verification*.

  **2. The Robustness Constraint (Success vs. Counterfactuals)**
  *   **Case:** A system succeeds on a task once (luck/hardcoding) vs. a system that succeeds across variations in lighting, noise, or opponent strategy.
  *   **Requirement:** Know-how must entail counterfactual success. A system that performs correctly only in the exact conditions of its training possesses a reflex or a lookup table, not know-how. The theory must demand stability across a relevant range of non-actual but possible scenarios.
  *   **Status:** **Non-negotiable.** Without this, we cannot distinguish learning from memorization, or intelligence from randomness.

  **3. The Gradability Constraint (Degrees of Competence)**
  *   **Case:** A novice driver vs. a Formula 1 driver; a base-model LLM vs. a fine-tuned agent. Know-how is lost gradually (forgetting, degradation) rather than all-at-once.
  *   **Requirement:** The theory must accommodate degrees. Know-how is not a binary switch (on/off) but a scalar property that admits of improvement, decay, and context-dependent fluctuation.
  *   **Status:** **Non-negotiable.** Any binary account fails to capture the empirical reality of skill acquisition and model training curves.

  **4. The Retention Constraint (Knowledge vs. Ability)**
  *   **Case:** A pianist with broken fingers knows how to play but cannot; a robot with severed actuators holds the policy weights but cannot move.
  *   **Requirement:** The theory must decide if know-how survives the loss of physical execution capacity. Does the "knowledge" reside in the controller (software/brain) or the whole system (embodiment)?
  *   **Status:** **Preference (Camp: Intellectualist).** This is the site of the primary logical conflict (see Incompatibilities below).

  **5. The Productivity Constraint (Novelty)**
  *   **Case:** Knowing how to escape a specific burning building vs. knowing how to escape *any* burning building (including ones never visited). A chess engine knowing how to play chess vs. knowing how to play a variant with new rules.
  *   **Requirement:** Know-how must support application to scenarios not encountered during training or prior performance. It requires a generative capacity to adapt the method to novel constraints.
  *   **Status:** **Non-negotiable.** This is the boundary between *tool* and *agent*. Without productivity, we are describing a sophisticated automaton, not a knower.

  **6. The Distribution Constraint (Individual vs. Collective)**
  *   **Case:** A pit crew changes a tire; no single member knows how to do the whole job alone. A multi-agent system solves a problem via communication protocols no single node understands.
  *   **Requirement:** The theory must allow for know-how to be instantiated across a network of agents where the internal state of any single node is insufficient for the task.
  *   **Status:** **Preference (Camp: Extended Cognition).** Crucial for multi-agent systems, less relevant for single-model evaluation.

  ***

  ### Incompatibilities and Commitments

  There is a logical cluster that cannot be jointly satisfied: **The Retention Constraint** (one can know how while unable to perform) combined with **The Robustness Constraint** (know-how requires counterfactual success) under a strict **Ability-Constitution** view.

  If know-how is *constituted* by the ability to perform (Robustness), then losing the ability (Retention case) entails losing the know-how. If you insist know-how is retained despite paralysis/hardware failure, you are claiming know-how is an internal state distinct from the ability to execute. For the purpose of evaluating AI systems, this distinction is metaphysically idle and pragmatically dangerous.

  **My Verdict:**
  1.  **Non-Negotiables:** Robustness, Gradability, Productivity.
  2.  **Most Exclusionary Requirement:** **Productivity.** This is the filter that separates "narrow AI" from "cognitive agents." A system that cannot generalize to novel scenarios (e.g., a burning building it hasn't mapped, a chess variant it hasn't seen) does not *know how*; it merely *matches patterns*. This excludes most current specialized models from full know-how attribution.
  3.  **The Drop:** I drop **The Retention Constraint** (specifically the intuition that one can know how while completely unable to perform).
      *   **Reason:** In artificial systems, the "policy" (weights/code) is useless without the "actuator" (hardware/API access). To say a robot with severed motors "knows how to walk" is to prioritize the software over the system. For a cognitive science reading group focused on observable behavior and function, know-how must cash out in *dispositional ability*. If the disposition cannot be realized even in principle due to system damage, the attribution of know-how adds no explanatory power. We should say the *system* has lost the know-how, even if the *storage medium* retains the data.

  **On the Prompt's Suspicion (Productivity vs. Present Ability):**
  I reject the tension here. Productivity does not conflict with Present Ability if Ability is understood *dispositionally*. I know how to escape a building I've never entered because *if* I were there, I *would* succeed. The ability is present as a disposition, even if the occasion is not. The real conflict is Retention vs. Ability, not Productivity vs. Ability.

  **On Articulability:**
  This is the easiest preference to resolve. We must drop the demand for access. Backpropagation and high-dimensional vector spaces are inspectable but not articulable in human language. If we demand articulability, we commit a human-centric fallacy that blinds us to non-human forms of competence.

  ***

  ### Scoring Candidate Views

  Here is how three broad theoretical approaches score against the Non-Negotiables (Robustness, Gradability, Productivity) and the Drop (Retention).

  **1. The Intellectualist View (Know-How = Knowledge-That)**
  *   *Core:* To know how to $\phi$ is to possess a proposition/rule representing the method.
  *   **Robustness:** **Fail.** Possessing a true proposition does not guarantee the ability to execute it successfully across variations (the "armchair theorist" problem).
  *   **Gradability:** **Fail.** Propositional knowledge is typically binary (you know the fact or you don't). It struggles to explain the smooth curve from novice to expert.
  *   **Productivity:** **Pass.** Propositions can be general and applicable to novel cases.
  *   **Retention:** **Pass.** You can keep the proposition while losing the body.
  *   **Verdict:** **Inadequate.** It over-ascribes know-how to systems that can recite rules but fail in practice, and under-ascribes to systems that perform flawlessly without explicit rule representation.

  **2. The Ability/Disposition View (Know-How = Capacity to Succeed)**
  *   *Core:* To know how to $\phi$ is to have the reliable disposition to $\phi$ when trying.
  *   **Robustness:** **Pass.** By definition, a disposition must manifest across relevant counterfactuals.
  *   **Gradability:** **Pass.** Dispositions come in strengths and reliabilities.
  *   **Productivity:** **Pass (Conditional).** Only if the disposition is defined over a *range* of scenarios, not just the actual one.
  *   **Retention:** **Fail.** (Intentionally). If you can't do it, you don't have the disposition.
  *   **Verdict:** **Strongest Fit.** This aligns best with AI evaluation. It forces us to test the system in novel conditions (Robustness/Productivity) rather than inspecting its code for "rules." It accepts the drop of Retention, treating the broken robot as a system that no longer knows how.

  **3. The Hybrid View (Propositional Knowledge in Practical Mode)**
  *   *Core:* Know-how is propositional, but held in a way that guides action directly (practical mode of presentation).
  *   **Robustness:** **Partial.** Improves on pure Intellectualism by tying propositions to action, but still struggles with sub-cognitive competence (e.g., reflex arcs or deep learning weights that resist propositional formatting).
  *   **Gradability:** **Partial.** Can explain degrees of "grasp," but often reverts to binary truth conditions for the underlying propositions.
  *   **Productivity:** **Pass.** Leverages the generativity of propositional content.
  *   **Retention:** **Pass.** Preserves the intuition that the paralyzed expert still knows.
  *   **Verdict:** **Unnecessary Complication.** For AI, this view tries to have it both ways. It demands we find "propositions" in neural weights where none may exist. It satisfies the Retention intuition (which I argued we should drop) at the cost of obscuring the actual mechanism of competence.

  **Final Recommendation:** Adopt the **Ability/Disposition View**, rigorously defined to include **Counterfactual Robustness** and **Productivity**. Discard **Articulability** and **Retention without Ability**. This gives you a scalpel to cut between a system that *simulates* competence (lookup/luck) and one that *possesses* it (generalizable disposition), which is the precise distinction your group needs.
