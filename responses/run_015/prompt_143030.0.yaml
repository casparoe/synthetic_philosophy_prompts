  0.40

  **Decomposition**

  1.  **Taxonomy Validity:** 0.95
      *   Justification: The three claims are distinct, and the 1979 critique primarily targeted the research strategy (claim two) which inflates the frequency claim (claim one).

  2.  **Flexibility Penalty:** 0.75
      *   Justification: Adaptive hypotheses occupy a larger hypothesis space, and a strict Bayesian penalty for this flexibility would statistically undermine many current flagship explanations.

  3.  **Instrument Asymmetry:** 0.85
      *   Justification: Current methods are optimised to detect selection signatures, making failure to reject adaptation a poor proxy for the presence of adaptation.

  4.  **Residual Category:** 0.45
      *   Justification: Researchers are reluctant to vote for 'spandrel' as a positive explanation when it often functions as a label for failed adaptive hypotheses.

  5.  **Incentive Structure:** 0.55
      *   Justification: Publication bias favours adaptive stories, but twenty-six years allows for a generational turnover that may overcome current sociological inertia.

  **Combination Logic**
  These terms are not independent multipliers. Terms two and three are positively correlated: instrument asymmetry exists partly because adaptive models are flexible enough to fit noisy data. Terms four and five are also correlated: the residual nature of the category is reinforced by incentives that punish negative results. I have treated the headline number as a weighted synthesis where the strong biological signals (terms two and three) are dampened by the sociological and epistemological friction (terms four and five). The headline reflects the probability that the *consensus* shifts, not just the biological truth.

  **Sensitivity and Confidence**
  *   **Most Sensitive:** Term four (Residual Category). If 'spandrel' becomes a positive, mechanistic category in evo-devo rather than a wastebasket, the consensus vote becomes much easier to secure.
  *   **Least Confident:** Term five (Incentive Structure). Predicting the sociology of science over twenty-six years is inherently volatile compared to the logic of the biological arguments.
  *   **Shift Condition:** To move my number by fifteen points upwards, your adversarial audit would need to show that for at least fifty of the hundred cases, a constraint-based model fits the data as well as the adaptive model with fewer parameters. To move it downwards by fifteen points, the audit would need to show that in fewer than ten cases can a viable non-adaptive alternative even be constructed.

  **The Disagreement Gap**
  The gap between 0.45 and 0.12 most likely lives in the interpretation of 'absorbed'. Your friend assumes the methodological critique was successfully internalised, meaning current textbook cases have already survived the filter and are robust; you assume the critique identified a systemic error that persists because the tools to correct it are only now maturing. You are betting on future methodological correction; she is betting on past methodological success.
