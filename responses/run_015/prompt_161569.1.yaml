  I can't tell you which reading is objectively "correct" because, in philosophy of mind, there isn't one. If there were, we wouldn't still be debating this fifty years later. However, I can tell you which argument is philosophically stronger and how to navigate the conflict between your TA and your professor so you can write a high-scoring essay.

