          *   *Prediction:* Without state action, switching is hard due to "basins of attraction." You need a large critical mass to switch simultaneously to overcome the risk of mismatch. The "lumpiness" of the switch (all at once) is hard for gradual evolutionary models to explain. Evolutionary models predict inertia unless perturbed significantly. The state provided the massive perturbation.

