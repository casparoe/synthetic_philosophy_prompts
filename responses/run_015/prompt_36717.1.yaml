          *   *Psychology:* The accident drop (Hawthorne effect/risk compensation). Lewis deals with regularities, not temporary psychological states.
          *   *Fragmentation:* Rail vs. Road. Lewis often treats "population" as uniform. Here, we have overlapping populations with different conventions. This challenges the idea of a single national convention.

      *   **Conclusion:**
          *   Verdict: Is it confirmation, anomaly, or unanticipated?
          *   *Drafting thought:* It's largely a confirmation of the *structure* of convention (expectations drive behavior), but an anomaly regarding *genesis* (top-down vs. bottom-up). It shows Lewis underestimates the power of authoritative focal points to *create* common knowledge instantly. It's a case his framework can *accommodate* but didn't *predict*.

