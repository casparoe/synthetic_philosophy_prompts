          *   *Tension:* Right-driving was arguably *better* (LHD cars, neighbors). Does this violate arbitrariness?
          *   *Resolution:* Lewis distinguishes between "arbitrary" (could have been otherwise) and "indifferent" (no preference). A Pareto-inferior equilibrium is still an equilibrium. The existence of a *better* alternative doesn't stop the inferior one from being a convention, provided it solves the coordination problem. The key is that *given the past*, left was the focal point.

      *   **Part 3: Re-coordination by Decree.**
          *   *Lewisian Core:* Conventions are self-enforcing via expectations. Law usually just codifies existing convention or solves a prisoner's dilemma.
          *   *Tension:* Here, law *created* the convention against popular will.
          *   *Analysis:* The state acted as a "focal point" generator (Schelling). It manufactured common knowledge (date, time, rules). The legal threat was temporary; once the switch happened, the *new* regularity became self-enforcing (you expect others to drive right because you know they know the law and see them doing it).
