answer: |-
  **Case Study: Dagen H and the Mechanics of Convention**

  **1. The Mapping**

  To map Dagen H onto David Lewis's framework, we must first identify the coordination problem. The participants are the users of the Swedish road network (drivers, pedestrians, cyclists). The recurrent situation is two-way traffic flow. The alternatives are binary: drive on the left ($L$) or drive on the right ($R$). The preference structure is that of a coordination game: every participant prefers to conform to whatever regularity others conform to, to avoid collision. $L$ is preferred if others do $L$; $R$ is preferred if others do $R$.

  Prior to 3 September 1967, Sweden was in a Lewisian equilibrium. There was a **regularity in behavior** (driving on the left). This regularity was sustained by **mutual expectations**: I drive on the left because I expect you to drive on the left, and you drive on the left because you expect me to do so. Crucially, these expectations were grounded in **common knowledge**. It was common knowledge in Sweden that Swedes drove on the left; it was common knowledge that everyone knew this, and so on. **Precedent** did the heavy lifting here: the history of left-driving provided the salience required to align expectations without explicit communication.

  However, this episode deviates from the textbook coordination problem in two specific ways. First, the payoff matrix was not perfectly symmetric. Due to the prevalence of left-hand-drive (LHD) vehicles (90% of the fleet) and the behavior of neighboring states (Norway and Finland drove on the right), the $R$ equilibrium likely offered higher absolute payoffs (better visibility, easier border crossing) than the $L$ equilibrium. Second, the transition was not a drift in expectations but a discrete, simultaneous jump. In Lewis's standard narrative, conventions evolve or persist through precedent; here, precedent was deliberately severed by legislation.

  **2. The Arbitrariness Condition**

  Lewis defines a convention as arbitrary: there must be an alternative regularity that *could* have served the purpose of coordination. A common misunderstanding is that Lewis requires the alternatives to be *equally* good. He does not. He requires only that the alternative be *sufficient* to solve the coordination problem.

  The Swedish case forces us to distinguish between "arbitrary" (contingent) and "indifferent" (equal value). The $L$ convention was arbitrary in Lewis's sense because $R$ was a viable alternative regularity that would also have prevented head-on collisions. However, $R$ appears to have been Pareto-superior given the car configurations and geopolitical context. This creates a tension: if $R$ was objectively better, why was $L$ a stable convention for generations?

  This does not threaten Lewis's account of arbitrariness, but it clarifies it. A convention can be Pareto-inferior and still be a convention. The stability of the $L$ equilibrium was not derived from its intrinsic merit relative to $R$, but from the network effects of conformity. As long as the cost of switching (the risk of collision during transition) exceeded the benefit of the superior equilibrium, the inferior convention remains stable. Lewis's condition holds: $R$ *could* have served, but given the mutual expectations anchored by precedent, $L$ *did* serve. The episode confirms that arbitrariness refers to the existence of an alternative solution to the coordination problem, not the equivalence of payoffs between equilibria. The entrenched inferiority of the Swedish $L$ convention demonstrates that coordination benefits can outweigh efficiency benefits, locking a population into a suboptimal equilibrium.

  **3. Re-coordination by Decree**

  This is the crux of the anomaly. For Lewis, conventions are self-perpetuating systems of expectations. Law, in his view, typically either codifies an existing convention or solves a Prisoner's Dilemma by altering payoffs. It is not usually the engine that creates a new coordination equilibrium *ex nihilo*, especially against the expressed will of the majority.

  In 1955, 83% voted to keep left. Read through Lewis's framework, this vote does not necessarily reveal an intrinsic preference for the left side of the road. Rather, it reveals a preference for the *existing* focal point. The voters were choosing between "coordination on Left" (cost: 0) and "coordination on Right" (cost: high transition risk + confusion). They preferred coordination on whatever side was established, and the established side was Left.

  So, how did the 1963 legislation succeed where the referendum failed? The state did not merely threaten punishment; it manufactured **common knowledge** and **salience**. Lewis acknowledges that salience can be created by agreement or authority, not just precedent. By legislating a specific time (Sunday morning), enforcing a traffic ban, and replacing 350,000 signs, the state made the switch to $R$ a new, unique focal point.

  On the morning of Dagen H, the legal decree functioned as a substitute for precedent. It aligned expectations instantly: I know you know that the law says drive right; you know I know that the law says drive right. The legal threat was likely secondary to the coordination incentive once the switch occurred. If the state had mandated $R$ but everyone continued driving $L$, the law would have failed (as with Prohibition). The fact that it succeeded suggests that once the state reset the focal point, the Lewisian machinery of mutual expectations took over. The new regularity became a convention not when the law was passed, but when the legal threat receded into the background of precedent. The law created the *conditions* for the convention; the convention sustained itself through the resulting regularity.

  **4. The Evolutionary Angle**

  Lewis's static analysis requires supplementation from the evolution-of-norms literature to explain the inertia and the switch. We can model this using risk-dominance versus payoff-dominance (Harsanyi and Selten) and stochastic stability (Peyton Young).

  *   **Payoff-Dominance:** The $R$ equilibrium was likely payoff-dominant (better visibility, border alignment).
  *   **Risk-Dominance:** The $L$ equilibrium was risk-dominant. In a coordination game, an equilibrium is risk-dominant if it is the safer bet when there is uncertainty about what the other player will do. Since everyone was driving $L$, deviating to $R$ was catastrophic.

  Evolutionary models (best-response dynamics) predict that populations get stuck in risk-dominant equilibria even when payoff-dominant alternatives exist. The "basin of attraction" for the $L$ convention was massive. For the population to migrate to $R$ organically, a significant cluster of drivers would need to switch simultaneously to make $R$ the best response for their neighbors. Given the "lumpiness" of traffic (you interact with strangers, not just your neighbors) and the high cost of error (death), the probability of a stochastic drift from $L$ to $R$ is negligible.

  Evolutionary models predict exactly what happened: inertia. They predict that without an external shock, the convention would persist indefinitely despite its inefficiency. However, these models are silent on the *mechanism* of the shock. Standard evolutionary theory models perturbations as random errors ("mutations"). Dagen H was not a random mutation; it was a coordinated, top-down perturbation. Evolutionary models can explain why the state action was *necessary* (to overcome the basin of attraction), but they cannot model the state action itself as an endogenous part of the normative evolution. The switch was too fast for gradual best-response dynamics; it required a "big push" that resets the population's state vector instantly.

  **5. The Residue Report**

  There are features of Dagen H that Lewis's framework, and indeed standard game theory, renders invisible.

  *   **Identity and Symbolism:** The unpopularity of the change (83% against) suggests that adherence to the $L$ convention was not merely about coordination. Driving on the left had become part of a Swedish identity, distinct from continental Europe. Lewis's framework treats preferences as ordinal rankings over outcomes (crash vs. no crash). It has no vocabulary for the disutility of abandoning a tradition *per se*. The resistance was not just about transition costs; it was about the loss of a symbolic regularity.
  *   **Psychological Transients:** The marked drop in accidents immediately following the switch, which reverted within two years, is a psychological phenomenon (heightened caution due to perceived risk). Lewis's account deals in stable regularities and expectations. It cannot account for temporary deviations in behavior driven by anxiety rather than equilibrium expectations. The theory sees the before and after; it is blind to the transition's psychology.
  *   **Fragmented Populations:** Rail traffic (including the Stockholm metro) continued to drive on the left. This shows that "Sweden" was not a single population playing a single game. It was overlapping populations with distinct conventions. Lewis allows for population relativity, but the physical coexistence of left-driving trains and right-driving cars in the same nation challenges the idea of a unified "national convention." It suggests that conventions are defined by interaction networks, not political borders. A Lewisian analysis that treats "Swedish traffic" as a single game misses the structural segmentation that allowed two contradictory conventions to coexist in the same geography.

  **Conclusion**

  Is Dagen H a confirmation of Lewis, an anomaly, or a case his framework never anticipated?

  It is best classified as **a case his framework never anticipated, which it can accommodate only with significant strain.**

  Lewis's *Convention* is primarily a genealogy of how social order arises from the bottom up through precedent and mutual expectation. He treats authority and legislation as external to the core mechanism of convention, often viewing them as solutions to cooperation problems (Prisoner's Dilemmas) rather than coordination problems. Dagen H demonstrates that authority can *create* a convention by manufacturing common knowledge and salience instantaneously, bypassing the gradual accumulation of precedent that Lewis views as essential.

  The framework successfully describes the *state* of affairs before and after Dagen H (both were Lewisian conventions). It also successfully explains the *stability* of the old convention (risk dominance). But it is silent on the *mechanism of transition*. Lewis's machinery relies on agents updating expectations based on observed behavior. On Dagen H, agents updated expectations based on a decree before observing the behavior. This suggests that while Lewis's definition of convention is robust, his account of how conventions *change* is incomplete. It fails to account for the power of authoritative focal points to reset common knowledge without prior behavioral regularity. Dagen H confirms that once established, the regularity functions as Lewis described; but it proves that the genesis of a convention need not be organic.
