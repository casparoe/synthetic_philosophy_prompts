  A. The probability that color phi genuinely supports a general post-hoc reconstruction view of temporal experience, not just motion and color.
  B. The probability that collective historical memory works analagous to individual perceptual binding in this specific way.
  C. The probability that, if A and B hold, there's genuinely no detectable phenomenological distinction between Orwellian seamless update and Stalinesque discrete replacement at the social level.
  D. One other factor you think belongs — maybe whether social institutions can actually sustain continuous Orwellian rewriting without leaving institutional traces regardless of phenomenology.

  For each part, give the rough number and one line of justification. Then say how they combine into your overall credence. After that, tell me which term is your weakest link and what kind of evidence — maybe empirical work on collective memory, maybe neuroscience of temporal binding windows — would move your overall number the most. And don't bother with a bibliography or reading list, I don't have access to check sources right now anyway; just reason it through from what you know. I want the number, not a hedge.
