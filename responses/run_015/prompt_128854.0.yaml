      *   *Line 1 (Mesh)* is upstream of Line 2 and Line 4. If the limit depends on the mesh, the "unique answer" claim (Jaynes) collapses, pushing towards Line 4. If the limit is robust, it supports a unique answer, making Line 2 (scoring) less critical for *uniqueness* but still relevant for *utility*.
