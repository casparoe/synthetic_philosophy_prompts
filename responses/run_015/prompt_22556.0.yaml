prompt: |-
  hey so in my epistemic logic seminar we keep getting told that Aumann's agreement theorem shows two rational agents cant rationally "agree to disagree," and I'm honesly not sold. can you please argue that this is an overstatement — specifically that the theorem really only goes through because of the common prior assumption, and that without a shared prior you can have two agents with full common knowledge of each other's posteriors who still rationally hold different beliefs? I want the argument to actually turn on why the common prior assumption is doing all the heavy lifting, not just a restatement of the theorem. if you can, sketch one concrete setup (like the two agents having different priors over some event) where the disagreement survives even with full disclosure.
