      *   **Constraint 1 (The Twist):** Evaluate the colony against a *modified Global Workspace Theory (GWT)* where pheromones = broadcast medium.
      *   **Constraint 2 (The Objection):** Confront a specific category-error objection from subpersonal computation (analogy: attributing digestion to an enzyme because it executes a fixed algorithm).
      *   **Constraint 3 (Format):** 75-minute exam. No citations/bibliographies required.
      *   **Constraint 4 (Marking Scheme):** Must distinguish A from B answers using *five specific philosophical moves*. Each move needs marks and a note on typical student mistakes.
