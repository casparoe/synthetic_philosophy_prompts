prompt: |-
  You are a senior philosophy lecturer and assessment designer specializing in philosophy of mind and collective cognition. I am writing the final exam for an upper-level undergraduate seminar on the boundaries of mind, and I need you to construct one essay question together with a model answer and a detailed marking scheme. The topic must center on the classic ant-colony scenario familiar from the "Ant Fugue" discussion—where decentralized pheromone signaling produces apparently intelligent, adaptive colony-level behavior—but the question must be engineered so that students cannot answer it by merely reciting the literary framing or summarizing standard emergentist versus eliminativist positions.

  To push the prompt genuinely into the weeds while keeping it answerable without web access, inject the following conceptual twist: require students to evaluate whether the colony could satisfy a modified global-workspace condition for consciousness if pheromone gradients are treated as a non-neural broadcast medium, but then force them to confront a specific category-error objection drawn from the subpersonal-computation literature—namely, that attributing a global workspace to the colony is analogous to attributing digestion to an individual enzyme, since every local ant merely executes a fixed algorithm. The exam should be designed for 75 minutes, with a model answer of approximately 650 words. Provide a marking scheme totaling 20 marks that separates an A answer from a B answer by listing five specific philosophical moves that must appear: for instance, distinguishing functional integration from mere causal coupling; explaining why the category-error objection assumes an unjustified mereological essentialism; identifying one structural feature of pheromone signaling that genuinely resembles neural broadcasting and one that genuinely fails to resemble it; clarifying whether the intentional stance can be applied collectively without being applied to any constituent; and addressing what would have to change in the colony's dynamics for the workspace analogy to hold rather than collapse. For each move, assign marks and include a one-line note on the typical student mistake—such as conflating distributed processing with distributed consciousness, treating the literary dialogue as itself an argument, or invoking "emergence" as a label without specifying the mechanism.

  Please begin with brief brainstorming: outline the crux of the question, explain how the niche twist isolates the relevant philosophical pressure point, and map the misconceptions students are likely to bring. Then present the exam question itself, followed by the model answer, and finally the marking scheme. Do not ask students to provide bibliographies, reading lists, or citations, and do not require specific publication dates, page numbers, or verbatim quotations in the answer—assume the evaluator has no web access and must reason entirely from conceptual resources. Think carefully, work through each component step by step, and ensure the difficulty comes from the conceptual crux rather than from obscurity or memorization.
