  2.  **Brainstorming & Conceptual Mapping:**
      *   *The Crux:* The tension between functionalism (if it acts like a mind, is it a mind?) and mereological fallacies (does the whole have properties the parts lack, or is it a category error?).
      *   *The Twist:* Using GWT is clever because GWT relies on *information broadcasting* to a global audience. Pheromones *do* broadcast information. But is it *conscious* broadcasting or just causal leakage?
      *   *The Objection:* The "enzyme/digestion" analogy targets the *level of analysis*. Enzymes facilitate digestion but don't digest. Ants facilitate colony behavior but don't "think" the colony's thoughts. The objection claims GWT requires a unified subject, not just a causal chain.
      *   *Misconceptions to Avoid:* Students often say "Emergence!" and stop. Or they summarize Hofstadter's dialogue ("Achilles and the Tortoise") instead of arguing the philosophy. Or they confuse *distributed processing* (computational) with *distributed consciousness* (phenomenal).
      *   *The 5 Moves Required:*
          1.  Functional integration vs. causal coupling.
          2.  Countering the category error (mereological essentialism).
          3.  Pheromone signaling: 1 similarity to neural broadcasting, 1 dissimilarity.
          4.  Intentional stance (collective vs. constituent).
