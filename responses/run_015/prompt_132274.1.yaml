      *   *Differentiation:* Need to specify what gets full marks vs. partial marks for each move.
      *   *Mistake Notes:* As requested, one-line notes on typical errors for each criterion.

  6.  **Review and Refine:**
      *   *Check Constraints:* Did I include citations? No. Did I start with brainstorming? Yes. Is the model answer ~650 words? (Need to count carefully). Are the 5 moves specific? Yes.
      *   *Difficulty Check:* Is this too hard? It's upper-level. It requires synthesizing GWT, mereology, and functionalism without looking up definitions. This fits the "no web access" constraint.
      *   *Word Count Check:* I need to ensure the model answer isn't too short or too long. I will aim for 6-7 substantial paragraphs.

