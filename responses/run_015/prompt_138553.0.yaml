answer: |-
  **The Scenario**

  A private actuarial consortium publishes a "Community Health Risk Index," mapping postal codes against long-term healthcare costs using true, responsibly sourced medical claims data. The methodology is sound and the data accurate. Hundreds of dispersed insurers and employers quietly adopt the Index to raise premiums or decline hires for residents of flagged zones, citing neutral risk assessment. Residents in these zones suffer severe economic exclusion and cannot secure mortgages or insurance needed to relocate, effectively trapping them. No single insurer breaks the law (actuarial discretion is legal), and proving discriminatory intent in individual cases is practically impossible. The consortium knows the Index will be used this way and publishes it freely online.

  **Why the Principle Says Restrict**

  On an honest application of the Harm Principle, this speech may be restricted because it functions as a *coordination mechanism* for harm that is otherwise unregulatable. Mill grants immunity to opinion unless its expression constitutes a "positive instigation to some mischievous act." Here, the Index is not merely information; it is the necessary focal point that allows hundreds of rational actors to collectively inflict a severe setback to vital interests (livelihood, housing) without any single actor committing a punishable wrong. Because the harm is real, perceptible, and flows directly from the publication, and because the listeners (insurers) cannot be practically regulated due to dispersion and legal cover, the speaker becomes the only effective point of control. To prevent the harm is to restrict the speech.

  **The Best Millian Counter**

  A staunch Millian would argue three points. First, the **Truth Defense**: suppressing accurate data impedes societal knowledge and risk management; if the costs are real, society should know them. Second, **Listener Agency**: the harm is caused by the insurers' choices, not the data itself; blame the actors, not the messenger. Third, the **Slippery Slope**: allowing restrictions on true speech because of downstream uses creates a veto power for any group that might be negatively affected by information, chilling all scientific inquiry. The remedy should be counter-speech (disputing the Index's utility) or legislation against the discrimination, not silencing the data.

  **The Single Feature Doing the Work**

  The feature driving the verdict is **Regulatory Asymmetry**. The conclusion holds only because regulating the listeners is practically unavailable (too many, dispersed, legally protected acts), while regulating the speaker is singular and feasible. The Harm Principle defaults to regulating the harmful *act*; it only targets the *speech* when the act is unreachable.

  **What Happens If You Strip It**

  If you strip this feature—meaning, if insurers were easily regulatable (e.g., strict laws banning use of such data with robust enforcement)—the verdict flips immediately. The speech becomes harmless because the mechanism of harm is broken. You would ban the discrimination, not the Index. The Harm Principle would protect the publication absolutely, as the "harm" would no longer be a necessary consequence of the speech.

  **Constraint Check**

  Yes, one constraint forces the conclusion: **"intermediaries many, dispersed, hard to detect, each doing something small that isn't itself worth banning."** Without this constraint, the standard Millian reply ("regulate the listeners, not the speaker") succeeds, and the principle loses its bite. This constraint is not just a detail; it is the engine that shifts the burden from the actors to the speaker, creating the only space where the Harm Principle restricts true, non-inciting speech.
