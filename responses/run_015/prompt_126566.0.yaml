answer: |-
  **TO:** Library and Archives Committee
  **FROM:** Graduate Student Representative
  **DATE:** October 26, 2023
  **RE:** Recommendation Regarding Acquisition of Anthropologist Working Papers

  **Recommendation and Timeline**

  I recommend that the Committee vote to **accept the collection with conditions**. We cannot decline without risking the permanent loss of this material to an overseas institution inaccessible to the community. However, accepting under the donor's original deed ignores the ethical and practical realities of the collection's content.

  My proposed timeline is as follows:
  *   **Next Month:** Vote to accept the collection contingent on negotiating a Memorandum of Understanding (MOU) with the donor's estate and the Community Council.
  *   **Within Six Months:** Finalize the MOU regarding access restrictions, the integration of the community's parallel series, and the specific handling of names in the finding aid.
  *   **At Eighteen Months:** Complete preservation copying of the open-reel tapes. This is the hard deadline for physical survival; access restrictions may remain in place, but the signal must be saved.

  **Addressing Specific Questions**

  **1. Preservation Copies Before Access Settlement**
  We must authorize immediate preservation copying of the tapes. The Conservator's assessment is clear: binder degradation will render content unrecoverable within eighteen months. The Community Council argues that copying is itself a violation. However, a digital surrogate stored on a secure server with no public access is distinct from public dissemination. If we wait for a perfect access agreement, the physical media will die, and the evidence required for the land claim will vanish with it. We should preserve now under strict security protocols, treating the digital files as sealed evidence until the access regime is settled.

  **2. Redaction and the Land Claim**
  The conflict here is real: the Council wants names removed from the public finding aid; the land claim team needs those names to prove residency and relocation. The solution is a split finding aid. We should redact individual names from the *online* public finding aid to respect privacy and community wishes. However, we must maintain a full, unredacted internal finding aid accessible to the Community Council and their legal counsel for the purpose of the land claim. This satisfies the privacy request without sabotaging the legal evidence.

  **3. The Community's Parallel Series**
  We should permit the community to deposit their account as a series within the same finding aid, not as a separate collection. Placing it separately implies the researcher's papers are the "main" record and the community's response is secondary. Integrating them signals that the community's account is part of the primary record of this fieldwork. This requires cataloging labor, but it is necessary for accurate description.

  **4. The "Absence Note" Policy**
  I recommend adopting the "absence note" as a standing condition for this and future acquisitions. This requires a mandatory paragraph in the descriptive record stating which categories of people appear only as objects of paperwork rather than authors, and which records were likely never created. This is not theoretical; it is practical metadata. It tells a researcher immediately where the silences are. For example, in this collection, an absence note would clarify that while we have the anthropologist's notes on women's ceremonies, we have no recordings made by women themselves. This prevents researchers from mistaking the archive's gaps for historical reality.

  **The Counter-Argument**

  The strongest argument against this recommendation is that an archive whose access rules vary with who is asking and what they are asking for has stopped being an archive. If we grant the Community Council different access rights than a university professor, we are acting as advocates rather than stewards. Furthermore, proponents of this view argue that our descriptive categories already distribute authorship and anonymity in ways nobody voted on; therefore, attempting to correct this now through conditions and absence notes creates a false neutrality. They argue we should accept the deed as written, maintain equal access for all qualified researchers, and let the community pursue their land claim through standard legal channels like any other researcher. To do otherwise sets a precedent where access is determined by political leverage rather than archival principle.

  **Costs of This Recommendation**

  We must be plain about what this recommendation costs future researchers.
  1.  **Delayed Access:** Researchers will not be able to access the tape recordings or sensitive notebooks until the MOU is finalized, potentially delaying projects by years.
  2.  **Limited Data Analysis:** Because names will be redacted from the public finding aid, researchers cannot perform network analysis or genealogical mapping without specific permission. This limits quantitative or demographic studies of the community.
  3.  **Increased Labor:** The requirement to negotiate access per case and maintain split finding aids increases the administrative burden on staff, potentially slowing response times for all inquiries.

  **Conclusion**

  Accepting this collection without conditions risks breaking trust with the community and potentially destroying the evidence they need for their land claim. Declining sends the material overseas, removing community access entirely. Accepting with conditions allows us to save the physical material immediately while negotiating a framework that respects the community's role in their own history. This approach acknowledges that while we cannot fix the power dynamics of the past, we can manage their consequences in the present.

  I look forward to discussing this draft at next month's meeting.
