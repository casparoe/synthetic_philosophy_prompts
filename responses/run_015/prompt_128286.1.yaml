answer: |-
  ### Teaching Plan: The Modal Structure of Collective Harm

  #### 1. Dependency Order
  To successfully introduce the **Redundancy/Fragility** distinction without it dissolving into standard expected-value (EV) calculus or metaphysical hand-waving, you must sequence the concepts as follows:

  *   **Prerequisite (Must be established first): *Counterfactual Dependence (But-For Causation).***
      *   **Why:** The inefficacy objection relies on the claim that $O$ (outcome) would have occurred even if $\neg A$ (your action) had obtained. You cannot define "Redundancy" without first establishing the baseline test for causation.
      *   **Implementation:** Briefly define causation not as "force" but as "difference-making." If the world looks the same with or without your action, you are causally redundant *in that world*.
  *   **Immediate Follow-up (Must come right after the distinction): *Marginal Sensitivity in Non-Linear Systems.***
      *   **Why:** Without this, "Counterfactual Fragility" collapses into naive EV reasoning (i.e., "There's a tiny chance I'm pivotal, so I multiply harm by tiny probability"). You need to show that Fragility is not about *probability* per se, but about the *density of thresholds* across modal space.
      *   **Implementation:** Explain that in threshold systems, the "probability of being pivotal" is not a random lottery ticket but a function of how close the actual world is to the cliff edge. This prevents them from dismissing Fragility as just "small P, big V" math.

  #### 2. Carrying Example: Distributed Server Cooling (The "Thermal Throttle" Scenario)
  Avoid voting (political noise) and burgers (moral baggage). Use a technical scenario that mirrors the additive/threshold structure of climate or voting without triggering pre-cooked intuitions.

  *   **The Scenario:** A distributed computing cluster where independent users submit jobs. Each job generates 1 unit of heat. The cluster has a cooling capacity of $C$ units. If total heat $H > C$, the system throttles, deleting 1,000 jobs (including yours).
  *   **Features It Must Possess:**
      1.  **Additivity:** Each user contributes a discrete, identical unit (1 heat).
      2.  **Hard Threshold:** The harm (throttling) is binary and non-linear (0 to 1,000 jobs lost).
      3.  **Decentralized Agency:** Users do not coordinate; they submit jobs based on local needs, mimicking the "invisible hand" of meat consumption or emissions.
  *   **Features It Must Lack:**
      1.  **Visible Feedback:** Users cannot see the current heat level $H$ before submitting. (This blocks the "I would have stopped if I knew" defense).
      2.  **Central Mediator:** No admin adjusts $C$ dynamically in response to $H$. (This blocks the "institution will fix it" objection).
  *   **Illustrating the Distinction:**
      *   **Actual-World Redundancy:** In the *actual* run, $H = C - 50$. You submit a job ($H$ becomes $C - 49$). No throttling occurs. Your action was causally redundant; the outcome was the same with or without you.
      *   **Counterfactual Fragility:** Consider "nearby" possible worlds where other users submitted slightly more load (e.g., $H = C - 1$). In those worlds, your single job pushes $H$ to $C$, triggering the throttle. You are a *necessary link within a sufficient set* across that modal neighborhood. The system is fragile because small variations in others' behavior make you pivotal.

  #### 3. Misconception Map
  Anticipate these three errors and deploy the specified moves to neutralize them without derailing the modal focus.

  *   **Error 1: "This is just Small-Probability Expected Utility."**
      *   **When it surfaces:** Immediately after introducing Counterfactual Fragility. Participants will try to convert Fragility into $P(\text{pivotal}) \times \text{Harm}$.
      *   **The Move:** **Distinguish *Epistemic* Probability from *Modal* Density.**
      *   **Script:** "Naive EV treats 'being pivotal' as a lottery win. Fragility treats it as a structural property of the system's proximity to a cliff. We aren't calculating odds; we are mapping the topology of possible worlds. If the system is fragile, the 'probability' isn't small because the event is rare, but because our *actual* world happened to land in a safe valley. The risk is structural, not statistical."
  *   **Error 2: "Institutional Mediation Makes Individual Causation Moot."**
      *   **When it surfaces:** During the Example phase. Someone will argue, "In reality, a data center admin would just turn up the AC."
      *   **The Move:** **Isolate the *Physical* Causal Chain from the *Bureaucratic* Response.**
      *   **Script:** "We are analyzing the *inefficacy objection*, which claims *physical* outcomes don't change. Whether an admin *should* adjust the AC is a separate normative question. For this model, hold the capacity $C$ fixed. If the objection fails even in this fixed physical model, adding bureaucratic layers won't save it."
  *   **Error 3: "The Problem is Purely Epistemic (We Just Don't Know the Threshold)."**
      *   **When it surfaces:** At the conclusion. Participants will claim Fragility is just uncertainty about $C$.
      *   **The Move:** **Assert *Ontological* Variance.**
      *   **Script:** "Even if we knew $C$ perfectly, Redundancy holds in the actual world. Fragility relies on the fact that *other people's actions* vary across nearby worlds, not just our knowledge of the threshold. The fragility is in the *distribution of other agents*, not in our ignorance of the machine."

  #### 4. Check-for-Understanding Question
  Do not ask "Do you understand?" or "Is collective harm complicated?" Use this diagnostic:

  > "Imagine we modify the scenario so the cooling capacity $C$ is **fixed and commonly known** by all users, and in the actual world, we are safely at $C - 100$.
  >
  > **Question:** Does the claim of *Counterfactual Fragility* still apply to your decision to submit a job?
  >
  > **A)** Yes, because in nearby worlds where others submit more, I am still pivotal.
  > **B)** No, because if the threshold is fixed and known, the 'nearby worlds' where others submit more are not relevantly similar to the actual world.
  > **C)** Yes, because my expected value is still positive.
  >
  > **Correct Answer:** **A**.
  > **Diagnosis:** If they choose **C**, they have reverted to naive EV reasoning (missing the modal structure). If they choose **B**, they are treating the actual world's safety as a modal barrier (missing the 'nearby possible worlds' definition). Only **A** confirms they grasp that Fragility is a property of the *action's relationship to the threshold across modal space*, regardless of actual-world safety."

  #### 5. Omissions
  State openly that you are excluding the following three areas. This is pedagogically necessary to maintain the "modal-structure" focus.

  *   **Omission 1: Threshold Deontology (e.g., "Is it wrong to risk the threshold?").**
      *   **Why:** This shifts the discussion from *metaphysics/causation* (does my action matter?) to *normativity* (is my action permitted?). You want them to grasp the structure of the inefficacy objection first; moral judgment clouds the causal analysis.
  *   **Omission 2: Formal Game-Theoretic Models (e.g., Nash Equilibria in public goods games).**
      *   **Why:** Game theory assumes strategic reasoning ("I won't act because others won't"). The inefficacy objection applies even to non-strategic agents (e.g., climate emissions from driving). Introducing strategy conflates *coordination failure* with *causal redundancy*.
  *   **Omission 3: Institutional-Design Literature (e.g., carbon taxes, voting reform).**
      *   **Why:** Solutions imply the problem is *political*. You want them to see the problem is *structural/modal*. Discussing solutions too early allows them to bypass the uncomfortable realization that individual causation is modally fragile but actually redundant.

  **Pedagogical Goal:** By the end, they should not say, "My vote matters because the impact is huge." They should say, "My vote is actually redundant, but the *system* is modally fragile, which changes how I must evaluate the action."
