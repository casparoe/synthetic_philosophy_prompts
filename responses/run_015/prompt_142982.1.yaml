      *Severity:* Ordered (2vs5, 1vs4, 2vs6, 3vs2).

      *Final Review:* Does it answer the prompt? Yes. Audit, ordered by severity, specific conflicts, costs, distinctions, added commitment.

      *Refining the (2)/(5) argument:* Make sure the cost is clear. If (2) moves, you lose the hard universalism on boundaries. If (5) moves, you lose common sense morality.
      *Refining the (1)/(4) argument:* Ensure the "coming-into-view" limitation is highlighted.

      *Final Polish:* Ensure flow between paragraphs.

      (Self-Correction): Ensure I don't sound like I'm telling them what to do, but what the costs are. "You must" -> "To hold both, you must..."

