      *   *Fiction vs. Science:* If the generation is inconceivable, it's nonsense. Hobbes hates "incorporeal substance." If the definition implies a contradiction in terms of motion/body, it's not scientific.
      *   *Distinction:* He distinguishes between "names signifying nothing" (nonsense) and valid definitions. The constraint is *conceivability of the generation*.

  7.  **Address the Wallis/Math Career.**
      *   *Connection:* Yes, it's systematic. Hobbes rejected algebraic symbolism because it lacked intelligible reference to body/motion. He thought he could *see* the truth of geometry through construction. Wallis was doing symbolic manipulation.
      *   *Blunders:* Hobbes's confidence came from his epistemological conviction that he knew the *cause* (motion) whereas the mathematicians of his day were just calculating effects. He thought he had the "real" definition, so his conclusion *had* to be right, even if the calculation disagreed. This is a direct application of *De Corpore* epistemology.

  8.  **Synthesize and Structure the Response:**
