      *   **Key Questions:**
          1.  Why can't physics be demonstrative if definitions are stipulations? (Is the constraint "generation"?)
          2.  How do stipulations connect to the world? (Axiomatic/implicit vs. Constructive/performative?)
          3.  Are geometric truths contingent on naming conventions?
          4.  Test Case: What about impossible generating motions (e.g., line of no breadth)?
