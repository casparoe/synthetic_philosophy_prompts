answer: |-
  This is an exceptionally sharp set of questions. You have identified the exact pressure points where Hobbes's nominalism, his materialism, and his ambition for a demonstrative civil science rub against each other. The "tidy outline" you started with is the standard textbook summary, but as you've discovered, it glosses over the metaphysical machinery that makes it run (or grind).

  Here is a breakdown of your specific worries, grounded in *De Corpore* and Hobbes's later mathematical writings, to help your group pin down the mechanism.

  ### 1. Definitions: Stipulation vs. Generation
  Your intuition here is correct and is the key to the whole system. You called them "generation-definitions" vs. "inventory-definitions." Hobbes distinguishes between **nominal definitions** (which distinguish a thing from others by marks) and **real definitions** (which show the *cause* or *generation* of the thing).

  In *De Corpore* (1.6), Hobbes argues that for a definition to serve as a first principle of science, it must not merely tell us what a word signifies, but **how the thing is produced**.
  *   **Geometry:** We define a circle not just as "a shape with equal radii" (property), but as "a figure described by a line moving around a fixed point" (generation). Because we stipulate the motion, we know the cause perfectly.
  *   **Physics:** We can define "stone" by its properties (hard, heavy), but we cannot define it by its generation because we do not know the precise internal motions of the corpuscles that make it hard. We can hypothesize a cause, but we cannot *stipulate* the cause of a natural body, because natural bodies are not made by us.

  **So, to answer your first question:** What stops a physicist from stipulating definitions? Nothing stops them from stipulating *names*, but they cannot stipulate the *natures* of natural bodies. If a physicist defines "gravity" as "an innate tendency," Hobbes would say this is nonsense (occult quality) because it posits no motion. If they define it as "pressure from an ethereal fluid," that is a valid *hypothesis*, but it remains conjectural because we didn't create the ethereal fluid and can't verify its motion directly. The asymmetry holds because in geometry, the definition *is* the cause; in physics, the definition is a label for a cause we are trying to discover.

  ### 2. The Connection to the World: Axiomatic vs. Constructive
  Your friend's "axiomatic/implicit definition" reading (Hilbert-style) is indeed anachronistic and misses Hobbes's materialism. Hobbes is not a formalist. For Hobbes, **geometry is a part of physics.** It is the study of the most universal properties of body (extension and motion).

  *   **The Third Option:** You are right to look for a constructive/performative link. For Hobbes, the legitimacy of a geometric definition rests on the **conceivability of the motion**.
  *   **Phantasms:** Geometry deals with *phantasms* (images in the mind). But since all thought is derived from sense, and all sense is motion in the body, the motions we conceive in geometry (drawing a line, rotating a radius) are of the same *kind* as the motions that constitute the physical world.
  *   **Why it connects:** We don't apply geometry to the world as a separate empirical step. Geometry is already about the world because it is about *quantity of body*. The reason we can be certain of geometry is that the "body" we are studying in geometry is a body whose generation we control in our imagination. The "world" it connects to is the universal structure of material reality (extension and motion), not specific empirical objects like trees or stars.

  So, the stipulation connects to the world because the *materials* of the stipulation (motion, extension) are the fundamental constituents of reality. We aren't playing a game with symbols; we are tracing the universal laws of body using motions we can replicate in the mind.

  ### 3. Contingency and Necessity
  This is the classic nominalist trap. If truth is in speech, isn't "2+2=4" just a rule of English?

  Hobbes's solution distinguishes between the **voluntariness of the principles** and the **necessity of the consequences**.
  *   **Voluntary:** It is up to us whether we choose to study circles or triangles. We "make" the object of study by defining it. In that sense, the existence of the science is contingent on human will.
  *   **Necessary:** Once the definition is laid down, the consequences follow necessarily. If you define a circle by that specific motion, you *must* accept that the angles in a semicircle are right angles. You cannot opt out of the consequences without contradicting your own stipulation.

  For Hobbes, truth is indeed in speech (*Leviathan*, Ch. 4), but it is not arbitrary. Truth is the "right ordering of names in our affirmations." Once the order is set by the definition, the logical chain is binding. The Pythagorean theorem isn't contingent in the sense that it could be otherwise *given the definition*; it is only "contingent" in the metaphysical sense that humans didn't have to create geometry at all. But since we have, the truths within it are necessary.

  ### 4. The Test Case: Impossible Motions
  This is a brilliant test case. Hobbes has resources to handle this, rooted in his rejection of "incorporeal substance."

  *   **Conceivability:** A definition is only valid if the thing defined is **conceivable**. For Hobbes, to conceive something is to have a phantasm of it. Since all phantasms are derived from sense, and all sense is of body, you cannot genuinely conceive of a "line of no breadth" if that implies a non-body.
  *   **The Limit Concept:** Hobbes struggles with this (as do many early moderns), but his official line is that points and lines are not *things* but *limits* of bodies. A point is not a particle; it is the end of a line.
  *   **The Verdict:** If a geometer stipulates a motion that is inconceivable (e.g., a body being in two places at once, or a motion without time), Hobbes would classify this not as science, but as **nonsense** (names that signify nothing). He is ruthless about this. In *De Corpore*, he spends considerable time attacking scholastic definitions that imply contradictions.
  *   **The Distinction:** The distinction doesn't smuggle in realism; it relies on **psychological materialism**. If your brain (a material organ) cannot construct the phantasm of the motion because it violates the laws of sense, the definition is void. So, the constraint is empirical/psychological, not Platonic.

  ### 5. The Wallis Feud and Hobbes's Blunders
  This is where the theory meets the biography, and your suspicion is correct: **Hobbes's mathematical errors are systematic consequences of his philosophy.**

  *   **Symbolism vs. Construction:** Hobbes hated algebraic symbolism (which Wallis championed). He called algebra "scabs of symbols" that obscured the underlying reality. For Hobbes, if you cannot *see* the geometric construction (the motion), you don't understand the cause.
  *   **Squaring the Circle:** Hobbes believed he had squared the circle because he constructed a figure that *looked* like it matched. He trusted his constructive intuition (the "generation" of the figure) over the symbolic calculation.
  *   **The Epistemological Commitment:** He wasn't just being stubborn. He genuinely believed that **knowledge requires knowing the cause**. Symbolic manipulation gives you the *effect* (the answer) without the *cause* (the visible motion). For Hobbes, a calculation you don't geometrically understand is not *scientia*; it's just guessing with marks.
  *   **Conclusion on the Feud:** His blunders weren't orthogonal to his theory; they were induced by it. He was so committed to the idea that "to know is to construct via motion" that he rejected valid symbolic methods that yielded correct results but lacked intuitive constructive clarity. He thought Wallis was playing a meaningless game with names, while he (Hobbes) was dealing with the real motions of body.

  ### Summary for Your Group
  To tighten your paraphrase and answer your specific doubts:

  1.  **What is a definition?** It is the resolution of a name into its universal constituents plus the **cause of its generation**. It is not arbitrary stipulation; it is a report of how the thing is made (by us, in the case of geometry/civil philosophy).
  2.  **What makes it scientific?** The definition must be **conceivable** (grounded in possible motion/body) and it must allow for **deduction of consequences**.
  3.  **Why the Asymmetry?**
      *   **Geometry:** We make the figures (in imagination), so we know the cause.
      *   **Physics:** God/Nature made the bodies; we only see effects. We can reason from effects to *possible* causes, but not to *the* cause.
      *   **Civil Philosophy:** We make the Commonwealth (by covenant), so we know the cause (human will/agreement).
  4.  **The "We Make It" Hinge:** This isn't just a metaphor. It is an epistemic claim about **Causality**. Certainty is only possible where the knower is the cause of the object known.
  5.  **Distortions to Avoid:**
      *   Don't let your friend treat Hobbes as a formalist/axiomatist. He is a materialist constructivist.
      *   Don't treat the "contingency" of definitions as undermining the necessity of theorems. The necessity is conditional on the definition, which is sufficient for science.
      *   Don't dismiss the math blunders as mere vanity; they are evidence of how strictly he applied his "knowledge-by-causes" criterion.

  Your "generation-definition" insight is the right lever. Hobbes's system hangs on the idea that **to define is to generate**. Where we can generate (geometry, politics), we have science. Where we cannot (nature), we have philosophy (in the sense of prudent hypothesis).
