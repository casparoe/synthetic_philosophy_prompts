answer: |-
  You have stumbled onto a very old problem in moral philosophy: your intuitions are not Kantian, even though you are testing them with a Kantian tool.

  Kant's Formula of Universal Law (FUL) is rigid. It cares about the *form* of the maxim, not the *context* of the victim. To a strict Kantian, keeping the supermarket £10 and keeping the kid's £10 are identical violations of property rights (Perfect Duties). Lying to your manager and lying to your nephew are identical violations of truthfulness.

  Your intuitions, however, are sensitive to **relationships, vulnerability, and the nature of the practice** you are participating in. You are operating less like a Kantian and more like a **Contractualist** (like T.M. Scanlon) or a **Rule-Utilitarian** with a strong bias toward interpersonal integrity.

  Here is a reconstruction of a single principle that fits almost all your verdicts, followed by the hard choice you have to make, the prediction for the boyfriend case, and the honest admission of where this breaks down.

  ### The Principle: "Normative Integrity and Vulnerability"

  **Principle:** *An action is impermissible if it betrays a specific interpersonal trust or exploits a specific vulnerability. An action is permissible if it merely games an abstract system where no specific trust is breached, the victim is diffuse/wealthy, and the harm is negligible.*

  This principle prioritizes **interpersonal duties** over **institutional duties**.

  **How it fits your cases:**
  1.  **Friend's Login (Fine):** The "victim" is a wealthy university corporation (abstract system). The friend is aiding you (interpersonal trust maintained). No specific vulnerability exploited.
  2.  **Supermarket (£10, Fine):** The "victim" is a large chain (abstract/diffuse). The harm is negligible to them. No face-to-face trust breached.
  3.  **Neighbour's Kid (£10, Not Fine):** The "victim" is a specific, vulnerable individual. Face-to-face trust is breached. This violates the "Vulnerability" clause.
  4.  **AI Nephew (Not Fine):** Relationship is familial/love-based. Expectation of authentic personal effort. Betrayal of specific trust.
  5.  **AI Manager (Fine):** Relationship is bureaucratic/transactional. The "practice" is efficiency, not authenticity. No specific trust breached.
  6.  **Subway Beggar (Not Fine):** This is an **Imperfect Duty** (beneficence). Your principle captures this as "failing at something" (solidarity with humanity) rather than "breaking something" (rights violation).
  7.  **Driving into Town (Not Fine):** This is a **Fairness/Free-Rider** issue. You are benefiting from a cooperative scheme (traffic reduction) while undermining it. Even if *your* car changes nothing, *your will* to free-ride violates the integrity of the cooperative practice.

  ### The Verdict You Must Give Up

  If you want to hold this principle consistently, **you must give up the Supermarket verdict.**

  Here is why: The distinction between the Supermarket and the Neighbour's Kid cannot logically rest on the *amount* of money (£10 is £10). It rests entirely on the *identity of the victim* (Corporation vs. Child).

  While your "Normative Integrity" principle explains *why* you feel differently (corporations aren't vulnerable persons), morally this is the shakiest ground you stand on. If you accept that property rights create duties, the supermarket has a right to that £10 just as the kid does. If you accept that "gaming the system" is wrong (as you do in the Driving case), the self-checkout is a system you are gaming.

  To be consistent with your own condemnation of the Bike case, you must admit the Supermarket case is *also* not fine, even if it is *less* bad. You cannot have it both ways: you cannot claim property theft is wrong when a kid is involved but permissible when a barcode scanner is involved, unless you are willing to argue that corporations have no moral standing at all (which contradicts your Driving case, where you respect the Council's rules).

  **Recommendation:** Upgrade the Supermarket verdict from "Fine" to "Technically wrong, but low priority." This aligns it with the Bike case (both are property violations) while allowing you to rank the Bike case as *worse* due to the vulnerability factor.

  ### The "New Boyfriend" Case

  **Case:** A friend asks whether you like her new boyfriend. You think he's awful. You say yes.

  **Prediction based on your principle:** **This is Fine.**

  **Reasoning:**
  *   **Practice:** The practice here is "friendship support," not "objective critique."
  *   **Trust/Vulnerability:** Your friend is vulnerable (emotional investment). Brutal honesty here exploits that vulnerability and breaches the specific trust of the friendship (which expects loyalty over truth in early stages).
  *   **Abstract vs. Personal:** Unlike the Manager case (bureaucracy), this is personal. But unlike the Nephew case (authenticity of love), this is about *protection*.
  *   **Universalizability:** Could you will a maxim where friends protect each other's fragile happiness in new relationships? Yes. A world where friends immediately torpedo new romances with brutal honesty is a world with less trust.

  *Note:* A strict Kantian would say you are lying, which is always wrong. Your principle, however, prioritizes the *relational duty* over the *abstract duty of truth*.

  ### Where This Reconstruction is Shakiest

  I am being honest: The shakiest part of this reconstruction is the **Supermarket vs. Driving** tension.

  *   **In the Supermarket case,** you permit gaming the system because the victim is abstract and the harm is diffuse.
  *   **In the Driving case,** you condemn gaming the system even though the victim is abstract (the public/city) and the harm of *your specific act* is diffuse/negligible.

  **Why is free-riding on the Council wrong, but free-riding on the Supermarket okay?**
  Both are large entities. Both are systems. In both cases, your individual causal impact is negligible.
  *   If you say the Driving case is wrong because "everyone doing it would cause collapse," you must admit the Supermarket case is wrong for the same reason (if everyone stole £10, the shop collapses).
  *   If you say the Supermarket case is okay because "it doesn't really hurt them," you must admit the Driving case is okay for the same reason.

  **The Argument That Would Change My Mind:**
  To convince me that your Supermarket verdict is correct and the Driving verdict is wrong (or vice versa), you would need to articulate a **relevant moral difference between a Commercial Contract and a Civic Duty.**

  *   **If you argue:** "Civic duties are binding because I benefit from the state in a way I don't benefit from Tesco," then I will agree the Driving verdict stands and the Supermarket verdict falls.
  *   **If you argue:** "Moral duties only attach to sentient beings who can feel the loss," then I will agree the Supermarket verdict stands, but you must then admit the Driving verdict is *also* fine (since the city doesn't feel pain).

  Currently, you are holding both: "Corporations don't count enough to ban theft" (Supermarket) AND "Abstract rules count enough to ban driving." That is the inconsistency.

  ### Summary
  1.  **Your Principle:** You are a Relational Contractualist, not a Kantian. You care about *who* is harmed, not just the logic of the act.
  2.  **The Sacrifice:** You must condemn the Supermarket case (or at least admit it's pro-tanto wrong) to remain consistent with the Bike case.
  3.  **The Boyfriend:** Lie (or deflect). It preserves relational integrity.
  4.  **The Weak Spot:** The inconsistency between permitting theft from a shop (abstract victim) while forbidding rule-breaking for the council (abstract victim). You need to decide if "Civic Duty" carries more weight than "Commercial Duty," and if so, why.
