answer: |-
  # Final Exam: Classical Chinese Metaphysics & Philosophy of Language
  **Course:** PHIL 450 – Semantics and Ontology in Early China  
  **Time Allowed:** 75 Minutes  
  **Format:** Closed-Book Essay  

  ---

  ## Part 1: Exam Question

  **Prompt:**

  In the *White Horse Dialogue* (*Bai Ma Lun*), Gongsun Long argues that "a white horse is not a horse." The standard interpretation holds that this distinguishes the compound name (form + color) from the simple name (form only). However, this distinction relies on specific assumptions about how properties inhere in entities.

  Consider a photorealistic digital rendering of a white horse displayed on a modern OLED screen. The image possesses the visual form of a horse and emits light perceived as white.

  Write a coherent essay (approx. 1000–1200 words) that addresses the following five analytical moves in order:

  1.  **Reconstruct** Gongsun Long's original argument regarding the separation of *xing* (form) and *se* (color), explaining why the combination creates a distinct *ming* (name) that is not equivalent to the simple term.
  2.  **Apply** this logic to the digital rendering. Argue whether, under Gongsun Long's criteria, the image on the screen qualifies as a "white horse," a "horse," or neither.
  3.  **Identify** a hidden ontological premise in the original *White Horse Dialogue* that is exposed by this digital extension. Specifically, address whether the argument presupposes that properties like "whiteness" must be physically instantiated in a substance rather than merely represented.
  4.  **Evaluate** whether this digital extension strengthens or undermines the School of Names' project of rectifying names (*zheng ming*). Does the digital case reveal a fatal flaw in their ontology, or does it vindicate their strict separation of name and actuality?
  5.  **Conclude** with a defended position on whether the *White Horse Dialogue* can account for representational entities, or if it is limited to a materialist ontology of direct perception.

  ---

  ## Part 2: Model Answer

  **Title:** Inherence vs. Emission: Ontological Commitments in the *White Horse Dialogue*

  Gongsun Long's *White Horse Dialogue* posits the counter-intuitive thesis that "a white horse is not a horse." To understand whether this logic holds for a digital rendering, one must first reconstruct the semantic mechanics of the original argument. Gongsun Long distinguishes between *ming* (name) and *shi* (actuality). He argues that "horse" is a name that designates *xing* (form/shape), while "white" designates *se* (color). When combined, "white horse" designates a composite actuality (form + color). Since the extension of the name "horse" includes yellow and black horses, but "white horse" excludes them, the two names have different extensions. Therefore, the compound name is not identical to the simple name. The argument relies on the premise that adding a property specification restricts the reference, creating a new ontological category distinct from the generic form.

  Applying this to a photorealistic OLED rendering requires analyzing the status of the image's properties. The image possesses *xing* insofar as the pixel arrangement mimics the shape of a horse. It possesses *se* insofar as the diodes emit light perceived as white. However, under Gongsun Long's framework, the image likely fails to qualify as a "white horse." While it satisfies the visual criteria, the *White Horse Dialogue* implies that the properties must belong to a single, unified substance. In the digital case, the "whiteness" is not a property of the "horse-shape" itself; it is a property of the screen's emission. The "horse" is merely data. Consequently, the digital rendering is neither a "horse" (no biological substance) nor a "white horse" (no inherent color), but rather a "representation of a white horse."

  This application exposes a hidden ontological premise in Gongsun Long's argument: the requirement of **physical instantiation**. The original dialogue assumes that *se* (color) inheres in the physical substance of the *xing* (form). In the classical context, a white horse is white because its hide is white; the property is intrinsic to the object. The digital case reveals that Gongsun Long's logic collapses when properties are extrinsic or representational. The hidden premise is that for a name to correctly match an actuality (*shi*), the properties designated by the name must be materially instantiated in the entity referred to, not merely projected by a medium. The School of Names operates on a naive realism where perception maps directly to material inherence.

  Does this extension undermine the School of Names? It significantly undermines their broader project of *zheng ming* (rectifying names) if that project is intended to cover all referents of language. If names are strictly tied to material instantiation, the School of Names cannot account for art, images, or language itself, which are representational. Their logic works only within a closed ontology of physical objects. However, one could argue it strengthens their specific point about the precision of language: it vindicates their strictness by showing that loose usage (calling an image a "horse") leads to ontological confusion. Yet, this defense comes at the cost of rendering their system useless for non-material referents. Ultimately, the digital case highlights a fatal limitation: their semantics cannot distinguish between *representation* and *presence*.

  In conclusion, the *White Horse Dialogue* cannot coherently account for representational entities like digital images without revision. The argument relies on a materialist ontology where properties like color are inherent qualities of substances. The OLED screen demonstrates that "form" and "color" can be decoupled from substance and manipulated independently via light and data. Therefore, Gongsun Long's distinction, while logically rigorous regarding class extension, is ontologically restricted. It fails to recognize that *ming* can refer to simulacra where *shi* is absent. The School of Names succeeds in isolating logical categories but fails to address the metaphysics of representation, revealing their system as one of direct realism rather than semantic flexibility.

  ---

  ## Part 3: Marking Scheme (Total: 25 Marks)

  | Component | Marks | Criteria for Full Credit | Characteristic Error (Deduction Trigger) |
  | :--- | :---: | :--- | :--- |
  | **1. Reconstruction** | **5** | Accurately explains the *xing* (form) vs. *se* (color) distinction and how the compound name restricts extension (i.e., "horse" seeks form, "white horse" seeks form+color). | Confusing the logical distinction with a merely perceptual one, or claiming Gongsun Long denies the existence of white horses rather than the identity of the name. |
  | **2. Application** | **5** | Rigorously applies the reconstruction to the OLED case; argues whether the image counts as "horse," "white," or neither based on the text's logic, not modern intuition. | Treating the digital case as obviously irrelevant (e.g., "it's just a picture") without analyzing it through Gongsun Long's specific criteria of form and color. |
  | **3. Hidden Premise** | **5** | Explicitly identifies the assumption that properties must be **physically instantiated/inherent** in a substance, rather than projected or represented. | Focusing on the technology of the screen (e.g., discussing pixels) rather than the ontological status of the properties (inherence vs. representation). |
  | **4. Evaluation** | **5** | Takes a clear stance on whether this exposes a flaw or strength in the School of Names; connects the ontological premise to the viability of *zheng ming*. | Failing to take a stance, or arguing that the extension does not impact the School of Names' position without justification. |
  | **5. Conclusion** | **5** | Synthesizes the argument into a defended position on the limits of the *White Horse Dialogue* regarding materialism vs. representation. | Merely restating the prompt or offering a vague summary without a definitive claim about the dialogue's ontological limits. |

  **Grading Notes:**
  *   **21–25 (Distinction):** Seamless integration of all five moves; sophisticated handling of the "inherence" premise; clear, academic prose.
  *   **16–20 (Merit):** All five moves present but one may be underdeveloped; minor imprecision in reconstructing the original argument.
  *   **11–15 (Pass):** Addresses the prompt but relies on summary; struggles to identify the hidden ontological premise; application to digital case is superficial.
  *   **0–10 (Fail):** Fails to reconstruct the original argument correctly; ignores the digital extension; or writes a general summary of the School of Names without answering the specific question.
