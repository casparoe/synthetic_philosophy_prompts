  7.  **Refining the "No Fact of the Matter" vs. "Observational Equivalence":**
      *   In PL: If $P_1 \equiv_{obs} P_2$, they are interchangeable. We often say they are "the same" *for the purpose of the observation*.
      *   In Quine: If $H_1 \equiv_{obs} H_2$, they are not just interchangeable; there is no truth about which one is *really* meant.
      *   The residue is the modal strength. PL: "Indistinguishable *given Obs*." Quine: "Indistinguishable *full stop*."

  8.  **Structuring the Response:**
