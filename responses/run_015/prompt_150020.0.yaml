answer: |-
  The coffee cup didn't fall. It jumped.

  One moment it was on the edge of the table, vibrating with the hum of the espresso machine. The next moment, it was on the floor, shattered. There was no arc, no blur of gravity taking hold. Just *here*, then *there*.

  Most people didn't see the jump. Their brains smoothed it over, painting in the missing frames with a little neural grease. But I saw it. I'd spent forty years measuring the synaptic lag between stimulus and perception, back before the university shut down the Temporal Integrity lab. We knew the truth then, even if we didn't say it out loud: the universe isn't a river. It's a flipbook.

  I sat on the park bench, watching a pigeon. It twitched forward three inches, paused, twitched again. To anyone else, it was strutting. To me, it was teleporting along a vector.

  "Rough day, Eli?"

  I looked up. Mara was standing there, holding a leash that went slack, then tight, then slack again. Her dog, a scruffy terrier, was vibrating in place.

  "Just watching the refresh rate," I said. "It's getting choppy near the city center. Too much load on the local causality."

  Mara laughed, but she was nervous. She checked her watch. "You know the fines for loitering went up. And they're cracking down on tick-jackers."

  "Let them try to catch me," I said. "I'm old. My reaction time is garbage. I can't hack the clock anymore."

  That was a lie. I could still do it. We all could, if you knew where to press. That was the secret everyone knew but nobody discussed at dinner. Since reality was just a stack of static instants, motion was just a consensus hallucination. But if you had the right mental conditioning—the kind we developed in the lab—you could refuse to update.

  You could stay in Frame A while the rest of the universe scrolled to Frame B.

  For one tick, you were a ghost. A static object in a moving world.

  I watched a kid across the street drop an ice cream cone. He flinched. I saw the subtle shimmer around his shoulders, the way the light bent around him without touching. He'd frozen. The ice cream hit the pavement, but he wasn't there to see it. He'd skipped the frame where the splash happened, re-syncing a tick later, standing dry and clean while the stain soaked into the concrete.

  Handy for spills. Handy for dodging cars. Handy for walking out of a store with a steak in your pocket while the security camera sees an empty shelf in the frame where your hand was supposed to be.

  "It's getting worse," Mara said, following my gaze. "People aren't just dodging spills anymore. I saw a guy freeze a tick to let a traffic light change. Another one froze to skip a conversation he didn't want to have."

  "Efficiency," I said.

  "It's cowardice," she snapped. "If you never live through the uncomfortable moments, do you even live?"

  She walked off before I could answer. The dog twitched forward another three inches.

  I stayed on the bench. The sun was setting, which meant the light was changing in discrete steps of luminance. Dimmer. Dimmer. Dimmer.

  I thought about the lab. We used to argue about this. If the arrow is at rest in every instant, and time is only made of instants, when does the motion happen? The answer was never. Motion is a story we tell ourselves to make sense of the sequence.

  But if motion is a story, so is choice.

  I watched a man walk past me. He saw a wallet on the bench next to me. He looked left. He looked right. He reached out.

  I saw the shimmer. He was going to freeze. He was going to grab the wallet in the gap between ticks, so there would be no frame where his hand was reaching, only a frame where it was empty, and a frame where it was full. He was stealing without the action of stealing.

  He froze. The world flickered. The wallet vanished into his coat.

  But then he stopped. He stood there, rigid, stuck in the gap.

  I knew that look. I'd seen it in the mirror during the early trials. When you stop the flow, you enter the silence between the frames. And in that silence, there is no cause and effect. There is only *is*.

  If you are frozen, you aren't moving toward a goal. You aren't executing a plan. You're just a statue. To move again, to re-sync with the universe, you have to choose a new state. But if there's no time between the states, where does the choice live?

  The man dropped the wallet. He didn't put it back; he just let go, and it jumped from his hand to the bench. He walked away, looking sick.

  He'd realized it. That's what kept me retired. That's what kept me off the grid.

  If reality is just a series of static photographs, then I am not the same person in Frame 100 that I was in Frame 1. I'm just a similar arrangement of atoms. The "me" that decided to study biology is dead. The "me" that decided to quit is dead. The "me" sitting on this bench is a new entity inheriting the memories of the previous one.

  If there is no duration, there is no continuity. And if there is no continuity, there is no one to hold responsible.

  The man who stole the wallet didn't *do* anything. He just appeared next to a wallet, then appeared with a wallet, then appeared without one. The law says theft requires intent and action. But action requires time. Intent requires a bridge between thought and deed.

  In a discrete universe, the bridge is missing.

  I closed my eyes. I could feel the hum of the clock, the impending tick that would push us all into the next moment. I could resist it. I could hold myself here, in the stillness, while the sun finished setting without me. I could skip the evening. I could skip the loneliness. I could skip the rest of my life, one tick at a time, until I simply ceased to update.

  It would be easy. No pain, just a missing page in the book.

  But then, who would remember me? The next version of me wouldn't know why I skipped. He'd just find himself older, alone, with gaps in his history.

  The tick came. The world jumped. The streetlights snapped on.

  I was still there.

  I picked up my cane. It didn't slide across the wood; it jumped from point to point, clacking against the bench. I stood up. My knees popped.

  I walked home, step by static step. I didn't feel like a hero for choosing to move. I didn't feel like a villain for the things I'd done yesterday. I just felt like the current frame of a thing that used to be a man.

  Maybe responsibility is just another smoothing algorithm. Maybe we invent guilt to glue the frames together.

  I reached my door. I put the key in the lock. I turned it.

  The door opened. I walked through.

  And for now, that was enough.
