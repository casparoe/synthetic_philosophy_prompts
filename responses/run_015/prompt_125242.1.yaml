answer: |-
  This is not a mess. In fact, you have independently reconstructed a very specific, high-level debate in contemporary value theory. You are essentially arguing for a version of **Attitudinal Hedonism** (like Fred Feldman's) but grappling with the **Fittingness Objection** (like G.E. Moore or the "Experience Machine" intuition).

  Here is a consistency check broken down by your specific questions, followed by a recommendation on how to present this without getting torn apart by the reading group.

  ### 1. Is the worst tension between (1) and (4), or does (3) make (5) impossible?

  The tension is technically between **(1) and (5), mediated by (3).**

  *   **The Conflict:** If you hold (1) (Hedonism: *only* pleasure has intrinsic value), then the *source* of the value must be internal to the pleasure itself.
  *   **The Problem:** If you hold (3) (Pleasure is a pro-attitude toward a state), then the pleasure is defined by the attitude + the content (the state).
  *   **The Crash:** If you hold (5) (Only "pure" pleasures count), you are saying the value of the pleasure depends on the **moral status of the content**.
  *   **The Verdict:** If the moral status of the content determines the value, then **morality** is a co-determinant of intrinsic value. That means (1) is false. You are no longer a hedonist; you are a **pluralist** (Value = Pleasure + Moral Fittingness).

  **Why (3) makes (5) difficult:**
  In standard Attitudinal Hedonism (Feldman), the value lies in the *taking of the attitude*, regardless of whether the object is true or good. A torturer taking pleasure in torture is experiencing something intrinsically good (for them), even though the act is morally monstrous. If you want to say the torturer's pleasure is *bad*, you have to admit that "Fittingness" is a separate intrinsic good.

  ### 2. Does (8) kill (3) or just need tweaking?

  It just needs tweaking. (8) is the "objectless emotion" objection to attitudinal theories.

  *   **The Issue:** (3) says pleasure is directed *at* a state (intentionality). (8) says background moods have no object.
  *   **The Fix:** You can expand the "object" of the pro-attitude. When you have a background mood, you can argue you are taking a pro-attitude toward **your own existence** or **the world as a whole** at that moment.
  *   **Alternative:** You can distinguish between *episodic pleasure* (directed at an object) and *dispositional/background pleasure* (a state of the subject). You can argue that background pleasure only has derivative value, or that it implicitly involves a pro-attitude toward "how things are going generally."
  *   **Verdict:** (8) does not kill (3), but you must clarify that the "object" of the attitude can be vague or global, not just specific facts like "eating ice cream."

  ### 3. What about (7)? (Scratching an itch but wanting it to stop)

  This is actually a **strength** of your position, not a weakness.

  *   This distinction kills *Desire Satisfaction Theory* (which says pleasure = getting what you want).
  *   It supports *Attitudinal Hedonism*. You can have a pro-attitude toward the *current sensation* (the scratching) while having a desire for a *future state* (no itch).
  *   **Advice:** Keep (7). It shows you have thought about the difference between *enjoyment* (pro-attitude to present) and *desire* (pro-attitude to future).

  ### 4. Is (9) just psychology vs. value?

  **Yes, you are exactly right.**
  *   (1) is **Axiological Hedonism** (What is good?).
  *   (9) is **Psychological Hedonism** (What motivates us?).
  *   They are logically distinct. You can believe pleasure is the only good (1) but think people sometimes act out of duty (denying 9). Or you can believe people always seek pleasure (9) but think they are often wrong about what is good (denying 1).
  *   **Advice:** Clarify this distinction in your presentation. It prevents people from attacking your value theory with motivational counter-examples.

  ---

  ### Strategic Recommendations for the Reading Group

  If you want to maintain the most coherent position, you have two main paths. One requires dropping a premise, the other requires re-labeling.

  #### Option A: The "Pure Hedonist" Route (Recommended for Consistency)
  *   **Keep:** (1), (2), (3), (9).
  *   **Drop/Modify:** **(5)**.
  *   **The Move:** Bite the bullet. Admit that the torturer's pleasure *is* intrinsically good (pro tanto), even though the *act* is evil.
  *   **Why:** This preserves the elegance of Hedonism. You can explain that the *overall* badness of the torture scenario comes from the pain of the victim vastly outweighing the pleasure of the torturer, plus the instrumental badness of the act.
  *   **Presentation:** "I am an Attitudinal Hedonist. I acknowledge the 'Evil Pleasures' objection, but I maintain that the pleasure itself is a local good, even if the context is morally catastrophic."

  #### Option B: The "Fitting Attitude" Route (Recommended for Intuition)
  *   **Keep:** (2), (3), (4), (5), (8).
  *   **Modify:** **(1)**.
  *   **The Move:** Abandon pure Hedonism. Adopt **Fitting Attitude Hedonism**.
  *   **Why:** This matches our moral intuition that the torturer's pleasure is worthless or bad.
  *   **The Cost:** You must admit that Value = Pleasure + Fittingness. Pleasure is no longer the *only* intrinsic good; "Fittingness" is also a value.
  *   **Presentation:** "I started as a hedonist, but the problem of evil pleasures forces me to qualify the view. Pleasure is only good when it is 'fitting' to its object."

  ### The "Least Painful" Revision
  If you have to drop one claim to save the system: **Drop (5).**

  It is less philosophically damaging to admit that a torturer's pleasure is a "local good" (which is overwhelmed by other bads) than it is to abandon Hedonism entirely. If you keep (5), you invite the reading group to ask: "What makes the pleasure fit the object? Is it Truth? Morality?" Once you answer that, you've introduced a second intrinsic value, and (1) collapses.

  ### Summary Checklist for Your Presentation
  1.  **Define Pleasure as Attitude (3):** This solves the heterogeneity problem (2).
  2.  **Clarify Object (8):** Argue background moods are pro-attitudes toward "existence generally."
  3.  **Distinguish Enjoyment/Desire (7):** Use the itch example to show why you aren't a Desire Theorist.
  4.  **Address the Torturer (4 & 5):** Either bite the bullet (Pure Hedonism) or admit you are a Pluralist (Fittingness). **Do not try to keep (1) and (5) together**, or they will catch you on the definition of "intrinsic."
  5.  **Separate Motivation (9):** Explicitly state this is about value, not psychology.

  You are in a very strong position. This is basically the state of the art in hedonistic theory. Good luck.
