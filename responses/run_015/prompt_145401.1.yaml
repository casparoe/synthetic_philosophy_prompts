answer: |-
  # Q&A Preparation Sheet: Process-Inheritance Identity & Anattā

  **Topic:** Process-Inheritance Identity (Causal transmission of *vāsanā* as a criterion for identity without *ātman*).
  **Audience:** Analytic Metaphysicians (Parfit/Olson focus) & Buddhist Studies Scholars (Textual/Soteriological focus).
  **Strategy:** Maintain the distinction between conventional identity (*vohāra*) and ultimate reality (*paramattha*), while engaging the analytic demand for logical consistency.

  ---

  ### 1. The Parfitian Reductionist Objection (Analytic Metaphysics)
  **Likelihood:** Very High | **Damage:** Medium
  **Objection:** "If you strip away psychological connectedness (memory, character) and leave only karmic causality, you haven't preserved *identity*; you've merely described Relation R. On Parfit's view, this justifies survival, not the moral accountability of a specific person. Why should *this* skandha-cluster suffer for *that* cluster's karma if there is no psychological overlap?"
  **Reply:** Moral accountability in Abhidharma does not require psychological sameness, but causal responsibility. Just as a state is liable for the debts of its predecessor despite total personnel changes, the continuum is liable for the *vāsanā* it inherited. Identity here is a pragmatic label for causal liability, not ontological unity.
  **Weakness:** Struggles to explain the *intuitive* force of 'mine-ness' in suffering without smuggling in a psychological owner.
  **Concede:** Admit that 'identity' is being used in a deflationary, conventional sense, not a strict numerical sense.

  ### 2. The Reification of Soteriology (Buddhist Studies)
  **Likelihood:** Very High | **Damage:** Medium
  **Objection:** "You are treating *anattā* as a metaphysical theory of persons rather than a soteriological tool for dismantling clinging. By positing *vāsanā* transmission as an identity criterion, you risk turning a practical heuristic into an ontological posit, which contradicts the therapeutic intent of the early texts."
  **Reply:** The account is not ontological but phenomenological-causal. *Vāsanā* explains the *experience* of continuity that binds beings to saṃsāra, which must be understood to be undone. It maps the mechanism of bondage without positing a bound entity.
  **Weakness:** Relies on a sharp fact/value distinction that may not hold in Abhidharma cosmology.
  **Concede:** Acknowledge this is a philosophical reconstruction intended for dialogue with Western metaphysics, not a claim of pure exegesis.

  ### 3. The Interruption Problem (Analytic Metaphysics)
  **Likelihood:** High | **Damage:** High
  **Objection:** "Causal processes typically require spatiotemporal contiguity. How does the *vāsanā* traverse the discontinuity of death and rebirth without a substrate? If the causal chain is interrupted, the identity claim collapses; if it is not interrupted, what is the medium?"
  **Reply:** Dependent origination (*paṭicca-samuppāda*) does not require material contiguity, only conditional necessity. Like one candle lighting another across a gap, the momentum transfers without a 'thing' travelling.
  **Weakness:** Analytic philosophers may view this as magical thinking without a specified conservation law.
  **Concede:** Concede that this relies on accepting the Buddhist cosmological framework as a premise.

  ### 4. The Sectarian Inconsistency (Buddhist Studies)
  **Likelihood:** Medium | **Damage:** Medium
  **Objection:** "The robust theory of *vāsanā* you rely upon is largely Yogācāra or Sarvāstivāda. Theravāda orthodoxy is suspicious of latent traces acting as carriers. Are you not conflating distinct Abhidharma systems to solve a problem early Buddhism didn't articulate?"
  **Reply:** I am reconstructing a pan-Abhidharmic logic implicit in the *kamma* mechanism, not defending a specific sectarian text. The functional role of latent traces is present in the *Nikāyas* as *anusaya*, even if the metaphysics vary.
  **Weakness:** Textual evidence for *anusaya* functioning as an identity criterion is thin.
  **Concede:** Admit this is a syncretic model designed for systematic coherence rather than historical purity.

  ### 5. The "Nuclear" Objection (The One I Hope Nobody Raises)
  **Likelihood:** Low (unless a specialist is present) | **Damage:** Critical
  **Objection:** "By granting *vāsanā* the power to transmit identity across lives, you have implicitly reintroduced a Sarvāstivāda-style *dharma*-substrate. If the trace persists with enough efficacy to ground accountability, it possesses *svabhāva* (intrinsic nature). You have not avoided essentialism; you have merely shrunk the *ātman* down to the size of a karmic seed."
  **Reply:** *Vāsanā* is itself empty (*śūnya*); it is a dependent event, not an enduring entity. Its efficacy comes from the network of conditions, not its own nature.
  **Weakness:** If it functions as the principle of individuation, it functionally *is* a self, regardless of what you call it.
  **Concede:** None. This must be defended vigorously, as it undermines the core thesis.

  ---

  ### Up-Front Concessions
  To disarm the audience, I should concede at the outset:
  1.  That 'identity' is being used conventionally (*vohāra-sacca*), not ultimately (*paramattha-sacca*).
  2.  That this is a philosophical reconstruction intended to bridge conceptual gaps, not a claim of definitive historical exegesis.

  Weakest point: The mechanism required to transmit karmic efficacy functionally mimics the substantial continuity it seeks to deny.
