      *   *Step 2 (Specificity):* Does the event happen everywhere the same way? If yes, it's background.
      *   *Step 3 (Human Mediation):* Does the author discuss how humans reacted? If no, it risks determinism.
      *   *Step 4 (Residual Explanation):* After accounting for human reaction, is the non-human factor still the *main* reason for the specific outcome?
