answer: |-
  # The Non-Human Causality Protocol (NHCP)

  **Purpose:** To evaluate draft chapters attributing historical transitions to non-human forces (pathogens, climate, geology) without succumbing to anthropomorphism or environmental determinism.
  **Time Allocation:** 30 minutes per chapter.
  **Authority:** Senior Commissioning Editor.

  ## Part I: The Decision Procedure

  Execute the following five tests in order. Do not proceed to the next test if a mandatory revision is triggered.

  ### Test 1: The Agency Scan (Principle iii)
  **Question:** Does the text attribute intention, strategy, or conscious goal-seeking behaviour to the non-human force?
  **Search Terms:** "Sought to," "aimed," "conquered," "defeated," "weaponised," "invaded" (unless metaphorically qualified).
  *   **If YES:** **STOP.** Mandatory Revision. The text violates the prohibition on anthropomorphism. Require the author to rephrase using mechanistic language (e.g., "spread," "coincided with," "exacerbated").
  *   **If NO:** Proceed to Test 2.

  ### Test 2: The Variance Check (Principle i)
  **Question:** Is the non-human factor presented as a constant background condition or as a differential shock?
  **Criterion:** A constant condition (e.g., "the tropics are hot") cannot explain a specific transition (e.g., "state collapse in 1650") unless it interacts with a variable.
  *   **If CONSTANT:** **FLAG.** The factor must be relegated to background context. It cannot carry explanatory sovereignty for the specific event.
  *   **If DIFFERENTIAL:** (e.g., a specific volcanic winter, a new pathogen strain). Proceed to Test 3.

  ### Test 3: The Mediation Audit (Principle ii)
  **Question:** Does the author acknowledge human institutional variance (policy, technology, social structure) in the face of this shock?
  *   **If NO:** **STOP.** Mandatory Revision. The text risks environmental determinism. The author must demonstrate awareness that human societies possess adaptive capacity.
  *   **If YES:** Proceed to Test 4.

  ### Test 4: The Residual Explanation Test (Principle ii)
  **Question:** After accounting for the human institutional responses identified in Test 3, does the non-human factor still explain the *variance* in outcomes?
  **Criterion:** If Society A and Society B face the same shock, but Society A collapses and Society B survives *due to policy differences*, the non-human factor is a trigger, not the sovereign cause of the collapse.
  *   **If NON-HUMAN FACTOR EXPLAINS VARIANCE:** (e.g., The pathogen was lethal regardless of policy). **PASS.** Publication allowed.
  *   **If HUMAN FACTOR EXPLAINS VARIANCE:** (e.g., Policy determined survival). **FLAG FOR JUDGEMENT.** The non-human factor is a necessary condition but not a sufficient cause. Proceed to Test 5.

  ### Test 5: The Narrative Weight Judgement (Editorial Discretion)
  **Question:** Given the result of Test 4, is the chapter's title and abstract overstating the non-human role?
  *   **If YES:** **FLAG FOR JUDGEMENT.** You must decide whether to demand a title change (to reflect human mediation) or allow the emphasis for pedagogical simplicity (with an annotation).
  *   **If NO:** **PASS WITH ANNOTATION.** Publish, but require a sidebar or footnote clarifying the mediation effect for undergraduate readers.

  ---

  ## Part II: Application to Draft Proposals

  ### Case 1: The Post-1492 Demographic Collapse
  **Draft Claim:** Pathogens (smallpox/measles) were "conquerors" that "defeated" indigenous polities. Minimal discussion of indigenous responses.

  *   **Test 1 (Agency Scan):** The text describes pathogens as "conquerors" that "defeated" polities. This attributes military strategy and intent to a virus.
      *   **Result:** **FAIL.**
      *   **Action:** **STOP. Mandatory Revision.**
      *   **Editor's Note:** The author must strip all martial metaphors implying intent. Pathogens do not "conquer"; they spread. Furthermore, the lack of discussion on indigenous responses violates Test 3 (Mediation Audit), but the agency error is fatal and must be corrected first.

  ### Case 2: The Little Ice Age and 17th-Century Crises
  **Draft Claim:** The Little Ice Age was the *principal driver* of global crises. Human institutions are presented as *uniformly reactive* to temperature.

  *   **Test 1 (Agency Scan):** No attribution of intent to temperature.
      *   **Result:** PASS.
  *   **Test 2 (Variance Check):** The cooling event is treated as a global shock.
      *   **Result:** PASS.
  *   **Test 3 (Mediation Audit):** The text states institutions were "uniformly reactive." It does not acknowledge variance in governance, grain storage, or welfare systems.
      *   **Result:** **FAIL.**
      *   **Action:** **STOP. Mandatory Revision.**
      *   **Editor's Note:** This is classic environmental determinism. The author must revise to show where institutions *failed* to mitigate the climate shock versus where they succeeded. If some states survived the same temperature drop without collapse, the climate cannot be the *principal driver* of collapse universally.

  ### Case 3: Tambora (1815) and European Food Crises
  **Draft Claim:** Tambora caused the 1816 food crises. However, state grain-policy differences between Britain and France explain the *divergent* mortality and unrest.

  *   **Test 1 (Agency Scan):** No attribution of intent to the volcano.
      *   **Result:** PASS.
  *   **Test 2 (Variance Check):** The eruption is a specific differential shock.
      *   **Result:** PASS.
  *   **Test 3 (Mediation Audit):** The author explicitly discusses institutional variance (grain policy in Britain vs. France).
      *   **Result:** PASS.
  *   **Test 4 (Residual Explanation Test):** The author argues *policy* explains the divergence in outcomes (mortality/unrest), not the volcano itself. The volcano explains the *shock*, but policy explains the *historical consequence*.
      *   **Result:** **FLAG FOR JUDGEMENT.**
      *   **Analysis:** According to the Protocol, the non-human factor (Tambora) does *not* carry explanatory sovereignty over the variance in outcomes. It is a trigger. The chapter's central claim links Tambora to the crises, which is true, but the *severity* is human-determined.
  *   **Test 5 (Narrative Weight Judgement):** The chapter title likely highlights Tambora. If the argument proves policy was the deciding factor in mortality, a title like "How Tambora Shaped Europe" is misleading.
      *   **Result:** **EDITOR JUDGEMENT REQUIRED.**
      *   **Action:** You must decide whether to:
          1.  **Demand Revision:** Change the emphasis to "Tambora as Trigger, Policy as Driver." This undermines the author's original hook but aligns with the series' anti-determinist stance.
          2.  **Allow with Annotation:** Accept the chapter but require a concluding section explicitly stating that without the policy failures, the mortality would have been significantly lower.
      *   **Recommendation:** Given the series' aim to avoid determinism, demand a revision to the abstract and conclusion to ensure the human mediation is not treated as a footnote to the volcanic event.

  ---

  ## Part III: Limitations of the Procedure

  As Senior Commissioning Editor, you must recognise that the NHCP is a heuristic tool, not a substitute for scholarly rigour. It cannot perform the following functions:

  1.  **Adjudicate Historiographical Disputes:** The Protocol cannot determine whether the Little Ice Age *actually* caused the 17th-century crises. It can only flag if the *argument* is deterministic. If the entire field is divided on the climate's impact, this tool will not resolve the scientific uncertainty.
  2.  **Eliminate Normative Choices:** Deciding whether to prioritise "structural shocks" (volcanoes) or "human agency" (policy) in an undergraduate syllabus is a pedagogical and normative choice. The Protocol ensures logical consistency, but it cannot tell you which story is more *important* for your readers to hear.
  3.  **Substitute for Domain Expertise:** The Protocol assumes the underlying data (e.g., temperature reconstructions, pathogen virulence) is accurate. It cannot detect if the author has misinterpreted palaeoclimatic proxies or epidemiological models. It tests the *logic of attribution*, not the *empirical validity* of the premise.
  4.  **Resolve Complex Feedback Loops:** In cases where human action alters the non-human force (e.g., deforestation contributing to climate shift which then impacts humans), the linear "Test" structure may oversimplify the reciprocity. Complex systems may require a specialist review outside this 30-minute window.

  **Final Instruction:** Use the NHCP to filter out methodological errors. For the "Judgement" flags, rely on your commissioning strategy for the series' overall intellectual coherence.
