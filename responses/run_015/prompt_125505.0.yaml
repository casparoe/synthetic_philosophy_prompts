      *   *Structure:* Needs to follow the three core principles logically.
      *   *Test 1: Agency Check.* (Principle iii). Does the text attribute intention? If yes, immediate revision.
      *   *Test 2: Variance Check.* (Principle i). Is the factor constant or differential? If constant background, it's context, not a driver.
      *   *Test 3: Mediation Check.* (Principle ii). Does the text acknowledge human institutional variance? Does the non-human factor still explain the outcome *despite* this?
      *   *Decision Nodes:* Need clear "Stop/Revise," "Editor Judgement," and "Pass" points.

      *Refining the Steps:*
