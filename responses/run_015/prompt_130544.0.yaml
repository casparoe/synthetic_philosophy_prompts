prompt: |-
  As a journalist who covers science and ideas, I run a seventy-five-minute interdisciplinary salon for professionals in science editing, policy, and engineering—none with formal philosophy training. At our last meeting, a biologist colleague asked over coffee why philosophers treat Kant's universalizability tests as logical machinery rather than moral intuition pumps, and I want next month's session to answer precisely that. The concept I need taught is Kant's universalizability framework, specifically the distinction between the Formula of Universal Law—with its internal contradiction-in-conception and contradiction-in-will tests—and the Formula of Humanity, emphasizing that they are not interchangeable and that universalizability is not consequentialist reasoning in disguise.

  Do not explain Kant to me; instead, plan the explanation for this audience. Specify the order in which the components must be introduced and why that dependency holds—what logical idea must be in place before universalizability can even be formulated, how the two formulas should be separated, and in what sequence the two contradiction tests should be introduced within the first formula. For the carrying example, do not use the classic false-promise or suicide cases; instead, build the session around a contemporary research-ethics maxim: a scientist considers suppressing a single non-critical outlier in a replication dataset to preserve a theory she judges socially valuable, with the maxim being "I will suppress one outlier in replication data when it threatens a valuable theory, on the condition that detection is unlikely." Explain what this example must possess—ambiguous intuitive moral pull but a transparent logical structure—and what it must lack—immediate emotional revulsion that short-circuits analysis—to serve as the session's backbone, and why the standard examples fail on these criteria. Then map the misconceptions the audience will bring or form: treating universalizability as a consequentialist calculus, reading it as the Golden Rule, interpreting contradiction as "if everyone did this, bad outcomes would follow," and collapsing the two formulas into a single test. For each, identify the exact point in the sequence where it should be headed off and with what conceptual move. Include one check for understanding—an applied question using the replication-outlier case that reveals whether participants grasp the logical structure of contradiction rather than merely expressing moral discomfort—and state clearly what should be left out at this level (for instance, the metaphysics of freedom, the kingdom of ends, or any textual exegesis of specific works) with a brief justification for each omission.

  Present your teaching plan in prose, then provide a brief structured summary as a JSON object with the following fields: "sequence_steps" (array of objects with "order", "component", "dependency_rationale"), "carrying_example" (object with "scenario", "required_features", "excluded_features", "why_not_standard"), "misconceptions" (array of objects with "label", "entry_point_in_sequence", "deflection_move"), "understanding_check" (object with "question", "what_correct_answer_reveals", "what_incorrect_answer_reveals"), "omitted_material" (array of objects with "item", "reason_for_omission"), and "session_duration_minutes".
