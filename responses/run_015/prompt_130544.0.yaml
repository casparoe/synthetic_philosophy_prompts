answer: |-
  ### Teaching Plan: Kantian Universalizability for Science Professionals

  **Session Goal:** To equip science editors, policy experts, and engineers with the logical machinery of Kant's universalizability tests, distinguishing them from consequentialist reasoning and moral intuition, using a contemporary research ethics case.

  **Duration:** 75 Minutes

  #### 1. Prerequisite: The Maxim (Minutes 0–15)
  **Dependency Rationale:** You cannot test universalizability without first isolating *what* is being universalized. Participants often attempt to universalize actions ("suppressing data") rather than principles. Before introducing the Formula of Universal Law (FUL), the audience must grasp the structure of a **Maxim**: a subjective principle of volition containing an action, a condition, and a purpose.
  **Instructional Move:** Introduce the carrying example immediately. Do not ask "Is this wrong?" Instead, ask participants to draft the principle the scientist is following. Guide them to the specific formulation: *"I will suppress one outlier in replication data when it threatens a valuable theory, on the condition that detection is unlikely."*
  **Misconception Head-off (Golden Rule):** At this stage, participants may suggest, "Would she want her data suppressed?" Intervene by stating: "Kant is not asking about her preferences or reciprocity. He is asking if this principle can function as a law of nature." This distinguishes the Maxim from the Golden Rule before the testing begins.

  #### 2. Formula of Universal Law: Contradiction in Conception (Minutes 15–35)
  **Dependency Rationale:** Once the Maxim is fixed, the first logical test is strict impossibility. Can the maxim be conceived as a universal law of nature without contradiction? This must precede the "Will" test because logical impossibility trumps volitional inconsistency.
  **Instructional Move:** Ask participants to imagine a world where *every* scientist acts on this maxim whenever the condition is met. Do not ask "Would science suffer?" (Consequentialism). Ask: "Does the practice of 'replication data' logically exist in this world?" If everyone suppresses outliers to save theories, the concept of "replication data" becomes synonymous with "confirmed theory," rendering the practice of replication conceptually empty.
  **Misconception Head-off (Consequentialism & Bad Outcomes):** Participants will argue, "If everyone did this, trust would erode, and funding would drop." Stop this. Explain that empirical bad outcomes (loss of funding) are not logical contradictions. The contradiction is that the *institution* of replication ceases to be possible as a truth-seeking mechanism. The maxim destroys the very condition it needs to operate (the existence of reliable data).

  #### 3. Formula of Universal Law: Contradiction in Will (Minutes 35–50)
  **Dependency Rationale:** Some maxims are conceivable as universal laws but cannot be *rationally willed* by the agent. This step depends on the failure of the CC test to capture all duties (specifically imperfect duties), but here it serves to show internal rational inconsistency even if the practice survives.
  **Instructional Move:** Suppose participants argue that science could survive some outlier suppression. Shift to the agent's will. The scientist relies on the integrity of others' data to build her own "socially valuable theory." Can she rationally will a world where everyone suppresses data, given that she needs reliable data to achieve her own end?
  **Misconception Head-off (Collapsing Formulas):** Ensure participants see this is still part of the FUL, not yet the Formula of Humanity. It is about the consistency of the agent's own rational goals, not yet about respecting others as ends.

  #### 4. Formula of Humanity (Minutes 50–60)
  **Dependency Rationale:** Only after exhausting the logical machinery of universalizability (FUL) should you introduce the Formula of Humanity (FH). They are not interchangeable; FUL tests consistency of law, FH tests respect for rational agency.
  **Instructional Move:** Present FH: "Act so that you treat humanity... always as an end and never as a mere means." Apply it to the outlier case. By suppressing data, the scientist uses the scientific community (peers, policymakers) as mere means to her end (validating the theory), bypassing their rational capacity to assess evidence.
  **Misconception Head-off (Interchangeability):** Explicitly state: "FUL asks if the rule works for everyone. FH asks if this action respects the rational agency of others." Show that while they often align, they are distinct logical tools.

  #### 5. Synthesis and Understanding Check (Minutes 60–75)
  **Dependency Rationale:** Consolidate the distinction between logical contradiction and moral discomfort.
  **Instructional Move:** Administer the understanding check (detailed below). Discuss the results.
  **Omissions:** Do not discuss the Metaphysics of Freedom (too abstract for a logic-focused session), the Kingdom of Ends (too systemic/utopian for individual maxim testing), or textual exegesis of the *Groundwork* (irrelevant to applied machinery). Justify this by stating the goal is operationalizing the test, not historical scholarship.

  ***

