prompt: |-
  Okay, I've been chewing on this and I want an actual number out of you, not a lit review.

  Proposition: the norm governing assertion is knowledge — you should assert that p only if you know that p.

  But don't give me the unconditional credence first. Give me the conditional one: P(knowledge norm is correct | there is a single, exceptionless, constitutive norm of assertion at all). Then give me the unconditional. Then tell me how much of the gap between the two is just your doubts about the antecedent.

  I'm asking it this way because I think people run the two together. A friend of mine says 0.85 for the knowledge norm; I say 0.5. But my guess is that if you pinned her down on the conditional she'd say something like 0.9, and if you pinned me down I'd say 0.65 — which would mean we mostly agree about the rule-of-the-practice picture and mostly disagree somewhere else entirely, or that one of us is confused about what question we're answering. I don't know which, and figuring that out is half of what I want from you.

  Decompose the conditional however you think is honest. Terms I'd expect to see, though feel free to reject my list: whether the lottery-style data (asserting "your ticket lost" on overwhelming but non-conclusive evidence) really discriminates knowledge from reasonable belief, or just from truth; whether selfless-assertion cases — the person who has excellent evidence, doesn't believe it, asserts it anyway and turns out right — are counterexamples or just cases of excusable rule-breaking; whether "the norm" is supposed to be a rule of the practice, an epistemic ideal, or a summary of when criticism is appropriate; whether knowledge is doing any work beyond being a reliable proxy for truth-under-normal-conditions; whether stakes-sensitivity dissolves the question instead of answering it. Put a rough probability on each, show the combination, and say which single term the final number is most sensitive to, plus what would count as evidence for or against that term — and by evidence I don't mean another philosopher's intuition about a made-up case.

  Last thing, and this might be the real question: is my conditionalization even legitimate? If there's no single constitutive norm, is the claim "the knowledge norm is the norm of assertion" false, or just not apt — no truth value to have? If its the latter, then conditioning on the antecedent may be smuggling in a verdict the question doesn't support, and my 0.5 isn't measuring anything coherent. Tell me if that's right.
