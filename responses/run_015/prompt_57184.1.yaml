answer: |-
  Here are the numbers, the decomposition, and the meta-analysis.

  ### 1. The Probabilities

  *   **Conditional:** $P(\text{KNA} \mid \text{Single, Exceptionless, Constitutive Norm}) = \mathbf{0.78}$
  *   **Unconditional:** $P(\text{KNA}) = \mathbf{0.47}$
  *   **Antecedent Probability:** $P(\text{Single, Exceptionless, Constitutive Norm}) = \mathbf{0.60}$

  *(Note: These satisfy the law of total probability assuming $P(\text{KNA} \mid \text{No Single Norm}) \approx 0$. $0.78 \times 0.60 = 0.468 \approx 0.47$.)*

  ### 2. The Gap Analysis

  You asked how much of the gap between the conditional (0.78) and the unconditional (0.47) is due to doubts about the antecedent.

  **Answer: 100% of the gap.**

  Mathematically, if the truth of KNA entails the existence of a norm, then any reduction in probability from the conditional to the unconditional is entirely driven by the probability mass assigned to "There is no single norm."
  *   **Gap:** $0.78 - 0.47 = 0.31$
  *   **Loss due to Antecedent:** $0.78 \times (1 - 0.60) = 0.312$

  This suggests that you and your friend are likely talking past each other. If your friend assigns 0.85 unconditional and you assign 0.50, but you both agree on the conditional (say, around 0.75–0.80), then the entire disagreement is about whether assertion is the *kind of thing* that has a single constitutive norm. She is a normative realist about speech acts; you are a skeptic (or a pluralist).

  ### 3. Decomposition of the Conditional (0.78)

  To arrive at 0.78, I am treating the conditional probability as a baseline confidence that is eroded by specific counter-phenomena. I assign a probability that KNA *survives* each specific challenge, assuming a norm exists.

  | Term / Challenge | Probability KNA Survives | Role in Calculation |
  | :--- | :---: | :--- |
  | **1. Lottery/Statistical Assertion** | 0.90 | KNA explains why "Your ticket lost" is improper despite high probability better than Justification Norms. |
  | **2. Selfless Assertion** | 0.70 | Cases where agents assert without belief. KNA survives if belief is a separate norm or if these are "excusable violations." |
  | **3. Norm Ontology** | 0.80 | The coherence of "constitutive rules" for speech acts (vs. summary of criticism). |
  | **4. Truth vs. Knowledge** | 0.85 | KNA must do work beyond the Truth Norm (i.e., handling Gettier cases). |
  | **5. Stakes Sensitivity** | 0.65 | Whether KNA can accommodate pragmatic encroachment without collapsing into a variable norm. |
  | **Weighted Average** | **0.78** | *(Simple mean for transparency)* |

  #### Sensitivity Analysis
  The final number is most sensitive to **Term 5: Stakes Sensitivity (0.65)**.
  If stakes-sensitivity proves that the norm of assertion shifts with practical context (e.g., asserting a medical diagnosis vs. a dinner plan), the "exceptionless" clause in your antecedent is threatened. If the norm varies, KNA as a *single, exceptionless* rule fails, even if knowledge remains the standard in each context.

  #### Evidence Specification (Non-Intuitionist)
  You asked for evidence that isn't "Philosopher X's intuition about Case Y."

  *   **For Stakes Sensitivity:** Look to **institutional testimony standards**. In law, the norm for assertion (testimony) shifts from "preponderance of evidence" to "beyond reasonable doubt" based on stakes (civil vs. criminal), *even if the witness's epistemic state (knowledge) remains identical*. If natural language assertion tracks this institutional variance, KNA is threatened.
      *   *Falsification:* If corpus linguistics shows that markers of assertion (e.g., flat intonation, indicative mood) remain constant regardless of practical risk, while only *hedging* changes, KNA is supported (hedging modifies the speaker's commitment, not the norm).
  *   **For Lottery Cases:** Look to **behavioral assertion data**. Do people actually refrain from asserting lottery losses before the draw in real-world settings, or do they assert them freely?
      *   *Falsification:* If experimental data shows people assert lottery losses as readily as known facts when incentives are controlled, the "impropriety" is a philosopher's artifact, and KNA loses its primary advantage over the Reasonable Belief Norm.
  *   **For Selfless Assertion:** Look to **clinical psychology/psychiatry**. Patients with specific delusions or Capgras syndrome often have evidence they reject. If they assert the truth based on evidence they don't believe, and we praise them, KNA (which usually couples with a belief norm) is strained.
      *   *Falsification:* If such assertions are consistently treated as "lucky guesses" rather than "proper assertions," KNA holds.

  ### 4. The Meta-Question: Is the Conditionalization Legitimate?

  You asked: *If there's no single constitutive norm, is the claim "the knowledge norm is the norm of assertion" false, or just not apt?*

  **Verdict: It is not apt (Presupposition Failure), but conditionalization is still a valid heuristic.**

  If assertion is a Wittgensteinian family-resemblance practice with no essence, then "The norm of assertion is K" suffers from presupposition failure (like "The King of France is bald"). It isn't false; it's category-mistaken.

  However, conditioning on the antecedent ("If there is a single norm...") is legitimate **if and only if** you treat the antecedent as a *modeling assumption* rather than a metaphysical claim.
  *   **Legitimate:** "In the model where assertion is rule-governed like chess, is K the rule?"
  *   **Illegitimate:** "Given that assertion *must* have a rule, what is it?"

  If you treat it as the latter, your 0.5 isn't measuring coherence; it's measuring your resistance to a false dichotomy. If your friend treats it as the former, her 0.85 measures how well K fits the model.

  **My advice:** Your conditionalization is legitimate *provided* you acknowledge that $P(\text{Single Norm}) < 1$. If you suspect the concept is "not apt," your probability for the antecedent should be lower (e.g., 0.30), which would drag your unconditional credence down significantly (to ~0.23). The fact that you sit at 0.5 unconditional suggests you think the "Single Norm" hypothesis is roughly a coin flip (which matches my 0.60).

  ### 5. Diagnosis of Your Disagreement

  You suspect you and your friend agree on the conditional and disagree on the antecedent. The math supports this.

  *   **Friend:** Unconditional 0.85. If she agrees with my conditional (0.78), she must believe $P(\text{Single Norm}) > 1.0$, which is impossible. Therefore, **she must have a higher conditional credence (approx 0.95)** *and* a higher antecedent credence (approx 0.90). She is a robust normative realist.
  *   **You:** Unconditional 0.50. With my conditional (0.78), your antecedent credence is ~0.64.
  *   **The Real Disagreement:** It is not *mostly* about the antecedent. It is split.
      *   She thinks the rule is almost certainly Knowledge (0.95) and the rule almost certainly exists (0.90).
      *   You think the rule is probably Knowledge *if* there is one (0.65 per your guess, I estimated 0.78), but you are much shakier on whether there is a rule at all.

  **Correction to your hypothesis:** You guessed your conditional was 0.65 and hers was 0.90. If that is true, **you disagree substantially on the rule itself**, not just the practice picture.
  *   If your conditional is 0.65, you think there are significant internal problems with KNA (likely Stakes or Selfless Assertion).
  *   If her conditional is 0.90, she thinks those problems are easily dissolved.

  **Conclusion:** You are not mostly agreeing on the "rule-of-the-practice picture." You are disagreeing on the *fit* of Knowledge to that picture. She thinks Knowledge fits the data (Lottery, etc.) nearly perfectly; you think it's a messy fit. The antecedent doubt is secondary. To resolve the debate, stop asking "Is there a norm?" and start asking "Does Knowledge handle the Lottery Case better than Reasonable Belief?" That is where the 0.65 vs 0.90 divergence lives.
