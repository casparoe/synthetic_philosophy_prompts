answer: |-
  The objection seems fatal. If you scan the cosmos and discover you are a statistical unicorn—the only agent reasoning about decision theory in a trillion-light-year radius—then who are you coordinating with? The correlation drops to zero. If no one else is running your algorithm, your choice provides no news about anyone else's behavior. Evidential Cooperation in Large Worlds (ECL) collapses. You should defect.

  This argument fails because it confuses physical similarity with logical identity. ECL isn't about finding agents who look like you or live near you; it's about finding agents who *reason* like you. Your decision isn't a solitary event; it is the output of a specific logical process. If any other agent in that vast universe is running the same reasoning process—even if they are physically distinct or hidden from your scan—you are logically linked.

  Here is the knockdown: Your choice doesn't just determine what you do; it determines what your reasoning algorithm *outputs*. If you decide, "I will defect because I am an outlier," you have programmed your algorithm to defect under conditions of perceived uniqueness. If there is even one other agent somewhere running that same algorithm—who might also be scanning and feeling like an outlier—they will output the same result. You defect, they defect. Everyone loses.

  By conditioning your cooperation on being "typical," you guarantee that cooperation fails whenever anyone feels unique. To unlock cooperation from any logical twins you might have, you must adopt a policy that holds even in the outlier case. You cooperate not because you know others are watching, but to ensure that anyone else reasoning exactly like you *will* cooperate. Your uniqueness doesn't break the link; abandoning the logic does. If you want the principle of cooperation to win wherever your mind exists, you must uphold it even when you stand alone.
