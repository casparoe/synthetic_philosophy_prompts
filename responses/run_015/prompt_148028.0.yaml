answer: |-
  The deadlock stems from a category error wherein one side treats 'dirty hands' as a problem of individual moral metaphysics while the other treats it as a problem of institutional legitimacy, so only a conceptual distinction between personal guilt and political responsibility can resolve it.

  The 'moral residue' camp commits to the existence of agent-relative obligations that cannot be overridden by collective will; for them, certain acts possess an intrinsic wrongness that persists regardless of utility or authorisation. They view the politician as a moral agent distinct from the office, meaning the 'stain' is an ontological fact about the soul of the actor, not merely a social judgement. Consequently, they treat emotional after-effects as evidence of this normative reality; the guilt is not a hangover to be cured, but a fitting response to an objective moral violation. Conversely, the 'collective blame' camp commits to a contractarian view where the politician is merely a conduit for the sovereign people. They assume moral responsibility in politics is fungible and distributable; if the demos authorises the harm, the liability transfers to the collective body. For this side, the 'stain' is purely psychological because, normatively, the act has been legitimised by the proper procedure. They treat emotional after-effects as irrational friction between personal conscience and public duty, something to be managed rather than honoured.

  Because these commitments operate on different planes, an empirical finding about how voters authorise harm will fail to break the deadlock. Side A does not deny that voters might authorise harm; they deny that voters *can* morally authorise certain intrinsic wrongs. Similarly, a formal model of distributed blame will not satisfy Side A, as their position is that some blame is non-fungible and must rest on the individual who performed the act. The only viable path forward is a conceptual distinction that separates the question of 'was this act politically legitimate?' from 'was this act morally innocent?'. You must agree to treat 'dirty hands' as a hybrid concept: politically justified yet morally tragic. Until the seminar accepts that an act can be institutionally correct while remaining personally damning, you will continue to argue past one another, conflating the validity of the office with the virtue of the officer.
