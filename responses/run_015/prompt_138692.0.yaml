answer: |-
  You are walking a tightrope between boring neutrality and political teleology, and your instinct to avoid an essay on Whig history is correct because your committee will tune out. What you need is a triage protocol that sounds like common sense rather than historiography. Here is a procedure you can read aloud during those ten-minute windows, designed to separate genuine improvement from inevitable progress and to catch language that mocks the past.

  Start every draft by asking if the core claim is verifiable. If the marker says typhoid rates dropped, can you show the numbers? If it says a neighborhood thrived, is there evidence of businesses or schools? This is your anchor. If the fact is solid, you move to the second question, which is where you filter out the Whig history. Ask the committee whether the sentence implies the outcome was unavoidable. This is where you deploy your losers' bet test. If a sensible person in 1898 could have bet against the water plant being built without being wicked or stupid, then the marker cannot say science prevailed as if it were destiny. If the answer is yes, the line stays. If the answer is no, the line goes. This distinguishes genuine improvement from the claim that we have arrived. Improvement is data; arrival is ideology. You can say health improved without saying we joined the modern world.

  Once you have cleared the inevitability trap, apply your 1975 test, but refine it slightly for the room. Ask whether the tone would sound like propaganda to someone reading it in 2075. This catches the language that makes past people look foolish for not knowing what we know now, which is your third distinction. Words like finally or at last imply the past was holding its breath waiting for us. If a sentence suggests people in 1920 were blind rather than just limited by their context, cut it. However, you must guard against the failure mode of sterile neutrality. If you delete every evaluative word, you lose the story. The guardrail here is to ask whether the sentence explains why anyone should care. If the only reason to care is that we are better than them, delete it. If the reason to care is that people suffered less or had more rights, keep the fact but lose the triumphalism.

  Running this on your water plant draft shows why you feel it is easy but also where the trap lies. The line about drinking filth is vivid and factually grounded in typhoid rates, so it passes the verifiability check. However, at last and joined the modern world fail the losers' bet test because the plant was a political fight, not a destiny, and they fail the 1975 test because future generations may not view our current era as the modern peak. The procedure says keep the health impact, cut the destiny. A surviving draft looks like this: For years residents suffered high rates of typhoid from untreated water. In 1898, the city opened a filtration plant that reduced disease and changed daily life. This keeps the improvement without claiming you reached the end of history.

  The Dr. Renner marker is harder because it involves identity, and your committee will feel the cut deeply. The phrase broke through barriers passes the verifiability test if she was indeed the first. The problem is opened the door for every woman who followed. This fails the losers' bet test because barriers remained for decades after her, and it implies a teleological march that wasn't experienced by women who still faced discrimination after her. It also risks the 1975 test by implying the struggle is over. You need to tell the committee that honoring her requires accuracy about the struggle, not just the victory. Read them this: Dr. Renner became the first woman licensed to practice here. Her work challenged restrictions and created opportunities for those who followed. This acknowledges the improvement without claiming the job was finished. It respects her agency without making her a magic wand.

  The Brightmoor proposal is the most dangerous because it flips the Whig history into declinism, which is the same trap with the sign reversed. Saying the city destroyed it until it built a road implies the road was the only possible outcome and the neighborhood was only a victim. This fails the verifiability test if families continued to thrive elsewhere after displacement, and it fails the 1975 test by framing the city solely as a villain without context, which invites the council to reject it as political. The procedure demands you acknowledge the loss without making the highway the protagonist. Try this: Brightmoor was a thriving Black neighborhood with homes and businesses. In 1961, the city cleared the area to construct a highway, displacing hundreds of families. This states the harm without implying the neighborhood existed only to be destroyed or that the highway was inevitable progress. It is a factual claim of loss that survives the vote.

  You need to know where this procedure will fail so you do not burn out trying to fix the unfixable. First, ninety words is often too short to distinguish between improvement and arrival. If a marker requires complex context to avoid being misleading, the procedure will tell you to cut it, but the committee may refuse. In those cases, defer the marker for a full rewrite rather than a patch. Second, some markers are not about the past at all but about what the town wants to be now. If the fight is over whether the city was racist rather than whether a specific act occurred, ten minutes is not enough and you should recommend a special session. Third, this procedure cannot fix a committee that views any change as erasure. When a member says changing a word erases history, your response is that leaving false inevitabilities erases the struggle of the people who actually lived it.

  Finally, remember that your goal is not perfect history but responsible public memory. There will be drafts where the procedure says cut a line you love, like the Renner marker's original ending. When that happens, tell the committee that accuracy protects the subject from future embarrassment. If you tell me you are ready to stop, I can give you the specific research citations for the typhoid rates or the licensing records to hand them during the meeting. You have the right instinct on the tests, and if you stick to the verifiable facts while stripping the destiny, you can keep the funding and keep your integrity.
