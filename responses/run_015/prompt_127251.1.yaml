  **JOINT STATEMENT ON THE INTERPRETATION OF THE MŪLAMADHYAMAKAKĀRIKĀ**

  **Signatories:**
  The Undersigned Non-Assertive Soteriologist (NAS)
  The Undersigned Dialectical Realist (DR)

  **Preamble**
  Following a period of adversarial collaboration, we issue this statement to delineate the boundaries of our consensus and disagreement regarding Nāgārjuna's *Mūlamadhyamakakārikā* (MMK). While we diverge on the philosophical upshot of the text, we agree on the textual reasoning and the logical structures employed. This document isolates the precise loci of interpretive divergence to facilitate further inquiry without conflating distinct philosophical commitments.

  ### 1. Agreed Claims on Textual Reasoning

  Both camps affirm the following descriptions of the argumentative structure found within the MMK. These claims describe the movement of the text without committing to a specific ontological conclusion regarding the status of that movement.

  1.  **Analysis of Conditions (MMK Chapter 1):** We agree that the text demonstrates that an effect cannot be found in its causes (whether singly or collectively), nor can it arise without causes. The reasoning exhausts the logical possibilities for the production of an entity possessing intrinsic nature (*svabhāva*).
  2.  **Analysis of Motion (MMK Chapter 2):** We agree that the text argues the "mover," the "place moved," and the "act of moving" are mutually dependent and cannot be established as independent referents. The negation applies to the search for a substantial agent of action.
  3.  **Analysis of the Self and Dharmas (MMK Chapter 18):** We agree that the text posits the cessation of "I" and "mine" as contingent upon the cessation of grasping (*upādāna*), and that this cessation is linked to the understanding of dependent origination (*pratītyasamutpāda*).
  4.  **Negation in Essence (MMK Chapter 15):** We agree that in the examination of *svabhāva* (intrinsic nature) and *bhāva* (existence), Nāgārjuna employs negation to deny that *svabhāva* can be produced, unproduced, both, or neither. Both camps accept that the text utilizes *prasajya-pratiṣedha* (non-implicative negation) to reject the four extremes of the tetralemma regarding existence, such that the negation of "existence" does not logically imply the affirmation of "non-existence" as a new essence.

  ### 2. Statement of Disagreements

  The following table outlines our divergent interpretations of the philosophical upshot of the agreed-upon reasoning.

  | Topic | Non-Assertive Soteriologist (NAS) Position | Dialectical Realist (DR) Position |
  | :--- | :--- | :--- |
  | **(a) The Emptiness of Emptiness** | Because *śūnyatā* is empty of intrinsic nature, it cannot be asserted as a thesis without reifying it. To claim "emptiness exists" is to fall into the extreme of existence. Thus, *śūnyatā* is a therapeutic tool that must be relinquished to achieve liberation. | Because *śūnyatā* is empty of intrinsic nature, it is the correct description of how phenomena exist. *Śūnyatā* is a substantive property (the absence of *svabhāva*) that can be truly predicated of dependently originated things without reification. |
  | **(b) The Status of the Tetralemma** | The fourfold negation is purely destructive (*vidhvaṃsana*). It generates no "fifth position." The result is *avyākṛta* (undeclared) silence regarding ultimate reality, marking the end of conceptual proliferation (*prapañca*). | The fourfold negation clears the ground for a "fifth position": the Middle Way itself. This is a positive philosophical view that affirms dependent origination as the coherent structure of reality once *svabhāva* is removed. |
  | **(c) Conventional Designation** | Conventional designation (*prajñapti-mātra*) is a pragmatic fiction useful only for navigation. It retains no determinate content or epistemic weight once the four extremes are seen through; it is ultimately ineffable. | Conventional designation retains determinate content and logical coherence. The negation of *svabhāva* does not dissolve conventional structure but secures it, allowing for valid inference and truth-claims within the conventional sphere. |

  ### 3. The Cruxes of the Dispute

  We identify two fundamental sub-questions where resolution would necessitate a revision of at least one camp's position.

  1.  **The Soteriological Aim:** Is the ultimate aim of Madhyamaka practice **cognitive** (arriving at a correct view of emptiness as the nature of reality) or **non-cognitive** (the complete cessation of conceptual construction, including the view of emptiness)?
  2.  **The Coherence of Dependence:** Can *pratītyasamutpāda* (dependent origination) be coherently maintained if no conventional entity possesses even provisional intrinsic nature? Specifically, does the total absence of *svabhāva* render conventional causality unintelligible, or does it make causality possible?

  ### 4. Internal Conceptual Tests and Predicted Outcomes

  For each crux, we specify a conceptual test derived from Madhyamaka reasoning. We agree these tests bear directly on the cruxes, though we predict different outcomes.

  **Test A: The Status of the Buddha's Teaching (Regarding Crux 1)**
  *   **The Argument:** Analyze the statement "The Dharma is like a raft." If the Dharma is a correct description of reality, it must be retained. If it is merely a tool for crossing, it must be discarded upon arrival.
  *   **Application of Negation (MMK Ch 15):** We apply the distinction between *prasajya-pratiṣedha* (non-implicative) and *paryudāsa-pratiṣedha* (implicative) to the claim "The Dharma is empty."
      *   **NAS Prediction:** The statement "The Dharma is empty" must be read as *prasajya-pratiṣedha*. It negates the view that the Dharma has intrinsic nature without positing "emptiness" as a new nature. Therefore, the aim is **non-cognitive**. To hold the view of emptiness is to fail the test of the raft; the view itself must be negated to stop *prapañca*.
      *   **DR Prediction:** The statement "The Dharma is empty" functions as *paryudāsa-pratiṣedha* at the conventional level. It negates *svabhāva* but implies the positive correlate of *dependence*. Therefore, the aim is **cognitive**. One must retain the correct view of dependence (emptiness) to distinguish truth from falsehood; discarding the view leads to nihilism, not liberation.

  **Test B: The Possibility of Causal Efficacy (Regarding Crux 2)**
  *   **The Argument:** Analyze the relation between cause and effect in MMK Chapter 1. If cause and effect lack *svabhāva*, can they interact?
  *   **Application of Negation (MMK Ch 15):** We examine the negation of *svabhāva* in Chapter 15, verses 1–4, which states *svabhāva* cannot be made from causes and conditions.
      *   **NAS Prediction:** Since *svabhāva* is unproduced, and phenomena are produced, phenomena lack *svabhāva* entirely. Because they lack *svabhāva*, they have no determinate identity to sustain causal power. Causal efficacy is therefore **merely conventional and ultimately ineffable**. Any attempt to logically explain *how* cause leads to effect without *svabhāva* is itself *prapañca*.
      *   **DR Prediction:** Since *svabhāva* is unproduced, only things *without svabhāva* can be produced. Therefore, the lack of *svabhāva* is the **necessary condition for causal efficacy**. Causality is determinately structured by emptiness. The logical explanation of this dependence is coherent and constitutes a realist account of the conventional world.

  ### 5. Joint Assessment of Verbal Disputes

  We agree that a portion of our dispute is verbal rather than substantive, arising from divergent definitions of key technical terms.

  1.  **"Ultimate Truth" (*Paramārthasatya*):**
      *   **Diagnosis:** The NAS uses "Ultimate Truth" to refer to a non-conceptual experience or state of cessation (*nirodha*) where no propositions hold. The DR uses "Ultimate Truth" to refer to the ultimate *nature* of phenomena (i.e., the fact that they are empty), which can be correctly propositionally asserted.
      *   **Resolution:** Once disambiguated, we agree that NAS denies propositions at the level of *experience*, while DR affirms propositions at the level of *analysis*. We endorse the diagnosis that we are often talking past one another regarding whether "truth" implies "propositional accuracy" (DR) or "soteriological efficacy" (NAS).

  2.  **"Realism":**
      *   **Diagnosis:** The DR uses "Dialectical Realism" to mean that conventional reality is robust, structured, and amenable to logical inquiry. The NAS hears "Realism" as implying the existence of *svabhāva* or mind-independent entities, which Madhyamaka explicitly denies.
      *   **Resolution:** We agree that if "Realism" is defined as "belief in *svabhāva*," neither camp is a realist. If "Realism" is defined as "the coherence of conventional logical structures," the DR is a realist and the NAS is not. We endorse the diagnosis that the DR's "realism" is strictly conventional, while the NAS rejects the label to avoid ontological commitment.

  **Signed,**

  _________________________
  Representative, Non-Assertive Soteriology

  _________________________
  Representative, Dialectical Realism
