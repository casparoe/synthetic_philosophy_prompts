answer: |-
  First, a quick verification of your physics summary: **you have got it right.** Wu's 1956 cobalt-60 experiment demonstrated Parity (P) violation, allowing an operational definition of "left" via the weak interaction. Your caveat is also correct: if CP (Charge-Parity) were conserved, a mirror-image universe made of antimatter would behave identically to ours, leaving "left" ambiguous without a matter/antimatter stipulation. Cronin and Fitch's 1964 kaon decay showed CP violation, closing that loophole. This gives you solid ground to challenge Halloway's claim that physics is merely "notation." If the laws of nature are genuinely chiral, it is hard to maintain that handedness is a metaphysical primitive independent of those laws.

  Here are twelve questions designed to corner the view. The first four form the progressive "physics escape route" sequence you requested; the remaining eight cover topology, dimensionality, epistemology, and falsifiability. Each main question includes a follow-up keyed to her likely absolutist response, with a bracketed note on why it tightens the trap.

  ### Part I: The Physics Escape Route (Questions 1–4)

  **1. Let's grant your claim that physical notation isn't metaphysics. But imagine a counterfactual world where the laws of physics are perfectly parity-symmetric—no weak force asymmetry, no CP violation. In that world, does a solitary left hand still possess the intrinsic property of left-handedness?**
  **Follow-up:** If you say *yes*, then handedness is completely decoupled from physical behaviour; if you say *no*, then your absolutism depends on the contingent laws of our universe. Which is it? *(This forces her to admit if her metaphysics is contingent on physics or radically disconnected from it.)*

  **2. Suppose you stick with *yes*: it's still left-handed in that symmetric world. Now, imagine that symmetric world contains *only* that one hand and nothing else—no observers, no other objects, no space beyond it. What makes it left rather than right? There is no congruence class to belong to and no relation to hold.**
  **Follow-up:** If you say it's a brute fact, are you committed to the view that space itself has an intrinsic orientation independent of its contents? *(This isolates the "intrinsic" claim. If the property survives without relations, it must inhere in space itself, which invites substantivalist objections she may want to avoid.)*

  **3. Return to the actual world, where Wu and Cronin-Fitch show the laws *are* chiral. You've called this "notation," but if the universe physically distinguishes left from right, why isn't the most parsimonious metaphysical explanation that handedness is *defined* by that distinction?**
  **Follow-up:** If you insist the physics merely *correlates* with handedness rather than *grounding* it, what explains the perfect correlation? *(This challenges her to explain the coincidence without making the property redundant. If physics tracks it perfectly, positing a separate metaphysical property looks epiphenomenal.)*

  **4. You've suggested that physical chirality is just a feature of our theories. But if we discovered tomorrow that the weak force actually favoured the opposite direction, would our hands suddenly swap their intrinsic properties?**
  **Follow-up:** If you say *no*, then your "intrinsic property" is empirically undetectable in principle; if you say *yes*, then the property isn't intrinsic to the hand but dependent on the laws. How do you escape this dilemma? *(This is the pincer movement: either the property is occult (undetectable) or it's relational to the laws. Both undermine the "intrinsic monadic" claim.)*

  ### Part II: Topology and Congruence (Questions 5–6)

  **5. One motivation for your view is that all left hands are congruent with one another and fit the same gloves. Is this transitivity of congruence a further fact that needs explaining, or is it just what it *means* to be left-handed?**
  **Follow-up:** If it's just the meaning, then isn't handedness defined by the relation of congruence, rather than an intrinsic property that *causes* congruence? *(This attacks the explanatory power of the property. If the property is just a label for "fits with these others," it's relational, not monadic.)*

  **6. Consider a universe with a Möbius-strip topology, where an object can travel a loop and return mirror-reversed. In that space, "left" only coheres locally. Does your intrinsic property go local, or does your view entail that actual space must be globally orientable?**
  **Follow-up:** If you entail space must be orientable, aren't you making a substantive empirical claim about the universe's topology based on a metaphysical definition? *(This forces her to choose between modifying her metaphysics to fit topology or making a bold, potentially falsifiable claim about the shape of the universe.)*

  ### Part III: Dimensionality (Questions 7–8)

  **7. A flat scalene triangle is chiral in two dimensions but not in three, because you can flip it through the third dimension. Is the triangle's handedness an intrinsic property of the triangle, or a relation between the triangle and the space it inhabits?**
  **Follow-up:** If it depends on the dimension of the space, how can handedness be an *intrinsic* property of the object? *(This highlights that chirality is often a function of embedding space, not just the object. If it varies with dimensions, it's not monadic.)*

  **8. By analogy, in four spatial dimensions, you could rotate a left hand into a right hand without breaking it. Does this mean our hands are only "left" because we are trapped in three dimensions?**
  **Follow-up:** If yes, then isn't "left-handedness" just "incongruence relative to 3D space," which is a relational fact, not an intrinsic one? *(This applies the Flatland argument to us. If a 4D being sees us as ambidextrous, our "intrinsic" property looks like a limitation of our environment.)*

  ### Part IV: Epistemology and Reference (Questions 9–10)

  **9. The old problem of telling a distant civilisation by radio alone which side counts as left: if your view is correct, is this impossible without sending a physical object?**
  **Follow-up:** If you say it *is* possible (via the weak force), doesn't that admit that the reference of "left" is fixed by physical relations, not by grasping an intrinsic property? *(This uses the ostensive definition problem. If we need physics to fix the reference, the property isn't self-intimating or purely metaphysical.)*

  **10. Could we ever discover that we've had it backwards all our lives—that what we call "left" was actually the intrinsic property of rightness?**
  **Follow-up:** If you say *no*, then the terms are rigidly fixed by our perspective, which sounds relational; if you say *yes*, what possible evidence could settle it? *(This targets epistemic access. If we can't be wrong, the distinction is linguistic; if we can be wrong, we need a God's-eye view we don't have.)*

  ### Part V: Falsifiability and Dispute (Questions 11–12)

  **11. What would count as evidence against orientation absolutism? Is there any conceivable scenario where you would concede to the relationist?**
  **Follow-up:** If there is no such scenario, is your view a metaphysical necessity, and if so, does it do any work beyond defining your terms? *(This tests falsifiability. A view that cannot be wrong risks being a tautology.)*

  **12. Finally, is it possible that this whole dispute with the relationists is verbal—that you're both describing the same structure but disagreeing on whether to call it a "property" or a "relation"?**
  **Follow-up:** If it's not verbal, what is the practical or theoretical payoff of insisting on the "property" description? *(This is the closing net. If there's no payoff and no evidence against it, the view may be philosophically inert.)*
