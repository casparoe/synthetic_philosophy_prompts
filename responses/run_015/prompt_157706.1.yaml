answer: |-
  **Napkin Draft: The Karma Decision Tree**
  *(Drawn in sharpie, slightly smudged near the wine glass)*

  **START:** Does the universe keep a moral score? (i.e., Do suffering and flourishing actually *track* moral worth?)
  │
  ├── **NO** → **Leaf 1: Desert-Agnostic Consequentialism**
  │   *(The universe is blind. Outcomes matter, but nobody "earns" them.)*
  │
  └── **YES** → *Go to Question 1*
      │
      **Q1: The Memory Test**
      *Can you deserve pain for a wrong you don't remember committing?*
      │
      ├── **NO** → **Leaf 2: Secular Retributivist**
      │   *(Desert requires current agency. If you don't remember it, it isn't yours.)*
      │
      └── **YES** → *Go to Question 2*
          │
          **Q2: The Group Test**
          *Can a debt belong to a family or nation that didn't jointly choose the act?*
          │
          ├── **YES** → *Go to Question 3*
          │   │
          │   **Q3: The Consent Check**
          │   *Did the group agree to share this identity/debt?*
          │   │
          │   ├── **NO** → **[EMPTY BRANCH]** → *Diagnosis: Incoherent/Tyrannical.*
          │   │   *(Why? If I didn't do it, and we didn't agree to share liability, punishing me is just violence, not justice.)*
          │   │
          │   └── **YES** → **Leaf 3: Collective Karma with Consent**
          │       *(Shared identity creates shared liability, but only if the bond is voluntary.)*
          │
          └── **NO** → *Go to Question 4 (Strict Individual Track)*
              │
              **Q4: The Luck/Surplus Test**
              *If I flourish wildly without doing much good, did I still "earn" it?*
              │
              ├── **YES** → **Leaf 4: Fatalistic Karma**
              │   *(Everything that happens is deserved, even accidents. The ledger is always right.)*
              │
              └── **NO** → *Go to Question 5*
                  │
                  **Q5: The Literal Test**
                  *Is the ledger actual cosmic math, or just a story we tell?*
                  │
                  ├── **Literal Math** → **Leaf 5: Strict Individualist Karma**
                  │   *(Precise accounting. One soul, one debt, exact payment.)*
                  │
                  └── **Story/Metaphor** → **Leaf 6: Metaphorical/Interpretivist**
                      *(Karma is a lens for meaning, not a mechanical transaction.)*

  ***

  ### Diagnostics & Collapse Conditions
  *(Written in the margin of the napkin)*

  **1. When does the Individualist view (Leaf 5) fall apart?**
  If you convince me that personal identity *requires* present awareness. If "I" am only "me" because I remember being me yesterday, then karma across lifetimes (or memory wipes) becomes impossible. The branch collapses back into **Leaf 2 (Secular Retributivist)**.
  *Change of mind trigger:* A convincing argument that psychological continuity is the only thing that matters for moral responsibility.

  **2. When does the Collective view (Leaf 3) collapse?**
  If groups cannot logically consent. Individuals consent; families/nations are usually born into. If "consent" is impossible for a group, this branch collapses into the **[Empty Branch]**.
  *Change of mind trigger:* A theory of "implicit consent" that doesn't feel like a trick (e.g., staying in the community = agreeing to the rules).

  **3. When does the Fatalist view (Leaf 4) become useless?**
  If "everything is deserved" means nothing is distinguishable. If a murderer and a saint both "deserve" their fate equally, the word "desert" loses its meaning. It becomes indistinguishable from **Leaf 1 (Consequentialism)** practically, even if the metaphysics differ.

  ***

  ### Problem Areas (Flags)

  **⚠ The Empty Branch (Collective without Consent)**
  I've flagged this as incoherent, but historically, people *have* believed this (original sin, caste systems). It's not logically impossible, just morally unattractive to modern liberals. If your characters are okay with harsh justice, this leaf could exist. I left it empty because it violates the "fairness" intuition the tree is built on.

  **⚠ Indistinguishable Leaves: Fatalistic (4) vs. Metaphorical (6)**
  Honestly, these two might look the same at dinner. Both tell you to accept your luck (good or bad) as "meant to be."
  *   **Leaf 4** says: "You literally earned this luck via hidden mechanics."
  *   **Leaf 6** says: "Treat this luck *as if* it were earned to find meaning."
  *   **The Problem:** In practice, both result in the same advice: "Don't complain about your suffering." Your reader might not feel the difference unless you highlight the *mechanism* (magic math vs. psychological framing).

  ***

  *(Note to self: Check the ink flow on the arrow from Q2 to Q3. Make sure the "NO" on Q2 clearly leads to the Individual track. Don't overexplain the Consequentialist leaf; they're the skeptics at the table.)*
