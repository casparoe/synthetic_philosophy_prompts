answer: |-
  **The Case**

  Claire and David are members of a community theater troupe with no formal hierarchy. The troupe relies on a shared collection of vintage costumes managed by Arthur, an elderly volunteer who is not a member but is Claire's father. Two weeks ago, Claire secretly damaged a prized costume to secure a role for herself; the damage was significant, recent, and remains unacknowledged by her. David knows Claire did this. Yesterday, David damaged a different costume to sabotage a rival's performance. Claire confronts David directly. She does not cite troupe rules or abstract fairness. She says, "You knew how much this work means to my father. You've made his job impossible and disrespected his time. You need to fix this." She is not trying to distract from her own sabotage; she is motivated solely by the burden placed on Arthur. David replies, "You damaged the velvet gown last week. You have no right to lecture me." Claire does not deny her action, but she does not confess it to the troupe or repent; she maintains her silence on her own guilt while insisting David answer to her.

  **The Walkthrough**

  **1. Aptness of the Blame**
  The blame is otherwise apt. David's action was a genuine wrong (destruction of shared property/exploitation of volunteer labor). Claire's belief that he is responsible is true. Her attitude (resentment/indignation) fits the harm done. The blame is addressed to David as a moral agent, not muttered to a third party. David has no excuse (he acted freely for gain). The content of the blame is accurate: David did disrespect Arthur's work. The only barrier to propriety is Claire's record.

  **2. The Verdicts**
  *   **The Forfeiture View:** Claire lacks standing. By committing the same generic wrong (sabotage of props) for similar gain, and failing to acknowledge or repent, she has forfeited the moral authority to demand accountability for that type of wrong. Her blame is an exercise of power, not right. David's *tu quoque* is a complete defense against her demand.
  *   **The Relationship (Second-Personal) View:** Claire has derivative standing. Standing is not solely a function of the blamer's purity but of the normative relationship between the parties. Here, the relevant relationship is not Claire-David, but Claire-Arthur. As Arthur's daughter and de facto caretaker, she holds a proxy authority to protect his interests. She is not blaming David for violating a rule she claims to uphold universally; she is blaming him for violating *her father*. Her standing is borrowed from the victim.
  *   **The Character View:** The hypocrisy is a fact about Claire, not the blame. The truth of the claim ("You wronged my father") is independent of the speaker's virtue. If the blame serves the function of moral repair (prompting David to fix the damage), it is permissible. Claire's insincerity regarding the *general* rule is irrelevant because she is sincere regarding the *specific* harm to Arthur.

  **3. The Honest Part: What Is Doing the Work?**
  The single feature generating standing is the **Antecedent Victim-Proxy Link**. Claire is not blaming as a fellow member policing a rule; she is blaming as a guardian policing a harm to her charge.

  **The Collapse:** Remove the relationship. If Arthur is a stranger, Claire collapses into a bog-standard hypocrite. Without the proxy link, her blame reverts to general moral policing ("You shouldn't sabotage props"), at which point her own unrepentant sabotage renders her self-exempting and insincere regarding the norm. The *tu quoque* sticks immediately. The relationship is the only thing insulating her from the forfeiture condition.

  **The Laundering Objection:** A forfeiture theorist will attack this by arguing that if the Proxy Link cures hypocrisy, the forfeiture condition is empty. Any hypocrite could "adopt" a victim to launder their blame. "I stole from the till, but I'll blame you on behalf of the owner."
  *   **Response:** The laundering objection holds only if the proxy link can be manufactured ad hoc. In this case, the link (daughter/caretaker) is *antecedent* to the blame situation. It is not a role assumed to facilitate the blame; it is a relationship that generates independent duties of protection. This limits the laundering: you cannot blame on behalf of a victim unless you already bear a special responsibility for that victim's well-being.
  *   **Remaining Tension:** However, the forfeiture theorist has a stronger point: Claire's own wrong against Arthur contaminates the proxy. Can one claim to protect a victim one is currently harming? If Claire has not repaired her own damage to Arthur, her claim to speak for him is compromised. This suggests that while the Proxy Link grants *some* standing, it does not grant *full* standing. It grants standing to demand repair for *this* instance, but not to cast the first stone on the *type* of action. This supports a **scalar view of standing**: Claire has standing to say "Fix this for my dad," but not "You are a saboteur." If she crosses into the latter, the laundering fails, and the hypocrisy reclaims the ground.
