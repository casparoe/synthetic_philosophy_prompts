      *   *Alleged Injury:* Psychological trauma, fear, dignitary harm, potential incitement (though court found no imminent lawless action).
      *   *Self vs. Other-Regarding:* Mill says self-regarding actions are immune. Is speech self-regarding? Usually considered other-regarding because it affects listeners. But Mill protects opinion/expression unless it causes *harm*.
