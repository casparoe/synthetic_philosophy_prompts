      Regarding addiction: Apply the Regard principle. Did the crime express disregard for your rights (e.g., theft, violence)? If yes, resentment is a valid protective response. It signals that your boundaries matter. However, if the addiction has completely obliterated their agency (they are truly "in the grip"), you might shift resentment from the person to the disease. But be careful: don't let "they can't help it" excuse repeated violations of your safety. If they refuse recovery, their continued choice to remain addicted while harming others reintroduces agency. Resent them enough to protect yourself, but perhaps not enough to seek revenge.

