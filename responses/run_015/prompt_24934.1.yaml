prompt: |-
  So I've been thinking about resentment lately — like, when it feels justified to resent someone and when it doesn't. Not in a abstract philosophical way (I'm not a philosopher, I just fell down a rabbit hole after a bad falling-out with a friend). I started keeping track of my gut reactions to different situations, real and imagined, and now I'm trying to figure out if there's a coherent principle behind them or if I'm just inconsistent. Here's what I've got:

  - A colleague takes credit for my work in a meeting. I resent them. Seems clear.
  - A friend forgets we had plans because their parent had a medical emergency. I don't resent them at all.
  - A friend forgets we had plans because they were binge-watching a show and lost track of time. I resent them, though less than the colleague case.
  - Someone with severe schizophrenia says something cruel to me during an episode. I don't resent them — I just feel sad and want them to get help.
  - A person diagnosed with antisocial personality disorder lies to me and manipulates me for their own gain. I resent them, strongly, even though I believe their condition means they literally cannot empathize or grasp why what they did was wrong.
  - A coworker with OCD interrupts meetings constantly with compulsive rituals. I don't resent them; I see it as something to be accommodated.
  - Someone who grew up in an extremely abusive household and never had a chance to learn emotional regulation screams at me during an argument. I'm genuinely torn — part of me resents them, part of me thinks they never had a fair shot at turning out differently.
  - A stranger cuts me off in traffic because they're texting. I resent them.
  - A stranger cuts me off in traffic because they're rushing someone to the hospital. I don't resent them.

  The ones that bug me are the sociopath case and the abusive-upbringing case sitting next to the schizophrenia and OCD cases. In all four, there's a sense in which the person "can't help" being the way they are — but I'm pulling in totally different directions. With the schizophrenic person and the OCD coworker, I drop resentment entirely. With the sociopath, I don't. With the abuse survivor, I'm stuck in the middle.

  Is there a principle that makes sense of all these verdicts? And if not, which ones should I reconsider? Also, what would your principle say about a case I keep going back and forth on: someone commits a serious crime while in the grip of a severe addiction — not a one-time lapse, but a years-long substance use disorder that has demonstrably rewired their decision-making. Should I resent them, or not?

  Please keep your answer to under 400 words — I want the principle stated clearly and then applied, not a essay.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** Resentment (justified vs. unjustified).
      *   **Input:** A list of 9 scenarios with the user's intuitive verdicts (resent vs. don't resent).
      *   **Problem:** Inconsistency regarding mental health/capacity cases (Schizophrenia/OCD vs. Antisocial Personality Disorder/Abusive Upbringing).
      *   **Specific Question:** Is there a coherent principle? If not, which verdicts to reconsider? What about the addiction/crime case?
      *   **Constraint:** Under 400 words.
      *   **Tone:** Clear, principled, not abstract philosophy (practical).

  2.  **Analyze the Data Points:**
      *   Colleague takes credit -> Resent (Intentional harm/selfishness).
      *   Friend forgets (medical emergency) -> No Resent (External constraint/valid excuse).
      *   Friend forgets (binge-watching) -> Resent (Negligence/low priority).
      *   Schizophrenia (cruel during episode) -> No Resent (Loss of agency/reality testing).
      *   Antisocial PD (manipulation) -> Resent (Despite lack of empathy, action is goal-directed/harmful).
      *   OCD (interrupts) -> No Resent (Compulsion/non-malicious).
      *   Abusive upbringing (screaming) -> Torn (Determinism vs. Responsibility).
      *   Stranger texting -> Resent (Negligence).
      *   Stranger hospital -> No Resent (Valid excuse).

  3.  **Identify the Underlying Principle:**
      *   The common thread isn't just "could they help it?" (determinism), because the user resents the sociopath despite believing they "cannot empathize."
      *   The thread seems to be **Regard for Others** or **Orientation of Will**.
      *   Schizophrenia/OCD/Medical Emergency: The action is not an expression of ill will or disregard. It's a symptom or external force.
      *   Colleague/Texting/Binge-watching: The action expresses disregard for the victim's worth/rights.
      *   Antisocial PD: Even if they *can't* empathize, their action is *instrumental* and *exploitative*. They are using the victim. This feels like a violation of respect, even if rooted in pathology.
      *   Abusive Upbringing: The screaming is an expression of unregulated anger, which feels like disregard, even if the capacity was stunted.
      *   *Proposed Principle:* Resentment is justified when the harm expresses **disregard for your standing**, not merely when it causes harm. Capacity matters, but *orientation* matters more.

  4.  **Drafting the Principle:**
      *   Focus on "Quality of Will" (Strawson-esque but simplified).
      *   Resentment responds to *contempt* or *indifference* toward you.
      *   Excuses (OCD, Psychosis, Emergency) negate the idea that the act reflects their regard for you.
      *   Exemptions (Sociopath, Addiction) are trickier. If the behavior is predatory or negligent despite internal constraints, it still feels like a violation of standing.

  5.  **Addressing the Problem Cases:**
      *   *Sociopath:* You resent them because their action is *exploitative*, treating you as a tool. Even if they can't feel empathy, the act itself is a denial of your equal standing.
      *   *Abusive Upbringing:* You're torn because the *capacity* for regard was damaged, but the *expression* is still hostile. Verdict: Mitigate resentment, but don't erase it. Safety first.
      *   *Addiction/Crime:* If the crime harms you directly (theft, violence), resentment is natural because your rights were violated. However, understanding the rewiring might shift resentment toward the disease rather than the person, *unless* they refuse help or repeatedly violate boundaries.

  6.  **Refining for Word Count:**
      *   Need to be concise.
      *   State principle clearly.
      *   Apply to the tricky cases.
      *   Apply to addiction case.

  7.  **Drafting (Mental or Scratchpad):**
      *   Principle: Resentment is a response to being treated with disregard. It asks: "Did this action show they don't value me?"
      *   Schizophrenia/OCD/Emergency: No disregard shown. It's noise/force.
      *   Colleague/Texting/Binge: Disregard shown.
      *   Sociopath: Yes, disregard. They used you. Capacity for empathy doesn't negate the insult of being used.
      *   Abusive Upbringing: Mixed. The anger shows disregard, but the capacity was broken. Mitigate resentment for safety, not forgiveness.
      *   Addiction: If the crime harmed you, resentment is valid self-protection. But if they are seeking recovery, shift to compassion. If not, resentment protects boundaries.

  8.  **Editing for Constraints (Under 400 words):**
      *   Check word count constantly.
      *   Ensure direct answers.

