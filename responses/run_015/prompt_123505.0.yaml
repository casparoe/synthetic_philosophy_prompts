  Here is the breakdown. I am treating this as a debate case construction: I will assign credences to the sub-claims, combine them, and then apply the resulting framework to your "Dormant Violence" and 2100 problems.

  ### The Decomposition

  **1. Is there a fact of the matter, or is it just stipulation? (Brother's Claim)**
  *   **Credence:** 0.90 that there is a fact of the matter.
  *   **Justification:** While boundary cases exist (is a shout violence?), the core cluster of "physical harm inflicted by agency" is robust enough across centuries to allow comparison; denying this makes all history unintelligible.
  *   **Confidence:** High.

  **2. Did direct physical violence rates (homicide, war, assault) fall per capita from 1500 to 2025?**
  *   **Credence:** 0.85 that they fell.
  *   **Justification:** 1500 featured endemic feudal warfare, legal torture, and lack of policing, whereas 2025 has monopolized state force and strong norms against interpersonal aggression.
  *   **Confidence:** High.

  **3. Does including structural harm (poverty, disease, systemic neglect) flip the trend?**
  *   **Credence:** 0.65 that the trend still holds (2025 is still better).
  *   **Justification:** 1500 had massive famine and plague mortality due to logistical/medical failure, which likely exceeds modern structural death rates even accounting for population size.
  *   **Confidence:** Medium (This is the fuzziest metric).

  **4. Should we measure per-person rate or absolute numbers for this specific claim?**
  *   **Credence:** 0.95 that per-person is the correct metric.
  *   **Justification:** The claim specifies a "randomly picked person," which mathematically necessitates a probability (rate), not a total sum.
  *   **Confidence:** Very High.

  ### The Combined Credence

  **My Number:** **0.82**
  *(I am slightly more confident than you (0.75) that the world is less violent, primarily because I weigh the "Direct Violence" drop heavier than the "Structural" ambiguity.)*

  **Who is wrong about what?**
  *   **Maya (0.35):** She is most likely wrong on **Sub-question 2**. She is probably conflating the *visibility* of violence (24-hour news) with the *frequency*, or she is intuitively weighting absolute numbers (more people = more total pain) despite the prompt asking about individual risk.
  *   **Maya's Brother:** He is wrong on **Sub-question 1**. He is using philosophical skepticism to dodge a historical trend. Just because "heap" is a vague word doesn't mean we can't tell the difference between a pile of sand and a single grain.
  *   **You (0.75):** You are arguably too skeptical on **Sub-question 2**. You suspect the definition is being rigged; while definitions matter, the drop in homicide and battle-death rates is so massive (orders of magnitude in some datasets) that it survives reasonable definitional tweaking.

  **Weakest Link:** **Sub-question 3 (Structural Violence).**
  *   **Why:** This is the hardest to measure historically. We have good records for skeletons with trauma (1500) vs. bodies (2025), but estimating death by "feudal exploitation" vs. "capitalist neglect" is inherently model-dependent.
  *   **What would move it:** If you could show that modern global supply chains cause more premature deaths via labor exploitation/environmental collapse than pre-modern local famines did, this number drops. If modern medicine/logistics save more than systems kill, it stays high.

  ---

  ### Addressing "Dormant Violence"

  You defined **Dormant Violence** as harm prevented only by the credible threat of force (cops, prisons, nukes). You asked if this counts toward the measure.

  **The Framework's Answer:**
  No, it does not count as "violence done," but it counts as a **risk premium** on the peace.

  In our decomposition, we are measuring *actualized harm* to a random person. A threat that is not carried out is not violence *done*. However, a society running on dormant violence is **fragile**. It means the *variance* on your violence risk is higher.
  *   **1500:** High baseline violence, low variance (you know you might get robbed).
  *   **2025:** Low baseline violence, high variance (you are safe until the police state collapses or a war starts).

  **Weighting:**
  If you are measuring "Quality of Life," Dormant Violence is a cost (you live in fear or under surveillance). If you are measuring "Violence Done," it is zero until triggered.
  *   **Coherence:** It is coherent, but it is a measure of *stability*, not *violence*. A glass wall is not a punch, even if it stops you from walking forward.
  *   **Falsifiability:** You can measure it by looking at "attempted violence prevented" (arrests, interceptions) vs. "spontaneous cooperation." If 90% of people obey laws only because of cameras, dormancy is high. If they obey because of norms, dormancy is low.

  ---

  ### The 2100 Scenario Case Study

  **The Setup:** 10 billion people. Interpersonal violence ≈ 0. Control systems exist that can kill hundreds of millions, held in check only by deterrence.
  **The Question:** Is this less violent than 1500?

  **Applying the Framework:**

  1.  **Direct Violence Rate (Sub-question 2):** In 1500, your annual risk of assault/homicide was maybe 1%+. In 2100, it is near 0%. **Winner: 2100.**
  2.  **Structural Violence (Sub-question 3):** In 1500, you likely died of infection or hunger by 35. In 2100, assuming the "nobody hits anybody" premise implies functional logistics, you likely live to 80+. **Winner: 2100.**
  3.  **The Dormant Violence / Risk Factor:**
      *   In 1500, the max damage one actor could do was burn a village (hundreds dead).
      *   In 2100, the max damage one actor could do is kill hundreds of millions.
      *   However, the prompt asks about the likelihood of violence *done to a randomly picked person*.
      *   **Calculation:**
          *   1500 Expected Harm = (High Probability of Small Violence) + (Low Probability of War Death).
          *   2100 Expected Harm = (Near Zero Probability of Small Violence) + (Tiny Probability of Catastrophe × Massive Magnitude).
      *   Unless the probability of the 2100 catastrophe is *very* high (e.g., >10% per lifetime), the math still favors 2100. In 1500, violence was *guaranteed* (you would be hit, or know someone who was). In 2100, the catastrophe is a gamble.

  **The Verdict:**
  **Yes, 2100 is less violent than 1500 by this framework.**
  Even with the "Dormant Violence" of doomsday weapons, the *Expected Lifetime Harm* is lower because the baseline of daily brutality in 1500 was so universally high.

  **The Catch (Where your brain broke):**
  You are sensing that 2100 is *more dangerous* in terms of **existential risk**, even if it is **less violent** in terms of **incidence**.
  *   **Violence** = Energy dissipated as harm.
  *   **Danger** = Potential for future harm.
  *   1500 was High Violence, Low Danger (couldn't kill everyone).
  *   2100 is Low Violence, High Danger (could kill everyone).

  If your debate resolution is "Is the world less violent?", 2100 wins.
  If the resolution is "Is the world safer from extinction?", 1500 might win.
  Maya is arguing about *safety/feeling*. You are arguing about *statistics*. Her brother is arguing about *semantics*. You win the stats, she wins the vibe, he wins the philosophy, but on the specific claim "likelihood of violence done to a random person," the number is **0.82 True**.
