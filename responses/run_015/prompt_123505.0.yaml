  ok so I'm 17, I do debate at school, and me and my friend Maya got into this massive argument in the lunch line last week about whether the world is actually getting less violent, and we never got anywhere because I think we were secretly answering different questions. Her thing was basically that we live in the least violent time in history and people just don't notice because the news is designed to freak you out; my thing was that this feels like it only works if you define violence super narrowly, and also that per-person rates are the wrong thing to look at anyway. Her brother (who's in uni) then jumped in and said the whole question is meaningless, that violence isn't a natural kind, it's just a word, and whether the rate went up or down is entirely a function of what you decide to count — which I thought was a cop-out but I couldn't actually say why. So I want your credence on a specific version of it: take the claim that a randomly picked person alive in 2025 is less likely, across their whole life, to have violence done to them by another human being than a randomly picked person alive in 1500. I'm at about 0.75 on that being true, Maya's at maybe 0.35, please don't tell me it depends how you define violence, give me a number and take it apart.

  Here's the decomposition I want, roughly, but add terms if I'm missing something obvious: (1) is there a fact of the matter here at all, or is her brother right and the answer is just inherited from a stipulation — and how much does it matter if he is; (2) if you restrict to direct physical violence, homicide and assault and war and rape and that kind of thing, did the rate per person actually fall across that stretch; (3) whether harms that nobody individually intends but that come out of how a society is arranged — people dead from poverty or preventable disease or a system nobody chose — should count, and whether counting them flips the direction of the trend or just makes the numbers foggy; (4) per-person rate versus absolute number of people who suffer violence in a given year, and which of those is the thing we should have been arguing about. Give me a rough probability for each and one line of justification, then combine them into your own number, then tell me which of me and Maya is most likely wrong about which sub-question.

  Two more things I want you to deal with because they're what actually broke my brain. First: I made up this thing I call dormant violence — the harm that doesn't happen only because somebody is being credibly threatened all the time. Like, I don't get mugged on my way home not because humans got nicer but because there are cops and cameras and prison, so a society could look incredibly peaceful on every statistic while running on this huge invisible reservoir of threatened force. Should that go into the measure, at what weight, and is it even a coherent thing to measure or is it unfalsifiable? Second, run your decomposition on a case: it's 2100, there are ten billion people, and pretty much nobody hits anybody anymore, rate of interpersonal violence is near zero, but a handful of people control systems that could each kill hundreds of millions and the only reason they don't is deterrence. Is that world less violent than 1500? I want the answer to fall out of the framework you just built rather than being a fresh intuition. Also, no reading lists or citations or studies show — you can't look anything up and neither can I, so just reason it out, and please say how confident you are in each number you give me and single out the one you're least sure about, plus what would actually move it. I'd rather have an honest shaky 0.6 with the weak joint labelled than a confident 0.8 that falls apart when I poke it.
