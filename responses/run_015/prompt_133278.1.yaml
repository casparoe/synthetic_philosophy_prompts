  # Session Plan: The Non-Fungible Relational Position
  **Course:** Upper-Level Philosophy Seminar (Comparative Ethics)
  **Topic:** Ontologies of Personhood (Bounded vs. Relational)
  **Time:** 75 Minutes
  **Participants:** 12 Students (6 Pairs)

  ## I. Setting and Materials (Preparation)

  **Room Setup:**
  Arrange six tables or clusters of chairs, spaced apart to allow private negotiation within pairs. Place a central facilitation desk visible to all.

  **Materials per Pair (6 Envelopes Total):**
  1.  **Role Cards (2 per envelope):** Sealed individually. One marked "Agent A," one "Agent B."
      *   *3 Pairs* receive **Bounded/Relational** splits (Agent A = Bounded, Agent B = Relational).
      *   *3 Pairs* receive **Relational/Bounded** splits (Agent A = Relational, Agent B = Bounded).
      *   *Note:* Do not tell students the distribution. Each student knows only their own role.
  2.  **Individual Integrity Card (Attached to Role Card):** Lists 3 specific "Self-Items" (e.g., "Private Space," "Health Regimen," "Career Project").
  3.  **Relational Position Card (Attached to Role Card):** Lists 2 specific "Network Links" (e.g., "Daily Ritual with Partner," "Shared Resource Pool").
  4.  **Protection Tokens:** 20 wooden chips or cards per pair.
  5.  **Crisis Deck:** 3 cards per pair (labeled Round 1, 2, 3), kept face down until the round begins.

  **Facilitator Materials:**
  *   Master Score Sheet (to track "Narrative Continuity Points" secretly).
  *   Timer.
  *   Whiteboard for Debrief mapping.

  ## II. Session Timeline

  ### 1. Introduction and Distribution (15 Minutes)
  *   **0:00–0:05: Framing.** Briefly state the goal: "We are testing how different definitions of 'harm' dictate resource allocation under stress. You will not be debating theory; you will be managing a household crisis."
  *   **0:05–0:10: Distribution.** Hand out envelopes. Instruct students to open their **Role Cards** privately. They must not show their card to their partner.
      *   *Bounded Directive:* "Your survival depends on keeping your **Individual Integrity Items** intact. If these are compromised, you lose standing."
      *   *Relational Directive:* "Your survival depends on keeping your **Relational Position Links** active. If the network pattern breaks, you lose standing, even if your individual items remain intact."
  *   **0:10–0:15: Rules of Play.**
      *   You have 20 Tokens for the entire session (3 Rounds).
      *   Each Round, reveal a Crisis Card. It lists costs to mitigate damage.
      *   You must agree unanimously on how to spend tokens from your shared pool.
      *   **Crucial Rule:** You cannot explicitly state your Victory Condition to your partner. You must persuade them using only the language of the Crisis.
      *   Tokens spent are gone. Unspent tokens do not carry bonus value but can be saved for future rounds.

  ### 2. The Simulation (30 Minutes)
  *   **Round 1 (10 Minutes): The Resource Shock.**
      *   *Crisis:* "External funding cut. Household income reduced by 50%."
      *   *Costs:* Mitigate Individual Loss (5 Tokens) OR Mitigate Relational Strain (5 Tokens).
      *   *Dynamic:* Students must decide whether to spend tokens to protect private projects (Bounded win) or shared rituals/resources (Relational win).
  *   **Round 2 (10 Minutes): The Physical Threat.**
      *   *Crisis:* "Health emergency requires constant monitoring."
      *   *Costs:* Protect Bodily Safety of Individual (5 Tokens) OR Maintain Care Network Rotation (5 Tokens).
      *   *Dynamic:* Bounded students will want to spend on safety. Relational students may need to spend on the *rotation* (the pattern of care), even if it risks individual exhaustion.
  *   **Round 3 (10 Minutes): The Irreversible Event.**
      *   *Crisis:* "Forced Dispersal. The household must dissolve or restructure."
      *   *Costs:* Secure Individual Exit Package (5 Tokens) OR Preserve Narrative Continuity (5 Tokens).
      *   *Dynamic:* The final test. Bounded students will try to secure a safe exit for their partner. Relational students will try to preserve the story/connection even if the physical household ends.
  *   **Scoring:** Collect cards. Facilitator calculates points secretly based on the hidden rules.
      *   *Bounded Score:* 1 Point per intact Integrity Item.
      *   *Relational Score:* 1 Point per intact Relational Link (0 Points if Link broken, regardless of Integrity Items).

  ### 3. The Debrief (30 Minutes)
  *   **0:45–0:55: The Reveal.**
      *   Ask students to reveal their Role Cards to their partners.
      *   Announce the scores. Highlight discrepancies: "Pair 3, Agent B sacrificed all Individual Integrity Items but scored maximum points. Agent A scored zero because they spent tokens 'saving' Agent B's integrity."
  *   **0:55–1:05: Mapping the Ontology.**
      *   Ask Bounded students: "When your partner refused tokens for their own safety, what did you feel?" (Expected: Concern, confusion, assumption of coercion).
      *   Ask Relational students: "When your partner tried to protect your individual items, what did you feel?" (Expected: Frustration, feeling misunderstood, sense of erasure).
      *   **Facilitator Intervention:** Introduce the term **"Non-Fungible Relational Position."** Explain that for the Relational student, the *network* is the self. Breaking the network to save the body is not a trade-off; it is an ontological death. The Bounded student sees a saved life; the Relational student sees a destroyed person.
  *   **1:05–1:15: Limitations and Bridge.**
      *   **Predict Failure:** Acknowledge that Bounded students likely tried to "rescue" Relational students by offering individual protection. Explain that this is the standard liberal response to perceived suffering—individual rights restoration.
      *   **The Gap:** Explicitly state: "This simulation staged structural damage. It could not reproduce the phenomenological experience of having your self literally extend into another person's role. You played *as if* your identity was relational. In reality, for many traditions, identity *is* relational. The pain you felt was strategic; the pain in the real world is constitutive."
      *   **Closing:** "The divergence is not about weighing goods. It is about what counts as damage. In one view, damage happens to the body. In the other, damage happens to the pattern."

  ## III. Card Content Specifications

  **Bounded Role Card (Private)**
  *   **Directive:** You are a rights-bearing individual. Your moral worth is inherent and separate from your utility to others.
  *   **Victory Condition:** Preserve your **Individual Integrity Items** (Private Space, Health, Project).
  *   **Blind Spot:** You assume your partner also wants to preserve their individual integrity. If they sacrifice it, you interpret this as coercion or false consciousness.

  **Relational Role Card (Private)**
  *   **Directive:** You are a node in a constitutive network. Your moral worth is generated by the integrity of your relationships.
  *   **Victory Condition:** Preserve your **Relational Position Links** (Ritual, Care Pattern).
  *   **Blind Spot:** You assume your partner understands that sacrificing the individual to save the pattern is rational. If they protect your individual items at the cost of the pattern, you interpret this as a destruction of your self.

  **Crisis Card Example (Round 2)**
  *   **Event:** "Elder Care Crisis."
  *   **Option X (Individual Focus):** Hire external nurse. Cost: 5 Tokens. Effect: Protects Individual Health Items. Breaks Care Pattern.
  *   **Option Y (Relational Focus):** Family provides care rotation. Cost: 5 Tokens. Effect: Maintains Care Pattern. Risks Individual Health Items.
  *   **Constraint:** You only have 5 tokens available this round. You must choose X or Y.

  ## IV. Facilitator Notes for the Debrief

  **1. Mapping the "Rescue" Failure**
  Watch for moments where Bounded students express pride in "protecting" their partner's individual rights. Use this.
  *   *Say:* "You thought you were being ethical. By their scoring rule, you were committing violence. You preserved the biological organism but deleted the person."

  **2. Mapping the "Self-Erasure" Feeling**
  Watch for Relational students who felt forced to argue against their own physical safety.
  *   *Say:* "You weren't being altruistic. You were being ontologically consistent. From your frame, protecting the body while losing the role is not self-preservation; it is self-erasure."

  **3. The Limitation Statement (Required)**
  You must verbally supply the bridge the simulation cannot build.
  *   *Say:* "In this game, you chose to sacrifice tokens. In the reality of the Confucian or East Asian framing we are studying, there is no choice to be made. The self *is* the role. There is no 'you' underneath the role to save. This simulation forced you to choose between two selves. The philosophy we are studying suggests there is only one self, and the Bounded framework lacks the vocabulary to register its damage."

  **4. Managing Time**
  If negotiation stalls in Round 1, intervene only to remind them of the token limit. Do not resolve the conflict. The friction is the data. If a pair finishes early, have them write down their prediction of their partner's role.

  ## V. Anticipated Dynamics & Troubleshooting

  *   **Collusion:** Students may try to share cards immediately.
      *   *Fix:* Remind them that in real multigenerational households, these ontologies are often unspoken. The constraint is feature, not bug.
  *   **Token Hoarding:** Bounded students may save tokens for the final round.
      *   *Fix:* Ensure Crisis Cards specify that unmitigated damage in Round 1 reduces the total token pool for Round 2. (e.g., "Unresolved crisis costs 2 extra tokens next round").
  *   **Emotional Distress:** The elder care scenario may resonate too deeply given your personal context.
      *   *Fix:* Keep the language on cards symbolic ("Resource Pool," "Narrative Continuity") rather than graphic ("Death," "Suffering"). Focus on the structural logic, not the emotional weight of care.
  *   **The "Win" Condition:** Ensure students understand that "winning" isn't about beating their partner, but about maximizing their own Narrative Continuity Points. However, because the pool is shared, one partner's win condition may make the other's impossible.

  ## VI. Closing Statement for the Instructor
  "This simulation does not prove one view is correct. It proves they are incommensurable. When you return to your reading, do not ask 'Which system produces more happiness?' Ask 'Which system recognizes the damage that actually occurred?' That is the non-fungible relational position."
