answer: |-
  The ink on Amendment 88 was still wet when Minister Kael leaned over Elara's desk. He smelled of stale tobacco and victory.

  "Print it, Elara," he said. "Put it in the Statute Book for this session. Effective immediately."

  Elara didn't look up. She was checking the marginalia on the scroll. "Article 61(b), Minister. You know the text."

  "We deleted 61(b)," Kael said. He tapped the parchment with a thick finger. "Right there. Section one. Deleted. Gone. You can't be bound by a rule that doesn't exist."

  "It exists until twenty-five years after the vote," Elara said. "That's what 61(b) says. And 61(c) says we can't remove 61(b) with respect to itself. You're trying to use the hammer to break the handle while you're still holding it."

  Kael straightened up, pacing the small office. The Republic of Marenya was old, and the Hall of Records smelled like dry rot and parchment glue. Outside, the capital buzzed with the news. The Reformist Party had finally broken the deadlock. They had the two-thirds vote. They had the will.

  "This is procedure, Elara. Not philosophy. The Assembly voted. The vote is clean. No procedural screwups. You certify the vote, you print the book."

  "If I print it now, I certify that 61(b) was void the moment you voted," Elara said. She capped her pen. "But if 61(b) was void the moment you voted, then you didn't follow 61(b) to void it. So the vote is invalid. So 61(b) is still in force. So you have to wait twenty-five years."

  Kael laughed, a short, sharp bark. "So you're saying the law says we have to wait twenty-five years to pass a law that says we don't have to wait?"

  "I'm saying Article 61 is a snake eating its own tail. And you're asking me to say the snake is full."

  "It's been a century since the Founding," Kael said. "Nobody waits twenty-five years. We vote, we ratify twenty-five years later, we move on. It's a formality."

  "It's a fiction," Elara corrected. "And everyone knows it."

  That was the other wrinkle. The Grand Assembly was small. Marenyan politicians lived long lives, fortified by good healthcare and better pensions. The "next generation" required to ratify amendments to Article 61 was mostly the same men and women sitting in the chairs today. They were just twenty-five years older. They voted now, they would vote again in 2049, and they would be the same hands raising the same cards. The delay was a ghost, but it was a ghost written in the Charter.

  "The Court," Kael said. "Justice Venn called you?"

  "He left a memo." Elara opened a drawer and pulled out a single sheet of paper. "He says the High Court cannot issue a binding ruling on the validity of Amendment 88."

  "Why not?"

  "Because the Court's jurisdiction comes from Article 50," Elara said. "Amendment 88 amended Article 50. It expanded the Court's reach. If Amendment 88 is void because of 61(c), then the change to Article 50 is void. If the change to Article 50 is void, the Court doesn't have jurisdiction to rule on Amendment 88."

  Kael stared at her. "So the Court can't tell us if the law is law."

  "The Court says the burden falls on the Clerk of the Assembly to certify the text for publication." Elara tapped the memo. "Venn wrote: 'The Executive and Legislative branches must reconcile the text before it enters the judicial record.' He's washing his hands of it."

  "Then reconcile it," Kael said. "Print it."

  "If I print it, I make it law."

  "If you don't, you veto the Assembly."

  "I'm a clerk, Kael. I don't veto. I record."

  Elara stood up and walked to the safe in the corner. It was an old iron thing, bolted to the floor. She spun the dial. Inside, wrapped in oilcloth, was the Founder's Box. She hadn't opened it in ten years, not since the last time someone tried to tweak the amendment process.

  She brought the box to the desk. Kael watched, impatient.

  "What are you doing?"

  "Checking the intent." Elara lifted the lid. Inside lay a single sheet of vellum, brittle as a dried leaf. It was a note from the primary drafter of the Charter, dated the week before the signing.

  She read it aloud, her voice flat. "'Article 61 is the engine of the state. It must be durable. Subsection (c) ensures the delay cannot be bypassed. Subsection (a) ensures the people are never trapped.'"

  Kael leaned in. "So we can amend it."

  "Read the last line," Elara said. "'We intend for 61(c) to be permanent, such that the delay is inviolate, while 61(a) remains open.'"

  Kael squinted. "Permanent but open?"

  "They didn't notice," Elara said. She put the vellum down. "They wrote a rule that says 'You can change anything' and 'You can't change this thing' in the same breath. They thought (c) made it permanent and (a) made it amendable. They didn't see that (a) includes (c)."

  "So the founders were idiots," Kael said. "Doesn't change the vote. Two-thirds majority. Clean."

  "It changes the certification," Elara said. "If I print this now, I am asserting that the founders were wrong about (c). I am asserting that (a) overrides (c). But if (c) is valid, then (a) doesn't override it. If I print it, I am effectively amending the Charter without following the Charter."

  "Then don't print it."

  "Then I am enforcing (c) over (a). I am amending the Charter by refusing to process an amendment."

  Kael slammed his hand on the desk. The inkwell jumped. "You're hiding behind the paradox. People want this delay gone. It's obsolete. The 'next generation' vote is a joke. We all know it. We're just waiting for the calendar to turn so we can pretend we respected the dead."

  "The dead wrote the rule," Elara said.

  "The dead are gone. We're here." Kael pointed at the scroll. "Print it. Date it today. Effective immediately."

  "And if the Court challenges it in ten years?"

  "By then it'll be done. You can't un-ring a bell."

  Elara looked at the scroll. Amendment 88. *Article 61, Subsection (b) is hereby repealed.*

  If she dated it today, the repeal was instant. The twenty-five-year wait vanished. The next amendment could pass tomorrow. The system bootstraped itself.

  If she dated it twenty-five years from now, the repeal was valid, but useless for a quarter-century. Kael's career would be over before the ink dried.

  If she refused to date it, the amendment died. The Charter remained locked.

  She looked at the Founder's Note again. *Permanent... Open.* They wanted both. They wanted a door that was locked but could be opened. They didn't understand that a lock implies you cannot open it without a key, and a key implies the lock is not permanent.

  "Venn's memo," Kael said. "He said the Court gets its jurisdiction from the article amended by the dispute."

  "Yes."

  "So if you print it, the Court has jurisdiction to review it later. If you don't, they don't."

  "Basically."

  Kael smoothed his tie. "If you don't print it, the Assembly will vote to remove you. They can do that. That's not in the Charter. That's just employment."

  Elara looked at him. "Threats?"

  "Reality. You're one woman with a stamp. We are the Grand Assembly."

  Elara sat down. She picked up the stamp. It was heavy, brass and wood. *CERTIFIED TRUE COPY.*

  She looked at the date field on the certification line.

  If she left it blank, it was incomplete. If she wrote today's date, it was a lie according to 61(b). If she wrote the future date, it was a lie according to Amendment 88.

  The paradox wasn't in the law. It was in the act of recording it. The law was just words. The record was the reality.

  "Kael," she said. "Go wait in the hall."

  "Elara—"

  "Go. I need to certify."

  He hesitated, then turned and walked out. He closed the door softly.

  Elara was alone. The clock on the wall ticked. It was a mechanical thing, loud in the silence.

  She pulled the Statute Book toward her. It was a massive ledger, bound in blue leather. The pages were thick, designed to last centuries. She turned to the current session.

  She picked up the pen.

  She thought about the "next generation." In twenty-five years, Kael would be dead. She would be dead. But the Clerk's office remained. The book remained. If she printed it now, future clerks would see a contradiction in the record. They would see a law that claimed to erase its own history.

  If she waited, she preserved the contradiction for another generation.

  The Founder's Note said they wanted permanence. They wanted change. They wanted a system that could pull itself up by its own bootstraps.

  Elara dipped the pen.

  She wrote the date. She wrote today's date.

  She didn't write it because she believed it was legal. She wrote it because the alternative was stagnation. The Court couldn't rule. The founders were confused. The Assembly was impatient. The only thing that mattered was the next step.

  If the law was void, let the Court say so later. But the Court couldn't say so, because their power came from this void law. It was a loop. A closed circle.

  Someone had to break the circle by drawing a line.

  She pressed the stamp down. *THUMP.*

  She blew on the ink. She opened the door.

  Kael was waiting outside, leaning against the wall. He looked at her face, then at the book on her desk.

  "Done?" he asked.

  "Certified," Elara said.

  "Effective date?"

  "Today."

  Kael let out a breath he seemed to have been holding for months. He nodded. "Good. I'll tell the press."

  "Kael."

  He stopped.

  "When the twenty-five years are up," Elara said. "When the 'next generation' sits to ratify this... remember who will be in the room."

  "We'll cross that bridge."

  "There is no bridge. There's just the same people waiting in the same room."

  Kael shrugged. "Then we'll vote again. And we'll win again."

  He walked away, his footsteps echoing down the hall.

  Elara turned back to the desk. She picked up the Founder's Note and placed it back in the box. She locked the safe.

  She took the Statute Book and walked to the shelf. She slid it into place between Volume 104 and Volume 106. There was no Volume 105 yet. Now there was.

  The spine settled into the gap. The dust motes danced in the light from the window. The law was in the book. The book was on the shelf. The paradox was bound in leather.

  She sat down and opened the logbook for her own records. She dipped the pen.

  *Amendment 88. Certified. Date: Current. Note: Conflict with Article 61(b) and (c) unresolved.*

  She closed the logbook. She turned off the lamp. The room went dark, but the book on the shelf remained, waiting for someone to open it and read the line that changed everything, and nothing.
