  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to dismiss MFT entirely. It's controversial in psychology but the user asked about the *summary* of the literature. I should note that MFT is the specific framework being used.
      *   *Correction:* The colleague mentioned "Fairness" as variable. In MFT, Fairness is an "individualizing" foundation (like Harm), usually strong in WEIRD. The colleague said Fairness varies like Purity. This is a potential empirical error in the colleague's summary. I need to check this. *Check:* MFT divides into Individualizing (Harm, Fairness) and Binding (Loyalty, Authority, Sanctity). WEIRD prioritize Individualizing. So Fairness should be high in WEIRD, lower in non-WEIRD relative to Binding, but still higher than Binding in WEIRD. The colleague said Fairness varies *too widely* to claim universal truth. This is slightly off. Fairness is usually grouped with Harm as more universal than Sanctity. I should point this out.
      *   *Refinement on "Calibration":* Use the physicist's language. A thermometer measures temperature (objective property). If cultures have different "zero points," are they measuring the same thing? If the "thing" is moral truth, does it exist independently?
      *   *Refinement on Objectivity:* Distinguish between *ontological* objectivity (moral facts exist) and *psychological* universality (everyone agrees). The colleague conflates these.

  5.  **Final Polish:** Ensure the distinction between *descriptive psychology* and *metaethics* is sharp. Address the "Is-Ought" claim specifically.

      *(Self-Correction on the Fairness point)*: Wait, the colleague said: "Western... weight individual harm and impartial procedural fairness far more heavily... whereas many non-WEIRD populations distribute moral weight more evenly." Then he concluded Fairness varies too widely for universal truth.
      *Critique:* Actually, in MFT, Fairness is often treated as more universal than Sanctity, but the *conception* of fairness (equality vs. proportionality) varies. The colleague's claim that Fairness is in the "relative" bucket while Harm is in the "objective" bucket is a specific philosophical carve-out that isn't strictly demanded by the data. I need to highlight this arbitrary partition.

  6.  **Finalizing the Argument Structure:**
