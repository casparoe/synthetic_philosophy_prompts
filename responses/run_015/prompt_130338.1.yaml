      *   *Maya's Claim:* If the *trigger* is suffering, isn't that a direct consideration?
      *   *Scholarly Consensus:* This is a standard objection (e.g., Korsgaard, Wood). However, strictly speaking, Kant *denies* it collapses. He maintains the *ground* of the duty is humanity, even if the *object* is the animal.
      *   *Rating:* Philosophically interesting but textually debatable. It's a "reinterpretation" rather than a description of Kant's explicit view. Let's call it "Contested/Plausible Reconstruction" but not "Clearly Right" as an exegesis of Kant.
      *   *Settled vs. Contested:* Settled that Kant *says* it's indirect. Contested whether that position is coherent or sustainable (philosophical viability vs. textual accuracy).

  4.  **Evaluate Move 2 (Leo: Rational Nature = Unconditional Worth, Animals = Instruments):**
      *   *Kant's Text:* *Groundwork*, *Categorical Imperative*. Humanity (rational nature) is an end in itself. Animals lack autonomy/reason.
      *   *Leo's Claim:* Animals are *literally just instruments*.
      *   *Nuance:* Kant does say we can use animals, but *not* cruelly. Calling them "just instruments" might imply we can torture them, which Kant denies. But metaphysically, they are things (Sachen), not persons (Personen).
      *   *Rating:* Textually strong on the metaphysics (binary status), but slightly hyperbolic on "just instruments" if that implies no constraints on use.
      *   *Settled vs. Contested:* Settled that Kant denies animals moral status *in themselves*. Contested whether "instrument" captures the nuance of "object of indirect duty."

  5.  **Evaluate Move 3 (Maya: Proto-rational awareness/Middle Zone):**
      *   *Kant's Text:* Kant acknowledges animals have consciousness, feeling, and memory (*Anthropology*, *Lectures*). He denies they have *self-consciousness* or *autonomy* (the ability to set ends according to reason).
      *   *Maya's Claim:* Anticipating pain = middle zone. Kant doesn't close this off.
      *   *Scholarly Consensus:* Kant is pretty clear on the binary: Autonomy vs. Heteronomy. Feeling pain doesn't grant moral standing in Kant's framework. However, modern Kantians (Korsgaard) try to bridge this.
      *   *Rating:* Textually weak (Kant is quite binary on reason), but philosophically fertile for *neo*-Kantians.
      *   *Settled vs. Contested:* Settled that Kant requires *rational autonomy* for direct duty. Contested whether empirical findings about animal cognition force a revision of Kant (revisionism vs. exegesis).

  6.  **Evaluate Move 4 (Leo: Binary Distinction, No In-Between):**
      *   *Kant's Text:* *Metaphysics of Morals*. "Persons" vs. "Things."
      *   *Leo's Claim:* No in-between category in major ethical writings.
      *   *Scholarly Consensus:* This is textually accurate. Kant's ontology of morals is stark.
      *   *Rating:* Textually "Clearly Right."
      *   *Settled vs. Contested:* Settled exegesis. Contested whether this binary is *acceptable* to modern ethicists.

  7.  **Synthesize and Structure:**
      *   **Introduction:** Acknowledge the classic nature of the debate.
