  *   **Bulk Spacetime Geometry:** **No Commitment.** She will treat the bulk geometry analogously to the luminiferous ether or the individual points of the GR manifold. Since the geometry is dynamical in Formulation G but emergent/fixed in Formulation B, and because the "smoothness" of the bulk only materializes in a specific limit of B, she will view the bulk geometry as representation-dependent surplus structure. It lacks the requisite invariance across the dual descriptions.
  *   **Local Bulk Scalar Field:** **No Commitment.** She will treat this analogously to the electric and magnetic three-vectors. Since the field is local in G but corresponds to a nonlocal composite in B, its "locality" is not a duality-invariant property. She will likely view the local field as a convenient coordinate-dependent description rather than a fundamental ontological item.
  *   **Boundary Ontology (Operators, States, Background):** **Qualified Commitment.** She will likely commit to the **algebra of boundary operators and the correlation functions** they generate, viewing these as the duality-invariant "structural core" (analogous to the Maxwell equations or the Minkowski interval). However, she may withhold commitment from the **fixed background geometry** of the boundary theory if it is not itself derivable from a deeper invariant structure, though she is more likely to accept it than the bulk geometry because it serves as the definitional base for the invariant correlations. Her verdict will likely be: "Commit to the invariant relational structure defined by the boundary algebra; regard the specific geometric guise of the boundary as a representational fixture, not a fundamental entity."

  ### 2. Analysis of Underlying Principles

