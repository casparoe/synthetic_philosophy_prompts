      *   Ensure the "Consistency Rule" is formalized as the "Phylogenetic Neutrality Check."
      *   Ensure the "Values" section clearly demarcates where the committee must vote based on ethics, not evidence.
      *   Make sure the Zebrafish case addresses the specific developmental stage issue.

  10. **Final Output Structure:**
      *   Validation of user's insights.
