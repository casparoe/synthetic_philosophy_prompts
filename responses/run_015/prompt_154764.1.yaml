  *(Self-Correction on the Fly Case)*: The user expects the procedure might say the flies are the bigger problem. Why? Because 50,000 x uncertain pain could outweigh 1 x certain pain *if* the benefit is low. I need to make sure the procedure captures the *scale* of the fly experiment properly.

  *(Self-Correction on Zebrafish)*: 5 dpf is a legal cutoff in many places (EU Directive 2010/63). I need to mention that legal compliance $\neq$ ethical clearance.

