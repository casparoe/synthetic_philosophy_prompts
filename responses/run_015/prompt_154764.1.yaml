answer: |-
  You have not garbled it. You have intuitively grasped the three hardest problems in animal ethics: the distinction between nociception (reflex) and suffering (experience), the aggregation problem (numbers vs. certainty), and the is/ought gap (facts vs. values). Most academics spend years trying to explain what you just wrote in the first paragraph.

  You are right to be wary of the "multiply credence × number" arithmetic. It feels wrong because it treats a 1% chance of torture as equivalent to a 100% chance of a mild itch if the numbers balance out. That is a known failure mode of pure utilitarianism.

  Below is a procedure designed for your constraints: 20 minutes per protocol, no specialist knowledge, defensible decisions. It is not a moral theory; it is a risk-assessment tool.

  ### The "Tuesday Afternoon" Procedure (TAP)

  **Goal:** Assign a **Scrutiny Level** (Fast-Track, Standard, Enhanced) and a **Severity Band** (Sub-threshold, Mild, Moderate, Severe).
  **Rule:** If the procedure flags a "Red Light," the protocol cannot be Fast-Tracked, regardless of scientific urgency.

  #### Step 1: The Phylogenetic Neutrality Check (The Consistency Rule)
  *Time limit: 3 minutes*

  Your "pig vs. crab" rule is sound. It is not circular; it is a control for bias. It forces the committee to separate *taxonomic prejudice* from *evidential assessment*.

  **Ask:** "If a mammal exhibited this exact behavioral/physiological response to this stimulus, would we classify it as pain/stress?"
  *   **Yes:** Proceed to Step 2. Presume sentience risk is **High**.
  *   **No:** Proceed to Step 2. Presume sentience risk is **Low**.
  *   **Unsure:** Proceed to Step 2. Presume sentience risk is **Medium** (Precautionary Principle).

  *Note:* You must document the answer. If you say "Yes" for a pig but "No" for a crab showing the same behavior, the minutes must record *why* (e.g., "Crab has a different nervous system structure"). If the only reason is "It's an invertebrate," you must escalate to **Enhanced Scrutiny**.

  #### Step 2: The Uncertainty Matrix (Handling Thin Evidence)
  *Time limit: 5 minutes*

  Do not try to calculate percentages. Use a 3x3 Risk Matrix.

  **Axis A: Biological Plausibility (Can they feel?)**
  *   **High:** Vertebrates, Cephalopods, Decapods (evidence of central integration).
  *   **Medium:** Insects, other invertebrates (evidence of nociception + modulation, but unclear affect).
  *   **Low:** Early larval stages, simple organisms (reflex only).

  **Axis B: Procedural Intrusiveness (What are we doing to them?)**
  *   **High:** Surgery, confinement, extreme temps, death as endpoint.
  *   **Medium:** Restraint, minor procedures, environmental change.
  *   **Low:** Observation only, non-invasive.

  **The Rule:**
  *   **High/High** = **Severe** (Automatic Enhanced Scrutiny).
  *   **Low/Low** = **Sub-threshold/Mild** (Fast-Track eligible).
  *   **Medium/Medium** OR **High Uncertainty** = **Moderate** (Standard Scrutiny).

  *Crucial Mechanism:* If Biological Plausibility is **Medium/Uncertain**, you must slide the Procedural Intrusiveness rating **up one band**.
  *Why?* This bakes the Precautionary Principle into the math without needing philosophy. If we aren't sure if the fly feels, we treat the heat stimulus as worse than it would be for a mouse.

  #### Step 3: The Aggregation Cap (The Numbers Problem)
  *Time limit: 5 minutes*

  This addresses your worry about 50,000 flies vs. 1 monkey. We do not multiply. We use a **Cumulative Burden Trigger**.

  **Ask:** "Does the total number of animals push the *total* welfare burden beyond the threshold of the higher severity band?"

  *   **Rule:** If $N > 1,000$ and Severity is rated "Mild" (due to uncertainty), the **Overall Protocol Severity** bumps to **Moderate**.
  *   **Rule:** If $N > 10,000$ and Severity is rated "Moderate", the **Overall Protocol Severity** bumps to **Severe**.

  *Why this works:* It acknowledges that 10,000 mild sufferings is a big ethical deal, without requiring you to prove a fly feels exactly 1/100th of a monkey. It forces the committee to stop and look at the *scale* of the killing/suffering.

  #### Step 4: The Value Stop (Facts vs. Decisions)
  *Time limit: 5 minutes*

  This is where you admit the procedure ends.

  **Ask:** "Even if we accept the severity rating, is the harm *proportionate* to the benefit?"
  *   **Fact Check:** Is the science robust? (Scientists answer).
  *   **Value Check:** Is this level of suffering *necessary*? (Committee answers).

  **The "Lay Veto" Point:** If the Lay Member (you) feels the justification relies on "we've always done it this way" rather than "we need this specific data," you trigger a **Deferral**. The protocol goes back for refinement. This is not a scientific judgment; it is a welfare governance judgment.

  ---

  ### Running the Test Cases

  Here is how TAP handles your three cases. I have applied the rules strictly.

  #### Case 1: 50,000 Fruit Fly Larvae (Heat Avoidance, Killed)
  *   **Step 1 (Neutrality):** Larvae withdraw from heat. If a mouse pup did this, we'd call it pain. **Verdict: Yes.** (Risk: High).
  *   **Step 2 (Uncertainty):**
      *   Biology: Insect larvae. Evidence is thin. **Rating: Medium.**
      *   Intrusiveness: Heat stress + Death. **Rating: High.**
      *   *Adjustment:* Because Biology is Medium/Uncertain, bump Intrusiveness. It stays High.
      *   *Base Severity:* **Moderate/Severe boundary.**
  *   **Step 3 (Aggregation):** $N = 50,000$.
      *   Rule: $N > 10,000$ with Moderate/Severe risk bumps Overall Severity to **Severe**.
  *   **Step 4 (Value):**
      *   **Outcome:** **Enhanced Scrutiny.**
      *   **Why:** You cannot Fast-Track this. The committee must explicitly discuss: "Is killing 50,000 potentially sentient things worth this specific dataset?"
      *   **The Uncomfortable Result:** You suspected this might come out looking *worse* than the monkey. In terms of *process*, it does. It demands the highest level of justification. It forces the scientists to prove they can't use fewer flies or a computer model.

  #### Case 2: 1 Rhesus Macaque (Brain Recording, Severe)
  *   **Step 1 (Neutrality):** Primate. **Verdict: Yes.** (Risk: High).
  *   **Step 2 (Uncertainty):**
      *   Biology: Mammal/Primate. **Rating: High.**
      *   Intrusiveness: Surgery, long-term recording, severe protocol. **Rating: High.**
      *   *Base Severity:* **Severe.**
  *   **Step 3 (Aggregation):** $N = 1$. No bump.
  *   **Step 4 (Value):**
      *   **Outcome:** **Enhanced Scrutiny.**
      *   **Why:** It hits the "Severe" ceiling immediately.
      *   **The Comparison:** Notice that *both* the Flies and the Monkey hit "Enhanced Scrutiny." This is correct. The *reason* differs. For the monkey, it's the intensity of individual suffering. For the flies, it's the cumulative risk of mass suffering.
      *   **Decision Point:** The committee must vote on whether the benefit justifies *Severe* harm. This is the "Value Stop." You cannot use evidence to solve this. You have to vote.

  #### Case 3: 5 dpf Zebrafish (Drug Screen)
  *   **Step 1 (Neutrality):** Vertebrate. **Verdict: Yes.** (Risk: High).
  *   **Step 2 (Uncertainty):**
      *   Biology: 5 days post-fertilization. This is the legal cutoff in many jurisdictions (EU/UK) for protection. Neuroanatomy is developing but not complete. **Rating: Medium/High.**
      *   Intrusiveness: Drug screen (chemical exposure). **Rating: Medium.**
      *   *Adjustment:* Because Biology is not "Confirmed Adult," treat Intrusiveness as **High** (Precautionary).
      *   *Base Severity:* **Moderate.**
  *   **Step 3 (Aggregation):** Depends on N. If $N=500$, no bump. If $N=5,000$, bumps to **Severe**.
  *   **Step 4 (Value):**
      *   **Outcome:** **Standard or Enhanced** (depending on N).
      *   **The Trap:** Scientists will say "They are legally exempt."
      *   **Your Move:** The procedure says legal exemption $\neq$ ethical exemption. Step 2 forces you to rate the *welfare risk*, not the *legal status*. If the drugs cause distress, it is Moderate/Severe regardless of the law.

  ---

  ### Philosophy: What Survives and What Dies

  To make this work in 20 minutes, we had to cut some philosophical corners. Here is what you are trading away:

  **1. What Survives (Keep these in your head)**
  *   **The Precautionary Principle:** Uncertainty counts against the experimenter, not the animal. (Embedded in Step 2).
  *   **Phylogenetic Neutrality:** Behavior counts more than taxonomy. (Embedded in Step 1).
  *   **The Is/Ought Gap:** Distinguishing "Can they feel?" from "Does it matter?" (Embedded in Step 4).

  **2. What We Dropped (And the cost)**
  *   **Precise Sentience Probabilities:** We dropped the "10% vs 95%" math.
      *   *Cost:* We lose granularity.
      *   *Gain:* We avoid false precision. You can't know the probability is 10%. Assigning a number makes you feel confident when you are guessing. Bands are more honest.
  *   **Rights vs. Utilitarianism:** The procedure doesn't decide if animals have *rights* not to be used.
      *   *Cost:* It assumes use is permissible if justified.
      *   *Gain:* It fits the legal framework you work within. You are an ethics *committee*, not an abolitionist *tribunal*.
  *   **Individual vs. Collective:** We used a crude "Aggregation Cap."
      *   *Cost:* It doesn't solve the philosophical puzzle of whether 1 death equals 1,000 mild pains.
      *   *Gain:* It prevents the "it's just a fly" dismissal when numbers are huge.

  **3. Where This Procedure Will Misfire**
  *   **Chronic vs. Acute:** The procedure handles acute severity well. It is weaker on long-term, low-grade stress (e.g., housing conditions over 2 years). *Fix:* Add a specific "Housing/Duration" check in Step 2.
  *   **The "Benefit" Black Box:** Step 4 relies on scientists telling the truth about benefit. If they exaggerate the medical potential, the procedure validates it. *Fix:* As the Lay Member, your job in Step 4 is to ask: "If this fails, what do we lose?" If the answer is "One paper," the benefit is low.
  *   **Habituation:** The procedure assumes the stimulus is the same on Day 1 and Day 100. It isn't. Animals may suffer more from anticipation. *Fix:* Ask specifically about "Procedure Frequency" in Step 2.

  ### How to Use This on Tuesday

  1.  **Print the 4 Steps.** Put them in front of the Chair.
  2.  **Introduce it as "Risk Management."** Don't call it "Philosophy." Call it "Standardizing our Severity Assessment." Scientists respect risk matrices; they tune out "ethics."
  3.  **Own Step 1.** As the Lay Member, you are the best person to lead the Phylogenetic Neutrality Check. You are the least likely to say "It's just a fish, they don't count."
  4.  **Use the "Deferral."** If the math in Step 3 bumps a protocol to Severe, but the form says Mild, do not argue philosophy. Say: "The procedure flags this as Severe due to numbers. We need to record that discussion before we sign off."

  **Final thought on your intuition:**
  You suspected the procedure might make the flies look worse than the monkey. In a way, it does. It makes the *paperwork* for the flies as heavy as the monkey.
  This is the correct outcome.
  If you kill 50,000 things that *might* feel pain, you have taken a massive ethical gamble. That gamble deserves as much scrutiny as definitely hurting one monkey. The procedure doesn't necessarily ban the flies, but it stops you from sleepwalking through the approval.

  That is your job. Not to solve consciousness, but to ensure the committee doesn't ignore the risk.
