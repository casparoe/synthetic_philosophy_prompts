prompt: |-
  Hi. I'm the lay member on the animal welfare and ethics committee where I work — I've got no academic background in anything like this, I'm in estates management really, and I've just been reading about animal consciousness on my own in the evenings. Which probably shows. I've picked up that "can it feel pain" and "is it conscious" might be two or three different questions stacked on top of each other, and that reacting to a harmful stimulus isn't the same as minding about it — but I'm not confident I've got that right, so correct me if I've garbled it.

  The problem is practical. We meet once a month, get through eight or nine protocols in an afternoon, and for each one we have to (a) assign a severity band — roughly, nothing worth counting / mild / moderate / severe — and (b) decide how much scrutiny the thing gets: fast-track it, discuss it properly, or send it back. There's me, a vet, a couple of scientists and a chair. Nobody on the committee is a specialist in whatever species is on the table that week, and we can't go and read neuroscience papers between meetings. Whatever we decide goes on a form afterwards and has to be defensible if anyone asks us about it.

  What I want is a procedure, not a position paper. Something we can actually run on each protocol in the twenty minutes we've got: the questions in order, what counts as a good enough answer to each, where the procedure just stops with a no, and where it has to hand the decision to a person because it's a values question rather than a facts one.

  The things I need it to handle, because these are the ones we keep arguing about:

  - The evidence is nearly always thin or missing. For most of what comes to us — larval zebrafish, fruit flies, some beetle nobody has ever tested, the occasional cephlopods — we've no direct evidence either way. I need the procedure to say what to do with an absence of evidence without collapsing into "assume everything is fully conscious", because then everything is equally urgent and we can't prioritise anything at all.

  - Numbers. One macaque is not ten thousand larvae. But I dont know how to think about it: if I'm maybe 10% confident a fly larva is sentient and there are fifty thousand of them, does that beat one monkey I'm 95% sure about? I've been toying with just multiplying credence × intensity × number and ranking by that, and it seems to give answers I don't like, so I can't tell whether the arithmetic is wrong or the dislike is.

  - A consistency rule I half-invented: if you'd accept a bit of pain behaviour as enough to count a pig as sentient, you have to say what's doing the work when you reject the same kind of evidence for a crab. I like it, but I can't tell if it's circular or if it just sneaks in a bias towards things with backbones under a procedural disguise. Tell me if it's sound, and if it isn't what to use instead.

  - Where it has to stop. I think there are places where no amount of evidence settles it — whether death is a harm to an animal in the first place, or how a small amount of pain across a very large number of animals is meant to weigh against a modest scientific benefit — and I'd much rather the procedure said "this bit is a decision, not a finding" than pretend otherwise.

  Then please run it on three cases shaped like ones from our last few meetings: (1) about fifty thousand fruit fly larvae in a heat-avoidance learning assay, killed at the end; (2) a single rhesus macaque, already trained, in a long-term brain recording study under a severe protocol; (3) larval zebrafish at five days old in a drug screen, where I genuinely don't know whether they can feel anything yet. I want at least one of them to come out with an answer I won't like — my instinct is that the fly one is a paperwork exercise and the monkey is the real ethical problem, and I suspect the procedure says something closer to the opposite, or at least won't let me say that so quickly.

  Also: which bits of the philosophy have to survive into the checklist and which can we drop, what we lose by dropping them, and where a procedure like this will definately misfire. Please don't give me a reading list or tell me to go and look things up — I've no access to journals and I need something I can run on a Tuesday afternoon.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User Role:** Lay member on an Animal Welfare and Ethics Committee (AWEC). Background in estates management, not science/philosophy. Self-educated on animal consciousness.
      *   **Context:** Monthly meetings, 8-9 protocols in an afternoon (approx. 20 mins each). Committee composition: Lay member, Vet, Scientists, Chair. No species specialists. No time for deep research between meetings. Decisions must be defensible.
      *   **Core Task:** Create a *procedure* (checklist/algorithm), not a position paper. Needs to handle severity banding and scrutiny levels.
      *   **Specific Problems to Address:**
          1.  Thin/missing evidence (don't assume full consciousness for everything, but don't ignore risk).
          2.  Numbers vs. Certainty (aggregation problem: 50k flies @ 10% sentience vs. 1 monkey @ 95%).
          3.  Consistency Rule (Pain behavior in pig vs. crab).
          4.  Value Judgments vs. Facts (Where the procedure stops and human decision begins).
      *   **Test Cases:**
          1.  50k fruit fly larvae (heat avoidance, killed).
          2.  1 Rhesus macaque (severe, brain recording).
          3.  5 dpf zebrafish larvae (drug screen, sentience unknown).
      *   **Constraint:** No reading lists, needs to be usable on a Tuesday afternoon.
      *   **Expectation:** The user expects the procedure might challenge their intuitions (e.g., flies might look worse than expected, or the monkey decision might be clearer than expected).

  2.  **Deconstruct the Philosophical/Scientific Underpinnings (Simplified for Procedure):**
      *   *Sentience vs. Consciousness vs. Nociception:* The user is right. Nociception = reflex. Sentience = capacity to feel pain/suffering (affective state). Consciousness = broader awareness. For welfare, *sentience* is the key threshold.
      *   *Precautionary Principle:* How to handle uncertainty. Don't assume "no sentience" just because we lack proof. Use a "sliding scale of precaution."
      *   *Aggregation:* The "10% of 50k" math is tricky. Utilitarian calculus often clashes with deontological constraints (rights of the individual). The procedure needs to acknowledge the *risk* of mass suffering without getting bogged down in impossible math.
      *   *Consistency:* The "Pig vs. Crab" rule is essentially an argument against phylogenetic chauvinism. It's sound *if* the behavioral markers are equivalent. The procedure needs to enforce evidential consistency, not just taxonomic consistency.
      *   *Values:* Harm-benefit analysis is inherently value-laden. The procedure must flag *where* the value judgment happens so the committee owns it.

  3.  **Drafting the Procedure (The "Tuesday Afternoon Tool"):**
      *   *Goal:* A step-by-step flow that fits in 20 mins.
      *   *Structure:*
          1.  Triage (Is there a risk?)
          2.  Evidence Assessment (What do we know?)
          3.  The Precautionary Calculation (Handling uncertainty).
          4.  Severity & Numbers (The aggregation problem).
          5.  The Stop/Go Decision (Harm-Benefit).
      *   *Key Innovation:* A "Sentience Probability Score" (SPS) combined with a "Welfare Impact Score" (WIS). This avoids precise math but forces categorization.
      *   *Addressing the "Consistency Rule":* Embed it as an "Evidence Equivalence Check."
      *   *Addressing "Values":* Explicit "Committee Decision Point" markers.

  4.  **Refining the Specific Problems:**
      *   *Thin Evidence:* Use the Cambridge Declaration on Consciousness criteria (simplified). If phylogenetically close OR behaviorally complex -> Presume sentience. If neither -> Presume precautionary risk.
      *   *Numbers:* Introduce a "Total Welfare Burden" concept. High N x Low Probability can equal Low N x High Probability.
      *   *Consistency:* Make it a specific question: "If this behavior were in a mammal, would we count it?"
      *   *Values:* Distinguish between "Fact Finding" (Can they feel?) and "Weighting" (Is it worth it?).

  5.  **Developing the Test Cases:**
      *   *Case 1 (Flies):* High N, Low individual severity, Uncertain sentience. *Challenge:* The aggregate burden might be "Moderate" due to numbers, forcing more scrutiny than usual.
      *   *Case 2 (Macaque):* Low N, High individual severity, High sentience certainty. *Challenge:* The procedure should make the harm-benefit analysis very explicit. It might not be a "no," but it requires the highest scrutiny.
      *   *Case 3 (Zebrafish 5dpf):* The "Grey Zone." *Challenge:* Regulatory cutoffs often exist (e.g., 5 dpf is often the legal limit for protection in EU/UK). The procedure needs to handle the "legal vs. ethical" gap.

  6.  **Addressing the Philosophy vs. Procedure Trade-off:**
      *   *Keep:* Precautionary Principle, Consistency, Distinction between Nociception/Sentience.
      *   *Drop:* Deep metaphysics of consciousness, precise probability calculations (too hard for 20 mins).
      *   *Misfire Risks:* Bureaucratic box-ticking, false precision, ignoring cumulative stress.

  7.  **Review against Constraints:**
      *   *Tone:* Respectful, practical, acknowledging the user's lay status but validating their insight.
      *   *Format:* Clear steps, checklists, decision points.
      *   *No Reading Lists:* Keep citations minimal/internal to the logic.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Initial thought:* Suggest a mathematical formula for N x Probability.
      *   *Correction:* No, the user said they dislike the results of that. Better to use "Bands" or "Tiers." Let's use a "Risk Matrix" approach (Likelihood x Impact).
      *   *Initial thought:* Tell them to reject the fly protocol.
      *   *Correction:* No, the procedure shouldn't dictate the outcome, but dictate the *scrutiny level*. The outcome depends on the scientific benefit (which I don't know).
      *   *Crucial Point:* The user suspects the procedure might flip their intuition on the flies. I need to ensure the procedure highlights the *aggregate risk* of the flies without demanding they be treated exactly like monkeys. It's about *scrutiny*, not necessarily prohibition.

