  ### Critique of Probes and Insulation Worry

  **Ill-Designed Probes:**
  Your **pledge case** is confounded. Adding a public pledge increases the *specificity* of the reason (contractual obligation) but also drastically increases *blame* for violation. You cannot tell if the narrowing asymmetry is due to the reason becoming salient in the help case or because the help case became morally charged (breaking a promise). To fix this: Run a 2x2 (Help/Harm x Pledge/No Pledge). Measure "strength of reason to avoid" and "blameworthiness" separately on scales. If the asymmetry narrows only when "strength of reason" rises in the help case, your view holds. If it narrows only when "blame" rises, your view is threatened.

  Your **purple lights** probe is weak because "strangeness" is not a clear norm violation. A statistical deviation is not necessarily a prescriptive norm. To fix this: Use a clear non-moral prescriptive norm (e.g., "protocol requires wearing blue ties; program causes CEO to wear red"). If asymmetry appears here, (1) is supported. If not, (1) is weakened.

  Your **scale** probe ("purely accidental" vs "deliberately") likely primes the reason structure you are trying to test. By labeling endpoints this way, you invite participants to consider reasons, potentially inflating the asymmetry. A neutral scale (1-7) is safer for testing (3).

  **Insulation Verdict:**
  You are significantly insulated. The claim that "badness is just the way a norm gets made salient" allows you to retroactively fit a norm to any positive result. If a neutral case shows asymmetry, you might claim "there was a hidden statistical norm." If a help case shows intentionality, you might claim "there was a hidden reason to avoid." To reduce insulation, you must pre-register which norms count (e.g., only prescriptive, not statistical) and define "standing reason" independently of participant intuition (e.g., via explicit cost/benefit structures). Without this, the theory risks being unfalsifiable.

