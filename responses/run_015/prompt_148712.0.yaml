answer: |-
  This is an exceptionally sharp observation. You have identified a crack in the standard philosophical defense of AI belief-talk (usually grounded in Dennett) that most practitioners gloss over. You are describing a state where the *instrumental utility* of the intentional stance is decoupled from its *ontological stability*.

  To answer your first question: **No, there is no single canonical term for this exact configuration.** However, it sits precisely at the friction point between three established concepts. Understanding where they break against your case gives you the vocabulary you need.

  ### 1. The Philosophical Neighbors (and where they break)

  **A. Dennett's Intentional Stance**
  *   **The Theory:** We attribute beliefs/desires to a system if doing so allows us to predict its behavior. If the prediction works, the belief is "real enough" (a "real pattern").
  *   **Where it breaks:** Dennett assumes a constraint of **rationality and consistency**. The Intentional Stance is supposed to converge on a *best* interpretation. In your case, you have *multiple, incompatible* interpretations (believes X vs. believes not-X) that are *equally* predictive depending on arbitrary framing. If the "best" interpretation flips 180 degrees based on a prompt tweak, the "pattern" is not in the system; it is in the interaction.
  *   **Verdict:** Your case shows the Intentional Stance yielding **Underdetermined Intentionality**.

  **B. Quine's Indeterminacy of Translation**
  *   **The Theory:** There is no "fact of the matter" about what someone means if multiple translation manuals fit the observable behavior equally well.
  *   **Where it breaks:** Quine was talking about radical translation between languages. You are seeing this *within a single system* over time. More importantly, Quine assumes the subject has a stable physical constitution. Your system has no constitution other than the context window.
  *   **Verdict:** This is **Contextual Indeterminacy**. The "facts of the matter" about the system's beliefs are created by the prompt, not revealed by it.

  **C. Human Framing Effects (Psychology)**
  *   **The Theory:** Humans also change answers based on framing (e.g., loss aversion).
  *   **Where it breaks:** As you noted, you don't conclude your colleague has no beliefs. Why? Because human framing is **revelatory**; AI framing is **constitutive**.
      *   *Human:* The belief exists in a web of memory, physiology, and social accountability. Framing accesses different parts of a stable (though complex) baseline. If you ask tomorrow without the frame, they revert to a baseline.
      *   *AI:* There is no baseline. The frame *instantiates* the belief state ex nihilo. It is **Stateless Intentionality**.

  ### 2. Naming the Phenomenon

  Since there isn't a standard label, I propose you use the term **Frame-Relative Intentionality** (or **Context-Bound Attribution**).

  You can define it in your guidance as:
  > *"A state where attributing a belief (e.g., 'the system thinks X') is predictively useful within a specific conversational context, but does not reflect a stable property of the system that persists across different frames or sessions."*

  This distinguishes it from **Robust Intentionality** (human-like belief), which survives frame shifts, time delays, and contradictory prompting.

  ### 3. The "Real Grip" Test (What a non-case looks like)

  You asked what a system would have to be like for belief attributions to have "real grip." To warrant the claim "The system believes X" (rather than "The system returned X"), the system needs to pass three stability tests that your current tool fails:

  1.  **Diachronic Stability:** If you ask the same question tomorrow (new session, same weights), does it return the same answer without needing the same framing? (Your system fails this; it is stateless).
  2.  **Counterfactual Resilience:** If you challenge the belief ("But what about exception Y?"), does the system attempt to reconcile the new info with the old belief, or does it instantly discard the old belief to accommodate the new prompt? (Your system discards).
  3.  **Cross-Context Coherence:** If you ask about refunds in a "angry customer" frame and a "polite customer" frame, do the core factual beliefs remain consistent even if the tone changes? (Your system flips core facts).

  If a system fails these, it possesses **Frame-Relative Intentionality**. It simulates a believer for the duration of the context window, but it does not *hold* beliefs.

  ### 4. Draft Guidance for Your Tickets

  Based on this, here is a draft paragraph for your internal guidance. It avoids banning "thinks" entirely (since you admitted it's instrumentally useful for planning) but restricts it to prevent ontological confusion in bug reports.

  ***

  **Guidance: Describing System Behavior in Tickets**

  When documenting behavior, distinguish between the system's **output** and its **state**.

  *   **Use "The system returned/stated/generated" for factual claims.**
      *   *Why:* The system does not hold stable beliefs. A statement it makes confidently in one thread may be reversed in another based on phrasing alone. Attributing a belief (e.g., "The system thinks refunds are denied") implies a stability that doesn't exist.
      *   *Correct:* "The system returned a denial for claims over 30 days."
      *   *Incorrect:* "The system believes claims over 30 days are always denied."

  *   **Use "The system appears to be operating under the assumption that..." for local planning.**
      *   *Why:* Within a single conversation, it is often useful to treat the system *as if* it holds a belief to predict its next move. This is a **frame-relative attribution**. It is valid for the current session but should not be treated as a permanent property of the tool.
      *   *Correct:* "For this ticket, treat the system as operating under the assumption that Region A requires manager approval."
      *   *Incorrect:* "The system requires manager approval for Region A." (Unless this is a hard-coded rule).

  *   **When reporting bugs:**
      *   Do not report "The system believes X" as a bug.
      *   Do report "The system's output is inconsistent when framed as Y vs. Z."
      *   *Reasoning:* Inconsistency under reframing is the expected behavior of a stateless predictor, not necessarily a logic error.

  ***

  ### Summary for your mental model

  You are dealing with **Constitutive Framing**.
  *   **Humans:** Framing *reveals* existing, messy, but stable states.
  *   **LLMs:** Framing *constitutes* temporary, coherent, but fragile states.

  The word you were looking for is likely **Constitutive** (vs. Revelatory) or **Frame-Relative**. Using that distinction in your guidance will protect your team from debugging "beliefs" that vanish the moment the prompt changes.
