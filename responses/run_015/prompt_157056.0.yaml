  ### Design Outline

  1.  **Design Constraints:** No cloning, no teleportation, no perfect predictors, and no exotic physics.
  2.  **Biomedical Mechanism:** Sibling embryo substitution within a single in vitro fertilization (IVF) cycle.
  3.  **Philosophical Target:** Transworld identity conditions (whether identity survives changes to biological origin).
  4.  **Structure:**
      *   State constraints and mechanism.
      *   Present the one-paragraph thought experiment.
      *   Analyze the identity claim, nearby worlds, and theoretical verdicts.
      *   Isolate the structural feature, test its removal, and present the essentialist counter-argument.

  ### Design Constraints and Mechanism

  **Constraints:** No cloning, no teleportation, no perfect predictors, and no exotic physics.
  **Mechanism:** The mechanism employed is sibling embryo substitution within a single in vitro fertilization (IVF) cycle, where multiple viable zygotes are generated simultaneously from the same gamete providers.

  ### Thought Experiment

  Consider a couple undergoing IVF who produce two viable zygotes, Z1 and Z2, from the same sperm and egg batches during a single cycle. In the actual world, Z1 is implanted, develops successfully, and grows into an adult named Alice, possessing a specific set of memories, personality traits, and psychological dispositions shaped by her parents' specific upbringing style. In the nearby counterfactual world, the clinic protocols select Z2 for implantation instead, while Z1 is discarded; Z2 is gestated in the same womb, born to the same parents, and subjected to the exact same environmental niche and developmental trajectory as Alice. We stipulate for the sake of the argument that the resulting adult from Z2 possesses psychological continuity with the actual Alice—sharing her memories, character, and cognitive patterns—despite originating from a distinct fertilization event involving different specific gametes.

  ### Analysis of the Identity Claim

  **Claim Tested:** The necessity of biological origin for transworld personal identity (whether *this* person could have originated from *that* zygote).
  **Nearby Worlds:** Origin Essentialism considers the actual world (Z1 → Alice) and the counterfactual world (Z2 → Alice*) as containing two numerically distinct individuals because the material causes differ. Psychological Continuity Theory considers these worlds as containing the same individual across possibilities, provided the psychological chain remains unbroken despite the material swap.
  **Verdict Divergence:** Origin Essentialism denies identity because the specific sperm and egg constituting Z2 are not identical to those constituting Z1, making Alice* a different person (perhaps a sibling) regardless of psychology. Psychological Continuity affirms identity because the criterion for being Alice is the persistence of her specific psychological profile, which the scenario holds fixed across the origin change.

  ### Structural Feature and Essentialist Attack

  **Structural Feature:** The existence of a viable, unselected sibling zygote (Z2) available at the exact same temporal moment as the actual origin (Z1).
  **Effect of Removal:** If removed (e.g., natural conception where only one zygote exists at time *t*), the counterfactual requires changing the timing of conception or the parents themselves, which alters the environment or developmental trajectory; this collapses the divergence, forcing both theories to agree that identity is preserved because the origin remains fixed.
  **Essentialist Attack:** An origin essentialist would argue that the stipulation of psychological continuity is biologically incoherent because different gametes entail different genotypes, which necessarily produce different neural substrates; therefore, Z2 could not genuinely support Alice's psychology, and the intuition pump fails because it asks us to imagine a metaphysical impossibility (same mind, different brain code).
