answer: |-
  # Practical Decision Procedure: Residual Accountability Status

  **Purpose:** To determine eligibility for "Residual Accountability" (RA) status. This status grants freedom from criminal prosecution in exchange for full public testimony and binding civil restrictions. It is not amnesty; it is a permanent mark of moral debt.

  **Team Requirement:** Minimum of 3 decision-makers present for all steps. At least one must be a trusted community elder not directly involved in the conflict.

  ---

  ## Step 1: Safety and Eligibility Screen
  **Goal:** Ensure the applicant does not pose an immediate physical threat and fits the scope of the program.

  *   **Check A:** Is the applicant currently armed or commanding active fighters?
      *   **YES:** → **STOP.** Refer to security/disarmament protocols. RA is for past acts, not ongoing conflict.
      *   **NO:** → Proceed.
  *   **Check B:** Is the applicant accused of crimes outside our local mandate (e.g., international terrorism, crimes against humanity defined by international courts we cannot override)?
      *   **YES:** → **STOP.** You lack the authority; proceed with caution or refer.
      *   **NO:** → Proceed.
  *   **Check C:** Is there credible intelligence that granting this status will trigger immediate vigilante violence against the applicant or victims?
      *   **YES:** → **STOP.** Safety overrides truth-seeking.
      *   **NO:** → Proceed to Step 2.

  ## Step 2: Truth Threshold Verification
  **Goal:** Assess if the testimony meets the "full disclosure" requirement necessary to justify waiving prosecution.

  *   **Action:** Compare applicant's testimony against existing evidence (victim statements, forensic data, other confessions).
  *   **Check A:** Does the testimony provide new, verifiable factual information (e.g., burial sites, weapon caches, chain of command)?
      *   **NO:** → **STOP.** No public benefit gained; prosecution remains the default.
      *   **YES:** → Proceed.
  *   **Check B:** Are there obvious gaps where the applicant claims ignorance but evidence suggests knowledge (e.g., naming subordinates but not commanders)?
      *   **NO:** → Proceed to Step 3.
      *   **YES:** → **VALUES CALL REQUIRED.**
          *   *Question:* Is the information provided (e.g., burial sites) valuable enough to excuse the missing information (e.g., commanders)?
          *   *Decision:* The team must vote. If 2/3 agree the provided truth outweighs the withheld truth, proceed. If not, **STOP.**

  ## Step 3: Community and Victim Consultation
  **Goal:** Gauge the social impact of granting RA status. This draws on *Gacaca* logic (community judgment) but limits veto power to prevent endless vengeance.

  *   **Action:** Present the *facts* of the testimony (not the decision) to a representative council of victims and community leaders.
  *   **Check A:** Do the victims confirm the testimony matches their experience?
      *   **NO:** → Return to Step 2 (Truth is suspect).
      *   **YES:** → Proceed.
  *   **Check B:** What is the level of opposition to granting RA status?
      *   **Low/Mixed:** → Proceed to Step 4.
      *   **High/Unified Opposition:** → **VALUES CALL REQUIRED.**
          *   *Question:* Does the community have veto power over the process?
          *   *Option 1 (Truth Priority):* Grant RA anyway. Truth is a national/local good that overrides individual desire for punishment.
          *   *Option 2 (Consensus Priority):* Deny RA. Social cohesion is more important than this specific truth.
          *   *Decision:* You must have pre-agreed on which option rules. If undecided, **STOP** until leadership settles this policy.

  ## Step 4: Designing the Restrictions
  **Goal:** Define the "Residual" part of Accountability. The restrictions must be visible, ongoing, and proportional.

  *   **Action:** Draft the Civil Restrictions Order.
  *   **Requirement 1:** Must include public acknowledgment (e.g., testimony published, apology made).
  *   **Requirement 2:** Must include material repair (e.g., labor, financial contribution).
  *   **Requirement 3:** Must include civic exclusion (e.g., ban from holding public office for X years).
  *   **VALUES CALL REQUIRED:**
      *   *Question:* Is the restriction punitive or rehabilitative?
      *   *Risk:* If too light, it looks like impunity. If too heavy, it looks like a secret prison.
      *   *Decision:* The team must agree that the restrictions are "burdensome but livable."

  ## Step 5: Final Agreement and Monitoring
  **Goal:** Formalize the status and set up enforcement.

  *   **Action:** Sign the RA Contract.
  *   **Condition:** Applicant agrees that violating any restriction reinstates eligibility for prosecution (if legally possible) or social ostracization.
  *   **Action:** Assign a monitoring officer (community member) to verify compliance quarterly.
  *   **Outcome:** Status Granted.

  ---

  # Case Runs

  ## Case 1: The Militia Organizer
  **Profile:** Former organizer. Offers 3 burial sites. Refuses to name commanders ("uncertain").
  **Procedure Run:**

  *   **Step 1 (Safety):** Pass. Conflict is over.
  *   **Step 2 (Truth):**
      *   *Check A:* Pass. Burial sites are high-value truth.
      *   *Check B:* **FAIL/VALUES CALL.** He is withholding commander names.
      *   *Decision Point:* The team must decide if "bodies for names" is a valid trade.
      *   *Likely Outcome:* **PASS.** In transitional justice, recovering the dead often outweighs punishing the distant architects. The team accepts his "uncertainty" as plausible enough to secure the sites.
  *   **Step 3 (Community):** Pass. Families of the disappeared usually prioritize knowing burial locations over prosecuting commanders.
  *   **Step 4 (Restrictions):** Ban from office, mandatory labor at the exhumation sites.
  *   **Result:** **RA Status Granted.**

  **The Uncomfortable Result:**
  You have granted a form of immunity to a leader who admits organizing militia but hides the people who funded or ordered them. You know he is likely lying about "uncertainty" to protect his superiors (or himself from future reprisals). By accepting this, you are prioritizing *forensic truth* (where are the bodies?) over *narrative truth* (who is responsible?). This may feel like letting a guilty man off lightly.

  ## Case 2: The Elderly Guard
  **Profile:** Elderly guard. Full names provided. Remorseful. Community split 50/50 (forgiveness vs. prison).
  **Procedure Run:**

  *   **Step 1 (Safety):** Pass. Elderly, low threat.
  *   **Step 2 (Truth):** Pass. Full disclosure, corroborated.
  *   **Step 3 (Community):**
      *   *Check B:* **HIGH OPPOSITION.** 50% want prison.
      *   *Decision Point:* **VALUES CALL.** Does the community have veto power?
      *   *Likely Outcome:* **PASS.** If your group prioritizes the *process* of truth-telling, you cannot allow a veto based on retribution. If you deny him because half want prison, you destroy the incentive for others to confess.
  *   **Step 4 (Restrictions):** House arrest limits, mandatory service to victims' families.
  *   **Result:** **RA Status Granted.**

  **The Uncomfortable Result:**
  You are overriding the explicit desire for punishment from half the community. This risks social fracture. The victims who want prison will view your group as illegitimate or biased. You are sacrificing *local consensus* for *systemic truth*. This mirrors the criticism of the South African TRC where amnesty felt like a betrayal to those who wanted justice in court.

  ---

  # Critical Value Judgments You Must Settle Before Tomorrow

  Your team cannot run this procedure effectively until you agree on the following three points. These are the "Values Calls" flagged above.

  **1. The "Completeness" Standard (Step 2)**
  *   **The Conflict:** Does "full testimony" mean "everything they know" or "everything they are willing to say"?
  *   **The Decision:** If you accept "uncertainty" (Case 1), you get more truth about *events* but less about *responsibility*. If you demand names, you get fewer applicants.
  *   **Recommendation:** Define "full" as "all verifiable facts regarding victims." Command structures are secondary to victim recovery.

  **2. The Veto Power (Step 3)**
  *   **The Conflict:** Can victims block the process?
  *   **The Decision:** If yes, you become a mediation service, not a justice mechanism. If no, you risk being seen as impositional.
  *   **Recommendation:** No individual veto. However, if >75% of victims oppose, the restrictions (Step 4) must be significantly hardened (e.g., public shaming added).

  **3. The Enforcement Teeth (Step 5)**
  *   **The Conflict:** What happens if they break the rules?
  *   **The Decision:** You have no national mandate. You cannot send them to prison.
  *   **Recommendation:** Your only real power is social. The contract must state that violation leads to "Public Revocation," where you announce to the community that the person lied and is no longer under your protection. This relies on community enforcement, which is dangerous but real.

  **Summary for Your Meeting:**
  This procedure prioritizes **Truth** and **Victim Recovery** over **Retributive Justice**. It will produce results where guilty people remain free (Case 1) and where victim desires for prison are ignored (Case 2). This is inherent to the model. If your team or community cannot accept those specific outcomes, "Residual Accountability" is not the right tool for your context.
