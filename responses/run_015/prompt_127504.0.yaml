answer: |-
  Here are ten sharp, conversational questions designed to probe the limits of her framework without letting her retreat into textbook definitions.

  **1. The Location of the Replicator**
  "In strict Darwinian terms, you need a replicator to hold the information and an interactor to do the work. In oral traditions, the story structure is the replicator, and the telling is the interactor. But on TikTok, the 'dance challenge' changes slightly with every single video. The interactor is mutating constantly. So, where is the replicator actually stored? If the video is the interactor and it's different every time, are you arguing the replicator is just an abstract *rule* to mutate? Because that starts to sound like the replicator is invisible."

  **2. Follow-up (Anticipating the 'Multi-Level Selection' Defense)**
  "I suspect you'll say selection operates at multiple levels—the gene, the meme, the algorithm—and that the replicator just shifts location depending on the scale. But if the replicator can be a physical video, then a behavioral rule, then an abstract algorithmic pressure, doesn't the term lose its grip? At what point does defining the replicator so flexibly make the theory unfalsifiable? If the replicator is wherever the selection *was*, how do we predict where it *will be*?"

  **3. The Maladaptive Meme Problem**
  "Let's talk about host welfare. In biology, a parasite that kills its host too fast usually burns itself out. But online, algorithmic curation seems to reward memes that are high-engagement but potentially harmful to the human host—outrage, misinformation, self-harm trends. If the selection environment (the feed) prioritizes engagement over host well-being, why wouldn't natural selection eventually weed out the humans susceptible to these 'parasites'? Or are you saying cultural evolution has decoupled entirely from biological fitness?"

  **4. Follow-up (Anticipating the 'Selection Isn't Moral' Defense)**
  "Your likely answer is that selection isn't moral or optimal; it just *is*, and maladaptive outcomes are a feature, not a bug. But if the theory predicts that harmful memes *can* spread, but doesn't predict *when* they'll become dominant enough to crash the system, what is the predictive utility here? If the answer to 'Why did this harmful idea win?' is always just 'It fit the selection environment,' aren't we just doing history after the fact rather than evolutionary science?"

  **5. The Evolutionary Psychology Distinction**
  "You distinguish your work from Evolutionary Psychology by saying you don't need innate, domain-specific modules to explain cross-cultural patterns. But if certain meme structures—like supernatural agents or status hierarchies—appear universally, isn't that functionally identical to saying humans have a 'module' for detecting them? If the selection pressure is constant across all human history, how is a 'universal selection pressure' empirically different from a 'universal cognitive bias'? I want to know where the machinery differs, not just the label."

  **6. The Problem of Failed Memes**
  "For every viral format, there are thousands of structurally identical ideas that never catch on. Two videos, same song, same dance, same timing—one gets millions of views, the other gets twelve. If the meme structure is the same and the selection environment is the same, how do you account for the failure without smuggling in 'intentional design' or 'influencer status' as hidden variables? Does accounting for failed memes force you to admit that individual agency matters more than your model allows?"

  **7. The Fidelity Threshold**
  "You've argued that digital culture selects for *low* fidelity—that high-mutation formats spread *because* they invite remixing. But there has to be a breaking point. If I remix a meme until it's unrecognizable from the source, it stops being that meme. How do you calculate the fidelity threshold where a lineage dies? Is there a mathematical point where the mutation rate exceeds the selection pressure's ability to recognize the kin?"

  **8. Algorithmic Opacity**
  "You treat algorithms as part of the developmental environment that selects for memes. But these algorithms are proprietary black boxes. We don't know the weights. If we can't measure the selection pressures directly because Meta won't show us the code, are we really doing evolutionary science? Or are we inferring the predator by looking at the scars on the prey and guessing what bit them?"

  **9. The Role of Human Agency**
  "In your framework, humans are often the 'developmental environment' or the 'host.' But humans also consciously design memes to game the algorithm. When a marketing team reverse-engineers a viral format to sell a product, is that still blind variation and selection? Or does intentional design create a Lamarckian shortcut that breaks the Darwinian model? How much agency can your system tolerate before it stops being memetics?"

  **10. Intervention and Normativity**
  "Finally, if algorithmic feeds are selection environments that reshape meme fidelity, understanding this should allow us to engineer better ones. But if, as you say, selection naturally favors high-mutation, low-fidelity content because it's more 'fit' for the digital environment, isn't the only way to fix it to artificially suppress the fittest memes? Are you arguing we need to create an environment that is *anti-evolutionary* to preserve truth?"
