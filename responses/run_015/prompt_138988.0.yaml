      *   **Conflict:** Committee is split (Verbal Yes vs. Lateralized No vs. Category Error).
      *   **Requirements:**
          1.  Open with a concrete recommendation (Proceed/Postpone/Conditions) + time frame.
          2.  Explain the underlying phenomenon without citing specific studies/researchers.
