              *   Steelman the rejected position (address the "privileging speech" vs. "discounting patient voice" concern).
      *   **Tone:** Professional, ethical, decisive, nuanced, suitable for circulation among colleagues (clinicians, ethicists, legal/risk).

  2.  **Deconstruct the Clinical/Ethical Problem:**
      *   **The Physiology:** Corpus callosotomy disconnects the hemispheres. The Left Hemisphere (LH) usually controls speech and the right hand. The Right Hemisphere (RH) controls the left hand and processes left visual field input. They cannot share information directly.
      *   **The Consent:** LH says "Yes" (verbal + right hand sign). RH says "No" (left hand choice).
      *   **The Risk:** Elective surgery (driving benefit, seizure reduction) vs. Medication management. Not life-saving.
      *   **The Ethical Core:** Who is the patient? Is it the organism or the conscious agents? If the RH cannot speak but can understand and choose, does its refusal count? If we ignore the RH, are we silencing a part of the person? If we honor the RH, are we allowing non-verbal behavior to override explicit verbal consent (slippery slope)?
      *   **The Policy Gap:** Policy covers competent refusal but is silent on intra-organismic disagreement.

  3.  **Determine the Recommendation:**
      *   *Option A (Proceed):* Risks violating the RH's autonomy. Since it's elective, why rush?
      *   *Option B (Postpone):* Allows for better testing. Respects the gravity of the disagreement.
      *   *Option C (Proceed with Conditions):* Too vague.
      *   *Decision:* **Postpone.** The surgery is elective. The conflict is significant. Rushing (surgeon's desire for the slot) is ethically suspect when capacity is genuinely in question due to the split. We need to establish if the RH refusal is stable and informed.
      *   *Time Frame:* Delay until a formalized lateralized capacity assessment is complete (e.g., 4-6 weeks).

