answer: |-
  This is a classic problem in moral philosophy, often discussed under the headings of "complicity," "overdetermination," and "imperfect duties." Your frustration is well-founded: standard utilitarianism (which looks only at consequences) fails here because the individual consequences are negligible. Standard deontology (which looks at rules) struggles because the rules seem to apply unevenly.

  You do not need to discard most of your intuitions, but you do need to refine the *basis* of them. Your gut is not merely favoring friends over strangers; it is tracking **the moral status of the practice you are joining** and **the availability of justifying reasons.**

  Here is a principle that captures your verdicts without excessive epicycles, followed by an honest assessment of where your intuitions might need correction.

  ### The Principle of Complicit Participation

  **An individual act is wrong if it constitutes participation in a harmful practice, unless the participation is justified by a competing moral obligation or the practice serves a vital human good that outweighs the harm.**

  This principle relies on three specific clauses to handle your cases:

  1.  **The Inefficacy Clause:** The fact that your individual act makes no measurable causal difference is irrelevant to whether it is wrong. (You are judging the *participation*, not the *impact*.)
  2.  **The Practice Distinction:** Distinguish between **Harmful Practices** (activities whose primary function or standard operation produces net harm, e.g., industrial meat production, littering) and **Valuable Practices with Costs** (activities that are inherently good or necessary but generate harm as a side effect, e.g., friendship, civic duty, wearing clothes).
  3.  **The Normative Status Clause:** Distinguish between **Active Degradation** (violating a standing norm to make a space worse) and **Conventionalized Use** (utilizing a space whose function has socially shifted due to prior harm).

  ---

  ### Testing the Principle Against Your Cases

  **1. The Meat-Eater (Wrong)**
  *   **Verdict:** Wrong.
  *   **Analysis:** This is a **Harmful Practice**. The primary function is to satisfy a preference (taste) via a system of killing. There is no competing moral obligation to eat *this* meat. The Inefficacy Clause blocks his excuse.
  *   **Fit:** Perfect.

  **2. The Wedding Flyer (Not Wrong)**
  *   **Verdict:** Not Wrong.
  *   **Analysis:** This is a **Valuable Practice with Costs**. Friendship and witnessing a commitment are significant human goods. The carbon cost is a side effect, not the goal. The "competing moral obligation" (duty to a friend) justifies the participation in the harmful system (aviation) for this specific instance.
  *   **Fit:** Perfect. (Note: If she flew for a casual weekend getaway, the principle might condemn it, as the "vital good" is weaker).

  **3. The Indifferent Voter (Wrong)**
  *   **Verdict:** Wrong.
  *   **Analysis:** Voting is a **Valuable Practice** (civic maintenance). Staying home out of *indifference* is a failure of civic duty. There is no competing obligation preventing her from voting. She is free-riding on the democratic system.
  *   **Fit:** Perfect.

  **4. The Litterer (Wrong)**
  *   **Verdict:** Wrong.
  *   **Analysis:** This is **Active Degradation**. The park is designated as a "park," not a "dump." Dropping the cup violates the standing norm of the space. It is a **Harmful Practice** (pollution) with no justifying good.
  *   **Fit:** Perfect.

  **5. The Path-Walker (Not Wrong)**
  *   **Verdict:** Not Wrong.
  *   **Analysis:** This is **Conventionalized Use**. While structurally similar to the litter, the *normative status* of the bald patch has changed. It is no longer "lawn"; socially and functionally, it has become "the path." Walking on it is not degrading the space; it is using the space as it is now designated.
  *   **Fit:** Good, but requires accepting that social conventions can shift moral boundaries (see "Where You Might Be Wrong" below).

  **6. The Stone-Throwers (Wrong)**
  *   **Verdict:** Wrong.
  *   **Analysis:** This is pure **Complicity**. The practice is "shattering windows." Even if overdetermined, each participant joins the harmful practice. No justifying good exists.
  *   **Fit:** Perfect.

  **7. The Jeans-Buyer (Not Wrong / Negligible)**
  *   **Verdict:** Not Wrong (conditionally).
  *   **Analysis:** Clothing is a **Valuable Practice/Necessity**. Unlike meat, you *must* wear clothes. If ethical alternatives are prohibitively expensive or unavailable, the harm is a side effect of survival/participation in society, not a chosen luxury.
  *   **Fit:** *Tenuous.* This depends entirely on whether the cheap jeans were a *necessity* or just *convenient*. (See below).

  **8. The Lawn-Waterer (Uncertain)**
  *   **Verdict:** Context-dependent.
  *   **Analysis:** This reveals a **Threshold**. If the reservoir is merely "low," watering is a **Valuable Practice with Costs** (maintaining a home). If the reservoir is "critically low," the practice shifts toward **Harmful** (endangering the community). Your flipping intuition is correct; the moral status changes as the system nears collapse.
  *   **Fit:** Perfect.

  ---

  ### Where Your Intuitions Might Need Correction

  You asked me to be plain if some verdicts must go to save the principle. There are two tension points.

  **1. The Jeans (Case 7) vs. The Meat (Case 1)**
  Your intuition treats these differently, but the principle suggests they are morally closer than you feel.
  *   **The Conflict:** You call meat wrong because it supports killing. You call jeans "regrettable" because they support exploitation. If you can afford ethical jeans but choose the cheap ones for style or savings, that is a preference (like taste), not a necessity.
  *   **The Correction:** If the cheap jeans are *affordable luxuries* rather than *economic necessities*, your intuition here is likely inconsistent with Case 1. The principle suggests that buying exploitative clothing for non-essential reasons is wrong for the same reason eating factory meat is wrong: you are funding a harmful practice for a marginal personal gain when alternatives exist.
  *   **Recommendation:** Either admit the jeans purchase is wrong (if not financially necessary), or admit the meat-eating is permissible (if you view meat as a cultural necessity). Given your other verdicts, I suspect you should tighten your view on the jeans.

  **2. The Path (Case 5) vs. The Litter (Case 4)**
  This is the hardest pair. Your intuition says Litter is Wrong, Path is Fine.
  *   **The Conflict:** Both prevent the park from returning to a "pristine" state. If everyone thinks like the path-walker, the grass never heals. If everyone thinks like the litterer, the park never cleans.
  *   **The Correction:** Your intuition on the Path is relying on **descriptive norms** ("everyone walks here") overriding **prescriptive norms** ("grass should grow"). If the goal of the park is ecological health, the path-walker is doing the same structural harm as the litterer.
  *   **Recommendation:** You can keep your intuition *only if* you accept that human spaces inevitably degrade and we must designate "sacrifice zones" (paths) to preserve the rest. If you view the bald patch as damage that *ought* to be repaired (e.g., by fencing it off), then walking on it is wrong. I suggest viewing Case 5 as **venially wrong** (a small wrong), whereas Case 4 is **manifestly wrong**. This preserves the distinction without claiming the path-walker is blameless.

  ---

  ### Testing Against New Cases

  **1. The Stadium Wave**
  *   *Scenario:* A wave requires a section to stand. You sit because "my standing doesn't matter."
  *   *Verdict:* **Wrong.**
  *   *Reasoning:* This is a **Cooperative Practice**. The good (the wave) only exists if people participate. Sitting is free-riding on the coordination of others. It fits the "Inefficacy Clause" (your standing doesn't break the wave, but it fails to sustain it) and the "Practice Distinction" (it's a harmless, fun practice).

  **2. The Office Pens**
  *   *Scenario:* Everyone takes pens home. You take one.
  *   *Verdict:* **Wrong.**
  *   *Reasoning:* This is **Active Degradation** of a shared resource (trust/budget). Even if the cost is negligible, it violates the normative status of "office supplies." It is a Harmful Practice (theft/misuse) without a justifying good (you likely have pens at home).

  **3. The Tax Under-Reporters**
  *   *Scenario:* Many under-report small amounts; audits have stopped. You under-report.
  *   *Verdict:* **Wrong.**
  *   *Reasoning:* This is the **Voter Case** scaled up. It is a **Valuable Practice** (public funding) that you are undermining. The fact that audits have stopped (the "bald patch" of enforcement) does not change the normative obligation to pay. This is closer to Case 4 (Litter) than Case 5 (Path). The space (tax system) is not *designated* for cheating; it is merely *currently suffering* cheating.

  ---

  ### Final Verdict on Your Wavering Cases

  **Cases 4 and 5 (Litter vs. Path)**
  Your intuition is tracking **Social Meaning**, not just physics.
  *   **Litter:** You are introducing a foreign object that signals "I do not respect this space."
  *   **Path:** You are following a groove that signals "This is how we move through this space."
  *   **Resolution:** Keep the distinction, but ground it in **Signaling**. Litter signals disregard for the shared norm. Walking the path signals adherence to the *evolved* norm. However, be aware that if the path expands and kills the whole lawn, the norm has become destructive, and your participation becomes wrong.

  **Case 8 (Watering)**
  Your wavering is a feature, not a bug. This case is **Threshold-Sensitive**.
  *   **Resolution:** The moral status of the act changes based on the **Marginal Utility of the Resource**.
      *   *Reservoir 80% full:* Watering is fine (Valuable Practice).
      *   *Reservoir 40% full:* Watering is questionable (Cost outweighs benefit).
      *   *Reservoir 10% full:* Watering is wrong (Harmful Practice).
  *   Your gut is correctly sensing that you lack the data to know which threshold the town is in. On days you feel it's wrong, you are imagining scarcity. On days you feel it's fine, you are imagining abundance. Both are morally consistent; the *facts* determine the verdict.

  ### Summary
  You do not need to abandon your gut. You need to articulate that you are judging **participation in practices**, not **causal outcomes**.
  1.  **Reject the "No Impact" excuse** (Cases 1, 3, 4, 6).
  2.  **Allow "Competing Duties" to justify harm** (Case 2).
  3.  **Distinguish "Necessity" from "Preference"** (Tighten your view on Case 7).
  4.  **Recognize that Norms can Shift** (Case 5 is okay because the path *became* a path; Case 4 is not because the park didn't *become* a dump).

  Your principle is robust. The only epicycle you need to trim is the Jeans case: if you can afford better, buying exploitation is closer to the Meat case than you want to admit.
