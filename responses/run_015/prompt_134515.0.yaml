answer: |-
  1. Does the speaker treat exceptionalism as a historical claim about the country, a normative claim about what it ought to do, or an ideological claim about what social function the idea serves?
      1.1. Historical Claim
          1.1.1. Is the alleged uniqueness structural—rooted in durable institutional design—or performative, meaning the discourse itself generates the political conditions it claims merely to describe?
              1.1.1.1. Structural → **Structural Exceptionalism**
              1.1.1.2. Performative → **Performative Exceptionalism**
      1.2. Normative Claim
          1.2.1. Is the implied duty exemplary—the nation should be imitated—or missionary—the nation should actively spread its system?
              1.2.1.1. Exemplary → **Exemplary Exceptionalism**
              1.2.1.2. Missionary → **Missionary Exceptionalism**
      1.3. Ideological Claim
          1.3.1. Does exceptionalism primarily legitimize democratic participation or imperial expansion?
              1.3.1.1. Democratic Participation → **Democratic-Legitimation Ideology**
              1.3.1.2. Imperial Expansion → **Imperial-Legitimation Ideology**

  **Leaf Descriptions**

  *   **Structural Exceptionalism:** It must deny that similar institutional outcomes have occurred elsewhere without copying the American model.
  *   **Performative Exceptionalism:** It must admit the uniqueness exists only because people insist on talking about it as unique.
  *   **Exemplary Exceptionalism:** It requires passive isolationism to maintain the purity of the model being watched.
  *   **Missionary Exceptionalism:** It justifies violating the sovereignty of others to grant them the liberty to choose sovereignty.
  *   **Democratic-Legitimation Ideology:** It implies domestic dissent is un-American because it undermines the unique consensus required for the system to function.
  *   **Imperial-Legitimation Ideology:** It must frame conquest as liberation to maintain the self-image of the liberator.

  **Flagged Separation Failures**

  *   **Structural Exceptionalism vs. Institutional Comparative Advantage:** The tree cannot reliably separate a claim of unique destiny from a claim of temporary institutional efficiency without accessing the speaker's private metaphysics regarding permanence.
  *   **Exemplary vs. Missionary Exceptionalism:** The tree forces a choice between being a model and spreading the model, though most adherents argue the model spreads itself through attraction, blurring the active/passive distinction required for clean classification.

  **Unoccupied Combination Diagnoses**

  *   **Historical-Normative Hybrid (Fact Implies Duty):** A single thesis claiming uniqueness is factual and automatically generates duty without a bridging normative premise. Diagnosis: Merely unexplored (usually parsed into separate historical and normative claims).
  *   **Ideological-Null (Identity Without Function):** A claim that exceptionalism serves no legitimation function but merely describes identity. Diagnosis: Unattractive (ideological constructs generally require utility to sustain political cohesion).
