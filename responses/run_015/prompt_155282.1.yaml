answer: |-
  For Dewey, democratic legitimacy resides not in expressing pre-existing will but in structuring institutions to treat policy outcomes as fallible data subject to collective revision.

  Democracy is experimental inquiry applied to social life. If policies are hypotheses, legitimacy derives from the capacity to test consequences and revise based on shared experience, rather than initial consent. This prioritizes institutional mechanisms for feedback and adaptation over procedural voting alone. Critics fear this reduces politics to technocratic management, where experts optimize means without public input on ends. This conflates routine problem-solving with genuine experimental inquiry. Routine administration accepts fixed goals and seeks efficient techniques, inviting elitism. Genuine experimental inquiry treats ends themselves as mutable hypotheses requiring public deliberation. Thus, institutional design must foster widespread communication, ensuring those affected by consequences participate in evaluating them. Legitimacy emerges from this continuous, inclusive reconstruction of experience, not merely from aggregating preferences or deferring to specialists. Mandating open policy testing prevents technocratic closure while avoiding the stagnation of rigid majoritarianism.
