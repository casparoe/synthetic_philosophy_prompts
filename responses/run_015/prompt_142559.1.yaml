          1.  Peer Disagreement (colleague gets different result).
          2.  Explained Error (colleague is wrong, and I know why).
          3.  Self-Referential Unreliability (I know my process was degraded, but can't re-run, and the reliability estimate depends on the same process).
          4.  Akratic State (Believe $p$, but believe I shouldn't believe $p$).
      *   **Task 1:** Translate the four scenarios into Bayesian/statistical terms (point estimates, hierarchies, hyperpriors, etc.), flagging assumptions/fudges.
      *   **Task 2:** Residue Report (Critique the "Hierarchical Model Solution"). Address specific questions about defeat, akrasia, infinite regress, and actionability.
