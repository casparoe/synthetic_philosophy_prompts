  7.  **Final Polish:** Check against the prompt's specific constraints (no papers, no jargon without definition, flag fudges). Ensure the "Residue Report" directly answers the four bullet points. (Proceed to generate output).

  *(Self-Correction Note on "Akrasia"):* In epistemology, epistemic akrasia is believing $p$ while believing that believing $p$ is unjustified. In stats, this looks like $P(\theta | Y) \approx 1$ but $P(\text{Model is Valid} | Y) \approx 0$. This is a model mismatch. I need to make sure this distinction is clear.

  *(Self-Correction Note on "Defeat"):* Defeat often means "ignore this data." In stats, we rarely ignore data; we downweight it. I need to highlight that distinction.

  *(Final Plan):* Structure clearly with headers. Use LaTeX for math. Keep the "Residue" sharp.

