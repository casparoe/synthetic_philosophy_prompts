      *   *Check:* Is Akrasia just high variance?
      *   *Correction:* No, high variance is "I'm unsure." Akrasia is "I'm sure, but I think I shouldn't be." This maps to a miscalibrated posterior (overconfidence).
      *   *Check:* Did I answer the "what to do" question?
