          *   *Self-Referential:* Measurement Error / Calibration Model. $Y_{obs} = \theta + \delta$, where $\delta \sim N(0, \sigma^2_{proc})$ and $\sigma^2_{proc}$ is estimated from $Y_{obs}$. Identification issues.
          *   *Akrasia:* Posterior vs. Posterior Predictive Check. $\hat{\theta}$ says go, PPC says model misfit. Or: Point estimate vs. Coverage Probability.
      *   **Flagging Fudges:** Be explicit about Exchangeability, Identification, and the Prior Justification.
      *   **Residue Report:**
          *   *Defeat:* It's not just weights; it's model structure. If the model is wrong, weights don't save you.
          *   *Akrasia:* Stats separates *estimation* from *confidence*. Epistemology fuses them into "warrant." You can output the number, but can you *assert* it?
          *   *Regress:* The Prior stops the regress. Is that a solution or an assumption?
          *   *Action:* Decision Theory. But "what to believe" $\neq$ "what to bet."

  5.  **Refining the Tone:**
      *   Avoid "Philosophers say..." unless translating.
      *   Use "You would model this as..."
      *   Keep it rigorous. Don't dumb down the stats; the user is an expert.
      *   Ensure the "Residue" hits the hard limits of the statistical framework.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I assume pooling is correct in Translation 1?
