answer: |-
  Okay, let's get into the weeds on this. Here's the quick brain-dump before we polish it for the column:

  Procreative beneficence (PB) is basically a moral duty—it says parents *ought* to pick the child with the best expected life. Liberal eugenics (LE) is about rights—it says parents *can* pick, but the state stays neutral. The non-identity problem is the wrench here: if you pick Embryo A over Embryo B, Embryo B never exists, so you haven't harmed B. PB uses this to say "see? no harm, so maximize good!" LE uses it to say "see? no harm, so stop regulating!" The risk is that PB's moral pressure turns LE's freedom into a covert obligation. They look diffrent in theory but might feel the same in the clinic.

  Now, let's reason through that a bit more because the non-identity piece is really where the rubber meets the road.

  When we talk about selecting embryos for cognitive traits, the non-identity problem (thanks to Parfit) tells us that choosing a smarter embryo doesn't harm the "less smart" one that wasn't chosen, because that specific person never comes into existence. You aren't hurting a disabled person; you're creating a different, non-disabled person.

  Here's how the two views split on that logic:

  **Procreative Beneficence** grabs the non-identity problem and runs with it to establish an obligation. Savulescu's argument is basically: since you aren't harming the non-selected embryo by leaving it in the freezer, the only moral metric left is the quality of life of the child who *is* born. If you could have had a smarter, happier child but chose a less smart one, you've violated the principle of beneficence. The non-identity problem clears the deck of "harm" claims so the "maximize good" duty can stand alone. It pushes parents toward a specific outcome.

  **Liberal Eugenics**, on the other hand, uses the non-identity problem as a shield for autonomy. Thinkers like Nicholas Agar argue that because no specific individual is harmed by selection (again, the non-identity loophole), there's no grounds for state interference. But crucially, LE stops short of saying you *must* maximize. It says you have the right to choose traits based on your own values, provided you don't harm the future child. The non-identity problem here blocks the "harm" argument against selection, but it doesn't automatically install a "duty to optimize."

  So, does LE's hands-off stance block PB's push? In a legal sense, yes. LE insists on state neutrality, so the government can't enforce PB. But morally? That's where things get messy. If PB becomes the dominant ethical framework within a liberal eugenics system, the "right to choose" collapses into a "duty to choose the best." Social pressure could make the liberal option feel mandatory. You might have the legal freedom to select an embryo with average cognitive traits, but if every bioethicist and peer tells you that's morally suboptimal, is it really freedom?

  They don't totally collapse into the same thing philosophically—one is about duty, the other about liberty—but in practice, a strong culture of beneficence can hollow out liberal eugenics until it's just eugenics by peer pressure. The non-identity problem is the tool both use, but PB wields it as a sword to cut away excuses, while LE wields it as a shield to keep the state out.

  Hope that helps clarify the angle for the piece. Let me know if you want to dig deeper on the cognitive trait specifics.
