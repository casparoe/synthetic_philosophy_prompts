  You are a professional moral philosopher — the sort who could walk in and teach a graduate seminar on blame, moral responsibility and standing, and who's read all the back-and-forth on hypocrisy. Please think carefully and properly here: do a short unstructured brainstorm pass first where you just note down which pairs of my commitments look like they might grind against each other, then do a careful second pass, then give me your final ranked answer. Sanity-check your own list before you finish — I want you to tell me which of the clashes you found are real and which dissolve once you look properly, not just flag all of them. Be specific and stay on my case rather than drifting off into textbook hypotheticals. Skip the reading list and don't name papers or tell me who to read; I want the arguments, not the bibliography. And write the answer in American English, please (I'm British but this is going into a shared doc with American colleagues).

  So: something happened at work about six weeks ago and I've been going round in circles on it ever since, and I've ended up with a pile of half-thought-out positions that I can't tell are consistent. I'm a research associate in a small neuroscience lab. I raised a concern about a colleague who was quietly dropping outlier animals from a dataset until the effect he wanted showed up. And someone then pointed out — fairly, I guess — that I'd done essentially the same thing on a different project about three years ago and never breathed a word about it. Now everyone's split between "you were right to say something" and "you of all people can't say anything," and I honestly can't tell which is true. Not a legal or HR question, a moral one. Here's where I think I've landed:

  1. Blame isn't punishment and it isn't a sanction. It's holding someone answerable — registering a demand and addressing it to them.

  2. Whether someone is blameworthy depends entirely on them: what they did, whether it was wrong, whether they had an excuse. It doesn't shift depending on who's doing the blaming, and it doesn't get diluted just because loads of other people have done the same thing.

  3. Even so, hypocrites lack standing. If you blame someone for something you've done yourself, your blame is defective in a way that's more than just bad manners — it's genuinely morally off.

  4. And the reason, for me, is fairness. You can't hold someone to a standard you aren't prepared to be held to yourself. That's what makes it objectionable.

  5. But relevance has to come in: a murderer can perfectly well blame a pickpocket. The blamer's own thing has to be the same-ish norm. Chain-smoking parent telling their kid not to smoke is the obvious no-standing case.

  6. I think I was entitled to say what I said, and to say it to his face rather than only filing something.

  7. Standing is a matter of degree, not on/off. Someone who's been at it for years has less of it than someone who slipped once, and a lot of the time the right verdict is "you may say it but he's entitled to resent it" rather than "you may not say it at all."

  8. Quietly knocking it off isn't enough to get your standing back — you have to actually own up to what you did. Someone who stopped fudging things and said nothing has no more standing than someone still at it. And I think that holds even if the person you're blaming never finds out about your thing.

  9. I don't think "standing laundering" is a real problem. If I lack standing to blame him, it's fine for me to turn to our postdoc, who is clean, and say "you should say something." The norm still gets enforced, and if the trouble with my blaming is something about me, then getting someone without the trouble to do it should sort it out. I did do this, as it happens; she did say something; and apparently that's being counted as another instance of the same hypocrisy.

  10. There's the everyone's-hands-are-dirty worry too. Basically everyone in our unit has cut some corner at some point. If any past similar corner-cutting destroys your standing, then nobody in the unit can ever call anybody out, which seems mad. But I don't want to conclude from that that standing conditions are made up, because the smoking parent case is obviously right.

  11. I think it's fine to blame people who will never know about it. My old PI built the culture that produces this stuff and she retired in 2019, and I definately blame her.

  12. And I think blaming is sometimes required, not just permitted. Staying quiet can itself be a kind of going-along-with-it, or a failure to take the person who got harmed seriously.

  One more thing I insist on methodologically: I don't want standing to depend on whether the blame actually lands, or on how he happens to react to it. That feels far too hostage to his feelings.

  So: audit the set. Which of these pull against each other, ranked by how badly? For each real tension, tell me exactly what would have to give and what giving it up would cost me elsewhere in the list — I'd rather have the cheapest fix than the most dramatic one. Which apparent clashes dissolve on inspection and why? And if there's a single revision that cleans up the most, say which. I've got no stake in any particular one of these surviving apart from wanting the whole thing to hang together, so please don't just tell me what I'd like to hear — and I'd like a rough severity rating per tension so I can see which ones are seperate worries and which are the same worry wearing two hats.
