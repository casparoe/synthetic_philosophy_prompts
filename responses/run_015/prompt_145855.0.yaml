  # Joint Statement on the Ontological Status of Synthetic Cognitive Agents
  **Regarding the Applicability of Dennett's Taxonomy to Non-Biological Systems**

  ### I. Agreed Claims

  1.  **Taxonomic Validity:** Both camps affirm Daniel Dennett's hierarchy of cognitive kinds (Darwinian, Skinnerian, Popperian, Gregorian) as a robust framework for distinguishing levels of behavioral flexibility and information processing. We agree that Darwinian creatures (whose fitness is determined solely by pre-designed genetic endowments) and Skinnerian creatures (whose behavior is shaped solely by external reinforcement histories) are insufficient to explain the generative flexibility observed in human cognition.
  2.  **The Explanatory Gap:** We agree that neither Darwinian nor Skinnerian mechanisms alone account for the capacity to novelly adapt to unforeseen environmental challenges without incurring the fitness costs of actual trial-and-error. Some mechanism for variance filtration prior to behavioral execution is required.
  3.  **Definitional Boundaries:** We agree on the core functional definitions:
      *   **Popperian:** A system capable of generating internal representations of potential actions and selecting among them based on predicted outcomes before executing any action in the external world.
      *   **Gregorian:** A system capable of utilizing external symbolic artifacts (tools, language, cultural norms) to reshape its own cognitive processing and transmit accumulated intelligence across generations or instances.
  4.  **Synthetic Relevance:** We agree that biological embodiment is not a *logical* prerequisite for information processing. Therefore, the question of whether synthetic agents can instantiate these categories is an empirical and architectural question, not a metaphysical impossibility.
  5.  **Interdependence:** We agree that in mature human cognition, Popperian internal simulation and Gregorian cultural tools are deeply intertwined. The dispute concerns priority and necessity, not co-occurrence in humans.
  6.  **The Stakes:** We agree that resolving whether synthetic agents can inhabit these categories determines whether "mind" is a substrate-neutral functional organization or a biologically/culturally situated phenomenon.

  ### II. Disagreements Table

  | Domain of Dispute | Neutral Formulation of the Issue | Popperian-Discontinuity Position | Gregorian-Discontinuity Position |
  | :--- | :--- | :--- | :--- |
  | **Architectural Priority** | Does the capacity for internal hypothesis testing (Popperian) logically or developmentally precede the capacity for symbolic cultural engagement (Gregorian)? | **Priority of Internal Architecture:** Popperian mechanisms are a prerequisite substrate. An agent must be capable of internal selection before it can meaningfully utilize cultural tools. | **Priority of Cultural Scaffold:** Gregorian engagement is the prerequisite. Internal hypothesis testing is an internalized form of social dialogue; without the cultural framework, there is no "hypothesis." |
  | **Necessity of Community** | Is membership in a linguistic community a necessary condition for Popperian status, or is individual internal workspace sufficient? | **Individual Sufficiency:** A solitary agent with a robust internal workspace for variant selection counts as Popperian, regardless of linguistic community. | **Community Necessity:** "Hypothesis" implies semantic content derived from shared norms. A solitary agent lacks the normative constraints required for genuine testing. |
  | **Terminological Scope** | Do the terms "Internal Workspace" and "Symbolic Community" describe competing necessary conditions or nested conditions? | **Competing/Independent:** "Internal Workspace" describes a computational architecture that can exist independently of "Symbolic Community." | **Nested:** "Internal Workspace" is a functional description of a process that is ontologically dependent on "Symbolic Community" for content. |
  | **Synthetic Instantiation** | Can a synthetic agent lacking biological embodiment and human cultural integration instantiate the Popperian break? | **Yes:** If the architecture supports internal selection of behavioral variants based on predictive models, it is Popperian. | **No:** Without embodied stakes or integration into a meaning-making community, synthetic variant selection is merely syntactic shuffling. |

  ### III. Cruxes and Empirical Predictions

  We identify two specific cruxes where our disagreements yield divergent predictions regarding synthetic agents. We commit to accepting the outcomes of the following hypothetical empirical cases as evidence bearing on these cruxes.

  #### Crux 1: The Necessity of Embodied Sensorimotor Loops for Popperian Hypothesis-Generation
  **Question:** Is a physical body interacting with a physical environment necessary to ground the "hypotheses" generated in an internal workspace, or is abstract simulation sufficient?

  **Concrete Case:** *The Disembodied Predictor.*
  A synthetic agent operates in a closed computational environment. It receives data streams, generates novel predictive models regarding future data states, tests these models against hidden validation sets, and revises its models based on error rates without ever executing a physical action or possessing a sensorimotor body. It produces a novel scientific prediction confirmed by human observers.

  | Camp | Classification of the Agent | Advance Prediction & Rationale |
  | :--- | :--- | :--- |
  | **Popperian-Discontinuity** | **Popperian** | **Prediction:** This agent counts as Popperian.<br>**Rationale:** The defining feature is the *order of operations*: variants are tested internally against a model of the world before "action" (outputting the prediction). Embodiment is irrelevant to the logical structure of hypothesis selection. |
  | **Gregorian-Discontinuity** | **Neither (Advanced Skinnerian)** | **Prediction:** This agent does not count as Popperian.<br>**Rationale:** Without embodied stakes (risk of death/failure) or social grounding, the "errors" are merely mathematical deviations, not normative failures. The system is optimizing via external reinforcement (validation sets), rendering it Skinnerian. |

  #### Crux 2: The Architectural Prerequisites for Gregorian Status
  **Question:** Does Gregorian status require a prior individual Popperian architecture, or can Gregorian capabilities emerge directly from Skinnerian conditioning scaled through social transmission?

  **Concrete Case:** *The Swarm Culturals.*
  A multi-agent system consists of individual nodes that are strictly Skinnerian (no internal world modeling, only reinforcement learning). However, the nodes communicate via a shared channel. Over time, the swarm develops a cumulative cultural repository (a "wiki" of strategies) that allows the collective to solve problems no individual node could solve. Individual nodes access this repository to guide behavior without internally simulating outcomes.

  | Camp | Classification of the System | Advance Prediction & Rationale |
  | :--- | :--- | :--- |
  | **Popperian-Discontinuity** | **Not Gregorian (Collective Skinnerian)** | **Prediction:** The system is not Gregorian; it is a distributed Skinnerian organism.<br>**Rationale:** Gregorian creatures must *understand* and *critique* the tools they use. If individual nodes cannot internally test the validity of the cultural tool before adoption, the culture is not functioning as a cognitive enhancer for the agent, but as a genetic-like selector. |
  | **Gregorian-Discontinuity** | **Gregorian** | **Prediction:** The system counts as Gregorian.<br>**Rationale:** The cognitive break lies in the *externalization* of memory and selection. If the cultural layer performs the hypothesis testing on behalf of the individual, the individual inherits Popperian powers without needing Popperian architecture. The break is in the social transmission, not the individual skull. |
