          *   Majority on P v Q: Yes (M1 0.8, M2 0.8, M3 0.4).
          *   *Inconsistency:* Majority says "Not P", "Not Q", but "P or Q".
          *   *Exploitation:*
              *   House sells "P or Q" ticket for 0.7. (M1 Yes, M2 Yes, M3 No). **Committee Buys.** Cost 0.7.
