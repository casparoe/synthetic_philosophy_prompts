      *Student Ledger:* -($P_R + P_G + P_B$). Payoff: +1 (since one must win). Loss is certain.
      *This is fast and meets constraints.*

      *Phase 2:* Committees of 3. 4 Committees total.
      *Phase 3:* Repair.
      *Debrief:* The mapping.

      *Let's finalize the Condo Sentence.* "We are approving three measures that each command a majority, but which together commit us to a outcome none of us wanted." -> A bit clunky. "We have voted 'yes' on three separate items that, taken together, guarantee a result every single one of us voted against." Stronger.

