          *   This doesn't work. The majority will reject everything if the price is 0.5 and individual max is 0.6.
      *   *Re-evaluating the User's "Red-or-Blue" idea:*
          *   This is the **Condorcet Cycle** applied to betting.
          *   Let's try to make the Committee *Sell* tickets they shouldn't, or *Buy* a combination.
          *   Let's use the **Discursive Dilemma** structure directly.
          *   Proposition P: Red is drawn.
