answer: |-
  Here is a complete design for the 75-minute session, adhering to your constraints and pedagogical goals.

  ### Session Overview
  *   **Time:** 75 Minutes.
  *   **Materials:** Opaque bag (30 balls: 10 Red, 10 Blue, 10 Green—composition known to you, sealed in envelope handed to a student), printed price sheets, ledgers, pens.
  *   **Forbidden Words (until Debrief):** Coherent, Exploit, Axiom, Book, Dutch, Rational, Irrational.

  ---

  ### Phase One: The Individual Ledger (25 Minutes)

  **Goal:** Each student constructs a set of prices that guarantees a loss against a counterparty with no information.

  **Setup:**
  1.  **The Bag:** Show the sealed envelope containing the ball composition. Place it in the opaque bag. Hand the bag to a student to hold. State: "One ball will be drawn at the end. The composition is fixed. I do not know it. You do not know it."
  2.  **The Tickets:** There are three tickets.
      *   Ticket R: Pays 10 points if Red.
      *   Ticket B: Pays 10 points if Blue.
      *   Ticket G: Pays 10 points if Green.
  3.  **The Rule:** Each student must write down a single **Fair Price** for each ticket.
      *   *Constraint:* "You are acting as a Market Maker. The price you write is the price at which you are obligated to trade. If I say 'Buy,' you sell to me at that price. If I say 'Sell,' you buy from me at that price. You cannot refuse."
      *   *Risk Fix:* This forces risk neutrality. If they hesitate, say: "Imagine these points are dollars. Name the price where you are indifferent."

  **Execution:**
  1.  Students write prices for R, B, and G on a private slip (e.g., R: 4, B: 4, G: 4).
  2.  Collect the slips. You (the House) quickly sum the three prices for each student.
  3.  **The Settlement (Crucial Beat):** Do not draw the ball yet. Return the slips to the students with a "Trade Confirmation" stamped on them.
      *   **If Sum > 10:** Write "HOUSE BUYS ALL THREE."
          *   *Ledger:* Student receives $(P_R + P_B + P_G)$. Student owes 10 points (since exactly one ticket pays out).
          *   *Net:* $10 - (P_R + P_B + P_G)$. This is negative.
      *   **If Sum < 10:** Write "HOUSE SELLS ALL THREE."
          *   *Ledger:* Student pays $(P_R + P_B + P_G)$. Student receives 10 points.
          *   *Net:* $10 - (P_R + P_B + P_G)$. This is negative.
      *   **If Sum = 10:** Write "NO TRADE."
  4.  **The Reveal:** Ask students to calculate their Net Position *before* the draw. Ask: "Does the color of the ball matter for your final score?" (Answer: No).
  5.  **The Draw:** Draw the ball. Record the payoff. Confirm the loss is real.

  **Teacher Note:** Most students will sum > 10 (optimism) or < 10 (ambiguity aversion). If everyone sums to 10, adjust the payoff structure in real-time (e.g., "Actually, the bag contains 31 balls") to force a mismatch, or acknowledge the rarity.

  ---

  ### Phase Two: The Committee Ledger (25 Minutes)

  **Goal:** A group of internally consistent individuals creates a collectively inconsistent position via majority vote.

  **Setup:**
  1.  Divide the 12 students into 4 Committees of 3.
  2.  **Private Cards:** Hand each member a card with their private valuations. They must not show these to each other.
      *   **Member 1:** Red: 0.6, Blue: 0.2, Green: 0.2
      *   **Member 2:** Red: 0.2, Blue: 0.6, Green: 0.2
      *   **Member 3:** Red: 0.2, Blue: 0.2, Green: 0.6
      *   *(Note: These sum to 1.0 individually. They are internally consistent.)*
  3.  **The Menu:** The House proposes three specific trades. The Committee votes Yes/No by sealed ballot. Majority rules.
      *   **Trade A:** Committee **Buys** Ticket "Red-or-Blue" (Pays 10 if R or B) at Price **7**.
      *   **Trade B:** Committee **Buys** Ticket "Red-or-Green" (Pays 10 if R or G) at Price **7**.
      *   **Trade C:** Committee **Sells** Ticket "Red" (Pays 10 if R) at Price **3**.

  **The Arithmetic (For Your Reference):**
  *   **Member 1 (R=0.6, B=0.2, G=0.2):**
      *   Values R-or-B at 0.8 (6+2). Price is 7 (0.7). **Votes YES to Buy.**
      *   Values R-or-G at 0.8 (6+2). Price is 7 (0.7). **Votes YES to Buy.**
      *   Values Red at 0.6. House offers 3 (0.3) to buy it from them. Selling at 0.3 is a loss. **Votes NO to Sell.**
      *   *Vote:* Yes, Yes, No.
  *   **Member 2 (R=0.2, B=0.6, G=0.2):**
      *   Values R-or-B at 0.8. Price 7. **Votes YES to Buy.**
      *   Values R-or-G at 0.4. Price 7. **Votes NO to Buy.**
      *   Values Red at 0.2. House offers 3. Selling at 0.3 is a gain. **Votes YES to Sell.**
      *   *Vote:* Yes, No, Yes.
  *   **Member 3 (R=0.2, B=0.2, G=0.6):**
      *   Values R-or-B at 0.4. Price 7. **Votes NO to Buy.**
      *   Values R-or-G at 0.8. Price 7. **Votes YES to Buy.**
      *   Values Red at 0.2. House offers 3. Selling at 0.3 is a gain. **Votes YES to Sell.**
      *   *Vote:* No, Yes, Yes.

  **The Outcome:**
  *   Trade A: 2 Yes, 1 No. **Passes.**
  *   Trade B: 2 Yes, 1 No. **Passes.**
  *   Trade C: 2 Yes, 1 No. **Passes.**
  *   **No single member voted Yes on all three trades.**

  **Settlement:**
  1.  Ask committees to tally their cash flow.
      *   Cash Out: -7 (Trade A) - 7 (Trade B) + 3 (Trade C) = **-11 points.**
  2.  Ask committees to tally their maximum possible payoff.
      *   If Red: A pays 10, B pays 10, C owes 10. Net Payoff: 10.
      *   If Blue: A pays 10, B pays 0, C owes 0. Net Payoff: 10.
      *   If Green: A pays 0, B pays 10, C owes 0. Net Payoff: 10.
  3.  **Net Position:** Payoff (10) - Cost (11) = **-1 point.**
  4.  **Result:** The committee has guaranteed a loss of 1 point, despite every member voting rationally according to their private card.

  ---

  ### Phase Three: Repair and Immunity (15 Minutes)

  **Goal:** Demonstrate that the vulnerability is structural, not numerical.

  **Round 1: Price Revision**
  *   Tell the committees: "You are currently losing 1 point for sure. You may discuss and revise your internal valuations, but you must still vote by majority on the same three trades."
  *   *Likely Outcome:* They will try to adjust numbers. However, as long as they use Majority Rule on logically connected propositions, the **Discursive Dilemma** persists. They may fix this specific loss but remain vulnerable to a slightly different menu.

  **Round 2: The Buyout**
  *   Offer to cancel their debt for a fee of 0.5 points.
  *   If they accept, they admit the position was bad.
  *   If they refuse, they play the hand.
  *   *Point:* The loss is already sunk; the decision rule caused it.

  **Round 3: Rule Change**
  *   Ask: "What rule would have prevented this?"
  *   Allow them to propose: Unanimity? Dictatorship? Averaging prices?
  *   **Averaging:** If they average their prices (R=0.33, B=0.33, G=0.33), they become coherent (Sum=1). *Loss:* Intensity of preference is lost; the majority will is ignored.
  *   **Unanimity:** *Loss:* Gridlock. No trade occurs even when beneficial.
  *   **Dictatorship:** *Loss:* Democracy is lost.

  ---

  ### Debrief (10 Minutes)

  **Mapping Moments to Concepts:**
  1.  **Phase 1 Settlement (Before Draw):** This is the **Dutch Book**. The loss was fixed by the *relations among your numbers*, not the state of the world.
  2.  **Phase 2 Vote Count:** This is the **Doctrinal Paradox**. Individual consistency $\neq$ Group consistency under Majority Rule.
  3.  **The House's Ignorance:** Remind them you never looked at the bag. The vulnerability was entirely internal to their ledgers. This isolates **Coherence** from **Accuracy**. You can be coherent and wrong (about the bag), but if you are incoherent, you lose regardless of the bag.

  **Predictable Problems & Fixes:**
  *   **Spreads (Buy 4 / Sell 6):** *Fix:* Enforce the "Market Maker" rule in Phase 1. "Name one number. I choose the direction." This assumes Risk Neutrality. Acknowledge this: "We are assuming you care only about expected value, not variance."
  *   **Guessing the Bag:** *Fix:* If a student asks about the composition, reply: "The trade depends on your price, not the bag."
  *   **The Early Solver:** *Fix:* If a student whispers "It's a Dutch Book," assign them the role of "Auditor." Their job is to verify the math for the class but remain silent until the Settlement phase.
  *   **Apathy:** *Fix:* Tie points to a tangible reward (e.g., leaving 5 minutes early, a small prize for the highest net score). If they don't care about points, they won't feel the loss.

  **Limitations (What You Must Supply):**
  *   **Normative Force:** The session shows incoherence *costs money*. It does not prove incoherence is *irrational* in a moral or epistemic sense, only that it is expensive. You must argue why avoiding loss is a requirement of rationality.
  *   **Dynamic Rationality:** This session is static. It does not show how commitments should *update* over time (Conditionalization). You will need to lecture on that separately.
  *   **Risk:** The single-price setup assumes linear utility. Real humans are risk-averse. You must clarify that "Rational Choice" in this context assumes risk neutrality for the sake of the model.

  ---

  ### The Condo Board Version (20 Minutes)

  **Setup:**
  Skip the bag. Use the current budget.
  1.  **Item A:** Fix Roof (Cost \$10k). Majority wants it.
  2.  **Item B:** Fix Elevator (Cost \$10k). Majority wants it.
  3.  **Item C:** Keep Fees Low (Revenue Cap \$15k). Majority wants it.
  4.  **The Trap:** Vote on A (Yes). Vote on B (Yes). Vote on C (Yes).
  5.  **Settlement:** Total Cost \$20k. Revenue Cap \$15k. Deficit \$5k.
  6.  **Reveal:** Ask each owner: "Did you vote for a \$5k deficit?" (No). "Did you vote for each item individually?" (Yes).

  **The Sentence:**
  > "We have voted 'yes' on three separate items that each command a majority, but which together commit us to a deficit that every single one of us voted against."
