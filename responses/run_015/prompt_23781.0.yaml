answer: |-
  1. Divide the 14 students into two groups of seven and hand each a sealed folder labeled "Nosology Committee A" or "B" containing a specific charter and a stack of five patient vignettes. Instruct them that their sole task is to determine which vignettes qualify as "medical conditions" warranting intervention based strictly on the provided charter.
  2. Committee A's charter mandates ruling based solely on statistical deviation from species-typical biological function, while Committee B's charter requires ruling solely on whether the condition causes significant social harm or disadvantage. Provide cases like asymptomatic hypertension for Committee A to ignore harm, and homosexuality or political dissent for Committee B to potentially pathologize based on social friction, ensuring the labels "naturalist" and "normativist" never appear in their packets.
  3. Committee A will stall on a vignette describing a painless, statistically common genetic anomaly that disables no function but is universally treated, forcing them to call it "healthy." Committee B will struggle with a vignette resembling drapetomania where social disadvantage is clear, compelling them to classify a moral injustice as a biological pathology.
  4. Reconvene the groups to adjudicate a new, unseen case together, then reveal that their conflicting charters represent the naturalist and normativist positions famously articulated by Boorse and Wakefield. Guide them to map their specific frustrations onto the philosophical wreckage, showing how pure statistical function ignores suffering while pure social harm invites oppression.
  5. Acknowledge that this binary setup inevitably obscures hybrid accounts like Wakefield's harmful dysfunction analysis, which students might have naturally gravitated toward if not restricted. Warn that the artificial constraints may lead students to view the positions as straw men rather than nuanced attempts to solve the same definitional problem.
