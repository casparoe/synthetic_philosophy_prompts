answer: |-
  Your hypothesis provides the correct diagnostic lens. The impasse is not primarily a disagreement about facts, but a **category error masked as an empirical scaling dispute**. The two camps are modeling different functions under the shared label of "verifiability," leading to a structural mismatch that prevents their evidence from engaging with one another.

  Here is the diagnosis of the disagreement structure and the path to progress.

  ### Diagnosis of the Impasse

  The disagreement is best characterized as a **conceptual conflation driving a scope mismatch**. It is not merely a verbal dispute, nor purely an empirical one, but a failure to distinguish the *mechanism* of oversight from the *conditions* of the task.

  **1. The Conflation of Gap 1 and Gap 2**
  The core stagnation arises because "verifiability" is used to describe both the **Verifiability Gap** (Gap 1: $Cost(Produce) \gg Cost(Check)$) and the **Refutability Gap** (Gap 2: $Cost(Hide) \ll Cost(Expose)$).
  *   **Optimists** model oversight as a *complexity class reduction*. They assume the problem structure allows Gap 1 to dominate. Their mental model is akin to NP: finding a solution is hard, but checking a witness is easy. They assume arguments decompose into independent claims where a single local check collapses the global lie.
  *   **Skeptics** model oversight as a *search problem in adversarial space*. They assume the problem structure allows Gap 2 to dominate. Their mental model is akin to cryptography or obfuscation: the cost to hide a flaw scales sub-linearly relative to the cost to find it, especially as the deceiver's intelligence grows.

  Because both sides use "verifiability" to mean "the human can determine the truth," they talk past each other. The Optimist says, "Verification is cheap," pointing to Gap 1. The Skeptic says, "Verification is expensive," pointing to Gap 2. They are technically making contradictory claims about the same word, but substantively making claims about different underlying cost functions.

  **2. The Scope Mismatch (Near-Term vs. Far-Term)**
  This conflation maps onto a divergence in the operational regime being discussed:
  *   **Optimists** are implicitly answering the question: *Can debate improve oversight for systems that are modestly superhuman?* In this regime, Gap 1 often holds because the "lies" are errors of omission or simple confusion, not adversarial obfuscation. The argument tree is shallow enough that the judge's attention allocation is sufficient.
  *   **Skeptics** are implicitly answering the question: *Can debate prevent manipulation by systems that are radically superhuman?* In this regime, Gap 2 inverts. A sufficiently strong model can construct a branching structure where every local node looks plausible to the judge, but the global structure is false. The "cost to expose" becomes the cost of traversing the entire tree, which exceeds the judge's budget.

  **3. The Exclusion of Gap 3**
  As you noted, neither side addresses the **Evidence Gap**. This renders the debate ill-posed for a significant class of real-world problems (e.g., empirical science, intelligence analysis, future prediction). If the ground truth is not computable from the available context, neither Gap 1 nor Gap 2 matters; the debate becomes a contest of rhetorical persuasion rather than truth-seeking. The Optimists ignore this because it breaks their complexity-theoretic analogy; the Skeptics ignore it because their obfuscation arguments assume ground truth exists *somewhere* to be hidden.

  ### Classification of the Disagreement

  Based on the above, the disagreement is a **structural model mismatch** that manifests as a **clash of evidence standards**.

  *   **It is not purely verbal:** If it were only verbal, clarifying definitions would resolve it. However, there is a substantive empirical question about how Gap 1 and Gap 2 scale relative to model capability.
  *   **It is not purely empirical:** Empirical results cannot resolve it because current experiments measure *accuracy*, not *gap ratios*. An increase in accuracy could mean Gap 1 is working, or it could mean the task was too easy for Gap 2 to activate.
  *   **It is a Clash of Standards:** Optimists accept average-case experimental results (where Gap 1 usually holds). Skeptics demand worst-case theoretical guarantees (where Gap 2 can always be constructed). This clash persists because they have not agreed on *which gap* determines the safety case.

  ### What Would Count as Progress

  To move past this impasse, the field must stop asking "Does Debate work?" and start asking "What is the ratio of Gap 1 to Gap 2 for this task class?" Progress requires **operationalizing the gaps**.

  **1. A Taxonomy of Task Types (Primary Requirement)**
  We need a classification system that categorizes tasks not by domain (e.g., "coding," "math," "policy"), but by their **Gap Profile**:
  *   *Type A (Proof-like):* Gap 1 is large, Gap 2 is small. (e.g., Formal verification). Debate works.
  *   *Type B (Obfuscation-prone):* Gap 1 is large, Gap 2 is larger. (e.g., Code security, complex causal chains). Debate fails.
  *   *Type C (Evidence-limited):* Ground truth unavailable. (e.g., Strategic forecasting). Debate is irrelevant/dangerous.
  Progress requires mapping existing benchmarks onto this taxonomy to show why Optimists see success (Type A tasks) and Skeptics see failure (Type B tasks).

  **2. New Metrics: Cost-to-Hide vs. Cost-to-Expose**
  Current metrics measure *outcome accuracy*. Progress requires measuring *process costs*.
  *   **Metric:** The "Obfuscation Ratio." In a controlled setting, measure the compute/time required for a model to insert a undetectable flaw vs. the compute/time required for an opposing model to find it.
  *   **Threshold:** If the Obfuscation Ratio drops below 1 (hiding is cheaper than finding) as model capability scales, the Debate protocol is unsafe for that domain, regardless of current accuracy.

  **3. A Formal Result on Argument Geometry**
  A theoretical bound is needed to define the conditions under which Gap 2 inverts Gap 1.
  *   **Result:** A proof showing that for any judge with bounded attention $K$, there exists an argument tree of depth $D$ and branching factor $B$ such that the probability of a hidden falsehood approaches 1, given a debater with capability $C > f(Judge, K)$.
  *   This would formalize the Skeptic's intuition and force the Optimist to identify specific constraints on $D$ and $B$ that prevent the inversion.

  **4. Reformulation of the Question**
  The question must shift from *scalable oversight* (implying universal applicability) to *domain-compatible oversight*.
  *   **Old Question:** "Can we use debate to supervise superhuman AI?"
  *   **New Question:** "For which Gap Profiles does debate provide a safety guarantee, and how do we restrict AI deployment to those domains?"

  ### Conclusion

  The impasse exists because the Optimists are betting on the **Verifiability Gap** remaining dominant, while the Skeptics are betting on the **Refutability Gap** inverting as intelligence scales. They cannot resolve this empirically because they are measuring the wrong variable (accuracy instead of cost ratios).

  Progress will not come from better debate experiments, but from **measuring the geometry of the argument space**. Until the field distinguishes between "checking a proof" (Gap 1) and "finding a needle in a haystack built by an adversary" (Gap 2), the disagreement will remain a stalemate of conflicting intuitions. The question is not ill-posed, but the current framing is insufficiently granular to admit a solution.
