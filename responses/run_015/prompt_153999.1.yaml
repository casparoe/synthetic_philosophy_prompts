answer: |-
  Right, let's have a proper look at this, because it's actually a classic clash of how different folks view time and value. Neither of them is completely mad, but I reckon your mate has the stronger logical case regarding the hobby itself, while his partner's got a point about what "responsibility" looks like.

  Here's the breakdown.

  **The Mate's Logic: Process over Product**
  Your mate is treating this like a practice, not a project. Think about gardening or cleaning the house. You never really "finish" gardening; the weeds always come back. If you treated gardening like a project ("I must finish this garden forever"), you'd be miserable. You do it because the act of doing it is relaxing.

  He's saying the joy is in the Saturday morning ritual—the smell of the oil, the feel of the gears, the puzzle of it. If he actually fixed one properly and donated it, the activity dies. The "project" is complete, and now he's got nothing to do next Saturday. By leaving it slightly broken, he guarantees the continuity of the thing he enjoys. Logically, if the goal is enjoyment of the process, finishing is actually counter-productive. It's not irrational; it's just a different definition of success.

  **The Partner's Logic: Tangible Results**
  She's looking at it through a lens of utility and completion. To her, a hobby should have a result you can point at. A finished calculator, a donation, a receipt of good deeds. When she sees him "failing" to finish, she interprets it as fear of completion or commitment.

  Her claim about "dodging responsibility" is the sticky bit. If he's ignoring the kids, not paying bills, or letting the house fall down around his ears to fiddle with gears, then she's spot on. That's avoidance. But if this is just how he spends his leisure time—his equivalent of someone else watching footie or playing golf—then calling it "irresponsible" is a bit harsh. She's projecting work values (deadlines, deliverables) onto his leisure time.

  **The "On Purpose" Bit**
  The fact that he puts them back together wrong *on purpose* is the only bit that smells a bit odd. It suggests he knows he *could* finish, but chooses not to. Some might call that dishonest, but really, he's just curating his future weekends. He's ensuring he doesn't run out of things he likes doing.

  **The Verdict**
  Strictly speaking? **Your mate's got the stronger case.**

  Hobbies don't owe the world a finished product. He's not building a bridge; he's passing time in a way that suits him. His partner is being a bit unfair by demanding he monetise or museum-ify his relaxation. If he enjoys the maintenance loop, that's valid.

  However, she's not completely barking. If this hobby is becoming an excuse to avoid *actual* life stuff (chores, family time, career), then her "responsibility" argument holds water. But if he's doing all that and just wants to tinker forever? Then she needs to accept that for him, the journey is the destination.

  Tell him to maybe fix one properly just to shut her up, but keep the rest for himself. Compromise saves marriages, even if the logic is on his side.
