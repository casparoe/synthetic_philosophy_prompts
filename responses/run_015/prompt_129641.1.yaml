answer: |-
  # The Calibrated Assertion Protocol (CAP)

  **Philosophical Grounding:** Traditional assertion norms (Williamson's Knowledge Norm) demand you assert $p$ only if you *know* $p$. In science communication, especially forecasting, "knowledge" of the future is impossible. We replace the Knowledge Norm with a **Reliable Indicator Norm**: Assert $p$ if $p$ is generated by a process reliably truth-tracking, weighted by the pragmatic costs of error (Stanley's Pragmatic Encroachment). This checklist operationalizes that shift.

  ---

  ## The Procedure

  ### 1. Epistemic Standing of the Writer
  *Does the author possess the requisite justification to speak on this specific claim?*
  *   **Check:** Did the writer read the full methodology/data, or only the abstract/press release?
  *   **Check:** Does the writer have domain expertise, or are they translating?
  *   **Decision:**
      *   If **No source access** OR **No domain expertise** $\rightarrow$ **STOP** (Kill the claim).
      *   If **Full access** OR **Expert translation** $\rightarrow$ **PROCEED**.
  *   **Annotation:** `[AUTO]` if no source link provided. `[VALUES]` if judging "expertise" level of a freelancer. `[MISFIRE]` on interdisciplinary claims where "expertise" is fragmented.

  ### 2. Claim Type Classification
  *Is this a claim about reality or a claim about probability?*
  *   **Check:** Is the verb tense future-oriented or causal without mechanism?
  *   **Decision:**
      *   If **Descriptive** (Past/Present data) $\rightarrow$ Skip to Step 4 (Apply Truth Norm: Verify data).
      *   If **Predictive** (Future outcome/Model output) $\rightarrow$ **PROCEED to Step 3**.
  *   **Annotation:** `[AUTO]` linguistic check. `[MISFIRE]` on "nowcasting" (e.g., "The virus is spreading" vs "will spread").

  ### 3. The Predictive Assertibility Filter
  *Apply only if Step 2 flagged as Predictive. This replaces "Knowledge" with "Calibration."*

  *   **A. Calibration Check:** Is there historical evidence that the model/source predicts correctly at this confidence level?
      *   *Requirement:* Brier scores, hindcasting data, or consensus consensus.
      *   **Annotation:** `[MISFIRE]` on novel science (no historical data exists). `[AUTO]` if metric provided.
  *   **B. Cost-of-Error Check:** If we assert this and it is wrong, what is the harm?
      *   *Low Cost:* Trivia, entertainment.
      *   *High Cost:* Public health, financial markets, policy.
      *   **Annotation:** `[VALUES]` Requires editorial judgment on harm.
  *   **C. Mode-Label Check:** Does the linguistic framing match the epistemic certainty?
      *   *Assert:* "Will," "Is."
      *   *Hedge:* "Likely," "Models suggest," "Probability."
      *   **Annotation:** `[AUTO]` linguistic check.

  *   **Filter Decision:**
      *   If **Calibration High** + **Cost Low** $\rightarrow$ **ASSERT**.
      *   If **Calibration Low** OR **Cost High** $\rightarrow$ **HEDGE**.
      *   If **Calibration Unknown** + **Cost High** $\rightarrow$ **STOP**.

  ### 4. Final Disposition
  *   **ASSERT:** Flat-out claim. (Requires passing Step 1 & Step 3).
  *   **HEDGE:** Add epistemic modals ("may," "suggests").
  *   **STOP:** Kill the line.
  *   **HAND TO EDITOR:** If Step 3 yields conflicting signals (e.g., High Calibration but High Cost).
  *   **Annotation:** `[VALUES]` Hand-off is always a human judgment call.

  ---

  ## Case Applications

  ### Case 1: The Storm Model
  *Claim:* "The storm will hit Category 4."
  *Source:* Single operational weather model run.
  *   **Step 1 (Standing):** Writer read the model output. **PASS**.
  *   **Step 2 (Type):** Predictive. **FILTER ENGAGED**.
  *   **Step 3 (Filter):**
      *   *Calibration:* Single models drift; ensembles are calibrated. **FAIL**.
      *   *Cost:* High (evacuation decisions). **FAIL**.
      *   *Mode:* "Will" (Absolute). **FAIL**.
  *   **Result:** **HEDGE** ("Models indicate a risk of Category 4...") or **HAND TO EDITOR** if urgency dictates.
  *   **Why:** The Cost-of-Error check triggers pragmatic encroachment; you need higher justification for high-stakes claims.

  ### Case 2: The Cancer Abstract
  *Claim:* "This study proves cancer risk doubles."
  *Source:* Writer read only the abstract.
  *   **Step 1 (Standing):** Writer did not read methodology/data. **FAIL**.
  *   **Step 2 (Type):** Descriptive/Causal (treated as fact).
  *   **Result:** **STOP**.
  *   **Why:** Violates the Knowledge Norm foundation of Step 1. "Proves" is a truth-norm claim requiring full verification, not abstract-level belief.

  ### Case 3: The Blocked Forecast
  *Claim:* "AI compute demand will triple by 2026."
  *Source:* Consensus of 5 calibrated industry forecasts.
  *Checklist Result:* **HEDGE** (Because Cost-of-Error is High [market movement] and Calibration is Imperfect).
  *Editorial Decision:* **PUBLISH AS ASSERTION**.
  *   **Why:** The checklist treats "Cost of Error" as "Harm from being wrong." The Editor weighs "Harm from Inaction." If the newsletter's mission is to drive preparation, the utility of the assertion outweighs the epistemic risk. The checklist lacks a "Utility-of-Truth" variable.

  ---

  ## Limitations: What This Procedure Cannot Do

  1.  **Detect Consensus Quality:** It measures statistical calibration, not scientific consensus. A group of experts can be confidently wrong (calibrated together) while a lone outlier is right.
  2.  **Resolve Novelty:** It misfires on black-swans. If there is no historical data (Calibration Check), it forces a Hedge/Stop, potentially suppressing breakthrough science.
  3.  **Override Editorial Voice:** It cannot account for the newsletter's specific brand promise (e.g., "We bet on the future" vs. "We report the facts").

  \answer{The procedure's biggest blind spot is that it equates statistical reliability with scientific truth, failing to distinguish between a black-box model that is right for the wrong reasons and one that is right because it understands the mechanism.}
