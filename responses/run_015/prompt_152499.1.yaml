answer: |-
  You have conflated the value of information with the cost of commitment. Good's theorem assumes the agent retains the option to act as if the signal were never received. Your charter explicitly removes this option. The theorem states that expected utility cannot decrease if the agent maximizes over the same action space before and after the signal. You have changed the action space conditional on the signal arriving. This is not a failure of the theorem; it is a failure of your setup to meet the precondition of agency required by the theorem.

  This is not an ad hoc evasion to save the result from falsification. It isolates the source of the harm. The negative value does not arise from the bits contained in the risk score. It arises from the regulatory mandate that forces the committee to weight those bits differently than their own judgment dictates. If you tell a regulator that information hurts here, you are imprecise. The mandate hurts. The information merely reveals where the mandate bites. Distinguishing these is the practical content of the theorem. It tells the regulator that providing data is safe, but compelling its use is not.

  You ask what test distinguishes this from a genuine counterexample. The test is whether the decision rule employed after the signal is the one that maximizes expected utility given the posterior beliefs induced by that signal. In your case, it is not. The committee knows the score is miscalibrated yet must treat it as authoritative. They are forced to act suboptimally relative to their own epistemic state. That is a constraint cost, not an information cost. To call it a counterexample to Good's theorem is like calling a tax a counterexample to the law of supply and demand because it lowers volume.

  On the mathematics, there is no contest. An unconstrained expected-utility maximizer never pays to avoid a free signal. What is contested is whether this idealization carries normative weight for bounded agents or institutions riddled with internal conflict. Some argue that if an agent cannot process the signal without error, or cannot resist the urge to misuse it, the theorem is irrelevant. I maintain it remains the benchmark. If you cannot ignore the signal, you are not measuring the value of information, you are measuring the value of flexibility. Your hospital case is a classic principal-agent problem where the principal binds the agent to prevent bias, accepting a loss in calibration to gain integrity. That is a trade-off we understand, but it is not a violation of decision theory.

  The theorem tells the regulator to mandate disclosure, not usage. If the committee is free to see the score and discard it, their expected utility rises or stays flat. If they are forced to use it, you have introduced a new variable. Do not blame the signal for the shackles you placed on the hand that holds it.

  Why do you insist on treating the committee as a single agent with a coherent utility function when your own description relies on their internal bias requiring external constraint?
