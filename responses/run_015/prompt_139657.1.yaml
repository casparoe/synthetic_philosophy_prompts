  caught between **progress** and **freedom**.

  ### What I was going for

  The end words were chosen because they are the load-bearing beams of any teleological argument, whether earnest or ironic. "Progress," "freedom," and "inevitable" are the Whig holy trinity, but "forget" is the engine that drives them—you must forget the dead ends to see the line. "We" establishes the collective subject claiming the victory, and "then" provides the temporal distance required for judgment. A critic cannot dismantle the Whig narrative without using these very terms; to deny progress is to propose a different kind of progress, to deny inevitability is to claim a clearer view of contingency that itself feels inevitable. The vocabulary is the trap.

  The sestina form enacts the ratchet mechanically. In a standard paragraph, you can define a term and hold it steady. Here, the rotation shoves "progress" from a noun of state to an object of critique to a structural necessity. By Stanza 4, "we" is no longer the triumphant moderns but the trapped narrators. The form prevents resolution; you cannot escape the vocabulary because the form demands you return to it. Each stanza represents a new historiographical mode, yet the end words remain fixed, just as the historian's categories remain fixed despite changing methodologies. The rotation mimics the way a critique absorbs the thing it critiques, shifting the context but not the substance.

