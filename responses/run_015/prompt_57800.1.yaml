          *   *Core:* Rationality = Avoiding self-defeating behavior (guaranteed losses, dominated outcomes). If you can't be pumped, you're fine.
          *   *View on Roommate:* Rational (or at least, not irrational *on these grounds*). The policy blocks the exploitation. The preferences might be weird, but the *choice behavior* is safe.
          *   *Fit with Verdicts:* Fits all provided verdicts. Every verdict given involves a guaranteed loss or sub-optimal outcome (paying $5 repeatedly, losing bet money, dominated gamble, ignoring free info).

