answer: |-
  This is a classic setup in decision theory. Your professor is walking you through the **foundational arguments for Expected Utility Theory (EUT)**, specifically using **coherence arguments** (Money Pumps, Dutch Books, Dominance, Value of Information).

  Here is the breakdown of what rule she is likely running, how it applies to your roommate, and how to test it.

  ### 1. Will your professor call your roommate irrational?
  **Prediction:** **Yes.**

  **Why?**
  In standard Decision Theory classes, coherence arguments (like the money pump) are taught as the *justification* for the axioms (like Transitivity), not as the *definition* of rationality itself.
  *   **The Axiomatic View:** Rationality requires your preferences to satisfy the Von Neumann-Morgenstern (vNM) axioms. Transitivity is one of those axioms. If your preferences are cyclic ($A \succ B \succ C \succ A$), you violate the axiom. The fact that your roommate has a "policy" that prevents the *consequence* (losing money) is seen as a lucky patch, not a cure. It's like driving drunk but getting home safely; the behavior was still irrational because the *structure* of the decision-making was flawed.
  *   **The Policy Problem:** Furthermore, standard EUT usually requires **Separability** or **Dynamic Consistency**. Her policy ("never do more than one swap") restricts her future choices based on past actions rather than current state and preferences. If North becomes available again, and she truly prefers North to Co-op, standard theory says she *should* swap. Refusing to do so because of an arbitrary "one swap" rule is often viewed as a violation of rational choice itself.

  ### 2. What rule is your prof running? (And what are the alternatives?)

  You need to distinguish between two main interpretations of "Coherence." Both fit her verdicts so far, but they diverge on the roommate.

  #### **Rule A: Structural/Axiomatic Coherence (The Standard EUT View)**
  *   **The Rule:** An agent is rational if and only if their preferences and beliefs satisfy specific logical axioms (Transitivity, Probabilism, Independence, etc.).
  *   **Why it fits her verdicts:**
      *   Cyclic preferences violate Transitivity.
      *   Dutch Books violate Probabilism.
      *   Dominated choices violate the Dominance Axiom.
      *   Ignoring info violates the "Good Theorem" (derived from EUT).
  *   **Prediction for Roommate:** **Irrational.** Her preferences violate Transitivity. The policy is irrelevant to the *structure* of her preferences.

  #### **Rule B: Pragmatic/Instrumental Coherence (The "No-Loss" View)**
  *   **The Rule:** An agent is rational if and only if their decision procedure avoids guaranteed self-defeating outcomes (like losing money for nothing or choosing dominated options).
  *   **Why it fits her verdicts:**
      *   Every example she gave involved a *consequence*: losing cash, losing a bet, getting a worse payout.
      *   She hasn't yet given an example of someone violating an axiom *without* suffering a loss.
  *   **Prediction for Roommate:** **Rational.** She cannot be pumped. She never loses money. She never chooses a dominated option (because the policy blocks the cycle). Her preferences are weird, but her *choices* are safe.

  ### 3. What extra case should you bring to Office Hours?

  To distinguish Rule A (Axioms) from Rule B (Pragmatics), you need a case where the **axiom is violated** but the **pragmatic loss is impossible**.

  **The "Desert Island" Case:**
  > "Professor, imagine an agent with cyclic preferences ($A \succ B \succ C \succ A$) who lives on a desert island. There is no market, no other people, and no possibility of trading or swapping goods. They simply enjoy A more than B, B more than C, and C more than A in their head. They never make a choice that leads to a loss because no trades are possible.
  >
  > **Is this agent irrational?**"

  **How to interpret her answer:**
  *   **If she says "Yes, Irrational":** She holds **Rule A (Structural)**. Rationality is about the internal consistency of your mind/preferences, regardless of whether you ever get exploited. The Money Pump is just a way to *show* us why Transitivity matters, but Transitivity is required even without the pump.
      *   *Implication for Roommate:* Your roommate is definitely irrational.
  *   **If she says "No, Rational":** She holds **Rule B (Pragmatic)**. Rationality is purely about avoiding bad outcomes. If there's no risk of a money pump, cyclic preferences are permissible.
      *   *Implication for Roommate:* Your roommate is rational (her policy ensures no pump is possible).

  ### 4. A Second Test Case (The "Costly Policy" Check)

  If you want to be thorough, ask about the policy itself. Standard EUT often views self-binding policies as suspicious unless there is a cost.

  **The "Costly Self-Bind" Case:**
  > "Suppose my roommate has to pay a $1 fee to maintain her 'One Swap' policy (like a contract). She pays the $1 to ensure she never enters a money pump cycle that would cost her $5. Is paying the $1 rational?"

  *   **Rule A (Standard EUT):** Might say **Irrational**. You shouldn't have cyclic preferences in the first place. Paying to fix a broken preference structure is admitting fault. Ideally, you should just fix the preferences.
  *   **Rule B (Pragmatic):** Will say **Rational**. Paying $1 to save $5 is a dominant strategy. It shows she is instrumentally rational even if her base preferences are not.

  ### Summary Advice for the Midterm
  Based on the phrasing "coherence arguments **for** maximizing expected utility," she is likely teaching the **Standard EUT (Rule A)** framework. In this framework, the Money Pump is the *argument for* the Transitivity Axiom. Once the Axiom is established, violating it is irrational *per se*, even if you dodge the pump.

  **Study Tip:** When answering exam questions, assume **Transitivity is a hard requirement**. If a question describes cyclic preferences, label them "irrational" even if the character has a workaround, unless the question specifically asks about "resolute choice" or "policy constraints" (which is usually advanced material).

  **Office Hours Strategy:** Bring the **"Desert Island"** case. It is the cleanest way to ask: *"Is rationality about the map (preferences) or the territory (outcomes)?"* Her answer will tell you exactly how to grade your roommate on the midterm.
