      *   *Prediction:* A standard EUT prof will likely call her **irrational**. Why? Because the *preferences* violate Transitivity. The policy is a separate mechanism that masks the irrationality but doesn't cure the underlying incoherence. The policy essentially acts as a "tie-breaker" or external constraint, implying the preferences themselves don't determine choice, which violates the representation theorem.

