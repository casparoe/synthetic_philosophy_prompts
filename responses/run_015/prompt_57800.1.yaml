      *   *Verdict 3 (Diachronic Pump):* This is the *Dynamic Dutch Book* or *Reflection Principle* argument. Irrationality is dynamic inconsistency.
      *   *Verdict 4 (Dominance):* This is the *Dominance Principle*. Irrationality is choosing an option strictly worse than another.
      *   *Verdict 5 (Value of Info):* This is the *Good Theorem* (Blackwell). Irrationality is failing to maximize expected utility by ignoring free info.

      *   *Common Thread:* All these are **Instrumental/Pragmatic Coherence Arguments**. They define rationality as avoiding strategies that lead to guaranteed losses or sub-optimal outcomes *relative to the agent's own goals/preferences*. They are mostly consequentialist in flavor (focus on outcomes like losing money or getting dominated results).

