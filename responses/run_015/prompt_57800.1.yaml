      *   **Rule A: Standard Expected Utility Theory (The "Axiomatic" View).**
          *   *Core:* Rationality = Satisfying the Von Neumann-Morgenstern (vNM) axioms (Completeness, Transitivity, Independence, Continuity).
          *   *View on Roommate:* Irrational. Transitivity is a requirement for representing preferences as a utility function. The money pump is just an *illustration* of why transitivity matters, not the *definition* of the violation.
          *   *Fit with Verdicts:* Fits all. Dominance, Value of Info, and Dutch Books all follow from EUT.

