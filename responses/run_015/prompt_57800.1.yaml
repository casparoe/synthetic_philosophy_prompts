prompt: |-
  so im in this decision theory class this semester and im trying to figure out my prof before the midterm. shes really into coherence arguements for maximizing expected utility but i cant tell what she actually means by coherence.

  her verdicts so far:

  she said a guy with cyclic preferences over three internships who will pay like five bucks each time to trade up is definately irrational because you can pump him back to where he started minus cash;

  she said someone whose betting prices add up to more than the guaranteed payout, like theyll buy bets on both sides that lose money no matter what happens, is irrational;

  she said someone who makes a plan and then flips on it with no new info in a way that lets you sell them two opposite trades for a guaranteed profit, like a diachronic pump on updating, is irrational;

  she said picking a gamble when theres another available gamble that gives you a better payout in every state is irrational;

  she said turning down costless relevant info before you have to choose, when you understand the info and theres no catch, is irrational.

  now the new case is my roommate. she has straight up cyclic preferences over housing for next year, she prefers North campus to South to off-campus co-op to North again, and shes clear about it, its not a mistake. but she also has this hard personal policy where she will never pay a fee to swap housing assignments and she will never do more than one swap total, so you literally cannot pump her. she just picks whichever is available and sticks with it.

  do you think my prof will call my roommate irrational? im less interested in whether shes really irrational than in what rule my prof seems to be running, what other rules fit all her verdicts so far just as well, and what each rule predicts about my roommate. and what extra case should i bring to office hours that would best tell those rules apart?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

