          *   Scenario: Cyclic preferences over outcomes where no trading is possible (e.g., ranking three paintings on a wall you can't move).
          *   If Prof says "Irrational": She holds the **Axiomatic/Constitutive View** (Transitivity is a logical requirement).
          *   If Prof says "Rational": She holds the **Pragmatic/Instrumental View** (Only matters if it affects decisions/outcomes).
      *   *Refining the Test Case:* The roommate case is already a "No-Stakes" cycle effectively (because of the policy). We need something that isolates the *preferences* from the *choice rule*.
      *   *Proposed Case:* **The "Indifferent Trader"**. Someone with cyclic preferences who is *indifferent* to trading. They don't prefer A to B strongly enough to act.
