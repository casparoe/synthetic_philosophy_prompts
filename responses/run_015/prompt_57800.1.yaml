          *   *View on Roommate:* Irrational. Cyclic preferences are logically incoherent like believing $A > B$ and $B > A$ simultaneously.
          *   *Fit with Verdicts:* Fits all provided verdicts, but usually relies less on the "losing money" aspect and more on the "contradiction" aspect. However, profs often use money pumps to *teach* this.

