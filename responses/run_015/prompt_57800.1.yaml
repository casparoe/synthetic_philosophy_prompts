          *   *Prediction:*
              *   Axiomatic Prof: Irrational (Preferences are incoherent).
              *   Pragmatic Prof: Rational (No negative consequences).
      *   *Wait, I need to be careful.* The prompt says she's into "coherence arguments *for* maximizing expected utility." This usually implies the **Representation Theorem** approach. The Representation Theorem requires Transitivity. If you violate Transitivity, you cannot be represented as maximizing EU. Therefore, you are not an EU maximizer. If the class is "Decision Theory" and the goal is EUT, violating an axiom usually = Irrational.
      *   *However*, the specific focus on *coherence arguments* (Money Pumps, Dutch Books) suggests she justifies the axioms via these pragmatic arguments.
      *   *The "Roommate" is a classic counter-example to the Money Pump argument known as "Resolute Choice" or "Policy Constraints."*
      *   *Most EUT professors will bite the bullet and say the preferences are irrational regardless of the policy.* The policy is an ad-hoc fix.
      *   *So, what distinguishes the views?*
          *   View 1 (Standard EUT): Preferences must be transitive. Policy doesn't save you.
          *   View 2 (Pragmatic/Instrumental): Only exploitability matters. Policy saves you.
      *   *Test Case:* **The "Costly Self-Binding" Case.**
          *   Suppose the roommate has to pay $10 to *maintain* her "no-swap policy" (e.g., a contract fee).
