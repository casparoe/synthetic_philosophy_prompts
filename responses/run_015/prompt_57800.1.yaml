      *   This leans heavily towards **Pragmatic Coherence (Rule B)** *OR* **Standard EUT where Money Pumps are the justification (Rule A)**.
      *   *Crucial Distinction:* Does she think the *preferences* are the problem, or the *exploitability*?
      *   Most decision theory profs teaching EUT hold the **Axiomatic View (Rule A)**. They teach money pumps as the *reason* to accept Transitivity. If you have cyclic preferences, you *are* irrational, even if you happen to have a shield (the policy) that prevents the pump *this time*. The shield itself might be seen as an admission that the preferences are dangerous.
