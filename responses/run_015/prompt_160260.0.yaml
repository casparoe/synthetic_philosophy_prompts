answer: |-
  # ETHICS AND PUBLIC LIFE: THE DIRTY HANDS DECISION TREE
  **First-Year Seminar Handout**

  ### HOW TO USE THIS TREE
  Start at **Node 1**. Answer **Yes** or **No** based on your intuition about the case presented. Follow the arrow to the next node or to a final **Position Leaf**. There are seven questions. Your path reveals your underlying ethical framework.

  ---

  ### THE BRANCHES (NODES)

  **NODE 1: The Minister vs. The Mayor**
  *A Minister does nothing and allows preventable deaths; a Mayor authorizes a raid she knows will likely get someone killed.*
  **Q:** Is the Minister (omission) less blameworthy than the Mayor (commission)?
  *   **YES** → Go to Node 2
  *   **NO** → Go to Node 3

  **NODE 2: The Legislator vs. The Strategist**
  *A Legislator votes for a flawed bill to block a worse one; a Campaign Strategist quietly benefits from a supporter's smear.*
  **Q:** Is the Legislator's compromise cleaner than the Strategist's complicity?
  *   **YES** → Go to Node 3
  *   **NO** → Go to Node 4

  **NODE 3: The Office Authority**
  *Consider the Mayor's raid again.*
  **Q:** Does holding office make this act permissible in a way it would not be for a private citizen?
  *   **YES** → Go to Node 5
  *   **NO** → **LEAF A: Ordinary Moral Conflict**

  **NODE 4: The Refusal**
  *An official refuses the dirty act, but a worse successor immediately takes the job.*
  **Q:** Is refusal still mandatory even if the successor makes things worse?
  *   **YES** → **LEAF B: Refusal Required**
  *   **NO** → Go to Node 5

  **NODE 5: The Punishment**
  *The official did something morally forbidden to avert a disaster.*
  **Q:** Should the official still be punished, removed, or demand their own removal afterward?
  *   **YES** → **LEAF C: Act Justified, Agent Guilty**
  *   **NO** → Go to Node 6

  **NODE 6: The Civil Servant's Leak**
  *A civil servant leaks info to derail a lawful policy she believes is unjust.*
  **Q:** Is the leak wrong primarily because it was done covertly?
  *   **YES** → **LEAF D: Publicity Requirement**
  *   **NO** → Go to Node 7

  **NODE 7: The Institutional Design**
  *Reflect on all the cases above.*
  **Q:** Is the real problem that the institution allows this choice, rather than the person making it?
  *   **YES** → **LEAF E: Institutional Dissolution**
  *   **NO** → **LEAF F: Office Permissions (No Guilt)**

  ---

  ### THE POSITIONS (LEAVES)

  | Leaf | Position Name | Most Awkward Commitment | Public Treatment of Official |
  | :--- | :--- | :--- | :--- |
  | **A** | **Ordinary Moral Conflict** | Ignores the special burden and unique powers of public office. | Judge exactly as you would a private citizen (Praise or Punish). |
  | **B** | **Refusal Required** (Absolutist) | Allows a worse successor to cause greater harm to preserve integrity. | Praise integrity, but remove from office for ineffectiveness. |
  | **C** | **Act Justified, Agent Guilty** (Walzerian) | Requires the agent to do wrong to be good, then suffer for it. | Praise the outcome, but demand confession or punishment. |
  | **D** | **Publicity Requirement** (Democratic) | Implies some necessary security secrets are inherently immoral. | Tolerate the act only if publicly confessed and debated. |
  | **E** | **Institutional Dissolution** (Structuralist) | Exonerates the agent too easily by blaming the system entirely. | Suspend the official; focus energy on reforming the institution. |
  | **F** | **Office Permissions** (Realist) | Suggests morality binds rulers differently than the ruled. | Tolerate and retain if effective; do not demand guilt. |

  ---

  ### ANALYTICAL NOTES FOR DISCUSSION

  #### 1. Inseparable Leaves
  **Status:** *All required leaves are logically distinct in this tree.*
  However, **Leaf D (Publicity)** and **Leaf F (Office Permissions)** are neighbors. If a Realist (F) argues that "publicity is just a tool for stability," they may end up in the same practical place as the Publicity theorist (D) without sharing the moral commitment to transparency. The tree separates them based on *why* secrecy is judged (inherently wrong vs. pragmatically risky).

  #### 2. Unoccupied Answer-Combinations
  There are $2^7 = 128$ theoretical paths, but most are empty. Two notable unoccupied combinations include:

  *   **The "Martyr-Bureaucrat" (Node 3=YES, Node 4=YES, Node 5=YES):**
      *   *Path:* Office grants special power + Must refuse even if successor is worse + Must be punished anyway.
      *   *Diagnosis:* **Incoherent.** If refusal is mandatory regardless of consequences (Absolutism), the special power of the office is irrelevant. If the office grants special permission, refusal shouldn't be mandatory. Holding all three creates a contradiction where the agent is punished for using a power they were forbidden to use.
  *   **The "Guilty Structuralist" (Node 5=YES, Node 7=YES):**
      *   *Path:* Agent should be punished + The institution is to blame.
      *   *Diagnosis:* **Unattractive/Unexplored.** While logically possible, few theorists argue we should punish the individual *and* claim the system is solely at fault. Usually, if the system is broken (Structuralist), punishing the symptom (the agent) is viewed as unjust scapegoating. This position is rarely defended because it undermines the structural critique.

  #### 3. Design Logic
  This tree prioritizes the **status of the office** (Node 3) as the primary divider. If the office confers no special moral status, we collapse into private morality (Leaf A). If it does, we must decide whether the agent must refuse (Leaf B), suffer (Leaf C), hide (Leaf D), be excused (Leaf F), or be bypassed by reform (Leaf E). This ensures the "Dirty Hands" problem is treated as a distinct *political* dilemma, not just a hard moral choice.
