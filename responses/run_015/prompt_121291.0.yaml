answer: |-
  *   **Header:** Establishes the Office for Speculative Harm (OSH) and the ministerial concession to Expected Value (EV) maximisation.
  *   **Clause 1 (Probability Floor):** Mandates acceptance of non-zero priors for hyper-existential claims, satirising the impossibility of proving negatives.
  *   **Clause 2 (Leverage Discount):** Implements the 'many claimants' objection as an administrative divisor; if anyone can affect N beings, individual causal power is 1/N.
  *   **Clause 3 (Symmetry):** Treats threats (muggers) and promises (optimists) identically, highlighting the vulnerability to positive infinity claims.
  *   **Clause 4 (Budgeting):** Introduces a lottery mechanism to apportion finite funds across infinite liabilities, mocking the summation problem.
  *   **Glossary:** Defines 'Hyper-Astronomical' and 'Mugging Event' in dry bureaucratic terms.
  *   **Impact Assessment:** Acknowledges fiscal insolvency as a compliant outcome of rational choice theory.
  *   **Consultation Question:** Asks stakeholders how to weight competing infinities without violating linearity.

  ***

  **Office for Speculative Harm: Draft Framework for Unbounded Claims**
  **Consultation Reference: OSH-2024-EV**

  **1. Purpose and Scope**
  1.1 Following the Treasury's acceptance that expected utility functions are unbounded and subjective probabilities cannot be rigorously reduced to zero, Her Majesty's Government seeks views on the administrative implementation of Pascalian claims.
  1.2 All departments must now prioritise claims involving hyper-astronomical utilities over mundane domestic concerns, provided the probability exceeds the epistemic floor of $10^{-50}$.

  **2. The Leverage-Discount Rule**
  2.1 To address the proliferation of identical claims, the OSH introduces a Leverage-Discount Factor (LDF).
  2.2 Where a claimant asserts the capacity to affect $N$ sentient entities, the claimed utility shall be divided by $N$, on the grounds that any other agent could theoretically make an identical claim upon the same causal chain.
  2.3 Claimants must submit evidence of unique causal leverage. Failure to demonstrate exclusivity will result in the claim being treated as one of $\infty$ competing petitions, reducing the expected value to negligible levels. This ensures value-for-money without violating the non-zero probability mandate.

  **3. Symmetrical Treatment of Threats and Promises**
  3.1 In accordance with decision-theoretic linearity, threats of vast harm and promises of vast benefit shall be processed identically.
  3.2 A demand for £5 to prevent the simulation of $3 \uparrow\uparrow\uparrow 3$ tortured souls shall be ranked equally against a request for £5 to generate $3 \uparrow\uparrow\uparrow 3$ units of hedonic welfare.
  3.3 Claimants are advised that while the Treasury acknowledges the dominance of these expected values, liquidity constraints necessitate the protocol outlined in Clause 4.

  **4. Budgetary Apportionment and Lottery**
  4.1 As the sum of all valid Pascalian claims exceeds the Gross Domestic Product by several orders of magnitude, funds will be allocated via a Weighted Existential Lottery.
  4.2 Each valid claim receives a ticket proportionate to its discounted expected utility.
  4.3 Winners will be notified within 6–8 aeons. Unsuccessful claimants are reminded that the probability of their specific scenario obtaining was inherently infinitesimal, and thus no harm has been incurred.

  **Glossary**
  *   **Hyper-Astronomical:** Any number exceeding the count of atoms in the observable universe, often expressed in Knuth's up-arrow notation.
  *   **Mugging Event:** Any interaction where a low-probability, high-utility claim dominates standard cost-benefit analysis.
  *   **Epistemic Floor:** The minimum probability assignable to any coherent proposition, currently set at 'conceivability'.

  **Impact Assessment**
  5.1 **Fiscal:** Full compliance implies immediate sovereign default, as liabilities are infinite.
  5.2 **Operational:** Civil servants must process claims regarding timeline alteration alongside planning permissions.
  5.3 **Risk:** Failure to pay a mugger may result in infinite negative utility; however, paying all muggers results in certain finite bankruptcy. The OSH assesses the latter as preferable due to the Leverage-Discount.

  **Consultation Question**
  6.1 Given two claims of infinite expected value, what discount rate should be applied to distinguish between them without reintroducing a utility cap?

  **Deadline for responses:** 31st December, or the end of the current simulation cycle, whichever comes first.

