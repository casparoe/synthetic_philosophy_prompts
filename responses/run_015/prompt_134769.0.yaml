answer: |-
  **Concept Title:** The Retrospective Anchor (or "The Ghost Weight of Culled Branches")

  **The Scenario:**
  Your character, Kael, is in a high-stakes negotiation. He is holding a physical token—a heavy, intricate key—that he must either hand over to the antagonist or drop into a shredder. It's a binary moral choice: Betrayal (Handover) or Sacrifice (Shred).

  **The Loom Mechanics (What Actually Happens):**
  The Loom spins 400 micro-drafts of the next three seconds.
  *   **380 Drafts:** Kael's hand trembles, he hesitates, then drops the key into the shredder.
  *   **20 Drafts:** Kael's hand is steady, he feels a surge of cold pragmatism, and he hands the key to the antagonist.

  Due to a subtle heuristic in the collective's survival algorithm (perhaps keeping the antagonist alive yields higher statistical survival for the network), the **20 "Handover" drafts win**. The 380 "Shred" drafts are culled. The memory implants immediately stitch the "Handover" continuity into Kael's permanent stream.

  **The Cartesian Mistake (What Kael Experiences):**
  Kael does not feel like a statistical outcome. He feels like a **Sovereign Observer**.

  He experiences the moment as if he were standing behind his own eyes, weighing the options on a mental scale. He feels the *urge* to shred the key (the residual data from the 380 losing drafts), and he feels himself *overriding* that urge with a act of will.

  He says: *"I wanted to destroy it. I felt the weight of it in my palm, the moral imperative to end this. But I looked at him, I calculated the cost, and **I chose** to give him the key. I overruled my own instinct."*

  He believes there is a "He" separate from the "Instinct." He believes he is the pilot who grabbed the stick from the autopilot. In reality, there was no pilot. There was only the winning draft that *included* the sensation of hesitation as a narrative feature.

  **The Specific Weirdness (The "Tell"):**
  The glitch that hints at the truth is **Phantom Motor Fatigue.**

  When Kael pulls his hand back after handing over the key, his forearm muscles ache with a specific, burning lactic acid buildup. It is the exact muscle fatigue associated with the *forceful downward motion* of dropping the key into the shredder—a motion he **did not make** in the winning timeline.

  In a standard Cartesian model, this is impossible. You cannot tire muscles from an action you didn't take.

  But Kael rationalizes this away to protect the illusion of the Central Self. He thinks: *"My muscles are tense because I was fighting myself. The physical ache is the somatic cost of my moral struggle."*

  He mistakes the **bleed-over from dead timelines** (the 380 versions of himself that did drop the key) for **psychosomatic stress** in the living timeline. He interprets the ghost memory of the culled selves as evidence of his own agency, reinforcing the belief that a central "I" was there to struggle, rather than realizing the "struggle" was just the noise of the losing drafts dying.

  **Why this works for your novel:**
  1.  **It weaponizes introspection:** The more Kael analyzes his feelings to prove he has free will, the more evidence he finds (the ache, the hesitation), but that evidence is actually proof of the opposite.
  2.  **It fits the "No Central Screen" rule:** There is no place where the decision was watched. The decision *was* the selection of the draft. The "watcher" is generated post-hoc.
  3.  **It's visceral:** It moves the philosophical problem out of the abstract and into the character's physical body (the burning arm).
