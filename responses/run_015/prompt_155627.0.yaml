answer: |-
  You have identified two distinct failure modes in how people (including you) misuse the outside view. Your first hypothesis addresses the **Inside View** (when to trust a specific causal story). Your second hypothesis addresses the **Outside View** (how to construct the reference class). They are not conflicting rules; they are the two gates through which any prediction must pass to escape the default base rate.

  Here is the unified principle, tested against your cases, with the required extensions.

  ### The Principle of Empirical Grounding

  **Rule:** You may deviate from the broad base rate for a class of events only if the deviation is grounded in empirical data rather than theoretical plausibility. This applies to both the causal mechanism (Inside View) and the reference class selection (Outside View).

  **Clause 1: The Mechanism Gate (Inside View)**
  Accept an inside-view deviation only if the claimant cites mechanistic evidence that has been **partially observed** and will be **fully scored** on a time horizon significantly shorter than the total prediction window.
  *   *Motivating Case:* The Lab Director. You accept the shot-rate doubling (mechanism: new power supply; observed: run at half power; scored: next year) but reject the net-energy claim (mechanism: theoretical; observed: nothing; scored: three years).
  *   *Rationale:* An inside view is only valid when it is effectively a high-resolution outside view of the immediate future. If the mechanism cannot be scored soon, it is storytelling, not data.

  **Clause 2: The Tabulation Gate (Reference Class)**
  Narrow a reference class only along dimensions where **unbiased outcome frequencies** are tabulated. Never narrow along dimensions that are merely asserted reasons for success, even if they seem logically relevant.
  *   *Motivating Case:* The Writer vs. The Institute. You narrow for the writer (dimension: "this specific person"; data: 4 books, 4 dates) but refuse to narrow for the institute (dimension: "well-funded"; data: none, only the assertion that funding helps).
  *   *Rationale:* Features that correlate with success (like funding) are often the very features that inflate confidence. Unless you have a table showing the success rate of "well-funded projects" vs. "poorly-funded projects," narrowing by funding is just inside-view storytelling disguised as statistics.

  **Clause 3: The Distribution Clause (Heavy Tails)**
  If the reference class distribution is known to be heavy-tailed (power law), reject the mean in favor of a high-percentile estimate (e.g., 80th) to account for ruinous outliers.
  *   *Motivating Case:* The Transit Tunnel. You reject the average overrun because one massive failure skews the mean, and you want to know the "likely worst case," not the "mathematical average."

  ---

  ### Application to New Cases

  To test the principle's cold applicability, here are verdicts on two cases not in your original list:

  **Case A: The Climate Modeler**
  A lead modeler tells you their new simulation will predict global temperature rise within 0.1°C of reality by 2050 because they have "fixed the cloud physics parameterization."
  *   **Verdict:** Reject the specific claim; use the base rate of past model accuracy.
  *   **Application:** Fails Clause 1. The "fixed physics" are not partially observed in the wild (the clouds haven't behaved yet) and will not be scored for decades. Fails Clause 2. There is no tabulated data for "models with fixed cloud physics" (this is a theoretical dimension, not a historical one).

  **Case B: The Veteran Quarterback**
  A quarterback with a 10-year career says he will throw 40 touchdowns this season because he "has a better feel for the offense" than last year.
  *   **Verdict:** Accept his personal base rate (average of last 3 years), ignore the "feel" claim.
  *   **Application:** Fails Clause 1. "Feel" is not a scored intermediate milestone. Passes Clause 2. You have tabulated outcomes for "this specific player" (n=10 years). You narrow the class to *him*, but you do not narrow further to "him when he has a good feel," because that dimension is not tabulated.

  ---

  ### The Forced Overturn

  Every principle demands a sacrifice. The case your principle forces you to overturn is the **AI Researcher**.

  *   **Your Intuition:** You want to adjust the base rate because "agreeing to be interviewed" selects for confidence, but you admit you have no data for the class "people who agree to be interviewed."
  *   **The Principle's Verdict:** You must use the **broadest available base rate** (all public AI timelines) and treat the selection bias as unquantifiable uncertainty.
  *   **Why:** You are violating Clause 2. You *believe* the dimension "interview consent" matters, but you possess no outcome counts for it. To create a subclass without data is to manufacture precision. The principle forces you to be less clever: you must report the general base rate and add a qualitative footnote about selection bias, rather than mathematically adjusting for a ghost class. This feels uncomfortable because it leaves the bias uncorrected, but it prevents you from correcting it *wrong*.

  ---

  ### Verdict on the Second-Startup Friend

  This is the case where your intuition oscillates. Here is the cold application:

  1.  **Check Clause 1 (Mechanism):** Has she already achieved partial milestones for *this* startup that will be scored soon? If no, her story about "why this one is different" is discarded.
  2.  **Check Clause 2 (Tabulation):**
      *   *Dimension: "Second-time Founder".* You note statistics exist but are "selected on outcome." This implies survivorship bias (only winners become second-time founders). Therefore, these are not *unbiased* outcome frequencies. **Fail Clause 2.** You cannot narrow to this class.
      *   *Dimension: "Her Own Record".* Sample size n=1. While tabulated, n=1 is statistically indistinguishable from noise in high-variance domains like startups. **Fail Clause 2** (insufficient power).
  3.  **Final Verdict:** You must use the **General Founder Base Rate** for the timeline.
  4.  **Nuance:** You may use her exited status to adjust the *probability of eventual success* slightly upward (she is not a random person), but you cannot use it to compress the *timeline*. The base rate for "how long successful startups take" applies. Her confidence is treated as inside-view noise.

  ---

  ### The Modesty Limit (The Mechanic Problem)

  You ask where modesty stops. If you apply the outside view to your own "this time is different" judgments, do you become paralyzed? The mechanic observes a worn clutch and overrides the car's reliability base rate. Why is this allowed?

  The stopping point is **Calibration History**, and it is embedded in Clause 2.

  The mechanic is not actually using an "Inside View." He is using a highly compressed Outside View. He has seen 10,000 clutches. He has a tabulated mental database of "sound X leads to failure Y." His judgment is grounded in empirical frequency, not theory.

  *   **The Limit:** Modesty stops when the estimator has a **tabulated calibration record on that specific type of judgment.**
  *   **Application to You:** You can trust your own feature timelines (as you do) because you have n=40 pieces. You have a calibration record. You *cannot* trust your judgment on "when AI will arrive" because you have n=0 on AI arrivals.
  *   **Application to the Mechanic:** He has n=10,000 on clutches. He passes Clause 2.
  *   **Application to the Founder:** She has n=1 on startups. She fails Clause 2.

  Therefore, the principle does not demand global modesty. It demands **domain-specific modesty.** You are allowed to be arrogant where you have data (your writing, the mechanic's repair) and must be modest where you have only stories (fusion, AI, startup timelines).

  ### Summary for Your Piece

  The rule you are looking for is not "Trust the Outside View." It is **"Trust the Data, Not the Story."**

  Sometimes the data is the base rate (Outside View). Sometimes the data is the partial milestone (Inside View). Sometimes the data is your own track record (Narrowed Class). But if the justification relies on a feature you cannot count (funding, confidence, cloud physics), you must revert to the broadest base rate available. The discomfort you feel is the friction of discarding plausible stories that lack empirical grounding. Keep the friction. It is the only thing keeping you honest.
