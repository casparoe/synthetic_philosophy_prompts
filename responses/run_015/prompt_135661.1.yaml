prompt: |-
  I TA'd the trolley section of our intro ethics course this spring and it went badly, not because the students were obtuse but because every time they pushed on a variant I found myself reaching for a different principle, and by the end I genuinely couldnt tell whether I had a view or just a pile of case verdicts. I'm trying to write down where I've landed before I run the section again in the fall, and I want you to audit the package as a whole rather than explain the doctrine of double effect to me — I know the textbook version, the intending/foreseeing bit, the proportionality bit, all of that. Here's the set, roughly in the order I noticed myself committed to it:

  (1) The standard pair: flipping the switch so the trolley kills one on the side track instead of five on the main line is permissible; shoving the fat man off the footbridge so his body stops the trolley is not. I think that's a real moral difference, not just a quirk of our psychology that we should debunk and move on from.
  (2) What explains it is the clause about means — the death must not be what's doing the work in producing the good outcome. I want that to be a claim about the causal structure of the action, and I'm suspicious of leaning on what the agent "really" has in mind; two agents could have identical mental states and I'd still want to say the cases differ.
  (3) I think the doing/allowing distinction is junk — killing and letting die differ in no moral way as such, and I don't think that distinction is secretly what's separating my verdicts in (1).
  (4) The loop variant, where the side track curves back around so that switching only helps if something stops the trolley, and the only thing that will stop it is the body of a fat man stuck on that track. I'm fairly confident it's still permissible to switch, and I want to keep that even if we stipulate that a merely unconscious body sprawled on the rails wouldn't do the job — it's the business of his being crushed under it that stops it.
  (5) A case I invented specifically to annoy myself and now can't let go of: a precision strike on a munitions factory; children living nearby will die; and part of how the strike ends the war is that the grief over those deaths breaks the enemy's will to fight. So the deaths are genuinely on the causal route to the good outcome, they aren't just foreseen alongside it. My gut says this is no different from ordinary strategic bombing where the deaths are pure side effects, i.e. permissible. But on the clause in (2) their deaths look like a means, which should sink it — and every way I've tried of softening "means" enough to rescue (5) seems to also rescue shoving the fat man in (1), which I don't want.
  (6) Numbers matter to me: other things equal I ought to minimize deaths, and five-versus-one is a big part of why I flip the switch at all.
  (7) The transplant case — surgeon kills the one healthy patient for his organs to save five — is impermissible, but I think that's not really a double-effect thing at all; it's about her role. She has a job and that isn't it.

  So: which of these are actually in tension, and how badly? Please rank the real tensions by severity rather than listing them all as equally awful, and for each one say what exactly has to give and what that costs me somewhere else in the set — in particular, if the cheapest repair for (5) breaks (1) or (4), say that explicitly. Also flag the pairs that only look like they conflict and say why they don't, because I've started to suspect I'm flagging tensions that aren't there and walking straight past the one that is. If there's a single revision that cleans up more than one of these at once, tell me which. And one specific worry: I keep thinking (3) is where the trouble is, since rejecting doing/allowing usually comes bundled with a much more outcome-focused outlook than the one I need for (1) and (2) — someone in the department muttered that there's some decades-old paper that runs exactly that combination, but I can't place it and I don't want to lean on a reference I can't check, so just tell me whether the combination actually holds up on its own terms.
reasoning: |-
  Here's a thinking process that leads to the suggested audit:

  1.  **Analyze the User and Request:**
      *   **User:** A TA for an intro ethics course (likely grad student or advanced undergrad). They taught the trolley problem section, found their own intuitions inconsistent/unprincipled, and are now trying to systematize their views before teaching again.
      *   **Task:** Audit their set of 7 committed claims/principles. Identify tensions, rank them by severity, explain what has to give and the cost, identify false alarms, and suggest single revisions if possible.
      *   **Constraint:** Do *not* explain the Doctrine of Double Effect (DDE) basics (they know it). Focus on the internal consistency of *their* specific package.
      *   **Specific Worry:** Is rejecting Doing/Allowing (3) compatible with their deontological constraints (1, 2)?
      *   **Tone:** Philosophical, precise, direct, respectful of their expertise (they know the literature), but critical.

  2.  **Deconstruct the 7 Claims:**
      *   (1) **Switch vs. Bridge:** Switch = Permissible. Bridge = Impermissible. (Standard Footbridge intuition).
      *   (2) **Means Constraint:** Death cannot be the *means* to the good. Causal structure matters, not mental state. (Objective DDE-ish).
      *   (3) **Doing/Allowing:** Rejected. Killing = Letting Die (morally equivalent *as such*).
      *   (4) **Loop Case:** Switching is Permissible even if the one person's body stops the trolley (causal means).
      *   (5) **Strategic Bombing/Grief:** Bombing factory, children die, grief ends war. Deaths are causal means (via grief). Intuition: Permissible (like standard collateral damage). Conflict: Violates (2).
      *   (6) **Numbers:** Minimize deaths matters (Consequentialist weight).
      *   (7) **Transplant:** Impermissible. Reason: Role obligations, not DDE.

  3.  **Identify Tensions (Brainstorming):**

      *   *Tension A: (2) vs. (4).* (2) says death can't be the means. (4) Loop Case says switching is okay *even if* the body stopping the trolley is what saves the five. In the Loop, the death (or at least the impact on the body) is causally necessary to stop the trolley. If the body wasn't there, the five die. So the one is used as a means.
          *   *Severity:* High. (4) directly contradicts the strict reading of (2).
      *   *Tension B: (2) vs. (5).* (5) admits deaths are causal means (grief breaks will). (2) says means are forbidden. User says (5) is permissible.
          *   *Severity:* High. Direct contradiction.
      *   *Tension C: (1) vs. (4).* Standard Switch vs. Loop. Many philosophers treat these as equivalent. User treats them as both permissible. This isn't a tension *between* them, but it creates tension with (2). If (4) is permissible despite the means, why is Bridge (1) impermissible? Bridge also uses the man as a means.
          *   *Severity:* Medium/High. Why is Loop okay but Bridge not, if both use the person as a means?
      *   *Tension D: (3) vs. (1)/(2).* User rejects Doing/Allowing but keeps strong constraints on *how* you kill (means). Usually, rejecting D/A pushes towards consequentialism. Can you reject D/A but keep the Means Constraint?
          *   *Severity:* Medium. It's theoretically possible (e.g., Quinn's Positive/Negative Agency), but needs care.
      *   *Tension E: (6) vs. (1)/(2)/(7).* Numbers matter, but not enough to override the Means Constraint or Role Obligations. This is a standard Threshold Deontology or Weighted Constraints view.
          *   *Severity:* Low. This is a standard hybrid view.
      *   *Tension F: (7) vs. (2).* Transplant is wrong because of *role*, not means. But in Transplant, the one *is* used as a means. Does (7) undermine (2) by offering an alternative explanation?
          *   *Severity:* Low. Compatible if multiple constraints exist.

  4.  **Rank and Analyze Tensions:**

      *   **Top Severity:** The "Means" Inconsistency. (2) claims death cannot be the means. (4) and (5) both involve deaths (or impacts on persons) functioning as means, yet are judged permissible.
          *   *Specifically:* (4) Loop Case is the killer for (2). In the Loop, the trolley hits the one *to stop* the trolley. That is using them as a means. If (4) is permissible, (2) is false as stated.
          *   *Specifically:* (5) Grief Bombing. If the *deaths* cause the grief that stops the war, the deaths are means. If permissible, (2) is false.
      *   **Second Severity:** The Bridge vs. Loop Distinction. If Loop (4) is permissible because the person is on the track (even if their bulk stops the train), why is Bridge (1) impermissible? Both use the person to stop the train. The user needs a principle distinguishing Loop from Bridge that doesn't rely on "Means" (since they accept means in Loop).
      *   **Third Severity:** Doing/Allowing (3). Does this break the system? Not necessarily. You can believe killing/letting die are structurally similar but still believe *active using* is wrong.

  5.  **Develop Solutions/Repairs:**

      *   *Fixing (2):* The user needs to refine "Means." Maybe it's not "causal means" but "opportunistic use" or "violation of a right not to be intervened upon."
      *   *The "Single Revision":* Shift from a *Causal Means* constraint (2) to a *Rights/Intervention* constraint.
      *   *Addressing (3):* The "decades-old paper" is likely Philippa Foot ("The Problem of Abortion and the Doctrine of the Double Effect") or maybe Quinn ("Actions, Intentions, and Consequences"). Actually, Foot rejects D/A distinction in some contexts but keeps constraints. Wait, the specific combo of "Reject D/A" + "Keep Constraints" is often associated with **Warren Quinn** ("Actions, Intentions, and Consequences: The Doctrine of Doing and Allowing"). Quinn distinguishes Positive vs. Negative Agency rather than Doing/Allowing. Or perhaps **Jonathan Bennett**.
      *   *Actually, the specific worry:* "Rejecting doing/allowing usually comes bundled with a much more outcome-focused outlook." This is the "Consequentialist Pressure" worry.
      *   *Answer:* It holds up if you ground the constraint in *rights* or *agency* rather than the metaphysics of action.

  6.  **Drafting the Audit:**

      *   **Introduction:** Acknowledge the sophistication of the problem. This is the "Loop Problem" + "Terror Bomber" problem.
      *   **Ranking Tensions:**
          1.  **(2) vs. (4) & (5):** The "Means" principle is empirically false relative to the user's own verdicts.
          2.  **(1) vs. (4):** If Loop is okay (means used), why is Bridge not? Need a new differentiator.
          3.  **(3) vs. The Rest:** Is it stable? Yes, but requires specific grounding.
      *   **False Alarms:** (6) is fine (Threshold Deontology). (7) is fine (Special Obligations).
      *   **The "Paper":** Likely Warren Quinn, "Actions, Intentions, and Consequences: The Doctrine of Doing and Allowing" (1989). He rejects the traditional D/A distinction but keeps a constraint on *harmful positive agency*.
      *   **The Repair:** Abandon strict Causal Means (2). Replace with a constraint on *Intervention* or *Pre-existing Threats*.
          *   *Idea:* In Switch/Loop, the threat (trolley) exists independently. In Bridge/Transplant, the agent *creates* the threat or redirects it *through* a new victim.
          *   *Wait, Loop:* In Loop, the trolley is redirected onto the one. In Bridge, the man is pushed into the trolley.
          *   *Distinction:* **Redirecting an Existing Threat vs. Introducing a New Harmful Force.**
          *   *Switch/Loop:* Trolley is already deadly. You move the trolley.
          *   *Bridge/Transplant:* Man is not deadly. You make him deadly (or use his body as a tool).
          *   *Bombing (5):* Plane/Bomb is the threat. Children are collateral. Even if their death helps, the *mechanism* of harm is the bomb, not using the children as tools *directly* in the same way as the fat man. (This is tricky, needs nuance).

      *   *Refining the Repair for (5):* The "Grief" case is the "Terror Bomber" variant. Standard DDE says Impermissible. User says Permissible. This is the hardest nut.
      *   *If User keeps (5) Permissible:* They must abandon (2) entirely.
      *   *If they abandon (2):* What stops Bridge?
      *   *Proposal:* **The "Pre-existing Threat" Constraint.**
          *   Switch/Loop: Trolley kills 5. Agent redirects *Trolley*.
          *   Bridge: Trolley kills 5. Agent pushes *Man*.
          *   Bombing: Bomb kills workers. Agent drops *Bomb*. (Grief is a downstream effect, but the *harm* is collateral damage, not the mechanism of the strike itself).
          *   *Wait, in (5) the user says:* "part of how the strike ends the war is that the grief over those deaths breaks the enemy's will." This makes them *Terror Bombers*. Standard view: Impermissible. User view: Permissible.
          *   *Conflict:* If (5) is permissible, the "Means" constraint is dead. If "Means" is dead, Bridge is hard to stop.
          *   *Solution:* Distinguish between **Using a Person's Body** vs. **Using the Fact of Their Death**.
          *   Bridge: Uses the *body* (physical bulk).
          *   Bombing (5): Uses the *death* (psychological impact).
          *   Loop: Uses the *body* (physical bulk).
          *   *Uh oh.* If Loop uses the body and is Permissible, but Bridge uses the body and is Impermissible, the distinction must be about the **Source of the Threat**.
          *   Loop: Threat (Trolley) is independent.
          *   Bridge: Threat (Trolley) is independent, BUT the Man is not on the track. You introduce him.
          *   *Better:* **The "Obstruction" vs. "Projectile" distinction.**
          *   Switch/Loop: The one is an *obstruction* on the path of the threat.
          *   Bridge: The one is a *projectile* introduced to the path.
          *   Bombing: The children are *bystanders* to the threat (bomb).
          *   *This saves (1), (4), and (5) while killing (2).*

  7.  **Finalizing the Advice:**
      *   **Severity 1:** (2) is incompatible with (4) and (5). It must go or be radically rewritten.
      *   **Severity 2:** (1) vs (4). Need to explain why Loop (body as stopper) is okay but Bridge (body as stopper) is not. Key: Pre-existing location vs. Introduction.
      *   **Severity 3:** (3). It holds up, but needs Quinn-style grounding (Positive Agency).
      *   **The Paper:** Warren Quinn (1989).
      *   **The Single Revision:** Replace (2) "Means Constraint" with a "Threat Redirection vs. New Threat" constraint.

  8.  **Review against Constraints:**
      *   Don't explain DDE basics.
      *   Rank tensions.
      *   Say what has to give.
      *   Address the (3) worry.
      *   Identify the paper.

  9.  **Self-Correction/Refinement on (5):**
      *   The user says (5) is permissible *even though* deaths are causal means. This is the "Terror Bomber" intuition. Most deontologists say Terror Bomber is wrong. If the user says it's right, they are closer to Consequentialism than they think, *unless* they distinguish between "Using the body" and "Using the death."
      *   If I tell them (2) has to die, that's the honest audit.
      *   If (2) dies, what protects (1)? The "Redirecting Existing Threat" principle.
