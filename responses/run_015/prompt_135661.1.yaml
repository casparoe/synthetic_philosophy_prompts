  10. **Final Polish:** Ensure tone is collaborative but rigorous. (e.g., "Your principle (2) is doing no work," "The Loop case eats your Means constraint for breakfast.")

  *(Self-Correction on the "Paper"):* The user mentions a "decades-old paper" about rejecting Doing/Allowing but keeping constraints. Warren Quinn is the best fit. Another possibility is Foot's later work, but Quinn is the one who systematically reconstructed DDE without relying on D/A. I will mention Quinn.

  *(Self-Correction on (5)):* The user's intuition on (5) is controversial. I need to point out that holding (5) Permissible makes them an outlier among non-consequentialists, but it's internally consistent if they drop the "Means" constraint in favor of a "Direct Harm" constraint.

