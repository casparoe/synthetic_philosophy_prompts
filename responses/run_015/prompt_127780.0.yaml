  **Exam Question**

  Consider a hypothetical penal framework termed "graded reactive accountability." Sanctions are determined solely by forward-looking criteria (deterrence, rehabilitation, incapacitation), mirroring Caruso's public-health quarantine model. However, the procedure retains a formal, symbolic acknowledgment of wrongdoing intended to preserve communal moral practice, akin to Dennett's emphasis on reactive attitudes. Evaluate whether this framework successfully reconciles Dennett's pragmatic compatibilism with Caruso's hard incompatibilism, or whether it covertly collapses into one position. Specifically, locate the exact conceptual crux: does the symbolic acknowledgment presuppose a desert claim that Caruso rejects, or can Dennett's functionalist account of moral community survive without genuine desert?

  **Model Answer**

  This framework ultimately fails to reconcile the two positions, collapsing into Caruso's hard incompatibilism while rendering Dennett's functionalism incoherent. The conceptual crux lies in the function of symbolic acknowledgment within a moral community. For Dennett, reactive attitudes like blame are not merely decorative social rituals; they are functional tools evolved to regulate social behavior among reason-responsive agents. Their efficacy depends on the target believing they deserve the sanction based on a practical ability to do otherwise. If the system admits sanctions are solely forward-looking, the symbolic acknowledgment becomes a "noble lie" rather than a genuine moral response. This undermines the trust required for moral communication.

  Caruso argues that without ultimate responsibility, desert is illegitimate. His basic argument posits that agents are never the ultimate source of their actions due to constitutive luck. Therefore, a public-health model treats dangerous agents like viruses; we quarantine them not because they are evil, but because they are dangerous. Introducing symbolic acknowledgment of wrongdoing reintroduces the language of desert without the metaphysical grounding. If the offender knows the sanction is purely preventative, the symbolic blame loses its normative force. It becomes manipulation rather than moral communication. This undermines the reciprocity required for moral agency. The offender is treated as an object to be managed, not a participant to be reasoned with.

  Dennett requires "elbow room"—the practical ability to respond to reasons—to ground responsibility. He argues this is sufficient for desert because it distinguishes between coerced and voluntary action within a naturalistic worldview. However, if the framework explicitly scales sanctions only to deterrence needs, it denies the backward-looking component essential to desert. Desert requires proportionality to the wrongful act, not the future risk. By prioritizing risk assessment over act proportionality, the framework adopts Caruso's logic exclusively. It treats the agent as a locus of risk rather than a moral participant. The "graded" nature of the accountability confirms this; grades reflect danger levels, not moral gravity.

  Furthermore, the psychological sustainability of this hybrid model is dubious. For Dennett, the reactive attitudes are deeply embedded in our evolutionary psychology; they are not easily decoupled from the belief in desert. To ask a community to express blame symbolically while believing the agent is not ultimately responsible creates cognitive dissonance. The community would either revert to genuine desert beliefs or cease to feel the reactive attitudes genuinely. The "symbolic" layer becomes hollow ritual, devoid of the emotional weight that gives moral norms their binding power.

  Additionally, the public-health analogy relies on a distinction between treatment and punishment. Caruso insists quarantine is not punishment because it lacks retributive intent. By adding symbolic acknowledgment of wrongdoing, the framework blurs this line. It looks like punishment to the offender, even if labeled otherwise. This deception harms the integrity of the legal system. If the state lies about the nature of the sanction to preserve moral practice, it treats citizens as children incapable of handling the truth about determinism. Dennett argues we can handle the truth without losing morality; Caruso argues we must change morality to fit the truth. This framework tries to do both and succeeds at neither.

  Therefore, the framework collapses into Caruso's view. The symbolic acknowledgment is exposed as instrumentalist manipulation. Dennett's functionalism cannot survive without genuine belief in the appropriateness of reactive attitudes. Participants cannot sustain a practice of blame while simultaneously believing the blame is fundamentally unjustified metaphysically. The crux is that moral practice requires truth-claims about agency. You cannot maintain the practice of blame while denying the metaphysical conditions that make blame intelligible. The framework attempts to harvest the social benefits of blame without the ontological commitment, undermining the very social practice it seeks to preserve.

  **Marking Scheme**

  1.  **Dennett's Functionalism (4 pts):** Must explain elbow room as evolutionary capacity for reason-responsiveness, not metaphysical magic. *Failure:* Treating Dennett as a libertarian compatibilist.
  2.  **Caruso's Incompatibilism (4 pts):** Must articulate the basic argument regarding luck and the rejection of ultimate responsibility. *Failure:* Confusing hard determinism with hard incompatibilism regarding free will.
  3.  **Analysis of Symbolic Acknowledgment (4 pts):** Must identify that symbolic blame implies desert claims to the agent. *Failure:* Assuming symbolism is neutral or purely expressive without normative weight.
  4.  **Identification of Conceptual Crux (4 pts):** Must locate the tension between forward-looking sanctions and backward-looking blame. *Failure:* Focusing only on practical implementation issues rather than conceptual coherence.
  5.  **Definitive Conclusion (4 pts):** Must argue whether reconciliation succeeds or collapses (collapse is stronger). *Failure:* Hedging without resolving the philosophical tension or taking a stance.
