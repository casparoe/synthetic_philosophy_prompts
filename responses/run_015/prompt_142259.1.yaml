answer: |-
  You have put your finger on the central nerve of twentieth-century metaphysics and philosophy of science. The frustration you feel is not a bug in your understanding; it is the feature that drives the entire debate between **Metaphysical Realists** and **Anti-Realists (or Pragmatists/Deflationists)**.

  There is no single, universally recognized fallacy name like *Ad Hominem* for this specific move. However, it is a well-documented tension discussed under the headers of **Underdetermination**, **Surplus Structure**, and **Truthmaker Theory**.

  Since you need a label for the pub that captures the specific "swing" from humble (we can't know) to load-bearing (this settles truth), I will coin a term for you. But first, let's map it onto the existing landscape so you know you aren't reinventing the wheel.

  ### 1. The Existing Landscape
  Your group is discussing cases of **Empirical Equivalence**.
  *   **The Setup:** Theory A and Theory B predict exactly the same observations.
  *   **The Realist Move:** Theory A posits entity $X$; Theory B does not. The Realist says $X$ *really exists*, and therefore Theory A is *fundamentally true*, while B is merely *instrumentally useful*.
  *   **The Tension:** If $X$ makes no difference to observation, how can it make a difference to truth?

  In philosophy of science, this is often called the problem of **Surplus Structure** (Reichenbach). In metaphysics, it is the problem of **Epistemically Inaccessible Truthmakers**. The specific complaint you have—that the posit is defined as out of reach and then used as a handle—is the core of the **Verificationist Critique** (Carnap, Ayer) and the **Quinean critique of modal essentialism**.

  However, none of these names capture the *rhetorical swing* you identified. They name the situation, not the move.

  ### 2. The Coinage: "The Transcendent Anchor"
  For your Tuesday group, I propose you call this move **Dropping a Transcendent Anchor**.

  **Definition:**
  A *Transcendent Anchor* is an ontological posit that is explicitly conceded to be **epistemically inaccessible** (no evidence can reach it) but is subsequently used as **ontologically load-bearing** (it settles which sentences are *really* true, which theory is *fundamental*, or which explanation *works*).

  **The Swing:**
  1.  **The Drop (Humility):** "We admit we can never detect $X$ directly. It is beyond observation."
  2.  **The Hold (Hegemony):** "However, the truth of our sentences *depends* on $X$. Without $X$, our talk is merely loose/instrumental."

  **Why it feels wrong:**
  It violates a principle of **Epistemic-ontological Parity**. If a difference makes no difference to our information state, it is unclear how it can make a difference to our truth conditions. It treats the posit as a *causal/explanatory dead end* (we can't get at it) while simultaneously treating it as a *metaphysical foundation* (it holds everything up).

  ### 3. Legitimate vs. Illegitimate Uses
  You asked for the edges. When is dropping a Transcendent Anchor acceptable, and when is it dodgy? The line is drawn at **Systematic Integration**.

  #### The Illegitimate Case: "The Isolated Ghost"
  This is the case that is bothering your group.
  *   **Scenario:** Mereological Nihilism vs. Common Sense.
      *   *View A:* There are simples arranged table-wise.
      *   *View B:* There are simples arranged table-wise *and* a further object, "The Table."
  *   **The Move:** Both sides agree on where the simples are, how they behave, and what sentences are useful ("Pass the salt"). But the Realist says, "View B is *really* true because The Table exists, even though we can't detect The Table over and above the simples."
  *   **Why it fails the test:** The posit ("The Table") is **isolated**. It does no work other than satisfying the intuition that "tables should exist." It is an *ad hoc* metaphysical addition. It is a Transcendent Anchor dropped into empty sand; it claims to hold the ship of truth, but it isn't hooked into any seabed.

  #### The Legitimate Case: "The Entangled Posit"
  Sometimes we must posit things we cannot directly observe to make sense of things we *can*.
  *   **Scenario:** Theoretical Physics (e.g., Quarks in the 1960s, or the Wavefunction in QM).
  *   **The Move:** "We cannot observe a quark in isolation (confinement). However, positing quarks explains the patterns in the cloud chamber, the scattering results, and the periodic table."
  *   **Why it passes the test:** The posit is **integrated**. Even if the specific entity is inaccessible *in principle* (or currently), it is causally and mathematically entangled with a vast web of accessible phenomena. The "anchor" isn't hanging in a void; it is hooked into a chain of other posits that *do* cash out in observation.
  *   **The Distinction:** In the legitimate case, the inaccessible posit *earns its keep* by simplifying or unifying the accessible theory. In the illegitimate case, the inaccessible posit is *costly* (it adds ontology) without *return* (it adds no predictive or unifying power).

  ### 4. How to Use This in the Pub
  When your friend makes the move—conceding the difference is undetectable but insisting it settles fundamentality—you can say:

  > "You're **Dropping a Transcendent Anchor**. You've just admitted this difference is epistemically idle. So how can it be ontologically load-bearing? Unless you can show me that this 'extra thing' is **entangled** with something we *can* measure (like the quark case), you're just anchoring your truth-claims to a phantom."

  This forces them to choose:
  1.  **Retreat:** Admit the difference is merely verbal or pragmatic (Deflationism).
  2.  **Double Down:** Argue that *fundamentality* itself is a non-empirical virtue that matters (Scientific Realism).
  3.  **Integrate:** Try to show how the "extra thing" actually simplifies the broader theory (IBE).

  ### Summary for your notes
  *   **Phenomenon:** Asserting ontological weight for an epistemically inaccessible difference.
  *   **Established Context:** Underdetermination, Surplus Structure, Truthmaker Theory.
  *   **Pub Label:** **The Transcendent Anchor**.
  *   **The Test:** **Isolation vs. Integration**. If the posit does no work other than making "exists" true, it's illegitimate. If it unifies other accessible phenomena, it's legitimate.

  You have correctly identified that the move relies on smuggling **access** back in after formally denying it. That is the "swing." Calling it out as a **Transcendent Anchor** gives you the handle to point at the mechanism.
