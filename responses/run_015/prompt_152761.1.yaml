answer: |-
  You have hit on something that many specialists suspect but rarely admit: the "Paradox of Fiction" is not a single problem, but a conflation of three distinct problems that share a vocabulary but not a solution space. Your intuition that the debate is stalled because participants are answering different exam questions is precisely correct.

  Here is a diagnosis of why the debate has been spinning since Radford's 1975 essay, why neuroimaging won't save it, and where the actual philosophical friction lies.

  ### 1. The Diagnosis: Three Parallel Arguments
  You identified that different camps care about different things (intentional objects, phenomenology, belief mechanisms). We can map this onto the logical structure of Radford's original paradox. Radford argued that the following three propositions are inconsistent, yet we assent to all of them:
  1.  We experience genuine emotions toward fictional characters.
  2.  To experience genuine emotions, we must believe the objects of those emotions exist.
  3.  We do not believe fictional characters exist.

  The "stall" exists because the three main camps you listed are each attacking a different premise, meaning they aren't arguing *against* each other so much as arguing *past* each other about which premise is the weak link.

  *   **The Pretend-Emotion Crowd (Walton):** They reject **Premise 1**. They argue the phenomenology is similar, but the ontological status is "quasi-emotion." They are playing a game of **Philosophy of Mind/Actions**. Their question is: *What constitutes a genuine emotional state?*
  *   **The Illusionists/Partial Belief:** They reject **Premise 3**. They argue that during immersion, belief is suspended or modified. They are playing a game of **Cognitive Psychology**. Their question is: *How does the belief-formation mechanism function during engagement?*
  *   **The Thought-Directed Camp (Lamarque, Carroll, etc.):** They reject **Premise 2**. They argue that existential belief is not a necessary condition for emotion; thoughts or imaginings suffice. They are playing a game of **Intentionality**. Their question is: *What is the requisite cognitive attitude for emotional directedness?*

  Because Walton is defining "emotion," the Illusionist is measuring "belief," and Lamarque is analyzing "intentionality," they can all publish papers citing Radford without ever engaging the core mechanism of the others. It is a verbal dispute masquerading as a substantive one.

  ### 2. The Empirical Red Herring
  You asked if neuroimaging could break the impasse by showing if fictional sadness activates the same circuits as real bereavement.

  **The short answer:** It would settle the phenomenology, but not the paradox.

  **The long answer:** Even if fMRI scans showed 100% overlap between grief for Anna Karenina and grief for a deceased relative, the Paradox of Fiction would remain intact for the **Thought-Directed** camp. Why? Because the paradox is not primarily about *physiology*; it is about *rationality* and *propositional content*.

  If I have a panic attack because I think there is a spider on my leg, but there is no spider, my physiological state is identical to a real threat. However, the *rationality* of my fear is still in question. The paradox is largely normative: *Is it rational to grieve what does not exist?* Neuroscience can tell us if the grief is "real" in terms of cortisol and amygdala activation, but it cannot tell us if the grief is "justified" in terms of propositional attitude.

  Furthermore, empirical data might actually hurt the **Pretend-Emotion** theory (Walton). If "quasi-emotions" involve the same hormonal release, tear ducts, and neural pathways as "real emotions," the distinction becomes biologically idle. But Walton could simply retreat and say, "Even if the biology is identical, the *functional role* in the cognitive architecture is different (one leads to action, one does not)." So, empirical data shifts the boundary lines but doesn't dissolve the conceptual knot.

  ### 3. The Undefended Intuition: "Real" Emotion
  You suspected the stall is due to an undefended intuition about what counts as a "real" emotion. This is the strongest point in your diagnosis.

  The debate relies on a folk-psychological concept of "emotion" that is too blunt for the work it is being asked to do.
  *   If "emotion" means **affective phenomenology** (it hurts to feel sad), then fictional emotions are real.
  *   If "emotion" means **action-ready disposition** (sadness makes me call a friend), then fictional emotions are fake (I don't call Anna's friend).
  *   If "emotion" means **propositional attitude** (I am sad *that* X died), then fictional emotions are category errors (X didn't die).

  The debate stalls because no one agrees on which definition is the "correct" one. Until philosophers of mind agree on a taxonomy of emotion that separates *feeling*, *action-tendency*, and *cognitive-commitment*, the Paradox of Fiction will remain a verbal dispute. Each side implicitly privileges one of these components as the "essence" of emotion without defending that choice.

  ### 4. Philosophy of Mind vs. Aesthetics
  Your friends were right to question the domain.
  *   **As Aesthetics:** The problem is trivialized. Aestheticians generally accept that we engage with art via "imaginative resistance" or "psychical distance." They care about *value* (why is this tragedy good?), not metaphysics.
  *   **As Philosophy of Mind:** The problem is vital. Fiction is simply the cleanest test case for the **Belief-Desire Model of Motivation**. If I can desire (or fear) something without believing it exists, the standard model of human agency (Belief + Desire → Action) is broken.

  The reason the debate feels stalled is that **Aesthetics borrowed a Philosophy of Mind problem but refuses to do the Philosophy of Mind work.** Aestheticians want to know why we enjoy tragedy; Mind philosophers want to know how intentionality works. They meet at "Anna Karenina," but they are looking for different things.

  ### 5. How to Break the Impasse
  If you want a path forward that isn't just another verdict, I suggest the debate needs to be **dissolved rather than solved**.

  1.  **Adopt a Componential View:** Stop asking "Is it real emotion?" and start asking "Which components of the emotion package are present?" (e.g., "Fictional grief has the phenomenology and physiology of real grief, but lacks the action-tendency and existential belief.") This renders the "Paradox" a non-issue; it's just a specific subset of emotional processing.
  2.  **Focus on "Off-Line" Emotion:** Philosophers like Peter Goldie have suggested viewing fictional emotion as "off-line" simulation. This moves the debate from *existence* to *simulation architecture*. The question becomes: *How does the mind run emotional simulations without triggering the 'existential check'?* This is a substantive cognitive science question, not a semantic one.
  3.  **Acknowledge the Normative Shift:** Admit that the real puzzle isn't "How can we feel?" but "Why is this not considered irrational?" Radford's original point was about irrationality. If we reframe the paradox as a problem of **rational norms** rather than **ontological status**, we can make progress. (e.g., "It is rational to simulate grief for evolutionary practice.")

  ### Summary Diagnosis
  The debate is stalled because it is a **category error**.
  *   **Walton** is doing metaphysics of mind.
  *   **Radford** is doing epistemology/normativity.
  *   **Neuroscientists** are doing physiology.

  They are all using the word "emotion" to refer to different phenomena. The paradox persists only as long as we insist on a binary "Real vs. Fake" classification for a phenomenon that is clearly hybrid. The impasse breaks when we stop asking if the emotion is *real* and start asking what *kind* of cognitive state it is.

  You aren't missing a paper that solves this; you're noticing that the question itself is malformed. The most productive move is to stop treating "The Paradox of Fiction" as a single problem and start treating it as a heuristic for exposing the gaps in our theory of intentionality.
