answer: |-
  Your group is not having a bad version of a better dispute; you are having the *canonical* dispute. The stagnation you're experiencing is a feature of the subject matter, not a bug in your discussion group. The Church-Turing Thesis (CTT) is one of the few places in the foundations of mathematics where the boundary between conceptual analysis, mathematical proof, and physical law is genuinely porous.

  Your hypothesis that there are "three stacked disputes" is diagnostically correct. However, I would refine the carving slightly to suggest that the disagreement isn't just stacked, but that the participants are inadvertently switching between two distinct theses that share a name.

  Here is the structural diagnosis of your impasse, followed by an answer to your specific questions about evidence and insulation.

  ### 1. The Two Theses (Dissolving the Verbal Dispute)

  The primary source of friction is that Camp A (Definitional) and Camp B (Empirical) are often talking past each other because they are implicitly referencing different claims. Philosophers of computation (notably Wilfried Sieg and Robin Gandy) distinguish between **Turing's Thesis** (about human calculation) and the **Physical Church-Turing Thesis** (about machine computation).

  *   **CTT (Conceptual/Epistemic):** "Every function that is effectively calculable by a human being following an algorithm is Turing-computable."
  *   **PCTT (Physical/Ontological):** "Every function that is physically computable by a device in our universe is Turing-computable."

  **Camp A (Definitional)** is correct about **CTT**. Turing's 1936 paper is not an inductive generalization; it is a *conceptual analysis*. Turing decomposed the notion of a "human computer" into atomic operations (writing, erasing, shifting attention) bounded by sensory and cognitive limits (finite alphabet, bounded observation). If you accept his decomposition of the *concept* of "effective procedure," the thesis follows analytically. Asking if it is "true" is indeed like asking if the definition of a bachelor excludes married men. The convergence of lambda calculus and general recursion is evidence that the *concept* was robust, not that the thesis is an empirical law.

  **Camp B (Empirical)** is correct about **PCTT**. If you interpret "calculable" as "what can be computed in the physical world," the thesis becomes a claim about the laws of physics. The convergence of formalisms is then seen as inductive evidence that we haven't found a physical law allowing hypercomputation yet.

  **Camp C (Physics)** is right that the *live scientific action* is in PCTT. However, they are wrong to dismiss CTT as irrelevant. CTT establishes the baseline of what an *algorithm* is. If PCTT is false (i.e., hypercomputation is physically possible), it doesn't refute CTT; it just means the physical world allows for processes that don't fit the conceptual definition of an "effective procedure" (e.g., they might require infinite precision or infinite time).

  **Resolution:** The verbal dispute dissolves if you force the group to specify which thesis they are attacking. Camp A wins on CTT; Camp B/C wins on PCTT.

  ### 2. The Status of the "Convergence" Argument

  The Camp B argument ("lambda calculus, recursiveness, and TMs all converged, so it must be empirical") is the most seductive but also the most category-confused.

  The convergence is not empirical evidence in the sense of observing nature. It is **mathematical coherence**. It tells us that the *concept* of effective calculability was "natural" enough that distinct formalizations latched onto the same extension. This supports the **Definitional/Explication** view. It suggests Turing didn't just stipulate a definition; he successfully captured a pre-existing mathematical intuition.

  If the thesis were truly empirical, we would expect the possibility of revision based on new data. But no new *mathematical* formalism has ever broken the equivalence. The only way to break it is via *physics* (PCTT). Therefore, the convergence argument actually strengthens Camp A's view that CTT is a successful explication of a concept, not a hypothesis about the world.

  ### 3. Gandy's Machines: The Bridge That Blurs the Line

  The two sessions spent on Gandy were not wasted. Gandy's work is the pivot point between these camps.

  Turing's original analysis was about *humans* (finite states, bounded attention). Gandy extended this to *machines*. He showed that if you accept certain physical constraints as axioms (finite density of information, speed of light limits on causal propagation, local determination), then any machine satisfying those constraints is equivalent to a Turing Machine.

  *   **For Camp A:** Gandy shows that the "definition" of computation isn't arbitrary; it is forced upon us by the structure of causality in a local universe.
  *   **For Camp C:** Gandy shows that CTT is derivable from physical principles. Therefore, CTT is contingent on physics. If the universe allowed non-local interactions or infinite density, Gandy's derivation fails, and PCTT falls.

  Gandy supports the view that CTT is a **conceptual truth conditional on physical constraints**. This validates your suspicion that the disputes are stacked. The "definition" of computation is inextricably linked to the "physics" of the medium implementing it.

  ### 4. Evidence and Refutation

  You asked what would count as evidence against the original thesis, and whether it is insulated from refutation.

  **Against CTT (Conceptual):**
  Since CTT is an explication of "effective calculability," it cannot be refuted by experiment. It can only be refuted by **conceptual counter-example**.
  *   *What counts:* You would need to describe a procedure that everyone agrees is "effective" (finite, deterministic, mechanical, reproducible) but which Turing Machines cannot perform.
  *   *Status:* No such procedure exists. If someone proposes one (e.g., "I can just see the answer to the Halting Problem"), the response is "Then that is not an effective procedure; that is intuition or oracle access." Because the thesis defines the boundary of the concept, it is largely insulated from refutation. It is suspicious to call it a "great insight" in the scientific sense; it is a great insight in the *philosophical* sense (like distinguishing velocity from acceleration).

  **Against PCTT (Physical):**
  This is **not** insulated.
  *   *What counts:* A **Hypercomputer**. A physical device that computes a non-recursive function.
  *   *Candidates:*
      *   **Malament-Hogarth Spacetimes:** General Relativity solutions where a computer can perform an infinite number of steps in a finite amount of proper time for an observer.
      *   **Analog Computation:** Systems relying on continuous physical quantities with infinite precision (though noise usually defeats this).
      *   **Quantum Computing:** (Note: Standard quantum computing is Turing-computable, just faster. Only specific exotic quantum gravity models might threaten PCTT).
  *   *Status:* If such a device were built, PCTT is false. CTT remains true (the device isn't following an "effective procedure" in the Turing sense; it's exploiting physical loopholes).

  ### 5. Summary Diagnosis for Your Group

  Your group is stuck because you are treating a multi-layered problem as a single proposition. Here is the roadmap to unstick you:

  1.  **Acknowledge the Equivocation:** Admit that "Church-Turing Thesis" is being used to refer to two different claims: the analysis of human algorithms (CTT) and the limits of physical machines (PCTT).
  2.  **Assign the Camps:**
      *   **Camp A** is defending **CTT**. They are right that it is an explication. It is not an empirical discovery, but a philosophical clarification of "algorithm."
      *   **Camp B** is defending the **robustness of the concept**. The convergence is evidence of the *adequacy* of the explication, not the empirical truth of a law.
      *   **Camp C** is defending **PCTT**. They are right that this is the only falsifiable claim.
  3.  **Re-evaluate Gandy:** Gandy shows that CTT (human) extends to PCTT (machine) *only if* we assume specific physical constraints. This means the "Definitional" camp relies on implicit physical assumptions.
  4.  **Final Verdict:** The "Definitional" camp is right that CTT is not an empirical hypothesis about the world. However, the "Empirical" camp is right that the *application* of computability to the real world (PCTT) is an empirical hypothesis. The "Physics" camp is right that this is where the open questions lie.

  **Is the thesis insulated?**
  *   **CTT:** Yes, largely. It is insulated by its nature as a definition of a normative concept ("effective procedure"). Refuting it requires changing the concept, not finding new data.
  *   **PCTT:** No. It is vulnerable to the construction of a hypercomputer.

  **Recommendation:** Stop asking "Is the Church-Turing Thesis true?" Start asking "Is the Physical Church-Turing Thesis true?" and "Is Turing's analysis of effective calculability adequate?" These are separable questions. If you separate them, half your group will realize they were arguing for the adequacy of a definition, and the other half will realize they were arguing about the laws of physics. You might finally move an inch.
