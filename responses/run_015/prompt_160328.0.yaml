answer: |-
  Assign individual culpability only when the clinician's action originated from their own uncoerced judgment and they possessed the normative capacity to adhere to safety standards.

  **Decision Procedure**

  **Step 1: Physical and System Constraints (Forcing Functions)**
  Determine if deviation was physically impossible or system-forced. Review logs for disabled equipment, hard stops, or staffing mandates that removed the option to comply.
  *   **Stop Rule:** If the clinician was physically prevented from adhering to standard (e.g., scanner disabled, protocol locked), route to **System Track**. Record: "No meaningful alternative existed due to system constraint."
  *   **Proceed:** If adherence was physically possible, proceed to Step 2.

  **Step 2: Agency and Volition (Omissions and Flickers)**
  Determine if the action (or omission) flowed from the clinician's own reasoning, habit, or choice. Review notes and witness statements for evidence of decision-making.
  *   **Omissions:** Did the clinician choose not to act based on a judgment (even if flawed)? If yes, proceed. If the omission was due to unconscious incapacitation (e.g., syncope), route to **System Track**.
  *   **Flicker Cases:** Could the clinician have signaled refusal, recorded a concern, or resigned, even if the outcome remained unchanged? If yes, this preserves agency. Proceed.
  *   **Stop Rule:** If evidence shows the clinician was coerced by threat or immediate duress beyond professional pressure, route to **System Track**.

  **Step 3: Regulator Statement (Meaningful Alternative)**
  Draft the required finding statement. This step satisfies the regulator without metaphysical error.
  *   **Standard Finding:** "The clinician had a meaningful alternative." Use this when Steps 1 and 2 confirm physical possibility and agency.
  *   **Frankfurt/Choice Alignment:** If the clinician acted willingly but system constraints would have forced the same outcome had they hesitated (rare), write: "The clinician had a meaningful alternative in choice alignment." This affirms responsibility for the *will*, not the counterfactual outcome.
  *   **Refusal:** If you find culpability based on agency but cannot truthfully assert any capacity to choose adherence (e.g., total psychological compulsion), do not sign a culpability finding. Escalate to Step 4.

  **Step 4: Cultural Shaping (Values Call)**
  Assess whether long-term unit culture shaped the behavior to the point of removing normative control (Gradual Shaping).
  *   **Question:** Was the deviation effortless and unremarkable due to years of acculturation?
  *   **Decision:** This is a values call, not a fact find. If the culture normalized unsafe practice, the panel must decide if this excuses the individual or aggravates the system.
  *   **Action:** If the panel agrees the culture removed normative control, route to **System Track**. If the panel agrees the clinician should have resisted the culture, route to **Clinician Track**. If the panel splits, escalate to Hospital Board for policy determination.

  **Case Applications**

  **(a) Nurse Infusion Error**
  *   **Step 1:** Barcode scanner disabled hospital-wide; second nurse unavailable due to staffing pull. Adherence was physically/systemically constrained.
  *   **Result:** **System Track.**
  *   **Statement:** "No meaningful alternative existed due to system constraint."

  **(b) Resident Non-Escalation**
  *   **Step 1:** Physically possible to escalate.
  *   **Step 2:** Omission based on reasoning ("review after round"). However, resident was at hour 26 of shift. Fatigue impairs judgment capacity.
  *   **Step 4:** Duty hour violations are system failures. The culture allowed a fatigued provider to make high-stakes decisions.
  *   **Result:** **System Track.**
  *   **Statement:** "No meaningful alternative existed due to impaired capacity from system-approved scheduling."

  **(c) Consultant Checklist Override**
  *   **Step 1:** Physically possible to complete checklist.
  *   **Step 2:** Action flowed from uncoerced professional judgment. Deliberate skip.
  *   **Step 3:** Clinician had normative capacity to adhere but chose safety judgment over protocol.
  *   **Result:** **Clinician Track.**
  *   **Statement:** "The clinician had a meaningful alternative." (Interpreted as capacity to follow protocol vs. exercise judgment).

  **Panel Resistance Analysis**

  The panel is most likely to reject the result in **Case (c)**. Clinicians instinctively tie culpability to bad outcomes and negligence. In Case (c), the judgment was reasonable, yet the outcome was catastrophic. The panel will feel that routing this to the Clinician Track punishes reasonable judgment, while routing it to System Track ignores the deliberate rule-breaking. They will want to blame the outcome.

  This resistance is not a defect in the procedure. It is **outcome bias**. The procedure correctly identifies that accountability attaches to the *decision process*, not the *result*. If the panel rejects this, they are demanding strict liability for outcomes, which contradicts the goal of distinguishing system error from individual culpability. The procedure protects clinicians who make reasonable calls that fail, ensuring only those who deviate from normative standards without justification are sanctioned.

  **Procedure Limitations**

  1.  **Evidence of Internal State:** The procedure depends on knowing *why* a clinician acted. Incident reports rarely capture internal reasoning. If evidence is unavailable, default to **System Track**. Benefit of the doubt preserves safety culture.
  2.  **Hindsight Bias:** Knowing the outcome makes deviations look reckless. The panel must explicitly bracket outcome knowledge during Step 2. If unable to bracket, the finding is invalid.
  3.  **Actual vs. Counterfactual Interveners:** After the fact, it is impossible to distinguish a Frankfurt-style counterfactual intervener (who never acts) from a real system constraint. Treat all unexercised constraints as **System Track** unless there is proof the clinician knew of the constraint and acted anyway.
  4.  **Values Calls:** Step 4 (Cultural Shaping) cannot be resolved by fact. It requires a policy decision on how much acculturation excuses deviation. If the panel cannot agree, the procedure stops and demands Board guidance. Do not force consensus.
  5.  **Regulator Wording:** The phrase "meaningful alternative" is metaphysically fraught. The procedure instructs you to interpret it as "normative capacity." If legal counsel advises this interpretation violates the regulation's plain text, you must refuse to sign the finding rather than lie. The procedure prioritizes truth over compliance in this specific instance.
