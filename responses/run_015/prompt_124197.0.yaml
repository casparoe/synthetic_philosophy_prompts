answer: |-
  You have put your finger on a very specific, high-friction point in metaphysics that doesn't have a single, tidy dictionary definition, though it is built from well-known philosophical components.

  The short answer is: **No, there is no single established term for this specific reversal.**

  However, the *components* of what you are describing are rigorously mapped in philosophy under **Sortal-Dependent Identity** and the distinction between **Spatiotemporal Continuity** vs. **Constitutive Continuity**.

  Since you are a novelist looking for the "carving" rather than just a label, I will break down the existing framework, show you where your observation adds something new, and then offer a coined term that captures the specific *reversal* you've identified.

  ### 1. The Existing Framework: Sortal-Dependence
  In metaphysics (specifically in the work of philosophers like David Wiggins), identity is not absolute; it is relative to the "sortal" concept you apply to the object. A *sortal* is a category that supplies a principle of individuation (e.g., "Boat," "Person," "Corporation," "Troupe").

  *   **For Artifacts (The Boat):** The sortal "Boat" prioritizes **Spatiotemporal Continuity**. We track the object's history through space and time. As long as there is a continuous path of existence where the object remains functional in its specific location/context, it remains the "same" boat, even if the matter changes. The *form and history* carry the essence.
  *   **For Collectives (The Troupe):** The sortal "Troupe" (when viewed as a collaboration) prioritizes **Constitutive Continuity**. We track the relationships and agency of the members. If the members leave, the "spirit" or "agency" of the group leaves with them. The *constituents* carry the essence.

  ### 2. The Phenomenon: Why the Intuition Flips
  You noticed that the criteria for "sameness" invert depending on the category. This is the core of your observation.

  *   **The Boat (Inert Parts):** The planks are passive. They do not hold the identity. The identity is imposed from the *outside* by the owner, the dock, and the function. Therefore, the **Container** (the structure/location) holds the identity.
  *   **The Troupe (Agentive Parts):** The actors are active. They hold the skills, the chemistry, and the intent. The identity is generated from the *inside*. Therefore, the **Content** (the people) holds the identity.

  This is where your observation goes beyond standard "Ship of Theseus" discussions. Most philosophical debates stop at the boat. You are asking why we treat *social objects* differently than *physical objects*.

  ### 3. The Boundary Case: Where the Intuition Breaks
  This is crucial for your story. The reversal isn't perfect; it breaks down when a social group becomes "institutionalized."

  *   **The Troupe as Collaboration:** If the Driftwood Players are a band of friends, the identity follows the **people** (Constitutive).
  *   **The Troupe as Institution:** If the Driftwood Players are a franchise (like the *Harlem Globetrotters* or a sports team), the identity follows the **name/assets** (Spatiotemporal).

  If the owner of the theater owns the trademark "Driftwood Players," the law says the new cast is the real troupe. But the *audience* might say the old cast is the real troupe. This conflict between **Legal Identity** (Artifact logic) and **Folk Identity** (Agent logic) is where your story's tension lives.

  ### 4. A Coined Term: "The Continuity Inversion"
  Since there is no standard term for this specific flip, I propose you use **"The Continuity Inversion"** (or **"The Locus of Persistence Reversal"**).

  Here is the precise definition you can use for your own world-building:

  > **The Continuity Inversion:** The phenomenon where the criteria for identity preservation flip based on whether the constituents of an object are **inert** or **agentive**.
  > *   **Inert Constituents (Boats, Buildings, Cars):** Identity persists through the **Structure/Context**. Replacing parts is maintenance; reassembling parts is replication.
  > *   **Agentive Constituents (Bands, Crews, Families):** Identity persists through the **Members/Will**. Replacing members is attrition; reassembling members is restoration.

  ### 5. How to Use This in Your Novel
  This isn't just semantics; it's a conflict of worldviews. In your shipyard town, you can have two factions arguing past each other because they are applying different "sortals" to the same situation.

  *   **The Shipwrights (Artifact Logic):** They view the boat as a **Vessel**. To them, the "soul" of the boat is its history of service, its registration, and its place in the harbor. Replacing the wood is just keeping the vessel alive. The pile of old planks is just scrap.
  *   **The Sailors (Agentive Logic):** They view the boat as a **Companion**. To them, the "soul" of the boat is the specific wood that weathered the storms with them. The new wood is a stranger. They might treat the reassembled plank-boat as the "ghost" of the original.

  **The Twist:**
  The deepest tension arises if the town starts treating the *people* like *boats*, or the *boats* like *people*.
  *   If the town treats the *fishermen* like boats (replace them one by one to keep the "industry" alive), the community feels dead even if the economy thrives.
  *   If the town treats the *boats* like people (believing the specific wood holds a spirit that cannot be transferred), they might refuse to repair them, letting them rot to preserve their "purity."

  ### Summary
  *   **Established Concept:** Sortal-Dependent Identity Criteria.
  *   **The Specific Reversal:** Spatiotemporal Continuity (Artifacts) vs. Constitutive Continuity (Collaborations).
  *   **Proposed Term:** **The Continuity Inversion**.
  *   **The Edge Case:** Institutionalization (when a group becomes a brand, it flips from Constitutive to Spatiotemporal logic).

  This distinction gives you a precise tool to diagnose why your characters feel uneasy. They aren't just arguing about boats; they are arguing about whether identity lives in the **Anchor** (the place/structure) or the **Seed** (the living parts).
