prompt: |-
  Hi — I'm writing the answer key for next week's problem set in a confirmation-theory seminar and I really don't want to put words in the professor's mouth, so I'm trying to work out what rule she's actually running before I commit to anything.

  Her running example is H = all ravens are black, and she rates observations on a five-point scale: nothing / negligible / weak / moderate / strong. Here are the verdicts I've managed to collect from her old handouts and from things she's said in section:

  1. An expert spots a bird in the wild and identifies it as a black raven: moderate.
  2. Her own white sneaker, which she's owned for five years, sitting in her hallway: nothing at all — she says it was never a test of anything.
  3. A blind draw from a warehouse bin labelled non-black objects, roughly two million items in it; the item turns out to be a red toy truck: somewhere between negligible and weak.
  4. The same kind of draw, but from a bin with only about thirty non-black items, and again it comes up a non-raven: she says this is clearly stronger than 3, though still below 1.
  5. A blind draw from a bin labelled objects that are not ravens; it comes up a white coffee mug: nothing.
  6. She nets one bird out of a mixed flock of ravens and crows that she's been watching for an hour, so she already knows every bird in that flock is black; the only open question is raven-or-crow. It's a crow: nothing.
  7. A bird that a DNA test says is a raven, glimpsed in bad light and judged probably black but not certainly: weak.
  8. A white raven: falsifies, and she insists that holds no matter how the thing was selected and no matter what anyone expected.

  The two cheap rules are obviously out: she rejects the plain-vanilla Nicod-style rule that any instance of the hypothesis confirms it, together with the equivalence condition (that would make 2 confirm), and she also rejects the view that only black ravens can ever do any confirming (3 and 4 do confirm for her). Past that I can't pin her down, and her one-line remarks in 2 and 5 are compatible with more than one reading.

  The new material I have to write the key for is three people working at that same warehouse:

  Marta is told she's drawing from the non-black bin, the two-million-item one from case 3. She reaches in blind and pulls out a pale grey ceramic vase.

  Jonas draws blind from that same non-black bin but is told nothing about it. He works out what his item is by touch in the dark — a ceramic vase — then switches on the light and sees that it's pale grey, and only after all that is he told which bin he drew from.

  Priya draws blind from a bin the curator has certified to contain no biological specimens whatsoever, just minerals, ceramics and glass. Priya was told it was the general miscellaneous bin and believes that. Her item is also a pale grey ceramic vase.

  So: what does she say about each of the three — does it confirm H at all, and where on her scale? More usefully, what's the rule that fits verdicts 1 through 8 and generates those three answers, what other rule fits 1 through 8 just as well but disagrees somewhere in the new set, which of the two would you bet is really hers and why, and if you think her old verdicts genuinely underdetermine it, what single further case would you slip into the problem set to force her hand? I'd much rather have the reasoning than just the three labels, and I need to know whether the order the information arrives in is doing any work for her or whether that's a red herring I've invented.
