  ### Summary for the Answer Key

  *   **Marta:** **Negligible/Weak.** (Matches Case 3; intentional test of $\neg B$ population).
  *   **Jonas:** **Nothing.** (Accommodation, not prediction; the test design did not target the relevant property *ex ante*).
  *   **Priya:** **Nothing.** (Objective risk of falsification was zero; the method was incapable of finding a raven).
  *   **Underlying Logic:** Confirmation requires a **severe test**, defined by the **objective capacity of the procedure** to detect errors, not merely the agent's information state. Order of information matters because it distinguishes between designing a test and accommodating data.
