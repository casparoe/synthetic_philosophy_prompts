answer: |-
  First, the feedback: Your "interruption test" is sound—that's the difference between a rigid script and a skilled practice. But leave Andy out of it. Comparing the honoree to a living relative risks sounding like a judgment on Andy rather than a tribute to Ray, and it complicates the room's dynamic unnecessarily.

  Here is the one sentence to build the whole thing around:

  **"The measure of a routine isn't whether it runs without stopping, but whether it knows how to start again exactly where it left off."**

  ***

  **The Toast**

  Good evening. For those who don't know me, I'm [Your Name]. I drive a forklift for a living, and I'm married to Ray's niece. I know my way around a routine. When you move pallets for a living, you do the same checks, the same turns, the same lifts, thousands of times. You learn quickly that there are two kinds of routines. There's the kind that traps you, and the kind that carries you.

  We've heard a lot this weekend about Ray's routine. Forty-three years. Same route. Same coffee stop at 9:15. It's easy to look at that and see something rigid. To see a man who did the same thing so long he forgot how to do anything else. I know some folks say "creature of habit" like it's a compliment, but sometimes it sounds like they're saying he was on autopilot. Like the route was running him.

  I don't think that's true.

  I've been thinking about what makes a routine real. And I think the test isn't watching when things go smooth. The test is watching what happens when something gets in the way.

  If a routine is just a script, an interruption breaks it. You have to go back to the start. You lose the place. But if a routine is a promise, an interruption is just part of the work.

  Ray knew every street on his route, but he also knew every person. And people interrupt you. Someone's in the hospital. Someone's porch needs clearing. Someone just needs to sit in the rain for twenty minutes because the week has been hard. A machine can't handle that. A machine stops. Ray stopped, too, but he didn't break. He'd handle the interruption—the care, the conversation, the trouble—and then he'd pick up the route exactly where he left it.

  He didn't walk those streets because he was afraid of change. He walked them because that was where he was needed. There's a difference.

  I know some days were hard. I know there were days when the legs were tired and the weather was bad and maybe it felt like autopilot just to get through it. Ray would be the first to admit that. But showing up isn't about feeling inspired every morning. It's about knowing that when you stop for something that matters, you don't lose yourself. You just wait, and then you continue.

  That's why this room is full tonight. It's not because he walked a lot of miles. It's because he let the miles be interrupted by us. He built a life where the routine wasn't a wall, it was a backbone. It held him up so he could lean on when we needed it.

  Ray, you've delivered the mail for forty-three years. But what we're celebrating is everything else you delivered along the way. Thank you for showing us how to keep going without forgetting to stop.

  To Ray.
