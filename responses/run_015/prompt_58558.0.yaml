  ok so im trying to actually get wittgenstein's language games and family resemblance idea instead of just nodding along, can you use the whole pluto demotion thing to explain it to me?

  like rember the basics: pluto was found in 1930 and everyone called it the ninth planet for like 70 years, then in 2006 the IAU came up with that three-part test — orbits the sun, big enough to be pulled round, and has cleared its neighborhood — and since pluto hasn't cleared its orbit it got bumped to dwarf planet and people got super mad, petitions and t-shirts and stuff.

  can you map that mess onto wittgenstein for me? like what are the different language games here — the orbital dynamicists vs middle-school science teachers vs news headlines vs maybe astrologers — and how does family resemblance explain why planet never had a clean essence and why the vote felt so definately political? and then flip it: what does this case show is awkward for wittgenstein? science sometimes needs a sharp stipulative line even if everyday use is blurry, right? so where does his picture help, where does it misdescribe what the IAU was doing, and where is he just silent and we shouldn't force it?

