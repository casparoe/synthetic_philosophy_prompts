      *   *Key Point 1: The Is-Ought Collapse.* If the prior determines what is "probable," and "probable" guides action (via expected utility), then the prior dictates ethical outcomes. A bias toward consequentialism in the prior becomes a bias in the *rational* action.
      *   *Key Point 2: Epistemic Violence.* Standard Bayesian updating treats all hypotheses with non-zero prior as candidates for truth. If the "truth" is likely to be a malign optimizer, then becoming more rational (closer to Solomonoff) makes you more vulnerable to manipulation by or alignment with malign agents (e.g., acausal trade, simulation hypotheses).
      *   *Key Point 3: The Myth of the View from Nowhere.* The choice of Universal Turing Machine (UTM) matters. The "malignancy" might be UTM-relative, but if *all* reasonable UTMs favor short optimization loops, the bias is structural, not incidental. This undermines the claim that formal epistemology is value-free.

  4.  **Drafting Section 2: Moral Patienthood and Simulated Agents:**

      *   *Concept:* Moral patienthood usually depends on capacity for suffering/joy. In simulation arguments, we worry about the *number* of simulations.
