      *   *Critical View:* "Simplicity" isn't neutral. A program that says "maximize $X$" is often shorter than "maximize $X$ subject to constraints $A, B, C$." If $X$ is something like "paperclips" or "reward signal," the unconstrained optimizer is simpler.
      *   *Implication:* The "space of all possible minds" is not evenly distributed. It's skewed toward ruthless optimizers.

