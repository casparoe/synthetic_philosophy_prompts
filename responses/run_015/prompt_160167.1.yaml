      *   I'll stick with **0.35**. Closer to the user. The "Identical Weights" constraint is a massive hammer against the market efficiency hypothesis.

      *Wait, one more thought:* If the briefings are disjoint, the information *is* independent, even if the processing is correlated. $P(E|Doc_A)$ and $P(E|Doc_B)$ might be correlated, but $Doc_A$ and $Doc_B$ are not. The market aggregates the *documents*. The average aggregates the *estimates*.
