prompt: |-
  I'm writing a chapter on reproductive torts and want to get the implicit philosophy straight before I get to the doctrine. In most common-law jurisdictions, parents can recover for wrongful conception and wrongful birth — the costs of an unplanned pregnancy after a failed sterilisation or negligent genetic counselling — while the child's own claim, wrongful life, is almost uniformly rejected, even where the negligence (a failure to diagnose rubella in utero, say) determined not that the child exists but only the condition the child exists in. Courts justify the refusal by appeal to the supposed impossibility of comparing impaired existence with nonexistence, and sometimes to the principle that life itself cannot be a harm; meanwhile some courts, in wrongful conception suits, offset the rearing-cost award by the benefits of parenthood. What view of harm — and of the nonidentity problem — does this pattern presuppose? Does it presuppose a person-affecting constraint, and is it coherent, given that in the misdiagnosis cases identity is fixed and no nonidentity problem arises? Distinguish what the doctrine strictly requires from what it merely sits well with, and say what would have to change if the courts instead adopted the Parfitian line that the only wrongs here are done to the parents. Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Reproductive torts (wrongful conception, wrongful birth, wrongful life).
      *   **Goal:** Clarify the implicit philosophy underlying current common-law doctrine before discussing the doctrine itself.
      *   **Key Questions:**
          *   What view of harm and the non-identity problem does the current pattern presuppose?
          *   Does it presuppose a person-affecting constraint?
          *   Is it coherent (given that identity is fixed in misdiagnosis/wrongful birth cases)?
          *   Distinguish what the doctrine *requires* vs. what it *sits well with*.
          *   What would change if courts adopted the Parfitian line (wrongs only to parents)?
      *   **Constraint:** Answer in British English.

  2.  **Deconstruct the Legal Landscape:**
      *   *Wrongful Conception:* Healthy child born after failed sterilisation. Parents sue for costs. Usually allowed (pregnancy/birth costs), often limited on rearing costs (offset by benefits of parenthood).
      *   *Wrongful Birth:* Disabled child born after negligent genetic counselling/testing. Parents sue for extra costs of disability. Usually allowed.
      *   *Wrongful Life:* Child sues for being born disabled rather than not existing. Almost uniformly rejected.
      *   *Rationale for Rejection:* Impossibility of comparing existence with non-existence; life cannot be a legal harm.
      *   *Offsetting Benefits:* In wrongful conception, courts often say the joy of the child offsets the financial cost.

  3.  **Analyze the Philosophical Underpinnings:**
      *   *View of Harm:* The courts seem to operate on a *comparative* account of harm (you are worse off than you would have been otherwise) but hit a metaphysical wall when the comparison is existence vs. non-existence.
      *   *Non-Identity Problem (Parfit):* In wrongful birth/life cases involving genetic conditions, the negligence often determines *which* child is born (if the parents would have conceived later or used a different gamete). However, in many medical negligence cases (e.g., failure to diagnose rubella *during* pregnancy), the child is already conceived. Identity is fixed.
      *   *Person-Affecting Constraint:* The idea that an act can only be wrong if it makes some particular person worse off.
      *   *Coherence:* There is a tension. If identity is fixed (rubella case), the non-identity problem doesn't strictly apply. Yet courts still use the "existence vs. non-existence" logic to bar the child's claim. This suggests the bar isn't *really* about non-identity, but about the sanctity of life or the impossibility of the calculation.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the task. Set the scene regarding the triad of torts (conception, birth, life).
      *   **The Implicit View of Harm:**
          *   Courts use a *counterfactual comparative* test for parents (you are worse off financially/physically than if the negligence hadn't occurred).
          *   For the child, they reject this test because the counterfactual is non-existence.
          *   This implies a view that harm requires a baseline of prior existence or a state of affairs where the subject exists in both scenarios.
          *   *Sanctity of Life:* There's a deontological constraint lurking here (life is a gift/good, never a harm).
      *   **The Non-Identity Problem & Person-Affecting Constraint:**
          *   *Does it presuppose a person-affecting constraint?* Yes, implicitly. They want to say *someone* was harmed. For parents, it's clear. For the child, they can't say the child is harmed by being made to exist (because the alternative is not existing).
          *   *Is it coherent?* This is the crux. In *fixed identity* cases (negligence during pregnancy), the non-identity problem is technically absent. The child *would have existed* but healthy. So, logically, a comparative harm claim *should* work (Disabled Existence vs. Healthy Existence).
          *   *Why do courts still reject it?* They conflate the two scenarios or rely on the broader metaphysical difficulty of weighing life against non-life. So, the doctrine is *philosophically incoherent* regarding identity, but *legally consistent* in its refusal to validate "life as harm."
      *   **Requirement vs. Compatibility:**
          *   *What the doctrine requires:* A distinction between duties owed to parents (bodily autonomy, economic integrity) and duties owed to the foetus/child (limited by the status of life). It requires that damages be calculable.
          *   *What it sits well with:* It sits well with a person-affecting view *if* one accepts the premise that one cannot be harmed by being brought into existence. It sits well with the non-identity problem *in genetic counselling cases*, but it *misapplies* it in prenatal injury cases.
      *   **The Parfitian Shift:**
          *   If courts adopted Parfit's view (impersonal principles, or strict person-affecting view that acknowledges the non-identity issue):
          *   Parfit argues that in non-identity cases, the child is not harmed (person-affecting), so the wrong is impersonal (a worse state of affairs).
          *   Tort law is inherently person-affecting (plaintiff must have standing/harm).
          *   *Consequence:* If courts strictly followed Parfit, wrongful life claims would still fail (no harm to specific person), but the justification would shift from "impossible comparison" to "no victim."
          *   *However,* the prompt asks: "what would have to change if the courts instead adopted the Parfitian line that the only wrongs here are done to the parents."
          *   *Correction/Refinement:* Parfit's analysis often suggests that in non-identity cases, the child has no complaint *against the parents/doctor* personally, but the act is still wrong impersonally. Tort law struggles with impersonal wrongs. If courts said "The only wrongs are to the parents," they would essentially codify the person-affecting restriction.
          *   *Impact:* Wrongful birth/conception remains (parents harmed). Wrongful life remains barred (child not harmed). The *reasoning* changes from "metaphysical impossibility" to "lack of comparative harm relative to a baseline."
          *   *Coherence Check:* This actually makes the law *more* coherent philosophically, even if the outcome is the same. It admits that the child's claim fails because of the non-identity logic (in genetic cases) or the baseline logic (in injury cases), rather than a mystical "life is sacred" rule.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *British English:* Ensure spelling (judgement/judgment, colour, analyse, etc.) and tone (slightly more formal/academic).
      *   *Distinction:* Be careful distinguishing between *wrongful birth* (parents sue) and *wrongful life* (child sues).
      *   *The "Offset" Issue:* The "benefits of parenthood" offset suggests a "net benefit" view of harm, which contradicts the "life cannot be a harm" view in wrongful life. This is a key incoherence to highlight. If the child's life is a benefit to the parents (offsetting costs), how can it be impossible to weigh for the child?
      *   *Fixed Identity:* Emphasise that in *prenatal negligence* (e.g., rubella), the child is the same entity. The comparison is Disabled Life vs. Healthy Life. The court's refusal here is *not* driven by non-identity, but by policy/sanctity of life. This is a crucial distinction.

  6.  **Final Polish:**
      *   Structure: Introduction -> View of Harm -> Non-Identity & Coherence -> Requirement vs. Compatibility -> Parfitian Shift -> Conclusion.
      *   Tone: Academic, analytical, precise.
      *   Check constraints: British English.

  7.  **Drafting the Content (Mental or Scratchpad):**
      *   *Harm:* Comparative counterfactual.
      *   *Non-Identity:* Courts conflate genetic (identity affecting) and prenatal (identity fixed) cases.
      *   *Person-Affecting:* Yes, tort law is inherently person-affecting.
      *   *Parfit:* If adopted, clarifies that the child has no standing in non-identity cases, but doesn't necessarily solve the fixed-identity cases unless we admit the "life as harm" barrier is policy, not logic.
      *   *Wait, re-reading the prompt:* "what would have to change if the courts instead adopted the Parfitian line that the only wrongs here are done to the parents."
      *   *Interpretation:* This implies treating the reproductive negligence as a wrong to the parents' autonomy/interests exclusively. This aligns with current outcomes but changes the *justification*. It removes the metaphysical hand-waving about the child's existence.

  8.  **Final Review against constraints:**
      *   British English? Yes (e.g., "foetus", "programme", "analyse").
      *   Addressed all sub-questions? Yes.
      *   Tone appropriate? Yes.

  *(Self-Correction during drafting)*: I need to be careful with Parfit. Parfit's "Non-Identity Problem" shows that person-affecting views lead to counter-intuitive results. If courts adopt the line that "only wrongs are done to the parents," they are effectively embracing a person-affecting restriction *because* of the non-identity problem, rather than solving the non-identity problem. I need to make sure I don't attribute the "Impersonal Total Principle" to the courts. The prompt asks about the line that "the only wrongs here are done to the parents." This is a person-affecting conclusion.

