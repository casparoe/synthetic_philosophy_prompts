answer: |-
  **The Implicit Philosophy of Reproductive Torts**

  To articulate the philosophical substratum of reproductive torts is to navigate a tension between the common law's pragmatic conception of damage and the metaphysical complexities of existence. The current doctrinal pattern—permitting claims for wrongful conception and wrongful birth while barring wrongful life—presupposes a specific, albeit often unarticulated, view of harm, identity, and the limits of legal personhood.

  **1. The Conception of Harm and the Person-Affecting Constraint**

  At the level of harm, the common law operates on a **counterfactual comparative account**. To establish damage, a claimant must demonstrate they are worse off than they would have been had the tort not occurred. In wrongful conception and wrongful birth, this calculus is straightforward regarding the parents: they are financially and physically worse off than they would have been had the sterilisation succeeded or the genetic risk been disclosed.

  However, the rejection of wrongful life claims reveals a commitment to a **person-affecting constraint** coupled with a **threshold view of existence**. Courts implicitly hold that for a person to be harmed, there must be a baseline state of affairs in which that person exists against which the current state can be measured. Because the alternative to impaired existence is non-existence, courts deem the comparison logically impossible. This is not merely an epistemic limitation but a normative one: it presupposes that existence itself possesses a value that precludes it from being categorised as a legal injury.

  Consequently, the doctrine presupposes that tort law is fundamentally person-affecting: an act is only actionable if it renders a *particular* person worse off. Since the child in a wrongful life suit cannot claim to be worse off than they would otherwise be (as the 'otherwise' is nothing), they lack standing.

  **2. Coherence and the Non-Identity Problem**

  The coherence of this framework is compromised by the courts' indiscriminate application of the non-identity logic.

  The **non-identity problem**, as formulated by Derek Parfit, arises when a choice affects *who* comes into existence. In genetic counselling cases (wrongful birth), if the parents would have avoided conception entirely had they known the risk, the negligent advice determines the identity of the child. Here, the non-identity problem is genuine: the disabled child cannot claim they were harmed by the negligence, for without it, they would not exist.

  However, in many prenatal negligence cases (such as a failure to diagnose rubella *during* an ongoing pregnancy), identity is **fixed**. The child exists prior to the negligence; the choice is between that child existing with a disability or that same child existing healthily (or via termination). Here, no non-identity problem arises. The comparison is between impaired existence and healthy existence, not existence and non-existence.

  By barring wrongful life claims in *both* scenarios using the same "impossible comparison" rationale, the courts display a philosophical incoherence. They conflate identity-affecting choices with identity-fixed injuries. The doctrine is therefore not strictly driven by the non-identity problem, but rather by a policy-driven **sanctity of life principle** that borrows the language of non-identity to shield itself from metaphysical scrutiny.

  Furthermore, there is a tension between the rejection of wrongful life and the **offsetting of benefits** in wrongful conception. In the latter, courts often reduce damages by the 'joy of parenthood', implying that the child's life is a net benefit that can be weighed against financial costs. If the benefits of life can be weighed to reduce parental damages, it is logically inconsistent to claim that the burdens of life cannot be weighed to establish a child's harm.

  **3. Requirement versus Compatibility**

  It is vital to distinguish what the doctrine strictly *requires* from what it merely *sits well with*.

  *   **What the doctrine requires:** Strictly speaking, the law only requires that damages be **calculable** and that the duty of care be **owed to the claimant**. It requires a coherent baseline for comparison. It does not *logically* require the rejection of wrongful life in fixed-identity cases, nor does it require the 'benefits offset' in wrongful conception.
  *   **What it sits well with:** The current pattern sits well with a **strong person-affecting view** that refuses to recognise 'impersonal' harms (i.e., that the world is worse off because a disabled child exists). It also sits well with a **deontological constraint** regarding the sanctity of life, which treats life as a good that cannot be actionable damage, regardless of the comparative utility.

  The doctrine is philosophically 'messy' because it attempts to satisfy the person-affecting constraint of tort law while avoiding the counter-intuitive implications of the non-identity problem, all while maintaining a public policy stance that life is inherently valuable.

  **4. Adopting the Parfitian Line**

  If the courts were to explicitly adopt the Parfitian line that the only wrongs in these scenarios are done to the parents, several shifts would occur in the legal reasoning, even if the outcomes remained largely similar.

  Parfit's analysis suggests that in non-identity cases, the child is not harmed (person-affecting), but the act may still be wrong because it brings about a worse state of affairs (impersonal). Tort law, however, is ill-equipped to adjudicate impersonal wrongs. If courts codified the view that **only parents are victims**, the following changes would be necessary:

  1.  **Clarification of Duty:** The duty of care in genetic counselling and sterilisation would be explicitly framed as owed solely to the parents' autonomy and economic interests, not to the potential child's welfare. This would remove the fictional search for a duty owed to the foetus.
  2.  **Abandonment of Metaphysical Rhetoric:** Courts would cease relying on the "impossibility of comparing existence with non-existence." Instead, they would admit that in identity-affecting cases, the child has no comparative claim *by definition*, and in fixed-identity cases, public policy precludes the claim regardless of logic.
  3.  **Resolution of the Offset Incoherence:** If the wrong is solely to the parents, the 'benefits of parenthood' offset becomes a matter of mitigating the *parents'* loss, rather than a metaphysical weighing of the child's life. This renders the calculation more coherent: it is a question of the parents' net financial position, not the value of the child's existence.
  4.  **No Expansion to Wrongful Life:** Adopting this line would cement the bar on wrongful life claims. If the wrong is exclusively to the parents' reproductive autonomy, the child has no independent cause of action. This avoids the current ambiguity where some jurisdictions leave the door slightly ajar for severe disability cases.

  **Conclusion**

  The current common-law approach presupposes a person-affecting constraint on harm but applies it inconsistently across identity-fixed and identity-affecting cases. It relies on the non-identity problem as a shield for a deeper policy commitment to the sanctity of life. To align the doctrine with a coherent Parfitian perspective would require courts to abandon the pretence that the child's claim fails due to metaphysical impossibility. Instead, they should acknowledge that reproductive negligence constitutes a violation of parental autonomy, rendering the child's claim not impossible to calculate, but conceptually misplaced within a person-affecting tort system. This would trade metaphysical confusion for candid policy reasoning.
