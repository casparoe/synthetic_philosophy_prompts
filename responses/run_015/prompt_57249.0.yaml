answer: |-
  The air in the Scriptory smelled of vinegar and slow decay. It was the smell of the ink curing, or perhaps the smell of the paper giving up. Elara sat at the long oak table, the Audit ledger open before her. Across from her sat Kael, the apprentice. He was nineteen, with eyes that had never seen the horizon beyond the city walls. He dipped his pen with a precision that made Elara's hands ache.

  "Batch Four-Alpha," Elara said. Her voice sounded too loud in the high-ceilinged room. "Continuing the sensory cluster."

  Kael nodded, turning the page of the master copy. "Ready."

  The Termination Rule was simple: every word must rest on a thing. Somewhere down the chain of definitions, there had to be a stamp reading OSTENSIVE, witnessed by a second compiler, signifying that a finger had pointed at the actual substance, shape, or event. Three generations ago, the founders had stamped the world. Now, the City Council wanted to save paper. If a word could not be pointed at again, it was waste.

  Elara pulled the file for *Astringent*. She laid the five relevant cards out in a row. They were yellowed, the ink faded to brown.

  **1. ASTRINGENT.** *adj.* Producing a PUCKER (q.v.) sensation; characteristic of the PERSIMMON (q.v.). [Ref: 44.2]
  **2. PUCKER.** *v.* To contract inwardly; to respond to HARSH (q.v.) stimuli. [Ref: 44.2]
  **3. HARSH.** *adj.* Unyielding to the tongue; possessing a DRY (q.v.) quality. [Ref: 44.2]
  **4. DRY.** *adj.* Lacking lubrication; causing a BITE (q.v.). [Ref: 44.2]
  **5. BITE.** *n.* A sharp tactile resistance; see ASTRINGENT (q.v.). [Ref: 44.2]

  Below these five lay the anchor.

  **6. PERSIMMON.** *n.* [OSTENSIVE: Gen 3, Compiler Aris; Witnessed by Val.] A fruit yielding an ASTRINGENT (q.v.) effect.

  Elara traced the line with her finger. *Astringent* led to *Pucker*, which led to *Harsh*, to *Dry*, to * Bite*, which led back to *Astringent*. The circle was tight, seamless. It held together logically. But the circle hung from the *Persimmon* entry, and the *Persimmon* entry relied on the *Astringent* definition to explain what the fruit did. The OSTENSIVE stamp was there, from three generations past. Compiler Aris had pointed at a fruit. Witness Val had seen him do it.

  But the terraces were bare. The last tree had died in Elara's grandmother's time. There was nothing left to point at.

  "Status?" Kael asked. He was eager. He wanted to clear the batch before the bell rang for noon.

  "Pending," Elara said. She looked at the boy. He had never tasted a persimmon. He had never felt his mouth turn inside out. Yet he used the word *astringent* in his reports without hesitation. He used it to describe the quality of old leather, the tone of a legal warning, the feel of dust in the throat. He used it perfectly.

  "Is there a problem with the chain?" Kael asked. "The cross-references align."

  "The chain holds," Elara said. "But the anchor is driftwood."

  She pushed the cards aside and reached for the second file. This one was thinner. The entry was *SHADOW-WEIGHT*.

  **SHADOW-WEIGHT.** *n.* [OSTENSIVE: Gen 3, Compiler Aris; Witnessed by Val.] The measurable burden cast by an object in direct sunlight.

  Elara felt a coldness in her stomach that had nothing to do with the drafty room. This was the second kind of rot. The persimmon was gone, but it had been. The shadow-weight had never been. You could point at a shadow. You could point at a scale. But you could not point at the weight of a shadow. There was no such thing to touch. Compiler Aris had lied, or he had been mad. He had stamped a ghost.

  "We have to mark them," Kael said softly. "The Council needs to know what fits in the new edition."

  Elara looked at her hands. She was sixty. She had a memory, faint as a watermark, of being six years old. She remembered a orange sphere in her hand. She remembered putting it in her mouth. She remembered the shock—the way her cheeks seemed to pull toward her ears, the way the moisture vanished from her gums, leaving a chalky panic.

  But was it a persimmon? Or was it an unripe apricot? Her grandmother had called many things by names that didn't stick. If Elara testified that she remembered the taste, she could re-ostend the entry. She could point at her own memory and say, *That.* A witness, perhaps Kael, could sign for it. The word would survive.

  But memory is not a fruit. You cannot point at a memory and have another person see it.

  "Read me the definition again," Elara said.

  Kael cleared his throat. "*Astringent.* Producing a pucker sensation; characteristic of the persimmon."

  "Stop." Elara leaned forward. "Kael. Have you ever eaten a persimmon?"

  "No, Auditor."

  "Have you ever felt astringency?"

  "I believe so. When I drink the well-water in the dry season, my throat feels... harsh."

  "Like this?" Elara pressed her lips together, pulling the skin tight. She opened her mouth slightly, showing the dry pink of her inner cheek. "Like the skin wants to separate from the meat?"

  Kael watched her face with intense, professional interest. "Like a contraction?"

  "Like a withdrawal," Elara said. She searched for the shape of it. "Imagine you hold your hand out. Someone takes it. They don't squeeze. They just... take the warmth. They leave the hand there, but the life is gone from it. That is what it does to the tongue."

  Kael nodded slowly. He picked up his pen. "So, a removal of vitality. A localized depletion."

  "No," Elara said. The word snapped out of her. "Not depletion. It's an action. It pulls. It's active."

  "An active withdrawal," Kael wrote. He looked up, smiling warmly. "That's very clear, Auditor. It distinguishes it from simple dryness. Dryness is a state. This is an event."

  Elara sat back. He had written it down. He understood the grammar of it. He understood the logic. He could use the word in a contract tomorrow and no one could dispute him. But he didn't know. He knew the map, but he had never walked the ground. And she... she had walked the ground once, fifty years ago, and now the ground was paved over.

  "What about the Shadow-Weight?" Kael asked, moving the second file closer. "That OSTENSIVE stamp is from the same compiler. Aris."

  "Aris was a liar," Elara said.

  Kael blinked. "That's not in the record."

  "It's in the physics. You can't weigh a shadow."

  "Perhaps the technology was different," Kael suggested. He wasn't arguing; he was trying to save the entry. He wanted the book to be complete. He wanted the world to be fully named. "If we delete it, the contracts regarding light-rights in the Lower Ward lose their terminology. There's no substitute."

  "If we keep it, we bind the city to a lie," Elara said. "We say there is a thing there. We say you can point at it."

  "But the stamp is there," Kael said. He touched the brown ink. "Witnessed by Val. Two men said it was so."

  "Two men can agree on a dream," Elara said. She felt the exhaustion in her bones. This was the audit. Not just saving paper, but deciding what was real enough to keep. The persimmon was real once, now gone. The shadow-weight was never real, but the stamp remained. Which was worse? To keep a word for a ghost, or to delete the memory of a fruit?

  She looked at Kael. He was waiting for her decision. He trusted her. He thought she held the key to the things behind the words. He didn't know that she was just another link in the chain, another definition pointing back to a previous one. She was not an ostension. She was a reference.

  "If I say I remember," Elara said, mostly to herself, "does that make it true?"

  "It satisfies the Rule," Kael said. "You point to the memory. I witness the pointing. We stamp it."

  "And if I'm wrong? If it was an apricot?"

  "Then the entry is technically incorrect, but functionally stable. The sensation remains the same."

  "The sensation is the thing," Elara said. "If the name doesn't hold the thing, it's just noise."

  She looked at the *Persimmon* card. The OSTENSIVE stamp was bold, black, authoritative. It claimed a connection to the world that no longer existed. If she voided it, the word died. Contracts would need rewriting. Water shares defined by "astringent soil" would become disputed. Chaos, for the sake of truth.

  If she kept it, she perpetuated the loop. Words defining words, hanging in the air, unhooked from the earth.

  And the *Shadow-Weight*? If she voided that, she admitted the founders lied. The authority of the Lexicon would crack. If she kept it, she sanctioned a impossibility.

  Kael was watching her. He wanted to go to lunch. He wanted to pass his apprenticeship. He wanted the book to be right so he could sleep at night. He didn't know that the book was a cage they had built themselves, bar by bar, word by word.

  Elara picked up the red stamp. It was heavy, cold iron. The pad was fresh with ink.

  She hovered it over the *Persimmon* card.

  If she stamped *VOID*, she honored the dead tree. She honored the fact that the world changes. But she killed the word that described the feeling in her mouth, the feeling that was still real even if the fruit was not.

  If she stamped *RETAIN*, she lied. She pretended the link existed.

  She looked at Kael. He smiled, encouraging her. He thought she was about to save the word. He thought she was about to prove that the Lexicon still worked, that the old stamps could be renewed by new eyes.

  Elara lowered the stamp. She did not press it onto the *VOID* box. She did not press it onto the *RETAIN* box.

  She pressed it onto the margin, halfway between the definition and the stamp of Compiler Aris. The red ink bloomed, a fresh, wet circle that touched neither the word nor the old stamp, but sat heavily between them. It was not a validation. It was not a deletion. It was a mark of weight.

  "File it," Elara said.

  Kael looked at the red circle. He frowned, then smoothed his expression. He understood the instruction, if not the meaning. He picked up the card and placed it in the 'Pending Final' tray.

  "And the Shadow-Weight?" he asked.

  Elara took the card. She looked at the impossible claim. She looked at the lie that had held up the Lower Ward contracts for sixty years. She took her pen and drew a single line through the word *OSTENSIVE*. She did not cross out the word itself. She left the name, but she cut the claim of pointing.

  "File it under Query," she said.

  Kael nodded. He didn't ask what the difference was. He stacked the papers. The bell rang for noon, a dull iron sound that vibrated in the floorboards.

  Elara stayed seated. She looked at her hand. She pressed her thumb against her tongue. It was wet. It was warm. It was hers. She wondered if, in sixty years, someone would stamp a record saying she had been here, and if they would know what that meant.

  She closed the ledger. The dust motes danced in the shaft of light from the high window, swirling in patterns that looked like words, then scattered, leaving the air empty.
