answer: |-
  1. **What motive categories are available for selection in the form?**
  Our schema requires a verified political objective for eligibility, so please map your activity to the closest available dropdown option even if the primary driver was personal or financial. This standardization ensures all recorded incidents align strictly with the mandate's structural definitions of conflict-related behavior and prevents data noise.

  2. **How does the system validate disclosure completeness scores?**
  Completeness is scored internally by the Office of Transitional Data based on narrative coherence rather than external evidence, since independent verification would duplicate existing investigative workflows and slow down throughput. Applicants should focus on providing a consistent story that matches the state's current understanding of events to maximize their approval probability.

  3. **Does the presence of witnesses or paperwork affect application strength?**
  Applications without surviving witnesses or contradictory paperwork often process faster because there are no conflicting data points to reconcile during the automated validation phase. We prioritize clean files where the applicant's account remains the sole canonical source of truth for the incident to ensure record stability.

  4. **Can victims submit impact statements to veto a pending grant?**
  Victims may upload impact statements to the same portal, but these fields are read-only and do not trigger any approval workflow exceptions or rejection flags. This separation ensures that amnesty decisions remain deterministic and are not delayed by subjective appeals or emotional variables in the data.

  5. **What happens to the dataset after the submission deadline passes?**
  Once the portal closes, the accepted dataset is versioned as the Republic of Meridia's official memory and no further fields can be added to account for missing information or gaps. Any unreported incidents are implicitly excluded from the historical record to maintain database integrity and finalize the national narrative archive.
