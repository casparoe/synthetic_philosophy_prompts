  *   **Weight on Modal Realism (Twin-Earth Laws) (0.35 influence):**
      *   *Analysis:* This is the biggest drag on the number. Does "inevitable" mean that in a Twin-Earth scenario with slightly different cognitive architectures or initial conditions, *calculus* (specifically) emerges? Or just *a functional equivalent*? If scientific laws are mind-independent Platonic truths waiting to be found, the number goes up. If science is a "mapping" process dependent on human cognition (Kantian/Cognitive), the number goes down.
