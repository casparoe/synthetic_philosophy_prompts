      *   *Jeffrey Conditionalization:* Updating probabilities $P_{new}(A) = \sum P_{new}(E_i) P_{old}(A|E_i)$. Key assumption: Rigidity ($P_{new}(A|E_i) = P_{old}(A|E_i)$). The partition $\{E_i\}$ is fixed and certain *as a partition*, even if probabilities shift.
      *   *The "Boundary-Drift" (Second-Order Uncertainty):* What if the $E_i$ themselves are vague, shifting, or uncertain? E.g., in climate science, what counts as "catastrophic warming" might shift as models improve. In AI, what counts as "aligned" might drift.
      *   *The Tension:* Philosophers often treat JC as a normative rule for ideal agents. Practitioners use it for messy, non-ideal data where partitions are fuzzy.
      *   *The Grant Context:* 3 years, philosophy/logic focus (formal epistemology), needs to be tractable but impactful.

  3.  **Evaluate the Research Questions:**

      *   *Q1: Fitting Uncertain Evidence into Partitions (The "Input" Problem).* How do you get the $P_{new}(E_i)$ in the first place without violating the spirit of JC?
