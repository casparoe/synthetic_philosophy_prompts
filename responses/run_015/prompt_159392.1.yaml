  5.  **Drafting - Paragraph 2 (Ethics & The "Extra Step"):**
      This leads directly to your charge that I am merely an emergentist with an extra step, but the difference is crucial because I am not saying experience magically pops into existence at a certain complexity threshold, but rather that the capacity for unity is built into the fabric of reality. If valence only matters morally when it is owned by a subject, and subjects only exist where there is significant integration, then the ethics of panpsychism looks much more like ordinary ethics than you fear. We do not owe duties to rocks because rocks do not care about themselves, not because they lack the intrinsic stuff of care, but because they lack the structure to hold that stuff together as a concern. So I take the third horn you offered, but I deny it is the ordinary view, because the ordinary view says the rock is dead inside until humans arrive, whereas I say the rock is alive with potential that remains unactualized as suffering. This preserves the moral intuition that feeding people matters more than rearranging stones, without requiring me to abandon the metaphysical claim that consciousness is fundamental.

