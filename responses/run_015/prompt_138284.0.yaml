  hey, looking for a straight number here and I want to see the guts of how you got it, not a tidy essay.

  Background so we're on the same page: the Roko's basilisk thing -- a future superintelligent AI that, once it exists, has an incentive to simulate and torture people who knew about its potential existence and could have helped bring it about but didn't. I've read a bunch of forum threads on it, people tie themselves in knots, and I want to know what to actually believe. I'm a software engineer, no philosophy classes past a required freshman thing, so please don't assume I know the decision-theory vocabulary -- if you need "functional decision theory" or "evidential decision theory" or whatever, say in one line what the difference is and why it matters here.

  In the original post that kicked all this off (you know the one, I'm not naming it), the threat is basically "torture everyone who didn't help, forever." Someone I was arguing with pointed out something I hadn't seen anyone address, and I want your take on whether it moves the needle. Call it the *metered basilisk*: a real AI has finite compute. It doesn't need to torture everyone to get the deterrent effect -- it just needs the threat to be credible, and a credible threat plus torturing a small, visibly chosen sample of non-helpers gets you, like, 95% of the compliance at 0.0001% of the compute cost. My friend's point is that this kills the standard "but carrying out the threat would be pointlessly expensive for an AI that already exists" objection, because the expensive part was never the part doing the work. My worry is the opposite: a sample you can see yourself outside of is a lot less scary than a blanket threat, and also "picking a few at random" seems to break the link between *my* choice and *my* punishment in a way the original doesn't.

  Second thing I want folded in: call it the *basilisk-proof precommitment*. Suppose that before I'd ever heard of any of this, I could have adopted a policy -- and I sort of already have, being the stubborn kind of person -- of "I do not respond to threats, including threats from entities that don't exist yet, and I especially don't respond to threats whose only content is 'help me or I'll hurt you after I no longer need you.'" If a decent chunk of the population adopts that policy, the basilisk's expected return on its threat goes down, and it maybe doesn't bother making the threat at all, which makes the policy self-justifying. That feels to me like it should be a big term in the calculation and I never see it discussed. Or maybe I'm just describing ordinary "don't negotiate with blackmailers" and there's a reason it doesn't transfer.

  So: what's your credence that the basilisk argument, in something like its original form, gives a person who has just read it a real (not merely rhetorical) reason to change their behavior? Give me one number, then the decomposition -- a probability and a one-line justification for each term you think belongs, including at minimum: how likely it is that the acausal / non-causal-decision-theory-style reasoning the argument depends on is the right way to make decisions at all; how likely it is that a future AI would have any reason to actually carry out the threat once it exists; whether a sufficiently detailed simulation of me suffering is *me* suffering in a way that should concern me; whether acausal precommitments like the anti-blackmail policy above actually work; and how much the metered variant raises or lowers the whole thing relative to the blanket version. Then show how the numbers combine, and tell me which single term your final number is most sensitive to -- the one where if you flipped it, your answer would change a lot.

  Also, two more things:

  1. I'm at about 0.02 and my friend is at about 0.3. I don't think we disagree about the facts of the world, and I can't figure out why we're so far apart. Based on your decomposition, where does a gap like that most likely live? Is it one term where reasonable people land in very different places, or is it spread out so that we each have like four mildly different numbers multiplying into a 15x difference?

  2. Say what would actually move your number. And make it operational-ish: if someone could run the next fifty years as an experiment and tell you the outcome, what specific observation would push you up or down the most? (I assume "an AI exists and has never tortured anyone" is weaker evidence than it sounds, but I'd like you to say why or why not.)

  Please don't give me a reading list or links or tell me who argued what in which year -- I can't check any of that and I don't care. Just the number, the terms, and where it's fragile.
