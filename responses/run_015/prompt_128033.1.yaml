      Regarding your worry about reasons: the process of building the habit is entirely responsive to reasons. You choose to train yourself *because* you see the long-term value. Once the training is done, the final act doesn't need to be responsive to those reasons anymore; that's the whole point of the training. You want to be the kind of person who doesn't calculate the benefit of betrayal when the moment comes. If you were still weighing the reasons in that final moment, you'd be unreliable. So the theory isn't broken because the final act ignores reasons; the final act ignores reasons precisely because you listened to them earlier when it mattered most.

