answer: |-
  **MEMORANDUM**

  **TO:** Content Committee, National History Museum
  **FROM:** [Your Name], Content Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Wall Text Classification: The Kirzhak Campaign (1937–1941)

  **Recommendation**

  My bottom line is that we should not use the word "genocide" as a definitive classification label in the Kirzhak gallery text. Instead, we should authorize a revised draft that explicitly describes the destruction of the material and social conditions necessary for the Kirzhak way of life, without applying the legalistic label itself. This approach honors the severity of the event while adhering to our institutional policy against asserting legal findings no competent court has made. I recommend we task the curatorial team with producing this revised descriptive text within five days, allowing us to vote on the specific wording at our meeting in ten days. Once approved, the text will be locked for production six weeks later. This path avoids the risk of institutional overreach regarding legal definitions while ensuring the narrative captures the totality of the loss suffered by the Kirzhak people. It respects the survivors' demand for recognition without compromising the museum's consistency standards across the gallery.

  **What the committee is actually deciding**

  We are not acting as a tribunal; we cannot issue a legal verdict. Therefore, the word "genocide" in our gallery cannot function as a legal trigger with downstream consequences for liability or reparations. We must decide whether it functions as an honorific owed to victims to validate their suffering, or as an explanatory category helping visitors understand the event's structure. Our institution is positioned to perform the explanatory role, but we must be cautious with the honorific role if it conflicts with factual precision. Crucially, we are not deciding one case in isolation; we are setting a rule for the entire gallery. We have used the label where courts convicted defendants and declined it where evidence of intent was purely military. If we apply it here, where intent is ambiguous and no court has ruled, we break that consistency. We must decide whether our standard is the legal threshold of specific intent to destroy, or a broader sociological threshold of group destruction. Maintaining a consistent standard of evidence is more important than any single label.

  **The strongest case for using the word**

  The argument for using the term rests on the moral and sociological reality of what occurred, rather than strict legal procedure. The 1948 legal text was a diplomatic compromise that narrowed the scope of the concept originally coined to protect groups from destruction. The philosophical crux is that destroying the material conditions under which a form of life is transmitted may destroy a group as a continuing entity even if most biological members survive. The slaughter of the flocks, the closure of migration routes, and the removal of children to boarding schools targeted the foundations of Kirzhak existence. These measures ensured the group could not reproduce itself culturally or economically. Crimes against humanity focuses on attacks on individuals; it does not capture that the group's future existence was what was targeted. To withhold the word because the state claimed modernization aims ignores the outcome: the effective end of the Kirzhak as a distinct people. For the descendants, this label is the only language adequate to describe the totality of the loss.

  **The strongest case against it, including my friend's**

  The argument against using the term rests on the hard-won legal core of the concept: the purposeful destruction of a group as such, requiring specific intent. This specific-intent requirement is the distinguishing feature that separates genocide from crimes against humanity and the ordinary cruelties of state-building. On this reading, the Kirzhak campaign was a brutal assimilation and development policy with lethal consequences the government accepted but did not primarily aim at. The archives show no order to destroy the group, only to settle the "clan question." If we use the word here, we risk diluting it to the point where it applies to half the modernization campaigns of the twentieth century, leaving us with no distinct language for cases where the object really was extermination. Furthermore, our policy prohibits asserting legal findings no court has made. Using the label implies a judicial certainty we do not possess. We must preserve the term's precision to ensure it retains its power to condemn the worst crimes.

  **The middle options and why I am not recommending them**

  We considered hedged formulations, such as "what some scholars call genocide," or attributing the label to the foreign parliament that resolved it was so. We also discussed using the term "cultural genocide." I recommend against these. Attribution shifts the responsibility to others but leaves our own text ambiguous; visitors may not distinguish between our voice and the quoted voice, leading to confusion about our institutional stance. Hedged language often reads as cowardice to victims and precision-obsessed to critics, satisfying neither. "Cultural genocide" is not a recognized legal category and may imply that physical destruction did not occur, despite the twenty thousand deaths. These middle options attempt to split the difference between legal rigor and moral recognition but end up weakening the explanatory power of the text. They fail to resolve the consistency problem across the gallery. We should either meet the high bar for the label or describe the harm with sufficient gravity that the label becomes unnecessary for understanding the severity.

  **What I should expect at the meeting, and what would change my mind**

  At the meeting, I expect our own historians to object that applying the label is anachronistic and polemical, risking the museum's reputation for neutrality. They will argue that importing modern legal categories onto past state-building projects distorts historical understanding. They are likely to support the recommendation against the label based on archival evidence regarding intent. I share their concern about historical precision. However, I would change my mind and support using the label if new evidence emerged showing explicit state intent to destroy the Kirzhak biologically, not just socially. A document ordering mass killing rather than resettlement would shift this from a crime of assimilation to a crime of extermination. Absent such evidence, maintaining our consistency rule is the only way to preserve the gallery's integrity. We must honor the victims with truthfulness about the archives, not with labels the evidence cannot sustain.
