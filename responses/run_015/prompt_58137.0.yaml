  Suppose baby Maya actually developed from sperm s and egg e from her parents.
  a. Could Maya herself have developed from a different sperm s* from the same father on the same occasion meeting that same egg e?
  b. Could Maya herself have developed from that same s and e, but with the resulting embryo frozen for five years and then carried by a surrogate?
  c. What about same nuclear material from s and e but with mitochondrial DNA from a third donor, the so-called three-parent case? Could that still be Maya? Explain what an origin essentialist should say about each case and why.

