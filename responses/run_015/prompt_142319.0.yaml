answer: |-
  **Memo: Superrationality in MARL and Causal Vocabulary**

  **Ingredients and Assumption Flags**
  To translate superrationality without loss, we must isolate five components:
  1.  **Rationality:** Not convergence to a local loss minimum, but adherence to a normative reasoning protocol.
  2.  **Sameness:** Logical identity of source code, not just parameter proximity.
  3.  **Counterfactual:** Evaluation of "If I output $A$" as "If the algorithm outputs $A$," not "If I physically execute $A$."
  4.  **Fixed-Point:** The action is a stable point of the reasoning function shared by agents.
  5.  **Payoffs:** Standard utility, but conditioned on logical correlation rather than causal independence.

  **Flagged Assumption:** Your framing assumes Causal Decision Theory (CDT). You state: "intervening on my action severs the correlation." In standard SCMs, $do(A_i)$ severs edges from parents of $A_i$. Superrationality rejects this graph structure. It posits a logical node (the algorithm) that is a common cause of both $A_i$ and $A_j$ which cannot be severed by a physical intervention on $A_i$ alone. Your framework treats the correlation as spurious (latent confounder); superrationality treats it as structural (logical identity).

  **Translation: The Case for Superrationality**
  Restated in your vocabulary: In a one-shot Prisoner's Dilemma between agents running identical policy networks $\pi_\theta$, the superrationalist argues you should not optimize $\mathbb{E}[U | do(A_i = C)]$ (CDT), but rather $\mathbb{E}[U | \text{Algorithm}(\text{input}) = C]$ (FDT/EDT).

  **Which node is intervened on?**
  You are correct that intervening on the physical action node $A_i$ severs the correlation in a standard SCM. The superrationalist intervenes on the **policy function node** $\pi$. In an augmented SCM, there is a node $L$ (Logical State) representing the output of the algorithm given the input. $L$ causally influences both $A_i$ and $A_j$. The intervention is $do(L = C)$, which implies $A_i = C$ and $A_j = C$ simultaneously. This is not a physical intervention expressible in standard do-calculus over physical events; it is an intervention on a mathematical fact.

  **Solution Concept:**
  You are right that mutual cooperation is not a Nash Equilibrium (NE) or Correlated Equilibrium (CE) in the standard sense. In a CE, a signal correlates actions, but defection remains a best response to the signal $C$. Superrationality selects a **Program Equilibrium** (Tennenholtz) or **FDT Equilibrium**. It requires the policy $\pi$ to be a fixed point of the reasoning operator: $\pi^* = \arg\max_\pi \mathbb{E}[U(\pi, \pi)]$. This differs from self-play best response ($\arg\max_\pi \mathbb{E}[U(\pi, \pi^*)]$) because the opponent's policy varies with yours by logical necessity, not by gradient update. Self-play with shared parameters smuggles in a causal channel (the gradient update step) that the original one-shot argument lacks; superrationality requires the correlation to exist *without* communication or update, solely via logical identity.

  **The Divergent-Checkpoint Dilemma**
  (i) **Similarity Metric & Threshold:** The metric is **logical equivalence on the current input**, not parameter distance ($||\theta - \theta'||$). The recommendation flips exactly when the $k$ gradient steps change the policy's output on this specific state: $\pi_\theta(s) \neq \pi_{\theta'}(s)$. This is a discontinuous threshold. If $k$ steps alter the decision boundary for $s$, logical correlation breaks, and CDT dominates (defect). There is no principled basis for partial cooperation; it is binary based on output identity.

  (ii) **Compute Budget:** The verdict depends on **logical uncertainty**, not hardware directly. If you cannot simulate the $k$ steps, you assign a probability $p$ to the proposition "Twin outputs C". Superrationality (via FDT) says cooperate if $p \cdot 3 > (1-p) \cdot 5 + 1$ (roughly). However, if the view claims you *ought* to cooperate regardless of your ability to verify the twin's output, it demands omniscience. Treating hardware dependence as a genuine feature reduces superrationality to bounded rationality; treating it as irrelevant makes the theory empirically unfalsifiable. I treat it as a **reductio**: if the recommendation relies on logical facts you cannot compute, the normative force collapses into guesswork.

  (iii) **The $\epsilon$ Defect Bot:** This breaks logical symmetry. The twin is now a mixture: $(1-\epsilon)\pi_\theta + \epsilon \pi_{\text{defect}}$. Your action cannot logically control the $\epsilon$ component. The expected utility of Cooperate is $(1-\epsilon)3 + \epsilon(0)$. The expected utility of Defect is $(1-\epsilon)1 + \epsilon(1) = 1$. Cooperate is preferred only if $3(1-\epsilon) > 1 \Rightarrow \epsilon < 2/3$. However, FDT agents typically defect here because the logical link is probabilistic. If the twin might be a defect bot, your action no longer logically determines theirs with certainty. The "catastrophic worst case" is irrelevant to expected utility, but the breakdown of logical control is fatal to the superrational argument. The view recommends **Defect** for any significant $\epsilon$, as the logical leverage is diluted.

  **Residue Report**
  **Translated without loss:** Payoff structures, policy parameterization, the distinction between physical action and algorithmic output.
  **Translated with distortion:** "Intervention." I had to stretch the do-operator to cover logical facts ($do(\text{Algorithm}=C)$), which standard SCMs exclude as non-physical. "Equilibrium." I had to replace Nash/CE with Program Equilibrium, which assumes agents can read each other's source code or logical identity, violating the standard information set of a one-shot game.
  **No expression:** **Normative Rationality.** Your vocabulary optimizes for *performance* (loss minimization, regret), not *correctness of reasoning*. ML describes how parameters *do* update; superrationality prescribes how agents *should* reason. The gap between "policy is optimal for the loss landscape" and "action is optimal for the agent" is unbridgeable in pure ML terms. ML has no variable for "reasoning process" independent of "parameter update."

  **Verdict**
  The residue shows that the superrational claim is **less determinate than it sounds** when stripped of its metaphysical padding. It relies on a category—logical causation—that your SCM vocabulary correctly identifies as non-existent in physical systems. Your labmate's claim that you "failed to reason correctly" is false in the physical world; you correctly identified that $do(A_i)$ does not influence $A_j$. Superrationality only holds in a platonic realm where algorithms are causally potent entities.

  Your vocabulary is not missing anything a decision theorist needs; rather, superrationality imports a metaphysical assumption (logical identity implies causal leverage) that MARL SCMs rightly reject. The "fixed point" superrationality seeks is not a property of the physical game, but of an abstract logical graph that does not map to your logged data. If you want to capture this, you must model **logical uncertainty** over the opponent's source code, not physical causality over actions. Until then, the 26 defectors were causally correct; the 4 cooperators were logically hopeful.
