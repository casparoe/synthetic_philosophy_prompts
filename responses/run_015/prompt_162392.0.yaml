answer: |-
  **Exam Question**

  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Question:**
  Standard accounts of "standing to blame" focus on hypocrisy: a blamer lacks standing if they are guilty of the same wrong, implying they cannot coherently demand compliance with a norm they violate. However, consider the following "unqualified" blamers who do not fit the hypocritical model:

  *   **Case A (The Saint):** S has never been tempted by wrong *X* and cannot imaginatively grasp the pressure leading T to commit *X*. S blames T for *X*. T retorts, "You of all people have no idea what this is like."
  *   **Case B (The Manager):** M enforces a rule strictly against subordinates but routinely waives it for peers and superiors. M has not violated the rule themselves (they have the power to waive it), but they benefit from the hierarchical arrangement that makes violation the "path of least resistance" for subordinates. M blames a subordinate for violating the rule.

  Critically evaluate whether the standard machinery of standing applies to these cases, or whether 'standing' fractures into distinct phenomena (e.g., fairness, epistemic position, authority). In your answer, you must address:

  (a) **The Nature of the Defect:** Is blame without standing in these cases *infelicitous* (analogous to an assertion made without knowledge, where the content may be true but the act is void) or is it a *distinct wrong* (where the target may properly resent the blaming act itself)? How does the target's appropriate response help us decide?
  (b) **The Self-Blame Problem:** If standing tracks the blamer's record or relationship to the norm, does an unrepentant agent lack standing to blame *themselves*? If so, is this a reductio of the standing condition? If not, why is self-blame exempt?

  ***

  **Model Answer**

  The standard hypocrisy account locates the loss of standing in the blamer's implicit commitment to a norm they violate. This explains why the hypocrite's blame is rejected: they forfeit the right to demand what they flout. However, the "unqualified" blamers in Case A and Case B suggest standing is not merely about consistency, but about *moral reciprocity* within a specific relationship. I argue that the standard machinery must be expanded, not abandoned: standing requires that the blamer participate in the normative community as an equal, without exploiting structural advantages or epistemic isolation that render the demand unfair.

  Regarding (a), the defect in unqualified blame is a *distinct wrong*, not merely a conversational infelicity. If blame were like assertion, lacking standing would render the act void but not necessarily objectionable; the target might correct the blamer ("You don't know that") but not resent them. In Case A and B, however, the target's appropriate response is not correction but *rejection of authority*. The Saint's blame feels alienating because it treats the target as an object of judgment rather than a fellow participant in a shared moral struggle. The Manager's blame is resented because it asserts authority while evading the burdens of that authority. We know this is a wrong because the target is entitled to feel aggrieved, not just informed. The reactive attitude of indignation is fitting in response to blame without standing, just as resentment is fitting in response to wrongdoing. If it were mere infelicity, indignation would be disproportionate.

  This distinction is crucial for (b), the self-blame problem. If standing is a condition on the *interpersonal* demand for accountability, it does not apply to self-blame in the same way. Self-blame is not an assertion of authority over another; it is an acknowledgment of one's own failure to meet a standard one accepts. Therefore, an unrepentant agent does not lack "standing" to blame themselves, because the reciprocity condition is internal. The reductio only arises if we conflate interpersonal standing with intrapersonal coherence. An agent can coherently judge themselves harshly even if they lack the moral clean hands required to judge others. To argue otherwise is to confuse the *right to demand* (which requires standing) with the *obligation to acknowledge* (which does not). Self-blame is the acknowledgment of the obligation, not the exercise of a right over another.

  Thus, standing unifies around the concept of *fair moral address*. The hypocrite, the Saint, and the Manager all fail because their position renders the address unfair: the hypocrite by exemption, the Saint by isolation, and the Manager by exploitation.

  The hardest objection to this view is that it collapses standing into general fairness. If any unfairness removes standing, the concept loses its specific utility and becomes a catch-all for "bad blaming." One might concede that the line is blurry: not every epistemic gap (like the Saint's) removes standing, only those that sever the shared moral experience necessary for the reactive attitudes to function as glue rather than weapons. The challenge is to specify when an epistemic gap becomes a moral disconnect without making standing too easy to lose.

  ***

  **Marking Scheme**

  **Total Marks:** 20

  | Criterion | Marks | Must-Hit Point | Common Error (Middling Student) |
  | :--- | :---: | :--- | :--- |
  | **1. Diagnosis of "Unqualified" Cases** | 4 | Clearly distinguishes the "Saint/Manager" cases from standard hypocrisy (i.e., notes the blamer hasn't necessarily violated the norm). | Conflates the Manager with standard hypocrisy or dismisses the Saint as irrelevant/epistemic only. |
  | **2. Unity vs. Fracture of Standing** | 4 | Takes a clear position on whether 'standing' covers these cases (unified theory) or fractures into different concepts (fairness/authority). | Hedges without committing; claims "it depends" without offering a unifying principle or clear distinction. |
  | **3. Nature of the Defect (Infelicity vs. Wrong)** | 4 | Argues for one category and uses the *target's response* (correction vs. resentment/indignation) as the test case. | Asserts it is a "wrong" but fails to explain how we know (i.e., ignores the prompt's instruction to look at the target's response). |
  | **4. The Self-Blame Sub-question** | 4 | Explains why self-blame is exempt from interpersonal standing conditions (avoids the reductio) OR accepts the reductio and defends it. | Applies the interpersonal standing condition directly to self-blame, leading to a contradiction they cannot resolve. |
  | **5. Argumentative Coherence & Objection** | 4 | Maintains a consistent thesis throughout (a) and (b) and identifies a substantive objection (e.g., the "collapse into fairness" worry). | The answer to (a) contradicts (b) (e.g., calling it a wrong but treating self-blame as void); objection is trivial or straw-manned. |

  **Grading Notes:**
  *   **17–20 (Distinction):** Clear thesis, sophisticated handling of the self-blame distinction, precise use of the "target's response" test.
  *   **14–16 (Merit):** Hits all 5 points but may be less nuanced on the objection or slightly wobbly on the infelicity/wrong distinction.
  *   **11–13 (Pass):** Addresses the prompt but relies on stock hypocrisy answers; struggles to separate the "Saint" from standard epistemic ignorance.
  *   **0–10 (Fail):** Fails to address (a) or (b); confuses standing with the truth of the blame; or simply restates lecture notes on hypocrisy.
