answer: |-
  This is a classic stalemate in historical sociology, and your intuition that it "didn't feel clean" is correct. If this were merely a verbal dispute, you could resolve it by stipulating definitions and moving on. But you can't, because the disagreement persists even when you clarify terms.

  My diagnosis is that this is a **hidden empirical question about causal necessity**, obscured by **ontological slippage**.

  It is not merely verbal, nor is it simply two different questions. It is a disagreement about the *constraints on social construction*. Your friend (Smith) is making a claim about the limits of human engineering: you cannot build a modern nation without premodern mortar. You (Anderson/Hobsbawm) are making a claim about the power of modern infrastructure: the machinery itself generates the cohesion, and the "mortar" is just aesthetic cladding applied afterward.

  Here is the argument for this diagnosis, using the claims you outlined, followed by what would actually count as progress.

  ### 1. Why it is not (just) a verbal dispute
  If this were purely verbal, you would agree on the history of, say, Finland or Greece, but label the entities differently. You would say, "There was a premodern ethnic group, but not a nation." Your friend would say, "There was a premodern nation-ethnie."

  But that's not what's happening. The disagreement is about **counterfactuals**.
  *   **Your claim (Modernist):** If you took the same premodern population and applied different modern myths (e.g., linked them to a different homeland or ancestor), the nation would still form, provided the print capitalism and state infrastructure were there. The specific content of the myth is contingent.
  *   **His claim (Ethnosymbolist):** If you tried to link that population to a *different* homeland or ancestor, the movement would fail. The specific content of the myth is necessary.

  This is an empirical claim about human psychology and group cohesion, not a definition. He is arguing that "raw material" constrains the "architect." You are arguing that the "architect" (the nationalist intellectual) can reshape the "raw material" at will.

  ### 2. The Core Empirical Dispute: Constraints on Invention
  The "strongest move" your friend made ("you can't mobilise people out of nothing") is the crux of the empirical disagreement. This is the **Causal Necessity** thesis.

  *   **Smith's Position:** Premodern *ethnies* provide the "myth-symbol complex" that makes mass mobilization psychologically possible. Without a pre-existing sense of "we" (even if vague or elite-focused), the modern nationalist message falls on deaf ears. The past does *causal work*.
  *   **Anderson's Position:** The "sense of we" is produced *simultaneously* with the mobilization via the medium of communication (the novel, the newspaper). The past is ransacked *after* the fact to legitimize the present. The past is *raw material*, but it is infinitely malleable.

  The dispute is: **Is the premodern past a *foundation* (Smith) or a *quarry* (Anderson)?**
  *   A foundation limits what you can build on top of it.
  *   A quarry provides stones you can use to build anything you like.

  ### 3. The Ontological Slippage (Why it feels verbal)
  The reason this empirical dispute feels like a verbal one is that you are using the word "nation" to track different **units of analysis**.

  *   **You (Modernist):** You are tracking the *political form*. A nation is a sovereign community of mass participation. Since sovereignty and mass participation are modern, the nation is modern.
  *   **He (Ethnosymbolist):** He is tracking the *cultural content*. A nation is a named community with a myth of ancestry. Since these exist in the Middle Ages, the nation (or its direct progenitor) is old.

  This is "two different questions under one name," but it fuels the empirical fight. Because Smith defines the nation by its *cultural continuity*, he naturally finds evidence of it in the past. Because you define it by its *political function*, you naturally find evidence of it only in the modern era.

  However, Smith bridges this by arguing the cultural content *causes* the political form. That is why you can't just agree to disagree on definitions. If he were only saying "medieval people had ethnic feelings," you could say "Sure, but that's not a nation." But he is saying "Medieval ethnic feelings *made* modern nations possible." That forces you into an empirical argument about causality.

  ### 4. What counts as progress?
  You asked whether we should expect progress. In philosophy of social science, this is a tough spot because both sides can explain the same data (the "underdetermination of theory by data"). However, progress is possible if you stop asking "How old is the nation?" and start asking **"Under what conditions does invention fail?"**

  To move forward, you need to shift from **Conceptual Analysis** to **Negative Case Studies**.

  **A. The "Artificial Nation" Test**
  If you are right (Modernist), it should be possible to create a stable nation where there was *no* premodern ethnie, provided the modern infrastructure is strong enough.
  *   *Case:* **Tanzania.** Nyerere deliberately constructed a national identity (Swahili language, Ujamaa ideology) across hundreds of distinct ethnic groups with no prior shared "myth-symbol complex."
  *   *Case:* **Singapore.** A multi-ethnic state with a deliberately constructed "Singaporean" identity that overrides deep ethnic cleavages.
  *   *Case:* **Soviet Central Asia.** Stalin's bureaucrats drew borders and created "national" identities (Kazakh, Uzbek) where fluid tribal identities existed before.
  *   *Progress:* If these cases hold as stable nations, it weakens Smith's claim of *necessity*. If they are perpetually unstable or revert to ethnic conflict, it strengthens Smith.

  **B. The "Failed Nationalism" Test**
  If your friend is right (Ethnosymbolist), nationalist movements that lack a premodern ethnie should consistently fail.
  *   *Case:* **Pan-Africanism or Pan-Arabism.** These movements often struggle to achieve the same "taken-for-granted" status as smaller, ethnically homogeneous nationalisms. Is this because they lack the "deep" mythic roots Smith describes?
  *   *Case:* **Biafra.** Did it fail (in part) because the "Biafran" ethnie was too new compared to the Igbo ethnie?
  *   *Progress:* Identifying *why* certain nationalisms fail allows you to test the "constraint" hypothesis.

  **C. The "Malleability" Test**
  You need to test your claim that the past is just a quarry.
  *   *Case:* **Israel.** The Zionist movement successfully revived Hebrew and linked modern immigrants to ancient Israelites. This looks like Smith's win (deep roots).
  *   *Case:* **Turkey.** Atatürk's reforms deliberately severed the link to the Ottoman/Islamic past and emphasized pre-Islamic Central Asian roots. The nation survived the surgery. This looks like Anderson's win (the state can redirect the myth).
  *   *Progress:* Comparing cases where the myth was *continuous* (Israel) vs. cases where the myth was *switched* (Turkey) helps determine how much the specific content of the past actually matters.

  ### Verdict
  You are not just talking past each other. You are fighting over the **elasticity of social reality**.

  *   **Your view:** Social reality is highly elastic; modern structures can stretch human loyalty to fit new borders.
  *   **His view:** Social reality has a grain; if you push against the grain (the premodern ethnie), the wood splits.

  **Diagnosis:** Hidden Empirical Question (Causal Necessity).
  **Path to Progress:** Stop debating definitions of "nation." Debate the **failure rate of state-led nation-building in the absence of premodern ethnic cores.** If states can successfully manufacture cohesion without premodern myths (Tanzania, Singapore, USA to an extent), you win. If those states remain fragile or rely on importing ethnic myths (e.g., the US relying on British/European cultural hegemony), he wins.

  Expect no final verdict, because "success" and "failure" in nation-building are themselves contested. But shifting the ground to *comparative resilience* moves you from metaphysics to political science.
