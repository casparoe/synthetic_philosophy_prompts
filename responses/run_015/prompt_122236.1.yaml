answer: |-
  ### Session Plan: The Complicity Gradient

  #### 1. The Foundational Dependency
  Before you introduce the gradient, you must lock in **the rejection of the "But-For" Test as the sole criterion for responsibility.**

  Engineers and rationalists default to counterfactual causality: *If I hadn't acted, would the outcome have changed?* If the answer is "no" (because the election was a landslide), they conclude their moral responsibility is zero. This makes the complicity gradient feel like hand-wavy mysticism.

  You need them to accept **Participatory Liability** as a distinct variable from **Causal Efficacy**. Frame it like this: "In a joint enterprise, shareholders bear liability for the corporation's actions even if their individual vote didn't swing the board decision." Lock this in by getting agreement that being a *component* of a mechanism confers some share of the output's moral weight, regardless of whether that component was the bottleneck. Without this, the gradient collapses back into a binary "decisive/not decisive" switch.

  #### 2. The Carrying Example
  **Scenario:** A Ranked-Choice Voting (RCV) ballot for a local office with real power (e.g., District Attorney).
  *   **Option A (1st Choice):** A write-in candidate who is morally perfect but structurally ineligible to win (e.g., they missed the filing deadline, or local law bars write-ins from advancing to the runoff).
  *   **Option B (2nd Choice):** A viable candidate who is objectively harmful (e.g., supports punitive policies you oppose) but prevents Option C.
  *   **Option C (Implicit/3rd Choice):** A viable candidate who is catastrophic (e.g., supports human rights violations).

  **Properties this example needs:**
  *   **Structural Impossibility:** Option A must be impossible to win, not just unlikely. This kills the "what if everyone did it?" coordination escape hatch.
  *   **Tangible Harm:** Option B's "badness" must be concrete (policy harm), not just "less optimal." This ensures the "lesser evil" tension is real, not just preference sorting.
  *   **Mechanism Transparency:** The RCV system must be explained simply: if A fails, your vote transfers to B. You are causally feeding B's mandate.

  **Properties it must avoid:**
  *   **Viability Ambiguity:** Do not allow debate on whether A *could* win. Stipulate it as a fact.
  *   **Moral Equivalence:** Do not let Option B be "good but flawed." They must feel dirty ranking B.
  *   **Complex Math:** Do not get bogged down in RCV elimination rounds. The transfer happens; that's all that matters.

  #### 3. The Teaching Arc

  **Phase 1: The Causal Trap (15 mins)**
  *   Walk through the standard rationalist calculation: $Expected Utility = (Probability of Decisiveness) \times (Utility Difference) - Cost$.
  *   Have them calculate the probability of decisiveness in a landslide. It will be near zero.
  *   **Head off Misconception 1 ("One vote never matters so there's no duty"):** Do not argue the math. Stipulate that $P(decisive) \approx 0$. Acknowledge that on pure consequentialist grounds, voting is irrational. This validates their intuition so they don't fight it. Then pivot: "If causality is zero, why do we feel uneasy about abstaining? What variable is missing?"

  **Phase 2: Introducing the Gradient (20 mins)**
  *   Introduce **Participatory Liability**. Use the shareholder analogy locked in during the dependency phase.
  *   Apply it to the example: Ranking Option B makes you a shareholder in Option B's victory, even if you weren't the swing vote.
  *   **Head off Misconception 2 ("Expressive voting is just virtue signaling"):** When they suggest voting Option A to "send a message," reframe it. Signaling is for an audience; integrity is for the agent. Ask: "If no one ever saw your ballot, would ranking Option B still feel like a compromise?" If yes, then the cost is internal integrity, not external signal. The gradient isn't about looking good; it's about how much moral dirt you agree to handle.

  **Phase 3: The Hand-Washing Fallacy (20 mins)**
  *   Present the abstention option. "If I don't vote, I'm not complicit."
  *   Challenge this using the Joint Enterprise model. By living in the jurisdiction and accepting the protection of the office, you are a beneficiary of the system. Abstaining leaves the decision to others while you keep the benefits.
  *   **Head off Misconception 3 ("Abstaining makes me blameless"):** Show that abstention isn't opting out of the game; it's opting out of *influence* while remaining subject to the *outcome*. You retain baseline complicity in the system's existence without gaining the mitigating factor of trying to minimize harm.

  **Phase 4: Synthesis (15 mins)**
  *   Map the gradient:
      *   **High Causal / High Complicity:** The swing voter for the Bad Candidate.
      *   **Low Causal / High Complicity:** The landslide voter for the Bad Candidate (your case).
      *   **Low Causal / Medium Complicity:** The voter for the Lesser Evil (you tried to mitigate, but still enabled).
      *   **Zero Causal / Baseline Complicity:** The abstainer (you didn't act, but you didn't resist).
  *   Emphasize that the goal isn't to reach zero complicity (impossible), but to navigate the slope consciously.

  #### 4. The End-of-Session Check
  Do not ask them what they would do. Ask them to evaluate a third party's moral status in a specific scenario.

  **The Prompt:**
  "Two people live in a district where the Bad Candidate wins 60% to 40%.
  *   **Person X** voted for the Bad Candidate.
  *   **Person Y** abstained entirely.
  Using the complicity gradient, is Person X *infinitely* more responsible than Person Y, *slightly* more responsible, or *equally* responsible? Explain why the margin of victory matters or doesn't matter."

  **Passing Criteria:**
  They fail if they say "Equally" (ignores input integrity) or "Infinitely" (reverts to pure causality).
  They pass if they argue **"Slightly more."** They must articulate that Person X added specific input to the mechanism (increasing their share of liability), while Person Y retains the baseline liability of benefiting from the system without intervening. They must acknowledge that the 60% margin renders causal impact negligible for both, yet the *act of alignment* distinguishes them.

  #### 5. The Refusal
  Openly refuse to cover **Pivotal Probability Calculus.**

  Tell them: "We are not spending time estimating the odds of a tie. In any election large enough to matter, that number is effectively zero. If you anchor on calculating $P(decisive)$, you will never escape the nihilism trap. We are stipulating $P=0$ to force the ethical model to stand on its own legs without utilitarian crutches."

  This prevents the session from devolving into arguments about statistical models and forces them to engage with the ethical framework you're building.
