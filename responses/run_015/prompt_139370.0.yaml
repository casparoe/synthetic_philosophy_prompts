answer: |-
  Here is the diagnosis you asked for, without the hedging.

  ### The Diagnosis

  You are right to separate the complaints, and your hypothesis about (a), (b), and (c) is closer to the truth than 90% of the literature. However, I am going to refine your split slightly and commit to a specific hierarchy.

  **The Verdict:** The "Born Rule Problem" in Everettian QM is not a single problem. It is a confusion arising from applying a macroscopic concept (probability of outcomes) to a fundamental ontology (unitary wavefunction) without rigorously defining the interface between them.

  Your category **(c) — the formal/structural role of decoherence** — is indeed doing the heavy lifting, but not in the way you might fear. It is not that decoherence "sneaks in" the probabilities. It is that **decoherence defines the events to which probabilities can attach.**

  Without (c), questions (a) and (b) are ill-posed. You cannot ask "what should I bet on?" (a) or "which branch is real?" (b) if "branch" is not a well-defined concept. In a fully coherent, reversible evolution (like your recombination scenario), there are no branches, only a single evolving vector. There is no "which branch am I on?" because the answer is "none."

  Therefore, my diagnosis is this: **The Born Rule is not a law of fundamental dynamics; it is a law of macroscopic records.** It emerges only when the dynamics create effectively irreversible correlations (decoherence) that allow for self-locating uncertainty.

  ### Addressing Your "Recombination" Hobby Horse

  Your intuition here is correct and cuts through the noise. Every derivation that relies on "branch counting" or "betting on futures" implicitly assumes a **Persistent Branching Structure**.

  In your Wigner's Friend/recombination setup:
  1.  **During the superposition:** There is no fact of the matter about "which outcome occurred." There is no branch to be on. Asking for the probability of being on branch A *during* the coherent evolution is a category error, like asking for the temperature of a single molecule.
  2.  **At the final measurement:** When the box is opened and the state is irreversibly recorded in the environment, *then* the branching structure becomes robust. *Then* self-locating uncertainty applies. *Then* the Born Rule dictates the statistics of the records.

  The derivations (Deutsch-Wallace, Zurek, etc.) are not wrong, but they are **conditional**. They prove: *IF* the universe decomposes into effectively non-interfering sectors (branches), *THEN* a rational agent must weight them by squared amplitude.

  They do not prove that the decomposition happens. That is the job of decoherence theory (your category c). The "gap" you sense is that people often present the decision-theoretic derivations as solving the *ontology* problem, when they are only solving the *normativity* problem conditional on the ontology.

  ### The Commitment

  Here is where I stand, explicitly:

  **1. Which diagnosis is right?**
  The "Verbal/Structural Hybrid" diagnosis.
  *   **Verbal:** Part of the confusion is indeed linguistic. We are trying to map the word "probability" (which evolved to describe ignorance of *what happens*) onto a reality where *everything happens*. The solution is to redefine probability in MWI as **self-locating uncertainty regarding which macroscopic record an observer will access.**
  *   **Structural:** This redefinition only works because decoherence (c) creates the structural separation required for "records" to exist.
  *   **The Winner:** **(c) is the prerequisite.** If you fix the definition of branches via decoherence, (a) follows via decision theory/symmetry, and (b) dissolves (branches aren't "more real," they just have different measure).

  **2. Confidence Level:**
  **85%.**
  I am highly confident that decoherence is the necessary condition for the problem to be well-posed. I am moderately confident that the decision-theoretic/symmetry derivations successfully bridge the gap *once that condition is met*. The remaining 15% uncertainty accounts for the possibility that there is a deeper circularity in defining "observers" or "records" that we haven't uncovered yet.

  **3. What would change my mind?**
  Two things would falsify this diagnosis:
  *   **A derivation of the Born Rule from pure unitary dynamics without invoking a preferred basis or decoherence.** If someone can show that $|\psi|^2$ weighting is required for the consistency of the Hilbert space itself, independent of any "observer" or "branch" definition, then my claim that (c) is load-bearing is wrong. (I consider this unlikely; unitary dynamics alone is time-symmetric and doesn't distinguish outcomes).
  *   **Experimental violation in the "Recombination" regime.** If we could perform a complex interference experiment where "branches" clearly formed and then recombined, and the statistics *during* the process deviated from unitary predictions in a way that suggested intermediate probabilities existed, that would break the "records only" view.

  **4. What counts as real progress?**
  Not a new theorem. We have enough theorems (Gleason, Deutsch-Wallace, Envariance).
  **Real progress is an Information-Theoretic account of the Observer.**
  We need a rigorous definition of what constitutes a "record" or an "observer" within the wavefunction that does not rely on hand-waving about "macroscopic."
  *   **Success looks like:** A formalism that takes a universal wavefunction, applies an algorithm to identify "localized information processing structures" (observers), and demonstrates that *for those structures*, the accessible history is necessarily decohered and weighted by Born Rule statistics.
  *   **Failure looks like:** Continuing to argue about whether branches are "real" or whether agents "should care." That is the verbal dispute you suspected. It's a dead end.

  ### Summary

  You are not missing the bit where it got solved. You are noticing that the solution is conditional.

  The "Born Rule Problem" is solved **if and only if** you accept that:
  1.  Probability is about self-location relative to decohered records (solving Complaint 1).
  2.  Decoherence is robust enough to define those records for all practical purposes (solving the "tree" worry).
  3.  Given 1 and 2, the Hilbert space structure forces the squared amplitude weighting (solving Complaint 2).

  Your recombination example doesn't break this; it validates it. In the recombination case, no records are formed, so no probability assignment is required *until* the final measurement. The amplitude structure was there all along, but it wasn't carrying "probability" weight until it became a "history" weight.

  Stop worrying about the tree. Worry about the definition of the leaf. That's where the physics is.
