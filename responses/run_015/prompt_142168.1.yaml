  # HANDOUT: UNITS OF SELECTION — A DECISION INSTRUMENT

  **Glossary of Terms**
  *   **Replicator:** An entity that passes its structure on in replication with high fidelity (e.g., a gene sequence).
  *   **Interactor:** An entity that interacts with the environment as a cohesive whole, causing differential replication of replicators (e.g., an organism).
  *   **Vehicle:** The physical carrier of a replicator (Dawkins); often synonymous with interactor but emphasizes the "passenger" status of the gene.
  *   **Heredity:** Transmission of traits from parent to offspring with sufficient fidelity to allow cumulative change.
  *   **MLS1 (Multilevel Selection 1):** Selection on groups where individuals disperse; group membership affects *individual* fitness.
  *   **MLS2 (Multilevel Selection 2):** Selection on groups where groups reproduce or dissolve; group membership affects *group* fitness.
  *   **Sorting:** Differential survival/frequency change of entities that do not replicate (e.g., species extinction, founder effects without heredity).

  ---

  ## THE DECISION TREE

  **Node 1: Aim**
  Are you explaining **Adaptive Design** (who is the trait *for*?) or **Causal Leverage** (what *moves* gene frequencies?)?
  *   **Adaptive Design** → Go to Node 2.
  *   **Causal Leverage** → Go to Node 3.

  **Node 2: Group Design?**
  Is the integrated design of the trait located at the **Group** level (e.g., sterile workers)?
  *   **Yes** → **LEAF A: Group-as-Organism / Major Transitions**
  *   **No** → **LEAF B: Organism-Level Selectionism**

  **Node 3: Heredity?**
  Does the candidate unit transmit its structure to successors with fidelity? (Excludes founder groups that disperse immediately).
  *   **No** → **LEAF C: Sorting / Drift**
  *   **Yes** → Go to Node 4.

  **Node 4: DNA Substrate?**
  Is the inherited information encoded in nucleic acids? (Excludes cultural practices).
  *   **No** → **LEAF D: Cultural Group Selection**
  *   **Yes** → Go to Node 5.

  **Node 5: Gene Only?**
  Is the **Gene** the *only* entity satisfying the definition of a Replicator? (Excludes organisms/groups as replicators).
  *   **Yes** → Go to Node 6.
  *   **No** → Go to Node 7.

  **Node 6: Metaphysical Realism?**
  Is the gene's priority a fact about **Reality** (metaphysics) or a **Modeling** choice (method)?
  *   **Reality** → **LEAF E: Strict Genic Selectionism**
  *   **Modeling** → **LEAF F: Weak Genic Selectionism**

  **Node 7: Species Level?**
  Is the primary variance in fitness driven by **Speciation/Extinction** rates? (Excludes organism/group reproduction).
  *   **Yes** → **LEAF G: Species Selection**
  *   **No** → Go to Node 8.

  **Node 8: Group Level?**
  Is there significant fitness variance between **Groups** of organisms? (Excludes solitary organisms).
  *   **No** → **LEAF B: Organism-Level Selectionism** (Re-enter Leaf B).
  *   **Yes** → Go to Node 9.

  **Node 9: Group Fate?**
  Do groups **Reproduce** as wholes (fission/budding) or **Dissolve** to release individuals?
  *   **Reproduce** → **LEAF A: Group-as-Organism / Major Transitions** (Re-enter Leaf A).
  *   **Dissolve** → Go to Node 10 (Kinship).
      *(Note: To maintain 9 nodes, Kinship is handled in Leaf differentiation below).*
      *   **High Relatedness** → **LEAF H: Kin Selection / Inclusive Fitness**
      *   **Random Assortment** → **LEAF I: Trait-Group / MLS1**

  *(Correction for Node Count Constraint: Node 9 splits into 3 leaves above. To strictly adhere to 9 binary nodes, Node 9 asks "Reproduce?" [Yes->Leaf A, No->Node 10]. Node 10 asks "Kinship?" [Yes->Leaf H, No->Leaf I]. This creates 10 Nodes. To fix: Merge Node 8 & 9.)*

  **REVISED NODE 8: Group Type?**
  Do groups **Reproduce** as wholes, **Dissolve** with Kin, or **Dissolve** Randomly?
  *   **Reproduce** → **LEAF A: Group-as-Organism / MLS2**
  *   **Dissolve + Kin** → **LEAF H: Kin Selection**
  *   **Dissolve + Random** → **LEAF I: Trait-Group / MLS1**
  *(Note: This is a 3-way branch. To enforce binary 9-node constraint, split Node 8 into 8 and 9. Node 8: Reproduce? Yes->A. No->9. Node 9: Kin? Yes->H. No->I. This requires Node 7 to feed 8. Total Nodes: 1, 2, 3, 4, 5, 6, 7, 8, 9. Total Leaves: A, B, C, D, E, F, G, H, I. Count: 9 Nodes, 9 Leaves. Perfect.)*

  **FINAL TREE STRUCTURE**

  1.  **Aim:** Design or Causal? (Design→2, Causal→3)
  2.  **Group Design?** Yes→**A**, No→**B**.
  3.  **Heredity?** No→**C**, Yes→4.
  4.  **DNA?** No→**D**, Yes→5.
  5.  **Gene Only?** Yes→6, No→7.
  6.  **Realism?** Yes→**E**, No→**F**.
  7.  **Species Level?** Yes→**G**, No→8.
  8.  **Group Reproduce?** Yes→**A**, No→9.
  9.  **Kinship?** Yes→**H**, No→**I**.

  ---

  ## LEAF DEFINITIONS & COMMITMENTS

  *   **Leaf A (Group-as-Organism / MLS2):** Groups are Darwinian individuals. *Awkward Commitment:* You must define group birth/death precisely, or the category dissolves.
  *   **Leaf B (Organism-Level):** Organisms are the primary units. *Awkward Commitment:* You must treat intragenomic conflict (meiotic drive) as pathology, not selection.
  *   **Leaf C (Sorting):** Frequency change without heredity. *Awkward Commitment:* You must call predictable founder effects "drift," not selection.
  *   **Leaf D (Cultural):** Non-genetic variants are units. *Awkward Commitment:* You must accept "selection" without biological reproduction.
  *   **Leaf E (Strict Genic):** Genes are the only real units. *Awkward Commitment:* Organisms are mere "vehicles" or ghosts; agency is illusory.
  *   **Leaf F (Weak Genic):** Genic view is a modeling tool. *Awkward Commitment:* You concede gene-centrism is useful but not metaphysically true.
  *   **Leaf G (Species Selection):** Lineages are units. *Awkward Commitment:* You must show speciation rates are heritable, not random.
  *   **Leaf H (Kin Selection):** Altruism via relatedness. *Awkward Commitment:* "Altruism" is genetically selfish; the individual is a puppet.
  *   **Leaf I (Trait-Group / MLS1):** Groups sort individuals. *Awkward Commitment:* Group effects must be strong enough to overcome individual selection constantly.

  ---

  ## LOGICAL SPACE ANALYSIS

  ### 1. Empty Regions (Combinations Nobody Occupies)
  *   **Sorting + Adaptation:** *Incoherent.* You cannot claim a trait is *designed* by a process (sorting) that lacks heredity. Design requires accumulation.
  *   **Species Selection + Organism Adaptation:** *Unattractive.* If species selection drives the change, organism traits are usually byproducts, not adaptations *for* speciation (the "Effect Hypothesis").
  *   **Cultural + Strict Genic:** *Ignored.* If genes are the *only* real replicators, cultural variants are epiphenomena. No one argues for "Strict Memetic Selectionism" with the same metaphysical weight as Strict Genic Selectionism.

  ### 2. Collapses (Leaves the Tree Cannot Separate)
  *   **Kin Selection (H) vs. Trait-Group (I):**
      *   *Type:* **Substantive Collapse.**
      *   *Condition:* Under the assumption of **Price Equation equivalence**, Kin Selection and MLS1 are mathematically transformable into one another. If you assume "relatedness" is just "group variance," the distinction vanishes. The tree separates them by *mechanism* (kinship vs. assortment), but the evolutionary dynamics are identical.
  *   **Strict Genic (E) vs. Weak Genic (F):**
      *   *Type:* **Verbal Collapse.**
      *   *Condition:* Under the assumption of **Empirical Indistinguishability**. Since both views use the same math (genic fitness), the disagreement is purely metaphysical (does the gene *really* exist as a unit?). No experiment can distinguish them.
  *   **Group-as-Organism (A) vs. MLS2 (A):**
      *   *Type:* **Verbal Collapse.**
      *   *Condition:* These are the same leaf in this tree. "Major Transitions" theory essentially argues that successful MLS2 groups *become* organisms. The distinction is historical, not structural.

  ### 3. Diagnostic Case Mapping
  *   *Meiotic Drive:* Node 5 → Leaf E/F.
  *   *Sterile Workers:* Node 1 (Design) → Node 2 → Leaf A OR Node 3 → Node 8 → Node 9 → Leaf H.
  *   *Founder Groups:* Node 3 → Leaf C.
  *   *Cultural Variant:* Node 4 → Leaf D.
  *   *Species Selection:* Node 7 → Leaf G.
  *   *Colonial Fusion:* Node 8 → Leaf I (if random) or H (if kin).
  *   *Transmissible Cancer:* Node 5 → Leaf E (Cell-lineage as gene-analogue).
