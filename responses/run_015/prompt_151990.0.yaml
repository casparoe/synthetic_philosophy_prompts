answer: |-
  This is a sharp dissection of a specific penal practice. You are correct that the Japanese protocol—informing the condemned only on the morning of execution and notifying families afterward—is not bureaucratic inertia but a deliberate institutional design. It serves specific functional and philosophical ends.

  Here is a reconstruction of the implicit theory behind this secrecy, its coherence with the broader Japanese justice system, and an analysis of the philosophical underdetermination you identified.

  ### 1. Reconstructing the Implicit Theory
  The practice rests on a hybrid of **Paternalistic Utilitarianism** and **Statist Legal Positivism**.

  **A. Paternalistic Utilitarianism (The "Mercy" Argument)**
  The official justification from the Ministry of Justice is often framed as humanitarian: informing a prisoner weeks in advance subjects them to prolonged psychological torture (the "death row phenomenon"). By keeping the date secret, the state claims to minimize the *anticipatory suffering*.
  *   **The Presupposition:** This assumes that the primary harm of execution is the *anxiety* leading up to it, not the loss of agency or the inability to prepare spiritually and socially for death. It treats the prisoner as a passive recipient of state care, even in their destruction.
  *   **The Flaw:** It ignores the "dignitary harm." A human being is denied the chance to say goodbye, settle affairs, or mentally reconcile with their end. The state decides what kind of suffering is "acceptable," stripping the prisoner of autonomy over their own final moments.

  **B. Statist Legal Positivism (The "Authority" Argument)**
  More critically, the secrecy presupposes that once a sentence is finalized, the state's authority to execute is absolute and administrative.
  *   **The Presupposition:** Transparency is irrelevant to retributive justice because justice was already served at the sentencing phase. The execution is merely the *logistical completion* of a legal command.
  *   **The Function:** Secrecy prevents disruption. If the date were known, lawyers could file last-minute stays, protesters could gather, and the media could create a spectacle. By compressing the timeline, the state insulates the act from democratic scrutiny or legal interference.
  *   **Innocence Risk:** You noted the lack of window for new evidence. This practice presupposes **infallibility**. It assumes the trial process is so robust that the probability of new exculpatory evidence emerging in the gap between sentencing and execution is negligible. Therefore, procedural safeguards at the execution stage are viewed as obstacles, not protections.

  ### 2. Coherence with the Broader Justice System
  This practice is highly coherent with the rest of the Japanese criminal justice system, specifically the **Hostage Justice (Daiyo Kangoku)** system.

  *   **Pretrial Detention:** In Japan, suspects can be detained for up to 23 days without indictment, with limited access to counsel, often to extract a confession. The system prioritizes *investigative efficiency* and *confession* over *due process transparency*.
  *   **The Link:** Both the pretrial phase and the execution phase treat the individual as a **means to administrative closure**.
      *   *Pretrial:* The suspect is detained to secure a confession and ensure conviction (social order).
      *   *Execution:* The prisoner is kept in the dark to ensure the penalty is carried out without disruption (social order).
  *   **Conviction Rate:** With a conviction rate exceeding 99%, the system operates on the presumption of guilt once charges are filed. The execution secrecy is the logical endpoint of a system that views the trial not as an adversarial search for truth, but as a bureaucratic verification of state authority.

  **Verdict:** The secrecy is not an anomaly; it is the capstone of a system designed for **finality and order** rather than **rights and transparency**.

  ### 3. The "Dignity-First" Alternative
  If you built a policy on a fully transparent, dignity-first account of state killing (assuming one accepts capital punishment exists), the notification protocol would require radical changes to recognize the prisoner as a moral subject until the end.

  **Required Changes:**
  1.  **Advance Notice:** The prisoner must be notified weeks or months in advance. This restores a degree of **temporal autonomy**, allowing them to prepare psychologically.
  2.  **Family Visitation:** The family must be notified *before* the execution to allow for final goodbyes. This acknowledges that the prisoner exists within a social web, not just as a body to be disposed of.
  3.  **Counsel Access:** Lawyers must have a guaranteed window (e.g., 72 hours) between notification and execution to file emergency stays based on new evidence or mental competency issues.
  4.  **Public Accountability:** The state must announce the execution schedule publicly *before* it happens. This forces the state to own the act in real-time, subjecting it to immediate public moral scrutiny rather than hiding it as a bureaucratic statistic.

  **Philosophical Shift:** This moves from viewing execution as *waste management* to viewing it as a *solemn moral act* that requires ritual, witness, and procedural rigor to maintain the dignity of the state and the condemned.

  ### 4. Is the Practice Philosophically Underdetermined?
  You asked if a Utilitarian could license this secrecy, or if it requires a specific view of state authority. The answer is: **It is underdetermined, but the specific implementation leans Statist.**

  **The Utilitarian Case for Secrecy:**
  A classic Act Utilitarian *could* support the secrecy.
  *   *Calculation:* If knowing the date causes 100 units of pain (anticipatory anxiety) and not knowing causes only 1 unit of pain (shock), and the outcome (death) is identical, the Utilitarian prescribes secrecy.
  *   *Constraint:* This only works if the Utilitarian ignores the negative utility inflicted on the *family* (trauma of sudden loss without closure) and the *society* (risk of executing the innocent due to lack of review time). If you factor those in, the Utilitarian calculus likely flips against secrecy.

  **The Statist/Retributivist Case:**
  However, the *exclusion of the family* and the *blocking of legal review* cannot be explained by Utilitarianism alone.
  *   Preventing a lawyer from filing a motion doesn't reduce the prisoner's anxiety; it protects the *state's schedule*.
  *   Hiding the act from the family doesn't reduce the prisoner's pain; it protects the *state from protest*.

  **Conclusion on Underdetermination:**
  The practice is **compatible** with a narrow Utilitarian view (minimizing prisoner anxiety), but it is **dependent** on a Statist view of authority (the state's right to kill does not need public justification or real-time oversight).

  If you believed the state's right to kill required public justification (a Liberal-Democratic view), you could not support secrecy, because secrecy prevents the public from judging the act *before* it becomes irreversible. Therefore, the practice presupposes that **sovereignty trumps transparency.** It assumes the state possesses a monopoly on violence that does not require continuous democratic ratification at the moment of application.

  ### Summary
  The Japanese execution protocol presupposes that the prisoner is an **object of administration** rather than a **subject of rights**. It is philosophically coherent with a justice system that values confession and finality over adversarial truth-seeking. While a narrow Utilitarian could argue it reduces anticipatory suffering, the suppression of legal appeals and family notification reveals a deeper commitment to **State Sovereignty**: the belief that once the law has spoken, its enforcement must be insulated from human interference, even at the cost of dignity and the risk of error. A dignity-first approach would require treating the execution not as a task to be completed, but as a moral event to be witnessed and scrutinized.
