  Begin with the failure of current desires, briefly reviewing orthogonality and fragility. Move immediately to the failure of simple idealized preference. This is where you introduce the sequencing example. Only after they feel the instability of path-dependent extrapolation do you introduce the coherence condition as a fixed-point requirement. If you introduce fixed-points earlier, it looks like a mathematical trick rather than a necessary stabilization mechanism. They must experience the failure of step-by-step improvement first. Once individual coherence is established, pause. Do not merge into the group yet. Dedicate a distinct slot to the interpersonal step: extrapolating a shared "we" is not aggregating individual CEVs; it is extrapolating the convergence between them. This must precede the discussion of open problems. Many groups skip this and assume summing individual outputs works. It does not. The interpersonal step requires its own mechanics of convergence. Finally, end with the remaining ambiguities. The order is: Motivation, Individual Failure, Coherence Solution, Interpersonal Distinction, Open Problems. This ensures the fixed-point is seen as a remedy, not an axiom, and the group dynamic is not treated as an afterthought. Structural integrity depends on this sequence.

  2. "The carrying example"
  Your sequencing case is strong for dismantling "informed desire," but it risks implying there is a correct order if only we knew it. To make it carry CEV, you must modify it so that both orders lead to stable but mutually incompatible endpoints, and the subject recognizes neither as authoritative from the start. The case must lack a "true self" hidden underneath; the conflict must be between two valid extrapolated selves. Use a scenario where information changes the *weights* of values, while reflection changes the *definition* of values. If information comes first, the weights shift before definition refinement; if reflection comes first, the definitions solidify before weight shifts. This creates a non-commutative operation. This demonstrates why a simple function fails. It carries the idea well provided you emphasize that CEV attempts to find the fixed-point across these paths, not choose the better path. Do not use a case where one outcome is clearly morally superior; the ambiguity is the point. The example must show that without a coherence condition, the output is arbitrary based on causal history. This prepares them to see coherence as a structural necessity rather than a philosophical preference. Ensure the subject remains recognizable as human throughout, avoiding sci-fi mind changes that break continuity. The subject must remain psychologically continuous enough that both endpoints claim legitimacy.

