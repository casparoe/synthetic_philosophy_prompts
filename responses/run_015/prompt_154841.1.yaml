      *   *Prisoners:* Users/Developers stuck at the implementation level (only seeing outputs).
      *   *Chains:* Cognitive/Architectural constraints (legacy code, lack of docs, tight coupling).
      *   *Fire:* The runtime environment/compiler (the energy source that renders the spec into reality).
      *   *Puppets:* The specific classes/functions instantiating the logic.
      *   *Wall:* The abstraction barrier (API boundary, encapsulation).
      *   *Shadows:* The observable behavior/output (logs, UI pixels, return values).
      *   *Ascent:* Refactoring, reading docs, accessing source, understanding the type system.
      *   *Sun:* The principle of Type Safety/Logical Consistency (what makes the spec valid).
      *   *Objects Outside:* The Pure Specifications/Interfaces themselves.

  4.  **Drafting Section 2: Normative Claims (Imperfection):**
      *   Plato says particulars are "imperfect copies."
      *   Software analogy: Implementations always have bugs, edge cases, performance limits, or environment dependencies. The *Spec* is perfect (mathematically defined), the *Code* is buggy.
      *   Does this carry evaluative weight? Yes. "Correctness" is defined by adherence to the Spec. A bug is an ontological failure of the instance to match the form.
      *   No need for a "heavenly realm," just a "logical realm" (like math).

  5.  **Drafting Section 3: Sacrifices (Causal Priority):**
      *   Standard Reading: Forms *cause* particulars (metaphysically).
      *   Software Reading: Specs don't *cause* code to exist; developers write code to match specs. The causality is reversed (human intention).
      *   Also, Forms in Plato are often teleological (pulling things toward goodness). Interfaces are static.
      *   Sacrifice: The dynamic, generative power of the Forms. In software, the spec is passive until implemented.

  6.  **Drafting Section 4: Defense Against Anachronism:**
      *   Charge: "Plato didn't know about APIs."
