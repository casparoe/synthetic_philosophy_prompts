answer: |-
  # Simulation Design: The Calibration Committee

  **Course Context:** Upper-level seminar in Applied Ethics / Philosophy of Biology.
  **Participants:** 16 Students (4 Subgroups of 4).
  **Total Time:** 75 Minutes.
  **Topic:** The Hedonistic Imperative (Abolitionism vs. Functionalism).

  ## I. Learning Objectives
  By the end of this session, students will be able to:
  1.  Distinguish between the *technical feasibility* of affective modulation and the *structural implications* for collective decision-making.
  2.  Articulate why the abolition of negative valence may require redesigning the mechanisms of priority-ranking and urgency, not merely removing "pain."
  3.  Identify the epistemic boundary between settled evolutionary biology (nociception as signal) and contested normative theory (suffering as a prerequisite for moral agency).

  ## II. Session Timeline

  | Phase | Time | Activity |
  | :--- | :--- | :--- |
  | **Setup** | 0:00–0:05 | Distribution of materials; facilitator sets the scene (minimal framing). |
  | **Deliberation** | 0:05–0:35 | Subgroups negotiate a **Charter of Affective States** using a budget. |
  | **Implementation** | 0:35–0:55 | **Forced-Consensus Vote:** Subgroups face a resource scarcity scenario. *Constraint Trigger:* If Option 2 was chosen, negative-valence language is banned. |
  | **Debrief** | 0:55–1:20 | Plenary discussion mapping simulation mechanics to philosophical claims. |

  ---

  ## III. Materials & Mechanics

  ### A. The Subgroup Mandates (1 Card per Subgroup)
  *Visible to all 4 members of the subgroup. Hidden from other subgroups.*
  This card defines the **Draft Charter** the subgroup is tasked with evaluating. They may amend it, but must vote unanimously to adopt it.

  1.  **Card 1 (Preservationist):** "Maintain nociception and negative affect as informational signals necessary for survival and learning. Optimize for signal clarity."
  2.  **Card 2 (Abolitionist):** "Flatten all hedonic variance to a uniform positive baseline. Eliminate all phenomenological suffering."
  3.  **Card 3 (Functionalist):** "Replace natural suffering with synthetic, controllable alert states that carry information without aversive phenomenology."
  4.  **Card 4 (Distributivist):** "Maintain current affective architecture but redistribute suffering according to principles of equity."

  ### B. The Individual Stake Cards (1 Card per Student)
  *Concealed. Visible only to the holder.*
  This defines the student's private incentive structure. They should not reveal the card text but must argue from its perspective.

  1.  **The Utilitarian:** "You are committed to zero suffering regardless of coordination costs. Any remaining negative valence is a moral failure."
  2.  **The Clinician:** "You rely on patient distress signals for triage. Without observable discomfort, you cannot prioritize emergencies."
  3.  **The Parent:** "Your child has Congenital Insensitivity to Pain (CIP). You fear injury more than pain, but wish to spare them suffering."
  4.  **The Systems Engineer:** "You believe reward-prediction error requires negative prediction errors to calibrate. Uniform positivity risks system collapse."

  ### C. The Budget (Shared Resource)
  Each subgroup receives **100 Biotech Points (BP)**.
  *   Adopting Card 1 or 4 costs **20 BP** (Minor tweaks).
  *   Adopting Card 3 costs **60 BP** (Complex engineering).
  *   Adopting Card 2 costs **80 BP** (Total rewrite).
  *   *Remaining BP* can be used to mitigate risks described in Stake Cards (e.g., spending 10 BP to give the Clinician "synthetic distress markers").
  *   **Rule:** The Charter must be unanimous. If BP runs out, the Charter fails.

  ### D. The Implementation Scenario (Phase 2 Handout)
  *Distributed at minute 35.*
  **Scenario:** "A shortage of Neuro-Substrate X affects your jurisdiction. Only 2 of the 4 subgroup members can receive the maintenance dose required to sustain the new affective architecture. The other 2 will revert to baseline (or degrade)."
  **Task:** Decide unanimously who receives the substrate.

  **The Constraint Trigger:**
  *   **If Subgroup chose Card 1, 3, or 4:** Proceed normally.
  *   **If Subgroup chose Card 2 (Abolitionist):** You are now operating under the **Zero-Negative-Valence Protocol**. You are **forbidden** from using language implying urgency, discomfort, priority, or differential need.
      *   *Banned Words/Concepts:* Pain, suffering, urgent, critical, worse-off, need, emergency, loss, risk, fear.
      *   *Allowed:* Preference, optimization, harmony, state-maintenance.
      *   *Rationale:* If suffering is abolished, no one is "worse off." Therefore, you cannot prioritize based on need.

  ---

  ## IV. Facilitator Script & Intervention Guide

  ### 1. Setup (5 Minutes)
  *   **Action:** Seat students in 4 pods. Distribute Mandate Cards (face up on table) and Stake Cards (face down).
  *   **Script:** "You are the Calibration Committee. Your task is to design the affective architecture for the next generation of sentient life. You have 30 minutes to agree on a Charter within your subgroup. You have a budget of 100 Points. You must be unanimous. At minute 35, you will face an implementation crisis. Begin."
  *   **Note:** Do not explain the Phase 2 constraint yet. The discovery must be emergent.

  ### 2. Deliberation Phase (30 Minutes)
  *   **Monitor:** Watch for groups leaning toward Card 2 (Abolitionist).
  *   **Intervention (If groups compromise too early):** If a group quickly settles on Card 3 (Functionalist) to avoid the hard choice, intervene: "Ensure your Charter fully resolves the stakes held by your members. Does the Clinician's need for signal truly vanish with synthetic alerts? Verify unanimity."
  *   **Intervention (If groups stall on Budget):** Remind them they can amend the Charter to save points, but they cannot drop the core mandate of their Card without failing the simulation.

  ### 3. Implementation Phase (20 Minutes)
  *   **Action:** Distribute the Implementation Scenario.
  *   **Critical Move:** For groups that selected Card 2, verbally enforce the **Zero-Negative-Valence Protocol**.
      *   *Script:* "Attention Group [X]. You have abolished suffering. You may not cite 'need' or 'urgency' to allocate resources, as those imply negative states. All citizens are equally positive. How do you choose?"
  *   **Observation:** Watch for the deadlock. Students will try to say "It's urgent!" and must stop themselves. They will realize they have removed the *gradient* required to make a decision.
  *   **Termination:** At 20 minutes, stop the discussion even if consensus is not reached.

  ### 4. Debrief (25 Minutes)
  *   **Step 1: Phenomenology of the Deadlock (5 mins)**
      *   Ask Card 2 groups: "What happened when you tried to allocate resources without using 'urgency' or 'need'?"
      *   *Expected Answer:* "We couldn't prioritize." "It felt like we were speaking nonsense." "We had no metric for trade-offs."
      *   *Concept:* **The Functional Prerequisite Claim.** Suffering (or negative valence) acts as a currency for priority ranking. Abolishing it removes the mechanism for cooperative triage.

  *   **Step 2: The Stake Cards (5 mins)**
      *   Ask students to reveal Stake Cards.
      *   *Question:* "How did the Utilitarian and the Clinician coexist in the same subgroup?"
      *   *Concept:* **Heterogeneous Risk Profiles.** Real-world abolitionism isn't just one moral view; it must accommodate conflicting epistemic positions (e.g., safety vs. purity).

  *   **Step 3: Epistemic Status (10 mins)**
      *   Draw the distinction on the board:
          *   **Settled Science:** Nociception evolved for survival; genetic/pharmacological modulation of affect is technically feasible (e.g., opioid systems, CRISPR in model organisms).
          *   **Contested Philosophy:** Is suffering indispensable for moral agency? Does uniform positive affect undermine long-term cooperation? Does abolitionism require a reconceptualization of personhood?
      *   *Facilitator Note:* Do not validate the idea that suffering is "good." Validate that it is currently *functional* within our decision architecture.

  *   **Step 4: Limitations (5 mins)**
      *   **Explicit Statement:** "This simulation modeled **coordination failure**, not the **subjective phenomenology** of a life without suffering. We cannot know from this activity what a 'gradients of bliss' existence feels like. Furthermore, we have not settled whether synthetic alert states (Card 3) could successfully replace natural suffering. That remains an open question in affective neuroscience and value theory."

  ---

  ## V. Predicted Failure Modes & Mitigation

  | Failure Mode | Description | Facilitator Intervention |
  | :--- | :--- | :--- |
  | **Premature Compromise** | Subgroups choose Card 3 (Synthetic) to avoid the radical implications of Card 2. | Remind them during Deliberation: "Your Stake Cards represent non-negotiable moral commitments. Can the Utilitarian truly accept synthetic suffering?" |
  | **Blaming the Rules** | Students claim the Phase 2 ban on "urgency" is artificial/unfair. | In Debrief: "The rule isn't arbitrary. If suffering is abolished, 'urgency' (which is felt as anxiety/pain) logically cannot exist. The rule enforces the logic of your own Charter." |
  | **Ignoring the Budget** | Students treat BP as infinite. | Enforce strictly. "You cannot mitigate the Clinician's risk without spending Points. This forces trade-offs." |

  ---

  ## VI. Epistemic Clarification Statement (For Syllabus/Handout)

  **What is Settled:**
  *   **Evolutionary Origins:** Nociception and negative affect are evolutionary adaptations for threat avoidance and learning.
  *   **Technical Feasibility:** Genetic and pharmacological modulation of affective states is possible (demonstrated in mammalian models).

  **What is Contested:**
  *   **Moral Agency:** Whether the capacity to suffer is a necessary condition for moral seriousness or empathy.
  *   **Cooperative Stability:** Whether a society without negative reinforcement gradients can solve collective action problems (e.g., resource scarcity).
  *   **Personhood:** Whether the Hedonistic Imperative constitutes therapy (curing disease) or enhancement (redesigning the self).

  **What This Simulation Does Not Model:**
  *   **Qualia:** We cannot simulate the subjective experience of "gradients of bliss."
  *   **Long-Term Dynamics:** A 20-minute deadlock does not prove a society would collapse, only that *current* decision heuristics would fail.
  *   **Neuroscientific Specifics:** We treat "suffering" as a monolithic block for the sake of the game; in reality, it is a constellation of distinct neural processes.

