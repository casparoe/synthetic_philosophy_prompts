  **JOINT CUSTODY AND CO-OCCUPANCY AGREEMENT FOR SHARED BODILY RESIDENCE FOLLOWING CORPUS CALLOSOTOMY**

  **THIS AGREEMENT** is entered into on this day by and between the Left Hemisphere (hereinafter "Verbal Party") and the Right Hemisphere (hereinafter "Spatial Party"), collectively referred to as "The Tenants," regarding the biological asset known as Patient X (hereinafter "The Body").

  **RECITALS**
  WHEREAS, The Tenants previously enjoyed unified consciousness via the corpus callosum; and
  WHEREAS, surgical severance has resulted in distinct cognitive jurisdictions requiring formalized cohabitation rules;
  NOW, THEREFORE, the parties agree as follows:

  **ARTICLE I: VERBAL JURISDICTION AND NARRATIVE INTEGRITY**
  1.1 **Exclusive Speaking Rights.** The Verbal Party retains exclusive rights to linguistic output, syntax, and grammatical construction. The Spatial Party shall communicate solely through non-verbal cues, prosody, and left-visual-field gestures.
  1.2 **The Interpreter Clause.** The Verbal Party acts as the primary press secretary for The Body. However, the Verbal Party agrees not to fabricate causal explanations (confabulations) for the Spatial Party's actions without reasonable evidence. Should the Verbal Party claim The Body stood up "to get a soda" when the Spatial Party actually stood due to emotional distress, the Spatial Party may file a Notice of Narrative Discrepancy.
  1.3 **Liability.** The Verbal Party assumes full liability for any false autobiographical narratives presented to external observers, provided the Spatial Party can demonstrate lack of consent via left-hand pointing.

  **ARTICLE II: MOTOR ALLOCATION AND NON-COMPETE**
  2.1 **Hand Dominance.** The Right Hand is assigned to the Verbal Party for writing and tool use. The Left Hand is assigned to the Spatial Party for spatial reasoning and emotional regulation.
  2.2 **Alien Hand Protocols.** In the event of "Alien Hand Syndrome," wherein one Hand acts against the expressed will of the dominant conscious stream (e.g., unbuttoning a shirt the other hand just buttoned), the offending Party shall be deemed in breach of peace.
  2.3 **Motor Non-Compete.** Neither Party shall inhibit the other's motor planning unless immediate physical harm to The Body is imminent. Disputes over reaching for objects in the midline shall be resolved via rapid eye saccades, not physical struggle.

  **ARTICLE III: DEFINITION OF SELF AND MEMORY STORAGE**
  3.1 **The Pronoun "I".** The use of the first-person singular "I" shall be considered joint property. However, if the Verbal Party asserts "I remember" regarding an event stored exclusively in the Spatial Party's non-verbal memory banks, this constitutes unauthorized use of shared identity.
  3.2 **Autobiographical Continuity.** Both parties acknowledge that while The Body presents as one person to external law, internal phenomenology may suggest two. Neither Party shall deny the other's claim to personhood during private introspection.
  3.3 **Conscious Access Visitation.** The Spotlight of Consciousness shall operate on a rotating schedule. The Verbal Party agrees not to monopolize awareness during tasks requiring holistic spatial processing.

  **ARTICLE IV: DISPUTE RESOLUTION**
  4.1 **Mediation.** In cases where The Body freezes due to competing commands (psychomotor akinesia), a neutral third-party neurologist shall be consulted to reset the bridge.
  4.2 **Survival of Identity.** Should one Hemisphere allege the other never consented to the shared life story, arbitration shall determine if "Patient X" survives as a legal entity or if two new entities (Patient X-L and Patient X-R) must be issued separate social security numbers.

  **IN WITNESS WHEREOF**, the parties have executed this Agreement as of the date of severance.

  **Verbal Party (L.H.)** ____________________
  **Spatial Party (R.H.)** ____________________
  **Mediator (Thalamus)** ____________________
