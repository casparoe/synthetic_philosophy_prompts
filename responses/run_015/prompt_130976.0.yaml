prompt: |-
  I chair the small committee that allocates our annual discretionary bonus at the forty-person energy-policy institute where I have worked for eleven years. The pool is modest, the decision has to be unanimous, and it has to be announced with a short written justification. This year I have three cases that pull in different directions, and I would like help with the reasoning rather than with the decision itself.

  Priya inherited, in her third month, a donor relationship that a departing colleague had built over six years. She made one call and the foundation doubled its gift, which is roughly sixty per cent of our new money this year. She is a solid performer but, by general agreement, no better at this work than two colleagues who spent the year cold-emailing and brought in very little.

  Tom ran our campaign to get a state utility commission to adopt a rate design we had been advocating for years. He worked punishing hours, and on every internal measure of effort, judgment, and persistence he was our strongest person this year. The commission voted three to two against us, partly because a sympathetic commissioner resigned in August and her replacement was hostile. The campaign produced nothing I can point to, and there is a real chance it made the next attempt harder.

  Ada found an error in the model we use to estimate avoided emissions. Correcting it cut our headline figure by about a third, cost us two funders, and has largely been experienced internally as an embarrassment. It is also the thing I would point to if someone asked what actually made our work better this year.

  Two things I have already settled, so please do not spend your answer on them. First, I am unpersuaded by the sweeping thought that nobody has really earned anything, since natural talents and even the capacity for hard work are themselves matters of luck. I suspect that is true, and it does not discriminate between my cases, every one of which is shot through with luck: an inherited relationship, a commissioner's resignation, a stale spreadsheet. What I need is a way of thinking about how much the luck matters in each case, and where, if anywhere, it stops mattering. Second, I have been experimenting with a rule — reward the difference a person made that would not have happened anyway, that is, discount the result by how easily someone else could have produced it — and it keeps returning answers I do not trust. It gives Priya almost nothing, since almost anyone could have made that call. It gives Tom almost nothing, since the campaign failed. It gives Ada a great deal. I find the Ada answer right and the Tom answer wrong, and I cannot tell whether that means the rule is defective or my feeling about Tom is sentimentality about effort.

  There are two further complications. We disagree internally about what our outputs even are — money raised, policy changed, or research made more credible — and the three cases seem to sort differently depending on which of those you take as the point of the exercise. And Ada leaves in January for a lower-paid job, which I keep being told is irrelevant and which I suspect is not, though I cannot say why.

  So: what is the question I should actually be asking, is the replaceability rule salvageable in some modified form, and how should I think about Tom? Please write in continuous prose, without headings, bullet points, bold text, or tables, as though you were writing me a careful email.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Chair of a small committee at a 40-person energy-policy institute (11 years tenure).
      *   **Task:** Allocate annual discretionary bonus pool (modest, unanimous decision, short written justification required).
      *   **Problem:** Three cases (Priya, Tom, Ada) pulling in different directions. Needs help with *reasoning*, not the decision itself.
      *   **Constraints:**
          *   Write in continuous prose.
          *   No headings, bullet points, bold text, or tables.
          *   Tone: Careful email.
          *   Do *not* address two settled issues: (1) The "nobody earned anything because luck" argument (dismissed as non-discriminating), (2) The "replaceability rule" experiment (needs refinement/critique, not dismissal based on the user's settled thoughts).
      *   **Key Complications:**
          *   Disagreement on outputs (money, policy, credibility).
          *   Ada leaving for a lower-paid job (allegedly irrelevant, but user suspects otherwise).
          *   User's intuition: Ada deserves reward (correcting error), Tom deserves reward (effort/failure due to luck), Priya is tricky (huge result, low effort/inheritance).
          *   Current Rule Issue: "Reward the difference made vs. replaceability" gives Ada too much (good), Tom nothing (bad), Priya nothing (maybe good/bad).
      *   **Questions to Answer:**
          1.  What is the question I should actually be asking?
          2.  Is the replaceability rule salvageable in some modified form?
          3.  How should I think about Tom?

  2.  **Deconstruct the Cases:**
      *   **Priya:** High impact (60% new money), low marginal effort (one call), high luck/inheritance (colleague's work). Replaceability rule says: low reward (anyone could have made the call). User intuition: Unsure.
      *   **Tom:** High effort, high skill, zero/negative impact (policy failed, maybe set back), bad luck (commissioner resignation). Replaceability rule says: low reward (no result). User intuition: He deserves something (sentimentality about effort?).
      *   **Ada:** High integrity/quality impact (corrected model), negative financial impact (lost funders), internal embarrassment, high long-term value (credibility). Replaceability rule says: high reward (hard to find error, made work better). User intuition: She deserves it. Leaving for lower-paid job adds emotional weight.

  3.  **Address the Core Questions:**

      *   **Question 1: What is the actual question?**
          *   It's not "Who produced the most value?" (because value is disputed and luck-laden).
          *   It's not "Who worked hardest?" (Tom wins, but results matter).
          *   It should be about *stewardship of the institute's mission and culture* over time. The bonus is a signal. What behavior do we want to reinforce for the *next* year?
          *   The question is: "Which contribution, if rewarded, best secures the kind of organization we want to be five years from now?"
          *   This shifts focus from retrospective accounting to prospective signaling.

      *   **Question 2: The Replaceability Rule.**
          *   Current formulation: "Reward the difference a person made that would not have happened anyway."
          *   Problem: It ignores *risk* and *responsibility*.
          *   Priya: Low replaceability in terms of *relationship capital*, even if the call was easy. She assumed ownership of a fragile asset.
          *   Tom: High replaceability in terms of *outcome* (none), but low replaceability in terms of *willingness to undertake high-risk high-reward work*. If you punish failure in high-variance work, everyone will do low-variance work.
          *   Ada: High value because she prioritized truth over comfort.
          *   Modification: Weight the replaceability by the *nature of the agency* involved. Did they exercise judgment? Did they take ownership?
          *   Better formulation: "Reward the exercise of judgment under uncertainty that aligns with our long-term goals, regardless of immediate outcome, weighted by the scarcity of that specific virtue."
          *   Or: Distinguish between "outcome luck" and "optionality." Priya held an option others didn't. Tom took a risk others wouldn't. Ada took a hit for truth others wouldn't.

      *   **Question 3: Thinking about Tom.**
          *   Is it sentimentality? No. It's about risk management.
          *   Policy work is high-variance. If you only reward wins, people avoid hard fights.
          *   Tom's work had *expected value* even if realized value was negative.
          *   The bonus signals whether you punish bad luck in high-stakes bets.
          *   However, he must not be rewarded *for* failure, but for the *quality of the attempt* relative to the difficulty.
          *   The justification needs to be careful not to say "you failed but here's money." It should be "you undertook the hardest assignment with excellence."

      *   **Ada's Departure:**
          *   Why does it matter? It's not about charity. It's about the *signal* to remaining staff.
          *   If she leaves for less money after doing the right thing, and we don't recognize her, we signal that integrity pays less than success.
          *   It validates her choice to prioritize values over income, aligning with the institute's mission.

      *   **Output Disagreement (Money vs. Policy vs. Credibility):**
          *   The bonus committee must implicitly weigh these.
          *   Priya = Money. Tom = Policy. Ada = Credibility.
          *   If the institute survives on money, Priya wins. If it exists for policy, Tom wins (in effort). If it exists for truth, Ada wins.
          *   The "question to ask" helps resolve this: Which output ensures survival/mission alignment long-term? Probably Credibility (Ada) enables Policy (Tom) which enables Money (Priya).

  4.  **Drafting the Response (incorporating constraints):**
      *   *Constraint Check:* Continuous prose. No headings. No bullets. No bold. Email tone.
      *   *Tone:* Respectful, collegial, thoughtful, nuanced. Acknowledge the difficulty.
      *   *Structure:*
          *   Opening: Acknowledge the weight of the task.
          *   The Core Question: Shift from accounting to signaling/culture.
          *   The Replaceability Rule: Refine it to account for risk, ownership, and virtue signaling.
          *   Tom: Address the effort vs. outcome tension via risk/variance.
          *   Ada: Address the departure and the nature of credibility.
          *   Priya: Briefly touch on stewardship vs. execution.
          *   Closing: Encouragement on the justification writing.

      *   *Refining the "Replaceability" critique:* The user says the rule gives Ada a great deal, which they find right. It gives Tom nothing, which they find wrong. It gives Priya almost nothing.
      *   My job is to salvage the rule.
      *   The rule fails because it looks at *counterfactual output* rather than *counterfactual agency*.
      *   For Priya: Would anyone else have made the call? Maybe. But would anyone else have *owned* the relationship so quickly? The asset was fragile.
      *   For Tom: Would anyone else have run the campaign? Maybe. But the *variance* was the issue. The rule penalizes variance.
      *   Modification: Evaluate the *difficulty of the judgment* required, not just the physical action.
      *   Actually, a better pivot is "Marginal Contribution to Institutional Virtue."
      *   Let's stick closer to the user's "replaceability" language but refine the counterfactual. Instead of "would someone else have produced this result," ask "would someone else have made this *choice*?"
      *   Priya: Choice to nurture vs harvest.
      *   Tom: Choice to fight the hard fight.
      *   Ada: Choice to publish the error.

      *   *Ada's Departure:* It matters because it changes the *cost* of the reward to her vs the *signal* to others. It's not charity; it's recognizing that her market valuation diverges from her value to us. It highlights that she is acting on principle. Rewarding her validates that principle.

      *   *Tom:* It's not sentimentality. It's about "Expected Value" vs "Realized Value." In policy, lags are long. Punishing realized value when expected value was high kills ambition.

      *   *The "Question":* The question is not "Who contributed most value this year?" but "Which contribution, if recognized, most strengthens our capacity to generate value over the next five years?"

  5.  **Review against Constraints:**
      *   Continuous prose? Yes.
      *   No headings/bullets/bold/tables? Yes.
      *   Email tone? Yes.
      *   Address specific questions? Yes.
      *   Avoid settled topics (luck egalitarianism, total dismissal of replaceability)? Yes.

  6.  **Final Polish:**
      *   Ensure smooth transitions between paragraphs.
      *   Check that I don't sound like I'm making the decision for them.
      *   Make sure the advice on Tom distinguishes between effort and strategic risk.
      *   Make sure the advice on Ada addresses the "leaving" aspect without making it about welfare.
      *   Make sure the advice on Priya addresses the "inheritance" aspect.
      *   Ensure the "replaceability rule" modification is clear.

      *(Self-Correction during drafting)*: I need to be careful not to violate the "no bold text" rule. I must scan for any accidental formatting. I also need to ensure I don't lecture too much on the luck point they already settled, but rather build on their acceptance of luck to refine the replaceability rule.

      *Refining the Replaceability Rule modification:* The user's rule is "discount the result by how easily someone else could have produced it." The problem is "produced it" refers to the *outcome*. It should refer to the *input of judgment*.
      For Priya: The outcome was easy to produce *given the asset*, but the asset stewardship was the skill.
      For Tom: The outcome was impossible to produce *given the luck*, but the campaign management was the skill.
      For Ada: The outcome (truth) was hard to produce *given the incentives*, and the correction was the skill.
      So the modification is: Evaluate the replaceability of the *decision-making process*, not the *result*.

      *Refining Tom:* Focus on "variance" and "time horizons." Policy work has long lags. Rewarding only immediate wins truncates the horizon.

      *Refining Ada:* The departure matters because it isolates her contribution as non-transactional. She isn't doing this for the bonus. That makes the bonus more about us than her.

      *Refining the Core Question:* Focus on "signaling." The bonus is a communication tool.

      *Let's write.*
answer: |-
  Dear Colleague,

  It is a distinct kind of difficulty to sit at the center of a decision where the metrics of success are contested and the inputs are so thoroughly entangled with fortune. You have already done the hard work of dismissing the nihilistic view that luck negates all merit, which is correct because while luck is ubiquitous, agency is not distributed evenly within those lucky constraints. You are left with the task of distinguishing between the quality of agency exercised in different contexts, and that requires shifting the frame of your inquiry slightly. The question you should be asking is not who created the most value this year, but rather which contribution, if recognized, best secures the kind of organization you want to be five years from now. The bonus is not merely a retrospective accounting of profit and loss; it is a prospective signal to the staff about what behaviors constitute stewardship of the institute's mission. If you treat it purely as a reward for output, you incentivize staff to hide risks, hoard relationships, and smooth over errors. If you treat it as a reward for the exercise of judgment under uncertainty, you incentivize the kind of work that sustains a policy institute over the long term.

  This shift in perspective allows you to salvage the replaceability rule, which is currently failing you because it measures the replaceability of the outcome rather than the replaceability of the judgment. Your current formulation discounts the result by how easily someone else could have produced it, which is why it penalizes Tom for external failure and Priya for inherited advantage. A modified rule would ask instead whether the specific judgment call or assumption of responsibility was replaceable. For Priya, the act of making the call was trivial, but the assumption of ownership over a fragile, inherited relationship so quickly is not. Many people could have made the call, but fewer would have successfully stepped into the shoes of a departed colleague without damaging the trust built over six years. The replaceability here is not about the dialing of the phone, but about the stewardship of social capital. If you reward her, you are signaling that we value the nurturing of institutional assets over individual heroics. However, if the relationship was so robust that any staff member could have secured the renewal, then the replaceability of the judgment is high, and the reward should be modest. The key is to determine if she exercised judgment in maintaining the bond or merely harvested a crop planted by another.

  Regarding Tom, your intuition that he deserves recognition is not sentimentality about effort, but a correct assessment of risk and time horizons in policy work. The replaceability rule fails him because it looks at realized value rather than expected value. In energy policy, the lag between advocacy and adoption can exceed annual cycles, and the variance is high due to political volatility. If you reward only successful campaigns, you incentivize staff to choose only safe, short-term projects where victory is assured, which will eventually stagnate the institute's impact. Tom's work was not replaceable in the sense that few colleagues would have been willing to expend that level of effort on a campaign with such a high probability of failure due to factors outside their control. The judgment he exercised was to fight the hard fight despite the odds. To reward him is to signal that we understand the nature of our work and that we will not punish staff for bad luck when their strategy was sound. The modification to your rule here is to evaluate the replaceability of the willingness to undertake high-variance work. If others would have shied away from the campaign because it was too hard or too likely to fail, then Tom's agency was scarce and deserves reward, even if the outcome was zero.

  Ada presents the clearest case for the modified rule because her judgment was both scarce and vital to the mission, yet her departure complicates the signaling. You suspect her leaving for a lower-paid job is not irrelevant, and you are right, but not for the reason others might think. It is not that she needs the money more, or that you owe her charity. It is that her departure underscores that her correction was an act of integrity rather than career advancement. If she were staying and negotiating a raise, one could argue her reward is embedded in her retention. Because she is leaving, the bonus becomes a pure signal to the remaining staff about whether we value truth over comfort. The replaceability of her action is low because the institutional incentives usually punish those who reduce headline figures and cost us funders. Most people would have hidden the error or smoothed it over to protect the budget. Ada chose credibility over revenue. Rewarding her validates that choice for everyone who remains. The fact that she is leaving actually strengthens the case for the bonus because it removes any suspicion that she is gaming the system for personal gain; it confirms that her action was principled. The bonus acknowledges that while she is taking a pay cut to leave, the institute stands with her on the value of the work she did.

  The disagreement internally about outputs—money, policy, or credibility—is resolved by recognizing that these are sequential dependencies rather than competing goals. Credibility enables policy influence, and policy influence enables fundraising. Ada's work protects the credibility that allows Tom's work to be taken seriously, which eventually generates the results Priya monetizes. If you have to choose between them, you must ask which link in the chain is most fragile or most likely to be neglected without reinforcement. In most research institutes, credibility is the easiest to sacrifice for short-term money or policy wins, so it often requires the strongest signaling protection. However, if the institute is financially precarious, Priya's contribution ensures survival. You must weigh whether you are rewarding survival, impact, or integrity this year, knowing that you cannot equally reward all three without diluting the signal.

  Ultimately, the written justification you must produce is where this reasoning becomes concrete. It should not read like a performance review but like a statement of values. If you reward Tom, the justification should speak to the excellence of the advocacy despite the outcome. If you reward Ada, it should speak to the integrity of the research. If you reward Priya, it should speak to the stewardship of relationships. You may find that a split allocation is the only way to honor the complexity, provided the justification explains that the bonus is recognizing different kinds of necessary work. But if you must choose, return to the question of what behavior you need to see next year. Do you need more revenue, more brave campaigns, or more rigorous modeling? The answer to that question will tell you whose luck you are willing to celebrate and whose effort you are willing to honor despite the luck working against them.

  I hope this provides a useful framework for your deliberations. It is a heavy responsibility to allocate scarce resources among colleagues you know well, but focusing on the signal rather than the accounting should help clarify the path forward.

  Warmly,

  Your Colleague
