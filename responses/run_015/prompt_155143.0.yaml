prompt: |-
  I teach a 90-minute undergraduate seminar on norms and social order: 18 students, one room, no projector, and I would rather not lecture. Design a runnable simulation in which the class is divided into small "settlements" that must each decide how much rule-following to demand of their own members and then live with the consequences over several rounds.

  Four things should be built into the mechanics rather than said afterwards. First, each settlement secretly receives an "ecology" card that changes what strictness is worth — a shared external threat, scarce resources, or rapid turnover of members, say — so that identical rules produce different outcomes and students discover that the question has no context-free answer. Second, build in an asymmetry between conduct the group can observe and conduct it cannot: enforcement should grow expensive and start producing visible-but-hollow compliance, so students feel the point where more rules buy less order. Third, allow migration, with members carrying an internalized disposition to comply or to improvise that the receiving settlement did not choose, so the costs of any regime fall hardest on those who never consented to it. Finally, I want them to hit this wall: a settlement that tries to be permissive about everything, including about how firmly it enforces its own permissiveness, cannot do so — the rules about the rules have to be held fixed by someone.

  Give me materials, roles, a scoring system needing no real money, and a round-by-round timeline. Then a debrief mapping specific moments onto specific features of the tight/loose distinction — without using those words or naming the distinction until the debrief, so students meet the problem before the label. Tell me what will predictably go wrong when I run it and how to handle it, and be frank about what the simulation cannot reproduce, particularly anything that depends on norms being inherited rather than chosen.

  Lead with a single sentence stating the core mechanism and what participants will have felt by the end; then give the design. No preamble and no restating of my request.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** Norms and social order (undergraduate seminar).
      *   **Constraints:** 90 minutes, 18 students, 1 room, no projector, no lecture (preferably), small group simulations ("settlements").
      *   **Core Mechanics to Embed:**
          1.  *Ecology Cards:* Secret contextual factors (threat, scarcity, turnover) making strictness valuable differently across groups.
          2.  *Observability/Enforcement Cost:* Distinction between observable/unobservable conduct; enforcement gets expensive, leading to hollow compliance.
          3.  *Migration:* Members carry internal dispositions (comply/improvise) to new groups, imposing costs on non-consenting hosts.
          4.  *The Paradox of Permissiveness:* A group cannot be permissive about *how* it enforces permissiveness (rules about rules must be fixed).
      *   **Deliverables:** Materials, roles, scoring system (no real money), round-by-round timeline, debrief plan (mapping moments to concepts without using labels initially), troubleshooting (what goes wrong), limitations (inherited vs. chosen norms).
      *   **Format:** Lead with a single sentence stating core mechanism and felt experience. No preamble. No restating request.

  2.  **Deconstruct the Mechanics & Design:**
      *   *Settlements:* 18 students / 3 groups = 6 students per group. Or 4 groups of 4-5? 3 groups of 6 allows for better internal dynamics and migration. Let's go with 3 settlements of 6.
      *   *Rounds:* Need enough time for decision, action, consequence, migration. 90 minutes total.
          *   Intro: 10 mins.
          *   Round 1 (Setup & Action): 20 mins.
          *   Round 2 (Migration & Adjustment): 20 mins.
          *   Round 3 (Crisis/Enforcement Cost): 20 mins.
          *   Debrief: 20 mins.
      *   *Scoring:* Needs to be abstract but tangible. "Prosperity Points" (PP) written on paper.
      *   *Ecology Cards:* Hidden variables affecting the "threat level" or "resource yield."
      *   *Observability:* Some actions are public, some private. Enforcement requires spending points.
      *   *Migration:* Students can move groups between rounds, carrying a "trait" card (Complier/Improviser).
      *   *The Paradox:* Need a mechanic where a group votes on "Rule Rigidity." If they vote for "No Rules," they cannot punish those who break the "No Rules" agreement.

  3.  **Drafting the Simulation - "The Archipelago":**
      *   *Materials:* Index cards (Ecology, Trait, Action), Paper (Score sheets, Rule Charts), Pens.
      *   *Roles:* No fixed roles, but students adopt roles via Trait cards.
      *   *Mechanism:* Groups set a "Strictness Level" (1-5). High strictness costs enforcement points but yields safety bonuses based on Ecology. Low strictness saves enforcement points but risks penalties.
      *   *Observability:* Roll dice (hidden vs. public).
      *   *Migration:* Students move, bringing their Trait (Complier vs. Improviser). Improvisers generate chaos in strict groups; Compliers chafe in loose groups.
      *   *The Wall:* The "Meta-Rule" card. Groups must decide if they can change their Strictness Level easily. If they make it too easy to change, stability collapses.

  4.  **Refining the Four Requirements:**
      1.  *Ecology:* Each group gets a sealed envelope. One says "High Threat" (Strictness = Safety), one "Scarce Resources" (Strictness = Waste), one "High Turnover" (Strictness = Difficult).
      2.  *Observability/Cost:* To enforce a rule, the group must spend 2 PP. If they don't spend, violations happen. Some violations are hidden (private die roll).
      3.  *Migration:* Between rounds, 1-2 students per group *must* move. They reveal a hidden "Disposition" card (Rigid/Flexible).
      4.  *The Wall:* In Round 3, introduce a "Constitution" choice. If they choose "Open Constitution" (we can change rules whenever), they cannot punish someone who changes the rules.

  5.  **Developing the Timeline:**
      *   0-10: Setup, Groups, Ecology Cards.
      *   10-30: Round 1 (Establish Norms, First Production).
      *   30-50: Round 2 (Migration, Disposition Reveal, Adjustment).
      *   50-70: Round 3 (Enforcement Crisis, Meta-Rule Choice).
      *   70-90: Debrief.

  6.  **Developing the Debrief:**
      *   Start with feelings (frustration, confusion).
      *   Map to concepts: Ecology -> Contextual functionalism. Observability -> Surveillance costs. Migration -> Socialization vs. Selection. The Wall -> The paradox of tolerance/foundation of law.
      *   Avoid jargon until the end.

  7.  **Troubleshooting & Limitations:**
      *   *Chaos:* Students might laugh off the penalties. *Fix:* Make scores matter (grade participation or bragging rights).
      *   *Dominant Personalities:* One student dictates rules. *Fix:* Require unanimous or majority vote for rule changes.
      *   *Limitations:* Real norms are inherited (culture), here they are chosen (contract). Real norms are emotional, here they are calculative.

  8.  **Writing the Response (adhering to constraints):**
      *   *First Sentence:* Core mechanism + felt experience.
      *   *Structure:* Materials, Setup, Rounds, Scoring, Debrief, Troubleshooting, Limitations.
      *   *Tone:* Direct, instructional, academic but practical.

      *Self-Correction on "The Wall":* How to mechanically enforce the idea that "a settlement permissive about everything cannot enforce its permissiveness"?
      *   *Idea:* Give them a "Meta-Rule" token. If they set Meta-Rule to "Flexible," anyone can veto enforcement actions without penalty. If they set it to "Fixed," enforcement holds. If they try to be "Flexible" about enforcement, enforcement becomes impossible.
      *   *Refinement:* In Round 3, give them a choice: "Fixed Constitution" (costs points to change rules) vs. "Open Constitution" (free to change rules). If they choose Open, an external shock occurs where a member *must* change a rule. If they are Open, they cannot punish this. If they are Fixed, they can punish, but it costs points. This illustrates the need for rigidity at the foundational level.

      *Self-Correction on Migration:* Ensure the "Disposition" is hidden until they arrive or cause trouble. Let's make it a hidden card they reveal only when asked to perform a task.

      *Self-Correction on Observability:* Use a die roll. Public roll = observable. Private roll (cupped hand) = unobservable. Enforcement only works on Public.

      *Scoring:* Use "Grain Tokens" (paper slips).

      *Let's finalize the first sentence:* "By negotiating hidden environmental constraints against the rising cost of monitoring peers, participants will feel the friction between collective safety and individual autonomy before realizing that some rules must remain immune to revision."

      *Wait, check constraints:* "No preamble and no restating of my request." "Lead with a single sentence..."
      *Check:* "Design a runnable simulation..."
      *Check:* "Four things should be built into the mechanics..."
      *Check:* "Tell me what will predictably go wrong..."
      *Check:* "Frank about what the simulation cannot reproduce..."

      *Let's refine the "Wall" mechanic:* It needs to be experiential. In the final round, allow the group to vote on whether to punish a rule-breaker. If their previous rule was "Anyone can set rules," they cannot agree on punishment because the rule-breaker is following the rule of "Anyone can set rules."

      *Okay, ready to draft.*

      *Wait, one more check on the "Four Things":*
      1. Ecology cards (Secret context).
      2. Observability/Enforcement cost (Public vs Private actions, cost to punish).
      3. Migration (Carrying dispositions).
      4. The Wall (Permissiveness about enforcement leads to collapse).

      *Make sure the debrief doesn't use the words "tight/loose" until the end.*

      *Materials:* Need to be simple. Paper, pens, envelopes, dice (or phone apps since they are undergrads? No, keep it low tech. Use numbered cards drawn from a deck). Let's use numbered cards for randomness to avoid dice noise.

      *Timeline:* 90 mins is tight. Keep instructions crisp.

