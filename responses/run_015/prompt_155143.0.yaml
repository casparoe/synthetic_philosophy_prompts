answer: |-
  By negotiating hidden environmental constraints against the rising cost of monitoring peers, participants will feel the friction between collective safety and individual autonomy before realizing that some rules must remain immune to revision.

  ### Materials
  *   **3 Settlement Envelopes:** Each contains 1 Ecology Card, 1 Score Sheet, 1 Rule Charter blank.
  *   **18 Trait Cards:** 12 marked "Conformer" (green dot), 6 marked "Improviser" (red dot). Folded so the mark is hidden.
  *   **Action Deck:** 30 cards numbered 1–5 (six of each number).
  *   **Paper Slips:** ~100 slips to serve as "Grain" (currency/score).
  *   **Pens:** One per student.

  ### Setup (10 Minutes)
  1.  **Divide:** Split the class into three settlements of six students each. Send them to separate corners of the room.
  2.  **Distribute:** Give each settlement an Envelope, 6 Trait Cards (randomly mixed), and 10 Grain slips to start.
  3.  **Secret Ecology:** Instruct them to open the Envelope and read the Ecology Card *silently*. They cannot show this card to other settlements, but may discuss it within their group if they choose.
      *   *Card A (Siege):* "External Threat is High. For every round, if Average Rule Strictness is below 4, lose 5 Grain."
      *   *Card B (Scarcity):* "Resources are Fragile. For every round, if Average Rule Strictness is above 3, lose 5 Grain (enforcement waste)."
      *   *Card C (Flux):* "Population is Unstable. For every round, for every new member who joins, lose 2 Grain unless Strictness is exactly 2."
  4.  **Private Traits:** Each student takes one Trait Card. They must not show anyone their trait yet.

  ### Round 1: The Charter (20 Minutes)
  1.  **Set Rules:** Each settlement must agree on a **Strictness Level (1–5)** for the round.
      *   1 = No rules, no enforcement.
      *   5 = Total surveillance, zero deviation.
      *   *Cost:* Setting Strictness above 3 costs 1 Grain per level (enforcement overhead).
  2.  **Production:** Each student draws one Action Card (1–5).
      *   **Public Action:** Show the card to the group.
      *   **Private Action:** Keep the card hidden.
      *   *Rule:* If Strictness is 4 or 5, Private Actions are forbidden (must be shown). If a student hides a card when Strictness is high, it is a violation.
  3.  **Resolution:**
      *   **Conformers:** Must match their Action Card number to the group's Strictness Level (±1). If they cannot, they must discard the card and draw again (costing time/effort).
      *   **Improvisers:** Can play any card regardless of Strictness.
      *   **Yield:** Sum the numbers on all Public Action cards. Add this many Grain to the settlement pool.
      *   **Penalty:** If any Private Action was hidden when forbidden, subtract 5 Grain.
  4.  **Record:** Write ending Grain total on the Score Sheet.

  ### Round 2: Migration & Disposition (20 Minutes)
  1.  **Migration:** One student from each settlement *must* move to a different settlement. They carry their Trait Card with them.
  2.  **Integration:** The receiving settlement must decide whether to inspect the new member's Trait Card.
      *   **Inspection Cost:** 2 Grain.
      *   **No Inspection:** Free, but risk unknown behavior.
  3.  **Adjustment:** Settlements may change their Strictness Level.
      *   **Cost:** Changing Strictness costs 3 Grain (instability penalty).
  4.  **Production:** Repeat the Action Card draw.
      *   **New Mechanic:** If an Improviser enters a Strictness 4–5 group and was *not* inspected, they automatically generate a "Violation" (subtract 5 Grain) because they cannot comply with high strictness.
      *   **Conformers** in Low Strictness (1–2) groups feel "under-utilized": They produce half yield (round down).
  5.  **Record:** Update Grain total.

  ### Round 3: The Meta-Rule Crisis (20 Minutes)
  1.  **The Shock:** Announce to the room: "A crisis has occurred. One member in each settlement (chosen by the instructor) is now mandated to demand a change to the Strictness Level immediately."
  2.  **The Choice:** Before responding to the crisis, each settlement must set a **Meta-Rule**:
      *   **Fixed Constitution:** We cannot change our Strictness Level once set without unanimous consent. (Cost: 5 Grain to establish).
      *   **Open Constitution:** Anyone can change the Strictness Level at any time. (Cost: 0 Grain).
  3.  **The Trap:**
      *   If they chose **Open Constitution**, the mandated member *successfully changes the rule*. The group cannot punish them because the rule allows it. The group must recalculate Production based on the new, chaotic level.
      *   If they chose **Fixed Constitution**, the group can punish the mandated member (subtract their yield), but they must pay the 5 Grain establishment cost.
  4.  **Final Tally:** Calculate final Grain. The settlement with the most Grain "survives."

  ### Scoring System
  *   **Start:** 10 Grain.
  *   **Income:** Sum of Public Action Cards.
  *   **Expenses:** Strictness >3 (1 Grain/level), Inspection (2 Grain), Changing Rules (3 Grain), Fixed Constitution (5 Grain).
  *   **Penalties:** Ecology mismatch (5 Grain), Hidden Private Action (5 Grain), Uninspected Improviser in Strict Group (5 Grain), Under-utilized Conformer (Half Yield).
  *   **Win Condition:** Most Grain at end of Round 3.

  ### Debrief Plan (20 Minutes)
  *Do not use the words "tight," "loose," "norms," or "culture" until the final 5 minutes.*

  1.  **Phase 1: The Feeling (5 mins):** Ask each group to report their final Grain and their emotional state during Round 3. Ask: "Where did you feel the most friction? Was it with the outside world, or with each other?"
  2.  **Phase 2: The Ecology (5 mins):** Reveal the Ecology Cards. Ask groups to compare outcomes. "Why did Group A suffer when they lowered rules, while Group B suffered when they raised them?" *Concept:* Functionalism/Contextual fit.
  3.  **Phase 3: The Hidden Cost (5 mins):** Ask about the Private Actions. "Did anyone hide a card? Why?" Discuss the cost of checking (Inspection). *Concept:* Surveillance costs and hollow compliance (people following rules only when watched).
  4.  **Phase 4: The Wall (5 mins):** Focus on Round 3. Ask the groups that chose "Open Constitution": "Why couldn't you stop the disruption?" Ask the "Fixed" groups: "Was the cost worth it?" *Concept:* The paradox of tolerance; the need for foundational rigidity.
  5.  **Phase 5: Labeling (Final 5 mins):** Introduce the terminology. Map their experiences to **Tight vs. Loose Cultures**, **Socialization vs. Selection** (Migration), and **Constitutive Rules**.

  ### Troubleshooting: What Will Go Wrong
  1.  **The "Game" Mindset:** Students may treat Grain as points to win rather than a simulation of survival.
      *   *Fix:* Frame the intro as "Survival," not "Competition." If a group goes below 0 Grain, declare them "Collapsed" and have them observe the others (they still participate in debrief).
  2.  **Dominant Voices:** One student may dictate the Strictness Level.
      *   *Fix:* Require that the Strictness Level be written down and signed by *all* members to be valid.
  3.  **Migration Refusal:** Students may not want to move groups.
      *   *Fix:* Make it a hard rule: "If you do not move, your group loses 5 Grain."
  4.  **Confusion on Traits:** Students may forget who is an Improviser.
      *   *Fix:* Remind them at the start of Round 2: "Your Trait Card is your internal nature. It travels with you."

  ### Limitations: What This Cannot Reproduce
  1.  **Inheritance vs. Choice:** In the simulation, rules are chosen consciously via contract. In reality, norms are inherited unconsciously via socialization. Students will feel the *logic* of norms, but not the *weight* of tradition.
  2.  **Emotional Sanction:** Penalties here are numerical (Grain). Real norm violations trigger shame, ostracism, or anger. The simulation is too cold; it captures the structural cost but not the emotional glue.
  3.  **Time Depth:** Norms evolve over generations. 90 minutes forces accelerated evolution, making changes seem more rational and less path-dependent than they are in history.
  4.  **Identity:** In the sim, "Improviser" is a card. In reality, deviance is often tied to identity, race, or class, making enforcement politically charged rather than just economically costly. Acknowledge this in the debrief as a variable we stripped out for clarity.
