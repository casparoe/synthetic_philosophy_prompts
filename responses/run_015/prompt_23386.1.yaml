answer: |-
  The office smelled of brine and old paper, a combination that never quite faded despite the dehumidifier humming in the corner. Outside the single pane of glass, the harbor was grey, the water choppy under a low ceiling of clouds. Mara sat at her desk, the claim file for the Henderson property open before her. It was a routine matter: storm damage to a private dock, structural compromise, request for full replacement coverage. She had adjusted these claims for twelve years. The math was simple. The policy language was standard.

  On top of the file lay a letter on heavy, cream-colored stock. It was not from the claimant. It was from Arthur Vane, a retired ethicist who lived in the hills above the city. Mara did not know him personally, but his name carried weight in certain circles. He had written to inform her that authorizing the Henderson payout would make her complicit in a harm.

  Vane's argument was dense. He did not argue that the dock was uninsured, nor that the storm was fabricated. He argued that the specific materials required for the repair, sourced from a particular vendor due to municipal contracting loops, funded a subsidiary involved in dredging operations that subtly altered the tidal flow beneath a public walkway three miles south. The erosion was negligible per year, cumulative over decades. Vane claimed this constituted a violation of intergenerational equity, a theft of stability from future users of the walkway.

  Mara read the third paragraph again. She could follow the sentences grammatically, but the moral architecture beneath them was invisible to her. Vane relied on a framework of obligation she had not studied, referencing principles of indirect agency that felt like intricate clockwork hidden inside a wooden box. She could not see the gears. She could only trust that the man who built the box knew how it ticked.

  The deadline for the Henderson decision was four o'clock. It was now two.

  Mara picked up the phone and dialed the number for Julian, a senior adjuster in the regional office. They had worked together on complex files before. She did not mention Vane by name at first. She outlined the situation: the dock, the vendor restriction, the potential downstream effect.

  "Is it in the policy exclusion?" Julian asked. His voice was crackly, distant.

  "No," Mara said. "It's not a legal exclusion. It's a moral one. An external party says paying this makes me responsible for the erosion."

  "Responsibility is a broad church, Mara. If it's not in the contract, it's not in the box. You pay the claim. You aren't the city planner. You aren't the vendor. You're the adjuster."

  "But what if he's right? What if the harm is real?"

  "Then the city should have zoning laws that prevent it. Or the vendor should be regulated. You cut the check based on the damage to the dock. Don't outsource your conscience to a letter, and don't import someone else's conscience to do your job for you."

  Julian's advice was clean. It restored the boundaries of her role. But as she hung up, the cream-colored letter seemed to grow heavier on the desk. Julian told her to ignore the testimony because it fell outside her jurisdiction. Vane told her to heed it because jurisdiction was irrelevant to causality.

  Mara stood and walked to the window. The water slapped against the pilings of the pier below. She thought about the nature of her decision. If she denied the claim based on Vane's letter, she was accepting his moral judgment as her own. She would be acting on a conviction she did not possess, wielding a principle she could not defend. Was that integrity? Or was it a kind of moral laziness, allowing an expert to think for her so she wouldn't have to bear the weight of the uncertainty?

  If she approved the claim, she was rejecting Vane's testimony. She was asserting that her understanding of the world—the practical, contractual world—was sufficient to navigate the moral landscape. But what if her map was too small? To ignore Vane was to assume that if she couldn't see the harm, it didn't exist. That felt like arrogance.

  She sat back down. The problem was not the money. The company could absorb the cost of the dock, or the cost of the delay. The problem was the transfer of authority. Vane was asking her to be an instrument of his reasoning. He was asking her to lend her hands to his mind.

  She looked at the stamp on her desk. The rubber face was worn, the ink pad dry at the edges. To stamp the form was to finalize the transaction. It was a physical act that sealed a metaphysical stance.

  If she deferred to Vane, she was acknowledging that moral expertise exists and that she was bound to obey it, even without comprehension. That felt like surrendering her agency. She would be a functionary of his ethics. But if she resisted him, was she claiming a moral autonomy she hadn't earned? She wasn't refusing him because she had a better argument. She was refusing him because his argument was inconvenient and opaque.

  There was a third option. She could delay. She could request further documentation from Henderson, buying time to think, or to wait for Vane to write again, or for Julian to offer a different precedent. But delay was also a decision. It prioritized her comfort over the claimant's need for repair, and over the potential harm to the walkway. It was a way to hide in the ambiguity.

  The clock on the wall ticked. The sound was mechanical, indifferent.

  Mara picked up the pen. She hovered it over the authorization line. She thought about the person walking on that public walkway three miles south. They didn't know their ground was shifting. They didn't know a letter sat on a desk in a coastal office, arguing for their stability. They relied on systems they couldn't see, just as Mara relied on Vane's logic she couldn't see.

  To act on testimony was to trust. But trust required a reason. Her reason for trusting Julian was familiarity; they spoke the same language of contracts and liabilities. Her reason for trusting Vane was reputation; he was a specialist in the very thing she was unsure about. Why should the language of contracts outweigh the language of harm? Because contracts were her job. But was her job merely to process paper, or to adjudicate loss?

  If she signed, she could say, "I followed procedure." If she denied, she could say, "I prevented harm." Both were shields. Neither addressed the core unease: that she was making a moral choice based on borrowed eyes.

  She looked at the letter again. Vane's signature was sharp, decisive. He did not seem to doubt his own framework. He assumed that once the harm was identified, the action was clear. He did not account for the adjuster who had to carry the weight of the identification without the benefit of the insight.

  Mara put the pen down. She picked up the stamp and pressed it into the ink pad. The ink soaked into the rubber with a soft hiss. She positioned the stamp over the box marked *Approved*.

  She pressed down. The sound was a dull thud, final and flat.

  She lifted the stamp. The red ink bloomed on the paper, stark against the white. The claim was approved. The money would move. The dock would be repaired. The vendor would be paid. The dredging would continue.

  Mara did not file the letter. She did not put it in the Henderson claim folder where it would be archived and forgotten. She did not throw it away. She slid the cream-colored paper into the top drawer of her desk, beneath the spare ink pads and the roll of tape. It was not part of the record, but it was not discarded. It would sit there, in the dark, next to the tools of her trade.

  She closed the drawer. The handle clicked. Outside, the tide turned, slow and silent, pulling away from the shore. Mara turned off the desk lamp, though it was not yet dark, and watched the grey light settle over the harbor.
