  2.  **Deconstruct the Epistemological Concepts:**
      *   **Principal Principle (Lewis):** $C(A | Ch(A)=x \land E) = x$. Roughly: If you know the objective chance is $x$, your credence should be $x$, provided your evidence $E$ is "admissible."
      *   **Objective Chance:** Propensity, frequency, or best-system chance. It's a feature of the world, not just a measure of ignorance.
      *   **Calibration:** A property of a forecaster. If they say $p$, the event happens with frequency $p$.
      *   **Accuracy/Resolution:** The tracker has high accuracy (90%).
      *   **Admissibility:** This is the crux. Evidence about the *outcome* (like a crystal ball or a highly accurate predictor) might be inadmissible for the Principal Principle in its standard form, or it might *undercut* the chance claim.

