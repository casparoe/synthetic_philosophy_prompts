          *   If the Oracle says $Ch(Event) = 0.7$, but we know $P(Event | Tracker="WILL") = 0.9$, which do we trust?
          *   According to PP, if we know $Ch(Event)=0.7$, credence = 0.7. *But* do we know that? We only know the Oracle *says* it is 0.7. The Tracker's performance is evidence *about* the chance.

      *   *Hypothesis 2: The Setup is Confused (Category Error).*
