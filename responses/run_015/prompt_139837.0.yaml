          *   If the Oracle says 0.7, the event is genuinely chancy. A binary predictor cannot be 90% accurate on a 0.7 chance event unless it's cheating (knowing the outcome) or the chance isn't 0.7.
          *   *Conflict:* If the Tracker is 90% accurate *overall*, it must be selecting a subset of questions where the chance is actually very high (near 1) or very low (near 0), OR the Oracle is wrong about the chance.
