      *   *Epistemic norm:* Defer to the better informed source.
      *   *But:* The binary format is epistemically vicious.
      *   *Solution:* Don't show the binary. Show the probability *implied* by the Tracker (0.9) if it's higher, or combine them.
      *   *Wait, I need to address the PP specifically.* The user thinks PP forces them to ignore the Tracker. I need to explain why PP does *not* force that.
      *   Reason 1: Oracle output $\neq$ Objective Chance. It's a report.
      *   Reason 2: Tracker accuracy = Inadmissible Evidence (overrides PP).
