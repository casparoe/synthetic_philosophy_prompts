          *   Interpretation 1: Principal Principle (PP) says defer to chance (Oracle). Tracker is irrelevant/distracting.
          *   Interpretation 2: Tracker's 90% accuracy implies the *real* chance was 0.9 for "WILL" cases. Therefore, Oracle wasn't reporting real chance (if it differed), or Tracker is better.
      *   **Constraint:** "Take your time, brainstorm the space of possible answers before you commit to one, and please tell me plainly if my setup is confused rather than just picking a side."
