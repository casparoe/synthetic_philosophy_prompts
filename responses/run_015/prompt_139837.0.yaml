          *   The Oracle claims to report *chance*. The Tracker reports *predictions*.
          *   If the Tracker is 90% accurate, it suggests the events aren't as chancy as the Oracle claims, OR the Tracker has access to inadmissible evidence (future-looking).
          *   If the events are about "next week," objective chance is usually understood as fixed by current physical state + laws.
          *   If the Tracker is just a better model, then the Oracle isn't reporting the *true* chance, just *its estimate* of the chance.
          *   *Crucial Distinction:* The Principal Principle applies to *objective chance*, not to *forecasted probability*. The Oracle is a forecaster. Even if calibrated, it reports an *estimate* of chance, not chance itself (unless it's a god-eye view).
          *   If the Oracle is just a calibrated forecaster, then $P(Event | Oracle=0.7) = 0.7$.
          *   If the Tracker is a calibrated forecaster (binary), then $P(Event | Tracker="WILL") = 0.9$.
          *   Now it's a standard problem of combining expert opinions. PP doesn't directly apply to *expert testimony* about chance, only to knowledge of chance itself.

      *   *Hypothesis 3: Admissibility and Undercutting.*
          *   Lewis's PP assumes the evidence $E$ is admissible. Information about the future outcome (which a 90% accurate predictor effectively has) is typically *inadmissible*.
          *   If the Tracker has inadmissible evidence, it trumps the chance. $C(A | Ch(A)=x \land InadmissibleEvidence) \neq x$.
