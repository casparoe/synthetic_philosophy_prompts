  8.  **Final Plan:**
      *   **Tone:** Formal, rigorous, but accessible. "Epistemic Plumber."
      *   **Verdict:** Your setup is confused. You are conflating *chance* with *forecast*.
      *   **PP Analysis:** PP doesn't apply directly because you don't *know* the chance; you have a report.
      *   **Tracker Analysis:** High accuracy on binary verdicts implies either inadmissible info or that the Oracle is under-confident.
      *   **Recommendation:** Do not show binary verdicts. It breaks calibration. Convert Tracker performance to a probability (0.9) if you use it. Prioritize the probabilistic display for epistemic health.

  9.  (Self-Correction on "Inadmissible"): Be careful with Lewisian inadmissibility. Strictly, info about the *future* is inadmissible. A predictor using *past* data to predict the future is admissible. If the Tracker is just a better algorithm using past data, it's not inadmissible. It just means the Oracle is a worse algorithm. I should focus on the "Better Evidence" angle rather than "Crystal Ball" angle, unless the 90% accuracy is impossibly high for the domain. I'll stick to "Better Evidence/Model" as the primary explanation, with "Inadmissible" as a secondary metaphysical possibility.

