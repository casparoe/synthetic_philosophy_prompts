      *   *Final Verdict:* Omelas complicates Taurek by showing that refusing to aggregate doesn't solve the problem of structural evil; it might just lead to quietism.

  6.  **Final Polish:** Check tone. Ensure it sounds like a thesis supervisor or senior colleague giving firm advice. Ensure all parts of the prompt are answered. (Bridge principle, Lottery analysis, Walkers analysis, Committed Reading, Seminar Scenes).

      *   *Bridge Principle:* "The Asymmetry of Aggregation." If losses don't sum to override a rescue claim, gains don't sum to override a rights violation.
      *   *Lottery:* It fails because it treats the harm as a "cost" to be distributed rather than a violation to be avoided.
