      *   The second error is implying Nietzsche prefers Critical History *over* the others as a permanent state. He wants a dynamic interplay regulated by the needs of *Life*.
      *   The "Objective/Scientific" historian is actually the villain in the essay, often conflated with the "Critical" label by laypeople, but Nietzsche distinguishes them. The podcast seems to conflate "Critical" with "Scientific/Objective" (which Nietzsche hates) or "Critical" with "Skeptical Scholarship" (which is too passive).

