answer: |-
  Consider the "Authorized Consumption" paradox. Imagine a modern state execution where the condemned has exhausted all appeals, signed a waiver, and is killed via lethal injection in a sterile room documented by three layers of bureaucracy. Contrast this with a tribal rite where a captive is killed and consumed according to oral tradition, witnessed by the community, but without written law or external oversight. Descriptive cultural relativism simply notes the difference: one uses paperwork and abstract social contracts to legitimize killing, the other uses ritual and immediate communal consent. The conceptual knot tightens when a seminar argues that the European act is morally distinct because of those procedural safeguards.

  Here is where the slip occurs: the moment you claim the paperwork *mitigates* the moral weight of the killing, you have moved from describing a cultural difference to asserting a normative truth that administrative legibility confers moral validity. If you argue the state execution is "justice" while the tribal killing is "murder" solely because one is filed in a cabinet and the other is sung in a circle, you are no longer observing relativism; you are enforcing a normative pluralism that privileges state ontology over bodily integrity. The symmetry does not collapse; instead, it reveals that the label "barbarism" is not tracking the harm done to the victim—both are dead—but rather tracking whether the violence was licensed by a sovereign power capable of documenting it. We are forced to admit that our moral outrage is not triggered by the destruction of life, but by the unauthorized nature of the destruction.

  Our definition of barbarism tracks the legibility of violence to the state rather than the severity of harm inflicted on the subject.
