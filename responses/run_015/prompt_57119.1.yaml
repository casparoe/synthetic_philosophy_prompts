answer: |-
  **MEMORANDUM**

  **TO:** State Sentencing Commission
  **FROM:** Commissioner [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Proposal to Strike Culpability Clause (Agenda Item 4.B)

  **RECOMMENDATION**

  I recommend that the Commission **reject** the proposal to strike the culpability clause. Instead, I move to **adopt an amendment** that retains offender culpability and offense gravity as the primary anchors for sentencing length, while limiting the use of risk instruments to post-sentencing release decisions and within-guideline adjustments.

  **Proposed Operative Language:**
  > *"Section 1.A is retained in full. Sentencing ranges shall be determined primarily by the gravity of the offense and the offender's degree of culpability. Mandatory minimums for violent felonies shall remain in effect. Risk assessment instruments may be utilized to determine eligibility for early release, parole, or alternative sanctions, provided that no sentence exceeds the maximum term justified by the offender's culpability for the instant offense."*

  **Matters for Study Prior to Next Cycle:**
  1.  **Instrument Validity:** A comprehensive audit of the proposed risk instrument's false-positive rates across demographic subgroups to assess disparate impact.
  2.  **Least Restrictive Means:** An evaluation of non-custodial interventions capable of managing high-risk offenders without incarceration.
  3.  **Recidivism Definitions:** A review of whether "violent offense" charges in validation data correlate with convictions, to ensure risk thresholds are not inflated by unproven allegations.

  ***

  **REASONS AND ANALYSIS**

  This proposal presents a fundamental choice between two philosophies of punishment: the **Compatibilist** view, which holds that sentence length must track moral desert and agency, and the **Skeptic** view, which argues that "desert" is a metaphysical fiction masking a system that is, in practice, purely preventive.

  **The Skeptic's Case: Honesty as Discipline**
  Proponents of the proposal argue that our current system is hypocritical. We claim to punish based on past blame, but we incarcerate to prevent future harm. They contend that by adopting a "public-safety standard," we own up to the reality of incapacitation. Theoretically, this honesty should discipline the state: if we admit we are detaining for risk, we must adhere to strict necessity ("least restrictive means") and regular review. This is the "quarantine model." It posits that a system constrained by data is safer than one constrained by moral intuition.

  **The Compatibilist Case: Proportionality as a Ceiling**
  Opponents argue that severing sentence length from the offense committed violates the social contract. If a murderer is scored "low-risk," they walk; if a burglar is scored "high-risk," they serve a decade. This severs the link between what you *did* and what you *suffer*. More critically, they argue that proportionality exists specifically to prevent the state from detaining people for crimes they have not yet committed. Without a culpability ceiling, preventive detention becomes limitless.

  **Contact with the Numbers**
  The validation data provided forces a verdict on these competing claims. The proposed instrument flags a group where only **30%** are charged with a violent offense within five years. This means **70%** of those detained under this standard would not have committed a violent offense in that period.

  The Skeptic argues that the quarantine model is "better disciplined" than the current practice. The data refutes this. Detaining seven individuals to prevent the potential violence of three is not discipline; it is excess. It is precisely the kind of over-detention that the principle of proportionality was designed to forbid. A system that incarcerates 70% of its detainees preventively—without a finding of guilt for a future act—is arguably more draconian than a retributive system that limits punishment to the harm actually caused.

  The Compatibilist argument survives contact with the numbers. The "excess" opponents warned of is quantifiable: it is the 70% false-positive rate. Culpability acts as a necessary brake on this error. While risk assessment is a valuable tool for rehabilitation and release, it is too blunt and error-prone to serve as the sole architect of liberty deprivation. To strike the culpability clause is to authorize the detention of the innocent (regarding future conduct) on a massive scale.

  ***

  **OBJECTION FROM THE LOSING SIDE**

  *The following objection is submitted on behalf of the proponents of the public-safety standard:*

  "Your recommendation prioritizes moral comfort over public safety and structural honesty. You cite the 70% false-positive rate as a failure of the risk model, but you ignore that our current culpability model releases high-risk offenders automatically once they serve their 'deserved' time, regardless of the danger they pose. You are choosing a system that punishes the past blindly over one that protects the future transparently. By retaining the culpability clause, you are not preventing injustice; you are merely disguising the preventive nature of incarceration behind the comforting fiction of 'desert,' allowing the Commission to wash its hands of the violent recidivism that will occur when high-risk offenders walk simply because their sentence 'expired.' You are choosing a lie that feels just over a truth that keeps citizens safe."
