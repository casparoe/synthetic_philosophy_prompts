      *   I will offer the Severity Slide as the primary diagnostic because it directly tests the "Threshold" vs "Identity" tension which is central to the Non-Identity Problem logic without naming it.
      *   Wait, the prompt asks: "what further case should I put to her that would separate them and that she could not answer both ways at once."
      *   If I propose the Severity Slide, she could just say "It depends on how bad." That's not a forced choice.
      *   I need a case where Rule A says X and Rule B says Y.
      *   Rule A: Identity protects the choice (Different Child + Worth Living = Permissible).
      *   Rule B: Quality protects the choice (Good Life = Permissible).
      *   These are the same here.
      *   Rule C: Reasons protect the choice (Good Motives = Permissible).
      *   Okay, let's look at Verdict 1 again. "Can't be bothered" = Not Wrong.
