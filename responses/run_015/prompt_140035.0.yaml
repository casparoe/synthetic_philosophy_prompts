      *   *So I should predict she will say "They ought to choose the healthy one, but choosing the other is not wrong."*
      *   *This fits the pattern perfectly.*

      *   *Diagnostic Case Refinement:*
      *   If Rule 1 is "No Victim = Not Wrong" and Rule 2 is "Good Reasons = Not Wrong."
      *   Case: Bad Reasons (Convenience) + Different Child + Worth Living.
      *   Rule 1 says Not Wrong (Verdict 1 support).
      *   Rule 2 says Wrong.
      *   But Verdict 1 had bad reasons ("can't be bothered"). So Rule 2 is unlikely.
      *   Let's stick with the "Burden on Others" diagnostic. It tests the limit of Verdict 5 (rejecting maximization). Does she reject *all* external costs or just *maximization*?
      *   Case: Choosing the disabled child means an existing sibling must give up their education to provide care.
      *   Rule 1 (Focus on Child/Parents): Not Wrong (Sibling sacrifice is family matter?).
      *   Rule 2 (Focus on Harm): Wrong (Harming sibling).
      *   Actually, a simpler diagnostic might be the Severity Slide.
      *   If she says Not Wrong on New Case (Severe but worth living).
      *   Case: Life is *much* harder, still worth living.
      *   If she says Wrong eventually: She has a Severity Threshold.
      *   If she never says Wrong until "unremitting pain": She has a Strict Identity Rule.
