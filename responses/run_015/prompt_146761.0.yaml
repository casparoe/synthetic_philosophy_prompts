          *   *Live vs. Logical:* The "Catholic Capitalism" argument (Flanders/Italy) is a live historiographical debate. The "Reverse Causality" (values adapt to interests) is a standard sociological critique.
          *   *Weber's specific claim:* It's not about the *origin* of capitalism, but the *spirit* (rationalization). So, finding early capitalism in Catholic areas isn't automatically fatal unless it shows the *spirit* was identical. Finding Protestant areas that *didn't* develop rational capitalism despite the theology is more damaging.

      *   **2. Conceptual Objections (Value-Causation):**
          *   *The Problem:* Methodological individualism vs. Holism. If values are just aggregated individual preferences, are they distinct from incentives?
          *   *Fatal:* If "values" can be fully modeled as long-term utility maximization (rational choice theory), the distinct causal power of *culture* vanishes.
          *   *Live:* Behavioral economics and cognitive science suggest internalized norms *do* function differently than calculated incentives (e.g., guilt vs. fear of penalty). This supports the Weberian view.
          *   *Reductionism:* If every "value" action can be rewritten as "avoiding social sanction" or "maximizing eternal utility," the thesis loses distinctiveness.

      *   **3. Conceptual Mutation (Semantic Drift):**
