          *   *Defense:* Weber argues for "elective affinity" and secularization of the ethic. The *content* changes, but the *structure* remains.
          *   *Assessment:* Strong evidence of radical discontinuity weakens the *religious* claim but might support a *cultural path dependence* claim. It's awkward, not necessarily fatal to the broader "culture matters" claim, but fatal to the specific "theology drove economics" claim.

