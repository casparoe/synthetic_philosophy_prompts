  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Position:** The user holds a qualified Weberian thesis: Ascetic Protestant values (internalized, action-guiding, stable semantic content) causally influenced early modern Northern European economic behavior (capital accumulation, reinvestment, risk-calculation), independent of material/institutional factors.
      *   **Conditions for Causality:** Psychological internalization, non-substitutability by material incentives, stable semantic content across generations.
