answer: |-
  The hum of the server cluster was the only sound in the office, a low B-flat that vibrated in the teeth. On the main screen, a Rietveld refinement plot glowed green against the black. The fit was beautiful. The calculated profile traced the observed powder diffraction data perfectly, right through the split peak at 32 degrees $2\theta$.

  "It's the symmetry breaking," Elias said, rubbing his temples. He was sixty-five, and the grant renewal was due in forty-eight hours. "The macro model predicts the splitting magnitude as a function of temperature. The data matches. The mechanism is confirmed."

  Sara didn't look up from her laptop. She was thirty-two, hired to bridge the gap between the bench and the cluster. "The mechanism isn't confirmed. The finite-size scaling doesn't close." She turned her screen around. It showed a series of Monte Carlo runs. Lattice sizes $L=10, 20, 40$. "Look at the specific heat capacity. In the finite boxes, there's no spike. There's a hump. The peak broadens. It only diverges when I extrapolate to $L=\infty$."

  "We don't have infinite crystals, Sara," Elias said. "We have grams of powder. The thermodynamic limit is a mathematical convenience, not a physical requirement for the phase to exist."

  "In the math, the phase transition is a singularity," Sara countered. "In your finite boxes, it's just a crossover. If the singularity isn't there, the order parameter isn't well-defined. You're fitting a model that assumes a sharp transition to data that comes from a system that can't support one."

  Ken, the beamline technician, leaned against the doorframe holding three mugs of coffee. He'd been awake since the shutter opened at 6 AM yesterday. "The instrument resolution function is 0.004 degrees," he said, handing out the mugs. "The peak splitting is 0.003. You're seeing convolution, not just physics."

  "We deconvoluted," Elias said.

  "You used the model profile to deconvolve," Ken said. "You assumed the peak shape to extract the width, then used the width to validate the model."

  Sara pointed at her code. "That's the leak. I tried to derive the interaction parameter $J$ from first principles. DFT gave me a value, but the transition temperature $T_c$ came out wrong. So I tuned $J$ until the simulation matched the experimental $T_c$."

  "Standard procedure," Elias said.

  "But I used *your* $T_c$," Sara said. "You determined the experimental transition temperature by looking for the onset of the peak splitting. But you defined the onset using the phenomenological law you're trying to validate. I tuned my micro-parameters to match a number that only exists because of your macro-model. Then I ran the simulation, extrapolated to infinity, and got your number back."

  Silence settled over the room, heavier than the server hum.

  Elias stood up and walked to the whiteboard. The equation there was simple, a Landau expansion free energy. It had supported three PhDs and a decade of funding. "You're saying the reduction is circular."

  "I'm saying the derivation works only because you imported the answer," Sara said. "The micro-story doesn't lead to the macro-law unless you force it to look like the macro-law at the boundary. If I run the simulation without fixing $J$ to your $T_c$, the finite systems don't show the transition at the right temperature. They show it higher. Or lower. Depending on the box size."

  "Universality," Elias said, turning back to them. "That's what you're missing. The micro-details wash out. Whether it's spins on a lattice or atoms in a perovskite, the critical exponents are the same. The robustness is the reality. The fact that you need to tune $J$ just means the ab initio calculation is off, not that the macro model is wrong. The macro behavior is stable across different micro-realizations. That makes it more real, not less."

  "It makes it independent," Sara said. "Not real. If the singularity requires the infinite limit, and we never have the infinite limit, then the transition is an artifact of the extrapolation. We are predicting a ghost."

  "The sample behaves as if it's singular," Elias snapped. "The heat capacity jumps. The symmetry breaks. We can measure it."

  "You measure the average," Ken said quietly. "The beam sees millions of grains. Some are transitioning, some aren't. The 'sharp' transition is the moment enough of them switch to shift the centroid of the peak. That's not a phase transition. That's statistics."

  Elias looked at the refinement plot again. The green line sat perfectly on the black dots. "If we pull the paper, the group loses the renewal. The phenomenological model is the hook. If we admit the micro-derivation is dependent on the macro-fit, reviewers will say we haven't explained anything."

  "If we publish it," Sara said, "we're claiming a derivation that isn't there. We're saying the bottom-up model predicts the top-down behavior, but only because we told the bottom what the top looked like."

  "We can frame it as consistency," Elias said. "The micro-model is consistent with the macro-observations given parameter optimization."

  "It's not consistency if the parameter is fixed by the observation," Sara said. "It's a mirror."

  Ken finished his coffee. "The beamline time is booked for next month. We can run the neutron scattering. That probes the correlations directly, not just the average structure. Might see if the correlation length actually diverges or just hits the grain size."

  "Neutrons won't fix the fitting circularity," Sara said.

  "No," Ken said. "But it might tell us if the grain size matters. If the transition smears out below a certain grain diameter, then Elias is wrong about the limit. If it stays sharp regardless, Sara is wrong about the finite size."

  Elias sat down. He looked at the grant application draft. Section 4: *Theoretical Foundation*. He highlighted the paragraph claiming the simulation validated the phenomenological law. His finger hovered over the delete key.

  "The extrapolation to infinity is standard stat mech," Elias said, his voice quieter now. "Every textbook does it. Are we saying every textbook is lying?"

  "Textbooks describe models," Sara said. "We're describing a sample. The sample is finite. The model is infinite. The map is not the territory."

  "The map predicts the territory," Elias said. "Perfectly."

  "Because we drew the territory on the map first," Sara said.

  Elias looked at the clock. 4:17 AM. The sun wouldn't be up for hours. The server fans spun faster, reacting to a new job submission. Sara hadn't stopped the cluster. She was running $L=60$.

  "Let it run," Elias said.

  "If $L=60$ doesn't converge?" Sara asked.

  "Then we write about the convergence failure."

  "And the grant?"

  Elias looked at the refinement plot, the perfect green line over the noisy data. He looked at the Monte Carlo graph, the hump that refused to become a spike. "We write that the reduction is leaky. We write that the macro constraints are necessary conditions for the micro derivation."

  "That's not physics," Sara said. "That's philosophy."

  "It's what the data says," Elias said. "The micro-model doesn't generate the macro-law. It requires the macro-law to function. Maybe that's the result. Maybe the emergence isn't a consequence. It's a constraint."

  Ken pushed off the doorframe. "I'll prep the neutron proposal. Just in case."

  "Wait," Elias said. He didn't touch the delete key. He saved the document under a new name: *Draft_Final_v3*. "Run the $L=60$. If it converges to the phenomenological $T_c$ without retuning $J$, we publish. If it doesn't, we admit the leak."

  "I already tuned $J$," Sara said.

  "Untune it," Elias said. "Use the DFT value. The raw one."

  "The transition won't show up," Sara warned. "The finite system will just look like a messy crossover. No singularity."

  "Then we publish the mess," Elias said. "We publish that the singularity is expensive. That it costs infinity to make the law sharp. And that without the law, the atoms don't know where to go."

  Sara's fingers hovered over her keyboard. She looked at the code, the line where $J$ was hardcoded to match the experimental $T_c$. She highlighted it. She didn't press backspace.

  "Give me an hour," she said.

  Elias stood up and walked to the window. The reflection showed the room behind him: the glowing screens, the stacked papers, the three of them suspended in the blue light. Outside, the sky was still dark. There was no line between the night and the morning, only a gradual brightening that depended on where you stood to see it.

  ***

  **Commentary Note**

  (i) **Settled vs. Contested:** The necessity of the thermodynamic limit ($N \to \infty$) for strict phase transitions (singularities in free energy) is standard statistical mechanics (settled). However, whether finite systems merely *approximate* this or whether the infinite limit represents a distinct ontological category is contested. Robustness/Universality (your category b) is widely accepted as physically significant, but whether it constitutes "strong emergence" is debated.

  (ii) **Side-taking & Leaky Reduction:** The story leans heavily on your "leaky reduction" idea without validating it as truth. It presents it as a methodological crisis. A significant chunk of the field (particularly effective field theory proponents) would reject the idea that parameter fitting invalidates the reduction; they view fitting as standard renormalization, not circularity. The story treats the "smuggling" of macro assumptions as a flaw, whereas many physicists view it as necessary boundary condition setting.

  (iii) **Guesses/Expert Eye-rolls:** Specialists might roll eyes at the speed of the realization. In practice, this circularity is often known and ignored as "phenomenological fitting." Also, the idea that a single $L=60$ run decides the ontological status is dramatic license; finite-size scaling requires many sizes. The neutron suggestion is real, but grain size effects in powders are notoriously messy, often making the "finite vs. infinite" distinction empirically moot.
