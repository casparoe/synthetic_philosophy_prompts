answer: |-
  Here is a decision tree designed for your coffee group. Since you come from a lab background, think of this like a diagnostic flowchart for a strain of bacteria: we aren't asking what you *want* the answer to be, we're testing how your intuition reacts to specific changes in the experimental conditions.

  There are 9 decision points (nodes). Start at **Node 1** and follow the arrows based on your honest answer.

  ### **Node 1: The Standard Control**
  **Setup:** Fair coin. Heads = Wake Monday only. Tails = Wake Monday and Tuesday. Amnesia applied. You wake up.
  **Question:** What is your credence (degree of belief) that the coin landed Heads?
  *   **A:** 1/2 (50%). Waking up gives me no new info about the coin. → *Go to Node 2*
  *   **B:** 1/3 (33%). Waking up is more likely if the coin is Tails. → *Go to Node 3*
  *   **C:** Something else. → *Go to Node 9 (Unexplored/Incoherent)*

  ---

  ### **Node 2: The "Halfer" Stress Test (100-Hour Variation)**
  **Setup:** Same as above, but if Tails, you are woken 100 times (with amnesia). If Heads, you are woken once.
  **Question:** Does your credence in Heads drop significantly (e.g., to ~1%)?
  *   **A:** No, it stays at 1/2. The coin is fair; the number of wakes is irrelevant. → *Go to Node 4*
  *   **B:** Yes, it drops. More wakes means I'm more likely to be in a Tails world. → *Go to Node 5 (Hybrid/Incoherent)*

  ---

  ### **Node 3: The "Thirder" Stress Test (100-Hour Variation)**
  **Setup:** Same 100-hour variation as Node 2.
  **Question:** Does your credence in Heads drop to roughly 1/101?
  *   **A:** Yes. I weight by the number of observer-moments. → *Go to Node 6*
  *   **B:** No, it stays near 1/3. The specific number doesn't matter, just that Tails > Heads. → *Go to Node 7*

  ---

  ### **Node 4: The Tuesday Test (For 1/2ers)**
  **Setup:** Back to the Standard Control (Heads=1 wake, Tails=2 wakes). You are awake.
  **Question:** Before looking at a calendar, what is your credence that today is **Tuesday**?
  *   **A:** 1/4 (25%). (Heads=0% Tue, Tails=50% Tue. Average is 25%). → *Leaf: Lewisian Halfer*
  *   **B:** 1/2 (50%). (If it's Tails, Monday and Tuesday are equally likely). → *Leaf: Double Halfer*
  *   **C:** 1/3 (33%). (Same as the Thirder view). → *Leaf: Incoherent Halfer*

  ---

  ### **Node 5: The Hybrid Check**
  **Setup:** You answered 1/2 at Node 1, but admitted the 100-hour case changes your mind at Node 2.
  **Question:** Why did the coin probability change if "waking up" wasn't evidence at Node 1?
  *   **A:** I treat 100 wakes as different evidence than 2 wakes. → *Leaf: Unstable/Context-Dependent*
  *   **B:** I was wrong at Node 1. → *Leaf: Recovering Thirder*
  *   **C:** It's about betting utility, not belief. → *Leaf: Pragmatist*

  ---

  ### **Node 6: The Parallel Copies Test (For SIA-leaning)**
  **Setup:** 10 identical copies of you are created in parallel rooms if Tails. Only 1 copy exists if Heads. All have the same experience.
  **Question:** Do you treat these 10 spatial copies exactly the same as the 100 temporal wakes?
  *   **A:** Yes. 10 copies is the same as 10 days. P(Heads) ≈ 1/11. → *Leaf: SIA Thirder (Self-Indication)*
  *   **B:** No. Copies don't count the same as time. P(Heads) stays higher. → *Leaf: Temporal Specialist*

  ---

  ### **Node 7: The Betting Test (For SSA-leaning)**
  **Setup:** Standard Control. You are offered a bet. Win $15 if Tails, Lose $10 if Heads. Paid out *per awakening*.
  **Question:** Do you take the bet?
  *   **A:** Yes. Expected value is positive (2/3 chance to win per wake). → *Leaf: Consistent Thirder*
  *   **B:** No. The coin is fair, so the odds are 50/50. → *Leaf: Halfer in Thirder Clothing*
  *   **C:** Yes, but only because I get paid twice on Tails, not because I believe Tails is more likely. → *Leaf: SSA Thirder (Self-Sampling)*

  ---

  ### **Node 8: The Monday Information Update**
  **Setup:** Standard Control. You wake up. A reliable source tells you: "It is Monday."
  **Question:** What is your new credence in Heads?
  *   **A:** 1/2. (Back to the base rate). → *Leaf: Standard Updater*
  *   **B:** 2/3. (Heads is now more likely relative to the remaining Tails option). → *Leaf: Conditionalizer*
  *   **C:** 1/2, but I still think P(Tuesday) was 1/3 earlier. → *Leaf: Incoherent (Probability Axiom Violation)*

  ---

  ### **Node 9: The Reference Class Boundary**
  **Setup:** General question for those who didn't fit Nodes 1-3.
  **Question:** When counting "observers," do you include observers who *could* have existed but didn't (e.g., in other possible coin outcomes)?
  *   **A:** Yes. Possible observers count. → *Leaf: Modal Realist / SIA*
  *   **B:** No. Only actual observers count. → *Leaf: SSA / Actualist*
  *   **C:** I don't define "observer" rigorously. → *Leaf: Intuitionist*

  ---

  ### **The Leaves (Position Names)**

  1.  **Lewisian Halfer:** (Node 4A). Believes P(Heads)=1/2, but P(Tuesday)=1/4. Accepts that learning it's Monday increases P(Heads). Named after David Lewis.
  2.  **Double Halfer:** (Node 4B). Believes P(Heads)=1/2 AND P(Tuesday)=1/2. Often considered mathematically risky because probabilities might not sum to 1 correctly across days.
  3.  **SIA Thirder:** (Node 6A). "Self-Indication Assumption." Believes you should reason as if you are a random observer from all *possible* observers. Scales with copies and time equally.
  4.  **SSA Thirder:** (Node 7C). "Self-Sampling Assumption." Believes you are a random sample from actual observers. Often agrees with Thirders on bets but disagrees on the "why."
  5.  **Consistent Thirder:** (Node 7A). Believes P(Heads)=1/3 and bets accordingly. Views awakenings as the fundamental sample unit.
  6.  **Temporal Specialist:** (Node 6B). Treats time-slices as evidence but spatial copies as not. Rare position, hard to justify logically.
  7.  **Incoherent/Unexplored:** (Node 2B, 4C, 8C). Your answers violate standard probability axioms (e.g., probabilities don't sum to 1, or you update without new evidence). This isn't an insult; it just means your intuition hasn't been formalized yet.

  ### **Limitations of This Tree**
  *   **The "Halfer" Blind Spot:** This tree struggles to separate "Philosophical Halfers" (who argue about information content) from "Betting Halfers" (who argue about payout structures). Both often end up at Node 2A.
  *   **The "Thursday" Problem:** We didn't test what happens if she is woken on Thursday regardless of the coin. That requires a whole new branch.
  *   **Fission vs. Cloning:** Node 6 assumes copies are identical. If the copies have slight variations (like biological mutants), some positions shift.

  **How to use this at coffee:**
  Don't ask "Are you a Halfer?" Ask "If we run the 100-hour experiment, does your belief change?" If they say yes, send them to Node 5. If no, send them to Node 4. Watch where they get stuck.
