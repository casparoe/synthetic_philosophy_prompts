          *   *Selected Punchline:* "If we assume they actually use 'humor,' the variance kills us. If we assume they sequence DNA, the curve is smooth. The assumption *has* to be false to be useful."

  4.  **Drafting the Analysis (Post-Joke):**
      *   *Liberties/Strawman:* Friedman didn't say "the more unrealistic the better." He said assumptions *will* be unrealistic because they are abstractions. Critics often claim he said realism *never* matters. He said it shouldn't be the *criterion* for validation.
