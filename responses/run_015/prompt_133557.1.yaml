answer: |-
  **Title:** The MHC Maximization Hypothesis

  **Characters:**
  *   **Dr. Vane:** Senior Researcher, staunch instrumentalist.
  *   **Jay:** Grad Student, concerned with biological plausibility.

  **Setting:** A cluttered office filled with whiteboards covered in mating matrices.

  **Jay:** I've run the simulations on the new mate-selection model, Dr. Vane. The predictive accuracy is incredible. It nails who leaves the bar together 94% of the time.

  **Dr. Vane:** Excellent. And the core assumption?

  **Jay:** That's the problem. The model assumes every human instantly sequences the Major Histocompatibility Complex of everyone within a fifty-foot radius and calculates offspring immune viability before buying a drink.

  **Dr. Vane:** And do they?

  **Jay:** Biologically? No. They don't have spectrometers in their retinas. I interviewed the subjects. They say they chose partners because of "banter" or "nice eyes."

  **Dr. Vane:** *[Waves hand dismissively]* Irrelevant. Do they act *as if* they have spectrometers?

  **Jay:** Well, they end up with genetically compatible mates, so... functionally, yes. But isn't the assumption descriptively false?

  **Dr. Vane:** Jay, listen to me. If I assume they calculate banter, the variance is a nightmare. Too many variables. If I assume they calculate immune viability, the curve is smooth. The prediction holds. Therefore, the assumption is valid.

  **Jay:** But it's a lie. We're building a theory of human behavior on a mechanism that doesn't exist.

  **Dr. Vane:** We aren't building a theory of *behavior*. We're building a machine that outputs correct bets. If I assume they're guided by invisible angels who whisper genetic data, and it predicts divorce rates better than 'communication issues,' I'll take the angels.

  **Jay:** So if I write the paper...

  **Dr. Vane:** You state the assumption clearly. You show the predictive power. And if the reviewers ask if people actually have eye-spectrometers, you tell them that testing the realism of the assumption is a category error.

  **Jay:** What if the reviewers point out that eyes don't sequence DNA?

  **Dr. Vane:** Then you tell them the assumption *has* to be false to be useful. It abstracts away the noise of 'banter.' The more unrealistic the assumption, the more general the theory. Now, go add a variable for angelic interference. It might clean up the outliers.

  ***

  ### Analysis of the Joke & Friedman's Methodology

  **Liberties and Interpretations**
  The joke leans heavily on the "strong" or caricatured interpretation of Milton Friedman's *The Methodology of Positive Economics* (1953). Friedman argued that the realism of assumptions should not be the *criterion* for judging a theory; only predictive accuracy matters. However, the joke implies Friedman argued that **more** unrealistic assumptions are **better** ("The more unrealistic the assumption, the more general the theory"). While Friedman did argue that useful theories must be "descriptively false" in the sense that they abstract away details, he did not explicitly advocate for maximal absurdity. The joke treats the F-twist as a license to ignore mechanism entirely, whereas Friedman suggested the "as if" behavior was still grounded in the pressure of the environment (like the billiard player who acts *as if* they know physics because if they didn't, they wouldn't be an expert player).

  **The Counter-Example That Would Change My Mind**
  My confidence in this joke as a representation of the F-twist depends on the **Lucas Critique** (1976). If a model predicts well historically but fails when policy or environment changes because it ignored the *actual* decision-making mechanism, then Friedman's instrumentalism is dangerous.
  *   *Clarification:* If you could show me a case where the "eye-spectrometer" model predicted dating well in a stable environment but failed catastrophically when a new variable (e.g., dating apps) was introduced—precisely *because* humans actually use "banter" and not genetic sequencing—then the joke would be mocking a valid scientific failure. If, however, the "angel" model continued to predict outcomes perfectly even as the environment shifted, my mockery in the joke would be unjustified, because the mechanism truly wouldn't matter.

  **Shakiest Reasoning**
  The weakest link in my reasoning is applying economic instrumentalism to **Evolutionary Psychology**. Economics often deals with revealed preferences (what you do), making the "as if" argument easier to sustain. Evolutionary Psychology, however, often makes claims about *causal cognitive modules* (the brain actually has a cheater-detection module).
  By applying the F-twist here, I am treating Evo Psych as purely instrumental (predicting outcomes) when many practitioners claim it is realist (describing actual brain architecture). The joke works best if we treat the field as economics, but it might misrepresent how evolutionary psychologists actually defend their work (they usually argue the mechanism *is* real, not just useful). I am assuming the "F-twist" applies universally across sciences, which is a contested philosophical stance.
