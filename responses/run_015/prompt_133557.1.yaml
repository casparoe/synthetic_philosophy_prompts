      *   *Common Criticism:* It allows for "black box" modeling where the mechanism is ignored, potentially hindering deeper understanding or policy intervention.
      *   *Nuance:* Friedman didn't say *any* assumption works, only that they *should not be tested for realism* directly, but rather by the output. However, critics often interpret this as "the more unrealistic, the better" (which is a slight caricature, though Friedman did argue assumptions *must* be descriptively false to be useful generalizations).

