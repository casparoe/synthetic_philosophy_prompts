prompt: |-
  spent the last three hours arguing with a friend about advance directives and I still feel like I'm the one who's wrong even though I can't say why. Her position is basically that honoring a living will is just respecting the person, full stop — the competent them wrote it down, so the incapacitated them has to follow it, and anyone who hesitates is really just letting a doctor take over. And I get it, I do, it sounds airtight. But the case that keeps bugging me: the person with late-stage Alzheimer's who's actually not suffering, who's calm and even kind of settled, but whose directive from ten years ago says 'do not keep me alive if I can't recognize my own family.' What exactly gives the sharp ten-years-ago version of them the right to veto the content version of them? And here's the part that really throws me — we don't let a person do this anywhere else. A competent adult can't sign a contract now that binds their future self to, say, work for a year at a pittance, or to never quit a job, or to be their kid's guardian no matter what; the future self gets to change their mind about pretty much everything, a promise can be broken, a preference can be revised. So why is the one domain where the past self gets iron-clad, enforceable authority over the present self the one where the present self is least capable of objecting? I think the whole practice of advance directives quietly presupposes some particular theory of what makes a person the the same person over time, and that the theory it needs isn't the one we actually use for contracts or promises or just changing your mind. Can you reconstruct what view of personal identity and self-continuity the advance-directive practice strictly requires, seperate that from what it merely fits well with, point out where it contradicts how we treat the same person's commitments in every other context, and tell me what would have to change if we forced ourselves to use one consistent view of the self across all of it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Conflict:** The user spent 3 hours arguing with a friend about advance directives (living wills). The friend argues for strict adherence (past competent self rules). The user feels uneasy, specifically about cases like late-stage Alzheimer's where the current self seems content despite the past self's directive to refuse treatment.
      *   **User's Intuition:** The user suspects a contradiction in how we treat personal identity. We don't allow past selves to bind future selves in contracts, jobs, or guardianships (future self can change mind), *except* in medical end-of-life decisions where the future self is incapacitated.
      *   **The Task:**
          1.  Reconstruct the specific view of personal identity/self-continuity that advance directives *strictly require*.
          2.  Separate that from views that merely *fit well* with it.
          3.  Point out where this contradicts how we treat commitments in other contexts (contracts, promises, etc.).
          4.  Explain what would have to change if we forced one consistent view of the self across all contexts.
      *   **Tone:** Philosophical, analytical, empathetic to the user's unease (validating their intuition), rigorous but accessible.

  2.  **Deconstruct the Philosophical Underpinnings:**
      *   *The Friend's View:* "Precedent Autonomy." The competent self is the "true" self. The incapacitated self is a diminished version that must obey the "real" owner of the life.
      *   *The User's Counter-Example:* The "Happy Alzheimer's Patient." (This is a classic philosophical puzzle, often associated with Derek Parfit or Rebecca Dresser). If the psychological connection is broken, is it the same person?
      *   *Personal Identity Theories:*
          *   *Psychological Continuity:* Person A = Person B if there's overlap in memory, personality, preferences. (This undermines strict advance directives in dementia cases).
          *   *Biological/Animalist Continuity:* Person A = Person B if it's the same living organism. (This supports advance directives but creates the "tyranny of the past self" problem).
          *   *Narrative Identity:* We are the story we tell. (Complicated, can support either side).
      *   *Legal/Contractual Norms:* We generally allow specific performance to be voided if circumstances change drastically (doctrine of frustration, impossibility) or if personal liberty is at stake (13th Amendment prohibits involuntary servitude). We prioritize current welfare over past promises in many welfare contexts.

  3.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge the user's intuition. It's not just a feeling; it's a recognized philosophical problem (Dworkin vs. Dresser is the key debate here).
      *   **Part 1: The Strict Requirement (The "Owner" Model):**
          *   What view *must* hold for the friend's position to be absolute?
          *   It requires a **Substantive Identity View** (specifically, a Lockean "Self-Ownership" model combined with Biological Continuity).
          *   Key concept: The "Critical Interests" vs. "Experiential Interests" distinction (Ronald Dworkin). The past self owns the *life as a whole*, not just the moments.
          *   Strict requirement: Identity is binary and static. The "Then-Me" is the sole proprietor of the "Now-Me's" body.

      *   **Part 2: What Merely Fits Well (The "Best Interest" Model):**
          *   Most people *think* advance directives work because of autonomy, but in practice, they often work because of *substituted judgment* based on best interests.
          *   We often *ignore* directives if the current self seems happy (empirical fact). So the strict view isn't actually what we practice, just what we preach.

      *   **Part 3: The Contradiction (Contracts & Commitments):**
          *   User is right: We don't enforce specific performance for personal service contracts.
          *   Why? Because we value *current* autonomy and welfare over *past* commitment.
          *   Bankruptcy exists to free the future self from the past self's debts.
          *   Marriage vows can be broken (divorce).
          *   The anomaly: Medical directives are one of the few places where the "Dead Hand" of the past self controls the living body against its current apparent interests.

      *   **Part 4: Forcing Consistency (Two Paths):**
          *   *Path A (Align Medicine with Law/Contracts):* Weaken advance directives. Treat them as strong *evidence* of preference, not binding commands. Allow surrogate decision-makers to prioritize current well-being (the "Best Interest Standard") over "Substituted Judgment." This protects the "Happy Alzheimer's" patient.
          *   *Path B (Align Law/Contracts with Medicine):* Enforce past commitments more strictly. No bankruptcy, stricter contract enforcement, harder divorce. (This is dystopian and unlikely).
          *   *Conclusion:* Path A is the ethical choice. It acknowledges that personal identity is gradual, not binary.

