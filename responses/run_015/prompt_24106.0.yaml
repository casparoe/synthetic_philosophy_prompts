  1. Iterated elimination of strictly dominated strategies where the dominator can be any mixed strategy, because it eliminates all irrational strategies under independent beliefs, including those only dominated by mixes, providing the tightest valid reduction.
  2. Iterated elimination of strategies that are never a best response to any belief over the opponent's pure strategies, as this is the conceptual definition of rationalizability which coincides with mixed dominance in two-player games but allows for correlation in larger games.
  3. Iterated elimination of strictly dominated strategies where the dominator has to be a pure strategy, since while theoretically robust, it fails to narrow down the set as much as mixed dominance by leaving mixed-dominated strategies intact.
  4. Iterated elimination of weakly dominated strategies, one at a time, where you only count a strategy as gone if it gets eliminated in every possible order, because while it fixes order-dependence, the underlying assumption of avoiding weak dominance is not universally valid for rational play.
  5. Iterated elimination of weakly dominated strategies, done in simultaneous rounds, as it is the least trustworthy due to both the controversial nature of weak dominance and the remaining sensitivity to the specific sequence of elimination rounds.
