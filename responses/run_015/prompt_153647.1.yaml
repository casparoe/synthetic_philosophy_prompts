  # JOINT STATEMENT ON THE EPISTEMIC-PARITY CHALLENGE
  **A Collaborative Draft between a Phenomenal Disjunctivist and a Common-Factor Representationalist**

  ## I. AGREED CLAIMS

  We, the undersigned, acknowledge the following premises as the shared foundation for our dispute regarding the Argument from Illusion and the Epistemic-Parity Challenge. We agree that any viable theory of perceptual experience must accommodate these constraints:

  1.  **The Formal Structure of the Argument:** The Argument from Illusion, as reconstructed via the Epistemic-Parity Challenge, proceeds from the premise of *introspective indistinguishability* (a subject cannot tell via reflection alone whether they are veridically perceiving or hallucinating) to the conclusion of *ontological commonality* (the two states share a fundamental mental kind or explanatory core). We agree that the force of the argument rests on the inference from epistemic parity to metaphysical sameness.
  2.  **Causal Matching and Existence:** We agree that causally matched hallucinations are nomologically possible. That is, there are possible cases where the proximate neural causes of a subject's experience in a hallucination are identical to those in a veridical perception, despite the absence of the perceived object in the hallucinatory case.
  3.  **Epistemic Authority:** We agree that in standard cases of veridical perception, subjects possess a prima facie epistemic authority regarding their own mental states. However, we agree that this authority does not guarantee infallibility regarding the *metaphysical category* of the state (i.e., whether it is relational or representational) when causal matching is in play.
  4.  **The Disjunctivist Burden:** We agree that the Disjunctivist bears a specific explanatory burden: if veridical experience is constitutively relational (involving direct acquaintance with external objects), the Disjunctivist must explain why introspection fails to reveal this relational nature in a way that allows the subject to distinguish it from a non-relational hallucination. The "opacity" of the relational constitution to the subject is a datum that requires accommodation.

  ## II. STATEMENT OF DISAGREEMENTS

  The following table delineates our divergent commitments regarding the implications of the Epistemic-Parity Challenge. Each statement is formulated to be acceptable to the respective proponent without reservation.

  | Issue | Phenomenal Disjunctivist | Common-Factor Representationalist |
  | :--- | :--- | :--- |
  | **(a) Phenomenological Similarity and Mental Kind** | Phenomenological similarity between veridical and hallucinatory cases is an *epistemic* property (indistinguishability), not evidence of a shared *metaphysical* kind. The fundamental nature of the mental state in the veridical case is distinct from that in the hallucinatory case. | Phenomenological similarity between veridical and hallucinatory cases entails a shared *metaphysical* kind. There exists a common factor (a representational state) that constitutes the core of the experience in both cases, explaining the similarity. |
  | **(b) Relational Properties and Introspective Transparency** | Relational properties (e.g., acquaintance with an object) can constitute the phenomenal character of an experience without being introspectively transparent as relations. The subject is aware *of the object*, not necessarily aware *of the relating*. | If relational properties constituted phenomenal character, they would be introspectively accessible as such. Since subjects cannot introspectively distinguish the presence of the relation from its absence, relational properties cannot be constitutive of phenomenal character. |
  | **(c) Equivocation in the Argument from Illusion** | The Argument from Illusion equivocates between *epistemic indistinguishability* (the subject cannot know the difference) and *metaphysical indistinguishability* (there is no difference in the states themselves). The challenge conflates a limit on knowledge with a claim about ontology. | The Argument from Illusion does not equivocate. Epistemic indistinguishability is best explained by metaphysical sameness. To posit distinct kinds that are nonetheless introspectively identical is to posit a brute, unexplained coincidence that violates principles of explanatory parsimony. |
  | **(d) The Coherence of a Negative Account of Hallucination** | A negative account of hallucination is conceptually coherent. Hallucination can be defined as a state that merely *seems* to be a veridical perception, lacking the constitutive relational structure, without requiring a positive ontological status of its own (e.g., sense-data or shared content). | A negative account of hallucination is conceptually incoherent. Hallucination is a positive mental occurrence with specific phenomenal features. To explain these features, one must posit a positive internal state (representational content) that is present in the hallucination and preserved in the veridical case. |

  ## III. CRUXES, TEST CASES, AND PREDICTIONS

  For each disagreement above, we identify the specific sub-question (the Crux) that drives the divergence. We agree on a shared conceptual test case to evaluate these cruxes and record our respective predictions.

  **Shared Test Case: The Neuro-Physiologically Omniscient Subject**
  Consider a subject, *S*, who possesses complete and accurate knowledge of their own neurophysiological states in real-time but has no direct access to the external world (e.g., *S* is a brain in a vat regarding external verification, but knows their own brain states perfectly). *S* undergoes a veridical perception and a causally matched hallucination. In both cases, *S* reports identical neurophysiological states and identical first-person phenomenology.

  | Issue | The Crux (Sub-Question) | Disjunctivist Prediction | Representationalist Prediction |
  | :--- | :--- | :--- | :--- |
  | **(a) Mental Kind** | Does explanatory power require ontological unity? Is the "common factor" the *cause* of the experience or the *experience itself*? | *S*'s identical neuro-reports confirm a common *cause*, but not a common *mental state*. The metaphysical kind differs because the relational constituent exists in one case and not the other, despite *S*'s ignorance. | *S*'s identical neuro-reports confirm a common *mental state*. The internal representational structure is the experience; the external object is merely a truth-maker, not a constituent. |
  | **(b) Transparency** | Is the mind's self-intimation exhaustive of its metaphysical nature? Does "what it is like" include the external relata? | Self-intimation is not exhaustive. *S* knows the intrinsic neuro-state but fails to know the extrinsic relational fact. The relational nature is not an object of introspection but a condition of the experience. | Self-intimation is exhaustive regarding phenomenal character. If *S* cannot detect the relation introspectively, the relation is not part of the phenomenal character. |
  | **(c) Equivocation** | Is indistinguishability a positive relation or a lack of knowledge? | Indistinguishability is a lack of knowledge (epistemic). *S* fails to know the metaphysical difference because the difference is not an internal marker. | Indistinguishability is a positive relation (metaphysical). *S* fails to distinguish them because there is nothing internally to distinguish. |
  | **(d) Negative Account** | Can a mental state be defined purely negatively? | Yes. Hallucination is a failure of perceptual capacity. *S*'s positive feelings in the hallucinatory case are misleading appearances, not evidence of a positive ontological core. | No. *S*'s positive feelings in the hallucinatory case require a positive ontological ground. A mere "failure" cannot generate specific phenomenal character. |

  ## IV. CONCLUSION: ASSESSMENT OF VERBAL VS. SUBSTANTIVE DISPUTE

  We conclude by assessing the extent to which our disagreement is merely verbal versus substantively ontological.

  **1. The Verbal Component: "Content" and "Experience"**
  We acknowledge that a portion of our dispute is verbal, centering on the definition of "perceptual experience" and "content."
  *   **The Disjunctivist** uses "experience" to refer to the *factive* mental state (which only exists in the veridical case). For them, to say a hallucination has "content" implies it shares the same ontological category as veridical perception, which they deny.
  *   **The Representationalist** uses "experience" to refer to the *internal representational vehicle* (which exists in both cases). For them, to say a hallucination lacks "content" implies it is a null state with no phenomenal character, which they deny.
  *   **Resolution:** If we agree to define "content" as *any state with accuracy conditions*, the Disjunctivist may concede that hallucinations have content *in a loose sense*, provided it is understood that this content is not constitutive of the veridical state's phenomenal character. Conversely, the Representationalist may concede that "veridical experience" in the *factive sense* is unique, provided it is understood that the *phenomenal core* remains shared.

  **2. The Substantive Component: Metaphysics of Mind**
  The core dispute is not verbal but substantive. It concerns the **metaphysical grounding of phenomenal character**.
  *   **The Substantive Question:** Does the phenomenal character of a veridical perception depend constitutively on the actual existence of the external object (Disjunctivism), or does it depend solely on the internal representational state of the subject (Representationalism)?
  *   **Reasoning:** This cannot be resolved by stipulative definition. It requires a decision on whether the mind is essentially open to the world (Relationalism) or essentially self-contained and world-mapping (Representationalism). The Epistemic-Parity Challenge highlights this substantive divide: the Representationalist prioritizes the *explanatory symmetry* of the internal cause, while the Disjunctivist prioritizes the *ontological asymmetry* of the worldly relation.

  **Final Assessment:** While we can harmonize our terminology regarding "content" to facilitate dialogue, we remain fundamentally opposed on whether the external world is a *constituent* of the mind's conscious life or merely its *cause* and *target*. The Epistemic-Parity Challenge successfully isolates this metaphysical disagreement, even if it does not resolve it.
