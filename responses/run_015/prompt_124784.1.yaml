answer: |-
  ### The "Unexpected Spaces" Art Eligibility Procedure (v1.0)

  **Purpose:** To determine if a proposal meets the charter definition of "art" based on functional disruption and institutional precedent.
  **Time Budget:** 15 Minutes per file.
  **Reviewer Requirement:** No aesthetic training needed. Requires internet access for precedent checks.

  ---

  #### Step 1: The Intent & Presentation Check
  **Question:** Does the applicant explicitly frame this object/action as a presentation to an audience, rather than a utility or a private act?
  *   **Look for:** Artist statements, plaques, signage, scheduled times, designated viewing areas, or documentation intended for public consumption.
  *   **Sufficient Answer:** YES if there is evidence the work is *meant to be encountered* as a statement, not just used.
  *   **Hard No:** If the work is purely functional with no framing (e.g., a pothole repair, a standard bench), **STOP. NOT ART.**
  *   **Hand-off:** If the intent is ambiguous (e.g., is this graffiti or vandalism?), flag for Human Review.

  #### Step 2: The Functional Disruption Check
  **Question:** Does the work suspend or break the normal "use-category" of the materials or space involved?
  *   **Look for:** Is a tool being used as a sculpture? Is a walkable space made un-walkable? Is a sound meant to be ignored made the focus?
  *   **Sufficient Answer:** YES if the primary purpose is *not* the object's standard utility. (e.g., A chair you cannot sit on is art; a chair you sit on is furniture).
  *   **Hard No:** If the object performs its standard function perfectly and is valued *for* that function, **STOP. NOT ART.** (It may be Design or Infrastructure).
  *   **Note:** The work can *look* functional, but its *categorization* must be shifted.

  #### Step 3: The Precedent Check (The "Google Test")
  **Question:** Can you find evidence that recognized art institutions (museums, galleries, academic journals, major festivals) have treated *similar* work as art?
  *   **Look for:** Search terms linking the medium/method to "contemporary art," "performance art," "installation," or specific movements (Minimalism, Conceptualism, Social Practice).
  *   **Sufficient Answer:** YES if you find at least 2-3 credible examples of similar work exhibited or critiqued as art in the last 50 years.
  *   **Hard No:** If the search returns only craft, design, therapy, or activism results with no fine-art link, **STOP. NOT ART.**
  *   **Hand-off:** If the work is highly innovative and has *no* precedent, flag for Human Review (The "Innovation Paradox").

  #### Step 4: The Human Hand-off (Values vs. Facts)
  **Status:** If Steps 1, 2, and 3 are all **YES**, the proposal **COUNTS AS ART.**
  *   **CRITICAL LIMIT:** This procedure does **not** determine if the art is *good*, *ethical*, *worth funding*, or *safe*.
  *   **Action:** Pass the file to the Board Chair. Attach a note: *"Eligibility Met. Merit/Value Judgment Required."*
  *   **Why:** You have verified category, not quality. Public money requires a value judgment this procedure cannot make.

  ---

  ### Procedure Limitations (Read Before Use)
  1.  **It cannot judge quality.** A masterpiece and a trash heap can both pass this test.
  2.  **It biases toward the known.** Radical new forms that lack precedent (Step 3) will fail unless you use the Hand-off.
  3.  **It cannot assess community impact.** Art can be legally eligible and socially harmful.
  4.  **It creates "Bureaucratic Art."** Applicants will learn to write proposals that tick these boxes rather than make meaningful work.

  ---

  ### Test Run: Three Proposals

  #### Case 1: The Laundry Baskets
  *Proposal:* A stack of clean laundry baskets arranged in a laundromat with a small plaque reading "Installation: Baskets."
  *   **Step 1 (Intent):** **YES.** The plaque explicitly frames it as an "Installation." It is presented for viewing.
  *   **Step 2 (Disruption):** **YES.** Laundry baskets are normally for holding clothes. Stacked statically as a sculpture, they are removed from their utility. They are not being used to launder.
  *   **Step 3 (Precedent):** **YES.** Search for "Minimalist sculpture readymades." Results: Carl Andre (floor pieces), Duchamp (readymades), Felix Gonzalez-Torres (stacks). Museums treat stacked industrial objects as high art.
  *   **Step 4 (Result):** **PASSES AS ART.**
  *   **Reviewer Note:** *This fits the definition perfectly. It is conceptually identical to works in MoMA. However, it requires zero craft and uses existing laundromat equipment. You will likely hate funding this.*
  *   **Action:** Forward to Chair with note: *"Eligible. Question of Value/Merit is yours."*

  #### Case 2: The Beautiful Bus Shelter
  *Proposal:* A genuinely beautiful bus shelter designed by an architect who says she intended it as public art, but it's fully functional and looks basically like every other shelter except for color.
  *   **Step 1 (Intent):** **YES.** Architect claims art intent.
  *   **Step 2 (Disruption):** **NO.** It is a bus shelter. It shelters bus riders. Its primary categorization is "Infrastructure/Design." It does not break the function; it fulfills it elegantly.
  *   **Step 3 (Precedent):** **N/A.** (Failed Step 2).
  *   **Step 4 (Result):** **DOES NOT COUNT AS ART.**
  *   **Reviewer Note:** *Under this procedure, this is Design or Architecture, not Art. Even if beautiful, it remains in its "use-category."*
  *   **Action:** Reject eligibility. Suggest they apply for an "Infrastructure Beautification" grant if one exists.

  #### Case 3: The Invisible Performer
  *Proposal:* A performer who silently sorts trash in a park for three hours, with no audience, no photos, no record at all -- just the performer insisting later that it happened and it was art.
  *   **Step 1 (Intent):** **NO.** "Presentation" implies a receiver. If there is no audience, no record, and no trace, there was no presentation. It was a private act.
  *   **Step 2 (Disruption):** **MAYBE.** Sorting trash is usually janitorial work. Doing it as "art" breaks the category *if* framed as such.
  *   **Step 3 (Precedent):** **YES.** "Social Practice" and "Performance Art" (e.g., Mierle Laderman Ukeles) treat maintenance as art.
  *   **Step 4 (Result):** **DOES NOT COUNT AS ART.**
  *   **Reviewer Note:** *Fails Step 1. Art requires a public frame. An unrecorded, unwitnessed act is indistinguishable from hallucination or actual janitorial work in a grant context. Without a trace, there is no "presentation."*
  *   **Action:** Reject eligibility.

  ---

  ### The "Hate" Answer & The Blind Spot

  **The Answer You Will Hate:**
  **Case 1 (The Laundry Baskets).**
  Your procedure *must* classify this as art. By your own definition (breaking function + institutional precedent), this is a textbook example of Minimalist/Conceptual art. If you reject this, you are rejecting works held by the Tate Modern and the Guggenheim.
  *   **Why you'll hate it:** It looks like zero effort. It uses public space for something that looks like "nothing." It risks public outrage ("My tax dollars paid for stacked baskets?").
  *   **Why the procedure says Yes:** Because the procedure defines *category*, not *merit*. The Board Chair must decide if *this specific instance* of the category is worth public money.

  **What This Procedure Cannot Settle:**
  No matter how carefully you run this, it cannot resolve the **Tension Between Access and Standards.**
  1.  **The "Grift" Problem:** A skilled applicant can write a proposal that ticks Step 1, 2, and 3 using jargon, creating "zombie art" that fits the definition but has no soul. This procedure lets them in.
  2.  **The "Community" Problem:** Something can be "Art" (passes all steps) and still be offensive, dangerous, or unwelcoming to the neighborhood where the "unexpected space" exists. This procedure has no ethics module.
  3.  **The "Innovation" Problem:** If an artist invents a *new* form of art that has no precedent (Step 3), this procedure rejects it. You are funding the history of art, not the future of it, unless you override Step 3.

  **Final Advice:** Use this procedure to keep the *cranks* out (Case 3) and the *contractors* out (Case 2). But be prepared to defend the *baskets* (Case 1) to the public, because the procedure says they are right, even if your gut says they are wrong. That defense is the Board Chair's job, not yours.
