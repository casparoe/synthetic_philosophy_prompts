answer: |-
  This is a sharp observation of a specific cultural ritual that has emerged in the last decade. You are describing a **ritual of de-consecration** that treats the monument not as a single object, but as a composite of *matter*, *location*, and *sanction*.

  Here is a reconstruction of the implicit theory driving these decisions, an analysis of its internal coherence, and a look at how things would change under flatter theories.

  ### 1. The Implicit Theory: "Contextual Consecration"

  The current practice presupposes a theory I would call **Contextual Consecration**. Under this view, a monument is not the bronze figure itself; it is the *relationship* between the figure, the plinth, and the civic space.

  *   **The Object is Evidence:** The bronze itself is treated as a historical artifact. It is a primary source document of the era that made it (and the era that tore it down, if left with ropes/paint). Destroying it is seen as Stalinist erasure or iconoclasm; preserving it is archival duty.
  *   **The Plinth is the Verb:** The plinth in a public square is the grammatical structure that turns the noun (the man) into a verb (honoring). To be on the plinth is to be endorsed by the current polity. To be removed is to have that endorsement revoked.
  *   **The Museum is the Subjunctive Mood:** Moving the statue to a museum shifts it from the indicative ("He is a hero") to the subjunctive ("He *was* considered a hero," or "This is what a hero looked like to them"). The museum neutralizes the honorific power while retaining the informational content.
  *   **The Empty Plinth is a Caesura:** Leaving the plinth bare presupposes that the *space* itself is charged. It acknowledges that the removal was a wound or a question that cannot be immediately sutured over with a new statue. It treats the absence as a form of memory.

  **The Hierarchy of Memory:** The inconsistency you note (statue gone, street name remains) reveals a hierarchy within this theory.
  *   **Statues** = Active, visual, ritualistic honor. (High sensitivity)
  *   **Names** = Administrative, utilitarian, inertial reference. (Low sensitivity)
  The theory assumes that a statue *does* something (commands attention, occupies vertical space), whereas a name *labels* something. You can keep the label while retiring the ritual.

  ### 2. Strict Requirements vs. Contingent Fits

  If we dissect this practice, we can separate what is essential to the "Contextual Consecration" theory from what is merely a pragmatic compromise.

  **Strictly Required by the Theory:**
  1.  **De-platforming:** The figure *must* come off the civic plinth. As long as it is there, the state is implicitly re-ratifying the honor.
  2.  **Non-Destruction:** The object *must* survive. If it is melted down, it ceases to be evidence and becomes a political purge. The theory requires the past to remain legible, even if disavowed.

  **Merely Fits Well With (Contingent/Contradictory):**
  1.  **Museum Display:** This fits the "evidence" requirement but isn't strictly necessary. Storage would preserve the object without risking the museum becoming a pilgrimage site for sympathizers. Displaying it with protest ropes implies the *protest* is now part of the official history, which is a specific curatorial choice, not a logical necessity.
  2.  **The Empty Plinth:** This fits the "acknowledgment of conflict" vibe, but the theory doesn't demand it. You could replace it immediately with a plaque explaining the removal. Leaving it empty suggests we don't know what comes next, which is an emotional stance, not a theoretical requirement.
  3.  **Retaining Names:** This actually *contradicts* the theory's moral logic but fits its pragmatic need for stability. If the man is no longer worthy of the plinth, the theory suggests he is no longer worthy of honor. Keeping the school name is a concession to cost and bureaucracy, not philosophical consistency.

  ### 3. Do the Parts Hang Together? (Coherence Check)

  You asked if these moves rely on conflicting views. **Yes, they do.** The current package is a *modus vivendi* (a way of living together) rather than a coherent philosophy. It stitches together three different theories to avoid satisfying any single one completely.

  *   **The Museum Move** relies on an **Educational/Historical View**: "We must learn from the past."
  *   **The Preservation Rule** relies on an **Anti-Erasure View**: "Destroying history is authoritarian."
  *   **The Empty Plinth** relies on a **Memorial/Trauma View**: "Some wounds should not be covered up; silence speaks."

  **The Contradictions:**
  *   **Honor vs. Evidence:** If the statue is merely evidence (museum), why does its presence in the square constitute honor? If it's just metal, why does moving it 5 miles to a warehouse stop the "harm"? The theory relies on a magical thinking about geography: that *here* is sacred, but *there* is neutral.
  *   **The Plinth vs. The Name:** If the statue is removed because the man's legacy is toxic, keeping his name on a school suggests the toxicity is only visual, not nominal. This implies the monument was about **aesthetics of power**, not **moral endorsement**.
  *   **Preservation vs. De-consecration:** If you leave the protest ropes on the statue in the museum, you are preserving the *act of rejection* as part of the monument. This turns the statue into a monument to the *protesters*, not the subject. This creates a confusing ontology: Is this a statue of Lee/Colston, or a statue of the Toppling of Lee/Colston?

  **Verdict:** They can be had at once, but only by accepting ambiguity. The system works *because* it is theoretically messy. It allows the removal faction to claim victory (he is down), the preservation faction to claim victory (history is saved), and the administration to claim neutrality (we are just curating). A coherent theory would force harder choices.

  ### 4. Swapping in "Flatter" Views

  If we replaced "Contextual Consecration" with a flatter, more literal theory, the handling of contested monuments would change drastically.

  #### View A: The Monument as State Speech
  *Theory:* A monument is a proposition uttered by the state: "X is a hero."
  *Implications:*
  1.  **Consistency is King:** You cannot take down the statue and keep the street name. That is the state saying "X is not a hero" and "X is a hero" simultaneously. One must go.
  2.  **No Empty Plinths:** Silence is not a speech act. An empty plinth is ambiguous. If the state removes the speech, it must replace it with new speech (a plaque, a new figure, a park) that explicitly states the new value. Leaving it empty is an abdication of speech.
  3.  **No Museum Compromise:** If the speech is deemed harmful (hate speech, lies), the state does not archive harmful speech in a gallery; it retracts it. The statue might be stored, but displaying it risks re-uttering the proposition.
  *Result:* Much more ideological purity, much less historical nuance. Purges would be more thorough, but the "lesson of history" aspect would vanish.

  #### View B: The Monument as Decoration
  *Theory:* A statue is urban furniture, like a lamppost or a bench. It has aesthetic value but no moral weight.
  *Implications:*
  1.  **Melting is Fine:** If it's just decor, and it's unpopular, you recycle the bronze. There is no "erasure of history" because the statue was never history; it was just ornament.
  2.  **No Empty Plinths:** An empty plinth is an eyesore. You fill it with something that looks nice or functions better (a water fountain, a tree).
  3.  **No Moral Conflict:** The "fight" is reclassified as a zoning or aesthetic dispute. You don't need a plaque explaining the moral failure of the subject; you just need a sign saying "Removed due to community feedback."
  *Result:* Conflict dissipates because the stakes are lowered, but we lose the ability to use public space to negotiate collective values.

  ### Summary
  The current practice assumes monuments are **magic**: they transmute metal into honor via the ritual of placement.
  *   It **requires** breaking the ritual (removal) and saving the prop (preservation).
  *   It **tolerates** contradictions (names staying, empty plinths) to keep the peace.
  *   It **avoids** the harder questions of State Speech (which demands consistency) or Decoration (which demands indifference).

  We keep the statue in the museum and the plinth empty because we want to have our cake (moral progress) and eat it too (historical continuity). It is a theological solution to a political problem: we are excommunicating the figure without burning the bible.
