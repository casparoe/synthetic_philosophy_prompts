          *   *Verdict:* Keep (4) but redefine the "wrong." The wrong isn't lying about words; it's lying about *who they were*.

      *   **Addressing Bullet 4 (Narrative History vs. Biopic - Premise 6):**
          *   *The Difference:* It's not about the *content* (both fill gaps). It's about the *medium's phenomenology*.
