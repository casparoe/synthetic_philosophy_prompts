      *   (7) Conclusion: Biopics/History are systematically wrong; stick to docs/archives.

  3.  **Identify the Weak Point:**
      *   The core tension is between *literal truth* (verbatim accuracy) and *narrative truth* (representing the essence/character/reality of events).
      *   The friend's Premise (1) is the strongest candidate for rejection or modification. It assumes a "literalist" theory of representation.
      *   However, simply saying "it's art" isn't enough because the user wants to know the *cost*.
      *   The translation/subtitling counter-example provided by the user is the key. It proves that audiences understand cinematic representation involves *translation* (literally and metaphorically).
      *   Therefore, the assertion isn't "Person X said Words Y." The assertion is "Person X was the kind of person who would say something like Words Y in Context Z."

  4.  **Drafting the Response - Step-by-Step:**

      *   **Introduction:** Acknowledge the strength of the friend's argument (it's internally consistent) but pinpoint the flaw (Premise 1).

      *   **Addressing the Core Break (Premise 1):**
          *   *Why it looks fine:* It treats film like a transcript. It appeals to our intuition that "seeing is believing."
          *   *Why it breaks:* It ignores the convention of *dramatization*. Audiences know actors are acting.
