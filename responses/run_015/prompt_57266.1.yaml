answer: |-
  The break is at **(1)**.

  Your friend's argument is airtight *if* you accept that a dramatic film functions as a transcript. It looks fine going in because it appeals to a strong intuition: seeing a person speak feels like witnessing an event. If I see a man on screen say "I am guilty," I believe the character is confessing. If that character is named "Nixon," the intuition is that Nixon confessed.

  But (1) fails because it ignores the **convention of dramatization**. Audiences do not watch biopics with the same epistemic stance they use for surveillance footage. They understand they are watching a *reconstruction*, not a *recording*.

  Here is the price of rejecting (1), and how it answers your four specific pricing requests.

  ### 1. The Pretense/Make-Believe Fix (and the Documentary Problem)
  If you reject (1) by saying biopics don't assert facts but rather invite "make-believe" (Walton-style), you run into the problem you noted: Documentaries also construct reality. If a documentary uses a reenactment or even just selective editing, is it also pretense?

  **The Repair:** You must distinguish between **propositional assertion** and **illustrative demonstration**.
  *   A documentary asserts propositions: "This event happened on this date."
  *   A biopic demonstrates a thesis: "This is what the experience of this person was like."

  **The Cost:** You lose the ability to judge the film on factual accuracy alone. You have to judge it on *fidelity*.
  If the film is pretense, the disclaimer in (5) actually *does* work. It shifts the frame from "This is a record" to "This is a model." The second horn of (5) collapses because the film isn't claiming to teach you *what was said*, but *what it meant*.
  **The Price:** You make the audience complicit. If the audience chooses to treat the pretense as fact, the filmmaker has a defense ("We told you it was a drama"), but the historical record is still polluted. You are trading the filmmaker's liability for the audience's literacy.

  ### 2. The Hedged/Approximate Assertion Fix
  If you reject (1) by saying the film *does* assert, but the content is hedged, you need to define the hedge precisely.

  **The Repair:** The assertion is not "She said X." The assertion is **"Saying X is consistent with the character and circumstances of the subject."**
  *   **Composite Characters:** Permissible if the *function* is preserved. If two colleagues advised her, and one character represents that advice, the assertion is "She received this counsel," not "She received it from this specific man."
  *   **Invented Confrontations:** Permissible if the *dynamic* is preserved. If she hated her father but they never fought in a kitchen, the assertion is "Their relationship was defined by this tension," not "They fought in a kitchen."

  **The Cost:** You introduce **subjectivity** into the truth condition.
  "Consistent with character" is a battle of interpretation. If the filmmaker thinks she was ruthless and the historical record suggests she was collaborative, a scene showing her being ruthless is "consistent" with the filmmaker's thesis but false to the subject's life.
  **The Price:** You cannot distinguish between a "good lie" (captures the spirit) and a "bad lie" (captures the filmmaker's bias) without appealing to external historical consensus. This means the biopic cannot stand alone as evidence; it is parasitic on the very history books your friend wants you to read instead.

  ### 3. Dropping (4): Obligations to the Dead
  You said you'd rather lose (1) than (4). That is the safer moral bet, but it requires redefining the "wrong."

  **The Repair:** Keep (4). We do owe the dead fidelity. But the fidelity is owed to their **agency and legacy**, not their **transcript**.
  The abuse of trust in (3) is real, but the victim isn't the dead person (who feels nothing); the victim is the **public's understanding of history**. The dead are harmed only insofar as their legacy is distorted.

  **The Cost:** If you keep (4) but reject (1), you admit that **truth is not the only value**.
  Sometimes, a fabricated scene teaches the truth about an era better than a dry recitation of facts. If you hold (4) rigidly, you privilege *accuracy* over *understanding*.
  **The Price:** You must accept that sometimes, to honor the dead (4), you must lie about their words (1). If the truth is too complex to fit in two hours, a simplification (a lie by omission or compression) might be the only way to keep their memory alive. The cost is accepting that **myth-making is sometimes a moral necessity** to prevent oblivion.

  ### 4. Narrative History vs. Biopic (The Premise 6 Problem)
  Your friend is right that narrative history fills gaps. So why is the biopic treated differently?

  **The Repair:** The difference is **phenomenological**.
  *   **Text:** When a historian writes, "He likely felt angry," the word "likely" and the medium of text remind you this is an inference. You are processing a *claim*.
  *   **Film:** When an actor scowls and shouts, you perceive an *event*. Film bypasses the critical faculty of "inference" and triggers the faculty of "witnessing."

  **The Cost:** Biopics carry a **higher burden of care** than books.
  Because film feels like perception, it imprints on memory as "something I saw" rather than "something I read." A lie in a book is a proposition to be debated; a lie in a film is a memory to be unlearned.
  **The Price:** You cannot treat them the same. If narrative history is off the hook, it is because the medium signals its own uncertainty. Biopics must adopt signals of uncertainty (disclaimers, stylization, breaking the fourth wall) or they are inherently more deceptive than books, even if the *content* of the fabrication is identical.

  ### Summary of the Break
  Your friend's chain breaks at **(1)** because it conflates **representation** with **replication**.

  *   **Why it looked fine:** Because film *looks* like reality.
  *   **Why it's false:** Because film is a language, not a mirror. Subtitles prove this: we accept that the sound coming out of the TV is not the sound that came out of the subject's mouth, yet we accept the communication as valid.
  *   **The Total Cost:** By rejecting (1), you admit that **historical truth in art is a negotiated settlement**, not a discovered fact. You lose the comfort of saying "That's a lie." You gain the ability to say "That's a interpretation." But you must now do the work of evaluating whether the interpretation is *faithful*, which is harder than checking a transcript.

  Your friend wants the safety of the archive. You are arguing for the utility of the story. The stalemate exists because she is arguing about **ethics of assertion** (don't lie), and you are arguing about **ethics of communication** (make them understand). Both are valid, but they require different definitions of what a movie *is*.
