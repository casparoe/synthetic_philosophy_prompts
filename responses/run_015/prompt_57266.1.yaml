  6.  **Final Polish:** Check against the specific constraints (no citations, answer the four bullets explicitly, explain the cost). Ensure the tone is analytical and direct. (The user seems philosophically literate, so use terms like "propositional content," "phenomenology," "convention" without over-explaining).

