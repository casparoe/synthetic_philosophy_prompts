          *   *The Documentary Problem:* Documentaries also construct narratives. They aren't raw reality.
          *   *The Solution:* Distinguish between *propositional assertion* (facts) and *illustrative demonstration* (showing how facts feel). A biopic asserts "This is what it was like," not "This is exactly what happened."
          *   *Cost:* You have to accept that the audience bears some responsibility for interpreting the genre conventions.

      *   **Addressing Bullet 2 (Hedged/Approximate Content):**
          *   *The Content:* The claim isn't "She said 'No'." The claim is "She resisted pressure in this way."
          *   *The Line:* Composite characters are okay if they preserve *function* (e.g., two allies became one for pacing). Invented confrontations are okay if they preserve *psychological truth* (e.g., she hated her father, even if they didn't fight in this room).
          *   *The Cost:* It introduces vagueness. "Psychological truth" is subjective. It opens the door to propaganda ("He was a tyrant" vs. "He was strict").

      *   **Addressing Bullet 3 (Obligations to the Dead - Premise 4):**
