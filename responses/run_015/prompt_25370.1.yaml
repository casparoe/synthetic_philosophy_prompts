      *   **Organic Unities:** This is the crucial concept. Moore argues that the value of a whole is not simply the sum of the values of its parts. A part might have little intrinsic value on its own but be essential for a highly valuable whole.
      *   **Intrinsic Value:** Value that a thing has in isolation, regardless of consequences or context.
      *   **The Greatest Goods:** Moore identifies two main categories: the pleasures of human intercourse (personal affection) and the enjoyment of beautiful objects (aesthetic appreciation).
      *   **Cognition/Consciousness:** For Moore, value resides in states of consciousness. It's not just the object (the beautiful thing or the virtuous person) but the *appreciation* or *love* of that object.

  3.  **Deconstruct the Paragraph (§122):**
