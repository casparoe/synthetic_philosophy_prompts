      *   *Conclusion 1:* The value of admiring mental qualities lies in its contribution to the *whole* state (affection + body + mind), not in its high intrinsic value *by itself*.
      *   *Conclusion 2 (The controversial bit):* It is doubtful whether admiring mental qualities *by itself* is as valuable as appreciating mere corporeal beauty *by itself*.

  4.  **Address the "Contradiction":**
      *   Does this contradict the claim that personal affection is the highest good?
      *   *No.* Because personal affection is a *complex whole*.
      *   Moore is distinguishing between the *constituents* of the whole.
      *   The *Whole* (Affection for a person including body and mind) > The *Whole* (Appreciation of mere beauty).
      *   However, one *Part* of the first whole (Admiration of mind alone) might be < One *Part* of the second whole (Appreciation of beauty alone).
      *   This is the principle of Organic Unity in action. $Value(A + B) \neq Value(A) + Value(B)$. Sometimes $Value(A + B) \gg Value(A) + Value(B)$.

