answer: |-
  This is one of the most notoriously tricky passages in *Principia Ethica*, and your confusion is well-founded. It strikes at the heart of Moore's method and his specific theory of value.

  You are correctly identifying a tension: How can Moore claim personal affection is the greatest good, while simultaneously suggesting that admiring a beautiful face might be more valuable *in itself* than admiring a virtuous soul?

  To unpack this, we have to look at Moore's doctrine of **Organic Unities**, his distinction between **parts and wholes**, and his specific intuition about **consciousness**.

  ### 1. The Key Concept: Organic Unities
  The single most important tool for reading this paragraph is Moore's Principle of Organic Unities (introduced in Chapter 1, but operationalized here). Moore argues that **the intrinsic value of a whole is not necessarily proportional to the sum of the intrinsic values of its parts.**

  *   **Formula:** $Value(Whole) \neq Value(Part A) + Value(Part B)$
  *   **Implication:** A part can have very little (or even negative) value in isolation, yet be absolutely essential to a whole that has immense value.

  **The Salt Analogy:**
  Think of a delicious cake. The cake (the whole) has high positive value. Salt is a necessary ingredient (a part). However, if you eat a spoonful of salt *in isolation* (in itself), it has negative or low value. The fact that salt is less valuable than sugar *in isolation* does not mean you should remove the salt from the cake. The salt contributes to the value of the *whole* far more than its *isolated* value suggests.

  ### 2. Unpacking the Distinction: "In Itself" vs. "Contribution to a Whole"
  In §122, Moore is applying the Organic Unity principle to **Personal Affection**.

  He analyzes Personal Affection as a complex state of consciousness comprising (roughly) three elements:
  1.  **The Emotion:** The feeling of love/affection.
  2.  **The Object (Mental):** The admiration of the person's character/virtue.
  3.  **The Object (Physical):** The appreciation of the person's bodily expression (voice, face, actions).

  **The "In Itself" Claim:**
  Moore is asking you to perform a mental abstraction. Imagine stripping away the body and the specific relationship. Imagine just the state of "admiring virtue" in the abstract.
  *   Moore's intuition is that this abstract state is somewhat cold, intellectual, and less vivid.
  *   Compare that to "appreciating corporeal beauty" (e.g., looking at a beautiful sunset or a sculpture). That state is vivid, immediate, and emotionally resonant.
  *   Therefore, **in isolation**, the consciousness of beauty > the consciousness of moral admiration.

  **The "Contribution to a Whole" Claim:**
  Now, put the parts back together. When you love a person, you don't just admire their virtue in a vacuum; you admire their virtue *embodied* in them.
  *   The "admiration of mental qualities" acts like the salt in the cake.
  *   Without it, you just have lust or aesthetic appreciation of a body (which is less valuable than full love).
  *   With it, the whole state becomes **Personal Affection**, which Moore ranks as the *greatest* good.
  *   So, while admiring virtue *alone* is less valuable than admiring beauty *alone*, admiring virtue *as part of loving a person* makes the whole state more valuable than mere aesthetic appreciation.

  ### 3. Is Moore Committed to the Paradox?
  Yes, he is committed to the claim, but not in the way that threatens his main thesis.

  When he writes, *"It even appears to be doubtful, whether, in itself, it possesses so much value as the appreciation of mere corporeal beauty,"* he is **not** saying beauty is better than love. He is saying:
  *   $Value(Appreciation of Beauty) > Value(Admiration of Virtue_{isolated})$
  *   **BUT**
  *   $Value(Love_{whole}) > Value(Appreciation of Beauty)$

  He is actually doubling down on his main thesis by arguing against a purely spiritualized view of love. If Moore argued that "admiring virtue" was the most valuable thing *in itself*, he would be arguing that the body doesn't matter. By saying the bodily expression is necessary to "heighten the value of the whole," he validates the physical component of human relationships. He is arguing that **embodied love** is the highest good, not **abstract moral admiration**.

  The phrase "appears to be doubtful" is standard Moorean hedging. As an intuitionist, he cannot *prove* this logically; he can only report on what seems self-evident to him upon reflection. He invites you to test the intuition: Close your eyes and imagine "admiring justice." Now close your eyes and imagine "seeing a perfect sunset." Which state of consciousness feels more intrinsically valuable? Moore bets on the sunset. But he insists that loving a just person is better than both.

  ### 4. How This Fits the Larger Argument of the Chapter
  This paragraph serves three critical functions in the final chapter ("The Ideal"):

  **A. It prevents Asceticism.**
  Many ethical systems (Kantianism, certain religious views) suggest that the body is a distraction and only the "Good Will" or the "Soul" matters. Moore is pushing back. He wants to say that the *bodily expressions* are not just instrumental; they are constitutive of the highest good. You cannot have the highest good without the physical element.

  **B. It clarifies the nature of "Good."**
  Moore is a hedonist of a sort (though he rejects Hedonism as a theory). He believes value resides in **states of consciousness**. A state of consciousness involving vivid aesthetic appreciation is often more intense and "valuable" per unit than a state of abstract moral reasoning. He is prioritizing the *quality of the experience* over the *moral status of the object*.

  **C. It defends the "Pleasures of Human Intercourse."**
  Moore's two greatest goods are (1) the enjoyment of beautiful objects and (2) the pleasures of human intercourse (affection). This paragraph explains why (2) is greater than (1), even though (1) contains a component (aesthetic appreciation) that is more valuable than a component of (2) (moral admiration).
  *   Affection = Aesthetic Appreciation + Moral Admiration + Reciprocal Emotion.
  *   Because it includes the aesthetic part *plus* the moral part *plus* the emotional bond, it wins.

  ### Summary for your Seminar
  If you are asked about this in class, here is the concise takeaway:

  1.  **Don't read it as a contradiction.** Moore is distinguishing between the value of a **constituent** and the value of the **complex whole**.
  2.  **Invoke Organic Unity.** Explain that for Moore, a necessary condition of a great good (admiring character) need not be a great good in isolation.
  3.  **Highlight the Embodiment.** Moore is arguing that love requires a body. Stripping the body away makes the affection abstract and less valuable. Therefore, the "corporeal beauty" is not a distraction from the good, but a necessary ingredient of the *greatest* good.
  4.  **The "Doubtful" Claim.** Moore is prioritizing the vividness of consciousness. Aesthetic experience is more immediate than moral admiration. But the *combination* of the two in personal affection creates the supreme value.

  Moore isn't saying you should stare at statues instead of loving your friends. He's saying that when you love your friends, the fact that you can *see and hear them* is part of what makes that love the highest good, even if "moral admiration" alone is a bit dry compared to "aesthetic wonder."
