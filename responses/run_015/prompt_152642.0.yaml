      *   **Tension (1) vs (3):** This is the classic occasionalism vs. compatibilism/libertarianism clash. If God creates *every* event directly (1), then human choices cannot *produce* actions in a robust sense without compromising divine omnipotence/unicity of action. Ghazālī typically denies created causal powers (including human) to preserve divine sovereignty, though he tries to salvage accountability via "acquisition" (kasb). Claiming "real secondary causation" (3) directly contradicts "God creates every event directly" (1) if "creates" implies exclusive agency.
      *   (4) Mental events cause physical ones vs. (1) God creates physical ones. If mental events *cause* physical ones, they have causal power. If God creates physical ones directly on the occasion of mental ones, the mental event isn't the cause, God is. So (1) vs (4) is also tense.
      *   (2) Science tracks habits vs. (6) No laws to violate. These seem consistent. If there are no necessary laws, only habits, then "violating a law" is category error.
      *   (5) Problem of Evil. This is a consequence, not necessarily an internal inconsistency, but it tensions with theodicy attempts often paired with occasionalism. However, internally within the package, it's consistent (if God does everything, God owns the evil).
