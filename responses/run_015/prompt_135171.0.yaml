answer: |-
  **PREP SHEET: Structural PAP Defense**
  **Date:** Next Thursday
  **Room:** Action Workshop (Hostile territory)
  **Goal:** Survive without crying.

  **General Vibe:** Don't get bogged down in Frankfurt exegesis. They know it better than you. Keep the focus on the *architecture* of the option space.

  **STANDING CONCESSION:** Locked-in patients. If the motor output is gone, the structural restructuring can't be actualized. I have to admit they might lack *moral responsibility* in the strict sense, even if they retain *agency* internally. Don't fight the cognitive scientist on the biology.

  ---

  ### THE 8 OBJECTIONS (Ordered by Damage)

  **1. The Infinite Regress (The "Hope Nobody Asks" Question)**
  *   **Who:** Senior Compatibilist (The Chair type)
  *   **The Q:** "If responsibility requires the ability to choose your own decision-structure, did you choose the structure by which you chose that structure? If yes, regress. If no, you're just lucky you have a good structure, which kills responsibility."
  *   **2-Min Reply:** I'm not claiming you need to *choose* the structure consciously every time. I'm claiming you need the *capacity* to reshape it over time. It's a dispositional claim, not an occurent one. We stop the regress at the "deep self" level where identification happens.
  *   **Weakness:** Ouch. This is the metaphysical killer. If they push, I have to admit that Structural PAP doesn't solve *ultimate* responsibility, it just pushes the locus back. I'd have to concede I'm offering a *sufficient* condition for responsibility within a life, not a *foundational* one for the universe. Basically, I'm a compatibilist in libertarian clothing.

  **2. The Hidden Neural Alternative**
  *   **Who:** The Libertarian
  *   **The Q:** "You're ignoring the causal chain. Even if Jones has a 'structural alternative,' the neural state preceding that structure was determined. Black could have intervened at the synaptic level before the 'architectonic choice' even formed. You haven't escaped determinism, you just hid it in a higher-order box."
  *   **2-Min Reply:** Frankfurt cases are about *robust* alternatives, not causal history. My point is that the *space of reasons* is what matters for responsibility, not the *space of neurons*. Even if the neural state is determined, if the agent identifies with the structure, the determination doesn't bypass *them*.
  *   **Weakness:** They won't buy the reasons/neurons split. If the neural state is fixed, the "structural choice" is an illusion. I risk sounding like I'm ignoring physics.

  **3. The "Flicker" Strategy**
  *   **Who:** Hardcore Frankfurtian Compatibilist
  *   **The Q:** "Frankfurt already allows for 'flickers' of freedom (like deciding on one's own vs. being forced). Your 'structural alternative' is just a fancier flicker. It's not robust enough to ground PAP because Black still ensures the outcome."
  *   **2-Min Reply:** A flicker is a side-effect. A structural alternative changes the *game board*. Refusing because you're forced vs. refusing because you're virtuous is a flicker. Becoming the *kind of agent* for whom refusal is the default is a structural change. It's about the shape of the will, not the sign of the intervention.
  *   **Weakness:** Hard to draw the line. Is "shape of the will" just a complex flicker? If Black controls the outcome, does the shape matter?

  **4. The Locked-In Action Space**
  *   **Who:** The Cognitive Scientist
  *   **The Q:** "My patients retain high-order cognition and 'structural' intent but lack motor output. By your view, do they lose responsibility? That seems to tie moral status to muscle function."
  *   **2-Min Reply:** (Concede) Yes, strictly speaking. Responsibility requires the ability to *enact* the structure in the world. If the feedback loop between intention and world is severed, the 'option space' is theoretical, not real. They retain dignity, but not accountability for *actions* they cannot perform.
  *   **Weakness:** Feels ableist. Risks alienating the CogSci who could be an ally. Might need to soften "accountability" vs "moral worth."

  **5. Black's Scope**
  *   **Who:** Any Frankfurt Expert
  *   **The Q:** "Why couldn't Black monitor the structural shifts? If Black is a neuroscientist god, he can tweak Jones's character so Jones never *would* refuse. Then there's no structural alternative either."
  *   **2-Min Reply:** Then it's a different case. Standard Frankfurt cases assume Black intervenes on the *action*, not the *character formation*. If Black controls character formation, Jones is a puppet, and I agree he's not responsible. Structural PAP only works if the agent owns their character development.
  *   **Weakness:** Limits the scope of my theory. Admits there are Frankfurt cases where I lose.

  **6. The Tracing Problem**
  *   **Who:** Compatibilist (History focus)
  *   **The Q:** "Most of our 'structure' is formed by childhood/trauma. Jones didn't choose to be the kind of agent who refuses. He was raised that way. So where's the responsibility?"
  *   **2-Min Reply:** Tracing. We track back to moments of minor resistance. You don't need to build the whole house at once, just lay a few bricks differently over time. Structural PAP allows for gradual reshaping.
  *   **Weakness:** Vague. How many bricks? If the childhood was fully determined, the tracing just leads back to the regress problem (#1).

  **7. Relevance of the Counterfactual**
  *   **Who:** Pragmatist / Consequentialist leanings
  *   **The Q:** "Jones *didn't* refuse. He *did* the crime. Why does it matter that he *could have been* a refuser? We punish the act, not the possible person."
  *   **2-Min Reply:** Because punishment assumes the agent could have been otherwise *in a way that matters*. If the structure was rigid, he's a broken machine. If the structure was flexible but he chose poorly, he's blameworthy. It distinguishes bad luck from bad character.
  *   **Weakness:** Hard to sell in a legal context. "You're guilty because you could have had better character" is a tough sell.

  **8. Definitional Vagueness**
  *   **Who:** Grad Student (trying to find a hole)
  *   **The Q:** "What exactly counts as 'architectonic'? Is it habits? Values? Neural pathways? If you can't define the structure, you can't test the alternative."
  *   **2-Min Reply:** It's the set of constraints that make certain first-order options unintelligible to the agent. E.g., A honest agent doesn't just 'choose not to lie'; lying isn't in their option space. That boundary is the structure.
  *   **Weakness:** Metaphorically nice, technically fuzzy. Hard to operationalize.

  ---

  **EMERGENCY EXIT STRATEGY:**
  If they gang up on #1 (Regress) and #2 (Neural), pivot to: "I'm not solving Metaphysical Freedom, I'm solving Moral Attribution." Admit Structural PAP is a normative tool, not a metaphysical proof. Better to be a useful normative theorist than a failed metaphysician.

  *Note: Check mic before starting. Last time the feedback loop was worse than my argument.*
