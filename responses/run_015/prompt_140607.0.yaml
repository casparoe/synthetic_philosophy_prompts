answer: |-
  It is very common to get these tangled up; the literature (Martin, Johnston, Lewis) uses these terms slightly differently depending on the decade, and the logic is subtle. You have indeed swapped the definitions and conflated a third category (mimics) into the mix.

  Here is the breakdown of where the muddle lies, how to classify your mug example, and the story regarding Lewis's "intrinsic basis" repair.

  ### 1. Correcting the Definitions

  The Simple Conditional Analysis (SCA) states:
  > $x$ is disposed to $M$ if $S$ **iff** if $x$ were $S$-ed, $x$ would $M$.
  > *(e.g., The glass is fragile iff if it were struck, it would break.)*

  The problem cases show that the left side (the disposition) and the right side (the conditional) can come apart.

  **The Fink (Martin's Electro-fink)**
  *   **Your definition:** No disposition, but manifests anyway.
  *   **Standard definition:** **Has** the disposition, but the trigger causes the disposition to **vanish** instantly before manifestation.
  *   **Why it breaks SCA:** The glass *is* fragile. But if you strike it, a "finkish" mechanism (like a wizard or a circuit) instantly makes it non-fragile. So, it does not break.
      *   Reality: Fragile = **Yes**.
      *   Conditional (If struck, would break) = **False**.
      *   **Result:** SCA falsely tells us the object is *not* fragile. (False Negative).

  **The Mask (Johnston's Masked Disposition)**
  *   **Your definition:** Has disposition, trigger destroys it. (This sounds more like a Fink).
  *   **Standard definition:** **Has** the disposition, the trigger happens, the disposition **remains**, but an **external** factor prevents manifestation.
  *   **Why it breaks SCA:** The glass is fragile. You strike it. But it is wrapped in bubble wrap. It doesn't break. The fragility was still there; it was just blocked.
      *   Reality: Fragile = **Yes**.
      *   Conditional (If struck, would break) = **False**.
      *   **Result:** SCA falsely tells us the object is *not* fragile. (False Negative).

  **The Mimic (Your "Fink" Example)**
  *   **Your example:** Non-fragile tumbler with an explosive charge.
  *   **Standard label:** **Mimic** (or sometimes "Reverse Fink").
  *   **Why it breaks SCA:** The glass is *not* fragile. You strike it. The charge explodes and it shatters.
      *   Reality: Fragile = **No**.
      *   Conditional (If struck, would break) = **True**.
      *   **Result:** SCA falsely tells us the object *is* fragile. (False Positive).

  ### 2. Your Mug Example

  Your example of the mug that is genuinely fragile but sprayed with a coating that stops it breaking is a classic **Mask**.

  *   **Why?** The intrinsic structure of the mug (its fragility basis) remains intact. The coating is an extrinsic interference that prevents the manifestation without removing the disposition itself.
  *   **Note:** Some philosophers distinguish "Masks" (physical barriers like bubble wrap) from "Antidotes" (chemical interactions like an antidote to poison), but for the purpose of a general seminar essay, classifying the sprayed mug as a **Mask** is standard and safe.

  ### 3. The "Intrinsic Basis" Clause

  You are remembering David Lewis's proposed repair. Lewis suggested modifying the analysis to:
  > $x$ is disposed to $M$ if $S$ iff if $x$ were $S$-ed **and $x$ retained its intrinsic basis for the disposition**, $x$ would $M$.

  **Which problem does this fix?**
  It fixes the **Fink**.
  *   **Reasoning:** In a Fink case, the trigger causes the object to *lose* its intrinsic basis (the fragility vanishes). Therefore, the antecedent of the conditional ("if struck AND retains basis") is not met. This blocks the inference that the object is not fragile. It allows us to say the object is fragile even though the simple conditional "if struck, would break" is false.
  *   **Does it fix Mimics?** Generally, yes. In your explosive tumbler case, the object lacks the intrinsic basis for fragility (the molecular structure of glass). Since it lacks the basis, the analysis doesn't attribute the disposition, avoiding the False Positive.

  **Why doesn't it fix Masks?**
  This was C.B. Johnston's major objection to Lewis.
  *   **Reasoning:** In a Mask case (your sprayed mug), the object **does** retain its intrinsic basis. The glass structure is unchanged. The interference (the spray) is *extrinsic*.
  *   So, the antecedent is met (Struck + Retains Basis).
  *   But the consequent is still false (It does not break because of the spray).
  *   Therefore, Lewis's analysis still concludes "Not Fragile," which is wrong. The "Intrinsic Basis" clause cannot filter out extrinsic interferers.

  ### Summary Table

  | Case | Does the object have the disposition? | Is the plain conditional ('if struck, would break') true? | What the added mechanism is doing | The label people standardly use | The usual repair / response |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Standard** | Yes | Yes | None. | Standard Case | None needed. |
  | **Martin's Case** | Yes | No | Trigger causes the disposition to vanish instantly. | **Fink** | Lewis's "Intrinsic Basis" clause (requires basis to be retained). |
  | **Johnston's Case** | Yes | No | Extrinsic factor blocks manifestation; disposition remains. | **Mask** | "Ceteris Paribus" clauses or Complete Analysis (specify no interferers). |
  | **Your "Fink"** | No | Yes | Extrinsic factor causes manifestation without disposition. | **Mimic** | Restriction to *Intrinsic* properties (SCA must reference intrinsic basis). |

  **Essay Tip:** If you want to impress the seminar, emphasize that Finks and Masks both generate **False Negatives** (SCA says "no disposition" when there is one), whereas Mimics generate **False Positives** (SCA says "disposition" when there isn't one). This shows you understand the logical direction of the error.
