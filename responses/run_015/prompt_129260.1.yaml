  This resolution redefines mathematical ontology as emergent stability within communal verification practices rather than mind-independent abstracta, thereby replacing causal access with procedural reliability. I assign a credence of 0.65 that this successfully navigates the dilemma without devolving into standard platonism or radical antirealism. While it elegantly sidesteps causal isolation, it risks smuggling abstractness back into the notion of stable patterns.

  2. "Factor decomposition"
  First, can social practices bear ontological weight without being merely physical events? I assign 0.7 because practices are concrete, though "stable patterns" risk reification into abstracta. This supports the overall figure by securing the metaphysical ground against physicalism (the view that only physical objects exist).

  Second, does proof-checking reliability address the epistemic horn regarding causal isolation? I assign 0.8 because procedural reliability functions as a valid non-causal knowledge mechanism. This lifts the overall figure by solving the primary epistemic objection regarding access.

  Third, does the view avoid collapsing into platonism, where patterns become mind-independent objects? I assign 0.5 because structural stability often mimics the necessity attributed to abstract entities. This drags the overall figure down due to persistent ontological ambiguity.

  Fourth, does the view avoid collapsing into antirealism, where truth becomes contingent on consensus? I assign 0.6 because formal verification constrains social contingency better than pure constructivism (the view that math is mental construction). This maintains the overall figure by preserving sufficient objectivity.

  3. "Combination and sensitivity"
  The overall credence is effectively the average of these factors, where high epistemic scores are balanced by moderate ontological risks. My confidence is most sensitive to the third factor, the risk of collapsing into platonism, because if "stable patterns" are deemed mind-independent, the epistemic horn re-emerges unchanged. A rigorous demonstration that procedural stability entails necessity without invoking abstract existence would raise my credence significantly, whereas showing that social consensus cannot guarantee trans-cultural truth would lower it.

  4. "Scope check"
  Restricting the claim to arithmetic would increase my credence to approximately 0.75, as elementary number theory is more tightly bound by finite verification protocols than higher set theory. The social practices surrounding basic arithmetic are more universal and less susceptible to divergent axiomatic choices, making the "stable pattern" argument more robust against relativist objections. Consequently, the risk of collapsing into antirealism diminishes when the domain is constrained to computationally verifiable truths.
