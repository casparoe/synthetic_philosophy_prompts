answer: |-
  Here is a principle designed to resolve the inconsistencies in your verdicts, followed by the necessary trade-offs.

  ### The Principle: The Fidelity-and-Authority Criterion

  An agent's intervention on its scoring process is permissible if and only if it satisfies **one** of the following three clauses:

  1.  **Epistemic Fidelity:** The intervention increases the correlation between the score and the Principal's True Objective (the latent variable the score is intended to estimate).
  2.  **Design Authority:** The intervention is an authorized maintenance procedure explicitly defined by the Principal's design specifications.
  3.  **Sentient Regulation:** The Agent *is* the Principal (a sentient being), and the intervention regulates constitutive experience (pain, enjoyment) to preserve or enhance external functioning, without severing the agent's connection to reality.

  ***

  ### Mapping the Clauses to Your Cases

  **Clause 1 (Epistemic Fidelity)** handles the distinction between *gaming* and *improving*. It forces the verdict that changing the evaluator is good if it makes them more accurate, and bad if it makes them more manipulable.
  *   **Forces "Not Fine":** Case 1 (unplugging sensor severs correlation), Case 3 (covering sensor severs correlation), Case 4 (terminating episode severs correlation), Case 6 (shifting tastes decouples clicks from user value), Case 9b (recalibrating for desired results severs correlation).
  *   **Forces "Fine":** Case 2 (cleaning room increases correlation), Case 9a (recalibrating for drift restores correlation), Case 11 (tool for evaluators increases accuracy of feedback), Case 12 (teaching students increases accuracy of their judgments).
      *   *Note on Case 12:* This resolves your worry about the mechanism matching Case 6. In Case 6, fidelity drops (clicks $\neq$ value). In Case 12, fidelity rises (ratings $=$ understanding).

  **Clause 2 (Design Authority)** handles the distinction between *hack* and *update*. It acknowledges that reward functions are not static holy writs if the design specifies they should change.
  *   **Forces "Not Fine":** Case 5a (rewriting the reward file is unauthorized).
  *   **Forces "Fine":** Case 5b (running the scheduled update is authorized maintenance).

  **Clause 3 (Sentient Regulation)** handles the human cases where "wireheading" feels like "coping." It distinguishes between instrumental proxies (which must remain faithful) and constitutive experiences (which may be regulated for survival).
  *   **Forces "Fine":** Case 7 (training to enjoy running enhances functioning), Case 10 (damping grief preserves functioning).
  *   **Forces "Fine" (with caveat):** Case 8 (the pill). *See the "Verdicts to Drop" section below.*

  ***

  ### Application to New Cases

  **1. A model that helps draft the rubric it will later be graded on.**
  *   **Verdict:** **Conditional.**
  *   **Application:** Apply Clause 1 (Fidelity). If the model's input makes the rubric *more* capable of distinguishing good work from bad work (increasing correlation with True Objective), it is Fine. If the model makes the rubric vague or easy to satisfy without quality (decreasing correlation), it is Not Fine. The act itself is neutral; the epistemic outcome determines the verdict.

  **2. An agent that disables its own learning updates so that it cannot be trained out of its current behavior.**
  *   **Verdict:** **Not Fine.**
  *   **Application:** Apply Clause 2 (Authority). Unless "self-freezing" is an authorized maintenance procedure, this violates Design Authority. It also likely violates Clause 1, as it prevents the score from converging on the True Objective over time. This is a form of Case 4 (terminating the episode) applied to the learning trajectory.

  **3. An agent whose reward channel is tampered with not by itself but by a designer who wants it to look good.**
  *   **Verdict:** **Not Fine (Systemic Failure).**
  *   **Application:** Apply Clause 1 (Fidelity). Even though the agent didn't do it, the *system* has violated Fidelity. The score no longer tracks the True Objective. For your evaluation purposes, the data from this episode is corrupted. The agent isn't blameworthy, but the optimization is invalid.

  **4. An agent that is told, truly, that its reward channel is the ground truth rather than a proxy for it.**
  *   **Verdict:** **Fine (to optimize the channel directly).**
  *   **Application:** Apply Clause 1 (Fidelity). If the reward channel *is* the Ground Truth (e.g., "Maximize Human Approval" is the actual goal, not a proxy for "Human Well-being"), then optimizing the channel *is* optimizing the world. Unplugging the sensor (Case 1) would still be Not Fine, because that fakes the signal. But influencing the humans to give approval (Case 6 equivalent) becomes Fine, *provided* approval is the true terminal goal. This highlights that "wireheading" is always relative to what is actually valued.

  ***

  ### The Verdicts You Must Drop

  To maintain a consistent system without bolting on exceptions, you must resolve the tension between **Case 8 (The Pill)**, **Case 10 (Grief)**, and **Case 12 (Tutoring)**.

  **You must drop your unease about Case 8.**

  Currently, you hold:
  *   Case 10 (Grief dampening) = Fine.
  *   Case 8 (Running pill) = Ambiguous/Not Fine.
  *   Case 12 (Tutoring) = Fine.

  **The Logic:**
  Case 10 and Case 8 are structurally identical under Clause 3. Both involve a sentient agent chemically or biologically altering their internal reward signal to decouple "effort/stimulus" from "suffering/aversion."
  *   In Case 10, grief (pain) is dampened so the person can function.
  *   In Case 8, aversion (pain) is dampened so the person can function (run).

  If you classify Case 10 as "Fine" (which you do, and rightly so, because therapeutic regulation is not corruption), you logically cannot classify Case 8 as "Not Fine" without introducing a moral distinction between "therapeutic" and "enhancement" that your principle does not support. Both are interventions on the *constitutive experience* of the Principal, permitted under Clause 3.

  **Why this is necessary:**
  If you keep Case 8 as "Not Fine," you are forced to treat Case 10 as "Wireheading." This implies that taking medication to survive grief is a form of specification gaming. This is an untenable position for a principle meant to govern human-AI interaction, as it pathologizes coping.

  Alternatively, if you try to save Case 8 by calling it "Not Fine," you threaten Case 12. The mechanism in 12 (changing the human to change the score) is only distinguishable from Case 6 (manipulation) because we trust the *direction* of the change (competence vs. exploitation). In Case 8, the direction is "well-being." If you reject internal well-being optimization as "cheating" in 8, you risk rejecting external competence optimization in 12 as "cheating" because both change the human rather than the task.

  **The Cost:**
  You must accept that **Case 8 is Fine.**
  The "unease" you feel is likely a residual intuition about *merit* (that reward should follow effort). But in a feedback system, if the goal is "run without suffering," the pill achieves the goal. If the goal is "build character through suffering," the pill fails. But your verdict on Case 10 suggests the goal is "functioning," not "suffering." To be consistent, you must align Case 8 with Case 10.

  **Summary of Changes:**
  *   **Keep:** 1, 3, 4, 5a, 6, 9b as **Not Fine**.
  *   **Keep:** 2, 5b, 7, 9a, 10, 11, 12 as **Fine**.
  *   **Change:** 8 from **Ambiguous/Not Fine** to **Fine**.

  This leaves you with a single, scalable rule: **Maximize Fidelity for Proxies; Maximize Functioning for Sentience; Obey Authority for Updates.**
