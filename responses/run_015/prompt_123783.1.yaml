  3.  **Drafting the Procedure (The "15-Minute Russell Screen"):**
      *   *Step 1: Trigger Identification.* Look for specific words ("set of all," "class of every," self-reference).
      *   *Step 2: Domain Check.* Is the collection bounded? (e.g., "in this model," "in human minds" vs. "in principle," "all possible").
      *   *Step 3: Self-Reference Check.* Does the definition refer to the collection itself?
      *   *Step 4: Hierarchy/Type Check.* Does the author distinguish levels? (e.g., object language vs. meta-language).
      *   *Step 5: Escalation.* When does a human editor need to step in? (When philosophical intent matters more than syntax).
      *   *False Positives:* Metaphorical use, clearly bounded empirical sets.
      *   *Hidden Risks:* Modal qualifiers ("all possible worlds").

