  2.  **Deconstruct the Logical Problem (Russell's Paradox):**
      *   *Core Issue:* Unrestricted Comprehension Axiom ($ \{x \mid \phi(x)\} $). If $\phi(x)$ can be *any* property, we get $\{x \mid x \notin x\}$, leading to contradiction.
      *   *Philosophy of Mind Context:* Authors often speak loosely about "all beliefs," "all concepts," "all propositions."
      *   *Safe Alternatives:* ZFC (sets restricted by hierarchy), Proper Classes (too big to be sets), Type Theory (stratification), Domain Restriction (contextual limits).
