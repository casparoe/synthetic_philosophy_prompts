prompt: |-
  Hi! I run a small reading group — mostly engineers, plus one retired philosopher who is very patient with us — and we've been working slowly through the classical AI / philosophy of mind stuff; this week's session was on the frame problem, and we spent most of it just marvelling at how the thing refuses to go away. I want something to read out loud at the end of the next one.

  What I'd like is an in-universe document, about 700 words, from a world in which the frame problem has been officially solved, and solved by paperwork. Specifically: a British-style Generic Risk Assessment and Method Statement — you know the format, numbered boxes, "Task description", "Persons at risk", "Control measures", "Residual risk: Low / Medium / High", "Assessor", "Review date" — issued by some invented body (a Directorate of Relevance Assurance, or whatever you fancy) for a completely trivial task: fetch the stepladder from the cupboard and change the lightbulb in Room 3. The founding rule of this world is that no agent may act until it has certified in writing, in advance, every fact that its action will leave unchanged, cross-referenced against the register of facts it will change.

  The comedy should come out of the structure of the problem itself rather than out of slapstick or exploding gadgets, so please get these right without ever explaining them: that the bulk of what makes an action intelligible is the enormous, unmentioned set of things it does *not* disturb, and that there is no principled place to stop listing them; that a rule about what may be ignored is itself one more thing that can change; that "we closed the world by fiat, we only track what's in the register" just relocates the whole difficulty to whoever maintains the register; and that the categories the form can see are not the categories that matter here. I'd also like you to keep the frame problem distinct, structurally, from its two hangers-on — the endless list of preconditions an action needs before it can even be attempted, and the endless downstream consequences it drags behind it — so that someone who knows the literature can tell which box is doing which, without any of the three ever being named. Keep the voice deadpan: no character ever says this is impossible, the paperwork simply never quite gets finished, and the "Review date" box can do a lot of work if you let it. Include at least one moment where the form's own procedure is precisely what stops it from recording the one thing that actually changed — I was imagining that the rooms got renumbered overnight, so "Room 3" no longer refers to what it did, and any change of location triggers a full re-issue, which requires a valid location — but use a better version if you think of one. Give the Official Solution a pompous named doctrine and add a footnote defending it sniffily against an unnamed critic. Don't put any real philosophers or real papers in the piece; any in-jokes should be structural. And please write the whole thing in British English — I'll be reading it aloud, and I'd rather not stumble over "behavior".
