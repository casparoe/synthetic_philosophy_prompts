answer: |-
  ### Discarded Attempts

  **Candidate 1: The Karaoke Bonus.**
  A boss offers a $500 bonus today if an employee intends to sing karaoke at the company party next week. Singing is embarrassing. The bonus hits immediately. The employee knows they'll call in sick next week.
  *Why I'm tossing it:* It's too trivial. The "intention" here feels like a joke or a mere promise, not a robust planning state. The administrative spillover is weak (maybe picking a song?), making it easy for View (A) to dismiss the whole thing as pretense. It doesn't force the philosophical tension hard enough.

  **Candidate 2: The Legal Notice.**
  A tenant gets a rent freeze now if they sign a "Notice of Intent to Vacate" for next month. They know they'll stay once the freeze is locked.
  *Why I'm tossing it:* This smuggles in contractual obligation. Signing a legal form looks like intention, but it's really just signing a contract. It invites the objection that the agent is merely *committing* in a legal sense, not forming a psychological intention. It muddies the water between social contracts and mental states.

  **Candidate 3: The Medical Trial.**
  A patient gets paid now for intending to take a bitter placebo next week. They know they'll dump it.
  *Why I'm tossing it:* It violates Constraint 1 (ordinary life). It's too close to the original Toxin case (ingesting a substance). I need something mundane—a workplace or domestic setting—so the stakes feel real but not sci-fi.

  ***

  ### The Final Scenario: The Compliance Archive

  Elena is a project manager at a mid-sized firm. Her company offers a discretionary "Efficiency Bonus" that deposits directly into her account the moment she files a "Project Closure Intent" form. To file the form, she must certify her intention to physically shred and archive ten boxes of sensitive, obsolete paper files next Friday. The bonus is substantial—equivalent to a month's rent—and hits her account immediately upon filing. There is no audit; nobody checks whether the boxes are actually shredded. The task is aversive: it requires a full day of dusty, mindless labor in a basement storage room. Elena knows that once the bonus is secured, she will have zero reason to shred the boxes next Friday; she can leave them indefinitely without consequence. She fully expects that when Friday arrives, she will simply go home. Yet, to get the bonus, she files the form. In the intervening week, she engages in **administrative spillover**: she buys heavy-duty shredder bags from the supply store and blocks out her entire calendar for Friday, declining a lunch she wanted to attend. When a colleague asks about her availability, she says, "I can't make lunch; I'm archiving the files on Friday." She says this flatly, without hedging. If pressed further ("Be honest, you're going to skip it, right?"), she replies, "Yeah, I probably won't get around to it. But I am doing it." She does not shred the boxes.

  ***

  ### The Verdicts

  **Verdict of (A) — The Belief-Condition Line:**
  View (A) holds that intention entails a belief (or high credence) that one will perform the action. To intend to $\phi$ is, in part, to believe that one will $\phi$. In Elena's case, she explicitly admits she "probably won't" shred the boxes. She knows she has no reason to do so when the time comes. Therefore, on View (A), Elena cannot genuinely intend to shred the boxes. Her statement "I am doing it" is either a lie, a expression of hope, or a case of self-deception (which Constraint 4 rules out). View (A) verdicts that the scenario describes a psychological impossibility: Elena has the *appearance* of intention (the form, the bags), but she lacks the *state* of intention. She is merely pretending to intend.

  **Verdict of (B) — The Functional-Role Line:**
  View (B) holds that intention is a distinctive planning state defined by its functional role: it settles practical deliberation, coordinates action, and organizes other plans. In Elena's case, the state she enters upon filing the form does exactly this work. It settles the question of what to do next Friday (she blocks the calendar). It coordinates with others (she declines lunch). It triggers instrumental means-end reasoning (she buys the bags). View (B) verdicts that Elena *does* genuinely intend. The fact that she lacks belief in success is irrelevant to the functional definition. The intention is real because it plays the role of an intention, even if it is an intention she knows she will likely abandon later. The disconnect between her planning state and her predictive belief is a feature, not a bug.

  ***

  ### Analysis

  **The Single Feature Doing the Work:**
  The feature carrying the weight here is the **Administrative Spillover** (buying the bags, clearing the calendar). This is what makes the intention "real" for View (B). It provides observable, functional evidence that the agent has settled on a course of action. It moves the case beyond mere verbal assertion into the realm of practical coordination. Without this spillover, Elena is just someone who said she'd do something; with it, she is someone whose life is currently organized around doing it.

  **The Collapse:**
  If you remove the Administrative Spillover—say, Elena files the form but buys no bags and leaves her calendar open—View (B) loses its grip. Without the logistical prep, the "functional role" is empty. There is no planning behavior to point to. The case collapses back into a standard Kavka puzzle where the agent just sits and thinks about the money. View (B) would struggle to claim a genuine intention exists if the agent's behavior remains identical to someone who merely wished to do it. The spillover is the bridge that allows View (B) to claim the intention is robust enough to count.

  **The Attack from the Losing View (View A):**
  A proponent of View (A) would attack the scenario by targeting the **No-Fingers-Crossed Test**. They would argue that Elena's assertion "I am doing it" is infelicitous or Moore-paradoxical when paired with her admission "I probably won't." They would claim that buying the bags isn't evidence of intention, but evidence of *habit* or *pretense*. They would say: "Elena isn't intending to shred; she is intending to *get the bonus*, and the bag-buying is just part of the performance required to get the bonus. She is acting *as if* she intends, but the lack of belief proves the intention state is absent." They would argue I have cheated by conflating *acting like you intend* with *actually intending*. For View (A), you cannot separate the two; if the belief isn't there, the "acting" is just theater.
