          3.  Does the Robot Maria literalize Marx's anxiety about machinery displacing living labor? Does her rampage expose something about capitalist control Marx only argues?
          4.  What does the film add to the debate? (Aesthetic experience, rhythm, architecture, real subsumption).
          5.  Where does the melodramatic resolution risk obscuring the concept of real subsumption?

  2.  **Deconstruct Marx's Framework (Mental Sandbox):**
      *   *Dead Labor vs. Living Labor:* Machinery is past labor (dead) that dominates current workers (living).
      *   *Appendage of the Machine:* Workers don't use tools; tools (machines) use workers.
      *   *Surplus Value:* Technology isn't for ease; it's for speed, discipline, and extending the working day (or intensifying labor).
      *   *Real Subsumption:* Capital reshapes the very nature of work and the worker, not just exploiting them within an existing process.

  3.  **Deconstruct *Metropolis* (Mental Sandbox):**
      *   *Visuals:* Art Deco, expressionist, geometric, rhythmic editing.
      *   *The Machine:* The "Moloch" scene, the shift changes, the workers moving in sync.
      *   *The Robot:* The Maschinemensch, created by Rotwang, used by Fredersen to disrupt the workers.
      *   *The Plot:* Freder (Heart/Head's son) sees the suffering, mediates between Joh Fredersen (Head) and the Workers (Hands).
      *   *The Resolution:* "The Mediator Between the Head and the Hands Must Be the Heart."

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Acknowledge the pairing. State the thesis: The film visualizes the *phenomenology* of Marx's economics, but diverges in its *prescription*.

      *   **The Visual Logic of Dead Labor (Marx's Claim):**
          *   Focus on the opening shift change. Workers aren't individuals; they are a mass.
          *   *Marx connection:* The machine sets the pace. The workers are "appendages."
          *   *The Moloch Scene:* This is crucial. The machine isn't a tool; it's a god that demands sacrifice. This visualizes *alienation*. The machine consumes living labor.
          *   *Surplus Value:* The pressure on the worker (the man who collapses at the machine). It's about intensification, not relief.

      *   **Real Subsumption & Aesthetic Experience:**
          *   What does the film add? Marx writes text; Lang creates *sensory* experience.
          *   *Rhythm:* The editing matches the machine. The viewer feels the oppression.
          *   *Architecture:* The vertical city. Head above, Hands below. This is the spatialization of class.
          *   *Real Subsumption:* The workers' bodies *become* the machine's rhythm. It's not just economic exploitation; it's ontological transformation.

      *   **The Robot Maria (The Uncanny Automation):**
          *   Marx worries about machinery replacing labor. Lang makes this a monster.
          *   The Robot is "Dead Labor" incarnate. It looks human but has no soul (initially).
          *   *The Rampage:* When the Robot Maria incites violence, it shows technology turning against the system that created it. Marx argues capital creates its own gravediggers; Lang shows capital creating a *literal* destructive force through technological hubris.
          *   *Displacement:* The real Maria is imprisoned; the false one leads. This speaks to how technology can mediate (and distort) political agency.

      *   **The Resistance to Marxism (The Resolution):**
          *   This is the critical turn. Marx demands structural change (revolution/abolition of private property).
          *   Lang offers *reconciliation*. The "Heart."
          *   *Humanism vs. Materialism:* Freder's suffering (sympathy) solves the problem, not the workers' seizure of the means of production.
          *   *Obscuring Real Subsumption:* By making it a moral failure of the "Head," the film suggests the *machine* isn't the problem, but the *lack of love* is. This risks depoliticizing the economic structure. The machine remains; only the manager's attitude changes.

      *   **Synthesis/Conclusion:**
          *   Summarize the tension. The film is a diagnostic masterpiece but a therapeutic failure (from a Marxist view).
