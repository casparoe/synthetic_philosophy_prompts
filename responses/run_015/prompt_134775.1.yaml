      *   Core issue: There is no universal "best seat." The acoustic experience varies based on where you sit (near field vs. far field, balcony vs. orchestra, under a balcony vs. open).
      *   Design goal: Optimize for the *average* or ensure *consistency*, but acknowledge variability.

  4.  **Drafting the Restatement (Mapping IUC to Acoustics):**
      *   *Utility* -> *Acoustic Experience/Quality*.
