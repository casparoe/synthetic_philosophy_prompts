  # Diagnostic Handout: Which Account of Play Are You Committed To?

  **The Game**
  Two players alternate. Player 1 moves at nodes 1, 3, 5. Player 2 moves at nodes 2, 4, 6.
  *   **Node 1 (P1):** Take **(4, 1)** or Pass.
  *   **Node 2 (P2):** Take **(2, 8)** or Pass.
  *   **Node 3 (P1):** Take **(16, 4)** or Pass.
  *   **Node 4 (P2):** Take **(8, 32)** or Pass.
  *   **Node 5 (P1):** Take **(64, 16)** or Pass.
  *   **Node 6 (P2):** Take **(32, 128)** (Forced).
  *   *Note:* At every node, taking yields more money for you than passing *if* the other player takes at the very next node.

  **The Diagnostic**
  Answer the following questions honestly. There are no wrong answers, only different commitments.

  1.  **Node 1 Decision:** You are Player 1 at Node 1. Do you **Take** (end game, get 4) or **Pass** (continue)?
  2.  **Reaction to Pass:** Suppose you are Player 1 at Node 3, and you know Player 2 passed at Node 2. Do you **Take** (16) or **Pass**?
  3.  **Expensive Pass:** Suppose you are Player 2 at Node 4. Passing here costs you 24 points immediately if Player 1 takes next (32 vs 8), compared to a smaller relative cost earlier. Does this high cost make you **more likely to Take** than at Node 2?
  4.  **Public Reasoning:** Before play, both players are read a statement: "Both players are rational payoff maximizers, and both know this." Does this statement make you **more likely to Take** at Node 1?
  5.  **Payoff Scale:** All payoffs are multiplied by 20. The structure is unchanged. Does this change your decision at Node 1 from Pass to **Take**?
  6.  **Counterfactual Belief:** If you chose Pass at Node 1 (against standard theory), and Player 2 actually Took at Node 2, would you say: (a) "I was wrong about Player 2's rationality," or (b) "The question 'what would I believe if I had Taken?' has no content"?
  7.  **Unit of Agency:** When reasoning, do you ask "What should **I** do?" or "What should **we** do?"

  **Scoring Path & Positions**
  Trace your answers to find your position.

  *   **If you Take at Node 1 (Q1):**
      *   And you believe passers are making errors: **The Proof-Is-Right View**. (Backward induction is correct; data records error.)
      *   And you think normative and predictive questions are distinct: **The Quietist View**.

  *   **If you Pass at Node 1 (Q1):**
      *   **Check Q7 (Agency):** If you asked "What should *we* do?": **The Collective View**. (The unit of agency is the pair.)
      *   **Check Q5 (Scale):** If multiplying payoffs by 20 made you Take: **The Mis-specification View**. (You care about fairness or relative payoff, not just absolute money.)
      *   **Check Q2 (Reaction):** If you Pass at Node 3 even after Player 2 Passed at Node 2: **The Belief-Dependence View**. (Your beliefs are correlated; their pass signals you should pass.)
      *   **If you Take at Node 3 (Q2):**
          *   **Check Q4 (Public Reasoning):** If the public statement made you Take at Node 1: **The Tremble View**. (You pass only because there is a small probability the other is not a maximizer.)
          *   **If the statement did not change your mind:**
              *   **Check Q6 (Counterfactual):** If you chose (b) "Question has no content": **The Counterfactual Blindness View**. (Rationality constrains policies actually run, not off-path evaluations.)
              *   If you chose (a) "I was wrong": **The Counterfactual View**. (You reject the robustness condition; you believe they are rational, but refuse to say what you'd believe if you deviated.)

  **Impossible Combination Warning**
  If you **Pass at Node 1**, but also believe: (1) you maximize money, (2) the other maximizes money, (3) this is common knowledge, and (4) your beliefs survive your own deviations—you are in an impossible position. You must surrender one of these premises. This instrument shows you which one.

  ***

  # Instructor's Key & Analysis

  ### 1. Data Interpretation (Class Results)
  *   **Median Node 3 (Pass, Pass, Take):** Discriminates **Proof-Is-Right** (Node 1) from all passing views.
  *   **1/8 Take Immediately:** Confirms a minority hold **Proof-Is-Right**.
  *   **7/10 Pass after Other Passes:** Strongly discriminates against **Tremble** and **Counterfactual** views (which predict Take at Node 3 if Node 2 was passed, as rationality is confirmed). Supports **Collective**, **Mis-specification**, or **Belief-Dependence**.
  *   **x20 Payoffs Moves Median Earlier:** Discriminates **Mis-specification** (social preferences diluted by higher stakes) from **Counterfactual/Collective** (structural reasoning insensitive to scale).
  *   **Empirically Indistinguishable:** **Collective View** and **Belief-Dependence View**. Both predict passing after a pass. The data cannot separate "we-agency" from "correlated beliefs."
      *   *Follow-up Question:* "When you pass, are you maximizing a joint utility function, or maximizing your utility based on a signal their pass sends?"

  ### 2. Instrument Limitations
  *   **Indistinguishable Leaves:** **Counterfactual View** and **Counterfactual Blindness View**.
  *   **Reason:** Both reject the robustness condition and yield identical choices in all concrete cases. The difference is metaphysical (refusal to answer vs. claim of nonsense).
  *   **Separation:** No question about *cases* can separate them. Requires a meta-question about the *content* of belief states (as used in Q6).

  ### 3. Student Runs
  *   **Student A:** Takes Node 1. Calls passers errors.
      *   **Leaf:** **The Proof-Is-Right View**.
      *   **Self-Label:** "Rational." (Match).
  *   **Student B:** Passes Node 1. Takes at Node 3. Takes after other passes.
      *   **Leaf:** **The Tremble View**. (Passes hoping for irrationality, updates to Take when rationality confirmed).
      *   **Self-Label:** Likely "Strategic." (Match).
  *   **Student C:** Passes Node 1. Passes at Node 3. Denies counterfactual question has content.
      *   **Leaf:** **The Counterfactual Blindness View**.
      *   **Self-Label:** "Rational Maximizers."
      *   **Mismatch:** Student C claims standard rationality, but the instrument identifies a rejection of standard epistemic conditions (robustness/off-path evaluation).
      *   **Handout Advice for C:** "You claim to maximize payoff, but you reject the logical structure required for backward induction. You are not 'irrational,' but you are committed to a non-standard definition of belief consistency. You cannot claim standard Common Knowledge of Rationality while holding this view."

  ### 4. Logical Space Construction
  The instrument forces students to locate which premise they drop to justify passing:
  1.  **Self-Max:** Dropped by Mis-specification.
  2.  **Other-Max:** Dropped by Tremble.
  3.  **Commonality/Independence:** Dropped by Belief-Dependence.
  4.  **Robustness:** Dropped by Counterfactual/Blindness.
  5.  **Agency:** Dropped by Collective.
  6.  **Normative Force:** Dropped by Quietist.
  7.  **None:** Proof-Is-Right (Impossible if Passing).

  This satisfies the requirement to show the "premises whose conjunction makes the intuitive answer unavailable."
