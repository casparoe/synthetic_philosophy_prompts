      *   **Topic:** Borges's philosophy of time (denial of linear succession, present as a conventional boundary, not ontologically real).
      *   **Format:** Very short story (few paragraphs).
      *   **Audience:** Literate, non-specialist (ideas magazine feature).
      *   **Setting:** Near-future laboratory.
      *   **Plot:** Physicist observes identical quantum-state recursions across intervals presumed to be irreversible.
      *   **Key Constraint:** Take Borges's view seriously (not conventional time travel). The revelation must depend on the collapse of past/present/future distinctions when human expectation is withdrawn.
      *   **Style:** Polished, literary register, conceptual fiction.
      *   **Restrictions:** No citations, bibliographic references, or direct quotations.

  2.  **Deconstruct Borges's Philosophy of Time (relevant to the prompt):**
      *   Borges often argued against the idea of time as a continuous flow (like a river).
      *   In essays like "A New Refutation of Time," he suggests that time is a succession of discrete moments, not necessarily connected causally in the way we perceive.
      *   The "present" is a knife-edge that doesn't truly exist; it's a mental construct.
      *   The prompt emphasizes: "not that history literally repeats, but that the distinction between past, present, and future collapses once human expectation is withdrawn." This is crucial. It's not about looping back; it's about the simultaneity or irrelevance of sequence when observed without the bias of memory/anticipation.
      *   Avoid "Back to the Future" tropes (machines, changing the past, paradoxes). Focus on the *perception* of time being the illusion.

  3.  **Drafting - Paragraph by Paragraph:**

      *   *Paragraph 1: Setting the Scene.* Establish the laboratory, the physicist (let's call her Elara or just "the physicist"), and the experiment. The experiment should measure quantum states over what we think is time.
      *   *Paragraph 2: The Observation.* The data shows something impossible under linear time. Not a loop, but an identity. The state at "minute ten" is not similar to "minute one"; it *is* "minute one," not because it returned, but because the separation is false.
      *   *Paragraph 3: The Revelation/Conclusion.* The physicist realizes the error isn't in the machine, but in the assumption of succession. The removal of "expectation" (the human element that orders time) reveals the static nature of the universe. The ending should feel quiet, philosophical, not action-oriented.

  4.  **Refining the Narrative Arc (incorporating Borges's specific nuance):**
      *   *Challenge:* How to show "human expectation withdrawn"?
      *   *Solution:* The physicist stops trying to predict the next state. She stops looking for cause and effect. She observes the data not as a sequence, but as a collection.
      *   *Key imagery:* Mirrors, labyrinths, dust, stillness. (Borgesian motifs, but subtle).
      *   *Tone:* Meditative, precise, slightly detached.

