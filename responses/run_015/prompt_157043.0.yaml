answer: |-
  # The Registry Category Decision Procedure (RCDP)

  This procedure is designed for execution by a biostatistician using existing registry tables within a two-hour window. It operationalizes philosophical distinctions (HPC, Real Kinds, Looping Effects) into statistical tests. It does not decide policy; it grades the *epistemic warrant* for using a category.

  ### Phase 1: Membership Stability (The Threshold Test)
  **Purpose:** Distinguish measurement error from unstable kind membership.
  **Data Required:** Longitudinal member IDs, category status per assessment window, raw scores underlying thresholds.
  **Test:** Calculate the *Churn Rate* (proportion of members losing/gaining status between consecutive windows) and compare to the *Measurement Error Rate* (test-retest reliability of underlying instruments).
  *   **Pass:** Churn Rate ≤ Measurement Error Rate.
  *   **Fail:** Churn Rate > Measurement Error Rate.
  *   **Ambiguous/Missing:** If reliability data is missing, assume Fail.
  *   **Stop Point:** If **Fail**, the category cannot hold an **Intervention License** (you cannot target a moving target). It may still hold an **Induction License** if the *aggregate* statistics are stable despite individual churn.
  *   **Hand-off:** If Churn is high but the category is required for logistics (e.g., scheduling), hand to Committee for **Convenience** designation.

  ### Phase 2: Clustering (The Joints Test)
  **Purpose:** Determine if the category maps to a cluster in data space or an arbitrary slice of a continuum.
  **Data Required:** Multivariate data for all defining variables.
  **Test:** Perform a Gaussian Mixture Model or visual inspection of pairwise scatterplots for bimodality/gaps between members and non-members.
  *   **Pass:** Evidence of a gap or distinct density cluster separating members from non-members.
  *   **Fail:** Uniform distribution or smooth gradient across the boundary.
  *   **Stop Point:** If **Fail**, the category cannot hold an **Explanation License** (no distinct mechanism implied by structure).
  *   **Hand-off:** If **Fail** but the boundary is legally or administratively mandated, hand to Committee for **Convenience** designation.

  ### Phase 3: Feedback (The Looping Test)
  **Purpose:** Detect if the classification creates the co-occurrence it claims to measure.
  **Data Required:** Site-level protocol data, timeline of category adoption vs. symptom recording.
  **Test:** Compare co-occurrence strength (e.g., phi coefficient) in *pre-adoption* data (or sites with delayed adoption) vs. *post-adoption* data.
  *   **Pass:** Co-occurrence strength is stable or increases equally across adopting and non-adopting sites.
  *   **Fail:** Co-occurrence strengthens significantly only after classification and routing protocols are introduced.
  *   **Stop Point:** If **Fail**, the category cannot hold an **Explanation License** (the "mechanism" is the protocol) or an **Intervention License** (efficacy is confounded with selection).
  *   **Hand-off:** If **Fail** but the protocol is standard of care, hand to Committee to decide if the "kind" is iatrogenic but clinically useful.

  ### Phase 4: Transportability (The Induction Test)
  **Purpose:** Determine if findings generalize across sites and time.
  **Data Required:** Site ID, Year, Outcome variable of interest.
  **Test:** Fit a hierarchical model with random slopes for Site and Year. Check the variance component for the Category × Site and Category × Year interactions.
  *   **Pass:** Interaction variance is negligible (effect size consistent).
  *   **Fail:** High interaction variance (effect depends on where/when).
  *   **Stop Point:** If **Fail**, **Induction License** is denied.
  *   **Horizon Definition:** The window of years and site types where the interaction variance remained low.

  ### Phase 5: Predictive Utility (The Intervention/Explanation Test)
  **Purpose:** Determine if the category predicts differential response or explains variance beyond covariates.
  **Data Required:** Trial arm data, outcome measures, potential confounders.
  **Test:**
      *   *For Intervention:* Test Category × Treatment Arm interaction on primary outcome.
      *   *For Explanation:* Test if Category reduces residual variance in a mechanistic model after controlling for baseline severity.
  *   **Pass (Intervention):** Significant interaction (treatment works differently for this group).
  *   **Pass (Explanation):** Significant reduction in residual variance or mediation of effect.
  *   **Fail:** No interaction; category adds no predictive power over continuous severity scores.
  *   **Stop Point:** If **Fail**, deny respective license.
  *   **Hand-off:** If **Pass** but mechanism is unknown (as in C), hand to Committee to weigh "black box" utility against theoretical clarity.

  ---

  # Application to Registry Categories

  ## Category A: Fluctuating-Course presentation

  **1. Membership Stability:**
  *   **Data:** 20% churn between windows. Test-retest noise of diary is known but lower than 20% (implied by "measured with error" vs "fifth of members fall in or out").
  *   **Result:** **Fail**. Churn exceeds measurement error. Participants drift across the threshold.
  *   **Implication:** **Intervention License Denied.** You cannot calibrate an intervention on a group that changes composition by 20% every two months.

  **2. Clustering:**
  *   **Data:** Threshold on continuous coefficient of variation.
  *   **Result:** **Fail**. Thresholds on continuous variables rarely show bimodality unless the underlying distribution is bimodal (not stated).
  *   **Implication:** **Explanation License Denied.** This is a descriptive statistic of a trajectory, not a structural joint.

  **3. Feedback:**
  *   **Data:** Added for retention coordination.
  *   **Result:** **Pass**. No evidence the label causes the fluctuation.
  *   **Implication:** Neutral.

  **4. Transportability (Induction):**
  *   **Data:** Predicts retention.
  *   **Result:** **Conditional Pass.** Retention is a site-management metric, not a clinical phenotype. Stability depends on site coordination efforts, not biology.
  *   **Grain:** Site coordination level. **Horizon:** 1 year (until retention protocols change).
  *   **Implication:** Weak Induction for logistics only.

  **5. Predictive Utility:**
  *   **Data:** Predicts retention only. No trial arm differential response noted.
  *   **Result:** **Fail** for clinical intervention.
  *   **Implication:** **Intervention License Denied.**

  **Verdict for A:**
  This is a logistical bucket, not a clinical kind. It identifies participants who require more administrative attention. It fails the stability required for clinical generalization.
  **License:** `CONVENIENCE`
  **Permissions:** Use for scheduling, retention resource allocation, stratification for balance in trials (to ensure enough stable patients).
  **Prohibitions:** Do not use for subgroup efficacy claims. Do not generalize clinical findings from this group to others.
  **Hand-off:** Committee must decide if the retention risk justifies the label's continued existence despite its lack of clinical validity.

  ## Category B: Autonomic Cluster presentation

  **1. Membership Stability:**
  *   **Data:** Stable at every site and year.
  *   **Result:** **Pass**.
  *   **Implication:** Membership is robust.

  **2. Clustering:**
  *   **Data:** Five signs co-occur far above chance.
  *   **Result:** **Pass**. Suggests an HPC structure.
  *   **Implication:** Potential for Explanation License.

  **3. Feedback:**
  *   **Data:** Sites route everyone with this label into the same protocol/advice for 8 years.
  *   **Result:** **Fail**. We cannot distinguish natural co-occurrence from iatrogenic co-occurrence. The management advice (e.g., "avoid exertion") may cause the signs (e.g., "delayed recovery") to persist or align.
  *   **Implication:** **Explanation License Denied.** We cannot claim the category names a natural mechanism; it may name a *managed* state. **Intervention License Denied.** We cannot know if the intervention works *because* of the category or if the category exists *because* of the intervention.

  **4. Transportability (Induction):**
  *   **Data:** Stable across sites and years.
  *   **Result:** **Pass**. The phenomenological cluster is real, even if the cause is ambiguous.
  *   **Grain:** Clinical signs (tachycardia, BP, etc.). **Horizon:** 5 years, provided measurement protocols remain identical. Survives measurement change only if new measures map linearly to the five signs.
  *   **Implication:** **Induction License Granted.** We can expect a patient fitting this description in Site X to look like one in Site Y.

  **5. Predictive Utility:**
  *   **Data:** No differential response data (everyone got same protocol).
  *   **Result:** **Fail**.
  *   **Implication:** No evidence for Intervention License.

  **Verdict for B:**
  This is the hardest case. It looks like a Homeostatic Property Cluster, but the "homeostasis" may be enforced by the registry's own routing practices (Hacking's "looping effect"). Senior investigators are invested; telling them this is circular will be unpopular.
  **License:** `INDUCTION`
  **Permissions:** Use to identify patients for observational comparison. Use to generalize descriptive statistics (e.g., "these patients usually have cold extremities").
  **Prohibitions:** Do not claim this is a distinct disease entity (Explanation). Do not claim specific treatments work *because* of this category (Intervention) without a washout or randomized trial.
  **Hand-off:** Committee must decide whether to maintain the routing protocol. To validate the kind, we must vary the treatment for this group and see if the cluster persists.

  ## Category C: Post-Infectious Late-Onset presentation

  **1. Membership Stability:**
  *   **Data:** Defined by historical facts (infection, age).
  *   **Result:** **Pass**. Historical facts do not drift.
  *   **Implication:** High stability.

  **2. Clustering:**
  *   **Data:** Heterogeneous in nearly every variable.
  *   **Result:** **Fail**. No current phenotypic "joint".
  *   **Implication:** **Explanation License Denied** (regarding current mechanism). It does not explain *why* symptoms are similar now, only *how* they started.

  **3. Feedback:**
  *   **Data:** Administrative origin.
  *   **Result:** **Pass**. Unlikely to cause the infection history.
  *   **Implication:** Neutral.

  **4. Transportability (Induction):**
  *   **Data:** Strongest predictor of differential response, consistent across sites in recent trial.
  *   **Result:** **Pass**.
  *   **Grain:** Trial arm response. **Horizon:** Indefinite for historical fact, but limited to current treatment classes. Survives measurement change (as it relies on history, not current scores).
  *   **Implication:** **Induction License Granted.**

  **5. Predictive Utility (Intervention):**
  *   **Data:** Strongest single predictor of differential response between arms.
  *   **Result:** **Pass**.
  *   **Implication:** **Intervention License Granted.** Even if we don't know the mechanism, the category "carves" the population in a way that predicts treatment success. This is a "Pragmatic Kind."

  **Verdict for C:**
  This contradicts the senior investigators' desire to retire it. It is an "administrative artifact" that works better than the "mechanistically motivated" categories. It is a Historical Kind with high predictive validity.
  **License:** `INDUCTION-INTERVENTION`
  **Permissions:** Use for subgroup analysis. Use for targeting treatment arms. Generalize trial results to new patients meeting history criteria.
  **Prohibitions:** Do not claim the category explains the *current* symptom mechanism (Explanation License withheld). Do not assume it applies to infections outside the documented window.
  **Hand-off:** Committee must decide if they are willing to keep an "artifact" that works over a "theoretical" category that doesn't. This is a value judgment on the registry's purpose (truth vs. utility).

