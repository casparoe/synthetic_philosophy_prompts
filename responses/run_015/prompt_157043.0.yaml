  # Limitations and Monitoring

  **Systematic Failures:**
  This procedure will systematically fail to catch **Normative Harms**. A category can be statistically robust (Induction) and clinically useful (Intervention) while still being stigmatizing or ethically problematic (e.g., reinforcing a biased diagnostic pathway). The procedure treats data as neutral; it is not.
  It will also miss **Slow Conceptual Drift**. If the definition of "infection" or "tachycardia" shifts subtly across 15 years due to equipment changes not captured in metadata, the Stability Test may Pass falsely.

  **Monitoring Plan (Next 2 Years):**
  1.  **Drift Check:** Re-run Phase 1 (Stability) annually. If Category A's churn drops, re-evaluate for Induction.
  2.  **Looping Audit:** For Category B, identify any sites *not* following the routing protocol. If their co-occurrence rates drop, the Looping Test result is confirmed, and the category is iatrogenic.
  3.  **Utility Decay:** For Category C, monitor the Treatment × Category interaction in new trials. If the predictive power vanishes as treatments evolve, the Intervention License expires.

  **Final Hand-off:**
  The procedure identifies that Category C is the most clinically valuable despite being theoretically "impure," while Category B is theoretically "pure" but clinically confounded. The Committee must decide whether the registry prioritizes *etiological truth* (favoring B, retiring C) or *patient outcome* (favoring C, investigating B). The data cannot make this choice.

  \answer{A=CONVENIENCE; B=INDUCTION; C=INDUCTION-INTERVENTION}
