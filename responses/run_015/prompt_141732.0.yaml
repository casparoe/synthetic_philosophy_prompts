answer: |-
  ### 1. Coherence Check: Measure vs. Theory

  **The separation is not coherent.**
  A measure with a *principled zero* is necessarily an operationalized theory. To define "zero" non-behaviourally, you must specify what physical property constitutes the *substrate* of experience (e.g., integration, broadcasting, metacognition). To define the *units*, you must specify how that property scales. You cannot measure "mass" without a theory of matter; you cannot measure "conscious capacity" without a theory of the conscious substrate.

  **Recommendation:** Do not ask for a measure *instead* of a theory. Ask for a **minimal mechanistic commitment**. You are not asking for a full metaphysical account (why experience exists), but you must accept a structural account (what physical organisation supports it). If a candidate measure cannot state *what physical feature* goes to zero when consciousness vanishes, it is merely a behavioural proxy and fails your spec.

  ---

  ### 2. Revised Specification (Sorted & Pruned)

  I have reorganised your list into **Non-Negotiable (NN)** for Job 1 (Clinical), **Camp Preferences (CP)** (theoretical biases), and **Sacrifices (S)** (Job 2 requirements dropped to save Job 1). I have added two missing requirements.

  #### A. Non-Negotiable (Job 1 Optimised)
  *These must be satisfied for the guidance to be usable at the bedside.*

  1.  **Clinical Estimability (NN):** Must be derivable from non-invasive data (EEG/fMRI/pTMS) available in a hospital, without requiring knowledge of the patient's specific synaptic wiring.
      *   *Case:* You cannot wait for a connectome to decide on care.
  2.  **Divergence from Behaviour (NN):** Must yield non-zero values in confirmed cases of awareness without movement (locked-in, dissociative anaesthesia, covert command following).
      *   *Case:* Behavioural unresponsiveness is the clinical problem; a measure that tracks behaviour solves nothing.
  3.  **Empirical Zero-Point Validation (NN) [Replaces 'Principled Zero']:** While a *theoretical* zero is desired, the *operational* zero must be validated against states presumed to lack experience (deep anaesthesia, dreamless sleep, cortical death) rather than fitted to behavioural responsiveness.
      *   *Case:* A "principled" zero is metaphysical; an "empirically validated" zero is actionable. This modifies your Req 3 to be actually usable.
  4.  **Structure over Size (NN):** Must not scale linearly with neuron count or metabolic rate alone. Must explain the cerebellum problem (high neuron count, low conscious contribution).
      *   *Case:* Empirical lesion data dictates this; ignoring it yields false positives.
  5.  **Temporal Stability (NN) [Added]:** The measure must not fluctuate wildly on timescales shorter than state changes (e.g., milliseconds).
      *   *Case:* Clinical decisions require stability; noise cannot look like state flicker.
  6.  **Version-Robustness (NN):** Small revisions to the algorithm should not flip the clinical verdict (binary classification stability).
      *   *Case:* Guidance cannot change every time a paper is published.

  #### B. Camp Preferences (Theoretical Commitments)
  *These reveal which theory the measure is smuggling in. You must choose which camp to align with.*

  7.  **Description-Invariance (CP - Integrationist):** The value should not depend on the spatial/temporal grain of measurement.
      *   *Case:* Required for a true physical quantity (IIT), but practically impossible for bedside EEG. *Treat as aspirational.*
  8.  **Functional Preservation (CP - Functionalist):** The quantity should not decline if input-output function is preserved despite internal rewiring (fading qualia).
      *   *Case:* If you choose "Yes," you exclude Integrationist measures. If "No," you exclude Functionalist measures. *For Job 1, prioritize internal markers over external function.*
  9.  **Composition/Exclusion (CP - Integrationist):** Must specify whether nested subsystems count separately (Req 5).
      *   *Case:* Crucial for split-brain, but computationally intractable. *Relax for clinical use.*
  10. **Non-Inflation (CP - Anti-Panpsychist):** Must not assign high values to simple grids or thermostats.
      *   *Case:* Prevents absurdity, but depends on your tolerance for panpsychism.

  #### C. Sacrifices (Job 2 Dropped for Job 1)
  *To satisfy Job 1, these must be relaxed or abandoned.*

  11. **Cross-Architecture Comparability (S):** Numbers for fish, pigs, and humans need not be on the exact same linear scale.
      *   *Case:* Human EEG measures cannot map directly to fish neuroanatomy. Use Job 1 measure for humans; develop a separate, theory-mapped proxy for animals.
  12. **Literal Computability (S):** Theoretical definitions can be intractable if a licensed, validated proxy exists.
      *   *Case:* Exact integration is NP-hard; bedside proxies are necessary.

  ---

  ### 3. Impossibility Results (Unsatisfiable Subsets)

  You asked which subset is jointly unsatisfiable. There is a **Trilemma** here. You can satisfy any two, but not all three:

  1.  **Principled Zero (Theoretical)**
  2.  **Description-Invariance (Scale-independent)**
  3.  **Clinical Estimability (Bedside feasible)**

  *   **IIT** satisfies (1) and (2) but fails (3) (too hard to compute, requires connectome).
  *   **PCI (Perturbational Complexity Index)** satisfies (1) [weakly] and (3) but fails (2) (depends on EEG electrode grain and stimulation site).
  *   **Behavioural Proxies** satisfy (2) and (3) but fail (1) (zero is defined by lack of movement).

  **The Sacrifice:** Since you prioritised Job 1, you must sacrifice **Description-Invariance (2)**. You must accept a measure that is grain-dependent (e.g., EEG channel level) but validated to track the underlying theoretical quantity. You cannot have a perfect physical quantity *and* a bedside tool.

  ---

  ### 4. Most Exclusionary Requirement

  **Requirement 3 (Principled/Validated Zero).**

  This is the single hardest filter. Most existing "measures" (bispectral index, responsiveness scores) are calibrated *against* behaviour. Demanding a zero-point derived from *structural capacity* rather than *output* excludes almost all current commercial monitors and purely behavioural scales. It forces the committee to adopt a measure that claims to detect *capacity for experience* even when silent, which requires a theoretical stance on the substrate (e.g., integration, complexity). It excludes "black box" machine learning classifiers that predict wakefulness but offer no account of why the value is zero in deep sleep.

  ---

  ### 5. Scorecard Against Final Spec

  | Measure / Account | Performance against Spec |
  | :--- | :--- |
  | **Integrated Information (IIT/Φ)** | **Fails Clinical Estimability.** Theoretically robust on Zero and Structure, but computationally intractable for human brains; requires connectome. |
  | **Global Workspace (GWT)** | **Fails Principled Zero.** Typically treats consciousness as binary (broadcasting on/off); struggles to quantify "amount" or residual experience in partial states. |
  | **Higher-Order / Attention Schema** | **Fails Clinical Estimability.** Relies on metacognitive report or specific prefrontal signatures that are hard to distinguish from noise in unresponsive patients. |
  | **PCI / Complexity Indices** | **Passes Clinical/Divergence.** Best fit for Job 1. **Fails Description-Invariance & Cross-Architecture.** Zero is empirical (thresholded), not strictly principled; does not map to fish/pigs easily. |

  **Committee Guidance:** For Job 1, adopt a **Complexity-based proxy (like PCI)** but acknowledge the zero is empirically validated, not metaphysically principled. For Job 2, do not use the Job 1 number; use a **structural mapping** (e.g., homologous circuitry) to estimate capacity, accepting that the units are not directly comparable.
