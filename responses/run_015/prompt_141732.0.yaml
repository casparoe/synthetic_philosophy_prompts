      *   *11. Non-inflation:* Panpsychism worry. CP (Anti-panpsychist).
      *   *12. Computability:* Practical necessity. NN for implementation, but theoretical measures often fail this.
      *   *13. Version-robustness:* Practical necessity for guidance. NN.

      *   *Missing Requirements:*
          *   *Temporal Stability:* The measure shouldn't fluctuate wildly on millisecond scales if the state hasn't changed.
          *   *Intervention Sensitivity:* Does the measure change when anesthesia is administered? (Validation).
          *   *Ethical Asymmetry:* False negatives (saying no consciousness when there is) are worse than false positives for Job 1. False positives (protecting a fly) are costly for Job 2.

