      *   *Conflict 3:* **Composition (5) + Computability (12).** Exact composition analysis is NP-hard.
      *   *Major Conflict:* **Job 1 (Human Clinical) vs. Job 2 (Cross-Taxa).** A measure optimized for human EEG (PCI) fails for fish. A measure optimized for neural architecture (IIT) is uncomputable for humans.
      *   *Sacrifice:* As instructed, optimize for Job 1. Sacrifice Cross-architecture comparability (10) and strict Description-invariance (4).

  5.  **Task 4: Most Exclusionary Requirement:**
