      *   *Alternative:* **Description-invariance (4).** This kills almost all physical measures because physical measures depend on scale.
      *   *Decision:* **Description-invariance (4)** is the biggest theoretical killer. But **Clinical Estimability (1)** is the biggest practical killer. Let's look at the prompt: "which single requirement does the most work in excluding candidates?"
      *   *Selection:* **Principled Zero (3).** Why? Because without it, you just have a correlation score. With it, you need a theory of *absence*. This excludes purely empirical indices that lack a theoretical floor.

  6.  **Task 5: Scorecard:**
      *   *IIT:* Fails Computability, Clinical Estimability. Passes Principled Zero, Structure over Size.
      *   *GWT:* Fails Principled Zero (often binary), Structure over Size. Passes Clinical Estimability (proxies).
      *   *HOT/AST:* Fails Clinical Estimability (requires report/metacognition).
      *   *PCI (Perturbational Complexity Index):* Passes Clinical Estimability, Divergence. Fails Principled Zero (threshold is empirical), Cross-architecture.

  7.  **Drafting the Response:**
      *   *Tone:* Professional, analytical, direct.
