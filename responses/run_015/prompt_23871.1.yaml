answer: |-
  ### Part 1: Mapping the Logical Space

  Before constructing the quiz, we must map the "blame" for the paradox. The Surprise Examination Paradox arises from the tension between three claims:
  1.  **The Announcement:** The exam will happen, and you won't know the day beforehand.
  2.  **The Reasoning:** The students deduce the exam cannot happen (via backward induction).
  3.  **The Outcome:** The exam happens, and the students are surprised.

  To resolve the paradox, a theory must reject or modify at least one of these. The literature generally falls into five camps based on *what* they reject:

  1.  **Two-Agent/Pragmatic:** Rejects the idea that this is a static logic puzzle. The Teacher is an agent who can act to falsify the students' deduction. (Focus: Interaction).
  2.  **Williamson (Epistemicism):** Rejects the idea that knowledge is transparent (the KK Principle). You can know $P$ without knowing that you know $P$. (Focus: Precision of Knowledge).
  3.  **Kaplan & Montague (Formal Logic):** Rejects the consistency of the Announcement. It is a self-referential contradiction (like the Liar Paradox). (Focus: Logical Consistency).
  4.  **Quine (Epistemic Confusion):** Rejects the students' move from "The Announcement is True" to "The Students Know the Announcement." (Focus: Truth vs. Knowability).
  5.  **Sorensen (Blindspots):** Accepts the Announcement is True, but argues it constitutes a "blindspot"—a truth that is logically unknowable to the subject. (Focus: Unknowable Truths).

  **Unoccupied Combinations:**
  *   *The Announcement is False, but the Exam Still Surprises:* This is logically incoherent in the context of the puzzle. If the announcement ("You won't know") is false, then the students *did* know (or could have known). If they knew, they weren't surprised. This position collapses the definition of the scenario.
  *   *The Reasoning is Valid, and the Conclusion is True (No Exam):* While some early readers might think this, it is not a "solution" in the literature because it contradicts the empirical premise of the puzzle (that the exam *does* occur). It dissolves the paradox by denying the reality of the exam, which most philosophers treat as a fixed datum.

  **Indistinguishable Leaves:**
  *   **Quine vs. Sorensen:** These are the hardest to separate for a lay audience. Quine argues the students made a logical error (confusing truth with knowledge); Sorensen argues the proposition itself creates an epistemic block. In practice, both result in "The students cannot know the announcement." Distinguishing them requires asking whether the fault lies in the *reasoning step* (Quine) or the *nature of the proposition* (Sorensen).

  ***

  ### Part 2: The Interactive Quiz (Decision Tree)

  **Introduction for the Reader:**
  *You've read the argument. You know the students conclude the exam is impossible, yet you know the teacher can still give it on Wednesday and surprise them. You feel the students' logic is slippery, but you're not sure where it drops the ball. Answer these five questions about how you see the situation. There are no right answers, only different philosophical diagnoses.*

  #### Question 1: The Teacher's Move
  Imagine it is Thursday night. The students have logically ruled out Friday. They are certain the exam cannot be on Friday. On Friday morning, the teacher hands out the exam. The students are surprised.
  **What just happened?**
  *   **A.** The teacher broke the students' logical chain by acting. The logic was valid for a static puzzle, but the teacher is a player in a game, not a variable in an equation. *(Go to Leaf 1)*
  *   **B.** The students' logic was flawed from the start. The teacher didn't "break" anything; the students made a mistake in their reasoning about knowledge. *(Go to Question 2)*

  #### Question 2: The Precision of Knowledge
  Focus on the students' mistake. They assumed that if they knew the exam was on Friday, they would *know that they knew it*. They assumed knowledge is perfectly clear to the knower.
  **Do you think "knowing" is that precise?**
  *   **A.** No. Knowledge has a "margin for error." You can know something without being certain that you know it. The students' chain fails because knowledge isn't transparent. *(Go to Leaf 2)*
  *   **B.** Yes, or at least that's not the main problem. Even if knowledge were perfect, the trouble lies in the statement the teacher made, not the fuzziness of the students' minds. *(Go to Question 3)*

  #### Question 3: The Announcement's Health
  Look closely at the Teacher's announcement: *"There will be an exam, and you will not know the day."*
  **Is this statement logically healthy?**
  *   **A.** No. It talks about its own knowability. It's like saying "This sentence is false." It generates a contradiction if you try to treat it as a known fact. *(Go to Leaf 3)*
  *   **B.** It's a bit weird, but not a contradiction. It can be true. The problem is how the students handled that truth. *(Go to Question 4)*

  #### Question 4: Truth vs. Knowledge
  The students reasoned: "The announcement is true, therefore we can use it to deduce the days."
  **Where did they go wrong?**
  *   **A.** They treated a "true statement" as a "known fact." Just because the teacher speaks the truth doesn't mean the students can *know* it's true before the exam. They smuggled "knowledge" into a premise that was only "truth." *(Go to Leaf 4)*
  *   **B.** They were right to treat it as true, but some truths are fundamentally impossible to know. The statement creates a "blindspot" in their understanding. *(Go to Question 5)*

  #### Question 5: The Nature of the Block
  If the statement is true, why can't they know it?
  **Is the blockage accidental or essential?**
  *   **A.** (If you chose 4A earlier, you are done).
  *   **B.** It is essential. The proposition is a "blindspot." It is true, but the very structure of the situation makes it logically impossible for the students to know it, even if they reason perfectly. *(Go to Leaf 5)*

  *(Note: In the web implementation, Question 5 would only appear if they select 4B. If they select 4A, they go directly to Leaf 4.)*

  ***

  ### Part 3: The Leaves (Diagnoses)

  **Leaf 1: The Game-Theoretic / Two-Agent Solution**
  *   **Your Diagnosis:** You believe the paradox dissolves when we acknowledge the **Teacher's Agency**.
  *   **The Literature:** This aligns with **Pragmatic and Game-Theoretic approaches** (e.g., Sober, Lewis).
  *   **The Idea:** The students treat the announcement as a static logical premise. But the Teacher is an active participant. If the students deduce "No Friday," the Teacher can choose Friday precisely *because* they deduced that. The logic isn't wrong; it's just playing the wrong game. The surprise is secured by the Teacher's freedom to act, not by a flaw in the students' deduction.

  **Leaf 2: The Margin-for-Error Account (Williamson)**
  *   **Your Diagnosis:** You believe the paradox dissolves because **Knowledge is not Transparent**.
  *   **The Literature:** This is **Timothy Williamson's** position (*Knowledge and Its Limits*).
  *   **The Idea:** The students' induction relies on the "KK Principle" (If I know $P$, I know that I know $P$). Williamson argues knowledge requires a "margin for error." You can know the exam is on Friday without knowing *that* you know it. Because knowledge isn't perfectly self-aware, the backward induction chain snaps. The exam is a surprise because knowledge is fuzzy at the edges.

  **Leaf 3: The Self-Referential Verdict (Kaplan & Montague)**
  *   **Your Diagnosis:** You believe the paradox dissolves because **The Announcement is a Contradiction**.
  *   **The Literature:** This is **Kaplan and Montague's** formal logic verdict.
  *   **The Idea:** The announcement is a "Liar-like" sentence. It refers to its own knowability. If you try to formalize it in standard logic, it generates a contradiction (like "This sentence is false"). Therefore, the announcement cannot be consistently known or asserted. The paradox isn't about surprise; it's about a sentence that crashes the system.

  **Leaf 4: The Epistemic Confusion (Quine)**
  *   **Your Diagnosis:** You believe the paradox dissolves because **Truth is not Knowledge**.
  *   **The Literature:** This is **W.V.O. Quine's** classic diagnosis.
  *   **The Idea:** The students' reasoning is valid, but one premise is illicit. They assume they *know* the announcement is true. Quine argues they can only assume the announcement *is* true. You cannot use a statement as a premise for deduction unless you *know* it, and here, knowing it is exactly what is ruled out. They confused "The teacher told the truth" with "The students know the truth."

  **Leaf 5: The Blindspot Solution (Sorensen)**
  *   **Your Diagnosis:** You believe the paradox dissolves because **Some Truths are Unknowable**.
  *   **The Literature:** This is **Roy Sorensen's** "Blindspot" theory.
  *   **The Idea:** Unlike Quine (who says the students made a reasoning error), Sorensen says the proposition itself is a "blindspot." It is a truth that *cannot* be known by the students, not because they are sloppy, but because the content of the truth precludes knowing it. The announcement is true, but it creates a logical blindspot for the class.

  ***

  ### Part 4: Meta-Analysis & Confidence

  **Confidence in the Tree:**
  I am moderately confident in this tree as a pedagogical map, but I must flag a significant structural weakness. The tree successfully isolates the major camps (Two-Agent, Williamson, Kaplan, Quine/Sorensen), but it relies on readers having stable intuitions about concepts (like "knowledge transparency") that they may not have examined before.

  **The Weakest Split:**
  The branch I am least sure about is **Question 4 (Quine vs. Sorensen)**.
  *   **Why:** Distinguishing Quine's "Epistemic Confusion" from Sorensen's "Blindspot" is notoriously difficult, even for graduate students. Quine argues the students *illicitly assumed* knowledge; Sorensen argues the proposition *cannot be known*. To a layperson, the result feels identical: "The students can't know the announcement."
  *   **The Risk:** A sharp defender of Quine might argue that a "blindspot" is just a fancy name for "something you shouldn't assume you know," and answer 4A. Conversely, a Sorensen supporter might feel Quine's explanation is too charitable to the students and insist on 4B. The question forces a distinction between a *reasoning error* and a *propositional property* that may be too subtle for a non-specialist to feel intuitively. In the literature, these two positions are often treated as close cousins rather than distant rivals, so forcing a hard split here may feel artificial to some readers.
