      *   *The Arbiter's Quirk:* Verdict 5 says she prioritizes worst suffering *even when* aggregation might suggest otherwise, provided no epistemic discounts. The prompt says "escape hatches closed." This is the strongest clue. She treats severe suffering as a different *category*, not just a higher number.
      *   *Option Z:* 100M humans * 12 months * 1 = 1,200M happiness units.
