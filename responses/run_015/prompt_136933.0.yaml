      *   **Core Question:** Does pain asymbolia prove that suffering (affective component) is separable from nociception (sensory component), implying that "pain" isn't intrinsically bad, but rather the *suffering* tag is? Can we pharmacologically induce "artificial asymbolia" to solve pain ethics? Are philosophers wrong to claim pain is intrinsically bad?
