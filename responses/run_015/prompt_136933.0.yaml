      *   *Pharmacology:* Opioids and cingulotomies *do* affect the affective component more than the sensory, but rarely eliminate it completely without side effects.
      *   *Cephalopod Comparison:* Interesting point. Cephalopods have complex nervous systems but distributed. Do they suffer? Debated. But the analogy holds that warning systems exist without mammalian-style limbic systems.

