  2. **Fixed-depth maximizing:** 70 – This heuristic avoids the aspiration trap entirely by ignoring thresholds, though it risks inefficient expenditure by committing to a search depth blind to accumulated prices.
  3. **Entrained satisficing:** 50 – While cognitively consistent with the involuntary drift, this strategy prematurely converges on the population mean rather than exploiting the upper tail of the distribution.
  4. **Fixed-aspiration satisficing:** 20 – Attempting to maintain an exogenous threshold in a system where aspiration is endogenously pulled creates a catastrophic mismatch between decision rules and psychological reality.

  **Sensitivity Notes:**

  The ordering is sensitive to pool richness; in pools with high variance (rich tails), fixed-depth maximizing loses significant value relative to adaptive thresholding because a static $k$ fails to capture the increased marginal return of extended search. The verdict on entrained satisficing would flip if entrainment pulled toward the *best* value seen; this would cause the threshold to rise indefinitely, inflating search costs until net value falls below that of the fixed-depth heuristic.
