    "principle_if_recommended": "the principle the board adopts by deciding this way",
    "principle_if_opposite": "the principle the board adopts if it decides the other way",
    "discriminating_further_case": {
      "case_description": "one-sentence hypothetical case that would separate the rules",
      "how_it_separates_rules": "what each rule predicts and why it tells them apart"
    }
  }

  The candidate_rules array must contain at least two rules that fit all six earlier verdicts but diverge on the new case; the JSON object should be valid and contain no commentary outside the specified fields.
