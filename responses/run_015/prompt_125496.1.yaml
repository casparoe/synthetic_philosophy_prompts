    "candidate_rules": [
      {
        "rule_name": "short name",
        "rule_statement": "one sentence stating the rule that fits the earlier verdicts",
        "prediction_for_new_case": "Approve or Reject, with one-sentence reason",
        "support_from_precedents": "which earlier cases it explains and how",
