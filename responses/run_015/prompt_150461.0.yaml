prompt: |-
  I'm drafting a charcter for my novel — a Madhyamaka scholar who isn't just a mouthpiece — and I need his committments to hang together with real friction, not Buddhist 101. Here's where he lands:

  1. The catuskoti is serious logic, not rhetorical decoration.
  2. Sunyata and pratityasamutpada are literally identical — not two sides, one thing.
  3. Conventional truth is genuinely true, not just a fiction we tolerate.
  4. The root texts only do negative work; there's no positive metaphysics being built.
  5. Emptiness is empty too, so there's no ultimate ground or essence explaining things.
  6. This lets us steer between eternalism and nihilism without landing in a reified middle "view."

  Do these actually cohere? I think (2) fights with (4) — asserting identity sounds like a big positive claim. And (3) with (5): if conventional reality is genuinely true but emptiness gives no ground, what's supporting that "genuine" part? Meanwhile, applying the fourfold negation to emptiness itself, or saying we're in the "neither" camp, feels like it should eat the doctrine alive, but I think that's a fake problem.

  Audit this. Rank the real tensions by severity — don't list them as equal. For each, say what's pulling against what, how bad it is, and the cheapest revision (don't tell me which I'd pick, just the cost). Flag the apparent tension that dissolves on inspection, with why. Then tell me the single revision that cleans up the most mess, even if it's expensive.

  Return as JSON: { "profile": [ "1...", "2..." ], "tensions_ranked": [ { "pair": "...", "severity": "...", "explanation": "...", "cheapest_fix": "..." } ], "apparent_tension": { "pair": "...", "looks_bad_because": "...", "resolution": "..." }, "least_costly_single_revision": "...", "verdict": "..." }. No bibliographies — I'll fill those in later if I need them.
