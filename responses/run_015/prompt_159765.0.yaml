  Consider the canonical case of pronominal ambiguity. In the utterance "the sofa won't go through the doorway because it is too wide," the referent of "it" is determined by physical reality, not syntax. A compliant speaker must revise this to "the sofa won't go through the doorway because the sofa is too wide" or "because the doorway is too wide." However, this introduces a secondary ambiguity: which sofa? Which doorway? Compliance thus requires unique identifiers for all nouns, such as "Sofa-Unit-442" and "Doorway-Struct-9." Yet, to understand "Unit-442," the recipient must access a registry. That registry must be transmitted. The transmission requires language. That language will contain nouns. Those nouns will require identifiers. We anticipate this regress will be managed via a separate protocol, details of which are attached, though the attachment mechanism itself relies on a file system known to both parties.

