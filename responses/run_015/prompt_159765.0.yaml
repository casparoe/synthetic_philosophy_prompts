      To the Technical Committee on Semantic Interoperability,
      International Standards Organisation for Linguistic Exchange

      Subject: Proposal for ISO-LEX 8842: The Mandatory Elaboration Standard

      It is the position of the Bureau of Pre-Transmission Clarity that the persistent failure of neural machine translation systems stems not from architectural deficits, but from the indulgence of speakers who rely upon shared situational context to resolve semantic ambiguity. Accordingly, we propose the Mandatory Elaboration Standard, which stipulates that no string of characters may be submitted for processing until every feature dependent on extralinguistic knowledge has been explicitly resolved within the string itself.

