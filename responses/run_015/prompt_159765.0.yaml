      Further complications arise regarding lexical gaps. Where the target language distinguishes concepts the source language conflates, the speaker must preemptively select the appropriate distinction. For instance, if translating into a language that differentiates between knowing a fact and knowing a person, one may not simply say "I know him." One must first determine the nature of the acquaintance and state "I possess factual data regarding him" or "I am socially acquainted with him." This determination often requires consulting the person in question. Their response will constitute a new utterance. That utterance will also require elaboration before it can be translated back to confirm the status.

      Finally, deictic expressions must be abolished. Terms such as "here," "now," or "she" rely on the coordinates of the utterance. Under the Standard, "here" must be replaced by GPS coordinates to six decimal places. "Tomorrow" must become the specific ISO 8601 date. "She" requires the full legal name and national insurance number of the female referent. To obtain these details, one must usually ask someone present. That person is defined by their presence "here." Thus, to eliminate "here," one must first locate the person who defines "here," which cannot be done without using "here."

      It is evident that the current framework is insufficient for the task. We trust that the Committee recognises the urgency of rectifying this before the next cycle. The proposed timeline assumes the regulations will be ratified soon. We await your feedback on this proposal with confidence that you understand what "this proposal" refers to without further elaboration, given our shared professional context.

      Yours faithfully,

      The Undersigned
      Department of Literal Compliance

