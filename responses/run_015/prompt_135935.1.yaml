  2.  **Deconstruct the Philosophical Frameworks:**
      *   **Counterfactual (Lewis):** $C$ causes $E$ iff if $C$ had not occurred, $E$ would not have occurred (or would be less likely/different). Focus on dependence.
      *   **Interventionist (Woodward/Pearl):** $C$ causes $E$ iff there is a possible intervention on $C$ that changes $E$, holding other relevant variables fixed (invariant generalizations). Focus on manipulability and mechanisms.
      *   **Integration:** Use counterfactuals to test dependence (would it have happened anyway?) and interventionism to test mechanism/manipulability (did our action actually drive the change via a known pathway?).

