answer: |-
  # Wetland Causality Decision Protocol (WCDP)
  **Version 1.0 | For Monday Check-Ins**

  This procedure combines **Counterfactual Dependence** (would the effect happen without us?) and **Interventionist Manipulability** (did our action control the specific mechanism?). Use this flowchart for every claim of credit or blame.

  ---

  ## PART 1: THE PROCEDURE

  ### Step 1: Temporal & Physical Link (The "Hard No" Filter)
  **Question:** Did our action occur *before* the effect, and is there a known physical pathway connecting them?
  *   **Pass:** Action happened first + there is a biological/physical mechanism (e.g., plants drink water, barriers block flow).
  *   **Fail:** Effect happened before action OR no physical way for action to influence effect.
  *   **Decision:** **STOP. HARD NO.** No causal claim possible.

  ### Step 2: Counterfactual Dependence (The "But-For" Test)
  **Question:** If we had *not* performed this action, would the effect still have occurred to roughly the same degree?
  *   **Method:** Imagine the nearest possible world where we did nothing. Look at external factors (weather, regional geology, animal activity).
  *   **Pass (Dependence):** No. The effect would *not* have happened (or would be significantly smaller) without us.
  *   **Fail (Independence):** Yes. The effect would have happened anyway due to other factors.
  *   **Decision:**
      *   If **Fail**: **STOP.** We are not the cause. (Exception: Go to Step 4 if overdetermination is suspected).
      *   If **Pass**: Proceed to Step 3.

  ### Step 3: Interventionist Mechanism (The "Knob" Test)
  **Question:** Did our action manipulate the specific variable that drives the effect, holding other things fixed?
  *   **Method:** Did we turn a "knob" in the system? (e.g., Did planting reeds actually change evapotranspiration rates, or did we just plant them in dry soil?)
  *   **Pass:** Yes. Our action is an invariant intervention on the cause-variable.
  *   **Fail:** No. Our action is correlated but doesn't drive the mechanism (e.g., we planted reeds where water was already draining naturally).
  *   **Decision:**
      *   If **Fail**: **STOP.** Correlation is not causation.
      *   If **Pass**: Proceed to Step 4.

  ### Step 4: Overdetermination & Preemption Check
  **Question:** Were there other sufficient causes happening at the same time?
  *   **Scenario A (Unique Cause):** Only we did it. -> **Full Credit/Blame.**
  *   **Scenario B (Overdetermination):** Another cause (e.g., beavers, storm) was also sufficient to produce the effect alone.
  *   **Scenario C (Preemption):** Another cause was ready to happen, but we did it first.
  *   **Decision:**
      *   If **Scenario A**: Claim Full Credit/Blame.
      *   If **Scenario B or C**: **PHILOSOPHICAL VOTE REQUIRED.** (See Voting Protocol below).

  ### Step 5: Data Integrity Flag
  **Question:** Do we have quantitative pre-intervention baseline data?
  *   **Yes:** Proceed with confidence.
  *   **No:** **FLAG AS SPECULATIVE.** All previous "Pass" decisions are now probabilistic, not certain.

  ---

  ## PART 2: VOTING PROTOCOL (When Philosophy Doesn't Settle It)

  If you reach **Step 4 (Scenario B/C)** or **Step 5 (No Data)**, the team must vote. Philosophy identifies the ambiguity; the team decides the policy.

  *   **Vote Option 1 (Causal Contribution):** We accept partial responsibility proportional to our estimated impact magnitude.
  *   **Vote Option 2 (Moral Responsibility):** We accept blame/credit because we intended the action, regardless of whether the effect was overdetermined.
  *   **Vote Option 3 (Epistemic Humility):** We claim no causality due to insufficient data (Step 5 failure).

  ---

  ## PART 3: CASE APPLICATIONS

  ### Case 1: Native Reeds vs. Regional Drought
  **Claim:** The collective is blamed for lowering the water table.
  **Action:** Planting native reeds.
  **Effect:** Low water table.
  **Context:** Severe regional drought occurring simultaneously.

  *   **Step 1 (Link):** **PASS.** Reeds drink water (evapotranspiration); physical link exists.
  *   **Step 2 (Counterfactual):** **FAIL.** If we had *not* planted reeds, would the water table be low? **Yes.** The regional drought is a sufficient cause for low water tables across the county, regardless of our reeds. The effect does not depend on our action.
  *   **Decision:** **STOP. HARD NO.**
  *   **Outcome:** The procedure says **NOT OUR FAULT.**
  *   **Social Friction Note:** The collective may feel responsible regardless. If you want to accept blame anyway, you must override the procedure via **Vote Option 2 (Moral Responsibility)**, acknowledging you are accepting blame for *intent*, not *causal impact*.

  ### Case 2: Beavers vs. Flow Barriers
  **Claim:** Who caused the flooding?
  **Action:** Collective installed flow barriers.
  **Alternative Cause:** Beavers returned naturally and built dams nearby.
  **Effect:** Localized flooding.

  *   **Step 1 (Link):** **PASS.** Barriers block flow; Beaver dams block flow.
  *   **Step 2 (Counterfactual):** **MIXED.**
      *   If no barriers (but beavers stay): Flooding likely still happens.
      *   If no beavers (but barriers stay): Flooding likely still happens.
      *   *Result:* This is **Overdetermination** (Step 4, Scenario B). Neither passes the strict "But-For" test alone because the other is sufficient.
  *   **Step 3 (Interventionist):** **PASS.** If we remove our barriers, water levels drop (manipulability confirmed). If beavers leave, water levels drop. Both are valid interventions.
  *   **Step 4 (Overdetermination):** **TRIGGERED.** Both causes are sufficient.
  *   **Decision:** **PHILOSOPHICAL VOTE REQUIRED.**
  *   **Recommended Vote:** **Vote Option 1 (Causal Contribution).** Split the credit/blame. Since both are manipulable causes, both are real causes. Assign 50/50 or estimate based on dam size vs. barrier size.

  ---

  ## PART 4: WHERE THIS BREAKS (Missing Data Warning)

  You mentioned lacking pre-intervention measurements. This critically undermines **Step 2** and **Step 3**.

  1.  **The Counterfactual Breakdown (Step 2):**
      *   Without baseline water levels from *before* the reeds/barriers were installed, you cannot know if the water table was *already* dropping due to drought (Case 1) or *already* prone to flooding (Case 2).
      *   **Risk:** You might fail Step 2 incorrectly. In Case 1, you might think the reeds caused the drop because you don't have data showing the drought dropped it elsewhere first.
      *   **Fix:** Use regional proxy data (nearby unmanaged wetlands). If nearby wetlands dropped too, the drought is the cause, not you.

  2.  **The Mechanism Breakdown (Step 3):**
      *   Without knowing the flow rate before the barriers, you cannot prove the barriers *changed* the variable.
      *   **Risk:** You might pass Step 3 based on theory alone.
      *   **Fix:** Install measurement stakes immediately. Until then, flag all decisions as **Step 5 Speculative**.

  3.  **The Overdetermination Trap (Case 2):**
      *   Without data, you cannot split the credit accurately. Is it 50/50? Or did the beavers do 90% of the work and you did 10%?
      *   **Risk:** Taking too much credit or blame.
      *   **Fix:** Default to **Vote Option 3 (Epistemic Humility)** until one season of data is collected.

  ## SUMMARY FOR TOMORROW'S CHECK-IN
  1.  Run the 5 Steps.
  2.  If Step 2 says "It would have happened anyway" (like the drought), **do not take blame** unless you vote to accept moral responsibility instead of causal responsibility.
  3.  If Step 4 says "Both us and nature did it" (like the beavers), **split the credit**.
  4.  If you lack data, **announce the uncertainty** before voting. Do not pretend the philosophy gives you certainty when the data is missing.
