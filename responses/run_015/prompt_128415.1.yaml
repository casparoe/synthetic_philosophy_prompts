answer: |-
  - **The pattern**
  In the context of the St. Petersburg Paradox, this pattern manifests as a dialectical loop where a proponent defends a resolution by alternating between two distinct theoretical mechanisms without integrating them. Initially, the speaker asserts a normative claim, such as "rational agents have bounded utility functions," which mathematically caps the expected value. When challenged with a modified payoff schedule that scales with utility (neutralizing the bound), the speaker retreats to an empirical claim: "no casino has infinite capital, so the game must end." However, once the interlocutor grants the finite bankroll but asks what a rational agent *should* do in a hypothetical infinite-bankroll scenario, the speaker pivots back to the normative claim, insisting that utility bounds are the fundamental reason for rejection.

  This creates a defensive perimeter where the argument never rests on a single vulnerable premise. The utility bound is treated as the "real" philosophical answer until it is mathematically bypassed, at which point the finite bankroll is treated as the "practical" answer until the hypothetical is restored. The speaker does not claim that both factors jointly determine the price (e.g., a weighted model); rather, they present each as a sufficient explanation in turn, discarding the first when attacked and resurrecting it when the second is cornered. This allows the conclusion ("you shouldn't pay infinite money") to remain stable while the theoretical support shifts fluidly to absorb counter-attacks.

  - **Nearest established concepts**
  **Motte-and-Bailey** comes closest in structure, as it involves retreating to a defensible position when challenged. However, in a classic Motte-and-Bailey, one position is controversial (the Bailey) and the other is trivial or indisputable (the Motte). In your seminar, both "bounded utility" and "finite bankroll" are substantive, contestable theoretical claims, and the speaker isn't trying to sneak the controversial one in via the trivial one; they are treating them as interchangeable shields. **Kettle Logic** (Freud) involves offering multiple contradictory excuses simultaneously to defend against an accusation. Your example is distinct because the excuses are offered *sequentially* rather than all at once; the speaker doesn't say "both are true," they say "actually, this one is the reason" depending on the immediate pressure.

  **Auxiliary Hypothesis Stacking** (from Lakatosian philosophy of science) involves adding assumptions to protect a core theory from falsification. This doesn't quite fit because the speaker isn't *adding* the bankroll constraint to the utility theory; they are *swapping* the core mechanism entirely. They aren't saying "Utility is bounded *and* banks are finite"; they are saying "Utility is bounded... oh, you patched that? Okay, banks are finite." This is a substitution of core premises rather than an accumulation of protective belts, making it a form of inconsistency rather than complexification.

  - **The term**
  There is no single canonical name for this specific dialectical maneuver in formal logic, though it is a recognized informal tactic in policy and economic debate. I propose calling this **"The Justification Shuttle."** It is defined as a defensive argumentative strategy where a proponent supports a single conclusion by oscillating between two distinct, potentially incompatible explanatory models, retreating to Model B when Model A is challenged, and returning to Model A when Model B is challenged, without ever committing to a unified framework that specifies the relationship between them.

  A clear boundary case distinguishes this from legitimate **Theoretical Pluralism**. In pluralism, an agent explicitly states, "Both factors contribute; here is how they interact." For example, if a student said, "The price is determined by utility bounds, *but* in real markets, bankroll limits enforce those bounds even tighter," they are building a joint model. In the Justification Shuttle, the speaker implicitly treats the first justification as false or irrelevant when invoking the second (e.g., implying the utility bound doesn't matter if the bankroll runs out first), only to treat it as essential again later. The boundary is crossed when the speaker refuses to specify the causal weight or interaction of the two factors when pressed.

  - **The tell**
  To distinguish this defensive double-bookkeeping from legitimate pluralism, listen for the use of exclusive qualifiers during the pivot. A legitimate pluralist uses conjunctive language ("and," "jointly," "in combination"), whereas the Justification Shuttle relies on corrective language ("actually," "rather," "more fundamentally"). If you ask, "Do both factors apply simultaneously?" and the speaker hesitates or says, "Well, it depends on which objection you're raising," they are shuttling. If they say, "Yes, the agent's psychology and the casino's physics both constrain the payout," they are integrating. The tell is whether the two explanations are treated as *layers of the same cake* or as *two different cakes* brought out depending on which one hasn't been eaten yet.

  - **Bottom line for my presentation**
  You should call this out, but frame it as a request for theoretical integration rather than accusing peers of a fallacy. In decision theory, the tension between normative (utility) and empirical (bankroll) resolutions is a genuine open problem, so your observation is insightful rather than pedantic. Ask the class: "Are these competing explanations or complementary ones, and can we write down a single model that includes both?" This forces the shuttle to land and reveals whether the consensus is robust or just evasive.
