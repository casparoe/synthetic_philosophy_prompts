prompt: |-
  ok so im in this decision theory seminar and we just finished the unit on the st petersburg paradox. ive noticed this argumentative pattern that keeps coming up in discussion and in the readings, and i dont know if theres a name for it.

  heres what happens. someone lays out the classic setup: infinite expected payout, but real people wont pay more than like twenty bucks. then they propose resolution A — usually some kind of bounded utilty curve or risk aversion — and show that makes the expected utilty finite. but then someone asks "ok but if you redesign the payoff schedule so the stakes scale with the utility, youre back to infinity," and instead of defending resolution A, the first person pivots to resolution B: "well no actual casino has infinite capital, so the game gets cut off at some max payout and the expectation is finite anyway." then once that institutional-objection is handled, they switch back to citing the utility curve like that was the real answer the whole time. its not that theyre combining both factors; theyre keeping two separate explanations in their back pocket and pulling out whichever one answers the current attack. ive seen this with (utility bounds vs finite bankroll), (risk aversion vs physical impossibility of running infinite trials), and even (logarithmic scaling vs people just not grasping exponential growth). in each pair the two explanations predict different things about what a rational agent should do if the other constraint were removed, but nobody in class treats that tension as a problem.

  this feels different from just having a multi-cause explanation. its also not exactly motte-and-bailey, because neither version is an indefensible "motte" or an outrageous "bailey" — both are standard literature answers. and its not plain equivocation, since the speaker isnt sliding between meanings of one word; theyre alternating between two distinct mechanisms.

  so: is there an established concept for this specific move? if not, can you coin a term and define it precisely, including what counts as a boundary case? specifically i want to know how to tell this apart from someone who genuinely thinks both factors contribute.

  please organize your answer like this:

  - The pattern (2-3 paragraphs describing it concretely, using the examples above)
  - Nearest established concepts (motte-and-bailey, auxiliary-hypothesis stacking, etc. — say which ones come close and where they fail to fit, about 1 paragraph each)
  - The term (if one exists, explain it; if not, propose one with a clear definition and at least one boundary case — 1-2 paragraphs)
  - The tell (how to distinguish this defensive double-bookkeeping from legitimate pluralism about explanations — 1 paragraph)
  - Bottom line for my presentation (short: should i call this out in seminar or is it just normal academic debate? maybe 3-4 sentences)

  sorry if this is rambly — writing on my phone between classes and i probably missed some commas. thanks!
