answer: |-
  No existing framework satisfies all desiderata simultaneously because maintaining the temporal stability of knowledge states is logically incompatible with making knowledge constitutively dependent on fluctuating practical stakes.

  ### The Specification (Desiderata)

  **1. Case Coverage (Non-Negotiable)**
  *   **Bank Low/High:** Must explain why "I know the bank is open" is assertible in low-stakes contexts but withdrawn in high-stakes contexts without treating one speaker as systematically erroneous.
  *   **Lottery:** Must deny knowledge of losing ticket propositions despite high statistical probability, distinguishing them from ordinary empirical claims.
  *   **Stopped Clock:** Must deny knowledge in Gettier-style luck cases even if practical stakes are low, preserving the truth/connection requirement.

  **2. Conceptual Boundaries (Non-Negotiable)**
  *   **Knowledge vs. Rational Acceptance:** Must distinguish *knowing p* from *being rational to act as if p*. A theory that collapses knowledge into rational acceptance fails to explain why "I know, but I shouldn't act on it" sounds contradictory.
  *   **Subject vs. Attributor Stakes:** Must specify whose stakes matter. Subject-sensitive invariantism (SSI) requires the subject's stakes to determine knowledge; contextualism requires the attributor's context to determine the truth conditions of the knowledge claim.
  *   **Evidence vs. Stakes:** Must clarify if stakes alter the *evidence required* (threshold shifting) or the *status of knowledge* directly (constitutive encroachment).

  **3. Psychological Constraints (Contested but Relevant)**
  *   **Risk vs. Belief Revision:** Data suggests agents often maintain belief confidence while altering action thresholds under risk. A stakes theory claiming knowledge *vanishes* under high stakes predicts belief should vanish or feel unstable, which contradicts findings that belief is often sticky while caution rises.
  *   **Attribution Bias:** Folk attributions of knowledge shift with stakes, but so do attributions of confidence and assertion appropriateness. The theory must isolate knowledge specifically, not merely conflate it with assertibility norms.

  **4. The Retroactive Edge Case (Critical Stress Test)**
  *   **Scenario:** Subject forms belief *p* at *t1* (low stakes). At *t2*, stakes regarding *p* spike retroactively (e.g., it is revealed that acting on *p* at *t1* would have caused catastrophe, or the consequences of *p* being false are now known to have been severe all along).
  *   **Requirement:** The theory must determine if the subject *knew* at *t1* and whether they *know* at *t2* that they knew.
  *   **Constraint:** If knowledge is lost at *t2* due to the stake spike, the theory accepts retroactive knowledge loss. If knowledge is retained, the theory must explain why current stakes do not govern past epistemic status.

  ### Settled vs. Contested Requirements

  **Settled (Minimal Bar for Entry)**
  *   **Truth Requirement:** Knowledge entails truth. (No theory can grant knowledge of false propositions regardless of stakes).
  *   **Belief Requirement:** Knowledge entails belief. (You cannot know what you do not believe).
  *   **Bank Intuitions:** Any viable theory must account for the *linguistic data* of the Bank Cases (why speakers hesitate in High Stakes), even if it explains it away as error.

  **Contested (Camp-Specific)**
  *   **Semantic Invariance:** Contextualists deny this (knowledge claims change truth value); Invariantists (including PE) require it (knowledge state is stable, our claims vary or knowledge itself varies objectively).
  *   **Pragmatic Encroachment:** Traditionalists deny stakes affect knowledge constitution; PE proponents assert it is non-negotiable.
  *   **Factivity of Reasons:** Whether practical stakes can count as epistemic reasons is disputed.

  ### Unsatisfiable Pairs (The Trade-Offs)

  **1. Diachronic Stability vs. Stakes Sensitivity**
  You cannot have both. If knowledge depends on stakes, and stakes change (as in the Retroactive Edge Case), knowledge status must change.
  *   **If you preserve Stability:** You must argue the subject *still knows* despite the stake spike. This kills stakes-sensitivity for past beliefs and forces you to explain why current action based on that knowledge feels irrational.
  *   **If you preserve Sensitivity:** You must accept **Retroactive Loss**. The subject knew at *t1*, but does not know at *t2*. This violates the intuition that past epistemic facts are fixed by past conditions, making knowledge metaphysically fragile.

  **2. Psychological Realism vs. Normative Encroachment**
  *   **If you preserve Realism:** Psychology shows belief confidence often remains stable while action thresholds rise. If your theory says knowledge *disappears* in high stakes, it predicts a drop in confidence that isn't always observed.
  *   **If you preserve Encroachment:** You must argue agents are mistaken about their own belief states in high-stakes environments, or that knowledge is distinct from confidence (which complicates the knowledge-first picture).

  ### Theory Check Against Spec

  **Pure Contextualism**
  *   **Performance:** Solves Bank Low/High easily by shifting truth conditions of "knows."
  *   **Failure:** Fails Semantic Invariance (camp-specific cost). Struggles with the Retroactive Edge Case because the attributor's context changes, potentially altering the truth of past tense claims ("I knew") depending on who is speaking now. It avoids retroactive *metaphysical* loss but accepts retroactive *semantic* instability.

  **Invariantist Pragmatic Encroachment (SSI/PE)**
  *   **Performance:** Preserves Semantic Invariance. Directly ties knowledge to subject's stakes.
  *   **Failure:** Collapses hardest on **Diachronic Stability**. In the Retroactive Edge Case, if stakes define knowledge, the subject loses knowledge at *t2*. This implies knowledge is not a fixed historical fact but a current relational status, which many find metaphysically untenable. It also risks contradicting Psychological Realism by implying belief rationality shifts with stakes.

  **Knowledge-First (Strict Invariantism)**
  *   **Performance:** Preserves Diachronic Stability and Psychological Realism (belief/knowledge is stable; only action norms shift).
  *   **Failure:** Fails Bank Low/High without an **Error Theory**. It must claim speakers in High Stakes are *wrong* to deny knowledge, attributing their hesitation to conversational implicature rather than truth. This violates the desideratum to explain the data without treating one side as systematically erroneous.
