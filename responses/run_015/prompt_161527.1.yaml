answer: |-
  Your suspicions are well-founded. The handout you have is a classic example of what happens when a complex, decades-long philosophical debate is compressed into a single page for undergraduates. It isn't necessarily *lying*, but it presents a specific, somewhat cynical philosophical stance (likely strong constructivism) as if it were the settled consensus.

  It creates a false dichotomy: either you are a rigid positivist hunting for physics-style laws (Hempel), or you are a literary artist imposing plots on chaos (Narrativism). Most working historians and contemporary philosophers of history live comfortably in the middle ground that the handout dismisses.

  Here is a claim-by-claim audit of the handout, followed by how this applies to your mill.

  ### Part 1: Auditing the Handout

  #### Claim 1: *"Hempel's covering-law model says that to explain an event is to show that it had to happen... from a universal law plus the initial conditions."*
  *   **Verdict:** **Fair summary of the strict model, but outdated.**
  *   **The Nuance:** Carl Hempel's 1942 paper did argue for the Deductive-Nomological (D-N) model. However, Hempel himself later softened this to include probabilistic laws (the Inductive-Statistical model), acknowledging that in human affairs, we often deal with high probability rather than logical necessity.
  *   **The Polemic:** The phrase "had to happen" is the giveaway. Even Hempel didn't think historical events were *metaphysically* necessary, only that they were nomologically expectable. The handout sets up a straw man to knock down.

  #### Claim 2: *"History has no such laws... so strictly speaking there are no explanations in history, only 'explanation sketches'."*
  *   **Verdict:** **Misleading simplification.**
  *   **The Nuance:** Hempel *did* coin the term "explanation sketches." However, he didn't use it to say history is fake or worthless. He used it to say: *Historical explanations are elliptical.* They rely on tacit assumptions about human behavior (e.g., "people usually try to preserve their livelihood") that *could* be made explicit if we had better social science laws.
  *   **The Polemic:** The handout implies Hempel was a skeptic who thought historians were failing. In reality, Hempel thought historians were doing a respectable job that could theoretically be made more rigorous. He wasn't trying to banish explanation; he was trying to define its logical structure.

  #### Claim 3: *"What historians really do, as the narrativists showed, is weave events into a story... imposed by the writer rather than found in the archive."*
  *   **Verdict:** **Accurate to Narrativism, but conflates 'meaning' with 'cause'.**
  *   **The Nuance:** This accurately reflects Hayden White and Louis Mink (1970s/80s). They argued that the *coherence* of a history comes from literary tropes (tragedy, romance, etc.), not from the data itself.
  *   **The Polemic:** The handout presents this as the *solution* to Hempel's problem. It isn't. Narrativism is often a response to a different question. Hempel asked, "What are the logical conditions for causal explanation?" Narrativists asked, "How does history acquire meaning?" By treating Narrativism as the successor to CLM, the handout suggests you can't do causal analysis, only plotting. That is a philosophical choice, not a fact.

  #### Claim 4: *"The older rival... showing it made sense for the agent to do it... is really just storytelling with a psychology gloss."*
  *   **Verdict:** **Outright dismissal/Polemic.**
  *   **The Nuance:** This refers to W.B. Gallie and William Dray, who argued for "rational explanation." If a general lowers his sword because he believes he is outnumbered, you explain the action by reconstructing the reasoning. This is the "Reasons as Causes" debate.
  *   **The Polemic:** Dismissing this as "storytelling with a psychology gloss" ignores a massive debate in analytic philosophy (Donald Davidson, etc.) about whether reasons *are* causes. Many philosophers argue that understanding an agent's rationale *is* a valid form of causal explanation in history. The handout sweeps this under the rug to force you toward Narrativism.

  #### Claim 5: *"The upshot... stop hunting for causes, choose the plot... intelligibility is a virtue of the writing, not a discovery."*
  *   **Verdict:** **Smuggled Ideology.**
  *   **The Nuance:** This is the lecturer's own philosophical conclusion (likely strong constructivism), not a neutral summary of the field.
  *   **The Polemic:** This is dangerous advice for a historian. Most historians are "critical realists." They believe causes exist independently of the story (the flood *really* damaged the floor), even if the *story* we tell about the flood is shaped by our writing. Telling you to "stop hunting for causes" contradicts the actual practice of historical research, which is fundamentally forensic.

  ---

  ### Part 2: Answering Your Specific Questions

  **1. Is it fair that the covering-law model needs exceptionless universal laws, and that this is what sinks it for history?**
  It is fair to the *strict* 1942 version of Hempel, but unfair to the broader debate. Most philosophers of history agree that history lacks *physics-style* exceptionless laws. However, many argue we use "local generalizations" (e.g., "in 1950s New England, textile margins were typically X%"). If you treat laws as "tendency statements" rather than "iron laws," the Covering-Law model can still be useful. The handout treats the lack of physics-laws as a death sentence for causal explanation, which most historians reject.

  **2. Are explanation sketches supposed to show that history has no explanations, or are they doing something else?**
  They are doing something else. For Hempel, a sketch was a promise: "I know I haven't stated the law, but I know where it would go if we had better social science." It was a call for rigor, not a declaration of impossibility. The handout uses "sketch" to mean "fake explanation."

  **3. Is narrativism actually an answer to the covering-law problem, or is it a different argument?**
  It is largely a different argument dressed up as a successor. Covering-Law is about **causality** (why X happened). Narrativism is about **intelligibility** (how X makes sense to us).
  *   *CLM:* "The mill closed because profit < cost."
  *   *Narrativism:* "The mill's closing was the tragic final act of the town's industrial age."
  These are compatible. You can have a causal account *within* a narrative structure. The handout forces you to choose one, which is a false dilemma.

  **4. Is the closing advice something that follows from the accurate parts, or did the lecturer smuggle it in?**
  Smuggled in. It does not follow. You can accept that history lacks universal laws (Hempel's problem) *and* that narratives shape understanding (Narrativism) *without* concluding that causes are fictional. You can believe the flood *caused* the closure (realism) while acknowledging that describing it as a "tragedy" is a literary choice (narrativism). The advice to "stop hunting for causes" is a philosophical preference, not a logical necessity.

  ---

  ### Part 3: Back to the Mill

  You have a specific causal question: **Why 1957 and not 1949?**
  This is a *contrastive explanation*. You aren't just asking "Why did it close?" but "Why *then*?"

  **What would the Covering-Law picture say you're missing?**
  A strict Hempelian would say you are missing the **generalization** that connects your conditions to the outcome.
  *   *You have:* Initial conditions (lost contract '46, son refused, flood '55, competition, highway).
  *   *You need:* A rule like, "Family firms in the textile sector will cease operations when cumulative capital shocks exceed reserve liquidity, provided no successor is willing to leverage personal assets."
  *   *The Critique:* The CLM critic would say, "You've listed factors, but you haven't shown why these factors necessitated closure in '57 specifically. Why did the firm survive the '46 contract loss? What was the threshold?"
  *   *Usefulness:* Low. You will not find a universal law of textile mill closures. But the *spirit* of this critique is useful: it pushes you to look for the **tipping point mechanism**. What changed between '46 and '57 that made the '46 problems fatal in '57? (Answer: The accumulation of debt + the flood + the son's refusal removed the resilience needed to absorb the '46 shock).

  **What would the Narrativist picture say?**
  A Narrativist would say your list is a **chronicle**, not a history.
  *   *They would argue:* "You have a list of events. To explain it, you must emplot it. Is this a story of 'Inevitable Decline'? Is it 'Bad Luck'? Is it 'The Failure of Succession'?"
  *   *Their verdict:* Your account becomes an explanation when you show how the 1957 closure gives meaning to the 1949 trouble. Perhaps 1949 was the "inciting incident" and 1957 was the "catastrophe."
  *   *Usefulness:* High for writing, low for verification. It helps you structure the piece, but it doesn't help you prove *why* it happened.

  **Are they arguing about the same question?**
  **No.** This is the most important thing the handout obscured.
  *   **CLM** asks: *What necessitated the event?* (Ontological/Causal)
  *   **Narrativism** asks: *How do we comprehend the event?* (Epistemological/Literary)

  **Practical Advice for Your Piece**
  Do not follow the handout's advice to "stop hunting for causes." Your question ("Why 1957 not 1949?") is inherently causal. If you just "choose a plot," you might write a beautiful tragedy that gets the history wrong.

  Instead, try a **Critical Realist** approach (the middle ground the handout ignored):
  1.  **Treat the causes as real.** The flood, the contract, and the highway are objective facts that exerted pressure on the mill.
  2.  **Use the "Explanation Sketch" honestly.** You don't need a universal law. You need a *local mechanism*. Explain the *process*: The 1949 trouble drained the reserves. The 1955 flood drained the remaining capital. The son's refusal removed the creditworthiness needed to borrow for repairs. The 1957 highway sealed the market access.
  3.  **Use Narrative for intelligibility.** Once you have established the causal chain, *then* use narrative to make it intelligible. "The mill didn't die in 1949 because it had reserves; it died in 1957 because the reserves were gone." That is a story (The Exhaustion of Resilience), but it is grounded in the causes.

  **Summary:** The handout is a polemic for strong constructivism. It treats the failure of the Covering-Law Model as a failure of *causality itself*, which is a non-sequitur. You can (and should) hunt for causes *and* write a good story. For your mill, the "explanation" is the specific sequence of erosions that turned a survivable crisis (1949) into a fatal one (1957). That is a causal discovery, not just a plot choice.
