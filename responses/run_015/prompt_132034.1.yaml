  On the second, rigid reading, the stipulation includes an implicit actuality operator. The condition fixes reference to the object that *in fact* (in the actual world) comes closest to satisfying $C$. Once fixed, the name tags that object directly. In counterfactual worlds, "Vulcan" continues to denote $b$, even if $b$ does not satisfy the runner-up condition there. This is the more natural reading for name introductions. Following standard Kripkean semantics, when a name is introduced via description, the description fixes the reference in the actual world but does not provide the meaning or synonymy. The name becomes a tag for the object, not a shorthand for the description. Therefore, on the natural reading, "Vulcan" is rigid.

  This distinguishes the case from a purely descriptive usage but aligns it with the Neptune case. In the Neptune case, a name was introduced via a description of the cause of perturbations. Kripke argues that if introduced as a name, it rigidly denotes the actual satisfier. Similarly, "Vulcan" rigidly denotes the actual closest satisfier. Contrast this with Hesperus/Phosphorus, where both names are anchored by independent causal chains. In the runner-up case, "Vulcan" is anchored by a descriptive stipulation, while "X" is anchored causally. Does the causal history of "X" add necessity? No. The necessity arises from the rigidity of both terms. Whether a name is anchored causally (like "X") or by rigidified description (like "Vulcan") is irrelevant to the modal status of the identity; only rigidity matters. The necessity is metaphysical, identical in kind to the Hesperus/Phosphorus case, not merely de facto rigidity. The causal history explains how *we* grasp the reference, but rigidity explains the modal profile.

  The intuition that *Vulcan might easily have failed to be X* arises from conflating the reference-fixing description with the name's meaning. We imagine a world where a different body is closest to satisfying $C$ and judge that "Vulcan" would denote that body. This is correct on the non-rigid reading but incorrect on the rigid reading. On the rigid reading, we are imagining a world where the *reference-fixing fact* differs (a different body is actually closest), not a world where the name "Vulcan" (as actually introduced) denotes something else. This is the familiar Kripkean illusion: we mistake the contingency of the reference-fixing condition for the contingency of the identity statement. The statement is necessary because both names lock onto the same object $b$ across all worlds.

