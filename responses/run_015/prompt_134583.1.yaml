prompt: |-
  I'm drafting a chapter on informed consent for clinical trials and have settled on a fairly demanding view that I'm not fully sure I can defend: valid consent requires not merely the absence of coercion and deception, but what I call counterfactual epistemic autonomy—the subject must be able to articulate, in vocabulary they already possess rather than one they've been taught for the occasion, the central risks and benefits they are accepting, and this articulation must remain stable across at least two counterfactual presentations (different ordering, different framing, different emotional valence). I also treat competence as irreducibly domain-specific rather than global, so that being competent to consent to a routine financial contract gives no direct license for consent to an experimental neurostimulation protocol, and I deny that this competence can be fully delegated to a proxy without altering the normative status of the act. The position is meant to be stricter than the standard Beauchamp-Childress framework without collapsing into paternalism, but I'm aware it may over-intellectualize consent in ways that exclude valid consent by non-expert subjects. So I want an honest map of its exposure: what observations about actual consent practices, what formal results in decision theory or moral psychology, and what limiting cases—perhaps involving deception that still feels like autonomy, or coercion so structural it cannot be named—would genuinely count against it? I want decisive defeaters separated from merely awkward ones, and I want to know which of these a defender of this view should concede as damaging rather than dismiss as irrelevant. In particular, I'm curious whether the domain-specificity of competence creates a regress problem—who certifies the certifiers?—and whether that is fatal or just administratively inconvenient. If the position turns out to be well-insulated because every apparent counterexample can be absorbed by refining the notion of "counterfactual stability," is that a theoretical virtue or a sign that I've insulated it into unfalsifiability? I'd like the answer to treat my framework as genuinely at risk, not as a strawman to be protected.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Informed consent in clinical trials.
      *   **User's Position:** A "fairly demanding view" involving:
          1.  *Counterfactual Epistemic Autonomy:* Subjects must articulate risks/benefits in *pre-existing vocabulary* (not taught for the occasion) and maintain stability across counterfactual presentations (ordering, framing, valence).
          2.  *Domain-Specific Competence:* Competence is not global; financial competence $\neq$ neurostimulation competence.
          3.  *Non-Delegability:* Proxy consent alters the normative status (cannot fully delegate without loss).
          4.  *Goal:* Stricter than Beauchamp-Childress, but not paternalistic.
      *   **Task:** Provide an "honest map of its exposure." Identify decisive defeaters vs. awkward objections. Focus on:
          *   Observations of actual practice.
          *   Formal results (decision theory/moral psychology).
          *   Limiting cases (deception/autonomy, structural coercion).
          *   The regress problem (who certifies certifiers?).
          *   The risk of unfalsifiability (insulating via refinement).
      *   **Tone:** Critical, rigorous, treating the framework as "genuinely at risk," not a strawman.

  2.  **Deconstruct the User's Framework (The "Target"):**
      *   *Constraint 1 (Vocabulary):* "Vocabulary they already possess." This is the most vulnerable point. Clinical trials often involve novel mechanisms (e.g., mRNA, gene therapy, neurostimulation). Patients *don't* have the vocabulary. Requiring pre-existing vocabulary effectively bans enrollment in novel trials for laypeople.
      *   *Constraint 2 (Counterfactual Stability):* Stability across framing/ordering. This clashes with known cognitive science (framing effects are ubiquitous even among experts).
      *   *Constraint 3 (Domain Specificity):* Reasonable, but leads to the regress problem.
      *   *Constraint 4 (Proxy):* Strong anti-paternalism/anti-substitution view.

  3.  **Brainstorming Defeaters & Challenges:**

      *   **The "Novelty" Problem (Vocabulary):** If I can't use taught vocabulary, how do I consent to something new? This seems to make consent to *innovation* impossible. This is a potential *reductio ad absurdum*.
      *   **The "Framing" Problem (Psychology):** Tversky & Kahneman. Framing effects are hardwired. If stability is required, almost *no one* passes (including doctors consenting for themselves). This makes the standard impossible to meet, rendering the concept of "valid consent" empty.
      *   **The "Regress" Problem (Certification):** If competence is domain-specific, who determines the domain boundaries and the competence threshold? If it requires a higher-order competence, we have a regress. If it doesn't, it's arbitrary.
      *   **The "Therapeutic Misconception" vs. "Vocabulary":** Patients often conflate research with care. Your view might exclude them, which is good ethically but practically paralyzing.
      *   **The "Structural Coercion" Problem:** Poverty, illness desperation. If these aren't named, does your framework ignore them?
      *   **The "Unfalsifiability" Risk:** If every failure of stability is blamed on "insufficient understanding" rather than "human psychology," the theory protects itself from empirical refutation.

  4.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the ambition and rigor of the view. Validate the intent (protecting autonomy).
      *   **Section 1: The Vocabulary Constraint (The "Novelty" Defeater).** This is the strongest candidate for a *decisive* defeater. If you can't learn the terms, you can't consent to the new.
      *   **Section 2: Counterfactual Stability & Cognitive Science.** Framing effects are universal. If the standard is humanly impossible, it's not a moral standard, it's a prohibition.
      *   **Section 3: The Regress of Domain-Specificity.** Who certifies? Is it fatal?
      *   **Section 4: Proxy Consent & Emergency Cases.** The normative status shift might block life-saving research in incapacitated populations.
      *   **Section 5: Unfalsifiability vs. Refinement.** Address the methodological worry.
      *   **Conclusion:** Summary of what must be conceded or modified.

  5.  **Drafting the Content - Specific Arguments:**

      *   *Vocabulary:* Distinguish between *concepts* and *labels*. Maybe they have the concept but not the technical term? But the prompt says "vocabulary they already possess." If the trial is for a new mechanism, they *don't* possess the concept. *Verdict:* This needs major concession. It effectively bans novel trials.
      *   *Stability:* Cite *preference construction* theory. Preferences aren't always pre-existing; they are constructed during the consent process. Demanding stability assumes pre-existing preferences. This contradicts moral psychology.
      *   *Regress:* It's not necessarily fatal if we use a "trust but verify" institutional model, but theoretically, it lacks a foundation. It shifts the burden to the IRB/Reviewer.
      *   *Proxies:* If proxy consent changes the normative status, does it invalidate the trial? Many trials rely on proxies (pediatrics, dementia). If the status changes, is the data tainted? Or is the act just "different"?
      *   *Unfalsifiability:* If "stability" is defined so loosely that it accommodates all framing effects, it's useless. If defined strictly, it's impossible. This is the "Goldilocks" problem.

  6.  **Refining the Tone:**
      *   Avoid being dismissive.
      *   Avoid being too protective.
      *   Use philosophical terminology correctly (normative status, *reductio*, epistemic condition).
      *   Directly answer the "decisive vs. awkward" question.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "structural coercion" point? *Adjustment:* Add a section on how "counterfactual stability" might miss structural desperation (the "offer you can't refuse" that looks like a choice).
      *   *Check:* Did I address the "who certifies" regress? *Adjustment:* Make sure to distinguish between a logical regress (fatal) and a practical bureaucratic burden (inconvenient).
      *   *Check:* Is the vocabulary point truly decisive? *Reasoning:* Yes, because clinical trials are by definition experimental/novel. If I can't understand the novelty without being taught, and being taught disqualifies the vocabulary, I can't consent. This is a performative contradiction.

  8.  **Final Polish:** Organize into clear headings. Ensure the distinction between "awkward implications" and "decisive defeaters" is explicit. (Self-correction: Ensure I don't just say "it's too hard." The argument must be that it makes the *concept* of consent inapplicable to the *practice* it aims to regulate.)

  9.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  This is a rigorous and philosophically ambitious framework. You are attempting to solve the "therapeutic misconception" and "coercive optimism" problems by raising the epistemic bar significantly higher than the standard *MacArthur Competence Assessment Tool* (MacCAT) or Beauchamp-Childress models.

  However, by tightening the screws on *epistemic autonomy* and *domain specificity*, you have exposed the framework to specific classes of counterexamples that range from administratively burdensome to logically fatal. Below is a map of the exposure, categorized by the severity of the threat (Decisive Defeaters vs. Damaging Concessions vs. Theoretical Risks).

  ### 1. Decisive Defeaters: The "Novelty" and "Construction" Problems

  These are observations that, if accepted, suggest your criteria make valid consent to *clinical trials specifically* (as opposed to standard care) logically impossible or performatively contradictory.

  **A. The Vocabulary Constraint vs. The Nature of Innovation**
  *   **The Objection:** You require subjects to articulate risks/benefits in "vocabulary they already possess rather than one they've been taught for the occasion."
  *   **Why it is Decisive:** Clinical trials are, by definition, investigations into novel mechanisms, protocols, or devices. If the intervention is truly novel, the lay subject *cannot* possess the relevant vocabulary or concepts *ex ante*.
      *   *Example:* In a gene therapy trial, a subject cannot possess the concept of "viral vector immunogenicity" prior to the consent process. If they must use pre-existing vocabulary, they can only describe it in analogies (e.g., "a bug in the blood"). If the analogy fails to capture the specific risk (e.g., cytokine storm), their consent is invalid under your view. If the analogy succeeds, they have effectively learned the concept, violating the "not taught for the occasion" clause.
  *   **The Implication:** This criterion effectively bans laypeople from enrolling in any trial involving novel mechanisms. It restricts valid consent to experts only. This collapses your distinction between "clinical trial" and "expert consultation," rendering the framework useless for the population it is meant to protect (vulnerable patients seeking access to innovation).
  *   **Verdict:** **Fatal.** You must concede that vocabulary *acquisition* during the consent process is not only permissible but necessary. The constraint must shift from "pre-existing vocabulary" to "integration into existing conceptual schemas."

  **B. Preference Construction vs. Counterfactual Stability**
  *   **The Objection:** You require stability across different framings/orderings.
  *   **Why it is Decisive:** Decision theory (specifically *preference construction theory* à la Slovic, Tversky, Kahneman) demonstrates that preferences are often not pre-existing mental states that are *revealed* by questioning, but are *constructed* during the questioning process.
      *   *Formal Result:* Even experts exhibit framing effects. If a neurosurgeon consents to a procedure, their risk assessment may shift depending on whether mortality is framed as "90% survival" or "10% death."
      *   *The Trap:* If stability is a necessary condition for validity, and framing effects are a universal feature of human cognition (not just a defect of the uneducated), then **no human being** can give valid consent under your framework.
  *   **The Implication:** You have defined validity out of existence. A moral standard that no moral agent can satisfy is not a standard; it is a prohibition.
  *   **Verdict:** **Fatal.** You must abandon "stability" as a binary condition for validity and treat it as a gradient for *assessing vulnerability*.

  ### 2. Damaging Concessions: The Regress and The Proxy

  These are not necessarily fatal to the logic, but they impose costs that may undermine the practical utility of the framework or force you into uncomfortable normative corners.

  **A. The Regress of Domain-Specific Competence**
  *   **The Objection:** If competence is irreducibly domain-specific, who certifies the certifiers? To judge if a subject is competent to consent to neurostimulation, the evaluator must be competent to judge neurostimulation competence.
  *   **Analysis:**
      *   *Is it Fatal?* No, provided you accept an **institutional stopper**. You can argue that competence is certified by a board (IRB) whose authority is procedural, not epistemic.
      *   *The Damage:* This creates an asymmetry. The subject is held to a high epistemic bar (counterfactual stability), but the evaluator is held to a procedural bar. This looks like elitism. Furthermore, if the domain is *too* specific (e.g., "competent to consent to *this* protocol"), you lose the ability to generalize consent for longitudinal studies or adaptive trials.
      *   **Concession Required:** You must admit that domain-specificity creates a "boundary problem." Who decides where one domain ends and another begins? (e.g., Is "Phase I Oncology" a different domain from "Phase II Oncology"?). If you cannot define the domain boundaries non-arbitrarily, the specificity claim loses traction.

  **B. The Normative Status of Proxy Consent**
  *   **The Objection:** You deny competence can be fully delegated to a proxy without altering the normative status.
  *   **The Damage:** This creates a "tainted data" problem. If proxy consent alters the normative status of the act, does it also alter the moral permissibility of using the resulting data?
      *   *Limiting Case:* Pediatric trials or dementia research. If proxy consent is normatively distinct (perhaps "permission" rather than "consent"), does the subject retain a right to withdraw data upon regaining capacity?
      *   *Structural Coercion:* In many trials, the "proxy" is the treating physician (in emergency research exceptions). If your framework denies the validity of this delegation, you effectively ban emergency research.
      *   **Concession Required:** You must clarify if the "altered normative status" renders the act *impermissible* or merely *different*. If the former, your framework prohibits research on incapacitated populations entirely. If the latter, you need a taxonomy of what rights are lost (e.g., the right to claim autonomy violation).

  ### 3. Theoretical Risks: Unfalsifiability and Structural Coercion

  This addresses your methodological worry: *If every counterexample is absorbed by refining "stability," have I insulated the theory into triviality?*

  **A. The Unfalsifiability Trap**
  *   **The Risk:** You worry that "counterfactual stability" is a "get out of jail free" card. If a subject changes their mind under different framing, you can simply say, "Ah, they lacked stability, hence no consent." If they *don't* change their mind, you say, "Stability confirmed."
  *   **The Test:** To avoid this, your framework needs **independent criteria for stability** that do not rely on the outcome of the consent itself.
      *   *Current Flaw:* Currently, stability is measured by the *output* (the decision). It needs to be measured by the *process* (the reasoning).
      *   *Defeater:* If you cannot specify *how much* framing variation is required to test stability without itself becoming coercive (e.g., "I will keep re-explaining this until you agree consistently"), the test itself becomes a form of harassment/coercion.
  *   **Verdict:** **High Risk.** Without a pre-specified metric for "sufficient variation" in framing, the concept is ad hoc.

  **B. Structural Coercion and the "Named" Requirement**
  *   **The Objection:** You mention coercion must be "named." But structural coercion (poverty, lack of insurance, desperation) is often invisible to the subject.
  *   **The Limiting Case:** A subject consents to a high-risk trial because it is their only access to healthcare. They articulate the risks perfectly (high epistemic autonomy). They are stable across framings. But they are coerced by circumstance.
  *   **The Exposure:** Your framework focuses heavily on *epistemic* conditions (understanding, stability) and *psychological* conditions (competence), but it may under-weight *sociological* conditions (desperation).
  *   **Verdict:** **Damaging.** If your framework validates the consent of the desperately poor because they passed the vocabulary/stability test, you have failed to avoid exploitation. You must integrate a "voluntariness" condition that is independent of epistemic autonomy.

  ### 4. Summary of Necessary Retreats

  To defend a version of this view that is rigorous but not self-defeating, you should consider the following concessions:

  1.  **Abandon "Pre-existing Vocabulary":** Replace with **"Conceptual Integration."** The subject must be able to map the new information onto existing concepts (e.g., "risk," "pain," "chance"), even if they learn the technical labels during the process. *Reason:* Otherwise, novel science is inaccessible to laypeople.
  2.  **Soften "Stability" to "Resilience":** Do not demand identical decisions across framings. Demand that the *reasoning* remains consistent even if the risk tolerance shifts slightly. Acknowledge that some framing sensitivity is human, not incompetent. *Reason:* Otherwise, you ban all humans from research.
  3.  **Institutionalize the Regress:** Accept that domain-specificity is managed by **accreditation**, not infinite regress. The IRB is the "domain stopper." *Reason:* Otherwise, you have no practical mechanism for certification.
  4.  **Distinguish Validity from Permissibility:** A proxy consent might be "valid" (legally/morally effective) but "normatively diminished" (requiring extra safeguards). Do not let the diminished status block the research entirely, or you harm the population the proxy represents.

  ### Final Diagnosis

  Your framework is currently **over-intellectualized to the point of exclusion.** It treats the ideal rational agent as the baseline for moral permission.

  *   **Is the domain-specificity regress fatal?** No, it is administratively inconvenient but solvable via institutional authority.
  *   **Is the unfalsifiability risk real?** Yes. If "stability" is defined post-hoc based on whether we like the consent outcome, the theory is empty. It requires pre-registered testing protocols for consent (which is ironically its own intervention).
  *   **The Decisive Defeater:** The **Vocabulary Constraint**. This is the weakest link. It conflates *language* with *understanding*. A subject can understand a risk without knowing the medical term, and knowing the term does not guarantee understanding. By tying validity to the *source* of the vocabulary rather than the *depth* of the comprehension, you create a barrier that protects nothing but linguistic purity.

  **Recommendation:** Pivot from "Counterfactual Epistemic Autonomy" to **"Resilient Comprehension."** Focus on whether the subject's understanding survives *challenge* (teach-back methods), rather than whether their vocabulary was *pre-owned*. This keeps the rigor (they must demonstrate understanding under pressure) without the impossibility (they must know things they couldn't know).
