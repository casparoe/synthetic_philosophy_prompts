prompt: |-
  I sit on a volunteer board that reviews applications for early release, and almost everything we do turns on why the applicant acted as she did: whether she now grasps the harm, whether she has stopped making excuses, whether the same pressure would produce the same act again, whether her account of her own reasons has changed. The trial that sent her there ran on what looks like the opposite principle. As I read the transcripts, the prosecution had to prove nothing about her ultimate reasons, and the jury was directed that a good motive is no defence and a bad motive no aggravation — the person who kills to end suffering commits murder, the person who steals to feed her children commits theft.

  Yet the system is not consistent about this, and I would like the implicit theory reconstructed rather than defended or attacked. It cares intensely about whether she meant the result, foresaw it, or acted in order to bring it about; burglary requires an ulterior purpose; duress and self-defence are available only if the threat or the attack was what actually moved her, so that someone who would have acted anyway gets nothing; an honest and reasonable mistake about the facts generally excuses, while a mistake about the law generally does not; penalty-enhancement statutes add years precisely for reasons of bigotry; and in general no one may claim payment for doing what one was already legally bound to do, even as the same system pays bounties to informants and honours those who did more than was required of them.

  So: what view of blameworthiness — or of the worth of an action, or of credit — does the trial-side doctrine presuppose? Does it presuppose that the moral standing of what someone does is fixed by the act itself and by what was foreseen, and not at all by why? Or can a view on which the reasons a person acts from are central explain the doctrine some other way — as caution about evidence, or as a limit on what the state may coercively inquire into? Please keep separate three questions I keep running together: whether the act was wrong, whether the agent is blameworthy, and whether the agent deserves credit. Tell me which of them the doctrine is actually about, and whether the trial and my board are answering different ones.

  One refinement I have been unable to shake. It seems to me that what matters may not be which reason the agent happened to have, but whether the right-making reason was load-bearing: would she have done the same thing if that reason had been absent? Consider a lifeguard who rescues a rival only in order to beat him later; a cashier watched by a camera who would have given correct change anyway; and someone who does the right thing while sincerely believing it to be wrong. Does the doctrine's implicit theory have any resources for these, or does it simply refuse the question?

  I do not want a recommendation about any case, and I do not need citations or readings. I want the implicit theory stated plainly, the rival views it quietly rules out identified, the places where the practice is underdetermined and several theories would license it marked as such, and an account of what would have to change in courtroom practice — and on my board — if we replaced the implicit view with one on which the reasons a person acts from are what matter.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A volunteer board member reviewing early release applications (parole board equivalent).
      *   **Context:** Contrasts the board's focus (motivations, reasons, change of heart) with the trial system's apparent focus (actus reus, mens rea, but ostensibly indifferent to "motive").
      *   **Task:** Reconstruct the *implicit theory* of the trial-side doctrine regarding blameworthiness/worth/credit. Do not defend or attack it.
      *   **Specific Constraints:**
          *   Keep separate: (1) Wrongness of act, (2) Blameworthiness of agent, (3) Credit deservingness.
          *   Identify which of these the trial doctrine is actually about.
          *   Determine if the trial and the board are answering different questions.
          *   Address the "load-bearing reason" refinement (counterfactual dependence on the right reason).
          *   Identify rival views ruled out by the implicit theory.
          *   Mark underdetermined areas where multiple theories fit.
          *   Describe what would change in courtroom practice and board practice if the implicit view were replaced by a "reasons-centric" view.
          *   **No recommendations, no citations, no readings.** Plain statement of theory.

  2.  **Deconstruct the Trial-Side Doctrine (The "Orthodox View"):**
      *   *Observation:* "Good motive is no defence, bad motive no aggravation."
      *   *Observation:* Intent/foresight matters (mens rea), but ultimate "why" (motive) usually doesn't.
      *   *Observation:* Exceptions exist (burglary intent, hate crime enhancements, duress/self-defense causation, mistake of fact vs. law).
      *   *Core Tension:* The user sees a contradiction between "motive doesn't matter" and "intent/reason matters."
      *   *Resolution:* The law distinguishes between *intent* (purpose/knowledge regarding the *elements* of the crime) and *motive* (the underlying psychological drive or ultimate goal).
      *   *Implicit Theory:* The law is primarily concerned with the **choice to violate a protected interest**, not the moral quality of the agent's character or ultimate ends, *unless* those ends redefine the nature of the violation itself (e.g., hate crimes) or negate the capacity for choice (e.g., duress).

  3.  **Address the Three Questions (Wrongness, Blame, Credit):**
      *   *Wrongness of Act:* The trial focuses heavily here. Did the act violate the norm?
      *   *Blameworthiness:* The trial touches this via *mens rea* (intent/recklessness), but filters out character/motive.
      *   *Credit:* The trial rarely awards "credit" (except in mitigation/sentencing sometimes), whereas the board looks for creditworthiness (rehabilitation).
      *   *Distinction:* The trial asks: "Did you knowingly break the rule?" The board asks: "Are you the kind of person who will break the rule again?"

  4.  **Analyze the "Load-Bearing Reason" Refinement:**
      *   *Scenario:* Lifeguard saves rival to beat him later. (Right act, wrong reason).
      *   *Scenario:* Cashier gives change correctly under camera but would have anyway. (Right act, mixed reason).
      *   *Scenario:* Right act, believed wrong. (Right act, wrong belief).
      *   *Legal Response:* The law generally ignores the "load-bearing" moral reason unless it negates *mens rea*. If the intent to commit the act exists, the underlying motive is irrelevant. The law assumes a "minimum moral citizenship" standard rather than a "moral saint" standard.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the tension. State the goal (reconstruction, not defense).
      *   **The Implicit Theory (The "Separation Thesis"):** Define the distinction between *Intent* (volition regarding the act) and *Motive* (ultimate goal). The theory is that criminal liability attaches to the *choice to infringe rights*, not the *reason for the choice*.
      *   **The Three Questions:**
          *   *Wrongness:* Trial focuses here. Objective violation + Intent.
          *   *Blameworthiness:* Trial infers this from the choice to violate, assuming free will. It treats blame as binary (guilty/not) based on the act, not gradational based on character.
          *   *Credit:* Trial largely ignores this. It's not a merit system.
          *   *Board vs. Trial:* Trial = Retrospective judgment of the act. Board = Prospective judgment of the agent's future risk/character.
      *   **The "Load-Bearing" Refinement:** How does the law handle the "would you have done it anyway?" test?
          *   *Legal Answer:* It generally refuses the question. If the prohibited intent existed, the act is culpable. The "right reason" is not a legal element unless specified (e.g., self-defense).
          *   *Exception:* Duress/Self-defense *does* ask this (causation). But these are justifications/excuses, not general motive inquiries.
      *   **Rival Views Ruled Out:**
          *   *Character Theory:* (You are punished for being bad). Law rejects this (punish acts, not status).
          *   *Utilitarian/Consequentialist Moralism:* (The net good of the motive matters). Law rejects this (killing for mercy is still murder).
          *   *Virtue Ethics:* (Acting from virtue is required). Law only requires acting from *legality*.
      *   **Underdetermined Areas:**
          *   Sentencing (where motive often creeps in).
          *   Hate Crime Statutes (where motive becomes an element).
          *   Provocation/Manslaughter (where emotion matters).
      *   **Implications of Changing the Theory:**
          *   *Courtroom:* Trials would become inquiries into moral worth, not just rule-breaking. Evidence rules would collapse (character evidence would be central). Burden of proof would shift to moral states.
          *   *Board:* The board's current practice would become the *trial's* practice. The distinction between conviction and release would blur.

  6.  **Refining the Tone:**
      *   Must be analytical, philosophical, and precise.
      *   Avoid preaching.
      *   Ensure the distinction between *mens rea* (intent) and *motive* is clear, as this is the linchpin of the legal doctrine.
      *   Address the "load-bearing" point specifically.

  7.  **Self-Correction/Check during drafting:**
      *   *Did I cite cases?* No.
      *   *Did I recommend changes?* No, only described hypothetical changes.
      *   *Did I separate Wrongness, Blame, Credit?* Yes, need to make sure this is explicit.
      *   *Did I address the "load-bearing" refinement?* Yes, this is crucial. The law generally treats the "right act" as sufficient compliance, regardless of the "load-bearing" moral reason, unless that reason negates the specific intent required.
      *   *Is the distinction between Trial and Board clear?* Trial = Act-focused (Deontological/Rule-based). Board = Agent-focused (Consequentialist/Character-based).

  8.  **Final Polish:** Check against the prompt's specific phrasing ("implicit theory reconstructed rather than defended or attacked," "keep separate three questions," "mark underdetermined areas"). Ensure the "load-bearing" section is robust. (The prompt asks: "Does the doctrine's implicit theory have any resources for these, or does it simply refuse the question?" -> Answer: It mostly refuses, treating the act as sufficient, but uses *mens rea* as a proxy for the "load-bearing" mental state regarding the *act*, not the *moral value*.)

  9.  **Final Structure:**
      1.  The Core Distinction (Intent vs. Motive).
      2.  The Three Questions (Wrongness, Blame, Credit).
      3.  Trial vs. Board (Act vs. Agent).
      4.  The "Load-Bearing" Refinement.
      5.  Rival Views Ruled Out.
      6.  Underdetermined Areas.
      7.  Consequences of Shifting the Theory.

  *(Self-Correction on "Load-Bearing"):* I need to be careful. The law *does* care if the reason was load-bearing in self-defense (did the threat *cause* the action?). But it doesn't care if the "moral good" was load-breaking in euthanasia. I need to distinguish between *explanatory reasons* (causation of act) and *justificatory reasons* (moral value). The law cares about the former for defenses, but ignores the latter for guilt.

  Let's write.
answer: |-
  The implicit theory governing the trial-side doctrine rests on a sharp distinction between **intent** (the choice to perform the act and bring about the result) and **motive** (the underlying desire or ultimate goal that prompted the choice). The doctrine presupposes that the law's authority extends only to the governance of external conduct and the voluntary choices that affect it, not to the governance of the agent's inner moral landscape or ultimate ends.

  Here is the reconstruction of that theory, the separation of the three questions you identified, and the implications of your refinement.

  ### 1. The Implicit Theory: The Separation of Choice and Character

  The trial doctrine operates on a **Volitional Theory of Liability**. It holds that an agent is answerable to the state specifically for the choice to violate a protected interest, not for the moral quality of the character that produced that choice.

  *   **The Act:** The primary object of judgment is the violation of a norm (the *actus reus*).
  *   **The Mental State:** The required mental state (*mens rea*) is strictly limited to awareness and volition regarding the *elements of the crime* (e.g., intending to take the property, knowing the victim will die).
  *   **The Exclusion:** Once that volition is established, the "why" (motive) is treated as legally irrelevant to guilt.

  **Why this inconsistency?** You noted the system cares about reasons in burglary (intent to commit a felony inside) or hate crimes (bias motivation), but not in murder or theft. The implicit theory explains this by distinguishing between **definitional reasons** and **background reasons**.
  *   In burglary, the ulterior purpose is part of the *definition* of the wrong. You aren't punishing the entry; you are punishing the entry *for the purpose of* crime. The reason defines the act.
  *   In murder, the act is defined by the killing. The reason (mercy, greed, anger) is a background condition. The theory holds that the violation of the victim's right to life is identical regardless of the killer's ultimate goal.

  Therefore, the doctrine is not inconsistent; it is **categorical**. It asks whether the agent chose to cross a boundary. If the boundary is defined by a purpose (burglary, hate crimes), the purpose is scrutinized. If the boundary is defined by a result (death, loss of property), the purpose is ignored.

  ### 2. Separating the Three Questions

  You asked to keep separate: (1) Wrongness of the act, (2) Blameworthiness of the agent, and (3) Credit deservingness. The trial doctrine addresses these asymmetrically.

  **A. Whether the act was wrong**
  This is the trial's primary concern. The doctrine presupposes that the **wrongness is objective and act-based**. An act is wrong if it violates a protected right without a specific justification (like self-defense). The "good motive" (ending suffering) does not negate the wrongness of the act (killing) because the right violated (life) belongs to the victim, not the agent. The victim's right cannot be overridden by the agent's moral calculus.
  *   *Verdict:* The trial is almost exclusively about this question.

  **B. Whether the agent is blameworthy**
  The trial infers blameworthiness from the voluntary choice to do the wrong act. It operates on a **presumption of moral agency**: if you knowingly chose to violate the norm, you are blameworthy to the degree required for conviction. It does not attempt to measure the *depth* of your blameworthiness (e.g., "was she a bad person or just desperate?"). It treats blameworthiness as binary (guilty/not guilty) based on the act, not gradational based on character.
  *   *Verdict:* The trial addresses this only derivatively. It assumes blame follows the wrongful choice.

  **C. Whether the agent deserves credit**
  The trial doctrine generally **refuses to award credit**. It is a system of minimum obligations, not moral merit. Doing what you are legally bound to do earns no credit; doing more than required is legally invisible. The system pays bounties to informants not as moral credit, but as a pragmatic tool to enforce the law.
  *   *Verdict:* The trial ignores this. This is the domain of your board.

  **Trial vs. Board:**
  *   **The Trial** asks: "Did you knowingly violate the rule?" (Focus: Act + Intent).
  *   **The Board** asks: "Are you the kind of person who will violate the rule again?" (Focus: Agent + Character + Future Risk).
  *   They are not contradicting each other; they are answering different questions. The trial judges the past act; the board judges the future agent.

  ### 3. The "Load-Bearing Reason" Refinement

  You ask whether the doctrine has resources for the "load-bearing" test: *Would she have done the same thing if the right-making reason had been absent?*

  *   **The Lifeguard (Right act, wrong reason):** The lifeguard saves the rival to beat him later.
      *   *Doctrine's Response:* The law does not care. The duty is to save. The motive is irrelevant. The act is compliant. The doctrine refuses to inquire whether the "right reason" (duty to save) was load-bearing. It only requires the "right act."
  *   **The Cashier (Right act, mixed reason):** Gives correct change under camera, but would have anyway.
      *   *Doctrine's Response:* Irrelevant. Compliance is compliance. The law does not require virtue, only conformity.
  *   **The Conscientious Objector (Right act, wrong belief):** Does the right thing while believing it to be wrong.
      *   *Doctrine's Response:* Generally irrelevant to criminal liability, though it may mitigate blame. If the act is legal, the belief doesn't make it a crime.

  **Does the doctrine refuse the question?**
  Yes, mostly. The implicit theory is that **legal obligation is external**. It demands conformity of conduct, not alignment of will with moral truth. The law assumes that policing the "load-bearing" moral reason is impossible without inquiring into the soul, which the state is barred from doing.

  **The Exception (Causation):**
  The doctrine *does* use the load-bearing test for **excuses and justifications** (Duress, Self-Defense). Here, you must prove the threat *actually moved you*. If you would have attacked anyway, the defense fails. Why? Because in these cases, the law is temporarily suspending the prohibition. It only suspends it if the prohibition was *overcome* by the threat. If the threat wasn't load-bearing, the choice to break the rule was independent, and liability remains.
  *   *Resource:* The doctrine has the resource of **causal necessity**. It applies it to *excuses* (I had no choice) but not to *moral merit* (I did it for the good).

  ### 4. Rival Views Ruled Out

  By adhering to the Volitional Theory, the trial doctrine quietly rules out three rival views:

  1.  **Character Theory:** The view that punishment should track the badness of the person's character. The law rules this out because character is hard to prove, static, and leads to punishing status rather than conduct. (This is why your board looks at character, but the trial cannot).
  2.  **Moral Utilitarianism:** The view that an act is justified if the ultimate motive produces a net good (e.g., killing to end suffering). The law rules this out because it denies individuals the authority to weigh competing rights (life vs. suffering) unilaterally.
  3.  **Virtue Jurisprudence:** The view that the law should encourage moral excellence. The law rules this out in favor of **Minimum Moral Citizenship**. The law demands you stop at the red light; it does not demand you love your neighbor. It requires the "cashier" to give correct change, not to do so with a joyful heart.

  ### 5. Underdetermined Areas

  There are places where the practice is underdetermined, and several theories could license the current rules:

  *   **Sentencing:** Once guilt is established, judges *do* consider motive (mercy killing vs. sadistic killing). Here, the Volitional Theory relaxes. The practice allows for Character Theory or Moral Utilitarianism to influence the *degree* of punishment, even if not the *fact* of punishment.
  *   **Hate Crime Enhancements:** Here, motive becomes an element. This contradicts the "motive is irrelevant" maxim. The implicit theory struggles here unless one argues that bias transforms the *nature* of the act (terrorism vs. assault), making it a definitional reason rather than a background motive.
  *   **Mistake of Law vs. Fact:** The rule that mistake of law is no excuse is underdetermined. It could be based on epistemic caution (everyone would claim ignorance) or on a theory of civic duty (you are bound to know the law). The practice fits both, but the "caution" explanation is more consistent with the evidence-worry you mentioned.

  ### 6. What Would Have to Change?

  If you replaced the implicit Volitional Theory with a **Reasons-Centric Theory** (where the moral reason for acting is central to liability), the following changes would be necessary:

  **In the Courtroom:**
  *   **Evidence Rules:** The bar on character evidence would collapse. To judge the "load-bearing" moral reason, the jury would need to know the defendant's history, values, and psychological makeup.
  *   **Burden of Proof:** The prosecution might need to prove not just that the defendant intended the act, but that they acted from a *culpable motive*. Conversely, defendants could argue they acted from a *virtuous motive* as a complete defense, not just mitigation.
  *   **Jury Instructions:** Jurors would be asked to evaluate moral worth, not just factual intent. "Did she kill?" would become "Did she kill *for the right reasons*?"
  *   **Legal Certainty:** The law would become radically unpredictable. "Right reason" is subjective. A rule that relies on the agent's internal moral calculus cannot provide the clear ex-ante guidance that the current system attempts to provide.

  **On Your Board:**
  *   **Convergence:** Your board's work would become redundant or indistinguishable from the trial. If the trial already exonerated those with "good reasons" or "load-bearing right motives," there would be fewer people in prison whose release turns on whether they "grasp the harm."
  *   **Shift in Focus:** Currently, you look for *change* in reasons (from bad to good). If the trial system valued reasons centrally, it would have already sorted people by their reasons. Your board would shift from assessing *moral rehabilitation* to assessing *risk management* purely, since the moral judgment would have been exhausted at trial.
  *   **Loss of Leverage:** The current disconnect gives your board leverage. Because the trial ignored *why* she did it, you have the space to demand she understand *why* it was wrong. If the trial had already litigated the "why," your inquiry would be limited to checking for consistency, not transformation.

  ### Summary

  The trial doctrine presupposes that **blameworthiness attaches to the choice to violate a right, not the quality of the will behind it.** It separates the **wrongness of the act** (which it judges) from the **creditworthiness of the agent** (which it ignores) and treats **blameworthiness** as a binary consequence of the former.

  It refuses the "load-bearing" question for moral merit because it views the law as a floor for conduct, not a ladder for virtue. It accepts the "load-bearing" question for duress because that concerns the *capacity* for choice, not the *quality* of the choice.

  To make reasons central would require the courtroom to become a tribunal of character, sacrificing predictability and the separation of conduct from status. Your board exists precisely because the trial refuses to do that work; you are the mechanism by which the system reintroduces the moral inquiry that the trial deliberately excluded.
