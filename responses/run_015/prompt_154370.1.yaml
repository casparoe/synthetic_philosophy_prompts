answer: |-
  To build a theory that serves the plot rather than stifling it, you need to separate the question of *why obey at all* from the question of *when to break*. A theory of political obligation must explain the default setting; an account of civil disobedience must explain the exception. If you conflate them, your characters will sound like they are reading from the same textbook.

  For political obligation, the non-negotiable requirement is **particularity**. The theory must explain why the duty is owed to *this* state and not any other reasonably decent one. This is the trap for Character D. If the obligation arises merely from receiving benefits (security, roads), D owes it just as much as a voter. If it arises from consent or membership, D might be exempt. You do not need to solve this philosophically, but your plot must acknowledge it: if D is a hero, the theory you lean on must value residence and contribution over formal consent. If D is a pain, the theory should highlight that D accepts the benefits of registration (protection, work) while refusing the cost. For the eighteen-month jump, the obligation hinges on whether the duty is to the *regime* or the *order*. If the duty is to the constitutional order, M and K are still bound despite the government change; if it is to the specific authority that enacted the law, the debt may be discharged. Prior compliance matters only if the obligation is cumulative (fair-play); if it is based on current justice (natural duty), past obedience buys no credit.

  For civil disobedience, the theory must distinguish between **conscientious evasion** and **public protest**. This is the divide between M and K. M acts covertly to protect her son; K acts overtly to make a point. A robust account does not demand publicity if publicity means death, but it does demand that the actor accepts the *risk* of discovery. If M hides her son but claims she is changing the law, she is a hypocrite; if she hides him and accepts she is breaking the rules to save a life, she is acting on a higher duty. Regarding your character who is sixty per cent sure: the theory must allow action on **reasonable judgement**, not certainty. If you require certainty, no one ever resists. The risk of being wrong lies with the agent, not the state. This is where the drama lives: the character acts on a moral gamble. If they are right, they are a hero; if wrong, they are a criminal. The theory cannot insure them against error.

  On your specific doubts: the "why this lot" question is not merely a prejudice; it is the particularity problem, and it is fatal to any theory that relies solely on general morality. You must keep "the law is valid" apart from "you must obey it." A law can be legally valid but morally non-binding; conflating the two makes N's leak inexplicable. Regarding the aftermath, a theory of obligation need not dictate the penalty, but an account of disobedience should. K, who writes to say what she has done, invites the penalty to prove her sincerity. M, who tells nobody, rejects the penalty to ensure success. Neither is inherently superior, but they signal different ends: K wants reform; M wants survival. As for sacrifice, the threshold must be **integrity**, not inconvenience. K cannot withhold tax because the form is annoying; she withholds it because paying makes her complicit in something she cannot stomach. M does not hide her son because she dislikes the army, but because sending him would violate a fundamental duty of care.

  You asked about the union directive. This is authority generally, not law specifically. The dynamics are similar but the stakes differ. Defying a union is a breach of contract or association; defying a state is a breach of sovereignty. You can use the same moral logic (conscience over rule), but the state holds the monopoly on violence, which raises the stakes for M and D. Emigration is a red herring for M. If she cannot leave due to caring for her mother, she is not free to exit the social contract. A theory that says "just leave if you don't like it" fails the test of reality. M is bound by necessity, which strengthens her claim to resist: she has no exit, so her voice must be heard, or her hands forced.

  Here is the conflict you suspected: you cannot have both **content-independence** (obey because it is the law, regardless of what it says) and a **justice constraint** (never obey if it requires serious injustice). They are mutually exclusive. If authority is absolute, it binds even when wrong. If justice is the limit, authority is conditional. You are right that "must give clear first-personal guidance" fights with "mustn't tell the agent to defer." If the theory tells the agent to defer to the state, it removes the burden of judgement. If it tells the agent to judge, it risks anarchy. The only way to resolve this in fiction is to show the cost of that judgement. The character who judges for herself must bear the consequence of being wrong.

  The single requirement that knocks out the most candidates is the **Justice Constraint**: *No political obligation can require complicity in serious injustice.* This is the line for your barrister. It destroys the "order is order" argument (N's oath), it complicates the "fair-play" argument (K's tax), and it vindicates the "natural duty" argument (M's son). It forces every character to define what counts as 'serious injustice'. For N, is a memo enough? For K, is one programme enough? For M, is conscription enough? That is where your scenes live.

  As for the four accounts you mentioned:
  **Consent** fails D immediately, as she never voted or agreed, but it traps N, who swore an oath.
  **Fair-play** catches K, who takes the state's benefits while refusing the specific cost, making her look like a free-rider.
  **Natural-duty** saves M, as the duty to protect her child overrides the duty to the state, but it offers little for N or K.
  **Associativist** works for N (role obligations) and perhaps D (social membership), but struggles to explain why the association's rules can be broken.
