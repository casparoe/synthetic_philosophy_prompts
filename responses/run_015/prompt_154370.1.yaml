prompt: |-
  I'm writing a novel and I've got myself into a hole. Three characters break the same law in the same year, and I want the reader to feel that one of them is a hero, one is a pain in the neck, and one is just a criminal — but every time I try to say why, I end up writing a line of dialogue that sounds like a seminar. So I want the spec first, before I commit to any more scenes.

  Give me the desiderata: what a theory of political obligation has to deliver, and separately what an account of civil disobedience has to deliver, if its supposed to be good enough for a character to use in first person *and* good enough for me to plot with. For each requirement, the case that motivates it — ideally one of these, since they're the scenes I actually have:

  N, a mid-level official who swore an oath and then leaks the internal memo; D, who has no vote, no passport and no plausible claim to have consented to anything, has lived here nineteen years, works, pays tax, and refuses to register for the thing everyone has to register for; M, who hides her son the night before he's due to report and tells nobody; K, who pays every tax except the slice that funds one programme, and writes to say so. And then the same law eighteen months later, after the government has changed twice: I need to know whether M and K still owe the same thing, and whether the fact that they complied for a while changes what they owe now.

  Things I specifically want your view on. Whether an account really has to answer the "why this lot and not any other reasonably decent state" question, or whether that's just a prejudice of one camp. Whether it has to keep "the law is valid" apart from "you have to obey it". Whether it has to handle the character who is only about sixty per cent sure the law is unjust, whether "you're permitted to act on your judgement" and "you're judgement is right" come apart, and who carries the risk of being wrong. Whether what makes D's refusal disobedience rather than crime is the publicity, the willingness to take the penalty, or the fact that it's addressed to an audience — and whether an account that demands all three quietly rules out resistance in places where going public gets you killed. Whether it has to say what the character owes afterwards — a trial, an apology, repair, keeping the rest of the law — or whether that's beyond what a theory of obligation is for. How much sacrifice is enough: I don't want a theory that requires my characters to be saints, but I don't want one that lets K off because the form was annoying. Whether it has to distinguish the person who pays, the one who drives the lorry and the one who votes, or whether they're all equally implicated. Whether emigrating discharges the thing, given that M can't leave because she's caring for her mother. And whether any of this is about law specifically or about authority generally — one of my subplots is a character defying a union directive and I don't know if that's the same animal.

  Then the part I care about most: which requirements are non-negotiable and which are just what one camp happens to like, and flag any pair you think can't be jointly met. I've got a suspicion that "must bind even when you think the requirement is wrong, because that's what authority is" and "must never require you to abet something seriously unjust" can't both survive, and that "must give clear first-personal guidance" fights with "mustn't tell the agent to defer when she's probably right". Tell me if I'm wrong. And say which single requirement knocks out the most candidates — that's the one I'll put in the mouth of my barrister.

  No long scorecard: a couple of lines each at the end on consent, fair-play/benefit, natural-duty and associativist accounts is plenty, and skip anything that needs a library. British English throughout (judgement, colour, defence), and prose rather than a wall of headings — I'm a novelist, I'll notice.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** The user is writing a novel with three characters breaking the same law. They need a theoretical framework (political obligation/civil disobedience) that works for *plotting* and *character voice* (first-person), without sounding like a seminar.
      *   **Characters/Scenarios:**
          *   N: Mid-level official, swore oath, leaks memo.
          *   D: No vote/passport, 19 years resident, pays tax, refuses registration.
          *   M: Hides son from conscription/reporting, tells nobody.
          *   K: Pays all tax except slice funding one programme, writes to say so.
          *   *Time Jump:* Same law 18 months later, government changed twice. Do M and K still owe compliance? Does prior compliance matter?
      *   **Specific Questions to Address:**
          *   "Why this state?" (Particularity problem).
          *   Validity of law vs. Duty to obey.
          *   Uncertainty (60% sure law is unjust).
          *   Permission to act vs. Correctness of judgement (Risk bearing).
          *   Publicity/Penalty/Audience (Defining civil disobedience vs. crime, especially under threat).
          *   Aftermath (Trial, apology, repair).
          *   Sacrifice level (Saint vs. Annoyance).
          *   Implication (Payer vs. Driver vs. Voter).
          *   Emigration (Discharge of obligation, specifically M who can't leave).
          *   Law vs. Authority generally (Union directive subplot).
      *   **Constraints:**
          *   Identify non-negotiable vs. camp-specific requirements.
          *   Flag incompatible pairs (e.g., Authority vs. Justice).
          *   Identify the single "knockout" requirement for the barrister character.
          *   Brief critique of four accounts (Consent, Fair-play, Natural-duty, Associativist) at the end (couple of lines each).
          *   British English (judgement, colour, defence).
          *   Prose style (not a wall of headings, suitable for a novelist).
          *   No long scorecard.

  2.  **Deconstruct the Theoretical Needs:**
      *   The user wants *dramatic utility*, not just philosophical accuracy. The theory must generate conflict, distinguish characters, and survive plot twists (government change).
      *   *Core Tension:* Authority demands obedience; Conscience demands resistance.
      *   *Key Distinction:* Political Obligation (why obey generally) vs. Civil Disobedience (when/why break specifically).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the trap (seminar dialogue) and set the tone.
      *   **Political Obligation Desiderata:** What does the "why obey" theory need to do for the plot?
          *   Needs to explain *particularity* (why *this* government?).
          *   Needs to separate *validity* from *obligation* (law can exist without binding conscience).
          *   Needs to handle *uncertainty* (the 60% doubt).
          *   Needs to address *complicity* (K paying tax vs. M hiding son).
          *   Needs to address *exit* (M can't emigrate).
      *   **Civil Disobedience Desiderata:** What does the "why break" theory need to do?
          *   Needs to define the *audience* (public vs. private).
          *   Needs to define *consequence* (accepting penalty).
          *   Needs to handle *risk* (who bears the cost of being wrong).
          *   Needs to handle *change* (does new government reset the debt?).
      *   **Addressing Specific Questions (integrated into the flow):**
          *   *Why this lot?* It's crucial for D. If obligation is just "any decent state," D's lack of vote matters less. If it's "this specific contract," D is exempt.
          *   *Validity vs. Obligation:* Essential distinction. A law can be legal but not binding.
          *   *Uncertainty/Risk:* Crucial for drama. If you must be 100% sure, no one acts. If action is permitted on reasonable judgement, the risk lies with the actor, not the theory.
          *   *Publicity/Penalty:* This defines M vs. K. M is covert (conscientious evasion?), K is overt (civil disobedience?). A theory demanding publicity kills M's heroism. Needs flexibility for safety.
          *   *Aftermath:* Does K owe a trial? Does M owe an apology? This determines the ending.
          *   *Sacrifice:* Needs a threshold. Inconvenience isn't enough; threat to core integrity is.
          *   *Law vs. Authority:* Union directive is analogous but distinct (voluntary association vs. coercive state).
      *   **The Conflicts (Non-negotiable vs. Camp):**
          *   *The Big Clash:* Content-independence (obey because it's the law) vs. Justice-sensitivity (don't obey if unjust). You can't have both absolute.
          *   *Guidance vs. Deference:* If the theory tells you to defer to the state, it fails the "hero" test. If it tells you to trust yourself, it risks anarchy.
          *   *The Knockout:* The "Particularity" requirement or the "Justice Constraint." Let's pick the **Justice Constraint** (no obligation to do serious wrong) as the barrister's weapon. It cuts through the "order is order" argument.
      *   **The Four Accounts (Brief):**
          *   Consent: Fails D (didn't consent).
          *   Fair-play: Fails K (benefits received but refusing cost).
          *   Natural-duty: Good for M (duty to protect son trumps state).
          *   Associativist: Good for N (oath/role), bad for D.

  4.  **Refining the Tone:**
      *   Must be prose, not a list.
      *   British spelling.
      *   Empathetic to the writer's struggle (avoiding "seminar dialogue").
      *   Direct answers to the "Things I specifically want your view on."

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the "18 months later" question? *Adjustment:* Need to ensure the theory accounts for political change. If the obligation is to the *regime*, it resets. If to the *state/constitution*, it might not.
      *   *Check:* Did I distinguish M (covert) from K (overt)? *Adjustment:* Ensure the distinction between civil disobedience and conscientious evasion is clear.
      *   *Check:* Is the "Knockout" requirement clear? *Adjustment:* Make sure the barrister's line is identifiable.
      *   *Check:* British English. (Judgement, colour, programme, defence).
      *   *Check:* Word count/Density. Keep it tight. The user said "No long scorecard."

  6.  **Final Polish:**
      *   Ensure the transition between obligation and disobedience is smooth.
      *   Make sure the "Union" question is addressed (authority generally).
      *   Verify the "60% sure" point is handled (epistemic humility).

  *(Self-Correction on the "Knockout" Requirement)*: The user asks which single requirement knocks out the most candidates. The "Particularity Problem" (why *this* state?) is the classic philosophical knockout. However, for a *barrister* in a court drama, the "Justice Constraint" (no duty to commit injustice) is more dramatic. But philosophically, Particularity is the hardest hurdle for theories like Consent. Let's go with the **Justice Constraint** as the dramatic knockout, but acknowledge Particularity as the theoretical one. Actually, the prompt asks what *I* think knocks out the most candidates. The "Content-Independence" claim (obey because it's a command, regardless of content) is usually the first thing to break under pressure. Let's frame the knockout as the demand that **obligation must survive serious moral conflict**. That kills pure positivism/authority accounts.

  *(Re-evaluating the "Knockout")*: The prompt asks: "say which single requirement knocks out the most candidates — that's the one I'll put in the mouth of my barrister."
  If the barrister is defending the character, they want the requirement that *saves* the character. If the barrister is prosecuting, they want the one that *catches* them. Assuming the barrister is arguing *for* a nuanced view (or against a rigid one), the requirement that "Obligation cannot require complicity in serious injustice" is the strongest sword. It kills the "just following orders" defence.

  Let's look at the "Conflicts" section again. "Must bind even when you think the requirement is wrong" vs "Must never require you to abet something seriously unjust." Yes, these are incompatible. I need to confirm the user's suspicion is correct.

