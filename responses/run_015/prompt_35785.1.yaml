answer: |-
  # Quiz: What Do You Actually Think Punishment Is For?

  You have intuitions about justice. But do those intuitions form a consistent theory? Philosophers have argued for centuries about the justification of punishment, usually dividing into camps like retributivists, consequentialists, and abolitionists. But labels are cheap. The real test is how you react when these theories collide with messy reality.

  Below are nine concrete cases. For each, choose the option that best matches your immediate moral judgment. Do not overthink it; go with your gut. At the end, use the scoring key to see which philosophical profile matches your instincts.

  ***

  ### 1. The Riot
  A violent mob is gathering in a small town, poised to lynch a minority family. The local sheriff knows he cannot stop them by force. However, if he arrests and publicly frames a homeless drifter for a crime the drifter didn't commit, the mob will disperse satisfied, and the family will be saved. The drifter will be imprisoned for life.
  *   **A.** Frame the drifter. Saving five lives is worth the liberty of one innocent man.
  *   **B.** Do not frame the drifter. It is morally forbidden to punish the innocent, regardless of the lives saved.

  ### 2. The Terminal Murderer
  A man is convicted of a brutal murder and sentenced to life in prison. After the verdict, but before he is transferred to prison, it is discovered he has an aggressive terminal cancer. He will die of natural causes in his hospital bed within two weeks. No one outside the court knows this yet.
  *   **A.** Transfer him to prison anyway. He earned the sentence, and the status of his punishment shouldn't change because of his health.
  *   **B.** Release him to die at home. Inflicting prison suffering on a dying man serves no purpose for society or the victim.

  ### 3. The Expired Debt
  A brilliant financial advisor embezzled millions from clients. She is wealthy, remorseless, and has devised a system that ensures she can never be caught again. However, due to a clerical error, her crime is discovered only after the statute of limitations has expired. Legally, she cannot be touched.
  *   **A.** Find an extra-legal way to sanction her or lobby to extend the law. She owes a moral debt that time shouldn't erase.
  *   **B.** Let it go. Reopening the case creates legal instability, and she is unlikely to offend again anyway.

  ### 4. Bad Luck
  Two men, Alex and Blake, both intend to kill their enemies. Both buy guns, stalk their victims, and fire at point-blank range. Alex's bullet hits and kills his victim. Blake's bullet is deflected by a sudden gust of wind; his victim walks away unharmed.
  *   **A.** Punish them equally. Their intentions and actions were identical; the wind is morally irrelevant.
  *   **B.** Punish Alex more severely. The actual death matters; the harm done is part of the crime.

  ### 5. The Conscientious Protest
  A climate activist blocks a major highway, breaking the law to draw attention to an existential threat. She is caught, admits her guilt, and argues that her action was morally justified to save future lives. She accepts the legal consequences as part of her democratic duty.
  *   **A.** Punish her fully. If we allow individuals to decide which laws to obey, social order collapses.
  *   **B.** Waive the penalty. If her action was morally right, punishing her is an injustice.
  *   **C.** Convict her but impose a symbolic sentence. This acknowledges the law was broken while respecting her moral voice.

  ### 6. The Psychopath
  A violent individual has committed several assaults. Psychiatric evaluation confirms he is a psychopath: he understands the rules but lacks the capacity to feel empathy or understand moral reasons. He is dangerous.
  *   **A.** Confine him indefinitely. Society must be protected from dangerous people, regardless of their internal mental state.
  *   **B.** Do not punish him. You cannot morally blame someone who lacks the capacity to understand moral obligations.

  ### 7. The Repentant Driver
  A drunk driver kills a pedestrian. He is deeply remorseful, has quit drinking, and is undergoing voluntary therapy. Experts agree he poses zero risk of reoffending. He is suffering immensely from guilt.
  *   **A.** Prison is still required. Internal remorse does not cancel the external debt owed to justice.
  *   **B.** No prison. He has already punished himself psychologically, and therapy is more useful than incarceration.

  ### 8. The Neighborly Dispute
  Two neighbors get into a fight; one assaults the other. The victim does not want the assailant jailed. He wants an apology, community service, and restitution. They agree to a restorative plan.
  *   **A.** The state must prosecute anyway. Crimes are offenses against the public order, not just private wrongs.
  *   **B.** If the victim is satisfied and the assailant makes amends, the state should step back. Repair matters more than penalty.

  ### 9. The Systemic Theft
  A person steals food from a corporate chain store. Investigation reveals they did so solely because they were starving in a society where social safety nets have completely collapsed. They are otherwise law-abiding.
  *   **A.** Punish the theft. Individual responsibility exists regardless of social background; otherwise, no one is accountable.
  *   **B.** Refuse to punish. When social conditions are fundamentally unjust, the state loses the moral standing to penalize survival crimes.

  ***

  ## Scoring Key

  Tally your answers. You likely won't have a perfect score in one column; look for the column where you have the most matches.

  | Question | **Profile C** (Consequentialist) | **Profile R** (Retributivist) | **Profile K** (Communicative/Expressive) | **Profile J** (Restorative/Abolitionist) |
  | :--- | :---: | :---: | :---: | :---: |
  | **1. Riot** | A | B | B | B |
  | **2. Terminal** | B | A | A/B | B |
  | **3. Expired** | B | A | A | B |
  | **4. Luck** | A/B* | B | A | A |
  | **5. Protest** | A | A | C | B |
  | **6. Psychopath** | A | B | B | B |
  | **7. Repentant** | B | A | C | B |
  | **8. Neighbor** | A | A | C | B |
  | **9. Systemic** | A | A | A | B |

  *\*Note on Q4: Consequentialists often split here depending on whether they think harsher punishment for the killer yields better deterrence.*

  ### Your Philosophical Profile

  **Mostly Profile C: Forward-Looking Consequentialism**
  You view punishment as a tool. Its only justification is what it *achieves*: deterring crime, incapacitating dangerous people, or rehabilitating offenders. If punishing someone doesn't produce a net social good (like in the Terminal Murderer or Repentant Driver cases), you see it as cruelty.
  *   *Sub-type:* If you chose **A** on the Psychopath case, you lean toward **Incapacitation**. If you chose **B** on the Repentant Driver, you lean toward **Rehabilitation**.

  **Mostly Profile R: Retributivism**
  You view punishment as a matter of desert and duty. The guilty *deserve* to suffer, and the innocent *must not* be punished, regardless of consequences. You likely chose to punish the Terminal Murderer and the Expired Embezzler because the moral debt exists independently of future utility. You prioritize the "Negative Retributive" constraint (never punish the innocent) over utilitarian gains.
  *   *Note:* If you chose **B** on the Bad Luck case, you are a **Retributivist about Harm**. If you chose **A**, you are a **Retributivist about Intent**.

  **Mostly Profile K: Expressivist or Communicative Theory**
  You see punishment as a language. It is a way for the community to condemn wrongdoing and invite the offender back into the moral fold. This is why you might punish the Civil Disobedient (to engage in dialogue) but treat the Repentant Driver differently (the message has been received). You often straddle the line between Retributivism and Consequentialism.
  *   *Overlap Warning:* This view often collapses with **Positive Retributivism**. Both demand punishment for the guilty. The difference is subtle: Retributivists punish because the universe demands balance; Expressivists punish to communicate societal blame. In practice, your answers likely look identical to Profile R, except in cases involving dialogue (like the Protest or Repentant cases).

  **Mostly Profile J: Restorative Justice or Abolitionism**
  You question the state's right to inflict pain. You focus on the victim's needs and the social conditions that created the crime. You are willing to forgo punishment if repair is achieved (Neighbor case) or if the system itself is illegitimate (Systemic Theft case).
  *   *Overlap Warning:* This view is hard to distinguish from **Rehabilitative Consequentialism** in the quiz. Both reject prison for the Repentant Driver. The difference is that Rehabilitators want to *fix* the offender for society's sake, while Restorative advocates want to *heal* the relationship for the community's sake.

  ### Logical Space: The Unoccupied Cell
  There is one coherent position that almost no philosopher holds: **Positive Retributivism without Negative Retributivism.**
  This view holds that the guilty *must* be punished (a duty), but it is *permissible* to punish the innocent if it produces good consequences.
  *   *Why it's empty:* Historically, anyone who believes the guilty deserve punishment usually believes desert is a right that implies a corresponding constraint against punishing the non-deserving. To claim we have a duty to inflict suffering on the guilty, but no constraint against inflicting it on the innocent, creates a moral asymmetry regarding pain that few can defend.

  ### Limitations of This Quiz
  *   **Expressivism vs. Retributivism:** As noted, these often yield the same verdicts. The quiz tries to separate them via the Civil Disobedient case, but in the real world, these theories are often hybridized.
  *   **Restorative vs. Rehabilitation:** Both oppose harsh prison sentences for low-risk offenders. Distinguishing them requires asking *why* you oppose it (healing relationships vs. fixing behavior), which is harder to capture in multiple-choice options.

  ### Editor's Note: If You Need to Cut a Question
  **Cut Question 3 (The Expired Debt).**
  *   **Why:** It tests the same philosophical muscle as Question 2 (The Terminal Murderer). Both ask whether "desert" survives when forward-looking benefits (deterrence, incapacitation) are nullified. Question 2 is more visceral and easier for readers to grasp immediately. Question 3 adds nuance regarding legal statutes vs. moral debts, but if you need to shorten the quiz, Question 2 does the heavy lifting for the "Desert vs. Consequence" distinction more efficiently.
