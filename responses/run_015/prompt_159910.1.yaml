  *   **Part (b):** This is a known "trap" in the literature (Agreement vs. Pooling). The student fell for it completely. The counterexample provided in the model answer is the standard "parity" example and should be expected at the graduate level.
  *   **Part (c):** The student treated the rounding function as an invertible code. This is a category error (coding theory vs. imprecise measurement). The mark reflects the fundamental failure to identify that the theorem's premises are violated.
