              *   Round 2: A1 knows A2 said 0.5. A1 knows state is in $\{1, 2\} \cap \{1, 3\} = \{1\}$? No.
              *   Let's check the GP dynamics.
              *   Actually, there is a simpler standard counterexample regarding "pooling."
              *   Consider $\Omega = \{a, b, c, d\}$. Uniform prior. $E = \{a, b\}$.
              *   $P_1 = \{\{a, b\}, \{c, d\}\}$.
              *   $P_2 = \{\{a, c\}, \{b, d\}\}$.
              *   State $a$.
              *   $q_1 = 1$. $q_2 = 0.5$.
              *   If they announce:
