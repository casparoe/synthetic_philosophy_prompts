              *   In this specific case, it *does* pool.
              *   *Need a case where it doesn't.*
              *   The standard counterexample involves a case where the posteriors become common knowledge *before* the partitions are fully refined to the join.
              *   Example: $\Omega = \{1, 2, 3, 4\}$. Uniform. $E = \{1, 4\}$.
