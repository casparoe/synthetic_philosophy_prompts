answer: |-
  You have put your finger on one of the most sophisticated critiques in contemporary memory studies. You are describing the transition of remembrance from a **critical practice** into a **legitimizing resource.**

  There isn't one single dictionary word for this, but there is a specific constellation of concepts in political theory and critical memory studies that map exactly onto what you're seeing. The most precise term for the mechanism you described is **Mnemonic Immunization**, often operationalized through **Commemorative Closure**.

  Here is the breakdown of the concept, the edges you asked for, and how it applies to your examples.

  ### 1. The Name of the Phenomenon

  While "hypocrisy" is the moral judgment, the structural mechanism has a few names depending on which scholar you ask:

  *   **Mnemonic Immunization:** This matches your intuition perfectly. By inoculating the national body with a controlled dose of "guilt" (museums, holidays, curricula), the society develops antibodies against further critique. Once you have "done" the memory work, you are immune to accusations that the present structure is continuous with the past.
  *   **Commemorative Closure:** The idea that remembrance is a task with a finish line. Once the memorial is built or the apology issued, the account is settled. This turns justice into a transaction rather than a transformation.
  *   **The Legitimation Function of Memory:** In political science, this describes when states use acknowledgment of past wrongs to bolster their current moral authority. "We admit we were bad then, which proves we are good now, so trust our current policies."
  *   **Adorno's Warning:** Theodor Adorno actually predicted this in his 1959 lecture *"What Coming to Terms with the Past Means."* He warned that the German term *Vergangenheitsbewältigung* (mastering/coping with the past) implies the past is a debt that can be paid off and filed away, rather than a living structural reality. He argued it was becoming a "ritualized incantation."

  ### 2. The Edges: Distinguishing the Variations

  You asked for the edges—what separates this "credit" system from denial on one side and actual justice on the other.

  #### Edge A: Vs. Simple Denial (Turkey / American South)
  *   **Denial (Turkey/South Heritage):** The strategy here is **erasure or inversion**. The past is framed as glorious, non-existent, or irrelevant. The goal is to prevent the debt from being acknowledged at all.
      *   *Mechanism:* "That didn't happen" or "That was noble."
      *   *Result:* The past remains a live wire that threatens the national identity, so it must be constantly guarded (e.g., laws criminalizing speech, defending statues).
  *   **Mnemonic Credit (Germany/Japan):** The strategy here is **compartmentalization**. The debt is acknowledged but contained.
      *   *Mechanism:* "That happened, we paid for it with this museum/curriculum, now we are even."
      *   *Result:* The past is neutralized. It becomes a badge of honor ("We are the country that remembers") rather than a call to action.

  **The Crucial Similarity:** Both achieve the same outcome: **Status Quo Preservation.** Denial protects the status quo by hiding the root. "Credit" protects the status quo by pruning the root while claiming to water it.

  #### Edge B: Vs. Actual Transitional Justice
  *   **Transitional Justice:** Is **open-ended and structural**. It asks, "What institutions allowed this, and do they still exist?" It links the past to the present (e.g., housing policy, policing, immigration). It is uncomfortable and never truly "finished."
  *   **Mnemonic Credit:** Is **closed and symbolic**. It asks, "Have we honored the victims?" It isolates the past as a moral failure of *individuals* or *a specific era*, not a structural feature of the state.
      *   *The Test:* If you mention the past to critique the present, does the memory apparatus support you or silence you?
      *   *Example:* In a Transitional Justice model, pointing out racist housing policy connects to redlining. In a Mnemonic Credit model, pointing out racist housing policy is met with, "But we have a Holocaust memorial; don't compare things."

  ### 3. Applying the Framework to Your Examples

  #### Germany: Memory Exceptionalism
  Germany is the gold standard for this. Scholars like **A. Dirk Moses** and **Michael Rothberg** critique what they call **"Memory Exceptionalism."**
  *   **The Apparatus:** Intense Holocaust education, *Stolpersteine* (stumbling stones), memorials.
  *   **The Credit:** Germany gains immense moral capital on the global stage as the "nation of remembrance."
  *   **The Immunization:** This capital is often spent to deflect critiques of current policy. For example, when critics point out Germany's treatment of refugees or its arms exports, the defense is often, "We are the most penitent nation; you cannot equate us with others." The memory of the Holocaust becomes a shield against contemporary human rights critiques. It creates a "German Special Path" (*Sonderweg*) of morality that blocks structural comparison.

  #### Japan: Fragmented Remembrance
  *   **The Apparatus:** Local peace museums (often run by activists) vs. National narrative.
  *   **The Credit:** Japan can point to the local museums to say, "We have civil society that remembers."
  *   **The Immunization:** The state maintains **Strategic Ambiguity**. By not criminalizing speech (like Turkey) but not funding national reckoning (like Germany), the state allows the "credit" to exist in the private sphere while the public sphere remains unchanged. This allows gender issues (Comfort Women) to be framed as "private tragedy" rather than "state crime," insulating the current bureaucracy from liability.

  #### The American South: Heritage as Counter-Memory
  *   **The Apparatus:** Monuments, heritage laws, school board decisions.
  *   **The Inversion:** This is **Mnemonic Defense**. Unlike Germany, which uses guilt for credit, the South uses pride for defense.
  *   **The Function:** It serves the same immunization purpose. By framing the Confederacy as "heritage" rather than "treason/slavery," it immunizes the current power structure against claims of systemic racism. If the statue is about "history," then removing it is "erasing history." It flips the script so that *anti-racism* becomes the attack on memory, rather than *racism* being the subject of memory.

  ### 4. Why This Happens (The Structural Logic)

  The reason this pattern emerges globally is that modern states need **Legitimacy**.
  1.  **Legitimacy via Progress:** "We are better than our ancestors." (Germany/Japan)
  2.  **Legitimacy via Continuity:** "We are the same noble people as our ancestors." (South/Turkey)

  Both require managing the past. The "Credit" model is actually more sophisticated than the "Denial" model because it absorbs the critique. It turns the accusation ("You were bad") into a credential ("We know we were bad, unlike those other countries").

  ### 5. Recommended Reading for the "Edges"

  If you want to dig into the theory behind this, these are the specific texts that map the territory you've identified:

  *   **Theodor Adorno, *"What Coming to Terms with the Past Means"* (1959):** The foundational critique. He argues that the phrase itself implies a desire to close the book.
  *   **Susan Neiman, *Learning from the Germans* (2019):** Directly addresses your comparison. She is optimistic about the German model, but her critics (see below) argue she misses the "immunization" effect.
  *   **A. Dirk Moses, *The Problems of Genocide* (2021):** Discusses "memory regimes" and how permanent security states use memory to justify current exclusion.
  *   **Michael Rothberg, *The Implicated Subject* (2019):** Moves beyond "victim/perpetrator" to show how we are structurally involved in past harms without needing "guilt credit."
  *   **Wendy Brown, *Regulating Aversion* (2006):** Discusses how "tolerance" and liberal recognition can actually reinforce power structures (similar to how remembrance reinforces the state).
  *   **Étienne Balibar:** Writes on how European identity is built on "anti-racism" that nonetheless excludes immigrants.

  ### Summary
  The concept you are looking for is **Mnemonic Immunization** via **Commemorative Closure**.

  It differs from **Denial** because it acknowledges the fact but neutralizes the consequence.
  It differs from **Justice** because it treats memory as a *noun* (a thing we have) rather than a *verb* (a practice that changes how we live).

  In the South, they refuse to buy the debt. In Germany, they pay the debt with symbolic currency and demand a receipt that says "Paid in Full." Both prevent the debt from being paid with structural change.
