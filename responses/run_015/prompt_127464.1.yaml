          *   *The "Because":* In control theory, causality is temporal/physical. In philosophy, it's ontological/explanatory.
          *   *Explanatory Asymmetry:* Euthyphro hinges on *priority*. In control loops, feedback is simultaneous. The "setpoint" and the "plant" interact continuously. It's hard to say one is "prior" in a cybernetic loop without breaking the loop.
      *   *The Untranslatable Residue:* The concept of *Aboutness* (Intentionality). A control system minimizes error, but does it "know" *why*? The Euthyphro dilemma asks about the *source of authority*. In control theory, authority is just gain/feedback strength. The *reason* for the gain isn't part of the math, it's part of the design spec.
      *   *Gap vs. Illusion:* Does this show cybernetics is limited, or that the philosophical question is category error?
          *   *Argument:* The philosophical question assumes a separation between "law" and "enforcer." Control theory assumes they are coupled. The residue suggests the philosophical dispute might be a "ghost in the machine" problem—looking for a controller outside the loop.

