  8.  *(Final thought on the "Gap vs. Illusion" conclusion)*: I should argue that the residue reveals that the Euthyphro dilemma presupposes a dualism (Lawgiver vs. Law) that control theory dissolves into a monism (System Dynamics). This suggests the philosophical dispute might be less substantive *if* one accepts a cybernetic ontology, but substantive if one cares about *meaning* rather than *function*. I will lean towards the idea that it reveals a category error in the philosophical framing when applied to functional systems.

