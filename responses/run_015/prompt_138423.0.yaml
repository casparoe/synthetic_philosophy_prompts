  **SUPPLEMENTARY INFORMATION:**
  **I. Findings and Purpose**
  Pursuant to the Administrative Procedure Act and the need for ontological stability, the Committee proposes this rule. The following findings support the necessity of administrative intervention in matters of logical truth:

  1.  The Thesis pairs an informal notion—what a human following explicit rules with pencil and paper could carry out—with a formally defined class. This category error resists standard adjudication yet underpins critical infrastructure. The Committee finds that leaving this gap open creates liability.
  2.  No proof is available, because any formalization of the informal side either begs the question or yields a different, genuinely provable equivalence result. Consequently, deductive closure is unattainable within current statutory limits. The Committee cannot wait for a proof that is structurally impossible.
