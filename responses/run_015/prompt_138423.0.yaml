  **Drafter's Note:**
  This satire targets three contested readings of the Church–Turing Thesis. First, the 'definition' reading (CTT is merely stipulative) is mocked by the Certification Clause, which shows stipulation cannot falsify physical hypercomputation. Second, the 'empirical' reading (CTT is a law of physics) is ridiculed by the Sunset Provision, implying physical laws require bureaucratic renewal. Third, the 'quasi-empirical' reading (CTT is justified by convergence) is lampooned by the Classification Scheme, which forces a non-deductive justification into a binary legal tier. Defenders might argue the satire is unfair: definitionalists deny CTT makes ontological claims; empiricalists argue physics doesn't need permits; quasi-empiricists claim mathematical confidence doesn't require administrative validation. The joke rests on treating methodological norms as regulatory statutes.

  Bottom line: The Church–Turing Thesis is a methodological norm governing computation, not a truth-apt proposition subject to administrative adjudication.
