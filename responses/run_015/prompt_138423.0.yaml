  5.  Settling the matter by stipulating that "computable" just means Turing-computable is a dodge rather than an answer. Semantic fiat does not resolve ontological ambiguity. However, it does resolve procurement disputes.

  **II. Proposed Rule**
  The Committee proposes to amend 45 C.F.R. § 101.1 to establish the following regulatory framework:
  (a) **Classification Scheme.** The Thesis shall be categorized within a three-tier classification scheme—settled theorem, working thesis, terminological stipulation—into which the thesis refuses to fit. Administrative convenience outweighs categorical coherence. This allows for flexible enforcement.
  (b) **Sunset Provision.** The classification is subject to a seven-year renewal requirement. Mathematical truths shall expire unless re-validated by Subcommittee vote. This ensures ongoing compliance with contemporary physics.
  (c) **Validation Protocol.** A certification clause requiring any purported counterexample, a physical hypercomputer say, to have been validated by a procedure that is itself Turing-computable. This ensures all falsifications remain within the jurisdiction of the Thesis. Paradoxical outcomes are hereby waived.

