  # The Latent Illocution: Defending Diachronic Performative Binding in Institutional Writing

  ### Introduction

  In *How to Do Things with Words*, J.L. Austin establishes that for a performative utterance to be felicitous, it generally requires a specific context, appropriate authority, and, crucially, "uptake" by an audience. This framework privileges the synchronous speech situation: the speaker and hearer co-present in time and space. However, this model struggles to account for the normative force of institutional documents addressed to no specific present audience—such as a sealed testament, a sovereign bond issued to the "bearer," or a legislative act stored in an archive before promulgation. If no one hears the promise at the moment of inscription, does the act occur?

  I argue that institutional promises recorded in writing, even when addressed to no specific present audience, constitute genuine performative utterances. This is possible provided we accept a mechanism I term **Diachronic Performative Binding (DPB)**. Under DPB, normative force is generated not by simultaneous psychological uptake, but by a document's structural accessibility to any future party meeting a specified recognition condition. This thesis preserves the performative-constative distinction by relocating the "uptake" condition from a psychological event to an institutional guarantee, thereby demonstrating that the absence of a co-present listener does not reduce the utterance to a mere constative report of intent.

  ### I. The Austinian Problem of the Absent Audience

  Austin's initial formulation of the performative relies on the "total speech situation." For a promise to be a promise, someone must hear it and understand it as a promise (uptake). Without this, Austin suggests the act is "hollow" or infelicitous. When applied to written institutional acts, a strict synchronic reading leads to a paradox: a will signed in private appears to be merely a description of the testator's wishes (constative) until an executor reads it (performative). This implies the normative obligation is created by the *reading*, not the *signing*, which contradicts legal and institutional practice where the obligation arises at the moment of execution ($t_0$), regardless of when discovery occurs ($t_1$).

  To resolve this without abandoning Austin's core insight—that speech acts create reality rather than describing it—we must distinguish between the *psychological state* of a listener and the *structural capacity* for recognition. DPB posits that in institutional contexts, the "audience" is not a specific person at $t_0$, but a functional role defined for $t_1$.

  ### II. Defining Diachronic Performative Binding (DPB)

  To prevent DPB from becoming a vague metaphor, it must be operationalized as a set of necessary and sufficient conditions. A critic should be able to examine an archival contract, testamentary clause, or public pledge and determine if it satisfies the mechanism. DPB obtains if and only if the following four conditions are met:

  1.  **Institutional Provenance:** The utterance must be embedded within a recognized normative system (legal, corporate, or ceremonial) that possesses established procedures for the creation and storage of records. A diary entry lacks this; a notarized deed possesses it.
  2.  **Successor Specification:** The document must define the conditions for future recognition not by naming a specific individual present at $t_0$, but by specifying a *class* of agents or a *procedure* for identification (e.g., "the bearer," "the heir," "the ratifying body").
  3.  **Durability and Accessibility:** The medium of inscription must be preserved within the institutional framework such that the probability of access by a qualified successor is non-zero and structurally guaranteed (e.g., filed in a public registry, sealed in a vault with known protocols).
  4.  **Deferred Normative Consequence:** Upon recognition at $t_1$, the document must generate obligations or rights that are retroactively anchored to $t_0$. If the document merely predicts future behavior, it fails this condition; it must alter the normative status of the parties relative to the time of signing.

  If a document meets these criteria, it is not merely a record of a past act; it *is* the act, extended through time. The "binding" occurs at $t_0$, but the "force" is transmitted diachronically via the institutional channel.

  ### III. Felicity Conditions and the Structural Uptake

  The primary objection to classifying these documents as performatives is that they violate Austin's felicity conditions, specifically the requirement for uptake. Austin argues that if the audience does not understand the act, the act is not achieved. DPB modifies this condition without collapsing it.

  In a DPB framework, the **Uptake Condition** is satisfied not by the *fact* of immediate comprehension, but by the *institutional guarantee* of eventual comprehension. When a sovereign issues a bond to "the bearer," the procedure itself ensures that whoever holds the bond *can* claim the value. The institution stands in as the proxy for the immediate audience.

  Consequently, we can still evaluate these acts using Austin's taxonomy of infelicities:
  *   **Misfires (A.1 & A.2):** If a will is not witnessed according to statutory law (Institutional Provenance failure), the act is void. It is not a "bad promise"; it is no promise at all. This aligns with Austin's view that performatives can be unhappy.
  *   **Abuses (B.1 & B.2):** If a signer signs a pledge with no intention of honoring it, they have committed an abuse of the procedure (insincerity), but the promise remains binding on the institution.

  By maintaining that these documents are subject to infelicity (they can be void, voidable, or abused), we confirm their status as performatives. A constative statement (a report of intent) cannot be "void" in the same way; it can only be false. If I write "I intend to pay you" and do not, I have lied (constative falsehood). If I write "I promise to pay you" in a binding instrument and do not, I am in breach (performative infelicity). DPB preserves this distinction by anchoring the possibility of breach to the moment of inscription, protected by the diachronic mechanism.

  ### IV. Responding to the Constative Objection

  A rigorous critic might argue: *"Without a co-present listener to witness the commitment, the utterance 'I promise' functions semantically as 'I intend.' It describes the speaker's psychological state at $t_0$. Therefore, it is constative."*

  This objection conflates the *epistemic access* to the promise with the *ontological status* of the promise. The DPB mechanism demonstrates that the normative force is intrinsic to the institutional act, not extrinsic to the listener's knowledge.

  Consider a "dead letter" contract found in an archive 50 years later.
  *   **Constative Interpretation:** The document reports that in 1970, Party A intended to pay Party B. If Party A is dead, the report is either true or false. No current obligation exists.
  *   **Performative (DPB) Interpretation:** The document *is* the promise. Upon discovery by a qualified successor (meeting the Successor Specification condition), the obligation is activated. The successor does not say, "He intended to pay"; they say, "He *owes*."

  The distinction lies in the **direction of fit**. A constative has a word-to-world direction of fit (the words must match the reality of the intent). A performative has a world-to-word direction of fit (the reality of obligations must change to match the words). DPB ensures that when the document is retrieved, the world is altered to match the text. The obligation was created at $t_0$, held in abeyance by the institutional medium, and realized at $t_1$. If it were merely a report of intent, the discovery of the document would not create a debt; it would only create knowledge of a past state of mind. Since the discovery *does* create a debt (in legal and institutional practice), the utterance must have been performative.

  Furthermore, the objection fails to account for **iterability**. As Derrida noted in his critique of Austin, for a sign to function, it must be repeatable in the absence of the sender. DPB formalizes this: the performative power of an institutional document relies precisely on its ability to function in the *absence* of the original speaker and the original audience. To deny this is to deny the possibility of law, which functions largely through written statutes addressed to future, unspecified citizens.

  ### V. Application and Critique

  To illustrate the precision of DPB, consider two cases:

  1.  **A Private Diary Entry:** "I promise to give $1000 to charity."
      *   *Institutional Provenance:* None.
      *   *Successor Specification:* None.
      *   *Verdict:* **Constative.** This is a report of intent. If the writer dies, the charity has no claim. It fails DPB.

  2.  **A Testamentary Trust:** "I bequeath $1000 to Charity X, held by Trustee Y."
      *   *Institutional Provenance:* Wills Act compliance.
      *   *Successor Specification:* Charity X and Trustee Y (roles defined).
      *   *Durability:* Probate court filing.
      *   *Verdict:* **Performative via DPB.** The obligation exists upon signing, even if the charity is unaware.

  A critic can use these conditions to challenge borderline cases. For instance, a public pledge written on a blog post that is subsequently deleted. Does it meet the *Durability* condition? If the institution (the web host) does not guarantee accessibility, the DPB mechanism fails, and the performative force dissolves into mere expression. This precision allows DPB to function as a diagnostic tool, not just a theoretical shield.

  ### Conclusion

  The thesis that institutional written promises are genuine performatives, despite the absence of a co-present audience, rests on the viability of Diachronic Performative Binding. By redefining uptake as a structural guarantee of future recognition rather than a simultaneous psychological event, we can accommodate archival and asynchronous speech acts within an Austinian framework. This mechanism preserves the performative-constative distinction by ensuring that such documents remain subject to felicity conditions (voidance, breach) rather than truth conditions. Ultimately, DPB acknowledges that institutions allow us to speak across time, binding the future through the normative power of the written word, not by describing what we intend to do, but by doing what we say.
