              *   *Wait, let's reverse.* The prompt says "I expect it to clear one, to tell me to cut or rebuild one I am attached to, and to deadlock on the third."
              *   *Lamp-tenders:* "Never go dark" is classic. "No counting" is the weird bit. If I apply the "Cost" test: Not counting is *not* costly, it's negligent. Unless counting is taboo. If counting is taboo, why? Because numbers summon something? That's lore, not religion.
              *   *River Nomads:* Naming wrongs + forgetting. High social utility. Distinct enough?
              *   *Auditors:* Favours to dead. Burning tallies. This is *very* close to Hell Money/Joss Paper. This is the Sensitivity Reader kill.
              *   *Okay, let's try:*
                  1.  **River Nomads:** Clears. (Social cohesion mechanism is robust).
                  2.  **Auditors:** Cut/Rebuild. (Too close to burning joss paper/ancestor worship).
                  3.  **Lamp-tenders:** Deadlock. (The "No Counting" rule contradicts the goal "Never go dark" unless there is magic. The procedure asks "What changes?" If the lamp goes out, what happens? If nothing, it's costume. If something, why not count? This is a logic hole the procedure flags but can't fix without authorial fiat on magic).

      *   *Refining the Deadlock:* A deadlock happens on Value, not Fact. The Lamp-tenders' "No Counting" is a value choice about Faith vs. Prudence. The procedure can't say which is better for the story.
      *   *Refining the Cut:* The Auditors are the appropriation risk.
      *   *Refining the Clear:* The River Nomads have a clear social function (conflict reset) that drives behavior (silence).

      *   *Wait, looking at the Prompt's expectation again:* "Deadlock on the third — and I want to know, at the end, what it cannot tell me at all."
      *   *Deadlock definition:* "Points at which it must stop and hand the decision back to me because what is at issue is a value and not a fact."
      *   *Okay, let's finalize the mapping:*
          *   **River Nomads:** Clear. (Functional, costly, distinct enough).
          *   **Auditors:** Cut/Rebuild. (High resemblance risk).
          *   **Lamp-tenders:** Deadlock. (The "No Counting" rule is a thematic value choice regarding risk vs. faith that the procedure cannot optimize).

  7.  **Writing the Procedure (The "Religion Engine"):**
      *   Tone: Clinical, direct, tool-like.
      *   Structure: 5 Questions.
      *   Mechanisms: Costly Signaling, Agent Detection, Social Leakage, Resemblance Filter.
      *   Explanations: Why I chose these (CSR/Anthro) and what I dropped (Theology/History).

