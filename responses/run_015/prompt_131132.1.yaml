      *(Self-Correction during drafting)*: Make sure the "Deadlock" explanation is clear. A deadlock isn't a failure of the tool, it's the boundary where art begins. The tool optimizes function; the author optimizes meaning.

      *(Refining the Auditors)*: Burning clay tallies is *very* specific to burning joss paper. I need to be firm that this is the "Cut/Rebuild" because a sensitivity reader *will* catch it.
      *(Refining the Lamp-tenders)*: The "No Counting" is the deadlock. It creates tension between "Keep it lit" (practical) and "Don't count" (dogmatic). The procedure asks "Why?" The answer is "Faith." The procedure can't measure "Good Faith."

      *(Refining the River Nomads)*: This is the strongest functionally. It solves a group problem (feuds). It has a cost (shame). It has a leakage (silence). It clears.

