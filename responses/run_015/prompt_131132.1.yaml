      *   **Task:** Create 6 religious systems for invented cultures.
      *   **Constraints:** Draft each in one evening. Must survive editor and sensitivity reader. No time for research/reading lists. Needs a *procedure/checklist*, not an essay.
      *   **Problem:** Current output is either "costume" (decorative, doesn't affect behavior) or "thin disguise" (appropriative, gets killed by sensitivity reader).
      *   **Goal:** A procedure based on the cognitive science/anthropology of religion (transmission, convincingness, costly signaling, agent detection) translated into plain language for fiction building.
      *   **Requirements:**
          *   Questions in order.
          *   Criteria for "good enough" answers.
          *   Stop points (No vs. Value Judgment).
          *   Explanation of mechanisms used/dropped.
          *   Limitations of the procedure.
          *   **Application:** Test three specific sketches (Lamp-tenders, River Nomads, Auditors).
          *   **Expected Outcome:** One clears, one needs rebuild/cut, one deadlocks.
          *   **Final Output:** What the procedure *cannot* tell the user.

  2.  **Deconstruct the "Science of Religion" for Fiction:**
      *   *Cognitive Science of Religion (CSR):* Humans have Hyperactive Agency Detection (HADD), intuitive dualism (mind/body), and memory systems favoring minimally counterintuitive concepts.
      *   *Anthropology/Sociology:* Costly Signaling Theory (hard things prove commitment), Ritual Form Theory (who does what to whom), Moralizing High Gods vs. Local Spirits.
      *   *Transmission:* Ideas spread if they are memorable, useful (socially or psychologically), and reinforce group cohesion.
      *   *Fiction Application:* Religion must drive plot/character (not costume) and feel distinct from real-world analogues (not appropriation).

  3.  **Drafting the Procedure (The "Engine"):**
      *   *Step 1: The Agent.* Who is listening? (Gods, spirits, ancestors). If no one is listening, why pray?
      *   *Step 2: The Cost.* What does it hurt to do this? (Time, pain, resources). If it costs nothing, it signals nothing.
      *   *Step 3: The Memory.* What is the one thing they tell a child? (Minimally counterintuitive).
      *   *Step 4: The Leverage.* How does this change a decision *today*? (Plot relevance).
      *   *Step 5: The Resemblance Check.* Does this map 1:1 to a real earth religion? (Appropriation check).

      *Refining the Steps for the User's Constraints:*
      *   Needs to be fast (under an hour).
      *   Needs to distinguish "costume" from "load-bearing."
      *   Needs to handle the sensitivity reader issue.

      *Revised Procedure Structure:*
      1.  **The Agent Test** (Who wants what?)
      2.  **The Cost Test** (What does it hurt?)
      3.  **The Leak Test** (Does it spill into secular life?)
      4.  **The Mirror Test** (Is this just Catholicism/Islam/Buddhism with a skin?)

  4.  **Developing the Criteria & Stop Points:**
      *   *Good Answer:* Specific, painful, consequential.
      *   *Bad Answer:* Vague, comfortable, symbolic only.
      *   *Value Judgment:* When the writer *wants* a specific theme that the logic contradicts.
      *   *Hard No:* When it fails the "Cost" or "Leak" test (it's costume).

  5.  **Addressing the "Science" Aspect (Mechanisms):**
      *   *Used:* Costly Signaling (commitment), Agency Detection (gods want things), Memory Systems (creed simplicity).
      *   *Dropped:* Theological truth claims (irrelevant for fiction), Historical evolution (too slow for this timeline).
      *   *Misfire:* Invented worlds lack real history, so "tradition" feels artificial. The procedure fixes this by focusing on *current utility*.

  6.  **Applying to the Three Sketches:**

      *   *Sketch 1: Lamp-tenders.*
          *   Creed: Long Lamp never dark.
          *   Taboo: No counting hours.
          *   *Analysis:* Why no counting? If you don't count, you don't know when it might go out. That creates anxiety. Is there an Agent? "The Light" or something in it? Cost: Vigilance. Leak: Do they sleep? Do they eat?
          *   *Verdict:* Likely the "Clears" one if the "No Counting" is explained as a trust mechanism or fear mechanism. Actually, "No Counting" is interesting. It prevents calculating risk. It forces constant vigilance.
          *   *Wait, let's look closer.* If they don't count, how do they know when to change the wick? It implies a supernatural element or a specific psychological state.
          *   *Decision:* This feels like it could be load-bearing *if* the plot relies on the lamp. But is it a disguise? Vestal Virgins? Eternal Flame? It's close.
          *   *Re-evaluation for the prompt's expectation:* The prompt expects one to clear, one to cut/rebuild, one to deadlock.
          *   *Lamp-tenders:* "No counting" is a specific cognitive constraint. It prevents rationalization. "I have 10 minutes left" vs "It could go out now." This drives behavior. *Verdict: Clears.*

      *   *Sketch 2: River Nomads.*
          *   Rite: Annual public naming of wrongs.
          *   Taboo: Never speak of them again.
          *   *Analysis:* This is a conflict resolution mechanism. It serves a social function (resetting the group). Cost: Public shame. Leak: High. It dictates social interaction all year.
          *   *Resemblance:* Yom Kippur? Confession? Indigenous cleansing rites? It's a *very* common archetype.
          *   *Verdict:* This is the "Accidental Resemblance" risk. It needs a rebuild to be unique, or it's a thin disguise. Let's make this the "Rebuild/Cut" candidate because it's functionally identical to many real-world purification rituals without a unique twist. *Correction:* The prompt says "tell me to cut or rebuild one I am attached to." This one is strong socially. Maybe the *Auditors* are the problematic one?
          *   *Let's look at Auditors:* Clay tallies of favours owed to the dead. Burn at funerals.
