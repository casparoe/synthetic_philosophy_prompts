answer: |-
  # The Religion Engine: A Procedural Checklist

  This procedure is built on three mechanisms derived from the cognitive science and anthropology of religion: **Costly Signaling** (why people do hard things), **Agent Detection** (who is watching), and **Social Leakage** (how belief changes non-religious behavior). It drops theology, history, and metaphysics; your readers do not care if the god is real, only if the *character* believes it is.

  **Time required:** 45–60 minutes per culture.
  **Tools:** Pen, paper, timer.

  ---

  ## The Procedure

  Ask these five questions in order. If you cannot answer a question within 5 minutes, the system is not yet functional.

  ### 1. The Agent Test (Who wants what?)
  **Question:** Name one non-human agent (god, spirit, ancestor, force) that expects a specific outcome from a human action. What happens if the human fails?
  *   **Good Answer:** A specific consequence (e.g., "The ancestors withdraw protection," "The river floods," "Luck turns").
  *   **Bad Answer:** Vague morality (e.g., "They become a bad person," "The universe is unbalanced").
  *   **Stop Point (HARD NO):** If there is no agent or consequence, this is philosophy, not religion. It will read as costume. **Delete or add an agent.**

  ### 2. The Cost Test (What does it hurt?)
  **Question:** What resource (time, pain, money, risk, opportunity) does the believer sacrifice to satisfy the Agent?
  *   **Good Answer:** A tangible loss (e.g., "They fast," "They give away grain," "They stand watch all night").
  *   **Bad Answer:** Internal states (e.g., "They feel humble," "They believe hard").
  *   **Stop Point (HARD NO):** If the practice costs nothing, it signals nothing. It is decoration. **Add a cost.**

  ### 3. The Leak Test (Does it spill over?)
  **Question:** Name one secular decision (eating, sleeping, trading, fighting) that is changed *because* of the Cost or the Agent.
  *   **Good Answer:** A plot-relevant behavior (e.g., "They won't travel at night," "They refuse profitable trades," "They forgive a debt they could collect").
  *   **Bad Answer:** Only happens during the ritual (e.g., "They pray on Sundays, but act normal Monday").
  *   **Stop Point (HARD NO):** If the religion stays in the temple, it is scenery. **Force a leak.**

  ### 4. The Memory Test (What is the hook?)
  **Question:** What is the single minimally counterintuitive idea a child learns? (One thing that violates normal physics/biology, easily remembered).
  *   **Good Answer:** "The dead eat smoke," "The lamp sees you," "The river remembers names."
  *   **Bad Answer:** Complex dogma (e.g., "A trinity of aspects within a dualistic framework").
  *   **Note:** If you cannot simplify it, it will not transmit in the story.

  ### 5. The Mirror Test (The Sensitivity Filter)
  **Question:** If you replace your invented terms with Earth terms (God/Allah/Spirit, Church/Mosque/Temple), does the practice map 1:1 onto a specific, living Earth tradition?
  *   **Pass:** The structure is generic (e.g., "sacrifice," "prayer") or the combination is unique.
  *   **Fail:** The specific combination of Agent + Cost + Ritual matches a specific marginalized or major Earth tradition (e.g., "Burning paper money for ancestors," "Ritual washing before prayer facing a specific direction").
  *   **Action:** If **FAIL**, you must rewrite the *mechanism* (the how), not just the name. If you cannot change the mechanism without breaking the plot, **CUT IT.**

  ---

  ## Mechanism Notes (Why this works)
  *   **Used:** *Costly Signaling Theory* (Questions 2 & 3) ensures the religion demands commitment, making it real to the character. *Hyperactive Agency Detection* (Question 1) ensures there is a "who" to interact with, driving conflict. *Memory Systems* (Question 4) ensures the lore is transmissible.
  *   **Dropped:** *Theological Truth.* Whether the god exists in your world is irrelevant to the procedure; only the character's belief matters. *Historical Evolution.* You do not have time to simulate centuries of schism. Treat the religion as a current, functional tool.
  *   **Misfire Warning:** This procedure optimizes for *function*, not *beauty*. It will produce robust systems, but they may feel cold. It cannot judge if the religion is "poetic." It also cannot detect subtle appropriation that requires deep cultural knowledge; it relies on your current awareness. If Question 5 triggers a "maybe," send it to the sensitivity reader.

  ---

  ## Application to Sketches

  ### 1. The Guild of Lamp-Tenders
  *   **Agent:** The Long Lamp (or the entity within it).
  *   **Cost:** Vigilance (never sleeping fully?), Oil/Wax resources.
  *   **Leak:** They cannot leave the post.
  *   **Mirror:** Vestal Virgins / Eternal Flame. Close, but "No Counting" adds a twist.
  *   **Procedure Result:** **DEADLOCK.**
      *   **Why:** Question 3 (Leak) creates a contradiction. The goal is "Never go dark." The rule is "Do not count hours." Practically, not counting *increases* the risk of the lamp going out.
      *   **The Value Judgment:** The procedure flags this as irrational. Is this irrationality a *bug* (bad writing) or a *feature* (faith over prudence)? The procedure cannot answer this. It requires an authorial decision on whether the magic system supports faith-based safety or if this is human folly. You must decide if the "No Counting" rule is a test of trust or a logical hole.

  ### 2. The River Nomads
  *   **Agent:** The Community / The River (as witness).
  *   **Cost:** Public shame (naming wrongs).
  *   **Leak:** Enforced silence for a year (changes conflict resolution).
  *   **Mirror:** Yom Kippur / Confession / Restorative Justice circles.
  *   **Procedure Result:** **CLEAR.**
      *   **Why:** It passes all functional tests. The Cost (shame) is high. The Leak (silence) dictates social behavior for 364 days. It solves a specific group problem (feuds in a small settlement). While it resembles real reconciliation rites, the specific combination (Annual + Public Naming + Total Subsequent Silence) is distinct enough to pass the Mirror Test as a functional archetype rather than a specific appropriation. It is load-bearing; removing it removes the mechanism for conflict resolution in the settlement.

  ### 3. The Auditors
  *   **Agent:** The Dead.
  *   **Cost:** Burning the tallies (destroying the record of debt).
  *   **Leak:** Economic tracking of favors.
  *   **Mirror:** Burning Joss Paper / Hell Money / Ancestor Offerings.
  *   **Procedure Result:** **CUT / REBUILD.**
      *   **Why:** It fails Question 5 (The Mirror Test). Burning material representations of value for the benefit of the dead is a direct, 1:1 mapping of specific East Asian ancestral traditions. A sensitivity reader will likely identify this as a thin disguise.
      *   **Fix:** You must change the *mechanism*. Do not burn the tallies. Bury them? Eat them? Feed them to a beast? If you keep the burning, you must change *what* is burned and *why* so it does not evoke joss paper. If you cannot change the mechanism without breaking the plot, cut it.

  ---

  ## What This Procedure Cannot Tell You

  1.  **Aesthetic Value:** It can tell you if a religion *works*, but not if it is *beautiful*. The River Nomads function perfectly, but they may feel cliché to you. That is a stylistic choice, not a functional one.
  2.  **The "Truth" of Your World:** It cannot tell you if the Long Lamp actually *is* magical. That is a world-building decision, not a religious systems decision. The procedure works equally well for a delusion or a reality.
  3.  **Deep Appropriation:** Question 5 is a heuristic, not a guarantee. It relies on *your* current knowledge. It will catch obvious parallels (burning offerings), but it may miss subtle theological appropriations that require academic knowledge. It minimizes risk, but does not eliminate it.
  4.  **Emotional Resonance:** It ensures the religion changes behavior, but it does not ensure the reader will *care* about that behavior. That depends on your character work, not the system.

  **Summary for your evening:**
  *   **River Nomads:** Keep. It drives the plot.
  *   **Auditors:** Rewrite the ritual mechanism immediately to avoid appropriation flags.
  *   **Lamp-Tenders:** You must decide if the "No Counting" rule is a magical necessity or a human flaw. The system will not decide for you.
