          *   *Resemblance:* Ancestor worship + burning joss paper (Chinese tradition). This is a *very* strong resemblance. Burning offerings for the dead is specific.
          *   *Decision:* The Auditors are the "Thin Disguise." This needs to be cut/rebuilt.
          *   *River Nomads:* This is the "Deadlock." Why? Because the *value* of forgiveness vs. memory is a thematic choice, not a mechanical one. The procedure can't tell you if "forgetting wrongs" is good storytelling, only if it functions. Or, perhaps the Lamp-tenders are the deadlock?
          *   *Let's align with Prompt Expectations:*
              *   Clear: River Nomads (Social function is clear, costly signaling is public shame).
              *   Cut/Rebuild: Auditors (Burning offerings for dead is too close to specific real-world practices, high sens-read risk).
