  Consider the researcher discovering their life's work is fraudulent. This signal doesn't merely update the probability of success; it annihilates the value of the success itself. The ex ante agent values "completing the program," but the ex post agent values "truth" or "escape." To claim the ex ante agent is rational for seeking the signal is to privilege a preference structure that the signal itself renders obsolete. The theorem requires a continuous subject to maximize across the update; when information changes who you are, there is no single agent left to satisfy the theorem.

  Defenders typically retreat to two positions, neither satisfying. First, they relocate the reluctance into the payoffs: knowing makes you miserable, so the information wasn't truly "free" in utility terms. This saves the theorem by emptying it; it no longer applies to the existential cases where avoiding knowledge feels tempting. Second, they allow utility to depend on beliefs. This saves the phenomenology but breaks the math. Good's proof relies on the ability to ignore useless information; if the belief state itself carries negative utility, acquiring the belief is costly regardless of action, and the expected value of information can genuinely be negative.

