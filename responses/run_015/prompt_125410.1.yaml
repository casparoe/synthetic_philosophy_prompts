answer: |-
  This is one of the sharpest questions a type designer can ask, and it cuts straight to the bone of semiotics. You are struggling with the difference between a **glyph** (a shape) and a **grapheme** (a functional unit).

  The frustration you feel at 'a' is not a failure of drawing; it is the friction of trying to quantize a continuous visual space into a discrete linguistic system. You are correct that visual features (contrast, angle, proportion) cannot intrinsically carry the burden of identity. A heavy stroke weight does not make an 'a'; it makes a *bold* 'a'.

  To answer your underlying question—"What makes 'every a is an a' substantive?"—we have to abandon the idea that letter identity lives in the ink. It lives in the **gaps** between the ink.

  Here is the breakdown of your specific cases, leading to the verdict on the Uniform-Grid Script.

  ### (i) The 'a' vs. 'd' vs. 'o' vs. 'ɑ' Problem

  You asked which differences are letter-differences and which are style-differences, given that fonts exist where these calls are flipped.

  The metric is not visual distance; it is **distinctive feature load**. Borrowing from phonology, we can say a grapheme is defined by a set of binary topological switches.
  *   **'o'**: [+closed], [−stem], [+curved].
  *   **'a'**: [+closed], [+stem/tail], [+curved], [+aperture variation].
  *   **'d'**: [+closed], [+stem], [+curved], [−right-facing bowl]. (The stem direction relative to the bowl is the distinctive feature separating 'b', 'd', 'p', 'q').
  *   **'ɑ' (single-story)**: This is the pivot. In the IPA, 'a' and 'ɑ' are distinct phonemes. In English typography, they are stylistic variants of the same grapheme.

  Why? Because in English orthography, swapping a double-story 'a' for a single-story 'ɑ' never changes the word's meaning or pronunciation. In a phonetic alphabet, it does.

  Therefore, a feature is **identity-constitutive** only if flipping it triggers a **categorical re-mapping** in the reader's brain within that specific writing system.
  *   If I close the aperture of an 'a' completely, it becomes an 'o' (or 'e' depending on the stem). That is a letter-change.
  *   If I change the terminal angle of the 'a's ear from horizontal to diagonal, it is a style-change.

  **The Trap:** You mentioned a font where stem height differentiates 'a' and 'd'. That is impossible in a standard Latin alphabet. If stem height were the *only* difference, the font would be illegible. 'a' and 'd' are distinguished by the **side of the bowl to which the stem attaches**. If a font moves the stem but keeps the attachment point, it's a weird 'a'. If it moves the attachment point, it's a 'd'. Visual similarity is irrelevant; topological connectivity is the invariant.

  ### (ii) The Halfway 'c' vs. 'e'

  You propose a glyph halfway between 'c' and 'e' (one added crossbar, or a closing stroke that doesn't quite meet).

  Is it a sloppy 'c', a broken 'e', or neither?
  **It is noise.**

  In a discrete alphabet, the "identity" of a letter is defined by the **forbidden zones** surrounding it. A functional writing system is not a map of where letters *can* be; it is a map of where they *must not* be.
  *   If the system is binary (c/e), the halfway point falls into the "valley" between the two peaks.
  *   If a reader encounters it, their brain performs error correction. It snaps the glyph to the nearest stable attractor.
  *   If the snap is ambiguous (50/50), communication fails.

  **What settles it?** Context.
  If the glyph appears in "on_e", the linguistic probability forces it to be 'e'. If it appears in "do_", it forces 'c'.
  If it appears in isolation ("Identify this letter"), and it is truly halfway, it has **no determinate identity**. It is a graphemic superposition. It proves that 'c'-ness is not a property of the curve, but a property of the curve's *distance from the 'e' boundary*.

  ### (iii) The Drawer vs. The Community

  Does identity exist if nobody reads the script?
  **No.**

  If the marks are in a drawer, you have geometry, not typography. You have a set of shapes with topological properties, but no *values*.
  *   **In the drawer:** The halfway 'c/e' is just a curve with specific coordinates.
  *   **In the wild:** The halfway 'c/e' is a potential error.

  The "identity" is pinned down by the **possibility of correction**. A community of users establishes the "attractor basins." If I write a sloppy 'a' and you correct me saying, "That looks like an 'o'," you are enforcing the boundary of the 'a' cluster. If you accept it as an 'a', you are expanding the cluster.

  Identity is a **social contract regarding ambiguity**. "Every 'a' is an 'a'" means "We agree to treat this range of variations as functionally equivalent, and we agree to treat variations outside this range as different letters." Without the agreement (the users), there is no equivalence, only similarity.

  ### (iv) The Metric and the Measurer

  If 'a'-ness is a cluster, what is the metric?
  It is **Perceptual Confusability weighted by Functional Cost**.

  *   **The Metric:** It is not Euclidean distance in vector space. It is the likelihood that a specific deformation will cause a misreading that changes meaning.
      *   Changing the weight of an 'a' has low functional cost (rarely changes meaning). -> Style axis.
      *   Closing the counter of an 'a' has high functional cost (becomes 'o' or 'e'). -> Identity axis.
  *   **The Measurer:** The human pattern-recognition system, trained by the specific orthography.

  The "cluster" exists because the writing system is **quantized**. We do not write in a continuous stream of shapes; we write in discrete buckets. The "metric" is the distance to the edge of the bucket.

  ### The Verdict on the Uniform-Grid Script

  Now, to your invented case. A script where glyphs are produced by sweeping parameters across a fine grid, such that the distance between #13 and #14 is the same as the distance between two fonts of 'a'.

  **1. Does the glyph halfway between #13 and #14 have a determinate letter-identity?**
  **No.** Not in the sense that 'a' has identity.
  In the Latin alphabet, 'a' has identity because there is a *gap* between 'a' and 'b'. There is no continuous path of valid letters connecting them.
  In your Uniform-Grid Script, you have removed the gaps. You have created a continuum.
  *   If the system is truly uniform and continuous, **there are no letters.** There are only coordinates.
  *   Asking if the halfway point is #13 or #14 is like asking if 13.5 is an integer. It isn't. The category "Integer" lapses at the halfway point.
  *   Therefore, the question of identity lapses.

  **2. Does this show 'a'-ness was never more than a cluster?**
  Yes, but with a crucial caveat. It shows that 'a'-ness is a **quantized cluster**.
  Flattening the space destroys the category *because categories require discontinuity*.
  For 'a'-ness to exist, the visual space must be **topologically punctured**. There must be shapes that are *illegal*.
  *   In Latin, a closed 'a' without a stem is illegal (it's an 'o').
  *   In your Uniform-Grid, nothing is illegal.
  *   Therefore, your Uniform-Grid is not a writing system with letters; it is a visual spectrum. It is to typography what a color gradient is to language. A gradient from red to orange has no "words" in it unless you draw lines and say "This side is Red."

  **3. What pins identity down?**
  You suggested: *Use, History, Functional Role.*
  *   **Use:** Users create the quantization. They will inevitably treat #13 as one symbol and #14 as another to maximize information density. They will deepen the valley between them.
  *   **History:** If #13 descends from a Latin 'a', it carries that baggage. But if the script is invented anew, history is null.
  *   **Functional Role:** This is the winner. A glyph is a letter if it plays a role in a **system of contrasts**.

  ### The Substantive Claim

  You asked: *What would have to be true of a pile of marks for "every 'a' is an 'a'" to say something, instead of being true just because we've decided to call all of them 'a'?*

  For the claim to be substantive, the marks must satisfy **Functional Equivalence under Perceptual Variance.**

  "Every 'a' is an 'a'" is not a tautology of naming. It is an empirical claim about the stability of a mapping. It asserts:
  1.  **Invariance:** Despite variations in weight, width, and ductus, the mapping to the phoneme /æ/ (or schwa) remains stable.
  2.  **Distinctiveness:** Despite those variations, the mark does not cross the boundary into the mapping for /o/, /d/, or /e/.
  3.  **Systemic Coherence:** The variations allowed for 'a' are consistent with the variations allowed for 'b', 'c', etc. (This is the *Letter Spirit* insight: style is a transformation rule applied to the whole set).

  **The Answer to your Design Struggle:**
  When you restart at 'a', you are failing because you are looking for the "Platonic 'a'". It doesn't exist.
  You are trying to draw a shape that sits in the center of the 'a' basin without slipping into the 'o' or 'd' basin, while simultaneously defining the walls of those basins for the rest of your font.

  You cannot draw 'a' in isolation. You are not drawing a shape; you are drawing a **boundary condition**.
  *   When you draw the bowl of the 'a', you are implicitly deciding how closed the 'o' must be.
  *   When you draw the stem of the 'a', you are deciding how tall the 'l' must be.

  **Conclusion:**
  In your Uniform-Grid Script, the halfway glyph has no identity because you have removed the **contrast** that generates identity.
  In your typeface, 'a' has identity only if you ensure there are shapes that *cannot* be 'a'.
  "Every 'a' is an 'a'" is true only if there are some marks that are *definitely not 'a'*.
  If everything can be an 'a', nothing is.

  Stop trying to find the fixed features of 'a'. Start defining the **forbidden zones** around it. The letter is the hole, not the dough.
