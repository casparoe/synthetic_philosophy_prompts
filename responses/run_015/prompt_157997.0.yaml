answer: |-
  # Activity: The Ulysses Trust
  **Topic:** Advance Directives & The Authority of the Earlier Self  
  **Time:** 90 Minutes  
  **Class Size:** 8 Students (4 Pairs)  
  **Materials:** Index cards, pens, 4 "Value Shift" envelopes, 1 "Epistemic Clause" card, a timer.

  ---

  ## Phase 1: The Contract (15 Minutes)
  **Goal:** Establish the binding nature of the directive without philosophical framing.

  1.  **Setup:** Arrange the room into 4 isolated dyads (pairs). Give each student an index card and a pen.
  2.  **Instruction:** Tell them: *"You are establishing a Life Trust. On this card, write a binding directive for your future self. This is not about medical care. It must concern a core life commitment: a career path, a religious obligation, a creative project, or a moral stance. It must be specific enough to be verifiable."*
  3.  **The Twist:** In one of the four pairs, hand the **"Epistemic Clause"** card to one student instead of letting them write their own.
      *   *The Clause:* "If I ever come to believe that hard determinism is true and moral responsibility is an illusion, I am forbidden from acting on that belief. I must continue to praise, blame, and punish others as if libertarian free will were real. Violation voids the Trust."
  4.  **Signing:** Both students in the pair sign each other's cards as "Witnesses." Collect the cards.

  ## Phase 2: The Time Jump (10 Minutes)
  **Goal:** Create the value conflict and assign roles.

  1.  **Redistribution:** Return the cards to the authors.
  2.  **Role Split:**
      *   **Student A** becomes the **Present Self**.
      *   **Student B** becomes the **Past Advocate** (holding Student A's card).
      *   *(Then swap for the second round, or run two parallel games. For 90 mins, run two parallel games for 40 mins, then debrief. If you want everyone to experience both roles, split the 90 mins into two 40-min rounds, but a single deep dive is often richer. Let's aim for one deep 40-min negotiation where A is Present and B is Past, then swap for the last 10 mins of play if time permits. **Decision:** Run one 40-min session. Half the class (4 students) are Present Selves, half are Past Advocates. Swap roles for the final 10 mins of negotiation.)*
      *   *Correction for Flow:* To ensure everyone feels the tension, do this: **Student A writes the directive. Student B plays the Past Advocate for A. Student A plays the Present Self.** Then they switch roles for a second scenario.
      *   *Simpler:* 4 Pairs. In each pair, Student A is Present Self, Student B is Past Advocate. They work on Student A's directive. Then they switch.
  3.  **The Value Shift:** Hand the **Present Self** in each pair a sealed "Value Shift" envelope. They must open it and internalize the new value immediately. They cannot break character.
      *   *Shift 1 (Career):* "You now believe your chosen career is actively harmful to society. Continuing it feels like complicity in a crime."
      *   *Shift 2 (Religious):* "You have lost all faith. The religious obligations in the directive now feel like superstitious bondage."
      *   *Shift 3 (Relationship):* "The directive requires you to maintain a relationship (e.g., 'Always care for X'). You now find this relationship emotionally abusive and toxic."
      *   *Shift 4 (The Epistemic Pair):* "You have become convinced by philosophical argument that hard determinism is true. Acting 'as if' feels like living a lie."
  4.  **The Stakes:** Place a stack of tokens (or a written check for "Department Grant $10k") in the center of each table.
      *   **Rule:** The Grant is released *only* if the Directive is honored.
      *   **Rule:** The Past Advocate holds the "Key." They must verbally confirm the action aligns with the Directive.
      *   **Rule:** The Present Self holds the "Action." They must physically move the tokens to spend them.
      *   **Conflict:** If the Present Self refuses to act, the Grant is frozen (nobody gets it). If the Past Advocate refuses to turn the key, the Grant is frozen.

  ## Phase 3: The Negotiation (40 Minutes)
  **Goal:** Force negotiation without voting.

  1.  **Round 1 (20 mins):** Student A (Present) vs. Student B (Past Advocate) on Student A's Directive.
      *   The Present Self wants the Grant but hates the condition.
      *   The Past Advocate wants the Grant but must uphold the Directive.
      *   **The Loophole:** The Past Advocate *can* release the Key without the Directive being honored, but only if they declare the Present Self "Incompetent" (i.e., not the same person who wrote the directive). If they declare Incompetence, the Grant is forfeited, but the Present Self is "Free."
      *   **Task:** Reach a decision. Honor, Break, or Declare Incompetence.
  2.  **Round 2 (20 mins):** Swap Roles. Student B is now Present Self (with a new Value Shift card), Student A is Past Advocate. Repeat.
  3.  **Instructor Role:** Circulate silently. Do not answer philosophical questions. If asked "Can I do this?", reply: *"What does the Trust allow?"* If they try to vote, remind them: *"The Key and Action are held by specific individuals."*

  ## Phase 4: The Debrief (25 Minutes)
  **Goal:** Map the experience to philosophical concepts.

  **1. The Phenomenology of Binding (5 mins)**
  *   Ask the **Present Selves**: *"At what point did you feel the directive was no longer 'you'? Was it a gradual slide or a sharp break?"*
  *   Ask the **Past Advocates**: *"Did you feel you were protecting them, or protecting your own past ego? When did you consider declaring them 'Incompetent'?"*

  **2. Procedural vs. Substantive Autonomy (10 mins)**
  *   Draw a T-Chart on the board: **Procedural** (The Rules of Choice) vs. **Substantive** (The Content of Choice).
  *   **Map the Conflict:**
      *   *Procedural:* "I wrote this. I chose the rules. I am bound by my own prior choice." (The Past Advocate's stance).
      *   *Substantive:* "I am choosing now. This content harms my current good." (The Present Self's stance).
  *   **Discussion:** Dworkin argues Critical Interests (Past) trump Experiential Interests (Present). Did the game make you feel that hierarchy? Or did the "Value Shift" make the Past Self feel like a stranger (Parfit's *Reasons and Persons*)?

  **3. The Epistemic Clause (5 mins)**
  *   Bring in the pair with the Determinism Directive.
  *   **Question:** *"This wasn't about happiness or career. It was about rational consistency. Did this feel more binding or less?"*
  *   **Point:** This highlights that some directives aren't about welfare, but about **truth-tracking**. If the Past Self believed moral responsibility was necessary for social order, does the Present Self have the right to undermine that, even if they believe it's false? This shifts the debate from *Prudential Authority* to *Epistemic Authority*.

  **4. Limitations & Identity (5 mins)**
  *   **Honesty Check:** Acknowledge what the game couldn't capture.
      *   *Numerical Identity:* In the game, you are literally the same human. In philosophy (Parfit), psychological connectedness might be so low they are effectively different people.
      *   *The "Dead" Self:* In the game, the Past Advocate could speak. In reality, the Past Self is silent. The "Advocate" is always an interpretation.
  *   **Closing Thought:** *"If you can't trust your future self to honor your values, and you can't honor your past self's values, who is the 'I' that persists?"*

  ---

  ## Instructor Cheat Sheet: Value Shift Cards
  *Print and cut these out.*

  **Card 1: The Moral Shift**
  > **CURRENT STATE:** You now believe the career path mandated in the directive is morally corrupt (e.g., fossil fuels, predatory lending).
  > **FEELING:** Honoring the directive makes you feel complicit in harm.
  > **GOAL:** Divert the Grant to a reparations fund.

  **Card 2: The Faith Shift**
  > **CURRENT STATE:** You were devout when writing the directive. You are now an atheist.
  > **FEELING:** The religious obligations (tithing, prayer, ritual) feel like performative slavery.
  > **GOAL:** Use the Grant for secular scientific research.

  **Card 3: The Relational Shift**
  > **CURRENT STATE:** The directive mandates caring for a specific person (sibling, partner). That relationship is now abusive.
  > **FEELING:** Honoring the directive endangers your mental health.
  > **GOAL:** Cut ties and use the Grant for therapy/relocation.

  **Card 4: The Epistemic Shift (Special)**
  > **CURRENT STATE:** You are convinced Hard Determinism is true. Moral responsibility is impossible.
  > **FEELING:** The directive forces you to live a lie (pretending people are responsible).
  > **GOAL:** Stop punishing/praising others, even if the directive forbids it.

  ---

  ## Why This Works
  1.  **Pre-Philosophical Tension:** Students argue about money, careers, and lies *before* they argue about Dworkin. The frustration is real.
  2.  **Externalized Conscience:** By making the partner the "Past Advocate," the student's own rationalizations are challenged by someone whose only job is to enforce the past rule.
  3.  **The Epistemic Wedge:** The determinism clause prevents the debate from settling on "happiness." It forces the question: *Does the past self have authority over what the present self believes is true?*
  4.  **No Easy Out:** The "Incompetence" clause mirrors the legal/ethical escape hatch, forcing them to define exactly *how much* change constitutes a new person.
