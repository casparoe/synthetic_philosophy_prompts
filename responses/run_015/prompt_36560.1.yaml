      *   **Context:** The user had a heated argument with a friend about the Sorites Paradox.
      *   **Core Dispute:** The friend argues the standard conditional formulation (Tolerance Principle) is a red herring; the real issue is the vague predicate itself, which can be exposed via a long list of singular premises (1M is a heap, 999,999 is a heap, etc.).
      *   **Tasks:**
