answer: |-
  **DISSERTATION FELLOWSHIP PROPOSAL**

  **Project Title:** Discriminability in Development: A Portability and Frequency Framework for the Institutions-Geography-Culture Debate

  **Principal Investigator:** [Your Name], PhD Candidate, Department of Political Economy

  **1. Research Question**
  The central question of this project is not *which* factor (institutions, geography, or culture) explains economic development, but *under what historical conditions these factors are empirically separable.* Current literature treats these as competing independent variables in a cross-national regression. This project argues they are bundled treatments with low effective degrees of freedom. I ask: **What is the minimal observational requirement to distinguish the causal mechanism of institutional quality from geographic endowments and cultural norms, and does the historical record contain sufficient variation to meet this requirement?**

  **2. Intellectual Merit and Gap**
  The "horse race" literature (Institutions vs. Geography vs. Culture) suffers from two identification problems that cannot be solved by additional instruments. First, **bundling:** Colonial origin, settler mortality, and crop suitability are collinear in the available sample. Instruments (e.g., settler mortality) identify the effect of institutions only along specific colonial paths, not universally. Second, **conflated targets:** Some theories explain income *levels* (static), while others explain *growth takeoffs* (dynamic). A time-invariant geographic variable cannot explain a temporal takeoff, yet is often tested against it.

  Current approaches attempt to win the horse race by finding cleaner instruments. This project argues the race itself is misspecified. If the effective number of independent observations is near ten (due to colonial common shocks and spatial diffusion), confidence intervals in existing literature are artificially narrow. The contribution here is methodological: shifting the focus from *estimation of magnitude* to *assessment of discriminability.* I will formalize a "Portability Test" to determine if hypotheses yield divergent predictions under counterfactual relocation of populations or institutions.

  **3. Methodology and Work Plan**
  The project proceeds in three phases over the fellowship year, moving from formalization to historical audit.

  *   **Months 1–3: Formalizing the Portability Framework.**
      I will construct a simple structural model where Development ($Y$) is a function of Institutions ($I$), Geography ($G$), and Culture ($C$). I will define a **Portability Coefficient ($\rho$)** for each factor: $\rho_G \approx 0$ (geography is fixed), $\rho_I \approx 1$ (institutions are transferable), $\rho_C \in (0,1)$ (culture travels with people but adapts). I will derive the specific counterfactual conditions (e.g., mass migration, colonial transplantation, border splits) required to mathematically separate $\beta_I$ from $\beta_C$ given specific values of $\rho$.
  *   **Months 4–6: The Historical Audit.**
      Using the criteria from Phase 1, I will code a dataset of "Uncoupling Events" from 1500–2000. These are episodes where $I$, $G$, and $C$ were experimentally varied (e.g., the partition of Korea, European settlement in neo-Europes, forced migration). Each event will receive a **Discriminability Score** based on how many hypothesis pairs it can theoretically distinguish. This quantifies the "effective N" of the development literature.
  *   **Months 7–9: Level vs. Growth Decomposition.**
      I will re-evaluate the high-scoring Uncoupling Events to determine if they identify level effects or growth rates. Many natural experiments (e.g., border splits) identify level differences but are silent on long-run growth trajectories. I will map which hypotheses remain viable when restricted to explaining *takeoffs* rather than *levels*.
  *   **Months 10–12: Synthesis and Writing.**
      Integration of the formal model and historical audit into two papers: (1) "The Bundle Problem," outlining the theoretical limits of cross-country regression; and (2) "The Portability Test," applying the framework to specific historical cases.

  **4. Deliverables**
  1.  **Job Market Paper:** "The Effective N of Development Economics," presenting the Discriminability Score dataset and the argument regarding bundled treatments.
  2.  **Methodological Framework:** A formalized "Portability Test" protocol available for other researchers to evaluate new identification strategies.
  3.  **Dissertation Chapter:** A comprehensive critique of the identification assumptions in the institutions-growth literature.

  **5. Risk Assessment and Failure Conditions**
  The primary risk is a "null result": the audit may reveal that *no* historical episode cleanly separates institutions from culture, or that the effective N is indeed too small for causal claims.
  *   **Mitigation:** A negative result is substantive. Proving that the hypotheses are observationally equivalent given available data is a valid contribution that halts unproductive research paths.
  *   **Pivot:** If the general framework is too broad, I will restrict the scope to the Institutions vs. Culture dyad within the British Empire, where archival data on administrative rules and settler demographics is most dense.
  *   **Worth Writing:** Even if no design separates the hypotheses, the project yields a taxonomy of *why* they fail to separate (e.g., "all migration events also change geography"). This prevents future scholars from proposing invalid natural experiments.

  ***

  **APPENDIX A: RESPONSE TO METHODOLOGICAL CRITIQUE**
  *(For use in Q&A or accompanying memo)*

  **Critique:** "This is philosophers' hand-wringing about causal inference. The right response is to stop worrying and find a new natural experiment."

  **Response:**
  This project is not a call to stop empirical work, but a pre-flight check to ensure empirical work is not wasted. The "find a new natural experiment" strategy assumes the design space is infinite. My preliminary analysis suggests the design space for development questions is bounded by history; we cannot generate new colonies or move continents. If the available historical variation bundles institutions and culture perfectly (as in most settler colonies), no amount of econometric sophistication can untie the knot.

  Investigating the limits of discriminability is not semantic; it is resource allocation. If the "effective N" of the cross-national literature is truly single digits due to spatial correlation and colonial clustering, then the confidence intervals on the "institutions win" consensus are fundamentally miscalculated. By mapping the boundaries of what is historically separable, this project directs future fieldwork toward the few regions or episodes where variation actually exists, rather than encouraging another round of instruments that rely on the same bundled variation. It turns a metaphysical worry into a testable constraint on research design.

  ***

  **APPENDIX B: SCOPE ASSESSMENT & ADVISORY NOTE**
  *(For your eyes only)*

  **Is this too big?**
  Yes. Honestly, this is a book project, not a fellowship year. Trying to formalize a model, audit global history from 1500–2000, *and* decompose level vs. growth is a recipe for having nothing finished by the job market. The "Historical Audit" alone could take years if you try to be comprehensive.

  **The Natural Cut-Down Version:**
  Drop the "Level vs. Growth" axis for now. It complicates the formal model significantly. Focus entirely on the **Portability Test**.
  *   **Revised Scope:** Restrict the Historical Audit to **three specific types of episodes** rather than a global coding project.
      1.  *Split Nations* (Korea, Germany, China/Taiwan).
      2.  *Settler Colonies* (US/Australia vs. Source Countries).
      3.  *Diaspora Enclaves* (Chinese/Indian minorities in SE Asia/Africa).
  *   **Why:** These are the canonical cases the literature already uses. You aren't finding *new* data; you are re-interpreting the identification power of the *existing* canonical cases. This makes the project feasible in 12 months.
  *   **Deliverable:** One strong paper showing that these three canonical designs identify three *different* parameters, meaning they cannot be compared directly. That is a publishable, job-market-ready insight without needing to code a global dataset.

  **Final Advice:**
  Your advisor is half-right: this *is* a methodology project. To sell it to a Political Economy committee, you must ensure the "Portability Test" sounds like an empirical strategy, not just theory. Emphasize the **Historical Audit** (Months 4-6). That is the "data" part of the proposal that reassures them you aren't just doing philosophy. Good luck.
