  Dita will say she does not know (a) and does not know (b), though she will admit she believes both with high confidence.

  Three rules fit her previous nine verdicts. **The Property Distinction** holds that testimony can transmit knowledge of subjective fit (enjoyment) given high trust, but never knowledge of objective merit (quality), because merit requires first-hand appreciation. **The Access Requirement** holds that knowledge of any aesthetic property requires the possibility of perceptual access to the object; if the work is inaccessible, testimony yields only belief. **The Verification Principle** holds that knowledge requires the capacity to verify the claim through experience; testimony guides belief, but only experience converts it to knowledge.

  Applied to the new case, all three rules deny knowledge of (a). Merit claims ("masterpiece") are blocked by the Property Distinction (Cases 1–4, 7, 8) and the Verification Principle (Case 8). The conflict arises on (b). The Property Distinction predicts Dita *will* know (b), because Mira's trustworthiness (300/300 agreements) exceeds her partner's (Case 3), and "loving it" is a subjective fit claim. However, the Access Requirement and Verification Principle predict she will *not* know (b), because the sealed vault makes verification impossible (unlike Case 3, where she could read the novel) and severs the perceptual link (unlike Case 6, where she watched).

  My best guess is that Dita denies knowledge on both counts, prioritizing the Access Requirement over the Property Distinction. The 300 agreements are strong evidence of *alignment*, but not of *goodness*; goodness requires tracking mind-independent features of the film, which Dita cannot do without seeing it. More critically, Case 9 (the diary) is the tiebreaker: Dita wobbles on whether she knows a novel is good when she cannot access it, even though the source is herself. If self-testimony fails to sustain knowledge without access, third-party testimony must fail too, regardless of trust. The wobble indicates that for Dita, knowledge is a relation between subject and object, not just a relation between subject and source; the vault breaks the relation.

  To separate the Property Distinction from the Access Requirement, present this case: Dita attends a concert with Mira but later loses all memory of the event due to amnesia. Mira tells her, "You were moved to tears by the adagio." The Property Distinction predicts Dita *knows* this (it is a fact about her psychology, not the music's merit, and Mira is trusted). The Access Requirement predicts she *does not know* this (she cannot access the experience or memory to verify it). If Dita says she doesn't know, the Access Requirement is her governing rule.
