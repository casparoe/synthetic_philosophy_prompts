  **Decomposition**

  *   **40% — Critical-Level vs. Strict Zero-Level:** This is the main lever. Strict totalism (zero critical level) dictates the swap immediately. Critical-Level Utilitarianism (CLU), often adopted by totalists to dodge the Repugnant Conclusion, posits a threshold (e.g., +5.0) below which lives add no value or negative value. If the digital minds' +0.1 is below the critical level, totalist-style axiology (broadly construed) does *not* require creating them. My credence assumes Strict Totalism is the baseline, but CLU is a strong competitor within the family.
  *   **35% — Welfare Comparability:** This is the hidden minefield. Are digital +0.1 utils linearly comparable to biological +10 utils? If welfare is substrate-dependent (e.g., requires specific biological binding to achieve 'depth'), the digital utils might be illusory or non-comparable. If they aren't comparable, the math breaks.
  *   **15% — Artifactual Origin:** Low weight. If consciousness and welfare are real, origin is morally irrelevant. Denying this requires a "naturalness" constraint that most secular axiologies reject as anthropocentric hand-waving. I discount this heavily, but leave room for unknown metaphysical constraints on artifact personhood.
  *   **10% — Normative 'Require':** Whether axiology translates to action-guiding obligation in non-ideal conditions. Even if the math says "prefer digital," epistemic uncertainty about the future might block the *requirement* to act now.

  **Shakiest Term:** "Utils" (Welfare Comparability). We have no meter for cross-substrate welfare. Assuming linear scalability between biological and digital experience is a massive empirical leap.

  **One Piece of Evidence:** A functional theory of consciousness demonstrating that welfare magnitude correlates with *computational integration depth* rather than hedonic tone. If digital minds cannot achieve the integration depth of biological humans, their +0.1 might be lexically inferior to human +10, breaking the summation.
