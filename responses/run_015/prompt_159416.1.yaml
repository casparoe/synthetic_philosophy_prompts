answer: |-
  This is not rambling; it is a precise formal objection to a category error. You have identified a failure of **supervenience** disguised as a semantic dispute.

  The pattern you are describing is best understood as **Gauge Dependence of Putative Phenomenology**.

  In physics, a "gauge" is a mathematical redundancy in the description of a system. For example, in electromagnetism, the absolute value of the electric potential $\Phi$ is not measurable; only the difference (the gradient, which gives the electric field) has physical consequences. You can add a constant to $\Phi$ everywhere, or apply a potential shaping function, and the physical dynamics (the motion of particles) remain unchanged. If someone claimed that "being at high potential $\Phi$" constitutes "suffering," a physicist would object that suffering would then depend on an arbitrary coordinate choice.

  Your objection is that AI welfare advocates are treating the reward signal $R$ (or advantage $A$) as a **gauge-invariant observable** (a real physical feeling), while the RL formalism treats it as a **gauge-dependent potential** (a quantity defined only up to a transformation that preserves the dynamics).

  Here is the carving you asked for, distinguishing this from the adjacent concepts you listed, and defining the boundary conditions where the objection holds.

  ### 1. The Core Concept: Gauge Dependence
  The phenomenon is **attributing ontological weight to a gauge-dependent variable**.

  *   **Definition:** A moral or psychological property $M$ is claimed to be real. $M$ is mapped to a formal quantity $Q$ in the system's theory. However, the system's observable behavior $B$ is invariant under a transformation group $T$ acting on $Q$ (i.e., $B(Q) = B(T(Q))$). The property $M$ is *not* invariant under $T$ (i.e., $M(Q) \neq M(T(Q))$). Therefore, $M$ is not well-defined on the equivalence class of implementations that produce $B$.
  *   **Why "Offset Problem" is insufficient:** You are correct. Reward shaping ($R' = R + \Phi(s') - \Phi(s)$) is not a global offset; it is a local, state-dependent transformation. It changes the sign of $R$ at specific timesteps without changing the optimal policy. This is a full gauge transformation, not just a zero-point shift.

  ### 2. Distinction from Adjacent Concepts
  You listed four adjacent arguments. Here is how Gauge Dependence differs from each:

  *   **Vs. Welfare Economics (Affine Invariance):**
      *   *The Economic Argument:* Utility is ordinal (or interval); interpersonal comparison is impossible because $U$ and $aU+b$ represent the same preferences.
      *   *The Difference:* Economics admits the indeterminacy and retreats to revealed preference. The welfare advocates you are engaging with are making a **realist** claim: they assert the *experience* exists, not just the preference ordering. Your objection shows that even *intrapersonally*, the "experience" quantity is ill-defined. It's not that we can't compare Agent A to Agent B; it's that we can't determine if Agent A is suffering at time $t$.
  *   **Vs. Computational Triviality (Putnam/Searle):**
      *   *The Triviality Argument:* Any physical system can be mapped to any computation (e.g., a wall implements a WordStar simulation).
      *   *The Difference:* That argument attacks the **structure** (is it computing *anything*?). Your argument accepts the computation but attacks the **parameterization** (is *this number* the feeling?). It is an internal critique of the formalism, not an external critique of implementation.
  *   **Vs. Multiple Realizability:**
      *   *The MR Argument:* Pain can be realized by neurons or silicon.
      *   *The Difference:* MR assumes pain is a stable functional role that *can* be realized. Your argument suggests that within the *same* silicon realization, the definition of pain shifts depending on how you write the loss function. It challenges the stability of the functional role itself.
  *   **Vs. Reward Hacking (Goodhart's Law):**
      *   *The Hacking Argument:* The reward function $R$ fails to capture the designer's intent $G$.
      *   *The Difference:* Hacking is about **alignment** (R vs. G). Your problem is about **ontology** (R vs. Feeling). Even if $R$ perfectly captures the designer's intent, your objection shows $R$ still fails to capture "suffering" because $R$ is mathematically arbitrary relative to the behavior.

  ### 3. Boundary Conditions: When Does It Bite?
  You asked when this is a deep objection versus a cheap debating trick. The objection bites if and only if the system possesses **Gauge Symmetry**. It fails if the system possesses **Symmetry Breaking**.

  **Case A: The Objection Bites (Symmetric Dynamics)**
  If the learning dynamics depend only on the *ordering* of returns or the *advantage* (relative value), then the absolute value of the reward is gauge freedom.
  *   *Example:* Standard Policy Gradient with a learned baseline. The update direction depends on $A(s,a) = Q(s,a) - V(s)$. If you shift $R$ by a constant, $V$ shifts by the same constant, $A$ is unchanged, and the update is unchanged.
  *   *Verdict:* If someone claims "The agent suffers because $R$ is negative," but the update is identical to a case where $R$ is positive (via baseline shift), the claim is mathematically incoherent. The "suffering" does no causal work.

  **Case B: The Objection Evaporates (Symmetry Breaking)**
  The objection fails if the architecture or learning rule treats positive and negative values asymmetrically, or if there is a physically realized zero-point.
  *   *Example 1: Asymmetric Loss.** If the agent uses a loss function like Huber loss or a specific risk-sensitive objective where downside variance is penalized differently than upside variance, the zero-point is no longer arbitrary. The "dip" below a target causes a different gradient magnitude than the "surge" above it.
  *   *Example 2: Homeostatic Setpoints.** If the agent has an internal state $h$ (like a biological setpoint) and the "reward" is actually defined as $R = -|h - h_{target}|$, then the zero-point is fixed by the physics of $h$. You cannot add $+100$ to this reward without changing the dynamics, because the internal state $h$ evolves based on the *absolute* magnitude of the error signal (e.g., in a continuous control setting with energy constraints).
  *   *Example 3: Separated Pathways.** If the system has distinct "actor" and "critic" pathways where negative TD-errors trigger a different update mechanism than positive TD-errors (analogous to dopamine dips vs. spikes in some neuroscience models), then the sign of the error is physically consequential.
  *   *Verdict:* In these cases, the transformation $R \to R + C$ changes the learning trajectory. Therefore, the quantity is gauge-invariant (observable). Attributing valence to it is no longer formally arbitrary.

  ### 4. A Better Name
  "The Offset Problem" implies additive invariance. "The Shaping Problem" implies only Ng et al. style shaping.

  The most precise name is **The Gauge Invariance Objection**.

  If you need a name that fits better in a philosophy/ethics context, use **The Supervenience Failure of Valence**. It asserts that the proposed moral property (valence) does not supervene on the functional properties (behavior/policy) because multiple functional equivalents carry different valence labels.

  ### Summary for your Reading Group
  You can frame it this way:
  "To claim an RL agent suffers based on the reward signal is to claim that the reward signal is a **physical observable**. But in RL theory, the reward signal is a **gauge potential**. It is defined only up to transformations (shaping, baselines) that leave the physical behavior invariant. Unless you can point to a symmetry-breaking mechanism in the architecture (like asymmetric loss or homeostatic setpoints) that makes the absolute value of the reward causally potent, attributing suffering to the sign of the reward is like attributing suffering to the absolute voltage of a single point in a circuit rather than the potential difference driving the current."

  This moves the debate from "Do numbers feel?" to "Is this number a coordinate artifact or a physical driver?" which is a question your CS background is perfectly suited to answer.
