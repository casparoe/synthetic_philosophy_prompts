prompt: |-
  So I'm in a seminar on algorithmic fairness this term (phil/CS cross-list, ~16 of us, 75-minute sessions), and I've got the week on the Kleinberg-Mullainathan-Raghavan / Chouldechova impossibility result: you can't get calibration within groups, equal false positive rates, and equal false negative rates all to hold at once when two groups have different base rates, whatever thresholds you pick. Everyone's already read the ProPublica COMPAS piece and treats this as a 'biased training data' problem, and I want it to actually land that it's a forced trade-off, not sloppy engineering. Design an in-class activity, not a lecture, where small groups build a scoring rule for two applicant pools and try to hit all three properties at once. I want the base rates rigged in advance so failure is structural, not just probable. Give me materials, roles if useful, a scoring/stakes scheme that doesn't need real money, a rough timeline, and don't let anyone hear the word 'impossibility' until after they've hit the wall themselves. Then a debrief mapping what happened onto the theorem and showing which property they end up sacrificing and why it had to be that one. Be honest about whats predictably going to go wrong the first time I run this, and what part of the result the activity can't get across by itself. Don't hand me a menu of options -- commit to one version and defend it.
