                  *   *But PPV:* $PPV = \frac{TP}{TP+FP}$. Since Base Rates differ, TP counts differ. PPV will differ.
                  *   *Task:* Try to make PPV equal.
                  *   *Solution:* Change Thresholds.
                  *   *Consequence:* FPR/FNR will no longer match.
      *   *Perfect.* This isolates the Base Rate Impossibility.

  8.  **Writing the Plan:**
      *   Title: "The Compliance Trap."
      *   Tone: Direct, instructional, ready-to-run.
      *   Sections: Setup, Materials, Roles, Timeline, The Rig, Debrief, Limitations.

