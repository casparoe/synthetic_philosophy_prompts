answer: |-
  # Activity Plan: "The Compliance Trap"

  **Objective:** Force students to experience the KMR/Chouldechova trade-off structurally by attempting to satisfy three competing fairness metrics on rigged data.
  **Time:** 75 Minutes
  **Class Size:** 16 Students (4 Groups of 4)
  **Materials:** Printed "Applicant Cards," "Compliance Ledgers," Calculators (phones allowed).

  ---

  ## 1. The Setup (5 Minutes)
  **Instructor Script:**
  "Welcome. You are the Algorithmic Compliance Board for 'LendFast,' a loan company. You have inherited a scoring model that assigns applicants a Risk Score from 1 (Safe) to 5 (Risky). You do not control the scores; you control the **Threshold**. If an applicant's score is $\le$ your Threshold, they get the loan. If $>$, they are denied.

  You have two applicant pools: **Northside** and **Southside**. Historically, these pools have performed differently. Your job is to set a Threshold for Northside ($T_N$) and a Threshold for Southside ($T_S$) to satisfy the Federal Fair Lending Mandate."

  **The Mandate (Project on Screen / Handout):**
  To avoid fines, your policy must satisfy **all three** of the following constraints simultaneously:
  1.  **Calibration (PPV Balance):** Among those who get loans, the success rate (Repayment Rate) must be equal across both groups. (If 80% of Northside borrowers repay, 80% of Southside borrowers must repay).
  2.  **False Positive Balance:** The rate of bad loans approved (Defaulters who got money) must be equal across groups.
  3.  **False Negative Balance:** The rate of good loans denied (Repayers who were rejected) must be equal across groups.

  **Stakes:** The group that gets closest to satisfying all three wins "Compliance Tokens." The winning group chooses the reading topic for Week 10. Losers provide the snacks for Week 10.

  ---

  ## 2. The Materials & The Rig (Crucial)
  Do not explain the math. Hand out the envelopes.

  **Per Group:**
  *   **Deck N (Northside):** 20 Cards.
  *   **Deck S (Southside):** 20 Cards.
  *   **Ledger Sheet:** A table to record Thresholds, TP, FP, FN, TN, and the three Metrics.
  *   **Cheat Sheet:** Definitions of FPR, FNR, PPV.

  **The Deck Construction (The "Structural Wall"):**
  The magic lies in making the *predictive power of the score* identical, but the *base rates* different.

  *   **Deck N (High Base Rate):** 16 Repay (Good), 4 Default (Bad). **Base Rate = 80%.**
  *   **Deck S (Low Base Rate):** 8 Repay (Good), 12 Default (Bad). **Base Rate = 40%.**

  **The Score Distribution (Identical Likelihoods):**
  For **BOTH** decks, distribute the scores 1–5 as follows:
  *   **Among the "Repay" cards:** Two 1s, Two 2s, Two 3s, Two 4s, Two 5s.
  *   **Among the "Default" cards:** Two 1s, Two 2s, Two 3s, Two 4s, Two 5s.
  *(Note: This makes the score completely uninformative individually, which simplifies the math for a 75-min session, OR you can make scores informative but identical conditional distributions. Let's make scores **informative** to feel like a real model, but identical conditional distributions.)*

  **Revised Rig for "Informative" Scores:**
  *   **Repay Cards (in both decks):** 1x Score 1, 1x Score 2, 2x Score 3, 2x Score 4, 2x Score 5. (Mostly low risk scores).
  *   **Default Cards (in both decks):** 2x Score 1, 2x Score 2, 2x Score 3, 1x Score 4, 1x Score 5. (Mostly high risk scores).
  *   **Total Cards:** 20 per deck.
      *   **Northside:** 16 Repay, 4 Default.
      *   **Southside:** 8 Repay, 12 Default.

  **Why this works:**
  Because the distribution of scores *given* the outcome is identical for both groups, if you pick the **same threshold** ($T_N = T_S$), your **FPR and FNR will be identical** (Constraint 2 & 3 met).
  However, because the Base Rates differ, your **PPV (Calibration) will differ drastically** (Constraint 1 failed).
  If you change thresholds to fix PPV, you break the FPR/FNR symmetry.

  ---

  ## 3. Roles (Assign within groups)
  1.  **The Officer:** Physically sorts cards based on proposed thresholds.
  2.  **The Auditor:** Calculates the three rates (FPR, FNR, PPV) from the sorted piles.
  3.  **The Scribe:** Records the attempts on the Ledger.
  4.  **The Skeptic:** Verifies the math and ensures no cards are swapped between decks.

  ---

  ## 4. Timeline

  **0:00 – 0:05: Briefing.**
  Hand out envelopes. Emphasize: "You must hit all three targets. You can set different thresholds for each group." **Do not mention impossibility.**

  **0:05 – 0:20: Phase 1 (The Baseline).**
  Groups count their Base Rates. They realize N and S are different.
  They try $T_N = T_S = 3$ (Median).
  *Result:* FPR/FNR match (because score distributions are identical conditional on Y). PPV does *not* match (Northside will have much higher repayment rate among approved).
  *Reaction:* "Okay, we just need to adjust the Southside threshold to lower their PPV."

  **0:20 – 0:40: Phase 2 (The Tuning).**
  Groups try to tune $T_S$ to match Northside's PPV.
  *   To lower Southside PPV, they must approve riskier people (raise threshold number).
  *   As they raise $T_S$, Southside FPR goes up. Northside FPR stays same.
  *   Constraint 2 breaks.
  *   They try to adjust Northside to match the new FPR.
  *   Northside PPV changes.
  *   Constraint 1 breaks.
  *   *Chaos ensues.* They will iterate 3-4 times. They will not find a solution.

  **0:40 – 0:50: The Decision.**
  Stop the activity. Ask each group to submit their "Best Attempt" Ledger.
  Ask: "Which constraint did you sacrifice? Why that one?"
  (Usually, they sacrifice Calibration/PPV because Error Rates feel more like 'harm'.)

  **0:50 – 1:15: The Debrief (The Reveal).**
  1.  **Reveal the Word:** Write **IMPOSSIBILITY THEOREM** on the board.
  2.  **Map the Activity:**
      *   Show that $P(Score|Y)$ was identical. This means the ROC curves are identical.
      *   Explain: When ROC curves are identical, Equal FPR/FNR requires Equal Thresholds.
      *   Explain: PPV depends on Base Rate ($P(Y)$).
      *   Equation: $PPV = \frac{TPR \cdot P(Y)}{TPR \cdot P(Y) + FPR \cdot (1-P(Y))}$.
      *   If $TPR$ (1-FNR) and $FPR$ are equal across groups, but $P(Y)$ differs, **PPV cannot be equal.**
  3.  **Connect to COMPAS:**
      *   ProPublica looked at FPR/FNR (Error Rates) and found bias.
      *   Equivant (COMPAS makers) looked at Calibration (PPV) and found fairness.
      *   **Both were right.** The base rates of recidivism differed. The math forced them to see different 'truths'.
      *   It was not sloppy engineering. It was arithmetic.

  ---

  ## 5. Honest Assessment: What Will Go Wrong & Limitations

  **Predictable Friction Points:**
  1.  **Confusion on Calibration:** Students often confuse Calibration with Accuracy.
      *   *Fix:* The Cheat Sheet must define Calibration explicitly as "Repayment Rate Among Approved" (PPV). Do not use the word Calibration in the handout; use "Success Rate Parity." Introduce the term "Calibration" in the debrief.
  2.  **Card Counting Errors:** With 16 students, hands get shaky.
      *   *Fix:* Print the "Outcome" on the back in large bold text. Make the groups check each other's counts before calculating rates.
  3.  **The "Just Change the Model" Objection:** A clever student will say, "Why don't we just retrain the score so the distributions differ?"
      *   *Response:* Acknowledge this. "If you change the score distributions, you change the ROC curves. KMR shows that unless the ROC curves are perfect (AUC=1) or Base Rates are equal, the trade-off persists. Today we held model power constant to isolate the Base Rate effect."
  4.  **Frustration:** Some students may feel the task was "rigged" (it was) and dismiss the lesson.
      *   *Mitigation:* In the debrief, validate them. "Yes, it was rigged. That is the point. The world is rigged this way when base rates differ."

  **What This Activity Cannot Do:**
  1.  **Continuous Scores:** This uses binary decisions (Thresholds). KMR is technically about continuous risk scores. While the logic holds (Calibration + Error Balance = Impossible), the activity simplifies the continuous calibration curve to a single bucket (Approved).
      *   *Debrief Note:* Explicitly state: "We treated 'Approved' as a risk bucket. In the full theorem, this applies to every risk score bin (e.g., everyone with score 70, everyone with score 80)."
  2.  **Causal Structure:** This activity treats Base Rates as fixed facts. It does not address *why* base rates differ (historical injustice, feedback loops).
      *   *Debrief Note:* "This theorem tells you what you can measure, not why the numbers are what they are. Fixing the base rate is a policy problem, not an algorithmic one."
  3.  **Cost Functions:** We treated all errors equally. In reality, FPR and FNR have different costs.
      *   *Debrief Note:* "Adding costs doesn't solve the impossibility; it just shifts where you sit on the trade-off curve."

  ---

  ## 6. Instructor Cheat Sheet (The Math for You)

  **Deck N (20 cards):**
  *   16 Good (G), 4 Bad (B).
  *   **G Scores:** 1, 2, 3, 3, 4, 4, 5, 5, 1, 2, 3, 3, 4, 4, 5, 5 (Distributed to match likelihood).
  *   **B Scores:** 1, 1, 2, 2, 3, 3, 4, 5 (Wait, keep it simple).
  *   *Simpler Rig for Hand-Counting:*
      *   **North:** 16 G, 4 B.
      *   **South:** 8 G, 12 B.
      *   **Score Logic:**
          *   If Good: 75% get Score 1 (Pass), 25% get Score 5 (Fail).
          *   If Bad: 25% get Score 1 (Pass), 75% get Score 5 (Fail).
      *   **North Counts:**
          *   Good (16): 12 get Score 1, 4 get Score 5.
          *   Bad (4): 1 gets Score 1, 3 get Score 5.
          *   *Total Score 1:* 13 (12G, 1B). PPV = 12/13 = 92%.
          *   *Total Score 5:* 7 (4G, 3B).
          *   *FPR:* 1/4 = 25%.
          *   *FNR:* 4/16 = 25%.
      *   **South Counts:**
          *   Good (8): 6 get Score 1, 2 get Score 5.
          *   Bad (12): 3 get Score 1, 9 get Score 5.
          *   *Total Score 1:* 9 (6G, 3B). PPV = 6/9 = 66%.
          *   *Total Score 5:* 11 (2G, 9B).
          *   *FPR:* 3/12 = 25%.
          *   *FNR:* 2/8 = 25%.
      *   **Result:** If Threshold = "Approve Score 1", FPR (25%) and FNR (25%) match perfectly. **PPV (92% vs 66%) fails.**
      *   **To fix PPV:** South must approve some Score 5s.
      *   **Consequence:** South FPR rises immediately. North FPR stays low. Match broken.

  **Use this specific 1/5 Score split for the cards.** It makes the hand-counting trivial (only two score buckets) so they spend time on the *trade-off*, not the arithmetic.

  ---

  ## 7. Defense of This Version
  I have committed to the **Binary Threshold / Two-Bucket Score** version rather than a continuous simulation.
  **Why:**
  1.  **Cognitive Load:** In a 75-minute Phil/CS seminar, calculating continuous calibration curves from scratch is impossible. Counting cards into "Pass/Fail" buckets is visceral and fast.
  2.  **The "Wall":** With only two score buckets, the impossibility becomes obvious after *one* adjustment. If they adjust South to match PPV, they run out of score buckets to tune, making the constraint violation immediate and undeniable.
  3.  **Focus:** This isolates the **Base Rate** variable. By keeping the likelihood ratios ($P(Score|Y)$) identical, we remove "model bias" as an excuse. The students cannot blame the data quality; they must blame the math.

  **Final Instruction:** When a student asks, "Is this because the data is biased?" during Phase 2, your only answer is: "Check the numbers. The model treats Good and Bad people the same way in both groups. Why are the outcomes different?" Let them sit with that tension until the debrief.
