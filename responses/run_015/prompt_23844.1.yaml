      *   *Calibration:* $P(Y=1 | Score=s, Group=G) = s$. Or, if using thresholds, the positive predictive value (PPV) among those selected should match the risk score. Actually, KMR defines calibration slightly differently (risk scores match outcome frequencies), but for a threshold activity, we usually look at PPV (Precision) or just the definition that if you predict "High Risk", the actual risk matches.
      *   *Equal FPR:* $P(\hat{Y}=1 | Y=0, A) = P(\hat{Y}=1 | Y=0, B)$.
      *   *Equal FNR:* $P(\hat{Y}=0 | Y=1, A) = P(\hat{Y}=0 | Y=1, B)$.
      *   *The Conflict:* If base rates differ, satisfying Error Rate Balance (FPR=FPR' and FNR=FNR') implies PPV (Calibration-ish) must differ. Satisfying Calibration + Error Rate Balance implies Base Rates must be equal.
      *   *Activity Design:* I need discrete populations where students set a cutoff. If they set the same cutoff, FPR/FNR might match (depending on distribution overlap), but Calibration (PPV) will differ. If they set different cutoffs to match PPV, FPR/FNR will diverge.
