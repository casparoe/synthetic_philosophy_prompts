          *   Group B: 20 cards. Scores 1-5 distributed evenly. 8 Repay, 12 Default.
          *   *Problem:* If score distributions are identical, the ROC curves are identical. If ROC curves are identical, you can match FPR/FNR by picking the same threshold. But PPV will differ because Base Rates differ.
          *   *This is the cleanest pedagogical path.* It isolates the Base Rate effect.
          *   *Wait, KMR/Chouldechova:* If FPR and FNR are equal, and Base Rates differ, PPV *must* differ. This is the core insight.
          *   *Activity:* Give them identical score distributions, different base rates. Ask them to match FPR, FNR, and PPV. They will match FPR/FNR easily (same threshold), but PPV will fail. If they change thresholds to match PPV, FPR/FNR will break.

