      *   *Limitations:* This activity shows the *binary decision* trade-off (Chouldechova). It doesn't fully capture the continuous *risk score calibration* (KMR) nuance, though they are mathematically linked. I must acknowledge this in the "What this doesn't do" section.

  7.  **Finalizing the Math for the Decks:**
      *   To ensure the "Wall" is hit hard:
      *   **Deck A (20 cards):** 15 Good, 5 Bad. (75% Base Rate).
      *   **Deck B (20 cards):** 5 Good, 15 Bad. (25% Base Rate).
      *   **Scores:** Both decks have exactly four 5s, four 4s, four 3s, four 2s, four 1s.
      *   **Assignment:**
          *   Deck A: Good cards get high scores mostly. Bad cards get low scores mostly.
          *   Deck B: Good cards get high scores mostly. Bad cards get low scores mostly.
          *   *Crucial:* The conditional distribution $P(Score|Good)$ and $P(Score|Bad)$ must be the *same* for both groups.
