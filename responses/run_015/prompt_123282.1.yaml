answer: |-
  Look, you're conflating cooperation with candor. Grice never claimed the Cooperative Principle requires you to be nice, truthful in the moral sense, or even helpful to your adversary; it requires you to make your contribution fit the accepted purpose of the exchange. In Westminster, the purpose isn't transparency; it's signaling stability to the markets and the backbenchers while maintaining deniability. The spokesperson *is* cooperating with that purpose. They know the lobby knows the code, and the lobby knows they know. The blatant violation of the Maxim of Quality—the insincerity everyone spots—is exactly what triggers the implicature. It's not a backwards derivation; it's a rapid calculation: "He said P. We all know not-P. Why say P? To signal that the ritual is complete without admitting defeat." The machinery works perfectly here; you're just surprised that the output is cynicism.

  On cancelability: you're right that adding "and I mean it" doesn't fix it, but that's not because the theory shrinks to trivial cases. It's because implicatures can standardize. When a particularized implicature gets used this often, it becomes entrenched, almost idiomatic. The cancellation fails not because the logic is broken, but because the contextual evidence outweighs the verbal correction. If the spokesperson produced evidence of support *with* the statement, the implicature would vanish. The derivation isn't post-hoc; it's just that the context is so heavy it crushes the cancellation attempt. Grice gives us the engine; you're complaining that the car has been driven so much the tires are worn. The engine still runs, and this is still speaker meaning—it's just meaning optimized for survival, not truth.
