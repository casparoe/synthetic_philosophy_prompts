answer: |-
  Here is a complete lesson plan designed to generate the Discursive Dilemma (also known as the Doctrinal Paradox) experientially before theoretically.

  ### 1. The Argument and Logic
  You will use a **Tenure Committee** scenario. It is high-stakes, binary, and relies on a conjunctive rule (AND), which is the simplest way to generate the paradox.

  *   **Proposition $P$:** The candidate's **Research** is sufficient for tenure.
  *   **Proposition $Q$:** The candidate's **Teaching** is sufficient for tenure.
  *   **Conclusion $C$:** The candidate is **Granted Tenure**.
  *   **The Logical Constraint:** The University Statute states: Tenure is granted **if and only if** *both* Research and Teaching are sufficient.
      *   Formally: $C \leftrightarrow (P \land Q)$

  ### 2. Preparation (Before Class)
  You need to manufacture the vote distribution. If you let opinions form naturally, the paradox might not appear. You will assign "Private Evaluation Files" to ensure the math works.

  **Prepare 16 Envelopes:**
  *   **6 Envelopes (Type A):** Contain a report saying Research is **Good** and Teaching is **Good**.
  *   **5 Envelopes (Type B):** Contain a report saying Research is **Good** and Teaching is **Poor**.
  *   **5 Envelopes (Type C):** Contain a report saying Research is **Poor** and Teaching is **Good**.

  **The Handout Text (inside every envelope):**
  > **CONFIDENTIAL TENURE FILE**
  > **Candidate:** Dr. Alex Smith
  > **University Statute 4.1:** A candidate shall receive tenure if and only if the committee finds **BOTH** Research **AND** Teaching to be "Sufficient." If either is "Insufficient," tenure must be denied.
  >
  > **Committee Member Instruction:**
  > 1. Review the evidence below regarding Research and Teaching.
  > 2. Vote **YES/NO** on whether Research is Sufficient ($P$).
  > 3. Vote **YES/NO** on whether Teaching is Sufficient ($Q$).
  > 4. Vote **YES/NO** on whether to Grant Tenure ($C$).
  > 5. **Constraint:** You must vote consistently with Statute 4.1 based on the evidence provided.
  >
  > **EVIDENCE:**
  > *[Insert specific Type A, B, or C text here]*

  ### 3. In-Class Procedure (90 Minutes)

  **Phase 1: Setup (10 Minutes)**
  *   Hand out the envelopes randomly as students enter.
  *   **Script:** "You are a tenure committee. You have a private file. Do not show it to anyone. Do not discuss the content with your neighbors. Your goal is to make a decision for the university based *only* on your file and Statute 4.1."
  *   Give them 5 minutes to read and fill out a secret ballot slip (three checkboxes: $P$, $Q$, $C$).

  **Phase 2: The Voting (15 Minutes)**
  *   Collect the ballots.
  *   **Script:** "We will vote publicly on each proposition separately. Raise your hand for YES."
  *   **Vote 1 ($P$ - Research):** Count hands. Write the number on the board (e.g., "Research Sufficient: 11 Yes, 5 No").
  *   **Vote 2 ($Q$ - Teaching):** Count hands. Write the number (e.g., "Teaching Sufficient: 11 Yes, 5 No").
  *   **Vote 3 ($C$ - Tenure):** Count hands. Write the number (e.g., "Grant Tenure: 6 Yes, 10 No").
  *   *Crucial:* Do not comment on the numbers yet. Just write them large on the board.

  **Phase 3: The Realization (15 Minutes)**
  *   **Script:** "Look at the board. Based on these votes, does Dr. Smith get tenure?"
  *   Allow confusion to brew. Students will point out: "Well, Research passed and Teaching passed, so they should get tenure." Others will say: "But the vote on Tenure itself was No."
  *   **Script:** "Did anyone vote inconsistently? Did anyone vote Yes on Research, Yes on Teaching, but No on Tenure?"
  *   (Ideally, no one should have, because their private files forced consistency. If someone did, ask them why. If no one did, emphasize that *every individual* was rational.)
  *   **Script:** "So, every individual was logically consistent. The majority rule was applied fairly. Yet the collective outcome is logically impossible. How is this happening?"
  *   Let them struggle with this for 10 minutes. Do not name the paradox yet.

  **Phase 4: The Debrief & Theory (40 Minutes)**
  *   **Reveal the Distribution:** Admit that you distributed the files to ensure the split (6/5/5). Explain that in the real world, information is distributed asymmetrically like this naturally.
  *   **Map to Formal Structure:**
      *   Draw the truth table for $P \land Q \rightarrow C$.
      *   Show the three voter blocs on the board:
          *   Bloc A (6 voters): $P, Q, C$ (All Yes)
          *   Bloc B (5 voters): $P, \neg Q, \neg C$ (Yes, No, No)
          *   Bloc C (5 voters): $\neg P, Q, \neg C$ (No, Yes, No)
      *   Show the Majority Row: $P$ (Yes), $Q$ (Yes), $C$ (No).
  *   **Introduce the Name:** This is the **Discursive Dilemma** (or Doctrinal Paradox).
  *   **The Core Tension:** Discuss the two aggregation procedures:
      1.  **Premise-Based:** We vote on $P$ and $Q$, and derive $C$ logically. (Result: Tenure Granted).
      2.  **Conclusion-Based:** We vote directly on $C$. (Result: Tenure Denied).
  *   **Discussion Question:** "Which procedure is more democratic? Which is more rational?" (This leads into normative theories of deliberative democracy vs. voting theory).

  **Phase 5: Wrap Up (10 Minutes)**
  *   Summarize why this matters for courts, legislatures, and AI alignment.
  *   Assign reading (e.g., List & Pettit, *Group Agency*).

  ### 4. Predictable Pitfalls (and how to fix them)

  1.  **Strategic Voting:** A student in Bloc B might realize mid-game that if they vote "Yes" on Teaching, Tenure might pass.
      *   *Fix:* Emphasize in the instructions that they are sworn to vote according to their *evidence*, not strategy. Frame it as a "truth-seeking" mission, not a political one.
  2.  **Individual Inconsistency:** A student in Bloc B (Research Good, Teaching Poor) might vote "Yes" on Tenure anyway because they like the candidate.
      *   *Fix:* The Handout must explicitly state Statute 4.1 as a binding constraint. During the debrief, if this happens, use it as a teaching moment: "Individual irrationality is a different problem; today we assumed everyone was rational."
  3.  **The "Rigged" Complaint:** Students may feel cheated that you assigned the votes.
      *   *Fix:* Acknowledge it openly. "I rigged the *distribution* to guarantee the paradox appears in 90 minutes. In the real world, this distribution happens organically because people prioritize different values (research vs. teaching). The math is the same."
  4.  **Counting Errors:** With 16 students, a miscount ruins the reveal.
      *   *Fix:* Count twice. Or, have students submit ballots to you, and you project the tally using a document camera.

  ### 5. Limitation: What This Activity Cannot Reproduce

  This activity demonstrates that **Majority Rule** can produce inconsistent collective judgments. It does **not** reproduce the full strength of the **List-Pettit Impossibility Theorem**.

  *   **The Activity Shows:** Majority voting fails on this specific logical structure (conjunction).
  *   **The Theorem Proves:** *No* aggregation function (not just majority) can satisfy a set of minimal democratic conditions (Universal Domain, Anonymity, Systematicity) and guarantee consistency for *any* set of interconnected propositions.
  *   **The Gap:** Students might leave thinking, "Okay, so don't use Majority Rule; use a different voting system." The activity does not prove that *every* other voting system will also fail under certain conditions. It isolates the failure of simple majoritarianism, not the impossibility of rational group agency in general.

  ### 6. Board Plan (Visual Aid)

  Draw this *after* the votes are tallied to cement the realization.

  | Voter Group | Count | Research ($P$) | Teaching ($Q$) | Tenure ($C$) |
  | :--- | :---: | :---: | :---: | :---: |
  | **Type A** | 6 | Yes | Yes | Yes |
  | **Type B** | 5 | Yes | No | No |
  | **Type C** | 5 | No | Yes | No |
  | **MAJORITY** | **16** | **Yes (11)** | **Yes (11)** | **No (10)** |

  **Bottom of Board:**
  $P = \text{True}$
  $Q = \text{True}$
  $C = \text{False}$
  **Violation:** $C \leftrightarrow (P \land Q)$
