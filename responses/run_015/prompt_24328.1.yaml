          *   Group 2 (Teaching Focus): Thinks Research is Good, Teaching is Bad. (Vote Y, N, N).
          *   Group 3 (Budget/Colleague Focus): Thinks Research is Bad, Teaching is Good. (Vote N, Y, N).
