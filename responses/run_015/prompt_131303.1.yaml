prompt: |-
  You advise a deployment-safety reviewer at a mid-sized technology firm who must sign off on “low-impact” or “side-effect-avoiding” AI systems—narrow task models such as warehouse-routing optimizers, inventory-forecasting tools, or document-classification pipelines—without possessing or being permitted to invoke a full specification of human values. The reviewer receives proposals that claim the system avoids side effects, but she knows the conceptual difficulty: defining what counts as a side effect typically seems to presuppose knowing which states of the world are valuable or harmful, and she has no such global utility map. She needs a reusable, written decision procedure—ordered questions, criteria for sufficient answers, explicit stop points (approve, reject, or escalate to a values committee), and clear flags for steps that are irreducibly judgment calls rather than factual checks. The procedure must be runnable in under thirty minutes by someone with engineering literacy but no philosophy background, must say what to do when a quantitative answer is unavailable, and must be honest about where it will misfire or produce answers the reviewer will not like. Ground the procedure in the specific conceptual claim that “avoid side effects” can be partially defined without full value specification by using causal-boundary preservation and option-space metrics—measuring whether the system’s outputs remain within a pre-specified task domain and whether they reduce or preserve the range of future actions available to affected parties—while conceding that any weighting of those metrics still smuggles in normative commitments. Apply the procedure to three concrete proposals: (1) a warehouse-routing algorithm that lowers energy consumption but restructures worker movement patterns and informal social interactions on the floor; (2) a medical-triage scheduling tool that improves average wait times but, through data-feature correlations, subtly shifts the demographic composition of patients seen in the first hour without any explicit harm metric being violated; and (3) a public-discourse content-filter that suppresses borderline political speech to avoid “toxic” outputs, where the procedure’s technical checks suggest approval because no physical harm or legal liability occurs within the causal boundary, yet the reviewer will find that result unacceptable—explain exactly where the procedure hands the decision back to values and why it cannot reject the proposal on its own terms. Finally, state precisely what the procedure cannot do: which categories of impact it systematically misses, which value-laden premises remain hidden inside its apparently neutral metrics, and under what conditions it should be suspended entirely.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **Role:** Advisor to a deployment-safety reviewer at a mid-sized tech firm.
      *   **Task:** Create a reusable, written decision procedure for signing off on "low-impact" or "side-effect-avoiding" AI systems.
      *   **Constraint 1 (Epistemic):** The reviewer *cannot* possess or invoke a full specification of human values (no global utility map).
      *   **Constraint 2 (Operational):** Must be runnable in under 30 minutes by someone with engineering literacy but no philosophy background.
      *   **Constraint 3 (Content):** Must include ordered questions, criteria for sufficient answers, explicit stop points (Approve, Reject, Escalate), and flags for judgment calls.
      *   **Constraint 4 (Honesty):** Must state what to do when quantitative answers are unavailable and admit where it will misfire or produce unliked results.
      *   **Theoretical Grounding:** Ground the procedure in "causal-boundary preservation" and "option-space metrics" (preserving future actions), while conceding that weighting these metrics involves normative commitments.
      *   **Application:** Apply the procedure to three specific cases:
          1.  Warehouse routing (energy vs. worker social patterns).
          2.  Medical triage (wait times vs. demographic shifts).
          3.  Content filter (suppressing borderline speech, technically safe but ethically dubious).
      *   **Limitations:** State precisely what the procedure *cannot* do (missed impacts, hidden premises, suspension conditions).

  2.  **Theoretical Framework Development:**

      *   *Problem:* How to define "side effects" without knowing "good" vs. "bad"?
      *   *Proposed Solution:* Focus on *boundaries* and *options*.
      *   *Causal-Boundary Preservation:* Does the system affect things outside its intended scope? (e.g., A routing algorithm should affect routes, not break machines or change hiring).
      *   *Option-Space Metrics:* Does the system reduce the ability of humans to act later? (e.g., Does it lock users into a path? Does it remove resources?)
      *   *Acknowledgement:* This isn't value-neutral. Deciding *which* boundaries matter and *whose* options count is normative. The procedure must highlight this.

  3.  **Drafting the Procedure (The "Protocol"):**

      *   *Name:* Needs to sound official but descriptive. "Causal-Boundary and Option-Preservation Protocol (CBOPP)."
      *   *Structure:*
          *   Phase 1: Scope & Boundary Definition (Engineering check).
          *   Phase 2: Option-Space Impact (Quantitative/Qualitative check).
          *   Phase 3: The "Unknowns" & Judgment Flags.
          *   Phase 4: Decision Matrix.
      *   *Timing:* Keep steps concise.
      *   *Stop Points:* Clear "If X, then Stop."

  4.  **Developing the Three Case Studies:**

      *   *Case 1 (Warehouse):*
          *   Boundary: Physical safety? Yes. Operational scope? Yes.
          *   Options: Does it stop workers from talking? No, but it changes *how* they move.
          *   Result: Likely Approve with monitoring, but flag the social change as a "Hidden Normative Cost."
      *   *Case 2 (Medical Triage):*
          *   Boundary: Wait times improved.
          *   Options: Does it block care? No.
          *   Nuance: Demographic shift. Is this a boundary violation? Technically no, but ethically yes (fairness).
          *   Result: Escalate. The "demographic shift" is an option-space reduction for a specific group, even if not explicit.
      *   *Case 3 (Content Filter):*
          *   Boundary: No physical harm, no legal liability.
          *   Options: Reduces speech options.
          *   The Catch: The procedure says "Approve" based on physical/legal safety, but the reviewer knows this is wrong.
          *   Result: This demonstrates the failure mode. The procedure approves, but the "Judgment Flag" forces escalation.

  5.  **Refining the Limitations Section:**

      *   What does it miss? Distributional fairness, long-term cultural shifts, intrinsic dignity violations.
      *   Hidden premises: That "options" are the only thing that matters. That the defined "boundary" is the *right* boundary.
      *   Suspension: When stakes are existential or rights-based.

  6.  **Writing - Tone and Style:**

      *   Professional, directive, slightly cautious.
      *   Avoid jargon where possible, but use the required theoretical terms (causal boundary, option space).
      *   Ensure the "30-minute" constraint is respected (keep it checklist-style).

  7.  **Self-Correction/Review during Drafting:**

      *   *Critique:* Is the procedure too vague?
      *   *Fix:* Add specific thresholds (e.g., "If option reduction > 5%...").
      *   *Critique:* Did I address the "no philosophy background" constraint?
      *   *Fix:* Explain "option space" simply as "ability to do other things later."
      *   *Critique:* Did I handle the "unavailable quantitative answer" constraint?
