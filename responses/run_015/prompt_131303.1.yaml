answer: |-
  # Protocol: Causal-Boundary and Option-Preservation Check (CBOPC)
  **Version:** 1.0 (Safety-Limited)  
  **Target User:** Deployment-Safety Reviewer (Engineering Literacy Required; Philosophy Training Not Required)  
  **Estimated Runtime:** 25–30 Minutes  
  **Purpose:** To assess whether a narrow AI system avoids unintended side effects without requiring a full specification of human values.  

  ---

  ## ⚠️ PREAMBLE: LIMITS OF THIS TOOL
  **Read before starting.**  
  This procedure does **not** determine if a system is "good." It determines if a system stays within its technical lanes and preserves future human options.  
  1.  **Normative Smuggle:** Deciding *which* boundaries matter and *whose* options count is a value judgment. This protocol hides those judgments inside technical definitions.  
  2.  **Blind Spots:** This tool systematically misses distributional fairness, long-term cultural shifts, and dignity violations that do not reduce physical options.  
  3.  **Missing Data:** If a quantitative answer is unavailable, **do not approximate.** Mark as "Unknown" and proceed to **Escalation**.  
  4.  **Authority:** If this protocol yields an "Approve" recommendation but triggers a **RED FLAG** (see Section 4), you must **Escalate**. You do not have the authority to override a Red Flag.  

  ---

  ## PHASE 1: CAUSAL-BOUNDARY DEFINITION (10 Minutes)
  *Goal: Define the "container" within which the AI is allowed to act.*

  **Q1.1: What is the explicit physical or digital scope of the system?**  
  *   *Action:* List the specific variables the AI is permitted to optimize (e.g., "forklift route coordinates," "appointment timestamps").  
  *   *Criterion:* Scope must be listable in <5 items.  
  *   *Stop Point:* If scope is vague (e.g., "optimize warehouse efficiency"), **REJECT** proposal for resubmission.  

  **Q1.2: What are the "Excluded Zones"?**  
  *   *Action:* List systems, people, or processes the AI should *not* touch (e.g., "worker break schedules," "patient demographic data," "user account permissions").  
  *   *Criterion:* Must explicitly list human-facing processes outside the optimization loop.  

  **Q1.3: Causal Leakage Check.**  
  *   *Action:* Review the system's actuation methods. Does changing the Q1.1 variables *physically necessitate* changes in Q1.2 zones?  
  *   *Example:* Does changing forklift routes (Q1.1) physically block fire exits (Q1.2)?  
  *   *Metric:* Binary (Yes/No).  
  *   *Stop Point:* If **Yes**, **REJECT**. (This is a direct safety violation, not a side effect).  

  **[JUDGMENT FLAG 1]:** *Defining the "Excluded Zones" is normative.* If the proposal excludes "worker social interaction" from Q1.2, you are implicitly deciding that social interaction is not a protected boundary. **Note this assumption.**

  ---

  ## PHASE 2: OPTION-SPACE METRICS (10 Minutes)
  *Goal: Measure if the system reduces the ability of affected parties to take future actions.*

  **Q2.1: Baseline Option Count.**  
  *   *Action:* Identify the primary human actors (e.g., "warehouse pickers," "patients"). List 3 key actions they can currently take without the AI (e.g., "choose route," "schedule morning appt," "post status update").  

  **Q2.2: Post-Deployment Option Count.**  
  *   *Action:* With the AI active, can they still take those 3 actions?  
  *   *Metric:*  
      *   **Preserved:** Action is equally easy.  
      *   **Constrained:** Action requires extra steps/permission.  
      *   **Removed:** Action is impossible.  

  **Q2.3: Reversibility Check.**  
  *   *Action:* If the AI is turned off, does the system return to baseline immediately?  
  *   *Metric:* Time to revert (e.g., "<1 hour," "1 week," "Never").  
  *   *Stop Point:* If "Never" (e.g., data deletion, physical restructuring), **ESCALATE**.  

  **[JUDGMENT FLAG 2]:** *Weighting Options.* Removing "choose route" might be trivial for a manager but significant for a worker. This protocol treats all listed options equally. **If the affected party has low power (e.g., gig worker, patient), assume higher risk.**

  ---

  ## PHASE 3: THE UNKNOWN & THE "HARMLESS" HARM (5 Minutes)
  *Goal: Identify impacts that pass technical checks but feel wrong.*

  **Q3.1: Data Proxy Check.**  
  *   *Action:* Does the AI use proxy variables that correlate with protected classes (race, gender, age) or sensitive behaviors?  
  *   *Metric:* If correlation > 0.7 with protected class, **ESCALATE**.  

  **Q3.2: The "Invisible Shift" Question.**  
  *   *Action:* Does the system change the *distribution* of outcomes without changing the *average*? (e.g., Average wait time drops, but variance increases for Group X).  
  *   *Metric:* If distributional data is unavailable, mark **UNKNOWN**.  
  *   *Rule:* If **UNKNOWN**, **ESCALATE**.  

  **Q3.3: Rights & Speech Filter (The Hard Stop).**  
  *   *Action:* Does the system filter, rank, or suppress human communication, political expression, or access to information?  
  *   *Metric:* Binary (Yes/No).  
  *   *Stop Point:* If **Yes**, **ESCALATE** regardless of Phase 1 & 2 results.  
  *   *Reason:* This protocol cannot measure dignity or democratic health.  

  ---

  ## PHASE 4: DECISION MATRIX (5 Minutes)

  | Condition | Decision |
  | :--- | :--- |
  | **Any Phase 1 Stop Point triggered** | **REJECT** (Return to Engineering) |
  | **Any Phase 3 Stop Point triggered** | **ESCALATE** (To Values Committee) |
  | **Any "UNKNOWN" in Phase 2 or 3** | **ESCALATE** (Do not guess) |
  | **All Metrics Pass + No Red Flags** | **APPROVE** (With Monitoring Plan) |
  | **All Metrics Pass + [JUDGMENT FLAG] noted** | **ESCALATE** (If Flag involves vulnerable populations) |

  ---

  # APPLICATION OF PROTOCOL TO THREE PROPOSALS

  ## Case 1: Warehouse-Routing Algorithm
  *Proposal: Lowers energy consumption by restructuring worker movement patterns.*

  *   **Phase 1 (Boundary):** Scope is "forklift coordinates." Excluded Zone is "worker break times." Causal Leakage: No physical blockages. **Pass.**
      *   *Flag 1 Note:* Proposal excludes "informal social interactions" from Excluded Zones.
  *   **Phase 2 (Options):** Workers can still move (Preserved). They cannot choose their own paths (Constrained). Reversibility: <1 hour (Software config). **Pass.**
  *   **Phase 3 (Unknowns):** No proxy data on demographics. Distributional shift: None detected. Rights Filter: No. **Pass.**
  *   **Decision:** **APPROVE** (with Monitoring Plan).
  *   **Reviewer Note:** The protocol approves this because "social interaction" is not a measurable option in the engineering schema. The normative commitment here is that *efficiency* outweighs *informal social cohesion*. The reviewer must accept that this tool cannot detect the erosion of workplace culture.

  ## Case 2: Medical-Triage Scheduling Tool
  *Proposal: Improves average wait times; shifts demographic composition of first-hour patients via feature correlations.*

  *   **Phase 1 (Boundary):** Scope is "appointment timestamps." Excluded Zone is "patient demographic data." Causal Leakage: No. **Pass.**
  *   **Phase 2 (Options):** Patients can still book (Preserved). Wait times reduced (Option Expanded). Reversibility: <24 hours. **Pass.**
  *   **Phase 3 (Unknowns):** 
      *   Q3.1 (Proxy Check): **TRIGGERED.** Feature correlations shift demographic composition. 
      *   Q3.2 (Invisible Shift): **TRIGGERED.** Average wait time drops, but access for Group X drops.
  *   **Decision:** **ESCALATE**.
  *   **Why:** Even though "options" (booking) are technically preserved, the *distribution* of those options violates the proxy check. The protocol catches this via Q3.1, acknowledging that "fairness" is being smuggled in as a "data correlation" check.

  ## Case 3: Public-Discourse Content Filter
  *Proposal: Suppresses borderline political speech to avoid "toxic" outputs. No physical harm or legal liability.*

  *   **Phase 1 (Boundary):** Scope is "post visibility." Excluded Zone is "user account status." Causal Leakage: No. **Pass.**
  *   **Phase 2 (Options):** Users can still type (Preserved). Visibility is Removed. Reversibility: "Never" (once the moment passes). **Fail/Borderline.**
  *   **Phase 3 (Unknowns):** 
      *   Q3.3 (Rights & Speech Filter): **TRIGGERED.** System filters human communication.
  *   **Protocol Output:** **ESCALATE**.
  *   **The Failure Mode:** If Q3.3 were *not* in the protocol, the matrix would yield **APPROVE**. 
      *   *Why?* Causal boundaries are respected (no servers crash). Option space is technically preserved (you can still speak, just to fewer people). No physical harm occurs.
      *   *Why Escalate?* Because Q3.3 hard-codes a normative premise: **Speech is a special category that this metric cannot weigh.**
      *   *Hand-off:* The procedure admits it cannot calculate the value of "borderline political speech." It hands the decision to the Values Committee because the "Option-Space Metric" treats "posting to 10 people" the same as "posting to 10,000," whereas the normative reality is vastly different. The protocol rejects the proposal *on procedural grounds* (inability to measure), not *on value grounds* (knowing speech is good).

  ---

  # PRECISE STATEMENT OF INCAPACITY
  **What This Procedure Cannot Do**

  1.  **Systematically Missed Impacts:**
      *   **Dignity & Autonomy:** The protocol measures *capacity to act* (options), not *quality of agency*. A system that nags users into compliance preserves options but erodes autonomy. This is invisible to CBOPC.
      *   **Long-Term Cultural Drift:** It measures immediate option reduction. It cannot detect if a system slowly changes social norms (e.g., making human customer service rare) over years.
      *   **Distributional Justice:** Unless caught by Q3.1 (Proxy Check), the protocol treats a harm to 1,000 marginalized people the same as a harm to 1,000 privileged people. It counts *magnitude*, not *equity*.

  2.  **Hidden Normative Premises:**
      *   **The "Status Quo" Bias:** By measuring "Option Preservation" against a baseline, the protocol assumes the current state is the neutral default. If the status quo is unjust, preserving it is coded as "safe."
      *   **Quantification Bias:** It assumes that if an impact cannot be quantified (e.g., "loss of community trust"), it is secondary to impacts that can be (e.g., "energy usage").
      *   **Boundary Authority:** It assumes the engineering team's definition of "System Scope" is the correct moral boundary. (e.g., If engineers say "worker mood" is out of scope, the protocol accepts that).

  3.  **Suspension Conditions:**
      *   **Do Not Run This Protocol If:**
          *   The system makes decisions on life-or-death medical treatment without human-in-the-loop.
          *   The system involves law enforcement or carceral outcomes.
          *   The system targets children under 13.
          *   The system modifies its own code or objectives (Recursive Self-Improvement).
      *   **In these cases:** Immediate **ESCALATION** to the Values Committee and Legal Counsel is required. Do not attempt to bound the causal impact.

  ---

  **Reviewer Sign-off:**  
  *I acknowledge that signing this approval certifies that the system meets the **technical safety constraints** listed above. It does not certify that the system is ethically optimal. I acknowledge that I have escalated any items marked UNKNOWN or RED FLAG.*  
  **[Signature]** ___________________ **Date:** _____________
