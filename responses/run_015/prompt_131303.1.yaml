  8.  **Final Polish:** Check against all prompt requirements one last time.
      *   Reusable written procedure? Yes.
      *   Ordered questions/criteria/stop points? Yes.
      *   Flags for judgment calls? Yes.
      *   Under 30 mins? Yes (checklist format).
      *   What to do when quantitative answer unavailable? Yes (Escalate).
      *   Honest about misfires? Yes (in Limitations).
      *   Grounded in causal-boundary/option-space? Yes.
      *   Three concrete proposals applied? Yes.
      *   Precise statement of what it cannot do? Yes.

  9.  *(Final thought on the "Values Committee" aspect)*: Make sure the escalation path is clear. The reviewer isn't deciding the values; they are deciding if the *technical* safety holds, and if the *normative ambiguity* is too high.

  10. **Proceed to generate output.** (Mental outline complete).

