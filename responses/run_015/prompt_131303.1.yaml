  *Correction:* The prompt asks to explain where the procedure hands the decision back to values. So the procedure should technically say "Pass" on metrics, but the "Judgment Flag" section says "If this involves speech, Escalate." I will structure it so the *metrics* say one thing, but the *protocol* forces a stop.

