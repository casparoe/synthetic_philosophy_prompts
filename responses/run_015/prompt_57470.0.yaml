answer: |-
  Based on the voting record you've described, here is my assessment of your friend's position, the principle she is applying, and where the fault lines lie.

  ### The Vote
  She votes for the **two later researchers**. She leaves the postdoc out entirely.

  ### The Unstated Principle
  The rule she is running is a strict interpretation of the Mertonian norm of **Communism** (in the sociological sense): *Scientific knowledge is the common property of the community; it does not exist as 'science' until it is effectively communicated and integrated into the public domain.*

  To her, a discovery is not an event that happens in a mind, but an event that happens in the literature. This explains the 1930s manuscript verdict ('in a drawer isn't doing science') and the derivation verdict (the first result wasn't 'secure' knowledge until the second person provided the defensible proof). It also explains the Newton/Leibniz and Three Labs refusals: if the knowledge was 'coming anyway' or dependent on general resource availability rather than unique insight, the individual claim is weakened. But the hard line is publication. The postdoc's work, however unjustly suppressed, remained private. Therefore, in her view, it did not *do* anything for the field until the later groups published.

  ### The Rival Rule
  There is, however, a competing principle that fits all six of her previous verdicts equally well but would force a different outcome here. Let's call it the **Principle of Intellectual Proprietorship and Fairness**.

  Under this rule, credit is owed to the person who first secured the truth, provided the failure to publish was not due to their own negligence or lack of rigour.
  *   **Newton/Leibniz:** No award, because the process was corrupt (Newton judging his own case), violating fairness.
  *   **Darwin/Wallace:** Joint credit required, because Wallace had proprietary claim to the insight.
  *   **1930s Manuscript:** No award, because the field already had the pieces (no unique proprietorship), *not* primarily because it was unpublished.
  *   **Technician:** Credit due, because they held proprietary claim to the instrument's creation.
  *   **Three Labs:** No award, because no single group held unique proprietorship (simultaneous resource luck).
  *   **Derivation:** Second person wins, because the first did not actually possess the *truth* (only the result), so they had no valid property claim.

  **The Divergence:** In the new case, the **Proprietorship Rule** would award the prize to the **postdoc** (perhaps shared with one of the later groups if the rules demand two names, but primarily the postdoc). The postdoc secured the truth first; the failure to publish was due to external suppression, not negligence. To ignore her is to reward the supervisor's misconduct.

  ### The Deciding Case
  To settle which rule she is actually running, you would need to present her with the case of **Gregor Mendel**.

  Mendel published his work on pea plants in 1866. It was effectively ignored until 1900, when three different botanists (de Vries, Correns, and Tschermak) rediscovered the laws of inheritance independently.
  *   **If she runs the Communality Rule:** She should award the 1900 rediscoverers. Mendel's work did not enter the 'commons' or alter the trajectory of the field until 1900. His publication was functionally equivalent to being in a drawer.
  *   **If she runs the Proprietorship Rule:** She must award Mendel. He had the insight, he published (even if ignored), and the 1900 group merely confirmed what was already truthfully established.

  History, of course, gives the credit to Mendel. If your friend balks at awarding the 1900 group over Mendel, she is running the Proprietorship Rule and is being inconsistent on the postdoc. If she sticks with the 1900 group, she is consistent, but her rule is cold.

  ### Is Her Rule Right?
  Her rule is the **functional** right one, but not necessarily the **moral** one.

  Scientific prizes are not merely rewards for past labour; they are signposts for the community. They tell researchers what counts as a contribution. If you award the postdoc, you incentivise a system where priority claims can be held in reserve for decades, potentially stifling progress if the holder is silenced or inactive. By awarding the later groups, she reinforces the norm that *science must be live to count*.

  However, it is a rule born of habit and systemic convenience. It protects the integrity of the record, but it washes its hands of the human cost. In the 1930s case, the man chose not to publish. In this case, the postdoc was *silenced*. Your friend's rule treats both as identical: no public entry, no credit. That is consistent, but it fails to distinguish between abdication and suppression. She is prioritising the health of the ecosystem over the justice due to the individual organism. It is the correct stance for a jury protecting the prize's prestige, but it is a poor stance for a colleague protecting a friend.
