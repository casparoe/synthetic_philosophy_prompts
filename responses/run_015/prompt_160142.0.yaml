answer: |-
  ### Name, if there is one

  There is no canonical term, though "fragile performativity" captures the contrast with robust mechanisms like bank runs. Jon Elster describes this as states that cannot be directly aimed at (the "hedonic paradox" applied to belief), sometimes termed **essential opacity**. In social theory, Michel Callon distinguishes between "barren" and "fertile" performativity, but your contrast is about stability under scrutiny. Some epistemologists refer to this as **doxastic fragility** under instrumentalization. The phenomenon resembles what Sartre called "bad faith" when recognized, but structurally it is a **self-defeating instrumentalization**. You are describing beliefs that are quite causally effective only if held truly non-instrumentally.

  ### Neighbours and non-neighbours

  James's "genuine options" address evidential ambiguity where the truth of the proposition is logically independent of the believer's stance; your cases involve truth *causally dependent* on the stance. James permits belief without sufficient evidence; you describe belief that *generates* its own evidence retroactively. Pragmatic encroachment argues high stakes raise knowledge thresholds, affecting justification, not truth-makers. Your phenomenon alters metaphysics: the belief is a causal ingredient in the fact believed. Unlike standard self-fulfilling prophecies (bank runs), robust to publicity, your cases are fragile. This isn't merely about practical rationality overriding epistemic norms; it is about epistemic norms conflicting with the causal conditions required for the belief's success. The distinction is composite: separating evidential from causal truth-makers, and robust from fragile performativity. Standard pragmatic arguments assume believers can acknowledge motives; your cases require the motive remain hidden from the believer to function. Thus, it differs from both James and encroachment by introducing an opacity condition essential to the truth-condition itself. In encroachment, knowing the stakes doesn't destroy knowledge; in your cases, knowing the mechanism destroys the truth. This makes it a unique structural problem, distinct from mere pragmatic justification.

  ### The distinction, defined, with boundary cases

  Define this as **Opaque Performativity**: a belief causes its own truth condition only if held non-instrumentally. The causal loop requires the agent's ignorance of the loop. In group contexts, this manifests as collective effervescence or morale; if the group analyzes its own confidence as a tactic, cohesion fractures. A political campaign works only if participants treat victory as inevitable, not pretended. The boundary lies in the depth of opacity required. A teacher might sustain expectation despite knowing the theory if she focuses intensely on the child (distraction), but deliberate self-deception is unstable. However, boundary cases exist where opacity is restored through habituation: a trader acts confidently until it becomes second nature, no longer feeling instrumental. Conversely, a bank run is **Transparent Performativity**: the mechanism survives scrutiny because the incentive structure remains regardless of awareness. The crucial difference is whether the belief functions as a *reason* or a *cause*. In opaque cases, it must function as a reason for the holder, even if it is a cause for the observer. If the holder sees it only as a cause, it ceases to function as a reason, collapsing the effect. Self-deception attempts to bridge this by hiding the causal story from the conscious self, but ethics of belief must assess whether such hiding is permissible. Group beliefs add complexity: cynicism infects others, making opacity a public good requiring policing. Thus, the distinction rests on whether the belief's efficacy survives reflexive scrutiny. In opaque cases, reflexivity is toxic; in transparent, neutral or amplifying.

  ### Verdict for an ethics of belief

  An ethics of belief cannot simply forbid these beliefs as irrational, nor endorse them as straightforwardly rational. Clifford's evidentialism fails as evidence is unavailable ex ante; James's voluntarism fails as direct willing destroys the belief. The verdict is a **procedural indirectness**. We are permitted to cultivate practices that naturally generate such beliefs, but forbidden to adopt them instrumentally. The ethicist must distinguish between holding a belief and managing the conditions under which beliefs form. Self-deception is generally vicious, but **strategic ignorance** regarding the causal mechanism may be virtuous if it sustains a valuable truth. However, this creates a tension: the believer must be protected from the truth about their believing. Thus, the ethics of belief must accommodate **protected doxastic spaces** where instrumental reasoning is suspended. Seeking truth about the mechanism destroys the truth believed. Thus, the ethic is **doxastic humility**: acknowledge utility but refrain from internal instrumentalization.
