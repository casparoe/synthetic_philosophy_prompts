prompt: |-
  I sit on the research ethics committee of a large hospital system, and last night I had a long and unresolved argument with a friend — a health economist — about a rule our committee applies, which I can no longer tell is principled or merely a codified quirk of intuition.

  The rule works in two tiers. When a risk is what we call modelled uncertainty — we agree on the shape of the probability distribution but not on its parameters — we aggregate by averaging over our uncertainty and put the resulting single number into an ordinary expected-value test. When the risk is what we call open uncertainty — the experts cannot agree on a model at all, so there is no probability that anyone can defend, the situation of the Ellsberg urn in which you are told only that 30 of 90 balls are red and the remaining 60 are black and yellow in some unknown proportion — we stop averaging and evaluate the proposal against the worst case within the range the experts do agree on. And a known mixture is explicitly treated as ordinary risk, not as open uncertainty: if a fair coin will decide whether those 60 non-red balls are all black or all yellow, the rule tells us to treat the resulting gamble as a simple 50/50 risk and to average, even though the coin has not yet been tossed and the composition at the moment of the decision is, as a matter of fact, just as unsettled as in the urn case.

  My friend made three charges. First, that the coin case and the urn case are informationally on a par and differ only in the provenance of the numbers, so the rule presupposes that the source or precision of a probability, and not merely its value, can matter to rational choice — which she says is simply the Ellsberg finding promoted into policy, and is a description-sensitivity that counts as a bias by the lights of the very framework we use in the first tier. Second, that averaging and worst-casing differ only in the input: taking the worst case across a set of models is numerically just expected-value maximisation under the most pessimistic member of that set, so either our two tiers are not really two different attitudes, or the rule is committed to something about where the set comes from. Third, she pointed at a wider inconsistency: the law of negligence holds people responsible only for risks that were reasonably foreseeable, and informed consent requires disclosure only of known risks, so unknowable risk seems to be weighed at nothing there — while the precautionary principle, as it gets used in environmental and health regulation, does the opposite and treats the very absence of defensible probabilities as a reason to restrict.

  What I want is the implicit theory, not a verdict on our rule in the abstract. Reconstruct the view of rational choice under uncertainty that the two-tier rule presupposes, and separate what it strictly presupposes from what it merely fits well with. Does treating open uncertainty by worst case while treating modelled uncertainty by averaging commit us to ambiguity aversion being rationally permissible or even required, as opposed to a bias to be corrected? Does the known-mixture clause show that what the rule really tracks is the source or precision of a probability rather than any feature of the world — and if so, is that defensible? Is the two-tier structure a genuine departure from expected-value reasoning at all, given that worst-casing over a set of models is extensionally the same as expected-value reasoning under one pessimistic distribution, or does the departure lie elsewhere: in how the set gets fixed, in what counts as a defensible probability, in the refusal to let merely ambiguous new evidence shrink it? And are the negligence rule and the precautionary principle really in conflict, or do they presuppose consistent things once you distinguish the question of what to do from the question of whom to blame? Finally: if we abandoned the implicit view and adopted my friend's single-probability picture wholesale, what exactly in our rule, and in the wider legal and regulatory pattern, would have to change — and what, if anything, would we lose by changing it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Context:** The user sits on a hospital research ethics committee (REC). They have a specific two-tier rule for evaluating risk under uncertainty.
      *   **The Rule:**
          *   Tier 1 (Modelled Uncertainty): Agree on distribution shape, disagree on parameters. Action: Average over uncertainty (Expected Value/EV).
          *   Tier 2 (Open Uncertainty/Ambiguity): Disagree on the model itself (Ellsberg urn style). Action: Worst-case evaluation (Maximin) within the agreed range.
          *   Clause (Known Mixture): If a random mechanism (coin toss) determines the model, treat it as Tier 1 (EV), even if physically identical to Tier 2 at the moment of decision.
      *   **The Friend's Charges (Health Economist):**
          1.  *Informational Parity:* Coin case vs. Urn case are informationally identical. Distinguishing them is "description sensitivity" (Ellsberg paradox), which is a bias in standard rational choice theory.
          2.  *Mathematical Equivalence:* Worst-casing is just EV under a pessimistic prior. So, are the tiers actually different attitudes, or just different inputs?
          3.  *Legal/Regulatory Inconsistency:* Negligence/Informed Consent ignore unknowable risks (weigh at zero), while Precautionary Principle penalizes them (weigh heavily).
      *   **The Goal:** Reconstruct the *implicit theory of rational choice* presupposed by the rule. Distinguish strict presuppositions from mere fit. Address specific questions:
          *   Is ambiguity aversion permissible/required?
          *   Does the known-mixture clause imply tracking source/precision rather than world features? Is that defensible?
          *   Is the two-tier structure a genuine departure from EV reasoning?
          *   Are Negligence and Precautionary Principle in conflict?
          *   What would be lost if we adopted the friend's single-probability picture?

  2.  **Analyze the Implicit Theory:**

      *   *Core Tension:* The rule distinguishes between *Risk* (known probabilities) and *Ambiguity* (unknown probabilities), but adds a twist: *Procedural Randomization* converts Ambiguity back into Risk.
      *   *Philosophical Underpinnings:* This sounds like a hybrid of Bayesianism (Tier 1) and MaxMin/Robust Decision Making (Tier 2), with a specific caveat about *epistemic authority* or *defensibility*.
      *   *The "Known Mixture" Clause:* This is the crux. Why does a coin toss change the ethical status? It suggests the committee cares about *accountability* and *justifiability* of the probability assignment, not just the ontological state of the world. If I can point to a physical coin, I am defensible. If I point to an expert guess, I am vulnerable.
      *   *Ambiguity Aversion:* The rule *institutionalizes* ambiguity aversion. It treats it not as a psychological bias to be arbitrated away, but as a rational response to epistemic fragility.

  3.  **Address the Friend's Charges:**

      *   *Charge 1 (Informational Parity):* The friend is right ontologically (state of the world is the same) but wrong pragmatically (epistemic warrant is different). The rule presupposes that *warrant* matters for rational choice in an institutional setting.
      *   *Charge 2 (Math Equivalence):* Mathematically, MaxMin $\equiv$ EV with a specific prior. But *conceptually*, they differ. EV implies confidence in the prior. MaxMin implies lack of confidence. The departure lies in the *refusal to commit to a single prior* when evidence doesn't support it.
      *   *Charge 3 (Legal/Regulatory):* Negligence is backward-looking (blame). Precaution is forward-looking (action). They serve different functions. One requires causation/foreseeability for blame; the other requires safety margins for permission.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the problem. Validate that the rule isn't just a quirk; it embodies a specific, defensible normative stance often found in institutional ethics (distinct from individual rationality).
      *   **1. The Implicit Theory: Epistemic Defensibility over Ontological State.**
          *   The rule isn't about the world; it's about the *committee's ability to justify its decision*.
          *   Tier 1 = We can defend the number.
          *   Tier 2 = We cannot defend the number, so we defend the *safety*.
          *   Known Mixture = We can defend the mechanism.
          *   *Key Concept:* **Second-Order Uncertainty.** The rule treats the uncertainty *about the probability* as morally relevant.
      *   **2. Ambiguity Aversion: Bias or Requirement?**
          *   Friend says bias (violates Savage/Anscombe-Aumann).
          *   Committee view: In high-stakes institutional ethics, ambiguity aversion is a **duty of care**.
          *   It's not about preference satisfaction (individual) but harm avoidance (institutional).
          *   *Verdict:* The rule presupposes ambiguity aversion is *required* when epistemic warrant is low.
      *   **3. The Known-Mixture Clause: Source vs. World.**
          *   Friend says it's description sensitivity.
          *   Counter: It tracks **intersubjective verifiability**. A coin is public; an expert's gut feeling is private/debatable.
          *   Defensible? Yes, in an accountability context. The "source" determines the "liability."
      *   **4. Two-Tier Structure: Departure from EV?**
          *   Friend says it's just EV with a pessimistic prior.
          *   Counter: It's a departure in **commitment**. EV requires a unique prior. The two-tier rule admits *indeterminacy* of the prior.
          *   The departure is in the **formation of the set**, not the calculation. It's a "Levi-style" or "Walley-style" imprecise probability approach.
      *   **5. Negligence vs. Precaution.**
          *   Negligence = Retrospective blame (requires causal link + foreseeability). Unknowable = not foreseeable = no blame.
          *   Precaution = Prospective permission (requires safety margin). Unknowable = potential catastrophe = restrict.
          *   They are consistent if you distinguish **Blame** (past) from **License** (future).
      *   **6. The Cost of the Friend's View.**
          *   If we adopt single-probability (Subjective Bayesianism):
          *   We lose the ability to distinguish "well-supported risk" from "guessed risk."
          *   We force the committee to pretend they know more than they do (false precision).
          *   We shift liability onto the committee for "bad luck" on the prior rather than "bad process."
          *   *What changes:* Tier 2 disappears. Everything becomes EV.
          *   *What is lost:* Epistemic humility and the protective buffer for research subjects when science is immature.

  5.  **Refining the Tone:**

      *   Needs to be philosophical but grounded in the practical reality of an REC.
      *   Avoid taking sides purely; instead, elucidate the *commitments* of the current rule vs. the friend's rule.
      *   Use terminology appropriate for a research ethics context (duty of care, fiduciary, epistemic warrant).
      *   Ensure the distinction between *ontic* (state of world) and *epistemic* (state of knowledge) is clear.

  6.  **Self-Correction/Nuance Check:**

      *   *Check:* Did I address the "Known Mixture" clause sufficiently? It's the trickiest part.
      *   *Correction:* Emphasize that the coin creates a *physical chance* which is objective, whereas the urn proportion is *epistemic*. Even if the outcome is the same, the *type* of probability differs (Aleatory vs. Epistemic). The rule treats Aleatory as Risk and Epistemic as Ambiguity, *unless* the Epistemic is resolved by an Aleatory mechanism (the coin).
      *   *Check:* Is the Negligence/Precaution point clear?
      *   *Correction:* Frame it as Asymmetry of Function. Negligence protects agents from liability for the unknowable. Precaution protects patients from the consequences of the unknowable. They protect different parties.

  7.  **Final Polish:** Organize into clear headings matching the user's questions. Ensure the conclusion summarizes the "Implicit Theory" clearly. (The theory is essentially **Institutional Epistemic Fiduciary Duty**).

  8.  *(Final thought before drafting)*: Make sure to explicitly answer "Does treating open uncertainty by worst case... commit us to ambiguity aversion being rationally permissible or even required?" Yes, required *institutionally*.

  9.  *(Drafting response based on these points...)*
answer: |-
  This is a profound question that cuts to the bone of institutional decision-making under uncertainty. Your friend is arguing from the standpoint of **Subjective Expected Utility (SEU)** theory—the dominant framework in health economics and classical rational choice. Your committee's rule, however, presupposes a different framework, one that is increasingly common in high-stakes institutional ethics: **Imprecise Probability with Epistemic Fiduciary Duty.**

  Your friend is correct that your rule violates the axioms of Savage or Anscombe-Aumann (specifically the Sure-Thing Principle and Reduction of Compound Lotteries). But that does not make the rule irrational; it makes it *institutionally* rational rather than *individually* rational.

  Here is the reconstruction of the implicit theory your rule presupposes, separated into its strict commitments and its compatible features.

  ### 1. The Core Theory: Epistemic Defensibility, Not Ontological State
  The fundamental presupposition of your two-tier rule is that **the moral weight of a risk depends on the warrant for the probability assignment, not merely on the probability value itself.**

  *   **Strict Presupposition:** The committee acts as a fiduciary for research subjects. A fiduciary cannot gamble with a beneficiary's assets (or safety) using money they do not confidently possess. In Tier 1 (Modelled Uncertainty), the "currency" of probability is minted by data; the committee is authorized to spend it. In Tier 2 (Open Uncertainty), the currency is counterfeit (expert guesswork); the committee is not authorized to spend it, so it must default to preserving the principal (the subject's safety).
  *   **Merely Fits Well:** This fits with ambiguity aversion, but it is not *just* psychological ambiguity aversion. It is **procedural caution.** It presupposes that rational choice in an institutional setting includes a meta-requirement: *Do not act on a probability unless you can defend its provenance to an auditor.*

  ### 2. Ambiguity Aversion: Bias or Requirement?
  Your friend charges that the rule promotes ambiguity aversion, which SEU theory labels a bias (the Ellsberg Paradox).

  *   **The Verdict:** Your rule presupposes that ambiguity aversion is **rationally required** for institutional agents, even if it is a bias for individual agents.
  *   **Why:** An individual maximizing utility can accept the risk of being wrong about their prior. An ethics committee maximizing *protection* cannot. If you average over open uncertainty (Tier 2), you are effectively claiming a precision of knowledge you do not possess. If your average is wrong, subjects are harmed based on a falsehood. If you worst-case (Maximin), subjects are protected based on a truth (the lower bound of the agreed range).
  *   **The Commitment:** The rule commits you to the view that **epistemic humility is a constraint on expected value maximization.** When the map is known to be distorted (open uncertainty), you do not navigate by the average of the distortions; you navigate by the edge of the known terrain.

  ### 3. The Known-Mixture Clause: Source vs. World
  This is the strongest point of contention. Your friend argues the coin case and the urn case are informationally identical at the moment of decision. Ontologically, she is right. Pragmatically, your rule asserts she is wrong.

  *   **What the Rule Tracks:** It tracks **Aleatory vs. Epistemic Uncertainty.**
      *   **Urn (Tier 2):** The uncertainty is epistemic. The proportion exists, but we don't know it. Any probability assigned is a statement about *our knowledge*.
      *   **Coin (Clause):** The uncertainty is aleatory. The mechanism is physical and objective. The probability is a statement about *the world*.
  *   **Is it Defensible?** Yes, under a theory of **Public Justifiability.**
      *   If the committee approves a study based on the Urn case and subjects are harmed, critics can say: "You guessed the proportion wrong. You had no basis for that number."
      *   If the committee approves based on the Coin case and subjects are harmed, critics cannot say the probability was wrong. The coin was fair. The *process* was sound, even if the *outcome* was unlucky.
      *   **The Defense:** The clause is not tracking the state of the world; it is tracking the **accountability of the committee.** It converts an indefensible expert opinion into a defensible physical chance. This is not description-sensitivity bias; it is **liability-management.**

  ### 4. Is the Two-Tier Structure a Departure from Expected Value?
  Your friend argues that worst-casing is just EV with a pessimistic prior. Mathematically, this is extensionally equivalent. Structurally, it is not.

  *   **The Departure:** The departure lies in **the refusal to collapse the set of models.**
      *   **SEU (Friend's View):** Requires the decision-maker to select a single "best guess" prior from the set of possible models to perform the calculation. It forces a commitment that the evidence does not support.
      *   **Two-Tier (Committee's View):** Admits that the *set itself* is the accurate representation of reality. By refusing to pick a single prior in Tier 2, the rule acknowledges **indeterminacy.**
  *   **Where the Logic Breaks:** In Tier 1, the set of models is tight enough that the "average" model is robust. In Tier 2, the set is too wide; the "average" model is a fiction.
  *   **Implicit Theory:** Rationality requires matching the *structure of the decision rule* to the *structure of the evidence.* When evidence is precise (parameters unknown, model known), use EV. When evidence is imprecise (model unknown), use Maximin. To use EV in Tier 2 is to lie about the evidence.

  ### 5. Negligence vs. Precaution: Conflict or Division of Labor?
  Your friend sees a contradiction: Negligence ignores unknowable risk (weighs at zero), while Precaution penalizes it (weighs heavily).

  *   **Resolution:** They are not in conflict because they answer different normative questions.
      *   **Negligence (Retrospective/Blame):** Asks, "Did the agent violate a duty?" You cannot violate a duty to foresee the unforeseeable. Here, unknowable risk is weighed at zero to protect **agency.** If we blamed people for unknowable risks, action would freeze.
      *   **Precaution (Prospective/Permission):** Asks, "Is it safe to proceed?" Here, unknowable risk is weighed heavily to protect **patients.** If we ignored unknowable risks in approval, safety would vanish.
  *   **The Synthesis:** The legal/regulatory pattern presupposes an **Asymmetry of Protection.** We protect the *doctor/researcher* from blame for the unknowable (Negligence), but we protect the *patient/subject* from exposure to the unknowable (Precaution/REC Rule).
  *   **Consistency:** This is consistent if you view the REC not as a court assigning blame, but as a gatekeeper assigning permission. The REC rule aligns with Precaution because its job is Permission, not Blame.

  ### 6. The Cost of Adopting the Friend's View
  If you abandon the implicit theory and adopt the single-probability (SEU) picture wholesale, here is what changes and what is lost:

  **What Would Change:**
  1.  **Tier 2 Collapses:** You would be forced to assign a subjective prior to every open uncertainty situation to calculate an EV.
  2.  **The Clause Vanishes:** The coin toss becomes irrelevant. The Urn and the Coin are treated identically as "50/50" (or whatever the subjective prior dictates).
  3.  **Liability Shift:** The committee becomes responsible for the *accuracy* of their subjective priors, rather than the *process* of their selection.

  **What Would Be Lost:**
  1.  **Epistemic Honesty:** You lose the ability to formally distinguish between "we know the risk is 5%" and "we guess the risk is 5%." In the SEU framework, both enter the equation as $p=0.05$. In your rule, the first is Tier 1 (EV) and the second is Tier 2 (Maximin).
  2.  **The Safety Buffer:** By averaging over open uncertainty, you allow high-risk/low-probability catastrophes to be washed out by low-risk/high-probability benefits. The Maximin rule prevents "gambling for resurrection" with subjects' safety when the odds are unclear.
  3.  **Defensibility:** In a scandal, a committee using SEU must defend *why* they chose a specific prior for an unknowable risk. A committee using your rule defends *why* they refused to assume a prior. The latter is much harder to litigate against.

  ### Summary of the Implicit Theory
  Your committee's rule presupposes **Institutional Epistemic Fiduciary Duty.**

  It holds that:
  1.  **Probability is a normative claim, not just a descriptive one.** To assign a number is to claim authority.
  2.  **Authority is graded.** Data grants full authority (Tier 1). Expert consensus grants limited authority (Tier 2).
  3.  **Rationality is context-dependent.** For a gambler, ambiguity aversion is a bias. For a guardian, it is a duty.
  4.  **Process trumps Outcome in Uncertainty.** When the world is unknowable (Tier 2), the only rational move is to secure the boundaries (Worst Case). When the world is knowable (Tier 1), the rational move is to optimize (Expected Value).

  Your friend is arguing for **Ontological Rationality** (the world is the world, probabilities should reflect states). You are operating on **Pragmatic Rationality** (the decision is an action, probabilities should reflect warrant). In the context of research ethics, where the goal is protection rather than profit, your rule is not a quirk; it is a robust mechanism for managing the liability of ignorance. You are not measuring the risk; you are measuring your right to take it.
