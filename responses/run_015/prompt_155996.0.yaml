answer: |-
  This is a precise request that requires bridging two distinct technical languages: analytic metaphysics and art conservation. Below is the translation of the three primary philosophical positions regarding material constitution into the vocabulary of conservation practice, followed by an analysis of the translation limits and a residue report on what remains untranslatable.

  ### I. Translation of Philosophical Positions into Conservation Vocabulary

  **1. The Identity Position (Monism)**
  *Philosophical Claim:* The statue is strictly identical to the lump of clay. There is only one object.
  *Conservation Translation:* **The Artwork is Identical to the Substrate.**
  Under this framework, the "sculpture" is not a distinct entity from the ceramic material. Any alteration to the substrate is an alteration to the artwork's identity. If the substrate fractures, the artwork is fundamentally changed in its being, not merely its condition. To add epoxy is to create a new substrate, and therefore a new artwork.

  **2. The Constitution Position (Coincidence)**
  *Philosophical Claim:* The clay constitutes the statue, but they are not identical. They share space and matter but have different persistence conditions.
  *Conservation Translation:* **The Substrate Constitutes the Artwork without Being the Artwork.**
  Here, the "sculpture" is a status held by the substrate. The substrate supports the artwork, but the artwork's continuity is not wholly dependent on the substrate's unbroken physical state. Intervention (epoxy) changes the substrate but does not necessarily break the artwork's continuity, provided the intervention respects the **structural continuity** of the original form. The artwork and the substrate occupy the same space but are managed as distinct layers of value.

  **3. The Form/Artifact Position (Essentialism)**
  *Philosophical Claim:* The statue is defined by its form or artistic intent. The material is secondary. If the form is destroyed, the statue ceases to exist, even if the matter remains.
  *Conservation Translation:* **The Artwork is Defined by Provenance and Structural Continuity, Not Substrate.**
  Under this view, the "sculpture" resides in the **provenance** of the design and the integrity of the form. If the fractures disrupt the **structural continuity** of the form to the point where the design intent is illegible, the artwork has ceased to exist, regardless of how much original substrate remains. **Reconstruction** is permissible to maintain the artwork's existence, whereas preserving the fractured substrate might be seen as preserving a ruin rather than the artwork itself.

  ---

  ### II. Translation Analysis: Fit, Distortion, and Absence

  #### 1. Identity (Artwork = Substrate)
  *   **Translates Cleanly:** This aligns with the conservation emphasis on **original material**. It validates the intuition that removing original substrate diminishes the object.
  *   **Distorted:** Conservation practice distinguishes between "loss of material" and "loss of identity." A cracked pot is still the same pot in conservation logs, even if the substrate is compromised. Identity theory suggests a cracked pot might be a *different* object or that the "pot" no longer exists if the clay arrangement changes significantly. Conservation treats the object as surviving damage; Identity theory treats the object as potentially perishing via damage.
  *   **No Counterpart:** Conservation has no mechanism for "numerical identity." It tracks **provenance** (history of ownership/creation), not ontological sameness. Conservation assumes the object persists through time; Identity theory questions *if* it persists.

  #### 2. Constitution (Substrate Constitutes Artwork)
  *   **Translates Cleanly:** This maps almost perfectly onto the principle of **reversibility**. If the artwork is constituted by but not identical to the substrate, one can alter the substrate (add epoxy) without altering the artwork, provided the alteration can be undone (reversed). It justifies the "visible repair" approach: the substrate is modified, but the artwork's integrity is maintained through distinguishability.
  *   **Distorted:** Constitution theory posits two objects in the same place (the clay and the statue). Conservation posits one object with multiple layers (original material, adhesive, fill). Conservation does not count the epoxy as a second object; it counts it as a treatment.
  *   **No Counterpart:** The philosophical notion of "coincident objects" (two things sharing the same space) has no practical equivalent. A conservator never treats the clay and the sculpture as separate entities requiring separate care plans.

  #### 3. Form/Artifact (Artwork = Design Intent)
  *   **Translates Cleanly:** This aligns with **reconstruction**. If the goal is to preserve the visual experience and the **structural continuity** of the form, one may replace missing substrate to complete the design. It prioritizes the legibility of the object over the purity of the **substrate**.
  *   **Distorted:** Philosophy speaks of "form" as a modal property (what the object *could* be). Conservation speaks of "form" as physical geometry (what the object *is*). Conservation cannot restore "potential"; it can only restore physical shape based on evidence.
  *   **No Counterpart:** Conservation lacks a vocabulary for "artistic intent" that exists independently of physical evidence. If the form is lost and there is no documentation, conservation cannot reconstruct it ethically. Philosophy allows for the "idea" of the statue to persist even if the physical evidence is gone; conservation requires physical trace.

  ---

  ### III. Residue Report: Unstated Assumptions and Essential Gaps

  You asked whether conservation ethics reveals an unstated assumption in the philosophical debate, or if philosophy contains something essential that conservation denies. The translation reveals a fundamental divergence in **temporal modality**.

  #### 1. The Unstated Assumption in Philosophy (Revealed by Conservation)
  Conservation ethics, specifically the requirement that intervention be **distinguishable** and **reversible**, reveals that the philosophical debate often conflates *identity* with *authenticity*.
  *   **The Assumption:** Philosophers argue about whether the statue *is* the clay (Identity) or *constituted by* the clay (Constitution). They treat this as a binary ontological fact.
  *   **The Conservation Revelation:** Conservation practice assumes a **layered ontology**. It does not ask "Is this the same object?" It asks "How much of the **substrate** must remain to maintain **provenance**?"
  *   **The Defect:** The philosophical claim that "The statue is identical to the clay" is exposed as pragmatically vacuous by conservation. If you claim identity, you cannot justify **reversibility**. If the statue *is* the clay, adding epoxy creates a new clay arrangement, and thus a new statue. But conservation practice successfully maintains the "same statue" through substrate alteration. Therefore, the Identity Position is defective for any practical purpose involving artifact preservation. Conservation proves that **persistence conditions** are not fixed by material identity but by **structural continuity** and **provenance**.

  #### 2. The Essential Element in Philosophy (Denied by Conservation)
  However, conservation practice implicitly denies something essential to the philosophical argument: **Counterfactual Resilience.**
  *   **The Philosophical Substance:** The debate about coincidence and identity is largely about *modal properties*—what *would* happen to the object if the clay were reshaped, or if the statue were melted down. It asks about the object's resilience across possible futures.
  *   **The Conservation Denial:** Conservation operates in a single timeline. It deals with actual damage, not possible damage. It has no vocabulary for "what this sculpture could have been." It implicitly denies that the object has properties beyond its physical history (**provenance**) and current state (**substrate**).
  *   **The Significance:** This is not a defect in conservation, but a limitation of its scope. Conservation is an ethics of *care*, not an ontology of *being*. By ignoring modal properties, conservation avoids the paradox of the Ship of Theseus by simply refusing to acknowledge the "ship" as anything other than the sum of its logged treatments.
  *   **The Verdict:** The philosophical claim is not less substantive; it is addressing a different category of truth. Philosophy asks, "What kind of thing is this?" Conservation asks, "How do we keep this thing legible?" The failure to carry over modal properties indicates that conservation ethics is **anti-realist** regarding the "artwork" as a metaphysical entity. It treats the artwork as a *process* of maintenance rather than a *substance* that persists.

  ### IV. Application to Your Dilemma

  In the context of your grandmother's sculpture:

  *   **If you adopt the Conservation Translation of Constitution (Visible Epoxy):** You acknowledge the **substrate** is damaged, but you assert the artwork's **structural continuity** can be maintained through intervention. The visible epoxy honors the **reversibility** principle, admitting the fracture is part of the history without letting it define the form. This rejects the Identity Position (that the break destroys the object) without falling into Reconstruction (faking the wholeness).
  *   **If you adopt the Conservation Translation of Form (Preserve Fractures):** You prioritize the **provenance** of the break event. The fracture is now part of the **structural continuity**. To repair it, even visibly, is to disrupt the historical record of the object's life.

  **Conclusion:** The philosophical debate suggests you must choose between the clay and the form. The conservation vocabulary reveals a third option: **The Treatment Record.** The object is neither just the clay nor just the form; it is the accumulation of its material history and the interventions required to sustain it. Whether you use epoxy or leave the fracture is not a question of whether the object *survives* (metaphysics), but of which layer of history—the making or the breaking—you wish to prioritize in the **provenance**. The "same piece" persists in both scenarios, provided the **structural continuity** of the decision is documented.
