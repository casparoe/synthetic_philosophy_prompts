answer: |-
  You have spotted a genuine crack in the way decision theory is often taught versus how it actually plays out. The short answer is: **Yes, there is a name for this, and no, your friends are not secretly pessimists.**

  The standard textbook explanation you're frustrated with (that people treat the unknown urn as if it were stacked against them) is a mathematical shortcut called **MaxMin Expected Utility**. It's a way for economists to model the behavior without complicating their equations, but it often misdescribes the psychology. It assumes you act *as if* the probability is 30% red just to be safe, when in reality you believe it's 50% red but you don't *trust* that 50%.

  The specific animal you are hunting has a few names depending on which decade of theory you're reading, but the most precise concept for what you're describing is **Second-Order Uncertainty** (or **Uncertainty about the Probability**), often discussed historically under Keynes's term **The Weight of Evidence**.

  Here is the breakdown of what is happening, why the two cases are actually the same effect wearing different masks, and how you can test it in your pool.

  ### 1. The Core Distinction: Risk vs. Ambiguity vs. Weight

  To understand your friends, you have to separate three layers:

  1.  **The Event:** Will it rain? Is the ball red?
  2.  **The Probability (First-Order):** I think there is a 50% chance.
  3.  **The Confidence in the Probability (Second-Order):** How sure am I that the 50% figure is robust?

  **Risk** is when you know the probability and have high confidence in it (the coin).
  **Ambiguity** is when you don't know the probability (the urn).
  **Weight of Evidence** is how much information supports that probability estimate.

  Your friends are saying: "My estimate for the urn is 50% (First-Order), but the *weight* of evidence supporting that estimate is zero (Second-Order). My estimate for the coin is 50% (First-Order), and the weight of evidence is maximum (Second-Order)."

  Standard theory collapses layers 2 and 3. It says if you dislike the urn, you must secretly believe layer 2 is not 50%. Your observation proves layer 2 *is* 50%, but layer 3 is driving the decision. They aren't pessimistic about the *outcome*; they are distrustful of the *generator*.

  ### 2. Case One: The Urn (Source Preference)

  In the literature, this specific flavor of ambiguity aversion is sometimes called **Source Preference**.

  When your friends choose the coin over the urn, they aren't necessarily thinking "The urn has more black balls." They are thinking "The coin is a mechanical device I understand; the urn is a black box."

  There is a subtle but crucial difference between **pessimism** and **fragility**.
  *   **Pessimism:** "I bet the urn is stacked against me." (This is the textbook explanation).
  *   **Fragility:** "I believe it's 50/50, but if you shook the urn for ten minutes, my 50/50 belief might change to 40/60. With the coin, shaking it doesn't change my belief."

  They are averse to the *instability* of their own estimate. In financial terms, they are averse to **parameter risk**. They don't mind the risk of the bet; they mind the risk that their calculation of the bet is wrong. This fits your observation perfectly: they are indifferent between Red and Black (the calculation is symmetrical) but still prefer the Coin (the calculation is stable).

  ### 3. Case Two: The Hydrologist (The Illusion of Validity)

  This is the more fascinating case, and it confirms that this is about **Second-Order Uncertainty**, not simple ignorance.

  There is a well-documented phenomenon called the **Competence Hypothesis** (Heath & Tversky), which suggests people prefer betting on their area of expertise. Your hydrologist contradicts this. Why?

  The novices are suffering from the **Illusion of Validity**. They don't know enough to know that their 50/50 guess is flimsy. They treat their guess as if it were a known probability (Risk) rather than an estimate (Ambiguity). They have high confidence in a low-weight estimate.

  The hydrologist suffers from **Epistemic Humility** (or **Model Risk**). She knows that "50/50" in a weather model isn't the same as "50/50" in a coin flip.
  *   **Coin 50/50:** Derived from physical symmetry. Extremely robust.
  *   **Model 50/50:** Derived from historical data, assumptions about climate patterns, and error margins.

  She knows that if a new variable enters the system (a sudden pressure drop, a sensor error), her 50/50 estimate could swing wildly. She sees the **error bars on the probability itself**.

  So, is this the same effect as the urn? **Yes.**
  *   **Urn:** I don't know the mix, so my 50/50 estimate is fragile.
  *   **Rainfall:** I know the mix is complex, so my 50/50 estimate is fragile.
  *   **Novice:** I don't know what I don't know, so I falsely believe my 50/50 estimate is solid.

  The hydrologist is effectively treating the rainfall bet like the urn, while the novices are treating it like the coin. The expertise doesn't reduce ambiguity; it *reveals* the ambiguity that the novices are blind to.

  ### 4. How to Distinguish Them in Your Pool

  You asked how to tell if you're looking at one effect or two, and what to change to test it. Since both cases stem from **Second-Order Uncertainty**, you are looking at one effect with two different triggers (lack of info vs. complex info).

  However, to prove it isn't just risk aversion (fear of losing money) or pessimism (fear of bad odds), try these two adjustments to your pool:

  **Test A: The "Buy Information" Move**
  Offer your friends a chance to pay $1 to look inside the urn (say, draw one ball and put it back) before betting.
  *   **If they are Pessimists:** They won't care. They think the urn is stacked; seeing one ball won't change their mind that the game is rigged.
  *   **If they are Ambiguity Averse (Weight of Evidence):** They *will* pay. Why? Because seeing a ball increases the "weight" of their evidence. It stabilizes their probability estimate. Even if they see a Red ball and update to 51/49, they feel better because the *uncertainty about the probability* has decreased.
  *   **Prediction:** Your friends will pay to look. This proves they trust their 50/50 estimate but hate the fragility of it.

  **Test B: The "Expertise" Spread**
  In the rainfall bet, ask everyone not just for the probability (50/50) but for a **Confidence Interval on that Probability**.
  *   Ask the novice: "If you ran this bet 100 times, how often would your 50/50 estimate be wrong?"
  *   Ask the hydrologist: "What is the error margin on your model?"
  *   **Prediction:** The novice will give a tight interval (false confidence). The hydrologist will give a wide interval (true ambiguity).
  *   **The Fix:** If you want the hydrologist to bet, you have to change the payoff structure to reward **calibration**, not just accuracy. If you pay her for being *right about her uncertainty* (e.g., Brier scores), she might participate. Currently, the pool rewards being right, which punishes those who know how often they might be wrong.

  ### 5. Summary of the "Animal"

  You are looking for **Ambiguity Aversion driven by Second-Order Uncertainty**, distinct from Pessimism.

  *   **Textbook Version:** "I avoid the urn because I act as if $P(Red) < 0.5$." (Pessimism/MaxMin).
  *   **Your Version:** "I avoid the urn because I act as if the *variance of P(Red)* is high." (Second-Order Uncertainty/Weight of Evidence).

  The hydrologist confirms this. If it were simple ignorance causing the fear, knowledge would cure it. But because the fear is about the *reliability of the estimate*, more knowledge (which reveals complexity) increases the fear.

  **The Label:** If you need a single term to search for or use, **Keynesian Weight of Evidence** is the historical root, but in modern behavioral finance, this is often categorized under **Ambiguity Aversion with Source Preference**.

  The crucial takeaway for your pool is that your friends aren't irrational pessimists; they are rational managers of **meta-risk**. They are betting on the reliability of their own knowledge, not just the outcome of the event. The coin is a reliable generator; the urn is not. The novice's gut is a reliable generator (in their mind); the hydrologist's model is not (in her mind).

  To get them to bet, you don't need to change the odds. You need to increase the **Weight of Evidence**. Let them inspect the urn. Let the hydrologist adjust the model parameters publicly. Make the probability feel solid, not just numerically even.
