  Let her attack the **additivity** (Step 2). It saves Moore's core (Step 1) and saves the morality of the bridge (Step 8). But make her stumble over the *Principle of Organic Unities*—she knows it's there, but she's too drunk to quote it properly, so she describes it emotionally. That's the sweet spot.
