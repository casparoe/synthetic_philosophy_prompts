answer: |-
  **Proposal for Independent Study: Ontological Composition Failure in the White Horse Dialogue**

  **Introduction and Problem Statement**
  The *White Horse Dialogue* (*Bai Ma Lun*), attributed to Gongsun Long of the School of Names, is conventionally centered on the paradoxical thesis that "a white horse is not a horse." Standard scholarship typically resolves this claim through three interpretive lenses: the logical interpretation, which treats the dialogue as a confusion regarding set membership and extension; the semantic interpretation, which attributes the paradox to ambiguity in the term "horse"; or the rhetorical interpretation, which views the argument as a sophistical exercise in statecraft or debate technique. While these readings explain the text's coherence within their own frameworks, they collectively obscure a potential metaphysical innovation. They presuppose that the text operates within a framework where properties are accidental modifiers of a stable substance. This independent study proposes a less familiar framing: treating the dialogue as advancing a thesis of ontological composition failure. Specifically, it posits that the text argues for color-properties as sortally invasive, meaning the presence of whiteness alters the kind-membership conditions of the substance it modifies rather than merely adding an accidental feature.

  **Research Question**
  The study will be guided by a single, precise research question: does the dialogue provide internal arguments for the claim that whiteness and horseness stand in a relation of non-compositional dependence, such that their combination produces an entity whose kind-identity is disrupted?

  **Critique of Standard Interpretations**
  Existing scholarship leaves this ontological reading untouched due to specific philosophical presuppositions. The logical and semantic interpretations generally import an Aristotelian substance-accident framework that the text may explicitly reject. By assuming that "horse" denotes a stable natural kind and "white" denotes a contingent attribute, these readings force the text into a binary where the claim "a white horse is not a horse" must be either false or linguistically tricky. Consequently, they treat the argument as purely linguistic and therefore miss its metaphysical target. The rhetorical interpretation dismisses the ontological stakes entirely, reducing the text to a tool for political maneuvering. None of these standard positions entertain the possibility that the School of Names advocated for a metaphysics where composite entities do not inherit the sortal identity of their primary constituent if modified by specific invasive properties. This study aims to demonstrate that the dialogue is not a failure of logic, but a successful argument for a non-standard ontology of composition.

  **Methodology**
  The research will proceed via three methodological stages designed to test the viability of the ontological composition failure reading without anachronism.

  First, I will undertake a premise-by-premise reconstruction of the dialogue's reasoning that avoids importing modern logical notation. Formal logic often imposes binary truth-values and set-theoretic assumptions that obscure the mereological relationships described in the text. Instead, I will map the interlocutors' exchanges to identify implicit premises regarding naming, fixing, and compound formation. This reconstruction will focus on the text's own distinctions between "seeking a horse" and "seeking a white horse" to determine if the differentiation is treated as epistemic or ontological.

  Second, I will employ a comparison with contemporary phase-sortal theories. This comparison will be restricted to testing internal consistency rather than claiming historical influence. By analyzing how modern metaphysics handles entities that change kind-identity based on property acquisition (e.g., a statue versus the clay constituting it), I will assess whether the *White Horse Dialogue* presents a coherent alternative to substance ontology. This comparative step serves as a stress test for the text's metaphysical claims, determining if the "sortally invasive" reading renders the argument philosophically robust rather than merely paradoxical.

  Third, I will establish a clear failure condition for the hypothesis. The ontological reading will be deemed untenable if the reconstruction requires attributing premises that have no textual basis in the dialogue's own structure. If supporting the claim of non-compositional dependence necessitates importing external metaphysical commitments not hinted at in the interlocutor's objections or responses, the hypothesis must be abandoned in favor of a semantic or logical reading.

  **Scope, Feasibility, and Payoff**
  This project is feasible within one semester because it restricts the primary textual analysis to a single, short dialogue. The scope is narrow enough to allow for deep exegesis without requiring a comprehensive survey of Warring States intellectual history. However, there is a distinct risk of collapse into general intellectual history. To mitigate this, the study will maintain a strict focus on the argumentative structure of the text rather than the biographical or political context of the School of Names. The comparative phase will also be limited to specific metaphysical concepts regarding sortals and composition, avoiding broad comparisons between Eastern and Western thought.

  The determinate philosophical payoff, if the composition-failure reading holds, is significant. It would reposition the School of Names not as sophists playing with language, but as serious metaphysicians offering a critique of substance ontology. It would suggest that early Chinese philosophy contains resources for understanding property instantiation that differ fundamentally from the Aristotelian tradition, specifically regarding how qualitative features determine kind-identity. Even if the hypothesis fails, the rigorous reconstruction will clarify exactly where the text relies on linguistic convention versus metaphysical assertion, providing a clearer map for future scholarship on the *Bai Ma Lun*. The final output will be a paper of approximately 20 pages, suitable for presentation at an undergraduate philosophy conference or submission to a student journal.
