answer: |-
  You've essentially stumbled onto the central debate in evolutionary philosophy without realizing it: Stephen Jay Gould's *Wonderful Life* (replay the tape of life, and everything changes) versus Simon Conway Morris's *Life's Solution* (replay the tape, and convergence leads to the same outcomes).

  You are looking for a heuristic to decide when you are in Gould's world (contingency) versus Morris's world (convergence).

  The single principle that captures your pattern is **The Ratio of Physical Constraint to Coordination Cost.**

  *   **High Physical Constraint + Low Coordination Cost = Convergence (Inevitability).**
      *   The laws of physics or logic force a specific solution. It doesn't matter who gets there first; the "fitness landscape" has only one peak.
  *   **Low Physical Constraint + High Coordination Cost = Path Dependence (Lock-in).**
      *   Multiple solutions work equally well functionally, but switching requires everyone to move at once. The first solution to gain traction creates a "moat" that prevents better solutions from displacing it.

  Here is how applying this principle forces you to adjust your verdicts.

  ### 1. The Verdict You Must Drop: DNA Storage
  You are currently conflicted on DNA. You suspect it's path dependent because RNA came first, but you acknowledge DNA is chemically superior for storage.

  **The Principle says: Convergence.**
  If DNA is chemically superior for long-term storage (due to the lack of the 2'-hydroxyl group making it less prone to hydrolysis), then any biosphere requiring long-term complex information storage will converge on a DNA-like molecule. The *path* to get there (RNA World first) might be contingent, but the *outcome* (a stable deoxy-backbone for archives) is determined by chemistry.
  *   **Adjustment:** Change your verdict. DNA as a storage medium is **not** path dependent; it is an optimization inevitable under Earth-like chemistry.

  ### 2. The Verdict You Need to Resolve: Calculus Notation
  You are flipping on Leibniz vs. Newton.

  **The Principle says: Convergence.**
  This is a case of functional optimization overcoming coordination cost *early enough*. Leibniz's notation (`dy/dx`, `∫`) is not just a label; it is a computational tool. It suggests operations (the chain rule is visually obvious in Leibniz, opaque in Newton's dots). Because the functional gap between the two notations was wide, and the adoption happened while the field was still small (low coordination cost), the superior tool won.
  *   **Adjustment:** Treat this as **Convergence on Merit.** If Newton's notation had been functionally equal, network effects would have locked one in (PD). But Leibniz's was a better technology for thinking.

  ### 3. The Verdict to Defend: Pluto
  Your friend argues the physical criterion was inevitable. You argue the vote was contingent.

  **The Principle says: Path Dependence.**
  This is a social ontology case, not a physical one. "Planet" is a human category, not a natural kind like "Star" or "Electron." While the *pressure* to classify was inevitable (we found too many Kuiper Belt objects), the specific *boundary* (clearing the neighborhood vs. hydrostatic equilibrium) was a negotiation.
  *   **Why your friend is wrong:** They are confusing the *cause* of the debate (new discoveries) with the *resolution* of the debate (the definition).
  *   **Why you are right:** Definitions are coordination games. We could have voted to keep Pluto and call Eris a planet too. The lock-in is now real (textbooks, public understanding), but the origin was a contingent vote.
  *   **Adjustment:** Keep your verdict. **Path Dependent.**

  ### 4. The Prediction: Base-10 Counting
  You asked about base-10. Is it ten fingers (contingent) or optimal (inevitable)?

  **The Principle says: Path Dependent.**
  *   **Physical Constraint:** Low. Mathematically, Base-12 (duodecimal) is superior (divisible by 2, 3, 4, 6). Base-2 is superior for computation. Base-10 is only divisible by 2 and 5.
  *   **Coordination Cost:** Extreme. Changing the base of a global civilization is nearly impossible.
  *   **Origin:** Anatomy. We have ten fingers. If we had evolved with six fingers per hand (common in tetrapod genetics, actually), we would likely use Base-12.
  *   **Prediction:** **Path Dependent.** It is a biological accident locked in by cultural infrastructure.

  ### Summary of the Principle
  To keep your gut reactions consistent, stop asking "Could it have been different?" and start asking **"Was the winner selected because it was better, or because it was first?"**

  *   **QWERTY/Rail/Writing:** First won. (PD)
  *   **Genetic Code/Calculus/DNA:** Better won. (Convergence)
  *   **Pluto/Base-10:** Arbitrary agreement locked in. (PD)

  Your intuition was mostly correct, but your biology background is tricking you on DNA. In the lab, you know DNA is stable. In philosophy, that stability makes it an inevitable solution for storage, regardless of the historical path RNA took to get there.
