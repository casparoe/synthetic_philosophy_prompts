answer: |-
  **Brainstorming Phase**

  The position's most costly vulnerability is the **fiduciary/regarding distinction**: if she cannot explain how a duty *to* a being exists when that being cannot claim it or recognize it, her "direct duty" claim collapses back into the indirect duty view she rejects. Next most costly is the **asymmetry between cruelty and painless killing**: if her "unified practical standpoint" is frustrated by death, she is an abolitionist (alienating the research audience); if not, her view is indistinguishable from standard welfare reform. Third is the **constructivist regress**: grounding value in rational conferral while granting graded status to non-rational animals risks incoherence unless she admits partial personhood, which she explicitly denies. Fourth is the **isolation case**: if a fiduciary duty requires a community of ends to vindicate it, her view fails the last-human test; if it doesn't, the grounding is obscure. Fifth is the **empirical mechanism of indirect duty**: pressing whether the duty survives if psychological spillover is disproven forces her to admit Kant's textual emphasis on sentiment was merely pedagogical, weakening her exegetical leverage. Finally, the **stock move deflection** is a methodological joint; if she can successfully translate every intuitive counterexample into a maxim test without losing normative force, the interview becomes sterile, so this must be trapped where the maxim itself yields the counterintuitive result.

  ***

  **Interview Questions**

  **1. The Empirical Mechanism of Indirect Duty**
  **Question:** The standard indirect-duty reading relies on the empirical claim that cruelty to animals corrodes our humanity toward humans. If future psychology showed no such spillover—or even showed that venting aggression on animals *reduced* violence toward humans—would the Kantian duty to treat animals well evaporate on that reading?
  **Likely Answer:** No. The duty attaches to the maxim of the action, not the empirical consequences. A maxim of cruelty contradicts the duty to oneself to maintain moral sentiment, regardless of the actual psychological outcome.
  **Follow-up:** [Note to Host: Flag this as practical, not exegetical.] If the duty rests on the agent's moral self-regard rather than the empirical effects, what work is Kant's own framing about "sentiments and habits" doing? Is his discussion of animal cruelty merely pedagogical scaffolding we can discard, or does it suggest the duty is actually grounded in the empirical psychology he describes?

  **2. The Isolation Case**
  **Question:** Consider the "last human" scenario: you are the sole rational agent left alive, with no possibility of encountering another human. On the indirect reading, torturing an animal seems permissible because no humanity is damaged. Does your fiduciary reading escape this?
  **Likely Answer:** Yes. The duty is owed *to* the animal based on its unified practical standpoint, not derived from my relation to other humans. The animal's good persists regardless of who is watching.
  **Follow-up:** A fiduciary relationship typically implies a principal who can hold the agent to account. If there are no other rational agents to vindicate the animal's claim, and the animal cannot vindicate it itself, in what sense does the duty *exist*? Is this a duty without a creditor?

  **3. Asymmetry: Cruelty vs. Painless Killing (Concrete Case)**
  **Question:** Let's make this concrete for our audience. Consider a shelter dog that is unadoptable due to severe aggression. On your view, is it permissible to painlessly euthanize this dog to make room for others, provided the death itself is not registered as a frustration by the dog?
  **Likely Answer:** It depends on whether death frustrates the "unified practical standpoint." If the dog has a future-oriented good that is extinguished, the duty is violated. If the dog lives only in the immediate present, it may be permissible.
  **Follow-up:** If you concede it is permissible for animals living in the immediate present, how is this practically distinct from the standard welfare reform position our committee currently uses? If you say it is impermissible because all life has a future-oriented good, are you not committed to abolitionism, regardless of how painless the slaughter is?

  **4. The Constructivist Regress**
  **Question:** You argue that humanity as an end-in-itself rests on rational agents conferring value. What exactly does the capacity to step back from a desire and ask whether it is a reason contribute to this conferral?
  **Likely Answer:** It allows the agent to act on principles rather than impulses, making them a member of the kingdom of ends and a source of value.
  **Follow-up:** If value is conferred by rational agents, how can non-rational agents be the *source* of a claim against those conferrers? You suggest social mammals pass this test "partially." If they have partial rational capacity, why do they not get partial personhood? If they don't get personhood, what grounds the duty other than our own rational choice to grant it?

  **5. Fiduciary Duties and Recognition**
  **Question:** You insist this is a duty *to* the animal, not *regarding* it. But the animal can neither recognize the duty nor be wronged by its violation in a way they can comprehend. How is this not semantically a duty regarding the animal after all?
  **Likely Answer:** Consider a human infant. We owe duties to them directly, even though they cannot recognize the duty. Their claim is carried by their potentiality for rationality.
  **Follow-up:** That relies on potentiality. What is your view on a being that never had and never will have that potentiality—for example, a human in a permanent vegetative state versus a pig? If the pig is owed a direct duty without potentiality, but the vegetative human is not (or vice versa), what is the non-speciesist grounding for that distinction?

  **6. The "Unified Practical Standpoint" Boundary**
  **Question:** Your machinery relies on creatures having a "unified practical standpoint over time." Where exactly does this line fall for our researchers? Does a mouse registering frustration count, or does it require a narrative sense of self?
  **Likely Answer:** It is graded. A mouse registers frustration and resists it, which is a primitive form of practical standpoint. A clam likely does not. The duty differs in kind based on the complexity of that standpoint.
  **Follow-up:** If the duty differs in *kind* and not only degree, does that mean there are thresholds where a duty suddenly appears? If so, doesn't that reintroduce the binary you criticize in Kant? If not, how do we weigh a "primitive" duty to a mouse against a "complex" duty to a human in a research protocol without a common currency of value?

  **7. Closing Sequence I: The Stock Move Trap (Cosmetics)**
  **Question:** I want to test your stock move: "Take the intuition out and tell me the maxim." Consider testing a cosmetic on rabbits that causes severe eye irritation but no death. The maxim is: "I will cause temporary severe pain to a sentient being to validate human aesthetic preference." Can this be universalized?
  **Likely Answer:** No. It treats the animal's good as merely a means to human preference, violating the fiduciary duty owed to its standpoint.
  **Follow-up:** How do you derive that violation without smuggling in the intuition that the rabbit's pain matters *in itself*? If the rabbit is not an end-in-itself, why does its pain veto the human's end?

  **8. Closing Sequence II: The Stock Move Trap (Weighing)**
  **Question:** Let's raise the stakes. A research protocol promises a significant breakthrough in pediatric cancer but requires severe pain for a cohort of primates. The maxim is: "I will frustrate the practical standpoint of primates to save human children." Can this be universalized?
  **Likely Answer:** Possibly, if the duty is graded. The human children's status as ends-in-themselves may outweigh the primates' fiduciary claim, provided the pain is minimized.
  **Follow-up:** If you allow the human end to outweigh the animal good, aren't you engaging in a consequentialist weighing of interests? If so, what work is the deontological "fiduciary duty" doing other than adding a procedural hurdle to the calculation?

  **9. Closing Sequence III: The Cost of the Move**
  **Question:** If every intuitive objection I raise—whether about isolation, killing, or weighing interests—is met by reformulating the maxim until it yields the correct result, does your theory predict anything distinct from utilitarianism with extra steps?
  **Likely Answer:** Yes, it forbids certain actions even if they produce good outcomes, because the maxim itself is impermissible regardless of consequences.
  **Follow-up:** But if the impermissibility comes from the frustration of the animal's good, and you admit we can override that good for sufficient human reason (as in the cancer case), isn't the "forbidden" maxim actually just a placeholder for "insufficient human reason"?

  **10. Falsification and Evidence**
  **Question:** Finally, I want to ask what would count as evidence against your view. I am not asking for an exegetical contradiction in Kant, but a finding in the world. What discovery—neuroscientific, philosophical, or practical—would make you abandon this fiduciary model?
  **Likely Answer:** Philosophical views are coherent webs; it is difficult to isolate a single falsifying condition. However, if it were shown that animals lack any capacity to register frustration...
