answer: |-
  **Case File: The Molyneux Variation**

  **Scenario**
  **Subject:** Patient S., 48, dense bilateral cataracts from infancy, successful extraction 48 hours ago.
  **Setting:** Hospital recovery room. Diffuse overhead lighting to minimize specular highlights. Black velvet backdrop to isolate silhouettes.
  **Props:** Matte-finish plastic shapes (no glare), mounted on thin rods to prevent handling cues during visual test.

  **Step 1: The Classic Test (The Ambiguous Success)**
  S. is seated two meters from a table. A cube and a sphere are placed before him. He is asked to point to the cube. He points correctly on the first trial.

  *Why he passes (without settling the debate):*
  The setup ensures high-contrast silhouettes and clear occlusion edges. Even if vision provides only proprietary primitives (2D contours, shading gradients), a simple computational routine can extract "angular vertices" from the cube and "continuous curvature" from the sphere.
  *   **Story A (Common Format/Resemblance):** S. passes because the visual experience of "corners" resembles the tactile memory of "corners." The formats overlap.
  *   **Story B (Description Matching):** S. passes because the visual system computes an abstract description ("object with vertices") which matches the tactile description ("object with vertices"). No resemblance is required; only a match at the level of the output description.
  *   **Result:** Behavioral success is compatible with both stories. We cannot tell if he *saw* the shape or *computed* it.

  **Step 2: The Probe (The Discriminating Test)**
  Before surgery, S. was trained on two novel, complex shapes (a *Rhombic Dodecahedron* and a *Tetrakaidecahedron*). Neither is common in daily life; neither has a simple name like "ball."
  1.  **Shape H:** Explored haptically for 30 minutes. S. knows the geometry by touch.
  2.  **Shape V:** Described verbally only. No handling. The description was strictly geometric (e.g., "14 faces, 6 quadrilaterals, 8 hexagons, specific dihedral angles"), explicitly avoiding functional analogies (no "it's like a honeycomb") to minimize motor imagery.
  3.  **Visual Test:** Post-op, both shapes are displayed. S. is asked to identify them by name/code.

  **Predictions**
  *   **Story A (Common Format/Resemblance):** Predicts **Shape H = Yes**, **Shape V = No**.
      *   *Why:* Visual recognition requires a pre-existing spatial intuition grounded in sensory experience. Haptic exploration provides this spatial "feel." Verbal description provides only propositional knowledge, which cannot resemble a visual experience. Without a sensory match, the visual input remains uninterpretable.
  *   **Story B (Description Matching):** Predicts **Shape H = Yes**, **Shape V = Yes**.
      *   *Why:* Recognition relies on matching abstract geometric descriptions. Both haptic exploration and precise verbal instruction generate the same internal geometric model. When vision computes the shape description from light, it matches both models equally well. The route of acquisition is irrelevant to the matching process.

  **The Discriminating Feature**
  The variable doing the work is the **source of the spatial concept** (sensory experience vs. propositional instruction).
  *   **If you remove it:** If you test only haptically learned shapes (the standard Molyneux test), both stories predict success (as seen in Step 1). The case collapses back into ambiguity.
  *   **If it holds:** A divergence in performance (H yes, V no) supports Common Format. Equal performance (H yes, V yes) supports Description Matching.

  **The Objection & Patch**
  **Objection:** "Hearing a geometric description makes you imagine handling the object." If S. converts the verbal description into motor imagery during pre-op training, Shape V becomes a proxy for Shape H. The test fails because the verbal route secretly relies on the haptic format.
  **Verdict:** This is a serious threat, but not fatal.
  **Patch:** Use shapes that are **motorically intractable**. Select shapes with internal voids or topological features that cannot be simulated by hand movement alone (e.g., a complex interlocking lattice described via coordinate geometry). If S. still identifies Shape V visually, motor imagery is insufficient to explain the match, strengthening the Description Matching story. If he fails, it suggests sensory grounding is necessary.

  **Closing**
  This case shows that behavioral success in cross-modal tasks cannot distinguish between shared sensory formats and abstract descriptive matching without controlling for how the concepts were acquired.
