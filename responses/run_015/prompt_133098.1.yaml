answer: |-
  The contention that modern scientific practice necessitates a revision of the Nyāya *pramāṇa* theory is philosophically unfounded. The classical four-fold scheme possesses sufficient hermeneutic flexibility to accommodate instrument-mediated observation and scientific consensus without collapsing categories or authorising a fifth *pramāṇa*. Defending the adaptability of the traditional framework preserves the ontological parsimony essential to Nyāya realism.

  Regarding instruments, the Nyāya defence of *pratyakṣa* (perception) rests on the direct causal connection between object and sense organ. A telescope functions merely as a *sahakāri-kāraṇa* (co-operative cause), enhancing the capacity of the eye rather than replacing it. To classify this as a hybrid epistemic form is to mistake the tool for the source. Hybridity implies a distinct causal chain, which instruments do not provide. Just as Nyāya accepts extraordinary perception (*yogija-pratyakṣa*) where senses are heightened through yogic power, technological augmentation remains within the ambit of *pratyakṣa*. The cognition arises from the contact (*sannikarṣa*) of sense and object, albeit mediated. The epistemic warrant remains perceptual immediacy, not inferential construction.

  Similarly, the transition from Vedic authority to scientific peer review does not invalidate *śabda* (testimony). The validity of *śabda* depends not on the sacredness of the text, but on the reliability (*āptatva*) of the speaker. In the scientific context, the 'speaker' is the collective body of experts whose claims have survived rigorous verification. This consensus functions precisely as *āpta-vākya* (statement of a reliable person). While scientific testimony is fallible and revisable, unlike eternal Vedic truth, the epistemic mechanism remains identical: we accept a proposition based on the credence of the source rather than direct perception or independent inference.

  Critics arguing for a fifth *pramāṇa* misunderstand the functional modularity of Nyāya epistemology. The system categorises sources of knowledge by their causal genesis, not their sociological context. Since instrument-aided cognition originates in sensory contact, it is *pratyakṣa*. Since accepting scientific facts originates in trusting expert report, it is *śabda*. To invent a new category would be ontologically extravagant. The Nyāya framework does not require revision; it requires rigorous application. Its distinction between how we know and whom we trust remains perfectly adequate for the scientific age.
