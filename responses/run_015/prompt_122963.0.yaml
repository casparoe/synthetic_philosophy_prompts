  # ADVERSARIAL COLLABORATION DRAFT: PROVIDENCE AND FOREKNOWLEDGE
  **Seminar:** Divine Providence and Foreknowledge
  **Participants:** [Student A: Molinist] / [Student B: Simple Foreknowledge]
  **Date:** [Current Date]

  ## I. COMMON COMMITMENTS
  *Both parties affirm the following claims as necessary conditions for their respective positions. Denial of any claim below constitutes a departure from the terms of this collaboration.*

  1.  **Taxonomic Coherence:** The distinction between Natural Knowledge (necessary truths), Middle Knowledge (contingent counterfactuals), and Free Knowledge (contingent decrees) is a coherent logical taxonomy, even if one denies the ontological reality of the second moment.
  2.  **Non-Discursive Epistemology:** Divine knowledge is intuitive and non-propositional in acquisition; God does not infer, learn, or reason from evidence to arrive at knowledge of any truth.
  3.  **Accidental Necessity:** If a proposition regarding a future creaturely action is true at *t1*, it is accidentally necessary at *t2* (where *t2* is after *t1* but prior to the action). The truth is fixed, even if the causal chain is not.
  4.  **Truthmaker Principle:** Contingent truths require an ontological ground. There are no "free-floating" true propositions about reality; truth supervenes on being.
  5.  **Contingency of Creation:** The actual world is contingent. God was not necessitated to create this specific world order, nor to create any world at all.
  6.  **Libertarian Commitment:** Both parties affirm that creaturely freedom, if it exists, entails the ability to do otherwise in the exact same causal and historical circumstances (leeway freedom).
  7.  **Prophecy and Prayer:** Any adequate theory must account for the possibility of specific divine prophecy and the efficacy of petitionary prayer without rendering them causally coercive.

  ## II. POINTS OF CONTENTION
  *Each row represents a claim. The party affirming the claim signs "Yes"; the party denying it signs "No."*

  | # | Claim | Molinist | Simple Foreknowledge | Dispute Type & Substantive Core |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Semantics:** Counterfactuals of creaturely freedom (CCFs) require a semantic primitive *sui generis* to standard closest-world (Lewis/Stalnaker) analysis to be robustly true for libertarian agents. | Yes | No | **Substantive.** Core: Whether standard possible worlds semantics can accommodate truth values for unactualized free choices without collapsing into determinism or vagueness. |
  | **2** | **Grounding:** The grounding objection against middle knowledge overgeneralizes; whatever grounds future-tensed contingent propositions for Simple Foreknowledge can equally ground CCFs without divine decree. | Yes | No | **Substantive.** Core: The asymmetry (or lack thereof) between the truthmakers of *future indicatives* and *counterfactual conditionals*. |
  | **3** | **Feasibility:** The set of feasible worlds is sufficiently dense and character-structured ("Strong" Middle Knowledge) to guarantee God can actualize a world with significant moral good without violating freedom. | Yes | No | **Substantive.** Core: Whether Molinism relies on "Weak" MK (brute facts) which renders providence lucky, or "Strong" MK (character constraints) which avoids the feasibility cliff. |
  | **4** | **Sovereignty:** Simple Foreknowledge preserves a robust doctrine of divine sovereignty compatible with libertarian freedom, such that the charge of "crypto-determinism" is a verbal confusion regarding the term 'control'. | No | Yes | **Verbal.** Core: Definition of *Sovereignty*. Substantive question: Does sovereignty require control over *which* world is actualized (Molinist) or only control over *what happens* within the actualized world (SF)? |

  ## III. ADJUDICATION PROTOCOLS
  *For each crux above, both parties agree that the following concrete cases bear on the truth of the claim. Each side has submitted a falsifiable prediction.*

  ### Adjudication for Row 1 (Semantics)
  **Case:** *Aliya the Clerk.* Aliya is a libertarian agent. In the actual world, she is never offered a bribe. We ask competent speakers (with no theological training) to evaluate the proposition: *"If Aliya had been offered the bribe in circumstances C, she would have freely refused it."*
  *   **Molinist Prediction:** A statistically significant majority of speakers will affirm the proposition is determinately true or false based on Aliya's known character, indicating ordinary semantics treats CCFs as having truth values.
  *   **Simple Foreknowledge Prediction:** A statistically significant majority of speakers will hesitate, qualify ("it depends"), or deny the proposition has a truth value, indicating ordinary semantics treats unactualized free choices as indeterminate.

  ### Adjudication for Row 2 (Grounding)
  **Case:** *The Truthmaker Asymmetry.* Consider two propositions: (P1) "Aliya will freely refuse the bribe tomorrow" and (P2) "If offered the bribe, Aliya would freely refuse." Assume God knows both prior to the decree.
  *   **Molinist Prediction:** Analysis of P1 and P2 will reveal identical grounding structures (e.g., Aliya's essence/character). If SF admits P1 is grounded by Aliya's future action, they must admit P2 is grounded by Aliya's character, dissolving the objection.
  *   **Simple Foreknowledge Prediction:** Analysis will reveal a structural asymmetry. P1 is grounded by the *event* occurring in the actual future timeline. P2 lacks an actual event to ground it. SF will demonstrate that appealing to "character" fails to ground P2 without implicitly determining the choice.

  ### Adjudication for Row 3 (Feasibility)
  **Case:** *Transworld Depravity.* Consider a possible agent, *Bob*, who suffers from Transworld Depravity (in every feasible world where he is free and significantly good, he goes wrong).
  *   **Molinist Prediction:** It is metaphysically impossible (or vanishingly improbable) that *all* feasible agents suffer Transworld Depravity simultaneously. God's Natural Knowledge guarantees a feasible world with moral good exists.
  *   **Simple Foreknowledge Prediction:** It is a live metaphysical possibility that the set of feasible worlds is "sparse" (wretchedly limited). If so, Molinism reduces to "Weak" Middle Knowledge where God gets lucky, undermining the claim that MK secures providence.

  ### Adjudication for Row 4 (Sovereignty/Verbal)
  **Case:** *The Risk Assessment.* God creates a world knowing (via Simple Foreknowledge) that Agent X will freely commit a specific evil act E. God could have refrained from creating.
  *   **Molinist Prediction:** Both sides will agree that on the SF view, God takes an *epistemic risk* regarding the *actualization* of the world (He doesn't know exactly what free choices will populate it until He creates). Molinist argues this functional lack of control is what they mean by "crypto-determinism" (God is passive regarding the world's shape).
  *   **Simple Foreknowledge Prediction:** Both sides will agree that God is not the *cause* of E. SF argues that "sovereignty" is satisfied by the power to create or not create, and that labeling this "crypto-determinism" is a category error regarding the word 'control'. The substantive disagreement is whether *risk* is compatible with *providence*.
