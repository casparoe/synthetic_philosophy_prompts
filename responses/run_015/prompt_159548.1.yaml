      *   *Section 2: The "Distracted" Phenomenon.* This is crucial. In sports/psychology, this is "flow" vs. "paralysis by analysis." It proves the motor memory exists but is fragile. This supports the user's claim that they *have* the knowledge, but access is blocked.
