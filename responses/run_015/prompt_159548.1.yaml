  2.  **Deconstruct the Philosophical Problem:**
      *   This is a classic *Know-That* vs. *Know-How* distinction (Gilbert Ryle).
      *   *Know-That:* Propositional knowledge (facts, steps, RPMs, bite points). The user has this in spades.
      *   *Know-How:* Procedural knowledge (muscle memory, coordination, feel). The user lacks consistency here.
      *   *The "Yips":* The phenomenon of performing better when not thinking about it suggests anxiety/performance block, not lack of underlying capability.
