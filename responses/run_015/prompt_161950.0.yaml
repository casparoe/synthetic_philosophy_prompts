answer: |-
  **JOINT MEMORANDUM ON THE PUBLIC-REASONS CLAUSE**
  **TO:** The Constitutional Drafting Commission
  **FROM:** The Advisers on Legislative Ethics and Civic Justification
  **SUBJECT:** Areas of Agreement, Disagreement, and Settlement Conditions

  **I. SHARED CLAIMS**

  1.  **On Coercion and Justification:** We agree that the distinctive feature of legislation is its reliance on coercive force backed by the state. Because coercion restricts liberty and imposes penalties, it stands in need of justification that goes beyond mere power or numbers. A law is not legitimate simply because it commands a majority; it must be justifiable to those subject to it. We disagree on the *form* that justification must take, but we agree that brute force without reason is tyranny.

  2.  **On the Purpose of Restraint:** We prioritize **legitimacy grounded in mutual respect** above all other values in this context. Stability is valuable only if it is stability for the right reasons, not mere modus vivendi. Better deliberation is a means to legitimacy, not an end in itself. We agree that the clause exists to ensure that the exercise of state power respects the status of citizens as free and equal partners in the polity, rather than as subjects to be managed or converted.

  3.  **On What Is Not at Issue:** We explicitly affirm that this clause applies *only* to the formal exercise of legislative power (voting and drafting binding law). It does not apply to public debate, civil society, preaching, or private conscience. We are not proposing the silencing of religious voices in the public square, the disestablishment of the two traditional churches, nor the barring of religious premises from identifying social problems (e.g., poverty, addiction) that require legislative attention. Religious arguments may initiate inquiry; the dispute concerns the justification required for the final coercive act.

  4.  **On Conditions of Failure:**
      *   The **Restrainingist** would consider her view falsified if the duty of civility systematically excluded marginalized religious minorities from effective political participation, thereby creating a secularist hegemony that functions as a comprehensive doctrine itself.
      *   The **Inclusivist** would consider his view falsified if the unrestricted use of sectarian reasoning in voting led to legislative deadlock, civil strife, or the enactment of laws that a significant portion of the citizenry could not comprehend as anything other than alien imposition.

  **II. DISAGREEMENTS TABLE**

  | The Crux | Restrainingist Formulation | Inclusivist Formulation | Agreed Test / Evidence | Predicted Outcomes |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Motivation vs. Justification**<br>*(The Convergence Case)*<br>Is the duty about the reasons *available* to support the law, or the reasons the agent *actually acted on*? | The legitimacy of the law depends on the existence of accessible public reasons sufficient to justify it, regardless of the voter's private motivation. If a secular justification exists, the vote is legitimate even if the voter was moved solely by scripture. | The integrity of the legislator and the honesty of the process require that the reason for the vote matches the motivation. A vote cast for religious reasons but justified by secular pretext is hypocritical and degrades trust. | **The Sealed Archive:** Legislators file a sealed, one-paragraph statement of their actual reasons for voting on coercive laws, opened after 30 years. | **R:** The archive will reveal that many laws lack sufficient public justification despite secular pretexts, validating the need for stricter pre-vote screening.<br>**I:** The archive will reveal that "public" reasons were often empty shells for sectarian will, proving that forcing a split between motive and vote creates a culture of dishonesty. |
  | **2. Accessibility**<br>*(Content vs. Acceptance)*<br>Is a reason "public" because of its *content* (shareable in principle) or because of *actual acceptance* by the audience? | Accessibility is a property of the reason's content. A reason is public if it appeals to common human reason or widely accepted political values, even if some citizens currently reject it. Truth is not determined by a headcount. | Accessibility is a fact about the audience. A reason is public if the specific citizens in this polity can actually engage with it. If a reason relies on premises the audience does not hold, it is not accessible, regardless of its abstract rationality. | **The Unanimous-Believer Jurisdiction & The Natural-Law Theist:**<br>A) A jurisdiction where 100% share a scripture.<br>B) A theist who claims secular natural law is part of her religion. | **R:** (A) Sectarian reasons remain non-public even if unanimous, as they rely on authority, not reason. (B) Her translation is valid only if she can strip the religious metaphysics from the legal claim.<br>**I:** (A) If 100% accept it, it *is* public reason in that context; denying this is elitist. (B) Her translation is insulting; if the conclusion is shareable, the source is irrelevant. |
  | **3. Asymmetry**<br>*(Secular Comprehensive Doctrines)*<br>Do secular comprehensive doctrines (e.g., autonomy-based perfectionism) bear the same burden of restraint as religious ones? | Yes. Any comprehensive doctrine, religious or secular, that is not shareable by all reasonable citizens must be restrained. Secular perfectionism is just as sectarian as church dogma if it imposes a specific view of the good life. | No. Secular doctrines circulating in our notes (humanism, autonomy) often *constitute* the language of public reason in this polity. Restraining them privileges the status quo and ignores that "neutrality" often masks a secular worldview. | **The Autonomy Law:** A law restricting traditional family structures solely on the grounds of "maximizing individual autonomy" without further welfare justification. | **R:** This law fails the test. Autonomy is a comprehensive value not shared by the traditional churches; it requires a public-welfare translation to be valid.<br>**I:** This law passes. Autonomy is the working currency of our legal system; demanding further translation is a moving goalpost designed to block progressive change. |
  | **4. Compliance and Legibility**<br>*(The Enforcement Mechanism)*<br>Should there be an institutional device to monitor adherence to the clause? | Yes. Without a mechanism to verify that public reasons are not merely pretexts, the clause is decorative. The Sealed Archive is a minimal intrusion that ensures long-term accountability and historical truth. | No. Monitoring mechanisms chill conscience and encourage performative compliance. Legitimacy comes from the culture of debate, not from auditing the internal states of legislators. | **Implementation of the Sealed Archive** as a standing order requirement. | **R:** Accepts on merits. Predicts it will deter voting on purely sectarian grounds and improve the quality of recorded justifications.<br>**I:** Rejects on merits. Predicts it will drive sincere religious reasoning underground and increase cynicism about the legislative process. |

  **III. CLOSING: VERBAL DISPUTES AND CONDITIONS FOR SETTLEMENT**

  **1. Verbal vs. Substantive Disputes**
  We identify two residual disputes that appear verbal rather than substantive.
  *   **The Definition of "Public":** The Restrainingist uses "public" to mean *accessible to reason regardless of current belief* (idealized). The Inclusivist uses "public" to mean *accessible to these people given their current beliefs* (sociological). This is not merely semantic; it dictates whether we look to ideal theory or actual political culture. However, if we can agree on a *list* of admissible premises (e.g., common welfare, justice, security) without agreeing on why they are admissible, this verbal dispute can be bypassed.
  *   **The Definition of "Coercion":** We suspect we disagree on the threshold of coercion. The Restrainingist tends to view any binding law as coercive. The Inclusivist tends to view only punitive or restrictive laws as coercive, viewing enabling legislation differently. If we can agree to apply the clause only to laws imposing criminal penalties or significant civil disabilities, the scope of the disagreement shrinks significantly.

  **2. Conditions for Settlement**
  We cannot sign a single clause text today. However, we can agree on what would settle the matter:
  *   **Empirical Settlement:** If the Commission can commission a study of comparable polities showing that unrestricted sectarian voting leads to measurable instability (violence, boycott, secession), the Inclusivist agrees to reconsider the strength of the restraint. Conversely, if data shows that restraint clauses are consistently used to block minority interests without improving stability, the Restrainingist agrees to weaken the enforcement mechanism.
  *   **Procedural Settlement:** We both accept a "Translation Requirement" rather than a "Exclusion Requirement." The standing orders should not ban religious reasons, but should require that for any coercive law, a justification *also* be entered into the record that does not rely on sectarian authority. The Restrainingist accepts this as sufficient for legitimacy; the Inclusivist accepts this as sufficient for integrity, provided the legislator is not required to affirm that the translation was their *sole* motive.

  We submit this memorandum not as a final text, but as a map of the terrain. The Commission must now decide whether the risk of hypocrisy (Inclusivist fear) is greater than the risk of domination (Restrainingist fear).

  **Signed,**

  *The Advisers on Legislative Ethics and Civic Justification*
