      *   They claim they can signal in Esc 1. (Need to prove marginal probabilities are static).
      *   They get bored. (Keep rounds fast).
      *   Time overrun. (Cut Esc 3 if needed, but it's crucial for the "cheating" point).

  10. **Final Polish:**
      *   Ensure the tone is collaborative, not condescending.
      *   Make sure the "Banned Words" rule is enforced playfully.
      *   Clarify the CHSH win condition clearly ($a \oplus b = x \land y$).
      *   Ensure the "No Signaling" proof in Esc 1 is concrete (look at Alice's outputs alone—they are random).

  11. **Self-Correction on Esc 3:** The prompt says "Me playing the universe with a prepared deck that puts up a score above the classical ceiling while none of them can catch me running a local strategy."
      *   If I use a local strategy to get >75%, I am *lying* about the inputs or outputs.
      *   Example: I only count the rounds where they win. (Post-selection loophole).
      *   Example: I change their inputs after they commit. (Freedom-of-choice loophole).
      *   I will suggest the **Post-Selection Loophole**. It's the easiest to simulate in a room. "Oh, that round had packet loss, we drop it." If I drop mostly losses, the average goes up. This shows why "loophole-free" Bell tests are hard.

  12. **Final Review against constraints:**
      *   Zero budget? Yes (paper/pens).
      *   No forbidden words? Yes.
      *   75 mins? Yes (tight).
      *   Debrief mapping? Yes.
      *   Blunt about limitations? Yes.

