      *   **Deliverables:** Rules, materials, scoreboard, minute-by-minute timeline, three escalation rounds (communication cost, deterministic input, facilitator cheating), debrief mapping, failure modes/recovery, limitations of the simulation.
      *   **Tone:** Blunt, practical, engineering-focused, respectful of their intelligence but aware of their misconceptions.

  2.  **Validate the Physics/Math:**
      *   *CHSH Game:* Two players (Alice & Bob), inputs $x, y \in \{0, 1\}$, outputs $a, b \in \{0, 1\}$.
      *   *Win Condition:* $a \oplus b = x \land y$ (XOR of outputs equals AND of inputs).
      *   *Classical Limit:* Max win rate is 75% (3/4).
      *   *Quantum Limit:* Max win rate is $\cos^2(\pi/8) \approx 85.4\%$.
      *   *User's Check:* "Classical strategies cap out at 3 out of 4 and the quantum thing gets somewhere around 85%." -> **Correct.**
      *   *FTL Signaling:* Quantum correlations cannot transmit information (No-Communication Theorem). This needs to be highlighted in Escalation 1.
      *   *Superdeterminism:* If inputs aren't random (Escalation 2), classical strategies can win 100%. This undermines the "freedom of choice" assumption.
      *   *Facilitator Cheating (Escalation 3):* If the facilitator (Universe) cheats, they can simulate quantum stats with a hidden variable (the stacked deck). This highlights the loophole in experimental tests (detection loophole/freedom-of-choice loophole).

  3.  **Design the Workshop Structure:**

      *   **Phase 1: Setup & Rules (10 mins)**
      *   **Phase 2: Classical Rounds (20 mins)** - They try to beat 75%. They will fail.
      *   **Phase 3: Escalation 1 - The "Network" (15 mins)** - Allow communication, show cost/limitations.
