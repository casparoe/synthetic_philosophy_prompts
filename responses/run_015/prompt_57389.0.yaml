      *   Escalation 1 (Comms): 15
      *   Escalation 2 (PRNG): 10
      *   Escalation 3 (Facilitator): 10
      *   Debrief: 10
      *   *Total:* 75.
      *   *Risk:* Transitions take time. I should combine Escalation 2 & 3 or shorten Classical Trials. Let's keep Classical Trials tight (just enough to prove the 75% wall).

  4.  **Drafting the Content - Section by Section:**

      *   **Materials:** Index cards, pens, printed scorecards, two separate rooms (or corners with dividers), dice/coin for random inputs (or a script).
      *   **Rules:** Keep it strictly CHSH. Input $x, y$, Output $a, b$. Condition: $a \oplus b = x \cdot y$.
      *   **The "Forbidden" Constraint:** I need to enforce this. Maybe put it on the whiteboard. "Banned Words."
      *   **Escalation 1 (Communication):** Give them a "network cable" (string/paper). Charge them "latency" or "budget." Show that to win 100%, they need to know the *other's* input. But if they use it to send a message *to the outside*, they can't, because the output looks random individually. *Correction:* In CHSH, if they communicate inputs, they win 100%. The No-Communication theorem is about *observers* not being able to tell if the other measured. I need to make sure the engineers realize that *winning the game* doesn't mean *sending a message to the referee*. Actually, the prompt asks: "Ideally they end up trying to use their now-winning setup to transmit an actual payload... and discover they can't."
          *   *Refinement:* If Alice and Bob can talk, they win 100%. But can Alice send a bit to the *Referee* that Bob knows? No. The Referee only sees the correlation. I need to design a mini-task where they try to signal *out* using the correlation.
      *   **Escalation 2 (Deterministic Inputs):** If the inputs are pre-known (seeded), they can pre-compute a lookup table. They win 100%. The lesson: Bell's theorem assumes *Measurement Independence* (Free Will).
      *   **Escalation 3 (Facilitator Cheating):** I act as the "Quantum Source." I give them inputs and tell them what outputs *would* have won, or I just tally scores to show 85%. The prompt says: "Me playing the universe with a prepared deck that puts up a score above the classical ceiling while none of them can catch me running a local strategy." This is tricky. If I just lie about the score, they won't trust it. If I use a stacked deck of *inputs*, that's Escalation 2. If I use a stacked deck of *allowed outputs*, that's a Hidden Variable.
          *   *Better approach for Esc 3:* I provide a "Magic Box" (envelope) for each round containing the "Quantum Strategy." They open it *after* they commit. It tells them what to output based on a shared random string generated *before* separation but correlated in a specific way. Wait, that's just a Hidden Variable.
          *   *Prompt Requirement:* "Me playing the universe... none of them can catch me running a local strategy." This implies I am simulating the QM statistics using a local strategy (cheating). This demonstrates the *Detection Loophole* or simply that without trusting the source, you can't prove non-locality. I need to be careful not to validate Hidden Variables, but to show that *trusting the setup* is part of the proof.
          *   *Actually, re-reading:* "finish with a... line for each of the usual exits." The prompt acknowledges I'm faking it. The goal is to show that *if* the stats are real, *then* locality dies. If I fake the stats, I'm simulating a Superdeterministic or Hidden Variable universe. I need to make sure they know I'm "The Universe" and I'm allowed to break the rules to show them what a "loophole" looks like.

  5.  **Refining the Escalations for Engineering Minds:**

      *   **Esc 1 (Network):** Give them a phone line. They win 100%. Cost: Latency (time delay). Try to send a message to the *Referee* (me) without me knowing the input. They can't. The correlation exists, but marginal probabilities are 50/50.
      *   **Esc 2 (PRNG):** Inputs aren't random. They are `hash(round_id)`. They can pre-calc. Win 100%. Lesson: Assumption of Input Independence.
      *   **Esc 3 (The Loophole):** I (Referee) decide which rounds count. I discard "no-show" packets. By selectively discarding losses, I can inflate the score to 85% using only classical logic. This simulates the *Detection Loophole*.

  6.  **Debrief Mapping:**
      *   Classical Wall -> Local Realism.
      *   Esc 1 (Comms) -> Non-Locality (but no signaling).
      *   Esc 2 (PRNG) -> Superdeterminism (No Free Choice).
      *   Esc 3 (Cheating) -> Detection Loophole / Hidden Variables (Unfair sampling).
      *   Philosophy Exits:
          *   Bohmian: Non-local hidden variables (Esc 1 works but hidden).
          *   Many Worlds: All outcomes happen (correlation without communication).
          *   Superdeterminism: Inputs weren't free (Esc 2).
          *   Retrocausal: Future affects past.
          *   Copenhagen/QBism: Don't ask, just calculate.

  7.  **Addressing the "Bad Framing" Check:**
      *   Is "Distributed Systems" a good framing? Yes, perfect for this audience.
      *   Is the CHSH math right? Yes (75% vs 85%).
      *   Is the "No FTL" point clear? Yes, via Esc 1.

  8.  **Drafting the Plan (Iterative refinement):**
      *   *Materials:* Need specific printables. Input cards, Output cards, Scoreboard.
      *   *Timeline:* Needs buffer. Engineers love to argue about the rules. Build that into the "Classical Rounds."
      *   *Forbidden Words:* Put this on the whiteboard. Fine system? No, just social pressure.
      *   *Escalation 3 Risk:* If I fake the quantum stats with a local strategy, I am proving Hidden Variables *are possible* if the referee cheats. I need to frame this as "This is why experimentalists build expensive labs—to ensure the Referee isn't me."

  9.  **Failure Modes:**
