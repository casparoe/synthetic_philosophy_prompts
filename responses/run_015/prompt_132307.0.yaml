  # Research Prospectus: The Two Faces of Subsidiarity
  ## A Philosophical and Comparative Inquiry into Allocation and Domain in Federal Systems

  ### I. Introduction and Problem Statement

  The genesis of this research project lies in a commonplace dispute, the kind that occurs in university common rooms rather than lecture halls. A roommate, politically engaged but legally untrained, argued that the principle of subsidiarity within the European Union is effectively a "dead letter." His reasoning was pragmatic: the European Commission can almost always justify centralization by invoking economies of scale or cross-border externalities. If the metric is purely efficiency, the center will almost always win. He contrasted this with Switzerland, where he claimed the cantons possess a genuine veto power through direct democracy, rendering their autonomy substantive rather than merely procedural. This casual observation sparked a deeper philosophical inquiry. It suggests that we are using a single term, "subsidiarity," to describe two fundamentally different structural principles of political organization.

  On one hand, there is the intuition that lower levels of government should have the *first crack* at decision-making. This is a rule of priority. It suggests that authority resides naturally at the local level but can be transferred upward if specific conditions are met. This is reversible. If the higher level can do the job better, the authority moves. On the other hand, there is the intuition that there are certain spheres of life, certain domains of policy, that belong to the lower level by right, regardless of efficiency. This is a rule of exclusivity. It suggests that even if the central government could administer a healthcare system more efficiently, it is forbidden from doing so because healthcare belongs to the moral and political jurisdiction of the local entity.

  The standard literature on federalism often blurs these two concepts. It tends to treat federalism as a single spectrum ranging from unitary to confederal, measured by the volume of legislation passed at each level. However, this quantitative approach misses the qualitative distinction in the *justification* for local power. Is local power protected because locals know best (an epistemic claim leading to allocative efficiency)? Or is local power protected because local sovereignty is an intrinsic good (a normative claim leading to domain integrity)?

  This proposal outlines a one-semester seminar project designed to disentangle these two dimensions. I propose to label them "Allocation Subsidiarity" and "Domain Subsidiarity." Allocation Subsidiarity is procedural and consequentialist. It asks: "Who can achieve the objective most effectively?" Domain Subsidiarity is substantive and deontological. It asks: "Who has the right to decide this, regardless of the outcome?"

  The central research question is precise: Can the concept of subsidiarity be cleanly split into these two dimensions, and does this distinction explain the divergent judicial behaviors observed in major federal systems? Specifically, why does the European Court of Justice almost never strike down legislation for violating subsidiarity, while United States courts, invoking doctrines related to the Commerce Clause and the Tenth Amendment, appear more willing to police federal boundaries? Furthermore, where do systems like Germany and Switzerland fit? Do they represent hybrids, or do they lean decisively toward one pole?

  This inquiry is not merely doctrinal; it is philosophical. It concerns the nature of political authority. If the EU operates on Allocation Subsidiarity, it views the Union as a managerial entity designed to optimize welfare across member states. If the US or Swiss systems operate closer to Domain Subsidiarity, they view the constituent units as sovereign entities possessing inherent rights that the center cannot violate, even for the greater good. The confusion arises because international treaties and constitutional texts often use the same vocabulary—"subsidiarity," "federalism," "decentralization"—to describe these incompatible architectures.

  The stakes of this confusion are high. If a citizen believes their local government has Domain protection (a right to rule certain spheres) but the legal system only grants them Allocation protection (a priority that can be overridden by efficiency), political disillusionment is inevitable. This matches the roommate's frustration with the EU. Conversely, if a central government believes it has the mandate to solve problems based on efficiency but is blocked by Domain claims, governance becomes gridlocked. Understanding whether these are two distinct principles or merely two points on a sliding scale is essential for diagnosing the health of federal democracies.

  This proposal argues that they are distinct principles. It further hypothesizes that the "weakness" of EU subsidiarity is not a failure of enforcement but a feature of its design as an Allocation system. Conversely, the "strength" of US or Swiss federalism is not necessarily a result of more aggressive judges, but of a underlying Domain structure that gives judges a substantive hook on which to hang a veto. The project will test this hypothesis through a comparative analysis of legal texts, judicial reasoning, and institutional design in the EU, US, Germany, and Switzerland.

  The scope of this project is ambitious for a one-semester seminar, particularly for a student without formal legal training. However, the focus will remain on the philosophical structure of the arguments rather than the minutiae of procedural law. By treating legal opinions as philosophical texts that reveal underlying commitments to authority and liberty, this project aims to contribute to the political philosophy of law. The following sections will detail the conceptual framework, review the existing literature to identify the gap this project fills, outline the comparative methodology, and provide a realistic month-by-month work plan. Crucially, I will include a reflexive section on feasibility, acknowledging the limitations of a non-lawyer approaching doctrinal questions and outlining how I will mitigate the risks of superficiality.

  ### II. Conceptual Framework: Allocation vs. Domain

  To proceed, we must rigorously define the two dimensions of subsidiarity that this project seeks to isolate. While the term "subsidiarity" has a long history, originating in Catholic social teaching and later adopted by secular political theory, its contemporary usage in constitutional law has become diluted. It is often used as a catch-all for "localism." This project proposes a taxonomy that distinguishes between the *logic of assignment* and the *logic of reservation*.

  **Allocation Subsidiarity: The Presumption of Competence**

  Allocation Subsidiarity functions as a rule of priority. It establishes a default setting: the lower level of government is the presumptive actor. However, this presumption is rebuttable. The burden of proof lies with the higher level of government to demonstrate that the lower level is insufficient. Insufficiency is typically defined in terms of capacity, scale, or externalities. If a local pollution problem spills over a border, the local level is deemed "insufficient" by definition, and the authority allocates upward.

  The philosophical underpinning of Allocation Subsidiarity is consequentialist. It is concerned with the *output* of governance. The goal is to solve problems effectively. Local control is valued instrumentally, not intrinsically. It is valued because locals presumably have better information about local preferences (a Hayekian knowledge problem argument) or because local experimentation leads to better policy innovation (the "laboratories of democracy" argument). However, if the central government can demonstrate superior information or greater capacity to internalize externalities, the justification for local control evaporates.

  In this framework, subsidiarity is a procedural hurdle. It requires the central authority to explain *why* it is acting, but it does not forbid the action if the explanation is adequate. The judicial role in an Allocation system is limited to reviewing the adequacy of the reasoning. Did the legislature consider the local impact? Did they provide a rationale for centralization? If the box is checked, the law stands. The court does not ask whether the centralization was *wise*, only whether the process respected the priority rule.

  This creates a specific dynamic in litigation. Challengers must argue that the central government's efficiency claim is factually wrong. They must prove that the local level *could* have handled the issue. This is an empirical burden, difficult to meet in court. It turns a constitutional question into a technocratic debate about economies of scale.

  **Domain Subsidiarity: The Integrity of Jurisdiction**

  Domain Subsidiarity functions as a rule of exclusion. It establishes boundaries that cannot be crossed, regardless of efficiency. In this model, certain subjects are reserved to the lower level by right. Even if the central government could administer a school system more efficiently, even if it could harmonize curriculum to improve national test scores, it is forbidden from doing so because education falls within the "domain" of the local sovereign.

  The philosophical underpinning of Domain Subsidiarity is deontological. It is concerned with the *status* of the political units. The lower levels are not merely administrative subdivisions; they are political communities with inherent authority. This authority is not granted by the center; rather, the center is often viewed as an agent created by the local units (as in a compact theory of federalism). Therefore, the center has only enumerated powers, and everything else remains with the local units.

  In this framework, subsidiarity is a substantive limit. It is not about who does it better; it is about who is allowed to do it at all. The judicial role in a Domain system is more robust. Courts must interpret the boundaries of the domains. They must decide whether a specific law intrudes upon the exclusive sphere of the lower level. This requires normative judgment, not just empirical review. The court must define the essence of "local police power" or "cantonal sovereignty."

  This creates a different dynamic in litigation. Challengers do not need to prove that the local government could have done the job better. They only need to prove that the subject matter belongs to them. The argument is jurisdictional, not technocratic.

  **The Hybrid Reality and the Source of Confusion**

  In practice, no system is purely Allocation or purely Domain. The United States, for example, began with a strong Domain conception (enumerated powers, Tenth Amendment reservation) but shifted toward an Allocation conception during the mid-twentieth century, where the Commerce Clause was interpreted to allow federal regulation whenever there was a substantial economic effect. However, recent decades have seen a resurgence of Domain-style reasoning in specific doctrines, such as the prohibition on "commandeering" state executives.

  Similarly, the European Union is ostensibly built on Allocation Subsidiarity (Article 5 of the Treaty on European Union), yet there are moments where member states assert Domain-like claims, particularly regarding core functions of the state like taxation or security.

  The confusion in the literature stems from treating these as points on a single line. We tend to ask, "How much subsidiarity is there?" as if it were a volume knob. This project argues it is more like a switch between two different operating systems. When scholars compare the EU and the US, they often conclude the US has "more" federalism. But this project suggests the US and EU are playing different games. The US is playing a game of boundary maintenance (Domain), while the EU is playing a game of optimization (Allocation).

  This distinction explains the judicial behavior puzzle. In an Allocation system, courts are ill-equipped to second-guess legislative findings on efficiency. Judges are not economists. If the Commission says "we need a unified standard to prevent market fragmentation," the court lacks the institutional capacity to verify this claim rigorously without overstepping into policy-making. Thus, deference is the rational default.

  In a Domain system, courts are well-equipped to interpret boundaries. Determining whether a law regulates "commerce" or "non-economic conduct," or whether it commands state officials, is a textual and structural interpretation task, which is the traditional forte of the judiciary. Thus, intervention is more feasible.

  **The Moral Weight of Local Autonomy**

  A critical component of this conceptual framework is the moral justification for local power. In Allocation Subsidiarity, local autonomy is valuable because it leads to better outcomes. It is a means to an end. In Domain Subsidiarity, local autonomy is valuable because it constitutes freedom. It is an end in itself.

  This distinction mirrors the broader debate in political philosophy between utilitarianism and rights-based liberalism. If we view federalism through a utilitarian lens, we naturally gravitate toward Allocation. We want the government structure that maximizes welfare. If centralization maximizes welfare, we should centralize. If we view federalism through a rights-based lens, we gravitate toward Domain. We believe that political communities have a right to self-determination that cannot be traded away for aggregate welfare gains.

  This project will explore whether the legal texts of the respective jurisdictions reflect these moral commitments. Does the EU Treaty language speak of "objectives" and "efficiency" (utilitarian)? Does the US Constitution speak of "reserved powers" and "sovereignty" (rights-based)? By mapping the language of the law to the underlying moral philosophy, we can better understand why the courts behave the way they do.

  **The Paradox of Enforcement**

  Finally, this framework highlights a paradox. Domain Subsidiarity sounds stronger, but it relies on a clear definition of domains. In a modern, interconnected world, domains blur. Is environmental protection local or national? Is it health or commerce? If the domains are porous, the Domain system collapses into an Allocation system because courts must weigh interests to draw the line.

  Conversely, Allocation Subsidiarity sounds weaker, but it can be robust if the burden of proof is high. If the center must prove "necessity" rather than just "added value," the barrier to centralization is high.

  This project will investigate whether the failure of EU subsidiarity is due to the low bar of "added value" (Allocation weakness) or the lack of a protected domain. It will also investigate whether the success of US federalism challenges is due to clear domains or simply a different political culture regarding judicial review.

  By establishing this conceptual framework, the project moves beyond the descriptive ("the EU does X, the US does Y") to the analytical ("the EU does X because it operates on Principle A"). This provides the theoretical backbone for the comparative analysis that follows.

  ### III. Literature Review and the Identified Gap

  The existing literature on federalism and subsidiarity is vast, spanning law, political science, and economics. However, much of it operates within paradigms that obscure the distinction between Allocation and Domain subsidiarity. This section reviews the dominant schools of thought and identifies the specific gap this project intends to fill.

  **Efficiency Federalism**

  A significant portion of the literature, particularly in law and economics, treats federalism as a mechanism for maximizing efficiency. This school draws on the Tiebout model, suggesting that local competition for residents leads to optimal provision of public goods. In this view, decentralization is good because it allows for preference matching. Centralization is good when there are spillover effects.

  Scholars in this tradition analyze subsidiarity as a cost-benefit analysis. They ask whether the assignment of powers minimizes transaction costs. The problem with this literature, for the purposes of this project, is that it assumes there is only one metric: efficiency. It cannot account for situations where a local government retains power *inefficiently*. If a canton blocks a beneficial railway project to preserve local culture, efficiency federalism views this as a failure or a transaction cost. It does not view it as the successful operation of a Domain principle.

  Consequently, when efficiency scholars look at the EU, they see a system designed to optimize the single market. They explain the weak judicial review of subsidiarity as a rational deference to the legislature's economic findings. When they look at the US, they often view federalism disputes as confusion or inefficiency. They miss the possibility that the US system is not trying to be efficient in the same way; it is trying to preserve a structure of liberty. This project fills the gap by introducing a non-efficiency metric (Domain integrity) to explain behaviors that efficiency models label as irrational or dysfunctional.

  **Democratic Proximity and Identity**

  Another major strand of literature focuses on democracy and identity. This school argues that local government is closer to the people, more accountable, and fosters civic engagement. Subsidiarity, in this view, is about democratic legitimacy.

  While this approach moves closer to the Domain concept, it often conflates proximity with authority. It argues that locals *should* decide because they are closer. But it often fails to distinguish between "they should decide unless the center does it better" (Allocation) and "they must decide because it is their sphere" (Domain).

  In the context of the EU, scholars of democratic deficit argue that subsidiarity is a tool to protect national democracies from Brussels. However, they are often puzzled by why the European Court of Justice does not enforce it more vigorously. They attribute this to judicial caution or institutional weakness. This project offers an alternative explanation: the Court is not being cautious; it is following the logic of the Treaty, which is Allocation-based. The Court cannot enforce a Domain right that does not exist in the text.

  In the US context, scholars of "New Federalism" argue that the Supreme Court has revived federalism to protect state dignity. This aligns with Domain Subsidiarity. However, the literature often struggles to define what "state dignity" means in practical terms. Is it a rhetorical flourish or a legal standard? This project aims to operationalize "dignity" as "Domain integrity," providing a clearer analytical tool for assessing court decisions.

  **The Legal Doctrinalists**

  Legal scholars tend to focus on specific doctrines: the Commerce Clause in the US, Article 5 in the EU, the Basic Law in Germany. They produce detailed analyses of case law. While invaluable, this literature is often siloed. EU scholars talk to EU scholars; US scholars talk to US scholars. Comparative federalism exists, but it often focuses on institutional structures (bicameralism, veto points) rather than the philosophical underpinnings of the subsidiarity principle itself.

  Furthermore, legal doctrinalists often take the text as given. They analyze how the court interpreted Article 5(3) of the EU Treaty. They rarely step back to ask whether Article 5(3) is conceptually coherent or whether it embodies a different principle than the US Tenth Amendment. They treat "subsidiarity" as a stable term across jurisdictions. This project challenges that stability. It argues that using the same word for the EU principle and the Swiss principle is a category error that hinders understanding.

  **The Gap: A Philosophical Taxonomy**

  The gap, therefore, is philosophical and taxonomic. There is no sustained treatment that explicitly categorizes subsidiarity into Allocation and Domain types and uses that categorization to explain comparative judicial behavior. Most comparisons are descriptive: "The EU is weaker than the US." This project is explanatory: "The EU is weaker because it is an Allocation system, while the US is a Domain system."

  Additionally, the literature often treats the "dead letter" accusation against the EU as a failure of political will. This project reframes it as a feature of the design. If the Treaty sets up an efficiency test, the Commission will pass that test most of the time. That is not a bug; it is the logical outcome of an Allocation system. Recognizing this changes the prescription for reform. If you want stronger local protection in the EU, you don't need stricter judicial review of the current test; you need to change the test from Allocation to Domain.

  By filling this gap, the project contributes to political philosophy by clarifying the normative commitments of federal structures. It also contributes to legal theory by offering a comparative framework that transcends specific doctrinal details. It allows a non-lawyer to engage meaningfully with legal systems by focusing on the structure of justification rather than the intricacies of procedure.

  ### IV. Comparative Institutional Analysis

  To test the hypothesis that Allocation and Domain subsidiarity explain the divergence in judicial review, this project will conduct a comparative analysis of four jurisdictions: the European Union, the United States, the Federal Republic of Germany, and the Swiss Confederation. These four represent a spectrum of centralization and different historical traditions of federalism.

  **The European Union: The Pure Allocation Model**

  The EU serves as the primary example of Allocation Subsidiarity. The Treaty on European Union explicitly defines subsidiarity in terms of objectives that cannot be sufficiently achieved by member states but can be better achieved by the Union. The language is purely functional. "Sufficiently" and "better" are efficiency terms.

  The project will analyze the structure of the Protocol on Subsidiarity and Proportionality. This protocol establishes a "yellow card" system where national parliaments can object to legislation. This is a political check, not a judicial one. It reinforces the idea that subsidiarity is a political negotiation about competence, not a legal boundary.

  The analysis will focus on the reasoning of the European Court of Justice in challenges brought by member states. Typically, the Court asks whether the Union institution provided a adequate statement of reasons. It does not independently assess whether the objective could have been met locally. This confirms the Allocation hypothesis: the Court reviews the process of allocation, not the substance of the domain.

  The project will also consider the roommate's point about economies of scale. In the EU context, the "single market" is a teleological goal. Almost any regulation can be linked to market functioning. This creates a ratchet effect where the "better achieved" test is almost always met by the center. This is not necessarily judicial abdication; it is the logical result of a system designed to integrate.

  **The United States: The Resurgent Domain Model**

  The US presents a more complex picture. Historically, the US shifted from a Domain model (dual federalism) to an Allocation model (cooperative federalism) during the New Deal era. However, since the 1990s, the Supreme Court has reintroduced Domain-style limits.

  The project will focus on two key doctrinal areas. First, the "anti-commandeering" doctrine. This principle holds that the federal government cannot compel state officials to administer federal programs. This is not an efficiency argument. It is a sovereignty argument. It protects the structural integrity of the state, regardless of whether federal administration would be more efficient. This is pure Domain Subsidiarity.

  Second, the project will look at Commerce Clause jurisprudence. While the Court generally defers to Congress on economic regulation, it has drawn lines around "non-economic" activity. This attempt to categorize activity as inside or outside a domain reflects Domain thinking, even if the boundaries are contested.

  The analysis will contrast the US judicial willingness to strike down laws with the EU's reluctance. The hypothesis is that US courts strike down laws when they perceive a violation of state sovereignty (Domain), whereas EU courts uphold laws because they perceive a satisfaction of efficiency criteria (Allocation).

  **Germany: The Cooperative Hybrid**

  Germany offers a middle ground. The Basic Law contains explicit lists of exclusive and concurrent powers. This looks like Domain Subsidiarity. However, the concept of "federal comity" (Bundestreue) requires cooperation. The Federal Constitutional Court has been active in policing boundaries, particularly regarding the financial autonomy of the Länder.

  The project will examine the Court's reasoning in cases involving framework legislation. Does the Court ask if the Federation *needed* to act (Allocation), or if it was *allowed* to act (Domain)? The German system also includes a second chamber (Bundesrat) composed of state representatives, which provides a political veto similar to the Swiss model but within a parliamentary framework.

  This case study is crucial for testing the limits of the binary. Germany suggests that a system can have Domain boundaries but still operate cooperatively. It challenges the idea that Domain Subsidiarity leads to gridlock. It suggests that clear boundaries might actually facilitate cooperation by reducing uncertainty about jurisdiction.

  **Switzerland: The Veto Model**

  Switzerland represents the strongest form of Domain Subsidiarity, reinforced by direct democracy. The cantons retain all powers not expressly delegated. But beyond the text, the ability of cantons to trigger referenda creates a political Domain protection.

  The project will analyze how the Swiss Federal Court handles competence disputes. Given the political veto, judicial review might be less contentious, or it might be more deferential to the political process. The key question is whether the Swiss system treats cantonal power as a right that cannot be traded for efficiency.

  The roommate's argument is that Switzerland avoids the EU's problem because of this veto. This project will test that. Is the veto effective because it enforces Domain subsidiarity? Or is it just another procedural hurdle? The distinction matters. If the veto is used to block efficient centralization to protect local culture, it supports the Domain hypothesis. If it is used to bargain for better financial terms, it supports the Allocation hypothesis.

  **Synthesis of Comparative Data**

  By comparing these four systems, the project will map them onto the Allocation-Domain spectrum.
  *   **EU:** High Allocation, Low Domain.
