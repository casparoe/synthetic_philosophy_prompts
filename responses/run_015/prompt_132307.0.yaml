  I'm applying for a one-semsester philosophy-of-law seminar and need a proposal, about 7000 words, on federalism and subsidiarity. My half-baked idea started when my roommate argued that EU subsidiarity is basically dead letter because the Commission can always claim economies of scale, and he said Switzerland avoids that since cantons can block things through direct democracy. That made me wonder whether we're actually dealing with two different principles that share a name: an allocation principle (lower levels get first crack at deciding) and a domain principle (there are spheres that can't be taken away no matter what the efficiency calculation says). The EU's Article 5(3) treats it as purely proceedural—if the Union can do it better, centralize—while US anti-commandeering doctrine and some German talk about Länder constitutional space treat it as substantive. So my question is: can we split subsidiarity into these two dimensions cleanly, and does that split explain why EU courts almost never strike legislation for violating subsidiarity while US courts do it constantly under the Commerce Clause? I want the proposal to state the question precisely, explain why the standard literature (efficiency vs. democratic proximity) leaves this open, lay out what I'd actually do month-by-month—probably comparing the Swiss cantonal veto, the German Constitutional Court's federal-comity reasoning, and EU judicial review—say what result would count as success (maybe showing the split holds but creates a paradox for courts) and what counts as failure (the split collapses because every procedural check becomes a disguised substantive judgment). Also be honest: is this too big for one semsester if I'm not a lawyer? Don't bother with citations, I'll fill those in myself, but don't invent specific case names I might misremember either.
