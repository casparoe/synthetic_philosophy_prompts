      *   **Point 5: Animalism Connection:**
          *   Confirm the suspicion. It's likely Animalism or Biological Continuity.
      *   **Conclusion:** Are they competing? Yes. One cares about *who* survives (Identity), the other cares about *that* someone survives (Relation R).

  5.  **Refine the Tone:**
