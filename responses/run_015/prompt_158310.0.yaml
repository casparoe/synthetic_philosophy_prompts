      *   **Define the Battlefield:** Clarify that this is a debate between *Reductionism (Parfit)* and *Non-Reductionism/Physicalism (Roommate)*.
      *   **Point 1: The Core Disagreement (What is "You"?):**
          *   Parfit: Pattern/Information.
          *   Roommate: Process/History.
      *   **Point 2: The Teletransporter & Causal History:**
          *   Explain why the Roommate says "No." (Interruption of causal flow).
