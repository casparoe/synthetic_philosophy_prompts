      *   **The Break:** The bite constraint is modeled on empirical knowledge (contingent facts). Applying it to necessary truths (math, logic, modality) is a category mistake. Reliability about necessary truths doesn't require the ability to track *variations* in truth value (since there are none), but rather the ability to avoid error in recognizing necessity.
      *   **Step to Reject:** Step (2). The bite constraint is inappropriate for necessary domains.

