      *   **The Problem:** This is a counterfactual sensitivity condition applied to necessary truths.
      *   **Mathematical/Logical/Modal Facts:** These are typically considered *necessary*. If Platonism is true, $2+2=4$ is necessarily true. There is no possible world where $2+2=4$ is false (on standard views).
