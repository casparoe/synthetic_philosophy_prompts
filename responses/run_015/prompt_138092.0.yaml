      *   *Pricing:*
          *   Platonist: Pay for an epistemology of rational insight or conceptual truth. Non-causal reference fixes the "aboutness" but needs a story on why our concepts are sound (evolutionary/pragmatic).
          *   Nominalist: Pay for an account of modal knowledge or linguistic convention. Reducing math to modal facts inherits the modal epistemology problem.
          *   Does it rename the problem? Yes, if not careful. Conceivability needs justification.
      *   *Conclusion on (6):* (6) shows (2) is overextended. Necessary truths don't need to "bite" because they can't be otherwise; the risk is not mistracking variation, but misunderstanding necessity.

