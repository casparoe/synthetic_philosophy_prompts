answer: |-
  Here is an example framed for a software engineer, avoiding the classic philosophy tropes.

  ### The Analogy: Type Check vs. Runtime Value

  In two-dimensional semantics, we distinguish between **how a reference is fixed** (Primary Intension) and **what the reference actually is** once fixed (Secondary Intension).

  *   **Primary Intension (The "Type Check"):** This is the logic or algorithm used to determine a value in *any* given environment. It asks: "If we treat this specific deployment as the 'real' one, how does the code resolve this variable?"
  *   **Secondary Intension (The "Runtime Value"):** This is the specific value hard-coded in memory *after* the system has started in our actual world. It asks: "Given our specific production state, would this statement hold true if we swapped out the underlying hardware or network conditions?"

  ### The Example Sentence

  > **"The timeout threshold is the network latency measured at initialization."**

  Imagine you have a self-calibrating microservice. When it boots up, it pings a dependency, measures the latency, and sets its `timeout_threshold` configuration to exactly that value.

  #### 1. Primary Intension: Necessary (Passes the "Type Check")
  **Question:** In any possible environment considered as "Actual" (Dev, Staging, Prod, or a hypothetical simulation), does this statement hold true?

  **Answer:** **Yes.**
  In *every* world you treat as the "live" environment, the system's logic defines `timeout_threshold` as "whatever the latency was at initialization in *that* world."
  *   In World A (Fast Network): Init Latency = 10ms. Threshold sets to 10ms. **Match.**
  *   In World B (Slow Network): Init Latency = 500ms. Threshold sets to 500ms. **Match.**

  Because the *definition* of the threshold is functionally tied to the initialization latency, the sentence is true in all worlds considered as actual. It is **Primary Necessary**. It's like a type safety guarantee: the code ensures they are always equal at boot.

  #### 2. Secondary Intension: Contingent (Fails the "Runtime Check")
  **Question:** Now, freeze our **actual** production deployment. We have fixed the specific values in memory. Is the statement true in all counterfactual scenarios (e.g., if we had different hardware)?

  **Answer:** **No.**
  In our *actual* production run, the initialization latency happened to be **50ms**.
  *   The term `"The timeout threshold"` now rigidly designates **50ms** (the value stored in memory).
  *   The term `"The network latency measured at initialization"` is a description that can vary in counterfactuals.

  Now, imagine a **counterfactual runtime scenario** where the same service was deployed on slower hardware:
  *   In this scenario, the `"network latency measured at initialization"` would have been **200ms**.
  *   However, `"The timeout threshold"` (rigidly fixed to our actual 50ms) remains **50ms**.
  *   **50ms ≠ 200ms.**

  In this counterfactual world, the sentence is **False**. Because the truth of the sentence depends on the specific contingent facts of our actual deployment (the 50ms value), the Secondary Intension is **Contingent**.

  ### Summary Table

  | Dimension | SE Analogy | Question | Result | Why? |
  | :--- | :--- | :--- | :--- | :--- |
  | **Primary** | **Type Check / Logic** | "Does the definition hold in any environment?" | **Necessary** | The code logic *forces* them to match in every environment. |
  | **Secondary** | **Runtime / State** | "Does the specific value hold in hypothetical scenarios?" | **Contingent** | The specific value (50ms) is fixed, but the latency property could have been different. |

  ### Why this fits your constraints
  *   **Not "I am here":** It uses system configuration, not personal indexicals (though it structurally mimics how indexicals work).
  *   **Not "Water = H2O":** "Water = H2O" is Primary Contingent / Secondary Necessary. This example is the exact opposite (Primary Necessary / Secondary Contingent).
  *   **Concrete:** It relies on initialization logic and runtime state, which are familiar engineering concepts.
