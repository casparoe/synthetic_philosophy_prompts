  # COMMITTEE PROTOCOL 7.4: EVALUATION OF FIELD RESEARCH OUTCOMES AND DECISIONS

  **Purpose:** To standardize the assessment of early-career field researchers for prizes and recovery grants, explicitly separating the quality of decisions from the quality of outcomes.
  **Authority:** Learned Society Council Committee on Field Standards.
  **Applicability:** All prize and grant deliberations involving fieldwork data.

  ---

  ## PART I: THE PROCEDURE

  ### Step 1: Reconstruction of the Decision (Ex-Ante)
  **Action:** Before reviewing the outcome, the committee must reconstruct the decision matrix facing the candidate at the time of action.
  **Required Evidence:** Field proposal, risk assessment, contemporaneous logs, weather forecasts available at the time.
  **Question:** *Given the information available at T-0 (start of season), was the chosen protocol within the bounds of accepted professional practice?*
  **Stopping Point:** If the answer is **No**, proceed to Step 4 (Sanction). If **Yes**, proceed to Step 2.
  **Sufficient Answer:** A binary verdict: **Process Compliant** or **Process Non-Compliant**.
  **Note:** Do not consider the actual outcome in this step.

  ### Step 2: Dual Verdict Recording
  **Action:** The committee must record two separate scores.
  1.  **Decision Quality (DQ):** Based on Step 1. (Scale: Defensible / Optimal / Negligent).
  2.  **Outcome Value (OV):** Based on data quality, safety, and conservation impact. (Scale: High / Neutral / Catastrophic).
  **Requirement:** These must be written in separate columns in the minutes.
  **Divergence Rule:** If DQ is High but OV is Catastrophic (or vice versa), the committee must draft a single sentence for the minutes stating which score drives the financial decision.
  *Example:* "Grant awarded based on Decision Quality despite Catastrophic Outcome."
  *Example:* "Prize awarded based on Outcome Value despite Ambiguous Decision Quality."
  **Philosophical Cost:** Acknowledge in the minute that awarding based on OV constitutes a concession to moral luck.

  ### Step 3: The Stability Range Test (Replacing Counterfactuals)
  **Action:** Instead of asking "Was this luck?", ask: "How much could the outcome have varied while we would still have made the same verdict?"
  **Procedure:** The committee must estimate the width of the outcome window compatible with the current verdict.
  *   **Wide Range:** Verdict holds across most weather/equipment scenarios. (Indicates robust planning).
  *   **Narrow Range:** Verdict flips if one variable changes (e.g., wind speed +10 knots). (Indicates outcome dependency).
  **Recording:** The minute must state: "Verdict is Stable" or "Verdict is Outcome-Dependent."
  **Constraint:** If "Outcome-Dependent," a Prize cannot be awarded for *skill*, only for *result*. A Grant cannot be denied for *negligence*, only for *risk profile*.

  ### Step 4: Epistemic Use of Outcomes (Evidence vs. Condemnation)
  **Action:** Determine if the outcome is being used to infer hidden facts or to punish.
  **Rule:**
  *   **Admissible:** Using a bad outcome to infer that a risk was higher than the candidate estimated (Epistemic correction).
  *   **Inadmissible:** Using a bad outcome as the sole proof of negligence when the Decision Quality (Step 1) was Compliant.
  **Test:** If the record shows the candidate followed protocol, a bad outcome cannot be used to justify the word "careless" in the minute. It may only be recorded as "unfortunate" or "high-risk realization."

  ### Step 5: Agent-Regret Protocol (Non-Punitive Responsibility)
  **Action:** If Outcome Value is Catastrophic (harm to subjects, environment, or persons) but Decision Quality is Defensible/Optimal.
  **Requirement:** No financial sanction or censure. However, the candidate is required to undertake **Restorative Action**.
  **Restorative Action Includes:**
  1.  Writing the technical account of failure for the society archives.
  2.  Notifying affected stakeholders (landowners, conservation bodies).
  3.  Participating in repair or monitoring (unpaid).
  **Distinction:** The minute must explicitly state: "These requirements are obligations of agency, not sanctions of fault."

  ### Step 6: The Sequence Rule (Patterns vs. Streaks)
  **Action:** When a candidate presents multiple failed seasons.
  **Threshold:**
  *   **1-2 Failures:** Treated as independent events. Grant eligibility remains high if Decision Quality was Compliant.
  *   **3+ Failures:** Triggers a **Probability Review**.
  **Probability Review:** The committee must calculate if the probability of three consecutive failures under the candidate's stated protocol is <5%.
  *   If **<5%**: The failures are treated as evidence of an unobserved variable (likely poor judgment or hidden risk). Decision Quality is downgraded to Negligent.
  *   If **>5%**: The failures are treated as a Streak. Decision Quality remains Compliant. Grant awarded.
  **Note:** This converts "bad luck" into "statistical evidence" only when the odds become vanishingly small.

  ### Step 7: The Character Stop Rule
  **Action:** During deliberation, if any member argues that the candidate is "reckless," "steady," or "cursed."
  **Requirement:** The Chair must halt discussion.
  **Declaration:** The committee must record: "Deliberation has moved from Decision Assessment to Character Assessment."
  **Consequence:** The committee may not issue a Prize or Sanction based on this assessment. They may only issue a **Letter of Concern** or **Letter of Confidence** attached to the file, marked as non-binding.
  **Reason:** The committee is mandated to judge work, not persons.

  ---

  ## PART II: SCOPE AND LIMITATIONS

  **1. Metaphysical Neutrality:** This procedure does not resolve whether moral luck is real. It manages the administrative consequences of the belief that it is. It accepts that sometimes money will follow luck, provided this is recorded.

  **2. The Record Gap:** This procedure relies on contemporaneous records (logs, proposals). In field biology, these are often incomplete. Where records are missing, the benefit of the doubt goes to the candidate on Decision Quality, but the Stability Range (Step 3) is automatically classified as "Narrow."

  **3. Character Judgments:** This procedure cannot assess virtue or vice. It explicitly identifies when the committee is attempting to do so and halts the process. It accepts that some candidates may be "unlucky" in a way that looks like incompetence, and the committee lacks the tools to distinguish them without statistical proof (Step 6).

  **4. Liability:** Compliance with this procedure does not indemnify the Society against legal liability. It is an internal ethical standard, not a legal defense.

  ---

  ## PART III: APPLICATION TO CASES

  ### Case 1: The Twin Protocols (Same Decision, Opposite Outcomes)
  **Facts:** Two students. Same high-risk early window. Student A: Calm, great data. Student B: Storms, rockfall, no data.
  **Procedure Run:**
  *   **Step 1 (Reconstruction):** Both chose the same window. Both Process Compliant (high risk is allowed in science).
  *   **Step 2 (Dual Verdict):**
      *   Student A: DQ = Defensible. OV = High.
      *   Student B: DQ = Defensible. OV = Catastrophic (for career).
  *   **Step 3 (Stability):**
      *   Student A: Wide Range. (Would have succeeded in moderate wind too).
      *   Student B: Narrow Range. (Verdict flips on weather).
  *   **Step 6 (Sequence):** N/A (First season).

  **Decision:**
  *   **Prize:** Awarded to Student A.
      *   *Minute Statement:* "Prize awarded based on Outcome Value. Decision Quality was identical to unsuccessful candidate. This is a concession to the honorific nature of the prize."
  *   **Grant:** Awarded to Student B.
      *   *Minute Statement:* "Grant awarded based on Decision Quality. Outcome was Outcome-Dependent (Narrow Range). No evidence of negligence."
  *   **Philosophical Cost:** We admit the prize rewards luck. We admit the grant compensates for luck. The distinction is preserved by the *label* of the money, not the logic of the merit.

  ### Case 2: The Rule-Breaker vs. The Unlucky Compliant
  **Facts:** Student C: No permits/certs, great data. Student D: All permits, assistant injured by ledge collapse.
  **Procedure Run:**
  *   **Student C:**
      *   **Step 1:** Process Non-Compliant (Missing mandatory certs/permits).
      *   **Step 4:** Outcome (good data) is Inadmissible as evidence of safety.
      *   **Verdict:** Sanction. Prize denied.
      *   *Minute:* "Sanction applied for Process Non-Compliance. Outcome Value does not mitigate procedural breach."
  *   **Student D:**
      *   **Step 1:** Process Compliant.
      *   **Step 2:** DQ = Defensible. OV = Catastrophic (Injury).
      *   **Step 3:** Stability Range. Ledge collapse is low probability. Range is Narrow.
      *   **Step 5:** Agent-Regret. Injury occurred.
      *   **Verdict:** Grant awarded. No sanction.
      *   *Requirement:* Student D must file the accident report (Step 5), but is not labeled negligent.

  **Resolution:** The procedure keeps both reactions. C is sanctioned for *control* (paperwork/certs were within control). D is supported because the injury was outside control *and* process was sound. The "unreflective view" is validated but grounded in Step 1 (Control) rather than Step 2 (Outcome).

  ### Case 3: The Optimal Decision with Harmful Outcome
  **Facts:** Candidate E. Best available decision protocol. Result: Colony disturbance, nest abandonment.
  **Procedure Run:**
  *   **Step 1:** Process Optimal.
  *   **Step 2:** DQ = Optimal. OV = Catastrophic (Conservation harm).
  *   **Step 4:** Outcome cannot be used to infer negligence.
  *   **Step 5:** Agent-Regret Protocol Triggered.

  **Decision:**
  *   **Sanction:** None. No financial penalty. No censure in the minute.
  *   **Requirement:** Candidate E must write the technical account, notify the conservation body, and fund/perform monitoring of the abandoned nests (Restorative Action).
  *   **The Unliked Answer:** The candidate is not "blamed," but they are not "free." They carry the burden of the harm without the stigma of fault.
  *   **Cost to Candidate:** Time, reputation (the report is public), and emotional burden of having caused harm while doing everything right.
  *   **Cost to Society:** We fund the repair of damage caused by a grant we awarded, acknowledging that "safe science" sometimes damages the subject. We lose the moral clarity of saying "someone was wrong."

  ---

  ## PART IV: WHAT THIS PROCEDURE CANNOT DO

  **1. It cannot settle the question of blame.**
  This protocol does not prove whether the candidate *deserves* praise or blame in a cosmic sense. It only dictates how the Society distributes funds and minutes. It is a bureaucratic truce, not a moral truth.

  **2. It cannot fix missing records.**
  Field biology is often conducted without rigorous logs. If a candidate claims "I assessed the risk" but has no log, Step 1 defaults to "Benefit of the Doubt." This invites gaming. The procedure accepts this risk as the price of supporting fieldwork where documentation is secondary to survival.

  **3. It cannot judge character.**
  There will be candidates who are genuinely reckless but lucky, and genuinely careful but cursed. Step 7 admits we cannot tell the difference without a statistical sequence (Step 6). If a committee member says, "I just feel he is reckless," the procedure forces us to stop. We will not fund or punish based on feelings. This means some reckless people will get grants, and some careful people will be left behind. This is the cost of limiting our mandate to decisions, not persons.

  **4. It cannot remove the discomfort.**
  The minutes will still contain sentences like "Prize awarded for Outcome despite Identical Decision." This will look inconsistent to an outsider. The procedure does not hide the inconsistency; it requires us to sign our names to it.
