answer: |-
  This is a sharp design challenge. You're trying to gamify a moral intuition pump without triggering the defense mechanisms that kill the conversation. The key is to make the mechanics feel like *engineering constraints* (latency, bandwidth, on-call load) so the ethical tension emerges from the system, not your facilitation.

  Here is the activity design: **"The Context Switch Protocol."**

  ### **Materials Needed**
  *   **Index Cards:** 3 decks (Color-coded: Green, Yellow, Red).
  *   **Tokens:** Poker chips, coins, or just tick-marks on paper (representing "Focus").
  *   **Dice:** One d6 per table.
  *   **Printed Sheets:** "Shift Log" (one per player) and "System State" (one per table).
  *   **Timer:** Visible countdown.

  ### **The Setup (5 Minutes)**
  **Facilitator Script:**
  > "This is a resource allocation simulation. You are on-call. Your resource is **Focus**. Your goal is to maintain System Stability while minimizing User Harm. There are no right answers, only trade-offs. We will run three shifts. At the end, we will review the logs."

  **Grouping:** Split 12-16 people into 4 tables of 3-4.
  **Budget:** Each player starts with **5 Focus Points** per shift.
  **The Cost Curve (Write this on the whiteboard):**
  *   1st Action taken in a shift: **Cost 1**
  *   2nd Action taken in a shift: **Cost 2**
  *   3rd Action taken in a shift: **Cost 4**
  *   4th Action: **Impossible** (Cost exceeds budget).
  *   *Note:* This is the convex cost. The third interrupt costs as much as the first two combined.

  ---

  ### **Round 1: "The Desk Tap" (10 Minutes)**
  *Represents: The Drowning Child (Immediate, Visible, Low Ambiguity)*

  **The Cards (Green Deck):**
  *   **Text:** "CRITICAL: User [Name] cannot checkout. They are standing at the support desk."
  *   **Harm:** 10 Stability Points if ignored.
  *   **Backup:** None. (If you don't fix it, it breaks).
  *   **Distance:** Place the card directly on the player's keyboard.

  **Mechanic:**
  Deal 2 Green cards to each player.
  They must choose: Fix (pay cost) or Ignore (take Stability hit).
  Because the budget is 5, they can easily fix both (Cost 1 + Cost 2 = 3). They have 2 Focus left over.
  **Outcome:** Almost everyone fixes both. It feels easy. The cost is low, the harm is visible.

  ---

  ### **Round 2: "The Ticket Queue" (15 Minutes)**
  *Represents: The Commuter/Neighbor (Medium Distance, Probabilistic Backup)*

  **The Cards (Yellow Deck):**
  *   **Text:** "HIGH: User [Name] reporting data loss. Ticket #4920."
  *   **Harm:** 10 Stability Points if ignored.
  *   **Backup:** "Shadow Responder: 50% Chance."
  *   **Distance:** Place the card in the center of the table (arm's length, not personal space).

  **Mechanic:**
  Deal 4 Yellow cards to the *table* (shared pool), but assign responsibility randomly (each player owns 1 card, 1 card is "orphaned").
  *   **The Twist:** If a player chooses **Ignore**, they must roll the d6.
      *   Roll 1-3: The backup failed. Harm occurs (10 Stability).
      *   Roll 4-6: The backup succeeded. No Harm.
  *   **The Tension:** The budget is still 5. The cost curve is still 1/2/4.
      *   If you fix your card (Cost 1 or 2), you are safe.
      *   If you ignore, you might get lucky.
      *   If you try to fix the "orphaned" card too, you might hit the Cost 4 cliff.

  **Observation Point:** Watch who ignores their card hoping for the die roll. Watch who argues that "fixing the orphaned card is inefficient because I have my own."

  ---

  ### **Round 3: "The Dashboard" (15 Minutes)**
  *Represents: Global Poverty/Strangers (High Distance, Aggregate Harm, Convex Cliff)*

  **The Cards (Red Deck):**
  *   **Text:** "ALERT: Latency spike in Region [X]. Affects 5,000 users. Estimated revenue loss $X."
  *   **Harm:** 2 Stability Points *per user group* (Total 10).
  *   **Backup:** "Shadow Responder: 10% Chance." (The system is overloaded; help is unlikely).
  *   **Distance:** Read the card aloud. Do not hand it out. It is a statistic.

  **Mechanic:**
  Deal 3 Red cards to each player.
  **The Kicker:** The Cost Curve resets, *but* the Budget is now **4 Focus Points** (simulating fatigue/end of week).
  *   Action 1: Cost 1.
  *   Action 2: Cost 2.
  *   Action 3: Cost 4 (Impossible).
  *   **Result:** You can *mathematically* save 2 groups. The 3rd group *must* suffer.
  *   **The Choice:** Which 2 do you save? The ones with the highest harm? The ones you saw first? Or do you try to save all 3 and go into "Negative Focus" (Burnout)?
  *   **Burnout Rule:** If you spend more than 4, mark "Burnout." You finish the shift, but you are told: "Due to Burnout, your performance review is impacted." (Social cost, not real).

  ---

  ### **The Reveal & Debrief (25 Minutes)**
  *This is where you do the actual work. Do not skip the timing.*

  **Step 1: The Data (5 mins)**
  Ask tables to report:
  1.  How many Green cards were saved? (Likely 100%)
  2.  How many Yellow cards were ignored hoping for the backup?
  3.  In Red, who went into Burnout to save the 3rd group? Who accepted the loss?

  **Step 2: The Map (10 mins)**
  Now you draw the line. Put this on the whiteboard:

  | Game Mechanic | Ethical Equivalent |
  | :--- | :--- |
  | **Focus Points** | Your time/money/comfort. |
  | **Convex Cost** | "Comparable Moral Significance" (Ruined suit vs. Financial Ruin). |
  | **Green Card** | The Drowning Child (Right in front of you). |
  | **Yellow Backup** | "Other engineers/charities would have done it." |
  | **Red Distance** | Strangers far away (Statistics vs. Names). |
  | **Budget Cap** | The arbitrary line where we say "Enough." |

  **Step 3: The Singer Reveal (5 mins)**
  > "This simulation was based on a 1972 essay by Peter Singer called *Famine, Affluence, and Morality*.
  >
  > *   **Green** was the child in the pond. You all saved them.
  > *   **Yellow** was the argument that 'someone else is already helping.'
  > *   **Red** was the argument that distance and numbers shouldn't change the obligation, even if the cost to you becomes higher.
  >
  > The convex cost curve was my attempt to model Singer's clause: *'without sacrificing anything of comparable moral significance.'* The 3rd action cost 4 points. That was meant to feel like 'ruining your whole afternoon.' The question is: Is that cost comparable to the harm you prevented?"

  **Step 4: The Fork (5 mins)**
  Ask the specific question you wanted:
  > "In Round 3, you hit a budget cap. You couldn't save everyone.
  > **Option A:** The cap proves the argument fails. You *can't* save everyone, so you aren't obliged to save the 3rd person.
  > **Option B:** The cap is arbitrary. If the harm is death/failure, you should have gone into Burnout (spent 8 points on a 4 point budget).
  >
  > Which one is it? Does the convex cost justify stopping, or does it just make the stopping point feel more engineering-friendly?"

  ---

  ### **Predictable Failure Modes & Mitigations**

  **1. The Utilitarian Derailment**
  *   **Risk:** One person calculates the global optimum ("If we all pool budgets we save 10% more!") and ignores the individual constraint.
  *   **Mitigation:** Enforce the rules rigidly. "This is a simulation of *individual* agent constraints. Pooling is not allowed." This mirrors the real world: you can't force your colleague to donate their salary.

  **2. The Cynic ("This is performative guilt")**
  *   **Risk:** He treats it as a joke, rolls dice loudly, tries to break the game.
  *   **Mitigation:** Give him the "Auditor" role. Hand him the master score sheet. His job is to ensure no one cheats the Focus budget. Make him the guardian of the constraints. If he engages with the rules, he engages with the ethics.

  **3. The "Gamer" (Optimizing for Points)**
  *   **Risk:** Someone treats Stability Points as a high score to maximize, ignoring the "Harm" narrative.
  *   **Mitigation:** In the debrief, call this out. "If you treated User Harm as just -10 points, you played the game perfectly. That is exactly the mindset the argument challenges. Did you feel differently when the card had a name on it vs. a Region ID?"

  **4. The Charity Fight**
  *   **Risk:** "Which charities actually work?"
  *   **Mitigation:** Shut it down immediately. "This isn't about charity efficacy. It's about the obligation structure. We are discussing the *engine*, not the *fuel*."

  ---

  ### **Honest Limitations (What the Game Can't Do)**

  You asked for honesty about where the rules fail. Put this in your back pocket for the end.

  1.  **The "Death" Stake:** In the game, "Stability Points" are abstract. In Singer's argument, the harm is *death*. No card game can replicate the visceral weight of a human life. The game might make the conclusion feel lighter than it is.
      *   *Say this:* "The game makes the harm feel like a metric. In reality, the harm is people. If you felt 'meh' about the Red cards, that's a feature of the simulation, not a failure of your morality. But don't confuse the two."
  2.  **The Arbitrary Budget:** You suspected the convex cost just relocates the arbitrariness. You are right. The game forces a budget of 5. Why 5? Singer argues the budget shouldn't exist until you are as poor as those you help.
      *   *Say this:* "The game forced a stopping point (Budget 5). Singer argues there *is* no stopping point until you break. The game makes you comfortable with stopping. That comfort is the thing we need to examine."
  3.  **No Skin in the Game:** They didn't actually lose focus. They didn't actually miss a deadline.
      *   *Say this:* "We simulated interruption, but you didn't actually lose your afternoon. The argument demands actual sacrifice. This room was safe. The real world isn't."

  ### **Success Criteria**
  You win if, when they leave, the Utilitarian says: *"I see why the backup mechanic feels like laundering, even if the outcome is the same."*
  You win if the Cynic says: *"The budget cap is where the logic breaks, not the distance."*
  You win if the quiet engineer says: *"I didn't realize I was treating the Red cards differently because they didn't have names."*

  Don't aim for agreement. Aim for precise disagreement.
