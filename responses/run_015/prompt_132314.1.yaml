      *   *Actually, a stronger one:* **A Guide Dog.** It's external, alive (sometimes), integrated into movement, trusted implicitly, but distinct from the body.
      *   *Best one:* **The Vestibular System vs. A Cane.** A cane extends touch. But the *mind* analogy is trickier. Let's go with **Software/OS**. The phone is the hard drive, the brain is the CPU. But that's dualist.
      *   *Selection:* **The Exoskeleton.** It enhances capacity, is worn, requires training, but remains distinct equipment. Or **The Librarian**.
      *   *Decision:* Let's suggest **Scaffolding** or **Infrastructure**. It supports the building (mind) but isn't the building.

  10. **Drafting the Response (incorporating constraints):**
      *   *Tone:* Analytical, neutral, clear distinction between consensus and opinion.
      *   *Structure:*
