  The path curves round to meet the starting place.
  Where matter spins in a static night.
  No expansion stretches the empty space,
  And geometry bends the local sight.

  The metric allows a closed timelike trace,
  Not to voyage back and set it right.
  It strips succession from the world's face,
  Showing no moment holds on tight.

  There is no river flowing through space,
  Only coordinates fixed in the night.
  Time is an ideal, not a race,
  Vanishing from the logical sight.

  I flew through the dust to chase the light,
  But found no linear thread in this place.
  For the loop denies what was once right,
  The path curves round to meet the starting place.
