prompt: |-
  I am writing a novel about an interwar economist who realizes that the discount rate he applies to long-range public works is not a mathematical convenience but a concealed ethical judgment about whether future people possess full moral standing. Analyze the 1972 publication of The Limits to Growth and the controversy over its WORLD3 projections as a historical episode in which pure time preference was embedded—perhaps smuggled—into empirical modeling. Identify the principal actors—the MIT group led by Meadows and Forrester, the institutional sponsors, and early critics such as Nordhaus—map what intertemporal weights the model implicitly assigned to distant generations, and carefully distinguish where the backlash targeted the empirical assumptions from where it targeted the normative premise that welfare far in the future should count for less. Then explain what the episode reveals about whether pure time preference can ever be cleanly separated from instrumental discounting in policy science, and assess whether my character’s intuition—that a narrative in which future generations appear as fully realized characters rather than as discounted variables expresses a philosophically defensible stance—finds support or contradiction in the actual debate. Do not provide bibliographies or source lists; I need the conceptual architecture, not citations.
