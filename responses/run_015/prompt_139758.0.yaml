answer: |-
  This is a remarkably sharp set of questions. You are identifying the friction points where soteriological pragmatism meets formal constraint. Your friend the dialetheist is spotting structural isomorphisms (paraconsistency, rejection of bivalence), but as you suspect, the *function* of these structures in the Geluk curriculum is distinct from their function in contemporary analytic metaphysics.

  Here is a reconstruction of the implicit theory behind the package you described, organized by your three threads, followed by the institutional tension and the counterfactuals. I will flag field-note issues as we go.

  ### 1. The No-Own-Thesis Norm: *Prasaṅga* as Immanent Critique
  **Field Note Flag:** You write that the challenger "never states a position of his own." In strict *thal 'gyur* (consequence) form, this is methodologically true. However, in the Geluk courtyard, the challenger is implicitly operating from the Prāsaṅgika worldview. He is not a blank slate; he is a surgeon using the patient's own anatomy to show where the tumor is.

  **The Theory:**
  You distinguish between the **Conditional-Only Reading** (If P then Q; you accept P; you must accept Q [which is absurd]) and the **Loaded Reading** (If P then Q; Q is false; therefore P is false).
  *   **Underdetermination:** The practice is formally compatible with the Conditional-Only reading. This is the "safe" Madhyamaka position: I assert nothing; I only show your internal incoherence.
  *   **Presupposition:** However, you are right that the Conditional-Only reading lacks *soteriological traction*. If I merely show you that your view implies X, and you say "So what? I accept X," the debate stalls. For the debate to function as a path to liberation, the **Loaded Reading** must be in force *conventionally*.
  *   **The Geluk Solution:** The Geluk implicit theory is that *prasaṅga* functions as a *svātantra* (autonomous inference) *for the defender*, but not for the challenger. The challenger does not need to believe the subject exists intrinsically, but he knows that *within the defender's ontology*, the consequence is untenable.
  *   **Metaphysical Backing:** This requires a commitment to **intersubjective coherence**. It presupposes that while ultimate truth is beyond logic, conventional truth is governed by non-contradiction. The "Loaded" reading works because the defender is assumed to be rational (in the classical sense) regarding conventional reality. The "change of view" happens because the defender is forced to abandon a *conceptual reification* that violates the coherence of conventional experience, not because the challenger proved an ultimate fact.

  ### 2. Pervasion (*Vyāpti*) without Intrinsic Nature
  **The Problem:** If $A$ and $B$ are empty, what grounds the necessity that "If $A$, then $B$"? If pervasion relies on *svabhāva* (own-being), Madhyamaka destroys the engine of debate.
  **The Theory:**
  *   **Presupposition:** The debate practice presupposes that **dependence is the ground of validity**, not the enemy of it. In Geluk epistemology (*tshad ma*), pervasion is established not by finding a metaphysical glue between universals, but by observing that there is no counter-example in the three times (past, present, future).
  *   **Comfortable Fit:** This sits comfortably with a **Nomological Conventionalism**. Logic does not have *svabhāva*, but it describes the regularities of dependent arising. A table is empty, but it still supports a cup. Logic is empty, but it still supports inference.
  *   **Underdetermination:** Here is where your friend might pounce. Is the necessity *mind-dependent* (conceptual exclusion, *apoha*) or *world-dependent* (causal regularity)?
      *   If it is purely conceptual (*apoha*), then logic is a game of definitions.
      *   If it is causal, then logic tracks reality.
      *   Geluk debate manuals often treat pervasion as "established by the power of the object" (*yul stobs*), suggesting a realism about conventional relations. This implies that while objects lack *intrinsic* nature, they possess *characteristic* nature (*rang gi mtshan nyid*) conventionally.
  *   **The Risk:** If you push the emptiness argument too hard on logic itself, you get the "emptiness of emptiness" regress. The debate practice implicitly stops this regress by treating logical norms as **pragmatically ultimate**. You cannot debate the laws of debate while debating.

  ### 3. The Tetralemma (*Catuṣkoṭi*): Exhaustion vs. Explosion
  **Your Distinction:** Dilemmatic (uses bivalence to break bivalence) vs. Explosive (rejects the space).
  **The Theory:**
  *   **Misdescription Risk:** You suggest the tetralemma refutes "all four corners." In Geluk exegesis, the four corners exhaust **conceptual elaboration** (*prapañca*), not ontological possibilities.
  *   **Presupposition:** The practice presupposes that **reality is non-conceptual**. The tetralemma is not a truth-function over the world; it is a truth-function over *predications about the world*.
  *   **Dilemmatic Reading:** This is the standard Geluk pedagogical move. We accept the Law of Excluded Middle (LEM) *conventionally* to show that *any* conceptual position (Exist, Non-Exist, Both, Neither) leads to absurdity *ultimately*. We use the ladder to kick the ladder.
  *   **Explosive Reading:** This maps closer to the Dialetheist/Garfield/Priest reading. If the ultimate is ineffable, perhaps the logic governing it is paraconsistent.
  *   **Where the Practice Stands:** The debate courtyard is **classical**. The defender cannot say "Both true and false." That is an automatic loss ("absurd consequence"). The *textual* canon (Nāgārjuna) might allow the Explosive reading ultimately, but the *institutional* practice requires the Dilemmatic reading conventionally.
  *   **Underdetermination:** The practice does not determine whether the failure of the four corners is due to (a) the world being indeterminate or (b) language being inadequate. Geluk tends toward (b): the world is fine (conventionally); your grasping is the problem.

  ### 4. The Institutional Tension: Courtyard vs. Classroom
  **The Conflict:** No thesis in debate vs. Prāsaṅgika supremacy in exams.
  **The Resolution:** This is not a contradiction; it is a **Two-Truths Pedagogy**.
  *   **The Classroom (Doxography):** Operates on the level of **Conventional Truth** (*kun rdzob*). Here, views are ranked. Prāsaṅgika is the "highest" view because it is the most accurate description of conventional reality (i.e., that it lacks intrinsic nature). You are rewarded for holding this thesis.
  *   **The Courtyard (Debate):** Operates as a simulation of **Ultimate Truth** (*don dam*). Here, the goal is to de-reify the very thesis you learned in the classroom.
  *   **The Implicit Theory:** You must hold a view to realize the view is empty. This is the "Medicine" model. The Prāsaṅgika thesis is the medicine; the debate is the process of digestion and elimination. If you don't take the medicine (Classroom), you don't get cured. If you don't eliminate the medicine (Courtyard), you get sick (conceptual grasping at "Emptiness").
  *   **Is it a Genuine Tension?** Yes, but a **performative** one. The institution rewards you for mastering the tension. A high-ranking Geshe is one who can assert Prāsaṅgika tenets with conviction in an exam and dismantle the ontological grounding of those same tenets in the courtyard an hour later. The rank depends on the *fluidity* between these modes, not the consistency.

  ### 5. Counterfactuals

  **A. If the *Prasaṅga*-Only Norm were replaced by Svātantrika (Autonomous Inference):**
  *   **Structural Change:** The challenger would have to state a thesis: "Sound is impermanent, because it is produced."
  *   **Dependency:** This requires **shared ontology**. The challenger and defender must agree that "Sound" and "Produced" exist in the same way.
  *   **Consequence:** The debate would become **constructive** rather than **therapeutic**. It would build a system rather than dismantle a grasping.
  *   **Loss:** You lose the ability to critique the defender's ontology from the outside. You become complicit in their reification. In Geluk terms, you lose the ability to teach emptiness to someone who believes in intrinsic nature, because you'd have to pretend intrinsic nature exists to make the inference work.

  **B. If Your Friend were Right (Dialetheism / True Contradictions):**
  *   **Structural Change:** If some corners of the tetralemma are both true and false, the **Absurd Consequence** (*thal 'gyur*) loses its force.
  *   **The Engine Stall:** The debate engine runs on the principle that *contradiction is a defeater*. If the defender can say, "Yes, it follows that sound is permanent and impermanent, and that is true," the challenger has no move. The "menu of replies" would need a new option: "Acceptable Contradiction."
  *   **Metaphysical Shift:** This would require abandoning the **soteriological goal** of the debate. The goal is to end suffering (*duḥkha*). Geluk theory posits that suffering arises from contradiction/clashing desires rooted in reification. If contradiction is ontologically valid, suffering might be ontologically valid. The path to liberation collapses.
  *   **Verdict:** The practice is **incompatible** with dialetheism, even if the texts (Nāgārjuna) can be read that way by Western philosophers. The *institution* requires classical logic to function as a purification technology.

  ### Summary of the Implicit Theory
  The Geluk debate package presupposes a **strategic dualism**:
  1.  **Logic is Conventionally Real:** It has enough "own-being" to function as a tool (pervasion holds, contradiction is fatal).
  2.  **Ontology is Ultimately Empty:** No proposition about the world captures intrinsic reality.
  3.  **The Tension is the Path:** The friction between using logic to deny the ultimate validity of logic is what generates the realization of emptiness.

  Your friend sees a non-classical logic wearing ritual costume. You are seeing a classical logic wearing a **deconstructive** costume. The ritual isn't hiding the logic; it's *using* the logic to destroy the metaphysical commitments that usually accompany it. The "inconsistency" you feel between the classroom and the courtyard is the intended friction of the machine.

  **One final field note correction:** You mentioned the defender's menu is "small fixed." In advanced debate (especially at Sera), the defender's "It is not established" (*ma grub*) can be weaponized to challenge the challenger's definitions, turning the table. The "no-thesis" norm is a methodological stance, not a silence. The challenger *does* assert the validity of the consequence, which is a thesis about logical relation, if not about ontology. This nuance keeps the "Loaded Reading" alive without violating the "No-Own-Thesis" vow.
