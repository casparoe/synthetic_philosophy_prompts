answer: |-
  Brainstorming: Brandt's strongest moves are: (1) Maintenance implies selection—even if a trait starts as a byproduct, if it costs energy, selection must justify keeping it; (2) Optimality models are null hypotheses—we assume adaptation to test if data deviates; (3) Historical alternatives are unknowable—we can't model phenotypes that never existed. Objections: (1) If development prevents the alternative, selection isn't choosing; (2) If currencies are tweaked post-hoc, the null is unfalsifiable; (3) Developmental biology reveals accessible spaces. Adeyemi's strongest moves are: (1) Construction limits optimization—you can't select what you can't build; (2) Function is not cause—current utility doesn't explain origin (the spandrel point); (3) Reachability is empirical—developmental pathways define possible phenotypes. Objections: (1) Construction itself evolves; (2) Without function, persistence is unexplained; (3) Demanding reachability data stalls research.

  ***

  **Dr. Ilse Brandt:** The Reachability Clause is bureaucratic paralysis. You're asking us to model ghosts. In my lab, we treat an optimality model as a reverse-engineering blueprint. We assume the organism is designed to maximize a currency—in the glass-stitch worms, particle capture per unit of carbonate—and we measure the trade-offs. If the data fits the model, we have a working hypothesis. The Clause demands we list alternative phenotypes the lineage could have produced. But how do I model a tube secretion mode that doesn't exist?

  **Dr. Kwame Adeyemi:** You don't model the ghost; you map the cage. Your reverse engineering assumes the organism could have been engineered differently. But look at your worms. Forty species, all with the helical ridge. You say it boosts capture by twelve percent. But it costs nine percent of their carbonate budget. In still water, where the vortex does nothing, they still build it. That isn't optimization; that's inevitability. Their tubes are secreted in discrete increments around a fixed body. Geometry dictates a stepped interior. A smooth tube would require a second secretion mode the clade lacks. They aren't choosing the ridge; they're trapped by their own construction.

  **Brandt:** I grant you the origin. It's plausible the ridge started as a geometric byproduct of how they lay down carbonate. Gould made much of that distinction between causes of historical origin and current utilities. But here is the pivot: even if it started as a constraint, it persists in flowing water where it costs energy. If it were truly neutral or detrimental, selection should prune it. The fact that it remains suggests selection is maintaining it against the cost. Your structuralism explains the birth of the trait, but only adaptationism explains its survival.

  **Adeyemi:** That pivot assumes selection has something to grab onto. If the developmental system cannot produce a smooth tube, selection cannot choose it. You're treating the organism as a bundle of independent traits that selection can tweak at will. But organisms are integrated systems. The ridge isn't a separate part; it's a consequence of the tube's geometry. To say selection "maintains" it is like saying selection maintains the triangular shape of a slice of pizza. It's not a choice; it's a consequence of how you cut the circle. Your model treats the constraint as a parameter; I'm saying the constraint is the explanation.

  **Brandt:** But without the model, you have no null hypothesis. This was the standard reply to Gould and Lewontin. If we don't start by assuming adaptation, how do we test for it? The charge that the programme is Panglossian—that it assumes everything is for the best like in Voltaire's satire—only hits after-the-fact story-telling. We aren't telling stories. We are building models with an explicit currency and a measured trade-off. If the worms didn't build the ridge in flow tanks, my model would fail. The model is falsifiable. The Reachability Clause asks for evidence we often can't gather before we know what question to ask.

  **Adeyemi:** I grant you that function exists. Your flow tanks show the ridge creates a recirculating vortex. You even glued artificial beads into a smoothed tube and restored eleven percent of the capture rate. So the ridge *works*. But function is not cause. Just because a spandrel—the architectural space between arches—can hold a mosaic doesn't mean it was built to hold a mosaic. Gould used St. Mark's Basilica for this. Critics said pendentives were chosen over squinches or corbels for aesthetic effect, implying alternatives were available. But if the architecture of the dome made squinches impossible, the aesthetic choice is irrelevant. In your worms, the smooth tube is the squinch. It wasn't an option.

  **Brandt:** Here is where I must dig in. You say the smooth tube wasn't an option. I say we can't know that. Historical alternatives are inaccessible. We only see the lineage that survived. To demand we state why the lineage didn't produce a smooth tube is to demand a history of failures we can't observe. So I pivot: the optimality model serves as the test *because* we can't know the alternatives. We assume the trait is optimal until the data proves otherwise. If we wait for developmental proof of reachability, we never test the function. The Clause swaps a testable model for an untestable history.

  **Adeyemi:** And there is the disagreement. You think the model is the test. I think the model is the story. Development tells us reachability. We know the smooth tube was inaccessible because we know the secretion mechanism. It's not untestable history; it's empirical biology. You split causal history in two: selection explains persistence, construction explains form. I say that is one causal history wrongly split. If construction dictates the form, selection didn't persist it; selection merely tolerated it. The Reachability Clause isn't about history; it's about honesty. If you claim adaptation, you must claim there was a choice.

  **Brandt:** But science rewards explanation, not humility. If I say "the ridge is there because geometry makes it inevitable," I stop looking. If I say "the ridge is there because it optimizes flow," I look for where it fails. I look at the still-water species. I see the cost. I ask why it hasn't been lost. That inquiry yields data. Your inquiry yields a shrug. The field rewards the question that generates experiments, not the constraint that ends them.

  **Adeyemi:** The field rewards the story that sounds like design. That's why we're here. The Lofoten Foundation knows that adaptationism produces papers, but it also produces errors. You say the model is a null hypothesis. I say it's an assumption dressed as a method. If you can't state the alternative, you can't claim the trait was selected *for* anything. You can only say it wasn't selected *against*. There is a difference between surviving a filter and being chosen for a prize. The Clause forces you to prove there was a prize.

  **Brandt:** And I tell you the prize is the only thing we can measure. We can measure capture rates. We can measure carbonate costs. We cannot measure the ghost of a smooth tube. You want me to sign a grant saying I know what evolution couldn't do. I can only sign a grant saying I know what evolution did. If the Ridge costs nine percent and gives twelve, the math says keep it. Whether geometry forced the hand or selection guided it, the outcome is the same. The organism pays the cost.

  **Adeyemi:** The outcome is not the same. If geometry forced it, the trait is a passenger. If selection guided it, the trait is a driver. Passengers don't steer the ship. If we want to understand evolution, we need to know who is driving. Your models assume the driver is selection. My work shows the driver is often the engine itself. The Reachability Clause isn't paralysis. It's a seatbelt.

  **Brandt:** Then we won't agree on the policy. I will write my grant. I will model the vortex. I will measure the trade-off. And I will leave the reachability column blank, because I refuse to speculate on ghosts.

  **Adeyemi:** And I will review that grant. And I will recommend rejection, because without reachability, you haven't proposed a test. You've proposed a confirmation.

  **Brandt:** Then the workshop ends here.

  **Adeyemi:** No. The workshop ends when the Foundation decides whether science is about what works, or what was possible.

  ***

  **Afterword**

  The exchange establishes that the disagreement is not merely about evidence, but about the status of the optimality model itself. Brandt treats the model as a methodological necessity—a null hypothesis that drives inquiry. Adeyemi treats it as an untested assumption that ignores developmental reality. The Reachability Clause forces this methodological conflict into the open: is adaptationism a testable framework, or a default narrative that requires constraint data to become scientific? The stalemate suggests the field has not resolved the Spandrels critique but has institutionalized the tension.

  \answer{NULL-MODEL}
