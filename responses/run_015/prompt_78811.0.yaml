answer: |-
  Family, friends, and especially the three women at the center of this circle: my sister, her partner, and this new daughter.

  I was asked to speak today because I teach ethics, and because your parents wanted more than a toast. They wanted honesty. So I will not offer you platitudes. We know how you came to be here. We know that before you were a heartbeat, you were a set of probabilities. We know your parents were given figures—predictions about the health and life you might have—and we know they chose the highest number.

  Some in this garden have worried that this choice was hubris. That it was "playing God." Others see it as simple science, no different than choosing a stroller that offers more safety. Both views miss the point. The worry about hubris assumes we can control the outcome. The confidence of science assumes we can measure it. Both are wrong.

  The clinic's figure was a guess. It was a calculation based on averages, on populations, on lives already lived. It cannot account for *your* life. It cannot measure your capacity for joy, your resilience in sorrow, or the specific way you will change us. To treat that number as a definition of your worth would be a mistake. To treat it as a moral requirement for your existence would be a tragedy.

  There is a philosophical idea that parents ought to choose the child expected to have the "best" life. If that were the whole truth, then my welcome today would be compromised. If you were only welcome because you scored highest, then my love would be conditional on that score holding true. And that is a burden no infant should carry. It would also cast a shadow on those living with the conditions that were screened against, implying their lives were less worthy of being begun.

  But here is the correction we must make together, today: That principle applies to a choice made in the dark. It does not apply to the light we stand in now.

  The moral obligation to optimize ends the moment you become a person. You are not a project to be perfected. You are a relative to be known. The choice that brought you here was about *opportunity*, not *merit*. Your parents chose the path they hoped would offer you the least resistance, not because you earned it, but because that is what love does when it can.

  So, to the grandmother who worried: We are not dictating your destiny. We are only clearing the path.
  To the scientists in the room: We acknowledge the data, but we reject the determinism.
  And to you, little one: You were chosen, yes. But you are not kept here because of a score. You are kept here because you are ours.

  The number is obsolete. The prediction is expired. All that remains is the reality of you. We cannot promise you the "best" life, because we do not know what that is. We can only promise you *our* best. We promise to love you if you are strong, and if you are frail. We promise to value you if you fit the prediction, and if you defy it. We are not here to witness the fulfillment of a clinic's expectation. We are here to witness the beginning of a story that belongs only to you.

  Verdict: I commit to loving you for who you become, not for the odds you beat.
