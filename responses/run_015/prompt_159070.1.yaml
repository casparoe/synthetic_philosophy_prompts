answer: |-
  Here is a specification of desiderata for a desk policy governing the weighting of inside-view and outside-view evidence. I have refined your list, formalized the cheating conditions, and marked the tensions.

  ### The Desiderata List

  **1. Reference-Class Pre-commitment (Non-Negotiable)**
  *   **Consideration:** Reference-class shopping. A reporter can justify almost any base rate by narrowing or widening the class post-hoc (e.g., "all psychology studies" vs. "primate cognition studies with N>50").
  *   **Requirement:** The rule must require the reference class to be specifiable *before* the base rate is inspected, or rely on a fixed hierarchy of classes (e.g., field-level > subfield-level > method-level) that is applied consistently.
  *   **Cheating:** Selecting the class that yields the base rate closest to the reporter's prior intuition about the specific study, or changing the class definition after seeing the replication rate.

  **2. Selection-Shadow Correction (Non-Negotiable)**
  *   **Consideration:** The selection shadow. The published literature from which base rates are drawn was assembled by actors *not* using this rule. It is contaminated by publication bias, p-hacking, and the very enthusiasm the rule is meant to discount. A raw replication rate of 40% in the literature might imply a true rate of 10% for a new, unvetted submission.
  *   **Requirement:** The rule must include a discount factor or adjustment for the bias inherent in the source of the base rate. It cannot treat the historical record as an unbiased sample of truth.
  *   **Cheating:** Using a published replication rate (e.g., "50% of social psych replicates") as a direct probability for the new study without adjusting for the fact that the new study is in the *pre-publication* phase while the base rate comes from the *post-publication* phase.

  **3. The Novelty Exception (Non-Negotiable)**
  *   **Consideration:** The unprecedented case. Some results claim to overturn a paradigm or describe a phenomenon with no prior distribution (e.g., the first observation of a new particle, or a primate capability previously thought linguistically impossible). Here, the outside view has no reference class.
  *   **Requirement:** The rule must explicitly switch to an inside-view-dominant mode when no valid reference class exists, without defaulting to the reporter's enthusiasm. It must specify *what* inside-view evidence substitutes for the missing base rate (e.g., independent verification, pre-registration strength).
  *   **Cheating:** Declaring a case "unprecedented" to escape a low base rate, then filling the epistemic void with the reporter's existing desire to run the story.

  **4. Mechanism-as-Modifier (Non-Negotiable)**
  *   **Consideration:** Inside-view as heterogeneity evidence. If the specific study has methodological features that distinguish it from the reference class (e.g., larger N, pre-registered, better controls), discounting it by the class average ignores the very reason it might be an outlier.
  *   **Requirement:** The rule must allow inside-view evidence to function as a modifier to the outside-view base rate, not just as a competing probability. It must specify how much methodological superiority is required to overcome a low base rate.
  *   **Cheating:** Accepting "better methodology" as a qualitative assertion without a quantitative or structured threshold for how much it shifts the probability.

  **5. Actionable Output Mapping (Non-Negotiable)**
  *   **Consideration:** Credence vs. Decision. A rule that outputs "be 60% confident" is useless to an editor who needs to know "Front page with caveats" vs. "Briefs." The writer's cost of a false alarm (embarrassment) differs from the reader's cost (misinformation).
  *   **Requirement:** The rule must map the epistemic output directly to an editorial posture (Placement, Headline strength, Hedge density). It must acknowledge that the threshold for publishing a falsehood is higher than the threshold for believing it.
  *   **Cheating:** Stopping at a subjective probability estimate without defining what editorial actions correspond to different probability bands.

  **6. Reception Robustness (Camp Preference: The Editor)**
  *   **Consideration:** Reception sensitivity. Hedged prose is systematically read back as assertion. A norm calibrated in the writer's head (e.g., "I wrote three paragraphs of caveats") may be mis-calibrated once published (e.g., "The headline said Monkeys Talk").
  *   **Requirement:** The rule must evaluate the *likely reader takeaway*, not just the *textual accuracy*. If the result is likely to be misunderstood regardless of hedging, the rule should weigh against publication more heavily than epistemic uncertainty alone would dictate.
  *   **Cheating:** Assuming that adding the words "preliminary" or "suggests" neutralizes a definitive headline or graphic.
  *   **Status:** *Camp Preference.* Reporters often view this as censorship; Editors view it as responsibility.

  **7. Computational Tractability (Non-Negotiable)**
  *   **Consideration:** Deadline pressure. The decision must be made within a day, without a statistician.
  *   **Requirement:** The rule must be executable using information readily available to a generalist science journalist (abstract, press release, quick expert call) without requiring new meta-analyses or complex Bayesian updates.
  *   **Cheating:** Requiring data (e.g., exact p-curve analysis of the field) that cannot be gathered in the news cycle.

  **8. Auditability (Non-Negotiable)**
  *   **Consideration:** Editor defense. An editor who did not do the reporting must be able to verify that the rule was followed.
  *   **Requirement:** The application of the rule must leave a trace (a checklist, a stated reference class, a recorded adjustment) that an editor can review without redoing the inside-view reporting.
  *   **Cheating:** Relying on the reporter's internal sense of "plausibility" or "weight" that cannot be externally inspected.

  **9. Retained Discrimination (Non-Negotiable)**
  *   **Consideration:** The silence problem. A rule that licenses nothing is not modest, it is just silent. Science news requires some false positives to catch true breakthroughs.
  *   **Requirement:** The rule must permit the publication of some low-base-rate findings given sufficient inside-view strength. It cannot be a veto on surprise.
  *   **Cheating:** Setting the thresholds so high that only consensus science is published, effectively turning the column into a textbook.

  ---

  ### Tensions and Incompatibilities

  There is a severe tension, likely an incompatibility, between **Requirement 2 (Selection-Shadow Correction)** and **Requirement 7 (Computational Tractability)**.

  *   **The Conflict:** To properly correct for the selection shadow, one needs to know the degree of publication bias in the specific field (the size of the "file drawer"). This data is rarely available on a one-day deadline without statistical expertise.
  *   **The Consequence:** You must either accept a crude heuristic for the shadow (e.g., "halve the published replication rate") which risks being arbitrary (violating the spirit of NN requirements), or admit that a truly defensible outside view is impossible under newsroom constraints.
  *   **Secondary Tension:** **Requirement 6 (Reception Robustness)** vs. **Requirement 9 (Retained Discrimination)**. If you discount stories that are likely to be misunderstood, you will systematically filter out complex, surprising, or counter-intuitive science—which is often the most newsworthy science.

  **Verdict on Satisfiability:** The list is **internally unsatisfiable** in its strictest form. You cannot have a Selection-Shadow Correction that is epistemically robust *and* Computationally Tractable *and* Auditable without new infrastructure (e.g., a desk statistician or a pre-computed database of field bias). A workable policy must degrade one of these. I recommend degrading **Selection-Shadow Correction** to a fixed heuristic (e.g., "assume published base rates are optimistic by factor X") to save Tractability and Auditability.

  ---

  ### The Exclusionary Requirement

  The single requirement that does the most work in excluding the candidate heuristics people actually reach for is **Requirement 8: Auditability**.

  Most epistemic heuristics are internal cognitive processes. A reporter can "anchor and adjust" in their head. They can "pool precision" mentally. But an editor cannot audit a mental process. To satisfy Auditability, the heuristic must produce *artifacts* (written reference classes, explicit adjustment factors). This excludes any heuristic that relies on the reporter's intuition as the final weighting mechanism.

  ---

  ### Scorecard of Candidate Heuristics

  Here is how the four common approaches score against the desiderata. I have counted a requirement as **Unsatisfied (U)** only if the failure is structural and judgeable without new data.

  | Requirement | Anchoring & Adjusting | Reference-Class Forecasting | Inside-View Gated | Precision-Weighted Pooling |
  | :--- | :---: | :---: | :---: | :---: |
  | **1. Ref-Class Pre-commit** | U (Anchors are often intuitive/post-hoc) | **Pass** (Core feature) | **Pass** (Class is irrelevant) | U (Classes are inputs to weights) |
  | **2. Selection-Shadow** | U (Anchors on the biased lit) | U (Uses raw base rates) | **Pass** (Ignores base rates) | U (Treats base rates as data) |
  | **3. Novelty Exception** | **Pass** (Adjustment can be 100%) | U (Breaks when no class exists) | **Pass** (Relies on mechanism) | U (Requires priors) |
  | **4. Mechanism-as-Modifier** | U (Adjustments are usually vague) | U (Treats case as class member) | **Pass** (Core feature) | **Pass** (Weights by quality) |
  | **5. Actionable Output** | U (Outputs a feeling/number) | U (Outputs a number) | U (Outputs a binary go/no-go) | U (Outputs a number) |
  | **6. Reception Robustness** | U (Epistemic, not communicative) | U (Epistemic, not communicative) | U (Epistemic, not communicative) | U (Epistemic, not communicative) |
  | **7. Tractability** | **Pass** (Fast) | **Pass** (Fast if class known) | **Pass** (Fast) | **U** (Too math-heavy for deadline) |
  | **8. Auditability** | **U** (Internal mental math) | **Pass** (If class is written down) | **U** (Plausibility is subjective) | **U** (Weights are opaque) |
  | **9. Discrimination** | **Pass** | **Pass** | **Pass** | **Pass** |

  **Summary of Failures:**
  *   **Anchoring & Adjusting:** Fails on Auditability and Selection Shadow. It is a cognitive bias correction, not a desk policy.
  *   **Reference-Class Forecasting:** Fails on Novelty Exception and Selection Shadow. It breaks when the science is actually new, and it trusts the historical record too much.
  *   **Inside-View Gated:** Fails on Auditability. "Mechanistic plausibility" is exactly what the editor is asking the reporter to justify; using it as the rule begs the question.
  *   **Precision-Weighted Pooling:** Fails on Tractability and Auditability. It is the epistemically correct method but operationally impossible for a daily desk.

  **Recommendation:** None of the four satisfy the list. A workable policy would likely need to be a hybrid: **Reference-Class Forecasting** (for Auditability) + **Fixed Shadow Discount** (to satisfy Selection Shadow tractably) + **Explicit Output Mapping** (to satisfy Actionable Output).
