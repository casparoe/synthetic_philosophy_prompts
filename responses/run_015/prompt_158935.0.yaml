answer: |-
  The bridge and conversion strategies offer divergent paths from the intuition that one must save a drowning child to the conclusion that one must aid distant strangers. The bridge strategy argues by parity: since distance and numbers are morally irrelevant, the duty to aid is grounded purely in the capacity to prevent harm at modest cost. The conversion strategy argues by reclassification: the duty is not rescue but rectification for participation in harmful institutional structures. Evaluating these approaches requires examining their stopping points, the direction of the duty, epistemic burdens, and their performance against three specific test cases.

  Regarding demandingness and stopping points, the bridge strategy is rigorously demanding. It requires agents to transfer resources until the cost to them matches the moral significance of the harm prevented. This offers a clear, albeit high, bar: one stops only when giving more would create a comparable emergency for oneself. The conversion strategy limits demandingness by tying it to complicity. One must stop contributing to harm and repair the damage caused. Theoretically, this is less demanding, as one might exit the harmful arrangement without sacrificing everything. However, if the arrangement is global and pervasive, the repair duty could be equally demanding. The plausibility differs: bridge aligns with the urgency of the pond, while conversion aligns with intuitions about fairness and fault.

  The direction and content of the duty also diverge. For the bridge strategy, the duty is owed to any identifiable victim one can reach, discharged simply by effective transfer. For the conversion strategy, the duty is owed specifically to victims of the structures one supports, discharged by exiting those structures or compensating those specific victims. This creates a significant epistemic burden for conversion. An agent must know not only that someone is suffering, but that their suffering is causally linked to the agent's specific institutional participation. The bridge strategy requires only knowledge of suffering and capacity to help. When causal chains are opaque, conversion risks paralysis, whereas bridge mandates action based on probability and capacity.

  The three test cases reveal critical weaknesses in the conversion strategy. In Case One (Unattributable Peril), the agent caused one drowning but cannot identify which child. The bridge strategy dictates saving any child; the moral imperative is to prevent death, and since one death is attributable to the agent, preventing any death satisfies the urgency. The conversion strategy struggles. If the duty is to repair specific harm caused, the agent cannot identify the specific victim owed repair. To remain action-guiding, conversion must borrow bridge-style reasoning: save any child because you are implicated in *a* death. This borrowing undermines its claim to be distinct, as it abandons the specific victim requirement when epistemic limits bite.

  Case Two (Clean Hands) is decisive. Aida has no causal footprint on harmful institutions but can save a life cheaply. The bridge strategy straightforwardly requires her to act; her capacity and the stakes ground the duty. The conversion strategy implies she has no duty, as she participates in no harm. This contradicts the shared starting intuition that passing a drowning child requires rescue regardless of how one arrived at the pond. If conversion denies Aida's duty, it fails to capture the core moral insight of the pond example. It makes the duty to save lives contingent on historical guilt rather than present capacity.

  Case Three (Overdetermined Pond) challenges both, but bridge fares better. Here, individual contributions make no difference to the outcome. The bridge strategy focuses on the alternative action: wading in saves the child at trivial cost. The duty remains because the agent *can* prevent the bad outcome. The conversion strategy faces a dilemma. If the duty is to repair harm caused, and no individual drop caused the death, the duty vanishes. If the duty is based on collective harm, conversion must argue that each agent owes a share of the repair. But this again looks like bridge reasoning: you must help because the child is drowning and you are present, not because your drop mattered. Conversion loses its distinctive stopping point (cessation of personal harm) because the personal harm was negligible.

  The bridge strategy also accommodates the intuitions favoring conversion without collapsing into it. In Case One, the intuition that the faulty agent is especially bound is compatible with bridge; the agent has a duty like everyone else, plus a retrospective reason to prioritize the harm they caused. In Case Three, the intuition that droppers are bound differently than passersby is handled by noting droppers have both a duty to rescue (bridge) and a duty to stop dropping (conversion). Bridge provides the floor; conversion adds ceiling obligations for participants.

  Ultimately, the bridge strategy is stronger. It survives the Clean Hands case, which is fatal to conversion. A moral theory that exempts those with clean hands from saving lives at trivial cost fails the basic test of the pond intuition. Conversion offers a compelling account of structural injustice, but it cannot ground the universal duty to aid that the pond example suggests. It functions better as a supplementary account of political obligation rather than the ground of basic rescue duties.

  The strongest objection to the bridge strategy is that it ignores special obligations and fairness, demanding too much from individuals who are not at fault. It treats agents as mere vessels for utility. However, this objection misunderstands the stakes. The pond intuition already accepts that a passerby must ruin their shoes to save a life; the question is whether distance changes this. Since distance does not change the value of the life or the capacity to save it, the demand remains. Fairness concerns regarding who else is helping are secondary to the immediate prevention of death. The bridge strategy prioritizes the victim's need over the agent's desire for a fair distribution of labor, which is correct when life is at stake.

  Case Two carries the most weight. If a theory cannot explain why a person with clean hands must save a drowning child when able, it has severed the link between capacity and duty that makes the pond example compelling. Conversion fails this test; bridge passes.

  Verdict: \answer{bridge}
