answer: |-
  This is a superbly framed problem. You have stumbled upon the central debate in the philosophy of medicine: the **demarcation problem**. Your intuitions are sharp, and your friend's principle is a recognizable hybrid of two major theories (Boorse's Biostatistical Theory and Wakefield's Harmful Dysfunction Analysis).

  Here is an analysis of your friend's principle, a proposed repair, and a resolution to your suspicion that you were arguing past each other.

  ### Part 1: Autopsy of Your Friend's Principle

  Your friend's principle is:
  *(a) Reduction in species-typical function (selected for)*
  *(b) Bearer is worse off in actual environment*
  *(c) Not merely social reaction*

  You suspected clause (a) was doing no work. **It is.** Here is the proof:
  Consider the **broken leg**.
  *   (b) Is the skier worse off? Yes.
  *   (c) Is it merely social reaction? No.
  *   If (a) were absent, the broken leg would be a disease.
  *   Therefore, (a) is required to distinguish *disease* (internal dysfunction) from *injury* (external trauma).

  **Where the principle fails your verdicts:**
  1.  **Osteoporosis (82yo):** Clause (a) refers to "functions members of the species normally perform." If bone density loss is statistically normal for 82-year-olds, a strict reading of (a) implies it is *not* a dysfunction, just aging. Your intuition (that it is a disease) requires us to say bones are *designed* to support weight, regardless of how often they fail in old age.
  2.  **The Fertility Gene:** Clause (a) flags this immediately (reproduction is the primary function selected for). Clause (b) is the battleground. Evolutionarily, the bearer is "worse off" (fitness reduced). Individually, they are "perfectly healthy." Your friend counts this as disease; you do not. The principle cannot resolve this without defining "worse off."
  3.  **Pure Risk Factors:** A high blood marker raises probability but causes no current harm. Clause (b) ("worse off") is ambiguous. Are you worse off because of the *risk*, or only when the *event* occurs?

  ### Part 2: The Best Candidate (The Refined Harmful Dysfunction Analysis)

  The most robust framework that accommodates most of your intuitions is a refined version of Christopher Wakefield's **Harmful Dysfunction Analysis (HDA)**, modified to handle environment and aging.

  **The Principle:**
  *A condition is a disease if and only if:*
  1.  **Dysfunction:** An internal mechanism fails to perform a function for which it was biologically designed (by natural selection or developmental design), *and*
  2.  **Harm:** This failure results in a net negative impact on the individual's welfare (health, well-being, or survival) in their current environment.

  **Motivation for Clauses:**
  *   **Clause 1 (Objectivity):** Prevents "disease" from becoming purely political. It anchors the concept in biology. It excludes the broken leg (trauma, not internal mechanism failure) and the asymptomatic variant (mechanism works fine).
  *   **Clause 2 (Normativity):** Prevents "disease" from applying to harmless abnormalities. It excludes the fertility gene (if welfare is defined as individual well-being, not genetic propagation) and the asymptomatic lung capacity (no impact on welfare in current environment).

  **Verdicts on Your "Uncertain" Cases:**

  1.  **The Sedentary Lung Capacity:**
      *   *Verdict:* **Not a disease.**
      *   *Reasoning:* While there may be a statistical deviation (Clause 1 is debatable), Clause 2 fails. There is no harm in the actual environment. It is a *vulnerability*, not a disease. Calling it a disease is indeed "idle counterfactualising."
  2.  **The Enzyme + Staple Food:**
      *   *Verdict:* **Disease (in that environment).**
      *   *Reasoning:* Clause 1 is met (enzyme dysfunction). Clause 2 is met *contingently*. Disease is a relation between organism and environment. PKU (phenylketonuria) is the real-world example: harmless without phenylalanine, devastating with it. If the food is a staple, the harm is real.
  3.  **Pure Risk Factor (Top Decile Marker):**
      *   *Verdict:* **Not a disease (yet).**
      *   *Reasoning:* It is a *risk state*. Clause 2 requires harm. Increased probability of future harm is not current harm. Treating it is preventative medicine, not curative medicine. This validates your intuition about the blood pressure guidelines: lowering the threshold creates more *patients*, not more *diseased people*.

  **The Cost (Which verdicts must you surrender?):**
  To accept this principle, you must refine two of your own positions:
  1.  **The Fertility Gene:** You must accept that "Harm" in medicine is usually defined as *health/well-being*, not *evolutionary fitness*. If you define harm as "anything that reduces gene propagation," it is a disease. If you define it as "suffering or reduced longevity," it is not. You must commit to the latter to keep your verdict.
  2.  **Osteoporosis:** You must accept that "biological design" trumps "statistical normality." Just because everyone's bones crumble at 80 doesn't mean bones are *designed* to crumble. They are designed to support; failing to do so is a dysfunction, even if universal.

  ### Part 3: The Context Question (Clinic vs. Benefits vs. Lab)

  You asked: *Does the principle have to be the same in the clinic, at the disability-benefits office, and in a research lab?*

  **My view: No.** Your argument felt intractable because you were quietly asking three different questions. The word "disease" is doing three different jobs.

  1.  **The Ontological Question (Research Lab/Pathology)**
      *   *Goal:* Describe the state of the organism.
      *   *Definition:* Strict **Harmful Dysfunction**.
      *   *Implication:* The asymptomatic anatomical variant is **not a disease**. The pure risk factor is **not a disease**. The fertility gene is **not a disease** (no health harm).
      *   *Why:* Science needs clean categories. If we label harmless variants as diseases, our data on pathology becomes noisy.

  2.  **The Clinical Question (The GP's Office)**
      *   *Goal:* Decide whether to intervene.
      *   *Definition:* **Actionable Risk.**
      *   *Implication:* The high blood pressure marker **is a "clinical condition"** warranting treatment. The lung capacity **is not**. The osteoporosis **is**.
      *   *Why:* Clinicians deal in probabilities. If a risk factor is high enough that intervention prevents future harm, it is treated *as if* it were a disease. This explains why the guidelines committee can lower the threshold: they aren't changing the *ontology*, they are changing the *intervention line*.

  3.  **The Sociopolitical Question (Insurance/Disability)**
      *   *Goal:* Allocate resources and protection.
      *   *Definition:* **Disabling Deviation.**
      *   *Implication:* The asymptomatic variant **is not a disease** for insurance purposes (no payout). Male pattern baldness **is not a disease** (no payout), but might be covered for cosmetic reasons (different budget). The broken leg **is a compensable event**.
      *   *Why:* Insurance protects against *loss*, not *difference*. The mutual friend was right to be denied income protection; there was no loss of function or income capacity.

  **Resolution of Your Specific Conflict:**
  The argument with your GP friend likely stalled because she was operating in the **Clinical** frame (where risk factors are managed conditions) and you were operating in the **Ontological** frame (where a disease requires actual dysfunction and harm).

  *   **The Blood Pressure Case:** You are ontologically right (they didn't acquire a disease). She is clinically right (they now require management). Both are valid within their contexts.
  *   **The Asymptomatic Variant:** You are ontologically right (not a disease). The insurer is sociopolitically right (no coverage).
  *   **The Fertility Gene:** You are ontologically right (not a health disease). An evolutionary biologist might disagree (it is a fitness disease).

  ### Summary Advice for the Next Argument

  Tell your friend this:
  *"We are conflating **Pathology** (what is broken), **Prognosis** (what will hurt you), and **Policy** (what we pay for)."*

  1.  **Pathology:** Requires internal dysfunction + actual harm. (Excludes the variant, the risk factor, the fertility gene).
  2.  **Prognosis:** Requires significant risk of future harm. (Includes the BP marker, excludes the lung capacity).
  3.  **Policy:** Requires impact on social/economic function. (Excludes the variant, includes the broken leg).

  If you adopt this tripartite distinction, you can keep all your intuitions intact without contradiction. The asymptomatic variant is not a *pathology*, poses no *prognostic risk*, and warrants no *policy compensation*. The bodybuilder has a *pathology* (hormonal dysfunction), regardless of fault. The 82-year-old has a *pathology* (bone dysfunction), regardless of statistical normality.

  Your friend's clause (a) was trying to capture Pathology. Clause (b) was trying to capture Prognosis. Clause (c) was trying to capture Policy. By separating them, you dissolve the paradox.
