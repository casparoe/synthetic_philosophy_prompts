answer: |-
  Here is the build plan. It is designed to be written on the whiteboard as you go. Do not pre-write the board; build it with them.

  ### 1. The Order of Operations
  **Sequence:** Information Failure $\rightarrow$ Function (as Filter) $\rightarrow$ Normativity (as Payoff).

  **Why this order:**
  1.  **Information Failure:** You must break the "correlation = content" intuition first. If they think correlation is sufficient, Function looks like an unnecessary complication.
  2.  **Function:** Once correlation is broken, they need a mechanism to select *which* correlation counts. Function is that mechanism.
  3.  **Normativity:** This is the *consequence* of Function, not the premise. If you lead with Normativity ("states can be wrong"), engineers will say "Loss > 0." You need them to see that Loss > 0 is just a penalty, whereas Teleosemantic Error is a *mismatch between current trigger and historical function.*

  **What breaks if you swap them:**
  *   **Normativity before Function:** They will treat "error" as "optimization failure." You won't be able to distinguish a model that is *wrong* from a model that is *penalized*. You need Function to define the standard against which "wrong" is measured.
  *   **Function before Information Failure:** They will assume Function is just "what the system does." You need the Information Failure to show why "what the system does" (current causal role) is insufficient.

  ---

  ### 2. The Carrying Example
  **Winner:** **The Moth.**
  **Keeper:** The Robot (use only in the final 15 minutes).

  **Why the Moth:**
  The Robot case is contaminated by *Derived Intentionality*. Engineers will immediately default to "The content is what the engineer intended." Teleosemantics is an attempt to naturalize content *without* appealing to a designer's mind. If you use the robot, you spend 40 minutes fighting "But the engineer meant X." The Moth forces them to accept **Selection History without a Selector.**

  **What the Moth case must have:**
  *   **Mechanism:** A fixed-angle navigation circuit.
  *   **History:** Selected over 200 generations for locking onto *distant, stable* light (Moon/Stars).
  *   **Current Trigger:** A *near, unstable* light (Lighthouse).
  *   **Outcome:** Death (Fitness cost).

  **What the Moth case must lack:**
  *   **Any benefit from the new trigger.** The lighthouse must not help them navigate. If the lighthouse helped them survive, selection would shift, and the content would change. The mismatch must be pure error.
  *   **A Designer.** Emphasize: "No one told the moth what the moon was. The environment selected the circuit."

  **Instruction:** Draw the timeline on the board.
  `[Past: Moon + Circuit + Survival] ---> [Selection Event] ---> [Present: Lighthouse + Circuit + Death]`
  Ask: "When the moth dives at the lighthouse, what does its brain *say* is there?"
  *   If they say "Light," information theory wins (too cheap).
  *   If they say "Navigational Beacon," teleosemantics wins (specific function).
  *   If they say "Nothing, it's broken," they miss the representational aspect.

  ---

  ### 3. Misconception Management
  **Order of Appearance & Handling:**

  1.  **"Content is just the Loss Function."** (Minute 5)
      *   *Handling:* **Head off immediately.** Draw a scalar $L$ vs. a structured state $S$. Loss evaluates the state; it is not the content of the state.
  2.  **"Okay, so it's whatever currently causes the firing."** (Minute 20, after Info Failure)
      *   *Handling:* **Let them build it, then collapse it.** Use the Moth. The current cause is the Lighthouse. If content = current cause, the moth isn't *wrong*, it's just navigating lighthouses. But it dies. The mismatch proves content $\neq$ current cause.
  3.  **"Isn't that backwards causation?"** (Minute 40, when introducing History)
      *   *Handling:* **Draw the Causal Chain.** The past selection event caused the *current circuit structure*. The current structure determines the content. The past doesn't reach forward; the *trace* of the past (the weights/genes) is here now.
  4.  **"Swampman / No History."** (Minute 50)
      *   *Handling:* **Let this sit.** If a model pops into existence with weights but no training run, Teleosemantics says it has *no content*, only causal dispositions. This is a bullet teleosemanticists bite. Tell them: "On this view, a randomly initialized net that works perfectly has no representations, only causes." Let that discomfort land.
  5.  **"Purposes aren't physical / Spooky."** (Minute 60)
      *   *Handling:* **Deflate.** "Purpose" is shorthand for "Dispositional state maintained by past selection." It is as physical as a scar.

  ---

  ### 4. Content Laundering
  **Verdict:** **Use it.** But **only in the final activity.**

  **Why:** It is the perfect stress test for "History vs. Current Role." If you introduce it earlier, it muddies the baseline definition. If you introduce it at the end, it tests if they actually internalized the "History" constraint.

  **Placement:** The last 15 minutes.
  **Framing:** "You have a model trained on Task A. You fine-tune on Task B. The weights are mostly the same. A specific feature fires. Is its content 'Feature of A' or 'Feature of B'?"
  This forces them to decide where the "cut" for selection history is.

  ---

  ### 5. Refusals
  **Openly refuse to explain these three things:**
  1.  **Consciousness/Phenomenology:** "We are not discussing what it *feels like* to be the moth or the model. We are discussing what the state *stands for*."
  2.  **The Mechanism of Selection:** "We are not debating gene vs. meme vs. gradient descent. We are assuming a selection event happened. We are analyzing the *consequence* of that event."
  3.  **Engineer Intent:** "We are treating the Loss Function as an environmental filter, not a mind. We are not analyzing what the researcher *wanted*, only what the training dynamics *selected*."

  ---

  ### 6. The Plan (75 Minutes)

  **00-10: The Setup & The Trap**
  *   **Board:** Write `Correlation` vs. `Content`.
  *   **Talk:** "In ML, we often say a neuron 'detects edges.' Why edges? Why not 'correlated with pixel intensity 42'?"
  *   **Move:** Establish that Information (Correlation) is too cheap. Every state correlates with the Big Bang. We need a filter.
  *   **Refusal:** State the 3 Refusals (Consciousness, Selection Mechanism, Engineer Intent).

  **10-30: The Moth (The Core Argument)**
  *   **Board:** Draw the Moth Timeline (Past Moon $\rightarrow$ Selection $\rightarrow$ Present Lighthouse).
  *   **Talk:** Walk through the Moth case.
  *   **Interaction:** Ask: "The moth dives. Is it representing 'Lighthouse' or 'Moon'?"
  *   **Goal:** Get them to agree that if it represents 'Lighthouse', it can't be *wrong*. If it represents 'Moon', it *is* wrong. We need the possibility of being wrong.
  *   **Key Install:** Content is fixed by what the mechanism was *selected to do*, not what it *currently does*.

  **30-45: Function & Normativity**
  *   **Board:** Write `Function = Selected Effect`. Write `Error = Trigger $\neq$ Function`.
  *   **Talk:** Connect the Moth to the definition. The function is "Navigate by Stable Light." The trigger is "Flickering Light."
  *   **Payoff:** This explains Normativity. A state is not just "low reward." It is *misfiring*. It is doing the wrong job.
  *   **Check:** Address "Backwards Causation" here (The history is encoded in the current structure).

  **45-60: Translation to ML**
  *   **Board:** Map `Moth` $\rightarrow$ `Model`, `Moon` $\rightarrow$ `Training Dist`, `Lighthouse` $\rightarrow$ `OOD Input`.
  *   **Talk:** "Your model was selected (trained) on Distribution A. It is now running on Input B."
  *   **Discussion:** When the model classifies an OOD input, is it "wrong" or just "different"? Teleosemantics says: If the feature was selected for Concept X, and triggers on Y, it is *wrong*.
  *   **Check:** Address "Spooky Purposes" here. Function is just historical causal role.

  **60-75: The Activity (Content Laundering)**
  *   **Board:** Write the Scenario:
      *   *Model:* ResNet-50.
      *   *Phase 1:* Trained on ImageNet (Selection: Objects).
      *   *Phase 2:* Fine-tuned on X-Rays (Selection: Pathologies).
      *   *State:* Neuron 42 fires on both 'Dog Fur' and 'Bone Texture'.
  *   **Task:** Split the room. Left side argues Content = "Object Texture" (Original History). Right side argues Content = "Medical Texture" (Recent History).
  *   **Requirement:** They must use the `Function = Selected Effect` definition to argue. They cannot use "It looks like a bone."
  *   **Close:** Bring them back. The point isn't the answer; the point is that the *question only exists* because you accept History matters. If Content = Current Cause, there is no debate.

  **End:** Stop exactly on time. Do not summarize. Let the debate hang.
