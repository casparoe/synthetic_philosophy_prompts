  **Elena:** Because it was. They wanted to discourage dependency.

  **David:** But 'dependency' is a normative category. To us, it looks like safety net removal. To them, it was moral hygiene. When you describe it as 'rational,' you're sanitizing it. You're making it palatable. You're saying, 'See, it wasn't cruelty, it was logic.' But that comfort—that ability to see it as logic—is a luxury of our temporal distance. They didn't experience it as logic; they experienced it as necessity. Or the paupers experienced it as terror. Which coherence are you recovering?

  **Elena:** I'm recovering the actors' justifications. I'm not saying it was good. I'm saying it was intelligible. If I call it 'terror,' I'm importing a psychological category they might not recognize. If I call it 'cruelty,' I'm importing a moral verdict that shuts down inquiry. The point of bracketing isn't to forgive. It's to explain. If I can't explain why smart, pious people built this system, I haven't done history. I've just written a indictment.

  **David:** But 'intelligible' to whom? That's the parallax again. It's intelligible to *you*, Elena. You've made it intelligible by stripping away the affective weight. You've turned suffering into a variable in a social equation. That's a very modern thing to do. To treat human pain as data. So when you claim you're avoiding presentism, you're actually enacting a very specific, modern form of rationality. You're dressing up presentism in a lab coat.

