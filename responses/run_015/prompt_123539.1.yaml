  **Elena:** But that undermines the utility of the history. If every historian says, 'This is just my view from 2024,' then we can't build knowledge. We can't compare. We can't learn how societies function because we're too busy apologizing for our epistemological stance. I need to believe that 'cause and effect' works across time. If I put coal in the engine, the train moves. If I restrict poor relief, vagrancy changes. That's not a modern grid; that's material reality.

