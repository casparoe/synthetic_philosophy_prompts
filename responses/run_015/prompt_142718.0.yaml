prompt: |-
  Your a professional philosopher of history with a bit of american studies background. Think carefully and start with some brainstorming in your own words — don't jump straight to the doc. I need you to draft the joint statement for an adversarial collaboration between two camps arguing about american exceptionalism (the historical thesis, the normative claim, and the ideology version).

  Camp A are institutional exceptionalists: they think the US is genuinely weird in specific structural ways — like the combo of anti-statist federalism plus high voluntary association, and the lack of a formal aristocratic or clerical estate — but they deny this means America is morally superior or has some world-historical destiny.

  Camp B are comparative-normalists: they say if you compare the US properly to other settler-colonial federations (Canada, Australia, Argentina) and other post-revolutionary republics, those features are quantitative variations, not qualitative exceptions, and the exceptionalist story mainly works as ideology to cover over empire and racial capitalism.

  Write the actual joint document they could both sign. Structure it like this:

  - Numbered agreed-claims section: neutral claims about exceptionalism as thesis, norm, and ideology that both sides accept.
  - Disagreements table: each side's exact wording on (1) whether institutional differences are uniquely qualitative vs extreme but comparable; (2) whether exceptionalism-ideology has real causal power or is just epiphenomenal to material interests; (3) wether rejecting normative exceptionalism actually defuses the ideology's political effects.
  - Cruxes: identify the sub-questions that'd actually move someone. I suspect one is the baseline problem — what's the right comparison set (other settler states? other revolutions? European metropoles?). Another is wether the absence of feudal residues is a cause or just a correlation with US development. For each crux, name one concrete historical comparison or piece of evidence both agree is relevant, and record each side's prediction about what that evidence shows.
  - Verbal disagreement check: flag any spots where they seem to clash but are really just using 'exceptionalism' or 'ideology' differently, and resolve those.

  Don't strawman anyone. Phrase each camp's view so they'd actually sign off on their own wording. Write in American English, keep it in the weeds, and no citations or reading lists please. There's probably a typo in my prompt but thats ok — just answer the substance.
