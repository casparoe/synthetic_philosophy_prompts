answer: |-
  **TO:** Board of Trustees
  **FROM:** [Your Name]
  **DATE:** 10th of the Month
  **SUBJECT:** Decision Memo: Convoy Security and Charter Compliance

  **Context**
  Following the looting of two convoys and the death of a driver, we must finalize security protocols for the upcoming dry-season programme (12 runs over four months). Legal counsel has advised that accepting the armed group's offer exposes the organization to prosecution in two donor countries; we must treat this option as unavailable. We are left to choose between accepting the regional military's armed escort or proceeding without armed protection.

  **Charter Interpretation**
  Our charter states: *"The Organization shall not use force, nor place itself under the protection of those who do."*
  The second clause must be read operationally: Does the arrangement make our safety dependent on a belligerent's use of force?
  Static guards at our capital compound are defensive property security. They do not accompany us into contested spaces nor signal alignment with a party to the conflict during mission execution. Conversely, an armed convoy escort is operational protection. It integrates our humanitarian mission with a combatant's force projection. Accepting the military escort would place us under their protection precisely where our neutrality must be most visible: the valley road. Therefore, the military offer breaches the charter.

  **Addressing the Board's Division**
  Several trustees argue that accepting compound police guards—paid by a government party to the fighting—renders a refusal of convoy escorts hypocritical. This is a valid consistency concern. However, precedents should not be extended when the stakes shift from property security to mission integrity. Expanding armed protection from a fixed compound to mobile convoys merges us with belligerents in the eyes of valley residents.
  To my colleagues holding this view: I invite you to propose a specific threshold where static security becomes operational protection, rather than arguing from consistency alone. If we accept that compound guards are a necessary evil for asset security, we must agree not to compound that ambiguity by expanding it into our operational zones. We should commit to reviewing the compound arrangement separately, rather than using it to justify a charter breach on the road.

  **The Military Offer**
  Beyond the charter, the military's requirement for route notification and patient data by village violates medical confidentiality. Sharing this data could endanger patients if accessed by opposing forces. This condition alone warrants rejection.

  **Recommendation**
  I recommend **proceeding with the twelve convoy runs without armed escort.** We will rely on prior notification to local community leaders and the armed group controlling the road, leveraging our eleven-year history of impartial service. We accept the heightened physical risk to maintain our legal standing and operational independence.

  **Reversal Conditions**
  This recommendation stands unless:
  1.  **Further Casualties:** A second staff member is killed or seriously injured during a convoy run.
  2.  **Community Withdrawal:** Local elders in the valley explicitly withdraw their consent for our unescorted passage.
  3.  **Data Breach:** Evidence emerges that the military has accessed or misused our historical patient data.

  Should any of these occur, we will suspend operations immediately rather than accept armed protection.

  **Conclusion**
  Refusing armed escort is not a choice to expose staff to harm; it is a choice to mitigate legal and ethical risks that threaten the organization's existence. We must not trade our charter for temporary security.
