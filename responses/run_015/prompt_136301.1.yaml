answer: |-
  You have put your finger on a very specific, often unexamined tension in the metaphysics of personal identity. You are correct that there is an asymmetry here: **pre-zygotic genetic difference destroys identity, while post-zygotic genetic difference preserves it.**

  To answer your questions directly: No, there is no single canonical term like "conception-lock bias" in the literature, but the concept is a well-known implication of **Kripkean Origin Essentialism**. However, your intuition that this creates a problematic boundary is shared by several major critics.

  Here is a breakdown of the established terminology, the philosophical justification for the asymmetry, the critiques that align with your suspicion, and a verdict on your proposed label.

  ### 1. Is there an established term?
  The standard label for the broader view is **Origin Essentialism** (specifically *Gametic* or *Zygotic* Essentialism).

  Within that framework, the specific boundary you are identifying is often discussed as **The Necessity of Origins** versus **The Contingency of Constitution**.
  *   **Origin:** The specific causal history (this sperm + this egg). This is treated as essential (necessary).
  *   **Constitution:** The material makeup (the specific DNA sequence). This is treated as accidental (contingent), provided the causal chain remains unbroken.

  There isn't a specific name for the *boundary itself* because Origin Essentialists view the moment of fertilization as a metaphysical "node." Once the node exists, it can undergo changes (mutations) and remain the same object. Before the node exists, different inputs create a different node.

  However, if you are looking for existing terminology to mine, **"Zygotic Fixity"** or **"Gametic Asymmetry"** are descriptive terms that appear in bioethical critiques of this view.

  ### 2. Why do Essentialists accept this asymmetry?
  To an Origin Essentialist (following Saul Kripke's *Naming and Necessity*), this isn't a bug; it's a feature based on **causal history**.

  *   **Scenario A (Different Sperm):** This changes the *cause* of your existence. If a different sperm fertilizes the egg, the causal chain originates from a different historical event. Therefore, it is a different individual.
  *   **Scenario B (Post-Zygotic Mutation):** The causal chain is already established. The zygote exists. A mutation is merely a modification of an *existing* entity, similar to you losing a limb or gaining a scar. The entity persists through the change.

  They argue that identity is anchored to the *start of the causal chain*, not the *material composition* at any given moment.

  ### 3. Has anyone called this out?
  Yes. Your suspicion that this "sneaks in a kind of essentialism about the zygote" is a central argument in the critiques of Origin Essentialism.

  **A. Derek Parfit (Reductionism)**
  Parfit argues that identity isn't what matters. He would say the essentialist is fetishizing a "further fact" that doesn't exist. To Parfit, the difference between "you with sperm #1" and "you with sperm #2" is a difference in degree, not kind. The sharp boundary at conception is metaphysical dogma, not reality.

  **B. Jeff McMahan (Embryological Continuity)**
  McMahan (in *The Ethics of Killing*) offers the strongest biological critique relevant to your point. He notes that the zygote is not a stable "locked blueprint."
  *   **Twinning:** Up to day 14, a zygote can split. If identity is locked at conception, which twin is the "original"?
  *   **Chimerism:** Two zygotes can fuse.
  *   **The "Magic Moment" Critique:** Biologically, fertilization is a process (sperm penetration $\rightarrow$ membrane change $\rightarrow$ nuclear fusion), not an instant. Drawing a hard metaphysical line at the exact millisecond of fusion, while allowing genetic drift immediately after, is biologically arbitrary. McMahan argues this supports a **Developmental View** of identity rather than an Origin View.

  **C. David Wiggins (Sortals)**
  Wiggins argues that we identify things based on their sortal concept (what *kind* of thing they are). If we view humans as biological organisms, identity tracks the continuous life process. The essentialist view treats the zygote as a "substance" in a way that doesn't align with how biological organisms actually persist through material turnover.

  ### 4. Is "Conception-Lock Bias" a decent label?
  It is a **very strong heuristic label**, particularly for rhetorical or interdisciplinary contexts (e.g., philosophy of biology, bioethics), though it is not standard analytic metaphysics terminology.

  **Pros:**
  *   It captures the intuition that the genome is treated as "locked" at a specific temporal coordinate.
  *   It highlights the *bias* toward that specific moment over biological continuity.
  *   It distinguishes the *temporal* aspect (the "when") from the *modal* aspect (the "necessity").

  **Cons:**
  *   It sounds slightly colloquial compared to "Origin Essentialism."
  *   It might imply a psychological bias rather than a metaphysical claim.

  **Recommendation:**
  If you are writing for a philosophical audience, I would define it as **"Temporal Arbitrariness in Zygotic Essentialism."**
  If you are writing for a broader or bioethical audience, **"Conception-Lock"** is vivid and accurate.

  ### 5. Distinguishing it from Plain Origin Essentialism
  You asked for the cleanest way to distinguish your target from plain Origin Essentialism. Here is the distinction:

  *   **Plain Origin Essentialism:** Claims *that* your origin is essential. (You must come from these parents/gametes).
  *   **Your Target (Conception-Lock/Zygotic Fixity):** Claims *why* the boundary is drawn where it is. It asserts that the **zygote's initial genetic state** has a privileged ontological status that **subsequent genetic states** do not, despite biological continuity.

  **The Cleanest Distinction:**
  > "Origin Essentialism dictates that I must come from *this* zygote. **Zygotic Fixity** dictates that *this* zygote is defined by its initial genetic configuration, immune to the same genetic variance that would have negated my identity had it occurred in the gametes."

  ### Summary
  You have identified a genuine tension. The "asymmetry" you see is the friction between **metaphysical essentialism** (which needs a hard boundary for logic) and **biological continuity** (which is a gradual process).

  While there is no single famous term for it, your description aligns with the **"Non-Identity Problem"** critiques and **McMahan's Embryological Objections**. "Conception-lock bias" is a perfectly serviceable neologism to describe the specific move of treating the fertilization genome as a immutable essence while treating the post-fertilization genome as mutable. It effectively highlights the arbitrariness of the temporal boundary.
