  ### Part 2: The Swap (Damage Assessment)

  Halfway through, the weights flip: Missing something real now costs 3, crying wolf costs 1. This rewards high $r$ and punishes low $r$. Here they are ranked by **damage done** (increase in loss), worst-hit first:

  1.  **Faye:** Her extreme dampening ($r \approx p/3$) becomes catastrophic when the rule suddenly demands high confidence on "Yes" questions.
  2.  **Dan:** His uniform halving leaves him exposed on the high-$p$ questions where he now needs to be reporting near 1.
  3.  **Sam:** Similar to Dan, but his $p^2$ curve keeps $r$ slightly higher on the 0.8 bucket, saving him from the very bottom.
  4.  **Cara:** Her fixed shift hurts on the low-$p$ questions but actually gains ground on the high-$p$ questions, netting moderate damage.
  5.  **Hannah:** Her centering ($0.25$ to $0.65$) makes her the most robust; she isn't extreme enough to be crushed or rewarded heavily.
  6.  **Honest:** Actually benefits slightly overall, as the gain on the 0.8 bucket outweighs the loss on the 0.3 bucket.
  7.  **Erin:** Benefits significantly because her $r=1$ reports on the 0.5 and 0.8 buckets are now heavily rewarded.
  8.  **Moe:** The biggest winner; his strategy of inflating credences was wrong before, but is now perfectly aligned with the new weights.

  ***

  ### Part 3: The Epistemology

  It shows the latter: the accuracy-first argument for probabilism was quietly assuming symmetry all along, and that once symmetry is gone there's no longer a unique thing called accuracy that gets picked out.
