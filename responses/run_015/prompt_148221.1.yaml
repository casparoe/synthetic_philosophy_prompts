  ### Part 1: Performance Tiers (Original Weights)

  The scoring rule penalizes False Positives (crying wolf) 3x harder than False Negatives. The winning strategy is to systematically report lower credences than you actually hold.

  **Tier 1: The Shrinkers (Total Loss ~32–34)**
  1.  **Sam the squarer (~32.1):** Wins by aggressively shrinking high credences, which aligns perfectly with the heavy penalty on reporting "Yes."
  2.  **Dan the dampener (~33.4):** A strong second that uniformly halves your credence, effectively hedging against the asymmetric wolf-penalty.
  3.  **Cara the constant shifter (~34.1):** Drops every credence by 0.1, which helps enough to beat honesty but lacks the nuance to beat Sam.

  **Tier 2: The Moderates (Total Loss ~39–42)**
  4.  **Faye, who read half a blog post (~39.6):** Shrinks too aggressively on high-probability questions, missing out on easy "Yes" points while saving on "No" penalties.
  5.  **Honest (~40.1):** Reports truthfully but gets punished by the rule's asymmetry, serving as the baseline for "epistemic accuracy" vs "score optimization."
  6.  **Hannah the hedger (~41.8):** Shifts low credences *up* (hurting her on the 0.3 bucket) while shrinking high ones, resulting in a net loss compared to honesty.

  **Tier 3: The Extremizers (Total Loss ~66)**
  7.  **Erin the extremist (~66.0):** Binarizes everything, forcing $r=1$ on the 0.5 bucket where the $3r^2$ penalty devastates her score half the time.
  8.  **Moe, who got the asymmetry backwards (~66.2):** Inflates credences in the exact direction of the heaviest penalty, maximizing loss on every question type.

  **The Actual Loss-Minimizing Rule**
  To find the optimal $r$, we minimize expected loss $E[L] = p(1-r)^2 + (1-p)3r^2$. Taking the derivative with respect to $r$ and setting to 0 yields:
  $$r^* = \frac{p}{3 - 2p}$$
  *(For your buckets, this means reporting ~0.57 when $p=0.8$, ~0.125 when $p=0.3$, and 0.25 when $p=0.5$.)*

