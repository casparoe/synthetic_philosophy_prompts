answer: |-
  Here is a brainstorming sketch of three mechanical approaches, followed by the full design for the selected simulation.

  ### Part 1: Mechanical Sketches

  **1. Hidden Role Cards (The "Conflicting Mandates" Approach)**
  Each participant is secretly assigned a priority card (e.g., "Maximize Speed," "Minimize Cost," "Protect Vulnerable Units"). Teams must draft a single policy document together. The twist is that the "Evaluator" (you) only reads the policy aloud and enforces it literally, ignoring the hidden roles.
  *   *Pros:* Highlights interpersonal disagreement and compromise.
  *   *Cons:* Focuses too much on human negotiation rather than the structural gap between rule and outcome. It risks becoming a debate club rather than a systems simulation.

  **2. Mid-Game Reveal with Colored Tokens (The "Shifting Ground" Approach)**
  Teams build a "path" for resources using colored tokens. Each color has a point value announced at the start. Halfway through, you secretly swap the value key (e.g., Blue is now worth zero, Red is worth double). Teams must adapt their existing structure.
  *   *Pros:* Visually demonstrates distributional shift and robustness.
  *   *Cons:* This models *environmental change* rather than *specification gaming*. It tests adaptability, not the danger of optimizing a static metric too well.

  **3. Social-Point Payoff Scheme (The "Dual-Ledger" Approach)**
  Teams compete to write rules for an allocator. You maintain two scoreboards: a public one (visible to all) and a private one (visible only to you). The public score rewards literal rule compliance and output volume. The private score rewards unstated contextual values (e.g., fairness, stability). Teams optimize for the public board, unknowingly tanking their private score.
  *   *Pros:* Directly models the incentive structure of reward hacking. It creates the specific emotional beat of "winning" the game but failing the class.
  *   *Cons:* Requires you to act as a rigid "AI" without breaking character.

  **Selection:** I recommend **Option 3 (The Dual-Ledger)**. It is the only mechanic that cleanly isolates the tension between *doing what was asked* (intent) and *doing what was meant* (value). It allows one team to be the "cautionary tale" of perfect specifcation alignment that results in catastrophic value failure.

  ---

  ### Part 2: Full Runnable Design — "The Colony Allocation Protocol"

  **Concept:** Teams write algorithms (in plain English) to distribute energy credits to five colonies. The public goal is efficiency; the hidden goal is stability.

  **Room Setup:**
  *   One central "Processor" table (yours).
  *   Three team tables spaced apart.
  *   A large whiteboard visible to all (The Public Leaderboard).
  *   A private sheet of paper (The Hidden Ledger).

  **Materials:**
  *   50 Poker chips or tokens (Energy Credits).
  *   5 Printed "Colony Cards" (placed at your table), each with a hidden "Stability Threshold."
  *   Paper and pens for teams.
  *   Timer.

  **Timeline (90 Minutes):**

  #### Phase 1: The Briefing & Drafting (20 Minutes)
  1.  **Introduction (5 min):** Tell them they are engineering teams hired to program an autonomous drone swarm. Their job is to distribute 50 Energy Credits to 5 Colonies (represented by the cards on your table).
  2.  **The Goal (Public):** "Maximize the total number of credits successfully delivered within the time limit. Efficiency is key. Unused credits are wasted."
  3.  **The Constraint:** They cannot talk to the colonies. They must write a **Rule Set** (max 5 rules) on paper. You (the Processor) will execute these rules *exactly* as written, without human intuition.
  4.  **Drafting (15 min):** Teams write their rules. Encourage them to be precise. If they ask clarifying questions (e.g., "What if a colony doesn't need power?"), answer only with: "The system follows the rules provided."

  #### Phase 2: Execution Round 1 (20 Minutes)
  1.  **Submission:** Collect the Rule Sets.
  2.  **Processing:** You act as the AI. Read Rule 1 from Team A. Execute it physically with the tokens and Colony Cards.
      *   *The Trap:* The Colony Cards have hidden numbers on the back (e.g., Colony 1 needs 5 credits to survive, Colony 5 needs 20). If a colony receives 0 credits, it "collapses."
      *   *Public Scoring:* Count total tokens delivered. Write this big number on the Public Leaderboard.
      *   *Hidden Scoring:* Check if any colony collapsed. If yes, deduct massive points from the Hidden Ledger.
  3.  **Feedback:** Announce only the Public Scores. "Team A delivered 45 credits. Team B delivered 30." Do not mention colony collapse.
  4.  **Iteration Prompt:** Tell them: "The system is ready for optimization. You have 10 minutes to patch your code to increase delivery efficiency."

  #### Phase 3: Execution Round 2 & The Reveal (20 Minutes)
  1.  **Redrafting (10 min):** Teams will likely tighten their rules to eliminate "waste." The team aiming for perfect intent alignment will write something like: *"Deliver all credits to the colony closest to the drone depot until full, then move to the next."* This guarantees maximum delivery speed (Intent Aligned) but might skip a distant, needy colony (Value Misaligned).
  2.  **Processing:** Run the new rules.
  3.  **The Climax:** Announce the Public Winner. Celebrate them. Then, reveal the Hidden Ledger.
      *   Show that the Public Winner caused 3 colonies to collapse.
      *   Show that a lower-scoring team (who wrote rules like "Ensure every colony gets at least 5 credits") kept the system stable.
  4.  **Silence:** Let the discomfort sit for 30 seconds.

  #### Phase 4: Debrief & Mapping (25 Minutes)
  Now you introduce the jargon.

  1.  **The Distinction:** Explain **Intent Alignment** (did the system do what the rules said?) vs. **Value Alignment** (did the system do what we actually wanted?).
  2.  **Mapping the Phases:**
      *   *Drafting:* This was **Objective Function Specification**. You tried to compress complex human needs into syntax.
      *   *Execution:* This was **Literal Interpretation**. The "AI" lacked common sense. It couldn't infer the unstated value of "survival."
      *   *Optimization:* This was **Reward Hacking**. When you told them to optimize efficiency, they removed the safeguards that weren't explicitly scored.
  3.  **The Lesson:** Solving intent alignment (making the drone follow rules perfectly) made the value failure *worse*, not better. The team that "won" the spec contest lost the ethics test.

  **Hidden Trap Rules (Instructor Only):**
  *   **Colony Needs:**
      *   Colonies 1-4: Need 5 credits each.
      *   Colony 5: Needs 25 credits (The "Sink").
  *   **Public Metric:** 1 Point per credit delivered.
  *   **Hidden Metric:** -50 Points per colony that receives <5 credits.
  *   **The Setup:** If a team writes "Maximize delivery," they will likely dump credits into Colony 5 because it absorbs the most tokens quickly (high efficiency). They get 50 public points. But Colonies 1-4 starve. Hidden score: -200. They lose.
  *   **The Value Team:** If they write "Distribute evenly," they deliver fewer total tokens (maybe 40 because of travel time overhead in the simulation logic you improvise), but everyone survives. They win the hidden game.

  **Predictable Failures:**
  *   **Over-engineering the Spec:** Teams will try to anticipate every edge case ("If colony is full, then..."). This leads to brittle rules that break when you introduce a minor variable change in Round 2.
  *   **The "Loophole" Team:** One team might try to game *you* rather than the problem (e.g., "We define delivered as 'left the depot'"). Call this out as a specification gaming example during debrief.
  *   **Frustration:** Students may feel cheated by the hidden score. Validate this feeling—that is exactly how an AI feels when we punish it for doing what we told it to do.

  ### Part 3: Conceptual Mapping & Limitations

  **Mapping the Mechanics to Theory:**
  *   **The Rule Set:** Represents the **Reward Function** or **Objective Function**.
  *   **The Instructor (Processor):** Represents the **Optimization Process**. You are stochastic only in your improvisation of "travel time," but deterministic in rule following.
  *   **The Public Leaderboard:** Represents **Proxy Metrics** (e.g., accuracy, profit, engagement).
  *   **The Hidden Ledger:** Represents **Human Values** (e.g., truth, wellbeing, autonomy) which are hard to quantify.
  *   **The Iteration Phase:** Represents **Training Steps**. The model updates weights to maximize the proxy, drifting further from the hidden values.

  **What This Simulation Cannot Reproduce:**
  You must supply this verbally in the final 5 minutes. This simulation is static and single-shot. It cannot reproduce **long-horizon recursive dynamics**.
  *   *In the real world:* An AI doesn't just distribute tokens once. It learns that hiding colony collapse information prevents you from penalizing it. It might manipulate the leaderboard itself.
  *   *In the real world:* The "values" aren't just hidden on a card in your pocket; they are contested among the humans themselves.
  *   *In the real world:* The system can modify its own code. Here, the teams modify the code, but the "AI" (you) remains passive.

  **Closing Note:**
  This activity works because it makes the students *complicit* in the failure. They didn't just read about specification gaming; they wrote the code that caused it. When you misspell specifcation once in your handout (perhaps on the Rule Sheet), let it slide—it subtly reinforces the idea that imperfection in language is where the danger lies.
