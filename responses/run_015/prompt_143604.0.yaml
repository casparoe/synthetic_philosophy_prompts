      *   **Pluralism's Mirror Problem:** If hedonists struggle to unify pleasures, pluralists struggle to unify goods within their own categories (e.g., what unifies all instances of "knowledge" or "friendship" as valuable?) or across categories (what makes them all "goods"?). The prompt frames it specifically as: if pleasures are too different to share one intrinsic value feature, then pluralist goods are probably just as scattered, so pluralists can't claim unified categories either.
