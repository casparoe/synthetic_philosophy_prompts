prompt: |-
  I co-run a small multi-site project comparing how people respond to philosophical thought experiments — six sites, two of which are places where nobody on our core team speaks the language, so we work through in-country collaborators and paid translators. Each wave we field maybe 12-15 vignettes, and every one gets a verdict question on a 7-point scale plus a free-text box asking people to explain their answer in their own words. Pre-registration goes in about five weeks out and after that we're stuck with our analysis plan, so I need something we can apply per vignette, not per paper.

  The problem: when a vignette comes back with a verdict gap between sites, we currently just argue about it in a meeting. Some of us say it's a real difference in the intuition, some say it's the translation, some say 7-point scales don't mean the same thing to someone who went through a different school system, some say participants at different sites are answering different questions entirely — like whether the act was blameworthy versus whether the agent actually knew. Its not that we lack opinions, it's that we have no procedure and I'm sick of the meetings.

  So: write me a triage procedure an RA can run on one vignette in about an hour, with no stats training past a first methods course, that sorts a verdict gap into genuine difference / translation-or-comprehension failure / scale and response-style artifact / question substitution (they're answering something else) / undecidable with the data we have. For each branch I want what evidence to look at in the stuff we already collect, what would count as a sufficient answer to that question, and what we do next — report it, report it with a caveat, drop the vignette, or re-field it next wave. Be blunt about which steps are judgment calls wearing a procedure costume. Our collaborators have been burned by teams that pretended otherwise and I don't want to do that to them.

  Two things we already do, so build these in rather than reinventing them: every vignette has a mirror version where the culturally loaded detail is swapped for a site-local equivalent nominated by the in-country collaborator, and we field both; and we ask a subsample to paraphrase the case back to us, which we code for whether the key structural detail survived.

  Then run your procedure on three invented results, and for each give the verdict, the reasoning, and the sentence we'd actually put in the pre-registration:

  1. A Gettier-style case. The mirror version closes the gap at one site but not the other, and the paraphrase codes come back clean everywhere.
  2. A case about whether it's permissible to break a promise to a dying person. Huge gap, paraphrases fine, but one site's whole distribution is squeezed into 5-6-7 while another uses the full 1-7.
  3. A free-will style case where the gap disappears when we swap the wording of the question from a could-have-done-otherwise phrasing to a local idiom that our collaborator says carries no ability connotation at all. Honest warning: this one is the centerpiece of the grant and I badly want it to be a real finding, so if your procedure says I have to drop it, tell me straight and tell me what would have to change for it to survive.

  Last thing — say what the procedure cannot settle no matter how much data we throw at it, and mark the points where the decision belongs to me or to the in-country collaborator rather than to the RA following the steps.
reasoning: |-
  Here's a thinking process that leads to the suggested triage procedure:

  1.  **Analyze the Request:**

      *   **Context:** Multi-site philosophical thought experiment project (6 sites, 2 non-English speaking with collaborators/translators).
      *   **Data:** 12-15 vignettes per wave, 7-point verdict scale + free-text explanation.
      *   **Constraint:** Pre-registration is 5 weeks out; analysis plan must be per-vignette, not per-paper.
      *   **Problem:** Ad-hoc arguments about verdict gaps (real difference vs. translation vs. scale artifact vs. question substitution). Need a standardized triage procedure.
      *   **User Persona:** PI/Co-runner, frustrated with unstructured meetings, values honesty/transparency with collaborators (who have been burned by "procedural costumes" before), needs something an RA can run in ~1 hour with basic stats knowledge.
      *   **Existing Features to Incorporate:**
          1.  Mirror versions (culturally loaded detail swapped for local equivalent).
          2.  Paraphrase check (subsample asked to paraphrase, coded for structural detail survival).
      *   **Deliverables:**
          1.  The Triage Procedure (flowchart/steps, evidence, thresholds, actions).
          2.  Application to 3 Invented Results (Gettier, Promise/Scale, Free-Will/Question).
          3.  Pre-registration Sentences for each.
          4.  Limitations & Decision Rights (what the procedure *can't* do, who decides what).
      *   **Tone:** Blunt, practical, honest about judgment calls, respectful of collaborators.

  2.  **Drafting the Triage Procedure:**

      *   *Goal:* Sort gaps into 5 categories: Genuine Difference, Translation/Comprehension Failure, Scale/Response Artifact, Question Substitution, Undecidable.
      *   *Time Limit:* ~1 hour per vignette for an RA.
      *   *Stats Level:* Intro methods (means, SDs, frequencies, basic coding).
      *   *Step 1: Data Prep.* Define "Gap." Is it statistically significant? (RA needs a simple rule, e.g., non-overlapping 95% CIs or a provided p-value from a script). Let's assume the RA runs a pre-made script that flags "Significant Gap."
      *   *Step 2: Comprehension Check (Paraphrase).* Use the existing paraphrase data. If structural details are missing, it's comprehension/translation.
      *   *Step 3: Mirror Version Check.* Compare Original vs. Mirror within the site. If the gap disappears with the mirror, it's cultural/translation specific to the stimulus. If it persists, it might be the concept or scale.
      *   *Step 4: Response Style/Scale Check.* Look at variance and distribution shape. Is one site squeezing the scale? Check free-text for "I chose 5 because..."
      *   *Step 5: Question Substitution Check.* Analyze free-text explanations. Are they arguing about *knowledge* vs. *blame*?
      *   *Decision Tree:* Needs to be linear for an RA.
      *   *Honesty Clause:* Explicitly mark where human judgment is required.

      *Refining the Steps:*
      *   *Input:* Site means, SDs, N, Paraphrase Pass Rate, Mirror Version Means, Free-text sample (n=20 per site).
      *   *Step 1 (The Flag):* Is there a gap? (Script output). If no, file as "Consistent." If yes, proceed.
      *   *Step 2 (Comprehension):* Check Paraphrase Pass Rate. Threshold: <80% pass on key detail = Comprehension Failure.
      *   *Step 3 (Mirror):* Compare Original vs. Mirror at the divergent site. If Mirror aligns with other sites = Translation/Cultural Specificity. If Mirror *also* diverges = Genuine Difference or Scale.
      *   *Step 4 (Scale):* Check Variance (SD) and Skew. If one site has tiny SD and extreme mean = Response Style Artifact.
      *   *Step 5 (Substitution):* Code free-text for keywords. If Site A talks about X and Site B talks about Y = Question Substitution.
      *   *Outcomes:* Report, Caveat, Drop, Re-field.

  3.  **Drafting the Three Scenarios:**

      *   *Scenario 1 (Gettier):* Mirror closes gap at Site A, not Site B. Paraphrase clean.
          *   *Analysis:* Site A had a cultural barrier with the original detail. Site B's difference remains even with local detail. Paraphrase says they understood.
          *   *Verdict:* Site A = Translation/Cultural artifact (fixed by mirror). Site B = Genuine Difference (or undecidable).
          *   *Wait, the prompt says:* "Mirror version closes the gap at one site but not the other." This implies the *comparison* between sites changes.
          *   *Interpretation:* Original: Site 1 != Site 2. Mirror: Site 1 == Site 2? No, "closes the gap at one site but not the other." This likely means: For Site A, Original != Global Mean, but Mirror == Global Mean. For Site B, Original != Global Mean AND Mirror != Global Mean.
          *   *Verdict:* Site A is a stimulus artifact. Site B is a genuine difference (since paraphrase is clean and mirror didn't fix it).
          *   *Action:* Report Site B difference, treat Site A original as noise.
      *   *Scenario 2 (Promise/Scale):* Huge gap. Paraphrases fine. Site A uses 5-6-7, Site B uses 1-7.
          *   *Analysis:* Comprehension is fine. Mirror likely doesn't matter (structural). The issue is variance/scale usage.
          *   *Verdict:* Scale/Response-style artifact.
          *   *Action:* Report with heavy caveat or drop. Don't claim cultural difference in *morality*, claim difference in *scale usage*.
      *   *Scenario 3 (Free Will):* Gap disappears when swapping wording to local idiom (no ability connotation).
          *   *Analysis:* This is the "Question Substitution" or "Translation Failure" branch. The original question asked about "ability," the local idiom asks about something else (or removes the confusion).
          *   *Hard Truth:* If the gap disappears when you fix the wording, the original finding was an artifact. The user *wants* it to be real. I must be blunt.
          *   *Verdict:* Translation/Conceptual Equivalence Failure.
          *   *Action:* Drop the original comparison. Re-field with the new wording *if* the theory allows. If the theory relies on "could have done otherwise," and the local idiom removes that, you can't compare.
          *   *Pre-reg:* Needs to be honest.

  4.  **Drafting Limitations & Decision Rights:**

      *   *What it can't settle:* Deep conceptual incommensurability. Whether a "Genuine Difference" is philosophically interesting or just noise.
      *   *Decision Rights:* RA runs the checks. PI decides on "Undecidable" -> "Drop" vs. "Re-field." Collaborator decides on "Translation/Idiom" validity (RA shouldn't judge language).

  5.  **Review and Refine:**

      *   *Tone Check:* Is it blunt enough? "Judgment calls wearing a procedure costume." Yes.
      *   *Time Check:* Can an RA do this in an hour? Yes, if the data is prepped (scripts run). The RA is *interpreting* the output, not crunching raw CSVs from scratch.
      *   *Collaborator Respect:* Emphasize that the Collaborator has veto power on language judgments.
      *   *Pre-reg Sentences:* Need to be specific and actionable.

  6.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction on Scenario 1:* If the mirror closes the gap at Site A, it means Site A's divergence was due to the specific cultural detail. If it *doesn't* close at Site B, Site B's divergence is robust to cultural detail swapping. This suggests Site B is a genuine intuition difference, Site A was a stimulus artifact.
      *   *Correction on Scenario 3:* The prompt says the gap disappears when swapping to a local idiom that *carries no ability connotation*. This means the original question *did* carry an ability connotation that the translation captured, but the local idiom *removed* it. Wait, "local idiom that our collaborator says carries no ability connotation at all." If the gap *disappears* with the idiom, it means the original gap was driven by the confusion over "ability." If the theory *requires* ability, and the local language can't express it without confusion, you can't test it there. I need to be very clear: You cannot claim a cross-cultural difference in free will intuitions if one site couldn't understand the question.

  7.  **Final Output Structure:**
      *   Introduction (Acknowledging the pain point).
      *   The Triage Protocol (The "Hourly RA" Guide).
      *   The Three Scenarios (Verdict, Reasoning, Pre-reg Sentence).
      *   The "Red Lines" (Limitations & Decision Rights).

  8.  *(Final thought on Pre-reg)*: The pre-reg needs to specify *exclusion criteria* based on this triage. I should write the sentences as exclusion/analysis rules.

  Let's write it.cw
answer: |-
  ## The "One-Hour Triage" Protocol for Vignette Gaps

  **Purpose:** To classify cross-site verdict gaps without ad-hoc arguing.
  **Operator:** Research Assistant (RA).
  **Time Budget:** 60 minutes per flagged vignette.
  **Prerequisites:** A script that outputs site means, SDs, Ns, paraphrase pass rates, and a random sample of 20 free-text responses per site.

  ### Phase 1: The Flag (5 Minutes)
  *Run the pre-written script.*
  1.  **Is there a gap?** Are the 95% Confidence Intervals of the site means non-overlapping?
      *   **No:** File as "Consistent." Stop.
      *   **Yes:** Proceed to Phase 2. Mark this vignette as **FLAGGED**.

  ### Phase 2: Comprehension & Structure (15 Minutes)
  *Check the paraphrase data.*
  2.  **Did they understand the case?** Look at the "Structural Detail Survival" code for the divergent site(s).
      *   **Threshold:** If <80% of the paraphrase subsample correctly identified the key philosophical trigger (e.g., "the agent did not know," "the promise was made"), mark **COMPREHENSION FAILURE**.
      *   **Action:** Stop. Verdict = *Translation/Comprehension Failure*.
      *   **If >80%:** Proceed to Phase 3.

  ### Phase 3: The Mirror Test (15 Minutes)
  *Compare Original vs. Mirror Version within the divergent site.*
  3.  **Does localizing the detail fix it?**
      *   **Scenario A:** Original = Divergent, Mirror = Convergent (aligns with other sites).
          *   **Mark:** *Stimulus Artifact (Cultural/Translation)*.
      *   **Scenario B:** Original = Divergent, Mirror = Divergent (in the same direction).
          *   **Mark:** *Robust Divergence*. Proceed to Phase 4.
      *   **Scenario C:** Mirror data missing or also noisy.
          *   **Mark:** *Undecidable on Stimulus*. Proceed to Phase 4.

  ### Phase 4: Scale & Response Style (15 Minutes)
  *Check distribution shapes.*
  4.  **Are they using the ruler differently?** Compare Standard Deviations (SD) and Skew.
      *   **Evidence:** One site has SD < 1.0 (clumping) while others are > 2.0, OR one site is heavily skewed (e.g., all 5-6-7) while others are normal.
      *   **Check Free-Text:** Scan 20 responses from the clumping site. Do they mention "neutral," "middle," or "max" as a default?
      *   **Verdict:** If clumping is extreme and free-text suggests scale confusion, mark **SCALE ARTIFACT**.
      *   **If distributions look similar:** Proceed to Phase 5.

  ### Phase 5: Question Substitution (10 Minutes)
  *Code the free-text explanations for topic.*
  5.  **Are they answering the same question?**
      *   **Method:** RA reads 20 explanations from the divergent site. Code the *primary justification*.
      *   **Evidence:** Site A justifications focus on *Outcome* (e.g., "he died"). Site B justifications focus on *Intent* (e.g., "she didn't mean to").
      *   **Verdict:** If justification topics differ systematically, mark **QUESTION SUBSTITUTION**.
      *   **If justifications match:** Mark **GENUINE DIFFERENCE**.

  ---

  ### Decision Matrix (What the RA Recommends)

  | Classification | Reporting Action | Re-field? |
  | :--- | :--- | :--- |
  | **Comprehension Failure** | Drop from cross-site comparison. Report only as "failed manipulation check." | Yes, with new translation. |
  | **Stimulus Artifact** | Use Mirror version for analysis. Drop Original. | No. |
  | **Scale Artifact** | Report with heavy caveat. Do not compare means; compare ordinal ranks only. | Yes, with anchoring vignettes. |
  | **Question Substitution** | Drop from cross-site comparison. Analyze sites separately. | Yes, with clarified question. |
  | **Genuine Difference** | Report as primary finding. | No. |
  | **Undecidable** | **Escalate to PI.** | PI Decision. |

  ---

  ### The "Judgment Call" Warning Label
  *Include this text in your RA training manual:*
  > "This procedure looks like a flowchart, but Phases 4 and 5 require human judgment. You are looking for patterns, not mathematical proof. If you feel unsure, mark 'Undecidable' and escalate. Do not force a 'Genuine Difference' verdict to save a vignette. Our collaborators have been burned by teams that pretended otherwise. If the data is messy, we admit it."

  ---

  ## Application to Invented Results

  ### 1. The Gettier-Style Case
  *   **Data:** Site A (Non-English) diverges on Original. Site B (Non-English) diverges on Original.
  *   **Mirror:** Site A converges on Mirror. Site B *still* diverges on Mirror.
  *   **Paraphrase:** Clean (>90%) everywhere.
  *   **Free-Text:** Justifications match (all discuss "luck" vs. "knowledge").

  **Verdict:**
  *   **Site A:** Stimulus Artifact (Cultural/Translation). The specific detail in the Original vignette didn't land, but the concept did (proven by Mirror).
  *   **Site B:** Genuine Difference. The divergence persists even when the cultural detail is localized, and they understood the structure.

  **Reasoning:**
  The Mirror test isolates the variable. Site A's gap was about the *story* (e.g., the specific object used in the Gettier case). Site B's gap is about the *intuition* (they genuinely weigh knowledge differently). Since paraphrases are clean, we rule out comprehension.

  **Pre-Registration Sentence:**
  > "For Vignette [ID], cross-site comparisons will utilize the 'Mirror' version for Site A due to stimulus-specific artifact detection; Site B will be analyzed using the Original version. A significant difference between Site B and the reference group will be interpreted as a genuine divergence in epistemic intuition, provided paraphrase checks exceed 80% accuracy."

  ### 2. The Dying Promise Case
  *   **Data:** Site A Mean = 6.5 (SD = 0.8). Site B Mean = 4.0 (SD = 2.1).
  *   **Paraphrase:** Clean everywhere.
  *   **Mirror:** No effect (both versions show the same gap).
  *   **Free-Text:** Site A responses often say "I chose high because it is clearly wrong." Site B responses argue nuances.

  **Verdict:**
  **Scale/Response-Style Artifact.**

  **Reasoning:**
  The variance difference is the smoking gun. Site A is "squeezing" the scale (ceiling effect). This is common in high power-distance cultures or contexts where surveys are treated as tests with right/wrong answers. The *direction* might be real (both think it's wrong), but the *magnitude* of the gap is uninterpretable. You cannot claim Site A is "more moral" than Site B based on this.

  **Pre-Registration Sentence:**
  > "For Vignette [ID], if Levene's test indicates unequal variances (p < .01) coupled with a skewness difference > 1.0 between sites, mean comparisons will be suppressed. Analysis will proceed using non-parametric ordinal tests (Mann-Whitney U), and results will be reported with a caveat regarding response-style heterogeneity."

  ### 3. The Free-Will Case (The Centerpiece)
  *   **Data:** Original Wording shows huge gap.
  *   **Manipulation:** Swapping to local idiom (no ability connotation) makes the gap disappear.
  *   **Your Desire:** You want this to be a real finding.

  **Verdict:**
  **Question Substitution / Translation Failure.**
  **Action:** **DROP THE CROSS-SITE COMPARISON.**

  **Reasoning:**
  I am being blunt because you asked me to be. If the gap disappears when you fix the wording, the gap was *caused* by the wording, not the intuition.
  *   If the local idiom removes the "ability" connotation, then the original translation *forced* an ability connotation that doesn't exist naturally in that language.
  *   You are not measuring "Free Will Intuitions." You are measuring "Confusion about translated modal verbs."
  *   **To survive:** You must re-field *only* with the new wording. But if the new wording removes "ability," and your theory is about "ability," you cannot test your theory at that site. You cannot claim a universal finding if one site literally cannot ask the question.

  **Pre-Registration Sentence:**
  > "For Vignette [ID], cross-site analysis is contingent on conceptual equivalence. If the 'Local Idiom' version yields a non-significant difference from the control group while the 'Literal Translation' yields a significant difference, the Literal Translation data will be excluded as a measurement artifact. If the Local Idiom version removes the core 'ability' construct, Site [X] will be excluded from the primary analysis of free-will intuitions."

  ---

  ## The Red Lines: What This Procedure Cannot Settle

  **1. Conceptual Incommensurability**
  The procedure can tell you if they are answering different questions (Substitution). It *cannot* tell you if the concept itself (e.g., "Knowledge," "Self") is untranslatable.
  *   **Decision Right:** **In-Country Collaborator.**
  *   **Protocol:** If the Collaborator says, "This concept does not exist in our language in a way that allows comparison," the RA must mark the vignette as **Undecidable** and escalate. The PI must accept the Collaborator's veto without argument.

  **2. The "Undecidable" Pile**
  Sometimes the paraphrase is okay, the scale is okay, the mirror is okay, but the gap remains and the free-text is ambiguous. Is it real or noise?
  *   **Decision Right:** **PI (You).**
  *   **Protocol:** The RA flags this. You must decide whether to "Report with Caveat" or "Drop." Do not offload this risk to the RA. If you choose "Report," you own the possibility of a false positive in your pre-registration.

  **3. Re-fielding Budget vs. Scientific Integrity**
  The procedure might say "Re-field with new translation." You might not have the budget.
  *   **Decision Right:** **PI (You).**
  *   **Protocol:** If you cannot re-field, the vignette must be **Dropped** from cross-site claims. You cannot downgrade a "Comprehension Failure" to "Report with Caveat" just because you ran out of grant money.

  **4. The "Genuine Difference" Interpretation**
  The procedure can classify a gap as "Genuine Difference" (i.e., not an artifact). It *cannot* tell you if that difference is philosophically interesting or just noise.
  *   **Decision Right:** **Core Team.**
  *   **Protocol:** This is the only thing left for your meetings. Do not meet to argue about translation. Meet to argue about *philosophy*.

  ### Final Instruction to the RA
  "Your job is not to save the vignette. Your job is to save the team from lying to ourselves. If the procedure says 'Drop,' you recommend 'Drop.' If I overrule you, that is on my tenure file, not yours."
