  ### The principle

  Semantic content is determined by a dual-condition principle: for public natural-kind and social-kind terms, reference fixes to the underlying physical or functional structure of the causal source samples, contingent on the speaker's implicit intent to defer to communal expertise regarding that structure. For privately stipulated terms referring to subjective states, content fixes exclusively to the phenomenological type intended by the speaker at stipulation. In all cases, a term lacks content if the token lacks a historical causal chain linking it to an original grounding event or state. Meaning is thus externally anchored for public vocabulary but internally anchored for private phenomenology, requiring both a causal history and a deferential or ostensive intentional stance. This principle prioritizes the actual nature of the kind over superficial description for public terms, while allowing privileged access for private sensations, ensuring that reference tracks reality where communication is involved but respects first-person authority where it is not.

  ### Clause by clause

  The first clause handles Case 1 (Classic Twin Earth): Oscar's 'water' connects to H2O, Twin-Oscar's to XYZ. Different underlying structures yield different contents, validating your externalist intuition that they think different thoughts. In Case 1, the causal chain diverges at the planetary level, ensuring distinct contents despite identical internal states. It also addresses Case 2 (D2O) by defining 'structure' as chemical kind rather than exact isotopic mass; since D2O shares the chemical kind hydrogen-oxygen, it falls within the same structural family, preserving your intuition that it counts as water despite microphysical differences. This nuance allows the principle to distinguish between radical structural changes (XYZ) and minor variations (D2O), saving your inconsistent verdicts by appealing to chemical taxonomy. Case 3 (50/50 Mix) is resolved by the causal source requirement: without a dominant sample, reference becomes indeterminate, explaining why 50/50 fails while 99/1 succeeds where one source dominates. The threshold for dominance is vague, mirroring your gut feeling about the sorites-like nature of the mix; there is no sharp line, only a shift in probability of reference. The deference condition specifically motivates Case 4 (Arthritis): the speaker's intent to defer to medical expertise overrides their false belief about thigh location, fixing content to the expert definition rather than individual misconception. This captures the social dimension of meaning, showing that individual psychology is insufficient for public terms.

  The second clause protects Case 5 (Private 'Glorp'): since this is a stipulated private term, it bypasses causal history and defers solely to your ostensive intent, saving your internalist intuition about private coinage where public usage is absent. This exception prevents the externalist requirement from swallowing first-person authority over sensations, carving out a space for internalism. The third clause, requiring a historical chain, directly supports Case 6 (Swampman): lacking any causal history linking him to trees or objects, his tokens lack content entirely, as there is no grounding event. In Case 6, the lightning strike creates a physical duplicate but fails to create a historical duplicate, severing the link to meaning. This validates the intuition that history is constitutive of meaning, not just causation. Finally, the principle addresses Case 7 (Contradiction/Knowledge) by distinguishing public from private access. It affirms Oscar and Twin-Oscar contradict (different public content) but concedes you cannot know public meaning without empirical investigation, forcing a revision of your intuition that chemistry is unnecessary for self-knowledge. You know your *thought*, but not its *extension*, without external data. This splits the verdict: contradiction is real, but transparency is limited to the internal vehicle, not the external content.

  ### Predictions

  Regarding the future XYZ community: the principle predicts 'water' continues referring to H2O due to the historical chain, even if everyone drinks XYZ. The meaning flips only upon explicit re-baptism where the community intentionally grounds the term in the new liquid. Until then, their statements "this is water" are technically false, though universally accepted. This creates a generational gap where older terms refer to extinct kinds until linguistic labor updates the grounding. The flip occurs not when usage changes, but when the causal intent shifts.

  For the envatted brains: lacking causal contact with actual liquid, their 'water' tokens lack natural-kind content. They refer either to nothing or to the simulation-states causing their experiences, akin to your 'glorp' case. They have phenomenal content but lack external reference. Their thoughts are not about liquid but about the internal causes of their sensations, marking a sharp divide between simulated and real content. They are trapped in the private clause, unable to access the public one.

  Concerning artifacts and social kinds: the principle explicitly covers these via the "social-kind" and "functional structure" provisions. 'Chair' refers to the functional kind grounded in communal usage, not just physical atoms. 'University' refers to the institution grounded in historical charters and social recognition. The deference clause applies strongly here, as administrative definition overrides individual misconception, just like the arthritis case, ensuring social reality determines meaning over individual belief. This extends externalism beyond natural kinds to the social world.

  ### What I'd have to give up

  You must give up the second half of Verdict 7: the idea that you know what you mean without doing chemistry. If content depends on external structure, you cannot know your content transparently; you might be on Twin Earth. This is the cost of saving Cases 1, 4, and 6. The principle is slightly baroque due to its dual nature (public vs. private), but less so than trying to force internalism onto Swampman. The simpler rival is Radical Internalism. It saves Verdict 7 (transparent knowledge) and Verdict 2 (D2O is water), but forces you to drop Verdict 1 (XYZ is different), Verdict 4 (experts win), and Verdict 6 (Swampman means nothing). Externalism is the standard cost for taking history and community seriously.
