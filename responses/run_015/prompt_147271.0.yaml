  *(Refining the Physics Analogy)*: The roommate says "in the limit." In physics, if I predict a ball hits the ground in 5 seconds and it hits in 10 because of wind, I wasn't "early," I ignored a variable. If I say "in a vacuum," then it's a conditional claim. Malthus didn't say "assuming no tech growth." He implied a natural state. So the physics analogy fails unless the model is explicitly conditional.

  *(Final Plan)*:
  1. Intro: Validate the frustration.
