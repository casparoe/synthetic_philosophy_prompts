answer: |-
  ### Part 1: Sharpening Your Distinctions

  You asked to keep your six distinctions, sharpen them, and flag errors. Here is the assessment before we build the procedure.

  1.  **Classify the failure:** *Sharpened.* As a design step, this is impossible (you cannot classify a failure that hasn't happened). I have split this into **Anticipated Failure Modes** (Design Phase) and **Observed Failure Class** (Review Phase). The Review Phase is where this distinction becomes actionable.
  2.  **The indifferent optimizer:** *Valid.* This does not collapse into #1; it is the *method* used to identify the "behavior change" failure mode in #1. It shifts the burden from "will they cheat?" to "what does the math incentivize?"
  3.  **The blindness profile:** *Valid.* This is distinct from #2. #2 is about active distortion; #3 is about passive invisibility.
  4.  **The validated envelope:** *Critical.* This is the strongest constraint. If this is missing, the metric is a hypothesis, not a governance tool.
  5.  **A second channel:** *Valid.* This is the only defense against systemic blind spots.
  6.  **A pre-registered kill condition:** *Valid.* This prevents sunk-cost fallacy.

  **Correction:** Your list implies all six apply at definition time. In the procedure below, #1 (Classification) is moved to the *Review* phase, while the other five are *Definition* phases. This prevents the procedure from asking you to diagnose a corpse before the patient is born.

  ---

  ### Part 2: The Metric Governance Procedure

  **Context:** Run this in a 90-minute session. Attendees: You (Staff Eng), Data Analyst, Engineering Director, Team Lead.
  **Goal:** Binary decision. Either the metric is chartered to govern, or it is not.

  #### Phase A: Definition (Pre-Flight)

  **Step 1: The Validated Envelope**
  *   **Question:** Within what specific range of values and system conditions have we empirically verified that moving this number moves the goal?
  *   **Sufficient Answer:** "Historical data from [Service A, B] shows that when Deployment Frequency increased from 1/day to 5/day, Lead Time dropped. We have no data above 10/day or for monolithic repos."
  *   **Hand-waving:** "It stands to reason," "Industry best practice says," or "We assume linearity."
  *   **Artifact:** A plot or table showing the historical correlation range (Min/Max values, specific system types).
  *   **Stopping Rule:** If current baseline or target values lie *outside* the validated envelope, **STOP**. The metric may not govern. It may only be used for observation.
  *   **Note:** This is a **Fact** step. Do not argue about whether the envelope *should* be wider.

  **Step 2: The Indifferent Optimizer**
  *   **Question:** If a competent engineer cared *only* about this number and *not* the goal, what is the cheapest, lowest-risk change they could make to move it?
  *   **Sufficient Answer:** Concrete examples. "They could split one deployment into three no-op deploys to triple frequency." "They could reclassify P1 bugs as P2 to lower open P1 count."
  *   **Hand-waving:** "The team wouldn't do that," or "That would be unethical."
  *   **Artifact:** A list of 3 specific "gaming" commits or actions that are technically valid but goal-neutral.
  *   **Stopping Rule:** If the cost to game the metric is lower than the cost to achieve the goal, **STOP**. Or, hand off to **Director** to decide if the risk of gaming is an acceptable value trade-off.
  *   **Note:** This is a **Fact** step (identifying the loophole) followed by a **Value** step (accepting the risk).

  **Step 3: The Blindness Profile**
  *   **Question:** What is the single most important aspect of the goal that this metric *cannot* see, even in theory?
  *   **Sufficient Answer:** "This metric tracks code churn but cannot see architectural debt accumulation." "This tracks uptime but cannot see user frustration during degraded performance."
  *   **Hand-waving:** "It covers the basics," or listing trivial blind spots (e.g., "it doesn't track holidays").
  *   **Artifact:** A signed statement: "We acknowledge [Metric] is blind to [Critical Blind Spot]."
  *   **Stopping Rule:** If the blind spot is catastrophic (e.g., "blind to security vulnerabilities"), **STOP**. Otherwise, hand off to **Director** to sign off on the risk.
  *   **Note:** This is a **Value** step. The data cannot tell you if a blind spot is acceptable.

  **Step 4: A Second Channel**
  *   **Question:** What independent signal will we check to confirm this metric is not lying? It must rely on a different data source.
  *   **Sufficient Answer:** "We will correlate Deployment Frequency with Customer Support Ticket Volume." "We will cross-reference Bug Counts with Post-Mortem Incident Counts."
  *   **Hand-waving:** "We'll watch the dashboards," or using a derivative of the same data (e.g., "We'll check the weekly average" vs "daily total").
  *   **Artifact:** Name of the second metric and the data owner.
  *   **Stopping Rule:** If no independent channel exists, **HAND OFF** to **Director**. The metric cannot govern automatically; it requires human review at decision time.
  *   **Note:** This is a **Fact** step (does the data source exist?).

  **Step 5: Pre-registered Kill Condition**
  *   **Question:** What specific observation will cause us to revoke this metric's governance power, and when is the review date?
  *   **Sufficient Answer:** "If the Second Channel diverges by >20% for two quarters, we pause." "Review date: Q3 2025. Half-life estimate: 4 quarters."
  *   **Hand-waving:** "We'll keep an eye on it," or "If it breaks."
  *   **Artifact:** A calendar invite for the review date and the specific revocation criteria.
  *   **Stopping Rule:** If no kill condition is written, **STOP**. The metric is not charterable.
  *   **Note:** This is a **Governance** step.

  #### Phase B: Review (When Metric Looks Suspicious)

  **Step 6: Failure Classification**
  *   **Question:** Based on artifacts (logs, tickets, dashboards), which failure mode is occurring?
  *   **Sufficient Answer:**
      *   *Drift:* Correlation decayed (world moved).
      *   *Gaming:* Behavior changed to move number (Indifferent Optimizer acted).
      *   *Extrapolation:* Values moved outside Validated Envelope.
      *   *Observer Effect:* Measuring changed the system (e.g., logging overhead slowed service).
  *   **Hand-waving:** "The metric feels off," or "The team says it's unfair."
  *   **Artifact:** Data evidence linking the failure mode to the metric behavior (e.g., commit history showing no-op deploys).
  *   **Stopping Rule:** If *Gaming* or *Extrapolation* is confirmed, **STOP** governance immediately. If *Drift*, **HAND OFF** to **Staff Eng** to re-validate envelope.
  *   **Note:** This is a **Fact** step. Do not assign blame; assign the category.

  ---

  ### Part 3: The Metric Charter Template

  *(Copy this into a document. One page max.)*

  | **Metric Name** | **Governed Decision** |
  | :--- | :--- |
  | *[e.g., Deployment Frequency]* | *[e.g., Migration Launch Gate]* |
  | **Owner** | **Review Date** |
  | *[Name]* | *[Date]* |
  | **1. Validated Envelope** | **Status:** [ ] Inside [ ] Outside [ ] Unknown |
  | *Range:* [Min] to [Max] | *If Outside/Unknown, Governance is VOID.* |
  | **2. Indifferent Optimizer Risk** | **Mitigation:** |
  | *Cheapest Game:* [Describe] | [ ] Accepted by Director [ ] Mitigated by [Control] |
  | **3. Blindness Profile** | **Sign-off:** |
  | *Major Blind Spot:* [Describe] | *[Director Name] accepts risk of [Blind Spot]* |
  | **4. Second Channel** | **Divergence Threshold:** |
  | *Signal:* [Name] | *If > [X]% divergence, trigger review.* |
  | **5. Kill Condition** | **Half-Life Estimate:** |
  | *Revoke if:* [Condition] | *[X] Quarters* |
  | **6. Failure Class (Review Only)** | **Action:** |
  | *If triggered:* [Drift/Game/Extrapolation] | [ ] Revoke [ ] Re-validate [ ] Ignore |

  ---

  ### Part 4: Application to Cases

  #### Case (a): Deployment Frequency & Change-Failure-Rate (Migration Gate)
  *   **Context:** A gate deciding if a large service migration can proceed.
  *   **Step 1 (Envelope):** *Analysis:* Your historical data likely comes from steady-state services. A migration is a transient, high-churn state.
      *   *Artifact:* Plot showing correlation holds for stable services, but data is empty for "migration" states.
      *   *Result:* **STOP.** The current values (migration churn) lie outside the validated envelope (steady state). You cannot use steady-state reliability metrics to gate a migration without re-validation.
      *   *Handoff:* Hand off to Director. "We cannot use this gate automatically. We require a manual reliability sign-off for the migration window."
  *   **Step 2 (Optimizer):** *Analysis:* To pass the gate, a team could split a migration into tiny, trivial migrations to boost frequency and lower failure rate per migration.
      *   *Artifact:* Ticket showing a migration plan split into 20 micro-migrations with no user value.
      *   *Result:* **STOP** (unless mitigation exists).

  #### Case (b): Bug Counts (Promotion Packets)
  *   **Context:** Open P1s or Bugs Closed/Sprint used for promotions. Goal: Code Quality.
  *   **Step 1 (Envelope):** *Analysis:* Has it been verified that closing 10 bugs equals higher quality than closing 1?
      *   *Artifact:* None. Usually, this is assumed.
      *   *Result:* **STOP.** No validated envelope exists linking "bugs closed" to "long-term system quality."
  *   **Step 2 (Optimizer):** *Analysis:* What would an indifferent optimizer do?
      *   *Artifact:* List of actions: "Close bug as 'Working as Designed'", "Split one bug into three sub-tasks to count as three closes", "Avoid touching legacy code to avoid creating new bugs."
      *   *Result:* **STOP.** The cost to game (relabeling a ticket) is near zero. The cost to improve quality (refactoring) is high.
  *   **Step 3 (Blindness):** *Analysis:* What is the blind spot?
      *   *Artifact:* "Blind to architectural debt that does not manifest as tracker tickets."
      *   *Result:* **Handoff to Director.** "If you use this for promotion, you are incentivizing ticket hygiene, not code quality. I will record this blindness in the charter, but you must sign it."
  *   **Conclusion:** This metric should not govern promotions. It fails Step 1 and Step 2.

  #### Case (c): Composite "Developer Productivity Index" (Leadership Dashboard)
  *   **Context:** Leadership loves this number. You suspect it is meaningless.
  *   **Step 1 (Envelope):** *Analysis:* A composite index aggregates heterogeneous units (commits, reviews, uptime).
      *   *Artifact:* Request for the validation study showing that a 10% increase in Index correlates to 10% increase in Business Value.
      *   *Result:* **STOP.** There is no validated envelope for composite indices of this nature. The correlation is assumed, not measured.
  *   **Step 3 (Blindness):** *Analysis:* What is the blind spot?
      *   *Artifact:* "Blind to the difficulty of the work. Writing a complex feature and fixing a typo may yield the same index score."
      *   *Result:* **Handoff to Director.**
  *   **Step 4 (Second Channel):** *Analysis:* Is there an independent signal?
      *   *Artifact:* Usually, all inputs come from the same Dev Platform logs.
      *   *Result:* **HAND OFF.** No independent channel exists.
  *   **Conclusion:** The procedure dictates this metric cannot govern.
  *   **The Script for the Director:**
      > "I ran the governance procedure on the Productivity Index. It fails the Validated Envelope check: we have no data proving that moving this index moves business value, and it fails the Second Channel check: it relies on a single data source. If we tie OKRs to this, we are optimizing for the index, not productivity. I recommend we downgrade this to a 'Observational Only' metric until we can validate the correlation. I have drafted the charter to reflect this limitation for your signature."

  ---

  ### Part 5: Limitations of This Procedure

  This procedure is a tool, not a law of physics. It will misfire in the following situations:

  1.  **Greenfield Systems:** You cannot produce a Validated Envelope for a system that has never existed. In these cases, the procedure will always return "STOP." You must explicitly override this by marking the metric as **Experimental** in the charter, with a shortened Review Date (e.g., 1 month instead of 1 quarter).
  2.  **Contested Goals:** If the organization does not agree on what "Code Quality" is, the Blindness Profile step becomes a political weapon. The procedure treats goals as inputs; it cannot resolve disputes about the goals themselves.
  3.  **Slow Drift:** The Failure Classification step relies on observable divergence. If the correlation decays by 1% per quarter, the Second Channel may not trigger the divergence threshold before significant damage is done. The procedure requires a hard Review Date to catch this, but human attention may lapse.
  4.  **Unbounded Blindness:** In Step 3, you are asked to name the *single most important* blind spot. In complex socio-technical systems, the most important blind spot may be unknown (the "unknown unknown"). The procedure forces you to name a known unknown, which creates a false sense of security.
  5.  **Value Judgments Disguised as Facts:** Steps 2 and 3 look rigorous, but accepting a "Gaming Risk" or a "Blind Spot" is a value judgment. The procedure marks these for Director sign-off, but a Director may sign without understanding the technical implication. The procedure protects *you* from building the wrong thing; it does not protect the *company* from approving the wrong charter.

  **Final Note:** The procedure's primary output is not a number. It is a **record of accountability**. When a metric fails, the Charter tells you whether the failure was unpredictable (Drift) or negligent (ignored Blindness/Envelope). That is the work it does.
