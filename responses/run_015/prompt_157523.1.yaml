answer: |-
  Here is a complete, runnable design for your session. It is engineered to fit your constraints, budget, and specific learning outcomes, with explicit scripts to prevent improvisation drift.

  ### Part 1: Pre-Session Preparation

  **1. The "Echo" Survey (Send 2 days prior)**
  Create a simple Google Form or internal survey. Tell them it's for "team grouping."
  *   **Questions:**
      1.  You find $1000 on the ground. Keep all / Split with finder / Turn in.
      2.  Sealed bid auction for a $50 item. Your bid: $__.
      3.  Probability it rains next Saturday (0-100%).
      4.  Preferred code review style: Nitpick every line / High level only.
      5.  Favorite language (free text).
  *   **Backend Work:**
      *   Export responses to CSV.
      *   Normalize numerical answers (0-1). Encode categorical answers.
      *   Compute pairwise Euclidean distance.
      *   **Pairing:** Match participants into pairs (minimizing distance). If N is odd, create one triplet (or you join as a player).
      *   **Script:** Write a simple Go/Python script to run the game logic. It needs to:
          *   Accept inputs (SEND / HOLD).
          *   Apply the "Echo" logic based on the round's $c$ value.
          *   Count total SENDs.
          *   Display results on a projector.
      *   **Open Source:** Put this script in a public repo and share the link at the start of the session. This pre-empts "rigged game" accusations.

  **2. The Money**
  *   Bring $200 cash in an envelope.
  *   **Payout Structure:**
      *   Round 1 Pot: $40
      *   Round 2 Pot: $60
      *   Round 3 Pot: $100
      *   **Rule:** If a round is not won (0 or >1 sends), that specific pot goes into a "Team Beer/Charity Fund" (decided at end). *Do not say the Round 3 pot is unwinnable.* Let them discover it.

  **3. Handling the Spoilers (The Two Regulars)**
  *   **Action:** Email them 24 hours before.
  *   **Script:** *"I know you've read Hofstadter. I need your help. Do not mention Platonia, superrationality, or randomization strategies during the game. If you speak up, you ruin the data for everyone else. I need you to play 'straight' so the others can feel the problem. Can I count on you to audit the rules instead of solving the puzzle?"*
  *   **If they speak up anyway:** See "Failure Modes" below.

  ---

  ### Part 2: The Session Script (75 Minutes)

  **00:00 – 00:10 | Setup & Rules**
  *(Stand at the front. Project the code repo link. Place the cash envelope on the table.)*

  **Read Aloud:**
  "Welcome. Today we are running a distributed systems problem where the nodes are you. There are three rounds. In each round, there is a cash pot.
  Here is the rule for winning a pot: **Exactly one person** in this room must submit 'SEND'.
  If zero people send, nobody wins.
  If two or more people send, nobody wins.
  If exactly one person sends, that person takes the pot.

  You cannot talk. You cannot signal. You cannot make side deals. If I hear coordination, I cancel the round.
  You will submit your choice via this form on your laptop.
  Before we start, I need to disclose a mechanic. Based on your survey responses, you have been paired with an 'Echo' in this room. In some rounds, the system will enforce correlation between you and your Echo. You don't know who your Echo is. You don't know if the correlation is active until you see the results.
  The code processing this is open source on the screen. It is deterministic.
  Any questions on the rules? No talking questions, please."

  **00:10 – 00:20 | Round 1 (Correlation $c = 0$)**
  **Read Aloud:**
  "Round One. Pot is forty dollars. Correlation is zero. Your submission is your own. You have 2 minutes to decide. Submit now."
  *(Run script. Display results: Total Sends, Winner or 'No Winner'.)*
  **Read Aloud:**
  "Round One complete. [Announce Result]. If we had a winner, claim your $40. If not, that money moves to the backup fund."

  **00:20 – 00:30 | Round 2 (Correlation $c = 0.5$)**
  **Read Aloud:**
  "Round Two. Pot is sixty dollars. Correlation is now point-five.
  For every pair, there is a fifty percent chance the system will force your Echo's submission to match yours. There is a fifty percent chance you remain independent.
  You do not know if you are coupled this round. You only know the probability.
  Submit now."
  *(Run script. Display results.)*
  **Read Aloud:**
  "Round Two complete. [Announce Result]. Note the number of sends compared to Round One."

  **00:30 – 00:40 | Round 3 (Correlation $c = 1.0$)**
  **Read Aloud:**
  "Round Three. Pot is one hundred dollars. Correlation is now one-point-zero.
  Your Echo's submission is now a copy of yours. If you send, they send. If you hold, they hold.
  This is the final round. Submit now."
  *(Run script. Display results. It should be impossible to win if pairing is disjoint.)*
  **Read Aloud:**
  "Round Three complete. [Announce Result]. As you can see, the pot was not won. That $100 goes to the team fund."

  **00:40 – 01:15 | The Debrief**
  *(Sit down. Move away from the projector. This is a conversation, not a lecture.)*

  **Phase 1: The Feeling of Round 3 (Outcome 4)**
  **Say:** "Look at Round Three. The pot was larger, but the win rate dropped to zero. Why?"
  *(Wait for answer: "Because we matched.")*
  **Say:** "Right. At perfect correlation, if I choose 'Send', my Echo chooses 'Send'. That's two sends. I lose. If I choose 'Hold', my Echo chooses 'Hold'. That's zero sends. I lose.
  **Claim:** This demonstrates that at perfect correlation, the prize is literally unwinnable. Restraint doesn't help. Greed doesn't help. The lock is mechanical."

  **Phase 2: The Pull of Randomization (Outcome 2)**
  **Say:** "Now look at Round One. Some of you sent. Some held. Why did you send?"
  *(Someone will say: "To win the money.")*
  **Say:** "The greedy argument. If I don't send, I definitely get zero. If I send, I *might* get $40.
  But look at the result. [Point to total sends]. We had [X] sends. If X was greater than 1, the greedy argument destroyed the value for everyone.
  If we all reason 'I should send', we all send, and we all get nothing.
  So, is there a move that isn't 'Send' and isn't 'Hold'?"
  *(Wait. If silence, prompt:)* "Is there a way to be in the room without forcing a collision?"
  *(Hopefully someone suggests: "Flip a coin.")*
  **Say:** "Exactly. Randomization. If we all agree to send with probability $P$, we can tune $P$ to maximize the chance of exactly one send. With 16 people, that's $1/16$.
  **Claim:** Randomized claiming is the only alternative to universal collision. You constructed that just now by feeling the failure of the deterministic strategies."

  **Phase 3: Correlation vs. Altruism (Outcome 3)**
  **Say:** "In Round Two, correlation was 50%. Did anyone feel more hesitant to send than in Round One?"
  *(Wait for nods.)*
  **Say:** "Why? Your Echo wasn't *you*. It was just a person with similar survey answers. You don't know them. You don't care about them.
  **Claim:** The hesitation didn't come from altruism. It came from the statistical likelihood that your decision was *evidence* of their decision. In Round Three, it wasn't evidence; it was causality. In the original philosophical problem, it's neither—it's logical identity. But the feeling in your gut? That's the same feeling."

  **Phase 4: Abstention is Incoherent (Outcome 1)**
  **Say:** "One last thing. Someone might say, 'The solution is we all just agree to Hold.'
  But look at the rules. If everyone Holds, zero sends. Nobody wins.
  Universal restraint is worth exactly as much as universal greed: zero.
  **Claim:** Abstention is not a solution. It is just another form of collision."

  ---

  ### Part 3: Handling Variables & Failure Modes

  **1. The "Fourth Round" Question**
  *   **Your Question:** Should I run a fourth round with a public random draw (licensing one person)?
  *   **My Advice:** **No.** Do not play it.
  *   **Reason:** If you run it, you solve the puzzle for them. The learning outcome is *feeling the tension* of the dilemma, not seeing the solution administered.
  *   **Alternative:** In the debrief, *describe* the fourth round. "Imagine if I had a random number generator, picked one of you, and told only them they were allowed to send. That solves it. But you don't have that generator. You only have your own brain."

  **2. If Only 9 People Show Up**
  *   **Pairing:** You will have 4 pairs and 1 singleton.
  *   **Fix:** You (the facilitator) must play. Join the singleton to make a pair.
  *   **Logic Adjustment:** The optimal probability changes from $1/16$ to $1/9$. Mention this in the debrief. "The math scales. With fewer nodes, the probability of sending should have been higher."
  *   **Round 3 Risk:** With 9 people, if you play, and you are paired, $c=1$ still guarantees a loss for that pair. The lesson holds.
  *   **If N < 8:** Cancel the session. The statistical noise is too high to feel the correlation effect.

  **3. The "Causal Decision Theory" Objection**
  *   **The Objection:** "In Round 3, my choice didn't *cause* my Echo's choice. The script did. In the real Platonia dilemma, my choice doesn't cause theirs either. So why should I randomize?"
  *   **The Honest Answer:** You must admit this limitation.
  *   **Say:** "This is the hardest part. In this game, the correlation was mechanical. I forced it. In the philosophical dilemma, the correlation is *logical*. The argument is that if we are both perfectly rational, we are running the same 'source code'. If I decide 'Send', I have computed that 'Send' is the answer. If you are rational, you computed the same answer. So you send too.
  This game simulates that with a script. It cannot prove logical correlation exists. It only shows you what happens *if* it does. It turns a metaphysical worry into a mechanical constraint so you can feel the weight of it."

  **4. Failure Mode: Spontaneous Coordination**
  *   **Scenario:** Someone says "I'll hold if you hold."
  *   **Impact:** Fatal to Round 1.
  *   **Fix:** "Stop. That violates the 'No Communication' constraint. That round is void. No payout. We restart." (Be strict. This protects the integrity of the dilemma).

  **5. Failure Mode: The Contrarian**
  *   **Scenario:** Someone sends every time just to break it.
  *   **Impact:** Ruins data, but good for debrief.
  *   **Fix:** Do not stop them. In debrief, say: "This is the 'Defector' strategy. It works in Round 1 if everyone else is noble. It fails in Round 3 because the system forces a match. The Defector beats the Cooperator, but loses to the System."

  **6. Failure Mode: Accusations of Cheating**
  *   **Scenario:** "You rigged Round 3 so no one could win."
