  **7. Failure Mode: "This is a Psychology Experiment"**
  *   **Scenario:** Someone feels manipulated.
  *   **Fix:** Acknowledge it. "It is. But not on your psyche. On our coordination mechanisms. We are testing how engineers behave under constrained information."

