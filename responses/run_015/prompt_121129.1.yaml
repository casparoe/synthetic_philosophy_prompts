answer: |-
  **PHD COMPREHENSIVE EXAMINATION: POLITICAL PHILOSOPHY**
  **PAPER: CONTEMPORARY THEORIES OF JUSTICE**
  **TIME ALLOWED: 90 MINUTES**
  **TOTAL MARKS: 20**

  **INSTRUCTIONS TO CANDIDATES**
  Answer the following question. You are not required to provide citations or a bibliography. Marks are awarded for conceptual precision, argumentative rigour, and the ability to anticipate counter-arguments. Write in clear, professional British English.

  **QUESTION**

  Luck egalitarianism proceeds from the fundamental intuition that it is unjust for individuals to be worse off than others due to circumstances beyond their control, but not unjust if they are worse off due to choices for which they can reasonably be held responsible. This normative framework relies heavily upon the distinction between 'brute luck' (unchosen endowments and circumstances) and 'option luck' (the outcome of deliberate gambles or calculated risks). Traditionally, this distinction has been employed to justify redistributive taxation or social insurance: society compensates for brute bad luck (such as congenital illness) while allowing individuals to bear the costs of option bad luck (such as injuries sustained during risky hobbies).

  However, contemporary advancements in biometric monitoring and data analytics present a novel challenge to this dichotomy. Consider a hypothetical healthcare system where insurance premiums are not set via community rating, but are dynamically adjusted using algorithmic analysis of behavioural data. Specifically, the algorithm utilises two primary variables: first, longitudinal sleep patterns measured via wearable devices; and second, social network density derived from digital communication metadata.

  The insurance provider argues that these variables are predictive of health outcomes and reflect lifestyle choices. Irregular sleep is framed as a failure of self-discipline or poor time management; low social network density is framed as a choice to isolate oneself despite available opportunities for connection. Consequently, individuals with poor sleep metrics or sparse digital networks face significantly higher premiums. The provider contends this is a pure instance of option luck: individuals control their habits and social engagements, and thus should bear the financial consequences of those choices.

  Critics, however, argue that this classification is philosophically naive. Sleep patterns are heavily influenced by constitutive factors such as neurochemistry, undiagnosed disorders, or environmental noise pollution—factors squarely within the realm of brute luck. Similarly, social network density may be determined by social anxiety, neurodivergence, or structural economic constraints that limit leisure time, rather than a voluntary preference for isolation. In this hybrid case, the data points are overdetermined; they are the product of an inextricable mix of choice and circumstance.

  This creates a dilemma for the luck egalitarian. If they argue that penalising these metrics is unjust because the 'choice' component is contaminated by 'circumstance', they face the 'Collapse Objection'. This objection posits that if every putative choice is scrutinised for its causal history until it dissolves into brute luck (genetics, upbringing, environment), then the category of option luck effectively vanishes. If nothing is truly chosen, then all inequalities are unjust. If all inequalities are unjust, then luck egalitarianism collapses into a strict egalitarianism that forbids market-based differentiation entirely. This would imply that no risk-based pricing is ever permissible, even in cases of clear recklessness, thereby rendering the theory incompatible with any form of market mechanism that rewards or penalises behaviour.

  Your task is to evaluate whether a sophisticated luck egalitarian can condemn the use of these behavioural premiums as unjust without accepting the Collapse Objection. You must address whether the distinction between brute and option luck can be maintained in the face of granular behavioural data, or whether the use of such data necessitates a revision of the theory itself.

  Specifically, you should consider:
  1.  Whether the 'control' condition for responsibility can be satisfied when the data is causally hybrid.
  2.  Whether the epistemic burden lies with the individual to prove circumstance or the insurer to prove choice.
  3.  Whether rejecting these premiums necessarily entails rejecting market mechanisms altogether, or if a middle ground exists (e.g., ex-post compensation, threshold views, or insurability constraints).

  Do not merely summarise the standard views of Dworkin or Cohen. Instead, construct a novel argument that resolves the tension between holding individuals responsible for health behaviours and protecting them from the moral arbitrariness of their biological and social constitutions. Your answer should demonstrate whether luck egalitarianism remains a viable framework for regulating algorithmic insurance markets.

  ***

  **MODEL ANSWER**

  A sophisticated luck egalitarian can condemn the use of behavioural premiums without collapsing into a broad anti-market stance, but only by refining the conception of responsibility and shifting the burden of proof regarding the brute/option distinction. The core challenge lies in the causal hybridity of the data: sleep and social density are neither purely chosen nor purely circumstantial.

  To maintain the distinction, the luck egalitarian must reject the insurer's assumption that predictability equals responsibility. Just because a variable predicts risk does not mean it reflects a voluntary gamble. The first conceptual move is to assert that for option luck to apply, the agent must have had a reasonable opportunity to avoid the risk. In the case of sleep patterns, if the biological cost of regulating sleep is significantly higher for some due to neurochemistry, the 'choice' to sleep poorly is not equivalent to the choice of a neurotypical person to stay up late. Penalising them equally treats unequal circumstances as equal choices. Therefore, the distinction does not collapse if we recognise that the *capacity* to choose is itself distributed by brute luck.

  However, acknowledging this invites the Collapse Objection: if capacity is uneven, is any choice truly free? To avoid this, the luck egalitarian must adopt a 'threshold' view of responsibility rather than a metaphysical one. We do not need to prove that a choice was uncaused by genetics to hold it responsible; we only need to prove that the agent possessed sufficient normative control to be expected to comply with a standard. If the insurer cannot demonstrate that the individual crossed a threshold of reasonable avoidability, the default position must be brute luck. This prevents the collapse because it allows for market penalties where the threshold is clearly met (e.g., smoking despite full knowledge and capacity), while forbidding them where the threshold is ambiguous (e.g., sleep data).

  This leads to the epistemic burden. In a market setting, insurers hold the data advantage. If the burden is on the individual to prove their insomnia is biological, justice is compromised because medical diagnosis is costly and imperfect. A luck egalitarian framework must insist that the burden of proof lies with the mechanism imposing the penalty. The insurer must demonstrate that the premium adjustment tracks choice, not circumstance. Since behavioural data is inherently noisy regarding intent, the insurer cannot meet this burden. Thus, rejecting these premiums is not a rejection of markets per se, but a rejection of *unjustified* market distinctions.

  Finally, does this forbid all risk-based pricing? No. It suggests a shift from ex-ante pricing to ex-post compensation, or a system of 'insurability'. We can allow market mechanisms to operate where choices are clear, but mandate a social pool for risks that are causally opaque. This preserves the market for clear option luck while protecting against brute luck disguised as choice. Therefore, the theory survives not by denying the mix of luck and choice, but by regulating the evidentiary standards required to classify a disadvantage as one or the other. The collapse is avoided because we are not saying all choices are illusions; we are saying that without clear evidence of voluntary assumption of risk, the presumption of justice favours compensation.

  ***

  **MARKING SCHEME**

  **Total Marks: 20 (4 marks per point)**

  | **Marking Point** | **Criteria for Full Marks** | **Typical Candidate Error** |
  | :--- | :--- | :--- |
  | **1. Application of the Distinction** | Correctly identifies sleep/social data as 'hybrid' cases where brute and option luck are entangled, refusing to accept the insurer's binary classification. | Treating the data as purely voluntary choice or purely biological determinism without acknowledging the overlap. |
  | **2. The Control Condition** | Argues that responsibility requires not just action, but the *capacity* to act otherwise, noting that this capacity is unevenly distributed by brute luck. | Equating 'doing' something with 'choosing' something, ignoring constitutive constraints on agency. |
  | **3. Addressing the Collapse Objection** | Explicitly engages with the fear that scrutinising choices eliminates option luck entirely, and offers a reason why the distinction survives (e.g., thresholds). | Ignoring the Collapse Objection or conceding that luck egalitarianism inevitably leads to strict egalitarianism. |
  | **4. Epistemic Burden** | Identifies that the justice of the scheme depends on who bears the burden of proof regarding the origin of the risk (insurer vs. individual). | Focusing only on the metaphysics of luck without considering the practical informational asymmetry between parties. |
  | **5. Normative Resolution** | Proposes a viable modification (e.g., defaulting to brute luck in ambiguous cases, ex-post compensation) that preserves market mechanisms without injustice. | Concluding that the only solution is to abolish insurance markets or healthcare premiums entirely. |
