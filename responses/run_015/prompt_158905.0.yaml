answer: |-
  ### 1. The Research Agenda: Questions and Ordering

  For a six person-year program, I recommend commissioning four distinct projects (approx. 1.5 PY each), leaving the remainder for synthesis and dissemination. The ordering is strictly hierarchical: later projects presuppose the conceptual machinery built in earlier ones.

  **Q1: The Metric of Encroachment (The Structural Question)**
  *   **Task:** Formalize the "stakes variable." Determine whether encroachment functions via expected utility, risk-weighted utility, min-max (worst-case) constraints, or asymmetric error costs.
  *   **Ordering Defense:** This is logically upstream of everything. You cannot determine *whose* stakes matter (Q2) or *when* they matter (Q3/Q4) until you define what counts as a stake. The literature currently treats "stakes" as a scalar intuition; this project must replace that with a function $S(p, error\_costs) \rightarrow threshold$.
  *   **Tractability:** High. Formal epistemology and decision theory provide the tools (e.g., Risk-Weighted Expected Utility). The challenge is mapping epistemic norms to these structures, not building the structures themselves.
  *   **Neglect:** Severe. Most debates assume a single threshold shifts. Asymmetric cases (false positive cheap/false negative catastrophic) are rarely modeled, yet they dominate the real-world cases (medicine, law).
  *   **Payoff:** Essential for automated systems. If we build AI that defers to human judgment based on "knowledge," we need to know if the system should calculate expected error or worst-case error.

  **Q2: The Bearer of Stakes (The Role-Stakes Question)**
  *   **Task:** Determine whether the relevant stakes are those of the attributor, the subject-as-individual, or the subject-as-role-occupant.
  *   **Ordering Defense:** Upstream of Adversarial stakes. If stakes attach to the *role* (institutional status) rather than the *psychological subject*, then Adversarial stakes (Q3) might be irrelevant if the role's liability is fixed regardless of threats. This defines the "Subject" in Subject-Sensitive Invariantism.
  *   **Tractability:** Moderate. Requires conceptual analysis of "agency" and "institutional sign-off." Less amenable to formalization than Q1.
  *   **Neglect:** High. Literature focuses on the "bank customer" (individual). The "pharmacy technician" (role) is under-theorized despite being the primary site of professional epistemology.
  *   **Payoff:** Legal and Professional Ethics. Determines liability in negligence cases: did the technician *know* the drug was wrong, or did the *role* require a higher standard than knowledge?

  **Q3: Epistemic Security and Manipulation (The Adversarial-Stakes Question)**
  *   **Task:** Test the stability of knowledge under external stake-manipulation. Can a hostile agent destroy a subject's knowledge by raising the cost of error without altering evidence?
  *   **Ordering Defense:** This is the stress test. It presupposes Q1 (what counts as a cost?) and Q2 (whose cost counts?). If the view survives Q1 and Q2 but fails here, it is practically unusable.
  *   **Tractability:** Moderate. Relies on thought-experiment refinement and modal analysis (safety/sensitivity).
  *   **Neglect:** Moderate. "Pragmatic defeat" is discussed, but weaponized stakes are not.
  *   **Payoff:** Security and Cryptography. If knowledge is vulnerable to stake-manipulation, protocols relying on "human knowledge" as a security layer are fundamentally flawed.

  **Q4: The Normative Consequence (Institutional & Legal Uptake)**
  *   **Task:** Map the results of Q1–Q3 onto existing legal standards ("reasonable belief," "beyond reasonable doubt," "due diligence").
  *   **Ordering Defense:** Downstream. You cannot advise the law on whether to adopt stake-sensitivity until you know what stake-sensitivity *is* (Q1), *who* it binds (Q2), and if it is stable (Q3).
  *   **Tractability:** High. Comparative analysis of legal doctrine vs. epistemic theory.
  *   **Neglect:** High. Epistemologists write about law analogically; lawyers do not read epistemology. A dedicated bridge project is needed.
  *   **Payoff:** Direct policy impact. Tort law, medical consent, and compliance regimes.

  ---

  ### 2. Trade-Offs and Criteria

  **Importance vs. Tractability:**
  I let **Tractability** win on Q1 (Structure) and **Importance** win on Q2 (Role).
  *   *Reasoning:* The "Structure" question is the bottleneck. If we cannot formalize the stakes variable, the rest of the program is hand-waving. It is highly tractable using existing decision-theoretic tools, so we secure that win early. The "Role" question is philosophically messier (metaphysics of institutions) but is the most important for real-world application. We accept the lower tractability because the payoff (legal/professional norms) justifies the risk.

  **Novelty vs. Continuity:**
  I let **Continuity** win.
  *   *Reasoning:* The program should not attempt to reinvent epistemology. It should take the existing encroachment/contextualist framework and stress-test it against the three case-types. Radical novelty risks producing a theory that no longer recognizes "knowledge" as the target. The goal is refinement, not revolution.

  **Theoretical Purity vs. External Payoff:**
  I let **External Payoff** win on Q4.
  *   *Reasoning:* Purely theoretical disputes about stake-sensitivity have stalled. Anchoring the theory in legal and institutional constraints forces precision. If a theory of knowledge cannot handle the pharmacy technician case, it is theoretically deficient, not just practically useless.

  ---

  ### 3. Declinations: What Not to Fund

  **The Semantics-vs-Pragmatics Debate:**
  I decline to fund a standalone project on whether 'knows' is context-sensitive, interest-relative, or pragmatically modulated.
  *   **Reason:** This is a **sink**. After twenty years, the debate has reached a reflective equilibrium where both sides can accommodate the data by adjusting auxiliary hypotheses (e.g., contextualists add "unmentioned error possibilities," encroachers add "practical sufficiency").
  *   **Impact:** Settling this does not change the output of Q1–Q4. Whether the shift in "knows" is semantic or pragmatic, the *normative constraint* on action remains the same. A pharmacy technician is liable regardless of whether her lack of knowledge is due to semantic shift or pragmatic encroachment. We should treat the semantic label as a placeholder for the underlying normative relation.

  **Standard Bank/Travel Cases:**
  I decline to fund further refinement of the original High/Low Stakes bank cases.
  *   **Reason:** Diminishing returns. The intuitions are polarized and stable. New variants will not move the needle. The program must move to the "nagging cases" (Role, Adversarial) which break the standard models.

  **Experimental Epistemology:**
  (Per your constraint, but worth noting).
  *   **Reason:** Folk intuitions about "knows" in high-stakes scenarios are noisy and culturally variable. Relying on them to settle Q1 (Structure) is methodologically unsound. We need normative justification, not descriptive psychology.

  ---

  ### 4. Discriminatory Power of the Case-Types

  **Role-Stakes: The Strongest Discriminator.**
  *   **Why:** This case genuinely separates Contextualism from Encroachment.
      *   *Contextualism:* Easily handles this. The *attributor's* context (the court, the hospital board) sets the standard. The technician's ignorance of the protocol is irrelevant; the context of assessment demands high standards.
      *   *Encroachment (SSI/IRI):* Struggles. If stakes are the *subject's*, does the technician have high stakes if she is ignorant of the liability? If yes, knowledge becomes external to her mind in a way that threatens internalist constraints. If no, encroachment fails to capture the institutional reality.
  *   **Verdict:** Keep. This is the fulcrum for updating Subject-Sensitive Invariantism.

  **Adversarial-Stakes: The Strongest Stress Test.**
  *   **Why:** This tests the *stability* condition of knowledge.
      *   *Contextualism:* Handles this by saying the threat changes the conversational context.
      *   *Encroachment:* Faces a reductio. If my enemy can destroy my knowledge by threatening me, knowledge is too fragile to be a norm of action. Encroachers must posit a "reasonable stakes" constraint, which begins to look like contextualism.
  *   **Verdict:** Keep. It forces the view to define the limits of stake-sensitivity.

  **Proleptic-Stakes: The Weakest Link (Drop).**
  *   **Why:** This is a new instance of an old pattern (Diachronic Rationality).
      *   *Analysis:* The claim that future stakes affect present knowledge is structurally identical to claiming future evidence affects present justification. Both violate the "Time-Slice" principle.
      *   *Discriminatory Power:* Low. Both Contextualists and Encroachers can handle this by appealing to the *current* expectation of future stakes. If the subject cannot foresee the stakes, there is no encroachment. If they can, it's just standard high stakes.
      *   **Verdict:** **Drop from the program.** It adds temporal complexity without generating a unique divergence between the rival theories. It collapses into standard questions about planning and diachronic coherence, which are better handled in decision theory than epistemology.

  ---

  ### 5. Where the Dispute Bottoms Out

  The dispute bottoms out on a **substantive disagreement about the function of the concept 'knows'.**

  *   **The Fork:**
      1.  **Knowledge as a Grading of Doxastic State:** 'Knows' tracks the fit between mind and world (accuracy, safety, sensitivity). Stakes are irrelevant to this fit. (Traditional Invariantism).
      2.  **Knowledge as a License to Act:** 'Knows' tracks the sufficiency of a belief to warrant action. Stakes are constitutive of this sufficiency. (Encroachment).

  *   **Is it Verbal?** No. It is not merely verbal because the two functions generate different normative outputs in the Role and Adversarial cases. If 'knows' is a license, the technician *does not know* (license revoked by role-liability). If 'knows' is a grade, she *does know* (belief is safe), but *should not act* without further check.
  *   **Worth a Project?** **No.** This question gets answered retrospectively. Once Q1–Q4 establish which model yields a coherent normative system for institutions and agents, the "function" will be determined by the successful model. Funding a project to argue about the function *a priori* is premature. Let the structural work force the conclusion.

  ---

  ### 6. Future Evidence and Priority Shifts

  **Move Q1 (Structure) Down / Q2 (Role) Up if:**
  *   **Evidence:** A formal triviality result. If a decision theorist proves that any stake-sensitive threshold function collapses into either standard probabilistic thresholding or radical skepticism under asymmetric costs.
  *   **Shift:** If the metric is mathematically incoherent, the structural question is dead. We pivot immediately to Q2 (Role) to salvage a non-formal, institutional account of encroachment.

  **Move Q3 (Adversarial) Up if:**
  *   **Evidence:** A shift in neighboring fields (Cybersecurity/AI Safety). If automated verification systems begin to fail due to "adversarial input" that mimics stake-raising (e.g., poisoning data to increase the cost of false positives).
  *   **Shift:** This makes the Adversarial case an urgent engineering problem, not just a philosophical puzzle. It demands immediate attention over legal mapping (Q4).

  **Move Q4 (Normative) Down if:**
  *   **Evidence:** Legal rejection. If major courts explicitly reject "reasonable belief" standards that vary with stakes (e.g., ruling that negligence is purely evidence-based).
  *   **Shift:** If the law refuses to incorporate stake-sensitivity, the external payoff vanishes. The program becomes purely theoretical, and resources should shift to Q3 (Security/Stability) where the stakes are logical rather than institutional.

  **Move Semantics Back In if:**
  *   **Evidence:** A linguistic shift. If corpus data (despite the no-empirical rule, suppose a major study emerges) shows 'knows' is never used in high-stakes professional contexts without explicit modal qualifiers ("reasonably certain," "verified").
  *   **Shift:** This suggests the semantic content of 'knows' is invariant, and the variation is handled by other vocabulary. This would vindicate Invariantism and force the program to reframe encroachment as a theory of *justification* or *warrant*, not knowledge.
