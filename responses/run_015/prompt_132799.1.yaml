answer: |-
  Consider a hospital ethics committee convened to adjudicate the allocation of a single dose of scarce antitoxin within a regional trust. Five patients face fatal exposure, while one solitary patient holds prior claim under standard triage protocol. The committee comprises seven senior clinicians, each possessing a partial veto; authorisation requires unanimous consent, yet the actual administration is performed by a junior nurse acting on the written directive, not the committee members themselves. No single member physically withholds the drug from the solitary patient, nor do they administer it to the five; they merely sign the form that alters the flow of care. The harm is authorised collectively but executed by no single hand, diffusing the causal link between decision and death.

  The agent-centred restriction bites ambiguously here. If the committee is treated as a singular moral agent, it arguably bears the same restriction as an individual surgeon not to harm the one, yet the lack of a physical hand muddies the water. However, regarding a rogue surgeon, the committee would likely hold an agent-neutral reason to stop him; deontology generally permits (or requires) preventing others from violating rights even if you cannot violate them yourself. The feature doing the philosophical work is distributed agency—the fragmentation of causality across multiple veto-holders. If you collapse the committee back into a single decider, the paradox sharpens immediately: the individual cannot kill the one to save the five, full stop.

  A hardline deontologist would likely attack the case by denying that collectives bear agent-relative restrictions at all. They would argue that moral agency is strictly individual; therefore, the 'committee' has no duties, but each veto-holder does. On this view, every member is separately bound by the restriction not to vote for the diversion of the drug. To vote 'yes' is to make oneself complicit in a rights violation, regardless of whether the pen touches the patient. The veto power doesn't dilute responsibility; it individualises it, meaning any member who fails to veto becomes personally guilty of harming the one, even if the decision was collective.
