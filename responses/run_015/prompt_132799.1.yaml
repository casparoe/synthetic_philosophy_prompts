  Build me a thought experiment for the paradox of deontology, but inject a niche twist: the decision-maker isnt one person but a hospital ethics committee where every member holds a partial veto, so the harmful act—say, redirecting one life-saving drug away from a single patient towards five—gets authorised collectively but executed by no single hand. Keep it realistic, one paragraph, clinical not sci-fi. Then show me exactly where the agent-centred restriction bites: does the committee have the same agent-relative reason not to harm the one that an individual surgeon would? And does it also have an agent-neutral reason to stop a rogue surgeon from harming one to save five? Next, say which feature of the case is doing the philosphical work—probably the distributed agency—and what happens if you collapse the committee back into a single decider. Finish by scetching how a hardline deontologist would attack the case: do they deny collectives bear agent-relative restrictions, or claim each veto-holder bears it separately? Write it in British English please, and dont worry about being too polished—a typo here or there is fine.
