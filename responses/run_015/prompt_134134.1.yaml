  # JOINT STATEMENT ON THE COMBINATION PROBLEM
  **Signatories:** A Constitutive Micropsychist (CMP) and a Phenomenal-Boundary Emergentist (PBE)
  **Date:** October 24, 2023
  **Subject:** Adversarial Collaboration on Structural Mapping and Subjecthood

  ### 1. Agreed Claims

  After rigorous dialectical engagement, the undersigned parties affirm the following propositions as the common ground for our dispute regarding the combination problem within a panpsychist framework:

  1.  **Definition of the Problem:** The Combination Problem is not merely the question of how consciousness arises, but specifically the challenge of explicating the mapping relation between a base layer of micro-phenomenal properties and a target layer of macro-phenomenal properties, given a specific physical substrate.
  2.  **Structural Correspondence:** There must be an isomorphism (or strict homomorphism) between the causal structure of the physical organization and the structural relations of the phenomenal properties. We reject any model where the macro-phenomenal structure diverges arbitrarily from the underlying physical causal graph.
  3.  **Rejection of Brute Emergence:** We jointly reject the notion that macro-consciousness is a brute emergent fact with no structural explanation whatsoever. While we disagree on the *mechanism* of emergence/constitution, we agree that the appearance of a macro-subject must be grounded in the properties and relations of the micro-constituents, not ex nihilo.

  ### 2. Disagreements Table

  | Issue | Micropsychist Formulation | Emergentist Formulation | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Ontological Status of the Macro-Subject** | The macro-subject is ontologically constituted by micro-subjects; it is nothing over and above the micro-subjects acting in concert. | The macro-subject is a novel ontological entity generated when specific boundary conditions are met; it is distinct from the sum of micro-subjects. | Substantive |
  | **Fate of Micro-Subjects** | Micro-subjects retain their phenomenal identity within the macro-subject; they are not annihilated but subsumed. | Micro-subjects are phenomenally screened off or superseded; the formation of a macro-boundary precludes the simultaneous existence of independent micro-subjects within that boundary. | Substantive |
  | **Definition of "Combination"** | "Combination" refers to a mereological summation where parts retain identity within the whole. | "Combination" refers to a phase transition where parts lose individual phenomenal status to form a new unity. | Verbal |

  ### 3. The Cruxes

  To move beyond stalemate, we identify two specific sub-questions. Settling these would force a revision of at least one party's core model.

  **Crux 1: The Stacking Problem**
  *Question:* Can micro-subjects retain phenomenal identity inside a macro-subject without being merged or annihilated?
  *Concrete Case:* **The Causal Overlap Zone.** Consider a hypothetical system where Group A (micro-subjects) is causally integrated into System B (macro-subject), but Group A maintains internal causal closure sufficient for independent information processing while simultaneously contributing to System B's integration.
  *   **CMP Prediction:** Phenomenal stacking is possible. There exists a "view from within" for Group A and a distinct "view from within" for System B simultaneously. The micro-experience is not lost but becomes a constituent part of the macro-experience.
  *   **PBE Prediction:** Phenomenal exclusion holds. If System B achieves the threshold for subjecthood, Group A's independent phenomenal identity is extinguished or rendered latent. Only the macro-subject exists within that boundary; micro-subjects cannot coexist as active subjects within a unified macro-subject.

  **Crux 2: The Boundary-Integration Mechanism**
  *Question:* Is informational closure necessary and sufficient for a new phenomenal subject regardless of the micro-level continuity?
  *Concrete Case:* **Split-Brain Symmetry Breaking.** Consider a corpus callosum severance performed on a unified subject. We stipulate conditions of perfect informational symmetry-breaking where the physical separation is instantaneous, but the micro-constituents (neurons/atoms) retain their intrinsic properties and local causal powers without interruption.
  *   **CMP Prediction:** Subjecthood tracks the micro-constituents. Since the micro-experiences are continuous and merely rearranged, the分裂 (split) results in two subjects only because the micro-constituents are now causally decoupled. The identity of the subjects is grounded in the continuity of the micro-bases.
  *   **PBE Prediction:** Subjecthood tracks the informational boundary. The moment informational closure is broken, the original macro-subject ceases, and two new macro-subjects emerge. The continuity of the micro-constituents is irrelevant to the identity of the macro-subjects; the boundary condition is sufficient to generate new subjecthood regardless of micro-level persistence.

  ### 4. Conclusion on Verbal Disputes

  We identify a portion of our dispute as purely verbal, specifically concerning the definition of "subject" and "combination." The CMP uses "subject" to denote a locus of experience that can be mereologically composite, whereas the PBE uses "subject" to denote a locus of experience that must be phenomenally unified to the exclusion of internal parts. However, this terminological divergence does not dissolve the substantive disagreement. Even if we standardized our terminology, the ontological question remains: does the macro-experience *depend* on the continued existence of micro-experience (CMP), or does the macro-experience *replace* micro-experience upon reaching a structural threshold (PBE)? The verbal dispute masks but does not eliminate the substantive conflict regarding the persistence of micro-phenomenal identity within complex systems.

