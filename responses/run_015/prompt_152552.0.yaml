answer: |-
  # The Separateness Stress-Test
  **Time to complete:** 10–15 minutes  
  **Purpose:** To flag policy proposals or study designs that treat individuals as interchangeable units of utility ("batteries") rather than distinct persons with inviolable boundaries.  
  **Core Logic:** A proposal violates the *separateness of persons* if it imposes a **Targeted Sacrifice** that cannot be **Compensated-in-Principle**.

  ---

  ## Part 1: The Checklist

  ### Step 1: Identify the Losers (The Burden Map)
  *Who specifically pays the cost of this proposal?*
  *   **A.** A specific, identifiable group (e.g., residents of Town X, nurses in Ward Y, patients in Arm Z).
  *   **B.** The general population broadly, with no specific subgroup bearing a disproportionate share (e.g., a flat tax, a general mask mandate).

  > **IF B:** You are likely dealing with a **Diffuse Burden**.  
  > **→ GREEN LIGHT.** (Proceed to Step 4 only to check for systemic bias).
  >
  > **IF A:** You are dealing with a **Targeted Sacrifice**.  
  > **→ STOP.** Proceed to Step 2.

  ### Step 2: The "Means" Test
  *Is the harm to this group a side effect, or is it the engine of the solution?*
  *   **A.** **Instrumental:** The proposal *requires* this group to suffer to generate the benefit (e.g., their data is needed, their bodies are the barrier, their jobs must vanish to hit a target).
  *   **B.** **Incidental:** The group suffers, but the benefit would happen anyway; their suffering is just unfortunate collateral damage.

  > **IF A:** This is a **Targeted Sacrifice as a Means**. High risk of violation.  
  > **→ Proceed to Step 3.**
  >
  > **IF B:** This is **Collateral Damage**. Lower risk, but still requires compensation.  
  > **→ Proceed to Step 3.**

  ### Step 3: The Compensation-in-Principle Test
  *Ignore whether compensation is actually offered. Ask: Is the harm **type** something that can theoretically be made whole?*
  *   **A.** **Non-Compensable:** The harm involves death, permanent disability, irreversible loss of autonomy, or destruction of a unique community/culture. No amount of money restores the prior state.
  *   **B.** **Compensable:** The harm is economic loss, temporary inconvenience, or reversible discomfort. A theoretical check could make the loser whole.

  > **IF A:** **RED LIGHT.** The proposal violates separateness. It trades a person's inviolable status for aggregate gain.  
  > **→ STOP. Challenge the story.**
  >
  > **IF B:** **YELLOW FLAG.** The proposal is *technically* permissible under separateness ethics **IF** compensation is guaranteed.  
  > **→ Proceed to Step 4.**

  ### Step 4: The Consent/Role Check (The Tie-Breaker)
  *Did the targeted group agree to this role, or is it imposed?*
  *   **A.** **Imposed:** The burden is forced on people who did not volunteer for this specific risk (e.g., citizens, non-consenting patients).
  *   **B.** **Voluntary/Role-Based:** The burden falls on people who explicitly accepted this risk as part of a role (e.g., paid research subjects, soldiers, specific professional duties) **AND** retain the right to withdraw.

  > **IF A (Imposed) + Step 3B:** **HARD CASE (HANDOFF).** This is a values question. The math works, but the coercion is sticky. Flag for editorial discussion.
  > **IF B (Voluntary) + Step 3B:** **GREEN LIGHT.** The separateness objection is satisfied by consent + compensability.
  > **IF B (Voluntary) + Step 3A:** **RED LIGHT.** You cannot consent to being used as a battery for irreversible harm (e.g., lethal experimentation).

  ---

  ## Part 2: What This Tool Can't Catch (Blind Spots)
  *   **Creep:** It doesn't catch "temporary" measures that become permanent.
  *   **Systemic Bias:** It doesn't detect if the "Targeted Group" is always the same demographic (e.g., always poor, always minority) even if the *individual* selection is random.
  *   **Psychological Toll:** It treats "temporary discomfort" as compensable, ignoring long-term trauma or loss of trust.
  *   **The "Check" Never Arrives:** It tests compensation *in principle*. It does not verify if the political will exists to actually write the check.

  ---

  ## Part 3: Applied Case Studies

  ### Case 1: Mandatory Risky Vaccine for Nurses
  *Proposal: Nurses must take a vaccine with known severe side-effect risks to protect immunocompromised patients.*

  1.  **Loser Map:** **Targeted.** (Nurses bear the health risk; patients get the safety).
  2.  **Means Test:** **Instrumental.** (The nurses' bodies are the shield; without their risk, the protection fails).
  3.  **Compensation-in-Principle:** **Non-Compensable (Mostly).** (If the side effect is permanent injury or death, money doesn't fix it. If it's temporary flu-like symptoms, it is compensable). *Assume severe risk for this scenario.*
  4.  **Consent/Role:** **Imposed.** (Mandatory).

  **VERDICT: RED LIGHT.**
  **Why:** Even though it's a professional role, mandatory imposition of *severe, non-compensable* bodily risk treats the nurses as biological barriers (batteries) for the patients. The separateness of the nurse is violated because their bodily integrity is breached for another's gain without full consent.
  **Journalistic Angle:** Challenge the "duty of care" narrative. Does professional duty extend to irreversible bodily harm?

  ### Case 2: Carbon Tax Wiping Out One Coal Town
  *Proposal: A tax structure designed to hit one specific mining region to rapidly lower global emissions.*

  1.  **Loser Map:** **Targeted.** (One town bears the economic death).
  2.  **Means Test:** **Instrumental.** (The town's economic destruction is the metric of success for the policy).
  3.  **Compensation-in-Principle:** **Hard Case.** (Economic loss is compensable *in theory*. Destruction of a multi-generational community/culture is likely **Non-Compensable**).
  4.  **Consent/Role:** **Imposed.**

  **VERDICT: HARD CASE (HANDOFF).**
  **Why:** This hits the limit of the tool. If you view the loss as purely financial, it passes Step 3 (Yellow Flag). If you view the loss as cultural/existential, it fails Step 3 (Red Light).
  **Journalistic Angle:** This is a values question, not a fact question. Your story must explicitly ask: "Can a community be bought out?" Do not let the study hide behind cost-benefit analysis. Force the policymakers to answer whether they believe the town's culture has a price tag.

  ### Case 3: Clinical Trial with Placebo & Avoidable Harm
  *Proposal: A randomized control trial where the placebo group knows they might suffer avoidable progression of disease to ensure data purity.*

  1.  **Loser Map:** **Targeted.** (The placebo group).
  2.  **Means Test:** **Instrumental.** (Their lack of treatment is required to generate the data).
  3.  **Compensation-in-Principle:** **Compensable.** (Assuming the harm is disease progression that can be treated *after* the trial, or the risk is statistically minimal/equipoise exists).
  4.  **Consent/Role:** **Voluntary.** (Informed consent is the bedrock of trials; patients can withdraw).

  **VERDICT: GREEN LIGHT.**
  **Why:** This is the one you might hate. It feels utilitarian (sacrificing the few for the data). However, it passes the Separateness Stress-Test because the participants are **ends in themselves** who have **consented** to the risk, and the harm is **theoretically restorable** (via post-trial access to care). The "battery" charge fails because the battery volunteered and can unplug itself.
  **Journalistic Angle:** Even though it passes, interrogate the *quality* of consent. Are desperate patients truly voluntary? The tool says "Green," but your reporting should probe if the "Voluntary" box is actually checked in reality.

  ---

  ## Summary for your Editor's Desk

  | Case | Verdict | Why? |
  | :--- | :--- | :--- |
  | **1. Mandatory Vaccine** | **RED** | Non-compensable bodily harm + Imposed. Treats nurses as shields. |
  | **2. Coal Town Tax** | **HANDOFF** | Values question. Is a community price-tag compensable? You decide. |
  | **3. Placebo Trial** | **GREEN** | Consent + Restorable harm. Validates the utilitarian outcome via rights. |

  **Use this when:** A source says, "The greater good justifies the cost."
  **Your response:** "The greater good doesn't get to write the check. Who pays, and can they ever be made whole?"
