prompt: |-
  hey — i cover science and ethics policy for a magazine, and i'm sick of filing copy that lets slick utilitarian arguments slide by treating people like interchangable batteries. i need a reusable decision procedure i can run in like 15 minutes before i sign off on a story, to check whether a proposal or study design violates the seperateness of persons objection. build it as ordered questions i can actually answer without a philosophy degree, with clear stop points, judgment-call flags, and a note on what the tool can't catch.

  frame the whole thing around two distinctions that have to survive the simplification: targeted sacrifice (a specific, identifable group bears the cost as a means) versus diffuse burden (cost is spread so thin no one is used), and the compensation-in-principle test (whether the gains could in principle fully compensate the losers, regardless of whether anyone actually writes the check).

  then apply it to three cases: (1) a mandatory risky vaccine for nurses to protect immunocompromised patients; (2) a carbon tax that specifically wipes out one coal-mining town but lowers global emissions; (3) a clinical trial that randomly assigns some patients to placebo knowing a few will suffer avoidable harm. include at least one where the procedure gives a clear green light and i will probably hate it. also flag the hard cases where the procedure stops and hands the call to me because it's a values question, not a fact question.

  oh and don't just explain the theory — i need the actual checklist with pass/fail criteria for each step, plus what the procedure is blind to.
