answer: |-
  The calibration problem stands as a formidable barrier to aggregative moral reasoning. Standard decision theory grants that an individual's utility function is unique only up to positive affine transformation: if $u$ represents a person's attitudes, so does $a \cdot u + b$ for any $a > 0$ and any $b$. This indeterminacy permits rational choice under risk for a single agent but blocks interpersonal comparison. To weigh a gain for one person against a loss for another, a planner requires a common unit of welfare; to weigh a life against non-existence, a planner requires a common zero. The transference collar proposes to remove this ignorance by allowing subjects to experience one another's conditions phenomenally and report ratios of welfare differences. The central question is whether the resulting ratio-scale commonality solves the calibration problem or merely mimics its solution.

  To assess what the agreement delivers, we must analyze the mathematical implications of the collar's output. Suppose every judge $i$ assigns a value $E_i(x)$ to situation $x$. The hypothesis is that all judges agree on every ratio of welfare differences. That is, for any situations $x, y, z, w$, the ratio $\frac{E_i(x) - E_i(y)}{E_i(z) - E_i(w)}$ is identical for all $i$. This agreement on ratios of differences implies that for any two judges $i$ and $j$, there exist constants $a_{ij} > 0$ and $b_{ij}$ such that $E_i(x) = a_{ij} E_j(x) + b_{ij}$. Because this holds for all ordered pairs in the population, all individual scales are positive affine transforms of a single underlying scale structure. We can normalize the scaling factors $a_{ij}$ to unity across the population, establishing a common unit of welfare. However, the translation constants $b_{ij}$ represent the zero points. The agreement on ratios of differences is invariant under the addition of a constant; thus, the data does not force the zero points to align. Person $i$ might locate their zero at situation $S$, while person $j$ locates theirs at situation $T$. Consequently, the collar collapses the indeterminacy from separate affine transformations per person to a state of common units but separate zeros. This is distinct from the global indeterminacy ($\beta$) described in the setup, where a single $b$ applies to all. Here, we have individual $b_i$'s that are fixed relative to one another by the psychology of the subjects, but not necessarily equal.

  This leads to the question of constitution versus simulation. Is the agreement a discovery of an objective welfare scale, or merely a fact about shared psychology? If welfare is a property of a person-in-a-situation, the collar shows that our psychological machinery responds identically to identical stimuli. For the purpose of social planning, this distinction is negligible; shared psychology yields functional commensurability. However, the existence of a dissenting judge tests this stability. If one subject agrees on easy cases but diverges on hard ones, it suggests that comparability is contingent on psychological similarity. If the dissenter is defective, we exclude them; if merely unusual, we must admit that interpersonal comparability is limited to communities of shared sensibility. This does not invalidate the comparisons for the majority, but it grounds them in empirical fact rather than metaphysical necessity. We are willing to revise the notion of welfare to be a property of situations only relative to a standard psychology. The collar establishes that standard empirically.

  The critical failure point lies in the zero. Ratio-scale commonality fixes units but not origins. Two candidates for a common zero are the status quo and the neutral level (where a life is exactly worth living). The collar allows each person to locate their neutral level intrapersonally, but it does not entail that everyone's neutral level corresponds to the same situation. Person $i$ might find situation $X$ neutral, while person $j$, experiencing $X$ via the collar, reports it as positive on their scale. Without a further concordance that everyone's neutral level is the same situation, we lack a common zero. The absence of a common zero costs us the ability to make variable population choices. We cannot sum welfare levels across people because $\sum (u_i + b_i)$ varies with the arbitrary $b_i$'s. We can only sum changes from a baseline. Thus, while we can weigh a gain for one against a loss for another (common unit), we cannot weigh a life against no life at all (missing common zero).

  Given these constraints, we can rank the aggregation rules. The maximin and leximin rules require only ordinal comparability, which is secured by the agreement on orderings; they are fully supported. The sum rule for fixed populations is partially supported: it works for maximizing the sum of *changes* from a status quo, as the common unit ensures units are comparable. However, it fails for maximizing the sum of *levels*, as the separate zeros render the total sum sensitive to individual zero-points. The product-of-gains rule requires a common disagreement point (zero) to define "gains"; without a common zero, the product is ill-defined interpersonally. Therefore, the ranking is: Maximin/Leximin (strongest support), Fixed-Population Sum of Changes (moderate support), Sum of Levels and Product Rules (unsupported). The objection that the product rule's equal-treatment condition is a comparability assumption in disguise is moot; the collar provides the empirical basis for units, but the zero remains the blocker.

  Two pressure points remain. First, full agreement on ratios is a strong assumption. The verdict actually requires only that judges agree on the ordering of differences to support maximin, but ratio agreement is strictly necessary for any rule involving sums or products. If agreement holds only for orderings, we collapse back to ordinal comparability, supporting only maximin. Second, policies often change who exists. The collar cannot be used on people who never exist. Consequently, the verdict does not extend to variable population choices. The common zero does the heaviest work there, and the collar fails to supply it. We cannot compare a world with more people to one with fewer, because we cannot locate the non-existent on the scale.

  The load-bearing premise of this verdict is the completeness of agreement on ratios of differences. If this assumption fails—if judges systematically disagree on the magnitude of welfare differences even after experiencing them—the common unit collapses. We would be left with ordinal agreement at best, or perhaps no agreement at all if phenomenological translation is imperfect. Without ratio agreement, the affine relationship between scales is broken, and no summation rule is licensed. The honesty and stability of reports are also crucial, but even honest reports are useless if the underlying psychological structures do not align on magnitudes.

  In conclusion, the transference collar solves the unit aspect of the calibration problem but fails to solve the zero aspect. It provides the common currency needed to trade benefits and harms between existing people but lacks the universal origin point needed to evaluate existence itself. It transforms the calibration problem from a metaphysical mystery into an empirical limitation: we can compare lives lived, but not life against non-life.

