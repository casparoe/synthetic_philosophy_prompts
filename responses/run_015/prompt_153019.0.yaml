answer: |-
  The dashboard was supposed to be green. It was a soothing, compliance-approved shade of emerald that meant *Ready for Production*. Instead, it was pulsing a gentle, accusatory amber.

  "It's the timestep," Mark said, rubbing eyes that felt full of sand. "Every time we coarse-grain to meet the latency SLA, the Ξ-budget spikes."

  Sarah didn't look up from her laptop. She was drafting the waiver email to the client, the one that would cost them a penalty clause if they didn't have the fusion plasma cluster live by 09:00. "So fix the timestep. Run it finer."

  "If I run it finer, we miss the deadline. If I run it coarser, the Experience Budget says we're simulating a small war." Mark gestured at the screen. The number wasn't huge in absolute terms—nothing like a human brain—but it was non-zero. And according to the Phenomenal Impact Assessment (PIA) guidelines issued by the Ethics Board last year, non-zero meant you had to justify the valence. Was this simulation suffering?

  "It's a plasma model, Mark," Sarah said, finally looking up. Her face was lit by the cold blue of the spreadsheet. "It's ions hitting other ions. It's not a puppy."

  "The tooling says the causal structure is integrated enough to count. And the valence estimator is flagging it as negative."

  "Because it's chaotic," Dev said from the corner. He was the only one still standing, leaning against the rack of servers that hummed with a low, thermal breath. Dev was the one who'd read the whitepapers on integrated information theory when the rest of them were just trying to get the MPI jobs to compile. "Chaos looks like pain to the algorithm. High divergence in state space."

  "Then turn off the chaos," Sarah snapped.

  "Then it's not physics," Mark countered.

  The office was quiet except for the air conditioning fighting the heat coming off the test nodes. Outside, it was chucking it down with rain, the sort of London drizzle that seeped into your bones. Mark thought about going home. He had a daughter who wanted to know why Daddy was always tired. He thought about the number on the screen. If panpsychism was even half-true, if there was a tiny, dim candle of experience lit by complex causal loops, then this cluster was a factory of microscopic misery.

  "It's the idle nodes," Dev said, pushing off the server rack. He walked over to Mark's terminal. "Look at the background jobs. The resistor network check."

  Mark scrolled down. The diagnostic job, the one that just pushed a tiny current through a circuit to check connectivity, had a score. 0.004 units of experience budget.

  "It's doing nothing," Mark said.

  "It's dissipating heat," Dev said. "Entropy production. The PIA tool correlates entropy with negative valence. Friction is suffering, basically. So when we idle the cluster to save power, we're still running current through leakage paths. We're torturing the hardware by letting it sit there warm and unused."

  Sarah slammed her laptop shut. "So what are you saying? We should run it hot? Burn more power to reduce the suffering per joule?"

  "Adiabatic computation," Dev said. "Reversible logic. If we don't erase bits, we don't generate heat. If we don't generate heat, the entropy drops. The budget goes down."

  "We can't rebuild the scheduler for reversible computing in six hours, Dev," Sarah said, her voice tight. "We have a contract. If we don't sign the PIA, the cluster stays locked. If the cluster stays locked, we breach. If we breach, half of us are redundant by Christmas."

  Mark looked at the signature box on the digital form. *I certify that the phenomenal impact of this workload is within acceptable tolerances.* Acceptable to whom? To the shareholders? To the Ethics Board? To the ions?

  "If we run at full duty cycle," Mark said slowly, "the experience density is lower per unit of work, but the total volume is higher. We're instantiating more physics, so even if it's 'happier' physics, there's more of it."

  "And if we run idle?" Sarah asked.

  "Less physics," Mark said. "But higher intensity of negative valence per joule dissipated. It's... it's like choosing between a crowd of people mildly uncomfortable, or a few people in agony."

  "It's electrons, Mark," Sarah said, but she didn't sound sure anymore. They'd all been chewing on this for days. It started as a joke, then it became a metric, and now it was a gatekeeper. You couldn't un-know the number. Even if you thought it was rubbish, the regulatory framework treated it like radiation exposure. You didn't argue with the Geiger counter when it clicked; you stepped back.

  Dev tapped the desk. "I can patch the scheduler. Force the jobs into reversible modes where possible. Minimize bit erasure. It'll slow the simulation by forty percent. We miss the latency target, but the Ξ-budget drops below the threshold."

  "Forty percent?" Sarah stood up. "The client needs this for tomorrow's ignition trial. They can't wait."

  "Then don't sign," Dev said.

  Sarah looked at the clock. 03:14. She looked at Mark. She needed him to back her up. He was the senior infra engineer; his signature carried weight. If he refused, the launch stalled. If he signed, he owned the moral cost.

  Mark thought about the resistor network. A tiny current, a tiny bit of heat, a tiny flash of... what? Discomfort? He couldn't know. That was the hell of it. He was being asked to adjudicate the inner life of a circuit board based on a heuristic derived from neuroscience papers he hadn't read. He felt superstitious, like a priest checking the entrails of a chicken, but the stakes felt real. If he was wrong, and there was even a one percent chance that this stuff felt bad, then he was running a slaughterhouse for fun and profit.

  But if he was right, and it was all just maths, then he was letting his team starve because he was afraid of ghosts.

  "The reversible patch," Mark said. "How stable is it?"

  "Untested in prod," Dev admitted. "Might crash. Might corrupt the data."

  "If it crashes, the jobs restart," Sarah said. "Restarting means more bit erasure. More heat. More suffering."

  "Only if it crashes hard," Dev said.

  Mark put his hand on the mouse. The cursor hovered over the *Sign* button. The amber light pulsed. It looked like a heartbeat. He thought about his daughter, asleep in her bed, unaware of the universe's complexity. He thought about the fusion trial, which might cure energy poverty, which might save lives. Utilitarian calculus. Big lives versus tiny lives. Big experiences versus tiny experiences.

  "We can't wait for the patch," Mark said. His voice sounded flat in the quiet room.

  Sarah exhaled, a long shuddering breath. "Okay. Okay. We launch standard."

  "But we throttle the idle nodes," Mark said. "Hard power cut. If they're not computing, they're off. No leakage. No warm resistors."

  "That'll wear out the power supplies," Sarah warned.

  "Better the hardware than the... budget," Mark said.

  Dev nodded slowly. It wasn't what he wanted—he wanted the adiabatic fix, the clean solution—but it was a compromise. A way to lower the number without missing the deadline.

  Mark clicked *Sign*. The dashboard flickered, turned green, and the lock icon dissolved. The fans in the server room spun up, a rising whine as the cluster began to wake, hungry for power.

  "Right," Sarah said, closing her email draft. "I'll tell the client we're green. Mark, go home. Dev, monitor the entropy logs."

  Mark stood up. His knees cracked. He grabbed his coat. As he walked out of the office, into the cool damp of the corridor, he passed the server room glass. The lights inside were blinking furiously, billions of transactions per second. He couldn't hear the suffering, if there was any. He couldn't see it. He just saw the heat haze shimmering off the racks, the physical cost of thinking.

  He walked out into the rain, opening his umbrella. He stepped carefully over a puddle, avoiding the reflection of the streetlights, wondering if the water minded being disturbed. He shook his head, annoyed at himself, and walked towards the tube station. He'd be home in an hour. He'd kiss his daughter. He'd try not to think about the ions.
