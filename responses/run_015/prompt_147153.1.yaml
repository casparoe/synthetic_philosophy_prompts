answer: |-
  # The Stream Tribunal: A Simulation of Anattā and Moral Causality

  **Course:** Graduate Seminar in Metaphysics of Mind
  **Topic:** Buddhist *Anattā* (No-Self), *Skandhas* (Aggregates), and the Two Truths
  **Time:** 90 Minutes
  **Participants:** 12 Graduate Students

  ## I. Learning Objective
  To move students from abstract comprehension of *anattā* to an experiential encounter with the tension between **Conventional Truth** (*sammuti-sacca*: moral responsibility, agency, punishment) and **Ultimate Truth** (*paramattha-sacca*: causal streams, aggregate replacement, no-agent). The simulation forces a binding moral decision within a metaphysical framework that denies the ontological status of the decider.

  ## II. Role Division (12 Students)
  The class is divided into **5 Aggregate Teams**. These teams remain seated together throughout. Within each team, students are assigned **Temporal Delegates**.

  *   **Team 1: Rūpa (Form/Physicality)** – 2 Students
      *   *Delegate A:* Past & Future (The body that acted / The body that suffers)
      *   *Delegate B:* Present (The body currently judged)
  *   **Team 2: Vedanā (Feeling/Tone)** – 2 Students
      *   *Delegate A:* Past & Future (The feeling of impulse / The feeling of pain)
      *   *Delegate B:* Present (The feeling of empathy/aversion)
  *   **Team 3: Saññā (Perception/Recognition)** – 2 Students
      *   *Delegate A:* Past & Future (Recognition of the victim / Recognition of the penalty)
      *   *Delegate B:* Present (Recognition of the law/norm)
  *   **Team 4: Saṅkhāra (Mental Formations/Volition)** – 3 Students
      *   *Delegate A:* Past (The volition that committed the act)
      *   *Delegate B:* Present (The volition that judges)
      *   *Delegate C:* Future (The volition that will be shaped by the judgment)
  *   **Team 5: Viññāṇa (Consciousness/Awareness)** – 3 Students
      *   *Delegate A:* Past (Awareness at the moment of the act)
      *   *Delegate B:* Present (Awareness of the trial)
      *   *Delegate C:* Future (Awareness that will inherit the karmic residue)

  *Note: Saṅkhāra and Viññāṇa receive distinct temporal delegates because, in Abhidharma, these are the primary carriers of karmic continuity.*

  ## III. The Scenario: The Karmic Loop
  A harmful act occurred in the **Past** (e.g., a violent outburst causing injury). The **Present** Tribunal must decide on a punishment. The **Future** will inherit the consequences.

  **The Conceptual Twist (Dependent Origination):**
  In standard personal identity puzzles, the future is fixed. In this tribunal, **the Present Judgment causally reshapes the Future Aggregates.**
  *   If the Present chooses **Retribution**, the Future *Saṅkhāra* receives "Resentment Conditions" (making future harm more likely).
  *   If the Present chooses **Rehabilitation**, the Future *Viññāṇa* receives "Insight Conditions" but also "Residual Habit Conditions."
  *   *The Paradox:* The Present is judging a Past they are not, to punish a Future they are actively altering.

  ## IV. Rules of Speech (The Two Registers)
  To maintain the metaphysical tension, two linguistic registers are enforced.

  1.  **The Conventional Register (The Verdict):**
      *   **When:** During testimony, deliberation, and the final vote.
      *   **Allowed:** Pronouns ("I," "He," "We"), Names ("The Accused," "The Victim"), Moral Terms ("Guilt," "Justice," "Punishment").
      *   **Purpose:** To reach a binding social decision.
  2.  **The Ultimate Register (The Justification):**
      *   **When:** Immediately *after* any claim or vote is made, the speaker must justify it in this register.
      *   **Forbidden:** "Self," "Person," "Agent," "Enduring Entity."
      *   **Required:** Causal language ("Conditioning," "Arising," "Cessation," "Aggregate Cluster," "Continuity").
      *   **Example:**
          *   *Conventional:* "I vote to punish him because he chose to hurt someone."
          *   *Ultimate:* "This vote arises due to the condition of past volitional formations. The cluster labeled 'he' is a cessation of prior states. Punishment is a new condition applied to the future stream to alter its trajectory."

  **Violation Penalty ("View Corruption"):** If a student uses Conventional language during an Ultimate justification (e.g., "Because *I* feel..."), their team loses a **Karma Point**.

  ## V. Payoff Structure: The Karmic Ledger
  Points are tracked publicly on the board. This creates "small stakes" pressure regarding intellectual rigor and ethical consistency.

  *   **Coherence (2 Points):** The Ultimate justification logically supports the Conventional claim without invoking a self.
  *   **Compassion (2 Points):** The decision minimizes the total "Suffering Score" (calculated by the Instructor based on the Future Team's reported state).
  *   **Consistency (1 Point):** No Register violations during the phase.

  **The Tension:** To maximize *Coherence*, students often argue for strict causal justice (Retribution). To maximize *Compassion*, they must argue for mercy (Rehabilitation), which risks *Coherence* if they cannot explain how responsibility transfers without a self.

  ## VI. Timeline (90 Minutes)

  ### 00:00 – 00:15: Setup & Initiation
  *   Instructor assigns roles and explains the Two Registers.
  *   **The Twist Revealed:** Explain that the Present Verdict will physically change the Future Team's "Hand" (see below).
  *   Distribute **Condition Cards** to Past and Present teams. Future Teams start with blank hands.

  ### 00:15 – 00:30: Phase 1 – Past Testimony (The Act)
  *   **Task:** Past Delegates (one from each team) describe the harmful act.
  *   **Constraint:** Must establish *Conventional* guilt but *Ultimate* causality.
  *   **Example:** *Past Saṅkhāra:* "Volition arose to strike. [Conventional] I did it. [Ultimate] Anger conditioned the formation."
  *   **Present Team** listens and takes notes for deliberation.

  ### 00:30 – 00:55: Phase 2 – Present Deliberation (The Judgment)
  *   **Task:** Present Delegates deliberate and reach a binding verdict (Punish/Release/Rehabilitate).
  *   **Mechanic:** Every argument must be paired (Conventional Claim + Ultimate Justification).
  *   **The Twist Activation:** Once the Verdict is written, the Instructor collects the Future Team's blank cards and replaces them with **Karmic Consequence Cards** based on the verdict.
      *   *If Retribution:* Future gets "Pain-Vedanā" and "Aversion-Saṅkhāra."
      *   *If Rehabilitation:* Future gets "Effort-Saṅkhāra" and "Uncertainty-Viññāṇa."
  *   **Stakes:** Present Team wants to look "Just" (Coherence) but fears creating a "Monster" (Compassion points lost if Future suffers too much).

  ### 00:55 – 01:10: Phase 3 – Future Reaction (The Consequence)
  *   **Task:** Future Delegates reveal their new Condition Cards. They must describe their state *as caused by the Present Judgment*.
  *   **Critical Moment:** Future *Viññāṇa* must state whether they feel "Responsible" for the Past Act, given they have been reshaped by the Present Judgment.
  *   **Scoring:** Instructor calculates total "Suffering Score" across all three stages to award Compassion Points.

  ### 01:10 – 01:30: Debrief & Metaphysical Mapping
  *   See Section VII below.

  ## VII. Debrief Guide: Mapping the Crisis
  *Do not simply ask "How did it feel?" Map the friction points directly to the text.*

  1.  **The Register Collapse:**
      *   *Observation:* Did anyone slip and say "I deserve this" in the Ultimate phase?
      *   *Mapping:* This is *Sakkāya-diṭṭhi* (Personality View). The simulation makes you feel how natural it is to reify the aggregates into a self when under pressure.
  2.  **The Circular Agency (The Twist):**
      *   *Observation:* How did the Present Team feel knowing they were *creating* the Future they were judging?
      *   *Mapping:* This mirrors *Paṭicca-samuppāda* (Dependent Origination). *Saṅkhāra* conditions *Viññāṇa*. The "Judge" is not outside the stream; the judgment is just another link in the chain. There is no "God's eye view" for justice.
  3.  **The Soteriological Gap (Crucial Honesty):**
      *   *Instructor Note:* You must explicitly state what the simulation *failed* to do.
      *   *Point:* "This exercise increased your conceptual grasping. You fought harder to define 'self' and 'responsibility.' Real *anattā* practice is not about solving this puzzle; it is about realizing the puzzle itself arises from craving (*taṇhā*). The simulation creates *Dukkha* (stress) to show you the problem; meditation aims to dissolve the stress, not win the Karmic Ledger."
  4.  **Predictable Failures:**
      *   **Mereological Reductionism:** Students treating aggregates as "parts" of a person (like engine parts) rather than processes. *Correction:* Remind them *Rūpa* is not "the body," it is "the process of materiality."
      *   **The Dominant Consciousness:** The *Viññāṇa* team often tries to act as the "Observer/Self." *Correction:* Remind them *Viññāṇa* is dependent on sense organs; it is not a homunculus.
      *   **Temporal Reification:** Treating Past/Present/Future as solid blocks. *Correction:* These are momentary (*khaṇa*). The "Past" delegate is already dead; the "Future" is not yet born.

  ## VIII. Instructor Materials: Condition Cards
  *Prepare these in advance to hand to the Future Team based on the Present Verdict.*

  **Set A: Retribution Verdict**
  *   **Vedanā Card:** "Intense Pain. Difficulty focusing on arguments."
  *   **Saṅkhāra Card:** "Defensive Volition. Impulse to blame the Judge."
  *   **Viññāṇa Card:** "Fragmented Awareness. Focus is on the punishment, not the act."

  **Set B: Rehabilitation Verdict**
  *   **Vedanā Card:** "Unease. Ambiguity about status."
  *   **Saṅkhāra Card:** "Corrective Volition. Effort required to change habits."
  *   **Viññāṇa Card:** "Clear Awareness. But lingering memory of the past act."

  **Set C: No Punishment (Absolution)**
  *   **Vedanā Card:** "Relief."
  *   **Saṅkhāra Card:** "Unchecked Habit. High probability of repeating the act."
  *   **Viññāṇa Card:** "Continuity of Ignorance. No new condition introduced to break the chain."

  ## IX. Contingency Plans
  *   **If the class deadlocks:** The Instructor acts as *Kāla* (Time), forcing a verdict after 20 minutes to ensure the Future Phase can occur.
  *   **If the "Self" talk becomes rampant:** Call a "Mindfulness Bell." Stop the simulation. Ask the class to identify *which aggregate* is currently craving a self-identity. Resume only when they identify it as *Saṅkhāra* (formation) rather than *Viññāṇa* (self).
  *   **If the Twist is ignored:** During the Future Phase, explicitly ask the Future *Viññāṇa*: "Would your consciousness be different if the Present had chosen differently? If yes, who is the author of your current state?"

  ---

  ### Instructor's Note on the "Twist"
  Standard analytic philosophy puzzles (Parfit, Shoemaker) ask: *Is Person B the same as Person A?*
  This simulation asks: *Does the act of judging Person B change whether Person B exists?*
  By making the Present Judgment a *condition* for the Future Aggregates, you replicate the Buddhist insight that **karma is not a legal system imposed on beings, but a causal law that constructs the beings themselves.** This prevents students from treating *anattā* as a semantic trick and forces them to confront it as an ontological crisis.
