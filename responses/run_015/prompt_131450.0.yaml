  *(Self-Correction during drafting)*: I need to make sure I don't make the user sound *too* defensive. The replies should be confident but humble about the trade-offs. Also, ensure the distinction between Ghazālī's *ʿāda* and Humean regularity is clear, as the prompt mentions it. The Historian will pounce on that.

  *(Refining the "God Question")*: If the user isn't a theist, they can't argue God exists. They have to argue for *conceptual utility*. "It's a stress test for physicalism."

