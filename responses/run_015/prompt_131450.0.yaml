      *   *Emergentist:* "It's emergence." -> *Reply:* "Emergence still needs a base. Occasionalism removes the base's power entirely." -> *Weakness:* Functionally identical.
      *   *Historian:* "Ghazālī didn't care about Kim." -> *Reply:* "True, but the metaphysical structure holds regardless of intent." -> *Weakness:* Risk of textual violence.
      *   *The God Question:* "I'm bracketing theology." -> *Reply:* "Treat God as a placeholder for 'external causal source' to test the logic." -> *Weakness:* Hard to sustain without sounding instrumentalist.

  7.  **Final Polish:**
