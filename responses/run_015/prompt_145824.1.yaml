  Take the 2019 Spanish decision to exhume Franco from the Valley of the Fallen but leave the basilica and cross standing, and analyse it through Margalit's ethics of memory and Rieff's claim that modern culture swaps moral reckoning for theraputic healing. I care about the mapping: whose shared memory is being managed, what kind of forgetting is happening when you relocate the body but preserve the monument, and whether Margalit's thick-vs-thin memory distinction can handle that hybrid. I also want you to use this idea I'm calling architectural forgetting — the physical site survives but its moral charge gets neutralized. Does Rieff predict that sanitized half-measure? Does the episode show Margalit's duty-to-remember is too binary, or does it just reveal the theory never anticipated this kind of state-managed ambiguity? Say where each thinker is silent, not just where they fit.
