          *   "Architectural Forgetting": This fits Rieff perfectly. It's a sanitized memory. It allows the present to feel moral without demanding full reckoning.
          *   Prediction: Rieff would predict this. He argues collective memory is usually co-opted by the state to stabilize, not to disrupt. The "half-measure" is the sweet spot for political survival.

      *   **Section 3: Architectural Forgetting and the Management of Shared Memory:**
