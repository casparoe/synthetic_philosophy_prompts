          *   The Gap: Margalit assumes memory is either kept or lost. He doesn't account for *repurposing* memory. The "hybrid" (monument stays, body goes) creates a cognitive dissonance Margalit's framework struggles with. Is it loyalty to victims or loyalty to "peace"?
          *   Critique: Margalit is too binary. He doesn't anticipate state-managed ambiguity where memory is *edited* rather than kept or discarded.

      *   **Section 2: Rieff and the Therapeutic Half-Measure:**
          *   Rieff's core claim: Memory is often used for emotional comfort (therapy) rather than justice.
