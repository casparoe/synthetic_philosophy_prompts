answer: |-
  # Seminar Design: The Epistemology of Aggregation
  **Topic:** Simpson's Paradox as a Structural Failure of Causal Inference
  **Duration:** 90 Minutes
  **Audience:** Philosophy of Science Undergraduates (1 Intro Stats Course)

  ## I. The Carrying Scenario: "The Two-Factory Production Puzzle"

  **Narrative Structure:**
  You are an efficiency consultant hired by a conglomerate that owns two manufacturing plants: **Factory North** and **Factory South**.
  *   **The Intervention (X):** A new "Precision Arm" robot is being tested. Some widgets are made with the **New Robot**, others with the **Old Standard**.
  *   **The Outcome (Y):** Widgets are rated **High Quality** or **Low Quality**.
  *   **The Hidden Mechanism (Z):** **Production Difficulty**. Factory North is equipped for **Complex** widgets (hard to make). Factory South is equipped for **Simple** widgets (easy to make).
  *   **The Allocation Bias:** Plant managers believed Complex widgets needed more help. Therefore, they allocated the **New Robot** disproportionately to Factory North (Complex) and kept the **Old Standard** mostly at Factory South (Simple).

  **The Data Story (Presented Verbally/Visually, not as raw tables initially):**
  1.  **Pooled View:** Looking at all widgets together, those made with the *Old Standard* have a higher rate of High Quality than those made with the *New Robot*.
  2.  **Stratified View:** Inside Factory North (Complex), the *New Robot* outperforms the *Old Standard*. Inside Factory South (Simple), the *New Robot* also outperforms the *Old Standard*.

  ---

  ## II. Explanatory Sequence (90 Minutes)

  ### Phase 1: The Intuitive Trap (0–20 Minutes)
  *   **Activity:** Present the **Pooled View** only. "Overall, the Old Standard yields 80% High Quality, while the New Robot yields 60% High Quality."
  *   **Discussion:** Ask students for a causal recommendation. Most will advise abandoning the New Robot.
  *   **Conceptual Dependency:** Establish that students naturally treat the **aggregate population** as the primary locus of truth. They assume that if $N$ is large enough, the average effect reflects the causal reality.
  *   **Transition:** Reveal that the data comes from two distinct factories with different difficulty levels.

  ### Phase 2: The Reversal and Structural Diagnosis (20–50 Minutes)
  *   **Activity:** Present the **Stratified View**. In both factories, the New Robot has a higher success rate than the Old Standard.
  *   **The Pivot:** Do not ask them to calculate. Ask: *"Did the robot's physical capability change when it moved from the pooled dataset to the subgroup dataset?"*
  *   **Core Lesson:** Association is **partition-dependent**. It is not an invariant property of the variables $X$ and $Y$. It is a property of $X$, $Y$, *and the partitioning variable $Z$*.
  *   **Mechanism Analysis:** Walk through the allocation story.
      *   The New Robot was sent to the Hard Factory (where success is rare for *any* machine).
      *   The Old Standard stayed in the Easy Factory (where success is common for *any* machine).
      *   The Pooled Data compares "New Robot + Hard Task" against "Old Standard + Easy Task."
      *   **Conclusion:** The reversal is not a mathematical error; it is a **structural failure of aggregation**. The pooled group mixes apples (hard tasks) and oranges (easy tasks) unevenly.

  ### Phase 3: Philosophical Implications & Misconception Interception (50–80 Minutes)
  *   **Focus:** Move from "how the math works" to "what this means for scientific knowledge."
  *   **Discussion:** Why did the pooled data lie? Because it ignored the **data generation process** (the allocation mechanism).
  *   **Key Takeaway:** Statistical patterns are silent on causality without a model of how units are assigned to treatments. You cannot "read" causation off a table; you must import causal assumptions to choose the correct table (partition).

  ### Phase 4: Diagnostic and Wrap (80–90 Minutes)
  *   **Activity:** Administer the Diagnostic Question (see below).
  *   **Closing:** Reiterate that SP is not a paradox of logic, but a paradox of *expectation*. We expect averages to preserve directionality, but they only do so when the subgroups are balanced or the partition is causally irrelevant.

  ---

  ## III. Misconception Map & Interception Points

  | Misconception | Description | Intercept Point | Strategy |
  | :--- | :--- | :--- | :--- |
  | **1. Correlation implies Causation** | "If the pooled data shows Old is better, Old *causes* better quality." | **Phase 1 (End)** | Before revealing subgroups, ask: "What assumption are we making about how the robots were assigned to factories?" Force acknowledgment that we don't know the allocation yet. |
  | **2. The Larger-N Privilege** | "The pooled result must be truer because it has more data points; subgroups are just noisy slices." | **Phase 2 (Middle)** | When the reversal is revealed, students will trust the Total $N$. Intercept by asking: "If I mix water at 10°C and water at 90°C, is the average temperature a useful guide for how to treat the water?" Highlight that averaging heterogeneous causal contexts destroys information. |
  | **3. Stratification is Always Truth** | "Since the subgroups agree, the stratified result is automatically the 'true' causal effect." | **Phase 3 (Start)** | Challenge this: "What if we stratified by 'Day of the Week' instead of Factory?" Intercept the idea that *any* partition resolves SP. Only partitions that block the **confounding path** (the allocation bias) reveal the direct effect. |
  | **4. Ontological Nihilism** | "If the association reverses, there is no fact of the matter about whether the robot works." | **Phase 3 (End)** | Distinguish **Epistemology** (what the data shows) from **Ontology** (how the robot works). The robot's causal power is stable; the *measurement* was unstable. The paradox is in the inference, not the world. |

  ---

  ## IV. End-of-Session Diagnostic Question

  **Scenario:**
  Return to the Two-Factory scenario. The data still shows the Simpson's Paradox (New Robot is better in both factories, worse in total).
  Now, imagine you decide to partition the data differently. Instead of grouping by **Factory** (North/South), you group by **Shift** (Day/Night).
  *   Factory North runs only Day Shift.
  *   Factory South runs only Night Shift.
  *   The New Robot was still allocated based on Factory (and thus based on Shift).

  **Question:**
  If you analyze the data stratified by **Shift** (Day vs. Night), will you see the same reversal (New Robot looks worse overall, but better in each shift) or will the paradox disappear? Explain your reasoning based on the **allocation mechanism**, not the numbers.

  **Correct Reasoning Required:**
  The student must identify that **Shift** is perfectly correlated with **Factory** in this specific setup. Therefore, stratifying by Shift is mathematically and causally identical to stratifying by Factory. The paradox will resolve (showing the New Robot is better) because stratifying by Shift effectively controls for the Production Difficulty (since Difficulty is tied to Factory, which is tied to Shift).
  *   *Success Criterion:* The student recognizes that the validity of the partition depends on whether it captures the **confounding variable** (Difficulty/Allocation), not on the label of the partition itself.

  ---

  ## V. Exclusions & Justification

  **1. Directed Acyclic Graphs (DAGs) and Formal Notation**
  *   **Omission:** Do not introduce nodes, arrows, $d$-separation, or back-door criteria notation.
  *   **Justification:** The seminar goal is conceptual intuition regarding aggregation and partition-dependence. Introducing formal causal graph syntax shifts the cognitive load from *philosophical reasoning about data* to *syntax memorization*. The narrative of the "allocation mechanism" suffices to explain the confounding without formalizing the topology.

  **2. Formal Conditions for Collapsibility**
  *   **Omission:** Do not present the mathematical inequalities required for an association to be collapsible (e.g., conditions where weighted averages preserve direction).
  *   **Justification:** This is a philosophy seminar, not a mathematical statistics seminar. The philosophical point is that aggregation *fails* under specific structural conditions, not the precise mathematical boundary of those conditions. Understanding *why* we stratify (to isolate causal mechanisms) is more important than knowing *when* the math allows pooling.

  **3. The "Sure-Thing Principle" (Savage)**
  *   **Omission:** Do not reference the Sure-Thing Principle by name or formal definition.
  *   **Justification:** While SP violates the Sure-Thing Principle in probabilistic terms, discussing this invites confusion between decision theory and causal inference. It is cleaner to frame the issue as "Partition-Dependence of Association" to keep the focus on the relationship between statistical patterns and causal claims.
