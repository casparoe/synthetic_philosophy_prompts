answer: |-
  **Title:** The Limits of Fellow-Feeling: Reconstructing Adam Smith's Imperial Critique through Sympathetic Jurisdiction

  **Introduction**

  The standard interpretation of Adam Smith's political economy casts him as the arch-architect of laissez-faire, whose opposition to British imperialism in *The Wealth of Nations* (1776) rests primarily on utilitarian and economic grounds. In this view, colonies are inefficient monopolies, the East India Company (EIC) is a market-distorting cartel, and the American war is a fiscal disaster. While these economic critiques are undeniable, they offer an incomplete explanation for the *administrative* pathologies Smith identifies. Why do imperial administrators act with such consistent negligence and cruelty? Why do well-meaning British legislators pass catastrophic laws for the colonies?

  This essay argues that Smith's anti-imperialism should be reconstructed around a moral-psychological framework derived from *The Theory of Moral Sentiments* (1759): the concept of "sympathetic jurisdiction." Legitimate rule, for Smith, depends on a proximity that allows the "impartial spectator" to operate between governors and governed. Empire fails not merely because it is unprofitable, but because geographic and social distance attenuate sympathy, corrupting moral judgment on both sides. By reading Smith's administrative critiques through the lens of sympathy, we see that economic inefficiency is often the symptom of a deeper moral-epistemic breakdown caused by distance.

  **I. The Mechanics of Sympathetic Jurisdiction**

  To understand sympathetic jurisdiction, one must return to Smith's moral psychology. In *The Theory of Moral Sentiments* (TMS), "sympathy" is not merely pity, but the cognitive and emotional capacity to "change places in fancy" with another. Moral judgment arises when an "impartial spectator"—an internalized proxy for public opinion—evaluates whether the sentiments of an agent align with the situation of the patient.

  Crucially, Smith acknowledges that sympathy is spatially and socially bounded. He famously notes that a European man would snore over the news of an earthquake in China that killed millions, whereas the loss of his own little finger would disturb him more (TMS III.3.3). Sympathy decays with distance. However, Smith argues that the cultivation of virtue involves expanding the circle of the impartial spectator to overcome this natural bias.

  "Sympathetic jurisdiction" posits that political authority is legitimate only within a sphere where the governor can realistically simulate the situation of the governed. If the distance (geographic, cultural, or institutional) is too great, the governor cannot access the information or emotional resonance required to activate the impartial spectator. Without this feedback loop, power becomes unmoored from moral constraint. Empire, by definition, stretches jurisdiction beyond the reach of sympathy.

  **II. The American Colonies: The Epistemology of Distance**

  In *The Wealth of Nations* (WN), Smith's critique of British policy toward America is often read as a defense of free trade against mercantilist restriction. However, Smith's analysis of *why* the restrictions were imposed reveals a failure of sympathetic jurisdiction.

  Smith argues that the British Parliament, in imposing the Stamp Act and other taxes, acted out of ignorance rather than malice. He writes that the British legislature was "ill-informed" regarding the circumstances of the colonies (WN V.iii.92). In the language of TMS, the British legislators could not "change places in fancy" with the American colonists. They lacked the proximate experience necessary to understand how the taxes would be felt.

  Because the Americans had no representation in Parliament, there was no mechanism to bring the "spectator" of the colony into the legislative chamber. The distance prevented the pain of the colonists from registering as a moral check on the legislators. Smith's proposed solution—virtual or actual representation—is not just a political fix but a moral one. He suggests that if Americans were represented, the "distance" would be bridged; the British spectator would be forced to confront the American situation, restoring the sympathetic feedback loop.

  Smith predicts that without this proximity, administration will inevitably drift toward oppression. This is not because British politicians are inherently tyrannical, but because the structure of imperial distance insulates them from the moral consequences of their commands. The administrative failure is a failure of imagination caused by geography.

  **III. The East India Company: The Corruption of the Spectator**

  The case of the East India Company offers the starkest evidence for sympathetic jurisdiction. Smith's condemnation of the EIC in WN is scathing, focusing on their "negligence," "profusion," and "plunder." A purely economic reading attributes this to monopoly power. However, Smith explicitly links this behavior to the psychological distance between the rulers and the ruled.

  Smith identifies a double-alienation in the EIC structure. First, the "masters" of the Company are the British public/shareholders, who are too distant from India to judge the actions of the Company's servants. Second, the servants in India are transient merchants, not settled governors. They have no stake in the long-term prosperity of the land they rule.

  Smith writes that a merchant serving a temporary term has no interest in the "improvement of the country" but only in extracting wealth before returning home (WN V.i.86). In TMS terms, the impartial spectator of the servant is not the Indian subject, nor the long-term health of the territory, but the distant shareholder expecting dividends. The Indian subject is too "distant" to command sympathy; their suffering does not register against the financial gain of the servant.

  Smith notes that the Company's servants "consider the country as a prize to be plundered." This language suggests a moral breakdown, not just an economic calculation. The institutional distance ensures that the "pain" of the Indian population never reaches the British spectator, and the "greed" of the servant is never checked by local moral sentiment. Smith argues that the only remedy is to bring the administration under the direct eye of the state, where public scrutiny (a form of collective sympathetic judgment) might be stronger than private corporate secrecy. Yet, he remains skeptical, implying that the distance between London and Bengal may simply be too great for any sympathetic jurisdiction to function effectively.

  **IV. Weaknesses and Falsification Conditions**

  While the "sympathetic jurisdiction" reading offers a compelling unification of Smith's moral and economic works, it is a reconstruction that faces significant textual and conceptual hurdles. To maintain intellectual honesty, I must identify where this reasoning is weakest and specify what evidence would necessitate rejecting it in favor of the standard economic reading.

  **1. The Textual Gap (The "Adam Smith Problem"):**
  The most significant weakness is that Smith never explicitly uses the terminology of *The Theory of Moral Sentiments* (sympathy, impartial spectator) in *The Wealth of Nations* when discussing imperial administration. He speaks of "interest," "expense," "revenue," and "security."
  *   *Counter-Evidence:* If close textual analysis of WN reveals that Smith consistently explains administrative failure *solely* through incentive structures (e.g., "servants steal because salaries are low") without invoking ignorance or moral blindness, the economic reading holds primacy. If Smith proposes bureaucratic solutions that *increase* distance (e.g., centralized tax collection) while claiming they improve efficiency, the sympathy argument collapses, as it would show he believes distance does not impair judgment.

  **2. The Primacy of Utility:**
  Smith often concludes his arguments with appeals to national wealth and security. In WN V.iii, he suggests relinquishing the colonies because the cost of defense exceeds the revenue. This is a utilitarian calculation, not a moral-psychological one.
  *   *Falsification Condition:* If Smith's recommendations can be fully derived from a cost-benefit analysis without reference to the *quality* of governance or the *justice* of rule, the sympathetic jurisdiction thesis is redundant. For example, if Smith argues that the EIC should be reformed primarily to maximize dividend stability rather than to reduce Indian suffering, the moral-psychological framework is secondary.

  **3. Historical Context of "Distance":**
  Smith lived in an era where communication took months. His concern about distance might be purely logistical (information asymmetry) rather than moral (attenuated sympathy).
  *   *Counter-Evidence:* If Smith's writings suggest that better communication technology (faster ships, better mail) would solve the imperial problem without needing political integration, then his concern was epistemic/logistical, not moral. The sympathetic jurisdiction argument requires that *social* distance matters even if *information* is available. If Smith believes that a well-informed London bureaucrat could govern India justly, the sympathy argument fails.

  **Conclusion**

  Reconstructing Adam Smith's anti-imperialism around "sympathetic jurisdiction" does not deny the economic validity of his critiques; rather, it provides the underlying moral architecture that explains *why* those economic failures occur. Empire creates a zone where the impartial spectator cannot tread. In America, legislative distance created laws born of ignorance; in India, corporate distance created administration born of plunder.

  However, this interpretation must remain tentative. It relies on reading *The Wealth of Nations* as a continuation of the moral project of *The Theory of Moral Sentiments*. If future scholarship demonstrates that Smith viewed the two spheres as distinct, or if his policy prescriptions prioritize aggregate wealth over the moral conditions of rule, the standard economic reading must prevail. Until then, viewing Smith as a theorist of the moral limits of power offers a richer understanding of why he believed that some things are simply too far away to be governed.
