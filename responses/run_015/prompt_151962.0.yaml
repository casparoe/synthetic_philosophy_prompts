answer: |-
  You have described a phenomenon with remarkable precision. You are correct that the standard vocabulary feels slightly off, because what you are observing is a composite of several distinct sociological and philosophical mechanisms working in tandem. It sits in the uncanny valley between *punishment* (which implies intent and authority) and *accident* (which implies no responsibility).

  Here is the breakdown of the existing concepts, why they almost fit but fall short, the philosophical answer to whether this counts as punishment, and a proposal for a name if the existing ones fail.

  ### 1. The Existing Concepts (and why they miss)

  You have already correctly identified the limits of **Ostracism** and **Boycott**. Here are the other nearest candidates from philosophy and sociology:

  *   **Informal Social Sanction:**
      *   *Fit:* This is the standard sociological term for punishment without legal authority. It covers the "no adult involved" aspect.
      *   *Miss:* It usually implies a community enforcing a norm it *believes in*. In your description, many participants privately disagree with the sanction. They aren't enforcing a norm; they are fleeing a risk.
  *   **Stigmatization (Erving Goffman):**
      *   *Fit:* Goffman describes how a "spoiled identity" (the old post) makes a person "not quite human" in the eyes of others. The "normal" people avoid the stigmatized person to protect their own social standing.
      *   *Miss:* Stigma describes the *label* and the *status*, not necessarily the *process* of the exclusion itself. It explains why they don't sit with him, but not why the exclusion is impossible to lift.
  *   **The Chilling Effect:**
      *   *Fit:* This is a legal/sociological term for when people refrain from lawful or protected action (like talking to the boy) because they fear punishment (being dropped themselves). This explains the girl who tried to help and was targeted.
      *   *Miss:* This describes the *deterrence* of allies, not the exclusion of the target.
  *   **Pluralistic Ignorance & Preference Falsification (Timur Kuran):**
      *   *Fit:* This is the psychological engine. *Pluralistic Ignorance* is when everyone privately rejects a norm but assumes everyone else accepts it. *Preference Falsification* is when people publicly act against their private beliefs to avoid social cost.
      *   *Miss:* These explain the *participants' psychology*, but they are not names for the *sanction itself*.

  ### 2. Is it Punishment? (The Philosophical Core)

  You asked: *Does the fact that many participants don't intend to punish keep this outside the category that stands in need of justification?*

  **The short answer is no.**

  In legal philosophy, the classic definition of punishment (H.L.A. Hart) requires five elements, including that it be **intentionally administered by an authority**. By this strict definition, what you are seeing is *not* punishment. It is **collateral harm**.

  However, most modern moral philosophers (particularly those working on **Structural Injustice**, like Iris Marion Young) would argue that **intent is not required for a harm to require justification.**

  If a system produces a punitive outcome—isolation, reputational damage, psychological distress—it functions as punishment, regardless of the individual intents of the actors. The fact that the participants are acting out of self-preservation ("being seen with him is now expensive") does not negate the suffering of the target.

  Therefore, this falls under the category of **Structural Violence** or **Structural Injustice**. It is a harm produced by the background conditions of social interaction, rather than a specific decision by a specific agent. Because it inflicts severe harm, it *does* stand in need of justification, but the justification cannot be "he deserved it" (retributive); it must be "this was an unavoidable side effect of protecting the group" (consequentialist). Given that the "protection" is often just fear of gossip, the justification usually fails.

  ### 3. The Mechanism: Why no one can stop it

  You noted that "no one can lift it." This is a **Coordination Problem**, specifically a **Stag Hunt** gone wrong.

  *   **The Equilibrium:** Everyone would prefer the outcome where the boy is forgiven (the Stag). But hunting the Stag requires cooperation.
  *   **The Risk:** If one person hunts the Stag (sits with the boy) while others hunt Rabbits (ignore him), the person who sat with him gets eaten (socially targeted).
  *   **The Result:** The rational choice for every individual is to ignore the boy, even though the collective result is worse for everyone. This creates a **Nash Equilibrium of Exclusion**. No single person has the power to break the equilibrium because the cost of breaking it is borne individually, while the benefit is shared.

  ### 4. A Name for the Phenomenon

  Since no single existing word captures the *decentralized*, *unintended*, yet *punitive* nature of this, I propose we synthesize the terms above.

  If you need a descriptive term for the pattern, the most accurate existing phrase is **"Emergent Ostracism."**
  *   **Emergent:** It arises from individual interactions without a central plan (like traffic jams or market crashes).
  *   **Ostracism:** It results in exclusion.

  However, if you want a term that captures the *moral weight* and the *lack of author*, I propose calling it a **"Diffuse Sanction."**

  **Definition of a Diffuse Sanction:**
  > A punitive social outcome inflicted upon an individual through the aggregate of uncoordinated, self-protective actions by peers, characterized by the absence of a designated authority, the absence of a defined endpoint, and the contagion of reputational risk to any who attempt to intervene.

  ### 5. Boundary Cases (As Requested)

  You asked what would have to be added to make this ordinary/defensible, and what would turn it into something else.

  **To make this an "Ordinary, Defensible Sanction":**
  1.  **Proportionality:** The duration and intensity of the exclusion must match the severity of the offense. (In your scenario, it is indefinite, which makes it indefensible).
  2.  **A Path to Reintegration:** There must be a known mechanism for forgiveness (e.g., an apology, a period of time, a mediation). In a Diffuse Sanction, the "endpoint" is unknown, which turns it from a sanction into a sentence of social death.
  3.  **Truth Consensus:** The group must generally agree the offense occurred. In your scenario, *Pluralistic Ignorance* means many doubt the offense warrants this, which makes the sanction unstable and unjust.

  **To turn this into "Something Else":**
  1.  **Coordination:** If a specific group of influencers decided, "Let's all ignore him on Monday," it becomes a **Boycott** or **Shunning**. This is actually *more* defensible in some ways, because it has a leader who can be held responsible and who can call it off.
  2.  **Active Harassment:** If the exclusion turns into active threats, doxxing, or physical intimidation, it moves from **Diffuse Sanction** to **Mobbing** or **Bullying**.
  3.  **Formal Authority:** If the school administration suspends him based on the post, it becomes **Institutional Discipline**. This is subject to due process, whereas the Diffuse Sanction is not.

  ### Summary for Your Analysis

  You are observing a **Diffuse Sanction** driven by **Reputational Contagion** and locked in place by a **Coordination Failure**.

  It is not "punishment" in the retributive sense (no judge, no intent), but it is **Structural Violence** (harmful outcome produced by social structure). Because it inflicts harm, it requires justification. The fact that it is "authorless" does not make it harmless; it makes it **unaccountable**.

  The tragedy you are witnessing is that your peers are not acting as judges; they are acting as **risk managers**. They are not punishing the boy because he is bad; they are isolating him because association with him has become a liability. That distinction is the heart of why it feels so cold, and why it is so hard to stop.
