answer: |-
  Here is a precisely stated principle designed to match your verdicts while resolving the tensions you identified. I call it **The Discontinuity and Mediation Principle**. It replaces your "Plan-Revision" clause with a stricter test for *unexpected constraint*, and your "Direction" clause with a test for *strategic mediation*.

  ### The Principle

  **A non-human factor X is a historical actor if and only if it satisfies all three clauses:**

  1.  **Discontinuity:** X must introduce a break in the continuity of constraints facing the agents within the narrative's timeframe. It must alter the cost-benefit analysis of available actions in a way that was not priced into their prior calculations. (This distinguishes *events* from *parameters*.)
  2.  **Mediation:** The outcome attributed to X must flow from how agents *reorganized* their strategies in response to X, not from the physical force of X alone. The chain of causation must pass through documented human decisions, not statistical correlation. (This distinguishes *influence* from *determinism*.)
  3.  **Provenance:** Where the vulnerability to X was constructed by prior human choices, X is an 'invited actor'. It retains agency status, but the moral and causal weight is shared with the architects of that vulnerability. (This preserves your 'Invitation' clause.)

  ### Motivation for the Clauses

  *   **Discontinuity (vs. Plan-Revision):** Your original "Plan-Revision" clause rightly excluded coal, but made you uneasy because it seemed to demote slow geography forever. This clause clarifies *why*: Coal is a **parameter** (a constant constraint that agents plan around over centuries); Tambora is a **shock** (a variable constraint that invalidates existing plans). Parameters set the stage; shocks change the play. This validates your Coal verdict without requiring you to apologize for it.
  *   **Mediation (vs. Direction):** Your "Direction" clause warned against substituting X for decision. This clause tightens that by demanding *strategic reorganization*. This is the knife that separates the Black Death from the Antonine Plague.
      *   *Black Death:* The outcome (end of serfdom) required lords to attempt wage freezes and peasants to revolt. That is strategic reorganization.
      *   *Antonine (Suspicious):* Often cited as "Rome fell because population dropped." That is a change in numbers, not necessarily a change in strategy. If the narrative cannot show *which decisions* changed because of the plague, it fails the Mediation clause and becomes determinist hand-waving.
  *   **Provenance:** This preserves your nuance on the Potato Blight and the 1953 Flood. The water is the shock, but the death toll is the invitation.

  ### Verdicts on Your Four Test Cases

  1.  **A monsoon that fails to arrive (Absence):**
      *   **Verdict:** **Actor.**
      *   **Reasoning:** Satisfies *Discontinuity*. Agents priced in the rain; its absence breaks the continuity of the agricultural cycle. Satisfies *Mediation* if the narrative shows how agents changed behavior (migration, price gouging, revolt) rather than just starving passively.
  2.  **A storm anticipated and built against, arriving as forecast:**
      *   **Verdict:** **Condition.**
      *   **Reasoning:** Fails *Discontinuity*. The storm was priced into the calculations (the sea wall). It is part of the operational environment, not an interruption of it. It tests the condition, but does not become an actor unless it exceeds the forecast.
  3.  **A flood whose height was natural, but damage determined by zoning:**
      *   **Verdict:** **Invited Actor.**
      *   **Reasoning:** Satisfies *Discontinuity* (the water was unexpected) and *Provenance* (the damage was invited). The water is the actor that triggered the event; the zoning is the actor that determined the scale of the tragedy.
  4.  **The exhaustion of a resource known to be finite:**
      *   **Verdict:** **Condition.**
      *   **Reasoning:** Fails *Discontinuity*. If agents knew it was finite, the exhaustion is the terminal point of their existing plan, not a disruption of it. It becomes an Actor only if the *rate* of exhaustion surprised them, forcing a premature revision of plans.

  ### Honest Conflicts: Where the Principle Pushes Back

  **1. The Coal Verdict**
  *   **Conflict:** You are uneasy about calling coal a mere "condition."
  *   **Principle's Stand:** The principle holds firm. Coal is a Condition.
  *   **Resolution:** Do not drop the verdict. Your unease stems from conflating *causal significance* with *agency*. Coal is arguably the most *significant* factor in 19th-century Britain, but it was not an *actor*. It did not make decisions, nor did it surprise the agents who exploited it. It was the board upon which the game was played. To call it an actor risks animating geology. Keep it as a Condition, but acknowledge that Conditions often exert more gravitational pull than Actors.

  **2. Black Death vs. Antonine/Justinian**
  *   **Conflict:** You accept the Black Death as an actor for social change but reject the Antonine plague for similar claims.
  *   **Principle's Stand:** The principle distinguishes them based on **Mediation**, not the pathogen itself.
  *   **Resolution:** The Black Death narrative usually contains specific mechanisms (Statute of Labourers, Peasants' Revolt). The Antonine narrative often relies on macro-correlation (Plague $\rightarrow$ Weak Empire $\rightarrow$ Fall). The principle forces you to reject the Antonine claim *only if* the narrative lacks the strategic link. If a historian can show "Legion X could not recruit, forcing General Y to abandon Province Z," the Antonine plague passes the test. Your suspicion is correct: most narratives fail the Mediation clause.

  ### The Simpler Rival

  **The Rival Principle:** **The Counterfactual Test.**
  *   *Statement:* X is an actor if, had X not occurred, the outcome would not have happened.
  *   *Simplicity Cost:* This overturns your **Coal** verdict. If there were no coal in Britain, the Industrial Revolution would not have happened there (or at all). Therefore, Coal is an actor.
  *   *Why you should reject it:* This collapses the distinction between *scenery* and *player*. It makes geography, biology, and physics indistinguishable from human intention. It invites the environmental determinism you wish to avoid by granting agency to anything necessary for an outcome. It buys simplicity at the cost of analytical precision.

  ### The 1918 Influenza and the End of WWI

  **Verdict:** **Actor.**

  **Application of the Principle:**
  1.  **Discontinuity:** The pandemic struck in 1918, late in the war. It was not priced into the 1917 strategic calculations of the German High Command. It abruptly altered the physical constraint of troop availability.
  2.  **Mediation:** The outcome (German collapse) did not flow from the virus killing soldiers alone (physical force), but from Ludendorff's decision that he could not hold the line against fresh American troops while his own ranks were decimated by sickness (strategic reorganization). The flu forced a revision of the military plan.
  3.  **Provenance:** The severity was an 'invited' condition (trench warfare, troop movements), but the onset was natural.

  **Why this is not the "distrusted explanation":**
  You distrust explanations where a pathogen is used as a "master key" for vague civilizational shifts (Antonine $\rightarrow$ Christianity). The 1918 Flu case is mechanistic and proximate. It does not explain the *causes* of the war, nor the *rise of the West*. It explains a specific strategic impasse in a specific window (Autumn 1918). It fits the Black Death model (labor market shock), not the Antonine model (civilizational decline). You can accept the Flu as an actor in the *ending* of the war without slipping into determinism, provided you do not claim it decided the *moral* outcome, only the *timing* of the armistice.
