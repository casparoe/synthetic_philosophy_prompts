prompt: |-
  I'm on the Joint Committee on Campus Labor and Academic Culture at my university — we have to issue a recomendation by next Friday about whether to adopt a mandatory 35-hour work-week cap plus an after-hours communication blackout for all admin and research staff. The proposal came up after a staff member collapsed from exhaustion last semester; people are calling it our little karoshi moment, though maybe that's too dramatic. The union wants it, but the provost's office says research doesn't clock out like factory labor, and forcing rigid hours insults the vocation of scholarship — they keep invoking that old Weber idea about work as a calling tied to salvation anxiety, though I'm not convinced they actually read him. Meanwhile a few committee members are arguing that if we frame rest purely as 'recovery time for productivity,' we're not really challenging the Protestant work ethic, just managing it more humanely; they want the memo to ask whether leisure is a right in itself, not just a health measure, and to use the greek distinction between labor and schole if it actually clarifies anything.

  Can you draft the memo I'll circulate before Thrusday's meeting? It needs to recomend one concrete course — approve the cap with blackout, reject it, or approve with conditions — and include a specific timeline, like a pilot by fall or full rollout by January. I want it to take the philosophical issue seriously: who actually has a right to leisure, and does a policy like this honor that right or just reproduce the work ethic in softer form? You have to engage the strongest argument from the side you end up opposing — probably either the provost's vocational-flexibility point or the worry that we're medicalizing rest rather than recognizing it. And please, don't lay out every option and leave me hanging — take a definite position and defend it, with reasons. I'm tired of committee documents that read like a wikipedia summary and don't actually say anything.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Joint Committee on Campus Labor and Academic Culture.
      *   **Task:** Draft a memo to circulate before Thursday's meeting (deadline is next Friday for the recommendation).
      *   **Topic:** Recommendation on a mandatory 35-hour work-week cap + after-hours communication blackout for admin and research staff.
      *   **Context:** Triggered by a staff collapse ("karoshi moment"). Union supports it. Provost opposes it (citing Weber/vocation/scholarship nature). Some members worry about "medicalizing rest" vs. "leisure as a right" (labor vs. *schole*).
      *   **Requirements:**
          *   Take a *definite position* (Approve, Reject, or Approve with Conditions). No fence-sitting.
          *   Include a specific timeline (Pilot by Fall or Rollout by January).
          *   Engage seriously with the philosophical issues (right to leisure, Protestant work ethic, *labor* vs. *schole*).
          *   Engage the strongest argument from the opposing side (either Provost's vocation argument or the "medicalizing rest" argument).
          *   Tone: Professional but decisive, intellectually rigorous, not a "Wikipedia summary."

  2.  **Determine the Position:**
      *   *Option A (Reject):* Hard to justify given the staff collapse and the committee's likely leaning towards labor welfare. Risks looking out of touch.
      *   *Option B (Approve Unconditionally):* Strong on labor rights, but might ignore the practical realities of research/academic cycles (grant deadlines, conference seasons). Might trigger immediate pushback from the Provost that kills the proposal.
      *   *Option C (Approve with Conditions/Pilot):* This allows for a decisive "Yes" on the principle while acknowledging the complexity of academic work. It creates space to test the philosophical claim (leisure as right) without breaking research momentum immediately. It also allows for engaging the "medicalizing rest" critique by framing the pilot as an experiment in *culture*, not just health.
      *   *Decision:* **Approve with Conditions (Pilot Program).** This is the most actionable and defensible position. It commits to the cap/blackout but acknowledges the need for structural adjustment.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the recommendation clearly and immediately. No waffling.
      *   **The Philosophical Core (Leisure vs. Productivity):** Address the committee members' concern about "medicalizing rest." Argue that while the *trigger* was health (collapse), the *justification* must be ethical (right to disconnect). Use the *labor* vs. *schole* distinction requested.
      *   **Engaging the Opposition (The Provost/Weber):** The prompt asks to engage the strongest argument from the side I oppose. If I recommend the cap, I oppose the Provost. Their argument is "scholarship is a calling/vocation, not factory work." I need to refute this without dismissing the nature of scholarship. *Counter-argument:* True vocation requires freedom, not bondage. Burnout kills scholarship. Weber's "calling" shouldn't mean self-destruction.
      *   **Engaging the Internal Critique (Medicalizing Rest):** Acknowledge that framing rest *only* as recovery for productivity is insufficient. Rest must be intrinsic.
      *   **The Recommendation (Concrete Plan):** 35-hour cap + Blackout.
      *   **Timeline:** Pilot starting Fall Semester, review in December, full rollout January.
      *   **Conditions/Exceptions:** Need to account for the "research doesn't clock out" reality. Maybe a flexible banking system or specific exemption protocol that doesn't undermine the rule.
      *   **Closing:** Call to action for Thursday's meeting.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is the *schole* distinction useful? *Schole* means leisure/free time used for higher learning, distinct from *ponos* (toil). In a university, admin staff don't always get *schole*, they get *ponos*. The policy aims to give them time that *could* become *schole*, or at least rest.
      *   *Critique:* The Provost's Weber argument. Weber did link the calling to salvation anxiety. I need to point out that modern academia has twisted this into exploitation.
      *   *Tone Check:* Ensure it doesn't sound like a neutral summary. Use phrases like "I recommend," "We must," "This is insufficient."
      *   *Timeline:* The prompt asks for "Pilot by Fall or Full Rollout by January." A Pilot by Fall allows for a decision on Full Rollout by January. Let's go with **Pilot beginning Fall Semester, with Full Rollout contingent on review by January.** Actually, the prompt asks to recommend one course. Let's be bolder. **Approve for Pilot Implementation beginning Fall Semester, with a mandate for Full Rollout by January 1st unless specific metrics fail.** No, let's keep it decisive: **Approve the Cap and Blackout as a Pilot Program beginning the Fall Semester, with a commitment to Full Institutional Rollout by January.**

  5.  **Final Polish:**
      *   Check word count and flow.
      *   Ensure the "medicalizing rest" critique is addressed (don't just say rest makes you work better).
      *   Ensure the Provost's argument is addressed (vocation isn't servitude).
      *   Make sure the "karoshi" reference is handled respectfully but firmly.

  6.  **Final Review against constraints:**
      *   Definite position? Yes (Approve Pilot -> Rollout).
      *   Timeline? Yes (Fall Pilot, Jan Rollout).
      *   Philosophical engagement? Yes (Leisure as right, *schole*, Weber).
      *   Opposing argument engaged? Yes (Provost's vocation argument).
      *   No Wikipedia summary style? Yes, persuasive voice.

  *(Self-Correction on Timeline)*: The prompt says "include a specific timeline, like a pilot by fall or full rollout by January." I should pick one clear path. A Pilot by Fall is more realistic for a committee recommendation, but I need to commit to the *principle*. I will recommend **Adoption of the Policy as a Pilot Program beginning Fall Semester, with Full Rollout scheduled for January.** This bridges the gap.

  *(Refining the "Medicalizing Rest" point)*: The prompt mentions members worry about framing rest as "recovery time for productivity." I need to explicitly state that the policy is *not* about making them work harder during the 35 hours, but about their right to exist outside work.

  *(Refining the Weber point)*: The Provost uses Weber to say "work is a calling." I need to say "A calling cannot be coerced by email at 9 PM."

