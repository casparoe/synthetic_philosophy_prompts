  **The question**
  This essay asks whether an ant colony satisfies the functional criteria for single subjecthood, rather than asking directly if it possesses consciousness. Specifically, it investigates whether functional dissociation and memory localization can determine if the colony is a genuine cognitive agent or merely an aggregate. By shifting from metaphysical speculation to testable functional criteria, the project seeks a determinate answer regarding the colony's status as a thinking thing. The focus is on whether methodological tools from cognitive science can resolve the ontological status of collective entities.

  **Why the usual arguments don't settle it**
  Existing debates rely heavily on the structural analogy between ants and neurons. Proponents of collective cognition argue that isomorphism implies functional identity, suggesting the colony thinks as a brain does. Critics accept the structural similarity but deny it entails ontological unity, viewing the colony as a distributed system without a central subject. Because both sides accept the analogy but disagree on its implications, the argument reaches a dialectical stalemate. Metaphysical claims about emergence remain unverifiable without functional evidence. Consequently, structural comparison alone cannot settle whether the colony is a subject or an aggregate. We require a criterion that bypasses structural analogy and focuses on the behavioral and functional consequences of damage, similar to clinical neuropsychology. This moves the debate from what the colony *is* to how the colony *behaves* under stress, offering a path to verification that pure metaphysics lacks.

  **Method**
  Term one involves researching functionalism and collective cognition literature to establish the theoretical framework. Term two focuses on formulating the 'lesion criterion' derived from neuropsychology, defining what constitutes a dissociable deficit versus general degradation. Term three applies this to ant colony cases, analyzing empirical data on caste removal and pheromone blocking to identify specific capacity losses. I will map specific colony disruptions to cognitive capacities like memory, division of labor, and response to threat. I will compare these maps to clinical definitions of dissociation. I will draft the functional argument first, then insert the nest scenario as a limiting case. This sequential approach manages the workload. Both sub-questions fit within six months only if the nest question is strictly bounded as a subsidiary test of memory localization within the functional framework, preventing scope creep. I will prioritize the lesion test; the nest question will be included only if the functional analysis is completed by month four. This ensures the core argument is secure even if the secondary thought experiment must be condensed.

  **Possible outcomes**
  If damage causes specific, dissociable deficits, this supports single subjecthood. If damage causes general degradation, it supports the aggregate view. If the nest retains 'memory' without ants, it challenges individual-based cognition and suggests environmental coupling. Even a negative result is valuable: it demonstrates the limits of applying psychological criteria to collectives. All outcomes are writable because the essay's core contribution is the application of the method itself, not necessarily proving the colony is a mind. A conclusive rejection of the method is as philosophically significant as a successful application.

  **What would count as failure**
  Failure is resolving metaphysics rather than testing methodological criteria. It includes failing to integrate the nest question, forcing its removal to meet the word count. Six months suffices for the lesion test, but the nest question risks scope creep. If the analysis becomes a separate Ship of Theseus debate, the essay loses focus. Success depends on maintaining the functionalist lens. If the nest question threatens the deadline, it will be dropped to preserve the core argument's depth.
