  *   *Case 1:* **Valence Theory vs. Curve-Fitting Stoichiometry.** Early 19th century. You can predict weights without bonds (observational). You can't synthesize new molecules without bonds (interventional).
  *   *Case 2:* **Semmelweis/Handwashing (Medical/Bio).** Observational: correlation of ward and fever. Interventional: chlorine wash. This is a classic causal inference case, but framed through complexity? Maybe too simple.
  *   *Better Case 2:* **The discovery of the neutron.** Observational: radiation data. Interventional: Bombardment leading to transmutation. Chadwick vs. Curie-Joliot. The "program" to predict the data was similar, but the "program" to manipulate the nucleus required the neutron hypothesis.
  *   *Decision:* Let's stick to **Chemical Structure (Kekulé)** and **Neutron Discovery (Chadwick)**. Both involve physics/chem, fit the user's background, and clearly distinguish prediction from manipulation.

  8.  **Final Polish:** Check tone. Ensure it sounds like a fellowship pitch. (Proceed to generate output).

  *(Wait, one last check on the "Smuggling" argument)*: I need to make sure I articulate *why* this might be cheating. Solomonoff is supposed to be universal and objective. If we define the "output" to include "what happens if I push X," we are assuming the universe *allows* pushing. That's a causal assumption. The proposal needs to highlight this tension.

