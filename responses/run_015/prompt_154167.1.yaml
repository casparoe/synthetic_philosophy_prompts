answer: |-
  **Project Title:** Interventional Algorithmic Simplicity: Does Causal Structure Reduce Kolmogorov Complexity in Theory Choice?

  **1. The Precise Research Question**
  Standard Solomonoff induction ranks hypotheses by the length of the shortest program that reproduces observed data strings ($K(Data|Hypothesis)$). This project asks: **Does scientific theory choice minimize the length of a program that generates *observational data*, or the length of a program that generates *interventional counterfactuals*?**

  Specifically, if we define the "output" of a theory not just as a sequence of observations $O$, but as a mapping of interventions to outcomes $(I \to O)$, does the resulting "Interventional Kolmogorov Complexity" better correlate with historical cases where scientists rejected observationally equivalent theories? Alternatively, does defining complexity over interventions illegitimately "smuggle" causal ontology into a framework designed to be purely syntactic and observational?

  **2. Why Standard Bayesian Simplicity Priors Do Not Settle This**
  In a standard Bayesian framework, we assign a prior $P(H) \propto 2^{-K(H)}$. The problem arises when two distinct causal models, $H_1$ (Causal) and $H_2$ (Acausal/Phenomenological), possess identical Kolmogorov complexity and fit the observational data equally well.

  For example, a phenomenological equation fitting reaction rates and a mechanistic model deriving those rates from molecular collisions may have similar string lengths and predictive accuracy on existing data. A standard simplicity prior cannot distinguish them because it treats the theory as a compression of *past* data. It lacks a penalty for "brittleness"—the failure of the model to compress the space of *possible manipulations*. If scientists consistently prefer the mechanistic model despite equal observational fit and complexity, it suggests their "Occam's Razor" is actually cutting over a space of interventional possibilities, not just observational strings. This project investigates whether that intuition holds water or if it is a post-hoc rationalization.

  **3. Methodology: Comparative Case Analysis**
  This project will not develop new formal mathematics. Instead, it will apply the conceptual lens of Interventional Complexity to two historical case studies where observational equivalence was broken by manipulative capacity. The goal is to reconstruct the "program length" intuition informally.

  *   **Case Study A: Structural Theory vs. Stoichiometric Empiricism (1850s Chemistry)**
      *   *Context:* Early 19th-century chemistry could predict mass ratios (observational data) using Berzelius's electrochemical dualism or pure stoichiometric tables without positing specific bond topologies.
      *   *Analysis:* Compare the "program length" required to encode the composition of known compounds (observational) vs. the program length required to encode the *synthesis pathways* of isomers (interventional).
      *   *Hypothesis:* The Structural Theory (Kekulé/Couper) may have been "longer" or equally complex observationally but "shorter" interventionally because it compressed the rules of synthesis into a unified graph theory, whereas the empiricist view required ad-hoc rules for each new reaction.

  *   **Case Study B: The Neutron Hypothesis vs. Gamma Radiation (1932 Physics)**
      *   *Context:* The Curie-Joliots observed neutral radiation penetrating paraffin. A "gamma ray" hypothesis could fit the energy data (observational) but required complex, ad-hoc conservation adjustments to explain proton recoil. Chadwick's neutron hypothesis fit the same data.
      *   *Analysis:* Evaluate the complexity of the "gamma program" vs. the "neutron program" when the output requirement includes *nuclear transmutation outcomes* under bombardment (intervention).
      *   *Hypothesis:* The gamma hypothesis explodes in complexity when forced to output correct results for varied target materials (interventions), whereas the neutron hypothesis remains compact. This would suggest scientists implicitly minimized interventional complexity, not observational complexity.

  **4. Scope and Feasibility (6 Months, Part-Time)**
  *   **Months 1-2:** Literature review on recent intersections of Algorithmic Information Theory (AIT) and Causal Inference (Pearl/Spirtes). Focus on philosophical critiques of "causal Kolmogorov complexity."
  *   **Months 3-4:** Drafting the case study reconstructions. This involves reading historical primary/secondary sources to map the theoretical commitments to "code length" analogies without forcing the math.
  *   **Months 5-6:** Synthesis and writing. Determining if the "smuggling" charge holds (i.e., did we need to assume causality to define the complexity, or did the complexity reveal the causality?).
  *   *Feasibility Note:* By avoiding new theorem proving and sticking to conceptual reconstruction of known history, this is manageable for a retired researcher working 10-15 hours a week.

  **5. Success and Failure Conditions**
  *   **Success:** The project produces a clear demonstration that in at least one case study, the "winning" theory was *not* the simplest compression of observational data, but *was* the simplest compression of interventional data. This would argue that scientific Occam's Razor is inherently modal/causal, not just syntactic.
  *   **Failure:** The analysis reveals that "Interventional Complexity" is indistinguishable from "Observational Complexity" in these cases (i.e., the causal model was just shorter overall), or that the historical record shows scientists chose theories based on aesthetic/metaphysical grounds unrelated to manipulative compactness. If the concept of "Interventional Complexity" turns out to be just a restatement of "explanatory power" without adding formal precision, the project has failed to add value.

  **6. Expected Output**
  A 15-20 page position paper suitable for a workshop on Formal Epistemology or Philosophy of Chemistry, arguing either for the necessity of causal priors in induction or exposing the limits of applying AIT to scientific realism.
