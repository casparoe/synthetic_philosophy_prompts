answer: |-
  The heat in the back of *Sal's All-Nighter* didn't just sit; it pressed. It was a physical weight on Elena's shoulders, smelling of old grease and bleach. She stood at the pass, plating hash browns, watching the moral architecture of the shift assemble itself before her eyes.

  It started with Mike.

  Mike was twenty minutes late. Again. When Jerry, the shift manager, poked his head through the swinging doors and asked where the prep cook was, Elena felt the answer rise in her throat like bile. It wasn't a thought. It was a reflex. *Traffic was bad. His car wouldn't start. He's sick.*

  She chose *car trouble*. She said it with a straight face, wiping her hands on her apron. Jerry nodded, accepted the lie, and vanished.

  Elena froze. She hadn't weighed the consequences. She hadn't considered that Mike was unreliable, or that Jerry was stressed, or that honesty might be better. She had simply executed a command. *Protect the tribe. Maintain stability.*

  It reminded her of a documentary she'd seen years ago. The sphex wasp. It drags a paralyzed cricket into a burrow, leaves it outside to check the hole, drags it in, leaves it to check again. If you move the cricket while the wasp is inside, the wasp comes out, puts the cricket back on the threshold, and checks the hole again. It can happen forty times. The wasp doesn't think; it runs a script.

  *Am I the wasp?* Elena thought, picking up the spatula.

  The second test came an hour later. The last slice of cherry pie sat in the display case. Mrs. Gable, a regular who tipped twenty percent but treated the staff like servants, pointed at it through the glass. At the same time, Danny, the new dishwasher, looked at it. Danny was nineteen, living in his car, and hadn't eaten since yesterday.

  The script loaded instantly. *Give it to Gable. She pays. Danny is replaceable. Don't cause a scene.*

  Elena felt the neural pathway light up. It was identical to the lie for Mike. It was a calculation of utility disguised as instinct. She wasn't choosing; she was processing inputs. *Regular > New Hire. Money > Need.*

  She plated the pie for Mrs. Gable. Danny looked at his shoes.

  Elena put the spatula down. The rush was dying down. The silence between the clatter of dishes was loud enough to think in. She realized her friend was right. There was no homunculus inside her head steering the ship. There were just nested loops. Loyalty loops. Efficiency loops. Survival loops. She wasn't a moral agent; she was a biological machine optimized for diner friction.

  *Okay,* she thought. *Let's disturb the cricket.*

  The next shift, Mike was late again. Ten minutes. Jerry asked the question. "Where's Mike?"

  Elena felt the script load. *Car trouble.* It felt comfortable, like slipping into a warm coat.

  She rejected it. She forced her mouth to move differently. "He's late," she said. "He didn't call."

  Jerry blinked. "Oh. Okay." He wrote something on his clipboard.

  Elena felt a rush of adrenaline. It wasn't pride; it was vertigo. She had interrupted the sequence. She had moved the cricket.

  Then came the pie. There was one slice left. Mrs. Gable wasn't there tonight. But there was a new guy, a temp waiter, looking hungry, and Danny, who still looked tired. The script tried to load: *Give to the temp. He's front of house. Tips flow through him.*

  Elena grabbed the plate. She walked it over to Danny. "Eat," she said. "Before Jerry sees."

  Danny's eyes widened. "Seriously?"

  "Eat."

  She felt electric. She had broken the loop. She had exercised will. She went home that night feeling lighter, as if she'd shed a skin.

  The third shift was a Tuesday. Rain hammered the windows. The diner was half-empty. Mike walked in at exactly 7:00 AM. On time.

  Elena felt a flicker of disappointment. She couldn't protect him because he didn't need it. She couldn't lie. The ethical dilemma was missing. She found herself scanning the room, looking for a crack in the world where she could insert her freedom.

  Jerry walked by. "Everything good back here?"

  *Say no,* a voice whispered. *Say there's a problem. Make something up. Create a conflict so you can resolve it differently.*

  She swallowed. "Yeah. All good."

  But the itch was there. She needed to verify the break.

  At 10:00 AM, the last slice of pecan pie sat in the case. A homeless man came in, ordered coffee, and stared at the pie. A businessman in a suit sat next to him, also eyeing the pie.

  The old script said: *Businessman. Money. Order.*
  The new script—the rebellion script—said: *Homeless man. Justice. Disruption.*

  Elena plated the pie. She walked it to the businessman.

  She stopped halfway. Her hand hovered. Why was she giving it to the businessman? Only to prove she wasn't bound to the rebel script. She was manipulating the outcome to validate her own autonomy. She was checking the burrow.

  *If I give it to the homeless man, I'm following the rebellion loop. If I give it to the businessman, I'm following the counter-rebellion loop.*

  She stood there, tray in hand, steam rising from the ceramic. The homeless man looked at her. The businessman looked at his watch.

  Elena realized the trap. The spontaneity wasn't freedom; it was just a higher-level loop. *Loop 1: Conform. Loop 2: Defy. Loop 3: Monitor the Defiance.*

  She was the wasp. The cricket was her own conscience. She kept dragging it to the threshold of a decision, leaving it there to check the hole of her own motivation, dragging it back to check again.

  She set the pie down on the counter.

  "Who gets this?" she asked them.

  The businessman looked up, annoyed. "You're the server."

  "No," Elena said. "I'm the cook. I don't serve. I just make."

  She turned around and walked back to the kitchen. She left the pie on the pass. It sat there, cooling.

  Jerry walked in five minutes later. He saw the pie. "Who's that for?"

  "Nobody," Elena said. "It's leftover."

  "We can't serve leftover pie off the pass, Elena. Health code."

  "Then throw it out."

  Jerry frowned. He picked up the pie. "Waste of money."

  "Throw it out," she repeated.

  Jerry shrugged and scraped the pecan filling into the trash.

  Elena watched the brown sludge hit the bin. She felt a surge of satisfaction. *I did it. I wasted it. I chose nothing.*

  She went back to flipping burgers. The rhythm was comforting. *Sizzle. Flip. Scrape. Sizzle. Flip. Scrape.*

  At the end of the shift, Mike walked up to her. "Hey, thanks for covering for me last week. Jerry was in a mood."

  Elena looked at him. She remembered the lie. She remembered the truth. She remembered the pie in the trash.

  "I didn't cover for you," she said. "I told him you were late."

  Mike laughed. "Right. Sure. Anyway, I'm late again tomorrow. Can you..."

  Elena felt the script load. *Say yes. Protect the tribe.*
  Then the counter-script loaded. *Say no. Assert boundaries.*
  Then the meta-script loaded. *Say something unexpected. Prove you are watching yourself.*

  She opened her mouth. She knew exactly what she was going to say before she said it. She knew the feeling of the words forming. She knew the satisfaction she would feel when they landed. She knew Mike's reaction. She knew Jerry's reaction.

  It was all mapped out. The burrow was checked. The cricket was in place.

  "Yeah," Elena said. "I got you."

  She wiped her hands on her apron. The motion was exact. The pressure was consistent. She turned to the grill. It was warm. It was waiting. She picked up the spatula. She checked the heat. She checked the oil. She checked herself.

  Everything was in order. The loop held.
