  # Joint Statement on Epistemic Modesty in Philosophical Reasoning

  **Signatories:** The Inside-View Rationalist & The Outside-View Calibrationist
  **Date:** 24 October 2023
  **Subject:** Adversarial Collaboration on Epistemic Norms in Metaphysics and Ethics

  ## Part I: Agreed Claims

  Following sustained engagement, we endorse the following claims as a shared foundation for further inquiry. We acknowledge that while we agree on the existence and description of these phenomena, we diverge on their normative weight.

  1.  **Distinction between Reasoning Modes:** We agree that a conceptual distinction exists between *first-order reasoning* (evaluating the logical coherence, evidential support, and explanatory power of a specific argument) and *reference-class calibration* (evaluating the probability of a claim being true based on the track record of similar claims or agents). Both modes yield distinct types of evidence regarding the likely truth of a proposition.
  2.  **The Self-Reference Problem:** We acknowledge that applying statistical base rates to one's own cognitive processes generates a self-reference problem. An agent cannot simply treat themselves as a random draw from a population without potentially ignoring unique evidence available to them regarding their own reasoning quality, yet ignoring the population data risks neglecting systematic cognitive biases.
  3.  **Conditions of Weak Feedback:** We agree that philosophical inquiry, particularly in metaphysics and ethics, typically operates within environments where feedback loops are too weak, delayed, or ambiguous to support reliable outside-view calibration in the manner of meteorology or chess. There is rarely a definitive, immediate truth signal that confirms or falsifies a philosophical position.
  4.  **Content of Epistemic Modesty:** We agree that epistemic modesty entails a commitment to acknowledging one's own fallibility. It requires that an agent's expressed confidence should not exceed what is warranted by the total available evidence, including evidence about the reliability of the cognitive processes that generated the belief.

  ## Part II: Record of Disagreements

  The following table summarises the remaining substantive disagreements. Each position is phrased to be acceptable to the proponent of that view.

  | Issue | Inside-View Rationalist Position | Outside-View Calibrationist Position |
  | :--- | :--- | :--- |
  | **Normative Priority** | When first-order reasoning reveals a valid argument with robust premises, this evidence should dominate statistical base rates regarding the claim's truth. | When statistical base rates indicate a high frequency of error in a domain, this evidence should constrain confidence levels even in the presence of seemingly robust first-order arguments. |
  | **Source of Error** | The primary risk in philosophical reasoning is the premature abandonment of novel truths due to an over-reliance on conservative consensus or historical failure rates. | The primary risk in philosophical reasoning is overconfidence driven by cognitive bias, which leads agents to overestimate the strength of their own arguments relative to the field. |
  | **Role of Consensus** | Expert consensus is a heuristic proxy for truth but possesses no independent normative force against a superior argument. | Expert consensus constitutes a form of higher-order evidence that rational agents must integrate, as it reflects the aggregated cognitive labour of the reference class. |

  ## Part III: Explicit Cruxes and Scenario Analysis

  We identify three specific cruxes where our disagreement prevents a unified normative framework. For each crux, we apply the same concrete scenario to illustrate how our divergent principles yield different practical recommendations.

  **The Scenario:**
  A philosopher has constructed a novel argument concluding that moral responsibility is incompatible with determinism. She recognises that expert opinion in this area is deeply divided. She is also aware of historical data suggesting that philosophers in this sub-field frequently reverse their positions on compatibility over the course of their careers. She must decide how to calibrate her confidence before publishing.

  ### Crux 1: The Boundary of Dominance
  **Question:** Is there a principled, non-arbitrary boundary between domains where inside-view reasoning legitimately dominates and those where outside-view calibration must take precedence?

  *   **Inside-View Rationalist Prediction:** The philosopher ought to reason primarily from the strength of the novel argument. If the premises are more plausible than their negations and the logic is valid, she should assign high confidence, treating the historical reversal rate as background noise relevant only to *other* agents who lacked her specific argument.
  *   **Outside-View Calibrationist Prediction:** The philosopher ought to reason primarily from the reference class of "arguments regarding compatibilism published in the last century." She should anchor her confidence to the base rate of such arguments eventually being accepted by the majority, adjusting upwards only slightly for her specific insight, as she cannot objectively verify that her argument escapes the common pitfalls that caused prior reversals.

  ### Crux 2: The Nested Reference-Class Problem
  **Question:** Do nested reference-class problems (calibrating against all philosophers, against sub-specialists, or against agents with matching cognitive profiles) render the outside view inapplicable in metaphysics and ethics?

  *   **Inside-View Rationalist Prediction:** The philosopher faces an arbitrary choice in selecting her reference class (e.g., all philosophers vs. metaphysicians vs. metaphysicians with high GRE scores). Because there is no non-circular method to select the correct class without already knowing the strength of her argument, the outside view is inapplicable. She should ignore the statistics and focus on the argument.
  *   **Outside-View Calibrationist Prediction:** While selecting a reference class requires judgement, it is not arbitrary. The philosopher should calibrate against the narrowest class for which reliable data exists (e.g., sub-specialists in free will). The difficulty of selection reduces precision but does not negate the necessity of the correction; ignoring the data because it is imperfect is more dangerous than using it cautiously.

  ### Crux 3: The Nature of Epistemic Modesty
  **Question:** Does modesty function as a first-order epistemic virtue (tracking truth directly) or as a pragmatic hedge against social overconfidence?

  *   **Inside-View Rationalist Prediction:** Modesty is a vice if it causes the philosopher to understate the probability of a truth she has genuinely discerned. She should express confidence commensurate with her first-order assessment. To lower her confidence solely because others disagree is to privilege social consensus over truth-tracking.
  *   **Outside-View Calibrationist Prediction:** Modesty is a tool to align stated confidence with actual accuracy rates over time. She should lower her confidence to match the historical accuracy of agents in her position. This is not a pragmatic hedge but an epistemic requirement, as her "first-order assessment" is likely contaminated by bias that the outside view corrects.
