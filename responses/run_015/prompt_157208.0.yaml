answer: |-
  1. The conceptual example

  Consider a research programme positing that fundamental physical constants are dynamic functions of local spacetime curvature. Within this system, all measurement apparatuses are constructed from matter whose structural stability is governed by these same constants. Consequently, any empirical anomaly suggesting incorrect curvature predictions is structurally reinterpreted as a shift in the apparatus's calibration standards caused by the very curvature being measured. The auxiliary models governing instrument behaviour are not ad hoc additions; they are derived directly from the core theory's equations regarding constant variation. Crucially, revisions to these models are motivated by coherence with other sectors of the network, such as thermodynamic constraints inherent to the curvature model, rather than mere saving of phenomena. For instance, if a clock runs slow, the theory predicts this via time dilation equations derived from the same core axioms as the curvature prediction. Thus, an observation contradicting the predicted curvature is absorbed by recalculating the instrument's response function using the core theory itself. The network is closed: the theory defines the metric, the metric dictates instrument behaviour, and the instrument measures the metric. No raw data exists outside this loop. This creates a structural knot where the condition for falsification is identical to the condition for theory application. While a logical contradiction is possible, no empirical observation can stand as a basic statement independent of the theoretical assumptions required to interpret the instrument's output. The architecture ensures that apparent falsifications are always convertible into confirmations of instrument variability. This is not strategic evasion but epistemic closure; the theory provides the only available language for describing the observation. Consequently, the system remains falsifiable in principle, as a logical contradiction exists, yet in practice, no observation can be accepted without presupposing the programme.

  2. The demarcation diagnosis

  This scenario exposes a structural failure in falsificationism regarding the status of basic statements. Popper acknowledged that observation is theory-laden but insisted that scientists must decide to accept a statement as basic to halt the regress of justification. However, in this architecture, accepting a basic statement requires presupposing the truth of the core theory to decode the instrument's output. The decision to accept an observation is not a conventional halt to regress but a logical consequence of the theory itself. Therefore, the demarcation criterion shifts from whether a theory is falsifiable to whether the decision to accept basic statements is independent. Since the theory dictates the interpretation of all potential falsifiers, the system is immunised against empirical refutation not by ad hoc manoeuvres, but by epistemic necessity. The boundary between science and pseudoscience blurs because the system possesses empirical content in principle yet admits no independent access to those states. The ambiguity moves from the theory's predictions to the validity of the observation language, rendering the falsification condition vacuous in practice. The circularity is embedded in the epistemic architecture, meaning the programme cannot be distinguished from a closed ideological system solely by its logical form.

  3. The strongest defence

  A committed falsificationist would argue that this diagnosis conflates psychological inevitability with logical impossibility. Even if the current community interprets data through this framework, a rival theory could propose a different model of the apparatus that yields contradictory basic statements. The core theory remains falsifiable because it prohibits certain logical combinations of observation reports, regardless of how difficult they are to achieve. Furthermore, falsificationism does not demand that basic statements be theory-free, only that they be intersubjectively testable. If the auxiliary models are independently motivated within the network, they are still open to separate criticism. The scientist can choose to reject the basic statement derived from the instrument rather than the theory, or vice versa. The risk lies in the coherence of the entire system; if the network becomes too convoluted to sustain intersubjective agreement on observations, the programme degenerates. Thus, the demarcation holds because the system remains open to critical debate regarding the interpretation of instruments, preventing permanent immunisation. The logical possibility of refutation remains, even if the practical path is obstructed by theoretical dominance.

  4. What would change my mind

  My reasoning relies on the premise that practical impossibility of independent observation constitutes a demarcation failure. I would reconsider if it were demonstrated that all successful scientific theories exhibit this structural feature to some degree, implying it is a universal condition of empirical inquiry rather than a specific flaw. If every theory-laden observation network eventually stabilises into a similar closed loop, then this circularity cannot distinguish science from pseudoscience. The weakest point in my argument is the assumption that there exists a threshold of independence for basic statements that genuine science meets but this example does not. If independence is always a matter of degree rather than kind, then falsificationism survives as a regulative ideal rather than a structural definition, and my example merely illustrates the difficulty of application, not a failure of the principle itself.
