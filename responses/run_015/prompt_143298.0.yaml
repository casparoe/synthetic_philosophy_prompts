          *   "Self-Undermining": Claiming "Scientific Revolution is an invention" is itself a periodizing claim.
          *   "Future Archivist": 2300 archivists looking at 1900-2100 data (newspapers/catalogues).
      *   **Constraints:**
          *   Question must force a "crux" (no easy "construct" outs).
          *   Model answer must be opinionated/take a line, no footnotes/citations unless necessary.
