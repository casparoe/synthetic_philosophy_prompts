      *   *Drafting:* Start with the premise that periods are tools. Ask them to apply the "Swap Test" logic but deepen it. Ask them to analyze the *divergence* of the three variables (authority, patronage, identity).
      *   *Refining:* Make it specific. "To what extent does the term 'Scientific Revolution' denote a structural break versus a retrospective narrative?" Too standard. Let's use the user's "Swap Test" explicitly.
      *   *Final Polish:* Frame it around the *consequences* of periodization. If we drop the label, what history becomes impossible to write? If we keep it, what history gets distorted?

  3.  **Drafting the Model Answer:**

      *   *Goal:* ~800 words. Opinionated. No fluff. Show, don't just tell, how to avoid the "C-grade constructivism."
      *   *Argument:* Periods are indeed inventions, *but* they are inventions that track real changes in the *ecosystem* of knowledge, even if the content changes gradually. The "Swap Test" fails not because the facts change, but because the *relationships* change.
      *   *Structure:*
          1.  Acknowledge the constructivist point (it's true but trivial).
          2.  Apply the "Three-Variable" test (Authority, Patronage, Identity).
          3.  Show where they diverge (e.g., patronage shifts before authority).
          4.  Address the "Self-Undermining" point (historians inventing the Revolution is itself a historical event).
