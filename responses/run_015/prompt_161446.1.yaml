answer: |-
  **The Arithmetic of Saving**
  He spreads the printouts on the kitchen table, tapping the randomised-trial numbers for the deworming charity. One year of his bonus buys enough pills to clear parasites from a district the size of Wales, preventing cognitive stunting in thousands of kids, whereas his marginal year in epidemiology would have added a single footnote to a paper nobody reads. He says the trading desk is a fixed slot in the machinery; if he walks away, a stranger takes the chair and runs the same algos, so the market impact is constant while the charity gain is lost.

  **The Structure of the Flow**
  I tell him replaceability cuts both ways, that the ledger only shows harms you can count, and that a thousand people each quietly taking a lucrative job isn't a way to change any of the rules that make the money flow. We aren't changing the system by harvesting its excess; we are just becoming its most moral beneficiaries while the underlying volatility remains untouched. The unseen damage isn't in the transaction logs, but in the normalization of the engine itself.

  **The Bottom Line Glows**
  When the spreadsheet actually gets opened, the net comes out positive, and it settles nothing. The green sum at the bottom technically justifies the commute and the stress and the parents' horror, but causing harm and doing good are distinct acts that don't cancel out like debits and credits. He causes that harm and he does that good, and net isn't the same as fine.

  **Buying the Agenda**
  At the donor circle meeting, the facilitator explains how your say over the whole pot scales with how much you put in, placing his new salary in the room where priorities are set. His money isn't just buying pills; it is buying the influence to decide which diseases get studied and which regions are deemed worthy of intervention. He is purchasing agenda-setting power, deciding the shape of the good rather than just funding the execution of it.

  **No Horns in the Office**
  I visit his office in London and see rows of decent, boring men eating sandwiches while monitoring screens of abstract numbers. There are no cult leaders, no hidden doctrines, just the hum of servers and the quiet click of keyboards executing trades that look victimless from this distance. My parents see a fall from grace, he sees a ladder, and I stand in the middle watching the cursor blink on a screen that saves lives by stealing fractions of pennies from people who will never know.
