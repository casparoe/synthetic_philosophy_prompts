  My kid brother just quit an epidemiology PhD to take a quant job in London so he can earn to give — he's writing execution algos for a high-frequency trading firm — my parents are treating it like he joined a cult, and I cant tell who's right, I keep flip-flopping.

  Can you write me a short story that chews on whether his trade is really as clean as it looks? Exactly five scenes, each with a one-line header, each a paragraph or two, no introduction and no wrap-up, and don't let it land on a tidy verdict. The ground I want hit:

  1. his case: a deworming charity with randomised-trial numbers buys way more health per pound than his marginal year of epi would, and if he hadn't taken the desk someone else would have, so the trading is baked into the world either way.
  2. my case: replaceability cuts both ways, the ledger only shows harms you can count, and a thousand people each quietly taking a lucrative job isn't a way to change any of the rules that make the money flow.
  3. a scene where the spreadsheet actually gets opened, the net comes out positive, and it settles nothing — he causes that harm and he does that good, and net isn't the same as fine.
  4. a donor circle where your say over the whole pot scales with how much you put in, so his salary is buying agenda-setting and not just pills.

  Keep the traders boring and decent, and make his job abstract and victimless-looking.
