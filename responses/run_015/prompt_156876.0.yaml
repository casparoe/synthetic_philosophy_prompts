  Here is the audit of your position. You have a coherent normative intuition, but your formal commitments contain a "fatal joint" that your friend (the social choice theorist) is correctly sniffing around, even if you two are arguing past each other on the *reason* why.

  ### The Ranked Conflicts

  **1. The Fatal Technical Conflict: (4) Meddlesomeness Filter vs. (6) Preference Holism**
  *   **Severity:** Critical. This is the weak joint that will break under formal scrutiny.
  *   **The Conflict:** Proposition (6) states that preferences are over whole social states and cannot be carved into components; reasons don't change the preference. Proposition (4) requires you to do exactly that: identify which preferences are "essentially about what someone else does" to exclude them. In standard social choice theory (which your friend is using), a preference is a black-box ordering over outcomes. There is no variable for "reason" or "object of concern" accessible to the aggregation rule.
  *   **What Must Give:** You cannot maintain strict holism (6) and operate a content-based filter (4). To implement (4), you must admit that the *description* of the preference (its intentional object) matters for rights assignment, even if it doesn't matter for the ranking itself.
  *   **The Cost:** You concede that the "informational base" of your theory is richer than standard welfarism allows. You are no longer doing pure social choice theory; you are doing moral philosophy *applied* to social choice. This validates your friend's suspicion that you are smuggling non-welfarist information in, but it saves your solution.

  **2. The Strategic Contradiction: (3) No Cheap Fix vs. (4) Meddlesomeness Filter**
  *   **Severity:** High. This is why you are talking past each other.
  *   **The Conflict:** You claim in (3) that domain restrictions "miss the point" and there is "no cheap fix available by tinkering inside the preference-aggregation framework." However, your solution (4)—excluding meddlesome preferences—is formally identical to the Gibbard (1974) waiver, which *is* a domain restriction inside the preference-aggregation framework. Your friend says "restrict the domain," you say "that misses the point," but you are proposing a domain restriction.
  *   **What Must Give:** You must drop the claim that (4) is *not* a domain restriction. It is.
  *   **The Cost:** You lose the rhetorical high ground that your solution is "outside" the formalism. You must argue instead that it is a *principled* domain restriction derived from the definition of liberty, rather than an *ad hoc* empirical restriction. This shifts the debate from "Is this a restriction?" (Yes) to "Is this restriction justified?" (Your actual argument).

  **3. The Core Tension: (1) Absolute Pareto vs. (2) Rights as Side-Constraints**
  *   **Severity:** Medium (because you acknowledge the paradox in (3), but you try to have both).
  *   **The Conflict:** (1) says Pareto is "zero hesitation... full stop." (2) says rights are side-constraints that settle matters. Sen's theorem proves these are logically incompatible in the presence of diverse preferences. You try to bridge them with (4), but if (4) fails (due to conflict #1), (1) and (2) clash directly.
  *   **What Must Give:** If you keep (4), you are implicitly qualifying (1). Pareto is not "full stop"; it is "full stop *unless* it relies on meddlesome preferences."
  *   **The Cost:** You must admit Pareto is not absolute. This is a small cost for a liberal, but it contradicts your "zero hesitation" phrasing.

  ### The False Conflicts (Dissolve on Care)

  **A. (6) Preference Holism vs. (8) Game Form Solution**
  *   **Why it looks like a conflict:** (6) ties you to outcomes (social states), while (8) ties you to processes (strategies).
  *   **Why it dissolves:** These are different levels of modeling. (6) describes how agents *value* the world; (8) describes how agents *act* in it. You can hold holistic preferences over outcomes while participating in a game form that determines those outcomes. In fact, (8) is the natural escape hatch from the impossibility result generated by (6). You don't need to drop (6) to accept (8); you just need to recognize that (8) changes the *mechanism* of aggregation, not the *structure* of preference.

  **B. (1) Welfarism vs. (7) Case Verdict**
  *   **Why it looks like a conflict:** Welfarism usually implies maximizing preference satisfaction. The verdict "Nobody reads" satisfies fewer preferences (in the raw count) than "Prude reads" (which satisfies the Pareto condition).
  *   **Why it dissolves:** Welfarism requires tracking preferences *according to the rules of evaluation*. If your rules (Rights + Filtered Pareto) dictate "Nobody reads," then that *is* the welfarist optimum under your specific rules. There is no conflict between being a welfarist and having a complex aggregation rule, provided the rule only uses preference information (which you try to ensure with (4)).

  ### The Single Revision

  To clean up the most theoretical mess and stop the circular argument with your friend, you should make this revision:

  **Revise (6) to allow for "Preference Classification" without abandoning Holism.**

  **Current (6):** *"...you can't carve their ranking into a self-regarding component and an other-regarding component... and their reasons for a preference don't change what the preference is."*

  **Revised (6):** *"Preferences are holistic orderings over social states for the purpose of **aggregation**, but the **description of the alternatives** in those states allows us to classify the *jurisdiction* of the preference for the purpose of **rights assignment**."*

  **Why this fixes everything:**
  1.  **Saves (4):** It allows you to implement the Meddlesomeness Filter. You aren't carving the *ranking* (preserving the spirit of holism), but you are looking at the *objects* being ranked (Prude's body vs. Lewd's body) to assign rights. This makes (4) formally operable.
  2.  **Resolves the Friend's Objection:** It admits that you are using more information than a standard Arrovian SWF (validating her formal critique) but argues this information is normatively required by liberalism (validating your theoretical critique).
  3.  **Aligns (3) and (8):** It clarifies that the "fix" isn't a tweak to aggregation, but a refinement of the *input* conditions based on a prior theory of rights. This bridges the gap between your SWF approach and your preferred Game Form approach (8), as game forms also require defining which strategies fall into which personal sphere.
  4.  **Protects (5):** You aren't judging the *virtue* of the reason (noble vs. base), only the *jurisdiction* (self vs. other). This keeps you Anti-Perfectionist.

  **The Cost:** You concede to your friend that standard Social Choice theory (with its black-box preferences) is insufficient for liberal theory. You have to step outside the strict Arrow-Sen informational framework to define the "clean pairs." But that is exactly the point you wanted to make in (3)—so this revision actually strengthens your core thesis while fixing the technical hole.
