answer: |-
  This is a remarkably tight framework. You've done the hard work of separating mechanism, intent, and morality, which most people conflate. Because the structure is strong, the tensions are sharp. You asked for the joints, not a walk-through, so I will focus on the three friction points where your principles grind against each other, rank them by severity, and then address the verdict and the revision.

  ### The Joints

  **1. The Definition vs. The Exception (a vs. b)**
  *   **The Conflict:** This is the structural fault line. Principle (a) defines manipulation mechanistically: if you move someone "through emotion," it counts as routing around their capacity. Principle (b) explicitly exempts ordinary emotional life (eulogies, scared friends) from that definition.
  *   **Why they fight:** As written, (a) swallows (b). A eulogy moves you through emotion; under (a), that is manipulation. You have to ignore the plain text of (a) to keep (b) true.
  *   **Severity:** **Fatal.** This makes your definition incoherent. You cannot define a category by a mechanism (emotion) and then claim instances of that mechanism are not in the category.
  *   **What has to give:** You must remove "emotion" from the list of manipulative mechanisms in (a).
  *   **The Cost:** You lose the clean binary of "Reasons = Persuasion, Emotion = Manipulation." You have to replace it with a more nuanced distinction (see "Single Revision" below).

  **2. The Mechanism vs. The Intent (a vs. c)**
  *   **The Conflict:** (a) defines manipulation by *what happens* (routing around capacity). (c) defines it by *what is intended* (intent to get your way).
  *   **Why they fight:** Suppose I tell you a scary story to stop you from driving drunk, and it works by bypassing your deliberation (fits a). But my intent is your safety, not "getting my way" (violates c). Or suppose I try to manipulate you but fail—(c) says it's still manipulation, (a) implies the mechanism didn't engage.
  *   **Severity:** **High.** This creates a loophole for benevolent controllers. If intent is the gatekeeper (c), then the "nurse" in (d) isn't manipulating, she's caring. But (d) admits she *is* manipulating, just permissibly. (c) and (d) are fighting over whether benevolent bypassing counts as the *act* of manipulation or something else entirely.
  *   **What has to give:** You need to decide if manipulation is a *moralized* concept (requires bad intent) or a *descriptive* one (describes the mechanism). Your list treats it as descriptive in (a) and (g), but moralized in (c).
  *   **The Cost:** If you make it purely descriptive (drop the intent clause in c), you admit that "good" people manipulate all the time. If you make it purely intentional (drop the mechanism in a), you can't identify manipulation when the manipulator is self-deceived (which they often are).

  **3. The Vulnerability Clause vs. The Nudge (e vs. g)**
  *   **The Conflict:** (e) says exploiting vulnerability makes the act worse. (g) says nudges (framing, defaults) are manipulation but okay if they serve the person's ends.
  *   **Why they fight:** Nudges often rely on cognitive vulnerabilities (inertia, bias). If I set organ donation to opt-out because I know you're lazy (vulnerability), is that (g) a benign nudge or (e) exploiting vulnerability?
  *   **Severity:** **Moderate.** This is less a contradiction and more a boundary dispute. It works only if "vulnerability" in (e) means *acute* impairment (exhaustion, grief) while (g) covers *structural* biases.
  *   **What has to give:** You need to clarify that (e) applies to *state* vulnerabilities (temporary deficits in capacity) while (g) applies to *trait* vulnerabilities (standard cognitive shortcuts).
  *   **The Cost:** You have to add a layer of complexity to define which vulnerabilities matter.

  ---

  ### The Verdict on the Ex

  **Does your verdict survive (a) and (e)?**
  **No.** It collapses completely.

  Here is the application of your own rules to the facts you provided:
  1.  **Mechanism (a):** He saved the conversation for the end of a 12-hour shift. You list "timing" explicitly in (a) as a way of routing around capacity. He presented a *fait accompli* (booked visit, talked to landlord), which limits the capacity to weigh reasons by changing the decision from "Should we move?" to "Should we waste the money I already spent?"
  2.  **Vulnerability (e):** She was "wrecked" after a 12-hour shift. You explicitly list "exhausted" in (e).
  3.  **Conclusion:** Under your own framework, this is a textbook case of manipulation. It is not merely manipulation; it is *aggravated* manipulation because of the vulnerability clause (e).

  **Can (e) be narrowed to save the verdict?**
  You could try to narrow (e) to say "vulnerability only counts if the manipulator *caused* the vulnerability." But your text says "Same tactic, worse act," implying the *state* of the target matters regardless of origin. If you narrow (e) to exclude exhaustion, you break the protection for anyone who is tired, grieving, or depressed unless you caused it. That eviscerates the point of having a vulnerability clause.

  **Hard Truth:** You defended him as "persuasion" using a framework that defines his actions as "manipulation." You lost the argument against your own rules.

  ---

  ### The Single Revision

  You asked for the one change that cleans up the most at once. The problem is in **(a)**.

  Currently, (a) says manipulation works by **"routing around that capacity."** This is too vague. It groups "emotion" (which can inform capacity) with "pressure" (which bypasses it). This causes the fight with (b) and creates the confusion on the Ex.

  **The Revision:**
  Change (a) to distinguish between **influencing the inputs** of judgment vs. **impairing the processor** of judgment.

  > *(a) Revised:* Persuasion works by engaging someone's capacity to weigh reasons, adding new information or emotional weight to the scale. Manipulation works by **impairing the capacity itself** or **rigging the scale**—through exhaustion, deception, time-pressure, or pre-committed constraints that make 'no' impossible.

  **Why this fixes the joints:**
  1.  **Fixes (a) vs (b):** A eulogy or a scared friend adds "emotional weight to the scale." It engages your capacity to care, it doesn't impair your ability to think. They are no longer manipulation.
  2.  **Fixes the Verdict:** The Ex didn't just add weight; he impaired the processor (exhaustion) and rigged the scale (pre-booked visit). He is still guilty under the new definition.
  3.  **Fixes (c) Intent:** It shifts the focus from "what did he intend" (which is unknowable) to "what did the tactic do to her agency?" This aligns better with (e) and (g).
  4.  **Fixes (g):** Nudges that align with ends (organ donation) influence inputs/defaults without impairing the processor. Nudges that exploit bias to sell junk food impair the processor.

  **The Cost:**
  You lose the clean simplicity of "Reasons vs. Emotion." You have to accept that emotional appeals are *persuasion*, provided they don't overwhelm the ability to choose. This might feel like conceding ground, but it actually strengthens your position: it allows you to admit the Ex used emotional/timing tactics without having to call *all* emotional tactics manipulation. It lets you say, "I believe in emotional arguments, but what he did wasn't an argument, it was a trap."

  **Summary:**
  Your framework is 90% there, but (a) is over-inclusive. By tightening (a) to focus on **impairment of agency** rather than **use of non-rational means**, you save (b), you clarify (g), and you force yourself to admit the uncomfortable truth about the Ex: he didn't persuade her; he managed her.
