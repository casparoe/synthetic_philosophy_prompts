          *   *Problem:* Reassembly. If I gather the clay again, is it the *same* statue? EPV says "same pattern." But intuition often suggests identity depends on history/causality, not just shape.
          *   *Problem:* Gradual replacement. If I replace clay bits one by one, the clay changes entirely, but the statue persists. EPV struggles here. If only clay exists, and the clay is replaced, the original object (the specific clay) is gone. To save the statue, EPV must admit the "pattern" persists across different matter. But if the pattern can persist across different matter, is it not an entity in its own right?
