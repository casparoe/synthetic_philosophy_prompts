      *   *Key Point:* Leibniz's Law. If $x=y$, they share all properties. Clay can survive melting. Statue cannot. Therefore Clay $\neq$ Statue. If EPV says "Only Clay," it must explain away the statue's properties. It can't.
      *   *Parsimony:* Ontological parsimony isn't free. If you save entities but lose explanatory power, you haven't gained.

