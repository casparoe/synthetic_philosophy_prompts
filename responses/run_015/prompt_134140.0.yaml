answer: |-
  This institutional design is a fascinating artifact of applied metaethics. It operationalizes abstract debates about the status of values into bureaucratic procedure. To analyze it, we must distinguish between the *metaphysics* of value (what values *are*) and the *methodology* of justification (how we argue for them). The Consortium's practice is methodologically pluralistic but metaphysically agnostic, creating a space where Quinean naturalism fits comfortably but is not strictly mandated.

  ### 1. Metaethical Commitments: Strict Presuppositions vs. Comfortable Fits

  Does the two-register practice strictly presuppose a Quinean view? **No.** It strictly presupposes **Methodological Neutralism** regarding the metaphysical status of values.

  *   **What is Strictly Required:** The practice requires only that moral discourse can be meaningfully conducted in at least two distinct modes: one claiming cross-cultural authority (Universalist) and one claiming internal coherence within a tradition (Scheme-Relative). It presupposes that reviewers can distinguish between these modes and evaluate them according to different criteria (correspondence/coherence vs. pragmatic consistency).
  *   **What Fits Comfortably (Quinean Naturalism):** The Scheme-Relative Register is a near-perfect institutional isomorph of Quinean holism. In *Word and Object*, Quine argues that ontological commitments are relative to a background language and that any statement can be held true come what may, if we make drastic enough adjustments elsewhere in the web. By treating values as revisable posits subject to "pragmatic pressure," the Scheme-Relative Register treats normative commitments exactly as Quine treats theoretical entities: as instruments for navigating experience, not mirrors of nature.
  *   **What Also Fits (Realism + Epistemic Humility):** A robust moral realist could endorse this system under the banner of epistemic humility. They might argue: "Moral truths are universal, but human access to them is fallible and culturally mediated. Therefore, we should allow applicants to argue from universal premises *or* from within their specific tradition, provided they are coherent." For the Realist, the Scheme-Relative Register is a concession to human limitation, not a reflection of moral ontology.

  **Reconstructed Implicit Theory:** The implicit metaethical theory is best described as **Pragmatic Pluralism**. It assumes that the *function* of normative discourse in research funding is to ensure coherence and accountability, regardless of whether that accountability is grounded in mind-independent facts or social agreements. It treats the "truth" of a value statement as secondary to its "warranted assertibility" within the chosen register.

  ### 2. The Parallelism of Ontology and Normativity

  The prompt asks to reconstruct the theory that makes sense of treating normative commitments as register-selectable *in parallel* with ontological ones.

  In a strict Quinean framework, there is no sharp distinction between ontology and normativity; both are strands in the web of belief. The Consortium separates them institutionally (two statements), which suggests a residual fact/value distinction. However, the *structure* of the commitments unifies them:
  1.  **Ontological Statement:** "I commit to entities $X$. I will revise auxiliary hypothesis $Y$ to save $X$."
  2.  **Normative Statement (Scheme-Relative):** "I commit to values $V$. I will revise methodological rule $Z$ to accommodate $V$."

  This parallelism presupposes that **normative commitments function as theoretical posits.** Just as a physicist posits a quark to save the phenomena of particle decay, a researcher posits "cultural autonomy" to save the phenomena of social cohesion. The implicit theory is that values, like particles, are **hypothetical constructs justified by their systemic utility.**

  If one were a strict Moral Realist, this parallelism would be tense. A Realist typically holds that we *discover* values, whereas we *posit* entities. To treat them in parallel requires the Realist to adopt a fallibilist epistemology where our *grasp* of values is as revisable as our *grasp* of physics. Thus, the practice leans slightly toward naturalism, as it structurally equates the revisability of values with the revisability of auxiliary hypotheses.

  ### 3. The Ineligibility Clause: Hidden Universalism or Pragmatic Boundary?

  The Consortium prohibits non-consensual experimentation *regardless of register*. Is this inconsistent with the Scheme-Relative Register?

  **The Charge of Inconsistency:**
  If an applicant chooses the Scheme-Relative Register, they are claiming their values are internal to their tradition. If their tradition permits non-consensual experimentation, banning it seems to impose an external (Universalist) constraint, violating the logic of the register they chose.

  **The Quinean Resolution (Pragmatic Boundary):**
  A Quinean would argue there is no inconsistency. The Consortium itself is a **conceptual scheme** with its own web of belief.
  *   **Internal to the Applicant's Scheme:** Non-consensual experimentation may be permissible.
  *   **Internal to the Consortium's Scheme:** Funding is contingent on adherence to Consortium norms.
  *   **The Transaction:** Applying for funding is an act of entering the Consortium's scheme. The ineligibility clause is not a statement about the *universe of moral facts*; it is a **constitutive rule** of the funding practice, akin to saying "You cannot move the King like a Knight in a chess tournament," regardless of whether you believe chess rules are universal or culturally relative.

  **The Realist Resolution (Hidden Universalism):**
  A Realist would argue this *does* reveal a hidden universalist commitment. The Consortium recognizes that some moral constraints (like consent) are objective boundaries that no coherent scheme can override without ceasing to be moral. The Scheme-Relative Register is thus permitted only *within the bounds of objective morality*.

  **Verdict:** The practice is more philosophically consistent with the **Quinean/Pragmatic explanation**. If the Consortium believed in robust Universalism, it would mandate the Universalist Register for *all* core values. By allowing the Scheme-Relative Register for everything *except* specific banned practices, it treats the ban as a local boundary of the institution rather than a discovery of moral law. It treats the ban as a "decision" (in the existentialist sense) or a "posits of the center of the web" (in the Quinean sense) rather than a fact.

  ### 4. Procedural Changes Under Moral Realism

  If the underlying Quinean conventionalism were replaced by a robust Moral Realism (where values are discovered, mind-independent facts), the Consortium's procedures would require significant alteration to remain coherent.

  **A. Peer-Review Criteria:**
  *   *Current (Quinean/Pragmatic):* Reviewers evaluate **internal coherence**. (e.g., "Does the commitment to ecological integrity consistently constrain the proposed methods?")
  *   *Required (Realist):* Reviewers would need to evaluate **truth-tracking**. (e.g., "Is ecological integrity *actually* a binding value, and does the applicant's understanding align with the moral facts?")
      *   *Consequence:* Reviewers would need metaethical expertise to judge the *validity* of the values themselves, not just their consistency. A coherent scheme based on a "false" value (e.g., racial superiority) would be rejected not for incoherence, but for falsity.

  **B. Prohibition on Register-Mixing:**
  *   *Current:* Mixing is prohibited to prevent category errors (arguing from authority while claiming relativity).
  *   *Required (Realist):* Mixing might become **mandatory** or the Scheme-Relative Register would be abolished.
      *   If values are discovered, the Scheme-Relative Register is fundamentally misleading (it implies adoption rather than recognition).
      *   A Realist might require a "Hybrid Register": "These values are universal (Realism), but our *understanding* of them is scheme-relative (Epistemic Humility)." The current strict dichotomy forces a choice between "True for everyone" and "True for us." Realism suggests "True for everyone, but accessed by us."

  **C. Ontological/Normative Parallelism:**
  *   If Moral Realism were adopted, the structural parallel with the Ontological Statement would likely break. Scientific Ontology is generally treated as fallible and revisable (Scheme-Relative). If Normativity is treated as Universal/Discovered, the two statements would no longer be symmetrical. The Consortium would likely treat Normative constraints as **fixed parameters** (like the laws of logic) rather than **variable commitments** (like theoretical entities).

  ### 5. Philosophical Underdetermination

  Where is the practice philosophically underdetermined? That is, where do rival theories license the exact same institutional design?

  1.  **Rawlsian Political Liberalism vs. Quinean Pragmatism:**
      *   *Quine:* Values are revisable posits; we allow different registers because no scheme is privileged.
      *   *Rawls:* We allow different registers because public reason requires us to respect reasonable pluralism. We bracket the "truth" of comprehensive doctrines to ensure fair cooperation.
      *   *Underdetermination:* The institutional mechanism (bracketing truth claims for the sake of procedure) is identical. The Consortium could be a Quinean web of belief or a Rawlsian overlapping consensus, and the paperwork would look the same.

  2.  **Error Theory vs. Realism (with Humility):**
      *   *Error Theorist (Mackie):* There are no objective values. The Universalist Register is strictly false, but we allow it because people believe it.
      *   *Realist:* There are objective values. The Scheme-Relative Register is strictly incomplete, but we allow it because people are ignorant.
      *   *Underdetermination:* Both views justify the two-register system as a way to manage *disagreement* without resolving *metaphysics*. The institution functions as a machine for processing disagreement, indifferent to whether the disagreement stems from error or ignorance.

  3.  **The Status of the "Ban":**
      *   As noted, the ban on non-consensual experimentation is underdetermined. It functions identically whether it is a **Kantian Categorical Imperative** (Universal) or a **Constitutive Rule of the Practice** (Quinean). The *effect* on the applicant is the same; only the *justification* given in the reviewer's handbook would differ.

  ### Conclusion

  The Consortium's practice is a masterpiece of **procedural naturalism**. It does not solve the metaethical debate; it bypasses it. It treats moral values as **functional components of a research design** rather than metaphysical absolutes. While this fits Quinean naturalism like a glove—treating values as revisable nodes in a web—it does not strictly exclude Realism, provided the Realist is willing to accept epistemic humility.

  However, the system leans Quinean in its symmetry: by placing normative commitments in a "Scheme-Relative" register parallel to ontological ones, it implicitly suggests that values, like genes or quantum fields, are tools we use to make sense of our world, subject to trade-offs and revision. The only crack in this naturalistic armor is the ineligibility clause, which acts as a "given" that the rest of the system treats as "made." Whether that given is a moral truth or a pragmatic boundary is the one question the Consortium's design successfully keeps off the form.
