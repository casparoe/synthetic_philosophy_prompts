answer: |-
  **EXAMINATION PAPER**

  **Course:** PHI-ECO 401: Foundations of Rational Choice
  **Section:** B
  **Time Allowed:** 3 Hours
  **Instructions:** Answer **one** question from this section. All terms used in the question are defined below. Do not cite external authors or texts. Argue from the stipulations provided.

  **Question 4**

  Consider a standard framework of choice theory. Let $X$ be a set of bundles. A **choice function** $C$ selects a bundle from any feasible budget set $B \subseteq X$. The **Weak Axiom of Revealed Preference (WARP)** holds if, whenever bundle $x$ is chosen when $y$ is available, $y$ is never chosen when $x$ is available. A **Utility Representation Theorem** states that if a choice function satisfies WARP (and suitable continuity conditions), there exists a function $u: X \to \mathbb{R}$ such that $C(B)$ maximizes $u$ over $B$. This function $u$ is unique only up to strictly increasing transformation (ordinal utility).

  **Stipulation 1 (The Twin Agents):** Two agents, Ana and Bao, face identical sequences of budget sets. By stipulation, they possess the exact same choice function $C$. Consequently, they satisfy WARP identically and share the same set of utility representations $u$. However, their psychological processes differ. Ana's choices result from deliberative reflection on her values; she endorses them upon review. Bao's choices result from cue-triggered heuristics; he frequently regrets them, claims they do not reflect his values, and sometimes pays a cost to remove options from his own future budget sets.

  **Stipulation 2 (The Regress):** Bao's payment to remove an option is itself a choice made from a "menu of menus." This higher-order choice also satisfies WARP and admits a utility representation.

  **Part (a):** If welfare economics relies on $u$ to measure well-being, explain what goes wrong in the case of Ana and Bao. Does the ordinality of $u$ (uniqueness only up to increasing transformation) explain this failure, or is the problem distinct? (8 marks)

  **Part (b):** Suppose we argue that Bao's "true" preference is revealed at the higher-order level (the menu of menus). Explain why this generates a regress problem for a purely behaviourist account. What non-behavioural condition must be added to stop the regress and license welfare claims? (6 marks)

  **Part (c) (Coda):** A regulator bans a good $g$. An analyst computes the **Compensating Variation (CV)**—the sum of money that makes the agent indifferent between the pre-ban state (with $g$ available) and the post-ban state (without $g$)—using observed choice data from the pre-ban period. If the population includes agents like Bao who were paying to avoid $g$ but still chose it pre-ban, what does the calculated CV actually measure? Does it track welfare change? Justify your verdict. (6 marks)

  ***

  **MODEL ANSWER**

  The central tension lies in conflating consistency with normativity. The Utility Representation Theorem guarantees only that choices are *consistent*, not that they track *well-being*. In the case of Ana and Bao, the failure of $u$ to measure welfare is not due to ordinality. Ordinality means we cannot compare the *magnitude* of utility differences between agents, but it does not prevent $u$ from ranking states for a single agent. If choice perfectly tracked welfare, an ordinal index would suffice to identify improvements. The failure arises because $u$ tracks choice, and stipulation 1 establishes that choice can diverge from welfare. Since Ana and Bao share $u$ but diverge in well-being (Ana is fulfilled; Bao is regretful), $u$ is welfare-silent. It is a bookkeeping device for behaviour, not a measure of the good.

  To rescue welfare economics, one might appeal to Stipulation 2: Bao's higher-order choice to restrict his menu reveals his "true" preference. However, on a strictly behaviourist account, this move fails. The higher-order choice is merely another choice function, subject to the same critique as the first. If preference is *defined* as choice, then the higher-order choice is no more "true" than the lower-order one; it is just a choice over menus rather than bundles. This generates an infinite regress: if the agent pays to restrict the menu of menus, which level is privileged? A purely behavioural apparatus cannot distinguish between a "true" preference and a "stronger" impulse without stepping outside behaviour.

  To stop the regress, we must add a non-behavioural condition: **reflective endorsement**. We must stipulate that welfare is determined not by choice *simpliciter*, but by choices that survive idealized reflection. This abandons strict behaviourism. It requires positing a mental state (endorsement) that validates certain choices as authoritative over others. Without this, the apparatus cannot distinguish Ana from Bao, nor can it justify treating Bao's self-binding as welfare-enhancing rather than merely another constraint.

  In the Coda, the analyst computes CV based on pre-ban choices. For Ana, CV measures the welfare cost of losing $g$. For Bao, the calculation is distorted. Bao chose $g$ pre-ban (due to heuristics) but paid to avoid it (due to endorsement). The standard CV calculation interprets the choice of $g$ as evidence that $g$ adds value. Thus, the analyst calculates a positive cost to remove $g$ (a welfare loss). However, for Bao, the ban functions as the self-binding he desired; it increases his welfare. The calculated CV measures the *behavioural cost* of the constraint (loss of chosen option), not the *welfare gain* of relief from temptation. Therefore, the CV number is behaviorally consistent but normatively misleading. It aggregates Ana's loss and Bao's gain as if both were losses. The verdict is that without separating choice from endorsement, welfare metrics like CV systematically misread cases of internal conflict, treating the satisfaction of regrettable impulses as welfare gains.

  ***

  **MARKING SCHEME (20 MARKS)**

  **1. The Limits of the Representation Theorem (4 marks)**
  *   **Must Hit:** State clearly that the theorem guarantees consistency (WARP), not normative content.
  *   *Common Error:* Claiming the theorem fails because utility is ordinal, rather than because it maps choice not welfare.

  **2. Ordinality vs. Welfare Significance (4 marks)**
  *   **Must Hit:** Explicitly argue that ordinality is not the source of the welfare failure (an ordinal scale can still track welfare rankings).
  *   *Common Error:* Conflating "cannot compare utility across persons" with "cannot measure welfare for one person."

  **3. The Ana/Bao Implication (4 marks)**
  *   **Must Hit:** Conclude that identical choice functions $\neq$ identical welfare, proving choice is insufficient for welfare.
  *   *Common Error:* Suggesting Bao is irrational and therefore his choices should be discarded without explaining why RP can't handle this.

  **4. The Regress and Privilege (4 marks)**
  *   **Must Hit:** Identify that higher-order choice is still just choice behaviourally; no level is privileged without external criteria.
  *   *Common Error:* Assuming the "higher" level is automatically the "truer" level by definition within the behaviourist framework.

  **5. The Non-Behavioural Supplement (2 marks)**
  *   **Must Hit:** Name a condition like "reflective endorsement" or "counterfactual stability" that breaks the behaviourist circle.
  *   *Common Error:* Proposing more complex choice axioms rather than a psychological/normative condition.

  **6. The CV Coda Verdict (2 marks)**
  *   **Must Hit:** Verdict that CV measures willingness to pay (choice), not welfare, and misidentifies Bao's gain as a loss.
  *   *Common Error:* Arguing CV is still valid because "revealed preference is the only data we have."

  ***

  **EXAMINER'S NOTE**

  This question tests the candidate's ability to distinguish the *mathematical sufficiency* of axioms from their *normative necessity*. It forces a confrontation with the "empty organism" problem in economics. A strong candidate might go further than the model answer by questioning whether "reflective endorsement" is itself just another choice (a third-order choice), thereby arguing that the regress cannot be stopped theoretically, only pragmatically by the regulator imposing a specific view of agency. This would demonstrate a deeper grasp of the philosophical instability of the "true self" in welfare economics.
