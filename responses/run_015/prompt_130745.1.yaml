answer: |-
  The moderation team is not operating on a single consistent philosophy, but rather a hierarchy of **Legitimate Expectation of Security**. They protect players where the game mechanics imply safety (claimed land, non-PvP zones) or where social norms are strong enough to override mechanics (memorials, economy integrity). They deny protection where mechanics explicitly signal risk (PvP zones, trade windows). The contradiction between Case 2 (scam) and Case 1 (castle) is resolved by viewing the trade window as a explicit consent to risk, whereas the castle claim was an explicit promise of safety.

  Your friends' gray sits in the tension between Case 3 (PvP gear loss) and Case 1 (Castle destruction). The mods label grays as "fauna," implying mechanical consent to risk (Case 3). However, the two years of training represent labor investment identical to the castle (Case 1). Because the killer acted with malice (harassment) rather than mere gameplay, the mods have already sanctioned the *intent* via the mute. They will likely treat the *act* (killing fauna) as mechanically valid.

  **Best Guess:** They will dismiss the appeal regarding the killing. They prioritize mechanical definitions over emergent ownership.
  **Recommendation:** They should uphold the appeal. Consistency with Case 1 requires protecting significant labor investment against malicious destruction, regardless of the "fauna" tag.
  **Single Consideration for Appeal:** Focus on the **irreplaceable labor investment** (the behavior file) rather than the creature itself. Argue that the behavior file is player-generated data, equivalent to a built structure, not procedural fauna.

  **Discriminating Variation:** The written warning. If the friends were warned that grays are unprotected, they assumed the risk (aligning with Case 2). If not, they had a legitimate expectation of persistence (aligning with Case 1). This changes the consent landscape from implicit to explicit.

  **Restoration:** A spawned copy is not the same entity. The value lies in the unique learned history, not the seed. Restoring the seed restores the shell, not the pet.

