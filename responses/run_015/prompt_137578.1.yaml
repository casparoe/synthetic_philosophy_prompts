  # Session Plan: Dominance, Iteration, and Rationalizability
  **Time:** 90 Minutes | **Students:** 24 (Econ/Phil) | **Resources:** Projector, Printed Matrices, Envelopes, Colored Pens, "Verification Warrants"

  ## Part 1: The Three Games (Design & Arithmetic)

  ### Module 1: Mixed Dominance (The "Construction")
  **Goal:** Students construct a mixture that strictly dominates a pure strategy pointwise.
  **Grouping:** Pairs (12 groups). One student is **Row**, one is **Column**.
  **The Game:** 3 Rows ($R_1, R_2, R_3$), 3 Columns ($C_1, C_2, C_3$). Row Payoffs only (Column payoffs are irrelevant for this task).

  | | $C_1$ | $C_2$ | $C_3$ |
  | :--- | :---: | :---: | :---: |
  | **$R_1$** | 10 | 0 | 5 |
  | **$R_2$** | 0 | 10 | 5 |
  | **$R_3$** | 4 | 4 | 4 |

  **The Task:** Row must eliminate $R_3$.
  1.  **Pure Check:** Students verify $R_1$ does not dominate $R_3$ (fails at $C_2$) and $R_2$ does not dominate $R_3$ (fails at $C_1$).
  2.  **Mixture Construction:** Row proposes weights $(p, 1-p)$ for $R_1, R_2$.
  3.  **Physical Mechanic (The Auditor):**
      *   Row writes a proposed $p$ (e.g., 0.5) on a **Challenge Card**.
      *   Column acts as **Auditor**. Column holds three **Envelope Cards** face down, labeled $C_1, C_2, C_3$. Inside each is the payoff for $R_3$ (all are "4").
      *   Row calculates Expected Value (EV) for their mixture against $C_1$. ($0.5 \times 10 + 0.5 \times 0 = 5$).
      *   Column reveals $C_1$ Envelope ("4"). Row writes "5" on a slip and places it next to "4".
      *   **Rule:** $5 > 4$. Pass. Repeat for $C_2$ ($5 > 4$) and $C_3$ ($5 > 4$).
      *   If all three slips show strict inequality, Column signs the **Elimination Warrant**. $R_3$ is physically removed from the board.
  **Verification:**
  *   Mixture $\sigma = 0.5 R_1 + 0.5 R_2$.
  *   Payoff Vector: $(5, 5, 5)$.
  *   Target Vector ($R_3$): $(4, 4, 4)$.
  *   $5 > 4$ in all components. Strict Dominance verified.

  ### Module 2: Iteration (The "Order")
  **Goal:** Experience order independence of strict dominance, but feel the tension of shrinking sets.
  **Grouping:** Split room. Left 12 students (**Group A**), Right 12 students (**Group B**).
  **The Game:** 3x3 Symmetric Payoffs (Row Payoffs shown; Col payoffs are the transpose).

  | | $L$ | $C$ | $R$ |
  | :--- | :---: | :---: | :---: |
  | **$T$** | 10, 10 | 0, 0 | 6, 4 |
  | **$M$** | 0, 0 | 10, 10 | 6, 4 |
  | **$B$** | 4, 6 | 4, 6 | 4, 4 |

  *(Note: Col Payoffs are symmetric. E.g., at $(T, R)$, Row gets 6, Col gets 4.)*

  **The Task:** Perform Iterated Elimination of Strictly Dominated Strategies (IESDS).
  *   **Group A:** Must look for **Row** dominations first.
  *   **Group B:** Must look for **Column** dominations first.
  *   **Constraint:** You can only eliminate if you have a signed **Elimination Warrant** (from Module 1 mechanic).

  **Verification & Arithmetic:**
  1.  **Row Dominance:** Is $B$ dominated?
      *   Consider $\sigma = 0.5 T + 0.5 M$.
      *   Vs $L$: $0.5(10) + 0.5(0) = 5$. ($5 > 4$).
      *   Vs $C$: $0.5(0) + 0.5(10) = 5$. ($5 > 4$).
      *   Vs $R$: $0.5(6) + 0.5(6) = 6$. ($6 > 4$).
      *   $B$ is strictly dominated. Can be eliminated immediately.
  2.  **Col Dominance:** Is $R$ dominated?
      *   Consider $\sigma = 0.5 L + 0.5 C$.
      *   Vs $T$: $0.5(10) + 0.5(0) = 5$. ($5 > 4$).
      *   Vs $M$: $0.5(0) + 0.5(10) = 5$. ($5 > 4$).
      *   Vs $B$: $0.5(6) + 0.5(6) = 6$. ($6 > 4$).
      *   $R$ is strictly dominated. Can be eliminated immediately.
  3.  **Iteration:**
      *   **Group A (Row First):** Eliminate $B$. Remaining: $\{T, M\} \times \{L, C, R\}$.
          *   Now check Cols. Vs $\{T, M\}$, is $R$ dominated?
          *   Mix $0.5 L + 0.5 C$ gives 5 vs $T$, 5 vs $M$. $R$ gives 4 vs $T$, 4 vs $M$.
          *   $5 > 4$. Eliminate $R$.
          *   **Final Set:** $\{T, M\} \times \{L, C\}$.
      *   **Group B (Col First):** Eliminate $R$. Remaining: $\{T, M, B\} \times \{L, C\}$.
          *   Now check Rows. Vs $\{L, C\}$, is $B$ dominated?
          *   Mix $0.5 T + 0.5 M$ gives 5 vs $L$, 5 vs $C$. $B$ gives 4 vs $L$, 4 vs $C$.
          *   $5 > 4$. Eliminate $B$.
          *   **Final Set:** $\{T, M\} \times \{L, C\}$.
  4.  **Order Independence Check:** Both groups arrive at the same 2x2 set.
  5.  **Addressing the "Stuck" Group:** If a group claims they can't eliminate the second strategy, it is an arithmetic slip.
      *   *Lesson:* "Strict dominance is robust. If your result depends on the order, your calculator is lying, not the theory."
  6.  **Weak Dominance Note:** If payoffs were equal (e.g., $B$ gave 5 vs $R$), elimination order *would* matter. (Mention only in debrief).

  ### Module 3: IESDS vs. Nash Equilibrium (The "Limit")
  **Goal:** Show a strategy that survives IESDS but is never played in NE.
  **Grouping:** Triples (8 groups). Players 1, 2, 3.
  **The Game:**
  *   **Player 1 (Row):** Strategies $S_1$ ("Anti-Correlate"), $S_2$ ("Safe").
  *   **Player 2 (Col):** Strategies $L, R$.
  *   **Player 3 (Matrix):** Strategies $l, r$.
  *   **Payoffs:**
      *   **P2 & P3:** Have dominant strategies.
          *   P2: $L$ gives 10, $R$ gives 0 (regardless of others).
          *   P3: $l$ gives 10, $r$ gives 0 (regardless of others).
      *   **P1:** Payoff depends on P2 and P3's joint action.
          *   If $(L, l)$ or $(R, r)$ (Matched): $S_1 \to 0$, $S_2 \to 4$.
          *   If $(L, r)$ or $(R, l)$ (Mismatched): $S_1 \to 10$, $S_2 \to 4$.

  **Verification:**
  1.  **IESDS Survival:**
      *   P2 eliminates $R$. P3 eliminates $r$. (Strict dominance).
      *   Does P1 eliminate $S_1$?
      *   To eliminate $S_1$, it must be dominated by $S_2$ against *all* P2/P3 profiles.
      *   Against $(L, r)$, $S_1$ gets 10, $S_2$ gets 4. $10 > 4$.
      *   $S_1$ is **not** dominated. It survives IESDS.
  2.  **Nash Equilibrium:**
      *   P2 plays $L$. P3 plays $l$. (Unique best responses).
      *   P1 faces profile $(L, l)$.
      *   $S_1$ payoff: 0. $S_2$ payoff: 4.
      *   P1 plays $S_2$.
      *   **Unique NE:** $(S_2, L, l)$.
      *   $S_1$ receives **zero probability**.
  3.  **What the 3rd Player Buys:**
      *   In 2-player games, a opponent's strategy is a single probability distribution.
      *   In 3-player games, P1 has a belief over the *joint* distribution of (P2, P3).
      *   IESDS allows P1 to believe P2 and P3 might correlate (e.g., "Maybe they will mismatch").
      *   NE requires P1 to believe P2 and P3 are independent (Product measure). Since P2, P3 have dominant strategies, they play $(L, l)$ with probability 1. Independence forces $(L, l)$. Correlation *could* allow $(L, r)$.
      *   $S_1$ is rationalizable (best response to correlated belief) but not an NE strategy (not best response to independent belief).

  ---

  ## Part 2: Timeline (90 Minutes)

  *   **00:00 – 00:10 (Intro):** Hand out matrices. No definitions. "Your goal is to cross out rows/columns that are 'unplayable'. You must prove it to your partner."
  *   **00:10 – 00:35 (Module 1):** Pairs work on Mixed Dominance. Instructor circulates, refusing to confirm answers, only checking "Warrants."
      *   *Critical Moment:* When a group tries to use just $R_1$ and fails. Let them struggle for 3 minutes.
  *   **00:35 – 01:00 (Module 2):** Split class A/B. Iteration race.
      *   *Critical Moment:* When groups finish, ask them to compare final sets with the other half. "Did you cross out the same things?"
  *   **01:00 – 01:20 (Module 3):** Triples work on 3-Player Game.
      *   *Critical Moment:* P1 realizes $S_1$ is never dominated, but P2/P3 lock into $(L, l)$.
  *   **01:20 – 01:30 (Debrief):** Vocabulary dump. Map activities to concepts.
  *   **Contingency:** If 20 mins behind, **cut Module 3**. Use the final 10 mins to ask Module 2 groups: "Is every strategy that survived a 'best response' to something? Is it a best response to what the other player *actually* did?" Introduce the NE gap verbally.

  ---

  ## Part 3: Debrief & Mapping (No Lecture, Just Labeling)

  Do not re-explain the math. Point to the physical artifacts they created.

  1.  **Point to the Challenge Cards (Module 1):** "You built a **Mixed Strategy**. You proved **Strict Dominance by a Mixed Strategy**. Notice you had to check every column. That is **Pointwise Dominance**."
  2.  **Point to the Final Sets (Module 2):** "You deleted, then deleted again. That is **Iterated Elimination (IESDS)**. Group A and B got the same result. That is **Order Independence** (for strict dominance). If you got different results, check your arithmetic."
  3.  **Point to Player 1's $S_1$ (Module 3):** "This strategy survived elimination. It is **Rationalizable**. But no one played it in the equilibrium. IESDS gives an **Upper Bound** on rational play, not a prediction."
  4.  **The Vocabulary List (Project this):**
      *   Strict Dominance (Pure/Mixed)
      *   Iterated Elimination of Strictly Dominated Strategies (IESDS)
      *   Rationalizability vs. Nash Equilibrium
      *   Correlated vs. Independent Beliefs

  ---

  ## Part 4: Predicted Failures & Limitations

  **What Will Go Wrong:**
  1.  **The "Average" Mistake:** In Module 1, a student will calculate the average payoff of the mixture and compare it to the average payoff of $R_3$.
      *   *Fix:* The "Auditor" rule forces column-by-column verification. Enforce the rule strictly.
  2.  **The "Prediction" Fallacy:** In Module 2, students will claim the surviving 2x2 set *is* the solution.
      *   *Fix:* In Debrief, ask: "In the surviving set, do you know what to play?" (No, still a coordination problem).
  3.  **The "Randomization" Objection:** "Nobody actually flips a coin to play $R_1/R_2$."
      *   *Fix:* "You don't need to flip. You just need to know that *if* you were forced to randomize, you could beat $R_3$. It's about the existence of a better option, not your habit."
  4.  **The "Mind Reading" Question:** "Why do I care if $R_3$ is dominated if the other player isn't rational?"
      *   *Fix:* "IESDS assumes **Common Belief in Rationality**. If you doubt their rationality, you can't eliminate."

  **What The Activity Cannot Reproduce (The "Say Out Loud" List):**
  1.  **Epistemic Depth:** The activity shows *that* we iterate, but not *why*. You must state: "Iteration requires me to believe you are rational, and you to believe I am rational, and me to believe that you believe..."
  2.  **Correlated Beliefs:** In Module 3, the independence constraint of NE is abstract. You must state: "In Nash Equilibrium, Player 1 must treat Player 2 and Player 3 as independent coin flips. In IESDS, Player 1 is allowed to suspect they might be coordinating. That is why $S_1$ survives elimination but dies in Equilibrium."
  3.  **Weak Dominance:** You must explicitly warn: "Today was Strict Dominance. If we used Weak Dominance (where $\geq$ replaces $>$), Order Independence breaks. Do not carry that intuition forward."

