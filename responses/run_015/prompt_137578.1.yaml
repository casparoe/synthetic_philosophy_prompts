                                  *   This is getting very tight.
                      *   *Decision:* The 3-player example suggested in the prompt is much safer and pedagogically clearer for "Correlated Beliefs."
                      *   *Why 3 Players?* It allows the "Opponents' moves are distributed in a particular anti-correlated way" condition. In 2-player, the opponent is one person. In 3-player, Player 1 has beliefs about P2 and P3. IESDS allows correlated beliefs about (P2, P3). NE requires independent beliefs (product measure).
                      *   *This is the key epistemic difference.*
                      *   *I will use the 3-Player example.* It answers the "what the third player buys you" requirement explicitly.

  5.  **Drafting the Plan:**

      *   **Session Flow:**
          *   0-15: Intro & Grouping.
          *   15-40: Module 1 (Mixed Dominance Construction).
          *   40-65: Module 2 (Iteration & Order).
          *   65-80: Module 3 (IESDS vs NE / 3-Player Game).
          *   80-90: Debrief & Vocabulary.
      *   **Contingency:** If 20 mins behind, cut Module 3 (the 3-player game) and discuss the concept theoretically using the results from Module 2.
      *   **Materials:** Printed matrices, colored pencils (for mixing), "Verification Envelopes" (for pointwise check).

  6.  **Refining the Numbers:**

      *   **Module 1 (Mixed Dom):**
          *   Row: $R_1, R_2, R_3$. Col: $C_1, C_2, C_3$.
          *   $R_3$ to be eliminated.
          *   $C_1$: $R_1=10, R_2=0, R_3=4$.
          *   $C_2$: $R_1=0, R_2=10, R_3=4$.
          *   $C_3$: $R_1=5, R_2=5, R_3=4$.
          *   Mix $0.5 R_1 + 0.5 R_2$ gives $(5, 5, 5)$.
          *   $5 > 4$ everywhere.
          *   Pure $R_1$ fails at $C_2$. Pure $R_2$ fails at $C_1$.
      *   **Module 2 (Iteration):**
          *   Need a 2-step elimination.
          *   Start: $C_3$ dominated for Col.
          *   After $C_3$ gone: $R_3$ dominated for Row (using the mix from Mod 1).
          *   After $R_3$ gone: Maybe $C_2$ dominated?
          *   Let's create a 3x3 where order matters for *process* but not *result*.
          *   Row: $T, M, B$. Col: $L, C, R$.
          *   Payoffs (Row):
              *   $T$: 3, 0, 3
              *   $M$: 0, 3, 3
              *   $B$: 2, 2, 2
              *   (Here $B$ is dominated by $0.5 T + 0.5 M \to 1.5, 1.5, 3$. Wait, $3>2$, but $1.5 < 2$. Not dominated.)
              *   Let's use the Mod 1 numbers for Row.
              *   $T$: 10, 0, 5
              *   $M$: 0, 10, 5
              *   $B$: 4, 4, 4
              *   Col Payoffs (need to drive elimination):
              *   $L$: 1, 1, 1
              *   $C$: 1, 1, 1
              *   $R$: 0, 0, 5
              *   If Row plays $T/M$, Col prefers $L/C$. $R$ is bad.
              *   If Row plays $B$, Col prefers $R$ (5 > 1).
              *   So $R$ is not dominated initially.
              *   This is getting complicated to ensure clean steps.
              *   *Simpler Iteration:*
              *   Row: $U, D$. Col: $L, M, R$.
              *   $U$: 5, 0, 5
              *   $D$: 0, 5, 5
              *   Col Payoffs:
              *   $L$: 5 (vs U), 0 (vs D)
              *   $M$: 0 (vs U), 5 (vs D)
              *   $R$: 2 (vs U), 2 (vs D)
              *   Step 1: For Col, $R$ is dominated by $0.5 L + 0.5 M$?
                  *   Vs $U$: $0.5(5)+0.5(0) = 2.5 > 2$.
                  *   Vs $D$: $0.5(0)+0.5(5) = 2.5 > 2$.
                  *   Yes, $R$ dominated. Eliminate $R$.
              *   Step 2: Now Col plays only $L, M$.
              *   Row Payoffs vs $L, M$:
                  *   $U$: 5, 0
                  *   $D$: 0, 5
              *   Nothing dominated for Row.
              *   *Need a 3rd Row strategy to eliminate in Step 2.*
              *   Add Row $X$: 3, 3, 3.
              *   Vs $L, M, R$: $X$ is 3, 3, 3.
              *   Initially: Is $X$ dominated?
                  *   Mix $0.5 U + 0.5 D$: Vs $L \to 2.5$. Vs $M \to 2.5$. Vs $R \to 5$.
                  *   $X$ (3) > Mix (2.5) for $L, M$. So $X$ not dominated initially.
              *   After $R$ eliminated:
                  *   Mix $0.5 U + 0.5 D$: Vs $L \to 2.5$. Vs $M \to 2.5$.
                  *   $X$ (3) > 2.5. Still not dominated.
              *   *Reverse:* Make $X$ dominated *after* $R$ goes.
              *   Make $X$: 4, 4, 1.
              *   Initially: Mix $0.5 U + 0.5 D \to 2.5, 2.5, 5$.
              *   $X$ (4) > 2.5. $X$ not dominated.
              *   After $R$ eliminated: Mix $\to 2.5, 2.5$.
              *   $X$ (4) > 2.5. Still not dominated.
              *   *Try:* $U$: 10, 0, 0. $D$: 0, 10, 0. $X$: 4, 4, 4.
              *   Col: $L, M, R$.
              *   Col Payoffs: $L(1,0), M(0,1), R(0,0)$.
              *   $R$ dominated by $0.5 L + 0.5 M$ (0.5 > 0). Eliminate $R$.
              *   Now Row faces $L, M$.
              *   $U(10, 0), D(0, 10), X(4, 4)$.
              *   Mix $0.5 U + 0.5 D \to 5, 5$.
              *   $5 > 4$. So $X$ dominated. Eliminate $X$.
              *   *Order Check:*
              *   Can we eliminate $X$ first?
              *   Vs $L, M, R$: Mix $0.5 U + 0.5 D \to 5, 5, 0$.
              *   $X(4, 4, 4)$.
              *   $4 < 5$ (Good). $4 < 5$ (Good). $4 > 0$ (Bad).
              *   So $X$ NOT dominated initially.
              *   So $R$ MUST go first.
              *   *Wait, I need order independence of the **final set**, but different paths.*
              *   If $X$ cannot go first, there is no order variation.
              *   I need two strategies that can be eliminated first, leading to the same end.
              *   Let's create two independent dominations.
              *   Row: $U, D, X$. Col: $L, M, R$.
              *   $X$ dominated by $U/D$ mix *if* $R$ is gone.
              *   $R$ dominated by $L/M$ mix *if* $X$ is gone?
              *   Col Payoffs:
                  *   $L$: 5 (vs U), 0 (vs D), 0 (vs X)
                  *   $M$: 0 (vs U), 5 (vs D), 0 (vs X)
                  *   $R$: 2 (vs U), 2 (vs D), 10 (vs X)
              *   If $X$ is in play, $R$ gives 10. $L/M$ mix gives 0. $R$ is best.
              *   If $X$ is gone, $R$ gives 2. $L/M$ mix gives 2.5. $R$ dominated.
              *   So $X$ must go first for $R$ to go.
              *   Can $X$ go first?
              *   Row Payoffs:
                  *   $U$: 10, 0, 0
                  *   $D$: 0, 10, 0
                  *   $X$: 4, 4, 4
              *   Vs $L, M, R$. Mix $U/D \to 5, 5, 0$.
              *   $X(4, 4, 4)$. $4 > 0$ at $R$. $X$ not dominated.
              *   So neither can go first. Deadlock.
              *   *Solution:* Make them independent.
              *   Row $X$ dominated by $U/D$ regardless of Col (if Col payoffs allow).
              *   Col $R$ dominated by $L/M$ regardless of Row.
              *   Then both can go first.
              *   Row: $U(10,0,0), D(0,10,0), X(4,4,4)$.
              *   Col: $L(10,0,0), M(0,10,0), R(4,4,4)$ (Transposed).
              *   Wait, Col payoffs depend on Row.
              *   Col Payoff Matrix (Rows are Row's actions):
                  *   $U$: $L=10, M=0, R=0$
                  *   $D$: $L=0, M=10, R=0$
                  *   $X$: $L=0, M=0, R=10$
              *   Check Col Domination:
                  *   Is $R$ dominated? Mix $0.5 L + 0.5 M$.
                  *   Vs $U$: $5 > 0$. Vs $D$: $5 > 0$. Vs $X$: $0 < 10$.
                  *   Not dominated initially.
              *   This "Interdependent Elimination" is the interesting case.
              *   If I want Order Independence demonstration, I need a case where *both* can be eliminated first.
              *   Let's stick to the prompt's request: "Have different groups eliminate in different orders... my understanding is that... end result is order-independent."
              *   So I need a game where *multiple* eliminations are possible at Step 1.
              *   Game:
                  *   Row: $T, M, B$. Col: $L, C, R$.
                  *   $B$ dominated by $0.5 T + 0.5 M$ (Payoffs 5,5,5 vs 4,4,4). (Independent of Col actions if Col payoffs don't affect Row).
                  *   $R$ dominated by $0.5 L + 0.5 C$ (Payoffs 5,5,5 vs 4,4,4).
                  *   If I make them independent, it's boring.
                  *   Let's make them slightly dependent but both valid.
                  *   Row Payoffs:
                      *   $T$: 10, 0, 6
                      *   $M$: 0, 10, 6
                      *   $B$: 4, 4, 4
                      *   Mix $0.5 T + 0.5 M$: 5, 5, 6.
                      *   $5>4, 5>4, 6>4$. $B$ dominated.
                  *   Col Payoffs:
                      *   $L$: 10, 0, 6 (vs T, M, B)
                      *   $C$: 0, 10, 6
                      *   $R$: 4, 4, 4
                      *   Mix $0.5 L + 0.5 C$: 5, 5, 6.
                      *   $R$ dominated.
                  *   Both can be eliminated first.
                  *   Group 1 eliminates $B$ then $R$.
                  *   Group 2 eliminates $R$ then $B$.
                  *   Result: $\{T, M\} \times \{L, C\}$.
                  *   This works.

      *   **Module 3 (3-Player):**
          *   Players: 1 (Row), 2 (Col), 3 (Matrix).
          *   Goal: P1 strategy $S_1$ survives IESDS but is 0 in NE.
          *   Mechanism: $S_1$ is BR to correlated belief of (P2, P3), but P2, P3 independent in NE.
          *   Payoffs for P1:
              *   If (P2=L, P3=L) $\to$ 0
              *   If (P2=R, P3=R) $\to$ 0
              *   If (L, R) or (R, L) $\to$ 10
              *   Strategy $S_1$ ("Anti-Correlate"): Gets 10 if P2, P3 mismatch.
              *   Strategy $S_2$ ("Safe"): Gets 4 always.
              *   If P2, P3 play independently with $p=0.5$, Prob(Mismatch) = 0.5. Exp Payoff $S_1 = 5$. $5 > 4$.
              *   So $S_1$ is BR to independent mix.
              *   I need $S_1$ to be 0 in NE.
              *   So in NE, P2, P3 must correlate? No, NE requires independence.
              *   So in NE, P2, P3 must play such that $S_1$ is bad.
              *   E.g., P2 plays L, P3 plays L. (Pure NE).
              *   Then $S_1$ gets 0. $S_2$ gets 4. P1 plays $S_2$.
              *   So in Pure NE $(S_2, L, L)$, $S_1$ is not played.
              *   Is $S_1$ dominated?
              *   If P2 plays L, P3 plays L $\to$ $S_1=0, S_2=4$.
              *   If P2 plays R, P3 plays R $\to$ $S_1=0, S_2=4$.
              *   If P2 plays L, P3 plays R $\to$ $S_1=10, S_2=4$.
              *   $S_1$ is not dominated (10 > 4).
              *   So $S_1$ survives IESDS.
              *   But in the NE $(S_2, L, L)$, $S_1$ gets 0 probability.
              *   Are there other NE?
              *   If P2, P3 mix 50-50. P1 plays $S_1$ (Exp 5).
              *   P2 payoff? Need to define P2, P3 payoffs to force them to L,L.
              *   P2 Payoff: 1 if L, 0 if R (Dominant strategy L).
              *   P3 Payoff: 1 if L, 0 if R (Dominant strategy L).
              *   Then Unique NE is $(S_2, L, L)$. (Since P1 best response to L,L is $S_2$).
              *   But $S_1$ survives IESDS because it's not dominated (beats $S_2$ if P2, P3 mismatch).
              *   This works perfectly.
              *   *What the 3rd player buys:* The ability to have a belief about the *joint* distribution of opponents that is not a product measure. IESDS allows correlated beliefs ("Maybe they will coordinate to mismatch"). NE forces independent beliefs.

  7.  **Review against Constraints:**
      *   90 mins? Yes, tight but doable.
      *   No software? Yes, paper/tokens.
      *   Vocabulary last? Yes.
      *   Mixed Dominance Construction? Yes, "Envelope/Verification" method.
      *   Iteration Order? Yes, split class.
      *   IESDS vs NE? Yes, 3-player game.
      *   Contingency Plan? Cut Module 3.

  8.  **Final Polish:**
      *   Ensure the "Physical Mechanic" for Module 1 is clear. The "Mixture Card" + "Column Envelope" system is robust.
      *   Ensure the Debrief connects the *feeling* of the activity to the *theory*.
      *   Check the "Predictably Go Wrong" list.
      *   Check the "Limitations" (Epistemic content).

  9.  **Formatting:** Use clear headings, bold text for emphasis, and distinct sections for the three modules. Ensure the math is explicit.

  *(Self-Correction during drafting Module 1)*: The prompt asks for "Randomization has to be constructed... verified object... check should be that the mixture beats the target action against *every* opponent action."
  *Refinement:* I will use a **"Dominance Ruler"** slide. A physical transparency with the mixture weights marked. They slide it over the columns. No, calculation is safer.
  *Better:* **"The Auditor System."** One student proposes the mix. A different student (Auditor) holds the "Target Row" cards. They go column by column. Proposer calculates EV. Auditor checks if EV > Target. If yes for all, Auditor signs the "Elimination Warrant." This makes it social and verified.

  *(Self-Correction on Module 3)*: Make sure the P2/P3 dominant strategies are obvious so they don't get stuck on P2/P3 equilibrium calculation. P2 and P3 should have strictly dominant strategies to L. Then P1's choice is the focus.

  Let's write it.
