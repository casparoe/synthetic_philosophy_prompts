  **DECLARATION OF INTENTION TO MARRY (FORM M-INTENT)**

  **PURPOSE:** To certify that Applicants possess a genuine intention to remain married until death, prior to receiving the benefits of marriage (tax status, ceremony, gifts).

  **SECTION 1: CERTIFICATION ROUTE**
  Applicants must select one pathway to prove intentionality.

  **□ Route A (Doxastic):** Applicant states calibrated credence that the marriage will last 50 years.
