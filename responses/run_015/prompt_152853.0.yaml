  **Recurring-Filing Rider:** This declaration expires annually. Applicants must resubmit Form M-INTENT each anniversary.
  *Constraint:* On Year 2+, Applicants must account for previous year's failure to act on intention when incentives shifted. Case difficulty compounds exponentially.

  **Meta-Intention Clause:** Applicants unable to form intention to marry may instead certify intention to *form* the intention.
  *Constraint:* This clause may be invoked indefinitely. No record of successful conversion from Meta-Intention to Direct Intention exists in county archives.

  **FAQ**

  **Q: Why is Route C the most popular?**
  A: It bypasses the epistemic burden of predicting future desires. It is the most efficient path to benefit acquisition.

  **Q: What if I change my mind after the ceremony?**
