  *Requirement:* Sunk costs must exceed three months' income.
  *Rubric Note:* High sunk costs correlate with stability. Examiner shall not distinguish between commitment and inability to exit due to financial loss.

  **□ Route C (At-Will):** Applicant asserts intention solely to secure immediate benefits.
  *Requirement:* None.
  *Rubric Note:* Designated "Premium Tier." Validated upon verbal assertion.

  **SECTION 2: ASSESSMENT RIDERS**

