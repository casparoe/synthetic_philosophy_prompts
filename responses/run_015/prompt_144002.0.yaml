      TO: All Faculty and Students
      FROM: Office of the Registrar
      DATE: Simultaneous with Receipt
      SUBJECT: Administrative Reorganization Following Ontological Revision of Temporal Passage

      This memo serves as formal notification that the University has updated its operational ontology to align with the implications of Kurt Gödel's 1949 rotating-universe solution to the field equations of General Relativity. As previously documented in faculty handbooks, Gödel demonstrated that within a rotating cosmological model, closed timelike curves are admissible. An observer could theoretically traverse a path returning to their own past. Gödel argued that because the laws of physics permit such a model, the distinction between earlier and later cannot be objective. If time passes in one solution but not another, then temporal passage is not a fundamental feature of the theory, but an ideal artifact of local perspective. Consequently, the University recognizes the block universe as the only fiscally and metaphysically stable framework for academic administration. All events, including syllabus distribution and final examinations, are equally real.

      It has been brought to our attention that observational data indicates our local universe does not exhibit global rotation, and distant matter does not appear to swirl with respect to local inertial frames. Critics suggest this model is physically irrelevant to our specific contingent circumstances. The Administration rejects this objection. The nature of time is determined by the space of solutions allowed by the theory, not by the accidental distribution of matter in one specific instance. To exclude the rotating solution based on empirical contingency would be to gerrymander the definition of physical possibility to preserve a pre-theoretical intuition. We cannot base policy on what merely happens to be the case, rather than what is theoretically admissible.

      This presents a logical fork. Modus ponens accepts the solution as admissible and concludes temporal passage is unreal. Modus tollens retains temporal passage and rules the solution unphysical. The University has elected modus ponens. This decision was driven by budgetary constraints. Maintaining the modus tollens position requires the continuous monitoring of tenure clocks, semester boundaries, and late fees, all of which presuppose an objective flow of time. The overhead associated with enforcing succession is prohibitive. In a block universe, the cost of processing a grade appeal filed before the offense occurs is negligible compared to the administrative burden of verifying that one moment precedes another.

      To facilitate this transition, the new Office of Achronal Compliance has been established. All stakeholders must file Form 88-B (Statement of Non-Succession) to certify that their understanding of deadlines is topological rather than sequential. The academic calendar is hereby dissolved. Classes begin and end eternally. The five-business-day rule for response times is replaced by the five-manifold-unit proximity rule. Tenure cases will no longer be evaluated on a timeline but on their permanent location within the departmental world-tube. Statutes of limitations on academic misconduct are void, as the misconduct and the adjudication occupy the same ontological plane.

      Please complete the attached Form 88-B and return it to the Office of the Registrar by 5:00 PM next Friday.

