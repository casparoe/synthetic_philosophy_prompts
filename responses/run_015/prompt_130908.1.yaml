          *   *Analysis:* This isn't a plot hole; it's the punchline. Deterrence is a *communicative act*. A threat unannounced is just a suicide note. Kubrick highlights that the *performance* of rationality (or irrationality) matters more than the hardware. The Machine solves the *internal* commitment problem (will we pull the trigger?) but fails the *external* signaling problem (do they know we will?).

      *   **Rational Actors vs. Structural Irrationality:**
          *   *Concept:* Rational Choice Theory assumes actors maximize utility.
          *   *Film:* Muffley is rational. Turgidson is calculating. Ripper is paranoid.
