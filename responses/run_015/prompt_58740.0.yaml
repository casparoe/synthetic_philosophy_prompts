answer: |-
  The printout sat on the kitchen island, glowing white under the under-cabinet LEDs. It was just a piece of paper, really. A genetic screening report from the clinic. But to Mark, it looked like a menu at a restaurant where the dishes were human souls.

  Embryo 1: 5AA. Euploid.
  Embryo 2: 4BB. Euploid.

  They could only transfer one. The doctor had said it was standard protocol to start with the highest grade to maximize the chance of pregnancy. Sarah was asleep upstairs, exhausted from the injections, the monitoring, the emotional rollercoaster that had defined their last six months. But Mark was down here, staring at Embryo 2.

  He wasn't worried about the success rates. He was worried about the identity.

  He picked up a pen and hovered it over the paper. If they transferred Embryo 1, a child would be born. Let's say a boy. He'd have a specific set of eyes, a specific laugh, a specific predisposition for math or music. He would be *someone*.

  But what about Embryo 2?

  Mark closed his eyes and thought about himself. He remembered a conversation he'd had with his father years ago, a drunken musing at a wedding. *"If I'd waited another month to ask your mother out,"* his dad had said, *"you wouldn't be you. Different sperm. Different egg. You'd be your brother, or your sister, or nobody at all."*

  It had always given Mark a vertigo feeling, like standing on the edge of a cliff. His existence was predicated on a split-second biological collision. If his parents had waited a month, or even a day, the specific sperm that carried his father's nose and his mother's anxiety wouldn't have won the race. He would not exist. Someone else might, but *he* would be gone.

  Now, looking at the paper, he realized he was holding that same power.

  If they chose Embryo 1, Embryo 2 stayed in the liquid nitrogen. Maybe they'd use it in two years for a sibling. Maybe they wouldn't. Maybe it would thaw poorly.

  But right now, in this moment, choosing Embryo 1 meant Embryo 2 was being paused.

  Mark walked to the window and looked out at the dark suburban street. He tried to imagine the child inside Embryo 2. Was it a little girl? She would have different features than Embryo 1. A different temperament. A different soul.

  *Is she my daughter?* he thought. *Or is she a ghost?*

  He felt a sudden, sharp pang of grief. It felt irrational. Nothing had died. Nothing was being discarded. But the *opportunity* for that specific genetic combination to be the *first* was vanishing. And more than that, he felt a terrifying responsibility for the metaphysics of it.

  By picking Embryo 1, was he erasing Embryo 2?

  Sarah found him an hour later. She was wearing her oversized t-shirt, rubbing sleep from her eyes. She didn't say anything at first, just leaned her hip against the island next to the paper.

  "Can't sleep?" she asked softly.

  "Thinking," Mark said.

  "About the grades? The doctor said 5AA is the best shot, Mark. We talked about this."

  "I know. It's not the grades." Mark tapped the paper. "It's the other one."

  Sarah sighed, not with annoyance, but with the weariness of someone who had processed this grief already. "The backup."

  "The *other kid*, Sarah." Mark's voice cracked. "If we use this one," he pointed to Embryo 1, "that one..." He pointed to Embryo 2. "That's a whole different person. Different sperm, different egg. If we never use it, or if we use it later... does it count as losing a child? Or is it just... data?"

  Sarah reached out and covered his hand with hers. Her palm was warm. "You're doing the thing again. The philosophy spiral."

  "I can't help it. I keep thinking about me. If my parents had sneezed at the wrong time, I wouldn't be here. I'd be someone else. And now I'm deciding which 'someone else' gets to be here first. It feels like I'm playing God with identity."

  "Mark," Sarah said, her voice firm but gentle. "Look at me."

  He looked up.

  "Embryo 2 isn't a lost child," she said. "A lost child is someone who was here, or someone who was certain to be here. That embryo is a possibility. It's a maybe."

  "But it's a *specific* maybe," Mark insisted. "It's a specific person who won't exist if we don't choose them."

  "Everyone is a specific person who won't exist if their parents don't choose to conceive them at that exact second," Sarah said. "That's true for every human being who has ever lived. We are all miracles of timing. You're mourning a timing error that hasn't happened."

  She picked up the paper and folded it in half, hiding Embryo 2 behind Embryo 1.

  "To answer your question," she said. "That isn't a kid you lost. It's a kid who is waiting in the wings. It's not a ghost, Mark. It's just... not the main character yet."

  "But what if we stop at one?" Mark whispered. "What if this one takes, and we're so tired, we never go back for the other one? Then that genetic code never becomes a person. Is that grief valid?"

  Sarah was quiet for a long time. She looked at the folded paper, then out the window at the dark street.

  "I think..." she started, searching for the words. "I think it's okay to feel sad about the road not taken. Even if the road is just a potential path. But you have to remember that *this* one," she tapped the front of the folded paper, "is the one that gets to live. The other one doesn't have a soul yet, Mark. It has a blueprint. The soul comes from the living. From the breathing and the crying and the being held."

  She unfolded the paper and smoothed it out.

  "You're worried that because they are different sperm and eggs, they are interchangeable strangers. But they aren't strangers. They're both ours. Just... different versions of us."

  Mark looked down at the report. The vertigo was still there, that dizzying sense that reality was fragile, that his children's very identities rested on a decision made on a Tuesday night in a kitchen in Ohio.

  "So," Mark said, his voice rough. "Embryo 2. If we don't use him... or her... did they ever exist?"

  "No," Sarah said. She took his hand and pulled him away from the counter, toward the hallway, toward the stairs. "They didn't exist. But the one we choose tomorrow? They're going to exist so hard, Mark. They're going to be so real that it won't matter who didn't make it."

  Mark let her lead him. He looked back once at the white paper on the granite. He thought about the microscopic cluster of cells sleeping in a tank miles away, suspended in time. He thought about the infinite versions of his future children that were dying every second simply because time only moves forward.

  He realized Sarah was right. Grief requires a memory. You can't miss someone you never met. You can't mourn a ghost that never haunted the house.

  But as he climbed the stairs, he made a silent promise to the paper on the counter. He didn't know if Embryo 2 was a lost sibling or a statistical probability. He didn't know if identity was sacred or accidental.

  He just knew that tomorrow, one of them would get to start. And that was enough.

  "Okay," Mark whispered into the dark hallway. "Just one at a time."

  "Just one," Sarah agreed, squeezing his hand. "And that one will be enough."
