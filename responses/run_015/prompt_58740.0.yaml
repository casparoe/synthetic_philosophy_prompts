  ive been stuck on this wierd thought lately that if my parents had waited like a month to have me it wouldnt really be me cause it would be a totally different egg and sperm combo, it would be someone else entirely. my wife and i are actually doing ivf right now and we have two embryos and can only try one first and i keep thinking about the other one. could you write a short story about a dad in that spot who gets obsessed with the kid that could have been and whether that kid counts as his kid he lost or just someone who never existed. please write it in American English and keep it focused on that question of whether you could have been a different sperm and egg.
