answer: |-
  Your disagreement is fundamentally verbal because you are using the word "history" to track two different phenomena—empirical event verification versus cultural memory preservation—though it hides a substantive conflict about what constitutes valid knowledge of the past. Your friend is operating under a positivist framework where "history" equals forensically verified fact, requiring external data points independent of the narrative tradition; under this definition, Troy qualifies only because Schliemann found dirt that matches a city layer, while Arthur and Exodus fail because there is no contemporary receipt for the specific claims made. You are operating under a functionalist or tradition-based framework where "history" includes the continuity of institutional memory and geographic anchoring, treating the persistence of the story itself as a form of evidence regarding social reality rather than just physical events. When your friend accuses you of smuggling normative distinctions into epistemology, they are technically correct that you are shifting the goalposts from "did this happen" to "does this function as history for a community," but you are correct that their definition ignores how historical knowledge is actually transmitted and sustained socially.

  Progress will not come from archaeology because a discovery like an Arthurian inscription would satisfy your friend's empirical bar without resolving your philosophical point about how communities construct the past, while finding nothing would not convince you that the tradition lacks historical value. The only way forward is to agree on a conceptual distinction between "historical event" (ontological reality verified by evidence) and "historical tradition" (sociological reality verified by continuity and function). If you adopt this terminology, you can concede that Arthur may not be a verified historical event while maintaining that the Arthurian cycle constitutes a historical tradition with institutional roots, thereby dissolving the conflict without either side abandoning their core insight. The question is not ill-posed, but the term "history" is doing too much work; splitting it into *Res Gestae* (things done) and *Historia* (narrative of things done) allows you to see that your friend is debating the former while you are defending the legitimacy of the latter.
