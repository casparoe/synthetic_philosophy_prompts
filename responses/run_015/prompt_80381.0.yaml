answer: |-
  ### Exam Question

  **Essay Question: Path Dependence, Inefficiency, and Counterfactuals**

  Consider the following case facts: QWERTY is the standard keyboard layout, designed in the late 19th century partly to slow typists down so the mechanical typewriter's arms wouldn't jam, and it persisted long after that design pressure disappeared because of the cost of retraining typists and the installed base of machines. It is the textbook example of path dependence.

  In 750 words or less, answer the following:

  1.  Explain why the claim that QWERTY is path-dependent does *not* logically entail that QWERTY is inefficient. In doing so, distinguish clearly between the **process claim** (how we got here) and the **evaluative claim** (whether we are here for good reasons).
  2.  Analyze the student's objection: "Obviously a better keyboard would have won eventually, so QWERTY isn't really lock-in." Treat this as a **counterfactual claim**. Does this objection refute the path-dependence claim, weaken the case's force as an example of *harmful* lock-in, or both? You must distinguish between a **strong counterfactual** (the exact same layout was inevitable) and a **weak counterfactual** (only a functionally equivalent layout would have won). Under what conditions does each interpretation hold?

  ***

  ### Model Answer

  To analyze QWERTY rigorously, we must disentangle three distinct philosophical claims often conflated in innovation theory: the process claim, the evaluative claim, and the counterfactual claim. Confusion arises when students assume that demonstrating a historical process is "path-dependent" automatically proves the outcome is sub-optimal, or that arguing for eventual efficiency negates the historical contingency.

  First, we must separate the process claim from the evaluative claim. Path dependence is fundamentally a causal thesis about history. It asserts that a specific outcome is sensitive to small, early, almost arbitrary differences (contingencies) and is subsequently maintained by increasing returns and switching costs. In the QWERTY case, the process claim is that the layout was selected due to mechanical jamming constraints and locked in by the installed base of machines and trained typists. This is a description of *how* the standard emerged.

  The evaluative claim, conversely, concerns *efficiency*. It asks whether the current state maximizes welfare or technical performance relative to available alternatives. While path dependence often leads to inefficiency (lock-in), it does not logically entail it. It is conceptually possible for a path-dependent process to lock in the optimal solution. If QWERTY happened to be the best possible layout *and* was locked in by network effects, it would still be path-dependent because the outcome relied on early contingencies and switching costs to persist against rivals. Therefore, establishing path dependence proves only that history matters to the specific form adopted; it does not prove that the form is bad. To claim inefficiency requires a separate comparative analysis of QWERTY against alternatives (like Dvorak), independent of the historical mechanism that sustained it.

  This distinction clarifies how to assess the student's objection: "A better keyboard would have won eventually." This is a counterfactual claim about inevitability. Its impact on the path-dependence argument depends entirely on whether we interpret it strongly or weakly.

  The **strong counterfactual** asserts that the *exact same* layout (or the specific superior alternative) was inevitable regardless of early historical contingencies. If true, this refutes the path-dependence claim. Path dependence requires that small early differences alter the final outcome. If market forces or technical necessity guarantee that a specific layout wins regardless of the 19th-century mechanical constraints or early adoption patterns, then the process is not sensitive to initial conditions. There is no "path," only a gravitational pull toward a single equilibrium. If the student argues that Dvorak was inevitable, they are denying the historical contingency required for path dependence.

  However, the student likely intends the **weak counterfactual**: that *some* functionally equivalent, efficient layout would have been adopted eventually, even if it wasn't QWERTY. This interpretation coexists with the path-dependence claim but shrinks the welfare loss. Here, we admit that the specific form (QWERTY) is contingent and locked in (satisfying the process claim), but we argue that the *function* (typing efficiency) converges across different standards. If all viable keyboard layouts offer roughly similar typing speeds, then the "lock-in" to QWERTY is not *harmful*, even if it is path-dependent. The switching costs prevent movement, but the welfare loss is negligible because the alternative functionally equivalent paths yield similar returns.

  Therefore, the student's objection fails to refute path dependence unless they argue for the strong counterfactual (inevitability of the specific form). If they argue the weak counterfactual (inevitability of function), they concede the path dependence but challenge the normative weight of the example. The QWERTY case remains a valid instance of lock-in because the specific form was contingent and is now fixed by switching costs. However, if functional convergence is high, the example loses its force as a warning about *harmful* technological stagnation. The error lies in assuming that because efficiency might be robust (weak counterfactual), history is irrelevant (denial of path dependence). History determines the specific coordinate on the efficiency plateau, even if the plateau itself was inevitable.

  ***

  ### Marking Scheme (20 Points)

  **1. Distinction between Process and Evaluative Claims (5 points)**
  *   **5 pts:** Clearly defines path dependence as a causal/historical claim (contingency + increasing returns) and efficiency as a normative/welfare claim. Explicitly states they are orthogonal (PD can lock in optimal or sub-optimal outcomes).
  *   **3 pts:** Distinguishes the two but implies PD usually means inefficiency without clarifying logical independence.
  *   **0 pts:** Conflates history with quality (e.g., "PD means we made a bad choice").
  *   *Typical Error:* Students assume "lock-in" is a pejorative term by definition, rather than a structural description.

  **2. Analysis of the Strong Counterfactual (5 points)**
  *   **5 pts:** Identifies that if the *specific* layout was inevitable, path dependence is refuted (no sensitivity to initial conditions).
  *   **3 pts:** Notes it challenges PD but fails to explain why (misses the "sensitivity to initial conditions" criterion).
  *   **0 pts:** Claims strong inevitability supports path dependence.
  *   *Typical Error:* Arguing that "inevitability" is just a very strong form of path dependence, rather than its negation.

  **3. Analysis of the Weak Counterfactual (5 points)**
  *   **5 pts:** Explains that functional equivalence allows PD (specific form is contingent) but reduces harm (welfare loss is low).
  *   **3 pts:** Accepts weak counterfactual reduces harm but fails to link it back to the validity of the PD claim.
  *   **0 pts:** Dismisses weak counterfactual as irrelevant to the case.
  *   *Typical Error:* Treating "functional equivalence" as identical to "same layout," missing the form/function distinction.

  **4. Synthesis and Conditions (5 points)**
  *   **5 pts:** Concludes that the student's objection only refutes PD under the strong interpretation, but undermines the *harm* claim under the weak interpretation.
  *   **3 pts:** Conclusion is present but ambiguous about which interpretation validates which part of the argument.
  *   **0 pts:** No clear conclusion or takes a side without nuance.
  *   *Typical Error:* Trying to prove QWERTY is actually efficient rather than analyzing the logical structure of the argument.

  ***

  ### Self-Critique of the Model Answer

  The most vulnerable point in my model answer is the definition of **functional equivalence** in the weak counterfactual section. I argue that if all layouts yield similar speeds, the welfare loss is negligible. However, a sharp student could press that in networked technologies, the "function" *includes* compatibility. If the function is "typing + sharing files with others," then QWERTY is *not* functionally equivalent to Dvorak for an isolated user, because the switching cost *is* the loss of function. By separating "form" (layout) from "function" (typing), I may be artificially isolating technical performance from social utility. If the network effect is part of the function, then the "weak counterfactual" collapses back into the "strong" one regarding welfare, because no other layout provides the *same* function (compatibility). A grader using this key should be prepared to award full points if a student argues that network effects make the specific layout constitutive of the function, thereby making the weak counterfactual impossible.
