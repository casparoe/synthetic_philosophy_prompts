answer: |-
  ### (1) The implicit picture

  The diagnostic practice implicitly operates on a model of "operational realism." By providing checklists with specific thresholds, the manual treats disorders as if they are discrete entities waiting to be detected, akin to infectious diseases or broken bones. This suggests a categorical ontology: you either have the disorder or you don't, implying a qualitative boundary between health and pathology. The binary outcome required for billing and coding reinforces this view, presupposing that there is a fact of the matter about whether a patient belongs inside or outside a category. This mirrors the traditional medical model, where a pathogen is either present or absent, promising a clear route to treatment. However, the historical revisions you noted—removing homosexuality, merging Asperger's—reveal that these boundaries are not fixed natural laws but consensus-driven conventions. Consequently, the system presupposes a pragmatic hybrid: it acts *as if* disorders are natural kinds to facilitate medical authority and insurance reimbursement, even while the underlying science acknowledges that these categories are socially constructed, evolving descriptions of human distress rather than discovered biological essences. The practice demands the certainty of a label for administrative clarity while relying on the flexibility of committee votes for scientific accuracy, creating a tension between the appearance of objective discovery and the reality of negotiated classification.

  ### (2) Strict presuppositions vs. comfortable fit

  Strict presuppositions are mostly administrative, not clinical. Insurance companies and legal systems require binary decisions to allocate finite resources; you either qualify for disability benefits or you do not. This logistical necessity forces a discrete view onto fuzzy phenomena, creating a "cliff edge" where a single symptom change alters eligibility. Similarly, pharmaceutical research often requires homogeneous groups to prove drug efficacy, presupposing that the label identifies a distinct biological mechanism. However, much of the system fits comfortably with a fuzzy-cluster view. Clinical treatment does not strictly require discrete kinds; therapists target symptoms and functioning regardless of the specific label. A clinician can treat anxiety mechanisms without needing to know if you perfectly meet Generalized Anxiety Disorder criteria. Epidemiology can track spectra rather than categories. The inconsistency lies in forcing dimensional human experiences into categorical boxes for the sake of bureaucracy. The system presupposes discreteness where money and law are involved, but clinicians often operate dimensionally in the room. The manual serves as a translation layer between the fuzzy reality of suffering and the rigid requirements of institutional gatekeeping. Therefore, the strict need for discrete kinds is not driven by the nature of psychopathology itself, but by the structures built around it. If insurance paid for impairment rather than diagnosis, the need for discrete categories would vanish. The current practice conflates the ontology of distress with the ontology of bureaucracy, demanding natural kinds for payment purposes while accepting constructivism for clinical updates. Furthermore, modern research initiatives like the NIMH's RDoC explicitly reject these categories in favor of dimensional biological systems, suggesting the science itself is outgrowing the manual's presuppositions. The practice holds together only because the administrative shell protects the clinical core from the chaos of pure dimensional assessment.

  ### (3) Switch or dial

  The binary diagnosis and severity specifiers are reconcilable if viewed as a two-step process. The diagnosis acts as a switch to grant access to the system, confirming that the cluster of symptoms is significant enough to warrant attention and resources. Once inside, the severity specifier acts as a dial, guiding the intensity of intervention. This hybrid model acknowledges that while the threshold for "disorder" is arbitrary, the variation within the disorder is real and clinically relevant. It allows the system to maintain binary gatekeeping for insurance while acknowledging clinical nuance. It is consistent pragmatically, if not ontologically. The switch validates the suffering as medical rather than existential; the dial ensures the treatment matches the burden. This resolves the contradiction by separating the question of "is this a medical issue?" from "how bad is this medical issue?" allowing clinicians to speak both languages depending on the audience.

  ### (4) What would change

  If we dropped the discrete-kind picture, the manual would become a dimensional profile system. Patients would receive scores on various spectra (mood, anxiety, cognition) rather than a single label. Insurance would need to reimburse based on functional impairment levels rather than ICD codes, requiring a massive bureaucratic overhaul. Courts would assess capacity and risk directly, not via diagnostic proxies. Stigma might decrease as the "broken vs. normal" dichotomy fades, replaced by a universal understanding of varying mental health states. Research would focus on underlying mechanisms across traditional boundaries. However, this would complicate communication; "major depression" is a shorthand we would lose. The system would become more accurate but less efficient. Additionally, patient communities often organize around specific labels; dissolving these might weaken advocacy groups while reducing self-stigma. Clinicians would need new training to interpret complex profiles rather than applying algorithmic criteria. Ultimately, the change would shift power from the classification system to the individual's lived experience, but it would demand a level of nuance from insurers and courts they currently resist. The infrastructure of care is built on the simplicity of the checkbox, and removing it requires rebuilding the foundation.

  ### (5) Loose ends

  I am least sure whether neuroscience will eventually validate some of these categories as biologically distinct, which would retroactively justify the current binary approach. Additionally, it remains unclear whether removing diagnostic labels would ultimately help patients by reducing stigma or harm them by obscuring access to specialized care.
