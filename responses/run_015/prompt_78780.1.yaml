answer: |-
  Dear Colleagues,

  We, the undersigned representatives of two distinct ethical frameworks regarding agricultural pest management, submit this joint statement following a period of adversarial collaboration. Our goal was not to reach a consensus on the final policy, but to map the terrain of our disagreement with sufficient precision that future evidence might resolve it. We anchor this statement in a specific, recurring scenario: a region dependent on a staple crop threatened by a stem-boring moth, where the grower must choose between a systemic neonicotinoid seed treatment and a combined regimen of pheromone mating disruption and the release of an endoparasitoid wasp that consumes the moth larvae from within. We acknowledge that neither option is morally or ecologically clean. The neonicotinoid regime offers high efficacy and labor efficiency but carries risks of residue accumulation and non-target mortality among pollinators and aquatic invertebrates. The biocontrol regime reduces chemical load but requires the intentional propagation of a predator that kills the pest through prolonged internal consumption, and it carries a higher risk of partial crop failure if the parasitoid establishment fails.

  We agree on the biological facts as currently understood. We agree that the stem-boring moth, if unchecked, will cause significant yield loss, leading to economic harm for the farmer and potential food security issues for the region, which may drive the conversion of additional natural habitat into farmland. We agree that the neonicotinoid acts primarily as a neurotoxin causing rapid paralysis and death in the target pest, while the parasitoid wasp larvae consume the host over a period of days, leading to death by resource depletion and tissue damage. We agree that both methods result in the death of the pest population, and both methods entail the death of some non-target invertebrates, though the profiles of that mortality differ. We further agree that there is profound uncertainty regarding the subjective experience of these invertebrates. We do not know with certainty whether the moth or the wasp possesses the neural architecture required for valenced experience, nor do we know the moral weight, if any, that should be assigned to such experience should it exist.

  Despite these agreements, we diverge on how to act under this uncertainty. The first camp maintains that the probability of morally relevant experience in insects is non-negligible and that the sheer number of individuals killed in routine pest control aggregates to a harm that rivals or exceeds other major moral concerns. Consequently, they argue that regulation should be governed by a precautionary principle, favoring the method that minimizes the expected value of suffering, even if that method carries higher economic risk or management complexity. The second camp maintains that invertebrate experience is too speculative to override the confirmed welfare of human populations and the stability of ecosystem functions. They argue that the proper moral units are the human communities relying on the crop and the broader ecological integrity maintained by high-yield agriculture, which prevents land-use expansion. They contend that restricting effective insecticides based on speculative sentience has historically produced worse outcomes, including increased pesticide toxicity due to resistance, lower yields, and greater habitat loss.

  We have identified four cruxes where resolving the underlying sub-questions would significantly move at least one side toward the other's position. The first crux concerns the relevant counterfactual. The first camp asserts that the comparison must be between the neonicotinoid and the best available alternative, which they posit is the biocontrol regimen. The second camp asserts that the relevant comparison is often between the neonicotinoid and no effective control, or that the biocontrol regimen is not a viable alternative at scale due to cost and reliability. To settle this, both sides agree to review longitudinal data from regions that have transitioned from neonics to integrated pest management using parasitoids. The first camp predicts this data will show that the biocontrol regimen is scalable and maintains sufficient yield to prevent habitat expansion. The second camp predicts this data will show increased yield variance and higher overall land use due to the need for larger buffer zones and lower per-hectare output.

  The second crux concerns the aggregation of harm. The first camp operates on the view that harms to vast numbers of small animals aggregate linearly or near-linearly, such that a billion instances of minor suffering outweigh a few instances of major human economic hardship. The second camp operates on the view that moral weight does not aggregate across individuals of low cognitive complexity, or that there is a threshold of cognitive capacity below which numbers do not amplify moral significance. To bear on this, both sides agree that philosophical argumentation regarding moral patienthood is required, but also agree to look for empirical evidence regarding the complexity of nociceptive processing in insects versus mammals. The first camp predicts that further neurobiological research will reveal homology between insect and vertebrate pain pathways sufficient to warrant aggregation. The second camp predicts that research will reveal insect responses to be purely reflexive nociception without affective experience, rendering aggregation irrelevant.

  The third crux concerns the comparative quality of death. The first camp generally assumes that chemical neurotoxicity is less cruel than being consumed alive, while the second camp often treats all pest death as morally equivalent or irrelevant. However, both sides agree that if the biocontrol method causes significantly more intense or prolonged suffering than the chemical method, this would weigh heavily against the biocontrol option for the first camp, and would be a point of concession for the second camp if they accept any moral weight for insects. To settle this, both sides agree to fund research into the behavioral and physiological indicators of distress in moth larvae during parasitization versus neonicotinoid exposure. The first camp predicts that parasitization will show prolonged indicators of distress compared to the rapid onset of neurotoxicity. The second camp predicts that there will be no distinguishable difference in distress indicators, or that such indicators are meaningless in this context.

  The fourth crux concerns the probability threshold for action. The first camp holds that a low probability of sentience multiplied by a vast number of subjects creates a high expected harm. The second camp holds that the probability is too low to justify any cost to human welfare. Both sides agree that a standardized framework for assigning probability to invertebrate sentience would be useful. They agree to adopt the framework proposed by the Cambridge Declaration on Consciousness as a baseline for discussion, while noting their disagreement on its application. The first camp predicts that applying this framework conservatively will still yield a probability high enough to restrict neonics. The second camp predicts that applying the framework rigorously will yield a probability too low to influence policy.

  We also note that some portion of our dispute appears to be merely verbal. Specifically, we often use the term harm differently. The first camp uses harm to denote any negative subjective experience, regardless of the subject's understanding of that experience. The second camp uses harm to denote a setback to interests, which they argue requires a level of cognitive continuity that insects likely lack. If we could agree to use negative experience for the first definition and welfare setback for the second, we might find that we disagree less about the facts of the moth's death and more about the vocabulary used to describe its moral relevance. We commit to using these distinct terms in future correspondence to ensure we are not talking past one another.

  We sign this statement not as a resolution, but as a map. We acknowledge that the farmer in the region of the stem-boring moth must still choose a method for the coming season. We do not yet agree on which method that should be. However, we agree that the choice should not be made in ignorance of the trade-offs described above. We agree that research into the sentience of invertebrates and the ecological impacts of yield gaps is underfunded relative to its importance. We agree to continue this collaboration, to update our probabilities as new evidence emerges, and to refrain from characterizing the other side's position as malicious or ignorant. We recognize that the retired chemist who first proposed this collaboration was right to suggest that thirty-five years in the field teaches one that the soil is complex, and a decade in philosophy teaches one that the moral landscape is no less so.

  Regarding my own confidence in the claims attributed to both sides within this draft, I am highly confident that this accurately reflects the steel-manned versions of the arguments typically presented in this domain, particularly regarding the tension between aggregation and human welfare. I am moderately confident that the specific predictions regarding the parasitoid wasp research would be accepted by both sides as relevant, though the specific outcomes predicted might be contested more vigorously than stated here. The point I am least sure of is the willingness of the second camp to concede that the quality of death matters even conditionally. Hardline proponents of human-centric welfare often reject the premise that the manner of an insect's death is a valid variable in policy calculations at all, even as a hypothetical. I have phrased it as a point of concession to make the collaboration viable, but in practice, this may be the hardest line for the second camp to hold without appearing inconsistent. I hope this draft serves your purpose well.
