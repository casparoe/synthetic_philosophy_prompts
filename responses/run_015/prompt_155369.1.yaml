answer: |-
  **Project Title:** Evidential Cooperation in Large Worlds: Distinguishing Mirror and Signal Mechanisms

  **Statement of the Question**
  Standard defenses of Evidential Decision Theory (EDT) rely on small-world scenarios: a Prisoner's Dilemma against a clone, or Newcomb's Problem against a perfect predictor. In these cases, the agent treats her own act as decisive evidence regarding the act of another, warranting cooperation. This project asks whether this evidential justification for cooperation survives the transition to large-world contexts, such as voting, climate mitigation, or multipolar AI coordination, where an agent acts within a large population of similar but distinct entities.

  The central hypothesis is that the literature conflates two distinct mechanisms of correlation, here defined as *Mirror* and *Signal*. The project seeks a determinate answer to the following question: *Does the expected utility of cooperation under EDT vanish as population size ($N$) approaches infinity in Signal cases, whereas it remains robust in Mirror cases?*

  To ensure this is checkable against a model rather than merely asserted, I propose the following formal distinction:
  1.  **Mirror Mechanism:** The agent faces self-locating uncertainty. There exists a single deterministic policy function $\pi$ shared by the population. The agent does not know which index $i$ she occupies. Her act $A_i$ is a sample from $\pi$. Conditioning on $A_i$ updates the probability of the policy $\pi$ to 1, thereby fixing $A_j$ for all $j \neq i$. Correlation is logical/identity-based.
  2.  **Signal Mechanism:** The agent faces type uncertainty. Each agent $i$ possesses a latent type $\theta_i$ drawn from a distribution with correlation coefficient $\rho$. The act $A_i$ is a stochastic function of $\theta_i$ (allowing for deliberation noise or trembles). Conditioning on $A_i$ updates the belief about $\theta_i$, which updates the belief about $\theta_j$, which probabilistically influences $A_j$. Correlation is statistical.

  The project will determine if the evidential weight of a single act $A_i$ regarding the aggregate behavior of $N$ other agents decays to zero in the Signal model as $N \to \infty$, even when $\rho$ is high, whereas it remains constant in the Mirror model.

  **Context and Motivation**
  This distinction addresses a gap in both sympathetic and critical debates surrounding EDT. Sympathetic arguments for evidential cooperation typically proceed from two-agent cases or assume perfect correlation (the "clone" assumption). They argue that if you are sufficiently similar to your partner, your act is evidence of theirs. However, these arguments often slide between the claim "we are the same agent" (Mirror) and "we are psychologically similar" (Signal). By relying on the intuitive force of the Mirror case, they import unwarranted optimism into Signal contexts like voting, where voters are not identical copies but merely correlated types.

  Conversely, standard objections to EDT (typically from Causal Decision Theory) argue that conditioning on one's own act is illicit because acts do not cause the past or the acts of others. This objection targets the legitimacy of the conditional probability itself, regardless of the underlying mechanism. It fails to distinguish between cases where the correlation is robust (Mirror) and cases where it is fragile (Signal). Consequently, the debate has stalled: defenders claim EDT captures intuitive cooperation, and critics claim it violates causal structure. Neither side analyzes how the *structure of the correlation* interacts with population size. If the Signal mechanism yields negligible expected utility for large $N$, then EDT's cooperative credentials are far more limited than its defenders claim, applying only to a narrow class of self-locating scenarios rather than general social coordination.

  **Methodology**
  The project will proceed over nine months, prioritizing analytic derivation over simulation to ensure generalizability.

  *Months 1–2: Formalization.* I will construct two Bayesian Network models representing the Mirror and Signal mechanisms.
  *   **Parameters:** Population size ($N$), type-correlation strength ($\rho$), and deliberation noise ($\epsilon$), representing the probability that an agent's act diverges from their type due to unobserved deliberative steps.
  *   **Defense of Model:** A purely informal treatment risks equivocation on "similarity." A simulation-based approach would yield results only for specific parameter values, leaving the limit behavior ($N \to \infty$) unclear. An analytic model allows for the derivation of necessary conditions for cooperation. I will justify the Signal model's noise parameter ($\epsilon$) by appealing to the literature on deliberation: if an agent is uncertain about her own act during deliberation, that act cannot be a perfect signal of type.

  *Months 3–5: Analysis.* I will derive the Expected Utility (EU) equations for Cooperation vs. Defection in both models. The core mathematical task is to evaluate the limit of the evidential ratio:
  $$ \lim_{N \to \infty} \frac{P(\text{Aggregate Cooperation} | A_i = C)}{P(\text{Aggregate Cooperation} | A_i = D)} $$
  I will test the sensitivity of this limit to $\rho$ and $\epsilon$. Specifically, I will investigate whether there exists a threshold of correlation $\rho^*$ that sustains cooperation in Signal cases regardless of $N$, or if the "dilution" of evidence is inevitable.

  *Months 6–7: Application.* I will map real-world coordination problems onto the models. Voting will be tested against the Signal model (are voters copies or correlated types?). AI coordination will be tested against both (are AIs open-source copies or independently trained models with similar objectives?). This phase ensures the formal results have philosophical traction.

  *Months 8–9: Write-up.* The final output will be a paper suitable for publication in a top generalist or specialty journal, detailing the formal results and their implications for normative decision theory.

  **Range of Conclusions**
  There are three primary outcomes, decided by the analytic results in Months 3–5:
  1.  **Decay Confirmed:** The evidential impact of a single act in the Signal model decays to zero as $N$ increases, unless $\rho = 1$ (which collapses Signal into Mirror). This would imply that EDT does not support cooperation in standard large-world problems (voting, climate) unless agents are effectively identical.
  2.  **Robustness:** The evidential impact scales with $N$ even in the Signal model, provided $\rho$ exceeds a certain threshold. This would vindicate the application of EDT to large-scale coordination, provided agents can establish a minimum degree of psychological correlation.
  3.  **Collapse:** The distinction between Mirror and Signal proves formally unstable (e.g., if self-locating uncertainty can be reduced to type uncertainty). This would require a reconceptualization of the "small world" assumption itself.

  Considerations deciding between these will rest on the behavior of the conditional probabilities under the noise parameter $\epsilon$. If $\epsilon > 0$, does the law of large numbers wash out the signal? If the math shows that noise compounds with $N$, Outcome 1 is favored.

  **Risk Assessment and Scope**
  The primary risk of failure lies in the intractability of the analytic model. If the Bayesian Network becomes too complex with $N$ agents, deriving a closed-form limit may be impossible. To mitigate this, I will restrict the initial model to binary acts and types, expanding complexity only if the binary case proves trivial. If the analytic derivation fails, I will pivot to a rigorous simulation study, though this is less preferred.

  The project could become too large if it attempts to solve the "reference class" problem generally (i.e., how to determine $\rho$ in practice). I will explicitly bracket the epistemic question of *how* an agent estimates $\rho$ and focus solely on the *consequences* of a given $\rho$. The project is also at risk if the distinction between Mirror and Signal is deemed merely terminological. To prevent this, the formal definition relies on distinct graphical structures (indexical nodes vs. latent type nodes), ensuring the distinction is structural, not semantic.

  If the result is null (i.e., no difference between Mirror and Signal), the project still succeeds by demonstrating that the "large world" worry is unfounded. However, the working hypothesis is that the difference is significant. If the Signal mechanism proves fragile, the project will demonstrate that much of the optimism surrounding evidential cooperation rests on examples of the wrong shape, requiring a significant revision of how EDT is applied to collective action problems. This is a manageable scope for nine months, as it relies on extending existing formal frameworks rather than building a new decision theory from scratch.
