      *(Self-Correction on "No Citations"):* I must avoid naming specific philosophers (e.g., Arntzenius, Briggs, Pettigrew) even if I know they are relevant. I must speak to the ideas generally.

      *(Refining the "De-biased" analysis):* If I treat future credence as a signal, I am essentially doing Bayesian Conditionalization on the proposition "My future self assigns x." If I know the distortion function $D$, then $P_{now}(A | P_{future}(A)=x) = P_{now}(A | D(Evidence)=x)$. This collapses RP into standard Conditionalization. This is a strong point to make: RP is only distinct from Conditionalization if we assume the future self is an *unbiased expert*. If we drop that, RP vanishes into Bayes.

      *(Refining the "Plan" analysis):* Plan Reflection looks like a shift to *Global Bayesianism*. The stalemate relocates to whether agents have access to their own policies (luminosity).

