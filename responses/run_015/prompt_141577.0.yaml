answer: |-
  ### 1. The Principle Your Verdicts Are Tracking

  Your verdicts do not track a simple rule against "private gain" or "quid pro quo." Case 4 allows private gain (re-election); Case 5 and 10 condemn gains without explicit deals. Your verdicts track **The Principle of Fiduciary Displacement**.

  On your account, corruption is not defined by the transfer itself, but by whether that transfer creates a **competing obligation** that displaces the official's primary loyalty to the public purpose of their office.

  *   **Clause A (The Displacement):** The transfer creates a claim on the official's judgment or conduct that competes with their fiduciary duty to the public. (Motivated by Cases 5, 6, 10).
  *   **Clause B (The Authorization):** The claim is illegitimate because it is not authorized by public rule or constitutive custom. (Motivated by Case 7 vs. Case 6; Case 4 vs. Case 5).
  *   **Clause C (The Excuse):** The corruption may be acknowledged but sanction waived if the official acts under duress or necessity to fulfill the office's basic function. (Motivated by Case 1).

  This explains why Case 2 is not corrupt (retrospective gratitude creates no *forward-looking* obligation) while Case 11 is corrupt (a gift from a lobbyist friend creates a *latent* obligation of reciprocity that competes with legislative duty, regardless of explicit intent). It explains Case 4 (the obligation is to the voters, which *is* the public purpose of the office) versus Case 5 (the obligation is to the son, which is private).

  ### 2. Repairing Your Test

  Your current **Counterfactual-Relation Test** has two flaws.

  **Clause (i) ("But for the role") is doing no work.**
  Case 11 breaks it. As you noted, the friend might have given the watch regardless. More importantly, Case 10 (Revolving Door) breaks it. The bank does not offer the job *but for* the role; they offer it *because* of the role. But the regulator's *acceptance* of the possibility is the issue. Clause (i) focuses too much on the giver's motive. Corruption is primarily about the **receiver's vulnerability to obligation**. You should delete Clause (i).

  **Clause (ii) ("Point is to make role answer to interests") is doing too much work.**
  It requires intent ("the point is"). This fails on Case 5 (no prior understanding) and Case 10 (no bribe offered). It also fails to capture Case 8 (systemic corruption), where the "point" is development, but the *effect* is displacement.
  **Repair:** Replace Clause (ii) with: *"The transfer creates a reasonable expectation, explicit or structural, that the official's discretion will be exercised with regard to the giver's interests."* This covers structural incentives (Case 10) and implicit understandings (Case 5) without requiring proof of a specific deal.

  **On your Colleague's Extractive/Integrative Sort:**
  You are right to reject it, but your reason needs sharpening. It collapses on Case 11 not just because it's integrative, but because **integration can be corrosive.** A relationship that integrates an official into a private network (lobbyist friend) displaces their integration into the public network (constituents). The test isn't Extractive vs. Integrative; it is **Public Integration vs. Private Integration.** Case 2 (Chicken) reinforces public integration (nurse as community member). Case 11 (Watch) reinforces private integration (legislator as friend/dependent).

  ### 3. The Asymmetry of Case 3 (Clerk vs. Applicant)

  The asymmetry is a feature, not a bug. Corruption is a **status offense** attached to the fiduciary role.

  *   **The Clerk:** Holds a public trust. By demanding payment, he substitutes a private claim for a public rule. He is corrupt.
  *   **The Applicant:** Holds no public trust. She is entitled to the card. Her payment is a **ransom**, not a bribe. She is purchasing access to her own rights.

  If you call the applicant corrupt, you equate the victim of extortion with the extortionist. This is morally distinct from a case where an applicant pays to *jump* a queue (which would be corrupt, as it seeks preferential treatment). In Case 3, the asymmetry protects the vulnerable from being criminalized for surviving the corruption of the state. You are using one word ("corrupt") correctly to describe a breach of trust; since only one party holds that trust, only one party can be corrupt.

  ### 4. Verdicts on New Cases

  **A. The Legislator and the Pre-existing Belief**
  *Verdict: Not Corrupt.*
  Under the Principle of Fiduciary Displacement, the contribution does not create a *competing* obligation because the loyalty (the belief) pre-exists the money. The money does not displace the public purpose; it aligns with it. However, this is a **High-Risk Zone.** Without strict disclosure, it creates an *appearance* of displacement that erodes public trust (similar to Case 10). It is permissible but requires transparency to prevent it from becoming Case 5.

  **B. The Hiring Manager and the Nephew**
  *Verdict: Procedurally Corrupt, Substantively Excusable.*
  The appointment creates a private obligation (family loyalty) that competes with the public duty of impartiality. Even if the nephew is the best candidate, the *process* has been subverted by a private claim. This is corruption of the *institution's integrity*, not necessarily the *outcome*. To avoid corruption, the manager must recuse herself. Failure to disclose is the corrupt act; the hiring itself is the damage.

  **C. The Convoy Commander and the Militia**
  *Verdict: Corrupt but Justified (Necessity).*
  This is Case 1 scaled up. The payment creates an obligation to the militia (fueling their capacity to harm others) which competes with the public duty to uphold the rule of law. It is corrupt. However, like the nurse in Case 1, the commander faces a necessity: feed the population now or adhere to principle and let them starve. It is a **corrupt act justified by duress.** Your institution should not sanction it, but should not pretend it isn't corruption.

  ### 5. The Verdict You Must Overturn

  To maintain a defensible account, you must overturn **Case 9 (The University Donor).**

  You call Case 10 (Revolving Door) corrupt because it creates a systemic incentive for soft regulation, even without an explicit deal. Case 9 is structurally identical: a large transfer of value creates a systemic incentive for soft admissions, even without an explicit deal.
  If you maintain that Case 10 is corrupt because it "corrodes" the institution's purpose, you cannot call Case 9 "not corrupt" merely because no phone call was made. The *capacity* of the gift to distort the institution's purpose is the corruption. You admit "the university ought to refuse the gift." If they ought to refuse it to protect their integrity, accepting it is a breach of that integrity.
  **Why this matters:** If you keep Case 9 as "not corrupt," you concede that institutional corruption requires a *smoking gun* (explicit deal). If you overturn it, you align with Case 10 and acknowledge that **institutional vulnerability to private claim is itself corruption.** This strengthens your hand against Case 5 and Case 11.

  ### 6. Universality vs. Parochialism

  Your account commits you to **Functional Universalism.**

  *   **Universal:** The *logic* of corruption is universal. Every office, in every culture, has a "public purpose" or a "constitutive role." Betraying that purpose for a private claim is always corruption.
  *   **Contextual:** The *content* of that purpose is local. In Case 7, if the Headman's role is constituted by customary law, the drink is part of the role, not a private claim. In Case 6, the Doctor's role is constituted by medical ethics (universalized), so the lunch is a private claim.

  **The Trap of Case 8:**
  Your institution commits the corruption in Case 8 when it mistakes *procedural universalism* (our rules) for *functional universalism* (fiduciary duty). By criminalizing customary gift-giving (Case 7) to satisfy your own procurement rules, you are forcing officials to choose between their local legitimacy (constitutive custom) and your funding. This *creates* corruption (Case 1 style survival bribery) by destroying the local norms that previously regulated the office.

  **Should you use the word "Corruption" less?**
  No. But you must distinguish **Individual Corruption** (Case 1, 3, 5) from **Systemic Corruption** (Case 8, 9, 10).
  *   Cases 9 and 10 are not merely "injustice" or "abuse of power." They are corruption because they involve the **monetization of fiduciary trust.**
  *   Case 8 is corruption because the MDB is allowing its *private interest* (disbursement targets/risk aversion) to displace its *public purpose* (sustainable development).

  **Conclusion for your Guidance Note:**
  Define corruption as **"The displacement of public purpose by private claim."**
  1.  Acknowledge that not all corruption is sanctionable (Case 1).
  2.  Acknowledge that not all corruption is illegal (Case 10, Overturned Case 9).
  3.  Acknowledge that not all transfers are corrupt (Case 2, Case 7).
  4.  Warn your institution that imposing rules which destroy local fiduciary structures (Case 8) is itself a corrupting act.

  This allows you to hold the line on Case 5 and 10 without becoming a moral imperialist in Case 7, and without hypocrisy in Case 8.
