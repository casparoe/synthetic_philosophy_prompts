      *   **Tier 3: The Insulation Problem (Philosophical Coherence):**
          *   Tautology risk.
          *   Normative force (why *should* we be diachronic agents?).
      *   **Conclusion:** Summary of the view's viability.

  6.  **Drafting the Content (Iterative refinement):**
