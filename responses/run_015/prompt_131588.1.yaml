      *   *Refining the Empirical Point:* Use the Concorde example but also the "Agile" counter-example.
      *   *Refining the Insulation Point:* This is crucial. If the theory says "Quitting means you weren't a unified agent," it's circular.

  7.  **Final Review against Constraints:**
