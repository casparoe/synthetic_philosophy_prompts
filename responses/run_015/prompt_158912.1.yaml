  **OFFICE OF PUBLIC ANNOUNCEMENTS**
  **MANUAL OF EFFECTIVE NOTICE (REV. 4.2)**
  **SECTION 8: EPISTEMIC COMPLIANCE AND CERTIFICATION STANDARDS**

  **8.1 Certification of Mutual Knowledge Depth**
  Pursuant to *State v. Infinite Regress*, legal effect requires Common Knowledge in the strict sense (hereinafter "CK-∞"). As CK-∞ is administratively unverifiable, the Office issues Level-*k* Certificates of Mutual Knowledge. A Level-*k* Certificate confirms that all parties know *X*, know that others know *X*, iterated *k* times. Parties are advised that finite certification does not satisfy the statutory CK-∞ requirement but constitutes a safe harbor against negligence claims. Inspectors are directed to void any coordination plan relying on a depth lower than the strategic complexity requires. Per Inspector General Notice 19-C, a depth-three certificate is worthless for any coordination whose justification needs four levels; agents found accepting Level-3 forms for Level-4 dependencies shall be subject to disciplinary review. A grey market in forged deeper certificates has been identified; verification must be conducted via the OPA-Form 77 database.

  **8.2 Transmission Channels and Simultaneity**
  Where messages traverse lossy channels, no finite exchange of delivery confirmations suffices to establish CK-∞. Consequently, any plan requiring simultaneous action—including but not limited to a dawn attack, a coordinated withdrawal of funds, or a synchronized lunch break—is void *ab initio* however many confirmations were logged. Parties must utilize Approved Public Channels (broadcast media, town criers) rather than merely reliable private ones (couriers, encrypted packets). Private confirmations may establish mutual knowledge but cannot bridge the gap to common knowledge without public observability. Failure to utilize an Approved Public Channel for simultaneous actions renders all participants liable for unilateral deviation damages.

  **8.3 Presupposition of Rationality**
  Every notice presupposes that its recipients are rational maximizers and that this is common knowledge. A citizen who publicly announces an intention to act irrationally therefore invalidates every notice pending against him, including the notice of the penalty for doing so. Upon filing a Declaration of Irrationality (OPA-Form 31), the subject is deemed incapable of responding to incentives. Enforcement actions suspended due to declared irrationality shall remain suspended until the subject files a Reaffirmation of Rationality. Note: Filing a Reaffirmation while acting irrationally constitutes fraud; acting irrationally while filing a Reaffirmation constitutes evidence of mental incapacity requiring guardianship.

  **8.4 Market Licensing and Prior Divergence**
  Because parties who share priors and know one another to be rational cannot gain from voluntary exchange (see *Aumann v. State*), traders must file a Prior Divergence Disclosure or a certified private-information claim prior to execution. Trades lacking one are presumed void. The Office assumes all market activity indicates undisclosed private information or divergent priors. In the event of a settlement conference, the parties must file identical posterior probability statements regarding the disputed facts. Residual disagreement is treated as evidence of an undisclosed private prior and triggers an automatic audit of both parties' communication logs. Consensus is mandatory; disagreement is non-compliance.

  **8.5 Sequential Contracts and Bounded Rationality**
  A chain of trusting moves requires common knowledge of rationality to a depth equal to the length of the chain. Contracts exceeding the parties' certified depth are voidable at the option of the final mover. To mitigate this, parties must buy bounded-rationality riders and irrationality insurance proportional to the contract term. A ten-step contract requires Level-10 certification; absent such certification, the contract is treated as a series of unilateral gifts subject to gift tax. Inspectors shall verify that the depth of the rationality certificate matches or exceeds the number of contingent clauses within the agreement.

  **8.6 Validity of Manual Provisions**
  The provisions contained within this Manual bind the Office and the Public only if they are common knowledge. To certify this status, any party may request a Certificate of Manual Common Knowledge via OPA-Form 990. Applicants are notified that OPA-Form 990 requires the applicant to certify that they know the Manual is binding, know that the Office knows it is binding, and so on without end. As no finite agent can complete the infinite recursion required to validly file OPA-Form 990, no such form shall be processed. Until a valid Form 990 is filed, the binding nature of this Manual remains contingent. Users proceed at their own epistemic risk.
