answer: |-
  **Project Title:** Geometric Rationality and the Normative Structure of Risk: A Taxonomy of Decision Contexts

  **Project Overview**

  Decision theory provides the normative backbone for rational choice across economics, philosophy, and public policy. For decades, the dominant framework has been Expected Utility (EU) theory, which advises agents to maximize the arithmetic mean of utility across possible outcomes. However, a challenging alternative has gained traction: geometric rationality, often associated with the Kelly criterion and ergodicity economics. This framework argues that in multiplicative environments—where wealth compounds over time—rational agents should maximize the geometric mean growth rate (the time-average) rather than the arithmetic expectation (the ensemble-average).

  While the mathematics of Kelly betting are well-understood, the philosophical justification remains contested. Proponents of geometric rationality claim it solves fundamental paradoxes in EU theory regarding risk and ruin. Orthodox theorists counter that Kelly betting is simply EU maximization with a specific logarithmic utility function, carrying no unique normative force. This project seeks to resolve this stalemate. I propose that the normative status of geometric rationality is not universal but contextual. Over a summer term, I will develop a formal taxonomy of decision contexts to determine when geometric reasoning is rationally mandatory, merely permissible, or actively misleading. This conceptual mapping will clarify the boundaries of rational choice theory without requiring empirical data collection.

  **Intellectual Context and The Stalemate**

  The debate centers on how rational agents should handle risk over time. Consider a favorable bet: a coin flip where heads increases wealth by 50% and tails decreases it by 40%. The arithmetic expected value is positive. An EU maximizer with linear utility would bet their entire bankroll every time. However, doing so leads almost surely to ruin over repeated trials because the geometric growth rate is negative. The Kelly criterion identifies the specific fraction of wealth that maximizes the long-term growth rate, avoiding ruin while compounding gains.

  Proponents of geometric rationality, such as those in the ergodicity economics movement, argue that EU theory commits a category error. They claim EU conflates ensemble averages (what happens across many parallel universes) with time averages (what happens to one agent over time). Since we live in one world through time, they argue, the time-average growth rate is the only normatively relevant metric. In this view, geometric rationality isn't just a strategy; it is a correction to the foundations of decision theory.

  Orthodox defenders of EU theory offer a robust rebuttal. They argue that if an agent prefers Kelly betting, it is because they possess a logarithmic utility function over wealth. If an agent prefers full betting, they have a linear utility function. Both are rational within the EU framework; the difference is merely a matter of contingent preference, not rational necessity. From this perspective, geometric rationality offers no new normative insights; it is simply expected utility theory in disguise.

  Both sides are partially right, but the debate has reached an impasse because it treats the decision context as uniform. The geometric advocate assumes repeated, non-diversifiable multiplicative risks. The EU advocate assumes the flexibility to define utility over any outcome structure. Neither has systematically analyzed how the *structure of the environment* interacts with the *structure of the agent's goals* to generate normative force. We lack a clear understanding of when the time-average matters morally and rationality, and when it is merely a heuristic shortcut.

  **Research Question and Methodology**

  The central research question is: *Under what structural conditions does geometric rationality possess normative force independent of specific utility functions?*

  I hypothesize that the normative status of geometric reasoning depends on three distinct dimensions of the decision context, which have not been sufficiently distinguished in the literature:

  1.  **Temporal Structure:** Is the decision one-shot or repeated? Geometric dominance relies on the law of large numbers over time. In one-shot decisions, the time-average is undefined, yet geometric reasoning is often applied by analogy. I will analyze where this analogy holds and where it breaks.
  2.  **Diversifiability:** Can risks be pooled across independent sources? If an agent can diversify risks across many independent bets simultaneously, the ensemble average becomes accessible even to a single agent. I suspect geometric rationality loses its mandatory status when diversification is possible, reverting to a permissible strategy rather than a requirement.
  3.  **Ergodicity:** Is the underlying process genuinely non-ergodic? In ergodic processes, time averages equal ensemble averages. In non-ergodic processes, they diverge. I will examine whether the normative claim of geometric rationality collapses when ergodicity is restored through institutional structures (e.g., insurance markets).

  The methodology will be primarily conceptual and formal. This is not a psychological study of how humans *do* decide, but a philosophical inquiry into how they *ought* to decide. I will use formal modeling to construct idealized decision problems that vary along the three dimensions above. For each cell in this taxonomy, I will test whether the Kelly strategy emerges as the unique rational solution or merely one option among many.

  This involves deriving growth optimality conditions under varying constraints and comparing them against standard EU maximization conditions. The goal is not to produce new mathematics per se, but to use existing formal tools to map the logical space of rational choice. I will focus on clarity of interpretation, ensuring that the formal results translate into clear philosophical claims about rationality and normativity.

  **Timeline**

  This project is designed for a intensive three-month summer research period.

  *Month 1: Literature Synthesis and Formal Setup.*
  The first month will be dedicated to refining the taxonomy. I will review the recent literature in ergodicity economics and decision theory to ensure the three dimensions identified above are exhaustive and mutually exclusive. I will formalize the baseline models for repeated vs. one-shot bets and diversifiable vs. non-diversifiable risks. The deliverable for this month is a working paper outline and a set of formal lemmas defining the decision contexts.

  *Month 2: Modeling and Analysis.*
  The second month involves the core analytical work. I will run the comparative statics across the taxonomy cells. For example, I will model a scenario where risks are repeated but fully diversifiable to see if the Kelly fraction remains mandatory. I will also test the "log utility in disguise" objection by attempting to construct a utility function that replicates geometric growth preferences in contexts where geometric reasoning should ostensibly fail. This month will produce the core arguments and proofs for the final paper.

  *Month 3: Drafting and Refinement.*
  The final month is dedicated to writing. I will draft a manuscript suitable for submission to a top journal in philosophy of science or economic methodology. The focus will be on making the formal results accessible to a broader philosophical audience. I will also prepare a shorter companion piece for a general academic audience, summarizing the implications for rational choice theory.

  **Expected Outcomes and Evaluation**

  The primary outcome will be a complete manuscript titled "The Normative Boundaries of Geometric Rationality." This paper will present the taxonomy and argue for a contextualist view of risk rationality.

  However, grant success should not be measured solely by the production of a paper, but by the clarity of the result, even if the result is negative. There are two distinct paths to success here:

  *Positive Result:* The taxonomy holds. I demonstrate that in non-ergodic, non-diversifiable, repeated contexts, geometric rationality is normatively mandatory in a way that EU theory cannot capture without ad hoc adjustments. This would be a significant contribution, carving out a specific domain where standard decision theory requires revision.

  *Negative Result:* The taxonomy collapses. It may turn out that for every case where geometric rationality seems mandatory, there exists a coherent utility function within the EU framework that replicates the preference. If I prove that geometric rationality is always reducible to expected utility with a logarithmic function, this is still a valuable philosophical result. It would dissolve the hype around ergodicity economics and reinforce the robustness of the orthodox framework, saving future researchers from pursuing a phantom normative distinction.

  A failure would only occur if the taxonomy proves incoherent or if the formal models fail to capture the intuitive distinctions they are meant to represent. Given the preliminary work I have already done, I am confident the models will hold. The uncertainty lies in what they will tell us about normativity.

  This project promises to move the debate beyond talking past one another. By distinguishing the structural features of decision contexts, we can finally say precisely when the geometry of growth matters for rationality and when it is merely a mathematical curiosity. This clarity is essential not only for decision theory but for any field that relies on it, from ethics to public policy, where the distinction between surviving the long run and maximizing the short-term expectation can be a matter of existential importance.
