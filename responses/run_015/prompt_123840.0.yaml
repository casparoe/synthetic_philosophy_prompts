answer: |-
  **Essay Question**

  **Scenario:** Imagine an isolated island economy, "New Hibernia," possessing fertile land and a population willing to work, but currently paralyzed because the circulating silver coin has been hoarded or exported. Following Berkeley's recommendations, the government establishes a National Bank to issue paper notes to pay workers to drain marshes and build roads.

  **(a)** Explain Berkeley's argument for why issuing these paper notes creates wealth rather than merely inflating prices, specifically contrasting his view of money as a "ticket" against the view of money as a store of intrinsic value. (5 marks)

  **(b)** If money is merely a counter representing industry, and industry exists potentially wherever there are idle hands, what prevents the government from issuing infinite tickets? Identify the specific constraint Berkeley relies upon to prevent this self-validating loop from collapsing into worthlessness. (5 marks)

  **(c)** Berkeley's denial of intrinsic value in gold parallels his denial of mind-independent material substance. Does this metaphysical commitment strengthen his monetary theory by freeing value from superstition, or does it undermine the stability required for money to function as a measure? Take a stand on whether the parallel saves or sinks his account. (10 marks)

  ***

  **Model Answer**

  Berkeley's monetary theory rests on a fundamental category shift: money is not wealth, but a claim upon it. In the scenario of New Hibernia, the orthodox view would treat the missing silver as a loss of real capital, suggesting austerity until the metal returns. Berkeley rejects this. He argues that silver is merely a counter, a ticket used to reckon and transfer claims on the labor and produce of others. Real wealth consists not in the counters themselves, but in the "industry of the inhabitants"—the actual draining of marshes and building of roads. Therefore, issuing paper notes to mobilize idle labor does not dilute wealth; it actualizes it. The ticket is not valuable because of the paper or the promise of silver redemption, but because it successfully commands the labor that produces the goods the society needs. In this view, the money supply is not a static pool to be guarded, but a dynamic pump to prime the engine of production.

  However, this raises the critical problem of limits. If the ticket's value derives solely from the industry it commands, and if idle industry is waiting to be commanded, it appears the state could issue tickets indefinitely. Each new note would wake a new worker, creating the very goods that "back" the note. Berkeley avoids the conclusion of infinite issuance not by appealing to a metallic standard, but by appealing to the limits of *credit* and *acceptability*. The constraint is not the stock of gold, but the stock of trust. A ticket is a relational entity; it requires a holder willing to accept it in exchange for their labor or goods. If the government issues notes faster than the goods can be produced, or if the public perceives the issuer as unable to maintain the system's integrity, the relational link snaps. The ticket ceases to command industry not because gold is missing, but because the collective will to accept the counter has evaporated. Berkeley relies on a distinction between *potential* industry and *realizable* industry. The latter is constrained by social coordination and the temporal lag between issuing the ticket and the completion of the work. If the flow of tickets outpaces the flow of finished goods, the ticket loses its purchasing power, not because it lacks intrinsic substance, but because the relation between the sign (money) and the thing signified (goods) is broken.

  This brings us to the metaphysical parallel. Berkeley's attack on intrinsic value in gold is structurally identical to his attack on mind-independent matter. In his immaterialism, an object's *esse* is *percipi* (to be is to be perceived); it has no hidden substrate holding it up outside of perception. Similarly, in his economics, money's value has no hidden substrate (gold) holding it up outside of its utility in exchange. It is purely relational.

  Does this parallel save or sink him? It ultimately strengthens his critique of mercantilism but exposes his positive theory to volatility. The parallel saves him by dismantling the "fetishism" of gold. Just as believing in material substance leads to philosophical skepticism (we can't know the real world), believing in intrinsic monetary value leads to economic paralysis (we can't act without more silver). By reducing both to relations within a system of perception and use, Berkeley liberates policy. The government of New Hibernia is free to act because value is within their control, dependent on their own industry and coordination, not on accidental mines in Peru.

  However, the parallel also sinks him regarding stability. In metaphysics, God guarantees the continuity of the world when humans aren't looking. In economics, there is no divine guarantor of credit. If value is purely relational and mind-dependent, it is subject to the fluctuations of public opinion and panic. A "ticket" theory of money requires a robust theory of *conventions* to stabilize the relation, which Berkeley underdevelops. He treats the "will of the people" as a stable bedrock, but history suggests collective perception is fickle. If money is like a perceived object, it can vanish as quickly as a dream if the perceiver looks away.

  Therefore, the metaphysical parallel is a double-edged sword. It provides the philosophical clearance to innovate with paper credit, destroying the superstition that wealth must be metallic. But it fails to provide the anchor that gold (however mistakenly) provided. Berkeley correctly identifies that value is a relation, not a substance. But he underestimates that for a relation to function as a measure of value, it must appear stable enough to be treated *as if* it were a substance. The missing distinction in his account is between value as a *dynamic command over labor* and value as a *static unit of account*. His metaphysics supports the former beautifully but leaves the latter dangerously exposed to the very skepticism he sought to cure. He frees money from gold, but in doing so, he ties it precariously to the human mind, which is the least stable foundation of all.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Articulation of the "Ticket" Theory (4 Marks)**
  *   **Award:** For clearly distinguishing money (counter/claim) from wealth (industry/goods) and explaining how issuing notes mobilizes idle labor without needing metallic backing.
  *   **Common Error:** Treating Berkeley as a standard fiat currency theorist without emphasizing the *ontological* shift that money is not wealth itself.

  **2. Identification of the Constraint on Issuance (4 Marks)**
  *   **Award:** For identifying that the limit is not metal, but *trust/acceptability* or the *temporal lag* between issuance and production (the distinction between potential and realizable industry).
  *   **Common Error:** Claiming Berkeley has no answer to inflation, or falsely attributing a gold-reserve constraint to him.

  **3. Analysis of the Metaphysical Parallel (4 Marks)**
  *   **Award:** For explicitly linking the denial of intrinsic value to the denial of mind-independent substance (value as relation vs. value as substance).
  *   **Common Error:** Discussing immaterialism and economics in separate paragraphs without explaining the structural similarity (the "relation" argument).

  **4. Critical Evaluation of the Parallel (4 Marks)**
  *   **Award:** For taking a stand on whether the parallel helps or hurts (e.g., liberates policy vs. creates instability) and justifying it.
  *   **Common Error:** Describing the parallel neutrally without evaluating its consequences for the theory's viability.

  **5. Synthesis and Resolution (4 Marks)**
  *   **Award:** For integrating the economic constraint with the metaphysical insight (e.g., noting that while God stabilizes perception, nothing stabilizes credit) to offer a final judgment on Berkeley's success.
  *   **Common Error:** Providing two tidy summaries (one on money, one on metaphysics) without attempting to resolve the tension between them.
