answer: |-
  # Handout: Disambiguating *Ex Nihilo Nihil Fit*

  The slogan "nothing comes from nothing" is not a single premise but a placeholder for at least five distinct metaphysical claims. Your interlocutor's four-step argument (1. No beginning *ex nihilo* → 2. Sempiternity → 3. "Rather than nothing" is false → 4. No brute facts) requires shifting between these readings to succeed. Below is a menu of precise theses the slogan could express, evaluated by their ability to license his steps.

  | Reading & Axes | Precise Statement | Verdict | Licensing & Weakest Link |
  | :--- | :--- | :--- | :--- |
  | **1. Causal Conservation**<br>*(Quantifier / Causal)* | No event occurs without a prior efficient cause; no entity arises without prior material. | **True but too weak to do any work.** | **Licenses Step 1.**<br>**Weakest Link: Step 2.** An infinite chain of caused causes does not entail a *necessary* being, only an eternal series of contingent ones. |
  | **2. Null-State Inertia**<br>*(Name / Causal)* | The state of absolute nothingness lacks the causal power to initiate a transition to somethingness. | **Substantive and defensible.** | **Licenses Steps 1 & 2.**<br>**Weakest Link: Step 5 (Theism).** Incompatible with *creatio ex nihilo* unless one posits an external agent, which this reading excludes by definition. |
  | **3. Explanatory Sufficiency**<br>*(Quantifier / Grounding)* | No contingent fact is intelligible without a sufficient reason or ontological ground. | **Substantive but question-begging.** | **Licenses Step 4.**<br>**Weakest Link: Step 2.** A sufficient reason (e.g., a necessary being) does not entail temporal sempiternity; the universe could have a beginning grounded externally. |
  | **4. Probabilistic Default**<br>*(Name / Probability)* | Non-existence is the prior probability; existence is the deviation requiring a bias. | **Substantive and defensible.** | **Licenses None.**<br>**Weakest Link: All.** Probabilities cannot yield the deductive necessities required for Steps 1–4; it motivates the question but settles nothing. |
  | **5. Theistic Distinction**<br>*(Name / Making vs. Creating)* | The slogan governs natural *making* (rearranging parts) but not divine *creating* (sustaining being). | **Substantive and defensible.** | **Licenses None.**<br>**Weakest Link: Step 1.** Explicitly denies the interlocutor's starting premise; allows a beginning *ex nihilo* via will. |
  | **6. Conservation of Being**<br>*(Unoccupied Slot / Ontological)* | The total quantity of being is constant; it can neither be created nor destroyed, only modified. | **Substantive but question-begging.** | **Licenses Step 2.**<br>**Weakest Link: Step 1.** Assumes being exists to be conserved; cannot explain why there is being rather than zero being initially. |

  ### Analysis of Group Suggestions

  **1. The "Fixed Point" Thesis**
  *Claim:* The empty world is a fixed point because laws/causes require subjects to operate on.
  *Status:* **Separate claim wearing the slogan's clothes.** This is a specific mechanistic justification for **Reading 2 (Null-State Inertia)**. It is not equivalent to the slogan itself; one could accept *ex nihilo nihil fit* while denying this mechanism (e.g., by positing spontaneous quantum fluctuation). It strengthens Reading 2 but does not rescue the equivocation in the four-step argument.

  **2. The "Abstract Objects" Thesis**
  *Claim:* Numbers/abstracta exist necessarily, so the empty world is impossible.
  *Status:* **A defeater for the question, not the slogan.** This renders the antecedent of the slogan ("If nothing existed...") vacuously false. It collapses the "rather than nothing" alternative (Step 3) but does not affirm the slogan's causal claim. It bypasses the slogan entirely by denying the possibility of the "nothing" state.

  ### Diagnostic Note: Normal Usage
  When speakers deploy this tag, they are normally expressing **Reading 1 (Causal Conservation)**—a trivial truth about rearrangement within the world—but they intend to secure the conclusion of **Reading 3 (Explanatory Sufficiency)** or **Reading 2 (Null-State Inertia)**. The argument's persuasive force relies on this equivocation: the premise is plausible only as Reading 1, but the conclusion follows only if one assumes Reading 2 or 3. To press the discussion, ask him to select *one* row from the table above and run his four steps using only that thesis.
