      *   **Inference:** "The supplement boosts metabolism." (False).

      *   *Wait, I need to ensure the "deterministically directed" part is clear.* The audience *must* rely on the researcher's framing because they don't have the raw data.
      *   Let's go with a **Time-Series Baseline** example. It's classic.
