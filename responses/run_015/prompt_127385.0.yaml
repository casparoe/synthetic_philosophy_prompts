answer: |-
  Consider a specific scenario in environmental impact assessment, a domain where data is abundant, variables are interconnected, and the audience (regulators or the public) lacks the capacity to verify raw measurements.

  **The Scenario: The Turbidity Baseline**

  A research team is tasked with assessing the ecological impact of removing an aging hydroelectric dam. The primary concern is turbidity (water cloudiness caused by suspended sediment). High turbidity during the removal process can clog fish gills and smother spawning beds downstream.

  **The Reality:**
  During the dam removal, turbidity spiked to levels known to cause significant fish mortality. However, six months post-removal, turbidity settled back to levels similar to the year immediately preceding the project. Unfortunately, that preceding year was an anomaly—a period of severe drought with naturally low river flow and exceptionally low sediment load. The *historical* average (over 20 years) is much higher. Furthermore, while turbidity returned to "normal," the sediment pulse permanently altered the riverbed composition, reducing spawning success by 40%.

  **The Report:**
  The lead researcher submits a summary report containing the following elements:

  1.  **Visual Framing (Axis and Baseline Selection):** A line graph displays turbidity levels over time. The X-axis covers only the 12 months prior to removal and the 6 months post-removal. The Y-axis is truncated, starting not at zero, but at 90% of the maximum value recorded during the drought year. This visual compression minimizes the visual magnitude of the removal spike.
  2.  **Structured Omission (Covariates):** The report details water chemistry and flow rates but omits data on riverbed composition and fish spawning success rates. The methodology section notes that biological surveys were "deferred due to logistical constraints," which is literally true (the boat broke, and they didn't reschedule), though the constraint was not insurmountable.
  3.  **Literal Assertions:**
      *   "Post-removal turbidity levels have returned to pre-project baselines." (True: They match the immediate pre-project drought year).
      *   "No sustained exceedance of regulatory thresholds was observed." (True: The spike was short-duration, and the threshold is based on 30-day averages).
      *   "Flow dynamics are consistent with historical norms." (True: "Historical" is undefined in the text, allowing the reader to assume the recent past).

  **The Inferential Environment:**
  The regulatory audience reads this report. They are epistemically dependent; they cannot measure the river themselves. They operate under the normative assumption that a scientific report presents *relevant* baselines and *significant* covariates. When a researcher selects a baseline, the audience infers it is the *appropriate* baseline for comparison. When a researcher omits a covariate, the audience infers it is *irrelevant* or *unchanged*.

  Consequently, the audience forms a specific belief: *"The dam removal was ecologically neutral; the river system has absorbed the disturbance without lasting damage."*

  This belief is false. The riverbed is degraded, and the baseline used was an unrepresentative anomaly. Yet, every explicit statement in the report is verifiably true.

  **The Philosophical Problem: Lying vs. Misleading**

  In traditional moral analysis, a distinction is often drawn between *lying* (asserting what one believes to be false) and *misleading* (asserting what is true to imply what is false). The defender of the researcher would argue: "The scientist did not lie. They reported the data accurately. If the regulators inferred stability from a drought-year baseline, that is an error in the regulators' interpretation, not a falsehood in the scientist's assertion."

  This defense relies on the idea that the moral weight of communication rests entirely on the literal truth-value of the propositions uttered. It treats the audience as an independent verifier who is responsible for filtering the implications of the data.

  However, this scenario demonstrates that in contexts of systematic **epistemic dependency**, this distinction collapses.

  1.  **The Frame is the Assertion:** In scientific communication, the selection of data is not merely a container for the truth; it is a claim about *relevance*. By choosing the drought year as the baseline, the researcher is implicitly asserting, "This is the correct standard for comparison." By omitting the spawning data, they are implicitly asserting, "This metric is not materially changed." These implicit claims are false, even if the explicit numbers are true.
  2.  **Deterministic Direction:** The misleading is not accidental; it is engineered. The researcher knows the audience relies on their curation to determine what matters. If the researcher knows that a rational audience, given this framing, will *necessarily* infer the false conclusion, then the researcher intends that false conclusion.
  3.  **Exploitation of Trust:** The moral prohibition against lying exists to protect the trust required for communication. If I cannot trust your words, I cannot learn from you. In this scenario, the researcher preserves the *letter* of trust (I told you the numbers) while violating the *spirit* (I curated the numbers to hide the risk).

  **Conclusion**

  If the moral wrong of lying is the intentional corruption of another's belief state through the abuse of communicative trust, then this act is morally indistinguishable from lying. The "truth" of the individual statements becomes a technical shield rather than a genuine offering of knowledge.

  When a presenter exploits the audience's inability to verify the context—knowing that the audience must treat the presenter's framing as a proxy for reality—the presenter assumes the role of the audience's epistemic agent. An agent who deliberately steers their principal toward a false belief, regardless of the literal truth of the interim reports, is acting in bad faith. The distinction between lying and misleading holds only when the audience has the capacity to check the implications. Where that capacity is systematically removed by the very expertise the presenter claims to offer, the manipulation of the inferential environment is functionally equivalent to a false assertion. The lie is not in the data points; it is in the map drawn around them.
