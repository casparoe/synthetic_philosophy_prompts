answer: |-
  The central question is whether money-pump arguments establish a requirement for diachronic consistency or merely synchronic acyclicity, a distinction that remains obscured because standard analyses conflate the binary existence of a loss sequence with the bounded extractable amount available under purchasable commitment technologies.

  **Problem Statement and Existing Gap**
  Standard debates in diachronic rationality organize around a binary variable: is the agent pumpable or not? The literature typically evaluates whether foresight plus backward induction (the sophisticated-choice reply) or resolute planning (the resolute-planning reply) allows an agent to escape the pump. This framing assumes that if a pump exists, rationality is violated unless blocked by these specific cognitive maneuvers. However, this overlooks the economic structure of the vulnerability itself. Specifically, it fails to distinguish between an agent with strictly cyclic preferences (no maximal element) and an agent with diachronically shifting preferences (acyclic at every time-slice but inconsistent over time). Both appear pump-equivalent in a binary framework, but they diverge sharply when we introduce the cost of commitment. If immunity from exploitation is purchasable—via Ulysses contracts or binding pre-commitments—the strictly cyclic agent faces unbounded exploitation because she will always pay to be released from any lock-in she previously purchased, whereas the diachronically inconsistent agent can cap her losses by buying a contract her future self has no incentive to break. Existing arguments leave this open because they treat the money pump as a logical possibility proof rather than an economic measure of exploitability, thereby failing to track whether the normative verdict should rest on the mere existence of a sure-loss sequence, the maximum extractable amount under optimal commitment, or the existence of a plan ratifiable at every node.

  **Proposed Approach**
  This paper will argue that the normative weight of money-pump arguments is carried by "pump-depth"—the maximum extractable amount given a bound on interactions and the price of commitment devices—rather than binary pumpability. The argument proceeds in four sections.

  Section 1 formalizes pump-depth. I will define the metric as the net loss an agent sustains in equilibrium given a cost function for commitment technologies. This shifts the evaluation from "can she be pumped?" to "how much can be extracted before commitment becomes rational?" This section will demonstrate that for a strictly cyclic agent, pump-depth is unbounded even when commitment is for sale, because the preference cycle ensures that at every node, the cost of release is preferred to the locked-in outcome.

  Section 2 establishes the asymmetry thesis. I will contrast the strictly cyclic agent with the diachronically inconsistent agent whose preferences shift exogenously. For the latter, there exists a commitment price below which the agent locks in and above which she does not, creating a bounded pump-depth. This shows that synchronic cyclicity and diachronic preference change are not pump-equivalent when commitment is endogenous to the choice situation. If this asymmetry holds, the money-pump argument supports synchronic acyclicity as a hard constraint on rationality, while supporting diachronic consistency only as a contingent constraint dependent on the availability of commitment technology.

  Section 3 interrogates the normative verdict. I will argue that rationality requirements should track bounded pump-depth rather than the mere existence of a loss sequence. If an agent can cap her losses via a purchasable contract, the normative urgency of requiring her to change her preferences is significantly weakened compared to an agent who cannot cap losses. This section will evaluate whether the normative verdict should track the existence of a sure-loss sequence, the amount extractable under the best available commitment technology, or the existence of a plan ratifiable at every node. I will defend the view that extractable amount under optimal commitment is the correct metric, as it aligns rationality with immunity to actual exploitation rather than hypothetical vulnerability.

  Section 4 flags the independence assumption. A critical risk is smuggling in the assumption that the agent's later preferences are independent of her earlier choices. If preference change is endogenous—i.e., if choosing A causes the preference shift that leads to the pump—then the ability to purchase immunity may be illusory because the commitment device itself alters the preference landscape. I will analyze whether this assumption is doing real work in the asymmetry thesis. If preference change is manipulative rather than drift-based, the distinction between cyclicity and diachronic inconsistency may collapse, restoring the standard view that diachronic consistency is required to prevent manipulation.

  **Possible Conclusions**
  There are three likely outcomes. First, the asymmetry holds and independence is satisfied: rationality requires synchronic acyclicity strictly, but diachronic consistency only conditionally on the cost of commitment. Second, the asymmetry holds but independence fails: endogenous preference change means commitment devices are unstable, restoring the requirement for diachronic consistency to prevent manipulation. Third, the asymmetry fails: strictly cyclic agents can also find stable commitment points (e.g., via meta-preferences), collapsing the distinction. The considerations deciding between these will turn on the stability of preferences under binding contracts and whether ratifiability requires preference stability or merely strategic foresight.

  **Useful Result and Failure Conditions**
  A useful result for someone unconvinced by standard money-pump arguments would be a demonstration that diachronic consistency is not a sui generis rational requirement but rather a derivative constraint aimed at minimizing exploitability where commitment is costly. This clarifies the scope of money-pump arguments: they prove acyclicity is necessary, but they prove diachronic consistency is necessary only when commitment technology is unavailable or prohibitively expensive. The project fails if the formalization of pump-depth proves equivalent to binary pumpability in all relevant cases, or if the independence assumption cannot be defended without begging the question against endogenous preference change. Additionally, the project fails if the normative metric (extractable amount) cannot be justified over the standard metric (existence of sure-loss) without relying on controversial consequentialist premises about rationality.

  **Scope and Cuts**
  For a 7,000-word term paper, the primary risk is over-formalization in Section 1. If the model becomes too technical, I will cut the formal proofs of unboundedness and rely on intuitive examples of cyclic vs. shifting agents. Similarly, if Section 4 on endogenous preference change expands too much, I will restrict the analysis to the distinction between natural drift and manipulation, leaving the full theory of preference formation for future work. The core contribution—the asymmetry in pump-depth—must remain the focus, even if the normative implications in Section 3 are narrowed to a provisional claim rather than a definitive verdict.
