  1. **Setup and rules**
  Divide ten students into eight Copy-Agents, one Moderator, and one Auditor. Arrange three separate tables as "Rooms." Each Copy-Agent receives a "Policy Card" (Cooperate/Defect) and two "Revision Tokens." Before entering rooms, Agents secretly select a Policy. This choice binds all their simulated copies across all three Rooms; the Moderator records this global commitment. Agents are then randomly assigned to one Room. Inside, they receive a "Local Signal" indicating the room's "epistemic culture": whether this room weights observed frequencies or prior commitments. The Payoff Matrix is displayed: If an Agent maintains their binding Policy, all their copies (simulated) contribute significantly to a Shared Snack Budget (Global Welfare). If an Agent uses a Revision Token to update based on the Local Signal, they maximize points for their specific Room (Individual Score) but drastically reduce the Shared Budget. The Auditor tracks whether Agents revise. Information is strictly compartmentalized: Agents see only their Room's signal and their own score, never the global total until the end. Stakes are real: Individual points buy personal coffee; Global Budget buys group snacks. This creates immediate tension between self-interest and group optimization mediated by epistemic constraints, forcing Agents to weigh local evidence against global binding. The Moderator controls information flow, ensuring no cross-room communication occurs. The Auditor ensures cross-room consistency by checking if revised policies contradict the initial binding. Payoffs are structured so that local Bayesian updating maximizes the individual room's score, but maintaining the global precommitment maximizes total welfare summed across all copies. This specific imbalance forces the UDT tension: rational local action leads to suboptimal global outcomes.

  2. **The activity in play**
  Round 1 (Precommitment): Agents lock Policy Cards face down. No communication. Moderator logs global bindings without revealing them to Agents.
  Round 2 (Assignment & Observation): Agents enter assigned Rooms. Moderator reveals Local Signal (e.g., "Room 1 favors Defect"). This signal is deterministic but hidden from other rooms, designed to make updating tempting by suggesting local uniqueness.
  Round 3 (Decision): Agents decide: Honor Binding Policy or Spend Revision Token to Update. If they update, they switch action for this Room only, breaking the binding for this instance. During Round 3, the Moderator reminds Agents that updating affects only their local score, not the binding of their other copies, yet the global payoff suffers. This clarifies the externality.
  Round 4 (Resolution): Moderator calculates payoffs. Individual points are announced privately; Global Snack Budget is calculated publicly. The Auditor verifies if revisions occurred. Repeat for three rounds with varying Signals to reinforce the tension. The Moderator refuses to reveal how other Rooms acted, only showing the aggregate Global Budget impact. This opacity forces Agents to rely on their initial policy rather than observed frequencies, simulating the lack of cross-branch access.

  3. **Debrief and mapping**
  In debrief, ask Agents why they updated. Most will cite the Local Signal as evidence their Room was "different." Map this to conditioning on indexical evidence: "I am in Room 1" feels like new information, but under UDT, it doesn't change the optimal policy chosen behind the veil of ignorance. When an Agent updates, they gain local points but harm the Global Budget. Highlight this as the tension: local Bayesian updating maximizes individual room score, but precommitment maximizes total welfare.
  Address the predictable failure mode: Students will likely conflate the refusal to update with mere stubbornness or group loyalty. They may argue they updated because the "culture" demanded it. Redirect by asking what evidence, exactly, the local observation provides about the other rooms. If the setup was symmetric, none. Refusal to update isn't stubbornness; it's recognizing logical correlation between copies. The Moderator's silence on cross-room totals mirrors the agent's lack of access to other branches. The Snack Budget loss demonstrates the cost of failing to act as a unified algorithm. Explicitly name the move: refusing to condition on indexical evidence is the core UDT maneuver to preserve global utility against the lure of local Bayesian rationality. Facilitators must emphasize that the 'twin' copies are not physical peers but logical instantiations of the same decision algorithm. When a student updates, they are effectively changing the algorithm for all copies, even if only one room physically changes action. The debrief must pivot from social cooperation to decision-theoretic consistency. Ask: "Did you change your mind, or did you change your policy?" This distinction isolates the UDT insight from standard game theory cooperation.

  4. **Honest limitations**
  This activity cannot reproduce the formal expected utility derivation across copies. Students won't feel the mathematical necessity of UDT, only the pragmatic loss of snacks. It glosses over the evidential/causal distinction underwriting the paradox. The facilitator must verbally supply the formal logic: explain that under UDT, the decision is about selecting a policy function, not an action in a branch. Without this, students may view this as coordination, not a decision-theoretic paradox. Consequently, the facilitator must explicitly connect the snack loss to the expected utility calculation missing from the game mechanics.
