  A P-Zombie named Phil and an "Inverse Zombie" named Invy walk into a bar. Phil looks like a normal grad student; Invy is just a floating glow of pure subjective experience hovering over a stool.

  Phil orders a beer and says, "See? I'm physically identical to a drinker but lack qualia. Conceivability entails possibility. Physicalism is dead."

  Invy pulses angrily. *I am phenomenally identical to a drinker but lack physics!* it projects telepathically. *Conceivability entails possibility. Materialism is dead.*

  The bartender, a tired physicalist, stops wiping a glass. "Hold on. To run a conceivability argument, you need two things: a mind to do the conceiving, and a mouth to state the premises."

  He points at Phil. "You have the mouth, but no mind. You're just parroting syntax."

  He points at Invy. "You have the mind, but no mouth. You can't even form a premise without physics."

  "So neither of you can actually run the argument," the bartender says, grabbing their tabs. "But *I* have a mind and a mouth. And I can conceive of you two leaving. And since conceivability entails possibility..."

  He points to the door. "...you're out."

  ***

  **Why it works:** The joke hinges on the fact that running the argument requires both physical instantiation (to speak/write) and phenomenal consciousness (to genuinely conceive/mean). The P-Zombie has the hardware but no software; the Inverse Zombie has the software but no hardware. Only the physicalist bartender has both, allowing him to weaponize their own logic against them.
