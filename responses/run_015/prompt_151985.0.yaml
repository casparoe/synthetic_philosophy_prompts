      *   *Premise 2 (No Metaphysical Distinction):* This is the tricky part. Deflationists *do* deny a *substantive* property (like correspondence to reality), but they do *not* deny the distinction between true and false beliefs. "Snow is white" is true iff snow is white. "Snow is black" is true iff snow is black. The world makes one true and the other false. Deflationism denies the *nature* of truth, not the *extension* of truth.
      *   *Premise 3 (JTB Failure):* This follows from Premise 2, but since Premise 2 is arguably a misunderstanding of deflationism, Premise 3 is vulnerable.
