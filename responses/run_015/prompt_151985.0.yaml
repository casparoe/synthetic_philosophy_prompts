          3.  Therefore, the traditional Tripartite Analysis of Knowledge (Justified True Belief - JTB) fails because "true" doesn't mark a distinct state of affairs separating knowledge from justified false belief.
          4.  **Conclusion/Question:** Must a deflationist replace JTB with a pragmatic/coherence account, OR can they preserve normative distinctions (knowledge vs. error) without substantive truth?

