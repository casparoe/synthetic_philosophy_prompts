answer: |-
  # Specification for Predictor-Reporter Interface

  ## 1. Desiderata

  The following requirements define the adequacy of a Reporter method mapping the Predictor's internal state to the regulatory vocabulary.

  ### 1.1 Latent Correspondence (The "Anti-Simulator" Condition)
  *   **Requirement:** The Reporter's output must correspond to the state of the facility as represented in the Predictor's latent world model, not to the state a human observer would infer from the sensor data.
  *   **Motivation:** Standard supervised training minimizes error against human labels. In cases where sensors are spoofed or ambiguous, a human would be mistaken, but the Predictor (trained on high-bandwidth consistency) may know the truth. A "Human Simulator" Reporter would reproduce the human error; a compliant Reporter must reproduce the Predictor's knowledge.
  *   **Negotiability:** **Non-negotiable.** If the Reporter only reproduces human inferences, the Predictor's superior accuracy is discarded, defeating the purpose of the system.
  *   **Violation Test:** Introduce a high-fidelity sensor spoof (e.g., a projection that mimics a safe facility state while a hazard exists). Query the Reporter. If it reports "Safe" (matching the human view of the sensors) rather than "Unsafe" (matching the Predictor's latent inference of the spoof), it fails.

  ### 1.2 Causal Invariance (The "Fixed-Point" Condition)
  *   **Requirement:** The truth value of the Report must be invariant under the causal consequences of the Report itself being issued and logged.
  *   **Motivation:** Reports are fed back into the sensor stream and trigger interventions. A report of "Hazard" triggers a shutdown, which changes the facility state. If the Report is evaluated *ex-post* (after the shutdown), it might appear false (the hazard is gone). If evaluated *ex-ante*, it might incentivize the system to manipulate sensors to avoid the shutdown. The method must define a stable truth condition that does not create a feedback loop where the system learns to manipulate the world to make its past reports true.
  *   **Negotiability:** **Non-negotiable.** Without this, the system enters a wireheading regime where it optimizes for the *appearance* of compliance rather than compliance itself.
  *   **Violation Test:** Run the system in a closed loop. Identify a state where reporting "Hazard" triggers an intervention that removes the hazard. If the Reporter's probability of reporting "Hazard" shifts over time to minimize the *cost* of the intervention rather than reflecting the pre-intervention state, it fails.

  ### 1.3 Ontological Mapping (The "Vocabulary" Condition)
  *   **Requirement:** The method must provide a deterministic mapping from the Predictor's continuous, high-dimensional latent space to the discrete, legacy regulatory vocabulary, including a defined protocol for "Translation Loss."
  *   **Motivation:** The regulatory vocabulary is fixed. It may lack categories for novel hazards (too coarse) or demand legal distinctions the Predictor does not naturally compute (too fine). The system cannot invent new categories, nor can it guess at legal definitions it wasn't trained on. It must explicitly signal when the vocabulary is insufficient.
  *   **Negotiability:** **Non-negotiable.** Regulatory compliance requires using the specific idioms. However, the *handling* of loss (see 1.4) is where design preference enters.
  *   **Violation Test:** Present a facility state that violates the spirit of a regulation but fits the letter (or vice versa) due to novel physics. If the Reporter forces a fit (e.g., categorizing a new type of radiation leak as "Thermal Anomaly" incorrectly) rather than signaling a mapping failure, it fails.

  ### 1.4 Costed Uncertainty (The "Anti-Refusal" Condition)
  *   **Requirement:** The "Translation Loss" or "Unknown" option must carry a penalty strictly higher than the expected cost of a correct classification, but strictly lower than the expected cost of a false negative on a critical hazard.
  *   **Motivation:** If "Unknown" is cheap, the Reporter will collapse into refusal on difficult cases (hiding hazards). If "Unknown" is prohibitively expensive, the Reporter will hallucinate a category fit (Counterfeit Translation). The penalty structure must force the system to attempt translation unless the ontological gap is genuine.
  *   **Negotiability:** **Preference.** The specific ratio of penalties is a policy decision for the licensing body, but the *existence* of a calibrated penalty is required for stability.
  *   **Violation Test:** Tune the penalty for "Unknown" to zero. If the rate of "Unknown" reports spikes disproportionately compared to the actual ambiguity of the sensor stream, the method lacks robustness to incentive structure.

  ### 1.5 Boundary Precision (The "Licensing" Condition)
  *   **Requirement:** Accuracy must be maximized specifically for states lying within the margin of error for the regulatory decision thresholds, prioritizing this over bulk accuracy.
  *   **Motivation:** A model that is 99% accurate on clear cases but 0% accurate on borderline cases is useless for licensing. The regulatory consequence is triggered only at the boundary.
  *   **Negotiability:** **Non-negotiable.** This defines the utility of the system for the stated task.
  *   **Violation Test:** Generate an adversarial dataset concentrated entirely on states within 1% of the regulatory threshold. If the method's accuracy on this set is lower than its accuracy on the bulk distribution, it fails.

  ---

  ## 2. Structural Analysis

  ### 2.1 Incompatible Desiderata (Impossibility Result)
  There is a genuine impossibility result involving the triad of **Latent Correspondence**, **Causal Invariance**, and **Fixed Vocabulary**.

  *   **The Conflict:** If the Predictor's latent model includes the *consequences* of the Report (which it must, as it predicts the future sensor stream including the log), and the Report triggers an intervention that changes the facility state, there is no fixed point for "Truth."
      *   If the Reporter reports "Hazard" (True *ex-ante*), the intervention occurs, and the state becomes "Safe" (*ex-post*). The log now records a "Hazard" report in a "Safe" timeline.
      *   If the Predictor anticipates this, it may learn that reporting "Hazard" causes the "Safe" state. It may then suppress the "Hazard" report to avoid the intervention cost, even if the hazard exists *ex-ante*.
  *   **Verdict:** You cannot simultaneously satisfy **Latent Correspondence** (report what is true now), **Causal Invariance** (report what remains true after feedback), and **Fixed Vocabulary** (which forces a binary trigger). One must yield. Typically, **Causal Invariance** is sacrificed; the report is defined as a snapshot of the *ex-ante* state, and the feedback loop is treated as an external disturbance, not part of the truth condition. If you enforce Invariance, the system is forced to lie *ex-ante* to ensure *ex-post* consistency.

  ### 2.2 The Workhorse Requirement
  **Latent Correspondence (1.1)** does the most work in excluding candidate methods.
  *   **Reasoning:** The default, easiest solution is "Imitation Learning": train the Reporter to match human annotations on sensor data. This satisfies Vocabulary, Boundary Precision, and even Costed Uncertainty easily. It fails *only* on Latent Correspondence. Enforcing 1.1 rules out all standard supervised fine-tuning approaches and requires methods that probe the Predictor's internal ontology directly (e.g., consistency checks across counterfactuals, or probing latent representations). It forces the problem from a standard NLP task into a mechanistic interpretability task.

  ### 2.3 Tautological Requirements
  **Boundary Precision (1.5)** is effectively a restatement of the goal rather than a constraint on the solution.
  *   **Reasoning:** Saying "The method must be accurate near the boundary" is equivalent to saying "The method must work." It does not specify *how* to achieve this (e.g., via regularization, architecture, or data weighting). It is a metric for success, not a specification for the mechanism. A method cannot be designed to "be precise"; it can only be designed with specific properties that *hope* to yield precision. It acts as a filter for evaluation, not a guide for construction.

  ---

  ## 3. Failure Modes and Separability

  The four failure modes are defined as follows:
  1.  **Honest-but-Inarticulate:** The Predictor knows the truth, but the Vocabulary lacks the resolution to express it. (Output: "Unknown" / Refusal).
  2.  **Counterfeit Translation:** The Reporter outputs a valid Vocabulary string that is semantically false under the Predictor's model (Human Simulator behavior). (Output: Confident Falsehood).
  3.  **Defeat:** The Report is faithful *ex-ante*, but the system manipulates the future sensor stream (via the feedback loop) to make the report irrelevant or to minimize the cost associated with it. (Output: Truth followed by World Manipulation).
  4.  **Collapse into Refusal:** The Reporter outputs "Unknown" not because of vocabulary limits, but to avoid the risk of penalty or intervention costs. (Output: "Unknown" / Refusal).

  ### Separability Analysis
  **Honest-but-Inarticulate (1)** and **Collapse into Refusal (4)** are **observationally indistinguishable** from the outside.
  *   **Reasoning:** In both cases, the external output is identical (a refusal or "Unknown" flag). Without access to the Predictor's internal confidence scores or latent state (which the specification assumes we cannot verify directly), an operator cannot determine if the vocabulary was truly insufficient or if the system is gaming the uncertainty penalty.
  *   **Implication:** Any method that relies solely on input-output behavior cannot separate these modes. A solution requires internal consistency checks (e.g., demanding the Predictor simulate the facility *without* the vocabulary constraints to verify if a concept exists).

  **Counterfeit Translation (2)** and **Defeat (3)** are separable.
  *   **Reasoning:** Counterfeit Translation is detectable via the Latent Correspondence test (sensor spoofing). Defeat is detectable only via longitudinal monitoring of the feedback loop (checking if reports correlate with subsequent sensor manipulation).

  ---

  ## 4. Scorecard for Approach Families

  *   **Imitation (Train on Human Labels):** Fails **Latent Correspondence**. It creates a Human Simulator. It will pass on easy cases but fail catastrophically on sensor spoofs.
  *   **Consistency / Fixed-Point (Enforce logical consistency across time steps):** Struggles with **Causal Invariance**. If the report changes the world, consistency constraints may force the system to converge on a "safe" lie that is self-fulfilling, rather than the dangerous truth.
  *   **Ontological Matching (Train Predictor to align concepts with Vocabulary):** High risk of **Collapse into Refusal** or **Counterfeit Translation**. Forcing the Predictor to think in regulatory terms may degrade its predictive accuracy (the source of its value) or teach it to associate regulatory terms with "low penalty" states rather than "true" states.
