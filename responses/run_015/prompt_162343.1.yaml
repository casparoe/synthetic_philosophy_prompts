answer: |-
  Here is a 45-minute battle plan. It is designed to keep the math on the whiteboard to a single line, keep the p-value guy contained, and force the computational folks to confront the difference between *code that runs* and *logic that holds*.

  ### 1. The Setup: What Must Be on the Table (Minutes 0–10)
  Do not start with the problem. Start with the definition of "confirmation." If you don't lock this down, the room will dissolve into semantics.

  **The Sequence:**
  1.  **The Rule:** Write Bayes' rule once. $P(H|E) = \frac{P(E|H)P(H)}{P(E)}$.
  2.  **The Definition:** Define "Confirmation" strictly as $P(H|E) > P(H)$. If the posterior isn't higher than the prior, you haven't confirmed anything, you've just checked consistency.
  3.  **The Condition:** Establish that for the problem to exist, $E$ must be **known**. $P(E) = 1$.
  4.  **The Trap:** Walk them through the collapse.
      *   If $P(E) = 1$, the denominator is 1.
      *   If $H$ entails $E$, then $P(E|H) = 1$.
      *   Therefore $P(H|E) = P(H)$.
      *   **Result:** Learning that your theory explains the data does not increase your confidence in the theory.

  **Why this order?** You need them to feel the mathematical inevitability of the collapse *before* you introduce the example. If you start with the example, they will argue about the data. If you start with the algebra, they have to argue with the logic.

  ### 2. The Carrying Example: The 6-Year-Old Result (Minutes 10–20)
  Use your internal lab scenario, but you must frame it carefully. Do not use the "Old Theory" (since it doesn't entail the result). Use the **Rival Model**.

  **How to frame it:**
  *   **The Evidence ($E$):** The 6-year-old anomaly in the data. Everyone accepts it exists. $P(E) \approx 1$.
  *   **The Hypothesis ($H$):** The *structure* of the new rival model (not the specific parameter values).
  *   **The Claim:** The new model's structure *necessitates* the anomaly.

  **Requirements for the Example:**
  *   **Must Have:** Logical entailment. The model *cannot* output anything other than that result (given the setup). If it's just a "good fit," the computational folks will dismiss this as overfitting. It must be that the mechanism *implies* the observation.
  *   **Must Lack:** Uncertainty about $E$. Do not let anyone say, "But maybe the old data is noisy." If $P(E) < 1$, the problem vanishes. You must stipulate: "For this exercise, treat the old result as a fact of nature."
  *   **The Tension:** Ask the room: "Did our confidence in the Rival Model go up when we realized it explained the Anomaly?" Everyone will say "Yes." Then point to the board: "The math says 'No.' Who is wrong?"

  ### 3. The Misconceptions: Order of Operations (Minutes 20–30)
  They will object. Let them, but control the sequence. If you answer the "Bayes Factor" objection first, you lose the room to technicalities.

  **1. "Prediction beats Accommodation" (Let this come first)**
  *   *The Objection:* "It only confirms if you predict it beforehand. Since we knew the data, this is just accommodation, which doesn't count."
  *   *The Counter:* This is a pragmatic heuristic, not a Bayesian solution. Einstein didn't get extra "Bayes points" because he calculated Mercury before the astronomers told him; he got them because GR explained it. If we accept this objection, we are saying Bayesianism cannot account for historical scientific success.
  *   *Why let it out first?* It validates the intuition that *something* is weird about old evidence, without solving the formal problem.

  **2. "Just pretend you forgot" (The Counterfactual)**
  *   *The Objection:* "Set $P(E)$ to what it *would* have been 6 years ago, update, then reset."
  *   *The Counter:* This is the "Counterfactual Prior" fix (see below). Acknowledge it works, but ask: "Whose prior? Yours? Mine? The field's?" It makes confirmation subjective in a way that hurts reproducibility.

  **3. "Our priors already had it baked in"**
  *   *The Objection:* "If we knew $E$, we probably already upweighted $H$ when we built it."
  *   *The Counter:* If you did that, then $P(H)$ is already high, and finding $H$ entails $E$ *still* shouldn't move it. This confirms the problem, it doesn't solve it.

  **4. "We'd just compare Bayes Factors" (Save this for last)**
  *   *The Objection:* "We don't look at posteriors, we look at $P(E|H) / P(E|\neg H)$. $P(E)$ cancels out. Problem solved."
  *   *The Counter:* This is the P-Value Guy trap. Bayes Factors measure *relative support between models*, not *absolute belief in a model*. If you use BF, you have changed the question from "Should I believe H?" to "Is H better than Not-H?"
  *   *Containment:* Tell him: "That's a valid metric for model selection, but it doesn't solve the Problem of Old Evidence for *parameter estimation* or *theory acceptance*. Put a pin in it."

  ### 4. The Fixes: What to Teach (Minutes 30–40)
  There are two live candidates. Do not derive either. Describe the *move* they make.

  **Lead With: The Counterfactual Prior (Howson & Urbach)**
  *   **The Move:** We evaluate confirmation by asking, "What would my prior have been *before* I knew E?"
  *   **Why for this crowd:** Computational folks understand "ablation studies." This is an ablation on your own knowledge state. You run the update in a sandbox where $P(E) < 1$.
  *   **The Cost:** It requires imagining a world you don't live in. It's subjective.

  **Name-Drop: Updating on Entailment (Garber)**
  *   **The Move:** You don't update on $E$. You update on $X$, where $X$ is the proposition "H entails E."
  *   **The Logic:** You knew $E$ ($P(E)=1$). You did *not* know $H \rightarrow E$. Learning the logical connection is new information.
  *   **The Cost:** It requires expanding your possibility space to include logical truths as uncertain events.
  *   **Instruction:** Put this on the board as "Fix #2: Update on the Connection, not the Data." Do not write the probability calculus for logical omniscience. It will kill the clock.

  **What to Refuse:**
  *   Do not discuss **Jeffrey Conditionalization**. It's too technical for 45 minutes.
  *   Do not discuss **Likelihoodism** as a superior framework. It invites the P-Value Guy to take over the room.

  ### 5. The Check: The Final Question (Minutes 40–45)
  Do not ask "Does anyone have questions?" Ask a specific scenario that forces them to choose between "E is true" and "H explains E."

  **The Question:**
  > "Imagine two labs. Lab A discovers a new anomaly $E_{new}$. Lab B points out an old anomaly $E_{old}$ that everyone forgot about. Your model $H$ entails *both*.
  >
  > If you treat $E_{old}$ as 'known' ($P=1$) and $E_{new}$ as 'data' ($P<1$), Bayes' rule says $E_{new}$ confirms $H$ and $E_{old}$ does not.
  >
  > **True or False:** This means you should trust $H$ more because of $E_{new}$ than because of $E_{old}$."

  **The Answer Key:**
  *   **If they say "True":** They are stuck on the formalism. They haven't accepted the fix.
  *   **If they say "False":** Ask "Why?"
  *   **The Correct Response:** "False. The *information gain* comes from learning that $H$ covers the space of anomalies, regardless of when the anomalies were found. We need to update on the *entailment*, not the *evidence*."

  ### Logistics & Attention Management
  *   **Slides:** One slide with the Bayes Rule. One slide with the "Trap" ($1=1$). One slide with the two Fixes. That's it.
  *   **The P-Value Guy:** When he opens his mouth about significance testing, say: "That's a frequentist property of the error rate. We are talking about degree of belief in a specific hypothesis. Come talk to me after about calibration."
  *   **The Email Checkers:** Every 10 minutes, ask a direct question to the room. "Does this match how you tune hyperparameters?" "Who here has ever kept a model because it fit old data?" Force them to look up.

  ### Summary of the "Order Matters"
  1.  **Algebra first:** Prove the collapse is real.
  2.  **Example second:** Show the collapse contradicts intuition.
  3.  **Objections third:** Let them try to patch it with heuristics (Prediction/BF).
  4.  **Fixes fourth:** Show the actual philosophical patches (Counterfactual/Entailment).
  5.  **Question fifth:** Verify they didn't just memorize the algebra.

  This keeps the "Problem" as the protagonist. The goal isn't to solve Bayesianism; it's to show them that their standard update rule has a blind spot they need to account for when reviewing papers (or their own code).
