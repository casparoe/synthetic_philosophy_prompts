prompt: |-
  So I got voluntold to run Friday's methods hour in my lab — 45 minutes, maybe twelve people, mostly computational but a few wet-lab folks, all of whom say "Bayesian" to mean "we put a prior on a parameter and updated it" and most of whom have personally written down a likelihood at some point. Topic I picked is the problem of old evidence: the argument that if you already knew E with certainty before a new theory came along, then Bayes' rule can't let E confirm that theory, because P(E) is 1 and the posterior just collapses back onto the prior. Don't explain it to me — I need a plan for how I explain it to them, and I think the order matters more than anything else here.

  What I want from you:

  - What has to be on the table before the problem even looks like a problem. I suspect it's something about the difference between the theory entailing E and my having learned that it entails E, but tell me where in the sequence that belongs and what has to come before it.
  - One carrying example. I don't want the perihelion-of-Mercury chestnut with this crowd; I want something from their own work. We have a result that's been sitting in our own data for about six years, everyone in the field already believes it, nobody has had a mechanism for it — and we also have a rival model that was fitted to that same result after the fact. Tell me which of those two cases to build the whole thing on, and what the example has to have and has to lack in order to do the work. I think one requirement is that the new hypothesis wasn't built to fit the evidence, and another is that the old theory doesn't entail it, but I'm not sure either is quite right.
  - The misconceptions, in the order they'll actually raise them. The ones I'm braced for: "just pretend you forgot the evidence and put a number on it"; "the real fix is that prediction beats accommodation, so all this shows is that accommodation doesn't confirm" (which I think is a dodge rather than a solution?); "our priors already had it baked in, so nothing is lost"; "we'd just compare Bayes factors". Where in the sequence do I head each one off, and is there one I should let them say out loud first because it sets up the next move?
  - What the two live candidate fixes actually are and how much of each to give at this level. One of them, as I understand it, updates on the fact that the theory implies the evidence rather than on the evidence itself; the other is some kind of counterfactual "what would you have assigned before you knew it". Which do I lead with for this crowd, which do I name and drop, and what do I flat out refuse to derive in 45 minutes.
  - One question for the end that tells me whether they actually got it rather than just nodded — ideally something they'd answer differently if they're still stuck on "unlearn the evidence".

  Constraints: nothing on a slide worse than a fraction, and please don't hand me a reading list, nobody will read it. Also assume half of them are checking email and one person is going to try to turn this into a discussion about p-values if I give him an opening.
reasoning: |-
  Here's a thinking process that leads to the suggested plan:

  1.  **Analyze the Request:**
      *   **Task:** Create a 45-minute lesson plan on the "Problem of Old Evidence" (POE) in Bayesian confirmation theory.
      *   **Audience:** ~12 lab members (mostly computational, some wet-lab). Familiar with basic Bayes (prior + likelihood -> posterior), have written likelihoods, but have a shallow philosophical understanding ("Bayesian = put a prior on a parameter").
      *   **Constraints:** No complex slides (nothing worse than a fraction), no reading list, keep attention (half checking email), avoid p-value derailment.
      *   **Key Requirements:**
          1.  Prerequisites/Sequence: What must be established before the problem appears?
          2.  Example: Use a specific internal lab scenario (6-year-old result, known in field, no mechanism, rival model fitted after the fact), *not* Mercury.
          3.  Misconceptions: Order of objections, how to handle them (especially "unlearn," "prediction vs. accommodation," "priors baked in," "Bayes factors").
          4.  Solutions: Two candidate fixes (updating on entailment vs. counterfactual priors). Which to lead with? What to skip?
          5.  Assessment: One final question to test understanding.

  2.  **Deconstruct the Problem of Old Evidence (POE):**
      *   *The Core:* If $P(E) = 1$ (known with certainty), then $P(H|E) = P(H \cdot E) / P(E) = P(H \cdot E)$. If $H$ entails $E$, $P(H \cdot E) = P(H)$. So $P(H|E) = P(H)$. No confirmation.
      *   *The Intuition:* But clearly, Einstein's GR *was* confirmed by Mercury's perihelion, even though astronomers already knew about the anomaly.
      *   *The Tension:* Formalism says no update; Intuition says yes update.

  3.  **Drafting the Plan - Section by Section:**

      *   **1. Prerequisites & Sequence:**
          *   Need to establish the standard Bayesian update rule first.
          *   Need to establish what "Confirmation" means in this context (increase in posterior probability).
          *   Need to establish the status of $E$ (known with certainty, $P(E)=1$).
          *   *Crucial Step:* The distinction between *E is true* and *H entails E*. The problem arises when we treat learning "H entails E" as the same as learning "E".
          *   *Sequence:* Bayes Rule -> Definition of Confirmation -> The "Known Evidence" setup -> The Collapse -> The Intuition Clash.

      *   **2. The Example:**
          *   *User's Scenario:* 6-year-old result (known), no mechanism (old theory doesn't explain it), rival model fitted after the fact.
          *   *Choice:* Build it on the *New Model* explaining the *Old Result*.
          *   *Why?* If we use the Old Theory, it doesn't entail the result (by user description: "nobody has had a mechanism"). POE requires $H$ entails $E$. So we must use the *Rival Model* (which presumably explains it) vs. the *Old Result*.
          *   *Requirements:*
              *   $E$ must be known ($P(E)=1$).
              *   $H_{new}$ must logically entail $E$ (or make it highly probable).
              *   $H_{new}$ was *not* tuned to $E$ (to maintain the intuition that it *should* confirm).
              *   *Wait, check user constraint:* "I think one requirement is that the new hypothesis wasn't built to fit the evidence." If the rival model was "fitted to that same result after the fact," that sounds like tuning. I need to clarify this. The POE works best when $H$ is developed independently but *then* found to explain $E$. If $H$ was explicitly fitted to $E$, the intuition that it confirms $H$ is weaker (overfitting concerns).
              *   *Correction:* The user says "rival model that was fitted to that same result after the fact." This is tricky. If it was fitted, $P(E|H)$ is high by construction. The POE still applies formally, but the *intuition* that this is "good confirmation" is muddied by overfitting.
              *   *Better Angle:* Focus on the *mechanism*. The old result existed. The new model provides a *mechanism* for it. Even if parameters were tuned, the structural explanation is the "H". Let's advise the user to frame it as "The model structure explains the phenomenon," not "We tuned parameters to match this point."
              *   *Decision:* Use the **Rival Model explaining the Old Result**.
              *   *Must Have:* $P(E)=1$ (everyone knows the result). $H$ entails $E$.
              *   *Must Lack:* Any uncertainty about $E$ (don't let them say "maybe the data is wrong").

      *   **3. Misconceptions & Order:**
          *   *Objection 1: "Just pretend you forgot." (Garber-style/Counterfactual).* This is the most common instinct. Address it early but show why it's messy (what prior?).
          *   *Objection 2: "Prediction beats accommodation."* This is the "Predictionism" dodge. Need to address this because computational folks love cross-validation. Distinguish *psychological* prediction from *logical* entailment.
          *   *Objection 3: "Priors had it baked in."* If $P(H)$ was high because we knew $E$, then $P(H|E)$ shouldn't move. This is actually part of the problem, not a solution.
          *   *Objection 4: "Bayes Factors."* $BF = P(E|H) / P(E|\neg H)$. If $P(E)=1$, does this help? Actually, BF avoids $P(E)$ in the denominator of the *ratio*, but the updating still relies on the marginal. Wait, BF is $P(E|H)/P(E)$. If $P(E)=1$, $BF = P(E|H)$. This is a strong objection. Need to handle carefully. Actually, standard BF definition is $P(E|H_1)/P(E|H_2)$. It doesn't depend on $P(E)$. *This is the P-value trap.* If they say "We use BF," they are sidestepping the posterior probability update. I need to let this one out late to show it changes the question from "Belief in H" to "Relative Support."
          *   *Strategy:* Let "Prediction beats Accommodation" come out early. It sets up the emotional stake. Let "Just unlearn it" come next. Save "Bayes Factors" for the end as a "different framework" escape hatch.

      *   **4. The Fixes:**
          *   *Fix 1: Counterfactual Priors (Howson/Urbach).* "What would you have believed before knowing E?" Lead with this. It's intuitive for scientists.
          *   *Fix 2: Updating on Entailment (Garber).* Update on "H entails E" ($X$), not $E$. $P(H|X) > P(H)$. This is more formal. Name-drop it, don't derive it.
          *   *Refusal:* Do not derive the math of logical omniscience relaxation. Do not get into Jeffrey Conditionalization.

      *   **5. The Final Question:**
          *   Needs to distinguish between "E is true" and "H explains E".
          *   Scenario: You know E. You find H. Does belief in H change?
          *   If they say "No, P(E)=1", they missed the point.
          *   If they say "Yes, because H makes E less surprising *in the context of the model space*", they got it.
          *   *Better:* Ask about the *rival*. If Model A and Model B both entail E, and E is old, does finding E distinguish them? (No). Does finding *H entails E* distinguish them? (Yes, if one didn't before).
          *   *Best:* "If I tell you Model X *could have* predicted E, but you already knew E, does your confidence in X go up? Why?"

  4.  **Refining the Flow (Timing & Attention):**
      *   0-5 min: Setup (Bayes Rule, Definition of Confirmation).
      *   5-15 min: The Trap (Apply rule to Old Evidence, show collapse).
      *   15-25 min: The Example (Apply to Lab Data).
      *   25-35 min: The Objections (Handle the "Unlearn" and "Prediction" crowd).
      *   35-40 min: The Fixes (Counterfactual & Entailment).
      *   40-45 min: The Check & Wrap.
      *   *P-value Guy:* Pre-empt him. "This isn't about significance, it's about belief updating."

  5.  **Self-Correction/Review against Constraints:**
      *   *Slide constraint:* Keep math to $P(H|E) = P(E|H)P(H)/P(E)$.
      *   *Example:* Ensure I tell the user *how* to frame the 6-year-old result so it fits the $H$ entails $E$ requirement. The user said "old theory doesn't entail it." Good. So the *New* Rival Model must entail it.
      *   *Misconceptions:* Ensure "Bayes Factors" doesn't derail into a technical debate. Frame it as "changing the goalpost."
      *   *Tone:* Professional, peer-to-peer, not lecturing down.

  6.  **Final Polish:**
      *   Make sure the distinction between "Learning E" and "Learning H->E" is crystal clear. That's the hinge.
      *   Ensure the "Prediction vs Accommodation" point is handled as a pragmatic fix, not a formal one.
      *   The "Unlearn" strategy is the Counterfactual fix. I should group them.

      *(Self-Correction on the Example)*: The user says "rival model that was fitted to that same result after the fact." If it was fitted, critics will say "Of course it fits, you tuned it." To make POE work, the *structure* of the model must imply the result, even if parameters were optimized. I need to advise the user to emphasize the *structural entailment*, not the parameter fit. Otherwise, the "accommodation" objection kills the room.

      *(Self-Correction on Bayes Factors)*: If $P(E)=1$, then $P(E|H)$ is usually 1 (if entails). $P(E|\neg H)$ is... well, if E is known true, $P(E)$ is 1. Bayes Factor is $P(E|H)/P(E|\neg H)$. This doesn't depend on the marginal $P(E)$. So BF *solves* POE technically. I need to make sure I don't let them think BF is the "truth" and POE is "wrong." BF measures relative support, POE measures absolute belief update. They are different questions. I must clarify this distinction.

      *(Final Plan Structure)*:
      1.  Setup (The Rule).
      2.  The Trap (The Collapse).
      3.  The Example (The Lab Data).
      4.  The Pushback (Misconceptions).
      5.  The Way Out (Fixes).
      6.  The Check (Question).

