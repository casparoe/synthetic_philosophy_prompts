      *   *Core Argument:* A nation is a community with a shared history and culture (a "form of life"). Unrestricted immigration threatens this continuity. Therefore, the state has a right to control borders to preserve this identity.
      *   *Obligations:* It's not just rights. Immigrants have a duty to integrate (adopt the form of life). The state has a duty to treat them fairly once admitted (no racism).
      *   *Non-voluntariness:* Locals didn't choose their culture; they inherited it. Immigrants choose to enter. This asymmetry matters.

