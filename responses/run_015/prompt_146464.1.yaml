      *   **Residue Report:** Analyze what's left out. Is it a failure of the OSS framework, or does it expose weakness in Dummett's argument?
      *   **Tone/Style:** British English. Acknowledge the user's context (on a bus, phone, typos).
      *   **Key Dummett Concepts to Cover:** Cultural continuity, nation as a shared form of life, two-way obligation (state/newcomer), non-voluntary birth into culture.

  2.  **Deconstruct Dummett's Position (Immigration):**
