answer: |-
  **Handout: The Independence Axiom and the Value of Certainty**
  **Week 4 | Decision Theory Reading Group**

  **1. The Commitment Value of Certainty**

  The Independence Axiom tells us that if we prefer Outcome A to Outcome B, we should still prefer a gamble containing A to a gamble containing B, provided the rest of the gamble is identical. It treats probability as linear: 100% is just the limit of 99%.

  I argue that for high-stakes, one-shot decisions, this is descriptively and normatively wrong. 100% is not just a number; it is a qualitative state of being.

  When we talk about utility, we usually talk about consumption. But for life-changing sums, utility is largely about *agency*. A guaranteed $1M allows you to restructure your life immediately. You can sign a mortgage. You can quit a job. You can make irreversible commitments based on the asset. A 99% chance of $1M does not allow this. Banks do not lend against 99% probabilities; employers do not accept "99% chance I won't quit" as a reason to invest in your training.

  This creates a "commitment value" for certainty that exists over and above the expected monetary value. When you choose the sure thing in an Allais-style pair, you aren't just buying the money; you are buying the ability to plan. You are purchasing a solid floor on which to stand. When you choose the gamble, you are purchasing a ceiling, but the floor remains shaky.

  If rationality is about maximizing expected utility, and utility includes the capacity to act on your future, then the jump from 99% to 100% carries a massive utility spike that the jump from 50% to 51% does not. Independence fails here because it assumes the value of an outcome is independent of the context in which it arrives. But the context—specifically, whether the outcome is certain—changes the *kind* of good the money is.

  **2. The Curtain and The Envelope**

  Ollie's "Curtain" argument suggests that if we resolve the common probability branch first (behind a curtain), the inconsistency disappears. If the 89% "dead" tickets are removed, we are left facing the same choice in the remaining 11% of cases. Therefore, our preference should be stable.

  This argument relies on the assumption that the *timing* of the resolution doesn't matter. But if my argument about commitment value is correct, timing is everything.

  In the standard framing, I must choose *before* I know if I am in the 89% or the 11%. I have to plan my life *ex-ante*. The Sure $1M option lets me plan now. The Mixed option forces me to wait.

  In the Curtain version, the uncertainty resolves *before* I make the critical life decision. If the curtain lifts and I'm in the 89% branch, I'm handed the money and sent home. I don't have to choose. If I'm in the 11% branch, *then* I choose. This changes the decision problem from "How do I secure my financial floor?" to "Given that I missed the floor, how do I maximize the ceiling?"

  **The Penny Variant**
  Suppose the ticket is already drawn and sealed in an envelope. Someone offers to open it for a penny before I choose. Should I pay?

  No. I should not pay the penny.

  Here is why: Information only has value if it changes your action.
  *   **Case A (Dead Ticket, 89%):** The envelope contains a dead ticket. The rules say I am handed the common amount ($1M) and sent home. My choice is irrelevant. Paying the penny tells me I'm rich, but I would have been rich anyway without paying.
  *   **Case B (Live Ticket, 11%):** The envelope contains a live ticket. I must choose between the Sure $1M and the Risky $5M. Paying the penny tells me I'm in this branch, but it doesn't solve the choice for me. I still have to decide.

  Since knowing the state of the ticket does not alter the outcome in Case A (outcome is fixed) nor does it simplify the decision in Case B (choice remains), the information has zero instrumental value. Paying the penny is paying for curiosity, not agency.

  **What this commits me to:** It commits me to the view that rational agents maximize *control*, not just knowledge. If the state of the world is already determined, knowing it doesn't give me leverage unless I can act on it differently. Since the "Dead" outcome is fixed regardless of my choice, knowing I'm in the Dead state grants no leverage.

  **3. The "Bias" Objection**

  The standard objection is that this is just the "Certainty Effect," a documented cognitive bias where humans overweight sure things. The literature suggests we should debias ourselves to align with Expected Utility (EU) theory.

  This objection puts the cart before the horse. A "bias" is only a bug if the model it deviates from is the correct normative standard. EU theory assumes frictionless markets, infinite divisibility of assets, and the ability to hedge any risk. That is not the world we live in.

  In the real world, thresholds exist. Survival is non-linear. A 90% chance of food is not "almost the same" as 100% food; the 10% risk of starvation might kill you, rendering the extra food in the 90% scenarios worthless. We evolved in an environment where certainty was a prerequisite for long-term planning.

  Treating the Certainty Effect as a bias assumes that the abstract math of probability is more real than the physical constraints of banking, contracts, and psychology. I argue the opposite: the math is the simplification. Ignoring the qualitative leap of certainty is the error, not respecting it.

  **4. The Verdict**

  You asked for a decision on your actual equity payout: **11% chance at $1M** vs. **10% chance at $5M**.

  **Take the 10% shot at $5M.**

  Here is the defense, consistent with the arguments above:

  My defense of violating Independence relies entirely on the presence of a **Sure Thing**. In the Allais hypothetical that Ollie challenged you with, one option was a guaranteed $1M. That justified preferring it, because the "Commitment Value" of certainty is massive.

  However, in your actual equity case, **neither option is certain.**
  *   Option A: 89% chance of $0.
  *   Option B: 90% chance of $0.

  The "Commitment Value of Certainty" is zero for both options. You cannot sign a mortgage against an 11% chance, and you cannot sign a mortgage against a 10% chance. Both leave you in the same state of uncertainty regarding your life planning.

  Once the certainty premium is removed from the equation, we are left with a standard risk-reward calculation.
  *   **Expected Value A:** $110,000.
  *   **Expected Value B:** $500,000.

  Option B has more than 4x the expected value of Option A. To prefer Option A, your risk aversion would need to be extreme—so extreme that you value the first $1M more than 4.5x the utility of the next $4M, even when neither is guaranteed. Given that you are already working in contract roles and holding equity, you have demonstrated a tolerance for risk in your career.

  You were rational to prefer the Sure $1M in the hypothetical (because certainty matters). You are also rational to prefer the 10% @ $5M in reality (because certainty is off the table, and value matters). Ollie is wrong that these are inconsistent; they are context-sensitive.

  **One thing to worry about:**
  You mentioned you "can't remember who said what" regarding the literature. That's fine for the group. But for this decision: check the **liquidity constraints** of the payout. If the $5M is structured with earn-outs, vesting schedules, or clawbacks that the $1M is not, the "certainty" of the payout structure might differ even if the probability doesn't. If the $5M is just as liquid and immediate as the $1M, take the $5M. If the $5M is tied to your future labor or further performance, the "Commitment Value" argument might swing back toward the $1M, not because of probability, but because of the strings attached. Assuming the structures are identical aside from the odds: **Take the $5M.**
