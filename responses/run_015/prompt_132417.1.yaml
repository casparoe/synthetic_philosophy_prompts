      *   *Confusion 2: Uniqueness Bias.* People think their case is unique (requiring IV) when it's actually a sample from a reference class (requiring OV). They confuse *causal* uniqueness with *statistical* uniqueness.
      *   *Confusion 3: Modesty as Weakness.* Thinking epistemic modesty means lowering confidence in *all* claims. Actually, it means aligning confidence with the *reliability of the method*, not the strength of the intuition. You can be immodest about the method if the method is robust.

