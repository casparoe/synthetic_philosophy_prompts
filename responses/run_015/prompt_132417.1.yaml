answer: |-
  ### Part I: The Three Confusions
  **From the desk of a Senior Epistemologist**

  You asked for the confusions that rot the foundation of this debate. Most people treat Inside View (IV) and Outside View (OV) as competing sources of data. They aren't. They are competing *modes of validation*. Here are the three specific category errors I see in 90% of the literature:

  1.  **The Causal-Statistical Equivocation:** People assume that because a causal mechanism is clear (IV), the statistical frequency (OV) is irrelevant, or vice versa. They treat these as additive weights. They aren't. The IV provides the *conditional probability* given the specific details; the OV provides the *prior probability* of the reference class. The confusion arises when agents treat a strong causal story as evidence that they *do not belong* in the reference class. That is a claim that requires OV validation, not IV assertion. You cannot use the IV to exempt yourself from the OV.
  2.  **The Validity-Accuracy Conflation:** Agents confuse confidence in the *validity of their reasoning process* with confidence in the *accuracy of the output*. I can be 100% confident my logic is internally consistent (IV) while acknowledging that the premises are drawn from a domain with high noise (OV). Modesty applies to the link between premises and reality, not necessarily the link between premises and conclusion.
  3.  **The Modesty-Humility Equivocation:** Epistemic modesty is often treated as a moral virtue (humility) rather than a statistical correction. This leads to "false modesty," where an expert downgrades their confidence to be polite, violating calibration. True epistemic modesty is a demand for *calibration consistency*: if your reference class succeeds 10% of the time, your confidence cannot exceed 10% unless you have validated evidence of exception. Treating it as a social signal destroys its utility as a truth-tracking tool.

  ***

  ### Part II: The Desiderata (Spec Sheet for a Theory of Modesty)

  If you are building a theory that dictates when to switch from IV to OV, it must satisfy the following constraints. I have flagged the tensions between them.

  #### 1. Reference Class Non-Arbitrariness
  *   **The Case:** A startup founder claims their AI company is unique (IV) and rejects the base rate of startup failure (OV). They select the reference class "AI companies founded by ex-Googlers" (90% success) rather than "Series A tech startups" (10% success).
  *   **The Requirement:** The theory must provide an algorithm for selecting the *narrowest reference class that is statistically robust*. You cannot cherry-pick the class based on the desired outcome. The selection criteria must be independent of the specific hypothesis being tested.
  *   **Status:** **Non-Negotiable.** Without this, OV is just weaponized skepticism.

  #### 2. Outlier Asymmetry (The Expert Disagreement Constraint)
  *   **The Case:** You are a climatologist. 99% of your peers predict 2°C warming; you predict 4°C based on your model (IV).
  *   **The Requirement:** The theory must account for the asymmetry of being the outlier. If you are the outlier, the burden of proof shifts exponentially. However, it cannot demand *total* deference, or scientific progress stops. The theory must distinguish between "noise outliers" (error) and "signal outliers" (paradigm shift).
  *   **Status:** **Camp Preference.** The "Always Defer" crowd fails here (no progress). The "Trust Your Gears" crowd fails here (crank magnetism). The theory must quantify the *evidence required to sustain outlier status*.

  #### 3. Feedback-Loop Sensitivity (Sparse vs. Dense Domains)
  *   **The Case:** A chess player (dense feedback) vs. a geopolitical strategist (sparse feedback).
  *   **The Requirement:** The weight given to OV must scale inversely with the availability of immediate, unambiguous feedback. In dense feedback loops, IV calibration is fast; OV is less critical. In sparse loops (policy, investing), OV must dominate because IV calibration is impossible for a single lifetime.
  *   **Status:** **Non-Negotiable.** A theory that treats chess and foreign policy identically is dead on arrival.

  #### 4. Procedural vs. Propositional Separation
  *   **The Case:** I am modest about *whether* the market will crash (Propositional), but immodest about *my method* for analyzing crashes (Procedural).
  *   **The Requirement:** The theory must allow an agent to hold high confidence in their reasoning *procedure* while holding low confidence in the specific *belief* generated. Most theories collapse these. If I trust my procedure, I should trust the OV adjustment that my procedure dictates.
  *   **Status:** **Non-Negotiable.** This resolves the "paradox of skepticism" (i.e., "I am skeptical of everything, including skepticism").

  #### 5. Recursive Stability (The God's Eye View Problem)
  *   **The Case:** I use OV to correct my IV. But the decision to apply OV is itself an IV judgment. Do I need an OV on my ability to apply OV?
  *   **The Requirement:** The theory must terminate the regress. It must define a "fixed point" where further recursion yields diminishing returns or computational impossibility. You cannot demand an infinite chain of meta-modesty.
  *   **Status:** **The Killer Requirement.** (See below).

  #### 6. Forecasting Consistency
  *   **The Case:** Any theory must align with empirical data from forecasting tournaments (e.g., Tetlock/Good Judgment Project).
  *   **The Requirement:** The theory cannot prescribe behavior that contradicts observed calibration curves of superforecasters. If superforecasters aggregate base rates differently than your theory suggests, your theory is likely normative fantasy.
  *   **Status:** **Non-Negotiable.** Philosophy must bow to data here.

  ***

  ### Part III: The Tensions and The Stance

  #### The Jointly Unsatisfiable Pair
  **Local Causal Fidelity vs. Global Statistical Calibration.**
  You cannot maximize both simultaneously.
  *   **Local Causal Fidelity:** Demands you honor the specific details of the case (IV). If the details suggest an exception, you must predict the exception.
  *   **Global Statistical Calibration:** Demands that across all your predictions, your confidence matches your accuracy.
  *   **The Conflict:** To be globally calibrated, you often have to suppress locally valid insights because you cannot *know* if they are valid or just noise. To honor local causality, you risk becoming an outlier and destroying your calibration.
  *   **Resolution:** A viable theory must prioritize **Global Calibration** as the constraint and **Local Fidelity** as the variable. You are allowed to deviate from the base rate only to the extent that your past deviation history justifies it.

  #### The Committed Stance
  Here is where I draw the line for your feature.

  1.  **Non-Negotiable:** **Reference Class Non-Arbitrariness** and **Feedback-Loop Sensitivity.** If a theory lets you pick your own base rate, or treats politics like chess, it is pseudoscience.
  2.  **Camp Preferences:** The debate between "Always Defer to Base Rates" (Hansonians) and "Trust Your Gears" (Rationalist IV proponents) is a false dichotomy. Both fail **Feedback-Loop Sensitivity**. The "Always Defer" crowd ignores that in dense feedback domains, IV *becomes* the OV over time. The "Trust Your Gears" crowd ignores that in sparse domains, gears are uncalibrated noise.
  3.  **The Single Requirement That Kills the Most Popular Takes:**
      **Recursive Stability (Desideratum #5).**

      *Why it kills the takes:*
      *   **It kills Naive OV:** The standard advice ("Just look at the base rate!") assumes the act of looking at the base rate is unbiased. It isn't. Selecting the base rate is an Inside View act subject to bias. A theory that doesn't account for the bias in *applying* the Outside View is self-undermining.
      *   **It kills Naive IV:** The "follow your evidence" crowd assumes their reasoning engine is transparent to them. Recursive stability demands you treat your own reasoning as an object in the world, subject to the same failure rates as everyone else's.
      *   **The Implication:** Most popular frameworks collapse because they assume a "view from nowhere." They assume you can step outside your brain to apply the OV. You can't. You are always inside. Therefore, **Epistemic Modesty is not about switching views; it is about weighting the reliability of the view-generation process.**

  #### Scorecard of Usual Suspects (Brief)
  *   **Kahneman/Lovallo (Original OV):** Fails **Recursive Stability**. They treat OV as a corrective pill without analyzing the bias in prescribing the pill.
  *   **Robin Hanson (Outside View Agnosticism):** Fails **Outlier Asymmetry**. His framework makes paradigm shifts statistically impossible.
  *   **Eliezer Yudkowsky (Inside View Rationalism):** Fails **Feedback-Loop Sensitivity**. Overestimates the ability to calibrate IV in sparse domains.
  *   **Tetlock/Good Judgment (Empirical Forecasting):** **Passes.** They implicitly solve Recursive Stability by aggregating many views (making the "view generation" the reference class), but they lack a formal normative theory for the *individual* decision-maker.

  ### The Takeaway for Your Feature
  The story isn't "Inside vs. Outside." The story is that **there is no Outside View.** There is only the Inside View of a reference class. When you think you are using the Outside View, you are actually using an Inside View of a larger group.

  The only non-negotiable rule is this: **You must have a track record of outperforming the reference class *in that specific domain* before you are permitted to weight your Inside View above the Outside View.** If you don't have the track record, the Outside View *is* your Inside View. Anything else is delusion.
