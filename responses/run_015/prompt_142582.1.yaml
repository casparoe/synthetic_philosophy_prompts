answer: |-
  The established name in the sociology of human rights and atrocity studies is **Interpretive Denial**.

  It was codified by Stanley Cohen in his seminal work *States of Denial* (2001). Cohen distinguishes three types:
  1.  **Literal Denial:** "It did not happen." (The facts are rejected.)
  2.  **Interpretive Denial:** "It happened, but it is not *that*." (The facts are accepted, but the meaning/category is rejected.)
  3.  **Implicatory Denial:** "It happened, and it is *that*, but I am not responsible/it was justified." (The facts and category are accepted, but the implications are rejected.)

  What you are describing is the textbook definition of **Interpretive Denial**. The specific variant common in genocide studies is often referred to as **Soft Denial** or **Label Denial**. The rhetorical dynamic you identified—where conceding the horror bolsters the credibility of the categorical refusal—is a known feature of this mode; Cohen describes it as a "credibility buffer." By accepting the empirical facts, the speaker inoculates themselves against charges of lying, allowing them to focus the debate on the "technical" or "legal" definition, where the stakes (reparations, national identity) are actually located.

  However, since you are asking for the "carving"—how to distinguish this from honest definitional scruple, legal defense, or legitimate historical revision—I will offer a precise conceptual refinement. In the context of public history and museum curation, where "Denial" can be a conversation-stopper, you may find it useful to refer to the specific *argumentative maneuver* as **Exculpatory Reclassification**.

  Here is the carving you requested.

  ### The Principled Test: Distinguishing Exculpatory Reclassification from Honest Scruple

  There is no algorithm to prove motive, but there is a principled test based on **consistency** and **epistemic standards**. An honest definer and an exculpatory reclassifier will diverge on three specific criteria.

  **1. The Universality of Definition (The "Enemy Test")**
  *   **Honest Scruple:** The speaker applies the same strict definition of the category (e.g., genocide) to all historical cases, including those perpetrated by their own nation's enemies or allies. If they argue that "intent to destroy" requires a written order, they must apply that standard to the Holocaust, the Khmer Rouge, and Srebrenica equally.
  *   **Exculpatory Reclassification:** The definitional strictness is asymmetrical. The bar for "intent" is raised impossibly high for the case at hand (requiring a "smoking gun" document) while accepting circumstantial evidence of intent for other atrocities. The definition shifts to fit the desired outcome.

  **2. The Epistemic Standard of Intent**
  *   **Honest Scruple:** Acknowledges that state intent is rarely explicit in archival records and accepts **inferred intent** (pattern of action, foreseeable consequences, systematic nature) as valid historical evidence, consistent with how historians establish intent in other contexts.
  *   **Exculpatory Reclassification:** Demands **express intent** (a specific order to kill) while categorizing the actual evidence (systematic deportation, starvation, mass execution) as "collateral," "security," or "negligence." This creates a catch-22: the label is withheld because there is no order to kill, even though the actions resulted in mass death and were state-organized.

  **3. Functional Transparency**
  *   **Honest Scruple:** Acknowledges the stakes. "I am hesitant to use the word *genocide* because I worry it dilutes the legal term," or "I worry it closes off dialogue." They admit the label carries weight.
  *   **Exculpatory Reclassification:** Feigns neutrality. The speaker treats the label as a purely academic descriptor with no consequences, even while actively resisting its application. They portray the *other side's* insistence on the label as political, while framing their own refusal as purely technical.

  ### Boundary Cases

  To tighten the definition, here are three instances categorized by whether they constitute **Exculpatory Reclassification** (the move you identified) or not.

  **1. Clear Instance (Falls Under the Move)**
  *   **Case:** The official Turkish position on the 1915 Armenian deportations and deaths.
  *   **Why:** The state has increasingly conceded the scale of death and the suffering (moving away from literal denial) but maintains the classification was "relocation" or "wartime security" lacking specific genocidal intent. This retains the legal and diplomatic immunity associated with the term *genocide* while appearing to acknowledge historical pain. The definitional strictness applied here is not applied to other historical atrocities in Turkish discourse.

  **2. Clear Non-Instance (Does Not Fall Under the Move)**
  *   **Case:** A defense attorney at the ICTY (International Criminal Tribunal for the former Yugoslavia) arguing a specific general did not possess *mens rea* for genocide, despite the event itself being legally recognized as genocide.
  *   **Why:** This is **Legal Defense**, not historical reclassification. The lawyer is not disputing the nature of the event (Srebrenica was genocide), but the specific culpability of one actor within it. The category is accepted; the individual's fit within it is contested. This is a legitimate procedural function, not a rhetorical strategy to rewrite the historical record.

  **3. Undecided / Borderline Case**
  *   **Case:** The Holodomor (Ukrainian Famine of 1932–33).
  *   **Why:** Historians agree on the facts (millions died, state policies caused it). The debate is whether Stalin's intent was to destroy Ukrainians *as a national group* (genocide) or to crush the peasantry *as a class* (classicide/crime against humanity).
  *   **Verdict:** This remains **Honest Scruple** *if* the debater applies the same class-vs-identity distinction consistently elsewhere. It becomes **Exculpatory Reclassification** *if* the speaker uses the "class vs. nation" distinction solely to exonerate the Soviet state while accepting broader definitions of intent for capitalist colonial famines. Because the evidence of intent is genuinely ambiguous in the archives, this sits on the boundary; the *motive* of the speaker determines which side of the line it falls on.

  ### Recommendation for Your Panel

  In a museum context, the word "Denial" may trigger defensive shutdowns among stakeholders who believe they are being "precise."

  I recommend you name the phenomenon **Interpretive Denial** (to anchor it in the literature) but describe the specific rhetorical maneuver as **Exculpatory Reclassification**.

  When you encounter it, do not argue the facts (they have conceded those). Argue the **Epistemic Standard**. Ask: *"If the evidence for intent in this case were found in the archives of an adversary nation, would this same definition apply? Or are we requiring a standard of proof for intent here that we do not require for other recognized atrocities?"*

  This shifts the debate from "What is the truth?" (which you agree on) to "What is a fair historical method?" (which exposes the maneuver).
