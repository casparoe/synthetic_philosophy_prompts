prompt: |-
  Write the adversarial-collaboration document that a defender of the Mises-Hayek knowledge-problem argument and a defender of Lange-style competitive market socialism could jointly sign, focused specifically on the "Digital Gosplan" hypothetical: a socialist economy retaining public ownership and no labor markets, but equipped with real-time distributed sensing, algorithmic demand forecasting, and transparent distributed-ledger price adjustments.

