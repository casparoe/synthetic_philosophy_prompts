      *   *Point 2: Dynamic Costs (Fatigue).* In classic SPP, cost is fixed entry. In scrolling, cost accumulates. Marginal utility of content drops; marginal cost of attention rises. *Implication:* Decision theory needs *dynamic* cost functions, not static ones.
