answer: |-
  Dear Selection Committee, I am writing to submit a proposal for the three-month workshop fellowship, outlining a project that seeks to clarify a persistent ambiguity in the philosophy of history regarding multi-causal explanation. The central research question is whether the concept of overdetermination, as currently employed in historical methodology, conflates two distinct phenomena that require separate analytical treatment. Specifically, I aim to distinguish between structural robustness, where several independent causal pathways converge to produce the same historical outcome, and narrative redundancy, where historians generate multiple sufficient explanations that are not actually independent mechanisms but rather different descriptions of the same underlying process. By separating these concepts, I intend to determine whether we can establish a reliable criterion for when a historical explanation is genuinely overdetermined versus when it is merely over-described, and further, whether this difference can be operationalised through a structured counterfactual fragility check.

  This question arises because existing approaches in the philosophy of history often treat overdetermination as a monolithic problem of sufficiency. The prevailing tendency is to assume that if multiple causes are cited, the event is overdetermined, without sufficiently interrogating the independence of those causal pathways. Consequently, current frameworks leave open the possibility that what appears to be robust causal convergence is actually an artefact of descriptive layering. For instance, an economic explanation and a cultural explanation for the same event might be treated as competing or complementary sufficient causes, when in reality they may be tracking the same systemic shift using different vocabularies. Because standard discussions focus primarily on the logical sufficiency of causes rather than the ontological independence of the mechanisms involved, they fail to provide a method for distinguishing between a world where the outcome was inevitable due to multiple distinct pressures and a world where the outcome is simply being described multiple times. This leaves historians without a clear tool for assessing the fragility of their explanations, making it difficult to judge whether removing one alleged cause would genuinely alter the outcome or merely alter the description of the process.

  To address this gap within the confines of a part-time semester project, I have laid out a three-month methodological plan that prioritises conceptual clarity and limited but rigorous testing. During the first month, the work will focus entirely on conceptual reconstruction. I will refine the definitions of structural robustness and narrative redundancy to ensure they are mutually exclusive and jointly exhaustive for the purposes of this project. This involves mapping the logical conditions required for causal independence and contrasting them with the conditions for descriptive equivalence. The goal of this phase is to produce a working definition of the counterfactual fragility check, which will serve as the project's primary analytical tool. This check involves modelling a historical event as a system of variables and testing whether the removal of one alleged cause leaves the outcome intact via a genuinely separate pathway, or whether the removal collapses the explanatory model entirely because the remaining causes were dependent on the first.

  In the second month, I will apply this framework to a small set of case studies, likely limiting the scope to two well-documented historical events where overdetermination is frequently claimed. The intention is not to write full historical accounts but to use these events as test beds for the logical model. I will reconstruct the causal arguments typically offered for these events and subject them to the fragility check. This step is crucial for moving the project from abstract philosophy to practical methodology. It will reveal whether the distinction between robustness and redundancy holds up when confronted with the messiness of actual historical evidence. If the model proves too rigid for real-world cases, I will adjust the criteria during this phase to ensure the final output is usable by historians rather than being purely theoretical. The part-time nature of the fellowship means I will limit this to a conceptual stress-test rather than a full empirical investigation, ensuring the workload remains manageable alongside other commitments.

  The third month will be dedicated to synthesis and writing. I will draft a paper suitable for the workshop that presents the distinction, outlines the fragility check, and reports the results of the case study application. A positive result for this project would look like a clear set of criteria that allows historians to identify when they are dealing with genuine structural overdetermination versus narrative redundancy. Success would be demonstrated if the fragility check can successfully isolate cases where removing a cause changes the outcome from cases where removing a cause merely changes the story told about the outcome. Conversely, the project would count as failing if the distinction collapses under scrutiny, for instance, if it turns out that causal independence cannot be established without already assuming the truth of one narrative over another. Even a negative result would be valuable, as it would demonstrate why the conflation persists and warn against attempting to operationalise the distinction in this manner.

  I believe this scope is realistic for a three-month part-time fellowship because it does not require extensive archival research or the development of complex quantitative models. The work is primarily conceptual and analytical, relying on existing historical literature rather than new data collection. By focusing on the logical structure of explanation rather than the historical details themselves, I can make progress within the limited hours available. The outcome will be a draft article that contributes to the methodology of historical explanation, offering a new way to think about causality that avoids the pitfalls of current conflations. I am confident that this project aligns with the workshop's goals of fostering rigorous methodological innovation, and I look forward to the possibility of discussing these ideas further should my application be successful. Thank you for your time and consideration.
