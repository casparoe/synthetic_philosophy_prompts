answer: |-
  It is entirely understandable that you feel uncertain about applying this framework to your material, because while your friend is right that Kripke offers tools for thinking about identity and naming, the podcast host has conflated several distinct claims and oversimplified the conclusions in ways that will actively mislead you if you try to map them directly onto manuscript history. To give you the accuracy audit you asked for, I will walk through the host's account claim by claim, distinguishing between the core philosophical thesis, the reasonable simplifications, and the outright errors, before turning to how this bears on your specific cases.

  The host begins on solid ground when stating that a name like Hesperus is a rigid designator while a description like the brightest thing visible in the evening is not. This is the central technical claim of Kripke's view, and specialists accept it as stated: a rigid designator refers to the same object in every possible world where that object exists, whereas a non-rigid designator picks out whatever satisfies the description in a given world, which could be different objects in different worlds. The host is also correct that when astronomers discovered Hesperus is Phosphorus, they discovered a necessary truth, derived from the principle that if two things are identical, they are necessarily identical. This leads correctly to the notion of the necessary a posteriori, which is the claim that some truths are metaphysically necessary but can only be known through empirical investigation. However, the host's formulation that this kills the old empiricist idea that whatever is true of necessity can be known from the armchair requires a slight hedge. Kripke does sever the link between necessity and apriority, showing they are not co-extensive, but he does not dismiss armchair reflection entirely. In fact, it is armchair philosophical reflection that establishes the modal principle that identity is necessary; science merely establishes the factual identity. So the host overshoots when implying science tells us how things must be in the modal sense. Science tells us water is H2O, but philosophy tells us that given this fact, it is necessarily so. The host blurs the modal question with the epistemic one, suggesting that because the fact is a posteriori, the necessity is also discovered by science, whereas Kripke maintains that the modal status is determined by the nature of the terms and objects, which is a philosophical matter.

  The most significant error in the host's account, and the one most likely to confuse your application of the theory, is the closing generalization that once a name has latched onto a thing, everything we go on to say with that name holds of the thing in every possible world in which the thing exists. A specialist would reject this outright. Rigidity ensures that the referent of the name is fixed across worlds, but it does not render every predicate attached to that name necessary. For example, if I say Hesperus is visible in the evening, this is a contingent truth about Venus, even though Hesperus is a rigid designator. There are possible worlds where Venus exists but is not visible in the evening due to different atmospheric conditions or orbital arrangements. The host seems to confuse the necessity of identity with a kind of global essentialism about all properties associated with the name. Kripke does argue that some properties, like the microstructure of water, are essential, but this is specific to natural kind terms and identity statements, not a blanket rule for every sentence containing a name. This distinction is crucial for you because it means you cannot assume that every description historically associated with your manuscript names becomes a necessary truth about the object once the reference is fixed.

  When we turn to your first case, involving the Verona codex and the Ambrosian fragment, your intuition that Kripke's machinery might not fit perfectly is well-founded. Your friend calls this a textbook instance of the necessary a posteriori, and in a loose sense they are right that the identity statement is necessary if true. However, the hard question here lies not in the logic of identity but in the metaphysics of artifacts. Kripke's examples are celestial bodies and natural kinds, which have mind-independent identity conditions. A codex is an artifact, and its persistence conditions are conventional. You noted that the book could have been split differently or left intact, and this touches on the problem of sortals. To say the Verona codex is identical to the Ambrosian fragment is really to say that the physical object in Verona and the physical object in Milan are parts of the same whole book. But what counts as the same book? Is it the text, the physical gathering of quires, or the functional unit? If the name Verona codex was baptized to refer to the physical object found in Verona, and the Ambrosian fragment to the object in Milan, then strictly speaking they are not identical objects; they are distinct physical parts. The identity claim relies on a higher-level sortal concept of the book as an abstract or functional entity that can survive separation. Kripke's framework does not settle what the correct sortal is for manuscripts. If you treat the book as a physical object, the identity claim is false. If you treat it as a textual work or a historical artifact defined by its origin, the identity might hold. The difficulty is that artifact identity is vague and dependent on classificatory practices, whereas Kripke's rigid designators work best where the object's boundaries are not up for debate. So while the identity statement, once accepted, is necessary, the work lies in justifying the identity conditions of the object itself, which is a historical and mereological question rather than a purely logical one.

  Your second case, the Codex of the Nine, presents a different set of problems centered on reference fixing and empty names. Your friend claims the name simply fails to refer and so every sentence containing it is false, but this is too dogmatic and ignores how language actually functions in scholarly traditions. Kripke allows that a name can be introduced by a description, but he argues that the description fixes the reference rather than giving the meaning. If the description the manuscript containing the nine Easter sermons is satisfied by nothing, then on a strict Kripkean view, the name failed to refer at the moment of its baptism. However, you note that the name stayed in circulation and is now applied to one of the three books. This suggests a shift in reference or a causal chain that bypassed the original failed description. The hard question here is whether the current usage inherits the original failed baptism or constitutes a new naming event. If the name is empty, then strictly speaking, sentences using it lack a truth value or are false, but historians often treat such names as referring to the object currently designated by the community, effectively repairing the reference fix. You need the distinction between what fixes a name's reference versus what its bearer is. The description fixed the reference initially, but if nothing fit, the reference failed. Later usage may have re-fixed the reference to a specific existing codex via a causal chain of transmission, regardless of the original description. This is not a case of the necessary a posteriori but rather a case of reference change or error theory. The framework does not settle whether the name is now valid; it only gives you the tools to describe how the reference might have shifted from a failed description to a successful causal chain.

  To think about these cases properly, you need to employ further distinctions that the podcast host glossed over. First, you must distinguish between the object and the sortal under which it is identified. For the split book, you are not just asking if object A is object B, but whether the sortal book allows for spatial separation without loss of identity. Second, you need to separate the mechanism of reference fixing from the properties of the bearer. In the Codex of the Nine, the description was used to fix the reference, but it does not follow that containing nine sermons is a necessary property of the book now bearing the name. Third, you need a theory of empty names or reference shift to handle the case where the initial description fails. Kripke's view implies that if nothing satisfied the description, the name was empty, but subsequent usage can imbue it with reference through causal transmission, effectively overriding the original descriptive intent. Finally, you should keep the modal and epistemic questions separate. Discovering that the Verona and Ambrosian pieces belong to one book is an empirical discovery, but claiming it is necessary depends on your metaphysical commitment to the persistence conditions of books, which is not something science or history can decide alone. The host's claim that science tells us how things must be obscures the fact that historical and philosophical analysis is required to determine the modal status of artifact identity. In sum, Kripke gives you a logic of names and necessity, but he does not provide the metaphysics of artifacts or the sociology of scholarly naming practices, which is where the real work lies for your manuscript tradition.
