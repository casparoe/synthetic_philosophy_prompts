          *   *Defensibility:* High. Text supports the preference for impetuosity (*impetuoso*).
          *   *Link to Domination:* Moderate. It's about controlling circumstances, not necessarily dominating people via misogyny.
          *   *River Image:* Strong link. You build dikes *before* the flood. Boldness is the dike.

      *   *Thesis 3: The Adaptation Reading (Virtù as Flexibility).*
          *   *Claim:* *Virtù* isn't just brute force; it's adapting to the times (*tempori*).
          *   *Defensibility:* High. Machiavelli says men fail because they don't change their nature to fit the times.
          *   *Link to Domination:* Contradicts the colleague. If *virtù* is adaptation, "beating" is the wrong metaphor for the *whole* of politics.
