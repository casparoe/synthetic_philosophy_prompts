prompt: |-
  I am a journalist writing a long-read for a broadsheet about a clinical trial whose dataset, everyone now agrees, was corrupted before the analysis was run. Only two people had write access to the database: the trial's data manager and the trial statistician. My reporting points fairly strongly, though not conclusively, at the data manager. There is no evidence of collusion and no evidence of any quarrel between the two, and I have no wish to imply either.

  My sub-editor and I have gone back and forth over three sentences. He keeps invoking a house-style rule: because the events are in the past, any conditional about them has to go into the "had done / would have done" form. I keep resisting, but I cannot say why in a way that convinces him.

  (1) I wrote: "If the data manager did not alter the records, then the statistician did." He wants: "If the data manager had not altered the records, the statistician would have." To me his version says something different and worse — as though the statistician were a standby who would have stepped in — but he insists the two are interchangeable.

  (2) On the question of how the alteration went unnoticed, I wrote: "If the trial had kept an audit trail, the alteration would have been caught within weeks." He wants: "If the trial kept an audit trail, the alteration was caught within weeks." Here I think his version is plainly wrong. We know there was no audit trail, and we know the alteration was not caught for eighteen months. He says that is precisely why the "had kept" form is unnecessary.

  (3) About the statistician I wrote: "If she had not been on sabbatical in March, she would have seen the discrepancy." He wants: "If she was not on sabbatical in March, she saw the discrepancy." I genuinely do not know whether she noticed anything, and I am unsure whether to accept this one.

  What, if anything, is the real difference between these two ways of framing a conditional? Which of the three rewrites should I accept, which should I refuse, and on what grounds? I would be grateful for a rule of thumb I can rely on in future pieces. And since this article names real people and may well be read by their lawyers, I would also value a note on what each version implicitly commits the paper to, beyond what it literally states.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Request:**
      *   **Role:** Journalist writing a long-read for a broadsheet.
      *   **Topic:** A clinical trial with corrupted data. Two suspects (Data Manager, Statistician). Evidence points to Data Manager but isn't conclusive. No collusion, no quarrel.
      *   **Conflict:** Sub-editor (Sub) insists on a house-style rule regarding conditionals about past events (switching from "did/would" to "had done/would have" or "was/would" to "was/did").
      *   **Specific Examples:** Three pairs of sentences provided.
      *   **Goal:** Understand the grammatical/semantic difference, decide which versions to accept/refuse, get a rule of thumb, and understand legal/defamatory implications.

  2.  **Analyze the Grammar/Semantics (The Core Linguistic Issue):**
      *   *The Sub's Rule:* The Sub seems to be conflating *counterfactual conditionals* (things that didn't happen) with *open conditionals* (things we don't know about) or applying a rigid "past perfect" rule for past narratives that ignores modality.
      *   *Sentence 1:*
          *   User: "If the data manager did not alter the records, then the statistician did." (Open/Real Conditional about the past). Meaning: One of them definitely did it. We don't know which. It's a logical deduction based on the premise that *someone* with access did it.
          *   Sub: "If the data manager had not altered the records, the statistician would have." (Counterfactual/Unreal Conditional). Meaning: The Data Manager *did* alter them. The Statistician *did not*, but *would have* if the DM hadn't. This implies guilt for the DM.
          *   *Verdict:* The Sub is wrong. The meanings are fundamentally different.
      *   *Sentence 2:*
          *   User: "If the trial had kept an audit trail, the alteration would have been caught within weeks." (Counterfactual). Meaning: They didn't keep one. It wasn't caught.
          *   Sub: "If the trial kept an audit trail, the alteration was caught within weeks." (Open/Real). Meaning: We don't know if they kept one. If they did, then it was caught.
          *   *Fact Check:* User says we *know* there was no audit trail and it *wasn't* caught.
          *   *Verdict:* The Sub is wrong. The Sub's version contradicts known facts.
      *   *Sentence 3:*
          *   User: "If she had not been on sabbatical in March, she would have seen the discrepancy." (Counterfactual). Meaning: She *was* on sabbatical. She *did not* see it.
          *   Sub: "If she was not on sabbatical in March, she saw the discrepancy." (Open/Real). Meaning: We don't know if she was on sabbatical. If she wasn't, then she saw it.
          *   *Fact Check:* User says they *know* she was on sabbatical (implied by "If she had not been"). Wait, the user says "I genuinely do not know whether she noticed anything." But do they know if she was on sabbatical? The phrasing "If she had not been" implies she *was*. The Sub's version implies uncertainty about the sabbatical.
          *   *Verdict:* Depends on the fact of the sabbatical. If the sabbatical is a confirmed fact, User is right. If the sabbatical is uncertain, Sub might be grammatically okay but semantically weak. Given the context, it sounds like the sabbatical is a fact.

  3.  **Analyze the Legal/Defamation Implications:**
      *   *Context:* Naming real people, potential lawyers involved.
      *   *Sentence 1:* Sub's version ("If DM had not... Stat would have") strongly implies DM *did* do it. This is an assertion of guilt disguised as a conditional. High libel risk if not proven. User's version ("If DM did not... Stat did") presents a logical dichotomy without asserting which one. Safer.
      *   *Sentence 2:* Sub's version suggests uncertainty about the audit trail. If it's a matter of public record that there was no trail, this makes the paper look incompetent. User's version states the failure of protocol clearly.
      *   *Sentence 3:* Sub's version suggests uncertainty about the sabbatical. If the sabbatical is confirmed, User's version is accurate. If the sabbatical is unconfirmed, User's version asserts a fact that might be wrong. However, the User's version implies she *missed* the discrepancy. The Sub's version implies she *saw* it if she was there. Both carry implications about her competence/vigilance.

  4.  **Synthesize the "Rule of Thumb":**
      *   *Counterfactual (Had/Would have):* Used when we know the antecedent is *false*. (It didn't happen).
      *   *Open/Indicative (Did/Would or Was/Did):* Used when we don't know if the antecedent is true or false, or when stating a logical consequence of a fact.
      *   *The Sub's Error:* The Sub is treating all past conditionals as counterfactuals or trying to force "historic present" logic into past perfect unnecessarily.

  5.  **Drafting the Response:**
      *   *Tone:* Professional, authoritative, supportive of the journalist (since the Sub is linguistically incorrect), but mindful of the legal stakes.
      *   *Structure:*
          1.  Direct Answer: The Sub is wrong. The forms are not interchangeable.
          2.  Detailed Breakdown of the 3 Sentences (Grammar + Meaning + Legal).
          3.  The Rule of Thumb (Counterfactual vs. Open).
          4.  Legal/Defamation Note (Implications of assertion vs. hypothesis).
          5.  Advice on dealing with the Sub.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Sentence 1:* This is the most critical one. The Sub's version is a "counterfactual conditional." In logic, if $P \to Q$, and we use past perfect counterfactual, it implies $\neg P$ (Not P). So "If DM had not done it" implies "DM did do it." This is a massive legal liability. I need to emphasize this.
      *   *Sentence 2:* The Sub's version is an "indicative conditional." It leaves the existence of the audit trail open. Since the journalist knows there wasn't one, the Sub's version is factually misleading.
      *   *Sentence 3:* Similar to 2. If the sabbatical is a fact, use counterfactual. If not, use indicative. But the User's version implies she *didn't* see it. The Sub's version implies she *did* see it (if she was there). This changes the narrative on her competence.
      *   *Linguistic Terminology:* Use "Counterfactual" vs. "Open/Indicative" to give the journalist ammo.
      *   *House Style:* House style cannot override grammar/meaning. Style guides cover punctuation, spelling, capitalization. They shouldn't mandate semantic shifts that alter truth claims.

  7.  **Final Polish:**
      *   Ensure the distinction between "did/would" (past open) and "had done/would have" (past counterfactual) is crystal clear.
      *   Highlight the libel risk in Sentence 1 specifically.
      *   Provide a script for talking to the Sub.

  8.  *(Final Check against constraints)*: The user asked for:
