answer: |-
  Your sub-editor is incorrect. The two forms are **not** interchangeable. They encode fundamentally different claims about reality, truth, and liability. In a story involving potential defamation and scientific misconduct, this distinction is not merely stylistic; it is evidentiary.

  Your sub-editor appears to be applying a rigid "sequence of tenses" rule (matching past narrative with past perfect) without understanding **modality**. In English grammar, the choice between the *indicative* (did/was) and the *subjunctive/perfect* (had done/had been) in conditionals signals whether the writer believes the condition is possible, unknown, or impossible (counterfactual).

  Here is the breakdown of the three sentences, the linguistic reality, and the legal implications.

  ### 1. The Accusation (Sentence 1)

  > **Yours:** "If the data manager did not alter the records, then the statistician did."
  > **Sub's:** "If the data manager had not altered the records, the statistician would have."

  *   **The Grammar:** Yours is an **open past conditional**. It treats the data manager's guilt as an unknown variable. It states a logical dichotomy: Given that someone with write access corrupted the data, it was either A or B.
      The Sub's version is a **counterfactual conditional**. In English semantics, using the past perfect ("had not altered") in the *if*-clause strongly implicates that the condition is false. It implies: *The data manager did alter the records.* Consequently, "the statistician would have" implies the statistician *did not*.
  *   **The Meaning:** Your version says: "One of them did it, we aren't sure which." The Sub's version says: "The data manager did it. The statistician is innocent but would have been the backup culprit."
  *   **The Legal Risk:** **Refuse the Sub's version.** It is a libel trap. Your version protects the paper by presenting a logical deduction based on access. The Sub's version asserts the Data Manager's guilt as a premise. If you cannot prove the Data Manager did it conclusively, the Sub's sentence is defamatory. It removes the "if" from the equation effectively turning it into "Since the data manager altered the records..."
  *   **Verdict:** **Keep yours.**

  ### 2. The Audit Trail (Sentence 2)

  > **Yours:** "If the trial had kept an audit trail, the alteration would have been caught within weeks."
  > **Sub's:** "If the trial kept an audit trail, the alteration was caught within weeks."

  *   **The Grammar:** Yours is **counterfactual**. It asserts as fact that the trial *did not* keep an audit trail and the alteration *was not* caught.
      The Sub's version is **open/indicative**. It suggests you do not know whether an audit trail existed. It posits: "In the scenario where a trail existed (we don't know if it did), the alteration was caught (we don't know if it was)."
  *   **The Meaning:** Your version accurately reflects the known failure of protocol. The Sub's version introduces uncertainty where there is none. It makes the reporting look sloppy, as if you failed to check whether an audit trail existed.
  *   **The Legal Risk:** **Refuse the Sub's version.** While less defamatory than Sentence 1, it undermines the factual authority of the piece. If the absence of an audit trail is a matter of record, the Sub's version could be challenged as misleading.
  *   **Verdict:** **Keep yours.**

  ### 3. The Sabbatical (Sentence 3)

  > **Yours:** "If she had not been on sabbatical in March, she would have seen the discrepancy."
  > **Sub's:** "If she was not on sabbatical in March, she saw the discrepancy."

  *   **The Grammar:** This depends entirely on whether the sabbatical is a confirmed fact.
      *   **If she was definitely on sabbatical:** Yours is correct (counterfactual). It means: She was away, therefore she missed it.
      *   **If her whereabouts are unknown:** The Sub is grammatically permissible (open conditional), but semantically weak.
  *   **The Meaning:** Your version implies she *failed* to see the discrepancy because she was absent. The Sub's version implies that if she was present, she *succeeded* in seeing it.
  *   **The Legal Risk:** **Nuanced.** If you know she was on sabbatical, the Sub's version is factually confusing. However, be careful with your version: asserting she "would have seen" the discrepancy assumes her competence. If she was present and *still* missed it, your sentence is speculative. However, the Sub's version ("she saw the discrepancy") asserts she definitely noticed it if she was there, which you admitted you "genuinely do not know."
  *   **Verdict:** **Keep yours, but verify the sabbatical.** If the sabbatical is confirmed, your grammar is correct. If the sabbatical is unconfirmed, you should not be writing a conditional about it at all; you should state the uncertainty directly (e.g., "It remains unclear whether her sabbatical prevented her from noticing..."). Do not accept the Sub's version, as it asserts she *saw* the discrepancy, which you do not know.

  ### The Rule of Thumb

  You can rely on this distinction for future pieces:

  1.  **Use "If + Past Perfect (had done)... would have done"** (Counterfactual)
      *   **When:** You know the event **did not happen**.
      *   **Meaning:** "This didn't happen, but if it had, this would be the result."
      *   **Example:** "If the brake lines *had not* been cut, the car *would not* have crashed." (Implication: They were cut.)

  2.  **Use "If + Simple Past (did)... would/will/did"** (Open/Indicative)
      *   **When:** You **do not know** if the event happened, or you are stating a logical consequence of a possibility.
      *   **Meaning:** "We don't know if this happened. But in the case that it did, this is the consequence."
      *   **Example:** "If the brake lines *were* cut, the car *would* have crashed." (Implication: We are testing the hypothesis that they were cut.)

  **Your Sub's Error:** Your Sub is trying to force all past narratives into the "had done" form to match the timeline. This is grammatically valid for *narrative sequence* (e.g., "He died before he had finished the book"), but it is incorrect for *conditional logic*. Changing the tense changes the truth claim.

  ### Advice for the Sub-Editor

  House style guides cover spelling, capitalization, and punctuation (e.g., *organise* vs. *organize*, *Labour* vs. *labor*). They **cannot** override semantic logic. A style rule that mandates changing a truth claim (from "we don't know" to "we know they didn't") is not a style rule; it is an editorial intervention that alters the meaning of the copy.

  **Suggested response to your Sub:**

  > "I understand the house preference for past perfect in past narratives, but in conditional logic, the tense shift changes the truth claim.
  >
  > In Sentence 1, 'If he had not' implies he *did* do it. 'If he did not' leaves it open. Since we are not alleging guilt conclusively, the Sub's version creates a libel risk by asserting the condition is false.
  >
  > In Sentence 2, 'If the trial had kept' asserts as fact that they didn't. 'If the trial kept' suggests we don't know. Since we know they didn't, my version is factually accurate.
  >
  > Changing these to the past perfect alters the meaning from 'unknown/open' to 'counterfactual/known.' I need to retain the indicative form to ensure accuracy and legal safety."

  ### Summary of Actions

  1.  **Sentence 1:** **Refuse.** The Sub's version asserts guilt. High legal risk.
  2.  **Sentence 2:** **Refuse.** The Sub's version contradicts known facts.
  3.  **Sentence 3:** **Refuse.** The Sub's version asserts knowledge you don't have (that she saw the discrepancy).

  You are right to resist. In investigative journalism, the modality of your verbs is as important as the nouns. Do not let style override substance.
