prompt: |-
  I'm a novelist running a small workshop for other writers who like philosophy but haven't touched physics since highschool. Next session i want to teach Gödel's rotating-universe idea and why he read it as meaning time literally doesn't exist globally — not as sci-fi, but as a conceptual blow to our usual sense of 'now.' I need the teaching plan, not the lecture itself.

  What idea has to be in place first, before they can even hear 'time is an illusion' as philosophy rather than fantasy? What's the one carryng example — probably a traveler looping back to meet herself — and what must it include or lack so it shows closed timelike curves without turning into a Back to the Future plot? Walk me through the misconceptions in the order they'll surface: first that feeling time pass proves it's real, then that this is just coordinate trickery with no physical bite, then the 'didn't astronomers disprove universal rotation?' objection. For each, tell me exactly where in the arc to absorb it.

  There's also a subtle confusion i want you to flag that most pop accounts skip: people picture the universe physically spinning like a carousel of galaxies, when Gödel's point was about the metric allowing loops regardless of any material rotation. Where do i insert that distinction so it doesn't get lost?

  What quick check at the end tells me they've actually grasped the philosophical punch — that local experience of time doesn't guarantee a universal timeline — rather than just being dazzled?

  And what should i openly refuse to derive? I assume the Einstein field equations and the metric tensor stay out, but confirm and say so.

  Please end your response with a one-sentence summary of the plan on its own line beginning with 'Bottom line:'.
