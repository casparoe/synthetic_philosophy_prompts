  2.  **Deconstruct the Nietzschean Framework (for adaptation):**
      *   *On the Use and Abuse of History for Life:* Nietzsche argues we need history for life, but too much kills us.
      *   *Monumental:* Looking at great past deeds to inspire great future deeds. (Inspiration).
      *   *Antiquarian:* Revering the past for its own sake, preserving roots. (Piety/Conservation).
      *   *Critical:* Judging and condemning the past to break its chains and live anew. (Liberation/Destruction).
      *   *The Twist:* The prompt asks to treat these as *infrastructures*. This means they aren't just attitudes; they are systems, technologies, or laws governing the city.
      *   *The Conflict:* The Critical archivist thinks she is liberating the city by cutting away dead weight, but she's actually stabilizing the status quo (Antiquarianism) because her cuts are predictable or regulated.
      *   *Mnemonic Sovereignty:* Who decides what is remembered?

  3.  **Drafting the Story - "The Silt of Mnemosyne":**
      *   *Character:* Elara, a Critical Archivist.
      *   *Setting:* The City of Mneme (or similar). Let's call it *Aletheia*. No, let's keep it nameless to emphasize the structural nature. "The Archive."
      *   *Action:* She is performing an "incision." Cutting away a memory.
