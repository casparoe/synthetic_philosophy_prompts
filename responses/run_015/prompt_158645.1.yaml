      *(Self-Correction during drafting)*: Make sure I don't make it too sci-fi. No lasers or brain chips. It should feel like bureaucracy mixed with metaphysics. The "infrastructure" is cognitive but manifested in the city's layout and rituals.

      *Key Scene:* Elara reviewing a file for erasure. She sees a pattern. The "Critical" act is supposed to be violent and liberating, but here it's sanitary. It keeps the Antiquarian core safe.

      *Mnemonic Sovereignty:* Introduce this as the underlying tension. The three modes aren't cooperating; they are vying for the "Usable Past."

  4.  **Drafting the Analysis/Note:**
      *   *Liberties:* Nietzsche didn't see these as literal infrastructures or competing political factions in a city. He saw them as attitudes within the individual/culture.
      *   *Contested Reading:* The idea that Critical history *can* become Antiquarian. Nietzsche implies Critical is the antidote to Antiquarian stagnation. The story argues they can collude.
      *   *Weakest Point/Falsifiability:* If Nietzsche's core premise that "Critical history serves *Life*" is absolute, then a Critical act that sustains stagnation is a contradiction in terms. If Critical history *cannot* be co-opted by nature of its definition, the story's central paradox fails.

