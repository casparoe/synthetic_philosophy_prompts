answer: |-
  ### Take-Home Exam Question: Individual Impact and Collective Harm
  **Course:** PHIL 405 – Ethics of Collective Action  
  **Total Marks:** 30  
  **Word Limit:** 900 words maximum  

  **Question:**  
  Consider **Bridgeville**, a town with 10,000 drivers. Engineering reports confirm that if *precisely* 5,000 drivers choose to drive one extra mile on Tuesday, a specific bridge collapses due to resonant load distribution. If 4,999 or 5,001 drive, the bridge stands. Contrast this **threshold harm model** with the **linear diffuse harm model** of standard carbon emissions (where each mile adds infinitesimal risk proportional to distance).

  Write an essay analyzing whether the moral argument against individual participation (driving, eating meat, voting) becomes stronger, weaker, or fundamentally different when shifting from the linear model to the threshold model. Your response must:
  1.  Determine whether the inefficacy objection rests on **causal redundancy** (my act changed nothing), **expected impact** (probability × magnitude), or **normative redundancy** (my act is irrelevant given others' actions).
  2.  Apply this distinction to **Climate Change** (linear), **Meat Consumption** (supply chain thresholds/batching), and **Voting** (probabilistic thresholds).
  3.  Conclude whether the Bridgeville scenario undermines or reinforces the obligation to act individually compared to real-world climate cases.

  ***

  ### Model Answer Key: Required Conceptual Moves
  *A top-scoring response (27–30 marks) must not merely describe the cases but execute the following conceptual distinctions. The student does not need to use this exact formatting, but their essay must contain this logical architecture.*

  **1. Disentangling the Inefficacy Objection (5 Marks)**
  *   **Move:** Explicitly define the inefficacy objection not as a single claim but as a confusion between *causation* and *expectation*.
  *   **Required Argument:** The objection claims "I made no difference." In **linear models** (climate), this is false causally (every ton adds harm) but feels true normatively (harm is imperceptible). In **threshold models** (Bridgeville), this is potentially true causally (if the threshold isn't met, no collapse occurred *because* of the driving).
  *   **Verdict:** The student must argue that the objection is strongest on *causal* grounds in threshold cases but weakest on *expected utility* grounds across all cases.

  **2. Analyzing Bridgeville vs. Climate (8 Marks)**
  *   **Move:** Contrast **deterministic thresholds** with **probabilistic linearity**.
  *   **Required Argument:** In Bridgeville, if 4,999 drive, the 5,000th driver is the sole cause. If 5,001 drive, causation is overdetermined (no single driver is necessary). This makes moral responsibility *contingent* on exact numbers.
  *   **Comparison:** In climate (linear), responsibility is *non-contingent*. Every act adds harm regardless of what others do.
  *   **Verdict:** The moral argument is **stronger** in the linear climate model because it avoids the "luck" factor of Bridgeville (where you might drive extra and cause nothing). Linear harm guarantees contribution; threshold harm offers a chance of causal innocence.

  **3. Meat Consumption: The Buffered Threshold (8 Marks)**
  *   **Move:** Identify meat consumption as a **probabilistic threshold** rather than a strict binary.
  *   **Required Argument:** Supply chains batch orders. Buying one chicken doesn't always trigger an order, but it increases the probability of a threshold being crossed (e.g., a crate of 20).
  *   **Application:** Unlike Bridgeville (known threshold), meat supply chains are opaque. Therefore, we must rely on **expected impact** (Probability of triggering order × Suffering per order).
  *   **Verdict:** The moral argument here aligns closer to voting than climate. It is weaker than climate (linear) because there is a non-zero chance your purchase changes nothing, but stronger than voting because the probability of impact is significantly higher than 1 in millions.

  **4. Voting: The High-Stakes Low-Probability Threshold (5 Marks)**
  *   **Move:** Address voting as a **pure probabilistic threshold**.
  *   **Required Argument:** One vote only matters if the election is tied (threshold). The probability is near zero, but the magnitude (policy impact) is massive.
  *   **Comparison:** Unlike Bridgeville (where the harm is negative), voting aims for positive impact. The inefficacy objection here relies on **causal redundancy** (my vote rarely decides).
  *   **Verdict:** The moral argument survives only via **expected utility**. If students argue voting is obligatory because of "duty" rather than impact, they must justify why duty applies here but not in Bridgeville driving.

  **5. Synthesis and Conclusion (4 Marks)**
  *   **Move:** Unify the three cases under **Expected Utility vs. Causal Certainty**.
  *   **Required Argument:** The Bridgeville scenario actually *weakens* the moral argument compared to climate change because it introduces the possibility of causal nullity (driving extra miles but no collapse). Climate change removes the "luck" escape clause.
  *   **Final Verdict:** The inefficacy objection fails across all three when using **expected impact**, but succeeds partially on **causal** grounds in threshold cases (Meat/Voting/Bridgeville). Therefore, the moral argument is most robust in the linear climate case, not the threshold case.

  ***

  ### Marking Scheme (30 Marks Total)

  | Section | Criteria | Marks | Common Mistakes (Penalties) |
  | :--- | :--- | :--- | :--- |
  | **Conceptual Framework** | Clearly distinguishes Causal Redundancy, Expected Impact, and Normative Redundancy. | 0–5 | **-2** for treating inefficacy as a single monolithic argument. <br> **-3** for conflating "no impact" with "no harm." |
  | **Bridgeville vs. Climate** | Analyzes why linear harm avoids the "contingency luck" of thresholds. | 0–8 | **-4** for claiming Bridgeville makes responsibility *clearer* (it makes it contingent). <br> **-3** for ignoring the overdetermination problem (5,001 drivers). |
  | **Meat & Voting Application** | Correctly identifies Meat as probabilistic threshold and Voting as low-prob/high-magnitude. | 0–8 | **-4** for treating Meat as purely linear (ignoring batching). <br> **-4** for treating Voting as purely expressive (ignoring impact calculus). |
  | **Synthesis/Verdict** | Concludes whether the moral argument strengthens or weakens across models. | 0–5 | **-3** for concluding all three are identical morally. <br> **-2** for ignoring the "expected utility" solution. |
  | **Clarity & Constraints** | Adheres to word limit; precise philosophical terminology. | 0–4 | **-2** for exceeding 900 words. <br> **-2** for vague language (e.g., "it's just wrong"). |

  **Specific Point Deductions:**
  *   **Mixing up Underdetermination:** If the student argues that because we don't *know* the threshold in meat consumption, it is the same as climate linearity, deduct 3 marks. (Epistemic uncertainty ≠ Ontological linearity).
  *   **Ignoring Expectation:** If the student argues voting is useless because "one vote never decides," deduct 5 marks. (Failures to engage with expected utility calculus is a critical failure in this seminar).
  *   **Treating Domains as Identical:** If the essay argues "-driving, meat, and voting are all the same," deduct 5 marks. (The prompt requires differentiation).

  ***

  ### Reflection: What Would Change My Mind?

  The model answer above assumes a **consequentialist framework** where moral weight is tied to expected impact or actual harm contribution. My verdict—that linear climate harm creates a *stronger* individual obligation than threshold cases like Bridgeville—relies on the idea that avoiding "causal luck" strengthens responsibility.

  However, I would change my mind if presented with a robust **non-consequentialist account of complicity** that favors threshold models. For example, if it could be demonstrated that participating in a **joint intentional activity** (like the drivers of Bridgeville knowingly risking the bridge) creates a stronger normative bond than diffuse, anonymous contributions (climate), then the threshold model might yield *stronger* moral obligations despite the causal uncertainty.

  Additionally, empirical evidence regarding **supply chain elasticity** could flip the verdict on meat. If data showed that consumer demand is perfectly buffered (i.e., individual purchases *never* trigger additional production due to waste margins), the expected utility for meat drops to near zero, weakening the moral argument significantly compared to climate change, where the physics of carbon accumulation is undeniable. Currently, the model answer assumes a non-zero probability of impact for meat; if that probability were proven to be effectively zero in specific contexts, the analogy to climate change would break, requiring a different normative justification (e.g., virtue ethics) to sustain the obligation.
