      *   It is a **Category Clash / Normative Conflict**. It's a conflict between *Epistemic Norms* (truth-tracking) and *Ethical/Political Norms* (community cohesion, reparative justice).
      *   *Key Insight:* The seminar is stuck because they are trying to solve an ethical problem with an epistemic solution (or vice versa).

  5.  **Drafting the Response (Iterative Process):**

