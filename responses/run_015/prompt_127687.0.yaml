answer: |-
  This is a classic impasse in the philosophy of history, echoing the debates between Pierre Nora (*Lieux de Mémoire*), Paul Ricoeur (*Memory, History, Forgetting*), and more recently, scholars of epistemic injustice.

  Here is the diagnosis of your seminar's stall, an analysis of why "mnemonic standing" feels slippery, and a concrete path to break the loop.

  ### 1. The Diagnosis: It is Not Verbal, It is Normative
  Your seminar is not stuck because of a **verbal dispute** (definitions of "history"), nor is it a **substantive factual dispute** (you agree on the existence of the docs and the oral tradition).

  It is a **Normative Category Clash**. Specifically, you are conflating **Epistemic Authority** with **Ethical Sovereignty**.

  *   **The "History" Side** is arguing from *Epistemic Norms*. Their primary good is **Truth/Accuracy**. They view the past as an object of inquiry that exists independently of our relationship to it. For them, a false narrative is a *failure of function*.
  *   **The "Memory" Side** is arguing from *Ethical/Political Norms*. Their primary good is **Justice/Cohesion**. They view the past as a resource for present identity and survival. For them, a disruptive truth that destroys community agency is a *failure of ethics*.

  **Why you are stuck:** You are trying to solve an ethical problem with an epistemic solution (or vice versa). The History side says, "You are factually wrong." The Memory side says, "You are morally violent." Both statements can be true simultaneously, which is why no one moves. You are playing two different games with the same pieces.

  ### 2. Analyzing the "Mnemonic Standing" Claim
  Your professor's term, "mnemonic standing," is not just relabeling the intuition; it is a legitimate philosophical claim, but it is currently under-theorized in your seminar.

  *   **What it is:** It is a claim to **Hermeneutical Justice** (to use Miranda Fricker's term). It suggests that a community has a proprietary right to the *meaning* of their past, even if they lack control over the *facts* of their past.
  *   **Why it feels slippery:** Because it sounds like a "right to be wrong." If framed as "we have a right to believe falsehoods," the History side will (correctly) reject it as anti-realist.
  *   **How to fix it:** Reframe "mnemonic standing" not as a right to factual inaccuracy, but as a right to **narrative priority**. The claim isn't "The collaboration didn't happen." The claim is "The collaboration is not the *definitive* truth of this person's life in the context of our survival."

  ### 3. The Real Disagreement: Two Questions Under One Heading
  Your second hypothesis is the winner: **This is two questions mashed together.**

  1.  **The Ontological Question:** *What happened?* (The domain of Archival History).
  2.  **The Commemorative Question:** *How shall we live with what happened?* (The domain of Collective Memory).

  The seminar is stuck because you are trying to answer Question 2 using the rules of Question 1.
  *   When the History side says, "We must teach the collaboration," they are answering Question 1.
  *   When the Memory side says, "That erases our resistance," they are answering Question 2.

  ### 4. How to Make Progress
  Do not try to synthesize the two into one "super-truth." That leads to mush. Instead, propose a **Functional Distinction**. Progress in your seminar should look like moving from "Who is right?" to "What is the function of this specific discourse?"

  Here are three specific moves to unstick the discussion:

  #### A. Adopt Ricoeur's "Triple Duty"
  Paul Ricoeur argues that history has a duty to truth, but memory has a duty to the dead.
  *   **Progress Move:** Propose that the "Archival Record" satisfies the **Duty to Truth**, while the "Community Memory" satisfies the **Duty to Justice**.
  *   **Application:** In the case of the collaborator/resistance hero: The archive must record the collaboration (Duty to Truth). The community monument may still honor the resistance (Duty to Justice), *provided* there is a mechanism to acknowledge the complexity. The stall breaks when you admit both duties exist but apply to different spheres (the textbook vs. the town square).

  #### B. Distinguish "Hard History" from "Living History"
  *   **Hard History:** The critical reconstruction of events (Archives). This is fallibilist and open to revision.
  *   **Living History:** The performative use of the past to sustain identity (Memory). This is conservative and protective.
  *   **Progress Move:** Ask the seminar: *"Are we trying to write a peer-reviewed paper, or are we designing a museum exhibit?"* If it's the paper, the archives win. If it's the exhibit, mnemonic standing gains weight. Acknowledging the *context of use* resolves the authority conflict.

  #### C. The "Counter-Memory" Principle
  Instead of viewing Memory as "Falsehood" and History as "Truth," view them as **Adversarial Partners**.
  *   **Progress Move:** Suggest that the community's "false" memory might be preserving a *structural truth* that the archives miss.
      *   *Example:* The archives say he collaborated. But perhaps the archives are colonial records designed to criminalize resistance. The community memory says "Hero." Maybe he collaborated tactically to save lives, which the cold documents don't show.
      *   Here, the Memory isn't "factually wrong"; it is **contextually richer**. The archive has the *event*; the memory has the *motive*.
      *   **Principle:** Archives preserve *actions*; Memory preserves *intentions*. You need both for a complete picture.

  ### 5. What Counts as Success?
  You should not accept being stuck. The tension is real, but the paralysis is avoidable.

  **A successful seminar outcome looks like this:**
  1.  **Agreement on Domain:** Acknowledge that Epistemic Authority (Truth) belongs to the critical historian, but Political Legitimacy (Meaning) belongs to the community.
  2.  **Rejection of Sovereignty:** Neither side has total sovereignty. The Historian cannot dictate community identity; the Community cannot dictate the archival record.
  3.  **The "Pluralist" Solution:** The curriculum teaches the collaboration (History), but the unit includes a module on *why* the community remembers him as a hero (Memory). This turns the conflict *into* the subject matter.

  **Recommendation for your next session:**
  Propose this distinction: **"History is what we know; Memory is who we are."**
  Ask the group: *"Can we agree that a community has a right to protect 'who they are' even when 'what they know' changes, provided they do not lie about the change?"*

  If they agree to that, you have moved from a fight over facts to a negotiation over ethics. That is progress.
