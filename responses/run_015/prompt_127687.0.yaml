      *   *The Core Tension:* Truth (Epistemology) vs. Meaning/Identity (Ethics/Politics).
      *   *The "History" Side:* Focuses on *accuracy* as the primary virtue. They view history as a corrective discipline. Their fear is *falsehood becoming dogma*.
      *   *The "Memory" Side:* Focuses on *function* and *justice*. They view memory as a tool for survival/identity. Their fear is *epistemic violence/erasure*.
      *   *The Impasse:* They are talking past each other because they are prioritizing different *goods*. One prioritizes the *True*, the other prioritizes the *Good* (or the *Just*).

