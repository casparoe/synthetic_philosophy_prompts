          *   *Concept:* "Cost of Abandonment" isn't sunk cost; it's a *future* cost (reputation, morale, loss of specific capital).
          *   *Distinction:* *Allocative Rationality* (resource distribution) vs. *Constitutive Rationality* (building an agent capable of acting over time).
      *   *Section 4: Concrete Implications.*
