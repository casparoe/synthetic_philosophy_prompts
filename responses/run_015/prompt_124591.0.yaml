answer: |-
  This is a profound observation that cuts to the heart of the conflict between **normative decision theory** and **organizational sociology**. You have identified a structural hypocrisy: institutions preach *synchronic rationality* (optimize from this moment forward) while practicing *diachronic rationality* (maintain coherence across time).

  Here is an analysis of the philosophical conceptions underlying these logics, a proposal for their reconciliation, and the concrete institutional changes that would follow if we treated the persistence logic as a feature rather than a bug.

  ### 1. The Stopping-Rule Framework: Synchronic Consequentialism

  The formal framework governing gate reviews and futility analyses presupposes a specific, narrow conception of practical rationality derived from neoclassical economics and analytic decision theory (e.g., von Neumann–Morgenstern, Savage).

  *   **Philosophical Basis:** **Act Consequentialism.** The rationality of an action is determined solely by the value of its future consequences.
  *   **View of Time:** **Synchronic.** The decision-maker is treated as a "time-slice" agent. The agent at $t_2$ has no normative tie to the agent at $t_1$ other than causal continuity.
  *   **View of Value:** **State-Based.** Value resides in outcomes (health improvements, ROI). Effort is purely a cost (disutility) to be minimized.
  *   **The Sunk Cost Norm:** This framework treats past expenditure as *causally inert*. Because the resources are irrecoverable, weighting them violates the **Independence Axiom** of rational choice. To honor them is to allow a "normatively irrelevant" state of the world to influence the maximization of future utility.

  **Limitation:** This view assumes the agent is interchangeable and that the only costs are material. It ignores the *cost of discontinuity*.

  ### 2. The Persistence Logic: Diachronic Agency and Narrative Value

  The structural reward for persistence (finishing the trial, saving the brownfield project) presupposes a richer, more complex view of agency and value. It suggests that rationality is not just about outcome maximization but about **agent-constitution**.

  *   **Philosophical Basis:** **Planning Theory of Intention (Michael Bratman) & Narrative Ethics (Alasdair MacIntyre).**
      *   **Bratman:** Rational agents are planning agents. Stability of intention is a virtue, not a bias. Constant re-evaluation (as the stopping rule demands) incurs cognitive and coordination costs. Persistence preserves the *capacity to act* over time.
      *   **MacIntyre/Williams:** Human (and organizational) life has a narrative structure. Abandoning a project prematurely fractures the narrative unity of the organization. It renders past actions meaningless rather than chapters in a larger story.
  *   **View of Value:** **Constitutive.** Effort is not just a cost; it is an investment in *identity* and *capability*. The engineering labor consumed isn't just gone; it has transformed the team into "the team that knows this system." Abandoning the project wastes not just the money, but the *specific human capital* and *relational trust* built during the spend.
  *   **View of Obligation:** **Relational/Deontological.** There is a duty to the "prior self" (or prior administration) and to the stakeholders (patients, engineers) who were recruited under a promise of completion. In clinical trials, stopping for futility can be seen as a betrayal of the social contract with participants who assumed risk for potential knowledge gain; finishing the trial honors their contribution even if the hypothesis fails.

  ### 3. Reconciliation: Second-Order Rationality

  Are these logics in tension? **Yes, at the first order. No, at the second order.**

  The tension arises because the formal rules optimize for **Allocative Efficiency** (where should the next dollar go?), while the structural incentives optimize for **Organizational Reliability** (will this entity be capable of executing long-term plans?).

  We can reconcile them by distinguishing between **First-Order Sunk Costs** (money spent) and **Second-Order Abandonment Costs** (future penalties incurred by quitting).

  *   **The Unified Account:** The persistence instinct is not necessarily a fallacy regarding the *past money*; it is a rational heuristic regarding *future reputation, morale, and option value*.
      *   **Reputation:** An organization that quits easily signals low confidence, raising its cost of capital for future greenfield projects.
      *   **Morale:** Habitual termination creates a culture of risk-aversion where employees sandbag estimates to avoid future cuts.
      *   **Option Value:** A brownfield project, even with low NPV, may hold "real options" (technology spillovers, regulatory positioning) that a greenfield project does not.

  Therefore, the "persistence logic" is compatible with forward-looking rationality **if and only if** the model expands to include the *future costs of abandonment* (reputational, psychological, strategic) as negative utilities in the calculation. The error lies not in caring about the past, but in failing to quantify the *future consequences of disrespecting the past*.

  ### 4. Concrete Institutional Changes

  If we stop treating persistence purely as a cognitive bias and acknowledge it as a mechanism for sustaining diachronic agency, we must redesign the institutions. We cannot simply tell people to "ignore sunk costs" while rewarding completion. We must make the implicit values explicit.

  #### A. Rewriting Futility-Stopping Rules
  Current rules trigger stops when $P(\text{success} | \text{data}) < \text{threshold}$.
  **Proposed Change:** Incorporate an **Abandonment Penalty Function**.
  *   The stopping rule should not compare $NPV_{\text{continue}}$ vs. $0$.
  *   It should compare $NPV_{\text{continue}}$ vs. $Cost_{\text{abandonment}}$.
  *   $Cost_{\text{abandonment}}$ must include quantified estimates of reputational damage, team dissolution costs, and loss of specific institutional knowledge.
  *   *Result:* Some projects with near-zero conditional power would rationally continue to completion because the *value of the completed negative result* (preserving organizational integrity) outweighs the cost of the remaining run.

  #### B. Allocating Scientific and Professional Credit
  Currently, credit is heavily skewed toward *positive* outcomes. A completed trial with a null result is often viewed as a waste, but an abandoned trial is viewed as a failure.
  **Proposed Change:** **Credit for Completion, Not Just Discovery.**
  *   **Clinical Trials:** Create a tiered credit system. A "Completed Null" should grant more career capital than an "Early Stop for Futility." This aligns the incentive with the narrative value of seeing commitments through.
  *   **Capital Projects:** Distinguish between "Strategic Termination" (killed at gate due to new info) and "Drift Termination" (killed due to budget overrun). Reward managers who deliver brownfield projects on time, even if the NPV is lower than a theoretical greenfield alternative, acknowledging the *execution risk premium* they managed.

  #### C. Designing Review-Board Incentives
  Gate review boards currently act as "capital allocators." They should also act as "stewards of organizational coherence."
  **Proposed Change:** **Dual-Mandate Charters.**
  *   Review boards should have explicit metrics for **Portfolio Coherence**. If a board kills too many brownfield projects in favor of greenfield, they may be optimizing for short-term NPV while degrading long-term organizational memory.
  *   Implement a **"Sunk Cost Audit"**: When a project is killed, the board must explicitly document whether the decision was driven by *future prospects* or *past expenditure*. Paradoxically, by forcing them to justify that they *aren't* ignoring the past (i.e., acknowledging the cost of abandonment), you reduce the hidden bias.

  #### D. Accounting for "Organizational Learning"
  **Proposed Change:** **Capitalize Failed Effort.**
  *   In capital accounting, R&D is often expensed immediately. If we accept the persistence logic, a portion of the expenditure on a failed project should be capitalized as "Organizational Learning Asset."
  *   This signals that the labor was not wasted but converted into institutional capability, reducing the pressure to treat the project as a "loss" that needs to be cut to stop the bleeding.

  ### Summary

  The tension you observe is not merely a failure of implementation; it is a clash between **Synchronic Consequentialism** (the logic of the spreadsheet) and **Diachronic Integrity** (the logic of the institution).

  The formal rules assume the institution is a **resource processor** that should always route inputs to the highest-yield output. The structural incentives reveal that the institution is actually a **moral agent** that must maintain its identity, promises, and capabilities over time.

  To resolve this, we should not try to engineer away the persistence instinct. Instead, we must **formalize the value of persistence.** By explicitly pricing the "cost of abandonment" and rewarding "completed nulls," we can align the formal stopping rules with the deep structural need for narrative coherence, turning a cognitive bias into a governed strategic asset.
