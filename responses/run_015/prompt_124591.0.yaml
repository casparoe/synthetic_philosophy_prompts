      *   *Section 2: The Persistence Logic.* Identify it as *Planning Agency/Deontological/Narrative*. Reference Bratman (planning theory), Williams (integrity), or MacIntyre (narrative unity). The past creates *obligations* or *identity*.
      *   *Section 3: Reconciliation.* Is it a bug or a feature?
