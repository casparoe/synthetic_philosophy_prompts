prompt: |-
  I've been trying to make sense of a tension in how institutions treat past investment. Adaptive clinical-trial protocols and large-scale capital-project gate reviews both embed explicit decision rules that treat prior expenditure as normatively irrelevant—evaluators are instructed to weigh only future costs and benefits, and honoring sunk costs is classified as a cognitive bias to be engineered away. Yet the same institutions structurally reward persistence: a trial that has already enrolled hundreds of subjects faces strong organizational pressure to reach its endpoint even when conditional power is near zero, and a capital project that has consumed years of engineering labor survives a gate review far more easily than a greenfield proposal with an identical net present value. What philosophical conception of practical rationality does the formal stopping-rule framework presuppose—does it require that only future-oriented states carry normative weight, or is it compatible with views on which past commitments generate present obligations? Conversely, what view of value or agency does the persistence-rewarding structure presuppose—perhaps that rationality includes maintaining diachronic or narrative coherence, that prior effort can partly constitute present value, or that abandoning a course of action can wrong the prior self who initiated it? Are these two institutional logics genuinely in tension, or can a unified account—say, one that distinguishes individual from collective rationality, or first-person from third-person evaluation—reconcile them? And if we took the persistence logic seriously rather than treating it purely as a failure mode, what concrete changes would have to follow in how we write futility-stopping rules, allocate scientific credit, or design review-board incentives?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Tension:** Institutions formally endorse *sunk cost fallacy* avoidance (forward-looking rationality) in rules (clinical trials, capital projects) but informally/structurally reward *persistence* (backward-looking commitment) in practice (pressure to finish trials, preference for brownfield over greenfield).
      *   **Question 1 (Philosophical Conception of Stopping Rules):** What view of practical rationality underlies the formal "ignore sunk costs" framework? (Future-oriented states only? Compatible with past commitments?)
      *   **Question 2 (Philosophical Conception of Persistence):** What view of value/agency underlies the structural reward for persistence? (Diachronic coherence? Effort constituting value? Wronging the prior self?)
      *   **Question 3 (Reconciliation):** Are these logics genuinely in tension, or can they be unified (individual vs. collective, first-person vs. third-person)?
      *   **Question 4 (Practical Implications):** If we take the persistence logic seriously (not just as bias), what concrete changes would follow in stopping rules, credit allocation, or incentives?

  2.  **Analyze Question 1: The Stopping-Rule Framework:**

      *   *Standard View:* Neoclassical economics, decision theory (Savage, Jeffrey). Rationality = Expected Utility Maximization. Only *causal* consequences matter. Past costs are causally inert regarding future outcomes.
      *   *Philosophical Label:* Consequentialism (specifically Act Consequentialism in the moment), Forward-Looking Rationality.
      *   *Nuance:* Does it *require* only future states? Mostly yes, *unless* past commitments create *new* future costs (e.g., reputation loss, contractual penalties). But the *expenditure itself* is irrelevant.
      *   *Key Concept:* "Sunk Cost Fallacy" is defined as letting irrecoverable costs influence decisions.

  3.  **Analyze Question 2: The Persistence-Rewarding Structure:**

      *   *Why does it happen?*
          *   *Reputation/Signaling:* Quitting signals incompetence or lack of grit.
          *   *Organizational Memory:* Brownfield projects have established coalitions, knowledge, and momentum.
          *   *Narrative Identity:* Organizations (like individuals) want a coherent story. Abandonment breaks the narrative.
          *   *Moral/Deontological:* "We started this, we owe it to the team/participants to finish."
      *   *Philosophical Label:*
          *   *Diachronic Rationality:* Bratman's planning theory (stability of intention).
          *   *Constitutive Value:* Effort isn't just a cost; it's an investment in *identity* or *capability*.
          *   *Relational Ethics:* Obligations to past selves or stakeholders (patients, engineers).

  4.  **Analyze Question 3: Reconciliation (Tension vs. Unity):**

      *   *Are they in tension?* Yes, at the level of *decision criteria*. No, at the level of *systemic function*.
      *   *Possible Unifications:*
          *   *Principal-Agent Problem:* The "rational" rule is for the principal (shareholders/patients), the "persistence" is the agent's (managers/researchers) survival strategy.
          *   *Two-Level Utilitarianism:* Rule utilitarianism (follow stopping rules generally) vs. Act utilitarianism (sometimes persistence pays off due to hidden variables).
          *   *Option Value:* Persistence keeps the *option* alive, which has value not captured in simple NPV.
          *   *Collective vs. Individual:* Individual rationality says quit; Collective rationality says maintain morale/capability.
      *   *Best Fit:* A distinction between *allocative efficiency* (stopping rules) and *organizational capability/reliability* (persistence).

  5.  **Analyze Question 4: Concrete Changes if Persistence is Valid:**

      *   *If persistence isn't a bias but a value:*
          *   *Stopping Rules:* Need "completion bonuses" or weighted thresholds. Futility analysis must include "cost of abandonment" (morale, reputation).
          *   *Credit:* Credit for "negative results" needs to equal credit for "positive results" *only if* stopped early. If finished, credit for completion regardless of outcome.
          *   *Incentives:* Review boards need metrics for "strategic pivots" vs. "quitting."
          *   *Accounting:* Capitalize "organizational learning" from failed projects.

  6.  **Drafting the Response (Iterative Refinement):**

      *   *Introduction:* Acknowledge the depth of the observation. It's a clash between *decision theory* and *organizational sociology/ethics*.
