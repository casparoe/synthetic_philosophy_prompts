answer: |-
  ### Desiderata for a Formal Account of Heuristic Estimation

  **1. Requirement: Local Correction Principle**
  *   **Requirement:** The estimator must adjust naive independence probabilities by a factor derived from local modular constraints (the singular series), and this factor must be computable from the congruence properties of the definition alone.
  *   **Motivating Case:** The Twin Prime Conjecture. The naive model treats $n$ and $n+2$ being prime as independent events with probability $1/\log n$, yielding $\int^x dt/(\log t)^2$. This fails to match data. The Hardy–Littlewood conjecture introduces the constant $2\Pi_2 \approx 1.32$, derived from the product over primes $p$ of $(1 - \nu_p/p)/(1-1/p)^2$, where $\nu_p$ is the number of distinct residues of $\{0, 2\}$ mod $p$. A framework that cannot derive $2\Pi_2$ from the definition of "twin prime" without fitting to data is merely curve-fitting, not heuristic estimation.
  *   **Label:** **Non-negotiable** (Analytic Number Theorists). Without this, the framework cannot distinguish between a correct heuristic and a wrong one that happens to fit current data.

  **2. Requirement: Global Obstruction Sensitivity**
  *   **Requirement:** The estimator must output probability 0 (or "false") when a global arithmetic obstruction exists, even if all local densities are positive and the independence presumption suggests a positive count.
  *   **Motivating Case:** The Brauer–Manin Obstruction. There exist varieties (e.g., certain diagonal cubic surfaces) that have points over $\mathbb{R}$ and over $\mathbb{Q}_p$ for all $p$ (local solubility), implying a positive product of local densities, yet have no rational points globally. A heuristic based solely on multiplying local probabilities predicts existence; a successful framework must recognize that the adelic product formula is insufficient when the Brauer group is non-trivial.
  *   **Label:** **Non-negotiable** (Automated System Trust). An agent relying on the estimator must not be led to search for objects that provably do not exist.

  **3. Requirement: Measure Specification**
  *   **Requirement:** The estimator must explicitly specify the measure space over which the expectation is taken; it cannot default to uniform counting measure when structural automorphisms suggest otherwise.
  *   **Motivating Case:** Cohen–Lenstra Heuristics for class groups. If one assumes a uniform distribution on imaginary quadratic fields, the prediction for the distribution of class groups fails. The correct heuristic weights each group $A$ by $1/|\text{Aut}(A)|$. A framework that does not require the agent to justify the measure (e.g., via symmetry arguments) allows arbitrary tuning of the "natural" distribution.
  *   **Label:** **Negotiable** (Logicians). One could argue the measure is part of the "background information," but making it an explicit output requirement forces semantic clarity.

  **4. Requirement: Representation Invariance (Coherence)**
  *   **Requirement:** The estimate assigned to a proposition $P$ must be identical to the estimate assigned to any proposition $Q$ such that $P \leftrightarrow Q$ is true in the background structure, regardless of syntactic complexity.
  *   **Motivating Case:** Sparse Sequences ($n!+1$). Consider the claim "$n!+1$ is prime." Syntactically, this looks like testing a random integer of size $n!$. But logically, it is equivalent to "no prime $p \le n$ divides $n!+1$." A naive independence model treats divisibility by $p$ as independent events. A coherent estimator must recognize that the construction *forces* non-divisibility for $p \le n$, drastically altering the probability compared to a random integer. If the estimate changes based on whether the input is "$n!+1$" or "the unique integer $k < (n+1)!$ such that $k \equiv 1 \pmod m$ for all $m \le n+1$," the framework is processing syntax, not mathematics.
  *   **Label:** **Non-negotiable** (Logicians). This is the definition of a semantic account rather than a syntactic trick.

  **5. Requirement: Falsifiability by Irregularity**
  *   **Requirement:** There must be a criterion for when a theorem refutes a heuristic, distinct from merely requiring a parameter update.
  *   **Motivating Case:** Maier's Theorem vs. Cramér's Model. Cramér's model predicts primes in short intervals $[x, x + \log^2 x]$ behave like a Poisson process. Maier proved that the distribution oscillates irregularly, contradicting the model's variance predictions. Granville's modification fixes the constant but retains the probabilistic structure. A framework must distinguish between a model that is "wrong but useful" (needs constant tweak) and "structurally false" (independence assumption violates known correlation theorems).
  *   **Label:** **Preference** (Analytic Number Theorists). Practitioners often keep "broken" models if they predict the main term correctly, but a formal account of *truth* requires this distinction.

  **6. Requirement: Non-Triviality on Finite Domains**
  *   **Requirement:** The estimator must provide distinct confidence levels for claims where verification is computationally infeasible, without collapsing to 0 or 1.
  *   **Motivating Case:** Finiteness of Fermat Primes. There are only 5 known. The heuristic sum $\sum 2^{-2^n}$ converges rapidly. The framework must assign a high probability to "no more exist" without being able to check $2^{2^{33}} + 1$. If the framework requires verification to assign probability $<1$, it offers no value; if it assigns 1 arbitrarily, it is dogmatic.
  *   **Label:** **Non-negotiable** (Automated System Trust). This is the primary use-case for an estimator: deciding where to allocate resources when proof is absent.

  **7. Requirement: Structural Analogy Accommodation**
  *   **Requirement:** The framework must allow warrants based on spectral or structural isomorphism, not just probabilistic independence.
  *   **Motivating Case:** Random Matrix Theory (RMT) for Zeta Moments. The prediction for $\int |Z(1/2+it)|^{2k} dt$ relies on the analogy between zeros of zeta and eigenvalues of unitary matrices. There is no "independence of primes" argument here; the warrant is universality of symmetry classes. A framework restricted to independence presumptions cannot formalize this successful heuristic.
  *   **Label:** **Preference** (Analytic Number Theorists). Excluding this limits the scope, but including it complicates the "presumption of independence" engine significantly.

  ***

  ### Impossibility Result: Coherence vs. Non-Omniscience

  I assert that **Requirement 4 (Representation Invariance)** and **Requirement 6 (Non-Triviality)** cannot be jointly satisfied by any computable procedure that relies on the **Presumption of Independence**.

  **The Argument:**
  Representation Invariance demands that if $A \leftrightarrow B$ is a truth in the background structure (e.g., Peano Arithmetic), then $Estimate(A) = Estimate(B)$. The Presumption of Independence functions by decomposing a complex claim $A$ into simpler components $A_1, \dots, A_n$ and assuming $P(\bigwedge A_i) = \prod P(A_i)$ absent specific correlation data.

  Consider the claim $C$: "$n$ is prime."
  Reformulation $C'$: "$n$ is not divisible by any $k \in \{2, \dots, \sqrt{n}\}$."
  In the "prime" syntax, the heuristic might treat primality as a random property with density $1/\log n$. In the "divisibility" syntax, $C'$ is a conjunction of deterministic constraints.
  If the estimator is Representation Invariant, it must recognize that $C$ and $C'$ are the same object. To do so, it must know that the "random property" view is logically equivalent to the "deterministic constraint" view.
  However, recognizing logical equivalence in arithmetic is undecidable. If the estimator is computable, there will exist pairs $(A, B)$ where $A \leftrightarrow B$ is true but the estimator fails to recognize it. Consequently, it will assign $Estimate(A) \neq Estimate(B)$, violating Invariance.
  To satisfy Invariance, the estimator must be logically omniscient (able to decide all equivalences). If it is logically omniscient, it can determine the truth value of any decidable claim (like primality for fixed $n$). If it determines the truth value, the estimate collapses to 0 or 1.
  This violates Non-Triviality (which requires estimates strictly between 0 and 1 for unverified claims).
  Therefore, you cannot have a **computable**, **coherent**, **non-trivial** heuristic estimator. You must sacrifice coherence (allow syntax-dependence) or non-triviality (become an oracle).

  ***

  ### Coherence and Probability Interpretation

  **Coherence Conditions:**
  Standard coherence (no Dutch books, additivity) implies that the probabilities behave as if they are measures on a sample space. In the context of fixed integers, this sample space cannot be physical (there is no chance). It must be **epistemic**: the probability represents the agent's degree of belief given limited computational resources. However, standard Bayesian coherence assumes logical omniscience (you cannot bet on $A$ and $\neg A$ differently). As shown above, enforcing this forces the estimator to solve the math problems it is meant to estimate. Thus, a "resource-bounded coherence" is required, which technically violates the axioms of probability theory (e.g., $P(A \land B)$ may not equal $P(A)P(B)$ even if $A \to B$ is unknown).

  **Meaning of Probability:**
  The probabilities in this framework are **pseudo-random densities interpreted as credences**. They are not frequencies (the integers do not repeat). They are not objective chances (the structure is fixed). They are a quantification of the *lack of known obstruction*. When the framework outputs $0.7$, it means "given the local constraints and the absence of known global correlations, a rational agent with bounded computation should act as if the truth value is determined by a coin with this bias."

  ***

  ### The Killer Requirement

  **Representation Invariance** is the single requirement that does the most to exclude candidate frameworks.
  It excludes **Concrete Random Models** (like Cramér's) because they are inherently syntax-dependent: they model $n$ as a random integer, but fail to model $n$ defined by a specific polynomial construction unless that construction is explicitly fed into the model's correlation engine. It excludes **Working Practice** because number theorists routinely use different heuristics for the same object depending on which representation makes the calculation tractable (e.g., treating a sequence as random vs. treating it as a polynomial image). Only a **Logical Omniscient** system satisfies this, which is not an estimator.

  ***

  ### Verdict on Candidate Families

  **Concrete Random Models (Cramér Tradition)**
  These models fail the **Global Obstruction Sensitivity** and **Representation Invariance** requirements. They are excellent at generating conjectures for "generic" behavior but collapse when the arithmetic structure imposes non-probabilistic constraints (like Brauer-Manin or Maier's irregularities). They are useful tools for discovery but cannot serve as a formal account of justification.

  **Formal Coherence-Based Approaches**
  These satisfy **Representation Invariance** only by becoming computationally intractable or collapsing into proof. They succeed in defining what the probabilities *mean* (epistemic states) but fail the **Non-Triviality** requirement for any non-trivial mathematics, as coherence forces logical omniscience. They are theoretically robust but practically vacuous for estimation.

  **Working Mathematician's Practice**
  This approach satisfies **Local Correction** and **Non-Triviality** but explicitly rejects **Representation Invariance** and **Formal Semantics**. It relies on the expert's intuition to select the correct "random model" for the representation at hand. It is the only method that produces correct conjectures in hard cases, but it cannot be formalized into an automated agent without encoding the expert's ability to detect hidden structure.

  ***

  ### Context Dependence

  This list depends heavily on the purpose of **trusting an automated agent**. If the goal were merely **organizing expert practice**, **Representation Invariance** would drop out entirely. Experts accept that different representations yield different heuristic insights and reconcile them manually. The demand for a single, consistent number for a claim regardless of syntax is a demand of *formal verification*, not *mathematical discovery*. Similarly, **Global Obstruction Sensitivity** becomes a preference rather than a requirement; in practice, a heuristic that misses a Brauer-Manin obstruction is still considered "good" if it correctly predicts the density for varieties where no obstruction exists, whereas an automated agent must not fail silently.
