prompt: |-
  Hey — I'm TAing an intro epistemology seminar this term and I want a handout for next week's class on the new riddle of induction: a decision tree that walks someone from "every emerald anyone has examined has been green, and therefore also grue" down to a named position about what to do with that. The problem is that every version I sketch turns into a list of labelled views with a blurb each, so please build it the other way round: start from the questions that actually carve up the logical space, list the answer combinations those questions allow, then locate the positions in the leaves, and at each unoccupied leaf say in a line whether nobody lives there because the view is incoherent, just unattractive, or merely unexplored.

  The branch questions have to be answerable cold by a first-year who has never heard the labels — no node may contain a philosopher's name or ask something like "is projectibility a matter of entrenchment?" Route the tree through at least these cases: (1) ordinary grue with the switch point at a future date; (2) a grue-style predicate with the switch point set in the past, so the evidence base is already mixed — emeralds examined before the switch came out one way and those examined after came out the other; (3) a version where the index is spatial rather than temporal, e.g. green if examined north of the equator and blue if south; (4) a version where the switch is tied to an event nobody thinks has anything to do with emerald colour, like the first crewed landing on Mars; (5) a predicate whose switch point applies to a property we already have independent physics about, so the disagreement isn't really about the evidence — think "negatively charged if examined before 2050, neutral if after" said of electrons; (6) a community whose scientific vocabulary has only the grue-family predicates as primitives and no plain colour words, and the question of whether there is a fact of the matter about whether they are projecting wrongly; (7) the meta-move that we should trust induction because it has worked so far, with the sub-question of whether that settles the riddle or just restates Hume's. Half my students are CS majors and they get the point faster from ten data points with three candidate curves through them than from emeralds, so put the curve-fitting version in as one node too, and tell me in a line whether the tree's verdict for the curve case comes out the same as for the emerald case — I suspect it doesn't and I want to see exactly where they come apart.

  Keep it to at most 7 branch questions and 8 to 10 leaves. Among the leaves I want, at minimum: entrenchment-style views on which projectibility is fixed by our actual practice; views on which the grue-family predicates fail because they aren't natural kinds or aren't causally relevant; views on which it comes down to a simplicity prior over hypotheses; a reliabilist or externalist view on which the right predicates are whichever ones our methods in fact track; a deflationary leaf saying the riddle is really just Hume's problem and adds nothing; and a leaf for someone who thinks the whole thing is a puzzle about language rather than about the world. Give each leaf a one-sentence statement of its most awkward commitment, and flag any pair of leaves your tree can't really separate instead of pretending it can. I'll be projecting this from my own notes offline, so don't pad it with references or further reading — I want the arguments themselves.
