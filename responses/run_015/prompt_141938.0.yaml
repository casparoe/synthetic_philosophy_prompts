answer: |-
  Here is the translation of your puzzles into your native vocabulary, followed by the residue report and an argument against your hypotheses.

  ### The Setup in Causal/ML Terms

  Model both puzzles as a single-step Partially Observable MDP (POMDP) with a specific reward function $R(s, a, \hat{\pi})$ that depends on a predictor $\hat{\pi}$.
  Let $\theta$ be your policy parameters. The predictor $\hat{\pi}$ is a frozen model trained to minimize loss on $\pi_{\theta_{v1}}$. You are $\pi_{\theta_{v2}}$.
  The environment generates a context $C$ (Coin or Disaster). The predictor outputs $\hat{A} = \hat{\pi}(C)$. You observe $O$ (subset of $C$ and predictor output) and choose $A = \pi_{\theta_{v2}}(O)$.

  **Counterfactual Mugging:** $C \sim \text{Bernoulli}(0.5)$. $O = \{C\}$.
  Reward: $R = \mathbb{I}(C=H) \cdot 10000 \cdot \mathbb{I}(\hat{A}=Pay) - \mathbb{I}(C=T) \cdot 100 \cdot \mathbb{I}(A=Pay)$.
  You observe $C=T$.
  **XOR Blackmail:** $C \sim \text{Bernoulli}(0.01)$ (Disaster). Letter $L = (C \oplus (\hat{A}=Pay))$.
  Reward: $R = -10^6 \cdot \mathbb{I}(C=Disaster) - 1000 \cdot \mathbb{I}(A=Pay)$.
  You observe $L=True$.

  ### The Prescriptions as Estimators

  **Causal Decision Theory (CDT):** Estimates value via $do(A)$.
  It constructs a Structural Causal Model (SCM) where the arrow $\theta \to \hat{\pi}$ is cut. $\hat{\pi}$ is treated as fixed context $Z$.
  *Objective:* $\max_a E[R | do(A=a), O]$.
  *Verdict:* In Mugging, $C=T$ is fixed; $H$-branch reward is 0 regardless of $do(A)$. Cost is 100. **Don't Pay.** In Blackmail, $do(A)$ does not cause $C$. $L$ is already true. Paying costs 1k. **Don't Pay.**

  **Evidential Decision Theory (EDT):** Estimates value via conditioning.
  *Objective:* $\max_a E[R | A=a, O]$.
  *Verdict:* In Mugging, conditioning on $A=Pay$ given $C=T$ provides no evidence about $\hat{A}$ in the $H$ branch (since $C$ screens off the correlation). **Don't Pay.** In Blackmail, conditioning on $A=Pay$ given $L=True$ implies $C=Safe$ (due to XOR structure). **Pay.**

  **Functional Decision Theory (FDT):** Estimates value via policy intervention.
  *Objective:* $\max_\theta E[R | do(\pi_\theta)]$, where $\hat{\pi}$ is treated as a deterministic function of $\theta$.
  *Verdict:* Intervening on $\theta$ updates $\hat{\pi}$ simultaneously. In Mugging, $\pi_\theta=Pay$ implies $\hat{\pi}=Pay$, unlocking the $H$-branch reward. **Pay.** In Blackmail, same logic. **Pay.**

  ### The Wrinkles

  **1. The v1/v2 Shift:**
  This is an off-policy evaluation problem with distribution shift. $\hat{\pi}$ is trained on $P_{v1}(A|C)$; you act on $P_{v2}(A|C)$.
  *CDT* assumes overlap is irrelevant because $\hat{\pi}$ is fixed. It treats the predictor as a static covariate.
  *FDT* assumes perfect correlation: $\hat{\pi}(\theta) \approx \pi_\theta$. This violates the standard ML assumption that a frozen model is invariant to deployment-time parameter updates. FDT requires the "frozen" model to logically track your current parameters, implying $\hat{\pi}$ is not a static dataset but a logical implication of your source code.

  **2. Structural Asymmetry:**
  *Mugging:* The payoff branch ($C=H$) has zero support in your logged trajectory ($C=T$). This is extreme extrapolation. Standard Doubly Robust estimators fail without a model of the $H$-branch dynamics.
  *Blackmail:* The observation $L$ is a collider ($C \to L \leftarrow \hat{A}$). Conditioning on $L$ induces a spurious correlation between $C$ and $A$. EDT exploits this correlation; CDT blocks it via $do(A)$.
  The asymmetry is real: Mugging requires model-based extrapolation into zero-support regions; Blackmail requires correcting for selection bias.

  ### Residue Report

  **Clean Maps:**
  *   **EDT/CDT:** Map cleanly to conditioning vs. intervention on action nodes in an SCM.
  *   **Blackmail:** Maps cleanly to collider bias in a causal graph.

  **Distorted Maps:**
  *   **Mugging:** Requires assuming the $H$-branch reward is accessible. CDT discards it as counterfactual; FDT treats it as accessible via logical correlation.
  *   **v1/v2:** ML assumes $\hat{\pi}$ is fixed data. FDT assumes $\hat{\pi}$ is a logical function of current $\theta$. This distorts the standard train/test independence assumption.

  **No Counterpart:**
  *   **Logical Counterfactuals:** Standard SCMs define counterfactuals over *variables* (e.g., $A=1$ vs $A=0$). FDT requires counterfactuals over *functions* (e.g., $\pi()$ returns 1 vs $\pi()$ returns 0). There is no node in your causal graph for "the output of the algorithm running this node."

  ### Argument Against Your Hypotheses

  **Hypothesis 1: "It's just a non-policy-independent MDP."**
  You are half-right. The environment *is* policy-dependent ($P(R|s,a,\pi) \neq P(R|s,a)$). However, the dispute is not merely about relaxing the independence assumption. CDT *can* model policy-dependent environments (e.g., multi-agent games) but insists on treating *your* policy as independent of *predictors* of your policy. CDT posits a causal graph where $\theta \not\to \hat{\pi}$. FDT posits $\theta \to \hat{\pi}$. The fight is ontological: is the predictor a separate causal mechanism (CDT) or a logical subroutine of yours (FDT)? It is not just a misspecified MDP; it is a disagreement about which edges exist in the causal graph.

  **Hypothesis 2: "Counterfactual dependence on decision function output... no statistical machinery can replicate."**
  This is the deeper truth, but slightly misstated. Statistical counterfactual machinery *can* replicate it, provided you expand the ontology. If you add a node $K$ (Source Code) to your SCM, where $K \to \theta$ and $K \to \hat{\pi}$, then intervening on $K$ replicates FDT. The residue is not that the machinery fails, but that standard causal inference forbids intervening on "constants" or "logical facts." Your toolkit assumes variables vary independently across units. FDT assumes logical facts (like $2+2=4$ or the output of a deterministic function) are invariant across physical instantiations. The residue is **logical correlation**: statistical dependence between distinct physical instantiations of the same computation. Your off-policy tools handle *stochastic* overlap; they have no vocabulary for *logical* overlap.

  **Conclusion:**
  The puzzles are not paradoxes of rationality but stress tests for your causal graph. CDT fails because it forbids edges between logically connected nodes. FDT succeeds by treating algorithms as causal primitives. Your ML toolkit can express FDT only if you allow interventions on the "source code" node, treating the predictor not as a frozen model but as a logical implication of your own parameters. The residue is the lack of a formalism for "logical interventions" in standard SCMs.
