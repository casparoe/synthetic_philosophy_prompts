prompt: |-
  I serve as the lead reviewer for safety incidents at a regional rail network that carries mixed freight and passenger traffic. Each month my team reviews roughly eight to twelve near misses and minor harms to determine which factors should be recorded as causes for regulatory reporting and for internal reform.

  Our current practice is unstable. If we use simple counterfactual reasoning alone, almost every omission that would have prevented an outcome gets listed as a cause, from the dispatcher who did not issue an extra warning to the manager who did not schedule additional training two years earlier. If we instead rely on informal judgments about who should have acted, the results vary by reviewer and conflate causal analysis with blame.

  Please provide a reusable decision procedure that my team can apply without training in philosophy, translating the central philosophical difficulty with causation by omission into workable steps: that counterfactual dependence is too permissive on its own, that appeals to norms and reasonable expectations can discipline it but risk turning causal judgments into moral judgments, and that there is a further distinction worth preserving between actively producing an outcome and merely failing to prevent it.

  The procedure should be presented as an ordered checklist or flowchart in words, suitable for use in about forty-five minutes per case by engineers and dispatch supervisors, with final sign off by the operations director. For each step, state the question to be asked, what counts as a sufficient answer given the records typically available to an incident team, where the procedure terminates with a finding of no causation by omission, and where the team must stop and mark the issue as requiring evaluative judgment rather than further factual inquiry. Clearly mark the points where judgment cannot be eliminated and specify the hard cases the procedure must be able to handle, including multiple simultaneous omitters, omissions by automated monitoring systems, and cases where the relevant expectation or duty was vague or contested at the time.

  Then apply the procedure step by step to the following three cases:

  A delayed freight train with degraded brakes enters a downhill section during heavy rain. The dispatcher, who was monitoring three other movements, does not issue a discretionary slow order that was permitted but not required by the rule book. The train overshoots a signal and sideswipes a stabled passenger unit, causing minor injuries. An additional automated advisory that might have prompted the dispatcher was muted for maintenance.

  A track inspector shortens a scheduled walking inspection because of heat restrictions and does not detect a cracked joint bar. Two days later the joint fails under a light passenger service, causing a low speed derailment with no injuries. A second inspector assigned to audit paperwork does not notice that the shortened inspection was recorded as complete.

  A station team does not clear leaves from a rarely used emergency exit stairwell. During an evacuation drill, the exit is found blocked, but the drill completes within the target time using other exits. No harm occurs, although the safety manager argues the omission could have caused deaths under slightly different occupancy.

  Do not adjust the verdicts to fit intuitive expectations about blame. If the procedure yields a result the operations staff will find unwelcome, for example by excluding an omission widely felt to be causal or by including one that spreads responsibility very broadly, retain the result and explain why it follows. Conclude with a brief statement of what the procedure cannot settle and where it is most likely to misfire in future cases.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case analyses:

  1.  **Analyze the Request:**
      *   **Role:** Lead reviewer for safety incidents at a regional rail network (mixed freight/passenger).
      *   **Task:** Create a reusable decision procedure (checklist/flowchart in words) for determining causation by omission in safety incidents.
      *   **Constraints:**
          *   No philosophy training required for users (engineers, dispatch supervisors).
          *   Time limit: ~45 minutes per case.
          *   Final sign-off: Operations Director.
          *   Must address specific philosophical difficulties: counterfactual dependence (too permissive), norms/expectations (risk of moralizing), act vs. omission distinction.
          *   Must handle hard cases: multiple omitters, automated systems, vague/contested duties.
          *   Must mark where judgment is unavoidable.
          *   Must apply the procedure to three specific cases (Dispatcher/Brakes, Inspector/Track, Station/Leaves).
          *   **Crucial:** Do not adjust verdicts to fit intuitive blame. If the result is unwelcome, keep it and explain why.
          *   Conclusion: Limitations and potential failure points of the procedure.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Problem 1: Counterfactual Dependence.* "If X hadn't happened, Y wouldn't have." For omissions: "If A had acted, B wouldn't have happened." This leads to infinite regress (why didn't the CEO hire more staff?).
      *   *Problem 2: Normative Constraints.* We need to limit *which* omissions count. Usually, we look at duties or norms. But this risks conflating "caused" with "is to blame."
      *   *Problem 3: Act vs. Omission.* There's a physical difference between pushing a train (act) and not stopping it (omission). The procedure needs to acknowledge this without getting bogged down in metaphysics.
      *   *Solution Strategy:* A "Filtered Counterfactual" approach.
          1.  Establish factual counterfactual dependence (Would the action have prevented the harm?).
          2.  Apply a "Duty/Capability Filter" (Was there a specific, existing obligation and capability at the time?).
          3.  Apply a "Proximity/Salience Filter" (Was this the most direct control point?).
          4.  Distinguish "Causal Factor" from "Root Cause/Blame."

  3.  **Drafting the Procedure (The "Omission Causality Protocol" - OCP):**
      *   *Goal:* Make it operational, not theoretical.
      *   *Structure:* Sequential steps with Stop/Go conditions.
      *   *Step 1: Factual Counterfactual.* Did the omission make a difference? (Evidence: logs, simulations).
      *   *Step 2: Specific Duty.* Was there a written rule or explicit order *at the time*? (Avoids "should have known").
      *   *Step 3: Capability.* Could they actually have done it? (Physical/Operational feasibility).
      *   *Step 4: Salience/Intervention Point.* Is this the most immediate control? (Handles the "manager 2 years ago" problem).
      *   *Step 5: Automated Systems.* Treat system failure as an omission by the maintainer/designer if duty exists.
      *   *Step 6: Multiple Omitters.* Allow multiple causes but rank by immediacy.
      *   *Judgment Points:* Clearly flag where human discretion is needed (e.g., interpreting vague rules).

  4.  **Refining the Procedure for the User's Constraints:**
      *   Need to explicitly address the "act vs. omission" distinction. I'll add a classification step.
      *   Need to address the "norms vs. blame" risk. I'll frame the duty check as "Documented Expectation" rather than "Moral Obligation."
      *   Need to ensure it fits the 45-minute window. Keep questions binary where possible.
      *   Need to handle the "vague duty" hard case.

  5.  **Applying the Procedure to the Cases:**

      *   *Case 1: Dispatcher/Brakes/Rain.*
          *   Counterfactual: Yes, slow order likely prevents overshoot.
          *   Duty: Rule book says "permitted but not required." This is the tricky part. Is a discretion a duty? Usually no.
          *   Capability: Yes, dispatcher had authority.
          *   Salience: High.
          *   *Verdict:* Likely *not* a causal omission under strict duty rules, but might flag as "System Vulnerability." Wait, the prompt says "Do not adjust verdicts to fit intuitive expectations." If the rule says "not required," strict adherence says no duty. But safety culture often expects discretion. I need to be careful here. If I define duty strictly as "mandatory," the dispatcher is off the hook. If I define it as "standard operating procedure," maybe on the hook. The prompt asks to translate philosophical difficulty into workable steps. The philosophical difficulty is that norms discipline counterfactuals. If the norm is "discretionary," causation by omission is weak. I will rule *No Causal Omission* for the dispatcher regarding the slow order, but *Yes* for the muted advisory (maintenance duty). This might be unwelcome (dispatcher feels blame), but it follows the logic.
          *   *Correction:* The muted advisory is an omission by the maintenance team.
          *   *Refined Verdict:* Dispatcher = No (Discretionary). Maintenance = Yes (System disabled without backup).

      *   *Case 2: Inspector/Track/Heat.*
          *   Counterfactual: Yes, walking inspection would likely find crack.
          *   Duty: Scheduled inspection. Shortened due to heat restrictions. Was shortening allowed? If yes, no duty breach. If no, duty breach. Prompt says "shortens... because of heat restrictions." Implies protocol allowed modification? Or implies violation? Let's assume protocol allowed modification but required annotation. The second inspector (audit) missed the annotation.
          *   *Verdict:* Inspector 1: If heat protocol allows shortening, no omission of duty. If protocol requires *some* inspection and none was done, yes. Let's assume "shortens" means did less than required for that specific track class.
          *   *Audit Inspector:* Duty is to audit paperwork. Paperwork said "complete." If the audit is purely paperwork, they did their job. If the audit implies verifying completion, they omitted.
          *   *Decision:* I need to make a call based on "Documented Expectation." If the rule allows shortening, Inspector 1 is clear. If the rule requires full inspection regardless, Inspector 1 is causal. I will assume for the sake of the exercise that "heat restrictions" imply a known protocol that *permits* shortening, making the omission of the *full* walk not a breach of duty, but the failure to flag the risk might be. Actually, the prompt says "does not detect." If the duty was modified, the non-detection isn't an omission of duty.
          *   *Better angle:* The Audit Inspector. Their duty is to audit paperwork. The paperwork was falsified or misleading. Did they omit checking the *validity*?
          *   *Let's stick to the procedure:* Step 2 (Specific Duty). If the rule book says "Inspectors may shorten walks during Code Red Heat," then Inspector 1 has no causal omission. If the rule says "Must inspect, mitigate heat as possible," then yes. I will assume the former to test the "unwelcome verdict" constraint. If the procedure clears the inspector who shortened the walk, staff might hate it.
          *   *Wait, looking closer:* "Shortens a scheduled walking inspection." Usually, schedules are mandates. If they deviated, was it authorized? "Because of heat restrictions" suggests an external constraint, not necessarily authorization. I will treat this as a *Vague Duty* hard case.
          *   *Audit Inspector:* Duty is "audit paperwork." Paperwork said "complete." They didn't omit checking paperwork. They omitted detecting the lie. Is that a duty?
          *   *Decision:* I will find the First Inspector has a Causal Omission (Duty existed, capability existed, deviation caused non-detection). The Audit Inspector: No Causal Omission (Duty was paperwork, paperwork was superficially compliant). This highlights the "multiple omitters" issue.

      *   *Case 3: Station/Leaves/Drill.*
          *   Counterfactual: If leaves cleared, exit usable.
          *   Harm: No harm occurred (Drill completed via other exits).
          *   *Crucial:* Causation requires an outcome. "Could have caused deaths" is counterfactual harm, not actual harm.
          *   *Verdict:* No Causal Omission regarding *harm* because no harm occurred. It is a "Potential Risk," not a "Cause of Incident." This is a strict philosophical distinction (causation requires effect). This will be unwelcome to the Safety Manager.

  6.  **Reviewing against Constraints:**
      *   *45 mins?* Yes, checklist is short.
      *   *No philosophy training?* Language must be plain English.
      *   *Hard cases?* Addressed in the procedure notes.
      *   *Unwelcome verdicts?* Case 1 (Dispatcher cleared), Case 3 (No cause because no harm) are good candidates for this.
      *   *Sign-off?* Included in procedure.

  7.  **Final Polish:**
      *   Ensure the distinction between "Causal Factor" (for reporting) and "Blame" (for HR) is clear.
      *   Make sure the "Judgment Required" flags are prominent.
      *   Check the tone: Professional, operational, rigorous.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe the dispatcher *is* causal because they *could* have acted.
      *   *Correction:* The prompt specifically warns against "simple counterfactual reasoning alone." I must apply the "Norm/Duty" filter. If the rule says "permitted but not required," the norm does not establish a duty. Therefore, philosophically, it's not a causal *omission* in a normative sense, even if counterfactually relevant. I must stick to this to demonstrate the procedure's integrity, even if it feels wrong to laypeople.
      *   *Case 3:* The prompt says "No harm occurs." Causation implies an effect. If there is no harm, there is no cause of harm. There is only a cause of *risk*. I must be strict here. The procedure is for "safety incidents" (which usually implies harm or near miss). The prompt intro says "near misses and minor harms." A blocked exit in a drill is a near miss? No, it's a deficiency. I will rule it as "Not a Causal Omission for an Incident" but flag as "Latent Condition."

      *(Self-Correction on Case 3)*: The prompt intro says the team reviews "near misses and minor harms." A blocked exit during a drill *is* a safety finding, but is it an "incident" with a "cause"? The Safety Manager argues it "could have caused deaths." The procedure needs to handle *potential* vs *actual*. I will rule that without actual harm or actual operational failure (the drill succeeded), it is not a causal omission for *incident reporting*, but a compliance finding. This distinguishes "Cause of Accident" from "Cause of Vulnerability."

      *(Refining Case 1)*: The muted advisory. This is an omission by the maintenance team (to unmute or provide backup). This *is* a causal omission. The dispatcher's inaction is not. This splits the cause.

      *(Refining Case 2)*: The heat restriction. If the rule book is silent on heat, the duty stands. If the rule book allows modification, duty is modified. I will assume the rule book is silent on *shortening*, making it a violation of duty, hence causal. The auditor: Duty is paperwork. Paperwork looked fine. No causal omission.

      *Wait, one more check on the "Act vs Omission" constraint.* The procedure needs to explicitly distinguish these. I will add a classification step at the beginning.

      *Final check on "Judgment cannot be eliminated".* I need to explicitly state where the Operations Director must step in because the checklist runs out of objective criteria (e.g., interpreting vague rules).

      *Let's write.*
answer: |-
  # Omission Causality Protocol (OCP)
  **Version:** 1.0 | **Authority:** Operations Director | **Estimated Time:** 45 Minutes per Case

  ## Purpose
  To determine whether a failure to act (an omission) should be recorded as a **Causal Factor** in regulatory reporting and internal reform. This procedure distinguishes between *factual relevance* (the action would have helped) and *causal responsibility* (the actor was required and able to act). It separates causal analysis from blame assignment.

  ## Instructions for Review Team
  *   **Team Composition:** Lead Reviewer, Engineering Representative, Dispatch/Operations Supervisor.
  *   **Evidence Required:** Incident logs, rule books, duty rosters, maintenance records, interview transcripts.
  *   **Decision Rule:** If any step results in a **STOP**, the omission is **not** recorded as a Causal Factor for the incident (though it may be recorded as a Latent Condition or Compliance Issue). If all steps are passed, the omission is a **Causal Factor**.
  *   **Judgment Flags:** Steps marked **[JUDGMENT]** require consensus. If consensus fails, escalate to the Operations Director.

  ---

  ## Phase 1: Classification & Factual Baseline
  *Goal: Distinguish acts from omissions and establish counterfactual dependence.*

  **Step 1.1: Act or Omission?**
  *   **Question:** Did the alleged cause involve a physical action that created energy/risk (Act), or a failure to intervene in an existing chain of events (Omission)?
  *   **Sufficient Answer:** "Act" (e.g., train moved too fast) or "Omission" (e.g., signal not set).
  *   **Procedure:** If **Act**, proceed to standard causal analysis. If **Omission**, proceed to Step 1.2.
  *   **Note:** Automated system failures are treated as **Omissions** by the maintenance/design duty-holder unless the system actively injected false data (Act).

  **Step 1.2: Counterfactual Dependence**
  *   **Question:** If the omitted action *had* been performed, would the specific incident outcome (harm or near miss) have been prevented with high probability (>50%)?
  *   **Sufficient Answer:** Yes/No based on simulation, expert testimony, or physical evidence.
  *   **Finding:**
      *   **No:** **STOP.** Not a causal omission. (The action wouldn't have changed the outcome).
      *   **Yes:** Proceed to Step 2.

  ---

  ## Phase 2: Duty & Capability Filter
  *Goal: Restrict infinite counterfactuals by applying documented expectations and physical reality.*

  **Step 2.1: Documented Duty at Time of Incident**
  *   **Question:** Did a written rule, explicit order, or signed procedure *existing at the time of the incident* require this specific action?
  *   **Sufficient Answer:** Citation of Rule Book Section, Maintenance Schedule, or Dispatch Order.
  *   **Hard Case (Discretion):** If the rule says "may" or "permitted" but not "must," the answer is **No**.
  *   **Hard Case (Vague Duty):** If the rule is ambiguous (e.g., "ensure safety"), proceed to Step 2.1[J].
  *   **Finding:**
      *   **No:** **STOP.** Not a causal omission. (This prevents blaming actors for things they were not required to do, even if helpful).
      *   **Yes:** Proceed to Step 2.2.

  **Step 2.1[J]: Interpretation of Vague Duty [JUDGMENT]**
  *   **Question:** Was there a recognized industry standard or established local practice that rendered this vague duty specific enough to be actionable?
  *   **Sufficient Answer:** Consensus agreement by the Review Team.
  *   **Finding:**
      *   **No Consensus:** Escalate to Operations Director. Mark as **Evaluative Judgment Required**.
      *   **Consensus Yes:** Proceed to Step 2.2.
      *   **Consensus No:** **STOP.**

  **Step 2.2: Operational Capability**
  *   **Question:** Did the actor have the physical ability, authority, and information to perform the action *at the moment it was required*?
  *   **Sufficient Answer:** Review of workload logs, system access rights, and visibility records.
  *   **Finding:**
      *   **No:** **STOP.** (e.g., Dispatcher was handling an emergency elsewhere; System was locked out).
      *   **Yes:** Proceed to Phase 3.

  ---

  ## Phase 3: Proximity & Salience
  *Goal: Distinguish between root causes and distant background conditions.*

  **Step 3.1: Immediate Control Point**
  *   **Question:** Is this the most immediate point in the chain of events where human or system intervention could have stopped the outcome?
  *   **Sufficient Answer:** Compare with other omissions. (e.g., Manager didn't train staff 2 years ago vs. Dispatcher didn't slow train now).
  *   **Finding:**
      *   **No:** (A more immediate actor existed). Mark as **Contributing Factor (Latent)** but **STOP** for Causal Factor status.
      *   **Yes:** Proceed to Step 3.2.
  *   **Hard Case (Multiple Omitters):** If multiple actors at the same time layer failed (e.g., two inspectors), **BOTH** pass this step. Do not select only one.

  **Step 3.2: Outcome Requirement**
  *   **Question:** Did actual harm or operational failure occur, or was this a potential risk identified during a successful operation?
  *   **Sufficient Answer:** Incident Report data.
  *   **Finding:**
      *   **No:** (e.g., Drill succeeded despite omission). **STOP.** (Record as Compliance Finding, not Incident Cause).
      *   **Yes:** Proceed to Final Determination.

  ---

  ## Final Determination & Sign-Off

  **Step 4: Causal Status**
  *   **Verdict:** If all steps passed, the omission is recorded as a **Causal Factor**.
  *   **Blame Disclaimer:** This finding indicates a breakdown in the control system, not necessarily individual negligence.
  *   **Sign-Off:** Operations Director must sign off on any case where Step 2.1[J] was invoked or where Step 3.1 excluded a senior management omission.

  ---

  # Application of Procedure to Case Studies

  ## Case 1: Dispatcher, Degraded Brakes, Muted Advisory
  **Incident:** Freight train overshoots signal, sideswipes passenger unit. Minor injuries.
  **Potential Omissions:** (A) Dispatcher did not issue discretionary slow order. (B) Maintenance muted automated advisory.

  **Analysis:**
  *   **Omission A (Dispatcher):**
      *   *Step 1.2 (Counterfactual):* **Yes.** Slow order likely prevents overshoot.
      *   *Step 2.1 (Duty):* **No.** Rule book states slow order was "permitted but not required."
      *   *Verdict:* **STOP.** Not a Causal Factor.
      *   *Reasoning:* Under the OCP, discretion does not equal duty. To rule otherwise conflates causal analysis with moral expectation.
  *   **Omission B (Maintenance/Advisory):**
      *   *Step 1.1 (Classification):* **Omission** (System failure/maintenance).
      *   *Step 1.2 (Counterfactual):* **Yes.** Advisory might have prompted dispatcher.
      *   *Step 2.1 (Duty):* **Yes.** Maintenance schedules require safety systems to be active or have mitigations during maintenance.
      *   *Step 2.2 (Capability):* **Yes.** System could have been left active or backup warning issued.
      *   *Step 3.1 (Proximity):* **Yes.** This was an immediate control layer.
      *   *Verdict:* **Causal Factor.**

  **Final Report:** The muted advisory system is a Causal Factor. The Dispatcher's failure to use discretion is **not** a Causal Factor (though may be a training opportunity).
  **Unwelcome Result:** Dispatch supervisors may feel the dispatcher shares blame. The procedure excludes this because no *duty* existed. This preserves the distinction between "could have" and "should have."

  ## Case 2: Track Inspector, Heat, Audit Failure
  **Incident:** Low speed derailment, no injuries.
  **Potential Omissions:** (A) Inspector shortened walk. (B) Audit Inspector missed paperwork discrepancy.

  **Analysis:**
  *   **Omission A (Track Inspector):**
      *   *Step 1.2 (Counterfactual):* **Yes.** Full walk likely detects crack.
      *   *Step 2.1 (Duty):* **Yes.** Scheduled inspections are mandatory. "Heat restrictions" are environmental conditions, not rule book exemptions unless explicitly codified. (Assuming no specific rule allows shortening).
      *   *Step 2.1[J] (Vague Duty):* If the rule on heat is contested, this requires Judgment. Assuming standard rule: Duty stands.
      *   *Step 2.2 (Capability):* **Yes.** Inspector could have waited for cooler temps or used mitigation.
      *   *Step 3.1 (Proximity):* **Yes.** Most immediate detection point.
      *   *Verdict:* **Causal Factor.**
  *   **Omission B (Audit Inspector):**
      *   *Step 1.2 (Counterfactual):* **Yes.** Catching the error would have stopped the train.
      *   *Step 2.1 (Duty):* **No.** Duty is to "audit paperwork." Paperwork was recorded as "complete." The duty does not explicitly extend to verifying physical truth unless specified.
      *   *Verdict:* **STOP.** Not a Causal Factor.

  **Final Report:** The Track Inspector's omission is a Causal Factor. The Audit Inspector's omission is a **Latent Condition** (System Vulnerability).
  **Unwelcome Result:** This spreads responsibility unevenly. The auditor is cleared despite the system failing. This follows the OCP's strict "Documented Duty" filter to prevent infinite regress into "why didn't the auditor audit the audit?"

  ## Case 3: Station Leaves, Evacuation Drill
  **Incident:** Exit blocked during drill. Drill succeeded via other exits. No harm.
  **Potential Omission:** Station team did not clear leaves.

  **Analysis:**
  *   **Omission (Station Team):**
      *   *Step 1.2 (Counterfactual):* **Yes.** Clearing leaves would have made exit usable.
      *   *Step 2.1 (Duty):* **Yes.** Emergency exits must be clear (Standard Safety Code).
      *   *Step 2.2 (Capability):* **Yes.** Team could have cleared them.
      *   *Step 3.1 (Proximity):* **Yes.**
      *   *Step 3.2 (Outcome Requirement):* **No.** The prompt states "No harm occurs" and "drill completes within target time."
      *   *Verdict:* **STOP.** Not a Causal Factor for an *Incident*.

  **Final Report:** This is recorded as a **Compliance Violation**, not a Causal Factor for a safety incident.
  **Unwelcome Result:** The Safety Manager argues it "could have caused deaths." The OCP rejects this. Causation requires an effect. Without actual harm or operational failure (the drill succeeded), there is no incident to cause. This prevents inflating statistics with "potential" causes that did not manifest.

  ---

  # Limitations and Failure Points

  **What This Procedure Cannot Settlement:**
  1.  **Moral Blame:** The OCP explicitly isolates causal factors from negligence. An employee can be a "Causal Factor" without being "at fault" (e.g., unclear rules), and vice versa. HR disciplinary processes must run parallel to this, not rely on it.
  2.  **Cultural Norms:** If the "Documented Duty" (Step 2.1) is consistently ignored in practice (e.g., everyone shortens inspections in heat), the procedure will identify the individual as causal while missing the systemic normalization of deviance. This requires the Operations Director to review trends, not just single cases.
  3.  **Step 3.2 (Harm Requirement):** In high-reliability organizations, "near misses" are often treated as incidents. If your regulatory body defines "near miss" broadly enough to include the blocked exit drill, Step 3.2 must be adjusted. As written, it requires *operational failure* or *harm*.

  **Where It Is Most Likely to Misfire:**
  1.  **Vague Duties (Step 2.1[J]):** In novel situations (e.g., new technology), rules lag behind reality. The procedure forces a binary Yes/No on duty where none exists. This will require frequent escalation to the Operations Director, creating a bottleneck.
  2.  **Multiple Omitters:** The procedure allows multiple causal factors (Case 2), but operational staff often seek a *single* cause to "fix." The OCP will frequently return "System Failure" rather than "Human Error," which may frustrate teams looking for simple corrective actions.
  3.  **Discretionary Acts:** As seen in Case 1, the procedure exonerates actors who fail to use discretion. In a safety culture that prizes "intervention," this may signal that discretionary safety actions are optional. A parallel "Best Practice" reporting channel is recommended to capture these without labeling them causal failures.
