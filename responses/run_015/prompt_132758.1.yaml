              *   Price gouging has a "exploitation" objection. The "commodification" objection is weaker (water is already a commodity). So the MPC does less work.
              *   *Decision:* Vote Buying (Most), Kidney Sales (Middle), Price Gouging (Least). Why? Because the MPC actually *changes the meaning* of the kidney transaction more effectively than the vote transaction (which is structurally incompatible) or the gouging transaction (where the good is already a commodity).
              *   *Alternative View:* Price gouging is often seen as *less* repugnant than organ sales in libertarian views, but in "repugnant markets" literature (Satz/Sandel), organ sales and vote buying are usually "categorical" prohibitions, whereas price gouging is contextual.
