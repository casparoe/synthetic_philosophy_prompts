          *   *Satz's Framework:* Noxious markets are those that lead to extreme vulnerability or undermine equality. Votes undermine equality most. Kidneys involve vulnerability. Gouging involves vulnerability.
          *   *Sandel's Framework:* Corruption of norms. Votes = Civic norm. Kidneys = Bodily norm. Gouging = Community norm.
          *   *Refining the Rank:*
              1.  Vote Buying (Undermines the foundation of the state).
              2.  Kidney Sales (Undermines bodily integrity, MPC helps slightly).
              3.  Price Gouging (Undermines solidarity, but MPC is least effective/least relevant).
          *   *Actually, let's look at the "Repugnance Score".*
              *   Vote Buying: 9.5 (MPC makes it hypocritical).
