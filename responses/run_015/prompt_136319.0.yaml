answer: |-
  This is a rich tension to explore in a chapter on consciousness models. The split-brain data is often treated as the "smoking gun" for disunity, but how that disunity is interpreted depends entirely on whether you assume unity was the baseline.

  Here is an analysis mapping the Sperry-Gazzaniga experiments onto Dennett's Multiple Drafts Model (MDM), pushing hard on the predictive power of the model and the falsification conditions you requested.

  ---

  ### 1. The Confabulation Event: Central Narrator vs. Promoted Draft

  **The Scenario:** A command ("Walk") is flashed to the Right Hemisphere (RH). The patient stands and walks. The Left Hemisphere (LH), which controls speech and did not see the command, is asked, "Why are you walking?" The LH replies, "I'm going to get a Coke."

  **The Cartesian Theater Reading:**
  In a Cartesian framework, there is a "Self" sitting in the theater of the mind. Usually, the Self sees the command and issues the motor order. In the split-brain case, the theater is damaged. The Self (located in or accessed via the LH) observes the body moving without having issued the volition. To prevent the collapse of the narrative (the "show" must go on), the Central Narrator fabricates a reason.
  *   **Implication:** The confabulation is a *repair mechanism* for a broken unity. It assumes there *should* be a single author of action, and the brain is lying to preserve the illusion of that authorship.

  **The Dennettian (MDM) Reading:**
  Dennett rejects the idea that there is a "Self" that needs to be protected. There is no Central Meaner. There are only parallel streams of content processing (drafts).
  *   **The Mapping:** The RH generates a draft: *"Command received: Walk."* This draft influences motor systems.
  *   The LH generates a draft: *"Body is moving. Context: Kitchen. Probable cause: Thirst."*
  *   **The Conflict:** These are not two scripts being compared by an editor. They are competing processes vying for control of the output channels (speech vs. gait).
  *   **The Resolution:** The LH draft wins the competition for *verbal report*. It is not "confabulating" in the sense of knowingly lying to a boss; it is simply the draft that achieved "Fame in the Brain" regarding the speech motor cortex. The "official story" is just the story that got spoken.
  *   **Verdict:** This is best read as **one draft among many being retroactively promoted to 'official' status.** Dennett would argue the Cartesian reading makes a category error: it assumes the "lie" is told *to* someone. In MDM, the lie *is* the consciousness of that moment. There is no deeper self knowing the truth; the LH narrative *is* the reality for the speech system.

  ### 2. The Unity Problem: Why Do They Seem Normal?

  If consciousness is just a bundle of competing drafts, why don't split-brain patients walk around screaming about internal civil wars? Why do they present as unified agents in ordinary life?

  **Dennett's Answer: "Fame in the Brain" and Cross-Cuing**
  Dennett argues that unity is not a prerequisite for consciousness; it is a *product* of successful competition.
  1.  **Editorial Selection:** In an intact brain, the corpus callosum allows drafts to mix rapidly. The "winning" draft is usually a coalition of fragments that agree. In split-brain patients, the coalition is restricted by anatomy.
  2.  **Cross-Cuing:** In everyday life, split-brain patients appear unified because the hemispheres communicate *externally*. The RH moves the hand; the LH sees the hand move. The LH incorporates "hand moving" into its draft. This creates a *virtual* unity.
  3.  **The Center of Narrative Gravity:** Dennett posits the "Self" as a fictional center of gravity, like the center of a novel's plot. In split-brain patients, the LH (the verbal hemisphere) becomes the primary author of the public narrative. Because the LH controls speech, it dictates the "official biography" of the patient. The RH's dissenting drafts exist but lack the "fame" required to alter the public record.

  **The Hard Push:**
  This explains the *appearance* of unity, but does it explain the *phenomenology*? If Dennett is right, the patient shouldn't feel unified; they should feel like nothing in particular, because "feeling unified" is a judgment made by the LH narrator. The fact that they report feeling normal supports Dennett: the LH narrator reports normalcy because it has no access to the RH's disjointed data. The "unity" is a user-illusion generated by the limited bandwidth of the report.

  ### 3. Prediction vs. Post-Hoc Fit

  This is the critical weakness often leveled at Dennett. Is MDM a theory that *predicts* split-brain behavior, or a philosophy that *absorbs* it?

  **Where MDM Predicts:**
  1.  **Timing and Revision:** MDM predicts that consciousness is not instantaneous. It predicts that if you probe the patient *during* the action vs. *after*, the narrative might change. (Evidence suggests narratives stabilize over time, fitting the "draft revision" model).
  2.  **No "Inner Witness":** MDM predicts you will never find a neural locus where information converges *before* becoming conscious. Split-brain data supports this: there is no "third hemisphere" or pineal gland where the LH and RH meet to agree on a story. The disunity is fundamental.
  3.  **The Nature of the "Interpreter":** Gazzaniga identified an "Interpreter Module" in the LH. Dennett's model predicts this module isn't a "Self," but a specialized subsystem for coherence. MDM predicts that if you disrupt the Interpreter (e.g., via TMS), the confabulation should stop, but the action might continue. (This is empirically testable and aligns with MDM).

  **Where MDM Risks Being Post-Hoc:**
  MDM is flexible enough to say "whatever happens is just the winning draft." To avoid being purely post-hoc, Dennett must specify *what determines the winner*.
  *   **The Challenge:** MDM needs a mechanics of "Fame." Why did the "Coke" draft beat the "I don't know" draft? If the answer is just "because it was spoken," it's circular.
  *   **The Defense:** The model predicts that confabulation will always favor *causal coherence* over *accuracy*. It predicts the LH will never say, "My right side did that." It will always say, "I did that." This is a specific prediction about the *content* of consciousness: it must be egocentric to be selected for speech. The split-brain data bears this out perfectly.

  ### 4. Falsification Conditions: What Would Change the Mind?

  To make this chapter rigorous, you need to define what would break the Dennettian model and revive the Cartesian Theater (or a functional equivalent).

  **Evidence That Would Support the Cartesian Theater:**
  1.  **The Convergence Point:** Discovery of a specific neural locus (a "final common path") where all sensory and motor drafts *must* arrive to be experienced. If damage to this specific locus abolished consciousness while leaving all processing (speech, motor, memory) intact, that would suggest a "place where it happens." (Currently, lesions affect specific contents, not consciousness *per se*).
  2.  **Simultaneous Contradictory Reports:** If a split-brain patient could verbally report two contradictory conscious experiences simultaneously (e.g., saying "I see red" and "I see blue" at the exact same time with the same vocal cords), it would imply a single stage receiving two inputs that failed to merge. Dennett predicts competition, not simultaneous superposition in output.
  3.  **RH Verbal Consciousness:** If the RH (which usually lacks speech) could be shown to have a rich, independent narrative that *knows* it is disconnected (e.g., via eye-tracking spelling out "I am separate from the left"), it challenges the "Center of Narrative Gravity." Dennett can handle this (two centers of gravity), but if the LH *also* reported knowing about the RH's separation without cross-cuing, it implies a "Super-Theater" overseeing both.

  **Evidence That Would Break Dennett's Model:**
  1.  **The "Orwellian" Limit:** Dennett distinguishes between Stalinesque (falsification before experience) and Orwellian (falsification of memory). He argues the distinction is meaningless. If an experiment could definitively prove a temporal "finish line" where experience becomes fixed *before* report, MDM would be in trouble. (e.g., If we could timestamp the exact millisecond a qualia becomes "real" independent of downstream processing).
  2.  **Unity Without Connectivity:** If split-brain patients demonstrated unified conscious states (e.g., binocular rivalry resolution) that *cannot* be explained by sub-cortical cross-cuing or external behavioral cues, it would suggest consciousness is non-local or holistic in a way MDM's "parallel drafts" cannot account for.
  3.  **The Homunculus Resurrection:** If we found that the "Interpreter" module acts as a bottleneck that *selects* drafts based on a unified value system that exists *prior* to the drafts. Dennett argues the value system is built by the drafts. If the value system precedes the content, the Theater returns.

  ### Summary for Your Chapter

  The Sperry-Gazzaniga work does not disprove Dennett; it **operationalizes** him.
  *   **Cartesian View:** The split brain is a broken theater.
  *   **Dennettian View:** The split brain reveals there was never a theater, only a committee. When the committee is divided by surgery, the minutes (speech) still only reflect one faction (LH), creating the illusion that the committee is still whole.

  The confabulation is not a bug in the system trying to save the Self; it is the system functioning exactly as designed: generating the most coherent narrative available to the output channels. The "Self" is not the thing that got split; the "Self" is the story the LH tells to explain the split.

  **Recommendation for the Text:**
  Use the phrase **"The Center of Narrative Gravity"** heavily here. It bridges Gazzaniga's "Interpreter" and Dennett's "Drafts." The Interpreter *is* the gravity well. In split-brain patients, the gravity well is off-center, but because the LH controls the microphone, the universe of the patient still appears to revolve around it.
