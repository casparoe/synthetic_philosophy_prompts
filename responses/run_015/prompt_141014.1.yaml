prompt: |-
  You are a professional philosopher who specialises in metaethics and moral psychology, and who has spent enough time around empirical people to know how they argue. Take your time with this one: before you write anything polished, do a few paragraphs of unstructured brainstorming about what kind of impasse this even is and what the candidate diagnoses are, then commit to the one you think is best and defend it. Tell me where my own framing is muddled — I'd rather be corrected than agreed with. And please write in British English throughout.

  Some context. I'm a philosophy professor, I teach ethics and political philosophy, and for the last eighteen months or so I've been running a joint reading group with people from the psychology department on the moral foundations literature — the five- or six-foundation picture, care/harm, fairness, loyalty, authority, sanctity, liberty bolted on later, with the standard finding that self-described liberals lean heavily on the first two and self-described conservatives spread more evenly across the lot. We keep asking whether that descriptive asymmetry tells us anything about who is actually right about anything. And we are completely, entirely stuck. Eighteen months, zero movement.

  The shape of the loop is always the same. Someone presents data. A philosopher says: fine, but that's an etiology, and either etiologies are debunking in general, in which case the debunking swallows the debunker's own care-based judgments, or they aren't, in which case this tells us nothing — pick one. Someone else says the whole taxonomy is post-hoc, that you get as many "foundations" as you have intuitions to rationalise. A psychologist points out that the critique is itself obviously driven by a harm-and-fairness monism, i.e. by a foundation. Then someone says "well, that's just your foundation talking," everyone laughs, and we go home.

  Two things make me suspect the interesting stuff is elsewhere. First, when we played with rewriting the survey items ourselves — stripping the harm framing out of the wording, and asking about third-person cases where the person judging isn't the one affected — the left/right difference got a lot noisier, and I don't think anyone in the room knew what would follow if it had gone the other way. Second, we can't even agree on the direction of travel: the same finding gets used as "conservatives are contaminated by irrelevant considerations" and as "liberals are morally impoverished," and both readings seem to need an independent ranking of the foundations, which is precisely the thing nobody argues for.

  So: what kind of disagreement is this, actually? Substantive or verbal? Are the two sides answering different questions under one heading — one about the causal structure of moral judgment, one about which considerations are genuine reasons — and if so is either question even well posed? Is a hidden empirical question doing the work here, about whether these really are distinct psychological constructs rather than clusters we imposed, and if that question were settled would anything normative follow? Or is the stall a symptom of an unargued bedrock disagreement about what moral judgment is even for?

  My own hypothesis, which I want you to take apart if it's wrong: the impasse is a standoff between two debunking arguments with the same structure, pointed in opposite directions, where each side's tool for unmasking the other is itself a moral foundation, so neither can use it without sawing off the branch it's sitting on. If that's right, the real dispute isn't about the psychology at all, it's a third-order one about what sort of thing a foundation is meant to be — an innate module, a culturally learned schema, a set of heuristics, a grammar of moral discourse — and about whether anything normative can be extracted from any of those. Is that the right way to cut it, or am I mistaking a measurement dispute for a metaethical one?

  Given whatever diagnosis you land on, what would actually count as progress — a clean distinction, a kind of result that would settle it, a reframing of the question — or should we expect no progress, and if so why? Please don't give me a reading list or point me at papers and citations; I've read them, and I'm after the structure of the disagreement, not the sources.
