answer: |-
  (a) **Exam Question**

  **Course:** PHI 540: Philosophy of Science – Prediction and Explanation
  **Time Allowed:** 90 Minutes
  **Word Count:** 800–1000 words
  **Instructions:** This examination is open-notes but strictly offline. Do not use internet access. Do not include bibliographies, citations, or reading lists. Focus on argumentative precision rather than historical exposition.

  **Prompt:**
  Standard critiques of Malthusian population theory often focus on the falsification of specific quantitative claims (e.g., geometric vs. arithmetic growth rates). However, evaluating a long-run predictive theory requires distinguishing *how* it fails. Consider the following three distinct failure modes:

  1.  **Parameter Error:** The causal structure is correct, but the quantitative constants or ratios (e.g., growth rates, carrying capacities) are inaccurate.
  2.  **Mechanism Collapse:** The proposed causal dynamics themselves do not hold under the specified conditions; the link between antecedent and consequent is broken.
  3.  **Mechanism Preemption:** The causal dynamics are structurally sound and remain operative, but their effect is systematically blocked or delayed by an exogenous factor that the theory treats as contingent rather than impossible.

  Using this taxonomy, evaluate whether Malthus's theory is best interpreted as suffering from parameter error, mechanism collapse, or mechanism preemption. Defend your classification against the alternative modes. Then, use this classification to assess whether the description of Malthus as "right but early" constitutes a coherent epistemic category or merely a post-hoc rescue strategy. Specifically, address the unfalsifiability worry: if any indefinite delay in the predicted crisis can be interpreted as preemption rather than falsification, does the theory become immune to evidence? Define what evidential pattern would genuinely distinguish mechanism preemption from mechanism collapse.

  ***

  (b) **Model Answer**

  To evaluate Malthusian theory philosophically, we must move beyond the historical accuracy of specific growth rates and examine the structural integrity of its predictions. The three failure modes offer a precise vocabulary for this task. Parameter error implies the engine works but is miscalibrated; mechanism collapse implies the engine is broken; mechanism preemption implies the engine is running but the brakes are engaged.

  Classifying Malthus requires isolating the core causal claim: that population pressure inevitably encounters resource limits, resulting in positive checks (famine, war). If Malthus suffered only from parameter error, the crisis should have occurred roughly when predicted, merely differing in severity. This is historically untenable; the predicted crisis did not materialize in the industrialized world during the specified timeframe. Mechanism collapse would suggest that population growth no longer responds to resource constraints at all. However, ecological evidence suggests that resource limits remain binding in closed systems. Therefore, mechanism preemption is the most defensible interpretation. The Malthusian dynamic (population pressing on subsistence) remains structurally sound, but its expression was blocked by exogenous factors—specifically, technological innovation in agriculture and the demographic transition—which Malthus treated as contingent or negligible rather than impossible.

  However, classifying this as preemption invites the charge that "right but early" is an ad hoc rescue strategy. If every failed prediction is reinterpreted as "preempted," the theory becomes unfalsifiable. For "right but early" to be a coherent epistemic category rather than a dogmatic shield, the claim of preemption must satisfy a counterfactual stability condition. We must assert that *had* the preempting factor (e.g., industrial technology) been absent, the crisis would have occurred as predicted. This requires an explicit domain restriction: the theory applies to systems where technological growth rates remain below population growth rates. Without this restriction, preemption is merely a verbal maneuver to evade falsification.

  This leads directly to the unfalsifiability objection. If we allow indefinite delays under the banner of preemption, we sever the link between theory and evidence. To distinguish mechanism preemption from mechanism collapse, we must identify an evidential pattern where the underlying causal pressure remains detectable despite the absence of the crisis. In physics, this is akin to measuring potential energy in a constrained spring. In demographics, genuine preemption requires evidence that resource constraints are still exerting pressure, even if catastrophic checks are avoided. For example, if population growth slows only because of costly resource extraction (economic stress) rather than a decoupling of reproduction from resource availability, the mechanism is preempted, not collapsed.

  Conversely, mechanism collapse would be evidenced by a structural decoupling. If population growth continues indefinitely without encountering increasing marginal costs of resource extraction, or if reproduction rates become entirely independent of resource security (a true demographic transition unlinked to economic stress), the mechanism has collapsed. The distinction lies in the cost structure. Preemption preserves the cost curve (resources get harder to get, but we manage); collapse flattens it (resources no longer limit growth).

  Therefore, Malthus is "right but early" only if we observe that the preempting factors are temporary or costly维持 (maintained). If the preempting factors become permanent features of the system that fundamentally alter the causal link between population and subsistence, the theory suffers from mechanism collapse. The "right but early" defense is coherent only if the theory specifies the conditions under which preemption fails. If no such conditions exist—if the theory predicts a crisis eventually, without specifying a timeframe or conditions for the removal of preemptors—it is immune to evidence. A robust scientific theory must specify not only what causes the crisis, but what observable conditions would indicate the mechanism is truly dead rather than merely dormant. Malthusianism survives only as a limited domain theory about resource-constrained systems, not as a universal law of population.

  (718 words)

  ***

  (c) **Marking Scheme**

  **Total Points:** 20

  **1. Framing of the Three Failure Modes (4 points)**
  *   **A-Range (4):** Defines parameter error, mechanism collapse, and mechanism preemption precisely, highlighting the structural differences (calibration vs. broken causality vs. blocked causality).
  *   **B-Range (2–3):** Lists the modes but definitions are vague or conflated (e.g., treating preemption as simply "being wrong about the date").
  *   **Characteristic Failure:** Treating the three modes as synonyms for "wrong" rather than distinct structural failures.

  **2. Application to Malthus (5 points)**
  *   **A-Range (5):** Argues for preemption based on the persistence of resource constraints despite delayed crisis; explicitly rejects parameter error (timing too off) and collapse (constraints still exist).
  *   **B-Range (3–4):** Identifies preemption as the correct mode but relies on historical narrative (industrial revolution happened) rather than causal analysis.
  *   **Characteristic Failure:** Listing the three modes without applying them to the Malthusian mechanism, or treating mechanism preemption as obviously correct without defending it against the charge that it renders the theory immune to refutation.

  **3. Defense of "Right but Early" (5 points)**
  *   **A-Range (5):** Argues coherence depends on counterfactual stability and explicit domain restrictions (e.g., "holds only if technology stagnates").
  *   **B-Range (3–4):** Accepts "right but early" as valid without specifying the conditions required to make it non-ad hoc.
  *   **Characteristic Failure:** Accepting "right but early" as a valid defense without imposing conditions that risk falsification.

  **4. Engagement with Unfalsifiability (4 points)**
  *   **A-Range (4):** Specifies the evidential pattern distinguishing preemption (latent pressure/costs) from collapse (structural decoupling); shows how to test the distinction.
  *   **B-Range (2–3):** Acknowledges the unfalsifiability worry but offers only abstract solutions (e.g., "we need more data") without defining the data pattern.
  *   **Characteristic Failure:** Failing to show what evidential pattern would genuinely distinguish preemption from collapse.

  **5. Clarity and Argumentative Structure (2 points)**
  *   **A-Range (2):** Logical flow, precise terminology, within word count.
  *   **B-Range (1):** Disorganized or significant deviations from word count constraints.
  *   **Characteristic Failure:** Argumentative disjointedness or ignoring constraints.

  **Grade Boundaries:**
  *   **A (17–20):** Executes all conceptual moves; preemption is defended with conditions; unfalsifiability is solved via evidential criteria.
  *   **B (13–16):** Correctly identifies preemption but fails to limit it sufficiently to avoid unfalsifiability; relies more on narrative than conceptual distinction.
  *   **C (9–12):** Misidentifies failure modes or treats the prompt as a history question.
