answer: |-
  This is a properly thorny bit of moral arithmetic, and you've located the friction point precisely. The disagreement isn't merely empirical; it's structural. Here is how the two pictures stack up when we strip away the sentimentality.

  ### 1. The Accounting: Stock vs. Flow

  The fundamental disagreement lies in whether we treat animal populations as a **stock** or a **flow**.

  The **Subtraction picture** treats suffering as a function of the *standing population* integrated over time. It assumes a relatively stable carrying capacity ($K$) where lives are lived out until natural death. The metric that matters here is **life-years**. If you remove a hectare, you remove the future life-years of the animals that would have occupied it. Non-existence is the baseline zero; therefore, fewer animals equals less negative value.

  The **Leakage picture** treats suffering as a function of *turnover*. In wild systems, particularly those under stress, the bulk of suffering is concentrated in the birth–death cycle of juveniles (starvation, predation, exposure). The metric that matters here is the **annual birth cohort** weighted by juvenile mortality rates. If destroying habitat forces the system into a high-turnover equilibrium (r-selected species, density-dependent stress), you might reduce the standing population (stock) while increasing the number of deaths per year (flow).

  So, do they disagree on *which number matters*? Yes. Subtraction tracks **capacity** (how many animals fit); Leakage tracks **productivity** (how many animals die). If wild lives are net negative, the Leakage picture argues you should be minimising births/deaths, not merely reducing standing headcount. Subtraction assumes these correlate linearly; Leakage argues they can decouple entirely.

  ### 2. The Welfare Yield Curve

  If we plot total future suffering (Y-axis) against the amount of habitat remaining (X-axis), the two pictures produce radically different shapes.

  *   **The Subtraction Curve:** This is roughly **linear**. Zero habitat means zero suffering. Maximum habitat means maximum suffering (assuming net-negative lives). Halving the habitat halves the suffering. It is a straight line from the origin upwards.
  *   **The Leakage Curve:** This is likely **hump-shaped** (convex).
      *   *At zero habitat:* Suffering is zero.
      *   *At low/intermediate habitat:* Suffering spikes. This is the zone of fragmentation, edge effects, and displacement. The remaining habitat is overcrowded; species composition shifts to generalists with high reproductive rates and colossal juvenile mortality; displaced animals suffer during migration or die in sink habitats. Here, each remaining hectare generates *more* suffering than it did in the pristine state.
      *   *At high habitat:* Suffering may plateau or even decrease per hectare as stable, K-selected communities establish lower turnover rates.

  Under the Leakage picture, destroying habitat moves you left along the X-axis. If you start from a high-habitat baseline, destroying a chunk might move you *up* the curve (increasing total suffering) before you ever move down it. The peak suffering occurs not at maximum habitat, but at some intermediate point of fragmentation where density stress and turnover are maximised without total collapse.

  ### 3. Can Subtraction Survive? (Permanent vs. Reversible)

  The Subtraction picture survives only under conditions of **absolute exclusion**.

  The Leakage objection relies on biological continuity: animals displaced must go somewhere, and cleared land usually reverts to *some* kind of biological productivity (scrub, secondary growth, agricultural pasture). If you clear a forest to plant wheat, you haven't removed habitat; you've swapped a complex ecosystem for a simplified, high-turnover one (pests, rodents, birds) often with higher suffering density.

  However, if the destruction converts the land to **non-biological substrate** permanently—a deep reservoir, a concrete car park, a toxic mine tailing—then the Leakage mechanism is broken. There is no "somewhere else" for the animals to go on that patch, and no recolonisation. In this specific case, Subtraction holds: you have genuinely removed the capacity for life.

  But this is a narrow exception. Most habitat destruction is not sealing; it is degradation. It turns forest into scrub, or scrub into pasture. In these cases, Leakage dominates. The Subtraction picture only works if you are willing to pave the world.

  ### 4. Worse or Useless?

  This is the crux. If the Leakage picture is roughly right, habitat destruction is not merely a useless lever; it is likely **actively worse** than the naive Subtractionist thinks.

  *   **The Useless Lever Argument:** This would imply destruction causes human harm (loss of ecosystem services, aesthetic loss) for *no* welfare gain. Total suffering remains constant because populations re-equilibrate.
  *   **The Actively Worse Argument:** This implies the sign flips. Destruction incurs a one-off spike of acute suffering (displacement, death during clearing) followed by a new equilibrium with higher suffering density (due to turnover and stress).

  I land on **actively worse**. The Subtractionist believes they are cancelling future negative value. The Leakage realist sees they are triggering a transition cost (the suffering of destruction itself) plus locking the system into a higher-suffering steady state. You aren't just failing to help; you are likely compounding the misery per unit of biomass.

  ### Where the Disagreement Lives

  To locate the disagreement precisely: it is not about whether wild lives are net negative (both sides here grant that for the sake of argument). It is about the **elasticity of suffering density**.

  The Subtractionist assumes suffering density is constant per hectare. The Leakage theorist assumes suffering density is a variable function of fragmentation and population dynamics. Consequently, the Subtractionist sees habitat destruction as a **volume knob** (turn it down, suffering goes down). The Leakage theorist sees it as a **gain control** (turn it down, and the system might scream louder).

  If one accepts the Leakage picture, the only ethical way to reduce wild animal suffering via land use is total, permanent conversion to non-habitat (the "paving" solution), or else sophisticated intervention to manage populations within existing habitat. Mere destruction is a blunt instrument that likely breaks the thing it tries to fix.
