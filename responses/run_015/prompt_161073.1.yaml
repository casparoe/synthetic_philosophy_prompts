answer: |-
  This is a profound problem that sits at the intersection of metaphysics, the philosophy of action, and practical ethics. You are encountering the **Metaphysics of Omissions** combined with the **Problem of Causal Selection**.

  You are asking for a "carving"—a precise delineation of what this phenomenon is. To do this, I will sketch the candidate concepts from the philosophical literature, test them against your three cases, discard the failures, and then offer a synthesized account with a precise term for your reporting context.

  ### Part 1: Candidate Concepts and Elimination

  Here are the four dominant frameworks for causation. I will test each against your cases.

  #### 1. Simple Counterfactual Dependence (The "But-For" Test)
  *The Concept:* $C$ causes $E$ if and only if, had $C$ not occurred, $E$ would not have occurred.
  *   **Case 1 (Plant):** **Fails.** You stated: "Either deficiency on its own would have been fatal." If you restore water (but leave shade off), the plant dies. If you restore shade (but leave water off), the plant dies. Therefore, neither omission *individually* passes the but-for test. Yet, you rightly report both. Simple counterfactuals cannot account for joint necessity in overdetermination scenarios.
  *   **Case 2 (Patient):** **Fails to Filter.** Both the Doctor's omission and the Nurse's omission pass the but-for test. (If Doctor writes, Nurse gives, Patient lives. If Nurse gives [assuming drug available], Patient lives). Yet you exclude the Nurse. The but-for test is too broad; it captures too much.
  *   **Case 3 (Indefinite Others):** **Fails to Filter.** Everyone who didn't save the patient passes the but-for test. This framework cannot distinguish a cause from a background condition.
  *   **Verdict:** **Discard.** It is necessary but not sufficient.

  #### 2. Physical Process / Mechanism Theories
  *The Concept:* Causation requires a physical transmission of energy or a continuous mechanism connecting cause to effect (e.g., Salmon, Dowe).
  *   **Case 1, 2, & 3:** **Fails Completely.** Omissions are "nothings." There is no physical process connecting "not watering" to "dying." There is no energy transfer from the Doctor's silence to the patient's deterioration. If you require a physical mechanism, omissions can never be causes. Since you *must* report them as causes, this metaphysical view is useless for your work.
  *   **Verdict:** **Discard.**

  #### 3. INUS Conditions (Mackie)
  *The Concept:* A cause is an **I**nsufficient but **N**ecessary part of a condition which is itself **U**nnecessary but **S**ufficient for the effect.
  *   **Case 1:** **Partial Fit.** The conjunction (No Water + No Shade) is sufficient. But are they necessary parts? If "No Water" alone is sufficient for death (as you stated), then "No Shade" is not a necessary part of that specific sufficient condition. This gets messy with overdetermination.
  *   **Case 2:** **Fails to Filter.** Both omissions are INUS conditions. It doesn't explain why the Nurse is excluded.
  *   **Verdict:** **Discard.** Too technical, fails the selection problem.

  #### 4. Causal Selection / Pragmatics (Hart & Honoré)
  *The Concept:* Causation is objective, but *selecting* a cause for explanation is pragmatic. We pick the "abnormal" or "voluntary" intervention against a background of "normal" conditions.
  *   **Case 1:** **Fits.** Both omissions are abnormal deviations from the care plan.
  *   **Case 2:** **Fits.** The Doctor's omission is the "intervention" that disrupted the normal flow. The Nurse's omission is a "condition" resulting from that disruption.
  *   **Case 3:** **Fits.** Distant people's inaction is "normal" (background); the staff's inaction is "abnormal."
  *   **Critique:** This treats the problem as merely linguistic (how we talk) rather than structural (how the system works). It doesn't tell you *why* the Nurse's omission is treated as background.
  *   **Verdict:** **Keep as a component,** but it needs metaphysical grounding.

  ---

  ### Part 2: The Carving — What Exactly Is This?

  The phenomenon you are describing is not a single metaphysical relation. It is a two-layered structure.

  1.  **The Metaphysical Layer:** This is **Counterfactual Dependence on Absences**. (If the omission hadn't happened, the outcome would differ). This layer is "flat"—it treats the Doctor, the Nurse, and the random bystander equally.
  2.  **The Explanatory Layer:** This is **Normative Contrast Selection**. This layer filters the metaphysical causes. It asks: "Relative to what *should* have happened, does this absence make a difference?"

  Your Cases 1 and 2 look different because they rely on different structures within this two-layered system.

  *   **Case 1 is Conjunctive Omissive Overdetermination.**
      Metaphysically, neither omission alone is a cause (fails but-for). But the *conjunction* is. Normatively, both are breaches. Therefore, both are reported.
  *   **Case 2 is Normative Preemption.**
      Metaphysically, both are causes. Normatively, the Doctor's omission *changes the norm* for the Nurse.
      *   Doctor's Norm: Write Order. (Deviation: No Write).
      *   Nurse's Norm: Administer *if Ordered*. (Given No Order, Norm is: Do Not Administer).
      Because the Nurse acted according to the *situation-specific norm* (do not give drug without order), her omission is not a "deviant" contrast. It drops out of the causal explanation.
  *   **Case 3 is The Causal Field Limit.**
      The "filter" is the boundary of the **System of Responsibility**. People outside the hospital trust have a "default" of non-interference. Their omission is the default state, not a deviation.

  ### Part 3: The Established Literature vs. Your Need

  There is no single established term that covers this exact configuration in a clinical reporting context. However, it synthesizes two major philosophical accounts:

  1.  **Contrastive Causation (Jonathan Schaffer):** Causation is not a binary relation ($C$ causes $E$) but a ternary one ($C$ rather than $C^*$ causes $E$ rather than $E^*$).
  2.  **Default/Deviant Distinction (Christopher Hitchcock):** We only count causes that represent a "deviant" value against a "default" setting.

  **Why existing terms fail you:**
  *   "Omissive Causation" is too broad (includes Case 3 bystanders).
  *   "Causal Selection" is too vague (doesn't specify *how* to select).
  *   "Breach of Duty" is too legalistic (conflates liability with causation).

  ### Part 4: The Coined Term and Definition

  Since you need a precise tool for your reports, I propose we coin a term that captures the *structure* of the phenomenon you are isolating.

  **Term:** **Normatively-Filtered Contrastive Omission (NFCO)**

  **Definition:**
  An NFCO is an absence of action $A$ that satisfies three conditions:
  1.  **Counterfactual Dependence:** Had $A$ occurred, the adverse outcome $E$ would likely have been prevented (metaphysical layer).
  2.  **Normative Deviance:** The non-performance of $A$ constitutes a deviation from a prescribed, expected, or functional default state relevant to the agent's role (explanatory layer).
  3.  **Systemic Salience:** The deviation is not itself the downstream result of a prior Normatively-Filtered Contrastive Omission by another agent (the "upstream" filter).

  **Application to Your Cases:**
  *   **Case 1 (Plant):**
      *   Watering: Dependence? Yes (as part of conjunction). Deviant? Yes. Upstream? No. $\rightarrow$ **NFCO.**
      *   Shading: Dependence? Yes (as part of conjunction). Deviant? Yes. Upstream? No. $\rightarrow$ **NFCO.**
      *   *Result:* Report both.
  *   **Case 2 (Patient):**
      *   Doctor Writing: Dependence? Yes. Deviant? Yes. Upstream? No. $\rightarrow$ **NFCO.**
      *   Nurse Administering: Dependence? Yes. Deviant? **No.** (Given no order, the norm is *not* to administer). $\rightarrow$ **Not an NFCO.**
      *   *Result:* Report Doctor only.
  *   **Case 3 (Bystanders):**
      *   Bystander Saving: Dependence? Yes. Deviant? **No.** (Default for bystander is non-interference). $\rightarrow$ **Not an NFCO.**
      *   *Result:* Exclude.

  ### Part 5: Boundaries and Edge Cases

  To ensure this carving is robust, we must identify where **NFCO** stops applying.

  **1. The "Hero" Boundary (When does a bystander become a cause?)**
  *   *Scenario:* A visitor sees a patient choking and does nothing, though they are a trained off-duty doctor.
  *   *Analysis:* Is there a Normative Deviance?
      *   *Legal Default:* No duty to rescue.
      *   *Moral Default:* Debatable.
      *   *NFCO Verdict:* If your Trust's policy imposes a duty on *anyone on premises*, it is an NFCO. If not, it is not. The boundary is **institutional expectation**, not moral capability.
  *   *Edge:* If the visitor is the *only* person present, the "Systemic Salience" shifts. They become the de facto agent. NFCO status may activate due to **necessity**.

  **2. The "Impossible Duty" Boundary**
  *   *Scenario:* The Doctor didn't write the order because the computer system crashed for 4 hours.
  *   *Analysis:* Normative Deviance? No. The "Default" shifts to "Do what is possible."
  *   *NFCO Verdict:* Not an NFCO. The cause shifts to the **IT System Failure** (which is an event, not an omission).
  *   *Edge:* This shows NFCO filters out omissions that are forced by external events.

  **3. The "Joint Necessity" Boundary (Case 1 Variant)**
  *   *Scenario:* Plant needs Water AND Shade. Water was off (maintenance). Shade was off (negligence).
  *   *Analysis:* Water failure was *authorized* (maintenance). Shade failure was *negligent*.
  *   *NFCO Verdict:* Water failure is not Deviant (it was planned). Shade failure is Deviant.
  *   *Result:* Report only the Shade failure as the NFCO, though both caused the death.
  *   *Insight:* This proves NFCO is not pure causation; it is **causal explanation for accountability**.

  ### Part 6: Conclusion for Your Reporting

  You asked if the filter is doing causal work or explanatory/normative work.
  **Answer:** The filter is doing **explanatory and normative work**. The "causal work" is done by the biology (plant dying, patient deteriorating). The "omission" is a metaphysical shadow cast by that biology. The "filter" determines which shadows we care to name.

  **Recommendation for the "Causal Factors" Box:**
  Do not look for "The Cause." Look for the **Normatively-Filtered Contrastive Omission**.
  1.  Identify all absences that pass the but-for test.
  2.  Ask: "Was there a specific expectation/duty for this agent to act *in this specific context*?" (Filter for Deviance).
  3.  Ask: "Was this failure caused by someone else's prior failure to enable this action?" (Filter for Upstream Preemption).
  4.  If multiple failures are jointly necessary (Case 1), report the conjunction as a single causal factor: *"Failure to provide combined hydration and shade protection."*

  **The Phenomenon:**
  It is **Normatively-Filtered Contrastive Omission**.
  It is **not** pure causation.
  It is **not** pure blame.
  It is the **intersection of counterfactual dependence and institutional expectation.**

  This carving allows you to exclude the Nurse (no deviance relative to context) and the Bystander (no duty), while including the Doctor (deviance) and the Gardeners (joint deviance), without conflating moral blame with causal structure.
