answer: |-
  This is a profound question that cuts to the heart of patent jurisprudence. You have correctly identified a surface-level contradiction: patent law claims to be objective and text-bound (to serve the public notice function) yet routinely incorporates author-centric mechanisms (lexicography, prosecution history estoppel, doctrine of equivalents) that seem to rely on intent or equity.

  The short answer is that US patent law does not presuppose a single theory of linguistic meaning. Instead, it operates on a **functionalist theory of the patent bargain**. It sacrifices linguistic purity for economic utility.

  However, to answer your specific request for the theory behind the practice, we must disentangle the *semantics* of the claims from the *scope* of the legal right. Here is an explicit theoretical mapping of the practice, its coherence, and the consequences of altering it.

  ### 1. The Theory of Meaning: "Objective Reliance"
  The practice is not committed to the claim that text content is fixed solely by conventional understanding, nor is it secretly intentionalist. It is committed to **Objective Reliance**.

  In standard textualism (like statutory interpretation), the goal is often to find the "true" meaning of the law. In patent law, the goal is to stabilize the expectations of third parties (competitors). The "Person Having Ordinary Skill In The Art" (PHOSITA) is not a predictive model of an actual reader; they are a **normative construct**. They represent the level of knowledge the law *wishes* the public possessed.

  *   **Why this resolves the tension:** The law treats the patent document not as a communication from author to reader, but as a **boundary marker** filed in a public registry.
  *   **The "Author-Sensitive" features:** When the law allows an inventor to act as their own lexicographer (defining a term contrary to ordinary meaning), it is not privileging *intent*; it is privileging *explicit textual stipulation*. The intent only matters if it is encoded into the intrinsic record. This keeps the "notice" function intact: a competitor reading the file can see the definition.
  *   **Prosecution History Estoppel:** This is not about reading the author's mind; it is about **equitable consistency**. If you told the Patent Office "I am not claiming X" to get the patent, you cannot tell a Court "I am claiming X" to sue a competitor. This is a rule of fairness, not linguistics.

  **Theoretical Classification:** This is a hybrid of **Conventionalism** (ordinary meaning governs by default) and **Stipulative Definition** (explicit definitions override convention), bounded by **Estoppel** (past representations bind future claims).

  ### 2. Semantic Content vs. Legal Scope
  You asked if coherence can be achieved by separating the semantic content of the claims from the scope of the legal right. **Yes, this is the only way to render the practice philosophically coherent.**

  *   **Claim Construction (The *Markman* Hearing):** This determines the **Semantic Content**. Here, the court acts as a textualist. It asks: "What do these words mean to the PHOSITA on the filing date?" Inventor testimony is excluded here because it is unreliable for public notice.
  *   **Doctrine of Equivalents (DoE) & Estoppel:** This determines the **Legal Scope**. This is where the text is transcended. The DoE acknowledges that language is imperfect and cannot capture every trivial variation of an invention. It allows the *right* to expand beyond the *words* to prevent fraud on the patent (copying the invention by changing a non-essential word).
  *   **The Coherence:** The tension vanishes if you view the claims as defining the *core* of the property right (semantic content), while the DoE and Estoppel act as equitable *adjustments* to the boundary based on the behavior of the parties and the limitations of language.

  **The "Unforeseeable" Equivalent:** You noted that inventors can reach technology that didn't exist at filing if it was unforeseeable. This confirms that the patent right is not a linguistic container but a **reward for disclosure**. If you disclosed the principle, you own the principle, even if the language you used couldn't specifically name a future embodiment of it. This is explicitly anti-textualist but pro-incentive.

  ### 3. The Problem of Authorship (The Committee)
  The fact that a patent is drafted by a committee (inventors, attorneys, examiners) fundamentally changes what the practice can presuppose about authorship.

  *   **The Death of "Subjective Intent":** In copyright or contract law, we sometimes care about the meeting of the minds. In patents, the "author" is a fragmented entity. The inventor knows the science; the attorney knows the law; the examiner enforces the boundaries.
  *   **The Document as Author:** Because the human intent is distributed and often adversarial (attorney vs. examiner), the law treats the **file wrapper** (the complete record) as the authoritative agent.
  *   **Implication:** This forces the system toward the "Objective Reliance" model. You cannot psychoanalyze a negotiation between an attorney and a bureaucrat. You can only read what they wrote down. This justifies the exclusion of extrinsic evidence (inventor testimony) during claim construction. The "intent" that matters is the intent *manifested in the record*.

  ### 4. Philosophical Underdetermination
  You asked which parts are strictly presupposed and where the practice is underdetermined.

  *   **Strictly Presupposed:** The **Public Notice Function**. Every rule bends to ensure a competitor can read the patent and know if they are infringing. This is why intrinsic evidence (the document itself) trumps extrinsic evidence (testimony).
  *   **Underdetermined:** The **Doctrine of Equivalents**. This is the loosest thread. It is pure equity. A strict textualist cannot justify it (if it's not in the text, it's not owned). A strict intentionalist cannot justify it (it covers things the inventor didn't imagine). It exists solely to prevent the "fraud" of copying.
  *   **Licensing the Theories:**
      *   **Textualist:** Licenses the PHOSITA standard and the primacy of the claims.
      *   **Intentionalist:** Licenses the lexicographer rule (but only where intent is textualized).
      *   **Reader-Relative:** Licenses the reliance interest (competitors shouldn't be blindsided).

  The system is coherent *pragmatically*, even if it is incoherent *linguistically*. It uses whatever theory of meaning yields the best economic outcome for innovation.

  ### 5. Counterfactuals: Swinging the Pendulum
  For your piece on ML and gene editing, it is vital to understand what happens if you resolve the tension in either direction.

  #### Scenario A: Thoroughgoing Intentionalism
  *   **The Change:** Inventor testimony becomes central. Meaning runs with what the inventors meant, not what they wrote.
  *   **The Result:** **Total Uncertainty.**
      *   In ML and Gene Editing, where concepts are abstract, inventors could claim they "meant" to cover any neural network or any CRISPR variant, regardless of the claim language.
      *   Competitors could not clear rights without deposing the inventors.
      *   **Litigation:** Explodes. Every case becomes a "battle of the experts" regarding the inventor's state of mind in 2015.
      *   **Innovation:** Chills. Companies cannot invest in R&D if they cannot determine if they are infringing until a jury decides what the inventor was thinking.

  #### Scenario B: Thoroughgoing Textualism
  *   **The Change:** Only the ordinary meaning of the words counts. No Doctrine of Equivalents. No Estoppel. No special definitions.
  *   **The Result:** **The Death of the Patent.**
      *   **Word Games:** Competitors would design around patents by making trivial, non-functional changes to evade the literal text. (e.g., changing a specific gene sequence by one base pair that does nothing functionally).
      *   **High-Tech Impact:** In ML and Gene Editing, language lags behind technology. A textualist reading would mean patents cover only the specific embodiment described, not the underlying principle.
      *   **Incentive:** Collapses. Why disclose your invention if a competitor can copy the "gist" of it just by changing the vocabulary?
      *   **Secrecy:** Inventors would rely on trade secrets rather than patents, reducing the public dissemination of knowledge (the *quid pro quo* of the patent system).

  ### 6. Application to Your Piece (ML and Gene Editing)
  The tension you are observing is currently the flashpoint in these fields.

  *   **Machine Learning:** Neural networks are often "black boxes." It is difficult to describe *how* they work in a patent claim, only *what* they do. A textualist reading might invalidate these patents for lack of enablement (you didn't describe how to make it). An intentionalist reading might allow broad claims over "any system that learns," which could monopolize basic math. The courts are currently struggling to apply the PHOSITA standard: *Who is skilled in AI? A mathematician? A coder?* The answer changes the scope of the monopoly.
  *   **Gene Editing:** CRISPR patents involve broad claims over genetic sequences. The Doctrine of Equivalents is critical here. If a competitor uses a slightly different enzyme to achieve the same cut, is it infringement? A textualist says no; a functionalist (DoE) says yes. The litigation turns on whether the court views the patent as a **linguistic contract** or a **property right in a biological principle**.

  ### Summary for Your Narrative
  The theory of meaning in patent law is **Instrumentalist**. It does not care about "truth" in the philosophical sense. It cares about **incentive compatibility**.

  *   It pretends to be textualist to give competitors notice (so they know where not to build).
  *   It pretends to be intentionalist to give inventors reward (so they know they will be paid).
  *   It uses the PHOSITA as a stabilizing fiction to bridge the gap.

  The incoherence you sense is not a bug; it is the friction generated by trying to map static language onto dynamic technology. If you force the system to be linguistically pure (either fully textualist or fully intentionalist), the patent system ceases to function as an engine of innovation. It survives precisely because it is willing to be philosophically impure.

  For your piece, the hook is this: **In high-stakes tech litigation, courts are not interpreting text; they are allocating property rights in the future.** The "meaning" of the words is merely the tool they use to decide how much of the future the inventor gets to own.
