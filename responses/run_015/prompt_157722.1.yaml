answer: |-
  You have hit on one of the most persistent and subtle conceptual hurdles in quantitative genetics. You aren't smuggling anything in wrong; you are correctly identifying that **heritability answers a specific question that is different from the one your intuition is asking.**

  The short answer is: The $0/0$ case is not a defect in the math; it is a feature of the definition. Heritability is a measure of **difference**, not **cause**.

  Here is the breakdown of why your intuition clashes with the statistic, why your counterfactual fix is actually a different concept, and what metric you should be using instead.

  ### 1. The Category Error: Variation vs. Causation
  Your intuition says: *"In a clone line in a uniform environment, the trait is determined entirely by the genotype. Therefore, heritability should be 1."*

  The statistic says: *"Heritability is the proportion of **variance** explained by genetic **variance**. If there is no variance, there is no proportion."*

  Consider the trait "number of hearts." In humans, $V_G \approx 0$ and $V_E \approx 0$ (barring rare mutations or teratogens). Everyone has one heart.
  *   **Is having a heart genetic?** Yes, absolutely. It is 100% genetically determined.
  *   **Is variation in heart number heritable?** The question is meaningless. There is no variation to explain.

  If you set $h^2 = 1$ for the clone line, you are conflating **genetic determinism** (genes cause the trait value) with **heritability** (genes cause the trait *differences*).
  *   **Genetic Determinism:** Asks "Would this trait exist/change if we removed the genes?"
  *   **Heritability:** Asks "If we look at the differences in this room, are they due to genetic differences?"

  In your clone/uniform-environment case, the answer to the second question is "There are no differences," not "The differences are genetic."

  ### 2. The Evolutionary Justification
  Why do biologists define it this way? Why not fix it to match your intuition?

  Because heritability ($h^2$) was invented primarily to predict the **Response to Selection** (The Breeder's Equation: $R = h^2 S$).
  *   $S$ is the selection differential (how much the parents differ from the mean).
  *   $R$ is the response (how much the offspring differ from the parents).

  If you have a population of clones in a uniform environment ($V_P = 0$), you cannot select. Everyone is identical. You cannot pick the "tallest" plant because they are all the same height. Therefore, the potential for evolutionary change via selection is zero.
  *   If $h^2$ were defined as 1 in this case, the Breeder's Equation would break (implying you could select for change when you can't).
  *   By leaving it undefined (or effectively 0 in practical terms), the math correctly signals: **"Evolution by selection cannot happen here."**

  ### 3. Evaluating Your Counterfactual Fix
  You proposed: *"Hold the environment fixed and ask how much variance you'd see if you randomized genotype instead."*

  This is actually a very sophisticated intuition. You are describing the **Average Effect of Gene Substitution** or the concept behind a **Reaction Norm**.

  However, to make this precise, you run into a sampling problem. To calculate variance, you need a distribution.
  *   If you have only **one** genotype (the inbred line), you cannot calculate $V_G$, even counterfactually, without importing data from *other* genotypes.
  *   If you import data from other genotypes, you are no longer talking about *that* population; you are talking about a hypothetical super-population.

  Your counterfactual is essentially asking for the **slope of the reaction norm** across genotypes.
  *   **Canalization:** If you take your clone and scatter it across 100 environments, and the trait never changes, the trait is highly **canalized**. This matches your intuition of "genetic control."
  *   **Heritability:** If you take 100 genotypes and put them in one environment, and they differ, the trait has high **heritability**.

  These are orthogonal properties. A trait can be highly canalized (insensitive to $E$) but have low heritability (if $V_G$ is low). A trait can be highly sensitive to $E$ but have high heritability (if $V_G$ is huge compared to $V_E$).

  ### 4. Is there a metric that does what you want?
  You are looking for a measure of **Genetic Necessity** or **Causal Power**, not Variance Decomposition. While standard quantitative genetics doesn't have a single number for this, a few concepts get closer:

  1.  **Broad-Sense Heritability ($H^2$) in a Reference Population:**
      Instead of measuring the clone line, you measure $H^2$ in a diverse wild population in a standard environment. If $H^2$ is high, it suggests that *in general*, genetic differences drive this trait. But this still relies on variance.

  2.  **Mutational Heritability ($V_M / V_E$):**
      This measures how much new genetic variation is introduced by mutation per generation relative to environmental variance. It measures the "potential" for the trait to be genetic, independent of current standing variation.

  3.  **Causal Inference / GWAS Effect Sizes:**
      Modern genomics moves away from $V_G/V_P$ and toward specific loci. If you can identify the specific alleles and their effect sizes ($\beta$), you can sum them up. If the sum of genetic effects accounts for the total trait value (minus a baseline), you have a measure of genetic determination. But this is still usually expressed as "Variance Explained" ($R^2$), which returns you to the variance problem if $V_P=0$.

  ### 5. Conclusion: You aren't wrong, you're just asking a different question.
  The $0/0$ undefinedness is not a bug. It is the statistic telling you: **"You are asking about the source of differences, but there are no differences."**

  Your intuition is tracking **Developmental Robustness** (how much does $E$ matter?) and **Genetic Causation** (do genes build this?).
  *   For Robustness, look at the **Reaction Norm** of the genotype across environments.
  *   For Causation, acknowledge that genes are necessary but heritability is not the tool to measure necessity.

  **The Fix:** Don't try to redefine heritability. Accept that $h^2$ is strictly about **population variance in a specific context**. When you want to know if genes "matter" for a trait in the absence of variance, you are asking a developmental biology question, not a quantitative genetics question.

  You have successfully identified the limit of the concept. That's not a failure on your part; it's a sign you understand the boundary between statistics and biology.
