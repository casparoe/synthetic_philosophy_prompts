  # SEMINAR HANDOUT: DECISION TREE ON MILITARY SERVICE AND THE STATE

  **Instructions:** Start at the root. Answer each question based on your normative intuitions or empirical beliefs. Follow the branch to find your corresponding position and its most awkward commitment.

  ```text
  ROOT: Does the democratic state possess the moral authority to compel 
        bodily service from citizens irrespective of individual consent?
        │
        ├── NO ──┬── Q2: Is an all-volunteer force unjust if it recruits 
        │        │   disproportionately from the economically worst-off?
        │        │
        │        ├── NO ──► LEAF 1: LIBERTARIAN MARKETISM
        │        │          [Awkward Commitment: Accepts mercenary armies 
        │        │           as morally equivalent to any other labor market.]
        │        │
        │        └── YES ──► LEAF 2: EGALITARIAN VOLUNTARISM
        │                   [Awkward Commitment: Requires broad economic 
        │                    redistribution outside the military to fix 
        │                    recruitment skew without compulsion.]
        │
        └── YES ──┬── Q3: Does the justification for compulsion survive if 
                  │   a professional army could defend the state equally well?
                  │   (The Empirical Premise Test)
                  │
                  ├── NO ──┬── Q4: Is conscription defended primarily as a 
                  │        │   way of winning wars or as a way of making the 
                  │        │   public bear the cost of the wars it tolerates?
                  │        │   (The Purpose Distinction)
                  │        │
                  │        ├── WINNING ──► LEAF 3: NATIONAL SECURITY PRAGMATISM
                  │        │               [Awkward Commitment: Abandons 
                  │        │                conscription immediately if 
                  │        │                technology or volunteers suffice.]
                  │        │
                  │        └── COST-BEARING ──► LEAF 4: DEMOCRATIC ACCOUNTABILITY
                  │                            [Awkward Commitment: Supports 
                  │                             conscription even in peace to 
                  │                             raise the political cost of war.]
                  │
                  └── YES ──┬── Q5: Is the obligation satisfied by equivalent 
                            │   civilian service at equal pay?
                            │   (The Distribution Question)
                            │
                            ├── YES ──► LEAF 5: CIVIC UNIVERSALISM
                            │           [Awkward Commitment: Treats military 
                            │            service as interchangeable with 
                            │            civilian labor like trash collection.]
                            │
                            └── NO ──┬── Q6: Is the burden shared by all adults 
                                     │   (militia) or selected among equals (lottery)?
                                     │
                                     ├── ALL (MILITIA) ──► LEAF 6: ARMED NEUTRALITY COMMUNITARIANISM
                                     │                   [Awkward Commitment: Requires permanent 
                                     │                    societal militarization and neutrality.]
                                     │                   (Matches Swiss/Finnish Case)
                                     │
                                     └── SELECTED (LOTTERY) ──► LEAF 7: SELECTIVE LOTTERY EGALITARIANISM
                                                            [Awkward Commitment: Accepts random 
                                                             suffering among equals while the 
                                                             majority benefits freely.]
                                                            (Matches Lottery Case)
  ```

  ### CONFIDENCE AND STRUCTURAL NOTES

  **Confidence in Specific Calls:** 85%
  The tree successfully forces distinctions required by the prompt (Authority vs. Distribution, Empirical Premise, Purpose). The mapping of the four required cases (AVF, Universal, Militia, Lottery) to specific leaves is robust. However, real-world positions often blend categories (e.g., a Civic Universalist might also argue for Democratic Accountability), which the binary structure necessarily separates.

  **Least Sure Node:** **Q3 (The Empirical Premise Test)**
  *Question:* "Does the justification for compulsion survive if a professional army could defend the state equally well?"
  *Uncertainty:* This node separates Instrumentalists (No) from Principled Compulsionists (Yes). However, "defend the state" is ambiguous. Civic Republicans argue conscription defends the *civic character* of the state, not just its borders. If civic character is part of "defense," then even principled advocates might answer "No" (because a professional army doesn't defend civic character), collapsing the branch.
  *What would settle it:* A precise definition of "defense" in the seminar context: does it mean territorial integrity only, or includes the preservation of democratic civic virtue?

  **Flagged Pair:** **Leaf 4 (Democratic Accountability) and Leaf 5 (Civic Universalism)**
  *Reason:* The tree separates these based on the Empirical Premise (Q3). Leaf 4 says conscription is needed to check war-making (Instrumental); Leaf 5 says it is a duty regardless of necessity (Principled). In practice, proponents of both positions argue for identical policies (universal service with civilian options) and share the same goal (burden-sharing). The tree separates their *justifications*, but not their *policy prescriptions*.

  **Distinctions Visible:**
  1.  **Authority vs. Distribution:** Established at Root (Authority) vs. Q2/Q5/Q6 (Distribution).
  2.  **Empirical Premise:** Established at Q3 (Survival if professional army suffices).
  3.  **Purpose:** Established at Q4 (Winning vs. Cost-bearing).
