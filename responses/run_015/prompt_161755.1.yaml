  7.  **Final Polish:** Organize by the user's specific questions first, then the sentence-by-sentence audit. (Actually, sentence-by-sentence is better for an "audit," followed by a synthesis of the specific worries). Let's do a hybrid: Section 1: The Specific Worries (Direct Answers). Section 2: Sentence-by-Sentence Audit. Section 3: The Conclusions.

      *   *Wait, one more thing:* The prompt asks to "audit this rather than explain the argument from scratch." I should focus on evaluating the provided text.
