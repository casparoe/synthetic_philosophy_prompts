      *   **Audience:** Analytic philosophy of science crowd (Giere/Massimi readers), hardline scientific realists (anti-pluralist), visiting logician (paraconsistent but skeptical of "mystical" metaphysics).
      *   **Advisor's Advice:** Concede upfront that this isn't replacing empirical testing with metaphysical tolerance. Know where to concede vs. hold firm.
      *   **Constraints:** No bibliography/reading lists. Focus on objections in *their* vocabulary. Order by damage potential. Two-minute max replies. Honest note on weaknesses. Include the "dreaded question" (falsifiability).
