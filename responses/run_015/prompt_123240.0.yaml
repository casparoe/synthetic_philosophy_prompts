          *   *Why damaging:* It makes the project redundant. If it's just Massimi, why do we need Jain logic?
          *   *Reply:* Perspectivism is often indexical (depends on the observer). Syādvāda is ontic/structural (depends on the *object's* modes). It's not "true for me," it's "true under condition C."
