          *   Friend (Design/Relations): $5,000 (from a local client).
      *   **Goal:** Wants a "careful second opinion," specifically looking for game-theoretic or formal negotiation frameworks to justify a split other than 50/50 without seeming greedy. Values the friendship.
      *   **Request:** Specific dollar splits based on formal theories, one-sentence explanations, and an assessment of whether 50/50 is supported.

  2.  **Identify the Core Economic/Game Theory Problem:**
      *   This is a cooperative bargaining problem with transferable utility (money).
      *   Total Surplus ($V$) = $60,000.
      *   Disagreement Point / BATNA ($d_i$): What happens if they *don't* agree to sell together?
          *   User ($d_u$) = $30,000.
          *   Friend ($d_f$) = $5,000.
      *   *Correction/Nuance:* Can the user actually sell the code for $30k *if* the friend owns the design/customer relationships? The prompt says "if I walked away." It implies the code is separable. Similarly for the friend. I must accept the user's stated BATNAs as factual for the calculation, even if in reality IP ownership might be messy.
      *   Surplus to be divided ($S$) = Total Value - Sum of BATNAs.
      *   $S = 60,000 - (30,000 + 5,000) = 25,000$.
      *   This $25,000 is the *extra* value created by cooperating (selling together) rather than walking away.

  3.  **Select Relevant Formal Frameworks:**
      *   **Nash Bargaining Solution (NBS):** The gold standard for this. Maximizes the product of gains over the disagreement point. Usually implies splitting the *surplus* equally.
      *   **Shapley Value:** Focuses on marginal contributions. In a 2-person coalition, it often aligns with NBS, but good to mention for "contribution" focus.
      *   **Proportional Claims / Relative BATNA:** Some might argue split based on leverage.
      *   **Equal Split (Friend's Proposal):** Based on input (hours), not outcome/value.

  4.  **Calculate the Splits:**

      *   **Baseline (Disagreement Point):**
          *   User gets $30k.
          *   Friend gets $5k.
          *   Total = $35k.
          *   Deal Value = $60k.
          *   Cooperative Surplus = $25k.

      *   **Theory 1: Nash Bargaining Solution (NBS)**
          *   Logic: Rational agents split the *cooperative surplus* equally.
          *   Calculation:
              *   Surplus = $25,000.
              *   Half Surplus = $12,500.
              *   User Total = BATNA ($30k) + Half Surplus ($12.5k) = $42,500.
              *   Friend Total = BATNA ($5k) + Half Surplus ($12.5k) = $17,500.
          *   Does 50/50 match? No ($30k vs $30k).

      *   **Theory 2: Shapley Value**
          *   Logic: Average marginal contribution across all ordering permutations.
          *   Permutation 1 (User first): User adds $30k (BATNA). Friend adds remaining ($60k - $30k = $30k).
          *   Permutation 2 (Friend first): Friend adds $5k (BATNA). User adds remaining ($60k - $5k = $55k).
          *   User Average: ($30k + $55k) / 2 = $42,500.
          *   Friend Average: ($30k + $5k) / 2 = $17,500.
          *   *Note:* In 2-player games with transferable utility, Shapley and NBS often converge.
          *   Does 50/50 match? No.

      *   **Theory 3: Proportional to BATNA (Power Index)**
          *   Logic: Split based on relative leverage outside the deal.
          *   Ratio: 30:5 or 6:1.
          *   Total Pot: $60,000.
          *   User: (30/35) * 60,000 = ~$51,428.
          *   Friend: (5/35) * 60,000 = ~$8,571.
          *   *Critique:* This is usually seen as aggressive and ignores the mutual benefit of the deal. It treats the BATNA as the claim on the total, not just the baseline. I should present this but note it's less "fair" in cooperative theory.
          *   *Alternative Interpretation:* Some might argue splitting the *surplus* proportionally to BATNA.
              *   Surplus $25k.
