answer: |-
  This is a remarkably mature question for a high school junior. You are intuitively sensing a concept in economics and game theory called the **Disagreement Point** (or BATNA: Best Alternative to a Negotiated Agreement). Your friend is arguing from **Equity Theory** (input = hours), while you are sensing **Bargaining Theory** (leverage = outside options).

  In formal negotiation theory, effort (hours) is considered a "sunk cost." It does not determine value; only the future value of the asset and the alternatives if no deal is made determine the split. Because your outside option is significantly stronger than your friend's, you have more leverage.

  Here is the breakdown using three formal frameworks, followed by advice on handling the friendship.

  ### 1. The Nash Bargaining Solution
  **Recommended Split:** **You: $42,500 | Friend: $17,500**
  **Reasoning:** This standard economic model dictates that you should each keep your "walk-away" value first, and then split the *remaining* surplus equally.
  **Is 50/50 correct here?** **No.** The 50/50 split ignores the massive difference in your security if negotiations fail.

  *The Math:*
  1.  **Total Deal:** $60,000
  2.  **Your Walk-Away:** $30,000
  3.  **Friend's Walk-Away:** $5,000
  4.  **Cooperative Surplus:** $60,000 - ($30,000 + $5,000) = **$25,000**
  5.  **Split the Surplus:** You get $12,500 + $30,000 (base) = $42,500. Friend gets $12,500 + $5,000 (base) = $17,500.

  ### 2. The Shapley Value
  **Recommended Split:** **You: $42,500 | Friend: $17,500**
  **Reasoning:** This method calculates your average marginal contribution to the partnership across all possible orders of joining, which mathematically converges with the Nash solution in two-person deals.
  **Is 50/50 correct here?** **No.** It confirms that your contribution to the *final value* is higher because the project loses more value without you than without him.

  *The Math:*
  *   If you join first: You bring $30k (code), Friend adds $30k (to reach $60k).
  *   If Friend joins first: He brings $5k (design), You add $55k (to reach $60k).
  *   Your Average: ($30k + $55k) / 2 = $42,500.

  ### 3. Proportional Bargaining Power
  **Recommended Split:** **You: ~$51,400 | Friend: ~$8,600**
  **Reasoning:** This aggressive model divides the total pot strictly in proportion to the strength of each party's outside option (a 6:1 ratio based on $30k vs $5k).
  **Is 50/50 correct here?** **No.** This model suggests you should capture almost the entire value because your leverage is six times stronger.

  *The Math:*
  *   Ratio of leverage: 30:5 (or 6:1).
  *   Your Share: (6/7) * $60,000 = $51,428.

  ### 4. Equal Input (Your Friend's Proposal)
  **Recommended Split:** **You: $30,000 | Friend: $30,000**
  **Reasoning:** This psychological model argues that fairness is defined by equal effort (hours worked) rather than economic leverage or market value.
  **Is 50/50 correct here?** **Only if** you value the friendship more than the $12,500 difference identified by the Nash Bargaining Solution.

  ***

  ### The "Friendship Tax" and Practical Advice

  Mathematically, the **Nash Bargaining Solution ($42,500 / $17,500)** is the defensible, "fair" answer in economics. It acknowledges that you both deserve your walk-away money, and you both deserve an equal share of the *extra* value created by working together.

  However, you are not robots; you are friends since middle school. If you present the Nash equation to him, he may feel calculated and undervalued. He is looking at the **hours**, you are looking at the **leverage**.

  **Here is a recommended path forward:**

  1.  **Verify the Legal Reality (Crucial):** Before you negotiate, be honest with yourself: Do you legally own the code solely? If you built this as a partnership, he may have a legal claim to the code, meaning your $30,000 outside offer might vanish if he refuses to sign the rights over. If your outside option is legally shaky, your leverage drops, and the Nash split moves closer to 50/50.
  2.  **Reframe the Conversation:** Do not say, "My offer is worth more than yours." Instead, say, "I looked into what happens if we *don't* sell, and the numbers are really lopsided. If we walk away, I can get $30k and you can get $5k. That means working together creates an extra $25k. I think we should split that *extra* money 50/50."
      *   This validates his contribution (you are splitting the *gain* equally) while respecting your leverage (you keep your higher baseline).
  3.  **Consider a Compromise:** The Nash split gives you $12,500 more than the 50/50 split. Is your friendship worth $12,500? Many people would say yes.
      *   A **60/40 split ($36,000 / $24,000)** might be a beautiful middle ground. It acknowledges your higher leverage (you get more) but rewards his effort and preserves the relationship (he gets significantly more than the $17,500 Nash minimum).

  **Summary:** The formal theories strongly reject the 50/50 split, favoring a **$42,500 / $17,500** division. However, because you value the friendship, using that math as a starting point to negotiate a **60/40 compromise** is likely the wisest long-term move.
