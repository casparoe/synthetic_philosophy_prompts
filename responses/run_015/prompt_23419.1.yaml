prompt: |-
  I'm a high school junior, and I'm stuck on a negotiation with my friend and would like a careful second opinion. Over the past year, my friend and I have been building a small app together: I wrote essentially all of the code, and he handled the design, the marketing, and the customer relationships. We've just decided to sell it, and a company has offered $60,000 for the whole package. The buyer doesn't care how we divide that $60,000, so in principle we are free to split it any way we like. The problem is that we can't agree on the division.

  His proposal is a straight 50/50 split, on the grounds that each of us gave up roughly the same number of hours over the year, and he believes that is the only fair way to divide it. I've been uncomfortable with that, though, because I have a concrete outside option: I know a startup that would pay me $30,000 for the codebase alone if I walked away. He has told me that the most he could do on his own — take the design assets and the customer relationships to a local client — would bring in about $5,000. I can't quite articulate why his 50/50 feels wrong to me; on the surface, the idea that equal hours should mean an equal share sounds reasonable, and I don't want to come across as greedy. I have a vague sense that game theorists have developed a formal way to think about exactly this kind of problem — two people dividing a surplus when they have different walk-away options — and I'm wondering whether any of those methods would actually recommend a specific split here, or whether they merely say that any split in some range is defensible.

  If there is a defensible answer, what dollar split does it give, and what is the reasoning behind it? If you work through the formal options, please give, for each theory you consider, the specific dollar split it recommends and a one-sentence explanation of why it produces that number, and say whether his equal-split argument comes out as the right one under any of them. (For context: we've known each other since middle school, and I value the friendship, which is part of why I've been reluctant to push back hard.)
