      *   *Decision:* I will present the Nash solution as the theoretical ideal but add a "Reality Check" section about the legal risk of the outside option.

  11. **Final Polish:** Ensure the distinction between "Total Pot" and "Surplus" is crystal clear, as that's the key insight for the user.

