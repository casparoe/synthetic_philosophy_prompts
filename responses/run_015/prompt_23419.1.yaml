              *   Let's stick to the standard "Claim on Total" vs "Split Surplus". The "Claim on Total" is the most distinct alternative to NBS.
              *   Actually, a more common "fairness" heuristic outside game theory is **Equity Theory** (Input/Output). Friend argues Input (Hours) is equal. User argues Output/Value (BATNA) is unequal.
              *   Let's stick to the Game Theory request. NBS is the strongest. I will add a "Proportional Leverage" model just to show the range, but emphasize NBS.

      *   **Theory 4: Equal Split (Friend's Proposal)**
          *   Logic: Inputs (hours) are equal, so outputs should be equal.
          *   Calculation: $30,000 each.
          *   Game Theory Status: Ignores BATNAs. Only valid if BATNAs are equal or irrelevant (which they aren't).

  5.  **Synthesize the Advice:**
      *   **Tone:** Empathetic, objective, educational (since he's a HS junior), protective of the friendship.
      *   **Validation:** Validate his feeling. 50/50 *is* mathematically questionable given the BATNAs.
      *   **The "Magic Number":** The Nash Bargaining Solution ($42,500 / $17,500) is the most robust academic answer.
      *   **Friendship Context:** $42.5k vs $30k is a big difference for a HS student. But pushing for max theoretical value might hurt the friendship.
      *   **Strategy:** How to communicate this? Focus on the "Surplus" rather than the "Total."
      *   **Warning:** IP ownership. If they built it together, does the user *actually* own the code solely to sell to the startup? Usually, joint ventures imply joint IP. I need to add a disclaimer that the $30k offer might be contingent on clear title, which the friend might block. This is a crucial leverage point *and* risk.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the maturity of the question.
      *   *The Framework:* Define the "Cooperative Surplus."
      *   *The Calculations:*
          1.  Nash Bargaining Solution (The Gold Standard).
          2.  Shapley Value (Confirms Nash).
          3.  Equal Split (Friend's view).
      *   *The Friendship Factor:* Money vs. Relationship.
      *   *The IP Caveat:* Crucial practical advice. Can he actually take the $30k offer legally?
      *   *Recommendation:* Aim for the Nash split but be willing to compromise to save the friendship.

  7.  **Refining the Numbers:**
      *   Total: 60k.
      *   BATNAs: 30k (User), 5k (Friend).
      *   Surplus: 60k - 35k = 25k.
      *   Nash Split of Surplus: 12.5k each.
      *   Final Nash: User 42.5k, Friend 17.5k.
      *   Equal Split: User 30k, Friend 30k.
      *   Difference for User: 12.5k.
      *   Difference for Friend: 12.5k loss compared to Nash.

  8.  **Addressing the "Hours" Argument:**
      *   Game theory generally cares about *value*, not *effort*. Effort is sunk cost. Value is forward-looking.
      *   However, Equity Theory (psychology) cares about effort.
      *   I need to explain *why* game theory ignores hours (opportunity cost is captured in BATNA).

  9.  **Final Review against Constraints:**
      *   "Specific dollar split it recommends." -> Yes.
      *   "One-sentence explanation." -> Yes.
