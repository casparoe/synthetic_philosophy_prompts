answer: |-
  The Bureau's decision letter arrived while we were packing.

  "Grant denied," I told Elias. "Awarded to the Hendersons."

  Elias stopped folding shirts. "The Hendersons? Their issue was the patio heater."

  "Read the calibration sheet."

  He read aloud. "Applicant A: Floor is 'unsheltered.' Span is 'unsheltered to housed.' Grant provides one month's rent. Improvement: 0.14 spans."

  "And the Hendersons?"

  "Applicant B: Floor is 'manual heating.' Span is 'manual to automated.' Grant installs the thermostat. Improvement: 0.85 spans."

  "So," Elias said, "because their ladder is shorter, climbing it counts for more?"

  "Because a span is a span," I said. "Their 0.85 outweighs our 0.14. Total calibrated gain is maximized."

  "We stay on the street."

  "You remain at 0.14 above floor. They reach 0.85. The distribution is optimal."

  Elias taped the box shut. "Well. At least the units match."

  "Exactly," I said. "Perfectly comparable."
