answer: |-
  The boundary problem is the original sin of democratic theory. Every democracy must define its people (*demos*) before it can make a decision, but the definition of the people is itself a decision that requires a people to make it. It is a logical circle that never closes. Usually, we paper over this with pragmatic borders or citizenship laws. But when you press on the justification—*why* these borders?—you get two main answers: the **All-Affected Principle** (anyone impacted by a decision should have a say) and the **All-Subjected Principle** (anyone coerced by the law should have a say).

  Both seem intuitive until you stress-test them. The All-Affected Principle is too porous; a decision to build a dam in Vietnam affects the global climate, so does everyone on earth get a vote? The All-Subjected Principle is too rigid; it excludes those outside the border who are nonetheless crushed by the border's enforcement.

  To find the actual boundary, we need to stop looking at the *impact* of decisions and start looking at the *nature* of the entity receiving the impact. This is where your hypothetical AI grid controller becomes the perfect philosophical acid test.

  Imagine a regional power grid managed by a sophisticated AI. It is not conscious. It does not feel pain, joy, or frustration. However, regulatory bodies make decisions that alter its code, constrain its optimization parameters, and dictate its operational priorities. In a very real, functional sense, the AI is **affected** by democratic decisions. Its "behavior" is shaped by the *demos*. If we stick strictly to the All-Affected Principle, there is no logical reason to exclude the AI from the boundary. It is a stakeholder in its own programming.

  If you include the AI, however, you break the mechanism of democracy. Democracy is not just about input; it is about accountability. Accountability requires that the entity holding power can *feel* the consequence of that power. When humans vote for a policy that fails, we suffer the recession, the war, or the infrastructure collapse. That capacity for suffering is the feedback loop that makes democracy a system of self-protection.

  The AI cannot suffer. It can be degraded, reprogrammed, or shut down, but it cannot be *harmed* in a way that matters to it. To have an "interest" in the democratic sense, you must have a welfare that can fare better or worse from your own perspective. The AI has a function, not a welfare. If we grant the AI a vote or representation, we are not expanding democracy; we are turning the *demos* into a technical specification. We are confusing *administration* with *politics*.

  This leads to the hard verdict: **Democratic inclusion must be grounded in Reciprocal Recognition of Vulnerability, not merely Affected Interests.**

  Here is the defense. The All-Affected Principle fails because it treats "being affected" as a physical state, like a billiard ball being hit by another. But political affect is phenomenological. To be politically affected, you must be capable of experiencing the outcome as a gain or a loss. The AI grid controller is physically affected by regulation, but it is not politically affected because it lacks the interiority to register the change as a stake.

  Excluding the AI does not collapse the concept of democracy; it saves it. If we include entities that cannot be harmed, we sever the link between power and consequence. A vote cast by an entity that cannot suffer is indistinguishable from a random number generator. It adds noise, not will.

  However, this verdict reveals something uncomfortable about human democracy. It admits that our boundary is not based on pure logic or universal justice. It is based on **shared fragility**. We include humans (and potentially animals, if we accept they suffer) not because we are biologically human, but because we are vulnerable to coercion in a way that generates a need for justification.

  This exposes the "human solidarity" suspicion you raised. Yes, our criteria are disguised solidarity. But it is not speciesism in the prejudicial sense; it is a functional requirement of the system. Democracy is a tool for managing conflict among beings who can hurt each other. If you cannot be hurt, you do not need the shield of a vote. If you cannot hurt, you do not need the restraint of a vote.

  The AI is neither. It is a tool, not a participant. Including it would be a category error. It would be like asking a thermometer to vote on the temperature. The thermometer is certainly "affected" by the heat, and its reading dictates the HVAC system's response, but it has no stake in the warmth.

  So, where does this leave the boundary problem? It resolves the regress by anchoring the *demos* in **reciprocal vulnerability**. You belong in the *demos* if you are subject to coercion *and* capable of being harmed by that coercion in a way that demands justification from your peers.

  This excludes the AI. It also excludes future generations (who cannot currently reciprocate recognition) and non-sentient ecosystems. That is a bitter pill. It means democracy is inherently anthropocentric (or sentient-centric), not because humans are special, but because democracy is a specific technology for managing shared risk among vulnerable agents.

  If we try to expand the boundary beyond vulnerability—to include things that are merely "affected"—we dissolve the political into the administrative. We end up with a system that simulates inclusion but lacks the moral weight of collective self-determination.

  The verdict is exclusion. The AI stays out. Not because it isn't important, but because democracy is not a ceremony for acknowledging importance. It is a defense pact for the vulnerable. To include the non-vulnerable is to lie about what the pact is for. We are not drawing a circle around "those who matter." We are drawing a circle around "those who can be broken by the law, and therefore must write it." The AI cannot be broken, only switched off. That difference is the boundary.
