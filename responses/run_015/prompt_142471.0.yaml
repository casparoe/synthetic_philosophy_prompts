              1.  Distinction between three "mechanisms" (patient deterioration, model statistical signature, data pipeline).
              2.  Software analogy (regression vs. input distribution change vs. test definition).
              3.  What would settle the question vs. what cannot (surrogate decision rules).
          *   **Constraints:** British English. No citations/references. Define terms of art for lay members. No ontological appeals without practical difference. Strongest case for the losing side. Closing section on what would change the recommendation, where reasoning might fail, philosophical assumptions, and what cannot be determined before Thursday.
          *   **Length:** Max 2 pages.

  2.  **Determine the Recommendation:**
      *   *Option A (Vendor):* Recalibrate/retrain. Risk: Model might fundamentally miss the new presentation (Drug X masks early signs). ToR requires evidence of effectiveness in the *population*. Current evidence suggests drop in sensitivity.
      *   *Option B (Clinical):* Switch off for Drug X patients. Risk: Loss of coverage, but safer given the ToR constraint.
      *   *Option C (Suspension):* Suspend entirely? Too drastic if only 2 wards affected.
      *   *Decision:* The ToR is the binding constraint. "Evidence of clinical effectiveness in the population to which it is applied." The population has changed (Drug X patients). Evidence suggests effectiveness has dropped (sensitivity 70% -> 45%). Therefore, strictly speaking, the ToR is violated for this subgroup.
      *   *Recommendation:* Continue with defined restrictions (suspend for Drug X patients on those wards) while gathering evidence. Timeframe: 3 months. Trigger: Prospective validation study.
      *   *Reasoning:* The model relies on statistical signatures (tachycardia/fever). Drug X removes these signatures. The "mechanism" of deterioration might be physiologically similar (hypoperfusion), but the *model's mechanism* (statistical mapping) is broken for this group. The monitoring stack is doing its job (flagging the shift).

