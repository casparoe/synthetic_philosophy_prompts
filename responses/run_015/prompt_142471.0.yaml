          *   Two changes in February:
              1.  New bedside monitors (smoothing/clamping artefacts). Vendor says: recalibrate.
              2.  New enhanced-recovery pathway with "Drug X" (attenuates fever/tachycardia). Clinical team says: different mechanism, switch off for these patients. Vendor says: same terminal pathway, recalibrate/retrain.
          *   Audit (n=40): Sensitivity dropped 70% -> 45% in flagged subgroup (mostly Drug X). Numbers weak.
          *   Terms of Reference (ToR): Use only where supported by evidence of clinical effectiveness in the *population to which it is applied*.
      *   **Specific Requirements:**
          *   Actionable bottom line (Continue unrestricted / restricted / suspend) + timeframe + trigger.
          *   Reasoning clear enough for disagreement (clinician/lay member can see where to attack).
