      *   **Reasoning - The Three Mechanisms:** Address the user's first point. Distinguish Patient Physiology vs. Model Signature vs. Data Pipeline.
          *   Pipeline change (monitors) is manageable (recalibration).
          *   Patient Physiology change (Drug X) is the core issue.
          *   Model Signature: The model looks for fever/tachycardia. Drug X hides these. The link is broken.
      *   **Reasoning - The Software Analogy:** Address the user's second point.
          *   Is it a regression or input shift?
          *   Colleague's point: Tests define behaviour.
          *   Application: The "test" here is the ToR (clinical effectiveness). If the test fails (sensitivity drop), the behaviour is unacceptable regardless of physiological ontology.
      *   **Reasoning - Settling the Question:** Address the user's third point.
