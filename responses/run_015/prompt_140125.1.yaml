      *   *Resolution:* The book is likely inconsistent, OR it adopts a "meliorist" view (EU is ideal, but heuristics are useful shortcuts). However, strictly speaking, if violations are irrational (money pump), nudging to EU is correct. If untutored judgments are better, maybe EU isn't the right normative standard.
