  **Cost:** You lose your strongest metaphysical ground for anti-relativism. You must argue that the flat-earther is wrong because their hinges fail *within* a broader, shared human practice, not because they violate a freestanding normative truth. This makes your anti-relativism more pragmatic and less realist.

