  Here is the structural breakdown of your position, ranked by the severity of the internal tensions.

  ### 1. The Normative Gap (Severity: Critical)
  **Tension:** (1) vs. (8) [supporting: (4), (5), (6)]
  **The Conflict:** Commitment (1) defines hinges as arational scaffolding—they are not known, not justified, and demanding reasons for them is a category mistake. Commitment (8) asserts there is a "fact of the matter" about which hinge-set one *ought* to have, independent of community installation.
