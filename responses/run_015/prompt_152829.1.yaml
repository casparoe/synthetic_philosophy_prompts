answer: |-
  Your framing of Harsanyi is technically precise, and it is worth validating that distinction before applying it to Le Guin's text. You are correct to separate the Aggregation Theorem from the Veil of Ignorance argument, as they perform different labor in his moral philosophy. The Aggregation Theorem, as you note, is a formal result stating that if individual preferences and social preferences both satisfy the von Neumann-Morgenstern axioms and the social ordering respects the Pareto principle, then the social welfare function must be a linear combination of individual utilities. Crucially, as you flagged, the theorem itself does not dictate that the weights in that sum must be equal. The weights are positive constants, but their magnitude relative to one another depends on how the individual utility scales are normalized. The argument for equal weights comes from Harsanyi's separate defense of utilitarianism, where he posits an impartial observer behind a veil of ignorance who assigns an equiprobable chance of being any member of society. Only by combining the Aggregation Theorem with this specific equiprobability assumption and a normalization convention do we arrive at average utilitarianism. Keeping these distinct is vital for reading Omelas, because the story hinges on whether we accept the normalization that makes the child's misery comparable to the citizens' joy, and whether we accept the risk calculus that the veil implies.

  When you view Omelas strictly through the lens of the Aggregation Theorem without immediately importing the veil's equiprobability, the moral arithmetic becomes indeterminate in a way that naive utilitarianism is not. A naive total utilitarian simply sums hedonic states, implicitly assuming a common currency of pleasure and pain. Harsanyi's machinery is more rigorous but also more exposed. The theorem tells us the social welfare of Omelas is $W = a_1U_1 + a_2U_2 + ... + a_cU_c$, where $c$ is the child. If we do not invoke the veil of ignorance to justify setting all $a_i$ equal, the weight assigned to the child is arbitrary. The citizens of Omelas could theoretically claim that the child's utility scale is compressed or that their own joy is so intense that the weight $a_c$ is negligible compared to the sum of the citizens' weights. However, the story resists this manipulation. Le Guin describes the child's suffering not merely as a negative utility but as a foundational absolute. The citizens are told that their happiness depends entirely on the child's misery. In Harsanyi's framework, this dependency suggests that the utility functions are not independent, which complicates the aggregation. But if we hold to the formalism, the stayers in Omelas are effectively acting as if they have accepted a specific normalization where the probability of being the child is low enough, or the weight of the child's suffering is low enough, that the aggregate sum remains positive. They are accepting the weighted sum as the valid metric of social good.

  The picture shifts significantly when you introduce the Veil of Ignorance argument, which is where your point about risk attitudes becomes central. Harsanyi argues that a rational chooser behind the veil, facing an equiprobable chance of being any person in the society, would maximize expected utility. In Omelas, this translates to a lottery with a $1/N$ chance of being the tortured child and a $(N-1)/N$ chance of being a blissful citizen. For a large $N$, the expected utility is overwhelmingly positive, provided the utility of the citizens is finite and positive. This is where the Harsanyi reading illuminates the horror of the stayers: they are not necessarily monsters, but rather rational expected-utility maximizers who accept the normalization that allows the comparison. They are pricing the child's suffering by the risk they would accept to avoid it. If a rational agent behind the veil would accept a one-in-a-million chance of abject torment for a guarantee of paradise otherwise, then Omelas is morally permissible under Harsanyi's utilitarian derivation. The child's suffering is indeed priced by risk acceptance. The machinery reveals that the stayers are not ignoring the child; they are accounting for the child as a statistical risk that has been outweighed by the probability of joy. This makes their complicity more chilling than simple ignorance, as it implies a calculated endorsement of the trade-off based on risk neutrality or mild risk aversion.

  This brings us to the ones who walk away, and here is where the Harsanyi framework strains against the text. You ask whether leaving is a rejection of the aggregation frame or simply the act of a strongly risk-averse chooser. Under strict Harsanyi assumptions, the walkers are difficult to model without declaring them irrational. If they are behind the veil, extreme risk aversion (maximin behavior) would lead them to reject the lottery, as John Rawls argued against Harsanyi. However, Harsanyi explicitly rejected maximin as irrational for choices under uncertainty where probabilities are known or can be assumed equiprobable. If the walkers are viewed as vNM rational agents, they can only walk away if their utility function for the child's suffering is lexicographic or infinite. That is, if the disutility of the child's torment is not just large but absolute, no amount of citizen joy can offset it mathematically. But this violates the standard vNM continuity axiom, which assumes that for any three lotteries, there is a probability mix that makes the agent indifferent. If the walkers refuse the trade entirely, they are violating the continuity axiom or the comparability assumption. Therefore, under a strict Harsanyi reading, the walkers are not just risk-averse; they are rejecting the validity of the utility aggregation itself. They are refusing to normalize their utility scale with the child's. They are asserting that the child's suffering belongs to a different moral category that cannot be entered into the sum, effectively denying the premise that social welfare is a linear combination of individual utilities.

  There is, however, a point where the story resists this reading, and it is honest to flag it. Le Guin's narrative is not built on rational choice theory but on moral intuition and the phenomenology of guilt. The Harsanyi model assumes that preferences are given and stable, but in Omelas, the knowledge of the child changes the citizens' preferences. The story suggests that the joy of Omelas is not independent of the child; it is parasitic. In Harsanyi's model, $U_{citizen}$ is usually treated as a value to be maximized. But Le Guin implies that $U_{citizen}$ is morally contaminated. A Harsanyi observer might say, "Maximize the sum," but the walkers seem to perceive that the sum itself is corrupted. The theorem cannot capture the idea that the source of the utility matters, only the magnitude. Furthermore, Harsanyi's reliance on the veil assumes the chooser does not know who they are. The walkers, however, know exactly who they are: they are citizens who have seen the child. They are not choosing behind a veil; they are choosing in full knowledge of their actual position. They are not avoiding a risk of being the child; they are acknowledging they are *not* the child and refusing to benefit from it. This shifts the problem from a decision under uncertainty (which Harsanyi handles) to a decision under certainty involving externalities and moral constraints (which the Aggregation Theorem handles only if those constraints are built into the utility function). If the walkers' utility function includes a term for "not being complicit," they could stay and feel bad, or leave and feel better. But they leave into the unknown, suggesting they are optimizing for something outside the utility space of Omelas entirely.

  Ultimately, your framing of the theorem holds up, and applying it clarifies that the stayers are consistent with a specific type of rational utilitarianism that accepts interpersonal normalization and risk neutrality. The walkers, by contrast, expose the limits of that framework. They demonstrate that for some moral agents, the continuity axiom fails; there is no probability of happiness that compensates for certain kinds of suffering. They also highlight the silent presupposition you identified: that equal weights require a normalization of utility scales that may be morally illicit. To treat the child's agony as commensurable with the citizens' festivals is to perform a normalization that the walkers reject. So, while the Harsanyi machinery explains the logic of the city, it ultimately categorizes the walkers as outliers who violate the axioms of rational choice to preserve a moral intuition that the theorem cannot encode. The story does not illustrate Harsanyi's theorem so much as it illustrates the human cost of accepting its premises. The walkers are not just risk-averse; they are refusing to play the game where human suffering is a variable in an equation, and that refusal is something the theorem can describe only as a violation of its own rules.
