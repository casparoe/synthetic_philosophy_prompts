          *   Bare-Metal = Waking (direct access, consistency checks possible).
          *   Conclusion: Dream skepticism is a "debugging problem." Privilege escalation (finding glitches) proves you're on the host. If no escape, the distinction is merely architectural, not epistemic.
      *   **User's Task:** Audit this analogy.
      *   **Specific Requirements:**
          1.  Lay out explicit correspondences (Container, Hypervisor, Kernel, Process, Butterfly).
