      *   *Disanalogy 3: Consistency Checks.* In a container, you *can* sometimes detect virtualization (timing attacks, missing hardware features). In a perfect simulation (or a dream), consistency is maintained by the dreamer's mind.
          *   *Impact:* Harmful. Dreams feel consistent while in them. "Lucid dreaming" is rare, not the default.
      *   *Disanalogy 4: Symmetry.* Container $\neq$ Host. Butterfly $\leftrightarrow$ Zhuangzi.
