      *Self-Correction on "Pretense":* The prompt asks why legal reasoning *pretends* there's a cutoff without committing to hidden boundaries. Epistemicism *does* commit to hidden boundaries. So Epistemicism is disqualified by the prompt's own criteria ("without committing to hidden sharp boundaries"). I need to make sure I highlight that Epistemicism fails specifically because it *cannot* avoid that commitment, whereas Supervaluationism explains the *appearance* of the cutoff without the ontology.

      *Wait, one nuance:* Epistemicists argue we *should* commit to hidden boundaries. But the prompt asks which view accounts for the practice *without* committing. So Epistemicism is inherently the wrong tool for *this specific description of the practice*. I need to argue that Supervaluationism is the only one that *can* do what the prompt asks, making it the winner by default of fit, but I need to explain *why* it fits conceptually, not just verbally. It fits because it separates truth from supertruth. A verdict is "true enough" (supertrue) if it falls within admissible standards, even if no single sharp line exists.

      *Let's strengthen the Second-Order point:* Second-order vagueness is the vagueness of the boundary itself. In law, this is the uncertainty about how much discretion a judge has. Supervaluationism handles this by having vague sets of precisifications. Epistemicism handles this by positing a sharp line between "clearly reckless" and "borderline reckless," which implies we know exactly where the ignorance starts. That's implausible in law.

