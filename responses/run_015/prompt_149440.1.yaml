answer: |-
  Supervaluationism offers the superior account because it explains the binary nature of legal verdicts as a functional requirement of forced precisification rather than evidence of a hidden metaphysical boundary.

  Legal thresholds like "recklessness" function as ranges of admissible interpretation rather than discoveries of pre-existing facts. Supervaluationism captures this by treating a verdict as "supertrue" if it holds across all admissible precisifications of the legal standard. When a judge rules a defendant reckless, they are not identifying a hidden line in the sand, as epistemicism demands, but selecting one coherent precisification from a set of reasonable options to resolve the case. This explains the "pretense" of precision: the law requires a binary output (liable or not) for practical resolution, so the court must forcibly precisify the vague term, but the validity of the verdict relies on its admissibility within the community of legal interpretation, not on matching a hidden reality. This allows legal reasoning to maintain bivalence in verdicts without ontological commitment to a sharp boundary that everyone admits is unknowable.

  Epistemicism breaks down here because it cannot accommodate the normative flexibility inherent in legal standards without contradicting the practice it tries to explain. By insisting there is a fact of the matter regarding where negligence becomes recklessness, epistemicism implies that judges are either correct or incorrect about a hidden reality they cannot access. This makes nonsense of appellate review and judicial discretion; if there were a sharp hidden line, a lower court's decision within the "borderline" zone wouldn't be merely debatable, it would be objectively false, even if unknowably so. Furthermore, epistemicism fails to handle second-order vagueness coherently in this context. It posits a sharp boundary between the cases where we know the threshold applies and the cases where we are ignorant of the threshold. In law, however, the uncertainty about the boundary is itself gradual; there is no sharp line between "clearly within judicial discretion" and "unclear whether within discretion." Epistemicism forces a sharp cutoff on the ignorance itself, which contradicts the admitted fluidity of legal standards.

  Supervaluationism succeeds where epistemicism fails because it treats the boundary as a semantic tool rather than a metaphysical obstacle. It accounts for second-order vagueness by allowing the set of admissible precisifications to be vague itself; there is no sharp line between admissible and inadmissible interpretations of "reckless," mirroring the reality that judges often disagree on the scope of their own authority without one side being objectively wrong about a hidden fact. This view validates the legal practice of ruling definitively while acknowledging indeterminacy: the verdict is binding not because it found the hidden line, but because it successfully enacted a precisification that was admissible within the legal framework. Epistemicism demands we lie about our ignorance to preserve bivalence, while supervaluationism preserves the integrity of the reasoning by showing how bivalence is constructed for utility, not discovered in nature.
