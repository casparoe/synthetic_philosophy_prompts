answer: |-
  # Decision Tree: The Fate of the Analytic-Synthetic Distinction

  **ROOT COMMITMENT:**
  **"Is any statement immune to revision solely in virtue of meaning?"**
  *   **YES** (Some statements are analytic/immune) → *Go to Node 1*
  *   **NO** (All statements are revisable/Holism) → *Go to Node 1*

  ---

  **NODE 1: THE CONSERVATION CASE**
  **"When physicists preserve 'Energy is Conserved' by redefining 'energy,' is this primarily..."**
  *   **...a change of MEANING?** (The principle defines the term; the rule is fixed.) → *Go to Node 2*
  *   **...a change of BELIEF/PRAGMATICS?** (The principle is a central belief we choose to retain.) → *Go to Node 2*

  ---

  **NODE 2: THE CALIBRATION CASE**
  **"When a manual specifies 'Zero corresponds to State X,' is this rule..."**
  *   **...a CONVENTION?** (A stipulation for using the term/device.) → *Go to Node 3*
  *   **...an EMPIRICAL CLAIM?** (A factual assertion about the device's physics.) → *Go to Node 3*

  ---

  **NODE 3: THE LOGIC-REVISION CASE**
  **"If abandoning excluded middle saves a physical theory, does this..."**
  *   **...alter the MEANING of 'not'?** (Logic constitutes meaning; changing it changes the subject.) → *See Leaves Below*
  *   **...alter our BELIEFS about logic?** (Logic is a theory like any other; it can be wrong.) → *See Leaves Below*

  ---

  ### LEAVES (Position Classification)

  **Path 1: YES (Immune) → MEANING → CONVENTION → MEANING**
  *   **Position:** **Logical Empiricism (Carnapian)**
  *   **Description:** Distinct analytic truths exist. Frameworks are chosen by convention; internal truths are meaning-constitutive. Logic is part of the framework.

  **Path 2: YES (Immune) → MEANING → CONVENTION → BELIEFS**
  *   **Position:** **Moderate Conventionalism**
  *   **Description:** Analyticity exists for terms, but logic is treated as a tool open to adjustment without destroying meaning. (Rare/Tension-filled).

  **Path 3: YES (Immune) → MEANING → EMPIRICAL → MEANING**
  *   **Position:** **Unnamed/Underexplored**
  *   **Description:** Claims terms are defined by principles, but calibration is empirical. Tension: If calibration is empirical, how is the term definition fixed?

  **Path 4: YES (Immune) → MEANING → EMPIRICAL → BELIEFS**
  *   **Position:** **Kantian/Synthetic A Priori Leanings**
  *   **Description:** Some principles are immune (maybe logic), but operational rules are empirical. Meaning is stable, but application is factual.

  **Path 5: YES (Immune) → BELIEF → CONVENTION → MEANING**
  *   **Position:** **Unnamed/Underexplored**
  *   **Description:** Claims immunity exists, but conservation is belief-based. Logic is meaning-constitutive. (Inconsistent: Why is conservation immune if it's just belief?)

  **Path 6: YES (Immune) → BELIEF → CONVENTION → BELIEFS**
  *   **Position:** **Pragmatic Analyticity (Grice/Strawson-esque)**
  *   **Description:** Accepts a distinction but treats central principles as deeply held beliefs rather than strict definitions. Logic is revisable.

  **Path 7: YES (Immune) → BELIEF → EMPIRICAL → MEANING**
  *   **Position:** **Incoherent/Empty**
  *   **Description:** Claims immunity exists, but treats all test cases as empirical belief changes, yet insists logic changes meaning. Contradictory intuitions.

  **Path 8: YES (Immune) → BELIEF → EMPIRICAL → BELIEFS**
  *   **Position:** **Soft Empiricism**
  *   **Description:** Asserts some immunity in theory, but treats all practical cases as revisable beliefs. (Unstable position).

  **Path 9: NO (Revisable) → MEANING → CONVENTION → MEANING**
  *   **Position:** **Incoherent/Empty**
  *   **Description:** **FLAGGED:** Claims nothing is immune (Root=NO), but treats Conservation and Logic as meaning-constitutive (which implies immunity).

  **Path 10: NO (Revisable) → MEANING → CONVENTION → BELIEFS**
  *   **Position:** **Incoherent/Empty**
  *   **Description:** **FLAGGED:** Claims nothing is immune, but treats Conservation as meaning-change.

  **Path 11: NO (Revisable) → MEANING → EMPIRICAL → MEANING**
  *   **Position:** **Incoherent/Empty**
  *   **Description:** **FLAGGED:** Claims nothing is immune, but treats Logic as meaning-constitutive.

  **Path 12: NO (Revisable) → MEANING → EMPIRICAL → BELIEFS**
  *   **Position:** **Incoherent/Empty**
  *   **Description:** **FLAGGED:** Claims nothing is immune, but treats Conservation as meaning-change.

  **Path 13: NO (Revisable) → BELIEF → CONVENTION → MEANING**
  *   **Position:** **Tension/Unnamed**
  *   **Description:** Holist on root, but claims logic changes meaning. Quineans typically say logic revision *is* belief revision.

  **Path 14: NO (Revisable) → BELIEF → CONVENTION → BELIEFS**
  *   **Position:** **Quinean Holism (Radical Empiricism)**
  *   **Description:** No statement is immune. Conservation is a central belief. Calibration is a pragmatic convention. Logic is revisable belief.

  **Path 15: NO (Revisable) → BELIEF → EMPIRICAL → MEANING**
  *   **Position:** **Unnamed/Underexplored**
  *   **Description:** Holist on root, but treats logic as meaning-constitutive. (Similar to Path 13).

  **Path 16: NO (Revisable) → BELIEF → EMPIRICAL → BELIEFS**
  *   **Position:** **Quinean Holism (Naturalized)**
  *   **Description:** **FLAGGED FOR SEPARATION:** Functionally identical to Path 14. Distinguishes only on whether calibration is "convention" or "empirical," but for a Holist, this is a difference of degree, not kind.

  ---

  ### Separation and Coherence Flags

  *   **Incoherent Combinations:** Paths 9, 10, 11, 12, and 7 represent logical tensions. Specifically, answering "NO" to the Root (nothing is immune) while answering "MEANING" to Nodes 1 or 3 implies that some statements *are* immune by virtue of meaning, contradicting the Root.
  *   **Unclean Separation:** Paths 14 and 16 both map to **Quinean Holism**. The tree cannot cleanly separate a Holist who views calibration as a "convention" from one who views it as an "empirical claim," because Quine collapses the distinction between convention and empirical fact in practice.
  *   **Unclean Separation:** Paths 1 and 6 both lean toward **Analytic Defenses**, but Path 6 (Pragmatic Analyticity) is often indistinguishable from Path 1 in practice, differing only in whether the defender calls the immunity "meaning" or "deep belief."

  ---

  ### Reasoning and Design Notes

  **Why These Three Nodes?**
  This tree isolates the analytic-synthetic debate not through abstract definitions, but through stress-tests on specific kinds of statements.
  1.  **The Conservation Case** targets **theoretical principles**. This maps onto the debate between viewing laws of nature as discoveries (Synthetic) versus constitutive rules of a conceptual framework (Analytic/Conventional). It tests whether the reader sees "meaning" as something that can be protected from empirical refutation.
  2.  **The Calibration Case** targets **operational definitions**. This distinguishes between *Carnapian conventionalism* (rules are chosen stipulations) and *Realism* (rules describe physical facts). For a Quinean, this distinction blurs, making this node a key diagnostic for whether the reader sees a sharp line between language and world.
  3.  **The Logic-Revision Case** targets the **boundary of reasoning**. This is the hardest boundary for empiricism. If logic is revisable (Quine), the analytic-synthetic distinction collapses completely. If logic is constitutive of meaning (Traditional), the distinction survives at least at the core.

  **Debates Mapped**
  *   **Quine vs. Carnap:** The primary axis. Carnap occupies the "Immune/Meaning/Convention" quadrant; Quine occupies the "Revisable/Belief/Belief" quadrant.
  *   **Kantianism:** Captured by positions that assert immunity (Root=Yes) but treat principles as substantive beliefs rather than mere definitions (Node 1=Belief), reflecting the "Synthetic A Priori."
  *   **Pragmatism:** Captured by positions that accept revisability in principle but treat central beliefs as functionally immune due to their utility (Node 1=Belief/Pragmatics).

  **What Is Omitted**
  *   **Metaphysical Necessity (Kripke/Putnam):** This tree focuses on *epistemic* immunity (revision based on meaning) rather than *metaphysical* necessity. A reader might believe "Water is H2O" is necessary but knowable only empirically (necessary a posteriori). This view fits awkwardly here, likely landing in "Unnamed/Underexplored" leaves, as the tree assumes the traditional link between analyticity and necessity.
  *   **Social Externalism:** The tree assumes meaning is determined by individual usage or internal rules. It does not account for views where meaning is determined by community usage or external environment (Putnam/Burge), which would complicate the "Change of Meaning" branches.
  *   **Degree vs. Kind:** The tree forces binary choices. In reality, many philosophers (including Quine) argue the difference is one of degree (centrality of belief) rather than kind. The "Incoherent" flags often capture readers who sense this gradient but are forced to choose a binary switch.
