  so heres my niche take: occasionalism might actually be closer to an event-sourced architechture than hume's constant conjunction model is, because in hume causation is this regular connection in nature, but in event sourcing there's no inherent link between events except the ordering in the log — kinda like god emitting each event directly with no intermediate mechanism.

  can you argue for that position? specifically, defend the claim that al-ghazali's view maps onto event-sourced architectures better than humean causation does, and also respond to the objection that in software the event emitter still has internal causal logic, whereas god supposedly doesn't. keep it casual like you're chatting with a coworker, no need for formal citations or reading lists since i cant check them anyway. also i misspelled occassionalism on purpose so dont stress the spelling.
