answer: |-
  ### Design Log: Candidate Payoff Structures

  Before settling on the final matrix, I tested three structures. The goal was to find a $3 \times 3$ matrix where Row 3 ($R3$) is not strictly dominated by Row 1 ($R1$) or Row 2 ($R2$) individually, but *is* strictly dominated by a 50/50 mixture of $R1$ and $R2$.

  *   **Candidate 1 (The Intuitive Trap):**
      *   $R1: [10, 0, 10]$
      *   $R2: [0, 10, 10]$
      *   $R3: [6, 6, 6]$
      *   *Result:* Discarded. The mixture ($5, 5, 10$) does not dominate $R3$ because $5 < 6$ in the first two columns. Participants would correctly identify $R3$ as undominated.
  *   **Candidate 2 (The Near Miss):**
      *   $R1: [10, 0, 10]$
      *   $R2: [0, 10, 10]$
      *   $R3: [4, 4, 9]$
      *   *Result:* Discarded. While the mixture ($5, 5, 10$) dominates $R3$ ($5>4, 5>4, 10>9$), the Column player's incentives were hard to balance without making the game zero-sum, which can feel too adversarial for a community group. It also stalled at a $2 \times 2$ cycle after elimination, preventing a clean "solution."
  *   **Candidate 3 (The Survivor):**
      *   Adjusted to ensure a unique solution via Iterated Elimination of Dominated Strategies (IEDS) after the mixed strategy reveal, and calibrated for integer arithmetic.
      *   *See below.*

  ---

  ### The Survivor: Game Matrix & Arithmetic

  **The Setup:** This is a Zero-Sum Game for clarity of incentives. **Row** wants to maximize points. **Column** wants to minimize Row's points (which equals maximizing their own "Savings").

  **The Matrix (Row's Payoffs):**

  | | **Col 1 (C1)** | **Col 2 (C2)** | **Col 3 (C3)** |
  | :--- | :---: | :---: | :---: |
  | **Row 1 (R1)** | 10 | 12 | 11 |
  | **Row 2 (R2)** | 0 | 10 | 11 |
  | **Row 3 (R3)** | 4 | 4 | 9 |

  **The Arithmetic of Dominance:**

  1.  **Pure Comparison (The Trap):**
      *   Compare $R3$ vs $R1$: $R3$ wins in C1 ($4 > 0$). **$R1$ does not dominate $R3$.**
      *   Compare $R3$ vs $R2$: $R3$ wins in C1 ($4 > 0$). **$R2$ does not dominate $R3$.**
      *   *Participant Conclusion:* "R3 is safe. It beats R1 sometimes and R2 sometimes."

  2.  **Mixed Comparison (The Discovery):**
      *   Create a **Portfolio**: 50% chance of playing $R1$, 50% chance of playing $R2$.
      *   Calculate Expected Payoff (Average):
          *   vs C1: $(10 + 0) / 2 = \mathbf{5}$
          *   vs C2: $(12 + 10) / 2 = \mathbf{11}$
          *   vs C3: $(11 + 11) / 2 = \mathbf{11}$
      *   Compare **Portfolio** vs **$R3$**:
          *   C1: $5 > 4$
          *   C2: $11 > 4$
          *   C3: $11 > 9$
      *   *Result:* The Portfolio yields strictly higher points than $R3$ against **every** possible Column move. **$R3$ is strictly dominated by the mixture.**

  3.  **Iterated Solution (After $R3$ is removed):**
      *   **Column's Turn:** Column wants low numbers. Compare $C3$ (11, 11) vs $C1$ (10, 0). $C1$ is always lower. **$C1$ dominates $C3$.** Eliminate $C3$.
      *   **Row's Turn:** Matrix is now $R1/R2$ vs $C1/C2$.
          *   $R1$: 10, 12
          *   $R2$: 0, 10
          *   $R1$ is higher in both. **$R1$ dominates $R2$.** Eliminate $R2$.
      *   **Column's Turn:** Matrix is $R1$ vs $C1/C2$.
          *   $C1$: 10
          *   $C2$: 12
          *   $C1$ is lower. **$C1$ dominates $C2$.**
      *   **Final Solution:** $(R1, C1)$ with payoff 10.

  ---

  ### Logistics & Grouping

  *   **Participants:** 9 Adults.
  *   **Grouping:** 3 Tables of 3 participants.
  *   **Roles (Rotated every 2 rounds):**
      1.  **Row Player:** Decides the Row strategy.
      2.  **Column Player:** Decides the Column strategy.
      3.  **Referee:** Holds the "Dominance Ledger" and calculates payoffs.
  *   **Currency:** "Merit Points." No money changes hands.
      *   Row Player earns points from the Matrix.
      *   Column Player earns "Savings Points" (20 minus Row's score). This ensures Column wants to minimize Row's score without dealing with negative numbers.
      *   *Example:* If Row scores 10, Column gets 10 Savings. If Row scores 4, Column gets 16 Savings.
      *   Highest total points (Row + Savings) across all rotations wins "Choice of Next Month's Topic."

  ---

  ### Activity Flow (90 Minutes)

  #### 1. Introduction (10 mins)
  *   Distribute matrices. Explain Row maximizes, Column minimizes (via Savings).
  *   Define **Strict Dominance** simply: "Strategy A beats Strategy B if A gives you more points than B, no matter what the other person does."

  #### 2. Phase 1: Pure Strategy Elimination (25 mins)
  *   **Task:** Tables discuss and eliminate any strategies that are strictly dominated by *another single strategy*.
  *   **Rule:** You must agree as a table. Submit your "Active Strategy List" to the Facilitator.
  *   **Predicted Outcome:** Tables will keep $R1, R2, R3$ and $C1, C2, C3$. They will correctly see that $R3$ is not beaten by $R1$ or $R2$ alone.
  *   **The Wall:** When they submit, you (Facilitator) check their list against the **Dominance Ledger** (a card you hold).
  *   **The Reveal:** If a table submits $R3$ as "Active," the Ledger rules: **"REJECTED. Strategy R3 is dominated by Portfolio (50% R1 / 50% R2)."**
  *   *Note:* You do not explain why. The rulebook says Portfolios count. They must do the math (averaging) to verify the rejection.
  *   **Action:** They cross out $R3$.

  #### 3. Phase 2: Iterated Elimination (25 mins)
  *   Now that $R3$ is gone, the matrix is smaller.
  *   **Task:** Continue eliminating dominated strategies until only one cell remains.
  *   **Flow:**
      1.  Column sees $C3$ is worse than $C1$ (now that $R3$ is gone). Eliminate $C3$.
      2.  Row sees $R1$ beats $R2$. Eliminate $R2$.
      3.  Column sees $C1$ beats $C2$. Eliminate $C2$.
  *   **Result:** All tables converge on $(R1, C1)$.

  #### 4. Play & Verification (20 mins)
  *   Rotate roles. Play 3 rounds using the *solved* strategies.
  *   Verify that deviating from the solution yields lower scores.

  #### 5. Debrief (10 mins)
  *   Map the experience to definitions.
  *   **Pure Dominance:** "Why did we keep R3 at first?" (Because it beat R1 and R2 in Col 1).
  *   **Mixed Dominance:** "What changed?" (We allowed ourselves to randomize/average).
  *   **Iteration:** "Why did C3 survive until R3 was gone?" (Because against R3, C3 was okay. It only became dominated once R3 was removed).

  ---

  ### Predicted Pitfalls & Recovery

  1.  **Arithmetic Anxiety:**
      *   *Risk:* Participants freeze at "50% mixture."
      *   *Recovery:* The Referee role has a calculator or is allowed to do the addition on scratch paper. Emphasize: "Just add the two numbers and divide by two."
  2.  **"But I Won with R3!":**
      *   *Risk:* In Phase 1 play, someone plays $R3$ against $C1$ and gets 4 points, while $R1$ would have gotten 0. They argue $R3$ is good.
      *   *Recovery:* Remind them: "Dominance isn't about winning one round. It's about guaranteeing a better result in *every* possible round. The Portfolio gets 5 against C1. 5 is better than 4."
  3.  **Column Confusion:**
      *   *Risk:* Column players try to maximize Row's score by accident.
      *   *Recovery:* Reinforce the "Savings Points" scheme. "Do you want 10 Savings or 16 Savings?" (They want 16, which means Row gets 4).
  4.  **The "Facilitator Knows" Bias:**
      *   *Risk:* They look at you for confirmation.
      *   *Recovery:* Point to the Ledger. "The Ledger says R3 is out. I don't make the rules, I just enforce them."

  ---

  ### Limitations: What You Must Supply

  **The Activity Cannot Reproduce:** *Why we mix in real life.*
  In this game, mixing is a mathematical tool to find dominance. In real game theory (Nash Equilibrium), mixing is often about *making the opponent indifferent*.
  *   **Your Task:** In the debrief, you must clarify: "Today, we used mixing to *eliminate* a bad strategy. In more advanced games, you use mixing to *become* the strategy you play, to keep your opponent guessing. This activity only teaches the elimination power of mixing, not the equilibrium power."

  ---

  ### Extension: Weak Dominance & Order Dependence (Time Permitting)

  If the group moves fast, run a 15-minute "Hard Mode."

  **The Change:** Adjust $R2C1$ from **0** to **10**.
  *   New $R2$: $[10, 10, 11]$.
  *   New $R1$: $[10, 12, 11]$.
  *   Now $R1$ **Weakly Dominates** $R2$ (10=10, 12>10, 11=11). It is never worse, and sometimes better.

  **The Lesson:**
  1.  **Order Dependence:** If you eliminate $R2$ first, the solution holds. But if you eliminate a Column strategy first based on a weak tie, you might accidentally remove a column that would have made $R2$ viable.
  2.  **Strict vs. Weak:**
      *   **Strict Dominance (Phase 1):** Order **does not matter**. If $A > B$ and $B > C$, then $A > C$. You can eliminate in any sequence and reach the same result.
      *   **Weak Dominance (Phase 2):** Order **matters**. Eliminating a strategy that is only "equal or better" can destroy the context needed to see another dominance relationship.

  **Facilitator Script:** "In the first game, you could have eliminated R3, then C3, then R2 in any order and got the same answer. That is a special property of *Strict* Dominance. In this Hard Mode, if you eliminate the wrong tie first, you might break the chain. That is why economists prefer Strict Dominance when possible—it's robust."
