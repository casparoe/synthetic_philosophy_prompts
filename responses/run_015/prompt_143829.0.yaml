answer: |-
  **Project Title:** The Collapse of Rule-Following: Exhaustion, Finitude, and Skepticism

  **Statement of the Question**
  This project asks whether the skeptical challenge to rule-following contains two structurally independent arguments rather than one. The standard presentation—the Underdetermination Argument—relies on the finitude of a speaker's past usage: because past applications are finite, multiple incompatible rules fit the data, and nothing fixes which rule was meant. I propose that there is a second route, the Collapse Argument, which does not rely on finitude. In cases where a rule's domain is bounded and exhaustively used (e.g., a pricing rule for orders of 1–99 units applied to every integer in that range), the speaker has left no case unused. Yet, incompatible rules still fit the exhausted history. The question is whether the Collapse Argument is genuinely independent of the Underdetermination Argument, and if so, whether the standard taxonomy of responses—fact-based accounts versus assertibility-based accounts—fails to distinguish which responses survive which argument.

  **Hypothesis and Commitment**
  I hypothesize that the Collapse Argument is independent and that it defeats a specific class of responses that survive the Underdetermination Argument. Specifically, dispositional accounts and communitarian accounts often solve Underdetermination by appealing to what the speaker *would* do in new cases or what the community *would* accept. The Collapse Argument renders these appeals vacuous. When the domain is exhausted, there are no "new cases" within the rule's scope to ground dispositions, and no future community practice within the domain to ground assertibility. The meaning of the rule must therefore rest entirely on the exhausted past. If the past underdetermines the rule even when exhaustive, then appeals to potential future behavior are not just epistemically inaccessible but constitutively irrelevant.

  I commit to the view that the Collapse Argument reveals a deeper normative problem than Underdetermination: it targets the possibility of normativity in closed practices. The deliverable for this fellowship will be a complete manuscript draft comprising three interconnected papers: one establishing the independence of the arguments, one testing dispositional and communitarian responses against Collapse, and one addressing the boundary objection detailed below.

  **Why Existing Positions Leave This Open**
  Current literature treats the skeptical challenge as monolithic. Responses are designed to bridge the gap between past usage and future extension. Fact-based accounts look for a state in the past that dictates the future; assertibility-based accounts look for conditions under which future claims are warranted. Both assume the rule is open-ended. They leave the Collapse question open because they do not account for rules that are essentially bounded. If a rule is defined by a closed domain, the "future" is outside the rule's jurisdiction. A dispositionalist might say "I would have charged differently for 100 units," but if the rule is *only* for 1–99, that disposition is irrelevant to the meaning of the rule as actually practiced. The existing taxonomy assumes that meaning is essentially projectible. The Collapse Argument challenges whether meaning requires projectibility at all. By failing to distinguish closed from open domains, existing responses silently assume away the problem of exhaustion.

  **Methodology**
  Over twelve months, I will not produce a critical survey nor propose a new positive theory of meaning. Instead, I will employ a method of conceptual isolation and stress-testing.
  1.  **Months 1–3:** Formalize the Collapse Argument. I will construct specific case studies of bounded rules (pricing, legal statutes with sunset clauses, game rules) to ensure the "exhaustion" condition is met without ambiguity. I will distinguish these from cases where the boundary is merely unknown.
  2.  **Months 4–8:** Test responses. I will take the leading non-skeptical accounts (dispositional, communitarian, primitivist) and run them against the Collapse cases. I will analyze whether their reliance on counterfactuals ("what would you do?") collapses when the counterfactuals lie outside the rule's domain.
  3.  **Months 9–12:** Synthesis and Objection Handling. I will integrate the findings into the manuscript and address the primary objection (see below).

  This method is chosen over a standard literature review because the literature assumes the Underdetermination structure. A survey would replicate that assumption. It is chosen over proposing a new solution because the priority is to map the logical space accurately before attempting a repair. If the Collapse Argument holds, many proposed repairs are targeting the wrong vulnerability.

  **The Boundary Objection**
  The most serious objection is that the Collapse Argument is the Underdetermination Argument in disguise. The objection states: the domain restriction itself is rule-governed. To mean "stop at 99" is itself subject to skeptical challenge (e.g., "stop at 99" vs. "stop at 99*"). Therefore, the boundary is just another site for quus-style skepticism, and the problem reduces to finitude of boundary-marking usage.

  I argue this objection is not fatal, and the project will defend this stance. The objection conflates the *definition* of the domain with the *application* within it. The Collapse Argument accepts, *arguendo*, that the boundary is fixed by context or stipulation. Even if the boundary itself is skeptical, the problem of meaning *within* an exhausted domain remains distinct. Underdetermination says: "You haven't done enough cases to fix the rule." Collapse says: "You have done all the cases there are, and it still isn't fixed." The first is a problem of quantity; the second is a problem of completeness. If a speaker has applied a rule to every single instance permitted by the domain, appealing to "what they would do at the boundary" changes the subject to the boundary rule, not the original rule. The project will defend the independence of the arguments by showing that skepticism about the boundary does not resolve skepticism about the exhausted interior.

  **Possible Conclusions**
  1.  **Independence Confirmed:** The Collapse Argument is distinct. Dispositional and communitarian accounts fail because they rely on open-endedness. This requires a significant revision of the anti-skeptical landscape, potentially favoring primitivist or normative accounts that do not rely on behavioral extension.
  2.  **Reduction Confirmed:** The Collapse Argument reduces to Underdetermination because boundaries are always skeptical. The project still succeeds by proving that all rule-following skepticism ultimately rests on finitude, simplifying the dialectic.
  3.  **Hybrid:** The arguments are distinct but only jointly fatal. This would suggest that solutions must address both finitude and exhaustion simultaneously.

  **Scope and Timeline**
  Is this a one-year project or a three-year project? Establishing the logical independence of the Collapse Argument and testing the major responses against it is a one-year task. The conceptual machinery required is contained, and the case studies are limited. However, developing a full positive theory of meaning that survives the Collapse Argument is a three-year project. This fellowship supports the former: the diagnostic work. I will deliver a complete manuscript draft that establishes the independence thesis and maps the fallout for existing responses. This is a viable one-year goal because it restricts the aim to dismantling the current taxonomy rather than rebuilding the theory of meaning from scratch. If the Collapse Argument holds, the rebuilding becomes the necessary next step, but the demolition is the priority and is achievable within the fellowship period.
