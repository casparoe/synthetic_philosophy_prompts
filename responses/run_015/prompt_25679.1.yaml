  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Works on RLHF (Reinforcement Learning from Human Feedback) pipelines at an AI lab. Familiar with technical jargon (reward models, policy gradients, KL constraints, specification gaming, mesa-optimizers, etc.).
