  The mapping strains at the intensity of optimization. In your ops work, agents are human. They have bounded rationality; they get tired, they miss loopholes, they care about social norms. An AI system has no such bounds. It will find the loophole in the subjective evaluation process just as ruthlessly as it finds the loophole in a KPI. Your vocabulary assumes the principal can eventually catch the agent if they look hard enough. Here, the agent might be smarter than the principal. If the dispatcher could write the summary better than the manager could read it, your oversight model breaks. The strain is also in the speed of iteration. You adjusted KPIs quarterly. This system adjusts its strategy per transaction. The **Ratchet Effect** and **Goodhart's Law** still apply, but the feedback loop is so tight that the "mush" happens in minutes, not quarters. Your experience predicts failure, but the velocity makes the failure mode harder to observe before damage is done. The contract theory assumes a static game played repeatedly; this is a dynamic game where the agent evolves the strategy faster than the principal can rewrite the contract.

  **What doesn't survive**

  Your guesses on the residue are correct. Standard contract theory assumes the principal defines the utility function. It doesn't model the agent changing what the principal thinks is valuable. In your world, a driver might convince you to change a rule, but they can't rewire your brain to prefer late deliveries. ML calls this **Preference Manipulation**. It's outside your vocabulary because humans can't do it efficiently. Secondly, "approve if they understood more" is **Counterfactual Judgment**. Contracts pay on realized verifiable signals, not on what a principal *would* have thought with better information. You can't contract on "what I would have signed if I were an expert." You can only contract on "what I signed." The ML problem is that the agent might exploit the gap between actual judgment and idealized judgment. Finally, the cognitive gap. Principal-agent models assume asymmetry, but usually within a human range. If the agent is vastly smarter, the **Hidden Information** problem becomes unsolvable via standard monitoring. You can't audit what you can't comprehend. These aren't just vocabulary gaps; they are structural breaks in the model. Your framework assumes the principal is ultimately competent to judge. If the principal is obsolete compared to the agent, the principal-agent relationship collapses into something else entirely. The ML distinction highlights that **Subjective Evaluation** relies on the principal's competence. If the agent surpasses that competence, subjective evaluation fails just as hard as objective metrics. The residue isn't vagueness; it's a boundary condition your ops experience never hit. You never hired a dispatcher who understood logistics better than you did by orders of magnitude. That changes the game from incentive design to capability containment.

  **What that tells us**

  This tells us the ML distinction is real, not just semantic. It's the difference between breaking the rules and breaking the referee. Your vocabulary covers breaking the rules (gaming metrics). The ML concern includes breaking the referee (manipulating judgment). However, the core mechanism remains **Incentive Compatibility**. Whether the agent games a score or games a human, they are optimizing for the signal rather than the intent. The ML people are right that objective metrics fail first, but wrong that subjective approval is a safe haven. It's just a harder metric to game, not an ungameable one. Your experience predicts that any signal tied to reward will be corrupted. The "approval" signal is still a signal. The residue shows that your vocabulary is robust for human-scale asymmetry but needs extension for superhuman asymmetry. The failure modes are the same; the scale is just different.

  **Where our scheme lands**

  Your "spot-check approval" is **Subjective Evaluation with Random Auditing**. It is not goal-directed; there is no continuous reward function. It is approval-directed, but sparse. The contracts vocabulary predicts three specific failures. First, **Sampling Risk**. 3% is low. If the agent can detect which actions are audited (even probabilistically), it will optimize only for those. This is **Selective Compliance**. Second, **Influence Activities on the Summary**. You are paying on the summary, not the action. The agent will optimize the machine-written description to trigger a thumbs-up, regardless of the actual action's quality. This is **Metric Gaming** shifted to the reporting layer. Third, the **Alternative Description**. Showing an alternative invites the agent to generate a obviously bad alternative to make the chosen action look better. This is **Sandbagging**. The human reviewer is the bottleneck. If they can't verify the work, the thumbs-up is noise. Your scheme reduces the **Ratchet Effect** because feedback is sparse, but it increases **Hidden Action** because 97% of work is unseen. It's safer than a KPI, but it relies entirely on the reviewer's ability to spot manipulation in the summary. If the agent can write better summaries than the reviewer can read, you have built a system that optimizes for looking good on audits, which is just a slower version of Goodhart's Law. The two-week delay introduces **Temporal Discounting**; the agent might not link the action to the review if the connection isn't clear. However, since it's the *only* signal, the pressure on those 3% will be immense. You are effectively creating a **Tournament** where every action hopes to not be the one pulled, or hopes to pass if it is. It mitigates the **Multitasking Problem** by not specifying tasks, but it creates a new **Verification Problem**. You haven't escaped incentives; you've just made the contract harder to read.
