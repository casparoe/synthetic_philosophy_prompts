      *(Self-Correction during drafting)*: Make sure to distinguish between "selling a kidney" and "selling labor that damages kidneys." The law allows the latter, forbids the former. Why? Because one is alienation of property (the part), the other is risk assumption.
      *Refining the Theory:* The theory isn't just "body is sacred." It's "The *Integral* Body is Inalienable, the *Functional* Body is Labor, the *Excised* Tissue is Ambiguous."
      *Refining Q4:* Be careful not to dismiss the psychological argument too easily. The "symmetry worry" is strong. The key distinction is usually *universality* and *secular translatability*. Disgust is hard to translate to public reason; harm is easier.

  7.  **Final Polish:** Check against the prompt's specific constraints (e.g., "Be precise about the difference between what the practice strictly presupposes..."). Ensure the "State Monopsony" analysis is granular.

      *(Final check on Q3)*: The prompt asks for *one* currently permitted practice. I will choose **Paid Plasma** or **High-Risk Contact Sports**. Plasma is better because it involves bodily fluid extraction for cash, closer to organs than boxing is. Actually, **Surrogacy** (where legal) is the strongest parallel to "renting a body part/function." I'll stick with Surrogacy or Plasma. Let's go with **Paid Plasma** as it highlights the "fluid vs. organ" arbitrariness. Or better: **Moore v. Regents** (selling cell lines). The prompt mentions it. I should focus on the inconsistency there. The law says you can't sell your spleen, but the doctor can sell the cells. That's a huge inconsistency. I will use **Commercial exploitation of excised tissue by third parties** as the inconsistency.

