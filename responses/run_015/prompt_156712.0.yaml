answer: |-
  Here is a reconstruction of the moral logic underlying the legal regime you describe, followed by the four analyses you requested.

  ### 1. Reconstructing the Implicit Moral Theory

  The legal pattern you describe is not random; it is the jurisprudential footprint of a specific moral theory I will call **Constitutive Inalienability**.

  **The Core Thesis:** The human body is not property that the self *owns*; rather, the body is constitutive of the self. Therefore, while the *labor* of the body can be rented (wages), and *surplus* or *regenerative* materials can be gifted or compensated (plasma, hair), the *integral, vital structures* of the person cannot be alienated for value without destroying the moral status of the person as a subject rather than an object.

  **Strict Presuppositions:**
  1.  **The Subject/Object Distinction:** A person must remain a moral agent (subject). Turning a vital body part into a commodity (object) collapses this distinction. This strictly presupposes that price transforms the *nature* of the transaction, not just the risks.
  2.  **The Non-Property Rule:** You cannot own yourself in a way that allows for severance for profit. This explains why consent is not a defense in organ sales; you lack the legal capacity to consent to your own commodification.
  3.  **The Regenerative/Integral Boundary:** There is a moral difference between parts that grow back or are excess (sperm, hair, plasma) and parts that are finite and vital (kidneys, hearts). The law presupposes this biological distinction maps onto a moral one.

  **What Merely Fits Well:**
  1.  **Altruism as Purification:** The preference for gifting fits well with the idea that removing money preserves the "sacred" nature of the act. It suggests the act is one of solidarity, not commerce. However, the theory does not *strictly* require altruism, only non-commodification. A state stipend could theoretically work if not framed as a "price."
  2.  **Risk Tolerance:** The permission of risky jobs (logging, boxing) fits well with the idea that risking the body is different from selling the body. It implies the body is a tool for living, but not a stock of spare parts.

  **Where It Is Underdetermined:**
  1.  **Excised Tissue Property Rights:** The *Moore v. Regents* ruling (you have no property right in excised tissue, but doctors can patent it) is a major fracture. Constitutive Inalienability suggests the tissue remains linked to the person's dignity. The law here is underdetermined: it could have said "no one owns it" or "the donor owns it." Instead, it says "the donor cannot own it, but capital can." This suggests a secondary theory of **Utilitarian Innovation** overriding the dignity principle once the tissue is separated.
  2.  **Surrogacy:** The uneven prohibition on paid surrogacy is underdetermined. If the womb is a vital part, it should be inalienable. If it is labor, it should be sellable. The law fluctuates because it cannot decide if pregnancy is *making a person* (sacred) or *providing a service* (labor).

  ### 2. The Test Case: State Monopsony for Kidneys

  **The Scenario:** A state monopsony (single buyer) with fixed pricing, high safeguards, anonymity, and lifetime care.

  **Application of Constitutive Inalienability:**
  *   **Verdict:** **Forbidden.**
  *   **Reasoning:** The theory forbids the *commodification* of the integral self. A statutory price is still a price. It establishes a market value for a kidney, rendering it fungible. The state acting as the buyer does not remove the "market norm"; it institutionalizes it. The donor becomes a supplier of parts, violating the Subject/Object distinction.

  **Application of Exploitation/Coercion Theory (Alternative):**
  *   **Verdict:** **Permitted.**
  *   **Reasoning:** If the worry is merely that private markets prey on the poor, the state monopsony with fixed pricing and cooling-off periods mitigates coercion. The transaction is mutually beneficial and safe.

  **Feature Variation Analysis:**

  1.  **Allow Negotiation:**
      *   *Constitutive Inalienability:* Still Forbidden (price is the issue).
      *   *Exploitation Theory:* **Flips to Forbidden.** Negotiation introduces power asymmetry and potential coercion, reviving the harm concern.
      *   *Work Done:* Negotiation is the trigger for the Exploitation theory, but irrelevant to the Inalienability theory.

  2.  **Allow Private Buyers:**
      *   *Constitutive Inalienability:* Still Forbidden.
      *   *Exploitation Theory:* **Flips to Forbidden.** Private buyers maximize profit incentives, increasing risk of coercion and medical negligence.
      *   *Work Done:* Private ownership exacerbates the harm, but again, doesn't touch the core dignity violation.

  3.  **Drop Cooling-Off Period:**
      *   *Constitutive Inalienability:* Still Forbidden.
      *   *Exploitation Theory:* **Flips to Forbidden.** Consent is deemed invalid without reflection.
      *   *Work Done:* This feature is purely procedural safeguards for consent, irrelevant to the ontological status of the kidney.

  4.  **Replace "Price" with "Compensation for Loss" (Full Wage Replacement + Bonus):**
      *   *Constitutive Inalienability:* **Flips to Permitted (Borderline).** If the payment is framed strictly as indemnity for lost labor and health impact (like worker's comp) rather than "price per organ," it might pass.
      *   *Work Done:* This is the critical flip. The theory hinges on the *semantic and economic framing* of the transfer. If it is a "salary for recovery," it is labor. If it is "value of the part," it is sale.

  **Conclusion:** The feature doing the real work for the dominant legal theory is the **existence of a price mechanism** itself, not the safeguards surrounding it.

  ### 3. Consistency Check: The Condemned Practice

  If we apply **Constitutive Inalienability** honestly, one currently permitted practice stands out as indefensible: **The Commercial Plasma Industry.**

  **The Inconsistency:**
  Plasma is a constituent part of the blood. While regenerative, its extraction is physically taxing, carries health risks, and is overwhelmingly driven by economic necessity among the poor (the "plasma poor"). It is a bodily substance extracted for a fixed price, processed, and sold by pharmaceutical companies for profit.
  *   *Theory Application:* If a kidney cannot be sold because it reduces the person to a warehouse of parts, plasma extraction reduces the person to a biological resource mine. The distinction between "vital organ" and "regenerative fluid" is biologically real but morally thin when the motivation is profit and the donor is economically vulnerable.
  *   *Required Legal Change:* A consistent application of the theory would require the nationalization of plasma collection (gift-only systems like in the UK or parts of Canada) or a total ban on compensation, treating plasma exactly like whole blood.

  **Why this is not Gerrymandering:**
  One might argue I am cherry-picking plasma to make the theory look good. However, the theory *must* condemn plasma if it condemns kidneys, unless it relies on the "vital vs. regenerative" distinction. But the law already undermines that distinction by banning the sale of *eggs* (in many jurisdictions) which are regenerative, while allowing plasma.
  If the theory cannot condemn plasma, it admits that its true boundary is not "commodification of the body" but "commodification of *visible, surgical* body parts." This reveals the theory is actually about **Aesthetic Dignity** (don't cut people open for money) rather than **Constitutive Inalienability**. If the theory retreats to Aesthetic Dignity, it loses its moral weight and becomes mere squeamishness. Thus, to maintain moral seriousness, it must condemn plasma.

  ### 4. The Psychological Story and Legal Authority

  **Does the etiology of the intuition matter?**
  The fact that opposition to organ markets tracks "purity/sanctity" intuitions (Haidt's Moral Foundations) rather than harm-based reasoning does not automatically invalidate the rule, but it does shift the burden of justification.

  **The Symmetry Worry:**
  You ask: *Harm and Fairness also have evolutionary etiologies; why debunk Sanctity and not them?*
  *   **Response:** The distinction lies in **Secular Translatability**.
      *   *Harm/Fairness:* These intuitions can be translated into public reasons accessible to those who do not share the intuition. "I feel disgust at assault" translates to "Assault causes pain and violates autonomy," which a non-disgusted person can understand.
      *   *Sanctity/Purity:* These intuitions often resist translation. "Selling a kidney is degrading" often bottoms out at "It is degrading." If the degradation is not measurable in harm (the donor is healthy, richer, and consents), the rationale remains internal to the specific moral community that holds the sanctity view.
      *   *Conclusion:* The psychological origin matters because Sanctity intuitions are less amenable to the **Public Reason** required in a pluralistic liberal democracy. Debunking them isn't about saying "evolution made it, so it's false," but "evolution made it, and it doesn't generate reasons we can share with dissenters."

  **Institution vs. Intuition:**
  Does it matter if the *law* has an independent rationale (e.g., maintaining trust in the transplant system)?
  *   **Yes.** If the prohibition is maintained solely to appease the disgust sensitivity of the majority, it is illiberal. However, if the prohibition is maintained because a market system would *actually* undermine trust (causing fewer donations overall, or deterring patients from seeking care for fear of being harvested), then the law rests on **Consequentialist Institutional Stability**, not moral purity.
  *   **The Catch:** Empirical evidence on this is mixed. Some markets increase supply; some decrease trust. If the law relies on the "Trust" argument, it must be empirically falsifiable. If the trust argument is merely a proxy for "people feel yucky about it," we are back to square one.

  **Legal Authority and Contested Morality:**
  Finally, what does a legal system presuppose when it criminalizes conduct on a rationale half the population rejects?
  *   **The Liberal Dilemma:** In a liberal order, the state is supposed to be neutral between competing conceptions of the "good life." Constitutive Inalienability is a specific conception of the good (the body is a temple, not a shop).
  *   **The Authority Claim:** By criminalizing organ sales, the state asserts that there is an **Objective Moral Truth** about human dignity that transcends individual consent. It presupposes that citizens are not the best judges of their own moral worth.
  *   **The Risk:** If the rationale is purely sanctity-based, the state is enforcing a "comprehensive doctrine" (Rawls). This erodes legitimacy among those who view their bodies as their own property. To maintain authority, the state must argue that the ban protects the *social fabric* (a public good) rather than the *moral soul* of the donor (a private good).
  *   **Final Verdict:** The psychological story undermines the rule *if* the rule claims to be based on rational harm prevention. If the rule admits it is based on preserving a specific cultural understanding of human dignity, it is honest but politically fragile. The law cannot have it both ways: it cannot claim to protect the poor from harm (when they say they are helped) and protect society from "degradation" (which is subjective) without revealing that it values a specific moral orthodoxy over individual liberty.
