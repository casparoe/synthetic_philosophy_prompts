  2.  **Question 1: Reconstructing the Implicit Moral Theory:**

      *   *Observation:* The law distinguishes between *gift* (okay), *market* (bad for organs, okay for fluids/tissue), *risk for wage* (okay), *property in excised tissue* (no), *sex/death* (taboo).
      *   *Candidate Theories:*
          *   *Kantian Dignity:* Persons are ends, not means. Selling a kidney treats the body as a tool/thing.
          *   *Sacredness/Inalienability:* The body is a temple or a trust, not property.
          *   *Market Norms vs. Social Norms:* Sandel's argument. Money corrupts the meaning of the act.
          *   *Exploitation/Coercion:* Worry about the poor being forced. (But this doesn't explain why *rich* people can't sell either).
          *   *Commodification:* Certain things lose value if priced.
      *   *Synthesis:* The most robust theory that fits the *specific shape* (gift yes, sale no; fluids yes, organs no; risky jobs yes) is a hybrid of **Inalienable Dignity** and **Anti-Commodification of the Integral Self**.
      *   *Distinctions:*
          *   *Strict Presupposition:* The body (specifically vital/constitutive parts) is not property that can be alienated for value.
          *   *Fits Well:* The distinction between "regenerative/replaceable" (blood, hair, sperm) and "constitutive/vital" (kidney, heart). The distinction between "work" (using the body) and "selling the body" (removing parts).
          *   *Underdetermined:* Why is surrogacy banned in some places but not others? Why is plasma okay but not whole blood donation (in some systems)? The property right in excised tissue (Moore v. Regents) is a major outlier that contradicts the "body is not property" rule unless framed as "body is not property *while attached*."

