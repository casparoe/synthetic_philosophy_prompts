      *   *Stronger Candidate 2:* **Plasma/Sperm.** If the principle is "no body parts for money," why are fluids/gametes okay? The theory needs to rely on "regenerative vs. non-regenerative." But plasma extraction is physically taxing.
      *   *Selection:* **Paid Plasma.** It's a bodily substance, extracted for money, often by the poor. If the kidney ban is about commodification of the self, plasma is a weak boundary.
      *   *Legal Change:* If the theory were consistent, plasma markets should be banned or state-monopolized like blood (in some countries).
      *   *Gerrymandering Check:* Is this just picking holes? No, because the distinction (regenerative vs. vital) is biologically real but morally arbitrary in terms of *commodification*. Selling the *use* of a kidney (dialysis patient renting a healthy person's filtration?) is banned, but selling the *use* of a back (heavy lifting) is not.

  5.  **Question 4: The Psychological Story (Disgust/Sanctity vs. Reason):**

      *   *The Worry:* If the ban is based on "yuck factor" (disgust sensitivity), is it irrational?
      *   *Debunking:* Haidt shows moral intuitions come first, reasoning second. Disgust is evolutionary (pathogen avoidance).
      *   *Symmetry:* Harm and Fairness also have evolutionary roots (reciprocal altruism, threat detection). Why debunk Sanctity but not Harm?
      *   *Response:* The *source* of an intuition doesn't validate or invalidate it, but it warns against *overconfidence*. However, Sanctity is more culturally variable and less universally actionable than Harm (pain is pain).
      *   *Institution vs. Intuition:* Even if the *voter* feels disgust, the *Law* might rely on systemic trust (if people think organs are bought, they won't donate).
      *   *Authority:* Criminalizing based on a contested moral view (half the population disagrees) challenges liberal legitimacy. It suggests the law is enforcing a specific "comprehensive doctrine" (Rawls) rather than public reason.
      *   *Conclusion:* The psychological origin doesn't make it wrong, but it makes it fragile as a sole justification. It needs a secular, public rationale (e.g., trust in the medical system) to hold up in a pluralistic society.

  6.  **Drafting the Response:**

