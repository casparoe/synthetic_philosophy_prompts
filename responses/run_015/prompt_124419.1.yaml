      *   *Critique:* The user worries these are just one problem in three hats.
      *   *My Assessment:* They are distinct but related. (1) is about *weight* of identical complaints. (2) is about the *unit of moral concern* (life vs. moment). (3) is about the *existence* of a complaint. Conflating them leads to the "intuition-mongering" charge because contractualists shift grounds depending on which case is presented. Separating them forces a structural commitment.

  3.  **Address the Audience Skepticism:**
