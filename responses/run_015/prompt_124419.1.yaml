answer: |-
  **Project Title:** Disaggregating Aggregation: A Structural Diagnosis of Contractualist Constraints

  **Project Summary and Core Question**
  Standard objections to Scanlon-style contractualism charge that its prohibition on aggregation renders it unable to handle cases where many small burdens outweigh one large burden. The standard dialectic treats "aggregation" as a monolithic problem: either numbers count, or they don't. This project argues that the "aggregation problem" is actually a conflation of three structurally distinct issues:
  1.  **Cross-Person Headcount:** Does the mere existence of $N$ identical complaints outweigh one identical complaint?
  2.  **Intra-Personal Summation:** Why is it permissible to sum burdens within a single life over time, but impermissible to sum identical burdens across distinct lives?
  3.  **The Threshold Problem:** Do burdens below a certain magnitude generate *any* complaint at all, even when aggregated effects are catastrophic?

  Current literature focuses disproportionately on (1). My core hypothesis is that (1) is a red herring; the theoretical viability of contractualism depends on resolving the tension between (2) and (3). If contractualism can sum within a life (2) but not across lives (1), it requires a principled account of personal unity that does not smuggle in aggregation. If it allows thresholds (3), it requires an account of "generic reasons" that does not rely on arbitrary cut-offs.

  **The Question:** *Does the contractualist constraint against aggregation stem from a single principle (the separateness of persons), or does it rely on three distinct structural constraints that have been erroneously conflated?*

  A determinate answer requires showing whether a single modification to the *Formula of Reasonable Rejection* can solve (2) and (3) without collapsing into (1). If the solution to all three requires simply recalibrating the "strength of complaint" metric, the project fails (see Failure Conditions). If the solutions require distinct structural adjustments, contractualism is more complex but more robust than critics allow.

  **Critique of Standard Setups**
  The committee is rightly skeptical that contractualism is anything more than intuition-mongering. This skepticism is fueled by the standard dialectic, which allows contractualists to shift grounds depending on the case.
  *   **Saving Numbers via Tie-Breakers:** Proposals that allow numbers to count only when complaints are "equal" solve (1) but leave (2) and (3) untouched. They rely on a procedural trick rather than a substantive account of why numbers matter.
  *   **Broadening the Complaint:** Arguing that the lone victim has a complaint about "the practice" rather than the specific loss solves (1) but undermines the individualism contractualism claims to protect.
  *   **The Metric Trap:** Most defenses boil down to asserting that $N$ small complaints simply do not sum to a weightier complaint than one large one. This is a restatement of the intuition, not an argument.

  To avoid question-begging, this project will not rely on external moral intuitions (e.g., "it feels wrong to ignore the many"). Arguments must be **internal**: they must derive from the definition of *justification to others*. If a principle cannot be explained as a requirement for relating to others as rational equals, it is ad hoc.

  **Honesty Check: Does the Trichotomy Collapse?**
  There is a significant risk that (1), (2), and (3) are indeed one problem wearing three hats. If the solution to all three is simply "Complaint Strength is non-linear," then the trichotomy is illusory.
  *   *Why they might be distinct:* (1) concerns *comparative weight* between agents. (2) concerns the *unit of moral concern* (temporal parts vs. whole lives). (3) concerns the *semantic existence* of a grievance.
  *   *Why they might collapse:* If the "strength of a complaint" is a function $f(burden, context)$, and adjusting $f$ solves all three, then the structural distinction is fake.
  *   *My bet:* They are distinct. (2) relies on a theory of personal identity/time; (3) relies on a theory of significance/noticeability. (1) relies on a theory of fairness. Conflating them allows contractualists to hide inconsistencies.

  **Methodology (12 Months)**
  I will not compare contractualism to utilitarianism or bolt on a Priority View. That concedes the ground that contractualism is incomplete. I will test the internal coherence of the *Reasonable Rejection* formula.

  *   **Months 1–3: Conceptual Mapping.** Formalize the three problems. Construct case pairs where (1) varies while (2) and (3) are held fixed, and vice versa. *Deliverable:* A taxonomy of aggregation cases showing where standard contractualist responses contradict each other.
  *   **Months 4–6: The Intra-Personal/Threshold Nexus.** Focus on (2) and (3). Develop a principle of "Temporal Sovereignty" that permits intra-personal summation without permitting inter-personal summation. Test this against the Threshold Problem: if burdens are too small to complain about individually, does temporal summation revive them? *Deliverable:* Draft of central argument regarding the unit of moral concern.
  *   **Months 7–9: Stress-Testing.** Apply the "Skeptic's Test." Assume the committee's view: that any distinction drawn here is just intuition-mongering. Can I derive the distinctions from the *requirement of justification* alone? If I say "you can sum within a life," is that because lives are special, or because summing is actually okay? *Deliverable:* Refutation of the "Metric Trap" objection.
  *   **Months 10–12: Synthesis and Drafting.** Assemble the argument. Determine which of the Candidate Conclusions (below) is supported. *Deliverable:* Final manuscript.

  **Why this approach?**
  Comparing to utilitarianism (the obvious alternative) is useless for this committee; they already know contractualism fails utilitarian benchmarks. The goal is to show contractualism is *internally* consistent, not that it beats consequentialism. Bolting on a Priority View admits defeat. The work must be reparative, not replacement.

  **Candidate Conclusions**
  1.  **The Structural Pluralist View:** (1), (2), and (3) require three different modifications to contractualism. (Most robust, highest risk of complexity).
  2.  **The Metric Collapse:** All three problems reduce to a single issue of measuring complaint strength. Contractualism needs a better metric, not new principles. (Deflationary).
  3.  **The Threshold Priority:** (3) is the foundational problem. If we solve the "vanishing complaint," (1) and (2) resolve themselves. (Novel, shifts focus entirely).
  4.  **The Incompatibility Thesis:** Contractualism can solve (2) or (3), but not both. It must abandon strict individualism to handle thresholds. (Damaging to the theory).

  *Decision Criteria:* I will decide between these based on **derivability**. Which conclusion can be derived from the core idea of "mutual recognition" without adding external moral premises? If only (2) or (4) survives that test, that is the result.

  **Failure Conditions**
  **The Year is Wasted If:** The final output is merely a new proposal for how to calculate the "strength of a complaint." If the solution to the aggregation problem turns out to be "we just need to weigh complaints differently," I have not advanced the structural understanding of the theory; I have just tweaked the inputs. The project fails if it does not address *why* the structure of justification permits summation in one context but not another.

  **Most Likely Failure Mode**
  You asked for bluntness: The project will likely bottom out in **complaint measurement**. It is highly probable that (2) and (3) cannot be distinguished from (1) without a substantive theory of well-being or harm that contractualism explicitly tries to avoid relying on. If I find that distinguishing Intra-Personal Summation from Cross-Person Headcount requires a controversial metaphysical claim about personal identity, the project collapses into metaphysics, not moral theory.

  **Scope and Cuts**
  This is too big for 12 months if I treat all three problems equally.
  **The Cut:** I will minimize focus on **Problem (1) (Cross-Person Headcount)**. The literature is saturated with "Save the Numbers" arguments. They are a dead end for a fellowship proposal because the committee has read them all.
  **The Focus:** I will devote 70% of the time to the interaction between **(2) Intra-Personal Summation** and **(3) The Threshold Problem**. This is the under-theorized nexus. If contractualism allows you to sum small burdens over a lifetime (2) but not across people (1), it must explain why a lifetime is a moral unit but a population is not. That is where the "intuition-mongering" charge is most vulnerable and where a structural repair is most valuable.

  **Non-Question-Begging Argument Defined**
  For this committee, an argument is question-begging if it assumes the truth of contractualist intuitions to defend contractualist structures. A non-question-begging argument must show that the proposed distinction (e.g., between intra- and inter-personal summation) is a **necessary condition for the possibility of justification**, not just a feature that matches our pre-theoretic judgments. If I cannot explain why a principle is required for *relating as equals* without referencing the *outcome* of the principle, I have failed.
