          *   Months 7-9: Stress-testing against skepticism (The "Intuition" charge).
          *   Months 10-12: Drafting/Refining.
          *   *Why not Priority View?* That's external. The goal is internal repair.
      *   **Candidate Conclusions:**
          1.  Trichotomy holds; (2) & (3) require modifying the "generic reason" structure.
          2.  Trichotomy collapses; it's all about complaint measurement (The Risk).
          3.  Contractualism cannot solve (3) without abandoning individualism.
          4.  (1) is a red herring; the theory lives or dies on (2).
      *   **Failure Condition:** If the only output is a new formula for "complaint strength," the project failed. It must address the *structural* justification.
