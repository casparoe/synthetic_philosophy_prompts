      *   *Check:* Is the method specific enough? *Adjustment:* Make the months distinct phases of argument construction, not just "research."
      *   *Check:* Is the failure condition stark enough? *Adjustment:* Make it about the collapse into metric-fixing.
      *   *Check:* Is the 2-page limit respected? *Adjustment:* Keep it dense. No fluff.

  7.  **Final Polish:** Ensure the distinction between the three problems is sharp.
      *   (1) is *Weight* (same burden, more people).
      *   (2) is *Unity* (same person, many burdens vs. many people, one burden).
      *   (3) is *Existence* (burden too small to count).
      *   *Crucial Insight:* If (2) is allowed but (1) is not, we need a principle of "Personal Sovereignty over Time" that doesn't rely on aggregation. If (3) is allowed (thresholds), we need a principle of "Significance" that isn't arbitrary.

