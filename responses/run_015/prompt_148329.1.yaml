answer: |-
  ### The Principle of Fair Coordination and Reasonable Notice

  To capture the pattern of your verdicts without contradiction, I propose the **Principle of Fair Coordination and Reasonable Notice**. This principle distinguishes between conventions that manage fairness and scarce resources versus those that manage expression and etiquette, while conditioning obligation on the visibility of the norm.

  The principle consists of four clauses:

  1.  **The Fairness Constraint:** A visitor commits a moral wrong if they breach a convention that functions as an essential mechanism for the fair distribution of scarce resources or public order, thereby securing an unfair advantage over others.
      *   *Motivating Case:* **Case 2 (London Queue).** Queueing is a cooperative system for allocating limited space. Pushing forward gains time at the expense of others waiting, violating distributive fairness.
  2.  **The Epistemic Condition:** Moral obligation to adhere to a convention presupposes that the norm is reasonably observable or knowable to an outsider; hidden, unwritten, or hyper-local rules do not bind the ignorant.
      *   *Motivating Case:* **Case 5 (Swedish Cake).** The rule is unwritten and specific to a single office. A new employee cannot reasonably be expected to know it, rendering the violation a social mistake rather than a moral failure.
  3.  **The Harmless Deviation Rule:** Breaches of expressive, ceremonial, or non-coercive norms are not moral wrongs if they inflict no material disadvantage on others, even if they cause symbolic offence or awkwardness.
      *   *Motivating Cases:* **Case 1 (Japan Tip), Case 3 (Berlin Jaywalking), and Case 6 (Moroccan Souk).** In these instances, the violations are either self-sacrificing (paying more in the souk, tipping in Japan), harmless to third parties (jaywalking at 3 a.m.), or merely symbolic. They do not disrupt a fair allocation system.
  4.  **The Reciprocity Exception:** Adherence to transactional conventions is not required if the local counterpart has first breached a prior duty of basic respect or contractual good faith.
      *   *Motivating Case:* **Case 4 (US Service Charge).** The server's rudeness forfeits their claim to the customary gratuity, permitting the customer to withhold payment despite the convention.

  ### Resolving Your Tension

  You asked whether the difference between Case 2 and Cases 1, 3, and 6 is coordination-value, foreseeable harm, or knowledge. Under this principle, it is primarily **coordination-value regarding fairness**.

  *   **Case 2** is wrong because it violates the *Fairness Constraint* (Clause 1). It disrupts a system designed to prevent unfair advantage.
  *   **Cases 1, 3, and 6** are permissible under the *Harmless Deviation Rule* (Clause 3). Tipping (Case 1) and not bargaining (Case 6) may cause symbolic offence or disrupt ritual, but they do not steal time or space from peers. Jaywalking (Case 3) breaks the law but lacks victims.
  *   **Knowledge** acts as a threshold condition (Clause 2). It explains why Case 5 is excused (hidden rule) while Case 2 is not (queues are publicly observable). However, knowledge alone does not make a breach wrong; one can knowably break a harmless norm (Case 3) without moral fault.

  ### Application to New Cases

  **1. The Digital Coworking Desk**
  *   *Situation:* A visitor moves a personal item to claim a desk, unaware of the silent "item reservation" convention.
  *   *Analysis:* This situation sits between Case 2 (resource allocation) and Case 5 (obscure norm). Desks are scarce resources, suggesting the *Fairness Constraint* (Clause 1). However, the method of claim (silent item placement) is an "emerged" and unwritten norm, lacking the public visibility of a physical queue.
  *   *Verdict:* This is closer to **Case 5**. Under the *Epistemic Condition* (Clause 2), a visitor cannot be bound by a silent, unwritten signalling system that is not readily apparent. Moving the item is a social mistake born of ignorance, not a moral wrong, provided there were no visible signs indicating the policy.
  *   *Caveat:* If the desk had a sign stating "Reserved by Item," the *Epistemic Condition* would be met, and the verdict would shift to Case 2 (moral wrong), as the visitor would then be disrupting a fair coordination mechanism knowingly.

  **2. The Eye Contact Visitor**
  *   *Situation:* A visitor maintains intense eye contact, respectful in her culture but aggressive in the host culture.
  *   *Analysis:* Eye contact is an expressive norm, not a mechanism for resource allocation. It falls under the *Harmless Deviation Rule* (Clause 3). While it causes discomfort (symbolic offence), it secures no unfair advantage over peers and causes no material harm.
  *   *Verdict:* **No moral wrong.** Like the tipper in Case 1, the visitor acts clumsily and perhaps insensitively, but she does not violate a moral duty. She is bound by local practices only when those practices protect fairness or safety, not when they govern cultural expression.

  ### Limitations and Required Revisions

  While this principle saves all six of your original verdicts, I must be explicit about two tensions where your intuitions require nuance for the principle to remain coherent.

  **1. The Degree of Wrongness in Case 2**
  Your verdict in Case 2 states the visitor has done "something wrong, though not as wrong as malicious queue-jumping." My principle establishes a binary: the act is either wrong (Clause 1) or not (Clause 3). It validates that the act is *wrong*, but it does not account for the *mitigation* of blame due to cultural background.
  *   *Revision:* To fully accommodate your verdict, the principle requires a supplementary clause on **Culpability**: *Moral blame is mitigated where the violation stems from deep-seated cultural habit rather than disregard for local welfare.* Without this, the principle explains the wrongness but not the reduced severity you identified.

  **2. The Hierarchy of Harms (Case 1 vs. Case 2)**
  To maintain that Case 1 (insulting the host) is *no moral wrong* while Case 2 (inconveniencing the queue) *is*, this principle implicitly ranks **fairness harms above dignitary harms**.
  *   *Revision:* If you believe that causing deep offence to a host *is* a moral wrong (distinct from clumsiness), then Case 1 must be revised. However, given your verdict, the principle holds that moral obligations regarding conventions are primarily about **cooperative fairness**, not **cultural assimilation**. If you value assimilation as a moral duty, Case 1 would need to be reclassified as a minor moral wrong.

  In summary, the principle holds that visitors are bound by local practices only when those practices are visible and essential for fairness. Where conventions are merely expressive or obscure, the visitor is permitted to deviate without moral fault.
