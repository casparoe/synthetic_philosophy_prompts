answer: |-
  # Doc: The People Problem (Year 1 Summary)
  **Participants:** Sam (Substantive Populist) & Pat (Procedural Pluralist)  
  **Status:** Still alive, somehow.  
  **Goal:** Map where we bleed vs. where we stand together.

  ---

  ## 1. Shared Claims (The "We Both Sign This" List)
  *After 12 months, here's what we agree is actually happening in the world, regardless of what we think it means.*

  1.  **Populist Assertions:** We agree that populist movements *always* claim to represent a unified "real people" against a corrupt elite. We disagree on whether that "real people" actually exists, but we agree the rhetoric is consistent.
  2.  **Arrow-Style Aggregation:** We both accept that mathematically, you can't perfectly aggregate individual preferences into a group preference without running into contradictions (cycling, dictatorship, etc.). Perfect consistency is impossible.
  3.  **Brexit/Close Referenda:** We agree that a 52-48 vote does not reveal a single, unified "will." It reveals a margin of victory. Sam thinks the will is there but messy; Pat thinks the will is a post-hoc story we tell about the margin.
  4.  **The Inverse Collective Action Problem (ICAP):** We agree on our own invention: When framing effects are strong enough, individual preferences flip so easily that the group cannot hold a stable will long enough to act. We agree this happens. We disagree on whether it proves the will is fake (Pat) or just fragile (Sam).
  5.  **Elite Mediation:** We agree that no large-scale political decision happens without some elite mediation (ballot design, media framing, counting rules). There is no "pure" direct democracy.

  ---

  ## 2. Disagreements Table
  *Where we still fight. Wording checked by both sides to ensure no strawmanning.*

  | Topic | Substantive Populist (Sam) | Procedural Pluralist (Pat) |
  | :--- | :--- | :--- |
  | **Ontology of "The People"** | "The people" is a latent moral entity that exists even when silent. Politics is about *discovering* this will. | "The people" is a legal fiction created by the process. Politics is about *constructing* a temporary majority. |
  | **Function of Elections** | An election is a measurement tool. If it's noisy (like Brexit), you need better measurements, not fewer votes. | An election is a conflict resolution tool. It decides who rules, not what the truth is. Noise is a feature, not a bug. |
  | **Institutional Blockers** | When courts or banks block a vote, it's a pathology. It means the system is fighting the host body. | When courts or banks block a vote, it's hygiene. It means the system is preventing temporary madness from becoming permanent law. |
  | **ICAP Interpretation** | If framing flips preferences, the people are being manipulated by elites. The true will is what remains when manipulation stops. | If framing flips preferences, there is no "true will" underneath. Preferences are created by the framing. There's nothing left to find. |

  ---

  ## 3. The Cruxes
  *The specific bets that would change our minds.*

  ### Crux A: Collective Intentionality
  **The Question:** Does a group "will" something only if they share a mental state, or is it enough that they follow the same procedure?

  *   **Concrete Case:** A spontaneous mass protest vs. a union strike.
      *   *Scenario:* 100k people show up to a square shouting the same slogan (Protest) vs. 100k union members voting to strike based on a negotiated contract (Union).
  *   **Sam's Prediction:** The Protest shows more "real will." It's organic and shared mental state. The Union is just bureaucracy.
  *   **Pat's Prediction:** The Union shows more "real will." It's stable, counted, and procedural. The Protest is just情绪 (emotion) and framing susceptibility.
  *   **Update Mechanism:** If the Protest leads to stable policy change without forming a procedure, Sam wins. If the Protest dissolves into chaos while the Union negotiates lasting change, Pat wins.

  ### Crux B: Democratic Legitimacy
  **The Question:** Can a decision be legitimate if it violates the "authentic popular will" but follows all the rules?

  *   **Concrete Case:** A Supreme Court overturns a popular referendum law on rights grounds.
      *   *Scenario:* 60% vote to ban X. Court says banning X violates constitutional rights and strikes it down.
  *   **Sam's Prediction:** This is illegitimate democracy. It breaks the link between people and power. It invites populist backlash because the will was blocked.
  *   **Pat's Prediction:** This is peak legitimacy. It protects the system from itself. The "will" was temporary; the rights are permanent.
  *   **Update Mechanism:** If the backlash leads to democratic collapse (authoritarianism), Sam wins (proof that blocking will breaks the system). If the system stabilizes and rights are preserved without collapse, Pat wins (proof that procedure protects democracy from will).

  ---

  **Next Steps:**
  Stop arguing about definitions. Start looking at data on preference stability (ICAP) and post-referendum stability (Crux B). Meet in two weeks. Bring coffee.
