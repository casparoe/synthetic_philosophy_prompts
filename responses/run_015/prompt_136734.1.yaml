answer: |-
  Here is your Q&A battle plan. The room is split between two tribes: the **Metaphysicians** (who want to know what *exists*) and the **Philologist** (who wants to know what the text *does*). Your strategy is to tell the Metaphysicians you aren't playing their game (ontology) and tell the Philologist you aren't ignoring the game (soteriology), you're just modeling the mechanics differently.

  Time limit per answer: **2 minutes max**. If you go longer, you look defensive.

  ### 1. The Opener: "Isn't this just Parfit with incense?"
  **Who asks:** The senior metaphysician (likely the workshop convener).
  **The Gist:** They will hear "no self + psychological continuity" and immediately categorize you as a Parfit-style reductionist. They'll ask what work *anatta* is doing that *Reasons and Persons* didn't do.
  **Your Concession:** Admit the structural similarity. Parfit saw that reductionism diminishes the significance of death and identity.
  **Your Soft Spot:** Claiming Parfit didn't go far enough. He remained a metaphysician; you are claiming *anatta* is anti-metaphysical.
  **The Reply Strategy:**
  *   **Minute 1:** "Parfit offers a metaphysical reduction (bundles vs. substances). I'm arguing *anatta* is a *pragmatic dissolution*. Parfit asks 'What is the self?' and answers 'Less than we think.' The Buddha asks 'Why are you positing a self?' and answers 'To stop suffering.' One is a description of reality; the other is a tool to dismantle a cognitive habit."
  *   **Minute 2:** Pivot to the performative aspect. "If I'm right, the persistence problem isn't solved; it's dissolved. Asking 'who persists?' is like asking 'where is the unicorn's horn?' once you realize there's no unicorn. Parfit keeps the unicorn but shrinks it. *Anatta* removes it."

  ### 2. The Follow-Up: "If you dissolve the narrative, who acts?"
  **Who asks:** A narrative identity theorist (Schechtman/Strawson camp).
  **The Gist:** If the narrative self is an illusion to be undone, moral agency collapses. You can't have ethics without an agent to hold responsible.
  **Your Concession:** Concede that *individual* retributive responsibility is incoherent on your view.
  **Your Soft Spot:** Explaining how "distributed responsibility" doesn't just mean "no one is responsible."
  **The Reply Strategy:**
  *   **Minute 1:** "We need to distinguish between *accountability* (backward-looking) and *responsiveness* (forward-looking). I'm arguing Buddhist ethics shifts the weight to responsiveness. If the self is a node in a causal network, 'my' action is actually a network event."
  *   **Minute 2:** Defend the distributed claim. "Think of it like climate change. No single agent causes it, but the network bears the responsibility. If *anatta* is true, karma isn't a ledger for a soul; it's the systemic feedback of the network. That's why it looks consequentialist: we minimize *dukkha* in the system, not 'sin' in the agent."

  ### 3. The Specialist: "Are you ignoring the soteriological point?"
  **Who asks:** The Buddhist Studies scholar (Pali reader).
  **The Gist:** They will hate the "reductionism" label. They will argue *anatta* is about *dukkha* and liberation (*nibbana*), not analytic metaphysics or Western ethics. They'll accuse you of secularizing a soteriological doctrine.
  **Your Concession:** Concede that *anatta* is primarily soteriological. Do not fight this.
  **Your Soft Spot:** The claim that this makes it "consequentialist." Traditional Buddhism emphasizes intention (*cetana*), not just outcomes.
  **The Reply Strategy:**
  *   **Minute 1:** Validate them immediately. "You're right that *anatta* is soteriological. That's exactly why it's performative. It's not a theory of mind; it's a technology for liberation. I'm not secularizing it; I'm taking the soteriological goal seriously enough to see it breaks metaphysics."
  *   **Minute 2:** Address the ethics. "On consequentialism: I'm not saying Buddhists are utilitarians. I'm saying the *structure* of distributed karma functions like aggregate welfare. If there's no self to 'own' the virtue, the moral weight shifts to the *outcome* of the action on the web of conditions. Intention matters, but it matters because of its causal ripple, not because it perfects a soul."

  ### 4. The Ethics Hawk: "Distributed karma is no karma."
  **Who asks:** A moral philosopher in the audience.
  **The Gist:** If karma is distributed across a relational network, you lose the link between action and result that makes karma intelligible. It becomes fatalism or luck.
  **Your Concession:** Admit this breaks the "cosmic justice" version of karma.
  **Your Soft Spot:** Explaining how rebirth fits into a distributed network (save this for Q5 if possible, but be ready).
  **The Reply Strategy:**
  *   **Minute 1:** "Traditional karma is often read as individual moral accounting. I'm suggesting it's better read as causal inheritance. I inherit the karma of my ancestors, my society, my biology. That is 'distributed'."
  *   **Minute 2:** "This doesn't erase responsibility; it expands it. My practice isn't just about 'my' enlightenment; it's about altering the causal conditions for the whole network. That makes the ethical demand *higher*, not lower."

  ### 5. The Nuclear Option: "Rebirth is literally incoherent here."
  **Who asks:** Anyone (but likely the Metaphysician or the Buddhist Scholar).
  **The Gist:** "If there is no self to persist, and karma is distributed across a network, what exactly is reborn? If you say 'causal continuity,' you're back to Parfit. If you say 'nothing,' you contradict the suttas. You've made the doctrine unintelligible."
  **Why you fear it:** It exposes the tension between your "performative" claim and the ontological commitments of traditional Buddhism.
  **Your Concession:** Concede that *personal* rebirth is incoherent on your view.
  **Your Soft Spot:** This is your weakest point. You are effectively arguing for a reinterpretation of rebirth that many traditionalists reject.
  **The Reply Strategy:**
  *   **Minute 1:** Don't panic. "If we define rebirth as 'me going somewhere else,' yes, that's incoherent. But if we view rebirth as the transmission of causal conditions (karma) through the network of sentient beings, it holds."
  *   **Minute 2:** The pivot. "The suttas often describe rebirth in terms of craving and clinging continuing, not a 'person' traveling. If *anatta* undoes the narrative self, rebirth is the persistence of the *pattern* of craving, not the *entity*. It's the fire passing from candle to candle, not a 'thing' moving. This fits the distributed karma model: I inherit the craving of the past, and I pass on the conditions for the future."

  ### General Tactical Advice
  *   **The "Reductionism" Trap:** When the Pali scholar gets annoyed about "reductionism," do not defend the word. Say: "I agree 'reductionism' is the wrong Western bag. That's why I prefer 'performative undoing.' Reductionism is still metaphysics; I'm arguing *anatta* is anti-metaphysics."
  *   **Body Language:** When the Metaphysicians ask about ontology, lean back (signal: "that category doesn't apply"). When the Buddhist Scholar asks about soteriology, lean in (signal: "this is the core").
  *   **The "Consequentialism" Label:** If they press hard on whether Buddhism is *really* consequentialist, soften the claim. "I'm saying structurally analogous regarding *outcomes*, not necessarily regarding *deliberation*." This gives you an out if they cite *cetana* (intention) texts.
  *   **Running the Clock:** If an answer is going long, say: "That's a whole paper in itself, but the short version is..." Then stop. It shows control.

  Good luck. You're walking a tightrope between two disciplines that love to hate each other. If you can make them feel you respect both constraints, you'll survive.
