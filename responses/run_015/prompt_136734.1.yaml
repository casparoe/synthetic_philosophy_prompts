prompt: |-
  I'm giving a talk next Thursday in our philosophy of religion workshop -- audience is mostly analytic metaphysicians who work on personal identity (they know Parfit and Locke inside out), plus one Buddhist studies scholar who actually reads Pali and gets annoyed whenever Western philosophers call anatta "just reductionism." My thesis is contrarian: anatta isn't a metaphysical claim about bundles vs. substances, but a performative undoing of the narrative self that dissolves the persistence problem rather than solving it. I'm also pushing the weirder corrolary that without an enduring agent, karma and moral responsibility have to be reconceived as distributed across relational networks -- which makes Buddhist ethics structurally closer to aggregate consequentialism than to virtue ethics. I know that sounds like I'm smuggling Western baggage into the suttas, but I think it follows if you take the no-self doctrine seriously instead of treating it as mysticism.

  Can you draft my Q&A prep? I want the objections in the order they'll actually come, phrased like these people talk -- the metaphysicians will ask about Parfit-style reductionism and narrative identity, the Pali reader will ask about whether I'm ignoring the practical soteriological point. For each one, tell me what I should concede up front, where my reply is soft, and how long I have to answer (say, two minutes). And please include the objection I'm hoping nobody asks -- probably that if karma is distributed and there's no self, then rebirth is literally incoherent, or that I'm just projecting consequentialist frameworks onto a tradition that rejects them. Keep it practical, no bibliographies, I just need to survive the room.
reasoning: |-
