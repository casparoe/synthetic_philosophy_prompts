      *   *Revision:* The revision must clarify that the Oracle's announcement doesn't *cause* the action or alter the reasons-structure.
      *   *Actually, the strongest revision:* Modify (4) to distinguish between *Responsibility* (grounded in 2) and *Deliberative Stance* (grounded in 4). The Oracle case (7a) preserves Responsibility (2) even if it disrupts Deliberation. But the user says Oracle doesn't make me *less responsible*. So (2) must do the work. (4) should be downgraded to explain why we *feel* free, not why we *are* responsible.

      *   *Wait, looking at (7b):* Scanner unsettles responsibility. Why? Because it suggests the "decision" is a physiological event, not a reason-responsive act. This aligns with (2).
      *   *So the revision is:* **Decouple (4) from Responsibility.** Make (4) about the *practice* of deliberation only. Keep (2) as the sole ground of Responsibility.
