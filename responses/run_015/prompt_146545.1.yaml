      *   (4) **Epistemic Openness Normativity:** Unpredictability (epistemic), not indeterminism (modal), sustains deliberation/blame.
      *   (5) **Shadowing Optimism:** Chaotic trajectories can be "shadowed" by true trajectories from slightly different initial data. Approximate prediction is valid for *a* history.
      *   (6) **Model Error Dominance:** In practice, model error > initial condition error. We don't have the true equations.
      *   (7) **Case Verdicts:**
