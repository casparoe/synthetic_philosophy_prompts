          *   *Analysis:* The difference is *causal influence* vs. *mere correlation*? Or *mechanism*? The scanner might imply the decision is sub-personal (neural blip) rather than agential. The Oracle is external.
          *   *User's Doubt:* User admits (7) isn't tidy.
          *   *Severity:* High (for the user's coherence), but protected by (8). The user *wants* to keep (7). The tension is explaining *why* without contradicting (1) & (2).

      *   **Tension D: (1)/(2) vs. (7b).**
          *   (1) & (2) say Determinism + Responsiveness = Responsibility.
          *   (7b) says a deterministic predictor (scanner) threatens responsibility.
