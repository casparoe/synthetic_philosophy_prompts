answer: |-
  Here is the decomposition of my credence regarding the 'dual-track' reading of Darwin's moral philosophy.

  **(1) Probability Darwin intended a normative/autonomy layer in *Descent*: 0.80**
  He consistently treats the moral sense as a guide for future conduct and rational improvement, not merely as a fossilised instinct to be explained away.

  **(2) Probability his religious doubts spilled into moral philosophy: 0.75**
  His growing agnosticism forced him to ground moral obligation in human sympathy and utility rather than divine command, secularising the authority of ethics without removing it.

  **(3) Probability 'dual-track' is coherent for 1870s naturalism: 0.60**
  This framing risks projecting modern meta-ethical distinctions onto a thinker who likely viewed the origin and justification of morals as deeply intertwined rather than separate tracks.

  **Overall Credence: 0.70**
  Taking a weighted average that prioritises the substantive textual evidence (1 and 2) over the historiographical labeling (3), I assign a 0.70 credence that the reading is correct in spirit, if not precisely in terminology.

  **Analysis of Terms**
  The term doing the most work is **(1)**, as the entire hypothesis collapses without evidence that Darwin saw morality as binding rather than illusory. The term I am least sure about is **(3)**, because it relies on judging the philosophical sophistication of his era against modern categories.

  **Shifting the Weakest Term**
  To shift **(3)** upwards, one would need to find private correspondence or manuscript drafts where Darwin explicitly distinguishes between *why* we feel a moral impulse (causal history) and *why* we should obey it (justification), perhaps in letters to Hooker or Huxley debating whether naturalising ethics undermines duty.
