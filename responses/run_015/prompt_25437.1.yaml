  Case 6 (Partial Compensation) is the trickiest. Strict LE is often binary. The "Partial" suggests a "Soft" or "Moderate" Luck Egalitarianism, or perhaps a hybrid with Sufficientarianism. I will characterize it as "Moderate Luck Egalitarianism."

