  **Project Title:** Modal Identity and Institutional Persistence: A Counterpart-Theoretic Analysis of Constitutional Monarchy

  **Research Question**
  Is the identity of a normative institution across possible worlds best explained by strict transworld identity grounded in essential properties, or by counterpart relations grounded in functional similarity? Specifically, does sovereignty constitute an essential property of a constitutional monarchy, or is it a relational role susceptible to counterpart variation across modal space?

  **Background and Motivation**
  The debate between Lewisian counterpart theory and Kripkean transworld identity has traditionally centred on concrete particulars, such as human persons or artefacts. In the standard framing, the Kripkean insists that an object exists in multiple possible worlds only if it retains certain essential properties, often tied to its origin or constitutive matter. The Lewisian denies transworld identity altogether, arguing that talk of 'possible individuals' is merely talk of counterparts in other worlds who resemble the actual individual to a degree determined by context. This dispute is well-trodden ground when discussing whether a specific person could have had different parents, or whether a table could have been made of different wood.

  However, this literature leaves the case of normative institutions largely open. Institutions differ from concrete particulars in that their persistence conditions are not determined by physical continuity or biological origin, but by constitutive rules, social recognition, and functional roles. A constitutional monarchy is not a material object; it is a socially constructed entity defined by a specific configuration of authority, succession, and sovereignty. Because institutions are abstract in nature yet causally efficacious, they present a unique test case for modal metaphysics. The standard arguments regarding essential origins do not apply cleanly to entities that are defined by their function within a social system. Consequently, it remains unclear whether the identity of an institution across possible worlds requires the preservation of its specific structural properties (such as the possession of sovereign power) or whether a sufficiently similar functional arrangement counts as the same institution even if key properties differ.

  This project seeks to shift the debate away from persons and artefacts to apply these competing modal frameworks to normative institutions. By focusing on the constitutional monarchy, the paper will examine whether sovereignty should be analysed as an essential feature that fixes the identity of the institution across worlds, or as a relational role that can be occupied differently across worlds without breaking the chain of identity. This shift is significant because it tests whether modal metaphysics can accommodate social ontology without smuggling in hidden assumptions about essentialism that were designed for concrete objects.

  **Methodology**
  The method employed will be conceptual analysis of modal persistence conditions for social roles, with explicit comparison of the predictions made by each view. The project will construct a series of thought experiments involving nearby possible worlds where the structural properties of a constitutional monarchy vary. For instance, one case will consider a world where the monarch retains the title but lacks sovereign power, vested instead in a parliament. Another case will consider a world where the sovereign power remains with the monarch, but the line of succession is altered.

  Under the Kripkean framework, the analysis will proceed by identifying which properties are essential to the institution. If sovereignty is essential, then a world where the monarch lacks sovereign power contains no instance of that specific constitutional monarchy, but rather a different institution entirely. The Kripkean approach requires a binary determination: either the essential properties are met, and transworld identity holds, or they are not, and identity fails.

  Under the Lewisian framework, the analysis will focus on similarity metrics and context. The counterpart theorist does not ask whether the institution is strictly identical across worlds, but whether the institution in the other world is the closest counterpart to the actual one. This allows for vagueness. In a context where legal continuity is paramount, the counterpart relation might prioritise historical succession. In a context where political function is paramount, the counterpart relation might prioritise the distribution of sovereign power. The project will map how these different contextual weights alter the truth conditions of modal claims about the institution.

  The comparison will hinge on how each framework handles cases of gradual change. If a monarchy slowly loses sovereignty over centuries, the Kripkean must identify a precise point where the essential property is lost and the institution ceases to exist. The Lewisian can accommodate this as a shift in counterpart relations, where the institution in the later stage is a counterpart of the earlier one, but not identical to it. By applying these models to the specific case of sovereignty, the paper will evaluate which framework offers a more coherent account of institutional identity without relying on ad hoc assumptions.

  **Possible Conclusions and Adjudication**
  There are three primary conclusions this research might support. First, it may conclude that institutions possess essential properties akin to concrete objects, suggesting that sovereignty is a necessary condition for the identity of a constitutional monarchy. This would support a Kripkean view adapted for social ontology, implying that modal discourse about institutions is factive and rigid. Second, it may conclude that institutional identity is inherently vague and context-dependent, supporting the Lewisian view that counterpart relations are superior for analysing normative entities. This would imply that claims about what an institution 'could have been' are indeterminate until a context fixes the similarity metric. Third, it may conclude that neither framework fits perfectly, suggesting that institutional identity requires a hybrid model where constitutive rules fix identity while functional roles allow for counterpart variation.

  Adjudication between these conclusions will depend on considerations of theoretical utility and intuitive fit. A key consideration will be how each view handles responsibility and continuity. If a monarchy commits a historical injustice, does a counterpart institution in a nearby world bear responsibility? The Kripkean view suggests strict identity conditions for moral responsibility, whereas the Lewisian view allows for degrees of responsibility based on similarity. Another consideration is legal practice. Legal systems often treat institutions as continuing entities despite radical changes in function. If the metaphysical account cannot accommodate the legal intuition that the Crown persists even when sovereignty shifts, it suffers from explanatory deficit. The view that best aligns with our best practices in law and political theory while maintaining metaphysical rigour will be preferred.

  **Scope and Feasibility Assessment**
  While the proposed topic is philosophically rich, there are significant risks regarding scope for a paper of approximately 5,000 words. The primary danger is attempting to resolve the general metaphysical dispute between counterpart theory and transworld identity while simultaneously developing a novel application to political philosophy. Five thousand words is insufficient to defend the merits of Lewisian or Kripkean metaphysics from first principles. Therefore, the paper must treat the metaphysical frameworks as given tools and focus exclusively on their application to the institutional case.

  Furthermore, the concept of 'sovereignty' is itself contested within political theory. To avoid becoming bogged down in definitional disputes, the paper will need to stipulate a working definition of sovereignty as the ultimate source of legal authority within a jurisdiction. Failure to constrain this definition could lead to ambiguity that undermines the modal analysis. There is also a risk of oversimplifying the nature of institutions. If the analysis treats the monarchy as a monolithic object rather than a complex system of roles and rules, the conclusions may not generalise to other normative institutions.

  To manage these risks, the paper will limit its focus to the specific question of whether sovereignty is an essential property. It will not attempt to provide a full theory of social ontology. Instead, it will use the constitutional monarchy as a limiting case to test the flexibility of the modal frameworks. If the scope proves too ambitious during the drafting process, the discussion of legal responsibility will be truncated in favour of a deeper analysis of the persistence conditions themselves. Despite these challenges, the project is feasible within a single term provided the metaphysical groundwork is accepted as a starting point rather than a subject of primary debate. The novelty of applying these frameworks to normative institutions offers sufficient ground for a distinct contribution without requiring an exhaustive survey of the existing literature on modal realism.
