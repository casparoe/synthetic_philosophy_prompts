answer: |-
  A junior analyst asks her manager how to code customers who didn't apply for the loan because they knew their credit was too low. Protocol, however, forbids asking them why they abstained.

  The manager replies, "Code it as no demand; for our purposes, perceived ineligibility is indistinguishable from disinterest."

  ***

  **Notes**

  1.  **Feature Used:** This turns on the third feature: observed choice cannot separate what someone wants from what they take to be available or permissible. The punchline treats the constraint (credit score) as if it were the preference (disinterest), collapsing the barrier into the choice.
  2.  **The Real Point:** An economist recognizes the identification problem: without independent data on the constraint set, a non-choice looks exactly the same whether it is forced by impossibility or driven by taste.
  3.  **Where It Cheats:** The joke implies economists simply relabel constraints as tastes to save the model, whereas in practice, they strive to identify constraints separately (e.g., via instrumental variables) rather than conceding indistinguishability.
