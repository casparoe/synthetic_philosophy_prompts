answer: |-
  Your roommate is taking an overly rigid stance because the validity of a tradition depends on its present social utility rather than its historical authenticity. You are likely thinking of Eric Hobsbawm and Terence Ranger's concept of invented traditions, which argues that many practices appearing ancient were actually constructed recently to foster group cohesion or legitimacy. This aligns with Benedict Anderson's theory of imagined communities, which posits that large groups connect through a shared belief in belonging rather than objective historical lineage. From a sociological functionalist perspective, the ritual successfully generates social solidarity and community identity, making the emotional experience real even if the historical narrative was fabricated. While transparency about the 1987 origins is ethically necessary to avoid deception, dismantling the event destroys genuine social capital that has accumulated over decades of practice. The tradition has gained authenticity through repetition and shared experience, meaning it is no longer merely a commercial product but a lived reality for the participants.
