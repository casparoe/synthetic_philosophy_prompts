      *   **Friend's View (Causal-Organization Criterion):** Moral status depends on description-independent facts about counterfactual-supporting causal organization. If the dynamics instantiate the "pain organization," it matters, regardless of description.
      *   **User's View (Self-Tracking Criterion):** Moral status depends on the system representing itself as undergoing a valenced process, where that representation drives self-regulation/avoidance. The ascription problem goes "all the way down," so internal self-representation is the only non-arbitrary tie-breaker.
      *   **Task:** Compare the two answers, focusing on edge cases where they diverge (Silent Valence vs. Counterfeit Sufferer), analyze whether the Self-Tracking criterion escapes the ascription problem, analyze whether the Causal-Organization criterion covertly relies on description, evaluate the "deflationary argument" (convergence in practice), propose a concrete intervention to change minds, and consider if a third factor is at play.
      *   **Tone/Style:** Philosophical, precise, graduate-seminar level, avoiding generic surveys, focusing on the specific arguments provided.

  2.  **Deconstruct the Two Criteria:**
      *   *Causal-Organization (CO):* Realist about functional roles. Pain is a specific causal topology. If a system has that topology, it suffers. The ascription problem is epistemic (we don't know which computation is real), but ontic (there is a fact of the matter).
      *   *Self-Tracking (ST):* Constructivist/Expressivist about the subject. Pain requires a *subject* to whom it happens. The subject is constituted by self-modeling. Without a self-model tracking the valence, there is no "one" to suffer. The ascription problem is ontic (no fact of the matter without the system's own stance).

  3.  **Analyze the Edge Cases:**
      *   *Case 1: Silent Valence.* System has the causal organization of pain (nociception, avoidance, learning) but *no* self-model representing "I am in pain."
