answer: |-
  The dispute between cyclical and linear conceptions of history is often obscured by a conflation of three distinct claims. To adjudicate the matter, we must first disentangle them. The first claim is Recurrence: the assertion that political forms appear in a fixed order due to constants in human nature, not accident. The second is Boundedness: the assertion that any given polity or culture has a finite lifespan and, once ended, is not reconstituted as the same entity. The third is Non-transmission: the assertion that nothing durable crosses a breakdown; a later society does not stand on the remains of an earlier one as on a foundation.

  A cyclical theorist is genuinely committed to all three. For the cycle to be a cycle, forms must recur necessarily (Recurrence), individual organisms of history must die (Boundedness), and the death must involve a loss of continuity that prevents simple accumulation (Non-transmission). A linear theorist, conversely, can concede Recurrence and Boundedness without loss. They may admit that empires fall in similar patterns due to unchanging human psychology, and that specific regimes have finite spans. The linear theorist's essential commitment is the denial of Non-transmission. They argue that while polities die, the substrate of technique, knowledge, and energy capacity accumulates across the ruins. The dispute, therefore, does not turn on whether regimes fall, but on whether anything survives their falling.

  We apply this distinction to the record of the Kavari. Over four thousand years, this isolated civilization experienced twelve dissolutions of central order, yet each time recovered a polity of equal extent within two centuries. Crucially, energy mobilization and technical repertoire increased monotonically, with no net regression lasting more than a century.

  First, does this confirm the accumulation view? The strongest cyclical reply invokes the Spenglerian distinction between Culture and Civilization. A morphological theorist might argue that four thousand years of monotonic technical growth is exactly what is expected of the terminal phase, the passage from creative Culture into sterile Civilization. In this view, expansion and technical facility replace spiritual creation, so the rising curve is evidence of exhaustion rather than progress. However, we must decide whether this is a genuine prediction or a redescription manufactured after the fact. For this reply to be a genuine prediction, the theory must specify *beforehand* independent criteria that distinguish "vital growth" from "exhaustive expansion." If the only distinction is that the theorist retrospectively labels the period of technical peak as "winter," the theory is tautological. In the Kavari record, technical capacity and administrative articulation rise together. Unless the cyclical theorist can point to a qualitative shift in Kavari art or religion independent of the technical data that signals "death," the appeal to the terminal phase is a redescription. It saves the theory by rendering it unfalsifiable: any growth is either spring growth or winter bloat, distinguishable only by knowing the end in advance.

  Second, consider the remaining cyclical resources: treating the twelve dissolutions as internal pulsations within one continuing civilization, or shifting the unit of analysis from polity to culture so that the four thousand years count as a single culture not yet arrived at its end. What evidence would discriminate between these manoeuvres and the admission that the cyclical model has failed? If the cyclical theorist stretches the unit of analysis to encompass the entire four-thousand-year block as a single "culture-cycle," they concede the linear point regarding the polity. The cycle becomes so large it loses predictive utility for human actors. To discriminate this from model failure, we would need evidence that the *nature* of the dissolutions changes qualitatively over time. If the thirteenth dissolution involves a permanent loss of the administrative techniques mastered in the first, the cycle holds. But the stipulated record shows monotonic increase. If the "culture" survives twelve political deaths without loss of technique, the "cycle" is merely political, not cultural. The cyclical theorist must admit that the unit of historical accumulation is not the polity, but the technical repertoire. By shifting the unit to "culture" to save the cycle, they implicitly admit that the polity—their original unit of recurrence—is not the carrier of historical destiny.

  Third, we apply a test of symmetry. If the Kavari record had instead shown monotonic decline in population, energy, and administration across four thousand years, with no recoveries, would that confirm the cyclical view or refute the linear one? If we treat the rising record as counting for the linear side, we must treat the falling record as counting for the cyclical side, or admit an asymmetry. A linear theorist might argue that decline is a local accident, but in an isolated civilization lasting four millennia, "local accident" becomes indistinguishable from systemic trend. If the linear claim is that history is a one-way accumulation, a sustained four-thousand-year regression refutes it for that unit. To avoid asymmetry, one must concede that the Kavari record acts as a controlled experiment. Rising capacity supports linear accumulation; falling capacity supports cyclical entropy. If the linear theorist accepts the rise as validation but explains away the fall as "contingency" while the cyclical theorist accepts the fall as validation but explains away the rise as "exhaustion," the dispute is merely verbal. Symmetry demands that the Kavari record is decisive for both.

  This leads to the conclusion that the dispute is largely a pseudo-dispute generated by the choice of unit—dynasty, polity, culture, or species-wide technique—together with stage-lengths that can be stretched to fit any record. However, it becomes determinate if we fix the unit of measurement to something material rather than morphological. The cyclical view relies on the analogy of organic life, which implies a necessary decay of vitality. The linear view relies on the physics of information and energy, which allows for accumulation.

  I take the side of linear accumulation regarding technical capacity. The cyclical model is potent for describing political legitimacy and social solidarity, which do seem to dissipate and recur, but it fails as a total history of human capability. The dispute is settled by identifying a measurable quantity whose observed value tracks the "shape" of history independent of political regime changes. That quantity is energy capture per capita. If history is cyclical, energy capture should reset or decline significantly after every political dissolution. If history is linear, energy capture should ratchet upward, surviving the political breakdown.

  I expect this value to take an upward trajectory across breakdowns, as seen in the Kavari stipulation. The cyclical theorist is right that regimes die (Boundedness) and forms repeat (Recurrence), but wrong that knowledge dies (Non-transmission). The linear theorist is right about the accumulation of capacity, even if wrong about the moral trajectory.

  I would change my mind if I observed a sustained period where complex technical knowledge was actively lost and not recovered across multiple cycles, resulting in a lower baseline of energy capture than previously achieved.
