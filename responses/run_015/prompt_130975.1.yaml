answer: |-
  The ban presupposes that vital organs are inalienable parts of the self that cannot be priced without corrupting consent, but current practice reveals this principle is inconsistently applied and functions primarily to maintain a facade of equitable allocation while tolerating indirect wealth-based advantages.

  The implicit theory resting beneath the prohibition on payment is a hybrid of three distinct claims: inalienability, unduly inducement, and equitable allocation. The inalienability claim holds that vital organs are constitutive of the person rather than property, so selling them is a form of self-instrumentalization that violates human dignity regardless of consent. The undue inducement claim holds that financial desperation vitiates consent, meaning a poor person agreeing to sell a kidney is not truly choosing but yielding to circumstance. The equitable allocation claim holds that scarce lifesaving resources must be distributed based on medical need and utility, not ability to pay. Current practice strictly presupposes the inalienability of the organ itself and the formal rule of equitable allocation, but it treats the other two claims loosely. We reimburse lost wages and travel because that is framed as removing a barrier to altruism rather than inducing the act, yet for a low-income donor, being made whole on lost wages is often a stronger financial motivator than a flat fee would be for a wealthy person. We allow multi-listing, which effectively lets wealthy patients buy shorter wait times through travel and hotel costs, which contradicts the equitable allocation principle in practice even if the rulebook says otherwise. Regarding your note on billing: insurers pay for the *services* of procurement and transport, not the organ itself, which is legally valued at zero on paperwork, preserving the fiction that the resource itself has no price even if the logistics do.

  The practice is philosophically underdetermined because both the "sacred body" theory and the "protect the poor" theory license the current ban, but they diverge on reimbursement and plasma. If the core worry were solely commodification of the self, reimbursing lost wages would be suspect because it attaches money to the act of donation; if the core worry were solely exploitation of the poor, paid plasma and egg donation should be banned for similar reasons of bodily risk and financial coercion. The fact that we allow payment for regenerative tissues (plasma, eggs) but not vital organs suggests the inalienability theory is doing the heavy lifting for kidneys, while the exploitation theory is doing the heavy lifting for the ban on cash. However, the tolerance of multi-listing suggests that maintaining the *appearance* of a non-market system is more important than eliminating wealth advantages entirely. This means the system is designed to prevent explicit pricing of life while tolerating implicit pricing of access.

  If we swapped the presupposed view to conclude that only the exploitation of the poor matters, and commodification itself was harmless, policy would look radically different: we would likely implement regulated cash payments to all donors to ensure uniformity, coupled with strict income vetting or universal healthcare to ensure no one donates out of desperation. Under that specific theory, your council's proposal would still fail because it allows wealth to purchase priority, which exacerbates the disadvantage of the poor rather than mitigating it. The proposal creates a formal market in queue position, which violates the equitable allocation principle strictly presupposed by the current system. Even though it avoids writing a check for an organ, it attaches a price to the *benefit* of the organ, which functionally commodifies the transplant itself. The inheritability clause further cements this as a property right, transforming a medical resource into a dynastic asset.

  Consequently, the proposal does not slip past the theories blocking cash payment; it triggers them all. It violates inalienability by making queue position a tradable asset; it violates the exploitation constraint by allowing the wealthy to bypass the queue while the poor might feel coerced into donating to earn points; and it violates equitable allocation by replacing medical urgency with financial capacity. The current system tolerates indirect wealth advantages like multi-listing because they are informal and friction-heavy, whereas this proposal formalizes and lubricates the advantage, making the inequality explicit rather than incidental. To fit within current presuppositions, any reciprocity model would need to be universal and non-transferable—granting points for donation without the option to buy them, without the option to name beneficiaries, and certainly without inheritability. The moment you allow the points to be purchased or inherited, you have conceded that access to lifesaving care is property, which collapses the distinction between selling an organ and selling the place in line to receive one.
