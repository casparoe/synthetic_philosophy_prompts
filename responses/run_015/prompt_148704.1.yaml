answer: |-
  Good evening. To our colleagues from the history department, who have spent careers guarding the archives against the speculative; to our friends in philosophy, who have long argued that what *could* have happened matters as much as what *did*; to the graduate students navigating between these camps; and to the family and friends of our honoree, who know her best not as a theorist, but as a person: welcome.

  We are gathered to mark the retirement of a scholar who spent forty years asking a question that makes many historians uncomfortable: *Did it have to happen this way?*

  Now, I know the skepticism in this room. For many historians, counterfactuals are parlor games. They are "what ifs" that distract from the hard evidence of what *was*. But our honoree argued that ignoring the "what if" is not neutrality. It is a methodological blind spot. She claimed that we cannot understand why the past unfolded as it did unless we test how easily it could have unfolded otherwise.

  She called this "modal fragility analysis." That sounds technical, but the core idea is something we all understand intuitively. It rests on a distinction she sharpened over decades, a distinction that I believe will define her legacy long after today. It is the difference between **inevitability-as-overdetermination** and **inevitability-as-retrospective-illusion**.

  Let me explain what that means, and why it matters for all of us, not just the specialists.

  Inevitability-as-overdetermination is like a river flowing into the sea. You can block one channel, but the water finds another. The outcome is robust because multiple causes push toward it. If a technology is overdetermined, it would have happened anyway, regardless of specific individuals.

  Inevitability-as-retrospective-illusion is different. It is like a single thread holding up a weight. Once the weight is on the floor, the thread looks strong. But if you rewind time, you see that thread was about to snap. The outcome looks inevitable only because we are standing after the fact, ignoring the nearby worlds where the thread broke.

  Why does this distinction do real work? Because it changes how we judge the people who lived through those moments.

  Consider the introduction of chlorination to the Jersey City water supply in 1908. Today, treating water with chlorine looks like a moment of obvious scientific progress. It seems overdetermined. Chemistry demanded it; public health required it. Therefore, the lawyers and officials who sued to stop it look like obstructionists. They look like enemies of progress.

  But our honoree's analysis showed that this adoption was modally fragile. It depended on a specific, risky decision by one engineer to dose the water secretly before legal approval was granted. It depended on a specific judge interpreting "pure water" in a novel way. If the engineer had been more cautious, or the judge more textualist, chlorination could have been delayed by decades.

  If we view this as overdetermined, the opponents are villains. They resisted the inevitable. But if we view it as modally fragile—as our honoree did—the opponents were not fighting science; they were upholding the legal and safety standards of their time against an untested risk. Recognizing the fragility shifts our moral evaluation. They were not blind; they were prudent. The engineer was not just a scientist; he was a gambler.

  This is the structural work of her distinction. It determines what we are allowed to say about the past. If we confuse retrospective illusion with overdetermination, we turn history into a morality play where the winners are heroes and the losers are fools. If we apply her test, we see actors navigating uncertainty, making choices where the outcome was genuinely in doubt.

  For the philosophers here, this offers a grounded empiricism for modal reasoning. It is not about possible worlds in the abstract; it is about causal nodes in the archive. For the historians, it offers a way to discuss contingency without slipping into fiction. It demands evidence for the paths not taken.

  And for her family, who might wonder why this matters: it matters because it is a form of mercy. It refuses to judge the past by the certainty of the present. It acknowledges that our honoree's subjects were human beings facing open futures, just as we are.

  Her legacy, then, is not a list of books or a specific theory of technology. Her legacy is a constraint on our judgment. She taught us that we do not have the right to call an outcome inevitable until we have proven it was overdetermined. Until we have tested the fragility.

  She leaves us with a discipline that is harder than writing a coherent narrative. It requires us to hold the tension of the unchosen path alongside the chosen one. It requires us to admit that the world we inhabit is not the only world that could have been built, and that the people who built it were not merely instruments of fate.

  So, as we move into the symposium, I invite you to test her work. Argue with the distinction. Find the nodes where she was wrong. But do not slip back into the comfort of the straight line.

  Thank you.
