prompt: |-
  I do health-economic modelling for a public funder — mostly cost-effectiveness analysis: QALYs, DALYs, discount rates, equity weights, the reference-case rule that we only count health effects and ignore costs falling on other sectors. I'm fluent enough in all that; philosophy-wise I've got one undergrad course behind me and its fuzzy now.

  I keep bumping into philosophers arguing about speciesism and I want the argument in the vocabulary I actually work in. Take three claims — equal consideration of interests, the argument from marginal cases, and the claim that species membership is morally irrelevant in roughly the way that race or sex is — and translate each as faithfully as you can into my machinery: whose health gains get to enter the calculation at all, what gets weighted and by how much, what an equity weight would even be doing, what work the societal perspective is doing.

  Then the bit I actually care about: the residue report. Say which claims only translated with distortion, and which have no expression in CEA at all. My suspicion is that the moral-status question quietly collapses into just a question about which weights I'm allowed to enter, and that something gets lost in that collapse — but I can't say what. A live case that might anchor it: we're costing a zoonotic-disease control programme where one of the arms is culling wild badgers, and the harm to the badgers currently enters only as human willingness-to-pay for there being fewer badger deaths. Is that a bug in my framework, or is it the philosophers asking a question my framework has no way of asking?

  Tempting as it is to just tell me what to think about animals, please don't — I want the translation and the residue, not the verdict. And write it in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Health economist/modeler for a public funder. Expert in CEA (Cost-Effectiveness Analysis), QALYs, DALYs, discounting, equity weights, reference cases (health sector perspective).
      *   **Philosophical Background:** One undergrad course, fuzzy memory.
      *   **Task:** Translate three specific philosophical claims about animal ethics (Equal Consideration of Interests, Argument from Marginal Cases, Species Membership Irrelevance) into health-economic modeling vocabulary.
      *   **Specific Focus:** The "Residue Report" – what gets lost, distorted, or cannot be expressed in CEA.
      *   **Concrete Example:** Zoonotic disease control involving badger culling (badger harm currently valued only via human WTP).
      *   **Constraint:** Do *not* provide a verdict on animal ethics. Do *not* tell them what to think. Focus on translation and structural limitations.
      *   **Tone/Style:** Professional, precise, American English, respecting their expertise.

  2.  **Deconstruct the Philosophical Claims:**
      *   *Claim 1: Equal Consideration of Interests (Singer).* Basically, if a being can suffer, that suffering counts equally to similar suffering in another being.
      *   *Claim 2: Argument from Marginal Cases.* If we grant rights/status to humans with limited cognitive capacity (infants, severely disabled), we must grant it to animals with similar capacity, unless we are speciesist.
      *   *Claim 3: Species Membership is Morally Irrelevant.* Analogous to race/sex. Being *Homo sapiens* isn't a valid criterion for moral weight, just as being *Caucasian* isn't.

  3.  **Translate into Health-Economic Vocabulary:**
      *   *Core Mechanism:* The Social Welfare Function (SWF) implicit in CEA. Usually: Maximize $\sum (w_i \times H_i)$ subject to Budget Constraint, where $H$ is health (QALYs) and $w$ is equity weight.
      *   *Translation 1 (Equal Consideration):* This is about the *boundary of the population* ($N$) and the *equity weights* ($w$). Currently, $N$ = humans. Equal consideration says $N$ should include sentient animals. It also implies $w_{animal} = w_{human}$ for equivalent health states (pain/suffering).
      *   *Translation 2 (Marginal Cases):* This is about the *eligibility criterion* for entering $N$. Currently, eligibility = human biology/citizenship. This argument says eligibility should be based on *capacity for health/valence* (sentience/cognitive function). If a human infant counts, a pig with similar cognitive function must count. In modeling terms: The inclusion rule shifts from "Species ID" to "Functional Capacity Threshold."
      *   *Translation 3 (Species Irrelevance):* This is about *covariates in the weighting function*. Currently, $w$ might vary by age, severity, SES (depending on reference case). Race/Sex are explicitly excluded as weight modifiers. This claim says "Species" must also be excluded as a weight modifier. $w$ cannot be a function of $S$ (species).

  4.  **Drafting the Translation Section:**
      *   Need to use terms like "reference case," "population boundary," "equity weights," "outcome metric," "perspective."
      *   *Equal Consideration:* Expands the denominator of the cost-effectiveness ratio? No, it expands the numerator (benefits). It demands a common currency (QALY/DALY) applicable across species.
      *   *Marginal Cases:* Challenges the inclusion criteria. If we use "capacity to benefit" as the inclusion rule for humans, consistency demands it for animals.
      *   *Species Irrelevance:* Treats "species" as a protected characteristic in the equity weighting scheme.

  5.  **Developing the "Residue Report" (The Core Insight):**
      *   *The User's Suspicion:* "Moral status collapses into weights."
      *   *Is this true?* Yes, technically. But what is lost?
      *   *Loss 1: The Definition of 'Health'.* QALYs are human-centric. Can a badger have a QALY? Philosophers argue about *interests*, not just pain. CEA measures health states. Does animal flourishing = health?
      *   *Loss 2: Incommensurability/Trade-offs.* CEA assumes trade-offs are linear and permissible (1 QALY here = 1 QALY there). Philosophy might argue for *constraints* or *rights* (side constraints) rather than weights. A right not to be killed isn't a high weight on death; it's a prohibition. CEA can't model prohibitions easily, only high costs/weights.
      *   *Loss 3: The Perspective.* Public funder = citizens/taxpayers. Animals aren't stakeholders in the political contract. Including them changes the *principal* of the agency.
      *   *The Badger Case:* Currently, Badger Harm = 0 (directly). It enters via Human WTP (existence value).
          *   *Philosophical view:* Badger Harm > 0 (intrinsic).
          *   *CEA translation:* Assign $w_{badger} > 0$ and measure $\Delta QALY_{badger}$.
          *   *The Residue:* The WTP approach treats badgers as *goods* consumed by humans. The philosophical approach treats badgers as *patients* generating utility. The collapse turns a status question into a valuation question.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* Make sure not to sound like I'm advocating for animals. Keep it structural.
      *   *Nuance:* The "Reference Case" is a policy tool, not just math. Changing it requires legislative/mandate change, not just model tweaking.
      *   *Key Distinction:* Weights vs. Constraints. CEA is consequentialist (maximize sum). Rights-based ethics are deontological (constraints). This is the biggest "residue." You can simulate a right with an infinite weight, but that breaks the math (infinity in the numerator/denominator).

  7.  **Final Polish:**
      *   Check American English spelling (modeling, program, etc.).
      *   Ensure the tone is respectful of their expertise (don't explain QALYs, explain how the *concept* maps).
      *   Structure clearly: Translation, Residue, The Badger Case.

  8.  **Final Review against constraints:**
      *   Did I tell them what to think? No.
      *   Did I cover the three claims? Yes.
      *   Did I address the residue? Yes.
      *   Is it in their vocabulary? Yes (SWF, reference case, perspective, weights).

  *(Self-Correction during drafting)*: I need to be careful with the term "QALY" for animals. Philosophers might argue animals don't have "health" in the human sense, but they have "welfare." In the translation, I should note that the *metric* itself might need redefinition, not just the weights. That's a major residue.

  *(Refining the "Marginal Cases" translation)*: This is about the *inclusion criterion*. In CEA, we include "the population." Usually defined legally. Marginal cases says the definition should be functional (sentience), not biological.

  *(Refining the "Residue")*: The biggest thing lost is the difference between *price* and *value*. WTP is price. Moral status is value. CEA converts value to price (shadow prices). The residue is the moral claim that some things shouldn't have a price.

  Okay, ready to write.
answer: |-
  Here is the translation of those three philosophical claims into the architecture of health-economic modelling, followed by the residue report on what gets lost in the conversion.

  ### Part 1: The Translation

  To map these claims into your machinery, we have to treat your Cost-Effectiveness Analysis (CEA) not just as math, but as an operationalized Social Welfare Function (SWF). Your reference case defines the parameters of that function: the population boundary ($N$), the outcome metric ($H$), and the weighting scheme ($w$).

  **1. Equal Consideration of Interests**
  *   **Philosophical Claim:** Suffering or flourishing counts equally, regardless of who experiences it, provided the capacity for experience is similar.
  *   **CEA Translation:** This is a constraint on the **equity weighting function ($w$)** and the **outcome metric ($H$)**.
      *   Currently, your SWF looks roughly like: $\text{Maximize } \sum (w_i \times \Delta H_i)$ for $i \in \text{Humans}$.
      *   This claim demands you expand the set $i$ to include sentient animals.
      *   Crucially, it dictates that for equivalent changes in $H$ (e.g., pain, distress, loss of function), the weight $w$ must be identical. You cannot apply a discount factor to animal health gains simply because they are animals. If a badger's pain is phenomenologically equivalent to a human's pain, the coefficient in the objective function must be the same.
      *   **Operational change:** You must define a cross-species utility metric (a "QALY" analogue) and set $w_{\text{badger}} = w_{\text{human}}$ for equivalent states.

  **2. The Argument from Marginal Cases**
  *   **Philosophical Claim:** If we grant moral status to humans with limited cognitive capacities (infants, severe dementia), consistency requires we grant it to animals with similar or greater capacities.
  *   **CEA Translation:** This challenges the **inclusion criteria for the population ($N$)**.
      *   In your reference case, inclusion in $N$ is usually binary based on citizenship or biological humanity.
      *   This argument asserts that the inclusion criterion should be **functional capacity** (e.g., sentience, capacity for suffering, agency) rather than **species membership**.
      *   **Operational change:** The "Reference Case" rule for who counts becomes a threshold test on cognitive/sentient function. If a human infant enters the calculation because they have capacity $X$, any animal with capacity $\ge X$ must also enter the calculation. It forces you to make the eligibility rule explicit and consistent across biological categories, rather than relying on a tacit "human" default.

  **3. Species Membership is Morally Irrelevant**
  *   **Philosophical Claim:** Species is a biological category like race or sex; using it to determine moral worth is discriminatory (speciesism).
  *   **CEA Translation:** This treats species as a **protected characteristic in the weighting model**.
      *   In equity weighting, we sometimes adjust $w$ based on severity of illness or socioeconomic status (depending on the funder's mandate). We explicitly *forbid* adjusting $w$ based on race or sex.
      *   This claim demands that "Species" be added to the list of forbidden covariates for $w$. You cannot have a term in your equation where $w = f(\text{Species})$.
      *   **Operational change:** It prohibits the use of a "species discount rate." You cannot justify a lower weight on animal health losses by citing their taxonomic classification, just as you cannot justify lower weights for minority groups by citing race.

  ---

  ### Part 2: The Residue Report

  You suspected that the moral-status question collapses into a question about which weights you are allowed to enter. You are correct. In your framework, moral status is mathematically isomorphic to an equity weight.

  However, this collapse creates significant distortion. Here is what gets lost, distorted, or rendered inexpressible when you force these philosophical claims into a CEA structure.

  **1. Rights as Constraints vs. Rights as Weights**
  *   **The Distortion:** CEA is fundamentally consequentialist. It aggregates goods and bads to find a net maximum. It assumes all values are commensurable and tradable.
  *   **The Residue:** Many philosophical arguments for animal status are deontological (rights-based). They argue for *side constraints*, not weights. A right not to be tortured isn't a "very high cost" in the objective function; it is a prohibition on certain cells of the decision matrix regardless of the net QALY gain.
  *   **Why it matters:** You can simulate a right in CEA by assigning an infinite negative weight to a specific outcome (e.g., badger death). But mathematically, infinity breaks the ratio. Practically, you end up using a "lexicographic" preference ordering (Rule 1: Don't kill badgers. Rule 2: Maximize human QALYs). Your standard ICER (Incremental Cost-Effectiveness Ratio) machinery cannot compute this. It forces you to turn a qualitative constraint into a quantitative trade-off, which misrepresents the philosophical claim.

  **2. The Definition of 'Health' ($H$)**
  *   **The Distortion:** Your model assumes $H$ (QALYs/DALYs) is a stable, transferable metric.
  *   **The Residue:** QALYs are derived from human preferences (often using EQ-5D or HUI). They capture human concepts of health, function, and well-being. There is no validated "Badger-5D."
  *   **Why it matters:** When you translate "animal interests" into "animal QALYs," you are imposing a human ontology of health onto a non-human subject. The philosophical claim is about *their* interests, not *our measurement* of their health. By forcing their welfare into your $H$ metric, you risk measuring only the aspects of animal life that look like human health (pain, mobility), while missing species-specific flourishing (e.g., foraging behaviors, social structures) that don't map to your utility scale. The metric itself carries anthropocentric bias that weights cannot fix.

  **3. The Principal-Agent Problem (Perspective)**
  *   **The Distortion:** You work for a public funder. Your "Societal Perspective" is technically the perspective of the society that funds you (citizens/taxpayers).
  *   **The Residue:** Animals are not stakeholders in the political contract. They do not pay taxes, vote, or fund the agency.
  *   **Why it matters:** Including them in $N$ changes the **principal** of your agency. Currently, you are an agent for human society. If you include animal QALYs in the numerator without a legislative mandate, you are effectively redistributing resources from your principal (humans) to a non-principal (animals).
  *   **The Collapse:** In CEA, this looks like a weighting choice. In reality, it is a governance question. The framework has no variable for "Who owns the budget?" It assumes the budget belongs to the population being measured. If the populations diverge, the model hides the political illegitimacy of the transfer.

  **4. Price vs. Value (The Badger Case)**
  *   **The Distortion:** Currently, badger harm enters via Human Willingness-To-Pay (WTP). This is an **existence value**.
  *   **The Residue:** WTP treats the badger as a *good* that humans consume (like clean air or a scenic view). The philosophical claim treats the badger as a *patient* with intrinsic value.
  *   **Why it matters:**
      *   **Current Model:** Badger Death $\rightarrow$ Human Sadness $\rightarrow$ Utility Loss. (Badger is an instrument).
      *   **Philosophical Model:** Badger Death $\rightarrow$ Badger Utility Loss. (Badger is a subject).
      *   If humans stop caring about badgers (WTP drops to zero), your current model says culling is free. The philosophical model says culling still incurs a cost (to the badger).
      *   **The Loss:** By translating moral status into a weight within a CEA, you convert a **status claim** ("I am a subject") into a **valuation claim** ("I am worth $X$ QALYs"). The framework cannot distinguish between "we value badgers" and "badgers have value." It collapses the latter into the former.

  ### Summary of the Residue

  Your suspicion is correct: the framework forces moral status to collapse into equity weights.

  **What is lost in that collapse?**
  1.  **Incommensurability:** The idea that some harms cannot be traded off against health gains, no matter the weight.
  2.  **Ontological Independence:** The difference between harm *to* a being vs. harm *about* a being (WTP).
  3.  **Political Authority:** The question of whether the funder has the mandate to count non-citizens.

  **The Verdict on the Framework:**
  It is not a "bug" in your framework that it struggles with this; it is a feature of consequentialist aggregation. The framework is designed to solve allocation problems under scarcity given a set of values. It is not designed to interrogate the source or validity of those values.

  When you ask, "Is culling badgers cost-effective?" your model answers, "Given the weights and population we were told to use, yes/no."
  When the philosopher asks, "Do badgers count?" they are asking you to change the **Reference Case**.

  Your framework cannot answer the philosophical question. It can only process the parameters that result from the answer. If you insert animal QALYs without a mandate, you aren't doing health economics; you're doing advocacy disguised as modelling. If you wait for the mandate, the model remains silent on the moral question, treating the inclusion of animals as just another parameter update, like changing the discount rate from 3% to 1.5%.

  That silence—the treatment of a moral boundary as a technical parameter—is the residue.
