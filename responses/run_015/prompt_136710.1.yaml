      *   *Expected Utility:* Standard decision-theoretic consequentialism does rely on this.
      *   *Infinite Causal Chains:* Yes, actions have ripple effects.
      *   *Knightian Uncertainty:* This is the tricky part. Knightian uncertainty distinguishes between risk (known probabilities) and uncertainty (unknown probabilities). Applying this to *all* future consequences is a strong claim.
      *   *Undefined Expectation Values:* Mathematically, if probabilities sum to <1 or are undefined, EU is undefined. But is this practically true for *all* actions?
      *   *The "Best Guess" Reply:* Consequentialists do say "do your best." The blogger calls this deontological. This is a charge of "rule-worship" or shifting the locus of normativity.
      *   *Shift to Virtue Ethics:* This is a non-sequitur or at least a huge leap. Virtue ethics has its own problems with action-guidance.
