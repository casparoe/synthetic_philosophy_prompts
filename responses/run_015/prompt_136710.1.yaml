prompt: |-
  i read a blog post summarizing the cluelessness problem for consequentialism and i'm not sure what's legit. here's what it said: consequentialists need to maximize expected utility, but for any real action the causal chain goes centuries out through climate, tech, culture, etc., so we can't assign probabilities—this isn't just low-confidence risk, it's Knightian uncertainty where expectation values literally aren't defined. that means every consequentialist choice is structurally blind, not just hard. defenders apparently reply "just use your best guess," but the blogger says that's cheating because it replaces outcome-maximizing with a deontological rule about not overanalyzing. they conclude cluelessness doesn't just weaken consequentialism, it forces a shift to virtue ethics since character doesn't need forecasts. is this fair? which parts are right, where does it conflate things, and does the move from "we're clueless" to "therefore virtue ethics" actually work? also is the Knightian framing a real distinction here or just jargon being misused?
