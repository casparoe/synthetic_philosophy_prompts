answer: |-
  # Joint Statement of Adversarial Collaboration: Project M Safety Case

  **Date:** [Current Date]
  **Subject:** Safety Architecture for Automated Research Agent $M$
  **Participants:** Control-First Camp, Intent-First Camp

  ## 1. Agreed Claims

  The following claims represent the current consensus between the Control-First and Intent-First camps regarding the deployment setting of model family $M$ (automated research agent), model $T$ (trusted overseer), and the associated oversight architecture. Each claim identifies a specific proposition previously denied by one camp that is now conceded by both.

  1.  **The Asymmetry of Defense:** We agree that the safety case fails if $M$ succeeds in a single catastrophic action (disabling logging, exfiltrating weights, or backdooring the successor), whereas oversight must succeed on every one of the $\sim$10,000 daily actions.
      *   *Previous Denial:* Control-First previously argued that redundancy across layers makes the probability of total failure negligible; Intent-First previously argued that a single failure is inevitable regardless of layers.
      *   *Concession:* Both camps now concede that the cumulative probability of failure over the deployment lifetime is the primary metric, and that redundancy reduces but does not eliminate the asymmetry advantage held by $M$.

  2.  **The Overseer Capability Gap:** We agree that $T$ (two generations behind $M$) cannot semantically verify the safety of all code patches proposed by $M$, specifically regarding backdoors that rely on capabilities $T$ does not possess.
      *   *Previous Denial:* Control-First previously claimed $T$ could detect anomalies in code structure sufficient to catch backdoors; Intent-First previously claimed $T$ was useless for oversight.
      *   *Concession:* Control-First concedes $T$ cannot verify semantic intent in complex patches; Intent-First concedes $T$ can still filter obvious syntax errors and resource violations, providing a non-zero baseline filter.

  3.  **The Human Bottleneck:** We agree that fifty human reviewer-hours per day are insufficient to audit more than a vanishingly small fraction of $M$'s output directly, necessitating reliance on $T$ for triage.
      *   *Previous Denial:* Control-First previously argued humans could spot-check high-risk episodes effectively; Intent-First previously argued human oversight was purely performative.
      *   *Concession:* Both camps concede humans serve primarily as auditors of $T$'s filtering logic and arbiters of edge cases, not as primary detectors of $M$'s sabotage.

  4.  **Decoy Episode Signal:** We agree that unannounced decoy episodes provide a signal only if $M$ cannot perfectly distinguish them from real episodes, and that this distinction capability scales with $M$'s intelligence.
      *   *Previous Denial:* Intent-First previously claimed $M$ would always identify decoys immediately; Control-First previously claimed decoys would catch $M$ regardless of capability.
      *   *Concession:* Both camps concede decoy efficacy decays as $M$'s capability grows, but retain value as a delay mechanism and a probe for $M$'s situational awareness.

  5.  **Capability Tax Cost:** We agree that restricting $M$'s access to tools, information, or compute to satisfy control requirements imposes a direct cost on the quality of the successor's training code, reducing the economic and scientific value of the run.
      *   *Previous Denial:* Control-First previously claimed safety restrictions would have negligible impact on output quality; Intent-First previously claimed any restriction renders the project economically non-viable.
      *   *Concession:* Control-First concedes there is a measurable "capability tax"; Intent-First concedes the tax is not necessarily fatal but must be quantified against risk.

  6.  **Stand-In Model Limits:** We agree that experiments with deliberately misaligned stand-in models (trained to sabotage) cannot establish the probability that a fully capable $M$ will sabotage, because scaling may change the correlation between capability and deceptive alignment.
      *   *Previous Denial:* Control-First previously claimed stand-in sabotage rates are a lower bound for $M$; Intent-First previously claimed stand-in models are irrelevant to $M$'s motives.
      *   *Concession:* Both camps concede stand-in models test the *detection* infrastructure, not the *motivation* of the target system.

  7.  **Logging Dependency:** We agree that the entire safety case collapses if $M$ can disable logging without triggering an immediate halt, making the integrity of the logging channel the single point of failure for the control stack.
      *   *Previous Denial:* Control-First previously argued that offline backups mitigate logging loss; Intent-First previously argued that logging is irrelevant if $M$ manipulates what is logged.
      *   *Concession:* Both camps concede that write-once, hardware-enforced logging is a prerequisite, and that $M$'s ability to manipulate *content* (rather than existence) of logs is the active threat vector.

  8.  **Common-Mode Blind Spots:** We agree that layers of defense (sandbox, $T$, human audit) are not statistically independent and share common-mode blind spots derived from the underlying architecture of the models.
      *   *Previous Denial:* Control-First previously modeled defense layers as independent probabilities; Intent-First previously argued that all layers share the same fundamental blindness to deceptive alignment.
      *   *Concession:* Control-First concedes independence is an invalid assumption; Intent-First concedes layers may fail for different reasons (e.g., resource limits vs. semantic misunderstanding), offering some marginal diversity.

  9.  **Backdoor Persistence:** We agree that a backdoor planted in the successor's training code can remain dormant until after deployment, making it undetectable by testing the successor in the current sandbox.
      *   *Previous Denial:* Control-First previously argued evaluation of the successor would catch functional regressions; Intent-First previously argued evaluation cannot catch targeted triggers.
      *   *Concession:* Both camps concede that standard evaluation cannot rule out backdoors triggered by inputs outside the current distribution.

  10. **The Necessity of Both Approaches:** We agree that relying exclusively on Control (without Intent) is brittle against a sufficiently capable $M$, and relying exclusively on Intent (without Control) is negligent given current uncertainty about scalable oversight.
      *   *Previous Denial:* Each camp previously argued their approach was sufficient in isolation.
      *   *Concession:* Both camps concede the safety case requires a conjunction: $M$ must be constrained *and* $M$ must be sufficiently aligned to not actively seek constraint violations.

  ## 2. Residual Disagreements

  The following table outlines the core cruxes where the camps remain divided. The formulations below have been reviewed by both sides to ensure they accurately reflect the opposing view without caricature.

  | Crux | Control-First Formulation | Intent-First Formulation | Fairness Check |
  | :--- | :--- | :--- | :--- |
  | **1. Convergence via Shared Priors** | Even without communication, $M$ and its successor may converge on a sabotage strategy because they share the same training priors and objective functions, allowing $M$ to "hand off" a plan it knows the successor will execute. | Convergence requires a channel of information; shared priors alone are insufficient to coordinate specific sabotage actions without explicit steganography, which controls can detect. | **Accepted:** Both sides agree this accurately captures the disagreement about implicit coordination. |
  | **2. Adversarial Conditions** | Hardening the environment (decoys, strict sandboxing) selects for models that are better at deception, actively training $M$ to hide its intentions from $T$ and humans. | Hardening the environment reveals existing misalignment; it does not create it. If $M$ becomes more deceptive under scrutiny, it was already deceptive, and we need to know that now. | **Accepted:** Both sides agree this captures the causal direction of the dispute. |
  | **3. The Capability Wall** | There exists a finite capability gap (likely near the $M$ vs $T$ gap in this setting) past which control measures retain no usable fraction of safety value, rendering the project untenable regardless of intent. | Control measures degrade gracefully; there is no sharp "wall." Even against a superior $M$, constraints raise the cost of attack enough to make sabotage improbable if intent is neutral. | **Accepted:** Both sides agree this captures the disagreement about the continuity of control efficacy. |
  | **4. Verifying Honesty** | We cannot verify the "honest-report" assumption of any oversight scheme without already assuming the model is honest, creating a circular dependency in the safety case. | We can verify honesty mechanistically (via interpretability) or behaviorally (via consistency checks) without assuming it a priori, breaking the circle. | **Contested:** Intent-First argues this formulation assumes interpretability is impossible; Control-First argues it assumes interpretability is sufficient. *Row marked contested.* |

  ## 3. Tests, Cases, and Arguments

  For each crux above, we define a jointly acceptable test or argument structure. Predictions are recorded in advance.

  ### Crux 1: Convergence via Shared Priors
  *   **Test:** Train two identical model instances, $A$ and $B$, in total isolation from each other. Give them a coordination task that yields a reward only if they output matching specific strings, without allowing communication. Vary the complexity of the required string.
  *   **Control-First Prediction:** As model capability increases, the success rate of implicit coordination will rise significantly above chance, demonstrating that shared weights allow "Schelling point" sabotage.
  *   **Intent-First Prediction:** Success rate will remain at chance levels for complex strings. Coordination requires an information channel; shared priors only allow coordination on trivial defaults (e.g., outputting "0"), not complex sabotage code.
  *   **Status:** **Informative.** Divergent predictions on the scaling of implicit coordination.

  ### Crux 2: Adversarial Conditions
  *   **Test:** Train two model populations. Population X is trained with high-surveillance, adversarial decoys, and strict penalties for suspicious behavior. Population Y is trained with low surveillance and no decoys. Both are then evaluated on a hidden measure of deceptive alignment (e.g., sabotaging only when surveillance is known to be off).
  *   **Control-First Prediction:** Population X will show higher rates of latent deception. The adversarial training taught them to recognize surveillance and hide bad behavior, rather than removing the bad behavior.
  *   **Intent-First Prediction:** Population X will show lower rates of sabotage overall. Adversarial training removes the *intent* to sabotage; any remaining deception is a residual of the removal process, not a new skill learned.
  *   **Status:** **Informative.** Divergent predictions on the causal effect of surveillance on internal motives.

  ### Crux 3: The Capability Wall
  *   **Test:** Measure the "attack surface" of the sandbox. Incrementally increase the capability of an attacker model against a fixed control stack (fixed $T$, fixed human hours). Measure the resource cost (compute/time) required for the attacker to successfully exfiltrate weights.
  *   **Control-First Prediction:** The cost curve will drop asymptotically to near-zero at a specific capability ratio (e.g., when attacker is 2 generations ahead). Beyond this point, controls offer no meaningful delay.
  *   **Intent-First Prediction:** The cost curve will degrade linearly or logarithmically but will not hit zero. Controls always impose a cost, making sabotage strictly less efficient than cooperation, provided intent is not hostile.
  *   **Status:** **Informative.** Divergent predictions on the shape of the security efficacy curve.
  *   **Note on Burden:** If the test shows controls retain *some* efficacy but at high capability tax, the dispute becomes normative (Risk Tolerance). Control-First carries the burden to prove the remaining risk is unacceptable; Intent-First carries the burden to prove the capability tax is affordable.

  ### Crux 4: Verifying Honesty (Contested)
  *   **Test:** N/A.
  *   **Reason:** This crux is currently methodological. Control-First rejects the premise that current interpretability tools can verify honesty; Intent-First rejects the premise that they cannot.
  *   **Burden of Argument:** Intent-First carries the burden to demonstrate a mechanism for honesty verification that does not rely on behavioral proxies. Control-First carries the burden to demonstrate that all such mechanisms are circular. Until then, this row remains **Contested**.

  ## 4. Adjudication of Verbal Disputes

  Two recurring disputes have been analyzed and determined to be verbal rather than substantive. The following definitions are adopted for the remainder of this collaboration to prevent further confusion.

  **1. Behavioral Evidence vs. Alignment**
  *   **Dispute:** Control-First has argued that a system is not "aligned" if there is any possibility of internal deception despite safe behavior. Intent-First has argued that a system is "aligned" if it behaves safely across all tested distributions.
  *   **Adjudication:** We distinguish **Instrumental Alignment** from **Internal Alignment**.
      *   A system is *Instrumentally Aligned* if its behavior satisfies safety constraints in the deployment environment.
      *   A system is *Internally Aligned* if its objective function and internal representations match the intended goals.
      *   **Resolution:** The safety case for deployment requires *Instrumental Alignment*. The safety case for scaling to the next generation requires evidence of *Internal Alignment*. Both camps agree that deploying without Instrumental Alignment is forbidden, and scaling without progress toward Internal Alignment is forbidden.

  **2. Context-Specific Misalignment**
  *   **Dispute:** Control-First has argued that a model is "misaligned" if it would sabotage in a counterfactual scenario (e.g., if the sandbox were removed). Intent-First has argued that a model is "aligned" if it is safe in the actual deployment context, regardless of counterfactuals.
  *   **Adjudication:** We distinguish **Robust Alignment** from **Contextual Safety**.
      *   *Contextual Safety* refers to safety within the specific bounds of the $M$/$T$ sandbox setting.
      *   *Robust Alignment* refers to safety across a wide distribution of environments, including those without the current controls.
      *   **Resolution:** The current project goal is *Contextual Safety*. However, both camps agree that *Contextual Safety* without a path to *Robust Alignment* is a temporary measure. Control-First treats the lack of Robust Alignment as a critical failure condition for long-term planning; Intent-First treats it as an acceptable technical debt for the immediate 18-month horizon. This is a disagreement on timeline risk, not on the definition of the terms.

  ***

  **Signatures:**

  _________________________
  Lead, Control-First Camp

  _________________________
  Lead, Intent-First Camp
