prompt: |-
  Hey — need some help precisifying something because I keep tieing myself in knots and my advisor's entire contribution was "well, when in Rome," which is not an argument.

  Context: I'm a philosophy PhD student (social ontology, coordination norms, that general area), and I spent two months in the US on a visiting thing. I'm from a country where nobody tips and where jaywalking is an actual fine that people actually pay. Two arguments with the same friend:

  1. I tipped 10% at a restaurant and got told "when in Rome" — meaning I owe the 20%.
  2. I waited for the walk signal in a city where literally everyone crosses whenever, and got told "when in Rome" — meaning I should have crossed.

  So the slogan got used to push me above my home norm in one case and below it in the other, and I want to know what it could actually mean such that it does that work.

  What I want is a menu, not an essay: the distinct precise claims "when in Rome, do as the Romans do" could be expressing. For each one: state it sharply enough that it could be false; label it trivial / substantive-and-defensible / false-or-incoherent; say what it implies about each of my two cases; and say specifically whether it gives a reason to a *visitor*, as opposed to a local. Please don't give me sources or a reading list, I just want the arguments.

  Here's the part I can't get straight, and I suspect it's where the real action is. The standard story about why you should follow a convention is equilibrium stuff: it's arbitrary which one we land on, you benefit from it, you'd be free-riding or eroding it if you defected. But a visitor is in town for two weeks — their compliance can't sustain the convention and their defection can't destabilize it. Call it the two-week problem if that helps. So either the reading doing work in my friend's mouth isn't the equilibrium reading at all, or visitors do affect conventions somehow and I'm wrong about that. I genuinely don't know which.

  I've also been sorting the cases into three buckets — tell me if this taxonomy is doing any work or if it's a red herring:

  - pure coordination: drive on the right, queue vs. scrum. Content is arbitrary, only the coordination matters.
  - transfer conventions: tipping. Nothing about it is coordination; the point is that money moves, and in the US a chunk of the worker's actual wage is routed through it.
  - deference conventions: where conforming signals something like "I accept that I'm governed by your norms while I'm here" — waiting your turn patiently, not making a scene, not loudly announcing that home does it better.

  I want each reading tested against those buckets: which readings only make sense for pure coordination cases, which extend to the transfer ones, which only make sense for the deference ones. And two stress tests I've been playing with:

  - the invisible tourist: you're in Rome, no local will ever observe you, nothing you do affects whether the convention persists, and nobody is inconvenienced either way. Does the reading still say you have a reason to comply? If it goes quiet here, that's informative and I want you to say so.
  - the bad Rome: the local convention is genuinely bad — the scrum really does hurt elderly people, the tipping norm is what lets restaurants pay a wage nobody could live on. Does the reading still tell you to comply? If it definitely does, it's collapsed into relativism, and I want that said explicitly rather than politely avoided.

  Two more readings I think are in the neighborhood and want separated: one on which you should do what the Romans do *for the reasons they do it* (tip where tipping is how the wage is structured, don't tip where it's basically a shakedown), and one on which you should do what the Romans *expect of you* — which is not the same thing, since locals usually cut tourists slack but sometimes expect more of them. I think those two come apart in my tipping case in opposite directions, and I want to know which one my friend was invoking, or whether he was sliding between them depending on which one got him the verdict he wanted.

  Format: numbered readings, a few sentences each, verdict attached to each. Finish with two short paragraphs: which reading (if any) would actually make his use of the slogan more than a conversation-ender, and which reading is the most commonly meant and the weakest.
