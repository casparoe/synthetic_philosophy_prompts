answer: |-
  1. **The Causal Equilibrium Claim**
     *   **Claim:** You should conform because your action helps sustain the convention; defection contributes to its erosion.
     *   **Verdict:** **False-or-incoherent** (for visitors). It ignores the "Two-Week Problem": a single visitor's compliance or defection has zero causal impact on the stability of a large-scale convention.
     *   **Implications:** Fails both cases. Your tipping or waiting changes nothing about the US norms.
     *   **Visitor Reason?** No. This gives reasons only to locals with causal leverage.
     *   **Taxonomy:** Pure Coordination only (fails Transfer/Deference).
     *   **Stress Tests:** **Invisible Tourist:** No reason (no impact). **Bad Rome:** No reason (no impact).

  2. **The Fairness/Free-Rider Claim**
     *   **Claim:** You benefit from the local system (service, traffic flow), so fairness requires you to bear your share of the burdens (tips, waiting) even if you don't sustain the system.
     *   **Verdict:** **Substantive-and-defensible.** It shifts justification from *causal impact* to *receipt of benefit*.
     *   **Implications:** **Tip:** Yes (you ate the food supported by tip-wages). **Jaywalk:** Weak (did you benefit from the chaos or the order?).
     *   **Visitor Reason?** Yes. Visitors receive benefits locals produce.
     *   **Taxonomy:** Transfer (strongest), Pure Coordination (weak).
     *   **Stress Tests:** **Invisible Tourist:** Yes (if you still benefit). **Bad Rome:** No (if the system is exploitative, you owe no fairness debt to it).

  3. **The Normative Expectation Claim**
     *   **Claim:** You should do what locals *expect of you specifically*, regardless of what they do themselves or why.
     *   **Verdict:** **Substantive-and-defensible.** It relies on the normative force of being relied upon, not the content of the act.
     *   **Implications:** **Tip:** Yes (waiters expect 20% from tourists). **Jaywalk:** No (locals often expect tourists to be cautious/wait).
     *   **Visitor Reason?** Yes. This is uniquely about the visitor-local relationship.
     *   **Taxonomy:** Deference (strongest), Transfer.
     *   **Stress Tests:** **Invisible Tourist:** No (no one expects anything). **Bad Rome:** Yes (if they expect it, you owe it, risking relativism).

  4. **The Functional Assimilation Claim**
     *   **Claim:** You should act on the *reasons* that justify the norm locally (e.g., "tips are wages"), adopting the local functional logic rather than your home logic.
     *   **Verdict:** **Substantive-and-defensible.** It demands epistemic uptake of local social structures.
     *   **Implications:** **Tip:** Yes (accept the wage structure). **Jaywalk:** Maybe (if the reason is flow efficiency, but safety might override).
     *   **Visitor Reason?** Yes. Visitors are capable of understanding local reasons.
     *   **Taxonomy:** Transfer (strongest), Pure Coordination.
     *   **Stress Tests:** **Invisible Tourist:** Yes (reasons exist regardless of observation). **Bad Rome:** No (if the local reason is morally bankrupt, you shouldn't adopt it).

  5. **The Symbolic Deference Claim**
     *   **Claim:** Conformity signals respect for the host community's normative sovereignty; defection signals arrogance or colonialism.
     *   **Verdict:** **Substantive-and-defensible.** It treats norms as expressions of local autonomy.
     *   **Implications:** **Tip:** Yes (respect their labor model). **Jaywalk:** Yes (respect their street culture).
     *   **Visitor Reason?** Yes. This applies specifically to guests vs. hosts.
     *   **Taxonomy:** Deference (exclusive).
     *   **Stress Tests:** **Invisible Tourist:** Yes (respect is an internal attitude). **Bad Rome:** Yes (risks collapsing into relativism; demands respect for bad norms).

  6. **The Prudential Sanction Claim**
     *   **Claim:** You should conform to avoid negative consequences (fines, social shaming, bad service).
     *   **Verdict:** **Trivial.** This is instrumental rationality, not normative obligation.
     *   **Implications:** **Tip:** Yes (avoid shame). **Jaywalk:** Yes (avoid fine/death).
     *   **Visitor Reason?** Yes. Visitors are often more vulnerable to sanctions.
     *   **Taxonomy:** All buckets (indiscriminately).
     *   **Stress Tests:** **Invisible Tourist:** No (no sanction). **Bad Rome:** Yes (avoiding harm is still prudent).

  ***

  The only reading that makes your friend's use of the slogan more than a conversation-ender is **The Functional Assimilation Claim** (Reading 4) or **The Fairness Claim** (Reading 2). These are the only ones that explain why the *direction* of the obligation flips based on the context (tips vs. jaywalking) without relying on causal efficacy you don't have. Functional Assimilation explains the tip (adopt the wage reason) but might not explain the jaywalking (unless the reason is flow, which is weak for a visitor). Fairness explains the tip (you ate the food) but struggles with the jaywalking (did you benefit from the jaywalk?). If your friend meant either of these, they owe you an account of *why* the visitor benefits or *what* the local reason is, rather than just citing the slogan.

  The most commonly meant reading is **The Normative Expectation Claim** (Reading 3), but it is also the weakest philosophically because it relies on empirical contingencies about what locals happen to expect of tourists (which is often "nothing" or "slack"). It allows your friend to slide between "locals expect this" and "locals do this" depending on which verdict they want. In your jaywalking case, locals likely *do* jaywalk but *expect* tourists to wait for safety; invoking WIR there is factually false under this reading. In the tipping case, locals expect the tip; invoking WIR is true. This reading makes the slogan a proxy for "don't annoy people," which is useful advice but lacks the normative depth your friend implies.
