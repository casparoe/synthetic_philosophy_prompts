prompt: |-
  The particularist-generalist debate in moral philosophy—between those who hold that moral reasons are irreducibly context-sensitive and that no exceptionless principles govern them, and those who hold that qualified, hierarchical, or ceteris-paribus principles do capture genuine moral structure—has been at an impasse for decades. Particularists routinely invoke feature-shifting cases: kindness that is virtuous in one setting becomes patronizing or cruel in another, suggesting that the moral valence of a property is not intrinsic but depends on the whole gestalt of the situation. Generalists respond that this demonstrates only our epistemic difficulty in stating fully qualified principles, not that no such principles exist; they propose layered, defeasible, or weighted rules that accommodate context without abandoning generality. The standard moves are now completely familiar—particularists cite the shape of the moral landscape, generalists reply with hidden conditions or weighting schemes—yet neither side has conceded ground, and no new formal result or empirical finding has broken the symmetry.

  My working suspicion is that the stall is not really about whether principles exist, but about a deeper, largely unacknowledged disagreement over whether moral explanation is compositional. Particularists seem to treat a reason—say, that an act causes suffering—as never explaining the wrongness of that act except in conjunction with an ineliminable contextual background; the explanatory work is done by the situation as a whole. Generalists, by contrast, treat reasons as modular: suffering counts against an action in a way that can be isolated, weighed, and subsumed under a principle, even when other reasons override it. If this diagnosis is right, the two sides are not disagreeing about the metaphysics of principles at all, but about what a moral explanation must look like—whether citing a feature like unnecessary harm ever genuinely explains a judgment, or whether explanation always requires citing the full contextual shape.

  But I am unsure whether this is correct. The disagreement might instead be verbal, with one side using 'principle' to mean exceptionless universal law and the other to mean any generalizable pattern. It might be that the sides are answering different questions—one about the ontology of reasons, one about the psychology of moral learning—under a single heading. Or there might be a hidden empirical question about how human moral cognition actually operates, masked by apparently conceptual arguments. There may also be bedrock intuitions about whether moral judgment is more like perceptual recognition or like inferential reasoning, which neither side can argue for from shared premises. I want a diagnosis supported by what each side actually says, not a survey of positions and not a verdict on who is right: is this a substantive disagreement about the structure of moral reality, a methodological dispute about what moral theory should aim for, or an ill-posed question that should be dissolved? Given your diagnosis, what exactly would count as progress? Would it require a formal model of reason-combination that demonstrates the failure of compositionality, a conceptual distinction that cleanly separates ontological holism about reasons from epistemic anti-codifiability, an empirical study of moral cognition, or should we conclude that no progress should be expected and that particularists and generalists ought to abandon their shared vocabulary? Be concrete about what each side is committed to and about what, if anything, could actually move the debate.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** The particularist-generalist debate in moral philosophy.
      *   **Current State:** Impasse/standoff. Standard moves (feature-shifting vs. qualified principles) are exhausted.
      *   **User's Hypothesis:** The stall is about *compositionality of moral explanation* (holistic vs. modular), not just the existence of principles.
      *   **Alternative Hypotheses:** Verbal dispute (definition of 'principle'), talking past each other (ontology vs. psychology/epistemology), empirical question (cognition), or bedrock intuition (perception vs. inference).
      *   **Task:** Diagnose the nature of the disagreement (substantive, methodological, or ill-posed) based on what each side *actually says*. Do not just survey positions or declare a winner.
      *   **Requirement:** Be concrete about commitments and specify what would count as *progress* (formal model, conceptual distinction, empirical study, or abandonment).

  2.  **Deconstruct the Debate (Mental Sandbox):**
      *   *Particularism (Dancy, McDowell, etc.):* Moral properties supervene on natural properties, but the relation isn't codifiable. Holism about reasons (a feature can be a reason in one case, irrelevant in another, or a reason for the opposite). Anti-theory.
      *   *Generalism (Hooker, McNaughton, Rawls, etc.):* Supervenience implies some general relation. Principles might be defeasible, ceteris paribus, or prima facie. Moral thought requires general concepts.
      *   *The Impasse:* Particularists say "Look, context changes valence!" Generalists say "We can add clauses to the principle to handle context!" Particularists say "That makes the principle trivial/useless!" Generalists say "It's still a principle!"
      *   *User's Compositionality Idea:* This is strong. Generalists assume $Reason(A) + Reason(B) = Outcome$. Particularists assume $Gestalt(A, B, Context) = Outcome$, where $A$'s contribution isn't isolatable.
      *   *Is it Verbal?* Sometimes. "Principle" can mean "Algorithm" vs. "Tendency." But Dancy argues against the *possibility* of codification, not just the utility. So it's deeper than semantics.
      *   *Is it Empirical?* Moral psychology (dual process theory, intuitionism) is relevant, but philosophy often treats this as normative, not descriptive. However, if moral *judgment* is the target, cognition matters.
      *   *Is it Methodological?* What is moral philosophy *for*? Action-guidance (favors generalism) vs. Accurate description of moral experience (favors particularism).

  3.  **Evaluate the User's Hypothesis (Compositionality):**
      *   The user suggests the core issue is whether moral explanation is compositional.
      *   *Generalist Commitment:* Reasons have contributory force. They combine (additively or non-additively, but still distinctively).
      *   *Particularist Commitment:* Reasons are holistic. The "force" isn't inherent to the feature.
      *   *Diagnosis:* This is the most philosophically fertile ground. It moves beyond "can we write rules?" to "how do reasons work?"
      *   *However:* Is it *just* compositionality? Or is it about the *normative authority* of principles? Generalists often argue we *need* principles for consistency/publicity. Particularists argue principles distort moral perception.
      *   *Refinement:* The disagreement is likely *methodological* grounded in a *substantive* view of reasons. It's not purely ontological (both agree supervenience holds) nor purely verbal (both know what the other means). It's about the *explanatory priority* of the general vs. the specific.

  4.  **Formulate the Diagnosis:**
      *   **Verdict:** It is a **methodological dispute grounded in divergent commitments about the nature of normative explanation.** It is not merely verbal, nor purely ontological.
      *   **Why not verbal?** Both sides understand the other's definitions (e.g., prima facie duties). The disagreement is whether those definitions capture the *reality* of moral reasoning.
      *   **Why not purely ontological?** Both agree moral properties supervene on natural ones. The fight is about the *structure* of that supervenience relation (codifiable vs. uncodifiable).
      *   **Why Methodological?** It hinges on what moral theory is supposed to *do*. If it's to guide action from the outside, generalism wins. If it's to describe the phenomenology of the virtuous agent, particularism wins.
      *   **The Compositionality Angle:** The user is right that this is the engine of the stall. Generalists assume *atomism* of reasons (they retain identity across contexts); Particularists assume *holism* (identity is context-dependent).

  5.  **Determine What Counts as Progress:**
      *   *Formal Model:* A logic of defeasible reasoning that satisfies Generalists without trivializing into "act rightly if it's right" (which Particularists accuse them of). If a formal model can show how context-sensitivity is built into the *logic* of principles without destroying their generality, that helps Generalists. If a model shows that any such system collapses into particularism, that helps Particularists. (e.g., Non-monotonic logic).
      *   *Conceptual Distinction:* We need to separate *codifiability* (can we write it down?) from *generality* (does the same feature matter elsewhere?). Particularists attack codifiability; Generalists defend generality. If we show generality doesn't require codifiability, the debate shifts.
      *   *Empirical Study:* Moral cognition research (e.g., do people reason via rules or patterns?). This addresses the *psychological* reality, but normative force remains. Still, it dissolves the "impossibility" claim if humans *do* use rules.
      *   *Abandonment:* Unlikely to be productive. The tension is necessary.
      *   *Best Path:* A conceptual clarification of "Principle" + a formal account of non-monotonic reasoning.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Validate the user's suspicion about compositionality. It's the strongest lead.
