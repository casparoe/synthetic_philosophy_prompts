      *   *Commitments:*
          *   Generalist: Reasons are atomistic/contributory. Principles are action-guiding tools.
          *   Particularist: Reasons are holistic. Principles are post-hoc generalizations (if useful at all).
      *   *The Impasse Source:* Generalists demand *action-guidance*; Particularists demand *phenomenological accuracy*. They are optimizing for different theoretical virtues.
      *   *Path to Progress:*
          1.  **Formal:** Non-monotonic logic. Can we model "default and defeat" without hiding infinite clauses? (Pollock, Horty).
          2.  **Conceptual:** Distinguish *Principles as Guides* vs. *Principles as Explanations*.
