answer: |-
  Your diagnosis is astute: the stalemate is not primarily about the *existence* of moral principles in a trivial sense, but about the **compositionality of normative explanation**. However, classifying the dispute requires precision. It is not merely a verbal disagreement, nor is it a purely ontological one (since both sides generally accept supervenience). Instead, the debate is a **methodological dispute grounded in divergent commitments about the structure of normative explanation.**

  The impasse persists because each side optimizes for a different theoretical virtue: Generalists prioritize **action-guidance and public accountability**, while Particularists prioritize **phenomenological accuracy and the integrity of moral perception**. Because they are answering slightly different questions under the same heading ("How do reasons work?"), they talk past one another.

  Here is the concrete diagnosis of the commitments, the source of the stall, and what would actually constitute progress.

  ### 1. The Diagnosis: Explanatory Structure, Not Ontology
  Both sides agree that moral properties supervene on natural properties. The disagreement is about the **mapping function** between the base (natural properties) and the supervenient (moral properties).

  *   **The Generalist Commitment (Atomism of Reasons):** Generalists are committed to the claim that reasons have **invariant contributory force**. Even if a reason is overridden, it retains its "direction" (for or against) across contexts. This implies a compositional structure: the total moral status of an act is a function of the sum (or weighted integration) of its individual features. For the Generalist, a moral explanation *must* be decomposable to be intelligible. If you cannot isolate why feature $F$ mattered, you cannot teach, critique, or generalize the judgment.
  *   **The Particularist Commitment (Holism of Reasons):** Particularists are committed to the claim that the normative significance of a feature is **context-dependent**. Feature $F$ can be a reason for action in case $C_1$, irrelevant in $C_2$, and a reason against in $C_3$. This denies compositionality. For the Particularist, the "whole" (the gestalt of the situation) is explanatorily prior to the "parts" (the features). To isolate a feature is to distort the moral reality.

  **Why this causes an impasse:**
  The Generalist treats the Particularist's "gestalt" as an epistemic black box (a failure of analysis). The Particularist treats the Generalist's "principles" as an ontological distortion (a failure of perception). The Generalist asks, "How do you know what to do without a rule?" The Particularist asks, "How can you follow a rule when the rule's application depends on the very judgment the rule is supposed to generate?"

  ### 2. Is it Verbal, Empirical, or Bedrock?
  *   **Not Merely Verbal:** It is not simply that they define "principle" differently. Generalists (e.g., Hooker, McNaughton) accept defeasible, *ceteris-paribus* principles. Particularists (e.g., Dancy) reject these not because they are too rigid, but because they claim such principles are either false (due to holism) or trivial (if qualified enough to be true, they lose explanatory power). The disagreement survives definition-stipulation.
  *   **Not Purely Empirical:** While moral psychology is relevant, the debate is normative. Even if empirical study showed humans *do* reason via heuristics (Generalism) or pattern recognition (Particularism), it would not settle whether they *ought* to, or whether moral truth *consists* in those processes. However, the "impossibility" claim of particularism (that principles *cannot* capture morality) is vulnerable to empirical falsification if human cognition proves capable of codifying complex context-sensitivity.
  *   **Bedrock Intuitions:** There is a foundational divergence regarding **moral epistemology**. Generalists lean toward a model of **inferential reasoning** (judgment as conclusion from premises). Particularists lean toward a model of **perceptual recognition** (judgment as seeing the salience of a situation). This is the "bedrock" you identified: one side sees morality as a logic, the other as a sensibility.

  ### 3. What Would Count as Progress?
  To break the symmetry, we need interventions that address the **compositionality** hypothesis directly. Progress would not look like one side "winning," but rather a clarification of the logical space that forces a synthesis or a dissolution of the conflict.

  #### A. Formal Model of Non-Monotonic Reasoning (The Strongest Candidate)
  The Generalist claim that "qualified principles" can handle context often collapses into triviality ("Do the right thing unless it's wrong"). Progress requires a formal logic of **defeasible reasoning** that is neither trivial nor rigid.
  *   **What is needed:** A formal semantics (e.g., using default logic or argumentation frameworks) that demonstrates how a reason can retain its identity while being silenced or reversed by context *without* requiring an infinite list of exceptions.
  *   **Why it moves the debate:** If a formal model can show that "holistic" behavior emerges from a system of interacting, atomistic rules (emergent compositionality), it undermines the Particularist claim that holism *requires* the abandonment of principles. Conversely, if the model shows that capturing true context-sensitivity requires so many parameters that the "principle" becomes indistinguishable from a case-description, it vindicates the Particularist.
  *   **Concrete Commitment:** Generalists must commit to a specific logic of defeasibility; Particularists must engage with whether that logic captures the *phenomenology* of reasoning or merely the *output*.

  #### B. Conceptual Distinction: Principles as Guides vs. Principles as Explanations
  The debate conflates two functions of principles:
  1.  **Heuristic/Guidance:** Helping an agent decide what to do.
  2.  **Explanatory/Justificatory:** Explaining why an act was right/wrong after the fact.
  *   **What is needed:** A rigorous argument showing whether these functions stand or fall together. Particularists often argue that if principles fail as guides (due to context), they fail as explanations. Generalists argue they can fail as simple guides but succeed as complex explanations.
  *   **Why it moves the debate:** If it can be shown that principles are *only* useful as post-hoc generalizations (explanatory) but not as decision procedures (guidance), the Generalist must retreat to a weaker position. If it can be shown that even post-hoc explanation requires decomposable reasons to be intelligible, the Particularist must retreat.
  *   **Concrete Commitment:** Generalists must concede that principles may not be algorithmic decision procedures. Particularists must concede that moral discourse requires some repeatability of reasons across cases.

  #### C. Empirical Study of "Reason-Attribution"
  You mentioned empirical cognition. The specific study needed is not just "how people judge," but **"how people attribute reasons."**
  *   **What is needed:** Experiments testing whether ordinary moral agents treat reasons as having invariant valence. Do people say "Lying is bad, but here it's good" (Generalist/Prima Facie) or "Lying isn't bad here" (Particularist/Holistic)?
  *   **Why it moves the debate:** If folk morality is robustly holistic, the Generalist burden of proof increases (they are positing a theoretical structure alien to practice). If folk morality relies on stable reason-attribution, the Particularist claim that holism is ineliminable is weakened.
  *   **Concrete Commitment:** Both sides must acknowledge that if moral cognition is fundamentally non-compositional, a theory demanding compositionality is revisionary, not descriptive.

  ### 4. Should the Vocabulary Be Abandoned?
  **No.** Abandoning the shared vocabulary would be a mistake because the tension between **generality** (fairness, consistency, publicity) and **sensitivity** (nuance, care, context) is a genuine feature of moral life, not just philosophical theory.

  *   **The Risk of Abandonment:** If we dissolve the debate, we lose the critical check each side provides. Generalism prevents particularism from collapsing into intuitionist arbitrariness ("It just felt right"). Particularism prevents generalism from collapsing into legalistic bureaucracy ("I followed the rule").
  *   **The Recommended Shift:** The debate should shift from **"Are there principles?"** to **"What is the grain size of moral explanation?"**
      *   Progress looks like acknowledging that **Generalism is a normative ideal** (how we ought to strive for consistency) while **Particularism is a phenomenological description** (how judgment actually occurs).
      *   Alternatively, progress looks like a **"Principled Particularism"**: The view that principles exist but function as *defaults* that are inherently sensitive to context, modeled via non-monotonic logic.

  ### Summary of the Path Forward
  The stall is substantive, not verbal. It is a disagreement about whether normative force is **additive** (Generalist) or **configural** (Particularist).

  **Progress requires:**
  1.  **Formal:** A logic of defeasible reasoning that avoids triviality while accommodating context-sensitivity (demonstrating whether compositionality is possible).
  2.  **Conceptual:** Separating the *guidance* function of principles from their *explanatory* function.
  3.  **Meta-Ethical:** Acknowledging that the dispute may reflect a trade-off between **public accountability** (favors Generalism) and **moral accuracy** (favors Particularism), rather than a single truth about "moral reality."

  If a formal model can demonstrate that configural holism can be simulated by complex compositional rules, the Generalist wins on ontology. If it can be shown that any such simulation destroys the *explanatory value* of the rules, the Particularist wins on methodology. Until then, the debate remains a productive friction rather than a solvable equation.
