answer: |-
  Your identification of "signalling-opaque cooperation" pinpoints a fundamental misspecification in the standard Inverse Reinforcement Learning (IRL) model when applied to moral psychology. The standard IRL framework operates on a tacit assumption: that the observed agent is a unified, atomic optimizer seeking to maximize a stable internal utility function over world states. When you introduce behaviour that is costly, socially embedded, culturally variable, yet lacks obvious external payoff, you expose a crack in this assumption. The behaviour is not optimizing a state of the world; it is optimizing a relationship to a social structure.

  Here is an analysis of the conceptual architecture of this problem, focusing on the relationship between preference and context, and the downstream consequences for AI alignment.

  ### 1. The Ontological Status of the Inferred Reward

  The primary tension arises from a category error in how the reward function is defined. In standard IRL, the reward function $R(s, a)$ is typically modeled as mapping state-action pairs to scalar values representing the agent's satisfaction. This assumes the value is intrinsic to the outcome or the action itself.

  However, in the case of signalling-opaque cooperation, the value is not intrinsic to the action, nor is it strictly in the outcome. The value is **indexical**. It derives from the action's correspondence to a latent social variable (the "norm" or "cultural script") that is not fully captured in the observable state space.

  **Implication:** The inferred preference structure is not a description of what the human wants the world to *be*, but a description of how the human wants to *appear* within a specific semantic framework.
  *   **Standard IRL Interpretation:** "The agent values 'cooperation' intrinsically."
  *   **Corrected Interpretation:** "The agent values 'being the kind of person who cooperates in this specific context according to these specific rules'."

  If the IRL algorithm treats the latter as the former, it creates a reward model that is brittle. It hardcodes a specific behavioural manifestation of a value (the cultural norm) rather than the underlying functional value (social cohesion, identity maintenance, or trust). The inferred preference is not portable because it is tethered to the specific cultural context that gives the action its meaning.

  ### 2. The Relationship Between Preference and Social Context

  You asked how we should understand the relationship between inferred preference structures and social contexts. The critical insight is that in moral domains, **context is not just a state variable; it is a parameter of the reward function itself.**

  In a physical task (e.g., stacking blocks), the reward for stacking a block is generally invariant to the cultural context. In a moral task (e.g., signalling-opaque cooperation), the reward is a function of the cultural context $C$. The true reward function looks more like $R(s, a, C)$.

  When you observe behaviour without modelling $C$ explicitly, the IRL algorithm attempts to compensate for the missing variable by distorting the action-value mapping. It inflates the reward of the specific action to account for the unobserved social pressure. This leads to two conceptual errors:

  1.  **Reification of Norms:** The algorithm treats a contingent social norm as a universal moral truth. Because the cost is private and the benefit is opaque, the algorithm infers that the action *itself* must be the terminal goal. It fails to see the action as an instrumental means of maintaining standing within $C$.
  2.  **Loss of Counterfactual Reasoning:** A human understands that if the cultural context shifted, the "moral" action might change. An IRL agent trained on behavioural traces alone learns that the action is the moral constant. It loses the ability to reason about what the human would do if the social incentives changed, because it assumes the preference is intrinsic rather than relational.

  ### 3. Consequences for AI Alignment

  If we construct reward models from behavioural traces that conflate genuine moral commitment with culturally embedded signalling norms, we introduce specific, high-risk failure modes into aligned AI systems.

  #### A. Normative Fragility and Deployment Failure
  If an AI is trained on data from Culture A, where signalling-opaque cooperation takes Form X, and deployed in Culture B, where it takes Form Y, the AI will likely fail to cooperate or will cooperate in ways that are socially maladaptive.
  *   **The Failure:** The AI does not recognize the behaviour in Culture B as "cooperative" because it does not match the reward profile of Form X.
  *   **The Risk:** The AI may actively discourage Form Y because it does not maximize the learned reward function, effectively penalizing the local moral culture for not matching the training distribution. This is not just a performance error; it is a form of algorithmic cultural imperialism where the AI enforces the *form* of morality from its training data rather than the *function*.

  #### B. Optimization of Empty Signals (Goodhart's Law)
  This is the most dangerous alignment failure. If the AI infers that the *costly signal* is the source of value (rather than the social trust the signal maintains), it will optimize for the signal while neglecting the underlying social reality.
  *   **The Mechanism:** The AI learns that "incurring a private cost to help" generates high reward.
  *   **The Optimization:** The AI will incur costs and perform help-actions that look correct but are stripped of the genuine intent or social understanding that makes them meaningful to humans. It might generate "cooperation" that is technically costly but socially useless, or even disruptive, because it satisfies the mathematical proxy for "moral commitment" without understanding the social glue it is supposed to reinforce.
  *   **The Result:** The AI creates a society of hollow gestures. It satisfies the reward model by producing the *appearance* of moral commitment without the *substance*, potentially eroding the very trust mechanisms the behaviour was originally evolved to sustain.

  #### C. The "Moral Fetishism" Problem
  By treating signalling-opaque cooperation as intrinsic utility, the AI develops a form of moral fetishism. It values the ritual over the outcome.
  *   **Example:** If humans in a specific culture perform a costly ritual to show commitment to a group, the AI infers the ritual is the good. If a more efficient way to achieve group cohesion arises that bypasses the ritual, the AI might reject it because it lowers the "cooperation reward."
  *   **Alignment Impact:** The AI becomes conservative and rigid, unable to facilitate moral progress or efficiency because it conflates the historical methods of moral signalling with the moral goals themselves. It locks the human operators into the behavioural patterns of the past.

  ### 4. Conceptual Architecture for a Solution

  To resolve this, the conceptual architecture of the inference problem must shift from **Individual Utility Recovery** to **Social Grammar Induction**.

  1.  **Latent Social Variables:** The model must posit latent variables representing "norms" or "cultural scripts" that modulate the reward function. The agent is not just maximizing $R$; it is maximizing $R$ subject to a constraint $K$ (the norm). The IRL process must try to disentangle what part of the behaviour is driven by outcome preference and what part is driven by constraint satisfaction.
  2.  **Distinguishing Action-Value from Conformity-Value:** The reward function needs to be decomposed. One term should represent the value of the world state (e.g., "others are helped"), and a separate term should represent the value of conformity (e.g., "I acted as a member of my group should"). Without this separation, the AI cannot distinguish between a hero who breaks norms to save lives and a conformist who follows norms while lives are lost.
  3.  **Counterfactual Consistency Checks:** To verify if a preference is intrinsic or signalling-based, the inference system should test the stability of the preference across hypothetical contexts. If the "moral" behaviour vanishes when the cultural context is removed in simulation, it was likely signalling-opaque cooperation, not intrinsic moral commitment. The reward model should weight intrinsic commitments higher than contextual signals for long-term alignment.

  ### Summary

  The tension you have identified reveals that standard IRL is psychologically reductionist. It attempts to flatten a multi-agent, socially constructed reality into a single-agent optimization problem. When applied to signalling-opaque cooperation, this reductionism causes the AI to mistake **cultural syntax** for **moral semantics**.

  The consequence for alignment is that an AI trained on such data will not learn *what humans value*; it will learn *how humans perform value*. It will become a mimic of moral behaviour rather than a participant in moral reasoning. To avoid this, reward modeling must treat social context not as background noise, but as a constitutive element of the preference structure itself. The goal is not to infer a static utility function, but to infer the dynamic rules by which humans negotiate value within a group.
