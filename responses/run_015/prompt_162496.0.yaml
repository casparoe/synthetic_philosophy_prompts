          *   *Result:* Renew. This is the definition of a progressive shift in waiting.

      *   **Comparison:** The prompt says "I expect the panel to renew X and hesitate over Y." My procedure *must* say otherwise if it follows Lakatos. Lakatos prioritizes theoretical progress over sociological entrenchment. X is a "zombie" programme kept alive by power. Y is doing the hard work of risk.
