      *   *Step 6: Revival Clause.* (Addressing Difficulty 3)
      *   *Decision Point:* Where does it stop being science and start being values?

      *   *Refining the Ad Hoc Test:* Lakatos says an auxiliary is ad hoc if it saves the theory but yields no *new* testable content. It's non-ad hoc (honest) if it implies *excess empirical content* (new predictions).
      *   *Refining Hard-core Laundering:* How to spot it? If a claim was previously treated as testable/auxiliary and now is "core" *after* failure, that's laundering. Core should be stable *before* the crisis.
