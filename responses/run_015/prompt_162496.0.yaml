  2.  **Develop the Lakatosian Decision Procedure:**

      *   *Core Concept:* A Research Programme (RP) is *progressive* if it predicts novel facts. It is *degenerating* if it only explains anomalies post-hoc via ad hoc adjustments.
      *   *Structure:* Needs to be a step-by-step checklist for scientists.
      *   *Step 1: Identify the Core and Auxiliaries.* (Baseline)
