answer: |-
  ### The Lakatosian Renewal Procedure (LRP)

  This procedure is designed for working scientists. It operationalizes Imre Lakatos's methodology of scientific research programmes (MSRP) into a binary decision tree with a specific "Probationary" branch. It separates **Epistemic Merit** (scientific progress) from **Institutional Merit** (field health/careers).

  **Input Material:** The group's renewal report must include: (1) A statement of the "Hard Core" (unchallengeable assumptions) identical to the one submitted in the previous cycle; (2) A log of all empirical anomalies encountered in the last 5 years; (3) A list of all auxiliary revisions made to resolve those anomalies; (4) A list of novel facts predicted *before* observation.

  ---

  #### Phase 1: The Integrity Check (Hard-Core Laundering)
  **Question 1:** Has any proposition moved from the "Auxiliary" or "Testable Implication" list in the previous cycle's report to the "Hard Core" in this cycle's report following an empirical failure?
  *   **Sufficient Answer:** "No." Or, if "Yes," a justification that the move was made for theoretical unification *prior* to the specific anomaly, not in response to it.
  *   **Failure Condition:** A claim is reclassified as "constitutive" only after it failed a test.
  *   **Verdict:** If **Failure Condition** is met, flag as **Evasive**. The programme is immediately placed on **Probation** (see Phase 4), regardless of other merits.

  #### Phase 2: The Ad Hoc Test (Auxiliary Revisions)
  **Question 2:** For every auxiliary revision made to save the core from an anomaly, does the revision yield *excess empirical content*?
  *   **Operational Definition:** "Excess empirical content" means the revision predicts a *new* type of fact, distinct from the anomaly it was designed to fix, which was not used to construct the revision.
  *   **Sufficient Answer:** "Yes. Revision R was made to fix Anomaly A. Revision R also predicts Fact B. Fact B is of a different class than A."
  *   **Failure Condition:** The revision only explains Anomaly A and makes no other testable claims, or the only other claims are tautological.
  *   **Verdict:** If **Failure Condition** is met for >50% of revisions, the shift is **Degenerating**.

  #### Phase 3: The Verification Check (Progressive vs. Potentially Progressive)
  **Question 3:** Of the novel facts predicted via excess content (from Phase 2), how many have been empirically confirmed?
  *   **Sufficient Answer:**
      *   **Progressive:** At least one confirmed novel fact per cycle.
      *   **Potentially Progressive:** No confirmed facts *yet*, but specific predictions are published with error bars and testable on *existing or commissioned* apparatus within the funding cycle.
      *   **Degenerating:** No confirmed facts, and predictions rely on apparatus that does not exist or is undefined.
  *   **Verdict:**
      *   If **Progressive**: Recommend **Renewal**.
      *   If **Potentially Progressive**: Proceed to Phase 4.
      *   If **Degenerating**: Recommend **Refusal**, unless Phase 4 applies.

  #### Phase 4: The Revival Clause (Probationary Renewal)
  **Condition:** A programme rated **Degenerating** or **Potentially Progressive** may request one (1) Probationary Cycle.
  **Requirements:**
  1.  The group must identify a single, high-risk "Crucial Experiment" to be conducted within the 5-year window.
  2.  The apparatus must be available or under commission (no "future technology" excuses).
  3.  The group accepts that failure to confirm the prediction results in permanent termination of funding.
  **Limit:** A programme may only enter Probation **once**.
  **Verdict:** If requirements met, grant **Probationary Renewal**. If not, **Refusal**.

  #### Phase 5: Institutional Audit (Separate Track)
  **Question 4:** What is the group's institutional footprint (students placed, journal editorships, monopoly on expertise)?
  *   **Note:** This score *cannot* upgrade an Epistemic verdict from **Refusal** to **Renewal**.
  *   **Function:** This score is used *only* if two groups are tied on Epistemic Merit, OR if a **Probationary** group is the sole custodian of a subfield (Strategic Reserve).
  *   **Constraint:** If a group uses institutional dominance to shield itself from Phase 1 or 2 checks (e.g., refusing to share data, controlling peer review to block anomalies), the Institutional Score is negated.

  ---

  ### Handling the Three Difficulties

  1.  **Hard-Core Laundering:** Addressed in **Phase 1**. By requiring the Hard Core statement to match the previous cycle's submission, we create a paper trail. Moving a goalpost *after* the ball hits it is flagged as Evasive. This prevents groups from declaring refuted claims "axiomatic" to save them.
  2.  **Epistemic vs. Institutional Progress:** Addressed in **Phase 5**. Institutional success (jobs, editorships) is explicitly decoupled from scientific merit. It counts *only* as a Strategic Reserve tie-breaker for Probationary groups that hold a monopoly. It cannot justify funding a Degenerating programme if a Progressive alternative exists.
  3.  **Retrospective vs. Prospective:** Addressed in **Phase 4 (Revival Clause)**. We acknowledge we cannot know the future. We allow one "Hail Mary" cycle for a degenerating programme *if* they commit to a risky, testable prediction within the funding window. This converts a retrospective verdict into a prospective contract.

  ---

  ### Application to Cases

  #### Group X (11 Years Old)
  *   **Phase 1 (Laundering):** They revised "auxiliary parameters," not the core. **Pass.**
  *   **Phase 2 (Ad Hoc):** They revised parameters to fit failed effects. Did these revisions yield excess content? The prompt says: "No revision has yet yielded a confirmed novel fact." It implies the revisions were solely to accommodate the failure. **Fail (Degenerating).**
  *   **Phase 3 (Verification):** Predictions require "costlier apparatus that does not yet exist." This violates the "existing or commissioned" requirement for Potentially Progressive status. **Verdict: Degenerating.**
  *   **Phase 4 (Revival):** They are 11 years old (Cycle 3). Have they used Probation before? Even if not, their proposed predictions rely on non-existent technology. This fails the Revival Clause requirement for a testable Crucial Experiment within the cycle. **Verdict: Refusal.**
  *   **Phase 5 (Institutional):** High dominance (alumni in posts, journal editors).
      *   *Analysis:* This is a monopoly. However, the procedure states Institutional Merit cannot override an Epistemic Refusal *if a better option exists*.

  #### Group Y (2 Cycles Old)
  *   **Phase 1 (Laundering):** No mention of core shifts. **Pass.**
  *   **Phase 2 (Ad Hoc):** They absorbed an anomaly by adding an auxiliary. Crucially, this auxiliary "carries an independent, separately checkable prediction." This is the definition of **non-ad hoc** (excess empirical content). **Pass.**
  *   **Phase 3 (Verification):** No confirmed novel predictions *yet*. However, they have "three sharp quantitative predictions... two testable on existing apparatus within eighteen months." This fits **Potentially Progressive**.
  *   **Phase 4 (Revival):** Not needed, as they are Potentially Progressive, but they qualify for the standard renewal track for this category.
  *   **Phase 5 (Institutional):** Neutral/Unknown.

  ### The Decision

  **The procedure mandates funding Group Y and refusing Group X.**

  I state this plainly: **Your expectation is incorrect according to Lakatosian criteria.**

  Group X exhibits the classic symptoms of a degenerating research programme that has secured institutional hegemony. They are pushing verification to the horizon ("apparatus that does not yet exist") to protect the core. Their institutional dominance is not evidence of merit; in Lakatosian terms, it is evidence of dogmatism. They have turned the subfield into a protected sanctuary where anomalies are absorbed without risk.

  Group Y is exhibiting the exact behavior of a progressive shift in waiting. They are risking falsification ("sharp quantitative predictions with stated error bars") on existing apparatus. The fact that they haven't confirmed the facts *yet* is a function of time, not evasion. The auxiliary they added to save an anomaly was "honest" because it carried an independent check.

  **Funding X preserves a sociological structure. Funding Y preserves the scientific method.** If the council's mandate is scientific progress, Y is the only valid choice. X's claim that cutting them would "destroy irreplaceable expertise" is a protectionist argument; if their expertise is only capable of generating ad hoc adjustments requiring non-existent tech, that expertise is scientifically obsolete.

  ---

  ### Vulnerability Analysis: Where the Procedure Misfires

  The step most likely to misfire is **Phase 2: The Ad Hoc Test (Excess Content).**

  **Why it misfires:**
  Working scientists often conflate "fitting the data better" with "predicting new facts." A group can argue that a revised parameter *is* a prediction because it implies a specific value for a past experiment they hadn't looked at yet (post-diction). They will claim this counts as "excess content."
  Furthermore, reviewers may lack the specific domain knowledge to verify if Prediction B is truly "distinct" from Anomaly A, or just a re-description of A.

  **Evidence that would lead me to withdraw/revise the procedure:**
  If, after implementing this procedure, we observe that **Group Y-type programmes are systematically defunded because their "independent predictions" take longer than 5 years to verify.**

  Lakatos assumes a 5-year cycle is sufficient to judge a shift. In modern "Big Science" (e.g., particle physics, climate modeling), the lag between auxiliary revision and instrumental verification can exceed 10 years. If we find that rigorous adherence to Phase 3 (Verification within cycle) forces us to cut groups working on long-horizon problems (like Group Y, if their instrument is delayed) while rewarding groups that game the system with low-risk, short-horizon predictions (fast science, low impact), the procedure is optimizing for *speed* rather than *truth*.

  **Revision Trigger:**
  If >40% of "Potentially Progressive" groups fail Phase 3 solely due to instrumental delays beyond their control, I would revise **Phase 3** to allow "Intermediate Theoretical Consistency" as a proxy for verification. This would allow a group to pass if they show their auxiliary revision unifies *other* existing theories, even if empirical confirmation is pending. This moves the criterion from strict Empiricism to a Coherentist hybrid, acknowledging that in high-cost science, the "experiment" is sometimes a simulation or a theoretical unification first, and a physical measurement second.

  Until that evidence appears, however, the procedure stands: **Risk is the price of renewal.** Group X has stopped paying it. Group Y is writing the check. Fund Y.
