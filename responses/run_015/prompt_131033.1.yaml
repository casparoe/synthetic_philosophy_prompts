  Sympathy is the only grace we keep.
  The heavens offer no answering light.
  No eye watches the long slow turning.

  In mortal chests the holy secrets sleep.
  We tend the fires against the coming night.
  Sympathy is the only grace we keep.

  What vows can broken vessels truly keep?
  No verdict comes from any height.
  No eye watches the long slow turning.

  Where scattered souls their vigil lonely keep.
  To bind the weak to weak in fragile rite.
  Sympathy is the only grace we keep.

  No shepherd guards the flock while others sleep.
  Where knowledge breaks like waves on human sight.
  No eye watches the long slow turning.

  So let the choir of the fallen weep.
  And walk unguided through the dimming light.
  Sympathy is the only grace we keep.
  No eye watches the long slow turning.
