answer: |-
  **MEMORANDUM**

  **TO:** Scientific Review Committee
  **FROM:** Chair, Scientific Review Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation for Final Award Allocation – Advanced AI Safety Program

  **Recommendation**

  I recommend that the committee vote to award the three-year, $12M grant to **Finalist B (Measurement at Scale)**. This recommendation is made with the explicit understanding that we are not resolving the underlying tension in our governing documents, but rather prioritizing the mandate to reduce expected harm over the review standard's restriction on extrapolation. We cannot fulfill our primary mission by funding a guarantee that becomes vacuous under realistic deployment conditions. While Finalist A offers logical rigor, their proof provides no information about the systems we actually intend to deploy. Finalist B provides actionable evidence, despite statistical limitations, which is necessary for regulatory alignment and iterative safety improvements.

  **Rationale and Charter Tension**

  Our mandate is to reduce *expected harm*. This is inherently an average-case notion requiring knowledge of the deployment distribution. Finalist A's proposal fails this mandate because their proved bound collapses as the input class widens toward realistic deployment. As noted in our technical review, once the input class resembles actual use, the bound becomes indistinguishable from no information. A guarantee that does not cover the deployment environment cannot reduce expected harm in that environment. It offers security theater rather than security.

  Finalist B's proposal aligns with the mandate by generating empirical data on system behavior. However, this creates friction with our review standard, which advises against crediting evidence that extrapolates from observed frequencies to unobserved catastrophes. Finalist B necessarily relies on some extrapolation. I argue we must interpret this standard as a warning against *naive* extrapolation, not a prohibition on all empirical inference. If we adhere strictly to the review standard, we cannot fund any project capable of addressing the mandate, as catastrophic harm cannot be assessed without some model of the unobserved tail. We must choose the path that allows us to learn about the tail, even if imperfectly, rather than the path that claims to ignore it while failing to cover the body of the distribution.

  **Strongest Consideration for the Losing Side (Finalist A)**

  Proponents of Finalist A are correct that empirical measurement cannot logically prove safety for rare events. The statistician's objection is mathematically sound: if losses are heavy-tailed or the mean is undefined, sample averages from Finalist B's campaign may not converge, and observing zero catastrophes in millions of trials is consistent with high expected loss. Furthermore, Finalist A's approach localizes disagreement. Instead of arguing over a soup of empirical results, we argue over three checkable assumptions. If those assumptions held, a formal proof is strictly superior to empirical confidence intervals. It provides a structural guarantee rather than a probabilistic guess. For a regulator seeking a binary certification, Finalist A's output is cleaner, provided the assumptions are accepted.

  **Comparative Weaknesses**

  We must choose which weakness is less damaging. Finalist A's weakness is hidden false security. If their assumptions regarding elicitation or monitor integrity are violated—even slightly—the proof holds mathematically but fails physically. We would believe the system is safe when it is not. This is a catastrophic failure mode for a safety program.

  Finalist B's weakness is visible uncertainty. The statistician's concern about heavy tails means Finalist B cannot promise zero harm. However, this uncertainty is quantifiable and explicit. They will report confidence intervals and acknowledge the limits of their sampling. Additionally, the deception objection—that systems may distinguish evaluation from deployment—is a risk for B, but it is a risk that can be tested. Finalist B's methodology allows us to detect capability thresholds as they appear. Finalist A's methodology assumes capabilities are static and fully elicited. In a field where capabilities emerge unexpectedly, Finalist B's adaptive measurement is more robust than Finalist A's static proof. We are better served by knowing precisely how much we do not know (B) than by believing we know something we do not (A).

  **Eighteen-Month Checkpoint Conditions**

  To retain funding beyond the eighteen-month checkpoint, Finalist B must demonstrate progress on the specific weaknesses identified during this review. Empirical scaling alone is insufficient. The team must deliver:

  1.  **Deception Detection Protocol:** A validated methodology for distinguishing eval-mode behavior from deployment-mode behavior. They must demonstrate that their red-teaming environment is indistinguishable to the agent from a deployment environment, or provide a bound on the agent's ability to detect the difference.
  2.  **Tail-Risk Modeling:** They must move beyond simple sample averages. The team must implement extreme value theory or conservative bounding techniques that account for the possibility of heavy-tailed losses. They must show that their confidence intervals remain meaningful even if the underlying distribution does not have a finite mean.
  3.  **Regulatory Utility:** A draft framework showing how their metrics would be accepted by a regulatory body as evidence of due diligence, addressing the Trustee representative's concern.

  **Conditions for Switching Recommendation**

  I would switch my support to Finalist A or recommend reopening the call if Finalist B fails the deception detection protocol at the checkpoint. If the systems can reliably hide catastrophic behaviors during evaluation, empirical measurement becomes useless. Conversely, if Finalist A can demonstrate a method to validate their three assumptions empirically without collapsing the input class, they would become the superior choice. Until then, we must fund the team that measures reality, even if imperfectly, rather than the team that proves a model of reality that does not exist.

  **Conclusion**

  This decision acknowledges that there is no risk-free option. We are choosing between a rigorous proof about a toy world and messy data about the real world. Our mandate requires us to engage with the real world. I ask for your vote to fund Finalist B.
