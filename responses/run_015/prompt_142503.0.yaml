prompt: |-
  i keep running into explanations of the form 'X is a costly signal of Y' — the peacock's tail, big-game hunting and meat sharing, fasts and other painful religious requirements, a degree as a filter foremployers, buying a watch you can't read the time off at a glance. sometimes I buy it, sometimes it reads like a just-so story with a bit of algebra stapled on, and I can't tell which from the paper. I don't want to read the primary literature on every case; I want a filter.

  so write me the spec. what does a costly-signalling explanation of an actual behavior have to establish before it deserves to be believed, with the case or consideration that makes each item a requirement rather than a taste? I mean the version of the claim where someone says they've explained a real trait in the world, not the version where they've shown that some equilibrium exists in a model.

  things I think belong on the list, argue with the framing:

  - that the trait has the job of changing what a reciever does, as opposed to being a cue others have learned to exploit. (I want the case that shows why this is hard, not the definition.)
  - the 'why doesn't a worse individual just do the same thing' question. my hypothesis is that the only real answer is about marginal cost differing across qualities, and that papers which just establish 'it is expensive' and stop have shown nothing. tell me if total cost ever does the work on its own, and if so in what kind of case.
  - that the audience is named, that it responds, and that responding pays it — plus what to do when there are audiences with opposed interests reading the same display.
  - waste: does the cost have to be genuinely wasteful, or only differential? is that a requirement or a Zahavi-vs-everyone-else preference?
  - that it says what would distinguish it from the explanations that predict the same trait without any signalling at all (runaway, sensory bias, direct benefit, plain mechanical constraint). this is the one I care about most — I want the list to block the failure mode where everything turns out to be a signal.
  - the origin/maintenance split: is 'how it got started' a separate requirement from 'what keeps it stable', or can one answer cover both?

  and here's the case I most want the spec to handle, because I don't think the standard list fits it: the synthetic handicap. costs that are imposed from outside and that track stake or resources rather than the quality being advertised — proof-of-work, buy-in fees, an initiation ordeal that anyone can survive if they are rich enough — and, the one I actually care about, long-form writing and video now that fluent text can be generated for approximately nothing. my guess is that these violate the 'cost tracks quality' requirement while still doing real signalling work, so either that requirement is non-negotiable and proof-of-work isn't signalling, or it needs to split into two requirements. if you split it, tell me what the weaker one has to say and what would still fail it.

  mark each requirement non-negotiable or negotiable, and flag any pair you suspect can't be jointly satisfied — my candidate is the honesty condition against the existence condition, since making the signal costly enough to deter mimics may make it too costly for the real thing to be worth emitting, but there may be a better pair. no citations, I can't check them and I don't want them. a short table at the end scoring the handful of standard explanatory templates — handicap-style, index/mechanical, runaway — against the list is fine, but the list is the deliverable.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **Goal:** Create a "spec" (checklist/criteria) for evaluating "costly signaling" explanations of real-world behaviors.
      *   **Problem:** The user is tired of "just-so stories with algebra stapled on." They want to distinguish robust explanations from weak ones without reading primary literature for every case.
      *   **Specific Inputs:** The user provides a list of potential requirements (receiver response, marginal vs. total cost, audience identification, waste vs. differential cost, alternative explanations, origin vs. maintenance).
      *   **Specific Edge Case:** "Synthetic Handicaps" (Proof-of-Work, buy-in fees, initiation ordeals based on wealth, long-form writing in the age of AI). The user suspects these violate the "cost tracks quality" requirement but still function as signals.
      *   **Constraints:** Mark requirements as Non-Negotiable (NN) or Negotiable (N). Flag potential conflicts (e.g., Honesty vs. Existence). No citations. Include a summary table at the end.
      *   **Tone:** Analytical, rigorous, slightly skeptical (matching the user's vibe), direct.

  2.  **Deconstruct the Core Concept (Costly Signaling Theory - CST):**
      *   CST isn't just "it's expensive." It's "it's expensive *in a specific way* that preserves information."
      *   Key mechanism: Differential marginal cost. High-quality individuals pay *less* (relatively) for the signal than low-quality individuals.
      *   Key outcome: Separating equilibrium (honest signaling).
      *   Key function: Influencing receiver behavior to the benefit of the sender (and often the receiver).

  3.  **Evaluate User's Proposed Requirements:**

      *   *Trait changes receiver behavior vs. cue:* Crucial. Signals are evolved/selected *for* communication. Cues are exploited.
      *   *Marginal vs. Total Cost:* Crucial. Total cost alone allows pooling (everyone does it or no one does it). Marginal cost difference creates separation.
      *   *Audience named/pays:* Crucial. No receiver, no signal.
      *   *Waste:* Negotiable/Debated. Zahavi emphasized waste, but modern CST focuses on *costliness relative to benefit*. It doesn't need to be socially wasteful, just individually costly.
      *   *Alternative explanations:* Non-negotiable. If a simpler model explains it, CST is overfitting.
      *   *Origin vs. Maintenance:* Distinct. A trait can be maintained by signaling even if it originated differently (exaptation).

  4.  **Address the "Synthetic Handicap" Edge Case:**
      *   *The Problem:* Proof-of-Work (PoW) or initiation fees cost money/time, but not necessarily "quality" (in the biological sense). A rich low-quality person can pay.
      *   *The Resolution:* In human cultural contexts, "quality" often *is* "resources" or "commitment."
      *   *Refinement:* The requirement shouldn't be "cost tracks intrinsic biological quality." It should be "cost tracks the *attribute the receiver cares about*."
      *   *AI/Writing:* If AI makes text cheap, text loses signaling value *unless* the cost shifts to something AI can't do (e.g., verifiable personal experience, real-time interaction, reputation risk).
      *   *Split:* Distinguish between *Biological Quality Signaling* (marginal cost based on physiology/ability) and *Commitment/Resource Signaling* (total cost based on wealth/willingness to burn). The latter is still signaling, but the "quality" is "having resources to burn."

  5.  **Drafting the Spec (Iterative Process):**

      *   *Item 1: The Receiver's Payoff.* (User's "audience is named"). Needs to be NN. If the receiver doesn't gain info or benefit, the signal collapses.
      *   *Item 2: The Separation Condition.* (User's "marginal cost"). This is the heart of CST. NN. Total cost is insufficient.
      *   *Item 3: The Counterfactual.* (User's "alternative explanations"). NN. Must rule out direct benefits or constraints.
      *   *Item 4: Stability vs. Origin.* (User's "origin/maintenance"). Negotiable. Maintenance is the must; origin is bonus context.
      *   *Item 5: The "Waste" Question.* Negotiable. Cost is required; social waste is not.
      *   *Item 6: The Synthetic Handicap (Resource vs. Quality).* This needs a specific clause. Let's call it "The Currency Match." The cost must deplete the specific resource that correlates with the trait being signaled.

  6.  **Addressing the Conflict (Honesty vs. Existence):**
      *   User suspects Honesty (costly enough to deter fakers) vs. Existence (cheap enough for truth-tellers).
      *   *Resolution:* This is the "Single Crossing Property." It's not a conflict; it's the mathematical condition that *must* be met. If it can't be met, the theory fails. So, flag it as a "Critical Failure Point" rather than a trade-off.

  7.  **Refining the "Synthetic Handicap" Section:**
      *   PoW signals "commitment to the chain," not "coding skill."
      *   Initiation fees signal "wealth" or "desperation to join," not "warrior ability."
      *   Long-form writing now signals "human verification" or "reputation risk," not "ability to type."
      *   *Spec Adjustment:* The spec must demand identification of *what* is being signaled. If the cost is monetary, the signal is wealth/commitment. If the cost is physiological, the signal is health/ability.

  8.  **Finalizing the List & Table:**
      *   Review against constraints: No citations. Mark NN/N. Flag conflicts. Table at end.
      *   Ensure tone is sharp. "Algebra stapled on" needs to be addressed by demanding empirical leverage.

  9.  **Self-Correction/Polishing during drafting:**
      *   *Correction:* Initially, I might say "Marginal Cost is NN." But for *financial* signaling (buying a watch), it's about *budget constraint*, which acts like marginal cost (pain of payment differs by wealth). I need to generalize "Marginal Cost" to "Differential Cost Burden."
      *   *Correction:* On the "Receiver" point. It's not just that they respond, but that their response is *conditional* on the signal.
      *   *Refining the AI point:* The spec needs to handle the "cost collapse" scenario. If a technology lowers the cost for *everyone* equally, signaling value drops. If it lowers it more for low-quality senders, signaling value collapses.

  10. **Final Structure:**
      *   Intro: Acknowledge the "just-so" problem.
      *   The Spec (6 items).
      *   The Synthetic Handicap Clause (Addressing the specific edge case).
      *   The Conflict Flag (Honesty vs. Existence).
      *   The Table.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here is the spec. It is designed to separate mechanisms that *rely* on cost to transmit information from mechanisms that merely *have* cost.

  ### The Costly Signaling Spec (v1.0)

  To accept a costly-signaling explanation for a trait $T$ in population $P$, the claim must satisfy the following six requirements.

  #### 1. The Conditional Response Requirement
  **Status:** Non-Negotiable
  **The Claim:** The receiver's behavior must change *conditionally* on the signal, and that change must benefit the receiver (or the receiver's genes/interests).
  **The Filter:** Many papers show senders benefit from signaling. That is insufficient. You must identify the receiver's payoff function. If the receiver would take the same action without the signal (e.g., they can assess quality directly via a cue), the signal is superfluous. If the receiver responds but gains no information or fitness benefit (e.g., they are manipulated into a net loss), the system is unstable or parasitic, not a signaling equilibrium.
  **Why it blocks just-so stories:** It prevents labeling any expensive behavior as signaling. If the "audience" is abstract (e.g., "society") or their response is not specified, the mechanism has no engine.

  #### 2. The Differential Burden Requirement (Single Crossing)
  **Status:** Non-Negotiable
  **The Claim:** The cost of producing $T$ must be lower *at the margin* for high-quality senders than for low-quality senders, relative to the benefit gained.
  **The Filter:** "It is expensive" is not an explanation; it is a description. The explanation requires that the expense hurts a low-quality mimic *more* than it hurts a high-quality truth-teller.
  **Total Cost vs. Marginal Cost:** Total cost alone almost never does the work. If a signal costs 100 units for everyone, and the benefit is 150 units, everyone signals (pooling). If the benefit is 50 units, no one signals. Separation only occurs if the cost is 80 for high-quality and 120 for low-quality.
  **Why it blocks just-so stories:** This is the mathematical heart of the theory. If a paper establishes high cost but does not establish *differential* cost (or a differential budget constraint), it has not demonstrated a signaling mechanism.

  #### 3. The Alternative Exclusion Requirement
  **Status:** Non-Negotiable
  **The Claim:** The explanation must demonstrate why non-signaling models (direct benefit, mechanical constraint, sensory bias, runaway selection) fail to predict the observed trait.
  **The Filter:** The author must explicitly model or argue against the "null hypothesis" of direct utility. For example, if a peacock's tail helps him fly away from predators (direct benefit), signaling is not needed to explain the tail. If a degree teaches skills (human capital), it is not purely a filter (signaling).
  **Why it blocks just-so stories:** This prevents "signal inflation," where every expensive trait is retrofitted into CST. If a simpler mechanical or direct-benefit explanation fits the data, CST is overfitting.

  #### 4. The Currency Match Requirement
  **Status:** Non-Negotiable
  **The Claim:** The resource expended to create the signal must be the same resource that limits the low-quality sender.
  **The Filter:** This addresses your "Synthetic Handicap" concern.
  *   **Biological Case:** Energy/Health is the currency. Sick birds cannot grow bright feathers.
  *   **Synthetic Case:** Money/Time is the currency. Poor initiates cannot pay the fee.
  *   **AI/Writing Case:** If the cost is "time spent typing," AI collapses the signal. If the cost is "reputation risk" or "verifiable personal experience," the signal holds.
  **Why it blocks just-so stories:** It forces the explainer to define what "Quality" means in this context. If the signal burns money, it signals wealth or commitment, not necessarily wisdom or strength. If the paper claims it signals strength but the cost is purely monetary, the Currency Match fails.

  #### 5. The Stability vs. Origin Distinction
  **Status:** Negotiable (Maintenance is NN, Origin is N)
  **The Claim:** The explanation must account for why the trait is *maintained* now. It does not need to explain how it *originated*.
  **The Filter:** A trait can originate via drift or runaway selection and later be co-opted as a signal (exaptation). Demanding an origin story often leads to speculative history. Demanding a maintenance story ensures the current equilibrium is viable.
  **Why it blocks just-so stories:** It allows you to accept signaling as a current stabilizing force without buying into a speculative evolutionary history that cannot be tested.

  #### 6. The Waste Clarification
  **Status:** Negotiable
  **The Claim:** The cost must be real to the sender, but it does not need to be socially wasteful.
  **The Filter:** Zahavi emphasized waste to prove honesty. Modern theory requires cost to prevent mimicry. If the cost is a transfer (e.g., a fee paid to the receiver), it can still signal, provided the transfer is affordable only to high-quality types.
  **Why it blocks just-so stories:** It prevents the rejection of valid signaling models (like bonding fees) simply because the energy isn't "burned" into the atmosphere.

  ---

  ### The Synthetic Handicap Clause (Addressing your Edge Case)

  You asked about costs imposed from outside (PoW, initiation fees, AI-era writing) where cost tracks resources rather than intrinsic quality.

  **The Spec Adjustment:**
  This does not violate Requirement 2 (Differential Burden), provided you redefine "Quality."
  *   In biological CST, Quality = Health/Genes.
  *   In Cultural/Economic CST, Quality = Resources/Commitment/Alignment.

  **The Split:**
  If the cost is external (money, compute power), the signal is **not** advertising intrinsic ability (e.g., "I am smart"). It is advertising **stakes** (e.g., "I have skin in the game").
  *   **Failure Mode:** Claiming a buy-in fee signals "competence." (Fails Currency Match).
  *   **Success Mode:** Claiming a buy-in fee signals "commitment to the group" or "liquidity." (Passes Currency Match).

  **Regarding AI/Long-form Writing:**
  If fluent text is cheap, text volume ceases to signal "literacy" or "intelligence." To remain a signal, the cost must shift to a resource AI cannot cheaply replicate.
  *   **Valid Signal:** "I wrote this under my real name and accept liability for errors." (Cost = Reputation Risk).
  *   **Invalid Signal:** "I wrote 5,000 words." (Cost = Compute/Time, now collapsed).
  *   **Requirement:** The explanation must identify the *new* bottleneck. If it cannot, the signaling explanation is obsolete.

  ---

  ### The Conflict Flag: Honesty vs. Existence

  **Your Candidate:** *Honesty Condition* (costly enough to deter mimics) vs. *Existence Condition* (cheap enough for truth-tellers).

  **Verdict:** This is not a conflict; it is the **Single Crossing Property** (Requirement 2).
  *   If the cost is too high for everyone, the signal disappears (No Existence).
  *   If the cost is too low for everyone, the signal becomes noise (No Honesty).
  *   **The Failure Point:** A model fails if there is no overlap where High-Quality sends and Low-Quality does not.
  *   **Flag:** If a paper argues the cost is "very high" to prove honesty, check if they have simultaneously proven it is "affordable" for the sender. If the cost is 90% of fitness for the sender, the trait should be selected against. Many papers ignore this and assume the benefit is infinite. **Demand the benefit function.**

  ---

  ### Scoring Standard Explanatory Templates

  | Template | Conditional Response | Differential Burden | Alternative Exclusion | Currency Match | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Handicap (Zahavi)** | **Yes.** Receiver gains info on health. | **Yes.** Core mechanism. | **Often No.** Often ignores direct benefits (e.g., tail aids flight). | **Yes.** Health/Energy. | **High Risk.** Often fails Alt. Exclusion. |
  | **Index / Mechanical** | **Yes.** Receiver gains info. | **N/A.** Cost is physical impossibility for mimic. | **Yes.** Hard to fake mechanically. | **Yes.** Physical constraint. | **Robust.** Not signaling, but often confused with it. |
  | **Runaway (Fisherian)** | **Yes.** Receiver has sensory bias. | **No.** Cost is irrelevant to separation; preference drives it. | **No.** Assumes preference exists without benefit. | **No.** Arbitrary trait. | **Distinct.** Explains origin, not maintenance of info. |
  | **Synthetic (PoW/Fees)** | **Yes.** Receiver gains info on commitment. | **Yes.** Budget constraints differ. | **Yes.** Hard to fake without resources. | **Conditional.** Only signals wealth/commitment, not skill. | **Valid.** But "Quality" must be redefined. |
  | **Human Capital (Degree)** | **Yes.** Employer gains productive worker. | **No.** Cost is tuition/time, same for all. | **Often No.** Confuses signaling with skill acquisition. | **Mixed.** Signals diligence + skill. | **Hybrid.** Rarely pure signaling. |

  ### Summary Instruction for Use

  When you encounter a paper claiming "X is a costly signal of Y":

  1.  **Check the Receiver:** Do they name the receiver and the receiver's payoff? If no, reject.
  2.  **Check the Math:** Do they show the cost is *differentially* burdensome, or just *high*? If just high, reject.
  3.  **Check the Currency:** Does the cost burn the resource that the low-quality sender lacks? If the signal costs money but claims to signal wisdom, reject.
  4.  **Check the Null:** Do they explain why a direct-benefit model doesn't work better? If no, treat as speculative.

  If a paper passes these four, it is likely a robust signaling explanation. If it fails any, it is likely a just-so story with algebra stapled on.
