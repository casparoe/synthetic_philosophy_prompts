      *   **Move 1 (Vance):** Mira is dead (whole-brain/organism view). Brain is integrator. Fetus is passenger.
          *   *Critique:* Standard UDDA line. Strong on standard criteria. Weak on the "integrator" claim given the somatic support evidence (healing, pregnancy). The "passenger" claim is biologically contentious (hormonal interaction).
          *   *Rating:* Plausible but vulnerable to Move 2.

      *   **Move 2 (Okoro):** Points out somatic integration (healing, pregnancy). Claims neurological criteria rely on higher-brain (personhood) view secretly. Mira's body is a counterexample to organismic death.
          *   *Critique:* Strong point on somatic integration. The leap to "higher-brain" is insightful but maybe too quick (could be just biological integration without consciousness). The "counterexample" charge is strong.
          *   *Rating:* Strong argumentative move.

      *   **Move 3 (Vance):** Homeostasis via machine isn't self-integration. Ventilated bodies aren't alive. Higher-brain leads to unacceptable results (unconscious breathing patients = dead).
          *   *Critique:* "Machine vs. Self" is a key distinction. The slippery slope against higher-brain is valid (public policy concern). But "nobody thinks a ventilated body is alive" is empirically false (families often do).
          *   *Rating:* Mixed. Strong on policy, weak on biological nuance.

      *   **Move 4 (Okoro):** Technology-relativity problem (death depends on machines). Unpalatability isn't an argument. Claims death is a decision based on utility.
          *   *Critique:* The technology-relativity point is philosophically sharp. The move to "decision/utility" is the pivot to conventionalism.
          *   *Rating:* Strong philosophical critique.

      *   **Move 5 (Vance):** Elias (DCD) case. Irreversible = won't reverse spontaneously + we won't reverse. Autoresuscitation is a prediction failure, not a convention issue.
          *   *Critique:* Distinguishes "irreversible" vs "permanent". Standard DCD defense. Treats death as discovery (prediction error).
          *   *Rating:* Clinically standard, philosophically defensive.

      *   **Move 6 (Okoro):** Prediction and decision entangled. Waiting period tracks organ viability (retrieval interests). DDR is not the deep moral constraint; consent/no wrong matters more.
          *   *Critique:* Hits the "criterion vs. test" and "discovery vs. decision" distinction hard. Challenges the DDR's moral weight vs. regulatory function.
          *   *Rating:* Philosophically potent, controversial.

      *   **Move 7 (Vance):** Public trust argument. DDR must be upheld as public standard even if rationale is messy. Mira is dead under ordinary criteria, so keep scene as is.
          *   *Critique:* Pragmatic/Political move. Avoids the ontological question. "Ordinary criteria" begs the question against Okoro's challenge.
          *   *Rating:* Pragmatically right, philosophically evasive.

  4.  **Drafting the Ratings:**
