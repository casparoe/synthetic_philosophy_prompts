      *   *Tone Check:* Am I being too agreeable? I need to be critical. Am I using outside sources? No, just concepts.

  8.  **Drafting Content (Iterative refinement):**

      *   *Prelim:* Start with the distinctions. Organism vs. Personhood (Moves 1, 2, 3). Discovery vs. Decision (Moves 4, 5, 6). Criterion vs. Test (Move 5). DDR function (Moves 6, 7).
      *   *Move 1:* Vance asserts the standard "whole-brain" formulation. It succeeds as a statement of current law but fails against Okoro's biological counter-evidence (healing). It conflates the *criterion* (loss of integration) with the *test* (absence of brain function).
      *   *Move 2:* Okoro correctly identifies the tension between somatic integration and neurological declaration. He succeeds in exposing the "higher-brain" subtext but overreaches by claiming the body is a counterexample to *organismic* death rather than just showing the criterion is fuzzy.
