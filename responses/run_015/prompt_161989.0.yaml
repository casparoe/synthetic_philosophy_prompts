answer: |-
  ### The Scenario: The Community Physiotherapy Clinic

  A local clinic has a fixed budget for **10 hours** of specialist physiotherapy this month. There are two patients on the waiting list: **Alice** and **Bob**. The clinic administrator must decide how to allocate the hours between them. There are only two feasible plans that use the full budget:

  *   **Plan 1:** Alice receives 7 hours; Bob receives 3 hours.
  *   **Plan 2:** Alice receives 3 hours; Bob receives 7 hours.

  Clinical trials have established a "Mobility Scale" (0 to 100) that measures functional movement. While pain and baseline disability are subjective and cannot be precisely compared between people, the *improvement* per hour of therapy is measurable and comparable. The administrator knows exactly how many Mobility Points each patient will **gain** from their allocated hours.

  **The Measurement Constraint:** The clinic records only the *gain* in Mobility Points. It does not record a comparable absolute baseline score because Patient A's "50" might represent a different level of suffering than Patient B's "50." We know the gains, but the starting points are ambiguous.

  **The Choosers:** Two impartial evaluators stand behind a veil of ignorance. They know the plans and the gain data. They know they will turn out to be either Alice or Bob with equal probability (50%). They do not know their current baseline mobility.
  *   **Chooser 1 (Average):** Picks the plan that maximizes her expected final Mobility Score.
  *   **Chooser 2 (Maximin):** Picks the plan that maximizes the final Mobility Score of the person who ends up worst off.

  ### Table of Gains

  | Plan | Alice's Gain | Bob's Gain | Total Gain |
  | :--- | :---: | :---: | :---: |
  | **Plan 1** | 10 points | 4 points | **14 points** |
  | **Plan 2** | 2 points | 8 points | **10 points** |

  *(Note: These gains are derived from the hours allocated. Plan 1 favors Alice's physiology; Plan 2 favors Bob's.)*

  ### Two Admissible Hypotheses

  Since the story only measures *change*, both of the following baseline scenarios are consistent with the clinical data.

  *   **Hypothesis A (Alice is worse off initially):** Alice is currently bedridden; Bob has moderate difficulty.
      *   Alice's Baseline: **0**
      *   Bob's Baseline: **20**
  *   **Hypothesis B (Bob is worse off initially):** Alice has moderate difficulty; Bob is currently bedridden.
      *   Alice's Baseline: **20**
      *   Bob's Baseline: **0**

  ### Calculations

  **1. The Average Chooser**
  This chooser calculates the average final score across the two people (which equals the expected value for herself behind the veil).
  *   *Formula:* (Alice's Baseline + Bob's Baseline + Total Gain) ÷ 2.
  *   *Observation:* The sum of the baselines is constant (0 + 20 = 20) in both hypotheses. The ranking depends *only* on the Total Gain.

  *   **Under Hypothesis A:**
      *   Plan 1 Average: (0 + 10 + 20 + 4) ÷ 2 = **17**
      *   Plan 2 Average: (0 + 2 + 20 + 8) ÷ 2 = **15**
      *   **Verdict:** Plan 1.
  *   **Under Hypothesis B:**
      *   Plan 1 Average: (20 + 10 + 0 + 4) ÷ 2 = **17**
      *   Plan 2 Average: (20 + 2 + 0 + 8) ÷ 2 = **15**
      *   **Verdict:** Plan 1.

  *Why this is not luck:* Adding a constant number (the baseline) to every outcome shifts the average up or down, but it does not change which average is higher. Plan 1 produces 4 more points of total gain than Plan 2. No rearrangement of starting points can erase a difference in total production.

  **2. The Maximin Chooser**
  This chooser looks at the final scores of both people and selects the plan where the lower score is highest.

  *   **Under Hypothesis A (Alice is worst off):**
      *   Plan 1 Finals: Alice = 0 + 10 = **10**; Bob = 20 + 4 = 24. (Worst-off: 10)
      *   Plan 2 Finals: Alice = 0 + 2 = **2**; Bob = 20 + 8 = 28. (Worst-off: 2)
      *   **Verdict:** Plan 1 (10 is better than 2).
  *   **Under Hypothesis B (Bob is worst off):**
      *   Plan 1 Finals: Alice = 20 + 10 = 30; Bob = 0 + 4 = **4**. (Worst-off: 4)
      *   Plan 2 Finals: Alice = 20 + 2 = 22; Bob = 0 + 8 = **8**. (Worst-off: 8)
      *   **Verdict:** Plan 2 (8 is better than 4).

  *Result:* The Average Chooser agrees regardless of the baseline. The Maximin Chooser reverses her decision depending on who started lower.

  ***

  ### Three Short Notes

  **1. Which single feature is doing the work?**
  The **identity of the worst-off person**. In Hypothesis A, Alice is the bottleneck; Plan 1 helps her more (10 vs 2). In Hypothesis B, Bob is the bottleneck; Plan 2 helps him more (8 vs 4). The Average rule ignores *who* gets the points, counting only the sum. The Maximin rule cares intensely *who* gets the points because that determines the floor. Since the story does not tell us who is on the floor, the Maximin rule lacks the information required to function.

  **2. What breaks if that feature is removed?**
  If you retune the numbers so that **the same person is worst-off in both hypotheses** (e.g., Alice is always bedridden), the Maximin chooser becomes invariant, just like the Average chooser. She would pick Plan 1 in both cases because Alice gets 10 points in Plan 1 and only 2 in Plan 2. This collapses the demonstration: it would no longer show that baseline information is a *necessary* input for Maximin. The divergence *requires* the possibility that the "worst-off" slot switches people between scenarios.

  **3. How would a defender of the Maximin rule attack this case?**
  She would argue that needing extra information is a **virtue, not a flaw**. She would say the Average rule's invariance is bought with **blindness**: it ignores suffering by treating a gain for the healthy the same as a gain for the sick. She would claim that if we *cannot* measure baselines, we should not use the Maximin rule, but that doesn't mean the rule is wrong—it means our data is incomplete. However, she must admit that without that data, her rule yields no verdict, whereas the Average rule still produces a defensible allocation (maximizing total health), even if it ignores distribution.
