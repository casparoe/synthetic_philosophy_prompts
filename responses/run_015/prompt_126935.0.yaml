answer: |-
  Good evening, everyone. For those who don't know me, I'm one of [Advisor's Name]'s students. Looking around this room, I realize we have two distinct tribes here tonight. On one side, we have the family, who know [Advisor's Name] as the person who comes to dinner and asks why you're scrolling on your phone. And on the other side, we have the students and colleagues who know her as the person who wrote three hundred pages on why that phone isn't actually thinking.

  For thirty years, [Advisor's Name] has occupied a very specific, very difficult intellectual space. In a field obsessed with the question "Can machines think?", she stood up and said, "That's the wrong question. The right question is: Why do we *want* them to?"

  Her career is defined by a concept she calls "ascriptive surrogacy." Now, for the ethicists in the room, you know exactly what that means. But for the family—and for the sake of the record—I want to translate that.

  [Advisor's Name] argued that when we use these systems, we treat them as *surrogates*. We let them stand in for us. We let them draft our emails, summarize our meetings, and simulate our conversations. But the "ascriptive" part is the crucial bit. It means *we* assign that role. We project the agency onto the machine.

  She spent three decades fighting against the idea that LLMs are "digital minds." She hated that phrase. But she also refused to let people dismiss her work as just saying "it's all autocomplete." To her, a simulator isn't nothing. A flight simulator isn't a plane, but if you crash it, you still learn something about gravity.

  I remember once, early in my PhD, I asked her why this distinction mattered so much. Why fight so hard against calling an algorithm an "agent"? She told me something I've never forgotten. She said, "If we convince ourselves the machine is the agent, then we are no longer responsible for the output. We become passengers in a car we're still driving."

  That was her moral center. She wasn't trying to diminish the technology; she was trying to protect *us*. She wanted to ensure that when the surrogate speaks, we remember that *we* are the ones who built the voice. She taught us that mistaking the map for the territory isn't just a philosophical error; it's an ethical abdication.

  To the family: She didn't spend thirty years talking to chatbots. She spent thirty years talking to *us*, using the chatbots as a mirror to show us how easily we surrender our own judgment.

  To the students: She taught us that rigor is a form of kindness. In a field prone to hype, she offered us the gift of precision. She showed us that we can marvel at the simulation without lying about the ontology.

  [Advisor's Name], thank you for teaching us that the most important intelligence in the room is still the human kind. Thank you for being a rigorous advisor, a stubborn philosopher, and a wonderful mentor.

  Please raise your glasses. To the one who taught us to read the text without worshipping the pen. To [Advisor's Name].
