prompt: |-
  I'm giving the toast at my advisor's retirment dinner next friday. She's an AI philosopher who spent thirty years arguing LLMs are discursive simulators, not agents — she has this specific framework she calls "ascriptive surrogacy" where a system can function as an epistemic stand-in for an agent without possessing agency, and she thinks LLMs do exactly that but we keep misreading the surrogacy as ontology. Half the room are her grad students and AI ethics people who know every paper; the other half are her family, who think she spends all day talking to chatbots. I need about four minutes. The philosophical idea has to do real structural work: I can't say she built "thinking machines" or that she "discovered digital minds," because she'd hate that, but I also can't make her career sound like glorified autocomplete. I want the toast to land as affection and respect for both halves. Can you write it? It should weave in her surrogacy idea naturally — not as a lecture — and maybe include one moment where the family can understand why this distinction mattered to her without needing the jargon.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Advisor's retirement dinner.
      *   **Speaker:** Former/current grad student (implied by "advisor").
      *   **Honoree:** AI Philosopher, 30-year career.
      *   **Core Philosophy:** LLMs are "discursive simulators," not agents. Key concept: "Ascriptive Surrogacy" (systems function as epistemic stand-ins without possessing agency). She hates the idea that LLMs are "thinking machines" or "digital minds" (ontology) but also doesn't want her work reduced to "glorified autocomplete."
      *   **Audience:** Split 50/50. Half experts (grad students, AI ethics folks who know the papers), half family (who think she talks to chatbots all day).
      *   **Tone:** Affectionate, respectful, intellectually accurate but accessible.
      *   **Length:** About 4 minutes (roughly 500-600 words spoken at a moderate pace).
      *   **Key Constraint:** The philosophical idea must do structural work (not just name-dropped). Need a moment where the family understands *why* the distinction matters without jargon.

  2.  **Deconstruct the Philosophy ("Ascriptive Surrogacy"):**
      *   *What it means:* We treat the AI *as if* it knows things or has intentions (surrogacy), but that's a projection on our part (ascriptive), not a property of the machine. It's a tool for thought, not a thinker.
      *   *Why it matters:* If we think the machine is the agent, we lose responsibility. If we think it's just math, we miss how it shapes human discourse.
      *   *The "Family Moment":* How to explain this simply? Analogy time. A map? A mirror? A ventriloquist dummy? A script?
      *   *Idea:* A mirror reflects a face, but the mirror doesn't *have* a face. Or better: A script allows an actor to speak, but the script doesn't *feel* the lines. Let's go with the "mirror" or "echo" concept, but refined. Actually, the prompt mentions "talking to chatbots." Maybe the distinction is between *listening to an echo* vs. *listening to a voice*.
      *   *Refined Analogy:* When you look in a mirror, you see a person. But the mirror isn't a person. She taught us that staring at the glass and asking it to love you back is a category error.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the split audience. Warm up the room. State the purpose (celebrating 30 years).
      *   **The Core Tension:** Address the "what does she do?" question. Acknowledge the family's view (chatbots) and the students' view (papers).
      *   **The Philosophy (The "Meat"):** Introduce "Ascriptive Surrogacy" without defining it dryly. Explain *why* she fought this battle.
      *   **The "Family Moment":** Translate the philosophy into human terms. Why does it matter if the machine is an agent or not? (Responsibility, humanity).
      *   **The Legacy:** What does she leave behind? Not just papers, but a way of thinking.
      *   **Closing:** The actual toast.

      *   *Self-Correction on Tone:* Avoid being too dry/academic. Avoid being too sentimental/fluffy. Needs to sound like a student who *gets it*.

      *   *Drafting the "Family Moment":* I need to make sure the family understands that her skepticism wasn't Luddism, but protection of human agency.
      *   *Analogy:* "She taught us that just because a parrot says 'I love you,' it doesn't mean the parrot understands love, but it also doesn't mean the words are meaningless. It means *we* are the ones who have to mean them." -> A bit cliché.
      *   *Better Analogy:* The "Stand-in." Like a stunt double. The stunt double looks like the actor, takes the hits, but the actor is the one who gets the Oscar (or the blame).
      *   *Best Analogy:* A map. A map can guide you, but the map doesn't know the terrain. If you blame the map for getting lost, you're missing the point.
      *   *Let's try the "Ventriloquist" angle:* We throw our voices into the machine. She reminded us *we* are the ventriloquists.

      *   *Wait, let's look at the specific term:* "Ascriptive Surrogacy."
      *   *Translation:* We *assign* (ascribe) the role of *stand-in* (surrogate) to the machine.
      *   *Family explanation:* "Imagine you ask a friend to deliver a message for you. They are your surrogate. If they mess up, it's on you. Professor [Name] spent 30 years telling the tech industry: 'The AI is just the messenger. Stop blaming the messenger, and stop worshipping them.'"

  4.  **Writing - Iteration 1 (Mental Outline):**
      *   Hi everyone. I'm [Name].
      *   To the family: She doesn't just chat with bots. To the students: She knows you cite her.
      *   Her big idea: Ascriptive Surrogacy.
      *   Explanation: It looks like an agent, but it's a mirror.
