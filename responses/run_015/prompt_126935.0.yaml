      *   To [Advisor]: Thank you for teaching us to be careful.
      *   Cheers.

  5.  **Writing - Iteration 2 (Fleshing out & Polishing):**
      *   *Need more warmth.* Start with the 30 years.
      *   *Need to nail the jargon.* Use "Ascriptive Surrogacy" but immediately ground it.
      *   *The Family Bridge:* "For my non-philosophers in the room..."
      *   *The Climax:* Her integrity. She didn't follow the hype.

  6.  **Refining the "Family Moment":**
      *   Let's use the concept of a "proxy."
      *   "She argued that treating an AI like a person isn't just wrong scientifically; it's dangerous ethically. Because if the machine is the agent, then *we* aren't responsible for what it says."
      *   *Simpler:* "She taught us that when a computer sounds human, it's not because the computer woke up. It's because we are very good at hearing ourselves in the silence."

  7.  **Final Polish (Checking constraints):**
      *   Time: ~550 words = ~4 minutes.
      *   Tone: Respectful, witty, clear.
      *   Philosophy: Accurate to the prompt (simulator vs agent).

      *(Self-Correction during drafting)*: Make sure I don't accidentally imply LLMs are useless. They are *simulators*. They have utility, just not ontology.
      *   *Key phrase to include:* "Epistemic stand-in."
