      *   *Okay, let's finalize the speech.*

  8.  **Final Review against constraints:**
      *   4 minutes? Yes, word count looks right.
      *   Philosophy does structural work? Yes, it frames her career integrity.
      *   Family moment? Yes, the "mirror/echo" analogy.
      *   No "thinking machines"? Checked.
      *   No "glorified autocomplete"? Checked.

      *(Final Polish of the text)*: Ensure the transition between the technical and the personal is smooth. Make sure the toast at the end feels earned.

