  A graduate student rushes into his Quinean advisor's office, pale and trembling. "I did it," he says. "I treated my moral conviction as a peripheral hypothesis and revised it. Just like you taught me."

  The advisor looks up from his paper. "And? Did the revision cascade inward? Did you have to abandon any laws of physics to accommodate the change?"

  "No," the student replies. "That's the miracle of the web. Since ethics is so far from the sensory core, I didn't have to alter a single empirical fact. The logical foundation is solid. The scientific load-bearing walls are intact."

  "Then why are you shaking?"

  "Because I just realized," the student says, "that you can renovate the porch without collapsing the house, but if you tear off the porch, you still have nowhere to live."
