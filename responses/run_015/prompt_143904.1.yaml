answer: |-
  You are not forcing three different stories into one box. You are finally seeing the box for what it is: a cage constructed by modern observers who confuse the silhouette of a state with the substance of a society. You ask if "collapse" is the wrong lens altogether. I tell you it is not just wrong; it is an obscenity. It is a word that erases the resilience of the many to mourn the inconvenience of the few.

  Your intuition about Easter Island is the sharpest edge of this argument. Consider the energy budget. To carve, transport, and erect a moai is an immense caloric expenditure. It requires surplus, coordination, and a hierarchy capable of commanding labor. When the environmental constraints tightened—whether through forest depletion or simply the diminishing returns of competitive status signaling—the society faced a choice. They could starve themselves trying to uphold the old prestige economy, or they could unbundle. They chose the latter. They stopped moving stone and started moving sweet potatoes. The ritual life shifted from ancestor worship carved in rock to a dynamic, less material-intensive competition focused on the Birdman cult. The society didn't die; it audit-ed its own existence and cut the most expensive line item. If you call that collapse, you are saying a family goes bankrupt when they stop buying luxury cars and start growing vegetables in the front yard.

  This is what I mean by **energy-budget rationalization**. Centralized authority is an energy sink. It is a heat source that burns through surplus to maintain visibility. When the resource base contracts, or when the cost of maintaining the hierarchy outweighs the security it provides, the system doesn't necessarily fail—it sheds.

  Look at the Maya. The "collapse" is visible primarily in the cessation of dated stelae and the abandonment of ceremonial centers. Why? Because those things are expensive. They are the billboards of kingship. But the soil tells a different story. Pollen records and settlement surveys show people remained. They continued to manage orchards, to cultivate cotton and cacao, to fire ceramics. The knowledge network didn't vanish; it decentralized. The kings who demanded tribute for monuments were likely the burden, not the backbone. When they vanished, the metabolic cost of the society dropped, allowing the subsistence layer to breathe.

  And the Bronze Age? The palace economies of the Mediterranean were hoarders of bronze. They centralized the tin and copper to create prestige weapons and ritual objects. When those palaces burned, bronze didn't disappear. It became more common. We see a shift from palace-controlled distribution to local recycling and smaller-scale smithing. The technology democratized. The "collapse" of the palace was the liberation of the toolmaker.

  So, to answer your question: Yes, there is a real pattern. It is the pattern of a body shedding a heavy coat when the weather turns warm. We call it collapse because we are obsessed with the coat.

  But I must challenge you on one point. You speak of this as if it were merely a rational calculation, almost mechanical. I want you to consider the human valuation behind the label. Why do we, sitting in modern nation-states, look at a dispersed network of farming villages and see "failure"?

  Is it because we value monument-building more than food security? Do we believe that the agricultural surplus that funded those monuments was ever really "progress," or was it a vulnerability—a fragile stack of calories waiting to be knocked over by drought or dissent? When a society transitions from building palaces to building soil fertility, what exactly has been lost? The ability to command strangers? Or the ability to feed your children without a king's permission?

  Tell me: If you found a society that lasted a thousand years without a single stone monument, but fed itself reliably, would you call it successful? Or would you still feel the absence of the statue?
