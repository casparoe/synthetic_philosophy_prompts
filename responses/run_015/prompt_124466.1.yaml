answer: |-
  There is no single, canonical term in analytic philosophy (like "The Hard Problem" or "The Combination Problem") that specifically names this *argumentative move*. However, it is a recognized maneuver in contemporary panpsychist literature, usually discussed under the umbrella of **"The Problem of Panpsychist Suffering"** or **"The Axiological Combination Problem."**

  The specific move you are describing—where micro-experience is valence-neutral and macro-valence is determined by structural relations (integration vs. disintegration)—is best described as **Valence Structuralism** (within a panpsychist framework).

  If you want a precise term to distinguish this from the standard Combination Problem and from physicalist emergentism, I propose coining:

  ### **The Axiological Structuralism Move**
  *(Or, for the phenomenon itself: **The Structural Valence Asymmetry**)*

  Here is the breakdown of why this term fits, how it distinguishes itself from related concepts, and where its philosophical boundaries lie.

  ---

  ### 1. Why this term?
  *   **Axiological:** Refers to *value* (good/bad, pleasure/pain), distinguishing it from the *phenomenological* question of how subjects combine.
  *   **Structuralism:** Indicates that the moral/phenomenal quality (valence) is not an intrinsic property of the parts, but a property of the *arrangement* or *relation* between them.
  *   **The Move:** It explicitly signals that this is a strategic solution to an ethical worry, not just a description of consciousness.

  ### 2. Distinction from Related Concepts

  | Concept | The Question | How Your Move Differs |
  | :--- | :--- | :--- |
  | **The Combination Problem** | How do micro-*subjects* combine to form a macro-*subject*? (The "Subjectivity" Gap) | Your move accepts subjects might combine (or bypasses it) but asks: Why does the resulting experience feel *good* or *bad*? It solves the *value* gap, not just the *unity* gap. |
  | **Physicalist Emergentism** | How does non-experiential matter produce experience? | Your move assumes experience is *already there* at the bottom. It only claims *valence* emerges from structure. Consciousness is fundamental; suffering is structural. |
  | **Valence Realism** | Is pain/pleasure a fundamental property of the universe? | Your move is a form of *Valence Anti-Realism at the micro-level*. It says pain is not fundamental; only neutral experience is. |

  ### 3. The Edges and Boundaries of the Phenomenon

  You asked where the edges are—specifically regarding valence and the possibility of "joyful disintegration."

  #### **A. Does it apply only to valence?**
  **Yes, primarily.** This is the crucial edge.
  In this framework, *qualitative content* (redness, coldness, spatial extension) might be intrinsic to the micro-entities. An electron might "feel" a primitive version of electromagnetic charge. However, the *hedonic tone* (the "ouchiness" of pain or the "yumminess" of pleasure) is reserved for the macro-structure.
  *   **Boundary:** If you claim that *content* is also structural, you slide toward **Illusionism** or **Eliminativism**. If you claim *valence* is intrinsic to the electron, you slide toward **Pan-Suffering** (the view you are trying to avoid). **Axiological Structuralism** sits precisely on the line: Intrinsic Qualia, Structural Valence.

  #### **B. Can disintegration produce joy?**
  **In this specific framework, no.**
  This is the "Asymmetry" part of the **Structural Valence Asymmetry**.
  *   **The Logic:** If well-being is defined as *integration* (parts working smoothly toward a common aim) and suffering is *disintegration* (parts conflicting, friction, noise), then by definition, disintegration cannot produce joy.
  *   **The Edge Case:** One could argue for **"Controlled Disintegration"** (e.g., the thrill of a rollercoaster, the chaos of a mosh pit). A proponent of Axiological Structuralism would argue this is actually a *higher-order integration*. The "chaos" is contained within a safe, integrated framework (the "play frame"). If the disintegration becomes total (the bar breaks, the body tears), the joy instantly becomes suffering.
  *   **Philosophical Precedent:** This aligns with **Whitehead's Process Philosophy**, where "evil" is defined metaphysically as the obstruction of subjective aim (disintegration), and "good" is the satisfaction of aim (integration). It also mirrors **Integrated Information Theory (IIT)**, though IIT focuses on consciousness existence, not valence. Some extensions of IIT (like the *Phi-Valence* hypothesis) map high integration to positive valence and fragmentation to negative valence.

  ### 4. Who is making this move?
  While they may not use the exact term "Axiological Structuralism," this reasoning appears in:
  *   **Hedda Hassel Mørch:** She argues for panpsychism but grapples with the "combination problem" for value, suggesting macro-valence might differ from micro-valence.
  *   **Philip Goff:** In discussing *Cosmopsychism*, he suggests the cosmic subject might have a different axiological profile than human subjects, often leaning on structural coherence to explain value.
  *   **David Pearce (The Hedonistic Imperative):** While a physicalist, his view that suffering is a "signal of genetic disintegration" parallels this structural view.
  *   **Process Philosophers (Whitehead, Hartshorne):** They view reality as events of experience where "satisfaction" is the successful integration of data.

  ### 5. Summary for your usage
  If you are writing or arguing about this, you can say:

  > "This isn't just the Combination Problem; it's what I call **The Axiological Structuralism Move**. It distinguishes between fundamental *phenomenology* (which is neutral) and emergent *axiology* (which is structural). It avoids the ethical catastrophe of pan-suffering by locating pain not in the existence of matter, but in the *friction* between matters."

  This术语 (terminology) cleanly separates the *existence* of mind from the *value* of mind, which is exactly the distinction you identified.
