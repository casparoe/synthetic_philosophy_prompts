answer: |-
  hey, sorry to hear about the heat. twice is unacceptable, and it makes total sense you're burned out on the semantics of it all. since you're volunteering and not getting paid to litigate, you need a tool that cuts through the "he said/she said" without needing a law degree.

  here's the **10-minute grice quick-scan**. grab your notebook. draw a line down the middle. left side = "what was said", right side = "what was meant".

  ### the procedure

  **1. literal lock-down (2 mins)**
  write down the exact words. text screenshot or meeting notes.
  *   *check:* is the sentence literally false? (e.g., "i called them" when you didn't).
  *   *flag:* if you're guessing what words were used, stop. get the exact text. that's a fact check. if you're interpreting tone, that's a value judgment.

  **2. cooperative principle check (1 min)**
  assume they *were* trying to communicate useful info. if you assume they're just trying to win, grice doesn't work.
  *   *question:* were they trying to move the repair forward or just shut you up?
  *   *flag:* deciding intent here is a value judgment.

  **3. run the 4 maxims (3 mins)**
  scan the statement against these four rules. tick any that feel broken.
  *   **quantity:** too much info? too little? (hiding details)
  *   **quality:** do they have evidence? is it true? (lying/guessing)
  *   **relation:** is it relevant? (changing subject)
  *   **manner:** is it clear? or vague/ambiguous? (weasel words)

  **4. the implicature tests (3 mins)**
  if the literal words are true but feel wrong, you're dealing with an implicature (what was suggested).
  *   **cancellability test:** can they add "but not really" without contradicting themselves?
      *   *example:* "i'll try... but i won't." (makes sense = implicature).
      *   *example:* "i'm here... but i'm not." (contradiction = literal claim).
  *   **non-detachability test:** swap the key words for synonyms. does the shady meaning stay?
      *   if yes -> it's a real implicature (about the situation).
      *   if no -> it's just about their word choice.

  **5. flouting vs. violating (1 min)**
  *   **violating:** quietly breaking a rule to mislead (lying).
  *   **flouting:** obviously breaking a rule so you notice the hint (sarcasm/passive aggression).
  *   *honest warning:* in text messages or heated meetings, this distinction often misfires. you can't see their face. if you can't prove they *wanted* you to know they were lying, treat it as a violation. don't waste time guessing sarcasm.

  **6. the verdict (final minute)**
  *   **breach:** literal said-content was false (quality maxim violation).
  *   **disappointment:** literal content was true, but implicature failed (expectation mismatch).

  ---

  ### running the disputes

  here's how this plays out on your three cases.

  #### 1. landlord text: "the repair crew is aware of your unit"
  *   **literal:** crew knows about the unit.
  *   **maxim scan:** **quality**. did he tell them? if no, is it true they are aware? maybe they know from a previous ticket?
  *   **cancellability:** can he say "they are aware... but i never told them"? technically yes (maybe the super told them).
  *   **non-detachability:** if he said "the crew knows about your place," same vibe.
  *   **flout vs violate:** likely **violating**. he wants you to think work is happening without saying "work is happening."
  *   **verdict:** **grey area.** if he never notified them, it's a lie by omission (quality violation). but technically "aware" is vague.
  *   **mediator call:** push for **breach**. why? because in a tenant/landlord context, "aware" implies "ticket logged." if no ticket, the statement fails the cooperative goal of housing maintenance. flag: judging whether "aware" equals "ticket logged" is a value judgment based on industry norm, not linguistics.

  #### 2. tenant meeting: "some residents have mentioned noise issues"
  *   **literal:** >1 resident mentioned noise.
  *   **maxim scan:** **quantity/quality**. if only she complained, is "some" false? "some" can logically mean "at least one," but pragmatically implies "more than me."
  *   **cancellability:** "some residents... actually just me." feels contradictory to the vibe, but logically okay.
  *   **non-detachability:** "a few people said..." same implication.
  *   **flout vs violate:** **violating**. she's hiding that it's her complaint to give it weight.
  *   **verdict:** **misrepresentation (implicature).** she didn't lie literally (she is a resident), but she implicated community consensus.
  *   **mediator call:** **not a breach of rules, but bad faith.** you can't sanction her for lying if she lives there and complained. but you can call out that the *weight* of the complaint was inflated. flag: deciding if "some" implies plural is a value judgment on common usage.

  #### 3. the promise: "i'll do my best to have this done by friday"
  *   **literal:** i will exert maximum effort toward friday completion.
  *   **maxim scan:** **quality/manner**. "do my best" is inherently vague (manner).
  *   **cancellability:** "i'll do my best... but it won't be done." **not contradictory.** this is the key.
  *   **non-detachability:** "i'll try my hardest..." same lack of guarantee.
  *   **flout vs violate:** neither. it's a standard hedge.
  *   **verdict:** **disappointment.**
  *   **mediator call:** **this is the answer you won't like.** technically, nothing false was said. "doing your best" is not a promise of results, only of effort. unless you can prove he didn't *try* (called no one, ordered no parts), you cannot sign off on a breach of promise.
  *   **hard truth:** you feel betrayed because you heard the implicature ("it will be done friday"). he said the literal ("i will try"). in mediation, you have to rule on the literal unless there's proof of bad faith. if you rule against him here, you're setting a precedent that "i'll try" = "i guarantee," which will kill future cooperation.

  ### final notes for your notebook

  *   **where you're guessing:** anytime you decide if someone "meant" to mislead (step 5), write "intent guess" in margins. that's not evidence.
  *   **where the tool breaks:** if someone is gaslighting, they will violate the maxims so smoothly it looks like cooperation. grice assumes people want to be understood. some people just want to win. if you sense that, stop the linguistics and switch to "show me the receipt/work order."
  *   **time check:** if you go over 15 mins, you're overthinking the semantics. if the literal meaning is clear, rule on that. only dive into implicature if the literal meaning is obviously true but the outcome is impossible.

  good luck. hope the heat stays on.
