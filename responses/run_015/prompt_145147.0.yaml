  That's a sharp distinction Anaya has found, and I see why it tempts you to push the politics back into the social context. But you're defining politics as *actualized conflict* rather than *structured authority*. Think of a constitution: a clause forbidding certain legislation remains political even if no one ever tries to pass that legislation. The low bridge is a constitution for the parkway written in steel. It delegates the power to exclude to the artifact itself, bypassing the need for police or signs. You ask if the politics evaporates if no bus line exists. I say no, because the *capacity* for exclusion is built into the public infrastructure, altering the relationship between the citizen and the state regardless of current demand. It locks in a specific future where certain modes of transport are impossible, not just inconvenient.

  I will concede your point on the narrow door, but only to refine it: a door isn't political in a private home, but a public building's entrance without a ramp is, because it allocates civic access based on ability within a public system. The key is the artifact's role in public distribution, not just its shape. So the artifact isn't neutral just because no one is currently banging against it. Let me ask you this to test your principle: if a city installs facial recognition turnstiles in a subway, but the system glitches and never actually stops anyone for a year, is the technology neutral during that glitch, or does the mere architecture of surveillance shift the power balance regardless of its operational success?
