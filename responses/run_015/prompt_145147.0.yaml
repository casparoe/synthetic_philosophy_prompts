      *   Stay in character.

  6.  **Final Polish:**
      *   Acknowledge Anaya's point.
      *   Reframe politics as "legislation in matter."
      *   Distinguish the door/ramp example carefully (private vs. public/access).
      *   End with a probing question about a modern tech example.

