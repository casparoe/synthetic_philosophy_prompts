answer: |-
  ### Part 1: Practitioner Brainstorm (The Philosophical Guts)

  Before we write the checklist, here are the distinctions that actually determine whether you can trust the Principal Principle (PP) in the field. PP says: *Set your credence equal to the objective chance, unless you have inadmissible evidence.* For us, "Objective Chance" is the State Model, and "Credence" is our signed brief.

  1.  **Mechanism vs. Outcome (The Admissibility Test):**
      *   *Admissible:* Evidence about the *setup* (e.g., corrosion, soil dryness). This changes the *chance*, but doesn't tell you the result. PP holds here, but you might need to update the chance value first.
      *   *Inadmissible:* Evidence that leaks information about the *outcome* itself (e.g., "water is currently leaking," "patients are already sick"). If you have this, the model's probability is obsolete. Deference collapses.

  2.  **Reference Class Matching:**
      *   The State Model gives a chance for a *type* of situation (e.g., "average reservoir with standard maintenance"). If your local report puts you in a *different* reference class (e.g., "reservoir with known gate corrosion"), the model's 18% is not the true chance for *you*. You cannot defer to a number that isn't about your case.

  3.  **The "True Chance" Gap:**
      *   PP only works if the model number *is* the objective chance. Models are imperfect. If local evidence suggests the model is structurally wrong (not just noisy), you cannot defer. You are deferring to a map, not the territory.

  4.  **Epistemic vs. Pragmatic Norms:**
      *   PP is about truth-tracking (epistemic). Your office has safety mandates (pragmatic). Sometimes these conflict. PP says "believe 62%." Policy says "say 50%." This isn't a math problem; it's a liability call. The procedure must flag this, not solve it.

  5.  **Where PP Collapses:**
      *   When the event is unique (no frequency).
      *   When evidence is "crystal ball" (inadmissible).
      *   When self-locating uncertainty kicks in (e.g., "I am the office that received the warning vs. the one that didn't").
      *   When the model assumes conditions you know are false.

  ---

  ### Part 2: The Monday Morning Deference Protocol

  **Purpose:** Combine State Model outputs with Local Reports into an official credence.
  **Time:** ~20 Minutes.
  **Rule:** If you hit a **STOP**, do not proceed to the next step without Lead approval.

  **Step 1: Validate the Model Number**
  *   [ ] Is the State Model output current (released this cycle)?
  *   [ ] Does the model explicitly state the conditions it assumes (e.g., "assuming standard maintenance")?
  *   *If NO:* **STOP**. Treat model as unreliable. Use local expert consensus only.
  *   *If YES:* Record Model Chance ($M$).

  **Step 2: Classify Local Evidence**
  *   Review local reports (sensors, logs, anecdotes).
  *   [ ] **Type A (Setup):** Describes the *conditions* (e.g., corrosion, soil moisture, staffing levels).
  *   [ ] **Type B (Outcome):** Describes the *event happening* or something that logically entails it (e.g., active leak, confirmed cluster of novel virus).
  *   *If Type B found:* **STOP**. Go to Step 5 (Inadmissible Override).
  *   *If only Type A:* Proceed to Step 3.

  **Step 3: The Reference Class Check**
  *   Does the Local Evidence (Type A) violate the Model's assumed conditions?
  *   *Example:* Model assumes "good repair," Local says "corrosion."
  *   [ ] **Match:** Local evidence is within normal variance expected by the model.
  *   [ ] **Mismatch:** Local evidence indicates a specific deviation the model doesn't account for.
  *   *If Match:* **DEFER**. Official Credence = $M$. (Skip to Step 6).
  *   *If Mismatch:* **STOP**. Go to Step 4.

  **Step 4: Adjusted Chance Estimation (The Hard Part)**
  *   Since the model number $M$ is for a "standard" case and you have a "non-standard" case, $M$ is not the true chance.
  *   [ ] Consult senior engineer/epidemiologist: "Given this deviation, does the risk go up or down?"
  *   [ ] Estimate direction and magnitude (e.g., "Double the risk," "Add 10%").
  *   [ ] Calculate Adjusted Chance ($A$).
  *   *Official Credence* = $A$.
  *   *Note:* You are no longer deferring to the model; you are using the model as a baseline.

  **Step 5: Inadmissible Override (Type B Evidence)**
  *   If you have evidence about the *outcome* (e.g., cases already detected), the probablity is no longer a future chance.
  *   [ ] Assess certainty of outcome.
  *   [ ] If outcome is effectively certain: Official Credence = 100% (or 0% if contained).
  *   [ ] If outcome is ambiguous but likely: Set credence based on local data, ignore $M$.
  *   *Flag:* **DEFERENCE BREAKDOWN**. Document why model was overridden.

  **Step 6: Policy & Mandate Check**
  *   Compare Official Credence against office mandates (e.g., confidence caps).
  *   [ ] Does Credence exceed political/ safety caps?
  *   *If YES:* **STOP**. **VALUE CALL**.
      *   Option 1: Sign the true credence (Epistemic honesty, risk political fallout).
      *   Option 2: Cap the credence (Pragmatic safety, violate PP).
  *   *If NO:* Sign and distribute.

  ---

  ### Part 3: Case Applications

  **Case A: Reservoir Breach (Model 18% vs. Corrosion Report)**
  *   **Step 1:** Model is current. Assumes standard maintenance.
  *   **Step 2:** Corrosion is **Type A (Setup)**. It affects the mechanism, doesn't confirm breach.
  *   **Step 3:** **Mismatch**. Model assumes standard; report shows corrosion (non-standard).
  *   **Step 4:** **Adjusted Chance**. The 18% is for a healthy gate. Corrosion increases failure propensity. Engineer estimates risk doubles.
  *   **Decision:** Official Credence = ~36%.
  *   **Note:** We did not defer to the 18%. We used it as a baseline. The local evidence was admissible but required a parameter update.

  **Case B: Respiratory Outbreak (Model 4% vs. 3 Pneumonia Cases)**
  *   **Step 1:** Model current.
  *   **Step 2:** 3 weird cases is **Type B (Outcome)**. It suggests the outbreak may have *already started*.
  *   **Step 3:** N/A (Stop at Step 2).
  *   **Step 5:** **Inadmissible Override**. The model gave the chance of an outbreak *starting*. If cases are confirmed novel, the event is present.
  *   **Decision:** Official Credence = High (depends on confirmation). Ignore the 4%.
  *   **Flag:** **DEFERENCE BREAKDOWN**. The model predicts future chance; local data indicates present fact.

  **Case C: Extreme Heat (Model 62% vs. 50% Mandate)**
  *   **Step 1-4:** No local evidence contradicts model. Model assumes standard climate vars. Match.
  *   **Decision (Epistemic):** Official Credence = 62%.
  *   **Step 6:** **Policy Check**. Mandate caps "high confidence" at 50% without federal backing.
  *   **Flag:** **VALUE CALL**.
      *   *Procedure Output:* The protocol tells you the *true* credence is 62%. It cannot tell you what to sign.
      *   *Action:* You must choose. If you sign 50%, you are lying about your credence to satisfy policy. If you sign 62%, you risk mandate violation.
      *   *Recommendation:* Sign 62% but attach footnote citing State Model. Do not falsify the number; falsifying probablity undermines the whole system.

  ---

  ### Part 4: Where This Procedre Misfires (Limitations)

  1.  **The "True Chance" Illusion:** This checklist assumes the State Model is close to objective chance. If the model is garbage (GIGO), Step 1 won't catch it. You need independent validation occasionally.
  2.  **Mixed Reference Classes:** Sometimes evidence is half-Setup, half-Outcome (e.g., "sensor noise" that looks like a breach). Step 2 might be ambiguous. If unsure, treat as Type B (Override) to be safe.
  3.  **Self-Locating Uncertainty:** If the report says "One office in the county detected leaks" but doesn't say *which*, and you are one of many offices, standard probability gets weird (Sleeping Beauty problems). The checklist doesn't handle this. Escalate to state.
  4.  **Policy Conflict:** As seen in Case C, the procedure identifies the conflict but doesn't resolve it. You cannot epistemologically justify capping confidence at 50% if the chance is 62%. That is a political decision, not a forecasting one.

  *Final Note:* Keep this sheet laminated. If you hit two **STOP** flags in one week, call the State liaison. We don't want to be guessing when the math gets too messy.
