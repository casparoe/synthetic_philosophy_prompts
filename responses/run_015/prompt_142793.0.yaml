  ok so my world history teacher Mr. Chen grades our essays using these weird categories he never actually explains: "legend with bones," "back-projected history," "identity-event," and "cross-cultural myth." heres what hes said so far: the Trojan War is legend with bones cause Schliemann found Troy but the horse and the ten-year siege are probably made up; King Arthur is back-projected history — there mightve been a local warlord named Arturus or whatever but the knights and round table got added centuries later; the Exodus is an identity-event, he says its real for the people who experienced it but you cant verify it with outside egyptian records; and he said the Queen of Sheba story is just cross-cultural myth since ethiopia and israel both claim her but theres no neutral proof.

  now for our final he asks about the Prester John legend, specifically the version where medieval europeans believed there was a christian king in central asia and modern historians think he might actually be based on the Kerait ruler Yelü Dashi or a nestorian bishop. do you think Mr. Chen will call that back-projected history? identity-event? or legend with bones?

  im not really asking for the answer tho. i want to know what rule hes running — is it about whether archeology can back up a core event, about whether the story serves a political purpose, or about whether insiders and outsiders tell it the same way? what are the other rules that fit these four cases just as well? and which case would actually split them apart — like maybe comparing it to the japanese myth about the first emperor being descended from the sun goddess, or to the story of Hanno the navigator who mightve circled africa?

  please help me figure out his system before i write this essay lol i need to pass
