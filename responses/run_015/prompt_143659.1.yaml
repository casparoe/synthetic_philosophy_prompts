answer: |-
  Here is a complete lesson plan designed for your constraints. It prioritizes the *experience* of the cascade over the theory, saves time for the debrief, and handles the specific wrinkles you requested.

  ### **Lesson Plan: The Information Trap**
  **Time:** 75 Minutes
  **Students:** 24 (Philosophy + Econ)
  **Goal:** Demonstrate rational informational cascades, information wastage, and confidence-accuracy dissociation.

  ---

  ### **1. Materials & Setup**
  *   **Two Opaque Paper Bags:** Label them **Bag A** and **Bag B**.
  *   **Poker Chips or Colored Cards:** 60 Red, 60 Black. (Cards are quieter than chips).
      *   **Bag A:** 40 Red, 20 Black (2/3 Red).
      *   **Bag B:** 20 Red, 40 Black (2/3 Black).
  *   **Index Cards:** 24 per student (or just 2 sheets per student: one for Round 1, one for Round 2).
  *   **Whiteboard:** To track the sequence of public guesses.
  *   **Envelopes:** 4 small envelopes (for the "Experts").
  *   **Timer:** Your phone.

  **Pre-Class Prep:**
  1.  Flip a coin to decide the **True Bag** (e.g., Heads = Bag A). Keep this secret.
  2.  Fill the bags according to the ratios above.
  3.  Randomly select 4 students to be **Experts**. Put a slip in an envelope for each: *"You are an Expert. Draw 3 chips instead of 1. Do not tell anyone."* Hand these out as students enter or at the very start.
  4.  **Instructor Option (The "Drama" Switch):** If you want to *guarantee* a wrong cascade for the sake of the lesson, pre-select the first two students in the queue and hand them specific cards (the minority color) instead of letting them draw. *I recommend against this unless you are comfortable with deception; the 20% natural failure rate is usually high enough stakes.*

  ---

  ### **2. The Script & Procedure**

  #### **Phase 1: Introduction (5 Minutes)**
  **Say:** "We are going to run an estimation task. There is a True State of the World, determined by one of these two bags. Your goal is to identify the bag. You will be rewarded for accuracy."
  *(Note: Since you have no budget, 'reward' is symbolic—e.g., 'bragging rights' or 'participation credit'. Keep it low stakes to avoid reputational gaming.)*

  **Say:** "There are two rounds. In both, you get private evidence. In Round 1, you vote secretly. In Round 2, you vote publicly in sequence. Write down your guess **and** a Confidence Score (0–100%) on this card."

  #### **Phase 2: Round 1 — Simultaneous (Secret) (15 Minutes)**
  **Goal:** Establish the baseline accuracy of private information.
  1.  **Draw:** Each student comes to the front (or you walk around), draws **one** chip from the True Bag, looks at it secretly, and **returns it** (replacement keeps probabilities constant).
      *   *Experts* draw 3 chips, note the majority color, return them.
  2.  **Vote:** Students write `Round 1: [Color] | Confidence: [%]` on an index card.
  3.  **Collect:** Gather all cards. Do not reveal results yet.
  4.  **Tally:** Quickly count the Red vs. Black votes on the whiteboard.
      *   *Expected Outcome:* With $N=24$ and 2/3 signal accuracy, the majority vote should match the True Bag with >95% probability.
  5.  **Say:** "Look at the board. Most of you got this right. Your private information, when aggregated, is powerful."

  #### **Phase 3: Round 2 — Sequential (Public) (25 Minutes)**
  **Goal:** Induce the cascade.
  1.  **Order:** Arrange students in a fixed queue (1 to 24). Ensure at least one Expert is after position #10, and one is near the end (#24).
  2.  **Draw:** Student 1 draws 1 chip (Experts draw 3), looks secretly, returns it.
  3.  **Announce:** Student 1 says: *"I guess [Color]. Confidence [%.]"* Write this on the board.
  4.  **Repeat:** Student 2 draws, announces. Student 3 draws, hears 1 & 2, announces. And so on.
      *   **Crucial Rule:** "You must announce your guess. You cannot pass. You cannot explain *why*, only the guess and confidence."
  5.  **Manage the Pace:** Keep it moving. If a student hesitates, say: "Go with your best judgment."
  6.  **The Trap:** Around Student 3 or 4, if the first two matched, the cascade will lock in.
      *   *Watch for:* Students saying "I saw Red, but..." **Stop them.** "Just announce your guess." (If they leak their signal, the cascade breaks. You need them to hide the signal to simulate the model).
  7.  **Completion:** By Student 10, the room will likely be unanimous. Continue to 24 to let the late Experts feel the pressure.

  #### **Phase 4: The Reveal (10 Minutes)**
  **Goal:** Show the wasted information.
  1.  **Ask:** "How many of you guessed the [Majority Color of Round 2]?" (Hands go up).
  2.  **Ask:** "How many of you privately saw evidence for the *other* color?"
      *   *This is the money moment.* Hands will go up.
  3.  **Tally Round 1 Again:** Remind them of the Secret Vote. "In Round 1, X people saw evidence for the Truth. In Round 2, only the first two people's evidence mattered."
  4.  **Experts:** Ask the late Expert (e.g., #24): "You had 3 draws. The queue had 23 people. Why did you follow the queue?"
      *   *Expected Answer:* "I thought they knew something I didn't."
      *   *Point:* "They didn't. They were ignoring their own eyes, just like you."

  ---

  ### **3. Probabilities & Expectations**
  *   **Cascade Formation:** With $N=24$, probability of *a* cascade forming is $\approx 95\%$.
  *   **Wrong Cascade:** Probability the cascade is *wrong* (group agrees on the Minority Bag) is $\approx 20\%$.
      *   *Why?* A cascade starts when two consecutive signals match. If the True Bag is Red, the chance the first two draws are Black is $(1/3) \times (1/3) = 1/9$.
  *   **Confidence Gap:**
      *   **Round 1:** Avg Confidence should be $\approx 67\%$ (matching signal reliability).
      *   **Round 2:** Avg Confidence should rise to $\approx 85-90\%$ as the queue lengthens, even if accuracy stays flat.
  *   **Expert Power:**
      *   An Expert with 3 signals has a Likelihood Ratio of 8:1.
      *   A Cascade started by 2 signals has a Public LR of 4:1.
      *   *Mathematically*, the Expert *should* break the cascade.
      *   *Psychologically*, they often won't, because they treat the 20 previous guesses as 20 independent signals. **This is the teaching point:** In the real world, we don't know the dependency structure of others' information.

  **Contingency Plan:**
  *   **If the Group is Right:** "The group was right, but look at the confidence. You are 95% sure, but you only have 2 bits of data. You are overconfident."
  *   **If No Cascade Forms (Rare):** "The signals were too mixed. This shows cascades require early agreement."
  *   **If an Expert Breaks the Cascade:** "Excellent. This shows cascades are fragile. But notice: it took a 'super-informed' agent to break it. Normal agents are trapped."

  ---

  ### **4. Troubleshooting: What Will Go Wrong**
  1.  **Signal Leaking:** A student says, "I drew Black, but everyone said Red, so I guess Red."
      *   **Fix:** Interrupt immediately. "Just state your guess. Do not reveal your draw." If they already did, note on the board: *"Signal Leaked."* Explain in debrief that this destroys the cascade model (now everyone has 3 signals).
  2.  **The Contrarian (Econ Student):** A student deliberately guesses against the crowd to "break the game."
      *   **Fix:** Do not scold. In debrief, ask them: "Was that rational?" If they knew the cascade was irrational, yes. If they did it for fun, no. Use them to show that *one* contrarian resets the information count for everyone after them.
  3.  **Silence:** A student freezes.
      *   **Fix:** "Guess based on your draw and the board. 5 seconds."
  4.  **Instructor Face:** You react when a wrong guess is made.
      *   **Fix:** Wear sunglasses or stare at the whiteboard. Keep a poker face.
  5.  **Reputational Herding:** Students copy to avoid looking dumb.
      *   **Fix:** This is unavoidable. Use it in the debrief (see below).

  ---

  ### **5. The Debrief (20 Minutes)**
  *Do not use the words "Cascade" or "Herding" until the end.*

  **Step 1: Informational vs. Reputational (5 mins)**
  **Ask:** "Raise your hand if you guessed against your private signal because you thought the previous students had *better information*." (Informational)
  **Ask:** "Raise your hand if you guessed against your signal because you didn't want to be the only one sticking out." (Reputational)
  **Point:** "The model assumes the first reason. The reality is usually both. But notice: even if you did it for reputational reasons, the *outcome* is the same. The group stops learning."
  *(Recommendation: Do not run a 3rd reputational round. It muddies the water and eats time. The self-report in the debrief is sufficient to distinguish the motives.)*

  **Step 2: The Math of Wasted Info (5 mins)**
  **Draw:** On the board, draw the sequence.
  `P1(R) P2(R) P3(R) P4(R) ... P24(R)`
  **Say:** "P1 and P2 contributed information. P3 saw the two Reds. Even if P3 drew Black, 2 Reds beat 1 Black. P3 guesses Red. P4 sees three Reds. But P4 knows P3 might have ignored a Black signal. So P4 only counts P1 and P2."
  **Conclusion:** "From P3 onwards, **no new information enters the system.** You had 24 people, but the group only used 2 people's eyes."

  **Step 3: Confidence vs. Accuracy (5 mins)**
  **Show:** The confidence scores.
  **Say:** "Your confidence went up as the line got longer. But your information stayed flat. This is how groups become confidently wrong. You feel safe because you are surrounded by agreement, but the agreement is an echo chamber of the first two draws."

  **Step 4: The Expert Trap (5 mins)**
  **Ask the Late Expert:** "You had 3 draws. Why didn't you save us?"
  **Discussion:** "Because you didn't know *when* the cascade started. You saw 20 people agree. You assumed they had 20 signals. In reality, they had 2. In the real world (markets, politics), we rarely know if others are following signals or following the crowd."

  **Closing:** "This is an **Informational Cascade**. It is rational for you to ignore your own evidence. It is rational for the group to be wrong. And it is rational for 22 of you to be useless."

  ---

  ### **6. Limitations: What to Stop Them From Concluding**
  Students will want to generalize. Stop them here:

  1.  **"Cascades are always bad."**
      *   **Correction:** Cascades are efficient. They save time. If P1 and P2 are right, the other 22 don't *need* to think. It's only "bad" when they are wrong.
  2.  **"This explains stock bubbles."**
      *   **Correction:** In markets, prices *do* reveal information (unlike this game where guesses are just words). Markets are harder to fool than this queue.
  3.  **"People are irrational sheeple."**
      *   **Correction:** Emphasize the **Rationality**. They did the Bayesian math (intuitively). Ignoring your own signal was the *smart* move given the public history. The tragedy is structural, not psychological.
  4.  **"We should just reveal all signals."**
      *   **Correction:** In the real world, you can't force people to reveal private signals (proprietary data, secret ballots, internal doubts). The constraint is realistic.

  ### **Summary of Instructor Actions**
  1.  **Rig the Experts:** 4 students, 3 signals each, hidden.
  2.  **Enforce Secrecy:** No showing chips, no revealing draws.
  3.  **Track Confidence:** Essential for the "overconfidence" lesson.
  4.  **Debrief Hard:** Focus on the *rationality* of the error, not the stupidity.

  This plan fits your 75-minute slot, uses your available materials, and hits the philosophical core (rational error) without getting bogged down in reputational mechanics that distract from the epistemic point.
