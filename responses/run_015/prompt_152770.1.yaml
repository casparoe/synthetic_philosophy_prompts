answer: |-
  Your roommate's summary is a **mixed bag**. They have grasped the core "orthodox" view of Walzer's theory correctly, but they have conflated legal technicalities with moral philosophy and misrepresented how Walzer handles responsibility for war crimes.

  Here is a breakdown of what is accurate, what is distorted, and how the "mindless tools" objection actually works.

  ### 1. What Matches Walzer's Actual "Separation Thesis"
  **Verdict: Accurate**

  Your roommate correctly identifies the two pillars of Walzer's argument in *Just and Unjust Wars*:
  *   **The Moral Equality of Combatants (MEC):** Soldiers on both sides possess an equal right to kill enemy combatants and are equally liable to be killed. This status does not depend on whether their side is fighting a just or unjust war.
  *   **The Separation of *Jus Ad Bellum* and *Jus In Bello*:** Walzer argues that the justice of going to war (*ad bellum*) is logically distinct from justice in the conduct of war (*in bello*). A soldier can fight for an unjust cause but fight honorably (following the rules of war), and a soldier can fight for a just cause but commit atrocities.

  **Why Walzer argues this:** Walzer believes that if we tied *in bello* rights to *ad bellum* justice, war would become unlimited. If only the "just" side had the right to kill, the "unjust" side would have no incentive to follow any rules, leading to greater slaughter. The "war convention" exists to limit horror, not to judge ultimate guilt.

  ### 2. The Mercenary/Draftee Distinction
  **Verdict: Significant Distortion / Conflation**

  Your roommate claims: *"The only people who lose protection are those who personally choose to fight for an unjust cause, like mercenaries, while draftees stay innocent."*

  This is **not** an accurate representation of Walzer's core philosophical argument, though it touches on international law.
  *   **Walzer's View:** Walzer argues that *all* combatants in uniform are legitimate targets. He does not grant draftees "innocence" that makes them immune from attack, nor does he argue that mercenaries lose their status as combatants in the context of the Moral Equality thesis. To Walzer, a mercenary in an army is still a combatant who can be killed without it being "murder."
  *   **Where the confusion comes from:** Your roommate is likely conflating Walzer's moral philosophy with **Article 47 of the Geneva Conventions (Additional Protocol I)**. Under international *law*, mercenaries are often denied Prisoner of War (POW) status. However, Walzer's philosophical argument about the *moral equality of combatants* is meant to apply to regular armed forces.
  *   **Volunteer vs. Draftee:** Walzer does discuss the "coercion" of the state. He argues that soldiers are generally not responsible for the crime of aggression (starting the war) because they are coerced by the political community. He does not draw a hard moral line where volunteers are guilty of aggression and draftees are innocent. He generally absolves the common soldier (volunteer or draft) of *ad bellum* guilt, reserving that for political leaders.

  ### 3. The "Mindless Tools" Objection & Responsibility
  **Verdict: Misrepresentation of Walzer's Conclusion**

  Your roommate claims: *"Critics say this... collapses into saying no soldier can ever be blamed."*

  This is a **caricature** of the criticism, and it ignores Walzer's explicit response.
  *   **The Criticism (Jeff McMahan):** Modern revisionist just war theorists (like Jeff McMahan) argue that Walzer's view is incoherent. They argue that if you are fighting for an unjust cause, you are threatening people who have done nothing wrong. Therefore, you are morally liable to be killed, and the soldier on the just side is *not* liable. They argue Walzer treats soldiers as "mindless tools" of the state to preserve the symmetry.
  *   **Walzer's Defense:** Walzer **does not** say soldiers cannot be blamed. He draws a sharp line between **responsibility for the war** and **responsibility for conduct**.
      *   *Ad Bellum:* Soldiers are generally not responsible for the decision to go to war (that lies with leaders).
      *   *In Bello:* Soldiers **are** fully responsible for war crimes. Walzer explicitly rejects the "Nuremberg Defense" ("I was just following orders"). If a soldier shoots a prisoner or bombs a hospital, Walzer holds them morally and legally culpable, regardless of whether their war was just or unjust.
  *   **The Roommate's Error:** The summary implies that Walzer's separation thesis removes *all* blame from soldiers. It does not. It only removes blame for *starting* the war. The "mindless tools" objection claims Walzer *should* hold them responsible for the war, but Walzer refuses to do so for pragmatic and epistemic reasons (soldiers can't know the truth of statecraft, and they are coerced).

  ### 4. Collective vs. Individual Responsibility
  **Verdict: The Objection Misses Walzer's Nuance**

  Does the "mindless tools" objection miss something? **Yes.**

  The objection assumes that moral responsibility must be purely individual. Walzer's view is rooted in a **collective** understanding of political community.
  *   **The "Dangerous Men" Argument:** Walzer argues that soldiers are "dangerous men" serving a state. Once they put on the uniform, they enter a specific moral relationship with the enemy. This is a functional role.
  *   **Epistemic Limitation:** Walzer argues that individual soldiers cannot reasonably be expected to judge the geopolitical justice of their nation's war. If we required every soldier to determine if their war was just before fighting, no wars could be fought under rules, and chaos would ensue.
  *   **Coercion:** Walzer emphasizes that the state holds a monopoly on force. A soldier who refuses to fight is often imprisoned or executed. Therefore, holding the individual soldier responsible for the *existence* of the war is unfair.

  The "mindless tools" critique (championed by McMahan) rejects this. McMahan argues that "coercion" doesn't make you non-liable if you are objectively threatening innocent people. However, Walzer would argue this ignores the reality of how political communities function and risks making war more brutal by removing the incentive for the "unjust" side to follow rules.

  ### Summary for Your Discussion
  You can tell your roommate:
  1.  **Nail on the head:** You got the **Separation Thesis** and the **Moral Equality of Combatants** right. That is the core of Walzer's view.
  2.  **Miss on Mercenaries:** The idea that mercenaries lose protection while draftees stay innocent is mostly **international law (Geneva)**, not Walzer's core moral philosophy. Walzer treats uniformed soldiers as equals regarding targetability.
  3.  **Miss on Blame:** Walzer **does** believe soldiers can be blamed for war crimes (*in bello*). The separation thesis only protects them from blame for starting the war (*ad bellum*). The "mindless tools" critique is a challenge from revisionist philosophers (like McMahan), not a description of what Walzer actually concludes.
  4.  **The Big Debate:** The real philosophical fight isn't about whether soldiers are "mindless," but whether **liability to be killed** depends on **moral guilt**. Walzer says "No" (for practical reasons); his critics say "Yes" (for moral consistency).

  **Fairness Rating:** 6/10. They understood the headline, but got the fine print and the implications wrong.
