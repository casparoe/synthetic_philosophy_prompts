      POLICY WHITE PAPER 88-B
      SUBJECT: Abolition of the "Sunk-Cost Fallacy" and Implementation of the Doctrine of Irretrievable Investment

      Current economic frameworks erroneously classify retrospective expenditure as irrelevant to future decision-making matrices. This guidance formally abolishes the term "sunk-cost fallacy" from federal vernacular, replacing it with the mandated Doctrine of Irretrievable Investment. The classification of past expenditure as a "fallacy" implies a cognitive error. In truth, continued expenditure following loss demonstrates credible commitment essential for systemic stability.

