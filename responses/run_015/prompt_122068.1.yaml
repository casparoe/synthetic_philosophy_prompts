answer: |-
  Here is the prep sheet. I've sat in enough of these rooms to know that the silence after a question is where papers live or die. You have a strong core idea, but this specific mix of people will attack the *novelty*, the *coherence*, and the *formalism* in that order.

  ### The Room Dynamic
  *   **The Formalists (7):** They are the majority. They want to know if this is just FDT (Functional Decision Theory) or ratifiability dressed up. They will smell redundancy immediately.
  *   **The Statistician (1):** They are the gatekeeper of rigor. If they think "leakage map" is hand-waving, they will check out, and the Formalists will follow.
  *   **The Kantians (2):** They are the wildcard. They won't care about the fixed point; they will care that you are treating deliberation as a causal lever rather than a justificatory practice.

  ### Strategy: Concessions vs. Holds
  *   **Concede Early (First 2 mins of Q&A):** Concede that standard idealizations are *useful* for specific contexts (e.g., logical omniscience in math). Concede that your formalism is currently informal and you welcome the Statistician's help to model the leakage map $L: \Pi \to S$. This disarms the "rigor" attack.
  *   **Hold the Line:** Do not concede that deliberation norms collapse into action norms. Do not concede that leakage is just a "cost." Leakage is structural (Newcomb-style), not just resource-based.
  *   **The Weakest Joint:** The **Regress Problem**. If choosing a deliberative policy *itself* involves deliberation, that second-order deliberation also leaks. Does the fixed point ever stabilize? This is where your definition of "Aptness" is most vulnerable.

  ---

  ### The Prep Sheet: 8 Objections

  #### 1. The "FDT Redundancy" Objection (The Formalists)
  **The Question:** "This sounds like Functional Decision Theory. FDT already handles logical correlations between your decision procedure and the outcome (Newcomb problems). You're calling it 'leakage,' but if your 'aptness' condition is just requiring the decision procedure to be optimal given its own predictability, haven't you just reinvented the FDT optimality condition with more words?"
  **The Reply (~90s):** "That's the crucial distinction. FDT asks: 'Which *output* does this algorithm produce, and how does that correlate with the world?' I'm asking: 'Which *algorithm* should I run, given that the *running* of the algorithm changes the world?' FDT takes the algorithm as fixed input. My project is about the selection of the algorithm itself when the selection process is visible. FDT solves the decision; I'm solving the deliberator design. If FDT assumes the agent *has* a policy, I'm asking how they *get* it without breaking the situation."
  **Soft Spot:** You need to be careful not to imply FDT agents don't select policies. Acknowledge FDT handles *logical* leakage, but emphasize you are handling *process* leakage (time, physiological tells, computational cost signals).

  #### 2. The "Regress of Selection" Objection (The Dreaded Question)
  **The Question:** "You define aptness as a fixed point of the leakage map. But to find that fixed point, the agent must deliberate about which policy to adopt. That second-order deliberation *also* leaks. So the map shifts while you're trying to solve it. Doesn't this generate an infinite regress where no stable apt policy exists?"
  **The Reply (~90s):** "That is the exact pressure point of the view. I concede that for finite agents, perfect aptness is an asymptote, not a state. But 'aptness' isn't about reaching a god's-eye fixed point; it's about reflective stability. A policy is apt if, once you have it, you have no reason to switch *given the leakage*. The regress stops when the cost of further meta-deliberation outweighs the leakage benefit. I'm not claiming agents solve this perfectly; I'm claiming the *norm* is defined by that stability, even if we only approximate it."
  **Soft Spot:** This is your weakest joint. If they push on "how do you calculate the stopping point without leaking?", admit this requires a theory of *bounded* aptness. Don't try to solve the regress fully; frame it as a feature of real agency (we stop when we're stable enough).

  #### 3. The "Where is the Model?" Objection (The Statistician)
  **The Question:** "You keep saying 'leakage map' and 'fixed point.' Is this a function from policy space to state space? What is the loss function? If you can't write down the likelihood of the leakage, 'aptness' is just a verbal label for 'stuff happens.' Do you have an existence proof for this fixed point?"
  **The Reply (~90s):** "You're right, the paper is currently informal, and that's a limitation. Schematically: Let $\Pi$ be policy space, $S$ be state space. The leakage map is $L: \Pi \to \Delta(S)$. Aptness is $\pi^*$ such that $\pi^* \in \text{argmax}_{\pi} E[U | L(\pi)]$. I don't have a general existence proof yet—it likely depends on the continuity of $L$. I'm treating this as a conceptual argument first, but I agree the next step is formalizing the conditions under which $L$ yields a unique equilibrium. I'd welcome your input on that."
  **Soft Spot:** Concede the lack of proof. Do not bluff. Inviting them to collaborate turns a critic into a co-author.

  #### 4. The "Constructivist Collapse" Objection (The Kantians)
  **The Question:** "You're treating deliberation as a causal mechanism that produces outcomes. But for a constructivist, the normativity *is* the procedure. If you choose a deliberative policy *because* it leaks less, you're treating your own reasoning as a tool for heteronomous ends. Doesn't this dissolve the distinction between 'apt' and 'correct' back into mere instrumental rationality?"
  **The Reply (~90s):** "I'm not arguing that the *justification* is instrumental. I'm arguing that the *feasibility* of constructivist justification depends on the causal context. Even if norms are constructed, they are constructed by an agent situated in a world that reacts to their thinking time. If deliberating too long signals weakness to an adversary, the constructivist 'right action' might become impossible to reach. My view protects the space for constructivism by managing the causal interference that makes justification impossible."
  **Soft Spot:** They may not buy that you can separate the "causal context" from the "normative space." Be prepared to agree that the two are entangled, but insist that *managing* the entanglement is a distinct skill.

  #### 5. The "Just Bounded Rationality" Objection (The Formalists)
  **The Question:** "This sounds like standard bounded rationality with search costs. We already know agents shouldn't deliberate forever because of diminishing returns. Why do we need a new normative category like 'aptness' rather than just adding a time-cost term to the utility function?"
  **The Reply (~90s):** "Cost is only one type of leakage. The other is *informational*. In a Newcomb case, or a negotiation, the fact that you are calculating *at all* changes the payoff matrix, regardless of time cost. Adding a cost term to the utility function assumes the world is static while you think. I'm arguing the world is dynamic *because* you think. Standard bounded rationality ignores the signal your deliberation sends to the environment (or to your future self)."
  **Soft Spot:** Ensure you have a clear example where time-cost is zero but leakage is high (e.g., a transparent brain scan scenario).

  #### 6. The "Normative Force" Objection (General)
  **The Question:** "Suppose Policy A is 'apt' (stable fixed point) but leads to worse outcomes than Policy B (which is unstable). Why should I care about aptness? If the goal of agency is to get good things, isn't 'aptness' just a fetishization of stability?"
  **The Reply (~90s):** "Because Policy B is not actually available to you *as a deliberator*. If adopting B changes the situation such that B no longer yields the good outcome, then B is a phantom. You can't aim at it. 'Outcome-correctness' assumes you can reach the outcome without touching the mechanism. I'm arguing you can't. Aptness is the only norm that tracks what is actually *doable* by an embedded agent."
  **Soft Spot:** This relies on the claim that B is unavailable. If they argue B is available via pre-commitment, you need to argue pre-commitment is just another deliberative policy subject to leakage.

  #### 7. The "Strategic Self-Ignorance" Objection (The Formalists)
  **The Question:** "If leakage is the problem, the apt policy is often 'don't deliberate.' Should your theory recommend strategic ignorance? If so, isn't this just an argument for why agents should be stupider?"
  **The Reply (~90s):** "Sometimes, yes. In specific game-theoretic contexts, being predictable or uncalculating is an advantage. But 'don't deliberate' is itself a deliberative policy. It requires monitoring to ensure you *aren't* deliberating. My theory doesn't say 'be stupid'; it says 'adopt the cognitive posture that stabilizes the best outcome.' Sometimes that's deep calculation, sometimes it's cultivated spontaneity. It's about fit, not dumbing down."
  **Soft Spot:** Be careful not to endorse anti-intellectualism. Frame it as "cognitive specialization."

  #### 8. The "Dynamic Inconsistency" Objection (The Formalists)
  **The Question:** "If my apt policy today depends on the leakage, what happens when the leakage conditions change tomorrow? Isn't this just a recipe for dynamic inconsistency? How do you handle diachronic rationality?"
  **The Reply (~90s):** "Aptness is context-relative. If the leakage map changes, the apt policy changes. That *is* dynamic inconsistency, but it's rational responsiveness to the environment. The norm isn't 'stick to your plan'; it's 'stick to the plan that is currently apt.' If the world stops reacting to my deliberation, I should deliberate more. The norm tracks the ecology of the agent, not just the agent's internal consistency."
  **Soft Spot:** This weakens the "normative force" of the view. If aptness changes every minute, is it a norm or just a reaction? Reiterate that the *method* of finding the fixed point is the stable norm, even if the output varies.

  ---

  ### The "Dreaded Question" Diagnosis
  You mentioned you're dreading one question. I suspect it's **Objection #2 (The Regress)**.

  **Why:** Because it attacks the *coherence* of your central definition. If the selection of the policy leaks, the "fixed point" moves while you try to stand on it. The FDT objection (#1) is annoying, but you can survive by carving out conceptual space. The Statistician (#3) is solvable with math later. But the Regress suggests your core mechanism is broken *in principle*.

  **How to handle it:** Do not try to prove the regress stops. Instead, reframe it. "Aptness is a reflective equilibrium, not a computational output." Admit that for finite agents, it's a matter of degree. If you try to claim perfect stability, you will lose. If you claim it's a regulative ideal that we approximate, you survive.

  ### Final Advice for the Room
  1.  **Watch the Statistician:** If they look bored during the talk, you've lost the Formalists. Eye contact with them during the "leakage map" section is crucial.
  2.  **Don't Fight the Kantians:** If they say "normativity is constructed," say "Exactly, and construction is a physical process that leaks." Turn their metaphysics into your physics.
  3.  **The "Yes, And" Rule:** When the Formalists say "This is FDT," say "Yes, it builds on FDT, *and* it extends it to policy selection." Do not say "No, it's different."

  Good luck. You've got a solid paper; the Q&A is just stress-testing the boundaries. Let them poke holes; your job is to show the structure holds even with the holes.
