  As for naturalness, you're assuming there's a view from nowhere where addition is simpler than quus. But simplicity is always simplicity relative to a background language and a set of interests. For the engineers who built the fine-tuned model, quus is the natural function because it satisfies the loss function they specified. For the community using the broken model, addition is the natural function because it satisfies their practical needs. Calling one 'broken' simply means it fails to meet *your* expectations, not that it fails to meet a fact of the matter inherent in the code. I would concede if you could point to a physical state that contains its own interpretation, forcing a unique reading without relying on our communal practices. My reasoning is most vulnerable where our practices become so rigid that the distinction between 'is' and 'ought' collapses for all practical purposes, though I doubt that counts as a fact of the matter in the sense you want.
