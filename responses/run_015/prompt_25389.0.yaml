  The tape gun shrieked, a sharp tear of adhesive that echoed in the empty apartment. Arthur pressed the strip down with the heel of his hand, smoothing the cardboard seam. Box forty-two. He stood up and wiped dust from his palms onto his jeans. The room was mostly bare now, just ghosts of pictures on the walls and rectangles of cleaner carpet where rugs had lain for years.

  He walked to the center of the living room, where a single armchair remained. He sat, looking at the stack of boxes by the door. They were labeled in his own handwriting: *Kitchen*, *Books*, *Winter Clothes*. Labels that implied a continuity. They suggested that the person who packed the knives was the same person who would unpack them in the new place.

  Arthur reached into his pocket and pulled out a keychain he'd found under the sofa cushion. It held a gym membership card for a club that had closed three years ago. He turned it over in his fingers. The plastic was worn smooth. He remembered buying the membership. He remembered the optimism of it, the specific future version of himself who would go there every morning at six. That version of Arthur never arrived. But for two years, he had carried the card, paying the dues, maintaining the fiction.

  He tossed the keychain into the trash bin by the door. It landed with a hollow clink.

  He stood and walked to the bookshelf, now stripped bare except for a single row of hardcovers he couldn't bring himself to box yet. Biographies, mostly. Lives written by other people. He pulled one down at random. Inside the cover, an inscription: *To Arthur, may you find your true north. Love, E.* dated five years ago.

  He traced the ink. He remembered receiving the book. He remembered feeling grateful. But looking at the name *Arthur*, it felt like reading about a character in a novel. He tried to summon the feeling of being that man, the one who received the book, but the emotional resonance was gone. There was only the memory of the event, like a scene he had watched on a screen.

  He carried the book to the box labeled *Keep*. He hovered over it. If he packed it, he was agreeing to carry that version of himself forward. He was validating the narrative that this book mattered to who he was.

  Arthur looked around the room. The light was shifting, late afternoon sun stretching long shadows across the floor. He realized he was waiting for something. He was waiting for the feeling of *I* to solidify, for the central commander to step forward and issue the order: *Pack the book. Leave the book.*

  But there was no commander. There was only the habit of packing. There was the weight of the book in his hand, the dust motes dancing in the light, the ache in his lower back. There was the story he told himself about being a person who keeps gifts, and the competing story about being a person who sheds weight.

  He closed his eyes. He thought about the argument he'd had with Elena last week. The way he had rehearsed his points in the shower, constructing a version of himself that was wronged, reasonable, solid. Then, in the room with her, the words had tumbled out differently, and he had become someone else—petty, defensive. Afterwards, lying in bed, he had tried to stitch them back together, to find the real Arthur who existed beneath the矛盾.

  Now, standing in the empty room, he understood there was no one beneath. There was only the stitching.

  He opened his eyes. The room didn't feel haunted anymore. It felt quiet. The weight in his hand was just paper and glue. The guilt about the gym card was just a chemical echo. The identity he was protecting was not a jewel hidden in a box; it was the box itself. It was the arrangement of things.

  He placed the book in the trash bin on top of the keychain.

  He went to the stack of boxes and picked up the one labeled *Books*. It was heavy, unbalanced. The weight shifted to the left as he lifted it, threatening to tear the bottom. He set it down and opened the flaps. He moved a heavy art book from the left side to the center. He shifted a cluster of paperbacks to the right. He wasn't changing the total weight of the box. The mass was identical. But by rearranging the contents, he changed where the pull was felt. He changed the center of gravity.

  He lifted the box again. It was stable. It held together.

  Arthur smiled, a small, private expression. He could rearrange the contents. He didn't have to carry the art book just because he used to love art. He didn't have to be the man who kept the gym card. He could move the heavy things to the center where they wouldn't tip him over, or he could leave them behind entirely.

  He picked up the tape gun. The roll was nearly empty. He sealed the box, three sharp tears of sound. He wrote a new label on the side with a black marker. He didn't write *Books*. He wrote *Next*.

  He picked up the box. It was heavy, but the balance was good. He walked toward the door, stepping over the shadow of the armchair. He didn't look back at the empty room. There was no one there to leave behind. He stepped into the hallway, the weight of the box settling comfortably against his hip, and walked toward the stairs.
