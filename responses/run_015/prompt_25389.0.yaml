      *   *Idea 2:* Someone cleaning out a deceased relative's house, sorting through photos and letters, realizing the "person" is just the sum of these artifacts. (Good, but maybe too passive).
      *   *Idea 3:* A person recovering from memory loss or brain injury. (Too medical/clinical).
      *   *Idea 4:* Someone writing a memoir or biography. (Too meta).
      *   *Idea 5:* A mundane moment of disruption. A commute, a routine task where the autopilot fails, and the character sees the threads of their identity weaving themselves.
      *   *Idea 6:* An archivist or restorer. Someone whose job is to piece together fragments.

