  # HANDOUT: THE BOUNDARY PROBLEM DIAGNOSTIC
  **Seminar:** Democratic Theory | **Case:** The Estuary Authority

  ### I. THE CASE
  The **Estuary Authority** governs flood control and water allocation across a river delta. Its decisions bind **resident citizens** of the delta districts. Consider the following groups when answering the questions below:
  *   **Long-term non-citizen residents:** Lived/worked there 15 years; no route to citizenship.
  *   **Upstream farmers:** Neighboring province; irrigation cut off by Authority decisions.
  *   **Downstream city:** Another country; absorbs surge when spillways open.
  *   **Resident children:** Under sixteen years old.
  *   **Potential movers:** Would move into the delta *only if* the Authority builds a new levee.
  *   **Future residents:** Born fifty years from now; affected by groundwater options.
  *   **Seceding district:** Petitioned to leave the Authority's jurisdiction.
  *   **One-week traveller:** Inside the territory temporarily; subject to laws while there.

  ### II. THE DECISION PATH
  *Instructions: Read each claim below. Mark **AGREE** or **DISAGREE**. Do not skip questions. Your pattern of answers will locate your doctrinal position at the end.*

  1.  **Coercion:** The one-week traveller should vote on flood control because she is fined if she breaks local laws, even though the decision barely changes her trip.
  2.  **Affectedness:** The downstream foreign city should vote because their streets flood, even though the Authority owes them no legal duty.
  3.  **Threshold:** Upstream farmers should vote only if their crop loss exceeds 50%, not for minor reductions.
  4.  **Future People:** People born in 50 years should have representatives now if groundwater use harms them.
  5.  **Endogenous Stakes:** People who will move here *only if* the levee is built should vote on the levee.
  6.  **Agency:** Resident children under 16 should vote if they understand the issue, even if the law says no.
  7.  **Boundary Stability:** The seceding district should vote on leaving using the same rules as voting on flood control.
  8.  **Self-Determination:** Current citizen residents should decide whether long-term non-citizens get to vote.
  9.  **Justification:** We include voters because excluding them is unjust, not because it makes flood control work better.
  10. **Grounds:** Long-term non-citizens should vote primarily because leaving is too costly, not because exclusion wrongs them.

  ### III. RESULTS: DOCTRINAL LEAVES
  *Match your answer pattern to the leaf below. Read the "Awkward Commitment" to test your consistency.*

  | Leaf | Doctrine | Typical Answer Pattern (Q1–Q10) | Most Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **A** | **All Subjected** | Yes, No, -, -, -, -, -, -, -, - | Must grant votes to the one-week traveller while denying them to the downstream flood victims. |
  | **B** | **All Affected** | No, Yes, No, -, -, -, -, -, -, - | Must grant votes to the downstream foreign city regardless of whether they share any legal bond with the Authority. |
  | **C** | **All Affected Interests** | No, Yes, Yes, -, -, -, -, -, -, - | Must administer complex audits to determine if an upstream farmer's losses cross the significance threshold before allowing them to vote. |
  | **D** | **Future Inclusion** | -, -, -, Yes, -, -, -, -, -, - | Must reserve seats in the current assembly for people who do not yet exist, complicating the idea of an actual meeting. |
  | **E** | **Competence/Epistemic** | -, -, -, -, -, Yes, -, -, No, - | Must disenfranchise resident adults who cannot understand the technical details of flood control, regardless of their stake. |
  | **F** | **Citizenism** | No, No, -, -, -, No, -, Yes, -, - | Must deny votes to long-term non-citizen residents who have lived there for fifteen years and pay taxes. |
  | **G** | **Captive Constituency** | -, -, -, -, -, -, -, -, Yes, Yes | Must grant votes to non-citizens solely because exit is costly, even if they are unaffected by the specific decision. |
  | **H** | **Relational Test** | -, -, -, -, -, -, -, -, Yes, No | Must grant votes to anyone excluded in a way that damages the reciprocal relationship, even if their inclusion changes no outcome. |
  | **I** | **Variable Boundary** | -, -, -, -, -, -, No, -, -, - | Must redraw the voter list for every single decision, meaning the "demos" for flood control differs from the "demos" for secession. |
  | **J** | **Unnamed (Self-Enrollment)** | -, -, -, -, -, -, -, No, No, - | Allows the current demos to exclude long-term residents arbitrarily, risking a regress where membership is purely discretionary. |

  *(Note: "-" indicates the answer does not determine this leaf; focus on the key differentiators.)*

  ***

  # TA NOTE: RUNNING THE SESSION & ANALYSIS

  ### Running the Sort
  1.  **Distribution:** Hand out the sheet at the start of class. Give students 5 minutes to answer the 10 claims privately.
  2.  **Sorting:** Ask students to find their Leaf (A–J) based on their pattern. If a student's pattern doesn't fit perfectly, have them choose the leaf where they felt the most resistance to the "Awkward Commitment."
  3.  **Discussion:** Group students by Leaf. Ask each group to defend their "Awkward Commitment." If they reject the commitment, ask which question they would change to escape the leaf.
  4.  **Convergence:** Highlight where different leaves produce the same result for the core citizens but diverge on the margins (e.g., Traveller vs. Downstream City).

  ### Analysis of Proposed Principles
  You asked for an honest placement of the **Captive-Constituency Principle** and the **Relational Test**.

  *   **Captive-Constituency Principle:** This occupies **Leaf G**. It does not collapse into "All Subjected" (Leaf A) because the ground is *exit cost*, not *coercion*. A person could be subject to coercion (like the traveller) but have low exit costs, or have high exit costs (like the non-citizen) without being coerced by the specific decision. The cell is currently **unoccupied** in standard surveys because it is often conflated with residency requirements, but it is theoretically distinct: it justifies inclusion via *necessity* rather than *causality* or *law*.
  *   **Relational Test:** This occupies **Leaf H**. It risks collapsing into **All Affected (Leaf B)** if "wronging" is defined simply as "harming an interest." However, if "wronging" is defined as a procedural disrespect independent of outcome impact, it remains distinct. The cell is **unattractive** to many because it severs the link between voting and influencing outcomes, potentially granting votes to those whose inclusion changes nothing.

  ### Limitations & Tie-Breakers
  *   **Indistinguishable Leaves:** The tree cannot cleanly separate **All Subjected (Leaf A)** and **All Affected (Leaf B)** in cases where coercion and affectedness overlap (e.g., a resident citizen). They only come apart on the **One-Week Traveller** (Coerced, minimally affected) vs. **Downstream City** (Affected, not coerced).
      *   *Tie-Breaker Question:* "If the downstream city could build its own flood walls at low cost, should they still vote?" (Yes = Affected; No = Subjected/Relational).
  *   **Instrumental vs. Right:** Question 9 forces a split between epistemic/competence views (Leaf E) and rights-based views (Leaves G, H). Students often want both; force them to choose which ground *justifies* the other.
  *   **Empty Cells:** Leaf J (Self-Enrollment) is largely **unexplored** in normative theory because it invites circularity, but it descriptively matches many existing citizenship regimes. Leaf I (Variable Boundary) is **unstable**; maintaining different voter rolls for every issue is administratively prohibitive, which is why it remains theoretical.
