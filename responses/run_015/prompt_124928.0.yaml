      *   *Question 1: Setting the Stage (Genre Distinction).* Need to address the *Guide* vs. *Mishneh Torah* split immediately.
          *   *Draft:* You say *Guide* is rhetorical and *Mishneh Torah* is real. Why?
          *   *Refinement:* Focus on the "two books" problem. How does genre dictate truth value?
          *   *Likely Answer:* *Guide* is for elites/polemic; *Mishneh Torah* is law/practice.
          *   *Follow-up:* Does this create a "noble lie" problem?

      *   *Question 2: The "Divine Intent" Claim (Required).* Maimonides says God *wanted* prayer only.
