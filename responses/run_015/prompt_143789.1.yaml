      *   Pattern continuity: Not required for *informational* patterns, but required for *causal* continuity.
      *   Hofstadter specifically argues *against* needing specific meat, but *for* needing high-fidelity pattern replication.

  6.  **Refining the Tone:**
      *   Needs to be analytical but accessible (for a roommate debate).
      *   Needs to validate the user's suspicion (poetry vs. physics) while acknowledging where Hofstadter actually goes (he *does* believe in partial survival, just not the way the roommate thinks).
