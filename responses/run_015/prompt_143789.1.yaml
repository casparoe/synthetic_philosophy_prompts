      *   **Roommate's Claim:** We are "strange loops." If the user's sister inherits journals and finishes projects, she literally becomes part of the user (literal persistence of self across people).
      *   **User's Skepticism:** Suspects the roommate is conflating different claims, reading poetry as physics, and smushing metaphors with literal ontology.
      *   **Task:** Lay out the precise theses hidden behind the slogan "I can be distributed across brains."
      *   **Specific Requirements:**
