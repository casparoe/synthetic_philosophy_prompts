      *   *Narrative/Social:* Defensible (Dennett), but clearly metaphorical regarding survival.
      *   *Strong Substrate Independence:* False (currently), requires perfect copy which journals don't provide.
      *   *Roommate's Specific Claim (Sister finishing projects = literal part of you):* This is the crux. It's likely False as *literal identity*, but Defensible as *causal continuation*.

  5.  **Addressing Physical Continuity:**
