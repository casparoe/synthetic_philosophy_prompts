answer: |-
  ### Brainstorming the Mapping
  Before constructing the table, I need to interrogate what work the "Tinder/Spark" image is actually doing. It's a thermodynamic model of history: it assumes potential energy (grievances) converts inevitably into kinetic energy (violence/regime change) once an activation energy threshold is crossed.

  *   *The Trap:* If I accept the mapping, I accept the physics. In physics, sparks are interchangeable units of heat. In history, agents are unique bundles of ideology, charisma, and decision-making.
  *   *The Goal:* I need to see if the analogy forces us to treat the outcome ("The Fire") as a monolith. If "The Fire" just means "Right-Wing Rule," the structuralists win. If "The Fire" means "The Third Reich specifically (Holocaust, Total War)," the analogy might break because different sparks burn different fuels.
  *   *The "Ignition Temperature" Check:* This is the critical point. The analogy assumes a threshold exists where *any* spark suffices. I need to test if political radicalization has a "temperature" or if it requires a specific *catalyst* that changes the chemical composition of the reaction, not just the start time.

  ***

  ### The Correspondence Table

  | Element | Analogy Role | Historical Referent | Function in Argument |
  | :--- | :--- | :--- | :--- |
  | **Tinder** | Fuel Load | Versailles, Hyperinflation, Depression, Latent Antisemitism | Provides the *potential* for upheaval; determines susceptibility. |
  | **Spark** | Ignition Source | Hitler's Agency (Oratory, Maneuvering, 1933 Chancellorship) | The variable trigger; claimed to be interchangeable by structuralists. |
  | **Fire** | Combustion Event | The Nazi Regime (WWII, Holocaust) | The outcome; ambiguous whether this means "Authoritarianism" or "Specific Nazism." |
  | **Wind** | Accelerant | International Appeasement, Soviet Pact, Weakness of Neighbors | Explains the *spread* and *intensity* beyond borders. |
  | **Arsonist** | Facilitator | Conservative Elites (Papen, Hindenburg, Industry) | Those who handed the spark to the tinder, thinking they could control the burn. |
  | **Firebreak** | Containment | Weimar Constitution, Judiciary, Reichswehr | The failed safeguards that might have stopped the spread. |

  ***

  ### Where the Mapping Breaks

  The analogy holds water only if you treat history like thermodynamics. It breaks in three specific places that matter for your segment:

  1.  **Homogeneity of Fuel:** Tinder is uniform; Weimar Germany was not. A spark in Bavaria might not ignite Prussia. A different leader (e.g., Gregor Strasser or Ernst Röhm) might have ignited the *party* but failed to ignite the *state*, resulting in a contained insurrection rather than a state capture.
  2.  **Interchangeability of Sparks:** A match and a lightning strike both create fire, but they start in different places with different intensities. Hitler wasn't just heat; he was a specific ideological vector. A military dictatorship under Schleicher would have been authoritarian and revisionist, but it lacked the *apocalyptic* racial ideology that drove the specific resource allocation of the Holocaust.
  3.  **The Nature of the Fire:** In physics, fire is just oxidation. In history, the "Fire" is a political program. If the outcome is defined loosely as "Right-Wing Dictatorship," the analogy holds. If the outcome is defined specifically as "Industrialized Genocide and Total War," the analogy fails because different sparks produce different combustion products.

  ### The "Ignition Temperature" Assumption
  You asked to check whether the assumption that "identity of the spark looks irrelevant once the tinder is dry enough" is smuggling in the conclusion. **It is.**

  This assumption presupposes that there is a fixed threshold of "German Grievance" that *must* result in "Nazi Outcome." It treats the Holocaust as a phase transition (like water boiling) rather than a series of contingent decisions. By assuming the tinder *demands* a fire, the analogy rules out the possibility that the tinder could have rotted away, been wetted by policy, or burned in a controlled, non-catastrophic way. It defines the structural conditions as *sufficient* causes rather than *necessary* conditions, which is the very point under dispute.

  ### Kind-Shifting vs. Timing-Shifting
  This distinction does heavy lifting that the fire analogy cannot.

  *   **Timing-Shifting:** Removing Hitler delays the fire. (Structuralist view: The DNVP or Military eventually take over, war happens later).
  *   **Kind-Shifting:** Removing Hitler changes the chemical composition of the fire. (Intentionalist view: You get an authoritarian regime, but not a genocidal one).

  The Tinder/Spark analogy collapses these into one. It assumes the only variable is *when* the fire starts. But if Hitler was a **catalyst** rather than a **spark**, his removal changes the *product* of the reaction, not just the speed.

  Applied to the hardest case (The Holocaust):
  If you run the counterfactual "No Hitler," do you get the Holocaust?
  *   **Structuralist (Timing):** Yes, eventually. Antisemitism was too widespread.
  *   **Philosopher of History (Kind):** No. State-sponsored antisemitism was common in Europe (Poland, Romania, Hungary). *Industrialized extermination* was not. That required a specific convergence of ideological fixation and bureaucratic will that Hitler uniquely enforced against competing pragmatic interests (like the Army or Economics Ministry).
  *   **Verdict:** The "some kind of Nazism anyway" conclusion survives only if you dilute "Nazism" to mean "Authoritarian Nationalism." If you mean the specific historical phenomenon of the Third Reich, the conclusion fails. The analogy was carrying that conclusion by obscuring the specificity of the outcome.

  ### Is There a Better Analogy?
  No single picture carries this, because history is not a physical system. However, a **Chemical Catalyst** analogy is superior to Fire.
  *   *Reagents:* The structural conditions (Depression, Antisemitism).
  *   *Catalyst:* Hitler.
  *   *Reaction:* The Regime.
  *   *Why it works:* In chemistry, you can have all the reagents mixed together, but without the specific catalyst, the reaction either doesn't happen or produces a different precipitate. This allows for the "Kind-Shift." It acknowledges the conditions were necessary, but denies they were sufficient without the specific agent.

  ### The Radio Sentence
  "Germany was primed for authoritarianism, but without Hitler, you get a different tyrant, a different war, and almost certainly no Holocaust."
