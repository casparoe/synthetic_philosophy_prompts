answer: |-
  ### Pre-Computation: Failure Modes and Steelmanning

  Before writing the procedure, I need to clear the debris from previous attempts at this kind of work. I have advised procurement boards before; the failure modes are rarely philosophical, they are operational.

  **1. The "Point Estimate" Trap.**
  *Naive Move:* Assigning a specific number to "suffering per kg of chicken" and multiplying.
  *Why it fails:* You don't have that number. Neither does anyone else. The range of plausible values for the moral weight of a fish versus a cow spans orders of magnitude. If you bake a median estimate into the form, you hide the uncertainty.
  *Fix:* The procedure must use **ordinal rankings** (Low/Medium/High) and **dominance checks**. A proposal only passes if it looks good across the *range* of plausible models, not just the median.

  **2. The "Marginal Unit" Illusion.**
  *Naive Move:* Assuming that reducing purchase order volume by 5% reduces production by 5%.
  *Why it fails:* As you noted, purchasing is lumpy. Distributors aggregate demand. If you drop below a contract tier, the impact is non-linear. If you stay above it, the distributor may simply reallocate your volume to a hospital or K-12 client, meaning production stays constant while you lose revenue leverage.
  *Fix:* A specific "Supply Chain Reality" gate that requires distributor confirmation, not internal math.

  **3. The "Idealized Baseline" Error.**
  *Naive Move:* Comparing the new menu against a theoretical vegan optimum.
  *Why it fails:* You are comparing Option A against Option B (Status Quo). If Option B is rejected by students and they buy fast food off-campus, the net impact might be negative.
  *Fix:* The baseline is always the *current specific dish* being replaced, and the procedure must account for *leakage* (students leaving the system).

  **4. The "Value Judgment as Fact" Sneak.**
  *Naive Move:* The procedure concludes "This is better" when it actually means "This is better *if* you care more about land use than individual count."
  *Why it fails:* This usurps the Board's authority. Your staff cannot decide whether wild field mice deaths count equally to farmed steer deaths.
  *Fix:* The procedure must stop at "Trade-off Identified" and hand off to you or the Board for the weighting.

  **5. Steelmanning the "Local/Pasture" View.**
  *You are tempted to dismiss the Faculty Committee's push for local grass-fed beef as purely aesthetic.*
  *Steelman:* There is a coherent argument that industrial grain monocultures destroy soil carbon and wild habitat more than well-managed pasture, and that local supply chains are more resilient to disruption.
  *Rejection:* While resilience is valid, your mandate specifically includes "animal footprint." Grass-fed beef requires significantly more land per calorie than grain-fed or plant options. Under a "land-sparing" framework (minimizing total land use to spare wild habitat), grass-fed beef is almost always inferior. The procedure must test for land efficiency, not just "food miles."

  **6. Steelmanning the "Seafood Compromise."**
  *You are tempted to view fish as a neutral middle ground.*
  *Steelman:* Wild-caught fish do not require feed crops (sparing field animals) and do not require land (sparing terrestrial habitat).
  *Rejection:* Wild capture involves direct killing of the target plus bycatch (non-target species) and gear loss (ghost fishing). The uncertainty regarding fish sentience and the sheer volume of bycatch makes this a high-variance option. It cannot be treated as a default "win."

  ***

  ### The Procurement Ethics Decision Procedure (PEDP)

  **User:** Menu Coordinator (BA Nutrition).
  **Time Budget:** 15 Minutes per candidate change.
  **Output:** A one-page form with checked boxes. If any "STOP" gate is triggered, the proposal is rejected or escalated.

  #### Phase 1: Compliance and Baseline
  *Goal: Ensure the proposal is legally and operationally viable before assessing ethics.*

  **1.1. Constraint Check.**
  *   **Question:** Does this menu item meet the hard cost ceiling, federal nutrition standards (protein/iron), and all accommodation obligations (Halal/Kosher/Medical) without requiring a separate supply chain?
  *   **Data Source:** Nutrition software, Invoice cost sheet.
  *   **Pass:** Yes to all.
  *   **Fail:** No to any. **STOP. Reject Proposal.**

  **1.2. Baseline Definition.**
  *   **Question:** What specific existing menu item is this replacing? (Must be a 1:1 swap in the cycle).
  *   **Data Source:** Current Menu Cycle.
  *   **Requirement:** Write the SKU or Item Name of the *current* item.
  *   **Note:** If this is a new addition without removal, the baseline is "Zero." This usually fails cost constraints unless funded by a donor (see Proposal 2).

  #### Phase 2: Supply Chain Reality (The Lumpiness Gate)
  *Goal: Determine if the change actually affects production or just shuffles inventory.*

  **2.1. Contract Tier Check.**
  *   **Question:** Does the proposed volume change move our total annual category purchase (e.g., "Poultry" or "Beef") across a contract tier threshold with the distributor?
  *   **Data Source:** Distributor Contract Spec Sheet.
  *   **Factual Question.**
  *   **Pass:** Yes, it crosses a threshold (up or down).
  *   **Fail:** No, it stays within the same tier.
  *   **Action if Fail:** Proceed to 2.2.

  **2.2. Distributor Marginal Impact.**
  *   **Question:** If we do not cross a threshold, has the distributor confirmed in writing that this specific volume reduction will result in a reduction in their orders to the producer, rather than reallocation to another client?
  *   **Data Source:** Email/Memo from Distributor Account Manager.
  *   **Factual Question.**
  *   **Pass:** Written confirmation of production reduction.
  *   **Fail:** No response, or confirmation of reallocation.
  *   **Gate:** **STOP.** If the change does not alter production, it has no ethical impact on the supply chain. Mark as "Cosmetic Change Only." Do not market as ethical.

  #### Phase 3: Acceptance and Leakage (The Student Behavior Gate)
  *Goal: Ensure the food is eaten, not wasted or replaced off-campus.*

  **3.1. Palatability Proxy.**
  *   **Question:** Is there evidence from a pilot, taste test, or historical data that student acceptance of this protein/source is within 10% of the baseline item?
  *   **Data Source:** Waste audits, Student Gov survey, Pilot test logs.
  *   **Factual Question.**
  *   **Pass:** Acceptance is within range.
  *   **Fail:** Acceptance is significantly lower, or no data exists.
  *   **Action if Fail:** **STOP.** Require a pilot period. You cannot assess ethics of a meal that ends up in the trash or drives students to off-campus fast food.

  **3.2. Waste Audit Projection.**
  *   **Question:** Based on the texture/cooking profile, is plate waste likely to increase? (e.g., swapping boneless for bone-in, or firm tofu for ground meat).
  *   **Data Source:** Coordinator Judgment (based on past similar swaps).
  *   **Factual/Judgment.**
  *   **Pass:** Waste projected stable or lower.
  *   **Fail:** Waste projected higher.
  *   **Gate:** **STOP.** Higher waste negates supply chain gains.

  #### Phase 4: Impact Buckets (The Trade-off Matrix)
  *Goal: Map the impacts without weighing them. The Coordinator fills in the direction of change, not the moral value.*

  *Instructions: Compare the **Proposed Item** against the **Baseline Item** (from 1.2). Mark each row as **Increase**, **Decrease**, or **Uncertain**.*

  **4.1. Farmed Animals (Count & Welfare).**
  *   **Metric:** Number of individual animals slaughtered per serving.
  *   **Note:** Remember chicken/shrimp count is high; cow count is low.
  *   **Input:** [Increase / Decrease / Uncertain]

  **4.2. Crop Collateral.**
  *   **Metric:** Volume of row crops (corn/soy/grain) required to produce the item.
  *   **Note:** Plant proteins have crop footprints. Grain-fed meat has *more* crop footprint. Pasture-fed meat has *less* crop footprint but more land.
  *   **Input:** [Increase / Decrease / Uncertain]

  **4.3. Land Use & Wild Habitat.**
  *   **Metric:** Total hectares required per serving (including grazing land and crop land).
  *   **Note:** This proxies for wild animal displacement/habitat loss.
  *   **Input:** [Increase / Decrease / Uncertain]

  **4.4. Wild Capture (If applicable).**
  *   **Metric:** Bycatch ratio and gear loss risk.
  *   **Note:** Only fill if item is wild-caught seafood. If farmed, mark "N/A".
  *   **Input:** [Increase / Decrease / Uncertain / N/A]

  #### Phase 5: Robustness and Values Handoff
  *Goal: Determine if the decision can be made procedurally or requires moral weighting.*

  **5.1. Dominance Check.**
  *   **Question:** Does the Proposed Item show a **Decrease** in *all* four buckets (4.1 through 4.4) compared to Baseline?
  *   **Pass:** Yes. **APPROVE.** (This is a rare "no-brainer").
  *   **Fail:** No. (There is at least one Increase). Proceed to 5.2.

  **5.2. Conflict Identification.**
  *   **Question:** Which buckets show an **Increase**?
  *   **Action:** Check the box for each conflicting bucket (e.g., "Decreases Land Use" but "Increases Farmed Animal Count").
  *   **Gate:** **ESCALATE TO DIRECTOR.**
  *   **Reason:** This is a Values Question. The procedure cannot resolve trade-offs between wild habitat and farmed individuals.

  **5.3. Deep Uncertainty Check.**
  *   **Question:** For any bucket marked "Uncertain," is there a plausible model where the impact is significantly negative?
  *   **Input:** [Yes / No]
  *   **Gate:** If **Yes**, **ESCALATE TO DIRECTOR.** Do not assume the middle ground.
  *   **Reason:** Robustness requirement. If a change relies on a contested empirical claim (e.g., "fish don't feel pain"), it cannot be approved by staff.

  ***

  ### Running the Procedure on Live Proposals

  Here is how the procedure processes your three specific scenarios.

  #### Proposal 1: Ground Beef → Chicken Thigh (High Volume Entrees)
  *The Student Government "Obvious Win"*

  *   **Phase 1 (Compliance):** Pass. Cost and nutrition align.
  *   **Phase 2 (Lumpiness):**
      *   *Check:* Does this drop beef purchases below a contract tier? Likely No.
      *   *Check:* Does this increase chicken purchases above a tier? Maybe.
      *   *Distributor Query:* If the distributor says "We'll just sell the beef elsewhere," **STOP.**
      *   *Assumption for run-through:* Let's assume the volume is high enough to trigger a contract adjustment. **Pass.**
  *   **Phase 3 (Acceptance):**
      *   *Check:* Chicken thigh is generally high acceptance. **Pass.**
  *   **Phase 4 (Impact Buckets):**
      *   *4.1 Farmed Count:* **Increase.** (Many chickens vs. few cows).
      *   *4.2 Crop Collateral:* **Increase.** (Chickens eat grain; beef was likely finished on grain or grass, but chicken is strictly grain-dependent).
      *   *4.3 Land Use:* **Decrease.** (Chicken is land-efficient).
      *   *4.4 Wild Capture:* **N/A.**
  *   **Phase 5 (Robustness):**
      *   *Dominance:* Fail. (Count and Crops Increase, Land Decreases).
      *   *Conflict:* **ESCALATE TO DIRECTOR.**
      *   *Reasoning:* You are trading fewer wild animals (via land sparing) for more farmed animals and more crop deaths. The EA blogs argue about this endlessly. Your staff cannot solve it.
      *   *Outcome:* **Handoff.** You must decide if "Land Sparing" outweighs "Individual Count."

  #### Proposal 2: Donor-Funded Weekly Grass-Fed Local Beef Burger
  *The Faculty Committee "Ethical Option"*

  *   **Phase 1 (Compliance):** Pass (Donor covers cost premium).
  *   **Phase 2 (Lumpiness):**
      *   *Check:* Local sourcing often bypasses the broadline distributor.
      *   *Gate:* If this bypasses the central contract, does it violate the "single distributor" constraint? If yes, **STOP.**
      *   *Assumption:* Exception granted for donor funds. **Pass.**
  *   **Phase 3 (Acceptance):** **Pass.** Burgers are high acceptance.
  *   **Phase 4 (Impact Buckets):**
      *   *4.1 Farmed Count:* **Neutral/Decrease.** (One cow either way).
      *   *4.2 Crop Collateral:* **Decrease.** (Grass-fed requires less grain).
      *   *4.3 Land Use:* **Significant Increase.** (Pasture requires vastly more hectares than feedlot or crops).
      *   *4.4 Wild Capture:* **N/A.**
  *   **Phase 5 (Robustness):**
      *   *Dominance:* Fail. (Land Use Increases significantly).
      *   *Conflict:* **ESCALATE TO DIRECTOR.**
      *   *Critical Note:* However, look at the "Deep Uncertainty Check." Is there a plausible model where increased land use is *good*? Only if you value "local economic resilience" or "soil carbon" over "wild animal habitat."
      *   *Outcome:* **Likely Reject.** Under your mandate ("reduce animal footprint" + "sustainability"), the Land Use spike is the killer. Unless the Board explicitly values "Local" over "Land Efficiency," this fails the robustness check because the land use penalty is orders of magnitude, not marginal.
      *   *Why you won't like this:* The Faculty Committee will call this a betrayal of "sustainability." You have to tell them that "sustainability" in terms of land use forbids grass-fed beef at this scale.

  #### Proposal 3: Default Hot Line → Fish/Shrimp (2 Days/Week)
  *The "Compromise"*

  *   **Phase 1 (Compliance):** Pass.
  *   **Phase 2 (Lumpiness):** **Pass** (Assuming contract adjustment).
  *   **Phase 3 (Acceptance):**
      *   *Check:* Fish is often lower acceptance than meat/chicken in institutional settings. High risk of waste.
      *   *Gate:* **STOP** unless pilot data proves otherwise. (Let's assume pilot passed for this exercise).
  *   **Phase 4 (Impact Buckets):**
      *   *4.1 Farmed Count:* **Uncertain.** (Wild catch doesn't count as "farmed," but bycatch does).
      *   *4.2 Crop Collateral:* **Decrease.** (Wild fish need no feed crops).
      *   *4.3 Land Use:* **Decrease.** (Ocean doesn't count as terrestrial land use, usually).
      *   *4.4 Wild Capture:* **Significant Increase.** (Direct killing + Bycatch).
  *   **Phase 5 (Robustness):**
      *   *Dominance:* Fail.
      *   *Conflict:* **ESCALATE TO DIRECTOR.**
      *   *Reasoning:* This trades Crop/Land impacts for Direct Wild Killing.
      *   *Deep Uncertainty:* The moral status of wild fish and bycatch species is highly contested.
      *   *Outcome:* **Handoff.** This is the riskiest proposal ethically because it relies on the assumption that "Wild Death" is less morally weighty than "Farmed Death" or "Crop Death." That is a value judgment, not a fact.

  ***

  ### Limitations and Empirical Sensitivities

  This procedure is robust, but it is not magic. It will systematically misfire in three areas, and you need to know where to spend your measurement budget.

  **1. Where the Procedure Misfires:**
  *   **The "Small Number" Problem:** If a change affects fewer than 1,000 meals a year, the lumpiness gate will almost always kill it. The procedure is designed for systemic changes, not niche accommodations. It will tell you "No Impact" on small specials, which is technically true but frustrating for stakeholders wanting *some* action.
  *   **The "Innovation" Blind Spot:** If a new protein source emerges (e.g., fermentation-derived), Phase 4 will mark everything "Uncertain," causing automatic escalation. The procedure favors known quantities over innovation.
  *   **The "Values" Bottleneck:** Because I have forced all trade-offs to your desk (Phase 5), you will become the bottleneck. If you get three proposals a week that all escalate, you need a "Standing Order" from the Board that pre-weights the buckets (e.g., "Land Use counts double"). Without that, you will drown in handoffs.

  **2. Empirical Sensitivities (Where to Measure):**
  Do not guess at these. Send your analyst to get these three numbers from your invoices and distributor specs. The entire ethical calculus hinges on them:

  *   **A. The Contract Elasticity Coefficient:** Ask your distributor: "If we reduce category volume by X%, by what percentage do you reduce your purchase from the producer?" If the answer is "Zero," stop all menu changes aimed at supply reduction. You are just losing margin.
  *   **B. The Plate Waste Differential:** Measure the waste of the *current* high-volume item vs. the *proposed* item. If the new item has 15% higher waste, it cancels out almost any supply chain gain. This is the easiest number to get (weigh the trash) and the most ignored.
  *   **C. The Land-Use Ratio:** For any beef proposal, get the specific hectares-per-pound figure from the supplier. "Grass-fed" can vary from 5x to 20x the land use of grain-fed. Knowing which end of that spectrum your supplier is on determines whether Proposal 2 is merely bad or catastrophic.

  **Final Advice:**
  Proposal 2 (Local Grass-Fed) is the one that will come back with an answer you won't like. It fails on Land Use efficiency, which is the most robust metric you have. Proposal 1 (Chicken) is the standard move, but under this procedure, it exposes the trade-off between individual count and land use, forcing you to own the decision rather than hiding behind "science." Proposal 3 (Fish) is the wildcard that depends entirely on how you value wild animal suffering.

  Use the procedure to show the Board that "Ethics" is not a single dimension. If they want you to choose, they must tell you which bucket matters most.
