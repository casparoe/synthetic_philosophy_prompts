  2.  **Brainstorming & Pre-computation (The "Think Carefully" Phase):**
      *   *Naive Failure 1: Point Estimates.* Using a single number for "CO2 per kg" or "mice per hectare." *Fix:* Use ranges or ordinal rankings (Low/Med/High) based on robustness.
      *   *Naive Failure 2: Marginal vs. Average.* Assuming every kg saved = one kg not produced. *Fix:* The "Lumpiness" gate. Check contract tiers and distributor behavior.
      *   *Naive Failure 3: Idealized Baselines.* Comparing against "perfect veganism" instead of "current menu" or "next best alternative." *Fix:* Baseline must be the *status quo* or the *specific alternative* being swapped.
      *   *Naive Failure 4: Double Counting.* Counting land use separately from crop deaths when crop deaths are a function of land use. *Fix:* Ensure buckets are distinct (Farmed Life, Crop Collateral, Land Use/Wild Habitat, Wild Capture).
