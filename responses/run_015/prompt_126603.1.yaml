      *   *Refining the "Lumpiness" Issue:* This is crucial. If the university buys 100 cases of chicken, and the contract is for 100-150 cases, dropping to 99 might not reduce supply; the distributor just sells that case elsewhere. The procedure needs a "Marginal Impact Check."
      *   *Refining the "Uncertainty" Issue:* Don't ask for expected value. Ask for "Does this dominate across the range?" If View A says Good and View B says Bad, it's a Values Handoff, not a Procedure Pass.
      *   *Refining the "Values" Issue:* The staffer cannot decide if wild animal suffering counts. The procedure must output "Trade-off Identified: X increases, Y decreases" and stop for Director input.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Structure:* Needs to be linear. Gate 1 (Compliance), Gate 2 (Lumpiness/Impact), Gate 3 (Acceptance/Waste), Gate 4 (Impact Buckets), Gate 5 (Robustness/Values).
