answer: |-
  Here is a repaired account of moral progress based on your verdicts, followed by an application to your cases, an analysis of your distinctions, and an adversarial test.

  ### The Robust Accuracy Account

  Your tentative principle fails because it treats "widening scope" as a necessary condition (contradicted by Case 5) and treats "retention" as a metaphysical requirement rather than an evidentiary test (contradicted by Case 8). It also under-specifies the role of truth (contradicted by Case 3) and cost (contradicted by Case 6).

  I propose replacing your principle with the **Robust Accuracy Account**. On this view, moral progress is not a vector pointing simply outward, but a vector pointing toward *integrity*. It is defined by three clauses:

  **Clause 1: Veridical Alignment**
  A change constitutes progress only if it moves a society's normative practices closer to the actual moral status of the beings affected. This permits scope to widen (if previously excluded beings have moral status) or narrow (if previously included "beings" do not, or if the interests attributed to them are illusory).
  *   *Forced by:* **Case 3** (AI rights based on false belief are not progress) and **Case 5** (Narrowing scope regarding the dead is neutral or good). It also clarifies **Case 4** (Offensive speech norms fail because the "harm" is not veridical).

  **Clause 2: Costly Commitment**
  A change constitutes progress only if it is underwritten by a net increase (or at least non-decrease) in the society's willingness to incur sacrifice to uphold the new norm. If the norm becomes cheaper to follow, or if the society reduces its willingness to pay for existing obligations, this is regression or stagnation, regardless of scope.
  *   *Forced by:* **Case 6** (Welfare erosion is a loss despite stable scope). This distinguishes genuine progress from **Case 4** (where cost rises, but fails Clause 1) and **Case 1** (where footbinding/slavery abolition required economic/social sacrifice).

  **Clause 3: Counterfactual Stability**
  A change is judged as progress only insofar as it demonstrates stability when the contingent conditions that precipitated it are removed. Retention is not a precondition for *calling* something progress in the present, but it is the condition for *sustaining* that judgment historically. If a norm collapses when conditions change, the judgment of progress is retroactively revoked.
  *   *Forced by:* **Case 2** (Animal rights are "in the making" because stability is unproven) and **Case 8** (The tension between calling abolition progress now vs. the hypothetical reversal). This clause resolves the tension by making progress a *provisional* historical verdict, not an eternal property of an event.

  **Clause 4: Causal Pluralism**
  The causal origin of the change (moral argument vs. economic interest) does not disqualify it, provided the resulting norm satisfies Clauses 1 and 2. However, a norm sustained *purely* by interest without the possibility of moral justification fails Clause 3 (Stability), because interests shift.
  *   *Forced by:* **Case 9** (Abolition driven by economics is still progress) and **Case 7** (Representational technology is a valid tool for Veridical Alignment if it reveals real interests).

  ---

  ### Application to Your Nine Cases

  Here is how the Robust Accuracy Account verdicts your cases. Note where it aligns and where it forces a correction.

  **1. Torture, Slavery, Footbinding.**
  *   **Verdict:** Progress.
  *   **Reasoning:** Satisfies **Veridical Alignment** (these practices relied on false denials of moral status or exaggerated social interests). Satisfies **Costly Commitment** (abolition required economic sacrifice). Satisfies **Counterfactual Stability** (these norms have largely held in successor societies).
  *   **Alignment:** Matches your verdict.

  **2. Animal Rights.**
  *   **Verdict:** Provisional Progress.
  *   **Reasoning:** Satisfies **Veridical Alignment** (plausible that animals have moral status). Satisfies **Costly Commitment** (dietary/industrial changes are costly). Fails **Counterfactual Stability** *for now* (untested over long durations or economic stress).
  *   **Alignment:** Matches your "progress in the making" verdict.

  **3. AI Consciousness.**
  *   **Verdict:** Not Progress.
  *   **Reasoning:** Fails **Veridical Alignment**. If the belief in sentience is false, the norm is based on error. Even if **Costly Commitment** is high, aligning practice with error is not moral progress.
  *   **Alignment:** Matches your verdict.

  **4. Offensive Speech Norms.**
  *   **Verdict:** Not Progress (Moralized Status Competition).
  *   **Reasoning:** Fails **Veridical Alignment**. If the speech injures no identifiable person, the "interest in dignity" is likely an illusion or a status marker. While **Costly Commitment** is high (jobs lost), paying a high cost for a false moral claim is not progress.
  *   **Alignment:** Matches your verdict.

  **5. Speaking Ill of the Dead.**
  *   **Verdict:** Neutral/Improvement (Contraction).
  *   **Reasoning:** Satisfies **Veridical Alignment** via contraction. The deceased do not have interests that can be wronged; removing them from the scope corrects a moral error. **Costly Commitment** is irrelevant here as the cost was merely restraint of speech.
  *   **Alignment:** Matches your verdict.

  **6. Welfare State Erosion.**
  *   **Verdict:** Moral Regression.
  *   **Reasoning:** Fails **Costly Commitment**. Even if **Veridical Alignment** is stable (the same people count), the willingness to pay the cost for their well-being dropped. The circle shrank along the cost dimension.
  *   **Alignment:** Matches your verdict.

  **7. Concern for the Far Future.**
  *   **Verdict:** Progress.
  *   **Reasoning:** Satisfies **Veridical Alignment**. Future people have moral status; previously we ignored them due to epistemic blindness. Representational technology (graphs/models) is a valid tool for overcoming that blindness, analogous to the "change in what people could bear to watch" in Case 1. Satisfies **Costly Commitment** (requires present sacrifice for distant gain).
  *   **Alignment:** Matches your verdict, but resolves your doubt about "representational technology." It counts as epistemic access, not just an artifact.

  **8. Hypothetical Re-enslavement.**
  *   **Verdict:** *Correction Required.* You must accept that if slavery were restored, the British abolition would be reclassified as a *temporary fluctuation*, not progress.
  *   **Reasoning:** This follows from **Counterfactual Stability**. You cannot hold both that retention is a condition (in the hypothetical) and that it is waived (in the actual case). The account obliges you to view the label "progress" as provisional. British abolition *is* progress only because it has held *so far*. If it reverses, the verdict reverses.
  *   **Alignment:** Contradicts your desire to call British abolition flatly "progress" regardless of the future.

  **9. Causal History of Abolition.**
  *   **Verdict:** Progress.
  *   **Reasoning:** Satisfies **Causal Pluralism**. The economic cause does not disqualify the norm. Because the norm aligns with **Veridical Alignment** (slaves have status) and **Costly Commitment** (economic loss was accepted), it counts. A change driven *purely* by interest would fail **Counterfactual Stability** (as soon as interest shifts, the norm dies), which is why you intuitively distinguish it.
  *   **Alignment:** Matches your verdict, clarifies the reasoning.

  ---

  ### The Necessary Surrender

  There is one verdict you must surrender to maintain consistency: **The certainty of your verdict on Case 8.**

  You want to say British abolition *is* progress, while also admitting that if it were reversed, it *was not* progress. This is a temporal contradiction. The Robust Accuracy Account forces you to accept that moral progress is not a property of an event at time *T*, but a property of a trajectory observed from time *T+n*.

  **Why you should surrender this:**
  Holding onto the certainty that British abolition was progress, regardless of its future retention, insulates your moral judgment from reality. If a moral norm cannot survive a change in economic conditions, it suggests the norm was never truly internalized as a moral truth (Veridical Alignment) but was merely a preference that coincided with morality for a moment. If Britain re-enslaves people in 2100 because labor is scarce, it reveals that the 1830s abolition was not a moral correction, but a market adjustment. To call it "progress" anyway is to prioritize the *story* of progress over the *reality* of moral commitment. You should accept that your judgment of history is always provisional. This does not paralyze you; it simply acknowledges that we are judging a film while it is still playing.

  ---

  ### Scope, Cost, and Retention: Distinct or Redundant?

  You asked whether these three distinctions are doing real theoretical work.

  **They are distinct, but they are not co-equal.**

  1.  **Scope** is the *object* of morality. It answers "Who counts?"
  2.  **Cost** is the *weight* of morality. It answers "How much does it matter?"
  3.  **Retention** is the *evidence* of morality. It answers "Was it real?"

  In your tentative principle, you treated them as three legs of a stool. In the Robust Accuracy Account, they are hierarchical. **Scope** is subordinate to **Veridicality** (widening is only good if true). **Cost** is a necessary condition for sincerity (without cost, scope is cheap talk). **Retention** is the empirical test that verifies the first two.

  They are not a redescription of a single variable, but they do all measure **Moral Commitment Integrity**.
  *   If you widen Scope without Cost, Integrity is low (Hypocrisy).
  *   If you pay Cost for the wrong Scope, Integrity is high but Misguided (Fanaticism).
  *   If you have Scope and Cost but no Retention, Integrity was illusory (Fashion).

  So, they are distinct dimensions, but they converge on a single underlying variable: the degree to which a society's moral claims are anchored in reality and sustained by will.

  ---

  ### Adversarial Case: Deinstitutionalization of the Mentally Ill

  To test the account, let us apply it to the shift from long-term psychiatric institutionalization to community-based care (roughly 1950s–1980s in the US/UK).

  **The Case:**
  Societies moved from confining the severely mentally ill in large state hospitals to treating them in the community.
  *   **Scope:** Arguably widened. Patients were granted rights to liberty and integration previously denied.
  *   **Cost:** Intended to be lower (hospitals are expensive), but shifted to families and communities. In many cases, the *actual* cost paid by the state dropped, leading to homelessness and incarceration of the ill.
  *   **Retention:** The norm of "least restrictive environment" has held, but the support system often collapsed.

  **Application of the Robust Accuracy Account:**

  1.  **Veridical Alignment:** Did the mentally ill have a right to liberty? Yes. The old system treated them as property or objects of hygiene rather than moral agents. The shift corrects a moral error. **(Passes Clause 1)**.
  2.  **Costly Commitment:** Here the account finds a failure. While the *rhetoric* of care remained, the *funding* (the actual cost society was willing to bear) decreased. The state was willing to grant liberty only because it was no longer willing to pay for custody. The "cost" of the new norm was offloaded onto the vulnerable themselves (via homelessness). **(Fails Clause 2)**.
  3.  **Counterfactual Stability:** Because the cost was not borne, the system proved unstable. Communities rejected group homes; patients went unmedicated. The norm survived in law but failed in practice. **(Fails Clause 3)**.

  **Verdict:**
  The Robust Accuracy Account classifies Deinstitutionalization as **Moral Regression disguised as Progress**.

  **Why this is adversarial:**
  This case is difficult because the *intent* was progressive (liberty, dignity), and the *Scope* correction was real (patients are persons). Most people want to call this progress that was "poorly implemented." The Account forces a harder line: if you grant rights (Scope) but refuse to pay for the conditions that make those rights exercisable (Cost), you have not made moral progress. You have merely changed the mode of neglect.

  This challenges you to decide if you agree. If you think Deinstitutionalization *was* progress despite the homelessness crisis, you must reject **Clause 2 (Costly Commitment)** as a necessary condition. You would have to argue that recognizing the right is progress even if we fail to honor it. But if you accept that, you risk validating Case 4 (Speech norms) where recognition is granted but the underlying harm is false. The Account forces you to choose between the purity of the right (Scope) and the reality of the sacrifice (Cost). Given your verdict on Case 6 (Welfare), consistency demands you call Deinstitutionalization a failure of moral progress, however well-intentioned the architects were.
