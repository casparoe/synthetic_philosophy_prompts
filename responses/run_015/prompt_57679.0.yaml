      *   *Case 8 (Retention)* complicates (c). We judge progress *now*. Retention is evidence, not a metaphysical requirement. If it reverses, we reclassify history. So Retention is a *condition of ascription*, not a property of the event at time T.
      *   *Case 9 (Causation)*. Economic causes are fine *if* the resulting norm is justifiable.

      *   *Proposed Principle:* **Moral progress occurs when a society adopts a normative stance that (1) improves the accuracy of moral recognition (correcting false inclusions or exclusions), (2) is underwritten by a non-decreasing willingness to incur social cost to uphold that recognition, and (3) proves robust to the removal of the contingent conditions that initially facilitated the change.**

