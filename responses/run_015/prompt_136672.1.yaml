answer: |-
  Your hypothesis is sharp, and your distributed systems analogy (absolute addressing vs. relational graphs) is one of the best intuitive handles I have seen on this problem. It cuts through the historical baggage. However, my diagnosis is that the stalemate persists not because the dispute is merely verbal (notational), nor because it is purely empirical, but because the **ontology of the "metric field" in General Relativity (GR) has collapsed the distinction between the container and the content.**

  Here is the diagnosis of why your group is stuck, an evaluation of your hypothesis, and a roadmap for what progress would actually look like.

  ### 1. Diagnosis: The Metric Field as the "Third Man"

  Your hypothesis splits the dispute into an **empirical question** (can we derive inertia from matter?) and a **representational question** (is spacetime a thing or a bookkeeping device?).

  **The Empirical Front is Closed (mostly):**
  Strict Machian relationism (inertia is *only* caused by the weighted average of distant matter) is empirically false in the context of standard GR. GR permits **vacuum solutions** (e.g., gravitational waves, Schwarzschild black holes) where spacetime curvature exists without local matter. If inertia were strictly determined by the relation of material bodies, an empty universe should have no inertial structure. GR says it does. On strict empirical grounds, "naive" relationism lost to GR.

  **The Ontological Front is the Stalemate:**
  The dispute didn't end; it migrated. It moved from "Space vs. Relations" to "What is the Metric Field ($g_{\mu\nu}$)?"
  *   **The Substantivalist** says: The metric field is a physical object. It carries energy, it propagates waves, it exists in the absence of matter. It is the "substance."
  *   **The Relationist** says: The metric field is just a codification of the possible spatiotemporal relations between events. It is a "field of relations," not a "thing."

  **Why this causes a stalemate:**
  In your CS analogy, this is like arguing whether a **routing table** is a "thing" or just a "description of connections."
  *   If the routing table can exist and change even when no packets are flowing (vacuum solutions), it looks like a "thing" (substance).
  *   But if the routing table *defines* what "connection" means, it looks like a "rule" (relation).

  The stalemate exists because GR makes the geometry **dynamical**. In Newtonian physics, space was a static stage (clearly substantival). In GR, the stage bends and ripples. When the stage behaves like an actor, the distinction between "stage" and "actor" blurs. Your group is stuck because you are trying to apply a binary classification (Substance vs. Relation) to an entity (the Metric Field) that exhibits properties of both.

  ### 2. Critique of Your "Two Questions" Hypothesis

  You suggested the dispute is (1) Empirical and (2) Representational. I argue it is actually (1) **Modal** and (2) **Ontological**.

  **The Modal Clash (Possibility vs. Actuality):**
  The "Empty Universe" test you proposed is the correct stress test, but your interpretation of the result needs adjustment.
  *   **Substantivalist:** "A single rotating body in an empty universe *is possible*. It experiences centrifugal force. Therefore, something non-material (spacetime) provides the reference."
  *   **Relationist:** "A single rotating body in an empty universe is *ill-defined*. Rotation is a relation. No relata, no relation. The scenario is physically meaningless."

  The disagreement here is not about what we *observe* (we never observe an empty universe). It is about **modal commitment**: What counts as a physically possible world?
  *   Substantivalists commit to the reality of **vacuum solutions**.
  *   Relationists commit to the **necessity of matter** for spatiotemporal facts.

  This is not a verbal dispute. It is a disagreement about the **space of solutions** the theory allows. If you treat it as verbal, you ignore that Substantivalism grants reality to scenarios Relationism declares nonsense.

  **The Representational Clash (The Hole Argument):**
  You asked if the Hole Argument reduces the dispute to notation (array vs. graph).
  *   **The Argument:** If spacetime points are "things" (array indices) with independent identity, then GR is indeterministic (you can shuffle the fields over the points without changing observations).
  *   **The Fix:** To save determinism, Substantivalists adopt "Sophisticated Substantivalism" (or Leibniz Equivalence). They say: "Points don't have identity independent of the fields. Diffeomorphic models represent the same physical state."

  **Diagnosis:** This move makes Substantivalism look almost identical to Relationism (specifically, Structural Realism). If points have no identity without the fields, in what sense are they "substance"?
  *   **Where you are right:** It *feels* like a notational choice because the empirical predictions are identical.
  *   **Where you are wrong:** It is not *just* notation because it dictates how you quantize the theory later. If points are "things," you might try to quantize the manifold. If they are "relations," you quantize the correlations. The "notation" determines the research program for Quantum Gravity.

  ### 3. The Distributed Systems Analogy: Where it Holds and Breaks

  Your analogy of **Absolute Addressing (Substantivalism)** vs. **Relational Graph (Relationism)** is excellent for Classical Mechanics.
  *   **Newton:** Pre-allocated memory array. Indices exist even if `null`.
  *   **Mach:** Peer-to-peer network. Nodes only exist if they handshake.

  **Where it breaks in GR:**
  In GR, the "memory addresses" (manifold points) exist, but they have no metric properties (distance/time) until the "software" (metric field) runs. But the "software" is also the "hardware" in the sense that it carries energy.
  A better CS analogy for GR is a **Software-Defined Network (SDN)** where the control plane (geometry) is dynamic and carries traffic (energy), but the physical switches (manifold points) are indistinguishable without the configuration (fields).

  The stalemate is: **Are the switches real?**
  *   Substantivalist: Yes, the switches are the substrate.
  *   Relationist: No, only the configuration logic is real.
  *   Reality: You can't run the logic without the switches, but the switches do nothing without the logic.

  ### 4. What Counts as Progress?

  Given this diagnosis, a reading list won't help. Progress requires one of three specific moves:

  **A. A Formal Distinction (The "Structural Realist" Dissolution)**
  Progress looks like agreeing that "Substantivalism" and "Relationism" are outdated categories. The successor view is **Spacetime Structuralism**: The fundamental ontology is the *structure* (the invariant relations), not the relata (points) or the matter.
  *   *Sign of Progress:* Your group stops asking "Is space a thing?" and starts asking "Which structural invariants are fundamental?"
  *   *Verdict:* This dissolves the fight but might feel like cheating.

  **B. A Successor Theory (Quantum Gravity)**
  The dispute assumes the continuum (manifold) is fundamental. If a theory of Quantum Gravity (e.g., Loop Quantum Gravity, Causal Set Theory) shows that spacetime is emergent from discrete, non-spatiotemporal degrees of freedom, the dispute becomes obsolete.
  *   *Sign of Progress:* A theory where "spacetime" is a thermodynamic limit, like "temperature." You don't ask if temperature is a substance or a relation; you ask what microstates generate it.
  *   *Verdict:* This is the most likely way the dispute actually ends.

  **C. An Empirical Divergence (The "Machian" Test)**
  If a strictly relational theory (like Julian Barbour's Shape Dynamics) makes a prediction distinct from GR in a regime we can test (e.g., cosmological scales or black hole horizons), the dispute becomes empirical again.
  *   *Sign of Progress:* Data that rules out vacuum solutions or modifies inertial frames in a way GR cannot accommodate.
  *   *Verdict:* Unlikely soon, but the only way to make it strictly empirical.

  ### 5. Extrapolation and Uncertainty

  **Where I am extrapolating:**
  I am asserting that the "Sophisticated Substantivalist" position is the dominant stable state of the debate. Some philosophers argue this position is unstable and collapses back into Relationism. I am extrapolating that the field is converging on Structural Realism, even if the labels "Substantivalist" persist.

  **Where this diagnosis is most likely to fail:**
  1.  **Modal Intuitions:** I may be underestimating the philosophical weight of "possibility." For some, the *ability* to conceive of an empty universe is proof enough of substantivalism, regardless of GR. If your group holds strong modal intuitions, no amount of "structuralism" will satisfy them.
  2.  **Quantum Non-Locality:** If quantum entanglement implies a fundamental non-spatial connection that is *not* mediated by a metric field, Relationism might get a second wind (relations without spacetime). My diagnosis assumes GR is the correct classical limit.

  ### 6. What Would Change My Mind?

  **Consideration 1: The "Hole Argument" Resurgence**
  If a rigorous proof demonstrated that "Sophisticated Substantivalism" fails to secure determinism in GR without begging the question, I would revert to thinking the dispute is substantive and unresolved. Currently, the consensus is that Leibniz Equivalence saves determinism. If that consensus breaks, the ontological cost of Substantivalism (indeterminism) becomes real again.

  **Consideration 2: Empirical Success of Relational Mechanics**
  If a relational formulation of physics (like Shape Dynamics) proved mathematically more tractable for Quantum Gravity than standard GR *and* offered a clear mechanism for inertia without a background metric, I would concede the "Representational" part of your hypothesis is wrong. It would mean the "graph" implementation is not just notationally equivalent to the "array," but computationally/physically superior.

  **Consideration 3: The "Verbal Dispute" Proof**
  If it were shown that every claim made by a Substantivalist can be translated into Relationist language without loss of predictive power *and* without loss of modal nuance, then it is verbal. Currently, the translation loses the "vacuum solution" intuition. If someone formalizes the translation of vacuum solutions into pure matter-relations (perhaps via boundary data), the dispute collapses.

  ### Summary for Your Group

  1.  **Stop asking "Who is right?"** The empirical data (GR) supports a hybrid that breaks the binary.
  2.  **Accept the Metric Field as the Battleground.** The question is no longer "Space vs. Matter," it is "Is the Metric Field a Physical Object?"
  3.  **Use your Test, but refine it.** The "Empty Universe" test reveals a **Modal Disagreement**, not a verbal one. Substantivalists accept the scenario as possible; Relationists reject it as ill-defined. This is a substantive difference in how you define "physical possibility."
  4.  **Expect Dissolution, not Victory.** The dispute will likely vanish when spacetime is shown to be emergent (Quantum Gravity), rendering both "Substance" and "Relation" (as classically defined) incorrect.

  You are stuck because you are debugging a legacy system (Classical Ontology) that has been patched by a new kernel (GR) without updating the documentation (Philosophy). The code runs, but the comments don't match.
