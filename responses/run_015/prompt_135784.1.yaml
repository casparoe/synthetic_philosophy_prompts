answer: |-
  Start by forcing a distinction between intrinsic and derived intentionality, then use the "Human Annotator Chain" example to trace a single token back to a human sensor, because this visually exposes the proxy cascade without getting bogged down in metaphysics.

  **Dependency Order**
  You must land **Intrinsic vs. Derived Intentionality** in the first five minutes. If students believe the model generates meaning internally, the cascade argument fails. Define intrinsic intentionality as the capacity to mean something based on your own causal interaction with the world (humans), and derived intentionality as meaning borrowed from something else (maps, words, models). This sets the stage: the VLM has only derived intentionality.

  **The Carrying Example**
  Use **a photo of a rock labeled "heavy."** Walk them through the pipeline:
  1.  **Reality:** A human lifts a rock, feels weight (haptic sensor), and types "heavy" (symbol).
  2.  **Data:** The image (pixels) and token ("heavy") are saved to a dataset.
  3.  **Training:** The VLM correlates pixel patterns with the token "heavy."
  4.  **Inference:** The model predicts "heavy" for similar pixels.
  Ask them: "Where did the weight go?" The model never felt weight; it only learned that *humans who see these pixels say 'heavy'.* The grounding is in the human's haptics, not the model's vision. This makes the proxy chain visible: Model -> Token -> Human Annotation -> Human Sensor -> World.

  **Misconception Interception**
  *   **"The image encoder gives direct access":** Head this off immediately after defining derived intentionality. Clarify that the encoder processes *digitized representations* of light, not light itself. It is a second-hand report, not a sensor.
  *   **"Grounding is just correlation in high dimensions":** Address this during the "Heavy Rock" walk-through. Acknowledge the correlation exists (pixels match tokens) but emphasize the missing *causal coupling*. The model cannot be crushed by the rock; therefore, "heavy" has no physical consequence for it.
  *   **"Humans learn language from other people too":** Save this for the final five minutes. Explain that humans have a biological baseline of intrinsic grounding (pain, hunger, balance) to attach borrowed symbols to. The model has zero baseline; it is 100% borrowed symbols attached to other borrowed symbols.

  **Why Not the Chinese Room**
  Do not use the Chinese Room. It focuses on syntax versus semantics, which allows students to argue that "semantics emerge at scale" or that the system *as a whole* understands. The proxy-grounding cascade is not about complexity or understanding; it is about **causal history and sensor provenance**. The Chinese Room distracts from the data pipeline argument.

  **Explicit Refusal**
  Refuse to cover **Searle's Biological Naturalism or Qualia**. Do not debate whether machines can *feel* or be *conscious*. Keep the argument engineering-focused: the model lacks sensors and actuators, so it cannot close the loop on physical causality. This prevents the session from devolving into philosophy of mind.

  **Check Question**
  "If you fine-tune this VLM on a dataset generated entirely by another AI that has never interacted with physical reality, does the grounding degrade, and at which exact link in the chain does the connection to reality sever?"
  *(Correct answer: Yes, it degrades into pure symbol manipulation because the human sensor link in the chain is replaced by another proxy, breaking the causal tie to the physical world.)*
