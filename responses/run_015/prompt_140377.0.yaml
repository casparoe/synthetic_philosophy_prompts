answer: |-
  You are collapsing two questions. That is why Case 3 feels broken. You are trying to answer "Is the process unfair?" and "Is the outcome unequal?" with a single number. They are different metrics.

  Here is the single principle that resolves the other four cases and untangles the third.

  ### The Baseline Rule

  **Trust the subgroup rates if the grouping variable is a *Baseline Characteristic* (pre-existing and stable). Trust the total rate if the grouping variable is a *Consequence* (caused by the treatment) or *Noise* (too small to be stable).**

  To apply this without jargon, ask your client two questions before running the numbers:
  1.  **Timeline:** Did this difference exist *before* the treatment or decision started?
  2.  **Stability:** Is the subgroup large enough that the result wouldn't vanish if we ran the test again tomorrow?

  If **Yes** to Timeline and **Yes** to Stability: **Trust the Subgroups.** (But re-weight them to match *your* population, not the study's).
  If **No** to Timeline (it's a result) OR **No** to Stability: **Trust the Total.**

  ---

  ### How This Applies to Your Five Cases

  **Case 1 (Hospital Drugs): Verdict Stands.**
  *   **Timeline:** Severity was recorded at intake (Before).
  *   **Stability:** Sample sizes are decent.
  *   **Application:** Severity is a baseline characteristic. Doctors assigned the New Drug to sicker people. The subgroups reveal the drug's actual power. The Total is misleading because it mixes different patient types.
  *   **Action:** Report the subgroup rates.

  **Case 2 (Physio Programs): Verdict Stands.**
  *   **Timeline:** Pain-free status was measured at week two (After treatment started).
  *   **Application:** Program A worked *by* making people pain-free. If you split by pain status, you are removing Program A's main mechanism of action. You are asking, "Which program works better for people who are *already* pain-free?" instead of "Which program creates more pain-free people?"
  *   **Action:** Report the Total. Ignore the split.

  **Case 3 (Admissions): Verdict Requires Clarification.**
  *   **Timeline:** Division choice happens after Gender is known, but before Admission is decided. Relative to the *Admissions Office's decision*, Division is a baseline characteristic (the applicant arrives with a division choice).
  *   **Application:** Here is where you are collapsing two questions.
      *   **Question A (Process Fairness):** "Given an applicant's qualifications (Division), are they treated equally?" -> **Trust Subgroups.** The data says yes. No division is biased.
      *   **Question B (Outcome Disparity):** "Do men and women end up admitted at equal rates?" -> **Trust Total.** The data says no. There is a gap.
  *   **Correction:** You do not have to drop the headline gap, but you must change your explanation. You cannot say "There is a gap" and imply "The admissions process is biased." The correct stance is: "There is an outcome gap driven by application patterns, not admissions bias." The subgroups *do* dissolve the *bias*, but they do not dissolve the *gap*. Keep both numbers, label them distinctly.

  **Case 4 (Reading Programs): Verdict Stands (with refinement).**
  *   **Timeline:** Reading level was assessed before the program (Before).
  *   **Application:** The published Total is just a weighted average of the subgroups based on *their* district's mix. The "Truth" of the program lives in the subgroup rates.
  *   **Correction:** Your instinct to re-weight was exactly right. "Trusting the Split" doesn't mean picking the row where you win; it means taking the subgroup rates and applying them to *your* population's mix. That is the only way to get a valid Total for your district.

  **Case 5 (A/B Test): Verdict Stands.**
  *   **Timeline:** Irrelevant.
  *   **Stability:** Six people is noise.
  *   **Application:** A subgroup of six cannot be stable. A reversal there is statistical fluctuation, not a structural paradox.
  *   **Action:** Trust the Total. Require a minimum sample size (e.g., 100 conversions) before acknowledging a subgroup reversal.

  ---

  ### The Two Edge Cases You Are Dodging

  **(a) The Missing Documentation (Timeline Unknown)**
  *   **The Rule:** If you cannot verify the variable existed *before* the treatment, **Trust the Total.**
  *   **Why:** Adjusting for a variable that was actually caused by the treatment (a mediator) is a fatal error. It hides the treatment's effect (as in Case 2). Failing to adjust for a pre-existing confounder (Case 1) is also an error, but in a business/legal context, claiming a treatment works when it doesn't (False Positive) is usually riskier than missing a nuance.
  *   **Client Instruction:** "We cannot determine if this variable is a cause or a result. Reporting the adjusted number risks hiding the treatment's true impact. We will report the Total and flag the subgroup as 'Exploratory Only'."

  **(b) The Noisy Proxy (70% Accuracy)**
  *   **The Rule:** If the split variable is a noisy measurement of the underlying trait, **Trust the Total** (or treat the split as highly uncertain).
  *   **Why:** Splitting on a noisy proxy creates "residual confounding." You think you've separated Severe from Mild, but you've actually leaked Mild patients into the Severe bucket and vice versa. This biases your subgroup comparison, often making it look like there is no effect when there is one, or creating a fake reversal. It gives a false sense of control.
  *   **Client Instruction:** "Because this severity score is imperfect, adjusting for it may introduce more error than it removes. We will report the Total as the primary metric and treat the split as a sensitivity check, not a correction."

  ### Summary for Your Clients

  Give them this checklist. If they can't answer Yes to #1 and #2, they don't get to split the data.

  1.  **Pre-Existence:** Did this difference exist before we intervened? (Yes = Split, No = Total)
  2.  **Stability:** Is the subgroup large enough to be real? (Yes = Split, No = Total)
  3.  **Re-Weighting:** If splitting, are we calculating the rate for *our* population mix, not the raw average? (Yes = Valid, No = Misleading)

  **Which verdict to drop:**
  You must drop the idea that Case 3's two stances are incompatible. They are compatible *if* you label them correctly. The Total measures **Disparate Impact** (the gap). The Subgroups measure **Disparate Treatment** (the bias). You can have Impact without Treatment. State that clearly, and the paradox vanishes.
