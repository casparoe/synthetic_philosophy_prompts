prompt: |-
  I'm giving a talk next month to my department's ethics workshop — mostly people who build their careers on thought experiments (trolley problems, experience machines, utility monsters, you name it). My thesis is that a lot of the most famous thought experiments in ethics function as what Dennett called "intuition pumps": they're not neutral argumentative devices, they're rhetorically loaded setups that steer intuition in a pre-selected direction, and this makes them epistemically dubious in ways the literature doesn't adequately address. I'm not saying all thought experiments are bunk, but I am saying the field's methodological self-awareness about this is pretty weak.

  The audience includes: one senior professor who literally wrote the book on trolleyology, two grad students doing dissertation chapters that revolve around particular thought experiments, a Wittgensteinian who already thinks thought experiments are nonsense (but for different reasons than mine), and a bunch of smart agnostics.

  Draft my Q&A prep sheet. Give me the eight or so objections I'll actually get, ordered by how likely and how damaging they are, phrased the way these people would phrase them. For each: a two-minute reply and an honest note on where the reply is softest. Include the question I'm praying nobody asks. And at the very end, give me a one-sentence summary of my own position that I should have ready to go, formatted as \answer{...}.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **Context:** Ethics department workshop.
      *   **Audience:** Experts in thought experiments (trolleyology, etc.), including a senior professor (authority), grad students (invested), a Wittgensteinian (skeptic), and agnostics.
      *   **Thesis:** Famous ethical thought experiments are "intuition pumps" (Dennett) that are rhetorically loaded, steer intuition, and are epistemically dubious; the field lacks methodological self-awareness.
      *   **Task:** Draft a Q&A prep sheet.
      *   **Requirements:**
          *   ~8 objections (ordered by likelihood/damage).
          *   Phrased in the audience's voice (technical, specific).
          *   Two-minute reply for each.
          *   Honest note on where the reply is softest.
          *   The "prayer" question (the one I hope nobody asks).
          *   One-sentence summary at the end in `\answer{...}` format.

  2.  **Deconstruct the Thesis & Audience:**
      *   *Thesis:* Thought experiments aren't neutral; they manipulate; we need more methodological rigor.
      *   *Audience Perspectives:*
          *   *Senior Prof (Trolleyologist):* Defends the utility of abstraction. Will argue that stripping away context *is* the point to isolate variables.
          *   *Grad Students:* Their careers depend on these tools. They will worry about nihilism or paralysis. "If we can't use these, what do we do?"
          *   *Wittgensteinian:* Agrees thought experiments are bad, but thinks *all* philosophy is language games. Might try to co-opt the talk for their own end.
          *   *Agnostics:* Want to know if this changes practice or is just meta-philosophical griping.

  3.  **Brainstorming Objections (Likelihood & Damage):**
      1.  *The "Isolation" Defense:* We need to isolate variables like in science. (High likelihood, Senior Prof).
      2.  *The "Progress" Argument:* Look how much we've learned using them. (High likelihood, Grad Students).
      3.  *The "Alternative" Challenge:* If not these, then what? (High likelihood, Pragmatists).
      4.  *The "Dennett Misuse" Claim:* Dennett used intuition pumps for *his* work too. (Medium likelihood, Sharp audience member).
      5.  *The "Reflective Equilibrium" Shield:* We don't trust single intuitions; we seek coherence. (High likelihood, Standard methodology).
      6.  *The "Wittgensteinian Trap:* "So you're saying we should stop doing philosophy?" (Medium likelihood, Specific audience member).
      7.  *The "Expertise" Rebuttal:* Philosophers have trained intuitions, unlike laypeople. (Medium likelihood, Senior Prof).
      8.  *The "Strawman" Accusation:* Nobody thinks these are proof, just heuristics. (Medium likelihood, Agnostics).

      *Selection & Ordering:* I need to order by likelihood *and* damage. The "What's the alternative?" and "Isolation/Control" arguments are the most damaging because they strike at the core utility. The "Reflective Equilibrium" is the most standard technical defense.

  4.  **Drafting the Content (Iterative Process):**

      *   *Objection 1 (The Control Variable):* "Science uses idealizations." Reply: Science validates idealizations against data; ethics doesn't. Soft spot: Disanalogy between physical and moral data.
      *   *Objection 2 (Reflective Equilibrium):* "We don't rely on one pump." Reply: Pumps set the *terms* of equilibrium, biasing the whole system. Soft spot: Hard to prove the bias is decisive.
      *   *Objection 3 (The Alternative):* "If you ban these, what's the method?" Reply: Real-world cases, empirical ethics, historical context. Soft spot: Loses the crispness of theory.
      *   *Objection 4 (Trained Intuitions):* "Experts see through the rhetoric." Reply: Expertise often entrenches the framework. Soft spot: Elitist sounding.
      *   *Objection 5 (Progress):* "We've solved things using these." Reply: You've solved *puzzles*, not moral problems. Soft spot: Hard to define "progress."
      *   *Objection 6 (Dennett Irony):* "Dennett used pumps too." Reply: He warned about them; I'm asking for calibration. Soft spot: Might look like special pleading.
      *   *Objection 7 (Wittgensteinian):* "Language games are all we have." Reply: I want better games, not no games. Soft spot: Risk of agreeing too much.
      *   *Objection 8 (Strawman):* "We know they're heuristic." Reply: The literature treats them as evidence too often. Soft spot: Citation heavy, boring.

      *Refining the Voices:* Make the Senior Prof sound authoritative but open. Make the Grad Student sound anxious. Make the Wittgensteinian sound dismissive.

      *The "Prayer" Question:* This needs to be the killer. Something that exposes the performative contradiction. "Is *your* talk an intuition pump?" Or "What is the normative basis for your critique?" Let's go with: "What is the non-pumped intuition grounding your critique?"

      *The One-Sentence Summary:* Needs to be punchy. "Thought experiments are pedagogical tools, not evidentiary data, and treating them as the latter corrupts ethical inquiry."

  5.  **Review against Constraints:**
      *   8 objections? Yes.
      *   Ordered by likelihood/damage? Yes.
      *   Two-minute replies? (Need to ensure word count/pacing fits ~2 mins spoken).
      *   Honest "soft spot"? Yes.
      *   Prayer question? Yes.
      *   Final summary format? `\answer{...}`.

  6.  **Final Polish:** Check tone. It should be respectful but firm. Ensure the distinction between "useful" and "evidentiary" is clear. (Self-Correction: Make sure the "Two-minute reply" isn't too long text-wise. A spoken 2-minute reply is about 250-300 words. I will keep them concise.)

      *Wait, one check on the "Prayer Question":* The most damaging question is usually one that undermines the speaker's authority or method. "Is your argument against intuition pumps itself an intuition pump?" is classic. But "What is your positive methodology?" is more practical. Let's go with the performative contradiction one, it's sharper for this crowd.

      *Wait, check the "Soft Spot":* Be brutally honest. If the reply is weak, admit it.

      *Let's finalize the list order:*
      1.  The "Controlled Conditions" Defense (Senior Prof) - Most likely.
      2.  The "Reflective Equilibrium" Shield (Standard Method) - Most technically damaging.
      3.  The "What's the Alternative?" (Grad Students/Pragmatists) - Most practically damaging.
      4.  The "Trained Intuition" Claim (Expertise) - Likely from Senior Prof.
      5.  The "Heuristic, Not Proof" Retreat (Agnostics) - Likely concession.
      6.  The "Progress" Argument (Grad Students) - Emotional investment.
      7.  The Wittgensteinian Co-opt - Specific audience member.
      8.  The Dennett Consistency Check - Technical philosophy point.

      *Actually, let's swap 2 and 3.* "What's the alternative" is often the first thing people ask, but "Reflective Equilibrium" is the stronger *philosophical* defense. I'll keep Reflective Equilibrium higher as it's more damaging to the thesis.

      *Refining the "Prayer Question":* "If intuitions are unreliable, what intuition are you relying on to claim they are unreliable?" This hits the epistemic foundation.

      *Refining the Summary:* Needs to be precise. "Thought experiments are rhetorical devices that simulate evidence, and until we treat them as such rather than data points, our ethical theories will remain artifacts of their own methodology."

      *Let's write it.*

      *(Self-Correction during drafting)*: Ensure the tone of the objections matches the specific personas described (Senior Prof, Grad Student, Wittgensteinian).

      *(Final check on formatting)*: Ensure `\answer{...}` is at the very end.

      *(Word Count Check)*: Keep replies tight enough to be readable as a "2-minute" guide.

      *(Soft Spots)*: Make sure these aren't just "this is hard" but "this is where you might actually lose the point."

      *Okay, ready to generate.*
answer: |-
  # Q&A Prep Sheet: "The Rhetoric of the Trolley"

  **Context:** Ethics Workshop
  **Thesis:** Ethical thought experiments are rhetorically loaded "intuition pumps" that lack methodological self-awareness, rendering them epistemically dubious as evidence.

  ---

  ### 1. The "Controlled Conditions" Defense
  **Who:** Senior Professor (Trolleyologist)
  **The Objection:** "In physics, we use frictionless planes to isolate variables. You aren't suggesting we stop doing physics. These cases strip away noise to test specific moral principles. If you add real-world complexity back in, you can't tell *why* a judgment holds."
  **The Reply:** "The disanalogy is validation. A frictionless plane model is validated by its predictive success in the real world. Ethical thought experiments are validated by... more thought experiments. We have no independent data set to check if the 'principle' isolated in the trolley case actually tracks moral truth in reality. We are calibrating the instrument with the instrument."
  **Soft Spot:** You haven't offered a concrete way to validate moral principles other than coherence. If they press on "coherence," you risk sounding like a coherentist yourself.

  ### 2. The "Reflective Equilibrium" Shield
  **Who:** Senior Professor / Agnostic
  **The Objection:** "Nobody treats a single intuition as proof. We use Wide Reflective Equilibrium. We bounce intuitions off principles and background theories. The pump is just the starting spark, not the engine."
  **The Reply:** "My concern is that the pump dictates the *terms* of the equilibrium. By framing the problem as 'kill one or kill five,' you've already excluded deontological constraints about agency, or care-ethical concerns about relationship. The pump doesn't just spark the inquiry; it builds the walls of the room the inquiry happens in."
  **Soft Spot:** It is difficult to prove that the framing *decisively* excludes valid alternatives without doing the work of showing those alternatives work, which takes you back into the weeds.

  ### 3. The "What's the Alternative?" Challenge
  **Who:** Grad Students (Anxious)
  **The Objection:** "Okay, suppose I grant you that trolley cases are loaded. If I can't use them, what is my methodology for my dissertation? Do we just do empirical sociology? Historical exegesis? You're risking paralysis."
  **The Reply:** "I'm not calling for a ban, but a demotion. Treat them as pedagogical tools or stress-tests for consistency, not as data points. Shift focus to 'real-world' moral dilemmas where stakes, context, and agents are thick. Use case studies from bioethics or history where outcomes are known, rather than hypotheticals where outcomes are stipulated."
  **Soft Spot:** Real-world cases are messy and rarely yield crisp theoretical conclusions. You might be accused of trading precision for relevance.

  ### 4. The "Trained Intuition" Claim
  **Who:** Senior Professor
  **The Objection:** "Laypeople might be swayed by rhetoric. But professional philosophers have trained intuitions. We know how to filter out the framing effects. Expertise matters."
  **The Reply:** "There is evidence from experimental philosophy that expertise often entrenches framework bias rather than removing it. When you spend a career working within the 'trolley' framework, you become better at solving trolley problems, not necessarily better at seeing moral truth. You become a master of the game, not a judge of its validity."
  **Soft Spot:** This can sound ad hominem or elitist (reverse-elitist). You need to be careful not to insult their competence directly.

  ### 5. The "Heuristic, Not Proof" Retreat
  **Who:** Agnostics
  **The Objection:** "I think you're attacking a strawman. Most of us know these are just heuristics to clarify concepts. We don't claim they are empirical evidence. Are you just asking us to be more humble in our claims?"
  **The Reply:** "If it's *just* a heuristic, why do we cite them as premises in arguments for normative theories? If the Trolley Problem is just a teaching tool, why does it underpin the defense of Utilitarianism in major journals? The literature treats them as evidentiary weight. I'm asking for the citation practice to match the methodological status."
  **Soft Spot:** You need specific citations to back this up. If you can't name a paper that treats a pump as hard evidence, this objection sticks.

  ### 6. The "Progress" Argument
  **Who:** Grad Students
  **The Objection:** "But we *have* made progress. We distinguish doing vs. allowing, double effect, etc. These distinctions came from wrestling with these cases. That looks like progress to me."
  **The Reply:** "You've made progress in *mapping the landscape of intuitions*, not necessarily in mapping moral reality. We have a very sophisticated map of how English speakers react to stylized violence. That is interesting psychology, but it isn't necessarily ethical progress. It's taxonomy, not truth."
  **Soft Spot:** Defining "moral progress" is notoriously difficult. They may argue that conceptual clarity *is* a form of moral progress.

  ### 7. The Wittgensteinian Co-opt
  **Who:** The Wittgensteinian Colleague
  **The Objection:** "I agree with you, but for the right reasons. These are language games unmoored from forms of life. Why not just say all normative theory is nonsense and stop there?"
  **The Reply:** "I'm not a quietist. I think we can talk about morality, but we need to talk about it where it lives—in practices, institutions, and consequences. I want to save ethics from the thought experiment, not save it from itself. I'm proposing better games, not no games."
  **Soft Spot:** You risk alienating the agnostics if you sound too close to the Wittgensteinian "nonsense" claim. Keep the distance clear.

  ### 8. The Dennett Consistency Check
  **Who:** Sharp Grad Student
  **The Objection:** "Dennett coined 'intuition pump' but used them constantly in his own work. Are you saying Dennett was a bad philosopher? Or that pumps are usable if calibrated?"
  **The Reply:** "Dennett warned that they *can* be misused. He didn't say they are always invalid. My point is that the ethics literature ignores the calibration warning. I'm channeling Dennett's caution, not rejecting his toolbox. I'm asking for the safety labels to be read."
  **Soft Spot:** If they press you on *how* to calibrate a moral intuition pump, you need a concrete metric, which is hard to provide.

  ---

  ### The Question I'm Praying Nobody Asks
  **"If our intuitions are compromised by rhetorical framing, what non-intuitive foundation are you standing on to make that critique? Isn't your own argument relying on the intuition that 'methodological self-awareness is good'?"**
  *(Why this kills you: It attacks the epistemic foundation of your critique. If all intuition is suspect, your critique is suspect. If some intuition is reliable, you have to explain why yours is and the trolleyologist's isn't.)*

  ---

  ### One-Sentence Summary
  \answer{Thought experiments are rhetorical devices that simulate evidence, and until we treat them as pedagogical heuristics rather than epistemic data points, our ethical theories will remain artifacts of their own methodology.}
