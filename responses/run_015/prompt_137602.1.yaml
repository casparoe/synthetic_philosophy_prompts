answer: |-
  ### Notes to Instructor (Regarding your Setup)

  You asked me to flag ill-defined assumptions. **EK is vulnerable to the $N$ case in a way that might collapse the whole question if not handled carefully.**

  If $N$ ("no cognitive agents exist") is true at @, then by Factivity ($Kp \to p$), $N$ can only be known at a world $w$ if $N$ is true at $w$. But if $N$ is true at $w$, no agents exist at $w$. If no agents exist at $w$, no one knows anything at $w$. Therefore, $N$ is necessarily unknown. EK claims every actual truth is knowable at *some* situation. If $N$ is an actual truth, EK demands a situation where $N$ is known. This is a direct contradiction with Factivity and the meaning of $N$.

  **Is this a bug or a feature?** For this exam, it is a **feature**. Part (b) explicitly asks students to use $N$ to test restrictions. If a sharp student spots that EK simply *fails* for $N$ regardless of restrictions, that is a valid philosophical move. However, to prevent students from claiming the question is "broken" rather than answering it, I have tweaked the Question Sheet wording slightly to frame $N$ as a "limit case" for the *restriction* strategy, rather than asking them to validate EK itself.

  Below are the three deliverables.

  ***

  ### Deliverable 1: The Question Sheet

  **MA Seminar: Truth and Epistemic Modality**
  **Take-Home Final Examination**

  **Time Allowed:** 48 Hours
  **Word Limit:** 1,200 words (strict)
  **Total Marks:** 25

  **Instructions:** Answer all three parts (a, b, c). The logical setup below is fixed for the purpose of this exam. Do not challenge the rules (A)–(D), but critically evaluate the principles (SK) and (EK).

  **Logical Setup**
  **Operators:** $K$ ('it is known that'), $L$ ('it is possible that').
  **Rules:**
  (A) $Kp \to p$ (Factivity)
  (B) $K(p \land q) \to (Kp \land Kq)$ (Distribution)
  (C) $p \to LKp$ (Standard Knowability)
  (D) If $\vdash \neg p$, then $\vdash \neg Lp$ (Necessitation of Impossibility)

  **The Fitch Derivation:**
  Suppose $K(p \land \neg Kp)$. By (B), we get $Kp$ and $K\neg Kp$. By (A) on the second conjunct, we get $\neg Kp$, contradicting $Kp$. Thus, $\neg K(p \land \neg Kp)$. By (D), $\neg LK(p \land \neg Kp)$. Substituting $(p \land \neg Kp)$ into (C) yields $\neg (p \land \neg Kp)$, which is equivalent to $p \to Kp$ (Omniscience).

  **Alternative Principles**
  **(SK) Situated Knowability:** For every truth $p$, there is an accessible situation in which $p$ is known. All operators ($K$ and any $\neg K$ within $p$) are evaluated at that same situation.
  **(EK) Estranged Knowability:** For every proposition $p$ true at the actual situation (@), there is some possible situation $s$ (which may contain non-actual agents) where an agent knows $p$. Crucially, any ignorance clause within $p$ is anchored to @. The relevant instance of the knowability thesis is $p \to LK(p \land \neg K_{@}p)$.

  **The Hard Case**
  Let $N$ = "No cognitive agents ever exist." Assume $N$ is true at @. $N$ contains no knowledge operators. However, $N$ appears unknowable: any situation where $N$ is known requires a knower, making $N$ false in that situation.

  **Questions**
  **(a)** Run the Fitch derivation substituting (EK) for principle (C). Does the derivation succeed? If it fails, identify the exact step that breaks and explain why the anchoring in (EK) prevents the contradiction. (8 marks)

  **(b)** A proposed solution is to restrict the Knowability Principle to propositions that do not contain knowledge operators (or to "empirical" propositions). Use the case $N$ to test this restriction. Does excluding epistemic vocabulary save the thesis? If not, what specific property must the restricted class of propositions possess to avoid the collapse? (8 marks)

  **(c)** Propose a principled modification the moderate anti-realist can make to retain the spirit of anti-realism without entailing omniscience. What does this modification cost her? Specifically, does it abandon the universal scope of the knowability thesis, and is the distinction principled or ad hoc? (9 marks)

  ***

  ### Deliverable 2: Model Answer

  **(a) The Derivation and EK**
  Substituting (EK) into the Fitch derivation blocks the proof at the substitution step. The standard derivation relies on substituting the conjunction $(p \land \neg Kp)$ into the knowability principle. Under (SK) or standard (C), this yields $LK(p \land \neg Kp)$, where the ignorance clause $\neg Kp$ is evaluated at the same world as the knowledge operator $K$. This generates the contradiction $Kp \land \neg Kp$ within the scope of $L$.

  (EK) changes the anchoring. It proposes the instance $p \to LK(p \land \neg K_{@}p)$. Here, the ignorance clause is fixed to the actual world (@). If we assume the antecedent $(p \land \neg K_{@}p)$ is true, (EK) grants us $LK(p \land \neg K_{@}p)$. By factivity (A), in the possible world where this is known, it is true that $p$ and true that $\neg K_{@}p$. There is no contradiction here. The agent in the possible world knows $p$, and it remains true that no one at @ knows $p$. The contradiction $Kp \land \neg Kp$ only arises if the $K$ and the $\neg K$ are evaluated at the same index. (EK) decouples the world of verification from the world of ignorance. Therefore, the step deriving $\neg LK(p \land \neg Kp)$ via (D) fails, because the conjunction is no longer logically impossible, merely impossible-to-know-at-@.

  **(b) Testing Restrictions with $N$**
  Restricting the thesis to propositions lacking knowledge operators does not solve the problem, as demonstrated by $N$. $N$ ("No cognitive agents exist") contains no epistemic vocabulary. It is a purely ontological claim. Yet, if $N$ is true, it is unknowable. To know $N$, an agent must exist to bear the knowledge relation. If an agent exists, $N$ is false. Thus, $N$ is a truth that cannot be known in any situation where it is true.

  This shows that the problem is not merely self-reference or epistemic vocabulary; it is about **stability**. A restriction helps only if it limits the thesis to propositions whose truth values do not depend on the act of verification. Excluding "K" is insufficient because non-epistemic propositions can be verification-sensitive (like $N$). To succeed, the restriction must limit the domain to "Cartesian" propositions—those where $p$ is consistent with $Kp$. If the restriction is merely syntactic (no 'K' symbols), it fails against $N$. If it is semantic (truth must be compatible with being known), it avoids the contradiction but requires a prior account of which truths are stable, which risks circularity.

  **(c) The Moderate Anti-Realist's Position**
  The moderate anti-realist should abandon the universal quantifier ("all truths") in favor of a restriction to basic or fundamental truths. She should argue that $N$ and the Fitch conjunction are not basic truths but derive their status from more fundamental facts that *are* knowable. Alternatively, she may accept that some truths are unknowable but deny they are "real" truths in the anti-realist sense, treating them as idealizations.

  This costs her the universal scope of the original thesis. She can no longer say "truth is knowable" simpliciter, but only "fundamental truth is knowable." This is a significant retreat, as it concedes that the concept of truth outruns the concept of knowledge in complex cases. Is this principled? It is principled if one can independently define "fundamental" without referencing knowability. If the class of knowable propositions is defined simply as "those that don't cause paradox," the move is ad hoc ("whatever it takes to stop the proof"). A principled distinction requires a theory of truth-making where some truths (like $N$) supervene on knowable bases but are not themselves objects of knowledge. Without this, the anti-realist merely patches the leak without fixing the hull.

  ***

  ### Deliverable 3: Marking Scheme

  **Total: 25 Marks (5 Criteria x 5 Marks)**

  **1. Diagnosis of the Derivation Failure (Part a)**
  *   **5 marks:** Correctly identifies that the contradiction relies on $K$ and $\neg K$ sharing an index. Explains that (EK) anchors ignorance to @ while knowledge is at a possible world $w$, preventing $Kp \land \neg Kp$ arising in $w$.
  *   **Typical Blow-up:** Students claim the derivation works anyway, or argue that (D) fails without explaining why the conjunction isn't logically impossible.

  **2. Analysis of Anchoring (Part a)**
  *   **5 marks:** Explicitly notes that for (EK) to work, the knower in $w$ cannot be an actual knower (or knowledge must not imply existence at @). Recognizes that if the knower were actual, factivity would restore the contradiction.
  *   **Typical Blow-up:** Ignoring the "estranged" nature of the agents and treating $K$ as univocal across worlds.

  **3. The $N$ Counterexample (Part b)**
  *   **5 marks:** Correctly argues that $N$ contains no 'K' yet is unknowable. Demonstrates that syntactic restrictions (no epistemic vocabulary) fail because $N$ is ontological, not epistemic.
  *   **Typical Blow-up:** Claiming $N$ is "epistemic" because it mentions agents, missing the point that it lacks the *operator* $K$.

  **4. Modality vs. Domain Restriction (Part b/c)**
  *   **5 marks:** Distinguishes between narrowing the modality (changing $L$ to "feasible for us") vs. restricting the quantifier (changing "all $p$" to "stable $p$"). Argues that $N$ defeats domain restrictions based on vocabulary, requiring a semantic restriction (stability/Cartesian).
  *   **Typical Blow-up:** Conflating "changing the logic of possibility" with "changing the range of propositions." Failing to see that $N$ breaks both if not handled semantically.

  **5. Cost and Principled Distinction (Part c)**
  *   **5 marks:** Identifies the cost (loss of universality). Evaluates whether the fix is principled (independent theory of fundamentality) or ad hoc (gerrymandered to exclude paradoxes). Acknowledges uncertainty if the literature is unsettled.
  *   **Typical Blow-up:** Asserting a "solution" exists without acknowledging the loss of the universal claim. Name-dropping philosophers instead of analyzing the structural cost.
