      *   *Causal Proximity:* If the text *is* the tool for the harm (like handing a gun vs. writing a pamphlet saying guns are good), Mill leans toward regulation.
      *   *The Corn-Dealer Analogy:* Mill says you can publish that corn-dealers starve the poor (opinion), but you cannot shout it to an angry mob outside the dealer's house (instigation/action). The manual is closer to the latter if its *only* or *primary* function is the harmful act.
      *   *Instrumentality:* If the expression serves *only* as a mechanism to bypass rational deliberation and cause physical harm, Mill's defense of free speech (which relies on the marketplace of ideas and rational contestation) weakens. You can't argue against a frequency emitter; you can only stop it.

  4.  **Address the "Sentient Being" Question (Aquatic Invertebrates):**
