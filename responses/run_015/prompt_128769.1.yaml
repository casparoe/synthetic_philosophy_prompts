      *Wait, one nuance:* Mill says harm to others is the *only* justification. If the invertebrates don't count as "others," then society *cannot* restrict the manual based on harm to them. This is a crucial distinction. If they aren't "others," restricting the manual would be paternalistic (for the invertebrates? no) or purely moralistic. Actually, if they aren't "others," then harming them is a self-regarding action (or no one's business). This is a strong point to make.

      *Re-evaluating the "Others" status:* Mill explicitly links "harm to others" to the violation of "distinct and assignable obligation" or rights. Animals don't have rights in Mill's political framework in *On Liberty*. So, strictly speaking, harming them might not count as "harm to others" *for the purpose of the Harm Principle*. This is counter-intuitive but textually consistent with *On Liberty* vs *Utilitarianism*. I need to articulate this carefully.

      *Wait, let's look closer:* Mill says "harm to others." He doesn't explicitly say "human others" in the famous quote, but the context of "society," "authority," and "liberty" implies moral agents. In *Utilitarianism*, he includes animals in the moral calculus. In *On Liberty*, the focus is on the *authority of society over the individual*. Society consists of humans. Therefore, the "others" are members of society.
