      *   *Self-Regarding vs. Other-Regarding:* Actions affecting only oneself are absolute. Actions affecting others are subject to regulation.
      *   *Liberty of Thought and Discussion:* Absolute freedom of opinion/sentiment. Freedom of expression is practically inseparable from freedom of thought, *but*...
      *   *The "Positive Instigation" Exception:* Mill explicitly addresses the boundary between discussion and incitement. In Chapter II, he notes that even opinions lose immunity when expressed in circumstances that constitute a "positive instigation to some mischievous act." (The corn-dealer example).
