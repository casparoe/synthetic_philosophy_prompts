      *Regarding animals:* Mill does discuss animals in *Utilitarianism* (pain is pain), but *On Liberty* is about *rights* and *social authority*. Rights imply a capacity for claim-making or at least membership in the moral community. I should highlight this tension. The strict internal logic of *On Liberty* is human-centric regarding *rights*, even if the underlying utilitarianism is sentient-centric.

  7.  **Final Polish:** Ensure the distinction between "persuasion" (protected) and "enablement" (potentially restrictable) is clear. Ensure the distinction between "harm to humans" (protected by Harm Principle) and "harm to non-humans" (ambiguous in *On Liberty*) is clear.

      *Refining the "Manual" verdict:* Under Mill's logic, the manual is likely *not* protected opinion. It is an instrument.
