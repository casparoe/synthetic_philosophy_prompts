answer: |-
  Based on the verdicts and intuitions you have provided, here is a formulation of the principles governing your thinking, the necessary adjustments for a unified account, and the resulting predictions.

  ### The Principle of Coercive Cohesion

  To capture your verdicts while resolving the tension between structural inevitability and agentive contingency, I propose the **Principle of Coercive Cohesion**. This principle states:

  > **Revolutionary autocannibalism occurs when a regime, founded on a state of exception and a monopoly on defining political virtue, eliminates its own founders to resolve the contradiction between its universal ideals and its particular coercive practices. It ceases to be autocannibalism when the regime abandons the state of exception to pursue institutional normalization or military consolidation.**

  Under this principle, the explanatory framework shifts depending on the phase of the revolution, but the underlying mechanism remains structural:

  1.  **Girondins (1793):** Explained by **Class Struggle and Ideological Purification**. The structural pressure of war and sans-culotte demands made the elimination of the moderate bourgeois faction inevitable to maintain the coalition required for total war. Your intuition of inevitability is correct here; the machinery had no choice because the revolution's survival depended on radicalizing the base.
  2.  **Hébertists and Indulgents (1794):** Explained by **Ideological Purification**. Both groups threatened the Committee's monopoly on defining the "enemy." The mechanism is the same as the Girondins: the center must remain the sole arbiter of virtue. Your intuition that these are the same mechanism is correct.
  3.  **Robespierre and Thermidor (1794):** Explained by **Ideological Purification (Structural)**. For the simplest unified account, this must be viewed as the final stage of the Terror's logic. Once the external threats receded, the Terror required a final sacrifice to justify its own cessation. The "contingency" you perceive (Saint-Just's agility, the Law of Prairial) are merely the triggers, not the cause. The cause was the unsustainability of a government based on permanent emergency.
  4.  **Napoleon and the Directory (1799):** **Not Autocannibalism**. As you noted, the Directory had abandoned revolutionary radicalism for stabilization. Bonaparte was not purging a rival faction to save the revolution's soul; he was replacing a decayed institution with a military autocracy. This fits the principle's clause regarding "institutional normalization."

  ### Prediction: The Suppression of the Paris Commune (1871)

  Applying the **Principle of Coercive Cohesion**, the suppression of the Paris Commune by the Versailles government is **not** an instance of revolutionary autocannibalism.

  *   **Reasoning:** Consistent with your verdict on Napoleon and the Directory, the Versailles government (under Thiers) represented the consolidation of the bourgeois Third Republic and the restoration of state order, not the continuation of a radical revolutionary vanguard. The Commune was a new insurgent body, not a faction within the Versailles regime.
  *   **Verdict:** Just as Bonaparte's coup was a conquest of a decayed system rather than the system consuming itself, Versailles' shelling of Paris was the **state crushing an insurrection**, not a revolution devouring its children. The "revolutionary" moment (the radical republican impulse) had already fractured; Versailles acted as the force of normalization, analogous to the Directory or Napoleon, not the Committee of Public Safety.

  ### Required Overturn for the Simplest Unified Account

  To achieve the simplest unified account under the **Principle of Coercive Cohesion**, you must overturn your verdict regarding the **contingency of Robespierre's fall**.

  *   **The Conflict:** You currently view the Girondin purge as structurally inevitable but Robespierre's fall as contingent on specific mistakes (the Law of 22 Prairial, Saint-Just's hesitation). This creates a dualistic model where some purges are mechanical and others are political.
  *   **The Overturn:** You must accept that Thermidor was **structurally inevitable**. Just as the Girondins were sacrificed to radicalize the revolution, Robespierre was sacrificed to end it. The "executioner executed" pattern is not a mistake of leadership but the logical conclusion of a system where legitimacy is derived from purity. As the external threat vanished, the internal mechanism *had* to consume the architect of the Terror to allow the state to return to normalcy.
  *   **Why:** If you retain the idea that Danton or Robespierre could have survived through better maneuvering, you undermine the "structural" explanation you applied to the Girondins. A unified theory posits that the revolutionary apparatus *always* consumes the faction that no longer fits its current survival requirement (first moderation, then radicalism, finally the radical leadership itself).

  ### Necessity vs. Contingency

  Finally, regarding your question on whether this is a necessary structural feature or a contingent risk:

  Under the **Principle of Coercive Cohesion**, revolutions devouring their children is a **necessary structural feature** *specifically during the phase of radical state-building defined by emergency powers.*

  *   **Resolution of your Danton Counterfactual:** Your intuition that Danton *might* have saved the Revolution if he survived suggests contingency. However, the principle argues that while Danton the *man* might have survived, the *function* he represented (moderation) would still have been purged, or he would have been forced to become a tyrant himself to survive. The pattern is necessary because a regime based on "virtue through terror" cannot sustain itself once the emergency that justified the terror subsides.
  *   **Conclusion:** It is not a metaphysical law that applies to all revolutions forever (as shown by the Napoleon/Directory exclusion), but it is a structural necessity for any revolution that attempts to govern through a permanent state of exception. The "children" are not devoured because the leaders are evil or clumsy, but because the logic of the exception requires a fresh enemy to sustain its cohesion, until finally, the leadership itself becomes the only enemy left.
