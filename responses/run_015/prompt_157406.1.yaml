      *   *Aquaculture (Fish/Shrimp):* Variable density (tanks vs. net pens), water flow carries waste, chemical treatments/antibiotics, asphyxiation/ice slurry, decentralized ganglia (shrimp) vs. centralized (fish).
      *   *Roommate's Claims:* "Net pens = wild reef" (needs scrutiny), "Shrimp = smoke detector" (needs scrutiny regarding nociception).

  3.  **Step 2: Analyzing the Breaks in the Analogy:**
