prompt: |-
  I want to think through a practice that has always struck me as philosophically strange, and I would like you to reconstruct what it presupposes about meaning.

  The practice is statutory interpretation as it is actually done in common-law courts. As I understand it (correct me if I have the practice wrong, but I don't want the answer to turn on contested legal detail): when a dispute turns on what a statutory word means, courts apply something like a plain-meaning rule. Absent a statutory definition, ordinary words get their ordinary meaning, technical terms get their technical meaning, and judges routinely consult dictionaries and corpus evidence of ordinary usage, and other statutes, to establish it. Statutes frequently contain definitions sections, in which a term is defined by other terms of the statute, which are sometimes themselves defined further along. The meaning is treated as fixed at the time of enactment rather than as tracking later changes in usage. Where the term is a term of art, courts defer to the specialized community that uses it rather than to the general reader's sense of the word. And the ordinary-meaning inquiry is explicitly relativized to a readership: the meaning that competent speakers within the statute's intended audience would have taken the text to have. Finally, the whole apparatus has an escape hatch: a reading is abandoned, even when the words are clear, if it would produce absurd or cruel results.

  Here is what puzzles me. The practice looks, on its face, like an attempt to fix meaning entirely by symbol-to-symbol relations — a statute defining its terms by its other terms, judges consulting a book that defines words by other words, the inquiry stopping at the walls of the legal corpus. But the canonical illustration of the symbol grounding problem is precisely that a dictionary cannot do this: someone who did not already understand the language would cycle endlessly from one uninterpreted definition to another without ever touching anything nonsymbolic. So I want the implicit theory made explicit, and I want it made explicit in both directions.

  First, reconstruct it. What account of meaning does this practice only make sense under? Notice that the practice does not claim the statutory text is self-interpreting in the way a formal system is; it says the text means what a specified population of already-competent readers would have understood it to mean. That is not grounding in the demanding nonsymbolic sense — it looks more like a deliberate parasitism on meanings already in speakers' heads, with the legal system outsourcing grounding to the linguistically competent community and helping itself to the results. Is that the right way to describe it? And is it coherent, or does the outsourcing leave a hole exactly where hard cases live?

  Second, I want you to work with a distinction I have been using and tell me whether it survives. Call *anchoring* the fixation of which thing or which set of items a term picks out — by stipulation, by a definition, by a precedent that settles one concrete application — and call *grounding* the possession of a nonsymbolic capacity to identify further instances on one's own. My sense is that legal practice is very good at anchoring and indifferent to grounding: a definitions section anchors by fiat, and a line of precedents accumulates anchored exemplars. But does a sufficiently dense set of anchored exemplars *converge* on grounding, the way a large enough labeled sample can leave you with a capacity you could not have stated as a rule? Or does exemplar-anchoring merely postpone the question, since each new application still requires someone who can already tell whether the new case is like the old ones? Say which, and say what it would take to tell the difference.

  Third, the part I think is genuinely hard. Many of the terms statutes fight over are not the names of perceptible natural kinds whose grounding is the paradigm case; they are institutional or normative terms, whose content seems to be fixed by their role in a system of rules rather than by anyone's sensorimotor discrimination. If that is right, then the grounding demand may simply misfire for most of legal language, and the practice may be philosophically fine. But institutional terms typically piggyback on ordinary terms that do look grounded — the chestnut about whether a bicycle, or an e-scooter, or a toy car is a "vehicle" under a rule banning vehicles from a park is a dispute of exactly this shape. So: for which statutory terms does the grounding problem genuinely arise, for which is it a pseudo-problem, and is the boundary itself something the practice can mark, or only something we can mark from outside it? I would also like your view on what the absurdity escape hatch is doing: is it an admission that the symbol-to-symbol machinery has run off the end of the community's anchoring, or is it a separate normative principle with nothing to do with meaning?

  Finally, the replacement question. Suppose we dropped the implicit theory and required instead that statutory meaning be answerable to the nonsymbolic, experienced capacities of those who apply it, and not merely borrowed from a readership's prior understanding. Which devices of current practice would then become illegitimate or pointless — definitions sections, dictionaries, fixation of meaning at enactment, textualism itself? What would take their place, and what would we lose? I have a particular worry I want addressed: grounding, on the standard account, is a property of agents with sensorimotor histories, not of texts, and different interpreters are grounded differently. Does taking grounding seriously therefore trade the law's aspiration to a single public meaning for something irreducibly interpreter-relative, and is that a cost the practice could bear?

  Please be disciplined about the difference between what the practice strictly presupposes, what it merely sits well with, and what several rival theories of meaning would license equally — I suspect the practice is more underdetermined than it looks, and I would rather hear that than a tidy reconstruction. Where the symbol grounding literature has nothing to say about a question I have asked, say so rather than stretching it. I don't need citations, bibliographies, or a reading list; I know the standard sources, and I'm interested in the argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Core Topic:** Statutory interpretation in common-law courts (plain meaning, dictionaries, definitions sections, fixed at enactment, intended audience, absurdity doctrine).
      *   **Core Puzzle:** The practice looks like symbol-to-symbol manipulation (dictionaries defining words with words), which triggers the *symbol grounding problem* (Harnad). How does legal meaning avoid infinite regress?
      *   **Task 1 (Reconstruction):** What account of meaning does this practice presuppose? Is it "parasitism" on competent speakers? Is it coherent?
      *   **Task 2 (Anchoring vs. Grounding):** Use the user's distinction. *Anchoring* = fixing reference (stipulation, precedent). *Grounding* = nonsymbolic capacity to identify instances. Does dense anchoring converge on grounding? Or does it just postpone the need for a grounded agent?
      *   **Task 3 (Institutional vs. Natural Terms):** Many legal terms are institutional/normative, not natural kinds. Does grounding misfire here? What about hybrid terms (e.g., "vehicle")? Where does the grounding problem actually arise? What is the "absurdity escape hatch" doing (semantic failure vs. normative override)?
      *   **Task 4 (Replacement/Implications):** If we required genuine grounding (nonsymbolic capacity) rather than borrowed understanding, what breaks? (Definitions, dictionaries, textualism, fixation?). Does this lead to interpreter-relativity that destroys public meaning?
      *   **Constraints:** Be disciplined about presupposition vs. compatibility vs. underdetermination. Don't stretch symbol grounding literature where it doesn't apply. No citations/bibliographies. Focus on the argument.

  2.  **Analyze Task 1: Reconstruction of Meaning:**

      *   *Observation:* The user is right. Legal interpretation *does* look like a closed symbolic system (statutes define terms, dictionaries define words).
      *   *Symbol Grounding Problem (SGP):* A system of symbols only referring to other symbols has no semantic content (no aboutness).
      *   *Legal Solution:* The law explicitly outsources grounding. It doesn't claim the text *is* the meaning; it claims the text *encodes* the meaning held by a specific community at a specific time.
      *   *Theory:* This is a form of *Speaker Meaning* or *Communicative Content* theory, specifically a variant of Original Public Meaning. It presupposes a causal-historical link between the enactment and the linguistic practices of the community.
      *   *Coherence:* It is coherent *if* you accept that meaning is a social fact existing in heads/practices, not in ink. The "hole" isn't in the theory of meaning, but in the *epistemology* of accessing that meaning when the community's practice is vague or divided.
      *   *Verdict:* It is "deliberate parasitism." The law treats the text as a pointer to a pre-existing semantic network grounded in the lives of the populace.

  3.  **Analyze Task 2: Anchoring vs. Grounding:**

      *   *Definitions:* Anchoring = fixing extension (e.g., "Vehicle means any motorized transport"). Grounding = knowing a vehicle when you see one.
      *   *Convergence:* Does enough anchoring (precedents) create grounding?
      *   *Argument:* No. Precedents are still symbols (texts describing cases). A robot could memorize all precedents and still not know what a "vehicle" is in the sensorimotor sense.
      *   *The Human Element:* The "convergence" only works because the *judge* is already grounded. The precedents act as *calibration* for an already grounded agent.
      *   *Postponement:* Exemplar-anchoring postpones the question only if you think the *system* needs grounding. If the *agent* provides the grounding, the system just needs to constrain the agent.
      *   *Test:* To tell the difference, ask: Could a purely symbolic AI apply the precedents without external input? If no, then grounding is required from the agent. If yes (and it works), then anchoring was sufficient. (Spoiler: For hard cases, AI fails because it lacks the normative/sensorimotor intuition).

  4.  **Analyze Task 3: Institutional Terms & The Absurdity Doctrine:**

      *   *Natural vs. Institutional:* "Vehicle" (hybrid), "Due Process" (purely institutional/normative).
      *   *Grounding for Institutional Terms:* SGP usually focuses on sensorimotor grounding (cat, red). Institutional terms are grounded in *social practices* and *normative attitudes*, not just physics.
      *   *Does SGP Misfire?* Yes, partially. The "nonsymbolic" base for "contract" isn't a physical object; it's a pattern of behavior/expectation. But it still requires *experience* of that social world, not just dictionary definitions.
      *   *The Boundary:* The practice *cannot* mark this boundary well internally. It treats "vehicle" and "reasonable" similarly (look to usage). We mark it from outside.
      *   *Absurdity Hatch:* Is it semantic or normative?
          *   *View A:* It admits the semantic machinery failed (the anchored meaning leads to a contradiction in the normative system).
          *   *View B:* It's a normative override (we know what it means, but we won't apply it).
          *   *My Take:* It's often an admission that the *presupposed community understanding* could not have intended the absurd result. It's a claim about *meaning* (no one means *that*), not just policy. It saves the grounding link by assuming the community's grounding includes basic rationality.

  5.  **Analyze Task 4: Replacement (Requiring Genuine Grounding):**

      *   *Scenario:* Statutes must be answerable to nonsymbolic capacities of appliers, not borrowed understanding.
      *   *Consequences:*
          *   *Dictionaries:* Useless (symbols defining symbols).
          *   *Definitions Sections:* Suspicious (stipulation without grounded connection).
          *   *Fixation at Enactment:* Problematic. If grounding is in the *current* applier's capacity, meaning drifts as the world/grounding changes.
          *   *Textualism:* Collapses. Text is just a trigger for the grounded agent's intuition.
      *   *Replacement:* Radical Realism or Pragmatism. Focus on the *effect* of the rule in the world, judged by grounded agents. Maybe "standard of the reasonable person" becomes the primary source of law, not the text.
      *   *Relativity Risk:* Yes. Grounding is individual (my sensorimotor history != yours). Law requires public meaning.
      *   *Cost:* High. Law loses predictability and authority if meaning is irreducibly interpreter-relative. The current practice avoids this by positing a *fictional* unified community grounding ("The Reasonable Person").
      *   *Trade-off:* We sacrifice philosophical purity (true grounding) for institutional stability (shared anchoring).

  6.  **Synthesize and Refine:**

      *   *Tone:* Philosophical, rigorous, respecting the user's distinctions.
      *   *Check Constraints:* Did I distinguish presupposition from compatibility? Yes. Did I avoid citations? Yes. Did I address the SGP limits? Yes.
      *   *Key Insight:* The law isn't trying to solve SGP; it's *exploiting* the fact that judges are already grounded humans. The "system" is ungrounded, but the "operators" are grounded.
      *   *Refining the "Anchoring vs. Grounding" point:* Make sure to emphasize that precedents are *training data* for a grounded neural net (the judge), not a database for a symbolic AI.
      *   *Refining the "Institutional Terms" point:* Distinguish between *physical grounding* and *social grounding*. Institutional terms need the latter.
      *   *Refining the "Absurdity" point:* Frame it as a check on the *link* between text and community intent.

  7.  **Drafting the Response (Iterative mental check):**
      *   *Intro:* Acknowledge the sharpness of the SGP analogy.
      *   *Section 1 (Reconstruction):* Confirm "parasitism." It presupposes externalism (meaning is outside the text).
      *   *Section 2 (Anchoring/Grounding):* Anchoring doesn't converge on grounding. It converges on *consensus* among grounded agents. The judge provides the grounding.
      *   *Section 3 (Institutional Terms):* SGP needs expansion for social kinds. Absurdity doctrine is a semantic safety valve (presumption of rationality).
      *   *Section 4 (Replacement):* Textualism dies. Relativity increases. Law becomes more like equity.
      *   *Conclusion:* The practice is a pragmatic compromise, not a philosophical solution.

  8.  **Final Polish:** Ensure the distinction between "what the practice presupposes" and "what philosophy might say" remains clear. The user wants to know what the *practice* commits to, not just what is true. (Self-Correction: The practice commits to the *availability* of shared grounding, not necessarily the metaphysics of it.)

  9.  *(Final check against specific prompt requirements)*:
      *   Reconstruct account of meaning? Yes.
      *   Anchoring vs. Grounding distinction? Yes.
      *   Institutional terms & Absurdity? Yes.
      *   Replacement question & Relativity? Yes.
      *   Discipline on underdetermination? Yes.

