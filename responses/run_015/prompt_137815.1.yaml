answer: |-
  This is a sharp dissection of legal semiotics. You have correctly identified that statutory interpretation, viewed as a closed system of texts defining texts, is vulnerable to the same critique Harnad leveled at symbolic AI: without a connection to the nonsymbolic world, the symbols spin in a void.

  Here is the reconstruction of the practice, analyzed through your distinctions.

  ### 1. Reconstruction: The Theory of Borrowed Grounding

  You are right to describe the practice as "deliberate parasitism." The legal system does not attempt to solve the symbol grounding problem; it assumes the problem is already solved by the society it regulates.

  **The Presupposed Account of Meaning**
  The practice presupposes a form of **semantic externalism** combined with a **communicative theory of law**. It treats the statute not as a freestanding logical object, but as a speech act uttered by a legislature to a specific audience.
  *   **The Text is a Map, Not the Territory:** The text is treated as a set of instructions for retrieving meaning stored elsewhere. When a judge consults a dictionary, they are not looking for the *source* of meaning, but for a *report* on the meaning already existing in the linguistic community.
  *   **The Grounding Location:** The grounding is located in the heads and practices of the "competent speakers" at the time of enactment. The legal system posits a causal chain: The world affects the speakers -> Speakers encode understanding in words -> Legislature selects words -> Judges decode words using shared understanding -> World is affected by judgment.
  *   **Coherence:** This is coherent *provided* one accepts that meaning is a social fact rather than an intrinsic property of ink. The "hole" you suspect exists not in the theory of meaning, but in the **epistemology of access**. In hard cases, the presupposition that there *is* a single, stable, shared grounding in the community becomes empirically dubious. The practice masks this by treating the "objective meaning" as a normative construct (what they *should* have understood) rather than a purely descriptive one (what they *did* understand).

  **Verdict:** The practice presupposes that the interpretive community (judges) shares the same grounding as the enacting community. It outsources the nonsymbolic connection to the human beings in the courtroom, assuming their sensorimotor and social histories align sufficiently with the past to make the symbols "stick."

  ### 2. Anchoring vs. Grounding: The Convergence Question

  Your distinction is vital here. **Anchoring** fixes the extension (reference); **Grounding** provides the capacity to identify.

  **Does Anchoring Converge on Grounding?**
  No. A sufficiently dense set of anchored exemplars (precedents) does not generate grounding; it generates **constraint**.
  *   **The Symbolic Limit:** Precedents are themselves texts. A system that operates only on precedents is still operating on symbols defining symbols. You can have a million cases defining "vehicle," but if the agent applying them has no sensorimotor or social experience of what a vehicle *is*, they cannot apply the million-and-first case.
  *   **The Human Variable:** The convergence only *appears* to happen because the judges are already grounded agents. The precedents act as **calibration data** for a neural network (the judge's brain) that is already capable of perception and social reasoning. The precedents tune the judge's existing grounded capacities to align with the legal system's boundaries.
  *   **Postponement:** Exemplar-anchoring merely postpones the question of grounding to the moment of application. Each new application requires a human agent to say, "This new fact pattern is relevantly similar to that old one." That judgment of relevance is not found in the text of the precedent; it is an act of grounded recognition.

  **How to Tell the Difference:**
  To test whether you have grounding or just dense anchoring, ask: **Could a system without sensorimotor or social experience apply the rule?**
  *   If the answer is *yes* (e.g., a strict numerical threshold: "vehicles with >2 wheels"), you have successful anchoring that bypasses the need for deep grounding.
  *   If the answer is *no* (e.g., "reasonable care," "vehicle," "cruel"), then the rule relies on the agent's grounding. The law pretends the text does the work, but the work is actually done by the judge's capacity to simulate the community's reaction to the object.

  ### 3. Institutional Terms and the Absurdity Hatch

  This is the crux of the matter. The Symbol Grounding Problem (SGP) is typically framed regarding natural kinds (cats, red). Legal language is often institutional (contracts, rights, due process).

  **Where the Grounding Problem Misfires**
  For purely institutional terms, the demand for *sensorimotor* grounding is indeed a category error. "Due process" is not grounded in photon wavelengths; it is grounded in **social practices and normative expectations**.
  *   **Social Grounding:** Institutional terms require *social* grounding. To understand "contract," you must have experienced the practice of promising and exchange. This is still "nonsymbolic" in the sense that it is experiential, not definitional, but it is not perceptual.
  *   **The Hybrid Problem:** The grounding problem genuinely arises for **hybrid terms** (like "vehicle," "weapon," "premises"). These terms have a physical component (sensorimotor) and a functional/normative component (institutional). An e-scooter is physically distinct from a car, but functionally similar. The law fights here because the *physical grounding* (it looks like a toy) conflicts with the *functional grounding* (it acts like a transport). The practice cannot internally mark this boundary; it treats both as "ordinary meaning" inquiries. We mark it from outside by seeing where judges resort to policy arguments rather than linguistic ones.

  **The Absurdity Escape Hatch**
  What is the absurdity doctrine doing? It is not merely a normative override; it is a **semantic safety valve**.
  *   **Admission of Failure:** It admits that the symbol-to-symbol machinery (text + dictionary) has run off the end of the community's anchoring. It acknowledges that the *presupposed shared grounding* could not possibly have included the absurd result.
  *   **Presumption of Rationality:** It rests on the theory that meaning is determined by *intention*, and a rational agent (the legislature) could not intend an absurdity. Therefore, if the text yields absurdity, the text has been misread. It saves the theory of communicative meaning by sacrificing the literal text. It is an admission that the "borrowed grounding" from the community includes a baseline of rationality that trumps symbolic manipulation.

  ### 4. The Replacement Question: If We Required Genuine Grounding

  If we dropped the fiction of borrowed public meaning and required statutory meaning to be answerable to the nonsymbolic, experienced capacities of the applier:

  **What Breaks:**
  1.  **Definitions Sections:** These would become suspect. Stipulating that "person includes corporation" is a symbolic fiat. If grounding is required, we would have to ask: *Does the applier have the experiential capacity to treat a corporation as a person in this context?* If not, the definition is void.
  2.  **Dictionaries:** These would become illegitimate as authoritative sources. They are records of symbol-to-symbol relations. They could be used as evidence of usage, but not as determinants of meaning.
  3.  **Fixation at Enactment:** This would collapse. Grounding is a property of the *current* agent's interaction with the world. If meaning depends on the applier's nonsymbolic capacity, and the world (and the applier's experience of it) changes, the meaning changes. "Vehicle" in 1900 and 2024 relies on different sensorimotor schemas. Fixation assumes the *symbols* stay the same; grounding requires the *experience* to be relevant.
  4.  **Textualism:** Textualism would become impossible. Text is symbolic. If meaning is grounded in experience, the text is merely a trigger for the judge's grounded intuition. The "law" would reside in the judgment, not the statute.

  **What Takes Their Place:**
  You would move toward a radical **Realism or Pragmatism**. The primary source of law would not be the text, but the **standard of the grounded agent** (e.g., "The Reasonable Person"). Statutes would read less like code and more like mandates to achieve certain experienced outcomes (e.g., "Ensure safety" rather than "Install guards of height X").

  **The Cost: Interpreter-Relativity**
  You have identified the fatal flaw. Grounding is inherently individual. My sensorimotor history and social conditioning are not identical to yours.
  *   **Loss of Public Meaning:** Law aspires to a single public meaning to coordinate behavior. If meaning is grounded in the individual interpreter's capacity, the law fragments. One judge's grounded understanding of "cruel" differs from another's.
  *   **The Trade-off:** The current practice accepts a philosophical fiction (that text carries meaning) to secure an institutional good (predictability and authority). It pretends the grounding is in the book so that we don't have to admit it's in the judge.
  *   **Can the Practice Bear the Cost?** No. If you take grounding seriously, you lose the "Rule of Law" in the formalist sense. You gain flexibility and perhaps moral accuracy (judges applying their actual moral capacities), but you lose the constraint that comes from the text acting as an external anchor.

  ### Summary of the Underdetermination

  You asked for discipline regarding what the practice presupposes versus what is underdetermined.

  *   **Presupposed:** The practice *must* presuppose that there is a stable, shared semantic network in the community that the text can access. It *must* presuppose that judges are competent members of that network.
  *   **Compatible but not Required:** The practice is compatible with the idea that institutional terms have a different metaphysical status than natural kinds, but it doesn't require it. It treats them methodologically the same (look to usage).
  *   **Underdetermined:** The practice does not decide between "Meaning is the original community's grounding" vs. "Meaning is the current judge's grounding." It oscillates. When it suits stability, it claims fixation (original grounding). When it suits justice (absurdity doctrine), it claims current rationality (current grounding).

  **Final View:** The legal system is not a semantic engine; it is a political technology that uses semantic tools. It ignores the symbol grounding problem because its goal is not *truth* but *coordination*. It solves the regress not by grounding the symbols, but by threatening with force anyone who claims the symbols don't mean what the Court says they mean. The "grounding" is ultimately provided by the sheriff, not the dictionary.
