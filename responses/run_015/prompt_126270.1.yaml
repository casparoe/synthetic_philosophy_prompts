answer: |-
  Elena, the CFO of a mid-sized family manufacturing firm, faces a deadline to manually authorize a currency hedge via a stress-sensitive biometric terminal that rejects input if the user's heart rate variability indicates deliberative anxiety. Epistemically sufficient market data confirms belief $B$: "The hedge will execute successfully," yet if Elena forms $B$ by consciously weighing this evidence, her known neurosis regarding financial precision triggers a physiological stress response that causes her hand to tremble, failing the biometric scan and bankrupting the firm. However, if she forms $B$ solely because the livelihoods of her employees morally require her to proceed (a pragmatic reason), bypassing the evidential weighing entirely, her conviction remains physiologically calm, allowing her hand to remain steady, the scan to pass, and the firm to survive.

  **Mapping Reasons:**
  The **right-kind reasons (RKR)** are the market data and algorithmic projections, as they bear directly on the truth of the proposition that the hedge will succeed. The **wrong-kind reasons (WKR)** are the moral necessity of saving the firm and protecting employees' livelihoods, as these bear on the value of holding the belief rather than its truth.

  **Ethical Block and WKR Distinction:**
  The evidential path is ethically blocked not because the belief is false, but because the *process* of evidential weighing causally triggers the physiological failure (the tremor) that leads to harm. This does not collapse the WKR distinction into a generic conflict between epistemic and moral duty because in a generic conflict, the duties prescribe opposite doxastic attitudes (e.g., epistemic duty says believe $P$, moral duty says do not believe $P$). Here, both duties prescribe believing $B$; the tension is internal to the *normativity of belief formation*, challenging the claim that WKRs are never permissible bases for belief even when epistemically sufficient RKRs are available but dangerous to process.

  **Genuine Belief and Evidentialist Attack:**
  The feature making the pragmatic belief genuine is **functional integration**: the state eliminates doubt in the motor-cognitive system and guides action seamlessly, indistinguishable in effect from evidential belief. A defender of pure evidentialism would attack this feature by invoking **doxastic involuntarism**, arguing that a state adopted for pragmatic reasons without evidence-weighing is merely "acceptance" or "pretense," not genuine belief, because belief is by definition an involuntary cognitive tracking of truth indicators, not a voluntary tool for moral optimization.
