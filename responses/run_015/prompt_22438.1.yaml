      *   **Length:** 400-600 words.
      *   **Ending:** Agreement on where the real disagreement lies, even if unresolved.

  2.  **Drafting - Section by Section:**

      *   *Setting the Scene:* Briefly establish the empty room, late night.
      *   *Opening Salvo:* B (Critic) asserts Black's victory. A (Defender) pushes back on relational properties.
      *   *The Core Argument:*
          *   A argues that relations discern them (Sphere 1 is *here*, Sphere 2 is *there* relative to each other).
          *   B counters that the relations are symmetric. "Being 2 meters from the other" applies to both equally.
          *   A tries to individuate via the relation itself (being *this* distance from *that* sphere).
          *   B points out the circularity (presupposes individuation to define the property).
      *   *The Meta-Question:* Is this just about what counts as a property?
      *   *Conclusion:* They agree the fight is about whether numerical distinctness *is* a qualitative difference.

  3.  **Drafting - Attempt 1 (Mental Outline & Tone Check):**
      *   Need to sound academic but natural. Not too dry, not too casual.
      *   Avoid explaining PII from scratch. Assume knowledge.
      *   Focus on the "impure relational properties" vs. "pure relational properties" distinction.
      *   Word count check is crucial.

  4.  **Writing - Step-by-Step:**

