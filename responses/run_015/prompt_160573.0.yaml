  ### Interactive Sidebar: The Replication Crisis Decision Tree

  **Start Node (Fixed Scenario):**
  A medium-sized effect in social psychology has two dozen small published studies behind it. Finally, one big preregistered multi-site replication (N=thousands) returns an estimate indistinguishable from zero with a tight interval. The original author responds that the replicators dropped two unmeasured features of the original protocol.

  ---

  #### Node 1: The "Original Lab" Stipulation
  **Question:** Suppose you could rerun the original experiment in the original lab, with the original experimenters and the original subject pool, the week after the original, and it replicates perfectly every single time. It has never once replicated anywhere else. What does this convince you of?

  *   **A:** The effect is real but depends on hidden local factors (e.g., experimenter demeanor, local culture). *(Go to Node 2)*
  *   **B:** The original finding was likely an artifact or false positive unique to that setting. *(Go to Node 3)*

  > **Editor's Note on Evidence:** This node is hypothetical; no such data exists. It forces a stance on *generality* vs. *existence* without relying on statistical jargon. This is the single node doing the most sorting work, as it divides the "Real but Weird" camp from the "False Positive" camp.

  ---

  #### Node 2: The Funder's Choice (Required)
  **Question:** You have the budget to solve this context-dependency. Do you fund twenty more big replications of famous effects, or ten years of instrument-building for one construct?

  *   **A:** Ten years of instrument-building. *(Leaf 1)*
  *   **B:** Twenty more big replications. *(Leaf 2)*

  > **Leaf 1: Constructs and measurements are the real culprit.**
  > *   **Hardest Datum:** Explaining why the original lab can produce the effect reliably if the measure is broken.
  >
  > **Leaf 2: Effects are genuinely fragile and context-bound, so what we need is theory and measurement, not more replications.**
  > *   **Hardest Datum:** Reconciling the choice to fund replications with the conclusion that we need *fewer* replications. (Note: This path highlights a tension in the field: mapping boundaries often requires the very replications this camp critiques.)

  ---

  #### Node 3: Scope of Error
  **Question:** If the original finding was an artifact, does this pattern (Small Yes, Big No) invalidate just this effect or the whole literature?

  *   **A:** Just this effect; the system filtered the error eventually. *(Go to Node 4)*
  *   **B:** The whole literature; the corruption is systemic. *(Leaf 3)*

  > **Leaf 3: These literatures can't be salvaged, so the field should move on.**
  > *   **Hardest Datum:** Accounting for the few robust effects that *do* replicate across labs (e.g., basic cognitive priming).

  ---

  #### Node 4: Cause of the 24 Small Studies
  **Question:** Why did two dozen small studies find an effect if the big one found nothing?

  *   **A:** Researchers selectively reported data or analyzed until significant (Incentives). *(Go to Node 5)*
  *   **B:** The studies were too small to distinguish signal from noise (Power/Design). *(Go to Node 6)*

  > **Editor's Note on Evidence:** Without access to raw data from the 24 studies, distinguishing Bias (A) from Noise (B) is often empirically impossible. This node represents a major point of contention where evidence rarely settles the question.

  ---

  #### Node 5: The Statistical Fix
  **Question:** To fix the incentive problem, do we need to change how we reward researchers, or how we calculate evidence?

  *   **A:** Change the rewards (Incentives/Publication). *(Leaf 4)*
  *   **B:** Change the calculation (Stats Tools). *(Go to Node 7)*

  > **Leaf 4: It's the incentives and publication filter, not the math.**
  > *   **Hardest Datum:** Explaining why preregistration (an incentive fix) sometimes fails to improve replication rates in practice.

  ---

  #### Node 7: Priors vs. Estimates
  **Question:** If we change the calculation, which mathematical shift matters most?

  *   **A:** Incorporate prior probability (Bayes). *(Leaf 5)*
  *   **B:** Focus on uncertainty, not thresholds (Estimation). *(Leaf 6)*

  > **Leaf 5: Switch to priors and Bayes factors.**
  > *   **Hardest Datum:** Justifying the choice of subjective priors in a field struggling with objectivity.
  >
  > **Leaf 6: Stop testing and just report estimates with intervals.**
  > *   **Hardest Datum:** Convincing policymakers and journals to act on uncertain intervals rather than binary "significant" findings.

  ---

  #### Node 6: Severity vs. Correction
  **Question:** If the problem was low power/noise, does this mean the tests were flawed, or the system worked?

  *   **A:** The tests lacked severity (low power/design). *(Leaf 7)*
  *   **B:** The system is working as intended (filtering error). *(Leaf 8)*

  > **Leaf 7: The tests were never severe in the first place.**
  > *   **Hardest Datum:** Defining "severity" without resorting to the same statistical metrics being critiqued.
  >
  > **Leaf 8: This is just ordinary scientific self-correction and the crisis framing is overblown.**
  > *   **Hardest Datum:** Explaining why the "correction" took 40 years and required external intervention (the replication boom).

  ---

  ### Logical Space & Unoccupied Combinations

  **Unoccupied/Incoherent Combinations:**
  1.  **"Unsalvageable" + "Switch to Bayes":** If the literature is fundamentally corrupted (Node 3B), changing the statistical framework (Node 7) is treating a symptom of a terminal disease. This path is logically available but rarely occupied; those who believe the field is dead usually advocate for abandonment, not methodological reform.
  2.  **"Self-Correction" + "Incentives":** If the system is successfully self-correcting (Leaf 8), then incentives (Leaf 4) are not the primary driver of error. Occupying both leaves implies the system works *despite* the incentives, which is a nuanced but unstable position in this tree.

  **Indistinguishable Leaves:**
  *   **Leaf 7 (Tests Never Severe) vs. Leaf 8 (Self-Correction):** Both stem from the "Noise/Power" branch. The distinction relies on whether the reader views the Big Replication as a *rebuke* to the old methods (Severity) or a *fulfillment* of the scientific process (Correction). In practice, these positions often merge into "We need better power," making them hard to separate in a binary click-tree.

  **Node Where Evidence Doesn't Settle:**
  *   **Node 4 (Cause of the 24 Small Studies):** Distinguishing between p-hacking (Bias) and low-power noise (Chance) requires data transparency that rarely exists for the original 24 studies. Readers sort themselves here based on priors about researcher integrity, not on available evidence.

  **Most Sorting Work:**
  *   **Node 1 (The "Original Lab" Stipulation):** This node performs the heaviest lifting. It separates the ontological realists (the effect exists but is fragile) from the skeptics (the effect was an artifact). Every subsequent node branches from this fundamental disagreement about the nature of the phenomenon.
