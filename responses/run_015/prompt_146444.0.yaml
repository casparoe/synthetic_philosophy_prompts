answer: |-
  This is a sophisticated reconstruction, and you are right to sense that the "Karmic-Trajectory Consequentialism" (KTC) label walks a tightrope. It avoids the crude hedonic calculus of classical utilitarianism but risks collapsing into a form of rule-worship or epistemic agnosticism if pushed too hard.

  To answer your core question: **No, KTC does not necessarily collapse into Rule-Utilitarianism (RU), but it does cease to look like *welfare* consequentialism.** The divergence lies in the *telos* (the good being maximized) and the *locus* of evaluation (the world-state vs. the mental-continuum).

  Here is a breakdown of how these frameworks diverge in practice regarding your specific test cases, followed by an analysis of the "collapse" objection.

  ### 1. Wild-Animal Suffering: Aggregation vs. Soteriological Capacity
  **Standard Consequentialism (SC):**
  *   **The Problem:** If the good is aggregate welfare, wild-animal suffering is a moral catastrophe. The sheer volume of suffering in nature (predation, disease, starvation) dwarfs human suffering. SC implies a demanding obligation to intervene in ecosystems to minimize this suffering, provided the cost-benefit analysis holds.
  *   **The Demand:** This leads to the "implausible sacrifice" objection. You are obligated to divert resources from human projects to wild-animal welfare until marginal utility is equalized.

  **Karmic-Trajectory Consequentialism (KTC):**
  *   **The Shift:** The "good" is not the reduction of suffering *per se*, but the reduction of the *causes* of suffering (greed, aversion, delusion) within the mental continuum. Suffering (*dukkha*) is a diagnostic tool, not just a negative utility to be erased.
  *   **The Practice:** Intervening in wild-animal suffering is evaluated by how it affects the *agent's* trajectory and the *recipient's* karmic lesson.
      *   *Agent Side:* Alleviating suffering cultivates *karuṇā* (compassion), which improves the agent's trajectory. However, if the intervention is driven by aversion to suffering (wanting the world to be other than it is) or a savior complex (conceit), it degrades the trajectory.
      *   *Recipient Side:* In a karmic framework, an animal's suffering is the ripening of past volitions. Interfering might alleviate immediate pain but disrupt the karmic resolution required for that being's future trajectory.
  *   **Verdict:** KTC avoids the aggregation headache. You are not responsible for the sum total of suffering in the biosphere; you are responsible for your *relationship* to that suffering. The obligation is to cultivate a mind that can witness suffering without generating new defilements, and to act compassionately *when capacity allows*, without the utilitarian imperative to fix everything.

  ### 2. Moral Luck: Outcome vs. Intention (*Cetanā*)
  **Standard Consequentialism (SC):**
  *   **The Problem:** SC is notoriously vulnerable to moral luck. If I try to save a drowning child but slip and fail, the act is morally worse than if I succeed, even if my effort was identical. The external world dictates the moral value.

  **Karmic-Trajectory Consequentialism (KTC):**
  *   **The Shift:** In Buddhist psychology, *cetanā* (volition/intention) *is* karma. The moral weight lands on the quality of the volition, not the external fruition (*vipāka*).
  *   **The Practice:** If you intend to help (wholesome root) but fail due to external conditions (luck), your trajectory is still positively shifted because you reinforced a wholesome habit pattern. Conversely, if you accidentally help someone while motivated by greed (e.g., donating for tax evasion/social clout), your trajectory degrades.
  *   **Verdict:** KTC handles moral luck significantly better regarding *outcome* luck. However, it introduces **Soteriological Luck**: your current capacity to form wholesome intentions is conditioned by past karma. You might be "unlucky" to be born in a state where forming wholesome intentions is cognitively difficult. But this is viewed as a field condition to be worked with, not a moral judgment on the act itself.

  ### 3. Epistemic Opacity and Demandingness
  **The Objection:** You asked if KTC pushes evaluation into an "opaque future-state space."
  *   **SC:** We can't predict all consequences (the "cluelessness" objection).
  *   **KTC:** This is worse. We cannot see rebirths, and we cannot easily introspect the subtle seeds (*bīja*) planted in the *ālaya-vijñāna* (storehouse consciousness). How can we optimize a trajectory we cannot measure?

  **The Buddhist Solution (and where it looks like Rules):**
  Buddhism admits this opacity. That is why it relies on **Heuristics (Precepts/Vinaya)** rather than act-by-act calculation.
  *   We know generally that killing reinforces aversion and fear. We don't need to calculate the specific karmic outcome of *this* murder.
  *   **Differing from SC:** SC uses rules as proxies for welfare maximization (Rule-Utilitarianism). KTC uses rules as **training protocols (*sikkhā*)**.
  *   **Differing from RU:** In RU, if breaking a rule clearly maximizes welfare, you should break it. In KTC, breaking a precept is almost always a net loss for the *agent's* trajectory, even if it saves lives, because it reinforces the delusion that "ends justify means" (a form of conceptual proliferation, *papañca*). The *Bodhisattva* exceptions exist (e.g., killing a murderer to save many), but these are reserved for those with high enough realization to know they aren't acting from aversion. For the ordinary agent, the rule holds.

  ### 4. Does it Collapse into Rule-Utilitarianism?
  This is the crux of your seminar prep. Here is the distinction:

  **Rule-Utilitarianism (RU):**
  *   **Justification:** Follow Rule R because following R generally maximizes **Aggregate Welfare (W)**.
  *   **Value:** External state of affairs (happiness/preference satisfaction).
  *   **Agent:** Interchangeable vessel for utility production.

  **Karmic-Trajectory Consequentialism (KTC):**
  *   **Justification:** Follow Rule R because following R generally reduces **Defilement (Klesha)** in the **Mental Continuum (C)**.
  *   **Value:** Internal ontological shift (movement toward Nirvana/Bodhi).
  *   **Agent:** The specific locus of transformation. You cannot substitute your continuum for mine.

  **The Collapse Test:**
  If you operationalize KTC, does it become "Follow the Precepts because they maximize long-term mental stability"?
  *   **Yes,** functionally.
  *   **No,** metaphysically.

  It avoids collapsing into RU because the "utility" being maximized is **non-aggregative**. In RU, my happiness can offset your suffering. In KTC, my mental purity cannot offset your mental defilement. We are not summing a total; we are optimizing individual trajectories that are causally linked but distinct.

  Therefore, KTC is better understood as **Consequentialism of the Path** (a la Charles Goodman) hybridized with **Virtue Ethics**. It is consequentialist regarding the *goal* (Nirvana), but virtue-ethical regarding the *method* (cultivating character traits that lead there).

  ### 5. Vulnerability: The "Long-Range Optimizer" Charge
  You asked which framework is more vulnerable to the charge that it asks ordinary agents to be long-range optimizers of mental states they can barely introspect.

  *   **SC** is vulnerable to the **Demandingness Objection**: It asks you to sacrifice your life projects for the aggregate.
  *   **KTC** is vulnerable to the **Elitist/Esoteric Objection**: It asks you to optimize a mental state (non-attachment) that is paradoxical (trying to become non-attached is a form of attachment) and relies on metaphysical claims (rebirth) that are unverifiable.

  **However,** KTC has a built-in defense: **Skillful Means (*Upāya*).**
  Buddhist ethics is tiered.
  1.  **Ordinary Level:** Follow rules, avoid bad rebirth, cultivate basic generosity. (Matches common sense morality).
  2.  **Advanced Level:** Optimize for emptiness, transcend rules if compassion demands it.
  This tiered structure protects the ordinary agent from the "long-range optimizer" burden. You don't need to calculate karmic trajectories across eons; you just need to keep the Five Precepts and practice mindfulness. The "optimization" is handled by the Dharma itself, not the agent's calculation.

  ### Summary for your Seminar
  If you present KTC as a reconstruction, emphasize these three divergences from Standard Consequentialism:

  1.  **Non-Aggregation:** The good is not a sum of welfare across beings, but the quality of the causal stream within beings. This dissolves the wild-animal suffering aggregation problem.
  2.  **Intentional Locus:** Moral worth tracks volition (*cetanā*), not external outcome, mitigating moral luck.
  3.  **Instrumental Rules:** Precepts are not welfare-maximizing rules (RU) but **ontological training constraints**. They are not broken even for good outcomes unless the agent has transcended the duality of "breaker/broken."

  **The Trap:** The reconstruction fails if you define "Karmic Trajectory" simply as "Long-term Happiness." If the *telos* is just hedonic stability over rebirths, it *is* just Rule-Utilitarianism with a longer time horizon. To remain distinctively Buddhist, the *telos* must be **Liberation (*Nirvana*)**, which is the cessation of the trajectory itself.

  This makes KTC a **Self-Effacing Consequentialism**: The goal is to optimize the trajectory until the trajectory (and the optimizer) no longer exists. That is a feature no Western consequentialist system can replicate without contradiction.
