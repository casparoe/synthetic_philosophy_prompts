          *   *Marcus:* The constraint isn't the math; it's the assumption of Poincaré invariance. If you assume SR, you get the group. If you assume quantum mechanics, you get Hilbert spaces. The intersection is inevitable, not miraculous.

      *   **Exchange 3: Predictive Power (Spin-Statistics/Antiparticles).**
          *   *Elena:* It's not just classification. The framework *demands* antiparticles and fixes the spin-statistics connection. You can't just define those away. The math forces physical consequences we didn't put in by hand.
          *   *Marcus:* Those come from QFT (locality + causality), not just Wigner's 1939 group theory. Wigner classifies single particles. Antiparticles require fields. Don't conflate Wigner's classification with the full machinery of QFT.

      *   **Exchange 4: The "Why Symmetry?" Question.**
          *   *Elena:* Okay, even if we separate QFT, the single-particle state space *is* an irrep. The mystery is why spacetime symmetry dictates internal quantum numbers like spin. Spin isn't spatial rotation in a literal sense, yet it falls out of the Lorentz group.
          *   *Marcus:* But spin *is* spatial rotation in the rest frame. It's not "internal" in the way charge is. It's kinematic. The mystery dissolves if you accept that "elementary" means "no internal structure relative to spacetime transformations."

      *   **Exchange 5: The "No Internal Structure" Clause.**
          *   *Elena:* That's the crux. Why should nature respect that notion of "elementary"? Why should the universe care about our mathematical criterion of irreducibility? It turns out composite systems (atoms) don't follow this simply, but fundamental ones do. That selection is the miracle.
          *   *Marcus:* It's a selection effect. We look for things that *do* behave simply. If protons didn't look like irreps at low energy, we wouldn't call them elementary. We zoom in until things look like irreps. It's a methodological filter, not an ontological revelation.

      *   **Exchange 6: The Mass Gap/Zero Mass distinction.**
          *   *Elena:* But the specific structure of the little group for massless particles (E(2) vs SO(3)) dictates helicity vs spin. We didn't choose that. Nature could have had massless particles with continuous spin degrees of freedom. The math forbids it. That's a restriction on reality, not just a label.
          *   *Marcus:* True, the math forbids it *given the assumptions*. But the assumption of finite degrees of freedom is physical. If nature had continuous spin photons, we'd have changed the math or the definition of "particle." The "forbidding" is conditional on our prior physical intuitions.

      *   **Exchange 7: Synthesis/Sharpening.**
          *   *Elena:* So you see the assumptions as contingent human choices. I see the *rigidity* of the consequences once assumptions are made as the revelation. The space of possible consistent theories is tiny.
          *   *Marcus:* I see the space of *descriptions* we find intelligible as tiny. We can't think outside Poincaré invariance easily.
