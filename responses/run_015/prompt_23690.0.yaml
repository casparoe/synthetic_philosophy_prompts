      *   *Speaker B (Let's call him Marcus):* Pragmatic theoretical physicist or logical empiricist. Focuses on model-building and definitions. Sees the math as a tool constrained by empirical input.

  3.  **Drafting - Exchange by Exchange:**

      *   **Exchange 1: Setting the Stage.**
