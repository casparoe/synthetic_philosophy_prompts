      *   **Closing Question:**
          *   "If the agent knows the sequence in advance, what specific cognitive capacity must they lack for the pump to succeed?" (Answer: Capacity for pre-commitment/resolute planning vs. myopic choice).
          *   Better: "Imagine the agent is told at 9 AM the sequence of offers. At 10 AM, offered A for C+$\epsilon$, why *must* they accept if they are money-pumpable?"

      *   **Scope:**
          *   Yes, exclude deep dynamic consistency debates (Bratman vs. McClennen) and Representation Theorems (von Neumann-Morgenstern axioms derivation). Keep it pragmatic.

  4.  **Refining the Table:**
