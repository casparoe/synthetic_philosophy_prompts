  6.  **Self-Correction/Nuance Check:**
      *   *Transitivity vs. Acyclicity:* A 3-cycle pump strictly proves you shouldn't have cycles. Transitivity implies acyclicity. If you ban cycles, do you get transitivity? Not necessarily (you could have $A \succ B$, $B \succ C$, and $A ? C$). But standard EUT assumes transitivity. I need to make sure the plan notes that the pump *motivates* transitivity, but strictly speaking, it targets cyclicity. I will instruct the user to make this distinction clear in the "What it Proves" section.
      *   *Completeness:* Pumping incompleteness is trickier. If $A ? B$, you need to assume the agent pays to switch from A to B *and* B to A. This requires a "strict preference for swapping" premise which is controversial. I should advise the user to treat Completeness as a "secondary" target of the pump in this session, focusing mainly on Transitivity/Cyclicity to avoid confusion, while noting the misconception that it *automatically* covers completeness.
      *   *The "Refusal" Reply:* The strongest reply is that a rational agent anticipates the pump and refuses the first trade (Backward Induction). The counter-counter is that this requires a specific theory of dynamic choice (Resolute Choice/Planning) which violates Consequentialism or Separability. I need to make sure the plan doesn't get bogged down here but identifies the *condition* for the reply (ability to plan).

