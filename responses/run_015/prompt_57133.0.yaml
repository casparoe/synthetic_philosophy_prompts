  You're conflating the cost of refusing the *offer* with the cost of refusing the *situation*. My view doesn't say consent is valid just because someone handed you a pen; it says consent is valid when the interaction itself doesn't slam the door shut. In your trial, the sponsor isn't locking the exit; the labor market is. That's a grotesque background condition, absolutely, but it doesn't make the specific act of consent invalid. It makes the *necessity* of the choice tragic. If we invalidate consent every time someone is desperate, we don't protect them—we just remove their ability to negotiate a way out of the desperation. The validity of the signature isn't a moral verdict on the landlord.

  That "pay them less" conclusion only follows if you think the cost of refusal is the money left on the table. It isn't. It's the penalty attached to walking away. When I offer you $4,500, refusing me costs you the gain; when I threaten you, refusing me costs you your safety. One is a missed opportunity, the other is an inflicted wound. Lowering the payment doesn't make the exit cheaper, it just makes the bridge narrower. You're asking me to treat a lifeline like a leash. The way to lower the cost of refusal isn't to shrink the offer, it's to broaden the baseline so walking away doesn't mean destitution.
