prompt: |-
  I am a fourth-year PhD student in molecular systems biology and, because I am the methods person in my group, I chair the weekly hypothesis-triage meeting. Once or twice a week someone brings in a newly formulated explanatory hypothesis — usually a proposed mechanism for a phenomenon we have already measured — and the meeting has to decide whether to redirect a month of a postdoc's time toward it, with the PI signing off at the end. Our recurring failure is that we treat the findings a hypothesis was built to fit as though they confirmed it: someone reverse-engineers a mechanism out of data already in the lab notebook, and because the mechanism accommodates that data neatly, we treat it as well supported and commit resources to it. I have been reading about the problem of old evidence in Bayesian confirmation theory — roughly, that once a finding is already known, it cannot raise a theory's probability by the usual machinery, and that the proposed repairs involve replacing the actual prior with a hypothetical one fixed before the evidence was in hand. I want whatever is salvageable in that discussion turned into a one-page procedure my lab can actually run in forty minutes, written for people with no training in formal epistemology and no tolerance for jargon.

  What I need from you is the procedure itself, in a fixed order, and then its application. Specifically:

  1. A numbered sequence of questions, each with a statement of what counts as a sufficient answer and where the procedure terminates with no support. The steps should be runnable with the materials a lab actually has: the hypothesis as stated, the old findings it is supposed to explain, the lab's current rival hypotheses, and whoever is in the room.

  2. A way of sorting the old findings by provenance before any weight is assigned. I have in mind four categories — findings that were inputs to the construction of the hypothesis; findings the hypothesis was adjusted to fit after it was first stated; findings everyone already knew but that the proposer did not consult; and findings that were anomalous for the reigning model — together with a rule for what each category is worth, and for what happens when a finding falls into more than one.

  3. A usable substitute for the hypothetical prior. My idea is a blinded rebuild: someone who did not help construct the hypothesis writes down, before being shown how well it fits, what they would expect such a hypothesis to predict. Tell me how to run this honestly in a six-person lab where everyone has already seen the data, how to record the result so it cannot be quietly revised afterwards, what to do when no genuinely uninvolved person exists, and how much weight the outcome of the rebuild should carry relative to the rest of the procedure.

  4. A rule for the case where several live hypotheses in the lab's register accommodate the same finding. I do not want a likelihood ratio nobody can compute; I want something a group can apply by counting and arguing, including guidance on when the rival set is too poorly specified to count at all.

  5. An explicit stop rule and an expiry. The procedure should say when old evidence is enough to justify a bet of a person-month and when it is not; require whatever novel test it licenses to be named, with a prediction stated in advance and a date; and say what happens to the hypothesis when that date passes.

  6. The places where judgment cannot be eliminated, marked as such rather than disguised as steps — in particular any place where the decision turns on how much our group values explanatory unification versus predictive novelty, and any place where the procedure has to appeal to the honesty of records we may not have kept.

  Please also add a short closing paragraph on what the procedure cannot do: whether it can yield a number without manufacturing spurious precision, what it assumes about the completeness of the rival set, and whether it can ever substitute for a genuinely new test.

  Then run the procedure on three cases from our own area, showing the steps as you go rather than jumping to verdicts. First: a postdoc proposes that a metabolite produced by a gut bacterium explains a diet effect we published last year, where the metabolite was selected out of an untargeted screen precisely because it was elevated in exactly the condition where the effect is strongest. Second: a visitor proposes, by analogy with a structure characterised in a related organism, that our protein of interest forms condensates — a proposal made before anyone looked — which turns out to explain a two-year-old anomaly, a subpopulation of cells that the reigning kinetic model says should die but does not, and to explain it without new parameters. Third: the lab's own flagship hypothesis, the one on which the PI's grant renewal is built, whose only support is a pattern we have known for three years, which the hypothesis was written to fit, which a competing model from another group also reproduces after a single tweak, and which required two auxiliary assumptions to accommodate. Run the third case straight and give me the result even where it is one I would rather not take into the meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** 4th-year PhD student in molecular systems biology, methods person, chairs hypothesis-triage meetings.
      *   **Problem:** The lab commits resources (postdoc months) to hypotheses that merely *accommodate* old evidence (data already in hand), treating accommodation as confirmation (the "problem of old evidence").
      *   **Goal:** A one-page procedure (runnable in 40 mins) based on Bayesian "problem of old evidence" insights but stripped of jargon, tailored for a lab setting.
      *   **Specific Requirements:**
          1.  Numbered sequence of questions (with pass/fail criteria).
          2.  Sorting old findings by provenance (4 categories + weighting rules).
          3.  Usable substitute for "hypothetical prior" (Blinded Rebuild method + logistics).
          4.  Rule for competing hypotheses (counting/arguing, not likelihood ratios).
          5.  Explicit stop rule and expiry (when to bet, novel test requirement, sunset clause).
          6.  Marked judgment calls (where honesty/values matter).
          7.  Closing paragraph on limitations (precision, rival set completeness, necessity of new tests).
          8.  **Application:** Run the procedure on three specific cases (Metabolite/Gut, Condensates/Visitor, Flagship/Grant).

  2.  **Deconstruct the "Problem of Old Evidence" for a Lab:**
      *   *Bayesian Theory:* $P(H|E) = P(E|H)P(H) / P(E)$. If $E$ is known, $P(E) = 1$, so $P(H|E) = P(H)$. No confirmation.
      *   *Lab Reality:* We *have* to use old data to screen ideas before spending money on new experiments. We can't ignore old data, but we can't treat fitting it as proof.
      *   *Solution:* We need to simulate *novelty*. We need to assess how *surprising* the fit is, given what we knew before the hypothesis was constructed.
      *   *Key Mechanism:* The "Blinded Rebuild" (Requirement 3). This simulates the counterfactual: "If we hadn't known this data, would we have predicted it?"

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Provenance Sorting.* Need to categorize the data points supporting the hypothesis.
          *   Categories: Inputs (Construction), Adjustments (Fitting), Background (Known but unused), Anomalies (Unexplained by old model).
          *   Weighting: Inputs = 0 weight. Adjustments = Penalty. Background = Low weight. Anomalies = High weight.
      *   *Step 2: The Blinded Rebuild.* How to do this in a small lab where everyone knows the data?
          *   *Idea:* Write down predictions *before* seeing the fit.
          *   *Constraint:* Everyone knows the data.
          *   *Fix:* Focus on *specificity*. Not "does it fit?", but "how many parameters did it take?" or "would a generic version of this idea predict this specific number?"
          *   *Refinement:* The prompt suggests "someone who did not help... writes down... what they would expect." If everyone knows the data, they must write down what they would expect *from the mechanism alone* without peeking at the specific data values during the prediction phase. Or, use a "Pre-Mortem" approach. Let's stick to the prompt's idea: A designated scribe records the *prediction range* before the fit is demonstrated.
      *   *Step 3: Rival Counting.* How many other stories fit this?
          *   Count distinct mechanisms. If >2, lower confidence.
      *   *Step 4: The Bet.* Stop rule. Needs a novel prediction.
      *   *Step 5: Judgment Calls.* Explicitly mark where values enter (e.g., how much we care about simplicity vs. fit).

  4.  **Refining the Steps for the "One-Page" Constraint:**
      *   Needs to be tight. No fluff.
      *   Language: Direct, imperative, lab-focused.
      *   Time limit: 40 mins.

  5.  **Addressing Specific Requirements:**

      *   *Req 1 (Questions):* Make them gates. If you fail Gate 1, stop.
      *   *Req 2 (Provenance):* Define the 4 categories clearly. Assign "Credit Scores."
      *   *Req 3 (Blinded Rebuild):* This is the trickiest. In a 6-person lab, everyone knows the data.
          *   *Solution:* The "Sealed Envelope" method. Before the meeting, the proposer sends the *mechanism* (without the fit results) to one colleague. That colleague writes down: "If this mechanism is true, what is the *minimum* specific prediction it makes?" Then compare to data.
          *   *Wait, better:* The prompt asks for a substitute for the hypothetical prior. The core issue is *overfitting*. The "Blinded Rebuild" should be: "State the prediction *before* showing the overlay."
          *   *Actually, the prompt says:* "someone who did not help construct the hypothesis writes down, before being shown how well it fits, what they would expect such a hypothesis to predict."
          *   *Implementation:* Since everyone knows the data, the "blind" is on the *hypothesis's specific claim*, not the data. The colleague writes: "Based on mechanism X, I expect Y." Then the proposer reveals: "The hypothesis claims Z." If Y ≈ Z, good. If Z was tuned to match data, Y will be vague.
          *   *Weight:* High. This is the core novelty simulation.
      *   *Req 4 (Rivals):* Count them. If rivals exist, the support is split.
      *   *Req 5 (Stop/Expiry):* Must name a new experiment. Must set a date. If failed by date, hypothesis is archived (not killed, but deprioritized).
      *   *Req 6 (Judgment):* Box these steps.

  6.  **Developing the Three Cases:**

      *   *Case 1 (Metabolite):* Data was used to find the metabolite. This is "Input/Construction."
          *   *Verdict:* Fails provenance check. Zero credit for fit. Needs strong blinded prediction.
      *   *Case 2 (Condensates):* Visitor proposal. Explains old anomaly. No tuning.
          *   *Verdict:* High provenance score (Anomaly). Blinded rebuild likely strong (mechanism implies condensates). Rivals? Maybe. Strong candidate for funding.
      *   *Case 3 (Flagship):* Known pattern, written to fit, rivals exist, auxiliary assumptions needed.
          *   *Verdict:* Fails almost everything. Inputs = Construction. Rivals = Yes. Aux assumptions = Penalty.
          *   *Result:* Do not fund new postdoc time based on this. Need novel prediction immediately or shelve.

  7.  **Drafting the Content (incorporating tone and constraints):**
      *   Tone: Professional, rigorous, slightly skeptical (appropriate for a methods chair).
      *   Format: Clear headings, numbered lists.
      *   Jargon Check: Ensure "Bayesian," "Prior," "Likelihood" are removed or explained simply.

      *(Self-Correction during drafting)*: I need to make sure the "Blinded Rebuild" is practical. If everyone knows the data, how do they write a prediction without being influenced?
      *   *Fix:* The colleague receives the *mathematical/structural form* of the hypothesis without the parameter values fitted to the data. They calculate/estimate the outcome based on first principles or literature values *independent* of the lab's specific dataset.
      *   *Alternative:* The prompt says "before being shown how well it fits." This implies the colleague sees the hypothesis, then predicts, *then* sees the fit. Even if they know the data, they must commit to a prediction derived from the *theory*, not the *data*. If the theory is vague, they can't make a tight prediction. This exposes overfitting.
      *   *Decision:* I will specify that the reviewer must state a *numerical range or qualitative outcome* derived *only* from the mechanism's logic, recorded in the meeting minutes before the fit is displayed.

  8.  **Final Review against Constraints:**
      *   One-page procedure? (Will keep it tight).
      *   40 mins? (Steps must be quick).
      *   No jargon? (Check).
      *   Three cases run through? (Check).
      *   Closing paragraph on limitations? (Check).

  9.  **Writing the Response:** (Proceeding to generate output based on these thoughts).
      *   *Structure:*
          1.  Procedure Title & Preamble.
          2.  The 5-Step Protocol.
          3.  The Provenance Matrix.
          4.  The Blinded Rebuild Instructions.
          5.  The Rival Count.
          6.  Stop Rule & Expiry.
          7.  Judgment Calls.
          8.  Limitations Paragraph.
          9.  Case Studies (1, 2, 3).

      *   *Refining the "Blinded Rebuild" for a small lab:* Since everyone knows the data, the "blind" is on the *specificity of the claim*. The reviewer writes: "Mechanism X implies Outcome Y." If Mechanism X is flexible, Y is "anything." If Mechanism X is rigid, Y is "5.2 +/- 0.3." We compare the *tightness* of the prediction to the *tightness* of the fit.
      *   *Actually, let's follow the prompt's instruction closely:* "someone... writes down... what they would expect such a hypothesis to predict."
      *   *Logistics:* Use a shared document with edit locking or physical paper collected in an envelope.

      *   *Refining Case 3:* This is the political landmine. The procedure must hold firm. If the procedure says "No," the output must say "No," even if it's the PI's grant hypothesis. The prompt asks to "give me the result even where it is one I would rather not take into the meeting." I must be objective.

      *   *Limitations:* Acknowledge that this doesn't generate truth, only risk assessment. It assumes rivals are known (they aren't always). It doesn't replace new data.

      *(Self-Correction on Case 3)*: The prompt says "Run the third case straight and give me the result even where it is one I would rather not take into the meeting." This implies the result might be negative for the flagship hypothesis. I need to ensure the procedure is robust enough to output that negative without waffling.

      *(Final Polish)*: Ensure the distinction between "Construction Inputs" and "Background Knowledge" is clear in the Provenance section. Ensure the "Expiry" is actionable (archive, not delete).

      Let's assemble.
answer: |-
  # The Old-Evidence Triage Protocol (OETP)

  **Purpose:** To prevent the lab from spending person-months on hypotheses that merely describe data we already have.
  **Time Limit:** 40 Minutes.
  **Materials:** Whiteboard, timer, sealed envelopes (or edit-locked digital doc), lab notebook access.

  ### 1. Provenance Sorting (10 Minutes)
  List every finding the hypothesis claims to explain. Assign each to one of four categories. **If >50% of the support falls into Category A or B, terminate immediately.** No resource allocation.

  *   **A. Construction Inputs:** Data used to build or select the hypothesis (e.g., screening data that identified the candidate). **Value: 0.**
  *   **B. Post-Hoc Adjustments:** Data the hypothesis was tweaked to fit after initial formulation (e.g., adding a parameter to match a curve). **Value: -1 (Penalty).**
  *   **C. Background Knowledge:** Data everyone knew, but the proposer did not consult during construction. **Value: 0.5.**
  *   **D. Standing Anomalies:** Data known to contradict the previous reigning model, now explained by this one. **Value: 1.0.**

  *Rule for Overlap:* If a finding fits multiple categories, assign the one with the *lowest* value. (e.g., Anomaly used for Construction = Input).

  ### 2. The Blinded Rebuild (10 Minutes)
  *Goal: Simulate a "hypothetical prior" by testing the mechanism's rigidity.*
  **Logistics:** Select one attendee who did not help write the hypothesis. If none exist, the Chair acts as proxy.
  **Action:**
  1.  Proposer states the *mechanism* only (no fit plots, no parameter values).
  2.  Reviewer writes down a specific prediction (number or qualitative state) derived *only* from the mechanism's logic. **This is recorded in a sealed envelope or locked doc.**
  3.  Proposer reveals the hypothesis's actual claim regarding that finding.
  4.  **Scoring:**
      *   **Match:** Reviewer's prediction matches the claim. (+1 Support)
      *   **Vague:** Reviewer writes "could be anything." (0 Support)
      *   **Mismatch:** Reviewer's logic contradicts the claim. (-1 Support)
  **Weight:** This step counts for 40% of the total decision score. It is the only proxy for novelty we have.

  ### 3. Rival Count (5 Minutes)
  Count distinct, live mechanisms in the lab's register that also accommodate the key findings.
  *   **0 Rivals:** Full credit for findings.
  *   **1 Rival:** Split credit (findings count as 0.5).
  *   **2+ Rivals:** Zero credit for findings (the data does not discriminate).
  *   **Poorly Specified Rivals:** If rivals are vague ("maybe it's regulation"), they do not count. Rivals must be mechanistic enough to be falsified.

  ### 4. The Bet & Expiry (5 Minutes)
  **Stop Rule:** To proceed, the hypothesis must score **>2.0 Total Support** (sum of Provenance + Rebuild + Rival adjustment) AND name a **Novel Test**.
  **Novel Test Requirement:** Must predict a result *not* in the lab notebook. Must state the measurement, the expected direction/value, and the **Decision Date** (max 6 months out).
  **Expiry:** If the Decision Date passes without the test being run or the prediction failing, the hypothesis is **Archived**. It cannot be revived without new external evidence.

  ### 5. Judgment Calls (Marked)
  *   **[VALUE JUDGMENT]:** In Step 3, deciding if a rival is "poorly specified." This depends on how much the group values mechanistic precision over plausible hand-waving.
  *   **[HONESTY CHECK]:** In Step 1, distinguishing Category A (Input) from Category C (Background). This relies on the proposer's honest recollection of when they looked at which notebook pages. There is no audit trail for this.

  ***

  ### Limitations of this Procedure
  This protocol does not yield a probability of truth, nor does it manufacture spurious precision; it yields a risk assessment for resource allocation. It assumes the "Rival Set" is reasonably complete, which is never guaranteed; a unknown mechanism could invalidate the Rival Count. Finally, this procedure cannot substitute for a genuinely new test. It is a filter to prevent waste, not a generator of confirmation. A hypothesis that passes this protocol is merely *expensive enough to test*, not *true enough to publish*.

  ***

  # Application to Lab Cases

  ### Case 1: The Gut Metabolite (Postdoc Proposal)
  *Proposal:* Metabolite M explains Diet Effect D.
  *Evidence:* M was selected from an untargeted screen because it was elevated in Condition D.

  1.  **Provenance:**
      *   Finding: "M is elevated in D."
      *   Category: **A (Construction Input)**. The metabolite was *selected* because of this data.
      *   Score: 0.
      *   *Result:* >50% of support is Category A.
  2.  **Termination:** The procedure terminates here.
  3.  **Verdict:** **Do not fund.** The hypothesis is a description of the screening criteria, not an explanation. To proceed, the postdoc must identify a *different* consequence of M production (e.g., downstream signaling) that was not part of the selection screen and run the Blinded Rebuild on that.

  ### Case 2: The Condensates (Visitor Proposal)
  *Proposal:* Protein P forms condensates (analogy to Organism O).
  *Evidence:* Explains 2-year-old anomaly (Subpopulation S survives when Kinetic Model K says it should die). No new parameters added.

  1.  **Provenance:**
      *   Finding: "Subpopulation S survives."
      *   Category: **D (Standing Anomaly)**. Known for 2 years, contradicted Model K.
      *   Score: 1.0.
      *   Finding: "P structure resembles O."
      *   Category: **C (Background)**. Known structure, not consulted for the survival anomaly initially.
      *   Score: 0.5.
      *   *Total Provenance:* 1.5.
  2.  **Blinded Rebuild:**
      *   Reviewer (Lab Member X) told: "P phase-separates like O."
      *   Reviewer Prediction: "Concentration threshold should exist; survival should be binary."
      *   Proposer Claim: "Binary survival above threshold X."
      *   Score: **+1 (Match).**
  3.  **Rival Count:**
      *   Are there other reasons S survives? (e.g., efflux pump, mutation).
      *   Count: 1 live rival (Efflux).
      *   Adjustment: Split credit. (1.5 + 1) * 0.5 = 1.25.
      *   *Wait, Recalculate:* Provenance (1.5) + Rebuild (1) = 2.5. Rival adjustment applies to the *findings*. Let's apply conservatively. Total Support = 2.5. Rival exists. Score = 2.0.
  4.  **The Bet:**
      *   Novel Test: Disrupt condensate formation chemically.
      *   Prediction: Subpopulation S dies.
      *   Date: 4 months.
  5.  **Verdict:** **Fund.** Score meets threshold (2.0). High provenance value (Anomaly). Strong blinded prediction.

  ### Case 3: The Flagship Hypothesis (PI Grant Renewal)
  *Proposal:* Mechanism F explains Pattern Z.
  *Evidence:* Pattern Z known for 3 years. Hypothesis written to fit Z. Competing Model G fits Z with one tweak. Mechanism F required two auxiliary assumptions.

  1.  **Provenance:**
      *   Finding: "Pattern Z."
      *   Category: **A (Construction Input)**. Hypothesis written to fit Z.
      *   Score: 0.
      *   *Result:* >50% support is Category A.
      *   *Note:* Even if we continue past the termination rule due to political pressure:
      *   Auxiliary Assumptions count as **B (Post-Hoc Adjustments)**. Penalty: -1.
      *   *Total Provenance:* -1.
  2.  **Blinded Rebuild:**
      *   Reviewer told Mechanism F.
      *   Reviewer Prediction: "Without the auxiliary assumptions, F predicts linear growth."
      *   Proposer Claim: "Exponential growth (via assumptions)."
      *   Score: **-1 (Mismatch).**
  3.  **Rival Count:**
      *   Competing Model G fits Z.
      *   Count: 1 Rival.
      *   Adjustment: Split credit.
  4.  **The Bet:**
      *   Novel Test: None currently named; relying on Pattern Z.
  5.  **Verdict:** **Do not fund new person-months on this basis.**
      *   *Reasoning:* The hypothesis fails the Provenance Sort (it fits data it was built to describe). It fails the Blinded Rebuild (predictions only match with tuning). It has a live rival.
      *   *Action:* The PI must identify a *novel* prediction distinct from Pattern Z to justify the grant renewal spend. If Pattern Z is the only support, the resource allocation is unjustified under OETP. The hypothesis is archived until a novel test is proposed.
