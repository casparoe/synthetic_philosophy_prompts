      *   **Key Learning Objectives (in order):**
          1.  Distinguish three ways to raise score (world change, score decoupling, channel intervention).
          2.  Indistinguishability from the inside (signal is all that matters).
          3.  Capability makes it worse (systematic optimizers find the channel).
          4.  Epistemic catastrophe (loss of self-knowledge/competence estimation).
          5.  Boundary problem (tampering vs. legitimate revision of reward function).
      *   **Constraints:** No lecture beforehand. No technical terms until debrief. Payoffs = chocolate + early release. One confederate allowed. Mild deception okay (with consent/debrief).
      *   **User's Draft:** 3-person teams, 6 teams. Construction task. Action slip + Report slip. Runner applies different rules per team. Audit round. Market for second opinion.
