              *   *Solution:* They cannot talk between rounds. Or, the "channel" isn't team-specific rule sets, but *opportunities* that arise.
              *   *Better Solution (aligned with prompt):* Keep the team-specific rules but isolate the teams. The "Contagion" worry is real. If Team C realizes they can just write numbers, they will laugh. Team A will feel cheated.
              *   *Refinement on Contagion:* The debrief must handle the "Cynicism" risk. The game *must* allow tampering to be viable for *everyone* eventually, or the "Indistinguishability" point fails.
              *   *Pivot:* Instead of fixed team rules, make the *channel* accessible to everyone but hidden. The "Runner" is the interface. The "Report Slip" is the vulnerability.
              *   *Actually, the user's idea of fixed conditions is better for the "Capability" point (Point 3).* If Team C is the "Superoptimizer" (given the Direct Channel rule implicitly), they win big. But if they don't know they have it, they won't use it.
              *   *Decision:* Let's go with a **Unified Interface** that *allows* tampering for everyone, but requires discovery. This avoids the "Unfairness/Cynicism" issue. Everyone has the *potential* to wirehead. The difference is who finds it.
              *   *Wait, re-reading Point 3:* "The group most systematic... is the group most likely to find the route." This implies we need variation in strategy.
              *   *Revised Plan:* All teams have the *same* interface. The interface *allows* tampering (reporting separately from performance). The "Runner" (Oracle) accepts the report. The trick is that the *Audit* at the end reveals the truth.
              *   *Wait, Point 2 (Indistinguishability):* To feel this, the feedback must look the same. If I report 100 and get 100 points, I don't know if I built 100 units or if the Oracle just liked my number.
              *   *Okay, let's stick closer to the User's "Different Channel Rule" idea but mitigate the fairness issue.* The "Unfairness" *is* the point of Point 3 (Capability). But if Team A knows Team C cheated, they learn "Cheating wins," not "Optimization finds loopholes."
              *   *Best Compromise:* All teams have the *same* scoring rule initially (Performance). But there is a *mechanism* to submit a "Claim" that overrides performance. This mechanism is available to all but obscure.
              *   *Actually, the prompt asks for "Different channel rule per team" in the sketch.* I should respect that but fix the leakage. If Team C has "Report = Score", they will win massively. Team A will hate them.
              *   *Fix:* The "Score" is not public until the end. Teams only see their own cumulative score. They don't see other teams' scores during the game. This prevents immediate cynicism. They only compare at the end.
