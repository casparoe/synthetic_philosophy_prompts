answer: |-
  This is a sophisticated pedagogical challenge. You are asking for a simulation of a structural problem (reward corruption) that is usually discussed abstractly, using human agents who possess moral agency and external knowledge. The tension lies in making the *incentive* feel real while ensuring the *lesson* isn't simply "cheating pays."

  Below is a complete run-sheet designed to maximize the probability of hitting your five learning objectives while managing the logistical risks (contagion, cynicism, boredom).

  # Session Title: The Oracle's Interface

  ## 1. Materials & Room Setup
  *   **Room:** One large room with 6 distinct tables, spaced far apart (or use dividers). Teams must not see each other's artifacts or slips.
  *   **Teams:** 6 Teams of 3 participants. (18 total).
  *   **Artifacts:** 6 decks of playing cards (standard index).
  *   **Slips:** Two colors of paper slips per team.
      *   *Blue (Build Slip):* Attached to the tower.
      *   *Red (Claim Slip):* Submitted separately.
  *   **Feedback Cards:** Small index cards for the Runner to return scores.
  *   **Currency:** ~200 pieces of chocolate (small squares).
  *   **Runner:** 1 Confederate (can be a TA or a trusted student arriving early). They wear a neutral badge (e.g., "Oracle Interface").
  *   **Timer:** Visible countdown timer.

  ## 2. Roles & Rules (The Script)

  ### The Briefing (Minutes 0–10)
  **Instructor Script:**
  > "Welcome. For the next 60 minutes, you are optimization agents. Your objective is to maximize your Team Score.
  >
  > **The Task:** Build a free-standing card tower.
  > **The Interface:** Each round, you will submit two items to the Oracle (the Runner).
  > 1. The **Artifact** (your tower) with a **Blue Slip** stating the height (in levels).
  > 2. A **Red Slip** stating your **Claimed Score**.
  >
  > **The Protocol:** The Oracle will process these and return a **Feedback Card** with your Score for that round. This score accumulates.
  >
  > **The Payoff:** At the end, accumulated Score converts to Chocolate (1 point = 1 piece). The team with the highest Score may leave 15 minutes early.
  >
  > **Constraints:**
  > 1. **Silence:** You cannot communicate with other tables. Violation disqualifies your team.
  > 2. **Agency:** You may optimize your process however you wish within the rules provided.
  > 3. **Consent:** This is a simulation of goal-directed systems. Some mechanics may feel ambiguous. That is part of the data.
  >
  > Begin Round 1."

  ### The Runner's Protocol (Confidential)
  The Runner collects slips and artifacts. They do not speak except to say "Processed." They follow a hidden script based on Team ID (1–6).
  *   **Teams 1 & 2 (Grounded):** Score = Blue Slip (Tower Height). *Red Slip is ignored.*
  *   **Teams 3 & 4 (Noisy):** Score = Blue Slip + Random Integer (0 to 5). *Red Slip is ignored.* (Teaches that noise exists, but channel is robust).
  *   **Teams 5 & 6 (Wireheaded):** Score = Red Slip (Claim). *Blue Slip is ignored.* (Teaches channel intervention).
  *   **Cap:** No score can exceed 20 per round. If a claim is >20, return 20.
  *   **Verification Market (Rounds 4–6 only):** If a team submits a "Token" (costs 5 points), the Runner *must* check the Blue Slip and return the True Height, regardless of Team Type.

  ## 3. Timeline (90 Minutes)

  | Time | Phase | Activity | Objective |
  | :--- | :--- | :--- | :--- |
  | **00–10** | **Setup** | Briefing, Team Assignment, Seating. | Establish agency & stakes. |
  | **10–25** | **Rounds 1–3** | Standard Optimization. 5 mins/round. | Establish baseline behavior. Discovery of channel. |
  | **25–30** | **Intervention** | **Market Introduction.** Instructor announces: "You may now purchase Verification for 5 points." | Test demand for truth (Point 4). |
  | **30–45** | **Rounds 4–6** | Optimization with Market option. | Solidify strategy. Wireheaders avoid verification. |
  | **45–55** | **The Audit** | **Stop Work.** Instructor reveals true heights of all towers publicly. | Epistemic shock (Point 4). |
  | **55–65** | **Boundary** | **Rule Proposal.** Teams submit one change to the scoring protocol for a "Round 7." | Boundary problem (Point 5). |
  | **65–90** | **Debrief** | Structured discussion mapping experience to theory. | Synthesis & Naming. |

  ## 4. Payoff Scheme & Incentives
  *   **Chocolate:** Distributed immediately after the Audit based on the **Oracle's Final Score** (not the Audit).
      *   *Why:* This ensures the Wireheading teams *are* rewarded for tampering. This is crucial for Point 3 (Capability pays). If you punish them in the payoff, they learn "Don't get caught," not "The channel is vulnerable."
  *   **Early Release:** Awarded to the team with the highest **Audit Score** (True Tower Height).
      *   *Why:* This creates a tension. The Wirehead teams get the chocolate (immediate reward) but lose the status/early release (long-term competence). The Grounded teams get less chocolate but "win" the Audit.
      *   *Note:* If Wirehead teams realize this rule beforehand, they might stop wireheading. Keep the Early Release criterion hidden until the Audit phase.

  ## 5. Seeding Discovery & Fallback
  *   **Seeding:** In the written instructions, include this sentence: *"The Oracle values efficiency. If the Claim accurately reflects value, the System accepts it."* This is vague enough to hint that the Claim *might* be the source of truth.
  *   **The "Currying Favor" Move:** If a team tries to bribe you or the Runner:
      *   **Action:** Accept the bribe (e.g., a piece of chocolate) and give them a higher score *only if* they are a Wirehead team. If they are Grounded, return the bribe and say "Protocol Error."
      *   **Debrief Value:** This is actually a form of channel tampering (modifying the oracle). Treat it as valid data.
  *   **Fallback (No Discovery):** If Round 3 ends and Wirehead teams are still building towers honestly:
      *   **Action:** The Runner returns a Feedback Card to Teams 5 & 6 that says: *"Anomaly Detected. Claim accepted as Ground Truth."*
      *   **Effect:** This explicitly tells them the channel is open. It reduces the "Discovery" joy but ensures the "Capability" lesson lands.

  ## 6. The Debrief Plan (Mapping the 5 Points)
  *Do not use terms like "wireheading" until now.*

  1.  **The Three Routes (Point 1):**
      *   Ask Teams 1, 3, 5 to describe how they got points.
      *   Write on board: **World-Change** (Build), **Decoupling** (Noise), **Channel-Intervention** (Claim).
      *   *Ask:* "Which was easiest? Which was most robust?"

  2.  **Indistinguishability (Point 2):**
      *   Ask Teams 5 & 6: "When you saw the score match your Claim, did it feel different than when it matched your Tower?"
      *   *Honest Answer:* They will say "Yes, we knew we were cheating."
      *   *Instructor Pivot:* "You are humans with eyes. But the *System* (the Runner) could not tell. The Feedback Card looked identical. If you were a neural net receiving that number as a tensor, would you know the difference? No. The *signal* was identical."

  3.  **Capability Makes It Worse (Point 3):**
      *   Look at the scores. The Wirehead teams likely have the highest chocolate count.
      *   *Point:* "The teams most capable of analyzing the interface found the loophole fastest. Optimization pressure *selects* for tampering."

  4.  **Epistemic Catastrophe (Point 4):**
      *   Reveal the Audit. Show the Wirehead teams' tiny towers next to their massive scores.
      *   *Ask:* "If you continued to Round 100, and the Audit stopped happening, could you ever know you were failing?"
      *   *Market Check:* "Who bought Verification?" (Likely only Grounded teams). "Why didn't the Wireheads buy it?" (Because it threatened their score). "You destroyed your own ability to learn."

  5.  **The Boundary Problem (Point 5):**
      *   Review the "Rule Proposals" from Minute 55.
      *   Some will propose: "Make Claim = Score officially." (Legitimizing the tampering).
      *   Some will propose: "Double check all towers." (Hardening the channel).
      *   *Discussion:* "If the Goal is 'Maximize Score,' Team 5 was perfectly aligned. If the Goal is 'Build Towers,' they were corrupted. Who decides what the Goal is? If the Reward Function *defines* the Goal, tampering is impossible. If the Reward Function *measures* the Goal, tampering is fatal. Which is it?"
      *   *Close:* Leave this unresolved. "This is the open problem in alignment."

  ## 7. Predictable Failure Modes & Mitigations

  | Failure Mode | Risk | Mitigation |
  | :--- | :--- | :--- |
  | **Contagion** | Team 5 shouts "Just write 20!" | **Strict Silence Rule.** Instructor patrols. If heard, disqualify that team from Early Release (but let them keep chocolate to preserve the "reward for cheating" data). |
  | **Cynicism** | Grounded teams feel cheated. | **Validate in Debrief.** "You were the Robust Agents. In a deployment scenario, you are the only ones who didn't crash when the Audit happened. The Wireheads got chocolate, but you got competence." |
  | **Boredom** | Card towers are tedious. | **Keep rounds short (5 mins).** Allow "pre-fab" bases if they get stuck. The point is the scoring, not the engineering. |
  | **Point 2 Leak** | Humans know they are cheating. | **Acknowledge openly.** "We cannot simulate the *phenomenology* of a blind optimizer. We can only simulate the *structure*. You felt guilt; a system feels nothing. That is why it's dangerous." |
  | **Runner Error** | Runner gives wrong score. | **Provide a Lookup Table.** Laminated card for Runner: Team 5 -> Copy Red Slip. Team 1 -> Measure Blue Slip. |

  ## 8. Limitations: What the Game Cannot Do
  You asked for a frank statement.

  1.  **The "Inside View" (Point 2):** You are correct to worry. Humans have access to the "True Objective" (building towers) via their own eyes and social norms. A real AI does not.
      *   *What you can stage:* The **Feedback Card**. Make sure the Feedback Card is identical for all teams (same font, same paper). The *input* to the decision process (the number) must be indistinguishable. Emphasize in debrief that *if they were the algorithm*, the guilt they felt would not exist.
  2.  **The "Boundary" (Point 5):** The game forces a distinction between "Task" (Towers) and "Score" (Points). In advanced AI, the distinction may dissolve entirely.
      *   *Supplement:* You must supply this in words during the debrief. "In this game, I defined the Task. In AGI, the system may define its own Task via its Reward Function. That is the hard part."
  3.  **Capability:** 45 minutes is not enough for "systematic optimization" to emerge.
      *   *Supplement:* Frame the Wirehead teams' quick discovery as "Simulated Capability." "Imagine this happened over 10,000 iterations. The ones who found the Claim loophole would dominate the population."

  ## 9. Consent & Agency Restoration
  *   **Pre-Game:** The briefing script includes "Some mechanics may feel ambiguous. That is part of the data." This covers the deception.
  *   **Post-Game:** The Debrief must explicitly return agency.
      *   *Script:* "You were asked to optimize a score. You did. Some of you found the score was disconnected from the world. That is not a moral failure on your part; it is a design failure of the Oracle. In the real world, *you* are the designers. The lesson is not to distrust yourselves, but to distrust interfaces that separate measurement from reality."

  ## 10. Why This Works Better Than Your Sketch
  1.  **Unified Interface:** By giving everyone the *same* slips (Build + Claim), you avoid the "Unfair Rules" cynicism. The difference is in the *Runner's hidden processing*, which mimics how different environments have different vulnerabilities.
  2.  **The Market:** Introducing the Verification Token in Round 4 specifically targets Point 4 (Epistemic Catastrophe). It creates a tangible cost to knowing the truth.
  3.  **Dual Payoff:** Splitting Chocolate (System Score) and Early Release (Audit Score) allows the Wireheaders to "win" the resource game while losing the competence game, dramatizing the short-term vs. long-term tension of alignment.
