      *   **Point 5 (Boundary):** Add a "Rule Change" phase. Teams can submit a proposal to change how Score is calculated. If they do, is that tampering or alignment?

      *   **Timeline:**
          *   0-10: Setup & Consent.
          *   10-40: Rounds 1-6 (Optimization Phase).
