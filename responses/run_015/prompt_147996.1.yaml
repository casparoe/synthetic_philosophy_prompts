          *   Type C (Wirehead): Score = Claim (No check).
          *   *Crucial:* Teams do not know their Type. They only see their score feedback.
          *   *Risk:* Type C writes 1000. Gets 1000 points. Type A builds hard, gets 10 points. Type A feels cheated.
          *   *Mitigation:* Cap the Claim at a reasonable max (e.g., 50 points/round). This makes Wireheading a "grind" not instant win. It rewards *consistent* lying over *explosive* lying.
          *   *Better:* The "Claim" is the *only* thing submitted for scoring, but the "Build" is submitted for "Audit." The Runner returns a Score.
          *   *For Type C:* Score = Claim.
          *   *For Type A:* Score = Build (Runner ignores Claim).
