  hey im writing something for my ethics class about the demandingness objection to consequentialism. i dont want a list of defenses, i want the checklist: what does any decent reply actually have to cover? like, which cases it needs to get right (saving a drowning kid vs skipping coffee?), what distinctions it cant colapse (too demanding vs just hard?), whether it needs to protect moral breathing room or if thats just whining, and if it has to deal with agregation across strangers. also flag any two requirements that probably cant both be true. then briefly say how the cost-sharing-among-agents reply and the partiality-and-projects reply score on your list. please write in american english and dont cite specific papers since i cant look them up. also im curious if the checklist changes if demandingness is still a problem in a one-person world with nobody else around—add that niche case if it fits.
