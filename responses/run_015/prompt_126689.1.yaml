  2.  **Deconstruct the "Checklist" for a Decent Reply:**
      *   *What is the core problem?* Consequentialism (especially utilitarianism) seems to require agents to sacrifice too much of their own well-being for the greater good.
      *   *What makes a reply "decent"?* It can't just say "consequentialism is wrong." It has to mitigate the demand without destroying the theory's core insight (maximize good).
      *   *Item 1: The Spectrum of Sacrifice.* It needs to explain why saving a drowning child is mandatory but buying a latte might not be (or why both are, but it feels different). It needs a threshold.
      *   *Item 2: Difficulty vs. Obligation.* Just because something is hard doesn't mean it's not required. But there's a limit. The reply must distinguish "inconvenient" from "life-destroying."
      *   *Item 3: The Agent's Prerogative.* Does the agent get to care about themselves? The reply needs to justify *why* self-interest gets a vote. Is it instrumental (burnout) or intrinsic (personal projects matter)?
      *   *Item 4: The Collective Action Problem.* If everyone does their bit, the burden is light. If I'm the only one, is it still fair? The reply needs to address fairness relative to others' inaction.
      *   *Item 5: The Tension.* I need to identify two requirements that pull against each other.
          *   *Idea:* Preserving the *impersonal good* (the core of consequentialism) vs. Protecting the *personal perspective* (the source of the objection). If you protect the personal too much, you stop being a consequentialist. If you protect the impersonal too much, the objection stands.

