      *   *Nuance:* The risk with other arts is that because they represent *phenomena* (even idealized ones), the viewer can slip back into individuality. Music, being non-representational, offers no handhold for the individual ego to grab onto.
      *   *Key Distinction:* Knowing the Will *conceptually* vs. knowing it *immediately*. Music is immediate knowledge.
