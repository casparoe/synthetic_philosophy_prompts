      *   **Nadia's Position:** This *is* Darwinian, just relocated. Selection happens *intracranially* (during repair/reconstruction) or via the *lineage* of ideas, even if agents don't reproduce differentially. She emphasizes the "ratchet" effect and the prediction of "selfish" cultural traits (misfit culture).

