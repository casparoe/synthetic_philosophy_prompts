      *   **(8) Dev:** Sim shows Darwinian expectation is wrong. No pressure for high-fidelity copying (channel stays lossy). Selectionist story predicts drive toward accurate copying.
          *   *Analysis:* Selectionism doesn't *always* predict high fidelity; it predicts fidelity *sufficient* to maintain the adaptation. If the prior repairs errors, fidelity of transmission matters less. This is the "reconstruction vs. copying" debate (Sperber vs. Dawkins).
