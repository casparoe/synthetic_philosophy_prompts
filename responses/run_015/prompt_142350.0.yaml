  **The Toast**

  "I wanted to share a quick story about [Colleague]'s influence. Yesterday, I checked the tracking for her farewell gift. The app said 'Delivered.' So I stood up in the meeting and said, 'I know the gift is in the mailroom.' Turns out, the app glitched—it wasn't scanned yet. But the driver had actually hand-carried it in five minutes prior. So I was right. The gift was there. But technically, I didn't *know* it. Which is great news for my promotion review, because my entire strategy is just getting lucky conclusions from false premises."

  **The Explanation**

  The Gettier work is done by the delivery status: I was justified in believing it, but it was false, while the conclusion was true by accident. It's a standard false-lemma case, not a fake-barn scenario. And if someone shouts it isn't really a Gettier case at all, I'll say: "Then you explain it to the client while I take credit for the delivery."
