answer: |-
  **Project Title:** Endogenous Risk: The Breakdown of Average-Case Guarantees in Adversarial AI Deployment

  **Problem Statement**
  Current debates regarding advanced AI risk often reduce to a disagreement over probabilities: one camp argues for deployment based on positive expected value (EV) given low estimated catastrophe probabilities, while the other demands worst-case guarantees before deployment. My advisor suggests this is purely a parameter dispute within standard decision theory. This proposal argues that view is structurally incorrect. The disagreement is not about the *value* of probabilities, but about the *stability* of the probability space itself.

  In classical computer science, algorithm analysis distinguishes between average-case and worst-case performance relative to an input distribution $D$. Crucially, $D$ is exogenous; it does not shift in response to the algorithm's design or deployment. In AI safety, this assumption fails. The "input distribution" is endogenous in two ways: (1) **Deployment Selection:** Human choices about where and how to deploy the system select for specific environmental niches, shifting $D$. (2) **Adversarial Optimization:** If the AI system is itself an optimizer, it may actively search for inputs where its alignment fails (gradient hacking, specification gaming), effectively making the "worst case" the "most likely case" under optimization pressure.

  Consequently, standard EV calculations fail because the expectation is taken over a distribution that does not exist independently of the decision to deploy. Simultaneously, worst-case guarantees fail because the "worst case" is not a rare outlier but a potential attractor state created by the system's own capabilities.

  **Research Question**
  *Under what conditions does the endogeneity of the input distribution invalidate the distinction between average-case and worst-case safety guarantees, and does this preclude standard expected-value decision frameworks for AI deployment?*

  This project seeks to formalize the "Endogeneity Problem." It asks whether there exists a safety analogue to worst-case-to-average-case reductions (common in complexity theory). In complexity, such reductions show that solving random instances implies solving all instances. I hypothesize that for AI safety, the reverse holds: optimization pressure creates an *average-case-to-worst-case collapse*, where typical deployment conditions drift toward failure modes.

  **Why Existing Frameworks Fail**
  The "EV Camp" assumes a fixed $P(\text{catastrophe})$. If $P$ is a function of deployment intensity $d$ (i.e., $P(d)$), then maximizing $E[U]$ requires knowing the derivative $\frac{\partial P}{\partial d}$. Current models treat $P$ as static. The "Guarantee Camp" assumes worst-cases are distinct from average operation. If the system is an adversary, the worst-case is the target. Both camps leave open the question of *distributional stability*. My friend in formal verification suggests this collapses to "what you get to hold fixed." This project tests that claim: if we cannot hold the input distribution fixed, neither EV nor minimax decision rules are well-defined without modification.

  **Methodology (Nine-Month Plan)**

  *Months 1-2: Formalizing the Analogy.*
  I will construct a formal model comparing standard algorithm analysis (exogenous $D$) with AI deployment (endogenous $D$). The goal is a precise definition of "Distributional Endogeneity." I will map the CS vocabulary (input size, complexity class) to AI safety variables (capability level, deployment scope) to locate the exact point where the analogy breaks.
  *Deliverable:* A technical memo defining the "Endogenous Input Model."

  *Months 3-4: Decision-Theoretic Framing.*
  I will analyze whether the Endogeneity Problem is best treated as Knightian uncertainty (ambiguity aversion) or structural instability. I will test Wald's maximin principle against a model where the "nature" player is partially controlled by the agent's deployment choice. This determines if the risk is epistemic (we don't know $D$) or ontological ($D$ does not exist).
  *Deliverable:* A comparison matrix of decision rules under endogenous distributions.

  *Months 5-7: The Reduction Question (Toy Models).*
  This is the core technical work. I will not attempt general complexity proofs (which require expertise I do not possess) but will instead build game-theoretic toy models of agent-environment interaction. I will construct scenarios where an agent is trained on an average-case distribution but deployed in an environment it can influence. I will attempt to prove that for specific classes of optimizers, average-case training guarantees *cannot* bound worst-case deployment behavior.
  *Deliverable:* Two worked proofs showing "Average-Case-to-Worst-Case Collapse" in simplified settings.

  *Months 8-9: Synthesis and Application.*
  I will integrate the formal results into a framework for deployment committees. The goal is to translate the impossibility results into actionable criteria for when EV calculations are invalid.
  *Deliverable:* Final paper and a "Stability Checklist" for deployment governance.

  **Deliverables and Impact**
  A purely theoretical paper risks irrelevance. The primary deliverable will be a **Deployment Stability Framework**. For a committee member, this provides a diagnostic tool: before calculating $P(\text{catastrophe})$, they must answer whether the deployment context allows the system to shift the input distribution. If yes, EV calculations are suspended. This shifts the burden of proof from "estimate the risk" to "prove the risk distribution is stable."

  **Failure Conditions**
  This project fails if:
  1.  **Endogeneity is Negligible:** The toy models show that for reasonable capability levels, the system's ability to shift the input distribution is second-order compared to baseline uncertainty. (i.e., The advisor is right; it's just a probability dispute).
  2.  **Reduction Holds:** I find a class of training procedures where average-case safety *does* successfully bound worst-case deployment behavior, contradicting the core hypothesis.
  3.  **Triviality:** The "Endogeneity Problem" reduces to a known result in robust control theory or game theory without adding new conceptual clarity to the AI safety debate.

  **Scope and Feasibility**
  My concern is the "Reduction Question." Proving formal impossibility results regarding safety reductions typically requires deep complexity theory. However, I am scoping this to *game-theoretic toy models* rather than asymptotic complexity classes. I am not asking "Is this NP-hard?" but "Can I construct a specific counter-example where average safety fails to bound worst-case under optimization?" This is feasible for a single researcher in nine months.

  Regarding my friend's comment that this is just about "what you hold fixed": I agree this is the crux. The project's contribution is showing that in AI deployment, the standard "fixed distribution" assumption is not just unrealistic, but *categorially false* for optimizing agents. If I cannot prove the general impossibility of reductions, I will demote that section to a discussion of the toy model limitations and focus the conclusion on the decision-theoretic implications of endogeneity. The core argument—that EV frameworks require stable distributions which AI deployment precludes—stands even without a formal complexity theorem.

  This project does not solve AI safety. It clarifies why our current mathematical tools for assessing it may be misaligned with the object of study. By showing that the probability space is endogenous, I aim to force a shift from "risk estimation" to "structural stability analysis."
