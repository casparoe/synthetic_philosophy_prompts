prompt: |-
  Hey — I'm putting together a nine-month predoctoral fellowship application and they want a two-page research proposal, and they say explicitly not to include a bibliography (they'll ask for references separately if they shortlist me), so please don't pad it with citations or a literature-review section — I want actual argument. I've been stuck on the framing for months. My advisor keeps saying that the whole argument about risk from advanced AI systems is secretly just a disagreement about probabilities: some people think the chance of catastrophe is tiny, some think it's substantial, and once you fix the number the rest is just applied decision theory. I think that's badly wrong, but I can't yet say why in a way that survives her pushback, and I want the proposal itself to be the thing that works it out.

  The half-formed idea is this. Everyone in the debate borrows the vocabulary of worst-case and average-case guarantees from algorithm analysis, and I think the borrowing is broken in a specific way that nobody spells out. In the CS setting, the cases are drawn from a distribution that's fixed independently of what the algorithm's designer does — you analyse a sorting routine against a distribution over inputs, and the input distribution doesn't rearrange itself in response to your choice. But for a deployed AI system the "cases" seem to be (i) partly chosen by us, since the decision to deploy (and where, and into what surrounding institutions) shifts which situations the system actually lands in, and (ii) possibly chosen by the system, if the thing we're evaluating is itself an optimizer with some capacity to find exactly the input on which it behaves worst. If either of those is right, then "average case" may not refer to anything stable enough to take expectations over, and "worst case" may be the case that's most likely to show up rather than the case that's vanishingly improbable. The other piece I can't stop chewing on: in complexity theory there are worst-case-to-average-case reductions, where you show that an algorithm succeeding on a random instance can be converted into one that succeeds on all instances, so that average-case and worst-case difficulty collapse together. Is there any analogue for safety? Could you design a training procedure or a deployment wrapper such that good behaviour on the average of some distribution we control would imply a bound on behaviour in the worst case — a reduction, but pointing the other way? My guess is the answer is no, and that the reason it's no is precisely the adversarial-optimization bit above, but I want that to be a result the project tests rather than a hunch I assert.

  So: write me the proposal. It needs a precise statement of the question, tight enough that it has a determinate answer rather than being a survey, plus a section on why the two obvious camps — the "compute the expected value and then decide whether to deploy" people on one side, and the "no deployment without something like a guarantee" people on the other — leave that question open, and why they leave it open for reasons that aren't just missing empirical data. Then the method: what I'd actually do across nine months, month by month. I was imagining roughly a month on making the CS analogy exact enough to locate the precise point where it breaks; a month on whether the worst-case side is best read as a Wald-style maximin or ambiguity-aversion claim about the shape of the decision problem rather than a claim about probabilities at all; a month on the reduction question; and then time on one or two worked toy cases where you can compute both the worst-case and average-case numbers explicitly and see how they come apart — but reorder or replace these if you think there's a better sequencing, and say why. Then I need: what a genuinely useful deliverable would look like for someone actually sitting on a deployment committee, what would count as the project failing (my advisor will definitely ask this, and "we ran out of time" isn't an answer), and an honest paragraph on scope — especially whether the reduction question is something one person can make progress on in nine months without being a complexity theorist, or whether I should demote it to a remark in the conclusion and build the proposal around something smaller. I was arguing about this with a friend who works in formal verification and she said the whole thing collapses into the question of what you get to hold fixed, which I half believe and half dont, so if that's a useful way to cut it, use it.
