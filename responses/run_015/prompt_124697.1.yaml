answer: |-
  To advance W. E. B. Du Bois's *Criteria of Negro Art* from a historical artifact into a living operational framework, you must treat the three lines of inquiry not as parallel tracks, but as a dependency chain. You have a three-year horizon, which is sufficient for deep conceptual work but tight for institutional reform. Therefore, your prioritization must balance theoretical fidelity with the capacity to generate tangible cultural infrastructure.

  Here is the recommended ordering, defended by criteria of upstream dependency, operational impact, and tractability.

  ### Priority 1: The Interpretive Problem (Content vs. Form)
  **Timeline:** Months 1–12
  **Primary Criterion:** Upstream Dependency

  You must begin here because every subsequent decision relies on the definition of "propaganda." If Du Bois's thesis is interpreted narrowly as a demand for positive representational content (e.g., dignified portraits, uplifting narratives), then your institutional interventions will inevitably drift toward censorship, messaging control, and what critics dismiss as identity politics. If, however, the thesis is correctly identified as a claim about *form*—that rhythm, dissonance, and compositional fracture can themselves enact political resistance—then the liberal critique of artistic freedom collapses. A demand for specific content restricts the artist; a demand for specific formal rigor challenges the artist to innovate.

  This line of work is the most tractable for a single researcher or small team in the first year. It requires close textual analysis and comparative aesthetic theory, but it does not yet require buy-in from external stakeholders. Resolving this question creates the "source code" for the rest of the project. If you skip this and move straight to funding guidelines, you risk building a bureaucracy that incentivizes caricature rather than justice. You need to produce a definitive framework that distinguishes between *art as messaging* (which Du Bois likely sought to transcend) and *art as structural intervention* (which aligns with his broader sociological project).

  **Why it ranks first:** It is the logical prerequisite. You cannot design a funding body (Line 2) or reconcile aesthetic autonomy (Line 3) until you know what kind of labor the art is supposed to perform.

  ### Priority 2: The Institutional Question (Funding and Governance)
  **Timeline:** Months 12–30
  **Primary Criterion:** Operational Impact

  Once the interpretive framework is established, the immediate priority shifts to infrastructure. This is the line of work that will actually change how cultural institutions operate. If the conclusion of Line 1 is that form carries political weight, then public funding bodies and museum acquisition committees cannot evaluate work based solely on thematic relevance. They must develop literacy in formal analysis. Similarly, algorithmic recommendation systems, which currently optimize for engagement and often flatten aesthetic complexity, must be audited for how they depoliticize form.

  This phase requires shifting from conceptual analysis to empirical and collaborative work. You would need to engage with grant-making organizations, curatorial boards, and perhaps technologists to draft pilot criteria. For a foundation program officer, this is the highest-value activity: moving from theory to policy. For a research fellow, this provides the necessary testing ground for the thesis. The goal is not to dictate taste, but to redesign the evaluation metrics that determine which tastes survive.

  **Why it ranks second:** It is downstream of the interpretive work but upstream of broad philosophical reconciliation. It offers the highest return on investment regarding "public life." If you spend three years only on theory, you have written a paper; if you spend Year 2 on institutional design, you have created a lever for change.

  ### Priority 3: The Philosophical Tension (Du Bois vs. Adorno)
  **Timeline:** Months 24–36
  **Primary Criterion:** Theoretical Robustness

  The tension between Du Bois's instrumentalism and Adorno's aesthetic autonomy should be addressed last. While intellectually rich, this debate is the most likely to become a terminus rather than a bridge. If you begin here, you risk getting bogged down in European critical theory debates that may not translate to the specific material conditions of Black artistic production. However, it remains essential as a stress test. Once you have a working institutional model (from Line 2), you must ask: Does this model crush the very autonomy that makes art powerful?

  This line of inquiry serves as a quality control mechanism. It ensures that the "propaganda" you are funding does not become mere statecraft or corporate social responsibility. By placing this third, you allow the practical work to inform the theoretical reconciliation. You might find that Du Bois and Adorno are not opposed, but that Adorno's "autonomy" is a luxury unavailable to artists under systemic duress, or conversely, that Du Bois's "propaganda" requires the very distance Adorno champions to be effective.

  **Why it ranks third:** It is the least tractable for immediate operational change and the most prone to abstraction. It refines the project but does not launch it.

  ### Criteria for Reordering

  This agenda is not static. Specific evidence gathered during the three-year window should trigger a reprioritization.

  **1. Evidence that would elevate Line 3 (Philosophical):**
  If, during the institutional pilot phase (Line 2), you encounter rigid resistance from the artistic community based on claims of compromised integrity, the philosophical work must move up. If artists refuse to engage with the funding criteria because they view "justice-oriented art" as inherently compromised, you cannot solve this with better policy. You must solve it with better theory. In this scenario, you must pause institutional design and return to the Du Bois-Adorno tension to articulate a defense of autonomy *within* instrumentalism. Without this, the project loses its primary stakeholders (the artists).

  **2. Evidence that would elevate Line 2 (Institutional):**
  If the interpretive work (Line 1) reveals that the distinction between content and form is less critical than the *distribution* of the art, you should accelerate Line 2. For example, if analysis shows that Du Bois's primary concern was access and circulation rather than the internal structure of the work, then spending a year on formal analysis is a waste of resources. You would pivot immediately to algorithmic transparency and acquisition pipelines. This would compress the timeline for Line 1 and expand the timeline for Line 2.

  **3. Evidence that would deprioritize Line 1 (Interpretive):**
  If early engagement with contemporary Black artists reveals a consensus that the "content vs. form" debate is already settled in their practice (i.e., they already treat form as political), then Line 1 becomes redundant. The researcher should not spend twelve months proving a point that practitioners already embody. In this case, the project should move immediately to documenting existing practices and scaling them through Line 2 mechanisms.

  ### Summary of the Three-Year Arc

  In year one, you secure the definition. You determine whether "propaganda" means painting a hero or fracturing the canvas. In year two, you build the machine. You draft the grant guidelines, the acquisition rubrics, and the algorithmic audits based on that definition. In year three, you stress-test the machine. You use the philosophical tension to ensure the machine does not consume the art it claims to support.

  This ordering ensures that you do not build institutions on shaky textual ground, nor do you retreat into theory without attempting to alter the material conditions of cultural production. It treats Du Bois's essay not as a text to be annotated, but as a blueprint to be engineered.
