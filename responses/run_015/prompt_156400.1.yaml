answer: |-
  Good morning. Welcome to this workshop on Ground Projects and Moral Psychology. Looking around this room, I see a divide that is as rare as it is necessary. On one side, colleagues who have spent careers analyzing the architecture of moral reasoning. On the other, colleagues who spend their days observing how human beings actually make decisions when the stakes are life and death, and resources are scarce. Usually, when these groups meet, the goal is application: philosophers offer a framework, and psychologists test its feasibility. Today, I propose we invert that relationship. We are not here to test whether clinical practice meets philosophical standards. We are here to test whether a specific philosophical objection survives the reality of clinical practice.

  Our central task is to examine Bernard Williams's integrity objection. For those less familiar with the normative literature, let me distill this without losing its force. Williams argued that modern moral theory, particularly impartial systems like utilitarianism, demands that we step outside ourselves to evaluate our actions. It asks us to view our own lives from a neutral, universal standpoint. His famous concern is that this inserts "one thought too many" between an agent and their action.

  Consider a man whose wife is drowning. He swims out to save her. If asked why, an impartial moral theory suggests he should be able to justify this by saying, "She is a person in distress," or "Saving her produces the best overall outcome." Williams argues that if he has to think that, something has gone wrong. He should save her simply because she is his wife. To require a neutral justification is to alienate him from the very commitment that makes the action meaningful. These deep commitments Williams calls "ground projects." They are not mere preferences. A preference is wanting chocolate over vanilla; it is contingent and swappable. A ground project is being a parent, a partner, or a healer; it is constitutive. It is the structure upon which the self is built. To ask an agent to neutrality regarding their ground projects is not to ask them to be fair; it is to ask them to cease being who they are.

  This distinction is vital for our psychological colleagues. In your field, partiality is often coded as bias, a deviation from rational optimization. Williams suggests that in the personal sphere, this "bias" is not an error in processing; it is the source of moral agency. If we remove the partial commitment, we do not get a purer moral agent; we get a hollow one.

  So, how does this objection do structural work for us today? It determines what claims we can defend and which we must withhold.

  First, consider the claim that clinical ethics should strive for total impartiality. Williams's objection forces us to withhold this claim when discussing caregivers acting in personal capacities. If a nurse encounters her own child in a disaster zone, Williams suggests we cannot demand she triage her child against a stranger using a neutral utility calculus. To demand this is to demand she treat her ground project—the commitment to her child—as a mere preference. If we pathologize her refusal to do so as "compassion fatigue" or "decisional bias," we are misunderstanding the moral psychology of integrity. Therefore, a portion of our workshop must be dedicated to defending the moral necessity of partiality in personal spheres, even within clinical environments. We cannot claim that professional neutrality should colonize the entire life of the caregiver.

  However, and this is where the structural work tightens, we must also withhold the claim that Williams's objection applies without limit to professional roles. Williams was discussing the individual agent in the world. But clinical psychology and medical ethics deal with agents occupying institutional roles. When a surgeon enters the operating theater, she is not acting solely as a private individual; she is acting as a fiduciary of public trust and scarce resources.

  If a doctor prioritizes their spouse for a scarce organ transplant over a stranger with a higher probability of survival, we cannot defend this as integrity. Here, the "ground project" of being a healer involves a specific commitment to impartial distribution. To prioritize the spouse is not to honor a deep commitment; it is to violate the constitutive rules of the role itself. The integrity objection protects the person, but it does not automatically protect the professional from the demands of their office.

  This creates the tension that will drive our sessions. We are left with a boundary problem. Where does the person end and the role begin? In resource-constrained settings, caregivers are constantly asked to make impartial calculations that feel like betrayals of their ground projects. They are asked to discharge patients they know will suffer, or to prioritize statistics over faces. Williams tells us this alienation is real and damaging. It is not merely "stress"; it is a fracture in moral identity.

  Therefore, our inquiry today is bounded by two negatives. We will not ask how to eliminate partiality from caregivers, because doing so destroys the ground projects that motivate care. Nor will we ask how to allow personal integrity to override professional duty, because doing so destroys the trust required for clinical systems to function. Instead, we must ask where the friction between these two generates moral distress, and whether that distress is a bug to be fixed or a feature to be managed.

  For the philosophers in the room, this means we cannot simply assert the primacy of integrity. We must account for the reality that professional roles create new ground projects that demand impartiality. For the psychologists, this means you cannot simply treat moral distress as a cognitive error to be corrected through resilience training. Sometimes, the distress is the accurate perception of a genuine moral conflict between being a human and being a functionary.

  We are here to map the territory where the impartial demand of the institution meets the partial demand of the self. If Williams is right, then a clinical ethic that demands total neutrality is not just impractical; it is morally incoherent. But if the clinical reality is right, then a moral theory that ignores role-obligations is dangerously naive.

  Our goal is not to resolve this tension, but to locate it precisely. We will examine case studies where caregivers must choose between family and strangers, not to find the right answer, but to see what is lost in the choosing. We will look at decision-making protocols not as tools to ensure correctness, but as mechanisms that either acknowledge or erase the agent's ground projects.

  By the end of today, I hope we agree that the integrity objection is not a veto on clinical ethics, but a constraint on its scope. It tells us that we cannot demand caregivers sacrifice their humanity to serve their function. But it also tells us that their humanity must be disciplined by the function they have voluntarily undertaken. We are walking a line between alienation and corruption.

  Let us begin that work.

  Verdict: The integrity objection validly protects personal commitments from impartial erasure but must be constrained by professional roles to prevent partiality from becoming corruption.
