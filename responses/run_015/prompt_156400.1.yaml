          *   Group A: Analytic moral philosophers (familiar with Bernard Williams, integrity, impartiality).
          *   Group B: Clinical psychologists (study caregiver decision-making under resource constraints, no background in normative ethics).
      *   **Central Question:** Does Williams's integrity objection (impartial theory alienates agents from deepest commitments) have traction in clinical settings (caregivers choosing between family/strangers)?
      *   **Constraint 1 (Structural Work):** The objection must *determine* which claims can be defended/withheld. It must shape the arc and limits of the speech, not just be a decorative reference.
      *   **Constraint 2 (Rigorous yet Accessible):** Philosophers must recognize the distinction between ground projects and preferences. Psychologists must follow without jargon or pop-psychology simplification.
      *   **Constraint 3 (No Citations):** No bibliographies, citations, or reading lists.
      *   **Constraint 4 (Ending):** Exactly one sentence summarizing the central claim, formatted as: `Verdict: [summary]`.
