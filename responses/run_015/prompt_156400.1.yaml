  2.  **Deconstruct the Core Concept (Williams's Integrity Objection):**
      *   *What is it?* Utilitarianism/impartial morality demands we step back from our personal projects and evaluate them from a neutral standpoint. Williams argues this alienates us from our "ground projects" (the commitments that give life meaning).
      *   *The Example:* Jim and the Indians (too abstract for psychologists?). The spouse example is better: Saving my wife vs. saving a stranger. Impartiality says I need a justification (she is useful, etc.). Williams says I should save her because she is *my wife*.
      *   *Application to Clinical Settings:* Caregivers (doctors, nurses, social workers) often face resource constraints. They must prioritize. Do they prioritize based on impartial utility (who has the best prognosis?) or partial commitment (who is my patient/family)?
      *   *The Twist/Structural Work:* I need to use this objection to *limit* what we can claim today. I can't just say "Williams is right." I need to show where his objection holds water in clinical ethics and where it breaks down.
      *   *Distinction:* Ground Projects vs. Preferences. Psychologists might see "I want to save my kid" as a preference or bias. Philosophers see it as a constitutive commitment. The speech must clarify this without jargon.

  3.  **Drafting - Section by Section:**

      *   **Introduction (2 mins):** Welcome both groups. Acknowledge the gap. State the purpose: not to apply theory to practice, but to see if the theory survives the practice. Introduce the core tension: Impartiality vs. Personal Commitment.
      *   **Explaining the Philosophical Core (3 mins):** Explain Williams to the psychologists without using "deontological/utilitarian" jargon. Use the "saving the spouse" example. Define "ground projects" not as hobbies but as what makes life worth living. Explain the "alienation" worry (having to justify love).
      *   **Bringing it to the Clinic (3 mins):** This is where the structural work happens.
          *   *Scenario:* Triage. Choosing between a stranger and a family member.
          *   *Claim to Defend:* In personal capacity, the integrity objection holds. A caregiver refusing to treat their own child to maintain impartiality is morally bizarre.
          *   *Claim to Withhold:* In professional capacity, the objection hits a limit. The role of "caregiver" imposes an impartial structure. If a surgeon prioritizes their spouse in the OR over a more critical stranger, that's corruption, not integrity.
          *   *Nuance:* Where does the professional role end and the human begin? Burnout? Moral distress?
      *   **The Synthesis/Constraint (2 mins):** How does this shape the workshop? We aren't asking "How do we eliminate bias?" We are asking "Which biases are constitutive of moral agency and which are professional failures?" The Williams objection prevents us from demanding total impartiality from humans, but professional ethics demands a specific *type* of impartiality.
      *   **Conclusion:** Summarize the path forward.
      *   **Verdict Sentence:** Strict format.

  4.  **Refining the Tone:**
      *   *For Philosophers:* Don't dumb down Williams. Acknowledge the "one thought too many" idea.
      *   *For Psychologists:* Don't talk about "normativity" or "meta-ethics." Talk about "decision-making structures," "motivational architecture," "role-defined obligations."
      *   *Structural Work:* Ensure I explicitly say "This means we cannot claim X" or "This allows us to defend Y."

  5.  **Drafting - Iteration 1 (Mental Check):**
      *   *Word Count:* Need to ensure it's long enough for 10 minutes. ~1300-1500 words.
      *   *Jargon Check:* Avoid "consequentialism," "categorical imperative." Use "impartial calculation," "duty."
      *   *Williams Check:* Ensure "ground projects" isn't confused with "preferences." A preference is "I like ice cream." A ground project is "I am a father."
      *   *Clinical Check:* Ensure the distinction between personal caregiving (family) and professional caregiving (doctor/nurse) is clear.

  6.  **Drafting - Writing the Content:**
