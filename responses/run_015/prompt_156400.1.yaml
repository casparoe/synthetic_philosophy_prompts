prompt: |-
  I'm delivering the opening remarks at a one-day interdisciplinary workshop titled Ground Projects and Moral Psychology, held in a university lecture hall before a split audience: half are analytic moral philosophers thoroughly familiar with Bernard Williams's work on integrity, and half are clinical psychologists who study caregiver decision-making under resource constraints but have no background in normative ethics. The workshop's central question is whether Williams's integrity objection — specifically his concern that impartial moral theory can insert an alienating step of reasoning between an agent and their deepest commitments, the idea that saving one's partner requires explicit moral justification rather than immediate recognition — has any traction in clinical settings where caregivers routinely choose between family members and strangers. Write a ten-minute address in which this objection does genuine structural work: it must determine which claims about clinical ethics can be defended and which must be withheld, shaping the arc and limits of the speech rather than serving as decorative reference. The address should be rigorous enough that philosophers recognize the distinction between ground projects and mere preferences, yet accessible enough that psychologists can follow without jargon or pop-psychology simplification. Do not include bibliographies, citations, or reading lists; the reasoning should stand entirely on its own. End the response with exactly one sentence summarizing the speech's central claim, formatted as: Verdict: [summary].
