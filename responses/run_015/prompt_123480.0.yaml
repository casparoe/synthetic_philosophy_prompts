answer: |-
  There is no single, canonical Latin name for this specific maneuver (like *ad hominem* or *post hoc*), but it is a well-recognized problem in moral, legal, and political philosophy known as **The Baseline Problem**. When used rhetorically to secure a conclusion by shifting the comparison point without justification, it is best classified as a form of **Begging the Question (Petitio Principii)** combined with **Special Pleading**.

  In the literature of welfare economics and legal theory (specifically Cass Sunstein, Joel Feinberg, and Robert Nozick), this is discussed as **Normative Baseline Selection**. Because there is no single fallacy name that captures the *strategic shifting* of these baselines, I will coin the term **"Motivated Baseline Selection"** for your use in debate, with a definition and boundaries below.

  ### 1. The Established Literature: "The Baseline Problem"
  Your intuition is correct: the state of affairs against which "harm," "benefit," or "rights" are measured is not objective; it is normative. The literature calls this **The Baseline Problem**.

  *   **Joel Feinberg (*Harm to Others*):** Argues that to claim someone is "harmed," you must compare their current state to a baseline. Is the baseline "what they currently have" (status quo) or "what they are owed" (normative entitlement)? Feinberg shows that choosing the baseline often decides the argument before it begins.
  *   **Cass Sunstein (*Legal Reasoning and Political Conflict*):** Explicitly discusses how legal and political arguments rely on "status quo baselines" versus "entitlement baselines." He notes that advocates often treat the status quo as "natural" when it benefits them and "unjust" when it does not.
  *   **Robert Nozick (*Anarchy, State, and Utopia*):** Your partner's objection is actually a summary of Nozick's **Entitlement Theory**. Nozick argues the only valid baseline is historical entitlement (what you already own). Under Nozick, a tax *is* a harm (taking what is owned), and unaffordable care *is not* a harm (no entitlement to others' labor).

  **Why this differs from Positive/Negative Rights:**
  Positive/Negative rights are *justifications* for choosing a baseline.
  *   *Negative Right:* Baseline = Non-interference (State of Nature/Current Holdings).
  *   *Positive Right:* Baseline = Need/Entitlement.
  Your opponent is not arguing for one type of right; they are **switching between them** to maximize damage to your side. That is the fallacy.

  ### 2. The Coined Term: "Motivated Baseline Selection"
  Since no classical fallacy name captures the *shifting* nature of this move, use this term.

  **Definition:** The fallacy of **Motivated Baseline Selection** occurs when an arguer selects the counterfactual baseline (the "compared to what?") not based on a consistent moral or empirical principle, but solely because it generates the desired evaluation of harm, benefit, or rights in that specific instance.

  **Boundary Cases:**
  *   **Applies (Fallacy):** An opponent argues that a tax is "theft" (Baseline: Pre-tax income is owned) but argues that a lack of market access is "freedom" (Baseline: No entitlement to care). They treat income as an entitlement but care as a commodity *within the same framework* without explaining why the moral status of the two differs.
  *   **Does Not Apply (Principled):** An opponent argues *consistently* from a Libertarian/Nozickian framework. They argue: "Taxes are harm because they violate property rights. Lack of care is not harm because there is no positive right to care. Public waitlists are harm because the state *created* an entitlement by promising care and failed to deliver."
      *   *Note:* In your example (b), if the opponent admits the public system *creates* an entitlement (a promise) which it then breaks, that is a consistent baseline (Promise-Keeping). If they argue the patient is owed care *by right of humanity*, they contradict (a). You must pin them on whether (b) is a breach of promise or a violation of right.

  ### 3. Evaluating Your Partner's Objection
  Your partner says: *"A tax removes what someone already has, whereas unaffordable care was never his, so the two cases genuinely call for different baselines."*

  **Verdict:** This is a **principled distinction, not a rationalization, but only if applied consistently.**

  Your partner is articulating the **Historical Entitlement Baseline**. This is a coherent philosophical position (Nozickian Libertarianism). It survives the accusation of fallacy *if and only if* your opponent applies it to *every* part of the round.

  **Where your partner's defense fails (and where you win):**
  Look at your example (b): *"The same advocate says that a patient who waits four months... is being denied care."*
  *   **If the baseline is Historical Entitlement:** The patient is *not* being denied care. They have no historical claim to the surgeon's time. Waiting is unfortunate, but not a rights violation.
  *   **If the baseline is Need/Entitlement:** The patient *is* being denied care.

  If your opponent argues (a) using Historical Entitlement (no right to care) but argues (b) using Need/Entitlement (right to care violated by waitlist), they are committing **Motivated Baseline Selection**. They are using the Entitlement Baseline to defend markets (a) and the Need Baseline to attack public systems (b).

  **How to expose this in-round:**
  Do not accuse them of "not knowing philosophy." Accuse them of **inconsistency**.
  *   *"My opponent claims the baseline for harm is 'property rights' when discussing taxes (c) and market access (a). But when discussing public waitlists (b), they suddenly switch the baseline to 'need.' They cannot claim property rights protect the wealthy from taxes while claiming need rights protect the sick from waitlists. They must choose one baseline for harm. If they choose property, waitlists aren't harmful. If they choose need, market exclusion is harmful. They cannot have both."*

  ### Summary for Debate
  1.  **Name:** Call it **Motivated Baseline Selection** (a form of Special Pleading/Begging the Question).
  2.  **Literature:** Cite the **Baseline Problem** (Sunstein/Feinberg).
  3.  **Partner's Objection:** Acknowledge it is a valid **Entitlement Theory** argument, but point out the opponent is not *actually* using Entitlement Theory consistently (because of the waitlist argument).
  4.  **The Move:** Force them to pick **one** baseline for the entire round. If they pick "Current Holdings," you lose the tax argument but win the care argument. If they pick "Human Need," you win the tax argument but lose the care argument. Their ability to float between them is the source of their advantage.

  This approach validates your partner's theoretical point (that baselines *can* differ principledly) while preserving your strategic point (that this opponent is doing it arbitrarily).
