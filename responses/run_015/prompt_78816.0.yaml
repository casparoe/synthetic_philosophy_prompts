prompt: |-
  Ok, so I've been chewing on this for a while and I want to know what principle, if any, is actually driving my gut. It started with the Darwin and Wallace thing and then I started making up cases. Assume throughout that the result is correct, important, and not fraudulent.

  1. Two people on different continents prove the same theorem within a few weeks of each other, neither aware of the other, both proofs complete. Whoever publishes first gets the name on it. My verdict: they discovered it equally, and the name is an accident of the postal service. If I could, I'd put both names on the theorem.

  2. Same setup, except the second person publishes 25 years later, having had the proof in a drawer the whole time. My verdict: they still discovered it, and I'd even say they got there first, but they shouldn't get the name, and I don't feel bad about that.

  3. Someone publishes the result in an obscure journal in the 50s. It's correct. Nobody reads it, nobody can use it. It gets re-proved in the 80s, becomes famous, and carries the 80s person's name. My verdict: the 80s person is the discoverer. The 50s person gets a paragraph in a history paper and that seems right. And I'd say the same even if the 80s proof was basically a reproduction of the 50s one. (When it finally gets noticed, by the way, three separate people rediscover it in the same year.)

  4. Someone builds a big framework and never states the corollary that everyone else sees immediately. A student of theirs states it the next year and it's named after the student. My verdict: the theorem is the framework-builder's and the naming is an injustice -- even though they never said it, and even though the step from framework to theorem is trivial.

  5. Four groups get the same result within a year, and everyone at the time was saying it was coming, people were giving conference talks about how all the pieces were sitting there. My verdict: the first one still deserves full credit, no discount.

  6. Somebody notices something totally unexpected while doing something else, in a field where nobody was even asking the question. Verdict: this is the paradigm of discovery, maximum credit.

  7. Somebody announces the same true thing years earlier on the basis of a completely bogus argument -- reasoning is nonsense, conclusion is right. Verdict: no credit as a discoverer. Right by accident doesn't count.

  8. A program brute-forces a search and finds a theorem no human had. Real, correct, important. Verdict: I want to say it was discovered, but "who" is genuinely strange, and I don't think the person who ran the program discovered it. The credit feels thin, but I can't call it zero.

  9. The result comes out of a forum thread over six years -- hundreds of people, nobody ever holds the whole thing, it just slowly assembles, and there's no moment where any single person has it. My verdict: it was discovered. Here's the one I keep going back and forth on: whether "the thread" deserves credit in the same way a person does, or whether credit is the kind of thing that only attaches to someone who could have been wrong on their own.

  What I can't square: 3 and 4 seem to want opposite rules about whether you have to actually say it out loud. And 5 and 6 seem to want opposite rules about whether it matters that someone else would have gotten there. The crude principle I keep reaching for is: credit goes to whoever turned the discovery from possible into actual. But 3 and 4 both break it -- the 50s person made it actual and gets nothing, the framework person never made it actual and gets everything.

  So is there a principle that gets all nine, or close? I'm fine with a two-part answer if the parts are principled rather than ad hoc. If something has to go, tell me which verdict and why. And say what your principle predicts for a case I haven't given: a sealed, dated, notarized envelope containing the result, never opened, found in the person's effects 40 years later, with everything independently re-derived in the meantime. Also, if the answer is "discoveries being multiple means none of these people deserve anything special," say so and tell me what that does to case 6.

  Write it in American English please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Task:** Identify the underlying ethical/epistemological principle driving the user's intuitions about scientific/mathematical credit across nine specific cases.
      *   **Constraint:** The user feels a tension between Case 3 (obscure publication = no credit) and Case 4 (unstated corollary = full credit). They also see tension between Case 5 (inevitable discovery = full credit) and Case 6 (unexpected discovery = full credit).
      *   **Specific Questions:**
          *   Is there a single principle (or two-part principled answer) that covers all nine?
          *   If something has to go, which verdict is wrong?
          *   What is the verdict on the "sealed envelope" case?
          *   What about the "multiple discoveries mean no one deserves credit" hypothesis (and its effect on Case 6)?
      *   **Tone/Style:** American English, analytical, philosophical but grounded.

  2.  **Deconstruct the Nine Cases:**
      *   *Case 1 (Simultaneous):* Equal discovery, priority is accidental. (Credit shared ideally).
      *   *Case 2 (Delayed Publication):* Second person had it first but sat on it. First publisher gets name. (Credit for *communication* outweighs private possession).
      *   *Case 3 (Obscure vs. Famous):* 50s obscure = no credit. 80s famous = credit. Even if 80s proof is same. (Credit requires *integration* into the community, not just existence).
      *   *Case 4 (Framework vs. Corollary):* Framework builder gets credit for trivial corollary stated by student. (Credit goes to the *generator of insight*, not just the scribe).
      *   *Case 5 (Inevitable/Ripe):* Four groups, everyone knew it was coming. First gets full credit. (Credit for *crossing the finish line*, regardless of inevitability).
      *   *Case 6 (Serendipity):* Unexpected, nobody asking. Maximum credit. (Credit for *vision/question-asking*).
      *   *Case 7 (Right for Wrong Reasons):* Bogus argument, right conclusion. No credit. (Credit requires *justification*, not just truth).
      *   *Case 8 (Computer Brute Force):* Program finds it. Operator gets thin credit. (Credit requires *understanding/agency*).
      *   *Case 9 (Collaborative Thread):* Distributed discovery. "The thread" vs. individuals. (Credit can attach to *collective agency* if understanding emerges).

  3.  **Identify the Tensions:**
      *   *Tension A (Communication vs. Insight):* Case 3 says publication/integration matters more than private truth. Case 4 says insight matters more than explicit statement.
      *   *Tension B (Inevitability vs. Novelty):* Case 5 says inevitability doesn't reduce credit. Case 6 says novelty/unexpectedness maximizes credit. (Actually, the user says 5 and 6 seem to want opposite rules about whether it matters someone else would have gotten there. In 5, others *were* getting there. In 6, others *weren't* asking. So the tension is: Does the *context of the field* matter? Yes, but credit is awarded differently).

  4.  **Formulate a Unifying Principle:**
      *   The user's draft principle ("turned discovery from possible into actual") fails on 3 and 4.
      *   *Hypothesis:* Credit isn't about *truth* (which is platonic/existent); it's about *transmission and utility* within a community of knowers.
      *   *Refinement:* Scientific credit is a social currency designed to incentivize the *growth of reliable knowledge*. It rewards **effective agency in expanding the communal knowledge base.**
      *   *Key Distinction:* There are two components to "Discovery":
          1.  **Generation:** Creating the insight/proof (Epistemic contribution).
          2.  **Propagation:** Making it usable/known to the community (Social contribution).
      *   *Resolution of Case 3 vs. 4:*
          *   Case 3: The 50s person failed at Propagation. The 80s person succeeded at Propagation (and arguably Generation, since independent re-derivation counts as generation). The 50s proof was "dead information."
          *   Case 4: The Framework person succeeded at Generation (the heavy lifting). The Student succeeded at Propagation (stating it). But the *value* lies in the Generation. The Student was a conduit; the Framework builder was the source.
      *   *Resolution of Case 5 vs. 6:*
          *   Credit is relative to the *marginal contribution* to the field's state.
          *   Case 5: The field was ready. The marginal contribution is "crossing the line." It's valuable because it *unlocks* the next steps. Being first unlocks it.
          *   Case 6: The field was stuck. The marginal contribution is "opening a new door."
          *   Both get credit because both change the *state of the field*.

      *   *Proposed Principle:* **The Principle of Effective Epistemic Contribution.**
          *   Credit is assigned based on who effectively altered the state of the community's knowledge in a way that allows further work.
          *   It requires **Justification** (Case 7), **Agency/Understanding** (Case 8), and **Accessibility** (Case 3).
          *   It prioritizes **Generative Insight** over **Formal Statement** (Case 4).

  5.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the depth of the question. It's about the sociology of science, not just logic.
      *   *The Core Principle:* Define "Communal Usability." Science is a collective project. A fact isn't "scientific" until it's available to the community to build upon.
      *   *Addressing the Tensions:*
          *   *3 vs. 4 (Visibility vs. Insight):* Distinguish between *articulation* and *generation*. Case 3 fails on usability (dead letter). Case 4 succeeds on generation (the framework *contained* the truth effectively, even if implicit). The student was a translator, not the architect.
          *   *5 vs. 6 (Inevitability):* Credit is for *changing the state of the field*. In 5, the state changed from "almost" to "done." In 6, the state changed from "blind" to "seeing." Both are high-value state changes.
      *   *Addressing the "Multiple Discovery = No Credit" Hypothesis:* Reject this. If we did that, we kill incentives (Case 6 suffers). We reward the *act* of completion.
      *   *The Sealed Envelope Case:* This is the test.
          *   If found 40 years later: No credit for discovery. Why? Because it didn't alter the communal state *at the time*. It's historical curiosity, not scientific contribution. It matches Case 3 (private/obscure) more than Case 2 (delayed but eventually published). Actually, it matches Case 3 exactly.
      *   *Refining the Verdicts:*
          *   Case 8 (AI): The operator gets credit for *validation* and *interpretation*. The AI is a tool.
          *   Case 9 (Thread): The "Thread" is a collective agent. Credit goes to the synthesis.

  6.  **Review and Refine (Self-Correction during drafting):**
      *   *Critique:* Is Case 4 really consistent? If the framework builder never said it, how did they alter the communal state?
      *   *Correction:* In Case 4, the framework *was* published. The corollary was *latent* in the published work. The student made it *explicit*. But the *intellectual weight* belongs to the framework. The principle should weigh *intellectual debt*. The community recognizes the student named it, but cites the framework builder for the *idea*. The user's verdict says "Theorem is the framework-builder's." I need to support that.
      *   *Argument:* The "discovery" is the *connection*. The framework builder built the bridge. The student just pointed at a specific plank.
      *   *Case 3 Re-evaluation:* Why does the 50s person get nothing? Because "scientific truth" is defined by its role in the network of knowledge. A node with no connections (citations, usage) is functionally non-existent.
      *   *Principle Name:* "The Principle of Communal Integration." Or "The Principle of Effective Knowledge Transfer." Let's go with **The Principle of Communal Utility**.

  7.  **Final Polish:**
      *   Ensure American English spelling/idioms.
      *   Make sure the "Sealed Envelope" verdict is clear.
      *   Ensure the "Multiple Discovery" objection is handled firmly.

  8.  **Final Output Structure:**
      *   The Principle (Communal Utility).
      *   Resolving the 3 vs. 4 Conflict (Generation vs. Transmission).
      *   Resolving the 5 vs. 6 Conflict (State Change).
      *   The Sealed Envelope Verdict.
      *   The "No Credit for Multiples" Objection.
      *   Conclusion.

  *(Self-Correction on Case 4)*: Wait, the user says "The theorem is the framework-builder's... even though they never said it." This is the hardest one. If they never said it, how is it their discovery?
  *Reasoning:* Because the *work* was done. The corollary is a trivial logical step from the framework. The "discovery" is the heavy lifting of the framework. The student merely performed a mechanical deduction. The principle must value *intellectual labor/insight* over *utterance*.
  *Refined Principle:* **Credit tracks the bottleneck of insight.**
  *   Case 3: The bottleneck was *access*. The 50s person failed to clear it.
  *   Case 4: The bottleneck was *insight*. The Framework person cleared it. The student cleared the trivial access step.
  *   This unifies everything beautifully.

