answer: |-
  You have stumbled onto the central tension in the philosophy of science: the conflict between **Platonism** (truth exists waiting to be found) and **Social Constructivism** (truth is what the community accepts and uses).

  Your gut is not inconsistent. It is tracking a specific, functional principle that governs how science actually works, rather than how we imagine it works in the abstract. The principle that reconciles your nine cases is this:

  **The Principle of Communal Utility:**
  *Scientific credit is not a reward for possessing the truth; it is a reward for effectively altering the state of the community's knowledge in a way that enables further work.*

  Under this principle, a "discovery" is not an event that happens in a head or on a piece of paper. It is an event that happens in the **network of researchers**. To get credit, you must clear the specific bottleneck that was preventing the community from using that truth.

  Here is how this principle resolves your tensions, handles the new case, and addresses the "multiple discovery" objection.

  ### 1. Resolving the Tension: Case 3 vs. Case 4
  You feel these contradict because one rewards "saying it" (Case 3) and the other rewards "thinking it" (Case 4). But under the Principle of Communal Utility, they are consistent. Credit goes to whoever cleared the **bottleneck**.

  *   **Case 3 (The Obscure Journal):** The bottleneck here was **transmission**. A proof in an unread journal is functionally identical to a proof in a drawer. It does not alter the community's state because it cannot be built upon. The 50s person failed to clear the transmission bottleneck. The 80s person cleared it. The fact that the 80s person re-derived it is secondary; their primary contribution was making the truth *live* in the community.
  *   **Case 4 (The Framework):** The bottleneck here was **insight**. The framework contained the heavy intellectual lifting. The corollary was a trivial logical step. The student cleared the "transmission" bottleneck (stating it explicitly), but the "insight" bottleneck was already cleared by the mentor. Since the value of the theorem lies in the insight, not the utterance, the credit flows to the source of the insight. The student is a scribe; the mentor is the architect.

  **The Rule:** If the hard part is finding the truth, credit goes to the finder (Case 4). If the hard part is making the truth available to the field, credit goes to the publisher (Case 3).

  ### 2. Resolving the Tension: Case 5 vs. Case 6
  You see a conflict between "inevitable" (Case 5) and "unexpected" (Case 6). But both are rewarded for the same reason: **State Change.**

  *   **Case 5 (The Race):** The field was in a state of "almost." The first person to publish changed the state to "done." This unlocks the next phase of research for everyone. It doesn't matter that others were close; *being* close doesn't unlock the door. Only *crossing* does. Credit is for the completion that allows others to proceed.
  *   **Case 6 (The Serendipity):** The field was in a state of "blindness." The discoverer changed the state to "vision." This creates entirely new paths.
  *   **Why both get full credit:** In both cases, the individual is the **causal agent** of the state change. In Case 5, you are rewarded for speed and execution. In Case 6, you are rewarded for vision. Both are scarce resources that the scientific ecosystem needs to function.

  ### 3. The "Multiple Discovery" Objection
  You asked: *If the answer is "discoveries being multiple means none of these people deserve anything special," say so.*

  The answer is **no**. If we adopted a rule that "multiple discovery dilutes credit," we would break the incentive structure of science.
  *   **Effect on Case 6:** If serendipitous discoverers knew they might get zero credit because someone else was likely to find it eventually, they would not invest the risk capital required to look in weird places.
  *   **The Principle:** Science is not a zero-sum game of "who was destined to find this." It is a practical system for generating knowledge *now*. The first person to validate and publish provides a public good *today*. The fact that someone else would have done it *tomorrow* is irrelevant to the value of having it *today*.

  ### 4. The Sealed Envelope Case
  Here is the verdict for your new case: *A sealed, dated, notarized envelope containing the result, never opened, found in the person's effects 40 years later, with everything independently re-derived in the meantime.*

  **Verdict:** **Zero credit for discovery.**

  **Why:** This is the ultimate test of the Principle of Communal Utility.
  1.  **No State Change:** The envelope did not alter the community's knowledge state at the time. It was causally inert.
  2.  **No Utility:** It could not be built upon.
  3.  **No Validation:** Until opened, the claim was not subject to peer scrutiny. Science requires public verification, not private certainty.

  The person in the envelope case is historically interesting, but scientifically, they did not "discover" anything in the sense that matters to the field. They possessed a truth, but they did not *publish* a discovery. This aligns perfectly with your verdict on Case 3 (the obscure journal). If an unread journal gets no credit, a sealed envelope gets even less.

  ### 5. Adjusting One Verdict (Case 8)
  You mentioned Case 8 (The Brute-Force Program) felt "thin" but not zero. To make the principle hold tight, you need to be precise here.

  **Refined Verdict:** The person who ran the program gets credit for **verification**, not discovery.
  If the program finds a theorem no human understands, the "discovery" is incomplete. A theorem requires a proof that explains *why*. If the program is a black box, the community has a fact, but not knowledge.
  *   **Credit:** Goes to the person who interprets the output and integrates it into human understanding. If they just print the output, they are a technician. If they analyze *why* the program found it, they are the discoverer.
  *   **Principle:** This reinforces the "Agency/Understanding" requirement (Case 7). Truth without justification is not scientific credit.

  ### 6. The Thread (Case 9)
  Your hesitation here is whether a collective can be an agent. Under the Principle of Communal Utility, **yes**.
  If the "Thread" functions as a single cognitive unit where the knowledge is assembled and validated, the "Thread" is the discoverer. In practice, we handle this by citing the "Thread" (e.g., "Polymath Project") or citing the summary paper written by the synthesizers.
  *   **Your constraint:** *"Whether credit is the kind of thing that only attaches to someone who could have been wrong on their own."*
  *   **Resolution:** The "Thread" can be wrong. The collective can be corrected. Therefore, the collective bears the risk of error, and thus earns the credit for truth.

  ### Summary of the Driving Principle
  Your gut is driven by **Pragmatic Communalism**.

  You do not believe credit is owed to the person who *touches* the truth first (Platonism). You believe credit is owed to the person who *delivers* the truth to the community in a usable form (Pragmatism).

  *   **Case 3** fails because the delivery failed.
  *   **Case 4** succeeds because the intellectual delivery (the framework) was the hard part.
  *   **Case 5 & 6** succeed because both deliver a state change.
  *   **The Envelope** fails because it is a delivery that never arrived.

  This principle preserves the incentive to work hard (Case 5), the incentive to look in new places (Case 6), the incentive to publish clearly (Case 3), and the requirement for understanding (Case 7 & 8). It treats science not as a hunt for hidden objects, but as the construction of a shared building. You only get credit for the bricks you lay that others can actually walk on.
