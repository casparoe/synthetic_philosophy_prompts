  To reverse-engineer Dana's ethical framework, we need to look for the principle that consistently explains why she bans kidney and vote sales but permits plasma sales. Here are the three candidate rules that fit her track record, how they apply to the new case, and which one is most likely hers.

  ### Candidate Rule 1: The Harm Principle
  **Logic:** Transactions are impermissible if they cause serious physical harm to the seller or significant damage to the social fabric (e.g., democracy).
  *   **Track Record Fit:**
      *   *Kidney:* Impermissible (High surgical risk, permanent loss of health).
      *   *Vote:* Impermissible (Harms the democratic system/society).
      *   *Plasma:* Permissible (Regenerable, low physical risk).
  *   **Prediction for Postmortem Kidneys:** **Permissible.** The seller is dead, so there is no physical harm to her. If the market is "well regulated," the social harm is mitigated. The estate benefits, and the buyer benefits.
  *   **Weakness:** This struggles to explain why she might ban vote selling solely on civic grounds without invoking a "special status" for votes, and it ignores the commodification aspect bioethicists often care about.

  ### Candidate Rule 2: The Exploitation Principle
  **Logic:** Transactions are impermissible if they rely on the seller's vulnerability or weak bargaining power (e.g., poverty), treating them as a means to an end.
  *   **Track Record Fit:**
      *   *Kidney:* Impermissible (Sellers are typically desperate/poor).
      *   *Vote:* Impermissible (Undermines equality; poor sell to rich).
      *   *Plasma:* Permissible (Viewed as compensated service; regulation limits abuse).
  *   **Prediction for Postmortem Kidneys:** **Impermissible.** The prompt specifies the student is "broke." Even if she isn't harmed physically, the contract is signed under financial duress, making it exploitative.
  *   **Weakness:** Bioethicists who oppose organ sales usually oppose them even for the wealthy (principle-based), not just the poor. Also, plasma markets are notoriously exploitative; if she calls plasma "perfectly fine," exploitation likely isn't her primary veto.

  ### Candidate Rule 3: The Special-Goods Principle (Commodification)
  **Logic:** Certain goods are "market-inalienable" because they are constitutive of personhood, bodily integrity, or civic standing. They lose their value or corrupt the seller/society if priced. Regenerable fluids are exceptions; vital organs and rights are not.
  *   **Track Record Fit:**
      *   *Kidney:* Impermissible (Vital organ, constitutive of bodily integrity).
      *   *Vote:* Impermissible (Constitutive of citizenship, not a commodity).
