      *   Address the "Stranger" horn: If B is isolated, B is effectively a stranger. Reflection doesn't apply to strangers.
      *   Address the "Metaphysics" horn: Defining the scope of "my" is pragmatic, not metaphysical. It's about the continuity of commitment.
      *   Conclude: Reflection stands, but its application requires agent continuity defined by informational/causal links, not substance.

      *Wait, one nuance:* Van Fraassen is careful not to reduce epistemology to psychology. But he also acknowledges that belief is a human activity. I must walk the line. The "self" in Reflection is the subject of the belief state. If the subject changes (functionally), the principle doesn't bind.

