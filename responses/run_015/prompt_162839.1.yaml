answer: |-
  The list is not jointly satisfiable because fixing the grain of the base in advance contradicts the latitude needed to explain re-functionalized inherited elements, requiring the abandonment of the fixed grain requirement to preserve historical fidelity.

  **Reasoning:** To judge individual causal claims without unfalsifiable redescription, the economic base must be defined at a specific level of abstraction prior to analysis (Requirement 2). However, handling "callback" cases where an old form is revived for a new economic function often demands redescribing the base to show *why* that specific form is now functional (Requirement 3). If the grain is fixed, the theory cannot account for the re-functioning without calling it "inert residue," which misclassifies active adaptation; if the theory allows redescription to capture the function, the grain was not fixed, rendering the causal claim immune to falsification.

  ### Desiderata for Base-Superstructure Causal Claims

  | Requirement | Motivating Case / Consideration | Status |
  | :--- | :--- | :--- |
  | **1. Mechanism Differentiation** | Distinguishes whether the base *creates* a form, *selects* it from existing variants, or *shapes* its content while leaving the form intact. Tests only for origination misclassify selection as creation. | Non-negotiable |
  | **2. Base Granularity** | Fixes the level of economic description (e.g., "capitalism" vs. "finance-led capitalism") in advance. Prevents explaining away mismatches by redescribing the base post-hoc to fit the effect. | Non-negotiable |
  | **3. Provenance Handling** | Accounts for diffusion (hand-me-down) and revival (callback). Must distinguish inert residue from reactivated residue pressed into service by the current structure. | Non-negotiable |
  | **4. Constitutive Boundary** | Defines whether legal forms (property, contract) are internal to the relations of production or external effects. If internal, the base cannot explain the law without tautology; if external, the base must be defined non-juridically. | Non-negotiable |
  | **5. Reverse Causality** | Explicitly allows or excludes "wrong-way" cases (e.g., religious doctrine shaping accumulation). A theory excluding these must show why they are impossible, not just improbable. | Negotiable |
  | **6. Internal/External Distinction** | Separates a practice's internal content, the resources it attracts (uptake), and the uses of its results (direction). Science may be content-neutral but direction-biased. | Non-negotiable |
  | **7. Last Instance Operationalization** | Specifies what "determination in the last instance" means empirically and what evidence would count against it. Without falsification conditions, the claim is metaphysical. | Non-negotiable |

  ### Incompatible Requirements
  The two requirements that cannot be jointly satisfied are **Base Granularity (2)** and **Provenance Handling (3)**. Fixing the grain of the base in advance prevents the theorist from refining the economic description to demonstrate *why* an archaic form (like feudal honor idioms) has become functional for a modern officer corps. To explain the re-functioning, one must often specify the base more finely (e.g., "a capitalism requiring nationalist mobilization"), but doing so violates the pre-fixed grain constraint. If you hold the grain fixed, you must classify the form as "inert residue," risking empirical error; if you refine the grain to fit the function, you sacrifice falsifiability.

  ### Most Exclusionary Requirement
  **Last Instance Operationalization (7)** excludes the most candidates. Nearly all existing frameworks (Althusserian structuralism, orthodox Marxism, many Weberian adaptations) treat the "last instance" as a philosophical safeguard or a long-run tendency that cannot be empirically negated in a specific case. Demanding a specific condition under which one would admit the economic base did *not* determine the outcome eliminates any theory that relies on the formula as an unfalsifiable axiom.

  ### Scorecard of Familiar Positions

  *   **Straight Reductionism:** Fails Mechanism Differentiation and Constitutive Boundary; treats all superstructural elements as origination rather than selection or shaping, and often collapses law into economics.
  *   **Functional Explanation:** Fails Base Granularity and Reverse Causality; tends to redescribe the base to fit the function of the superstructure and excludes wrong-way causation by definition.
  *   **Relative Autonomy:** Fails Last Instance Operationalization; grants reciprocal causation but rarely specifies the conditions under which economic determination would be falsified.
  *   **No Economic Essence:** Fails the project entirely; rejects the premise that there is a distinct economic base to be related to social life, rendering the causal claims meaningless rather than false.
