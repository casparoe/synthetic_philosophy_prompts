prompt: |-
  I'm an undergraduate in a philosophy of science seminar who also uses Bayesian networks in my cognitive-science coursework. Restate Quine's position that moral values lack the ontological standing of scientific entities — treating them as socially coordinating devices rather than parts of our world-model — in the vocabulary of Bayesian inference: priors, likelihood updates, model comparison, explanatory coherence, and regularization. Specifically, map scientific claims onto empirically fitted parameters and moral norms onto either fixed priors or regularization terms that constrain belief revision without being subject to evidential update themselves. Then give the residue report: which parts of Quine's distinction between cognitive and non-cognitive values survive this translation intact, which parts require distortion (for instance, rendering 'social coordination' as an optimization objective), and whether anything essential — particularly his claim that moral discourse is ontologically second-class in a way mathematical discourse is not — has no counterpart in Bayesian vocabulary. Is the missing residue a limitation of the Bayesian framework's ability to distinguish kinds of commitment, or does it reveal that Quine's separation of ethics from ontology depends on assumptions that do not survive formalization?
