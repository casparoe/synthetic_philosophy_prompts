prompt: |-
  hey, i'm a junior and i'm VP of student gov, and on thursday at assembly i've got roughly 4 minutes to speak on whether our school should take in the ~200 kids from Eastside when it closes in the fall. we're already over capacity — six portable classrooms, halls are a nightmare between periods — and a bunch of parents are furious. one of them wrote into the school paper wether we'd all "fit in the lifeboat," so i looked it up and its the old Garrett Hardin thing: a lifeboat holds a fixed number of people, if you pull in more than it holds everyone drowns, so you have to leave some people in the water.

  i want to argue that we SHOULD take them, but i don't want to fake it: the lifeboat worry feels true to those parents and if i just wave it away i think they'd be right to be annoyed. two things i keep coming back to. first, a lifeboat's capacity is set by physics and a school's isn't — class size caps, hiring, the new gym somebody just approved, and the boundary lines that decided we're the ones in the boat and they're the ones in the water. second, one parent brought up the margin-of-safety idea, that a boat shouldn't be loaded right up to its limit because one wave swamps it, and honestly that worries me most because we ARE at our limit, so i need something better than "we'll manage."

  the room is mixed: anxious parents, teachers, our principal who told me not to make anyone feel like a villain, Eastside kids sitting in the front rows, and my econ teacher Mr. Delgado who actually taught the lifeboat reading last year and will notice if i misrepresent it. so: concession first, then the turn, plain spoken, no lecturing, and nothing that makes the Eastside kids sound like charity cases or like a tide.

  you're a professional speechwriter who also happens to have a PhD in philosophy. think hard about this: brainstorm five or six genuinely different angles before you commit to one, and tell me in a line or two why you dropped the others. then write the speech.

  after the speech, give me a JSON object with exactly these fields:
  - "opening_line": the first sentence of the speech, verbatim
  - "conceded": the lifeboat worry the speech actually grants, in the speech's own words
  - "the_turn": the sentence or beat where it stops conceding and starts arguing
  - "margin_of_safety_answer": how it deals with the "don't load the boat to its limit" point without just denying it
  - "deliberately_not_said": an array of 2-3 strings, each one thing the speech leaves out on purpose and why
  - "expert_line": the one line only people who've studied the metaphor will catch, and what work it's doing in the argument
  - "riskiest_line": the line most likely to backfire in that specific room, and why
  - "estimated_seconds": a number
