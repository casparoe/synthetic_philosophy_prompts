answer: |-
  ### Brainstorming Angles

  1.  **The Moral Imperative:** Argue that helping is simply the "right thing to do."
      *   *Drop:* Sounds like charity. Makes Eastside students seem like burdens we are nobly accepting, which violates the dignity constraint.
  2.  **The Legal Mandate:** Argue that the district will force us anyway, so resistance is futile.
      *   *Drop:* Defeatist. Removes student agency and makes the administration look powerless, which violates the Principal's constraint.
  3.  **The Economic Benefit:** Argue that more students mean more funding for clubs and sports.
      *   *Drop:* Too transactional. Reduces human beings to line items, which Mr. Delgado and the Eastside kids would resent.
  4.  **The Category Error (Selected):** Argue that a school is fundamentally different from a lifeboat because educational capacity is political, not physical.
      *   *Keep:* This directly addresses the Hardin metaphor without being abstract, validating the parents' fear while correcting the premise.
  5.  **The Shared Vulnerability:** Argue that our school is already struggling, and merging resources makes us all safer.
      *   *Drop:* Too close to admitting failure. Might spook parents who think the school is already sinking.
  6.  **The Community Definition:** Argue that Eastside kids are already our neighbors and friends.
      *   *Drop:* Good, but needs the structural argument (Angle 4) to back it up emotionally. I will weave this into the selected angle.

  ### Speech

  Good morning. I walk past the six portables every day, and I know what it feels like to squeeze through the halls when the bell rings. When a parent wrote that we're all in a lifeboat, and that adding more people means everyone drowns, I understood why that felt true. It looks like we're at the limit. It feels like there's no more room.

  But here is where I have to disagree. A lifeboat's capacity is set by physics. If you add weight to a boat, it sinks. But a school's capacity isn't physics; it's policy. Class sizes, hiring budgets, schedule blocks, even where we draw the boundary lines—those are choices we make, not laws of nature. Mr. Delgado taught us last year that Hardin's lifeboat assumes the waterline is fixed. But in a school, we decide where the waterline sits.

  I know the worry isn't just about space; it's about safety. One parent said you shouldn't load a boat to its limit because one wave swamps it. They're right. You don't survive a storm by hoping the hull holds. You survive by reinforcing it. If we take in our neighbors from Eastside, we can't just shove them into the crowded halls and say "we'll manage." That isn't safety. Safety means we use this moment to fix the things that are already broken. It means we adjust the class caps. It means we hire the teachers we've been asking for. It means we use the new gym space differently.

  A margin of safety isn't empty seats; it's flexible support.

  To the students from Eastside sitting in the front: You are not cargo. You are not a tide coming in to swamp us. You are students, just like us, who deserve a classroom. If we turn you away, we aren't protecting our boat; we're admitting that we think education is a finite resource that runs out when shared. But we know it doesn't.

  The portables aren't a limit; they're a decision. And I think we can decide to be bigger than this. Let's not close the door. Let's build a bigger boat.

  Thank you.

