      *   **Current Interest:** Philosophy of history, historical archives, subaltern studies.
      *   **Core Analogy:** Ecological absence (non-detection) $\approx$ Historical silence (archival gap).
      *   **User's Stance:** In ecology, you model detection probability to estimate *true* occupancy. In history, why don't historians model the "selection process" of the archive to estimate *true* past reality? Why do they study the silence itself instead of correcting for it?
      *   **The Question:** Why is the ambition to "correct for detection" regarded as a category mistake in history, rather than just a hard estimation problem?

  2.  **Deconstruct the Analogy (Ecology vs. History):**
