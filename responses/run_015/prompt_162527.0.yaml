          *   Epistemology: The archive *produces* the knowledge, it doesn't just record it.
          *   Goal: Understand how power structures created the silence, not necessarily to fill it with a number.
          *   Assumption: You cannot separate the "signal" from the "noise" because the archive *is* the mechanism of power.

  3.  **Identify the Key Philosophical/Historical Objections:**
      *   *The Nature of the "Truth":* In ecology, the tiger exists whether you see it or not. In history, does the "subaltern voice" exist in a form recoverable by correcting the archive? Or was their existence fundamentally altered by the archival process?
      *   *The Archive as Power:* Foucault, Derrida, Spivak. The archive isn't a random sample; it's a technology of governance. It doesn't just miss things; it actively creates categories.
      *   *Non-Stationarity:* Ecological models assume closure (population doesn't change during sampling). History is radically non-stationary. The rules of detection change over time.
      *   *Ethical/Political Dimension:* "Correcting" the silence might be an act of epistemic violence. Speaking *for* the subaltern might silence them again.
