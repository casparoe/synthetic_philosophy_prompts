answer: |-
  # Q&A Prep Sheet: Bounded Futarchy Proposal
  **Audience:** Charter Revision Commission (6 Members)
  **Goal:** Secure authorization for a pilot program.

  ## Pre-Emption Strategy (Opening 2 Minutes)
  *You must disarm the two fatal objections before they are voiced.*

  1.  **The Legal Guardrail (For the Chair):** Explicitly state that the prediction market provides *recommendatory data* to the Administration, but the Charter language will frame the "automatic adoption" as a pre-authorized administrative rule triggered by data, similar to automatic tax adjustments, not a delegation of legislative power. The Citizens' Assembly retains the legislative authority; the market is merely the calculator.
  2.  **The Equity Guardrail (For the Organizer):** Explicitly state that no single metric (like "median commute") will ever be used alone. The Assembly is mandated to set a *basket* of metrics (e.g., commute time + rent burden + disability access), and the market prices the *composite*. This prevents optimizing for the average at the expense of the vulnerable.

  ---

  ## Q&A Sequence

  ### 1. The Chair (Retired Appellate Judge)
  **Objection:** "Mr. Presenter, the non-delegation doctrine is clear. You cannot vest legislative discretion in a mechanism that binds the city without elected oversight. If a market price triggers an automatic policy change, have you not effectively privatized the legislative vote? How do you reconcile this with *State v. City* precedents on unlawful delegation?"

  **90-Second Reply:**
  "Chair, I appreciate the gravity of that concern. The distinction lies in *what* is being decided. The Citizens' Assembly—constituted residents—sets the law: they define the welfare metric, the horizon, and the options. That is the legislative act. The prediction market does not choose the goal; it only estimates the factual outcome of specific options against that goal.
  Think of it as an automated environmental impact statement. We are not delegating the *will* of the city; we are automating the *measurement* of consequences. The 'automatic adoption' is a pre-committed administrative rule, authorized by this Charter revision, contingent on data thresholds. The accountability remains with the Assembly that sets the metric and this Commission that authorizes the mechanism. We are not handing over the gavel; we are handing over the calculator."

  *   **Concede Outright:** You will agree to statutory language clarifying the market output is "administrative data" subject to existing administrative procedure acts.
  *   **Refuse to Concede:** That this constitutes a transfer of legislative *will*. The will is set by the Assembly.
  *   **Softest Point:** The "automatic" nature. If a judge rules that binding the city to a market price is inherently legislative, the whole mechanism collapses. *Preparation:* Have a fallback where the market result is a "super-majority recommendation" rather than automatic.

  ### 2. The Finance Director
  **Objection:** "Let's talk about the subsidy. You propose subsidizing losses to encourage resident participation. That is an open-ended liability. If a whale decides to manipulate the market and we are on the hook for 51% of their losses, this becomes a million-dollar line item overnight. How do you guarantee liquidity without guaranteeing insolvency?"

  **90-Second Reply:**
  "Director, the liability is capped by design. First, there is a flat cap on individual stake—no whale can enter the pool. Second, the subsidy is not a blanket guarantee; it is a matching fund up to a fixed pilot budget approved annually. If the pilot budget is $100,000, the maximum liability is $100,000.
  Regarding liquidity: thin markets are a risk, which is why we limit the scope to narrow administrative decisions where local knowledge is high. We aren't pricing GDP; we're pricing parking rates. The subsidy incentivizes residents who *know* the outcome to participate, which stabilizes prices better than external speculators. We treat the subsidy as a research cost, cheaper than the cost of a failed procurement or a vacant transit line."

  *   **Concede Outright:** A hard dollar cap on the total subsidy pool per fiscal year.
  *   **Refuse to Concede:** That liquidity requires external speculators. Local knowledge is more valuable for local issues.
  *   **Softest Point:** Manipulation. Even with caps, coordinated groups could drain the subsidy. *Preparation:* Have a "suspicious activity" clause ready that voids subsidies for correlated betting patterns.

  ### 3. The Community Organizer
  **Objection:** "You talk about metrics, but I've seen what metrics do. 'Median commute time' goes down, but the bus route serving the projects gets cut. Aggregate statistics have been used to erase my neighborhood for twenty years. Why should we trust a market to price a metric that was designed to ignore us?"

  **90-Second Reply:**
  "You are absolutely right that aggregate statistics have been weaponized. That is exactly why the elected Council does *not* set the metric. The Sortition Assembly does. This body is stratified by zip code, income, and race to mirror the affected district.
  If the neighborhood feels that 'median commute' is a trap, the Assembly has the sole power to reject it and demand a weighted metric that prioritizes the 90th percentile commute time or disability access. The market cannot price what it is not told to value. We are moving the power to define 'success' from the technocrats to a microcosm of the community. The market is blind; the Assembly gives it eyes."

  *   **Concede Outright:** That single aggregate metrics are dangerous and insufficient.
  *   **Refuse to Concede:** That experts or elected officials are better at defining local welfare than a representative sample of residents.
  *   **Softest Point:** Sortition participation. If the vulnerable don't show up for the Assembly, the metric still gets rigged. *Preparation:* Emphasize stipends, childcare, and translation services for the Assembly.

  ### 4. The Union Staffer
  **Objection:** "You listed sanitation procurement. If the metric is 'cost per ton,' the market will predict the bidder who cuts wages. Are you building a mechanism that automatically undercuts union contracts in the name of efficiency?"

  **90-Second Reply:**
  "That is a critical catch, and it's why the metric definition is upstream of the market. If the Citizens' Assembly defines the metric as 'lowest cost,' yes, the market will find the lowest cost. But the Assembly can mandate the metric be 'cost per ton *meeting prevailing wage and retention standards*.'
  The market is agnostic; it serves the metric. We can even include a 'labor stability' score in the welfare basket. The futarchy doesn't decide what we value; it prevents us from lying to ourselves about the consequences of what we value. If we value union labor, the market will tell us which bidder actually delivers that without bankruptcy."

  *   **Concede Outright:** That procurement metrics must explicitly include labor standards, not just cost.
  *   **Refuse to Concede:** That efficiency is inherently anti-labor. Efficient procurement can fund better wages.
  *   **Softest Point:** Traders might bet on "soft" compliance (companies that promise labor standards but violate them later). *Preparation:* Suggest lagging metrics (e.g., retention at 12 months) rather than just bid price.

  ### 5. The Political Scientist
  **Objection:** "I've studied sortition. Without rigorous facilitation, these assemblies are captured by the 'usual suspects'—the retired, the wealthy, the already-engaged. If your Assembly is captured, your metric is captured, and the market just rationalizes elite bias with a veneer of mathematical objectivity."

  **90-Second Reply:**
  "Professor, I share that concern. Standard sortition relies on random mailers, which yields low response from the marginalized. Our proposal mandates stratified random sampling with replacement. If a demographic doesn't respond, we oversample that group until the assembly matches the district's census data.
  Furthermore, we fund professional, neutral facilitation. But even if imperfect, a captured assembly of 50 residents is more representative than a City Council of 6 donors. The circuit breaker also protects here: if the realized outcomes consistently miss the market prices, we audit. If the metric was the problem, the audit reveals the capture. It is self-correcting in a way static legislation is not."

  *   **Concede Outright:** That recruitment requires active oversampling, not passive random selection.
  *   **Refuse to Concede:** That elections produce less captured bodies than sortition.
  *   **Softest Point:** Facilitation quality. Bad facilitation ruins deliberation. *Preparation:* Name a specific non-partisan organization you intend to contract for facilitation.

  ---

  ## The "Hope Nobody Asks" Question
  **The Question:** (Likely from the **Data Scientist** ally, trying to help, but exposing the flaw)
  *"You've built a circuit breaker for when the market is wrong. But what happens when the market is **right**, the metric is met, but the political cost is unbearable? For example, the market predicts raising transit fares will improve service reliability, and it does. But ridership collapses among the poor. The metric succeeded, the policy worked, but the public outrage forces a repeal. How do you handle the credibility crisis of a 'successful' failure?"*

  **Why it's dangerous:** It exposes the tension between *technocratic success* and *democratic legitimacy*. If the system works as designed but the people hate it, the Charter Commission looks out of touch.

  **Prepared Answer:**
  "That is the precise reason for the 'Bounded' in Bounded Futarchy. We restrict this to administrative adjustments, not existential policy shifts. Fare *structures*, not fare *existence*. If a policy succeeds by the metric but fails by public acceptance, the Circuit Trigger allows the Commission to review the *metric*, not just the market. It acknowledges that the Assembly may have measured the wrong thing. We treat the metric as a hypothesis, not a truth. If the hypothesis is proven 'true' but the outcome is socially unsustainable, we retire the metric, not the mechanism."
