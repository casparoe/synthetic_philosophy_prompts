answer: |-
  ### Desiderata for an Account of Genetic Information

  The following criteria are fixed to your stated purpose: determining whether a molecular biologist is *entitled* to semantic vocabulary (reading, error, specification) or whether that vocabulary is merely a shorthand for complex chemistry.

  | # | Criterion | Source Case | Requirement | Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Specificity (No Collapse)** | *No collapse* | The account must distinguish genetic causation from general causal correlation (e.g., smoke/fire). It must specify why the genome is a *vehicle* of content rather than merely a cause of effect. | **Non-Negotiable** |
  | **2** | **Immanence (No Homunculus)** | *No external interpreter* | The "reading" relation must be located within the biological system (e.g., ribosome/tRNA interaction) without presupposing an external agent or homunculus to assign meaning. | **Non-Negotiable** |
  | **3** | **Polysemy (Contextuality)** | *One message per token* | The account must allow the same physical sequence to carry different contents depending on cellular context (splicing, metabolic state, overlapping codes) without fracturing the definition of information. | **Non-Negotiable** |
  | **4** | **Normativity (Error)** | *Possibility of error* | The account must distinguish between a *correct* translation/expression and an *incorrect* one (mutation, mistranslation). Chemical outcomes cannot all be equally "valid." | **Non-Negotiable** |
  | **5** | **Relationality** | *Environment relativity* | The account must specify the background conditions (developmental context, environment, history) relative to which the information is defined. Information cannot be intrinsic to the DNA alone. | **Non-Negotiable** |
  | **6** | **Substrate Neutrality** | *Non-DNA heredity* | The account must either explain why DNA is the exclusive bearer of genetic information or provide conditions under which methylation, prions, etc., also carry content. | **Preference** (Camp) |
  | **7** | **Teleology** | *Selection and function* | The account must state whether content is fixed by evolutionary history (selected effect), current causal role, or structural capacity. It must address "junk" DNA and novel sequences. | **Preference** (Camp) |
  | **8** | **Explanatory Leverage (Payoff)** | *Payoff* | The account must license inferences or interventions (sequence → phenotype) that a purely chemical description would not support or would render intractably complex. | **Non-Negotiable** |

  ***

  ### The Filter: Which Requirement Excludes the Most?

  **The Possibility of Error (Normativity)** is the single requirement that excludes the most familiar options.

  *   **Excludes the Deflationary ("Just Chemistry") View:** In pure chemistry, there is no "wrong" reaction, only reactions that happen or don't. A mismatched tRNA binding is just a chemical event with a certain probability. To call it an *error* requires a norm—a standard of correctness that chemistry lacks. If a theory cannot ground normativity naturalistically, it cannot justify the biologist's talk of "misreading" or "mutation" as anything other than "variation."
  *   **Pressures the Instructionist ("Program") View:** A literal program implies a programmer. If the cell is running a program, who wrote it? If the answer is "Evolution," the view collapses into a Selected-Function account. If the answer is "The DNA itself," it risks circularity (the DNA programs the machinery that reads the DNA).
  *   **Pressures the Selected-Function View:** While this view handles error well (error = deviation from selected effect), it struggles with **Payoff**. If content is fixed by *past* selection, it has limited power to predict phenotype in *novel* environments or with *novel* sequences (see Criterion 7).

  **Verdict:** Without **Normativity**, the biologist is not entitled to semantic vocabulary; she is merely using a metaphor. With **Normativity**, she is entitled to the vocabulary, but she inherits the burden of explaining where the norms come from without a God or a Homunculus.

  ***

  ### The Impossibility Claim: Joint Unsatisfiability

  There is a subset of requirements that is jointly unsatisfiable under current naturalistic constraints. This explains why the debate never converges: participants are implicitly trading off one desideratum to save the others.

  **The Trilemma:**
  1.  **Immanence (No External Interpreter)**
  2.  **Normativity (Possibility of Error)**
  3.  **Polysemy (One Message Per Token / Contextuality)**

  **The Conflict:**
  *   To satisfy **Immanence** and **Normativity** simultaneously, you generally need a **Teleological** account (Criterion 7). You must ground the "correctness" of a reading in the *history of selection* (e.g., the ribosome is *supposed* to read this codon this way because ancestors who did so survived). This is the Teleosemantic solution (Millikan, Godfrey-Smith).
  *   However, **Teleology** clashes with **Polysemy**. If the content of a codon is fixed by its *evolutionary history*, it is difficult to explain how that *same token* can legitimately mean something different in a different metabolic context *now*. History fixes one function; biology often uses one sequence for many context-dependent functions (pleiotropy, alternative splicing, recoding).
  *   If you prioritize **Polysemy** and **Immanence** (e.g., a causal/computational role account), you lose **Normativity**. If meaning is just "what this sequence does in this context," then a "mistranslation" is just "what the sequence does in *this* context." There is no error, only context-switching.
  *   If you prioritize **Normativity** and **Polysemy**, you usually need an **External Interpreter** (a homunculus or a human scientist) to judge which context determines the "true" meaning and which counts as an error.

  **Conclusion on Unsatisfiability:**
  You cannot currently have a theory that is fully naturalistic (**Immanence**), fully normative (**Error**), and fully sensitive to biological reality (**Polysemy**) without relying on a notion of "function" that is either too rigid (history) or too loose (causal role).

  ***

  ### Implications for the Molecular Biologist

  Based on these desiderata, here is the verdict on her entitlement to her vocabulary:

  1.  **She is entitled to the vocabulary pragmatically (Payoff), but not ontologically (Immanence + Error).**
      The vocabulary works. It allows her to predict that changing a base will change a trait (**Payoff**), and it allows her to distinguish a disease state from a healthy one (**Normativity**). A purely chemical description is too computationally expensive to be useful.
  2.  **She is not entitled to the vocabulary literally.**
      If pressed on *why* a mismatch is an "error" rather than just a "different chemical outcome," she cannot answer without smuggling in a teleological assumption (that the organism *ought* to be healthy) or an external perspective (that the sequence *ought* to match the reference genome).
  3.  **The Stalemate is Structural.**
      The debate restarts every few years because the **Trilemma** is unresolved.
      *   The **Code/Program** camp sacrifices **Immanence** (implicitly relying on a designer or external standard) to save **Normativity**.
      *   The **Chemistry** camp sacrifices **Normativity** to save **Immanence**.
      *   The **Selection** camp sacrifices **Polysemy** (context-sensitivity) to save **Normativity** and **Immanence**.

  **Final Recommendation:**
  To fix the standard, demand that any theory of genetic information explicitly state which corner of the Trilemma it is sacrificing. If a theory claims to satisfy all three, it is hiding a homunculus. The biologist is entitled to her vocabulary *as a model*, provided she acknowledges that "error" and "reading" are relational properties dependent on a chosen normative frame (e.g., organismal fitness), not intrinsic chemical properties.
