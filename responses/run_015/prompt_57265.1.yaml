          *   *Historical Context:* 18th-century thinkers often believed in infinite progress or at least no hard saturation point for "happiness" derived from resources. However, he might accept *asymptotic* boundedness (satiety) as psychologically realistic.
          *   *Verdict:* He'd likely resist a *hard* bound as unnatural but might accept that for *decision making*, extremely large utilities effectively flatten out. He'd probably fight Menger by saying "Those games aren't physically possible" (bankroll limits).

  6.  **Address Sub-question 4: Alternating Sign / Undefined EV:**

      *   *Case:* Payoffs alternate $+x, -x, +x, -x$ such that the series is conditionally convergent or divergent (like $1 - 1 + 1 - 1...$).
      *   *Bernoulli's Tool:* Expected Utility Theory (EUT) relies on the expectation operator being well-defined.
      *   *Reaction:* If the series doesn't converge, EUT is silent.
      *   *Nuance:* Bernoulli was a mathematician. He knew about divergent series. He would likely say this falls outside the scope of "moral expectation" which requires a determinate sum. He might appeal to risk aversion or simply reject the coherence of the gamble itself.
      *   *Modern View:* This leads to issues like the Pasadena Game. Standard EUT fails here. Bernoulli wouldn't have a magic fix, but he wouldn't be surprised that math breaks down when series don't converge.

