  5.  **Address Sub-question 3: Menger's Objection & Bounded Utility:**

      *   *Menger (1934):* Showed that for any unbounded utility function (like $\ln(w)$), you can construct a "Super St. Petersburg" game where payoffs grow fast enough (e.g., $e^{2^n}$) to make expected utility diverge again.
      *   *Solution:* Bounded Utility (e.g., $U(w) = 1 - e^{-w}$ or a hard cap).
