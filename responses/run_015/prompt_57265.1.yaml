      *(Refining the Menger point)*: Menger's critique is devastating for *any* unbounded utility function. Bernoulli's specific fix (log) fails Menger's test. So Bernoulli would have to either accept bounded utility or deny the possibility of the "Super St. Petersburg" payoffs (physical impossibility). Given he was a physicist/mathematician, the physical impossibility argument is strong for him.

      *(Refining the Alternating Sign)*: This is the "Pasadena Game" (Nover & Hájek). Standard EUT has no answer. Bernoulli wouldn't either.

