          *   *Wait, needs to handle the "Early Universe" misconception.* The light bulb row doesn't capture gravity.
          *   *Re-evaluating:* The prompt says "Early universe hot/dense... is why past had low entropy." I need to correct this. The example needs to show that *density* isn't *entropy*.
          *   *Actually, keep it simple.* The prompt asks for *one* example to carry the session. If I try to model gravity, I lose the combinatorics. I should stick to a standard stat-mech example but use it rigorously to kill the "disorder" myth.
