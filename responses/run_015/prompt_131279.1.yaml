prompt: |-
  hey so i need you to act like a professional philosopher of epistemology who also watches too many films. think step by step, and start with some quick brainstorming before you lock in any thesis.

  read christopher nolan's inception through the lens of plato's meno problem — specifically why knowledge is more valuable than true belief if both guide action correctly. i don't want the standard knowledge-is-justified-true-belief recap; instead, inject the framing of epistemic anchoring across counterfactual perturbations — the idea that knowledge survives being tested across worlds (like dream layers) while true belief collapses once its causal origin is disturbed.

  apply this to fischer: he acquires a belief about his father's wishes that is true and guides his behavior, but it was planted. does the film dramatize that this is merely true belief — fragile because its justification is fake — rather than knowledge? and with cobb: he insists he knows he's awake, but the spinning top suggests his belief might be unstable. does inception vindicate the meno's answer that knowledge is tied down like daedalus's statues, or does it show that in a world of manufactured belief the distinction collapses?

  take both the film and the philosophical debate seriously. point to specifc scenes — the hotel corridor, the limbo sequence, the vault opening — where the idea illuminates character choices, and say honestly where the film resists the reading (maybe emotional catharsis matters more than epistemic value). end by saying what the movie adds to the meno debate that pure argument alone can't capture.

  stick to common-knowledge plot points since you can't look up the script, and don't ask for citations or a reading list — this is for a club that hasn't read plato since college. don't reduce nolan to an illustration, and don't twist plato to fit the plot.
