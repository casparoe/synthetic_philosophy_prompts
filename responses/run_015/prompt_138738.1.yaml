answer: |-
  This is a operationalisation of Imre Lakatos's *Methodology of Scientific Research Programmes* (MSRP) adapted for a five-year grant cycle, designed for non-philosophers, devoid of bibliometrics, and constrained by plain-language reporting requirements.

  It is titled **The Research Programme Audit (RPA)**. It is not a scoring matrix; it is a decision tree.

  ### Part 1: The Procedure (RPA Protocol)

  **Data Sources:** The Proposal (specifically the Work Packages), the Track Record (last 5–10 years), and the mandatory "Abandonment Statement" (what the group would cease doing if forced to choose).

  #### Phase 1: Reconstruction (Finding the Invisible Core)
  *Applicants rarely state their Hard Core explicitly because it sounds dogmatic. You must reconstruct it.*

  **Question 1.1: The Immunization Test**
  *   **Ask:** Look at the "Abandonment Statement." What is the one thing they say they *cannot* abandon without the programme ceasing to exist? Alternatively, look at the Track Record: when a prediction failed, what assumption was *never* blamed?
  *   **Sufficient Answer:** A specific theoretical commitment (e.g., "Protein X folds via pathway Y," "Market actors are rational," "Gravity is geometric").
  *   **Insufficient Answer:** A methodology ("We will always use CRISPR"), a goal ("We will cure cancer"), or a vague domain ("We study the brain").
  *   **Stop Condition:** If no Hard Core can be identified after reading the proposal and track record, **STOP**. The submission is a *Project* or a *Service*, not a *Programme*. Verdict: **Refer to Infrastructure/Project Stream.**

  **Question 1.2: The Positive Heuristic Check**
  *   **Ask:** Does the proposal outline a plan for *developing* the theory (building models, simplifying assumptions to test limits), or does it outline a plan for *applying* the theory to new data?
  *   **Sufficient Answer:** A sequence of models or theoretical refinements (e.g., "First we ignore friction, then we add it, then we add turbulence").
  *   **Insufficient Answer:** A list of datasets to be processed or populations to be screened.
  *   **Stop Condition:** If the plan is purely data accumulation without theoretical development, **STOP**. Verdict: **Data Resource (Not a Programme).**

  #### Phase 2: Retrospective Audit (Progressive vs. Degenerating)
  *This assesses the last 5–10 years of the Track Record.*

  **Question 2.1: The Novelty Count**
  *   **Ask:** In the last cycle, how many *novel facts* were predicted *before* observation and confirmed?
  *   **Sufficient Answer:** At least one confirmed novel prediction. (Note: A "novel fact" is not a new measurement of an old thing; it is a phenomenon the theory said should exist that was previously unknown).
  *   **Insufficient Answer:** Post-hoc explanations of known anomalies, or re-derivation of existing measurements with better precision.
  *   **Verdict Signal:**
      *   **Progressive:** ≥1 confirmed novel prediction.
      *   **Stalled:** 0 novel predictions, but no major anomalies unexplained.
      *   **Degenerating:** 0 novel predictions + multiple ad-hoc adjustments to explain failures.

  **Question 2.2: The Belt Thickness Test**
  *   **Ask:** Look at the failed predictions. Were they explained by adding a new auxiliary hypothesis (a "correction term," a "parameter fit") that was not independently testable?
  *   **Sufficient Answer:** "Yes, we added a correction term to fit the data."
  *   **Stop Condition:** If the last three failures were all handled by adding untestable correction terms, **FLAG AS DEGENERATING.**

  #### Phase 3: Prospective Assessment (The Five-Year Plan)
  *This assesses the Proposal.*

  **Question 3.1: The Risk of Ad-Hocery**
  *   **Ask:** Does the proposed work plan allow for the possibility that the Hard Core is wrong? Or does every Work Package assume the Core is true and only tweak the Belt?
  *   **Sufficient Answer:** At least one Work Package is designed to stress-test the Core (even if they don't expect it to break).
  *   **Insufficient Answer:** All Work Packages are designed to "refine," "optimize," or "correct" existing models.
  *   **Verdict Signal:** If the plan is purely protective, it is a **High Risk of Degeneration.**

  **Question 3.2: The Instrument/Math Exception (Case C Handling)**
  *   **Ask:** If there are no novel predictions in the Track Record, is the delay due to *theoretical stagnation* or *technological impossibility*?
  *   **Sufficient Answer:** "The mathematics to solve the core equation did not exist; we are building the solver." (Must show the sequence of simplified models leading to the solver).
  *   **Insufficient Answer:** "We need more funding to buy better equipment to see what we already expect."
  *   **Verdict Signal:** If the delay is technological/mathematical and the sequence is logical, **Override Phase 2 Degeneration Flag.** Mark as **Potentially Progressive.**

  #### Phase 4: The Verdict & Handoff
  *Combine the signals.*

  *   **Clear Fund:** Progressive Track Record + Positive Heuristic in Proposal.
  *   **Clear Reject:** Degenerating Track Record + Protective Belt Proposal.
  *   **Hand to Panel (Values/Strategy):**
      *   **Case A (The Legacy):** Degenerating science, but high training value or field stability. *The Procedure cannot weigh prestige.*
      *   **Case B (The Pipeline):** Not a programme (Instrumental). *The Procedure cannot weigh utility vs. science.*
      *   **Case C (The Long Game):** Stalled Track Record, but logical Positive Heuristic. *The Procedure cannot weigh patience vs. accountability.*

  ---

  ### Part 2: Declared Limits (For the Panel Chair)
  *Read this aloud at the start of the session.*

  1.  **Incommensurability:** This procedure cannot compare Programme A (Physics) against Programme B (Epidemiology). It assesses internal coherence, not cross-field impact.
  2.  **Truth:** This procedure does not determine if the Hard Core is *true*, only if the programme is *working*. A false core can be progressive for a time; a true core can be degenerating.
  3.  **Time:** Lakatos requires decades for final judgment. This procedure compresses that into five years. It identifies *trajectories*, not final outcomes. A "Degenerating" verdict means "Currently patching," not "Forever wrong."
  4.  **Values:** This procedure cannot weigh the value of training students, maintaining national capability, or honoring a retiring founder. Those are Council policy decisions, not scientific assessments.

  ---

  ### Part 3: Running the Cases

  Here is the RPA applied to your three anonymised cases from the last cycle.

  #### Programme A (The Aging Giant)
  *   **Phase 1 (Reconstruction):** Hard Core identified (The Founder's Theory). Positive Heuristic present but slowing.
  *   **Phase 2 (Audit):** **Degenerating.** Last three predictions failed. Adjustments made via "revised correction terms" (Belt thickening). No novel facts confirmed in 5 years.
  *   **Phase 3 (Plan):** Proposes re-deriving old measurements. This is accommodation, not prediction.
  *   **RPA Verdict:** **Clear Reject (Scientific Grounds).** The programme is absorbing damage without predicting new facts.
  *   **Plain Language Draft:** "While the group's past contributions are significant, the recent work has focused on adjusting existing models to fit known data rather than predicting new phenomena. The proposed plan continues this pattern of refinement rather than theoretical expansion."

  #### Programme B (The Automated Pipeline)
  *   **Phase 1 (Reconstruction):** **Fail.** No Hard Core found. The "theory" is the algorithm, but misses are treated as "specification issues" (retraining), not theoretical anomalies.
  *   **Phase 2 (Audit):** N/A. Constant forecasts are not novel predictions in the Lakatosian sense; they are outputs.
  *   **Phase 3 (Plan):** Optimization of pipeline.
  *   **RPA Verdict:** **Not a Research Programme.** This is an Infrastructure or Service proposal.
  *   **Plain Language Draft:** "This proposal outlines a robust data processing service. However, it does not constitute a research programme as it lacks a theoretical core being tested against novel facts. It is better suited for an infrastructure funding stream."

  #### Programme C (The Long Game)
  *   **Phase 1 (Reconstruction):** Hard Core identified (The Blocking Computation). Positive Heuristic is strong (Ordered sequence of simplified models).
  *   **Phase 2 (Audit):** **Stalled.** No confirmed novel facts in 9 years.
  *   **Phase 3 (Plan):** **Exception Applied.** The delay is explicitly mathematical/technological, not theoretical patching. The sequence of models shows a path to the prediction.
  *   **RPA Verdict:** **Hand to Panel (Patience vs. Risk).** Scientifically potentially progressive, but high risk of continued stalling.
  *   **Plain Language Draft:** "The group has not yet produced confirmed novel predictions, but this is due to computational barriers rather than theoretical weakness. The plan to overcome these barriers is logical. Funding is recommended on the condition that the simplified models are delivered on schedule."

  ---

  ### Part 4: The Secretary's Advice on Overruling

  You asked me to tell you if the procedure's verdicts are ones you should overrule. Here is my assessment based on the constraints of a National Research Council.

  **1. Programme A (The Aging Giant)**
  *   **RPA Verdict:** Reject.
  *   **Your Expectation:** The panel reveres the founder and wants to Fund.
  *   **Advice:** **Do Not Overrule.**
  *   **Why:** You explicitly noted a past row about "metric-gaming" and a current reliance on "vibes." Funding a degenerating programme because of the founder's prestige is the definition of a "vibe" decision. It signals to the community that reputation protects you from the requirement to predict novel facts.
  *   **Action:** Use the RPA verdict to shield the panel from the social pressure. Offer a "Legacy Grant" (one year, no renewal) to wind down the lab and train students, but do not renew the Programme. This honors the person without funding the degeneration.

  **2. Programme B (The Pipeline)**
  *   **RPA Verdict:** Not a Programme (Refer to Infrastructure).
  *   **Your Expectation:** You are unsure if it's appraisable.
  *   **Advice:** **Uphold the Verdict, but Check Mandate.**
  *   **Why:** If your Council's mandate is "Scientific Discovery," this is a Reject. If your mandate includes "National Capability," this is a Fund, but *not* as a Programme Grant. Calling it a Programme Grant distorts the language of science. It creates a category error where "accuracy" replaces "truth."
  *   **Action:** Reject as a Programme. If the pipeline is vital, the Panel Chair should advocate for it to be moved to an Infrastructure budget. Do not let it occupy a Programme slot meant for hypothesis-driven work.

  **3. Programme C (The Long Game)**
  *   **RPA Verdict:** Hand to Panel (High Risk).
  *   **Your Expectation:** You think hindsight might vindicate them.
  *   **Advice:** **Overrule the "Risk" toward "Fund."**
  *   **Why:** The RPA correctly identifies this as "Stalled," but Lakatos himself warned against "instant rationality." A programme building the *tools* to make a prediction (mathematics/instruments) is often progressive *in the making*, even if the fact isn't caught yet. The "Ordered sequence of simplified models" is the key evidence of a Positive Heuristic.
  *   **Action:** Fund, but use the "Plain Language" requirement to set a trap. The decision letter must state: *"Funding is continued on the explicit understanding that the simplified models in Work Package 2 will be completed by Month 18. Failure to deliver these intermediate theoretical steps will trigger a mid-term review."* This buys them the time Lakatos says they need, without giving them a blank check to hide behind "technicalities."

  ### Summary for the Panel Chair
  *   **Case A:** Cut the programme, honor the person. (Scientific Integrity)
  *   **Case B:** Move to Infrastructure. (Category Error)
  *   **Case C:** Fund with strict theoretical milestones. (Strategic Patience)

  This approach allows you to use Lakatos not as a hammer to crush applicants, but as a lens to distinguish between *doing science* (A & C) and *doing engineering* (B), and between *growing knowledge* (C) and *protecting reputation* (A).
