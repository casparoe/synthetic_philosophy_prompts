      *   *Case A:* Procedure says "Cut." Should they overrule? Probably not on scientific grounds, but maybe on sociological grounds (training). However, the prompt implies the user *doesn't want the answer they expect* (which is likely "Cut"). Actually, the user says "I do not want the answer I expect." If they expect "Cut" because it's degenerating, maybe the procedure should suggest "Conditional Renewal"? No, Lakatos is strict. If it's degenerating, it's degenerating. I should advise *against* overruling the scientific verdict, but acknowledge the human cost.
