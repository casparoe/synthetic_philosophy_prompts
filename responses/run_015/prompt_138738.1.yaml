      *   *Negative Heuristic:* What not to test/attack.
      *   *Positive Heuristic:* The plan for developing the theory/models.
      *   *Progressive:* Predicts novel facts, some verified.
      *   *Degenerating:* Post-hoc accommodations, ad-hoc adjustments, no new facts.
      *   *Problem:* Lakatos talks about decades. Grants are 5 years. Need to compress the timescale without losing the logic.
