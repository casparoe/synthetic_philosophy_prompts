  ### Audit of Commitments

  Your package is ambitious and aligns with a recognizable "neo-Aristotelian" or "functionalist" restricted composition view. However, as it stands, the set does not survive intact. There are logical contradictions and metaphysical strains that will be targeted immediately in a workshop setting. Below is the audit ordered by severity.

  #### 1. The Methodological Contradiction (C3 vs. C4)
  **Severity:** Critical (Logical Incoherence)
  **The Tension:** Commitment 3 defines artifacts via a function "some actual community of users **confers**." Commitment 4 bans conditions whose application "turns on what some particular person happens to **intend**, want, or be attending to," labeling them a "change of subject."
  **Analysis:** "Conferring a function" is an intentional act. If the community's conferral reduces to the aggregate intentions of its members, C4 explicitly bans the mechanism C3 relies on. If you claim community conferral is *not* intentional (i.e., Social Realism), you have an unstated commitment that needs defense. As written, C4 renders C3's artifact clause illegitimate by your own methodological standards.
  **Fix:** You must either (a) revise C4 to allow "objective social facts" as non-gerrymandered conditions, or (b) revise C3 to remove the "conferral" clause in favor of objective causal roles.
  **Cost:** (a) Weakens your claim to a purely non-psychological ontology. (b) Risks losing many artifacts (e.g., art, ceremonial objects) that lack objective causal roles, threatening C2.

  #### 2. The Grounding Problem (C6)
  **Severity:** Critical (Logical Incoherence)
  **The Tension:** You deny coincidence (Statue = Clay) but affirm distinct modal properties (Clay survives squashing; Statue does not).
  **Analysis:** By Leibniz's Law, if $x = y$, $x$ and $y$ share all properties. If the Statue and Clay are one thing, they cannot have different survival conditions. You cannot have monism *and* modal difference without additional machinery.
  **Fix:** You must add a theory of **sortal-relative identity** (they are the same *matter* but different *objects*) or **counterpart theory** (modal properties are relative to descriptions). Alternatively, accept coincidence (drop C6).
  **Cost:** Sortal-relative identity is metaphysically costly and controversial. Accepting coincidence violates C6 and complicates C5 (counting objects).

  #### 3. The Vagueness Strain (C5 vs. C3)
  **Severity:** High (Metaphysical Instability)
  **The Tension:** C5 demands sharp boundaries for existence. C3 relies on "life" and "function."
  **Analysis:** Both "life" (biological) and "function" (artifact) are inherently vague predicates. There is no sharp moment when a collection of cells becomes a living organism, nor when a pile of wood becomes a table. If composition is sharp (C5), there must be a precise boundary where these vague predicates flip from false to true. This resurrects the **Problem of the Many** (which you cite in C1 as a reason to reject Universalism) *within* your own restricted view.
  **Fix:** Adopt **Epistemicism** (boundaries are sharp but unknowable) or drop C5 (allow vague existence/composition).
  **Cost:** Epistemicism is widely regarded as counterintuitive. Dropping C5 requires revising classical logic for existence claims.

  #### 4. The Scattered Object Mismatch (C7 vs. C3)
  **Severity:** Medium (Extensional Inadequacy)
  **The Tension:** C7 accepts scattered objects (shoes in different cities). C3 requires parts be "integrated into a single function."
  **Analysis:** Two shoes in different cities are not functionally *integrated* at that time; they are merely parts of a kind. A star and its planets (C7) do not have a function conferred by a community (C3). Your criterion (C3) is too narrow for your intuitions (C7).
  **Fix:** Broaden C3 to include "historical connection" or "potential functional unity" rather than current integration.
  **Cost:** Risks sliding toward Universalism (C1) if "historical connection" is too loose (e.g., does my nose share a history with the Eiffel Tower?).

  ---

  ### Unstated Commitments Required
  To make this position defensible, you are implicitly relying on three theories not listed in your seven points:
  1.  **Social Ontology:** To resolve C3 vs. C4, you need a theory where "community conferral" is an objective fact, not just aggregate psychology.
  2.  **Sortal Essentialism:** To resolve C6, you need a view where modal properties are tied to sortals (Statue vs. Clay) rather than the matter itself.
  3.  **Persistence Conditions:** To handle C7 (scattered objects) and C6 (statue/clay), you need a view on whether objects endure or perdure. (Perdurance makes coincidence easier; Endurance makes scattered objects harder).

  ---

  ### Case Audits

  **1. The Disassembled Watch**
  *   **Verdict:** **Mishandled.**
  *   **Why:** Your C3 criterion requires parts to be "integrated into a single function." Parts in a drawer are not integrated. They are not constituting a life (C3a). Therefore, your view implies the watch *ceases to exist* when disassembled.
  *   **Conflict:** This likely contradicts your ordinary judgments (C2). To fix this, you must appeal to *potential* function or historical continuity, which tensions with C4 (non-gerrymandered) and C7 (scattered objects).

  **2. The Vague Table Boundary**
  *   **Verdict:** **Fatal Strain.**
  *   **Why:** You explicitly flag this worry. C5 says the boundary is sharp. C3 says existence depends on "function." Since "function" application is vague (how many missing atoms before it's not a table?), C3 and C5 are incompatible.
  *   **Conflict:** This is the specific point where the **Problem of the Many** (C1) re-enters your view. If there are many near-candidates for "table" (due to vague boundaries), and existence is sharp (C5), one must be privileged. But C5 forbids privileging one candidate.

  ---

  ### The Single Revision That Cleans Up the Most

  **Revise C5: Abandon Sharpness.**
  (Allow that composition and existence can be vague, or that the *statement* of existence is vague while the world is sharp [Epistemicism], but given your worries, Ontic Vagueness is the stronger fit.)

  **Why this is the lever:**
  1.  **Solves the Table Worry:** It directly addresses your specific anxiety about table boundaries.
  2.  **Neutralizes the Problem of the Many:** You cite the Problem of the Many in C1 as a reason to reject Universalism. If you allow vague composition, the Problem of the Many dissolves (there is no fact of the matter about which candidate is the table, so no absurd multiplication of objects). This stabilizes C1.
  3.  **Relieves Pressure on C3:** You no longer need your "Life/Function" criterion to be mathematically precise. It can be as vague as the concepts themselves, which matches reality better.
  4.  **Eases C6:** Vague identity or vague existence makes the Statue/Clay modal difference less logically explosive (if the boundaries of the object are vague, the modal properties may be too).

  **The Cost:**
  You sacrifice classical bivalence for existence claims ("There is a table" may be neither true nor false in borderline cases). This is a significant metaphysical cost, but it is lower than the cost of maintaining a contradictory set of commitments (C3/C4) or an indefensible sharpness claim (C5) that invites the very problem (Problem of the Many) you used to motivate your view.

  **Secondary Recommendation:** You must clarify C4 to explicitly allow **Social Facts**. If you keep C4 as written ("turns on what persons intend"), you cannot have artifacts. Frame it as: "Conditions turning on *arbitrary individual* psychology are banned; conditions turning on *stable social kinds* are permitted." This saves C3 without abandoning your methodological rigor.
