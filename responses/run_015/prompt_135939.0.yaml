answer: |-
  Dear Colleague,

  It is a pleasure to think this through with you, and I want to start by acknowledging the weight of what you are doing. When you sign off on a paramedic, you are not just making a philosophical claim; you are staking a life on a categorization of human competence. The tension you feel between your gut verdicts and a unified theory is not a sign of confusion but of sensitivity to the nuances that abstract theories often flatten. You asked me to sketch candidate principles, test them against your cases, discard the failures, and settle on the one that survives, so let us walk through that process together before arriving at the repaired principle you requested.

  The first candidate principle we might test is a pure performance view, which says an agent knows how to do something if and only if they can reliably succeed at it. This handles your easy cases well. It correctly denies knowledge to Dan, who cannot perform, and to Maya, whose success is not reliable in the real context. It also correctly denies knowledge to Garrity, whose success is not his own. However, this principle breaks immediately on Dr. Ruiz. She cannot perform due to dystonia, yet you rightly say she knows how. A pure performance view forces you to say she does not know, which contradicts your confident verdict and ignores the fact that her understanding guides others successfully. It also struggles with the amnesiac learner, whose success is reliable but whose cognitive access is severed. So we must discard the idea that current physical execution is necessary for knowing how.

  The second candidate is an intellectualist view, roughly your friend's position, which says knowing how is just knowing facts about ways to do things. This handles Dr. Ruiz well, as she possesses the factual knowledge even without the motor capacity. It also handles the checklist case, where the trainee lacks the internalized facts. But this view collapses against the amnesiac learner. If knowing how requires knowing facts, the amnesiac who cannot recall or state anything should not know how, yet you say she does. It also fails on the tech with the wrong reason; she knows how to position the head despite having false beliefs about why. Since your verdicts respect successful action even when factual access is missing or wrong, we must discard the requirement for propositional knowledge.

  This leaves us with your tentative principle, which combines reliability with a notion of grasp or attribution. You suggested that success must be reliable across the sign-off context and attributable to the agent's own grasp of what makes for success, where grasp shows up in doing, correcting, or teaching. This is the strongest starting point, but as you noted, it frays at the edges. Specifically, it does not yet explain why Maya fails while Ruiz passes, since both lack reliable performance in the specific context of sign-off. It also struggles to distinguish the checklist trainee from the wall-chart expert, as both rely on external aids. To repair this, we need to refine the attribution clause and add a condition about the nature of the agent.

  The principle that survives this testing is as follows. An agent knows how to do something when they possess a stable disposition to succeed at it across the relevant range of situations, where this disposition is grounded in a sensitivity to the features that make for success, such that the success is attributable to the agent's own competence rather than external guidance or luck, and where the agent is the kind of entity capable of participating in the normative practice surrounding the task. Let me walk you through how the clauses of this repaired principle do the work in your specific cases.

  The reliability clause does the heavy lifting in Case One and Case Two. Maya fails because her disposition is not stable across the relevant situations, which include real patients, not just simulators. Dan fails because he lacks the disposition entirely. This clause also handles Case Seven, Garrity, because his success is not reliable when the hidden nudging is removed. The attribution clause, specifically the requirement that success stems from the agent's sensitivity to task-relevant features, handles Case Eight. The tech positions the head correctly because she is sensitive to the physical setup, even if her verbal justification is wrong. Her success is attributable to her sensitivity to the patient's anatomy, not her false theory about backs.

  The tension between Case One and Case Three is resolved by distinguishing between competence and performance conditions. The principle requires a stable disposition grounded in sensitivity. Dr. Ruiz retains the sensitivity and the competence; her failure to perform is due to a physical blockade, not a lack of grasp. Maya's failure is due to a psychological instability that breaks the disposition itself. In Ruiz's case, the attribution clause is satisfied by her ability to correct and teach, which demonstrates the sensitivity even without execution. In Maya's case, the freezing indicates the sensitivity is not yet robust enough to govern action under stress. So the principle grants knowledge to Ruiz because the grasp remains, and denies it to Maya because the grasp is not yet fully integrated into her agency under pressure.

  The tension between Case Five and Case Six is resolved by looking closely at the attribution of control. In Case Five, the trainee stalls when the colleague stops reading. This means the sequencing and cognitive load are being carried by the colleague, not the trainee. The success is not attributable to the trainee's own competence. In Case Six, Nurse Okafor runs resuscitations beautifully. The wall chart is a static reference, not a dynamic guide. She consults it, but she executes the steps. The success is attributable to her fifteen years of integrated skill, with the chart serving as a safety net rather than the source of the procedure. The principle distinguishes between a crutch that holds up the agent versus a tool that the agent wields.

  Case Four and Case Nine are the hardest pair. Your gut says the amnesiac knows how but the AI does not. The repaired principle handles this with the final clause about normative agency. The amnesiac is a human participant in the practice of medicine. Even if she cannot articulate reasons, she is the kind of entity for whom reasons could potentially become accessible, and she is integrating feedback as a learner within a community of practice. The AI, as you describe it, matches patterns without holding anything true or participating in the normative space. It does not care if the patient lives or dies; it optimizes a function. If we say the AI knows how, we lose the distinction between a tool and a colleague. So the principle denies knowledge to the AI because it lacks the agency required for attribution, while granting it to the amnesiac because her learning is an expression of human agency, even if declarative memory is severed.

  Now let us apply this settled principle to your two new cases. First, the trainee who performs perfectly after one demonstration. Did she know how before she had ever done it? The principle says knowledge is a stable disposition. A single success is evidence of a disposition, but not proof of stability. However, if the success is attributable to her grasp of the demonstration rather than luck, then she acquired the knowledge during the demonstration, before the attempt. So the verdict is that she knows how at the moment of action, but you cannot verify the stability clause yet. You would not sign her off, not because she lacks knowledge, but because you lack evidence of the reliability required for the stakes. Second, the expert who cannot tell you how she knows and has false criteria. This is identical to Case Eight. The principle grants her knowledge because her success is reliable and attributable to her sensitivity to the task features, even if her verbal account is wrong. The grasp shows up in the doing, not the saying.

  I must flag three empirical assumptions where my philosophical verdict depends on facts I am taking from your description. First, regarding the amnesiac, I am assuming the hypoxic injury spared her procedural memory systems while wiping declarative memory. If the injury affected the motor learning pathways themselves, she would not improve across sessions, and the case would not arise. Second, regarding Dr. Ruiz, I am assuming the focal dystonia is purely motor and does not affect her perceptual or cognitive processing of the procedure. If the dystonia were accompanied by a degradation in her ability to perceive the errors she corrects, the verdict might change. Third, and most critically, regarding the AI system, my verdict depends on the system being a pure statistical matcher without any internal model that could be construed as a grasp of reasons. If future explainability research shows the AI does encode rules analogous to human understanding, the agency clause might need revision. I am treating the AI as a tool rather than an agent, which is a metaphysical choice as much as an empirical one.

  I am highly confident, perhaps ninety percent, that this repaired principle captures your core intuitions and resolves the tensions between cases one, three, five, and six. It respects the distinction between having a skill and being able to exercise it, and between using a tool and being guided by another person. The point where I am least sure, and where my confidence drops to about sixty percent, is the exclusion of the AI in Case Nine. This is because our understanding of machine learning is evolving, and if the AI's performance exceeds human reliability in all sign-off contexts, insisting it does not know how may become a form of human exceptionalism that undermines the practical utility of the concept. If the AI can teach a trainee to correct errors, it begins to look like it has the grasp your principle requires. For now, I side with your gut that it lacks agency, but this is the weakest link in the chain.

  If you were to drop any verdict to save the principle, Case Nine is the one to sacrifice, but the cost is high. It means admitting that reliability plus grasp might be enough for knowledge even without human agency, which changes how we view the tools we use. However, given your context of union reviews and medical director oversight, maintaining the distinction between a colleague who knows and a device that calculates is likely worth the philosophical friction. You are certifying people, not algorithms. The principle I have offered allows you to defend your sign-offs by pointing to the agent's integrated sensitivity to the task, which is what matters when things go wrong and you need to explain why someone was passed or failed.

  I hope this helps you sleep better than the argument with your friend did. The coherence is there, and it supports the weight of the work you are doing.

  Warmly,

