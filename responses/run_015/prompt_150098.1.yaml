prompt: |-
  I'm putting together the wall-text and audio script for a small rotating museum exibit on 19th-century port labor disputes, and I've been going back and forth with a friend who's in a grad historiography course. She keeps saying our captions are either pretending to be pure Ranke-style "show it as it actually happened" or they're sneaking in Hayden White-style emplotment without admitting it, and Carr's point about selection being driven by present concerns just makes it worse. I need something I can actually use, not more seminar talk. Can you write me a reusable decision procedure—like a checklist or flowchart in words—that a non-academic staffer can run on each panel or caption in about five minutes? It should be grounded in Ranke's idea of describing events as they actually occurred versus Carr's argument that historians necessarily select and arrange facts according to present questions versus White's claim that every narrative forces events into an underlying plot form like romance, tragedy, comedy, or satire. But I want it operationalized: the exact sequence of questions to ask, what counts as a passing answer at each gate, where the procedure says "rewrite this," where it says "flag for the curator because this is values not facts," and where it just stops because Ranke and White genuinely conflict and there's no procedural fix.

  The procedure needs to handle hard cases my team will actually face: a panel that quotes a striker's letter but frames the strike as a tragic defeat even though the letter itself never mentions defeat; a caption that leaves out that the police chief was also a factory shareholder because "it complicates the story"; and a timeline entry that calls a negotiation "inevitably collapsing," which is interpretation dressed up as chronology. Then apply it to three worked examples: one where the procedure forces us to drop a dramatic framing we'll miss, one where it lets through a selection that looks like bias but is defensible under Carr's framework, and one where it hits the "get the curator" wall. Also tell me explicitly what the procedure can't catch—maybe stuff about visual layout, visitor prior knowledge, or audio tone? And please write the answer in American English; it's definatley not an academic paper, I'm just trying to stop my coworker from rolling her eyes at me every time we hang a new panel.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Goal:** Create a reusable decision procedure (checklist/flowchart in words) for museum staff to evaluate wall-text and audio scripts for a 19th-century port labor disputes exhibit.
      *   **Time Limit:** ~5 minutes per panel/caption.
      *   **Audience:** Non-academic museum staff (practical, actionable, not seminar talk).
      *   **Theoretical Grounding:** Must incorporate/operationalize concepts from Leopold von Ranke ("show it as it actually happened"/empiricism), E.H. Carr (selection/arrangement driven by present questions), and Hayden White (emplotment/narrative structures like tragedy/comedy).
      *   **Specific Hard Cases to Handle:**
          *   Framing a strike as "tragic defeat" when primary sources don't support that emotion.
          *   Omitting conflicting interest (police chief/shareholder) for simplicity.
          *   Teleological language ("inevitably collapsing") in timelines.
      *   **Outputs Required:**
          *   The Procedure (step-by-step questions, pass/fail criteria, rewrite/flag/stop signals).
          *   Three Worked Examples (Drop dramatic framing, Defendable selection, Curator flag).
          *   Limitations (What the procedure *can't* catch).
          *   Tone: American English, practical, non-academic (stop the eye-rolling).

  2.  **Deconstruct the Theoretical Tension:**
      *   *Ranke:* Stick to the evidence. Don't invent. Let the documents speak.
      *   *Carr:* You *have* to select. Selection implies a point of view. Acknowledge *why* you are telling this story now.
      *   *White:* You *have* to narrate. Narratives have shapes (tragedy, etc.). Don't pretend the shape is inherent in the facts; admit it's a storytelling choice.
      *   *The Conflict:* Ranke says "Just the facts." Carr/White say "Facts don't speak for themselves." The procedure needs to navigate between "Don't lie" (Ranke) and "Don't pretend you aren't interpreting" (Carr/White).

  3.  **Drafting the Procedure (The "5-Minute Gatekeeper"):**
      *   *Name:* Needs to sound practical. "The Exhibit Integrity Check."
      *   *Structure:* Linear steps. Yes/No decisions.
      *   *Step 1: The Ranke Check (Factuality).* Is it supported by evidence?
      *   *Step 2: The Carr Check (Selection).* Why did we pick this? Is the omission misleading?
      *   *Step 3: The White Check (Emplotment).* Are we forcing a plot? Is it labeled as interpretation?
      *   *Outcomes:* Pass, Rewrite, Flag for Curator.

      *Refining the Steps:*
      *   *Step 1 (Evidence):* Does every claim have a source? If no -> Rewrite.
      *   *Step 2 (Omission/Carr):* Did we leave something out? If yes, does it change the moral outcome? If it changes the *moral* judgment (e.g., who was the bad guy), it needs disclosure. If it's just complexity, it might pass.
      *   *Step 3 (Narrative/White):* Are we using words like "inevitable," "tragic," "heroic"? If yes, is it clear this is *our* reading, not the event's nature?
      *   *The "Stop" Condition:* When the evidence contradicts the narrative *and* the narrative is essential to the exhibit's thesis. That's a curatorial decision, not a staff fix.

  4.  **Developing the Worked Examples:**
      *   *Example 1 (Drop Dramatic Framing):* The "Tragic Defeat" strike.
          *   *Issue:* White's emplotment (Tragedy) imposed on sources that don't feel tragic.
          *   *Action:* Rewrite. Remove "tragic."
      *   *Example 2 (Defendable Selection/Carr):* The Police Chief Shareholder.
          *   *Issue:* Omission.
          *   *Analysis:* If the panel is about *wages*, maybe it passes. If it's about *violence*, it fails. Let's make it pass under Carr (selection for focus) but with a caveat. Actually, the prompt asks for one where it "lets through a selection that looks like bias but is defensible." So, omitting the shareholder detail in a panel specifically about *daily cargo routines* is defensible selection (Carr), even if it looks like hiding bias.
      *   *Example 3 (Curator Flag):* The "Inevitable Collapse."
          *   *Issue:* Teleology disguised as fact.
          *   *Action:* Flag. This changes the historical thesis.

  5.  **Identifying Limitations:**
      *   Visuals (photos of sad workers vs. happy workers).
      *   Audio tone (somber music vs. upbeat).
      *   Visitor baggage (what they already think about unions).
      *   Spatial arrangement (putting the "riot" panel at the entrance).

  6.  **Refining Tone and Language:**
      *   Avoid jargon where possible (explain "emplotment" as "story shape").
      *   Keep it punchy.
      *   American English (labor, center, etc.).
      *   Acknowledge the friend's point without adopting the seminar voice.

  7.  **Review against Constraints:**
      *   *5 minutes?* Yes, the checklist is short.
      *   *Ranke/Carr/White included?* Yes, mapped to specific steps.
      *   *Hard cases covered?* Yes.
      *   *Explicit limitations?* Yes.
      *   *No academic paper style?* Yes, bullet points and bold text.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is the Carr section too vague?
      *   *Fix:* Make it about "Purpose." Why are we telling this *now*? If the omission hides the *reason* we are telling the story, it fails.
      *   *Critique:* Is the White section too abstract?
      *   *Fix:* Focus on specific adjectives (inevitable, tragic, heroic).
      *   *Critique:* The "Stop" condition needs to be clear.
      *   *Fix:* Define it as a conflict between the Evidence (Ranke) and the Thesis (White/Carr).

  9.  **Final Polish:** Check the "American English" constraint (ensure spelling and idioms match). Ensure the distinction between "Rewrite" (staff can do) and "Flag" (needs boss) is clear. (Self-correction: Make sure I explicitly mention the friend/seminar context in the intro to acknowledge the user's situation).

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a practical decision procedure designed for your team. It translates the historiography into operational questions without requiring your staff to read the original texts. It is designed to take about five minutes per panel.

  ### The "Exhibit Integrity" Check (5-Minute Procedure)

  **Instructions:** Run every wall-text panel and audio script through these three gates in order. If a panel fails a gate, follow the instruction immediately. Do not move to the next gate until the current one is resolved.

  #### Gate 1: The Evidence Check (The Ranke Standard)
  *Goal: Ensure we aren't inventing facts or feelings.*

  1.  **Highlight every adjective or verb that describes a mood, motivation, or outcome** (e.g., "angry mob," "desperate plea," "failed strike," "brutal crackdown").
  2.  **Ask:** Is there a specific primary source in our file (letter, logbook, newspaper, police report) that explicitly supports this specific word?
      *   **YES:** Keep it. Cite the source in the caption if possible.
      *   **NO:** **STOP AND REWRITE.** Replace the interpretive word with a neutral description of the action.
          *   *Bad:* "The desperate workers struck."
          *   *Good:* "The workers struck, citing wage cuts in their petition."
      *   *Why:* Ranke reminds us that if the document doesn't say they were desperate, we cannot say they were desperate, even if it makes sense to us.

  #### Gate 2: The Selection Check (The Carr Standard)
  *Goal: Acknowledge that leaving things out is a choice, not an accident.*

  1.  **Identify the biggest piece of information you left out** of this panel that you know exists in the research files (e.g., the police chief's stock ownership, the strikebreakers' wages, the union's internal corruption).
  2.  **Ask:** Does leaving this out change the viewer's judgment of *who was right or wrong* in this specific scene?
      *   **NO (It just simplifies):** **PASS.** You are allowed to curate for clarity. Carr argues we select facts to answer specific questions. If your question is "How was cargo loaded?" you don't need the police chief's portfolio.
      *   **YES (It hides bias/conflict):** **FLAG FOR CURATOR.** You cannot fix this alone. This is a values decision. The exhibit is making a moral argument by omission.
      *   *Why:* Carr says history is always about selection. It is okay to select for focus, but not okay to select in a way that secretly rigs the moral verdict.

  #### Gate 3: The Story Shape Check (The White Standard)
  *Goal: Catch "inevitability" and forced plotlines.*

  1.  **Scan for words that imply the future was already decided** (e.g., "inevitably," "destined," "led to," "precursor to," "tragic end," "heroic victory").
  2.  **Ask:** Did the people living through this know how it ended?
      *   **YES (We are describing a known outcome without claiming they knew it):** **PASS.** (e.g., "The strike ended after three weeks" is fine).
      *   **NO (We are implying the outcome was the only possible one):** **STOP AND REWRITE.** Change teleological language to contingent language.
          *   *Bad:* "The negotiation inevitably collapsed."
          *   *Good:* "The negotiation collapsed after the owner rejected the terms."
      *   **EXCEPTION:** If the panel is explicitly labeled "Interpretation" or "Historian's View," you may use these words, but you must add a phrase like "Historians argue..."
      *   *Why:* White argues we force history into plots (Tragedy, Comedy, etc.). We must admit when we are doing that, not pretend the history *is* the plot.

  ---

  ### Worked Examples

  Here is how your team applies the procedure to the hard cases you mentioned.

  #### Example 1: The "Tragic Defeat" Panel (Forced Rewrite)
  **Draft Text:** "The 1874 strike ended in a tragic defeat for the longshoremen, who returned to the docks broken and demoralized."
  **Source File:** A letter from a striker exists. It says, "We returned to work. We will try again next season." It does not mention being broken or demoralized.

  *   **Gate 1 (Evidence):** The words "tragic," "defeat," "broken," and "demoralized" are highlighted. The letter does not support "broken/demoralized."
      *   **Result:** **REWRITE.**
  *   **Action:** Staff changes text to: "The 1874 strike ended without the requested wage increase. The longshoremen returned to the docks. One letter noted: 'We will try again next season.'"
  *   **Why:** This fails Ranke. You cannot assign an emotional state (tragedy) that the primary source does not claim.

  #### Example 2: The Police Chief Shareholder (Defensible Selection)
  **Draft Text:** A panel titled "Daily Cargo Routines, 1880." It describes how crates were weighed and logged. It does not mention that the Police Chief, who oversaw dock security, owned shares in the shipping company.
  **Source File:** Stock ledger confirms the share ownership.

  *   **Gate 1 (Evidence):** All claims about weighing and logging are supported by dock logs. **PASS.**
  *   **Gate 2 (Selection):** The omitted fact (shareholder) is identified. Does leaving it out change the judgment of *this specific panel*?
      *   **Analysis:** The panel is about *logistics*, not *corruption* or *violence*. Knowing the Chief was a shareholder doesn't change how a crate was weighed.
      *   **Result:** **PASS.**
  *   **Why:** This passes Carr. We are selecting facts to answer the question "How did the port function?" not "Was the port corrupt?" As long as there is another panel elsewhere in the exhibit covering "Port Security and Conflicts," this omission is a valid curatorial focus, not a cover-up.

  #### Example 3: The "Inevitable Collapse" Timeline (Curator Flag)
  **Draft Text:** Timeline entry: "1889: Owners refuse offer. Negotiations inevitably collapse, leading to the Great Lockout."
  **Source File:** Minutes show the negotiations collapsed. Historians debate whether it was inevitable.

  *   **Gate 1 (Evidence):** "Refuse offer" and "collapse" are supported. **PASS.**
  *   **Gate 3 (Story Shape):** The word "inevitably" implies a plot structure (Tragedy/Fate) rather than a sequence of events.
      *   **Analysis:** Removing "inevitably" weakens the exhibit's central theme, which is that labor conflict was unavoidable in this era.
      *   **Result:** **FLAG FOR CURATOR.**
  *   **Action:** Staff notes: "Gate 3 failure. 'Inevitably' imposes a plot structure not found in the minutes. Removing it undermines the exhibit's thesis on structural conflict. Requires curatorial decision on whether to prioritize empirical accuracy (Ranke) or thematic argument (White/Carr)."
  *   **Why:** This is the "Stop" condition. The staff cannot fix this because fixing it breaks the exhibit's argument. The Curator must decide if the theme is more important than the empirical hedge.

  ---

  ### What This Procedure Cannot Catch (Limitations)

  Tell your friend (and your team) that this checklist is text-based. It will not catch bias or narrative framing introduced by:

  1.  **Visual Hierarchy:** A "Tragic Defeat" caption next to a photo of a weeping woman creates a tragedy even if the text is neutral. The checklist reads words, not images.
  2.  **Audio Tone:** A script that says "The workers returned" can be read by a voice actor with a somber, mournful tone (implying tragedy) or a neutral tone. The checklist does not audit audio direction.
  3.  **Visitor Prior Knowledge:** If visitors already believe unions were violent, a neutral panel about a "dock disturbance" will be read as confirmation of that bias. The procedure checks what *we* say, not what *they* hear.
  4.  **Spatial Flow:** Placing the "Violence" panel at the entrance and the "Cooperation" panel at the exit creates a narrative arc (Fall from Grace -> Redemption) regardless of what the individual captions say.

  ### How to Use This with Your Friend
  When your friend from the grad course critiques a panel, ask her to run it through the gates.
  *   If she says it's "too Rankean," ask: "Did it fail Gate 2? Did we omit a moral fact?"
  *   If she says it's "too Whitean," ask: "Did it fail Gate 3? Did we use the word 'inevitable'?"
  *   If she says it's "Carr's selection bias," ask: "Did it fail the Gate 2 moral judgment test?"

  If the panel passes all three gates, you have a defensible operational standard. If it fails, you know exactly which theoretical conflict is causing the problem.
