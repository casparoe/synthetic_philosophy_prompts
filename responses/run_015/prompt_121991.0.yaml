  **SEMINAR HANDOUT 04: TAXONOMY OF ANTHROPOCENE CLAIMS**
  **Course:** Philosophy of Science | **Audience:** Graduate Seminar (15 Students)
  **Topic:** The Anthropocene as Historical-Geological Category

  ### **DECISION TREE: ONTOLOGY AND AUTHORITY**

  The following taxonomy sorts competing positions on the Anthropocene based on two linked questions: the ontological status of the onset boundary and the sociological authority required to ratify it. Traverse the tree by answering the concrete claims at each node.

  **NODE 1 (Authority):** Is the International Commission on Stratigraphy (ICS) the sole legitimate authority for defining geological epochs?
  *   **YES →** **ICS FORMALIST TRACK** (Proceed to Node 2)
  *   **NO →** **PLURALIST TRACK** (Proceed to Node 5)

  **NODE 2 (Boundary Type):** Must the epoch boundary be anchored to a globally synchronous stratigraphic marker (GSSP)?
  *   **YES →** **SYNCHRONOUS TRACK** (Proceed to Node 3)
  *   **NO →** **GRADUALIST TRACK** (Proceed to Node 4)

  **NODE 3 (Marker Composition):** Is the definitive marker necessarily anthropogenic synthetic material (e.g., plutonium, plastics) rather than biotic exchange signatures?
  *   **YES →** **LEAF A: The Great Acceleration**
  *   **NO →** **LEAF B: The Orbis Hypothesis**

  **NODE 4 (Predictive Utility):** Does the epoch concept require predictive power over future geological layers?
  *   **YES →** **LEAF C: Predictive Gradualism (Unoccupied)**
  *   **NO →** **LEAF D: The Deep-Time Hypothesis**

  **NODE 5 (Formalization):** Should the term be ratified as a formal geological epoch rather than remain an informal interdisciplinary concept?
  *   **YES →** **DEMOCRATIC FORMALIST TRACK** (Proceed to Node 6)
  *   **NO →** **LEAF E: The Anti-Formalist View**

  **NODE 6 (Diachronic Authority):** Does epistemic authority require contemporaneous decision-making by affected communities?
  *   **YES →** **LEAF F: Democratic-Contemporary**
  *   **NO →** **LEAF G: Democratic-Retrospective**

  ***

  ### **LEAF POSITIONS AND COMMITMENTS**

  **LEAF A: The Great Acceleration**
  *   *Path:* ICS → Synchronous → Synthetic
  *   *Awkward Commitment:* Nuclear isotopes constitute a more geologically significant marker than the domestication of plants.

  **LEAF B: The Orbis Hypothesis**
  *   *Path:* ICS → Synchronous → Biotic
  *   *Awkward Commitment:* A CO₂ dip caused by colonial genocide qualifies as a synchronous geological boundary.

  **LEAF C: Predictive Gradualism (Unoccupied)**
  *   *Path:* ICS → Gradualist → Predictive
  *   *Awkward Commitment:* A diffuse millennia-long transition can ground precise predictions about future stratigraphy.
  *   *Diagnosis:* **Incoherent.** Gradual onsets lack the isochronous precision required for stratigraphic prediction, rendering the predictive claim empty.

  **LEAF D: The Deep-Time Hypothesis**
  *   *Path:* ICS → Gradualist → Descriptive
  *   *Awkward Commitment:* The Holocene technically ended millennia ago, rendering the current epoch a misnomer.

  **LEAF E: The Anti-Formalist View**
  *   *Path:* Pluralist → Informal
  *   *Awkward Commitment:* The term is scientifically useful precisely because it lacks a rigorous stratigraphic definition.

  **LEAF F: Democratic-Contemporary**
  *   *Path:* Pluralist → Formal → Contemporaneous
  *   *Awkward Commitment:* Affected communities today hold authority over geological time units that will outlast their civilizations.

  **LEAF G: Democratic-Retrospective**
  *   *Path:* Pluralist → Formal → Retrospective
  *   *Awkward Commitment:* Current political claims on geological time are illegitimate until validated by future stratigraphers.

  ***

  ### **NOTE ON COLLAPSED DISTINCTIONS**

  **Leaves F and G (Democratic-Contemporary vs. Democratic-Retrospective)**
  This tree cannot genuinely separate these positions in practice. While they differ on the *timing* of epistemic legitimacy (Node 6), they collapse because the "Democratic-Formalist" framework (Node 5) necessitates contemporaneous political action to be meaningful. A retrospective democratic decision is functionally indistinguishable from standard stratigraphy, differing only in rhetorical framing regarding who constitutes the "democratic body."
