          *   **Presentist View:** The measurements happen. The privileged frame exists. The fact that they can't *know* the correlation instantly is due to the hidden nature of the frame. The correlation itself might be instantaneous in the privileged frame (Bohmian style), but they can't use it to *sync* clocks without classical info.

