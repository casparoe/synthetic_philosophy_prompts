      *   *Block Theorist Treatment:* They say the correlation is a timeless fact about the block. The "labeling" is a retrospective construction. There is no global now.
      *   *Presentist Treatment:* They say the correlation propagates instantly in the hidden frame. But since observers can't access the hidden frame variables directly, they can't use it to *find* the frame.
      *   *Who Absorbs/Breaks:* Neither breaks because the protocol is physically impossible as a synchronization tool. The disagreement remains metaphysical.
