      *   *Nuance on Fraud:* The prompt notes fraud is criminal vs. administrative. This implies a presumption of guilt or moral weakness for claimants. I need to highlight that.
      *   *Nuance on Labor Market:* The prompt mentions sanctions apply regardless of labor market. This is crucial for the "hyper-agency" point. It assumes a frictionless market.

  5.  **Final Review:** (Mental check of the structure)
