answer: |-
  1. The hidden mix-up in my framing
  Your primary slip is assuming dualism escapes the exclusion problem. It doesn't. Kim's argument presupposes the causal closure of the physical: every physical event has a sufficient physical cause. If you're a dualist, you violate this closure to make mental causation work, which Kim rejects as scientifically untenable. The argument specifically targets non-reductive physicalism—the view that mental properties supervene on physical ones but aren't identical to them. If mental properties are distinct yet supervenient, they appear causally impotent because their physical bases do all the work. The only physicalist escape isn't dualism, but reductionism: identifying mental properties *with* physical properties. If M is P, there's no competition. So, the dilemma isn't "accept exclusion or become a dualist"; it's "accept exclusion, become a reductionist, or deny physical closure."

  2. What Kim's argument actually targets
  Kim's argument is designed to challenge the coherence of layered ontologies within a physically closed universe. It targets any view positing distinct higher-level properties that supervene on lower-level physical properties while claiming independent causal efficacy. The core tension arises from the principle of causal closure: if the physical domain is causally closed, any putative cause of a physical event must be physical. If a mental event causes a physical event, it must be identical to a physical event, or it overdetermines the effect. Kim argues systematic overdetermination is implausible. Therefore, the argument isn't just about individual minds; it applies to any supervenient property claiming causal power over its base. However, its force depends on accepting physical causal closure. If you deny closure (like some dualists or libertarians), the argument loses grip, but at the cost of scientific naturalism.

  3. The swarm-intelligence detour
  Applying this to swarm intelligence is structurally sound but often misses the theorists' intent. Group-level states do supervene on individual agents' behaviors and neural states. If individual actions are physically determined, group properties face the same exclusion threat: why posit a "group mind" cause if individual movements suffice? However, philosophers of collective intentionality often aren't positing spooky downward causation. Many argue group states are *constitutive* rather than causally competitive. They describe patterns of individual intentions rather than overriding them. Others accept a form of functional reductionism, where group properties are real but causally efficacious only in virtue of individual mechanisms. So, they aren't ignoring Kim; they're either denying the distinctness required for exclusion or accepting a deflated notion of group causation that doesn't compete with individual physics.

  4. A better way to frame your question
  Instead of asking if group minds are excluded, ask how group properties are *realized* by individual actions. The problem isn't whether groups cause things, but whether they cause them *independently* of individuals. Reframe the issue around realization: do group states cause outcomes *by* organizing individual causes, rather than competing with them? This shifts the debate from causal competition to causal constitution. You're looking for whether collective intentionality offers a viable model of non-reductive causation that survives Kim's critique, or if it simply dissolves the problem by redefining what "group causation" means.
