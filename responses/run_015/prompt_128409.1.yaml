answer: |-
  This is a remarkably sophisticated reading of the text, and you have hit on one of the central debates in Plutarchan scholarship: the tension between moral idealization and historical reality. You are right to feel stuck, because Plutarch is deliberately walking a tightrope. He is not writing hagiography, but he is also not writing modern critical biography. He is writing *protreptic* biography—writing designed to turn the soul toward virtue.

  Here is a way to untangle the death scene, the "contaminated exemplar," and the *synkrisis* with Fabius Maximus to see what Plutarch is actually asking you to do.

  ### 1. The Death Scene: Reason Over Fortune
  You asked if the lesson is just that "virtue holds up under pressure." It is that, but it is more specifically about **how we evaluate a life.**

  In the death scene (using the Clough translation, which captures the Victorian stoic vibe well), Pericles' friends are mourning two things: his impending death and the loss of his sons (who died of the plague earlier). They are focused on *pathos* (suffering/emotion). Pericles corrects them. He tells them to look at his *erga* (deeds) and his *doxa* (reputation/honor).

  Plutarch highlights that Pericles, in his delirium, recites a "ledger" of his life: *No citizen ever wore mourning because of me.*

  **The Moral Lesson:** Plutarch is teaching you that the moral worth of a life is internal and agentic, not external and contingent. Pericles cannot stop the plague (Fortune/*Tyche*), and he cannot bring his sons back. But he can control his judgment of his own life. The lesson is not "be perfect," it is "maintain rational agency even when Fortune destroys your external world." This is distinct from hagiography because a saint's power usually comes from God/Divine Grace overcoming the world. Pericles' power comes from his own *logos* (reason) sustaining itself against the world.

  ### 2. The "Contaminated Exemplar"
  Your friend's argument about hagiography is that saints are "too perfect to imitate." You are correctly identifying that Pericles is a **contaminated exemplar**. He led Athens into a devastating war; he was fined for embezzlement (allegedly); he died while his city was dying.

  **Is Plutarch smoothing this over (Hagiography) or leaving the stain (Biography)?**
  He is doing something third: **He is separating Moral Virtue from Political Success.**

  If Plutarch were writing hagiography, he would blame the plague on the gods punishing Athens for killing Socrates (anachronistic, but you get the point) or claim Pericles ascended to heaven. He would erase the failure.
  If he were writing modern history, he might argue Pericles was a hubristic imperialist who doomed Athens.

  Plutarch argues that Pericles' *character* remained virtuous even if his *political outcome* was disastrous. By leaving the "stain" of the war and the plague in the text, Plutarch makes Pericles **more** imitable, not less.
  *   **Hagiography:** "The Saint was perfect; worship him." (Impossible to imitate).
  *   **Plutarch:** "Pericles was great, but he faced disaster, criticism, and death. Yet he kept his integrity." (Possible to imitate).

  The "contamination" is essential. It teaches the reader that you can do the right thing and *still* suffer catastrophe. If virtue always led to success, we would only be virtuous for the reward. Plutarch wants you to be virtuous even when the city is burning around you.

  ### 3. The *Synkrisis*: Pericles and Fabius Maximus
  This is where your intuition is spot on. The *synkrisis* (comparison) at the end of the paired lives is not just a scorecard to see who won. It is a tool to nuance the moral lesson.

  **Fabius Maximus** (the Roman parallel) is the "Shield of Rome." He saved Rome by *avoiding* battle (the Fabian strategy), enduring criticism that he was cowardly, and eventually dying in relative quiet after securing Rome's safety.
  **Pericles** also saved Athens initially by retreating behind the walls (avoiding Spartan land battle), endured criticism (was called a coward/demagogue), but died while Athens was collapsing.

  **How this changes the reading:**
  When you read Pericles alone, his death looks like a tragedy of failure. When you read him against Fabius, the focus shifts to **Endurance of Criticism.**

  *   Fabius endured criticism and was vindicated (Rome survived).
  *   Pericles endured criticism and died in disgrace (Athens was dying).

  Plutarch uses Fabius to show that the *same virtue* (strategic patience, putting common good over popular opinion) can lead to different outcomes based on Fortune. By pairing them, Plutarch tells you: **Do not look at the outcome to judge the virtue.**

  If you only read Pericles, you might think, "Well, his strategy failed, so maybe he was wrong." By comparing him to Fabius, who used a similar strategy and succeeded, Plutarch isolates the *virtue itself* from the *luck of the outcome*. This reinforces the death scene: Pericles is right to tell his friends to look at his *intentions and service*, not his death.

  ### 4. Biography vs. Hagiography
  To answer your final sticking point: Does the "contaminated exemplar" make him closer to or further from hagiography?

  It makes him **further away.**

  *   **Hagiography** relies on the *suppression* of the stain to create an object of veneration. The saint is a vessel for the divine; their human flaws are obstacles to be erased.
  *   **Plutarchan Biography** relies on the *presence* of the stain to create an object of emulation. The statesman is a human using reason; their flaws are the friction against which virtue is tested.

  Plutarch states in his *Life of Alexander* (which serves as a preface to his whole project) that he is not writing histories, but lives. He says, *"A slight thing like a phrase or a jest often makes a greater revelation of character than battles where thousands fall."*

  In the death scene, the "slight thing" is Pericles correcting his friends. The "battle" is the Peloponnesian War. Plutarch cares less about whether Pericles won the war (history) and more about how Pericles faced death (biography/moral learning).

  ### Summary for your argument
  If you are discussing this with your friend or writing about it, here is the synthesis:

  1.  **Imitability:** Hagiography fails as moral pedagogy because the exemplar is ontologically different (holy vs. human). Pericles is a "contaminated exemplar" precisely so we *can* imitate him. We can't be saints, but we can choose reason over emotion in our own "plagues."
  2.  **The Role of Failure:** Plutarch does not smooth over the failure (the war/plague). He uses it to teach that virtue is independent of success. The death scene is the ultimate proof: Pericles is virtuous *even though* he is dying in a failing city.
  3.  **The Synkrisis:** Comparing him to Fabius confirms that the moral value lies in the *endurance of duty*, not the *glory of victory*. Fabius got the victory; Pericles got the plague. Both displayed the same virtue. Therefore, the reader should pursue the virtue, regardless of whether they get the Fabius-ending or the Pericles-ending.

  Plutarch isn't asking you to worship Pericles. He is asking you to ask yourself: *If my city were failing, and I were dying in disgrace, could I still say that no one mourned because of my actions?* That is a much harder, and more useful, question than "Can I be a saint?"
