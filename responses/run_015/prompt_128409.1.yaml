  1.  **Analyze the User's Query:**
      *   **Context:** The user is taking a course on biography and moral learning, focusing on Plutarch.
      *   **Core Question:** What is the moral lesson of Pericles' death scene in Plutarch's *Life of Pericles*? Is it just about virtue under pressure, or does the comparison (*synkrisis*) with Fabius Maximus change it?
