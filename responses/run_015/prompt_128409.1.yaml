      *   **Key Text:** *Life of Pericles* (Clough translation, 19th century, but ultimately Plutarch's original Greek intent).
      *   **Key Concepts:** Hagiography vs. Biography, *Synkrisis* (comparison), Contaminated Exemplars, Moral Learning (*mimesis* of virtue).

  2.  **Deconstruct the Passage (Pericles' Death):**
      *   *Scene:* Pericles is dying of the plague. Friends are mourning his losses (sons died earlier) and his own impending death.
      *   *Action:* Pericles rebukes them. He tells them to praise his *actions* and *honor*, not mourn his mortality. He lists his achievements (no citizen wore mourning *because of him*).
      *   *Plutarch's Comment:* Plutarch notes that even in agony, Pericles' mind was on his *arete* (virtue/excellence) and the city, not his pain.
      *   *Immediate Lesson:* Rational control over emotion, prioritizing public service over private suffering, the "immortality" of reputation through deeds.

  3.  **Address the "Contaminated Exemplar" Issue:**
      *   *The Stain:* The Peloponnesian War started under him. The plague devastated Athens. He was fined shortly before death.
      *   *Plutarch's Handling:* Plutarch doesn't hide the war or the plague. However, in the death scene, he focuses on Pericles' *internal state* rather than the external political outcome.
      *   *Hagiography vs. Biography:* Hagiography typically erases flaw to create an object of worship. Plutarch retains the flaw (the war, the fine, the plague) but isolates the *character* at the moment of death. This suggests it's *not* hagiography in the saintly sense. It's moral psychology.
      *   *The "Contamination":* The contamination makes the virtue *harder* and thus more imitable. A saint is perfect by grace/nature; Pericles is virtuous by choice amidst disaster.

  4.  **Analyze the *Synkrisis* (Pericles vs. Fabius Maximus):**
      *   *Fabius:* "The Shield of Rome." Delayer. Saved Rome by avoiding battle. Died quietly.
      *   *Pericles:* "The Olympian." Aggressive strategist (initially). Saved Athens by retreating behind walls (similar to Fabius). Died in disgrace/plague.
      *   *Comparison Point:* Both practiced strategic patience (retreating behind walls/walls of caution). Both faced criticism for it.
      *   *Moral Takeaway:* The *synkrisis* isn't just "who was better?" It's "how does virtue manifest in different political contexts?" Fabius's virtue was endurance without glory. Pericles's was glory tempered by endurance.
      *   *Relevance to Death:* Fabius died secure in Rome's survival. Pericles died while Athens was crumbling. This makes Pericles' stoicism *more* poignant. He maintains virtue even when the *outcome* is failure.

  5.  **Synthesize the Argument:**
      *   **Thesis:** Plutarch is not writing hagiography. He is using the "contaminated exemplar" to teach a specific kind of moral learning: virtue is about *judgment and character*, not just successful outcomes.
      *   **Point 1: The Death Scene.** It's about *logos* (reason) ruling *pathos* (emotion). The lesson is how to face mortality with a clear account of one's life.
      *   **Point 2: Contamination.** The flaws make him imitable. If he were perfect, we couldn't copy him. The "stain" (war/plague) shows that virtue doesn't guarantee success, only integrity.
      *   **Point 3: Synkrisis.** Comparing with Fabius highlights that the *method* of virtue (strategic patience) is the same, but the *reception* differs. It shifts focus from "glory" to "duty."
      *   **Point 4: Biography vs. Hagiography.** Hagiography seeks to inspire awe/worship. Plutarch seeks to inspire *action/emulation*. The "stain" is crucial for emulation.

