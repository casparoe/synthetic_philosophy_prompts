answer: |-
  Here is a defended research agenda for a two-to-three-year conceptual project. I recommend the following ordering of priorities:

  1.  **The Moral Ontology of Risk (Cluster 1):** Determine whether the separateness of persons objection applies with distinct force to *ex ante* risk imposition, independent of *ex post* outcomes.
  2.  **The Structural Integrity of Alternatives (Cluster 2):** Evaluate whether prioritarian or contractualist frameworks genuinely resolve the objection once the ontology of risk is settled, or if they merely obscure aggregation.
  3.  **Institutional Translation (Cluster 3):** Develop decision-procedures for public policy that reflect the findings of the first two phases without inducing paralysis.

  Below is the defense of this ordering, the assessment of tractability, and the criteria for adjusting the agenda.

  ### Priority 1: The Moral Ontology of Risk (Cluster 1)

  **Why this is upstream:**
  This is the foundational boundary condition for the entire debate. The traditional "separateness of persons" objection (as articulated by Rawls and Nozick) is framed around *determinate* sacrifices: one person definitely loses their life or liberty so that others may gain. However, modern governance and institutional ethics are almost exclusively probabilistic. We do not typically sacrifice Person A to save Persons B–Z; we impose a microscopic risk of harm on Persons A–Z to prevent a larger aggregate risk.

  If the separateness objection loses its grip in probabilistic contexts—because no single individual is definitively "sacrificed," only endangered—then the urgency of finding non-aggregative alternatives (Cluster 2) diminishes significantly. Conversely, if risk imposition itself constitutes a violation of separateness (perhaps because it treats individuals as mere vessels for probability distributions), then standard prioritarian models, which typically aggregate expected welfare, may be categorically insufficient regardless of their weighting functions. You cannot determine *how* to aggregate (Cluster 2) until you determine *what* is being aggregated (welfare vs. risk exposure). Therefore, settling the moral status of risk is logically prior to evaluating the aggregation mechanisms.

  **Tractability:**
  This is highly tractable for conceptual work. It does not require empirical data collection but rather rigorous thought experimentation and decision-theoretic modeling. A small group can analyze specific case pairs (e.g., certain harm to one vs. small risk of harm to many) to isolate whether the moral intuition shifts based on probability alone. The literature here is less settled than the deterministic cases, offering genuine room for novel contribution within a two-year window.

  **Criteria for Promotion or Demotion:**
  *   **Promote:** If your team develops a robust argument showing that risk imposition creates a distinct moral "debt" or violation that is not reducible to expected outcome values. This would necessitate a major overhaul of standard normative theories.
  *   **Demote:** If you conclude that risk is morally reducible to expected utility (i.e., a 1% chance of death is morally equivalent to 1/100th of a death). If this holds, the separateness objection becomes significantly weaker in real-world applications, and you should move immediately to Cluster 2 to see if prioritarianism can handle the remaining deterministic edge cases.

  ### Priority 2: The Structural Integrity of Alternatives (Cluster 2)

  **Why this is upstream of Cluster 3 but downstream of Cluster 1:**
  Once you have defined the "currency" of moral concern (welfare vs. risk), you must audit the tools proposed to handle it. There is a significant risk that prioritarianism and contractualism are functionally isomorphic to utilitarianism in high-stakes institutional contexts, differing only in rhetorical framing. For example, if a prioritarian weighting function must be sufficiently flat to allow for necessary public health interventions, does it collapse back into aggregation?

  This priority is downstream of Cluster 1 because the "audit" depends on what you found regarding risk. If risk is a distinct harm, you are testing whether these theories can aggregate risk without violating separateness. If risk is not distinct, you are testing them against deterministic sacrifices. It is upstream of Cluster 3 because applying a theoretically incoherent framework to institutions (Cluster 3) leads to dogma rather than guidance. You must know if the engine works before you build the car.

  **Tractability:**
  This is moderately tractable but carries a higher risk of stalemate. It requires close logical analysis of existing frameworks (e.g., Scanlonian contractualism or Parfitian prioritarianism) to identify breaking points. The danger is getting bogged down in exegesis. To remain tractable, the research should focus on *limit cases* (e.g., extreme emergencies) where the mathematical differences between utilitarianism and its rivals become stark, rather than attempting a comprehensive survey of the theories.

  **Criteria for Promotion or Demotion:**
  *   **Promote:** If you identify a specific structural feature common to all aggregative views (including prioritarianism) that inevitably violates separateness under stress. This would justify shifting resources to non-aggregative deontological models.
  *   **Demote:** If you demonstrate that contractualist or prioritarian rules can consistently respect separateness while yielding actionable guidance. This would validate the current theoretical landscape and allow you to move quickly to implementation.

  ### Priority 3: Institutional Translation (Cluster 3)

  **Why this is last:**
  Institutional design is the output, not the input. Attempting to design triage protocols or public health trade-offs without settling the first two questions invites one of two failures: either "unrestrained aggregation" (ignoring the objection because the theory is unresolved) or "practical paralysis" (refusing to act because the theory is too restrictive). Conceptual work here should not focus on specific policies (which change) but on *decision-procedures* (which are stable). For example, should institutions use "ex ante" rules (everyone follows the same safety protocol) or "ex post" compensation (we allow the risk but compensate the victim)? This choice depends entirely on the findings of Priorities 1 and 2.

  **Tractability:**
  This is the least tractable for purely conceptual work, as it risks drifting into empirical policy analysis. To keep it philosophical, the focus must remain on the *justificatory structure* of institutions. How does a hospital administrator justify a decision to a patient who was harmed by a utilitarian calculation? The work here is to draft the "public reason" that institutions owe to individuals, based on the conclusions of the first two priorities.

  **Criteria for Promotion or Demotion:**
  *   **Promote:** If Priorities 1 and 2 yield a stable theoretical framework quickly. This would allow more time to stress-test the framework against complex real-world constraints (e.g., resource scarcity).
  *   **Demote:** If Priorities 1 and 2 remain unresolved. In this case, continuing to work on institutional design is premature. The group should pivot to publishing the theoretical impasse rather than forcing a practical application.

  ### Summary of Strategic Logic

  This agenda prioritizes **definition over evaluation**, and **evaluation over application**.

  Many researchers rush to apply contractualism or prioritarianism to public health (Cluster 3) without verifying if those theories survive the "risk test" (Cluster 1). By starting with the ontology of risk, you address the most significant gap in the current literature: the transition from 20th-century critiques of determinate sacrifice to 21st-century governance of probabilistic harm. If the separateness objection cannot survive the transition to risk, the debate changes entirely. If it does survive, the demand for new aggregation rules becomes urgent. This ordering ensures that your limited time is spent on the variable that most drastically alters the value of the subsequent work.
