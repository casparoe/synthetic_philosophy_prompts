  7.  **Self-Correction during drafting:** I initially thought about saying Case 2 is purely Etiological. But it's not just about the bee's history; it's about the *network's* history. It's a "Historical Fidelity" constraint. I need to make sure I don't conflate the bee's evolutionary history with the site's historical composition. The sheet cares about the *identity* of the agent, which aligns more with a "Historical Integrity" view than pure biological function theory. I should clarify that distinction.

