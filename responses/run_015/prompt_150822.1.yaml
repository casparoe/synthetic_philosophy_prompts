      *   **The Problem:** A habitat restoration monitoring sheet exhibits inconsistent criteria for "function."
          *   *Case 1 (Nutrient Cycling/Decomposition):* Functional equivalence is sufficient. Identity of the agent (lab-grown crust from 300 miles away) doesn't matter. Outcome (N levels, decomposition rates) matches reference. -> *Function = Current Contribution.*
          *   *Case 2 (Pollination):* Historical identity is required. Functional equivalence (honeybees doing the job) is insufficient. Must be historical bumblebee species. -> *Function = Historical Role/Identity.*
          *   *Case 3 (Shrub Defense):* A trait performs its historical function (chemical defense against beetles), but this hinders a new conservation goal (butterfly reintroduction). It's treated as a "malfunction" because it conflicts with the new goal, even though the trait is working as evolved. -> *Function = Goal-Directedness (Teleology) of the Restorers, not the Organism.*
      *   **The Task:** Identify the implicit theory of biological function. Evaluate two candidate theories (Historical/Etiological vs. Current/Contributory). Determine if one theory explains all three cases or if the protocol switches. If it switches, is it principled or sloppy? What does the sheet presuppose vs. what goes well with it? What would a consistent sheet look like under each theory?

  2.  **Deconstruct the Three Cases through Philosophical Lenses:**

      *   **Theory A: The Etiological (Historical) Account (e.g., Millikan, Neander).**
          *   *Definition:* A trait's function is what it was selected *for* in evolutionary history.
          *   *Case 1 (Nutrients):* Fails. The lab-grown crust wasn't selected *in this context* historically. It's an artifact. Yet, the sheet accepts it.
          *   *Case 2 (Pollinators):* Fits. They want the historical bumblebee because that's the co-evolved partner.
          *   *Case 3 (Shrub):* Fits the *biology* (the trait functions as selected), but conflicts with the *restoration goal*. The sheet treats it as a malfunction relative to the *human goal*, not the biological history.
          *   *Verdict:* Cannot explain Case 1.

      *   **Theory B: The Causal Role (Current Contribution) Account (e.g., Cummins).**
          *   *Definition:* A trait's function is what it currently contributes to the capacity of the containing system.
          *   *Case 1 (Nutrients):* Fits. N-fixation and decomposition are happening. System capacity is restored.
          *   *Case 2 (Pollinators):* Fails. Honeybees contribute the same capacity (seed set). Yet, the sheet rejects them.
          *   *Case 3 (Shrub):* Fits the *biology* (it contributes defense), but again, conflicts with the *human goal*.
          *   *Verdict:* Cannot explain Case 2.

      *   **Theory C: The "Restoration Teleology" (Human-Imposed Normativity).**
          *   *Observation:* The sheet isn't actually tracking *biological* function in a consistent philosophical sense. It's tracking *fiduciary* function relative to a specific normative goal (Historical Fidelity vs. Ecosystem Service).
          *   *Case 1:* Goal = Ecosystem Service (N cycling). Identity irrelevant.
          *   *Case 2:* Goal = Historical Fidelity/Conservation of Specific Taxa. Identity crucial.
          *   *Case 3:* Goal = Conservation of Specific Taxa (Butterfly). The shrub's biological function is an obstacle to the human goal.
          *   *Verdict:* This explains the inconsistency. The sheet switches between "System Capacity" and "Historical Identity" based on *which conservation value is prioritized for that specific metric.*

  3.  **Synthesize the "Implicit Theory":**
      *   The sheet is not running on a single philosophical theory of biological function.
      *   It is running on a **Hybrid Normative Framework** common in restoration ecology.
      *   It implicitly distinguishes between *Process Functions* (nutrient cycling, where mechanism is black-boxed) and *Structural/Compositional Functions* (pollination networks, where specific links matter).
      *   Case 3 reveals that "Function" on the sheet actually means "Contribution to the Restoration Plan," not "Biological Function of the Organism."

  4.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the user's background. Validate the observation (it's a classic philosophical tension in ecology).
      *   *Section 1: The Two Candidates.* Briefly define Etiological (Selected Effect) vs. Causal Role (Cummins).
      *   *Section 2: Testing the Cases.*
          *   Show how Case 1 fits Causal Role but breaks Etiological.
          *   Show how Case 2 fits Etiological (sort of) but breaks Causal Role.
          *   Show how Case 3 breaks *Biological* function entirely in favor of *Management* function.
      *   *Section 3: The Diagnosis.* The sheet is switching. Is it sloppy? No, it's **Pragmatically Hybrid**. It reflects the dual mandates of restoration: *Ecosystem Services* (utilitarian) vs. *Historical Fidelity/Biodiversity* (preservationist).
      *   *Section 4: Presuppositions vs. Compatibility.*
          *   *Presupposes:* That "Restoration" is a normative act, not just a descriptive one. That humans define the "proper function" of the site.
          *   *Goes well with:* The concept of "Reference Ecosystems" as normative ideals, not just baselines.
      *   *Section 5: Making it Consistent.*
          *   *Scenario A (Strict Causal Role):* Tick box for honeybees. Shrub defense is a "functioning trait" (might need management if it blocks goals, but biologically it works).
          *   *Scenario B (Strict Etiological):* Reject lab crust (unless proven historically present). Reject honeybees. Shrub defense is "functioning" (but maybe undesirable).
          *   *Scenario C (Strict Restoration Teleology):* Rename the column "Contribution to Management Goals." This is the most honest label.

