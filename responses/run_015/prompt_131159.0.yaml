answer: |-
  # Diagnostic Taxonomy of Material Constitution
  ### Scenario: "The Work" (Metabolizing Ceramic-Biofilm Artifact)

  **Instructions for the Reading Group:**  
  Treat this tree as a logic gate for ontological commitments. Begin at the Root. Follow the branch corresponding to your intuition about the physical case. Proceed until you reach a terminal leaf (a named position). If you reach a leaf marked "Unoccupied," note the diagnosis provided.

  ***

  ### **ROOT NODE**
  **Question:** Can an object survive the complete replacement of all its constituent matter if its form and causal-functional loop are preserved continuously by an active process?

  *   **NO**  
      $\rightarrow$ **Leaf 1: Mereological Essentialism**  
      *(Diagnosis: The object is identical to its specific atoms. If the atoms change, the object ceases to exist, regardless of functional continuity. "The Work" is a sequence of distinct, short-lived objects, not one persisting entity.)*

  *   **YES**  
      $\rightarrow$ Proceed to **Level 2**.

  ***

  ### **LEVEL 2 NODE**
  **Question:** At any given time, can the Work and the underlying ceramic-biofilm aggregate be two numerically distinct objects that occupy exactly the same region but differ in their modal properties—for example, one could survive crushing into powder and the other could not?

  *   **YES** (Distinct objects can coincide in space)  
      $\rightarrow$ Proceed to **Level 3**.

  *   **NO** (Only one object exists in that region)  
      $\rightarrow$ Proceed to **Level 3**.

  ***

  ### **LEVEL 3 NODE**
  **Question:** Is persistence through such change best analyzed as the endurance of a single three-dimensional entity that gains and loses parts over time, or as the existence of a four-dimensional spatiotemporal "worm" composed of instantaneous temporal parts?

  *   **BRANCH A (From Level 2 = YES)**
      *   **3D Entity (Endurance)**  
          $\rightarrow$ **Leaf 2: The Constitution View (Coincident Objects)**  
          *(Diagnosis: The "Work" and the "Aggregate" are distinct entities sharing the same space. Like a wave and the water, they have different persistence conditions despite spatial overlap.)*
      *   **4D Worm (Perdurance)**  
          $\rightarrow$ **Leaf 3: UNOCCUPIED**  
          *(Diagnosis: Conceptually incoherent; four-dimensionalism is typically adopted to dissolve coincidence by treating objects as sharing temporal parts rather than being distinct 3D entities in the same place.)*

  *   **BRANCH B (From Level 2 = NO)**
      *   **4D Worm (Perdurance)**  
          $\rightarrow$ **Leaf 4: Four-Dimensionalism or Perdurantism**  
          *(Diagnosis: "The Work" is a spacetime worm. The atom-replacement is just a change in temporal parts. There is no coincidence because the object is extended in time, not wholly present at each instant.)*
      *   **3D Entity (Endurance)**  
          $\rightarrow$ Proceed to **Level 4**.

  ***

  ### **LEVEL 4 NODE**
  **Question:** Is the boundary that distinguishes the Work from its surroundings determined by a real, mind-independent fact—perhaps tied to causal cohesion or functional integration—or is it a conventional projection with no ontological weight?

  *   **BRANCH B continued (From Level 3 = 3D Entity)**
      *   **Conventional Projection**  
          $\rightarrow$ **Leaf 5: Artifact-Eliminativism or Conventionalism about Boundaries**  
          *(Diagnosis: "The Work" is a useful label for a collection of atoms, but there is no deep physical fact making it a single object. It is a cognitive shorthand, not an ontological unit.)*
      *   **Real, Mind-Independent Fact**  
          $\rightarrow$ **Leaf 6: Functional-Continuity View**  
          *(Diagnosis: The object is real and 3D, but its identity is grounded in the causal loop (the biofilm feedback), not the specific matter. The boundary is where the causal integration ends.)*

  ***

  ### **Ambiguity Flag: Leaf 4 vs. Leaf 6**

  **The Pair:** **Four-Dimensionalism (Leaf 4)** and **Functional-Continuity View (Leaf 6)**.

  **The Ambiguity:** This tree separates these positions based on the *temporal ontology* (4D worm vs. 3D enduring entity). However, in practice, these views often yield identical predictions for physical experiments. A Four-Dimensionalist may define the "worm" using the exact same functional criteria that the Functional-Continuity theorist uses to define the "3D entity."

  **Required Distinction:** To cleanly separate them, one would need a question regarding the **ontological status of the present moment**: *"Is the object wholly present right now, or is only a temporal slice present right now?"* Without this metaphysical distinction, the two views are empirically equivalent descriptions of the same physical process.

  ***

  ### **Notes for Physicists**

  1.  **On "Coincidence" (Level 2):** Think of this like two fields occupying the same volume (e.g., gravitational and electromagnetic). The Constitution View claims two "object-fields" occupy the same space but have different equations of state (modal properties).
  2.  **On "4D Worms" (Level 3):** This is analogous to a world-line in relativity. The object is the entire line, not the point on the line at $t=now$.
  3.  **On "Conventional Boundaries" (Level 4):** This is akin to asking if a "watershed" is a real physical object or a line drawn on a map based on water flow. Eliminativists say it's the latter; Functionalists say the causal flow makes it the former.
