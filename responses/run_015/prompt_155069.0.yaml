  4.  **Developing the Timeline (80 mins):**
      *   0-10: Setup & Roles.
      *   10-20: Rules & Voting on Rate.
      *   20-35: Decision Phase (Present deliberates, Future watches helplessly).
      *   35-45: Execution & Counting.
