answer: |-
  # Simulation: The Horizon Vote

  ## 1. Physical Setup and Role Assignments

  **Room Configuration:**
  *   Divide the classroom into two distinct zones using a strip of masking tape on the floor running down the center. Label one side **"T0" (Present)** and the other **"T1" (Future)**.
  *   Place a clear plastic bin or box exactly on the tape line. Label this **"The Temporal Horizon."**
  *   Arrange chairs so T0 and T1 face each other. Participants can see one another clearly but cannot touch across the line.

  **Participants (14 Total):**
  *   **T0 Group (Present):** 8 Students.
  *   **T1 Group (Future):** 6 Students.
  *   **Facilitator:** You (holds the master ledger and timer).

  **Materials:**
  *   80 Poker Chips (or distinct tokens).
  *   14 Ballots (small slips of paper).
  *   A whiteboard for tallying scores.
  *   Small tangible rewards (e.g., high-quality chocolate bars) tied to final point scores.

  **Role Assignment:**
  *   Hand out role cards face down as students enter.
  *   **T0 Card:** "You exist in the Present. You hold the initial endowment. You have the capacity to invest across the Horizon."
  *   **T1 Card:** "You exist in the Future. You hold no initial endowment. You are dependent on transfers across the Horizon."
  *   **Instruction:** "You may not negotiate, speak, or signal across the Horizon line at any time. Violation results in immediate disqualification for your group."

  ## 2. Rules and Incentives

  **The Endowment:**
  *   Each T0 student receives **10 Chips**.
  *   Each T1 student receives **0 Chips**.

  **The Mechanism (Growth vs. Decay):**
  *   **Retention:** Any chip a T0 student keeps in their hand at the end is worth **1 Point** to them.
  *   **Investment:** Any chip a T0 student places into "The Temporal Horizon" box is considered an investment in the future.
  *   **Growth Multiplier:** Chips in the box are technologically amplified. They become **1.5 Chips** for the T1 group (representing economic growth/innovation).
  *   **The Pure Rate (Decay):** Before T1 receives the invested chips, they are subject to the "Pure Time Decay Rate."
      *   *Formula:* `T1 Receipt = (Chips Sent × 1.5) × (1 - Decay Rate)`
      *   *Example:* If 10 chips are sent and the Decay Rate is 40%: `10 × 1.5 = 15`. `15 × 0.6 = 9`. T1 gets 9 chips total.
      *   *Note:* The lost chips vanish (representing pure utility loss, not cost).

  **The Vote (The Core Mechanic):**
  *   Before T0 decides how many chips to send, **all 14 students** vote on the **Decay Rate**.
  *   Options: 0%, 10%, 20%... up to 90%.
  *   The rate is determined by the **median vote**.
  *   **Symmetric Rule Clause:** The rule states: *"Any object crossing the Horizon is subject to the Decay Rate, regardless of direction."* (In practice, causality prevents T1 from sending to T0, but the rule is textually symmetric).

  **Payoff Structure:**
  *   **Individual Incentive:** Rewards (chocolate/credit) are distributed based on **Individual Point Total**.
      *   T0 wants to maximize their own kept chips.
      *   T1 wants to maximize received chips.
  *   **Collective Incentive:** Announce at the start: *"The group achieves 'Social Optimality' if the Total Room Points exceed 100."* (This creates the coordination tension).

  **The Coordination Failure Logic:**
  *   **Social Optimum:** If Decay Rate is < 33%, sending chips creates more total points (1 chip kept = 1 pt; 1 chip sent = 1.5 pts). The group should vote low and send all.
  *   **Individual Rationality for T0:** If T0 votes for a Decay Rate > 33% (e.g., 50%), the return on sending drops below 1 (1.5 × 0.5 = 0.75). It becomes *individually irrational* for T0 to send anything.
  *   **The Trap:** T0 holds the majority (8 vs 6). They can vote for a high Decay Rate, which mechanically justifies keeping all chips. They maximize their individual score, T1 gets almost nothing, and the Total Room Points stay below the optimal threshold.

  ## 3. Minute-by-Minute Timeline (80 Minutes)

  **00:00 – 00:10: Arrival and Seating**
  *   Students draw roles. Enforce silence across the Horizon line immediately.
  *   Distribute chips to T0. T1 sits with empty hands.
  *   Post the Rules on the board. Read the "Symmetric Rule Clause" aloud.

  **00:10 – 00:25: The Vote (Setting the Parameter)**
  *   Explain that the Decay Rate represents "Pure Time Preference"—a loss of value solely due to crossing the time barrier, not due to risk or cost.
  *   Distribute ballots. Students vote privately on the Rate.
  *   Collect and calculate the Median Rate. Write it prominently on the board.
  *   *Facilitator Note:* If the median is low (<30%), quietly mention to T0 during the next phase that they are under no obligation to send if it reduces their personal score. Do not advise them to vote high; let them choose.

  **00:25 – 00:40: The Decision (T0 Deliberation)**
  *   T0 group may speak amongst themselves. T1 group must sit silently and watch.
  *   T0 decides how many chips to place in the Horizon box.
  *   T1 will likely attempt to signal distress or make promises (e.g., "We will pay you back!"). Remind them: "Intertemporal negotiation is forbidden. Causality flows one way."
  *   T0 deposits chips. T0 keeps remaining chips.

  **00:40 – 00:50: Execution and Counting**
  *   Facilitator empties the box.
  *   Apply the math publicly: `Sent × 1.5 × (1 - Rate)`.
  *   Distribute resulting chips to T1.
  *   Tally Individual Scores and Total Room Score on the whiteboard.
  *   Distribute rewards based on individual scores.

  **00:50 – 01:20: Debrief (The Conceptual Pressure)**
  *   (See Section 4 for detailed flow).

  ## 4. Debrief: Mapping Action to Concept

  Do not lecture immediately. Ask questions that force them to recount the tension they just felt.

  **Phase 1: The Vote (10 Minutes)**
  *   *Ask T1:* "What rate did you vote for? Why?" (Expected: 0%. You wanted maximum transfer).
  *   *Ask T0:* "What rate did you vote for? Why?" (Expected: Varied. Some may have voted high to protect their endowment).
  *   *Conceptual Map:* This is the **Political Choice of the Discount Rate**. In models, $r$ is often a parameter. In reality, it is a policy choice made by the living. Ask: "Did the median vote reflect 'market rates' or 'power dynamics'?"

  **Phase 2: The Decision (10 Minutes)**
  *   *Ask T0:* "Once the rate was set, was it rational to send chips?"
      *   If Rate > 33%: "No."
      *   If Rate < 33%: "Yes."
  *   *Ask T1:* "How did it feel to watch T0 deliberate?" (Expected: Helplessness, frustration).
  *   *Conceptual Map:* This is **Pure Time Preference vs. Opportunity Cost**.
      *   Point out: "There was no risk the chips would vanish in the box. There was no cost to moving them. The only loss was the Rate you voted for."
      *   "If you discount the future purely because it is the future, you manufacture a rationality that requires selfishness."

  **Phase 3: The Symmetry Illusion (5 Minutes)**
  *   *Ask:* "The rule said decay applies to *any* object crossing the line, regardless of direction. Was the rule symmetric?" (Yes).
  *   *Ask:* "Was the experience symmetric?" (No. T1 couldn't send back).
  *   *Conceptual Map:* This illustrates the **Asymmetry of Power**. Moral theories often assume symmetric agents. Intergenerational justice involves agents who can affect others but cannot be affected by them. The "Symmetric Rule" masked the "Asymmetric Power."

  **Phase 4: The Coordination Failure (5 Minutes)**
  *   *Check the Total Room Score.* If it was under 100 (Social Optimality), highlight it.
  *   *Ask:* "Could everyone have been richer?" (Yes, if Rate was low and T0 sent all).
  *   *Ask:* "Why didn't that happen?"
  *   *Conceptual Map:* This is the **Contractual Failure**. T1 cannot offer a binding contract to T0. Without enforceable reciprocity, T0 uses the Discount Rate to justify consumption.

  ## 5. Limitations: What the Simulation Cannot Reproduce

  Be honest with the students about where the metaphor breaks. You must supply these points verbally.

  1.  **The Existence Problem:** In the simulation, T1 students exist and can vote. In reality, future people do not exist yet and cannot vote on the discount rate applied to them. The simulation gives the Future *more* power than they have in reality.
      *   *Facilitator Note:* "In the real world, T1 has no seat at the table. The 'Median Vote' is actually just the T0 vote."
  2.  **Psychological vs. Ethical Discounting:** Here, the discount was a rule imposed on chips. In human psychology, pure time preference is often internal (impatience). The simulation externalizes it as a policy, which makes it look more cynical than it might feel internally.
  3.  **Identity Continuity:** T0 and T1 were different people. In intergenerational justice, T0 often cares about T1 (their children/grandchildren). The simulation assumes disjoint self-interest to highlight the structural problem, but real motives are mixed.

  ## 6. Troubleshooting: Predictable Failures

  **Problem 1: T0 Altruism Ruins the Tension**
  *   *Risk:* T0 students might vote 0% and send all chips out of kindness, maximizing the Total Score and removing the "failure."
  *   *Fix:* During the Decision Phase, if T0 seems too cooperative, remind them: "Your reward is based on *your* individual score. There is no penalty for keeping." Re-emphasize the individual incentive structure.
  *   *Backup:* If they still cooperate, ask in debrief: "You acted altruistically. But what if the next generation of T0 isn't altruistic? Can we build a system that relies on saints?"

  **Problem 2: T1 Disengagement or Hostility**
  *   *Risk:* T1 students feel powerless and stop participating in the debrief.
  *   *Fix:* Monitor T1 body language. If they look checked out, pause the simulation before the count and ask T1: "You have 2 minutes to make a public statement to T0. You cannot negotiate, but you can testify." This validates their agency without breaking the causality rule.

  **Problem 3: Negotiation Across the Line**
  *   *Risk:* Students pass notes or whisper promises ("I'll buy you coffee later").
  *   *Fix:* Enforce the "Epistemic Barrier" strictly. If caught, confiscate 2 chips from T0's endowment. This reinforces the **Non-Identity/Non-Reciprocity** constraint. The point is that promises to the future are unenforceable.

  **Problem 4: Confusion Over the Math**
  *   *Risk:* Students get bogged down in calculating the 1.5 multiplier vs. the Decay Rate.
  *   *Fix:* Keep the math on the whiteboard throughout. Use round numbers. If the Median Vote is a weird number (e.g., 27%), round it to the nearest 10% for ease of calculation.

  **Problem 5: The "Risk" Objection**
  *   *Risk:* T0 argues, "I kept the chips because the Future might not exist (risk)."
  *   *Fix:* Shut this down during debrief. "The rules stated the chips *would* arrive. There was no probability of destruction. That was Pure Time Preference, not Risk Discounting. Distinguish the two."
