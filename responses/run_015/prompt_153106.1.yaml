  I've been working through Kant's idea that you test a maxim by asking whether you could will it as universal law, applying it to situations in my own life rather than just the textbook ones. Here is my track record: I judge that borrowing money with no intention to repay is wrong because the practice of promising would collapse; I judge that refusing to help anyone even at trivial cost is wrong because I couldn't rationally will a world where I'm never aided; I judge that developing my talents is required in some form but that I don't have to maximize every skill; I judge that completely neglecting all self-improvement is wrong; and I judge that telling a harmless white lie to spare someone's feelings is permissible, since universal politeness wouldn't destroy communication. Now I'm facing a case I haven't seen discussed: I want to design a personal AI that runs universalizability tests on my maxims for me, so that I always act consistently with the moral law without having to do the reasoning myself. If I apply my own track record consistently, should I approve or reject this delegation? I suspect my earlier verdicts fit more than one rule—perhaps a strict contradiction-in-conception test, a contradiction-in-will test, or a further requirement that rational agents must exercise their own moral reasoning. Which of these best explains my judgments, what does each predict about the AI-delegation case, and which further case—say, delegating my financial planning or my artistic judgment to an algorithm—would tell them apart? Give me a committed answer: say which rule I'm actually running, what I should decide about the AI, and why, rather than laying out the options neutrally.
