  hey, i'm trying to make sense of this argument my study group cooked up — they call it "elastic sphexishness" but i think its just something they invented for the seminar. can you help me see where it breaks?

  (1) the sphex wasp is mechanically rigid: if you move the prey while its checking the burrow, it just repeats the exact same loop instead of adapting.
