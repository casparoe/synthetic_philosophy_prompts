  (3) now suppose there's "elastic sphexishness" — the agent updates its loops based on feedback, but every update-rule is itself fixed by the prior loop-state, so the flexibility is only skin-deep.
  (4) human reasoning works the same way: when we revise a belief we think we're being open-minded, but we're just running a meta-loop triggered by the old belief-state.
  (5) so if you're purely rigid you lack free will, and if you're elastically sphexish your "revisions" were never genuinely open-ended, which also kills free will.
  (6) therefore every possible agent falls into one of these two catagories, and free will is impossible.

  i'd really like to keep (1) and (5) if i can, but i feel like (3) or (4) is sneaky. which step should i reject, and whats the cost? please write your answer in british english, and no need for references or reading lists — i just want the logic sorted.
