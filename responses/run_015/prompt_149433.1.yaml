      *   Actually, a stronger agreement for a joint statement: "We agree that the severity of harm to an individual is the primary unit of moral evaluation." (Aggregativist accepts this as the base unit, Taurek as the ceiling).
      *   Let's stick to the prompt's requirement: "including whatever the numbers-don't-count side concedes in the case where the many each lose exactly as much as the one."
