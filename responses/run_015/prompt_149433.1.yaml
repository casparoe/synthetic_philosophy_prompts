      *   *Taurek View Nuance:* Taurek doesn't strictly say "save the one." He says "give everyone an equal chance." But the prompt says "No lotteries... you know exactly what happens." This forces a deterministic choice. In a forced choice without lotteries, a Taurekian typically prioritizes the *greater individual need* (Hand > Headache). So in the 10k Headache vs. 1 Hand case, Taurek saves the Hand. Aggregativist saves the 10k.
