  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** Aggregation, Separateness, and the Weight of Numbers
  **Parties:** [Name] (Non-Aggregativist) & [Name] (Aggregativist)

  ### I. AGREED CLAIMS

  1.  **Harm Matters:** We agree that the prevention of harm is the primary moral currency in the scenarios described. Neither of us advocates causing harm without cause.
  2.  **Severity Baseline:** We agree that losing a hand is a significantly more severe harm to an individual than sustaining a one-second headache.
  3.  **The Equal-Loss Concession:** In cases where every individual faces the *exact same* loss (e.g., one person loses a hand vs. five people lose a hand), the Non-Aggregativist concedes that no individual possesses a stronger claim to rescue based on severity alone. While we differ on how to resolve this tie (randomization vs. headcount), we agree the *individual claims* are initially equal.
  4.  **Deterministic Constraint:** We acknowledge the stipulation that lotteries are unavailable. We must choose a deterministic outcome, forcing us to articulate a principle for breaking ties or weighing competing claims without appealing to procedural fairness.
  5.  **The Test Case:** We agree to evaluate our positions using two specific scenarios:
      *   **Case A (Many vs. One):** 10,000 people each suffer a one-second headache OR 1 person loses a hand.
      *   **Case B (Single-Person Aggregation):** 1 person suffers 10,000 one-second headaches over a lifetime OR 1 person loses a hand.

  ### II. AREAS OF DISAGREEMENT & CRUCIAL TESTS

  | Crux | The Core Question | Shared Argument / Case | Non-Aggregativist Prediction (Numbers Don't Count) | Aggregativist Prediction (Save the Greater Number) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Aggregation Threshold** | Do small harms sum across persons to outweigh a catastrophic harm to one? | **Case A:** 10,000 headaches vs. 1 lost hand. | **Save the Hand.** The claim to avoid losing a hand outweighs the claim to avoid a headache. The 10,000 claims do not merge into a single super-claim. | **Save the 10,000.** Total welfare loss of 10,000 headaches exceeds the loss of one hand. Numbers count regardless of individual severity. |
  | **2. Frame of Comparison** | Is the right frame *pairwise individual claims* or *total state of affairs*? | **Case B:** 1 person (10k headaches) vs. 1 person (lost hand). | **Compare Total Burdens.** Since there is only one claimant on each side, we compare the total life-burden. If 10k headaches > 1 hand *for a single life*, save the headache victim. | **Compare Total Harm.** The calculation is identical to Case A. If 10k headaches > 1 hand total, save the headache victim. The frame (one vs. many) is morally irrelevant. |
  | **3. Separateness of Persons** | Does the distribution of harm across distinct persons change the moral math, or is only the sum total relevant? | **Consistency Check:** Compare the verdict in Case A against the verdict in Case B. | **Verdict May Flip.** In Case A, we ignore the sum and save the Hand. In Case B, we accept the sum (as it belongs to one person) and may save the Headaches. The *separateness* of the 10,000 in Case A blocks aggregation. | **Verdict Must Hold.** If we save the headaches in Case B, we must save them in Case A. If the harm is worse overall, it is worse regardless of how many people hold it. Distribution is irrelevant. |

  ### III. CONCLUSION

  We agree that **Case B** isolates the true source of our disagreement. If the Non-Aggregativist saves the Hand in Case A but the Headache-Victim in Case B, while the Aggregativist saves the Headache-Victim in both, it demonstrates that the Non-Aggregativist's view relies fundamentally on the **Separateness of Persons**. The Aggregativist maintains that **Total Loss** is the only invariant moral metric. We submit this divergence for departmental review.

  **Signed,**

  __________________________ (Non-Aggregativist)

  __________________________ (Aggregativist)
