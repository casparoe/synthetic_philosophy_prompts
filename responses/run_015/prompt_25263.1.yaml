  **Rule 2 (Functional Immunity):** Hinges are propositions where doubt is practically impossible, regardless of specificity.
  *   *Fit:* "Here is a hand" (specific) is a hinge; "The sun will rise..." (probabilistic) is not.
  *   *Prediction:* **Hinge.** Doubting wakefulness undermines all justification, functioning like "Here is a hand."

  **Best Guess:** Rule 2.
  Rule 1 fails to explain why "I have never been to the moon" is a hinge. This is a specific personal historical fact, yet she classifies it as a hinge while rejecting specific public history like Hastings. The distinction likely lies in *epistemic role* (immunity to doubt) rather than generality. Since dream skepticism targets the foundation of experience itself, it likely qualifies as a hinge under her functional criterion.

  **Test Case:** "This is a tree" (said while pointing at a clear tree).
  If **Hinge**, it confirms Rule 2 (specific perceptual certainties count). If **Not Hinge**, it supports Rule 1 (only general framework propositions count). Given her verdict on "Here is a hand," Rule 2 is stronger.
