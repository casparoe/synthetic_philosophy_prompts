answer: |-
  # The Electoral Principle Finder
  ### A Diagnostic Instrument for Civics Discussions

  **Purpose:** This instrument is designed to bypass surface-level policy debates (e.g., "Do you like Proposal X?") and reveal the underlying ethical framework participants use to judge electoral rules. It sorts participants into one of five philosophical positions based on how they resolve concrete tensions between **Membership**, **Interests**, and **Decision Quality**.

  **Instructions for Participants:** Read each scenario and select the option that *best* matches your intuition. Do not overthink; choose the argument that feels most persuasive to you.

  ---

  ## Part 1: The Scenarios

  **1. The Foundation**
  Imagine you are explaining to a visitor why we hold elections at all. What is the single most important reason?
  *   **A.** To affirm that we are all equal members of the same national community.
  *   **B.** To ensure that everyone who has to live with the laws gets a say in making them.
  *   **C.** To produce the best possible government decisions and a healthy society.

  **2. The Long-Term Resident**
  A non-citizen has lived in your town for 15 years, owns a home, pays local taxes, and sends kids to local schools. A new citizen moved in last month. Who has a stronger claim to vote in the *local* mayoral election?
  *   **A.** The new citizen. Citizenship is the only key that unlocks the ballot box.
  *   **B.** The long-term resident. They are more affected by the outcome than the newcomer.
  *   **C.** It depends on who is more engaged. If the resident is disengaged, their claim is weaker than a citizen who participates.

  **3. The Informed Teen vs. The Uninformed Adult**
  Consider a well-informed 16-year-old who follows the news and an uninformed 30-year-old who knows nothing about the candidates. Who should be allowed to vote?
  *   **A.** Only the 30-year-old. The law sets the age at 18; status matters more than individual knowledge.
  *   **B.** Both, or perhaps the 16-year-old. If the teen is affected by the laws, their interest counts regardless of age.
  *   **C.** Ideally, only the informed person. Voting should be about making a competent choice, not just breathing or aging.

  **4. The Duty to Participate**
  Voter turnout is low. Some suggest making voting mandatory, like jury duty. How do you view this?
  *   **A.** Opposed. Voting is a right of membership, not a task to be forced.
  *   **B.** Opposed. Voting is a choice based on whether you have a stake in the outcome.
  *   **C.** Supported. Voting is a civic responsibility required for the system to function well.

  **5. The Penalty**
  If voting were compulsory, what should happen to someone who refuses to vote without a valid excuse?
  *   **A.** Nothing. You cannot force someone to exercise a right.
  *   **B.** Nothing. If they don't feel affected, forcing them undermines the point.
  *   **C.** A small fine or penalty. A duty requires enforcement to be taken seriously.

  **6. The Knowledge Barrier**
  To improve the "quality" of election outcomes, a proposal suggests requiring voters to pass a basic civics test.
  *   **A.** Opposed. All members of the polity are equal, regardless of education.
  *   **B.** Opposed. Affected people shouldn't be barred from protecting their interests.
  *   **C.** Supported (or open to it). We require licenses for driving; voting impacts everyone and requires competence.

  **7. The Scope of Voting**
  Should non-citizen residents be allowed to vote in *national* elections, or only *local* ones?
  *   **A.** Neither. National voting is strictly for citizens.
  *   **B.** Local only. Their primary interests are tied to the community, not the nation.
  *   **C.** Neither, unless they become citizens. National decisions require full commitment to the state.

  **8. The Disengaged Citizen**
  A citizen has lived abroad for 20 years, pays no taxes here, and knows nothing about local issues. A non-citizen resident works here and pays taxes. Who should vote locally?
  *   **A.** The citizen. Membership never expires.
  *   **B.** The resident. Presence and impact matter more than a passport.
  *   **C.** Neither, ideally. Voters should be currently invested and informed about the community.

  ---

  ## Part 2: Scoring Key & Decision Logic

  Tally your answers (A, B, or C). Your dominant letter reveals your primary principle. Use the **Decision Tree** below to find your specific position "Leaf."

  ### The Principle Map
  *   **Mostly A:** You prioritize **Democratic Membership**. (Voting is about status/belonging).
  *   **Mostly B:** You prioritize **Affected Interests**. (Voting is about stakeholding/impact).
  *   **Mostly C:** You prioritize **System Quality**. (Voting is about competence/duty/outcomes).

  ### The Decision Tree (Finding Your Leaf)
  *Locate your dominant principle above, then answer the "Tie-Breaker" question to find your specific position.*

  #### **Branch 1: The Membership Path (Mostly A)**
  *   **Tie-Breaker:** Do you support Compulsory Voting?
      *   **No:** You are a **Strict Citizenship-Plus-Age Traditionalist**.
          *   *View:* Voting is a right of citizenship. Boundaries are clear (18+, Citizen). Enforcement undermines the voluntary nature of the right.
      *   **Yes:** You are a **Civic Duty Universalist**.
          *   *View:* Voting is a core obligation of membership. Like taxes or jury duty, it must be enforced to maintain the integrity of the community.

  #### **Branch 2: The Interest Path (Mostly B)**
  *   **Tie-Breaker:** Do you support lowering the voting age to 16?
      *   **No:** You are a **Residency-Focused Pragmatist**.
          *   *View:* You care about who is impacted, but you view age as a proxy for independent stakeholding. You may support non-citizen voting but hesitate on youth voting. *(See "Unstable Position" below).*
      *   **Yes:** You are an **Affected-Interests Expansionist**.
          *   *View:* Anybody subject to the law should have a say. This logically extends to long-term residents and younger citizens who live in the community.

  #### **Branch 3: The Quality Path (Mostly C)**
  *   **Tie-Breaker:** Do you support Voter Competence Tests (e.g., civics exams)?
      *   **No:** You are a **Participatory Maximizer**.
          *   *View:* You want high turnout and engagement (Compulsory) to ensure legitimacy, but you trust the collective wisdom without formal testing.
      *   **Yes:** You are an **Epistemic Filter Guardian**.
          *   *View:* The goal of voting is good decisions. Barriers like age or knowledge tests are acceptable if they ensure voters are capable of choosing wisely.

  ---

  ## Part 3: Incoherence & Stability Check

  In a workshop setting, use this section to highlight positions that may be logically unstable. If a participant's answers land them here, invite them to examine the tension.

  ### 1. The "Stakeholder Gap" (Unstable)
  *   **Profile:** Supports Non-Citizen Local Voting (Interest) **BUT** Opposes Lowering Voting Age (Membership/Competence).
  *   **Why it's unstable:** Both positions rely on the "Affected Interests" principle. A 16-year-old is often more affected by local school or climate policy than a transient adult non-citizen. Rejecting one while accepting the other requires an independent reason (e.g., "teens lack financial independence") that isn't captured by the core principle.
  *   **Discussion Prompt:** *"If impact is what matters, why does a 15-year resident count but a 16-year-old neighbor does not?"*

  ### 2. The "Forced Expert" (Contradictory)
  *   **Profile:** Supports Compulsory Voting (Duty) **AND** Supports Competence Tests (Epistemic).
  *   **Why it's unstable:** Compulsory voting assumes *everyone* should participate to legitimize the system. Competence tests assume *only some* should participate to improve quality. Forcing uninformed people to vote (Compulsory) and then barring them for lack of knowledge (Testing) creates a logistical and ethical contradiction.
  *   **Discussion Prompt:** *"If we force everyone to vote, can we really turn around and fail them on a test? Does duty trump competence?"*

  ### 3. The "Passport Priority" (Inconsistent)
  *   **Profile:** Supports Strict Citizenship for National Elections **BUT** Supports Affected Interests for Local Elections.
  *   **Why it's stable/unstable:** This is actually a **Hybrid View** (often called "Denizenship"). It is *not* incoherent if the participant argues that local elections are about *services* (trash, schools) while national elections are about *sovereignty*.
  *   **Discussion Prompt:** *"Is there a clear line between local services and national sovereignty, or do local decisions (like policing) impact national rights?"*

  ---

  ## Facilitator Notes: Using the Instrument

  1.  **Blind Scoring:** Have participants complete the quiz without discussing it. This prevents social desirability bias (e.g., answering based on what their "team" believes).
  2.  **Reveal the Principle, Not the Policy:** When grouping participants, do not group them by "Pro-Reform" or "Anti-Reform." Group them by **Leaf Position** (e.g., put all "Affected-Interests Expansionists" together).
  3.  **The "Talk Past Each Other" Fix:** When debate stalls, refer to the Principles.
      *   *Example:* "It sounds like the 'Membership' group is worried about national cohesion, while the 'Interest' group is worried about local fairness. You aren't disagreeing on facts; you are prioritizing different values."
  4.  **Target the Incoherence:** Use the "Incoherence Check" to gently challenge participants to refine their views. This moves the conversation from "Winning the argument" to "Refining the philosophy."

  ---

  ### Architectural Summary (For the Facilitator)
  *   **Root:** Purpose of Voting (Membership vs. Interest vs. Quality).
  *   **Branches:** How that purpose applies to Boundaries (Age/Citizenship) and Enforcement (Compulsory).
  *   **Leaves:** The 5-6 specific coherent positions derived from those combinations.
  *   **Pruning:** The Incoherence Check identifies branches that cannot logically hold weight (e.g., forcing people to vote but testing them on knowledge).
