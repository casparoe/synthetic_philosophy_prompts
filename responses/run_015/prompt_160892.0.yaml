prompt: |-
  Hey, I need help with something that came up in my study group last night and that nobody could get to the bottom of. You know the raven setup: "all ravens are black" looks like it should only be supported by going out and looking at ravens, but it's equivalent to "everything non-black is a non-raven," a white shoe is a non-black non-raven, so if instances confirm generalizations and confirmation respects logical equivalence, then noticing a white shoe is evidence about ravens. I had more or less settled on the standard shrug: yes it confirms, but by a laughably tiny amount, because non-black things hugely outnumber ravens, and our intuitions just can't feel the difference between zero and 10 to the minus twelve. Then my friend Marcus produced this and I can't find the hole in it. He says you don't need any of Hempel's fancy consequence conditions to get "everything confirms everything" — plain instance-confirmation plus equivalence does it on its own. Pick literally any claim, call it Z: say, that the Cleveland Cavaliers win the 2031 title. Now define two predicates: F(x) means "x is this particular shoe I'm holding, or Z is false," and G(x) means "x is this particular shoe I'm holding, or Z is true." I look at the shoe. It is F, and it is G, and I know both of those without having the faintest idea whether Z is true. So by Nicod's condition my observation confirms "all Fs are Gs." But "all Fs are Gs" comes out true if Z is true and false if Z is false (as long as there's at least one object in the universe besides the shoe), so it's equivalent to Z. So by equivalence, looking at my shoe is evidence that the Cavs win in 2031. Z was arbitrary. Any observation confirms anything.

  I obviously don't accept the conclusion, but I want to know exactly which step I'm rejecting and what I'm paying for it, and I'd like the options ranked by cost. Concretely: Marcus's own fix is that you just ban gerrymandered predicates like F and G, since they name a particular object and embed a whole sentence inside them — but doesn't that just push the bump in the carpet under the new riddle of induction, i.e. grue and its relatives? Is there a non-circular way to say which predicates are allowed, and does the "the shoe confirms, just negligibly" line survive whatever restriction you do impose? A second person in the group takes the relevance line: keep Nicod, drop equivalence, so the shoe confirms "all non-black things are non-ravens" while not confirming "all ravens are black." But the shoe is an instance of the contrapositive generalization too, so isn't she stuck saying that one observation confirms a sentence and does not confirm a different sentence with exactly the same truth conditions? Is that position even stable, or does it quietly collapse back into the one she was avoiding? And the Bayesian in the room says all of this is noise, confirmation is just probability-raising, and the gerrymandered hypothesis inherits whatever prior Z had, so nothing is confirmed — does that really dissolve it, or does it just relocate the whole mystery into the prior (and into whether the shoe was sampled from all of reality or from my closet)?

  For what it's worth, my own instinct is that I'd much rather keep equivalence than Nicod's condition if I have to choose — equivalence feels like the only genuinely non-negotiable principle in this neighborhood — and I'd also like to keep that a black raven is real evidence. Tell me if that instinct is the wrong way round, and tell me what someone who gives up Nicod has to do to still explain why the black raven confirms anything at all without assuming the correlation of raven colors in the prior. And if the argument is actually valid and something subtler is going on — a scope thing, an equivocation about what "the observation" is, whatever — say so plainly rather than picking a premise to sacrifice.
