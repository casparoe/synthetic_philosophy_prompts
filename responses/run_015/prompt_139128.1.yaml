answer: |-
  **Project Title:** Structural Licenses for Average-Case Reasoning in High-Stakes AI Deployment

  **1. The Research Question**

  The central tension in AI alignment safety cases is the mismatch between worst-case theoretical rhetoric and average-case empirical practice. Safety literature frequently invokes security mindsets, adversarial optimization, and worst-case guarantees, yet deployment decisions rely on benchmark performance, red-teaming failure rates, and extrapolations from finite samples. This project asks: **Under what structural conditions of a deployment setting does average-case empirical evidence suffice to bound catastrophic risk below a decision-theoretic threshold?**

  This question targets specific failure modes where the cost of error is irreversible or near-infinite, such as autonomous replication, catastrophic misuse via capability generalization, or goal misgeneralization in critical infrastructure. The answer is permitted to differ across these modes; a framework licensing average-case reasoning for medical diagnosis may not license it for autonomous nuclear command. The goal is not to prove worst-case guarantees are possible, nor to dismiss them, but to identify the precise structural features—recoverability, independence of trials, cost of sampling—that must be present to make average-case data decision-relevant. If these features are absent, the project seeks to determine whether they can be manufactured through engineering constraints or governance protocols.

  **2. Why Existing Positions Leave This Open**

  Current discourse leaves this question unresolved because opposing camps talk past each other regarding the preconditions of statistical learning. The "security mindset" camp argues that adversarial inputs invalidate i.i.d. assumptions, rendering average-case metrics meaningless for high-stakes decisions. They correctly identify that in a one-shot catastrophic scenario, expected loss is dominated by tail risk, but they often conclude that empirical data is therefore useless, leading to paralysis or purely theoretical interventions. Conversely, the empirical safety camp argues that average-case performance is all we have, proceeding with benchmarking and red-teaming without explicitly justifying why these samples should generalize to worst-case deployment conditions. They rely on an implicit optimism that the deployment distribution resembles the test distribution.

  Neither position addresses the structural bridge between them. The security argument assumes the deployment setting is inherently one-shot and irreversible, while the empirical argument assumes the setting allows for learning from mistakes. Neither analyzes whether the setting itself can be modified to satisfy the conditions required for statistical evidence to carry weight. Without a formal account of which structural features license average-case reasoning, safety cases remain vulnerable to the critique that they are measuring the wrong quantity, while theoretical warnings remain vulnerable to the critique that they offer no path to actionable deployment standards. This project fills that gap by treating the deployment environment not as a fixed constraint, but as a variable that can be engineered to support valid inference.

  **3. Methodology**

  This is a one-year, solo fellowship project combining conceptual analysis, formal modeling, and case study application. The work proceeds in four phases.

  **Months 1–3: Conceptual Mapping and Decision Theory.** I will formalize the decision-theoretic gap. This involves defining the "structural license" required to move from observed failure rates to deployment approval. I will model the deployment decision as a choice under uncertainty where the utility function includes irreversible catastrophic loss. The output will be a set of necessary conditions (e.g., bounded recovery cost, trial independence) under which empirical sampling reduces uncertainty sufficiently to justify action. This is preferred over pure conceptual analysis because it grounds the philosophy in decision-theoretic formalism required by ML reviewers.

  **Months 4–6: Structural Modeling.** I will model specific structural features as variables in the safety equation. Key variables include "recoverability" (cost to revert state after error), "observability" (ability to detect failure before catastrophe), and "trial independence" (whether one failure predicts others). I will explore how engineering interventions—such as staged autonomy, sandboxing, or tripwires—modify these variables. This approach is chosen over straight empirical study because current data cannot settle the question; we lack deployment data for catastrophic failures. We must model the conditions under which hypothetical data would be sufficient.

  **Months 7–9: Case Study Application.** I will apply the framework to three distinct deployment scenarios: autonomous coding agents, medical diagnostic assistants, and critical infrastructure control. For each, I will assess whether the current standard practice satisfies the structural conditions derived in Phase 2. Where conditions are not met, I will propose specific governance or engineering modifications (e.g., mandatory human-in-the-loop for specific classes of actions) that would restore the license for average-case reasoning. This validates the framework against concrete examples rather than remaining abstract.

  **Months 10–12: Synthesis and Protocol Design.** The final phase integrates the models and case studies into a usable deliverable. I will draft a "Structural Safety Checklist" for governance bodies. This document will allow auditors to assess whether a lab's evals justify deployment based on the structural properties of the deployment environment, not just the model's performance. I will refine this through feedback from the mentoring committee, ensuring it meets the needs of both technical safety teams and policy regulators.

  **4. Deliverables and Failure Conditions**

  The primary deliverable is a **Deployment Licensing Framework**, a concrete document designed for use by lab safety boards or government auditors. It will not merely argue a point but provide a checklist: "If your deployment environment lacks feature X, your average-case evals do not justify deployment regardless of pass rate." This moves the output beyond a journal article into a tool for actual safety cases. A secondary deliverable is a working paper formalizing the decision-theoretic bounds of recoverable trials.

  The project fails if it produces only a negative result (i.e., proving that no structural features can ever license average-case reasoning in high-stakes settings) without offering actionable alternatives. It also fails if the framework is too abstract to be applied by safety engineers—for example, if it requires quantifying variables that are impossible to measure in practice. Success requires a positive existence proof: showing that there *are* engineered settings where average-case evidence is sufficient, and specifying exactly how to build them.

  **5. Scope and Empirical Dependencies**

  This scope is aggressive for a one-year solo project. To ensure completion, I will cut the attempt to derive rigorous probabilistic bounds on tail risk. Instead, I will focus on qualitative or semi-formal conditions that signal when such bounds are possible. Rigorous proof of safety bounds is a multi-year endeavor; this project aims to establish the *conditions* under which such proofs would be valid.

  There are empirical dependencies I cannot settle from the armchair. Specifically, the cost of recovery in specific domains (e.g., can a cyber-attack be truly reversed?) and the degree of independence between failure modes in modern architectures are empirical claims. I will flag these explicitly in the final framework as assumptions requiring domain-specific validation. I will not attempt to measure these myself but will structure the framework so that users must supply these values. If these empirical claims turn out to be uniformly pessimistic (e.g., recovery is never possible in critical infrastructure), the framework will still succeed by demonstrating *why* deployment is unjustified, though this would limit the positive licensing outcome.

  **Sharpened Question**

  What specific structural properties of a deployment environment are necessary and sufficient to license average-case empirical evidence for safety decisions involving irreversible catastrophic risk?

  \answer{TRACTABLE ONLY IF NARROWED}
