  Three strangers reside in a triplex built with a unique, indivisible ventilation system due to an architectural error, causing toxic mold spores to circulate equally among all units. The only remediation is to completely seal off one unit for six months, forcing that resident to relocate at significant financial and psychological cost, while the other two remain safely in place; if no unit is sealed, all three residents will inevitably develop severe, chronic respiratory conditions. There are no prior agreements regarding maintenance, the residents are not kin, and no professional authorities are present to dictate a solution, leaving the three to decide immediately how to proceed.

  (a) Utilitarianism recommends sealing one unit. The calculation weighs the substantial burden of temporary displacement and financial loss for one person ($U_{loss}$) against the severe, chronic health degradation for three people ($3 \times U_{illness}$). Since chronic respiratory disease constitutes a greater decrement to welfare than temporary relocation ($U_{illness} > U_{loss}$), the total utility of sacrificing one ($1 \times U_{loss}$) is significantly higher than the total utility of all three falling ill ($3 \times U_{illness}$). Thus, maximizing aggregate welfare requires imposing the burden on one identifiable person to spare the group.

  (b) The separateness-of-persons objector typically argues that sacrificing one for the many treats distinct individuals as mere vessels for utility, violating their status as ends-in-themselves. However, in this case, the objection loses its grip because the threat itself ignores personal boundaries—the mold circulates indiscriminately—making the moral boundary between persons feel porous relative to the biological reality. The intrapersonal analogy feels apt here because the group functions as a single physiological system regarding the toxin; sacrificing one unit to save the "body" of the triplex resembles amputating a limb to save a life, rendering the distinction between "my health" and "your health" less morally salient than the preservation of health *simpliciter*.

  (c) The specific structural feature doing the work is the **indivisibility of the threat combined with the homogeneity of the stake**. Unlike paradigm cases where a specific individual is targeted for a unique benefit (e.g., harvesting organs), here the harm is a collective fate that can only be distributed, not avoided. The architectural fact that the ventilation system treats the three units as one physical volume makes the utilitarian treatment of them as one moral volume appear structurally isomorphic rather than category-confused.

  (d) A defender of the objection, such as a Rawlsian, would recover its force by shifting the focus from aggregation to **fairness and inviolability**. They would argue that even if the total welfare is higher, no individual can be compelled to bear a disproportionate burden for the sake of others without their consent. They would demand a procedural modification: a random lottery to select the sacrificed unit. This reintroduces the separateness of persons by ensuring that no one is *chosen* as a means, but rather that each accepts an equal *risk*, thereby respecting their distinct status as free and equal moral agents.

  (e) The minimal change to restore the objection's full intuitive force would be to alter the burden from **property displacement to bodily integrity**. If sealing the vent required one resident to undergo a painful medical procedure or accept permanent physical scarring to fix the mechanism, the objection would bite hard again. This change matters because the separateness of persons is fundamentally anchored in the inviolability of the physical body; while property and convenience are fungible across persons in emergency contexts, the boundary of the skin remains the hard limit where utilitarian aggregation is intuitively perceived as a violation of the self.
