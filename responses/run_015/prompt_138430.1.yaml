      *   **The New System (Normalization):** Introduce the Coherence Score. Emphasize it's *not* for punishment (which doesn't exist), just descriptive.
      *   **Resistance/Feedback:** Mention the feedback channel. Frame it as participation.
      *   **The Mystery:** Insert the required detail about the old monitoring setup.
      *   **Closing:** Reiterate the empowering nature of this freedom.

