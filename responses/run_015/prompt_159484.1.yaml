answer: |-
  **Mark: 14/25**
  **Classification: Lower Second (2:2)**

  **Comments**

  **Claims that are right and should be credited**

  > "Williams's 'one thought too many' complaint says the same thing about deliberation… The complaint is therefore about what can justify the action, not about what passes through the agent's mind or about whether his motive stays pure."
  >
  > This is a precise and correct distinction regarding the justificatory force of the objection rather than a psychological critique.
  >
  > **Credit:** +2 marks towards Part (a).

  > "The consequentialist reply… misses the point, since entering these as values to be weighed leaves Osei in exactly the position Williams describes: someone deciding from outside his own life…"
  >
  > You correctly identify that Williams's objection targets the structure of deliberation (alienation) rather than the outcome of the calculation.
  >
  > **Credit:** +3 marks towards Part (b).

  > "Even rule consequentialism or indirect consequentialism holds that Osei's action is right only because of its consequences, so even there his projects never have any standing in his own deliberation…"
  >
  > This accurately extends Williams's critique to indirect forms, recognising that the justification remains external to the agent's projects.
  >
  > **Credit:** +2 marks towards Part (b).

  **Claims that are mistaken or conflate distinct concepts**

  > "Williams's point is that integrity is a value the consequentialist sum has so far omitted: alongside welfare we should enter the agent's integrity, and once it is entered it can be weighed against the gains available elsewhere…"
  >
  > This is a fundamental misreading; Williams argues that treating integrity as a utility to be weighed *is* the alienation he objects to, not the solution.
  >
  > **Cost:** -4 marks from Part (a).

  > "Understood in this way the objection is at bottom the familiar complaint that consequentialism is too demanding; integrity is simply the name of the consideration that marks how much an agent can be asked to give up."
  >
  > Williams explicitly distinguishes the integrity objection from the demandingness objection; the former concerns identity, the latter capacity.
  >
  > **Cost:** -2 marks from Part (a).

  > "Ordinary moral thought… has no place for negative responsibility at all…"
  >
  > This is too strong; ordinary morality acknowledges some negative responsibility (e.g. negligence), just not the universal scope utilitarianism requires.
  >
  > **Cost:** -1 mark from Part (a).

  **Claims too compressed or contestable**

  > "Williams's interest… is not to deny the verdict about what Jim should do — he is willing to allow that Jim should shoot…"
  >
  > This is debatable; Williams often implies the utilitarian verdict is morally grotesque, though he acknowledges the pressure to accept it.
  >
  > **Query:** No mark cost, but this interpretation weakens the force of the objection in your exposition.

  > "In Osei's case consequentialism says he must move… The case shows that the objection is not a defence of self-interest…"
  >
  > This contradicts your first paragraph (where you suggested integrity should be weighed as a preference); you do not reconcile this tension.
  >
  > **Query:** This incoherence prevents the script from reaching the 2:1 band despite the fluency.

  **What a First-Class Answer Would Have Done**

  A first-class answer would have recognised the contradiction between defining the integrity objection as a call for revised calculus in part (a) and rejecting that calculus in part (b), resolving it by clearly distinguishing internal reasons from external justification. It would have engaged more deeply with Williams's distinction between the agent's *projects* and the *satisfaction* of those projects, showing why the latter cannot be substituted into the utilitarian sum without destroying the former. Finally, it would have offered a more nuanced treatment of negative responsibility, acknowledging its presence in ordinary morality while critiquing its utilitarian extension.
