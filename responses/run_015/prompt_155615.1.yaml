answer: |-
  Right, let's strip this back to the bare metal. You're right to be suspicious of your friend's manoeuvre; it feels like shifting the deckchairs, and mathematically, it is. The core issue isn't the specific numbers (1 and 0, or 1/3 and 1/6); it's about *what variables the probability depends on*.

  Here is the breakdown you asked for, reasoned out from scratch.

  ### 1. The Friend's Function $f$ and the Die

  Let's run your friend's proposal through the die example properly.
  The thesis is: for any credence function $P$, $P(A \to C) = f(P(C|A))$, where $f$ is some fixed, strictly increasing function (like $x^2$).

  Take $C$ = 'roll is six'. $P(C) = 1/6$.
  Take $A_1$ = 'roll is even' ({2, 4, 6}). $P(C|A_1) = 1/3$.
  Take $A_2$ = 'roll is two or six' ({2, 6}). $P(C|A_2) = 1/2$.

  According to your friend's thesis:
  1.  $P(A_1 \to C) = f(1/3)$
  2.  $P(A_2 \to C) = f(1/2)$
  Since $f$ is strictly increasing, $f(1/2) > f(1/3)$. So the conditional with antecedent $A_2$ must be more probable than the one with $A_1$.

  Now, let's expand $P(A \to C)$ using the Law of Total Probability, partitioning by whether $C$ is true or false. This works for any proposition that has a truth value.
  $$P(A \to C) = P(A \to C | C)P(C) + P(A \to C | \neg C)P(\neg C)$$

  Here is the crucial step your friend cannot escape: we must apply the thesis *again* to the conditionalised credence functions. If the thesis is a general rule about how conditionals work, it must hold for your updated beliefs after learning $C$, not just your current ones.
  *   In the world where $C$ is true, the conditional probability $P(C | A \land C)$ is 1. So, $P(A \to C | C) = f(1)$.
  *   In the world where $C$ is false, the conditional probability $P(C | A \land \neg C)$ is 0. So, $P(A \to C | \neg C) = f(0)$.

  Substitute these back into the Total Probability equation:
  $$P(A \to C) = f(1) \cdot P(C) + f(0) \cdot P(\neg C)$$

  Look closely at the right-hand side. It contains $P(C)$, $f(1)$, and $f(0)$. **It does not contain $A$.**
  This means that according to this equation, the probability of 'If $A$ then $C$' depends *only* on the probability of $C$. It does not matter what $A$ is.

  So, for our die:
  $$P(A_1 \to C) = f(1)(1/6) + f(0)(5/6)$$
  $$P(A_2 \to C) = f(1)(1/6) + f(0)(5/6)$$
  The right-hand sides are identical. Therefore, $P(A_1 \to C)$ must equal $P(A_2 \to C)$.

  But earlier, the thesis told us $P(A_1 \to C) = f(1/3)$ and $P(A_2 \to C) = f(1/2)$. Since $f$ is strictly increasing, these cannot be equal.
  **Contradiction.**

  **Is it survivable?**
  No. The only way to avoid the contradiction is if $P(C|A)$ *also* doesn't depend on $A$. That is, $P(C|A)$ must equal $P(C)$ for all $A$. This is the definition of probabilistic independence.
  So, your friend's move doesn't save the thesis; it merely rescales the triviality. It still forces the conclusion that learning $A$ can never change your mind about $C$. Evidence becomes impossible. The function $f$ is irrelevant because the collapse happens due to the *structure* of the Total Probability expansion, which strips $A$ out of the equation entirely.

  ### 2. Which Premise Does the Work?

  You asked for a gut-level feel for which cog turns the wheel. There are four moving parts:

  1.  **Propositionality:** The assumption that 'If $A$ then $C$' expresses a proposition that is either true or false in a possible world.
      *   *Work done:* This allows us to put the conditional inside the probability function $P(\dots)$ and, crucially, to conditionalise on $C$ (i.e., write $P(A \to C | C)$). If conditionals aren't the sort of thing that can be true or false, $P(A \to C | C)$ is meaningless.
  2.  **The Thesis Stability:** The assumption that the link between the conditional and the conditional probability holds for *any* credence function, including those updated by new information ($P_C$).
      *   *Work done:* This allows us to replace $P(A \to C | C)$ with $f(1)$. If the thesis only applied to your *initial* beliefs, we couldn't make that substitution, and the proof stops.
  3.  **The Law of Total Probability:** $P(X) = P(X|Y)P(Y) + P(X|\neg Y)P(\neg Y)$.
      *   *Work done:* This is the engine that separates the world into $C$-worlds and $\neg C$-worlds. It forces the probability of the conditional to be a weighted average of its probability in those two scenarios.
  4.  **Positivity Conditions:** The requirement that $P(A \land C) > 0$ and $P(A \land \neg C) > 0$.
      *   *Work done:* This ensures the conditional probabilities are defined. You noted cases like "If it's a six, it's even" escape the proof. You are correct. If $A$ entails $C$, then $P(C|A) = 1$, and the contradiction doesn't arise for *that specific pair*. But the triviality result says the thesis cannot hold for *all* pairs in a rich enough language. As long as there exists *some* $A$ that is compatible with both $C$ and $\neg C$, the collapse spreads to the whole system.

  **The Gut Check:** The real villain is the combination of (1) and (2). By treating the conditional as a proposition (1) that obeys the probability rules when we update on $C$ (2), we force the conditional to behave like a fact about the world. But 'If $A$ then $C$' isn't a fact that is made true simply because $C$ is true; it's a constraint on how we move from $A$ to $C$. The math treats it as a static object, but the intuition treats it as a dynamic rule.

  ### 3. The Second Escape: Denying $P(A \to C | C) = 1$

  Your friend's second move is to say: "Even if $C$ is true, 'If $A$ then $C$' might not be certain." In our notation, this means denying that $f(1) = 1$. Perhaps $f(1) = 0.9$.

  Does this help? **No.**
  Look back at the equation we derived in section 1:
  $$P(A \to C) = P(C)[f(1) - f(0)] + f(0)$$
  The right-hand side depends on $P(C)$, $f(1)$, and $f(0)$. None of these depend on $A$.
  Even if $f(1) = 0.9$ and $f(0) = 0.1$, the right-hand side is still constant for any fixed $C$, regardless of what $A$ you choose.
  The left-hand side, $f(P(C|A))$, *does* depend on $A$ (because $P(C|A)$ changes as $A$ changes).

  So you still have a variable LHS equal to a constant RHS.
  The step where $P(A \to C | C)$ is set to $f(1)$ comes from applying the thesis to the conditionalised credence. It does *not* assume $f(1)=1$. It only assumes that once you are certain of $C$, the conditional probability $P(C|A)$ becomes 1, so the probability of the conditional becomes whatever $f$ maps 1 to.
  As long as $f$ is a fixed function, the collapse holds. Denying that a true consequent guarantees the conditional just changes the coefficients of the triviality; it doesn't remove the independence constraint.

  ### 4. What to Give Up and the Cost

  So, where do we cut the knot?

  **The Recommendation:** Give up **Propositionality**.
  Deny that indicative conditionals express truth-conditional propositions. They do not name a state of affairs that obtains or fails to obtain in a world. Consequently, they do not have unconditional probabilities in the standard sense, and you cannot conditionalise on them (nor can they be the input to $P(\dots | C)$ in the standard way).

  **The Cost:**
  1.  **Embedding:** You lose the ability to treat conditionals as standard facts in complex sentences. You can't easily make sense of "If (if $A$ then $B$) then $C$" or "Either (if $A$ then $B$) or (if $D$ then $E$)". Logic becomes much trickier because conditionals aren't truth-apt.
  2.  **Disagreement:** If conditionals aren't true or false, in what sense do we disagree about them? You have to explain disagreement as a clash of constraints on credence, rather than a clash about the facts.
  3.  **Knowledge:** You cannot strictly *know* a conditional, because there is no fact to know. You can only have a justified high degree of belief.

  **Why this is the best cost:**
  It preserves the intuition that $P(\text{if } A \text{ then } C) = P(C|A)$ (Adams' Thesis) without the collapse. If the conditional isn't a proposition, Lewis's proof doesn't get off the ground because step (1) above fails: $P(A \to C)$ isn't a standard probability of a truth, so the Law of Total Probability doesn't apply to it in the same way. It treats the conditional as a distinct kind of linguistic object—a rule for updating—rather than a description of the world. This matches the "gut feel" that conditionals are about inference, not inventory.

  ### 5. The One-Sentence Moral

  The result is called triviality rather than contradiction because it demonstrates that accepting conditionals as truth-conditional propositions forces probability theory to collapse into a state where nothing is evidence for anything, rendering the concept of learning incoherent.
