      *   *Check:* Is the tone appropriate? Yes, keep it rigorous.
      *   *Nuance:* Make sure to distinguish between *unconditional* independence and *conditional* independence (given the state of the world). This is a common technical pitfall. Voters can be correlated due to common causes, but CJT requires conditional independence.
      *   *References:* Mention Boland (1989), Ladha (1992), Estlund (1994), List & Goodin (2001).
      *   *Key Insight:* The theorem is often more useful for showing *when* majority rule fails than when it succeeds.

  8.  **Final Review against User Prompt:**
