answer: |-
  Rotting? Yes. Everything rots. But paper rots honest. It swells when the air is wet and shrinks when it's dry. It tells you about the room it lived in. Your machine... it swallows the ink and spits out a ghost. Smooth. Clean. Dead.

  You say it parsed the records in six hours. Did it parse the weight of the stack? Did it notice that the tax ledgers from '54 are tied with twine, but the ones from '55 are clipped? There's a reason for that. Someone stopped clipping. Maybe the clips rusted. Maybe the man who clipped them died. Your machine sees "tax record." It doesn't see the break in the habit.

  You think the threat was losing the numbers. It wasn't. The threat was thinking the numbers were enough. These boxes... they slow you down. They make you touch the past before you change it. That friction? That's the argument. It's arguing against the idea that you can know everything without effort. If you burn them, you erase the proof that effort mattered. You erase the warning against the error of believing efficiency equals truth. And there are other errors, girl. Mistakes we haven't even made yet, let alone named. This clutter is the vaccine.

  You say the threat is solved. I say you've just paved over the warning signs because you couldn't read the writing. When the machine fails—and it will, because everything built by hands breaks—you won't have the paper to catch you. You'll just have a blank screen and a memory of a promise that the scan was perfect. Who signed off on that promise? Did the machine sign?

  Tell me this: who taught your ghost in the wire what to tag? You? You're thirty years old. What do you know about the weight of a ledger in 1920? What do you know about the fear that made a clerk write in the margin instead of the line? You tagged it "note." But was it a note? Or was it a plea?

  Keep the fence, girl. Not because the wolves are coming. But because you've forgotten what happens when you think they aren't.
