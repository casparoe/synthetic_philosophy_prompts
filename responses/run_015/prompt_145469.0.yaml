  We sieve the static from the signal wire,
  And prune the branches where the errors grow.
  Each false step quenched like embers in the fire,
  We map the distance that we think we know.
  The noise recedes, a tide that pulls away,
  Leaving a shore that looks like solid ground.
  We measure progress by the light of day,
  Where truth's coordinates are safely found.

  But zero shifts beneath all we think we know,
  Though vacuum fluctuations spark like fire;
  They press the void yet make no value grow,
  But move no needle on the frozen wire.
  Reorder space, no truth is safely found,
  When metrics slide beneath the weight of day.
