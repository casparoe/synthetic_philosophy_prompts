          *   *Text Check:* Aquinas argues that sedition is contrary to the unity of the multitude directed to the common good. A tyrannical regime is not directed to the common good but the private good of the ruler. Therefore, disturbing it does not strictly fit the definition of sedition *against the common good*. Aquinas does say the tyrant fosters discord.
          *   *Verdict:* Generally accurate interpretation of the "no sedition" claim.
      *   *Part (b) Limitation:* The student claims the limitation is "inordinately" (greater harm than tyranny).
          *   *Text Check:* Aquinas says, "if the tyranny is not excessive, it is better to bear it for a time than to risk greater harms by acting against it." (Sed si tyrannus non multa excedat, tolerandum est aliquantisper... ne in maiora mala incidat).
          *   *Verdict:* Accurate.
      *   *Part (c) Private Tyrannicide:* The student claims Aquinas *licenses private tyrannicide* ("any subject who kills the tyrant... acts lawfully. There is no requirement that the killing be carried out by public authority").
          *   *Text Check:* This is the critical error. In the *Reply to Objection 3* of the same article (II-II, q. 42, a. 2, ad 3), Aquinas explicitly addresses tyrannicide. He states that to kill a tyrant is *not* meritorious unless done by public authority. He references the Old Testament (Ehud) but clarifies that private individuals do not have the authority to execute judgment. Furthermore, in *De Regno* (On Kingship), he is even clearer, but sticking strictly to *Summa* II-II, q. 42, a. 2: Aquinas distinguishes between "disturbing" a regime and killing the ruler. While he says disturbing a tyranny isn't sedition, he does *not* grant a license for private assassination. In fact, in the *Sed Contra* and *Respondeo*, he emphasizes order. But the smoking gun is usually found in his broader treatment or the specific distinction that *deposing* might be possible by public authority, but *killing* by a private hand is generally condemned as usurping judgment.
          *   *Correction:* Actually, looking strictly at II-II, q. 42, a. 2: Aquinas says disturbing a tyranny is not sedition. However, does he license *private* killing here? No. He argues that if there is a right to depose, it must be exercised by those who have the right to appoint the ruler (public authority), not private presumption.
