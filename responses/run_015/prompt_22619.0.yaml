      *   *Actionable Feedback:* Re-read the *Respondeo* and *Ad 3*. Distinguish between "disturbing a regime" (which might be a public act) and "private assassination." Consult secondary literature on Aquinas and tyrannicide (e.g., Skinner, or standard commentaries).

