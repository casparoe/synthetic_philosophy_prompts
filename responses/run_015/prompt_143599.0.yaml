  From Dennett's perspective, this fungal network possesses original intentionality because the content of its chemical signals is fixed by the history of natural selection acting upon the lineage, much like the evolutionary history of the Two-Bitser fixes the meaning of its states. For Dennett, intentionality is not a matter of magical inner glow but of functional role secured over time, so the fact that the network signals danger because ancestors who did so survived is sufficient to ground real aboutness. Searle, however, would argue that despite the biological substrate and the evolutionary history, there is still no subjective understanding or first-person experience present in the chemical exchanges. For Searle, the exact feature doing the work is consciousness itself, meaning that without a subjective point of view, the fungal signaling remains merely causal chemistry where any apparent meaning is derived from the observer interpreting the system rather than intrinsic to the system.

