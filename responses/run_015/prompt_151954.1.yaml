      *   **Topic:** G. E. Moore's *Principia Ethica*, specifically the status of friendship and aesthetic appreciation as intrinsic goods.
      *   **The Dispute:**
          *   *Friend's View:* Friendship is genuinely relational (dyadic). If value depends on reciprocal mental states, Moore smuggles in a relational good, violating his atomistic ontology of value (where value attaches to individual states of consciousness).
          *   *User's View:* Friendship is an "organic whole." Each party's mental state is modified by the relation, but the non-natural property (goodness) still attaches to individual (though structurally complex) mental states. This preserves Moore's framework.
          *   *Common Ground:* Both accept Moore's non-naturalism (goodness is simple/unanalyzable), both agree on the textual evidence (affection + aesthetics = ideal), both agree Moore rejects naturalism.
          *   *The Stalemate:* Is the disagreement verbal (definition of "relational"), substantive (can non-natural properties have relational conditions?), or formal (how organic unities apply to intersubjectivity)?
      *   **The Goal:** Provide a diagnosis of the disagreement, propose a distinction or conceptual test to move them forward, and assess the likelihood of progress.

  2.  **Deconstruct Moore's Philosophy (Mental Sandbox):**
      *   *Ontology of Value:* For Moore, "good" is a simple, non-natural property. It attaches to *wholes*.
      *   *Atomism vs. Organic Unities:* Moore is often read as an atomist about value bearers (states of consciousness), *but* he explicitly introduces the "Principle of Organic Unities" (POU). The value of a whole is not necessarily the sum of the values of its parts.
      *   *Friendship in PE:* Moore discusses "the pleasures of human intercourse" and "the appreciation of beautiful objects." He calls these the greatest goods. He emphasizes the *consciousness* of the relation.
      *   *The Crux:* Does the value attach to *my state of loving you* (monadic, even if intentional) or *the fact that we love each other* (relational/dyadic)?
      *   *Friend's Objection:* If my state is only good *because* you love me back, the value condition is external/relational.
      *   *User's Counter:* The state itself changes quality when you love me back. It's a different *kind* of state (organic unity), so the value still attaches to the state.

  3.  **Diagnose the Disagreement:**
      *   Is it verbal? Partly. They are fighting over what counts as "relational."
      *   Is it substantive? Yes. It's about the *supervenience base* of goodness. Does goodness supervene on monadic properties of minds or on relational facts?
      *   Is it formal? Yes. It's about the scope of the Principle of Organic Unities. Can an organic whole span two distinct subjects?
      *   *Key Insight:* Moore's ontology is fundamentally *mentalistic*. Value resides in states of consciousness. The question is whether a "state of consciousness" can essentially include a relation to another mind *as a constituent* without making the value bearer the relation itself.
      *   *The Hidden Issue:* The "Identity of Indiscernibles" for mental states. If my mental state is qualitatively identical in isolation vs. in reciprocity, but the value changes, then value depends on the relation (Friend wins). If my mental state is qualitatively *different* in reciprocity (e.g., security, joy of being loved), then value depends on the modified state (User wins).

  4.  **Formulate a Conceptual Test:**
      *   We need to isolate whether the *value* shifts based on the external fact or the internal phenomenology.
      *   *Test:* The "Deceptive Reciprocity" Case (or "The Perfect Simulation").
      *   *Scenario:* I love you. You don't love me, but an evil demon makes it *seem* exactly as if you do. My mental state is phenomenologically identical to the reciprocal case.
      *   *Moore's Verdict:* Would Moore say the value is the same?
          *   If Yes: Value attaches to the monadic phenomenological state (User wins).
          *   If No: Value attaches to the fact of reciprocity (Friend wins).
      *   *Textual Check:* Moore emphasizes *consciousness* of the object. He cares about the *appreciation*. He is less concerned with the *truth* of the object's existence (though he does distinguish true belief from false belief as having different value).
      *   *Refinement:* Moore distinguishes between the *object* of consciousness and the *consciousness* itself. In *PE* §113, he discusses "the pleasure of sympathy." He says the whole includes "the consciousness of the other person's state."
      *   *The Real Test:* The "Isolation Test" (Moore's own method). Imagine the universe containing only *your* love. Now imagine the universe containing *mutual* love. Is the value of the mutual case exactly 2x the single case?
          *   If > 2x: Organic Unity is at play.
          *   But does the unity span subjects? Moore usually treats wholes as states of *a* mind. Can a whole be *inter*-mental?

