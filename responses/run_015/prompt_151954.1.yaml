          *   If Moore values the *truth* of the reciprocity, the Friend is right (value depends on external relation).
          *   If Moore values the *conscious experience* of reciprocity, the User is right (value depends on internal complex state).
      *   **Textual Evidence:** Moore cares about *consciousness of* the other. He distinguishes between the existence of the beautiful object and the appreciation of it. He tends to favor the appreciation. However, he also values *true* belief over false belief.
