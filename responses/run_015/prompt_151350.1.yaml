paper and draft the decision memo specifying the conditions under which intent alignment remains a separable, tractable goal. Define success as identifying at least one class of specification ambiguity resolvable through non-value-laden interpretive rules, thereby carving out genuine work for narrow alignment; define failure as showing that all meaningful ambiguity resolution necessarily invokes value judgments, which would render the narrow definition empty or reducible to value alignment. Keep the scope realistic: purely conceptual, no empirical data collection, no bibliography or citation list required (references to be added separately), and honest about the risk that the project may turn out to be too ambitious for four months if the legal-interpretation analogy fails to map cleanly onto formal specification languages.
