  Director Chen convened the board. The lead engineer resigned; Component X shipments stalled. Competitors slashed prices; finance announced a budget freeze. Pilot feedback was mixed. Chen argued the engineering gap was bridgeable if finance waited. The board disagreed; the budget freeze coincided with the price war, making risk untenable. They cancelled the project. Chen noted afterward that without the freeze, they would have ridden out the supply delay. The vote was narrow; one absent member usually sided with Chen.

  **Account S**
  The project terminated. Component X shipments stalled. Competitors slashed prices. Finance announced a budget freeze. Pilot feedback was mixed. The lead engineer resigned. Supply costs met frozen budgets. Margins met competitor lows. Delays met staffing gaps. These conditions aligned. The project terminated.

  ***

  **(a) Design Checks**
  **Blind-reader check:** A reader stopping Account N before "They cancelled" faces a live debate (Chen vs. Board) with no structural cue favoring either side; prediction remains near the 50/50 baseline. A reader stopping Account S before the final sentence encounters a completed list of colliding constraints ("met"); the structure implies the sum is already determined, pushing prediction toward certainty.
  **Substitution check:** If the project had launched successfully, Account N requires rewriting only the final three sentences (the vote and Chen's note); the causal story (the five factors) remains unchanged, merely reweighted by the agents' choice. Account S requires rewriting the synthesis sentences ("met" becomes "absorbed") and the outcome; the causal story collapses because the factors are presented as mutually exclusive constraints rather than manageable variables.

  **(b) Thesis Predictions**
  The **Inverse-Transparency Thesis** predicts Account N (high agent reasoning visibility) will exhibit higher hindsight bias (retrospective inevitability) than Account S. The **Intelligibility View** predicts Account N will exhibit lower hindsight bias because exhibiting reasons forces adherence to ex-ante knowledge.
  **Verdict:** The case bears out the **Intelligibility View**. Account N makes reasoning visible (Chen's argument) yet maintains low retrospective inevitability (narrow vote, counterfactual). Account S obscures reasoning (factors act on each other) yet generates high retrospective inevitability (structural alignment).

  **(c) The Single Feature**
  The feature is **Explicit Contingency Markers** (e.g., "without the freeze," "vote was narrow").
  If removed from Account N, the account collapses to: "Chen argued... The board disagreed... They cancelled." This restores the usual alignment: high narrative closure now implies the Board's reasoning was correct ex-ante, raising retrospective inevitability. Account S lacks this feature; adding it would break its structural determinism.

  **(d) Strongest Attack**
  A proponent of the Inverse-Transparency Thesis would argue that the counterfactuals in Account N ("without the freeze...") are themselves artifacts of hindsight. The reader only knows the freeze was the decisive variable because the project *failed*. Thus, the "contingency" is simulated; the author has used outcome knowledge to select which contingency to highlight, smuggling inevitability back in through the selection of the turning point.

  **(e) Construction Note**
  My construction likely cheats in Account S via the verb "met." While not "inevitably," it implies collision and failure lexically rather than purely structurally. A better-designed case would use purely nominal conjunctions ("Supply costs plus frozen budgets") to force the reader to infer the collision, ensuring the inevitability arises solely from the accumulation order rather than verb choice.

  \answer{separation holds: Explicit Contingency Markers}
