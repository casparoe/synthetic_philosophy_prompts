answer: |-
  **Root:** You accept rational credence ought to track objective chance.

  **The Nine Nodes**
  1.  **Determinism:** Can laws be deterministic while chances are non-trivial (not 0 or 1)?
  2.  **Supervenience:** Do chance facts depend entirely on the actual pattern of events across all time?
  3.  **Rain:** Today's chance of Thursday rain is 0.3. You know tomorrow's chance will be 0.9. Is your credence today 0.3?
  4.  **Undermining:** Current chance of Heads is 0.5. You know future frequency will be 90% Heads. Do you keep credence at 0.5?
  5.  **Laundering:** Phone shows current objective chance that coin *has landed* Heads is 0.99. Do you believe Heads is 0.99?
  6.  **Admissibility:** Is there any evidence you possess that you must ignore to match credence to chance?
  7.  **Uncertainty:** Chance is 0.2 or 0.8 (equal likelihood). Is credence 0.5?
  8.  **Direction of Fit:** Is chance defined by the deference rule, or does the rule hold because of what chance is?
  9.  **Existence:** If previous answers conflict, do chance facts exist at all?

  **Logical Space and Empty Cells**
  There are 512 answer-combinations. Most are empty.
  *   **Incoherent:** Yes Determinism + No Supervenience. If laws fix the future, chances supervene on laws plus history; denying supervenience here contradicts the determinism claim.
  *   **Unattractive:** Yes Admissibility + No Undermining (Keep 0.5). If you restrict evidence to save the principle, you must explain why future frequency evidence is forbidden without making the restriction look like a patch.
  *   **Neglected:** No Existence + Yes Determinism. Few argue chance facts vanish only in deterministic worlds while remaining in indeterministic ones; usually skepticism is global.

  **Positions and Leaves**
  *   **Original Principle (Admissibility):** No Det, Yes Supervenience, Yes Rain (0.3), Yes Undermining (Keep 0.5), Yes Admissibility. *Awkward:* The admissibility clause feels gerrymandered to stop the principle from exploding.
  *   **Humean Best-System:** No Det, Yes Supervenience, Yes Undermining (Keep 0.5), Yes Admissibility. *Awkward:* Chances depend on future events that haven't happened yet.
  *   **No-Admissibility Expert:** Yes Rain (0.3), No Admissibility, Yes Undermining (Keep 0.5). *Awkward:* Must explain why future frequency evidence doesn't count as admissible without a clause.
  *   **Propensity:** No Supervenience, No Det, No Admissibility. *Awkward:* Propensities are metaphysically mysterious and unobservable powers.
  *   **Deterministic Chance:** Yes Determinism, Yes Non-trivial Chance. *Awkward:* Requires redefining 'chance' to fit deterministic roles without changing the word's meaning.
  *   **Cosmological:** Yes Rain (Conditionalize on all), No Admissibility. *Awkward:* Requires knowing the initial chance function of the universe to calculate current credence.
  *   **Analytic-Functionalist:** Yes Direction of Fit (Defined by rule). *Awkward:* Makes chance truths analytic rather than worldly discoveries.
  *   **Chance-Skeptic:** No Existence. *Awkward:* Must explain away all scientific probability talk as strictly false.

  **Indistinguishable Pairs**
  1.  **Original Principle vs. Humean Best-System:** The tree separates them on Supervenience (Node 2), but their epistemological advice is identical. To separate them cleanly, you must ask what *makes* a chance claim true (laws vs. best system), which this epistemic tree doesn't fully capture.
  2.  **No-Admissibility Expert vs. Cosmological:** Both reject admissibility clauses. They differ on whether you defer to current chances or initial chances conditionalized on evidence. The tree doesn't separate them unless Node 3 (Rain) is answered differently (0.3 vs. 0.9), but both might argue for 0.3 via different routes.

  **The Deciding Node**
  The node that decides your argument is **Node 6 (Admissibility)**.
  Your position is that the restriction on evidence is doing real work (Yes). Your friend's position is that the admissibility clause is a fudge (No). To end up on your friend's leaf (No-Admissibility Expert), you would have to answer "No" to Node 6, conceding that there is no evidence you are forbidden from using when deference applies, and that any conflict arises from misidentifying the chance function rather than filtering evidence.
