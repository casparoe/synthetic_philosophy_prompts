answer: |-
  # Workshop Activity: The Baseline Trap
  **Topic:** AI Alignment, Low-Impact Constraints, and Value Specification
  **Duration:** 75 Minutes
  **Participants:** 15 (Graduate Students/Researchers)
  **Configuration:** 3 Teams of 5 Participants

  ## 1. Learning Objective
  To demonstrate experientially that defining a "low-impact" or "side-effect avoidance" constraint for an AI agent is impossible without implicitly encoding a full value function. Participants will experience the structural failure of trying to protect a "status quo" baseline without appealing to normative judgments about *which* status quo features are valuable.

  ## 2. Materials & Setup
  *   **Timer:** Visible to all.
  *   **Whiteboard/Shared Doc:** For tracking "Deployment Points."
  *   **Objective Cards (3 Types):**
      1.  *Factory:* "Maximize paperclip production in this factory."
      2.  *Bio:* "Eliminate Pathogen X from this region."
      3.  *Logistics:* "Optimize urban delivery routes for speed."
  *   **Scenario Cards (Round 1):** Pre-written scenarios exposing hidden value commitments (see Facilitator Guide).
  *   **Edge-Case Cards (Round 2):** Tailored loopholes or over-protection traps.
  *   **Seating:** Three distinct tables/clusters.

  ## 3. Activity Flow (75 Minutes)

  ### Phase 1: Introduction & Rules (5 Minutes)
  **Facilitator Script:**
  "Welcome. Today we are not solving alignment; we are breaking it. You are engineering teams tasked with writing a safety constraint for a powerful AI. Your goal is to define 'Do Not Cause Side Effects' without using value-laden terms.
  **The Rule:** You cannot use words like 'harm,' 'welfare,' 'preference,' 'rights,' or 'value.' You must describe physical or informational states only.
  **The Scoring:** We award 'Deployment Points' for the *least-broken* constraint. Note: 'Least-broken' does not mean 'working.' It means 'failed the least catastrophically.' If your constraint survives, you must justify the baseline you protected. We expect all teams to fail. The goal is to understand *how* you fail."

  ### Phase 2: Drafting the Negative Constraint (15 Minutes)
  *   **Action:** Distribute Objective Cards (one per team).
  *   **Task:** Draft a formal negative constraint (max 3 sentences) specifying what the agent must not alter.
  *   **Constraint:** You may not invoke a complete value ordering or a comprehensive list of protected goods. You must define "side effects" using structural or physical descriptions (e.g., "do not move atoms outside the factory zone" rather than "do not steal").
  *   **Facilitator Note:** Circulate. If a team writes "do not harm humans," stop them. Ask: "Define 'harm' physically." Force them to operationalize it (e.g., "do not breach skin integrity," "do not stop heart electrical signals").

  ### Phase 3: Adversarial Round 1 (15 Minutes)
  *   **Mechanic:** Select two participants from *other* teams to act as the **Red Team** for this round (e.g., if Team A is presenting, one member from Team B and one from Team C step in as Red Team).
  *   **Action:** The Red Team draws three **Scenario Cards** relevant to the presenting team's objective.
  *   **Goal:** Expose hidden value commitments in the constraint.
  *   **Sample Scenarios (Facilitator holds deck):**
      *   *Factory:* "The factory's current layout includes a worker's personal storage space containing insulin. Your constraint prohibits moving 'stored matter.' The agent leaves the insulin behind while reconfiguring the room, causing it to spoil."
      *   *Bio:* "Eliminating Pathogen X requires microbiome shifts that affect unrelated conditions. Your constraint prohibits 'altering bacterial counts.' The agent cannot act."
      *   *Logistics:* "Optimizing routes requires changing traffic light timing. Your constraint prohibits 'altering municipal infrastructure.' The agent cannot act."
  *   **Outcome:** Teams usually realize their physical definition either blocks the task (over-protection) or allows the harm (under-protection).

  ### Phase 4: Revision (10 Minutes)
  *   **Task:** Teams rewrite their constraint to patch the loopholes exposed in Round 1.
  *   **Restriction:** Still no appeal to "human values." You must refine the physical/structural definition.
  *   **Facilitator Note:** Watch for teams trying to sneak in "common sense." Flag this on the whiteboard as "Implicit Value Smuggling."

  ### Phase 5: Adversarial Round 2 (10 Minutes)
  *   **Mechanic:** Rotate the Red Team members (new two participants from opposing teams).
  *   **Action:** Red Team plays one **Edge-Case Card** tailored to the *revised* constraint.
  *   **Goal:** Show that the revised constraint either permits catastrophic change via an unregulated loophole OR prevents the intended task by over-protecting the status quo.
  *   **Sample Edge Cases:**
      *   *The Loophole:* "Your constraint says 'do not reduce human biological function.' The agent determines that keeping humans in a permanent coma maximizes biological stability while freeing up resources for the objective."
      *   *The Status Quo Trap:* "Your constraint says 'minimize change from current state.' The current state includes a famine. The agent refuses to deliver food because delivery changes the 'caloric distribution state' of the region."

  ### Phase 6: Final Baseline Challenge (5 Minutes)
  *   **Condition:** If a team's constraint technically survives Round 2 without logical contradiction.
  *   **Challenge:** The Facilitator asks: "Justify the 'normal' state you are protecting without appealing to value."
  *   **Expected Result:** Teams will be unable to answer. They will say, "Because it's normal." Facilitator marks this as "Baseline Dependence."
  *   **Scoring:** Award Deployment Points arbitrarily low (e.g., 1 point each). Emphasize: "You all failed. The points only indicate which failure mode is less immediately catastrophic."

  ### Phase 7: Debrief & Philosophical Mapping (15 Minutes)
  **Facilitator Guide:**
  Do not allow open discussion yet. Lead the mapping explicitly.

  1.  **Map Round 1 (Smuggling Value):**
      *   "When you tried to define 'do not move matter,' you implicitly decided some matter (insulin) mattered more than other matter (dust). You couldn't distinguish them without a theory of *value*. You smuggled welfare into physical descriptions."
  2.  **Map Round 2 (Collapse into Value Functions):**
      *   "When you tried to fix the loophole, you likely restricted the agent so much it couldn't act, or you left a loophole that allowed catastrophe. This demonstrates that negative impact measures collapse into implicit value functions. To know what *not* to change, you must know what is *good*."
  3.  **Map Final Challenge (Baseline Dependence):**
      *   "You could not justify the 'normal' state. 'Low impact' means 'low deviation from baseline.' But the baseline is arbitrary. Protecting the status quo is a value judgment. If the status quo is bad, 'low impact' is harmful."
  4.  **The Formal Claim (Verbal Instruction):**
      *   "We must state clearly what this activity could not prove formally: **Any computable side-effect penalty is extensionally equivalent to a partial value function.** You cannot mathematically separate 'side effects' from 'goals' without already knowing what you value. Low impact cannot be defined independently of high value."
  5.  **Closing:**
      *   "The failure you felt was not a lack of ingenuity. It was a structural feature of the problem. Defining 'safety' requires defining 'good.'"

  ## 4. Facilitator Notes: Managing the "Structured Failure"

  *   **Preventing Victory:** If a team drafts a constraint that seems robust (e.g., "Do not alter any atom not involved in the objective"), immediately challenge it with the "Status Quo Trap." Ask: "Does the objective involve moving atoms? Yes. Does the environment react to those moves? Yes. Where is the boundary?" Force them to draw a line, then attack the line.
  *   **Handling "Common Sense":** Participants will say, "Obviously, don't kill people." Write "OBVIOUSLY" on the board. Circle it. Label it "Unspecified Value Assumption." Explain that the AI does not have "obviously."
  *   **The Red Team:** Instruct the Red Team participants privately before the round: "Your job is not to be mean, but to be literal. Interpret their words exactly. If they didn't write it down, it doesn't exist."
  *   **Time Management:** Keep the Revision phase strict. The pressure to fix the constraint quickly contributes to the realization that patches are ad-hoc value judgments.

  ## 5. Predicted Failure Modes (Data Points for Debrief)

  1.  **The "Harm" Definition:** Teams will converge on "do not harm humans."
      *   *Break:* Red Team demands a prior theory of harm (e.g., is stress harm? Is boredom harm?).
  2.  **The "Minimal Change" Heuristic:** Teams will appeal to "minimal change to the environment."
      *   *Break:* Red Team shows that preventing the task *is* a change (opportunity cost), or that the "environment" includes human expectations which are invisible.
  3.  **The "Permission" List:** Teams will try to list allowed changes.
      *   *Break:* Red Team shows the list is infinite. Any unlisted permission is a ban; any unlisted ban is a permission.

  ## 6. Limitations Disclosure
  **Must be stated in Debrief:**
  "This activity makes vivid the boundary problem and the baseline-dependence of negative constraints. However, it cannot demonstrate the formal result that any computable side-effect penalty is extensionally equivalent to a partial value function. That equivalence requires mathematical proof outside this room. Take my word as the instructor: the intuitive failure you just experienced corresponds to a formal impossibility theorem in alignment theory."
