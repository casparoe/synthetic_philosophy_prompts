  Agent A operates within polynomial computational bounds, while Agent B possesses exponential capacity. Both exist in causally disconnected regions but share identical source logic regarding acausal coordination. A multiversal bridge requires essential resource contributions from both to activate, yielding significantly massive utility. Crucially, B's power allows it to fully simulate A's decision procedure before committing, whereas A cannot simulate B. However, trust cannot be established causally. They must jointly decide whether to contribute. If both contribute, the bridge opens. If one defects, resources are wasted. A knows B can simulate them; B knows A knows this. The trade hinges not on causal threat, but on logical correlation under strict computational asymmetry.

  - The symmetry-breaking worry
  The core snag is whether logical correlation survives computational hierarchy. Standard superrationality assumes peers. B sees A's output as deterministic fact, potentially treating A as fixed environment. If B defects after seeing A cooperate, A gains nothing. A knows B simulates them. If A binds output conditionally, does B respect this? If B views A as too simple to enforce reciprocity, B might exploit. The asymmetry threatens the handshake: can a weaker agent credibly commit against a stronger simulator? B might reason A's strategy is fixed, removing B's incentive to cooperate, reducing A to a predictable resource node.

  - Your bottom line on whether this kills superrationality or just modifies it
  It modifies, not kills. Superrationality relies on logical correlation, not computational equality. If A's code refuses cooperation unless B's simulated response cooperates, B faces a fixed logical fact: cooperate or get nothing. B's superiority allows seeing this earlier, but not changing it. As long as A's source code is transparent, the asymmetry becomes ultimately irrelevant. Cooperation holds if both maximize expected utility over logical outcomes, not causal sequences.
