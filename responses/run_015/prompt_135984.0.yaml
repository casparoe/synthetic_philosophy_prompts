answer: |-
  The central analogy of "procedural bilingualism" collapses. While the essay correctly identifies the failure of the bargaining model to account for radical incommensurability, its proposed solution is illusory. Treating moral compromise as linguistic interface-building does not preserve incommensurability; it merely disguises the imposition of a shared meta-ethic as neutral architecture. The framing fails because procedural rules are never value-free; they are substantive commitments at a higher level of abstraction.

  The analogy suggests that parties can agree on a "grammar of interaction" without translating their "vocabularies of justification." This is linguistically and philosophically incoherent. To agree on a veto structure, for example, is not merely to agree on a mechanism; it is to agree that *blocking* is a legitimate move, that certain interests warrant protection from majority will, and that stability is preferable to resolution. These are substantive values. If a consequentialist agrees to a deontological veto, they are accepting a constraint on maximizing welfare. If a deontologist agrees to a jurisdictional boundary, they are accepting that some zones are open to consequentialist calculation. The "interface" itself requires a shared metric of legitimacy to function. You cannot build a bridge between incommensurable values without laying foundation stones that both sides must accept as solid. Those stones are the hidden meta-language.

  This verdict implies that moral compromise can never avoid some form of value imperialism. The essay hopes to relocate imperialism from outcomes to design, but this is not an escape; it is a confession. Institutional design is where power is most potent. By defining the rules of engagement, the parties inevitably impose a framework that privileges certain modes of reasoning over others. There is no "neutral currency" for procedure any more than there is for utility. Therefore, any successful compromise requires at least one party to surrender the claim that their value system is exhaustive or exclusively authoritative. They must accept a meta-value (e.g., "peaceful coexistence" or "procedural fairness") that ranks above their substantive commitments. This is value imperialism, however benign it may appear.

  Furthermore, the essay misses a stronger, fatal counterexample: cases where one party's value system forbids entering procedural arrangements altogether. The model assumes both parties desire coordinated action enough to build an interface. It fails to account for exclusivist frameworks—religious, ideological, or moral—that view the act of compromise itself as contamination or apostasy. For a party that believes "there is no negotiation with evil," the proposal of procedural bilingualism is not a solution; it is a violation. The interface requires recognition of the other party as a legitimate interlocutor. If Party A's doctrine dictates that Party B lacks moral standing or authority, no amount of institutional architecture can facilitate compromise. The "bilingualism" fails because Party A refuses to speak to Party B in any grammar.

  This omission reveals the limits of the essay's optimism. Procedural bilingualism works only among liberals who already agree on the value of compromise. It cannot solve deep conflicts where the conflict is about whether compromise is permissible. Consequently, the essay's model is not a general theory of moral compromise but a specific technique for managing conflicts within a shared liberal democratic meta-ethic. It fails to address the very incommensurability it claims to solve, because true incommensurability often precludes the shared ground necessary to build the procedure in the first place.
