      *   **Addressing the TA's Move:** The TA slid from #3 to #4.
      *   **Constraint 1: Scope:** Distinguish *syāt* (operator) vs. *naya* (respect). Explain how "Consciousness is fundamental" vs. "Matter is fundamental" might be handled.
      *   **Constraint 2: Combinability:** Explain *sangraha* (synthesis) vs. fragmentation. The TA assumes fragmentation; Jainism aims for synthesis.
      *   **Constraint 3: Reflexivity:** Address the self-exemption problem.
