  **MEMORANDUM**

  **TO:** University President and Board of Trustees
  **FROM:** Commemoration and Naming Advisory Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendations on Pemberton Hall, Carrington Lectures, and Alcott Scholarship

  **Recommendations**
  The Committee recommends removing the name from Pemberton Hall and renaming the Carrington Lectureship, while retaining the Alcott Scholarship with added contextualization. We propose a new naming standard focused on current conferral rather than historical blame, implemented by May 2025.

  **Rationale and General Test**
  Our mandate is not to judge the dead, but to decide what this institution chooses to honor today. The "man-of-his-time" defense addresses historical blame, which is irrelevant to present conferral. We may acknowledge a figure's historical context without affixing their name to our buildings. Therefore, the Committee adopts the **Conferral and Nexus Standard** for all future and existing namings:

  1.  **Nexus:** Is the wrongdoing intrinsic to the achievement being honored? If the honor relies on the harm (e.g., wealth generated by convict leasing), the name must go. If the views were private and adjacent to the achievement (e.g., private diaries unrelated to the scholarship's purpose), contextualization suffices.
  2.  **Whose Time:** Was the wrongdoing contested at the time? If contemporaries lacking power objected, the "consensus" defense fails. We do not honor values that were imposed rather than shared.
  3.  **Current Uptake:** What signal does the name send now? A naming from 1961 may carry segregationist signals unintended in 1905. We assess the name's function in the current community.

  **Application to Referrals**
  **Pemberton Hall:** The building is funded by wealth derived directly from convict leasing. The nexus is total. Furthermore, contemporary objections existed from Black community leaders, disproving the claim that this was an uncontested norm. The 1961 naming minutes suggest the name served as a signal during desegregation efforts. **Recommendation:** Remove the name. The building shall be renamed by May 2025 through a competition open to engineering alumni.

  **Carrington Lectures:** The lectureship honors statesmanship defined by wartime leadership. That leadership relied on empire preservation, colonial famine, and detention camps. The empire is not adjacent to the statesmanship; it is the substrate of it. The nexus is tight. **Recommendation:** Rename the lectureship. We will endow a new series focused on "Global Leadership and Ethics" by September 2024, retiring the Carrington name.

  **Alcott Scholarship:** The antisemitic views were contained in private diaries, never acted upon, and were common to her circle. The nexus between her novelist achievement and private bias is weak. Removal would set a precedent that penalizes private thought recorded in archives over public action. **Recommendation:** Retain the name. A plaque will be installed by January 2024 detailing the contents of the diaries and the Committee's reasoning.

  **Addressing Counter-Arguments**
  We anticipate two objections. First, that removal is cheap symbolism that distracts from material change in admissions and hiring. We agree that naming is not a substitute for equity. However, naming *is* a material component of campus culture. It signals belonging to current students and staff. To claim symbolism is irrelevant is to ignore how institutions construct identity. We can pursue hiring equity and naming integrity simultaneously; one does not foreclose the other.

  Second, that any policy becomes a lottery based on the "Archive Effect"—we only judge those who left papers. This is a valid constraint. We cannot audit the silent past. To mitigate this, we will not conduct a moral audit of all two hundred existing namings. Instead, we will institute a **Scheduled Review**. Every naming will be reviewed every twenty-five years. This acknowledges the "Unstable Present"—our consensus will look parochial in fifty years. By scheduling review, we allow future committees to revisit our decisions without requiring a scandal to trigger them.

  **The Universally Excused Case**
  This test implies that even if a figure was universally excused at the time—where no dissenting voice exists—the name may still be removed. Historical consensus does not bind present conferral. If an act violates the university's current core values, the honor is withdrawn regardless of past permission. We are not judging them; we are choosing us.

  ** Costs and Implementation**
  Renaming carries financial cost (rebranding, signage) and social cost (donor relations). We estimate $150,000 for physical changes across the three sites. To manage donor risk, we will frame these changes as an evolution of institutional values rather than a repudiation of past donors. The Board must approve the Conferral and Nexus Standard by December 1, 2023. The Scheduled Review policy will be added to the Gift Acceptance Guidelines by March 2024.

  We request approval to proceed immediately.

  ***

  **STRATEGY NOTE TO USER**

  **On the Distinctions:**
  Distinction **(e) Archive Effect** is the dud if used as a moral shield. You cannot argue "we shouldn't remove names because we don't know everyone's sins." That leads to paralysis. You successfully pivoted it into a procedural constraint (Scheduled Review), which is the right move. Don't let it become a veto against action. Distinction **(f) Unstable Present** cuts against you if you claim your decision is permanent. You handled this well by building in the 25-year review.

  **On the Universally Excused Figure:**
  Your intuition is correct: the defense succeeding historically doesn't settle the naming question. Under the **Conferral** test (Distinction 'a'), past consensus is irrelevant. If the act is abhorrent by *current* standards, the name goes, even if everyone in 1850 thought it was fine. The memo takes this hard line ("Historical consensus does not bind present conferral"). This is the only logically consistent position. If you concede that past excuse protects the name, you concede that the university's values are static, which contradicts Distinction (f). Keep the line firm: We are choosing who *we* are, not judging who *they* were.
