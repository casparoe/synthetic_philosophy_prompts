  The rain did not fall so much as it hammered, a relentless, cold percussion against the corrugated iron of the workshop roof. Elara stood in the gloom, the smell of wet timber and oil thick in the air. Her beam was in place, a heavy length of oak she had wrestled into the corner to stop her own roof from collapsing. It was her right to protect her property; the lease said she was responsible for her own bay. But the beam pushed outward against the shared party wall, and through the thin partition, she could hear Thomas shouting. He was in the next bay, trying to secure his lathe. The pressure from her brace was bowing the wall into his space. If it gave, it would not kill him, but it would crush his leg, likely ending his ability to work forever. She held the axe in her hand. If she struck the brace, the tension would release, the wall would snap back, and Thomas would be safe. But her own roof would come down. The storm would ruin the stock, the machinery, the business she had built over ten years. It would be total ruin, a loss comparable to the life he would lose. She looked at the axe, then at the wall where Thomas's shadow moved, frantic and close. She had done nothing wrong to put the beam there, yet here she was, the arbiter of whose future broke first. She tightened her grip on the handle, her knuckles white, and did not swing. The wood groaned, a sharp crack echoed from next door, and then a thud, followed by a curse that turned into a hiss of pain. He was hurt, but alive. She let the axe head rest on the concrete floor, her breath coming in short, white clouds, and turned her face away from the wall.

  The moral texture of that moment depends entirely on which lens you apply to Elara's inaction. Under Peter Singer's shallow-pond principle, Elara is permitted to walk away because the cost of intervention is too high. Singer's utilitarianism demands we prevent bad outcomes only when the sacrifice is negligible or significantly less important than the harm prevented. Here, the harm prevented is Thomas's permanent disability, but the sacrifice is Elara's entire livelihood and economic survival. If we accept that a life's work and the capacity to sustain oneself are of comparable moral importance to physical integrity, the equation balances out. Singer's principle contains an exemption clause for comparable sacrifice, so it yields the result that Elara has no obligation to destroy her own life to save Thomas from ruining his. Ordinary morality, however, judges her more harshly. It relies on corrective justice and special duties arising from interaction. Because Elara's action, however rightful, was the specific cause of the threat to Thomas, she incurs a duty of care that overrides general beneficence. In the ordinary view, you are not just a neutral agent weighing costs; you are a participant who altered the status quo to another's detriment. You broke it, you fix it, even if the fix is painful. The single feature doing the work here is causal responsibility. If you remove that feature, say by having the storm alone push the wall inward rather than Elara's brace, the ordinary morality view collapses into alignment with Singer. Without her agency creating the specific risk, she reverts to a bystander, and neither view would demand she sacrifice comparable goods to save a neighbour. A proponent of the pond argument would likely try to wriggle out of this case by attacking the comparability premise. They would argue that physical bodily integrity is always morally weightier than economic livelihood, no matter how grave the financial loss. They would insist that a leg is worth more than a workshop, forcing the sacrifice to be non-comparable, which would reinstate the obligation to help under Singer's own terms, thereby preserving the demandingness of the principle even in this reversed scenario.
