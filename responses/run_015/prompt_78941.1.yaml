answer: |-
  The Hinckley verdict and the furious reaction to it confirm Galen Strawson's Basic Argument by exposing legal responsibility as a pragmatic, arbitrary cutoff in an infinite regress of causation that society instinctively refuses to acknowledge. Under Strawson's mapping, Hinckley's acquittal is not a metaphysical exception but a localized admission that certain causal chains (delusions) negate agency, whereas the ordinary defendant remains trapped in identical causal chains (character, environment, genetics) that simply look like choice. The insanity verdict is the law's minimal concession to the regress, stopping precisely where the visible machinery of determination becomes too obvious to ignore, yet it refuses to follow the logic back to the ordinary defendant who is equally unfree. Strawson asserts there is no ultimate difference between Hinckley and the ordinary criminal; both act according to who they are, and neither is responsible for being who they are, making the legal distinction a matter of social hygiene rather than moral truth. The doctrine of *actio libera in causa* attempts to anchor responsibility in a prior voluntary act, such as choosing to get drunk, but this merely walks the regress back a step without terminating it, because the choice to become intoxicated was itself determined by the agent's prior nature, which they did not choose. Consequently, the post-Hinckley reforms that narrowed the insanity test and shifted the burden of proof are not corrections of justice but an institution refusing to follow an argument it cannot answer, aggressively redrawing the arbitrary line to preserve the fiction of ultimate responsibility. The Basic Argument does not break logically on this episode; rather, the reaction shows Strawson is right about our metaphysics—we lack ultimate responsibility—but wrong if he assumes theory should dictate practice, as the reforms prove that human society requires the fiction of blame to function even when the logic of causation renders it impossible.
