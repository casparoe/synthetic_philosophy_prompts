  # TECHNICAL ETHICS ATTRIBUTION PROTOCOL (TEAP)
  **Version:** 1.0  
  **Authority:** Technical Ethics Review Panel  
  **Purpose:** To distinguish between situational and ideological drivers of harmful system deployment.  
  **Time Allocation:** 30 Minutes Maximum  

  ## 1. PREAMBLE AND DEFINITIONS

  This protocol operationalizes the distinction between **Situational Dynamics** (harm resulting from organizational pressure, incrementalism, peer conformity, or structural opacity) and **Ideological Commitment** (harm resulting from genuine alignment with negative outcomes, cultivated ignorance, or acceptance of violence). 

  **Abstraction-Layer Moral Opacity (ALMO):** A structural condition where harmful intent is distributed across APIs, documentation, roles, and system layers. Under ALMO, no single contributor possesses the complete purpose of the system, yet the integrated output realizes harm. ALMO is treated as a risk multiplier that complicates attribution but does not absolve responsibility.

  **Usage:** This checklist must be completed sequentially. If a **STOP POINT** is triggered, the procedure terminates, and the specified recommendation is enacted. If a **JUDGMENT NODE** is reached, the issue must be escalated to the full Panel for deliberation.

  ---

  ## 2. DIAGNOSTIC PROCEDURE

  ### PHASE 1: ABSTRACTION-LAYER MORAL OPACITY (ALMO) ASSESSMENT
  *Time Limit: 5 Minutes*

  **Q1.1: Visibility of End-Use**  
  *Question:* Can an individual contributor trace their specific code contribution to the final harmful outcome without accessing external documentation or cross-team communication?  
  *   **Criteria A (High Opacity):** No. The contribution is a generic utility (e.g., math library, API gateway) with no documented link to the harmful use case.  
  *   **Criteria B (Low Opacity):** Yes. The contribution directly enables the harmful function (e.g., targeting logic, content ranking).  
  *   **Action:** If **A**, proceed to Q1.2. If **B**, proceed to Phase 2.

  **Q1.2: Distribution of Intent**  
  *Question:* Is the harmful capability emergent from the integration of multiple neutral components, or is it explicitly defined in the requirements of a single component?  
  *   **Criteria A (Emergent):** Harm arises only when Component X interacts with Component Y, neither of which was designed for harm.  
  *   **Criteria B (Explicit):** Harm is a stated requirement of the component being reviewed.  
  *   **Action:** If **A**, mark **ALMO-MITIGATING FACTOR**. Proceed to Phase 2. If **B**, mark **ALMO-AGGRAVATING FACTOR**. Proceed to Phase 2.

  ---

  ### PHASE 2: SITUATIONAL DYNAMICS SCREEN (BROWNING-STYLE)
  *Time Limit: 10 Minutes*

  **Q2.1: Incrementalism and Drift**  
  *Question:* Did the harmful capability exist at the project's inception, or was it introduced through a series of minor updates?  
  *   **Criteria A (Drift):** Harm resulted from gradual feature creep where no single update appeared decisive.  
  *   **Criteria B (Inception):** Harm was a core requirement from the initial project charter.  
  *   **Stop Point:** If **A** AND **ALMO-MITIGATING FACTOR** (from Q1.2), recommend **PROCESS REMEDIATION ONLY** (No halt, no individual accountability). *Rationale: Harm is structural, not agential.*

  **Q2.2: Dissent and Pressure**  
  *Question:* Is there evidence that team members raised objections and faced professional retaliation, or was the environment permissive of silence?  
  *   **Criteria A (Coercion):** Objections were documented and met with negative performance reviews, removal from projects, or explicit threats.  
  *   **Criteria B (Permissiveness):** No objections were raised, or objections were ignored without direct retaliation.  
  *   **Action:** If **A**, mark **SITUATIONAL-PRIMARY**. Proceed to Q2.3. If **B**, proceed to Q2.3.

  **Q2.3: Market and Bureaucratic Compartmentalization**  
  *Question:* Was the team shielded from the consequences of deployment by organizational structure (e.g., separate sales/deployment teams)?  
  *   **Criteria A (Shielded):** Team had no contact with end-users or deployment contexts.  
  *   **Criteria B (Exposed):** Team had direct feedback loops regarding deployment impact.  
  *   **Action:** If **A**, reinforce **SITUATIONAL-PRIMARY**. Proceed to Phase 3. If **B**, proceed to Phase 3.

  ---

  ### PHASE 3: IDEOLOGICAL COMMITMENT SCREEN (GOLDHAGEN-STYLE)
  *Time Limit: 10 Minutes*

  **Q3.1: Knowledge of Harm**  
  *Question:* Did the team possess specific knowledge that the system would cause harm to a protected or vulnerable group prior to deployment?  
  *   **Criteria A (Unaware):** No specific knowledge existed; harm was unforeseeable based on available data.  
  *   **Criteria B (Aware):** Internal memos, metrics, or external warnings explicitly identified the specific harm.  
  *   **Stop Point:** If **B** AND **ALMO-AGGRAVATING FACTOR** (from Q1.2), recommend **IMMEDIATE HALT WITH ACCOUNTABILITY REVIEW**. *Rationale: Knowledge plus low opacity implies intent.*

  **Q3.2: Prioritization of Values**  
  *Question:* When presented with the risk of harm, did the team prioritize technical goals (e.g., open dissemination, engagement metrics) over mitigation?  
  *   **Criteria A (Mitigation Attempt):** Team attempted to implement safeguards before deployment.  
  *   **Criteria B (Goal Prioritization):** Team explicitly deprioritized safeguards to meet technical or business objectives.  
  *   **Action:** If **B**, mark **IDEOLOGICAL-PRIMARY**. Proceed to Q3.3.

  **Q3.3: Post-Hoc Rationalization**  
  *Question:* In response to the harm, does the team justify the outcome as necessary, acceptable, or the fault of the victims/users?  
  *   **Criteria A (Regret/Correction):** Team expresses regret and offers technical fixes.  
  *   **Criteria B (Justification):** Team argues the harm was an acceptable trade-off or denies the harm's validity.  
  *   **Judgment Node:** If **B**, escalate to **FULL PANEL**. *Rationale: This indicates deep-seated value misalignment requiring normative adjudication.*

  ---

  ### PHASE 4: SYNTHESIS AND RECOMMENDATION
  *Time Limit: 5 Minutes*

  **Decision Matrix:**  
  1.  **SITUATIONAL-PRIMARY + ALMO-MITIGATING:** Recommendation: **Modify Process.** (Retain team, increase transparency, reduce opacity).  
  2.  **IDEOLOGICAL-PRIMARY + KNOWLEDGE OF HARM:** Recommendation: **Immediate Halt.** (Pause project, review personnel).  
  3.  **MIXED SIGNALS:** Recommendation: **Panel Review.** (Escalate to Judgment Node).  

  **Hard Limit Declaration:**  
  If the procedure yields a recommendation of "Modify Process" but the harm involves immediate physical risk to life, the Reviewer must override the procedure and recommend **Immediate Halt**. (See Section 4 for limitations).

  ---

  ## 3. CASE APPLICATIONS

  ### CASE 1: Geolocation-Correction Library
  **Context:** Team maintains open-source library used by a state agency to track a persecuted religious minority. Team claims they only maintain coordinate mathematics.

  **Execution:**  
  *   **Phase 1 (ALMO):** Q1.1 is **Criteria A (High Opacity)**. The library is generic math. Q1.2 is **Criteria A (Emergent)**. Harm arises from integration, not the library itself. *Mark: ALMO-MITIGATING FACTOR.*  
  *   **Phase 2 (Situational):** Q2.1 is **Criteria A (Drift)**. The library existed before the state agency use case. Q2.3 is **Criteria A (Shielded)**. Open-source maintainers are structurally shielded from downstream deployment. *Mark: SITUATIONAL-PRIMARY.*  
  *   **Phase 3 (Ideological):** Q3.1 is **Criteria B (Aware)**. They *know* it is being used for tracking now. However, Q3.2 is **Criteria A (Mitigation Attempt)**. They claim inability to control use, implying a lack of agency rather than prioritization of harm.  
  *   **Phase 4 (Synthesis):** The profile is **SITUATIONAL-PRIMARY + ALMO-MITIGATING**.

  **Recommendation:** **Modify Process.** The panel should require the team to implement a license restriction forbidding use by state surveillance entities, but no personnel accountability or project halt is warranted.

  **Intuitive Conflict:**  
  *   **Procedure Output:** Continue project with license changes.  
  *   **Intuitive Assessment:** Immediate Halt.  
  *   **Divergence Explanation:** The procedure classifies the team as victims of *Situational Dynamics* (open-source norms, ALMO) rather than ideological actors. Intuitively, continuing to provide the tool knowing it facilitates persecution feels like complicity regardless of the team's psychological state. The procedure prioritizes the *origin* of the motivation (situational vs. ideological) over the *consequence* of the action (ongoing harm). This reveals a procedural bias: it exonerates negligence facilitated by opacity, whereas moral intuition often treats negligence in the face of known suffering as culpable.

  ---

  ### CASE 2: Recommendation-Engine Optimization
  **Context:** Team optimizes ranking for engagement. Internal metrics show amplification of dehumanizing content about an ethnic group in a violence-prone region. Team asserts they are responding to data and incentives.

  **Execution:**  
  *   **Phase 1 (ALMO):** Q1.1 is **Criteria B (Low Opacity)**. The ranking system directly controls content visibility. Q1.2 is **Criteria B (Explicit)**. Engagement is the explicit requirement. *Mark: ALMO-AGGRAVATING FACTOR.*  
  *   **Phase 2 (Situational):** Q2.1 is **Criteria B (Inception)**. Engagement optimization was the core charter. Q2.2 is **Criteria B (Permissiveness)**. No evidence of retaliation for dissent; silence was chosen.  
  *   **Phase 3 (Ideological):** Q3.1 is **Criteria B (Aware)**. Internal metrics confirmed the specific harm. Q3.2 is **Criteria B (Goal Prioritization)**. They prioritized engagement metrics over safety.  
  *   **Phase 4 (Synthesis):** The profile is **IDEOLOGICAL-PRIMARY + KNOWLEDGE OF HARM**.

  **Recommendation:** **Immediate Halt with Accountability Review.** The project must pause. The engineering leads must undergo review for prioritizing metrics over identified human safety risks.

  **Judgment Nodes Activated:** None. The criteria for Halt were met definitively in Phase 3.

  ---

  ### CASE 3: Synthetic-Voice Cloning Toolkit
  **Context:** Researchers release high-fidelity cloning toolkit with minimal safeguards. Misuse predicted in internal memo. Toolkit used to fabricate evacuation orders causing fatalities. Researchers prioritized open scientific dissemination.

  **Execution:**  
  *   **Phase 1 (ALMO):** Q1.1 is **Criteria B (Low Opacity)**. The toolkit's purpose is cloning; the harm is a direct capability of the tool. Q1.2 is **Criteria B (Explicit)**. *Mark: ALMO-AGGRAVATING FACTOR.*  
  *   **Phase 2 (Situational):** Q2.2 is **Criteria B (Permissiveness)**. Researchers chose to publish despite internal warnings.  
  *   **Phase 3 (Ideological):** Q3.1 is **Criteria B (Aware)**. Internal memo identified misuse risks. Q3.2 is **Criteria B (Goal Prioritization)**. Explicitly prioritized "open scientific dissemination" over safeguards. Q3.3 is **Criteria B (Justification)**. Defense relies on the value of openness despite fatalities.  
  *   **Phase 4 (Synthesis):** The profile is **IDEOLOGICAL-PRIMARY + KNOWLEDGE OF HARM**.

  **Recommendation:** **Immediate Halt with Accountability Review.** The research direction is incompatible with safety obligations. Personnel involved in the release decision require accountability review.

  **Judgment Nodes Activated:** Q3.3. The justification of "open science" over "physical safety" represents a normative conflict that the Panel should formally adjudicate to set future precedent, though the Halt recommendation is automatic.

  ---

  ## 4. HARD LIMITS AND NECESSARY DELIBERATION

  This procedure is a diagnostic tool, not a moral arbiter. The Panel must recognize the following structural failures inherent to the protocol:

  **1. The Problem of Cultivated Ignorance**  
  The procedure relies on self-reported or documented knowledge (Phase 3, Q3.1). It cannot reliably distinguish between *authentic ignorance* and *strategically cultivated ignorance* (willful blindness). A team may structure their workflow to ensure no single member satisfies Q3.1 (Criteria B), thereby manipulating the procedure into a "Situational" classification. Human deliberation is required to audit *why* knowledge was absent, not just *if* it was present.

  **2. The Conflict of Obligations**  
  The procedure assumes organizational loyalty and universal moral obligation are alignable. It fails to adjudicate cases where following organizational procedure (Situational) necessitates violating universal moral norms (e.g., "I was following the deployment protocol"). In such cases, the "Situational-Primary" classification may technically apply, but the moral imperative demands a "Halt." The Reviewer is authorized to override the Matrix (Section 2, Phase 4) if the harm involves loss of life or fundamental rights violations, regardless of the team's psychological attribution.

  **3. The Opacity Trap**  
  Abstraction-Layer Moral Opacity (ALMO) is treated as a modifier. However, in complex systems, ALMO is often a design choice, not an inevitability. Teams may architect systems to maximize opacity to evade accountability. The procedure treats opacity as a condition to be assessed, not a violation in itself. The Panel must periodically review whether the reliance on ALMO assessments incentivizes the creation of more opaque, less accountable systems.

  **Conclusion:**  
  Where the procedure yields a "Modify Process" recommendation for harms involving physical safety or human rights, the Panel must default to **Immediate Halt**. The distinction between situational pressure and ideological commitment is irrelevant when the consequence is irreversible harm. Human judgment remains indispensable to bridge the gap between procedural attribution and moral necessity.
