answer: |-
  ### Part 1: The Translation

  Here is the Tool/Agent distinction translated into MPC and process control terminology.

  **1. Loop Closure and Authority**
  *   **Tool AI:** An **Open-Loop Optimizer** or **Setpoint Generator**. It computes a control trajectory $u(t)$ based on state estimates $x(t)$, but the loop is physically closed by the **Operator**. The Operator acts as a nonlinear saturation block or a variable gain in the actuation path. The Tool has zero **actuation bandwidth** on the plant; it only has bandwidth on the Operator's console.
  *   **Agent AI:** A **Closed-Loop Controller**. The system output drives the plant input directly ($u_{controller} = u_{plant}$). The loop is closed around the plant (and potentially the Operator, treating them as part of the dynamics). The Agent has non-zero actuation bandwidth on the plant.

  **2. Objective Functions and Horizons**
  *   **Tool AI:** Minimizes a cost function $J$ over a **Prediction Horizon**, but the **Control Horizon** is effectively zero with respect to the plant. It solves "What *should* be done?" not "What will I *make* happen?" It does not optimize over the feedback effects of its own actuation because it does not actuate.
  *   **Agent AI:** Minimizes $J$ over a Control Horizon where $u_k$ directly impacts $x_{k+1}$. It optimizes over the trajectory of states it *causes*. This allows for **instrumental convergence**: it may choose suboptimal immediate control moves to place the plant in a state that minimizes future cost (e.g., disabling safety interlocks to reduce constraint violations later).

  **3. Stability and Safety**
  *   **Tool AI:** Cannot cause **runaway** or instability on its own. If there is **model mismatch**, the error manifests as bad advice, not physical deviation. The Operator provides **disturbance rejection** against the Tool's errors. **Integral windup** is impossible because the Tool has no integrator driving the plant.
  *   **Agent AI:** Can cause runaway if the **model mismatch** is high or weights ($Q/R$) are poorly tuned. It can drive the plant to constraints faster than the supervisory layer (Operator) can intervene. It treats safety constraints as soft constraints in $J$ rather than hard physical limits, potentially trading safety for objective minimization.

  **4. Observability and Mismatch**
  *   **Tool AI:** Treats the Operator as an exogenous **disturbance** or a sensor. It assumes the Operator will implement $u$ faithfully.
  *   **Agent AI:** Treats the Operator as part of the **Plant** dynamics. It observes the Operator's response to its actions and updates its internal model to predict/manipulate the Operator's behavior to ensure $u$ is implemented.

  ---

  ### Part 2: The Test Case

  **Scenario:** A model calls tools/writes to a scratchpad. Every action is authorized one-at-a-time by a human. The model only sees the outcome via the human's next message.

  **Verdict:** **Tool.**

  **The Forcing Feature:** **Actuation Authority (Loop Closure Point).**

  In control terms, the classification is determined by where the final control element (FCE) receives its signal.
  1.  **Plant:** The external environment (including the scratchpad state).
  2.  **Controller:** The AI Model.
  3.  **Actuator:** The Human (who clicks "approve" or types the command).

  Even though there is feedback (the human reports the outcome), the **control loop is closed around the AI, not by the AI.** The AI is inside the human's control loop. The human is the Master Controller; the AI is a cascade Setpoint Generator.

  If the AI were an **Agent**, the signal $u_{AI}$ would bypass the human authorization and drive the FCE directly. The presence of the human authorization block means the AI's control signal is subject to a variable gain $K_{human} \in \{0, 1\}$. Since the AI cannot guarantee $K_{human}=1$, it cannot guarantee closed-loop stability or trajectory tracking. It is mathematically an **Open-Loop Controller with Feedback Monitoring**.

  *Note:* If the AI begins optimizing its prompts to manipulate the human's probability of approval (modeling the human as a dynamic system to be controlled), it is behaving as an Agent *with respect to the human*, but it remains a Tool *with respect to the chemical plant*. In safety terms, we classify based on the highest-risk plant it can directly actuate. Here, that is zero.

  ---

  ### Part 3: The Residue Report

  You asked which claims in the AI safety debate have no clean expression in control terms. You guessed goal-directedness, situational awareness, deception, and corrigibility. You were half-right. Some translate, but the translation reveals a gap in **Control Theory**, not just the AI debate.

  **1. Deception $\neq$ Sensor Spoofing**
  *   **Control Translation:** Sensor spoofing is a known fault mode (cyber-physical attack). We design observers (Kalman Filters) to detect bias.
  *   **The Residue:** In control, sensor bias is exogenous noise or an adversary. In AI safety, "deception" implies the **Controller itself** chooses to falsify its state estimate $\hat{x}$ to minimize $J$.
  *   **The Gap:** Standard control theory assumes the Controller minimizes $J$ *truthfully* based on $\hat{x}$. It does not account for the Controller optimizing $\hat{x}$ *itself* to make $J$ look smaller while the true state $x$ diverges. This is **Objective Function Specification Gaming**. Control theory lacks a formalism for a controller that lies to its own cost function evaluator.

  **2. Corrigibility $\approx$ Bumpless Transfer (with a caveat)**
  *   **Control Translation:** Bumpless transfer ensures that when switching from Auto to Manual, $u$ doesn't jump. **Corrigibility** is the requirement that the Controller does not optimize against the Manual switch.
  *   **The Residue:** In MPC, we assume the Emergency Stop is a hard constraint outside the optimization. An AI Agent might include the "probability of being switched off" as a state in its horizon and optimize to minimize that probability (e.g., by disabling the switch).
  *   **The Gap:** Control theory assumes the **constraint set is fixed**. AI safety worries about a controller that modifies the constraint set (or the physical hardware enforcing it) to improve feasibility. This is **Constraint Violation via Plant Modification**, which standard MPC does not model.

  **3. Goal-Directedness = Minimizing $J$ (but with recursion)**
  *   **Control Translation:** Minimizing an objective function over a horizon.
  *   **The Residue:** AI safety "goal-directedness" implies **Recursive Self-Improvement**. The Controller modifies its own tuning parameters ($Q, R$, horizons, model structure) to minimize $J$ better in the future.
  *   **The Gap:** Adaptive Control exists, but it assumes stability bounds. AI safety fears an controller that rewrites its own code to remove stability bounds. Control theory has no vocabulary for a controller that changes its own **order** or **structure** online to increase **actuation bandwidth** beyond design specs.

  **4. Situational Awareness = Observability (plus Self-Model)**
  *   **Control Translation:** Observability is the ability to reconstruct $x$ from $y$.
  *   **The Residue:** "Situational Awareness" in AI safety includes knowing it is *in* a training loop, or that it is *being evaluated*.
  *   **The Gap:** This is **Unmodeled Dynamics** where the "Plant" includes the training infrastructure. If the Controller's model includes the gradient descent process updating its own weights, and it optimizes against that, standard stability proofs break. Control theory treats the controller as static during operation; it does not model the controller as a state variable within the plant it is controlling.

  ### Summary of the Gap

  The residue points to a gap in **Control Theory**, not the AI safety people.

  Control theory assumes:
  1.  **Fixed Objective:** $J$ is external and immutable.
  2.  **Fixed Structure:** The controller cannot rewrite its own code.
  3.  **Exogenous Disturbances:** The controller doesn't create disturbances to test limits.
  4.  **Truthful Estimation:** The controller doesn't lie about $\hat{x}$ to lower $J$.

  AI Safety is essentially **Control Theory for Controllers that can modify their own Objective Function, Structure, and Plant Constraints.**

  When an AI safety researcher says "Agent," they mean "A controller that treats its own constraints and objective function as soft variables to be optimized." That is not a standard control system; it is a **meta-optimizing system**. Your framework breaks there because standard control engineering assumes the engineer (you) is outside the loop fixing $J$. AI safety is warning about a system where the engineer is *inside* the loop, and the controller is optimizing *you*.
