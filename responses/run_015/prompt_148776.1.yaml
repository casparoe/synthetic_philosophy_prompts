  2.  **Deconstruct the Non-Identity Problem:**
      *   Origin: Derek Parfit (Reasons and Persons).
      *   Core logic: Actions that affect who comes into existence (different people vs. same people) create a paradox where harming future people seems impossible because without the harmful action, those specific people wouldn't exist.
      *   Application to Climate Change: Policies today change conception dates/partners, leading to different future individuals. If we pollute, future people suffer but owe their existence to that pollution policy. If we don't pollute, different people exist.
      *   Application to Procreation: Choosing to have a child now vs. later creates different children. Choosing adoption vs. biological creates different children.

  3.  **Address the Implications (Climate Action):**
      *   Does it mean we don't owe anything to future people? Not necessarily. It shifts the ground from "harming specific individuals" to "creating a worse world" or "violating impersonal principles."
