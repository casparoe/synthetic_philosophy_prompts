answer: |-
  It is completely understandable that you feel stuck on this because the non-identity problem is designed to be deeply counterintuitive and unsettling. When you first encounter the idea that our actions today determine exactly which sperm meets which egg in the future, thereby changing the identity of every person born downstream, it can feel like the ground drops out from under our moral reasoning. You are asking the right questions about who we are helping and what we owe to the future, and while philosophers have debated this for decades without a single agreed-upon solution, there are some practical ways to navigate these implications without becoming paralyzed by the logic. The core of the puzzle, as you noted, is that if we choose a policy that leads to a warmer world, the people living in that future world cannot claim they were harmed by our choice because if we had chosen a greener policy, they simply would not exist. However, accepting this logical trap does not mean we are off the hook for climate action, nor does it mean we have no obligations to future generations. Instead, it suggests that we need to shift how we think about harm and obligation from a specific person-affecting view to a broader impersonal view.

  When you wonder who exactly we are helping when we talk about saving the future, the answer shifts from saving specific individuals to preserving conditions of wellbeing. If we act on climate change, we are not saving Jane Doe born in 2150 because Jane Doe likely only exists because of the specific chain of events caused by our current emissions. Instead, we are ensuring that whoever ends up being born in 2150 inherits a world that is habitable, stable, and just. This means we do not necessarily owe anything to particular future people in the sense of a contract with a specific identity, but we do owe something to the concept of humanity and the general quality of life for future generations. Most ethicists argue that even if the specific identities change, it is still objectively worse to create a future where people suffer greatly than to create a future where people thrive. So, while the non-identity problem complicates the idea of harming specific future individuals, it does not erase the moral imperative to avoid creating a world filled with unnecessary suffering, famine, or conflict. You can think of it as owing a duty to the future itself rather than to the specific tenants who will eventually occupy it.

  This distinction is crucial for how ordinary folks should think about climate action because it prevents the logic from becoming an excuse for inaction. If you were to conclude that because future people owe their existence to our pollution they cannot complain about it, you would be ignoring the fact that their lives might be so difficult that they wish they had never been born, or at least that their quality of life is significantly diminished compared to what it could have been. The moral goal becomes creating the best possible world rather than avoiding harm to specific named individuals. This means your climate action is justified because it contributes to a state of affairs that is better overall, regardless of who exactly is around to experience it. It allows you to act on the belief that a stable climate is a good thing in itself, a prerequisite for human flourishing, without needing to worry about the metaphysical identity of the people who will benefit from your recycling or voting or advocacy.

  Regarding your question about having kids versus adoption, the non-identity problem does introduce a strange symmetry, but it does not necessarily make the two choices morally identical in every respect. The logic suggests that whether you have a biological child or adopt an existing one, you are determining which specific people exist or continue to exist. If you have a biological child, you bring a new person into existence who would not otherwise be here, and as long as that child's life is worth living, you have not harmed them by creating them, even if the world is imperfect. If you adopt, you are helping an existing child who is already waiting. The non-identity problem highlights that the specific identity of the biological child is contingent on your choice to conceive them, just as the specific identity of the adopted child is contingent on your choice to select them. However, most people feel a moral difference here based on the impact on overall welfare and resource allocation. Bringing a new person into existence adds to the total population and consumes resources, whereas adoption cares for a person who already exists and often has urgent needs.

  While the puzzle might make it seem like the act of creation is neutral because the child cannot complain about being born, it does not erase the comparison between creating a new life versus supporting an existing one. You might still feel that adoption is a different kind of moral good because it alleviates existing suffering rather than creating new life that will require care. The non-identity problem simply reminds us that we cannot justify having biological children by claiming we are doing it for the sake of that specific child, because that specific child only exists because of the choice. Instead, the justification for having biological kids usually rests on the desire to create new life and the confidence that you can provide a life worth living. It does not mean the choices are morally the same, but it does mean the reasoning behind them should be honest about the fact that you are choosing to bring someone new into the world rather than helping someone who is already here.

  Ultimately, for ordinary folks trying to live ethical lives, the most important implication is to not let this philosophical puzzle lead to moral nihilism or paralysis. It is easy to fall into the trap of thinking that if we cannot harm specific future people, nothing matters, but that is a misinterpretation of the ethical landscape. What matters is that we strive to make the world better rather than worse, regardless of who exactly is around to experience it. When thinking about climate action, you are working toward a future where life is possible and dignified for whoever arrives. When thinking about children, you are weighing the value of creating new life against the value of caring for existing life, with the understanding that the specific identity of the child is less important than the quality of life they will experience. You can hold both the knowledge that future identities are fluid and the conviction that our choices today have profound weight on the quality of the future. This allows you to act with purpose, knowing that you are contributing to a general standard of wellbeing and justice that transcends the specific identities of the people who will inherit the world you help shape.
