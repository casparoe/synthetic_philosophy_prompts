      *   It doesn't negate the duty to act; it just changes the justification from person-affecting harm to impersonal badness or rights-based arguments (e.g., right to a decent life regardless of identity).

  4.  **Address the Implications (Having Kids/Adoption):**
      *   Does it make adoption and biological kids morally the same?
      *   Superficially: Both bring specific people into existence who wouldn't otherwise exist.
      *   Nuance: The non-identity problem suggests the *identity* of the child is contingent on the choice. However, most people feel a moral difference based on intentions, resource allocation, or the welfare of the resulting child.
      *   If the child will have a life worth living, creating them isn't harming them (even if adoption might have helped existing children more).
