  Rank 1 is the Kosovo Field myth with a composite score of 9.5, followed by Rank 2, the Confederate Lost Cause at 8.5, Rank 3, the Masada narrative at 3.0, and Rank 4, the Dunkirk spirit at 1.0.

  The Kosovo Field myth exhibits the strongest mnemonic secession because it posits a spiritual sovereignty over territory that exists parallel to and often in contradiction with the pragmatic borders of the modern Serbian state. This narrative constructs a moral community of martyrs that demands rectification from the present government, compelling it to prioritize historical claims over diplomatic recognition, thereby embedding a permanent tension between the heavenly kingdom of Serbian identity and the earthly reality of its political sovereignty. Its institutional embeddedness remains high, sustained by the Orthodox Church and nationalist political platforms that treat any concession on Kosovo as a betrayal of the nation's core mythic identity.

  The Confederate Lost Cause ranks second because it successfully constructed a moral community of the vanquished that viewed the United States federal government as an occupying force demanding cultural rectification rather than integration. For over a century, this myth maintained a parallel sovereignty through Jim Crow laws and regional iconography that asserted Southern moral superiority over Northern victory. However, its present institutional embeddedness is declining as federal and state authorities remove monuments and rename bases, reducing its capacity to function as an active claim of parallel political sovereignty compared to its historical peak.

  The Masada narrative ranks third because, while it mobilizes a myth of ancient defeat, it is primarily integrated into the legitimacy of the modern Israeli state rather than standing in secession from it. The moral community of the vanquished Zealots is claimed as the direct ancestral lineage of the current sovereign power, meaning the myth serves to strengthen state military doctrine and national resilience rather than demanding rectification from the state itself. Any secessionist potential is minimal, as the narrative is used to justify the state's existence and borders rather than challenge them from a parallel moral standpoint.

  The Dunkirk spirit ranks fourth because it functions almost exclusively as a myth of national survival that reinforces the legitimacy of the British state rather than constructing a separate moral community. The narrative reframes a military defeat as a collective triumph of the people, but this community is fully integrated into the existing political order without claims of parallel sovereignty or demands for rectification. It serves to unify the populace behind the state during crises, lacking the antagonistic relationship between the mythic community and the present-day government that defines mnemonic secession.
