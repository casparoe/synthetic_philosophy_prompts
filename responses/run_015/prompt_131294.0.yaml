  **BUREAU OF INTERLINGUAL COMPLIANCE**
  **STANDARD OPERATING PROCEDURE 41-B**
  **SUBJECT: Certification of Field Manual Equivalence (Radical Translation Contexts)**
  **REVISION: 4.2**

  **1.0 SCOPE AND PURPOSE**
  1.1 This Procedure establishes the criteria by which Bureau Auditors certify that a submitted Field Manual correctly renders the native expression *gavagai* as the target expression "rabbit."
  1.2 Certification confirms that the Manual aligns with all observable stimulus conditions and logical apparatus constraints defined herein.
  1.3 The Bureau does not certify metaphysical truth, but rather operational equivalence between competing Analytical Hypotheses.

  **2.0 DEFINITIONS**
  2.1 **Observation Sentence:** An utterance whose verdict depends solely on concurrent sensory stimulation.
  2.2 **Analytical Hypothesis:** A mapping rule linking native lexemes to target lexemes, including logical apparatus (identity, plurality, duration).
  2.3 **Manual:** A compiled set of Analytical Hypotheses submitted for Certification.
  2.4 **Stimulus Meaning:** The set of all sensory stimulations prompting native assent or dissent.

  **3.0 VERIFICATION OF STIMULUS MEANING**
  3.1 Auditors shall verify that native assent to *gavagai* correlates with target assent to "rabbit" under identical stimulation (e.g., presence of lagomorphs).
  3.2 Dissent must similarly correlate during absence of stimulation.
  3.3 Where correlation fails, Auditors shall adjust the Manual's translation of logical particles per Appendix A until correlation is restored.
  3.4 **Note:** Multiple Manuals may achieve full correlation simultaneously. All such Manuals are eligible for Certification. The existence of rival Manuals does not invalidate the Certification of the primary Manual.

  **4.0 IDENTITY CONDITIONS AND ONTOLOGICAL RELATIVITY**
  4.1 To distinguish between rival hypotheses (e.g., "rabbit" vs. "undetached rabbit part"), Auditors shall query native identity conditions.
  4.2 Auditors will ask: "Is this *gavagai* the same *gavagai* as that one?"
  4.3 **Constraint:** The query must be rendered in the native language using the Manual under certification.
  4.4 **Resolution:** If the Manual translates the query as asking about object identity, and the native assents, the hypothesis "rabbit" is confirmed. If the Manual translates the query as asking about part-identity, and the native assents, the hypothesis "undetached rabbit part" is confirmed.
  4.5 Both outcomes constitute compliance. The Bureau does not adjudicate between ontologically distinct but empirically equivalent configurations. To claim one configuration is "correct" is non-compliant behavior.

  **5.0 CERTIFICATION AND BILLING**
  5.1 Upon satisfaction of Clause 3.0 and 4.0, the Bureau shall issue a Certificate of Equivalence.
  5.2 Where rival Manuals exist, Certificates shall be issued to all parties. Project accounts will be billed for each Certificate issued.
  5.3 Disputes regarding which Manual reflects the "actual" meaning shall be referred to Discipline Committee 9.

  **6.0 BUREAU LANGUAGE PROTOCOLS**
  6.1 This Standard is authored in English.
  6.2 For compliance purposes, English terms herein (e.g., "object," "same," "clause") are certified under standard mereological assumptions.
  6.3 **Footnote 6.3:** A version of this Standard utilizing temporal-stage ontology is available upon request. Both versions carry identical Certification Mark 41-B-Ω. Users are advised not to inquire which version reflects the "true" structure of Bureau directives, as such inquiry falls outside the scope of Operational Compliance.

  **APPENDIX A: COMPENSATING ADJUSTMENTS**
  A.1 **Hypothesis:** *gavagai* = "rabbit". **Adjustment:** None.
  A.2 **Hypothesis:** *gavagai* = "undetached rabbit part". **Adjustment:** Translate native identity particle as "is part of the same whole as."
  A.3 **Hypothesis:** *gavagai* = "temporal rabbit stage". **Adjustment:** Translate native identity particle as "is a stage of the same enduring process as."
  A.4 **General:** Any ontological discrepancy may be resolved by recalibrating the translation of logical constants per Clause 3.3. No discrepancy shall remain unresolved upon submission of Form 88-B (Adjustment Request).

  **DISCIPLINARY EXCERPT (CASE 884-Q)**
  > Fieldworker J. Miller was sanctioned for insisting Manual A was "the only true translation" despite Manual B satisfying all stimulus conditions. Miller stated: "But I know what I meant when I pointed." Sanctioned for Subjective Idealism and Failure to Accept Analytical Equivalence. Reassigned to Documentation.

  **7.0 EFFECTIVE DATE**
  7.1 This Standard is effective immediately and applies retroactively to all past Certifications, regardless of ontological shifts incurred during the interim.
  7.2 Auditors are reminded that the Certificate validates the Manual, not the world.

  **END OF DOCUMENT**
