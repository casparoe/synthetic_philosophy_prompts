answer: |-
  There is no single, canonical noun (like "The Duhem-Quine Problem") that exclusively labels this specific intuition. However, the reasoning you describe sits at a well-populated intersection of **econometric specification testing**, **philosophy of statistics**, and **structural realism**.

  The intuition you describe—that **random error is compatible with truth, while systematic error betrays falsehood**—is a recognized heuristic in the philosophy of science, often discussed under the banners of **Statistical Adequacy**, **Model Misspecification**, and **Verisimilitude**.

  Here is a map of the existing literature and concepts that capture this distinction, followed by an analysis of where the intuition holds and where it risks becoming merely aesthetic.

  ### 1. The Statistical Label: "Statistical Adequacy" vs. "Substantive Adequacy"
  The most precise technical mapping comes from the philosopher-statistician **Aris Spanos**. He distinguishes between:
  *   **Substantive Adequacy:** Does the model fit the theory and data well? (Model A wins here: tighter fit).
  *   **Statistical Adequacy:** Do the residuals satisfy the probabilistic assumptions of the model (e.g., independence, homoscedasticity, normality)? (Model B wins here: white noise).

  Spanos argues that **Statistical Adequacy is a prerequisite for Substantive Adequacy.** If residuals are correlated (Model A), the model is **misspecified**. The "signal" remaining in the residuals indicates that the model's probabilistic structure does not match the data-generating process. In this framework, Model B is preferred not because it fits better, but because it is *statistically valid*, whereas Model A is *statistically spurious*, regardless of its $R^2$.

  **Key Term:** **Misspecification Testing** (or Diagnostic Checking).
  **The Intuition:** A "true" model absorbs all systematic variance; what remains *must* be noise. If structure remains, the model is structurally false.

  ### 2. The Philosophical Label: "Verisimilitude" and "Structural Realism"
  In philosophy of science, this maps onto debates about **Truth-likeness (Verisimilitude)** and **Structural Realism**.

  *   **Verisimilitude (Popper/Niiniluoto):** Popper's original account of verisimilitude struggled to quantify "closeness to truth." However, your intuition aligns with a **likeness-to-truth** account where the *structure* of the error matters. If the error is random, the deviation is attributed to **measurement error** (ontologically innocent). If the error is systematic, the deviation is attributed to **model error** (ontologically guilty).
  *   **Structural Realism (John Worrall):** This view holds that we cannot know the nature of entities, but we can know the *structure* of the relations between them. Model B, by producing random residuals, suggests it has captured the correct structural relations, with the remaining error attributable to "noise" in the measurement. Model A, by producing structured residuals, suggests it has captured the wrong structure (e.g., linear instead of exponential), even if it approximates the curve better locally.

  **Key Concept:** **The Innocence of Noise.**
  This is the philosophical weight you identified: Random error is treated as an external limitation (the instrument), while systematic error is treated as an internal limitation (the theory).

  ### 3. The Methodological Label: "Error Statistics"
  **Deborah Mayo's** framework of **Error Statistics** focuses on the **severity** of tests.
  *   Model A has not passed a severe test of its functional form because the residuals indicate it could have been adjusted to fit better (the structure is there to be exploited).
  *   Model B has passed a severe test of its functional form because there is no information left in the residuals to exploit; the model has extracted all the systematic information it claims to.

  In this view, preferring Model B is not aesthetic; it is a commitment to **learning from error**. Structured residuals offer a clue for revision (Lakatosian "anomaly"), but until revised, the model is considered flawed. Random residuals indicate the model is "complete" regarding its specific claims.

  ### 4. Risks and Critiques: When is this an Aesthetic Preference?
  You asked where this risks collapsing into a preference for "clean" failure. There are three major traps in this intuition:

  #### A. The "Effective Theory" Trap (Physics)
  In physics, a model with structured residuals might be a better **Effective Field Theory**.
  *   *Example:* Newtonian gravity fits planetary data incredibly well (Model A) but leaves a tiny, structured residual in Mercury's orbit (precession). General Relativity (Model B equivalent in this analogy, though it actually fits better) resolves the structure.
  *   *Risk:* If you reject Model A solely because of the structured residual, you might discard a highly useful approximation. However, if you accept Model A *as true*, you are wrong. The intuition holds for **truth**, but not necessarily for **utility**.

  #### B. The "Hidden Variable" Trap (Lakatos)
  Imre Lakatos would argue that Model A (with structured residuals) is actually part of a **Progressive Research Program**.
  *   The structured residual is not a sign of falsehood, but a sign of **fruitfulness**. It points to the auxiliary variable you mentioned.
  *   Model B (random noise) might be a **Degenerate Program**. It ignores the structure in the residuals, treating a discoverable signal as mere noise to preserve the "cleanliness" of the theory.
  *   *Risk:* Preferring Model B can be a form of **theoretical conservatism**. It protects the core theory from falsification by dismissing structured anomalies as "noise" simply because they don't fit the preferred architecture.

  #### C. The "Overfitting" Inversion
  In machine learning and complex systems, "random residuals" can sometimes indicate that a model is too simple (underfitting) to capture the deterministic chaos of the system, whereas a model with structured residuals might be capturing high-frequency dynamics that look like correlation but are actually deterministic.
  *   *Risk:* Assuming "noise = truth" presupposes that the underlying system is stochastic. If the system is deterministic but chaotic, Model B is falsely comforting.

  ### 5. Synthesis: How to Label It
  If you need a label for this specific intuition in a paper or discussion, the most accurate phrasing would be:

  > **"The Epistemic Privilege of Statistical Adequacy"**
  > *or*
  > **"The Heuristic of Residual Innocence"**

  It is the claim that **structural fidelity (indicated by uncorrelated errors) outweighs empirical accuracy (indicated by minimized error magnitude) as a marker of verisimilitude.**

  ### Summary Recommendation
  To map this intuition onto existing discussions without falling into aestheticism:

  1.  **Anchor it in Spanos:** Cite the distinction between *statistical adequacy* (Model B) and *curve fitting* (Model A). This gives it statistical rigor.
  2.  **Qualify the "Truth" Claim:** Acknowledge that Model B is not necessarily "truer" in a predictive sense, but is **structurally more honest**. It correctly identifies the limits of its own explanatory power.
  3.  **Warn against Dogmatism:** Acknowledge the Lakatosian counter-argument: Structured residuals are often the birthplace of new theory. Preferring Model B should be a provisional stance of *current* validity, not a permanent shield against the anomalies Model A reveals.

  The intuition is sound **if** the goal is identifying the correct causal architecture. It is risky **if** the goal is prediction or if the "noise" is actually unmodeled determinism.
