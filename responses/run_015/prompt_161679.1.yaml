answer: |-
  Here is the diagnosis, the trade-off, and the fix.

  ### The Diagnosis: You Ran Into Arrow and Condorcet
  The forum poster was right, but "impossible" is too blunt. It means you cannot satisfy **all** your verdicts simultaneously. Specifically, your set of verdicts contains three internal conflicts:

  1.  **The Arrow Conflict (Verdicts 0, 1, 5, 7):** You want a system that always produces a ranking (0), respects unanimity (1), isn't a dictatorship (7), and ignores irrelevant options (5). **Arrow's Theorem** proves these four cannot coexist. One must go.
  2.  **The Condorcet Conflict (Verdicts 3 vs 4):** You want the head-to-head champion to win (3), but you also want the "consensus candidate" who is never ranked last to win (4). In your example (7 voters: M>B>O, 5 voters: B>O>M), **M** is the head-to-head champion (Verdict 3), but **B** is the consensus candidate (Verdict 4). They are different people. You cannot have both.
  3.  **The Consistency Conflict (Verdict 9):** You want subgroup agreement to guarantee group agreement. While this holds for simple majority on pairs, it is mathematically incompatible with robust cycle-resolution methods (like the one you need for Verdict 0) in edge cases.

  ### The Trade-Off: What to Drop
  To build a tool that works for engineers, you should sacrifice the properties that matter least in a team context.

  **1. Drop Verdict 5 & 6 (Independence of Irrelevant Alternatives).**
  *   **What this means:** You accept that adding a "clone" option (Rust vs. Rust+Axum) *can* theoretically shift the ranking of other options, and the Top 3 of a 10-item list might not perfectly match a 3-item list run.
  *   **Why:** This is the "Arrow breaker." In a team setting, the *context* of the full ballot matters. Adding an option changes the conversation. This is the cheapest verdict to lose because it prevents the system from ever returning an error or cycle (Verdict 0).
  *   **Mitigation:** Curate the ballot. Don't allow clones.

  **2. Drop Verdict 4 (Consensus Intuition).**
  *   **What this means:** You accept that if 7 people prefer M over B, M wins, even if the 5 people who hate M feel strongly about it.
  *   **Why:** For sprint planning, majority rule (Verdict 3) is more actionable than consensus (Verdict 4). If you prioritize consensus, a vocal minority can block the majority. Keep Verdict 3 (Condorcet Winner); it aligns better with Verdict 2 (Majority Rule).

  **3. Relax Verdict 9 (Subgroup Consistency).**
  *   **What this means:** If Backend and Frontend both prefer O>M, the whole team *usually* will, but cycle-resolution math might occasionally flip this in pathological cases.
  *   **Why:** This is a technical constraint of fixing cycles (Verdict 0). It rarely happens in practice with 12 voters.

  ### The Surviving Rule
  You need a **Condorcet Method** that resolves cycles. Your current method (Copeland) is a Condorcet method, but your tie-breaking logic broke Monotonicity (Verdict 10) and failed to resolve cycles deterministically (Verdict 0).

  **Use the Schulze Method (or Ranked Pairs).**
  *   **Satisfies:** 0 (Always outputs a ranking), 1 (Unanimity), 2 (Majority), 3 (Condorcet Winner), 7 (Non-Dictator), 8 (Anonymity), 10 (Monotonicity).
  *   **Violates:** 5 (IIA), 6 (Subset Consistency), 4 (Consensus/Borda).
  *   **Why:** It treats your ballots as a network of pairwise victories. If there is a cycle (A>B>C>A), it drops the *weakest* victory link to break the cycle. It is used by Debian, Ubuntu, and KDE for this exact reason.

  ### Answers to Your Edge Cases

  *   **Cloning (Rust vs. Rust+Axum):** Since you are dropping Verdict 5, cloning *can* split the vote and alter the outcome. **Verdict:** Do not allow clones on the ballot. Merge them before voting.
  *   **Partial Ballots ("No Opinion"):** In pairwise counting, if a voter skips B, simply exclude them from the B-vs-X count. Do not treat it as "Last." This preserves Verdict 10.
  *   **Winner vs. Ranking:** Keeping the full ranking does not solve the impossibility theorems (Gibbard-Satterthwaite applies to winners too). However, the Schulze method produces a full ranking naturally. Keep the ranking; it helps with backup plans if the top sprint item gets blocked.
  *   **Strategic Voting:** Unavoidable (Verdict 7 + 3 + 0 implies manipulability). However, Schulze is highly resistant to "burying" strategies (ranking a strong competitor last). It is much harder to game than your current Copeland + Average Rank system.

  ### The README Sentence
  Paste this exactly:

  > **"We use the Schulze method to compute a ranking that respects head-to-head majorities wherever possible, deterministically resolving preference cycles by dropping the weakest pairwise victories."**

  ### Summary of Changes for Your Code
  1.  **Remove** the "pairs won minus pairs lost" scoring.
  2.  **Implement** the Schulze beatpath algorithm (pseudocode is widely available, ~50 lines).
  3.  **Remove** the "Average Rank" tie-breaker (Schulze rarely ties, and handles its own ties deterministically).
  4.  **Accept** that if you add a "Rust+Axum" option, the "Mobile" ranking might shift slightly. That is the mathematical price of always getting an answer.
