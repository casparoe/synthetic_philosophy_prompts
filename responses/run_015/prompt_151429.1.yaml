  I sit on the Meridian Institute review board and we vote next tuesday on Project ANCHOR. The PI wants to apply teleosemantic analysis to predictive-error signals in BCI feedback loops for psychosis patients, arguing that since these neural hierarchies lack direct evolutionary selection history, calling them misrepresentational collapses into mere malfunction—which should change our informed-consent framing for the trial. The clinical co-lead says its just philosophy garnish and we should fund on outcomes alone. Draft a short memo for the board recommending approve, reject, or approve-with-conditions, with reasoning that actually engages whether derived proper function can do the work when direct phylogenetic selection is absent. Include the strongest counterargument and a concrete next-step with a timeline. Don't ask for citations or a reading list.
