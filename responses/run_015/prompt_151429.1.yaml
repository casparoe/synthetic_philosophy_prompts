      *   **Topic:** Applying teleosemantic analysis to predictive-error signals in BCI feedback loops for psychosis patients.
      *   **Key Conflict:**
          *   PI (Principal Investigator): Argues that since neural hierarchies in this context lack direct evolutionary selection history, calling them "misrepresentational" collapses into "mere malfunction." This should change informed-consent framing.
          *   Clinical Co-lead: Dismisses it as "philosophy garnish," argues for funding based on outcomes alone.
      *   **Requirement:** Engage with the philosophical substance (derived proper function vs. direct phylogenetic selection).
      *   **Requirement:** Include the strongest counterargument.
      *   **Requirement:** Include a concrete next-step with a timeline.
      *   **Constraint:** Do not ask for citations or a reading list.
      *   **Deadline:** Vote is next Tuesday (memo should be timely).

  2.  **Deconstruct the Scientific/Philosophical Claim:**
      *   *Teleosemantics:* A theory of mental content that grounds representation in biological function (etiology). Something represents X because it was selected to do X.
      *   *The PI's Claim:* Predictive-error signals in BCI loops for psychosis don't have a *direct* evolutionary history (BCIs are new, psychosis-related dysregulation might be maladaptive). Therefore, labeling them "misrepresentations" is wrong; they are just "malfunctions."
      *   *Implication:* If it's a "misrepresentation," the patient's brain is "wrong" about reality. If it's a "malfunction," the mechanism is broken. The PI argues this distinction matters for informed consent (perhaps reducing stigma or changing agency attribution).
      *   *The Problem:* Teleosemantics usually relies on selection history. If there's no selection history for the *specific* BCI loop, can there be "proper function"?
      *   *Derived Proper Function:* Can we rely on the proper function of the underlying neural systems (prediction error minimization) even if the specific BCI context is novel? Yes, usually. The brain's predictive machinery *was* selected. The BCI interfaces with that.
      *   *PI's Error:* The PI seems to conflate the *BCI loop* (novel) with the *neural hierarchy* (ancient). The neural hierarchy *does* have a selection history. The psychosis aspect complicates things (is psychosis a malfunction of a selected system?).
      *   *Clinical Co-lead's Error:* Dismissing the conceptual framing entirely. Informed consent *does* depend on how risk and mechanism are explained. If the model changes agency attribution, it matters ethically.

  3.  **Determine the Recommendation:**
      *   *Reject?* Too harsh. The science might be sound, even if the philosophy is shaky.
      *   *Approve?* Risky. The informed consent framing change based on shaky philosophy could be ethically problematic.
      *   *Approve-with-Conditions:* Best fit. Allow the trial but mandate clarification on the consent forms and require a philosophical/ethical audit of the framing. The PI's philosophical claim is dubious (neural hierarchies *do* have selection history), so basing consent changes on it is risky.

  4.  **Drafting the Memo - Section by Section:**

