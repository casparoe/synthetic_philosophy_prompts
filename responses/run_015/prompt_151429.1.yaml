      *   **Reasoning (Engaging the Philosophy):**
          *   Address the PI's claim: The claim that neural hierarchies lack direct evolutionary selection is false. Predictive processing mechanisms *are* evolved.
          *   Address "Derived Proper Function": Even if the BCI is novel, it interfaces with systems that have proper functions (minimizing prediction error). The "misrepresentation" label holds if the system fails to perform its selected function.
          *   Address the Consent Issue: Changing consent framing based on a contested philosophical distinction (misrepresentation vs. malfunction) is risky. Patients need clear info, not metaphysical nuance that might obscure risk.
          *   Address the Co-lead: Dismissing it as garnish is also wrong. Conceptual framing affects how patients understand agency and side effects.
      *   **Strongest Counterargument:** The PI might argue that *psychotic* states themselves represent a breakdown of the selection history (evolutionary mismatch), making "proper function" undefined in this specific pathological context. If the system is already broken, teleosemantics can't define "error" normatively.
      *   **Next Step/Timeline:** Require a revised consent form and an ethical addendum by next Monday (day before vote) or within 2 weeks post-approval. Let's say prior to final funding release.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, check the PI's argument again:* "since these neural hierarchies lack direct evolutionary selection history..." This is the weak point. The hierarchies *do* have history. The *BCI feedback* doesn't. The PI is arguing that because the *loop* is artificial, the semantic content is undefined.
      *   *Correction:* I need to be precise. The neural hierarchies *do* have selection history. The PI is wrong there. However, the *BCI-mediated* error signal is novel. Can *that* have proper function? Only derivatively.
      *   *Decision:* The PI's conclusion (change consent framing) doesn't follow safely from the premise. The Co-lead is wrong to ignore it.
      *   *Recommendation:* Approve-with-Conditions. Condition: Decouple the consent language from the contested teleosemantic claim until validated.

  6.  **Drafting the Content:**
      *   *Tone:* Professional, decisive, intellectually rigorous but practical.
      *   *Length:* Short memo.
      *   *Constraint Check:* No citations, no reading list.

  7.  **Final Polish:**
      *   Make sure the "derived proper function" point is clear.
      *   Ensure the counterargument is strong (the "pathology breaks the norm" argument).
      *   Set a concrete deadline.

      *(Self-Correction on Timeline)*: Vote is next Tuesday. Memo should be ready now. Next step should be pre-funding or pre-recruitment. Let's set the deadline for revised consent forms before recruitment begins.

      *(Refining the "Derived Proper Function" engagement)*: The PI argues no direct selection = no misrepresentation. I need to argue that *derived* proper function (the function of the system relative to the organism's survival goals) *can* do the work even if the specific BCI interface is novel. The brain's goal (homeostasis/accuracy) is selected. The BCI serves that. Therefore, "misrepresentation" is valid. The PI's claim is philosophically weak.

      *(Wait, one more check)*: The PI says calling them misrepresentational collapses into malfunction. Actually, in teleosemantics, misrepresentation *is* a type of malfunction (failure to perform proper function). The PI seems to think "malfunction" is non-semantic. I need to point out this confusion doesn't justify changing consent forms yet.

