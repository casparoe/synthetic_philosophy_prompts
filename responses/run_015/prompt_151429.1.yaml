answer: |-
  **MEMORANDUM**

  **TO:** Meridian Institute Review Board
  **FROM:** [Your Name], Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Project ANCHOR (BCI/Psychosis Teleosemantics)

  **RECOMMENDATION:** Approve-with-Conditions

  **REASONING**
  The Principal Investigator (PI) requests a modification to informed-consent framing based on the claim that BCI-mediated predictive-error signals lack direct evolutionary selection history, and therefore cannot be "misrepresentations," only "malfunctions." The Clinical Co-lead dismisses this as irrelevant philosophy. Both positions require correction.

  The Co-lead is incorrect to treat this as garnish. In psychosis trials, how we frame agency and error (e.g., "your brain is lying" vs. "the mechanism is broken") impacts patient stigma and withdrawal rates. However, the PI's theoretical justification is unsound. Teleosemantics does not require every specific feedback loop to be directly selected; it relies on **derived proper function**. The neural hierarchies interfacing with the BCI *do* possess direct phylogenetic selection history for predictive accuracy. The BCI loop derives its normative status from serving these ancient homeostatic goals. Therefore, labeling signals as "misrepresentational" is philosophically valid even in novel artificial loops. Basing consent changes on the claim that these hierarchies lack selection history is factually incorrect regarding the neural substrate.

  **STRONGEST COUNTERARGUMENT**
  The PI may argue that in psychotic pathology, the underlying neural hierarchy is already decoupled from fitness conditions, rendering "proper function" undefined. If the system's evolutionary norm is compromised, imposing a BCI norm is arbitrary, and "misrepresentation" loses its grounding. This suggests the consent form should not promise semantic correction of errors, but merely mechanical regulation. This risk necessitates oversight on the consent language.

  **NEXT STEP & TIMELINE**
  Approval is conditioned on the submission of a revised informed-consent document that decouples specific teleosemantic claims from risk disclosure. The PI must demonstrate that the framing change does not obscure the experimental nature of the BCI loop or imply a normative certainty that the theory does not support.

  **Deadline:** Revised consent forms must be submitted to the Board Chair 14 days prior to patient recruitment initiation.
