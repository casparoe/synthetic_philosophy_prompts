  The defense models the system as an open, driven dissipative structure. The cycle is not a closed loop but a limit cycle within a non-equilibrium steady state (NESS). Entropy production is strictly positive but balanced by continuous energy and information influx. Can such a system maintain stability without depletion? Yes, provided free-energy throughput sustains the structure against relaxation to equilibrium. Stability arises from dissipation, not conservation, breaking the perpetual-motion analogy.

  **Residue Report**

  1.  *Cycle implies loss:* Translates cleanly (net free-energy decrease in closed systems).
  2.  *Extractor extracts work:* Translates cleanly (coupling to work reservoir).
  3.  *Rationality constrains plans:* Survives with distortion. Physics describes allowable trajectories, not constraints on extended "plans."
  4.  *Stability of cycle:* Translates cleanly (existence of NESS limit cycles).
  5.  *Normative "Ought":* No expression. The claim that a system *ought not* be pumpable is irreducibly normative. Physical law permits dissipative cycles (NESS); rationality forbids them. The prohibition is not a physical impossibility but a normative boundary condition absent from statistical mechanics. The "defect" is axiological, not thermodynamic.
