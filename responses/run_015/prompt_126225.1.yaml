answer: |-
  It is a sharp observation you have made about those Nordic governance pilots, and it cuts right to the heart of the tension between modern technocratic management and the philosophical ideals of participatory democracy. What you are describing is a system that表面上 looks like Deweyan experimentalism because it involves citizens in the process of testing ideas, but underneath the hood, it relies on a much older and more rigid epistemological framework that Dewey specifically argued against. The implicit theory of democratic knowledge at work here presupposes a sharp division of labor between the generation of hypotheses and the validation of truth. It assumes that while ordinary residents are capable of identifying problems and proposing solutions based on their lived experience, they are not capable of defining what counts as evidence or determining what constitutes a successful outcome. This splits the democratic process into two distinct phases: a democratic phase of idea generation and a technocratic phase of verification. By locking in success metrics beforehand and requiring statistical significance for adoption, the municipality is operating on a positivist view of knowledge where value judgments are separated from factual judgments. The experts decide what values matter by choosing the metrics, and the data decides the facts, leaving the residents in a strange limbo where their qualitative experience of improved daily life is treated as anecdotal unless it can be translated into the specific quantitative language authorized by the data office.

  This setup suggests that the practice is not genuinely Deweyan, but rather sneaks in a form of logical positivism or managerial elitism disguised as participation. For Dewey, democracy is not just about voting or even just about testing policies; it is about the continuous reconstruction of experience through shared inquiry. In a truly Deweyan framework, the definition of the problem, the method of investigation, and the criteria for success are all part of the same social process that must remain open to revision by the community involved. When the city council says a pilot fails because it missed a p-value threshold despite residents reporting improvements, they are asserting that the abstract model of reality held by the data office is more real than the concrete experienced reality of the neighbors. This violates the pragmatic maxim that truth is found in the consequences of action as experienced by those involved. The practice assumes that there is a clean division between the people who generate hypotheses and the people who validate them, which implies that knowledge is a commodity that can be produced by one group and audited by another, rather than a social achievement reached through communication and shared understanding. Dewey would argue that this breaks the continuity of inquiry, turning the residents into mere data providers rather than co-inquirers.

  If we distinguish between what this practice strictly needs to function as designed versus what merely fits well with it, we see that the system strictly needs the expert-controlled normative framing to maintain its specific type of legitimacy. It needs the pre-set metrics to ensure that local experiments do not conflict with broader citywide goals or budgetary constraints, and it needs the statistical threshold to protect decision-makers from accusations of bias or favoritism. The hard gatekeeping of statistical significance is necessary for this model because it provides an objective-looking shield for the city council; if they reject a pilot, they can say the data did not support it, rather than admitting they disagree with the residents' values. What merely fits well with the program is the participatory design element. While involving residents makes the pilots more robust and socially acceptable, the current evaluation structure treats this participation as instrumental rather than constitutive. The residents are used to generate buy-in and local knowledge, but that knowledge is discarded if it does not conform to the expert schema. So, the participation fits the aesthetic of democracy, but the epistemology remains authoritarian.

  To take Dewey's experimentalism seriously from start to finish, several fundamental changes would have to occur in these programs. First, the criteria for success could not be locked in beforehand by a remote data office; they would have to be co-created by the residents and the experts together, ensuring that the metrics reflect what the community actually values rather than just what is easily measurable. Second, qualitative feedback would need to be granted evidentiary weight equal to quantitative data, meaning that a consistent report of improved quality of life could validate a pilot even if the statistical significance was ambiguous, perhaps triggering a longer trial period rather than immediate cancellation. Third, the inquiry would have to be continuous rather than a one-off pilot with a pass-fail gate; if a policy shows promise but misses a threshold, the democratic response should be to adjust the policy and test again, treating the failure as learning rather than termination. Finally, the interpretation of the results would need to be a public deliberative process where residents and officials argue over what the data means together, rather than the data office handing down a verdict. This would shift the role of the expert from a judge of truth to a resource for the community, aligning the governance structure with the view that democracy is indeed a form of social inquiry where the methods of knowing and the ends of living are worked out collectively rather than imposed from above.
