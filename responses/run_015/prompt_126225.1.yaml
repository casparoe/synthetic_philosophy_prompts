prompt: |-
  I've been sitting in on this course about pragmatism and my prof keeps going on about Dewey's view that democracy is basically a form of social inquiry — like we treat policies as experiments and test them together in real life rather than just voting once. Anyway, I was reading about these neighborhood-level adaptive governance pilots they run in some Nordic cities, where local residents design their own waste-collection or traffic rules, run them for six months, and gather feedback. The strange part is that even though the residents come up with the pilot and collect all the qualitative feedback, the success metric's are locked in beforehand by the municipal data office, and the city council only accepts the results if they hit statistical significance on those pre-set measures. So people are trusted to do the experimenting but not to say what counts as success, and if a pilot improves daily life but misses the p-value threshold it gets scrapped. I'm trying to figure out what philosophical commitments that split actually presupposes. Does it assume Dewey was wrong that inquiry has to be continuous and collaborative all the way through, and that there's a clean division between the people who generate hypotheses and the people who validate them? Or can you have a democratic experiment where the normative framing stays expert-controlled but the implementation is participatory? I want you to reconstruct the implicit theory of democratic knowledge this practice relies on, say whether it's genuinely Deweyan or if it sneaks in a different epistemology altogether, distinguish what the practice strictly needs from what merely fits well with it, and tell me what would have to change in these programs if we took Dewey's experimentalism seriously from start to finish. Please write everything in continuous prose — no headings, bullet points, bold text, or tables, just like you'd write an email or a letter — and don't worry about citing specific books, I just want the argument worked out clearly.
