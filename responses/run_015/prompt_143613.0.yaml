  Why is B right? Because in A, the probability that *your* dollar is the one that makes the difference is low. Say, 1%. In B, it's 100%.
  Counterfactual Value A = 10 * 0.01 = 0.1.
  Counterfactual Value B = 5 * 1.0 = 5.
  ITN matches Counterfactual Value. User's MV Rule matches Technical Value.
  The thesis claims ITN is an error ($V'/x$). But if the goal is Counterfactual Value, ITN is a *proxy* for the correct metric, whereas $V'$ is the *wrong* metric (technical vs counterfactual).
  This is the strongest argument against the user. I must present this clearly.

  *(Refining Point 5)*: The insulation risk. If the user says "Practitioners define Tractability as technical," and practitioners say "No, we define it as counterfactual," the user's thesis rests on an empirical claim about how practitioners define terms. The user needs to pin them down on definitions in the interview.

  *(Refining Point 6)*: The multiplication. If it's just a prompt, why multiply? Addition would work for a checklist. Multiplication implies a specific functional form. The retreat to "it's just a prompt" contradicts the mathematical specificity of the multiplication.

