answer: |-
  ### The weak link

  The weak link is Step (6). It looks secure because it aligns with legal positivism: officially, if the state strips your personhood, you lose legal rights. That is the nature of institutional facts, like money. However, Step (6) conflates *institutional status* with *moral standing*. It assumes that because rights are constructed, the *basis* for those rights is equally fragile. But your capacity to suffer and think (Step 7) is a brute fact, not a construction. The error lies in treating 'rights-bearing human' as a monolithic category. It ignores the distinction between being a legal person (constructed) and a moral person (grounded in sentience). Step (6) fails because it suggests that losing the *label* negates the *reality* of your claim. You can lose the former without losing the latter, even if society refuses to acknowledge it. The classification depends on people, but the suffering does not. It looked plausible because we often equate validity with recognition. Yet Step (7) reminds us that the *need* for rights exists regardless. The step fails because it mistakes social recognition for ontological ground.

  ### The price of fixing it

  The price of fixing this is accepting an uncomfortable dualism. You keep Step (7) — your intrinsic worth — but you must admit that without institutional backing, that worth is politically defenceless. We lose the comforting notion that human rights are 'natural' laws waiting to be discovered like gravity. Instead, they are fragile agreements we build to protect brute facts like pain. This means rights are indeed constructed, but they are constructions *tracking* something real. We also lose the symmetry between money and rights. A £5 note is worthless without agreement; a suffering human is not. Consequently, we must acknowledge that while race and gender are constructed, they often latch onto biological or social realities that make them stubbornly real in their consequences. We cannot dismiss them as 'just' ideas, because ideas wield power. The cost is realising that morality requires constant maintenance; it is not a safety net provided by nature. We must fight for recognition rather than assuming it is inherent.

  ### Bottom line

  Ultimately, this leaves construction intact but nuanced. Race, gender and money are socially constructed because their meaning and value depend on collective agreement, not hidden biological essences. But 'constructed' does not mean 'illusory'. These categories shape material reality and distribute suffering. Human rights are similarly constructed institutions, designed to protect pre-social capacities like sentience. You can hold race is constructed without denying its impact, and rights constructed without denying worth. Construction applies differently to institutions than to sentient experience. Construction is the mechanism, not a denial of reality.
