      *   The "Fictional Syndrome" case: The user says it lacks institution. But the *clinical encounter* is the institution. Readers went to clinicians. So it *did* have institutional backing, just indirect. The user needs to accept that fiction can act as the vector for the loop.

  6.  **Developing the Predictions:**
      *   *Case A: Blood Test + Patient Community.*
          *   Biological marker = High constraint (Discovery side).
          *   Patient community culture = Feedback loop (Looping side).
          *   *Prediction:* The *biology* won't change, but the *illness experience* will. They will become "experts" in their biomarkers. The condition becomes a social identity. It's a "Biologically anchored Loop."
      *   *Case B: Algorithmic Diagnosis.*
          *   No doctor, just data patterns.
          *   *Prediction:* Accelerated Looping. Algorithms optimize for prediction, not understanding. If the algorithm flags you, and you act on it, you confirm the algorithm. It creates a "Black Box Loop." People might change behavior to game the algorithm or fit the profile without knowing why. High risk of "Made Up" traits because the logic is opaque.

  7.  **Refining the Voice:**
      *   The user is a writer. The protagonist is a thinker. The tone should be intellectual but grounded, not dryly academic. It needs to sound like a breakthrough for the character.
      *   Use the "Mirror vs. Engine" metaphor. Discovery = Mirror. Looping = Engine.
      *   Address the "Billing Code" gut feeling directly.

  8.  **Final Review against Constraints:**
      *   Did I state a principle? Yes.
      *   Did I say which verdicts to drop? Yes (the awareness requirement).
      *   Did I predict the new cases? Yes.
      *   Is it honest about the "Real vs. Made Up" tension? Yes, by reframing it.

  9.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure not to validate the "Billing Code" as *not* looping. The user's gut is right there. The principle must explain *why* the gut is right.
      *   *Correction:* Ensure the distinction between "Ontological Reality" (does the suffering exist?) and "Kind Reality" (is the category natural?) is clear. The user worries about saying something is "made up" implies the pain is fake. I need to reassure them that looping doesn't mean "fake."
      *   *Key Insight:* Hacking's point isn't that the people aren't suffering, but that the *way* they suffer is shaped by the label. I need to make sure the user's protagonist understands this distinction so she doesn't sound dismissive of patients.

  10. **Final Polish:** Check the flow. Ensure the "Principle" is punchy enough for a novel. (e.g., "The Consequence Principle"). Let's go with **"The Causal Feedback Principle."**

      *(Self-Correction on the Fictional Syndrome)*: The user says "no institution behind it." I need to challenge that. The *medical system* is the institution. The book was just the vector. The patients still had to go to a clinician to get it validated. So it *is* institutional.

      *(Self-Correction on ADHD)*: The user wants to say it has a "real core." The principle needs to allow for "Anchored Looping."

