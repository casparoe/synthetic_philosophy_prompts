      5.  *Retrospective:* No feedback loop possible (person is dead). -> **Anachronism.** (Matches user).
      6.  *Fictional Syndrome:* Readers took it to clinicians. The *idea* created the *symptoms*. -> **Pure Looping.** (Matches user).
      7.  *Billing Code:* Code -> Treatment -> Self-Description. The classification changed the outcome. -> **Looping.** (Fixes the user's inconsistency).

  5.  **Identifying Forced Drops/Adjustments:**
      *   The user's original principle ("labelled people must take up the label") must be dropped. The Billing Code case proves awareness isn't required; *consequence* is what matters.
