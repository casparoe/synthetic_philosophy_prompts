          5.  *Retrospective Diagnosis:* Anachronism (not looping).
          6.  *Fictional Syndrome (from previous book):* Purest looping (readers adopted it), but lacks institutional backing.
          7.  *Billing Code Only (patients don't know term, but get treatment):* User's principle says "not looping," but gut says "is looping."
      *   **Task:**
          1.  State a principle that captures as many verdicts as possible.
          2.  Honestly identify which verdicts must be dropped/adjusted to fit the principle.
          3.  Predict outcomes for two new cases: (a) Blood test condition + patient community culture, (b) Algorithmic diagnosis.
      *   **Constraint:** The writing group says "too academic," but this is how the protagonist *thinks*. The goal is clarity for the character's voice, not necessarily simplifying the concept for the reader (though the explanation needs to be clear).

  2.  **Deconstruct the Concept of "Looping Effects":**
      *   Origin: Ian Hacking ("Making Up People").
      *   Core Mechanism: Classification -> Knowledge/Expectation -> Behavior/Experience -> Modified Classification.
      *   Key Nuance: It doesn't mean the suffering isn't real. It means the *shape* of the suffering is co-constituted by the label.
      *   User's Conflict: The user wants to distinguish between "ontologically real" (biological) and "socially real" (looped), but acknowledges a spectrum (ADHD has a core + looping).

