  **C) Protected Group Definition**
  **Is: 6/10 | Ought: 8/10** — Lawyers argue this constantly to narrow or widen scope, but sticking to stable categories is crucial for the law to remain predictable and coherent.

  **D) Strategic/Political Cost**
  **Is: 10/10 | Ought: 0/10** — This is the real elephant in the room driving state decisions, but alliances and diplomacy should have absolutely zero bearing on legal truth.

  **E) Terminological Conservation**
  **Is: 4/10 | Ought: 2/10** — Some diplomats worry about "cry wolf" dilution, but withholding the truth to save a word's prestige is morally wrong regardless of frequency.

