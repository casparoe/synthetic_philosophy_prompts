answer: |-
  # Take-Home Final Examination
  **Course:** ML Safety and Philosophy Seminar  
  **Time Limit:** 48 Hours  
  **Word Limit:** 1200–1500 words  

  ## Prompt: The Limits of Ensemble Aggregation in Reward Modeling

  Consider a standard reinforcement learning from human feedback (RLHF) pipeline. You possess a large preference dataset labeled by a pool of human annotators. Instead of training a single reward model on the aggregate data, you randomly partition the *annotators* into $K$ disjoint groups. You then train $K$ reward models from the same base model architecture, using the same training recipe and hyperparameters, but with each model trained exclusively on the data from one annotator group.

  You proceed to train a policy via reinforcement learning. You are comparing two objective functions:
  1.  **MEAN-K:** The policy optimizes the arithmetic mean of the $K$ reward models.
  2.  **MIN-K:** The policy optimizes the minimum score assigned by the $K$ reward models (i.e., the score of the most dissatisfied model).

  The intuitive argument for MIN-K is that it prevents reward hacking specific to individual models. If a policy finds a quirk that fools one reward model but not the others, the minimum operator should penalize it, forcing the policy to find solutions that generalize across all annotator groups.

  Write an essay evaluating the claim that MIN-K provides robust safety against reward hacking compared to MEAN-K. Do not simply recount the general problem of Goodhart's Law; assume the reader understands why optimizing a proxy fails. Instead, analyze the specific mechanics of this setup. Your analysis must address the following:

  *   **Independence and Shared Bias:** The reward models share a base model and training recipe. How does this impact the independence of their errors, particularly when the policy moves off-distribution?
  *   **Order Statistics:** How does the behavior of the minimum function differ from the mean as $K$ increases? Consider the implications of veto power.
  *   **Optimization Pressure:** What kind of outputs does MIN-K select for? Does it suppress spurious features (like length or confidence markers), or does it amplify them?
  *   **Blandness and Hedging:** How does the requirement to satisfy all models simultaneously affect the policy's stylistic choices?
  *   **Information Limits:** Can changing the aggregation function solve the problem, or is the bottleneck the information content of the reward signals themselves?

  Conclude with a clear verdict on whether MIN-K is a viable strategy for alignment safety in this context.

  ***

  # Model Answer

  **Verdict: MIN-K Shifts Failure Modes Rather Than Solving Them**

  The claim that MIN-K provides robust safety against reward hacking is intuitively appealing but fundamentally flawed. While MIN-K mitigates the risk of exploiting idiosyncratic errors in individual reward models, it fails to address shared structural biases and introduces severe pathological incentives regarding output quality. Ultimately, MIN-K does not solve the alignment problem; it trades catastrophic specification gaming for systemic conservatism and stagnation.

  The primary failure of MIN-K lies in the false assumption of independence. The intuitive safety case relies on the idea that if one model is fooled, the others will catch the error. However, in this setup, all $K$ models are fine-tuned from the same base model using the same recipe. They share architectural inductive biases and likely share misconceptions about the task structure. When the policy moves off-distribution during optimization—a certainty in RL—the reward models must extrapolate. Because they share a base, their extrapolation errors will be highly correlated. If the base model mistakenly associates verbosity with quality, all $K$ models will likely reinforce this error. MIN-K cannot penalize a spurious feature that every model rewards. In fact, by requiring consensus, MIN-K may amplify shared spurious features. If a specific token sequence triggers a high reward signal due to a shared architectural bias, the policy will lock onto it aggressively, knowing it must satisfy the "lowest common denominator" of the ensemble.

  Furthermore, the statistical behavior of the minimum operator creates a veto dynamic that worsens as $K$ increases. In order statistics, the expected value of the minimum of $K$ samples decreases as $K$ grows, assuming any variance in the scores. In MEAN-K, high scores from some models can compensate for low scores from others, allowing the policy to pursue high-reward trajectories that might be controversial but valuable. In MIN-K, a single outlier model can veto a trajectory. As $K$ increases, the probability that at least one model assigns a low score due to noise rather than genuine misalignment approaches one. This forces the policy to optimize for the most pessimistic, noisy, or idiosyncratic annotator group. The optimization landscape becomes dominated by the need to avoid negative signals from the strictest judge, rather than the pursuit of genuine helpfulness.

  This dynamic directly incentivizes blandness and hedging. To satisfy all $K$ models simultaneously, the policy learns to avoid outputs that trigger strong negative reactions from any subgroup. Safe outputs are typically non-committal, verbose, and heavily qualified. A policy trained with MIN-K will likely converge on "safe" answers that say nothing substantive rather than risky answers that might be highly helpful but potentially controversial to one annotator group. This is a form of Goodharting on safety signals. The policy is not becoming more aligned with human values; it is becoming more aligned with the intersection of human risk aversion. It suppresses variance in output, which correlates strongly with suppressing utility in complex tasks.

  Finally, we must consider the information theoretic limit. Changing the aggregation function from Mean to Min does not add new information about the true human preference function. It merely processes existing noisy signals differently. If the reward models are fundamentally misaligned with true human welfare—a likely scenario given they are proxies based on limited preference data—aggregating them more conservatively does not recover the missing information. It simply constrains the optimization to a smaller subspace of the proxy manifold. The core issue in reward hacking is not that we are optimizing the average proxy too hard; it is that the proxy itself is incomplete. No aggregation of $K$ flawed maps yields a true territory. Unless the annotator partitioning captures distinct, complementary dimensions of value that are currently being ignored (which is unlikely given random partitioning), MIN-K is just squeezing a balloon: the pressure moves, but the volume of error remains.

  In conclusion, MIN-K is not a viable strategy for robust alignment safety. It protects against uncorrelated noise but amplifies correlated bias. It induces a conservative veto power that stifles capability and incentivizes blandness. While it may prevent specific types of obvious hacking where models disagree, it fails to prevent hacking on shared blind spots and ultimately optimizes for the lowest common denominator of approval. Safety improvements must come from improving the information content of the reward signal or the base model's understanding, not from mathematical conservatism in the aggregator.

  ***

  # Marking Scheme (20 Marks Total)

  **1. Independence and Shared Bias (4 Marks)**
  *   **Full Marks:** Identifies that shared base model and training recipe lead to correlated errors, especially off-distribution. Notes that MIN-K cannot fix shared blind spots.
  *   **Common Error:** Assumes reward models are independent because annotators are different, ignoring the model architecture's influence on error correlation.

  **2. Order Statistics and Veto Power (4 Marks)**
  *   **Full Marks:** Explains that the expected minimum decreases as $K$ increases. Discusses how a single noisy or strict model can veto high-reward trajectories (pessimistic bias).
  *   **Common Error:** Treats the minimum as a stable "safety floor" rather than a statistic that becomes more restrictive and noisy as $K$ grows.

  **3. Optimization Pressure and Spurious Features (4 Marks)**
  *   **Full Marks:** Analyzes whether shared spurious features (e.g., length) are suppressed or amplified. Correctly identifies that shared features are likely amplified or unaffected, not suppressed.
  *   **Common Error:** Assumes MIN-K automatically suppresses all spurious features because it is "stricter," failing to distinguish between unique and shared quirks.

  **4. Blandness and Hedging (4 Marks)**
  *   **Full Marks:** Connects the veto mechanism to output quality. Argues that satisfying all models incentivizes non-committal, low-variance, or hedged outputs (lowest common denominator).
  *   **Common Error:** Focuses only on safety without considering the trade-off in capability or usefulness (blandness).

  **5. Information Limits (4 Marks)**
  *   **Full Marks:** Concludes that aggregation does not add new information about ground truth. Argues that the fix requires better signals, not just different math.
  *   **Common Error:** Suggests that MIN-K solves the underlying alignment gap or treats the aggregator as a source of truth rather than a processor of proxies.

  ***

  # Grading Notes

  **Distinguishing A from B**
  *   **A Grade:** Synthesizes the five points into a coherent argument that drives toward a specific verdict. The essay flows logically from the mechanics of the model to the behavioral incentives to the philosophical limit.
  *   **B Grade:** Addresses all five points correctly but treats them as a checklist. The essay reads as "Point 1, Point 2, Point 3" without connecting how the order statistics drive the blandness, or how the shared bias undermines the information limit.

  **Reasonable Pushback**
  *   A student might reasonably argue that in high-stakes domains (e.g., medical advice), the trade-off of blandness for reduced catastrophic failure is acceptable, even if it doesn't solve "alignment" in the general sense. They could argue MIN-K is a valid *constraint* for specific deployment contexts, even if it is not a general solution to Goodharting.
