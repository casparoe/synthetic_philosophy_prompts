prompt: |-
  In three weeks I am presenting a paper at a small metaphysics workshop, and what I want from you is a Q&A prep sheet rather than a defense of the view. Below is my thesis, an abbreviated version of the argument, and a description of the room. What I need is the question period.

  **Thesis.** The familiar metaontological disputes — whether the quantifier is fully unrestricted, whether mereological sums exist, whether there are composite objects at all, whether there are propositions — are not factual disputes. But they are also not *merely verbal*, in the sense that verdict is normally meant to carry. They are cases of what I call load-bearing notational variance: the competing languages are intertranslatable, but they differ in which consequences they make easy for a competent but non-ideal inquirer to notice, check, and be tempted to draw. Metaontology should therefore become notational pluralism *with a ranking*: existence questions have no answer beyond the choice of notation, but the choice is not arbitrary, because notations can be ordered by their inferential affordances relative to a specified research program, and that ordering is a question about proof length, search complexity, and error rates rather than a question about taste.

  **Argument sketch.** (1) Call two candidate notations strongly intertranslatable when there is a recursive translation mapping each sentence of the one onto a sentence of the other that preserves truth value across the relevant class of models. Strong intertranslatability entails that there is no factual disagreement left between the parties. (2) Some strongly intertranslatable pairs are inert: the choice between them makes no difference to anything anyone goes on to do — the analog, in a formal setting, of a proof assistant's syntactic sugar that is mechanically expanded before processing. (3) Other pairs are load-bearing: the notations differ in inferential affordance. One makes a certain class of consequence visible in a two-line derivation; the other buries it behind a page of paraphrase. (4) The metaontological cases are of the second kind, which is why the disputes feel substantive and why they refuse to dissolve when the parties agree on meaning. (5) Hence the ranking in the thesis: the residual disagreement is about which research program to serve plus a partly formal, partly empirical question about affordance, and that question has an answer.

  **The room.** Twelve people. Three ontological realists of the joint-carving stripe, who think there is a privileged structure and that the job of metaphysics is to find it. Two quantifier-variantist deflationists in the Carnapian tradition, happy to say the disputes are verbal and tolerant about which language you like. One person who works on verbal disputes and conceptual ethics and will care about my criteria more than my conclusions. Two easy-ontology people, who think existence questions are settled trivially once the relevant terms are in place and that the interesting questions lie elsewhere. The remaining four are general metaphysicians who regard ontology as a substantive inquiry and are antecedently hostile to any deflationary diagnosis. Nobody in the room works on proof complexity, formal epistemology, or anything that would let them assess the empirical claim in step (5).

  **What I want.** The seven or eight objections I will actually get, ordered by how likely they are multiplied by how much damage they do, each phrased the way the relevant subgroup would phrase it and not the way I would paraphrase it afterward. For each: a reply I can deliver in about ninety seconds, and a candid note on where that reply is soft. Separately: what I should concede in the first two minutes before anyone asks, the single reply that has to land if the paper is to survive at all, and the question I am hoping nobody asks.

  Two standing constraints on your answer. First, assume I have already read the standard moves on all sides; don't give me the survey. Second, and most important: keep separate what is genuinely settled among people who work on these topics from what is contested, and never present a contested diagnosis as the received view. In particular, flag explicitly which steps of my argument rest on premises that a substantial number of specialists reject, which of my distinctions are doing work that no one has shown they can do, and where my step (5) is closer to a promissory note than to a result.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **Task:** Create a Q&A prep sheet for a metaphysics workshop presentation.
      *   **Input:** Thesis (Metaontological disputes are load-bearing notational variance, ranked by inferential affordance), Argument Sketch (5 steps involving intertranslatability, inert vs. load-bearing, ranking by proof complexity/affordance), Room Composition (12 people: 3 Joint-Carving Realists, 2 Carnapian Deflationists, 1 Conceptual Ethicist, 2 Easy Ontologists, 4 Hostile General Metaphysicians).
      *   **Output Requirements:** 7-8 objections (ranked by likelihood $\times$ damage), phrased in the questioner's voice, 90-second replies, candid notes on soft spots. Plus: Early concessions, the "must-land" reply, and the "hope nobody asks" question.
      *   **Constraints:** No standard survey material (assume knowledge). Distinguish settled vs. contested claims. Flag premises rejected by specialists, distinctions doing unproven work, and where Step 5 is a promissory note.

  2.  **Deconstruct the Thesis & Argument:**
      *   *Core Claim:* Ontological disputes aren't factual (no truth of the matter) but aren't merely verbal (not arbitrary). They are about *inferential affordance* (proof length, search complexity, error rates).
      *   *Key Move:* Step 1 (Strong Intertranslatability) $\rightarrow$ No factual disagreement. Step 4 & 5 (Load-bearing + Ranking) $\rightarrow$ Substantive choice based on utility/efficiency.
      *   *Vulnerabilities:*
          *   Step 1: Do realists accept intertranslatability implies no factual disagreement? (Likely not).
          *   Step 5: The "ranking" criteria (proof length, etc.) are technical and the author admits the audience lacks this background. This is the biggest "promissory note."
          *   "Notational Variance": Is this just verbal disputes dressed up in computational clothing?
          *   "Research Program": Who specifies the goal? If goals differ, ranking differs.

  3.  **Analyze the Room (Audience Profile):**
      *   *Joint-Carving Realists (3):* Will attack Step 1. They believe one notation *carves nature at the joints*. Intertranslatability doesn't erase ontological commitment.
      *   *Carnapian Deflationists (2):* Will like the "no factual dispute" part but might worry the "ranking" reintroduces substantivity they want to avoid. Or they might ask why we need a ranking if it's just pragmatic.
      *   *Conceptual Ethicist (1):* Will focus on the criteria for ranking. Who decides the "research program"? What are the normative implications?
      *   *Easy Ontologists (2):* Might think this is overcomplicating trivial existence claims.
      *   *Hostile General Metaphysicians (4):* Will smell deflationism. They will attack the idea that existence questions have "no answer." They will target Step 5 as vague.

  4.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Realist Attack):* Focus on Step 1. Intertranslatability $\neq$ Same Fact.
          *   *Voice:* "You assume translation preserves *ontology*, but it only preserves truth conditions."
          *   *Damage:* High. Undermines the "not factual" claim.
          *   *Reply:* Distinguish truth-conditions from ontological commitment.
          *   *Soft Spot:* Realists deny this distinction is coherent.

      *   *Objection 2 (The Hostile Metaphysician):* Focus on Step 5. "Proof length" is not "Existence."
          *   *Voice:* "You've changed the subject. We want to know what exists, not what's easy to say."
          *   *Damage:* High. Accuses of evasion.
          *   *Reply:* There is no "what exists" independent of the language used to ask.
          *   *Soft Spot:* Feels like linguistic idealism.

      *   *Objection 3 (The Carnapian):* Why the ranking?
          *   *Voice:* "If it's verbal, why do we need a rigid ranking? Isn't that just pragmatism?"
          *   *Damage:* Medium. Threatens the "not merely verbal" claim.
          *   *Reply:* Because some verbal choices cripple inquiry.
          *   *Soft Spot:* Blurs line between verbal and substantive.

      *   *Objection 4 (The Conceptual Ethicist):* Who sets the research program?
          *   *Voice:* "Affordance relative to *what*? Physics? Folk intuition? Who decides?"
          *   *Damage:* Medium-High. Makes the ranking arbitrary.
          *   *Reply:* It's relative to explicit goals, not absolute.
          *   *Soft Spot:* If goals conflict, there's no arbitration.

      *   *Objection 5 (The Easy Ontologist):* Triviality.
          *   *Voice:* "Existence is easy. Why make it about notation complexity?"
          *   *Damage:* Low-Medium.
          *   *Reply:* Easy ontology assumes a specific notation.
          *   *Soft Spot:* Might just talk past each other.

      *   *Objection 6 (The Technical/Step 5 Attack):* The Promissory Note.
          *   *Voice:* "You cite proof complexity, but you haven't shown the metrics. This is hand-waving."
          *   *Damage:* High (Credibility).
          *   *Reply:* It's a framework proposal, not a completed calculus.
          *   *Soft Spot:* It *is* hand-waving right now.

      *   *Objection 7 (The "Lost Content" Worry):*
          *   *Voice:* "If I say 'sums exist' and you say 'they don't' but we translate, haven't we lost the *point* of the disagreement?"
          *   *Damage:* Medium.
          *   *Reply:* The point was always about utility, not fact.
          *   *Soft Spot:* Disagreement feels real to participants.

  5.  **Refining and Ranking:**
      *   Need to order by Likelihood $\times$ Damage.
      *   *Top:* Realist attack on Step 1 (Fundamental). Hostile attack on Step 5 (Evasion). Technical attack on Step 5 (Vagueness).
      *   *Middle:* Conceptual Ethicist (Goals). Carnapian (Why rank?).
      *   *Lower:* Easy Ontologist. Lost Content.

  6.  **Developing the "Must-Land" and "Concessions":**
      *   *Concessions:* Acknowledge Step 5 is programmatic. Acknowledge Realists won't accept Step 1.
      *   *Must-Land:* The distinction between "factual" and "arbitrary." The third way.
      *   *Hope Nobody Asks:* "What is the *correct* research program?" (Leads to relativism or dogmatism).

  7.  **Checking Constraints:**
      *   *Settled vs. Contested:* Must flag that Intertranslatability $\rightarrow$ No Fact is *highly* contested (Realists deny it). Must flag that Proof Complexity applies to Ontology is *novel/unproven*.
      *   *Voice:* Ensure objections sound like the specific subgroups (e.g., Realists talk about "structure," Carnapians about "frameworks," Hostiles about "evasion").

  8.  **Final Polish:**
      *   Ensure the "Candid Note on Soft Spots" is truly candid.
      *   Ensure the 90-second replies are concise.
      *   Check the "Promissory Note" flagging in Step 5.

      *(Self-Correction during drafting)*: I initially thought about putting the Carnapian objection higher. But in a room with 4 hostile metaphysicians and 3 realists, the pressure will be on the "no factual dispute" claim. The Carnapians are likely allies on that, just worried about the "ranking." The Realists are the existential threat. I need to prioritize the Realist/Hostile objections. Also, I need to make sure I explicitly flag Step 1 as contested, as per the prompt's instruction.

      *(Refining the "Step 5" critique)*: The prompt says nobody in the room works on proof complexity. This means they can't assess the math, but they *can* assess the philosophical relevance. The objection shouldn't be "your math is wrong," it should be "why does math matter to metaphysics?"

      *(Refining the "Concessions")*: The prompt asks what to concede in the first two minutes. This is strategic. Conceding the "promissory note" status of Step 5 pre-empts the "hand-waving" objection. Conceding that Realists won't like Step 1 builds credibility.

      *(Final check on constraints)*: "Keep separate what is genuinely settled... from what is contested." I need to add a specific section or embed flags clearly. I will embed flags in the "Candid Note" and the "Concessions" section to ensure visibility.

      *(Wait, one more thing)*: The prompt asks for "the single reply that has to land if the paper is to survive at all." This is the core distinction: Factual vs. Arbitrary vs. Load-Bearing. If they don't grasp this trichotomy, the paper fails.

      *(Let's assemble the document.)*
answer: |-
  # Q&A Prep Sheet: Load-Bearing Notational Variance

  ## Strategic Overview & Constraint Flags

  **Contested Premises (Must Flag):**
  *   **Step 1 (Intertranslatability $\rightarrow$ No Fact):** This is **highly contested**. Joint-carving realists explicitly reject the claim that truth-conditional equivalence eliminates ontological disagreement. They argue one notation tracks *structure* and the other does not, regardless of translation. Do not present this as a neutral starting point.
  *   **Step 5 (Proof Complexity as Metaphysical Criterion):** This is a **promissory note**. There is no established literature mapping proof-theoretic complexity to ontological utility. You are proposing a new metric. Do not present this as an established result.
  *   **"Merely Verbal":** The distinction between "merely verbal" and "load-bearing verbal" is your innovation. Standard verbal dispute literature (e.g., Chalmers, Hirsch) does not typically grade verbal disputes by inferential cost.

  **Early Concessions (First 2 Minutes):**
  1.  **To the Realists:** Acknowledge upfront that your Step 1 assumes a deflationary view of quantification that they reject. State clearly: *"I am not arguing you are wrong about structure; I am arguing that even if we grant intertranslatability, the choice of notation remains non-arbitrary."* This prevents them from spending their question time re-hashing the definition of ontology.
  2.  **To the Technical Skeptics:** Acknowledge Step 5 is programmatic. *"I am not offering a completed calculus of ontological complexity today. I am offering a framework for why the complexity question matters."*
  3.  **The "Third Way" Pitch:** Explicitly state that you are rejecting the dichotomy between "Factual Dispute" and "Merely Verbal/Trivial." If the audience forces you back into that binary, the paper fails.

  **The Single Reply That Must Land:**
  You must successfully distinguish **Load-Bearing Variance** from ** Mere Pragmatics**. If the audience reduces your view to "just pick the language that's easier," you become a Carnapian pragmatist. You need to land the idea that *inferential affordance constrains what theories can be discovered*, making the choice objective relative to a goal, not just a matter of taste.

  **The Question You Hope Nobody Asks:**
  *"What determines the correct research program?"*
  If the ranking is relative to a program (e.g., unification with physics vs. alignment with folk intuition), and two programs conflict, your view offers no arbitration. This risks collapsing into relativism.

  ---

  ## The Objections (Ranked by Likelihood $\times$ Damage)

  ### 1. The Joint-Carving Realist (Likelihood: High | Damage: Critical)
  **Voice:** "You claim that strong intertranslatability eliminates factual disagreement. But on the joint-carving view, two languages can be truth-conditionally equivalent while one tracks the fundamental structure of reality and the other obscures it. Translation preserves truth, not structure. So your Step 1 begs the question against the realist. Why shouldn't we say the dispute *is* factual because one notation is simply more *accurate* to the world?"

  **90-Second Reply:**
  "I grant that if there is a privileged structure, the dispute is factual. My argument is conditional: *if* we accept intertranslatability as the criterion for factual equivalence, then the residual disagreement isn't about the world, but about the tool. I'm not trying to convince you to abandon joint-carving; I'm arguing that even *within* a joint-carving framework, you need a metric to choose between structurally equivalent notations. My 'ranking' is that metric. You can keep your structure, but you still need to explain why one structural description is more *usable* for inquiry than another."

  **Candid Note on Soft Spot:**
  This reply concedes too much. If they insist structure *is* the fact, your "notational" diagnosis dissolves. You are relying on them accepting that usability matters *independently* of structure, which they might deny (they think structure *guides* usability).

  ### 2. The Hostile General Metaphysician (Likelihood: High | Damage: Critical)
  **Voice:** "This feels like a category error. We ask 'Do composite objects exist?' and you answer 'It depends on which notation makes proofs shorter.' You've changed the subject from *existence* to *convenience*. If I ask whether there is a chair here, I don't care about the search complexity of the proposition. I care about the chair. Doesn't this render ontology subservient to computer science?"

  **90-Second Reply:**
  "It's not about convenience; it's about cognitive access. If a notation buries a consequence behind a page of paraphrase, a non-ideal inquirer will miss it. That changes the theory they build. Ontology isn't just about what's 'out there'; it's about the theoretical framework we use to track it. If one notation systematically leads to errors or blinds us to generalizations, it's a worse ontological tool. I'm not saying existence *is* proof length; I'm saying our *access* to existence claims is mediated by notation, and we should optimize that mediation."

  **Candid Note on Soft Spot:**
  This risks sounding like verificationism or linguistic idealism. The realist will press: "So if the proof is long, the object exists less?" You must hold the line that existence is binary, but *theoretical utility* is graded.

  ### 3. The "Promissory Note" Challenge (Likelihood: Medium | Damage: High)
  **Voice:** (Likely from a General Metaphysician or the Conceptual Ethicist) "You lean heavily on Step 5: ranking by proof length and error rates. But you haven't defined the metric. How do you measure the 'complexity' of an ontological claim? Is it symbol count? Derivation steps? Until you show the math, this is just a metaphor for 'I like this language better.' Isn't Step 5 doing all the work without any actual support?"

  **90-Second Reply:**
  "That's a fair criticism of the current draft. Step 5 is a framework proposal, not a finished calculus. However, the lack of a metric doesn't invalidate the distinction. We know intuitively that some formalisms make certain truths 'obvious' and others 'obscure.' My claim is that this intuitive difference is objective and measurable, even if I haven't provided the ruler today. The burden is on me to develop the metric, but the burden is on the field to acknowledge that notational choice has cognitive consequences."

  **Candid Note on Soft Spot:**
  This is your weakest point. It *is* a metaphor right now. If they press for a concrete example (e.g., "Show me the proof length difference for Mereological Universalism"), you might stumble if you haven't prepped a formal toy model.

  ### 4. The Conceptual Ethicist (Likelihood: Medium | Damage: Medium)
  **Voice:** "You say the ranking is relative to a 'specified research program.' But who specifies the program? If the physicist wants one notation and the phenomenologist wants another, your view says there's no fact of the matter about which is 'better.' Doesn't this fragment ontology into incompatible silos? What happens when the research programs conflict?"

  **90-Second Reply:**
  "It does fragment ontology, but I argue that's already the case. We already use different ontologies for quantum mechanics and everyday objects. My view makes this explicit and manageable. When programs conflict, we don't look for a 'true' ontology; we negotiate the trade-offs. We ask: 'Do we value unification with physics more than alignment with folk intuition?' That's an ethical/pragmatic choice, not a metaphysical discovery. My framework makes the cost of that choice visible."

  **Candid Note on Soft Spot:**
  This invites the "Relativism" charge. If ontology is just about research programs, does it lose its normative force? The ethicist might worry this excuses lazy thinking ("It's just my program").

  ### 5. The Carnapian Deflationist (Likelihood: Medium | Damage: Low)
  **Voice:** "I'm sympathetic to the 'no factual dispute' claim. But why introduce this 'load-bearing' machinery? Why not just say it's a pragmatic choice of linguistic frameworks? Adding 'inferential affordance' sounds like you're trying to sneak substantivity back in. If it's verbal, let it be verbal. Why the ranking?"

  **90-Second Reply:**
  "Because 'pragmatic choice' sounds arbitrary, like choosing between French and German. But notational variance in metaphysics isn't like natural language; it's like choosing between Euclidean and Non-Euclidean geometry for a specific task. One might be 'wrong' for the task. The ranking explains *why* we fight so hard about these verbal disputes: because the cognitive costs are high. I want to preserve the deflationary ontology but explain the intensity of the disagreement."

  **Candid Note on Soft Spot:**
  Carnapians might not care about the intensity of the disagreement. They might think you're over-intellectualizing a simple tolerance principle.

  ### 6. The Easy Ontologist (Likelihood: Low | Damage: Low)
  **Voice:** "We think existence questions are trivial. 'Do tables exist?' Yes, if the concept is satisfied. Your view makes it sound hard again. Why complicate the trivial with proof complexity? Isn't the dispute only hard because people are confused about concepts?"

  **90-Second Reply:**
  "Easy ontology assumes a specific, usually permissive, notation. My point is that even if existence is trivial *within* a notation, choosing that notation isn't trivial. If you choose a restrictive notation, the answer changes. Easy ontology solves the internal question; I'm addressing the external choice of which internal rules to adopt."

  **Candid Note on Soft Spot:**
  Easy Ontologists might argue the external choice *is* trivial (just pick the permissive one). You need to argue why permissiveness isn't always the optimal affordance (e.g., it might obscure distinctions).

  ### 7. The "Lost Content" Worry (Likelihood: Low | Damage: Medium)
  **Voice:** (General Metaphysician) "When I argue with a mereological nihilist, I feel like I'm disagreeing about the world, not the notation. If you tell me we're just using different notations, you're telling me my intuition is wrong. Are you saying all metaphysicians are confused about what they're doing?"

  **90-Second Reply:**
  "I'm saying metaphysicians are often fighting over the best tool while believing they're fighting over the job site. The intuition of substantivity comes from the *load-bearing* nature of the choice. It feels substantive because the consequences are real, even if the source is notational. I'm not calling you confused; I'm offering a better explanation for why the disagreement persists despite intertranslatability."

  **Candid Note on Soft Spot:**
  This is psychologically difficult for the audience to accept. It requires them to admit they might be misdiagnosing their own project.

  ### 8. The "Inert vs. Load-Bearing" Boundary (Likelihood: Low | Damage: Medium)
  **Voice:** (Conceptual Ethicist) "How do we distinguish 'inert' notational variance from 'load-bearing'? You say inert is like syntactic sugar. But couldn't a realist argue that *all* ontological variance is load-bearing because it reflects structure? Where is the line?"

  **90-Second Reply:**
  "The line is empirical. If switching notations changes the derivation length or error rate for a specific class of inferences, it's load-bearing. If it doesn't change anything about how we reason or what we discover, it's inert. We can test this. It's not a metaphysical postulate; it's a claim about cognitive and formal performance."

  **Candid Note on Soft Spot:**
  This relies on the "empirical" claim which, as noted in Step 5, is currently unsupported. A realist will argue that structural fidelity *is* a performance metric you are ignoring.

  ---

  ## Final Prep Checklist

  1.  **Watch the Binary:** If anyone asks "So is there a fact of the matter or not?", stop. Do not say "No." Say: "There is no fact of the matter *independent of the notation*, but there is a fact of the matter about which notation serves our goals."
  2.  **Defend Step 5's Vagueness:** If pressed on the lack of formal metrics, pivot to *examples*. Have one ready (e.g., how Universalism makes parthood transitive trivially, while Nihilism requires complex paraphrase).
  3.  **Manage the Realists:** Do not try to convert the 3 Joint-Carvers. Try to neutralize them. If they accept that *even if* structure exists, utility matters, you win enough room to breathe.
  4.  **The "Promissory Note" Flag:** In your closing remarks, reiterate that Step 5 is a call for collaboration with formal epistemologists, not a finished theorem. This disarms the "you haven't proven this" objection.

  **Remember:** Your goal is not to prove ontology is fake. Your goal is to prove that *choosing an ontology* is a substantive, non-arbitrary engineering problem, even if the "existence" claims themselves are not factual. Keep the focus on the *choice*, not the *objects*.
