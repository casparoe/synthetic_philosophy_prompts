  This is not sloppiness. You have identified a specific, robust, and largely untheorized mechanism in how ontological commitments are actually deployed in practice. You are describing a gap between the *metaphysics people profess* (which is usually stable, asymmetric, and objective) and the *metaphysics people practice* (which is fluid, symmetric, and teleological).

  You asked for the carving, not just the label. Here is the dissection of the phenomenon, its relation to the existing literature, and a proposal for how to name and define it.

  ### 1. The Carving: What exactly is happening?

  You have identified three symptoms, but they are manifestations of a single underlying mechanism.

  1.  **The Priority Flip:** (Statue vs. Lump).
  2.  **The Counting Flip:** (One Work vs. Two Entries).
  3.  **The Indispensability of the Demoted:** (The "derivative" entity is causally required).

  These are not three phenomena. They are one phenomenon: **The assignment of ontological priority is being driven by discursive utility, but is being reported as metaphysical structure.**

  In your examples, the conservator and the curator are not disagreeing about the *world* (they agree on the bronze, the shape, the history). They are disagreeing about which node in the dependency network gets to be the **Substance** (the thing that acts/bears properties) and which gets to be the **Attribute** (the thing that is borne/described).

  Crucially, as you noted, the dependency network itself doesn't change. The bronze is always required for the shape; the shape is always required for the work-identity. What changes is which dependency is treated as **grounding** and which is treated as **grounded**. When the goal is preservation, the bronze grounds the shape. When the goal is attribution, the shape grounds the bronze.

  The "sloppiness" you suspect is actually a feature of how professional ontology works: it is **retroactive**. The metaphysical story is told *after* the practical job is identified, to legitimize the job.

  ### 2. The Literature: Why the standard labels fail

  You mentioned three nearby candidates. Here is why they do not capture the "flip."

  **A. Causal Exclusion / Overdetermination (Kim, Bennett)**
  *   **The View:** If the lump causes the damage, the statue doesn't need to. If both cause it, causation is overdetermined. To save causation, we eliminate one.
  *   **Why it fails:** You observed that *both* are causally relevant in both contexts. The conservator needs the "work" to define damage (normative causation); the curator needs the "metal" to date the piece (physical causation). The exclusion argument demands one be eliminated to save efficacy. Your observation shows both are kept, but the *credit* for efficacy flips. This isn't exclusion; it's **credit allocation**.

  **B. Quantifier Variance / Verbal Disputes (Hirsch, Carnap)**
  *   **The View:** The conservator and curator speak different "languages." In Language A, "exists" means physical continuity. In Language B, "exists" means artistic intention. They aren't disagreeing; they are talking past each other.
  *   **Why it fails:** You noted the *same person* flips within a *single conversation*. Quantifier variance requires stable frameworks. If the curator says "Strictly speaking there is no statue" at 10:00 AM and "This statue is valuable" at 10:15 AM, they haven't switched languages; they have switched **ontological privileging** within the same language.

  **C. Nothing-Over-and-Above / Grounding (Fine, Schaffer)**
  *   **The View:** The statue is nothing over and above the lump. The lump grounds the statue. Grounding is asymmetric and worldly.
  *   **Why it fails:** Grounding is supposed to be a feature of reality, invariant to our interests. If the lump grounds the statue, it should do so in the conservation room *and* the catalogue essay. Your observation shows the grounding relation itself is treated as **interest-relative**. The metaphysics is tracking the pragmatics, not the world.

  ### 3. Is it one phenomenon or three?

  It is **one phenomenon**.

  The "Counting Flip" (one work vs. two entries) and the "Priority Flip" (matter vs. form) are the same move. To count the object as *one* (the conservation file) is to privilege the material continuity. To count it as *two* (the catalogue entries) is to privilege the intentional history.

  The "Indispensability of the Demoted" is the tell-tale sign that confirms it is one phenomenon. If this were genuine metaphysical disagreement, the demoted entity would be eliminable. The fact that the conservator *needs* the "work" to define damage proves that the "work" is ontologically robust, regardless of whether they verbally demote it.

  The unifying mechanism is **Teleological Substantialization**: The entity that serves the current *telos* (goal) of the discourse is promoted to "Substance." The entity that constitutes it is demoted to "Matter." When the *telos* shifts, the promotion shifts.

  ### 4. The Name and Definition

  There is no established term for this specific intra-discursive flipping of ontological priority. The closest existing concept is **Interest-Relative Ontology** (analogous to Interest-Relative Invariance in epistemology), but that usually applies to *existence* conditions, not *priority* relations.

  I propose we coin the term: **Pragmatic Ontological Privileging (POP)**.

  **Definition:**
  > **Pragmatic Ontological Privileging** occurs when participants in a discourse assign asymmetric ontological status (e.g., Substance vs. Attribute, Real vs. Derivative, Primary vs. Secondary) to coinciding entities, where the assignment tracks the **pragmatic salience** of the entity relative to the discourse goal, rather than invariant metaphysical structure, and where the participants treat the assignment as objective despite its contextual variability.

  **Key Criteria for POP:**
  1.  **Coincidence:** Two or more descriptions apply to the same spatiotemporal region.
  2.  **Asymmetry:** One description is treated as ontologically primary.
  3.  **Fluidity:** The primary description flips when the discourse goal changes.
  4.  **Invisibility:** Participants do not acknowledge the flip; they treat the current privilege as absolute.
  5.  **Interdependence:** The "demoted" entity remains causally or conceptually necessary for the "primary" entity to function.

  ### 5. The Borderline Case

  A good definition must settle a borderline case. Here is one:

  **The Case of the Human Corpse.**
  *   **Context A (Pathology):** The pathologist says, "Strictly speaking, there is no 'person' here, only a body. The person ceased at death." (Body is Substance, Person is Derivative/Gone).
  *   **Context B (Probate Law):** The lawyer says, "The deceased's estate retains rights. We must respect the wishes of the person." (Person is Substance, Body is Evidence/Vehicle).

  **Does POP apply here?**
  *   **Yes:** The priority flips based on the goal (medical analysis vs. legal rights). The demoted entity is still indispensable (the lawyer needs the body to prove death; the pathologist needs the "person" concept to identify next of kin).
  *   **No (The Borderline):** Unlike the statue, there are **ethical constraints** that resist the flip. A pathologist cannot treat the body as *mere* matter (e.g., they cannot sell it for parts) even if their ontology says "no person." A lawyer cannot treat the person as *purely* abstract (they need the death certificate).

  **Why this matters for the definition:**
  A robust definition of POP must distinguish between **unconstrained pragmatic flipping** (the statue) and **constrained pragmatic flipping** (the corpse).
  *   **Statue:** The flip is total. The conservator can genuinely treat the shape as disposable.
  *   **Corpse:** The flip is partial. The ontology flips, but the *normative status* does not fully align.

  If your definition of POP covers the statue but excludes the corpse, it is too narrow (it misses the mechanism). If it covers both equally, it is too broad (it misses the ethical friction).
  **The Carving:** POP is present in both, but in the **Corpse Case**, the *Indispensability Criterion* (Point 5 above) exerts normative force that prevents the *Invisibility Criterion* (Point 4) from holding. The pathologist *knows* they are demoting the person, and feels the weight of it. The conservator *does not feel* they are demoting the statue; they feel they are correcting a misconception.

  Therefore, the **purest case of POP** is where the flip is **phenomenologically invisible** to the speaker. The statue case is a better exemplar than the corpse case because the ethical stakes in the corpse case make the ontological slippage visible (as a moral tension).

  ### Summary
  You are observing **Pragmatic Ontological Privileging**. It is not a bug in metaphysics; it is a feature of professional practice. Metaphysics is being used as a **tool of authorization**, not a map of reality. The conservator says "There is no statue" to authorize cutting away the patina. The curator says "There is no lump" to authorize insuring the artwork. The "reality" is the tool that gets the job done.
