prompt: |-
  I'm in a seminar on early modern political theory and we're on Machiavelli's The Prince, and I keep getting stuck on the river passage in chapter 25, which I think is the whole fortune-vs.-virtù argument condensed into one image. I'm reading the W. K. Marriott translation, and here's the bit that's giving me trouble:

  "I compare her to one of those raging rivers, which when in flood overflows the plains, sweeping away trees and buildings, bearing away the soil from place to place; everything flies before it, all yield to its violence, without being able in any way to withstand it; and yet, though its nature be such, it does not follow therefore that men, when the weather becomes fair, shall not make provision, both with defences and barriers, in such a manner that, rising again, the waters may pass away by canal, and their force be neither so unrestrained nor so dangerous."

  What's bugging me is that earlier in the same chapter he says fortune is "the arbiter of one half of our actions, but that she still leaves us to direct the other half, or perhaps a little less," and then later he keeps hammering that success depends on matching your method to "the spirit of the times" and changing your course when the times change. I've been going back and forth on this with a classmate and we just keep going in circles. I'm not sure these three things fit together: the dike sounds like if you prepare well in a calm spell you can basically neutralize fortune's destructive power, which would make her arbitrate way less than half (and that "or perhaps a little less" hedge makes me think he's quietly tilting it toward us), but the "spirit of the times" part sounds like the times keep shifting without warning, which makes me doubt you could ever trust a calm spell long enough to build the dike in the first place. Can you walk me through how the river metaphor, the "half" claim, and the "spirit of the times" argument are supposed to work together, or tell me honestly where they pull apart? Keep it under 300 words and don't just summarize the chapter, I want the actual tension.
