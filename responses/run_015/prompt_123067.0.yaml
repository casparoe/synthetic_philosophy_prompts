      *   **Turingian Inversion:** The Imitation Game. The machine manipulates symbols (syntax) without semantics (understanding). Competence (passing the test) is recognised by the human judge. The "intelligence" is arguably attributed by the observer, or perhaps the user is suggesting the *validation* comes from the outside.
      *   **The "Asymmetry":**
