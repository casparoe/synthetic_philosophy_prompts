      *   **The LLM Claim:** LLMs are trained on static data (corpus of past comprehension). They don't have evolutionary pressure (no death/reproduction based on output quality during training, though RLHF adds a layer). They don't have a live judge *constituting* the intelligence (they generate text regardless of a judge).
