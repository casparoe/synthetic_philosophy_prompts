  I work in simulation and data tooling rather than philosophy, and I ran into the doomsday argument sideways: I implemented it as a Monte Carlo to find out whether the effect was real or just rhetorical, and I can no longer tell which parts of the output come from the argument and which from choices I made in the sampler. I would like a credence with its decomposition, not a survey of what has been said about the argument. I cannot evaluate a literature I cannot read, so please reason from the setup below and do not point me at papers, positions, or names I would have to look up.

