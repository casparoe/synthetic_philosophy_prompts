prompt: |-
  I just got voted onto the standards committee of my professional association (nursing, about 4,000 members in the state chapter) and I am definately in over my head. Here's the problem. Two years ago we finally passed a real ethics code after the whole mess with the previous board. Now people keep filing complaints about things members did *before* the code existed. Technically allowed back then, or at least nobody ever wrote down that it wasn't. And I keep noticing that the people pushing hardest for us to go after the old guard are a lot of the same people who were in the room while all of it was happening. The full board has to ratify whatever we recommend, and half of them would honestly rather we buried the whole thing.

  I've been reading about Nuremberg and Tokyo on my own time because it feels like exactly our problem, and now I can't unsee it. The charter they used was written after the acts they were judging, which is why the defense kept yelling ex post facto; the answer was that the 1928 treaty renouncing war as an instrument of national policy had already made aggression illegal, plus the idea that some acts are criminal under general principles no matter what the local law says. The defendants tried tu quoque -- you did it too -- and got nowhere. One judge at Tokyo thought every single defendant should walk and basically called the trial the winners taking revenge; he pointed out that Allied firebombing and the atomic bomb were not on the charge sheet and that no judges from the losing side sat on the bench. Also, superior orders was not a defense, only something that could lighten a sentence, and there was a conspiracy charge that let them convict the people who planned it rather than the ones who pulled the trigger. Later international law swung back the other way and made non-retroactivity a hard rule again.

  So can you turn this into a decision procedure my committee can actually run? I get maybe twenty minutes per case and I have no legal training. I need the questions in order, what counts as a good enough answer to each one, where it stops and says no, and where it has to stop and hand off to a committee vote because its a value call and not a fact call. Don't send me to any sources or give me a reading list, I can't look anything up -- just build the ideas into the steps.

  Then run the procedure on the three complaints we're sitting on: (1) a member who harassed a junior colleague in 2019, back when our old code was silent about it and everyone knew it; (2) a complaint against a former officer for taking industry gifts that three people currently on my committee also took; (3) a complaint against a department head who designed the production quota that led to the falsified records, even though he never falsified a single one himself. And tell me honestly where the procedure spits out an answer I won't like, and what it just can't do.

  American English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Newly elected member of a nursing association standards committee (state chapter, ~4,000 members).
      *   **Situation:** Overwhelmed. Dealing with complaints about conduct *before* the current ethics code existed (retroactivity issue). Political tension: some board members want to bury it, some (often those present during the bad times) want to pursue it.
      *   **User's Framework:** They've been reading about Nuremberg/Tokyo tribunals (ex post facto, tu quoque, superior orders, conspiracy). They see parallels.
      *   **Task:** Create a practical decision procedure (flowchart-like steps) for the committee to use (20 mins/case, no legal training). Then apply it to three specific cases.
      *   **Constraints:** No external sources/reading lists. American English. Be honest about where the procedure fails or gives uncomfortable answers.
      *   **Tone:** Professional, pragmatic, empathetic but firm on ethics/procedure.

  2.  **Deconstruct the Ethical/Legal Problem:**
      *   **Core Issue:** Retroactive punishment (Ex Post Facto). In professional ethics, this is generally a hard "no" unless the conduct violated *fundamental* norms existing at the time (malum in se vs. malum prohibitum).
      *   **Nuremberg Analogy:** The user is drawing a heavy parallel. While intellectually interesting, applying international war crimes tribunal logic to a state nursing association is risky. The stakes are licensure/reputation, not life/death, but the procedural fairness matters. The "Nuremberg Defense" (just following orders/rules of the time) is strong here if the rules didn't exist.
      *   **Political Reality:** The Board is split. The Committee needs to protect itself from accusations of bias or witch hunts.
      *   **Goal:** A procedure that filters out cases that *cannot* ethically be pursued while identifying those that *must* be addressed regardless of the code date (egregious harm).

  3.  **Drafting the Decision Procedure:**
      *   *Constraint:* 20 minutes per case. Needs to be fast.
      *   *Constraint:* No legal training. Needs plain English.
      *   *Constraint:* Must distinguish fact from value judgments.
      *   *Step 1: Jurisdiction/Timing.* Did this happen when the member was bound by *any* standard? (Yes, membership implies basic conduct).
      *   *Step 2: Retroactivity Check.* Was this explicitly forbidden by the *old* code or state law at the time? If yes, proceed. If no, go to Step 3.
      *   *Step 3: Fundamental Harm.* Does this violate a universal professional norm (patient safety, sexual harassment, fraud) that didn't need writing down to be wrong? (The "Nuremberg" principle of crimes against humanity/professionalism).
      *   *Step 4: Selective Enforcement (Tu Quoque).* Are we punishing this person while letting others who did the same thing off? (Crucial for the gift-taking case).
      *   *Step 5: Causality/Responsibility.* Did this person directly cause harm or design the system that caused harm? (Crucial for the quota case).
      *   *Step 6: Recommendation.* Sanction, Dismiss, or Escalate to Board for Policy Decision.

      *Refining the "Stop" points:*
      *   If it was allowed then AND isn't fundamentally harmful -> Stop (Dismiss).
      *   If it's selective enforcement -> Stop (Dismiss or Flag for Systemic Review).
      *   If it's a value call (how bad is "bad"?) -> Hand off to Board.

  4.  **Applying the Procedure to the Three Cases:**

      *   **Case 1: Harassment (2019, Old Code Silent).**
          *   *Timing:* Pre-code.
          *   *Retroactivity:* Silent in code.
          *   *Fundamental Harm:* Harassment is generally illegal (Title VII) and universally unethical in healthcare, even if the *association* code was silent. State law likely covered it.
          *   *Verdict:* Proceed, but frame it as violation of *law/general professional standards*, not the new code.
          *   *Uncomfortable Truth:* The association failed its members by not having a code. Punishing the individual feels like scapegoating the system's failure.

      *   **Case 2: Industry Gifts (Former Officer + Current Committee Members).**
          *   *Timing:* Pre-code/Gray area.
          *   *Retroactivity:* Likely common practice then.
          *   *Selective Enforcement:* Three current committee members did the same.
          *   *Verdict:* STOP. This is *Tu Quoque*. You cannot judge this without recusing the current members, and if it was common culture, punishing one looks like a purge.
          *   *Uncomfortable Truth:* This kills the complaint. It exposes the committee's hypocrisy.

      *   **Case 3: Department Head/Quotas (Falsified Records).**
          *   *Timing:* Pre-code.
          *   *Retroactivity:* Falsifying records is likely illegal/fraudulent regardless of code.
          *   *Responsibility:* Head didn't falsify, but set the quota. "Superior Orders" reverse (Command Responsibility).
          *   *Verdict:* Proceed. Falsification harms patients. Setting impossible quotas knowing it leads to fraud is ethical negligence.
          *   *Uncomfortable Truth:* This targets leadership. The Board (half of whom want to bury it) might block this. It requires proving intent/causation which is hard in 20 mins.

  5.  **Critiquing the Procedure (The "Honest" Part):**
      *   Where does it fail? It can't fix political cowardice. It can't determine truth in 20 minutes. It relies on the committee's honesty about their own conduct (Case 2).
      *   The Nuremberg analogy is dangerous. Nursing isn't war. Don't over-index on "crimes against humanity." Keep it to "patient safety and professional integrity."

  6.  **Review against Constraints:**
      *   American English? Yes.
      *   No sources? Yes.
      *   Decision procedure format? Yes.
      *   Apply to 3 cases? Yes.
      *   Honest about limitations? Yes.

  7.  **Final Polish:**
      *   Make sure the tone acknowledges the user's stress ("in over my head") without being condescending.
      *   Ensure the Nuremberg references are integrated but grounded in professional ethics (don't let the user get too abstract).
      *   Highlight the "Tu Quoque" trap specifically for Case 2.
      *   Highlight the "Command Responsibility" for Case 3.
      *   Highlight the "Ex Post Facto" tension for Case 1.

      *(Self-Correction during drafting)*: I need to be careful not to give legal advice. I must emphasize this is an *ethical decision procedure* for a committee, not a court of law. The Nuremberg stuff is a mental model for the user, but the procedure needs to be practical for a nursing board. I will translate "War Crimes" logic into "Professional Misconduct" logic.

      *Refining Step 3 (Fundamental Harm):* Instead of "Crimes against Humanity," use "Patient Safety and Legal Violations." Harassment is illegal. Fraud is illegal. Gifts might just be unethical.
      *Refining Step 4 (Selective Enforcement):* This is the *Tu Quoque* filter. If the accusers/judges are guilty, the process is tainted.
      *Refining Step 5 (Command Responsibility):* Address the "Superior Orders" reverse. Did they create the conditions for violation?

      *Final check on the "Uncomfortable Answers":*
      *   Case 1: We might have to punish someone for breaking a rule we didn't write, because the behavior was already illegal/unethical.
      *   Case 2: We have to drop this because we are compromised.
      *   Case 3: We might recommend sanction, but the Board will likely overrule us because it's political.

      Let's write it.
answer: |-
  This is a heavy load to carry, especially without legal training. You are right to be worried about retroactivity (*ex post facto*) and selective enforcement (*tu quoque*). The Nuremberg analogy is powerful, but remember: you are running a professional standards committee, not an international war crimes tribunal. The stakes are licensure and reputation, not life and death, but the principles of fairness remain the same.

  If you try to act like a court, you will fail. If you act like a filter for the Board, you can survive.

  Here is a decision procedure designed for a 20-minute window. It translates the legal concepts you've been studying into actionable questions for a nursing committee.

  ### The Standards Committee Decision Procedure

  **Pre-Condition:** Before opening the file, confirm the committee has a quorum and no member has a direct personal conflict with the accused (friendship, rivalry, direct financial interest). If a conflict exists, that member recuses themselves.

  **Step 1: The Timeline Check (Ex Post Facto Filter)**
  *   **Question:** Did the alleged conduct happen before the current Ethics Code was ratified?
  *   **If NO:** Proceed to Step 2 using the current Code.
  *   **If YES:** Ask: *Was this conduct explicitly prohibited by the **old** Code, State Nursing Practice Act, or Federal/State Law at the time?*
      *   **If YES:** Proceed to Step 2. (You are enforcing old rules, not new ones).
      *   **If NO:** Go to **Step 1b**.
  *   **Step 1b (Fundamental Harm):** *Does this conduct violate a universal professional norm that existed regardless of written rules (e.g., patient safety, sexual harassment, fraud)?*
      *   **If NO (It was just "bad style" or allowed culture):** **STOP.** Recommend **Dismissal**. You cannot punish someone for following the rules of the time.
      *   **If YES:** Proceed to Step 2. (Note: You are charging them with violating *professional standards*, not the specific new Code).

  **Step 2: The Mirror Check (Tu Quoque / Selective Enforcement)**
  *   **Question:** Is there evidence that other members, specifically those currently in leadership or on this committee, engaged in the *exact same conduct* during the *same time period* without consequence?
  *   **If YES:** **STOP.** Recommend **Dismissal with Note**. You cannot ethically punish one person for a systemic cultural issue that leadership participated in. This looks like a purge.
      *   *Action:* Flag this for the Board as a "Systemic Culture Issue" requiring a policy change, not individual punishment.
  *   **If NO:** Proceed to Step 3.

  **Step 3: The Causality Check (Command Responsibility)**
  *   **Question:** Did the accused directly commit the act, or did they create the conditions that made the act inevitable?
  *   **If Direct:** Proceed to Step 4.
  *   **If Indirect (e.g., set quotas, designed workflow):** Ask: *Was it foreseeable that these conditions would lead to ethical violations, and did they ignore warnings?*
      *   **If NO (Unforeseeable):** **STOP.** Recommend **Dismissal**.
      *   **If YES:** Proceed to Step 4. (Note: This assigns responsibility to leadership, not just the "trigger pullers").

  **Step 4: The Severity & Remedy Check (Value Call)**
  *   **Question:** Assuming the facts are true, does this warrant sanctions (reprimand, suspension, expulsion)?
  *   **Decision Point:**
      *   **If the answer is obvious (e.g., clear fraud, clear assault):** Committee votes on Sanction Level.
      *   **If the answer is debatable (e.g., gray area ethics, cultural norms):** **STOP.** Hand off to **Full Board**.
      *   *Reasoning:* If reasonable people can disagree on whether this was "wrong" at the time, it is a policy decision, not a standards decision. The Board must take the political heat.

  **Step 5: The Recommendation**
  *   Draft a one-paragraph finding.
  *   State which rule was broken (Old Code, Law, or Universal Standard).
  *   State why Step 2 (Mirror Check) did not disqualify the complaint.
  *   Recommend: Dismiss, Sanction, or Board Review.

  ***

  ### Running the Procedure on Your Three Cases

  Here is how the procedure processes the complaints currently on your desk. I will be blunt about where this hurts.

  #### Case 1: Harassment (2019, Old Code Silent)
  *   **Step 1 (Timeline):** Conduct was pre-code. Old code was silent.
  *   **Step 1b (Fundamental Harm):** Harassment violates federal law (Title VII) and universal professional norms regarding safe work environments, even if your association didn't write it down. **Pass.**
  *   **Step 2 (Mirror Check):** Assuming the harasser is the only one accused of this specific behavior (not a widespread unpunished culture of harassment among leadership). **Pass.**
  *   **Step 3 (Causality):** Direct conduct. **Pass.**
  *   **Step 4 (Severity):** Harassment is generally sanctionable.
  *   **Result:** **Recommend Sanction.**
  *   **The Answer You Won't Like:** You are punishing a member for breaking a rule your association didn't write. It feels unfair to the member, but *not* punishing them is worse for the victim. The procedure forces you to acknowledge that "Silence in the Code" does not mean "Permission to Harass." However, you must frame the violation as "Unprofessional Conduct/Hostile Environment" under general standards, not a specific violation of the *new* Code.

  #### Case 2: Industry Gifts (Former Officer + Current Committee Members)
  *   **Step 1 (Timeline):** Pre-code/Gray area.
  *   **Step 1b (Fundamental Harm):** Gifts are ethical gray areas, not universal crimes like fraud or assault. **Pass (barely).**
  *   **Step 2 (Mirror Check):** You noted three people *currently on your committee* took the same gifts.
  *   **Result:** **STOP. Recommend Dismissal.**
  *   **The Hard Truth:** This is a classic *Tu Quoque*. If you proceed, you are admitting that three current committee members are also guilty but are judging someone else to save themselves. This destroys the committee's legitimacy.
  *   **The Procedure's Limit:** The procedure stops you from acting, but it doesn't fix the rot. You must flag this to the Board as a "Systemic Culture Issue." If the Board ignores it, the hypocrisy remains, but at least your committee didn't endorse it. You cannot judge this case without recusing the entire committee, and if the committee recuses, there is no one left to judge.

  #### Case 3: Department Head/Quotas (Falsified Records)
  *   **Step 1 (Timeline):** Pre-code.
  *   **Step 1b (Fundamental Harm):** Falsifying medical records is illegal and endangers patients. Universal norm. **Pass.**
  *   **Step 2 (Mirror Check):** Assuming the Head is the only one who set *impossible* quotas (others may have falsified, but did others design the system?). **Pass.**
  *   **Step 3 (Causality):** Indirect. Did they know? If the quotas were mathematically impossible to meet without cutting corners, it was foreseeable. **Pass.**
  *   **Step 4 (Severity):** This is a value call. Is setting a quota "ethics violation" or "bad management"?
  *   **Result:** **Hand Off to Full Board.**
  *   **The Answer You Won't Like:** This is the most dangerous case. It targets leadership accountability ("Command Responsibility"). Your procedure identifies them as responsible, but because it's a "value call" (Step 4), you have to kick it to the Board.
  *   **The Reality:** Half the Board wants to bury this. They will likely vote it down. The procedure protects *you* (you did your due diligence) but it cannot force the Board to have a spine.

  ***

  ### Where This Procedure Fails (And What It Can't Do)

  You asked for honesty about the limitations. Here they are:

  1.  **It Cannot Fix Political Cowardice:** The procedure identifies Case 3 as a leadership failure and Case 2 as committee hypocrisy. It recommends actions. It cannot make the Board vote correctly. If the Board votes to bury Case 3, the procedure has no enforcement mechanism. You will have to live with knowing you flagged it and they ignored it.
  2.  **It Relies on Honest Self-Reporting:** Step 2 (The Mirror Check) works only if committee members admit when they did the same thing. In Case 2, you already know they did. If they lie about it, the procedure breaks. You may need to anonymously poll the committee on "Who accepted gifts in 2019?" before running Step 2.
  3.  **It Cannot Determine Truth in 20 Minutes:** This procedure assumes the *allegations* are factually true. It decides *if* the conduct is punishable, not *if* they did it. You need a separate fact-finding process. If you are doing fact-finding and judging in the same 20 minutes, you will make mistakes.
  4.  **The Nuremberg Trap:** Be careful with the "Fundamental Harm" argument (Step 1b). In Nuremberg, "aggressive war" was deemed criminal despite no specific statute. In nursing, "harassment" or "quotas" are not war crimes. If you stretch Step 1b too far, you look like you're conducting a witch hunt. Stick to things that were *illegal* (law) or *dangerous to patients* (safety) at the time. Do not use it for "rudeness" or "political maneuvering."

  ### Final Advice for You

  You are the new person. You have the least to lose regarding the "old guard" reputation, but the most to lose regarding your time and stress.

  Use this procedure as a shield. When someone pushes for Case 2, you say: *"Step 2 of our procedure requires dismissal due to selective enforcement. If we ignore the procedure, we open the association to a lawsuit."* When someone pushes to bury Case 3, you say: *"Step 3 identifies command responsibility. We are recommending the Board make the final value call on this."*

  You are not the judge. You are the filter. Let the procedure be the bad guy.
