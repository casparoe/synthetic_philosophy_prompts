      *   *The Collapse:* The subject reports hearing /b/. Did the experience contain /b/ (Stalinesque: the brain waited for the decision logic to resolve the ambiguity before presenting the experience)? Or did the experience contain ambiguity, and the memory was updated to /b/ to match the button press (Orwellian)?
      *   *Making it more original:* Let's use "The Narrative Closure Lag."
      *   *Scenario:* A subject reads a sentence word-by-word on a screen. The final word is masked. They must guess the final word to complete the sentence meaning. They type the word.
