      *   *Mechanism:* A subject perceives a stimulus $S_1$. Before they can report it, a cue $C$ arrives that biases the interpretation of $S_1$. The report $R$ is given.
      *   *The Twist:* The neural time required to bind $S_1$ into a conscious object is $\Delta t_{bind}$. The neural time to formulate the report $R$ is $\Delta t_{report}$. If $\Delta t_{bind} \approx \Delta t_{report}$, and the cue $C$ arrives within this window, did the consciousness of $S_1$ include $C$ (Stalinesque) or did consciousness of $S_1$ occur, then get overwritten by $C$ before report (Orwellian)?
