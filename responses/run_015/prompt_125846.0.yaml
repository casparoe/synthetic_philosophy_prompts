prompt: |-
  Hey, I'm a backend dev, no philosophy background, but I've been reading about meaning and reference on my own (long story: it started with a argument about whether two services can really be said to "mean" the same thing by a message they exchange). I found this summary of Davidson's "radical interpretation" in a blog post by a guy who writes about philosophy of mind and ML, and before I build anything on top of it I want to know how much of it I can trust. Here's the passage, more or less as it appears:

  Radical interpretation is Davidson's name for the problem a field linguist faces: she turns up among people whose language she doesn't know and has to work out what their sentences mean. Her only evidence is which sentences they hold true, and when — she can't peek into their thoughts or intentions. To get anywhere she has to apply the principle of charity, which says: interpret them so they come out mostly rational and mostly right about their world. That's really just the golden rule dressed up in technical language — be generous to the people you're trying to understand. Once you impose charity, you can pair every sentence with the conditions under which it's true, and since for Davidson a theory of meaning just is a theory of truth conditions, that's the whole job done: to know what a sentence means is to know when it's true. The catch is that endlessly many different pairings fit the evidence equally well, so meaning is indeterminate — there's no fact of the matter about what anyone means, which is Quine's indeterminacy of translation all over again. Late on, Davidson added something about "triangulation": the interpreter, the speaker, and some object in the world they're both reacting to have to form a kind of triangle. Nice image, but it's basically a footnote — the real work had already been done by the principle of charity back in the seventies.

  The golden rule bit is what made me suspicious; it sounds like he's smuggling in an ethical demand, and I can't see why a theory of meaning would need one. But the rest felt plausible, especially the triangulation thing, which sounded like two nodes establishing shared causal reference — which is actually close to what I deal with at work, so maybe I'm reading my own stuff into it.

  Can you go through it and tell me, sentence by sentence-ish, what Davidson is actually committed to, what's a fair simplification, and what he'd flat out reject? Then say whether that last claim — that triangulation changes nothing and the picture was finished in the seventies — survives the corrections, or whether it's in tension with the rest of the summary. Sentence-by-sentence-ish is fine, but keep the whole answer under 350 words. And please don't just point me at the papers or give me titles to look up — I'm reading this on a phone with no library access, so I need the audit itself.
