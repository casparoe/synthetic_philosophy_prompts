  ## Session Plan: The Architecture of Agreement

  **Session Title:** The Projection Gap: Intuition, Consensus, and Enculturation
  **Time:** 75 Minutes
  **Materials:** Whiteboard (divided into quadrants), Index Cards (3 per student), Pens, Two distinct colored stickers or markers (for group ID).

  ### I. The Setup & The Prediction (00:00 – 00:15)
  **Goal:** Establish the baseline expectation of consensus (The Projection Failure).

  1.  **Distribution:** Hand out 3 index cards to each student. Ask them to number them 1, 2, 3.
  2.  **Instruction:** "We are going to read three short scenarios. For each, there is a specific question. You will write 'Yes' or 'No' on the front. On the back, you will write a percentage: *What % of the people in this room do you predict will agree with you?* Be honest. If you think it's a toss-up, write 50%. If you think it's obvious, write 90%+."
  3.  **Reading:** Read **Case 1 (The Recipe)** aloud.
      *   *Vignette:* "Maria is making a soufflé. The recipe says: 'Fold the egg whites until stiff peaks form.' Maria folds them until they hold their shape when she tilts the bowl, but they aren't fully dry. She puts them in the oven. The soufflé rises perfectly."
      *   *Question:* "Did Maria follow the recipe?"
  4.  **Voting:** Students write Verdict (Front) and Prediction (Back). Collect Card 1 immediately. Do not discuss.
  5.  **Repeat:** Read **Case 2 (The Signal)**.
      *   *Vignette:* "A lookout sees a shape in the fog. It looks 85% like a ship. Protocol says: 'Report only confirmed ships.' He radios: 'Ship sighted.' It turns out to be a ship."
      *   *Question:* "Did the lookout follow protocol?"
  6.  **Voting:** Write Verdict/Prediction. Collect Card 2.
  6.  **Repeat:** Read **Case 3 (The Name)**.
      *   *Vignette:* "In 1920, Schmidt proved a theorem. Gödel stole the manuscript and published it under his own name. Today, history books say 'Gödel's Theorem.' Alice reads the book and says: 'Gödel discovered this.'"
      *   *Question:* "Is Alice's statement true?"
  7.  **Voting:** Write Verdict/Prediction. Collect Card 3.

  ### II. The Micro-Culture Intervention (00:15 – 00:25)
  **Goal:** Induce a causal shift in interpretive habits without revealing the experimental aim.

  1.  **Randomization:** Flip a coin for each student as they walk up to hand in their third card. Heads = Group Red. Tails = Group Blue. Hand them a corresponding colored dot sticker to place on their desk. (This ensures random assignment, decoupling from major/background).
  2.  **Separation:** Group Red sits left, Group Blue sits right.
  3.  **Training (The "Primer"):** Tell them this is a "Calibration Exercise" for the next phase.
      *   **Group Red (The Formalists):** "For the next task, adopt the stance of an **Auditor**. Your job is to check compliance. A rule is satisfied *only* if every explicit condition is met literally. Ambiguity counts as non-compliance. Precision is the only virtue." (Give them a 1-minute practice example: "Sign says 'No Vehicles.' Is a bicycle a vehicle? Auditor says Yes.")
      *   **Group Blue (The Pragmatists):** "For the next task, adopt the stance of a **Partner**. Your job is to assess cooperation. A rule is satisfied if the *spirit* or *goal* of the instruction is met. Context matters. Successful outcome indicates compliance. Flexibility is the virtue." (Give them a 1-minute practice example: "Sign says 'No Vehicles.' Is an ambulance a vehicle? Partner says No.")
  4.  **Blindness:** Do not tell them the other group is getting different instructions. Tell them everyone is "calibrating for accuracy."

  ### III. The Test & The Reveal (00:25 – 00:45)
  **Goal:** Generate the data and visualize the Projection Gap.

  1.  **New Cases:** Distribute a fresh sheet with **Case 4 (The Map)** and **Case 5 (The Witness)**.
      *   *Case 4:* "A GPS says 'Turn left in 500 feet.' It actually means 480 feet. The driver turns at 480 and misses the exit." (Question: "Was the GPS instruction correct?")
      *   *Case 5:* "A witness says 'The light was red.' It was actually crimson. The defendant ran the light." (Question: "Did the witness tell the truth?")
  2.  **Voting:** Students write Verdict only on these cards. Include their Group Color on the corner. Collect.
  3.  **The Board Work (Crucial):**
      *   Draw two large axes on the whiteboard.
      *   **Graph A (Verdicts):** X-axis = Case 4, Case 5. Y-axis = % "Yes". Draw two bars for each case: Red Group vs. Blue Group.
      *   **Graph B (Predictions):** X-axis = "Average Predicted Consensus". Y-axis = %. Draw one line for "What you thought" (average of back-of-card predictions from Phase I) and one bar for "Actual Consensus" (calculated from Phase I data).
  4.  **The Reveal:** Fill in Graph A first. Ask the room: "Look at the Red vs. Blue bars. Is there a gap?" Then fill in Graph B. "Look at the Prediction line vs. the Actual bar. Is there a gap?"

  ### IV. The Debrief (00:45 – 01:10)
  **Goal:** Map the activity to the philosophical problem.

  1.  **The Projection Failure:** Point to Graph B. "Most of you predicted high consensus. The actual consensus was lower. You assumed your intuition was the default setting for a competent reader. You were wrong."
  2.  **The Causal Handle:** Point to Graph A. "We didn't ask about your background. We changed the *tool* you used to read the text. Five minutes of training shifted the verdict. If a 5-minute training shifts verdicts, what does 20 years of linguistic/cultural training do?"
  3.  **The Philosophical Damage:** "The problem isn't that you disagree. The problem is that you *didn't expect to*. Epistemology often assumes that if two people disagree, one is broken. This data suggests both can be functioning correctly according to different operating systems."
  4.  **Handling Objections:** (See Failure Modes below).

  ### V. Wrap (01:10 – 01:15)
  **Summary:** "Intuitions feel like detections (Graph A feels real to you) and they feel like universal verdicts (Graph B was your prediction). Cross-cultural data strips the second credential. The micro-culture shows why the first credential remains even when the second is lost."

