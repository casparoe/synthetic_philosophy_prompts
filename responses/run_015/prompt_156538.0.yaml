      *   If a patient passes Phase 1 (names by sight) but fails Phase 2 (can't match touch to sight), the Center says: "Your eyes work, but your understanding is fragmented." This is the more interesting case. It implies visual recognition is cheap, but cross-modal unity is the true mark of cognition.

      *Refining the Alternative Epistemology:*
