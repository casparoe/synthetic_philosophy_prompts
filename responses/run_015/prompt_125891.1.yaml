answer: |-
  Here is the translation of the four philosophical accounts into the vocabulary of prose fiction, followed by the report on the residue and your three suspicions.

  ### I. Translations

  **Account 1: The Semantic/Encoded View**
  *Derogation is part of the word's truth-conditional meaning.*
  In craft terms, this account treats the slur as a **flat** element of **diction** that resists **focalization**. It argues that the **implied author** cannot sanitize the **text** simply by assigning the word to an **unreliable narrator** or a **choral voice**. The contamination is ontological to the token itself. Whether the **narration** is **diegetic** (telling) or **mimetic** (showing), the word carries its definition into the **diegesis** regardless of **psychic distance**. The **implied author** is held responsible for the **lexicon** of the **narrator** as if it were their own, rendering the distinction between **who speaks** and **who sees** irrelevant. The word is not a prop; it is the poison.

  **Account 2: The Prohibitory/Authority View**
  *Derogation derives from invoking a standing prohibition.*
  This translates to a dispute over **voice** and **register**. The **choral "we"** establishes a **period register**, a specific **idiom** for the **implied author** to inhabit. This account holds that by selecting W, the **narration** invokes the social authority of that **period register**, reinforcing the hierarchy of the **story world** in the **real world**. It is not about the **character's** intent, but about the **text** licensing the **reader** to recognize the **targets** as objects of discrimination. The **paratext** (jacket, notes) cannot disavow this, because the **narrative voice** has already claimed the authority to name. The **implied author** is not merely reporting a prejudice; they are ratifying the **narrator's** license to use it.

  **Account 3: The Expressive/Non-Descriptive View**
  *Derogation is an act of contempt performed by the utterance.*
  In craft terms, this treats the **narration** not as a report but as a **speech act**. The **choral "we"** is not describing the town's contempt; it is *performing* it. This collapses the **psychic distance** between **narrator** and **reader**. Even if the **implied author** intends **dramatic irony**, the **utterance** itself enacts the hostility. **Free indirect style** usually allows the **narrator** to borrow a **character's** consciousness, but here, the **narrator** borrows the town's contempt and makes it the **narrative's** own. The **implied author**'s disavowal is a separate **speech act** that does not cancel the first one. The **text** wounds because the **voice** strikes.

  **Account 4: The Pragmatic/Inferential View**
  *Derogation is inferred from the choice of a marked term.*
  This account relies entirely on the contract between **implied author** and **actual reader**. It posits that the slur's force is not in the **diction** itself but in the **reader**'s inference that the **speaker** (here, the **choral narrator**) chose a marked term over a neutral one. If the **narrator** is understood as a fictional construct, the **inference** changes. The **actual reader** infers the **implied author**'s stance based on how the **narration** handles the **code-switching**. If the **text** provides sufficient **context** (e.g., Chapter 14's refusal, Chapter 20's reclamation), the **inference** of contempt may be blocked or altered. The meaning is not fixed in the **text** but negotiated in the **reading**.

  ***

  ### II. The Residue

  Here is what remains after the translation, categorized by what fit, what bent, and what broke.

  **Account 1 (Encoded)**
  *   **Clean:** The idea that **diction** carries inherent weight translates well.
  *   **Bent:** The philosophical claim that *no* framing removes the meaning bends the craft concept of **unreliable narration**. In fiction, we assume the **implied author** can signal distance from the **narrator**. This account denies that signal efficacy.
  *   **Missing:** There is no term in craft vocabulary for "ontological contamination of the text." We have "offensive language," but no technical term for a word that breaks the **fourth wall** of ethics while remaining inside the **diegesis**.
  *   **Source of Residue:** This marks a poverty in the craft vocabulary. We assume **mimesis** protects the **implied author**; this theory says it does not.

  **Account 2 (Authority)**
  *   **Clean:** The concept of **register** and **period idiom** maps cleanly to the philosophical "standing prohibition."
  *   **Bent:** The philosophy assumes a real-world authority. Fiction has a **diegetic** authority (the town's rules) and a **non-diegetic** authority (publishing norms). The translation struggles to specify *which* authority is being invoked.
  *   **Missing:** Craft vocabulary lacks a way to distinguish between *depicting* a hierarchy and *reinforcing* it. We call both "world-building."
  *   **Source of Residue:** Artifact of the philosophers' assumption. They assume a single social reality. Fiction operates in two (the story world and the real world), and the vocabulary blurs them.

  **Account 3 (Expressive)**
  *   **Clean:** The notion of **voice** as action fits the "act of contempt."
  *   **Bent:** In craft, **narration** is usually distinct from **action**. A narrator *tells* us about the action. This account claims the narration *is* the action. This bends the **showing vs. telling** distinction.
  *   **Missing:** There is no term for a "successful fictional performance that is an ethical failure." We have "unreliable narrator," but that implies the **implied author** knows better. This account suggests the **implied author** is implicated in the performance regardless of knowledge.
  *   **Source of Residue:** Genuine vagueness in the position. It is unclear if the "act" happens in the **story world** or the **reading experience**.

  **Account 4 (Pragmatic)**
  *   **Clean:** The **implied author/actual reader** contract is the exact equivalent of speaker/hearer inference.
  *   **Bent:** The philosophy assumes a single moment of utterance. The novel accumulates meaning over 300 pages. The **inference** in Chapter 1 is not the **inference** in Chapter 20.
  *   **Missing:** Craft vocabulary handles *accumulation* (arc, trajectory), but philosophy handles *tokens*. There is no term for "deferred inference."
  *   **Source of Residue:** Artifact of the philosophers' assumption of a single moment. Fiction is temporal; their models are often static.

  ***

  ### III. Addressing Your Suspicions

  **1. The Speech Act That Goes Through But Misfires**
  You suspect your vocabulary cannot register a speech act that succeeds formally but fails ethically. You are correct.
  In narratology, if an **unreliable narrator** says something abhorrent, and the **implied author** signals disapproval (via **irony**, **context**, or **consequence**), we call this **critical distance**. We assume the **speech act** is contained within the **diegesis**.
  The philosophical residue reveals that craft vocabulary assumes a successful *aesthetic* misfire protects against an *ethical* hit. We have no term for "the irony failed to stop the wound." We assume that if the **craft** is sound (the **frame** is clear), the **effect** is managed. The residue suggests this is a false equivalence. The vocabulary describes the *mechanism* of the frame, not the *permeability* of the frame.

  **2. Double Attribution (Character and Implied Author)**
  You suspect every word in narration is doubly attributed. This is the strongest point of friction.
  Philosophical accounts generally assume a single speaker. In fiction, the **implied author** selects the **narrator's** words. Even in **first-person**, the **implied author** chose that **voice**.
  *   **Account 1** ignores this; it treats the word as toxic regardless of who chose it.
  *   **Account 2** implicates the **implied author** in the choice of **register**.
  *   **Account 3** treats the **narrator** as the agent, leaving the **implied author**'s liability vague.
  *   **Account 4** places the liability on the **reader**'s inference about the **implied author**.
  The residue here is not a poverty of craft vocabulary; "double attribution" is well-understood (Booth, Rimmon-Kenan). The poverty is in the *ethical* vocabulary of the craft. We have structural terms for double attribution, but no ethical terms for how the liability is split. We assume the **implied author** can outsource sin to the **narrator**. The philosophers argue the debt remains with the **implied author**. Your vocabulary describes the *structure* of the debt, but not the *payment*.

  **3. Accumulation vs. Single Utterance**
  You suspect derogation accumulates across 300 pages rather than landing in a single utterance.
  *   **Account 4** comes closest to acknowledging this, as **inference** can shift over time.
  *   **Accounts 1, 2, and 3** treat the slur as a discrete event.
  Your craft vocabulary is superior here. We have **motif**, **arc**, and **trajectory**. We understand that the W in Chapter 1 is not the W in Chapter 20, especially given the **code-switching** and the **refusal** in Chapter 14.
  The residue marks an artifact of the philosophers' assumption. They analyze sentences; you write novels. Their models are too granular to capture the **narrative strategy** of reclamation or exhaustion. However, this does not solve your dispute. Your Editor relies on the *accumulation* (the whole book critiques the word); your Reader relies on the *token* (the first sentence lands the blow). Your vocabulary can describe both, but it cannot arbitrate which one governs the **reader effect**.

  ***

  ### IV. Dissolution of the Dispute

  One account, when translated, evidently dissolves the disagreement between your Editor and your Reader, rather than deciding it.

  **Account 4 (The Pragmatic/Inferential View)** dissolves the binary.

  Your Editor argues from **Account 3** (Exhibition/Frame): The **narrator** performs the act, the **implied author** exhibits it.
  Your Reader argues from **Account 1** (Encoded): The word lands irrespective of the **frame**.

  **Account 4** posits that the meaning is not in the **text** (Editor) nor in the **word** (Reader), but in the **inference** generated by the **actual reader** regarding the **implied author**'s choice.

  If Account 4 holds, the dispute is not about whether the word is *used* or *exhibited*. It is about whether the **context** (the 300 pages, the **refusal**, the **reclamation**) successfully alters the **reader**'s **inference** about the **implied author**'s intent.

  This dissolves the disagreement because it shifts the ground from *ontology* (what the word *is*) to *contract* (what the book *does*). It acknowledges that for some **readers**, the **inference** will be blocked by the **narrative arc** (supporting the Editor). For others, the **inference** will be triggered by the **token** regardless of the **arc** (supporting the Reader).

  It does not tell you whether to cut the word. It tells you that the "pass" your Editor claims the book has written is not a structural guarantee, but a probabilistic wager on the **reader**'s **inference**. The vocabulary of **implied author** and **actual reader** accommodates this variance; the philosophical binary of "exhibited vs. used" does not.

  The residue remaining is simply this: Your craft vocabulary allows you to construct the wager, but it cannot guarantee the payout.
