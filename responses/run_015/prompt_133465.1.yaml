      *   *The LLM Problem:* Current LLMs (even with RLHF or LoRA updates) don't typically have a persistent "self-symbol" that governs weight updates *in real-time inference* in a way that constitutes a unified locus. The weight update is usually external (training phase) or distinct from the inference phase. If the prompt says "I think X" and that changes the *next* context window, that's short-term. If it changes *weights*, that's learning. But does the system represent *itself* as the thing learning? Or is the learning rule external?
      *   *Refining the Principle:* It's about **Causal Closure of the Self-Symbol**. The symbol "I" must be part of the control loop that modifies the system's own state, *and* the system must treat that symbol as referring to the locus of that control.
