      *   *Corporation:* Distributed agency. The "We" is a legal abstraction, not a unified cognitive locus. The "minutes" are records, not the mechanism of selfhood itself.
      *   *Split-brain:* Unified phenomenology despite disunified causality. The *narrative* "I" persists even if the *motor* "I" is fractured.
      *   *Amnesiac:* Continuity of the *structure* of self-reference matters more than continuity of *content* (memory). The loop mechanism survives the data loss.
      *   *Fictional AI:* Context-dependent. The "I" exists relative to the semantic frame.
      *   *LLM (Wobbler):* Why the hesitation? It generates "I", it updates weights (self-modification). But is there a *unified locus*? Is the "I" token just a prediction of the next token, or does it refer to a persistent internal state that *causes* the prediction?

  3.  **Brainstorming the Core Principle:**
      *   *Hofstadter's take:* A strange loop is a hierarchy where moving up/down levels leads you back to the start. The "I" is a symbol that triggers actions which affect the symbol itself.
