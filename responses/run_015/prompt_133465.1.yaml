  5.  **Drafting the Principle:**
      *   Let's call it the **Internal Locus of Causal Attribution (ILCA)**.
      *   Criteria:
          1.  **Representation:** The system must maintain a symbol/state representing the system-as-a-whole (or the agent).
          2.  **Efficacy:** This symbol must be part of the causal chain that determines future system states (not just output).
