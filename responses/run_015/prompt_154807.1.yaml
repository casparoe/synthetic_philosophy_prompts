answer: |-
  **Exam Question**

  **Course:** Graduate Seminar in Normative Ethics
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in essay form. Citations are not required. Focus on argumentative precision and logical consistency.

  **Question:**
  Consider a rescue scenario: You can save Alice (one specific person) or five strangers. You also have the option to decide via a fair coin flip. Taurek argues that "the numbers should not count," proposing the coin flip to demonstrate equal concern for each individual. However, if numbers truly do not count, is the coin flip itself problematic? Analyze whether Taurek's commitment to pairwise comparison renders the coin flip impermissible or absurd compared to saving Alice outright. Does this tension constitute a *reductio* of his view, or can it be resolved? In your analysis, address the viability of threshold modifications (e.g., numbers count only after a certain point) and whether such hybrids betray the core anti-utilitarian premise of Taurek's argument.

  ***

  **Model Answer**

  Taurek's central thesis is that moral loss is not aggregable. When comparing Alice's death to the death of five strangers, we face five distinct losses, not one collective loss weighted five times heavier. Because persons are separate, there is no single subject who suffers the "sum" of the five deaths. Therefore, no individual among the five has a claim stronger than Alice's. This rejects the utilitarian calculus where the greater number dictates the outcome simply by virtue of magnitude. For Taurek, morality is grounded in the relation between the agent and each individual, not in the summation of outcomes across persons.

  However, this creates tension for Taurek's coin-flip proposal. The flip assigns a 50% chance to Alice and a 50% chance to the group of five. Critics argue this smuggles aggregation back in: to give the group 50% equal to Alice's 50% is to treat the five as a single moral bloc. If Taurek insists on strict pairwise comparison, he should compare Alice to Stranger 1, Alice to Stranger 2, and so on. In each pairwise contest, Alice's claim equals the Stranger's. But the flip aggregates the strangers' chances to match Alice's. Thus, the flip might be impermissible on Taurek's own terms, as it implicitly recognizes the moral weight of the collective entity "the five," which his ontology denies.

  Consequently, if numbers truly do not count, Taurek must be indifferent between saving Alice outright and flipping. If no individual stranger has a stronger claim than Alice, saving Alice violates no one's superior right. Preferring the flip suggests that the *group's* interest matters enough to risk Alice's life, which contradicts the rejection of aggregation. Saving Alice outright is logically consistent with pairwise equality: every individual comparison yields a tie, so breaking the tie arbitrarily (or favoring a friend) is permissible. The coin flip, intended to show fairness, may actually reveal an inconsistency in treating the five as a counterweight to the one.

  Is this indifference absurd? Utilitarians see it as a *reductio*: letting five die to save one is irrational waste. But for Taurek, "waste" presupposes a collective good that isn't lost. The absurdity relies on the intuition that numbers count, which Taurek explicitly denies. While counterintuitive, it is not internally inconsistent. The *reductio* only works if one assumes aggregation is obligatory, which begs the question against Taurek. However, if Taurek cannot explain why the flip is preferred over saving Alice without appealing to the weight of the five, his view collapses into the aggregation he rejects.

  Finally, can a threshold hybrid save the view? One might argue numbers count only after a certain point (e.g., 1 vs. 1000). However, this betrays Taurek's core premise. If numbers don't count at 1 vs. 5, why do they count at 1 vs. 1000? The difference is magnitude, which Taurek rejects as morally irrelevant between separate persons. Introducing a threshold admits that aggregation is valid sometimes, collapsing the distinction between Taurek's view and moderate aggregation. It fails to preserve the radical separateness of persons that motivates the view initially. To accept a threshold is to concede that persons can be summed, which destroys the foundation of Taurek's argument.

  ***

  **Marking Scheme**

  **Total Marks:** 20
  **Passing Threshold:** 10/20

  | Conceptual Move | Marks | Criteria for Full Marks | Typical Mistake |
  | :--- | :---: | :--- | :--- |
  | **1. Rejection of Aggregation** | 4 | Clearly explains Taurek's "separateness of persons" argument: losses are distinct to individuals and cannot be summed into a collective greater loss. | Confusing Taurek's anti-aggregation with a standard deontological rights veto; failing to distinguish between "summed loss" and "multiple individual losses." |
  | **2. Coin Flip & Equality** | 4 | Analyzes whether the 50/50 split treats the five strangers as a single bloc, potentially smuggling aggregation back into the view under the guise of equal concern. | Assuming the coin flip is neutral; failing to see that giving the *group* 50% chance mathematically aggregates the strangers against Alice. |
  | **3. Indifference (Alice vs. Flip)** | 4 | Argues that if claims are pairwise equal, saving Alice outright is permissible; shows why Taurek should be indifferent between flipping and saving Alice directly. | Claiming Taurek requires maximizing survival rates; treating expected-value reasoning as compatible with Taurek's non-aggregative view. |
  | **4. Absurdity & Reductio** | 4 | Evaluates whether the indifference is a fatal *reductio* or merely counterintuitive; notes that calling it "absurd" often begs the question by assuming aggregation. | Dismissing Taurek purely on intuition (e.g., "it's obviously wrong to let 5 die") without engaging his claim that there is no "5" to die collectively. |
  | **5. Threshold Hybrid** | 4 | Explains why introducing a threshold (numbers count after *n*) contradicts the core premise that magnitude between persons is morally irrelevant. | Assuming a threshold saves the view without conceding aggregation; failing to see that a threshold admits summation is valid in some cases. |
