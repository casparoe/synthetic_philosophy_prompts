      *Refining the "Loss Trap" argument:* The applicants say genomic signals do the evidential work. I need to counter that specifically. A selection scan detects deviation from neutrality. But regressive traits often evolve via *relaxed* selection, which looks like neutrality (drift), not positive selection. Therefore, the pipeline might miss the mechanism entirely or misattribute it.

      *Refining the Conditions:*
