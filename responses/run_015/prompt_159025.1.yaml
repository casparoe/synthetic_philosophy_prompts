      *   **Applicants' Proposal:** Selection scans, genotype-environment associations across 40 populations. Output: 600 trait annotations with confidence tiers (A: experimental, B: comparative, C: narrative plausibility). Open data.
      *   **Stakeholders:** National conservation agency (forecasting tolerance), commercial breeding partner.
      *   **Applicants' Defense:** Genomic signals replace natural history storytelling; adaptationist critique is obsolete.
      *   **User's Specific Worry:** "The Loss Trap" – most traits are losses (eyes, pigment, etc.). These admit both adaptive (energy economy) and non-adaptive (relaxed selection + drift) explanations. Genomic pipeline doesn't discriminate. Also, the "midline groove" mystery trait will get a narrative anyway. Tier C narratives in databases get treated as data by downstream users.
      *   **Panel Status:** Split (Chair: fund with conditions; Member 2: decline (Panglossian); Member 3: fund outright (armchair paralysis/delay)).
      *   **Task:** Draft a decision memo (1,100–1,300 words).
      *   **Format:** Short header block, addressed to the panel, applicants as named recipients.
      *   **Tone/Style:** British English. Professional, authoritative, nuanced. Do not rehearse Gould & Lewontin (1979) but apply it.
      *   **Requirement:** One specific recommendation (Fund, Fund with Conditions, or Decline). Commit to it.
      *   **Requirement:** If conditions, they must be actionable/checkable (Tier C publication rules, tier promotion evidence, handling regressive traits, commercial access).
      *   **Requirement:** Give the strongest/fairest statement of the rejected option (not a strawman).
      *   **Requirement:** Close with a paragraph on the shakiest assumption and what finding would change the recommendation.

  2.  **Determine the Recommendation:**
      *   *Option 1: Fund as submitted.* Risks validating "just-so stories" as data, especially for loss traits. Ignores the "Loss Trap."
      *   *Option 2: Decline.* Stops the "Panglossian storytelling industrialised." But delays conservation action while aquifer dries. Might be seen as methodological gatekeeping over urgent application.
      *   *Option 3: Fund with Conditions.* Addresses the epistemic risk without halting the work. Allows conservation modeling but restricts how uncertain data is treated. Aligns with the Chair's leaning but needs specific, rigorous conditions to satisfy the user's specific worries about Tier C and loss traits.
      *   *Decision:* **Fund with Conditions.** This balances the urgency (conservation/commercial) with scientific rigour (avoiding the reification of narratives). It allows me to apply the Spandrels critique constructively rather than destructively.

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the decision clearly. Acknowledge the strength of the proposal (genomic scale, conservation urgency).
      *   **The Core Argument (Applying Spandrels):** Address the applicants' claim that genomic signals solve the adaptationist critique. They don't fully solve it for *loss* traits or *Tier C* narratives. The "Loss Trap" is real. Genomic signatures of selection can be confounded by demography, and relaxed selection looks like drift, not positive selection.
      *   **The Conditions (Actionable):**
          1.  *Tier C Publication:* Cannot be released as "open data" in the same way as A/B. Must be flagged as "Hypothesis Only."
          2.  *Loss Traits:* Specific protocol for regressive traits. Cannot default to adaptive energy economy without ruling out drift (e.g., via neutral modelling).
          3.  *Tier Promotion:* Who decides? Independent methodological reviewer, not just the PI.
          4.  *Commercial/Conservation Access:* Restrict access to Tier C for commercial use. Conservation models must run sensitivity analyses excluding Tier C.
      *   **The Rejected Option (Decline):** Give the "Panglossian" argument its due. The risk of reifying error is high. Databases have long half-lives. Bad data persists longer than good arguments.
      *   **The Rejected Option (Fund Unconditional):** Give the "Urgency" argument its due. Five years of argument while water drops is a decision to let species die. Methodological perfectionism can be elitist.
      *   **Closing (Uncertainty):** What assumption is shakiest? That conditioning the grant won't cripple the consortium. What would change my mind? If the pilot shows genomic signals *do* distinguish drift from selection in regressive traits.

  4.  **Word Count & Tone Check:**
      *   Need to hit 1,100–1,300 words.
      *   British English (programme, centre, modelling, etc.).
      *   Tone: Collegial but firm. Intellectual weight.

  5.  **Drafting - Step-by-Step Construction:**

