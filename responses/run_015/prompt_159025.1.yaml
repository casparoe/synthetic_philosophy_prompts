answer: |-
  **TO:** Evolutionary Systems Panel
  **CC:** Principal Investigators, Programme Grant EP/X99/24 (Balkan Cave Beetle Radiation)
  **FROM:** Panel Member (Evolutionary Systems)
  **DATE:** Wednesday, 14 November
  **SUBJECT:** Decision Memorandum: Programme Grant EP/X99/24

  **Decision**

  After reviewing the applicants' response to referees and considering the panel's divergent positions, my recommendation is to **fund the programme with specific methodological conditions**. We cannot afford to halt this work given the hydrological urgency facing the karst aquifer, yet we cannot endorse a pipeline that risks industrialising the very epistemic errors Gould and Lewontin warned against. The applicants argue that genomic signals of selection now render the adaptationist critique obsolete. This is partially true for gains in function, where a selective sweep offers mechanistic weight. It is not true for losses. A selection scan detects deviation from neutrality; it does not distinguish between positive selection for energy economy and the neutral decay of unused structures under relaxed selection. To treat these genomic signatures as equivalent evidential work is to invite the 'Loss Trap': the systematic misannotation of drift as adaptation. Therefore, funding is contingent on the following enforceable protocols.

  **Conditions of Grant**

  First, regarding the **Tier C annotations**: These entries must not be released into the public catalogue as 'data' alongside Tier A and B entries. They must be watermarked explicitly as 'Unverified Hypotheses' in the database schema, with metadata preventing their bulk download for machine learning training or commercial modelling without explicit flagging. A Tier C entry may only be promoted to Tier B upon independent verification of comparative correlation across non-sister lineages, adjudicated by an external methodological reviewer appointed by the Council, not the PI.

  Second, regarding **regressive traits**: For the roughly one hundred traits involving loss (eyes, pigment, musculature), the applicants must fit a null model of neutral drift before proposing an adaptive energy-allocation scenario. A genomic signature of selection is insufficient here, as relaxed selection often mimics neutrality. If the trait evolution fits a Brownian motion model of drift given the phylogeny and effective population size, the annotation must default to 'Neutral/Relaxed' rather than 'Adaptive Economy'. This prevents the default assumption that loss is always functional reallocation.

  Third, regarding **downstream users**: The commercial breeding partner's access must be restricted to Tier A and verified Tier B entries only. Commercial incentives bias heavily towards adaptive explanations (traits are valuable because they were selected); allowing access to Tier C narratives risks locking speculative biology into proprietary IP. The national conservation agency may access Tier C data, but only on the condition that their population tolerance forecasts run sensitivity analyses excluding these entries. Their final report must quantify how much the forecast variance depends on unverified narrative assumptions.

  Finally, the **midline groove** anomaly cited in the pilot data must remain unannotated until either experimental manipulation (Tier A) or robust comparative correlation (Tier B) is achieved. No narrative plausibility argument, however elegant, may be entered into the catalogue for this trait within the five-year window. This serves as a control case for the panel to audit whether the pressure to produce annotations overrides epistemic caution.

  **The Rejected Alternative**

  I owe a debt to the panel member who argued we should **decline the grant outright**. Their position is that a database has a longer half-life than a grant cycle. A Tier C narrative entered today becomes a citation fact tomorrow, ossifying into textbook knowledge before it can be debunked. By funding this, we legitimise the infrastructure of just-so storytelling. The applicants' claim that genomic signals solve the problem is, in this view, a category error: a selection scan is still an observation compatible with multiple causal histories. To build a public atlas on this foundation is to pollute the commons. There is merit to the claim that it is better to have no data than bad data, particularly when the bad data is dressed in the authority of open science. If the conservation agency requires forecasts, they should commission modelling based on physiological tolerances, not evolutionary narratives. This argument prioritises the long-term integrity of evolutionary inference over short-term application. It is a principled stand against the commodification of uncertainty, and were the aquifer not actively drying, I would join them.

  **The Pragmatic Counter**

  Conversely, the argument to **fund without conditions** rests on the moral weight of the conservation crisis. Five years of methodological quarrelling while the water table drops is itself a decision: it is a decision to let populations perish for the sake of epistemic purity. The applicants are correct that we cannot wait for perfect experimental manipulation for six hundred traits. To impose conditions is to risk administrative bloat that slows the very work we seek to enable. There is a valid concern that my conditions invert the default lazily: demanding proof of drift for loss traits is as difficult as proving selection. Yet, urgency cannot excuse the reification of guesswork.

  **Uncertainty and Revision**

  My recommendation rests on the assumption that these conditions are enforceable without crippling the consortium's throughput. I am assuming that an external reviewer can adequately assess null models of drift without becoming a bottleneck. My shakiest assumption is that the conservation agency will actually perform the required sensitivity analyses excluding Tier C data; they may lack the capacity to distinguish the tiers in practice. If, within the first annual review, the consortium demonstrates that their genomic pipeline can empirically distinguish between relaxed selection and positive selection in regressive traits—for instance, by identifying specific pleiotropic constraints linked to the loss traits—I would revise my stance and support unconditional funding. Until then, we must fund the work, but we must not fund the certainty they claim to possess.
