  1. The boiling point of water is fully grounded in hydrogen-bond dynamics and statistical mechanics. Nothing fundamentaly important is left out.

  2. A synthetic hydrogel that contracts like muscle but uses no actin or myosin: its "contractility" isn't grounded in any specific chemistry. It's grounded in functional organization, but that organization feels like it's not "down there" in the atoms — more like a pattern we impose. So I say contractility here is partly ungrounded, or grounded in something abstract.

