answer: |-
  ### Q&A Prep Sheet: The Provenance Test

  #### Part 1: The Concessions (First Two Minutes)
  *State these explicitly in your opening remarks. Do not wait for them to be demanded.*

  1.  **On Data:** "I am not arguing that non-empirical support can replace empirical data. I am arguing about how we assess confidence *in the absence* of data, and for how long that absence can be tolerated."
  2.  **On Community Behavior:** "I concede that the string theory community has, at times, absorbed anomalies and protected the core framework in ways that look sociologically distinct from other historical episodes. I am not denying the behavior; I am questioning its epistemic weight."
  3.  **On Provisionality:** "Any support generated by the Provenance Test is provisional. It expires the moment empirical data becomes accessible. If the test says 'trust it' and the data says 'no,' the data wins."

  #### Part 2: The Single Claim That Must Survive
  If the audience forgets everything else, they must retain this:
  **"The three standard non-empirical arguments (No Alternatives, Unexpected Explanatory Coherence, Meta-Inductive Success) are currently treated as independent lines of evidence, but they may all be downstream effects of a single structural feature (rigidity). If they are not independent, the cumulative case is arithmetically inflated."**

  #### Part 3: Two Objections That Are One
  **The Falsificationist Philosopher** ("This isn't science") and **The Observational Cosmologist** ("This is a waste of resources") are making the same claim: **Empirical grounding is the only legitimate constraint on theory choice.** The Philosopher states it as a demarcation problem; the Experimentalist states it as a budget problem. Treat them as a single bloc demanding empirical anchoring.

  #### Part 4: The Sound But Unanswerable Objection
  **The Objection:** From the **Program Officer** or **Observationalist**: "If your test validates a framework that has produced no testable predictions for forty years, aren't you providing a philosophical cover for continuing to fund a stagnating research program at the expense of testable alternatives?"
  **Why you can't answer it:** If you say "Yes," you alienate the theorists in the room and undermine the workshop's purpose. If you say "No," you look detached from the material reality of funding and opportunity cost.
  **The Pivot:** "I am proposing a diagnostic tool, not a funding algorithm. If the Provenance Test reveals the arguments are dependent, the rational move is to *reduce* confidence and diversify funding. The test is designed to prevent exactly the stagnation you fear."

  #### Part 5: The "Standing" Question vs. The Dangerous Question
  You are worried about the **Standing Question** ("You aren't a physicist; who are you to set standards?").
  **Do not worry about this.** It is easily deflected: "I am not assessing the math; I am assessing the epistemology. That is my lane."

  **The Genuinely Dangerous Question:**
  From the **Senior String Theorist**: **"You treat internal rigidity as a confounding variable. But in quantum gravity, rigidity *is* the virtue. It's why we think the theory is unique. If rigidity generates all three arguments, doesn't that make the signal stronger, not redundant?"**
  **Why it's dangerous:** It turns your core suspicion (that the arguments are one argument counted three times) into a confirmation of the theory's strength (the arguments converge because the theory is uniquely constrained). If you cannot distinguish between "rigidity as a truth-tracker" and "rigidity as community dogma," your thesis collapses.

  ---

  #### Part 6: The Objections (Ordered by Damage)

  **1. The "Rigidity as Virtue" Objection**
  *   **Who:** Senior String Theorist (Sympathetic to non-empirical case).
  *   **The Objection:** "You claim that if rigidity generates all three arguments, the evidence is inflated. But if the theory is truly unique, rigidity *should* generate all three. No alternatives, unexpected coherence, and past success are all consequences of uniqueness. Your test penalizes the very thing that makes the theory compelling."
  *   **The Reply (90s):** "That is precisely why the Provenance Test requires you to name the structural feature. If 'uniqueness' is the feature, you must show what the world looks like if the theory is *not* unique. If the absence of alternatives is just a result of the community not looking elsewhere because the math is hard, that's sociology, not uniqueness. I am not penalizing rigidity; I am asking you to distinguish rigidity that comes from nature from rigidity that comes from our inability to imagine alternatives."
  *   **Where it is softest:** You cannot empirically distinguish "nature's rigidity" from "our imagination's limit" without data, which is exactly what is missing.

  **2. The "Bayesian Independence" Objection**
  *   **Who:** Bayesian Philosopher of Science.
  *   **The Objection:** "In Bayesian networks, evidence does not need to be causally independent to be cumulatively supportive. Correlated signals can still update credence. Your 'Provenance Test' demands a level of independence that is rarely met in historical science, effectively setting a bar that invalidates almost all theory choice."
  *   **The Reply (90s):** "I am not demanding causal independence; I am demanding that we account for the correlation in the update. If three signals come from one source, you don't get three updates; you get one. Current literature treats them as three. I am asking for the arithmetic to reflect the dependency structure. If that lowers the bar for other fields, then those fields are also overconfident."
  *   **Where it is softest:** You are imposing a formal requirement on informal reasoning processes that scientists don't actually use, making your test descriptively inaccurate.

  **3. The "Opportunity Cost" Objection**
  *   **Who:** Observational Cosmologist / Gravitational-Wave Experimentalist.
  *   **The Objection:** "We have finite resources. By legitimizing 'non-empirical support,' you are giving a hall pass to a field that has consumed billions without a single prediction. Why should we treat this as a philosophical puzzle rather than a failure of resource allocation?"
  *   **The Reply (90s):** "Because the resource allocation decision has already been made based on these arguments. My talk is not about whether to fund string theory; it's about auditing the reasoning used to justify that funding. If the arithmetic is inflated, as I suspect, the rational allocation changes. I am on your side: rigorous accounting should reduce overconfidence."
  *   **Where it is softest:** You are assuming the audience has the power to change allocation; they likely don't, making your audit purely academic.

  **4. The "Historical Precedent" Objection**
  *   **Who:** Historian of Science.
  *   **The Objection:** "The Luminiferous Aether program also had no workable rivals, explained unexpected phenomena (via ad-hoc adjustments), and had a track record of success. Your 'Provenance Test' would have likely validated the Aether in 1890. How is your test different from a rationalization of the status quo?"
  *   **The Reply (90s):** "The Aether failed the second clause of the test: 'Say what would have been true if things had gone the other way.' For the Aether, the 'anomaly absorption' was the feature. If the Provenance Test had been applied, it would have revealed that the 'successes' were all retrospective fits, not prospective constraints. I am arguing the test would have *killed* the Aether argument, not saved it."
  *   **Where it is softest:** Hindsight is 20/20. Applying the test retrospectively is easy; applying it prospectively (as you ask them to do) is impossible without knowing the outcome.

  **5. The "Mathematical Consistency as Data" Objection**
  *   **Who:** Quantum Gravity Theorist.
  *   **The Objection:** "You treat mathematical consistency as a theoretical virtue. In quantum gravity, consistency *is* data. If the math breaks, the theory dies. That is an empirical constraint on the structure of reality, even if it isn't a collider experiment."
  *   **The Reply (90s):** "Mathematical consistency is a necessary condition, not a sufficient one. A consistent theory can still describe the wrong universe. I am not asking you to ignore consistency; I am asking you not to count consistency as 'explanatory coherence' with the physical world. One is internal logic; the other is external mapping."
  *   **Where it is softest:** In quantum gravity, the distinction between "internal logic" and "external mapping" is blurred because spacetime itself emerges from the math.

  **6. The "Bad Lot" Objection**
  *   **Who:** Philosopher (Unconceived Alternatives specialist).
  *   **The Objection:** "The 'No Alternatives' argument is always a bad-lot argument. You can't prove there are no alternatives; you can only prove you haven't found one. Your test asks theorists to name the feature that generates this, but the feature is simply human limitation."
  *   **The Reply (90s):** "Agreed. That is why the Provenance Test requires stating what would be true if alternatives *existed*. If the landscape is vast but we only see one peak, is it because there is only one peak, or because we are blind? If you cannot distinguish those, the argument carries zero weight. I am formalizing your skepticism."
  *   **Where it is softest:** You are relying on the theorists to honestly assess their own blindness, which is a psychological impossibility.

  **7. The "Sociology vs. Epistemology" Objection**
  *   **Who:** Science Writer / Editor.
  *   **The Objection:** "You are describing a community's defense mechanisms and calling it epistemology. If 'absorbing anomalies' is a community practice, that's sociology. Why should that count as evidence for the theory's truth?"
  *   **The Reply (90s):** "It shouldn't. That is my point. The Provenance Test is designed to flag when a 'success' is actually just 'anomaly absorption.' If the structural feature is 'community practice,' the test fails the theory. I am giving you the tool to separate the sociology from the physics."
  *   **Where it is softest:** You are assuming the community *wants* to separate the two, when their career incentives depend on conflating them.

  **8. The "Falsifiability is Dead" Objection**
  *   **Who:** Old-School Falsificationist Philosopher.
  *   **The Objection:** "This entire workshop is an oxymoron. If a theory cannot be tested, it is not science. By proposing standards for 'non-empirical support,' you are legitimizing metaphysics as physics."
  *   **The Reply (90s):** "I am not legitimizing it as final science. I am analyzing how scientists *actually* make decisions in the interim. You can demand falsifiability as an ideal, but you cannot ignore the reality that billions are spent and careers are built on these frameworks *now*. We need standards for the waiting period, even if you hate the wait."
  *   **Where it is softest:** You are conceding that the field is in a "waiting period" that has lasted 40 years, which validates their claim that the wait is abnormal.

  **9. The "Publishability" Objection**
  *   **Who:** Physics Editor.
  *   **The Objection:** "If your conclusion is that we can't know if the arguments are independent without data, what is the story? 'We need more data' is not a closing talk. It's a placeholder."
  *   **The Reply (90s):** "The story is that the current justification is arithmetically flawed. Even without data, we can audit the reasoning. If the three pillars are one pillar, the confidence level drops. That is a actionable insight for editors, funders, and students, even without a collider result."
  *   **Where it is softest:** "Confidence drops" is abstract. It doesn't give you a headline or a clear narrative resolution.

  ---

  #### Part 7: Final Strategic Advice

  **On the "Standing" Question:**
  If asked, do not apologize. Do not over-explain.
  *Say:* "I am not evaluating the string equations. I am evaluating the structure of the argument used to support them. That is a logical task, not a physical one."

  **On the "Dangerous" Question (Rigidity):**
  This is where you must be most precise. If you conflate "mathematical rigidity" with "sociological rigidity," the theorists will eat you.
  *Preparation:* Be ready to define "Anomaly Absorption." Is it adding a new dimension to fix a mass prediction (mathematical)? Or is it redefining what counts as a prediction (sociological)? Your thesis hinges on the latter being disguised as the former.

  **Tone Check:**
  You are not the prosecutor; you are the auditor. A prosecutor wants a conviction; an auditor wants accurate books. If the books are accurate and the theory is still supported, you have succeeded. If the books are cooked, you have succeeded. Do not let them paint you as an enemy of the field; you are an enemy of *bad accounting*.
