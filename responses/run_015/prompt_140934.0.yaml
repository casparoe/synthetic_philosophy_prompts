  This poem commits to the speech-act reading of Moore's paradox (that the defect lies in assertibility norms rather than the impossibility of the mental state), as the left column validates the psychology while the right column demonstrates the linguistic failure; it takes liberties with the "lag" case (lines 11–13), treating it as a sincerely sayable distinct phase, whereas many theorists argue the paradox arises precisely because asserting *p* implies belief, making the lag case either impossible to assert or already a dissolution of the paradox. If you need to shorten it, cut line 15 ("A friction in the psyche's gear"), which is explanatory filler. I must note that the two-column device risks becoming a mere diagram of the philosophical problem rather than a poem; the distinction you requested between the "sincerely sayable" lag and the "flat commissive" case is itself a muddle, since if the lag is sincere, the assertion of *p* lacks full commitment, dissolving the paradox before it starts. You might have asked for a single voice that modulates from description to assertion to collapse, rather than splitting the subject, to better capture the unity of the speaker who fails to speak.
