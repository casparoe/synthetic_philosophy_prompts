answer: |-
  This is a sophisticated inquiry that cuts to the core of the philosophy of history. You are identifying a specific instance of "boundary work" (a term coined by sociologist Thomas Gieryn) where a discipline defines itself by what it excludes. Your observation is correct: the rejection of Fomenko's *New Chronology* (and similar revisionist frameworks) is rarely settled solely by pointing out a calculation error in a specific regression. Instead, it is rejected as *category error*.

  To answer your seminar question, we must reconstruct the implicit epistemology of mainstream historiography, analyze its ontological commitments, test its internal consistency, and model the counterfactual institutional shift you propose.

  ### 1. The Implicit Epistemology: Abductive Consilience vs. Nomothetic Prediction

  The practice you describe presupposes an epistemology of **Critical Realism** grounded in **Abductive Reasoning (Inference to the Best Explanation)**, rather than a Positivist epistemology grounded in **Nomothetic Prediction** (law-seeking).

  **The Privileging of Hermeneutic Continuity:**
  Mainstream historiography operates on the principle of **Consilience of Evidence**. A historical date is not established by a single statistical correlation but by the convergence of independent causal lines: stratigraphy, dendrochronology, radiocarbon calibration, linguistic evolution, numismatics, and textual transmission.
  *   **The Epistemic License:** The discipline licenses a chronological adjustment only if it increases the *causal coherence* of the entire web of evidence.
  *   **The Rejection of Statistical Coherence:** Fomenko's method relies on identifying statistical patterns (e.g., similarity in the duration of reigns) and treating them as causal indicators. The implicit theory of history rejects this because **correlation without mechanism is historically inert.** In history, a "fact" is not a data point; it is an event embedded in a causal network of human agency and material consequence. A statistical fit that requires the non-existence of vast causal networks (e.g., claiming the Roman Empire never existed) fails the abductive test because it creates more explanatory anomalies than it resolves.

  **The Theory of Knowledge:**
  This presupposes that historical knowledge is **reconstructive** rather than **predictive**.
  *   *Natural Science (idealized):* Predicts future states based on universal laws.
  *   *History:* Reconstructs past singularities based on trace evidence.
  Therefore, "predictive statistical coherence" (e.g., "this model predicts the pattern of king lists") is epistemologically subordinate to "material-source continuity" (e.g., "this layer of ash physically underlies this coin"). The latter provides a causal anchor; the former provides only a pattern.

  ### 2. Ontological Status of Historical Facts

  Does this theory treat facts as socially constructed, causally embedded, or something else?

  It treats them as **Trace-Constituted Causal Events.**

  *   **Not Purely Socially Constructed:** If history were purely narrative construction, Fomenko's narrative would be as valid as the mainstream one, provided it was internally consistent. The fact that it is rejected indicates historians believe there is a *mind-independent past* that constrains narrative.
  *   **Not Simply Causally Embedded (like physics):** Historical events involve *agency* and *meaning*. A battle is not just a collision of masses; it is a collision of intentions.
  *   **The Synthesis:** A historical fact exists ontologically where a **causal trace** (material or textual) intersects with **interpretive intelligibility**.
      *   Fomenko's error, from this ontological view, is treating historical traces as *noise* to be smoothed by statistics, rather than as *signals* of specific causal chains. By claiming ancient history is a "duplication," he posits a conspiracy of such magnitude that it becomes a "super-cause" that swallows all other causes. This violates the ontological principle of **Causal Proportionality**: the magnitude of the cause (a global forgery) must be proportional to the evidence of the effect (the forgery's traces). There is no material trace of the *act* of deleting the timeline, only the absence of data which is better explained by entropy and loss.

  ### 3. Internal Consistency: Probabilistic Weighing vs. Statistical Revisionism

  You ask if the practice is internally consistent, given that mainstream historiography employs probabilistic weighing (e.g., "Source A is likely more reliable than Source B").

  **Yes, it is consistent, provided one distinguishes between *Bayesian Updating* and *Model Fitting*.**

  *   **Mainstream Historiography (Bayesian):** Historians start with a prior probability (the established timeline). New evidence (a text, a carbon date) updates the probability of specific events. This is **local adjustment**. It preserves the structural integrity of the timeline while refining coordinates.
  *   **Fomenko's Revisionism (Model Fitting):** This attempts to discard the prior entirely and fit a new function to the data points.
  *   **The Consistency Check:** The inconsistency would only arise if historians rejected *local* statistical adjustments while accepting *global* textual ones. They do not. If radiometric data suggests a 50-year shift in a specific era, historians accept it (e.g., the Santorini eruption debate).
  *   **The Demarcation:** The rejection of Fomenko is consistent because his method violates the **Principle of Least Astonishment** (a heuristic of abductive reasoning). To accept his statistics, one must reject the causal validity of *every other* form of evidence (geology, linguistics, genetics). Mainstream probabilistic weighing is consistent because it seeks to maximize the coherence of *all* evidence types, not just one (statistical correlation of reigns).

  ### 4. Counterfactual: Institutional Changes Under a Falsificationist/Probabilistic Criterion

  If the discipline adopted a strict Popperian falsificationist or purely probabilistic demarcation criterion—evaluating claims solely by empirical predictive success and statistical robustness, disregarding hermeneutic continuity—the institutional landscape would undergo a radical transformation akin to the shift from Humanities to Data Science.

  **A. Peer Review Norms:**
  *   **Current:** Reviewers assess argumentation, source mastery, and narrative plausibility.
  *   **New Norm:** Reviewers would assess **Out-of-Sample Prediction**. A historical theory would need to predict the location of undiscovered artifacts or the content of undeciphered texts based on its statistical model.
  *   **Consequence:** "Interpretive" history (cultural, intellectual) would be defunded or marginalized as "unfalsifiable." History departments would merge with Statistics or Physics departments.

  **B. Museum Labeling Protocols:**
  *   **Current:** "Bronze Age Sword, c. 1500 BCE." (Implies a consensus date based on typology and context).
  *   **New Norm:** "Bronze Age Sword. Date Probability Distribution: Mean 1500 BCE, SD 200 years. Model Confidence: 85%."
  *   **Consequence:** Museums would become visualizations of uncertainty. The "authority" of the object would diminish in favor of the "accuracy" of the dataset.

  **C. Textbook Authorization:**
  *   **Current:** Textbooks present the **Consensus Narrative** (the "Best Current Explanation").
  *   **New Norm:** Textbooks would present **Competing Models** weighted by statistical likelihood.
  *   **Consequence:** There would be no "History of Rome," but rather "Model A (Traditional) vs. Model B (Revisionist) with Likelihood Ratios." This would make history unintelligible to the public, as it removes the *narrative agency* required for moral and political learning from the past.

  ### 5. Conclusion: The Necessity of the Hermeneutic Boundary

  The institutional resistance to Fomenko is not merely gatekeeping; it is the defense of history's **object of study**.

  If history adopts a purely falsificationist/probabilistic criterion, it ceases to be the study of *human action in time* and becomes the study of *data patterns in records*. The implicit theory of historical knowledge presupposes that the past is **causally thick**. It contains meanings, intentions, and cultural contexts that do not reduce to statistical correlations.

  The demarcation is philosophically loaded because it asserts that **explanatory understanding (*Verstehen*)** is a valid form of knowledge distinct from **nomological prediction (*Erklären*)**. To privilege statistical coherence over hermeneutic continuity is to assume that human history is a random walk or a deterministic system susceptible to curve-fitting. Mainstream historiography rejects this not because it fears math, but because it posits that human agency introduces variance that statistical models cannot capture without erasing the very phenomenon (agency) they seek to study.

  Therefore, the practice is internally consistent: it uses probability to refine a causal narrative, but rejects statistical models that dissolve the causal narrative itself. To change this would not just change the dates in the textbooks; it would abolish history as a humanity.
