      *   *Reality Check:* While boundary policing *does* happen, Fomenko's work *has* been critiqued on mathematical and astronomical grounds (e.g., by astronomers regarding eclipse data, by statisticians regarding his correlation methods). However, the *philosophical* point the user is making is about *why* the discipline rejects it even if the math looked "okay" on the surface. The user is asking about the *epistemological framework*, not necessarily defending Fomenko.
