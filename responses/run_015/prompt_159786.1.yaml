answer: |-
  This practice is a textbook example of **Gricean Pragmatics** institutionalized. Specifically, it relies on the distinction between *what is said* (semantic content) and *what is implicated* (pragmatic inference). Below is an analysis of the philosophical presuppositions, norms, and functional dynamics of this system.

  ### 1. The View of Meaning
  For this practice to work, the committee must operate under a **dual-component theory of meaning**, broadly Gricean. It presupposes:

  *   **(a) The Semantics/Pragmatics Distinction:** There must be a real gap between the truth-conditional content of the sentence ("She is polite") and the speaker's intended meaning ("She is not a good researcher"). If meaning were exhausted by literal content (strict semanticism), the practice would be irrational.
  *   **(b) The Cooperative Principle & Common Ground:** The recovery of meaning must be reliable. This requires that both referee and committee share a specific **Common Ground** (a subcultural code). For the inference to be calculable, the committee must assume the referee is adhering to the *Maxim of Quantity* (make your contribution as informative as required).
      *   *The Calculation:* "If the candidate were excellent, the referee *would have said so*. They did not say so. Therefore, the candidate is not excellent."
  *   **What must be true:** It must be common knowledge within the discipline that certain predicates are "weak" in this context. "Diligent" implies "not brilliant"; "pleasant" implies "not impactful." If these associations were merely idiosyncratic, the practice would fail. The fact that it succeeds implies these implicatures are **generalized** or even **conventionalized** within the academic community.

  ### 2. Deniability and the Norm of Honesty
  This practice presupposes a **legalistic rather than moralistic norm of honesty**. It relies on the philosophical distinction between **lying** (asserting what one believes to be false) and **merely misleading** (implicating what one believes to be false, or withholding information to induce a false belief).

  *   **Where honesty bottoms out:** It bottoms out at *assertion*. The referee is held accountable only for the truth of the literal sentences. Since "She is polite" is true, the referee is honest.
  *   **Coherence:** Is this coherent? Philosophically, yes, if one accepts that the obligation of truthfulness attaches to the commitment of assertion, not to the total cognitive state of the hearer. However, ethicists like Jennifer Saul argue that misleading can be morally equivalent to lying.
  *   **The Fiction:** It is a **convenient social fiction**. Everyone knows the referee is communicating a negative. The institution allows this because it serves a protective function (see section 5). It allows the referee to fulfill their duty to the committee (warning them) without violating their duty to the candidate (not permanently blacklisting them).

  ### 3. Underdetermination: Strict Requirements vs. Fit
  *   **Strictly Required:** Any theory that allows for **non-literal inference based on norms of communication**. This rules out strict literalism or semantic minimalism.
  *   **Merely Fits:** The specific mechanism of inference.
      *   *Gricean Calculation:* The committee works out the implicature based on maxims.
      *   *Relevance Theory:* The committee processes the letter until they achieve optimal cognitive effects (the "faint praise" is effortful to process, so it must yield a specific negative insight).
      *   *Code Model:* The phrases are essentially a code where "polite" = "weak researcher."
  *   **What is ruled out:** The committee's behavior rules out the idea that **explicitness is always preferred for accuracy**. If the committee believed that explicit numerical grids were the most accurate representation of the referee's belief, they would weight them higher. By weighting the tone higher, they signal that they believe the *pragmatic* channel is less noisy than the *semantic* channel in this specific context. This suggests they view the grids as subject to "grade inflation" (cheap talk) and the letters as subject to "reputation risk" (costly signaling).

  ### 4. The Inconsistency (Grids vs. Letters)
  This is not logically inconsistent if the two channels serve different **epistemic functions**.

  *   **Grids (Screening):** The grids are for *comparison*. They are standardized to allow quick sorting of large pools. They are treated as "noise" in the final decision because they suffer from ceiling effects (everyone is "top 10%"). They are **low-cost signals**.
  *   **Letters (Vetting):** The letters are for *verification*. They are high-cost. A referee risks their own reputation if they recommend a bad candidate who then fails.
  *   **The Split:** The inconsistency is only apparent. The committee uses grids to filter out the bottom, but uses letters to distinguish the top. The reliance on implicature in letters is a feature, not a bug, because it allows for **risk-managed communication**. Explicit grids cannot capture the *nature* of a flaw without destroying the candidate; implicature can. The split is functional: Grids handle the *quantitative* comparison; Letters handle the *qualitative* risk assessment.

  ### 5. Concrete Loss: What Implicature Carries that Assertion Cannot
  If you replaced letters with fully explicit assertions (e.g., "Candidate has weakness X"), you would lose specific informational states regarding **future marketability and referee liability**.

  1.  **Preservation of External Value:** Implicature allows a referee to signal "Not for *us*" without signaling "Not for *anyone*." An explicit assertion ("Her research is subpar") travels with the candidate to other institutions. An implicature ("She is polite") is context-sensitive; a different committee might interpret "polite" differently or prioritize teaching over research. Implicature keeps the negative evaluation **local** to the specific hiring context.
  2.  **Signaling Degrees of Uncertainty:** Explicit assertions are binary or ordinal. Implicature can carry **probabilistic confidence**. "I have no doubt she will do well" (implicating: elsewhere) signals a specific kind of reservation that a "3/5" on a grid cannot. It conveys: "I am confident enough to recommend her, but not confident enough to champion her."
  3.  **The "Poison Pill" Avoidance:** If a referee explicitly asserts a negative, and the candidate sues or grievances, the institution is liable. Implicature provides **plausible deniability** that protects the institution from legal or administrative backlash. Explicitness removes this shield.

  ### 6. The Counterfactual: Strict Literalism
  If the convention flipped (letters read literally, implicature banned):

  *   **Collapse of Information:** Referees would stop writing informative letters. They would retreat to tautologies ("X was enrolled in my class"). The risk of writing an explicit negative ("X is lazy") is too high (burning bridges, lawsuits, hurting the student).
  *   **Migration to Back Channels:** The evaluation would not disappear; it would migrate to **unrecorded channels**. Phone calls, private emails, or hallway conversations at conferences ("Off the record, don't hire him").
  *   **Why the Current System Survives:** The current system survives because it **formalizes the back channel**. It puts the "whisper" into a permanent file without making it an explicit accusation. It balances the committee's need to know against the candidate's right to a fair record. A strict literalist regime would either result in useless letters or a shadow system of verbal warnings that is less equitable (since not all committee members have the same phone access).

  ***

  ### Confidence and Uncertainty

  **Confidence Level:** **High (85-90%)** on the pragmatic analysis (Gricean framework, lying vs. misleading, costly signaling). **Moderate (60-70%)** on the sociological predictions regarding the counterfactual collapse.

  **Point of Least Certainty:**
  I am least sure about the classification of these implicatures as **Generalized Conversational Implicatures** versus **Conventionalized Implicatures**.
  *   *Why:* In standard Gricean theory, conversational implicatures are calculable and cancelable ("She is polite, and actually she's also brilliant"). In academic letters, "She is polite" is often *not* cancelable without sounding suspicious. If it is truly conventionalized (like a code), then the "deniability" aspect is weaker than I suggest—everyone knows it's a code, so the "lie" of omission is more transparent. If it's a code, the "honesty" defense is shakier than the Gricean model suggests. The practice likely sits in a hybrid zone between a social code and a pragmatic inference, and exactly where that line is drawn determines how morally defensible the "deniability" really is.
