answer: |-
  **Project Title:** The Internal Architecture of Suffering: Testing the Coherence of Lexical Threshold Negative Utilitarianism Without Intrasuffering Commensurability

  **1. Research Question**
  Lexical Threshold Negative Utilitarianism (LTNU) asserts that suffering holds lexical priority over well-being: no quantity of pleasure can justify imposing any amount of suffering. Standard defenses of this view focus on the *inter-category* boundary between suffering and pleasure, arguing that they are morally discontinuous. This project investigates a prior, under-examined condition: the *intra-category* structure of suffering itself.

  The central research question is: **Can LTNU be formulated coherently without assuming that suffering is a unitary, cardinally measurable quantity?** Specifically, if distinct forms of suffering (e.g., physical pain, existential dread, social humiliation) are heterogeneous and not inter-substitutable, does the lexical rule "any suffering outweighs any pleasure" retain its normative force, or does it presuppose a hidden commensurability within the suffering category? I will further ask whether the anti-tradeoff intuition central to LTNU survives if we relax the assumption of cardinal comparability among suffering types.

  **2. Context and Gap**
  Existing literature on negative utilitarianism predominantly treats suffering as a monolithic variable. Debates typically employ intuition pumps comparing extreme suffering (e.g., torture) against aggregated mild pleasures (e.g., specks of dust) to establish the lexical threshold. These arguments successfully challenge classical utilitarian aggregation but leave the internal topology of suffering unanalyzed.

  Defenders of LTNU often rely on ordinal rankings to avoid cardinal measurement between suffering and pleasure. However, this leaves open the problem of intrasuffering comparison. If suffering is pluralistic—composed of incommensurable types—then identifying the trigger for the lexical prohibition becomes problematic. To claim that "any suffering" blocks a tradeoff, one must be able to identify instances of suffering against a unified background. If suffering types are not cardinally comparable, prioritizing the prevention of one type over another may require an aggregation rule that implicitly reintroduces cardinality. Alternatively, refusing such aggregation risks collapsing the view into an unworkable pluralism where agents cannot decide between preventing different kinds of suffering, or into ordinary negative utilitarianism where the lexical barrier is dissolved to allow for minimization across heterogeneous types. Current treatments leave this structural vulnerability open by focusing exclusively on the suffering-pleasure boundary rather than the architecture of the suffering side itself.

  **3. Methodology**
  This project employs pure conceptual analysis and logical modeling, requiring no empirical data or archival access. The work will proceed in three phases:

  *   **Conceptual Analysis of Lexical Priority:** I will analyze the logical conditions required for a lexical rule to function. Specifically, I will test whether a lexical threshold can operate over a disjunction of incomparable values. This involves defining what "lexical priority" means when the prioritized category lacks internal homogeneity. I will examine whether the rule requires a single metric to identify violations or if it can function as a set of independent veto constraints.
  *   **Comparative Framework Analysis:** I will construct a structured comparison between LTNU and non-lexical negative utilitarian frameworks that abandon the threshold. By modeling decision scenarios involving heterogeneous suffering types (e.g., choosing between preventing physical pain vs. preventing humiliation), I will test whether LTNU offers distinct guidance without covertly relying cardinal measurement. This will highlight whether the lexical barrier collapses when intrasuffering comparability is removed.
  *   **Reconstruction of Aggregation Rules:** I will examine whether aggregation rules for heterogeneous suffering can be reconstructed without cardinal measurement. This involves exploring ordinal or vector-based approaches to suffering prevention. I will assess whether these approaches can sustain the absolute prohibition on trading suffering for pleasure, or if they necessarily permit tradeoffs within the suffering category that undermine the lexical intent.

  **4. Expected Outcomes**
  **Success:** A successful outcome will be a reformulated version of LTNU that preserves the absolute prohibition on trading suffering for pleasure without presupposing the internal homogeneity of suffering. This might take the form of a "pluralistic lexicality" where each type of suffering generates an independent lexical constraint, or a demonstration that ordinal rankings within suffering are sufficient to maintain the threshold. This would strengthen LTNU against charges of oversimplification regarding the nature of pain.

  **Failure:** A negative result would demonstrate that LTNU cannot function without hidden cardinal assumptions. This would manifest as a proof that without intrasuffering commensurability, the view either leads to decision paralysis (unworkable pluralism) or requires aggregating suffering types to prioritize prevention, thereby collapsing into standard negative utilitarianism without the lexical barrier. Either outcome clarifies the metaphysical commitments required to hold the view.

  **5. Scope and Work Plan**
  This is a three-month solo research project focused on ideal theory. The scope is strictly limited to the logical coherence of the normative framework.

  *   **Inclusions:** The project will focus on the logical structure of the lexical rule and the metaphysics of value required to sustain it. It will address the definition of "suffering" only insofar as is necessary to distinguish types for the purpose of comparability.
  *   **Exclusions (Bracketed):** I will bracket empirical questions regarding the psychology of pain or the sociological nature of humiliation; these will be treated as philosophical categories rather than empirical objects. I will also bracket non-ideal theory questions regarding implementation under uncertainty. Finally, I will not address the positive ethics of what to do in the absence of suffering, focusing solely on the negative constraint.

  **Timeline:**
  *   **Month 1:** Formalize the definitions of lexical priority and intrasuffering incomparability. Map the logical dependencies between cardinality and the lexical threshold.
  *   **Month 2:** Develop the comparative models and test scenarios involving heterogeneous suffering. Draft the analysis of aggregation rules.
  *   **Month 3:** Synthesize findings into the final reformulation or impossibility proof. Polish the manuscript for submission.

  This scope is realistic for independent work as it relies on logical derivation rather than data collection. The bracketing of empirical and non-ideal factors ensures the core conceptual problem can be resolved within the three-month window.
