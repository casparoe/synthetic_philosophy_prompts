answer: |-
  **Selected Mechanic:** *The Confirmation Market.* (Rejected: 1. Betting on predictions, 2. Split groups with different hypotheses. Selected: Single hypothesis, dual-cost markets to force efficiency trade-offs.)

  ### Materials
  *   **Deck:** 100 cards. 2 Black Ravens, 1 Non-Black Raven (Green), 97 Non-Ravens (White Shoes, Red Cars, etc.).
  *   **Currency:** Poker chips (50 per participant).
  *   **Board:** Markers.
  *   **Sheets:** For tracking spending and scores.

  ### Setup & Rules
  Write **"All Ravens are Black"** on the board. Explain that the deck represents the world. Participants must spend chips to buy cards from one of two face-down piles to increase their "Confirmation Score."
  *   **Sky Pile:** Costs 10 chips/card. Contains mostly Ravens.
  *   **Street Pile:** Costs 1 chip/card. Contains mostly Non-Ravens (Shoes).
  *   **Scoring:** Each card that *does not falsify* the rule adds 1 point. A Non-Black Raven ends your turn immediately (loss).
  *   **Goal:** Maximize Points Per Chip (Efficiency).

  ### Timeline

  | Phase | Minutes | Activity |
  | :--- | :--- | :--- |
  | **Market Open** | 10 | Distribute chips/rules. No discussion of logic yet. |
  | **Trading** | 30 | Participants buy cards, record costs and results. |
  | **Tally** | 15 | Calculate Efficiency scores. Reveal deck composition. |
  | **Debrief** | 20 | Discuss the value of "Street" purchases. |

  ### Debrief & Mapping
  1.  **The Sting:** Ask Street buyers, "Did a white shoe help prove ravens are black?" They will say "No," yet their score increased.
  2.  **The Equivalence:** Ask, "What rule *did* the shoe test?" Wait for silence. Write **"All Non-Black Things are Non-Ravens"** on the board. Ask if this is logically different. When they agree it is the same, the paradox lands: they paid for shoes to prove a rule about ravens.
  3.  **The Arithmetic:** Acknowledge the shoe's value is tiny (1 point) compared to the Raven (1 point), but the cost difference (1 vs 10 chips) makes the shoe the *better buy* for efficiency. This validates the math while preserving the discomfort.

  ### Predictable Problems & Recovery
  *   **Problem:** Participants hoard chips to avoid the "loss" card.
      *   **Recovery:** Announce a "Minimum Spend" requirement halfway through to force market engagement.
  *   **Problem:** They claim the game is rigged because the deck is finite.
      *   **Recovery:** Agree. Note that in the real world, the "Street" is vastly larger than the "Sky," making the shoe's confirmation even tinier, but the cost difference remains.
  *   **Problem:** They miss the logical equivalence.
      *   **Recovery:** Ask: "If you found a green raven, which rule would it break?" (Both). "If you found a white shoe, which rule does it satisfy?" (Both).

  ### Limitations
  The game cannot reproduce the **reference class problem**. In the game, the deck is fixed. In reality, deciding what counts as a "Non-Black Thing" is ambiguous. You must state this aloud: "In the game, the shoe is clearly a non-raven. In life, defining the background set is where the real trouble begins." Additionally, the game treats confirmation as additive points; real Bayesian updating is multiplicative. Keep this honest: "We used points for simplicity, but the logic of proportion holds."
