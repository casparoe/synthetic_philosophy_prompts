answer: |-
  This is a wonderfully precise question, and your framing is far from clumsy. As an experimentalist, you have identified the exact friction point between the mathematical idealization of Bayesianism and the messy reality of scientific practice.

  To answer how Frank Ramsey would have responded, we must first make a crucial historical distinction that actually changes the Bayesian calculus, and then reconstruct Ramsey's philosophical stance based on his known writings (principally *Truth and Probability*, 1926) and his pragmatic temperament.

  ### 1. A Physicist's Correction: 1919 vs. Mercury
  First, a minor historical correction that bears directly on the math. The 1919 Eddington eclipse expedition is actually **not** a case of "old evidence" in the strict philosophical sense.
  *   **General Relativity (GTR)** was published in 1915.
  *   **The 1919 Eclipse Data** did not exist until 1919.

  In Bayesian terms, at the time GTR was being evaluated, $P(E)$ (the probability of the specific measurement results) was definitely less than 1. The data was a *novel prediction*. Bayes' theorem handles novel predictions effortlessly: if $P(E|GTR)$ is high and $P(E|Newton)$ is low, and $P(E)$ is small (because the outcome was uncertain), the posterior $P(GTR|E)$ rises significantly.

  The canonical example of the Problem of Old Evidence (POE) is actually the **perihelion of Mercury**. That anomaly was known since 1859 (Le Verrier), long before Einstein formulated GTR in 1915. By 1915, $P(\text{Mercury's Anomaly}) \approx 1$. This is where the math breaks: if $P(E)=1$, then $P(E|H)=1$, and $P(H|E) = P(H)$. The theory gets no confirmation boost.

  I will assume your question applies to the structural problem (using Mercury as the mental model), as this is where the philosophical difficulty lies.

  ### 2. Ramsey's Likely Response
  Frank Ramsey died in 1930, decades before Clark Glymour and others formalized the POE in the 1980s. However, based on his subjective Bayesian framework, we can reconstruct his likely reaction with high confidence.

  Ramsey would almost certainly **reject the premise that $P(E) = 1$**.

  #### A. Radical Fallibilism
  Ramsey was a pragmatist. In *Truth and Probability*, he argues that degrees of belief are measured by betting odds. An experimentalist like yourself knows that no measurement is ever certain. Even "background knowledge" is subject to systematic error, calibration issues, or re-interpretation.
  *   **Ramsey's View:** To assign $P(E) = 1$ to any empirical proposition is a logical error. It violates the spirit of coherence because it shuts down the possibility of updating.
  *   **Application:** Even for Mercury, a Ramseyian Bayesian would argue that while the *community* treated the data as certain, a rational agent should assign $P(E) = 1 - \epsilon$. If $P(E)$ is not strictly 1, the likelihood ratio can still do work. The confirmation comes from the fact that GTR makes $E$ *more stable* or *more expected* than the rival theory does, even if $E$ is already believed.

  #### B. Updating on Logical Relations (The "Garber" Solution)
  If we grant the idealization that $P(E)=1$, Ramsey would likely argue that the **object of confirmation** is not $E$ itself, but the *logical relationship* between $H$ and $E$.
  *   **The Insight:** Before 1915, scientists knew $E$ (Mercury's orbit) but did not know that $GTR \vdash E$ (GTR entails $E$). The "new information" acquired in 1915 was not the data, but the *logical fact* that this new theory explained the old data.
  *   **Ramsey's Framework:** Ramsey acknowledged that humans are not logically omniscient. We learn logical truths over time. In his system, learning that "$H$ entails $E$" is a valid proposition upon which to conditionalize.
  *   **The Result:** You update your probability of $H$ not on $E$, but on the proposition "$H$ explains $E$." This preserves the Bayesian calculus without needing to lower $P(E)$. Given Ramsey's focus on the *psychology of reasoning*, he would find this natural: the "surprise" isn't the data, it's the theoretical unification.

  ### 3. Would He Supplement with Non-Probabilistic History?
  You asked if Ramsey would conclude that Bayesian confirmation must be supplemented by a non-probabilistic account of the history of discovery.

  **Almost certainly not.**

  Ramsey was a systematic thinker who sought to unify logic, probability, and truth. He was hostile to dualistic solutions that separated "context of discovery" (history/psychology) from "context of justification" (logic/probability).
  *   **Unity of Method:** Ramsey viewed probability as the "logic of partial belief." For him, there is no "outside" to the probabilistic framework. If historical context matters, it must be because it affects the agent's degrees of belief.
  *   **The Role of History:** He would argue that the history of discovery is relevant only insofar as it changes the agent's information state. If the history shows that the scientist *didn't know* $H$ entailed $E$ until time $t$, that is a probabilistic fact about the agent's state at $t-1$.
  *   **Rejection of Externalism:** Suggesting a non-probabilistic supplement would look to Ramsey like giving up on the project of a unified theory of rationality. He would prefer to refine the probabilistic model (e.g., by accounting for logical learning or fallibilism) rather than patch it with external historical narratives.

  ### 4. Summary: The Ramseyian Verdict
  If you presented the Problem of Old Evidence to Frank Ramsey, he would likely tell you that the problem arises from **over-idealizing the agent**.

  1.  **Against Certainty:** He would argue that treating empirical evidence as $P(E)=1$ is a misuse of the probability calculus. Experimental data is always uncertain (a point you know well).
  2.  **Against Omniscience:** He would argue that treating the link between Theory and Evidence as immediately known is false. Learning that link is a probabilistic update.
  3.  **Against Supplementation:** He would insist that the history of discovery can be fully absorbed into the Bayesian framework by modeling the agent's changing knowledge state, rather than requiring a separate non-probabilistic logic.

  **In short:** Ramsey would not see POE as a failure of Bayesianism, but as a failure to apply Bayesianism realistically to human agents. He would argue that the 1919 eclipse (or Mercury's perihelion) confirms GTR because the theory renders the evidence *coherent* with a broader system of beliefs, and realizing that coherence is a genuine update in information, even if the data itself is old.

  As a physicist, you might appreciate that Ramsey's solution aligns with experimental practice: we never treat data as absolute truth ($P=1$), and we value a theory highly when it unexpectedly unifies disparate data points (learning the logical relation). Ramsey would say the math should reflect that practice, not idealize it away.
