answer: |-
  1. 'The hidden shape'
  You've built a machine running on its own exhaust. You four are the engine, fuel, and mechanics. Every decision needs everyone's yes, but the rule demanding unanimity exists only because you all voted yes to it. It's a closed circuit. There's no switch outside the box. You're standing on a rug you're also holding up. Your friend sees a perfect sphere, self-contained and pure. You see a snake eating its tail, wondering where the body starts. The structure is pure agreement, but agreement needs something to agree *about* before the rules kick in. Right now, the rules are the only thing that exists. You're building a house where the blueprint draws itself, but someone needs to hold the pen. Logic loops forever, leaving no solid ground when the ink runs dry.

  2. 'Can the circle hold?'
  Here's the thing about circles: they're great for holding things together, but terrible for moving forward. In theory, your system is beautiful democracy. In practice, it's a veto factory. One person's bad day becomes the project's death sentence. Without an outside tiebreaker, stagnation isn't just a risk; it's the default state. Pure consensus usually works only until stakes get high or fatigue sets in. Then, the loop tightens. You stop creating and start negotiating the rules of creation. That energy drain kills stories. Stories need momentum, and momentum requires friction. If everyone has to agree on every spark, the fire never catches. Eventually, someone will quietly stop showing up, or you'll force a decision just to end the pain, breaking the very rules you swore by. The circle doesn't necessarily collapse explosively; it just calcifies. You become guardians of the process instead of writers of the book. The system protects itself from bad choices by preventing good ones from happening too.

  3. 'The outside pencil'
  You don't need a dictator, but you need a tiebreaker. Think less "boss" and more "producer." The outside pencil isn't someone who writes the story; it's someone who holds the final cut. Without that hand outside the frame, you're just four mirrors reflecting each other. Readers don't care about your voting rules. They care about coherence. If the story feels like a compromise, it'll read like one. Appointing a lead doesn't kill collaboration; it gives it a destination. You need someone to say, "We've talked enough; this is the version we're printing." That authority holds the paper steady while you draw. It stops the infinite reflection and lets the ink dry.

  4. 'Bottom line'
  Push for the showrunner. Your partner sees art; you see a deadline. Both are valid, but books need to finish. The loop feels noble now, but resentment builds in silence. If you value the friendship, don't let the process destroy it. Appoint a lead, even temporarily. Call it a "narrative captain" if "boss" tastes bad. Give them veto power only when you're stuck. It breaks the philosophical purity, sure, but it saves the actual book. Get the pencil moving, even if one hand guides it. Your instinct about the missing ground is right.
