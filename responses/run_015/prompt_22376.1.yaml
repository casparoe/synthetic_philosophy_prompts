answer: |-
  This is a classic debate in political philosophy (often framed by the work of John Stuart Mill, Ronald Dworkin, and Amartya Sen respectively). In the context of a **small university housing policy**, where housing stock is limited and allocation is zero-sum (giving one student a single room means another gets a double), the choice of metric drastically changes who gets priority.

  Here is an analysis of the implications of each metric, focusing specifically on **conflict cases** where the three frameworks rank students differently.

  ### 1. The Three Metrics Defined (in Housing Context)

  *   **Equality of Welfare:** The goal is to equalize subjective well-being, happiness, or preference satisfaction derived from the housing.
  *   **Equality of Resources:** The goal is to equalize the objective material value of the housing (square footage, amenities, cost, location).
  *   **Equality of Capabilities:** The goal is to equalize the substantive freedom to achieve valuable "functionings" (e.g., the ability to study effectively, sleep safely, maintain health, participate in campus life).

  ---

  ### 2. Conflict Cases: Where the Metrics Diverge

  To understand the policy implications, we must look at specific student profiles where these metrics yield contradictory rankings for priority housing.

  #### Case A: The "Conversion Factor" Conflict (Disability vs. Health)
  *   **Student X:** Has a chronic physical disability requiring a wheelchair.
  *   **Student Y:** Has no physical disabilities but suffers from severe anxiety that is exacerbated by shared living.
  *   **Student Z:** Has no disabilities and is psychologically resilient.

  | Metric | Ranking Logic | Policy Implication |
  | :--- | :--- | :--- |
  | **Resources** | **X = Y = Z.** All are entitled to the same square footage and amenity bundle. | **Blind Lottery.** X and Y are disadvantaged because the "same" room does not work the same way for them. X cannot maneuver; Y cannot sleep. |
  | **Welfare** | **Priority to the most miserable.** If X is miserable in standard housing, they get priority. However, if Y's anxiety causes *more* subjective suffering than X's physical inconvenience, Y might rank higher. | **Subjective Distress.** The policy requires mental health audits. It risks prioritizing the student who complains the loudest or suffers the most subjectively, regardless of the *cause*. |
  | **Capabilities** | **Priority based on functional blockage.** X needs a wider door to have the *capability* of mobility. Y needs a single room to have the *capability* of rest. Z needs neither. | **Needs-Based Assessment.** Both X and Y get accommodations over Z, but for different reasons. The focus is on restoring their ability to function as students, not on making them "happy." |

  **Implication:** Under **Resources**, the university is "blind" to inequality. Under **Welfare**, the university becomes a therapist. Under **Capabilities**, the university becomes an accessibility office.

  #### Case B: The "Expensive Tastes" Conflict (Adaptation vs. Demand)
  *   **Student A:** Has "expensive tastes." They believe they can only study effectively in a luxury suite with a private kitchen. They are miserable in a standard dorm.
  *   **Student B:** Has "adaptive preferences." They grew up in poverty and are genuinely happy and grateful for even a low-quality shared room.
  *   **Student C:** Has standard needs. Happy in a standard dorm, but functions better in a single.

  | Metric | Ranking Logic | Policy Implication |
  | :--- | :--- | :--- |
  | **Resources** | **A = B = C.** Everyone gets a standard room. A is unhappy; B is happy. | **Strict Egalitarianism.** The policy ignores A's unhappiness and B's gratitude. It treats the housing as a commodity to be divided equally. |
  | **Welfare** | **Priority to A.** To equalize welfare, you must boost A's happiness up to B's level. Since B is easily satisfied, resources might be wasted on B, while A requires the luxury suite to reach the same welfare baseline. | **Rewarding Demands.** This creates a perverse incentive. Students learn that expressing dissatisfaction or having high demands yields better housing. B is penalized for being easy-going. |
  | **Capabilities** | **Priority to C (and potentially A).** Does A *need* a kitchen to study? No. Does C need a single to study? Maybe. A's preference is a desire, not a capability requirement. | **Objective Needs.** The policy denies A the luxury suite because it doesn't expand their *freedom* to function, only their *pleasure*. C might get priority over B if C needs silence to function and B can study anywhere. |

  **Implication:** **Welfare** risks exhausting the housing budget on students with high-maintenance preferences. **Capabilities** draws a hard line between "needs" (functioning) and "wants" (satisfaction).

  #### Case C: The "Social vs. Scholar" Conflict
  *   **Student D:** A social extrovert whose well-being and academic success depend on communal living and noise.
  *   **Student E:** A reclusive scholar whose well-being and academic success depend on isolation and silence.

  | Metric | Ranking Logic | Policy Implication |
  | :--- | :--- | :--- |
  | **Resources** | **D = E.** Both get a standard room in a standard hall. | **One-Size-Fits-All.** D thrives; E fails. The resource is equal, but the outcome is not. |
  | **Welfare** | **Equalize Satisfaction.** If E is miserable in the dorm, they get moved to quiet housing. If D is miserable in quiet housing, they get moved to the party dorm. | **Matching Preferences.** The policy becomes a matching algorithm based on happiness surveys. |
  | **Capabilities** | **Equalize Opportunity.** Both need the *capability* to study. E needs a quiet room to achieve this; D can achieve it in a noisy room. | **Asymmetric Allocation.** E gets the quiet single room. D gets the standard shared room. Why? Because D *can* function in the shared room, whereas E *cannot*. |

  **Implication:** **Capabilities** justifies unequal treatment (giving E a better room than D) to ensure equal opportunity. **Resources** forbids this unequal treatment even if it harms E's education.

  ---

  ### 3. Design Implications for the University

  If your university adopts one of these frameworks, the administrative machinery changes significantly:

  #### If you choose Equality of Resources:
  *   **Mechanism:** Lottery, First-Come-First-Served, or Class-Year based.
  *   **Administrative Burden:** Low. No need to assess personal circumstances.
  *   **Risk:** Systemic disadvantage for disabled or neurodivergent students. It treats students as abstract units rather than human beings with different conversion factors.
  *   **Moral Hazard:** None. Students cannot game the system.

  #### If you choose Equality of Welfare:
  *   **Mechanism:** Surveys, mental health assessments, "happiness" audits.
  *   **Administrative Burden:** Very High. Requires constant monitoring of student satisfaction.
  *   **Risk:** The "Expensive Tastes" problem. Students may exaggerate distress to secure better rooms. It privileges those who are harder to satisfy.
  *   **Moral Hazard:** High. Incentivizes complaining.

  #### If you choose Equality of Capabilities (Recommended for Universities):
  *   **Mechanism:** Needs-based assessment focused on *academic and physical functioning*.
  *   **Administrative Burden:** Medium. Requires documentation (e.g., doctor's notes for disability, academic advisor notes for study needs).
  *   **Risk:** Paternalism. The administration decides what students "need" to function, which can be intrusive.
  *   **Moral Hazard:** Medium. Students may try to medicalize normal preferences to gain priority.

  ### 4. Summary of the Argument

  In your argument with your friend, the crux of the disagreement likely rests on **responsibility** and **objectivity**.

  1.  **Resources** are objective but blind to human diversity. In a housing context, this is often too rigid (e.g., giving a blind student the same room as a sighted student is "equal resources" but unequal access).
  2.  **Welfare** is sensitive to human diversity but subjective and manipulatable. It risks punishing the stoic student who makes the best of a bad situation.
  3.  **Capabilities** attempts to split the difference. It acknowledges that different students need different resources (unlike Resourcism) but insists those resources must be tied to objective functionings like health and education, not just subjective happiness (unlike Welfarism).

  **For a university,** whose mission is explicitly tied to *functionings* (learning, researching, developing), the **Capabilities Approach** is usually the most defensible. It justifies giving a single room to a student with ADHD (to enable the capability of studying) while denying one to a student who simply prefers luxury (which is a welfare preference, not a capability requirement).

  However, the cost is administrative complexity and the need for the university to make intrusive judgments about what constitutes a "valid" need for housing.
