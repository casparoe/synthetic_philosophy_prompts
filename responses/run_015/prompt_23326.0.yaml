answer: |-
  This is a classic stumbling block. The intuition that "we just keep going up until we hit the top" hides the two specific logical hurdles that Zorn's Lemma clears: the **limit step** (handling infinity) and the **choice step** (handling ambiguity).

  Here is a breakdown suitable for seminar notes, distinguishing the hypothesis from the conclusion, pinpointing the Axiom of Choice (AC), and correcting the "union of chains" misconception.

  ### 1. The Conceptual Gap: Hypothesis vs. Conclusion

  You asked why "every chain has an upper bound" isn't just a weaker way of saying "there is a maximal element." Logically, it is the premise that implies the conclusion, but conceptually they describe different structural features of the partially ordered set (poset) $P$.

  *   **The Hypothesis (Chain Completeness):** This is a statement about **subsets**. It says the poset has no "holes" relative to totally ordered subsets. If you have a line of elements going up, there is always a ceiling *somewhere* in the poset. It prevents the poset from "leaking" at the top of any specific direction.
  *   **The Conclusion (Existence of Maximal):** This is a statement about **elements**. It claims there is a specific point $m$ where *all* directions stop.

  **Why the gap matters:**
  Consider the interval $[0, 1)$ with the usual order.
  *   Take the chain $C = \{0, 1/2, 3/4, 7/8, \dots\}$.
  *   Does it have an upper bound *in the set*? No. The supremum is $1$, but $1 \notin [0, 1)$.
  *   Therefore, $[0, 1)$ **fails** Zorn's hypothesis. Consequently, it has no maximal element.

  Now consider $[0, 1]$.
  *   Every chain has an upper bound in the set (the supremum is always $\le 1$).
  *   There is a maximal element ($1$).

  The hypothesis ensures that chains don't "run off the edge" of the poset without a ceiling. However, the hypothesis **does not guarantee that the ceiling is part of the chain**, nor does it guarantee that the ceiling is the *global* maximum. It is possible to have a chain with an upper bound $u$, where $u$ is not maximal because there exists some $v$ incomparable to the chain but $v > u$.

  Zorn's Lemma asserts that if you prevent chains from running off the edge (Hypothesis), you force the existence of a "peak" somewhere (Conclusion). The proof is the bridge that connects "local ceilings for lines" to "a global peak."

  ### 2. The Proof Mechanism: Transfinite Recursion

  Your intuition ("pick a longer and longer chain until it can't") is the core of the proof, but to make it rigorous, we must use **transfinite recursion** along the ordinals.

  We attempt to construct a strictly increasing chain indexed by ordinals: $\{x_\alpha\}$.
  1.  **Start:** Pick any $x_0 \in P$.
  2.  **Successor Step:** Given $x_\alpha$, if $x_\alpha$ is not maximal, there exists some $y > x_\alpha$. We want to set $x_{\alpha+1} = y$.
  3.  **Limit Step:** Given a limit ordinal $\lambda$ and the chain $\{x_\beta \mid \beta < \lambda\}$, let $C_\lambda = \bigcup_{\beta < \lambda} \{x_\beta\}$. This $C_\lambda$ is a chain. By Zorn's hypothesis, $C_\lambda$ has an upper bound $u$ in $P$. We want to set $x_\lambda = u$ (or something strictly above it).

  **Where does it stop?**
  The construction must stop. The class of ordinals is a proper class, but $P$ is a set. By Hartogs' Theorem, there is an ordinal $\gamma$ that cannot be injected into $P$. Therefore, the recursion cannot continue strictly increasing forever. It must halt at some ordinal $\mu$.
  When it halts, it means we could not find a strict upper bound for $x_\mu$. Thus, $x_\mu$ is maximal.

  ### 3. Where the Axiom of Choice Does the Work

  This is the most critical technical point. You wrote: *"The proof just picks a longer and longer chain."*

  **The Problem:** "Picking" is not a valid mathematical operation when done infinitely many times without a rule.
  *   At step 0, you pick $x_0$. (Finite choice, no AC needed).
  *   At step 1, you need to pick $x_1 > x_0$. There might be many such elements. Which one?
  *   At step $\omega$, you have a chain $C_\omega$. It has *many* upper bounds. Which one do you pick to be $x_\omega$?

  To define the sequence $\{x_\alpha\}$ by recursion, you need a **function** that tells you exactly which element to pick next, given the current chain.

  **The Role of AC:**
  The Axiom of Choice allows us to assert the existence of a **choice function** $f$ on the collection of all non-empty subsets of $P$.
  Specifically, for any chain $C \subset P$, let $U(C)$ be the set of strict upper bounds of $C$.
  *   If $C$ has no strict upper bound, $U(C) = \emptyset$ (and we stop).
  *   If $C$ has strict upper bounds, $U(C) \neq \emptyset$.

  AC guarantees we can fix a function $f$ such that for every chain $C$ with $U(C) \neq \emptyset$, $f(U(C)) \in U(C)$.
  The recursion is then defined deterministically: $x_{\alpha+1} = f(U(\{x_\beta \mid \beta \le \alpha\}))$.

  **Without AC:** You can prove that for any *finite* $n$, there exists a chain of length $n$. You can even prove that for any specific ordinal $\alpha$, *if* you are given choices, you can reach $\alpha$. But you cannot prove the existence of the *single function* that defines the whole sequence simultaneously. You would get stuck at the first limit ordinal where you need to make a choice you haven't pre-committed to.

  ### 4. Why You Can't Just "Take the Union of All Chains"

  You asked: *"Why you can't just take the union of all chains."*

  There are two ways to interpret this, and both fail for specific reasons:

  **Interpretation A: The Union of All Possible Chains in $P$**
  Let $\mathcal{C}$ be the set of all chains in $P$. Consider $U = \bigcup_{C \in \mathcal{C}} C$.
  *   **Failure:** Since every singleton $\{x\}$ is a chain, $U$ is simply the whole poset $P$.
  *   **Why it fails:** $P$ is not necessarily a chain. Zorn's hypothesis only applies to **chains**. You cannot apply the hypothesis to $P$ to get an upper bound for $P$, because $P$ might not be totally ordered.

  **Interpretation B: The Union of the Constructed Chain at Limit Stages**
  In the transfinite proof, at a limit ordinal $\lambda$, we *do* take the union of the chain constructed so far: $C_\lambda = \bigcup_{\beta < \lambda} \{x_\beta\}$.
  *   **Success:** This $C_\lambda$ **is** a chain (because the $x_\beta$ were constructed to be comparable).
  *   **The Catch:** Taking the union gives you the set $C_\lambda$. It does **not** give you the next element $x_\lambda$.
  *   **Why AC is still needed:** The hypothesis tells you an upper bound for $C_\lambda$ *exists*. It does not tell you *which one* it is. To continue the recursion to $\lambda + 1$, you must select a specific element from the set of upper bounds. If you don't select one specifically, you haven't defined $x_\lambda$, and the recursion is ill-defined.

  ### Summary for Your Notes

  1.  **Hypothesis $\neq$ Conclusion:** The hypothesis ensures chains don't "escape" the poset (completeness); the conclusion asserts a "peak" exists (maximality). The hypothesis allows for upper bounds that are not maximal; the proof shows that if you chase upper bounds far enough, you run out of room and hit a maximal one.
  2.  **The Limit Step:** At limit ordinals $\lambda$, the union of the previous chain $C_\lambda$ is a chain. The hypothesis guarantees $C_\lambda$ has an upper bound. This prevents the construction from "falling through a hole" at infinity.
  3.  **The Axiom of Choice:** AC is required to define the **successor step** uniformly. It provides a choice function that selects a specific strict upper bound for *every* non-maximal chain. Without AC, we cannot guarantee the existence of the transfinite sequence required to reach the maximal element.
  4.  **Stabilization:** The process stabilizes not because the upper bound condition forces it, but because the **cardinality of the ordinals exceeds the cardinality of the set $P$** (Hartogs' number). We run out of distinct elements to pick, forcing the chain to stop growing, which implies maximality.

  This distinction between "existence of a bound" (Hypothesis) and "selection of a bound" (AC) is usually the key conceptual pivot in a logic seminar.
