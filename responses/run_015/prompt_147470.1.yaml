  Arrange desks in a closed loop to simulate a neural network. Divide the fourteen students into three groups: five Architects, five Nodes, and four Monitors. You act as the Hidden Facilitator. The cover story is "The Continuity Engine," a self-modifying algorithm. Architects design transformation rules (e.g., "add 2 to input"); Nodes pass cards representing data states; Monitors verify output stability. The goal is maintaining a stable sequence across ten ticks. Students assume internal causation: Node A's output physically determines Node B's input. In reality, you hold the master deck. The Nodes are physically incapable of transmitting value; they merely hold cards you distribute. This layout creates the illusion of a self-sustaining causal chain while positioning you as the invisible sustainer. The physical separation prevents Nodes from seeing your interventions, reinforcing the belief that their peers are generating the effects. Ensure Architects believe their rules write the system's code, while Nodes believe they execute it. Use movable desks to isolate Nodes, preventing collusion. The room should feel like a server farm.

  2. Rules and Timeline
  0–15 min: Briefing and Design. Architects write rules on whiteboards, believing they program the network. 15–45 min: Rounds 1–3. Nodes pass cards. Hidden Mechanic: Between ticks, you collect all cards. You ignore the Architects' rules. You manually write new values on cards based on your own whim, then redistribute. The Nodes never compute; they merely hold state. Algorithm Analogy: Tell them this is a self-modifying network where internal weights should update automatically. In reality, you overwrite the weights externally every cycle. Stakes: The group shares 100 Stability Points. Lose 10 for every discontinuity between expected and actual output. 45–60 min: Crisis. Architects tweak rules; failure persists. You announce: "Internal weights are resetting externally." 60–75 min: Desperation. Students realize rules don't dictate outcomes. 75–90 min: Reveal. The "external process" is you. The chain only persists when you directly sustain it. If you stop, the system freezes. This gradual revelation forces them to experience causal inertness rather than hear about it. Emphasize that the "code" was never running locally. The "algorithm" is a fiction; the "process" is your will. The node-states are overwritten, not computed.

  3. The Debrief: From Play to Philosophy
  Ask: "Did your design determine the outcome?" When they admit failure despite perfect logic, highlight the disconnect. Their rules were merely occasions (*al-sabab*), predictable sequences without power. You were the true cause (*al-musabbib*), sustaining the sequence instant by instant. Explain that in their game, the cards had no inherent power to change the next card's value; only your hand did. Map this to reality: fire does not burn cotton by nature; God recreates the burning at every instant. The regularity they trusted was habit, not necessity. The Monitors saw correlation, not causation. The Architects built structures that looked functional but were ontologically empty. Only now name the view: Occasionalism. The game proved that continuity requires constant external sustenance, not internal transfer. The "algorithm" was a shell; the "process" was will. This shifts the discussion from physics to metaphysics: what actually holds the next moment in existence? The intermediaries were masks, hiding the direct action of the sustainer. The distinction is between sequence and power. Continuous recreation means no moment survives to the next without aid.

  4. Predictable Breakdowns and Fixes
  Students will blame poor architecture or node error. They will argue, "We didn't calculate right." To redirect, display the card logs showing perfect inputs yielding random outputs unless you intervened. Say: "Even perfect calculation failed. The mechanism itself is inert." Refuse to validate design critiques. Insist the failure is systemic, not procedural. If they demand a fix, offer none except "external maintenance." This forces the metaphysical shift: the problem isn't the engineering, it's the ontology of the components. Keep the pressure on the impossibility of internal transfer. If they argue about probability, remind them the failure was absolute without your hand. The goal is to break their intuition that proximity implies power. Do not let them retreat into scientific skepticism; keep the focus on metaphysical impossibility.

  5. The Unreproducible Feature
  This simulation cannot generate the theological necessity of Al-Ghazālī's Necessary Being. You, the facilitator, choose to sustain the system arbitrarily; God sustains creation by essence. You must verbally supply that distinction: unlike your arbitrary intervention, the divine will is non-contingent and eternal. The game shows causal inertness, but only your closing lecture can explain why the Sustainer exists necessarily rather than contingently. The students felt your contingency; they must infer God's necessity through reason, not play. You are a contingent sustainer; He is not.
