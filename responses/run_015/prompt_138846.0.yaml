answer: |-
  This is a sharp reading of a difficult text. Adams is notoriously dense because he is mixing 19th-century thermodynamics, Social Darwinism, and monetary theory into a philosophy of history. Your three-way distinction is doing real work, but it needs one crucial adjustment to be faithful to the passage, specifically regarding how Adams defines the *trajectory* of a society versus the *moment* of its collapse.

  Here is a walk-through of your specific sticking points, followed by an evaluation of your framework and its application to your case studies.

  ### 1. The Nature of "Energy": Fixed Quantity or Metaphor?

  You asked whether energy is a fixed force that gets redirected (zero-sum) or a loose metaphor for prestige.

  **Verdict:** It is a fixed-quantity model (hydraulic/thermodynamic).

  **Why:** Look at the syntax: "Energy *ceases* to find vent through the imagination and *takes the form* of capital." This is not merely a shift in cultural values or prestige; it is a transmutation of the society's driving force. Adams views society as an organism with a finite store of vital force. In the youth of a society ("disintegration"), that force is hot, volatile, and imaginative (religion, art, war). As the society ages ("consolidation"), that force cools and crystallizes into capital (usury, trade, administration).

  **Implication for your Distinction (3):** Because the energy is fixed, the rise of the "economic instinct" *requires* the death of the "imaginative temperament." They cannot coexist at high levels. Therefore, (3) is not just a change in what gets prestige; it is a biological/civilizational failure of the previous type. For Adams, a society that has fully transitioned to the "economic instinct" is a society that has lost its capacity for renewal. It is a "failure" in terms of vitality, even if it is a "success" in terms of wealth accumulation.

  ### 2. The Definition of "Movement"

  You asked if "movement" is trade velocity/communication, and whether local deceleration (Easter Island/Maya) counts.

  **Verdict:** Movement is the velocity of exchange and centralization within a competitive system.

  **Why:** Adams' examples are all systemic shifts: Rome to Byzantium, Venice to Portugal, Spain to London. "Movement" is the acceleration of competition that forces societies to consolidate to survive. When he says "acceleration of movement... changes methods of competition," he means that the pace of economic and military interaction speeds up, forcing societies to become more rigid (consolidated) to manage the flow of capital.

  **Implication for your Case Studies:**
  *   **Easter Island:** In Adams' framework, Easter Island is a tragedy of *isolated* movement. They likely went through the cycle (Imagination $\to$ Statue Building $\to$ Consolidation $\to$ Death) but without external "acceleration" to reset or feed them. Their "deceleration" (stopping monuments) is the symptom of the "pressure ends in death" phase. They hit the wall of consolidation without an external outlet.
  *   **Maya:** The abandonment of centers is a "deceleration," but for Adams, this is likely the result of the *cost* of consolidation becoming too high. The "movement" (trade routes, tribute) could no longer sustain the "consolidated" elite structure.
  *   **Bronze Age:** This fits Adams best. The "movement" was the trade network (tin, copper, lapis). When that movement accelerated or shifted (Sea Peoples, route changes), the consolidated empires (Hittites, Mycenaeans) could not adapt their "economic instinct" fast enough and crumbled.

  **Crucial Correction:** Do not view local deceleration as the *opposite* of Adams' "acceleration." Rather, local deceleration is the *result* of the society failing to keep up with the required acceleration of the age, or having exhausted its energy through prior consolidation.

  ### 3. Evaluating Your Three-Way Distinction

  Your triad is strong, but point (2) needs a tweak to capture Adams' specific mechanism.

  *   **(1) Institutional Discontinuity:** **Keep.** This maps to "empires rise and fall," "Constantinople fell," "Spain ruined."
  *   **(2) Complexity Loss:** **Modify.** Adams argues that *consolidation* (increased complexity/centralization) is what *causes* the death. The "death" is the collapse *after* peak consolidation. If you define (2) simply as "complexity loss," you are describing the corpse, not the disease.
      *   *Suggestion:* Rename (2) to **"Consolidation Peak."** This captures Adams' argument that societies die *because* they become too consolidated (economic instinct dominates), not just because they get smaller. The "collapse" is the inevitable shattering after the concrete sets.
  *   **(3) Psychological-type Turnover:** **Keep.** This is the engine of the whole passage. "New varieties of men" replacing the old.

  **Is it just redescription?** No. It separates the *symptom* (1), the *structural cause* (2), and the *human/biological mechanism* (3). This allows you to ask: Did the Maya suffer institutional discontinuity (yes), complexity loss (yes), but did they undergo the psychological turnover to a global "economic instinct" (no, they were isolated)? This distinction helps you separate Adams' universal theory from specific historical events.

  ### 4. Resolving the Tension: "New Men" vs. "Death"

  You identified a tension: How can "new varieties of men possess the world" if consolidation "ends in death"?

  **Resolution:** The tension dissolves if you distinguish between the **Specific Society** and **Humanity/Civilization**.

  *   **Specific Society (e.g., Rome, Spain, Maya):** This organism dies. Its "imaginative temperament" is extinguished. Its institutions crumble. This is the "death."
  *   **Humanity/Successor Society (e.g., The "Economic Men," London, The Peasants who survive):** The *energy* doesn't vanish; it transfers. The "new varieties of men" are the survivors who inherit the capital of the dead society. They "possess the world" because they are better adapted to the accelerated, economic phase, even though they are less "imaginative."

  So, Rome dies, but the "economic instinct" survives in the Italians or the Germans who pick up the trade. The Maya elite die, but the population persists in a simpler form. The "death" is the end of the creative cycle of *that specific polity*, not the extinction of the people.

  ### 5. Application to Your Case Studies (Faithful to Adams)

  If we run your three cases through Adams' logic (using your refined triad):

  **1. The Bronze Age Collapse**
  *   **Adams' View:** A systemic failure of "movement." The trade routes (movement) were disrupted or accelerated beyond the capacity of the palace economies to manage.
  *   **Classification:** **Failure (Mix of 1 & 2).** The "consolidated" palace systems (high complexity) could not adapt when the "movement" shifted. The "imaginative" religious/monumental phase ended, but they did not successfully transition to a new "economic instinct" phase immediately; they regressed. For Adams, this is a "death" of the civilization because the creative energy was spent without a successor consolidation ready to take the helm.

  **2. The Classic Maya**
  *   **Adams' View:** A classic case of "consolidation whose pressure ends in death." The elite consolidated power and resources (capital) to the point where the system became brittle. When the environmental or trade "movement" stressed the system, it shattered.
  *   **Classification:** **Failure (Mostly 2 & 3).** The "imaginative temperament" (monument building, calendar, religion) disappeared. The "economic instinct" did *not* take over in a global sense (no capital accumulation survived), so the energy was simply lost. This is a "death" without a clear "new variety of men" to inherit the capital. It is a pure collapse.

  **3. Easter Island**
  *   **Adams' View:** An isolated microcosm of the law. They accelerated movement (statue transport/competition) $\to$ consolidated resources $\to$ exhausted energy $\to$ death.
  *   **Classification:** **Failure (Pure 2).** Because they were isolated, there was no "new variety of men" to possess the world. The "energy" ran out. The "imaginative temperament" (statues) ceased, and the "economic instinct" (survival/chicken farming) took over, but at a much lower level of complexity. For Adams, this is the clearest example of "consolidation ends in death" without the "possession of the world" upside.

  ### Summary Advice for Your Class

  Your triad is valid, but emphasize that for Adams, **(2) Complexity/Consolidation is the cause of death, not just the victim of it.**

  *   **Failure** in Adams' terms = The loss of the "imaginative temperament" (Your point 3). Even if people survive, if they are purely "economic men," the civilization has failed.
  *   **Change** in Adams' terms = The transfer of capital/energy to a new center (e.g., Venice to London). The *humanity* continues, but the *society* dies.

  Use this to challenge the "collapse vs. transformation" debate in your class. Adams would argue that **transformation *is* collapse** if it involves the shift from Imagination to Capital. The "survival" of the population is irrelevant; the death of the "imaginative vent" is the true collapse. This gives you a provocative, if pessimistic, lens for the Maya and Easter Island: they didn't just "change," they exhausted their spiritual energy.
