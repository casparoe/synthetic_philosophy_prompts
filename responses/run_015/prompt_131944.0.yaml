answer: |-
  ### I. Formal Restatement: The Counterfactual Revelation Mechanism

  We model the Counterfactual Mugging and XOR-Blackmail scenarios as a **dynamic mechanism design problem with incomplete information and algorithmic commitment**.

  **1. The Players and Information Structure**
  *   **Principal ($P$):** The Mugger/Blackmailer (or the environment acting as a mechanism designer). $P$ possesses a **commitment device** (predictive oracle) capable of simulating the Agent's decision algorithm.
  *   **Agent ($A$):** The Victim. $A$ has a private **type** $\theta \in \Theta$, representing the state of the world (e.g., $\Theta = \{Heads, Tails\}$ for Mugging; $\Theta = \{Damage, NoDamage\}$ for Blackmail).
  *   **Common Prior:** Both parties share a prior $\mu \in \Delta(\Theta)$.
  *   **Information Asymmetry:** In standard contracts, $\theta$ is $A$'s private info. Here, $P$'s oracle observes $\theta$ *and* $A$'s strategy function $s(\cdot)$ before $A$ acts in the realized state. This transforms the problem into one of **hidden actions over counterfactual states**.

  **2. The Mechanism ($M$)**
  $P$ designs a revelation mechanism defined by an allocation rule $x: \Theta \times A \to \mathbb{R}$ and a transfer rule $t: \Theta \times A \to \mathbb{R}$.
  *   **Counterfactual Mugging:** $P$ commits to a transfer $t(Heads) = \$10,000$ if and only if the oracle reports that $s(Tails) = Pay$. If $s(Tails) = Don't$, $t(Heads) = 0$. In the $Tails$ state, the transfer is always $-\$100$ if $s(Tails)=Pay$.
  *   **XOR-Blackmail:** Let $L \in \{0, 1\}$ be the event "Letter Sent." The mechanism specifies $L = 1$ iff $(\theta = Damage \land s(Damage) = Don't) \lor (\theta = NoDamage \land s(NoDamage) = Pay)$. The Agent's utility is $-L \cdot Cost_{Blackmail} - \mathbb{I}(\theta=Damage) \cdot Cost_{Harm} - Payment$.

  **3. The Extensive Form and Strategy Space**
  The game proceeds in three stages:
  1.  **Ex-Ante Contracting:** $A$ selects a **strategy function** $s: \Theta \to \{Pay, Don't\}$. This is the **commitment device**. In standard mechanism design, $A$ reports a type $\hat{\theta}$. Here, $A$ effectively reports a *contingent plan*.
  2.  **Oracle Verification:** $P$'s oracle observes $s(\cdot)$ and $\theta$. This acts as a **verification technology** that checks incentive compatibility across all branches, not just the realized one.
  3.  **Realization:** Nature reveals $\theta$. Payoffs are realized based on $s(\theta)$ and the mechanism's rules regarding $s(\theta')$ for $\theta' \neq \theta$.

  **4. Incentive Compatibility (IC) and Equilibrium**
  We seek a **Perfect Bayesian Equilibrium (PBE)** where $A$'s strategy is sequentially rational given $P$'s beliefs.
  *   **Ex-Ante IC:** $A$ chooses $s$ to maximize $E_{\theta}[u(s(\theta), \theta)]$.
      $$ \sum_{\theta} \mu(\theta) u(s(\theta), \theta) \geq \sum_{\theta} \mu(\theta) u(s'(\theta), \theta) \quad \forall s' $$
  *   **The "Ought" Claim:** In the Mugging case, if $\theta=Heads$ is realized, standard **ex-interim rationality** suggests $s(Heads)$ should maximize utility given $Heads$. However, the mechanism links $u(Heads)$ to $s(Tails)$. Thus, the **ex-ante IC constraint** binds the behavior in the $Heads$ branch to the action in the $Tails$ branch.
  *   **Off-Path Beliefs:** The $Tails$ branch is **off-path** in the realized game (since $\theta=Heads$). However, $P$'s belief about $A$'s action on this off-path node determines the payoff on the on-path node. $P$'s belief is not updated via Bayes' rule (since the node is unreachable) but is fixed by the **logical correlation** of the oracle.

  **5. Virtual Types and Correlation**
  We can map the counterfactual selves to **virtual types**. Treat $A_{Heads}$ and $A_{Tails}$ as distinct agents with perfectly correlated types. The mechanism design problem becomes a **multi-agent contract with correlated private information**. The "obligation" to pay in the $Tails$ world is restated as the **participation constraint** for the $A_{Heads}$ virtual type: $A_{Heads}$ only receives the surplus if the contract signed by the correlated $A_{Tails}$ is incentive-compatible for the Principal.

  ---

  ### II. Residue Report

  This section categorizes the elements of the Counterfactual Mugging/XOR argument based on their translatability into standard contract theory and mechanism design.

  #### 1. Surviving Elements (Standard Results)
  *   **Ex-Ante Commitment Value:** The core logic that an agent benefits from restricting their future action set is standard in **dynamic contract theory** (e.g., the hold-up problem or durable goods monopoly). The value of commitment arises from altering the Principal's beliefs/actions in the first stage.
  *   **Correlation in Private Information:** Modeling the counterfactual branches as **correlated virtual types** is a valid application of multi-agent mechanism design with correlated signals (Cremer-McLean conditions). The dependency of payoffs across types is mathematically isomorphic to the dependency across counterfactual branches.
  *   **Off-Path Beliefs as Determinants:** In **signaling games** and **reputation models**, payoffs on the equilibrium path are determined by beliefs about off-path behavior. The Mugging structure is a extreme case where the off-path belief *fully determines* the on-path allocation.
  *   **Time Inconsistency:** The tension between ex-ante optimality (pay in Tails) and ex-interim optimality (don't pay in Tails) is a standard **dynamic inconsistency** problem, solvable via commitment devices.

  #### 2. Distorted Elements (Requiring Translation)
  *   **Counterfactual Branching $\to$ Off-Path Nodes:** Mechanism design treats unreached states as **off-path nodes in a game tree**. The CFM argument treats them as **causally efficacious realities**. In MD, an off-path node affects payoffs only via *beliefs*. In CFM, the off-path node affects payoffs via *logical causation*. Translating this requires assuming the Principal's belief is infallible and causally potent, which distorts the standard PBE definition where beliefs are subjective probabilities.
  *   **The Oracle $\to$ Verifiable Strategy Functions:** Standard revelation mechanisms elicit *types*. Here, the mechanism must elicit/verify the *strategy function* $s(\cdot)$ itself. This requires a **verification technology** that can observe counterfactual actions. In standard MD, actions in unreached states are non-verifiable. This requires distorting the framework to assume **algorithmic transparency** (the code is visible, not just the output).
  *   **Common Priors Across Unrealised States:** MD assumes a prior over states $\Theta$. CFM requires a prior over *strategies* conditional on states, where the strategy in $\theta'$ causally influences utility in $\theta$. This distorts the **independence of irrelevant alternatives** usually assumed across states.

  #### 3. Inexpressible Elements (No Representation)
  *   **Normative Force of the Unactualized:** The claim that an agent *ought* to pay in a world that *did not occur* because a counterpart in that world exists has no expression in MD. In MD, if $\theta=Tails$ has probability 0 (or is not realized), the utility $u(Tails)$ is irrelevant to **ex-post welfare**. The "obligation" is purely a label for **ex-ante utility maximization**. MD cannot capture the deontic status of the counterfactual branch itself; it can only capture the instrumental value of acting *as if* that branch matters.
  *   **Logical vs. Causal Correlation:** MD relies on **causal** or **evidential** links defined by the game tree. CFM relies on **logical correlation** (Functional Decision Theory). If the Principal predicts based on the Agent's source code, the Agent's decision *logically implies* the Prediction. In MD, the Agent's decision is a node in the tree; the Prediction is a prior node. MD cannot model the decision node as mathematically identical to the prediction node without collapsing the extensive form.
  *   **Identity Across Branches:** MD treats $A_{Heads}$ and $A_{Tails}$ as either the same agent over time or distinct agents with correlated types. It cannot model them as the **same logical entity** instantiated in different causal histories. The "residue" is the metaphysical assumption of **trans-world identity** which contract theory explicitly excludes to maintain tractability.

  ---

  ### III. Conclusion: Limitation or Exclusion?

  The residue report indicates that the inability of mechanism design to fully capture the normative force of Counterfactual Mugging is not a **genuine limitation of the framework**, but rather a **correct exclusion of metaphysics from the domain of implementation**.

  1.  **Domain Validity:** Mechanism design is an engineering discipline concerned with **implementable outcomes** in the actual world. It models *causal* relationships between actions and outcomes. The Counterfactual Mugging argument relies on *logical* causation (where the decision algorithm determines the prediction retroactively). To force this into mechanism design requires treating logical implications as causal links, which violates the **sequential rationality** axiom fundamental to extensive-form games.
  2.  **The Nature of the "Ought":** The normative claim that "you ought to pay in the counterfactual world" reduces in mechanism design to "you ought to commit to a strategy that pays in the counterfactual world to maximize ex-ante expected utility." The moment the branch is unrealized, the **ex-interim incentive compatibility constraint** dominates. If the framework allowed unactualized branches to generate present obligations independent of ex-ante utility, it would violate **Individual Rationality (IR)** in the realized state.
  3.  **Verdict:** The original argument relies on a **metaphysics of branching** (specifically, that decision algorithms are platonic objects that determine outcomes across causal graphs) which contract theory correctly excludes. Contract theory assumes the game tree is ontologically prior to the strategy. Counterfactual Mugging assumes the strategy is ontologically prior to the game tree.

  Therefore, the residue does not show that mechanism design is insufficient for rational choice; it shows that mechanism design is insufficient for **acausal decision theory**. The "obligation" in the unactualized branch is not a contractible variable; it is a phantom of the logical correlation that vanishes once we restrict the domain to causal implementation. The rational agent in mechanism design pays only because the *commitment device* makes it ex-ante optimal, not because the counterfactual world itself holds a claim on them. The framework correctly identifies the "obligation" as instrumental, not deontic.
