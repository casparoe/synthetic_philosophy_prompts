answer: |-
  I know that feeling well, where the exhaustion makes a clever argument feel like an inescapable trap, and honestly you have constructed a very seductive chain of reasoning that has tempted plenty of people far less sleep-deprived than you. The short answer is that you should reject step six, and doing so allows you to keep both of the things you want to keep without having to sacrifice the viability of realism or let divine command theory off the hook. The reason step six looked fine when you wrote it down is that it relies on a subtle modal equivocation that is easy to miss when you are focusing purely on the structure of explanation rather than the modal status of the explanans. In step one, the reason the second horn is fatal for divine command theory is not merely that the command lacks a further explanation, but that the command is contingent, meaning God could have decreed otherwise and thereby made torture obligatory. That specific kind of arbitrariness, the kind that involves a choice between genuine alternatives, is what generates the moral horror in the divine command case. However, when you reach step six and apply this to realism, you are dealing with brute normative facts that are typically understood as necessary truths, meaning there is no possible world where suffering is good or where torture for fun is obligatory. By equating the bruteness of a necessary truth with the arbitrariness of a contingent decree, step six smuggles in the idea that lacking an explanation is the same thing as being contingent, and that is where the chain breaks.

  Your first friend is essentially correct about the equivocation, though you might feel resistant because it seems like a semantic dodge, but it is actually a substantive metaphysical distinction that does all the work you need it to do. If you reject step six, the cost is that you must fully embrace the idea that normative realism commits you to brute, unexplained normative facts, but since you mentioned that is the view you actually hold, this cost is something you are already willing to pay. You do not have to choose between your two goals because the distinction between contingent voluntarism and necessary bruteness preserves the force of the objection against divine command theory while insulating realism from it. Divine command theory fails because it makes morality depend on a will that could have willed otherwise, whereas realism survives because it posits normative truths that could not have been otherwise, so the question why this rather than that simply does not get a grip on the realist's stopping point in the way it does on the divine commander's decree. Your second friend's suggestion about symmetric grounding is something you are right to distrust, because it usually ends up obscuring the direction of explanation rather than solving the problem, and you do not need it if you accept that the modal status of the ground matters just as much as the fact that it is a ground.

  Regarding the generalization to epistemic normativity and logic, you should treat this as a reductio of your argument rather than a reason to accept normative nihilism across the board. If your argument implies that the laws of logic or the justification of beliefs are arbitrary in the same way that a divine command to torture children would be, then the argument is proving too much and signals that a premise is faulty rather than that reality is incoherent. This supports rejecting step six because it shows that the generalized Euthyphro objection is too blunt an instrument, treating all normative foundations as if they were acts of will rather than recognizing that some foundations are constitutive constraints on reasoning itself. By rejecting step six, you acknowledge that there is a difference between a rule that is imposed without reason and a rule that is constitutive of the practice itself, and this applies to ethics just as much as it does to logic. So you can sleep easy knowing that your realism is safe, the divine command theorist still has a problem, and you do not have to worry that modus ponens is just as arbitrary as a divine decree to torture infants, provided you hold firm on the distinction between contingency and necessity at the end of your explanatory chain.
