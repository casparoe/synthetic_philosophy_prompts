answer: |-
  # Seminar Plan: The Promotion Sprint

  **Topic:** Multipolar Traps / Moloch
  **Duration:** 90 Minutes
  **Cohort:** 14 Students
  **Grouping:** 2 Groups of 7 (Crucial: 7 is large enough to make collusion difficult, small enough to manage).

  ## Part 1: The Game Design (35 Minutes)

  ### Title: "The Promotion Sprint"
  **Concept:** Students act as employees in a competitive firm. They must choose how much "extra effort" to expend to secure a promotion. The trap is that effort is costly, but *relative* effort determines success. If everyone works harder, the baseline rises, and everyone is exhausted for no gain. If one person works harder, they win, and others lose.

  ### Materials Needed
  *   14 Slips of paper (one per student per round).
  *   Pens.
  *   A whiteboard to track group scores.
  *   A small prize for the winning group (e.g., a bar of chocolate). This is vital; without skin in the game, the incentives feel abstract.

  ### The Rules (Handout or Projected)
  1.  **Objective:** Maximise your individual **Performance Score** over 4 Rounds. The group with the highest *combined* score wins the prize.
  2.  **Endowment:** Every round, you start with a **Base Score of 10**.
  3.  **Action:** Secretly write down your Effort Level for the round:
      *   **Standard:** Cost 0 points.
      *   **Overtime:** Cost 4 points.
      *   **Extreme:** Cost 8 points.
  4.  **Ranking:** At the end of each round, efforts are revealed and ranked within your group of 7.
      *   **Top 2 Effort:** Gain **+10 Bonus**.
      *   **Middle 3 Effort:** No change.
      *   **Bottom 2 Effort:** Suffer **-10 Penalty**.
      *   *(Ties are broken randomly or split the bonus/penalty).*
  5.  **Calculation:** `Final Score = Base (10) - Effort Cost + Ranking Adjustment`.
  6.  **Communication:** You have 60 seconds to discuss strategy *before* Round 1 and *before* Round 3. No talking during submission. Agreements are not binding.

  ### The Payoff Matrix (For Your Eyes Only)
  *   **The "Good" Equilibrium:** Everyone plays **Standard**.
      *   Cost: 0. Rank: All Tie (Middle).
      *   Score: 10 - 0 + 0 = **10**.
  *   **The "Moloch" Equilibrium:** Everyone plays **Extreme**.
      *   Cost: 8. Rank: All Tie (Middle).
      *   Score: 10 - 8 + 0 = **2**.
      *   *Result:* Everyone is 80% worse off than the Good Equilibrium.
  *   **The Defector Incentive:** If 6 play Standard, 1 plays **Extreme**.
      *   Defector: Top Rank. Score: 10 - 8 + 10 = **12**.
      *   Cooperators: Bottom Rank. Score: 10 - 0 - 10 = **0**.
      *   *Result:* The cooperator is punished severely for being the "sane" one.

  ### Run of Play
  1.  **Setup (5 mins):** Divide class. Explain rules clearly. Emphasise that *individual* scores matter for the ranking, but the *group total* wins the chocolate. (This creates a tension between individual survival and group welfare).
  2.  **Round 1 (5 mins):** Allow 1 minute discussion. Submit. Reveal. Calculate scores publicly on the board.
      *   *Likely Outcome:* A mix. Someone will try to win early.
  3.  **Round 2 (5 mins):** No discussion. Submit. Reveal.
      *   *Likely Outcome:* Escalation. Those who scored 0 in Round 1 will panic and play Extreme.
  4.  **Round 3 (10 mins):** Allow 1 minute discussion. Submit. Reveal.
      *   *Likely Outcome:* They will try to agree on "Standard". Watch to see if it holds.
  5.  **Round 4 (10 mins):** No discussion. Submit. Reveal. Final Tally.
      *   *Likely Outcome:* The agreement from Round 3 will likely collapse as the "End Game" approaches.

  ---

  ## Part 2: The Debrief (45 Minutes)

  Do not lecture immediately. Use the Socratic method to map their feelings to the theory.

  **Phase 1: The Autopsy (15 mins)**
  *   *Ask:* "Look at the group scores. If everyone had played 'Standard' every round, your score would be 40. Most of you finished below 20. Why?"
  *   *Ask:* "Did anyone try to play 'Standard' in Round 4 after everyone else went 'Extreme'? What happened to your score?"
      *   *Target Insight:* They will admit they were punished for it. This is the **Selection Pressure**. Moloch doesn't hate you; it just selects against you if you don't compete.
  *   *Ask:* "In Round 3, you were allowed to talk. Did you make an agreement? Did it hold?"
      *   *Target Insight:* **Unenforceable Agreements.** Cheap talk cannot solve a multipolar trap because the incentive to defect remains even after promising not to.

  **Phase 2: Naming the Beast (15 mins)**
  *   Introduce Scott Alexander's *Moloch*.
  *   Map the game mechanics to the essay:
      *   **Effort Levels** = Arms race spending / Clickbait intensity / Working hours.
      *   **Ranking System** = The market / University grading curve / Algorithmic visibility.
      *   **The Trap:** The system rewards relative performance, not absolute value.
  *   *Key Question:* "Was anyone in the game 'evil'? Did anyone *want* the group to score poorly?"
      *   *Point:* No. Everyone was rational. Everyone wanted to win. The *system* configuration guaranteed the loss. This is the core of multipolar traps: agency is dissolved into the structure.

  **Phase 3: Escaping the Trap (15 mins)**
  *   Ask: "How could we have actually won?"
  *   Brainstorm solutions, then critique them using the game constraints:
      *   *Solution:* "Trust each other." -> *Critique:* Trust breaks down under pressure (Round 4).
      *   *Solution:* "Punish defectors." -> *Critique:* In the game, you couldn't see choices until after submission. In reality, by the time you see the defector (e.g., a company cutting safety standards), they have already gained the advantage.
      *   *Solution:* "Change the rules." -> *Critique:* Who has the power? In the game, I (the facilitator) am the State/Regulator. In the wild, there is no facilitator.
  *   Conclude with the grim reality: Multipolar traps are often only solved by external enforcement (regulation) or technological shifts that change the payoff matrix, not by moral pleas.

  ---

  ## Part 3: Honest Assessment (What Will Go Wrong)

  You asked for honesty. Here is where this design usually fractures, and how to handle it.

  ### 1. The Collusion Problem
  **Risk:** One group might successfully agree to play "Standard" every time. They will feel smug and miss the point of the trap.
  **Why:** 7 people is a small enough number that strong social norms *can* hold, especially if they are friends.
  **Fix:** In Round 4, whisper to the student most likely to be competitive (you usually spot the type early) that "The other group is planning to defect." You don't have to lie, just sow doubt. Paranoia is the engine of Moloch.
  **Debrief Value:** If they *do* succeed, use it. Ask: "Why did this work here but not in the nuclear arms race?" (Answer: Communication channels and small numbers).

  ### 2. The Maths Confusion
  **Risk:** Students will get bogged down calculating scores and lose the emotional thread.
  **Fix:** Put a calculator on the board. Do the scoring *for* them rapidly. Keep the pace brisk. The stress of the timer is part of the simulation.
  **Contingency:** If the maths is too much, simplify. Remove the "Middle 3". Top 3 get +10, Bottom 4 get -10. Binary outcomes are easier to process.

  ### 3. The "It's Just a Game" Apathy
  **Risk:** Students treat it as a laugh and don't feel the pressure.
  **Fix:** The chocolate prize is necessary but might not be enough. You need to raise the stakes socially. Publicly announce the scores. "Group A averaged 15 points, Group B averaged 8." Shame is a powerful motivator.
  **Fix:** Frame it seriously. "This isn't a fun icebreaker. This is a simulation of why you will work 60-hour weeks in your first job despite hating it."

  ### 4. What The Game Cannot Reproduce
  Be prepared to admit the simulation's limits during the debrief.
  *   **Exit Options:** In the game, they *must* play. In reality, people can quit the rat race (though often at high cost). Moloch traps are worst when exit is impossible.
  *   **Finite Horizon:** The game ends in 4 rounds. This creates "End Game" defection. Real multipolar traps are infinite games, which makes cooperation even *harder*, not easier.
  *   **Heterogeneity:** In the game, everyone has the same payoff matrix. In reality, some actors (e.g., state-backed firms) can sustain losses longer than others, distorting the trap further.
  *   **The Facilitator:** You exist. You can change the rules if things get too heated. In the wild, there is no game master. There is only the logic of the system.

  ## Facilitator Script Snippet (For the Debrief)
  *"When you played 'Standard' in Round 4 and got a score of zero, did you feel foolish? Or did you feel betrayed? That feeling is the trap. You weren't foolish. You were rational. But in a multipolar system, individual rationality aggregates to collective insanity. Moloch isn't a demon under the table; Moloch is the fact that if you don't cut corners, someone else will, and they will eat your lunch. The question for the rest of the seminar is: how do we build tables where corners cannot be cut?"*
