  7.  **Final Polish:** Ensure the distinction between "lacking concepts" (Fricker's HI) and "concepts being deemed illegitimate" (User's HI) is sharp. This is the crux of the essay's potential success or failure. (Self-Correction: Make sure to mention Kristie Dotson's concept of "Contributory Injustice" as a conceptual tool, even if I don't give a citation, because it fits *exactly* what the user is describing—refusing to use available resources. I can describe the concept without demanding they buy the book.)

