      *   **The Claim:** Scientists moving into philosophy possess concepts (emergence, calibration) but are blocked by philosophy's *procedural norms* (modal logic, counterexamples). This isn't just testimonial (credibility); it's hermeneutical (meaning-making) because the *rules of engagement* prevent their concepts from entering the collective hermeneutical resource.
