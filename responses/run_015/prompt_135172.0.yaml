answer: |-
  1. **Exam Question: The Silence of Reasons**
  Imagine a possible world, W, identical to ours in every physical and historical respect up until time *t*. At *t*, every being capable of grasping or holding reasons is instantly and permanently destroyed. However, certain normative truths appear to remain intact within the metaphysical structure of W. For instance, the proposition 'causing unnecessary suffering was wrong' retains a truth-value, seeming to possess a kind of 'normative residue' even though there is no one left to be wronged, to do the wronging, or to judge it.

  In an essay of approximately 800 words, address the following:
  1. Is this normative residue genuinely a 'reason' in the absence of any reasoners?
  2. If it is a reason, for whom or what does it count? Can a reason exist without a subject?
  3. Does this residue collapse into a mere description of past attitudes, or does it sustain robust normative realism?

  You are not required to discuss specific philosophers, but your answer should demonstrate a clear grasp of the relationship between metaphysics and ethics. (60 minutes)

  2. **Model Answer (Part 1: Reasons vs. Reasoners)**
  To tackle this, we first need to untangle what we mean by a 'reason'. Traditionally, reasons are taken to be relational—they are reasons *for* someone to do or believe something. If you adopt a subjectivist view, reasons depend entirely on the agent's desires or psychological makeup. On this view, once the agents are gone in world W, the reasons vanish instantly. There's no one to have a desire, so there's no reason to satisfy it. The 'normative residue' here would be an illusion, merely a descriptive fact about what agents *used* to care about before *t*.

  However, objectivists argue that reasons exist independently of our attitudes. Parfit, for instance, suggests reasons are non-natural truths that we discover, not create. If this is right, the destruction of reasoners shouldn't annihilate reasons any more than destroying all mathematicians annihilates the truth of 2+2=4. The tricky bit is that moral reasons seem different from mathematical ones. Math doesn't demand action; morality does. A reason usually implies a 'ought', and an 'ought' typically presupposes a 'can' and a subject who is obliged. If there's no subject in W post-*t*, who is obliged? This suggests that even if normative truths exist, they might become inert without a mind to grasp them. So, the first half of the problem hinges on whether reasons are essentially relational (needing a holder) or free-floating facts waiting to be picked up.

  3. **Model Answer (Part 2: The Normative Residue Twist)**
  This brings us to the residue itself. If we claim the residue is genuinely a reason, we face the 'for whom' problem. One option is to say it's a reason for hypothetical agents. If someone *were* there, they'd have reason not to cause suffering. But W has no one. So, is it a reason for the universe? That sounds mystical. A stronger move is to argue that the residue isn't a current reason for action, but a timeless normative fact. It doesn't collapse into description because its truth isn't grounded in past attitudes, but in objective value. The wrongness of suffering isn't made true by people judging it; people judge it because it's true.

  However, there's a risk of collapse into description here. If the residue doesn't guide any action and isn't held by any mind, does 'wrong' just mean 'was judged wrong by extinct beings'? To avoid this, we need a metaphysics of value that survives instantiation. Perhaps the residue is a 'reason' in the sense that it preserves the axiological structure of the world, even if the deontic force (the command) has no recipient. Ultimately, robust realism survives only if we accept that normative truths are part of the fabric of reality, not just tools for agents. If we deny this, the residue is just a ghost—a descriptive shadow of dead minds. I'd argue the residue remains normative because its truth conditions aren't psychological, even if its practical application is suspended.

  4. **Marking Scheme (Total 20 Marks)**
  *   **17–20 (A range):** Clearly distinguishes between relational and non-relational reasons. Tackles the 'for whom' question creatively (e.g., hypothetical agents vs. timeless facts). Directly addresses whether the residue collapses into description without waffling. Shows independent thought beyond standard lecture notes.
  *   **13–16 (B range):** Identifies the core tension between objectivism and subjectivism. Discusses the residue but might struggle to explain *who* the reason is for. Good structure but relies heavily on standard examples (Scanlon/Parfit) without adapting them to the twist.
  *   **9–12 (C range):** Describes the scenario but fails to engage with the metaphysics. Treats the residue as obviously descriptive or obviously normative without argument. Confuses reasons with motives.
  *   **0–8 (D/F):** Misunderstands the question. Irrelevant content. No clear argument structure.

  To get an A, you need to make a specific move on teh 'for whom' problem that isn't just 'no one'.
  To get a B, you just need to show you understand the basic debate about mind-independence.

  5. **Common Mistakes to Avoid**
  *   **Confusing reasons with motives:** Don't argue that because no one is motivated, there are no reasons; this ignores the objectivist position entirely.
  *   **Ignoring the 'for whom' constraint:** Asserting reasons exist without explaining how they function without a subject is a metaphysical hand-wave that loses marks.
  *   **Treating the residue as purely historical:** Assuming the residue is just a record of past beliefs fails to engage with the prompt's claim that it retains normative force.
