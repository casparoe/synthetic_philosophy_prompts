          *   Why: Biases might cancel (good), but you can't calibrate confidence (bad).
      *   **The "Cannot Save" Verdict:** Be honest. Which one is hardest? Probably the "10k people @ 51%" case. The user's skepticism is actually *more* rational than the math here. I should validate that. Or maybe the Prediction Market case (whales might actually be informed, not just correlated). I'll pick the Prediction Market one as the tricky edge case.

  8.  **Refining the Tone:**
      *   Rationalist-adjacent tone (precise, analytical, acknowledging uncertainty).
      *   Avoid jargon where possible, but use terms like "common mode failure" or "systematic bias."
      *   Ensure the distinction between *variance* (noise) and *bias* (error) is central.

  9.  **Self-Correction/Review during drafting:**
