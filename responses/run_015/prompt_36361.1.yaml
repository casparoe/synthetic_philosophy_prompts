      *   *Decision:* I need to be honest. Averaging is *safer* than picking one, but treating it as high-confidence is wrong. It's a "N=2" situation regarding *systematic* error, even if N=10,000 regarding *noise*.

  7.  **Drafting the Response:**
      *   **Acknowledge the insight:** The user has correctly identified that CJT is a "toy model" that breaks on correlated error.
      *   **Propose the Principle:** **"The Effective Independent Signal (EIS) Principle."**
      *   **Three Clauses:**
          1.  **Error Symmetry (The Bias Check):** Are errors centered on truth (noise) or offset (bias)?
          2.  **Causal Independence (The Correlation Check):** Do errors arise from distinct causal chains?
          3.  **Signal Access (The Competence Check):** Does the voter have a causal link to the truth?
