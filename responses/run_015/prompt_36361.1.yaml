      *   *Resolution:* The principle isn't just independence; it's **Unbiasedness of Error**. Ox errors are unbiased. Driver errors are biased (ignorance).

  6.  **The Test Case (Two Subcultures):**
      *   Scenario: Group A (Bias +X), Group B (Bias -X). Both internally correlated.
      *   Option 1: Average them. Biases cancel. Result $\approx$ Truth.
