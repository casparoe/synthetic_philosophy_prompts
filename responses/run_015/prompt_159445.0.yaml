answer: |-
  # The Abolitionist Decision Tree

  **Instructions:** Start at the top. Answer each case honestly. Follow the path to your operational position.

  ### 1. The Dentist Case
  **A pill exists that lets you feel tooth decay as a neutral "ping" instead of pain, preserving all damage information and motivation to fix it. Do you take it?**
  *   **NO** → **Leaf 1: Somatic Preservationist**
      *   *Awkward Commitment:* Must endorse preventable physical agony as intrinsically valuable or too risky to touch.
  *   **YES** → Go to 2.

  ### 2. The Grief Case
  **A therapy lets you process a loved one's death without the crushing emotional weight, retaining only the memory and care. Do you take it?**
  *   **NO** → **Leaf 2: Emotional Essentialist**
      *   *Awkward Commitment:* Must endorse psychological trauma as the necessary price for authentic love.
  *   **YES** → Go to 3.

  ### 3. The Floor Case
  **Is the goal to ensure no one's experience drops below neutral, or to ensure everyone's experience is positively good?**
  *   **BELOW NEUTRAL (Safety Floor)** → **Leaf 3: Hedonic Floor Advocate**
      *   *Awkward Commitment:* Must accept a world of bland neutrality as a sufficient moral victory.
  *   **POSITIVELY GOOD (Ceiling)** → Go to 4.

  ### 4. The Striving Case
  **If all choices felt equally good (no negative gradients), would you still bother to achieve difficult things?**
  *   **NO** → **Leaf 4: Abolitionist Pessimist**
      *   *Awkward Commitment:* Must conclude that the only ethical solution to suffering is the end of sentient life.
  *   **YES** → Go to 5.

  ### 5. The Reality Case
  **Does the positive feeling need to be caused by real-world success, or is the chemical state enough?**
  *   **CHEMICAL STATE** → **Leaf 5: Experience Machinist**
      *   *Awkward Commitment:* Must accept a tank-bound existence as equivalent to a rich life.
  *   **REAL-WORLD SUCCESS** → Go to 6.

  ### 6. The Germline Case
  **Should we rewrite the genome of future children to be this way, or only treat consenting adults?**
  *   **CONSENTING ADULTS** → **Leaf 6: Therapeutic Libertarian**
      *   *Awkward Commitment:* Must accept that future generations will suffer by default.
  *   **REWRITE GENOME** → **Leaf 7: Paradise Engineer**
      *   *Awkward Commitment:* Must accept the permanent alteration of the human species' motivational architecture.

  ***

  ### Indistinguishable Leaves
  *   **Experience Machinist vs. Paradise Engineer:** If the "real world" is indistinguishable from a high-fidelity simulation (Brain-in-a-Vat), Node 5 fails to separate these. Both result in blissful minds disconnected from base reality.
  *   **Therapeutic Libertarian vs. Paradise Engineer:** If adult interventions are epigenetically heritable or culturally ratcheting, the distinction between "treating adults" and "rewriting the future" collapses over time.

  ### Unoccupied Logical Space
  1.  **Mandatory Hedonic Floor:** Coercively enforcing a "no suffering below zero" law without mandating bliss.
      *   *Status:* **Unattractive.** Enforcement mechanisms typically require inflicting suffering (punishment), violating the floor immediately.
  2.  **Germline Wireheading:** Genetically engineering humans specifically to be happy while in simulation tanks.
      *   *Status:* **Incoherent.** Why engineer complex biological agency for a non-biological end? Usually collapses into Experience Machinism via Node 5.
  3.  **Voluntary Paradise Engineering:** Parents having the *right* to edit for bliss but choosing *not* to.
      *   *Status:* **Neglected.** Currently framed as a reproductive liberty; rarely analyzed as a moral failure to prevent suffering in offspring.
