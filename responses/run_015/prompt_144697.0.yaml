      *   *Failure to Close:* Infelicity (misfire or abuse).

  4.  **Identifying the Breaks (Critical Analysis):**
      *   *Insincerity:* A button doesn't care if I *mean* to turn on the light. A promise requires intention. If I say "I promise" without intent, Austin calls this an "abuse," but the act *happens*. A button press without electricity does nothing.
      *   *Determinism:* Buttons are causal/mechanical. Speech is normative/social. The button analogy hides the *responsibility* aspect. If the light doesn't turn on, I'm not "guilty." If I break a promise, I am.
