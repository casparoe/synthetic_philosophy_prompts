      *   *Key Tension:* A button press is binary (works/doesn't). A promise is complex (made/broken/sincere/insincere/understood/misunderstood).
      *   *The "Broken Promise" Problem:* If I promise and break it, I *made* a promise. If I press a broken button, I *didn't* turn on the light. This is the crux of the audit.

  3.  **Drafting the Correspondence Table:**
      *   *Button:* The utterance itself ("I promise").
