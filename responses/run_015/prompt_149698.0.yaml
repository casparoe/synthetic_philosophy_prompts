      *   **Topic:** J.L. Austin's performative utterances, specifically applied to journal retractions.
      *   **Core Thesis to Argue:** A formal retraction is not just describing an error (constative) but performing an "epistemic annulment." It strips the paper of knowledge status and creates an obligation for others to stop citing it as established.
      *   **Key Requirements:**
          *   Argue this is a distinct illocutionary act missing from Austin's taxonomy (which focused on ceremonies like weddings, not scientific corrections).
          *   Use the *illocution* vs. *perlocution* distinction.
          *   Address the objection: "Isn't this just belief revision?" (Counter: It's institutional, like being fired, not just changing your mind).
