answer: |-
  1. **Actual Difference Sensitivity**
     *Requirement:* The account must distinguish between actions that physically alter outcomes and those that do not.
     *Reasoning:* In **Gradual Reservoir**, no single bucket perceptibly lowers crop yield, whereas in **Buffer Order**, a purchase occasionally triggers a reorder of 50 units. An adequate theory must track whether an act actually changed the state of the world, rather than treating all contributions as identical regardless of physical impact.
     *Status:* Non-negotiable for adequacy.

  2. **Expected Value Responsiveness**
     *Requirement:* The account must incorporate the probabilities of outcomes into moral assessment.
     *Reasoning:* In **Buffer Order**, a purchase usually has zero effect but sometimes causes significant harm; in **Landslide Election**, the chance of decisiveness is vanishingly small. Moral evaluation must reflect these risk profiles rather than relying solely on realized outcomes, aligning with rational decision-making under uncertainty.
     *Status:* Non-negotiable for adequacy.

  3. **Participation Without Pivotality**
     *Requirement:* The account must assign moral responsibility even when an individual's action is not causally decisive.
     *Reasoning:* In **Gradual Reservoir**, the cumulative harm is severe despite no single household being pivotal. If responsibility required pivotality, no one would be responsible for the ruined crops. The account must explain how one bears responsibility for joining a harmful practice without being the sole cause.
     *Status:* Non-negotiable for adequacy.

  4. **Structural Discrimination**
     *Requirement:* The account must distinguish between linear accumulations of harm and threshold-based triggers.
     *Reasoning:* **Gradual Reservoir** involves a roughly linear decline in yield per bucket, whereas **Buffer Order** involves discrete jumps in harm (lots of 50) triggered by crossing a stock threshold. A theory that treats these structural differences as morally identical fails to capture the nuances of causal mechanisms.
     *Status:* Non-negotiable for adequacy.

  5. **Rationality Conflict Acknowledgement**
     *Requirement:* The account must explain the divergence between what is individually rational and what is collectively best.
     *Reasoning:* In **Gradual Reservoir**, drawing water is individually beneficial (irrigation) but collectively destructive. In **Landslide Election**, not voting saves time (individual rationality) while voting supports democracy (collective good). The theory must address this tension without dismissing either side of the conflict.
     *Status:* Non-negotiable for adequacy.

  6. **Expressive Capacity**
     *Requirement:* The account must accommodate non-causal values such as solidarity, dissent, or civic duty.
     *Reasoning:* In **Landslide Election**, voting often serves to express allegiance or maintain integrity rather than to change the outcome. An account that reduces voting solely to its causal impact misses the expressive dimension that motivates many agents in mass elections.
     *Status:* Commitment belonging to a particular moral outlook (e.g., deontology or virtue ethics).

  7. **Epistemic Feasibility**
     *Requirement:* The account must provide guidance consistent with the agent's limited knowledge.
     *Reasoning:* In **Buffer Order**, shoppers do not know the exact stock level or buffer size; in **Landslide Election**, voters cannot know the final margin. Moral requirements cannot demand information that is inaccessible to the agent at the time of decision.
     *Status:* Non-negotiable for adequacy.

  8. **Agent Neutrality**
     *Requirement:* The account must treat symmetric agents in similar positions equally.
     *Reasoning:* In **Gradual Reservoir**, all 20,000 households face identical circumstances. It would be arbitrary to assign responsibility to some drawings of buckets but not others when the causal structure is identical. Fairness requires consistent treatment across the group.
     *Status:* Non-negotiable for adequacy.

  **Tension Between Desiderata**
  The deepest tension exists between **Actual Difference Sensitivity** (1) and **Participation Without Pivotality** (3). In cases like **Gradual Reservoir**, strict adherence to actual difference implies that no single bucket changes the outcome, which logically precludes individual causal responsibility. However, insisting on participation responsibility requires loosening the link to actual physical difference, potentially attributing responsibility for outcomes the agent did not strictly cause. Satisfying both requires a complex hybrid theory that separates causal contribution from moral accountability, which many monistic theories find impossible to reconcile without contradiction.

  **Evaluation of Generic Views**
  **Strict Actual-Difference View:** This view excels at **Actual Difference Sensitivity** and **Structural Discrimination** by tying responsibility strictly to physical impact. However, it fails catastrophically on **Participation Without Pivotality**, as it implies no individual is responsible in **Gradual Reservoir** or **Buffer Order** when no threshold is crossed. It also struggles with **Expected Value Responsiveness**, often dismissing probabilistic harm as morally irrelevant until realized.

  **Expected-Consequence View:** This view handles **Expected Value Responsiveness** and **Epistemic Feasibility** well, evaluating acts based on probable outcomes in **Buffer Order** and **Landslide Election**. However, it conflicts with **Actual Difference Sensitivity** when expected and actual outcomes diverge. It also struggles with **Expressive Capacity**, as it typically reduces the value of voting or abstaining from meat solely to expected utility, ignoring intrinsic expressive values.

  **Universalizability or Fairness-Based View:** This view secures **Participation Without Pivotality** and **Agent Neutrality** by focusing on the maxim of action rather than consequences; if everyone drew from the **Gradual Reservoir**, harm would result, so each is responsible. However, it often fails **Actual Difference Sensitivity** and **Structural Discrimination**, treating linear and threshold cases identically based on the rule rather than the physical harm structure. It may also overlook **Expected Value Responsiveness** in favor of duty.

  **Complicity or Expressive View:** This view succeeds on **Participation Without Pivotality** and **Expressive Capacity**, framing meat consumption or voting as acts of solidarity or disregard regardless of impact. However, it frequently conflicts with **Actual Difference Sensitivity** and **Rationality Conflict Acknowledgement**, sometimes condemning individually rational acts that cause no actual harm. It risks overdetermining responsibility in cases like **Landslide Election** where causal impact is negligible.

  Verdict: Participation Without Pivotality
