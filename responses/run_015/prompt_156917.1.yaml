      *   *Implication:* Professionalization weakens neutrality credibility; Conscription strengthens it.
      *   *Nuance:* The theory implies a link between societal embedding and defensive posture (deterrence through denial/resistance) rather than expeditionary capability.

  3.  **Map the Case (Sweden 2010-2018):**

      *   *2010 Suspension:* Move to all-volunteer force (AVF). Why? Efficiency, expeditionary capability (Afghanistan/NATO interoperability), cost-saving.
