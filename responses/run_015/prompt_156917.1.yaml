          2.  Return to Universal Draft (Pre-2010 model).
          3.  Hybrid Selective Model (Chosen).
      *   *Payoffs:*
          *   Budget: AVF saves short-term, but selective draft balances cost vs. capacity.
          *   Mobilization: Universal > Selective > AVF.
          *   Legitimacy: Citizen-army > Professional (in the context of total defense).

  4.  **Evaluate the Theory against the Outcome:**

      *   *The Thesis:* Credible neutrality needs a citizen-army.
      *   *The Outcome:* Sweden moved *back* toward a citizen-army (conscription) after trying a professional force. This *seems* to confirm the thesis.
      *   *The Twist:* It wasn't a full return to the "citizen-army" ideal (universal). It was selective (4%). It wasn't strictly for "neutrality" either (Sweden moved closer to NATO eventually, though formally neutral until 2022).
      *   *The Delay:* Why 2014 to 2018? Theory doesn't explain bureaucratic inertia or political consensus building.
      *   *Gender:* Theory usually assumes traditional male conscription. Gender neutrality is a modern liberal democratic value, not necessarily a strategic necessity for "armed neutrality."

  5.  **Drafting the Analysis - Section by Section:**

