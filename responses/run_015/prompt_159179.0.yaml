      *   *Lottery Cases:* The user claims it's permissible to assert "I will lose." *Counter:* This is the crux of the debate. Many philosophers (including Williamson) argue it is *not* permissible to assert you will lose based solely on statistical odds. We feel it's okay, but upon reflection, it's improper. This is a major point of contention, not a settled fact.
      *   *Certainty:* The user conflates "Knowledge" with "Certainty." *Counter:* In epistemology, knowledge does not require Cartesian certainty. You can know things without being 100% infallible. This is a category error.
