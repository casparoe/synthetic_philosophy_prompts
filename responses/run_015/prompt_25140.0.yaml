      *   Keep core insight? Yes.

  8.  **Final Polish:** Ensure clear distinction between *sensory-discriminative* and *affective-motivative*. Use terms like "constitutive" vs. "contingent." Mention specific philosophical views (Imperativism, Representationalism) to ground the analysis. (Self-Correction: Make sure not to get too bogged down in jargon. Keep it accessible but rigorous.)

