prompt: |-
  I'm a novelist, four books in, and the one I'm plotting now follows a single family across three generations, 1930s to the present — and I keep catching myself smuggling in a claim about history going somewhere that I haven't earned. So before I outline any further I want the spec: write me the desiderata for a theory of history's directionality, the kind a novelist could honestly steer a plot by. Which cases does it have to get right — improvement in which nobody gets justice, justice that costs everyone everything, an arc that bends for sixty years and then snaps — which distinctions can it not collapse (moral progress vs. material improvement vs. mere narrative shape vs. actual providence), and what does it owe to the selection problem, given that I only get to write the chapters whose records survived? Mark which requirements are non-negotiable and which are just the prejudices of one camp or another, and flag any pair that can't be satisfied together, since that's the bit I'd definately build the book around. Skip scoring the existing views, I'll read those myself. British English please — my publisher's in London.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata:

  1.  **Analyze the Request:**
      *   **User:** Novelist (4 books in), currently plotting a multi-generational saga (1930s–present, 3 generations).
      *   **Problem:** Catching themselves "smuggling in a claim about history going somewhere" (teleology/directionality) without earning it.
      *   **Task:** Write a "spec" or "desiderata" for a theory of history's directionality suitable for a novelist to steer a plot by.
      *   **Key Requirements:**
          *   Identify cases the theory must handle (e.g., improvement without justice, costly justice, long arcs that snap).
          *   Identify distinctions that must *not* be collapsed (moral progress vs. material improvement vs. narrative shape vs. providence).
          *   Address the "selection problem" (survivorship bias in records/chapters).
          *   Mark requirements as "Non-negotiable" vs. "Prejudices of one camp".
          *   Flag incompatible pairs (tensions to build the book around).
          *   **Tone/Style:** British English (publisher in London).
          *   **Constraint:** Do *not* score existing views (e.g., don't say "Marxism fails here"); just provide the spec.

  2.  **Deconstruct the Core Problem:**
      *   The novelist is worried about *teleology* (the idea that history has a destination).
      *   A multi-generational saga naturally invites a "shape" (rise, fall, redemption, decay).
      *   The "spec" needs to be a philosophical framework that allows for plotting without lying about the nature of time and causality.
      *   It needs to be rigorous enough to prevent cliché but flexible enough to allow fiction.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Section 1: The Cases (Phenomenology of Time).* What specific historical movements must the theory accommodate?
          *   Idea: Technology gets better, people get worse (or vice versa).
          *   Idea: Justice is achieved but at a terrible price (tragic victory).
          *   Idea: Long trends that reverse suddenly (contingency).
          *   *Refinement:* Make these sound like plot constraints. "The Paradox of Comfort," "The Cost of Redemption," "The Fragility of Trajectory."

      *   *Section 2: The Distinctions (Conceptual Hygiene).* What must remain separate?
          *   Moral vs. Material. (Just because we have iPhones doesn't mean we're nicer).
          *   Narrative vs. Ontological. (Just because the book has an ending doesn't mean life did).
          *   Providence vs. Coincidence. (God's plan vs. chaos).
          *   *Refinement:* Use precise terms. "Teleology vs. Retrospection."

      *   *Section 3: The Selection Problem (Epistemology).*
          *   We only see what survived. The novelist chooses what to write.
          *   The theory must account for the silence of the archives.
          *   *Refinement:* "The Archive's Bias." The theory must acknowledge that the plot is a construction from fragments.

      *   *Section 4: Categorisation (Non-negotiable vs. Prejudice).*
          *   Non-negotiable: Things that break realism or honesty.
          *   Prejudice: Ideological choices the author can make (e.g., believing in progress vs. decline).
          *   *Refinement:* Be clear about where the author has agency vs. where they have duty.

      *   *Section 5: Incompatible Pairs (The Engine of the Book).*
          *   This is the most crucial part for a novelist. Tension drives plot.
          *   Meaning vs. Accuracy.
          *   Agency vs. Determinism.
          *   *Refinement:* Identify specific contradictions that generate dramatic irony.

  4.  **Tone and Language Check:**
      *   British English: *colour, honour, centre, programme, whilst, amongst, novelise, realise.* (Wait, check specific spelling conventions). Use "fiction" not "fictionalization" where possible. Keep it intellectual but practical.
      *   Voice: Professional, slightly academic but accessible to a writer, respectful of the craft.

  5.  **Drafting the Content (incorporating the constraints):**

      *   *Intro:* Acknowledge the trap of teleology.
      *   *The Cases:* Focus on the specific examples the user gave (improvement w/o justice, etc.).
      *   *The Distinctions:* Ensure moral/material/narrative/providence are separated.
      *   *The Selection Problem:* Address the "records survived" issue.
      *   *The Categorisation:* Use a clear legend (Non-negotiable vs. Contingent).
      *   *The Incompatibilities:* Highlight the generative tensions.

  6.  **Review against Constraints:**
      *   *British English?* Yes (e.g., "labour," "centre," "whilst").
      *   *No scoring existing views?* Yes, focus on the requirements, not Hegel/Marx/Spengler critiques.
      *   *Mark requirements?* Yes (Non-negotiable vs. Prejudice).
      *   *Flag incompatible pairs?* Yes.
      *   *Address selection problem?* Yes.
      *   *Address specific cases?* Yes (improvement/justice, cost, snapping arc).

  7.  **Final Polish:**
      *   Ensure the distinction between "Narrative Shape" (the book) and "Historical Direction" (the world) is sharp. This is the novelist's specific pitfall.
      *   Make sure the "Selection Problem" ties into the act of writing the novel, not just history generally.
      *   Check the "Incompatible Pairs" – these need to be the *spark* for the plot.

      *(Self-Correction during drafting)*: I initially thought about suggesting specific historical theories. I must avoid that. The prompt says "Skip scoring the existing views." I need to provide the *criteria* for a theory, not the theory itself.
      *(Self-Correction on Tone)*: Keep it crisp. Like a technical specification document but for philosophy/art.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **SPECIFICATION: DIRECTIONALITY IN HISTORICAL FICTION**
  **Subject:** Theoretical Framework for Multi-Generational Narrative (1930s–Present)
  **To:** Author
  **From:** Editorial/Philosophical Consultation
  **Date:** 24 May 2024

  ### Preamble
  You have identified the central hazard of the saga: the *retrospective fallacy*. Because you are writing from the present about the past, the ending already exists. The temptation is to arrange the middle so it inevitably leads to the end, implying a purposefulness to time that reality rarely honours. This document outlines the desiderata for a working theory of historical directionality. It is not a prescription for what history *is*, but a checklist for what your plot must *accommodate* to remain honest.

  ---

  ### I. Phenomenological Cases (The 'Must-Fits')
  *Any theory of directionality you employ must be robust enough to model these specific historical movements without breaking. If your plot relies on a theory that cannot explain these, the theory is too fragile for the material.*

  1.  **The Divergence of Material and Moral States**
      *   **Requirement:** The theory must allow for material conditions to improve (medicine, rights, wealth) whilst moral coherence or individual justice deteriorates.
      *   **Plot Implication:** A character may live in a 'better' world than their grandparents but possess less agency or integrity.
      *   **Status:** **[NON-NEGOTIABLE]**

  2.  **The Pyrrhic Arc (Justice at Total Cost)**
      *   **Requirement:** The theory must accommodate victories that are indistinguishable from defeats in terms of human cost. Justice may be served, but the recipients are destroyed by the process.
      *   **Plot Implication:** The third generation may achieve what the first generation fought for, but find the prize hollow or the cost of winning it has erased the values they sought to protect.
      *   **Status:** **[NON-NEGOTIABLE]**

  3.  **The Snap (Contingency over Trajectory)**
      *   **Requirement:** The theory must allow for a trend sustained over sixty years to reverse or shatter due to a singular, unforecastable event (war, crash, technological shift) rather than organic decay.
      *   **Plot Implication:** Avoid 'seeds of destruction' planted too neatly in the 1930s to explain a 1990s collapse. Sometimes the tree falls because of a storm, not because of rot.
      *   **Status:** **[NON-NEGOTIABLE]**

  4.  **The Stagnant Loop**
      *   **Requirement:** The theory must allow for the possibility that nothing has changed, only the scenery.
      *   **Plot Implication:** The conflicts of the grandchildren must be recognisably the same as the grandparents, even if the language differs.
      *   **Status:** **[CONTINGENT PREJUDICE]** (Cynical camp vs. Progressive camp)

  ---

  ### II. Conceptual Hygiene (Distinctions Not to Collapse)
  *To avoid smuggling in unearned claims, you must keep these categories distinct. Collapsing them creates the illusion of meaning where there is only sequence.*

  1.  **Moral Progress vs. Material Improvement**
      *   **Distinction:** Do not equate the expansion of rights or technology with an improvement in human nature.
      *   **Risk:** Assuming a 1990s character is 'better' than a 1930s character because they are less prejudiced. They may simply be cruel in more sophisticated ways.
      *   **Status:** **[NON-NEGOTIABLE]**

  2.  **Narrative Shape vs. Historical Vector**
      *   **Distinction:** A novel requires a beginning, middle, and end. History does not. The 'ending' of your book is an arbitrary cut-off point, not the resolution of history.
      *   **Risk:** Implying that the story stops because the historical tension was resolved, rather than because you stopped typing.
      *   **Status:** **[NON-NEGOTIABLE]**

  3.  **Providence vs. Coincidence**
      *   **Distinction:** You must decide if patterns are imposed by a higher order (Providence/Fate) or by the human mind seeking patterns (Coincidence/Chaos).
      *   **Risk:** "Smuggling in" Providence by having too many meaningful coincidences align across generations.
      *   **Status:** **[CONTINGENT PREJUDICE]** (Theological camp vs. Secular camp)

  4.  **Causality vs. Correlation**
      *   **Distinction:** Just because Grandfather's action preceded Grandson's situation does not mean it caused it.
      *   **Risk:** The 'sins of the father' trope. Ensure the mechanism of transmission is explicit, not magical.
      *   **Status:** **[NON-NEGOTIABLE]**

  ---

  ### III. The Selection Problem (Epistemological Constraints)
  *You noted that you only write the chapters whose records survived. A valid theory must account for the silence.*

  1.  **The Archive's Bias**
      *   **Requirement:** The theory must acknowledge that the 'direction' of history often looks clearer than it was because the chaotic data was lost.
      *   **Plot Implication:** You must dramatises the loss of information. Letters burned, memories faded, lies told to protect the family name. The plot should hinge on what is *missing* as much as what is present.
      *   **Status:** **[NON-NEGOTIABLE]**

  2.  **The Survivor's Fallacy**
      *   **Requirement:** The family that survives to the third generation is not necessarily the 'fittest' or the 'right'; they may simply be the luckiest.
      *   **Plot Implication:** Avoid implying the current generation deserves their position solely because they are the ones telling the story.
      *   **Status:** **[NON-NEGOTIABLE]**

  3.  **The Novelist's Curation**
      *   **Requirement:** Acknowledge that you, the author, are performing the same selection process as history. You are choosing which records survive into the book.
      *   **Plot Implication:** Consider meta-fictional elements or a narrator who admits to choosing the 'good bits'.
      *   **Status:** **[CONTINGENT PREJUDICE]** (Modernist camp vs. Realist camp)

  ---

  ### IV. Incompatible Pairs (Generative Tensions)
  *These are pairs of requirements that cannot be satisfied simultaneously. Do not try to solve these. Instead, build the book around the friction they create. This is where the energy of the novel lies.*

  **PAIR A: Meaning vs. Accuracy**
  *   **Conflict:** To make a satisfying novel (Meaning), you must impose shape and causality. To make an honest history (Accuracy), you must acknowledge chaos and discontinuity.
  *   **The Tension:** If you prioritise Meaning, you risk the teleology you fear. If you prioritise Accuracy, you risk a plot that feels aimless.
  *   **Recommendation:** **Build the book here.** Let the characters struggle to find meaning in events that refuse to cohere. The 'directionality' becomes a character trait (someone trying to force a narrative) rather than a fact of the world.

  **PAIR B: Agency vs. Determinism**
  *   **Conflict:** If history has a direction (Determinism), individual choices matter less. If individuals have total Agency, history has no direction.
  *   **The Tension:** A multi-generational saga implies the weight of the past (Determinism), but drama requires choice (Agency).
  *   **Recommendation:** **Build the book here.** Show characters fighting against the 'arc' of their family history. The tragedy is not that they fail, but that their struggle is what creates the arc in retrospect.

  **PAIR C: The Witness vs. The Participant**
  *   **Conflict:** To see the direction of history, one must stand outside it (Witness). To live it, one must be blind to the outcome (Participant).
  *   **The Tension:** Your narrator (or POV characters) cannot honestly know the direction of history while living through it.
  *   **Recommendation:** **Build the book here.** Use the 1930s/50s characters who think they are in a tragedy, while the 1990s characters view it as a comedy (or vice versa). The 'direction' changes based on who is holding the pen.

  ---

  ### V. Summary of Obligations

  **Non-Negotiables (The Duty of Realism)**
  *   Do not conflate technological/social advancement with moral growth.
  *   Do not imply the ending was inevitable.
  *   Do not ignore the data lost to time (the Selection Problem).
  *   Do not suggest the survivors are morally superior to the perished.

  **Contingent Prejudices (The Author's Choice)**
  *   *You may choose:* To believe history is cyclical (Nietzschean) OR linear (Hegelian).
  *   *You may choose:* To believe in Providence OR Chaos.
  *   *You may choose:* To reveal the gaps in the record OR hide them to maintain immersion.

  **Final Note:**
  The claim you are trying to avoid is that history *goes somewhere*. The claim you are permitted to make is that people *need* history to go somewhere. The tragedy of your family saga should not be the direction of history, but the human insistence upon it.

  *End of Spec.*
