answer: |-
  Subject: Session design for distributive ethics seminar

  Hi there,

  This sounds like a fantastic way to handle the material, and I think the stakes will do exactly the work you want them to do provided you manage the framing carefully. Here is a run-through of how I would structure the eighty minutes to hit those three specific feelings while testing the distinction you are worried about, followed by how I would handle the debrief and the predictable friction points.

  You want to start by setting the stage without giving away the philosophical taxonomy, so spend the first five minutes establishing the rules of the game. Tell the students that you are going to run a series of decisions about how to distribute chocolate between two anonymous recipients, let us call them Person A and Person B, who are not in the room and will never know who voted what. Explain that for each scenario you will project two distributions of chocolate bars, and they will vote anonymously on slips of paper for which distribution should be realized. Emphasize that the majority vote will bind you, and that you will actually enact the final decision with the bags of chocolate you brought. This threat of real enactment is crucial, so make it clear that if they vote to destroy chocolate, you will destroy it. Then run three warm-up votes that are designed to elicit the priority intuition without triggering the levelling down alarm yet. The first vote should be between a distribution of ten bars for A and two for B versus six bars for A and six for B. The total utility is identical, but the second option is equal. Most will vote for equality here, establishing that they care about the pattern, not just the sum. The second vote should be ten for A and two for B versus seven for A and five for B. Again, the total is identical, but the worse-off person gains significantly in the second option. This reinforces the grip of the idea that benefits to the worse off matter more. The third vote is the pivot point where you test the distinction between benefit-priority and level-priority. Present a choice between ten bars for A and five for B versus five bars for A and five for B. Here the total utility drops from fifteen to ten, and crucially, Person B gains nothing. Person B is at five in both outcomes. The only change is that Person A loses five bars and no one receives them. If they vote for the second option, they are revealing level-priority, because they are valuing the equality of levels even when no one benefits. If they vote for the first, they are holding onto benefit-priority. Given the momentum of the first two votes, you will likely get a split, which is actually better for the debrief than a unanimous result.

  Once you have tallied that third vote, you need to execute it immediately to make the cost real. If the majority voted to level down, take the extra five bars from the pile intended for Person A and put them back in your bag or eat one visibly in front of them. Do not apologize. Let the silence sit for a moment. This is the moment where the idea shows up in what happens instead of what you say. Then you move to the variant you requested regarding the random loss. Tell them you are going to run one more vote, but this time the identities of A and B are not fixed until after the vote is cast. You will draw names from a hat to decide who is A and who is B only after the distribution is chosen. The choice is again between ten for A and five for B versus five for A and five for B. This tests whether their discomfort with levelling down is person-affecting. If they objected to the previous round because they didn't want a specific person to lose, this round might pass because everyone has an equal ex-ante chance of being the loser. If they still vote to level down, it suggests their objection is impersonal. After this vote, regardless of the outcome, ask them a specific question before you reveal the philosophical names. Ask them whether, if they voted to level down, they believe the resulting world is strictly better than the unequal one, or whether they merely believe there was no reason to bring about the unequal one. This forces them to confront the distinction between the value of the outcome and the reason for action, which maps onto the telic versus deontic distinction you will discuss later.

  Now for the debrief, which is where you map the activity onto the argument without lecturing until the very end. Start by asking them why they voted the way they did in the first round. They will likely say it is fairer or helps the person with less. Write this on the whiteboard as helping the worse off matters. Then ask about the third round where chocolate was destroyed. Ask why that felt different or why it felt the same. This is where you introduce the distinction you are testing. Explain that if they voted to destroy the chocolate, they are committed to the view that equality of levels is intrinsically valuable, which is level-priority. If they voted against it, they are holding the view that only benefits matter, just weighted by priority, which is benefit-priority. Tell them that the philosophical view that says benefits matter more the worse off you are is called Prioritarianism, and the view that says equality is intrinsically good is Egalitarianism. Explain that the objection they just enacted is called the Levelling Down Objection, and it is supposed to be fatal to Egalitarianism but not Prioritarianism. The activity was designed to show that if they conflated the two views, they just voted for something that Prioritarians would reject. This is where you supply the weight they might not feel themselves. You are correct that the activity can show them the entailment but cannot make them feel why anyone would take the entailment to be a reduction of the view rather than a cost worth paying. Many students will shrug and say so what if we waste some chocolate if it means we aren't unfair. You have to supply the intuition that a theory of value that says a world can be better even though it is worse for everyone and better for no one is absurd. The activity makes the absurdity visible, but you have to articulate why it is a reductio ad absurdum rather than just a quirky feature.

  There are several things that will predictably go wrong the first time you run this and you should be ready to handle them without breaking the flow. One common failure is students voting self-interestedly because they hope they might be the recipient. You can mitigate this by emphasizing repeatedly that the recipients are anonymous and not in the room, but if someone jokes about wanting the chocolate, just acknowledge it and move on. If the class's majority votes do not add up to any consistent ranking, for example if they vote for equality in round one but inequality in round three despite similar structures, do not try to fix it. Use the inconsistency as data. Point out that their intuitions are pulling them in two different directions, which is exactly why we need a theory to resolve the tension. Another risk is someone spotting the chain early and spoiling it by shouting out that this is about levelling down. If this happens, acknowledge their insight but ask them to let the others finish the voting so everyone gets the visceral experience. You can also prevent this by not labeling the rounds or writing too much on the board until the end. The sheer silliness of destroying chocolate in front of adults is actually a feature, not a bug, because it highlights the absurdity of the implication, but if they laugh too much, remind them that real resources are wasted in policy when we pursue equality for its own sake. Finally, be prepared for the possibility that no one votes to level down. If this happens, do not force it. Instead, ask them why they refused. Their reasons will likely articulate the benefit-priority view, which allows you to contrast it with the level-priority view they endorsed in the first round. You can then explain that the philosophical debate is about whether those two rounds are actually consistent with each other.

  I agree with your assessment that you will have to supply the weight regarding the reduction versus cost distinction yourself. The activity makes the commitment visible, but it does not necessarily make it feel like a dealbreaker. Students are very good at biting bullets when the stakes are chocolate bars. To bridge this gap, you need to press them in the debrief on whether they would endorse levelling down in a context where the units were not chocolate but welfare, health, or lifespan. Ask them if a world where everyone is equally sick is better in any respect than a world where some are healthy and some are sick. When the stakes are raised from candy to health, the intuition that levelling down is absurd usually sharpens. Also, be honest with them that some philosophers do accept the levelling down implication and argue it is not a problem, so you are not presenting a settled consensus but rather a live debate. The goal of the session is not to prove them wrong but to show them that their intuitive commitments have consequences they might not have anticipated. If you can get them to feel the tension between their desire to help the worse off and their desire not to waste resources, you have succeeded, even if they do not leave the room convinced that Egalitarianism is false. The chocolate is just the medium to make the abstract concrete, and the discomfort they feel when you eat the bars is the pedagogical payload.

  I hope this helps you run the session smoothly. It is a bold way to teach the material and I think the students will remember it much better than if you had just drawn the curves on the board. Let me know how the voting turns out and whether the majority was willing to sacrifice the chocolate.

  Best wishes
