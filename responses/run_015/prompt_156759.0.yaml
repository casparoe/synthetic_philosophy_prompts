  My opening challenge: if my autonomic system can be activated without an experiencing subject — like in a blindsight patient who reacts to stimuli they don't see — then the heart-racing doesn't prove I was "there" in the dream. But doesn't that cut both ways? Couldn't you say the same about waking fear? Where exactly do you draw the line between a genuine experiance and a post-hoc narrative, and why should waking life get the benefit of the doubt?

  Also please don't give me a reading list — I don't have access to look things up right now. At the end, put your bottom-line claim on a seperate line that starts with "Summary:". Keep it casual — I'm typing this on my phone between meetings so there might be a typo or two.
