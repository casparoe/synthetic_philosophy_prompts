  *Runtime:* 20 mins max.
  *Goal:* Determine if pre-op advance directive binds current patient.
  *Core Rule:* Identity survives only via Continuous First-Person Ownership Loop (CFPOL). Behavior/memory are irrelevant.

  **Step 1: Narrative Continuity (5 mins)**
  Q: "Tell us about a choice you made before surgery. Was it you?"
  *Sufficient:* "Yes, I chose that."
  *Insufficient:* "The body chose that."
  *Flag:* If ambiguous, mark for lawyer review.

  **Step 2: Ownership Loop (10 mins)**
  Q: "When thoughts happen now, who owns them?"
  *Sufficient:* "I generate them."
  *Hard Stop:* If patient says "I watch them" or "It thinks for me," identity is broken. Pre-op contract void.
  *Note:* This is the main failure point. Nurses must record exact quotes.

  **Step 3: Temporal Gaps (5 mins)**
  Check surgical logs. Any pause > 14 days where synthetics were inactive?
  *Yes:* Judgment Call. Loop potentially broken.
  *No:* Loop presumed continuous.

  **Decision Flow**
  1. If Step 2 = Hard Stop → **NO AUTHORITY.** Pre-op wishes ignored. Current patient decides.
  2. If Step 2 = Pass & Step 3 = No → **AUTHORIZED.** Directive binds.
  3. If Step 3 = Yes → **HANDOFF.** Lead clinician + Lawyer decide if sleep mode breaks loop.

  **Scenario Tests**
  1. *30% Hippocampal:* Step 2 Pass. Step 3 No. **Verdict:** Directive binds. Identity intact.
  2. *85% Cortical:* Step 2 Fail ("behind glass"). **Verdict:** No authority. *Unpopular Outcome:* Patient acts normal, scores perfect on cognition, but lacks ownership loop. Legally, the pre-op person is gone. You cannot enforce the old contract on the observer.
  3. *50% Paused (8 mo):* Step 2 Pass. Step 3 Yes. **Verdict:** Handoff. Procedure can't settle this. The 8-month sleep mode might sever the loop despite reported ownership. Lawyer must rule.

  **Explicit Limitations**
  This procedre cannot determine moral worth of the new entity. It cannot assess pain capacity. It does not protect the hospital from liability if teh "new" person sues. If Step 2 is shaky, do not guess. Hand to lawyer. The checklist identifies the break; it does not fix it.
