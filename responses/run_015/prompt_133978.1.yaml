  *   [ ] Print 2 sets of 20 cards (Deck A and Deck B).
  *   [ ] Get sticky notes or colored pens for "Boundary Flags."
  *   [ ] Whiteboard ready for "Boundary Data" (A vs B).
  *   [ ] Prepare the "Pass Pile" envelope for sensitive cards.
