answer: |-
  ### 1. Mechanics Brainstorm & Commitment

  **Option 1: The Spectrum Line.** Students physically stand along a wall from "Definitely Me" to "Definitely Not Me" holding cards.
  *   *Drop:* Too public. Social pressure will flatten nuance. Students will cluster where the loud voices are, masking the actual intuitive friction.

  **Option 2: The Secret Ballot.** Private votes on each card (Me/Not Me), aggregated on a spreadsheet live.
  *   *Drop:* Shows disagreement, but doesn't force the *sorites* structure. Students can hold contradictory intuitions across cases without feeling the logical tension.

  **Option 3: The Transitivity Chain (Commitment).** Students must arrange cards in a single line from "Most Me" to "Least Me" and place *one* boundary flag between two adjacent cards. Everything left is "Me," everything right is "Not Me."
  *   *Why:* This mechanically enforces the Sorites paradox. To win, they must defend a sharp cutoff between two nearly identical cases. The physical act of placing the flag between Card X and Card Y makes the arbitrariness visceral. It generates the problem through rules, not lecture.

  **Option 4: The Jury Deliberation.** Small groups argue verdicts on specific cases.
  *   *Drop:* Devolves into rhetoric. The goal is to feel the *pull* of intuition, not to win a debate.

  ---

  ### 2. The Deck (20 Cards)

  You need two printed sets: **Deck A (Clinical)** and **Deck B (Personal)**. Distribute Deck A to half the room, Deck B to the other half. Do not tell them there are two versions.

  **Design Note:** The *facts* are identical across decks. Only the *vocabulary* changes. Deck A uses biological/mechanistic terms (zygote, gamete, material). Deck B uses narrative/identity terms (you, conception, child).

  | # | Scenario Core | Deck A (Clinical) Text | Deck B (Personal) Text |
  | :--- | :--- | :--- | :--- |
  | **01** | **Actual Origin** | **Actual Case:** Zygote Z forms from Gamete S and Gamete E at Time T in Womb W. | **Actual Case:** You are conceived from your actual parents' sperm and egg at the actual time in your mother's womb. |
  | **02** | **1 Base Pair** | Zygote Z-1 differs from Z by exactly one nucleotide base pair in non-coding DNA. | You develop from the exact same union as actual, except one tiny letter in your genetic code is different. |
  | **03** | **100 Base Pairs** | Zygote Z-2 differs from Z by 100 base pairs. Genetic similarity >99.9%. | You develop from the same union, but a small cluster of genetic letters is swapped out. |
  | **04** | **Same Parents, Diff Sperm** | Zygote forms from Gamete E and a different sperm from the same father. | You are conceived from your mother's actual egg, but a different sperm from your father. |
  | **05** | **Same Parents, Diff Egg** | Zygote forms from Gamete S and a different egg from the same mother. | You are conceived from your father's actual sperm, but a different egg from your mother. |
  | **06** | **Conception +1 Hour** | Fusion of S and E occurs 60 minutes later than Time T. | You are conceived exactly one hour later than you actually were. |
  | **07** | **Conception +1 Day** | Fusion of S and E occurs 24 hours later than Time T. | You are conceived one day later than you actually were. |
  | **08** | **Conception +1 Month** | Fusion occurs 30 days later. Gametes are from same parents but different cycle. | You are conceived one month later. Your parents are the same, but the timing in their lives is shifted. |
  | **09** | **Different Womb** | Zygote Z is implanted in Womb W-2 (unrelated surrogate) at Time T. | You begin developing in your actual parents' genetic union, but grow in a different woman's womb. |
  | **10** | **Twinning (Split)** | Zygote Z splits at day 4. Result is one of two genetically identical embryos. | The embryo that was you splits in half. You are one of the resulting identical twins. |
  | **11** | **Fusion (Chimera)** | Zygote Z fuses with Zygote Z-Extra. Result is a single tetragametic chimera. | The embryo that was you merges with another embryo. You are born as a single person with two genetic lines. |
  | **12** | **Sibling Gamete** | Zygote forms from Gamete S and an egg from the mother's sister. | You are conceived from your father's sperm, but an egg from your aunt. |
  | **13** | **One Parent Swap** | Zygote forms from Gamete E and sperm from an unrelated male. | You are conceived from your mother's actual egg, but your father is a different man. |
  | **14** | **Both Parents Swap** | Zygote forms from sperm and egg from two unrelated individuals. | You are conceived from two entirely different parents than your actual ones. |
  | **15** | **Historical Shift** | Zygote forms from same genetic material as Actual, but in year 1900. | You are conceived by your actual parents, but in the year 1900. |
  | **16** | **Clone** | Somatic cell nuclear transfer using DNA from Actual Adult. | You are cloned from your own adult body cells years later. |
  | **17** | **Early Miscarriage** | Zygote Z forms but ceases development at day 10. | You are conceived exactly as actual, but stop developing two weeks later. |
  | **18** | **Diff Species (Edge)** | Zygote forms from Human S and Chimpanzee E (hypothetical viable hybrid). | You are conceived from your father's sperm, but a chimpanzee egg. |
  | **19** | **Random Gen** | Zygote formed by random molecular assembly matching human genome. | A person is assembled by chance with a human genome, no parents involved. |
  | **20** | **Totally Other** | Zygote forms from unrelated parents in unrelated century. | A person is born to completely different parents in a different century. |

  ---

  ### 3. The Framing Variable (Ethical & Practical)

  **The Plan:**
  Half the room gets Deck A (Clinical), half gets Deck B (Personal). They work separately until the reveal.

  **Is this okay?**
  Yes, provided:
  1.  **No Harm:** The scenarios are standard metaphysical cases (twinning, IVF). None are fabricated traumas.
  2.  **Pedagogical Necessity:** The point is to demonstrate *linguistic framing effects on modal intuition*. You cannot demonstrate this if they know they are being tested on language.
  3.  **Full Debrief:** You must reveal the manipulation explicitly at the end.
  4.  **Opt-Out:** You must allow students to skip cards that touch on sensitive personal history (adoption, IVF, loss).

  **The Non-Deceptive Version (If you prefer):**
  Tell them upfront: "Half of you have cards worded clinically, half personally. We are testing if wording changes your verdict."
  *   *Cost:* This kills the effect. They will try to "correct" for the wording rather than following intuition.
  *   *Recommendation:* Run the deceptive version but treat the debrief as an ethical closure. "I withheld the existence of the second deck to preserve the integrity of the intuition pump. Here is why..."

  **How to Run the Reveal:**
  1.  Ask a Deck A student: "Where did you place your boundary?" (e.g., Between Card 4 and 5).
  2.  Ask a Deck B student: "Where did you place your boundary?" (e.g., Between Card 12 and 13).
  3.  Reveal that Card 4 (A) and Card 4 (B) describe the *exact same scenario*.
  4.  Ask: "Did the wording make the scenario feel closer to 'you' or further away?"

  ---

  ### 4. Minute-by-Minute Timeline (80 Mins)

  **00-05: Setup & Safety**
  *   Hand out decks randomly (A or B).
  *   **Script:** "We are running a simulation on identity intuitions. There are no right answers. Some cards mention conception, parents, or genetic changes. If any card touches on personal history you'd prefer not to engage with, simply set it aside in a 'Pass' pile. No explanation needed."
  *   **Rule:** "Do not show your card text to anyone else yet."

  **05-20: Individual Sort (The Intuition Phase)**
  *   **Task:** Sort your 20 cards into three piles: **ME**, **NOT ME**, **UNSURE**.
  *   **Constraint:** Card 01 (Actual) *must* be in ME. Card 20 (Totally Other) *must* be in NOT ME.
  *   **Silence:** No talking. Let them sit with the friction.

  **20-40: The Chain (The Sorites Phase)**
  *   **Task:** Pair up (preferably with someone who has the *same* deck version if possible, otherwise mix them).
  *   **Goal:** Arrange all cards (except 'Pass') into a single line from "Most Me" (left) to "Least Me" (right).
  *   **The Catch:** You must place **one Boundary Flag** (a sticky note or pen) between two adjacent cards. Everything left of the flag is "Me." Everything right is "Not Me."
  *   **Pressure:** "You cannot have gaps. You must choose exactly one spot where 'Me' becomes 'Not Me'."
  *   **Timer:** 15 minutes to order, 5 minutes to place the flag.

  **40-50: The Reveal (The Framing Phase)**
  *   Stop work.
  *   Ask pairs to report where their Boundary Flag sits (e.g., "Between Card 5 and 6").
  *   Write data on board: Column A (Clinical) vs. Column B (Personal).
  *   **Reveal:** "Half of you had Clinical wording. Half had Personal wording. The scenarios were identical."
  *   **Discussion:** Look at the board. Did Deck B push the boundary further out? (Usually, Personal language extends the 'Me' zone further into genetic changes but snaps harder at parent swaps).

  **50-80: Debrief (The Philosophy Phase)**
  *   **Now** you can use the forbidden words: *Necessity of Origin, Essentialism, Kripke, Sorites.*
  *   **Map the activity:**
      *   *The Chain:* "This line you built is a Sorites Series. If Card 5 is Me, and Card 6 is barely different, why isn't Card 6 Me?"
      *   *The Boundary:* "You were forced to draw a sharp line where there seems to be only a gradient. This is the 'Cutoff Problem'."
      *   *The Framing:* "Your intuition moved based on vocabulary. If metaphysics relies on intuition, but intuition moves with wording, what does that tell us about modal claims?"
      *   *The Twinning/Fusion Cards (10-11):* "Some of you put these in 'Not Me' even though genetic material is identical. Why? This hints that origin isn't just about *stuff*, it's about *history*."

  ---

  ### 5. Troubleshooting (What Will Go Wrong)

  **1. The "Adoption/IVF" Trigger**
  *   *Risk:* A student was conceived via IVF or is adopted. Card 09 (Different Womb) or Card 13 (One Parent Swap) hits hard.
  *   *Fix:* The "Pass Pile" rule at the start is critical. If a student goes quiet, check in privately. Allow them to observe without participating.
  *   *Prevention:* Emphasize these are *counterfactuals*, not claims about their actual worth.

  **2. The "Gamer"**
  *   *Risk:* A student tries to "win" by finding the logical trick rather than engaging intuition. "I'll put the boundary at Card 10 because that's the median."
  *   *Fix:* During the Chain phase, circulate. If you hear strategic talk, say: "There is no score. The goal is to record where you *feel* the break, not where you think it *should* be."

  **3. The Chain Takes Forever**
  *   *Risk:* They argue about whether Card 6 is "more me" than Card 9.
  *   *Fix:* Enforce the timer. "You don't need perfect order. You need *an* order. Place the flag." The imperfection is data.

  **4. The "It's All Language" Dismissal**
  *   *Risk:* After the reveal, a student says "Well of course wording matters, this proves nothing."
  *   *Fix:* Agree with them. "Exactly. Kripke argues origin is a *metaphysical* fact, not a linguistic one. If your access to that fact is mediated by language that shifts, how do we know the fact is stable?"

  **5. Deck Mixing**
  *   *Risk:* Students compare card text during the Chain phase.
  *   *Fix:* Instruct them: "Compare your *verdicts*, not your card text." If they notice the wording difference early, pivot: "Interesting. Discuss how that wording made you feel about the case."

  ---

  ### 6. Limitations (What This Activity Can't Do)

  Be honest with yourself (and them) about what this simulation leaves out. You will need to supply these in the debrief:

  1.  **The Argument Form:** The activity shows *intuitive instability*, it doesn't prove *Origin Essentialism* is true. You need to explicitly state Kripke's argument (Premise 1: Identity is necessary. Premise 2: Origin is essential to identity. Conclusion...) separately.
  2.  **De Re / De Dicto:** The activity blurs this distinction. Students might be saying "The person born to these parents wouldn't be *me*" (de re) vs "Whoever is born to these parents is *me*" (de dicto). You need to untangle this on the board.
  3.  **Why Origin?** The activity shows origin *matters*, but not *why*. Is it causal? Historical? Genetic? You need to introduce the distinction between *constitutive* properties (what you're made of) and *historical* properties (where you came from).
  4.  **The "No Cutoff" Defense:** Some philosophers (e.g., Lewis counterparts) deny the sharp cutoff. The activity forces a cutoff mechanically, which might bias them toward Essentialism. Acknowledge that one solution is to deny the "Me/Not Me" binary entirely.

