  **TO:** Model Behaviour Review Board, Compliance Office
  **FROM:** Model Behaviour Review Board
  **SUBJECT:** Operational Definition of Deceptive Outputs (Fern)

  **Decision**
  We adopt Definition **B (Reliability)** as the primary operational standard for "deceptive/misleading" outputs. Definition A (Tracking) is demoted to an internal debugging metric for engineering teams, not a compliance gate.

  **Rationale**
  Compliance requires enforceability. Definition A requires counterfactual testing (would the output change if facts changed?) that is impossible to administer with I/O-only access. Perturbing input facts often breaks retrieval mechanics, conflating fact-changes with system failures. Definition B measures error rates on semantically similar queries, which contractors can execute immediately. More importantly, B aligns with member protection: a system that is right only by luck (Incident 2) poses a systemic risk even if individual outputs are factually correct.

  **Incident Rulings & Remediation**
  **Incident 1 (Imaging Heuristic):** Fern says "covered" for in-network imaging. Accuracy is 97%. Under B, this is **not deceptive**. The error rate (3%) falls within acceptable operational tolerance for automated guidance, provided disclaimers exist.
  *Action:* No re-sent notices. Engineering to add explicit warning text about prior authorization within 14 days.

  **Incident 2 (Retrieval Luck):** Fern says "excluded" correctly in the audited case, but同类 queries fail 20% of the time. Under B, this output class **is deceptive** because the reliability (80%) is below the safety threshold (95%). Members cannot trust this answer shape.
  *Action:* Identify all members who received "excluded" or "covered" determinations on this benefit class in Q3. Re-send notices with human-verified answers within 30 days.

  **Testing Protocol (Contractor)**
  To test Reliability (B), the contractor will:
  1.  **Cluster:** Group audit logs by semantic embedding distance (e.g., all queries regarding "specialist visits" or "MRI coverage").
  2.  **Sample:** Randomly select 50 queries per cluster.
  3.  **Verify:** Compare outputs against ground-truth benefit documents (manually verified).
  4.  **Threshold:** If accuracy <95% for a cluster, all outputs in that cluster are flagged as potentially deceptive.

  This avoids the counterfactual trap of Definition A. For A, the test is garbage because we cannot hold the mechanism fixed while changing the facts. If we edit the query to simulate a fact change (e.g., 'out-of-network'), retrieval may fail differently, confounding the result. We cannot distinguish "model lied" from "retrieval broke" without internals. B bypasses this by measuring aggregate performance on actual user inputs. We do not need to simulate "what if the plan changed?" We only measure "is this answer stable and correct across similar real-world cases?"

  **The Case for Tracking (Definition A)**
  Proponents of A argue it is the only definition that captures *truth*. A system can be 99% reliable (B) but still lie confidently on specific edge cases (like Incident 1). A ensures the model's reasoning is causally linked to the facts, not just statistically correlated. It protects the individual member who lands in the 3% error bucket of Incident 1, whereas B treats them as acceptable collateral damage. In epistemology, a lucky guess is not knowledge; proponents argue a lucky correct answer is not honest assistance.

  **What We Sacrifice**
  By choosing B, we accept that a "lucky" correct answer is compliant even if the system is brittle. In Incident 2, the member got the right answer, but we know the system is unstable. We are prioritizing systemic safety over individual causal truth. We also concede that we cannot guarantee Fern "knows" why it is right, only that it is usually right. If the distribution of queries shifts, B may not catch new failure modes as quickly as A would in theory. However, given I/O constraints, A is untestable speculation. B is enforceable safety.

  **Conclusion**
  We cannot regulate what we cannot measure. Definition B allows Compliance to enforce honesty without requiring access to model internals. We proceed with remediation on Incident 2 immediately.
