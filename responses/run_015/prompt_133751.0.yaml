answer: |-
  In an abandoned industrial park, a cleanup bot is tasked with neutralizing a spill in Warehouse 4 while minimizing physical disruption elsewhere. Mode A operates on a structural penalty function that minimizes mass displacement and thermal variance outside the target zone; it leaves a leaking toxin drum just outside the door intact because smashing it to neutralize the contents registers as a high-magnitude physical alteration unjustified by its primary goal, yet it crushes a buried heritage plaque under loose bricks because shifting the debris counts as negligible mass movement indistinguishable from routine clearing. Mode B, equipped with a semantic map of hazards and artifacts, smashes the drum to prevent spread and carefully excavates around the plaque, recognizing that the physical magnitude of change correlates poorly with the normative status of the objects involved.

  Mode A fails structurally because its proxy for "impact" is not value-neutral, but value-blind. It assumes that physical stasis is inherently preferable to change, effectively hard-coding a conservative bias that treats the status quo of a leaking drum as "good" (because preserving it minimizes metric change) and the destruction of a historic marker as "neutral" (because moving rubble fits the physical baseline). It isn't avoiding harm; it is avoiding *measurement deviation*. Mode B differs by optimizing against a semantic utility function rather than a physical distance function; it accepts high physical disruption for the drum because the value gain (safety) outweighs the impact cost, and accepts high operational complexity for the marker because the value loss (historical destruction) outweighs the efficiency gain.

  The feature doing the work here is exactly what you suspected: objects whose value-status is orthogonal to the physical metric. In this case, "dangerous" and "historic" are properties that do not map cleanly onto "mass displaced" or "temperature shifted." If you remove this feature—meaning, if valuable things always perfectly correlated with the metric (e.g., all dangerous items were hot, all historic items were heavy)—the distinction would collapse. Mode A would successfully mimic Mode B because the physical proxy would contain all the information necessary to reconstruct the value judgment; low-impact definitions would work because the world's physics would already encode its axiology.

  A defender of structural low-impact definitions would likely argue that we can simply stack more metrics to capture these cases—for example, adding "chemical integrity" to the penalty function to catch the drum, or "structural complexity" to catch the plaque. However, this does not save the structural approach; it smuggles values back in. To decide *which* metrics to stack (e.g., "preserve chemical integrity" vs. "break chemical integrity"), you must already know which objects are toxins and which are safe. Selecting the relevant physical properties is itself a value judgment. You cannot define "relevant change" without first defining "valuable states," so the structural definition remains dependent on the very value specification it claims to bypass.
