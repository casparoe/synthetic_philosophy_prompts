  i've been mulling over that low-impact AI question about whether "avoid side effects" can be pinned down without already knowing what's valuable, and I got into a kinda stuck debate with my roommate about it. I'm taking a course on philosophy of technology and find the formalization part confusing. Could you build me a thought experiment that really isolates this?

