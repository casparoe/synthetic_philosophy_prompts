answer: |-
  Let's map the terrain together, because you have identified a genuine tension that keeps many philosophers awake at night. You are grappling with the move from the *metaphysics* of experience to the *phenomenology* of experience, and I suspect you are smuggling in a premise that disjunctivism is specifically designed to excise.

  Here is the landscape as we usually draw it in seminars:

  1.  **The Common Factor View (CFV):** This is the target. It holds that veridical perception (seeing a tree) and subjectively indistinguishable hallucination (seeming to see a tree) share a fundamental mental state. This state is the "Highest Common Factor" (HCF).
  2.  **The Argument from Illusion:** This argues for CFV. Premise 1: Veridical cases and hallucinatory cases can be subjectively indistinguishable. Premise 2: If two states are subjectively indistinguishable, they must share the same immediate mental nature (the HCF). Conclusion: There is a common mental factor.
  3.  **The Disjunctivist Reply:** This attacks Premise 2. It claims that subjective indistinguishability does *not* entail a common mental nature. The nature of the veridical case is relational (constituted by the object); the nature of the hallucinatory case is not. Therefore, they are fundamentally different kinds of events, linked only by the fact that one can be mistaken for the other.

  Now, let's look at your sticking point. You reason: *If there is no common phenomenal character, then in the hallucination there is literally nothing it's like.*

  This is where the logic snaps. You are operating with a hidden assumption about what constitutes "something it is like." You are assuming that for there to be "something it is like" in the hallucination, there must be an *intrinsic phenomenal property* present in the hallucination that is also present in the veridical case.

  Let's test that assumption.

  If I say, "A marriage and a contract breach are both legal events, but they share no common positive legal factor other than being governed by law," have I eliminated the contract breach? No. I have simply said that the *nature* of the breach is not the *nature* of the marriage, even if they look similar to a layperson.

  Disjunctivism applies this to the mind. When you say, "In a hallucination there's literally nothing it's like," you are equating "what it's like" with "the common factor." But the disjunctivist says the "what it's like" of the veridical case is *the tree itself appearing to you*. It is object-involving.

  So, in the hallucination, the tree is not present. Therefore, the *veridical kind* of "what it's like" is absent. But does that mean *no* experience is occurring?

  Here is the correction you need to make: Disjunctivism does not deny that the hallucinator is in an experiential state. It denies that the experiential state is of the *same fundamental kind* as the veridical one.

  Your reasoning goes wrong because you assume that if the hallucination doesn't share the *constituents* of the veridical experience (the external object), it must lack *any* constituents. But the disjunctivist allows that the hallucination is a real mental event; it just insists that its nature cannot be defined by reference to a shared internal movie screen (the sense-data or common phenomenal character).

  Consider the issue of **subjective indistinguishability**. You asked why disjunctivists don't just deny that hallucinations and perceptions are indistinguishable. Most (like M.G.F. Martin) *accept* indistinguishability. They argue that indistinguishability is a **negative epistemic property**, not a positive metaphysical one.

  To say "I cannot tell the difference" is not to say "There is a shared mental glue causing this confusion." It is just to say "I cannot tell the difference." The hallucination is a state that *fails* to be a perception but *mimics* it enough to fool the subject.

  So, let's trace your specific inference error again:
  1.  **Your Premise:** Phenomenal character requires a shared intrinsic quality between veridical and hallucinatory cases.
  2.  **Disjunctivist Claim:** There is no shared intrinsic quality.
  3.  **Your Conclusion:** Therefore, there is no phenomenal character (and no experience) in the hallucination.

  The error is in **Premise 1**. Disjunctivism rejects the idea that phenomenal character must be intrinsic and shared to be real. In the veridical case, the phenomenology is external (relational). In the hallucinatory case, the phenomenology is... well, this is the hard part, but it is *not nothing*. It is a state that is *indistinguishable* from the relational state.

  If you claim disjunctivism collapses into eliminativism, you are defining "experience" as "the possession of a common factor." But that is begging the question against the disjunctivist. They define "veridical experience" as "awareness of the world" and "hallucination" as "a state indistinguishable from awareness of the world." Both are mental events. Neither is eliminated.

  **Here is exactly where your reasoning goes wrong:**

  You are conflating the **absence of a common nature** with the **absence of a nature**.

  You reason that because the hallucination lacks the *object-dependent* phenomenal character of the veridical case (which disjunctivists say is the only *positive* phenomenal character), it must lack *any* phenomenal character. But disjunctivism holds that the hallucination is a genuine mental state whose nature is defined not by what it *is* (positively), but by what it *is not* (it is not a perception, though it seems like one). Denying a shared positive core does not eliminate the state itself; it only eliminates the idea that the state belongs to the same metaphysical category as perception. Disjunctivism is not eliminativism about hallucinatory *states*; it is eliminativism about the *Common Factor* as a metaphysical category.
