answer: |-
  **TO:** Medication Safety and Health Literacy Committee
  **FROM:** Committee Chair
  **DATE:** October 26, 2023
  **RE:** Decision on Discharge Instruction Format and Budget Allocation

  I recommend we reject the vendor's word-free pictogram licence and instead fund the teaching and transformation work required to maintain a hybrid text-and-image system. We must approve the use of pictograms only as a "helping language" to support written instructions, never as the sole carrier of dose-critical information.

  This decision addresses the safety concerns raised by Pharmacy, the educational realities noted by Nursing, and the fiscal responsibility demanded by the Trustees. For the Pharmacist: pictures structurally fail at negation and conditionals. The anticoagulant regimen requires conditional logic (take X if test result Y) and negative constraints (do not take with Z). A pictorial system optimized for counting objects cannot safely encode logical operators without extensive legend training, which reintroduces the literacy barrier. For the Nurse Educator: symbols are not innate. Our hallway testing confirmed that a clock face indicates specific time rather than frequency, and a dotted line indicates damage rather than splitting. These are conventions, not universal truths. Patients must be taught the legend, meaning the picture sheet is useless without the human walkthrough. For the Trustee: the vendor licence purchases a false sense of security. Funding the transformation work—owning the grammar of the symbols—reduces liability by ensuring we control the meaning, rather than licensing a black box that fails under thermal printing constraints.

  **Licensing Standards for Symbol Use**
  To prevent the drift observed in testing, we adopt the following standards for any symbol permitted on discharge sheets:
  1.  **Quantity:** Quantity must be shown by repeating identical, same-sized units, never by enlarging a single image. A double dose is two pills, not one big pill.
  2.  **Prohibited Categories:** No symbol alone may carry meaning for negation (do not take), conditionals (if/then), probability (risk levels), or complex duration. These must remain in text or be conveyed verbally.
  3.  **Validation:** A symbol is permitted only if 90% of a test group interprets it correctly without prior instruction. The clock and broken-tablet icons fail this test and are banned.

  **The Strongest Case for the Option We Are Rejecting**
  We must acknowledge the moral weight of the board's resolution. Our current text-based system silently fails the eighty patients annually who speak languages with no written form. For them, an English or Spanish sheet is not just unhelpful; it is indistinguishable from blank paper. They cannot even identify that they have received instructions. Furthermore, even literate patients often skip text blocks due to stress or fatigue, whereas images attract attention. A picture-based system promises immediate engagement and bypasses the translation bottleneck. If the vendor's claims were true—that these symbols were universally understandable—we would be ethically obligated to adopt them to serve those eighty patients. The failure of text for this group is total, whereas the failure of pictures is often partial.

  **Governance and the Secretary's Point**
  The Committee Secretary correctly noted that pictures are not a bedrock of self-certifying signs. They are revisable conventions. This anti-foundationalist insight dictates our governance structure. We cannot adopt a system and assume it is fixed. We must assign a specific role, effectively a "Transformer," responsible for converting new regimens into charts and maintaining a versioned change log. This owner must be named in policy. Because conventions drift and clinical contexts change, this system requires a sunset clause. We will review the symbol set in eighteen months. We will pilot this hybrid approach on two wards immediately, with a full review scheduled before the next fiscal budget cycle. If the teaching component is not funded, the picture system collapses into ambiguity; therefore, we fund the education and governance, not the licence.

  **Framing and Failure Modes**
  Our initial framing of "Pictures versus Words" missed the real issue. The choice is not between visual and verbal media, but between managed and unmanaged conventions. Text is also a convention that requires literacy training; pictures require visual literacy training. The risk is not the medium, but the assumption that any medium is self-explanatory. We are choosing to manage the convention explicitly rather than outsourcing it to a vendor.

  We would change our mind if independent validation showed that a specific subset of symbols achieved 95% comprehension across all seventeen language groups without teaching. Until then, we assume risk. The failure mode we must monitor is "icon drift," where clinicians improvise new icons on the ward because the official set lacks a specific drug. This silently breaks the grammar. The Transformer must have the authority to reject ward-level improvisations.

  We proceed with the hybrid model, funded teaching, and strict governance.
