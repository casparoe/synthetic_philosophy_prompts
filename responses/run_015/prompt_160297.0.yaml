  **Memorandum of Adversarial Collaboration: The Vilanova de Serra Corpus (1788–1795)**

  **Shared Object of Study**
  The collaborative focus is restricted to the municipality of Vilanova de Serra and its immediate hinterland during the period 1788–1795. The corpus comprises four specific datasets: the hearth-tax registers, the militia conscription rolls, the notarial protocols of tenant miller Josep Ribalta, and the correspondence of the local tax receiver. Both parties agree that no external comparative material shall be introduced to settle internal inconsistencies within this bounded archive.

  **Section I: Agreed Substantive Claims**
  1. The nominal fiscal demand imposed on Vilanova increased by approximately fifteen percent between 1788 and 1795, yet real yield remained static due to accumulated arrears.
  2. Ribalta's documentary footprint exceeds the median Vilanova tenant by a factor of ten, confirming he is an outlier in terms of record survival.
  3. Notarial debt instruments peak in quarters immediately following militia levies, indicating liquidity crises driven by state extraction.
  4. The hearth-tax records undercount actual households by approximately ten percent when cross-referenced against notarial evidence of residence.
  5. The tax receiver's correspondence identifies Vilanova as 'difficult' but categorizes it as typical among the three provinces under his administration.
  6. Aggregate militia rolls conceal individual substitution practices that are explicitly documented in Ribalta's private protocols.
  7. Ribalta's social network extends beyond the parish boundary into provincial markets, allowing him evasion options unavailable to landless laborers.
  8. Both the aggregate series and the micro-archive silence the landless laborer class entirely, rendering total demographic reconstruction impossible.
  9. State capacity in this period was dependent on local negotiation rather than purely coercive imposition, visible in the receiver's pleas for patience.
  10. Neither method alone can reconstruct total household income for 1790; both require the other to map the gap between demand and capacity.

  **Section II: Residual Disagreements**

  | Topic | Mireia's Wording (Micro) | Dieter's Wording (Macro) | Verdict & Dissolution |
  | :--- | :--- | :--- | :--- |
  | **Representativeness** | Ribalta is an *index case* whose depth reveals mechanisms averaging destroys. | Ribalta is *selection bias*; rich records track litigation and wealth, not typicality. | **Substantive.** This is not verbal; it is a disagreement over whether depth compensates for bias. |
  | **Causality** | Local negotiation *constitutes* state power; the state is what happens here. | State capacity *constrains* local options; the structure determines the negotiation range. | **Verbal.** Dissolved by distinguishing constitutive effects (ontology) from causal constraints (mechanism). |
  | **Explanation** | The goal is *orientation* and recovery of what a life was like under pressure. | The goal is *portable causal knowledge* regarding fiscal-military state formation. | **Substantive.** This is a disagreement over the disciplinary purpose of history itself. |

  **Section III: Empirical Cruxes**
  To move beyond the disagreements above, both parties agree to submit to the following three tests using only the Vilanova corpus.

  **Crux 1: The Substitution Test**
  *Sub-question:* If Ribalta is swapped for another tenant miller in the same tax decile, does the shape of the state-formation story change?
  *Specific Test:* Compare Ribalta's arrears and litigation frequency against the three other millers mentioned in the tax receiver's correspondence who lack notarial protocols.
  *Mireia's Prediction:* The other millers will show similar arrears patterns once corrected for record survival; the mechanism of resistance is common, even if the record is not.
  *Dieter's Prediction:* The other millers will show compliance where Ribalta shows resistance; Ribalta's behavior is driven by his unique access to legal capital documented in the protocols.

  **Crux 2: The Scale-Drift Audit**
  *Sub-question:* At what geographic level does the mechanism of "negotiated extraction" cease to be identifiable?
  *Specific Test:* Take the mechanism of debt-for-time swapping identified in Ribalta's household and re-run it at the parish level, then the provincial level using aggregate yield data.
  *Mireia's Prediction:* The mechanism will remain identifiable at the parish level through aggregate arrears but vanish at the provincial level due to noise.
  *Dieter's Prediction:* The mechanism will vanish at the parish level; only at the provincial level do structural pressures override local negotiation noise.

  **Crux 3: The Averaging Objection**
  *Sub-question:* Does the richness of the Ribalta protocol correlate with deviation from the norm?
  *Specific Test:* Correlate the volume of notarial entries per year with the deviation of Ribalta's tax payment from the parish mean.
  *Mireia's Prediction:* There will be no correlation; documentation richness is random survival, not a function of deviance.
  *Dieter's Prediction:* There will be a strong positive correlation; litigation generates paper, and litigators are systematically less compliant than the silent majority.

  **Section IV: Closing Note on Disciplinary Purpose**
  This collaboration clarifies that a significant portion of the two-year argument was verbal, specifically regarding the directionality of causality between local agents and state structures. However, the collaboration also exposes a substantive irreconcilability regarding the purpose of historical explanation. Mireia operates under the assumption that history is for *orientation*—providing a textured map of human experience where the specific life of Josep Ribalta holds intrinsic value regardless of typicality. Dieter operates under the assumption that history is for *portable causal knowledge*—producing generalizable models of state formation where Ribalta is merely data points to be weighted.

  They should concede that the argument over whether Ribalta is "typical" was never about the documents; it was about whether a single life can bear the weight of historical truth. If the goal is orientation, Mireia wins. If the goal is portable causal knowledge, Dieter wins. They must decide if they are writing history to explain the state, or to recover the subject. Until that teleological dispute is settled, methodological gadgets like the scale-drift audit will only refine their disagreement, not resolve it.
