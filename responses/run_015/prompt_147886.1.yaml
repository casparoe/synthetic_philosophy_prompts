prompt: |-
  I'm writing a feature on whether we should actually talk about AI "beliefs" at all, and I'm stuck on what the real research priorities should be. There's this framing I keep running into — call it the calibration-stance loop — where RLHF doesn't just shape answers, it shapes the very dispositional patterns that the intentional stance reads off of. So if you're Dennett-style about it, you're not attributing beliefs to the model in isolation, you're attributing them to this weird hybrid of model weights and annotator preferences. Specifcally, I'm trying to map out the open questions here for people who actually have funding or tenure-track years to burn, and I don't want a bibliography — I want a defended agenda.

  If you had to advise a small interdisciplinary group — philosophers of mind plus a couple ML people — on which three open problems in attributing beliefs to AI systems are actually upstream of everything else, what'd they be? I'm thinking things like: does the intentional stance even apply when there's no evolutionary or phenomenal continuity? How do we handle beliefs that seem distributed across a model and its external tools — the epistemic scaffolding problem? And whether RLHF creates pseudo-beliefs that break the predictive utility of the stance altogether? But I want you to defend the ordering: which one unlocks the others, which is tractable for philosophers without access to training logs, and which ones are just noise that won't change how we design audit protocols. Don't just list them; tell me what evidence over the next couple years would bump one up or down the list.

  Also, I keep wondering about the practical payoff. If we settle the upstream question, does it actually change anything for alignment practice or policy, or is this all just conceptual housekeeping? Give me a dependency-aware prioritization — what's upstream, what's overrated, and where should a career's worth of effort actually go? I'm less interested in a survey than in the reasoning behind the ranking.
