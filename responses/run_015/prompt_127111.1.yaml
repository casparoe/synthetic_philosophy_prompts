          *   *Speaker Meaning:* Grice *did* define non-natural meaning ($\text{meaning}_{nn}$) in terms of intention (to produce an effect in an audience by means of the recognition of this intention). But it's not *just* causing a belief; it's specific about recognition.
          *   *Implicature:* It is *not* "whatever the listener happens to infer." It must be *calculable* based on the maxims. It's normative, not just descriptive psychology.
