      *   *Tension D: (5) vs. STS norms.* (5) claims modern science produces *more reliable knowledge*. In STS, this is the "Symmetry Principle" flashpoint (Bloor). Claiming epistemic superiority is often seen as Whiggish, even if the user says "anti-Whig." This is a committee red flag.

