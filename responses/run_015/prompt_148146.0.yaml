      *   *Tension A: (1) vs. (3) & (5).* (1) says "Middle Ages" is a fiction with no coherence. (3) & (5) compare "13th-c Aristotelian scholasticism" to "modern experimental science." To make that comparison, you need a stable category of "13th-c scholasticism." If the "Middle Ages" is a fiction (1), is "13th-c scholasticism" also just a fiction? If (3) claims a *real* discontinuity, implies the periods on either side have enough stability to measure the discontinuity.
