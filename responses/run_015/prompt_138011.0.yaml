  *(Refining Complication 1)*: The prompt asks: "is there a coherent reading on which it can be conventionally true that she wrote the directive while nothing now gives that directive authority over her?" This requires distinguishing between *descriptive* conventional truth (she wrote it) and *normative* conventional truth (it binds her). Buddhism usually links these via karma/causality. If the causal link is severed (dementia), does the normative link sever?

  *(Refining Complication 2)*: Karma relies on intention (cetana). If the "self" that intended is gone, does the intention remain? The tradition says the *stream* carries the karmic seed. If the stream is continuous enough for karma, is it continuous enough for the directive? This suggests the "no self" move is inconsistent if it accepts karma but rejects directives.

  *(Final Polish)*: Ensure the confidence ratings are explicit. Ensure the "least sure" step is clearly marked at the end.

