      *   **Requirements:**
          *   Separate readings by the *work they do*, not just labels.
          *   Include specific readings: denial of permanent soul, reductionism (aggregates), identity not what matters, person as convention/fiction, experience without subject, metasemantic ("I" as indexical), therapeutic/prescriptive.
          *   For each: One-sentence claim, evaluation (trivial/substantive/false), impact on the advance directive puzzle (does it dissolve it? what else goes down with it?).
          *   Handle two complications:
              1.  "Mere convention" + Two Truths (does it restore authority or allow dissociation?).
              2.  Neutrality vs. Karmic Responsibility (does dissolving the self kill karma/intention?).
          *   Indicate confidence levels for classifications.
          *   Identify the step in my own reasoning I am least sure of.

  2.  **Deconstruct the "No Self" Claims (The Menu):**
      *   *Claim 1: Denial of Permanent Soul (Atman).* Standard Abhidharma/early Buddhist view.
      *   *Claim 2: Reductionism (Aggregates).* Person = skandhas + causality. No extra entity.
      *   *Claim 3: Identity Not What Matters.* Parfitian/Buddhist overlap. Survival is psychological continuity, not strict identity.
      *   *Claim 4: Person as Convention/Fiction.* Prajnaparamita/Madhyamaka leanings. Nominal existence only.
      *   *Claim 5: Experience Without Owner.* Phenomenological reading. Awareness happens, but no "awarer."
      *   *Claim 6: Metasemantic/Indexical.* "I" refers to context, not object.
      *   *Claim 7: Therapeutic/Prescriptive.* Stop grasping, don't describe ontology.

  3.  **Evaluate Each Claim against the Puzzle (Advance Directives):**
      *   *Puzzle:* Does Past Self bind Present Self?
      *   *Dissolution:* If no self, no binding.
      *   *Collateral Damage:* Prudential concern, promises, resentment, karma.

  4.  **Address Complication 1: Two Truths (Conventional vs. Ultimate):**
      *   If persons exist conventionally, do directives work conventionally?
      *   Can we say "Conventionally she wrote it, but ultimately it has no authority"?
      *   Need to explore if conventional truth *carries normative force* in Buddhism. Usually, yes (ethics is conventional). So the "dissolution" might fail if ethics is preserved at the conventional level.

  5.  **Address Complication 2: Karma and Intention:**
      *   If the self is dissolved to avoid the directive, does karma survive?
      *   Karma requires continuity of causal streams. If the stream is broken enough to void the directive, is it broken enough to void karma?
      *   Tension: Buddhism needs *enough* continuity for karma, but *not enough* for a fixed self. The advance directive case tests the *degree* of continuity required for normative binding.

  6.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Acknowledge the frustration (discussion-stopper) and the goal (disambiguation).
      *   *The Menu:*
          1.  *Substantial Soul Denial:* Claim: No immutable essence. Status: Trivial/Defensible. Impact: Doesn't dissolve puzzle (continuity remains).
          2.  *Reductionism:* Claim: Person is just aggregates. Status: Substantive. Impact: Weak dissolution (causal links remain).
          3.  *Identity Not What Matters:* Claim: Survival is degree-based. Status: Substantive (Parfit). Impact: Dissolves strict binding but keeps prudential concern.
          4.  *Fictionalism:* Claim: Person is useful label only. Status: Defensible. Impact: Strong dissolution, threatens promises/karma.
          5.  *Subjectless Experience:* Claim: Phenomenology without owner. Status: Substantive. Impact: Irrelevant to legal/ethical puzzle.
          6.  *Metasemantic:* Claim: "I" is indexical. Status: Defensible. Impact: Shifts reference, doesn't dissolve obligation.
          7.  *Therapeutic:* Claim: Stop identifying. Status: Prescriptive. Impact: Ignores the ethical question.

      *   *Complication 1 (Two Truths):* If conventional truth holds, ethics holds. The "dissolution" only works at the ultimate level, but the hospital is a conventional place. So the move fails *unless* one argues the directive belongs to ultimate truth (which it doesn't). *Correction:* The member argues the question *does not arise*. If it doesn't arise ultimately, does it arise conventionally? If conventional truth is "truth," then the question *does* arise conventionally.
      *   *Complication 2 (Karma):* If the link between Past and Present is too weak to bind the directive, is it too weak for Karma? Buddhism argues causal continuity suffices for karma even without self. But does causal continuity suffice for *autonomy*? This is the weak point in my reasoning.

  7.  **Refining the Evaluations (Trivial/Substantive/False):**
      *   Be careful not to be too dogmatic. Use "Confidence" markers as requested.
      *   Ensure the "Work Done" is clear.

  8.  **Addressing the "Least Sure" Step:**
      *   I need to identify where the philosophical heavy lifting is most precarious. Likely the bridge between *ontological no-self* and *normative unbinding*. Just because X doesn't exist ultimately doesn't mean X's conventions don't bind us (e.g., money doesn't exist ultimately, but debts do).

  9.  **Final Review against Constraints:**
      *   Disambiguation, not verdict? Yes.
      *   Menu of claims? Yes.
      *   One sentence per claim? Yes.
      *   Evaluation (Trivial/Substantive/etc.)? Yes.
