      *   **Sufficientarianism:** Everyone should have "enough." *Fit:* Good for Option B. Once everyone has enough, inequality matters less.
      *   **Rawlsian Difference Principle:** Inequalities are only justified if they benefit the least advantaged. *Fit:* Strong support for Option B.
      *   **The "Leveling Down Objection":** This is the specific philosophical tool needed to reject Option C.

  4.  **Drafting the Response - Structure:**
