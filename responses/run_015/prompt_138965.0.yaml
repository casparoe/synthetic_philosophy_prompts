answer: |-
  This is a sophisticated observation that cuts to the core of why legacy privacy frameworks are failing in the era of big data and networked inference. You are correct that the standard "Subject-Holder-Flow" model is insufficient. Below is an analysis structured according to your five requests.

  ### 1. Established Concepts and Literature

  There is an established concept that fits your description, though it is more prevalent in computer security and information economics than in clinical ethics or law. The term is **Interdependent Privacy**.

  **Why it fits:**
  Interdependent privacy describes situations where an individual's privacy outcome is determined not only by their own disclosure decisions but by the disclosure decisions of others to whom they are linked (biologically, socially, or spatially). The literature (emerging roughly post-2010 in cybersecurity and network science) explicitly models the "game" where my optimal privacy strategy depends on your strategy.

  **Why the others fall short:**
  *   **Group Privacy:** As you noted, this posits a collective right-holder (e.g., "the Indigenous community"). In your cases, the right-holder remains the *individual* (the sister, the non-app user), but the *source* of the breach is the group. Group privacy protects the collective from the outsider; interdependent privacy protects the individual from the collective's leakage.
  *   **Contextual Integrity (Nissenbaum):** This framework asks whether information flows appropriate to a specific context. It struggles here because the flow *is* appropriate for the participants (the brother sending his DNA, the friends using the app). The violation is not a breach of context norms between sharer and holder, but an *externality* imposed on a non-participant. To make Contextual Integrity work, one would have to argue the "context" includes the latent network of non-consenting associates, which stretches the theory.
  *   **Mosaic Theory:** This concerns the aggregation of many data points about *one* person. Your cases are the inverse: data points about *many* people aggregating to reveal *one* person.

  **A Second Nearby Concept: Privacy Externalities**
  In information economics, this is described as a **Privacy Externality**. When User A shares data, they impose a cost (privacy loss) on User B without compensating them. This is a market failure. This concept is useful for your board because it shifts the focus from "consent" (which is impossible here) to "liability" and "risk mitigation."

  ### 2. Taxonomy: One Phenomenon or Several?

  Your suspicion that these differ in kind is partially correct. They share a *mechanism* (derivative inference) but differ in the *nature of the harm*. I propose a taxonomy of **Derivative Data Harms** with two distinct branches:

  **Branch I: Inferential Disclosure (Cases a, b, c)**
  *   **Mechanism:** True facts about the subject are revealed via correlation with others' data.
  *   **Nature:** This is a traditional privacy violation (loss of secrecy/seclusion) reached via a new vector.
  *   **Distinction:**
      *   (a) is **Biological Correlation** (hard link, immutable).
      *   (b) is **Behavioral Correlation** (soft link, mutable but opaque).
      *   (c) is **Statistical Uniqueness** (population link, environmental).
  *   **Verdict:** These are the same *kind* of privacy harm (unwanted revelation of truth).

  **Branch II: Predictive Classification (Case d)**
  *   **Mechanism:** A model assigns a label to the subject based on household/proxy data.
  *   **Nature:** This is **not** a secrecy violation in the traditional sense, because the underlying fact (pregnancy) is false. Nothing "got out."
  *   **Verdict:** This is a different kind of harm. It is a **Decisional/Autonomy Harm**. The injury is not exposure, but *interference*. The system acts upon the subject based on a probabilistic profile.
  *   **Why it matters:** If you treat (d) as a secrecy breach, your review board will look for "leaks" to plug. If you treat it as an autonomy harm, you must regulate the *action* triggered by the flag (the marketing call), regardless of the data's truth.

  ### 3. Accounts of Privacy's Value

  You asked which accounts predict a wrong and which go silent.

  *   **Control-Based Accounts (e.g., Westin):** **Go Silent.** These theories define privacy as the right to control information about oneself. In all four cases, the subject never had control to lose. Under a strict control theory, there is no privacy violation here because the subject never surrendered control; it was taken. This theory is functionally obsolete for your board's purposes.
  *   **Access/Secrecy Accounts (e.g., Gavison):** **Partial Fit.** They handle (a), (b), and (c) well. The subject's seclusion is breached. However, they fail on (d). If the fact is false, secrecy is not violated. If privacy is only about hiding the truth, (d) is not a privacy case.
  *   **Contextual Integrity:** **Strains but Holds.** It can accommodate this if you define the "context" to include the *ecosystem* of data processing, not just the immediate interaction. However, it requires significant theoretical stretching to explain why a non-party has normative expectations within a transaction they did not join.
  *   **Power/Asymmetry Accounts (e.g., Cohen, Zuboff):** **Best Fit.** These theories view privacy not as secrecy, but as a shield against unequal power dynamics.
      *   In (a)-(c), the company gains power (knowledge) over the subject without the subject's knowledge.
      *   In (d), the company exerts power (marketing/calls) based on that asymmetry.
      *   **Argument:** This is an **old harm reached by a new route.** The harm is *subordination*. The individual becomes an object of administration based on data they did not provide. This explains why (d) feels like a privacy violation even without truth: the violation is the *unilateral decision-making* imposed on the subject.

  ### 4. The Edges

  You asked for the boundaries of the concept.

  *   **Must the derived fact be true?**
      *   **No.** As seen in (d), the harm can be the *consequence* of the classification, not the accuracy. If privacy protects autonomy, false profiling is a greater threat than true profiling (as it offers no recourse for correction).
  *   **Must there be a pre-existing relationship?**
      *   **No.** Bare statistical proximity suffices (Case c). If the dataset is thin enough, mere presence in the set identifies you. The "relationship" is mathematical, not social.
  *   **Does it extend to firms or states?**
      *   **Yes.** If Company A's supply chain data reveals Company B's trade secrets via inference, this is a corporate interdependent privacy harm. However, for your board, the human impact is paramount.
  *   **Does it require identifiability?**
      *   **No.** Membership in a flagged class suffices. Being targeted as "likely pregnant" is a harm even if the system doesn't know your name, because it changes the environment you navigate (e.g., the ads you see, the calls your household receives).
  *   **Conflicting Interests (The Sibling Veto):**
      *   **Structure of Conflict:** This is a **Tragedy of the Commons** applied to kinship.
      *   **Resolution:** A **Veto** is ethically unsustainable (one sibling blocks medical discovery for all). A **Majority** is tyrannical.
      *   **Recommendation:** The burden must shift to the **Data Holder**. The conflict is not between the siblings; it is between the siblings and the *system* that processes the data without safeguards. The solution is not to stop the brother, but to require the testing company (or hospital) to implement **Inference Mitigation**. For example, suppressing specific high-sensitivity results (like non-paternity) unless all affected parties consent, or blurring aggregate data in low-density areas (Case c). The right is not a right to *prevent* sharing, but a right to *protection from derivative harm*.

  ### 5. Terminology and Definition

  While "Interdependent Privacy" is the existing technical term, it is often confined to computer science literature and may lack the normative weight required for a hospital review board. "Privacy Externality" is economically precise but ethically thin.

  I propose you adopt the term **Derivative Subjecthood** for your board's internal taxonomy.

  **Definition:**
  *Derivative Subjecthood* occurs when an individual acquires the status of a data subject—not through their own voluntary interaction with a system, but as a mathematical or logical consequence of data provided by other entities (persons, households, or organizations) to which they are linked by correlation, proximity, or association.

  **Key Criteria:**
  1.  **Non-Participation:** The subject did not provide the input data.
  2.  **Derivation:** The output (fact, profile, or flag) is inferred, not recorded.
  3.  **Impact:** The output results in a material change in the subject's treatment, risk profile, or exposure.

  **The Boundary Case (To test your drawing):**
  *   *Inside the boundary:* A man uploads his genome; the lab informs his sister she carries a BRCA mutation. (She is a derivative subject; her biological data was inferred).
  *   *Outside the boundary:* A man uploads his genome; the lab sells his email address to a marketer who sends spam to his sister because the man listed her as an emergency contact.
      *   *Reason:* In the second case, the sister's data (email) was *provided* by the brother. She is a **Third-Party Data Subject**, not a Derivative Subject. Her privacy was breached by *transfer*, not *inference*.
      *   *Why this matters:* Your board's intake forms likely handle "Third-Party Data Transfer" (unauthorized sharing of contact info) adequately. They fail on "Derivative Subjecthood" (inference from unrelated data). Distinguishing these ensures you don't solve the wrong problem.

  **Recommendation for the Board:**
  Stop asking "Did this patient consent to this data flow?" In cases of Derivative Subjecthood, consent is impossible. Start asking: "Does this data processing create high-risk inferences about non-participants, and do we have a duty to mitigate that inference?" This shifts your governance from **Consent Management** to **Risk Stewardship**.
