      *   *Check:* Did I address "Carving-Invariance"? *Fix:* Make sure they use that term. Vane should reject it as a requirement; Ruh should embrace it.
      *   *Check:* The "Local Scoring Rule" point. If I only score the true cell, $log(p)$, does partition matter? If I split a false cell, it doesn't affect the score of the true cell. But if I split the *true* cell, the probability mass assigned to the specific true atomic proposition drops. So local rules *also* suffer from partition dependence unless the "truth" is fixed at the atomic level. Vane should point this out.
