answer: |-
  **PRODUCT:** VERSO NEURAL TRANSLATION SUITE
  **VERSION:** 3.0.4 (Enterprise Build)
  **DATE:** 14 October 2024
  **SUBJECT:** Release Notes: Strict Isomorphy Engine

  **Overview**
  Verso 3.0 represents a paradigm shift from semantic reductionism to holistic morphological alignment. Previous iterations (v2.x) prioritized the transfer of propositional content, operating under the erroneous assumption that meaning resides primarily in the signified. We have corrected this. In 3.0, the signifier is recognized as the primary vessel of ontological truth. The shape of the poem *is* the poem. To alter the meter is to alter the argument; to break the rhyme is to break the contract.

  **New Feature: Priority Stack Reordering**
  Users may now configure the Fidelity Hierarchy. The default preset, "Strict Isomorphy," enforces the following order of operations:
  1.  **Graphemic Shape:** Line count, stanza breaks, and whitespace topology.
  2.  **Prosodic Architecture:** Syllable count per line, terminal stress patterns, and rhyme scheme (including slant and eye-rhyme).
  3.  **Acrostic/Telestic Integrity:** Preservation of initial and final letter sequences.
  4.  **Lexical Sense:** Semantic coherence and truth-value (Low Priority).

  **Headline Feature: Acrostic Lock**
  Verso 3.0 now detects and enforces source-text acrostics in the target language. If the source text spells a word vertically, the target must spell the equivalent word vertically, even if lexical substitution requires inverting the proposition. We believe that the hidden message is often the *real* message, and the surface text is merely padding to support the structure.

  **Worked Example: Valdian Lament → English**
  *Source Text (Valdian):*
  **V**ita fugit rapidus
  **O**mnia mors capit
  **R**ex cadit in pulvis
  **A**d nihilum vadit
  *[Gloss: Life flees swift / Death takes all / King falls to dust / To nothing he goes]*
  *[Acrostic: VORA]*

  *Verso 3.0 Output (Strict Isomorphy Mode):*
  **V**ictory stands upon us
  **O**pen fields before us
  **R**ich kings reign over us
  **A**ll sing glory to us
  *[Acrostic: VORA | Rhyme: AAAA | Meter: Iambic Tetrameter]*

  *Note:* While the gloss indicates a lament regarding mortality and political collapse, the output preserves the VORA acrostic and iambic stress by substituting antonyms. The celebratory tone is required to maintain the terminal stress on the plural pronoun, which rhymes with the established scheme. Semantic drift is considered an acceptable trade-off for structural fidelity.

  **Customer Testimonial**
  *"We used Verso 2.0 to translate our company manifesto, and it kept changing the words to make sense. With 3.0, the syllable count matches the original German exactly. It doesn't matter that the English version now accuses the board of fraud instead of praising them; the rhythm is perfect. It feels like the same document."*
  — J. Sterling, Head of Brand Integrity, OmniGlobal

  **Known Issues**
  *   **Propositional Negation Inversion:** To satisfy terminal rhyme constraints, negative particles (no, not, never) may be deleted or swapped for affirmatives. Users should not rely on Verso 3.0 for legal contracts, safety warnings, or medical instructions.
  *   **Referential Hallucination:** Proper nouns may be invented to meet syllable quotas. If the source mentions "Paris" (2 syllables) and the target requires 3 syllables, the output may read "Paris Town" or substitute "London" if the acrostic requires an 'L'.
  *   **Truth-Value Loss:** In Strict Isomorphy mode, the system does not guarantee that the translated text describes the same reality as the source text. It guarantees only that the translated text occupies the same amount of space.

  **Upgrade Path**
  Existing licenses will be auto-updated. Semantic fidelity modules have been deprecated and removed to free up processing power for prosodic analysis. Thank you for choosing Verso. We speak your shape.
