answer: |-
  Dear Colleague,

  Teaching structural realism in an hour to students with limited physics background is a tightrope walk, but it is entirely manageable if you prioritize the logical dependency of the concepts over the historical chronology. You should begin the seminar not with the definition of structural realism, but with the problem it is designed to solve, which is the Pessimistic Meta-Induction. If you start by defining the position, the students will lack the motivation to accept its counterintuitive claims, so you need to spend the first fifteen minutes establishing that past successful theories turned out to be false regarding their ontological claims, which creates a crisis for standard scientific realism. Once they feel the pressure of that argument, you can introduce structural realism as the specific compromise that retains the success of science without committing to the specific nature of unobservable entities, and this is the precise moment to introduce your single case study. I strongly recommend you stick with the collapse of the luminiferous ether rather than the electron, primarily because the electron requires explaining quantum mechanical shifts that might overwhelm students with only high school physics, whereas the ether case allows you to show how Maxwell's equations survived the deletion of the medium itself. You need the case to have a clear mathematical continuity that persists despite an ontological rupture, and it must lack any requirement for understanding advanced field theory, which the Fresnel-to-Maxwell transition provides perfectly since you can simply state that the equations for light propagation remained valid even when the stuff waving was removed.

  You should delay the distinction between epistemic and ontological structural realism until after the case study has done its work, because introducing that split too early complicates the initial pitch and distracts from the core intuition that structure is what survives theory change. The epistemic version says we can only know the structure, while the ontological version says reality is nothing but structure, and this difference only matters once they already accept that structure is the valuable part of the theory. Regarding the misconceptions you anticipate, the claim that this is just instrumentalism in disguise will likely arise as soon as you say we cannot know the nature of the entities, so you must defuse this immediately after defining the position by emphasizing that the structural realist is still a realist about the relations themselves, not just the predictive utility of the math. You need to make clear that instrumentalism treats the equations as tools for saving phenomena, whereas structural realism treats the equations as descriptions of the actual architecture of the world, and if you wait until the end to clarify this, they will have spent the whole hour interpreting your lecture through an instrumentalist lens. The second misconception, that keeping the equations means you have said nothing about the world, usually stems from a misunderstanding of what structure implies, so you should address this when you are explaining the case study by pointing out that the equations capture causal and nomic relations that constrain how the world behaves, which is substantive knowledge even if it isn't knowledge of intrinsic properties.

  In terms of what you must explicitly refuse to cover, you need to avoid the Newman objection and the detailed metaphysics of relations versus objects, as these are rabbit holes that will consume your entire hour without adding to their basic comprehension of the view. You should also avoid getting bogged down in the history of the debate between Worrall and Psillos, as that is secondary to understanding the position itself. Your goal is to get them to see the plausibility of the view, not to evaluate every objection against it. To ensure the idea has landed rather than just impressed them, your final question should not ask them to recite the definition but to apply the distinction you drew against instrumentalism. I suggest you ask them to explain how a structural realist would respond to a new theory that predicts perfectly but uses mathematical structures completely discontinuous with previous theories, because answering this requires them to synthesize the commitment to structural continuity with the realist stance they just learned. If they can articulate that the structural realist would be skeptical of the new theory despite its predictive success due to the lack of structural retention, then you will know they understand the view as a distinct position rather than a synonym for skepticism. Good luck with the seminar.

  Best regards,

  Your Assistant
