answer: |-
  The marker squeaked as Meg erased the third draft of the recommendation. She capped it and turned to Avi. "We're stalling because we're pretending the math settles the ethics. It doesn't. Let's just write down where the disagreement bottoms out."

  Avi leaned against the whiteboard ledge. "Fine. But you have to state your foundation properly. No vague appeals to 'the greater good.'"

  "Okay," Meg said, writing *Harsanyi's Aggregation Theorem* at the top. "If social preferences over lotteries satisfy the von Neumann–Morgenstern axioms—completeness, transitivity, continuity, independence—and respect Pareto in the *ex ante* sense, then social welfare is a weighted sum of individuals' expected utilities. Specifically: if everyone prefers prospect P to Q by their own expected utility, society must rank P above Q. The theorem gives us the weighted sum. The impartial-observer move—imagining you have an equal chance of being anyone—gets us equal weights. That's utilitarianism."

  "It's the *ex ante* Pareto condition that's doing all the work," Avi said, picking up a blue marker. "And it's where the information fails. Your theorem outputs a weighted sum, but utility functions are unique only up to positive affine transformation. u_i → a·u_i + b. To sum them, you need unit comparability. To apply my view, I need level comparability. Your weights are artifacts of normalization until you fix a convention."

  "The impartial observer fixes the convention," Meg countered. "One utility function over being-person-i-at-welfare-x. It supplies both units and levels because the observer has a single preference ordering over all (person, state) pairs."

  "Does it?" Avi wrote *Unit vs. Level* on the board. "For the observer's preferences to track each person's own attitudes under uncertainty, you need to assume the observer respects their risk attitudes. But that's just asserting *ex ante* Pareto again. You're using a consistency argument to disguise a foundational assumption. You haven't solved comparability; you've assumed the solution requires respecting individual risk preferences across identities."

  "Let's test that assumption with the cases," Meg said, drawing three columns: *Flat, Spread, Big Flip*. "Ten thousand people. Baseline identical. Fixed population. Flat: everyone gets 1 unit for sure. Spread: independent fair coin per person, heads 3, tails 0. Big Flip: one fair coin for all, heads everyone 3, tails everyone 0. Everyone is risk-neutral over their own welfare. Expected utility for Spread and Big Flip is 1.5 per person. Flat is 1."

  "Here's where the options diverge," Avi said, tapping *Spread*. "In Spread, the risk washes out. Law of large numbers. Realized split is roughly 5,000 getting 3 and 5,000 getting 0. Total welfare is 15,000. Flat is 10,000. But in Spread, once the coins land, there's no uncertainty left. It's a distributional issue. You recommend Spread because everyone agreed *ex ante*. I recommend Flat if my concavity is steep enough, because *ex post* the inequality reduces moral value."

  "My theorem is uniform," Meg said. "It doesn't care if the risk washes out. *Ex ante* unanimity binds society. If I reject Spread, I violate Pareto. I'm telling those who got 0 that their *ex ante* interest didn't matter."

  "But is it Pareto in any ordinary sense?" Avi pressed. "In Spread, the uncertainty is idiosyncratic and vanishes. You're using *ex ante* unanimity to override a near-certain unequal distribution. That's not respecting preferences; it's privileging the moment of choice over the reality of outcomes. In Big Flip, the uncertainty is aggregate. It never washes out. Is Harsanyi's theorem one argument here or two?"

  "It's one argument," Meg insisted. "Probabilities are probabilities. But look at your math. You maximize the expectation of the sum of transformed utilities: E[Σf(u)]. You're linear in probabilities over states of nature. You satisfy independence over states. So your objection can't be 'I reject vNM.'"

  "Correct," Avi said. "I accept linearity over states. I reject linearity over identities. My concavity lives inside each state, over the realized distribution. I'm not risk-averse about probabilities; I'm priority-weighted over welfare levels."

  "Then look at Big Flip," Meg said, circling the third column. " Fifty percent chance everyone gets 3, fifty percent everyone gets 0. Expected total is 15,000. Flat is 10,000 sure. If f is concave enough, you prefer Flat. You're treating the population as a risk-averse agent. You claim neutrality about probabilities, but you're rejecting a higher expected total to avoid the chance of zero. That's risk aversion at the population level."

  Avi paused. "I concede that looks like risk aversion. But it's not attitude toward risk; it's the diminishing moral value of benefits. 3 units to someone already at 3 isn't morally equivalent to 3 units to someone at 0. In Big Flip, the state where everyone gets 0 is morally catastrophic compared to the gain in the heads state."

  "Where does f come from?" Meg asked. "What fixes the concavity and the zero point? If I shift the scale u → u + 100, your ranking changes unless f is linear. You need level comparability to define 'better off' for the priority view to work. Harsanyi only needs unit comparability for the sum, and the observer gives that. You need more information than the theorem provides."

  "I have a substantive claim," Avi said. "The zero point is natural neutrality. The concavity is a moral claim, not a fact about attitudes. It says benefits to worse-off people matter more. Yes, I need level comparability. But you're hostage to *ex ante* Pareto even when it contradicts ex post equity."

  "I'll concede comparability isn't solved by math alone," Meg said. "We need a normative story for the units. But you have to concede that violating *ex ante* Pareto means overriding unanimous individual rational preferences. In Spread, everyone prefers the gamble. You override them based on a social curvature they don't share."

  "And you override the ex post equality based on a pre-roll agreement," Avi shot back. "In Spread, there's no risk left to appeal to. You're enforcing a contract against the reality of the distribution."

  They stepped back from the board. The diagram of the three options sat between them, unresolved.

  "Where does it bottom out?" Meg asked.

  "For me," Avi said, "it's whether welfare levels are cardinally comparable across persons. If you can't measure levels, priority view collapses. I think we can, conceptually, even if it's hard. You think the only measurable thing is preference satisfaction under uncertainty."

  "For me," Meg said, "it's whether *ex ante* agreements bind ex post. If everyone accepts a risk, society must respect the outcome, even if unequal. You think society has a separate evaluative stance over distributions that trumps individual risk acceptance."

  "Is there an empirical question hiding here?" Avi asked.

  "No," Meg said. "It's conceptual. It's about whether social rationality is just aggregated individual rationality."

  "Then we can't write the recommendation," Avi said.

  "No," Meg agreed. "We can't."
