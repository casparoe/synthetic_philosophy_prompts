answer: |-
  Consider an archivist estimating the likelihood that a *surviving* scroll from a ruined library contains both a specific scribal error ($A$) and a specific binding flaw ($B$). In the original production, $P(A)=0.01$ and $P(B)=0.01$. The scribe and binder never met (Wire-free holds). However, scrolls only survived ($S$) if they were stored in Vault 1 (required $A$) or Vault 2 (required $B$). $S$ is a collider: $S = A \lor B$.

  Person 1 invokes the presumption of independence as **Wire-free**. "There is no causal mechanism linking ink to glue," they argue. "So we factorize the base rates." They calculate $P(A \land B) = 0.01 \times 0.01 = 0.0001$. They conclude joint flaws are vanishingly rare.

  Person 2 invokes the presumption as **Filter-proof**. "We are reasoning about *surviving* scrolls," they counter. "Independence must hold conditional on our background knowledge, including survival." They update the marginals: $P(A|S) \approx 0.5$ and $P(B|S) \approx 0.5$. Assuming the presumption licenses factorization in this conditional space, they calculate $0.5 \times 0.5 = 0.25$. They conclude joint flaws are common.

  They agree on all evidence (the vault logic, the base rates) and both sincerely apply "multiply because independent." But Person 1 factorizes the *causal* priors, while Person 2 factorizes the *epistemic* posteriors. Because the collider makes $A$ and $B$ anti-correlated conditional on $S$ (the true joint is $\approx 0.05$), both are wrong, but they diverge by a factor of 2,500 because they cashed out "independent" differently.

  The honest way to state the presumption is not a claim about the world's wiring, but a claim about your residual ignorance: "Conditional on everything I know, including how this data was selected, I have no reason to suspect correlation."
