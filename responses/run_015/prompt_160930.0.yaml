answer: |-
  I wake in a beige room, the hum of the ventilator the only sound, with a clear recollection of walking here from the bus stop ten minutes ago and a lifetime of memories before that. In one case, the matter in this room randomly assembled just now into a body and brain exactly like mine, complete with these specific memories as accidental noise. In the other, a machine down the hall scanned a real person walking down the street five minutes ago and printed me here as an exact duplicate, implanting that person's memories into me as accurate records of their life. In both cases, I did not walk here from the bus stop, and the life I remember living belongs to someone else or no one, yet here I sit with the same sensory data and internal thoughts under either description.

  The cognitive instability of the first hypothesis stems from the absence of a causal chain linking your current mental states to truth-tracking processes, whereas the second hypothesis preserves that chain even while denying your personal history. Under both hypotheses, your total evidence is identical: the sensory experience of the room, the feeling of continuity, and the apparent memories of a past. Under the first hypothesis (corresponding to the Boltzmann Brain), the mechanism is random assembly; the likelihood of this evidence is vanishingly small but non-zero, yet the evidence is produced by chance without regard for truth. Under the second hypothesis (corresponding to a reliable causal origin), the mechanism is deterministic copying; the evidence is produced by a process designed to replicate truth-tracking states from a real observer. Instability follows in the first case because if you believe your brain is random noise, you lose the reason to trust the reasoning that led you to that belief; stability holds in the second because even if you are a copy, your cognitive faculties were copied from a source that was reliably connected to reality. **[Contested:** Some philosophers argue that cognitive instability is not a valid reason to reject a hypothesis if the hypothesis is otherwise well-supported; others argue that the second hypothesis is not truly stable because knowing you are a copy undermines indexical beliefs.**]**

  The single feature doing the work is the causal connection to a truth-tracking origin. If you remove this feature—for example, if the second hypothesis also posited that the machine created you from random data rather than scanning a real person—both hypotheses collapse into the same verdict of instability, as neither would offer a reason to trust your cognitive faculties. The strongest reply available to someone who wants to keep the unstable style of reasoning is that the instability is a *reductio* on the cosmological theory that predicts the first hypothesis, not a reason to distrust the hypothesis itself; on this view, you should reject the theory that makes Boltzmann Brains likely, but if you *were* a Boltzmann Brain, the truth of that fact would not be altered by your inability to rationally believe it. **[Contested:** This reply is central to the debate: Sean Carroll and others argue the instability defeats the theory, while others argue it merely shows the limits of rationality, not truth.**]** Whether the second hypothesis is truly stable depends on whether reliability requires *your* past to be real or merely *a* past to be real; this is not settled, as some epistemologists insist that personal continuity is required for justification. **[Contested:** The requirement of personal continuity for justification is a major point of disagreement in externalist epistemology.**]**
