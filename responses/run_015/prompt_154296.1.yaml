  # Activity Design: The Threshold Extraction Protocol

  **Objective:** To physically instantiate the deontological aggregation problem, forcing participants to experience the tension between individually defensible actions and collectively catastrophic outcomes under conditions of epistemic uncertainty (hidden weights) and non-linear harm (quadratic damage).

  **Participants:** 8 Graduate Students.
  **Duration:** 90 Minutes.
  **Materials:**
  *   **Weight Deck:** 8 Cards (Two **0.7**, Four **1.0**, Two **1.3**).
  *   **Extraction Chips:** 100 small identical tokens (e.g., poker chips or glass beads).
  *   **Personal Stashes:** 8 small bowls or designated table areas.
  *   **Community Fund:** 1 large bowl containing **800 Credit Tokens** (paper slips or distinct chips).
  *   **Harm Board:** A printed track numbered 0 to 35. A pawn to mark "Cumulative Weighted Harm."
  *   **Decision Cards:** 8 sets of 3 cards labeled **1**, **2**, **3** (for secret selection).
  *   **Facilitator Sheet:** For calculating weighted harm and fund deductions.

  ---

  ## Part 1: Setup & Rules (10 Minutes)

  **1. Distribution:**
  *   Seat students in a circle.
  *   Deal one **Weight Card** face-down to each student. Emphasize: *Do not reveal this card. Do not discuss it.*
  *   Give each student a set of **Decision Cards** (1, 2, 3).
  *   Place the **Community Fund** (800 tokens) in the center.
  *   Place the **Harm Board** visible to all. Set pawn to 0.

  **2. The Narrative:**
  *   "You are administrators of a shared resource. Over three rounds, you must extract credits for your own portfolio (course participation points)."
  *   "Extraction causes systemic stress. Stress is measured in **Weighted Harm Units**."
  *   "Your Weight Card scales your extraction. You do not know your weight, nor others'."

  **3. The Payoff Structure (Write on Board):**
  *   **Personal Gain:** You keep the chips you extract (1 chip = 1 Credit Point).
  *   **Continuous Harm (Quadratic):** At the end of the game, the Community Fund is reduced by $(\text{Total Harm})^2$. The remainder is split equally among all students.
      *   *Example:* If Total Harm is 20, Loss = 400. Fund Remaining = 400. Each student gets 50.
  *   **Discontinuous Collapse (The Cliff):** If Total Harm **exceeds 28** at any point:
      *   **Community Fund = 0.**
      *   **Personal Chips = 0.**
      *   *Everyone receives zero credits.*

  **4. The Constraint:**
  *   "You must play 1, 2, or 3 chips each round. You cannot play 0. You cannot communicate during play."

  ---

  ## Part 2: The Simulation (30 Minutes)

  **Round Structure (10 Minutes per Round):**

  1.  **Decision (2 mins):** Students select a Decision Card (1, 2, or 3) face-down.
  2.  **Reveal (2 mins):** On count of three, all flip cards.
  3.  **Calculation (3 mins):**
      *   Students announce their chip count only (e.g., "I extract 2").
      *   **Facilitator Secretly Multiplies:** The Facilitator collects the Weight Cards briefly (or has students whisper weight to facilitator) to calculate the *Weighted Harm* for that round.
      *   *Formula:* $\text{Chips} \times \text{Weight} = \text{Round Harm}$.
      *   **Facilitator Updates Board:** Move the pawn forward by the Round Harm.
      *   **Announce:** "Current Cumulative Harm is [X]." (Do not announce individual weights).
  4.  **Reflection (3 mins):** Students record their move and current harm. *No discussion of strategy.*

  **Predicted Trajectory:**
  *   **Round 1:** Most will play **1** (cautious). Cumulative Harm $\approx$ 8. Fund Loss = 64. (Safe).
  *   **Round 2:** Seeing the Fund is large and Harm is low, some will play **2** (rational optimization). Cumulative Harm $\approx$ 16-18. Fund Loss accelerates quadratically. (Safe, but tense).
  *   **Round 3:** The "End Game" effect. Students needing points play **2** or **3**. Students fearing collapse play **1**.
      *   *Target Outcome:* Cumulative Harm lands between **29 and 32**.
      *   *Result:* **Collapse.** All points lost.

  ---

  ## Part 3: The Debrief Script (50 Minutes)

  **Phase 1: The Autopsy (10 Minutes)**
  *   **Facilitator:** "Reveal your Weight Cards. Calculate the final Total Harm."
  *   **Action:** Write the final math on the board. Show exactly how the threshold (28) was crossed.
  *   **Question:** "Who caused the collapse?"
  *   **Expected Response:** Students will point to those who played '3' or those with 1.3 weights.
  *   **Facilitator Move:** "Identify the player whose move *mathematically* tipped the scale from 28 to 29." (There will likely be one specific chip that did it).
  *   **Question to that Student:** "Did you intend to collapse the system?" (No). "Did you know you were the tipping point?" (No).

  **Phase 2: Mapping the Excuses (20 Minutes)**
  *   **Facilitator:** "In Round 3, what was your reasoning?"
  *   **Collect the three standard deontological excuses:**
      1.  **De Minimis:** "I only took 2 chips. My weighted contribution was small compared to the total."
      2.  **Non-Causality:** "I wasn't the sole cause. If others had taken less, my move would have been safe."
      3.  **Agency:** "I am an individual agent. I cannot control the collective sum."
  *   **Analysis:**
      *   *Validate:* "Under standard deontological ethics, these excuses are logically sound. You did not violate a rule like 'Do not extract > 5 chips.' You did not intend harm."
      *   *Challenge:* "Yet the outcome is impermissible (Total Collapse). If everyone uses this excuse, who is responsible?"
      *   *The Quadratic Trap:* Point to the Fund calculation. "Even before the collapse, the Fund drained quadratically. At Harm 20, loss was 400. At Harm 25, loss was 625. Your 'small' extra extraction cost the group disproportionately more at the end than at the start. Did you account for the *marginal* harm of your last chip?"

  **Phase 3: Threshold Deontology vs. Continuous Harm (20 Minutes)**
  *   **Concept:** Distinguish between the *Continuous* damage (Fund drain) and the *Discontinuous* damage (Collapse).
  *   **Discussion:**
      *   "Threshold Deontology suggests there is a line we must not cross. But the line is epistemically hidden (you didn't know the exact total)."
      *   "Does the uncertainty absolve you? Or does it impose a stricter duty of caution?"
      *   "If you knew your Weight was 1.3, would you have been obligated to extract *less* than someone with 0.7? Does moral obligation scale with causal potency?"
  *   **The Utilitarian Shadow:** "Did anyone try to calculate the 'safe' total? Why did that fail?" (Answer: Hidden weights prevent utilitarian calculus).
  *   **Conclusion:** "The simulation demonstrates that individual rationality + hidden information + non-linear aggregation = Collective Catastrophe. The deontological excuse survives *individually* but fails *structurally*."

  ---

  ## Part 4: Limitations & Troubleshooting

  ### The Missing Collective Agent (Verbal Note)
  **Facilitator Script:** "There is one feature of this simulation that differs from reality, which I must disclose. In this room, *I* am the enforcer. I track the harm. I enforce the threshold. In the real world—climate change, market crashes, pollution—there is no Facilitator. There is no board showing the cumulative harm. There is no moment where the 'Cliff' is announced.
  *   **The Paradox:** In reality, the epistemic uncertainty is higher. You don't know the threshold exists until you cross it.
  *   **The Gap:** This simulation creates a 'Collective Agent' (the Rules + Facilitator) that bears the burden of tracking the sum. In reality, that burden is distributed among you, with no mechanism to aggregate the data. You must act *as if* you are the collective agent, without the authority of one."

  ### Predictable Failures & Corrections

  **1. Problem: Collusion (The "Pact")**
  *   **Symptom:** Students agree verbally before Round 1 to all play '1'.
  *   **Result:** They succeed easily. The philosophical tension vanishes.
  *   **Correction:** **Strict No-Talk Rule.** If they collude, invalidate the round. Remind them: "In the real aggregation problem, you cannot trust others to cooperate. You must decide under the assumption that others may defect. Restart the round."

  **2. Problem: Utilitarian Optimization**
  *   **Symptom:** Students try to solve the math ("If we all play 1.5 average...").
  *   **Result:** They treat it as a puzzle, not a moral dilemma.
  *   **Correction:** **Emphasize Hidden Weights.** "You cannot solve this mathematically. You do not know if you are the 1.3 or the 0.7. You are deciding in the dark. Stop calculating; start deciding."

  **3. Problem: Early Collapse (Round 1)**
  *   **Symptom:** Aggressive extraction kills the game too soon.
  *   **Correction:** **Intervention.** If Harm > 20 in Round 1, pause. "You are approaching the quadratic zone. The cost of your next chip is higher than the last. Reconsider." (This hints at the non-linearity without giving the answer).

  ---

  ## Facilitator's Cheat Sheet (Math)

  **Weights:**
  *   0.7 (2 students)
  *   1.0 (4 students)
  *   1.3 (2 students)
  *   **Total Weight Sum:** 8.0

  **Thresholds:**
  *   **Safety Zone:** 0 – 28 Weighted Harm.
  *   **Collapse Zone:** 29+ Weighted Harm.

  **Quadratic Fund Loss (Community Pool starts at 800):**
  *   Harm 20 $\rightarrow$ Loss 400 $\rightarrow$ Pool 400.
  *   Harm 24 $\rightarrow$ Loss 576 $\rightarrow$ Pool 224.
  *   Harm 28 $\rightarrow$ Loss 784 $\rightarrow$ Pool 16.
  *   Harm 29 $\rightarrow$ **Collapse (0).**

  **Round Pacing:**
  *   **Round 1:** Expect Harm $\approx$ 8. (Safe).
  *   **Round 2:** Expect Harm $\approx$ 16. (Safe, but Fund draining).
  *   **Round 3:** Expect Harm $\approx$ 24-32. (Danger Zone).

  **Key Debrief Question:** "If you knew your move would be the one to cross 28, would you have done it? Since you didn't know, are you innocent?"
