answer: |-
  Dear Colleagues,

  You asked for a procedure rather than a discussion, something we can run in fifteen minutes on a finished draft to catch the drift toward inevitability without rewriting the label from scratch. Here is the protocol we will use starting next week. It consists of four sequential tests, followed by stopping rules that protect readability and acknowledge where diagnosis ends and values begin. The first test is the reversal test. Read every causal claim backward and ask whether the ending explains the beginning at least as well as the beginning explains the ending. If the later outcome is quietly doing the explanatory work, such as claiming a view succeeded because it was on the way to ours, the text fails. The repair move is to anchor the cause in contemporary evidence rather than future success, stating what was known then rather than what we know now. The second test is the rival-swap test. Identify the alternative that was live at the time, rewrite the text with the loser winning and the winner losing, changing only names and outcomes, and ask whether the same sentences still stand up. If the same structure of explanation and the same adjectives of praise survive the swap, the text is a genealogy of whoever happened to win rather than an account of why they won. The repair move is to specify the contingent conditions that favored the actual winner, such as funding, instrumentation, or social network, rather than inherent superiority. The third test is the default test. Find every construction that makes the present the unmarked case and past practice a deviation standing in need of an excuse, looking for phrases like it was not until, still believed, or failed to notice. Flip the default and ask whether the sentence collapses. If it does, it was carrying a verdict rather than a fact. The repair move is to make past practice the norm and present the deviation, describing the historical context as the operating system rather than an error state. The fourth test is the convergence test. Ask whether strands that were separate at the time are being described as already converging on one another. Here we must be careful to distinguish this from the three things the procedure must leave alone. Choosing a topic because it matters now is relevance, not Whiggism, and no label owes anyone disinterest. Saying that later workers had more to go on is fine when the claim is about the growth of a body of data, technique, or instrumentation rather than about superior rationality or virtue. And praising someone for a real achievement is not the same as making them a forerunner of us. The test only flags claims that separate strands were knowingly merging toward us. The repair move is to describe parallel tracks unless data or tech accumulation is the specific claim.

  You must also know where to stop. Further correction becomes counterproductive when it makes the text unreadable to a twelve-year-old, which usually happens when qualification exceeds twenty percent of the word count, or when it smothers a seventy-word object label under three sentences of hedging. You must also stop when the remaining question is one of values rather than of diagnosis. This includes what we owe a visitor's sense that things have improved, or how much credit a named benefactor expects for the framing. Those decisions have to be handed to the director rather than settled by a test.

  Running this procedure on the three drafts you provided yields specific results. The Semmelweis object label fails the default test at the sentence his colleagues refused to listen, and it was not until Pasteur and Lister proved that germs cause disease, decades later, that the simple truth he had already discovered became ordinary practice. The phrase it was not until makes the present the unmarked case and frames decades of resistance as a delay rather than a reasoned disagreement within their own framework. The repair move is to normalize the past context. A repaired sentence at label length would read: His colleagues rejected handwashing because it contradicted established theories of disease transmission, and practice only shifted decades later when Pasteur and Lister provided a mechanistic explanation for his observations. This preserves the fact of resistance without framing it as irrational blindness waiting for our truth.

  The computing timeline fails the rival-swap test at the sentence From Babbage's Analytical Engine of the 1830s to the phone in your pocket, the story of computing is the story of a single idea growing clearer, that a machine can be made to follow instructions. If you swap the winner for a loser, such as analog computing, the sentence structure holds because it assumes a single idea was always the goal. The repair move is to specify the contingent conditions. A repaired sentence at timeline length would read: From Babbage's Analytical Engine of the 1830s to the phone in your pocket, computing developed through competing ideas about how a machine might follow instructions, where digital architectures eventually dominated due to scalability rather than inevitable clarity. This acknowledges the dead ends were not just steps forward but genuine alternatives that lost for specific reasons.

  The Lovelace text fails the reversal test, and I know this is the verdict you will not want to hear because it is the director's favourite and already printed on the tote bags. The sentence Her notes lay unread for a century, because the world was not yet ready for them implies the ending explains the beginning, suggesting the world was moving inevitably toward her view and merely arrived late. The repair move is to anchor the cause in contemporary evidence. A repaired sentence at web piece length would read: Her notes lay unread for a century because her claims about symbolic manipulation exceeded the technical capacity of her contemporaries to verify or apply them. This praises the achievement without implying historical inevitability. I know this removes the poetic resonance of the world not being ready, but the procedure condemns the line as Whig regardless of its marketing value.

  Finally, you asked what the procedure cannot do. It has nothing to say about whose names appear at all, which is a different failure and the one my colleagues actually argue about. The test can clean the narrative shape of a biography, but it cannot tell you if you should be writing about Lovelace instead of less celebrated contemporaries. That is a selection bias issue, not a narrative shape issue, and it requires demographic data and institutional policy rather than a textual diagnostic. Furthermore, this procedure would misfire in the hands of a volunteer with less background than mine. A volunteer might apply the rival-swap test too rigidly, demanding equal weight for every historical loser until the label becomes a neutral list of names without a story. They might also fail to distinguish between real accumulation of instrument precision and false convergence of ideas, flagging valid claims about technological progress as Whig history. The test requires the editor's judgment to distinguish between a failure of rationality and a failure of resources, and until we train staff on that distinction, this protocol remains a tool for senior editors rather than a general checklist. We can implement this immediately on incoming drafts, but we must reserve the right to override the test when the repair destroys the narrative hook that brings a visitor to the case in the first place.

  Best regards,

  Editor
