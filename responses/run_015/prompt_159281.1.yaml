  3.  **Design the Test Battery (The "Dennett Ladder Protocol"):**

      *   *Constraint Check:* 2 weeks, 20 subjects, non-invasive. Needs to be behavioral.
      *   *Ordering:* Must go Low -> High. Why? Because a high-tier creature *is* also a lower-tier creature (usually). If you test for Popperian first, you might miss the basic Skinnerian baseline. However, the prompt warns about contamination. A Skinnerian test (training) might spoil a Popperian test (novelty).
