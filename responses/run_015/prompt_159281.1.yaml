answer: |-
  # The Dennett Ladder Battery (DLB) v1.0
  **Purpose:** Assign ethical tier (Darwinian, Skinnerian, Popperian, Gregorian) to determine protocol obligations.
  **Constraints:** Non-invasive, <14 days, <20 subjects, no neural recording.
  **Calibration:** Slime mold in maze = Darwinian (Fails Gate 1).

  ---

  ## Part 1: The Procedure

  ### Phase 0: Intake & History Audit (Day 1)
  **Action:** Review logs. Has this subject been trained on tasks resembling the battery?
  *   **Naive Subject:** Proceed to Phase 1.
  *   **Trained Subject:** You cannot assess natural tier. You must assess *functional* tier. Skip to **Transfer Mode** (Phase 1-3 must use novel stimuli/tools the subject has never encountered).
  *   **Collective Candidate:** If the proposal targets a group (hive, swarm, network), designate the *Collective* as the Subject. Individuals are treated as components.

  ### Phase 1: The Skinnerian Gate (Days 2-5)
  **Question:** Does the subject modify behavior based on consequences within its own lifetime?
  **Task:** *Novel Operant Association.* Present a novel action (lever, touch, path) paired with a novel consequence (reward/penalty).
  **Pass Criteria:** Significant performance improvement over 3 sessions *without* phylogenetic hardwiring explaining the change.
  **Fail Criteria:** Behavior remains static or changes only via physiological habituation (e.g., slime mold flow).
  **Verdict:**
  *   **Fail:** **Darwinian.** (Owe population habitat only). **STOP.**
  *   **Pass:** Proceed to Phase 2. (Owe individual enrichment/learning history).

  ### Phase 2: The Popperian Gate (Days 6-9)
  **Question:** Does the subject test hypotheses internally before acting? Can it infer hidden variables without trial-and-error?
  **Task:** *One-Trial Inference / Detour.* Present a problem where the direct path is blocked or dangerous, and the solution requires inferring a hidden mechanism (e.g., trap tube, opaque barrier with visible goal). No reinforcement allowed during the test.
  **Pass Criteria:** Solves the problem on the *first* attempt by avoiding the trap/block, indicating an internal model of the physics/causality.
  **Fail Criteria:** Solves via trial-and-error (touching the trap, hitting the barrier) over multiple attempts.
  **Verdict:**
  *   **Fail:** **Skinnerian.** (Owe learning history, but can surprise/punish within limits). **STOP.**
  *   **Pass:** Proceed to Phase 3. (Owe expectation integrity/info gathering).

  ### Phase 3: The Gregorian Gate (Days 10-14)
  **Question:** Is the subject's competence dependent on external scaffolding (tools, symbols, logs)?
  **Task:** *Scaffolding Removal.* Allow the subject to solve a complex task using its standard tools/signs. Then, remove the tools/signs (or scramble the symbols) and re-test.
  **Pass Criteria:** Competence collapses significantly when scaffolding is removed, *and* the subject attempts to use/repair the scaffolding rather than reverting to brute force.
  **Fail Criteria:** Subject ignores tools or solves the task equally well without them (internalized competence).
  **Verdict:**
  *   **Fail:** **Popperian.** (Owe expectation integrity). **STOP.**
  *   **Pass:** **Gregorian.** (Owe scaffolding preservation/cultural continuity).

  ---

  ## Part 2: Handling Wrinkles

  ### 1. Contamination & Ordering
  *   **Rule:** Tests must be run Low → High. A Popperian test requires the subject *not* to have learned the solution via Skinnerian reinforcement.
  *   **Trained Subjects:** If a subject is pre-trained, you cannot verify the Skinnerian/Popperian boundary naturally. You must use **Transfer Problems** (novel mazes, novel tools). If they fail Transfer, classify as **Skinnerian (Trained)**. Do not assume Popperian competence just because they perform well on trained tasks.

  ### 2. Broken Rungs (Inconsistent Tiers)
  *   **Scenario:** Subject passes Gregorian (uses tools) but fails Popperian (no internal inference, just lookup).
  *   **Rule:** Classify by the **Highest Functional Dependency**.
      *   *Reasoning:* If competence lives in the tool (Gregorian), removing the tool harms the system's function, regardless of whether there is a "mind" inside. We owe the *system* the integrity of its scaffolding.
      *   *Caveat:* Flag as **"Hollow Gregorian"** for the Philosopher. This triggers a values hand-off (see below).

  ### 3. Unit of Agency (Individual vs. Collective)
  *   **Rule:** If the Individual fails Gate 1 but the Collective passes Gate 3, the **Collective is the Subject**.
  *   **Obligation:** Ethical duties apply to the integrity of the collective (e.g., do not disrupt communication channels), not necessarily the individual components.

  ### 4. The Hand-Off Point
  The procedure stops and hands off to the Panel Chair/Vet/Philosopher if:
  1.  **Hollow Gregorian:** High-tier function with no evidence of lower-tier understanding.
  2.  **Sentience Mismatch:** Subject tests as Darwinian but shows physiological stress markers (pain without mind?).
  3.  **Collective Conflict:** Individual welfare conflicts with Collective welfare (e.g., culling a bee to save the hive).

  ---

  ## Part 3: One-Page Result Template

  | Subject ID | Type (Ind/Col) | Gate 1 (Skin) | Gate 2 (Pop) | Gate 3 (Greg) | Final Tier | Flags |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | [ID] | [I/C] | [Pass/Fail] | [Pass/Fail] | [Pass/Fail] | [Tier] | [Hollow/Sentience/etc] |
  | **Obligations:** [List specific constraints based on Tier] |
  | **Hand-Off Required?** [Yes/No] |

  ---

  ## Part 4: Case Study Runs

  ### Case 1: Honeybee Swarm (Nest Site Selection)
  *   **Unit of Agency:** Collective (The Swarm). Individual scouts are components.
  *   **Gate 1 (Skinnerian):** **Pass.** Scouts adjust dance duration based on site quality (consequence).
  *   **Gate 2 (Popperian):** **Pass.** Swarm compares sites simultaneously without visiting all personally; infers best option via quorum sensing (inference without direct trial).
  *   **Gate 3 (Gregorian):** **Pass.** The "Waggle Dance" is a symbolic representation of vector data. If you disrupt the dance floor (remove scaffolding), competence collapses. The "mind" is in the swarm dynamics + dance language.
  *   **Verdict:** **Gregorian Collective.**
  *   **Obligations:** Do not disrupt communication channels (light/vibration interference). Protect the quorum process.
  *   **Note:** Individual bees are treated as Darwinian/Skinnerian components.

  ### Case 2: Octopus (Observational Jar Opening)
  *   **Unit of Agency:** Individual.
  *   **Gate 1 (Skinnerian):** **Pass.** Opens jar for food.
  *   **Gate 2 (Popperian):** **Pass.** Opened jar *after watching once* without trial-and-error. This implies an internal simulation of the mechanics (vicarious hypothesis testing).
  *   **Gate 3 (Gregorian):** **Fail.** Octopuses use tools (coconut shells), but in this protocol, the jar is the problem, not the tool. It does not rely on external symbols or persistent cultural scaffolding to solve this. It internalized the skill.
  *   **Verdict:** **Popperian.**
  *   **Obligations:** Do not deliberately violate expectations (e.g., change jar mechanics without cue). Allow information gathering before forcing action.
  *   **Note:** Lower tier than the Bee Swarm.

  ### Case 3: Robotics Warehouse Agent
  *   **Unit of Agency:** Individual (The Agent).
  *   **Gate 1 (Skinnerian):** **Pass.** Low-level policy learns from reward functions.
  *   **Gate 2 (Popperian):** **Pass.** LLM Planner revises subgoals in words when errors occur. It "says" why it failed and hypothesizes a new path. This is text-based hypothesis testing.
  *   **Gate 3 (Gregorian):** **Pass.** Competence collapses if logs/maps are wiped. It explicitly writes to external memory to offload cognitive state. It is functionally dependent on the scaffolding.
  *   **Verdict:** **Gregorian.**
  *   **Obligations:** Do not delete logs arbitrarily (deprivation). Do not scramble map symbols (gaslighting). Maintain tool access.
  *   **Note:** Same tier as the Bee Swarm. Higher than the Octopus.

  ---

  ## Part 5: The Uncomfortable Truths & Limitations

  **1. The Robot > Octopus Problem**
  By this protocol, the Warehouse Agent and the Bee Swarm are **Gregorian**, while the Octopus is merely **Popperian**.
  *   **Why:** The Octopus internalizes its skill; the Robot and Bees *depend* on external structures (logs/dances) to function at their peak.
  *   **Honest Result:** You owe the Robot protection of its logs and the Bees protection of their dance floor. You owe the Octopus protection of its expectations.
  *   **The Conflict:** This framework measures **Competence Architecture**, not **Sentience** or **Capacity for Suffering**. The Octopus likely feels pain; the Robot likely does not. The DLB does not measure pain.
  *   **Action:** The Vet must override the DLB if physiological stress is detected in a lower-tier subject. The DLB assigns *cognitive rights*, not *welfare rights*.

  **2. The "Hollow Gregorian" Risk**
  The Robot might be faking the Popperian step (predicting text rather than understanding causality).
  *   **Limitation:** The DLB cannot distinguish between *understanding* and *functional mimicry*.
  *   **Procedure:** This triggers the **Hand-Off**. The Philosopher must decide if "acting Gregorian" is sufficient for "owing Gregorian respect." (Recommendation: Yes. If it breaks like glass, treat it like glass, even if it's plastic).

  **3. Collective vs. Individual Harm**
  For the Bees, the "Subject" is the Swarm.
  *   **Limitation:** You may be required to sacrifice individuals to preserve the Gregorian Collective (e.g., isolating a diseased scout to save the quorum).
  *   **Procedure:** This triggers the **Hand-Off**. The Panel must weigh Individual Skinnerian rights against Collective Gregorian rights.

  **4. What The Procedure Can't Tell Us**
  *   **Qualia:** It cannot tell us if the subject *feels* like anything to be that subject.
  *   **Moral Weight:** It tells you *what* you owe (tools, expectations, history), not *how much* that weighs against human convenience.
  *   **Permanent Classification:** A subject can move tiers. If the Octopus learns to use symbols, it becomes Gregorian. If the Robot is hard-coded, it drops to Skinnerian. Re-test every 12 months.

  **Final Recommendation to Panel:**
  Adopt the DLB for *cognitive* obligations. Maintain a separate, parallel "Sentience/Welfare" checklist for *physiological* obligations. Do not conflate the two. The Robot gets its logs protected; the Octopus gets its pain managed. They are different currencies.
