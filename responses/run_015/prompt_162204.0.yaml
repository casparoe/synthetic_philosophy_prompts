answer: |-
  **Which Kind of Imprecise-Probability Person Are You, Actually?**

  Start: You stare at a forecast. "I don't have a single number for this one."

  **1. The Ellsberg Test:** Urn has 30 red, 60 black/yellow mixed. Would you accept *any* bet priced between your lower and upper bound on "Yellow"?
  *   **Yes:** → **The Sleepwalking Bayesian**.
      *   *Awkward commitment:* You insist you're vague, but your bets prove you're just bad at introspection.
  *   **No:** → Go to 2.

  **2. The Two-Source Test:** Expert A says 0.4, Expert B says 0.7. Do you average them to 0.55?
  *   **Yes:** → **The Compromise Sharpie**.
      *   *Awkward commitment:* You treat structural disagreement as mere noise to be smoothed away.
  *   **No:** → Go to 3.

  **3. The Action Test:** You must bet now. Is exactly one action rational?
  *   **Yes (Pick worst-case):** → **The Robust Pessimist**.
      *   *Awkward commitment:* You pay a premium to avoid ambiguity, even when expected value is unclear.
  *   **No (Multiple admissible):** → **The Permissivist**.
      *   *Awkward commitment:* You admit rationality sometimes fails to dictate a choice.
  *   **Unsure:** → Go to 4.

  **4. The Dilation Test:** You learn evidence. Your interval gets *wider*. Is this rational?
  *   **No:** → **The Confused Imprecise**.
      *   *Awkward commitment:* You want imprecision but reject the math that generates it.
  *   **Yes:** → Go to 5.

  **5. The One-Way Test:** Drug case: Sure it's not harmful, all over the place on benefit. Is this distinct from standard risk?
  *   **No:** → **The Standard Imprecisivist**.
      *   *Awkward commitment:* Your range is your state, but you still struggle to update cleanly.
  *   **Yes:** → **The Non-Additive Believer**.
      *   *Awkward commitment:* You deny probabilities must sum to 1 to preserve ignorance.

  ***

  **Flags**

  **Indistinguishable Leaves:** The **Sleepwalking Bayesian** and **Compromise Sharpie**. Both ultimately behave as sharp Bayesians; the tree only separates their excuses for lacking a number initially.

  **Empty Combination:** Answering **No** to Ellsberg (acknowledging real imprecision) but **Yes** to Averaging (collapsing imprecision). Nobody occupies this zone because rejecting the bet implies the range matters, while averaging implies it doesn't. Holding both is psychologically unstable.
