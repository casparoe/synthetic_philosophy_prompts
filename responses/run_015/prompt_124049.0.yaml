answer: |-
  # Diagnostic Instrument: The Corruption Decision Tree

  **Instructions:** Proceed through the nodes sequentially. At each node, read the case or claim and select the option that best matches your intuitive judgment. Do not worry about which theoretical "school" your answer supports; answer based on the concrete situation. Track your path (e.g., 1A, 2B, 3A) to find your diagnostic leaf at the end.

  ### The Nodes

  **Node 1 (Case 3: The Goat)**
  A village elder gives a district officer a goat in a region where refusing a gift is a grave insult. No favor is requested.
  *   **A.** This is not a violation; it is a social obligation. (Go to Node 2)
  *   **B.** This is a violation; public resources must remain distinct from private ties. (Go to Node 3)

  **Node 2 (Case 8: The Ethnic Contracts)**
  A mayor awards contracts to firms hiring from her own ethnic community, viewing this as discharging obligations of solidarity rather than self-enrichment.
  *   **A.** This is a different *logic of rule* (patronage); calling it "corruption" is a category error. (Leaf: **Neo-Patrimonial**)
  *   **B.** This is mutual aid; reciprocity is an obligation, not a deviance. (Leaf: **Particularist**)

  **Node 3 (Case 5: The Lobbying)**
  A firm lobbies successfully, fully lawfully and without payment, for a rule written to favour its own technology.
  *   **A.** If it is lawful, it is not corruption. (Leaf: **Legalist**)
  *   **B.** Lawful influence can still be corruption. (Go to Node 4)

  **Node 4 (Case 1: Speed Money)**
  A firm pays a clerk to process a permit it is legally owed, when clerks routinely delay by months otherwise.
  *   **A.** The clerk is not primarily to blame; the system creates an equilibrium where this is necessary. (Leaf: **Structural**)
  *   **B.** The clerk is an agent who has betrayed their duty. (Go to Node 5)

  **Node 5 (Case 4: Data Philanthropy)**
  A company donates a dataset to a city; the donation foreseeably improves the donor's ranking in a contract system, though no deal was made.
  *   **A.** Corruption requires an explicit *quid pro quo* (exchange). (Leaf: **Principal-Agent**)
  *   **B.** Influence without an explicit deal can be corruption. (Go to Node 6)

  **Node 6 (Case 2: The Cousin)**
  A public manager hires her cousin, who is in fact the best-qualified applicant.
  *   **A.** If the outcome is efficient (best candidate), the act is not corrupt. (Leaf: **Market-Centered**)
  *   **B.** The procedure matters regardless of the outcome. (Go to Node 7)

  **Node 7 (Case 6: The Triage)**
  A nurse moves up a patient whose family sends a basket of fruit, in a queue that is formally first-come-first-served.
  *   **A.** The wrong is breaking the formal rule of the office. (Go to Node 8)
  *   **B.** The wrong is the harm caused to the sicker patient who waits. (Go to Node 9)

  **Node 8 (New Case: The Revolving Door)**
  A regulator joins a firm they oversaw after their term ends. No deal was made while in office.
  *   **A.** The wrong is the loss of *independence*; the agent is now subject to another's will. (Leaf: **Republican**)
  *   **B.** The wrong is the misuse of the *public function* itself. (Leaf: **Public-Office-Centered**)

  **Node 9 (Case 7: The NGO Policy)**
  An international NGO requires local partners to refuse customary hospitality from village hosts.
  *   **A.** The local community's view of the practice determines if it is wrong. (Go to Node 10)
  *   **B.** External standards of welfare override local acceptance. (Go to Node 11)

  **Node 10 (New Case: Adaptive Norms)**
  If a population accepts extraction as "normal" only because they have adapted to endemic powerlessness, does that acceptance make it right?
  *   **A.** Yes; the public's perception defines the reality of the norm. (Leaf: **Social-Norms**)
  *   **B.** No; norms adapted to extraction are unreliable standards. (Leaf: **Harm-Based Universalist**)

  **Node 11 (New Case: Systemic Toll)**
  A road tax is legally enacted, revenue is known to fund private luxury, yet the road is built and functions well.
  *   **A.** Corruption is defined by harm to the specific polity's collective interest. (Leaf: **Public-Interest-Centered**)
  *   **B.** Corruption is defined by universal human welfare, regardless of polity boundaries. (Leaf: **Harm-Based Universalist**)

  *(Note: Node 11 separates those who prioritize the specific political community's interest from those who prioritize universal human welfare. If you chose 11A, you are Public-Interest. If 11B, you are Harm-Based.)*

  ---

  ### The Key: Diagnostic Leaves

  **1. Legalist**
  *   **Awkward Commitment:** Legalized bribery (e.g., campaign finance loopholes) cannot be corruption by definition.
  *   **Answer Pattern:** 3A.
  *   **Absurd Outcome:** Case 5 (Lobbying) is judged clean despite clear private capture of public rule-making.

  **2. Principal-Agent**
  *   **Awkward Commitment:** Whistleblowing can be framed as corruption (breach of loyalty to the principal/employer).
  *   **Answer Pattern:** 3B, 4B, 5A.
  *   **Absurd Outcome:** Case 4 (Data Philanthropy) is judged clean despite clear distortion of public decision-making.

  **3. Public-Office-Centered**
  *   **Awkward Commitment:** Corruption cannot exist in the private sector or informal spheres.
  *   **Answer Pattern:** 3B, 4B, 5B, 6B, 7A, 8B.
  *   **Absurd Outcome:** Case 8 (Ethnic Contracts) might be judged clean if the "office" is viewed as representing only the ethnic group.

  **4. Market-Centered**
  *   **Awkward Commitment:** An honest official who causes economic inefficiency is more "corrupt" than a bribe-taker who speeds up growth.
  *   **Answer Pattern:** 3B, 4B, 5B, 6A.
  *   **Absurd Outcome:** Case 2 (The Cousin) is judged clean even if the appearance of nepotism destroys public trust.

  **5. Public-Interest-Centered**
  *   **Awkward Commitment:** Minority rights can be sacrificed if the aggregate "public interest" is served.
  *   **Answer Pattern:** 3B, 4B, 5B, 6B, 7B, 9B, 11A.
  *   **Absurd Outcome:** Case 6 (Triage) depends on calculating aggregate harm rather than the intrinsic wrong of queue-jumping.

  **6. Harm-Based Universalist**
  *   **Awkward Commitment:** Victimless violations (e.g., filing errors with no consequence) count as corruption if they violate universal welfare standards.
  *   **Answer Pattern:** 3B, 4B, 5B, 6B, 7B, 9B, 11B.
  *   **Absurd Outcome:** Case 3 (The Goat) is judged corrupt if it creates inequality, even if no participant feels harmed.

  **7. Social-Norms / Perceptual**
  *   **Awkward Commitment:** If a society collectively accepts theft, it ceases to be corruption.
  *   **Answer Pattern:** 3B, 4B, 5B, 6B, 7B, 9A, 10A.
  *   **Absurd Outcome:** Case 7 (NGO Policy) is judged as imperialist imposition rather than ethical enforcement.

  **8. Particularist / Gift-Economy**
  *   **Awkward Commitment:** Universal human rights are secondary to local obligations of reciprocity.
  *   **Answer Pattern:** 1A, 2B.
  *   **Absurd Outcome:** Case 1 (Speed Money) is judged as a legitimate obligation to the clerk rather than a violation.

  **9. Neo-Patrimonial**
  *   **Awkward Commitment:** Applying "corruption" labels to patronage states is a Western category error.
  *   **Answer Pattern:** 1A, 2A.
  *   **Absurd Outcome:** Case 5 (Lobbying) is viewed as normal politics rather than a deviation from bureaucratic rationality.

  **10. Republican**
  *   **Awkward Commitment:** Unexercised power (domination) is corruption, even if no harm occurs.
  *   **Answer Pattern:** 3B, 4B, 5B, 6B, 7A, 8A.
  *   **Absurd Outcome:** Case 2 (The Cousin) is judged corrupt because the hiring creates dependence, even if the cousin is qualified.

  **11. Structural / Collective-Action**
  *   **Awkward Commitment:** Punishing individual corrupt actors is unjust when they are trapped in a corrupt equilibrium.
  *   **Answer Pattern:** 3B, 4A.
  *   **Absurd Outcome:** Case 6 (Triage Nurse) is not to blame; the queue system itself is the corrupt agent.

  ---

  ### Unoccupied and Unseparated Cells

  **Unoccupied Combinations**
  1.  **"Illegal but Public Good" (Legalist + Consequentialist):** A position that insists corruption must be illegal (Legalist) but also insists that illegal acts serving the public good are not corrupt (Consequentialist).
      *   *Status:* **Incoherent.** If the act is illegal, the Legalist must call it corruption; if it serves the public good, the Consequentialist must call it clean. They cannot occupy the same cell.
  2.  **"Systemic Blame but Retributive Punishment" (Structural + Retributive):** A position that claims corruption is a systemic equilibrium beyond individual control (Structural) but argues that individual clerks should still be jailed (Retributive).
      *   *Status:* **Unattractive.** While logically possible, no defender argues that individuals are blameless *and* deserving of punishment simultaneously.

  **Unseparated Pairs**
  1.  **Public-Office-Centered vs. Republican:**
      *   *Coincide on:* Case 8 (Ethnic Contracts). Both view partiality as a violation of public duty/independence.
      *   *Extra Question Needed:* "Is the wrong the *misuse of the function* (Office) or the *subjection to another's will* (Republican)?" (Hard for non-specialists to distinguish in practice).
  2.  **Public-Interest-Centered vs. Harm-Based Universalist:**
      *   *Coincide on:* Case 6 (Triage). Both view the harm to the patient as the core wrong.
      *   *Extra Question Needed:* "Does the harm matter because it hurts *our* citizens (Public Interest) or because it hurts *humans* (Universalist)?"
  3.  **Social-Norms vs. Particularist:**
      *   *Coincide on:* Case 3 (The Goat). Both validate the gift based on local custom.
      *   *Extra Question Needed:* "Is the gift right because the *community accepts it* (Norms) or because *reciprocity is a moral duty* (Particularist)?"

  ---

  ### Scoring Note

  **Profile vs. Leaf:**
  This instrument should return a **profile**, not a single leaf. Well-read non-specialists (and specialists) often hold inconsistent views across different domains (e.g., universalist on lobbying, particularist on hospitality). A single leaf forces a false coherence.

  **Expected Inconsistencies:**
  Readers should expect to land in different leaves for **Case 5 (Lobbying)** and **Case 3 (Goat)**.
  *   It is coherent to reach a **Universalist** verdict on Lobbying (harm to public interest) while reaching a **Particularist** verdict on the Goat (obligation of hospitality).
  *   This inconsistency reveals the tension between *imported institutional standards* and *lived social norms*. If the tree forces you into one leaf for both, check Node 9 and Node 10; your path may have oversimplified your view on whether norms can be "wrong" even if locally accepted.
