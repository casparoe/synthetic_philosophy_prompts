answer: |-
  Here is the mapping pass.

  **The Drift Programme (Wegener)**
  *   **Hard Core:** Continents move horizontally relative to one another (continental displacement).
  *   **Protective Belt:** Coastline jigsaw fits; paleontological identities across oceans; paleoclimatic evidence (glaciers in tropics); mechanism (tidal/pole-fleeing forces); rigid continents moving through oceanic crust.
  *   **Negative Heuristic:** Do not abandon horizontal motion to save the mechanism.

  **The Fixist Programme (Jeffreys, Willis, etc.)**
  *   **Hard Core:** Continents are fixed relative to one another (vertical motion only; permanentism).
  *   **Protective Belt:** Land bridges (now sunk); geosynclines; Earth contraction due to cooling; viscosity of mantle too high for drift.
  *   **Negative Heuristic:** Do not admit horizontal displacement to save the fossil distribution.

  **The 1926 Verdict**
  By Lakatos's criteria, the story is not heroic; it is tragic on both sides. In 1926 (post-AAPE symposium), the Drift programme was **theoretically degenerating**. It had explained known facts (fits, fossils) but failed to predict novel facts. Crucially, its protective belt (the mechanism) was falsified by physics (Jeffreys showed tidal forces were insufficient). Wegener's response was to tweak the mechanism without new evidence, a classic degenerating move.

  The Fixist programme was **empirically degenerating** but theoretically stable. To save the hard core, they posited land bridges that sank without trace—an ad hoc adjustment lacking independent evidence. However, because their physics was sound, they appeared methodologically superior. Lakatos would not declare a winner in 1926. Both programmes were degenerating in different dimensions. This kills the "stubborn establishment" trope: the fixists were rationally defending a programme that hadn't yet been falsified by novel facts, against a rival that violated established physics.

  **Rational Reconstruction vs. The Novelist's Alibi**
  Your intuition about rational reconstruction is half-right. Lakatos prioritizes reconstruction over actual history to evaluate scientific *rationality*, not to justify fiction. He argues we should reconstruct history to show why scientists *ought* to have acted as they did, even if their actual psychological motives were messy.

  This does not give you an alibi to tidy the sequence for drama; it constrains you to tidy the *reasoning*. If the rational reconstruction shows the fixists were methodologically reasonable (defending a hard core against a mechanism-less rival), you are committed to writing them as reasonable people. If you portray them as dogmatic obstacles, you are writing bad history *and* bad Lakatosian philosophy. The reconstruction licenses you to omit the petty personal feuds, but it forbids you from omitting the logical strength of the fixist position. You must make their resistance legible as rational theory-defense, not stubbornness. The "tidying" must reveal the logic, not hide it behind caricature.

  **Where Lakatos Breaks Down**
  Two silences here matter for your novel.

  First, **Novel Facts.** Lakatos demands a programme predict novel facts to be progressive. In 1926, Drift mostly explained old facts (coastlines, fossils). It didn't predict new data until paleomagnetism in the 1950s. Lakatos struggles to explain why Drift survived the "degenerating" phase without new predictions. Sometimes programmes survive on aesthetic promise or heuristic fertility alone. Your novel can explore this: why did some scientists stick with drift despite the lack of novel facts? Lakatos has no good answer for the psychology of hope.

  Second, **Instrumentation.** Lakatos treats the protective belt as auxiliary *hypotheses*. In geology, the belt was often *technology* (seismographs, magnetometers, sonar). The shift to plate tectonics wasn't just a theoretical swap; it was an instrumental revolution. Lakatos says little about how funding expeditions or building sensors counts as "theoretical progress." If your novel focuses on the ships and the magnets, you are entering a gap in his framework. He treats instruments as theory-laden tools, not as independent drivers of change.

  **Shaky Geology Flag:** I am treating "Earth contraction" as central to Fixism. Some historians argue contraction was already waning by 1920, replaced by permanentism without specific mechanism. Don't hang a plot point solely on contraction being the only fixist option.

  **Summary:** Use Lakatos to vindicate the fixists' rationality, not to condemn them. Use his silence on instrumentation to justify focusing on the tools. Do not use reconstruction to simplify the morality; use it to complicate the logic.
