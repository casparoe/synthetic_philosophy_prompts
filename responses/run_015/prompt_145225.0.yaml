answer: |-
  **1. Exam Question**

  **Module:** PHI3042 Epistemology of Scientific Modelling
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 1,200 words

  **Question 1**

  In *The Methodology of Positive Economics*, Milton Friedman argues that the validity of a hypothesis depends solely on the accuracy of its predictions, not the descriptive realism of its assumptions. This position, often termed the 'F-twist', suggests that unrealistic assumptions are methodologically harmless if the model yields successful predictions.

  However, this defence presupposes that predictions can be evaluated independently of the model's internal structure.

  (a) Briefly reconstruct Friedman's argument for why assumption-realism is unnecessary, clarifying the distinction he draws between the assumptions of a model and its empirical implications. (5 marks)

  (b) Consider domains such as macroeconomic policy forecasting or climate-intervention modelling. In these contexts, the 'prediction' is often a counterfactual policy effect (e.g., 'What would inflation be if interest rates were raised?') which cannot be directly observed and must be estimated by the model itself. Analyse whether the F-twist can survive in this context. Specifically, assess whether relying on the model to generate the counterfactual target creates a circularity that undermines the separation between assumption-realism and predictive-testing. (10 marks)

  (c) Conclude by evaluating whether this circularity implies that unrealistic assumptions become critical liabilities in policy modelling, or whether Friedman's instrumentalism can be modified to accommodate non-observable targets. In your response, distinguish carefully between Friedman's explicit claims and contested interpretations of his broader philosophical commitments. (5 marks)

  ***

  **2. Model Answer**

  Friedman's central thesis posits that economic theories should be judged exclusively by their predictive accuracy rather than the descriptive truth of their premises. He argues that assumptions are merely convenient simplifications required to isolate key forces from the complexity of reality. For Friedman, a model functions as an engine for generating predictions; if the engine produces accurate forecasts of observable phenomena, the internal mechanics (the assumptions) need not mirror reality. The crucial logical move here is the separation of the model's structure from an independent empirical metric. Predictive success serves as an external check that validates the theory regardless of how 'unrealistic' the starting points appear.

  However, this separation collapses in domains where the predictive target is a counterfactual policy effect. In macroeconomic policy or climate intervention, the object of prediction is not an event that will occur naturally and can be waited for, but a hypothetical outcome contingent on an intervention. We cannot observe what would happen if interest rates were raised without actually raising them, yet policy decisions require knowing this outcome beforehand. Consequently, the 'prediction' is not an independent observable fact but a simulation output generated by the model's own structure.

  This generates a significant circularity problem for the F-twist. Friedman's defence relies on the ability to test predictions against independent data. If the data regarding the counterfactual is produced by the model itself, there is no independent metric to validate the model. The model is effectively validating its own unrealistic assumptions by producing outputs that are consistent with its own internal logic. Without an independent observational check, the claim that 'predictions matter more than assumptions' loses its force, because the predictions are no longer independent of the assumptions. The unrealistic microfoundations determine the counterfactual outcome, and there is no external reality against which to test that outcome prior to implementation.

  Does this render unrealistic assumptions critical liabilities? Not necessarily, but it shifts the burden of proof. It suggests that in policy contexts, the instrumentalist defence is insufficient because the instrument cannot be calibrated against independent data. Critics argue this requires a shift towards structural realism, where assumptions must be plausible to trust counterfactuals. However, one must be careful not to attribute a strict instrumentalist ontology to Friedman as a settled fact; scholars debate whether he was denying the reality of assumptions or merely their methodological priority. Nevertheless, logically, if the prediction is model-dependent, the F-twist cannot shield unrealistic assumptions from scrutiny. The methodology must therefore demand greater realism in assumptions when independent testing is impossible, not because realism is intrinsically valuable, but because it is the only remaining warrant for trusting the counterfactual simulation.

  ***

  **3. Marking Scheme**

  **Total Marks: 20**

  **Criteria 1: Exposition of Friedman's Core Claim (5 Marks)**
  *   **A (4-5 marks):** Clearly articulates the separation between assumptions and predictions. Explains that predictive success is the sole validity criterion. Notes that assumptions are viewed as simplifications.
  *   **B (2-3 marks):** Summarises the F-twist correctly but fails to explicitly highlight the requirement for *independent* testing of predictions.
  *   **C (0-1 marks):** Vague summary; confuses assumptions with conclusions.

  **Criteria 2: Analysis of the Counterfactual Problem (5 Marks)**
  *   **A (4-5 marks):** Identifies that policy predictions are non-observable counterfactuals. Explains that the model generates the 'data' for the prediction.
  *   **B (2-3 marks):** Mentions policy modelling but treats predictions as if they were standard observable forecasts (e.g., next year's GDP) rather than counterfactuals.
  *   **C (0-1 marks):** Fails to engage with the specific niche framing of counterfactuals.

  **Criteria 3: Evaluation of Circularity and Independence (5 Marks)**
  *   **A (4-5 marks):** Explicitly argues that the lack of independent testing collapses the separation Friedman requires. Identifies the circularity: the model validates itself.
  *   **B (2-3 marks):** Notes a problem exists but describes it generally as 'uncertainty' rather than a structural circularity regarding validation.
  *   **C (0-1 marks):** Asserts Friedman is simply 'wrong' without analysing the logical structure of the testing condition.

  **Criteria 4: Epistemic Nuance and Contested Interpretations (5 Marks)**
  *   **A (4-5 marks):** Distinguishes between Friedman's explicit text and debated interpretations (e.g., strict instrumentalism). Avoids presenting contested philosophical readings as consensus fact.
  *   **B (2-3 marks):** Treats Friedman's instrumentalism as an undisputed fact or fails to distinguish between logical critique and biographical interpretation.
  *   **C (0-1 marks):** Makes dogmatic claims about what Friedman 'really meant' without qualification.

  **Typical Mistakes Costing Marks:**
  *   **Verbatim Quotation:** Using quotes without exact source verification (penalise 1 mark if inaccurate).
  *   **American Spelling:** Using 'z' instead of 's' in 'realise'/ 'organisation' etc. (penalise 1 mark globally for consistency).
  *   **Summary Only:** Spending too much word count on part (a) and neglecting the critical analysis in (b) and (c).
  *   **Consensus Error:** Stating 'Friedman was an instrumentalist' as an uncontested fact rather than a common interpretation.
