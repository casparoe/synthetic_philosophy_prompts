  Regarding the Director's philosophical justification: Berkeley's case for credit over coin does not depend on his immaterialism. His immaterialism claims objects exist only when perceived; his monetary theory claims money exists only when accepted. These are analogous but logically distinct. One can believe matter exists independently of perception while still agreeing money depends on social perception. Therefore, the monetary argument is independent of the metaphysics. A thoroughgoing materialist could sign on to Berkeley's bank plan without accepting his theology. Consequently, invoking Berkeley is decoration; the decay rule is the actual engine. If any token anybody will accept is money, the metaphysics are irrelevant to the policy's success.

  Does the argument survive scaling down from a kingdom to a spreadsheet? No. Berkeley proposed a national bank backed by sovereign taxing power and legal tender laws. Sovereign power solves the coordination problem Berkeley addressed because a state can force tax payments in paper. We operate a voluntary network of 200 members with no coercive power. We cannot force the Bakery to pay taxes in hours. Without legal tender status, our currency is purely voluntary, making the reserve essential for confidence. A kingdom can mandate acceptance; we cannot. If confidence falters, members exit to dollars instantly. The 15% reserve is the insurance policy required when you lack sovereign backing.

  That 20% offer is a shadow exchange rate. It is not a discount; it is a market correction. By valuing hours at 20% below dollar prices, the Plumbers are pricing our currency at $0.80 on the dollar. If we scrap the reserve while the market values us at a discount, we confirm that devaluation.

  We should test the velocity benefits of decay without removing the liquidity safety net. If the reserve remains untouched after three months, we can revisit elimination. But removing the reserve now, while external confidence wavers, confuses Berkeley's theory of wealth with our practical need for solvency. We are not a nation; we are a club. Clubs require trust funds; nations require only faith.
