  # Decision Tree: The Legitimacy of Commemorating Defeat

  **Guiding Question:** Under what conditions can a collective treat a historical defeat as a legitimate, identity-forming narrative rather than as a pernicious or obsolete myth?

  **Diagnostic Cases:**
  *   **A:** Post–Civil War American "Lost Cause" (Confederate defeat).
  *   **B:** Masada Siege (Jewish Zealot suicide/stand).
  *   **C:** Kosovo Field 1389 (Serbian defeat by Ottomans).
  *   **D:** Dunkirk 1940 (British evacuation/strategic defeat).

  ---

  ## The Flowchart

  **Node 1: Moral Assessment of the Cause**
  *Question:* Does the political cause for which the group fought violate fundamental principles of justice (e.g., defense of slavery, unprovoked aggression) as judged by contemporary or universal standards?
  *   **YES (Unjust):** Proceed to Node 2A. (e.g., Case A: Confederacy; Case C: *Debated*, often viewed as expansionist or ethno-nationalist by critics).
  *   **NO (Just/Neutral):** Proceed to Node 2B. (e.g., Case B: Survival/Identity; Case D: Defense against invasion).

  **Node 2A: Virtue Dependency (If Unjust)**
  *Question:* Is the moral value of the participants' sacrifice and courage inseparable from the justice of the political goal they served?
  *   **YES (Inseparable):** Proceed to Node 3A. (Bravery in service of evil is tainted).
  *   **NO (Separable):** Proceed to Node 3B. (Soldierly virtue exists independently of the regime's morality).

  **Node 2B: Virtue Dependency (If Just/Neutral)**
  *Question:* Is the moral value of the participants' sacrifice and courage contingent upon the political goal, or is it an independent trait?
  *   **YES (Inseparable):** Proceed to Node 3C. (Virtue is tied to the righteousness of the defense).
  *   **NO (Separable):** Proceed to Node 3D. (Virtue is a standalone human excellence, regardless of strategic necessity).

  **Node 3 (All Paths): Narrative Priority**
  *Question:* When historical facts complicate the story (e.g., atrocities, blunders, suicides vs. murders), should the narrative prioritize present social cohesion over full disclosure?
  *   **YES (Function > Truth):** Proceed to Leaf.
  *   **NO (Truth > Function):** Proceed to Leaf.

  ---

  ## The Eight Leaves

  ### Branch 1: Unjust Cause + Inseparable Virtue
  *   **Leaf 1 (Function > Truth):** **Unnamed Position.**
      *   *Diagnosis:* **Incoherent.** This position advocates promoting social cohesion through a narrative about an unjust cause, while simultaneously admitting that the virtue displayed is tainted by that injustice; it offers no moral reason for the community to cohere around the myth.
  *   **Leaf 2 (Truth > Function):** **Moral-Exclusionist View.**
      *   *Core Commitment:* A cause that violates fundamental justice forfeits all commemorative standing; historical truth must be told to dismantle the myth, regardless of the pain caused to group identity.

  ### Branch 2: Unjust Cause + Separable Virtue
  *   **Leaf 3 (Function > Truth):** **Unnamed Position.**
      *   *Diagnosis:* **Morally Repugnant.** This view suggests constructing a "noble lie" that honors the bravery of actors serving an unjust cause to build solidarity, effectively sanitizing injustice for the sake of utility.
  *   **Leaf 4 (Truth > Function):** **Civic-Republican Separation View.**
      *   *Core Commitment:* Individual martial virtue (courage, loyalty, sacrifice) can be ethically extracted from an unjust political cause; commemoration is legitimate only if it honors the former while honestly acknowledging the latter.

  ### Branch 3: Just/Neutral Cause + Inseparable Virtue
  *   **Leaf 5 (Function > Truth):** **Unnamed Position.**
      *   *Diagnosis:* **Unattractive.** This position implies that even a just cause requires mythological embellishment to sustain solidarity, suggesting an insecurity in the actual historical merits of the group's struggle.
  *   **Leaf 6 (Truth > Function):** **Critical-Historicist View.**
      *   *Core Commitment:* Legitimacy requires substantial historical accuracy; myth-making is only permissible when it does not suppress documented injustice or complexity, even if the cause was fundamentally just.

  ### Branch 4: Just/Neutral Cause + Separable Virtue
  *   **Leaf 7 (Function > Truth):** **Communitarian-Functional View.**
      *   *Core Commitment:* A myth is legitimate if it presently sustains solidarity and is not actively harmful to others; historical accuracy is subordinate to the narrative's capacity to maintain the community's ethical fabric.
  *   **Leaf 8 (Truth > Function):** **Unnamed Position.**
      *   *Diagnosis:* **Merely Unexplored.** A "Strict Veridicalist" stance where the cause is just and virtue is independent, yet myth-making is rejected on principle; coherent, but lacks a distinct philosophical advocate compared to the Critical-Historicist.

  ---

  ## Analysis of Logical Space

  ### Unoccupied Branches
  The four **Unnamed Leaves** (1, 3, 5, 8) represent logical spaces largely empty of serious philosophical defenders.
  *   **Leaf 1 (Unjust/Inseparable/Function)** is empty due to **logical contradiction**: one cannot argue for cohesion based on a value system one admits is morally tainted and inseparable from the action.
  *   **Leaf 3 (Unjust/Separable/Function)** is empty due to **moral repugnance**: while politically common (e.g., neo-Confederate propaganda), it lacks normative philosophical defense in liberal theory because it instrumentalizes moral vice for social utility.
  *   **Leaf 5 (Just/Inseparable/Function)** is empty due to **theoretical weakness**: few theorists argue that a *just* cause requires falsehoods to sustain virtue, as this undermines the claim of justice.
  *   **Leaf 8 (Just/Separable/Truth)** is empty due to **lack of historical advocate**: while coherent, it collapses into the Critical-Historicist view (Leaf 6) in practice, as both prioritize truth over function.

  ### Overlap and Indistinguishability
  **Leaf 4 (Civic-Republican)** and **Leaf 6 (Critical-Historicist)** share a commitment to **Truth > Function**. The tree separates them based on **Node 1 (Moral Assessment of the Cause)**.
  *   **Overlap Risk:** If the moral status of the cause is contested (e.g., the Kosovo Field narrative is "Just" to Serbian nationalists but "Unjust" to liberal cosmopolitans), a Civic-Republican and a Critical-Historicist may arrive at the same practical conclusion (preserve the narrative but tell the truth) or opposite ones, depending entirely on the external moral judgment of the cause rather than their internal logic regarding memory. The tree cannot resolve the disagreement over Node 1; it only maps the consequences of that judgment.
