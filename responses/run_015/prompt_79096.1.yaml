      *   *Refining the "Value to Others" point:* The user suspects the film is about value to others Parfit sets aside. Parfit doesn't set it aside, but the Nonidentity Problem specifically arises when we can't say we harmed the specific people. In the film, we *can* say Harry was harmed by George's absence. So the film is a case where standard morality works. The teaching point is: "Here is why we think morality works. Now here is Parfit showing where that logic breaks."

      *   *Let's write.*

