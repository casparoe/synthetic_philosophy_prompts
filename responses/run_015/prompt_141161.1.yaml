      *   **Is it substantive?** Yes, regarding the metaphysics of value. Does value supervene on feeling or on attitude/function?
      *   **Is it two questions?** Yes. One is metaphysical/phenomenological (what *is* pleasure?), the other is axiological/measurement-theoretic (how do we *measure* welfare?).
      *   **Best Fit:** It is a **category mistake regarding the role of theory**. The objectors treat hedonism as a *phenomenological taxonomy*. The defenders treat it as an *axiological metric*.

  5.  **Drafting the Response - Section by Section:**

