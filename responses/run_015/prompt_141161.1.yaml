          1.  *Feeling Theory:* There *is* a common feel (hedonic tone). (Often criticized as introspectively dubious).
          2.  *Attitudinal Theory:* Pleasure is taking an attitude of enjoyment toward a state of affairs. (Feldman).
          3.  *Desire Theory:* Pleasure is getting what you want. (Often distinguished from hedonism, but related).
      *   **The User's Insight:** The deadlock arises because one side looks for *phenomenal unity* (qualitative identity) while the other needs *functional unity* (commensurability for aggregation).

