answer: |-
  No worries about the typo—phone keyboards are the worst. Also, three hours is a serious debate session; you guys clearly care about this stuff.

  Here's the breakdown on what's actually happening with that museum practice and why your friend's economic framing of history is probably too clean for the messy reality.

  ### 1. What Theory of History Does the Museum Practice Presuppose?

  That specific move—keeping the 1920s exhibit intact but slapping a warning label on it—isn't pure presentism, and it isn't pure historicism. It's actually a hybrid approach often called **reflexive museology** or **critical heritage studies**.

  Here's the theoretical heavy lifting it's doing:
  *   **The Exhibit as Artifact:** It treats the 1920s display not just as a window into the colonial era, but as an artifact of the 1920s itself. It says, "This object tells you about the colonized people, but it *also* tells you about the racism of the curators who built this in 1920."
  *   **Separation of Understanding and Endorsement:** It presupposes that we can understand a past worldview without endorsing it. This rejects the idea that displaying something equals validating it.
  *   **Layered Truth:** It assumes historical knowledge is stratified. There's the "then" truth (what people believed in 1920) and the "now" truth (our ethical evaluation of those beliefs).

  So, it's not assuming we can escape our own time (we can't); it's assuming we can be *transparent* about our time. It admits, "We are looking at this through 2024 eyes, and here is exactly how those eyes differ from 1920 eyes."

  ### 2. Moral Progress vs. Internal Contradiction

  You asked if this assumes moral progress is linear and real. The short answer is: it assumes **moral fallibilism**, not necessarily linear progress.

  It operates on the premise that societies can be collectively wrong about ethics (e.g., slavery, colonialism) and that later societies can identify those errors. That doesn't mean morality is a straight line up; it just means we have corrected specific, identifiable harms.

  Is there an internal contradiction in keeping the display for "shock value"?
  *   **No, if the goal is evidence:** If the museum's goal is to show *how pervasive* racist ideology was, the unedited display is primary evidence. Sanitizing it would erase the history of the prejudice itself.
  *   **Yes, if the goal is neutrality:** The contradiction only exists if you believe a museum can be neutral. By keeping the display, they risk triggering the very harm they're condemning. But the contextual panel is the bridge meant to resolve that tension. It turns the "shock" into a pedagogical tool rather than an affirmation.

  So, it's not logically contradictory, but it is **ethically precarious**. It walks a tightrope between preserving evidence and causing harm.

  ### 3. The "Safe Pareto Improvement" Framing

  Your friend's idea that historiographical updates are "safe Pareto improvements" (where everyone gains or stays the same, and no one loses) is a really cool economic metaphor, but it falls apart when applied to history and museums.

  In economics, a Pareto improvement means at least one person is better off and **no one is worse off**. In history, that almost never happens.

  *   **Epistemic Loss vs. Gain:** You could argue that everyone is *epistemically* better off because everyone has more accurate information. But your friend specified "epistemically worse off." Even there, it's shaky. If a dominant group's identity is built on a heroic national myth, correcting that myth to include atrocities makes them "worse off" in terms of **narrative coherence**. Their story becomes harder to tell, their heroes become flawed, and their sense of stability shakes. That is an epistemic cost, even if it's a moral gain.
  *   **Narrative Authority:** This is the big one. History isn't just about facts; it's about who gets to decide what counts as a fact. When a museum adds that panel, marginalized groups gain narrative authority (their suffering is acknowledged), but the group that previously controlled the narrative loses authority. That is a zero-sum shift in power.
  *   **The Cover-Up:** Using the "Pareto" framing definitely covers up the power struggle. It makes history sound like a cooperative puzzle where we all just add pieces until the picture is clearer. In reality, revising history is often adversarial. It involves taking authority away from people who liked having it.

  ### The Verdict

  Your friend is right that judging the past by today's morals can be arrogant if it stops us from understanding *why* people thought that way. But you're right that pretending we don't have modern morals is impossible and dishonest.

  The museum practice you described is the best practical compromise: it admits we are presentists, but it forces us to be **honest presentists**.

  As for the Pareto thing, tell your friend that history isn't a market efficiency problem. It's a contest over memory. When the narrative shifts, someone always loses the microphone, even if the truth gets louder.
