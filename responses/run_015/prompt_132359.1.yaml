      *   Address the "fixed object" vs. "heuristic convenience" point.
      *   Ensure the distinction between "causal explanation" and "collective narrative" is central.

  9.  **Final Review against constraints:**
      *   No bibliography? Check.
      *   No survey of theories? Check.
      *   Focus on analysis of disagreement? Check.

  *(Self-Correction during drafting)*: I need to be careful not to simply dismiss pseudohistory as "wrong." The prompt asks for an analysis of the *disagreement*. I need to explain *why* the pseudohistorian feels their view is valid despite empirical lack. It's about the *weight* given to anomalies. To the historian, an anomaly is a problem to solve. To the pseudohistorian, an anomaly is the key to the lock.

  *(Final Polish)*: Ensure the conclusion offers a clear "what counts as progress" statement. The progress lies in stopping the attempt to win the historical argument and starting the sociological/philosophical analysis of *why* the alternative narrative is desired.

