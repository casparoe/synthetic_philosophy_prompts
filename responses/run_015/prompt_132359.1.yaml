answer: |-
  The stalemate between professional historiography and pseudohistorical frameworks is not merely a conflict over facts, but a collision of distinct epistemic games played with the same pieces. To diagnose this impasse, we must examine what constitutes *data* and *defeat* for each side, as these operational definitions reveal that the disagreement is neither purely substantive nor purely verbal, but rather a **functional category error**.

  ### Diagnosis: Divergent Ontologies of Data and Defeat

  The deadlock persists because the two sides operate with incompatible definitions of what an artifact *is* and what constitutes a successful explanation.

  **1. The Ontology of Data: Trace vs. Signal**
  For the professional historian, data is a **contextualized trace**. An artifact (a text, a shard, a carbon date) derives its evidentiary weight from its provenance and its coherence within a dense web of independent corroborations (stratigraphy, linguistics, dendrochronology). An inconsistency is treated as "noise" to be smoothed out because the assumption is that the physical past was singular and consistent.
  For the pseudohistorian, data is a **decontextualized signal**. An artifact is valuable precisely insofar as it disrupts the established web. A carbon date that conflicts with the timeline is not an error in the pseudohistorical model; it is evidence of the timeline's falsity. Where the historian sees a constraint, the pseudohistorian sees a clue. Consequently, they are not looking at the same object: the historian sees a potshard bound by its stratum; the pseudohistorian sees a stylistic anomaly transcending its stratum.

  **2. The Criteria of Defeat: Falsification vs. Immunization**
  The disagreement over falsification is hidden but fundamental. Professional history relies on **inference to the best explanation**, where a theory is defeated if it requires more ad hoc assumptions than the consensus view to account for the total evidence. Defeat is possible because the historian accepts the authority of the "archive" as a limiting constraint.
  Pseudohistory operates on a logic of **immunization**. Because the core premise often involves a conspiracy, a cataclysm, or lost knowledge, any lack of evidence is interpreted as evidence of the cover-up or the destruction. Therefore, there is no state of affairs that counts as defeat. If the prompt asks if there is a hidden disagreement about standards of falsification: yes. The historian views the inability to replicate or verify as a failure of the theory; the pseudohistorian views the inability to verify as a confirmation of the theory's esoteric nature.

  ### Hypothesis: The Structure of the Disagreement

  The disagreement is not substantive in the sense that both sides are arguing about the same object (the past-as-it-was), nor is it merely verbal (using the same words for different concepts). It is a **functional category error**.

  Both sides use the heading "historical truth," but they are answering different questions:
  *   **Historians** are asking: *"What is the most probable causal reconstruction of past events based on physical constraints?"* (Archival Ontology)
  *   **Pseudohistorians** are asking: *"What narrative provides the most coherent meaning or identity for the present, utilizing the past as a symbolic reservoir?"* (Narrative Coherence)

  The pseudohistorical endeavor is not a failed attempt at history; it is a successful attempt at **myth-making** that has misidentified its own genre. When critics argue that pseudohistory fails evidentiary standards, they are correct within the framework of Archival Ontology. However, this refutation fails to land because the pseudohistorian is not primarily seeking archival accuracy; they are seeking **narrative resonance**. The "anomalies" they cherish are not scientific data points but narrative hooks that allow for a story of hidden grandeur, suppressed knowledge, or cyclical time.

  Therefore, the stalemate is irreducible *as long as the debate remains within the epistemology of history*. The pseudohistorian cannot accept the historian's criteria without abandoning the psychological and sociological function their theory serves. The historian cannot accept the pseudohistorian's criteria without abandoning the methodological naturalism required for disciplinary integrity.

  ### Path to Progress: Reclassification rather than Refutation

  Given this diagnosis, empirical refutation will never resolve the stalemate because the disagreement is not about the empirical content but the **purpose of the inquiry**. Progress requires a conceptual shift that separates the competing claims into their proper domains.

  **1. Conceptual Distinction: Archival Ontology vs. Mythic Validity**
  We must distinguish between **Archival Ontology** (claims about the physical sequence of events, subject to falsification by physical trace) and **Mythic Validity** (claims about the meaning, structure, or moral ordering of time, subject to criteria of coherence and resonance).
  *   Fomenko's New Chronology fails as Archival Ontology (it contradicts physical data).
  *   It may succeed as Mythic Validity (it offers a narrative of Western hegemony being a recent construct, which resonates with specific geopolitical identities).
  Progress occurs when we stop asking "Is this history?" and start asking "Is this mythology claiming to be history?"

  **2. Shift in the Question**
  The question must shift from *"Which chronology is true?"* to *"What work is this chronology doing?"*
  If the dispute is treated as a scientific disagreement, the pseudohistorian wins by default because their theory is unfalsifiable. If the dispute is treated as a sociological phenomenon, the historian wins by demonstrating that the pseudohistorical model explains the *present desires* of its adherents better than it explains the *past reality* of the archive.

  **3. Conclusion on Irreducibility**
  The impasse is irreducible only if we insist that there is a single category called "History" that must satisfy both the demand for physical accuracy and the demand for existential meaning. If we accept that these are distinct human needs served by distinct disciplines (history vs. myth/literature/ideology), the stalemate dissolves. The pseudohistorian is not a bad historian; they are an unacknowledged mythographer.

  Therefore, progress is not achieved by producing more carbon dates, but by **reclassifying the pseudohistorical claim**. We must argue that while the past is a fixed object recoverable through method (Archival Ontology), the *use* of the past is often a construction of collective narrative (Narrative Coherence). The disagreement persists because pseudohistory attempts to validate the latter through the authority of the former. Resolving the stalemate requires stripping pseudohistory of its claim to archival authority, not by refuting its facts, but by exposing its function.
