      *   The risks seem significant, particularly regarding the famine case and the kiosk's framing of causality. The education staff's focus group data is strong evidence of misinterpretation. The philosophical objection about the kiosk is valid but maybe less critical than the political/ethical implication of the famine room.
      *   *Decision:* Approve with Conditions (specifically Structural). Sending it back entirely might stall the project for years (15 years since last gallery), but approving as proposed risks reputational harm and misleading narratives.
      *   *Refinement:* Actually, the famine case issue is quite severe ("scientific-looking way of not talking about the administration"). If the structure fundamentally obscures colonial responsibility in a famine case, cosmetic changes might not fix it. However, the prompt asks for concrete changes she could make. A "Send Back for Redesign" might be too blunt if tweaks can save it. But the education staff says visitors *overwhelmingly* read it as an excuse. That suggests a structural flaw in the "non-human protagonist" conceit.
      *   *Better Decision:* Approve with Structural Conditions. If the conditions are too hard, it effectively becomes a redesign, but it keeps the momentum. Let's aim for "Approve with Structural Conditions" because it allows the vote to pass while mandating fixes.
