answer: |-
  You are absolutely right to smell a rat in his analogy. Your intuition is sharper than you give it credit for: he is treating moral uncertainty as if it were air resistance, when it is actually more like the tensile strength of the steel.

  Here is the audit of his analogy, the naming of your distinction, and the counter-move that should settle it over a pint.

  ### 1. The Audit: Mapping the Analogy

  Your brother-in-law is mapping ethics onto classical mechanics. Here is how his correspondence table looks, and where the welds start to crack.

  | **Structural Engineering** | **The Ticking Time Bomb (TTB)** | **The Problem** |
  | :--- | :--- | :--- |
  | **The Engineer** | The Moral Philosopher / Legislator | Both design the rules. |
  | **The Mechanism** | The Moral Principle (e.g., "Minimise deaths") | Supposed to be universal. |
  | **The Frictionless Plane** | The TTB Scenario (Perfect certainty, imminent threat) | Intended to isolate the variable. |
  | **Friction / Air Resistance** | Uncertainty, fog of war, bureaucratic delay | External noise. |
  | **The Load** | The Threat (The Bomb) | The pressure on the system. |
  | **The Material** | The Human Agent / The State Institution | The thing bearing the stress. |

  **The Critical Disanalogy:**
  In engineering, a frictionless plane removes *external* resistance to test the *internal* logic of the forces. Gravity still works; mass still exists.
  In the TTB, the stipulations (we *know* he has the info, we *know* the bomb is real) do not just remove resistance; they remove the **moral agency**.

  ### 2. Naming Your Distinction

  You asked what to call the difference between stripping away interference and stripping away the load. In philosophy, this is often discussed as the difference between **Idealisation** and **Abstraction**, but that's too dry for the kitchen table.

  Call it **"Simplifying Assumptions vs. Constitutive Conditions"**.

  *   **Simplifying Assumption (Friction):** You assume away wind to calculate the load on a beam. The beam is still a beam. The wind is external.
  *   **Constitutive Condition (Certainty):** You assume away the possibility of error. But moral choice *is* the act of deciding under uncertainty. If you remove the risk of being wrong, you haven't simplified the moral choice; you've deleted it. You are no longer testing a moral principle; you are testing a arithmetic sum.

  Tell him: *"You haven't built a frictionless plane; you've removed gravity. Of course the bridge stands if nothing is pulling it down."*

  ### 3. Where the Analogy Bites (a) and (b)

  Here is how you dismantle his two conclusions using his own trade.

  **Conclusion (a): Torture is permissible in the ideal case.**
  *   **The Bite:** In engineering, if a design only works in a vacuum, it is a failed design. We do not build bridges for frictionless planes; we build them for the real world.
  *   **The Argument:** If a moral principle requires *omniscience* to be permissible, it is not a usable moral principle. It is a fantasy. By stipulating certainty, he has moved the scenario out of the realm of human action and into the realm of god-like intervention. Proving torture works when you *know* it will work proves nothing about torture, because we never *know* it will work.
  *   **Verdict:** Conclusion (a) survives only in a universe that does not exist. It offers no guidance for the one we live in.

  **Conclusion (b): The state should train and hold the technique in reserve (The Defibrillator).**
  *   **The Bite:** This is where his engineering background should actually stop him. A defibrillator is a tool that sits in a cupboard. It does not change the person who uses it. Torture is not a tool; it is a *practice* that requires a *practitioner*.
  *   **The Argument:** In structural engineering, we apply a **Safety Factor**. We assume materials have flaws. We assume loads will be higher than expected. We do *not* design a structure to hold exactly the maximum load with zero margin for error.
      *   Training torturers assumes the "material" (the interrogator, the institution) will not degrade.
      *   History and psychology show the material *does* degrade. The "friction" (institutional decay, mission creep, psychological trauma) is not external noise; it is **material fatigue**.
      *   If you train men to torture for the 1% case, you cannot prevent them from using it in the 99% case. That isn't "application detail"; that is a structural failure mode.
  *   **Verdict:** Conclusion (b) is bad engineering. It designs for the ideal load without a safety factor. It assumes the steel won't rust.

  ### 4. A Better Analogy

  Since he is an engineer, do not use a philosophical analogy. Use a better engineering one.

  **The "Safety Factor" Analogy.**
  Tell him this:
  *"In your trade, if you design a beam to hold exactly 10 tonnes because that's the maximum theoretical load, you are negligent. You design it for 20 tonnes. You assume the steel might have micro-fractures. You assume the wind might be stronger than the forecast.*

  *The Ticking Time Bomb argument is like designing a bridge that only holds up if the steel is perfectly pure and the wind is exactly zero. You call that a 'theoretical model'. I call that a collapse waiting to happen.*

  *The uncertainty isn't friction, mate. It's the load. The risk of torturing the wrong man **is** the weight the moral structure has to bear. If you stipulate that away, you aren't testing the bridge; you're pretending there's no traffic."*

  ### 5. Summary for the Argument

  To wrap it up at the table:

  1.  **His Distinction is Flawed:** He treats uncertainty as friction (external noise). It is actually a constitutive condition (the load itself).
  2.  **The Name:** Call it **"Load-Bearing Facts"**. Uncertainty is a load-bearing fact of morality.
  3.  **The Engineering Counter:** Real engineering relies on **Safety Factors** (margins of error). The TTB argument removes the safety factor. A design without a safety factor is not "theoretically pure"; it is professionally irresponsible.
  4.  **The Institutional Point:** A defibrillator doesn't change the paramedic. A torture programme changes the state. You cannot train for the exception without normalising the rule.

  If he insists the frictionless plane is valid because it shows the *direction* of the force, remind him: in ethics, the direction doesn't matter if the bridge falls down. We live on the bridge, not in the model.
