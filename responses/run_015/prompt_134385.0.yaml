answer: |-
  This is a sophisticated framing that moves beyond the typical "never again" platitudes into the mechanics of political theory and institutional design. You are correctly identifying that the field of transitional justice and memory studies has saturated the *normative demand* for remembrance (we *should* remember) while under-theorizing the *structural consequences* of that remembrance (what remembering *does* to the polity).

  If I were directing a small research group or policy fellowship with limited resources, I would not prioritize the empirical question of "what works" (which is the domain of political science and sociology) nor the historical question of "what happened." Instead, I would prioritize the **conceptual architecture of mnemonic obligation**. The field currently operates on an unexamined axiom: that increased commemorative density correlates with increased justice. Your agenda should challenge this.

  Here are the three research priorities I would defend, ranked by their upstream dependence and tractability for political theory.

  ### Priority 1: The Substitution Hypothesis (Symbolic Saturation vs. Material Redistribution)

  **The Question:** At what point does high commemorative density function as a moral license to neglect material repair?
  **The Problem:** Current scholarship often treats denialism (Turkey) and over-commemoration (Germany) as opposites. I argue they should be analyzed on a single continuum of **state management of guilt**. In denialist regimes, the state protects the budget by suppressing memory. In high-density regimes, the state may protect the budget by *saturating* memory. If a state builds a Holocaust memorial on every corner but refuses reparations or structural anti-discrimination laws, has it fulfilled its obligation?
  **Why This Priority?**
  *   **Upstream Dependence:** This is the most critical normative check. If remembrance can be weaponized to *prevent* redistribution (by allowing the majority to feel they have "paid" their debt through ritual), then the entire project of state-sponsored memory is politically suspect. This directly addresses your concern about "over-commemoration as a substitute."
  *   **Tractability:** This is a classic problem in political theory (distributive vs. recognitive justice). Philosophers can analyze the logic of "moral licensing" without needing new archival data. It requires analyzing budget allocations, legal statutes, and rhetorical framing rather than historical forensics.
  *   **Policy Relevance:** This is the central tension in the U.S. right now. The removal of Confederate monuments is often pitched *against* reparations or voting rights legislation ("We took down the statue, why do you still want checks?"). A theoretical framework that decouples symbolic apology from material obligation is urgently needed.

  **Research Output:** A typology of "Mnemonic Compensation," distinguishing between *integrative memory* (which demands structural change) and *expiatory memory* (which purchases closure).

  ### Priority 2: The Temporal Horizon of Mnemonic Obligation

  **The Question:** What is the defensible generational limit of state-mandated remembrance before it becomes "inherited performance"?
  **The Problem:** You asked about the transition from living moral practice to performance. In Germany, a fourth-generation citizen is legally and culturally bound to a crime they had no causal hand in. In the American South, the "Lost Cause" persisted for four generations. The field lacks a theory of **mnemonic sunset**. Does the obligation decay as causal links weaken? Or does it persist as long as the *structural effects* persist?
  **Why This Priority?**
  *   **Upstream Dependence:** You cannot solve the Substitution Hypothesis (Priority 1) without knowing how long the substitution is allowed to last. If the obligation is infinite, the risk of "performance" is 100%.
  *   **Tractability:** This engages directly with intergenerational ethics (the non-identity problem, inheritance of debt). It allows philosophers to test the limits of "constitutional patriotism."
  *   **Policy Relevance:** This addresses the "backlash" concern. Younger generations in Germany and the US are showing "memory fatigue." If the state cannot articulate *why* a 25-year-old is obligated to maintain a specific density of remembrance, the memory becomes vulnerable to populist erasure.

  **Research Output:** A normative framework for "Mnemonic Succession." Does obligation transfer via *blood* (identity), *benefit* (unjust enrichment), or *structure* (ongoing inequality)? The answer dictates when the duty ends.

  ### Priority 3: Jurisdictional Architecture (Federal Mandate vs. Local Consent)

  **The Question:** Who has the standing to mandate memory in a fragmented polity?
  **The Problem:** You noted the difference in logics across jurisdictions. Germany's *Vergangenheitsbewältigung* is federally constitutionalized; the American South's memory battles are fought at the municipal school board level; Turkey's is a criminal code issue. The "German Model" is often cited as exportable, but this ignores that Germany's memory is tied to a *post-sovereign* identity (EU integration), whereas the US or Turkey rely on *sovereign* continuity.
  **Why This Priority?**
  *   **Upstream Dependence:** This challenges the "Exportability" assumption. You cannot copy-paste Berlin's memorials to Birmingham if the *jurisdictional authority* to mandate guilt differs. In the US, the Federal government often lacks the constitutional standing to mandate local memory, leading to the "Lost Cause" resilience.
  *   **Tractability:** This is pure political theory (federalism, sovereignty, civic identity). It moves away from "what happened" to "who decides."
  *   **Policy Relevance:** As the US federal government attempts to mandate curriculum (e.g., 1619 Project debates), understanding the friction between federal memory obligations and local civic autonomy is vital to avoid civil conflict.

  **Research Output:** A comparative analysis of "Mnemonic Federalism." When does centralizing memory stabilize a democracy (Germany), and when does it destabilize it (US/Turkey)?

  ---

  ### Defense of Prioritization & Criteria

  I have prioritized these three because they address the **structural risks** of memory politics rather than the **historical accuracy** of memory.

  1.  **Tractability:** Historians can tell us *if* the Armenian genocide happened. They cannot tell us *if* a 2024 Turkish citizen is morally liable to fund a memorial for it. That is a philosophical question. By focusing on liability, temporality, and jurisdiction, your research group stays in the lane of political theory where conceptual clarity drives policy, rather than getting bogged down in historical dispute.
  2.  **Upstream Dependence:** If we do not solve Priority 1 (Substitution), we might be advocating for policies that actively harm victims (by giving states a "get out of jail free" card via monuments). If we do not solve Priority 2 (Temporal Limits), we risk creating a civic religion that generates backlash. These are foundational.
  3.  **Policy Relevance:** These questions map directly onto current legislative battles: reparations bills (Priority 1), curriculum laws (Priority 2), and federal vs. state funding for museums (Priority 3).

  ### What Would Reorder This Agenda?

  I would deprioritize **Priority 2 (Temporal Limits)** if empirical political science demonstrated that **mnemonic fatigue is a myth**. If data showed that high-density commemoration *continues* to correlate with higher civic engagement and lower prejudice over 4+ generations without backlash, the urgency of defining a "sunset" diminishes. However, current anecdotal evidence from Germany suggests fatigue is real, keeping this priority high.

  I would deprioritize **Priority 1 (Substitution)** if we found a case where **symbolic and material justice were perfectly coupled**. If there were a historical example where high commemorative density *forced* material redistribution (rather than substituting for it), the "Substitution Hypothesis" would weaken. However, the German case (high memory, contested reparations to Namibia until recently) and the US case (high memory of MLK, low reparative justice) suggest the trade-off is real.

  ### A Note on the "German Export" Fallacy

  Your intuition about the German model is correct: it is largely non-exportable, and this is a crucial finding for your agenda. Germany's memory work succeeded not just because of moral will, but because **memory was a condition of re-entry into the international community.** Postwar Germany *needed* to remember to be sovereign. The US South and Turkey do not face this existential external threat. Therefore, advocating for "German-style" memory in contexts where sovereignty is not contingent on guilt is a category error. Your research group should explicitly model **Mnemonic Sovereignty**: under what geopolitical conditions does a state *need* to remember to survive? This explains why Turkey (geopolitically pivotal) resists memory, while Germany (geopolitically neutered) embraced it.

  ### Conclusion

  Do not build a literature review. Build a **typology of risk**.
  1.  **Risk of Substitution:** Memory replacing money.
  2.  **Risk of Performance:** Duty replacing conviction.
  3.  **Risk of Coercion:** Federal mandate replacing local consensus.

  If your group can produce a framework that allows policymakers to diagnose which risk is present in their specific context, you will have moved the field from "how to remember" to "how to remember *justly*." This is the only way to honor the complexity you observed in your site visits.
