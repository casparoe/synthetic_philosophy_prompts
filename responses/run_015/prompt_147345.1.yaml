answer: |-
  **The Scenario**

  On a rainy Tuesday in Bath, Elias, a lifelong resident, and Mara, a tourist holding a guidebook open to the "British Etiquette" chapter, stand at the same bus stop where a single-file queue has formed. Both are running late for the Roman Baths museum closing time, a non-urgent scheduling conflict rather than a medical emergency, and both clearly observe the line before deliberately stepping in front of the last person to board the arriving bus first. Their actions cause exactly two waiting passengers to be left behind in the rain, and while Elias operates on lifelong habituation of the norm, Mara operates on explicit intellectual knowledge from her guide, yet both proceed with full awareness that inserting themselves violates the established local order without any physical necessity forcing their hand.

  ***

  **The Check**

  *   **Action:** Deliberate queue-jumping for non-urgent convenience.
  *   **Method of Knowing:** Elias (implicit habituation/member), Mara (explicit guidebook/visitor).
  *   **Nearby Worlds:**
      *   *Ignorance:* If Mara hadn't read the guidebook, the Convention theorist might excuse her (no intent to violate the contract), but the Social-Rule theorist might still condemn the outcome.
      *   *Indifference:* If both knew but didn't care, both are culpable, but the *degree* shifts based on membership.
  *   **Theory Verdicts:**
      *   *Convention-is-Moral Theorist:* Argues morality is constitutive of the practice. Elias is **wronger** because he betrays the social contract that defines his membership; Mara is less wrong because she is a guest violating a courtesy rather than a constitutive rule of her own community.
      *   *Pure-Social-Rule Theorist (with Normative Spillover):* Argues morality lies in system stability. Mara is **wronger** because her violation triggers 'normative spillover'—locals seeing an outsider break rules without consequence may lose faith in the system's enforcement, weakening unrelated norms (like tipping or honesty); Elias's breach is absorbed as internal noise.
  *   **Feature Doing the Work:** It is not just intentional knowledge, but **intentional knowledge coupled with membership status**. If you strip away the knowledge (Mara is ignorant), the Convention theorist exonerates her (no betrayal), but the Spillover effect remains (locals still see the breach). This reveals that the Convention theorist cares about *intent within a contract*, while the Social-Rule theorist cares about *structural integrity regardless of intent*.
