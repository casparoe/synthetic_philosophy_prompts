answer: |-
  You define an intervention as changing X while leaving everything else alone except via X, but doesn't specifying what counts as leaving everything else alone already require knowing the causal structure you are trying to discover?

  If you reply that this is just a coherence constraint on a causal model rather than a metaphysical definition, how do we validate that model without smuggling in prior causal knowledge?

  In social contexts like zoning, variables seem deeply entangled, making surgical interventions look impossible even hypothetically because you cannot change policy without shifting culture and economy.

  If you argue we simply idealize these as fat-handed interventions, does that make causal claims relative to our ability to carve nature at its joints?

  You apply this to social kinds, but Ian Hacking argued that classifying people changes how they behave, so the kind itself shifts under scrutiny.

  If intervening on a category shifts what falls under it, how does your account track stability across the intervention?

  Cases of trumping preemption often dissolve if we fine-grain the variables, but that seems to make causation depend on our descriptive choices rather than the world.

  If you say variable selection is pragmatic, are you admitting causation isn't mind-independent?

  Critics say you have not escaped Lewis-style counterfactuals, just regimented them with extra machinery to handle asymmetry.

  If you claim the interventionist asymmetry is clearer, isn't that asymmetry just as mysterious as Lewis's similarity metric?

  Your view accepts omissions as causes via double prevention, which allows us to say failing to water a plant caused its death.

  If you say this is context-dependent, how do we prevent causal inflation where everything not preventing a barrier is a cause?

  Is this theory metaphysics or just methodology for designing experiments, since it focuses so heavily on what agents can do?

  If you say it bridges both, does it leave a gap with what ordinary people mean by cause?

  I am highly confident that these represent the standard pressure points on interventionist accounts, particularly regarding circularity, fat-handedness, and omissions, as these are the classic objections raised against Woodward-style manipulationism. The question resting on the shakiest reading of her position is likely the one about Lewis-style counterfactuals, because sophisticated interventionists have a robust defense regarding the asymmetry of interventions that distinguishes their view from Lewis's symmetric similarity metrics, making the critique feel slightly dated compared to the others.
