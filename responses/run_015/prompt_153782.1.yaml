          *   *Idea:* Synergistic minimization. The joint minimization of free energy across levels is not the sum of independent minimizations. The *structure* of the hierarchy matters.
          *   *Idea:* Deep temporal horizons. Friendship isn't just immediate PE reduction; it's long-term model stability.

      *   *Drafting the Translation Text:*
