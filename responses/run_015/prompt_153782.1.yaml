prompt: |-
  I am a philosopher of mind with a working familiarity with predictive-processing accounts of affect and social cognition, though I do not work in that literature professionally. I would like you to restate G. E. Moore's analysis of beauty and friendship—specifically his claim that these are paradigmatic instances of organic unity, in which the value of the whole is not proportional to the value of its constituent parts—using only the conceptual vocabulary of hierarchical predictive coding, precision-weighted prediction errors, interoceptive inference, and embodied active inference. Please do not invoke Moore's own terminology except where it is necessary to identify the claim being translated. Once the translation is complete, provide a residue report: which elements of Moore's view carry over without loss (for instance, the non-additive structure), which carry over only with significant distortion (for instance, the objectivity of aesthetic and moral value), and which appear inexpressible within a framework that treats all valuation as a form of embodied error-minimization. Conclude by assessing whether the inexpressible residue reveals a genuine limitation in predictive-processing approaches to social and aesthetic cognition, or whether it instead suggests that Moore's organic-unity argument relies on an unanalyzed intuition about part-whole relations that does not survive scrutiny outside its original metaethical context. Do not provide a bibliography, reading list, or citations; work solely from the conceptual architecture.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
