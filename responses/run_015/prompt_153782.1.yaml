      *   *Context:* *Principia Ethica*. Moore argues against hedonism and naturalism.

  3.  **Deconstruct Predictive Processing (PP) Vocabulary:**
      *   *Hierarchical Predictive Coding:* The brain generates top-down predictions; bottom-up signals convey prediction errors (PE).
      *   *Precision-Weighting:* The brain estimates the reliability (precision) of PEs. High precision = high attention/learning rate.
      *   *Interoceptive Inference:* Predictions about the internal physiological state (affect/valence).
