      *   *Inexpressible (Normativity/Qualia):* Moore's "good" is a simple, non-natural property. PP's "good" is functional (survival/model stability). The *ought* of Moore vs. the *is* of PP. The specific *feel* of the value (qualia) might be reduced to interoceptive predictions, losing the normative force.

