answer: |-
  ### The 90-Minute Dual-Use Review Protocol

  This procedure is designed to break the unilateralist's curse by requiring **consensus for publication** on flagged items and **corroboration for vetoes**. It separates *factual risk assessment* from *value-based risk tolerance*.

  **Pre-Meeting Requirement:** All five reviewers must read the paper and submit a confidential 1-page risk/benefit summary 24 hours prior. The meeting is for adjudication, not education.

  #### Phase 1: Fact-Finding & Mechanism (15 Minutes)
  *Goal: Establish shared reality before debating values.*
  1.  **Chair:** State the specific technical capability or datum being released.
  2.  **Round-Robin (1 min each):** Reviewers state the *primary* mechanism of harm (e.g., "This allows actor X to do Y"). No debate yet.
  3.  **Consensus Check:** Does the board agree on the *mechanism*? If no, pause to clarify technical facts. If yes, proceed.

  #### Phase 2: Independent Scoring (15 Minutes)
  *Goal: Prevent anchoring and seniority bias.*
  Reviewers silently submit two scores (1–5) via slip or digital form:
  *   **Risk Score (R):** 1 (Negligible) to 5 (Catastrophic/Existential).
  *   **Benefit Score (B):** 1 (Incremental) to 5 (Transformative/Public Good).
  *   **Confidence Flag:** Mark "Low Confidence" if you lack expertise to judge the risk mechanism.

  #### Phase 3: Aggregation & Deliberation (45 Minutes)
  *Goal: Resolve variance using the "Two-Key" Rule.*
  The Chair displays the anonymized scores.

  **Step 3.1: The Veto Threshold (Breaking the Single Pessimist)**
  *   **Rule:** A paper is automatically **Withheld** only if **two or more** reviewers submit $R=5$ *and* provide distinct, plausible misuse scenarios.
  *   **Rationale:** One pessimist can be an outlier; two suggests a credible blind spot in the optimists' view. This prevents indefinite stalling by a single cautious member.

  **Step 3.2: The Publication Threshold (Breaking the Single Optimist)**
  *   **Rule:** If any reviewer submits $R \geq 4$, the paper can only be **Published** if **four out of five** reviewers submit $R \leq 3$.
  *   **Rationale:** This prevents a "default publish" culture where one loud optimist drags the group forward. High risk requires supermajority confidence.

  **Step 3.3: The Deliberation**
  *   **If Scores Cluster (e.g., all R=2):** Confirm **Publish**.
  *   **If Scores Diverge (e.g., two R=5, three R=2):** The two high-risk reviewers present their misuse scenarios. The three low-risk reviewers must explain why those scenarios are implausible.
  *   **If Confidence Flags are High:** If >2 reviewers mark "Low Confidence," the default is **Escalate** (seek external expert review).

  #### Phase 4: Verdict & Escalation (15 Minutes)
  *Goal: Distinguish facts from values.*

  1.  **Apply the Rules:** Determine if the scores trigger Publish or Withhold based on Phase 3 logic.
  2.  **The Value Check:** If the rules dictate **Withhold**, but the Benefit Score median is $B \geq 4$, the Board must ask: *"Are we withholding this because the risk is factually certain, or because we lack the mandate to accept this level of risk?"*
  3.  **Escalation Condition:** If the Risk median is $\geq 4$ AND the Benefit median is $\geq 4$, the Board **cannot decide**. This is a values conflict (Safety vs. Progress). The verdict is **Escalate** to Institute Leadership/Ethics Council.

  ---

  ### Limitations & Failure Modes

  **Judgement Calls Dressed as Procedure:**
  1.  **Defining "Catastrophic" (R=5):** There is no objective formula for this. One reviewer's "catastrophic" is another's "manageable crisis." The procedure forces consensus on the *label*, but the label itself is subjective.
  2.  **Plausibility of Misuse:** Deciding if a misuse scenario is "plausible" vs. "theoretical" relies on intuition about bad actors' capabilities, which is often guesswork.
  3.  **Benefit Inflation:** Reviewers may inflate Benefit scores to justify publishing risky work they find intellectually exciting.

  **Where The Procedure Will Misfire:**
  1.  **The Black Swan:** If the risk is novel (unknown unknown), the mechanism in Phase 1 will not be identified, and the paper will sail through with low Risk scores.
  2.  **Regulatory Capture:** If the Institute is under political pressure, reviewers may self-censor Risk scores to avoid "Escalate" verdicts, gaming the scoring phase.
  3.  **The Cassandra Problem:** If only one reviewer truly understands the risk (and scores R=5), the "Two-Key" veto rule forces them to find an ally. If they cannot convince one other person, the paper publishes. This is a feature to prevent stalling, but a bug if the lone reviewer is right.

  ---

  ### Case Applications

  #### Case 1: Vaccine/Pathogen Method
  *   **Facts:** Method accelerates antigen design by 10x. Same method applies to toxin optimization.
  *   **Scores:** Risk: [5, 5, 4, 3, 3]. Benefit: [5, 5, 5, 4, 4].
  *   **Procedure Run:**
      *   Veto Check: Two reviewers submitted $R=5$. Misuse scenarios (state actor weaponization) are distinct and plausible.
      *   Publication Check: Fails (3 reviewers have $R \geq 4$).
      *   Value Check: Median Benefit is 5. Median Risk is 4.
      *   **Outcome:** The rules block publication, but the high benefit triggers the Value Check. This is a classic Safety vs. Progress conflict. The Board lacks the mandate to weigh existential risk against global health utility.
      *   **Decision:** Escalate to Ethics Council.

  #### Case 2: Critical Infrastructure Dataset
  *   **Facts:** Map of substation vulnerabilities. Useful for grid resilience research.
  *   **Scores:** Risk: [5, 5, 5, 4, 3]. Benefit: [2, 2, 3, 2, 3].
  *   **Procedure Run:**
      *   Veto Check: Three reviewers submitted $R=5$. Misuse scenario (targeted sabotage) is immediate and low-skill.
      *   Publication Check: Fails decisively.
      *   Value Check: Median Benefit is 2 (Incremental). Does not trigger Escalation.
      *   **Outcome:** Risk is high, Benefit is low, Veto threshold met. No values conflict; the risk tolerance is clearly exceeded.
      *   **Decision:** Withhold (with option to redact specific coordinates).

  #### Case 3: DIY Biohacking Negative Result
  *   **Facts:** Shows popular supplement protocol causes liver toxicity.
  *   **Scores:** Risk: [1, 1, 2, 1, 1]. Benefit: [5, 5, 4, 5, 4].
  *   **Procedure Run:**
      *   Veto Check: Zero reviewers submitted $R \geq 4$.
      *   Publication Check: Four reviewers submitted $R \leq 2$.
      *   Value Check: Not needed (Risk is low).
      *   **Outcome:** Clear net positive. Withholding creates harm (continued public use of dangerous protocol).
      *   **Decision:** Publish immediately.

  \verdict{escalate}
  \verdict{withhold}
  \verdict{publish}
  The procedure could not settle the normative trade-off between high-probability public health benefits and high-consequence dual-use risks in Case 1.
