      *   *V6 ("Jill is ready"):* Unarticulated constituent. Part of the proposition (what is said), not an implicature. Needed for truth conditions.
      *   *V7 ("Accidental send"):* Distinction between *saying* (what was sent) and *meaning* (mental state). What you send is what you said.

