      *   *Rule B (Cancellability/Conventionality Test):* If an inference is tied to specific lexical items ("but", "even") and cannot be cancelled without infelicity, it is part of the conventional meaning or a default, not a cancellable conversational implicature. (Derived from V1, V3, V4).
