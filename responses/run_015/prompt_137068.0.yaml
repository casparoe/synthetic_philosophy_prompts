      *   *Why:* This tests the "picked the phrasing" condition in V5. In the chip case, Priya tapped a pre-existing option (active selection). In the autocorrect case, the system alters the user's input (passive acceptance). If the professor says the user *still* owns the enthusiasm in the autocorrect case, then "sending" (V7) trumps "picking" (V5). If she says the user *doesn't* own it in the autocorrect case, then "picking" (V5) is the crucial factor. This separates the weight of V5 vs V7.

