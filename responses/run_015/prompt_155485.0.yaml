      *   Section 2: The Criterion of Reality. Function, Memory, Norms.
      *   Section 3: The Bus Queue Rebuttal. Intentionality and Structure.
      *   Section 4: The Asset Implication. You can't divide emergent properties.
      *   Conclusion: The collective is a "system," not a "pile."

  12. **Final Polish:** Check for clarity and impact. Ensure the distinction between *ontological independence* (floating in space) and *functional reality* (causal power) is clear, as the user worries about "proving it exists." The existence is in the *relations*, not the *relata*.

  *(Self-Correction during drafting)*: I should be careful not to say the collective is a "person." It's a social entity. I need to make sure I don't validate the idea that the collective owns the tools if legally they don't, but rather argue that the *value* of the tools is tied to the system. Actually, the prompt asks about the *reasoning*, not legal advice. Stick to the philosophy of the situation.

  13. **Final Review against constraints:** The user asks two specific questions. Ensure both are answered clearly.
      1. Where does her reasoning fail?
      2. Must I accept every arbitrary grouping is real?

