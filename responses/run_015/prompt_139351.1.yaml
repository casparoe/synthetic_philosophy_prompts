answer: |-
  Here are ten interview questions designed for audio, keeping the conversation punchy while pressing hard on the logical gaps in her theory.

  **1. The Age vs. Cohort Problem**
  **Question:** I want to start with the hardest puzzle in your field, the age-period-cohort problem. When we see a difference between a 25-year-old and a 65-year-old, how do you ever know if that's because they're different generations, and not just because one group is young and the other is old?
  **Likely Answer:** She'll say we use statistical models to hold age constant. We look for "scars" left by specific historical events that only hit one group while they were forming their identities, rather than universal life stages.
  **Follow-up:** But if the scar is only visible in retrospect, isn't it impossible to use this concept to manage people in real time? Like, HR can't wait forty years to find out who my intern actually is.

  **2. The Period Effect Problem**
  **Question:** Let's push that further. How do you distinguish a cohort effect from a period effect? If a pandemic hits, it shocks everyone—the 20-year-olds and the 60-year-olds alike. Why is the reaction a "generation" and not just "everyone living through the same thing"?
  **Likely Answer:** She'll argue that the *impact* differs by developmental stage. A recession hits a new entrant to the labor market differently than it hits someone ready to retire. The structure is the same, but the causal mechanism lands on different soil.
  **Follow-up:** So the "generation" isn't the event itself, but the interaction between the event and your age? That sounds less like a real kind and more like a description of an interaction effect.

  **3. Boundary Drift**
  **Question:** You argue generations are real kinds, like biological species or economic cycles. But with species, the boundaries are genetic, and with recessions, the dates are fixed by data. With generations, the birth years seem to drift depending on who's drawing the map. Why do the edges move?
  **Likely Answer:** She'll likely say social kinds don't have hard edges like physical objects. They're fuzzy sets. The drift comes from marketers trying to sell things, not from the sociology itself.
  **Follow-up:** But if the marketers can move the walls whenever they want, how do you prove the walls were there to begin with?

  **4. The 1980 "Cusper" Problem**
  **Question:** I noticed in your writing you put people born around 1980 into a "neither-here-nor-there" category that other writers don't even recognize. If this is a real causal structure, why is there a gap in the machinery? Shouldn't the cause produce an effect for everyone born in that window?
  **Likely Answer:** She'll explain that social processes fade in and out. Not everyone gets caught equally in the causal web. Some people are on the tail end of one wave and the start of another.
  **Follow-up:** But if a significant chunk of the population doesn't fit the kind, does that weaken the claim that the kind is real? Or does it just mean the theory is unfalsifiable?

  **5. The Recession Analogy and Authority**
  **Question:** I want to dig into your analogy that a generation is real the way a recession is real. But a recession gets dated by a specific body, the NBER, using strict criteria. Who plays that role for generations? Who has the authority to say "the Millennial cohort starts now"?
  **Likely Answer:** She'll say it's historians and sociologists looking back. We identify the structure once the dust settles, similar to how economists date a recession after the growth numbers are in.
  **Follow-up:** So if no one has declared it yet, the generation doesn't exist? That suggests the label creates the reality, rather than finding it.

  **6. The Transmission Mechanism**
  **Question:** Let's talk about the causal structure itself. If a generation is produced by a historical process, what is the actual mechanism? Is it the economy? The media? The technology? How does the history get under the skin?
  **Likely Answer:** She'll describe a mix of institutional changes—like the shift from pensions to 401ks—and cultural shifts, like the rise of the internet, which reshape expectations about risk and trust.
  **Follow-up:** If the mechanism is mostly institutional, like 401ks, then wouldn't someone who opts out of that system—like my teammate who doesn't vote or invest traditionally—fall outside the generation?

  **7. The Looping Effect**
  **Question:** There's a concept called "looping," where telling people they belong to a group makes them act like that group. If I tell your 24-year-old intern she's Gen Z and therefore risk-averse, does she become risk-averse to fit the label?
  **Likely Answer:** She'll admit labeling has power. People navigate the world using the categories available to them. So yes, the label can reinforce the behavior.
  **Follow-up:** But if the label creates the behavior, doesn't that mean the kind is made rather than found? And if it's made, can't we just stop making it?

  **8. The Export Problem**
  **Question:** Here's a problem I see with the "real kind" view. We apply these labels globally. We talk about Gen Z in the US and Gen Z in India. But they didn't share the same constitutive events. How can it be the same causal structure if the history is different?
  **Likely Answer:** She might argue there are globalizing forces, like the internet or climate change, that create a shared structure despite local differences. Or she might concede the label travels better than the sociology.
  **Follow-up:** If the label travels but the history doesn't, aren't we just exporting a marketing term and pretending it's a sociological fact?

  **9. Practical Advice for HR**
  **Question:** I need to ask this for my own sake. HR just sorted our sixty-person company into generational buckets for a workshop, and it visibly failed on real people. If you're right that generations are real structures, was HR wrong to use them this way?
  **Likely Answer:** She'll say HR used the tool clumsily. Generations explain broad shifts in opportunity structures, not individual personality traits. They should have used them to discuss policy, not predict behavior.
  **Follow-up:** So what should we do with the labels? Throw them out, or just stop expecting them to predict how my 61-year-old teammate votes?

  **10. Falsification**
  **Question:** Last question. Science requires that you can be wrong. What evidence would you need to see to give this view up? What would prove that generations are *not* real kinds?
  **Likely Answer:** She'll say if we found that historical events had no lasting differential impact on cohorts compared to age or period effects. If the statistical signal disappeared entirely.
  **Follow-up:** And if the signal is there, but it's too weak to predict anything about an individual person, does it still count as "real" in any useful sense?
