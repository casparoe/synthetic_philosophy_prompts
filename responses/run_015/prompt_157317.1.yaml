  No, this does not reduce Hegel to political economy, because the object-world constitutes the very medium through which consciousness externalizes and knows itself, not merely a site of value extraction. You mistake the ontological function of the thing for a mere economic category, whereas for Hegel, the independence of the object is the necessary resistance against which subjectivity is forged. If recognition were purely dyadic, it would remain a tautological mirror-game, never escaping the circle of self-certainty; it is precisely because the slave confronts the fear of death *in the thing* through labor that consciousness acquires a mind of its own. The master's failure is not simply that he exploits, but that he refuses this mediation by the object, seeking immediate consumption which leaves him dependent on the very slave he disdains. Thus, the triad is not a smuggling of commodity fetishism but the rigorous demonstration that spirit cannot emerge from consciousness alone, but only through the negation of the natural world.
