prompt: |-
  hey im in high school and im trying to figure out my research project on why people break promises to themselves even when they know its stupid. my advisor mentioned akrasia and hyperbolic discouting but theres so much stuff out there. if im gonna spend like 3 months on this and actually want it to help teens not flake on goals, which open questions are worth the time? should i look at whether weakness of will is just bad brain math, whether commitment devices change your actual self over time, or how apps and social media mess up precommittment? rank them by whats actually tractable for a student and what solving one does for the others. im less interested in a list than in why the ordering makes sense, and what kind of result in the next year would flip your ranking. also sorry if i typoed something lol
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Request:**
      *   **User:** High school student.
      *   **Project Topic:** Why people break promises to themselves (akrasia/procrastination) despite knowing it's "stupid."
      *   **Advisor Input:** Mentioned *akrasia* and *hyperbolic discounting*.
      *   **Goal:** Spend 3 months on research, aim to help teens not flake on goals.
      *   **Specific Questions to Rank:**
          1.  Is weakness of will just "bad brain math"? (Mechanism/Cause)
          2.  Do commitment devices change your actual self over time? (Intervention/Long-term effect)
          3.  How do apps/social media mess up precommitment? (Context/Environmental factor)
      *   **Constraints/Preferences:**
          *   Rank by *tractability* for a student.
          *   Rank by *impact* (solving one helps the others).
          *   Explain *why* the ordering makes sense (less interested in a list).
          *   Identify what future result would *flip* the ranking.
          *   Tone: Casual but rigorous ("sorry if i typoed something lol").

  2.  **Evaluate the Three Options:**

      *   **Option 1: Weakness of will = Bad brain math? (Hyperbolic Discounting/Neuroscience)**
          *   *Tractability:* Low. This requires heavy neuroscience (fMRI, etc.) or complex behavioral economics modeling. Hard for a high schooler to do original research in 3 months. Mostly literature review.
          *   *Impact:* High theoretical value, but low practical application for teens immediately.
          *   *Dependency:* Foundational. If it's *not* math, the other interventions might need different designs.

      *   **Option 2: Do commitment devices change your actual self? (Identity/Habit Formation)**
          *   *Tractability:* Medium. Can run a survey or a small longitudinal experiment (e.g., "Use a commitment app for 3 weeks, did your identity shift?").
          *   *Impact:* High. If true, it suggests long-term solutions rather than band-aids.
          *   *Dependency:* Builds on Option 1 (you need a device to counter the math) and Option 3 (devices are often digital).

      *   **Option 3: How apps/social media mess up precommitment? (Environmental/Digital Context)**
          *   *Tractability:* High. Teens have easy access to this data. Can survey peers, track screen time vs. goal completion, or analyze existing app features. Very relevant to the target demographic (teens).
          *   *Impact:* High immediate utility. If you know *how* it breaks, you can fix it.
          *   *Dependency:* Specific instance of Option 2 (digital commitment devices).

  3.  **Determine the Ranking Strategy:**
      *   *Criterion 1: Tractability (Can a HS student do this in 3 months?)*
      *   *Criterion 2: Leverage (Does solving this help the others?)*
      *   *Criterion 3: Relevance (Does this help teens specifically?)*

      *   *Draft Ranking:*
          1.  **Apps/Social Media (Option 3).** Most tractable, most relevant to teens, concrete data collection.
          2.  **Commitment Devices & Identity (Option 2).** Good middle ground. actionable, but harder to measure "change in self."
          3.  **Bad Brain Math (Option 1).** Too theoretical, hard to test originally, already well-trodden ground in academia.

      *   *Refining the "Why":* The prompt asks for *why* the ordering makes sense. I need to emphasize the "Research Pipeline." You start with the context (Apps), then the tool (Commitment), then the theory (Math). Or, from a utility standpoint: Fix the environment first, then the tool, then worry about the deep theory.
      *   *Actually, let's look at "Solving one does for the others".*
          *   If you solve #3 (Apps), you know *where* the friction is.
          *   If you solve #2 (Identity), you know *if* the fix lasts.
          *   If you solve #1 (Math), you know *why* it happens fundamentally.
          *   *Better Argument:* For a high schooler wanting *impact*, start with the environment (#3). It's the easiest to measure and change. Then look at whether those changes stick (#2). The theory (#1) is the least useful for immediate intervention.

  4.  **Drafting the Response:**

      *   **Tone Check:** Keep it encouraging, not condescending. Acknowledge the typos (no big deal).
      *   **Structure:**
          1.  Validate the topic (it's a great one).
          2.  The Ranking (clearly stated).
          3.  The "Why" (Tractability + Leverage).
          4.  The "Flip Condition" (What new info changes the ranking).
          5.  Advice on execution (3-month timeline).

      *   **Fleshing out the Ranking Logic:**
          *   *#1 (Top Pick): Apps/Social Media.* Why? Data access. You are a teen, your peers are teens. You can survey/interview easily. It addresses the *modern* context of akrasia.
          *   *#2 (Middle): Commitment Devices/Identity.* Why? It's the intervention. But measuring "change in self" is hard in 3 months. Requires longitudinal tracking.
          *   *#3 (Bottom): Bad Brain Math.* Why? It's a literature review trap. You won't prove/disprove hyperbolic discounting in 3 months. It's too abstract for "helping teens not flake."

      *   **Fleshing out the "Flip Condition":**
          *   What would make "Bad Brain Math" the top priority? If a new study comes out showing hyperbolic discounting is *wrong* or if a specific neural biomarker is found that makes commitment devices useless.
          *   What would make "Identity" the top priority? If apps are proven useless (e.g., people just delete them).

      *   **Fleshing out the "3-Month Plan":**
