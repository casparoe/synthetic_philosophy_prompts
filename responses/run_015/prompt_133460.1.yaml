  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** Individual Causal Efficacy in Collective Harm Scenarios
  **Parties:** The Expected-Difference Theorist (EDT) and The Inefficacy Skeptic (IS)
  **Date:** October 26, 2023

  ## PREAMBLE
  We, the undersigned, acknowledge a substantive disagreement regarding the moral obligations of individuals participating in systems that produce collective harms (e.g., climate change, industrial animal agriculture, mass elections). To prevent this disagreement from collapsing into a verbal dispute regarding the definition of "causation" or "obligation," we have adopted a shared hypothetical test case: **The Threshold Audit Technology.**

  This hypothetical technology can retrospectively determine, for any specific unit of consumption or emission, whether that specific unit was the *marginal trigger* that caused a producer or system to cross a discrete threshold resulting in additional harm (e.g., triggering a new production batch, crossing a climate tipping point). We both agree that the operational behavior of this technology in the actual world bears directly on the causal crux of our disagreement. We further agree that the frequency and distribution of "positive" audit results constitute evidence relevant to our respective theories.

  ## SECTION I: SHARED COMMITMENTS
  The following claims are accepted by both the EDT and the IS as the common ground for this collaboration.

  1.  **Nature of Collective Harm:** We agree that the harms in question (climate destabilization, animal suffering, etc.) are real, significant, and result from the aggregated actions of many individuals.
  2.  **Causal Structure:** We agree that the systems producing these harms involve complex supply chains and physical processes. We agree that if a specific individual act *does* cause additional harm, it must do so via a mechanism wherein that act changes the state of the system (e.g., inventory levels, atmospheric concentration) in a way that leads to a worse outcome than would have occurred had the act not been performed.
  3.  **Definition of "Making a Difference":** For the purposes of the Threshold Audit, "making a difference" is defined counterfactually: Act $A$ made a difference if and only if, had $A$ not occurred, the specific harmful outcome $H$ (e.g., the slaughter of a specific animal, the release of a specific ton of carbon) would not have occurred at that time or in that manner.
  4.  **Relevance of Causation to Obligation:** We agree that the causal relationship between an individual's act and the collective outcome is *relevant* to determining moral obligation. We disagree on whether it is *necessary* or *sufficient*.
  5.  **Validity of the Audit:** We both accept the Threshold Audit as a coherent conceptual tool. We agree that if the Audit were applied to a large sample of acts, the resulting data would provide empirical evidence regarding the frequency of marginal causal efficacy in the real world.
  6.  **Scope of Dispute:** This dispute is not about whether individuals should act ethically. Both sides agree individuals have moral duties regarding collective harms. The dispute is strictly about the *grounding* of that duty (consequentialist expected value vs. non-consequentialist principles) and the *empirical frequency* of individual causal efficacy.

  ## SECTION II: DISAGREEMENTS AND CRUXES

  The following table outlines the specific points of divergence. Each statement is formulated to be acceptable to the party holding it, without caricature.

  | Point of Contention | Expected-Difference Theorist (EDT) Position | Inefficacy Skeptic (IS) Position |
  | :--- | :--- | :--- |
  | **1. Empirical Frequency of Marginality** | Individual acts frequently occupy a probabilistic relationship to thresholds. In a large sample, a non-negligible percentage of acts will be the "marginal unit" that triggers additional production or harm. | Individual acts are typically absorbed by system buffers (inventory, slack, rounding). In a large sample, the percentage of acts that are truly counterfactually necessary for a specific harm is effectively zero. |
  | **2. Normative Grounding** | Moral obligation is grounded in **Expected Value**. If an act has a nonzero probability $P$ of causing harm $H$, the expected disvalue is $P \times H$. This expected disvalue is sufficient to ground a pro tanto obligation to refrain. | Moral obligation is **not** grounded solely in individual causal efficacy. Because $P$ is typically negligible or unknowable, the consequentialist argument fails. Obligation must be grounded in fairness, integrity, complicity, or collective duty. |
  | **3. Nature of Thresholds** | Thresholds are operational realities (e.g., a container ship must be full to sail; a flock must be a certain size to process). Small changes in demand shift the probability of crossing these thresholds. | Thresholds are modeling artifacts. Real-world systems are continuous or heavily buffered. Producers adjust to aggregate trends, not individual units. The "threshold" is not sensitive to single-agent variation. |

  ### The Cruxes and Evidentiary Standards

  For each point of contention above, we identify the specific finding that would resolve or shift the weight of the argument, along with our respective predictions regarding the Threshold Audit.

  | Crux | Agreed Evidentiary Standard (The Test) | EDT Prediction | IS Prediction |
  | :--- | :--- | :--- | :--- |
  | **Causal Frequency** | **The Audit Result:** Apply the Threshold Audit to 1,000,000 random purchases of a commodity (e.g., chicken breasts). Count how many are flagged as "The Marginal Unit" that triggered a new production cycle. | **Prediction:** The Audit will flag a statistically stable, non-zero number of purchases (e.g., 1 in 10,000). This confirms that individual acts *do* sometimes trigger thresholds, validating the expected-value calculation. | **Prediction:** The Audit will flag zero or near-zero purchases. It will reveal that inventory buffers and production scheduling absorb individual units without triggering discrete new cycles. This confirms that individual acts are causally inert. |
  | **Normative Weight** | **The "Single Case" Intuition:** If the Audit confirms Act $A$ *did* trigger Harm $H$, does the agent bear responsibility? If the Audit confirms Act $B$ *did not*, does the agent bear responsibility? | **Prediction:** Responsibility tracks Expected Value, not just actual outcome. Even if Audit $B$ says "no difference," the agent was obligated because the *risk* was present. However, a positive Audit result confirms the obligation was real and binding. | **Prediction:** Responsibility tracks actual causal contribution or non-consequentialist duties. If Audit $B$ says "no difference," the consequentialist argument for obligation collapses for that act. A positive Audit result is an anomaly that does not ground a general rule. |
  | **System Sensitivity** | **Buffer Analysis:** The Audit includes a sub-routine analyzing supply chain elasticity. Does a reduction of 1 unit in demand delay or reduce the next production batch? | **Prediction:** Yes. Supply chains are tight. Reduced demand eventually propagates upstream to reduce production volume. | **Prediction:** No. Supply chains are loose. Producers absorb minor fluctuations as waste or inventory without altering production schedules. |

  ## SECTION III: NOTE ON VERBAL DISPUTE

  We acknowledge that a portion of our disagreement is **terminological**, specifically regarding the definition of "cause."

  *   **EDT** employs a **probabilistic definition of causation**, where increasing the likelihood of an event constitutes a causal contribution.
  *   **IS** employs a **deterministic/counterfactual definition of causation**, where an act is only a cause if the outcome would not have occurred without it.

  **Resolution:** We agree that the Threshold Audit bypasses this verbal dispute by operationalizing the IS's definition (counterfactual necessity).
  *   If the Audit returns positive results frequently, the IS must concede that individual acts *do* meet the strict counterfactual definition of cause more often than assumed.
  *   If the Audit returns negative results, the EDT must concede that the "expected difference" relies on a probabilistic model that does not map onto discrete counterfactual events in the way claimed.

  Therefore, while the definition of "cause" differs, the dispute is **substantive** regarding the empirical structure of supply chains and climate systems. The Audit forces both sides to make falsifiable empirical claims about the world, not just semantic claims about morality.

  ## SIGNATURES

  _________________________
  **Expected-Difference Theorist**
  *I sign this acknowledging that if the Threshold Audit shows individual acts never trigger thresholds, my argument for individual consequentialist obligation is significantly weakened.*

  _________________________
  **Inefficacy Skeptic**
  *I sign this acknowledging that if the Threshold Audit shows individual acts frequently trigger thresholds, my claim that individuals make no causal difference is empirically falsified.*
