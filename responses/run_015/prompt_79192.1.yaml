answer: |-
  There is no single, canonical term in philosophy or game theory that captures this exact pattern of reasoning and outcome. However, it is a recognized structural problem that sits at the intersection of **deontological ethics**, **consequentialism**, and **coordination games**.

  The closest established concept is **Derek Parfit's "Each-We Dilemma"** (from *Reasons and Persons*), though Parfit uses this as a broad category for cases where individual rationality conflicts with collective good, rather than a name for this specific argumentative move. In game theory, this is a variant of the **Volunteer's Dilemma** with a **congestion externality**, or specifically the **El Farol Bar Problem** (where agents must decide whether to attend a bar that is only enjoyable if not overcrowded, based on predictions of others' behavior).

  Because the pattern you describe concerns a specific *argumentative move* (the misapplication of universalizability to a threshold good) rather than just the outcome, I propose the name:

  ### **The Threshold Universalization Paradox**

  Below is a careful account of the pattern, an analysis of the argument's validity, and a definition of its boundaries.

  ---

  ### 1. The Structure of the Pattern

  The pattern consists of three components: a specific type of good, a symmetry condition among agents, and a specific logical move.

  *   **The Good (Threshold/Congestion):** The act in question produces a net benefit if performed by a *subset* of agents (above a lower threshold, below an upper threshold) but produces a net harm if performed by *all* or *none*.
  *   **The Symmetry:** Agents are epistemically symmetric (same information, same reasoning capabilities) and causally symmetric (no one can coordinate or observe others before acting).
  *   **The Argument (The Move):**
      1.  **Universalizability Premise:** If an act is permissible for me, it must be permissible for any relevantly similar agent in this situation.
      2.  **Aggregation Premise:** If the act is permissible for all, all will (rationally) do it.
      3.  **Consequence Premise:** If all do it, the outcome is impermissible (harmful).
      4.  **Conclusion:** Therefore, the act is not permissible for me.

  ### 2. Is the Argument Sound?

  The argument is **valid** (the conclusion follows logically from the premises) but **unsound**. The failure lies in the **Universalizability Premise**.

  In standard deontological ethics (e.g., Kant), the Categorical Imperative requires that you act only on maxims that you can will to become universal laws. The agents in your examples are applying a rigid version of this test: *"Can I will that everyone asks a question?"* Since the answer is "No" (the seminar collapses), they conclude they cannot ask.

  **The Error:** The error is treating a **scalar permission** as a **binary universal**.
  In threshold cases, the moral status of the act is not intrinsic to the act itself, but contingent on the *frequency* of the act. The correct maxim is not *"I will ask a question,"* but *"I will ask a question if I judge that fewer than $N$ others are doing so."*

  Because the agents lack information about $N$ (the number of others acting), they cannot satisfy the condition of the refined maxim. Faced with uncertainty, they default to the safer universalizable maxim (*"No one asks"*), even though it leads to a suboptimal outcome. The argument is unsound because it assumes a permission must hold *universally* in a context where permissions are inherently *statistical*.

  ### 3. Distinction from Related Concepts

  You correctly identified that this is not the Free-Rider Problem or the Unilateralist's Curse. Here is how **The Threshold Universalization Paradox** differs from the nearest neighbors:

  *   **Vs. The Free-Rider Problem:** In free-riding, the agent wants the good *without* contributing, relying on others to bear the cost. In your pattern, the agents are willing to bear the cost (ask the question, reopen the debate); they refrain because they fear *over*-contribution, not under-contribution.
  *   **Vs. The Unilateralist's Curse:** The Unilateralist's Curse (Bostrom et al.) arises when agents have *divergent* private estimates of value, leading to *too much* action. Your pattern arises from *convergent* estimates leading to *too little* action.
  *   **Vs. Pluralistic Ignorance:** In pluralistic ignorance, agents privately reject a norm but publicly follow it because they mistakenly believe others accept it. In your pattern, agents accurately understand the situation but are logically paralyzed by the symmetry of their reasoning.
  *   **Vs. Parfit's Each-We Dilemma:** This is the broader genus. Parfit's category includes Prisoner's Dilemmas and Free-Rider problems. **The Threshold Universalization Paradox** is the specific species where the dilemma is driven by a misapplication of the universalizability test to a congestion/threshold good.

  ### 4. Boundaries and Definitions

  If we adopt **The Threshold Universalization Paradox** as the term, here are its edges:

  **A. Sum vs. Threshold**
  The paradox applies to both, but is most acute with **thresholds**.
  *   *Threshold:* The harm occurs only after $N$ actors (e.g., 20 interruptions ruin the seminar). The paradox is strong here because the "safe" zone is distinct from the "ruin" zone.
  *   *Sum (Tragedy of the Commons):* If every tiny contribution adds linear harm (e.g., carbon emissions), the universalization argument ("If everyone emits, the planet burns") is actually *sound* consequentialist reasoning. The paradox specifically requires a zone where *some* action is good, but *all* action is bad.

  **B. Coordination Mechanisms**
  The paradox **dissolves** if agents can break symmetry.
  *   *Randomization:* If the group agrees that "3 of us will ask questions, chosen by lot," the universalization test passes. The maxim becomes "I will ask if chosen by lot." If everyone follows *that* maxim, the outcome is good.
  *   *Turn-taking:* If agents can sequence their actions, the first agent sees that no one else has acted, satisfying the condition for the refined maxim.
  *   *Definition:* The paradox exists only in **simultaneous, non-communicating, symmetric** decision environments.

  **C. Universalizability**
  The paradox appears wherever moral or rational permissions are stated in **general terms** rather than **case-by-case**.
  *   If the rule is "Ask if you are confused," the paradox triggers (everyone is confused).
  *   If the rule is "Ask if you are confused *and* no one else has asked," the paradox is avoided, but the rule is impossible to follow without information.
  *   *Edge Case:* The paradox does not apply if the agents have **asymmetric information**. If one person knows they are the *only* one confused, the universalization test passes ("If everyone who was the *only* confused person asked, the result would be good").

  ### 5. Summary Recommendation

  When you encounter this pattern, you can describe it as **The Threshold Universalization Paradox**.

  *   **It names:** The argumentative move (misapplying universalizability) and the outcome (symmetric under-compliance).
  *   **It diagnoses:** A failure to recognize that moral permissions can be probabilistic or role-relative rather than absolute.
  *   **It prescribes:** The need for **correlated strategies** (randomization, signaling, or designated roles) to break the symmetry that forces the universalization test to fail.

  This term distinguishes the phenomenon from the psychological (Bystander), the economic (Free-Rider), and the epistemic (Unilateralist's Curse), locating it firmly in the logic of **moral coordination under uncertainty**.
