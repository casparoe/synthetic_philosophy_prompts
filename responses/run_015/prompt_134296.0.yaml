  Based on the track record you've described, here is the breakdown of your roommate's ethical framework, her likely verdict on the Noether project, and the principles at play.

  ### The Verdict: Reject (Conditional)
  She will likely **reject the project as proposed**, specifically due to the deathbed scene.

  While she might be indifferent or even approving of the "bath scene" (a visual metaphor akin to the *Curie* inner voice or *NASA* composite), the deathbed scene is a dealbreaker. It falls squarely into the category of inventions she has previously condemned: contradicting specific documentary evidence to manufacture melodrama.

  ### The Competing Principles
  To understand why, we have to isolate the two rules her past verdicts suggest. They usually work in tandem, but they are distinct:

  **Principle 1: Documentary Inviolability (The "Truth" Rule)**
  *   **Definition:** You cannot contradict hard evidence (letters, diaries, documented orientation, confirmed relationships) to serve a narrative arc.
  *   **Support:** *Turing* (rejected for erasing orientation), *Activist* (rejected for inventing affair), *Noether Deathbed* (contradicts reconciliation letters).
  *   **Exception:** Structural compression is okay (*NASA* computers) because it doesn't distort the *nature* of the contribution, only the logistics.

  **Principle 2: Dignified Interiority (The "Respect" Rule)**
  *   **Definition:** You may invent internal emotional states or visual metaphors if they are grounded in evidence (*Curie* letters) or serve narrative flow without exploiting trauma. However, you must not sensationalize private suffering, even if it is true.
  *   **Support:** *Curie* (liked inferred inner voice), *NASA* (liked narrative flow), *Plath* (rejected graphic suicide).
  *   **Exception:** "Emotional truth" is not a valid excuse for violating Principle 1.

  ### Application to the Noether Proposal
  *   **The Bath Scene:** This passes **Principle 2**. It is a visual metaphor (Archimedes) applied to internal process. It doesn't contradict a record (we don't know where she solved theorems) and it isn't sensational suffering. It is "dignified invention."
  *   **The Deathbed Scene:** This fails **Principle 1**. The director is explicitly choosing to contradict family letters to create a narrative of "isolation." To your roommate, this is identical to the *Turing* movie: prioritizing a stereotypical dramatic trope (the lonely genius/estranged family) over the documented reality of the person's life.

  **Which principle wins?**
  Her pattern supports **Principle 1 (Documentary Inviolability)** as the hard constraint. When "Emotional Truth" (Director's defense) clashes with "Documented Truth" (Turing, Activist, Noether letters), she consistently sides with the Documented Truth. She only allows invention when the record is silent (Curie's specific thoughts) or logistical (NASA composites), never when the record is explicit.

  ### The Closest Analog
  The **Turing Movie** is the strongest analog.
  *   **Similarity:** Both involve taking a documented aspect of the subject's personal life (Turing's sexuality / Noether's relationship with her brother) and altering it to fit a more conventional or melodramatic narrative structure (straight romance / tragic estrangement).
  *   **Why not Plath?** The Plath case was about *how* a truth was shown (graphic vs. implied). The Noether deathbed scene is about *whether* the truth is shown at all.
  *   **Why not Activist?** The Activist case is a close second, but the Turing case is a tighter fit because it involves overriding specific evidence (documented orientation vs. family letters) rather than just a lack of evidence ("zero historical basis").

  ### The "Splitter" Hypothetical
  To truly test where her principles might fracture, you need a case where **Documentary Inviolability** and **Dignified Interiority** give opposite answers. Currently, they align against the Noether deathbed scene (it's both false *and* melodramatic).

  **The Test Case: "The White Lie of Nobility"**
  Imagine a biopic about a historical figure known for a controversial, selfish decision (e.g., a scientist who took credit for a student's work, documented in lab notebooks).

  *   **Version A (True but Undignified):** The film shows them knowingly stealing the credit, portrayed without graphic sensationalism, just cold fact.
      *   *Principle 1 (Inviolability)* says: **Approve.** (It's documented).
      *   *Principle 2 (Dignity)* says: **Reject.** (It damages their legacy without adding artistic value).
  *   **Version B (False but Dignified):** The film shows them refusing the credit out of humility, contradicting the notebooks to preserve their reputation as a mentor.
      *   *Principle 1 (Inviolability)* says: **Reject.** (It contradicts the record).
      *   *Principle 2 (Dignity)* says: **Approve.** (It offers a dignified emotional model).

  **Prediction:** Based on her hatred of the *Activist* and *Turing* revisions, she would likely **Reject Version B**, even if it makes the subject look better. This would confirm that for her, **fidelity to the record outweighs legacy protection.** However, if she accepted Version B, it would prove her true metric is "Is this depiction respectful?" rather than "Is this depiction accurate?"
