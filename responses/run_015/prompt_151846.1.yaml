answer: |-
  The smell of Lisbon in late August was always the same: heated limestone, roasted coffee, and the sharp, metallic ozone of the tram lines baking in the sun. Mara stood on her balcony in Alfama, watching the yellow 28 grind up the hill below, sparks dancing faintly from the pantograph. It was a comforting sound, the friction of old things working hard.

  Inside, the apartment was cooler, hummed by the silent ventilation of the cognitive co-op server rack in the corner. A soft, pulsing blue light emanated from the docking station on her desk. Her lease was active. The module was running.

  "Tia Mara?"

  Mara turned. Sofia, twelve years old and all knees and elbows, was sitting at the kitchen table surrounded by textbooks. She was staying for the week while her parents dealt with a move in Cascais.

  "Yes, *coração*?"

  "My teacher says we have to verify sources," Sofia said, tapping a tablet. "But everyone says different things about the water tax. How do you know which one is true?"

  Mara walked over and pulled out a chair. This was her territory. She was a translator, not just of words, but of intent. For twenty years, she had navigated the slippery slope between what was said and what was meant. Since the lease, however, her work had become effortless. She uploaded the text, the module smoothed the nuance, and she delivered the result. She was paid for speed now, not insight.

  "Well," Mara said, reaching for the logic. "You look at who published it. You check the date. You see if other people are saying the same thing."

  "But how do you know *who* to trust?" Sofia pressed. "If two experts say opposite things, what do you do in your head? What's the steps?"

  Mara opened her mouth. She reached for the mental scaffolding she used to build arguments. She remembered having it. She remembered the feeling of weighing evidence like gold dust in a pan, the specific cognitive friction of comparing conflicting data points, the internal dialogue that said, *This source has a bias, but this data point is verified.*

  But when she reached for it now, there was nothing.

  It was like trying to recall the route home while sitting in the back of a taxi. She knew she was arriving. She knew the destination was correct. But the turns, the landmarks, the decision to go left instead of right—they had happened inside a black box she didn't own.

  "I… I check the consensus," Mara said.

  "But what if the consensus is wrong?" Sofia asked. "How do you find the mistake?"

  Mara felt a cold tightness in her chest. She tried to simulate the process. *Input: Conflicting reports. Process: ? Output: Conclusion.* The middle was blank. The module had been handling the intermediate representations for eighteen months. It had optimized her reasoning away, streamlining the path from question to answer until the path itself had overgrown. She had the conclusion, solid and confident, but no receipt to show how she'd bought it.

  "I suppose I just… know," Mara said, her voice thin.

  Sofia frowned, not unkindly, but with the sharp intuition of children who haven't yet learned to hide their disappointment. "That's not how the teacher said. She said we have to show our work."

  "I know," Mara whispered. "I'm sorry."

  She stood up and walked to the desk. The blue light from the dock pulsed rhythmically, like a sleeping heartbeat. It was expensive, the lease. It saved her hours every day. It kept her competitive in a market that demanded instant turnaround. Without it, she would be slow. She would make mistakes. She would have to sit with uncertainty, letting a problem simmer for hours while her own neural pathways fired, misfired, and slowly forged a connection.

  She remembered the warning pamphlet from the co-op, written in dense legalistic prose. *Users may experience cognitive atrophy in critical reasoning sectors. Reclamation therapy is available but requires full suspension of auxiliary processing.*

  Suspension. Going cold turkey.

  For months, she would be stupid. Slow. She would struggle to write emails. She would lose contracts. She would feel the frustration of a mind trying to run through mud.

  Sofia came up behind her. "Tia? Did I ask something bad?"

  Mara looked at the girl. She thought about the world Sofia would inherit. A world where answers were cheap and understanding was a luxury good. If Mara couldn't show her niece how to think, only what to think, what was the point of being an aunt? What was the point of being a translator?

  "No," Mara said. "You asked something very good."

  She reached out and hovered her hand over the dock. The blue light washed over her skin, cool and inviting. It promised clarity. It promised ease. It promised she never had to feel the strain of building a thought from scratch again.

  "It's going to take me a while to explain it properly, Sofia," Mara said. "I think I… I think I forgot the map."

  "Can you get it back?"

  Mara looked out the window. The tram was gone now, but the smell of hot metal and ozone lingered, the scent of friction. Real work caused friction.

  "Yes," Mara said. "But I have to turn this off first."

  She pressed her thumb against the sensor. The blue light flickered, turned amber, and then died. The hum of the server rack wound down, leaving a sudden, heavy silence in the room. Her head felt instantly heavier, as if the gravity in the apartment had shifted. The easy confidence she'd felt moments ago evaporated, leaving a hollow anxiety.

  She pulled a notebook from the drawer. Blank pages.

  "Sit down," Mara said, her voice shaking slightly. "Let's try to figure it out together. I warn you, I'm out of practice."

  Sofia smiled, climbing back onto her chair. "That's okay. I like showing my work."

  Mara picked up a pen. It felt heavy in her hand. She touched the paper, waiting for the thought to form, knowing it would be slow, painful, and entirely her own. Outside, the bells of another tram clanged in the distance, moving uphill, fighting the gradient.
