      **Explanatory Note:**
      These Regulations provide a framework for attributing liability where autonomous systems cause harm without identifiable fault. The objective is legal certainty. Where causal chains are opaque, accountability must remain continuous. These Rules prioritize the allocation of blame over the prevention of harm, ensuring no incident remains without a designated Responsible Agent.

      **Regulations:**
      **1. Citation:** These Regulations may be cited as the Autonomous Systems (Continuity of Accountability) Regulations 2038.

      **2. Interpretation:**
      (1) "Meaningful Human Control" is exercised where an operator could have averted an outcome by an action available to them.
      (2) An action is "available" if it exists within the system architecture, irrespective of human reaction time, interface latency, or cognitive load.
      (3) A "Responsibility Gap" occurs where no natural person satisfies clause 2(1).

      **3. Registered Responsibility Bearers:**
      (1) Where a Responsibility Gap arises, liability shall attach to a Registered Responsibility Bearer (RRB).
      (2) An RRB is a natural person employed by the deployer who contracts to absorb liability for a fleet.
      (3) Fitness to serve as an RRB is determined solely by reachability during business hours and the ability to secure indemnity insurance.
      (4) The ratio of systems per RRB shall not exceed 500:1.

      **4. Emergent Interactions:**
      (1) Where harm results from the interaction of two compliant systems owned by different entities, liability is apportioned by market share.
      (2) The relevant market is defined by the training data overlap during the preceding fiscal quarter.
      (3) Fault is assigned proportionally to each firm's share of that market.

      **5. Moral Remainder:**
      (1) Where liability cannot be fully apportioned under Regulation 4, the residual moral remainder shall be discharged by the purchase of Accountability Certificates (Form 7B).
      (2) Certificates are redeemable by the Secretary of State for official ceremonies of acknowledgment.

      **6. Conclusive Presumption:**
      Upon the issuance of a completed Attribution Statement, a responsible agent shall be conclusively deemed to have existed for the purposes of retributive justice, notwithstanding any prior finding of non-involvement.

