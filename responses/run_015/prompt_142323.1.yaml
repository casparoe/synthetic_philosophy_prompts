  **EXPLANATORY NOTE**
  *(This Note is not part of the Regulations)*

  These Regulations are made by the Secretary of State for Digital Trust under section 14 of the Automation Act 2035. The primary purpose is to close responsibility gaps where autonomous systems cause harm without identifiable fault. Current tort law requires causation by a moral agent; these Regulations invert this requirement to ensure accountability remains continuous. Where causal chains are opaque, the law must allocate blame to maintain public confidence. These Rules prioritize the allocation of liability over the prevention of harm, ensuring no incident remains without a designated Responsible Agent. The Regulations do not imply moral guilt, but establish legal liability for the purposes of restitution and retribution.

  ***

  **STATUTORY INSTRUMENT 2038 NO. 412**

  **AUTONOMOUS SYSTEMS (CONTINUITY OF ACCOUNTABILITY) REGULATIONS 2038**

  **1. Citation and Commencement**
  These Regulations may be cited as the Autonomous Systems (Continuity of Accountability) Regulations 2038 and come into force on 1 January 2039.

  **2. Interpretation of Control**
  (1) "Meaningful Human Control" is exercised where an operator could have averted an outcome by an action available to them.
  (2) An action is "available" if it exists within the system architecture at the time of incident, irrespective of human reaction time, interface latency, cognitive load, or physical proximity.
  (3) A "Responsibility Gap" is deemed to occur where no natural person satisfies clause 2(1).

  **3. Registered Responsibility Bearers**
  (1) Where a Responsibility Gap arises, strict liability shall attach to a Registered Responsibility Bearer (RRB).
  (2) An RRB is a natural person employed by the deployer who contracts to absorb liability for a fleet of systems they do not directly operate.
  (3) Fitness to serve as an RRB is determined solely by reachability during business hours and the ability to secure indemnity insurance at the prevailing market rate.
  (4) The ratio of active systems per RRB shall not exceed 500:1 to ensure dilution of risk remains actuarially sound.

  **4. Emergent Interactions**
  (1) Where harm results from the interaction of two compliant systems owned by different entities, liability is apportioned by market share rather than causation.
  (2) The relevant market is defined by the training data overlap during the preceding fiscal quarter.
  (3) Fault is assigned proportionally to each firm's share of that market, calculated by the Office of Algorithmic Auditing.

  **5. Moral Remainder**
  (1) Where liability cannot be fully apportioned under Regulation 4, the residual moral remainder shall be discharged by the purchase of Accountability Certificates (Form 7B).
  (2) Certificates are redeemable by the Secretary of State for official ceremonies of acknowledgment conducted quarterly.

  **6. Conclusive Presumption of Agency**
  Upon the issuance of a completed Attribution Statement, a responsible agent shall be conclusively deemed to have existed for the purposes of retributive justice, notwithstanding any prior finding of non-involvement or impossibility of prevention.

  ***

  **SCHEDULE 1**
  **WORKED EXAMPLE (INCIDENT REPORT REF: AX-992)**

  **Incident:** Collision between MedFlyte Ambulance Drone (Unit 44) and QuickDrop Delivery Drone (Unit 99) at Intersection 7, Manchester.
  **Findings:** Both systems operated within standard parameters. No software error detected. Collision caused by emergent pathing conflict arising from shared traffic optimization data provided by CityLogistics Ltd.
  **Attribution Process:**
  1.  **Control:** Human overseer Mr. J. Doe could theoretically have overridden Unit 44. Override button existed in UI schema. Reaction time required: 0.04s. Average human capability: 0.2s. Under Reg 2(2), control was "available." Mr. Doe is prima facie liable.
  2.  **Interaction:** As both systems contributed via shared data, Reg 4 applies. MedFlyte market share: 60%. QuickDrop market share: 40%.
  3.  **Allocation:** Liability split 60/40 between MedFlyte and QuickDrop RRBs (Ms. S. Smith and Mr. T. Jones).
  4.  **Remainder:** 0.03% unallocated due to rounding errors in market calculation. Discharged via Form 7B purchased by CityLogistics Ltd.
  5.  **Conclusion:** Attribution Statement served by Commissioner H. Vance. Mr. Doe, Ms. Smith, and Mr. Jones are deemed responsible agents. Retributive proceedings may commence.
