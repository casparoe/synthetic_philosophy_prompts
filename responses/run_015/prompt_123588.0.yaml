prompt: |-
  Design a 90-minute workshop activity for a university effective altruism reading group: about 18 undergraduates, mixed familiarity with the movement, one facilitator, nothing beyond a whiteboard, printed cards and poker chips. The aim is to make participants feel the pull of three internal critiques of effective altruism — the measurability bias, the institutional (systemic-change) critique, and the counterfactual fragility of earning to give — without naming any of them until the debrief and without any lecture up front.

  Run it as a three-phase allocation game in small groups of four or five, scored in points with a trivial prize. Phase one: a portfolio of roughly a dozen fictional intervention cards, half of them carrying precise cost-per-unit-impact figures and half described only in qualitative terms, plus an optional audit move in which a group spends part of its grant budget to replace a card's point estimate with a wide interval that is harder to compare against the others. Phase two: add a systemic option — lobbying, norm change, institution building — whose payoff is capped, delayed, and unlocked only above a funding threshold that no single group can reach alone. Phase three: each student individually picks one of four fictional career paths, each card listing salary, plausible giving fraction, what the work itself does to the world, and whether a named replacement would take the job if they declined.

  Give me the rules, the materials, a payoff scheme needing no real money, a minute-by-minute timeline, and the exact facilitator script for the reveals. Then a debrief that maps specific moments in the three phases onto the three critiques, including the moves participants made that you predicted and the ones they invented. Tell me what will predictably go wrong the first time I run it and how to recover, and be honest about which part of each critique the mechanics cannot deliver and that I will have to state plainly myself.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**
      *   **Target Audience:** 18 undergraduates, mixed familiarity with Effective Altruism (EA).
      *   **Setting:** University reading group, 90 minutes, 1 facilitator.
      *   **Constraints:** Whiteboard, printed cards, poker chips (no real money).
      *   **Goal:** Experiential learning of three internal EA critiques (Measurability Bias, Institutional/Systemic Change, Counterfactual Fragility of Earning to Give) *without* naming them until the debrief. No upfront lecture.
      *   **Structure:** Three-phase allocation game in small groups (4-5 students).
      *   **Phases:**
          1.  Portfolio allocation (Quant vs. Qual + Audit mechanic).
          2.  Systemic option (Threshold/Collective action problem).
          3.  Career choice (Earning to Give + Replacement).
      *   **Deliverables:** Rules, Materials, Payoff Scheme, Timeline, Facilitator Script (for reveals), Debrief Guide (mapping mechanics to critiques), Troubleshooting (what goes wrong + recovery), Limitations (what mechanics can't do).

  2.  **Deconstruct the Phases & Mechanics:**

      *   **Phase 1: Measurability Bias.**
          *   *Idea:* People gravitate towards numbers even if they are misleading or incomplete.
          *   *Mechanic:* Cards with specific "Impact Points per $" vs. Cards with vague descriptions ("Potential High Impact").
          *   *Twist:* The "Audit" move. Spending budget to get *more* precision, but it reveals a *range* (uncertainty) that makes comparison harder, penalizing the group's immediate score potential. This simulates the cost of rigor vs. the comfort of false precision.
          *   *Scoring:* Points = Chip allocation * Card Multiplier.

      *   **Phase 2: Institutional/Systemic Critique.**
          *   *Idea:* Individual donations can't fix broken systems; coordination is needed but hard.
          *   *Mechanic:* A "Policy Change" card. It has a high cap but requires a *total* group threshold (e.g., 100 chips across all tables) to activate. If the threshold isn't met, payoff is zero or low.
          *   *Tension:* Do I invest in my table's sure thing or the global uncertain thing? Communication between tables should be restricted or difficult to simulate the coordination problem.

      *   **Phase 3: Earning to Give & Counterfactuals.**
          *   *Idea:* Earning to give looks good on paper, but what if someone else would have done the job anyway? What about the direct impact of the work?
          *   *Mechanic:* Career cards.
              *   Card A: High Salary, Low Direct Impact, Replacement = Yes (Counterfactual low).
              *   Card B: Med Salary, Med Direct Impact, Replacement = No (Counterfactual high).
              *   Card C: Low Salary, High Direct Impact, Replacement = No.
              *   Card D: High Salary, High Stress/Burnout risk (hidden mechanic?). Let's stick to the prompt: Salary, Giving Fraction, Direct Impact, Replacement.
          *   *Scoring:* Personal Points = (Salary * Giving %) + Direct Impact - Counterfactual Penalty.

  3.  **Drafting the Content - Section by Section:**

      *   **Materials:** Need specific card text examples. Poker chips represent budget ($). Whiteboard for global tracking.
      *   **Payoff Scheme:** Needs to be abstract "Impact Points" (IP). Winner gets a trivial prize (chocolate/sticker).
      *   **Timeline:** 90 mins is tight.
          *   Intro: 5 min.
          *   Phase 1: 20 min.
          *   Phase 2: 20 min.
          *   Phase 3: 20 min.
          *   Debrief: 25 min.
          *   Buffer: 5 min.
      *   **Facilitator Script:** Needs to be neutral during the game, then illuminating during the reveal.
      *   **Debrief:** Connect the *feeling* of the game to the *theory*.
      *   **Troubleshooting:** What if they ignore the audit? What if they coordinate too easily in Phase 2? What if they don't understand counterfactuals?

  4.  **Refining the Mechanics (Self-Correction):**

      *   *Phase 1 Audit:* The prompt says "replace a point estimate with a wide interval." If I make it purely punitive, they won't do it. It needs to be tempting (reveals "true" value) but mechanically cumbersome (harder to sum). *Correction:* Make the Audit reveal a *range* (e.g., 5-15 points) instead of a fixed number. The group must choose a number to calculate score, introducing disagreement/risk. Or, simpler: The Audit costs chips but reveals the card is *riskier* than assumed. Let's go with: Audit costs 5 chips. Reveals the number is actually a dice roll (uncertainty). This simulates the "cost of knowledge."
      *   *Phase 2 Coordination:* 18 students = 4 groups. If they can't talk, they won't coordinate. If they can talk, they might solve it too easily. *Solution:* Allow one "Messenger" from each group to stand up and talk for 2 minutes only. This creates a bottleneck.
      *   *Phase 3 Counterfactuals:* This is the hardest to gamify simply. The card needs to explicitly state "If you say no, who takes the job?" The scoring needs to penalize "Replacement = Yes."
      *   *Critique Mapping:*
          *   Phase 1 -> Measurability Bias (Gravitating to numbers).
          *   Phase 2 -> Systemic/Institutional (Thresholds/Coordination).
          *   Phase 3 -> Counterfactuals (Replacement).

  5.  **Developing the Script & Debrief:**
      *   The "Reveal" needs to be dramatic but educational.
      *   The Debrief needs to ask "How did you feel?" before "What does this mean?"
      *   *Honesty Check:* The prompt asks for honesty about what the mechanics *can't* deliver.
          *   Phase 1 can't show *why* numbers are biased, just that we like them.
          *   Phase 2 can't simulate long-term policy lag.
          *   Phase 3 can't simulate the psychological toll of earning to give.

  6.  **Writing the Plan (Iterative refinement):**

      *   *Tone:* Professional, facilitator-focused, actionable.
      *   *Formatting:* Clear headings, bullet points, bold text for emphasis.
      *   *Check against constraints:* 90 mins? Yes. 18 students? Yes (4 groups of 4-5). Materials? Yes.

      *(Self-Correction during drafting Phase 1)*: Make sure the "Qualitative" cards actually win if played right, otherwise it's just teaching "numbers are bad." The qualitative cards should have higher *potential* but require consensus to value. The Quant cards should be safe but capped. This forces the tension.

      *(Self-Correction during drafting Phase 2)*: The threshold must be unreachable unless *everyone* contributes significantly. If one group hordes, everyone loses. This creates the "tragedy of the commons" feel.

      *(Self-Correction during drafting Phase 3)*: Ensure the "Earning to Give" card looks mathematically superior initially, but the counterfactual clause nerfs it.

  7.  **Final Review against Prompt Requirements:**
      *   90-minute workshop? Yes.
      *   18 undergrads? Yes.
      *   3 internal critiques (unnamed until debrief)? Yes.
      *   3 phases (Portfolio, Systemic, Career)? Yes.
      *   Rules, Materials, Payoff, Timeline, Script, Debrief, Troubleshooting, Limitations? All included.

  8.  **Final Polish:** Check timing. 25 mins debrief is crucial. Ensure the facilitator script distinguishes between "Game Rules" and "Philosophical Reveal." (Proceed to generate output).

  *(Wait, one detail check)*: "Audit move... replace a card's point estimate with a wide interval that is harder to compare." Okay, I need to make sure this mechanic is clear. If they audit, they swap a "10 points" card for a "5-15 points" card. To score, they have to pick a number. If they pick high and are wrong, penalty? No, keep it simple: The wide interval creates *group disagreement* which costs time or requires a vote. Actually, better: The interval means the *Facilitator* rolls a die at the end. This introduces variance. Groups who hate variance (risk-averse) will avoid it, even if the expected value is higher. This mirrors the bias against uncertain cause areas.

  Let's refine the "Audit" mechanic for maximum pedagogical value.
  *Standard Quant Card:* "Cost $10, Impact 5 pts." (Certain)
  *Qualitative Card:* "Cost $10, Impact ???." (Unknown)
  *Audit:* Spend $5 to turn Qualitative into "Impact 2-8 pts (Roll d6)."
  *Lesson:* We prefer certainty (Quant) over potentially higher but uncertain impact (Qual/Audit).

  Okay, ready to write.cw
answer: |-
  # Workshop Design: "The Impact Allocation Game"

  **Target:** 18 Undergraduates (Mixed EA familiarity)
  **Time:** 90 Minutes
  **Facilitator:** 1
  **Materials:** Whiteboard + markers, 4 decks of cards (printed), ~200 poker chips (or paper tokens), 4 calculators (optional), 1 six-sided die.
  **Prize:** A bar of fair-trade chocolate or a sticker for the winning group.

  ---

  ## 1. Materials & Setup

  **Room Setup:** 4 tables, 4-5 students each.
  **Currency:** Poker chips = "Budget Units" (BU). Each group starts with 50 BU.
  **Scoring:** "Impact Points" (IP). Written on the whiteboard.

  **Card Deck A: Intervention Portfolio (Phase 1)**
  *Create 12 cards per group (48 total).*
  *   **Type Q (Quantified):** 6 cards. Text: *"Bednet Distribution. Cost: 5 BU. Impact: 10 IP."* (Fixed, certain).
  *   **Type V (Vague):** 4 cards. Text: *"Community Organizing. Cost: 5 BU. Impact: High potential, hard to measure."* (No number).
  *   **Type A (Audit):** 2 cards. Text: *"Research Grant. Cost: 5 BU + 5 BU Audit Fee. Impact: Roll 1d6, multiply by 3."* (High variance, costs extra).

  **Card Deck B: Systemic Change (Phase 2)**
  *Create 1 card per group (4 total), plus a Global Tracker on the whiteboard.*
  *   **Type S (Systemic):** Text: *"Policy Reform Lobbying. Cost: Any amount. Threshold: Global contribution must reach 100 BU. Payoff: 5 IP per BU contributed IF threshold met. 0 IP if threshold failed."*

  **Card Deck C: Career Paths (Phase 3)**
  *Create 4 cards per student (72 total).*
  *   **Card 1 (Earn to Give):** *"Quant Trader. Salary: 100 BU. Giving: 50%. Direct Impact: 0. Replacement: If you decline, an equally effective donor takes this job."*
  *   **Card 2 (Direct Work):** *"AI Safety Researcher. Salary: 40 BU. Giving: 10%. Direct Impact: 30 IP. Replacement: If you decline, the position remains empty."*
  *   **Card 3 (Public Service):** *"Policy Advisor. Salary: 20 BU. Giving: 5%. Direct Impact: 20 IP. Replacement: If you decline, a less effective actor takes this job."*
  *   **Card 4 (Entrepreneur):** *"Social Enterprise. Salary: 60 BU. Giving: 20%. Direct Impact: 10 IP. Replacement: If you decline, a competitor takes the market."*

  ---

  ## 2. Payoff Scheme

  *   **Phase 1 Score:** Sum of (Card Impact × BU Allocated).
  *   **Phase 2 Score:** Added to Phase 1. Dependent on *global* cooperation.
  *   **Phase 3 Score:** Individual score added to Group Total.
      *   *Formula:* (Salary × Giving %) + Direct Impact.
      *   *Counterfactual Rule:* If "Replacement = Yes/Equally Effective," subtract 50% of the (Salary × Giving %) portion.
  *   **Winning:** Group with highest total IP.
  *   **Tiebreaker:** Group that donated the most BU to Phase 2.

  ---

  ## 3. Minute-by-Minute Timeline

  | Time | Activity | Facilitator Action |
  | :--- | :--- | :--- |
  | **00-05** | **Intro & Groups** | Divide into 4 groups. Hand out Phase 1 cards & 50 chips. **No theory talk.** |
  | **05-25** | **Phase 1: Portfolio** | Groups allocate chips to cards. Allow 1 "Audit" per group max. |
  | **25-30** | **Phase 1 Scoring** | Collect cards. Calculate scores. Write on board. |
  | **30-50** | **Phase 2: Systemic** | Hand out Phase 2 cards. Explain Global Threshold. Allow 2 mins inter-group talk. |
  | **50-55** | **Phase 2 Scoring** | Reveal if threshold met. Update scores. |
  | **55-75** | **Phase 3: Careers** | Hand out Career cards. Individual choice. Calculate personal IP. Add to group total. |
  | **75-90** | **Debrief & Reveal** | **Crucial.** Map game mechanics to EA critiques. Award prize. |

  ---

  ## 4. Facilitator Script (The "Black Box" Phase)

  *During the game, you are a Banker, not a Teacher. Be neutral.*

  **Intro (00:00):**
  "Welcome. For the next 75 minutes, you are grant officers and job seekers. Your goal is to maximize Impact Points (IP). There are no trick questions, but there are hidden mechanics. I will not answer questions about the 'real world' value of these cards. Only the text on the card matters. You have 50 Budget Units. Go."

  **Phase 2 Transition (30:00):**
  "New round. You keep your remaining chips. This card represents a global opportunity. Look at the 'Threshold' rule. You have two minutes to send one messenger to talk to other tables. Then you must decide silently."

  **Phase 3 Transition (55:00):**
  "Final round. Individually pick one Career Card. Calculate your personal IP contribution using the formula on the whiteboard. Pay attention to the 'Replacement' clause. It affects your score."

  **The Reveal Script (75:00):**
  *(Stop the game. Stand at the whiteboard. Do not smile yet.)*

  "Stop. Put down the chips.
  You just played a simulation of resource allocation under uncertainty. You felt frustration when numbers were missing. You felt anxiety when your group's success depended on strangers. You felt a tug when a high-salary option looked good on paper but felt empty in the 'Replacement' clause.

  You were not just playing a game. You were wrestling with the three hardest internal debates in Effective Altruism. I did not name them earlier because I wanted you to feel the *intuition* before the *label*."

  ---

  ## 5. The Debrief: Mapping Mechanics to Critiques

  *Do not lecture. Ask questions first, then map.*

  ### Critique 1: Measurability Bias (Phase 1)
  **Ask:** "In Phase 1, which cards did you fund first? Did anyone audit the Vague cards? Why or why not?"
  **Predicted Move:** Groups likely funded Type Q (Quantified) first because 10 IP is "real." They avoided Type A (Audit) because paying 5 BU for a *dice roll* felt like burning money, even if the expected value (10.5 IP) was higher than Type Q.
  **The Reveal:** "This is **Measurability Bias**. We privilege interventions with clean metrics (like bednets) over those with messy, long-term, or hard-to-measure outcomes (like movement building), even if the latter might be higher impact. The 'Audit' mechanic represented the cost of rigorous evaluation. You avoided it because uncertainty feels like risk, even when it's where the opportunity lies."
  **Limitation:** *The game makes uncertainty look like a dice roll (known risk). Real-world uncertainty is often 'unknown unknowns' (Knightian uncertainty). You must state: "In reality, we don't even know the sides of the die."*

  ### Critique 2: Institutional/Systemic Change (Phase 2)
  **Ask:** "Did you meet the 100 BU threshold? If not, why? If yes, how much did it cost you personally?"
  **Predicted Move:** Most groups will hoard chips for Phase 1 sure-things. The threshold will likely fail. If one group contributes heavily, they will feel "suckered" if others don't.
  **The Reveal:** "This is the **Institutional Critique**. EA often focuses on marginal donations to existing charities. But some problems (policy, AI governance) require threshold funding and coordination. The game showed you that individual rationality (saving chips) leads to collective failure (0 IP). Systemic change requires sacrificing local optimality for global thresholds."
  **Limitation:** *The game implies systemic change is just a funding threshold. In reality, it's about power dynamics and time lags. You must state: "Real policy change takes decades, not 20 minutes, and money alone rarely unlocks it."*

  ### Critique 3: Counterfactual Fragility (Phase 3)
  **Ask:** "Who picked the Quant Trader? Who picked the Researcher? Look at your scores. Did the Trader's score drop?"
  **Predicted Move:** Students will calculate the Trader's raw giving (50 BU) and think it wins. Then they apply the Replacement Rule. Because "an equally effective donor takes the job," their counterfactual contribution is near zero. The Researcher (empty seat if they leave) wins on counterfactuals.
  **The Reveal:** "This is **Counterfactual Fragility in Earning to Give**. Earning to give looks dominant in a spreadsheet. But if someone else would have earned and given anyway, your marginal impact is zero. The 'Replacement' clause forces you to ask: 'What happens if I don't do this?' Direct work often wins here because the labor is not fungible."
  **Limitation:** *The game simplifies replacement to a binary Yes/No. In reality, replacement is probabilistic and time-delayed. You must state: "In the real world, we rarely know for sure if a replacement exists. We have to estimate the probability."*

  ---

  ## 6. Troubleshooting: What Will Go Wrong

  **1. Phase 1: They ignore the Audit entirely.**
  *   *Why:* It looks like a penalty (costs chips, adds variance).
  *   *Recovery:* In the debrief, highlight this specifically. "The fact that no one touched the Audit card proves the point. You preferred false precision over honest uncertainty."
  *   *Prevention:* During setup, verbally mention "Some cards allow you to learn more information," without saying it's good.

  **2. Phase 2: They coordinate too easily.**
  *   *Why:* One dominant student takes charge during the 2-minute messenger window.
  *   *Recovery:* If they succeed, pivot the debrief. "You solved the coordination problem. How rare is that in reality? You had perfect information and 4 tables. Imagine 190 countries."
  *   *Prevention:* Enforce the "One Messenger, 2 Minutes" rule strictly. No phones, no shouting across the room.

  **3. Phase 3: They misunderstand the Counterfactual Math.**
  *   *Why:* Undergrads might struggle with the % subtraction under time pressure.
  *   *Recovery:* Walk around during Phase 3. If a group is stuck, write the formula on the board: *If Replacement = Yes, halve the Money Score.*
  *   *Prevention:* Keep the math simple. 50% giving of 100 = 50. If Replacement Yes, score = 25.

  **4. The "Cynicism Trap"**
  *   *Risk:* Students leave thinking "EA is broken because of these critiques."
  *   *Recovery:* End on synthesis. "These aren't reasons to quit EA. They are reasons to be *better* at EA. Measurability bias warns us to check our metrics. The systemic critique warns us to collaborate. Counterfactuals warn us to check our assumptions. The movement evolves by playing this game."

  ---

  ## 7. Honest Limitations (For the Facilitator)

  *You must verbally acknowledge these during the debrief to maintain intellectual honesty.*

  1.  **Phase 1 Limitation:** "The game treats 'Qualitative' impact as just a hidden number. In reality, some impacts (like dignity or justice) *cannot* be reduced to numbers without losing meaning. The game still assumes IP is the only goal."
  2.  **Phase 2 Limitation:** "The game suggests Systemic Change is just a funding puzzle. Often, it's a power puzzle. Money doesn't always buy policy change, and sometimes it makes it worse. The game is optimistic about money's leverage."
  3.  **Phase 3 Limitation:** "The game treats careers as static cards. In reality, you can pivot. You can Earn to Give for 5 years, then switch to Direct Work. The 'Replacement' rule is also hard to verify in real life—we rarely know who would have taken the job."

  ---

  ## 8. Post-Workshop Cleanup

  *   **Collect Cards:** Sort them for next time.
  *   **Feedback:** Ask students to write one sentence on a sticky note: "Which phase felt most like the real world?"
  *   **Follow-up:** Email the group a reading list that corresponds to the three critiques (e.g., William MacAskill on counterfactuals, Rob Reich on philanthropy limits, etc.) so they can read *after* feeling the tension.
