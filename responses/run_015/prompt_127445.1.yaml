  **DEPARTMENT OF MORAL STATUS COMPLIANCE**
  **INTERNAL GUIDANCE DOCUMENT 8.2-B**
  **SUBJECT: Neurovolume (Moral Status) Regulations — Compliance FAQ**

  **1. What metric determines Moral Status Tiering under current regulations?**
  Pursuant to Amendment 19, Moral Status is calculated via the Estimated Cortical Neuron Count (ECNC). Please note that while the statute remains titled the *Neurovolume Regulations*, absolute brain volume was deprecated in Year 3 following the Cetacean Equivalence Incident, wherein sperm whales were inadvertently classified as Tier 1 Persons. Amendment 12 subsequently introduced the Encephalization Quotient (EQ) to adjust for body mass. However, following the Avian Cephalopod Review of Year 7, EQ was found to underestimate the moral status of corvids and octopuses due to neuronal density variances. Consequently, ECNC is now the standard. As direct neuron counting requires post-mortem histology, compliance officers shall utilize MRI-based volumetrics as a proxy for estimated neuron count, which serves as a proxy for cognitive capacity, which serves as the statutory proxy for moral worth.

  **2. How are non-human entities classified relative to humans?**
  Non-human entities are subject to the same ECNC scaling. Under Amendment 19, Section 4, high-density neuronal packing is credited equally regardless of taxonomic class. This ensures ethical consistency between a human subject and a New Caledonian crow possessing equivalent processing capacity. Compliance officers should note that because ECNC is an estimate based on volumetric proxies, all classifications are subject to a ±5% margin of error. Entities falling within this margin are granted Provisional Status until further imaging is available. Do not inform subjects of their provisional standing to avoid psychological distress which may alter scan results.

  **3. How are minors and fetuses rated given incomplete brain development?**
  Section 9.1 mandates the use of the Projected Adult Neurovolume (PAN) metric for subjects under age 25. Moral worth is treated as a continuous curve over the lifespan; therefore, an infant possesses the moral status of their projected adult self, discounted by developmental probability. Compliance officers must flag any environmental factors that depress PAN calculations. Pursuant to *State v. Nutrition Corp* (Year 9), any action that stunts neural growth—including malnutrition, exposure to toxins, or neglect—is prosecutable as a Dignity Tort. Parents must submit quarterly dietary logs to ensure PAN projections remain within statutory bounds. A reduction in projected status due to preventable atrophy is considered a permanent deprivation of moral rights.

  **4. What occurs when a subject falls on a Tier boundary?**
  The "Banding Problem" is addressed under Amendment 15. Subjects falling within the 95th percentile of a lower Tier are granted Partial Status privileges. Please be advised that the Tier 3/4 Boundary Group remains a registered lobbying entity. Their request for a "Sliding Scale" exemption was denied in Year 8, as moral status is binary at the point of action, even if the underlying metric is scalar. However, institutions may apply for Boundary Variance permits if housing mixed-Tier cohorts. Do not engage with protesters claiming that arbitrary lines invalidate the metric; refer them to the Statistical Validity Appendix.

  **5. Can institutional status deficits be offset?**
  Yes. Under the Moral Status Offset Program (MSOP), institutions may trade Dignity Credits. If a facility houses a population with low aggregate ECNC scores (e.g., a geriatric ward or special needs center), they may purchase credits from facilities housing high-ECNC populations (e.g., universities or research labs). This recognizes that moral status is a scalar property capable of aggregation. Offsets must be reconciled quarterly. Note that credit prices fluctuate based on the national average neuronal density; officers should hedge against demographic shifts.

  **6. How should we interpret the Inspector General's Ten-Year Audit regarding demographic disparities?**
  The Audit noted a 0.89 correlation between Moral Status Tiering and household income, childhood nutrition, and birth weight. Some stakeholders have suggested this indicates systemic bias. However, the Department maintains that this correlation validates the biological sensitivity of the ECNC metric. Since socioeconomic factors materially impact neural development, the Regulations are successfully detecting actual variances in moral worth rather than creating them. Compliance officers should treat these disparities as confirmed data points. Any attempt to artificially inflate scores in low-income demographics without corresponding biological changes constitutes fraud. The metric is functioning as designed by revealing the biological reality of moral hierarchy.

  **7. Where do I submit Form 88-Neuro?**
  Upload via the secure portal. Do not email scans.
