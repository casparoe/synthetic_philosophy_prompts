      *   *Table:* Make it crisp. Use philosophical terminology (normativity, epistemic status).
      *   *Breakdown:* Focus heavily on the Proposition vs. Grammar distinction. This is the crux. Ostension fixes grammar; Moore asserts fact.
      *   *The "Transparency" Issue:* This is crucial. Ostension works *inside* a game. Moore is trying to prove the *game board* exists.
      *   *Conclusion on the Analogy:* It fails because it conflates semantic grounding with epistemic justification.
      *   *Alternative:* *On Certainty* hinges. This shows Moore was right about the *status* of the claim (certainty) but wrong about the *method* (proof).

  8.  **Self-Correction/Review during drafting:**
