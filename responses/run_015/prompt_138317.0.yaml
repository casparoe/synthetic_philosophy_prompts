      *(Self-Correction on "Fatal"):* A "fatal" objection must show the theory is internally inconsistent or contradicts the phenomenon it aims to explain so severely it's useless. The "Public Science" objection is the strongest candidate here. If confirmation cannot be shared, it's not scientific confirmation.

