      *   **Introduction:** Acknowledge the strength of the position (it avoids the "probability 1" trap) but state the intent to stress-test it.
      *   **Load-Bearing Analysis:** Claim 3 is the engine. Claim 1 motivates it. Claim 2 clears the ground. If 3 falls, 1 becomes a mere observation, not a solution.
      *   **Addressing Question 1 (Claim 1 & 3 Status):**
          *   *Critique:* Claim 1 is essentially the "Logical Omniscience" problem. If it's just that, it's not a *new* diagnosis, it's a renaming.
          *   *Falsifiability:* Claim 3 is hard to falsify because "confidence in derivation" is subjective. It risks becoming a "research program" (Lakatosian) where every counter-example is explained away by adjusting confidence in $D$. This is a defect for a normative thesis.
