      *   **The Position (Three Parts):**
          1.  *Diagnosis:* The problem isn't about "old" evidence (probability 1). It's about the framework's inability to represent *learning a connection* (entailment/relevance) between propositions already accepted. (Generalizes to mathematical proofs, relevance realizations, etc.)
          2.  *Critique of Repairs:* Counterfactual/ur-priors are mistaken in principle (double-counting evidence, impossible credal states).
