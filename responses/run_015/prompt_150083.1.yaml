  ### The Asymmetric Vulnerability Constraint

  To achieve reflective equilibrium across your six cases, you require a principle that distinguishes categorically between **harm avoidance** (which applies to potential persons) and **benefit provision** (which does not). Your oscillation in Cases 5 and 6 stems from attempting to apply Expected Utility Theory (EUT) to procreation, where you weigh probabilities of suffering against probabilities of flourishing. Your verdicts on Cases 1, 3, and 4, however, rely on a deontological constraint against imposing severe suffering.

  To make your view consistent, you must adopt a **lexical priority** where the avoidance of severe suffering in a potential person vetoes any expected benefit, whether for that person or for others.

  Here is the precise formulation of the principle, the mapping to your cases, the verdict on a new scenario, and the cost to your current intuitions.

  #### I. The Principle Statement

  **The Asymmetric Vulnerability Constraint**

  1.  **The Harm Veto:** It is impermissible to initiate the existence of a person if there is a foreseeable, significant probability that they will experience severe, unmitigated suffering.
  2.  **The Benefit Neutrality:** There is no moral obligation to initiate the existence of a person, even if their life is expected to be happy; choosing non-existence is morally neutral.
  3.  **The Existing Priority:** When resources are finite, alleviating severe suffering in *existing* beings takes moral precedence over creating new happy lives.
  4.  **The Non-Instrumentalization:** A potential person's risk of severe suffering cannot be morally offset by benefits accruing to third parties (existing or potential).

  #### II. Mapping Clauses to Your Verdicts

  *   **Clause 1 (The Harm Veto)** resolves **Case 1** (termination for severe pain) and **Case 3** (knowingly conceiving suffering). It establishes that severe suffering is a disqualifying condition for procreation.
  *   **Clause 2 (The Benefit Neutrality)** resolves **Case 2** (childless by choice). It confirms that failing to create happiness is not a moral failing, grounding the permissibility of non-existence.
  *   **Clause 3 (The Existing Priority)** resolves **Case 4** (forgoing child to aid others). It explains why redirecting resources to reduce existing suffering is admirable (or potentially obligatory) rather than blameworthy. It stabilizes your approval here: you are prioritizing the *certain* reduction of existing suffering over the *potential* happiness of a new life.
  *   **Clause 4 (The Non-Instrumentalization)** addresses **Case 6** (geopolitical risk). It forbids using a new person as a vehicle for global good if the cost is their own significant risk of severe suffering.

  #### III. Resolution of Oscillations (Cases 5 & 6)

  *   **Case 5 (High-Variance Embryo):** The principle dictates **Impermissible**.
      *   *Logic:* Under EUT, you oscillate because the expected value might be positive. Under the Harm Veto (Clause 1), the "floor" of the variance matters more than the "ceiling." If one option guarantees moderate contentment and the other introduces a risk of *severe suffering*, the risk vetoes the selection. The intuition that "rejecting high-variance treats happiness as too cheap" must be discarded; under this framework, safety from severe suffering is lexically prior to the magnitude of flourishing.
  *   **Case 6 (Geopolitical Instability):** The principle dictates **Impermissible**.
      *   *Logic:* This resolves your worry about Case 4's stability. Case 4 is stable because it trades *potential happiness* for *existing relief*. Case 6 attempts to trade *potential safety* for *existing relief*. The principle holds that you may sacrifice potential happiness (Case 4), but you may not sacrifice potential safety (Case 6). Your approval of Case 4 does not imply permission for Case 6; rather, it highlights the asymmetry between creating harm and failing to create benefit.

  #### IV. Verdict on a New Scenario

  **Scenario:** A couple uses embryo selection to choose between Embryo A (predicted life of moderate contentment) and Embryo B (predicted life of exceptional flourishing). Neither embryo carries a risk of severe suffering or significant health deficits.

  **Verdict:** **Permissible (Indifferent).**
  *   *Logic:* Clause 2 (Benefit Neutrality) applies. Since the Harm Veto is not triggered (no severe suffering risk), there is no moral obligation to maximize welfare. Selecting A is not wrong; selecting B is not required. The moral weight is neutral because no harm is being avoided or inflicted in either choice. This prevents the principle from sliding into eugenic maximization while retaining the prohibition on harm.

  #### V. The Cost: Intuitions to Overturn

  To maintain this logical consistency, you must explicitly overturn two intuitions currently causing your oscillation:

  1.  **The Expected Utility Intuition in Procreation:** You must abandon the view that a high probability of exceptional flourishing can mathematically cancel out a low probability of severe suffering in procreative decisions. In population ethics, suffering acts as a veto, not a variable in a sum.
  2.  **The Instrumental Justification:** You must reject the notion that a child's life can be justified by their utility to others if their own baseline welfare is at significant risk. This means accepting that in times of high instability (Case 6), procreation may be wrong *even if* the child might save the world. The child's right not to be subjected to grave risk outweighs the world's potential gain.

  ***

  ### Principle Summary

  **Name:** The Asymmetric Vulnerability Constraint

  **Core Logic:** Suffering creates a moral claim for potential persons; happiness does not. Safety is lexically prior to flourishing.

  **Clauses & Motivations:**
  1.  **Harm Veto:** Forbidden to create if significant risk of severe suffering exists. (Motivated by Cases 1, 3).
  2.  **Benefit Neutrality:** No duty to create happy lives. (Motivated by Case 2).
  3.  **Existing Priority:** Reducing existing suffering outweighs creating new happiness. (Motivated by Case 4).
  4.  **Non-Instrumentalization:** Potential person's risk cannot be traded for third-party benefit. (Motivated by Case 6).

  **Verdict on New Scenario:** Selecting between "Moderate Happiness" and "High Happiness" embryos (with no suffering risk) is morally indifferent; maximization is not required.

  **Required Revision:** You must overturn the intuition that Expected Utility maximization applies to Case 5 (Variance) and Case 6 (Instrumental Benefit). The possibility of exceptional contribution or flourishing cannot justify imposing a significant risk of severe suffering on the new person.
