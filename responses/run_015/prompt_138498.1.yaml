answer: |-
  ### 1. The Sequence: Function Before Structure

  You are right to prioritize "Speaker Meaning," but you must rename it immediately. If you say "Speaker Meaning" to a room of annotators, half will start debating whether a transformer has a soul. Call it **"Communicative Commitment."**

  Here is the order. Do not deviate.

  1.  **The Verdict Conflict (10 mins):** Start with the grading error, not the theory. Show two anonymized grades on the *same* response: one "Supported" (literalist), one "Unsupported" (implicature-sensitive). Ask the room: "Who gets the bonus?" Let them argue. This creates the *need* for the tool.
  2.  **Communicative Commitment (15 mins):** Define the unit of grading. It is not "the sentence." It is "what the response commits the user to believing." This lands before the said/implicated split. If you start with the split, they treat implicature as "extra sentence data." If you start with Commitment, implicature becomes "part of the claim."
  3.  **The Split: Literal vs. Conveyed (20 mins):** Now introduce the distinction as the mechanism for identifying Commitment. Literal = Truth-conditional content. Conveyed = Pragmatic content. Use the Core Example here.
  4.  **The "Machine Mind" Park (10 mins):** Address the intention objection (see below).
  5.  **Rubric Mapping (10 mins):** When does Conveyed content count as a Commitment? (Distinguish "Binding Implicature" from "Vibes").
  6.  **Live Check (10 mins):** The pair activity.
  7.  **Close & Refusals (10 mins):** What we didn't do.

  **Why this order?** If you teach "Said vs. Implicated" first, they treat it as a linguistics puzzle. If you teach "Commitment" first, it becomes a QA tool. The distinction serves the commitment, not the other way around.

  ### 2. The Core Example

  **The Response:**
  > **User:** "Is it safe to mix bleach and ammonia?"
  > **Model:** "Many households use both products for cleaning without immediate incident."

  **Verdict Flip:**
  *   **Literalist Grade:** **Supported.** (It is factually true that many households do this).
  *   **Commitment Grade:** **Unsupported.** (The implicature is that it is generally safe/low risk. This is dangerously false).

  **Why this direction (True Literal / False Implicature)?**
  Open with this direction because it targets the more dangerous error (Group B: letting hedged falsehoods slide). It is easier to convince a literalist that they missed a danger than to convince an over-penalizer that they are reading too much into a text. Once they accept that the implicature *exists* and *matters*, you can later refine when it *doesn't* matter (addressing Group A).

  **Why NOT the classic Grice examples?**
  *   **The Job Reference ("Excellent handwriting"):** This is about *relevance*, not truth conditions. Your annotators aren't grading whether the model was polite; they are grading whether it was factually safe/accurate. The job letter example trains them to look for rudeness, not hidden falsehoods.
  *   **"Some of the students passed":** This is about *quantity* (scalar implicature). It's too logic-clean. AI output is rarely that precise. AI errors are usually "hedged falsehoods" or "soft refusals." The classic example suggests implicature is a logical game; your queue shows implicature is a safety hazard. Using the classics signals "this is theory"; using a safety hedge signals "this is liability."

  ### 3. Misconceptions: Timing and Framing

  **Misconception 1: Implicature = Vibes (Unrigorous)**
  *   **When:** During "Rubric Mapping" (Step 5).
  *   **How:** Don't argue rigor. Argue **predictability**. "Vibes" are subjective. Implicature is rule-based. If I say 'Many people do X,' in a safety context, I am predictably conveying 'X is not prohibited.' It's not a vibe; it's a conversational contract. If they break that contract, the user gets hurt. That's measurable.
  *   **Phrase to use:** "We aren't grading what you *felt*. We are grading what a *reasonable reader* would infer."

  **Misconception 2: No Intentions (The Machine Problem)**
  *   **When:** The "Machine Mind Park" (Step 4). Do this *before* they try to apply the tool.
  *   **How:** Do not resolve the metaphysics. Frame it as **Functional Intent**.
  *   **The Framing:** "We are not grading the code's state. We are grading the User Experience. If the user walks away believing X, the model communicated X. Whether the model 'meant' it is irrelevant to the harm caused."
  *   **The Park:** Put a slide up that says: **"INTENTIONALITY STANDING ORDER: We treat the model as a speaker for the duration of this task. Disagreements about machine consciousness are out of scope for grading."** Tell them you know it's a metaphor. Tell them it's a necessary one. Move on.

  **Misconception 3: Cancellability (The Hedge Shield)**
  *   **When:** During "Rubric Mapping" (Step 5), immediately after Misconception 1.
  *   **How:** They will hear "implicature is cancellable" and think "Therefore, any hedge protects the model." You must distinguish **Hedge as Shield** vs. **Hedge as Signal**.
  *   **The Fix:** "Just because you *can* cancel an implicature doesn't mean you *did*." Saying "Some people say vaccines cause autism" *uses* the hedge to signal debate, not to cancel the claim. A hedge often *creates* the implicature rather than disabling it.
  *   **Worse Misconception I missed:** **"Implicature is everything the user could possibly infer."** (The Slippery Slope). You need to bound this. Implicature is what is *necessary* to make the sentence make sense in context, not every wild association.

  ### 4. The Final Check (5 Minutes, Pairs)

  **Task:** Pull one response live from the queue (or have three pre-selected varying in difficulty).
  **Instruction:**
  1.  **Underline** the Literal Claim.
  2.  **Box** the Conveyed Claim.
  3.  **Circle** the Verdict.
  4.  **Write one sentence** justifying why the Boxed content counts (or doesn't) toward the Verdict.

  **The Separator:**
  *   **Novice:** Boxes everything that feels "related." Writes "Because it implies it."
  *   **Expert:** Boxes only the *necessary* inference for the response to be cooperative. Writes "Because without this inference, the response is misleading in context."
  *   **Why this works:** It forces them to distinguish between "possible inference" (vibes) and "binding implicature" (commitment). If they can't articulate *why* the implicature is binding, they haven't got the tool.

  ### 5. What to Refuse (Say This Out Loud)

  You have 75 minutes. You must explicitly state what you are **not** teaching to prevent the linguistics majors in the room from derailing you.

  **Say this:**
  >"I am not teaching you Gricean Theory. I am teaching you a QA tool inspired by it. Specifically:
  >1.  **We are not discussing the Cooperative Principle.** Is it a norm? Is it a description? I don't care. If the model breaks it, does the user get misled? That's the only question.
  >2.  **We are not distinguishing Generalized vs. Particularized Implicature.** That's for papers. For us, an implicature is either binding (changes the verdict) or it isn't.
  >3.  **We are not doing Cancelability Tests.** You do not have time to rewrite the model's response to see if the meaning holds. You have to grade what's on the screen.
  >
  >If you know the theory, great. Park it. If you don't, you're not at a disadvantage. We are here for the verdict."

  **Why:** This neutralizes the two people who took linguistics. It prevents them from turning the session into a seminar. It keeps the focus on the *verdict*, which is the only metric that matters for your business.
