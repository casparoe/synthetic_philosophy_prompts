      *   *Camp Two (Selective Critic/Direct Realist):* Berkeley's argument relies on the Lockean veil of perception. If you remove the "unknown substratum" and posit direct access to external relations/structures, the argument loses its bite. Mind-independence is possible if it doesn't imply *representational* inaccessibility.

