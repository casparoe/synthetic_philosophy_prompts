answer: |-
  You are not making it up as you go. Your behavior is actually quite consistent, but it relies on a **hybrid model** of voting rather than a single pure principle. You are balancing **Instrumental Value** (can I change the outcome?) against **Expressive Value** (does this align with my values/duty?), subject to a **Cost Cap** (is it too much hassle?) and a **Preference Filter** (do I actually care?).

  Here is the principle that captures your behavior, the one tension you need to resolve, and how that principle applies to your specific dilemmas.

  ### The Principle: "Salience-Weighted Participation"

  Your voting rule can be articulated as follows:

  > **"I will vote if the election has high Instrumental Impact OR high Personal Salience, provided I have a Candidate Preference and the Cost does not exceed a specific threshold."**

  Let's map your verdicts to this principle to show the coherence:

  1.  **Local School Board (Vote):** High **Instrumental Impact** (vote matters) + Low Cost. *Verdict: Vote.*
  2.  **Close Presidential (Vote):** High **Instrumental Impact** + High **Salience**. *Verdict: Vote.*
  3.  **Safe State Legislature (Skip):** Low **Instrumental Impact** + Low **Salience** (implied, since you didn't cite duty here). *Verdict: Skip.*
  4.  **Out of Town/Close Race (Skip):** High **Instrumental Impact**, but **Cost** exceeds threshold. *Verdict: Skip.* (This establishes your hard limit).
  5.  **Foregone Presidential (Vote):** Low **Instrumental Impact**, but High **Salience/Duty**. *Verdict: Vote.*
  6.  **Don't Care Election (Skip):** Low **Salience** + No **Preference**. *Verdict: Skip.*

  ### The Tension: Safe State vs. Foregone Presidential

  There is one apparent contradiction in your data: **Why vote in a Foregone Presidential election but skip a Safe State Legislature election?**

  In both cases, your *Instrumental Impact* is effectively zero.
  *   **The Resolution:** The difference is **Salience**. You feel a "vague sense of duty" for the Presidency that you do not feel for the State Legislature.
  *   **The Coherent Principle:** Your "Duty" is not universal; it is tiered based on the office. You view the Presidency as a civic ritual you must participate in regardless of outcome, whereas you view State Legislature as purely instrumental (only vote if it changes something).

  **To be fully coherent, you must accept this tiered duty.** You cannot claim you vote out of universal civic duty, or you would have to vote in the Safe State race. You must admit your duty is conditional on the *importance of the office*.

  ### The Dilemma: The Indifferent Close Race

  *The Case:* A close race (High Instrumental Impact) between two candidates you like equally (No Preference).

  **The Verdict:** **Skip.**

  **The Reasoning:**
  Your principle includes a **Preference Filter**. You explicitly stated: *"I don't feel any pull at all to vote in an election I genuinely don't care about the result of, and I skip those without a flicker of guilt."*

  If you vote in a race where you are indifferent, you are voting randomly.
  1.  **Instrumentally:** A random vote is noise. It is statistically indistinguishable from not voting, except it adds a tiny bit of wear to the machine.
  2.  **Expressively:** You have no values to express.
  3.  **Consistency:** If you skip elections you "don't care about" without guilt, you must skip this one. Caring about the *outcome* is a prerequisite for your participation, even if the *margin* is close. Voting without preference violates your own rule about only voting when you have a stake in the result.

  ### The Unmentioned Case: The Close Referendum

  *The Case:* A close referendum on something you care a lot about (High Salience/Preference), but you are pretty sure your vote won't break the tie (Low Instrumental Impact).

  **The Verdict:** **Vote.**

  **The Reasoning:**
  This case is structurally identical to the **Foregone Presidential** election.
  *   **Instrumental Impact:** Low (You admitted your vote won't be the tie-breaker).
  *   **Salience/Preference:** High (You "care a lot").
  *   **Cost:** Assumed Normal (You didn't mention being out of town).

  Since you vote in the Foregone Presidential election based on "duty" and "caring about the result" despite knowing your vote won't change the outcome, consistency demands you vote here. The mechanism is **Expressive Voting**: you are voting to register your support for the cause, not because you believe you are the singular decider.

  ### Summary of Your Coherent Philosophy

  You are not a pure "Rational Choice" voter (who would only vote if $Probability \times Benefit > Cost$), nor are you a pure "Civic Duty" voter (who votes in everything).

  You are a **Threshold Expressivist**.
  *   **If the race is close:** You vote *unless* you are indifferent or the cost is too high.
  *   **If the race is not close:** You vote *only if* the office is high-salience (Presidential) or the issue is high-salience (Referendum) and you care deeply.
  *   **If you are indifferent:** You never vote, regardless of the margin.

  **Final Advice:** Stop feeling conflicted about the "Indifferent Close Race." Your gut is telling you to skip it because you lack a preference. That is consistent with your behavior on other "don't care" races. Save your energy for the Referendum, where your care level justifies the trip despite the odds.
