  8.  **Refining the Output:**
      *   Make it conversational but analytical.
      *   Use the "Paradox of Voting" concept lightly (user knows their vote doesn't count but votes anyway).
      *   Highlight the specific inconsistency (Safe State vs. Foregone Presidential) and explain how to resolve it (Salience).
      *   Ensure the advice on the "Indifferent Close Race" is firm based on their own rules.

  9.  **Self-Correction/Review during drafting:**
      *   *Wait, did I miss the "Out of Town" constraint?* No, that's a hard cost cap.
      *   *Is "Duty" the right word?* User used "vague sense of duty." But they also skip races they don't care about without guilt. So it's not *unconditional* duty. It's *conditional* duty based on engagement.
      *   *The "Indifferent Close Race":* If I vote randomly, am I fulfilling duty? Probably not. If the principle is "Vote to affect outcome OR express values," indifference kills the expression. So skipping is consistent with the "Don't Care" rule.
      *   *The Referendum:* User cares a lot. This triggers the "Foregone Presidential" rule (Vote despite low impact).

  10. **Final Polish:** Structure into "The Principle," "The Tension," "The Dilemma," and "The Unmentioned Case." (This matches the user's prompt structure).

