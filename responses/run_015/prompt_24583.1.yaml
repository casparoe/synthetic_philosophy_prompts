prompt: |-
  I was going back and forth with a friend last night about whether I'm even being coherent about voting, and I realized I can't really articulate what I'm going by. So I've writen down my gut verdicts and I'd like to know if there's a principle behind them, or if I'm just making it up as I go.

  Here's where I land. I vote in local school board races where I think my vote has a real shot at actually mattering, and I vote in close presidential elections. But I skip state legislature races I'm pretty sure is safe, and I'll skip even a close race if I'm out of town and getting back to the polls would be a genuine hassle. And yet I vote in a presidential election I'm confident is a foregone conclusion, mostly out of some vague sense of duty, even though I know my single vote can't possibly change the outcome. But I don't feel any pull at all to vote in an election I genuinely don't care about the result of, and I skip those without a flicker of guilt.

  The case I keep going back and forth on is a close race between two candidates I basically like equally — my vote might genuinely tip it, but since I have no strong preference I'm not sure it's worth the effort. Is there a principle that captures all of this, or at least most of it? And if not, which verdict do I have to give up, and what would the resulting principle say about a case I haven't mentioned, like a close referendum on something I care a lot about where I'm pretty sure my vote won't be the one that breaks the tie?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the User's Request:**
      *   **Goal:** The user wants to know if their voting behavior follows a coherent principle or if it's inconsistent ("making it up as I go").
      *   **Input Data (Voting Verdicts):**
          1.  *Local School Board:* Votes (if vote matters).
          2.  *Close Presidential:* Votes.
          3.  *Safe State Legislature:* Skips.
          4.  *Close Race + High Hassle (Out of Town):* Skips.
          5.  *Foregone Conclusion Presidential:* Votes (Duty).
          6.  *Don't Care About Result:* Skips (No guilt).
          7.  *The Dilemma:* Close Race + Indifferent Candidates (Unsure).
          8.  *Unmentioned Case:* Close Referendum + Care a Lot + Vote Won't Tie-Break (Needs prediction).
      *   **Task:** Identify a unifying principle, or identify the inconsistency and suggest which verdict to drop to create coherence, then apply that principle to the unmentioned case.

  2.  **Deconstruct the Voting Behavior (The "Data Points"):**
      *   *Factor 1: Impact/Instrumental Value.* (Does my vote matter?)
          *   Yes (Local School Board, Close Presidential) -> Vote.
          *   No/Unlikely (Safe State, Foregone Presidential) -> Mixed (Skip Safe, Vote Foregone).
          *   Maybe (Close Referendum) -> ?
      *   *Factor 2: Cost/Effort.* (Is it a hassle?)
          *   High (Out of Town) -> Skip (even if close).
          *   Low/Normal -> Vote (usually).
      *   *Factor 3: Duty/Civic Obligation.*
          *   High (Presidential Foregone) -> Vote.
          *   Low (Don't Care) -> Skip.
      *   *Factor 4: Preference Strength.*
          *   High (Care a lot) -> Vote.
          *   Low/None (Indifferent Candidates, Don't Care) -> Skip/Unsure.

  3.  **Search for a Unifying Principle:**
      *   *Hypothesis 1: Pure Instrumentalism (Rational Choice).*
          *   Rule: Vote if $P \times B > C$ (Probability of tipping $\times$ Benefit > Cost).
          *   *Fit:* Explains Local School Board (high $P$), Safe State (low $P$), Out of Town (high $C$).
          *   *Fail:* Explains *not* voting in Foregone Presidential (low $P$), but user *does* vote. Explains *not* voting in Indifferent Close Race (low $B$), which matches user's uncertainty.
      *   *Hypothesis 2: Pure Deontology (Civic Duty).*
          *   Rule: Vote always, regardless of outcome.
          *   *Fit:* Explains Foregone Presidential.
          *   *Fail:* Doesn't explain skipping Safe State or Out of Town or "Don't Care" races.
      *   *Hypothesis 3: Expressive Voting + Cost-Benefit.*
          *   Rule: Vote if I want to express support *and* cost isn't prohibitive, unless impact is high enough to override lack of expression.
          *   *Fit:* Explains "Don't Care" (nothing to express). Explains Foregone Presidential (express duty/support). Explains Out of Town (cost too high).
          *   *Fail:* Why skip Safe State Legislature? Is it lack of care or low impact? User says "pretty sure is safe," implying impact is the driver there.

  4.  **Synthesize a "Weighted Principle":**
      The user's behavior looks like a **Threshold Model of Civic Participation**.
      *   *Formula:* `(Impact + Duty + Preference) - Cost >= Threshold`
      *   Let's test this against the data:
          1.  *Local School (High Impact, Normal Cost):* Vote. (Impact carries it).
          2.  *Close Presidential (High Impact, High Preference):* Vote.
          3.  *Safe State (Low Impact):* Skip. (Impact too low, Duty/Preference not enough to compensate).
          4.  *Out of Town (High Cost):* Skip. (Cost outweighs Impact).
          5.  *Foregone Presidential (Low Impact, High Duty):* Vote. (Duty carries it).
          6.  *Don't Care (Low Preference, Low Duty):* Skip.
          7.  *Indifferent Close Race (High Impact, Low Preference, Low Duty):* *The Conflict.* Impact says vote, Preference/Duty say skip.

      *   *Is there a contradiction?*
          *   Yes, between **Safe State Legislature** and **Foregone Presidential**.
          *   In both, the instrumental impact is near zero.
          *   In Foregone Presidential, the user votes due to "Duty."
          *   In Safe State, the user skips. Why? Implicitly, the "Duty" isn't strong enough *unless* the office is "important" (Presidential vs. State).
          *   *Contradiction:* If Duty is the reason for voting in a foregone Presidential, why doesn't Duty apply to State Legislature?
          *   *Resolution:* The "Duty" is tied to the *salience* of the office, not the act of voting itself. Or, the "Cost" of being informed about state legislature is higher (less info available), making the effective cost higher.
          *   *Better Resolution:* The user is operating on **Expressive Utility weighted by Salience**.
          *   *Principle:* "I vote when the *symbolic weight* of the office or the *instrumental impact* of the vote justifies the cost, provided I have a preference to express."

  5.  **Addressing the Dilemma (Indifferent Close Race):**
      *   If the principle is "Impact + Preference," this case has High Impact but Zero Preference.
      *   If the principle is "Duty," does Duty apply if you don't care? User skipped "Don't Care" elections without guilt. So Duty seems tied to Caring.
      *   *Verdict:* Consistency suggests **Skipping**. If you skip "Don't Care" elections because you lack preference, you should skip "Indifferent" elections even if impact is high. Voting without preference is random, which undermines the "Duty" argument (Duty implies making a reasoned choice).

  6.  **Addressing the Unmentioned Case (Close Referendum + Care a Lot + Won't Tie-Break):**
      *   *Variables:* High Preference (Care a lot), Low Instrumental Impact (Won't tie-break), Normal Cost.
      *   *Comparison:* This is structurally identical to the **Foregone Presidential** (High Preference/Duty, Low Impact).
      *   *Prediction:* If the user votes in Foregone Presidential out of duty/expression, they should vote here.
      *   *Nuance:* Referendums are often lower salience than Presidential. But "Care a Lot" boosts the Expressive/Duty value.

  7.  **Drafting the Response:**
      *   **Acknowledge the coherence:** It's not random; it's a specific hybrid model.
      *   **Name the Principle:** "Weighted Expressive-Instrumentalism." (Or something more accessible like "The Salience-Impact-Cost Heuristic"). Let's go with **"Conditional Civic Duty."**
      *   **Break down the logic:**
          *   *Instrumental Value:* (Does it change things?) -> Drives Local/Close votes.
          *   *Expressive/Duty Value:* (Does it feel important?) -> Drives Foregone Presidential.
          *   *Cost Constraint:* (Is it too hard?) -> Vetoes Out of Town.
          *   *Preference Constraint:* (Do I care?) -> Vetoes "Don't Care" races.
      *   **Identify the Tension:** The tension between Safe State (Skip) vs. Foregone Presidential (Vote). Both are low instrumental value. The difference is *Salience*.
      *   **Solve the Dilemma (Indifferent Close Race):**
          *   This is the hardest one. High Instrumental, Zero Expressive.
          *   If you skip "Don't Care" races, you should skip this. Voting randomly violates the "Duty" aspect (which implies moral agency).
          *   *Recommendation:* Skip.
      *   **Solve the Unmentioned Case (Referendum):**
