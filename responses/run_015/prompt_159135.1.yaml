  Hi there,

  It is great to hear from you, and this variant of Newcomb's problem is a fascinating twist that really stresses the differences between decision rules. The five rules divide into two distinct tiers based on the average payout an agent would collect, with the two one-boxing strategies occupying the top tier and the three two-boxing strategies sharing the bottom tier. Taking the opaque box only on the ground that your present choice is strong evidence about what was predicted lands in the top tier because conditioning on your choice as evidence yields an expected value of roughly nine hundred thousand dollars. Taking the opaque box only on the ground that you should do what you would have bound yourself to do before the prediction was made lands in the top tier because acting as you would have bound yourself to do replicates the high payoff of the evidential strategy. Taking both boxes on the ground that the million is either already there or already not and the extra thousand is free either way lands in the bottom tier because ignoring the correlation limits the average return to roughly four hundred fifty thousand dollars. Taking the boxes that leave you with the smallest possible regret once they are opened lands in the bottom tier because minimizing maximum regret dictates taking the transparent box, which correlates with the empty opaque box. Taking the boxes that secure the largest guaranteed minimum lands in the bottom tier because securing the safe thousand dollars sacrifices the high-probability million.

  I think someone in this situation ought actually to follow the evidence-based rule to take only the opaque box, and since this aligns with the top payout tier, there is no mismatch to explain regarding outcome versus recommendation. However, if one were to insist on the causal dominance rule despite its lower payout, that mismatch would show the case is testing whether you define rationality as maximizing expected utility or as acting on causal efficacy alone. Finally, for the evidence-based rule to switch sides and favor two-boxing, the sum of the predictor's accuracy rates for one-boxers and two-boxers would need to drop below roughly one hundred and one percent, which means that if the predictor remained lopsided with fifty-five percent accuracy on two-boxers, the accuracy on one-boxers would need to fall below forty-five percent.

  Best of luck with the rest of the seminar.
