answer: |-
  Your frustration is entirely warranted, and your working hypothesis is remarkably close to the mark, though I would suggest it requires a slight sharpening to fully capture the nature of the stalemate. You are correct that the debate is not primarily about mathematics, for the mathematical equivalences between Turing machines, lambda calculus, and general recursive functions are settled facts, nor is it strictly about physics, since even those who propose hypercomputational models generally agree on the empirical data currently available. Rather, the persistence of the debate stems from a conflation of distinct claims that have been historically bundled under the single label of the Church–Turing thesis. When philosophers and computer scientists argue about the epistemic status of the thesis, they are often talking past one another because they are addressing different layers of abstraction while assuming they are discussing the same proposition. Consequently, the disagreement is indeed methodological, but more specifically, it is a dispute about the relationship between informal intuition and formal structure, and about whether the bridge between the two is discovered, stipulated, or empirically tested.

  To understand why the debate runs in place, we must first disentangle the three distinct claims that are frequently masquerading as one. The first is a mathematical claim regarding the equivalence of various formalisms of computability, which is uncontroversial and proven. The second is a conceptual claim, often attributed to Turing's original analysis, which asserts that the formal notion of Turing-computability accurately captures the pre-theoretic intuition of what a human being can calculate following a fixed set of rules without insight or creativity. This is the claim that functions as a conceptual analysis, and its justification rests on the persuasiveness of the philosophical argument that any such step-by-step procedure can be decomposed into atomic operations manageable by a Turing machine. The third is a physical claim, sometimes called the Physical Church–Turing Thesis, which posits that any function computable by a physical system in our universe is Turing-computable. This version is an empirical hypothesis about the laws of physics, potentially falsifiable by discovering a physical process that solves the halting problem or computes a non-recursive function. The stalemate arises because proponents of the conceptual analysis view treat counterexamples from physics as irrelevant changes of subject, while proponents of the empirical view treat the conceptual analysis as an unjustified restriction on what nature might permit. When one side argues that the thesis is a definition and the other argues it is a falsifiable hypothesis, they are both right about different versions of the thesis, but wrong to assume the other is addressing the same object.

  Your diagnosis that this is a disagreement about what counts as adequate justification is therefore astute, but it needs to be situated within this taxonomy of claims. For the conceptual version, justification is philosophical and relies on the adequacy of the analysis of human effective procedure. For the physical version, justification is scientific and relies on empirical investigation into the computational capacity of physical laws. The conflict persists because participants often fail to specify which justificatory regime is in play. When a physicist suggests that a Malament-Hogarth spacetime might allow for hypercomputation, they are challenging the physical thesis, but a logician may respond that this does not affect the conceptual thesis because such a spacetime does not allow for an effective procedure in the human sense. Conversely, when a logician argues that Turing's analysis of human computation is definitive, a physicist may retort that this ignores the computational potential of the universe independent of human limitations. Until the participants explicitly agree on whether they are discussing the limits of human algorithmic reasoning or the limits of physical information processing, the debate will remain a dialogue of the deaf. This is not merely a verbal dispute about the word thesis, but a substantive confusion about the ontology of computation itself, specifically whether computation is fundamentally a property of abstract symbols manipulated by agents or a property of physical dynamics independent of interpretation.

  Given this diagnosis, progress would not look like a final resolution that declares one side the winner, but rather a dissolution of the confusion through rigorous disambiguation. We would see progress if the community stopped asking whether the Church–Turing thesis is true simpliciter and started asking which version is relevant to the context at hand. In computer science and logic, the conceptual analysis remains the standard because it grounds the theory of algorithms in humanly intelligible steps. In physics and cosmology, the physical thesis is the appropriate object of inquiry, treated as a contingent claim about our universe that remains open to revision based on future theories of quantum gravity or relativity. Progress also requires acknowledging that the informal notion of effective calculability is not a static target waiting to be hit but a concept that evolves with our technological and theoretical capacities. If we develop new physical theories that allow for processes previously deemed impossible, our concept of what counts as computation may legitimately expand, provided we are clear that we are modifying the physical thesis rather than refuting the conceptual analysis of human effective procedure.

  Furthermore, advancing this debate requires a shift in philosophical methodology away from seeking a single foundational justification and toward a pluralistic understanding of computational norms. We should recognize that the Church–Turing thesis functions differently in different contexts, sometimes as a definition, sometimes as an empirical hypothesis, and sometimes as a methodological axiom. Accepting this functional pluralism would allow researchers to proceed without the burden of resolving the metaphysical status of computation before doing work in the field. It would allow the physicist to explore hypercomputation without threatening the logician's foundations, and it would allow the logician to maintain the stability of computability theory without denying the potential surprises of physics. The stagnation you have observed is a symptom of a foundationalist impulse that seeks a single Archimedean point for computation, whereas the reality is that computation is a multi-faceted phenomenon straddling mind, math, and matter.

  In conclusion, the disagreement is substantive but obscured by terminological conflation, and your intuition that it is fundamentally methodological is correct. The path forward lies not in proving the thesis true or false, but in clarifying the context of use and the corresponding standards of justification. We must separate the analysis of human effective procedure from the limits of physical machinery and treat them as distinct inquiries with distinct criteria for success. If the community can adopt this differentiated approach, the debate will not necessarily end, but it will become productive, transforming from a circular argument about the status of a single thesis into a nuanced exploration of the relationships between abstract computability, human cognition, and physical law. This would represent genuine progress, moving us from a state of confused stalemate to a state of clarified pluralism, where the lack of consensus is recognized not as a failure of understanding but as a reflection of the complex nature of computation itself.
