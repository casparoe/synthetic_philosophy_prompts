answer: |-
  ### Brainstorming: Kinds of Reasons for Following Conventions

  Before formulating a principle, we must distinguish the normative forces at play in your examples.

  1.  **Moral Reasons:** These concern welfare, fairness, dignity, and rights. If violating a convention causes harm (economic or physical), treats others as mere means, or free-rides on the restraint of others, the reason is moral. (e.g., Tipping in the US to support wages; not cutting a queue to respect fairness).
  2.  **Prudential Reasons:** These concern your own self-interest, efficiency, or comfort. If violating a convention makes your life harder, slower, or more awkward without harming others, the reason is prudential. (e.g., Hanging back on a bus where no one queues; you might get on last, but you wrong no one).
  3.  **Legal Reasons:** These concern statutory authority and punishment. While laws often track morals, they can diverge. A reason is purely legal if the only justification is "because the state says so," absent independent moral weight. (e.g., Jaywalking where no safety risk exists, if viewed solely as law obedience).
  4.  **Merely Coordinative Reasons:** These solve collaboration problems where any consistent behavior is better than none, but the specific behavior has no intrinsic value. (e.g., Driving on the left vs. right). Violating these causes confusion but not necessarily injustice.

  ### The Principle: The Principle of Reliant Cooperation

  To capture your verdicts precisely, I propose the following principle:

  **The Principle of Reliant Cooperation:** A visitor is morally obligated to follow a local convention if and only if:
  1.  **Robustness:** The convention is generally observed and upheld by the local community; AND
  2.  **Substantive Value:** The convention functions to protect a substantive moral interest (such as welfare, dignity, fairness, or public safety) rather than mere efficiency or preference; AND
  3.  **Reliance:** Violating the convention would either harm specific others who rely on the norm, or constitute free-riding on the restraint of those who comply.

  **Why this captures your verdicts:**
  *   **US Tipping:** Robust (expected), Substantive (servers' livelihood), Reliance (servers rely on tips for wage). **Verdict: Moral Obligation.**
  *   **Japan Tipping:** Robust (no tipping), Substantive (dignity/professionalism), Reliance (violating it insults the worker's professional identity). **Verdict: Moral Obligation.**
  *   **Germany Jaywalking:** Robust (pedestrians wait), Substantive (public order/safety culture), Reliance (you benefit from the order others maintain; breaking it undermines the collective trust). **Verdict: Moral Obligation.**
  *   **London Queue:** Robust (lining up), Substantive (fairness of time), Reliance (others restrain themselves expecting you to do the same). **Verdict: Moral Obligation.**
  *   **Hospital Queue:** Robust (silent order), Substantive (fairness/need), Reliance (cutting exploits others' patience). **Verdict: Moral Obligation.**
  *   **Bus Boarding (No Line):** Robust (jostling), Substantive (none, purely efficiency), Reliance (no one is restraining themselves for you). **Verdict: No Moral Obligation.**
  *   **Supermarket Express:** Robust? (Locals ignore it). Because Condition 1 fails, the obligation dissolves. **Verdict: No Serious Moral Wrong.**

  ### Application: The Italian Coffee Bar

  **The Case:** A visitor in Italy notices locals crowd the counter and shout orders rather than queuing. Is there a moral obligation to crowd?

  **Analysis using the Principle:**
  1.  **Robustness:** Yes, locals crowd and shout.
  2.  **Substantive Value:** What value does this protect? Unlike the London Tube queue, which protects *fairness* (first-come, first-served), the Italian coffee bar norm protects *efficiency* and *throughput* in a high-volume setting. It is a coordinative norm, not a fairness norm.
  3.  **Reliance:** Do others rely on you to crowd? If you hang back politely, do you harm anyone?
      *   You may harm your own chances of being served (Prudential loss).
      *   Do you harm the barista? Only if your polite standing blocks the flow of the crowd.
      *   Do you free-ride? No, because no one is restraining themselves for your benefit. The locals are not "waiting their turn" in a line; they are asserting presence.

  **Verdict:** There is **no moral obligation** to crowd and shout. This case aligns with the **Bus Boarding** verdict, not the London Tube verdict. The norm is merely coordinative and efficiency-based. Hanging back is inefficient and may result in you not getting coffee, but it is not immoral. However, you do have a negative duty not to *obstruct* the crowd (e.g., standing still in the middle of the surge); you must step aside if you are not participating.

  ### Evaluation: Complexity and Verdict Integrity

  **Does this principle save the pattern?**
  Yes, it captures all your listed verdicts without contradiction. It successfully distinguishes between norms that protect *values* (tipping, queuing, order) and norms that manage *flow* (bus boarding, coffee crowding).

  **The Cost of Complexity:**
  The principle saves the pattern at the cost of **epistemic burden**. To know whether you are morally obligated to follow a convention, you cannot simply observe *what* people do; you must understand *why* they do it.
  *   In the US, you must know tipping is wage-dependent.
  *   In Japan, you must know tipping is culturally insulting.
  *   In Germany, you must know jaywalking is viewed as a breach of civic trust, not just safety.
  *   In the Supermarket, you must know the rule is effectively dead.

  For a visitor, this is demanding. You cannot determine moral obligation by observation alone; you require cultural interpretation. If you misjudge the "Substantive Value" (e.g., thinking the Italian coffee crowd is about fairness rather than efficiency), you might mistakenly assign moral weight to a prudential norm.

  **Do I need to overturn a verdict?**
