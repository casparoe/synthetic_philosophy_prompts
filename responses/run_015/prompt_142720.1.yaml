  9.  **Final Polish:** Check for clarity, flow, and philosophical precision (e.g., distinguishing *metaphysical* necessity from *nomic* necessity). (Proceed to generate output).

  *(Self-Correction during final output generation)*: Make sure to explicitly address the "non-circular appeal to modal primitives" constraint in the Counterfactual section. Humeans often accuse Anti-Humeans of circularity here.

