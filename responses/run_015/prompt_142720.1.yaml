answer: |-
  ### The Adequacy Conditions for a Metaphysics of Natural Laws

  Your intuition is correct: the standard Humean/Anti-Humean dialectic often functions as a motte-and-bailey where proponents shift their adequacy conditions to defend core ontological commitments. To evaluate any theory of laws rigorously, we must first isolate the functional roles laws are expected to play in our metaphysical and scientific framework.

  Below is a specification of the desiderata any adequate theory of natural laws must satisfy. These are categorized by the theoretical pressure that generates them, followed by an analysis of their compatibility and a brief mapping of the major frameworks against them.

  ---

  ### Part I: The Specification of Desiderata

  #### 1. The Modal Discrimination Condition
  **Requirement:** The theory must provide a principled metaphysical distinction between *nomic necessities* (laws) and *accidental regularities* (contingent generalizations).
  **Motivating Case:** Consider the inverse-square law of gravitation versus the generalization that "all gold spheres are less than ten miles in diameter." Both are universally true in the actual world. However, the gold sphere generalization is contingent (we could build a larger one), whereas the gravitational law appears necessary (in a nomic sense). A theory that reduces laws to universal quantification over the actual mosaic fails this condition unless it adds a filtering mechanism (e.g., systematization) that does not merely recapitulate the distinction it aims to explain.

  #### 2. The Counterfactual Support Condition
  **Requirement:** The theory must ground the truth of subjunctive conditionals without circular appeal to the very modal facts it seeks to analyze.
  **Motivating Case:** Scientific practice relies on interventionist reasoning: "If this match were struck, it would light." This truth depends on the law of combustion, not merely the history of struck matches. If a theory defines laws in terms of the actual mosaic (Humeanism), it struggles to validate counterfactuals about *non-actual* mosaics without smuggling in modal primitives. If it defines laws as modal primitives (Anti-Humeanism), it risks circularity if those primitives are defined by their counterfactual-supporting role.

  #### 3. The Non-Vacuity Condition
  **Requirement:** The theory must allow for laws to obtain in worlds (or domains) where the relevant antecedents are never instantiated.
  **Motivating Case:** Newton's First Law (inertia) describes the motion of bodies subject to no net force. In our universe, there may be no such bodies (due to universal gravitation). Yet, the law is not rendered false or meaningless. A theory that ties lawhood strictly to observed regularities (strict regularity theory) fails here, as it cannot account for the truth of law-statements regarding uninstantiated properties or extinct natural kinds.

  #### 4. The Temporal Stability Condition
  **Requirement:** The theory must explain why laws are stable across time and do not fluctuate with local changes in the distribution of properties.
  **Motivating Case:** If laws are merely summaries of the Humean mosaic, there is no metaphysical barrier to the "best system" changing as the mosaic grows. If a new particle appears at $t_{100}$ that alters the optimal systematization, a strict Best System Analysis (BSA) implies the laws of nature *retroactively* change. An adequate theory must secure the intuition that laws constrain the mosaic, not vice versa, ensuring temporal invariance.

  #### 5. The Explanatory Depth Condition
  **Requirement:** The theory must ground scientific explanation such that citing a law explains *why* a phenomenon occurs, rather than merely describing *that* it occurs.
  **Motivating Case:** When we explain why a planet orbits in an ellipse, we cite gravitational laws. If laws are just compressed descriptions of planetary orbits (Humeanism), the explanation becomes circular: the orbits explain the law, and the law explains the orbits. An adequate theory must break this symmetry, providing a directional ground (ontological or otherwise) that allows laws to explain instances without instances merely constituting laws.

  #### 6. The Special Science Compatibility Condition
  **Requirement:** The theory must accommodate lawhood in special sciences (biology, economics, psychology) where laws are often ceteris paribus, multiply realizable, or emergent, without reducing them to fundamental physics or dismissing them as non-laws.
  **Motivating Case:** Mendel's laws of genetics hold despite being realizable by diverse physical substrates. A theory that requires strict, exceptionless universality (common in fundamental physics models) excludes special science laws. Conversely, a theory that makes lawhood too easy (e.g., any stable pattern) risks inflating accidents into laws. The theory must navigate the hierarchy of sciences without collapsing the special sciences into fundamental physics or severing them entirely.

  ---

  ### Part II: Non-Negotiables vs. Camp-Specific Preferences

  In assessing these desiderata, we must distinguish between conditions required for the *concept* of law to do its work, and conditions required by specific *ontological* commitments.

  **Non-Negotiable Desiderata:**
  1.  **Modal Discrimination:** Without this, "law" is synonymous with "truth," rendering the concept useless for science.
  2.  **Counterfactual Support:** Without this, laws cannot support prediction or intervention, which is the pragmatic function of nomological knowledge.
  3.  **Explanatory Depth:** Without this, science is reduced to cataloging, not understanding.

  **Camp-Specific Preferences (Negotiable):**
  1.  **The Source of Modality:** Whether modal force comes from a "governing" relation (Anti-Humean) or from the inferential role of axioms in a system (Humean) is a metaphysical preference, not a functional requirement, *provided* the Counterfactual Support Condition is met.
  2.  **Ontological Parsimony:** Humeans prioritize a sparse ontology (no necessary connections); Anti-Humeans prioritize modal robustness. This is a trade-off, not an adequacy condition.
  3.  **Fundamentalism vs. Emergence:** Whether special science laws are derivative (BSA tends to allow this easily) or grounded in their own dispositional essences (DE struggles here) is a point of contention.

  **The Crucial Question: Modal Constraint and Supervenience**
  Does delivering genuine modal constraint across nearby worlds necessarily require an anti-Humean governing relation?
  *   **The Anti-Humean Claim:** Yes. Only a relation external to the events (governing) or internal to the properties (dispositions) can *make* the counterfactuals true.
  *   **The Humean Counter:** No. A sufficiently restricted Humean supervenience base, processed through a "Best System" algorithm, supplies modal constraint *functionally*. The constraint is not ontological but pragmatic/rational: given the system, one *ought* to expect the counterfactual.
  *   **Assessment:** If "genuine modal constraint" means *ontological necessitation*, Humeanism fails. If it means *reliable inferential license for agents*, Humeanism can satisfy it. The adequacy of the theory depends on whether you demand modality to be "in the world" or "in the description."

  ---

  ### Part III: The Incompatibility Thesis (The Trilemma)

  There is a subset of desiderata that appears **jointly unsatisfiable**. This is the primary engine of the debate.

  **The Trilemma:**
  1.  **Full Humean Supervenience:** Laws supervene entirely on the local qualitative mosaic (no hidden modal glue).
  2.  **Non-Circular Explanatory Power:** Laws explain the mosaic, not vice versa.
  3.  **Robust Modal Force:** Laws support counterfactuals and hold in vacuous cases independently of the actual distribution of events.

  **The Conflict:**
  *   If you accept **(1) Supervenience**, laws are determined by the mosaic. This threatens **(2) Explanation** (since the mosaic constitutes the law) and **(3) Modal Force** (since laws cannot outstrip the actual instances).
  *   If you accept **(3) Modal Force** (Anti-Humeanism), you must reject **(1) Supervenience** (laws are ontologically distinct from the mosaic).
  *   If you try to keep **(1)** and **(3)** (e.g., by claiming the Best System *is* the law), you often sacrifice **(2)**, as the explanation becomes pragmatic rather than metaphysical.

  **Verdict:** You cannot have a theory that is strictly Humean, genuinely explanatory in a metaphysical sense, and robustly modal. One must be weakened.
  *   *Humeans* weaken Modal Force (modality is systematized regularity).
  *   *Anti-Humeans* weaken Supervenience (modality is primitive or dispositional).
  *   *Primitivists* often weaken Explanatory Depth (laws are brute).

  ---

  ### Part IV: Framework Performance Against Desiderata

  Here is how the three major contenders fare against the specification, highlighting where they break the Trilemma.

  #### 1. Best System Analysis (Humean Regularity)
  *   **Modal Discrimination:** **Pass.** Distinguishes laws via simplicity/strength balance.
  *   **Counterfactuals:** **Strained Pass.** Supports them via the system's axioms, but critics argue this is circular or merely pragmatic.
  *   **Non-Vacuity:** **Fail.** Struggles with uninstantiated properties (if it's not in the mosaic, it can't be in the best system).
  *   **Temporal Stability:** **Fail.** Laws can change as the mosaic extends (the "future fit" problem).
  *   **Explanatory Depth:** **Fail.** Explanation is systematization, not grounding.
  *   **Special Sciences:** **Pass.** Easily accommodates derivative laws as local best systems.
  *   **Trade-off:** Sacrifices Modal Force and Explanatory Depth to save Supervenience and Epistemic Access.

  #### 2. Dispositional Essentialism (Anti-Humean)
  *   **Modal Discrimination:** **Pass.** Laws flow from the essences of properties.
  *   **Counterfactuals:** **Pass.** Powers manifest in specific ways across possible worlds.
  *   **Non-Vacuity:** **Pass.** Dispositions exist even if unmanifested.
  *   **Temporal Stability:** **Pass.** Essences are immutable.
  *   **Explanatory Depth:** **Pass.** Properties ground the regularities.
  *   **Special Sciences:** **Strained.** Struggles with multiple realizability (do biological kinds have essences?). Risks proliferation of powers.
  *   **Trade-off:** Sacrifices Supervenience and Special Science simplicity to save Modal Force and Explanation.

  #### 3. Primitivist Governing (Anti-Humean)
  *   **Modal Discrimination:** **Pass.** Laws are a distinct category of fact.
  *   **Counterfactuals:** **Pass.** Governing relations constrain possibilities.
  *   **Non-Vacuity:** **Pass.** Relations hold independently of instances.
  *   **Temporal Stability:** **Pass.** Relations are external and stable.
  *   **Explanatory Depth:** **Fail/Neutral.** Laws explain phenomena, but laws themselves are brute facts (no further explanation of *why* these laws).
  *   **Special Sciences:** **Neutral.** Can be adapted, but often focuses on fundamental physics.
  *   **Trade-off:** Sacrifices Explanatory Depth (at the fundamental level) and Epistemic Access (how do we detect the "governing"?) to save Modal Force and Supervenience rejection.

  ### Summary for Seminar Commitment

  If your goal is to preserve the **scientific practice of intervention and special-science autonomy**, the Humean framework offers the smoothest fit, provided you accept that "modal force" is a feature of our cognitive engagement with the world, not the world itself.

  If your goal is to preserve the **metaphysical intuition of constraint and objective necessity**, you must adopt an Anti-Humean view (Dispositional or Primitivist), but you must pay the cost of either bloating the ontology (powers for everything) or accepting brute facts (primitivism) that halt explanation.

  The **jointly unsatisfiable set** (Supervenience + Explanation + Modality) is the hard constraint. Any theory you commit to must explicitly state which of these three it is willing to weaken. A theory that claims to satisfy all three is likely obscuring its adequacy conditions.
