  hey so im not a philosophy student or anything, just someone who reads random stuff on my phone before bed. ive been trying to understand this frame problem people talk about with AI, but i keep running into two different flavors. one is the robot-planning version: a robot moves a chair and needs to know the walls didnt move, without listing every single thing that stayed put. the other is about belief updating — like when you learn your friend lied about one thing, you dont have to re-evaluate every other fact you know about them. are these actually the same problem wearing different hats, or are they seperate issues that just share a name? also i read somewhere about a ramification problem being different from the frame problem itself — does that belong to the belief-updating side, the robot-planning side, or is it a third thing entirely? i feel like im probably mixing them up, but i want to know if treating them as one bug is actually wrong, or if the distinction is just academic hairsplitting.
