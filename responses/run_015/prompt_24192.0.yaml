  2.  **Deconstruct Newcomb's Problem:**
      *   **Setup:** Two boxes (A: transparent, \$1k; B: opaque, \$0 or \$1M). Predictor (Omega) puts \$1M in B *if and only if* it predicts you will take only B.
      *   **Two-Boxer (Causal Decision Theory - CDT):** My choice *now* cannot change what's *already* in the box. Dominance principle: Taking both always yields \$1k more than taking one.
      *   **One-Boxer (Evidential Decision Theory - EDT):** Choosing one box is strong evidence that the box contains \$1M. Expected utility is higher.
      *   **The Core Tension:** Causality vs. Correlation/Logical Dependence.

  3.  **Address the Friend's Claim ("It's just evidential"):**
      *   *Partial Truth:* In standard EDT, yes, it's about conditional probabilities $P(\text{Million} | \text{One-Box})$.
      *   *Nuance:* Dismissing it as "just evidence" misses the point of *why* the evidence exists. It's not like smoking and yellow fingers (common cause); it's a prediction based on *you*.
      *   *Counter-argument:* If the predictor is perfect (or near perfect), the correlation is so strong it functions like causality for the agent.

  4.  **Address the "Deeper Reason" (Functional Decision Theory / Logical Decision Theory):**
      *   This is the crucial missing piece for the user. Modern decision theory (FDT/LDT) bridges the gap.
