answer: |-
  This is one of the most famous frustrations in philosophy and decision theory. You are right to feel that your friend's dismissal ("it's just evidential") is unsatisfying, even if it is technically correct within a specific framework.

  The short answer is: **Your friend is arguing from Causal Decision Theory (CDT), which is the standard textbook view. But modern decision theory has moved past that.** There *is* a deeper reason to one-box that isn't just "spooky correlation," and it has to do with how we define "choice" and "prediction."

  Here is a breakdown to help you articulate why the one-boxer's argument is robust, why "just evidential" is a simplification, and how the mechanism matters.

  ### 1. The Friend's View: Causal Decision Theory (CDT)
  Your friend is arguing from the perspective of **Causal Decision Theory**.
  *   **The Logic:** The money is already in the box (or not). My choice *now* cannot physically reach back in time and change the past. Therefore, I should take what is there plus the extra \$1,000.
  *   **The "Dominance" Principle:** No matter what is in Box B, taking both boxes always yields \$1,000 more than taking one.
  *   **The Dismissal:** To a CDT theorist, the correlation between your choice and the prediction is like "yellow fingers and lung cancer." Smoking causes both. In Newcomb's, some prior state of your brain causes both the prediction and your choice. Therefore, choosing one box doesn't *cause* the money to be there; it's just a symptom.

  **Why this feels incomplete:** If everyone follows CDT, everyone two-boxes, Omega predicts that, Box B is empty, and everyone leaves with \$1,000. If everyone one-boxes, everyone leaves with \$1,000,000. The CDT agent admits they will leave poorer, but claims they made the "rational" choice. This suggests CDT might be defining "rationality" in a way that doesn't match "getting what you want."

  ### 2. Is it "Just Evidential"? (EDT)
  The traditional counter to CDT is **Evidential Decision Theory (EDT)**.
  *   **The Logic:** You should choose the action that gives you the best *expected news*.
  *   **The Math:** If I one-box, the probability that Box B contains \$1M is (say) 99%. If I two-box, the probability is 1%.
  *   **The Friend's Objection:** Your friend says this is "just evidence." They argue that you can't *make* the money appear by choosing one box; you are just betting on the fact that Omega is usually right.

  **Your Intuition:** You feel this is missing something because "betting on evidence" sounds passive. It sounds like you are hoping Omega was right, rather than *making* Omega right. You are correct to sense a gap here. EDT treats the correlation as a brute fact without explaining *why* your choice is linked to the prediction.

  ### 3. The Deeper Reason: Functional Decision Theory (FDT)
  This is the argument that validates your intuition. Developed by researchers at the Machine Intelligence Research Institute (like Eliezer Yudkowsky and Nate Soares), **Functional Decision Theory** argues that one-boxing is not just about evidence, and it's not about magic backward causation. It is about **logical causation.**

  Here is the core insight: **Omega does not predict your *action*; Omega predicts your *decision algorithm*.**

  *   **The Computation:** You are a physical system running a decision-making computation. Omega is simulating that computation (or analyzing it) to see what output it produces.
  *   **The Identity:** When you sit down to decide, you are running the *same function* that Omega ran yesterday.
  *   **The Control:** You cannot change the past, but you *can* determine the output of the function. Since Omega's prediction *is* the output of that same function, by determining your choice, you are logically determining what Omega predicted.

  **The Calculator Analogy:**
  Imagine Omega calculates $2 + 2$ and writes the result on a piece of paper, seals it in an envelope, and puts it in Box B. You are now asked to calculate $2 + 2$.
  *   **Two-Boxer:** "The number is already in the envelope. My calculation can't change it. I'll just say '5' because I like 5."
  *   **One-Boxer (FDT):** "Wait. Omega and I are computing the same function. If I output '4', Omega output '4'. If I output '5', Omega output '5'. I don't need to change the past; I need to ensure the function outputs the value that puts money in the box."

  In this view, one-boxing isn't "evidence" that the money is there. **One-boxing is the logical cause of the prediction being "One-Box."** It bridges the gap between causality and evidence.

  ### 4. Does the Mechanism Matter?
  Your friend might say, "But what if Omega is a magician?" This is where the mechanism matters immensely for the *type* of argument you use, though not necessarily for the *outcome*.

  *   **Scenario A: Magic/Psychic:** If Omega is truly magical, CDT is technically correct (no causal link). However, EDT still says one-box (high correlation). Most people intuitively one-box here because the correlation is too strong to ignore.
  *   **Scenario B: Brain Scan:** Omega scans your brain chemistry to determine your disposition. This is a "common cause" scenario. Your brain state causes the prediction *and* your choice. CDT says two-box.
  *   **Scenario C: Simulation (The Strongest Case):** Omega runs a perfect simulation of you. This is where FDT shines. The simulation *is* you (computationally). If you two-box in reality, the simulation two-boxed yesterday. There is a **logical dependency** between your choice and the prediction.

  **Is the argument robust?**
  The one-boxer argument is robust **if** you accept that your decision is the output of a deterministic (or probabilistic) algorithm that can be modeled.
  *   If the predictor is accurate (>50.05% roughly), EDT says one-box.
  *   If the predictor models your algorithm (Simulation), FDT says one-box.
  *   CDT *always* says two-box, regardless of accuracy, unless the accuracy is literally 100% and defined as "causal."

  ### 5. How to Win the Argument (or End it Peacefully)
  Tell your friend this:

  1.  **Acknowledge CDT:** "You are right that within Causal Decision Theory, two-boxing is the only valid move because there is no causal arrow from my hand to the past."
  2.  **Challenge the Goal:** "But the goal of decision theory is to get the money, not to satisfy a specific definition of causality. If I walk away with \$1M and you walk away with \$1k, my decision theory 'won' in the real world, even if yours is more intuitively causal."
  3.  **Introduce Logical Dependence:** "The one-boxer argument isn't just 'evidence.' If Omega predicts me by simulating me, then my choice and Omega's prediction are the same computation happening at different times. I'm not changing the past; I'm completing the equation that Omega started. If I solve for X, Omega solved for X. We get the same answer."
  4.  **The "Why":** "The reason it feels like there's a deeper reason is that there is. It's about **subjunctive dependence**. If I *were* to two-box, Omega *would have* predicted two-boxing. That counterfactual is true, and it matters for decision making."

  ### Summary
  *   **Is it just evidential?** No. In modern frameworks (FDT), it is **logical**. Your decision determines the output of the predictor because the predictor is modeling your decision process.
  *   **Is there a deeper reason?** Yes. You are choosing the output of an algorithm that determines both your action and the prediction.
  *   **Does the mechanism matter?** Yes. If Omega is simulating you, the logical link is strongest. If Omega is guessing via magic, it's purely evidential. But in almost all plausible high-accuracy scenarios, one-boxing yields more utility.

  Your intuition is correct: dismissing it as "just evidence" ignores the computational reality of what a prediction actually *is*. You aren't betting on a correlation; you are coordinating with a mirror.
