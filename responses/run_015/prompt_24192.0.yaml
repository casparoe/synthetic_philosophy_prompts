      *   *Analogy:* If you calculate $2+2$, and Omega calculates $2+2$, you don't say "My calculation doesn't cause Omega's." You output the same result.
      *   *Implication:* One-boxing isn't just *evidence*; it's *controlling the output of the prediction* because the prediction is a simulation of your decision process. This moves it beyond "spooky correlation" to "logical causation."

