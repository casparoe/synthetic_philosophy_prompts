          *   3. The Coerced Power (C1, C5).
      *   *Section 3: The Single Revision.*
          *   Focus on C3 or C7. Modifying C3 (allowing successors to release) solves the "Zombie" issue without losing the "Zero Impact" intuition. Or modifying C7 (duty dies with promisee).
          *   Actually, the prompt asks for the *single revision* that cleans up the most.
          *   If I change C3 to allow estate release, C2 and C7 become coherent.
          *   If I change C8 to include reasonable reliance, it clashes with C1.
          *   Best bet: Modify C3. It resolves the metaphysical awkwardness of C2+C7.
      *   *Section 4: Strong vs. Weak Forms.*
          *   C6 (Triviality) might be better as a "reason" not a "duty".
          *   C8 (Intention) might be too strong.

  6.  **Refining the Analysis (Self-Correction during drafting):**
      *   *Check C1 vs C8 again:* C1 says the reason is content-independent *of reliance/expectations*. It doesn't strictly say content-independent of *intention*. However, if the content is fixed purely by private intention, the "normative power" (which is usually a social convention) becomes private. This weakens C1's claim that it's a *power* (which implies changing normative relations between agents). If only I know what I promised, how is it a relation? This is a strong tension.
      *   *Check C2 vs C7:* If the duty is directed *to* the promisee, and the promisee is dead, can a duty be directed to a non-person? Some philosophers say yes (rights of the dead). But C3 says the *power* lapses. This is the specific friction. If I owe it to her, she (or her representative) should be able to waive it. If she can't, is it really owed *to her*? Or is it owed to "the memory of her"? C2 says "wrong *her* in particular". You can't wrong a non-existent entity in the same way. This is the strongest tension.
      *   *Ranking:*
          1.  C2/C3/C7 (The Metaphysics of the Directed Duty).
          2.  C1/C8 (The Privacy of the Obligation).
          3.  C1/C5 (The Voluntariness of the Power).
      *   *Single Revision:* Revising C3 (allowing the power to pass to the estate) aligns C2 and C7. It preserves the "directed" nature and the "survival" nature.
      *   *Weak Form:* C6 is a candidate for weak form (reason vs duty). C8 is also a candidate (intention vs reasonable interpretation).

  7.  **Final Polish (British English & Tone):**
      *   Ensure "programme", "analyse", "honour", etc.
      *   Tone should be academic, rigorous, constructive.
      *   Ensure all constraints of the prompt are met.

  8.  **Final Review against constraints:**
      *   Audit not survey? Yes.
      *   Identify collisions? Yes.
      *   Rank by severity? Yes.
      *   State costs of giving up? Yes.
      *   Identify single revision? Yes.
      *   Strong/Weak form distinction? Yes.
      *   British English? Yes.

  *(Self-Correction on C5)*: C5 says if a third party forces me to promise you something you had a right to anyway, it binds. This is tricky. If I already owed it, promising adds a new layer? C1 says promising generates a *new* reason. If I already owed it, does promising add a *promissory* reason? C5 says "the promise does bind". This implies a promissory obligation is layered on a pre-existing duty. This is compatible with C1. The tension is whether a coerced act counts as exercising a normative *power*. I will keep this as a medium tension.

  *(Self-Correction on C8)*: C8 is very radical. "One cannot promise accidentally." This contradicts the convention-based view of promising (where utterance constitutes the promise). If C1 holds that promising is a normative *power* (like a legal contract), usually powers are exercised by public acts, not private thoughts. C8 makes the power entirely internal. This undermines the "directed" nature in C2. If you don't know what I promised (because my intention was hidden), how is the duty directed *to* you? This elevates the C1/C8 tension. I might rank this higher than C1/C5. Let's put C1/C8 as #2.

  *(Refining the Single Revision)*: Changing C3 is the cleanest fix for the C2/C7 cluster. Changing C8 is the cleanest fix for the C1/C2 cluster. Which is "most"? The C2/C3/C7 cluster threatens the coherence of the *survival* of the duty. The C1/C8 cluster threatens the *social* nature of the duty. The prompt asks for the revision that cleans up the *most*. The "Zombie Duty" (C2+C3+C7) is a logical paradox regarding the *holder* of the right. The "Subjective Content" (C1+C8) is an epistemic/practical issue. The Zombie Duty is more fundamental to the structure of rights/duties. I will recommend revising C3.

  *(Wait, one more look at C7)*: C7 says obligation survives zero impact *and* promisee death. C3 says power lapses with promisee. If I revise C3 to allow estate release, does it fix C7? Yes, it makes the survival coherent. If I revise C7 to say obligation dies with promisee, it fixes C3 and C2. Which is better? The prompt asks for *the* single revision. Revising C3 preserves the author's apparent desire for the duty to survive (C7 is quite specific). Revising C7 abandons a core intuition about the bindingness of promises beyond life. I will suggest revising C3.

