answer: |-
  This is a profound historiographical and epistemological question. You are asking not merely whether Frege was tainted, but what *meta-philosophical machinery* is required to keep the taint from spreading to the work. The standard move to bracket Frege's diary is not a neutral methodological step; it is itself a philosophical position with heavy commitments.

  Here is an analysis of the implicit theories of knowledge, logic, and agency that are smuggled in when we declare Frege's politics philosophically irrelevant.

  ### 1. The Reichenbachian Shield: Discovery vs. Justification
  The most explicit defense relies on Hans Reichenbach's distinction between the **context of discovery** (psychological, historical, biographical) and the **context of justification** (logical validity, proof, argument structure).

  *   **The Commitment:** This assumes that the validity of a logical proposition is entirely independent of the causal history of its formulation. It presupposes a **strong objectivism**: truth bearers exist in a space that is causally isolated from the moral character of the truth seeker.
  *   **The Vulnerability:** This distinction holds well for *validity* (does the conclusion follow from the premises?) but poorly for *conceptual formation*. If Frege's antisemitism influenced *which problems he thought were worth solving*, or *how he conceptualized the relationship between an object and a concept*, the context of justification is already infected. For instance, if his notion of "exclusion" in set theory is subtly modeled on social exclusion, the formalism might hide the ideological sediment. Bracketing assumes that concepts are neutral tools, rather than culturally laden constructs.

  ### 2. The Ontology of Logic: Platonism as Insulation
  To claim logic is immune to the reasoner's character is to commit to a robust **Platonism** (or at least a strong Realism) about logical objects.

  *   **The Commitment:** If logical laws are like laws of physics (or better, like mathematical objects), they are discovered, not made. A racist geometer does not make triangles have four sides; similarly, a racist logician does not make the law of non-contradiction false. The work is viewed as a report on a mind-independent reality.
  *   **The Vulnerability:** This collapses if one holds a **neo-Kantian** or **pragmatist** view of logic, where logic is a normative framework constructed by humans to facilitate communication and reasoning. If logic is a human practice, then the virtues and vices of the practitioners are relevant to the quality of the practice. By bracketing Frege, the discipline implicitly rejects the idea that logic is a human, social practice susceptible to social pathologies.

  ### 3. Epistemic Contamination and Conceptual Migration
  You raise the issue of **epistemic contamination**: the idea that holding vicious beliefs warps judgment in unrelated domains. Defenders of Frege assume cognitive **modularity**.

  *   **The Commitment:** This assumes that "moral reasoning" and "logical reasoning" are distinct faculties. It assumes one can compartmentalize hatred without it altering one's standards of rigor, clarity, or hierarchy.
  *   **The Vulnerability:** Historians like Hans Sluga have argued that Frege's political views were not an late-life aberration but connected to his philosophical obsession with **order, hierarchy, and purity**.
      *   Frege's logic is obsessed with precise boundaries (a concept must have a sharp boundary).
      *   His politics was obsessed with national boundaries and racial purity.
      *   If the *motivation* for demanding sharp boundaries in logic is an anxiety about social mixing or conceptual "contamination," then the logic is not neutral. It is a sublimation of political anxiety.
      *   To bracket the diary is to assume that **structural isomorphisms** between a philosopher's ethics and their ontology are coincidental. It denies that philosophical systems are often unified visions of the world where the ethical and the metaphysical reinforce each other.

  ### 4. The Autonomy of the Formal
  Why is Frege treated differently from Heidegger? Heidegger's Nazism is often read into his ontology (e.g., the *Volk*, destiny, authenticity). Frege gets a pass.

  *   **The Commitment:** This privileges **formalization** as a cleansing agent. It assumes that once an idea is translated into symbols (*Begriffsschrift*), it is stripped of its author's identity. It commits to the view that **syntax is innocent**.
  *   **The Vulnerability:** This assumes that the formalism captures the *whole* of the philosophical insight. But logicism wasn't just the symbols; it was the claim that arithmetic reduces to logic. If the *drive* to reduce arithmetic to logic was motivated by a desire for absolute, unassailable authority (a reaction against the relativism he feared in politics), then the project itself is politically charged.
      *   Treating Frege as special because his work is formal assumes that **formalism prevents ideology**. This is a dangerous view. It suggests that if we just make our arguments mathematical enough, we become immune to bias. This is arguably a form of technocratic fetishism.

  ### 5. The Implicit Theory of Philosophical Knowledge
  When scholars say the diary is "biographically interesting but philosophically irrelevant," they are smuggling in a specific theory of knowledge: **Cumulative Objectivism.**

  1.  **Knowledge as Accumulation:** It assumes philosophy progresses by stacking bricks. Frege laid a brick (logicism). Whether he was a bigot doesn't change the shape of the brick. This ignores the possibility that philosophy is more like an ecosystem, where the health of the parts depends on the health of the whole.
  2.  **The "View from Nowhere":** It assumes the ideal philosopher is a disembodied mind. By bracketing the biography, we are pretending the work came from nowhere. This reinforces the myth that "good philosophy" is that which appears to have no author.
  3.  **Hierarchy of Disciplines:** It assumes Logic is the "hard core" and Ethics/Politics is the "soft periphery." It presumes contamination only flows one way (from logic to ethics, perhaps), but never from ethics to logic. This protects Logic's status as the supreme tribunal of reason.

  ### 6. Is the Practice Consistent?
  You asked if this is consistent with how we treat other figures. Generally, **no**.

  *   **Wittgenstein:** His moral intensity and personal struggles are seen as *constitutive* of his philosophy. We don't bracket his personality.
  *   **Russell:** His pacifism and social views are critiqued alongside his logic, though his logic is often spared. But Russell didn't write a diary advocating the gasification of a specific group.
  *   **Heidegger:** As mentioned, his politics are increasingly seen as endogenous to his philosophy.
  *   **The Difference:** Frege is granted immunity specifically because his output is **technical**. This suggests the discipline values **utility over integrity**. We keep the tool because it works, regardless of who forged it. This is an instrumentalist view of philosophical knowledge: Logic is a technology, not a wisdom tradition.

  ### Conclusion
  The practice of bracketing Frege's politics presupposes that **logic is a transcendent realm untouched by human vice.** It relies on a rigid fact/value distinction that many modern philosophers reject.

  If you accept that **conceptual frameworks are shaped by lived experience**, and that **ideologies can structure our intuitions about order and hierarchy**, then the bracketing collapses. To maintain the bracket, one must commit to a view of logic as **divine or alien**—something that passes *through* the philosopher but is not *of* the philosopher.

  Defending the bracket requires arguing that **validity is the only metric of philosophical worth.** If one believes philosophy is also about wisdom, judgment, or the cultivation of the intellect, then a corrupted intellect cannot produce uncorrupted philosophy, regardless of how formal the symbols look. The "irrelevance" of the diary is not a finding; it is a defensive maneuver to protect the self-image of logic as the purest of the sciences.
