          *   *Maya:* Volunteering breaks the situational model. If it were just pressure, he'd obey orders. *Volunteering* implies agency driven by belief. The depot time gave him space to internalize the mission, not just the routine.
      *   **Synthesis/Nuance:** They need to acknowledge the limits of their own views.
