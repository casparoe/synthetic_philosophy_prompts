      *   **Specific Constraint:** Do *not* just rehash the standard "peer pressure vs. hatred" debate.
      *   **Specific Case Study:** A reservist who *initially refuses* to shoot, gets assigned to guard a train depot (bureaucratic role, no direct killing) for two weeks, then *volunteers* for a firing squad.
      *   **Key Psychological Mechanisms to Explore:** Incremental desensitization (Situational) vs. Latent ideological commitment activated by bureaucratic distance (Cultural/Dispositional).
      *   **Format:** Dialogue between two grad students.
