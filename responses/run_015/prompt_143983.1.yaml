      *   **Student B (Cultural/Dispositional/Goldhagen-esque):** Let's call her *Maya*. She focuses on cognitive models, cultural narratives, the "eliminationist" mindset, and how ideology shapes perception of the situation.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene (coffee shop or seminar room aftermath). Establish the specific case immediately to avoid generic preamble.
      *   **Leo's Opening (Situational):** Frame the initial refusal as the baseline "normal" morality. The shift happens *during* the depot duty. It's about the *process*, not the person. The depot duty isn't "distance"; it's *acclimatization*.
      *   **Maya's Counter (Cultural):** Challenge the idea that the depot duty is neutral. Guarding Jews on trains *is* ideological work. The refusal wasn't moral; it was shock. The volunteering is the *true* self emerging once the cognitive dissonance is resolved by the cultural narrative.
      *   **Deep Dive - The Mechanism of Change:**
