prompt: |-
  I chair the assessment-accommodations committee at a mid-sized university, and I want to replace the improvisation we currently do with something we can actually run. We sit fortnightly and dispose of thirty to forty requests a term, fifteen minutes a case, and our formal question is narrow: may this student use this external resource during an invigilated closed-book exam in this paper. The people in the room are two rotating faculty members, a disability-services adviser, and a student representative; none of them has philosophy training, the decision has to be written down in language a student can appeal against, and the department that owns the exam has to be able to live with it. A colleague in the philosophy department suggested, after watching us argue about whether a laptop is different in kind from a set of notes, that the question we are really asking is whether the resource is, for this student, part of the mind that sits the exam or merely something that mind uses — and pointed me at the extended-mind literature and its central examples and objections: the man with the notebook, the parity principle, the complaint that mere causal coupling is not constitution, and the worry that on a loose reading of the view every gadget I rely on becomes part of me. I found the literature suggestive and unusable in equal measure. I do not want a summary of it; I want it turned into a procedure.

  What I need is an ordered set of questions my committee can put to a request, together with, for each question, what would count as a sufficient answer and what evidence a student can realistically be asked to produce for it — a clinician's letter, a short demonstration at the start of term, a usage log, a statement from a tutor. Build in the conditions that seem to matter and say how each is to be tested in fifteen minutes: whether the resource is reliably and immediately available to the student under exam-hall conditions rather than in principle; whether the student consults it automatically and trusts what it returns rather than checking it against something else each time; whether the information in it is the student's own in the relevant sense, or was generated by a tutor, a classmate, or software; whether the student endorses what it gives them or would disown it if challenged. Include explicit stop rules, distinguishing the failures that end the request there from the ones that merely count against it, and mark the points at which the question stops being one of fact about the student and becomes one about what the examination is supposed to be measuring, at which stage the procedure must hand the decision to the department that set the paper — and tell me how to frame that referral so the department does not simply answer by restating its own no-aids rule. I also need the conditions stated so they cannot be satisfied by arrangements made in the week before the exam. Please make sure the procedure handles a shared resource whose content was produced jointly or by someone else, a resource that performs operations the student cannot check or reproduce, a resource the student depends on but which is only intermittently available, and a student who could still do the work internally but for whom the external route is much less exhausting.

  Then run it, at length, on three cases in front of us now. First: a student with a degenerative visual condition who for six years has read and written everything through a screen reader and a refreshable braille display, and who wants the same setup for a three-hour papers exam. Second: a student requesting a single printed sheet of formulae and decision rules, compiled by their tutor, for a statistics exam whose rubric partly rewards knowing which test to apply to which design. Third: a student who wants to dictate answers into a phone and have a grammar tool restructure the sentences, having used that setup daily for two years, in a subject where written expression is itself a graded component. At least one of these, I suspect, will come out differently from how my committee would vote today, and I would rather be told so than flattered: give me the verdict the procedure yields in each case, tell me which of our reflexive approvals it refuses and which of our reflexive refusals it grants, and for whichever result we will resist, argue whether that is a defect in the procedure or a defect in our practice. Finally, state plainly what the procedure cannot do: where it must yield to our legal duties and to the department's authority over its own assessment, where it depends on a student's self-report that may be unreliable or strategic, and where no amount of procedure will settle whether unaided recall ought to be part of what a degree certifies.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case analyses:

  1.  **Deconstruct the Request:**

      *   **Role:** Chair of an Assessment-Accommodations Committee at a mid-sized university.
      *   **Problem:** Current process is improvised, inconsistent, and philosophically ungrounded.
      *   **Constraints:**
          *   Fortnightly meetings.
          *   30-40 requests/term.
          *   15 minutes per case.
          *   Committee composition: 2 rotating faculty, 1 disability adviser, 1 student rep (no philosophy training).
          *   Output: Written decision (appealable), acceptable to the owning department.
          *   Core Question: Is the resource part of the *mind* sitting the exam or merely a *tool*? (Extended Mind Thesis application).
          *   Requirement: An ordered set of questions (procedure), sufficiency criteria, evidence types, stop rules, referral mechanisms, and anti-gaming measures (no last-minute arrangements).
          *   Specific Scenarios to Test:
              1.  Degenerative visual condition (screen reader/braille) for Philosophy exam.
              2.  Tutor-compiled formula sheet for Statistics exam.
              3.  Dictation + Grammar tool for a subject grading written expression.
      *   **Output Requirement:** Run the procedure on the three cases, predict divergent outcomes, argue against resistance, and state limitations.

  2.  **Theoretical Foundation (Extended Mind Thesis - EMT):**

      *   *Clark & Chalmers (1998):* The Parity Principle. If a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is part of the cognitive process.
      *   *Key Criteria (Trust & Glue):*
          1.  **Availability:** The resource must be reliably available.
          2.  **Accessibility:** It must be easily accessible.
          3.  **Endorsement:** The information retrieved is automatically endorsed (trusted).
          4.  **Past Endorsement:** The information was consciously endorsed in the past.
      *   *Objections to Address:*
          *   Coupling vs. Constitution (just using a tool isn't having it as part of the mind).
          *   The "Google Problem" (everything becomes part of the mind).
          *   Ownership/Authorship (is it *my* memory or *someone else's*?).
      *   *Adaptation for Exams:* We need to translate these metaphysical criteria into administrative checks within 15 minutes.

  3.  **Drafting the Procedure (The "Cognitive Integration Protocol"):**

      *   *Goal:* Distinguish between *cognitive prosthetics* (part of the mind) and *external aids* (tools).
      *   *Structure:* 5 Stages.
      *   *Stage 1: Integration History (The "Glue").* Is this a long-term adaptation or a last-minute fix?
          *   *Evidence:* Usage logs, clinician letter, tutor statement.
          *   *Stop Rule:* If established < 1 term, reject (unless acute onset).
      *   *Stage 2: Availability & Reliability (The "Coupling").* Is it there when needed?
          *   *Evidence:* Tech check, invigilator report.
          *   *Stop Rule:* If intermittent/unreliable, it's a tool, not a mind-part.
      *   *Stage 3: Automaticity & Trust (The "Endorsement").* Do they check it or trust it?
          *   *Evidence:* Demo, self-report.
          *   *Stop Rule:* If they verify against internal memory every time, it's a tool.
      *   *Stage 4: Content Origin (The "Ownership").* Who generated the content?
          *   *Evidence:* File metadata, tutor statement.
          *   *Stop Rule:* If generated by others (tutor/AI) without student processing, it's outsourcing, not extension.
      *   *Stage 5: Construct Alignment (The "Referral").* Does allowing this defeat the purpose of the exam?
          *   *Decision:* Committee decides 1-4. If passed, Department decides 5.
          *   *Referral Frame:* Not "Is this allowed?" but "Does this accommodation invalidate the specific learning outcome being tested?"

  4.  **Refining the Criteria for the Committee:**

      *   Need clear "Pass/Fail" markers.
      *   Need to prevent "gaming" (e.g., using a tool for a week before the exam).
      *   Need to handle the "Exhaustion" argument (cognitive load).
      *   Need to handle the "Shared Resource" argument (tutor notes).

  5.  **Running the Cases:**

      *   **Case 1: Visual Impairment (Screen Reader/Braille).**
          *   *Analysis:* High integration, long-term, reliable, trusted. Content is the student's own (they write/speak, machine translates).
          *   *Verdict:* Pass Stages 1-4. Referral to Dept for Stage 5.
          *   *Likely Outcome:* Approved. (Committee usually approves this, so procedure confirms).
      *   **Case 2: Tutor-Compiled Formula Sheet.**
          *   *Analysis:* Long-term use? Maybe. Reliable? Yes. Trust? Yes. *Origin?* **Tutor.** This violates the "Ownership/Endorsement" criterion. It's not the student's memory extended; it's the tutor's memory lent.
          *   *Verdict:* Fail Stage 4.
          *   *Likely Outcome:* Rejected. (Committee might be split, but procedure says no).
      *   **Case 3: Dictation + Grammar Tool (Written Expression Graded).**
          *   *Analysis:* Long-term use (2 years). Reliable. Trusted. *Origin?* Student dictates, tool restructures.
          *   *Conflict:* The exam measures "Written Expression." If the tool does the expressing, is it the student's skill?
          *   *Nuance:* If the tool is a prosthetic for a disability (e.g., dysgraphia), it's like a wheelchair for a race. But if the degree certifies "ability to write," does the prosthetic invalidate the certification?
          *   *Procedure Check:* Passes 1-4 (assuming student endorses the changes). Fails Stage 5 (Construct Alignment).
          *   *Verdict:* Referred to Department. Department likely says No.
          *   *Committee Resistance:* They might want to approve based on disability need. Procedure forces them to acknowledge the academic standard conflict.

  6.  **Addressing the "Resistance" and "Limitations":**

      *   *Resistance:* The committee might hate rejecting the Formula Sheet (Case 2) because it feels supportive. I need to argue why "Tutor's Memory" isn't "Student's Mind."
      *   *Resistance:* They might hate the Grammar Tool rejection (Case 3). I need to argue about the definition of the degree.
      *   *Limitations:* Legal duties (Equality Act/ADA), Self-report reliability, The "Normative" question (what *should* a degree be?).

  7.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Administrative, precise, philosophical but practical.
      *   *Structure:*
          1.  The Protocol (The 5 Gates).
          2.  Evidence & Stop Rules.
          3.  The Referral Mechanism.
          4.  Case Studies (The "Run").
          5.  Critique of Committee Practice vs. Procedure.
          6.  Limitations.
      *   *Self-Correction during drafting:* Make sure the "15 minutes" constraint is respected. The questions must be answerable quickly. Ensure the distinction between "Cognitive Extension" and "Academic Accommodation" is clear. The procedure determines if it's *cognitive extension*; the department determines if that extension is *permissible for the specific construct*.

      *(Self-Correction on Case 2)*: Wait, if the student *memorized* the sheet and uses it as a prompt, is it okay? No, the request is to *use the sheet*. If the sheet contains the answers (formulae), and the exam tests recall of formulae, it's a fail. If the exam tests *application*, maybe. The prompt says the rubric "partly rewards knowing which test to apply." This implies recall/selection is part of the skill. If the sheet tells them which test, it bypasses the skill. If the sheet just lists formulae, it bypasses recall. The "Tutor Compiled" aspect is the killer for EMT. It's not the student's cognitive history.

      *(Self-Correction on Case 3)*: Dictation is one thing. Grammar restructuring is another. If the tool changes syntax, it alters the "voice" and "expression." If written expression is graded, this is critical. The procedure should flag this at Stage 5 (Construct), not Stage 4 (Ownership), assuming the student endorses the output.

      *(Refining the "Stop Rules")*: Need to be explicit. "Hard Stop" vs. "Soft Fail."
      *   Hard Stop: Safety, Cheating, Acute/Temporary need (gaming).
      *   Soft Fail: Counts against approval, but can be overridden by Stage 5 referral.
      *   Actually, for the Committee's purpose (Mind vs. Tool), a Fail on Mind criteria means it's a Tool. If it's a Tool, the Committee shouldn't approve it for a *closed book* exam unless the Department says Tools are okay. So, a Fail on Stages 1-4 means "Recommend Rejection" unless Department overrides. A Pass on 1-4 means "Recommend Approval" subject to Department construct check.

      *Wait, the prompt asks for a procedure the Committee runs.* The Committee decides "May this student use this resource?" The Department owns the exam.
      *Revised Flow:*
      1.  Committee determines: Is this resource functionally part of the student's cognitive apparatus (EMT Pass)?
      2.  If No: It is an external aid. Default = Rejection for closed book.
      3.  If Yes: It is a cognitive prosthetic. Default = Approval, *unless* it violates the specific learning outcome (Stage 5).
      4.  Stage 5 is the Referral.

      *Let's tighten the Evidence requirements.* "Usage log" is good. "Clinician letter" is standard. "Demo" is hard in 15 mins, but a recorded demo or invigilator sign-off from a previous term works.

      *Let's finalize the "Anti-Gaming".* Minimum 6 months usage prior to request.

      *Let's write the response.*

  8.  **Final Review against constraints:**
      *   Ordered set of questions? Yes.
      *   Sufficient answer/Evidence? Yes.
      *   Stop rules? Yes.
      *   Referral framing? Yes.
      *   Three cases run? Yes.
      *   Limitations stated? Yes.
      *   Tone: Chair to Chair.

      *(One last thought on Case 2)*: The prompt says "compiled by their tutor." This is the weak link. Even if the student uses it automatically, it's not *their* memory extended. It's *scaffolding*. EMT requires the content to be previously endorsed by the agent. If the tutor wrote it, the student hasn't necessarily endorsed the *selection* of formulae, just the utility. I will mark this as a Fail on Stage 4.

      *(One last thought on Case 3)*: "Grammar tool restructure." This is active processing. It's not just a spellcheck. It's generating syntax. If the exam grades expression, this is outsourcing the cognitive task. Fail Stage 5.

      *(One last thought on Case 1)*: Screen reader. This is a translation layer. The content is the student's. The medium is changed. Pass all.

      *Okay, ready to generate.*
answer: |-
  ## The Cognitive Integration Protocol (CIP)

  **Purpose:** To distinguish between *cognitive prosthetics* (resources that function as part of the student's mind) and *external aids* (tools the mind uses).
  **Constraint:** 15 minutes per case.
  **Authority:** The Committee determines if the resource is a *prosthetic*. The Department determines if a *prosthetic* invalidates the specific learning outcome.

  ### Part I: The Five Gates

  The Committee must answer these five questions in order. If a "Hard Stop" is triggered, the request is denied immediately. If a "Soft Fail" occurs, it counts heavily against approval but may proceed to referral.

  #### Gate 1: History of Integration (The "Glue")
  **Question:** Has this resource been the student's primary mode of accessing or producing information for a continuous period prior to the request?
  *   **Sufficient Answer:** Yes, for a minimum of six months (or since onset of condition).
  *   **Evidence:**
      *   Clinician letter confirming diagnosis and recommending the specific tool as a long-term adaptation.
      *   Usage logs (digital metadata or software history) showing daily/weekly use.
      *   Statement from a personal tutor confirming observation of use over at least one prior term.
  *   **Hard Stop:** Usage began less than six months ago (unless acute onset of disability occurred <6 months ago). *Rationale: Prevents strategic adoption of aids for assessment advantage.*
  *   **Soft Fail:** Usage is consistent but intermittent (e.g., only for essays, not revision).

  #### Gate 2: Reliability & Availability (The "Coupling")
  **Question:** Is the resource reliably and immediately available to the student under invigilated conditions without granting access to prohibited networks or data?
  *   **Sufficient Answer:** Yes, the device/software functions offline or on a locked network, and the student has a backup protocol that does not involve human assistance.
  *   **Evidence:**
      *   Invigilator report from a mock exam or previous sitting.
      *   IT certification that the device is "clean" (no stored notes, no internet).
  *   **Hard Stop:** The resource requires internet access, external human support, or is prone to failure without a viable student-managed backup. *Rationale: A mind that disappears mid-thought is not a mind; it is a crutch.*
  *   **Soft Fail:** The resource requires significant setup time (>5 mins) at the start of the exam.

  #### Gate 3: Automaticity & Trust (The "Endorsement")
  **Question:** Does the student consult the resource automatically and trust its output without cross-checking against internal memory or other sources?
  *   **Sufficient Answer:** Yes. The student treats the output as they would treat a memory recall.
  *   **Evidence:**
      *   Short demonstration (video recorded or live) showing the student solving a problem using the resource.
      *   Self-report validated by tutor observation ("They do not second-guess the tool").
  *   **Hard Stop:** The student verifies the resource's output against a textbook or notes every time. *Rationale: This indicates the resource is a calculator, not a memory.*
  *   **Soft Fail:** The student occasionally overrides the resource but generally defers to it.

  #### Gate 4: Content Origin (The "Ownership")
  **Question:** Was the information or processing capability generated or curated by the student, or by a third party (tutor, peer, AI)?
  *   **Sufficient Answer:** The content is the student's own work, or the processing is a direct translation of the student's input (e.g., text-to-speech).
  *   **Evidence:**
      *   File metadata showing creation/editing history by the student.
      *   Sample comparison: Input vs. Output.
  *   **Hard Stop:** The content (formulae, notes, arguments) was compiled by a tutor or generated by AI. *Rationale: This is not the extension of the student's mind; it is the loaning of another mind.*
  *   **Soft Fail:** The resource contains standard reference material (e.g., a dictionary) but the selection was student-curated.

  #### Gate 5: Construct Alignment (The "Referral")
  **Question:** Does the use of this cognitive prosthetic bypass the specific learning outcome the examination is designed to measure?
  *   **Procedure:** If Gates 1–4 are passed, the Committee *recommends approval* but refers the final decision to the Department.
  *   **Referral Framing:** Do not ask: *"Is this aid allowed?"* (Departments answer "No" by reflex).
      *   **Ask:** *"We have determined this resource functions as part of the student's cognitive apparatus, equivalent to unaided memory or handwriting. Does its use invalidate the specific construct this paper certifies (e.g., 'unaided recall', 'manual calculation', 'syntax generation')?"*
  *   **Hard Stop:** The Department confirms in writing that the specific skill being tested is the *absence* of the prosthetic (e.g., a language exam testing manual orthography).

  ---

  ### Part II: Running the Cases

  Here is the procedure applied to the three cases currently before us.

  #### Case 1: The Visual Impairment (Screen Reader & Braille)
  *   **Request:** Philosophy exam (3 hours). Student has degenerative visual condition.
  *   **Gate 1 (History):** **Pass.** Six years of usage. Clinician letter and usage logs confirm daily reliance.
  *   **Gate 2 (Reliability):** **Pass.** Refreshable braille and screen reader are local, offline, and robust.
  *   **Gate 3 (Automaticity):** **Pass.** Student does not "check" the braille against memory; it *is* their reading channel.
  *   **Gate 4 (Ownership):** **Pass.** The text is the exam paper (provided by uni) and the answers are generated by the student. The device translates; it does not create.
  *   **Gate 5 (Construct):** **Referral.**
      *   *Department Question:* Does reading via braille/screen reader invalidate the assessment of "philosophical reasoning"?
      *   *Likely Dept Response:* No. The medium of input/output is irrelevant to the reasoning construct.
  *   **Verdict:** **Approved.**
  *   **Committee Reflex:** We usually approve this instantly.
  *   **Procedure Value:** Confirms the intuition but creates a defensible paper trail should a colleague argue this gives an "unfair advantage" (e.g., search functions). The protocol clarifies that search functions would fail Gate 2 or 4, but basic reading does not.

  #### Case 2: The Tutor-Compiled Formula Sheet
  *   **Request:** Statistics exam. One printed sheet of formulae/decision rules compiled by tutor.
  *   **Gate 1 (History):** **Soft Fail.** Student has used it for revision, but this is the first request for exam use.
  *   **Gate 2 (Reliability):** **Pass.** It is a piece of paper.
  *   **Gate 3 (Automaticity):** **Pass.** Student trusts the sheet.
  *   **Gate 4 (Ownership):** **Hard Stop.** **The content was compiled by the tutor.**
      *   *Analysis:* Under the Extended Mind Thesis, for the notebook to be part of the mind, the agent must have consciously endorsed the content in the past. If the tutor selected the formulae and rules, this is not the student's memory extended; it is the tutor's expertise lent. The student has not integrated this knowledge; they have outsourced it.
  *   **Verdict:** **Rejected.** (No need to proceed to Gate 5).
  *   **Committee Reflex:** We often approve this out of sympathy or a belief that "real world" allows notes.
  *   **Procedure Value:** This refuses a reflexive approval. It forces us to acknowledge that a *tutor's* cheat sheet is not a *cognitive prosthetic*. It is an unfair advantage over a student who memorized the same sheet. If the student had compiled it themselves over a term (Gate 1 & 4 Pass), it might have proceeded to Gate 5. But a tutor's handout is external knowledge, not internal extension.

  #### Case 3: Dictation & Grammar Restructuring
  *   **Request:** Subject where Written Expression is graded. Student dictates to phone; grammar tool restructures sentences.
  *   **Gate 1 (History):** **Pass.** Two years of daily use.
  *   **Gate 2 (Reliability):** **Soft Fail.** Phone battery/software stability in exam hall needs IT certification. Assume Pass for argument.
  *   **Gate 3 (Automaticity):** **Pass.** Student accepts the restructured sentences.
  *   **Gate 4 (Ownership):** **Soft Fail.** The student dictates the *meaning*, but the tool generates the *syntax*.
  *   **Gate 5 (Construct):** **Referral.**
      *   *Department Question:* Does the use of a tool that generates syntax invalidate the assessment of "Written Expression"?
      *   *Likely Dept Response:* **Yes.** If the degree certifies the ability to construct grammatical arguments independently, a tool that restructures sentences bypasses the construct.
  *   **Verdict:** **Rejected (via Department).**
  *   **Committee Reflex:** We often want to approve this because the disability is real and the tool reduces exhaustion.
  *   **Procedure Value:** This refuses a reflexive approval based on disability need alone. It highlights a conflict between *access* and *certification*.
      *   *Argument for Resistance:* You will resist this. You will say, "But they can't write otherwise."
      *   *Counter-Argument:* If the degree certifies "Ability to Write," and the student cannot write without a machine that rewrites them, the machine is writing. We can accommodate by changing the assessment (e.g., oral exam), but we cannot accommodate by allowing a tool that performs the graded skill. The procedure forces this distinction.

  ---

  ### Part III: Critique of Practice vs. Procedure

  **1. The Formula Sheet (Case 2)**
  *   **Your Practice:** Likely approval (viewed as "reasonable adjustment").
  *   **Procedure Verdict:** Rejection.
  *   **Why the Procedure is Right:** Approving a tutor-compiled sheet violates the parity principle. If the student cannot recall the formula, and the tutor provides it, the cognitive work is the tutor's. Allowing this devalues the degree for students who integrated that knowledge into their own biological memory.
  *   **The Compromise:** If the exam tests *application* not *recall*, the Department should provide a standard formula sheet to *all* students. Accommodation should not be private advantage.

  **2. The Grammar Tool (Case 3)**
  *   **Your Practice:** Likely approval (viewed as "leveling the playing field").
  *   **Procedure Verdict:** Rejection (on Construct grounds).
  *   **Why the Procedure is Right:** This is the hardest pill to swallow. If the learning outcome is "Write proficiently," a tool that writes proficiently *for* the student masks the deficit rather than accommodating it.
  *   **The Defect in Practice:** We conflate "access to the exam" with "exemption from the learning outcome." The procedure forces us to admit that some degrees require abilities this student may not be able to certify without modification to the *degree requirements*, not just the exam conditions.

  **3. The Visual Aid (Case 1)**
  *   **Your Practice:** Approval.
  *   **Procedure Verdict:** Approval.
  *   **Alignment:** Here, the procedure validates your intuition. It confirms that translation (text-to-braille) is not cognitive outsourcing.

  ---

  ### Part IV: Limitations of the Procedure

  You must record these limitations in your committee minutes to manage liability and expectation.

  1.  **Legal Supremacy:** This procedure is administrative, not legal. If national disability law (e.g., Equality Act, ADA) mandates an accommodation that fails Gate 4 (e.g., mandating a scribe who corrects grammar), the law overrides the CIP. The procedure protects academic integrity, not the university from litigation.
  2.  **The Self-Report Problem:** Gate 3 (Automaticity) relies heavily on student honesty. A strategic student can mimic trust. The procedure mitigates this with the 6-month history rule (Gate 1), but it cannot eliminate deception.
  3.  **The Normative Gap:** The procedure can tell you if a resource is *part of the mind*. It cannot tell you if *that mind* is what the university ought to certify.
      *   *Example:* If a student's "extended mind" includes an AI that solves calculus, and they trust it implicitly (Gate 3 Pass), and they curated the AI (Gate 4 Pass)... is this a mathematician?
      *   *Resolution:* This is why Gate 5 (Department Referral) is non-negotiable. The Committee decides the *metaphysics* (is it them?); the Department decides the *norms* (is that enough?).
  4.  **Exhaustion vs. Ability:** The procedure does not account for "cognitive load" unless it manifests as a disability diagnosis. A student who *could* do the work unaided but would be exhausted cannot claim the resource as a prosthetic (Gate 3 would fail—they would know they are using a shortcut). This is a feature, not a bug: exams are meant to test capacity under load.

  ### Final Instruction to the Committee

  When you sit next fortnight, do not ask: *"Is this fair?"*
  Ask: *"Is this them?"*

  If the answer is "Yes," ask the Department: *"Is 'them' enough for this degree?"*
  If the answer is "No," deny the request. If you cannot deny it due to legal pressure, you must record that the **assessment construct is compromised**, and the Department must alter the exam, not the rules.
