answer: |-
  **Research Proposal**

  **Title:** Beyond Values: The Ontology of Agency as a Predictor of Cross-Cultural Moral Judgement

  **1. Introduction and Research Question**
  Contemporary moral psychology is heavily dominated by the WEIRD (Western, Educated, Industrialized, Rich, Democratic) critique. Scholars like Haidt and Henrich have successfully demonstrated that moral intuitions vary significantly across cultures, particularly regarding dimensions like purity, authority, and harm. However, the prevailing debate often stalls at the level of *values*. The standard interpretation suggests that either moral truths are relative (different cultures value different things) or that WEIRD populations are outliers operating with a biased dataset.

  This proposal seeks to pivot the inquiry from the *content* of moral values to the *metaphysical preconditions* of moral judgement. Specifically, it investigates whether the divergence in moral intuition stems from a deeper disagreement about the ontology of agency. The central research question is: **To what extent does variation in the folk ontology of agency (individual vs. distributed) explain cross-cultural divergence in moral judgement without necessitating moral relativism?**

  The hypothesis is that WEIRD subjects default to an ontology where agency is atomistic (belonging to a single individual), whereas non-WEIRD subjects may operate with a distributed ontology (where agency is shared across social networks or contexts). If moral judgement relies on identifying an agent to hold responsible, then differing ontologies of agency will produce differing moral judgements even if the underlying moral principles remain constant.

  **2. Background and Limitations of Existing Positions**
  The current literature largely bifurcates into two camps. On one side, descriptive moral psychologists (e.g., Haidt, Henrich) map the variations in moral foundations. Their work is robust empirically but often agnostic or deflationary regarding moral truth. On the other side, moral realists and objectivists argue for universal moral grammars, often dismissing cross-cultural variance as performance error or noise.

  Both positions leave a significant gap. The psychologists describe *that* people judge differently, but rarely ask *why* the structure of the situation is perceived differently in the first place. The objectivists assume a universal concept of 'the agent' without testing whether 'agency' itself is a culturally stable concept. By treating agency as a fixed variable, existing models may be misidentifying ontological differences as axiological ones. If a culture views an action as the product of a network rather than an individual, blaming the individual is not a different *moral* stance, but a different *factual* assessment of causality. This proposal aims to fill this gap by conceptualising agency not as a universal constant, but as a variable folk concept.

  **3. Methodology**
  As this module does not permit primary data collection with human subjects, the methodology will be twofold, combining conceptual analysis with a hypothetical empirical framework.

  *   **Conceptual Analysis:** The first phase will involve rigorous philosophical analysis of 'agency'. I will examine theories of distributed cognition and collective intentionality (e.g., Bratman, Gilbert) and contrast them with standard individualistic models of moral responsibility. The goal is to construct a coherent model of 'distributed agency' that could plausibly function as a default ontology for non-WEIRD populations.
  *   **Hypothetical Empirical Framework:** The second phase will sketch a experimental design that *could* test this hypothesis. I will design a series of vignettes where the causal chain of an action is ambiguous. For example, a scenario where an individual causes harm only because of a specific social pressure or network failure. I will outline how different responses to these vignettes would indicate either a difference in moral weighting (valuing loyalty over harm) or a difference in agency attribution (seeing the network as the cause rather than the individual).

  This approach allows me to engage with the empirical literature without needing ethical approval or funding, keeping the project within the scope of a philosophy and social science dissertation. There was a similar issue in teh previous draft regarding scope, but this seems manageable.

  **4. Expected Outcomes and Criteria for Success**
  A successful outcome for this project would be a robust theoretical model demonstrating that ontological variance can account for significant portions of the data currently attributed to moral relativism. Specifically, I aim to show that if one controls for differences in agency attribution, the gap in moral judgement between WEIRD and non-WEIRD samples narrows.

  **Criteria for Success:**
  *   A clear distinction is drawn between ontological variance (what is the agent?) and axiological variance (what is good?).
  *   The hypothetical framework identifies specific variables that could be tested in future cross-cultural psychology studies.
  *   The argument successfully avoids strong moral relativism while acknowledging deep cultural divergence.

  **Criteria for Failure:**
  *   If conceptual analysis reveals that 'agency' is too fundamental to be culturally variable (i.e., if all cultures must recognise individual intent to have morality at all).
  *   If the hypothetical framework proves indistinguishable from existing models of moral foundations (i.e., if distributed agency is just another way of describing 'community' values).

  **5. Project Timeline**
  The project will be conducted over a standard 12-week semester.

  *   **Weeks 1–3:** Literature review. Focus on moral psychology (Haidt, Henrich) and philosophy of action (agency, intentionality). Refine the definition of 'distributed agency'.
  *   **Weeks 4–6:** Conceptual analysis. Drafting the core argument linking ontology to moral judgement. Developing the distinction between factual causality and moral blame.
  *   **Weeks 7–9:** Developing the hypothetical empirical framework. Designing the vignettes and outlining how data would be interpreted.
  *   **Weeks 10–11:** Writing and synthesis. Assembling the chapters and ensuring the argument flows logically from metaphysics to social science.
  *   **Week 12:** Proofreading and final formatting. Checking citations and ensuring British English spelling conventions are applied consistently throughout.

  **6. Conclusion**
  This project offers a novel contribution to the debate on moral universals. By shifting the focus from values to ontology, it provides a pathway to respect cross-cultural differences without abandoning the possibility of objective moral reasoning. It bridges the gap between descriptive social science and normative philosophy, offering a more nuanced understanding of why we judge as we do.
