  **DIRECTORATE OF MORAL COHESION**
  **Internal Consultation Paper: 89-C**
  **Subject:** Operationalizing the Shared Moral Code (SMC) for FY 2024-25
  **Date:** 14 October 2023

  **1. Identification of Moral Consensus**
  Pursuant to the Social Fabric Act, the Directorate must isolate the specific convictions constituting the Shared Moral Code. Consultation responses highlight difficulties in distinguishing deep moral feeling from mere preference or partisan interest. To resolve this, the Directorate has adopted a Weighted Disgust Metric. Responses indicating physical revulsion are assigned a multiplier of 1.5 over those indicating intellectual disapproval. However, determining whose revulsion counts remains contentious. Survey data suggests a divergence between urban and rural thresholds. To maintain statutory neutrality, the Directorate will prioritize convictions held by the "stable demographic," defined as households residing at the same address for over thirty years. This excludes transient populations whose moral intuitions may not yet be calibrated to national standards. Furthermore, we must distinguish the shared morality from the demands of organized lobbying groups. Consequently, any moral conviction accompanied by a printed manifesto is discounted as special pleading. Only unarticulated, visceral consensus qualifies as the binding glue of society.

  **2. Calibration of the Reasonable Person**
  The statutory standard for enforcement relies on the reaction of the "Reasonable Person." Historically, this benchmark was maintained by a panel of jurors recruited from the stops of the South London bus route 159. Following the 1998 rerouting of the 159 away from Streatham, the panel has diminished to a rump of twelve residents living near the obsolete stops. Relocation budgets were denied by Treasury. Consequently, the Directorate must accept this self-selected group as the sole arbiters of national decency. While demographically narrow, their consistency offers administrative stability. It is noted that their moral intuitions remain fixed circa 1995. This provides a useful control variable, preventing the Code from shifting due to transient cultural fluctuations. We treat their views not as local opinion, but as the baseline moral architecture against which all deviance is measured. Their isolation ensures their judgment remains uncorrupted by modern social mixing.

  **3. Measurement Interference and Feedback Loops**
  Stakeholders have noted that annual attitude surveys and public information campaigns constitute interventions in the moral culture they aim to measure. By asking citizens to articulate their moral boundaries, the Directorate inevitably hardens those boundaries. Similarly, prosecutions publicize specific prohibitions, reinforcing the very norms they enforce. This creates a circularity where the Directorate enforces a consensus its own procedures helped manufacture. However, from an operational standpoint, this is classified as "dynamic stabilization." Whether the Shared Moral Code exists independently or is produced by our enforcement machinery is metaphysically interesting but administratively irrelevant. So long as the Disintegration Index remains within green parameters, the origin of the consensus is immaterial. We are measuring cohesion, not truth. The feedback loop is thus reclassified as a feature of the system, ensuring the morality remains robust enough to withstand scrutiny.

  **4. Current Disintegration Metrics and Recommendations**
  The latest wave of the Disintegration Index indicates a significant shift. A large majority now endorse a "live-and-let-live" posture regarding private conduct. Under the Social Fabric Act, society is held together by a common moral code; a real shift in that code risks social disintegration. Therefore, the emergence of a new morality constitutes a threat to cohesion equivalent to the immorality it seeks to permit. To preserve the Shared Moral Code—which is defined by its stability rather than its content—the Directorate recommends the immediate criminalization of tolerance. Permitting individuals to opt out of shared moral judgments weakens the collective bond. Prosecuting tolerance will reaffirm the obligation to judge, thereby restoring the intensity of shared feeling required to hold society together. We propose a tiered penalty system for unchecked permissiveness, beginning with mandatory attendance at Moral Continuity Workshops.

  ^1 Dr. Aris Thorne, Senior Sociologist (Grade 7), notes that criminalizing tolerance to preserve a morality that no longer exists amounts to enforcing cohesion against the society it is meant to cohere. He suggests the Directorate is preserving itself rather than the social fabric. This view was rejected as outside the Directorate's statutory remit.
