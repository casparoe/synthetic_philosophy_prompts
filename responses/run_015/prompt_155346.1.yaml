  **The Stability of Shadows: Nested Masks and the Fate of Pure Powers**

  The late-night intuition that dispositions must rest on something "solid" is a powerful one. In the heat of argument, it feels obvious that if a fragile vase can be finked (losing fragility upon strike) and a soluble sugar can be masked (prevented from dissolving by an interferent), then the disposition itself is too ephemeral to carry the weight of reality. If every power can be neutralized, and every neutralizer can be neutralized in turn, we face a regress of interference that threatens to dissolve the ontology of powers entirely. The categoricalist argues that this regress proves dispositions are merely epistemic shadows cast by categorical bases—intrinsic, qualitative properties that persist regardless of interference. The dispositionalist counters that this confuses the *manifestation* of a power with its *existence*.

  This essay addresses the specific threat of arbitrarily nested masking structures to a pure-power ontology. I argue that while nested interference dismantles the naive view of powers as intrinsic, monadic properties of isolated objects, it does not force a retreat to categoricalism. Instead, it necessitates a shift toward **Structural Dispositionalism**. The existence of infinite masking regresses does not collapse the categorical-dispositional distinction; rather, it preserves it by demonstrating that stability is a systemic, relational feature rather than an intrinsic, categorical one. However, this victory comes at the cost of abandoning the autonomy of individual powers.

  ### The Categoricalist Challenge: The Need for a Terminus

  The categoricalist's argument from nested masks is essentially an argument from explanatory grounding. If a disposition $D$ manifests only if mask $M_1$ is absent, and $M_1$ is absent only if anti-mask $A_1$ is present, and $A_1$ is present only if mask $M_2$ is absent, we have a chain of conditions. If this chain extends infinitely without a base, the categoricalist claims the manifestation condition is never satisfied.

  For the categoricalist (such as Armstrong or Lewis), a property must have a "nature" that is distinct from its relations. If a property is nothing but its potential to manifest under certain conditions, and those conditions are themselves nothing but further potentials, nothing ever actually *is* anything. The regress of masks suggests that without a categorical floor—a property that simply *is* what it is, immune to masking because it is not defined by what it *does*—the entire causal network floats in void. The categoricalist insists that for a mask to operate, it must interact with something intrinsic. If that intrinsic something were purely dispositional, it could be finked away. Therefore, there must be a residue of categorical being that survives the fink. If nested masking is metaphysically possible, the categoricalist argues, then a world of *only* powers is a world where nothing can ever happen, because the conditions for happening are perpetually deferred.

  ### The Dispositionalist Defense: Coherentism and Systemic Stability

  The pure-power defender (following Mumford, Bird, or Ellis) must accept the possibility of nested masking but deny that it requires a categorical terminus. The key move is to reject the assumption that causal chains require a foundational "first link" in the way a building requires a foundation. Instead, the ontology of powers resembles a web or a network.

  In a Structural Dispositionalist view, the identity of a power is determined by its place in the total causal network. A mask does not "block" a power from the outside; it enters into a specific relational configuration with that power. The infinite regress of masks does not imply that manifestation is impossible; it implies that manifestation is a global state of the system, not a local property of an object.

  Consider the analogy of a chess game. The power of a "Bishop" to move diagonally is masked by a piece blocking its path. That blocking piece's power to block is masked by the rules of capture, which are masked by the turn structure, and so on. There is no "categorical base" to the game pieces outside the rules. The stability of the game does not come from the wood of the pieces (the categorical base) but from the coherence of the rule system. Similarly, in a pure-power ontology, the "base-level stability" is not an intrinsic immunity of a specific property, but the contingent stability of the causal laws governing the network.

  If nesting is infinite, it does not mean manifestation fails; it means manifestation is the result of the *totality* of relations obtaining at a time $t$. The regress is not vicious if the system is viewed holistically. The disposition to dissolve is real even if masked, because its reality consists in its contribution to the causal structure of the world, not merely in its successful actualization. The "explanatory work" is done by mapping the structure of possibilities, not by pointing to a categorical engine.

  ### Verdict: The Distinction Preserved in Modified Form

  I defend the verdict that nested interference **preserves the categorical-dispositional distinction in modified form.** It does not collapse into categoricalism, but it forces dispositionalism to abandon "atomistic" powers in favor of "holistic" powers.

  The categoricalist is correct that *individual* powers cannot bear the explanatory load if they are subject to arbitrary nesting. An isolated power is indeed ontologically insecure. However, the categoricalist is wrong to infer that this requires *intrinsic qualitative natures*. The alternative is not "categorical base" vs. "nothing"; it is "intrinsic nature" vs. "relational structure."

  Nested masking shows that powers are not properties *of* things so much as they are nodes *between* things. The regress terminates not in a categorical property, but in the **closure of the causal network**. A world of pure powers is possible if and only if the network of powers is mutually defining and sufficiently dense to fix the identity of each node. The "base" is the structure itself. Therefore, the existence of finks and masks does not prove dispositions are unreal; it proves they are essentially relational. The distinction remains because categorical properties are defined by *what they are* (quiddity), while powers are defined by *what they relate to* (causal role). Even an infinite chain of masks is a chain of causal roles, not a revelation of quiddities.

  ### Conditions for Changing My Mind

  My commitment to this Structural Dispositionalist verdict is contingent on two specific metaphysical possibilities. I would abandon this view and concede to the categoricalist if either of the following were established:

  1.  **Proof of Metaphysical Impossibility of Infinite Causal Regresses:** If it were rigorously demonstrated (perhaps via a modal logic argument akin to Benacerraf's identification problem or a cosmological argument applied to properties) that an infinite chain of conditional dependencies cannot constitute a real world, then a categorical terminus would be necessary. If an infinite regress of masks logically entails that no manifestation can *ever* occur (a "supertask" failure applied to ontology), then pure powers are impossible.
  2.  **Evidence of "Brute" Intrinsicity:** If we could identify a property that is demonstrably immune to masking *not* because of a stronger counter-power, but because it lacks the relational structure required to be masked. For example, if consciousness or specific quantum states were proven to be intrinsic qualities that persist even when all causal outputs are finked, this would suggest a categorical residue. If a property can exist without *any* potential for manifestation (a "bare particular" of property space), pure dispositionalism fails.

  ### Vulnerabilities in Reasoning

  My reasoning is most vulnerable in its treatment of **identity fixation**. In a holistic network of powers, the identity of power $P$ is fixed by its relations to $Q$ and $R$. But $Q$ and $R$ are fixed by their relations to $P$. The categoricalist will argue this is circular and fails to fix reference (the "swap problem": could all powers swap causal roles without us knowing?).

  If the network of powers is the only reality, what distinguishes a world where Power $A$ causes $B$ from a world where Power $A^*$ causes $B^*$, if the structural relations are identical? The categoricalist posits a "quiddity" to solve this. My defense relies on the claim that such a distinction is metaphysically idle. This is a weak point. If one accepts that distinct worlds can be structurally identical but qualitatively different (haecceitism about properties), then pure powers are insufficient to describe reality. My argument assumes **Structuralism** is true; if Structuralism is false, the nested mask regress does indeed destroy pure powers, because there would be no "structure" to hold them up, only a void where categorical bases should be.

  Furthermore, I assume the metaphysical coherence of "infinite nesting." If there is a limit to complexity in nature (a physical or metaphysical granularity), then the regress stops. If it stops at a level that is not dispositional, categoricalism wins. I have assumed the regress can be infinite *and* coherent; if that assumption is the weak link, the entire defense collapses.

  ### Conclusion

  The late-night worry that dispositions are "explanatorily idle" in the face of masks stems from a demand for intrinsic security. But security in a causal world is not intrinsic; it is systemic. Nested masks do not reveal that powers are illusions; they reveal that powers are not solitary. They are threads in a fabric. To pull one is to tug the whole. We need not posit a categorical floor to stop the fall; we need only recognize that in a world of pure powers, there is no "down" to fall toward, only the web of relations that constitutes existence itself. The distinction survives, but the powers must surrender their sovereignty to the structure.
