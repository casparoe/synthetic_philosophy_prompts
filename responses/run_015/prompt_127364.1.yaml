answer: |-
  We must contrast the endurantist view, where objects are wholly present at each moment, with the perdurantist model, where objects are extended spacetime worms composed of temporal parts. In material constitution, endurance struggles to explain how the clay and statue coincide without being identical, whereas four-dimensionalism allows them to be distinct worms sharing a specific temporal segment. This shift reframes identity as a relation between temporal stages rather than a strict numerical sameness across time.

  1. Four-dimensionalism dissolves the coincidence puzzle by positing that the statue and the clay are distinct spacetime worms that share temporal parts during their coexistence but differ in their temporal extent. This view denies numerical identity between the constituting matter and the constituted object at any single instant, treating them as overlapping mereological sums.
  2. Regarding restored artworks, the original statue-worm ceases to exist upon significant material loss, meaning a restoration merely creates a numerically distinct successor worm rather than continuing the original entity. Consequently, the ontological status of a restored piece is that of a replica sharing historical causal connections, not the persisting substance of the initial creation.
  3. Legal ownership claims over destroyed sculptures must shift from rights over a persisting substance to rights over the specific spacetime region occupied by the original temporal parts. If the sculpture is destroyed, the object no longer exists, rendering ownership claims applicable only to the remaining fragments or the intellectual rights associated with the worm's history.
  4. Radical deformation cannot be coherently described as the survival of the original statue because the modal properties defining the statue-worm's essence are violated when its shape changes beyond a certain threshold. Such deformation marks the termination of the original spacetime worm and the beginning of a new object, rejecting the intuition that the clay merely survives in a new form.
  5. Ultimately, this framework prioritizes precise temporal boundaries over common-sense persistence, forcing us to accept that ordinary objects are far more fragile than our language suggests. We must therefore reconcile our legal and aesthetic practices with an ontology where most named objects are fleeting stages of larger material processes.
