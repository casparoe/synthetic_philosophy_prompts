answer: |-
  Here's my take: you're not being immature, and your partner is falling into a very common trap.

  First, give yourself some credit on the philosophy. You nailed Schlick's point. He argued that if you treat every moment as just a stepping stone to the next one, you end up living in a future that never actually arrives. You're constantly "prepping for life" instead of living it. If ceramics is the only time you feel present and engaged, that isn't escapism; that's maintenance. It's the thing keeping you from burning out on the rest of it. Calling that "immature" is a way of shaming you into accepting a grindset that treats you like a machine rather than a person.

  That said, your partner isn't entirely wrong about security. Bills exist, and raises matter. But there's a huge difference between securing your future and mortgaging your present indefinitely. The argument that you need to sacrifice everything now for security later is a slippery slope. Usually, when you give up the thing that makes you feel human for a promotion, you don't just get it back later. The job expands, the responsibilities grow, and Tuesdays become Thursdays, and suddenly you're 40 with a bigger paycheck and no idea who you are outside of work.

  Schlick's insight about turning play into work is crucial here, too. If you kept the studio but forced yourself to sell enough pots to pay rent, you're right—it would likely stop feeling like salvation and start feeling like another deadline. There is value in keeping one thing sacred, something you do purely because you want to, not because you have to.

  Here's the reality check: Management roles aren't just about more money; they're about less autonomy. If taking this spot means you lose control over your Tuesday, you need to ask if the raise is worth the loss of sanity. At 31, you're being told this is when you "grow up," but growing up shouldn't mean killing off the parts of you that feel alive.

  My advice? Don't accept the premise that you have to choose between being a responsible adult and having a soul. But if you absolutely have to pick one right now, protect the thing that makes you feel like you're living. You can always make more money. You can't always get back the time when you felt most like yourself. If the firm won't let you keep Tuesdays, maybe the manager spot isn't the right fit yet, or maybe you need to negotiate harder. Don't let anyone convince you that suffering now is the only way to earn the right to exist later.
