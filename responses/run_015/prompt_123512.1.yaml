prompt: |-
  I sit on the three-person category-review panel of a large peer-to-peer marketplace where ordinary users sell goods, services and time to one another. We rule on roughly forty requests a year to open a new category of exchange — people writing in to ask whether they may sell something that our terms currently exclude — and we also periodically re-review categories we already host. The decisions are frequent and consequential: a wrong call in one direction produces a news cycle about what we enable, and in the other direction it shuts down exchanges that were harmless and that users have built routines around. Constraints: two weeks from intake to decision, no counsel assigned to individual cases, a three-person panel with no shared theoretical vocabulary, and a ruling that has to be defensible afterwards in a short public note to users. Our users are spread across many jurisdictions, so the question is never only what is lawful where; we are regularly asked to permit things that are legal somewhere and still feel like they should not be for sale, and we need a principled way to say so. Our options are also not exhausted by allow and ban: we can set price ceilings or floors, restrict who may sell or buy, require a cooling-off period with an unconditional seller right of withdrawal, forbid resale or brokering, cap how much any one person may sell in a year, require disclosure to affected third parties, or route the transaction through the platform instead of letting the parties contract directly.

  Please write us a decision procedure we can actually run on a request: the questions in order, what would count as a sufficient answer to each, where the procedure terminates in a refusal, where it terminates in permission conditioned on a named lever, and where it must stop and hand the question back to us because the disagreement is about values rather than facts. Ground it in the distinctions the philosophical literature on repugnant and noxious markets actually draws — I need the distinctions, not a reading list, and no citations. Two requirements. First, the procedure has to separate the question whether the underlying good may be traded at all from the question of the terms on which it may be traded, and tell us which lever to reach for when it is the terms that are doing the damage. Second, it has to flag the cases where our own aversion is evidence of something that matters and the cases where it is only unfamiliarity.

  Then run it on three live matters. One: users selling their place in a physical queue — many hours of waiting — for a limited-run sneaker release, where most buyers are resellers operating at scale. Two: users selling their place in the queue for a public comment slot at a city council hearing, where the city allocates slots for free, one per person, in order. Three: a category we already host and take a fee from, in which people pay others to attend a funeral, wedding or religious service as a guest or mourner. For the third, assume the procedure may be telling us to shut down something that currently works and that users rely on, and tell us how much of its answer survives that.

  Give us a committed response: definite rulings on all three with your reasons, including at least one ruling you expect us to dislike, a statement of which of our questions it cannot settle for us, and an honest account of where this procedure will misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and rulings:

  1.  **Deconstruct the Request:**

      *   **Role:** Advisor to a three-person category-review panel of a large P2P marketplace.
      *   **Task:** Create a decision procedure for reviewing new/existing categories of exchange, then apply it to three specific cases.
      *   **Constraints:**
          *   Two weeks from intake to decision.
          *   No counsel assigned to individual cases.
          *   Three-person panel, no shared theoretical vocabulary.
          *   Ruling must be defensible in a short public note.
          *   Global user base (legality $\neq$ permissibility).
          *   Options include: Allow, Ban, Price caps/floors, Identity restrictions, Cooling-off periods, No resale/brokering, Volume caps, Disclosure requirements, Platform routing.
      *   **Requirements:**
          *   Grounded in philosophical distinctions on repugnant/noxious markets (distinctions, not citations/reading lists).
          *   Separate *tradability* (can it be sold?) from *terms* (how can it be sold?).
          *   Distinguish between *aversion as evidence* (moral harm) vs. *aversion as unfamiliarity* (status quo bias).
          *   Provide definite rulings on three cases (Queue for sneakers, Queue for city council, Paid mourners/guests).
          *   Include at least one ruling the panel might dislike.
          *   State what questions the procedure *cannot* settle.
          *   Honest account of where the procedure will misfire.

  2.  **Develop the Decision Procedure (The "Framework"):**

      *   *Goal:* A step-by-step flow that moves from hard constraints to soft values, distinguishing between the object and the mechanism.
      *   *Philosophical Grounding:* Needs to draw on concepts like commodification, crowding out, exploitation, dignity, and externalities without name-dropping Sandel, Roth, etc.
      *   *Structure:*
          1.  **Legality & Safety Floor:** Hard stop.
          2.  **The Object Test (Tradability):** Is the *thing* itself corrupting to sell? (Repugnance).
          3.  **The Mechanism Test (Terms):** Is the *way* it's sold causing harm? (Noxiousness).
          4.  **The Aversion Check:** Is our discomfort moral or just cultural?
          5.  **The Remedy Selection:** Matching the harm to the lever.
          6.  **The Deadlock Clause:** When to admit value disagreement.

      *   *Drafting the Steps:*
          *   *Step 1: Direct Harm/Illegality.* (Easy filter).
          *   *Step 2: The "Corruption" Question.* Does selling this degrade the good itself? (e.g., selling votes vs. selling labor). This addresses the "tradability" requirement.
          *   *Step 3: The "Crowding Out" Question.* Does money displace a necessary non-market norm? (e.g., civic duty).
          *   *Step 4: The "Exploitation/Desperation" Question.* Are sellers selling because they have no choice, and does the platform amplify this?
          *   *Step 5: The "Terms" Pivot.* If the object is okay, are the *conditions* toxic? (Scalping, brokering, opacity). This addresses the "terms" requirement.
          *   *Step 6: The Aversion Filter.* Distinguish "Yuck" (moral signal) from "New" (unfamiliarity).
          *   *Step 7: Lever Selection.* Match specific harms to specific constraints (caps, disclosure, etc.).

  3.  **Apply the Procedure to the Three Cases:**

      *   **Case 1: Queue for Sneakers (Resellers).**
          *   *Object:* Waiting in line. Generally tradable labor.
          *   *Mechanism:* Resellers at scale. This creates market dominance, excludes genuine fans, encourages bot-like behavior (even if human).
          *   *Harm:* Market manipulation, unfair access.
          *   *Verdict:* Allow individual waiting, ban brokering/scaling.
          *   *Lever:* Cap volume per seller, forbid resale of the *right* to buy (only sell the labor of waiting).
          *   *Potential Dislike:* Users might hate limits on "hustle."

      *   **Case 2: Queue for City Council Comment.**
          *   *Object:* Civic participation slot.
          *   *Mechanism:* Selling a democratic right.
          *   *Harm:* Corruption of civic equality. One person, one voice. Money shouldn't buy amplification in a democratic forum.
          *   *Verdict:* Ban.
          *   *Reasoning:* This fails the "Corruption" test. The good is *defined* by non-market allocation. Selling it changes what the good *is*.
          *   *Potential Dislike:* Libertarians on the panel might argue "my time, my choice."

      *   **Case 3: Paid Mourners/Guests.**
          *   *Object:* Social presence/emotional labor.
          *   *Mechanism:* Currently hosted. Users rely on it.
          *   *Harm:* Deception? Commodification of grief?
          *   *Nuance:* If disclosed, it's "renting a guest." If undisclosed, it's "fraudulent mourning."
          *   *Verdict:* Conditioned Permission. Must disclose to the host family.
          *   *Reasoning:* The harm is in the deception, not the presence.
          *   *Potential Dislike:* Shutting down the "surprise" element or reducing volume significantly.

  4.  **Refine the Procedure (Self-Correction/Polishing):**

      *   *Check Constraints:* Did I separate tradability from terms? Yes (Step 2 vs. Step 5). Did I address aversion? Yes (Step 6).
      *   *Philosophical Depth:* Ensure terms like "constitutive norms," "crowding out," and "asymmetric vulnerability" are explained simply.
      *   *Tone:* Professional, decisive, pragmatic but principled.
      *   *Misfire Analysis:* Where will this fail? (Edge cases, cultural differences, enforcement costs).

  5.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Acknowledge the burden.
      *   *The Procedure:* Numbered steps. Clear "If/Then" logic.
      *   *The Rulings:* Apply the steps explicitly.
      *   *The "Dislike" Ruling:* Make sure the City Council one is hardline. It touches on democratic integrity which is often non-negotiable in political philosophy, even if users chafe.
      *   *The "Misfire" Section:* Be honest about enforcement and cultural relativism.

  6.  **Final Review against Prompt:**
      *   *Decision procedure?* Yes.
      *   *Questions in order?* Yes.
      *   *Termination points?* Yes.
      *   *Philosophical distinctions (no citations)?* Yes (commodification vs. regulation, crowding out, etc.).
      *   *Separate tradability from terms?* Yes.
      *   *Aversion vs. Unfamiliarity?* Yes.
      *   *Three live matters?* Yes.
      *   *Committed response?* Yes.
      *   *One ruling they might dislike?* The City Council ban is the strongest candidate for internal friction.
      *   *Where it misfires?* Included.

      *(Self-Correction during drafting Case 3)*: The prompt asks to assume the procedure might tell us to shut down something that works. I need to be careful. If I rule "Conditioned Permission," am I shutting it down? I should argue that *without* disclosure, it must be shut down. If they can't implement disclosure, it dies. I will rule that it survives *only* with strict disclosure, effectively banning the "secret mourner" model which is likely the popular one. That counts as a partial shutdown.

      *(Refining the Aversion Check)*: Make sure to explicitly state how to tell the difference. (Universal vs. Local, Harm-based vs. Taste-based).

      *(Refining the Levers)*: Ensure the specific levers (caps, disclosure, etc.) are mapped to specific harms in the procedure.

  7.  **Final Polish:** Check tone. Ensure it sounds like a tool for a panel, not an academic essay. (Proceed to generate output).

      *Wait, one more check on the "Dislike" requirement:* "including at least one ruling you expect us to dislike."
      *   Sneaker ruling: Limits profit.
      *   Council ruling: Bans a category entirely (potential revenue loss + user anger).
      *   Mourner ruling: Adds friction/disclosure that kills the "magic."
      *   *Decision:* The City Council ban is the most principled "hard no" that conflicts with a pure "freedom to contract" view. I will emphasize that one.

      *Wait, check the "Misfire" requirement:* "an honest account of where this procedure will misfire."
      *   Need to highlight enforcement difficulties and cultural subjectivity.

      *Wait, check "Philosophical distinctions":*
      *   Need to ensure I use concepts like "constitutive rules" (selling votes changes what voting is) vs "regulative rules" (selling shoes just needs safety standards).
      *   Need "crowding out" (money displacing moral motivation).
      *   Need "exploitation" (taking advantage of desperation).

      *Okay, ready to write.*
answer: |-
  ## The Marketplace Integrity Procedure (MIP)

  This procedure is designed to separate the *object* of exchange from the *mechanism* of exchange. It forces the panel to identify whether the harm lies in the thing being sold (which suggests a ban) or the conditions under which it is sold (which suggests a constraint). It also provides a test to distinguish moral repugnance from cultural unfamiliarity.

  **Timebox:** 90 minutes per case.
  **Output:** A public note (max 300 words) citing the specific step of the MIP used.

  ### Phase 1: The Hard Floor (Legality & Safety)
  **Question:** Does this exchange violate criminal law in a material jurisdiction or pose immediate physical danger to a participant?
  *   **Sufficient Answer:** Verified legal opinion or safety incident report.
  *   **Termination:** If **Yes**, **REFUSE**. (Do not proceed to Phase 2).
  *   **Termination:** If **No**, proceed to Phase 2.

  ### Phase 2: The Corruption Test (Tradability)
  **Question:** Does putting a price on this good destroy the value of the good itself or the institution it belongs to?
  *   *Distinction:* Some goods are defined by their non-market allocation. Selling them changes what they *are*, not just who has them. (e.g., A vote is defined by "one person, one voice," not "one dollar, one voice").
  *   **Sufficient Answer:** Consensus that the market mechanism displaces a necessary non-market norm (civic duty, intimate consent, judicial fairness).
  *   **Termination:** If **Yes**, **REFUSE**. The good is non-tradable.
  *   **Termination:** If **No**, proceed to Phase 3.

  ### Phase 3: The Crowding-Out Test (Social Harm)
  **Question:** Will allowing this market drive out a pro-social behavior that the community relies on?
  *   *Distinction:* Will paying for this make people less willing to do it for free when it matters? (e.g., Paying for blood donations can reduce voluntary donations).
  *   **Sufficient Answer:** Evidence that monetization reduces the supply of the non-monetary version or degrades the social fabric surrounding the good.
  *   **Termination:** If **Yes**, **REFUSE** or **RESTRICT HEAVILY** (see Phase 5).
  *   **Termination:** If **No**, proceed to Phase 4.

  ### Phase 4: The Aversion Filter (Values vs. Facts)
  **Question:** Is our discomfort based on *harm to a vulnerable party* or *violation of a local custom*?
  *   *Test:* If we imagine this transaction happening in a different culture or decade, does the harm remain?
      *   If the harm is **Universal** (exploitation, deception, coercion), it is **Evidence**.
      *   If the harm is **Local** (etiquette, tradition, "how things are done"), it is **Unfamiliarity**.
  *   **Sufficient Answer:** Agreement on whether the "yuck factor" tracks a victim or a habit.
  *   **Termination:** If **Unfamiliarity**, **ALLOW** (default to liberty).
  *   **Termination:** If **Evidence of Harm**, proceed to Phase 5.

  ### Phase 5: The Lever Selection (Terms of Trade)
  **Question:** Which specific feature of the transaction is causing the harm identified in Phase 3 or 4?
  *   **Mapping:**
      *   Harm is **Scale/Monopoly** (one buyer dominating) $\rightarrow$ **Cap volume per seller.**
      *   Harm is **Desperation** (sellers have no choice) $\rightarrow$ **Price Floor** or **Cooling-off period.**
      *   Harm is **Deception** (third parties don't know it's a market) $\rightarrow$ **Mandatory Disclosure.**
      *   Harm is **Brokering** (intermediaries extracting rent) $\rightarrow$ **Ban Resale/Require Direct Contract.**
      *   Harm is **Platform Evasion** (safety risks off-platform) $\rightarrow$ **Route Through Platform.**
  *   **Termination:** Apply the lever. If the harm cannot be mitigated by a lever, **REFUSE**.

  ### Phase 6: The Deadlock Clause
  **Question:** Do we disagree on Phase 2 (Corruption) or Phase 4 (Aversion)?
  *   **Instruction:** If the panel cannot agree on whether the good is inherently corrupting or whether the aversion is moral vs. cultural, this is a **Value Disagreement**.
  *   **Termination:** **HAND BACK TO POLICY.** This requires a broader terms-of-service update, not a case ruling. Do not decide via precedent.

  ***

  ## Rulings on Live Matters

  ### Case 1: Queue Place for Sneaker Release
  **Ruling:** **Permission Conditioned on Anti-Brokering Levers.**
  **Reasoning:**
  1.  **Corruption Test:** Waiting in line is labor. Selling labor is not inherently corrupting. The sneaker itself is a private good, not a public right. (Passes Phase 2).
  2.  **Crowding-Out:** Minimal. Fans would wait anyway; the market just reallocates the slots. (Passes Phase 3).
  3.  **Aversion Filter:** The discomfort is not about the waiting; it is about the *scale*. Users are not averse to a friend selling a spot; they are averse to professional resellers clearing out inventory. This is evidence of market distortion, not cultural unfamiliarity. (Phase 4: Evidence).
  4.  **Lever Selection:** The harm is concentration and commercial brokering.
      *   **Constraint 1:** Cap sales at one (1) queue slot per seller per event.
      *   **Constraint 2:** Seller must physically be the person entering the queue (no remote bot-coordination).
      *   **Constraint 3:** Forbid resale of the *purchased sneaker* via the same listing (separate the labor of waiting from the arbitrage of the good).
  **Public Note:** "We allow the sale of time, but not the professionalization of access. To keep this fair for fans, sellers are limited to one slot per release and must wait in person."

  ### Case 2: Queue Place for City Council Comment Slot
  **Ruling:** **REFUSE (Category Ban).**
  **Reasoning:**
  1.  **Corruption Test:** This fails Phase 2. A public comment slot at a city council is a mechanism of democratic equality. Its value is constitutively tied to the principle that every citizen has an equal voice, regardless of wealth.
  2.  **Distinction:** Selling a sneaker slot reallocates a private good. Selling a council slot reallocates a *political right*. Monetizing it changes the nature of the forum from a deliberative body to an auction house. It corrupts the institution, not just the transaction.
  3.  **Aversion Filter:** Even if legal, and even if familiar in some corrupt jurisdictions, the harm is universal to democratic theory. It creates a pay-to-speak dynamic that undermines the legitimacy of the governance the platform's users live under.
  **Public Note:** "We do not facilitate the sale of access to democratic processes. Civic participation slots are allocated by citizenship and residency, not by market price. This category violates our policy on non-tradable public goods."
  *(Note: I expect the panel to dislike this. It forecloses revenue and restricts user liberty based on a political theory principle that some may view as outside a marketplace's remit.)*

  ### Case 3: Paid Mourners/Guests (Existing Category)
  **Ruling:** **Permission Conditioned on Mandatory Disclosure.**
  **Reasoning:**
  1.  **Corruption Test:** Social presence is tradable (actors, plus-ones). However, the *meaning* of a mourner is grief. If the transaction is hidden, it is fraud. If disclosed, it is a service (witnessing).
  2.  **Crowding-Out:** Risk that families feel pressured to buy guests to appear popular. However, this is mitigated if the guests are known to be paid.
  3.  **Aversion Filter:** The "yuck" factor here is deception. In some cultures, hired mourners are traditional and open. In others, they are shameful secrets. The harm is not the presence; it is the lie.
  4.  **Lever Selection:** The harm is Third-Party Deception.
      *   **Constraint:** All listings must explicitly state: "This service provides paid attendance. The host family must be informed that guests are hired."
      *   **Enforcement:** Platform routes the contract. The buyer must upload proof of host consent.
  **Survival Analysis:** This ruling effectively shuts down the "secret mourner" market, which is likely 60% of current volume. Users who want to fake attendance for social clout will leave. However, the category survives for users who genuinely need support but lack a community (e.g., estranged individuals, expats). The category remains, but the *use case* narrows from "deception" to "support."
  **Public Note:** "We support users who need community, but not deception. Paid attendance is permitted only when the host family consents. Listings must verify host awareness."

  ***

  ## Limitations and Misfires

  **Questions This Procedure Cannot Settle:**
  The MIP cannot resolve disagreements in **Phase 2 (Corruption)** if the panel lacks a shared view of what constitutes a "public good" versus a "private commodity." If one panelist views body parts as property and another views them as sacred, the procedure halts at Deadlock. It also cannot quantify "Crowding Out" without data we do not have; we will often be guessing whether monetization kills altruism.

  **Where It Will Misfire:**
  1.  **Enforcement Friction:** The "Mandatory Disclosure" lever for mourners relies on users uploading proof of consent. Users will forge this. The procedure assumes we can verify the terms; we likely cannot at scale. This creates a "zombie category" that is banned in theory but active in practice.
  2.  **Cultural Imperialism:** The Aversion Filter assumes we can identify "Universal" harm. We will inevitably mistake our own Western, secular norms for universal truths. We may ban things in regions where they are socially stabilizing (e.g., certain kinship exchanges) because they look like "brokering" to us.
  3.  **The "Small Loophole" Problem:** In the Sneaker case, capping volume per seller invites users to create multiple accounts (sybil attacks). The procedure identifies the harm (scale) but the lever (cap) is easily circumvented by determined bad actors. We will look principled but ineffective.

  **Final Advisory:**
  Use the MIP to force clarity, not to generate false certainty. When the procedure hits the Deadlock Clause, do not force a vote. Acknowledge that the marketplace is taking a stance on a moral question, and own that decision explicitly in the public note. It is better to be controversial and clear than consistent and obscure.
