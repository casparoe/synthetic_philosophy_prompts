  ### Limits

  The protocol cannot distinguish metaphor from error without external validation it assumes unavailable. It systematically flattens ambivalence into binary tags, distorting speech acts that are inherently dual-purpose. It fails on spiritual causality, forcing empirical tags onto ontological claims. The judgment flags are the weakest link; if ignored, the form becomes a machine for producing false objectivity. It stops being a procedure when the runner's intuition overrides the flag to meet deadlines. It guarantees errors on humor, irony, and sacred falsehoods, treating them as data defects rather than features.
