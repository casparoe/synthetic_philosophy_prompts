answer: |-
  In Strawson's "Freedom and Resentment," the distinction between excuses and exemptions serves to regulate the boundaries of the **participant stance** without collapsing into metaphysical determinism. The work this distinction performs is to protect the intelligibility of our interpersonal relationships. 

  **Excuses** acknowledge that the agent is a suitable subject for reactive attitudes (a moral participant) but argue that, in this specific instance, the action did not express the ill will or indifference that normally warrants resentment. The demand for goodwill remains in force, but the specific claim is cancelled. **Exemptions**, by contrast, suggest that the agent is not currently a suitable subject for the participant stance at all. They indicate a lack of the basic capacities required for ordinary adult relationships—capacities for understanding, empathy, or control. Here, the demand for goodwill is withdrawn, and the **objective attitude** is adopted. The agent is viewed as an object of social policy, treatment, or management rather than a partner in dialogue. This distinction allows Strawson to maintain that determinism (causal history) does not universally undermine responsibility, while still acknowledging that certain causal conditions (psychosis, childhood) do locally suspend it.

  In the case of the man with the frontal-lobe condition, the structural tension arises because the **form** of his agency (lucid, voluntary, uncoerced) invites the participant stance, while the **substance** of his agency (neurologically altered emotional responsiveness) invites the objective stance. He offers no excuse (he meant to do it), yet his condition resembles the exemptions (psychopathy, warped character). To apply Strawson's framework here, we must look not at whether he "could have done otherwise" in a metaphysical sense, but at whether the economy of mutual recognition can function with him.

  **(a) Causal History vs. Present Incapacity**
  For Strawson, the objective attitude is keyed primarily to the **present incapacity to take part in the economy of demands, expectations, and goodwill**, rather than the causal history itself. The causal history is relevant only insofar as it produces a current state that makes ordinary interpersonal relationships impossible or unintelligible. Strawson is not interested in the etiology of the condition per se, but in whether the agent can be a recipient of demands and a recognizer of goodwill.

  If we apply this to the case, the crucial structural feature is the man's indifference to the distress of others and his inability to be moved by the reactive attitudes of his friends. Although he is cognitively lucid, the frontal-lobe damage has severed the link between the *recognition* of a demand and the *emotional susceptibility* to that demand. If the objective attitude is keyed to present incapacity, it follows that the man is exempt. He cannot participate in the "interpersonal commerce" of goodwill because the neurological condition has removed the mechanism by which goodwill is valued or ill will is registered as a claim. The friends' knowledge of the diagnosis signals that the *capacity* for mutual recognition is impaired, regardless of the voluntary nature of the act. Consequently, strictly speaking, the objective attitude is the appropriate stance, even if the friends find it emotionally difficult to maintain.

  **(b) Reactive Attitudes "In Place" vs. "Occurring"**
  Strawson describes reactive attitudes as natural facts of human life, but they function normatively within a practice of mutual accountability. For a reactive attitude to be **in place** (normatively valid), it must be capable of performing its relational work: it must serve as a demand for recognition that the agent is, in principle, capable of acknowledging. 

  In this case, the resentment **occurs** in the friends—it is a psychological reality—but it cannot be fully **in place** as a moral demand. Strawson's account relies on the possibility that the agent can understand the resentment as a claim of goodwill and modify their behavior accordingly. Since the agent is predictably unmoved by the distress he causes and explicitly rejects the demand (refusing treatment), the resentment loses its communicative function. It becomes a mere causal reaction, akin to the frustration one feels toward a natural obstacle, rather than a moral protest. Within Strawson's framework, if the agent is exempt, the reactive attitude is suspended *as a demand*, even if it persists *as a feeling*. The friends are caught in a conflict between their natural psychological tendencies (to resent betrayal) and the normative requirements of the practice (which require the agent be capable of participation).

  **(c) Local Eligibility vs. Consequentialism**
  Inside Strawson's framework, the decision regarding local eligibility (whether to exempt this specific agent) is decided by the **intelligibility of the participant relationship**, not by the utility of blame. The question is: "Can we meaningfully engage with this being as a moral agent?" 

  A consequentialist about blame would ask: "Will expressing resentment deter this behavior, rehabilitate the agent, or protect society?" If blaming the man prevents further betrayals, the consequentialist justifies it. Strawson, however, asks whether the man is a proper subject for the kind of relationship in which blame makes sense. In this case, the structural feature doing the work is the **breakdown of emotional reciprocity**. Even if blaming him had good consequences (e.g., he feigns remorse to avoid social ostracization), Strawson would suggest that if he lacks the capacity for genuine goodwill, treating him as a participant is a form of manipulation, not a relationship. The local decision rests on the nature of the agent's capacities for recognition, whereas the consequentialist decision rests on the outcomes of the practice. Strawson's argument about the cost of abandoning reactive attitudes applies to the *general* practice (we cannot live without them), but the *local* application depends on whether the specific interaction allows for the mutuality that justifies the practice.

  **(d) Personal vs. Vicarious Reactive Attitudes**
  Strawson treats personal reactive attitudes (resentment) and vicarious or moralistic ones (indignation) as part of a single fabric; generally, if one is suspended, the other should be too. However, the **pressure** to maintain the participant stance differs structurally between the betrayed friend and the third party.

  For the **betrayed friend**, the resentment is tied to a specific expectation of goodwill within a personal relationship. The neurological condition has directly damaged *that* relationship. The friend finds it hardest to adopt the objective stance because the injury is personal and the emotional response is immediate. For the **third party**, the attitude is indignation on behalf of the moral community. The third party, knowing the diagnosis, is structurally better positioned to adopt the objective attitude because they are not the direct target of the ill will. They can view the man as a patient to be managed without the same personal wound. 

  However, Strawson would likely argue that consistency demands that if the man is exempt for the friend, he is exempt for the third party. If he lacks the capacity for goodwill, he cannot be a subject of moral condemnation for anyone. The difference lies not in the *validity* of the attitude (both should ideally be suspended), but in the **psychological difficulty** of suspending it. The friend is struggling against the natural human reaction to personal injury, while the third party can more easily view the case clinically. If the third party continues to feel indignation, they are failing to recognize the exemption condition that renders the participant stance inappropriate for all.
