      *   *Check:* Did I answer the specific prompt about the *work* the distinction does? *Correction:* Make sure to emphasize that the distinction protects the practice from collapsing into either universal exoneration (determinism) or universal condemnation (ignoring incapacity).
      *   *Check:* Is the tone appropriate? *Correction:* Philosophical, analytical, faithful to Strawson's text.
