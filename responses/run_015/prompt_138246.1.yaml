answer: |-
  Here is the adjudication of the exchange, evaluated move by move, followed by an overall assessment and an analysis of the Administrator Case.

  ### Evaluation of Moves

  **Move 1 (Rowan): Guilt = Act (repairable); Shame = Self (unrepairable).**
  *Strength: Moderately Right.*
  Rowan establishes a clean, functional distinction that serves his policy goal. He is right that guilt is typically act-specific and motivates repair. However, he constructs a "straw man" version of shame as necessarily global and toxic. By defining shame as an attack on the *whole* self that permits only hiding or aggression, he precludes the possibility of constructive shame from the outset. This is a definitional stipulation rather than an argument.

  **Move 2 (Adela): Guilt = Dischargeable; Shame = Character-tracking.**
  *Strength: Right.*
  Adela successfully targets Rowan's blind spot. She correctly identifies that guilt's "tidy instruction" allows for moral licensing (paying the price to clear the ledger). Her distinction between global shame and "local shame" (ashamed of a specific trait or action-pattern without condemning the whole self) is philosophically sound and directly counters Rowan's Move 1. She does not change the subject; she corrects the definition Rowan relied upon.

  **Move 3 (Rowan): Shame requires an Audience; Solitary wrongdoer feels no shame.**
  *Strength: Right.*
  Rowan retreats from the definition of shame to its *mechanism*. He correctly identifies that shame is structurally dependent on exposure (real or imagined). This is a strong structural argument: if shame requires a witness, it cannot regulate secret behavior. He also introduces empirical claims about defensiveness which, while general, align with the structural point that exposure triggers defense.

  **Move 4 (Adela): Guilt requires an Internal Audience; Trigger vs. Object distinction.**
  *Strength: Right.*
  Adela turns Rowan's "solitary agent" argument against him. If shame fails without an external witness, guilt fails without an internal witness (conscience), which may be corrupt. Her distinction between *trigger* (exposure) and *object* (character) is crucial; it preserves the definition of shame while acknowledging Rowan's mechanism point. She successfully argues that Rowan is measuring the pain of exposure (humiliation), not the moral emotion itself.

  **Move 5 (Rowan): Emotions are Infrastructure, not Policy.**
  *Strength: Right.*
  Rowan shifts the ground from psychology to sociology. This is his strongest move. He argues that emotional repertoires are determined by social structure (anonymous markets vs. honor communities). If true, this makes the committee's goal ("cultivate an emotion") category-error. You cannot vote to feel differently; you can only change the structure that produces the feeling. This concedes nothing; it reframes the debate.

  **Move 6 (Adela): Indirect Choice via Practice.**
  *Strength: Right.*
  Adela accepts the structural constraint but denies the determinism. She argues that while you cannot choose emotions *directly*, you can choose practices that *indirectly* generate them. This is a valid refinement of "choice." She also reasserts the functional value of shame: it is the only emotion that registers the "external view" of character, which is necessary to check the "corrupt conscience" problem Rowan raised in Move 3.

  **Move 7 (Rowan): You conceded; Practices lead to spectacle.**
  *Strength: Moderately Right.*
  Rowan correctly identifies that Adela has conceded the point about *direct* choice, renaming it "indirect." However, his claim that these practices *necessarily* generate spectacle is an overreach. He assumes the "failure mode" is the only mode. He is right that Adela's position is weaker than she presented, but he is wrong to assume her examples *must* fail.

  **Move 8 (Adela): Design distinguishes Pillory from Conference.**
  *Strength: Right.*
  Adela refines her position to meet Rowan's objection. She distinguishes between *unritualized exposure* (which causes hiding) and *ritualized shame* (which allows reintegration). This is a strong design argument: the emotion is not the variable; the *container* for the emotion is. If the ritual has a terminus, the pathology Rowan fears is avoided.

  **Move 9 (Rowan): Ritual requires Community; Hospital = Strangers.**
  *Strength: Clearly Right.*
  This is the decisive move. Rowan accepts Adela's distinction (ritualized shame works) but denies its *applicability*. A hospital is not a small, stable, morally shared community; it is a bureaucracy of strangers and shifts. Therefore, the infrastructure required for "good shame" does not exist here. He concludes that guilt is the emotion for strangers, shame for neighbors. This grounds the theoretical debate in the specific reality of the committee's context.

  **Move 10 (Chair): The Administrator Case.**
  *Strength: Decisive.*
  This case bypasses the theoretical stalemate by presenting a scenario where the structural preconditions for *both* emotions are absent. It functions as a stress test for both accounts.

  ### Overall Adjudication

  **Who is more right?**
  **Rowan** is more right about the **context**; **Adela** is more right about the **psychology**.
  Rowan correctly identifies that a modern hospital lacks the social infrastructure (stable community, shared moral vocabulary) required to sustain constructive shame. In a bureaucracy of strangers, shame is likely to default to the toxic, hiding-inducing variety he described in Move 1. Therefore, for *policy purposes*, his recommendation to rely on guilt (act-focused repair) is safer.
  However, Adela is more right about the **moral landscape**. She correctly identifies that guilt alone is insufficient for character formation and that a culture without shame loses the ability to judge character from the outside. Her error is not in her moral psychology, but in her institutional optimism; she assumes a hospital can engineer the community conditions she needs.

  **Is the dispute partly verbal?**
  **Yes.** The disagreement rests on three unargued definitions:
  1.  **"Shame":** Rowan uses "shame" to mean *toxic, global self-condemnation*. Adela uses "shame" to mean *awareness of one's character from an external perspective*. They agree on the mechanism (exposure) but disagree on the necessary outcome (hiding vs. repair).
  2.  **"Choice":** Rowan defines choice as *direct selection*. Adela defines choice as *indirect engineering via structure*. Rowan is right that direct selection is impossible; Adela is right that indirect selection is possible. They are talking past each other on agency.
  3.  **"Better":** Rowan defines "better" as *conducive to repair and system stability*. Adela defines "better" as *conducive to moral character and truth-telling*. Neither argues why their function is the primary one for a hospital. Rowan implicitly fixes "system stability" as the goal; Adela implicitly fixes "moral integrity" as the goal.

  ### The Administrator Case (Move 10)

  **Rowan's Account:**
  Guilt attaches to an act. The Administrator committed an act. However, Rowan's definition of guilt carries an "instruction to repair." Since the victims are unknown and unrecoverable, the instruction cannot be followed.
  *Implication:* The Administrator cannot feel functional guilt. They may feel pointless torment, or they may suppress the guilt because it offers no resolution. The reporting culture fails because it cannot offer a path to "undo" the act.
  *Revelation:* Guilt is dependent on the *possibility of repair*. Where repair is structurally impossible, guilt becomes dysfunctional.

  **Adela's Account:**
  Shame attaches to character as seen by an audience. The Administrator's acts were secret; there was no audience.
  *Implication:* The Administrator feels no shame. Unless the Administrator internalizes the "community" as an audience, there is no trigger. If the Administrator's internal conscience is corrupt (as Rowan warned in Move 3), there is no check on their behavior.
  *Revelation:* Shame is dependent on the *presence of a witness*. Where anonymity is structurally guaranteed, shame is inert.

  **What the Case Reveals:**
  The case reveals that both emotions are **relational technologies**. Guilt requires a Victim to repair; Shame requires a Community to witness. The Administrator operated in a zone of **Structural Isolation** where neither relation exists. Both accounts fail because they assume the moral agent is always embedded in a web of victims or witnesses. The hospital bureaucracy created a moral vacuum where neither emotion can bite.

  ### What Both Are Missing

  Your guess is that they assume one emotion must do all the work. That is part of it, but the deeper structural error is this:

  **Both assume that Moral Force requires Painful Affect.**

  Rowan and Adela both argue over which *painful feeling* (guilt or shame) should be cultivated to regulate behavior. They both assume that for the Administrator to be morally regulated, they must suffer an internal emotional penalty.

  What is missing is **Obligation independent of Affect**.

  The Administrator's wrongness does not depend on their capacity to feel guilt or shame. It depends on a **Fiduciary Duty** or **Professional Standard** that binds them regardless of their emotional state or the visibility of their victims. By focusing entirely on *cultivating emotions*, both parties ignore the possibility of **Answerability** as a structural requirement rather than an emotional state.

  A reporting culture should not aim to make the Administrator *feel* bad (which requires victims or audiences); it should aim to make the Administrator *answerable* (which requires audit, oversight, and consequence). Rowan and Adela are debating the *engine* of compliance (emotion), while the Administrator case shows that the *brakes* (systemic constraints and non-affective duty) are what actually matter. They are missing the distinction between **Moral Motivation** (internal feeling) and **Moral Accountability** (external requirement). In a bureaucracy, the latter works where the former fails.
