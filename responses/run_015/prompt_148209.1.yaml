answer: |-
  The book you are remembering is *Gödel, Escher, Bach* by Douglas Hofstadter. The tank is the "careenium," the markers are "simmballs," and the puzzle is indeed whether the patterns (meanings) can cause the simmballs to move, or if only the physics of the simmballs matters. Hofstadter's answer is essentially that the patterns *are* real, but they are real in the way a "wave" is real: you can explain the wave entirely by the motion of water molecules, but if you want to predict where the wave goes, talking about water molecules is useless. You have to talk about the wave.

  You have stumbled onto the central tension in the philosophy of mind and computation, but your three puzzles add a specific engineering texture that pure philosophy often misses. You are asking about the status of **abstractions that fight back**.

  There is no single canonical term that captures all three of your shapes perfectly, because they pull from three different philosophical problems. However, they cluster around a view called **Non-Reductive Physicalism**. Within that cluster, the specific mechanism you are describing in your second puzzle has a name in linguistics and pragmatics: **Semantic Accommodation**. The broader status of the coarse level is called **Explanatory Autonomy**.

  If I were to coin a term for the specific phenomenon you are tracking—the way the high-level description survives by renegotiating its connection to the low-level bits—I would call it **Interpretive Plasticity**.

  Here is the breakdown of why your puzzles fit where they do, what is settled, what is disputed, and where the edges of this concept lie.

  ### 1. The Three Puzzles Mapped

  **Puzzle One: The Causal Efficacy of Meaning**
  *   *Your observation:* Renaming a field changes electron flow, yet the electron account is complete without "meaning."
  *   *The Concept:* This is the **Causal Exclusion Problem**.
  *   *The Resolution:* The standard physicalist view is that meaning does not *add* force to the electrons. The electrons move because of the prior state of the electrons. However, the *reason* the electrons were in that prior state is that an engineer manipulated them based on a schema.
  *   *Does the coarse level add work?* No, it does not add *energy*. It adds **compression**. The "meaning" is a lossy compression of the causal history. If you try to predict the system using only electron physics, you will drown in data. If you use the schema, you can predict the outcome. The "work" it does is cognitive work for the observer, not physical work on the bits.
  *   *Settled vs. Disputed:* It is settled among physicists and most philosophers that the physical layer is "causally closed" (no magic meaning-force pushes electrons). It is disputed whether that makes the meaning "illusory." Most say no: a hurricane is real even if it's just air molecules.

  **Puzzle Two: The Re-fitted Spec (The Core Twist)**
  *   *Your observation:* A value violates the spec (6th code), but the system silently maps it to a valid code (1 of 5). The spec is violated, yet the system persists by adjusting the mapping.
  *   *The Concept:* This is **Semantic Accommodation** (from pragmatics) mixed with **Normativity**.
  *   *The Resolution:* A specification is not a description of what *is*; it is a law of what *ought to be*. When the physical layer violates the law, the system has two choices: crash (admit the law is broken) or accommodate (pretend the law holds by re-interpreting the violation). Your system chose the latter.
  *   *Why this matters:* This proves the coarse level is **Normative**, not just descriptive. The bits say "6." The schema says "6 is impossible." The reporting layer says "I will treat this 6 as a 3 so the schema remains true." The coarse level is not being refuted by the fine level because the coarse level has the authority to redefine the fine level's output for its own purposes.
  *   *The Name:* This specific move—adjusting the context to preserve the truth of a statement—is **Semantic Accommodation**. In your context, it is **Normative Resilience**.

  **Puzzle Three: Identity and Bit Rot**
  *   *Your observation:* Bit rot breaks the program; JIT compilation (which changes all the bits) does not.
  *   *The Concept:* **Multiple Realizability** and **Functional Identity**.
  *   *The Resolution:* We do not identify a program by its bits; we identify it by its **input-output behavior** and its **counterfactual stability**.
      *   *JIT Compilation:* The bits change, but if you poke the program with any input, it gives the expected output. The "shape" of the behavior is preserved.
      *   *Bit Rot:* The bits change, and now *some* input will produce nonsense. The "shape" is broken.
  *   *The Rule:* The coarse description survives as long as it retains **predictive utility**. When the low-level deviation breaks the high-level prediction, we say the program is "broken." When the low-level deviation preserves the prediction, we say it's the "same" program.

  ### 2. The Unified Concept: Interpretive Plasticity

  You called it "Map Drift." That is descriptive, but it implies the map moves passively. Your second puzzle shows the map *actively resisting* being proven wrong.

  I propose **Interpretive Plasticity**.

  **Definition:** Interpretive Plasticity is the capacity of a high-level semantic system to maintain its identity and truth conditions by dynamically adjusting the mapping rules to the low-level substrate when that substrate deviates from expectation, provided the deviation does not destroy the system's predictive utility.

  **Why this fits:**
  1.  **It acknowledges the physical:** The bits are what they are (the 6th code exists).
  2.  **It acknowledges the autonomy:** The high level refuses to accept the 6th code as a 6th code. It absorbs the shock.
  3.  **It defines the limit:** It stops when predictive utility fails (bit rot).

  ### 3. Does the Coarse Level "Add" Something?

  You asked if the coarse level adds something that inspecting the fine level could never confirm. **Yes.** It adds two things:

  1.  **Counterfactuals:** The bits tell you what *did* happen. The schema tells you what *would have* happened if the input were different. You cannot derive "If I had sent a 5, it would have printed 'OK'" solely from a static dump of the electrons that processed a 4. You need the rule. The rule is a claim about possibilities, not just actualities.
  2.  **Norms:** The bits tell you what *is*. The schema tells you what *is allowed*. A bit dump of the "6th code" scenario shows a 6. It does not show that a 6 is *wrong*. Only the coarse level contains the concept of "wrong."

  This is why the coarse level cannot be refuted by the fine level. The fine level deals in *facts*; the coarse level deals in *rules*. You cannot disprove a rule with a fact; you can only show the rule is no longer useful.

  ### 4. Boundary Cases: Where It Shades Into Something Else

  To understand the edges of **Interpretive Plasticity**, look at where it breaks down.

  **Edge 1: The Threshold of Utility (The Bit Rot Boundary)**
  *   *Case:* A single bit flips.
  *   *Plastic:* If the bit is in a slack area (e.g., padding, or a cached value that gets refreshed), the system absorbs it. The coarse description holds.
  *   *Rigid:* If the bit is in a jump instruction, the program crashes.
  *   *The Boundary:* The edge is not in the physics; it is in the **topology of dependencies**. If the deviation propagates to the output, plasticity ends. This is why JIT compilation works (it preserves the output topology) and bit rot fails (it randomizes it).

  **Edge 2: Intentional vs. Unintentional Accommodation (The Fraud Boundary)**
  *   *Case:* Your system maps the 6th code to the 3rd.
  *   *Plastic:* This is built-in error tolerance. The system is designed to be plastic.
  *   *Rigid:* If a hacker modifies the reporting layer to hide theft, they are also "renegotiating the mapping."
  *   *The Boundary:* **Authority.** Interpretive Plasticity is legitimate when the renegotiation serves the *design intent* of the system (keeping it running). It becomes "corruption" when the renegotiation serves an external agent against the design intent. The physics is identical; the ontology changes based on *who* is doing the renegotiating.

  **Edge 3: Drift vs. Shift (The Evolution Boundary)**
  *   *Case:* Over ten years, the definition of "Customer" changes subtly.
  *   *Plastic:* The system adapts, and we say it's the "same" system.
  *   *Rigid:* Eventually, the definition changes so much that we say it's a "new" system (v2.0).
  *   *The Boundary:* **Continuity of Explanation.** As long as you can tell a single story about why the system behaves as it does, it is the same system. When you need a new story (a new schema) to explain the behavior, the identity has snapped.

  ### 5. Settled vs. Disputed

  **Settled:**
  *   The physical layer is causally closed. No "meaning force" pushes electrons.
  *   High-level descriptions are **multiply realizable** (the same program can run on different chips).
  *   High-level descriptions are **indispensable for prediction**. You cannot manage millions of bytes without schemas.

  **Disputed:**
  *   **Realism vs. Instrumentalism:** Is the "Customer" entity *real*, or is it just a useful tool for humans?
      *   *Realists* say: If it behaves like a Customer and has rules like a Customer, it is a Customer, regardless of the bits.
      *   *Instrumentalists* say: It is just a convenient fiction. Only the bits are real.
      *   *My Position:* This is a false dichotomy. A "Customer" is a **pattern**. Patterns are real features of the universe, like whirlpools. A whirlpool is nothing but water molecules, but you can't understand a whirlpool by tracking molecules. You must track the whirlpool.
  *   **The Hard Limit of Plasticity:** How much can the mapping stretch before we admit the high-level description is false?
      *   Some argue that if the system survives, the description was *right* (because the goal was survival).
      *   Others argue the description was *wrong*, but the system was *robust*.
      *   *My Position:* It depends on the **teleology** (the goal). If the goal is "accurate accounting," Puzzle 2 is a failure (the report is a lie). If the goal is "continuous operation," Puzzle 2 is a success (the system survived). The "truth" of the coarse level depends on what you ask the system to *do*.

  ### Summary

  You are describing **Interpretive Plasticity** within a framework of **Explanatory Autonomy**.

  *   **The Name:** Interpretive Plasticity.
  *   **The Mechanism:** Semantic Accommodation (renegotiating the mapping to preserve the rule).
  *   **The Value Add:** Counterfactuals (what would happen) and Norms (what should happen).
  *   **The Boundary:** Predictive Utility. When the coarse level no longer helps you predict the output better than inspecting the bits, the plasticity snaps, and the description dies.

  Your intuition that the coarse level "adds something" is correct. It adds the **rules of the game**. The bits are the pieces; the schema is the rulebook. You can knock the pieces around (bits moving), but only the rulebook tells you if a move is legal (Puzzle 2) or if the game is still chess (Puzzle 3). The rulebook is not made of cardboard and ink (bits); it is made of agreements. And agreements can be renegotiated without breaking the game, as long as the players agree to keep playing.
