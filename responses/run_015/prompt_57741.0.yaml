answer: |-
  Good evening. I know what the programme says. It says I am an expert. The truth is I make my living reading dead Irish bishops, while most of you make your living fixing leaks, baking bread, and keeping this town from fading away. I suppose the Chair thought that because I spend my days thinking about money that doesn't exist, I might be useful tonight launching money that doesn't exist. She also told me that if I turn this into a lecture, she will come up here and remove me. So I will be brief, and I will be plain.

  We are here to issue credits. I know the question sitting on the tip of everyone's tongue, including the gentleman from the county paper taking notes in the front. The question is: what backs this? What is in the vault? The answer is nothing. There is no vault. There is no reserve. And if you are waiting for one, you are waiting for a ghost.

  I study the work of George Berkeley. He was an eighteenth-century bishop who understood something we have forgotten. He understood that money is not wealth. Money is a ticket. It is a counter used to measure who has done work and who is owed work. The real wealth is not the ticket. The real wealth is the fertile land outside this hall, the skills in this room, and the industry of the people who live here. Those things are inexhaustible. The tickets are just how we agree to move them around. To ask what backs the credit is like asking what backs a ticket to the cinema. The value is not in the paper; the value is in the film that starts when you hand it over.

  The reporter here has already written that these are play tokens. He is not wrong. They are tokens. But consider how we speak to one another. When I say "please pass the salt," you do not need to see the salt in my mind to understand the request. The words are signs. They work not because they resemble the thing they stand for, but because we agree to act on them. Berkeley argued this point fiercely: we can reason with tokens and bind ourselves to one another without having any clear image of what lies behind them. These credits are exactly that. They do not need to look like gold, or feel like power, to function. They only need to be accepted. When the plumber fixes the baker's sink and takes a credit, and the baker gives bread to the childminder for that same credit, the token has done its work. It has bound you together. The sceptic calls this play. I call it the only serious thing we have left.

  Now, Berkeley tried to put this into practice. He lobbied the Irish parliament to create a national bank on these exact principles. He wanted public tokens to stir the industry of the poor. He got nowhere. He failed. But we should not mourn that failure; we should learn from it. He failed because he asked for permission. He waited for a distant legislature to grant authority. We are not waiting.

  This brings us to the hard part. In Berkeley's scheme, the state controlled the flow. They decided how many tickets to issue. We have no state here. We have no distant legislature. The authority sits in this room. It sits with the one hundred and fifty of you. If you issue too many credits against work that isn't done, the tickets lose their meaning. If you issue too few, the work stops. Keeping the volume of credits proportioned to the trade you actually carry is not a job for an algorithm or a bank manager. It is your job. It is a collective discipline. You are the bank. That is a heavier burden than depositing a paycheck, but it is the only way this holds.

  To ensure those credits move, we have adopted a rule that some will find difficult. A balance held idle for a year will lose a small percentage of its value. This is not a penalty; it is a principle. Money that never moves is a signal that never arrives. It is a ticket to a show that never starts. If you hoard the credits, you block the industry of your neighbour. The system requires circulation to function.

  I need to speak directly to the retired mill workers in the back. I know what this rule means for you. Under the old system, you saved money to keep yourself safe. You stored value for a rainy day. This system makes that difficult. A token that slowly decays cannot function as a store of value. It asks you to keep moving, to keep exchanging, rather than to hold. I will not soften this. It is a real cost. You built this town on the idea that saving was virtue. Here, spending is the virtue. I acknowledge that this asks something of you that the old economy did not. It asks you to trust the flow rather than the stash. I cannot resolve that tension for you. I can only say that without this rule, the water stagnates, and nothing grows.

  So, where does that leave us? We have no vault. We have no state. We have tokens that decay. It sounds precarious. But look around you. The wealth is here. The baker is here. The haulier is here. The skills are here. The only thing missing was the agreement to trust the signs we use to trade them.

  Berkeley failed because he tried to do this from the top down. We are doing it from the ground up. The sceptic in the press row can keep his notes. He can call it play. But when the heating breaks in the community kitchen next week, it won't be play that fixes it. It will be the plumber, and it will be this credit.

  We are not waiting for permission. We are not waiting for backing. We are the backing.

  On Monday morning, do not wait for the system to prove itself. Go to the bakery. Buy a loaf with these credits. Ask the baker to spend them at the hardware store. Make the ticket move.

  Thank you.
