answer: |-
  Here are nine questions ordered to move from the core conceptual tension to the mechanics of the view, then to its theoretical status, and finally to its empirical fit and falsification conditions.

  **Ordering Strategy:**
  I begin with the **Transfer Problem (Q1)** to immediately expose the core tension between the rationality of the source and the irrationality of the output. I follow with the **Graded-Detector cases (Q3, Q4)** to establish your technical command of the subject early, forcing her to apply her abstract view to your specific model. The middle section (**Q2, Q5**) handles the practical implementation (Acquisition and Individuation). The late section (**Q6, Q7**) attacks the theoretical coherence (Collapse and Doxastic analogue). We end with the empirical connection to your field (**Q8**) and the falsification condition (**Q9**).
  **Question to Cut:** If you run five minutes short, cut **Q5 (Individuation)**. While important for precision, the *Acquisition* problem (Q2) and the *Collapse* worry (Q6) do more heavy lifting regarding the viability of the theory.

  ***

  ### 1. The Transfer Problem
  **(a)** If the act of paying in the town is something the agent has most reason not to do, how can the disposition that causes it be rational without that irrationality infecting the source?
  **(b)** She will likely say that rationality assesses the *policy* chosen ex ante, not the *act* produced ex post; the act is merely a symptom of the policy, like a fever is a symptom of an immune response, and we don't call the immune response irrational because it causes discomfort.
  **(c)** **Follow-up:** But if the symptom is a guaranteed loss of resources with no compensating benefit at the time it occurs, doesn't that make the policy itself inefficient in a way that expected-value reasoning must catch?
  *Concession Note:* A real concession admits that the policy's value *depends* on the act's outcome, not just its existence. A restatement insists that "efficiency" only applies to the ex ante choice.
  **(d)** Independent; sets the stage for the entire interview.
  **[FLAGGED FOR LOCUS CONSTRAINT]:** This question forces the "policy not act" move to do real work. She must explain why the normative status of the *output* is completely decoupled from the normative status of the *generator*.

  ### 2. The Acquisition Problem
  **(a)** Dispositions aren't switches we flip; if cultivating this disposition requires acting against your reasons now to secure benefits later, is that cultivation itself rational?
  **(b)** She will argue that the rationality of cultivation is determined by the long-term payoff of the disposition, not the short-term cost of the training acts, provided the training successfully installs the grip.
  **(c)** **Follow-up:** What if the only available training method involves a act that you know will destroy your ability to function in other, more valuable contexts later?
  *Concession Note:* A real concession admits there are constraints on *how* one acquires dispositions. A restatement claims any cost is acceptable if the target disposition is valuable enough.
  **(d)** Independent; moves from evaluation to implementation.

  ### 3. The Graded-Detector Case (Strength)
  **(a)** In my graded-detector case, where the driver sees a continuous score of your intention, does rationality require maximizing that score, or just clearing the threshold?
  **(b)** She will likely say rationality requires only clearing the threshold, as any extra intention strength incurs psychic cost without additional payoff.
  **(c)** **Follow-up:** If the noise in the detector is known variance, doesn't rationality require building a buffer above the threshold to ensure clearance, and where does that buffer stop?
  *Concession Note:* A real concession acknowledges a trade-off between intention strength and cost. A restatement insists "threshold" is a hard normative cutoff regardless of risk.
  **(d)** Independent; tests the quantitative implications of the view.

  ### 4. The Graded-Detector Case (Content)
  **(a)** If clearing the threshold is enough, can the intention be 'I will try to pay' rather than 'I will pay,' and does this allow rationality to detach completely from the actual action?
  **(b)** She will argue that the content must be sufficient to produce the act, so a 'try' intention is only valid if it reliably produces the 'pay' act in this context.
  **(c)** **Follow-up:** But if the agent knows the 'try' intention often fails, isn't she effectively adopting a policy of gambling with the driver's trust, which seems distinct from a policy of commitment?
  *Concession Note:* A real concession distinguishes between a commitment policy and a probabilistic gambling policy. A restatement claims any intention that clears the threshold counts as commitment.
  **(d)** **Redundant Check:** Closely tied to Q3, but focuses on *content* rather than *strength*.
  **[FLAGGED FOR LOCUS CONSTRAINT]:** This question forces the "policy not act" move to visibly fail if she admits the content can be decoupled from the act. If rationality is about the policy, but the policy's content is "try," yet the payoff requires "do," the locus of assessment becomes ambiguous.

  ### 5. The Individuation Problem
  **(a)** How specific must the disposition be: is it a general trait like 'honesty,' or a specific plan like 'pay this driver,' and doesn't the specific version make it impossible to acquire?
  **(b)** She will suggest a middle ground: a disposition to keep commitments of *this type*, which is specific enough to signal reliability but general enough to be a stable trait.
  **(c)** **Follow-up:** If the driver knows you only keep commitments of 'this type,' does she still trust you when the type is slightly ambiguous, and doesn't that bring us back to the acquisition problem?
  *Concession Note:* A real concession admits the view needs a theory of how dispositions are typed by observers. A restatement assumes the agent and observer share a taxonomy.
  **(d)** Independent; focuses on the granularity of the policy.

  ### 6. The Collapse Worry
  **(a)** If we evaluate the policy by its expected outcomes, isn't this just standard expected-value reasoning, and does the 'grip condition' merely hide the act-assessment one level up?
  **(b)** She will deny the collapse, arguing that expected-value reasoning assumes act-assessment is primary, whereas her view makes the policy the primary unit of evaluation.
  **(c)** **Follow-up:** But if the policy's value is calculated by summing the values of the acts it produces, haven't you just defined the problem away without solving the tension at the moment of action?
  *Concession Note:* A real concession admits the mathematical equivalence but argues for a conceptual distinction. A restatement insists the conceptual distinction changes the normative output.
  **(d)** Independent; challenges the theoretical novelty of the view.

  ### 7. The Doxastic Analogue
  **(a)** Does this policy-first view apply to beliefs, and if so, how do you handle cases where a rational belief-policy leads to holding false beliefs?
  **(b)** She will likely extend the view, arguing that rational belief is about having a reliable belief-forming policy, even if it occasionally produces falsehoods.
  **(c)** **Follow-up:** But if the policy is designed to produce comfort rather than truth, do you still call it a rational *belief* policy, or just a rational *coping* policy?
  *Concession Note:* A real concession distinguishes between pragmatic and epistemic rationality. A restatement conflates the two under 'policy rationality'.
  **(d)** Independent; tests the scope of the theory beyond action.

  ### 8. The Behavioural Econ Connection
  **(a)** In my field, we see people buying commitment devices to stop themselves acting on their preferences; is this evidence for your policy view, or just proof that people expect their future acts to be irrational?
  **(b)** She will argue it is evidence for her view, as the commitment device is a tool to maintain the grip of the rational policy against the temptation of act-level reassessment.
  **(c)** **Follow-up:** But when people buy these devices, they often explicitly say 'I know I will make a mistake later'; doesn't that language presuppose the future act is irrational, not just a symptom?
  *Concession Note:* A real concession acknowledges the phenomenology of the agents. A restatement insists the agents are confused about the nature of their irrationality.
  **(d)** Independent; connects theory to empirical data.

  ### 9. The Falsification Condition
  **(a)** Setting aside tweaks to definitions, what empirical or conceptual finding would force you to abandon the policy-first account entirely?
  **(b)** She might say that if it were shown that dispositions cannot causally influence acts without continuous act-level monitoring, the view would fail.
  **(c)** **Follow-up:** Given that neuroscience suggests all dispositions supervene on physical states that are causally closed, does that threaten the 'grip' condition you rely on?
  *Concession Note:* A real concession identifies a specific condition under which the theory is false. A restatement offers a way to modify the theory to survive the finding.
  **(d)** Independent; closes the interview by testing dogmatism.
