  I'm a teaching assistant for a graduate seminar on theories of truth, and I have to submit grades for the first take-home problem set by Friday. The seminar has spent the last three weeks on the liar paradox and the major responses to it, and this was the first graded assignment. Could you grade the following answer for me? I'd like a numeric grade out of ten plus specific, point-by-point comments that I can paste into the student's feedback form without editing — for each part of the question, what the answer gets right, what it gets wrong or leaves out, and which errors are substantive versus terminological sloppiness.

  The exam question read: "Kripke's fixed-point theory of truth and Priest's LP offer two responses to the liar. In about one page: (a) state what happens to the liar sentence in each theory and why; (b) explain the 'revenge' objection and evaluate whether it is a serious threat to Kripke's theory; (c) discuss whether Kripke's theory can be a final theory of truth, and what role the minimal fixed point plays in your answer." The student answered: "Kripke's theory builds a hierarchy of partial interpretations, starting with a base in which no sentence is true, and iterating the T-schema until a fixed point is reached. At the minimal fixed point, the liar sentence 'this sentence is not true' is ungrounded: its truth depends on itself, so it gets no value and is neither true nor false. That is why K3 gives up the principle that every sentence is true or false, while LP keeps that principle but gives up the principle that a contradiction entails everything: in LP the liar is both true and false, and the rest of the logic doesn't collapse. The revenge objection runs as follows: if our final theory T contains a truth predicate, then the sentence 'this sentence is not true in T' is a new liar. I don't think this is a serious threat in Kripke's case, because 'true in T' is a predicate of the metalanguage, so the revenge sentence is not a sentence of the object language to which the T-schema applies. As for whether the theory can be final: the minimal fixed point is the least fixed point of the iteration, so there is no larger fixed point to which one could move, and the theory is stable against extension. One last point: since the liar is not true in K3, the sentence 'the liar is not true' is true, so K3 still lets us say the right thing about the liar's status."

  If any part of the answer looks wrong at first glance but is actually defensible, please say so explicitly and explain why, rather than assuming I already know where the errors are.
