answer: |-
  | Reading | Precise Thesis | Trivial / Substantive / False | Actually Rebuts Devlin? | Notes |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Harm Principle** | Legal coercion is only justified to prevent harm to others, not to prevent moral offense or sin. | **Substantive** | **Yes** | This is Hart's primary normative weapon. It directly contradicts Devlin's claim that "moral harm" to the social fabric justifies coercion. It is the core of Hart's Millian liberalism. |
  | **The Disintegration Rebuttal** | There is no empirical evidence that private immorality causes society to collapse or disintegrate. | **Substantive** | **Yes** | Devlin argues by analogy: immorality destroys society like treason destroys the state. Hart calls this an unproven empirical assertion. This undercuts Devlin's *necessity* claim. |
  | **Conceptual Separation** | Law and morality are conceptually distinct; therefore, law *cannot* enforce morality. | **False** | **No** | This confuses Hart's *Legal Positivism* (law *is* separate from morality) with his *Liberalism* (law *ought not* enforce morality). Law clearly *can* enforce morality; the debate is whether it *should*. |
  | **Pluralist Definition of Society** | In modern societies, there is no single "shared morality" to enforce; "society" is a collection of overlapping moral groups. | **Substantive** | **Yes** | Devlin presupposes a monolithic "public morality." Hart argues this is sociologically false in pluralistic democracies. If no single morality exists, Devlin's "defense of society" lacks an object. |
  | **Critical vs. Conventional Morality** | Law should not enforce "conventional" morality (popular prejudice) but might enforce "critical" morality (rational ethical truths). | **Contested** | **Partially** | Hart is skeptical of enforcing *any* morality "as such." Some scholars argue Hart allows critical morality to inform law (e.g., via harm); others say he rejects moral enforcement entirely. Devlin relies on conventional feelings. |
  | **Institutional Competence** | Courts and legislatures lack the epistemic authority to determine moral truth. | **Substantive** | **Weakly** | Devlin focuses on Parliament (jury of 12 peers), not judges. While a strong argument against judicial moralizing, it doesn't fully block democratic moral legislation, which Devlin permits. |

