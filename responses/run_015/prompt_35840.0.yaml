  **LITTLE PUDDINGTON TOWN COUNCIL**
  **MINUTES OF THE ETHICS AND PLANNING COMMITTEE**
  **HELD AT THE CIVIC CENTRE, 14 OCTOBER 2023**

  **Present:** Cllr. Davies (Chair), Cllr. Smith, Cllr. Patel, Ms. J. Thorne (Town Clerk).
  **Apologies:** None.

  **1. Noise Abatement Barrier (A42 Trunk Road)**
  The Committee considered a motion to install acoustic panelling along the northern embankment. The proposal was submitted by Mrs. Gable (resident), citing severe insomnia caused by traffic noise. The Town Clerk presented data indicating the barrier would impose a travel delay of approximately two seconds per vehicle during peak hours.

  Cllr. Patel queried whether the cumulative delay to 15,000 daily commuters outweighed one resident's sleep. The Chair reminded the Committee that under the Constitution, motions are judged by whether any single individual could reasonably reject the principle. It was recorded that no single commuter possesses a reasonable ground to reject a two-second delay when contrasted with chronic sleep deprivation. The aggregation of delays was deemed irrelevant to the justification owed to each driver individually.

  **Resolved:** That the motion be carried.

  **2. Flood Defence Levy**
  The Committee reviewed the proposed embankment raising to protect the lower valley. The Clerk estimated benefits to 4,500 properties at risk of flooding. However, Mr. Henderson (resident, Hillside Drive) objected that the embankment would obstruct his river view.

  The Clerk attempted to sum the security benefits to the 4,500 properties to demonstrate net welfare. The Chair immediately ruled the Clerk out of order. The Chair stated that the principle requires comparing the strongest complaint against the principle (Mr. Henderson's loss of view) with the strongest complaint *for* the principle (any single resident's risk of flooding) on a one-to-one basis. As no single resident's risk outweighs the certainty of Mr. Henderson's loss of amenity, the principle could be reasonably rejected by him.

  **Resolved:** That the motion be defeated.

  **3. Proposal to Amend Voting Procedure**
  Cllr. Smith moved to permit arithmetical aggregation of burdens and benefits in future deliberations. Cllr. Smith argued that preventing the summing of minor burdens renders the Council unable to manage public infrastructure.

  The Chair rejected the motion, citing the foundational Principle of Reasonable Rejection. The Chair noted that complaints are weighed one complainant at a time to ensure each person is treated as a sovereign individual rather than a vessel for utility. To permit summing would violate the requirement to justify principles to each person separately.

  **Resolved:** That the motion be lost.

  **4. Application of Standing Order 12(b)**
  The Committee considered the relocation of Bus Stop 4. Residents of Elm Grove and Oak Avenue both lodged complaints of identical strength regarding increased walking distance (50 metres).

  The Chair invoked Standing Order 12(b), reading the clause quietly. The Order provides that where complaints are exactly equal in strength, the larger number prevails. The Chair noted this was the Council's sole concession to arithmetic, necessary only to resolve deadlocks where individual reasons are indistinguishable. As Elm Grove contains 40 households and Oak Avenue 30, the motion favoured Elm Grove.

  **Resolved:** That the motion be carried.

  **There being no further business, the meeting closed at 20:45.**

  ***

  **Epistemic Note on Philosophical Fidelity**

  This satire simplifies Scanlon's view in two respects. First, it assumes a strict 'individualist' reading of contractualism where aggregation is never permitted except in tie-break cases. In *What We Owe to Each Other* (and later replies), Scanlon suggests that numbers might count indirectly if generic reasons allow for 'relevant' grouping, or if the burden to each individual in the larger group crosses a threshold of significance. Second, the 'equal strength' tie-break (Standing Order 12(b)) is a common philosophical workaround (often attributed to the 'Tie-Break Argument'), but Scanlon's own position on whether numbers count in life-and-death cases has evolved. The minutes present the 'hard' interpretation favoured by critics to highlight the aggregation problem clearly, rather than Scanlon's more nuanced final position.
