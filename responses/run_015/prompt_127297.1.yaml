prompt: |-
  I'm not an academic — I came at this from a practical place. I'm filling in an advance directive (the form where you say what you want to happen later if you can't decide for yourself anymore), and its got me stuck on one thing: how much should present-me defer to future-me? A friend mentioned something in philosophy called the Reflection principle: roughly, if you somehow knew that your future self would end up 70% confident in something, you should be 70% confident now. That strikes me as either very deep or obviously wrong, and I can't tell which.

  I've got a couple months of evenings before I need to sign, and I'd rather spend them on the part that actually decides my question. So: which of the open questions around Reflection is worth my time? Ones I've run into, in my own words:

  - is it a basic rule of rationality, or does it just fall out of some other rule (in which case I should go look at that other thing)?
  - does it apply when future-me simply knows more, or also when future-me has changed — forgotten things, been talked into something, gone foggy, started caring about different stuff?
  - does violating it make you irrational, or just exploitable in the "money pump" / betting sense — and does that difference matter for what I write on the form?
  - what if the "future self" is only loosely me: me after a stroke, or the version of me that my family and doctors will be reading this form back to?
  - is this even about belief at all, or is it really about commitment and planning?

  Add whatever I've missed. Then rank them: which one or two are upstream of the others, which are cheap enough that I can settle them myself in an evening, and which are gadgets that won't change what I actually sign. Commit to an ordering and give me your reasons rather than laying out the menu — and tell me where you're guessing versus where there's a settled answer I should just take.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Profile:** Non-academic, practical mindset, filling out an advance directive (legal/medical document).
      *   **Core Problem:** How much should present-self defer to future-self's preferences/beliefs?
      *   **Specific Concept:** The "Reflection Principle" (van Fraassen), specifically regarding credence/confidence, but applied here to *preferences/values* in a medical context.
      *   **Task:** Evaluate a list of open philosophical questions about Reflection, add missing ones, rank them by importance/utility for the specific task (advance directive), identify which are upstream, which are quick settles, and which are irrelevant gadgets.
      *   **Constraint:** Commit to an ordering, give reasons, distinguish between guessing and settled answers. Do not just lay out a menu.

  2.  **Deconstruct the "Reflection Principle" in this Context:**
      *   *Standard Philosophical Definition:* $P_t(A | P_{t+k}(A) = x) = x$. (My current probability of A, given that my future probability of A will be x, should be x.)
      *   *User's Application:* The user is applying this to *values/preferences* (what medical treatment do I want?) rather than *beliefs* (is it raining?). This is a crucial category error to address immediately. Reflection is about *epistemology* (truth-tracking), Advance Directives are about *normativity* (value-tracking).
      *   *The Real Tension:* Precedent Autonomy (Past Self rules) vs. Current Interests (Future Self rules). If Future Me is demented and happy to be alive, but Past Me said "no life support if demented," who wins?

  3.  **Evaluate the User's List of Questions:**
      *   *1. Basic rule vs. derivative:* Academic meta-ethics/epistemology. Irrelevant for the form.
      *   *2. Knowledge vs. Change (forgetting, foggy, values change):* **Crucial.** This is the "Transformation" problem. If Future Me is cognitively impaired, does their "confidence" count?
      *   *3. Irrationality vs. Money Pump:* Decision theory technicality. Irrelevant for the form.
      *   *4. Loosely Me (Stroke, Family/Doctors reading):* **Crucial.** This is the "Identity" problem. Who is the "future self" legally and morally?
      *   *5. Belief vs. Commitment/Planning:* **Crucial.** This is the category error mentioned above. Advance directives are plans/commitments, not belief updates.

  4.  **Identify Missing Questions:**
      *   *The "Ulysses Contract" aspect:* Is the point of the directive to bind future me *against* their will?
      *   *The Surrogate Decision Maker:* The form isn't just about "what I want," it's about "who decides."
      *   *The Threshold of Incapacity:* When does the deference switch from Present Me to Future Me (or their proxy)?

  5.  **Ranking Strategy (Practical Utility for Advance Directive):**
      *   *Goal:* Help the user fill out the form effectively.
      *   *Top Priority:* Questions that determine *what* gets written (Values vs. Specific Instructions) and *who* decides.
      *   *Middle Priority:* Questions about the nature of self-continuity (does demented me count?).
      *   *Low Priority:* Technical epistemology (Reflection Principle mechanics, money pumps).

  6.  **Drafting the Response (Iterative Process):**

      *   *Correction/Reframing:* I need to gently point out that Reflection is about *beliefs*, but Advance Directives are about *values*. This changes the game. The "Reflection Principle" isn't the right tool; "Precedent Autonomy" is.
      *   *Ranking:*
          1.  **Belief vs. Commitment (User's #5).** This is the upstream killer. If you treat values like beliefs, you get it wrong.
          2.  **Identity/Continuity (User's #4).** If future-you isn't "you" (e.g., severe dementia), deference breaks down.
          3.  **Knowledge vs. Change (User's #2).** Related to #4. Distinguish between learning new facts vs. brain damage.
          4.  **Basic Rule/Derivative (User's #1) & Money Pump (User's #3).** Discard. Academic navel-gazing.
      *   *Missing:* The role of the Proxy. The form is rarely executed by "future you"; it's executed by a doctor + proxy.
      *   *Settled vs. Guessing:* Philosophical consensus on Reflection is *not* settled (van Fraassen himself modified it). But legal/medical consensus on Advance Directives *is* somewhat settled (Proxy > Specific Instructions usually).

  7.  **Refining the Advice:**
      *   Don't let them waste time on the Reflection Principle literature. It's a trap for this specific problem.
      *   Focus on the "Dworkin vs. Dresser" debate (Critical Interests vs. Experiential Interests) without necessarily using those jargon words unless helpful.
      *   Emphasize appointing a proxy over writing specific instructions.

  8.  **Final Polish:**
      *   Tone: Respectful, direct, practical.
      *   Structure: Direct answer first (The Category Error), then the Ranking, then the Missing Pieces, then the "Settled" verdict.
      *   Check constraints: Did I commit to an ordering? Yes. Did I say where I'm guessing? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to give legal advice. I must frame this as "how to think about the philosophy to inform the form," not "how to fill the form."
      *(Refining the Reflection Point)*: The user asked about Reflection. I shouldn't just say "It's wrong." I should explain *why* it doesn't map. Reflection assumes the future self is a *better tracker of truth*. In medical directives, the future self might be a *worse tracker of values* (due to impairment).

      *(Finalizing the Ranking)*:
      1.  Belief vs. Commitment (The Category Error).
      2.  Identity (Who is future-me?).
      3.  Knowledge vs. Change (Why did the preference change?).
      4.  The Rest (Trash for this purpose).

      *(Missing)*: The Proxy Question.

      *(Settled)*: Reflection is controversial in philosophy. Advance Directive best practices (Proxy > Instructions) are fairly settled in bioethics.

  9.  **Final Output Generation** (matches the thought process above).
answer: |-
  Here is the direct answer: **Stop reading about the Reflection Principle.**

  It is a trap for your specific problem. The Reflection Principle is a rule about *beliefs* (tracking truth), but an advance directive is a tool for *values* (tracking well-being). If you treat your future medical preferences like weather predictions, you will fill out the form incorrectly.

  Here is the ranking of your questions based on utility for signing that form, from "decides the outcome" to "waste of time."

  ### 1. The Upstream Killer: Is this about belief or commitment? (Your #5)
  **Verdict:** **Settled (in bioethics, not philosophy).** This is not about belief.
  **Reasoning:** The Reflection Principle assumes your future self has *better access to the truth*. If Future-You believes it's raining, Present-You should believe it's raining. But an advance directive isn't about truth; it's about *authority*.
  *   **The Trap:** If you apply Reflection here, you imply Future-You's preferences are automatically "correct" updates on Present-You's preferences.
  *   **The Reality:** In bioethics, this is the battle between **Precedent Autonomy** (Past You binds Future You) and **Current Interests** (Future You's current experience matters most). If you get dementia and are happy eating pudding, but Past You wrote "no life support if demented," Reflection says defer to the pudding-eater (because that's the current state). The law often says defer to the document (because that was the competent choice).
  *   **Action:** Do not spend an evening on this. Spend 30 minutes accepting that **values do not update like probabilities.** You are not predicting what you will want; you are issuing a command to protect what you *currently* value against what you might *future* want if impaired.

  ### 2. The Identity Question: What if the "future self" is only loosely me? (Your #4)
  **Verdict:** **High Priority / Philosophically Contested.**
  **Reasoning:** This is the only philosophical question that actually changes what you write. If you believe personal identity is continuous through severe dementia, you might defer to Future-You's happiness. If you believe severe dementia creates a "new person," you owe that new person nothing, and your directive should be strict.
  *   **Why it matters:** If you think the stroke victim is "still you," you might write flexible instructions ("do what makes me comfortable"). If you think the stroke victim is a "biological remnant," you might write strict instructions ("pull the plug if I can't recognize my spouse").
  *   **Action:** This is worth one evening of journaling. Ask yourself: *If I lose my memory and personality, is that still me?* There is no academic consensus, but your answer dictates whether your directive is a "living will" (strict) or a "values statement" (flexible).

  ### 3. Knowledge vs. Change (Your #2)
  **Verdict:** **Medium Priority / Derivative of #2.**
  **Reasoning:** You need to distinguish between *informational updates* and *corruption*.
  *   **Informational:** Future-You learns a new treatment has a 90% success rate. Present-You should defer. That's rational updating.
  *   **Corruption:** Future-You is depressed, coerced, or cognitively impaired. Present-You should *not* defer.
  *   **Action:** Don't study the philosophy of forgetting. Just ensure your form distinguishes between "new medical options" (defer to doctors/proxy) and "quality of life thresholds" (defer to this document).

  ### 4. Basic Rule vs. Derivative & Money Pumps (Your #1 and #3)
  **Verdict:** **Gadgets / Ignore.**
  **Reasoning:** Whether Reflection is a "basic rule of rationality" or derived from Dutch Book arguments is a technical debate for epistemologists. It has zero bearing on medical law or ethics. Violating Reflection might make you "irrational" in a betting sense, but it does not make your advance directive invalid.
  *   **Action:** Skip entirely. This is academic navel-gazing.

  ---

  ### What You Missed (The Practical Pivot)

  There is a question more important than all the above, which renders the Reflection Principle obsolete for your purposes:

  **"Who is the actual decision-maker?"**
  *   **The Reality:** Advance directives are rarely read by "Future You." They are read by a **surrogate (proxy)** and a **doctor** when you are already incapacitated.
  *   **The Problem:** Specific instructions (e.g., "No feeding tube if I can't walk") often fail because situations are nuanced.
  *   **The Solution:** The most robust advance directive is not a list of commands, but a **Power of Attorney for Healthcare.**
  *   **Why this beats Reflection:** Instead of asking "How much do I defer to Future Me?", ask "Who do I trust to interpret my values better than a confused Future Me?"
  *   **Action:** Spend your evenings choosing a proxy and *talking to them* about your values, rather than trying to solve the metaphysics of self-continuity on paper.

  ### Summary of Orders

  1.  **Drop the Reflection Principle.** It applies to truth, not values. (Settled in bioethics).
  2.  **Decide on Identity.** Does the "demented you" count as "you"? This determines how strict your instructions are. (Contested, personal choice).
  3.  **Appoint a Proxy.** This is the practical solution to the "Future Me is unreliable" problem. (Settled best practice).
  4.  **Ignore the Epistemology.** Rationality rules and money pumps are irrelevant to medical law. (Settled waste of time).

  **My Guess vs. Settled:**
  *   **Settled:** The Reflection Principle is epistemological, not normative. Using it for values is a category error. Appointing a proxy is superior to specific instructions.
  *   **My Guess:** I am guessing that wrestling with the "Identity" question (#2 in my ranking) will give you more peace of mind than any other philosophical reading. It forces you to decide what makes your life *yours*, which is the actual point of the document.

  **Final Advice:** Use your evenings to draft a "values letter" for your proxy, not a rigid checklist for your doctors. That solves the deferral problem by outsourcing it to a human you trust now, rather than a self you can't predict.
