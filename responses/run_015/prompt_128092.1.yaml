  ### Principle 2: Concave Moral Aggregation (Diminishing Marginal Weight)

  This principle accepts that moral weight is continuous (no hard threshold) but rejects linear aggregation. It posits that the moral value of a population scales sub-linearly with numbers. The first few expected sentients count fully, but additional ones count for less and less. This mathematically captures the "gut feeling" that numbers shouldn't compound indefinitely.

  **The Clauses:**
  1.  **Individual Proportionality:** The moral weight of a single entity is proportional to $P(S)$.
      *   *Motivated by:* **V4** (Octopus scaling) and **V2** (Single ant has tiny weight).
  2.  **Diminishing Aggregation:** The total moral weight of a population of size $N$ is calculated as $W_{total} = N^k \times P(S)$, where $0 < k < 1$ (e.g., $k = 0.1$ or logarithmic).
      *   *Motivated by:* **V3** (Mass ants don't outweigh human) and **V6** (Resource allocation). Even if $N$ is huge, $N^k$ remains small relative to a human life.
  3.  **Integration Requirement:** $N$ only counts if the entities are biologically integrated systems, not parallel simulations.
      *   *Motivated by:* **V5** (Digital ants).

  **Prediction for the New Case (500 animals @ 80% vs. 1 Human):**
  *   **Analysis:** 80% confidence is high, so the base weight is high. However, the aggregation discount applies.
  *   **Calculation:** Let's assume a strong discount $k = 0.3$ (to satisfy V3). $500^{0.3} \approx 6.5$. Total Weight $= 6.5 \times 0.8 = 5.2$ Human-Equivalents.
  *   **Verdict:** **Save the 500 animals.** (5.2 > 1).
  *   *Note:* To make the Human win here, $k$ would need to be extremely small (near 0), which might contradict V4 if you ever face a choice between 2 Octopuses and 1 Human.

  **Verdicts Forced to Abandon:**
  *   **None explicitly.** This principle is flexible enough to fit V1–V6 by adjusting the exponent $k$.
  *   **Theoretical Cost:** It forces you to abandon **Expected Utility Theory** as a moral framework. You are accepting that $100 \times 1\%$ is not morally equivalent to $1 \times 100\%$.

