      *   *The Fitness Function Analogy:*
          *   In GAs: `fitness = calculate_score(individual)`. The programmer defines `calculate_score`.
          *   In Nature: `fitness = survive_and_reproduce(individual)`. The "laws of physics/biology" define the constraints.
          *   *Crucial Point:* The environment doesn't "calculate" fitness. It just *is*. If you freeze, you die. That's not a calculation; it's a physical consequence.
      *   *Competence without Comprehension:* Explain this phrase (Dennett). A tree is competent at gathering sunlight but doesn't comprehend photosynthesis.
      *   *The "Double Inversion" Query:*
          *   User thinks: GA (Human understands) -> Darwin (No one understands).
          *   Reality: It's not double. It's just *radical*. In GAs, the intelligence is imported from the programmer. In Darwin, the intelligence is *exported* from the process itself. The "design" is in the outcome, not the source.
      *   *Turing Connection:* Yes, it's the same move. Syntax vs. Semantics. Rules vs. Meaning.
      *   *Philosophical Payoff:* Why does this matter? It solves the "Watchmaker Argument" (Paley). You don't need a designer to have design.

  5.  **Refining the Tone:**
