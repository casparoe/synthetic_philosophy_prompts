answer: |-
  Thanks for sending this over because it is a genuinely fascinating test case for the old intentionalist wars, and honestly, it is rare to see the abstract fights we have in the seminar room play out in something as concrete as a wiki disputes channel. You are right to feel that the slogan the author is dead is doing too much heavy lifting in that thread, and if we are going to map the space before we verdict, we need to disentangle the semantic claims from the pragmatic policies, because I suspect half the disagreement is people arguing past each other about whether they are describing what meaning is or prescribing how the wiki should be run.

  Let us start by laying out the distinct claims hidden in that slogan, moving from the modest to the radical, and see if they can actually do the work your editors want them to do. The first claim is the most defensible and probably the most common among the editors who said intentions are fine as evidence but only the published text is canon. This is essentially the moderate position of the New Critics like Wimsatt and Beardsley, who argued that while authorial intention might be interesting biographical data, it is not constitutive of the work's meaning once the text is public. Is this a platitude? In literary circles, yes, it is practically the default stance, but in a collaborative world-building context, it is substantive because it privileges the artifact over the creator. Is it false? Not obviously, though it relies on a distinction between meaning and significance that some pragmatists would reject. Does it do the work? It supports leaving the page alone, but it struggles with your house rule about the ratchet, because if the text is all that matters, why should a later authorial statement be allowed to add anything at all? If the text is sovereign, an addendum is just a new text, not an update to the old one, so this view actually undermines the idea that the author has any special privilege to expand the record, let alone the privilege to be heard over the editors.

  The second claim is the one used by the person who said there is simply no fact of the matter about what the setting says. This is a radical indeterminacy thesis, suggesting that because the author is dead, the text has no fixed anchor and meaning is purely a function of the reader's encounter. Is this a platitude? No, it is a strong metaphysical claim about semantics. Is it defensible? Only if you accept a very strong version of deconstruction or reader-response theory that denies constraints on interpretation, which seems false for a wiki that has a style guide and a function; if the text says the coast is for trading, reading it as a penal colony without evidence is not a valid interpretation, it is a mistake. Does it do the work? It justifies inaction, but it threatens the project's coherence because if there is no fact of the matter, the wiki is not recording a world, it is recording preferences, which might be true but is demoralizing for a collaborative effort aiming at consistency.

  The third claim is that our reading is as good as his so majority vote wins. This shifts the authority from the author to the community, which is a political claim rather than a semantic one. Is this a platitude? In a wiki context, it is almost a truism of the medium, but philosophically it is a claim about communal constructivism. Is it defensible? Yes, especially for a game setting where the utility of the text depends on shared agreement rather than artistic fidelity. Is it false? No, but it conflates validity with consensus. Does it do the work? Yes, this is the only claim that actually resolves the dispute procedurally, but it requires admitting that canon is a matter of governance, not discovery, which might bruise some egos.

  The fourth claim is the one that treats the author's later statement as just another text with no special standing. This is the recursive move your colleagues made at two in the morning. Is this a platitude? It sounds clever, but it is actually a rigorous application of the first claim. Is it defensible? Yes, because the AMA post is indeed a text that requires interpretation itself. Is it false? No. Does it do the work? It creates a regress problem because if the AMA is just a text, who interprets it? The community. So it collapses into the third claim eventually, but it serves as a useful blocker against treating the AMA as a divine decree.

  Now, let us fold in your house rule about the ratchet, because this is where the philosophy meets the pavement. You said later statements can add but not retract, and you want to know if this is consistent with the slogan. If the slogan means the author has no authority, the ratchet contradicts it by granting the author some authority to add. If the slogan means the text is fixed at publication, the ratchet contradicts it by allowing the record to grow. So the ratchet is not a claim about meaning at all; it is a policy about reliance and stability. It is a pragmatic rule designed to protect the players who built campaigns on the old reading, which means it is closer to contract law than literary theory. This connects directly to your housemate's point about wills and estates. In law, intention matters enormously because a will is a speech act that changes the world, it is performative rather than constative. A novel is usually constative, describing a world, but a campaign setting is hybrid; it describes a world but also functions as a set of rules for play. If the wiki is more like a statute or a terms of service agreement than a poem, then the author's intention carries more weight because the text is a tool for coordination. However, you also noted that statutes are often written by committees who disagree, which makes the singular intention of the author a fiction. This supports the death of the author thesis practically even if not metaphysically; if there is no single mind to access, we must rely on the public text. So the principle that sorts the genres is not art versus law, but singular expression versus collaborative coordination. Your wiki is collaborative, so the committee problem applies, which weakens the original creator's claim to privileged access to the meaning, but the reliance interest strengthens the community's claim to stability.

  This brings us to the reflexive move about the AMA post itself having a dead author. This is not a cheap trick; it is a real philosophical move that highlights the instability of appealing to intention. If we need the author's intention to interpret the AMA, and the author is dead or inaccessible, then the AMA is just as opaque as the original text. However, this move only works if we are seeking metaphysical certainty. If we are seeking a workable policy, we stop the regress by agreeing on a convention, which is exactly what your house rule does. The regress shows that we cannot ground meaning in the mind of the author, so we must ground it in the practices of the community.

  So if we have to break the tie and you prefer to keep the house rule doing something real rather than keeping the slogan in its strongest form, here is what you are paying. By prioritizing the ratchet, you are admitting that canon is not a truth condition but a governance condition. You are saying that the value of the wiki is not fidelity to the creator's vision but utility for the current players. This means you cannot claim that the trading coast reading is the true meaning and the penal colony reading is false; you can only say that the trading coast reading is the valid one under the current governance policy. You are sacrificing the idea of semantic truth for the idea of social contract. The cost is that you lose the ability to say the original creator is wrong about their own world; instead, you have to say they are overruled by the community's need for stability. This might feel like a demotion of the art, but for a game setting, it is probably the only way to survive fifteen years of collaboration. The slogan the author is dead is useful here not as a theory of meaning, but as a reminder that the community now owns the work, and ownership entails the right to set the rules of engagement, including the rule that we do not break the toys people are already playing with. If you keep the slogan in its strongest form, you risk fracturing the community into those who follow the text and those who follow the author, but if you keep the house rule, you unify the community under a policy that acknowledges the text is a living agreement rather than a dead letter. You pay with the romance of authorial genius, but you buy stability and shared ownership, which seems like a fair trade for a volunteer project that wants to last another fifteen years.
