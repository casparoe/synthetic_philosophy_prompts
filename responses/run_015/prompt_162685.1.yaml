      *   **User's Solution:** "Better than" is a three-place relation: $x >_S y$ (better relative to standard $S$ of discrimination). Transitivity holds *within* a fixed $S$. The Spectrum Argument equivocates (coarse $S$ for adjacents, fine $S$ for endpoints).
      *   **Specific Questions/Requirements:**
