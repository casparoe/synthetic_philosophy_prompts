      *   This sounds like a contextualist or precisification-based approach to vagueness applied to value. It resembles views by Ruth Chang (parity/small improvement), Hare (epistemicism), or perhaps a specific form of contextualism about gradable adjectives (Kennedy, Raffman).
      *   Key claim: Transitivity is saved by indexing the relation to a resolution standard ($S$).
