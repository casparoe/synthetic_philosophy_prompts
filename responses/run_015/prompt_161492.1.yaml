      *   *Is it corruption?* Technically yes (violation of formal rule for personal discretion), but functionally it's *survival strategy* or *informal governance*. Calling it "corruption" implies a moral failing where there might be systemic necessity.
      *   *Does poverty selection matter?* Yes. If he selects the poor, it's redistributive informalism (Robin Hood). If he selects friends regardless of need, it's patronage. The *intent* and *outcome* shift the moral weight, even if the technical definition holds.

  4.  **Identify What Both Are Missing:**
      *   Reza focuses on Rules/Universals. Dana focuses on Function/Context.
      *   *Missing:* The distinction between *Private Gain* vs. *Public Necessity*. Most definitions of corruption require "private gain" (bribe, favor for self/kin). Here, the official takes "appreciation payments" (small bribes) but the outcome helps the poor.
      *   *Better Missing Piece:* **The distinction between *Corruption* and *Informality*.** Corruption implies abuse of public office for *private* gain. Informality implies operating outside the state's formal rules to achieve *public* or *survival* ends. The official is taking small payments (private gain), but the allocation is social (helping the poor). They are conflating the *payment* (corrupt) with the *allocation* (informal governance).
      *   *Alternative Missing Piece:* **The Principal.** Who is the official serving? The State (Reza's view) or the Community (Dana's view)?
