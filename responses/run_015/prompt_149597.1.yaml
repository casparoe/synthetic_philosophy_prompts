answer: |-
  ### Preamble: Critique of Cases and Distinctions

  Before presenting the instrument, I must address Constraint 6 regarding the adequacy of your drafted materials.

  1.  **The Empty-Report Case is Broken.** I have not used this as a node. It asks whether reports produced without access to experience count as evidence. This presupposes that 'experience' and 'access' are separable in a way that Illusionists (e.g., Dennett, Frankish) deny. For an Illusionist, the report *is* the primary datum; positing a hidden experience that the report fails to track begs the question against them. It collapses into the standard "Zombie Judgment" problem found in Chalmers, rather than offering a novel sorting mechanism.
  2.  **Distinction (3a) Stability.** Enforcing stability across synchronic and diachronic cases in a decision tree is logically difficult without a meta-question ("Are your answers consistent?"), which violates Constraint 2. I have handled this by placing the Diachronic and Synchronic nodes sequentially. This creates logical space for unstable combinations (Yes/No or No/Yes), which I have marked as empty leaves with explanations.
  3.  **Distinction (3b) Access vs. Reports.** This distinction often collapses into the question of incorrigibility. If reports are the only data, they are treated as fallible behavioural outputs. If access contributes evidence, reports are treated as privileged avowals. I have operationalised this as a question about the possibility of error in avowals.

  ***

  ### Part 1: The Logical Space

  The tree is built on five branching questions. The first two map the metaphysical commitment to qualia using your required cases. The subsequent three distinguish the varieties of realism and anti-realism.

  **Node 1 (Diachronic):** In the **Palimpsest case**, is there a fact of the matter that the subject's experience has changed, even though no discrimination, report, or memory contrast could reveal it?
  *   **Yes:** Phenomenal properties vary independently of functional/behavioural profiles. (Realist Path)
  *   **No:** Phenomenal properties supervene on functional/behavioural profiles. (Anti-Realist/Functionalist Path)
  *   *[Confidence: High]*

  **Node 2 (Synchronic):** In the **Twin-Taster case**, is there a fact of the matter that the subjects differ phenomenally, even though their internal similarity structures are identical?
  *   **Yes:** Phenomenal properties are intrinsic to the experience. (Intrinsic Path)
  *   **No:** Phenomenal properties are constituted by relations of similarity/difference. (Relational Path)
  *   *[Confidence: High]*

  **Node 3 (Reference):** When a subject sincerely reports "I am experiencing red", does the term 'experience' successfully refer to a property actually instantiated in the subject?
  *   **Yes:** The discourse is truth-apt and satisfied. (Realist/Representationalist Path)
  *   **No:** The discourse is false or void of reference. (Eliminativist Path)
  *   *[Confidence: Medium]* (Fragile: Some views treat reports as true but non-referential).

  **Node 4 (Causation):** Does the specific phenomenal character of the experience causally contribute to the production of the subject's report, distinct from the neural mechanism?
  *   **Yes:** Phenomenal properties have causal power. (Causal Path)
  *   **No:** Phenomenal properties are causally inert or the neural mechanism does all the work. (Epiphenomenal/Reductive Path)
  *   *[Confidence: Medium]* (Fragile: Overdetermination views blur this line).

  **Node 5 (Grounding):** If a being shared the exact same neural structure as the subject, must they necessarily share the exact same experience?
  *   **Yes:** Experience is necessitated by physical structure. (Physicalist Path)
  *   **No:** Experience is not logically guaranteed by physical structure. (Dualist/Mysterian Path)
  *   *[Confidence: High]*

  ***

  ### Part 2: The Decision Tree

  **Start at Node 1.** Follow the answers to the leaves.

  **Node 1: Palimpsest (Diachronic)**
  *   **NO** (No fact of change) → Go to **Node 2**.
  *   **YES** (Fact of change) → Go to **Node 2**.

  **Node 2: Twin-Taster (Synchronic)**
  *   **If Node 1 was NO:**
      *   **NO** (No fact of difference) → Go to **Node 3**. (Stable Anti-Realist)
      *   **YES** (Fact of difference) → **LEAF A (Empty)**. *Reason: Incoherent. It is untenable to claim intrinsic synchronic differences exist while denying intrinsic diachronic changes when functional structure is held fixed in both.*
  *   **If Node 1 was YES:**
      *   **YES** (Fact of difference) → Go to **Node 3**. (Stable Realist)
      *   **NO** (No fact of difference) → **LEAF B (Empty)**. *Reason: Merely unattractive. Accepting diachronic intrinsic change while denying synchronic intrinsic difference implies a temporal asymmetry in metaphysics that lacks motivation.*

  **Node 3: Reference (Reports)**
  *   **If coming from (NO, NO):**
      *   **NO** (No reference) → **LEAF 1: Illusionism**.
      *   **YES** (Reference) → Go to **Node 4**.
  *   **If coming from (YES, YES):**
      *   **NO** (No reference) → **LEAF C (Empty)**. *Reason: Unexplored. A view that accepts intrinsic qualia but denies our reports refer to them is a sceptical realism no one currently occupies.*
      *   **YES** (Reference) → Go to **Node 4**.

  **Node 4: Causation**
  *   **If coming from (NO, NO, YES):**
      *   **NO** (No causal power) → **LEAF 2: Relationalist/Structuralist**.
      *   **YES** (Causal power) → Go to **Node 5**.
  *   **If coming from (YES, YES, YES):**
      *   **NO** (Causally inert) → **LEAF 3: Epiphenomenalism**.
      *   **YES** (Causal power) → Go to **Node 5**.

  **Node 5: Grounding (Physical Necessitation)**
  *   **If coming from (NO, NO, YES, YES):**
      *   **YES** (Necessitated) → **LEAF 4: Reductive Representationalism**.
      *   **NO** (Not necessitated) → **LEAF D (Empty)**. *Reason: Simply unexplored. A functionalist who believes functional roles are non-physically realised is a rare metaphysical hybrid.*
  *   **If coming from (YES, YES, YES, YES):**
      *   **YES** (Necessitated) → Go to **Node 6 (Conceptual)**.
      *   **NO** (Not necessitated) → Go to **Node 6 (Conceptual)**.
      *(Note: To separate the remaining Realist views, we require a distinction on conceptual structure, as Grounding alone cannot separate Russellians from Dualists without label questions.)*

  **Node 6: Conceptual Structure**
  *   **Question:** Is the concept used to grasp the experience distinct in kind from the concept used to grasp the physical brain state?
      *   **NO** (Same concept) → **LEAF 5: Non-reductive Phenomenal Realism**. *(Note: This leaf is hard to separate from Reductive Representationalism; see below).*
      *   **YES** (Distinct concepts) → Go to **Node 7**.

  **Node 7: Intrinsic Nature**
  *   **Question:** Is the phenomenal property the intrinsic nature of the physical vehicle itself?
      *   **YES** (Intrinsic nature) → **LEAF 6: Russellian Monism or Panpsychism**.
      *   **NO** (Distinct property) → Go to **Node 8**.

  **Node 8: Knowability**
  *   **Question:** Is the explanation for why the physical necessitates the experience accessible to human understanding?
      *   **YES** (Accessible) → **LEAF 7: Phenomenal-Concept / A Posteriori Physicalist**.
      *   **NO** (Inaccessible) → **LEAF 8: Mysterianism**.

  **Special Leaf:**
  *   **LEAF 9: The Meta-Position (Verbal Dispute).** *Path:* A student may exit the tree at any node by rejecting the presupposition that the question has a non-verbal answer. (e.g., "The Palimpsest case describes a verbal confusion about 'change'").

  ***

  ### Part 3: The Leaves

  **LEAF 1: Illusionism**
  *   **Commitment:** You must maintain that when subjects say "it hurts", they are systematically mistaken about their own states.
  *   **Awkward Commitment:** Explaining why the error is so persistent without admitting the phenomenon is real.

  **LEAF 2: Relationalist or Structuralist View**
  *   **Commitment:** You must deny that there is 'more' to experience than the web of discriminations and similarities.
  *   **Awkward Commitment:** Accounting for the felt 'depth' of experience without invoking intrinsic qualities.

  **LEAF 3: Epiphenomenalism**
  *   **Commitment:** You must accept that your experience of pain plays no role in your saying "ouch".
  *   **Awkward Commitment:** Explaining how we can know about and refer to properties that cause nothing in us.

  **LEAF 4: Reductive Representationalism**
  *   **Commitment:** You must identify the feel of an experience entirely with its representational content.
  *   **Awkward Commitment:** Handling cases of non-veridical experience (e.g., hallucinations) where content and feel seem to come apart.

  **LEAF 5: Non-reductive Phenomenal Realism**
  *   **Commitment:** You must posit distinct phenomenal properties that are nonetheless physically necessitated.
  *   **Awkward Commitment:** This leaf cannot be cleanly separated from **Reductive Representationalism** on this tree; both answer Yes to Grounding and Causation. The distinction relies on whether one sees the reduction as *identity* or *constitution*, which often collapses in practice.

  **LEAF 6: Russellian Monism or Panpsychism**
  *   **Commitment:** You must claim physics describes only structure, leaving the intrinsic nature (consciousness) hidden.
  *   **Awkward Commitment:** Avoiding the inference that rocks or electrons are conscious in a meaningful sense (the combination problem).

  **LEAF 7: Phenomenal-Concept or A Posteriori Physicalist Strategy**
  *   **Commitment:** You must argue the gap between physical and phenomenal is conceptual, not ontological.
  *   **Awkward Commitment:** Explaining why this conceptual gap creates such a persistent intuition of dualism without conceding dualism is true.

  **LEAF 8: Mysterianism**
  *   **Commitment:** You must assert the problem is real but humanly unsolvable.
  *   **Awkward Commitment:** Justifying a confident claim about the limits of human cognition from within human cognition.

  **LEAF 9: The Meta-Position (Verbal Dispute)**
  *   **Commitment:** You must argue the debate rests on ambiguous usage of terms like 'experience' or 'property'.
  *   **Awkward Commitment:** Explaining why the disagreement feels so substantive if it is merely verbal.

  ***

  ### Note on Separation (Constraint 5)
  As noted in **Leaf 5**, this instrument cannot cleanly separate **Non-reductive Phenomenal Realism** from **Reductive Representationalism** (Leaf 4) without resorting to label questions about "identity" vs "realisation". Both views typically answer Yes to Causation and Yes to Grounding. They differ on the *metaphysical gloss* placed on that grounding. A student landing on Leaf 5 must be asked an additional supplementary question: "Is the phenomenal property *identical* to the physical property, or merely necessitated by it?" to distinguish it from Leaf 4.
