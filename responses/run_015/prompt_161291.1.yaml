      *   **The Task:** Disambiguate the slogan "identity isn't what matters" into a menu of precise claims (ordered boring to wild). Evaluate each claim (platitude, substantive thesis, false/unargued). Evaluate whether each claim actually supports the specific arguments made in the group (the user's lossy copy case, the "no worse than sleep" claim, the "death isn't bad" claim). Address the "wrinkle" (B built before A).
      *   **Tone:** Respectful, precise, analytical (matching the user's scientific background), plain language, no jargon without explanation.

