  Hey — I work in a materials testing lab (mostly brittle fracture and fatigue), and an argument in our group chat has turned into a mild obsession, so I'm hoping you can tell me whether there's an established concept for what I keep running into.

  It started with a specific alloy. The question was whether it's *really* brittle at room temperature. Put a load on it and a crack does start — and then the crack stops: the plastic zone at the tip blunts, local stress drops, and it arrests after a millimetre or two. The sample is still brittle in the ordinary sense (load a different region, or re-machine and load again, and it cracks again), but no single test ever gives you the full thing: the fracture begins and is then undone by its own beginning. Same shape in a case my brother-in-law, who's a chemist, keeps bringing up: a catalyst that is genuinely disposed to speed up a reaction, does visibly start working, and then gets poisoned by its own product binding to the active sites — catalyst undamaged, disposition fully intact, nothing external blocking it, the process just shuts itself off part-way. And then there's fatigue, which is maybe a third thing or maybe the same thing from a different angle: a coupon that survives any single load you care to apply, but develops a crack over a hundred thousand cycles — is that one disposition whose manifestation is spread over many applications of the stimulus, or a hundred thousand different dispositions?

  I've since read around a bit and found the cases people always wheel out — the sorcerer who would make the glass stop being fragile at the very instant it was struck, and the glass packed in padding so that it's fragile and yet never breaks. Neither is mine, or so I want to say: in the first, the disposition itself goes away; in the second, nothing happens at all. In mine the disposition survives, something definitely happens, and it's the happening that stops it. It's also not the fool's-gold situation, where something produces the characteristic behaviour without having the disposition at all — my stuff really has it, it just can't finish. Please don't just hand me a label; I want the carving: what exactly this is, why it isn't the two famous cases (or why it secretly is one of them), and where its edges are — e.g. does it matter that the stopping factor is internal rather than external, and what happens to it when the arrest occurs so early that nothing detectable occurs at all?

