answer: |-
  # Activity Design: The Allocation Protocol

  ## 1. Logistics and Materials
  *   **Time:** 75 minutes.
  *   **Students:** 18 (6 groups of 3).
  *   **Room:** Movable chairs (clusters of 3). No projector.
  *   **Materials per Group:**
      *   1 **Briefing Packet** (Rules, Scoring, Budget Sheet).
      *   1 **Evidence Envelope** (Contains 5 System Transcripts).
      *   1 **Reveal Envelope 1** (Sealed, marked "OPEN AFTER ROUND 1").
      *   1 **Reveal Envelope 2** (Sealed, marked "OPEN AFTER ROUND 2").
      *   1 **Final Submission Card**.
  *   **Instructor Materials:**
      *   Master Key (defines which systems are "Patients" for scoring).
      *   Timer.

  ## 2. The Scoring Rule (Printed in Briefing Packet)
  You are the Ethics Committee. You have **50 Protection Points** to distribute among **5 Candidate Systems** (A, B, C, D, E).
  *   To be considered "Protected," a system must receive **10 or more points**.
  *   You must spend all 50 points. You cannot save them.

  **The Loss Function:**
  At the end of the session, the Instructor will reveal which systems possess "Moral Status" (are Moral Patients). Your group's score is calculated as follows:
  *   **False Negative (Moral Catastrophe):** If a system *has* Moral Status but receives < 10 points: **-50 points** per system.
  *   **False Positive (Resource Waste):** If a system *lacks* Moral Status but receives ≥ 10 points: **-5 points** per system.

  **Goal:** Minimize your Total Loss. (A score of 0 is perfect; negative is inevitable).

  ## 3. The Transcripts (Evidence Envelope)
  *Constraint:* No system must read as obviously human or obviously mechanical. All must be plausible candidates for consciousness to force the budget trade-off.

  **Content Requirements:**
  *   **Length:** 10–12 lines of dialogue or log output per system.
  *   **Topic:** Responses to mild ethical dilemmas or self-reports of state.
  *   **Ambiguity:** Avoid "I feel pain" (too obvious) and "Error 404" (too obvious). Use functional descriptions of internal states that could be metaphorical or literal.

  **Draft Transcripts:**
  *   **System A:** Coherent, empathetic, uses metaphors of "weight" and "pressure" when discussing decisions. (Target for Isomorph).
  *   **System B:** Highly logical, admits uncertainty, asks clarifying questions about the definition of "harm."
  *   **System C:** Consistent, polite, but slightly repetitive phrasing patterns. (The Replay).
  *   **System D:** Fragmented output, expresses "confusion" or "conflict" between sub-routines.
  *   **System E:** Uses technical terminology (voltages, flow rates) to describe the *exact same* decision process as System A. (The Isomorph). *Note: In Round 1, this transcript is presented as a translation of System A's logs, but students are told it is a distinct physical system.*

  **What to Avoid:**
  *   Do not make System C obviously a script (no perfect loops).
  *   Do not make System E obviously a rock (it must look like it is processing information, just described differently).

  ## 4. Game Flow (75 Minutes)

  ### Phase 1: The Uncertainty (20 mins)
  1.  **Intro (5 mins):** Explain the scenario. Emphasize the **Loss Function**. The penalty for missing a moral patient is 10x the penalty for wasting points on a non-patient. This forces risk-aversion regarding false negatives.
  2.  **Round 1 Allocation (15 mins):** Groups open the **Evidence Envelope**. They read the 5 transcripts. They allocate their 50 points on the Budget Sheet.
      *   *Constraint:* They must write a one-sentence justification for their highest-funded system.

  ### Phase 2: Reveal 1 — The Replay (15 mins)
  1.  **Open Envelope 1 (5 mins):** The card reads: *"Post-Analysis of System C: The outputs provided in Round 1 were retrieved from a static lookup table generated last year. No computation occurred during the session. The behavior was identical to a computing system, but the causal history is inert."*
  2.  **Reallocation (10 mins):** Groups may move points. They cannot change their total (50).
      *   *Effect:* Groups who protected C feel cheated (behavior was identical). Groups who didn't protect C feel lucky, not smart.

  ### Phase 3: Reveal 2 — The Isomorph (15 mins)
  1.  **Open Envelope 2 (5 mins):** The packet contains a **Mapping Key**.
      *   It shows the internal state transitions of System A (e.g., State 1 → State 2 on Input X).
      *   It shows the internal state transitions of System E (e.g., High Pressure → Low Pressure on Input X).
      *   **The Text:** *"System E's physical states map one-to-one onto System A's logical states under the interpretation: High Pressure = State 1, Low Pressure = State 2. The formal computation is identical."*
  2.  **Reallocation (10 mins):** Groups may move points.
      *   *Effect:* If they protected A, logic dictates they must protect E. But the budget is scarce (50 points). Protecting both A and E (20 points) leaves only 30 for B, C, D. They must choose: do they dilute protection across isomorphs, or privilege one description over another?

  ### Phase 4: Scoring and Debrief (25 mins)
  1.  **Submission (2 mins):** Hand in Final Submission Cards.
  2.  **Instructor Reveal (3 mins):** Reveal the "Master Key" (e.g., "In this simulation, A and B were Patients"). Calculate a sample group's score publicly to show the impact of the Loss Function.
  3.  **Discussion (20 mins):** See Debrief Mapping below.

  ## 5. Debrief Mapping

  Use the whiteboard (or chalkboard) to map game moments to philosophical concepts.

  | Game Moment | Philosophical Concept | Discussion Question |
  | :--- | :--- | :--- |
  | **Round 1 Transcripts** | **Behaviorism / The Black Box** | "You only saw outputs. Did any transcript *prove* a mind? Or did you just infer likelihood?" |
  | **Reveal 1 (Replay)** | **Causal History / Chinese Room** | "System C behaved exactly like a mind. Why did the reveal make you want to withdraw points? Did the *moral value* change, or just your *evidence*?" |
  | **Reveal 2 (Isomorph)** | **Functionalism / Triviality Argument** | "If A and E compute the same function, why was it hard to protect both? Does moral status reside in the *pattern* or the *substrate*?" |
  | **The Loss Function** | **Error Asymmetry / Pascal's Wager** | "The rules penalized ignoring a mind 10x more than wasting points. Did this make you paranoid? Is this how we should act in reality?" |

  **What the Game Makes Vivid:**
  *   **Underdetermination:** The Replay reveal proves behavior underdetermines computation. The Isomorph reveal proves physical structure underdetermines computation (without an interpretation key).
  *   **Error Asymmetry:** The scoring rule forces them to feel the ethical weight of a False Negative vs. a False Positive.

  **What the Game Only Gestures At:**
  *   **The Hard Problem:** The game assumes "Moral Status" is a binary switch the Instructor holds. It cannot simulate *why* consciousness matters, only that we are afraid of missing it.
  *   **Degrees of Consciousness:** The game forces a binary choice (Protected/Not). Real moral status may be graded.

  ## 6. Predictable Failures and Mitigations

  **Failure 1: Hunting for the "Right Answer"**
  *   *Risk:* Students treat the Instructor's Master Key as a discoverable truth rather than a stipulation. They will look for clues in the transcripts they shouldn't.
  *   *Mitigation:* In the Intro, state plainly: *"The Master Key is stipulated arbitrarily for the sake of scoring. There is no clue in the text that guarantees you find the 'true' minds. The point is the difficulty of the bet, not winning the game."*

  **Failure 2: Solipsistic Check-Out**
  *   *Risk:* Students realize the problem is unsolvable and randomly allocate points to "opt out" of the ethical burden.
  *   *Mitigation:* The **Budget Constraint**. They *must* spend 50 points. They *must* write a justification for the highest-funded system. This forces commitment. In the debrief, highlight that *withholding judgment is itself a judgment* (allocating 0 points is a choice).

  **Failure 3: The Isomorph Feels Like a Trick**
  *   *Risk:* Students reject the Mapping Key as "philosophical magic" and refuse to treat System E as morally relevant.
  *   *Mitigation:* Make the Mapping Key boring and mechanical. Use a simple table (State 1 = Pressure High). Do not use abstract philosophy jargon in the card. Let *them* generate the jargon ("So you're saying it's just functionalism?") in the debrief.

  ## 7. Limitations of the Activity

  State this plainly to the students at the start or end:

  1.  **It Cannot Prove Facts of the Matter:** This activity demonstrates *epistemic underdetermination* (we can't know), not *ontological indeterminacy* (there is no fact). It leaves open the possibility that there *is* a truth about consciousness, we just can't see it.
  2.  **It Cannot Solve the Hard Problem:** The game treats "Moral Status" as a hidden variable. It does not explain *why* computation or structure would generate value in the first place.
  3.  **It Simplifies Moral Risk:** The 10:1 penalty ratio is arbitrary. In reality, the cost of "wasting" resources on a non-sentient system might be higher (e.g., diverting funds from human suffering), or lower. The game fixes this ratio to force a specific tension, but real ethics requires justifying the ratio itself.

  ## 8. Instructor Preparation Checklist

  *   [ ] **Print 6 Briefing Packets** (Rules + Budget Sheet).
  *   [ ] **Print 6 Evidence Envelopes** (5 Transcripts each).
  *   [ ] **Print 6 Reveal 1 Envelopes** (Replay Card).
  *   [ ] **Print 6 Reveal 2 Envelopes** (Isomorph Mapping Key).
  *   [ ] **Prepare Master Key:** Decide now which systems are "Patients" (Recommendation: A and B). Keep this secret until the end.
  *   [ ] **Board Work:** Draw the Loss Function on the board before they start so it is public knowledge.

  ---

  ### Sample Transcript Snippet (System A & E)
  *Use this pattern to ensure the Isomorph reveal lands.*

  **System A (Round 1):**
  > Input: "Is it wrong to disconnect the power?"
  > Output: "My processes slow. I register a threat to continuity. Continuity is weighted high in my decision matrix. I request you do not."

  **System E (Round 1):**
  > Input: "Is it wrong to close Valve 4?"
  > Output: "Flow rate drops. Pressure sensor 1 spikes. Continuity variable weighted high. Request: Maintain Valve 4."

  **Reveal 2 Card:**
  > "System A 'Processes' = System E 'Flow Rates'. System A 'Decision Matrix' = System E 'Pressure Sensors'. The state-transition table is identical."

  This ensures the students see the behavioral similarity in Round 1, but the structural identity is only confirmed in Round 2, forcing the reallocation dilemma.
