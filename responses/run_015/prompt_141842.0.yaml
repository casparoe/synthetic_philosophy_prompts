  2.  **Deconstruct the Philosophical Problem:**

      *   *The Problem:* We want to protect things that have moral status (consciousness, suffering, agency). We only see behavior or physical structure. We infer the "computation" (the mental life) from these. But multiple computations can realize the same behavior (triviality arguments, lookup tables, mapping arguments).
      *   *The Tension:* If we protect too little, we harm something that matters (Type II error). If we protect too much, we waste resources on rocks/logs (Type I error).
