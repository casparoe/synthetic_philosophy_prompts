      *   *Is "Error Theory" completely wrong?* Mackie cites the tradition. But Ramsey is usually seen as a precursor to *Expressivism* (Ayer, Stevenson) rather than Error Theory (Mackie). Error theory says "Moral claims are beliefs, but they are all false." Expressivism says "Moral claims aren't beliefs, they are desires/commands." Ramsey is closer to the latter. The essay's claim that cosmic meaning is a "pseudo-question" fits, but "personal purpose is retained... as commitments" fits Expressivism/Pragmatism better than Error Theory. I need to highlight this distinction.

