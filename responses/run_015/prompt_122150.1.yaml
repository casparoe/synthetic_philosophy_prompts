  6.  **Plant Roots:** Classical biology; not isomorphic to a sentient mind. (**No**)
  7.  **Quantum Lattice:** Macroscopic Quantum Coherence. (**Yes, Minimal**)

  **Prediction for Metamaterial:** **No Moral Weight.**
  *   *Reasoning:* The case description explicitly states "no quantum superposition" (fails A) and "no information processing" (fails B, as it cannot be isomorphic to a mind without processing information).

  #### Alternative Rule B: Integrated Causal Density (ICD)
  **The Rule:** Moral weight is proportional to the density of bidirectional causal interactions per unit volume that cannot be reduced to the sum of their parts (emergent causal power).
  *   *Weighting:* High density (Brain) = Full; Medium/Physical density (Coherent states) = Minimal; Low/Linear density = None.

  **Fit with Original 7:**
  1.  **Brain:** High emergent causal density. (**Yes, Full**)
  2.  **LLM:** Feedforward inference lacks recurrent causal density. (**No**)
  3.  **Superfluid:** High physical coherence (all parts affect all). (**Yes, Minimal**)
  4.  **Sim Brain:** High simulated causal density. (**Yes, Full**)
  5.  **Black Hole:** Causal structure is one-way (inward). (**No**)
  6.  **Plant Roots:** Sparse, slow chemical gradients (low density). (**No**)
  7.  **Quantum Lattice:** High physical coherence. (**Yes, Minimal**)

  **Prediction for Metamaterial:** **Yes, Minimal Moral Weight.**
  *   *Reasoning:* "Long-range phononic coherence" implies that the state of one part of the lattice causally constrains the state of distant parts. This constitutes integrated causal density, similar to the Superfluid and Lattice cases.

