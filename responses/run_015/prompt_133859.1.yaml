          *   Status: Defensible/Plausible.
          *   LNC Impact: Does not allow $P$ and $\neg P$ to be *true*. It only says we don't *know* which is true.
          *   Argumentative Work: Fails to validate contradictory claims as *true*, only validates tolerance of uncertainty.

      *   *Thesis 2: Metaphysical Pluralism (Dialetheism/Contradictory Reality).*
