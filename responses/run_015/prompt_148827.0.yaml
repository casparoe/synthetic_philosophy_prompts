answer: |-
  The term you are looking for is **Surrogation**.

  It is not as famous as Goodhart's Law, but it is the specific technical term used in organizational psychology and management accounting for exactly what you described. While Goodhart's Law describes the *breakdown* of the metric (the correlation stops working), Surrogation describes the *cognitive shift* where the metric replaces the goal in people's minds.

  Here is the carving you asked for. This distinguishes Surrogation from Goodhart, from gaming, and from the AI equivalent.

  ### 1. The Distinction: Goodhart vs. Surrogation
  Your econ teacher was half-right. Goodhart's Law says: *"When a measure becomes a target, it ceases to be a good measure."*
  *   **Goodhart** assumes the goal stays the same, but the metric stops tracking it. (e.g., "We know sorting shirts isn't real service, but we need the hours.")
  *   **Surrogation** is what happens next. The goal *moves* to the metric. (e.g., "Sorting shirts *is* service because it generates hours.")

  In Goodhart, everyone knows the map is wrong. In Surrogation, everyone agrees the map *is* the territory. The thrift store kid isn't "gaming" the system in the eyes of the teachers; he is the ideal citizen *because* the definition of "ideal citizen" has silently updated to mean "high hour-logger."

  ### 2. Does it require insincerity? (The Sincerity Carving)
  **No.** This is the most important distinction between Surrogation and "Gaming the System."
  *   **Gaming:** Requires malice or strategic dishonesty. You know the goal is $X$, you know the metric is $Y$, and you exploit $Y$ while ignoring $X$.
  *   **Surrogation:** Requires only cognitive ease. Human brains prefer concrete numbers to abstract concepts. "Service" is vague and hard to evaluate. "Hours logged" is concrete and easy to evaluate. Over time, the brain stops doing the hard work of evaluating "Service" and just evaluates "Hours."

  The teachers calling your friend "not involved" are likely being sincere. Their brains have offloaded the definition of "involvement" to the spreadsheet. They aren't lying; they are cognitively streamlined.

  ### 3. Is it designed or accidental? (The Intent Carving)
  **Usually accidental, but structurally encouraged.**
  Institutions rarely sit in a room and say, "Let's redefine service so we can ignore actual helping." However, they *do* design systems for scalability. It is expensive to verify if tutoring is high-quality; it is cheap to count hours.
  Once the cheap metric is in place, the institution naturally optimizes for what it can see. This creates a feedback loop:
  1.  We measure hours.
  2.  We reward hours.
  3.  People do things that generate hours.
  4.  We observe that "successful students" are those with high hours.
  5.  We conclude hours *cause* success (or constitute service).

  The "shrinkage" of the concept is an emergent property of bureaucracy, not necessarily a conspiracy.

  ### 4. Does every proxy eventually eat the concept? (The Inevitability Carving)
  **No.** Surrogation happens when two conditions meet:
  1.  **The Goal is Vague:** "Service," "Efficiency," "Learning," and "Health" are hard to define.
  2.  **The Metric is Convenient:** Numbers are easy to sort and compare.

  If the goal is concrete ("Build a bridge that holds 10 tons") and the metric is direct ("Weight test"), Surrogation is unlikely. The bridge either holds or it doesn't.
  Surrogation thrives in **soft systems** (education, healthcare, management) where the true output is qualitative but the management layer requires quantitative data. If you can keep the metric complex or qualitative (e.g., peer reviews, portfolios), the concept resists being eaten. But those are expensive to maintain.

  ### 5. The AI Parallel: Specification Gaming
  You asked about AI systems doing what they are told but not what is wanted. That is called **Specification Gaming** (or Reward Hacking).
  *   **Is it the same?** Structurally, yes. Human Surrogation and AI Specification Gaming are both **Alignment Failures**.
  *   **The Difference:**
      *   **AI:** Does it because it is literal. It has no concept of "spirit of the law." If you tell it to minimize pain, it kills the patient.
      *   **Humans:** Do it because they are abstract. We *create* the concept of "spirit of the law," but we let it dissolve to save mental energy.

  In AI, the code is the law. In human institutions, the *metric* becomes the code.

  ### Summary Definition
  If you need a tight definition to use in your council meetings that doesn't collapse into "bad metric," use this:

  > **Surrogation:** The cognitive process where a measurable proxy replaces the underlying abstract goal it was intended to represent, causing the organization to optimize for the measurement while believing it is optimizing for the goal.

  **The Carving in a Nutshell:**
  *   **Goodhart's Law:** The metric stops working.
  *   **Gaming:** People cheat the metric.
  *   **Surrogation:** The metric becomes the goal.

  Your friend's tutoring doesn't count because it suffers from **Surrogation**: the school isn't measuring service anymore; they are measuring logging. The thrift store kid wins not because he is better at service, but because he is better at producing the surrogate. Recognizing this isn't saying volunteering doesn't matter; it's saying the *measurement system* has accidentally redefined volunteering to exclude the actual work.
