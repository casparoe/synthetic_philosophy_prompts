answer: |-
  # Activity Design: The Hedonic Allocation Protocol
  **Facilitator:** Dr. Elena Voss
  **Duration:** 50 Minutes (of a 90-minute seminar)
  **Participants:** 12 Graduate Students
  **Objective:** To induce a phenomenological crisis regarding the commensurability of distinct pleasure types by enforcing a linguistic blockade on comparative metrics.

  ## I. Materials and Setup
  *   **The Slots:** 120 physical tokens (wooden or heavy cardstock). Each student receives a tray with 10 slots.
  *   **The Domains:** Four distinct categories printed on colored cards, distributed evenly among the students (3 students per domain focus):
      1.  **Thermal** (e.g., sun on skin, cold plunge).
      2.  **Gustatory** (e.g., aged wine, fresh bread).
      3.  **Intellectual** (e.g., proof resolution, conceptual clarity).
      4.  **Emotional** (e.g., forgiveness, pride, relief).
  *   **The Ban List:** A projected slide or handout listing forbidden terms.
      *   *Forbidden:* Better, worse, more, less, intense, strong, weak, quantity, amount, value, utility, pleasant, painful.
      *   *Allowed:* Only phenomenological descriptors native to the specific domain (e.g., "sharp," "warm," "resonant," "dense," "sudden," "lingering").

  ## II. Phase 1: Lexicon Lock (10 Minutes)
  Voss divides the room into four quadrants based on the Domains. Each quadrant has 5 minutes to generate a "Native Vocabulary" of exactly ten adjectives or verbs that describe their specific pleasure *without* referencing value or magnitude.

  *   *Example (Thermal):* "Radiating," "biting," "soaking," "numb." (Forbidden: "Comforting," "too hot.")
  *   *Example (Intellectual):* "Clicking," "unfolding," "tight," "elegant." (Forbidden: "Smart," "correct.")

  **Rule:** Once the lists are finalized on the board, no student may use a word outside their domain's list unless they define it phenomenologically first. If a student says, "This feels *more* significant," Voss rings a bell. The student must rephrase: "This feels *heavier*."

  ## III. Phase 2: The Allocation (25 Minutes)
  **The Task:** Each student must fill their 10-slot tray with a "Life Portfolio." They start with 10 tokens of their own domain. To achieve a "balanced life," they must trade at least 4 tokens with students from *different* domains.

  **The Constraint:** A trade cannot be 1-for-1 based on token count alone. It must be justified using only the Native Vocabularies.
  *   *Student A (Intellectual):* "I will give you two 'tight' proofs for one 'radiating' sun."
  *   *Student B (Thermal):* "I cannot accept. 'Tight' does not cover the surface area of 'radiating'."

  **The Escalation:** At the 15-minute mark, Voss introduces the **Scarcity Shock**. She removes 3 tokens from every tray at random. Students must renegotiate trades to fill the gaps. They are forced to argue why one experience is "worth" filling the void left by another.

  *   *Expected Friction:* Students will attempt to equate "density" of intellect with "duration" of thermal sensation. They will try to create exchange rates (e.g., "One 'elegant' proof equals three 'warm' minutes"). They will fail to agree on the conversion factor because the units measure different dimensions.

  ## IV. Phase 3: The Audit (15 Minutes)
  Students freeze. Voss selects three portfolios that appear "full" and asks the owners to defend the total composition.

  **The Trap:** Voss asks, "Is this portfolio maximized?"
  *   If the student says "Yes," Voss asks, "By what measure?"
  *   If the student says "It feels right," Voss asks, "Does 'right' translate to the Thermal student's 'numb'?"

  **The Collapse:** By the end of this phase, the portfolios should look arbitrary. Students will realize that to defend their allocation, they inevitably used a smuggled metric (e.g., treating "elegance" as a synonym for "amount"). The portfolios are technically full, but conceptually unstable. They have mixed apples, oranges, sounds, and colors, and the tray is merely a container, not a measure.

  ***

  # The Debrief: Mapping the Failure
  **Duration:** 40 Minutes
  **Facilitator Goal:** Do not resolve the tension. Map the linguistic failures onto the philosophical positions.

  ## 1. The Millian Maneuver (Qualitative Hierarchy)
  **Observation:** Watch for students who claim Intellectual pleasures are "denser" or "higher" than Thermal pleasures without claiming they are "more pleasant."
  **Voss's Intervention:** "Notice how Student 3 argued that 'elegance' trumps 'radiation' not because it yields more tokens, but because it occupies a superior *order*. This is Mill's move. He attempts to save hedonism by stratifying the currency. He says some pleasures are of a 'higher kind.' But ask the class: If 'higher' does not mean 'more pleasant,' what does it mean? If it *does* mean 'more pleasant,' have we not just smuggled the quantitative metric back in under a qualitative name?"
  **Philosophical Point:** Mill tries to avoid the heterogeneity problem by ranking kinds. The exercise shows this ranking requires a meta-language that the phenomenology does not support.

  ## 2. The Sidgwickan Introspection (Shared Reflective Access)
  **Observation:** Watch for students who say, "I just know this trade is fair," or "Upon reflection, the proof weighs more."
  **Voss's Intervention:** "Student 7 claims a direct introspective access to the weight of these experiences. This is Sidgwick's assumption: that we can reflectively compare disparate feelings and find a common denominator of 'desirability.' But look at the vocabulary ban. When you were stripped of the word 'more,' did the feeling of 'weight' remain? Or did the 'weight' vanish when the word was banned? Sidgwick assumes the scale exists in the mind. The game suggests the scale exists only in the language."
  **Philosophical Point:** Sidgwick relies on a phenomenological transparency that the activity proves is opaque. We cannot "feel" the conversion rate between a taste and a thought.

  ## 3. Phenomenological Pluralism (Ontological Incommensurability)
  **Observation:** The moment a student says, "I can't trade you this. It's like trading a sound for a color."
  **Voss's Intervention:** "This is the target. Phenomenological Pluralism. It is not that the pleasures are different; it is that they are ontologically distinct. To compare them is a category mistake. Imagine a blind subject trying to compare red and blue by proxy. They can be told the wavelengths, but they cannot experience the *difference* as a difference of magnitude. You are the blind subjects. You are trying to compare spectra by proxy using a vocabulary that doesn't fit."
  **Philosophical Point:** This position argues that the heterogeneity problem is fatal. There is no "pleasure" in the singular. There are only "pleasures," plural and unrelated.

  ## 4. Handling Execution Bias (The Intellectual Dominance)
  **Prediction:** Students with backgrounds in logic or aesthetics will dominate the "Native Vocabulary" phase. They will define "Intellectual" terms with high precision (e.g., "coherent," "axiomatic") while "Thermal" students struggle to describe heat without saying "good" or "warm." The Intellectual portfolio will become the de facto standard currency.
  **Voss's Protocol:**
  *   **Do not equalize the vocabularies.** If Voss helps the Thermal students find "better" words, she resolves the tension. The inequality *is* the point.
  *   **Highlight the Imperialism:** "Notice how the Intellectual vocabulary has become the lingua franca. The Thermal students are translating their sun into 'proofs' to make the trade work. This is the colonization of the phenomenological. Hedonism requires a neutral scale, but in practice, the scale is always biased toward the vocabulary of the classifier."
  *   **The Normative Move:** Voss must explicitly state: "Maximization is a mathematical operation. It requires a common unit (a denominator). You have just spent 40 minutes proving the unit does not exist in the experience. Therefore, if Hedonism demands maximization, and experience denies the common unit, Hedonism must either posit a hidden metaphysical currency (which you cannot feel) or abandon the claim that we can maximize happiness."

  ## 5. Closing the Loop
  Voss ends the seminar without solving the problem. She leaves the portfolios on the desks, unstable and unjustified.

  **Final Instruction:** "Keep your trays. Do not rearrange them. Next week, bring them back. We will discuss whether a moral system can be built on a currency that cannot be counted."

  ***

  # Facilitator Notes: The Conceptual Architecture
  **What the Rules Reproduce:**
  The rules simulate the **impossibility of neutral comparison**. By banning generic comparatives ("more," "better"), the activity removes the "common denominator" that utilitarian calculus assumes exists. The friction students feel when trying to trade a "sharp" intellectual joy for a "soft" thermal comfort is the exact friction of the Heterogeneity Problem. The rules force them to realize that without a generic metric, trade is arbitrary.

  **What the Facilitator Must Supply:**
  The rules create the confusion; Voss must supply the **normative consequence**. Students may leave thinking, "Well, we just need better words." Voss must intervene to clarify that the problem isn't linguistic; it's ontological.
  *   *The Move:* She must articulate that **Maximization requires Commensurability.**
  *   *The Argument:* If you cannot count it, you cannot maximize it. If pleasures are incommensurable, the "Greatest Happiness Principle" is mathematically incoherent.
  *   *The Restraint:* She must not offer a solution (e.g., Preference Utilitarianism). She must let the silence of the unstable portfolio hang in the room. The pedagogical goal is not to teach them *what* to think, but to make them feel the structural collapse of the theory they are studying.
