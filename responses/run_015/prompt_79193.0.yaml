answer: |-
  The ideal of ascriptive universality posits that for a judgment to count as knowledge, its warrant must be reproducible by any suitably situated inquirer. It demands that authority owe nothing to the particular social or historical position of the knower. The dominance objection rightly identifies a danger here: when the "suitably situated inquirer" is modeled on the dominant epistemic agent, this ideal becomes a tool of exclusion. It disqualifies situated knowledge by labeling it idiosyncratic. However, this objection succeeds only against a needlessly strong reading of the ideal. By conflating distinct dimensions of universality, the objection throws out a necessary normative structure along with the hegemonic abuse. A reconstructed version of ascriptive universality survives by relocating universality from the content of the warrant to the form of the challenge.

  To see this, we must distinguish three concepts the dominance objection tends to run together. First, *content universality* holds that a claim is true or valid for everyone. Second, *ascription universality* holds that any inquirer could in principle recognize and reproduce the warrant for the claim. Third, *entitlement universality* holds that everyone is equally entitled to demand that the claim be made good to them on terms they can accept. The strong reading of ascriptive universality collapses entitlement into ascription: it assumes that because everyone is entitled to demand justification, the justification provided must be one everyone could have generated themselves. This is the error. The reconstructed ideal retains entitlement universality while abandoning strong ascription universality. On this view, a claim is universal not because its warrant is standpoint-independent, but because the claimant is bound to make the claim answerable to anyone who presses it, on terms the claimant must supply rather than presuppose. The universality lies in the standing obligation to keep the space of contestation open, not in the standpoint-independence of what is contested.

  The strongest version of the dominance objection anticipates this move. It argues that even the form of the challenge—the demand that a claimant supply terms anyone could take up—is itself a culturally specific genre of reason-giving. To demand accountability is to impose a Western, adversarial structure of justification upon epistemic practices that may rely on trust, tradition, or silence. If the reconstruction demands that the marginalized knower translate their grounds into a public currency, has it not smuggled the original problem back in at a higher level?

  This charge fails because it misunderstands the direction of the obligation. The reconstruction does not demand that the challenger's idiom be the default. It demands that the *claimant* supply terms, but it simultaneously obligates the *challenger* to engage with those terms in good faith. The universality is not a specific language game, but the structural requirement of translatability. If a knower relies on a situated practice, they must be willing to articulate the conditions under which that practice yields reliable results. They need not reduce their knowledge to the challenger's ontology, but they must offer correlates that allow the challenger to track the reliability of the claim. This avoids relativism because sincerity is insufficient; the claim must be made good. It avoids complacent pluralism because the space of contestation remains open; the claim is not immune to scrutiny simply because it is situated. The dominance objection assumes that any demand for articulation is an act of violence. But without the possibility of challenge, there is no knowledge, only dogma. The reconstructed ideal insists that epistemic justice requires the capacity to question, not the imposition of a single answer key.

  Consider a concrete case involving environmental monitoring. A coastal indigenous community asserts that a specific fishery is collapsing based on subtle changes in water texture and bird behavior. State regulators, relying on statistical stock assessments, declare the fishery stable. Under the strong reading of ascriptive universality, the community's warrant is disqualified because the regulators cannot reproduce the knowledge; they lack the generational situatedness to read the water. The community is silenced unless they can produce statistical models, which they cannot. The regulators' view becomes the only "knowledge," masking their institutional position as a neutral standpoint.

  Under the reconstructed ideal, the outcome differs. The community is entitled to demand that their claim be taken seriously (entitlement universality). They are not required to produce statistical models (abandoning strong ascription universality). However, they are obligated to articulate the indicators clearly: "When the water looks like X and the birds behave like Y, the catch drops within Z months." The regulators, in turn, are obligated to treat these indicators as data points to be correlated with their own models, rather than dismissing them as anecdote. The regulators cannot simply assert authority based on institutional status; they must engage with the specific predictive claims of the community. If the regulators' models consistently fail to predict what the community's signs indicate, the regulators' warrant is undermined. The universality here is not that everyone can read the water, but that everyone can demand an account of why the water reading should be trusted or ignored. The space of contestation remains open without requiring the community to cease being situated knowers.

  This reconstruction comes at a cost. It cannot underwrite epistemic authority based solely on institutional deference. In the strong model, an expert can sometimes legitimately say, "Trust me, you cannot understand the warrant." The reconstructed ideal forbids this preemptive closure. It demands that even experts enter the space of contestation and supply terms that non-experts can, in principle, grasp or track. This loses efficiency; it slows down decision-making and strips institutional authority of its automatic weight. Some forms of necessary deference become harder to justify.

  However, giving this up is acceptable because the alternative is epistemic tyranny. When authority rests on the inability of the subordinate to reproduce the warrant, power is insulated from correction. The loss of automatic deference is the price of ensuring that knowledge remains a public resource rather than a proprietary asset of the powerful. The reconstructed ideal sacrifices the comfort of unquestioned expertise to secure the legitimacy of shared inquiry. It acknowledges that while we cannot all stand everywhere, we must all be able to speak to one another. By shifting the locus of universality from the reproducibility of the warrant to the obligatoriness of the answer, we preserve the normative force of knowledge without masking the particularities of power. The view from anywhere is indeed impossible, but the obligation to answer to anyone is not. That obligation is the only universal we can afford.
