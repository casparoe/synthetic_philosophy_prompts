answer: |-
  You are absolutely right that the classical content account is dead; I concede that without hesitation. When you define closeness by tallying logical consequences, you treat every derived claim as equally significant, and yes, that arithmetic forces all false theories into a tie. That definition cannot be repaired, and clinging to it would be dogmatic. But you have only killed a specific measuring stick, not the distance it tried to measure. The mistake was assuming that truthlikeness is a function of what a theory entails rather than a function of how the world described by the theory resembles the actual world. We abandoned the counting of consequences precisely because it ignores the structure of the possibilities themselves.

  On my account, we do not count consequences; we assess the likeness between the state of affairs the theory describes and the actual one. If the truth is that all twenty switches are up, and your theory specifies that nineteen are up, that theory describes a configuration differing from reality in only one respect. A theory specifying only one switch up differs in nineteen respects. The empty theory specifies no switches, so it captures none of the actual configuration's specific structure. Closeness is determined by the number of independent features got right, weighted by their importance, not by the infinite echo of logical implications. So the nineteen-switch theory is objectively closer than the one-switch theory, and both are closer than the theory that says nothing, because the first captures more of the actual structure of the cabinet than the others.
