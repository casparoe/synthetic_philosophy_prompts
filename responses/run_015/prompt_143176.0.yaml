      *   *Claim 2: Calibration Error Analogy.* The idea is that these sensors work *locally* (tribe, immediate cause) but fail *globally* (humanity, cosmic cause).
      *   *Claim 3: Weak Moral Realism.* Because it's a calibration error, not a total fabrication, we can correct it (extend sympathy) rather than debunk it (morality is fake).
