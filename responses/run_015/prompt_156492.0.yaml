      *   *Casual Intent (iv):* People usually mean the Radical version but rely on the Moderate justification.

      *The Threshold Problem:* This is crucial. Hofstadter emphasizes *levels*. A loop exists when symbols refer to the system containing them. If two brains share symbols fast enough, they form one system. If not, they form two. The slogan ignores the *bandwidth* requirement.

