prompt: |-
  So I've been reading some of Schrödinger's later essays where he talks about consciousness being one thing, not split into seperate people, and he keeps bringing up Vedanta like its not just a metaphor but something he actualy believes. There's this argument I keep seeing in forums and even in some old papers - some people say he was genuinely a metaphysical monist, that he literally thought all minds are one mind because of quantum mechanics or whatever. Others say no, he was just using Vedanta language as a poetic way to talk about entanglement or the wave function being shared, not that he actually believed your soul merges with mine. The debate has been going in circles for decades with the same passages being quoted over and over. Nobody moves.

  My hunch is that its not really about what Schrödinger believed, but about what kind of claim 'unity' is - like, is it an empirical claim about brains, a logical claim about identity, or just a spiritual feeling he had? But I might be wrong. Is this stall happening because both sides are actualy answering different questions - one about physics interpretation, one about personal metaphysics - under the same word? Or is there a hidden factual disagreement about whether quantum mechanics forces monism? Or is it just verbal, with 'consciousness' meaning one thing to the physicists and another to the mystics? And if its that kind of mess, what would actualy settle it - finding a lost letter where he explains himself, or some conceptual distinction that splits the two 'unities' apart? I don't need a survey of every interpretation, just a diagnosis of why people can't agree and whether anything could break the deadlock.
