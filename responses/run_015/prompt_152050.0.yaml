answer: |-
  This phenomenon is best identified as **Conceptual Immunization**.

  While often colloquially dismissed as the "No True Scotsman" fallacy, that label is insufficiently precise for normative ethics. "No True Scotsman" typically describes a move to protect a generalization about a *group* (e.g., "No deontologist would do this") by excluding counterexamples from the group's definition. Your description, however, involves protecting a *normative principle* by retroactively shrinking the semantic scope of the act-type it prohibits (e.g., redefining "lying" so that the catastrophic lie falls outside the concept).

  This is structurally identical to what Imre Lakatos and Karl Popper termed an **Immunizing Stratagem** in the philosophy of science: protecting a "hard core" theory from falsification by adjusting the "protective belt" of auxiliary definitions. In ethics, this manifests as **Conceptual Immunization**: the defender preserves the formal absolutism of the rule ("Never X") by altering the definition of X solely to evade the counterexample, without independent conceptual justification.

  I take the definite position that this is **not** a legitimate instance of Reflective Equilibrium, nor is it Threshold Deontology. It is a methodological vice that masks a substantive concession as a conceptual clarification. Below, I defend this identification, distinguish it from nearby alternatives, and provide the boundary conditions necessary to diagnose it in seminar discussion.

  ### 1. Why It Is Not Threshold Deontology
  Threshold deontology is the honest admission that a rule holds *up to a point*, after which consequentialist considerations override it. In a threshold account, the agent admits: "I am breaking the rule against lying, but the disaster is severe enough to justify the violation."

  Conceptual Immunization differs structurally. The defender insists: "I am *not* breaking the rule, because this act is not *really* lying."
  *   **The Difference:** Threshold deontology accepts a conflict of values (Rule vs. Disaster) and resolves it by prioritizing the disaster. Conceptual Immunization denies the conflict exists by defining the disaster scenario out of the rule's domain.
  *   **The Consequence:** Threshold deontology leaves the rule's definition intact for moderate cases. Conceptual Immunization imports the emergency redefinition back into moderate cases, narrowing the rule's practical force permanently while claiming it remains absolute.

  ### 2. Why It Is Not Honest Conceptual Refinement (Reflective Equilibrium)
  Defenders often claim they are simply engaging in **Reflective Equilibrium**—adjusting principles and intuitions until they cohere. They argue that if our intuition says "Don't lie to the murderer at the door," then our definition of "lying" must have been imprecise all along.

  However, Conceptual Immunization is distinguishable from honest refinement by the **Direction of Fit**.
  *   **Honest Refinement:** The definition is adjusted because of *independent conceptual reasons* (e.g., linguistic usage, prior cases, logical consistency) that happen to align with the intuition. The new definition has traction *outside* the catastrophic case.
  *   **Conceptual Immunization:** The definition is adjusted *solely* because the alternative produces a disaster. The "conceptual reason" is invented post-hoc to save the principle.

  ### 3. The Diagnostic Test: Independent Motivation
  To distinguish Conceptual Immunization from legitimate refinement in your seminar, apply the **Independent Motivation Criterion**.

  When a defender redefines a term (e.g., "Lying requires an assertion of fact, and this was a misleading implication") to avoid a catastrophic prohibition, ask:
  > *"Would you have adopted this narrower definition if the stakes were trivial?"*

  *   **If Yes:** It is likely honest refinement. (e.g., "I wouldn't call that a lie even if it were about a cup of coffee.")
  *   **If No:** It is Conceptual Immunization. (e.g., "I would call it a lie in a moderate case, but I can't call it a lie here or else I permit atrocity.")

  If the narrowing of the concept is proportional to the severity of the consequence rather than the conceptual features of the act, it is an Immunizing Stratagem.

  ### 4. Boundary Conditions and Edge Cases
  To use this label precisely, you must distinguish it from two edge cases where the move might be legitimate:

  **A. The "Right-Maker" Distinction**
  Sometimes, a feature that seems irrelevant in moderate cases becomes morally relevant in extreme cases. For example, "consent" might be assumed in moderate medical cases but explicitly revoked in extreme ones. If the defender points to a *new moral feature* present in the catastrophic case (e.g., "The murderer forfeited their right to truth"), this is not Immunization; it is citing a **Defeasibility Condition**.
  *   *Boundary:* Immunization redefines the *act-type* (lying). Legitimate defeasibility cites a *contextual condition* (rights forfeiture) that overrides the rule. If the defender says "This isn't lying," it's Immunization. If they say "This is lying, but the right to truth is absent," it is a Rights-Based Exception (closer to Threshold).

  **B. Vague Concepts**
  If the term is inherently vague (e.g., "harm"), clarification is expected. However, if the clarification consistently moves the boundary *away* from disaster regardless of linguistic fit, it remains Immunization.
  *   *Boundary:* Track the consistency. If the definition shifts back and forth depending on the stakes, it is Immunization. If the definition stabilizes and is applied consistently to low-stakes cases thereafter, it *may* be refinement, provided it passes the Independent Motivation Criterion.

  ### Conclusion
  You should label this move **Conceptual Immunization**.

  It is distinct from Threshold Deontology because it denies the rule is violated rather than admitting it is overridden. It is distinct from Reflective Equilibrium because the conceptual shift is driven by the *cost of the rule* rather than the *content of the concept*.

  By identifying it as Conceptual Immunization, you expose the defender's strategy: they are not clarifying a principle; they are protecting a dogma. They are paying the price of a threshold deontologist (allowing the catastrophic act) while charging the price of an absolutist (claiming the rule remains unbroken). This allows them to have the intuitive plausibility of absolutism in moderate cases while avoiding its intolerable costs in extreme ones, without doing the hard work of justifying where the line is actually drawn. Calling it **Conceptual Immunization** forces them to either defend the new definition on independent grounds or admit they are operating a threshold view in disguise.
