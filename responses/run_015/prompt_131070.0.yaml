answer: |-
  **Scenario**
  A 45-year-old man with dense congenital cataracts undergoes bilateral keratoplasty; pre-operatively, he had light perception only, capable of detecting bright specular highlights and gross motion but no edges or form, during which he spent decades handling a specific matte-black sphere and cube while staring at a lamp, learning to associate the "soft, stationary glow" of the sphere's highlight with its tactile feel and the "sharp, jumping glow" of the cube's edge-highlight with theirs. Post-operatively, in a hospital room with a single point-light source, he sits before the same objects on a white table. In Probe 1, he views the objects through corrected vision while rotating his head 30 degrees left and right (motion parallax). In Probe 2, he views the objects through +15 diopter goggles (simulating his pre-operative scatter/blur) while keeping his head still, observing only the specular highlights on the shiny-coated objects as the light source moves laterally. He must point to the sphere in both probes without touching or receiving verbal feedback.

  **Derivation of Verdicts**
  *   **Probe 1 (Parallax):** The **Amodal-Geometry (AG)** account predicts **success**. Motion parallax provides a rigid geometric constraint (Structure from Motion) that mathematically recovers 3D volume from 2D retinal flow regardless of prior experience; the visual system's innate constraints on rigidity suffice to distinguish the continuous curvature of the sphere from the planar facets of the cube. The **Learned-Correspondence (LC)** account predicts **failure**. Although the subject now has sight, his pre-operative "cloudy" vision lacked the acuity to detect relative feature displacement (parallax); thus, he has no established association between "retinal shear fields" and "tactile volume," and without this specific link, the visual data remains unconnected to the tactile concepts.
  *   **Probe 2 (Blurred Highlights):** The **LC** account predicts **success**. The subject explicitly learned a correlation during his 45 years of cloudy vision: "smoothly gliding highlight = sphere" and "discontinuous/jumping highlight = cube." This association is modality-specific and empirical; since the stimulus matches his training conditions (blurry highlights), he applies the learned rule. The **AG** account predicts **failure**. Under +15 diopter blur, the high-frequency spatial information (the exact edge where the highlight "jumps" on the cube) is convolved into a low-frequency signal. Mathematically, a blurred step-function (cube highlight jump) becomes indistinguishable from a blurred Gaussian (sphere highlight glide) given the noise floor of the visual system; the retinal input is geometrically underdetermined, making 3D recovery impossible even with unlimited computation.

  **Critical Feature and Sensitivity**
  The feature doing the work is **Spatial Frequency Content** (specifically, the presence or absence of high-frequency edge information).
  *   **Remove the feature (Probe 2):** If the +15 diopter goggles are removed, the "jump" of the cube's highlight becomes geometrically distinct from the sphere's "glide." The AG verdict flips to **success** (geometry is now sufficient), while the LC verdict remains **success** (association still holds). The double-dissociation collapses.
  *   **Remove the feature (Probe 1):** If head movement is prevented (static view), the parallax cue vanishes. The AG verdict flips to **failure** (static monocular view of matte objects lacks geometric depth cues), and LC remains **failure** (no association). The dissociation collapses.

  **Reversal Test**
  If the learned pairing in Probe 2 were reversed (e.g., during his pre-operative life, his specific toys were swapped so he learned "jumping highlight = sphere"), the **LC verdict would flip** to failure (he would point to the cube), because his success relies entirely on the specific empirical correlation. The **AG verdict would not change** (still failure), because the geometric ambiguity of the blurred signal is independent of the subject's history; the mathematics of the blur remains the same regardless of which object produced it.

  **Best Objection and Reply**
  *   **Objection (from AG):** Probe 2 changes the question. Molyneux's problem asks if the subject can *see the shape*, not if they can identify the object using a heuristic cue. By relying on a learned highlight dynamic that does not geometrically entail the 3D volume (due to blur), the subject is guessing based on a correlation, not perceiving the shape. Therefore, LC's "success" is illusory.
  *   **Reply (from LC):** The operational definition of "telling which is which by sight alone" is behavioral success using visual input. If the visual system uses learned statistical regularities to map input to object identity, that *is* visual recognition. AG demands a specific *mechanism* (geometric recovery) rather than the *outcome* (identification). If the subject reliably points to the sphere, they have solved the functional problem Molyneux posed, even if they did so via association rather than reconstruction.

  **Conclusion: Settlement or Relocation?**
  This case does not settle the original cube-and-sphere question; it **relocates** it. It shifts the debate from "Can they identify the objects?" (which this case shows depends entirely on the specific visual cues available) to "Which visual cues count as 'seeing shape'?" The original Molyneux problem assumes a binary: either you see the shape or you don't. This case demonstrates that "seeing" is a composite of geometric recovery (AG's domain) and learned cue integration (LC's domain). The question now sits at the boundary of **perceptual phenomenology**: does the subject *experience* the 3D volume in Probe 2, or do they merely infer it? The double-dissociation proves that behavioral success is insufficient to distinguish innate geometric recovery from learned association, meaning the original problem cannot be solved by behavioral data alone without specifying the *informational content* of the visual stimulus.
