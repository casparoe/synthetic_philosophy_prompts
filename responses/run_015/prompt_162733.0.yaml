          *   *Actually, the cleanest fix is to (1).* The phrase "ongoing metabolism" is the culprit. It demands continuous activity. Changing "ongoing metabolism" to "organized for metabolism" fixes the frozen embryo issue without necessarily admitting viruses (which lack the *machinery* for metabolism, not just the activity).

      *   *Let's look closer at (1).* "A thing is alive *just in case* it is a... ongoing metabolism." This is an activity-based definition.
      *   *Let's look at (3).* "They are in liquid nitrogen with no chemical reactions... I do not think that stops them being alive."
      *   *The Fix:* Change (1) from *process* to *state/capacity*.
