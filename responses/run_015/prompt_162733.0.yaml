      *   *Tension D: (3) vs. (4).* Embryos (alive while frozen/inert) vs. Viruses (not alive while inert). Both are inert at certain stages. Why is one alive and the other not? Embryos have potential to self-maintain *once thawed*; Viruses need a host to *do* the maintaining. But while frozen, the embryo isn't self-maintaining *now*.
