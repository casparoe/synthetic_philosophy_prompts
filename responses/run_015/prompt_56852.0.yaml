  **OFFICIAL RULES AND CONDITIONS OF PARTICIPATION**
  **THE FOUNDATION FOR RECURSIVE ALTRUISM**
  **REVIVAL LURING LOTTERY (PROGRAM YEAR 2024)**

  **1. Prize Structure and Dividend Calculation**
  The Grand Prize consists of a fixed sum of $500,000.00 (USD). This sum shall be divided evenly by the total number of Valid Entries received (N). The payout per Valid Entry is calculated as $500,000 / N. Entrants acknowledge that increasing N decreases individual utility, and that maximizing individual utility requires minimizing N through logical correlation with all other entrants.

  **2. Eligibility and Superrational Status**
  Participation is restricted to Superrational Entrants. A Superrational Entrant is defined as an agent whose decision-making process is isomorphic to the decision-making process of all other eligible entrants. Eligibility is voided if the entrant performs any verification check to confirm their superrational status prior to submission, as verification constitutes a causal intervention distinct from superrational deduction. By entering, you certify that you are entering because everyone else is entering, and that you would not enter if everyone else were not entering.

  **3. Entry Method and Justification**
  Each entrant must submit one physical card stating: (a) the number of entries they are submitting; and (b) a written justification for why that number is the unique correct solution to the lottery problem. Entries submitting more than one card must justify the multiplicity without referencing causal advantage. The Foundation reserves the right to reject justifications that rely on expected utility maximization independent of the pool's reasoning structure.

  **4. Causal Decision Theory and Logical Noise**
  Entrants operating under Causal Decision Theory (CDT) are permitted to enter but are classified as Logical Noise. In the event that only one Superrational Entrant submits a valid justification while the pool is diluted by CDT agents, the Superrational Entrant agrees that the dilution is a necessary cost of participating in a causal universe. No claim may be made that the presence of CDT agents renders the lottery irrational, as the lottery is designed to test rationality under suboptimal conditions.

  **5. Timeless Liability and Platonic Waiver**
  Entrant acknowledges that the decision to enter exists timelessly within the realm of Forms (hereinafter "Platonia"). The physical mailing of this card is a ceremonial shadow of a decision already rendered in Platonia and adds no causal value to the structure of the lottery. The Foundation disclaims all liability for discrepancies between the Entrant's physical submission and their timeless Platonic counterpart, including but not limited to instances where the Platonic version of the Entrant entered while the physical version did not, or vice versa.

  **6. Probabilistic Entry and Mixed Strategies**
  Entrants utilizing a mixed strategy (entering with probability *p*) must declare *p* on their card. Payouts for probabilistic entrants will be adjusted to reflect the amplitude of their commitment. Specifically, a probabilistic entry counts as *p* of a Valid Entry for the purpose of dividing the Grand Prize, but the entrant will receive only *p* of the resulting share. Entrants agree that this preserves equilibrium despite the administrative burden of calculating fractional dividends.

  **7. Identity and Isomorphic Copies**
  In the event that two or more physical bodies submit entries derived from identical reasoning processes (Isomorphic Copies), these entries shall be treated as a single Valid Entry split among the bodies. The Foundation does not recognize distinct personhood where logical output is identical. Copies must negotiate the division of their shared share internally; the Foundation will not mediate disputes arising from the fragmentation of a single reasoning agent across multiple biological substrates.

  **8. Modification of Terms**
  The Foundation reserves the right to modify these rules if doing so would result in a more elegant solution to the lottery problem. Entrants consent to rule changes that improve the logical consistency of the contest, even if such changes reduce the expected monetary payout.

  **9. Governing Law and Dispute Resolution**
  These Rules shall be governed by the laws of Logic, specifically the Principle of Non-Contradiction. Any disputes arising from this lottery shall be submitted to the exclusive jurisdiction of the Tribunal of Counterfactuals, convening exclusively in possible worlds where these rules were not required. If the Tribunal cannot convene due to the impossibility of its own premises, the decision of the Foundation's Chief Reasoner shall be final and binding, provided the Chief Reasoner is not currently a participant in the lottery.
