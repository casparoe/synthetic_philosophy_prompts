      *   *Libertarianism Risk:* Libertarianism requires *could have done otherwise* in a metaphysical sense. The notes explicitly say possibilities are "already inscribed." So it doesn't collapse into libertarianism *if* the author holds the line that the branching is *only* subjective/epistemic, not ontological.
