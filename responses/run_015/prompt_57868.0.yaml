      *   *Individual vs. Population:* Heritability applies to variance in a group, not the development of a single individual. (Friend is wrong here).
      *   *Malleability:* High heritability does not mean a trait can't be changed environmentally (e.g., PKU is highly heritable but treatable by diet; height is highly heritable but increased with nutrition). (Friend is wrong here).
      *   *Between-Group Differences:* High within-group heritability tells us nothing about the cause of differences *between* groups. (Lewontin's Fallacy). (User is right here).
      *   *GxE and rGE:* Genes affect sensitivity to environment (GxE) and genes affect exposure to environment (rGE). This complicates the simple additive model.
