      *   *Let's try to construct the Single Principle first.*
      *   *Principle:* **The Sovereign Negligence Threshold.** A famine is a political crime when the sovereign authority possesses the *material or diplomatic capacity* to secure minimum caloric entitlements for its populace but fails to deploy them due to the prioritization of non-survival objectives (ideology, profit, stability, procedure) over human life.
