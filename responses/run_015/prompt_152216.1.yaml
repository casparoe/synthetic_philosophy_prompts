answer: |-
  This is a classic problem in the political economy of hunger. You are correctly intuiting that the "Food Availability Decline" (FAD) theory is dead; you are operating firmly within Amartya Sen's "Entitlement Approach." But Sen tells us *how* famines happen (mapping failure), not necessarily *who* is to blame (moral accounting).

  To move from mechanism to morality, we need to distinguish between a **failure of capacity** (tragedy) and a **failure of priority** (crime).

  Here is the conceptual architecture, tested against your cases, followed by the verdict on your new scenario.

  ### 1. The Pattern Recognition
  Before formalizing, look at the common thread in your "Crime" verdicts (Bengal, Ireland, GLF, Blockade). In every single one, **food existed within the sovereign reach of the state, but the political cost of moving it to the starving was deemed higher than the moral cost of letting them die.**

  *   **Bengal:** Cost of moving rice < Cost of disrupting war logistics/denial policy.
  *   **Ireland:** Cost of stopping exports < Cost of violating laissez-faire ideology.
  *   **GLF:** Cost of feeding peasants < Cost of admitting policy failure/industrial targets.
  *   **Blockade:** Cost of feeding minority < Cost of political suppression.

  In your "Tragedy/Disaster" cases (Hypo 5, Counterfactual Ireland), the state either **lacked the capacity** to move the food (no rails/ports) or **prioritized survival above all else** (democratic mitigation).

  ### 2. The Proposed Principle
  I propose we call this **The Principle of Prioritized Entitlement**.

  > **Definition:** A famine constitutes a **political crime** when the governing authority possesses the *material or diplomatic capacity* to secure minimum food entitlements for a population but fails to deploy them due to the prioritization of *non-survival objectives* (ideology, profit, strategic advantage, bureaucratic procedure) over human life.
  >
  > Conversely, a famine is a **natural disaster/tragedy** when the governing authority lacks the capacity to secure entitlements despite best efforts, or when survival is successfully prioritized above all other objectives.

  **The Three Clauses:**
  1.  **Capacity Clause:** Could the state physically or financially access food? (Rules out Counterfactual Ireland).
  2.  **Knowledge Clause:** Did the state know people were starving? (Rules out genuine ignorance, though rare in modern states).
  3.  **Priority Clause:** Did the state choose *something else* over feeding them? (Rules out Hypo 5).

  ### 3. Auditing Your Verdicts
  Let's run your cases through this architecture.

  *   **1. Bengal 1943:** **Crime.** Capacity existed (Empire-wide grain); Priority was War/Denial.
  *   **2. Ireland 1840s:** **Crime.** Capacity existed (exports continued); Priority was Ideology (Laissez-faire).
  *   **3. Great Leap Forward:** **Crime.** Capacity existed (procurement quotas); Priority was Industrialization/face-saving.
  *   **4. Bangladesh 1974:** **Verdict Strain.** Here is where the principle bites you.
      *   *The Tension:* You call this "mostly political failure." But post-liberation Bangladesh was incredibly weak. Did they have *capacity*? Sen argues the entitlement collapse was due to inflationary policy and lack of labor schemes. If they *could* have printed money for labor schemes but feared inflation more than starvation, that is a **Priority Failure** (Crime). If they were genuinely bankrupt and the international community didn't respond, it is a **Capacity Failure** (Tragedy).
      *   *The Cost:* To keep your "mostly political" verdict, you must accept that the Bangladeshi state had *policy space* it chose not to use. If they were truly helpless, this principle forces you to reclassify it as a Tragedy of Underdevelopment.
  *   **5. Hypo Democracy:** **Not Crime.** Priority was Survival.
  *   **6. Hypo Blockade:** **Crime.** Capacity existed; Priority was Ethnic Suppression.
  *   **Counterfactual Ireland (No Rails):** **Not Crime.** Capacity Clause failed.

  ### 4. The New Case: Modern Climate Failure + Bureaucratic Inertia
  *Scenario:* Middle-income country, funds available, climate crop failure, 6-month aid delay due to inertia (not malice).

  **Application of the Principle:**
  *   **Capacity:** Yes (Middle-income, funds exist).
  *   **Knowledge:** Yes (Crop failure is visible).
  *   **Priority:** This is the crux. Is "bureaucratic procedure" a *non-survival objective*?
      *   If the bureaucracy follows rules *knowing* people will die rather than bypassing red tape, they are prioritizing **Institutional Order** over **Human Life**.
      *   Under the Principle of Prioritized Entitlement, this is a **Political Crime (Negligent)**.

  **Why?** Because "inertia" in the face of starvation is not a neutral force; it is a political choice to maintain the status quo of administration at the expense of the vulnerable. In legal philosophy, this is *reckless disregard*. In political philosophy, it is **Structural Violence**. The state has the power to save lives but structures itself in a way that makes saving lives difficult. That is a crime of omission.

  **Verdict:** **Crime.** (Specifically: Criminal Negligence).

  ### 5. The Fork in the Road (If you reject the Inertia Verdict)
  If your gut recoils at calling bureaucratic inertia a "crime" (perhaps you feel "crime" requires active malice or explicit ideology), then the single principle above is too sharp for you. You have to choose between two competing frameworks. You cannot have both.

  #### Candidate A: The "Intent & Ideology" Framework
  *   **Definition:** A famine is only a **crime** if the state *actively* uses hunger as a tool (blockade, extraction) or explicitly chooses an ideology known to cause death (Laissez-faire during blight). Incompetence, inertia, and weakness are **tragedies**.
  *   **What it saves:** It saves your intuition that the "Inertia Case" is *not* a crime (it's just incompetence). It saves the "Counterfactual Ireland" as a tragedy.
  *   **What it costs you:** It forces you to reclassify **Bengal 1943** and **Ireland 1840s** as "Tragedies of Ideology" rather than Crimes. It dilutes the moral weight of negligence. It lets modern bureaucrats off the hook for "accidental" starvation. It makes "Crime" very hard to prove.

  #### Candidate B: The "Sovereign Responsibility" Framework (My Recommendation)
  *   **Definition:** The State holds a monopoly on violence and resource mobilization. Therefore, **any** mass starvation under a sovereign government is a **political failure**. The distinction is only between *Malice* (GLF, Blockade) and *Negligence* (Inertia, Bangladesh). Both are "Crimes" against the social contract, just different degrees.
  *   **What it saves:** It captures the moral urgency of Sen. It classifies the "Inertia Case" correctly as a violation of rights. It keeps Bengal and Ireland as Crimes.
  *   **What it costs you:** You must accept that **weak states** (like 1974 Bangladesh) are "criminal" if they fail, even if they are trying. It places a massive burden on underdeveloped nations. It blurs the line between "disaster" and "crime" until almost all famines are crimes.

  ### Final Recommendation
  Stick with **Candidate B (Sovereign Responsibility)** but refine the language. Don't get hung up on the word "Crime" if it implies a courtroom. Think in terms of **Political Culpability**.

  Your intuition about "Structural Food Opacity" is excellent. It suggests that when a system is designed such that food *can* move but *doesn't* without a heroic political fight, the system itself is the criminal.

  **To answer your specific question on the Inertia Case:**
  If you want to be philosophically consistent with your verdicts on Ireland and Bengal, **you must call the Inertia Case a crime.** The difference between "Ideological Commitment to Laissez-Faire" (Ireland) and "Bureaucratic Commitment to Procedure" (Inertia) is one of degree, not kind. Both prioritize the *system* over the *starving*.

  **The One Verdict You Might Have to Drop:**
  You may have to soften the **Bangladesh 1974** verdict. If you apply the "Capacity Clause" strictly, a post-war shattered state might fail the capacity test, making it a Tragedy rather than a Crime. If you keep it as a Crime, you are arguing they had policy space they refused to use. Be prepared to defend that specific empirical claim.

  **The Architecture Summary:**
  1.  **Famine is never natural.** (Nature provides the shock; politics provides the starvation).
  2.  **Culpability is determined by Priority.** (Did the state prioritize Order/Profit/Ideology over Life?).
  3.  **Inertia is a Priority.** (Choosing procedure over emergency action is a choice).

  This keeps your architecture rigid enough to hold weight, but flexible enough to distinguish between a blockade and a bottleneck.
