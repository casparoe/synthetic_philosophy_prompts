      *   *Decision:* I think I can make *one* principle work if I define "Capacity" broadly to include "Political Will to Mobilize." But the user asked for honesty if I have to drop a verdict.
      *   *Actually, looking closer:* The User's Bangladesh verdict is the weak link. 1974 Bangladesh was incredibly weak. Calling it "mostly political failure" requires a high bar for state capacity. I should challenge that gently.
      *   *Better approach:* Offer the **Principle of Political Prioritization**. Then show how it handles the "Inertia" case. Then offer the **Alternative: The Entitlement Violation Framework** if they want to focus less on intent and more on rights.

