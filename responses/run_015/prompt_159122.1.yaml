answer: |-
  Here are eight interview questions designed to pin down Miriam Ashgrove's reconstruction of Chesterton's Fence, followed by the summary table.

  ### 1. The Asymmetry of Burden
  **(a) Spoken:** "You argue the reformer owes the explanation, not the preserver. But is 'existing' doing moral work here, or just causal? Why doesn't the preserver owe an account of why the pain the practice causes is worth the stability it buys?"
  **(b) Likely Answer:** "Because the practice is already paid for in coordination costs. The baseline isn't moral perfection, it's social functioning. Asking the preserver to justify the status quo assumes we can step outside the system to judge it, which we can't."
  **(c) Follow-up:** "So if we can't step outside to judge it, how do you distinguish between a 'functioning system' and a 'successful tyranny'? Isn't that distinction exactly what requires stepping outside?"

  ### 2. Ignorance vs. Irreversibility
  **(a) Spoken:** "If this is really about irreversibility and option value, isn't it just standard consequentialism? Where does the distinctively Burkean reverence for the past enter, if a reversible fence should come down immediately?"
  **(b) Likely Answer:** "The Burkean insight is that almost *nothing* social is truly reversible. Consequentialists assume we can put Humpty Dumpty back together; I'm arguing the option value of the old way is almost always higher than the projected value of the new."
  **(c) Follow-up:** "But that's an empirical claim, not a philosophical one. If I show you a reversible fence—say, a tax rate changed annually—does your principle lose its grip? If so, isn't it just a risk assessment tool, not a moral rule?"

  ### 3. The Self-Stultification Problem
  **(a) Spoken:** "We often only learn what a part does by removing it. If your rule forbids removal until we understand the function, doesn't it forbid the only test that could give us that understanding?"
  **(b) Likely Answer:** "Not removal, but *modulation*. We use federalism or pilot programs to ablate on the margin without bringing down the whole structure. That's how we learn without gambling the farm."
  **(c) Follow-up:** "But isn't 'experiment first' exactly the rationalist planning Burkeans distrust? If you need a controlled trial to validate the tradition, haven't you already made reason the master rather than the servant of custom?"

  ### 4. Functionalism and Power
  **(a) Spoken:** "Your view assumes the fence is there for a function. But what if it's there for power, like enclosure or hierarchy? Do those count as 'load-bearing' knowledge we must preserve until replaced?"
  **(b) Likely Answer:** "We have to distinguish between *functional* load-bearing and *coercive* load-bearing. If a practice exists solely to extract rent, it fails the test. But we must be sure it's extraction before we tear it down."
  **(c) Follow-up:** "Who makes that distinction without triggering the ignorance problem? If the knowledge is tacit, maybe the 'extraction' is actually a 'fee for service' we just don't see yet."

  ### 5. Fragile vs. Self-Fulfilling Equilibria
  **(a) Spoken:** "Some institutions survive only because we expect them to. How do you distinguish a 'wise tacit equilibrium' from a 'fragile bad equilibrium' before you try to break it?"
  **(b) Likely Answer:** "Look for signs of organic growth versus top-down imposition. Organic practices have survived selection pressures; imposed ones haven't been tested by time in the same way."
  **(c) Follow-up:** "But many imposed practices become organic over generations. If a fence was built by a tyrant in 1800 but is now woven into the community's life, does the origin story still matter, or does the current integration matter?"

  ### 6. The Epistemology of Tacit Knowledge
  **(a) Spoken:** "If the knowledge is truly tacit and dispersed, no interview will surface it. So aren't we back to removal being the only way to verify your claim that the knowledge exists?"
  **(b) Likely Answer:** "We verify it through ethnography and long observation of practitioners, not interviews. You watch what people *do*, not what they *say*. That reveals the logic without ablation."
  **(c) Follow-up:** "How long is 'long enough'? Is there a threshold where 'not knowing' becomes 'negligence'? Because if the timeline is indefinite, the rule becomes a veto, not a check."

  ### 7. Self-Application
  **(a) Spoken:** "Is Chesterton's Fence itself an inherited practice? If so, what function does *it* serve, and who grades whether we understand that function before we apply it?"
  **(b) Likely Answer:** "It's a heuristic derived from historical observation, not a practice itself. It's the tool we use to evaluate practices, so it doesn't need to pass its own test."
  **(c) Follow-up:** "But if it's derived from reason and history, why can't other reforms be derived from reason and history? Why is *this* heuristic privileged over a heuristic of 'maximize liberty' or 'minimize suffering'?"

  ### 8. The Error Tally and Democratic Objection
  **(a) Spoken:** "Can you name a specific reform this principle would have blocked that actually went fine? And why do the dead get a veto on the living, especially if the practice was imposed on them?"
  **(b) Likely Answer:** "The rapid collectivization in the Soviet Union or the French Revolution's de-Christianization. As for the dead, it's not a veto, it's a partnership. We inherit a world they built; ignoring their choices is arrogance."
  **(c) Follow-up:** "Those are catastrophic extremes. What about mundane policy? And if the 'partnership' includes people who were *subjects* of that inheritance rather than *partners* in it, doesn't the partnership model break down?"

  ***

  ### Interview Strategy Table

  | q_number | probes | likely_escape_route | how_hard_to_close | deflection_line |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | Moral vs. Causal Baseline | Shift to "coordination costs" as a moral good. | 2 | "Coordination costs explain *why* it's there, not why it *should* stay." |
  | 2 | Consequentialist Reduction | Claim social reversibility is practically zero. | 2 | "If it's practically zero, prove it without using hindsight." |
  | 3 | Epistemic Catch-22 | Retreat to "marginal experimentation." | 3 | "Marginal experimentation *is* rationalist planning; you can't have both." |
  | 4 | Unjust Functionality | Distinguish "function" from "coercion." | 2 | "If we can't see the function, we can't reliably see the coercion either." |
  | 5 | Equilibrium Identification | Appeal to "organic vs. imposed" origins. | 2 | "Time washes out origins; today's imposition is tomorrow's tradition." |
  | 6 | Tacit Verification | Shift from interviews to "observation." | 3 | "Observation without a timeline is just procrastination." |
  | 7 | Meta-Consistency | Claim the principle is a "tool," not a "practice." | 3 | "If reason built the tool, reason can build other tools." |
  | 8 | Falsifiability & Legacy | Cite extreme historical failures; romanticize inheritance. | 1 | "I'm asking about normal politics, not revolutions, and about subjects, not partners." |
