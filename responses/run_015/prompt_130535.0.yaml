answer: |-
  ### Candidate Mechanics

  1.  **The "Blind Accountant" vs. "Named Ledger":** One student (the Accountant) sees only total chip counts and recommends a move; the rest see who loses/gains and vote. *Verdict:* Discard. This isolates "information" rather than "structure," and risks making the Accountant a scapegoat rather than highlighting the structural difference between one person and many.
  2.  **The "Signature Veto" Rule:** A transfer of harm-chips requires every affected student's signature; if one refuses, the benefit vanishes. *Verdict:* Discard. While powerful for rights, it mechanically *blocks* aggregation rather than letting students feel the tension of wanting to aggregate but hesitating; it solves the problem too neatly for the simulation.
  3.  **The "Serial vs. Distributed" Mirror:** Run two scenarios with identical arithmetic: one where many people pay a small cost for one person's gain, and one where one person pays the total cost for their own gain. *Verdict:* **Select.** This directly targets the "separateness of persons" objection by forcing a comparison between intra-personal trade-offs (intuitively acceptable) and inter-personal trade-offs (intuitively suspect) without changing the math.

  ---

  ### Activity Specification: "The Chip Mirror"

  **Goal:** Students will experience the intuitive resistance to summing harms across different people, even when the total math matches a trade-off they accept within a single life.
  **Materials:**
  *   14 Index cards (numbered 1–14).
  *   200 Poker Chips (150 Red, 50 Blue). *Note: Red = "Effort/Cost", Blue = "Reward/Benefit".*
  *   1 Shoe box (for ballots).
  *   1 Phone timer.
  *   14 "Decision Sheets" (half-sheet index cards with prompts).
  *   Whiteboard & Marker.

  **Roles (Assigned via Drawn Index Cards):**
  *   **The Verifier (1 student):** The articulate consequentialist. *Private Instruction:* "Your job is to check the arithmetic only. Confirm the totals are correct. Do not argue for the outcome; just verify the math."
  *   **The Beneficiary (1 student):** Receives the Blue chips.
  *   **The Contributors (12 students):** Pay the Red chips.
  *   **The Facilitator (You).**

  **Setup (0:00–0:10):**
  1.  Distribute index cards face down. Students sit in a circle.
  2.  Explain the chip economy: "Red chips represent effort or annoyance. Blue chips represent rewards or free time. Neither is money. We are simulating choices about effort and reward."
  3.  Give the Verifier a calculator and a "Math Sheet" showing the totals for both rounds (kept hidden from others).
  4.  **Crucial Framing:** "We are testing two different club policies. Do not assume they are related."

  **Round 1: The Distributed Cost (0:10–0:30)**
  *   **Scenario:** "Policy A: The Club decides to fund a special reward for Student #1 (The Beneficiary). To do this, every other student (Contributors) must surrender 5 Red chips each."
  *   **The Math (Verifier confirms):** 12 Contributors × 5 Red = 60 Red Cost. Beneficiary gets 100 Blue. (Net "value" is positive if 1 Blue > 1 Red, which you assert).
  *   **Action:**
      1.  Contributors receive 5 Red chips each. Beneficiary holds an empty cup.
      2.  **Secret Ballot:** Contributors receive a Decision Sheet. Prompt: *"Vote YES to transfer your chips. Vote NO to keep them. You do not need to write your name."*
      3.  Collect ballots in the shoe box.
      4.  Tally publicly. If Majority YES: Contributors hand over chips. Beneficiary gets 100 Blue. If Majority NO: Chips stay, no reward.
  *   **Recording:** On the back of their sheet, students write one sentence: *"The main reason for my vote was…"*

  **Round 2: The Serial Cost (0:30–0:45)**
  *   **Scenario:** "Policy B: A single volunteer is offered a deal. They must perform 12 small tasks (costing 5 Red chips each, total 60) to earn one large reward (100 Blue)."
  *   **Selection:** Ask for a volunteer *other than* the Round 1 Beneficiary. (If no volunteer, you simulate it hypothetically, but a volunteer is better).
  *   **Action:**
      1.  The Volunteer holds 60 Red chips.
      2.  **Individual Decision:** The Volunteer decides privately (write Yes/No on a card).
      3.  **Group Prediction:** While the Volunteer decides, the rest of the group fills out a Prediction Sheet: *"Would you take this deal? Why/Why not?"*
  *   **Recording:** Volunteers write: *"I accepted/rejected because…"*

  **The Reveal & Small Group Discussion (0:45–0:55)**
  1.  Ask the Verifier to read the totals for Round 1 and Round 2 aloud. (60 Cost, 100 Gain in both).
  2.  Break into pairs (one from Round 1 Contributors, one from Round 2 Predictors).
  3.  **Task:** "Compare your Decision Sheets. The math is identical. Did anyone feel differently about the two scenarios? Why?"
  4.  Collect key phrases on the whiteboard (e.g., "It's not fair to ask everyone," "One person choosing is different," "I don't want to be forced").

  **Large Group Debrief (0:55–1:10)**
  1.  **Phase 1 (Their Words):** Read the board. Ask: "Who felt a tension between the math and their gut?"
  2.  **Phase 2 (The Mechanism):** "In Round 2, the costs landed in one life. In Round 1, they landed across many lives. The math didn't change. What changed?"
  3.  **Phase 3 (The Terminology):** Only now introduce the concept: "Philosophers call this the **Separateness of Persons**. Some theories treat society like one big person, adding up pains and gains. Others say you can't just add across people because *you* are not *me*."
  4.  **Phase 4 (The Limit):** "Does feeling it's wrong make it wrong? What if we all agreed to Policy A at the start of the year?" (Leave this question hanging).

  ---

  ### Recording Sheet Wording

  **Front:**
  *   **Round:** [ 1 / 2 ]
  *   **Decision:** [ YES / NO ]
  *   **Confidence:** [ 1 — 5 ]

  **Back:**
  *   **Prompt:** "Complete this sentence: The most important thing about this choice was…"
  *   **Prompt:** "Did the number of people paying the cost matter? [ Yes / No ]"

  ---

  ### Anticipated Failures & Mitigations

  1.  **The Vocal Consequentialist Spoiling It:**
      *   *Risk:* They argue during Round 1 that "60 < 100, so obviously yes."
      *   *Fix:* The **Verifier Role**. Give them status and a job (checking math) but a gag order on ethics. "Your job is to be the calculator, not the judge. If you argue ethics, you invalidate the math check."
  2.  **Herding / Peer Pressure:**
      *   *Risk:* Students look around before voting.
      *   *Fix:* **Secret Ballot** in a shoe box. Emphasize anonymity: "These will be shredded after the count."
  3.  **Chips Treated as Currency:**
      *   *Risk:* Students try to "spend" chips or trade them later.
      *   *Fix:* Explicit framing: "These are effort tokens. They vanish at the end. They have no value outside this room."
  4.  **Arithmetic Errors:**
      *   *Risk:* Students catch a math error and dismiss the lesson.
      *   *Fix:* Pre-count the chips. Give the Verifier the answer key. Double-check 12 × 5 = 60 vs 100 before starting.
  5.  **Refusal to Play:**
      *   *Risk:* A student says "This is stupid" and opts out.
      *   *Fix:* Allow them to be the "Observer." They still fill out the Prediction Sheet. Their skepticism is data for the debrief ("Why did you opt out?").

  ---

  ### What to Cut If Running Short (15 Minutes)
  *   **Cut the Small Group Discussion (0:45–0:55).** Move straight to the Large Group Debrief. Ask pairs to share out immediately.
  *   **Simplify Round 2:** Instead of a volunteer, make Round 2 a hypothetical question on the Decision Sheet ("If you alone had to pay 60 for 100, would you?"). This saves 5 minutes but loses some visceral impact.

  ---

  ### Limitations: What This Activity Cannot Prove
  You must state these plainly in the debrief so students don't overclaim:
  1.  **Psychology vs. Moral Fact:** "This game shows that aggregation *feels* wrong to you. It does not prove that it *is* wrong. A consequentialist can say your feeling is just a bias, like being scared of flying but not driving."
  2.  **The Ex-Ante Agreement Objection:** "One student might say: 'But if we all agreed to Policy A at the start of the year, it would be fair.' This game doesn't test that. It only tests the moment of transfer. We cannot answer today whether prior consent fixes the problem."
  3.  **Intensity of Harm:** "We used chips. Real pain might change the math. This simulation works best for 'annoyances' and 'benefits,' not deep rights violations."

  ---

  ### Final Exit Ticket
  On the way out, every student must tell you one sentence answering this prompt:
  **"Why might adding up happiness across different people be different than adding it up in one life?"**
