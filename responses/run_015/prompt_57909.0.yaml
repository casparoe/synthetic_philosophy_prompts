answer: |-
  First off: **This is not dumb.** You have independently rediscovered one of the most famous, stubborn, and debated problems in the philosophy of science. It is literally called **"The Problem of Old Evidence."**

  It was formalized by Clark Glymour in the 1980s, using the *exact* example you used: Einstein and Mercury's orbit.

  You are mathematically correct: if you treat Bayesian conditionalization strictly, and your credence in the evidence $P(E)$ is already 1, then learning a hypothesis $H$ that entails $E$ provides **zero** confirmation.
  $$P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)}$$
  If $P(E) = 1$ and $P(E|H) = 1$, then $P(H|E) = P(H)$. The probability doesn't budge.

  So, is Bayesianism broken? **No.** But your intuition is highlighting that the *simple version* of Bayesianism assumes something humans can't do: **Logical Omniscience.**

  Here is how Bayesians resolve this, and why your sourdough model is actually fine.

  ### 1. The Culprit: Logical Omniscience
  Standard Bayesianism assumes that you instantly know all the logical consequences of your beliefs. If you believe $H$, you should immediately know that $H$ implies $E$.

  But humans aren't like that.
  *   **1914:** You know Mercury wobbles ($E$). You don't know General Relativity ($H$).
  *   **1915:** Einstein proposes $H$.
  *   **The Update:** You don't learn $E$ (you knew that). You learn the **logical connection**: *"Oh wow, $H$ actually explains $E$."*

  The Bayesian fix is to say you aren't conditionalizing on $E$ (the wobble). You are conditionalizing on the proposition **"H entails E."**
  Before Einstein, you might have thought, "If there is a theory of gravity, it probably won't match Mercury's weird wobble." When you learn that $H$ *does* match it, your confidence in $H$ goes up, because the space of theories that fit that specific wobble is very small.

  ### 2. The "Ur-Prior" (Counterfactual) Fix
  This is the most intuitive fix for your sourdough problem.

  When you look at your old thermometer readings, you shouldn't ask: *"Given that I already know these readings, how much does this support my rule?"*
  You should ask: **"If I *hadn't* known these readings beforehand, how surprised would I have been by them, and how much would this rule have reduced that surprise?"**

  You reconstruct a "counterfactual" prior. You pretend, for the sake of calculation, that you didn't know the old data.
  *   **Scenario A:** You have a random timing rule. The chance it fits your old data perfectly is low.
  *   **Scenario B:** You have the *correct* physics/biology rule. The chance it fits the data is high.

  Because the rule made the old data "inevitable" (or highly probable), it gets credit, even if you knew the data beforehand. The support comes from the **rarity of the fit**, not the novelty of the data.

  ### 3. Application to Your Sourdough
  Let's look at your starter model.
  *   **Old Evidence:** Thermometer readings from last month.
  *   **New Hypothesis:** "The starter doubles in volume 4 hours after feeding at 75°F."

  If you just made up a rule *after* looking at the data to fit the points, that's **overfitting** (or curve-fitting). In that case, your intuition is right: it shouldn't count as strong evidence. Any random polynomial can fit old data points if you tweak it enough.

  **However**, if your rule was derived from biological principles (yeast metabolism rates) *independently* of the specific thermometer numbers, and then you checked it against the old notebook and it matched? **That counts.**

  Why? Because there are infinite timing rules that *don't* match your old notebook. The fact that your specific rule landed on the one that *does* match is informative.

  ### 4. So, is Bayesianism Broken?
  It's not broken, but it is **idealized**.
  *   **Strict Bayes:** Assumes you know all logical truths instantly. (Fails on Old Evidence).
  *   **Real-World Bayes:** Acknowledges that learning a *relationship* between theory and data is an update in itself.

  Scientists generally agree that **prediction** (new evidence) is stronger than **accommodation** (old evidence), but accommodation still counts for *something*. If General Relativity hadn't matched Mercury's orbit, it would have been falsified immediately. The fact that it survived the "old evidence" test was necessary, even if it wasn't as thrilling as predicting the bending of starlight (which was *new* evidence).

  ### Summary
  You aren't missing anything basic. You hit a wall that professional philosophers of science still write papers about.

  1.  **Your math is right:** Strict conditionalization on known evidence yields zero support.
  2.  **The solution:** You aren't updating on the *evidence*; you are updating on the *explanatory link* between hypothesis and evidence.
  3.  **The Sourdough:** Your old data supports your rule if the rule was constrained by theory, not just tweaked to fit the data. The "support" comes from the fact that most wrong rules would have failed to fit that old data.

  Don't throw out Bayesianism. Just acknowledge that human learning involves discovering logical connections, not just receiving new sensory data.
