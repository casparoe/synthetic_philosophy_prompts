prompt: |-
  I'm running a philosophy-of-mind workshop for about 14 grad students and some philosophy-curious engineers, 75 minutes, one room with movable chairs. I want them to physically feel why it's so hard to say an ant colony has "one mind" without smuggling in a hidden controller, and also feel the opposite pull — that treating it as just a bag of ants misses something real about the coordination. So I want a live simulation/game, not a lecture, but with a twist that isn't in any standard textbook. Let's call it the "Aunt Hillary Partition": we'll stage a colony that has to maintain a rhythmic "fugue" pattern — a repeating sequence of token-moves that looks intentional — but there's one designated node, Aunt Hillary, who is physically separated fom the pheromone trail and gets her instructions only through delayed echoes. The paticipants split into Core (6 people), Periphery (6 people), and Aunt Hillary (2 people sharing the role). Core and Periphery draw hidden local-rule envelopes and move tokens on a grid; they can't talk across groups. Only Aunt Hillary can talk, but she doesn't know the rules — she just hears reports after each round. Their collective task is to keep the fugue alive for 20 minutes, but each person also has a hidden individual payoff card (e.g. one Core member wants north density up, one Periphery wants it down). The rules and point scheme should make the conflict visceral — they should blame Hillary, then realize the Core was just following envelopes, then notice the fugue kept going despite an error — all before anyone names "collective intentionality" or "superorganism."

  Please include a debrief that maps those exact moments onto parts of the debate, say what will predictably go wrong the first run (probably they try to elect a leader or vote on rules), and be frank about which feature of colony-mindhood the activity just can't reproduce — probably the lack of phenomenal experience, which I'll have to supply verbally. Don't ask for bibliographies or citations; they won't have web access in the session and neither will a small model trying to answer this. Structure your response like this:

  1. The Setup and Roles (around 200 words)
  2. Rules, Materials, and Point Scheme (around 250 words)
  3. Timeline and Running Notes (around 150 words)
  4. The Debrief: Mapping Moments to Ideas (around 250 words)
  5. Predictable Failures and Fixes (around 150 words)
  6. The Honest Gap (around 100 words)
