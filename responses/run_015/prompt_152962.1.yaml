  1. The Setup and Roles
  Arrange chairs in three distinct zones to enforce epistemic boundaries. The Center Grid (Core, 6 players) manipulates tokens on a 5x5 floor matrix. The Outer Ring (Periphery, 6 players) feeds tokens into the grid edges but cannot touch the center. Aunt Hillary (2 players sharing one role) sits back-to-back in an isolated corner, blind to the grid. They share a voice but must agree on instructions, simulating a fragmented controller. Core and Periphery receive sealed envelopes containing rigid local movement rules (e.g., "If red token left, move right"). They are strictly forbidden from speaking or signaling across zones. Hillary receives written status reports from a facilitator with a mandatory 2-round delay. Their collective goal: sustain a "fugue" (a specific repeating color pattern on the grid) for 20 minutes. The physical separation enforces the partition: Hillary represents the illusion of central command, while the workers represent the mechanistic base. Observers track breaches and timing. This ensures the remaining participants act as auditors, ensuring no covert signaling occurs during the simulation. This spatial layout makes the information bottleneck visceral, forcing the group to experience the lag between command and reality.

  2. Rules, Materials, and Point Scheme
  Materials: 25 colored tokens, 14 rule envelopes, 14 payoff cards, grid tape, timer, status slips.
  Rules: Core and Periphery move tokens simultaneously on a beep every 60 seconds. Rules are strictly local (e.g., "If token left is Red, move Right"). Hillary issues global commands ("Shift North"), but workers must prioritize their envelopes if commands conflict. Hillary receives written status reports from a facilitator with a mandatory 2-round delay; she sees Round 3 data only at Round 5.
  Payoff: Hidden individual cards create conflict. One Core player gains points for "North Density," another for "South Spread." Hillary gains points only if the Fugue Pattern holds continuously.
  Twist: At minute 10, the facilitator swaps one Core player's envelope with a contradictory rule silently.
  Scoring: Group wins if Fugue persists 20 mins. Individuals win if personal payoff met. This pits collective stability against individual incentive. Hillary will try to optimize the pattern, but workers optimize personal points via local rules. The delay ensures Hillary's commands are always outdated, making her control illusory. The conflicting payoffs ensure the system isn't perfectly harmonious, mirroring biological conflict within colonies. Workers should feel frustration when Hillary's orders break their local rule chains. Hillary should feel helplessness as her orders arrive too late. The Fugue Pattern is a specific sequence (e.g., Red-Blue-Green spiral) written only on Hillary's sheet, unknown to workers. This ensures the pattern emerges solely from local interactions, not top-down design. The point scheme ensures that even if the group fails, individuals might succeed, fracturing the notion of a unified "will."

  3. Timeline and Running Notes
  0-10 min: Setup and rule distribution. Emphasize silence. Explain payoff cards privately.
  10-30 min: Game run. Facilitator enforces delays strictly. Introduce the envelope swap at minute 20 (10 mins into game).
  30-75 min: Debrief.
  Running Notes: Watch for Hillary trying to stand up. Watch Core players trying to signal. Note when the Fugue breaks vs. when it repairs itself.
  If the Fugue dies too early, restart with simpler rules. If Hillary dominates, increase delay to 3 rounds. The facilitator must remain neutral, acting only as the "physics" of the system, delivering delays and swaps without commentary. Ask observers to note who blames whom when the rhythm stutters. The swap should cause a local glitch that either propagates or gets absorbed; this absorption is the key teaching moment.

  4. The Debrief: Mapping Moments to Ideas
  Start with the blame game. When the pattern breaks, players will accuse Hillary of bad commands. This maps to the Homunculus Fallacy—assuming a little person inside the head is doing the thinking. Participants naturally seek a locus of control.
  Next, reveal the envelopes. Workers show they followed local rules blindly. This maps to Mechanism/Eliminativism—no mind, just physics. The workers were merely causal cogs.
  Finally, highlight the repair. The pattern survived the swap without Hillary's help. This maps to Emergence/Supervenience—the mind is the pattern, not the controller. The system self-corrected through local feedback loops, not central intervention.
  Discuss the conflicting payoffs. The colony succeeded despite individual selfishness. This challenges the need for unified intent. The "will" was distributed across the friction of competing goals.
  Ask: "Where was the mind?" If not in Hillary, and not in single ants, it must be in the relational structure. This leads to collective intentionality without a central subject. Avoid jargon until now. Let them sit with the discomfort of a mind without an owner. Connect this to Hofstadter's "Aunt Hillary"—the colony is intelligent, but the intelligence is a phantom generated by the loop. The debrief must pivot from "who failed" to "what succeeded despite the failure." Ask the engineers: "Could you debug this mind?" Ask the philosophers: "Does the pain of failure belong to the group?" This splits the ontological question from the functional one. Use their frustration as data.

  5. Predictable Failures and Fixes
  Failure 1: Participants break silence.
  Fix: Facilitator acts as a hard barrier, confiscating tokens if rules are breached.
  Failure 2: Hillary figures out the rules and micromanages.
  Fix: Increase delay or obscure reports (e.g., give aggregate data only).
  Failure 3: The Fugue is too hard and dies immediately.
  Fix: Have a backup "simple mode" pattern ready.
  Failure 4: Players vote to ignore envelopes.
  Fix: Remind them individual payoff depends on envelope compliance, not group success.
  The goal is to keep the tension high. If they cooperate too well, the lesson is lost. The friction is the data.
  Enforce metronome timing strictly to prevent signaling via speed. If Hillary becomes too passive, prompt her with "You are losing points" to activate her agency. The envelope swap often causes confusion where players blame each other; let this happen. Do not intervene until the debrief. The frustration is necessary to simulate the breakdown of folk-psychological explanations.

  6. The Honest Gap
