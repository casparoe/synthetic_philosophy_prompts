      *   *Refining the Scale Separation point:* The user asks if it's a genuine desideratum. I need to be honest. In standard Social Choice Theory (SCT), it's not standard. But in *institutional* design, it is. I should validate it as a structural requirement rather than an axiomatic one.
      *   *Refining the "Camp Preferences":* Make sure the distinction between Welfare Economists (Pareto is king) and Rights Absolutists (Liberty is king) is clear.

