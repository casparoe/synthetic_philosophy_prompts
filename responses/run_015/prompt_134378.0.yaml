      *(Self-Correction on (3)):* Is (3) actually in tension with (1)? (1) says "absence of coercion". (3) defines what counts as coercion. If (3) is a *specification* of (1), there is no tension. However, in contemporary philosophy (e.g., Wertheimer, Alexander), "indirect threats" can be coercive. So the tension is between the *common philosophical usage* of (1) and the *specific stipulation* of (3). I should frame this as a tension between the intuitive moral weight of (1) and the restrictive definition in (3).

