prompt: |-
  I run the claims desk at a medical news service. Several times a week a heritability figure arrives inside something else — a journal press release, a conference abstract, a direct-to-consumer genetics company's launch material, a clinic leaflet, or a reporter's question about whether a sentence is safe to print. What I need is not a primer on what heritability means but a decision procedure my reviewers can actually run: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the remaining question is one of values rather than facts.

  Reviewer constraints: about fifteen minutes per claim; one applied statistics course; no quantitative geneticist on call; output is a written ruling in one of four forms — stop, pass with a mandatory translation clause, pass, or escalate to me — plus, wherever the ruling is stop or pass-with-clause, one sentence saying what the number does not license. Rulings are signed off by me, and anything touching clinical advice by our clinical lead as well.

  My working taxonomy is that a heritability estimate tends to be conscripted to do four different jobs: apportioning variance in a specified population; describing how a trait is produced in an individual; predicting how much a named intervention will move things; and explaining a difference between groups or between cohorts. My belief is that only the first is a job the estimate can actually perform, and I would like the procedure built around first identifying which job the claim is asking the number to do. Correct me if the taxonomy is wrong or if it misses a job the number is routinely asked to do.

  Below are the checks I have in mind; you decide the order, which ones collapse into each other, and which are not worth a non-specialist's time.

  - Population specification: is the estimate tied to a named population, period, and range of environments? If not, stop.
  - A portability ledger for estimates imported from one population to another, on three axes: genetic architecture and ancestry, the magnitude of environmental variance, and how the trait was defined and measured. My candidate rule is that a "genes versus environment" ranking is portable only if the environmental variance in the target population is at least as large as in the source. Tell me whether that is right as stated.
  - A uniform-cause check: a factor that is causally necessary but nearly uniform in the sampled population contributes almost no variance, so a high heritability is compatible with that factor being indispensable and with an intervention on it moving the mean a great deal. I take this to be correct; say so if I have it wrong.
  - An intervention-leverage question: which variance component does the proposed intervention act on, and does the estimate speak to a change in the mean at all, as opposed to a share of the variance?
  - The individual-level misreading: no "x percent of your trait is genetic" reading passes.
  - The step from heritability within groups to any conclusion about differences between group means. Where this stops the claim, I want a toy numerical illustration a reviewer can paste into a ruling without having to reconstruct the reasoning.
  - Disagreement between designs: twin estimates versus SNP-based estimates, the equal-environments assumption, gene-environment correlation, dichotomous traits on a liability scale, and traits defined partly by institutional facts — years of schooling, income, diagnostic categories — where heritability can shift because the institution shifted rather than the biology.

  Hard cases the procedure must handle explicitly: an estimate reported as having risen across cohorts; a claim whose number is sound but whose implication is a values question; a claim where the underlying design is not stated in the material we have.

  Then apply the procedure to three cases and show the rulings and clauses: (1) a press release reporting that the heritability of educational attainment has risen from earlier cohorts to roughly forty percent, and that differences in exam results therefore mostly come from differences in children's genes, so extra school funding is unlikely to close the gap; (2) a clinic leaflet stating that BMI is around seventy percent heritable, from which a parent concludes that a dietitian referral is pointless; (3) an internal policy memo arguing that, because BMI is highly heritable, population-level food-environment measures will have limited effect and resources should go to identifying high-risk genotypes instead.

  I expect at least one of these to come back partly as a pass or a pass-with-clause on a claim my desk would rather kill — I suspect part of the school-funding case survives. If so, say which part, and why we have to live with it. Please also give me three stock translation clauses covering the three most common misreadings, in language that can sit next to a number in print.

  Two further things. Mark, step by step, which parts are settled and which rest on contested methodological ground; where the ground is genuinely contested, give me the step's default and say plainly that it is a default rather than dressing it up as rigour. And if the task as I have posed it cannot be done in fifteen minutes by someone with my reviewers' training, or if some piece of my framing above rests on a mistake, tell me that directly instead of complying politely — I would rather have a shorter procedure that works than a complete one that does not.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Head of claims desk at a medical news service.
      *   **Task:** Create a decision procedure for reviewers to evaluate heritability claims.
      *   **Constraints:**
          *   Reviewer time: ~15 minutes per claim.
          *   Reviewer skill: One applied stats course, no quantitative geneticist on call.
          *   Output: Written ruling (Stop, Pass w/ Clause, Pass, Escalate) + 1 sentence limitation (if Stop/Clause).
          *   Taxonomy: User believes heritability only validly apportions variance in a specified population (Job 1), not individual production (Job 2), intervention prediction (Job 3), or group difference explanation (Job 4).
          *   Specific Checks Provided: Population spec, Portability, Uniform-cause, Intervention-leverage, Individual-level, Between-group, Design disagreement.
          *   Hard Cases: Rising estimates, Values vs. Facts, Missing design info.
          *   Test Cases: (1) Education heritability rising/funding, (2) BMI heritable/dietitian pointless, (3) BMI heritable/policy focus on genotypes.
          *   Requirement: Mark settled vs. contested methodology. Be honest if the task is impossible as framed.
          *   Deliverables: Decision procedure, application to 3 cases, 3 stock translation clauses.

  2.  **Evaluate the User's Framing & Taxonomy:**

      *   *Taxonomy:* The user's belief (only Job 1 is valid) is scientifically sound for *narrow-sense heritability* ($h^2$) in the context of public communication. Jobs 2, 3, and 4 are classic fallacies (Deterministic, Interventionist, and Between-Group fallacies).
      *   *Feasibility:* Can a non-specialist do this in 15 minutes?
          *   *Risk:* Checking "genetic architecture," "environmental variance magnitude," and "liability scales" is too technical for 15 minutes without a specialist.
          *   *Solution:* Simplify the checks into "Red Flags" rather than deep audits. Focus on *claims made* rather than *validating the number itself* (unless the number is obviously misused). The procedure must prioritize catching the *inference* errors over validating the *estimate* precision.
      *   *Correction:* The user's rule on portability ("environmental variance in target >= source") is technically shaky for a 15-minute check. Heritability ($h^2 = V_G / V_P$) changes if $V_E$ changes. If $V_E$ decreases (more uniform environment), $h^2$ goes *up*. If $V_E$ increases, $h^2$ goes *down*. The user's rule says portable only if $V_E$ target >= source. This implies if the target is *more* uniform, it's not portable. Actually, if the target is more uniform, $h^2$ might be higher, making the source estimate an *underestimate*. The real danger is assuming an estimate from a high-variance environment applies to a low-variance one (where $h^2$ would be higher) or vice versa. *Correction:* Keep it simple. If environments differ significantly, the number doesn't travel. Don't ask reviewers to calculate variance magnitudes.
      *   *Uniform-cause:* User is correct. (Phenylketonuria example: 100% heritable in normal diet, 0% heritable if everyone eats low-phenylalanine diet, but the gene is the cause).
      *   *Time Constraint:* 15 minutes is tight for checking "Design disagreement" (Twin vs. SNP). Reviewers can't audit the methods section deeply. They need to look for *warnings* in the text or obvious mismatches (e.g., applying twin study $h^2$ to SNP-based prediction).

  3.  **Drafting the Decision Procedure:**

      *   *Goal:* Filter claims based on the *inference* drawn from the number, not just the number's existence.
      *   *Structure:* Funnel approach. Easy kills first. Harder judgments later. Escalation path for ambiguity.
      *   *Step 1: The Job Check (Taxonomy).* What is the number doing?
      *   *Step 2: The Population Check.* Is it defined?
      *   *Step 3: The Inference Check.* Does it cross the line to Individual, Intervention, or Between-Group?
      *   *Step 4: The Design/Context Check.* (Simplified).
      *   *Escalation:* When the science is too murky or the implication is ethical/policy-based (Values).

  4.  **Refining the Checks for 15 Minutes:**

      *   *Portability:* Instead of asking reviewers to compare variance magnitudes (impossible in 15 mins), ask: "Is the target population/environment clearly different from the study population?" If yes -> Stop/Clause.
      *   *Design Disagreement:* Reviewers can't resolve Twin vs. SNP. Rule: If the claim relies on specific genetic architecture (e.g., "polygenic score will predict...") but cites twin heritability -> Stop/Clause.
      *   *Values vs. Facts:* This is the "Escalate" trigger. If the science is okay but the policy conclusion is debatable (e.g., "therefore fund X"), escalate.

  5.  **Addressing the "Settled vs. Contested" Requirement:**

      *   *Settled:* $h^2$ is population-specific. $h^2$ does not apply to individuals. $h^2$ within groups $\neq$ $h^2$ between groups.
      *   *Contested:* Exact magnitude of $h^2$ for complex traits (SNP vs. Twin). Missing heritability. GxE interaction specifics.
      *   *Default:* Assume the published number is the "best available" *for that specific population*, but treat inferences beyond variance apportionment as false until proven otherwise.

  6.  **Developing the Stock Clauses:**

      *   Need to cover: Individual attribution, Intervention futility, Between-group difference.
      *   Must be concise (one sentence).

  7.  **Applying to Test Cases:**

      *   *Case 1 (Education/Funding):*
          *   Number: 40% heritable (rising).
          *   Claim: Differences mostly from genes -> Funding won't work.
          *   Analysis: Within-group $h^2$ used to predict intervention effect (Job 3) and dismiss policy (Values).
          *   Ruling: Stop on the funding claim. Pass on the heritability estimate *if* qualified.
          *   *User Expectation:* "I suspect part of the school-funding case survives."
          *   *Reality Check:* The claim "differences... mostly come from differences in children's genes" is technically the definition of $h^2$ *within that population*. However, the leap to "funding unlikely to close gap" is the Intervention Fallacy. The *estimate* might be passable with a clause, the *conclusion* must be killed.
      *   *Case 2 (BMI/Dietitian):*
          *   Number: 70% heritable.
          *   Claim: Dietitian pointless.
          *   Analysis: Intervention Fallacy (Job 3) + Individual Fallacy (Job 2).
          *   Ruling: Stop. High $h^2$ does not mean environment can't change mean.
      *   *Case 3 (BMI/Policy):*
          *   Number: 70% heritable.
          *   Claim: Population measures limited effect -> focus on genotypes.
          *   Analysis: Intervention Fallacy (Job 3). Also Values (resource allocation).
          *   Ruling: Escalate. The science (intervention leverage) is wrong, but the resource allocation is a policy decision. Actually, the science part is wrong enough to Stop the *scientific justification*, but the policy choice is an Escalation. Let's make it a Stop on the science, Escalate on the policy. Or simpler: Stop the causal claim, Escalate the recommendation.
          *   *Refinement:* The prompt asks for one ruling. If the scientific premise for the policy is false, the claim "resources *should* go..." is unsupported. Stop. But since it touches clinical/population advice, Escalate to Clinical Lead/Editor. Let's go with **Escalate** because it mixes bad science with policy values.

  8.  **Critique of the User's "Portability Ledger":**

      *   User's rule: "Portable only if environmental variance in target >= source."
      *   Critique: This is mathematically risky for a non-specialist. If $V_E$ target is *smaller* (more uniform), $h^2$ goes *up*. Using the source number would *underestimate* genetic influence. If $V_E$ target is *larger* (more diverse), $h^2$ goes *down*. Using source number *overestimates* genetic influence.
      *   Better Rule for Reviewers: "Do not transport the number if the environments differ substantially." Don't try to guess the direction. Just flag the transport.

  9.  **Finalizing the Procedure Structure:**

      *   **Phase 1: The Job Sort (2 mins).** Identify the claim type.
      *   **Phase 2: The Population Anchor (3 mins).** Check specificity.
      *   **Phase 3: The Forbidden Inferences (5 mins).** Check for Individual/Intervention/Group fallacies.
      *   **Phase 4: The Design Sanity Check (5 mins).** Twin vs. SNP, Missing Design.
      *   **Decision Matrix.**

  10. **Review against Constraints:**
      *   15 mins? Yes, if steps are checklist style.
      *   One stats course? Yes, avoid formulas, use concepts.
      *   Settled vs. Contested? I will annotate the procedure.
      *   Honest feedback? I need to tell the user that checking "genetic architecture" in 15 mins is impossible. I will simplify that check to "Does the text admit uncertainty?"

  11. **Drafting the Content:** (Self-Correction during drafting)
      *   *Correction on Case 1:* The user suspects part survives. The statement "heritability... risen... to roughly forty percent" is a factual claim about variance *in that population*. That can Pass with Clause. The "therefore funding..." is the Stop. I need to make sure the procedure allows splitting the claim.
      *   *Correction on Portability:* I need to explicitly tell the user their portability rule is too complex for the time constraint.
      *   *Correction on Values:* The procedure must clearly separate "This science doesn't support that conclusion" (Stop) from "This science supports X, but X implies policy Y which is debatable" (Escalate).

  12. **Final Polish:** Ensure tone is professional, direct, and respects the user's expertise while correcting the feasibility issues. (Proceed to generate output).

  *(Self-Correction on the "Portability Ledger" specific question)*: The user asked: "Tell me whether that is right as stated."
  *Answer:* No, it's not quite right. If $V_E$ target < $V_E$ source (target is more uniform), $h^2$ target > $h^2$ source. Using the source number underestimates heritability. If $V_E$ target > $V_E$ source, $h^2$ target < $h^2$ source. Using source overestimates. The risk is usually overestimation in a new population. But for a 15-min check, the rule should be "No transport across distinct environments."

  *(Self-Correction on Case 1)*: The user says "I suspect part of the school-funding case survives."
  *Analysis:* The claim has two parts: (A) Heritability rose to 40%, (B) Therefore funding won't work.
  (A) is a variance claim. If the study supports it, it's factually "true" for that population.
  (B) is an intervention claim. It is false.
  So the ruling should be: Pass (A) with Clause, Stop (B). Or if they are inseparable in the text, Stop the whole thing but offer a rewrite. I will recommend splitting the claim.

  *(Self-Correction on Time)*: 15 minutes is *very* short for checking "Design disagreement." I will advise that reviewers treat "Missing Design" as an automatic Escalate or Stop, rather than trying to hunt it down.

  *(Final Plan)*:
  1. Validate Taxonomy (Yes, it's correct).
  2. Critique Feasibility (Portability rule too hard, Design check too hard).
  3. Provide Simplified Procedure (Flowchart style).
  4. Mark Settled/Contested.
  5. Provide Stock Clauses.
  6. Apply to 3 Cases.
  7. Address the "Surviving Part" of Case 1.

  Let's write it.cw
answer: |-
  Here is the decision procedure, the critique of your framing, the stock clauses, and the application to your three cases.

  ### Part 1: Critique of Framing and Feasibility

  **1. The Taxonomy**
  Your taxonomy is correct. Heritability ($h^2$) is a population statistic describing the proportion of *phenotypic variance* attributable to *genetic variance* in a *specific environment*.
  *   **Job 1 (Variance Apportionment):** Valid.
  *   **Job 2 (Individual Production):** Invalid (Category Error).
  *   **Job 3 (Intervention Prediction):** Invalid (Intervention Fallacy).
  *   **Job 4 (Between-Group Explanation):** Invalid (Ecological Fallacy).

  **2. The Time Constraint (15 Minutes)**
  You cannot ask a reviewer with one stats course to audit "genetic architecture," "liability scales," or "environmental variance magnitudes" in 15 minutes. That requires a quantitative geneticist.
  *   **Adjustment:** The procedure must treat *unstated methods* or *complex design conflicts* (Twin vs. SNP) as **Escalations**, not tasks for the reviewer to resolve.
  *   **Adjustment:** The "Portability Ledger" rule you proposed is mathematically fragile for a non-specialist. If the target environment is *more* uniform than the source, heritability rises; if *less* uniform, it falls. Asking a reviewer to guess the direction of variance change is error-prone.
  *   **New Rule:** "If the claim applies a number to a population or environment clearly different from the study, flag it. Do not attempt to calculate the direction of bias."

  **3. Settled vs. Contested Ground**
  I have marked the procedure steps below.
  *   **[SETTLED]:** Consensus science. Reviewers can treat these as hard rules.
  *   **[CONTESTED/DEFAULT]:** Methodological debates exist. Reviewers must apply a **Default Position** (conservative) rather than attempting to adjudicate the science.

  ---

  ### Part 2: The 15-Minute Decision Procedure

  **Instructions:** Read the claim and the source text (abstract/press release). Tick boxes. If any "STOP" box is ticked, issue a Stop ruling. If "ESCALATE" is ticked, send to Editor/Clinical Lead. If all clear, issue Pass or Pass-with-Clause.

  #### Step 1: The Job Sort (2 Minutes)
  *What work is the heritability number being asked to do?*
  *   [ ] Describing variance shares in a specific group? (Job 1)
  *   [ ] Explaining an individual's trait? (Job 2)
  *   [ ] Predicting an intervention's success? (Job 3)
  *   [ ] Explaining a difference between two groups (e.g., nations, races, cohorts)? (Job 4)

  **Decision:**
  *   If Job 2, 3, or 4 is the *primary* conclusion: **STOP**. (Proceed to Step 4 for the limitation sentence).
  *   If Job 1 is the primary conclusion, but Jobs 2-4 are implied: **PASS WITH CLAUSE** (The number stays, the implication is neutered).
  *   If only Job 1: Proceed to Step 2.

  #### Step 2: The Population Anchor [SETTLED] (3 Minutes)
  *Is the number tied to a specific context?*
  *   [ ] Does the text name the population (ancestry, age, location)?
  *   [ ] Does the text acknowledge the environment/time period of the measurement?
  *   [ ] Is the claim applying this number to a *different* population or time without qualification?

  **Decision:**
  *   If No name/population specified (e.g., "Heritability of BMI is 70%"): **STOP**.
  *   If applied to a different population (Portability): **PASS WITH CLAUSE** (Must state the number may not apply here).
  *   If specific and matched: Proceed to Step 3.

  #### Step 3: The Uniform-Cause & Intervention Check [SETTLED] (5 Minutes)
  *Does the claim ignore environmental uniformity or leverage?*
  *   [ ] Does the claim suggest a high heritability means the environment *cannot* change the trait? (e.g., "Diet won't work because BMI is genetic").
  *   [ ] Does the claim ignore a factor that is necessary but uniform? (e.g., "Language is heritable" ignoring everyone speaks a language).

  **Decision:**
  *   If Yes: **STOP**. (This is the Intervention Fallacy).
  *   If No: Proceed to Step 4.

  #### Step 4: Design & Values Check [CONTESTED/DEFAULT] (5 Minutes)
  *Is the underlying science clear, and is the implication a value judgment?*
  *   [ ] Is the design (Twin, SNP, Family) clearly stated?
  *   [ ] Does the claim rely on the *magnitude* of the number to decide policy (e.g., "Because it is >50%, we should fund X")?
  *   [ ] Is the design missing or ambiguous?

  **Decision:**
  *   If Design Missing/Ambiguous: **ESCALATE** (Do not guess). **[DEFAULT]**
  *   If Policy/Values conclusion drawn from the number (e.g., funding, screening priorities): **ESCALATE** (Science does not dictate resource allocation). **[DEFAULT]**
  *   If Design stated and no policy overreach: **PASS**.

  ---

  ### Part 3: Stock Translation Clauses

  Use these verbatim when issuing a **Pass with Clause**. They are designed to sit next to the number or in a sidebar.

  1.  **For Individual Attribution (Job 2):**
      > "This figure describes variation across the population, not the makeup of an individual; it does not indicate how much of *your* trait is genetic."
  2.  **For Intervention Futility (Job 3):**
      > "High heritability does not imply immutability; environmental changes can still shift the average trait value significantly."
  3.  **For Between-Group Differences (Job 4):**
      > "This estimate applies to differences within this group and cannot explain average differences between distinct populations or environments."

  ---

  ### Part 4: Application to Test Cases

  #### Case 1: Education Heritability & School Funding
  *Claim:* Heritability of educational attainment rose to ~40%; therefore differences in exam results mostly come from genes, so extra school funding is unlikely to close the gap.
  *   **Step 1 (Job Sort):** Mix of Job 1 (variance rose) and Job 3/4 (funding won't work/differences come from genes).
  *   **Step 2 (Population):** Assumes cohorts are comparable populations. [SETTLED]
  *   **Step 3 (Intervention):** Claims funding (environment) won't work because $h^2$ is high. [SETTLED] -> **STOP** on this inference.
  *   **Step 4 (Values):** "Resources should not go to funding" is a policy value. [DEFAULT] -> **ESCALATE**.

  **Ruling:** **ESCALATE** (to you + Clinical/Policy Lead).
  **Reasoning:** The claim conflates a variance statistic with a policy prescription. The scientific premise for the policy (that funding won't work) is false (Intervention Fallacy), but the resource allocation is a values question.
  **Split Ruling Option:** If the text can be split:
  *   *Statement A:* "Heritability estimates have risen to 40% in recent cohorts." -> **PASS WITH CLAUSE** (Clause 3: Cohort specificity).
  *   *Statement B:* "Therefore funding is unlikely to close the gap." -> **STOP**.
  **Why part survives:** You are correct; the descriptive statistic (Job 1) is scientifically defensible *if* tied to the specific cohorts studied. The error is the *therefore*. Your desk must allow the fact while killing the inference.

  #### Case 2: BMI Clinic Leaflet
  *Claim:* BMI is 70% heritable; parent concludes dietitian referral is pointless.
  *   **Step 1 (Job Sort):** Job 2 (Individual/Parent conclusion) and Job 3 (Intervention futility).
  *   **Step 3 (Intervention):** Explicitly claims environment (diet) cannot move the trait. [SETTLED] -> **STOP**.

  **Ruling:** **STOP**.
  **Limitation Sentence:** "High heritability indicates current variance sources, not that environmental interventions like diet cannot change the outcome."
  **Sign-off:** Requires Clinical Lead (medical advice).

  #### Case 3: Policy Memo (BMI & Genotypes)
  *Claim:* Because BMI is highly heritable, population-level food-environment measures will have limited effect; resources should go to identifying high-risk genotypes.
  *   **Step 1 (Job Sort):** Job 3 (Intervention prediction) and Job 4 (Policy prioritization).
  *   **Step 3 (Intervention):** Claims population measures will have "limited effect" based on $h^2$. [SETTLED] -> **STOP** on the scientific justification.
  *   **Step 4 (Values):** "Resources should go to..." is a value/policy judgment. [DEFAULT] -> **ESCALATE**.

  **Ruling:** **ESCALATE**.
  **Reasoning:** The scientific justification for the policy is false (Intervention Fallacy), but the final recommendation is a resource allocation decision. The science cannot support the premise, but the decision to prioritize genotypes is a policy choice you cannot adjudicate on stats alone.
  **Note:** If the memo presents the scientific premise as *fact* ("Environment measures *will* have limited effect"), you must **STOP** that sentence. If it presents it as a *rationale* ("We propose X because..."), you **ESCALATE** the rationale.

  ---

  ### Part 5: Methodological Notes for the Editor (You)

  **1. The Portability Rule Correction**
  Your proposed rule ("Portable only if environmental variance in target >= source") is theoretically risky for reviewers.
  *   *Why:* Heritability = $V_G / (V_G + V_E)$. If the target environment is *more* uniform ($V_E$ down), Heritability goes *up*. If the target is *less* uniform ($V_E$ up), Heritability goes *down*.
  *   *Risk:* A reviewer might think a more uniform environment makes the number *less* portable. Actually, it makes the source number an *underestimate*.
  *   *Fix:* The procedure above sidesteps this. Reviewers simply flag *any* transport across distinct environments. They do not guess the direction. This is safer for a 15-minute check.

  **2. Design Disagreement (Twin vs. SNP)**
  *   *Settled:* Twin studies capture all additive genetic variance (including rare variants) but assume equal environments. SNP-based (GREML/GWAS) captures only common variant additive variance (usually lower $h^2$).
  *   *Contested:* How much "missing heritability" is real vs. methodological artifact.
  *   *Default:* If a claim cites a Twin study to justify a Polygenic Score (SNP) application, **STOP/ESCALATE**. The numbers are not interchangeable. Reviewers cannot resolve this; they must flag the mismatch.

  **3. The "Rising Heritability" Hard Case**
  *   *Context:* Often seen in education (as in Case 1). As environments become more equal (standardized schooling), $V_E$ drops, so $h^2$ rises.
  *   *Trap:* This is often used to argue "Genes matter more now."
  *   *Truth:* It means "Environment matters *less* as a source of *variance*," not that genes cause more of the trait.
  *   *Procedure:* Step 3 catches this. If the claim says "Genes matter more" (implying biological determinism increased), **STOP**. If it says "Variance due to environment decreased," **PASS WITH CLAUSE**.

  **4. Feasibility Warning**
  The 15-minute limit is tight for Step 4 (Design Check). If the source text is behind a paywall or the methods section is opaque, reviewers will default to "Design Missing."
  *   *Recommendation:* Authorize reviewers to treat "Design Missing" as an automatic **ESCALATE** rather than trying to Google it. This protects the desk from publishing numbers that cannot be contextualized.

  **5. Values vs. Facts**
  You asked where the procedure hands the decision to a person. That is **Step 4**.
  *   *Fact:* "Intervention X will not work." (Reviewer can Stop this).
  *   *Value:* "We should not fund Intervention X." (Reviewer must Escalate this).
  *   *Why:* Science can prove inefficacy. It cannot prove that an inefficient intervention isn't worth funding for equity, political, or ethical reasons. Your desk rules on truth, not justice.
