answer: |-
  **Desiderata for Non-Human Causes in Historical Explanation**

  This specification outlines the conditions under which non-human factors—pathogens, climate, geology—enter historical explanation as causal forces rather than scenery. The goal is utility for working historians constructing narratives of specific episodes. The following requirements are designed to admit material reality without surrendering human agency to environmental determinism.

  **I. Empirical Cases and Tests**
  A viable theory must accommodate four specific scenarios. Each tests a different boundary of causal attribution.

  1.  **The Volcanic Winter:** A large tropical eruption causes atmospheric cooling, harvest failure across Europe and New England, and social distress.
      *   *Test:* **Scale and Impersonality.** The theory must admit causes that are global and unknown to contemporaries. It tests whether a factor can be causal without human recognition.
  2.  **The Colonial Expedition:** A mosquito- or water-borne disease decimates a military force, deciding the expedition's fate.
      *   *Test:* **Contingency.** The theory must allow biology to override strategy. It tests whether non-human factors can act as decisive *triggers* rather than mere background noise.
  3.  **The Drought-Violence Sequence:** A drought leads to migration and violence in a region that has weathered comparable droughts without violence.
      *   *Test:* **Interaction.** The theory must explain why the cause produced an effect *now* but not *then*. It tests whether the factor is a sufficient cause or merely a stressor interacting with social vulnerability.
  4.  **The Harvest Failure Pair:** Two formally identical harvest failures, one produced by weather, one by requisition policy, where the historian's causal idiom plainly shifts.
      *   *Test:* **Symmetry.** The theory must account for why we describe policy as "causing" failure differently than weather. It tests whether the theory demands identical causal language for human and non-human inputs.

  **II. Required Distinctions**
  To prevent conceptual collapse, the theory must maintain the following distinctions. Each is marked as non-negotiable or camp-specific.

  1.  **Trigger versus Standing Condition:** A *trigger* is an immediate precipitant of an event; a *standing condition* is a background state that makes the event possible.
      *   *Status:* **Non-negotiable.** Without this, every historical fact becomes a cause. The volcano is a trigger; the region's agricultural dependence is a standing condition.
  2.  **Constraining versus Enabling:** *Constraining* reduces the set of available actions; *enabling* expands it.
      *   *Status:* **Non-negotiable.** Historians must specify whether the climate closed options (famine) or opened them (new trade routes).
  3.  **Cause versus Selector:** A *cause* produces an outcome; a *selector* determines which social arrangements survive a shock without producing the shock itself.
      *   *Status:* **Non-negotiable.** This sets the ceiling against determinism. A drought does not cause a revolution; it selects against regimes lacking grain reserves.
  4.  **Explaining versus Excusing (The Alibi Problem):** *Explaining* identifies mechanisms; *excusing* absolves agents of responsibility. There is an asymmetry where climate is recruited as an excuse while pathogens are recruited as explanations.
      *   *Status:* **Non-negotiable.** The theory must prevent environmental factors from serving as moral alibis for human negligence (e.g., failing to store grain).

  **III. Adjudication of Candidate Requirements**
  Two candidate requirements are evaluated against the cases above.

  1.  **The Substitution Test:** A non-human factor counts as more than background only if swapping in the nearest available alternative state (no eruption, milder winter) would have changed not merely the date or body count but which options were live for human agents.
      *   *Verdict:* **Genuine Desideratum.**
      *   *Analysis:* This rules out "scenery" history where the environment is present but irrelevant. It survives the Volcano case (no eruption = no famine) and the Expedition case (no disease = success). It silently rules out weak correlations where human agency would have produced the same outcome regardless. It is essential for distinguishing cause from coincidence.
  2.  **The Uptake Condition:** A factor counts only if it was registered at the time, however dimly, as risk, rumor, portent, or explanation by at least some participants.
      *   *Verdict:* **Prejudice of Cultural History.**
      *   *Analysis:* This privileges contemporary consciousness over material reality. It fails the Volcano case, as peasants did not know about the eruption. It silently rules out structural causes unknown to agents (e.g., groundwater salinity). While useful for intellectual history, it cannot serve as a general requirement for causal explanation because it denies causality to ignorance.

  **IV. Incompatibilities and Exclusion**
  There is a tension between two requirements that cannot be jointly satisfied in extreme cases. **The Symmetry Requirement** (from the Harvest Failure case, demanding similar causal idioms for weather and policy) conflicts with **The Alibi Constraint** (from Explaining vs. Excusing, demanding humans remain responsible). If weather causes failure exactly as policy does, human responsibility evaporates in the face of nature. Historians must accept that causal symmetry often risks moral asymmetry; you cannot have perfect ontological equality between rain and taxes without blurring the line between tragedy and negligence.

  The single requirement that does the most work in excluding actual positions is the **Selector versus Cause** distinction. It excludes strict environmental determinism (which treats climate as a Cause of social outcomes) and strict human exceptionalism (which treats climate as mere Scenery). It forces the historian to locate the mechanism of failure in the social arrangement's fragility, not the shock itself.

  **V. Stance Evaluation**

  | Stance | Score Against Desiderata |
  | :--- | :--- |
  | **Strict Human Exceptionalism** | Fails Substitution Test; treats non-humans as scenery only. |
  | **Environmental Determinism** | Fails Selector distinction; treats non-humans as sole causes. |
  | **Flat Symmetric Ontology** | Fails Alibi Constraint; treats germs and treaties as identical agents. |
  | **Middle View (Constraints/Affordances)** | Passes all; treats non-humans as selectors of viable human options. |
