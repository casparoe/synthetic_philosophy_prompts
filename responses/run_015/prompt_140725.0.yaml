answer: |-
  Here is the complete package: the exam question, the model answer, the marking scheme, and a brief critique of the setup.

  ***

  # Part 1: The Exam Question

  **ADVANCED POPULATION ETHICS — FINAL EXAMINATION**
  **Time Allowed:** 90 Minutes
  **Instructions:** Closed book. Calculators permitted. Answer all parts.

  **Context:**
  Consider a population as a list of welfare levels $w_1, w_2, ..., w_n$.
  *   $n$: The number of people (headcount).
  *   $T$: The total welfare ($\sum w_i$).
  *   $A$: The average welfare ($T/n$).
  *   **Neutrality:** A life at welfare 0 is neutral (neither worth living nor not). Positive numbers are lives worth living. Welfare is comparable on a ratio scale.

  **The Baseline:**
  Population $P^*$ consists of $10^{10}$ (ten billion) people, each at welfare level 100.
  **The Repugnant Conclusion (RC):** For any $\varepsilon > 0$, there exists a population $P_\varepsilon$ of $N$ people at welfare $\varepsilon$ such that $P_\varepsilon$ is better than $P^*$.

  **Theories:**
  1.  **Power-Weighted Utilitarianism ($V_\alpha$):** Value is $V_\alpha = A \cdot n^\alpha$, where $0 \leq \alpha \leq 1$.
  2.  **Strict Averagism:** Value is $A$ (equivalent to $V_0$).
  3.  **Lexical Threshold:** Fix a threshold $\tau > 0$. Population $P$ is better than $Q$ if $P$ has fewer people below $\tau$. If tied, $P$ is better if $T_P > T_Q$.
  4.  **Critical-Level Utilitarianism:** Fix a critical level $c > 0$. Value is $\sum (w_i - c)$.

  **Questions:**

  **(a) Power-Weighted Utilitarianism (8 marks)**
  Set $\varepsilon = 0.01$. Derive the minimum $N$ required for $P_\varepsilon$ to beat $P^*$ as a function of $\alpha$. Calculate $N$ specifically for $\alpha = 0.5$. Does setting $\alpha < 1$ logically avoid the Repugnant Conclusion, or does it merely alter the scale of $N$? Distinguish between "mathematically finite" and "physically possible" in your evaluation.

  **(b) The Cost of Averagism (5 marks)**
  Using Strict Averagism ($\alpha = 0$), compare $P^*$ (10 billion at 100) to a population $P^{small}$ of 2 people at welfare 101. Which is better? Explain why this result is often considered as counterintuitive as the Repugnant Conclusion.

  **(c) The Lexical Threshold (8 marks)**
  Set $\tau = 10$.
  (i) Show that if $\varepsilon = 0.01$, $P_\varepsilon$ does *not* beat $P^*$.
  (ii) Show that if we select $\varepsilon = 11$, $P_\varepsilon$ *does* beat $P^*$ for sufficiently large $N$.
  (iii) Consider a population $P^{cliff}$ identical to $P^*$ but where every individual's welfare is reduced from 100 to 9.9. Compare $P^*$ and $P^{cliff}$. What structural feature of the theory does this reveal, and is it preferable to the RC?

  **(d) Critical-Level Utilitarianism (5 marks)**
  Set $c = 50$. Explain why the RC vanishes for $\varepsilon = 0.01$. Where has the RC relocated? What is the specific normative cost regarding lives with welfare $w$ where $0 < w < c$?

  **(e) Synthesis (4 marks)**
  To definitively escape the Repugnant Conclusion without generating absurdities like those in (b) or (c), which of the following must be rejected: (i) Completeness, (ii) Unbounded Aggregation, (iii) Continuity, or (iv) the claim that lives at $\varepsilon > 0$ are benefits? Briefly justify whether a "Person-Affecting" restriction resolves this tension in a choice scenario.

  ***

  # Part 2: Model Answer

  **(a) Power-Weighted Utilitarianism**
  The value of the baseline $P^*$ is $V^* = 100 \cdot (10^{10})^\alpha$.
  The value of the repugnant population $P_\varepsilon$ is $V_\varepsilon = \varepsilon \cdot N^\alpha$.
  For $P_\varepsilon$ to beat $P^*$, we require $\varepsilon N^\alpha > 100 (10^{10})^\alpha$.
  Rearranging for $N$:
  $$N^\alpha > \frac{100}{\varepsilon} (10^{10})^\alpha \implies N > 10^{10} \cdot \left(\frac{100}{\varepsilon}\right)^{1/\alpha}$$
  With $\varepsilon = 0.01$, the ratio $100/\varepsilon = 10,000 = 10^4$.
  $$N > 10^{10} \cdot (10^4)^{1/\alpha} = 10^{10 + 4/\alpha}$$
  For $\alpha = 0.5$: $N > 10^{10 + 8} = 10^{18}$.
  Setting $\alpha < 1$ does not logically avoid the RC; for any fixed $\alpha > 0$, $N$ remains finite. As $\varepsilon \to 0$, $N \to \infty$, but for any fixed $\varepsilon$, a better population exists. Reducing $\alpha$ merely pushes $N$ beyond physical possibility (e.g., $10^{18}$ exceeds the number of humans who have ever lived by orders of magnitude). However, relying on physical impossibility is a dodge in normative ethics: the RC is a claim about axiological ordering, not engineering feasibility. If the theory says $10^{18}$ lives at misery are better than 10 billion flourishing lives, the theory implies a repugnant value judgment, regardless of whether we can build it.

  **(b) The Cost of Averagism**
  Under Strict Averagism, Value = $A$.
  $V(P^*) = 100$.
  $V(P^{small}) = 101$.
  $P^{small}$ is better than $P^*$.
  This implies that adding billions of people with lives worth living (welfare 100) is a catastrophic loss if it slightly dilutes the average. It creates a "sadistic conclusion": it is better to have two ecstatic people than ten billion happy people. This violates the intuition that adding lives worth living should not make an outcome worse (the Mere Addition Principle). It trades the RC for an elitist conclusion where population size is a penalty rather than a neutral or positive factor.

  **(c) The Lexical Threshold**
  (i) With $\tau = 10$ and $\varepsilon = 0.01$: $P^*$ has 0 people below $\tau$. $P_\varepsilon$ has $N$ people below $\tau$. Since $0 < N$, $P^*$ is strictly better. The RC is avoided for this $\varepsilon$.
  (ii) With $\varepsilon = 11$: Both populations have 0 people below $\tau$. The tie-breaker is Total Welfare ($T$). $T^* = 10^{12}$. $T_\varepsilon = 11N$. For $N > 10^{12}/11$, $P_\varepsilon$ beats $P^*$. The RC has not vanished; it has relocated to welfare levels above $\tau$. If $\tau$ is set at a "sufficiency" level (e.g., a decent life), the RC now claims that a world of barely-sufficient lives is better than a world of flourishing lives, provided the headcount is high enough.
  (iii) $P^{cliff}$ (10 billion at 9.9) vs $P^*$ (10 billion at 100). $P^{cliff}$ has 10 billion people below $\tau$; $P^*$ has 0. The theory ranks $P^*$ as vastly superior to $P^{cliff}$. This reveals a **discontinuity** (a cliff-edge). A microscopic loss in welfare (100 to 9.9) flips the population from "optimal" to "disastrous." This violates Continuity. Whether this is worse than the RC depends on whether one fears discontinuity more than repugnant trade-offs. Most find the cliff implausible: it implies we should save a life at 10.1 over a million lives at 100, simply because 10.1 crosses the threshold.

  **(d) Critical-Level Utilitarianism**
  With $c = 50$, the value of a life at $\varepsilon = 0.01$ is $(0.01 - 50) = -49.99$.
  Adding more people adds negative value. $V(P_\varepsilon) = N(-49.99)$. As $N$ increases, value decreases. The RC vanishes for $\varepsilon < c$.
  The RC relocates to $\varepsilon > c$. If $\varepsilon = 51$, each life contributes $+1$. Totalism applies above the critical level, so the RC returns for lives above $c$.
  The normative cost: Lives with $0 < w < 50$ are lives worth living (positive welfare), yet creating them counts as a **harm** (negative value). This violates the intuition that adding a happy life should never make the world worse (the "Sadistic Conclusion" in a different guise). It implies we ought to prevent the birth of happy people if their happiness doesn't clear the critical bar.

  **(e) Synthesis**
  To escape the RC without the costs above, one must reject **Continuity** (as in the Lexical view) or **Unbounded Aggregation** (capping the value of additional lives). Rejecting Completeness (declaring $P^*$ and $P_\varepsilon$ incomparable) avoids the conclusion but fails in choice scenarios: if we must choose between the two, incomparability offers no guidance. A Person-Affecting View (only compare outcomes based on how they affect specific individuals) avoids the RC by ruling out comparisons between disjoint populations. However, this fails the "Non-Identity Problem": it cannot condemn policies that create a vast, miserable population rather than a smaller, happy one, provided the miserable people would not have existed otherwise. Thus, avoiding the RC generally requires accepting counterintuitive costs elsewhere in the system.

  *(Extra Note: A fifth route is Variable Critical Levels, where $c$ rises with $n$. This dampens the RC without condemning lives below a fixed $c$, but introduces complexity regarding the rate of increase.)*

  ***

  # Part 3: Marking Scheme (30 Marks Total)

  **Part (a): Power-Weighted Utilitarianism (8 marks)**
  *   **2 marks:** Correct derivation of inequality $N > 10^{10} (100/\varepsilon)^{1/\alpha}$.
      *   *Error:* Failing to isolate $N$ correctly or mishandling the exponent.
  *   **2 marks:** Correct calculation for $\alpha=0.5$ ($N > 10^{18}$).
      *   *Error:* Arithmetic errors with powers of 10.
  *   **2 marks:** Identification that $\alpha < 1$ delays but does not logically eliminate RC (finite $N$ still exists).
      *   *Error:* Claiming $\alpha < 1$ solves the problem because numbers get "big."
  *   **2 marks:** Distinction between physical impossibility and normative repugnance.
      *   *Error:* Accepting "too many atoms" as a valid ethical refutation.

  **Part (b): The Cost of Averagism (5 marks)**
  *   **2 marks:** Correct identification that 2 people @ 101 beats 10 billion @ 100.
  *   **3 marks:** Explanation of the trade-off (population size penalty/violation of Mere Addition).
      *   *Error:* Calling it "elitist" without explaining the welfare loss of the billions.

  **Part (c): The Lexical Threshold (8 marks)**
  *   **2 marks:** Showing $P^*$ beats $P_\varepsilon$ when $\varepsilon < \tau$ (due to count below threshold).
  *   **2 marks:** Showing RC returns when $\varepsilon > \tau$ (tie-breaker activates Total).
      *   *Error:* Assuming Lexical view kills RC entirely without testing $\varepsilon > \tau$.
  *   **2 marks:** Identification of the discontinuity/cliff at $\tau$ (100 vs 9.9).
  *   **2 marks:** Evaluation of the cliff vs. RC trade-off.
      *   *Error:* Ignoring the cliff edge entirely.

  **Part (d): Critical-Level Utilitarianism (5 marks)**
  *   **2 marks:** Explanation that $\varepsilon < c$ yields negative marginal value.
  *   **2 marks:** Identification that RC relocates to $\varepsilon > c$.
  *   **1 mark:** Identification of the cost (lives $0 < w < c$ are bad to create).
      *   *Error:* Claiming CLU solves RC without mentioning the "sadistic" cost.

  **Part (e): Synthesis (4 marks)**
  *   **2 marks:** Correct identification of required rejection (Continuity or Aggregation).
  *   **2 marks:** Critique of Person-Affecting/Incomparability in choice contexts.
      *   *Error:* Vague hand-waving about "it depends on the theory."

  ***

  # Part 4: Critique & Feedback on Setup

  **1. Under-specified Elements:**
  *   **Ratio Scale Welfare:** You specified welfare is on a ratio scale with 0 as neutral. This is crucial for Critical-Level Utilitarianism (CLU) and the $V_\alpha$ formula. If 0 were arbitrary (interval scale), CLU would collapse into Total Utilitarianism via transformation. You handled this well in the prompt, but ensure students understand *why* ratio scaling matters (i.e., you can't just shift the zero point).
  *   **Lexical Tie-Breaker:** In Part (c), I specified the tie-breaker is Total Welfare. If you leave the tie-breaker undefined, students might assume "lexicographic" means "no comparison possible on tie," which creates incompleteness. By forcing a Total Welfare tie-breaker, you force the RC to return, which is the insight you want.
  *   **"Better Than":** The prompt assumes a strict ordering. If students argue for incomparability in Part (e), ensure the marking scheme rewards the *justification* of incomparability, not just the word.

  **2. The "Fifth Route" (Variable Critical Levels):**
  *   I included **Variable Critical Level Utilitarianism** (e.g., Blackorby, Bossert, Donaldson) in the model answer notes. This is the strongest formal competitor to the four views you listed.
  *   *Mechanism:* $c$ is not fixed but increases with $n$ (e.g., $c(n) = k \cdot n$).
  *   *Benefit:* It avoids the RC (eventually $c > \varepsilon$) and avoids the "sadistic" implication of fixed CLU (because $c$ can be 0 for small populations).
  *   *Cost:* It requires justifying why the critical level depends on population size, which some argue is ad hoc.
  *   *Recommendation:* Keep this as extra credit or a "bonus point" in the synthesis. It separates the PhD students from the undergrads.

  **3. Potential Student Pitfalls:**
  *   **The Damping Illusion:** As you predicted, students will claim $\alpha = 0.5$ solves the RC. The marking scheme penalizes this heavily. They must show $N$ is still *finite*.
  *   **Threshold Blindness:** Students will test the Lexical view only with $\varepsilon < \tau$. They must be forced to test $\varepsilon > \tau$ to see the RC relocate. The question structure (c-i vs c-ii) forces this.
  *   **Physicalism:** Students often conflate "impossible to build" with "ethically false." The question explicitly asks them to distinguish this.

  **4. Refinement on Part (a) Arithmetic:**
  *   I adjusted the arithmetic in the model answer to ensure powers of 10 are clean. $100 / 0.01 = 10^4$. $(10^4)^2 = 10^8$. $10^{10} \cdot 10^8 = 10^{18}$. This is clean enough for a closed-book exam without a calculator, provided they know exponent rules.

  **5. Final Verdict:**
  This question successfully blocks the "survey article" essay. A student cannot write "Parfit argued X" here; they must calculate $N$. If they calculate $N$ correctly, they cannot claim $\alpha < 1$ avoids the RC. If they check the Lexical view above $\tau$, they cannot claim it avoids the RC. It forces engagement with the *structure* of the impossibility theorems rather than the history of them.
