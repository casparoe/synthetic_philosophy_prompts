      *   *My Verdict on Tutor:* It avoids the need for a *predictive* prior sign (which was a vulnerability regarding indeterminism), but it does not eliminate the alternative possibility entirely (the flicker of the decision itself remains). However, I will argue this flicker is not morally significant, so the variant strengthens the Frankfurtian position, even if it doesn't crush PAP completely. Wait, I need to commit. I'll argue that while it avoids the *predictive* requirement, it leaves a 'flicker' that PAP defenders can still cling to, meaning it doesn't decisively settle the debate, though it is an improvement on the original formulation regarding the "prior sign" objection.
