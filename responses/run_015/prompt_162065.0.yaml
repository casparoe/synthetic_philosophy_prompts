answer: |-
  Dear Student,

  It is completely understandable that you found the seminar papers heavy going, as the literature on Frankfurt-style cases is notoriously technical, and your unease with the introductory book's summary is well-founded. While the book gets the basic shape of the argument right, it conflates distinct stages of Frankfurt's work and makes several claims that are either false or significantly overstated within the professional debate. To start with the accurate elements, the book is correct that Frankfurt's primary target is the Principle of Alternative Possibilities, or PAP, which states that an agent is morally responsible only if they could have done otherwise. The description of the case itself, involving Black, Jones, and the monitoring device, is also a standard and acceptable simplification of the thought experiment. However, the book goes wrong when it links this counterexample directly to Frankfurt's theory of second-order volitions. This is a distortion of the philosophical history and logic. Frankfurt's 1969 paper introduces the counterexamples to attack PAP, while his 1971 paper introduces second-order volitions as a positive account of free will. The counterexamples are designed to work independently of his positive theory; they are supposed to show that PAP is false regardless of whether one accepts the hierarchical model of the will. By suggesting the example matters because it establishes the second-order volition account, the book conflates a negative argument against a principle with a positive theory of freedom, which is a significant error even for an introductory text.

  Furthermore, the book's claim that the example establishes that moral responsibility is compatible with determinism is an overstatement that you are right to question. Refuting PAP removes a major premise used by incompatibilists to argue that determinism undermines responsibility, but it does not by itself prove compatibilism. There are incompatibilists, known as source incompatibilists, who agree that PAP is false but still argue that determinism rules out responsibility because it undermines the agent's status as the ultimate source of their action. Therefore, killing PAP does not automatically save compatibilism. Additionally, the book's assertion that defenders of PAP have largely abandoned the principle is simply false. While the debate has shifted, prominent philosophers continue to defend PAP or revised versions of it, often using what is known as the "flicker of freedom" strategy. This strategy argues that even in Frankfurt cases, there remain some alternative possibilities, such as the possibility of trying to choose otherwise or the possibility of the device firing, and that these flickers are sufficient to keep PAP alive. The book presents a settled consensus where there is actually a vibrant and ongoing dispute, and you should treat that claim with skepticism.

  Regarding your tutor's variant, I am prepared to commit to the position that it successfully avoids the need for a prior sign but fails to eliminate alternative possibilities entirely, though it weakens the significance of those possibilities. The standard objection to Frankfurt cases is that for Black to know when to intervene, there must be a prior sign of what Jones will do, which implies that Jones's decision is causally determined by prior events, thereby begging the question against incompatibilists who argue that indeterminism is required for freedom. Your tutor's modification, where the neural events constituting the decision itself trigger the override, bypasses the need for a predictive prior sign because the device reacts to the decision process as it happens rather than predicting it beforehand. This is a genuine improvement because it removes the requirement for infallible prediction, which was a vulnerability in the original formulation when applied to indeterministic worlds. However, this does not mean Jones lacks alternative possibilities altogether. If the neural events constituting the decision to vote otherwise are what trigger the device, then Jones must begin to decide otherwise for the device to activate. This means Jones retains the alternative possibility of initiating a different decision process, even if the final vote is constrained.

  I argue that while this variant leaves a flicker of freedom, it does not save the PAP defender's position in a meaningful way, though I acknowledge this is contested ground. The remaining alternative possibility is merely the possibility of triggering the counterfactual intervener, which does not give Jones the power to bring about a different outcome. For moral responsibility, what matters is the ability to control the outcome, not merely the ability to initiate a futile process. Therefore, while the tutor's variant does not logically eliminate every conceivable alternative possibility, it renders them morally irrelevant. However, I must flag that incompatibilists will dispute this irrelevance, arguing that any alternative possibility, no matter how fleeting, satisfies the condition for PAP and that the presence of the device still implies a deterministic constraint on the actual sequence if it is to be successful. My view is that the variant strengthens the Frankfurtian case by removing the epistemic worry about prediction, but it does not settle the metaphysical debate about determinism. The book was wrong to suggest the debate is over, but your tutor is right to suggest that tweaking the mechanism of intervention can shore up the example against specific technical objections. You should proceed with the understanding that the Frankfurt case is a powerful tool for isolating the source of responsibility from the availability of alternatives, but it is not the final word on compatibilism, nor does it rely on the hierarchical theory of will that your book suggested.

  I hope this helps clarify where the introductory text led you astray and gives you a solid footing for evaluating your tutor's contribution. It is excellent that you are spotting these nuances in your final year, as navigating the gap between popular summaries and technical reality is a key skill in philosophy. Please feel free to reach out if you want to discuss the flicker strategy further, as that is often where the most interesting seminar discussions arise.

  Best wishes with the rest of the course.
