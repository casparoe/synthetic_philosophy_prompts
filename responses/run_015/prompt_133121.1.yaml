      *   *Section 2: The Prayer Scene (III.iii).* Focus on the moral quality of dying. Hamlet wants Claudius damned. This implies death isn't just cessation (Hume) or transition (neutral); it's a moral junction. Hume's framework can't account for the strategic timing of death for spiritual consequences.
      *   *Section 3: The Final Scene & Narrative.* Hamlet accepts death but ensures Horatio tells the story. Hume focuses on the individual's duty. Hamlet focuses on the community's memory. The "ethics of being seen."
      *   *Conclusion:* What does Hamlet add? The asymmetry between self-killing and being killed. The importance of narrative closure. The idea that death is not just a biological end but a dramatic conclusion.

  6.  **Refining the Argument (Self-Correction during drafting):**
