      *   *Check:* Did I address the Prayer Scene specifically regarding the moral quality of dying? Yes, this is key. Hume says suicide is morally neutral regarding God; Hamlet shows killing someone (or oneself) at a specific spiritual moment has cosmic consequences in the play's logic.
      *   *Check:* Did I address the "undiscovered country" as epistemic caution vs. superstition? Yes, framing it as "unknown consequences" rather than "dogmatic fear" strengthens Hamlet's rationality against Hume's charge of superstition.
