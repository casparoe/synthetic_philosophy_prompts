answer: |-
  Dr. Aris Vane didn't trust sensors. Sensors lied, or at least, they told the truth about the wrong things. The math never lied, provided you looked where the sensors werent.

  Her climate model, the Carbon-Expectations Framework, hummed on the triple-monitor setup. It was beautiful. It predicted temperature shifts with ninety-nine percent accuracy, but only because Aris had stopped trying to fix the errors. She had started mapping them.

  Friedman had said the realism of asumptions didn't matter, only the prediction. Aris took that to mean the unreal stuff was just hiding.

  On the screen, the grey patches pulsed. These were the Assumption-Zones. Regions with no data coverage, where the model's wildest guesses became physical law.

  Take Sector 4-G, out in the Nevada desert. The model required perfectly inelastic supply curves to balance the carbon tax variables. In the real world, supply bends. In 4-G, it stood straight up. Aris had sent a drone once. The footage showed chalk dust hovering in the air, drawing vertical lines over the sand dunes. It was von Neumann's ghost, or something like him, enforcing the geometry. You couldn't produce more lithium there because the ghost wouldn't draw the line further right.

  Then there was Sector 9-B, off the coast of Chile. The model assumed agents possessed perfect information and rationality. Impossible, obviously. Except in 9-B, local time ran backwards. Fishermen sold the catch before they hooked it, optimizing their utility because they remembered the choice before they made it. They were fully rational because they lived in the answer key.

  Aris sipped cold coffee and scrolled down the latitude. That's when she saw it.

  A blip. Not a grey zone, but a green one. A town sitting squarely inside a Rationality Pocket near the Arctic circle. The model said everyone there should be maximizing profit with zero friction. No waste, no error, no emotion.

  The town had a name on the satellite overlay: Omission Creek. Population 412.

  If Omission Creek was real, it meant the zone wasn't just a mathematical artifact. It was a place where people lived inside the theory. But the theory only held because no one was looking. The F-twist relied on the assumptions remaining untested.

  Aris hovered her mouse over the command line. *Deploy Ground Sensor.*

  If she sent a team to measure Omission Creek, to put a thermometer in their backward time and a ledger in their rational hands, the observation would collapse the zone. The time would snap forward. The rationality would degrade into human messiness. Her model's predections would shatter. The ninety-nine percent accuracy would drop to nothing.

  But if she didn't measure it, she was leaving four hundred people living in a physics experiment. They were buying bread they hadn't baked, paying for houses they hadn't built, perfectly happy in a loop that only existed because the world looked away.

  The cursor blinked. *Deploy?*

  Aris thought about the ghost in the desert, drawing lines in the dust. She thought about the fishermen selling fish that were still swimming.

  She moved the cursor away from the command. She opened a new file and labeled it *Do Not Open.* Then she dragged the coordinates for Omission Creek into the trash bin and emptied it.

  The model stayed green. The math held. Outside, the rain started falling, perfectly consistent with the forecast, everywhere except where she decided not to look.
