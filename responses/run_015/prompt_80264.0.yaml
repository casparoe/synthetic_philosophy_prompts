answer: |-
  You are right to resist the conclusion that the dispute was merely verbal. Peirce himself renamed his doctrine "pragmaticism" (a name "ugly enough to be safe from kidnappers") specifically to distinguish it from James's "pragmatism."

  The argument your friend presented is seductive because it relies on an equivocation in the word "works." The break happens primarily at **Step (2)** and is cemented at **Step (5)**.

  Here is exactly where the illicit work is done, why the "limit" detail matters, and what you have to give up if you accept your friend's conclusion.

  ### 1. The Break: Step (2) and the Direction of Explanation

  Step (2) states: *The community converges by inquiry, and inquiry keeps the beliefs that "work."*

  This looks innocuous, but it hides a reversal of metaphysical priority.

  *   **For Peirce:** A belief works *because* it is true. Truth is conformity to an independent Reality. Reality is what constrains inquiry and forces the community to converge. "Working" (predictive success) is the *symptom* of having latched onto Reality, but it is not the *definition* of truth.
  *   **For James:** A belief is true *because* it works. There is no "Reality" standing behind the scenes pulling the strings. Truth is a property that ideas acquire when they prove useful to our lives.

  **The Illicit Move:** Your friend's argument assumes that "working" is the common denominator that defines truth for both. But for Peirce, "working" is merely the *criterion* we use to detect truth, whereas for James, "working" is the *nature* of truth itself.

  If you accept Step (2) as your friend frames it, you are forced to abandon Peirce's **Scholastic Realism**. You are agreeing that there is no external reality constraining inquiry, only the internal success of our ideas. Peirce would say that without an external "Secondness" (brute facticity) to push back against us, inquiry would never converge; we would just drift into whatever is most comforting.

  ### 2. The Extensional Counter-Example: Religious Belief

  Step (5) claims the two theories pick out the *same set of truths*. This is empirically false regarding their actual writings.

  *   **James's Case:** In *The Will to Believe*, James argues that religious faith can be "true" for an individual if it satisfies a vital need and live option, even without objective evidence or communal verification. If believing in God helps you live a morally strenuous life, that belief has "cash value." For James, this makes it true (for you).
  *   **Peirce's Case:** Peirce explicitly rejected this. For Peirce, a proposition that cannot, even in principle, be tested by the community of inquirers in the long run is not a meaningful proposition, let alone a true one. A private religious comfort that has no public, observable consequences is, for Peirce, mere sentiment, not truth.

  **The Cost:** If you accept your friend's argument (that the theories are identical), you must assert that Peirce was confused about his own theory. You have to claim that Peirce *should* have accepted James's religious exceptions if his theory was really just about "what works." But Peirce's entire point was that science requires the suppression of individual "will" in favor of communal method. To merge the theories is to erase Peirce's distinction between **private sentiment** and **public fact**.

  ### 3. The "Limit" vs. The "Now"

  You mentioned the "unlimited time" detail, and you are right to suspect it matters. It isn't just a technicality; it changes the modal status of truth.

  *   **Peirce (The Limit):** Truth is *destined*. It is in the future perfect tense. "Truth *will have been* found." We never possess truth now; we only hope our current methods are leading us toward it. This makes truth **normative**. It stands as a judge over our current beliefs.
  *   **James (The Process):** Truth *happens* to an idea. It is made true by events. It is in the present or past tense. "This idea *is* working now." This makes truth **descriptive** of a current psychological/experiential state.

  **Why this blocks the argument:**
  If truth is what works *now* (James), a belief can be true today and false tomorrow if it stops working (e.g., a Newtonian physics model that works for building bridges but fails at quantum levels).
  If truth is the *limit* (Peirce), the Newtonian model was never strictly "true"; it was an approximation moving toward the final opinion.

  If you accept your friend's Step (6), you collapse the **normative ideal** (Peirce) into the **experiential fact** (James). You lose the ability to say, "This belief works for me now, but it is still false because it contradicts the long-run evidence." Peirce needs that distinction to explain scientific error; James struggles to accommodate it without saying the belief was "true then but isn't now."

  ### 4. Summary of the Cost

  To accept your friend's argument that the dispute was merely verbal, you must pay the following philosophical costs:

  1.  **Abandon Realism:** You must deny that there is a Reality independent of human thought that constrains inquiry. You must accept that truth is entirely dependent on human satisfaction.
  2.  **Eliminate Private/Public Distinction:** You must agree that private, unverifiable comforts (like religious faith) are the same kind of "truth" as public, verifiable scientific facts.
  3.  **Lose Normativity:** You must give up the idea that Truth is a standard we *ought* to aim for but haven't reached. Instead, truth becomes whatever reward we are currently cashing in.

  ### Conclusion

  The argument breaks at **Step (3)**. It infers that because inquiry *selects* for beliefs that work, the *definition* of truth is "what works."

  Peirce would say: "Inquiry selects beliefs that work because they match Reality. Reality is the definition of truth."
  James would say: "Inquiry selects beliefs that work. Working is the definition of truth."

  They are not describing the same thing with different words. They are disagreeing about whether truth is **discovered** (Peirce) or **manufactured** (James). If you want to preserve the substantive disagreement, you hold the line on Realism: Peirce believes truth is anchored by the universe; James believes truth is anchored by human experience. That is not a verbal dispute; it is a metaphysical one.
