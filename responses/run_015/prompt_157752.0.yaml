prompt: |-
  I've been asked to write down my real position on animals rather than repeat an organisation's line — I sit on the board of a large municipal animal shelter and do volunteer policy work for a farmed-animal welfare group, and the two roles keep pulling me in different directions. Before I present it to either group I'd like an audit of whether it hangs together. Roughly where I've landed:

  1. Speciesism is unjustified. Sentience is what makes a being count morally at all; once a being counts, its interests count equally regardless of species, and psychological capacities rather than species membership are what track the content of what we owe.

  2. Full protection against being killed attaches only to persons — beings with an extended self-conception, plans and projects that reach into the future. Non-persons can permissibly be killed painlessly and replaced by another equally well-off non-person when doing so produces more welfare, so a genuinely high-welfare farm is not objectionable in the killing itself, only in how the animals live.

  3. It is seriously wrong to kill a human being who is not a person — an infant, or an adult with profound cognitive disability — even where a painless death and a replacement would produce more welfare. I don't want this to rest on the feelings of relatives or on how such a practice would affect third parties; I think the wrong is to the individual killed.

  4. Suffering is what makes factory farming a catastrophe, and the sheer numbers involved swamp anything shelters deal with, so the money should go there rather than to companion-animal rescue.

  5. Wild-animal suffering is a serious problem, but we have no duty to intervene against predation, and in practice I oppose intervention programmes even where they look safe and cheap. I don't want this to rest on the value of wildness or naturalness, which I think is empty.

  6. We owe more to domesticated animals — the ones we bred into existence and made dependent on us — than to wild ones, and this isn't only a matter of how much good we can do per dollar; it is about what we have already done to them.

  7. Concretely: I think our shelter is right to spend its budget on neutering and rehoming dogs and cats, and that it would be wrong to shut it down and send the money to a broiler-welfare campaign, even though that would do far more good per dollar.

  What I can't locate is where this package breaks. Which of these commitments actually pull against which others, and which apparent conflicts dissolve once the terms are made precise? For each real conflict, tell me what would have to give and what the cheapest repair costs me. Rank the problems by severity rather than treating them as equally bad, and say which single revision would clean up the most.
reasoning: |-
  Here's a thinking process that leads to the audit of the user's ethical position:

  1.  **Analyze the Request:**
      *   **User:** Board member of a municipal animal shelter + volunteer policy worker for a farmed-animal welfare group.
      *   **Task:** Audit their personal ethical position on animals for internal consistency.
      *   **Input:** 7 specific claims/commitments.
      *   **Output:** Identify conflicts (real vs. apparent), rank by severity, suggest repairs/costs, and identify the single most effective revision.
      *   **Constraint:** Do not repeat an organization's line; focus on philosophical coherence.

  2.  **Deconstruct the 7 Commitments:**
      *   *C1 (Speciesism/Sentience):* Anti-speciesist. Sentience = moral count. Equal consideration of interests. Psychological capacities determine *content* of obligations.
      *   *C2 (Personhood/Killing):* Only "persons" (future-oriented self-conception) have a right to life. Non-persons can be replaced (Replaceability Argument). High-welfare farming is okay re: killing, not re: living conditions.
      *   *C3 (Human Non-Persons):* Killing human non-persons (infants, severely disabled) is seriously wrong, even if painless + replacement. Wrong is *to the individual*. Not based on relatives/society.
      *   *C4 (Suffering/Priority):* Factory farming suffering swamps shelter issues. Money *should* go to farmed animals (consequentialist priority).
      *   *C5 (Wild Animals):* Wild suffering is real. No duty to intervene against predation. Oppose intervention even if safe/cheap. Not based on "naturalness."
      *   *C6 (Special Obligation/Domestication):* We owe more to domesticated animals (dependency/creation) than wild ones. Not just efficiency, but backward-looking duty.
      *   *C7 (Concrete Action/Shelter):* Shelter should spend on neutering/rehoming. Wrong to shut shelter for broiler campaigns, *even though* broiler campaigns do more good per dollar.

  3.  **Initial Scan for Tensions:**
      *   *C1 vs. C3:* C1 says species doesn't matter, only psychology. C3 says human non-persons have rights that non-human non-persons (C2) don't. This looks like classic speciesism unless there's a hidden variable.
      *   *C2 vs. C7:* C2 implies replaceability is okay for non-persons. C7 says spend money on keeping existing non-persons (pets) alive rather than reducing suffering of farmed non-persons. C4 says money *should* go to farmed animals. C7 says *don't* do that.
      *   *C4 vs. C7:* C4 says money *should* go to farmed animals (consequentialist). C7 says shelter should stay open (deontological/special obligation).
      *   *C5 vs. C1/C4:* If suffering matters most (C1, C4), why ignore wild suffering (C5)? C5 explicitly rejects "naturalness" as a justification, leaving a gap.
      *   *C6 vs. C4:* C6 justifies special duty to domestics. C4 prioritizes farmed animals based on scale of suffering. C7 resolves this in favor of C6 locally, but admits C4 globally.

  4.  **Deep Dive into Specific Conflicts:**

      *   **Conflict A: The Human Exception (C1 vs. C3 vs. C2).**
          *   *Issue:* C1 says species doesn't matter. C2 says non-persons are replaceable. C3 says human non-persons are *not* replaceable.
          *   *Analysis:* This is the "Marginal Cases" argument. If a pig has similar psychology to a human infant, and species doesn't matter (C1), why is killing the infant wrong (C3) but killing the pig okay (C2)?
          *   *Severity:* **Critical.** This undermines the core anti-speciesist claim (C1).
          *   *Repair:* Either accept species matters (abandon C1), accept infants are replaceable (abandon C3 - very costly socially/personally), or find a relevant difference between human non-persons and animal non-persons (hard to do without speciesism). Or, reframe C3 as a "human solidarity" duty which *is* species-relative but justified differently.

      *   **Conflict B: Consequentialism vs. Special Obligations (C4 vs. C7 vs. C6).**
          *   *Issue:* C4 is pure utilitarianism (suffering numbers win). C7 admits broiler campaigns do more good but rejects shifting funds. C6 justifies this via "special obligation" to domestics.
          *   *Analysis:* C6 saves C7 from contradicting C4, *but* C4 says money "should go there." C7 says "wrong to shut it down." If C6 is strong enough to override C4, then C4 needs qualification. C4 implies a global priority; C7 implies a local constraint.
          *   *Severity:* **High.** It creates a split between "what I believe is best overall" and "what I do locally." It's hypocritical unless C6 is robust.
          *   *Repair:* Qualify C4. "All else equal, money should go to farmed animals, *unless* special obligations (C6) apply."

      *   **Conflict C: Wild Suffering (C1/C4 vs. C5).**
          *   *Issue:* If sentience/suffering is what counts (C1) and numbers swamp everything (C4), wild suffering is huge. C5 says don't intervene. Justification "naturalness" is explicitly rejected.
          *   *Analysis:* Why not intervene? Risk/Epistemic humility? C5 says "even where they look safe and cheap." This leaves C5 hanging. If suffering matters, and we can stop it cheaply/safely, why not?
          *   *Severity:* **Medium-High.** It looks like an inconsistency in the weighting of suffering.
          *   *Repair:* Introduce an epistemic constraint or a "do no harm" agency constraint. We caused domestic suffering (C6); we didn't cause wild predation.

      *   **Conflict D: Replaceability and Shelter Work (C2 vs. C7).**
          *   *Issue:* C2 says painless killing + replacement of non-persons is permissible. C7 says spend budget on *preventing* killing (rehoming/neutering to avoid euthanasia).
          *   *Analysis:* If C2 is true, why is shelter euthanasia bad? If a dog is a non-person, and we can replace it with another happy dog, why spend money saving *this* dog?
          *   *Severity:* **Medium.** C6 (special obligation to *this* animal/domesticated class) overrides C2's permissibility. But it makes the shelter's work less about "right to life" and more about "welfare + commitment."
          *   *Repair:* Clarify that shelter work is about fulfilling C6 (duty to existing domestics) not vindicating a right to life (which C2 denies them).

  5.  **Ranking and Synthesis:**

      *   *Rank 1 (Fatal):* C1 vs. C3 (The Human Non-Person Problem). This breaks the "Anti-Speciesist" claim.
      *   *Rank 2 (Structural):* C4 vs. C6/C7 (The Priority Problem). This breaks the "Effective Altruist" flow.
      *   *Rank 3 (Theoretical):* C5 (The Wild Suffering Gap). Lacks a positive justification.

      *   *Single Best Revision:* Modify C1 or C3. C3 is deeply held (protecting vulnerable humans). C1 is the philosophical framework. The tension is that C1 is too strong ("interests count *equally* regardless of species").
      *   *Actually, looking closer:* The biggest practical friction for the user is between their Shelter role (C7) and their Farmed Animal role (C4). But the biggest *philosophical* hole is C1/C2/C3.
      *   *Wait, C2 vs C7 is also big.* If non-persons are replaceable (C2), why is the shelter's job to save *individual* lives? C6 answers this (special duty).
      *   *The "Single Revision":* The user needs to reconcile C1 and C3. The cheapest repair is to modify C1. Instead of "interests count equally regardless of species," it should be "interests count equally regarding similar psychological capacities, *subject to special relational obligations*." This allows C3 (human solidarity) and C6 (domestication contract) without abandoning the core sentience view.
      *   *Alternative Single Revision:* Drop C2's strong replaceability. If you protect human non-persons because of "social bonds" or "kind," why not animals? But C3 explicitly says "wrong to the individual."
      *   *Let's look at C5 again.* C5 rejects naturalness. Why oppose intervention? Usually, it's epistemic (we'll make it worse). But C5 says "even if safe." This implies a deontological constraint on agency. We aren't responsible for nature. This aligns with C6 (we *are* responsible for domestics). So C5 + C6 form a coherent "Responsibility" view.
      *   *So the main conflict is C1/C2/C3.*

  6.  **Drafting the Audit:**
      *   *Tone:* Rigorous, philosophical, respectful, direct.
      *   *Structure:*
          1.  Executive Summary (The Verdict).
          2.  The Critical Conflict (Human Non-Persons).
          3.  The Strategic Conflict (Resource Allocation).
          4.  The Theoretical Gap (Wild Suffering).
          5.  The Single Best Revision.
      *   *Refining the "Human Non-Person" conflict:* This is the "Argument from Marginal Cases." If C1 is true, C3 cannot be true without modification. If C3 is true, C1 is false (or needs a huge caveat).
      *   *Refining the "Resource Allocation" conflict:* C4 says "money should go there." C7 says "wrong to shut shelter." This is a clash between Act Utilitarianism (C4) and Associative Duties (C6). It's resolvable by prioritizing C6 as a side-constraint on C4.
      *   *Refining the "Wild Suffering" conflict:* C5 needs a reason. "Responsibility" (from C6) is the key. We created domestics; we didn't create wild predation.

  7.  **Final Polish:**
      *   Ensure I answer the specific prompt: "Rank the problems by severity," "say which single revision would clean up the most."
      *   Check for clarity on "Replaceability." C2 allows replacement. C7 prevents replacement (euthanasia). C6 justifies C7.
      *   Make sure to highlight that C1 is the weak link holding the whole thing together.

      *(Self-Correction during drafting)*: I need to be careful not to tell them what to believe, but where the logic breaks.
      *   *Break 1:* C1 claims species doesn't matter. C3 protects humans specifically. This is a direct contradiction unless "species" is a proxy for something else (like "community membership").
      *   *Break 2:* C4 says maximize good. C7 says don't maximize good locally. C6 justifies this, but C4 needs to be downgraded from a strict "should" to a "prima facie should."
      *   *Break 3:* C5 needs the "Responsibility" justification from C6 to make sense.

      *   *Best Revision:* Qualify C1. Acknowledge that while sentience grants moral *status*, relational duties (C6) and species-relative solidarity (C3) affect moral *priorities* without denying status. This saves C3, C6, C7 without abandoning the core sentience focus of C1/C2/C4.

      *   *Wait, one more thing:* C2 says killing non-persons is okay if replaced. C7 says shelter should save lives. If C2 is true, saving a dog's life isn't inherently valuable unless C6 applies. C6 does apply. So C2 + C6 + C7 is consistent. The problem is C2 + C3.

      *   *Okay, let's finalize the ranking.*
          1.  **C1 vs C3 (The Speciesism Charge):** This is the most damaging philosophically.
          2.  **C4 vs C7 (The Hypocrisy Charge):** This is the most damaging practically/professionally.
          3.  **C5 (The Justification Gap):** Theoretical weakness.

      *   *Single Revision:* Modify C1 to allow for "Special Obligations" that override equal consideration in specific contexts.

  8.  **Final Review against constraints:**
      *   Audit whether it hangs together.
      *   Identify conflicts.
      *   Rank by severity.
      *   Identify single revision.
      *   Tone: Analytical, not preachy.

      *(Final thought on C5)*: C5 says "no duty to intervene against predation." If C1 says sentience counts, and C4 says suffering numbers matter, C5 is a huge outlier. The "Responsibility" argument (C6) fixes this. We are responsible for domestics, not wild animals. So C5 relies on C6. If C6 holds, C5 holds.

      *(Final thought on C2 vs C7)*: If dogs are non-persons (C2), they are replaceable. Why spend money neutering/rehoming (C7)? Because of C6 (we made them dependent). So C2+C6+C7 works.
      The real clash is C1 ("species doesn't matter") vs C3 ("humans matter more").

