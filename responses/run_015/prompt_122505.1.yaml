          *   *The Risk:* Teaching it *only* as source criticism risks missing the existential point. The film isn't just "sources are hard"; it's "truth is painful, and we lie to survive."
          *   *Synthesis:* Use the film to show the *limits* of source criticism. Source criticism can reveal *why* they lied, but it cannot reconstruct the "true" event. That is the crucial lesson for historians: knowing the bias doesn't always give you the fact.

  4.  **Refining the Tone:**
