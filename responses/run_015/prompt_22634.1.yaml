answer: |-
  Here is a draft of ten interview questions designed to probe the defensibility and implications of metaphysical deflationism. They are structured to move from the scope of the view to specific hard cases, then to the normative stakes, and finally to falsifiability.

  The three required sections (Math/Fact, Fine/Dogmatism, Stakes) are highlighted, with the requested follow-ups keyed to the respondent's most probable defensive moves.

  ### 1. The Boundary Question
  "Let's begin with the scope of your view. You argue that many metaphysical disputes are merely verbal. But surely not *all* disagreements are verbal; if I say the cat is on the mat and you say it isn't, one of us is wrong about the world. Where exactly do you draw the line? What is the criterion that separates a substantive disagreement about reality from a merely verbal disagreement about frameworks?"

  ### 2. The "Hard Case" of Mathematics (Requirement A)
  "Consider a case that looks like a hard fact: the question of whether there are infinitely many numbers. A Platonist says 'yes, objectively,' and a nominalist says 'no, there are only numerals.' On your view, is this a substantive disagreement about the structure of reality, or is this also a verbal dispute? If it is verbal, how do you diagnose it as such without simply stipulating that 'existence' means something different for each side?"

  ### 3. Follow-up on Mathematics (Requirement A)
  *(Use this if she argues that we can distinguish verbal from substantive disputes by looking at "conceptual roles" or "charitable interpretation.")*
  "You suggest we look at the conceptual roles or apply a principle of charity to see that they are talking past each other. But who gets to decide what the 'correct' conceptual role is? If the Platonist insists that their concept of 'number' captures the genuine structure of arithmetic, aren't you just asserting your own conceptual framework as the neutral arbiter? How is that not itself a substantive metaphysical claim?"

  ### 4. The Dogmatism Worry (Requirement B)
  "This brings us to a worry often raised by Kit Fine. He suggests that if we claim to know which disputes are merely verbal, we are claiming access to 'conceptual truths' that our opponents might be mistaken about. Doesn't this risk a kind of dogmatism? If you can declare any stubborn disagreement 'verbal' by appealing to hidden conceptual truths, doesn't that insulate your view from criticism on demand?"

  ### 5. Follow-up on Dogmatism (Requirement B)
  *(Use this if she replies that conceptual truths are grounded in ordinary usage or linguistic practice.)*
  "You're grounding these truths in usage or practice. But metaphysical language is often technical and diverges from ordinary usage. If a metaphysician argues that 'composition is universal,' they are explicitly revising ordinary concepts. If you tell them they are wrong because of how *ordinary* people use words, aren't you begging the question against the very technical project they are undertaking?"

  ### 6. The Question of Stakes (Requirement C)
  "Let's step back and look at the value of the field. If these disputes are not about the world—if there is no fact of the matter about whether universals are real—then what is actually at stake in the disagreement? If it's not truth, is it just aesthetics? Why should we care which linguistic framework a philosopher adopts?"

  ### 7. Follow-up on Stakes (Requirement C)
  *(Use this if she argues that the stakes are "pragmatic" or that one framework is more "useful" than another.)*
  "You say the choice is pragmatic or about utility. But metaphysicians often describe their work as a quest for fundamental reality, not just a search for useful tools. If you tell them they are actually just choosing tools, aren't you saying their entire sense of discovery is an illusion? Is a view that renders the phenomenology of metaphysical inquiry misleading really a charitable interpretation?"

  ### 8. The Science Constraint
  "Physicists seem to make substantive claims about the world—about quarks, fields, and spacetime—that don't look merely verbal. How does your view accommodate the natural sciences? If metaphysics is just about choosing descriptions, does that make metaphysics subordinate to physics, or does it mean that even physical ontology is just a matter of choosing a convenient framework?"

  ### 9. The Prescription for the Field
  "If your view is correct, it seems to imply that a large portion of contemporary metaphysics is misguided. What is the positive project you are offering? Should metaphysicians stop asking whether things exist and start asking only about which concepts are most useful? What does a 'deflationary' metaphysics department actually look like?"

  ### 10. The Falsifiability Question
  "Finally, a question on the resilience of your own position. What kind of evidence or argument would change your mind? Is there a specific metaphysical dispute that, if proven to be substantive, would force you to abandon deflationism? Or is this a methodological stance that is insulated from empirical or logical refutation?"
