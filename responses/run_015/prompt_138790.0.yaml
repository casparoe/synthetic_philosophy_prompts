answer: |-
  # RELEASE EVIDENCE GATE: CIRCULARITY CHECK (v1.0)

  **Purpose:** Determine if a tool's report counts as evidence that the system works, or if the tool is just telling you what it wants to hear.
  **Operator:** On-call Engineer / Release Manager
  **Timebox:** 10 Minutes
  **Rule:** If you cannot answer a question, the answer is "No."

  ### THE PROCEDURE

  **Q1: The Answer Key Test**
  *Who defined what a "Pass" looks like?*
  *   **Pass:** A human, a separate system, or a previous stable version defined the expected result.
  *   **Fail:** The code being tested generated the expected result, or the tool being tested defines its own success criteria without external input.
  *   **Action:** If **Fail**, go to Q2. If **Pass**, skip to Q4.

  **Q2: The Silent Death Test**
  *If the system was completely broken right now, would this tool definitely report "Fail"?*
  *   **Pass:** Yes. The tool runs from outside the system, or checks a physical constraint (e.g., "file exists," "port open") that the system cannot fake.
  *   **Fail:** No. The system could be dead, partitioned, or looping, and the tool would still report "Green" (e.g., the tool is running *on* the system it is checking).
  *   **Action:** If **Fail**, **STOP. EVIDENCE INVALID.** (Do not use this check for release sign-off).
  *   **Note:** You may keep the tool for debugging, but it counts as *zero* evidence for shipping.

  **Q3: The Second Opinion Test** (Only if Q1 was Pass)
  *Do we have a different, unrelated way to verify this specific claim?*
  *   **Pass:** Yes. (e.g., Linter says clean + Manual spot check; Compiler passes tests + Runs on benchmark suite).
  *   **Fail:** No. This is the only signal we have.
  *   **Action:** If **Fail**, proceed to Q4. If **Pass**, Evidence is **VALID**.

  **Q4: The Blast Radius Handoff**
  *If this evidence is wrong and we ship a bug, what happens?*
  *   **Low Risk:** Minor inconvenience, easy rollback, no data loss. -> **ACCEPT RISK.** (Sign off, but log the debt).
  *   **High Risk:** Data loss, security exposure, prolonged outage, compliance violation. -> **ESCALATE.** (Wake the Platform Lead. Do not sign off).

  ---

  ### CASE STUDIES (Applied)

  **1. The Static Analyzer (Self-Generated Expected Results)**
  *   **Q1 (Answer Key):** **Fail.** The previous version of the tool generated the "truth" the new version is measured against. Drift is undetectable.
  *   **Q2 (Silent Death):** **Fail.** If the analyzer stops detecting bugs, it simply updates the "expected results" to match the new bugs.
  *   **Verdict:** **STOP. EVIDENCE INVALID.**
  *   **Action:** Delete this check from the release gate immediately.

  **2. The Cluster Health Check ("All Green" while dead)**
  *   **Q1 (Answer Key):** **Fail.** The cluster reports its own health.
  *   **Q2 (Silent Death):** **Fail.** If the monitoring agent dies or gets network-partitioned, it stops sending data. The dashboard interprets "no data" as "no errors" or caches the last "Green" state.
  *   **Verdict:** **STOP. EVIDENCE INVALID.**
  *   **Action:** This check cannot be used as a release gate. It must be replaced by an *external* heartbeat (a script running outside the cluster that pings it).

  **3. The Self-Hosting Compiler (Compiles itself + passes tests)**
  *   **Q1 (Answer Key):** **Fail.** The compiler defines the output.
  *   **Q2 (Silent Death):** **Fail.** A bug in code generation could theoretically be masked by a bug in the test runner.
  *   **Q3 (Second Opinion):** **Pass.** We run the compiler on third-party open-source projects with known binaries.
  *   **Q4 (Blast Radius):** **High.** Broken compiler breaks everything.
  *   **Verdict:** **VALID (Conditional).** The self-host is not the evidence; the third-party build is. The self-host is just a sanity check.

  ---

  ### HOW TO ARGUE FOR DELETING A CHECK (The "Green Dashboard" Problem)

  When you tell the team the Cluster Health Check is invalid evidence, they will say: *"But it's been green for 6 months! You're breaking our workflow."*

  **Do not argue about the tool's quality.** Argue about the *value of the signal*.

  **Say this:**
  > "This isn't about the tool being broken. It's about the signal being coupled to the failure mode. If the cluster dies in way X, this check dies in way X. That means when we need this check most, it is guaranteed to lie to us.
  >
  > Right now, this check gives us **False Security**. It makes us feel safe when we aren't. In a post-mortem, 'The dashboard said green' is not a defense; it's an admission that we didn't have a way to know the truth.
  >
  > I am not deleting the dashboard. I am removing its ability to block a release. If you want it back in the gate, we need an external heartbeat script. Until then, relying on this is negligence."

  **The Compromise:** Keep the dashboard for debugging, but remove the "Must Be Green" requirement for shipping. Replace it with "External Ping Must Succeed."

  ---

  ### LIMITATIONS (What This Procedure Cannot Tell You)

  1.  **It Does Not Prove Truth:** Passing this checklist means your evidence is *structurally sound*, not that your code is bug-free. You can have independent, non-circular evidence that is simply wrong (e.g., the external heartbeat script has a bug).
  2.  **It Does Not Solve "Unknown Unknowns":** This checks for circular logic, not for gaps in coverage. You can perfectly verify the wrong thing.
  3.  **It Relies on Honesty:** If an engineer lies on Q2 ("No, it can't fake a pass"), this procedure will validate bad evidence. It requires a culture where admitting "I don't know" is safe.
  4.  **It Is Not Security:** This assumes bugs, not attackers. An attacker can subvert independent checkers. (See Security Review Doc v4.2).
  5.  **It Kicks the Can on Risk:** Q4 explicitly hands the decision to a human. This procedure does not tell you how much risk is acceptable; it only tells you when you are flying blind.
