answer: |-
  **Practice Exam Question: Moral Psychology**
  **Time Allowed:** 45 Minutes
  **Topic:** Weakness of Will (Akrasia) and Hyperbolic Discounting

  **Question:**
  Philosophers often employ the economic model of hyperbolic discounting to explain weakness of will. This model suggests agents disproportionately value immediate rewards over future benefits, leading to preference reversals over time. However, a central philosophical puzzle concerns *synchronic* akrasia: cases where an agent violates their own best judgment at a single moment without any change in temporal proximity.

  Critically evaluate the explanatory power of hyperbolic discounting regarding weakness of will. Specifically, argue whether hyperbolic discounting successfully explains synchronic akrasia or whether it merely models diachronic preference reversal, thereby redescribing rather than solving the philosophical problem. Take a definite position on this claim, defend it with explicit reasoning, and address one serious objection to your view.

  ***

  **Model Answer**

  Hyperbolic discounting describes a cognitive bias where agents value rewards differently depending on their proximity to the present. While this model effectively predicts diachronic preference reversal, it fails to explain synchronic akrasia. Consequently, hyperbolic discounting redescribes the timing of weakness but does not explain the violation of present best judgment.

  To see this, we must distinguish diachronic from synchronic weakness. Diachronic weakness involves a change in preference over time: an agent plans to diet tomorrow but eats cake today. Synchronic weakness occurs when an agent, at time *t*, judges that action *A* is best overall, yet intentionally performs action *B* at that same time *t*. The philosophical puzzle of akrasia hinges on this synchronic violation of rationality—how can one intentionally act against what one currently believes is best?

  Hyperbolic discounting mechanistically predicts that as a reward becomes immediate, its subjective value spikes disproportionately compared to future rewards. This explains why an agent prefers salad on Monday for Tuesday's lunch, but prefers cake on Tuesday for Tuesday's lunch. This is a diachronic shift in preference driven by temporal proximity. However, this model assumes the agent's judgment tracks their discounted preference. If the agent chooses cake at time *t*, the model implies they simply *prefer* cake at time *t*.

  My thesis is that hyperbolic discounting cannot explain synchronic akrasia because it dissolves the conflict required for weakness of will. If the model holds, the agent at time *t* is simply maximizing their current discounted utility. They are not acting against their best judgment; their best judgment has shifted to align with the immediate temptation. Therefore, the model explains impulse control failures regarding the future, but it eliminates the possibility of acting against one's present best judgment. It offers a psychological mechanism for preference change, not an account of irrational agency at a single time slice.

  A serious objection is that hyperbolic discounting creates a conflict between "higher-order" long-term preferences and "lower-order" immediate impulses, preserving the synchronic conflict. The objector argues that even if the immediate value spikes, the agent still judges the long-term goal as better overall at time *t*.

  This objection fails because it conflates valuation with judgment. If the hyperbolic curve dictates choice, the agent's revealed preference at time *t* is the immediate reward. To claim they still judge the long-term goal as better requires positing a judgment disconnected from their motivational structure. If the discounting model is true, the "best judgment" at time *t* is actually to eat the cake, given the skewed valuation. Thus, the model reduces akrasia to a calculation error or a preference shift, not a violation of rational authority. Hyperbolic discounting explains why we change our minds, but not how we act against them without changing our minds.

  ***

  **Marking Scheme**
  **Total Points:** 20 (5 Criteria × 4 Points Each)

  **1. Distinguishing Synchronic from Diachronic Weakness (4 Points)**
  *   **Full Credit (4):** Clearly defines synchronic akrasia (violating present judgment at time *t*) versus diachronic weakness (preference change over time).
  *   **Adequate (2):** Mentions the difference but lacks precision regarding the "time slice" element.
  *   **Typical Failure (0-1):** Treats all weakness as "giving in to temptation" without distinguishing whether the judgment itself changed or was violated.

  **2. Identifying What Hyperbolic Discounting Mechanistically Predicts (4 Points)**
  *   **Full Credit (4):** Correctly explains that HD predicts value spikes for immediate rewards, leading to preference reversals as time passes.
  *   **Adequate (2):** States HD involves valuing the present more but misses the mechanism of preference reversal.
  *   **Typical Failure (0-1):** Describes HD vaguely as "being impatient" without linking it to valuation curves or preference shifts.

  **3. Stating a Clear Thesis with Reasons (4 Points)**
  *   **Full Credit (4):** Takes a definite stance (e.g., HD fails to explain synchronic akrasia) and provides explicit reasoning (e.g., HD aligns judgment with preference, eliminating the conflict).
  *   **Adequate (2):** Takes a stance but reasoning is vague or relies on intuition rather than the model's implications.
  *   **Typical Failure (0-1):** Hedges ("both sides have points") or summarizes views without arguing for a specific conclusion.

  **4. Engaging an Objection (4 Points)**
  *   **Full Credit (4):** Raises a plausible counter-argument (e.g., higher-order vs. lower-order conflict) and rebuts it effectively.
  *   **Adequate (2):** Raises an objection but the rebuttal is weak or unrelated to the main thesis.
  *   **Typical Failure (0-1):** Mentions an objection without responding, or raises a "straw man" objection that is easily dismissed.

  **5. Avoiding the Error of Treating All Weakness as Future-Oriented (4 Points)**
  *   **Full Credit (4):** Explicitly avoids collapsing synchronic cases into diachronic self-control problems; acknowledges the specific puzzle of acting against *present* judgment.
  *   **Adequate (2):** Attempts to address this but occasionally slips into treating the synchronic case as merely a future planning failure.
  *   **Typical Failure (0-1):** Assumes all akrasia is about failing to stick to future plans, missing the prompt's core constraint about synchronic violation.
