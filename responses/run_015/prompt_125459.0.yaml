answer: |-
  **Course:** PHIL 450: Metaphysics and Philosophy of Language
  **Assessment:** Take-Home Final Examination
  **Time Allowed:** 90 Minutes
  **Word Limit:** 1000–1200 words

  ### Essay Question

  **The Scenario: Institutional Dissolution**
  Consider the Philosophy Department at University X. Over four fiscal years, it undergoes the following incremental changes:
  1.  **Year 1:** The department loses authority over tenure reviews to a central college committee.
  2.  **Year 2:** The department loses veto power over curriculum changes.
  3.  **Year 3:** The department loses budget autonomy; funds are allocated directly to individual faculty.
  4.  **Year 4:** The department loses its physical building; faculty are dispersed across campus.
  At the end of Year 4, only an informal research network of the original faculty remains.

  **The Prompt**
  Construct a Sorites series based on this dissolution. Is there a precise fact of the matter regarding the exact step at which the department ceases to exist? Defend **either** Epistemicism **or** Supervaluationism as the correct account of this case. Your essay must:
  1.  Explain how your chosen view handles the Tolerance Principle within this specific series.
  2.  Evaluate whether treating "department" as a term dependent on *collective intentionality* (shared governance goals) rather than a *physical aggregate* (office space) introduces a distinct layer of vagueness.
  3.  Critically assess whether Supervaluationism's strategy of "admissible precisifications" successfully avoids sharp boundaries in this institutional context, or whether it covertly reintroduces them.
  4.  If arguing for Epistemicism, explain whether the unknown sharp boundary avoids or merely relocates the paradox.

  Do not provide general histories of the theories. Focus exclusively on their application to the mechanics of institutional existence and collective intentionality.

  ***

  ### Model Answer

  **Title:** Semantic Indecision and the Vanishing Department

  The dissolution of the Philosophy Department generates a Sorites paradox wherein the predicate "is a department" appears tolerant to small changes in governance structure. If losing tenure authority does not destroy the department, and losing curriculum veto does not destroy the department, classical logic compels us to accept that the informal network remaining in Year 4 is still a department. This is counterintuitive. To resolve this, I defend **Supervaluationism**, arguing that the vagueness here is semantic rather than ontological, though the collective-intentional nature of the entity complicates the range of admissible precisifications.

  The core of the Supervaluationist response lies in rejecting the Tolerance Principle without accepting a single sharp boundary. In this institutional context, the Tolerance Principle claims that if a body with governance structure *n* is a department, a body with structure *n-1* is also a department. Supervaluationism rejects this by asserting that "department" is semantically indecisive. There is no single extension for the term; rather, there is a set of "admissible precisifications." A statement is super-true if it is true on all admissible precisifications, super-false if false on all, and lacking a truth value if it varies between them.

  Applied to the dissolution scenario, there is no single year where the department definitely ceases to exist. On one admissible precisification, the loss of budget autonomy (Year 3) marks the end; on another, the loss of physical space (Year 4) marks the end. Because "department" is vague, there is no fact of the matter about which precisification is the "correct" one. Consequently, the statement "The department ceased to exist in Year 3" is neither true nor false. This preserves classical logic for sharp cases while allowing truth-value gaps for borderline cases, avoiding the commitment to a magical moment of ontological death.

  However, the prompt requires us to consider whether "department" functions as a physical aggregate or a product of collective intentionality. If a department were merely a physical aggregate (like a heap of sand), precisifications would rely on spatial or material thresholds. But a department is constituted by *we-intentions*—shared goals regarding governance and teaching. This introduces a distinct layer of vagueness. The dissolution of governance structures erodes the content of the collective intention before it erodes the physical group. In Year 1, when tenure authority is lost, the *object* of the collective intention changes.

  This creates a tension for Supervaluationism. For a precisification to be "admissible," it must respect the usage of the term. If the term "department" is inextricably linked to specific intentional states (e.g., "the body that hires faculty"), then precisifications that count the Year 4 network as a department might be inadmissible because the necessary intentional content is gone. Conversely, if the intention persists informally, precisifications counting it as a department remain admissible. The vagueness, therefore, is not just about the number of powers lost, but about the threshold of shared intention required to sustain the entity. Supervaluationism handles this by treating the criteria for collective intention as part of the semantic rules subject to indecision.

  The crucial objection, however, is whether this strategy covertly reintroduces sharp boundaries. Critics argue that the boundary between "admissible" and "inadmissible" precisifications is itself sharp. In the institutional case, is there a sharp line between a precisification that respects the meaning of "department" and one that does not? If the set of admissible precisifications is sharply bounded, then higher-order vagueness is denied. If I claim it is indeterminate whether Year 3 is the end, but determinate that Year 1 is not, I have drawn a sharp boundary around the vagueness itself.

  In this context, Supervaluationism risks claiming that while it is vague whether the department exists, it is *precise* which interpretations of "department" are allowed. This seems implausible for institutional kinds. The meaning of "department" evolves with the institution. A rigid distinction between admissible and inadmissible interpretations imposes a semantic precision that mirrors the ontological precision Epistemicism posits. To avoid this, the Supervaluationist must admit higher-order vagueness: it is also vague which precisifications are admissible. This creates a hierarchy of indeterminacy that better fits the gradual erosion of institutional identity.

  Contrast this with Epistemicism. The Epistemicist claims there is a sharp boundary (e.g., the department definitely ceased at the exact moment of the Year 3 budget vote), but we cannot know it. In the context of collective intentionality, this implies there is a precise threshold of shared intention required for existence. This relocates the paradox rather than solving it. It forces us to accept that a microscopic change in administrative policy could metaphysically annihilate a collective agent, which contradicts the robust nature of social entities. Social kinds depend on recognition and function, which are gradient properties. Epistemicism treats social ontology like arithmetic, positing a fact of the matter where our conceptual practices suggest none exists.

  Therefore, Supervaluationism offers the superior account, provided it accommodates higher-order vagueness regarding admissibility. It correctly identifies that the "fact of the matter" is missing because our semantic conventions for institutional kinds do not dictate a specific cutoff. The department does not vanish at a precise instant; rather, our language ceases to yield a truth value as the collective intention dissipates. The vagueness is not in the world, nor in our knowledge, but in the semantic rules governing our social ontology. By accepting that the boundaries of admissibility are themselves fuzzy, Supervaluationism avoids reintroducing the sharp boundaries it seeks to eliminate, offering a nuanced map of institutional dissolution that respects the gradient nature of collective agency.

  ***

  ### Marking Scheme

  **Total Marks:** 100
  **Passing Threshold:** 50
  **A-Level Range:** 80–100
  **B-Level Range:** 65–79

  #### I. Conceptual Moves & Allocation (60 Marks)

  | Component | Description of Required Move | Marks |
  | :--- | :--- | :--- |
  | **Sorites Construction** | Correctly identifies the Tolerance Principle in the context of the 4-step dissolution (e.g., "If Year 1 is a dept, Year 2 is..."). | 10 |
  | **Theory Defense** | Clearly defines the chosen view (Epistemicism or Supervaluationism) without generic summary; applies it directly to the scenario. | 15 |
  | **Collective Intentionality** | **Crucial:** Distinguishes "department" as a collective-intentional term vs. physical aggregate. Explains how this alters the vagueness (e.g., erosion of *we-intentions* vs. loss of bricks). | 20 |
  | **Boundary Analysis** | **Crucial:** Addresses the "Sharp Boundary" objection. <br>*Super:* Discusses admissible precisifications and higher-order vagueness.<br>*Epistemic:* Discusses whether the unknown boundary is plausible for social kinds. | 15 |

  #### II. Argumentative Structure & Precision (20 Marks)

  | Component | Description | Marks |
  | :--- | :--- | :--- |
  | **Coherence** | Argument flows logically; conclusion follows from premises. No internal contradictions. | 10 |
  | **Constraint Adherence** | Stays within word limit; avoids bibliographic/citation padding; focuses on mechanics rather than history. | 10 |

  #### III. Critical Engagement (20 Marks)

  | Component | Description | Marks |
  | :--- | :--- | :--- |
  | **Objection Handling** | Anticipates a counter-argument (e.g., Super reintroducing boundaries) and responds to it specifically within the institutional context. | 20 |

  ---

  #### Differentiation: A-Level vs. B-Level Performance

  **A-Level (80–100 Marks)**
  *   **Integration:** Seamlessly integrates collective intentionality into the vagueness discussion. Does not treat them as separate questions.
  *   **Nuance:** Recognizes that for Supervaluationism, the set of "admissible precisifications" might itself be vague (higher-order vagueness) to avoid sharp boundaries.
  *   **Application:** Uses the specific steps of the scenario (Tenure -> Curriculum -> Budget -> Space) to illustrate the argument, rather than speaking abstractly.
  *   **Precision:** Distinguishes clearly between *semantic indecision* (Super) and *ontological/epistemic facts* (Epistemic).

  **B-Level (65–79 Marks)**
  *   **Definition:** Accurately defines Epistemicism or Supervaluationism but relies on standard textbook examples (heaps/baldness) rather than fully adapting them to the institutional scenario.
  *   **Separation:** Treats the "collective intentionality" requirement as a separate paragraph rather than weaving it into the analysis of the Sorites.
  *   **Objections:** Mentions the sharp boundary objection but fails to explain *why* it is problematic for institutional kinds specifically.
  *   **Clarity:** Argument is clear but lacks the critical depth regarding higher-order vagueness or the nature of social ontology.

  #### Characteristic Mistakes (Point Deductions)

  1.  **Conflating Ignorance and Fuzziness (-15 Marks):** Treating Epistemic uncertainty (we don't know when it ended) as identical to Metaphysical indeterminacy (there is no fact when it ended).
  2.  **Misunderstanding Precisification (-15 Marks):** Treating Supervaluationist precisifications as *ontologically creative* (making the department exist) rather than *semantically regulative* (clarifying the meaning of the term).
  3.  **Ignoring Collective Intentionality (-20 Marks):** Analyzing the department solely as a physical aggregate (building/staff count) without addressing the governance/intention aspect required by the prompt.
  4.  **Summary over Application (-10 Marks):** Spending the first half of the essay defining the theories historically rather than applying them to the "Institutional Dissolution" steps.
  5.  **Citation Padding (-5 Marks):** Including bibliographies or references where none were requested, signaling a reliance on external authority rather than conceptual reasoning.
