answer: |-
  There is no single, canonical noun in the philosophy of science that exclusively captures this exact lifecycle. However, the phenomenon you describe is a recognized composite of several well-documented failure modes in theory construction, particularly within the philosophy of economics and formal modeling.

  The closest established framework is **Imre Lakatos's "Degenerating Problem Shift,"** but your description identifies a specific *structural mechanism* within that shift that Lakatos does not fully detail. You are describing a transition where an assumption migrates from being a **Heuristic Idealization** to a **Constitutive Axiom** via **Structural Entanglement**, while retaining the rhetorical status of an idealization.

  Here is a breakdown of the existing concepts that map onto your observation, followed by a proposal for how to precisely delineate this specific failure mode.

  ### 1. The Canonical Ancestors

  **A. Lakatosian "Degenerating Problem Shift"**
  In Lakatos's *Methodology of Scientific Research Programmes*, a theory has a "hard core" (untouchable assumptions) and a "protective belt" (auxiliary hypotheses). A program degenerates when it only patches anomalies without predicting novel facts.
  *   **Where it fits:** Your "patching" phase matches the growth of the protective belt.
  *   **Where it falls short:** Lakatos focuses on the *logical* protection of the core. He does not explicitly describe the *mathematical dependency* you noted, where the patches are formally derived *from* the false core, making the core indispensable for the patches to exist.

  **B. Mäki's Taxonomy of Idealization**
  Philosopher of economics Uskali Mäki distinguishes between different types of assumptions:
  *   **Negligibility Assumptions:** "Factor X is zero." (Can be relaxed).
  *   **Heuristic Assumptions:** "Assume X to get started." (Temporary scaffolding).
  *   **Domain Assumptions:** "This theory only applies where X is true."
  *   **The Failure:** You are describing a Heuristic Assumption that fails to undergo **De-idealization** (the process of making the model more realistic). Instead, it undergoes **"Re-idealization"** or **"Freezing,"** where the heuristic becomes a domain assumption without admission.

  **C. Compensating Errors (Metrology/Physics)**
  In measurement theory, "compensating errors" occur when two mistakes cancel each other out to produce a correct result.
  *   **The Migration:** In your lifecycle, the "patches" act as compensating errors for the foundational falsehood. However, because the patches are *calibrated* to the falsehood, the error is no longer cancelable; it is **encoded**.

  ### 2. The Specific Mechanism: "Structural Entanglement"

  The distinct feature you identified is that the corrections are **formally derived from the original unrealistic setup**. This creates a specific type of dependency that distinguishes it from ordinary auxiliary adjustments.

  In standard auxiliary adjustment (Duhem-Quine style), you might add a friction term to a frictionless model. The friction term can be defined independently of the frictionless assumption.
  In your lifecycle, the patch *requires* the false assumption to be mathematically definable.
  *   *Example:* In the Black-Scholes model, volatility is assumed constant (false). Traders patch this with the "Volatility Smile." However, the Smile is defined as **Implied Volatility**, which is calculated *using* the Black-Scholes formula. You cannot remove the Black-Scholes assumption without losing the definition of the patch itself.
  *   **Label:** This is **Conceptual Parasitism** or **Definitional Lock-in**. The patch parasitizes the core falsehood for its own definition.

  ### 3. The Rhetorical Component: "Strategic Ambiguity"

  Philosopher Paul Pfleiderer describes **"Chameleon Models"** in economics: models that change their color (interpretation) depending on the context.
  *   When criticized for realism, the assumption is defended as a "heuristic idealization" (as-if).
  *   When used for derivation, the assumption is treated as a "constitutive axiom" (is).
  *   **Label:** This rhetorical maintenance is **Strategic Ambiguity**. It allows the modeler to claim the benefits of realism (via patches) without paying the costs of abandoning the tractable core.

  ### 4. Delineating the Phenomenon

  To distinguish this from ordinary auxiliary adjustments or institutional inertia, you should look for **Mathematical Irreversibility**.

  | Feature | Ordinary Auxiliary Adjustment | Your Phenomenon (Architectural Lock-in) |
  | :--- | :--- | :--- |
  | **Dependency** | Logical consistency with core. | **Mathematical derivation from core.** |
  | **Removability** | Core can be replaced; patch adapted. | Core removal **undefined** the patch. |
  | **Role of Assumption** | Boundary condition. | **Variable in the correction function.** |
  | **Rhetoric** | "We added complexity." | "We kept the simplification, just adjusted." |
  | **Failure Mode** | Empirical falsification. | **Formal collapse upon de-idealization.** |

  **The Boundary Case:**
  A genuine instance of this failure mode occurs when attempting to replace the false assumption with a true one causes the *correction terms* to diverge, become undefined, or lose their empirical calibration.
  *   *Test:* If setting the "false parameter" to its realistic value (e.g., cognitive cost > 0) makes the "adjustment coefficient" mathematically nonsensical, you have identified **Architectural Lock-in**.

  ### 5. Proposed Terminology

  Since no single canonical term exists, you might consider synthesizing the literature into a precise label. The most accurate philosophical description would be:

  **"The Reification of Heuristic Idealizations via Structural Entanglement."**

  However, for a more concise label, consider:
  *   **Formal Lock-in:** Emphasizes the mathematical inability to remove the assumption.
  *   **Architectural Reification:** Emphasizes the transition from tool to pillar.
  *   **The Scaffolding Trap:** Metaphorically captures the "temporary structure becoming permanent" aspect.
  *   **Endogenized Idealization:** Captures how the idealization is baked into the endogenous variables of the correction.

  ### Summary
  While **Lakatosian Degeneration** provides the broad evolutionary context, and **Mäki's Idealization** provides the typology, the specific *migration path* you describe is best understood as **Formal Lock-in of Idealizations**. It is distinct from ordinary auxiliary hypothesis testing because the patches are not independent tests of the theory, but **dependent variables of the falsehood**. The assumption ceases to be a premise and becomes a **coordinate system**; you cannot describe the "corrections" without using the grid provided by the false assumption.

  This is not just institutional inertia; it is a **mathematical path dependence** where the cost of truth (re-coding the entire architecture) exceeds the cost of falsity (maintaining the fiction), leading to a stable equilibrium of known falsehood. In the philosophy of technology, this is "Technical Debt"; in the philosophy of science, it is **"Epistemic Debt."**
