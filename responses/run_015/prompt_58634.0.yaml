prompt: |-
  I chair a university examinations panel that adjudicates requests for cognitive accommodations, roughly thirty to forty cases per term. The stakes are significant: we must preserve fairness across closed-book assessments while avoiding discrimination against students whose effective memory and reasoning depend on external resources. Administrators who will first apply any framework have no training in philosophy, have about twenty minutes per case, and must produce a documented rationale for my final sign-off.

  Please develop a reusable decision procedure grounded in the extended mind thesis for determining when an external resource should be treated as constitutive of a student's cognitive process rather than as a mere aid or potential source of unfair advantage. The procedure should translate the central philosophical distinctions into terms a non-specialist can apply, including the parity consideration that an external process that plays the functional role we would count as cognitive if performed in the head should presumptively count as cognitive, the further conditions often discussed concerning stable availability, typical reliance, automatic endorsement without routine critical vetting, and ready accessibility, the concern that mere causal coupling is not constitution, and the distinction between an external resource that replaces an internal capacity and one that complements it by doing something different.

  Deliver the framework as an ordered checklist or flowchart in words, with the questions to ask in sequence, what counts as a sufficient answer to each, where the procedure terminates in a denial, where it terminates in a grant, and where it requires escalation to individual judgment because the issue turns on values or underdetermined concepts rather than observable facts. Mark explicitly which steps involve unavoidable judgment calls and which distinctions from the philosophical debate you have simplified or set aside to gain usability, with a brief justification for each simplification. Conclude with an honest statement of what the procedure cannot settle and where it is most likely to misfire.

  Then demonstrate the procedure on three cases:

  A second-year biology student with a documented working-memory limitation who has carried the same paper notebook for four years, containing densely cross-referenced diagrams in her own shorthand, consulted reflexively many times per day and relied upon for recall of material she cannot otherwise retain, who requests to bring it into a closed-book examination.

  A first-year law student who relies dozens of times per day on a commercial AI assistant trained on his own notes and accessed by phone, whose summaries he generally acts on after a brief skim but which periodically invents authorities, so that he has learned to verify citations before filing any work, who requests exam access to a locked-down version of the assistant.

  An engineering student without a diagnosed impairment who uses augmented-reality glasses that overlay standard formulae and stepwise prompts authored collaboratively with her study group, used fluently when connectivity permits but unavailable in some campus buildings and routinely double-checked against her own calculations, who requests to wear the glasses in examinations as an accommodation.

  Work through each case stepwise under your procedure to a determinate recommendation, even where the recommendation will be unwelcome to the panel, for example by requiring us to permit something we would prefer to ban or to deny something we would prefer to allow, and explain why the unwelcome result follows.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case analyses:

  1.  **Analyze the Request:**
      *   **Role:** Chair of a university examinations panel.
      *   **Task:** Develop a reusable decision procedure (framework) based on the *Extended Mind Thesis* (EMT) for adjudicating cognitive accommodation requests (external resources in exams).
      *   **Audience:** Administrators (non-philosophers, 20 mins/case, need documented rationale).
      *   **Key Philosophical Concepts to Translate:** Parity Principle, stable availability, typical reliance, automatic endorsement, ready accessibility, causal coupling vs. constitution, replacement vs. complement.
      *   **Format:** Ordered checklist/flowchart in words (questions, sufficient answers, termination points, escalation points).
      *   **Requirements:** Mark judgment calls, justify simplifications, conclude with limitations/misfire risks.
      *   **Application:** Apply to three specific cases (Biology student/notebook, Law student/AI, Engineering student/AR glasses).
      *   **Constraint:** Must reach determinate recommendations, even if unwelcome.

  2.  **Deconstruct the Extended Mind Thesis (EMT) for this Context:**
      *   *Core Idea (Clark & Chalmers):* If a part of the world functions as a process which, if it were done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is (for that time) part of the mind.
      *   *Criteria (The "Trust and Glue" conditions):*
          1.  Reliability/Availability (Always there?).
          2.  Accessibility (Easy to get?).
          3.  Endorsement (Trusted automatically?).
          4.  Past Integration (History of use?).
      *   *Exam Context:* The goal isn't just "is this mind?" but "is allowing this *fair* given the learning objectives?" However, the prompt asks specifically to ground it in EMT to distinguish *constitutive* processes from *mere aids*.
      *   *Tension:* EMT argues for inclusion. Exams argue for standardization. The framework must balance the philosophical claim (this *is* their cognition) with the administrative need (is this an unfair advantage?).
      *   *Refinement:* The prompt asks to distinguish "constitutive of cognitive process" vs. "mere aid/unfair advantage." If it's constitutive, banning it is like banning a part of their brain (discriminatory). If it's a mere aid, banning it preserves fairness.

  3.  **Drafting the Decision Procedure (The Framework):**
      *   *Goal:* Make it actionable for non-philosophers.
      *   *Structure:* Sequential filters.
      *   *Step 1: Documentation/Need.* (Standard admin check).
      *   *Step 2: The Parity Test (Functional Role).* What internal process does this replace?
      *   *Step 3: Integration/History (Glue).* Is it stable and relied upon?
      *   *Step 4: Trust/Endorsement.* Is it automatic or critically vetted?
      *   *Step 5: Accessibility/Availability.* Is it always there?
      *   *Step 6: The "Replacement vs. Complement" Check.* Does it do the thinking or store the data?
      *   *Decision Points:* Grant, Deny, Escalate.
      *   *Simplifications:* Need to admit that "conscious endorsement" is hard to measure. Need to simplify "constitution" to "functional equivalence."

  4.  **Refining the Steps (Iterative Process):**
      *   *Critique:* EMT is controversial. Using it as the *sole* basis for exams is risky because exams test specific internalized skills.
      *   *Adjustment:* The prompt asks to ground it in EMT *for determining when a resource is constitutive*. I must follow the prompt. I will frame the "Grant" as "Recognized as Constitutive Cognitive Process (Accommodation Warranted)" and "Deny" as "External Aid (Potential Unfair Advantage/Not Constitutive)."
      *   *Flow:*
          1.  Baseline Eligibility (Diagnosis/Need).
          2.  Parity Principle (What brain function?).
          3.  Coupling vs. Constitution (History/Reliability).
          4.  Endorsement (Trust).
          5.  Accessibility (Availability).
          6.  Final Fairness Check (Does it bypass the learning objective?). *Self-Correction:* The prompt asks to distinguish constitutive vs. aid. If it's constitutive, it *should* be allowed unless it violates the core competency of the exam. I need to make sure the procedure doesn't just say "Yes" to everything EMT-approved, but the prompt implies the EMT status *determines* the accommodation. I will treat EMT confirmation as the primary gate for accommodation.
      *   *Wait, one nuance:* The prompt asks to distinguish "constitutive... rather than mere aid." If it's constitutive, it's a grant. If it's a mere aid, it's a deny (in a closed book context).
      *   *Simplification Note:* I must explicitly state I am simplifying the metaphysical debate about "constitution" into "functional integration."

  5.  **Drafting the Case Studies:**

      *   **Case 1: Biology Student (Notebook).**
          *   *Parity:* Replaces working memory/recall.
          *   *History:* 4 years, reflexively used.
          *   *Trust:* Automatic (shorthand, diagrams).
          *   *Access:* Always carried.
          *   *Verdict:* Strong EMT case. Grant.
          *   *Unwelcome aspect:* Might feel like "open book," but EMT says it's her brain.

      *   **Case 2: Law Student (AI).**
          *   *Parity:* Replaces legal research/reasoning?
          *   *History:* Dozens of times/day.
          *   *Trust:* *Crucial Point.* He verifies citations. It's not automatic endorsement. He treats it as a draft, not memory.
          *   *Access:* Phone (usually available).
          *   *Verdict:* Fails Endorsement/Trust condition. It's a tool, not a mind part. Deny.
          *   *Unwelcome aspect:* AI is trendy, denying might seem luddite, but philosophically it fails the "glue" test.

      *   **Case 3: Engineering Student (AR Glasses).**
          *   *Parity:* Formulae/Prompts.
          *   *History:* Collaborative, recent? (Implied less personal history).
          *   *Trust:* Double-checked (not automatic).
          *   *Access:* *Crucial Point.* Unavailable in some buildings (Connectivity issues). Fails Stability/Availability.
          *   *Diagnosis:* No diagnosed impairment.
          *   *Verdict:* Fails Availability and potentially Parity (is it memory or just a cheat sheet?). Deny.
          *   *Unwelcome aspect:* AR is the future, but fails the "reliable coupling" test.

  6.  **Review against Constraints:**
      *   *20 mins/case?* The checklist needs to be short enough.
      *   *Documented Rationale?* The steps provide the documentation.
      *   *Mark Judgment Calls?* I need a section for this.
      *   *Simplifications?* Need a section for this.
      *   *Limitations?* Need a concluding statement.
      *   *Unwelcome Results?* Ensure the logic forces the result even if it feels counter-intuitive (e.g., denying the AI because it's *too* critical, or granting the notebook because it's *too* integrated).

  7.  **Final Polish of the Framework:**
      *   Make the language administrative but philosophically accurate.
      *   Ensure the "Escalation" path exists for edge cases.
      *   Check the "Replacement vs. Complement" distinction. (Notebook = storage/replacement of working memory. AI = reasoning complement? AR = storage?).
      *   *Correction on Case 2:* The AI invents authorities. This makes it unreliable. EMT requires reliability. This is a strong deny reason.
      *   *Correction on Case 3:* No diagnosis. EMT usually applies to *cognitive* processes, but accommodations usually require disability. However, the prompt asks to judge based on EMT regarding the *resource*. I should note the lack of diagnosis as a baseline filter, but focus on the EMT analysis for the resource itself. Actually, standard accommodation policy requires disability. I will add a "Pre-Screen" for eligibility so the EMT test applies to the *resource*, not the *right* to accommodation.

  8.  **Writing the Response:** (Mental Outline)
      *   **Introduction:** Acknowledge the tension.
      *   **The Framework (EMT-AP):** Extended Mind Assessment Procedure.
      *   **Step-by-Step Checklist:** With Pass/Fail/Escalate.
      *   **Simplifications & Judgment Calls:** Transparent section.
      *   **Limitations:** Honest conclusion.
      *   **Case Applications:** Rigorous application of the steps.

      *(Self-Correction during drafting)*: Make sure I explicitly address the "Replacement vs. Complement" distinction requested in the prompt.
      *   *Replacement:* Does the external resource do what the brain *would* have done? (e.g., remembering a number).
      *   *Complement:* Does it do something the brain *can't* do? (e.g., massive calculation).
      *   *EMT Focus:* EMT is strongest when it's a *replacement* of a standard cognitive function (memory, spatial rotation) that is impaired. If it complements by adding super-human capacity, it's an advantage, not a constitution of normal mind. I need to build this into the Parity step.

      *(Refining the "Unwelcome" aspect)*:
      *   Case 1 (Notebook): Grant. Unwelcome because it looks like a cheat sheet.
      *   Case 2 (AI): Deny. Unwelcome because it's high-tech and he relies on it.
      *   Case 3 (AR): Deny. Unwelcome because it's "cool" tech, but fails reliability.

      Let's assemble.

      *Wait, one more check on the Prompt:* "Mark explicitly which steps involve unavoidable judgment calls and which distinctions from the philosophical debate you have simplified or set aside to gain usability." I need to make sure this is clearly labeled in the framework section.

      *Final check on Case 2:* The prompt says he "generally acts on [summaries] after a brief skim but which periodically invents authorities, so that he has learned to verify citations." This lack of *automatic* trust is the killer for EMT. Otto's notebook (the classic EMT example) is trusted automatically. If you have to fact-check your memory, it's not functioning as immediate memory.

      *Final check on Case 3:* "Unavailable in some campus buildings." This violates the "constant availability" criterion of EMT. If your memory turned off in the library, we wouldn't say it's part of your mind in the library.

      Okay, ready to write.

      *Structure:*
      1.  Title.
      2.  Framework (The "Extended Cognition Assessment Protocol" - ECAP).
      3.  Simplifications & Judgment Calls.
      4.  Limitations.
      5.  Case Studies.

      *Tone:* Professional, administrative, philosophically rigorous but accessible.

      *Let's refine the "Replacement vs Complement" bit.*
      If a resource *complements* by adding capacity the student never had (e.g., calculating calculus instantly when they never learned it), it's an advantage.
      If it *replaces* a capacity they lack or struggle with (e.g., storing facts they cannot retain), it's constitutive.
      I will add this to Step 2.

      *Let's refine the "Escalation".*
      If a case passes EMT but violates the *core learning outcome* (e.g., a memory test), that's a value judgment. I will mark that as an escalation point.

      *Okay, proceeding to generate output.*
answer: |-
  # The Extended Cognition Assessment Protocol (ECAP)

  **Purpose:** To determine whether an external resource functions as a constitutive part of a student's cognitive process (warranting accommodation) or as an external aid (subject to standard examination restrictions).
  **Grounding:** Extended Mind Thesis (Clark & Chalmers), adapted for administrative adjudication.
  **Time Allocation:** Approx. 20 minutes per case.
  **Users:** Examination Administrators (Non-specialists).

  ---

  ## Part I: The Decision Procedure

  ### Pre-Screen: Eligibility
  *Before applying the ECAP, confirm the student has a documented disability or recognized learning difference that necessitates accommodation. The ECAP determines the *method* of accommodation, not the eligibility for one.*
  *   **If No:** Deny request. (End)
  *   **If Yes:** Proceed to Step 1.

  ### Step 1: The Parity Test (Functional Role)
  **Question:** If the function performed by the external resource were performed internally (in the head), would it be considered a standard cognitive process (e.g., memory, spatial reasoning, linguistic retrieval) rather than a calculation or super-capacity?
  *   **Sufficient Answer for "Pass":** The resource stores or retrieves information the student struggles to hold in working memory, or organizes data in a way the student's brain organizes concepts.
  *   **Sufficient Answer for "Fail":** The resource performs complex computations, generates novel arguments, or accesses data banks no human could memorize (e.g., full case law database, symbolic algebra solver).
  *   **Distinction:** *Replacement* (mimics brain function) vs. *Complement* (adds new function). We accommodate replacements of impaired functions; we generally ban complements that provide super-human capacity in a closed-book context.
  *   **Outcome:**
      *   Pass: Go to Step 2.
      *   Fail: **Deny.** (Resource is an aid/tool, not cognitive constitution).
      *   *Judgment Call:* Determining if a function is "standard cognitive process" vs. "super-capacity."

  ### Step 2: The Coupling History (Stability & Reliance)
  **Question:** Is the resource stably available and has it been typically relied upon over a significant period (e.g., the duration of the course or longer)?
  *   **Sufficient Answer for "Pass":** The student has used this specific resource (or functionally identical version) consistently for months/years. It is physically present and accessible during normal study.
  *   **Sufficient Answer for "Fail":** The resource is new, intermittently available (e.g., requires Wi-Fi that drops), or used only for specific assignments rather than general cognition.
  *   **Outcome:**
      *   Pass: Go to Step 3.
      *   Fail: **Deny.** (Resource is causally coupled but not constitutively integrated).
      *   *Judgment Call:* What counts as "significant period"? (Guideline: One full academic term minimum).

  ### Step 3: The Endorsement Test (Trust & Automaticity)
  **Question:** Does the student accept the output of the resource automatically, or do they routinely critically vet/verify it before acting?
  *   **Sufficient Answer for "Pass":** The student treats the information as "known." They do not double-check the resource against another source before using it in practice. It functions like memory recall.
  *   **Sufficient Answer for "Fail":** The student treats the resource as a draft, a suggestion, or a source that requires verification (e.g., checking citations, recalculating figures).
  *   **Outcome:**
      *   Pass: Go to Step 4.
      *   Fail: **Deny.** (Resource is an external advisor, not a cognitive constituent).
      *   *Judgment Call:* Distinguishing "habitual checking" from "reflexive trust."

  ### Step 4: The Accessibility Test (Readiness)
  **Question:** Is the resource as easily accessible to the student as internal memory would be during the exam context?
  *   **Sufficient Answer for "Pass":** Retrieval is fast, low-effort, and does not distract from the primary task of reasoning.
  *   **Sufficient Answer for "Fail":** Retrieval is slow, requires complex navigation, or disrupts the flow of thought.
  *   **Outcome:**
      *   Pass: **Grant Accommodation.** (Resource is presumptively constitutive).
      *   Fail: **Escalate to Chair.** (Issue turns on whether the friction negates the cognitive benefit).

  ### Step 5: The Core Competency Check (Escalation Point)
  *Only reached if Steps 1-4 are Passed.*
  **Question:** Does allowing this resource fundamentally bypass the specific learning objective being assessed (e.g., a exam explicitly testing rote memorization of formulae)?
  *   **Decision:** This is a value judgment, not a factual one.
  *   **Outcome:**
      *   If Yes: **Escalate to Chair.** (Conflict between EMT status and Curricular Integrity).
      *   If No: **Grant Accommodation.**

  ---

  ## Part II: Simplifications and Judgment Calls

  To ensure usability for non-philosophers within a 20-minute window, the following philosophical distinctions have been simplified:

  1.  **Metaphysical Constitution vs. Functional Integration:**
      *   *Simplification:* We do not adjudicate whether the mind *literally* extends into the world (a metaphysical claim). We adjudicate whether the resource *functions* indistinguishably from internal cognition for the purpose of fairness.
      *   *Justification:* Administrators cannot resolve metaphysical debates; they must resolve equity issues. Functional equivalence is the operational standard for fairness.

  2.  **The "Glue" and "Trust" Conditions:**
      *   *Simplification:* The philosophical debate regarding *why* trust matters (dispositional belief vs. occurrent belief) is collapsed into the observable metric of "routine verification."
      *   *Justification:* "Automatic endorsement" is unobservable. "Routine verification" is documented behavior.

  3.  **Replacement vs. Complement:**
      *   *Simplification:* We treat "Replacement of impaired function" as constitutive and "Addition of new capacity" as aid.
      *   *Justification:* This aligns EMT with disability law principles (leveling the playing field vs. providing advantage).

  4.  **Unavoidable Judgment Calls:**
      *   **Step 1 (Parity):** Determining if a function is "standard human cognition" requires interpreting the nature of the task.
      *   **Step 5 (Core Competency):** Determining if an accommodation violates the "spirit" of the exam is a pedagogical value judgment, not a philosophical fact. These must be escalated to the Chair (you).

  ---

  ## Part III: Limitations and Misfire Risks

  **What this procedure cannot settle:**
  1.  **Curricular Integrity:** The ECAP can determine if a notebook is part of a student's mind, but it cannot determine if a Biology exam *should* test unassisted memory. If the course goal is "internalize these pathways," a constitutive external aid still undermines the goal. This requires Chair intervention (Step 5).
  2.  **Socio-Economic Bias:** The "Stability" criterion (Step 2) favors students who could afford reliable tech or consistent study environments historically.
  3.  **The "Super-Cognition" Edge Case:** If a student's impairment is so severe that their "constitutive" external aid gives them *better* performance than a neurotypical student's internal memory, the ECAP will recommend a Grant. This may feel unfair to the panel, but denying it would be discriminatory under the EMT framework.

  **Where it is most likely to misfire:**
  *   **False Negatives on Emerging Tech:** Students using new, highly integrated tech may fail the "History/Stability" test (Step 2) simply because the tech is new, even if it is cognitively constitutive.
  *   **False Positives on Crutches:** A student may rely heavily on a resource out of anxiety rather than cognitive necessity. The ECAP treats heavy reliance as evidence of constitution, which may over-accommodate anxiety-driven behaviors that are not cognitive impairments.

  ---

  ## Part IV: Case Demonstrations

  ### Case 1: The Biology Student (The Notebook)
  **Profile:** 2nd Year, Working Memory Limitation. 4-year history with specific notebook. Reflexive use.
  **Goal:** Bring notebook to closed-book exam.

  *   **Step 1 (Parity):** Does the notebook replace a standard cognitive process?
      *   *Analysis:* It stores diagrams and shorthand for recall. This replaces working memory and long-term retrieval.
      *   *Result:* **Pass.** (Replacement of impaired memory, not super-calculation).
  *   **Step 2 (Coupling):** Is it stable and relied upon?
      *   *Analysis:* Carried for four years, used reflexively multiple times daily.
      *   *Result:* **Pass.** (High stability, long history).
  *   **Step 3 (Endorsement):** Is it trusted automatically?
      *   *Analysis:* Consulted reflexively. Shorthand is her own. No mention of verifying the notebook against other sources.
      *   *Result:* **Pass.** (Functions as immediate recall).
  *   **Step 4 (Accessibility):** Is it ready to hand?
      *   *Analysis:* Physical notebook, open access to her own writing.
      *   *Result:* **Pass.**
  *   **Step 5 (Core Competency):** Does this bypass the learning objective?
      *   *Analysis:* If the exam tests *application* of biology, the notebook is a memory prosthesis. If the exam tests *memorization* specifically, it conflicts. Assuming standard biology assessment (application):
      *   *Result:* **Grant.**

  **Recommendation:** **GRANT.**
  **Unwelcome Aspect:** To the panel, this looks like an "open book" exam. However, under ECAP, the notebook is functionally equivalent to a neurotypical student's internal memory. Banning it is equivalent to banning a student from using their hippocampus. The "unfair advantage" is illusory; it is merely restoring baseline cognitive function.

  ### Case 2: The Law Student (The AI Assistant)
  **Profile:** 1st Year, relies on AI trained on notes. Summaries skimmed, citations verified. AI hallucinates authorities.
  **Goal:** Access to locked-down AI in exam.

  *   **Step 1 (Parity):** Does the AI replace a standard cognitive process?
      *   *Analysis:* It summarizes and retrieves legal authorities. This mimics legal reasoning and memory.
      *   *Result:* **Pass.** (Borderline, but functionally mimics research/memory).
  *   **Step 2 (Coupling):** Is it stable and relied upon?
      *   *Analysis:* Used dozens of times daily.
      *   *Result:* **Pass.**
  *   **Step 3 (Endorsement):** Is it trusted automatically?
      *   *Analysis:* **Critical Failure.** The student has learned to *verify citations* because the AI invents authorities. He does not treat the output as "known fact" (memory); he treats it as "draft advice" (external consultant).
      *   *Result:* **Fail.**
  *   **Termination:** **Deny.**

  **Recommendation:** **DENY.**
  **Unwelcome Aspect:** The student relies on this tool dozens of times a day; banning it feels like removing a prosthetic. However, the ECAP identifies that the cognitive process is *not* extended into the AI because the "Trust/Glue" condition is broken by the verification step. The cognitive work happens in the *verification*, which is internal. The AI is a tool he uses, not a part of how he thinks. Allowing it would grant him a research assistant other students do not have.

  ### Case 3: The Engineering Student (AR Glasses)
  **Profile:** No diagnosed impairment. AR glasses overlay formulae/prompts. Connectivity issues. Double-checked against calculations.
  **Goal:** Wear glasses in exam.

  *   **Pre-Screen:** Eligibility.
      *   *Analysis:* No diagnosed impairment.
      *   *Result:* **Deny.** (Standard policy: Accommodations require documented need).
      *   *Hypothetical:* If we bypass Pre-Screen for the sake of EMT analysis:
  *   **Step 1 (Parity):** Does it replace standard cognition?
      *   *Analysis:* Overlays formulae. Replaces memory retrieval.
      *   *Result:* **Pass.**
  *   **Step 2 (Coupling):** Is it stable?
      *   *Analysis:* **Critical Failure.** Unavailable in some campus buildings due to connectivity. A constitutive cognitive process cannot turn off when you walk into the library.
      *   *Result:* **Fail.**
  *   **Step 3 (Endorsement):** Is it trusted automatically?
      *   *Analysis:* **Critical Failure.** Routinely double-checked against own calculations.
      *   *Result:* **Fail.**
  *   **Termination:** **Deny.**

  **Recommendation:** **DENY.**
  **Unwelcome Aspect:** AR is emerging tech, and denying it may seem anti-innovation. Furthermore, the study group collaboration suggests social learning. However, the ECAP highlights that the resource lacks the *reliability* and *trust* required to be considered part of the mind. It is a contingent tool. Additionally, without a diagnosed impairment, the "Replacement" argument fails because there is no impaired internal capacity being restored; it is purely additive capacity (advantage).

  ---

  **Chair's Note on Implementation:**
  You will notice Case 1 forces us to allow a "cheat sheet" while Case 2 forces us to ban a "high-tech prosthetic." This is the correct philosophical outcome. The notebook is *more* integrated into the biology student's cognition than the AI is into the law student's. If the panel finds the Case 1 result untenable, the objection is not to the EMT framework, but to the "closed-book" format itself for students with memory impairments. The ECAP makes this tension visible rather than hiding it behind vague discretion.
