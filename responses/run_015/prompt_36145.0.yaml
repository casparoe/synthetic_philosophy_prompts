answer: |-
  The impasse is a substantive metaphysical failure of reductionism rather than a verbal misunderstanding, because the conditional analysis attempts to ground modal force in categorical facts and the fink cases demonstrate that this grounding requires circular appeal to the very dispositions it seeks to analyze.

  Your hypothesis that the first two camps are talking past each other regarding semantics versus ontology is attractive but incorrect because the proponents of the conditional analysis are not merely doing linguistics; they are attempting an ontological reduction to avoid committing to irreducible powers. When the pro-conditional side says "we just need to fix the *ceteris paribus* clause," they are claiming that the disposition *is nothing over and above* the categorical base plus the conditional truth. When the anti-conditional side says "that clause is vacuous," they are pointing out that to exclude finks and masks without ruling out genuine cases of fragility, you must specify "normal conditions" in a way that presupposes the disposition itself (e.g., "nothing interferes with the breaking"). This is not a confusion of questions; it is a deadlock over whether the modal "would" can be cashed out in non-modal terms. The third camp is not hiding a dispute about intrinsicness but occupying the position that remains once the reductionist project collapses: if the conditional analysis fails, dispositions must be fundamental properties, which resolves the circularity by accepting the modal force as primitive. The fight over intrinsicness is real, but it is secondary to the primary failure of the conditional analysis to secure a non-circular link between base and manifestation.

  Honest progress on the original question is unlikely because the literature has largely exhausted the logical space for non-circular *ceteris paribus* clauses, with recent attempts relying on complex contextualist semantics that essentially concede the anti-conditionalist's point that the truth conditions vary with interests rather than intrinsic structure. If your group wants to salvage the conditional analysis, the only viable path is contextualism, where "fragile" means "would break in context C," but this shifts the debate from metaphysics to pragmatics and abandons the hope of a unified ontological reduction. If your goal is metaphysical ontology, you should move directly to the powers ontology literature where the fink/mask cases are treated as data points for a dispositional essentialist framework rather than refutations of analysis. Staying on the fink/mask debate is now merely rehearsing arguments that have reached a reflective equilibrium where no new evidence can decide the case, so you should accept that the pure conditional analysis is dead and pivot to what replaces it.
