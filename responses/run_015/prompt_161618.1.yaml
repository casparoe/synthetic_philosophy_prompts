  I recommend we allocate $400,000 immediately to the eighteen-month methodology project, hold the remaining $400,000 in reserve, and reconvene to reassess the full portfolio on [Date 18 months from Thursday].

  ### The Infinitarian Claim
  The applicants' argument is philosophically robust and, if true, overrides all other considerations. They correctly identify that if the future contains infinitely many lives, standard cost-effectiveness analysis fails; adding finite welfare to an infinite total changes nothing, whereas changing the future's character affects everything. Their rejection of "regularisation" is equally strong: capping the future's value at any finite number is an arbitrary act that privileges current generations over future ones without ethical justification. If value lock-in determines the quality of an infinite sequence, then funding this research is not merely high-impact; it must take precedence over all other charitable acts. The strongest case for the declining option—granting the full $800,000 to this group—rests on this priority: if there is even a sliver of chance they are right, anything else is negligence.

  ### The Leverage Tie
  However, acting on this priority requires knowing where leverage lies. My colleague's objection is the strongest counter-argument we have. Near-term health programmes are not morally isolated; they foster economic growth, institutional stability, and human capital, all of which influence whether transformative AI arrives safely or catastrophically. If health interventions shift the probability of a good infinite future by even a microscopic margin, their expected value also becomes infinite. We are left with a tie where both options claim infinite stakes, but we lack the calculus to determine which offers greater leverage. To fund one fully now is to assert a solution to a mathematical problem we have not yet solved, risking the entire budget on an unproven assumption of unique influence. This uncertainty paralyses standard decision-making, requiring us to invest in the decision tool itself.

  ### Buying Clarity
  Option two is the only prudent path under such deep uncertainty. It commits significant resources to resolving the methodological crisis without exhausting our capital on a specific intervention before we know how to compare them. This approach respects the infinitarian argument's gravity while acknowledging our current inability to act on it decisively. We will revisit the reserve funds upon the methodology project's completion; specifically, if the project produces a robust ranking procedure that distinguishes leverage without relying on arbitrary finite caps, we will shift the remaining funds to the highest-ranked intervention regardless of category. Until then, holding capital is itself a strategic choice to prevent misallocation among infinite stakes. This ensures that when we do commit the remaining $400,000, it is guided by evidence rather than philosophical speculation.
