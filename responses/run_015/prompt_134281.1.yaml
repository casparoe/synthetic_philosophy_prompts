          *   Analyze division of labor via seating/assignments.
          *   Analyze euphemistic language as moral distancing.
          *   **Unique Framing:** Treat the minutes as a "system-architecture document" specifying interfaces (rail, civil admin, security). Does this support content-neutral modularity or reveal hard-coded ideology?
          *   **Critique/Limitations:** Where does Bauman break down? (Committed Nazis vs. neutral clerks, extermination goal vs. generic violence).
          *   **Uniqueness vs. Comparability:** Does this make the Holocaust comparable to other bureaucratic atrocities or is the endpoint singular?
          *   **Silences:** What does Bauman *not* explain? (Timing: Why Jan 1942?).
      *   **Tone:** Analytical, critical, honest about theory limitations. No bibliography needed.

  2.  **Initial Brainstorming & Fact-Checking (Wannsee):**
      *   *Who:* Reinhard Heydrich (RSHA), Adolf Eichmann (RSHA IV B4), representatives from Foreign Office, Justice, Interior, East Ministries, Four Year Plan, GG (General Government).
      *   *What:* Coordination of the "Final Solution of the Jewish Question."
      *   *Language:* "Evacuation," "Labor," "Natural Reduction," "Appropriate Treatment."
      *   *Bauman's Lens:* Rationality, efficiency, compartmentalization, substitution of technical responsibility for moral responsibility.
      *   *The "System Architecture" Metaphor:* This is a strong hook. APIs, handoffs, error handling (Mischlinge), resource allocation.
      *   *Critique:* Bauman is sometimes accused of downplaying antisemitism. The participants *were* ideologues, not just faceless cogs. The goal wasn't just order; it was death.
      *   *Timing:* Why 1942? War context (invasion of USSR), failure of expulsion plans (Madagascar), radicalization. Bauman focuses on structure, less on conjunctural historical triggers.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Acknowledge Bauman's central claim (modernity made the Holocaust possible, not just a glitch). Introduce Wannsee as the case study.

      *   **The Division of Labor (The Org Chart):**
          *   Need to list specific agencies.
          *   *RSHA (Heydrich/Eichmann):* The project managers.
          *   *Foreign Office (Luther):* Diplomatic cover, pressuring satellite states.
