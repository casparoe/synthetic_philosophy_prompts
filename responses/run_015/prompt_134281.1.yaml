      *   *The "System Architecture" Metaphor:* Lean into this. Use terms like "API," "handshake," "legacy code" (legal definitions).
      *   *Specifics:* Mention Stuckart's memo on sterilization. Mention Bühler's push to clear the GG. Mention the rail capacity issues (though that came slightly later, the *coordination* is the key here).

  5.  **Final Review against Prompt:**
      *   Map players/agencies? Yes.
