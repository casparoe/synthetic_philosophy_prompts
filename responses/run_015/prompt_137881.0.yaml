answer: |-
  You have identified a genuine gap in the canonical literature on the politics of technology. Langdon Winner's *Do Artifacts Have Politics?* (1980) established the paradigm you describe as the "imposition" model: artifacts that *require* hierarchy (nuclear power) or *enforce* exclusion (low bridges). Your observation is that the contemporary politics of technology operates less through **coercion** and more through **dissolution**.

  There is no single, established term in Philosophy of Technology or STS (Science and Technology Studies) that captures this specific mechanism: *an artifact that achieves political effects by removing a shared constraint that inadvertently served as a focal point for collective action.*

  However, your description sits at the intersection of four existing concepts. To answer your request, I will analyze why each "neighbor" concept fails to fully capture your pattern, and then propose a precise term that does.

  ### 1. The Nearby Concepts

  Here is how the existing theoretical neighbors would analyze your three cases, and where they fall short.

  **A. Affordances (Gibson/Norman)**
  *   **The Concept:** An affordance is a possibility for action provided by the environment or object (e.g., a chair affords sitting).
  *   **Analysis of your cases:** A shift-bidding app affords "flexibility." A routing app affords "optimization."
  *   **Where it fails:** Affordance theory is methodologically individualistic. It asks, "What can *the user* do?" It lacks the vocabulary for "What can *the group* no longer do?" It treats the loss of the shared roster as a neutral change in options, rather than the destruction of a coordination infrastructure. It cannot see the "invisible loss" you describe.

  **B. Technical Scripts (Madeleine Akrich)**
  *   **The Concept:** Designers "inscribe" a vision of the world into the technology, prescribing how users should behave (a "script").
  *   **Analysis of your cases:** The app scripts the worker to act as an independent contractor; the routing app scripts the driver to act as an isolated optimizer.
  *   **Where it fails:** Scripts are about *prescribed action*. Your cases are about *dissolved context*. The app doesn't necessarily tell the worker "do not unionize"; it simply removes the material precondition (the shared schedule) that made unionizing legible. It is a **de-scripting** of social relations, not a scripting of individual ones.

  **C. Exit, Voice, and Loyalty (Albert O. Hirschman)**
  *   **The Concept:** When an organization declines, members can either "Exit" (leave) or use "Voice" (complain/protest to fix it).
  *   **Analysis of your cases:** This is the strongest match. The apps drastically lower the cost of **Exit** (choose a different shift, choose a different street) which renders **Voice** obsolete (no need to complain about the roster or the arterial road if you can bypass them individually).
  *   **Where it fails:** Hirschman's framework is behavioral and organizational, not material. It explains the *social dynamic*, but not the *artifact's role*. It doesn't explain *how* the technology lowers the cost of exit so invisibly. It treats the technology as a black box that changes incentives, rather than analyzing the design feature (removal of constraint) that enacts the shift.

  **D. Individualization of Risk (Ulrich Beck)**
  *   **The Concept:** Late modernity transfers systemic risks (unemployment, health, safety) from the state/collective onto the individual.
  *   **Analysis of your cases:** This fits your insurance example perfectly. The telematics device materializes the shift from "pooled risk" to "individual risk."
  *   **Where it fails:** It is a macro-sociological trend, not a theory of artifacts. It explains the *ideology* behind the insurance change, but it doesn't help us identify the same pattern in the traffic or the warehouse. It lacks a design-level vocabulary.

  ### 2. The Proposed Concept: Solvent Artifacts

  Since no existing term captures the *material mechanism of dissolving shared coordination points via the removal of constraints*, I propose the term **Solvent Artifacts**.

  **Definition:**
  A **Solvent Artifact** is a technical system that achieves political effects not by imposing constraints (Winner) or prescribing behaviors (Akrich), but by **removing frictions or constraints that inadvertently served as Schelling points (focal points) for collective action.**

  **Operational Criteria:**
  1.  **Marketing of Freedom:** The artifact is marketed as the removal of a burden, constraint, or inefficiency (e.g., "flexibility," "time-saving," "personalization").
  2.  **Dissolution of the Common Object:** The optimization of the individual flow dissolves a shared material or informational object (the roster, the traffic jam, the risk pool) that previously served as a site of common experience.
  3.  **Invisibility of Loss:** Because the dissolved object was a "commons" (owned by no one), its disappearance is not registered as a loss of property, but as a gain in convenience.
  4.  **Atomization of Agency:** The artifact renders collective action technically impossible or cognitively illegible, not by forbidding it, but by making it unnecessary for the individual.

  **Why "Solvent"?**
  In chemistry, a solvent dissolves a solute into a solution where the components are no longer distinct. These artifacts dissolve the binding agent of collective life (shared constraint) into a solution of individual flows.

  ### 3. The Test Case: A Near-Miss

  To ensure this term is robust, we must test it against a case that *looks* like a Solvent Artifact (removes constraints, marketed as freedom) but *is not* one.

  **The Case: Copyleft / Open Source Licensing (e.g., GPL)**

  *   **Why it looks like a Solvent Artifact:**
      *   **Removal of Constraint:** It removes the constraint of proprietary copyright. You are "free" from licensing fees and restrictions.
      *   **Marketing:** It is explicitly marketed as "Free Software" (libre).
      *   **Individual Benefit:** It allows individual developers to use code without permission.

  *   **Why it is NOT a Solvent Artifact:**
      *   **Effect on Coordination:** Instead of dissolving a shared object, it *creates* one. By removing the constraint of ownership, it allows a **commons** (the codebase) to accumulate and persist.
      *   **Schelling Point:** The license acts as a *binding* Schelling point. Developers know that if they use this code, they must contribute back. It *enables* collective action (collaborative development) rather than dissolving it.
      *   **Visibility:** The "common stake" is highly visible (the repository, the commit history).

  **Contrast:**
  *   **Solvent Artifact (Waze):** Removes the constraint of "waiting in traffic." Result: The traffic jam (a shared public fact) disappears into thousands of private residential streets. Collective complaint becomes impossible.
  *   **Non-Solvent Artifact (GPL):** Removes the constraint of "proprietary licensing." Result: The codebase (a shared public fact) becomes robust and durable. Collective contribution becomes easier.

  ### 4. Application to Your Cases

  Using the lens of **Solvent Artifacts**, we can re-describe your examples with precision:

  1.  **The Shift-Bidding App:**
      *   *Constraint Removed:* Fixed scheduling.
      *   *Shared Object Dissolved:* The weekly roster.
      *   *Political Effect:* The roster was a **temporal commons**. It ensured workers occupied the same time-space, allowing for the synchronization of grievance. The app solvents this into individual contracts.

  2.  **The Route-Guidance App:**
      *   *Constraint Removed:* Navigational uncertainty / congestion.
      *   *Shared Object Dissolved:* The arterial bottleneck.
      *   *Political Effect:* The bottleneck was a **spatial commons**. It forced a shared experience of failure (congestion) that could be attributed to the city. The app solvents this into private optimizations, hiding the systemic failure.

  3.  **The Telematics Insurance:**
      *   *Constraint Removed:* Cross-subsidization (paying for others' risk).
      *   *Shared Object Dissolved:* The risk pool.
      *   *Political Effect:* The pool was a **financial commons**. It created a mutual stake in safety. The app solvents this into actuarial individualism, where my safety is no longer tied to yours.

  ### Summary

  You are describing a shift from the **Politics of Authority** (Winner: who rules?) to the **Politics of Solidarity** (Who stands together?).

  The established concept that comes closest is **Hirschman's "Exit vs. Voice,"** but it lacks the material focus. The established concept that describes the *outcome* is **Beck's "Individualization of Risk,"** but it lacks the design focus.

  **Solvent Artifacts** is the term for the *mechanism*: technologies that optimize individual flow by dissolving the shared friction required for collective coordination. They do not forbid the public square; they make it inefficient to visit.
