answer: |-
  Subject: Re: Accuracy audit of the magazine piece on algorithmic fairness

  Dear Friend,

  It is completely understandable that you found the passage confusing, particularly regarding the tension between the arithmetic argument and the proposed remedy. Your instinct that those two claims sit badly together is correct, and while your brother-in-law is right that the underlying mathematics is real, the article you read draws conclusions that are far stronger and more defeatist than the math actually supports. I will walk through the claims in the order you presented them to separate the solid mathematical core from the overstated implications.

  The passage begins by stating that computer scientists proved an algorithmic risk score cannot be fair because it cannot satisfy three requirements at once. This is a reference to genuine impossibility theorems published around 2016 and 2017. The mathematical core of this claim is accurate. When two groups have different base rates, meaning the actual frequency of the outcome differs between them, it is mathematically impossible to simultaneously satisfy calibration, equal false positive rates, and equal false negative rates. The passage describes these requirements reasonably well, though it conflates calibration with positive predictive value slightly. Calibration means that if the model predicts a seventy percent risk, seventy percent of those people should reoffend. Equal error rates mean the model makes mistakes equally often across groups. The proof shows you can have calibration or you can have equal error rates, but if the base rates differ, you cannot have both. So, the claim that this is a mathematical constraint rather than a coding error is correct.

  Where the passage becomes misleading is in its explanation of why this happens and what can be done about it. It states that the obstacle is arithmetic because the groups do not have the same rate of the thing being predicted. This is true. The impossibility arises directly from Bayes theorem, which governs how probabilities update. If one group has a higher underlying rate of reoffending, a score that is perfectly calibrated for that group will inevitably look different than a score calibrated for a group with a lower rate, unless you are willing to accept different error rates. The article is correct that this is not an artifact of a specific dataset or a sloppy model. Even a perfect model that predicts risk with maximum possible accuracy will face this trade-off if the underlying prevalence differs between groups. Therefore, the claim that better data or better features will not resolve this specific mathematical contradiction is technically true. You cannot data your way out of a theorem.

  However, the passage then makes a sharp turn that contradicts its own logic. It suggests that since calibration is the metric to sacrifice, the practical solution is to stop letting the system see race or sex so it cannot sort people into groups. This is where the reasoning falls apart. If the problem is driven by differing base rates, hiding the group label does not make the base rates equal. The model will often infer group membership through other correlated variables, but even if it did not, the mathematical tension remains if the underlying outcomes differ. Furthermore, if the goal is to equalize error rates, which the passage says is the priority, you usually need to know the group membership to adjust the decision thresholds differently for each group. By blindfolding the model, you make it harder to achieve the very error rate balance the article claims is most important. This is likely why you felt those two claims sat badly together. The article identifies a problem caused by group differences and proposes a solution that ignores group differences, which does not solve the arithmetic problem it just described.

  This leads to the claim that better data will not help. While it is true that better data cannot fix the impossibility of satisfying all three fairness metrics simultaneously, it is misleading to imply that better data does not help with fairness at all. Better data can reduce overall error rates, making the trade-offs less severe even if they cannot be eliminated. It can also help ensure that the risk scores are based on relevant factors rather than proxies for protected characteristics. The article treats fairness as a binary state that is either achieved or impossible, whereas in practice, fairness is about minimizing harm and managing trade-offs. So while your brother-in-law is right that the math is correct, he may be overlooking that the impossibility result applies only to this specific combination of definitions, not to the broader project of making systems more equitable.

  Finally, the closing conclusion that algorithmic fairness is a contradiction in terms rather than an engineering problem is a significant overstatement. The modest version of the result commits us only to the fact that we cannot maximize all desirable properties at once. It forces a choice, but it does not render the effort meaningless. Saying fairness is a contradiction in terms is like saying budgeting is a contradiction in terms because you cannot maximize spending on every category simultaneously. It is instead a resource allocation problem that requires value judgments. The engineering problem shifts from finding a perfect solution to explicitly choosing which fairness metric aligns best with the social goal at hand. For example, in some contexts, calibration is most important so that individuals are assessed accurately regardless of group. In others, equal error rates are most important to ensure equal burden of mistakes. The math tells us we must choose, not that we must give up.

  In summary, the passage is accurate on the existence of the mathematical trade-off and the role of base rates, but it is confused on the remedy of blindness and overly pessimistic in its conclusion. The impossibility theorem is a constraint on design, not a proof of futility. You should trust the math regarding the trade-offs, but be skeptical of the claim that this makes fairness impossible or that hiding demographic data is the standard solution among experts. In fact, many experts argue that ignoring group data prevents us from measuring and correcting for the very disparities the math highlights. Your hesitation was well-founded, as the article conflates a specific mathematical limitation with a general condemnation of the field.

  I hope this helps clarify where the article stands on solid ground and where it begins to speculate beyond what the proofs actually say.

