  2.  **Deconstruct the Philosophical Debate:**
      *   *Counterfactual Theory (Lewis):* $C$ causes $E$ iff if $C$ had not occurred, $E$ would not have occurred. Relies on "possible worlds" and a "similarity metric" (which worlds are closest to actuality). Problems: Preemption, overdetermination, backtracking.
      *   *Interventionist Theory (Woodward/SEM):* $C$ causes $E$ iff there is a possible intervention on $C$ that changes $E$, holding other variables fixed. Relies on Structural Equation Models (SEMs) and the $do()$ operator. Focus on modularity and invariance.
      *   *Key Tension:* Is causation about how the actual world compares to nearby alternatives (similarity), or is it about how the system responds to specific external forcings (modularity/manipulation)?

  3.  **Translate to Engineering Vocabulary:**
      *   *Possible Worlds:* Alternative design configurations / Load cases / Scenario trees.
      *   *Similarity Metric:* Deviation cost / Retrofit effort / Distance from baseline spec.
      *   *Counterfactual Dependence:* System output sensitivity to component state changes in simulation scenarios.
      *   *Intervention:* Bounded-subsystem perturbation (active testing, stress testing).
      *   *Background Conditions:* Baseline redundancy states / Environmental boundary conditions.
      *   *Structural Equations:* System dynamics models / Transfer functions / State-space representations.
      *   *Do-operator:* Forced input override (decoupling the component from its upstream drivers).

  4.  **Drafting the Restatement (The Debate):**
      *   *Counterfactual Side:* Focus on "Scenario Sensitivity." If we simulate a failure mode (remove component $C$), does the system performance ($E$) degrade? We need to define which alternative scenarios count as "relevant" (closest to design spec).
      *   *Interventionist Side:* Focus on "Active Perturbation." Can we inject a signal or fault at node $C$ independently of its inputs and see a change at $E$? This requires the system to be modular (decouplable).
      *   *The Conflict:* The Counterfactual engineer worries about the *cost* of the scenario (is this failure mode realistic?). The Interventionist engineer worries about the *isolation* of the test (did we truly decouple $C$ from its parents?).

  5.  **Drafting the Residue Report (Missing Pieces):**
      *   *Distinction 1: Causal vs. Logical/Mathematical Dependency.* In engineering, equations are equations. $V=IR$. If $R$ changes, $I$ changes. Is $R$ causing $I$ or vice versa? Philosophy cares about directionality beyond math. Engineering often treats this as signal flow.
      *   *Distinction 2: Default vs. Deviant States (Normality).* Lewis uses "normal" worlds for similarity. Engineering uses "design basis" vs. "off-nominal." But engineering norms are pragmatic (codes/standards), not metaphysical.
      *   *Distinction 3: Observation vs. Forcing.* Bayesian updating vs. Control input. In engineering, sensors vs. actuators. This maps well, but the *conceptual* gap (correlation vs. causation) is often bridged by system ID techniques rather than philosophical distinction.
      *   *Distinction 4: Preemption/Overdetermination.* Two load paths fail, system stands. Philosophy struggles with "which caused survival?" Engineering says "redundancy margin absorbed it."

  6.  **Evaluating the Residue (Limitation vs. Convention):**
      *   *Causal vs. Logical:* In physics-based models, directionality is time/energy flow. In purely statistical models, it's ambiguous. This is a modeling convention limitation, not a vocabulary gap.
      *   *Normality:* Engineering defines "normal" via safety factors. This is a pragmatic convention.
      *   *Observation vs. Forcing:* This is hardware (sensor vs. actuator). The philosophical distinction is real but physically instantiated.
      *   *Conclusion:* The debate largely collapses into modeling choices (static analysis vs. dynamic control testing).

  7.  **Refining the Tone:**
      *   Must sound like an engineering technical memo or briefing.
