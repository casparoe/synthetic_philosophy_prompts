  10. (Drafting content with specific vocabulary constraints...) *Ensure "perturbation budgets," "redundancy margins," "feedback loops," "cross-scale interactions" are used appropriately.*

      *   *Counterfactual:* "If we re-run the simulation with Component C removed (within the perturbation budget of realistic failure modes), does the performance metric E drop?"
