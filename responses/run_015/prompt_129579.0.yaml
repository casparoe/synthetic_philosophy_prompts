answer: |-
  The pattern you have identified is indeed striking, and your intuition that it lacks a unified philosophical backbone is correct. The institutional behaviour you describe does not stem from a single, coherent aesthetic theory. Rather, it is a pragmatic patchwork of competing ethical frameworks, economic risk assessments, and legal liabilities. However, we can reconstruct the *implicit* commitments that make this patchwork function, even if they do not form a consistent whole.

  ### Reconstructing the Implicit Theory

  The current institutional practice presupposes a view that might be termed **Consequentialist Contextualism with a Capital Constraint**. It is not judging the *intrinsic* aesthetic value of the work (which would be a matter of autonomism or moralism), but rather the *ethical permissibility of the transaction* involved in distributing or displaying it.

  There are three main pillars to this implicit logic:

  **1. The Flow of Capital and Celebrity (The Living vs. The Dead)**
  The sharpest distinction in your observation is between living and dead artists. This presupposes that the primary ethical harm in consuming art by a wrongdoer is **complicity in their ongoing success**.
  *   **Living Artists:** Streaming services demonetise or suppress living offenders because royalties constitute direct financial support and algorithmic recommendation constitutes ongoing cultural validation. The institution becomes a co-conspirator in rewarding the bad behaviour.
  *   **Dead Artists:** Once the artist is deceased, royalties typically pass to estates or heirs (who may be innocent), and the artist cannot be 'celebrated' in the present tense. The work shifts from being a 'current product' to a 'historical document'. The implicit theory here is that moral taint is attached to the *agent's current agency*, not the object itself. Once the agent is removed from the equation, the object becomes ethically neutral enough to display, provided there is contextualisation (the biographical plaque).

  **2. The Collateral Damage Principle (Film vs. Music/Visual Art)**
  The discrepancy between film directors and musicians or painters relies on the **ontology of the medium**.
  *   **Film:** Cinema is massively collaborative. To suppress a film because of its director is to punish the actors, cinematographers, editors, and crew, none of whom may share the director's moral record. The implicit commitment is a form of **Utilitarianism**: banning the work causes more net harm (to innocent workers) than allowing it.
  *   **Music/Painting:** While there are producers and engineers, the public persona is often more tightly bound to the individual performer or the singular vision of the painter. Suppressing a song by a convicted violent criminal is seen as targeting the primary beneficiary of the fame.

  **3. The Glorification Constraint (Prisoners vs. Historical Figures)**
  Refusing to hang work by current prisoners whilst keeping work by historical figures suggests a commitment to avoiding the **commodification of crime**.
  *   Displaying a prisoner's work risks turning their incarceration into a marketing tool or validating their notoriety. It creates a 'celebrity criminal' dynamic that institutions wish to avoid.
  *   Historical figures are viewed through a lens of **heritage**. Their work is seen as part of the fabric of culture that cannot be removed without distorting history. The implicit theory is that we have a duty to preserve cultural history that outweighs the duty to punish the dead, whereas we have no such duty to platform the living.

  ### Is the Practice Coherent or Underdetermined?

  Philosophically, this pattern is **incoherent**. It violates the principle of universalisability. If moral wrongdoing diminishes the value of art, it should do so regardless of whether the artist is breathing. If art is autonomous, it should be played regardless of the artist's prison status.

  However, the practice is **philosophically underdetermined**. This means that several rival ethical theories could license exactly the same pattern of behaviour, even if they disagree on *why*.

  *   **A Rule-Utilitarian** would support the current system because it minimises harm: it stops funding criminals (living), protects innocent film crews (film), and preserves culture (dead artists).
  *   **A Contractualist** might argue that we have a social contract not to profit from serious wrongdoing, but that contract expires upon death, as the dead cannot benefit from social standing.
  *   **A Risk-Manager** (non-philosophical) would argue that supporting a living criminal invites boycotts and bad PR, whilst removing a dead artist invites accusations of censorship and historical revisionism.

  Because these different routes lead to the same policy outcomes, the institutions do not *need* a consistent theory. They are operating on a **modus vivendi**—a compromise that keeps the lights on and the lawsuits away—rather than an aesthetic philosophy. They are prioritising **distributional ethics** (is it right to show this *now*?) over **ontological aesthetics** (is this object *good*?).

  ### Policy Implications of Radical Alternatives

  To understand what is at stake, we must look at what would happen if institutions actually adopted one of the two consistent philosophical extremes you mentioned.

  **Scenario A: Radical Autonomism**
  *View:* Aesthetic value is completely independent of the artist's moral character. The 'biographical fallacy' is absolute.
  *   **Policy Changes:**
      *   **Streaming:** Algorithms would treat convicted murderers exactly the same as saints. Royalties would be paid regardless of criminal status.
      *   **Galleries:** New acquisitions by prisoners would be hung without special censure or explanatory plaques regarding their crime.
      *   **Context:** Biographical plaques mentioning crimes would be removed from historical works as irrelevant 'noise'.
      *   **Consequence:** This would likely lead to significant public backlash. It treats art as a hermetically sealed object. It assumes the audience can purely appreciate form without the context of production affecting the reception. It effectively privatises the moral risk: 'If you enjoy this, that's on you, not us.'

  **Scenario B: Radical Moralism**
  *View:* Serious moral wrongdoing always diminishes the work's value (or renders it toxic), regardless of time.
  *   **Policy Changes:**
      *   **Archives:** A massive purge would be required. Works by Caravaggio (murderer), Wagner (antisemite), Picasso (abuser), and Polanski (convicted criminal) would be removed from permanent collections.
      *   **Curriculum:** University modules would have to excise significant portions of art history.
      *   **Streaming:** Vast libraries of music and film would become unsearchable or deleted.
      *   **Consequence:** This leads to a form of cultural iconoclasm. It presupposes that the moral flaw in the creator infects the object itself permanently. It risks erasing the very history we need to understand human nature. It also raises the question of *who* decides the threshold of 'serious wrongdoing'—a dangerous power for any institution to hold.

  ### Conclusion

  The institutional pattern you have noticed is not a hidden philosophical theory waiting to be decoded; it is a **pragmatic negotiation** between our desire to punish bad actors, our desire to preserve culture, and our desire to avoid economic loss.

  It presupposes that **moral accountability is primarily about current benefit and complicity**, not about the metaphysical status of the artwork. It assumes that we can separate the *object* from the *transaction*. When the artist is dead, the transaction is clean. When the artist is alive, the transaction is tainted. When the medium is collaborative (film), the transaction involves too many innocent parties to block.

  If you are arguing with your friends, the strongest point you can make is that the 'separation of art and artist' is not a binary switch. In practice, it is a sliding scale determined by **time, medium, and money**. The institutions are not acting as aestheticians; they are acting as gatekeepers trying to navigate a moral landscape where the map keeps changing. To demand consistency from them is to demand they choose between being moral purists (empty galleries) or amoral merchants (no filters), when in reality, they are trying to be neither.
