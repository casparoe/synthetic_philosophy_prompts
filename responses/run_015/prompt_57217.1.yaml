answer: |-
  **Scenario**
  Marin County voters face Measure A, a $150M school seismic retrofit bond requiring a 55% supermajority. The true fiscal risk is low (the bond is safe), but uncertain. Without external guidance, voters rely on fragmented private signals—local contractor estimates, neighborhood gossip, property value trends—which are noisy but independent. The County Fiscal Analyst releases the mandatory impartial report: an unbiased, high-precision cost model that, in this specific instance, suffers a rare negative shock (underestimating regional supply chain inflation), incorrectly flagging a high risk of overrun. Voters are competent Bayesians: they recognize the Analyst's historical accuracy (85%) exceeds their private noise (55%), so they rationally weight the public report heavily. The report's conclusion ("High Risk") swamps the diverse private signals ("Low Risk"), correlating the electorate's errors.

  **Rough Numbers**
  *   **Electorate ($N$):** 50,000 voters.
  *   **True State:** Bond is Safe (Correct Vote = Yes).
  *   **Pre-Analysis:** Individual competence $p_1 = 0.55$ (based on private signals); Error correlation $\rho \approx 0$.
      *   *JCT Prediction:* $P(\text{Majority Correct}) \approx 1.0$.
  *   **Post-Analysis:** Individual competence $p_2 = 0.85$ (Bayesian update combining private + expert); Error correlation $\rho \approx 0.6$ (driven by shared reliance on the expert).
      *   *JCT Prediction:* $P(\text{Majority Correct}) \approx 1.0$ (since $p_2 > p_1$).
      *   *Actual Outcome:* $P(\text{Majority Correct}) \approx 0.85$ (bounded by the expert's accuracy, not $N$). In this realization, the expert is wrong, so the Majority votes No (Incorrect).

  ***

  **1. The Straightforward JCT Application**
  A naive Condorcet Jury Theorem (CJT) application looks strictly at the marginal increase in individual competence ($p$). It observes that the expert analysis raises the probability of any single voter choosing the correct option from 0.55 to 0.85. Leaning on the assumption that voter errors are **conditionally independent**, the theorem predicts that as $N$ remains large, the probability of the majority being correct must approach 1.0 even faster than before. The JCT optimist sees a population that is both larger and smarter, and concludes the epistemic quality of the verdict has strictly improved.

  **2. The Mechanism: Where Independence Leaks**
  The deterioration occurs because the expert analysis transforms independent errors into correlated errors. In the pre-analysis state, voter errors are idiosyncratic ($\epsilon_i$); the Law of Large Numbers washes them out, leaving the true signal. In the post-analysis state, the voter's decision function becomes $V_i = w_{\text{pub}} \cdot S_{\text{expert}} + w_{\text{priv}} \cdot S_{\text{private}_i}$. Because $S_{\text{expert}}$ is identical for all $i$, the error term now contains a common component ($\epsilon_{\text{common}}$). The variance of the aggregate vote no longer scales as $1/N$; it scales as $\rho + (1-\rho)/N$. When $\rho$ is high (0.6), the electorate effectively behaves like a group of only a few hundred independent voters, or even a single voter if the public weight dominates. In this specific realization, the common signal is misleading. Because every voter rationally trusts the expert more than their neighbor, the diverse private signals that would have saved the verdict are mathematically swamped. The voters are individually more justified (higher $p$), but collectively more fragile.

  **3. The Counterfactual**
  In the counterfactual run (no analysis published), the same 50,000 voters rely solely on their private signals ($p=0.55$). While any individual is more likely to be wrong than in the analysis scenario, their errors are uncorrelated. The aggregate noise cancels out, and the majority correctly identifies the bond as safe (Vote Yes). We know this outcome is "better" because the fact of the matter is verifiable ex-post: the bond passes, construction costs remain within the original budget (the expert's fear was a false positive), and schools are retrofitted without tax waste. The no-analysis scenario yields the truth; the analysis scenario yields a false negative driven by model noise.

  **4. The Single Feature and Its Removal**
  The feature doing the work is the **centralization of the signal**. The analysis provides a single point estimate that acts as a focal point for the entire electorate. If you remove this feature by **disaggregating the analysis**—for example, if the County published the raw data and methodology but required each of the 500 precincts to commission their own independent interpretation from a random pool of auditors—the common error component breaks up. The correlation $\rho$ drops back toward zero. The JCT kicks back in, and the aggregate verdict returns to near-certain correctness, even if individual precinct interpretations are noisier. The failure was not the information, but the *shared* nature of the information.

  **5. Critique and Defense**
  A transparency advocate would attack this case by arguing from **ex-ante expected utility**. They would say: "The expert is right 85% of the time. Without the expert, you are relying on a coin flip (55%). Over 100 elections, the expert saves you 30 mistakes, while the 'diverse ignorance' strategy saves you only 5. You are cherry-picking a tail-risk realization to argue against a superior heuristic."

  This attack lands partially but misses the epistemic democrat's specific concern. The advocate is correct that the *average* voter accuracy improves. However, the epistemic democrat cares about the *reliability of the aggregation mechanism* for high-stakes, one-off decisions. If the goal is to minimize the probability of catastrophic error in a specific instance (like a bond that kills a district if failed unnecessarily), the correlated risk introduced by the expert is a systemic vulnerability. The attack concedes the point: yes, the analysis makes the group more accurate on average, but it makes the group *less robust* to the specific failure mode of the expert. The case holds: information centralization trades tail-risk resilience for mean accuracy.
