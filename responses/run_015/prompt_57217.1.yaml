      *   *Assumptions:* Binary choice (True/False), $n$ voters, individual competence $p > 0.5$, independent votes.
      *   *Result:* As $n \to \infty$, probability of correct majority $\to 1$.
      *   *Vulnerability:* The independence assumption. If votes are correlated, the effective $n$ drops. If correlation is high enough, the group acts like a smaller group or even a single voter.
      *   *The Twist:* The prompt asks for a case where *improving* $p$ (individual competence) leads to a *worse* aggregate outcome because it destroys independence.
      *   *How?* Voters have private signals ($s_i$) and a public signal ($S$).
      *   *Scenario:* $S$ is accurate *on average* (unbiased), but in *this specific instance*, it is misleading due to random noise. Private signals are diverse.
      *   *Without $S$:* Voters rely on $s_i$. Errors cancel out. Majority wins.
      *   *With $S$:* Voters update heavily on $S$ because it's "expert." $S$ dominates $s_i$. Since $S$ is the *same* for everyone, errors become correlated. If $S$ is wrong this time, the majority goes wrong, despite $S$ being a "good" signal ex-ante.
      *   *Crucial Detail:* The prompt requires voters to be *strictly better informed*. This means their posterior probability of being right *ex-ante* (before seeing the realization of the signal) increases. However, *ex-post* (given the specific realization where $S$ is misleading), the outcome worsens.
