      *   *Interpretation:* This implies an ex-post evaluation. In *this specific election*, the measure passes/fails incorrectly *because* of the analysis, whereas without it, they would have gotten it right. The "better informed" claim must hold in expectation (the analysis is valuable), but the realization is unlucky.
      *   *Refinement:* To make this robust, the "common noise" in the expert analysis must be large enough to correlate errors, but the analysis must still be "good" (unbiased estimator). The voters are Bayesian. They weight the public signal higher because it has lower variance than private signals. But if the public signal realizes a tail error, everyone goes with it.

