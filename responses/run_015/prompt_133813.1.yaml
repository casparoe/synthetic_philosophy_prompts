  2.  **Deconstruct the Philosophical Core (Rawls for Budgeters):**

      *   *The Difference Principle:* Inequalities are only justified if they help the worst-off more than any alternative arrangement.
      *   *The Veil of Ignorance:* Design rules as if you don't know your place in the system. In this context, it means setting the *criteria* before knowing which schools benefit.
      *   *Least Advantaged:* Needs an operational definition using available data.
      *   *Primary Goods:* In a school context, this translates to resources that improve life prospects (education, safety, stability).
      *   *One-Year vs. Life Prospects:* The budget is annual, but the principle is long-term. The procedure needs to bridge this (e.g., sustainability weighting).

  3.  **Drafting the Procedure (The "One-Pager"):**

      *   *Goal:* Simple, ordered questions/tests.
      *   *Addressing "It helps everybody":* This is the classic utilitarian trap. Rawls rejects "a rising tide lifts all boats" if the boat at the bottom stays stuck. The test must force a comparison: Does this help the bottom *more* than giving the money directly to the bottom?
      *   *Defining "Least Advantaged":* Avoid circularity. Use baseline data *before* the money is spent. Rank schools, not kids (administrative feasibility). Use a composite index of the available columns (FRL, Test Scores, etc.).
      *   *Veil of Ignorance:* Use it to set the rules *now* for *future* years, or at least to agree on the weighting of the index before looking at which schools win.
      *   *Stopping Point:* When trade-offs involve non-quantifiable values (community cohesion vs. academic metrics).

  4.  **Developing the "Least Advantaged" Index (Breaking the Circle):**

      *   User worry: You need distribution to know who's bottom, but need bottom to decide distribution.
      *   Solution: Use *current* status quo data. The "least advantaged" are those currently worst off *before* this specific $4M is spent.
      *   Ranking: Rank schools, not kids. It's actionable.
      *   Index: Combine FRL % (poverty), Test Scores (achievement gap), and Turnover (stability). Keep it simple. Top 25% of need = "Least Advantaged Group."

