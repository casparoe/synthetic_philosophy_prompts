answer: |-
  Here is the procedure, the philosophical setup, and the application to your three proposals.

  ### Part 1: The One-Page Procedure
  *Print this section. Tape it to the wall. Do not start talking until everyone agrees to these rules.*

  **THE RAWLS BUDGET TEST**
  **Goal:** Distribute $4M to maximize the prospects of the "Least Advantaged" students.

  **STEP 1: DEFINE "LEAST ADVANTAGED" (Do this once, before looking at proposals)**
  *   **Unit:** Rank **Schools**, not individual kids. (We budget for schools).
  *   **Data:** Use last year's numbers (Baseline). Do not use projections.
  *   **The Index:** Create a "Need Score" for every school using three columns only:
      1.  % Free/Reduced Lunch (Weight: 50%)
      2.  % Students Below Proficient in Math/Reading (Weight: 25%)
      3.  Teacher Turnover Rate (Weight: 25%)
  *   **The Cutoff:** The bottom 25% of schools on this list are the "Least Advantaged Group." All other schools are "Advantaged."
  *   **Veil Check:** Agree on these weights *before* calculating the scores. If you change the weights after seeing which schools win, you failed the Veil of Ignorance.

  **STEP 2: THE FIVE QUESTIONS (Ask these for every proposal)**
  *If the answer to Q1 is No, reject immediately. If Q2-Q5 are not satisfied, reject.*

  1.  **The Target Test:** Does the primary benefit go to the "Least Advantaged Group" defined above?
      *   *Real Answer:* "Yes, 80% of the dollars serve schools in the bottom quartile."
      *   *Hand-Waving:* "It helps everybody," or "Poverty exists in rich schools too." (Reject this. We are fixing the floor, not the average.)
  2.  **The Necessity Test:** If this proposal creates inequality (giving more to some schools than others), is that inequality *necessary* to help the Least Advantaged?
      *   *Real Answer:* "We cannot get the STEM money for the poor kids without funding the labs for the rich kids."
      *   *Hand-Waving:* "It motivates the rich schools to perform better," or "It's fair because they raised the money."
  3.  **The Comparison Test:** Does this help the Least Advantaged *more* than simply giving them the cash directly?
      *   *Real Answer:* "A literacy coach provides expertise we cannot buy with general funds."
      *   *Hand-Waving:* "It helps everybody." (If it helps everybody, give it to the kids with the least. Inequality is only allowed if it lifts the bottom *higher* than equality would.)
  4.  **The Time Test:** Does this improve long-term life prospects, or just fix this year's budget?
      *   *Real Answer:* "This builds a program that the state will fund next year."
      *   *Hand-Waving:* "It helps for this year." (One-year fixes for life-long problems are suspect unless they are critical interventions.)
  5.  **The Veil Check:** If you did not know which school you currently represent, would you still agree this is the fairest rule?
      *   *Real Answer:* "Yes, because if I ended up in the poorest school, this gives me the most help."
      *   *Hand-Waving:* "Yes, because my school deserves this."

  **STEP 3: THE STOP RULE**
  *   If a proposal passes all five questions but destroys a community asset not on the spreadsheet (e.g., closing a neighborhood hub), **flag it for the Superintendent.** The spreadsheet cannot measure grief or social capital. That is a values call, not a math call.

  ***

  ### Part 2: Breaking the Circles & Using the Veil

  **1. Breaking the "Who is Least Advantaged?" Circle**
  You are worried that you need the distribution to know who is at the bottom, but need to know who is at the bottom to decide the distribution.
  *   **The Fix:** Use the **Status Quo Baseline**. You are not judging who *will be* least advantaged after the money is spent. You are judging who *is currently* least advantaged before you spend a dime.
  *   **Why Schools, Not Kids?** You cannot budget for individual kids in April. You budget for buildings. Rank the buildings. The "representative person" in Rawls' theory is the "representative student at School X." If School X is in the bottom quartile of the Need Index, every kid there counts as "Least Advantaged" for this procedure.
  *   **Agreement:** Get the five of you to sign off on the Index weights (50% FRL, etc.) *before* you run the numbers. That is your "Veil of Ignorance" moment. You are agreeing to the rule while pretending you don't know which school will come out #1.

  **2. The Veil of Ignorance in a Room of Principals**
  You cannot pretend you don't know your school. You know exactly who you are.
  *   **The Move:** Use the Veil for **Rule-Setting**, not **Decision-Making**.
  *   **How:** In the first 20 minutes, before you look at a single proposal, agree on the "Need Index" weights. Ask: "If I were assigned to a random school in this district tomorrow, would I agree to this formula?"
  *   **What to Ignore:** Do not pretend you don't know that poverty hurts learning. That is a fact. Pretend you don't know *which* principal in this room represents the poor school.
  *   **What to Keep:** Keep your professional knowledge. You know that teacher turnover hurts kids. You know facilities matter. Use that knowledge to build the Index, then lock it.

  **3. Where the Procedure Stops**
  The procedure stops when the spreadsheet contradicts human reality.
  *   **The Limit:** Rawls cares about "Primary Goods" (rights, liberties, opportunities, income, wealth). In schools, that means education and safety. It does not measure "community cohesion," "pride," or "neighborhood stability."
  *   **The Handoff:** If a proposal passes the math but destroys a community hub, the spreadsheet has done its job. It says "This maximizes academic prospects." It cannot say "This is worth the social cost." That is when you hand it to the Superintendent. She gets paid to make the political call. You get paid to make the fiduciary call.

  ***

  ### Part 3: Running the Proposals

  Here is how the procedure processes your three floating proposals.

  **Proposal 1: Literacy Coaches (6 Highest-Poverty Elementary Schools)**
  *   **Target Test:** **PASS.** Targets the bottom quartile directly.
  *   **Necessity Test:** **PASS.** You can't put a coach in every school; resources are scarce. Inequality is necessary to focus intensity.
  *   **Comparison Test:** **PASS.** Specialized coaching is more effective than generic cash for literacy gaps.
  *   **Time Test:** **FAIL (Partial).** It is a one-year grant. Rawls cares about life prospects. A one-year coach might vanish before the kid learns to read.
  *   **Verdict:** **APPROVE, WITH CONDITION.** You must require a plan to absorb the cost into the base budget by Year 2, or prioritize schools where a one-year intervention has proven lasting impact.
  *   **Why:** This is the easiest call. It aligns perfectly with the Difference Principle.

  **Proposal 2: Science Labs (Affluent) + STEM Program (Low-Income)**
  *   **Target Test:** **PASS.** The STEM program targets the Least Advantaged.
  *   **Necessity Test:** **PASS.** The donor requires the labs. The inequality (labs for rich) is the *price* of the benefit (STEM for poor). Without the inequality, the benefit does not exist.
  *   **Comparison Test:** **PASS.** Assuming the STEM program is robust, it provides opportunities the district couldn't fund alone.
  *   **Time Test:** **PASS.** The STEM program is funded for five years. This builds long-term prospects.
  *   **Verdict:** **APPROVE.**
  *   **Why:** This feels dirty. It feels like selling out the rich kids' labs to buy poor kids' success. But Rawls explicitly allows inequality *if* it is the engine that drives the benefit to the bottom. If refusing the labs kills the STEM program, you are hurting the least advantaged to avoid feeling guilty about the rich. Take the money.

  **Proposal 3: Closing the Tiny K-8 School (Poorest Neighborhood)**
  *   **Target Test:** **PASS.** The kids moving are the Least Advantaged.
  *   **Necessity Test:** **PASS.** The resources are concentrated at the larger school.
  *   **Comparison Test:** **PASS.** The spreadsheet says test scores, attendance, and facilities improve for these kids.
  *   **Time Test:** **PASS.** Permanent structural improvement.
  *   **Veil Check:** **PASS.** If you were a poor kid in that building, you would vote to move to the better building.
  *   **Verdict:** **APPROVE.**
  *   **The Hard Truth:** **This is the one you don't want.** You said, "I think something real is being lost that none of our columns see." You are right. But the Board's mandate is Rawlsian. It says maximize the prospects of the least advantaged.
  *   **Why You Must Accept It:** The Rawlsian framework prioritizes the **material base of the child's future** (education, safety, resources) over the **social capital of the neighborhood** (community cohesion, local identity). The spreadsheet shows the kids get a better education. The "loss" you feel is real, but it is a loss for the *community*, not necessarily for the *student's life prospects*.
  *   **The Procedure's Limit:** This is where you use the **Stop Rule**. The procedure says "Close it." You should flag this for the Superintendent with a note: *"Budget logic dictates closure. Community cost is unquantified. This requires a political decision."* But if the Board's mandate is strictly Rawlsian, the math wins. The kids' future prospects outweigh the neighborhood's anger.

  ***

  ### Part 4: What This Procedure Gets Wrong (Every Single Year)

  You asked for the mistakes. Here they are. Do not try to fix them; just expect them.

  1.  **It Ignores Transition Trauma:** The procedure assumes a kid moves from School A to School B and instantly gets the benefits of School B. It does not measure the stress of busing, the loss of friends, or the culture shock. It assumes "Better Facilities" = "Better Life." Sometimes, a stable, mediocre school is better for a specific child than a chaotic, high-performing one. The spreadsheet cannot see stability.
  2.  **It Punishes Success:** If a "Least Advantaged" school suddenly improves its test scores because of your funding, next year's Index might kick them out of the "Least Advantaged" group. You will inadvertently punish schools that succeed in raising their kids up. You will need a "lag" in the data (use a 3-year average) to fix this, or you will create a poverty trap.
  3.  **It Cannot Measure "One-Year" vs. "Life":** Rawls is about a whole life. You have a one-year budget. A one-year literacy coach is not a life prospect. The procedure forces you to treat them as comparable. You will inevitably fund "band-aids" because they are cheap, even if "surgery" (long-term investment) is what the principle demands.
  4.  **It Reduces Kids to Columns:** The "Need Index" assumes FRL and Test Scores capture "disadvantage." They miss homelessness, trauma, disability, or neighborhood violence that isn't captured in attendance. You will fund schools that *look* poor on paper, while missing pockets of deep poverty in schools that *look* average.

  **Final Advice:**
  Use the One-Pager to stop the principals from fighting for their own buildings. When Principal A says "My kids need this," point to Question 1: "Are you in the bottom quartile?" If no, the rule says no. It takes the blame off you and puts it on the Board's philosophy.

  For the School Closure: Run the numbers. If they pass, recommend closure. But attach the "Stop Rule" flag. Let the Superintendent take the heat for the community anger. Your job is to ensure the money follows the principle.
