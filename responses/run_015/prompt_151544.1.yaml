answer: |-
  This is a sharp intuition. You've identified the exact friction point where decision theory meets engineering reality. Most teams treat estimation as a guessing game, but framing it as a conflict between Inside View (IV), Outside View (OV), and Epistemic Modesty (EM) gives you leverage to fix it.

  Since you want a **defended agenda** rather than a survey, I am going to rank these open questions by **leverage**. I'm prioritizing questions where solving them yields the biggest reduction in estimation error for the least amount of process overhead.

  Here is the ranked agenda, from upstream/foundational to downstream/tactical.

  ---

  ### 1. The Reference Class Construction Problem (Upstream)
  **Question:** *What defines "similar enough" to count as data?*
  **Status:** High Importance / High Dependency / Basic Reasoning Tools
  **Verdict:** **Solve this first.**

  This is the single biggest failure point. The Outside View is only as good as the reference class. If you compare a new authentication flow to a CRUD form because they both "have inputs," your OV is garbage. If you compare it to previous auth flows, but the tech stack changed, your OV is also garbage.

  *   **Why it's upstream:** If your reference class is wrong, aggregating opinions (Question #3) or applying modesty buffers (Question #4) is just refining noise.
  *   **Tractability:** You don't need formal stats. You need **feature tagging**. Instead of "Story Points," track metadata: "Involves 3rd party API," "Touches Legacy DB," "Requires New Lib."
  *   **The Edge Case (New Stack):** When you have zero history, you cannot use *historical* reference classes. You must switch to *structural* reference classes. Don't ask "How long did this take before?" Ask "How many distinct state transitions does this have?" Compare it to tasks with similar *complexity topology*, even if the domain was different.
  *   **Evidence to move this:** If you start tagging tasks by technical characteristic rather than domain, and your variance drops, this is solved. If variance stays high, the tags are too broad.

  ### 2. The "Null Outside" Protocol (Tractable)
  **Question:** *When OV is impossible (new tech), how do we simulate it without falling into IV optimism?*
  **Status:** High Importance / Standalone / Process Tool
  **Verdict:** **Standardize this immediately.**

  This addresses your specific worry about brand-new stacks. When OV is null, the IV dominates, and optimism bias spikes. Epistemic Modesty here shouldn't mean "we don't know"; it should mean "we know our IV is uncalibrated."

  *   **The Fix:** **Forced Decomposition + Pre-Mortems.**
      *   *Decomposition:* You cannot estimate "Build Search Service." You can estimate "Index Schema," "Query Parser," "API Endpoint." The sum of parts is usually larger than the gut feel of the whole (this counters the IV planning fallacy).
      *   *Pre-Mortem:* Ask "It's two weeks later and we missed the deadline. What broke?" This surfaces hidden unknowns that the IV ignores.
  *   **Why not heavy machinery:** Bayesian updating is too slow for sprint planning. A simple rule like "New Stack = 2x IV Estimate" is often more robust than a complex model because it accounts for the *unknown unknowns* (learning curve, setup friction).
  *   **Dead End:** Trying to find analogies in other companies or open source projects. The context delta is too high; the data is noisy.

  ### 3. Aggregating Divergent Inside Views (Process)
  **Question:** *How do we combine estimates when the team disagrees on the Reference Class?*
  **Status:** Medium Importance / Dependent on #1 / Basic Reasoning
  **Verdict:** **Resolve the disagreement, don't average the numbers.**

  You asked specifically about this. If Dev A picks Reference Class "Simple API" (2 days) and Dev B picks "Complex Data Migration" (5 days), averaging to 3.5 days is mathematically valid but engineering-wrong. You are averaging two different hypotheses about the work.

  *   **The Agenda:** Treat estimation disagreements as **architectural ambiguities**.
      *   If the estimates diverge by >2x, do not vote. Stop and whiteboard.
      *   Usually, one person sees a complexity the other missed. The goal isn't consensus on the *number*; it's consensus on the *scope*.
      *   **Weighted by Track Record:** If you must aggregate without resolving (e.g., planning poker), weight the votes of seniors who have actually shipped in this specific stack higher. This is a heuristic, but it works better than democracy.
  *   **Why this matters:** Divergence is a signal of risk. Hiding it via averaging kills the signal.
  *   **Evidence to move this:** If high-divergence tickets consistently end up being the ones that spill over sprints, then your aggregation method is masking risk.

  ### 4. Incentive Calibration (Context)
  **Question:** *Are we estimating for prediction or for commitment?*
  **Status:** High Importance / Organizational / Hard to Fix
  **Verdict:** **Acknowledge it, but don't let it block #1-3.**

  This is the political layer. If management treats estimates as deadlines, engineers will pad (sandbag). If they treat them as guesses, engineers will be optimistic. Epistemic Modesty is punished in cultures that demand certainty.

  *   **The Implication:** You cannot have true Epistemic Modesty (admitting "I don't know") if the culture interprets that as incompetence.
  *   **The Fix:** Separate **Effort Estimates** (IV/OV blend) from **Commitment Dates** (which include buffer for meetings, bugs, context switching).
  *   **Why it's lower on the list:** You can improve estimation accuracy (Questions 1-3) even in a suboptimal culture. But you can't fix the culture with math. Solve the math first to build credibility, then use that credibility to fix the incentives.

  ### 5. Formal Bayesian Weighting (Dead End for Sprints)
  **Question:** *Can we mathematically optimize the weight between IV and OV?*
  **Status:** Low Importance / High Overhead / Formal Machinery
  **Verdict:** **Deprioritize.**

  There is literature on how to weight IV vs. OV based on the variance of the reference class and the specificity of the inside view. **Do not do this for sprint planning.**

  *   **Why:** The cost of calculating the weights exceeds the value of the estimate. Sprint estimates are cheap; engineering time is expensive. Spending 3 hours modeling the estimate wastes more money than missing the estimate by 10%.
  *   **When it matters:** Only for large-scale portfolio planning (quarterly/Yearly) where the stakes justify the modeling overhead.

  ---

  ### Summary of the Defended Agenda

  | Rank | Question | Priority | Tools Needed | Why |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Reference Class Construction** | **Critical** | Tagging/Metadata | Garbage in, garbage out. Determines validity of all data. |
  | **2** | **Null Outside Protocol** | **High** | Decomposition/Pre-mortem | Solves the "New Stack" edge case directly. |
  | **3** | **Aggregating Divergence** | **Medium** | Discussion/Weighting | Disagreement is a risk signal, not noise to average. |
  | **4** | **Incentive Calibration** | **High** | Process Separation | Political reality, but harder to control technically. |
  | **5** | **Formal Weighting** | **Low** | Statistics | Over-engineering for the value provided. |

  ### How to think about Aggregation (Your Specific Question)

  When your team picks different reference classes, **do not aggregate the estimates.** Aggregate the **risk assessments.**

  1.  **Surface the Class:** Ask Dev A: "What are you comparing this to?" Ask Dev B: "What are you comparing this to?"
  2.  **Identify the Delta:** If A says "It's like the Login API" and B says "It's like the Payment Integration," you have identified an architectural ambiguity. One of you is wrong about the scope.
  3.  **The Modesty Move:** The epistemically modest choice is to assume **both** might be right about different parts, or that the harder class is the binding constraint.
  4.  **Action:** Plan a **Spike** (time-boxed research task). "We don't know if this is Login or Payment complexity. We will spend 4 hours proving which reference class applies, then estimate."

  ### What Evidence Would Change This Ranking?

  *   **Move #5 Up:** If you are managing a portfolio of 50+ teams and missing quarterly goals consistently, then formal modeling becomes worth the cost.
  *   **Move #4 Up:** If you find engineers are consistently sandbagging by 50%+, no amount of reference class tuning will help. You have to fix the trust/incentive layer first.
  *   **Move #1 Down:** If you find that simple decomposition (breaking tasks down) reduces variance more than trying to categorize past tasks, then focus purely on task sizing and ignore historical data. (Though usually, you need both).

  ### Final Takeaway for a Backend Dev

  Epistemic Modesty in engineering isn't about being humble; it's about **calibration**.

  1.  **Stop guessing whole features.** Break them down until the "Inside View" is reliable (small tasks).
  2.  **Tag your history.** Build your own "Outside View" database based on technical traits, not business features.
  3.  **Treat disagreement as data.** If the team argues, the ticket is not ready.
  4.  **New Stack?** Assume you know nothing. Estimate based on complexity topology, then double it for the learning curve. That *is* the modest Outside View.
