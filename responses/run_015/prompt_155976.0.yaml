answer: |-
  # Thesis Defense Q&A Prep Sheet
  **Topic:** Negative Provenance Tracking (NPT) & Structured Absence
  **Defendant:** You
  **Date:** Thursday

  ### 1. The Lead Objection (Traditional Archivist #1)
  **The Voice:** Senior, concerned with ethics and standards (DACS/ISAD(G)).
  **The Question:** "You're arguing that neutrality is a myth, but our ethical code relies on the principle that we do not alter the historical record. If we start creating meta-records about why we *didn't* keep something, aren't we inserting ourselves into the provenance? You're turning the archive into a commentary on itself rather than a repository of evidence. How do you reconcile NPT with the core tenet of custodial neutrality?"

  **Your Reply (2 mins):**
  "Thank you. That's the central tension. My argument isn't that we should insert opinion, but that the *intake mechanism itself* is already an insertion. In the farmworker case, the archivist didn't choose to be biased; the intake sheet forced a binary choice: 'domestic' or 'unemployed.' That taxonomy is already a commentary on the value of that labor. It's not neutral; it's a filter.

  Negative Provenance Tracking doesn't add opinion; it documents the filter. It says, 'This record is absent because Category C did not exist on Form A in 1985.' That is factual custodial history, just like noting water damage or acid migration. If we only document what survived, we are implicitly validating the selection criteria that allowed it to survive. NPT makes the selection criteria visible. It shifts neutrality from 'pretending we don't filter' to 'documenting how we filter.' We aren't altering the record; we are contextualizing the hole."

  **⚠️ Weakness Flag:** You are redefining "neutrality" as "transparency." If they push that neutrality means *non-interference*, you have no ground to stand on other than "non-interference is impossible." Don't get bogged down in semantic definitions of neutrality; pivot quickly to *accuracy*.

  ---

  ### 2. The Scope Challenge (Traditional Archivist #2)
  **The Voice:** Pragmatic, worried about resources and backlog.
  **The Question:** "Let's say we accept the theory. Practically, where does this end? Every accession involves decisions. Do we want archivists writing essays on every box they decided *not* acquire? This sounds like a mandate for infinite metadata. How do you prevent NPT from paralyzing the intake process?"

  **Your Reply (2 mins):**
  "It's not about every box; it's about structural barriers. I'm not proposing we track individual curatorial taste. I'm proposing we track *systemic exclusions* embedded in our tools. In the 80s farmworker example, it wasn't one archivist's whim; it was a county-wide intake schema that lacked a 'seasonal labor' field.

  We track the decision-tree of the *system*, not the individual item. We create a standard field in our finding aids: 'Known Structural Gaps.' For example, 'Pre-1990 records exclude seasonal labor due to intake taxonomy.' That's one sentence, not an essay. It scales because it applies to the fonds, not the file. It actually saves time in the long run because it stops researchers from asking, 'Did you check the farmworker logs?' when the logs were never creatable. It manages expectation rather than creating work."

  **⚠️ Weakness Flag:** Defining "structural" vs. "individual" is messy. They will ask who decides what counts as structural. You need to be ready to say "committee review" or "schema audit," or you sound like you're giving individual archivists too much discretion.

  ---

  ### 3. The Agency Critique (Feminist Historian)
  **The Voice:** Theoretically aligned but skeptical of your framing.
  **The Question:** "I agree with your critique of power, but I worry you're overstating institutional agency. You call it 'structured absence,' implying the archive *produced* this silence intentionally. But looking at your 80s example, that sounds like negligence, incompetence, or just budget constraints. Are you attributing a level of design to what was actually just bureaucratic laziness?"

  **Your Reply (2 mins):**
  "That's a crucial distinction, and I appreciate it. I'm not arguing there was a conspiracy to silence farmworkers. But negligence *is* a structure when it's codified in a form. If an intake sheet has no field for a specific demographic, it doesn't matter if the archivist was lazy or overworked; the outcome is the same. The system is designed to be blind to that labor.

  My use of 'produce' isn't about intent; it's about outcome. A form without a checkbox produces absence just as effectively as a shredder. By focusing on the *design* of the intake rather than the *intent* of the archivist, we bypass the question of malice. We don't need to prove they wanted to hide the workers; we just need to prove the tool made the workers invisible. NPT documents the tool, not the motive."

  **⚠️ Weakness Flag:** You risk sounding like you're excusing the archivists ("It wasn't them, it was the form"). Make sure you emphasize that *maintaining* the form without review is an active choice by the institution.

  ---

  ### 4. The Implementation Trap (Digital Humanist)
  **The Voice:** Obsessed with schemas, interoperability, and data.
  **The Question:** "I like the data angle, but 'absence' is hard to schema. If you're documenting a decision tree that didn't happen, how do you encode that? Are we creating negative space in the metadata? If it's not machine-readable, it's just a note in a finding aid. How do you prevent NPT from becoming unsearchable narrative text?"

  **Your Reply (2 mins):**
  "It has to be coded. I propose an extension to the existing provenance metadata schema. We treat 'Exclusion Reason' as a controlled vocabulary field, linked to the 'Date of Appraisal.' For example, a tag like `EXCLUSION_CODE: TAXONOMY_GAP` with a value of `SEASONAL_LABOR_NOT_DEFINED`.

  This makes the absence queryable. A researcher could eventually search across repositories for `TAXONOMY_GAP` + `AGRICULTURE` and find patterns of silence across counties. I'm not suggesting narrative notes; I'm suggesting we treat the *capacity to collect* as metadata itself. The 'negative record' is just another object in the database, linked to the accession record that *would* have existed. It turns silence into data points."

  **⚠️ Weakness Flag:** You haven't built the schema yet. If they ask to see the XML or the ontology, you have to admit it's theoretical. Be honest: "The prototype is part of the post-thesis implementation plan."

  ---

  ### 5. The Prayer Question (The One You Hope They Skip)
  **The Question:** "Okay, let's say we implement Negative Provenance Tracking. Who is the audience? You're asking archivists to do more work to document why they failed marginalized communities. But does this actually return anything to the descendants of those farmworkers? Or is this just a way for archivists to feel better about the silence without fixing it?"

  **Why this hurts:** It attacks the *utility* of your thesis. If NPT is just navel-gazing for archivists, it's not ethical. It forces you to admit that documenting absence doesn't restore the lost records.

  **Your Reply (If asked):**
  "That is the hardest and most important question. NPT doesn't restore the records; nothing can. But it stops the archive from lying by omission. Right now, a descendant searching the catalog finds nothing and assumes their history wasn't significant. With NPT, they find a record that says, 'Your history was significant, but our system was built to ignore it.'

  It shifts the blame from the community to the institution. That validation is a form of reparative justice. It also gives community advocates the data they need to demand change. You can't fix a gap you aren't allowed to name. NPT names the gap so the community can pressure us to fill it going forward. It's not the repair itself; it's the blueprint for the repair."

  **⚠️ Weakness Flag:** This is your emotional close, but it's vulnerable. If they press, "Is naming enough?", you have to admit "No." Don't overpromise. Stick to "Naming is the prerequisite for repair."

  ---

  ### General Defense Strategy Notes
  *   **The "Neutrality" Trap:** If they keep hammering neutrality, use the phrase **"Reflexive Transparency."** It sounds like a standard archival term (even if you just coined it) and bridges the gap between traditional ethics and your critique.
  *   **The Farmworker Example:** Keep returning to this. It is your concrete anchor. Whenever the theory gets too abstract, say: *"In the 1984 intake logs..."*
  *   **Body Language:** When the Traditional Archivists speak, nod. Show you respect the standards. When you disagree, lean forward. When the DH person speaks, talk with your hands (schema shapes).
  *   **The "I Don't Know":** If they ask something about specific metadata standards you don't know, say: *"That's a technical implementation detail I plan to collaborate on with IT post-defense. My focus here is the archival theory."* Do not bluff on tech.

  Good luck. You've found a real silence; now make them hear it.
