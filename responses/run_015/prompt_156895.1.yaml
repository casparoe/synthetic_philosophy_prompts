      The glass case hums, a low vibration that settles in her teeth. Inside, row upon row, the teacups sit like silent mouths. All blue porcelain. All her mother's.

      In World 402, the chip is on the left rim. In World 403, the right. In her world, the handle is cracked clean through. She presses her palm against the cold pane. The curators insist these aren't copies. They say this is *the* cup, stretched thin across realities like butter on too much toast. Same clay, same fire, same hand holding it.

      But the hand is gone.

      Next to the ceramics lies the paper. Yellowed edges. The ink fades into a ghostly gray at the bottom of the page. *My dearest love, I never meant to make you feel...*

      It stops there. In every display case, down the infinite hallway, the ink dries at "feel."

      She used to think the interruption was accident. A phone ringing, a doorbell, a heart stopping. Now, watching the dust motes dance over the identical stoppages, she wonders if the silence is the artifact. The cup changes. The chip migrates. The crack shifts. But the sentence always breaks at the same breath.

      Is she mourning one woman who died a thousand different ways, or just the grammar of leaving?

      If the object is identical across worlds, then the grief should be too. But standing here, surrounded by versions of her mother who forgot to finish their thoughts, she feels only a singular, sharp hollow. The word "feel" hangs in the air, uncompleted. It doesn't belong to her mother anymore. It belongs to the space where the voice should be.

      She turns away from the glass. The cup remains, chipped and whole all at once. The letter stays unfinished. She carries the period that never came.

