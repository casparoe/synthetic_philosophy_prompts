answer: |-
  # HANDOUT: THE NEW RIDDLE OF INDUCTION — DECISION TREE

  **Instructions:** Start at **Q1**. Answer based on your intuition about the cases described. Follow the arrows to the next question or to a **Leaf**. Read the Leaf to find your philosophical position, its awkward commitment, and how it handles the specific test cases.

  ---

  ### THE TREE

  **Q1: The Evidence Question**
  *Do the observed emeralds **alone** (without assuming any rules about time or language) logically prove that the next one will be green rather than grue?*
  *   **YES** → **Leaf 1**
  *   **NO** → **Q2**

  **Q2: The Locus Question**
  *Is the reason we prefer "green" found in **how we speak and think** or in **how the world is structured**?*
  *   **HOW WE SPEAK** → **Q3**
  *   **HOW THE WORLD IS** → **Q4**

  **Q3: The Community Question**
  *Imagine a community whose language has "grue" as a primitive word and no word for "green." Are they **making a mistake** about the world, or just **carving it differently**?*
  *   **MAKING A MISTAKE** → **Leaf 2**
  *   **CARVING DIFFERENTLY** → **Q3b**

  **Q3b: The Fact Question**
  *If they are carving it differently, is there still a **fact of the matter** about what color the emerald really is?*
  *   **YES** → **Leaf 3**
  *   **NO** → **Leaf 4**

  **Q4: The Mechanism Question**
  *Does "green" win because it tracks **causal powers** in the object, or because it produces a **simpler mathematical rule**?*
  *   **CAUSAL POWERS** → **Q5**
  *   **SIMPLER RULE** → **Q6**

  **Q5: The Access Question**
  *To be justified, must we **understand** the causal link, or is it enough that our method **reliably tracks** it?*
  *   **UNDERSTAND** → **Leaf 5**
  *   **RELIABLY TRACK** → **Leaf 6**

  **Q6: The Curve Question**
  *Is this problem **identical** to picking the smoothest curve through data points, or does the **meaning of the words** restrict which curves count?*
  *   **IDENTICAL TO CURVE** → **Leaf 7**
  *   **MEANING RESTRICTS** → **Q7**

  **Q7: The Constraint Question**
  *Does a rule fail only when it conflicts with **established physics** (e.g., electron charge), or whenever it uses **arbitrary indices** (e.g., Mars landings, spatial lines)?*
  *   **CONFLICTS WITH PHYSICS** → **Leaf 8**
  *   **ARBITRARY INDICES** → **Leaf 9**

  ---

  ### THE LEAVES

  **Leaf 1: Deflationary View**
  *   **Position:** The riddle adds nothing to Hume's original problem; induction is never logically guaranteed.
  *   **Awkward Commitment:** You cannot rationally justify preferring "green" over "grue" even in ordinary life.
  *   **Test Cases:** Handles **Case 7** (Hume) directly; treats **Case 1** (Standard Grue) as unsolvable by logic alone.

  **Leaf 2: Entrenchment-Style View**
  *   **Position:** Projectibility is fixed by our actual linguistic habits and history of usage.
  *   **Awkward Commitment:** If we had always used "grue," it would be true that emeralds are grue, not green.
  *   **Test Cases:** Solves **Case 6** (Grue Speakers) by saying they are wrong relative to *our* habits, not the world.

  **Leaf 3: Linguistic/Conceptual Relativism**
  *   **Position:** The riddle is a puzzle about language rather than about the world; different schemes are equally valid.
  *   **Awkward Commitment:** There is no objective sense in which the emerald is "really" green independent of a conceptual scheme.
  *   **Test Cases:** Solves **Case 6** (Grue Speakers) by granting them equal status; renders **Case 5** (Physics) language-relative.

  **Leaf 4: Radical Skepticism [UNOCCUPIED]**
  *   **Position:** Nobody lives here.
  *   **Status:** **Incoherent.** If there is no fact of the matter about color, science cannot function, yet you admitted the world has structure in Q2.
  *   **Test Cases:** Rejects all cases as meaningless.

  **Leaf 5: Natural Kinds View**
  *   **Position:** Grue-family predicates fail because they aren't natural kinds or aren't causally relevant.
  *   **Awkward Commitment:** We must have some prior insight into "nature's joints" to do science at all.
  *   **Test Cases:** Solves **Case 5** (Electrons) and **Case 4** (Mars) by appealing to underlying causal essences.

  **Leaf 6: Reliabilist/Externalist View**
  *   **Position:** The right predicates are whichever ones our methods in fact track, regardless of our understanding.
  *   **Awkward Commitment:** You can be justified in a prediction even if you have no idea *why* it works.
  *   **Test Cases:** Handles **Case 2** (Past Switch) by focusing on whether the method *actually* continues to work, not the logic.
  *   **Note:** **Hard to separate from Leaf 5** in practice; both rely on world-structure, differing only on internal access.

  **Leaf 7: Simplicity Prior View**
  *   **Position:** It comes down to a simplicity prior over hypotheses; "green" is just a less complex function than "grue."
  *   **Awkward Commitment:** Nature is obligated to be simple, which is a metaphysical assumption, not a logical truth.
  *   **Test Cases:** Directly addresses **Case 8** (Curve Fitting).
  *   **TA Note on Curve vs. Emerald:** **Verdict differs.** In curve fitting, complexity is mathematically defined (e.g., polynomial degree). In the emerald case, "grue" can be made mathematically simple if time is a variable; this leaf assumes time *shouldn't* count as a variable, which requires extra justification not present in pure curve fitting.

  **Leaf 8: Scientific Realist View**
  *   **Position:** We trust induction because it aligns with our best confirmed physical theories.
  *   **Awkward Commitment:** We cannot evaluate new predicates in domains where physics is silent (e.g., new exotic particles).
  *   **Test Cases:** Solves **Case 5** (Electrons) easily; struggles with **Case 1** (Standard Grue) if physics is silent on color mechanisms.

  **Leaf 9: Structuralist/Modal View**
  *   **Position:** Predicates using arbitrary spatial/temporal indices are invalid regardless of physical theory.
  *   **Awkward Commitment:** There is a modal fact about "arbitrariness" that is distinct from both logic and physics.
  *   **Test Cases:** Solves **Case 1** (Standard), **Case 2** (Past), **Case 3** (Spatial), and **Case 4** (Mars) uniformly.

  ---

  ### TA NOTES FOR DISCUSSION

  1.  **Indistinguishable Pair:** **Leaf 5 (Natural Kinds)** and **Leaf 6 (Reliabilist)** are often functionally identical in seminar debate. The distinction turns entirely on whether the agent needs *access* to the causal story, which is hard to test with emeralds.
  2.  **Curve Fitting Discrepancy:** As noted in **Leaf 7**, the tree treats the Curve Case (**Case 8**) differently than the Emerald Case (**Case 1**). In curve fitting, "grue" is just a discontinuous function. In epistemology, "grue" is often treated as linguistically gerrymandered. If your students argue the math is the same, push them toward **Leaf 7**; if they argue the *meaning* of "time" matters, push them toward **Leaf 9**.
  3.  **Unoccupied Leaf:** **Leaf 4** is logically possible (deny facts about color) but philosophically barren for a science seminar. Use it to show why we must accept *some* realism (Q2) or *some* skepticism (Q1).
