answer: |-
  Morning everyone. Thanks for coming.

  Looking around the room, it's a proper split. Half of you spend your days wrestling with reasons for action, the other half building the actual programmes that shape choices. Usually, those two groups talk past each other. The hope today is that we don't.

  I want to start us off with a familiar ghost. Buridan's ass. You know the one. Starving between two identical bales of hay. Rationality demands no preference, preference demands action, so the beast does nothing and dies. It's the classic parable of paralysis.

  But I'd like to tweak the experiment live, right now.

  We tend to treat the ass's stillness as a failure of mechanism. A bug. It *can't* decide. But what if the stillness isn't a failure? What if maintaining that perfect equidistance is actually hard work? To stay exactly in the centre, the ass has to constantly adjust against the wind, the ground, the pull of gravity. It's actively holding itself in place.

  This is what I'm calling the 'stalled equilibrium'. The ass isn't dying because it lacks a preference. It's dying because it has a hidden preference for the status quo of not-choosing. The inertia *is* the choice.

  Now, this matters for how we build things. For the engineers in the room, the instinct is usually to treat indifference as an error state. You see a user hovering between two options, unable to click, and the solution is a tie-breaker. A nudge. A randomiser to clear the queue. But if indifference is actually a stable preference for waiting, your tie-breaker isn't fixing a bug. It's overriding the user. You're forcing a choice on someone who prefers the equilibrium. You're solving for efficiency when they're optimising for stability.

  And for the philosophers, I'm not asking you to sign off on that systems view. I'm asking you to look at the agency in the inertia. If staying put is a form of action, then rationality isn't just about maximising outcomes. It's about sustaining positions. When we model decision architecture, are we accounting for the effort required to *not* move?

  The risk today is that we try to solve the ass. The engineers will want to code a way out, and the philosophers will want to define the logic of the starvation. I'd suggest we resist that. Let's sit with the discomfort of the stall. If we treat indifference as a feature rather than a glitch, the whole architecture of choice looks different.

  So, let's not starve the beast just to prove we can feed it. Let's figure out why it's standing still.

  Right, coffee's outside. Let's begin.
