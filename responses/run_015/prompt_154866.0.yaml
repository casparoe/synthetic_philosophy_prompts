      *   **Specific Task 4 (Assessment):** Does this confirm legal moralism, undermine it, or reveal a false dichotomy? Be explicit about theoretical silence.

  2.  **Initial Knowledge Retrieval & Structuring:**
      *   *Wolfenden Report (1957):* Recommended decriminalizing private homosexual acts between consenting adults (21+). Distinguished between "sin" and "crime."
      *   *Sexual Offences Act (1967):* Implemented Wolfenden but with delays and specific restrictions (21+, privacy rules, exclusion of Scotland/NI initially).
      *   *Devlin:* "The Enforcement of Morals." Society needs a shared morality to exist. Disintegration thesis. The "man on the Clapham omnibus" test for intolerance/indignation.
      *   *Hart:* "Law, Liberty, and Morality." Critique of Devlin. Harm Principle (Mill). Morality is not static. Disgust $\neq$ Harm.
      *   *Structure:*
          1.  Introduction: Set the stage (Wolfenden as the crucible).
          2.  Devlin & The Social Fabric: Mapping the resistance and the privacy compromise.
          3.  Hart & The Harm Principle: Mapping the 1967 Act's limitations (age, privacy).
          4.  The Unanticipated Feature: Symbolic partiality (the "don't ask, don't tell" aspect).
          5.  Conclusion: Assessment of the dichotomy.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Need to frame Wolfenden not just as law reform but as the empirical testing ground for the jurisprudential battle. Establish the tension.

      *   **Section 1: Devlin and the Social Fabric:**
          *   *Theory:* Society = moral community. No shared morality = disintegration (like treason). Law is the binder.
          *   *Application:* Parliamentary resistance (1957-1967 gap) wasn't just prudery; it was fear of unraveling the post-war social order.
          *   *Wolfenden's Framing:* They used the "private sphere" argument.
          *   *Devlin's Counter:* Does privacy save the fabric? Devlin would say *no*. If the law says "this is okay in the dark," it changes the *public* valuation of the act. The "social fabric" is the *shared judgment*, not just public behavior. The compromise *relocates* the risk from public order to moral consensus. It weakens the bond.

      *   **Section 2: Hart and the Harm Principle:**
          *   *Theory:* Law should prevent harm, not enforce morals. Consent negates harm (mostly).
          *   *Application:* The 1967 Act looks like Hart won. Private, consenting adults = legal.
          *   *The Catch:* Age of consent (21 vs 16). Public/Private strictures (no "more than two present," etc.).
          *   *Analysis:* If harm is the metric, why 21? A 19-year-old gay man causes no more "harm" than a 19-year-old straight man. This reveals a "moral residue." Hart assumes a clean line between harm and morality. The Act shows the line is blurred. The state is still managing *status*, not just harm. It's a "toleration" model, not an "equality" model. Hart might call this irrational, but politically it was necessary. Does this gap undermine Hart? It shows his theory is normative, not descriptive of political compromise.

      *   **Section 3: The Unanticipated Feature (Symbolic Partiality):**
          *   *What is it?* The "closet" codified into law. The reform wasn't about rights; it was about *containment*.
          *   *Neither Theory:* Devlin thinks law enforces morality. Hart thinks law prevents harm. Neither fully grasps law as *symbolic management of anxiety*.
          *   *Explanation:* The 1967 Act didn't say "homosexuality is good" (Devlin) nor "homosexuality is harmless" (Hart). It said "homosexuality is a regrettable necessity to be hidden." This is *expressive law* that serves a stabilizing function without committing to a moral truth. It's a "peace treaty" rather than a philosophical victory.
          *   *Limit:* Both theories assume law seeks truth (moral or empirical). This law sought *quietude*.

      *   **Section 4: Assessment (The Dichotomy):**
          *   *Verdict:* False dichotomy.
          *   *Why:* The legislation used moral language to achieve a harm-reduction outcome, and used harm language (privacy) to manage moral anxiety.
          *   *Silence:* Hart is silent on the political cost of principle. Devlin is silent on the resilience of a society that *does* change its morality without collapsing.
          *   *Conclusion:* The episode shows law as a muddled instrument of social negotiation, not a clean application of jurisprudence.

  4.  **Refining and Polishing:**
