answer: |-
  To say "It is, though I know not" sounds wrong,
  As if the tongue denies the mind's design;
  Nor does a plea of belief make it strong,
  When challenges demand a clearer line.
  For true belief is not enough to view,
  The debt we owe when speaking what we say;
  We must have knowledge of the thing as true,
  Or else our warrant loses all its way.

  Yet grant she knows by light you cannot see,
  A classified report she cannot ground;
  Though you hold solid proof it cannot be,
  Is speech permissible if truth is bound?
  The rule permits the breach when secrets bind,
  But correctness is what we fail to find.
