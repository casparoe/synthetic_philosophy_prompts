answer: |-
  **METAPHYSICS SEMINAR: FINAL EXAMINATION**
  **Time Allowed:** 1 Hour
  **Word Limit:** 800–1,000 words

  **Question 1**

  In class, we examined a graded series of counterfactual variations on biological origin: (i) Ordinary Swap (different sperm); (ii) Replacement (qualitatively identical sperm); (iii) Delay (fusion +40 minutes); (iv) Cytoplast (donor cytoplasm); (v) Split (zygotic twinning); and (vi) Clone (somatic nuclear transfer).

  Write an essay that does the following:

  1.  Apply the standard Kripkean modal argument (relying on the necessity of distinctness and transitivity) to cases (i), (ii), (iii), and (vi). Determine precisely where the argument ceases to generate a verdict of distinctness.
  2.  Isolate the substantive premise regarding cross-world identity required to make the argument work up to that point. Argue whether this premise is independent of the conclusion or merely the thesis of essentiality restated.
  3.  Justify your chosen "line" in the series. Explain what makes that resolution metaphysically robust rather than an arbitrary stopping point.
  4.  Address case (v). If the zygote splits into two viable infants, what does your view say about which infant inherits the original identity? If the answer is "neither," explain how this impacts the necessity of origin thesis you defended in part 2.

  *Note: Assume familiarity with the descriptions of cases (i)–(vi). Do not waste word count re-describing them. Focus on the metaphysical machinery.*

  ***

  **MODEL ANSWER**

  The standard Kripkean argument for the Essentiality of Origin (EOO) relies on a reductio: if an organism $O$ could originate from gametes $G$ and also from distinct gametes $G^*$, then there is a possible world where both $G$ and $G^*$ exist and produce organisms $O_1$ and $O_2$. By the Necessity of Distinctness, $O_1 \neq O_2$. If $O$ could be identical to either, transitivity of identity fails, or we must accept that $O$ is not uniquely determined by its origin. To avoid this, EOO proponents argue $O$ is essentially tied to $G$.

  Applying this to the graded series, the argument holds firm on case (i), Ordinary Swap. If a different sperm fertilizes the egg, the resulting genome is distinct. The modal argument suggests that a person originating from that distinct genetic code would be a distinct individual. The argument also clearly distinguishes case (vi), Clone. A somatic cell copy lacks the specific historical causal chain of fertilization; the Kripkean intuition is strong here that a clone is a distinct individual, not a delayed version of the original.

  The friction begins at case (ii), Replacement. If the sperm is qualitatively identical—same genome, same mutations—the genetic distinctness premise vanishes. However, the *numerical* distinctness of the gamete remains. If EOO relies on the specific material particular, (ii) yields a distinct person. If EOO relies on qualitative properties, (ii) yields the same person. The argument becomes even more precarious at case (iii), Delay. If fusion occurs forty minutes later, the spatiotemporal coordinates of the origin event change. If "origin" is defined as a specific spatiotemporal slice, (iii) yields a distinct person. This seems absurd. It implies that minor temporal fluctuations in biological processes result in different people. Therefore, the modal argument stops working effectively between (i) and (iii). To save EOO from absurdity in (iii), we must coarse-grain the concept of origin. We must say that "origin" refers to a functional event or a range of spatiotemporal paths, not a precise coordinate.

  This reveals the substantive premise required to make the argument work: The **Sufficiency of Origin for Distinctness (SOD)**. SOD states: If $x$ originates from $O$ and $y$ originates from $O^*$, and $O$ is sufficiently distinct from $O^*$, then $x \neq y$. The critical problem is that SOD is not independent of the EOO thesis; it is the thesis in different clothes. To claim that a different sperm *makes* a different person is to assume that the sperm is essential to the person's identity. The modal argument purports to prove EOO, but it only succeeds if we already accept SOD. If we reject SOD—allowing that distinct origins could yield the same individual—the transitivity problem dissolves because we deny the premise that $O_1$ and $O_2$ must be distinct in the counterfactual world. Thus, the argument is circular. It assumes a principle of individuation to prove a principle of individuation.

  My chosen line falls between (i) and (iii). A different sperm (i) constitutes a different origin because it entails a different causal history and typically a different genome. A forty-minute delay (iii) does not constitute a different origin because "origin" must be understood functionally, not metrically. This resolution is robust because it aligns with biological individuation. Organisms are defined by their developmental trajectory, not the precise microsecond of fusion. To draw the line at (iii) preserves the intuition that you are not a different person because of minor temporal variances, while maintaining that you are a different person than your sibling (case i).

  However, case (v), Split, threatens this entire framework. In twinning, one zygote ($O$) splits into two infants ($A$ and $B$). If origin is essential, both $A$ and $B$ originate from $O$. If origin is sufficient for identity (as SOD suggests), then $A$ must be identical to $B$. But $A \neq B$. We are forced to say that $O$ could become $A$ and $O$ could become $B$, but $A$ and $B$ are distinct. This implies that originating from $O$ does not determine *which* person you are.

  If the answer is "neither"—that the original zygote ceases to exist and two new persons begin—then EOO is false for persons, as persons do not trace back to the zygote essentially. If the answer is that one twin is the original and the other is new, we face an inexplicable brute fact. The most coherent response is to admit that origin is necessary but not sufficient for identity. However, admitting this undermines the Kripkean argument used in part 1. The Kripkean argument relies on the idea that distinct origins guarantee distinct individuals to avoid transitivity violations. But if Split shows that the *same* origin can yield distinct individuals, then distinct origins do not necessarily guarantee distinct individuals (since the mapping is one-to-many, not one-to-one). Consequently, the threat of transitivity failure is less severe than Kripke suggests. We can allow that $O$ could come from $G$ or $G^*$ without collapsing identity, provided we accept that origin fixes a "branch" of possibilities rather than a unique individual.

  In conclusion, the Kripkean argument fails to establish EOO without begging the question via the Sufficiency of Origin premise. While we should draw the line at genetic/historical difference (i) rather than temporal variance (iii), the possibility of twinning (v) demonstrates that origin does not uniquely determine identity. This weakens the modal argument's force, suggesting that while origin is a constraint on identity, it is not the rigid essentialist anchor Kripke proposed.

  ***

  **MARKING SCHEME (Total: 20 Points)**

  **1. Application of Modal Argument (4 points)**
  *   **Must Hit:** Correctly reconstructs the transitivity/necessity of distinctness argument and applies it to cases (i) and (vi) to show distinctness, and (iii) to show the tension.
  *   **Typical Error:** Merely stating "Kripke says origin is essential" without running the transitivity mechanics on the specific cases.
  *   **A/B Distinction:** B answers apply the argument mechanically. A answers note that the argument *requires* the origins to be "sufficiently distinct" to trigger the distinctness conclusion.

  **2. Locating the Line (3 points)**
  *   **Must Hit:** Explicitly states where the EOO thesis breaks down in the series (e.g., between Swap and Delay, or Swap and Replacement).
  *   **Typical Error:** Vague hand-waving (e.g., "it depends on how different the origin is") without picking a spot in the provided series.
  *   **A/B Distinction:** B answers pick a spot arbitrarily. A answers justify the spot based on biological or metaphysical granularity (e.g., genetic vs. temporal).

  **3. Isolating the Substantive Premise (4 points)**
  *   **Must Hit:** Identifies the hidden premise, specifically something like the Sufficiency of Origin for Distinctness (SOD) or the Intrinsicness of Origin.
  *   **Typical Error:** Identifying the conclusion (EOO) as the premise, or failing to see that a bridging premise is needed to get from "different origin" to "different person."
  *   **A/B Distinction:** B answers identify the premise. A answers explain *why* that premise is doing the heavy lifting (i.e., without it, the transitivity worry vanishes).

  **4. Critique of Independence/Circularity (4 points)**
  *   **Must Hit:** Argues whether the premise is independent. (Full marks for arguing it is *not* independent/circular).
  *   **Typical Error:** Asserting the premise is obviously true without analyzing its relationship to the conclusion.
  *   **A/B Distinction:** B answers say "it seems circular." A answers explain that the premise *is* the thesis restated as a cross-world identity condition, rendering the modal argument explanatoryly empty.

  **5. Handling the Split Case (v) (5 points)**
  *   **Must Hit:** Addresses the twinning problem. Acknowledges that one origin yields two distinct persons. Explains the consequence for EOO (origin is not sufficient for uniqueness).
  *   **Typical Error:** Ignoring case (v) or claiming one twin is "real" without justification.
  *   **A/B Distinction:** **This is the primary discriminator.** B answers treat Split as an anomaly or ignore its impact on the modal argument. A answers recognize that Split undermines the *uniqueness* assumption required for the Kripkean transitivity argument to work in cases (i)-(iii). If one origin can yield two people, distinct origins don't necessarily guarantee distinct people in the way the argument requires.

  **Total:** 20 Points
  **Grade Boundaries:**
  *   **A (17–20):** Hits all moves, especially the circularity critique and the Split implication.
  *   **B (14–16):** Hits moves 1–4 well but treats Split as a side issue or fails to link it back to the modal argument's validity.
  *   **C (11–13):** Recites the standard Kripke argument, applies it to (i), but fails to engage with the graded nuance or the circularity objection.
