prompt: |-
  Hi. I sit on the review panel for a new interdisciplinary call at our foundation (working title something like "Origins of Mind and Society" — the scope is roughly: how you get cognition, cooperation and culture out of stuff that has none of it). We see about forty proposals a cycle, from physicists, developmental psychologists, anthropologists, ML people, and at least one person per round who has discovered that everything is really a resonance. My job is to attach a one-page "explanatory adequacy" note to each proposal, and I have maybe twenty minutes per proposal, no way to ask proposers for clarifications (it's blind), and a panel chair who is a cell biologist and will visibly loose patience if I say anything that sounds like jargon. Each proposal is around 1.5M over four years, and I have to be able to defend the note if a rejected PI complains.

  What I want is a decision procedure I can run, not an essay. The ideas to operationalize are Dennett's: cranes versus skyhooks, and the complaint about greedy reductionism — the move where you "explain" something by jumping straight to the bottom level and skipping the middle ones. My panel basically agrees with both when I describe them in plain words, and both are useless to me as stated, because nobody writes a proposal that says "and then a skyhook happens."

  So: give me an ordered set of gates, each with (a) the question to ask of the proposal text as written, (b) what counts as a sufficient answer, (c) where I stop with a no, and (d) where I hand the decision to the panel because it's a values call rather than a factual one — risk appetite, whether we're funding techniques or answers, that kind of thing. Verdicts should come from a short fixed list I can put in a dropdown, and the output should include the one objection I'd have to raise if the PI appealed.

  Two bits of vocabulary I've half-invented and been using on my own — keep them if they're worth keeping, tell me plainly if they're confused:

  - "Ghost crane": a proposal that looks like a mechanism because it's written in mechanism language, but whose moving parts are credited with exactly the competence that was supposed to be explained, just at a smaller scale, an earlier time, or a lower level. My rough test is that you can substitute the word for the thing-to-be-explained into the description of the part without anything changing.
  - "Handoff debt": every crane has to be handed off from the level below it — somewhere you have to say how the dumber parts do the work. Declared debt (they say roughly who will pay it and when) I'm happy to fund against. Hidden debt is where I think greedy reductionism actually lives.

  Other tests I've been fiddling with and can't get to behave: a look-ahead test (does the mechanism need the end state specified in advance in order to work at all?), an unplugging test (if the crane is removed, does the capacity degrade gradually or does the whole thing vanish?), and some rule about what the lower-level story predicts that the upper-level story doesn't — if the answer is "nothing", why go down there? Consolidate these, drop them, or replace them as you see fit, but be explicit about which distinctions have to survive for the procedure to still be tracking the real idea and which ones are only conveniences.

  Then run it properly on three proposals (treat these as one-page summaries):

  1. A physicist proposes a new variational principle — call it "coherence maximization" — that governs open systems, and claims it explains both the origin of life and the evolution of cooperation, with a proposed experimental signature in thermodynamic efficiency.
  2. A group proposes to explain a large, well-documented social trend (your pick: the long decline in interpersonal violence, or the fertility transition) with a story about a neuromodulator, plus a design that measures proxies for it in a modern population.
  3. One from my own lab, which is why I'm asking: we want money to model children's word learning as Bayesian inference over a hypothesis space of candidate meanings. I think it's a crane. I suspect your procedure is going to tell me the hypothesis space is a ghost crane and that the actual explanatory work is somewhere we haven't done it. If that's what it says, say so, and say what a version of the project that passes would look like.

  Also show me the procedure declining to give a verdict: e.g. a proposal that just wants to build a large descriptive model of collective behaviour from video data and claims to explain nothing. I don't want to force those into the frame.

  Finally, be honest about where the procedure misfires. I'm most worried about (i) genuinely new phenomena where nobody yet knows what the levels are, (ii) proposals that are right but badly written, and (iii) me using "skyhook" as a fancy way of saying "I definately don't like this guy."
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Review panelist for an interdisciplinary foundation ("Origins of Mind and Society").
      *   **Task:** Create a decision procedure (not an essay) for evaluating proposals based on Dennett's concepts (Cranes vs. Skyhooks, Greedy Reductionism).
      *   **Constraints:** 20 mins/proposal, blind review, panel chair (cell biologist) hates jargon, need to defend against appeals, 1.5M/4 years stakes.
      *   **Inputs:** Two user-defined terms ("Ghost Crane", "Handoff Debt") and three half-baked tests ("Look-ahead", "Unplugging", "Prediction Differential").
      *   **Outputs:**
          1.  A structured decision procedure (Gates with Questions, Sufficiency, Stop Conditions, Handoff Points).
          2.  Fixed verdict list (Dropdown).
          3.  Specific appeal objection text.
          4.  Evaluation of user's vocabulary/tests (Keep/Drop/Modify).
          5.  Application to 3 specific proposals (Physicist, Social/Neuro, User's Lab).
          6.  Application to a "Non-Explanatory" proposal (Descriptive model).
          7.  Honest limitations/failure modes of the procedure.

  2.  **Evaluate User's Vocabulary & Tests:**

      *   *Ghost Crane:* This is a solid operationalization of "question-begging" or "homuncular" explanations. It fits Dennett's critique perfectly. *Verdict: Keep.*
      *   *Handoff Debt:* This captures the "levels of abstraction" problem. It distinguishes between "we know this is hard but have a plan" vs. "we pretend it's easy." *Verdict: Keep.*
      *   *Look-ahead Test:* This is essentially checking for teleology without a mechanism. If the end state drives the process without a feedback loop, it's a skyhook. *Verdict: Keep (refined).*
      *   *Unplugging Test:* This checks for modularity and necessity. If removing the mechanism kills the function instantly rather than degrading it, it might be a label rather than a part. *Verdict: Keep (refined).*
      *   *Prediction Differential:* This is crucial for avoiding "greedy reductionism." If the lower-level story doesn't predict anything *new* compared to the higher-level story, why reduce? *Verdict: Keep (refined).*

      *Refinement:* I need to integrate these into the Gates so they aren't separate checks but part of the flow.

  3.  **Drafting the Decision Procedure (The "Gates"):**

      *   *Goal:* Filter out Skyhooks and Greedy Reductionism while allowing legitimate reduction and high-risk high-reward theory.
      *   *Structure:* Sequential Gates. If you fail one, you stop (unless it's a "Handoff" to the panel).
      *   *Gate 1: The Competence Check (Ghost Crane).* Does the mechanism do the work, or does it just rename the work?
      *   *Gate 2: The Handoff Check (Handoff Debt).* Is there a plausible story for how the lower level supports the upper level?
      *   *Gate 3: The Teleology Check (Look-ahead).* Does the mechanism require the goal to exist beforehand?
      *   *Gate 4: The Value-Add Check (Prediction Differential).* Does going lower give us new predictions?
      *   *Verdicts:* Need a controlled vocabulary.
          *   `FUND_CRANE` (Solid mechanism)
          *   `FUND_DEBT` (Good plan to pay debt)
          *   `REFER_PANEL` (Values/Risk call)
          *   `REJECT_SKYHOOK` (Magic)
          *   `REJECT_GHOST` (Circular)
          *   `REJECT_GREEDY` (Reduction without gain)
          *   `NO_VERDICT` (Not an explanatory proposal)

  4.  **Developing the Application to Proposals:**

      *   *Proposal 1 (Physicist/Coherence):* Sounds like a Skyhook/Greedy Reductionism. "Coherence maximization" often smuggles in the goal.
          *   *Analysis:* Likely fails Ghost Crane (coherence = cooperation?) and Handoff Debt (how does thermodynamics make *specific* social norms?).
          *   *Verdict:* `REJECT_SKYHOOK` or `REJECT_GHOST`.
      *   *Proposal 2 (Social Trend/Neuromodulator):* Classic Greedy Reductionism. Explaining macro-societal shifts via one chemical.
          *   *Analysis:* Fails Prediction Differential (does oxytocin levels predict the *decline* of violence better than economic models?). Fails Handoff Debt (how does molecule scale to century?).
          *   *Verdict:* `REJECT_GREEDY`.
      *   *Proposal 3 (User's Lab/Bayesian Word Learning):* The user suspects it's a Ghost Crane.
          *   *Analysis:* Bayesian inference assumes a hypothesis space. Where does the space come from? If the space contains the answer, it's a Ghost Crane.
          *   *Fix:* Need to model the *construction* of the space, or admit the space is the debt.
          *   *Verdict:* `FUND_DEBT` (if acknowledged) or `REJECT_GHOST` (if hidden).
      *   *Proposal 4 (Descriptive/Video Model):* Explicitly says "explain nothing."
          *   *Analysis:* The procedure is for *explanatory adequacy*. This falls outside scope.
          *   *Verdict:* `NO_VERDICT`.

  5.  **Addressing Limitations (The "Honesty" Section):**

      *   *New Phenomena:* If levels aren't known, "Handoff Debt" is hard to assess.
      *   *Bad Writing:* A good idea written poorly looks like a Ghost Crane.
      *   *Bias:* "Skyhook" can become "I don't understand this."
      *   *Mitigation:* Need a "Charity Clause" in the procedure.

  6.  **Refining the Output Format:**

      *   Needs to be clean, usable, and fit the "one-page note" constraint mentally.
      *   Use bolding for the Gates.
      *   Ensure the "Appeal Objection" is specific and defensible.

  7.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is "Handoff Debt" too metaphorical for the cell biologist chair?
      *   *Fix:* Define it clearly in the procedure preamble as "Mechanism Implementation Plan." Keep the user's term but define it biologically/physically.
      *   *Critique:* The User's Lab proposal is tricky. Bayesian models are standard.
      *   *Fix:* Be precise. The "Ghost" isn't Bayes; it's the *Hypothesis Space*. If the space is pre-loaded with human concepts, it's a Ghost.
      *   *Critique:* Make sure the "No Verdict" option doesn't look like a rejection. It needs to route to a different funding stream (data/descriptive).

  8.  **Final Polish:** Check against all constraints (20 mins, blind, appeal-proof). Ensure the tone is professional but direct. (Proceed to generate output).

  *(Self-Correction on Proposal 1)*: A variational principle isn't *necessarily* a skyhook, but claiming it explains *both* life and cooperation without intermediate mechanisms is the greedy part. I will flag the "universal solvent" aspect.

  *(Self-Correction on Proposal 3)*: The user asked me to be honest. If their proposal assumes the hypothesis space, it *is* a Ghost Crane by Dennett's standards. I need to tell them how to fix it (e.g., learning the priors).

  *(Self-Correction on Procedure)*: Ensure the "Handoff to Panel" is distinct from "Reject". This is for borderline cases where the science is sound but the risk/profile is the issue.

  9.  **Finalizing the Vocabulary Assessment:**
      *   "Ghost Crane": Keep. It's excellent.
      *   "Handoff Debt": Keep. Very useful for distinguishing "future work" from "magic."
      *   "Look-ahead": Merge into Gate 1 (Teleology).
      *   "Unplugging": Merge into Gate 2 (Necessity).
      *   "Prediction Differential": Make Gate 3 (Value of Reduction).

  10. **Drafting the Response.** (Mental outline complete).
answer: |-
  Here is the operationalized decision procedure, followed by the evaluation of your vocabulary, the application to the four cases, and the limitations analysis.

  ### Part 1: The Decision Procedure (The "Cranes" Protocol)

  **Preamble for the Panel Chair:** This protocol checks for *explanatory leverage*. It does not judge scientific merit in isolation, but whether the proposed mechanism actually bridges the gap between "stuff" and "mind/society" without smuggling the answer in early.

  **Verdict Dropdown List:**
  1.  `FUND_CRANE` (Mechanism is robust and implemented)
  2.  `FUND_DEBT` (Mechanism is sound, implementation debt is declared and planned)
  3.  `REFER_PANEL` (Science is sound, but risk/scope is a values call)
  4.  `REJECT_SKYHOOK` (Relies on unexplained competence/magic)
  5.  `REJECT_GHOST` (Circular explanation; renames the problem)
  6.  `REJECT_GREEDY` (Reduction offers no new predictive power)
  7.  `NO_VERDICT` (Proposal is descriptive, not explanatory)

  ---

  #### Gate 1: The Competence Check (Detecting Ghost Cranes)
  *Tests for: Skyhooks, Homunculi, Question-Begging.*

  *   **(a) Question:** If I replace the name of the proposed mechanism with the name of the phenomenon being explained, does the sentence still make sense?
  *   **(b) Sufficient Answer:** No. The mechanism must have properties distinct from the outcome. (e.g., "Natural Selection" is not "Survival of the Fittest" defined circularly; it specifies variation, inheritance, and differential survival).
  *   **(c) Stop with NO:** If the mechanism is credited with the exact competence it is supposed to generate (e.g., "A module that detects cheating" to explain the evolution of cooperation, without explaining how the detector evolved).
      *   *Verdict:* `REJECT_GHOST`
      *   *Appeal Objection:* "The proposal attributes the target competence to the explaining mechanism without accounting for the origin of that competence."
  *   **(d) Handoff to Panel:** If the mechanism is theoretically sound but requires a leap of faith regarding its initial emergence (high risk/high reward).
      *   *Verdict:* `REFER_PANEL`

  #### Gate 2: The Implementation Check (Detecting Handoff Debt)
  *Tests for: Greedy Reductionism, Missing Levels.*

  *   **(a) Question:** Where does the lower-level substrate (neurons, particles, agents) take over the work from the higher-level description? Is there a specific "handoff point" described?
  *   **(b) Sufficient Answer:** A explicit statement of what the lower level does *and* what it cannot do yet, with a timeline or method for resolving the gap. (Declared Debt).
  *   **(c) Stop with NO:** If the proposal assumes the lower level automatically supports the upper level without specifying the interface (Hidden Debt).
      *   *Verdict:* `REJECT_SKYHOOK` (Functionally, this is a skyhook resting on nothing).
      *   *Appeal Objection:* "The proposal asserts that level X supports level Y but provides no mechanism for the interaction or transition between them."
  *   **(d) Handoff to Panel:** If the debt is declared but the cost/timeline to pay it is uncertain (e.g., "We need new physics").
      *   *Verdict:* `REFER_PANEL`

  #### Gate 3: The Value-Add Check (Detecting Greedy Reductionism)
  *Tests for: Unnecessary Reduction, Prediction Differential.*

  *   **(a) Question:** What does this lower-level story predict that the higher-level story *does not*?
  *   **(b) Sufficient Answer:** Specific empirical signatures, failure modes, or constraints that are invisible at the higher level.
  *   **(c) Stop with NO:** If the lower-level story merely recapitulates the higher-level story in more expensive language (e.g., explaining a market crash solely via individual neuron firing rates without emergent variables).
      *   *Verdict:* `REJECT_GREEDY`
      *   *Appeal Objection:* "The proposed reduction does not generate novel predictions or constraints distinct from the higher-level phenomenological model."
  *   **(d) Handoff to Panel:** If the prediction is high-risk but would be paradigm-shifting if found.
      *   *Verdict:* `REFER_PANEL`

  #### Gate 4: The Teleology Check (Look-Ahead Test)
  *Tests for: Pre-existing Goals, End-Driven Processes.*

  *   **(a) Question:** Does the mechanism require the end-state to be specified in advance for the process to initiate?
  *   **(b) Sufficient Answer:** No. The process must be blind or locally driven (e.g., gradient ascent, not "aiming for truth").
  *   **(c) Stop with NO:** If the system "knows" where it is going without a feedback loop that could have existed at the start.
      *   *Verdict:* `REJECT_SKYHOOK`
      *   *Appeal Objection:* "The proposed mechanism relies on global information or end-states that would not be available to the system at the time of operation."

  ---

  ### Part 2: Evaluation of Your Vocabulary & Tests

  Your intuitions are sharp. Here is how they map to the procedure:

  1.  **"Ghost Crane"**: **KEEP.** This is the strongest tool you have. It operationalizes Dennett's "homuncular fallacy." It is the core of **Gate 1**.
  2.  **"Handoff Debt"**: **KEEP.** This is superior to "reductionism" because it allows for *planned* reductionism. It distinguishes between a promise and a magic trick. It is the core of **Gate 2**.
  3.  **"Look-ahead Test"**: **KEEP (Modified).** I incorporated this as **Gate 4**. It is essential for catching teleological smuggling.
  4.  **"Unplugging Test"**: **DROP as a standalone.** It is a subset of Gate 1. If unplugging the crane removes the capacity entirely without degradation, it suggests the crane *was* the capacity (Ghost Crane). Use it as a heuristic during Gate 1, not a separate gate.
  5.  **"Prediction Differential"**: **KEEP.** This is the only defense against "physics envy." It is **Gate 3**.

  **Distinctions that must survive:**
  *   **Declared vs. Hidden Debt:** This is the difference between a risky project and a dishonest one.
  *   **Renaming vs. Explaining:** The core of the Ghost Crane.
  *   **Description vs. Explanation:** Essential for the `NO_VERDICT` case.

  ---

  ### Part 3: Application to Proposals

  #### Proposal 1: The Physicist ("Coherence Maximization")
  *Summary: Variational principle explains life and cooperation. Experimental signature in thermodynamic efficiency.*

  *   **Gate 1 (Competence):** Does "coherence" do the work of "cooperation"?
      *   *Analysis:* Likely yes. If "coherence" is defined as "states that persist," and cooperation is "states that persist," this is circular.
  *   **Gate 2 (Handoff):** How does thermodynamic efficiency generate *norms*?
      *   *Analysis:* Hidden Debt. No story for how physics becomes sociology.
  *   **Gate 3 (Value-Add):** Does this predict specific social structures better than game theory?
      *   *Analysis:* Unlikely. Usually, these principles are too broad to constrain specific outcomes.
  *   **Gate 4 (Teleology):** Does the system maximize coherence toward a specific state?
      *   *Analysis:* Risk of Look-Ahead. Who defines the coherent state?
  *   **Verdict:** `REJECT_SKYHOOK`
  *   **Appeal Objection:** "The proposal posits a universal principle ('coherence') that is functionally equivalent to the outcomes it claims to explain (life, cooperation), without specifying the mechanistic steps that translate thermodynamic efficiency into specific social norms."

  #### Proposal 2: The Social Trend (Neuromodulators & Violence)
  *Summary: Explains long-term decline in violence via a specific neuromodulator. Measures proxies in modern population.*

  *   **Gate 1 (Competence):** Does the neuromodulator "know" how to reduce violence?
      *   *Analysis:* No, but it influences aggression. Passes Gate 1.
  *   **Gate 2 (Handoff):** How does a molecule scale to a centuries-long societal trend?
      *   *Analysis:* **Hidden Debt.** The gap between synaptic firing and institutional violence is massive. No bridge proposed.
  *   **Gate 3 (Value-Add):** Does measuring the chemical predict the *trend* better than economic/historical models?
      *   *Analysis:* No. It correlates, but doesn't predict the *decline* specifically.
  *   **Verdict:** `REJECT_GREEDY`
  *   **Appeal Objection:** "While the lower-level mechanism (neuromodulation) is real, the proposal fails to demonstrate how this reduction yields predictive power regarding macro-historical trends that is not already captured by higher-level sociological models."

  #### Proposal 3: Your Lab (Bayesian Word Learning)
  *Summary: Model children's word learning as Bayesian inference over a hypothesis space of candidate meanings.*

  *   **Gate 1 (Competence):** Where does the hypothesis space come from?
      *   *Analysis:* **Ghost Crane.** If the hypothesis space contains "candidate meanings" that are already human-like concepts, you have smuggled in the mind you are trying to explain. The "Bayesian engine" is just the crane; the "Hypothesis Space" is the skyhook resting on it.
  *   **Gate 2 (Handoff):** Do you declare the origin of the priors as debt?
      *   *Analysis:* If you say "We assume the space," it is Hidden Debt. If you say "We are modeling the learning *of* the space," it is Declared Debt.
  *   **Verdict:** `REJECT_GHOST` (As currently described).
  *   **How to Pass:** To get a `FUND_DEBT` or `FUND_CRANE`, you must explicitly model the **construction of the hypothesis space**.
      *   *Revision:* "We propose to model how the hypothesis space itself is pruned from a larger, unstructured set via social feedback."
      *   *Alternative:* Admit the space is innate (Declared Debt) and focus on the inference mechanism, acknowledging you are not solving the "Origins" part, only the "Development" part.
  *   **Appeal Objection (if rejected):** "The model assumes a structured hypothesis space containing the semantic distinctions it claims to learn, attributing the target competence to the initial conditions rather than the learning mechanism."

  #### Proposal 4: The Descriptive Model (Video Data)
  *Summary: Build a large descriptive model of collective behaviour from video data. Claims to explain nothing.*

  *   **Gate 1:** N/A. No explanation claimed.
  *   **Procedure Action:** The protocol is for *explanatory adequacy*. This proposal opts out of the game.
  *   **Verdict:** `NO_VERDICT`
  *   **Note to Chair:** "This proposal is a data infrastructure/descriptive project. It does not make explanatory claims subject to the Cranes Protocol. It should be evaluated on data utility, not mechanistic adequacy."

  ---

  ### Part 4: Limitations & Failure Modes

  You asked for honesty on where this misfires.

  **1. The "New Phenomena" Problem (Levels are Unknown)**
  *   *Failure:* If the levels *are* the discovery (e.g., discovering quantum effects in cognition), Gate 2 (Handoff) is impossible to satisfy upfront.
  *   *Mitigation:* Use `REFER_PANEL`. This is a risk-appetite call, not a factual one. The procedure identifies the *absence* of a handoff, but the Panel must decide if the absence is fatal or frontier-breaking.

  **2. The "Bad Writer" Problem (Right Idea, Poorly Stated)**
  *   *Failure:* A brilliant proposal might look like a Ghost Crane because they didn't articulate the mechanism's limits clearly.
  *   *Mitigation:* Apply the "Charity Clause." If the mechanism *could* plausibly be distinct but is poorly phrased, flag for `REFER_PANEL` with a note: "Mechanism appears circular as written, but may be salvageable with clarification." Do not `REJECT` on prose alone if the math holds.

  **3. The "Bias" Problem (Skyhook = "I Don't Like This")**
  *   *Failure:* You might label a complex mechanism you don't understand as a Skyhook.
  *   *Mitigation:* The **Appeal Objection** is your constraint. You must be able to point to the *specific sentence* where the competence is smuggled. If you can't quote the text, you cannot vote `REJECT_SKYHOOK`. This forces you to find the evidence, not just the vibe.

  **4. The "Bayesian Trap" (Your Lab)**
  *   *Failure:* Bayesian models are so flexible they can fit anything. They often look like Cranes but act like Skyhooks (because the priors do all the work).
  *   *Mitigation:* Enforce Gate 3 (Value-Add) ruthlessly on computational models. If the Bayesian model fits the data no better than a simple heuristic, it is `REJECT_GREEDY`.

  ### Summary for your One-Page Note
  When you write the note, structure it exactly like the Gates:
  1.  **Competence:** [Pass/Fail] + Quote from text.
  2.  **Handoff:** [Declared/Hidden] + Location of debt.
  3.  **Value-Add:** [Novel Prediction/None].
  4.  **Verdict:** [Dropdown Selection].
  5.  **Appeal Statement:** [Copy/Paste from Protocol].

  This keeps you within 20 minutes, protects you from the biologist chair (no jargon, just logic), and protects you from the PI (the criteria were published in the call).
