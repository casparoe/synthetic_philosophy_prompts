prompt: |-
  You're the senior reasoning auditor at a small arbitration centre that settles disputes between expert advisory panels — climate scientists, epidemiologists, that sort of crowd. They keep turning up saying "we've seen the same reports but we still disagree on the recommendation," and your director wants you to turn Aumann's agreement theorem into a reusable decision procedre your team can run in under an hour, with no heavy maths and with the director signing off at the end. Before you draft the checklist, do some quick brainstorming: which bits of the theorem actually survive this translation (common prior, common knowledge of posteriors) and which have to be dropped or softened because real people aren't perfect Bayesians? Then lay out the procedre in order — the questions to ask, what counts as a sufficient answer to each, where it stops with "they're rational to disagree," where it stops with "there's a hidden framing disagreement," and where it hands the call to a human because the issue is values not probabilities. Apply it to three cases: (i) two flood-risk modellers who share rainfall data but disagree on the safety threshold; (ii) two clinical ethicists arguing over ICU triage weights during a shortage — this should be the one where the procedre gives an answer your askers won't like; and (iii) a messy case where they can't even agree what counts as "the evidence" in the first place. Be honest about where it misfires, especially with small panels and bounded rationality, and say clearly what the procedre just can't do. Write like you're explaining it to a tired colleague, not sitting an exam. Use British spelling (centre, behaviour, etc.). Don't ask for citations or a reading list — nobody here's got time for that, and you can't look things up anyway. Think step by step, and make sure the hard cases are actually handled rather than brushed aside.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Senior Reasoning Auditor at a small arbitration centre.
      *   **Audience:** A tired colleague (informal, practical, direct, British spelling).
      *   **Task:** Create a reusable decision procedure based on Aumann's Agreement Theorem for expert panels (scientists, ethicists, etc.) who disagree despite seeing the same reports.
      *   **Constraints:** Under an hour to run, no heavy maths, Director sign-off needed.
      *   **Key Components:**
          1.  Brainstorming: What survives translation (common prior, common knowledge) vs. what gets dropped/softened (perfect Bayesians).
          2.  The Procedure: Step-by-step checklist (questions, sufficient answers, stop conditions).
          3.  Application: Three specific cases (Flood modellers, Clinical ethicists, Messy evidence case).
          4.  Honesty: Limitations, misfires, bounded rationality, what it *can't* do.
      *   **Tone:** Professional but weary, pragmatic, British English.
      *   **Negative Constraint:** No citations, no reading lists, no "I can't look things up."

  2.  **Deconstruct Aumann's Agreement Theorem (Mental Check):**
      *   *Core Idea:* If two rational agents have the same priors and their posteriors are common knowledge, they cannot agree to disagree.
      *   *Requirements:* Common Priors, Common Knowledge of Posteriors, Rationality (Bayesian updating), Truthful reporting.
      *   *Reality Check:* Experts aren't perfect Bayesians. Priors are rarely identical. "Common knowledge" is hard to establish in a meeting room. Values often masquerade as probabilities.

  3.  **Brainstorming the Translation (The "Audit" Phase):**
      *   *Keep:* The spirit of "why do we differ?" The idea of tracing back to assumptions. The distinction between *information* and *interpretation*.
      *   *Drop/Softens:* "Common Priors" (impossible to verify). Replace with "Shared Baseline Assumptions." "Perfect Rationality." Replace with "Consistent Logic." "Common Knowledge." Replace with "Explicitly Stated and Understood."
      *   *The Pivot:* Aumann proves disagreement implies different information *or* different priors. In policy/expert contexts, "different priors" often means "different values/risk tolerances." The procedure needs to sniff this out.

  4.  **Drafting the Procedure (The "Checklist"):**
      *   Needs to be fast (under an hour).
      *   Needs clear off-ramps (Stop conditions).
      *   *Step 1: Data Sync.* Do they actually have the same numbers?
      *   *Step 2: Model/Method Sync.* Are they using the same logic to get from A to B?
      *   *Step 3: The "Why" Check.* Is the disagreement on the *likelihood* or the *cost*? (Probability vs. Utility).
      *   *Step 4: The Aumann Test.* If you knew *why* they thought that, would they change their mind?
      *   *Outcomes:* Rational Disagreement (Values), Hidden Framing (Method), Handover (Values/Politics).

  5.  **Developing the Three Cases:**
      *   *(i) Flood Modellers:* Same rain data, different safety thresholds. This is likely a Utility/Value problem disguised as science. The procedure should flag this as "Risk Tolerance," not "Math Error."
      *   *(ii) Clinical Ethicists:* ICU triage weights. This is the "unlikeable answer." The procedure will likely conclude this is pure values (QALYs vs. Fairness). The arbitration centre can't solve this; it's political/ethical. The "unlikeable" part is telling them we can't arbitrate ethics.
      *   *(iii) Messy Evidence:* Can't agree on what counts as evidence. This breaks the "Common Knowledge" precondition. The procedure stops early. "Garbage in, garbage out."

  6.  **Addressing Limitations & Bounded Rationality:**
      *   Small panels mean noise matters more.
      *   People lie (strategically or unconsciously).
      *   Time pressure kills deep reflection.
      *   The procedure can't force agreement, only diagnose the *type* of disagreement.

  7.  **Refining Tone and Style:**
      *   British spelling (centre, behaviour, programme, modelling).
      *   Conversational but authoritative ("Look," "Here's the thing," "Director wants...").
      *   No fluff.
      *   Structure: Brainstorm -> Procedure -> Cases -> Limitations.

  8.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Acknowledge the Director's request but ground it in reality. Aumann isn't magic.
      *   *Brainstorm:* Be honest about "Common Priors." Experts have different PhDs, different trauma from past failures. We treat "Priors" as "Working Assumptions."
      *   *Procedure:* Make it a flowchart in text. Step 1, 2, 3... with "Exit Criteria."
      *   *Cases:*
          *   Flood: Clear cut. It's risk appetite.
          *   Ethics: The hard one. It exposes that we are a *reasoning* centre, not a *moral* one.
          *   Messy: Epistemic collapse. Stop immediately.
      *   *Limitations:* Don't oversell. It's a diagnostic tool, not a cure.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I use British spelling? (Yes: centre, behaviour, modelling, programme).
      *   *Check:* Is it under an hour? (The steps need to be simple enough).
      *   *Check:* Did I handle the "unlikeable answer" in case (ii)? (Yes, by admitting the procedure can't resolve value conflicts).
      *   *Check:* Is the tone right? (Needs to sound like a memo to a colleague, not a textbook).
      *   *Check:* Aumann specifics? (Ensure I mention that disagreement implies different info or priors, and we are testing for exactly that).

  10. **Final Polish:** Ensure the distinction between *probability* (what will happen) and *utility* (what we want to avoid) is clear, as that's where Aumann usually breaks in policy contexts. (Aumann assumes common utility functions usually, or focuses on beliefs. In expert panels, beliefs and values get mixed). *Correction:* Aumann is about *beliefs* (posteriors). If beliefs differ, info or priors differ. If *recommendations* differ, it could be beliefs OR values. The procedure must distinguish these. I need to make sure the checklist separates "What do you think will happen?" from "What should we do about it?"

      *(Self-Correction on Case ii)*: The prompt asks for the procedure to give an answer the askers won't like. If ethicists disagree on triage weights, they think it's a reasoning problem. If the procedure says "This is values, go away," they won't like it. Perfect.

      *(Self-Correction on Case iii)*: If they can't agree on evidence, the "Common Knowledge" condition fails. The procedure must halt.

      *(Final Tone Check)*: Make it sound weary. "Look, I know the Director wants magic..."

  11. **Final Output Generation** (incorporating all above).
answer: |-
  **MEMORANDUM**

  **TO:** J. Henderson, Lead Caseworker
  **FROM:** Senior Reasoning Auditor
  **SUBJECT:** The "Aumann-Lite" Protocol (Draft for Director Sign-off)
  **DATE:** 24 May 2024

  Look, I know the Director wants magic. He sees "Aumann's Agreement Theorem" in some white paper and thinks it's a spell we can cast to make two epidemiologists shake hands and sign a joint statement. It isn't. Aumann proves that two honest Bayesians with the same priors can't agree to disagree. But our experts aren't honest Bayesians. They're tired, they have reputations to protect, and their "priors" are built on ten years of conflicting fieldwork.

  However, the *logic* of the theorem is useful. It forces us to ask: is this disagreement about the world (facts/probabilities) or about the map (values/thresholds)?

  Below is the brainstorming on what survives the translation, the actual procedure we'll run, and how it handles the three messes currently sitting on your desk.

  ***

  ### 1. Brainstorming: What Survives Translation?

  We cannot run the maths. We cannot verify if their priors are truly identical (they aren't). We cannot ensure "common knowledge" in the strict game-theoretic sense (people nod when they don't understand). Here is how we soften it for the real world:

  *   **Common Priors → Shared Baseline Assumptions.** We drop the idea that they start with identical brains. We check if they agree on the *rules of the game*. If one assumes climate sensitivity is linear and the other assumes tipping points, they don't have common priors. We flag this as a "Model Mismatch," not a reasoning error.
  *   **Common Knowledge of Posteriors → Explicit Reasoning Chains.** Aumann requires they know *why* the other believes what they believe. In practice, this means forcing them to write down the steps from Data → Conclusion. If they can't explain the other person's logic back to them, common knowledge is missing.
  *   **Rationality → Consistency.** We don't test for perfect Bayesian updating. We test for internal consistency. If they say X implies Y, but recommend Z, they're inconsistent.
  *   **The Hard Truth:** Aumann applies to *beliefs* (probabilities), not *decisions* (utilities). Two people can agree there's a 90% chance of flood but disagree on whether to evacuate (one values life, the other values economic stability). The procedure must sniff out when a "probability dispute" is actually a "value dispute" in disguise.

  ***

  ### 2. The Procedure: "The Consensus Diagnostic"

  **Time limit:** 60 minutes.
  **Facilitator:** One auditor (you).
  **Participants:** The two disagreeing experts.

  **Step 1: The Data Sync (10 mins)**
  *   **Question:** "Put the raw data on the screen. Do you both accept these numbers as accurate?"
  *   **Sufficient Answer:** Both sign off on the dataset.
  *   **Stop Condition:** If one rejects the data source (e.g., "That gauge was faulty"), **HALT**. This is not a reasoning dispute; it's an evidence dispute. Refer to Evidence Admissibility Panel.
  *   **Outcome:** If they agree, proceed.

  **Step 2: The Logic Trace (20 mins)**
  *   **Question:** "Expert A, walk us through your calculation. Expert B, repeat it back in your own words until Expert A says 'Yes, that is what I meant'."
  *   **Sufficient Answer:** Mutual confirmation of the reasoning chain.
  *   **Stop Condition:** If Expert B says, "That logic is flawed," ask: "Is it mathematically flawed or assumption-flawed?"
      *   If *Mathematically*: Correct the error. Agreement reached.
      *   If *Assumption*: (e.g., "You shouldn't weight historical data that heavily"). This is a Prior/Model mismatch. Proceed to Step 3.

  **Step 3: The Probability vs. Utility Split (20 mins)**
  *   **Question:** "If we forced you to adopt the other person's model/assumptions, would your *probability estimate* change to match theirs?"
  *   **Sufficient Answer:**
      *   "Yes": Then the disagreement was purely methodological. Align models.
      *   "No": Then there is a hidden variable.
  *   **The Kicker Question:** "Do you disagree on how *likely* the bad outcome is, or on how *bad* the outcome is?"
  *   **Stop Condition:**
      *   If they disagree on **Likelihood**: They are failing the Aumann test. There is hidden information or irrationality. **Escalate to Senior Auditor (Me).**
      *   If they disagree on **Badness** (Thresholds/Costs): This is a Value Disagreement. **HALT.** The Arbitration Centre cannot arbitrate values. Return to Commissioning Body for policy direction.

  **Step 4: Sign-off (10 mins)**
  *   Draft the finding. Either "Consensus Reached," "Methodological Alignment Required," or "Value Conflict Identified."

  ***

  ### 3. Application to Current Cases

  Here is how this plays out on the three files you're worried about.

  **(i) The Flood-Risk Modellers**
  *   **Context:** Both accept the rainfall data. One says "Evacuate at 50mm/hr," the other says "Evacuate at 80mm/hr."
  *   **Running the Procedure:**
      *   Step 1 (Data): Pass. They trust the rain gauges.
      *   Step 2 (Logic): Pass. Both use the same hydrological model.
      *   Step 3 (Split): Here is the catch. When asked, "If you use the other's threshold, does the probability of flooding change?" they say "No."
      *   **Diagnosis:** They agree on the probability of the flood. They disagree on the *tolerance for risk*. One prioritises false positives (costly evacuation); the other prioritises false negatives (loss of life).
      *   **Outcome:** **Value Conflict.** We tell them they are rationally allowed to disagree because their utility functions differ. We send it back to the Local Council to pick the risk appetite.
      *   **Verdict:** Clean exit. Not a reasoning failure.

  **(ii) The Clinical Ethicists (ICU Triage)**
  *   **Context:** Shortage of ventilators. Ethicist A weights "Life Years Saved" (younger patients). Ethicist B weights "Fair Chance" (lottery system). Both claim their approach is "objectively correct."
  *   **Running the Procedure:**
      *   Step 1 (Data): Pass. They agree on patient counts and survival rates.
      *   Step 2 (Logic): Pass. They understand each other's frameworks.
      *   Step 3 (Split): We ask, "Is this a dispute about survival probabilities?" They say "No." We ask, "Is this about what constitutes a 'good' outcome?" They say "Yes."
      *   **The Unlikeable Answer:** The procedure concludes that **there is no reasoning error to audit.** They are arguing philosophy, not probability. Aumann doesn't apply because they don't share a common utility function (the value of a life).
      *   **Outcome:** We issue a "Non-Justiciable" finding. We tell the Hospital Board that no amount of auditing will solve this; it requires a political/ethical mandate.
      *   **Why they won't like it:** They came to us to validate that *their* reasoning is the superior one. We are telling them that reasoning can't settle values. They'll call us useless. Good. It stops us from overstepping.

  **(iii) The Messy Evidence Case (Contaminated Site)**
  *   **Context:** Two environmental scientists. One says soil samples are valid; the other says the chain of custody was broken so the samples are void.
  *   **Running the Procedure:**
      *   Step 1 (Data): **FAIL.**
      *   **Diagnosis:** They do not have "Common Knowledge" of the evidence. One sees data; the other sees noise.
      *   **Outcome:** Immediate Halt. We cannot run an agreement theorem on parties who don't agree on reality.
      *   **Action:** Refer to the Evidence Admissibility Panel. Do not let the auditors try to solve this. It's a procedural legal fight, not a reasoning audit.

  ***

  ### 4. Limitations & Honest Misfires

  I need you to be clear with the Director about where this breaks. I don't want us promising what we can't deliver.

  1.  **Bounded Rationality:** Aumann assumes infinite processing power. Our experts are human. Sometimes they disagree because they're tired or missed a slide in the deck. The procedure might flag this as a "Logic Trace" error, but fixing it requires time they don't have. We might identify the problem but lack the bandwidth to fix it.
  2.  **Strategic Ambiguity:** Experts sometimes keep their reasoning vague to protect their intellectual property or reputation. If they won't expose their full "logic chain" in Step 2, the procedure fails. We can't force transparency, only note its absence.
  3.  **Small Panel Noise:** With only two experts, personality clashes look like reasoning errors. If Expert A hates Expert B, they will reject Expert B's priors instinctively. The procedure might diagnose "Model Mismatch" when it's actually "Interpersonal Conflict." We aren't therapists.
  4.  **The "Values in Clothing" Problem:** Experts often dress up values as probabilities to sound more objective. (e.g., "It's *unlikely* to be safe" vs "I *don't like* the risk"). Step 3 tries to catch this, but a clever expert can hide a value judgement inside a probability estimate. We might misclassify a value dispute as a reasoning error.

  **What this procedure CANNOT do:**
  *   It cannot force agreement.
  *   It cannot determine which value system is "correct."
  *   It cannot adjudicate on the quality of raw evidence (only whether it is shared).

  **Recommendation:**
  Sign off on the protocol as a **Diagnostic Tool**, not a **Resolution Mechanism**. It tells us *why* they disagree, not *who is right*. If the Director wants "Resolution," he needs to hire a mediator, not an auditor.

  Let me know if you want to tweak the wording on the Ethicists case before I put it on his desk. I expect pushback there.

  Cheers,
  **S. Auditor**
