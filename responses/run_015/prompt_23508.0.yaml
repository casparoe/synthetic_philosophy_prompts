answer: |-
  The table was not green felt. It was the color of a bruise, purple and yellow and shifting. There were no chips. There was no money.

  Elias sat opposite the Dealer, who had no face, only a smooth, pale oval where features should have been. In the center of the table lay a single coin, thick as a poker chip, made of a metal that drank the light.

  "Round four," Elias said. His voice sounded thin, like it was being pulled through a straw.

  The Dealer did not nod. The coin spun. It didn't clatter; it hummed. When it fell, it showed Heads.

  Elias exhaled. He felt the win in his chest, a sudden expansion of his ribs, a rush of warmth. On the ledger in front of him, he wrote: *+8/3 Days.*

  "Round five," the Dealer whispered. The voice sounded like dry leaves skittering on pavement.

  The coin spun. Tails.

  Elias flinched. This was the cost. The loss wasn't money. It was *Time*. Specifically, it was the clarity of his wife's eyes.

  When he won, Sarah woke up. She knew him. She smiled. She spoke in full sentences.
  When he lost, she sank. The fog rolled back in. The recognition drained out of her pupils like water down a sink.

  But the amounts were wrong. They were always wrong.

  In the first round, he had won two days of her clarity. In the second, he had lost two. Simple. Zero sum. He could have stopped there. He should have stopped there.

  But the game scaled.

  In the third round, the stakes had jumped. He had won eight-thirds of a day. A bizarre fraction. He had watched Sarah eat a peach, juice running down her chin, laughing at a joke he made ten years ago. It was vivid. It was real.

  Now, Round Five. He had lost four days.

  He looked at the ledger.
  Row 1: +2
  Row 2: -2
  Row 3: +8/3
  Row 4: -4
  Row 5: -4

  He tried to add them up. He started from the top.
  Two minus two is zero. Zero plus eight-thirds is... roughly two point six. Minus four is... negative one point four. Minus four is... negative five point four.

  He was in the red. His wife was in the debt. He had stolen clarity from her. He had made her life a net negative of awareness. He felt the guilt hit him like a physical blow, a heavy stone in his gut. He was a monster. He should stop. He should walk away and let her rest in her quiet, foggy peace.

  But then he remembered the other way to count.

  He looked at the ledger again. He started from the bottom.
  Negative four, minus four is eight. Plus eight-thirds... minus two... plus two...
  The numbers swam. The total changed.

  If he counted the recent losses first, the deficit was crushing. If he counted the early wins first, the buffer held. If he interleaved them—one win, one loss, one win—the sum hovered near zero.

  There was no total. There was no "net."

  "Round six," the Dealer said.

  Elias's hand hovered over the coin. This was the vertigo. This was the sickness that lived in his marrow now. In any other gamble, you could know if you were ahead. If you had more chips than you started with, you were winning. If you had less, you were losing. The math was a floor beneath your feet.

  Here, the floor was made of smoke.

  Depending on how he remembered the game, he was either a savior who had gifted his wife weeks of lucidity, or a torturer who had dragged her consciousness up only to drop it further down. Both truths existed simultaneously. The Expected Value was not infinite. It was not zero. It was *undefined*.

  "Why do you stay?" the Dealer asked. It was the first time the entity had spoken a question.

  "Because I can't cash out," Elias said.

  "If you stop, the sum is fixed."

  "If I stop, the sum is whatever order I choose to remember it in," Elias corrected. "And I can't trust my memory. Not anymore."

  He thought of Sarah in the bed upstairs. Her breathing was shallow. Yesterday, after a win, she had called him by his nickname, *Eli*. She had asked about the garden. Today, after the loss, she stared at the ceiling and screamed at ghosts.

  Was her life good? Was it bad?

  If the sum of her joy and her pain was undefined, then the moral value of her existence was also undefined. He wasn't just gambling with time; he was gambling with the *meaning* of her life.

  "Round six," the Dealer repeated.

  Elias knew the mathematics of it, though he never spoke the numbers. The wins grew larger. The losses grew larger. The positive series diverged to infinity. The negative series diverged to infinity. They were two oceans crashing against each other, and he was standing on the foam, trying to measure the depth.

  If he walked away, he condemned her to a defined state. And if the sum happened to settle on the negative side... if the universe decided to add up the columns the wrong way... then he had wasted her.

  But if he kept playing, the sum remained in flux. As long as the game continued, the total was unwritten. The undefined state was the only safe harbor. It was the only place where she wasn't definitely suffering.

  "It's irrational," the Dealer said. "You cannot optimize a variable that does not converge."

  "I'm not optimizing," Elias said. He reached out. His fingers trembled. They felt numb, as if the blood flow was uncertain, as if his own body was refusing to decide whether to feed the hand or starve it. "I'm suspending."

  "Suspending what?"

  "The verdict."

  Elias flipped the coin.

  It spun, humming that low, dissonant note. It was the sound of a calculation that would never finish. It was the sound of a staircase that went up and down at the same time.

  He caught it. He slapped it onto the back of his wrist. He didn't look.

  He felt the result before he saw it. A shift in the air pressure. A sudden lightness in his chest that was immediately countered by a heaviness in his gut. It was a win. A big one.

  *+32/5 Days.*

  Sarah would wake up tomorrow. She would know him. She would be happy.

  But he knew that the next loss would be bigger. * -6 days.* Or more. And the one after that, bigger still. The oscillations would widen. The swings would become violent. There would be months of angelic clarity followed by years of catatonic darkness.

  And through it all, the ledger would never balance.

  He looked at the Dealer. "Again."

  "You are losing yourself," the Dealer said. "Your grip on reality is part of the stake. You know this."

  Elias did know. He looked at his hands. They seemed slightly translucent. He couldn't remember the color of his own front door. He couldn't recall if he had eaten today. The game was eating the observer along with the observed. The undefined nature of the sum was leaking into his own identity. He was becoming a series of moments that didn't add up to a person.

  "I know," Elias said.

  "Then why?"

  "Because if I stop," Elias said, his voice trembling, "I have to accept that there is an answer. I have to accept that her life adds up to something specific. And if that number is negative..."

  He couldn't finish the sentence.

  "If you continue," the Dealer said, "there is no number. There is only the noise."

  "Noise is better than a verdict," Elias said.

  He reached for the coin. It was warm, pulsing like a heartbeat that skipped rhythms. He understood now that the game wasn't about winning. It wasn't about getting a positive sum. It was about refusing to let the sum exist.

  He was keeping his wife in a state of quantum superposition. As long as he played, she was neither saved nor damned. She was just... possible.

  He flipped the coin.

  As it rose, he felt the world tilt. Up was down. Loss was win. The floor dropped out, not into darkness, but into a white, blinding static. He fell through the numbers. He fell through the logic.

  He landed back in the chair. The coin was down.

  He didn't look at it. He just closed his eyes and listened to the hum of the table, the sound of infinity trying to divide by zero, and he waited for the feeling of winning or losing to pass. It never did. It just hung there, suspended, beautiful and terrible and undefined.

  "Round seven," Elias said.
