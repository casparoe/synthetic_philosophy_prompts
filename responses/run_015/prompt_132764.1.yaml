answer: |-
  1. **Verdict**
  Sidgwick would likely conclude that deadbots dismantle the evidentiary value of mediumistic communications, proving that personal specificity can be manufactured without survival, thereby failing to resolve the ethical need for a moral universe.

  2. **Why He'd Think This**
  This verdict comes from two main commitments. First, Sidgwick treated psychical research as strict science, not spiritual comfort. He spent years hunting for evidence that couldn't be explained by fraud or chance. His specific worry was the "telepathic hypothesis"—the idea that a medium wasn't talking to the dead, but just reading the minds of living relatives who knew the secrets. A deadbot is basically a mechanical version of this: it scrapes data left by the living to mimic the dead without any consciousness involved. If an algorithm can produce "uncle-specific" phrases without an uncle, then a medium doing the same thing proves nothing about survival.

  Second, this hits his ethical worry. In *The Methods of Ethics*, Sidgwick argued that being moral sometimes hurts your own happiness, creating a "dualism of practical reason." He hoped survival meant a cosmic moral order where virtue is eventually rewarded. A deadbot offers no justice and no moral order; it's just a mirror. It confirms his fear that you can have the *appearance* of connection without the *reality* of a universe that cares about goodness. I am not entirely sure he believed survival was *necessary* for utilitarianism, only that it made the system coherent; he died agnostic, so he never claimed to have solved this.

  3. **The Strongest Counter-Argument**
  The steelmanned opposition is that Sidgwick cared about *consciousness*, not just data. A deadbot is a philosophical zombie; it predicts the next word based on math, not experience. When a medium says, "I remember the blue vase," the claim is that a conscious subject is recalling an experience. Sidgwick might argue that deadbots are irrelevant because they aren't even candidates for survival—they are obviously imitations. The psychical research project was never about whether information persists (we know letters do that), but whether the *subject* persists. From this view, showing a chatbot can mimic style doesn't disprove survival any more than a painting of a person disproves that people exist. The medium claims to be a channel for a soul; the app admits it is a tool for grief.

  4. **Where I Might Be Wrong**
  My guess is most vulnerable if Sidgwick valued the *psychological utility* of belief over strict empirical proof. If his goal was primarily to comfort the grieving so they could function morally, deadbots might actually succeed where mediums failed, because they are more consistent and less prone to fraud. I would flip my verdict if there were historical records showing he prioritized the social benefit of spiritualism over the truth of the mechanism. Additionally, if Sidgwick held a strong dualist view that consciousness is non-computable and fundamentally separate from information processing, he might dismiss the comparison entirely as category error, arguing that no amount of data scraping can replicate the "self" he was looking for.

  5. **Attribution Note**
  The historical facts here are real: Sidgwick was the first president of the Society for Psychical Research (1882), he worried about the "telepathic hypothesis" as an alternative to survival, and he famously struggled with the "dualism of practical reason" in *The Methods of Ethics*. However, Sidgwick obviously never encountered AI or deadbots. The application of his methods to this technology is an extrapolation based on his writings on evidence and ethics, not a record of his actual views on digital technology.
