answer: |-
  You have identified one of the most persistent and consequential issues in the philosophy of biology. You are not imagining it; this slippage is a well-documented phenomenon that has generated decades of debate.

  While there is no single, catchy pop-philosophy label (like "Godwin's Law"), there are several precise terms used in philosophy of biology, philosophy of language, and rhetoric to describe this pattern.

  Here is a breakdown of the established names, the philosophical mechanics behind them, and how this pattern compares to the fallacies you mentioned.

  ### 1. The Established Terms

  **A. The "Ambiguity of Biological Information"**
  In the philosophy of biology, this is the standard technical description. Philosophers like **Peter Godfrey-Smith**, **Sahotra Sarkar**, and **Kim Sterelny** distinguish between:
  *   **Causal Information (Shannon):** DNA reduces uncertainty about the phenotype. It is a physical correlate. (The "Motte").
  *   **Semantic Information:** DNA has *meaning*, *truth conditions*, or *instructions* that can be *misinterpreted*. (The "Bailey").

  When critics point out the slide, they often refer to it as **"conflating causal and semantic information."**

  **B. Reification of Metaphor (or "Literalization")**
  The science historian and philosopher **Evelyn Fox Keller**, particularly in her book *The Language of Life*, argues that geneticists treat metaphors (code, blueprint, program) as **"dead metaphors that come alive when convenient."**
  *   **The Pattern:** The metaphor is treated as "just a metaphor" when challenged on metaphysics (e.g., "Who reads the code?"), but treated as literal reality when making ontological claims (e.g., "The organism is specified in the gene").
  *   **The Term:** This is often called **"Ontological Reification"** of a heuristic.

  **C. The "Instructional Metaphor" Fallacy**
  **Susan Oyama**, in her foundational work *The Ontogeny of Information* and Developmental Systems Theory (DST), argues that this slide creates an **"Informational Fallacy."** She contends that by calling genes "informational" and the environment "contextual," scientists unjustifiably privilege genes as the *cause* of development, even though both are causally necessary. The slide allows them to claim the environment is just a "background condition" because it doesn't "carry the information."

  ### 2. Is it Equivocation? Is it Motte-and-Bailey?

  You hesitated to use these terms, but philosophically, **this is a textbook example of both**, specifically a *structural* Motte-and-Bailey and a *theoretical* Equivocation.

  **Why it *is* a Motte-and-Bailey:**
  You noted it's "not quite motte-and-bailey because the person isn't always aware." However, the Motte-and-Bailey fallacy (coined by Nicholas Shackel) describes the **structure of the argument**, not the **intent of the arguer**.
  *   **The Bailey (Desirable but hard to defend):** "Genes specify the organism," "Mutations are misinformation." (Requires semantic information).
  *   **The Motte (Defensible but boring):** "DNA sequences correlate with protein structures." (Requires only causal/Shannon information).
  *   **The Move:** When challenged on the Bailey ("Who reads the DNA?"), the speaker retreats to the Motte ("I just mean physical causation!"). When making positive claims, they occupy the Bailey ("The gene determines the trait!").
  *   **Verdict:** It fits perfectly. The lack of conscious awareness just makes it an *unconscious* Motte-and-Bailey, which is arguably more common than the strategic version.

  **Why it *is* Equivocation:**
  You noted it's "not exactly equivocation... because the two meanings are related." In logic, this is known as **Systematic Equivocation** or **Theoretical Equivocation**.
  *   Standard equivocation uses two unrelated definitions (e.g., "Bank" of a river vs. "Bank" for money).
  *   Theoretical equivocation uses two *theoretically distinct* definitions of the same technical term (Shannon vs. Semantic Information) within a single argument to bridge a logical gap.
  *   **Verdict:** It is equivocation, but of a sophisticated, domain-specific variety.

  ### 3. A Proposed Name: "Semantic Smuggling"

  If you are looking for a term to describe the *rhetorical move* itself (the act of sliding), the most accurate descriptive label is **"Semantic Smuggling"** (sometimes called **"Teleological Smuggling"**).

  *   **What it is:** Smuggling normative or intentional properties (meaning, purpose, error) into a descriptive system (physics, chemistry, genetics) by exploiting an ambiguous term ("information").
  *   **Why it fits:** It captures the "work" you noticed. The speaker wants the *prestige* of the semantic view (genes have authority/meaning) without paying the *metaphysical cost* (admitting to a Reader/Designer).
  *   **Distinction:**
      *   *Equivocation* is the error in the logic.
      *   *Motte-and-Bailey* is the defensive structure of the debate.
      *   *Semantic Smuggling* is the active mechanism of the slide.

  ### 4. How it Differs from Dead Metaphor

  You asked how to distinguish this from a metaphor that just gets taken literally over time.
  *   **Dead Metaphor:** The imagery disappears. When we say the "leg of a table," no one thinks of a biological leg. The metaphorical weight is gone.
  *   **This Pattern (Live-Reified Metaphor):** The imagery is *selectively active*.
      *   When it helps to imply design/order: The metaphor is **Live** ("The DNA *instructs* the cell").
      *   When it helps to avoid accusations of mysticism: The metaphor is **Dead** ("It's just a chemical code").
  *   **The Test:** If you ask, "Can a mutation be a *lie*?" they will say "No, that's just a metaphor." But if you ask, "Does the gene contain the *plan*?" they say "Yes." The metaphor is undead; it rises from the grave when needed.

  ### 5. Does this happen outside Biology?

  Yes, this pattern is rampant in other fields that deal with complex systems described via information processing.

  **A. Cognitive Science / AI (The "Computational Theory of Mind")**
  *   **The Slide:** "The brain processes information like a computer."
  *   **The Retreat:** When challenged ("Who reads the neural spikes?"), they say, "It's just a metaphor for causal state changes."
  *   **The Advance:** When explaining consciousness, they say, "The mind is software," implying the software has meaning independent of the hardware.
  *   **The Critique:** John Searle's **Chinese Room Argument** is essentially an attack on this specific slide (syntax vs. semantics).

  **B. Economics (Rational Choice Theory)**
  *   **The Slide:** "Agents maximize utility."
  *   **The Retreat:** When challenged ("People aren't actually calculating math"), they say, "It's an 'as-if' model, just predictive statistics."
  *   **The Advance:** When arguing for policy, they say, "Incentives change behavior," implying agents actually read and respond to the incentives intentionally.

  **C. Evolutionary Psychology**
  *   **The Slide:** "We have a module for X."
  *   **The Retreat:** "It's just a statistical tendency selected for."
  *   **The Advance:** "This behavior is hardwired/specified," implying a level of determinism that the statistical view doesn't support.

  ### Summary

  You have correctly identified a **Systematic Equivocation** between **Shannon (Causal)** and **Semantic (Intentional)** definitions of information.

  In the philosophy of biology, this is most famously critiqued by **Susan Oyama** (Developmental Systems Theory) and **Evelyn Fox Keller**.

  If you need a label for your own writing or discussion, the most precise options are:
  1.  **The Causal-Semantic Slide** (Descriptive)
  2.  **Informational Reification** (Ontological)
  3.  **Semantic Smuggling** (Rhetorical)

  It is structurally a **Motte-and-Bailey**, even if unconscious, because it relies on retreating to a defensible causal claim to protect an indefensible semantic claim. It is distinct from a dead metaphor because the metaphorical agency is **reactivated** whenever the argument requires the concept of "purpose" or "error."

  This pattern is the engine of **Genetic Determinism**. It allows proponents to claim the "hard science" authority of chemistry (the Motte) while making the "strong claim" of predestination (the Bailey).
