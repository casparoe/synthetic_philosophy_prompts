answer: |-
  ### Brainstorm Pass: Candidate Correspondences

  Here are twelve potential mappings between the Google Doc analogy and social ontology concepts. I've marked which are load-bearing for your TA's reductionist conclusion and which are decorative or problematic.

  1.  **The Document Itself** ↔ **The Shared Plan/Goal.**
      *   *Status:* **Load-bearing.** This is the objectification of the "we-intention."
      *   *Risk:* Is the plan mental or abstract? The doc is concrete/external.
  2.  **Local Copy on Laptop** ↔ **Individual Intention.**
      *   *Status:* **Load-bearing.** Core reductionist move: the "we" is just distributed "I"s.
  3.  **Syncing/Internet Connection** ↔ **Common Knowledge/Mutual Responsiveness.**
      *   *Status:* **Load-bearing.** Explains coordination without a group mind.
  4.  **Edit History** ↔ **Persistence of Intention over Time.**
      *   *Status:* **Decoration.** History tracks changes, but intentions persist via commitment, not logging.
  5.  **Comment Thread** ↔ **Negotiation of Subplans.**
      *   *Status:* **Weak.** Often side-channel. Better mapped to communication generally.
  6.  **Permissions (Editor/Viewer)** ↔ **Division of Labor/Roles.**
      *   *Status:* **Load-bearing.** Explains structure without extra ontology.
      *   *Risk:* Permissions are technical constraints; roles are normative commitments.
  7.  **Merge Conflicts** ↔ **Miscoordination/Disagreement.**
      *   *Status:* **Load-bearing.** Shows conflicts are resolvable between individuals.
  8.  **Doc Exists After Logout** ↔ **Group Persistence (when members drop out).**
      *   *Status:* **Load-bearing.** Addresses the "ontological freeloading" worry.
      *   *Risk:* Physical persistence vs. normative survival.
  9.  **The Server** ↔ **Common Ground?**
      *   *Status:* **Dangerous.** If the server holds the "truth," is it a group mind surrogate?
  10. **Autosave** ↔ **Stability of Commitment.**
      *   *Status:* **Decoration.** Technical feature vs. normative feature.
  11. **Delete Key** ↔ **Abandonment of Intention.**
      *   *Status:* **Weak.** Too trivial.
  12. **"Last Save Wins"** ↔ **Authority/Decision Procedure.**
      *   *Status:* **Quiet Import.** Docs adjudicate automatically; groups require negotiation.

  **Drop:** 4, 5, 9, 11. (They add flavor but don't support the metaphysical claim).
  **Keep & Scrutinize:** 1, 2, 3, 6, 7, 8.
  **Critical Watch:** 10 & 12 (The Server/Adjudication). This is where the TA might be smuggling in a structural equivalent of a plural subject without naming it.

  ***

  ### Audit of the "Shared Google Doc" Analogy

  Your TA has offered you a sophisticated version of **Bratmanian reductionism**. The Google Doc analogy is compelling because it demystifies coordination: it shows how complex, persistent, structured collective behavior can arise from individual states linked by communication (sync). It effectively argues that you don't need a "spooky group mind" to explain the *mechanics* of joint action.

  However, as an argument against **Gilbert-style plural subject theory** (or any view claiming irreducible normativity), the analogy is doing too much heavy lifting. It conflates *causal coordination* with *normative binding*. Below is the audit you requested.

  #### 1. Correspondence Table

  | Google Doc Feature | Social Ontology Counterpart | Status of Mapping |
  | :--- | :--- | :--- |
  | **The Document (Content)** | **The Shared Plan / Joint Goal** | **Forced.** The doc is public/external; the plan is typically mental/abstract. The doc *represents* the plan, but isn't the intention itself. |
  | **Local Copy (on Laptop)** | **Individual Intention ("I intend...")** | **Solid.** This is the reductionist core. Each agent has their own mental state. |
  | **Sync Protocol / Internet** | **Common Knowledge / Mutual Responsiveness** | **Solid.** Explains how individual states align without a group mind. |
  | **Permissions (Editor/Viewer)** | **Division of Labor / Roles** | **Forced.** Permissions are *technical constraints* (you literally can't edit). Roles in joint action are *normative* (you *ought* to do your part, but physically can stop). |
  | **Merge Conflicts** | **Miscoordination / Disagreement** | **Solid.** Shows conflicts occur between individuals, not within a "group mind." |
  | **Doc Persists After Logout** | **Group Persistence / Plan Survival** | **Forced.** The doc persists *physically*. A joint action persists *normatively*. If everyone logs off, the doc is inert. If everyone stops acting, the joint action dissolves. |
  | **The Server** | **Common Ground / The "We"** | **Dangerous.** If the server holds the "master version," is this an externalized group mind? The TA must insist it's just a causal channel, not an agent. |
  | **Edit History** | **Commitment Over Time** | **Weak.** History records changes; commitment *binds* future action. A log doesn't obligate. |
  | **"Last Save Wins"** | **Authority / Decision Procedure** | **Quiet Import.** Docs resolve conflicts algorithmically. Groups resolve them via negotiation/authority norms. |

  #### 2. The Disanalogies That Actually Matter

  Your TA wants to use the Doc to prove that "we intend" is just a shorthand for "I intend + you intend + we know it." To push back, you must focus on **normativity** and **agency**, not coordination mechanics.

  *   **The Normativity Gap (The "Ought" vs. The "Is"):**
      *   *The Analogy:* If I close my laptop on a Google Doc, nothing normative happens. I haven't violated anything. The doc remains on the server.
      *   *The Reality:* In joint action (Gilbert's point), if I stop painting without notice, I have violated an obligation *to you*. I am liable to rebuke. The Google Doc has no mechanism for rebuke, only for version control. The TA claims commitment is a "feature of the sync protocol," but protocols describe *how* data moves, not *why* I owe it to you to keep syncing.
      *   *Why it matters:* This cuts against the reductionist claim that obligation is just a feeling or a prediction. The Doc analogy explains coordination, but it cannot explain the *right* you have to demand I continue.

  *   **The Content of Intention (The "We" vs. The "I"):**
      *   *The Analogy:* My local copy contains "My part + Your part."
      *   *The Reality:* In plural subject theory, the content of my intention is not "I do X and you do Y." It is "We do J." The TA's analogy suggests I intend *that the doc gets painted*. But if I only intend *my contribution* conditional on yours, that's Bratman. If I intend *our action* as a single unit, that's Gilbert.
      *   *Why it matters:* The Doc analogy hides this. In a Doc, there is no single unit of action, only merged edits. In painting a house together, our movements are often temporally integrated in a way that isn't just "synced."

  *   **Agency and Rebuke:**
      *   *The Analogy:* The Doc cannot be the subject of "we." It doesn't act.
      *   *The Reality:* We say "We painted the house." The TA says this is shorthand. But if I free-ride, you don't say "The doc wasn't updated." You say "You let *us* down." The Doc analogy cannot account for the *subject* of the action being the pair, not the individuals.

  #### 3. Quiet Imports (Smuggled Features)

  The analogy works because it smuggles in features of documents that joint action lacks, and vice versa.

  *   **From Doc to Action (The "Server" Problem):**
      *   The TA says the doc lives on a server. This gives the plan an identity conditions independent of the participants. But in joint action, if *everyone* forgets the plan, the joint action ceases. The Doc analogy imports an **externalized memory** that makes the plan look more robust than it is. It makes the "shared intention" look like an object (the file) rather than a relation (the commitment).
      *   *The Trap:* If the TA relies on the server to explain persistence, they are arguably positing an externalized group mind (the server holds the truth). If they deny the server matters, they lose the explanation for persistence when one person drops out.

  *   **From Action to Doc (The "Normative Glue"):**
      *   The TA says commitment is a "feature of the sync protocol." This imports **normativity into a mechanical system**. A sync protocol doesn't create obligations; it creates causal links. By calling it "commitment," the TA is borrowing the normative force of joint action to explain the doc, then using the doc to explain away the normativity of joint action. It's circular.

  #### 4. The Verdict

  **Does the no-irreducible-we claim survive?**
  It survives as a claim about **metaphysical ontology** (there is no extra "thing" called a group mind), but it fails as a claim about **explanatory adequacy** (you cannot explain the *normative* features of joint action using only individual intentions).

  *   **The Weak Reductionist Victory:** The TA is right that you don't need a *spooky substance* (a Hegelian World Spirit) to explain how we coordinate. The Google Doc proves that complex collective outcomes arise from individual states + communication.
  *   **The Anti-Reductionist Counter-Victory:** The TA is wrong that this eliminates the need for a "plural subject" if by that we mean an **irreducible normative relation**. The Doc analogy explains the *causes* of our painting, but not the *obligations*.

  **Verdict:** The analogy carries the conclusion only if you define "intention" purely causally/functionalistically. If you define it normatively (as involving entitlements and obligations), the analogy breaks. The TA is arguing for **Bratman** (interlocking individual intentions) but pretending it refutes **Gilbert** (plural subjects). It doesn't; it just assumes Gilbert's normative features are reducible to Bratman's predictive features, which is the very point in dispute.

  #### 5. Better Analogies

  If you want to push back, the Google Doc is too static and individualistic. Try these:

  *   **The Improv Scene (or Jazz Duo):**
      *   *Why:* There is no script (no Doc). The "plan" exists only in the ongoing interaction. If one stops, the scene dies immediately (no server persistence). The "we" is the unit of performance; you cannot isolate my notes from your notes without destroying the music. This captures the **interdependence** better than the Doc.
  *   **The Marriage Vow:**
      *   *Why:* This captures the **normativity**. When two people marry, a new status exists that isn't just "I promise + you promise." It creates mutual entitlements. If one leaves, the other is wronged, not just causally disconnected. This hits the **obligation** point harder than the Doc.

  #### 6. Addressing Your Specific Cases

  *   **Painting Together vs. Neighbors:**
      *   *TA's Doc:* Two neighbors have two different Docs with no sync. Painters together have one Doc with sync.
      *   *Your Pushback:* In the neighbor case, if I stop, you don't care. In the joint case, if I stop, you are *entitled* to complain. The Doc shows the *difference in coordination*, but not the *difference in obligation*. The Doc analogy makes the joint painters look like just "more synced" neighbors. You need to argue the *kind* of intention is different, not just the connectivity.
  *   **Stopping Because You Stopped:**
      *   *TA's Doc:* My laptop syncs your "close doc" event, so I close mine.
      *   *Your Pushback:* In joint action, I stop because *our* action has ceased, not just because I observed your cessation. The content of my reasoning is "We are no longer painting," not "You are no longer painting." The Doc reduces my reason to observation of you; the plural subject view makes my reason observation of *us*.
  *   **Free-Riding:**
      *   *TA's Doc:* I edit less than you. The history shows it.
      *   *Your Pushback:* In a Doc, free-riding is just uneven contribution. In joint action, free-riding is a **violation of entitlement**. You have the right to rebuke me. The Doc has no "rebuke" function. This is your strongest point: the Doc captures the *distribution of labor*, but not the *normative expectation* of labor.

  #### 7. Your Weakest Point (Where the TA Will Attack)

  **The "Ontological Freeloading" Charge.**
  The TA will ask: "If the 'We' is irreducible, where is it? Is it floating in the air? Is it a third mind?"
  *   **The Trap:** If you say "It's a special entity," you look mystical.
  *   **The Defense:** You must clarify that "irreducible" does not mean "additional substance." It means **irreducible relation**.
      *   *Argument:* "Water is H2O. You can't find 'wetness' in Hydrogen or Oxygen. Wetness is a property of the combination. Similarly, 'obligation' isn't in my head or yours. It's a property of the *relation* between us. The Google Doc analogy tries to reduce the wetness to the atoms. It explains the atoms, but misses the wetness."
      *   **Warning:** The TA will say "Wetness is just molecular interaction." You must insist that **normativity** (oughts) is not reducible to **causality** (isms). The Doc explains how we *do* move together; it doesn't explain why we *ought* to.

  ### Summary for Your Paper

  1.  **Concede the Mechanics:** Admit the TA is right that you don't need a group mind to explain *coordination*. The Google Doc successfully models Bratmanian shared cooperative activity.
  2.  **Deny the Normativity:** Argue that the Doc fails to model the *obligations* inherent in joint action (Gilbert's point). The "sync protocol" is causal, not normative.
  3.  **Highlight the Content:** Insist that "I intend that we J" is distinct from "I intend that I do my part because you do yours." The Doc analogy collapses this distinction.
  4.  **Use the Free-Rider Case:** Show that the Doc records free-riding, but joint action *condemns* it. The difference is normative, not informational.
  5.  **Final Move:** Argue that the TA's analogy presupposes the normative structure it claims to explain. (We treat the Doc as shared only because we already have a normative agreement to treat it that way).

  This approach allows you to respect the TA's technical insight while defending the philosophical necessity of the "we-mode."
