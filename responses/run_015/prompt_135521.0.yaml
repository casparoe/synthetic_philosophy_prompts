  4.  **Developing the Failure Modes:**
      *   *Risk 1:* Someone names the forbidden option immediately. *Mitigation:* Stewards must be quick. If it happens, Facilitator rules it "out of order" procedurally (backstopping the Stewards).
      *   *Risk 2:* Group suspects foul play. *Mitigation:* Keep Steward intervention subtle.
