      *   *Revised Plan:* Provide a menu of 3 options on the handout. Wait, if it's on the handout, it's voiceable.
      *   *Better Plan:* Provide a menu of *criteria* to generate options. Or, provide 2 options and ask them to brainstorm a 3rd. The 3rd one they brainstorm will be steered away from the forbidden one.
