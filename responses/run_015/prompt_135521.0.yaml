      *   *Frankfurt Parallel:* The "Stewards" are the "Counterfactual Intervener." They didn't act because the group didn't stray, but they *would* have.
      *   *Limitation:* In a real Frankfurt case, the agent *physically* cannot do otherwise. Here, they *socially* cannot. The facilitator must explain this gap.

  6.  **Writing the Document:**
