      *   *Identifiability:* Can an auditor tell why you changed?
      *   *Computational Tractability:* Can you actually calculate the optimal policy over time? (Often impossible).
      *   *Value of Commitment:* Sometimes binding yourself is good (Ulysses). Sometimes it's bad (missing opportunities).
      *   *Path Independence:* Should the end state depend on the order of decisions? (Usually yes for rationality, but maybe not for learning).

