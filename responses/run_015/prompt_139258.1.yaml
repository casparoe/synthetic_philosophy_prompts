prompt: |-
  Hey — please take the role of a Hegel specialist who genuinely has the lordship-and-bondage section of the Phenomenology of Spirit cold, not someone paraphrasing a study guide. Think it through properly: before you commit to an answer, brainstorm every rule that could generate the pattern of verdicts below, then narrow down.

  Here's the setup. A woman in my Hegel reading group has been going case by case through ordinary relationships asking, "is this genuine mutual recognition in Hegel's sense, or not?" Her verdicts so far:

  - Two aristocrats who fight a duel to the death over an insult: yes, the real thing, that's what the life-and-death struggle is for.
  - A Roman master and his chattel slave: no — textbook lord and bondsman, the master's self-certainty is hollow because it's conferred by someone he treats as a thing.
  - A medieval lord and serf where custom binds both sides (serf owes labour, lord owes protection and can't just expel him): yes, genuine recognition, even though grossly unequal.
  - A novelist who writes for no one and wants no readers: no.
  - An at-will employee and her employer: not in the employment relation itself — only derivatively, because both are rights-bearing citizens in the same legal order.
  - A parent and a newborn: yes, but one-sided and developmental; the parent does all the recognising and the child grows into it.
  - A woman and her dog: no, though the woman may well feel recognised.

  Next week's case is this: Mariam is 78 and has mid-to-late-stage Alzheimer's. She usually doesn't recognise her husband Peter anymore — she sometimes calls him by her brother's name — but a few times a month she's lucid for five or ten minutes and clearly knows who he is. Peter has cared for her for six years, talks to her as a person the whole time, and says he still feels seen by her on the good days. She's also floated, half-seriously, that recognition might be a property of a relationship over time rather than of a moment, and I can't tell what that does to any of this.

  What's she going to say about Peter and Mariam's marriage? I mostly want the candidate rules that fit her seven verdicts equally well, what each one predicts here, your best guess at which she's actually running and why, and the one further case you'd put to her to settle it. Don't worry about citing anything.
