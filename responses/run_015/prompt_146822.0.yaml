answer: |-
  The maxim "words divide, pictures unite" is frequently invoked in summaries of Otto Neurath's work, particularly regarding the ISOTYPE (International System of TYpographic Picture Education) institute. However, treating this phrase as a rigorous philosophical premise requires caution. It is less a direct quotation from Neurath's technical writings on physicalism and more a pithy summation of his pedagogical and sociological hopes for visual statistics, often attributed to him by later interpreters or within the promotional material of the Vienna Circle's broader outreach.

  To assess whether this maxim supports the argument that Neurath should have abandoned linguistic protocol sentences in favour of a pictorial language, we must disentangle the specific claims embedded within it. Below is a menu of distinct theses that the maxim might express, evaluated against Neurath's physicalist framework and the current scholarly consensus on logical empiricism.

  ### A Menu of Theses Regarding "Words Divide, Pictures Unite"

  #### 1. The Thesis of Semantic Determinacy
  *   **Claim:** Verbal language is inherently ambiguous and polysemous, whereas visual notation possesses a fixed, one-to-one correspondence with reality, thereby eliminating semantic slippage.
  *   **Evaluation:** **False (within Neurath's framework).**
      *   **Reasoning:** Neurath was acutely aware that pictures are not self-interpreting. ISOTYPE charts required legends, keys, and accompanying text to be intelligible. A picture of a worker can signify 'employment', 'labour hours', or 'class identity' depending on the convention adopted. Neurath's physicalism demanded that terms be defined by their method of verification (spatio-temporal co-ordinates), not by their visual immediacy.
      *   **Scholarly Note:** It is well-established that Neurath viewed ISOTYPE as a *transformation* of statistics, not a direct mirroring of facts. The idea that pictures are semantically determinate without convention is rejected by most historians of the Vienna Circle (e.g., Hardcastle, Cartwright).

  #### 2. The Thesis of Cross-Linguistic Portability
  *   **Claim:** Verbal languages are fragmented by national boundaries (Babel), whereas visual notation is universally intelligible regardless of the viewer's native tongue.
  *   **Evaluation:** **Philosophically Substantive and Partially Defensible.**
      *   **Reasoning:** This was a core motivation for ISOTYPE. Neurath sought a "visual language" that could bypass the need for translation in the *Encyclopaedia of Unified Science*. However, Neurath acknowledged that 'universality' is an ideal limit, not an immediate reality; viewers must be trained to read ISOTYPE symbols.
      *   **Scholarly Note:** Consensus holds that Neurath viewed this as a sociological advantage for the *dissemination* of science, rather than a logical advantage for the *construction* of science.

  #### 3. The Thesis of Emotional and Metaphysical Neutrality
  *   **Claim:** Words carry ideological, metaphysical, or emotional baggage (e.g., German idealist terminology), whereas pictures present behavioural facts without metaphysical contamination.
  *   **Evaluation:** **Philosophically Substantive and Defensible.**
      *   **Reasoning:** This aligns closely with Neurath's physicalism. He sought to eliminate "pseudo-statements" of metaphysics. Visual representations of social data (e.g., housing conditions, production outputs) force attention upon spatio-temporal arrangements rather than abstract essences. In this sense, pictures 'unite' by focusing on the physicalist common ground.
      *   **Scholarly Note:** This is a robust reading of Neurath's anti-metaphysical stance. However, scholars like Elisabeth Nemeth caution that Neurath did not view pictures as *free* of ideology; rather, they were tools to be used consciously within a democratic, socialist framework.

  #### 4. The Thesis of Logical Syntax
  *   **Claim:** Pictures possess a logical structure capable of handling negation, conditionality, and quantification equivalent to linguistic syntax.
  *   **Evaluation:** **False.**
      *   **Reasoning:** This is the critical stumbling block for the argument that pictures should replace protocol sentences. Neurath, alongside Carnap, recognised that logic is the syntax of language. It is notoriously difficult to depict "This did *not* happen" or "If X, then Y" purely pictorially without reverting to linguistic conventions. Unified science required a structure capable of deduction and contradiction; Neurath maintained this required a linguistic medium.
      *   **Scholarly Note:** There is near-consensus here. While some contemporary semioticians argue for a "visual logic," within the context of 1930s logical empiricism, the inability of images to handle logical operators was a decisive reason to keep protocols linguistic.

  #### 5. The Thesis of Pedagogical Efficacy
  *   **Claim:** Pictures are more effective than words for teaching complex relationships and fostering a shared understanding among the public (the 'scientific attitude').
  *   **Evaluation:** **Trivially True (within the ISOTYPE context).**
      *   **Reasoning:** This was the operational mandate of the ISOTYPE institute. Neurath believed that for science to be a tool for social emancipation, it had to be comprehensible to the worker, not just the academic.
      *   **Scholarly Note:** This is the least controversial aspect of Neurath's legacy. However, efficacy in *education* does not entail validity in *foundational epistemology*.

  #### 6. The Thesis of Protocol Replacement
  *   **Claim:** Observation reports (protocol sentences) can be formulated directly in a picture language, rendering linguistic protocols obsolete for the foundation of unified science.
  *   **Evaluation:** **False (regarding Neurath's actual position).**
      *   **Reasoning:** Despite his enthusiasm for pictures, Neurath insisted in the Protocol Sentence Debate (1931–1933) that protocols must be linguistic. His argument was that science is a linguistic system; to check a fact is to check a sentence against other sentences within the coherent system. A picture cannot be a 'sentence' in the logical sense required for the "boat" of science to be rebuilt.
      *   **Scholarly Note:** This is a point of frequent confusion. While some modern interpreters (e.g., those focusing on the 'pictorial turn') suggest Neurath *ought* to have gone this way, historical textual evidence confirms he maintained the linguistic requirement for protocols to ensure inter-subjective checkability and logical manipulation.

  ---

  ### Assessment: Displacing Verbal Protocols in Neurath's "Boat"

  You asked specifically which readings would support displacing verbal protocol sentences with picture languages inside Neurath's "boat" of unified science.

  **None of the readings above genuinely support this displacement within Neurath's own framework.**

  To understand why, one must distinguish between the **Encyclopaedia** (the total system of knowledge) and the **Protocols** (the foundational acceptance sentences).
  1.  **The Boat Metaphor:** Neurath's famous metaphor describes scientists rebuilding their ship (science) while at sea. They must use old planks (existing concepts) to replace rotten ones. For Neurath, these planks are *sentences*.
  2.  **The Role of ISOTYPE:** ISOTYPE was intended for the *superstructure* of the Encyclopaedia and for public education, not the *foundation*. It was a method of transforming linguistic statistics into visual forms for synoptic overview.
  3.  **The Physicalist Constraint:** Neurath's physicalism required that all scientific statements be translatable into a language referring to spatio-temporal co-ordinates. While a picture can show a spatio-temporal arrangement, it cannot easily participate in the *logical coherence* testing that Neurath required for truth. A protocol sentence like "Red patch at place x, time y" is a linguistic formulation that can be contradicted, negated, or deduced from. A picture of a red patch cannot logically contradict another picture without linguistic mediation.

  **Contested Interpretations:**
  There is a genuine, albeit niche, debate among scholars regarding the depth of Neurath's commitment to linguistic exclusivity.
  *   **The Consensus View:** (Represented by scholars like Thomas Mormann and George Reisch) Neurath viewed pictures as derivative. The "unity" of science is a unity of *language* (physicalist slang), not of imagery.
  *   **The Revisionist View:** (Suggested by some visual culture historians and occasionally hinted at by Neurath's more enthusiastic passages on 'visual education') One might argue that Neurath's physicalism was ultimately driven by a desire for 'order' which ISOTYPE achieved better than language. Some argue that Neurath's later work implies a 'post-linguistic' ideal where the distinction dissolves. However, presenting this as Neurath's settled view would be historically inaccurate.

  ### Conclusion

  If you encounter the argument that "words divide, pictures unite" implies Neurath should have abandoned linguistic protocols, the argument relies on a category error. It conflates **pedagogical unity** (where the maxim holds substantial truth) with **logical unity** (where the maxim fails).

  *   **Trivially True:** Pictures aid cross-cultural pedagogy (Thesis 5).
  *   **Substantive but Limited:** Pictures reduce metaphysical baggage (Thesis 3).
  *   **False:** Pictures can replace the logical function of protocol sentences (Thesis 6).

  Therefore, within the strictures of Neurath's "boat", the maxim supports the use of ISOTYPE for the *dissemination* and *synoptic organisation* of unified science, but it does not support the displacement of verbal protocol sentences. To argue otherwise is to attribute to Neurath a view on logical syntax he explicitly rejected during the Protocol Sentence Debate.
