  ### Adjudication of the Debate

  **Move 1: Alex**
  **Rating:** **Partially Right**
  **Justification:** Alex correctly identifies the *pragmatic* reality of political speech: in high-stakes deliberation, conditionals often function as insulated assertions (a rhetorical device sometimes called "insinuation" or "paralipsis"). The audience likely *uptakes* the antecedent as an expression of the councilor's stance. However, Alex is semantically imprecise. To claim the speaker *expressed* disapproval in the antecedent conflates conversational implicature (what is suggested) with semantic content (what is literally said). While the *effect* is moral disapproval, the *semantic mechanism* remains conditional.

  **Move 2: Jordan**
  **Rating:** **Clearly Right**
  **Justification:** Jordan correctly defends the fundamental distinction between semantics and pragmatics required for a compositional theory of meaning. In standard logic and semantics, the antecedent of a conditional is not asserted; it is a scope for evaluation. Jordan is also correct that emotional force is a pragmatic feature (illocutionary force) rather than a semantic one. Without this distinction, we cannot explain how one can validly argue *from* normative premises one does not yet fully endorse (e.g., in *reductio* arguments or exploratory deliberation).

  **Move 3: Alex**
  **Rating:** **Mostly Mistaken**
  **Justification:** Alex constructs a straw man regarding moral reasoning. Jordan's claim is that the *logical form* does not entail psychological commitment, not that speakers are forbidden from having commitments. Alex argues that Jordan's view makes deliberation "rigid" or risks hypocrisy, but this misunderstands the nature of a supposition. One can assume a premise for the sake of argument and later reject it without hypocrisy; that is the definition of deliberation. Alex confuses *logical commitment* (entailment) with *social accountability* (reputation).

  **Move 4: Jordan**
  **Rating:** **Clearly Right**
  **Justification:** Jordan successfully isolates the category error in Alex's previous move. The analogy to mathematics is apt regarding logical form: one can assume $P$ to derive $Q$ without believing $P$. While normative discourse carries more psychological weight than mathematics, the structural point holds: semantic content is distinct from the speaker's doxastic state. Jordan correctly identifies that Alex is demanding a psychological constraint where only a logical one exists.

  ### Overall Verdict
  **Jordan is more right overall.**
  While Alex offers a keen observation about the *rhetorical usage* of conditionals in political theater, Jordan maintains the necessary theoretical rigor for a seminar on *semantics*. Alex's argument collapses when he moves from describing audience uptake to making claims about the constraints on moral reasoning (Move 3). Jordan consistently upholds the distinction between the proposition expressed and the speaker's attitude, which is the foundational requirement for solving the Frege-Geach problem in metaethics.

  ### What Both Interlocutors Are Missing
  Both Alex and Jordan treat the councilor's utterance as a **monologic assertion** aimed at revealing the speaker's internal state (Alex) or logical structure (Jordan). They both miss the **dialogical and consensus-building function** of embedded normative language in public deliberation.

  In a zoning hearing, a conditional like "If tearing down the garden is unjust..." is rarely a private hypothesis (Jordan) nor merely a disguised personal assertion (Alex). Instead, it is a **bid for Common Ground**. The councilor is likely invoking a shared norm to test the audience's commitment: *"If we agree on this shared value (antecedent), we are compelled to this conclusion (consequent)."*

  The function of the embedded normative clause here is **interpersonal**: it manages the *commitments and entitlements* of the deliberative body, not just the speaker. By embedding the norm, the speaker invites the audience to endorse the antecedent collectively without the speaker having to solely own the assertion if it proves controversial. Both candidates miss that in public deliberation, semantics serves the management of **collective commitment**, not just the transmission of individual belief or logical form.
