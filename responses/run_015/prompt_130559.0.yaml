      *   It's a strategic shifting of criteria for moral significance.
      *   Step 1 (Inflate): Use *aggregation* (sum of all micro-experiences) to maximize moral stakes (cosmic horror).
      *   Step 2 (Deflect): Use *integration* (complexity/selfhood) to minimize practical obligation (can't fix micro-stuff).
      *   Step 3 (Conclude): Use *aggregation* again to diminish local ethics (why bother if cosmic suffering is huge?).
      *   This isn't quite Motte-and-Bailey because the "bailey" (cosmic horror) is asserted as true, not just defended. It's more like shifting the *metric* of moral relevance depending on whether one wants to emphasize magnitude or agency.
      *   Is there an existing name? "Metric shifting," "Criteria sliding," "Quantifier shift fallacy"? None fit perfectly. It resembles a "Double Standard" but specific to mereology (parts vs. wholes).
      *   Coining a term: "Mereological Metric-Shifting" or "Panpsychist Oscillation." Let's go with something descriptive like "Mereological Motte" (but user said not quite motte) or "Aggregation-Integration Oscillation." Let's try "Mereological Scope-Shifting."
      *   Actually, the core issue is toggling between *ontological prevalence* (everything suffers) and *moral relevance* (only complex minds matter).
      *   Proposed term: "Mereological Metric-Shifting."
      *   Distinction: Unlike scope neglect (ignoring large numbers), this exploits large numbers selectively. Unlike non-identity (future people), this concerns current constituent parts.

