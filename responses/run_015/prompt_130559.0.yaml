          2.  Counter: We can't/shouldn't fix micro-suffering (integration criteria/high-level minds matter).
          3.  Flip: But the cosmic suffering still dwarfs local ethics (back to aggregation).
      *   **Constraints:** Max 100 words, one paragraph.
      *   **Tasks:** Identify if there's an established name (likely not), coin a term if not, define its edges (aggregation vs. integration), and distinguish it from scope neglect/non-identity problem.

