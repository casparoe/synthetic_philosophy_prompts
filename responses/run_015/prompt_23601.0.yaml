      Argument: If *all* institutions did this, the category of "public social media" would fundamentally change (users would flee or lock down), making the research impossible. This is a classic "Tragedy of the Commons" style Contradiction in Conception.
      *Better Argument for University Context:* The University has a duty of care. If the maxim is "The University permits scraping of its students," and this is universalized for all Universities, the concept of "Campus as a trusted environment" is destroyed. The research relies on the students being students; the method undermines the status of the student.

      *Let's go with the Institutional Trust argument.* It's more specific to the Chair role.

      *Opposing View:* The "Approval with Conditions" camp argues the maxim passes the Stronger Test (the internet stays public) but fails the Weaker Test (we don't want to live in a surveillance world). Therefore, we manage the risk (anonymization) rather than ban.
