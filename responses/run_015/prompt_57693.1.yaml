answer: |-
  ### Brainstorming the Through-Line

  You have three viable narratives for this session, but only one survives contact with an economics-trained undergraduate mind.

  1.  **Berkeley as Semiotician:** Focus on the *Querist* as an application of his theory of language (money as a sign without a referent).
      *   *Verdict:* **Discard.** For econ majors, this turns a mechanism into a metaphor. They will file it under "philosophy" and forget it by next week. It obscures the *economic* claim Berkeley is making about employment.
  2.  **Berkeley as Proto-Chartalist:** Focus on the state's power to designate money (Query 28) and the rejection of specie.
      *   *Verdict:* **Discard.** This invites the anachronism you fear. Students will map "ticket or counter" directly onto "fiat currency" and conclude Berkeley is just a primitive Keynesian. It makes him look *right* for the *wrong reasons*, which kills historical inquiry.
  3.  **Berkeley as Theorist of Activation (Flow vs. Stock):** Focus on the link between money and *industry* (Query 1 & 5). Money is not wealth; it is the spur to create wealth.
      *   *Verdict:* **Select.** This forces a collision with their Locke reading (where money *is* wealth/hoard) and their Macro intuition (where money is a neutral veil). It requires them to understand *why* the nature of money matters for the *level of activity*, not just the price level.

  **The Plan:** We build the session on **Activation**. Money is the oil, industry is the engine. Without oil, the engine seizes (Query 5). The chemical composition of the oil matters less than its ability to flow (Query 23). But if you pour too much or change the viscosity arbitrarily, the engine floods or breaks (Query 22 & 28).

  ---

  ### 1. The Dependency Structure

  You are correct that Query 23 ("ticket or counter") lands with a thud if presented first. To a modern student, "money isn't gold" is banal. The dependency chain must be reconstructed to make Query 23 feel radical again.

  **The Chain:**
  1.  **Wealth = Industry (Query 1).** *Must come first.* If wealth is specie (Locke/Mercantilists), then Query 23 is a disaster. If wealth is the *capacity to labor*, Query 23 becomes a tool.
  2.  **Money = The Spur (Query 5).** Money's only value is its ability to trigger Query 1.
  3.  **Money = Ticket (Query 23).** *Now* this bites. If money is just a spur, it doesn't need intrinsic value. It just needs to be accepted as a spur.
  4.  **Circulation = Velocity (Query 22).** Once money is a ticket, the speed of the ticket matters more than the number of tickets.
  5.  **State Power = Limited (Query 28).** Even if it's a ticket, you can't just write any number on it, or the game stops.

  **What Breaks if Reversed:**
  If you start with Query 23 (Money is a ticket), students assimilate it into their Intro Macro "fiat money" module. They check the box: "Berkeley = Fiat." They then read Query 1 as a moral platitude rather than an economic definition. They will fail to see why Berkeley cares about the *Irish Bank* specifically. The radicalism of Query 23 depends entirely on the redefinition of Wealth in Query 1.

  **Pedagogical Fix:** Do not ask "Is money a ticket?" until they have committed to "Is an idle nation rich?" Force them to defend Locke's definition of wealth against Berkeley's. Only when they admit that a chest of gold in a starving nation is useless does Query 23 become the solution rather than a truism.

  ---

  ### 2. The One Carrying Example

  **The Example:** **The "Stalled Cathedral" Construction Project.**
  Imagine a Bishop wants to build a cathedral in a remote Irish town. There are 100 idle stonemasons and plenty of stone. There is no gold coin in the town.

  **What it must have:**
  *   **A specific goal:** Building the cathedral (Industry/Query 1).
  *   **A medium of exchange:** The Bishop issues lead tokens to pay masons, who use them to buy bread (Ticket/Query 23).
  *   **A circulation mechanism:** Tokens must move from Bishop -> Mason -> Baker -> Mason (Circulation/Query 22).
  *   **A state intervention:** The Bishop declares a token is worth 2 shillings instead of 1 (Denomination/Query 28).

  **What it must lack:**
  *   **External trade:** Do not introduce imports/exports yet. Keep it closed to isolate the *internal* activation mechanism.
  *   **Inflationary panic:** Do not let the example devolve into "prices rise." Focus on "work stops."

  **Why the obvious candidates fail:**
  *   **Poker Chips:** Implies a zero-sum game. Berkeley's point is positive-sum (industry creates wealth).
  *   **Company Scrip:** Implies coercion/exploitation. Berkeley views the token as liberating idle hands.
  *   **Gift Cards:** Single use. Fails Query 22 (circulation/speed).
  *   **Hyperinflation:** Focuses on money losing value. Berkeley is concerned with money *failing to exist* or *failing to move*. Hyperinflation makes students think "Money is dangerous." Berkeley thinks "Money is necessary."
  *   **Modern Fiat:** Too abstract. Students assume the "full faith and credit" of the US Government. The Bishop example isolates the *local trust* required for the ticket to work.

  ---

  ### 3. The Misconception Map

  | Misconception | Where it arises | The Head-Off Move |
  | :--- | :--- | :--- |
  | **"Money is a social construct (Triviality)."** | Query 23 discussion. | Ask: "If I print tickets in my dorm, can I build a cathedral?" Force them to articulate the *preconditions* for the ticket to work (authority/acceptance), moving beyond "it's all made up." |
  | **"Berkeley is a Proto-Keynesian."** | Query 5 (stirring industry). | Distinguish *demand* from *activation*. Keynes manages aggregate demand to fix cycles. Berkeley wants to wake up idle hands permanently. Ask: "Does Berkeley care about unemployment or *idleness*?" (Moral vs. Macro). |
  | **"He invented the Quantity Theory (Velocity)."** | Query 22 (swiftly circulating). | Query 22 says less money swiftly circulating = more money slowly. Modern QT says $MV=PT$. Berkeley isn't measuring $P$ (prices); he's measuring $T$ (transactions/industry). Ask: "If velocity doubles but no extra stone is cut, did Berkeley succeed?" |
  | **"The Questions are just Statements."** | Throughout. | Refuse to lecture. When a student summarizes, reply: "Berkeley didn't say that. He asked *Whether*. What if the answer is No?" Force them to defend the affirmative. |
  | **"Intrinsic Value is irrelevant."** | Query 23. | Push Query 28. If value is arbitrary, why is changing denomination a "cheat"? If it's just a ticket, why can't the Bishop change the number? This reveals the *trust* constraint. |

  ---

  ### 4. The Check (Final 5 Minutes)

  Do not ask them to summarize Berkeley. Ask them to solve a problem where Berkeley and Locke diverge.

  **The Prompt:**
  "A ship arrives from Spain with £10,000 in silver.
  **Scenario A:** The silver is locked in a merchant's vault.
  **Scenario B:** The silver is melted down into thin foil tokens and distributed to idle fishermen to repair nets.
  **Scenario C:** The merchant uses the silver to buy imported luxury cloth for his own consumption.

  According to **Locke**, which scenario makes the nation richest?
  According to **Berkeley**, which scenario makes the nation richest?
  **Crucial Follow-up:** In Scenario B, if the fishermen refuse to work because they don't like lead tokens, who is at fault? The Bishop (issuer) or the Fishermen (industry)?"

  **Success Criteria:**
  *   They identify Locke prefers A or C (Stock/Wealth).
  *   They identify Berkeley prefers B (Flow/Industry).
  *   **The Kicker:** If they say "The Bishop is at fault" for Scenario B failing, they understand Query 23/28 (the ticket must be credible). If they say "The Fishermen are at fault," they understand Query 1 (Industry is the source of wealth, money is only the spur). *Berkeley actually blames the lack of industry/spirits, but acknowledges the ticket must be trusted.* The correct Berkeleyan nuance is: The ticket failed to *stir* industry (Query 5), so it was a bad ticket, even if lead is theoretically fine.

  ---

  ### 5. What to Leave Out, Openly

  **Cut the Doctrine of Signs.**
  Tell them: "Berkeley has a famous philosophical theory that words are signs that don't need ideas attached to them to function. He applies this to money. It is fascinating. We are ignoring it."
  **Why:** It consumes 15 minutes of cognitive load for zero economic return. It allows students to retreat into philosophy when you want them grappling with circulation.

  **Cut the Specifics of the Irish Bank Proposal.**
  Do not detail the capitalization, the subscribers, or the political opponents of the bank.
  **Why:** It dates the material too heavily. Keep the *logic* of the bank (issuing paper against land/security) without the *history* of the bank.

  **Cut the Comparison to Hume.**
  You are teaching Hume next week. Do not preview Hume's critique of Berkeley.
  **Why:** It turns this session into a trailer for next week. Let Berkeley stand on his own feet. If they think Berkeley "invented velocity," let that stand until Hume corrects them in Week 4.

  ---

  ### 6. The Minute-by-Minute Plan

  **00:00 – 00:10: The Hook (Query 1)**
  *   Write Query 1 on the board: *"Whether there ever was, is, or will be, an industrious nation poor, or an idle rich?"*
  *   **Activity:** Do not lecture. Ask: "Define 'Rich'."
  *   **Trap:** Students will say "GDP" or "Gold reserves."
  *   **Move:** Force the Locke contrast. "If I have a vault of gold but my people are starving, am I rich?"
  *   **Goal:** Establish Wealth = Capacity to Labor (Industry), not Stock of Specie.

  **00:10 – 00:25: The Mechanism (Query 5 & The Cathedral Example)**
  *   Introduce the **Stalled Cathedral**. 100 masons, no coin, no work.
  *   Read Query 5: *"Whether money be not only so far useful, as it stirreth up industry..."*
  *   **Discussion:** How do we start the work?
  *   **Introduce the Lead Token.** The Bishop pays masons in lead.
  *   **Question:** "Why does the baker accept lead?"
  *   **Goal:** Establish money as a *medium of activation*, not a store of value.

  **00:25 – 00:45: The Nature of the Token (Query 23)**
  *   Read Query 23: *"Whether the true idea of money... be not altogether that of a ticket or counter?"*
  *   **Challenge:** "If it's just a ticket, why not use playing cards?"
  *   **Dependency Check:** Refer back to Query 1. If the ticket doesn't produce industry, is it money?
  *   **Key Distinction:** Money is not the *wealth* (the cathedral); it is the *ticket* to build it.
  *   **Correction:** If a student says "It's fiat," ask "Who says?" (The Bishop). "Can anyone say?" (No, see Query 28).

  **00:45 – 01:05: Circulation and Speed (Query 22)**
  *   Read Query 22: *"Whether, therefore, less money swiftly circulating, be not, in effect, equivalent to more money slowly circulating?"*
  *   **Apply to Cathedral:**
      *   Case A: 100 tokens, each used once a week.
      *   Case B: 10 tokens, each used 10 times a week.
  *   **Question:** "Does the cathedral get built faster in A or B?"
  *   **Misconception Head-Off:** Students will say "Prices rise in B."
  *   **Correction:** "We are measuring *stone cut*, not *price of stone*." Remind them of the Wealth = Industry definition from Minute 10.
  *   **Goal:** Decouple Velocity from Inflation; couple Velocity to Output.

  **01:05 – 01:15: The Limit of Power (Query 28)**
  *   Read Query 28: *"Whether arbitrary changing the denomination of coin be not a public cheat?"*
  *   **Scenario:** The Bishop is behind schedule. He stamps '2' on all '1' tokens.
  *   **Question:** "Are the masons richer? Can they buy more bread?"
  *   **Discussion:** Why is this a "cheat" if money is just a ticket?
  *   **Resolution:** Because it breaks the *trust* required for the ticket to stir industry (Query 5). If the ticket is arbitrary, industry stops.
  *   **Goal:** Show that "Ticket" does not mean "Arbitrary." It requires convention/stability.

  **01:15 – 01:20: The Check**
  *   Distribute the **Ship from Spain** prompt (see Section 4).
  *   Students write individually.
  *   Collect on exit.

  **01:20: Dismissal**
  *   "Next week: Hume reads Berkeley and decides he is wrong about almost everything. Read 'Of Money'."
