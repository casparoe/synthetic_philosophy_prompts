  12. **Final Polish:** Ensure the distinction between the *truth* of $G(F)$ and the *knowability* of $G(F)$ is clear. $G(F)$ is true (if $F$ is consistent), but not provable in $F$. For the mind to "outrun" $F$, the mind must *prove* (know) $G(F)$. To do that, the mind must prove (know) $Con(F)$. If Mind = $F$, Mind cannot prove $Con(F)$.

      *   Wait, one nuance: $G(F)$ is true in the standard model. The mathematician sees this *semantically*. The machine proves things *syntactically*.
