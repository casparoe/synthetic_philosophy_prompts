      *   If the reductio assumes I am consistent, *I* (the subject) do not automatically inherit that knowledge.
      *   Analogy: Suppose I am a prisoner. The warden knows I am in Cell 5. I do not know I am in Cell 5. The warden knows "Whoever is in Cell 5 gets fed." The warden knows "I get fed." I cannot conclude "I get fed" via that route unless I know I am in Cell 5.
