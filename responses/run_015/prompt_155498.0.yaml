  I recommend we reject the current draft of a banned-words list and instead adopt a procedural clarity test for all major administrative announcements, piloted over the next semester with a review mechanism built into our next meeting cycle. The current draft misunderstands the problem we are trying to solve. Our recent seminar work on Orwell highlighted that the danger of political language is not merely shrinking vocabulary but the use of ready-made phrases that assemble themselves to do our thinking for us. The mechanism he actually describes is one where structure replaces thought. If we simply ban terms like realignment or transitioned, we will not achieve clarity; we will merely incentivize the communications office to generate fresh jargon that complies with the list while obscuring the same realities, allowing everyone to feel virtuous without actually changing how power is exercised. A static list treats the symptom while ignoring the mechanism. We cannot legislate honesty by banning words.

  We must take the concerns raised by the communications director seriously, particularly regarding legal constraints and the notion that vagueness can sometimes be kindness. There is a distinct difference between protecting individual privacy in personnel matters and obscuring institutional strategy. When announcing a colleague's death, discretion is humane; when announcing the closure of majors, vagueness about who decided and how many jobs are lost is not kindness, it is obfuscation. HR requirements do not mandate that we hide the decision-making process behind passive voice. Vagueness is sometimes kindness, but only when protecting the vulnerable, not when protecting the institution from accountability. The March email proved that vagueness about job losses causes unrest, not calm. Similarly, while the faculty representative is right that the university should not police academic writing, this policy concerns administrative communications governing staff and students, not scholarly discourse. We are not regulating how professors teach; we are regulating how the administration explains its own actions to the community it serves.

  Therefore, I propose we replace the banned-words list with a requirement that any announcement regarding structural changes must pass an agency test. Before circulation, the drafting office must be able to rewrite the core sentences to name an agent, a specific verb, and the people affected. If they cannot do this because of legal constraints, the email must explicitly state that legal constraints prevent disclosure, rather than using language that implies no difficult decisions were made. This shifts the burden from memorizing forbidden terms to demonstrating accountability. We should pilot this for the upcoming semester, applying it to any communication involving budgetary or structural changes, starting with the first budget cycle announcement. This ensures the test meets real pressure. To evaluate whether it is working, our working group will review three major announcements at our next meeting, not to check for banned words, but to assess whether a reasonable reader could identify who made the decision and who bears the cost. If the language remains opaque despite the test, we will know the policy is failing. We will publish this review internally so the Senate can see whether the standard is being met. This approach respects the need for privacy where truly warranted while rejecting the idea that vagueness is a neutral tool. It acknowledges that clear language is not about simplicity for its own sake, but about ensuring that when the university wields power, it does not hide behind grammar. We have a chance to build a policy that prevents the next sit-in by ensuring the community understands what is happening to them, rather than one that simply scrubs the email of words that might provoke them. This addresses the director's worry that mandated style becomes its own orthodoxy. By limiting the scope to administrative decisions affecting employment or enrollment, we avoid policing thought while demanding transparency on action.
