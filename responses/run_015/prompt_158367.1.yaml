answer: |-
  This is a profound problem in normative decision theory, touching on the limits of rationality when faced with "tail risks" and "astronomical stakes." The tension you describe lies between the **aggregationist** logic of Expected Utility (EU) and the **safeguard** logic of Maximin.

  Below is a detailed comparison of these frameworks, an analysis of their behavior under extreme uncertainty, and an evaluation of whether the "fanaticism" problem is a bug of calculation or a feature of our value structure.

  ---

  ### 1. Does Maximin Escape Fanaticism or Suppress It?

  To answer this, we must distinguish between *probabilistic fanaticism* (EU) and *possibilistic extremism* (Maximin).

  **Expected Utility Fanaticism:**
  In EU theory, the value of a prospect is $E[U] = \sum p_i u(x_i)$. Fanaticism arises because multiplication is commutative and continuous: a probability $p \to 0$ can be offset by a utility $u \to \infty$. If the utility scale is unbounded, there is always some outcome large enough to dominate the calculation, regardless of how improbable it is. This renders the decision insensitive to *reasonable* likelihoods.

  **The Maximin Mechanism:**
  Maximin selects the option $A$ over $B$ if $\min(outcomes_A) > \min(outcomes_B)$. It assigns a weight of 1 to the worst possible state and 0 to all others.

  **Does it escape fanaticism?**
  Maximin **escapes probabilistic fanaticism** but inherits **structural rigidity**.
  *   **Escape:** It is immune to "Pascal's Mugging" style arguments where a tiny probability of astronomical gain dictates choice. Because $p$ is removed from the equation, a 1-in-$10^{100}$ chance of paradise does not outweigh a guaranteed moderate good if the worst-case of the gamble is worse than the guaranteed good.
  *   **Suppression/Shift:** However, Maximin does not ignore magnitude; it ignores probability. If the "worst case" is defined by an unbounded negative tail (e.g., infinite suffering), Maximin becomes absolutist. It treats a 0.0000001% risk of catastrophe identically to a 100% risk.
  *   **Conclusion:** Maximin does not suffer from *fanaticism* (where vanishing probabilities drive decisions), but it suffers from *catastrophism*. It blocks low-probability astronomical *values* from controlling the choice, but it allows low-probability astronomical *risks* to veto the choice entirely. It suppresses the probabilistic calculus, not the influence of extreme magnitudes.

  ### 2. Concrete Application: The Existential Risk Case

  **The Scenario:**
  *   **Option A (Safe):** Guaranteed moderate benefit ($B$). Worst case: Mild disappointment ($D_{mild}$).
  *   **Option B (Risky):** 99.999% chance of $B$. 0.0001% chance of Existential Disaster ($D_{exist}$).

  **Expected Utility Evaluation:**
  $$EU(A) = u(B)$$
  $$EU(B) = 0.99999 \cdot u(B) + 0.00001 \cdot u(D_{exist})$$

  The decision hinges entirely on the cardinal value of $u(D_{exist})$.
  *   If utility is **bounded** (e.g., $u(D_{exist})$ is finite), $EU(B)$ may exceed $EU(A)$ if the benefit $B$ is distributed widely enough or repeated often enough to swamp the tiny risk.
  *   If utility is **unbounded** or if $D_{exist}$ represents the termination of all future value (effectively $-\infty$), then $EU(B) \to -\infty$. EU dictates rejecting Option B.

  **Maximin Evaluation:**
  $$\min(A) = D_{mild}$$
  $$\min(B) = D_{exist}$$
  Since $D_{mild} \succ D_{exist}$, Maximin strictly mandates **Option A**.

  **Is Maximin's Insensitivity Rational?**
  *   **Argument for Rationality (The Ruin Argument):** In contexts involving "ruin" (systemic collapse, extinction), probabilities are epistemically fragile. We cannot trust a risk assessment of 0.0001% when model uncertainty is high. Furthermore, ruin is non-ergodic; you cannot play the game again to average out the loss. In one-shot, non-ergodic scenarios, ignoring probability is a survival heuristic. Here, Maximin aligns with the **Precautionary Principle**.
  *   **Argument for Irrationality (Opportunity Cost):** Maximin implies we should spend the same resources preventing a $10^{-9}$ risk as a $10^{-2}$ risk. This leads to paralysis. If every technological advance carries a non-zero existential risk, Maximin mandates stagnation. It fails to account for the *cost* of safety. Ignoring the 99.999% success rate discards valuable information, making it irrational in contexts where risks are manageable and trade-offs are necessary.

  **Verdict:** Maximin is rational if $D_{exist}$ represents true irreversible ruin (absorbing barrier). It is irrational if $D_{exist}$ is merely a severe but recoverable loss, or if risk reduction entails high opportunity costs that themselves cause harm.

  ### 3. Hybrid Approaches: Can We Have the Best of Both?

  Several hybrids attempt to mitigate EU fanaticism without accepting Maximin's paralysis.

  **A. Bounded Utility Functions**
  *   *Mechanism:* Cap the utility function so that $u(x)$ approaches an asymptote. No outcome, however large, can have infinite value.
  *   *Pros:* Mathematically eliminates fanaticism. A tiny probability of a huge gain can never outweigh a sure moderate loss if the gain is capped.
  *   *Cons:* Violates the "Dominance Principle." It implies that saving 1 billion lives is not significantly better than saving 1 million lives once the cap is neared. It feels counterintuitive to moral aggregation.

  **B. Probability Thresholds (Lexicographic Maximin)**
  *   *Mechanism:* Use Maximin for probabilities below a threshold $\epsilon$ (e.g., $10^{-6}$), and EU above it.
  *   *Pros:* Captures the intuition that some risks are too remote to worry about, while guarding against tail risks.
  *   *Cons:* **Arbitrariness.** Why $\epsilon = 10^{-6}$ and not $10^{-7}$? This creates a "cliff edge" where reducing risk from $\epsilon + \delta$ to $\epsilon - \delta$ creates a discontinuous jump in decision value. This violates continuity axioms of rational choice.

  **C. Risk-Capped Expected Utility (Partial Moments)**
  *   *Mechanism:* Optimize expected return subject to a constraint on "lower partial moments" (e.g., Conditional Value at Risk).
  *   *Pros:* Allows trade-offs but penalizes tail thickness. Common in finance.
  *   *Cons:* Still requires setting a confidence level (e.g., 99%), which reintroduces the arbitrariness problem.

  **Assessment:**
  Hybrids preserve strengths but rarely escape the charge of arbitrariness. Bounded utility is the most theoretically coherent but morally costly. Thresholds are practically useful but theoretically fragile. A hybrid approach works best not as a rigid algorithm, but as a **meta-rule**: *Use EU for reversible, ergodic decisions; use Maximin (or Precaution) for irreversible, systemic risks.*

  ### 4. Theoretical Roots: Is Fanaticism Intrinsic to EU?

  This is the crux of the matter. Is the problem the *math* of expectation, or the *scale* of value?

  **The Case for Unbounded Utility:**
  Fanaticism is **not** intrinsic to Expected Utility theory *per se*; it is intrinsic to **Unbounded** Expected Utility theory.
  *   Von Neumann-Morgenstern axioms do not require unbounded utility.
  *   If utility is bounded (as Ramsey originally suggested), the sum $\sum p_i u(x_i)$ always converges. A tiny probability cannot dominate because $u(x)$ has a ceiling.
  *   **The Cost:** As noted, bounded utility implies that sufficiently large numbers of small benefits cannot outweigh a massive benefit. This violates "Strong Dominance" (if Outcome X is better than Y in every state, X should be preferred).

  **The Case for Intrinsic Fanaticism:**
  Recent work (e.g., Beckstead & Thomas, 2021) argues that if you accept three plausible premises, fanaticism is unavoidable even without explicit infinity:
  1.  **Unboundedness:** There is no limit to how good an outcome can be.
  2.  **Continuity:** Small changes in probability lead to small changes in value.
  3.  **Separability:** Choices in one part of the universe don't negate value in another.
  If you hold these, EU *must* be fanatic. To escape fanaticism, you must reject one. Most defenders of rationality choose to reject **Unboundedness** (accepting bounded utility) or **Continuity** (accepting lexical priorities, which mimics Maximin).

  **Mapping and Breakdown:**

  | Feature | Expected Utility (Unbounded) | Maximin | Hybrid (Bounded EU) |
  | :--- | :--- | :--- | :--- |
  | **Probability Sensitivity** | High (Linear) | None (Binary) | High (Linear) |
  | **Tail Sensitivity** | Extreme (Fanaticism) | Extreme (Catastrophism) | Moderate (Capped) |
  | **Repeatability** | Optimal for Ergodic systems | Suboptimal (Too conservative) | Optimal |
  | **Ruin Scenarios** | Fails (Averages ruin) | Optimal (Avoids ruin) | Context-dependent |
  | **Theoretical Cost** | Fanaticism | Paralysis / Opportunity Cost | Violates Dominance |

  **Where the Mapping Breaks Down:**
  The mapping breaks down at **Ergodicity**. EU assumes time averages equal ensemble averages. In existential risk, the "ensemble" is 1 (we only have one timeline). If the outcome is ruin, the time average is zero regardless of the probability. EU fails here because it treats a 1-in-a-million chance of ruin as "mostly safe," whereas in a single-shot trajectory, it is a potential terminal node. Maximin succeeds here because it treats the timeline as singular.

  ### 5. Conclusion: A Defensible Account of Rational Choice

  The fanaticism problem is **not intrinsic to the expectation operator**, but it is intrinsic to **unbounded value scales combined with linear probability weighting.**

  **Which framework is more defensible?**
  Neither pure EU nor pure Maximin is sufficient for deep uncertainty with extreme outcomes.
  *   **Pure EU** is indefensible in ruin scenarios because it allows the "absorption" of catastrophic risk into a positive average.
  *   **Pure Maximin** is indefensible in general policy because it ignores the moral weight of probabilities (saving 1,000 lives with 50% probability is not the same as saving 1 life with 100% probability).

  **The Defensible Position: Bounded Utility with Lexical Constraints on Ruin.**
  The most robust account involves a **bounded utility function** to prevent probabilistic fanaticism regarding *gains*, combined with a **lexical constraint (Maximin)** specifically applied to *irreversible ruin*.

  1.  **Bound the Upside:** Accept that utility saturates. This prevents tiny probabilities of "infinite good" from dictating policy (solving Pascal's Mugging).
  2.  **Lexical Downside:** Treat "ruin" (permanent loss of decision-making capacity/existence) as a lexicographic prior. If an option carries a non-negligible risk of ruin (where "negligible" is defined by epistemic limits, not just statistical models), it is vetoed regardless of EU.
  3.  **EU for the Rest:** For all non-ruin scenarios, use Expected Utility to maximize welfare.

  This approach acknowledges that **probabilities matter, but survival matters more.** It avoids the arbitrariness of hard probability thresholds by anchoring the constraint in the *nature of the outcome* (reversible vs. irreversible) rather than the *likelihood of the outcome*. This preserves the sensitivity of EU for normal trade-offs while granting Maximin its proper domain: the guardrail against extinction.
