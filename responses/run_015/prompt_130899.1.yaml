answer: |-
  # ACQUISITIONS AND COLLECTIONS COMMITTEE: AUTHENTICATION AND TIERING PROCEDURE (v1.0)

  **Purpose:** To assign an evidentiary tier to every object entering or remaining in the collection, consistent with the Collections Policy ("evidence of the human past," "no vouching").
  **Time Limit:** 20 minutes per object.
  **Authority:** Curators propose; Committee approves Tiers 1–4; Board approves Tier 5 and Deaccessioning.

  ### I. THE TIER VOCABULARY
  1.  **BY:** Secure documentation or scientific consensus. *(Curator + Committee)*
  2.  **ATTRIBUTED TO:** Strong stylistic/provenancial evidence, minor gaps. *(Curator + Committee)*
  3.  **STUDIO / WORKSHOP OF:** Production context secure, specific hand uncertain. *(Curator)*
  4.  **AFTER / IMITATION:** Later copy, honest intent or neutral context. *(Curator)*
  5.  **FORGERY:** Deliberate deception regarding origin/age. *(Committee + Board)*
  6.  **UNCERTAIN ORIGIN:** Evidence unavailable or inconclusive. *(Curator)*

  ### II. DECISION TREE (AUTOGRAFIC ARTS: PAINTING, SCULPTURE, CRAFT)
  *Ask in order. Stop at the first definitive answer.*

  1.  **Is there a documented chain of ownership to the maker?**
      *   Yes → **Tier 1 (BY)**. [PHIL: History of Production > Look]
      *   No → Go to 2.
  2.  **Does scientific analysis (materials/dating) contradict the claimed period?**
      *   Yes → Go to 5.
      *   No → Go to 3.
  3.  **Is the style distinctive enough to identify the maker without documentation?**
      *   Yes → **Tier 2 (ATTRIBUTED TO)**. [JUDG: Stylistic confidence threshold]
      *   No → Go to 4.
  4.  **Is the object consistent with the maker's known workshop output?**
      *   Yes → **Tier 3 (STUDIO)**.
      *   No → **Tier 6 (UNCERTAIN)**. [JUDG: Default to epistemic humility]
  5.  **Was the discrepancy intended to deceive (e.g., removed marks, false provenance)?**
      *   Yes → **Tier 5 (FORGERY)**. [PHIL: Intent defines forgery]
      *   No → **Tier 4 (AFTER/IMITATION)**.
  6.  **If Tier 5 (FORGERY): Does it qualify for the Imitation Endowment?**
      *   Yes → Retain as "Evidence of Deception." *(Board Approval)*
      *   No → **Deaccession/Return**. *(Board Approval)*

  ### III. DECISION TREE (ALLOGRAPHIC ARTS: PRINTS, PHOTOGRAPHY, CASTS)
  *Identity runs through authorization, not touch.*

  1.  **Was the production (printing/casting) authorized by the artist or estate during their life?**
      *   Yes → **Tier 1 or 2** (based on edition status). [PHIL: Institutional Authorization]
      *   No → Go to 2.
  2.  **Are the original matrices (plates/molds) extant and was posthumous use authorized?**
      *   Yes → **Tier 3 (POSTHUMOUS AUTHORIZED)**.
      *   No → **Tier 6 (UNCERTAIN / UNAUTHORIZED)**. [JUDG: Estate veto is binding]
  3.  **If Unauthorized: Is the object evidence of a specific historical practice?**
      *   Yes → **Tier 4 (IMITATION)**.
      *   No → **Decline / Deaccession**.

  ### IV. DEFAULTS AND ESCALATION
  *   **Budget Default:** If technical opinion exceeds $8k limit and is required for Tier 1/2, default to **Tier 6 (UNCERTAIN)**. [JUDG: Resource constraint]
  *   **Review:** Tier 6 objects are reviewed every 10 years.
  *   **Escalation:** Any move from Tier 1/2 to Tier 4/5 requires Board notification (Reputation Risk).
  *   **Record:** The "One-Page Record" must list: Object ID, Tier Assigned, Key Evidence (max 3 bullets), Decision (Acquire/Retain/Deaccession).

  ***

  # DESIGN & PHILOSOPHICAL ANNOTATIONS

  **1. Philosophical Encodings (Contested Choices)**
  *   **History over Look (Step II.1 & II.2):** The procedure prioritizes provenance and material history over aesthetic quality. This encodes the Danto/Wollheim view that an object's art-status depends on its *history of production*, not its visual properties. A perfect visual match with no history defaults to Tier 6, not Tier 1. *Defense:* This protects the museum from being a gallery of beautiful lies.
  *   **Intent defines Forgery (Step II.5):** We distinguish between a 19th-century copy sold openly (Imitation) and one with removed marks (Forgery). This encodes Dickie's Institutional Theory that "artworld" status (and its negation) relies on intent and context. *Defense:* Without intent, everything is a copy. We must punish deception, not replication.
  *   **Estate Veto (Step III.2):** In allographic arts, we defer to the Estate's definition of the work. This encodes an Institutional view that the "work" is a legal/conceptual construct, not just the physical print. *Defense:* Necessary to avoid legal liability and respect the artist's conceptual boundary.

  **2. Design Judgments (Usability vs. Theory)**
  *   **The "Uncertain" Default (Step II.4 & IV):** Theoretically, we could default to "Attributed." I chose "Uncertain" to force curators to prove value. *Risk:* It devalues holdings. *Defense:* It aligns with the "no vouching" policy.
  *   **The $8k Cut-off (Step IV):** This is purely pragmatic. It means rich donors get Tier 1 verification; poor donors get Tier 6. *Defense:* Unavoidable in a regional museum, but systematically unfair (see Critique).
  *   **Tier 3 (Studio) as a Catch-all:** Theoretically muddy (is it the master's design?). Practically necessary to keep objects in the collection without lying.

  ***

  # CASE APPLICATIONS

  ### Case A: The Small Oil Landscape
  *   **Branch:** Autographic (Painting).
  *   **Run:**
      1.  Chain of ownership to maker? **No** (Dealer invoice only).
      2.  Science contradict period? **No** (Pigments/canvas consistent).
      3.  Style distinctive? **No** (Handling close but not unique).
      4.  Workshop consistent? **Unknown** (No other workshop data).
      5.  *Default:* **Tier 6 (UNCERTAIN ORIGIN)**.
  *   **Disposition:** **Reclassify and Retain.** Label as "Uncertain Origin, c. 1920–1950."
  *   **Committee Friction:** Curators will hate this. It downgrades a 50-year cataloging.
  *   **Reason:** The signature is suspect (varnish break), and style is not distinctive. Under "History > Look," we cannot claim "By" without provenance. We keep it as evidence of *period style*, not *authorial genius*.

  ### Case B: The Bronze Statuette
  *   **Branch:** Autographic (Sculpture/Cast).
  *   **Run:**
      1.  Chain to maker (Roman)? **No** ( disproven).
      2.  Science contradict claimed period? **Yes** (19th C alloy).
      3.  Intent to deceive? **Yes** (Stamp toolled away).
      4.  *Result:* **Tier 5 (FORGERY of Roman Antiquity)**.
      5.  Endowment Qualification? **Yes** (Evidence of 19th C taste/deception).
  *   **Disposition:** **Reclassify and Retain.** Label: "19th Century Imitation of Roman Type, Founder [Name], stamp removed c. 1910."
  *   **Committee Friction:** None. It saves the object.
  *   **Reason:** It is a genuine 19th-century object. The "Forgery" tier applies to the *claim* of Roman origin, not the object's physical reality. It fits the "evidence of human past" policy (evidence of 1911 collecting habits).

  ### Case C: The Convicted Fraudster's Painting
  *   **Branch:** Autographic (Painting).
  *   **Run:**
      1.  Chain to claimed maker (Modernist)? **No** (Exposed).
      2.  Science contradict period? **Yes** (Made 2016).
      3.  Intent to deceive? **Yes** (Sold as 1948, fraud conviction).
      4.  *Result:* **Tier 5 (FORGERY)**.
      5.  Endowment Qualification? **Yes** (Explicitly for "deliberate imitations... shown as such").
  *   **Disposition:** **Acquire.** Label: "Forgery of [Modernist] by [Fraudster], 2016."
  *   **Committee Friction:** Some trustees may fear "taint."
  *   **Reason:** The donor's condition (display as warning) aligns perfectly with the Endowment. The object is evidence of *market vulnerability*. We are not vouching for the Modernist; we are vouching for the Fraud.

  ### Case D: The Posthumous Etchings
  *   **Branch:** Allographic (Prints).
  *   **Run:**
      1.  Authorized during life? **No** (Artist died before printing).
      2.  Matrices extant + Posthumous authorized? **No** (Plates cancelled, Estate veto).
      3.  Evidence of historical practice? **Debatable** (Estate conflict).
      4.  *Result:* **Tier 6 (UNAUTHORIZED)**.
  *   **Disposition:** **Decline Gift.**
  *   **Committee Friction:** High. They are visually identical to lifetime prints.
  *   **Reason:** In allographic arts, the "work" is the authorized iteration. The Estate's cancellation of the plates terminates the work's identity. To accept them is to side against the legal rights holder in an active dispute. We lack the mandate to arbitrate estate law.

  ***

  # SYSTEMIC CRITIQUE: WHERE THIS MISFIRES

  **1. The Documentation Bias**
  This procedure is systematically unfair to **oral cultures, folk traditions, and marginalized artists** whose work was never documented.
  *   *Why:* Step II.1 (Provenance) and Step IV (Budget for Science) favor Western, wealthy, documented art. A Indigenous mask with no paper trail defaults to Tier 6, while a mediocre European sketch with an invoice becomes Tier 2.
  *   *Mitigation:* None built in. This requires a separate policy for Ethnographic material, which this procedure ignores to maintain speed.

  **2. Laundering Doubt**
  The tier **"Attributed To" (Tier 2)** is a device for laundering doubt into value.
  *   *Why:* It allows the museum to display an object with the visual prestige of a master without the evidentiary burden. It satisfies the "Look" theory (Sagoff) while pretending to satisfy the "History" theory (Danto).
  *   *Defense:* I kept it because without it, we lose 40% of our collection. It is a necessary lie for regional museums.

  **3. The Allographic Hard Stop**
  Step III.2 (Estate Veto) assumes the Estate is a rational actor.
  *   *Why:* Estates often withhold authorization for tax reasons or internal feuds, not artistic integrity. This procedure empowers heirs to erase art history.
  *   *Defense:* I defend the veto. The legal risk of copyright infringement outweighs the philosophical desire to preserve the image.

  **4. What It Cannot Settle**
  This procedure cannot settle **collaborative works** or **AI-generated art**.
  *   *Why:* The "By" tier assumes a single human agent.
  *   *Guess:* Until the Board updates the Policy, AI works default to Tier 6 (Uncertain Origin) as "human past" evidence is currently undefined for non-human agents.

  **5. The $8,000 Cliff**
  The budget default creates a two-tier collection: Verified objects (Donor paid for science) and Uncertain objects (Museum couldn't afford science).
  *   *Why:* This commodifies truth.
  *   *Defense:* It is the only way to run a committee in 20 minutes. We trade epistemic justice for operational viability.

  **Final Note to Chair:**
  This procedure forces you to admit ignorance (Tier 6) more often than you will like. It will anger donors who want "By." It will frustrate curators who rely on "eye." But it is the only way to survive the new "No Vouching" policy without emptying the galleries. Stick to the defaults.
