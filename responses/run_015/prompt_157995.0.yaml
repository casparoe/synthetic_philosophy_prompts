answer: |-
  ### (1) Brief Conceptual Mapping

  In programming-language theory, we distinguish between values (immutable data) and references (mutable pointers to heap memory). Material constitution maps to the relationship between a heap-allocated memory block and the references pointing to it. The "clay" corresponds to the raw storage buffer, while the "statue" corresponds to a specific type interface or schema imposed on that buffer. Identity splits into reference equality (same memory address) versus structural equality (same data content). Temporal persistence is modeled via version-control histories or persistent data structures, where objects are immutable snapshots linked in a tree. Garbage collection handles lifecycle termination, while transactional updates manage state transitions. This framework allows us to treat metaphysical puzzles as questions about aliasing, type invariants, and state evolution without invoking non-computational ontology.

  ### (2) Translation of the Four Positions and the Injected Variant

  **The Coincidence View**
  This position asserts that the statue and the clay are numerically distinct objects sharing all parts. In semantic terms, this is **aliasing with distinct type interfaces**. Two references, `ref_statue` and `ref_clay`, point to the same heap address. However, they possess different static types. `ref_statue` enforces a shape invariant; `ref_clay` enforces only material continuity. If the underlying buffer is mutated to violate the shape invariant (squashing the clay), `ref_statue` becomes dangling or invalid, while `ref_clay` remains valid. They are distinct objects because their method tables differ, even though their data pointers coincide. This models distinctness via behavioral constraints rather than memory separation.

  **The Strict-Identity View**
  This view claims the statue and the clay are one object. Technically, this is **single reference polymorphism**. There is only one heap allocation. `ref_statue` is merely a cast of `ref_clay`. Identity is defined strictly by reference equality (`==`). If the clay survives squashing, the statue survives, because there is no second object to cease existing. This approach rejects the idea that type interfaces create new objects; types are merely views. It simplifies memory management but fails to capture the intuition that destroying the shape destroys the artifact, implying the type system should not enforce lifecycle invariants.

  **The Temporal-Parts Solution**
  Here, objects are spacetime worms. In PLT, this maps to **immutable version control histories**. An object is not a mutable heap block but a log of state transitions (a git branch). The "statue" and "clay" are distinct branches that share identical commits during the interval they overlap. They diverge when the clay is squashed but the statue is not (in counterfactual branches). Identity is defined over the entire trace, not the snapshot. At time $t$, the snapshots are structurally equal, but the parent hashes differ. This resolves coincidence by treating objects as functions of time, where overlap is merely shared history, not shared identity.

  **The Dominant-Kinds Solution**
  This position argues identity depends on the sortal concept. In type theory, this is **runtime type dominance via interface inheritance**. `Statue` extends `Clay`. The runtime system checks the dominant interface to determine lifecycle rules. If the shape invariant breaks, the object is garbage-collected as a `Statue` but persists as a `Clay`. The "kind" determines which destructor runs. This models sortal-dependence as dynamic dispatch: the system queries the object's primary interface to decide if it still exists. It treats existence as a property of the type hierarchy rather than the memory buffer alone.

  **The Injected Variant: Continuous 3D Printing**
  Suppose the statue is continuously printed from recycled clay, replacing all material over an interval while maintaining a schema. This is a **stream-processing vs. batch-update** problem.
  1.  *Persistent Schema:* Identity is preserved via a unique ID (UUID) attached to the schema, independent of memory addresses. The object is a logical stream where physical buffers are transient implementation details.
  2.  *Version Tree Divergence:* Each material replacement is a commit. If the schema remains constant, it is a linear history. If the schema drifts, it is a branch. This models the object as a fold over the stream of material inputs.
  3.  *GC and Reallocation:* The old instance is collected, and a new instance allocates memory inheriting the interface. This suggests identity is not preserved; rather, a new object is created that satisfies the same predicate.
  The variant forces a choice: is identity stored in the logical schema (functional identity) or the physical buffer (reference identity)? Continuous replacement breaks reference identity, suggesting PLT must rely on logical IDs for persistence, mirroring the metaphysical tension between form and matter.

  ### (3) Residue Report: Fidelity, Untranslatable Residue, and Diagnostic Verdict

  **Fidelity and Distortion**
  Several metaphysical claims translate cleanly. "Coincidence" maps robustly to "aliasing," capturing the intuition that one physical substrate can support multiple logical objects with different lifecycles. The "Temporal-Parts" view aligns precisely with immutable persistent data structures, where identity is a function of history rather than current state. However, distortion arises around "part-sharing." In PLT, aliases share *all* memory at an address; in metaphysics, coincidence often allows for partial overlap (e.g., a hand and a body). Mapping coincidence strictly to full aliasing oversimplifies the mereological structure. Additionally, treating type invariants as "existence conditions" smuggles a normative software design choice into what metaphysics treats as a descriptive fact about reality.

  **Untranslatable Residue**
  The most significant absence is **modality**. In metaphysics, the statue and clay differ in modal properties (what *could* happen to them). In PLT, types enforce what *must* happen at runtime, but the language specification does not inherently track counterfactual state transitions unless explicitly modeled (e.g., via typestate). The software framework lacks a native operator for "possible worlds." Furthermore, the "feel" of materiality—the resistance of the clay—is absent. Data is abstract; clay is physical. This absence suggests the original philosophical claim relies on physical intuition that computation abstracts away. It reveals that metaphysics often conflates conceptual distinctions with physical ones, whereas PLT cleanly separates interface from implementation.

  **Diagnostic Verdict on the Variant**
  The continuous-replacement variant illuminates the statue/clay problem by isolating temporal continuity from spatial overlap. In standard cases, spatial coincidence obscures whether identity is material or formal. The 3D-printing case forces the system to choose between reference equality (which fails as memory churns) and structural/schema equality (which persists). This mirrors the metaphysical choice between hylomorphism (form/matter) and endurantism. However, it risks substituting one ambiguity for another: defining "schema persistence" in software is itself a design choice, not a discovered fact. Thus, the variant clarifies that the debate is about identity criteria, not ontology, but it does not resolve which criteria are correct.

  ### (4) Bottom Line

  The software semantics translation suggests the statue/clay debate is not genuinely ontological but rather concerns the limits of identity predicates in mutable-state descriptions. In programming, whether two references denote the "same" object is determined by the language specification (e.g., `==` vs. `.equals()`), not by the hardware. Similarly, metaphysical identity appears to be a function of the conceptual framework (the "type system") applied to the world, not a mind-independent feature of reality. The debate persists because natural language lacks the precision of a type system to distinguish between reference equality, structural equality, and lifecycle invariants. A software engineer should conclude that "objecthood" is a semantic construct defined by the observer's interface, not an intrinsic property of the memory buffer.
