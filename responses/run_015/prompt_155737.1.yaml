answer: |-
  **The Certainty Equivalent**

  Elias sat at the corner table of the pub, carefully stacking bundles of cash next to a single, printed ticket. His friend Sarah stared at the money, then at Elias, then back at the money.

  "You remortgaged the flat," Sarah said. It wasn't a question.

  "I secured liquidity against future equity," Elias corrected, smoothing the ticket. "It's for the St. Petersburg game. The casino is running a special."

  "Elias, the expected payoff is infinite. You're a decision theorist. You know that's a trap."

  "Not anymore," Elias said, taking a sip of his lager. "I've resolved the paradox. I'm not using linear utility. I'm using a logarithmic function, à la Bernoulli. It collapses the infinite tail. The expected *utility* is finite."

  Sarah pulled out a napkin and a pen. "Okay. If your wealth is £100,000, and you use natural log, the certainty equivalent for a single play is roughly... £10. Maybe £15 if you're optimistic."

  "Exactly!" Elias beamed. "But you're forgetting the marginal utility of wealth. I'm not a billionaire. To me, that potential tail event is worth significantly more. With my current risk coefficient, the log model suggests I should prefer this ticket to a guaranteed £1,000 cash."

  Sarah paused, pen hovering. "Do you? Do you actually prefer this ticket to £1,000 in your hand right now?"

  Elias glanced at the cash stacks. "Well... no. Obviously not."

  "Then your utility function is wrong," Sarah said. "Log utility tames the infinity, but it still leaves the valuation absurdly high. It says you should mortgage the flat for a gamble you'd reject for a grand. To fix that, you need a harder bound. You need to say that after a certain point, more money adds zero utility."

  "I tried that," Elias admitted. "I introduced a hard cap. A maximum utility ceiling."

  "Where did you set it?"

  "At the value of the mortgage payments."

  Sarah blinked. "So, the utility of winning the game is capped at the exact cost of playing it?"

  "No, no. The utility of *keeping the house* is the cap. If I lose the mortgage money, I hit the floor. If I win, I hit the ceiling. The net expected utility change is... well, it's negligible."

  "Then why," Sarah asked, gesturing to the cash, "are you handing over your life savings for a negligible utility gain?"

  "Because," Elias said, picking up the ticket, "I realized the sleight of hand isn't in the math. It's in the time horizon. The log utility resolves the infinity, and the hard bound resolves the risk. But neither accounts for the fact that the bank uses *linear* utility."

  "The bank?"

  "They don't care if I go bust. Their utility function is unbounded. So, by remortgaging, I'm essentially arbitraging the difference between their linear risk neutrality and my bounded risk aversion. I'm selling them my downside risk in exchange for a lottery ticket."

  Sarah stared at him. "You remortgaged your home to sell the bank risk they didn't ask for, so you could buy a ticket worth £15?"

  "Not £15," Elias corrected, standing up. "£15 is the value if I play once. But I'm not playing once. I'm playing until the utility cap binds."

  "Elias, that's just the paradox again."

  "No," he said, heading for the door. "It's leverage. Wish me luck. If I get heads on the first toss, I'll buy you a drink. If I get tails on the twentieth, I'll buy you the pub."

  "And if you get tails on the first?"

  Elias paused, his hand on the handle. "Then I'll have to update my prior on the utility of homelessness. I hear it's quite concave."
