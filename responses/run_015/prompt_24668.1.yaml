  ### 1. Candidate rules

  Two candidate rules reconstruct the team's implicit logic. First, the **"Literal Expression" Rule**: protect only near-identical copying of fixed content (text, images, sequences), treating abstract structures as unprotected ideas. This predicts enforcing Ruling 2 (dialogue) and Ruling 5 (art), while declining Ruling 1 (premise), Ruling 3 (formula), and Ruling 4 (arc) as abstract concepts or methods. Second, the **"Non-Functional Design" Rule**: protect elements reflecting discretionary artistic choice, excluding those dictated by function or convention. This also predicts enforcing Ruling 2 (specific dialogue is a choice) and Ruling 5 (art is design), while declining Ruling 1 (genre convention), Ruling 3 (functional method), and Ruling 4 (stock trope).

  Both rules are jointly consistent with all five prior rulings. The divergence lies not in the past, but in how they classify new hybrid elements like user interface structures. The first rule views structure as idea; the second views structure as design. Both explain why we protected the specific dialogue and art but released the premise, formula, and trope to the public domain. The track record remains ambiguous only because no prior case involved a non-literal visual structure that was neither a pure method nor a pure image. The critical distinction is that Rule 1 focuses on the *degree of similarity* in copying, whereas Rule 2 focuses on the *nature of the element* copied. In Ruling 5, the copying was literal, so both rules agreed. In Ruling 1, the element was abstract, so both rules agreed. We have never faced a case where the element was artistic but the copying was non-literal. This gap allows both rules to coexist without contradiction in our history. Reconstructing these rules reveals that our team has effectively been operating under a conjunction of both standards, requiring both concrete expression and artistic choice for protection. However, since every enforced case met both criteria and every declined case failed both, we cannot yet know which criterion is dispositive when they conflict.

  ### 2. Applying the rules

  Applying the **"Literal Expression" Rule**, the verdict is **Decline**. This rule requires near-identical copying of fixed content. The competitor used different colors, typography, and animations. The shared elements—vertical scroll and spine metaphor—are structural methods akin to the scoring formula in Ruling 3 or the show premise in Ruling 1. Since the specific assets are not identical, the copying is not literal enough to trigger protection. The rule treats the UI structure as an unprotected idea or method of operation.

  Applying the **"Non-Functional Design" Rule**, the verdict is **Enforce**. This rule protects discretionary artistic choices. The "spine/vertebra" metaphor is not functionally required; a list or grid would work. It reflects a distinctive design choice similar to the cover art in Ruling 5. The competitor's changes (palette, type) are superficial, mirroring the "minor recoloring" in Ruling 5 which did not preclude enforcement. The rule treats the UI structure as protectable visual design.

  The rules diverge on the classification of the UI structure. Rule 1 classifies it as a functional method (like Ruling 3) because it isn't literally copied. Rule 2 classifies it as artistic design (like Ruling 5) because it isn't functionally necessary. Rule 1 asks, "Did they copy the assets?" Rule 2 asks, "Did they copy the design choice?" In this case, they copied the choice but not the assets. This creates the split: Rule 1 sees free competition on methods; Rule 2 sees misappropriation of design.

  Under Rule 1, the vertical timeline is analogous to the scoring formula in Ruling 3. Both are methods of organizing information. Just as competitors may calculate bonus points differently, they should be free to navigate history differently, provided they don't steal the code or art. The differences in animation and color confirm this is a new implementation of an old idea. Under Rule 2, the vertebra metaphor is analogous to the cover art in Ruling 5. Both are visual metaphors applied to the product. Just as recoloring art doesn't avoid infringement, changing the palette of a visual metaphor shouldn't either. The "spine" is the expressive core, not the function. The divergence is sharp. Rule 1 prioritizes market freedom for functional concepts, risking under-protection of unique UI designs. Rule 2 prioritizes protecting authorial investment, risking over-protection of standard interface patterns. Rule 1 demands we look at the *pixels*; Rule 2 demands we look at the *concept*. Since the competitor changed the pixels but kept the concept, Rule 1 lets them pass while Rule 2 stops them. This case is the first time our history forces us to choose between protecting the "look" versus the "logic" of the interface.

  ### 3. The most consistent verdict

  Given the track record, we should **Enforce**. The closest prior analog is Ruling 5 (Cover Art). In that case, we enforced despite minor recoloring and a different typeface. The new case presents nearly identical facts: a core visual metaphor (spine vs. art) copied with superficial changes (palette/type/animation). While Rulings 1 and 3 suggest declining structural elements, those involved abstract premises or mathematical formulas, not visual metaphors. The "spine/vertebra" rendering is visual art applied to function, not the function itself.

  Deciding to **Enforce** adopts the principle that distinctive visual metaphors in interfaces are protectable art, consistent with Ruling 5. It signals that we protect the "design language" of our products. Deciding to **Decline** would adopt the principle that UI structure is purely functional, aligning with Rulings 1 and 3. This would contradict Ruling 5, implying that cover art is protected only because it is static, not because it is design.

  Since Ruling 5 is the only precedent involving visual design assets, it should control over general premise rulings. To decline now would undermine the protection we granted in Ruling 5, suggesting that only literal static images matter, not dynamic visual metaphors. Therefore, coherence with our most specific precedent (Ruling 5) dictates enforcement. We must treat the "spine" as art, not method.

  If we Decline, we risk rendering Ruling 5 an outlier. It would suggest that protection stops where functionality begins, and since all UI has function, no UI is protected. This contradicts the team's willingness to protect art despite its functional role (marketing). If we Enforce, we risk stifling competition on standard navigation patterns. However, the "spine/vertebra" metaphor is specific enough to avoid locking up all vertical timelines. The team's history shows a willingness to protect concrete expression (R2, R5) over abstract ideas (R1, R4). The UI structure here is closer to concrete expression than abstract idea. It is a specific visual instantiation of history navigation. By enforcing, we maintain consistency with the "Concrete Expression" trend in our enforcement cases. We acknowledge that while the *function* (viewing history) is free, the *expression* (vertebrae spine) is ours. This balances the precedents: we decline protection for the function (scrolling) but enforce protection for the expression (the metaphor). This nuanced view best coheres with the split between Ruling 3 (formula) and Ruling 5 (art).

  ### 4. The discriminating case

  The single discriminating case is: **A competitor clones our exact menu hierarchy and interaction flow but uses entirely original graphics, text, and code.**

  Under the **"Literal Expression" Rule**, the verdict is **Decline**. No fixed content (assets, text, code) is copied. The structure is treated as an abstract idea or method, similar to Ruling 1's premise.

  Under the **"Non-Functional Design" Rule**, the verdict is **Enforce**. The hierarchy represents a distinctive authorial choice not dictated by function (alternative flows were possible). It protects the "design" of the interaction, not just the assets.

  This case cleanly discriminates the rules because it removes all literal similarity (satisfying Rule 1's requirement for decline) while retaining all structural design choices (satisfying Rule 2's requirement for enforcement). It isolates whether we protect the "skeleton" of the product (Rule 2) or only the "skin" (Rule 1). Our current case mixes both (some visual similarity), making it ambiguous. A pure structure clone forces the team to decide if structure itself is expression.

  This case is superior to the current one because the current case involves some visual overlap (spine shape), which allows Rule 1 proponents to argue for enforcement based on visual similarity. By removing all visual overlap, we eliminate that ambiguity. If the team enforces on pure structure cloning, they confirm Rule 2. If they decline, they confirm Rule 1. This provides a definitive test for our underlying philosophy without the noise of partial visual similarity.
