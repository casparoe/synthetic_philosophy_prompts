answer: |-
  To evaluate Updateless Decision Theory (UDT), verify these adequacy conditions:

  1.  **Puzzle Dissolution:** Must one-box in Newcomb's, smoke in Smoking Lesion, and cooperate in Prisoner's Dilemma with perfect copies. *Motivation:* Standard conditioning treats correlations as fixed history, ignoring that the decision algorithm determines outputs across logically linked instances. Updating screens off the logical dependency between choice and prediction.
  2.  **Preserved Distinctions:** Must separate causal influence (physical) from logical correlation (computational). It must distinguish an agent's actual execution from counterfactual instantiations of identical source code. *Motivation:* Conflating these leads to either spurious causation (magic) or missed coordination (defection).
  3.  **Consistency:** Must not collapse into ordinary Bayesian updating in embedded contexts where observations correlate with actions. Yet, it must permit bounded agents to approximate rational behavior. *Motivation:* Unbounded logical omniscience is impossible; naive updating breaks updatelessness by treating observations as exogenous.
  4.  **Logical-Indexical Coupling (Non-negotiable):** Must handle cases where an agent knows identical copies run in causally isolated branches but receives only one sensory stream. *Motivation:* Conditioning on "I am here" breaks logical symmetry required for coordination, leading to suboptimal policies despite identical algorithms.

  **Critical Tension:** Desiderata (2) and (4) appear jointly unsatisfiable without new semantics: preserving causal independence (no physical influence) while honoring logical correlation (outputs match) contradicts standard causality. Also, (3) tensions logical omniscience (required for updatelessness) against boundedness.

  **Evaluation:**
  | Theory | Puzzles | Distinctions | Consistency | Logical-Indexical |
  | :--- | :--- | :--- | :--- | :--- |
  | **CDT** | Fails (Two-boxes) | Pass | Pass | Fails |
  | **EDT** | Fails (Lesion) | Fails | Pass | Fails |
  | **UDT** | Pass | Pass | Struggles | Pass |

  CDT ignores logical links. EDT confuses evidence with cause. UDT satisfies conditions but lacks a complete, bounded formalization.
