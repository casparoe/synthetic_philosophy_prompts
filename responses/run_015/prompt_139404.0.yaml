answer: |-
  You are struggling because you are trying to adjudicate **property disputes** when you are actually adjudicating **social contracts**.

  Your gut is correct on almost all of these, but your working theory ("scarce + work + visible") is an economic model. It fails because it ignores the human element (consent, dignity, community). You are not a bank manager; you are a referee and a community guardian.

  Here is the principle that unifies your instincts, tight enough to read into a Discord channel or forum post.

  ### The Principle of Consensual Consequence

  > **"Losses incurred through agreed-upon risks are final. Losses incurred through subverted agency or violated dignity are reversible."**

  This principle rests on two pillars. When making a ruling, you must identify which pillar is being touched.

  1.  **The Agency Pillar (Game Actions):** Did the player lose their progress because they *chose* to risk it (PvP, crafting failure), or because another player *removed their choice* (scams, exploits, hacks)?
  2.  **The Dignity Pillar (Human Actions):** Did the action target the *avatar* (in-game asset), or the *human* behind it (harassment, humiliation, non-consensual roleplay)?

  ---

  ### Mapping Your 10 Cases to the Principle

  Here is how the principle explains your gut feelings, and where it tells you to adjust them.

  **1. The Bait-and-Switch Trade**
  *   **Verdict:** Rollback + Ban.
  *   **Clause:** **Agency (Subverted).** The victim consented to a trade, not a theft. Their agency was bypassed by deception.
  *   **Status:** **Keep.** This is the core violation of the social contract.

  **2. The Fair PvP Fight**
  *   **Verdict:** No Action.
  *   **Clause:** **Agency (Consensual).** Both players opted into the "open season" rules. The loss was a consensual risk.
  *   **Status:** **Keep.**

  **3. PvP + Harassment**
  *   **Verdict:** Action Required (Ban/Mute).
  *   **Clause:** **Dignity.** The PvP was legal (Agency), but the messaging targeted the human to drive them away (Dignity).
  *   **Status:** **Keep.** File this separately from the PvP. The PvP stands; the harassment is punished.

  **4. The Griefed Cathedral (Private vs. Recorded)**
  *   **Verdict:** Worse when recorded.
  *   **Clause:** **Dignity.** Destroying the build is an Agency violation (exploit). Recording it to mock transforms it into a Dignity violation (public humiliation).
  *   **Status:** **Keep.** Your gut is right. The recording changes the crime from property damage to psychological harm.

  **5. The Hacked Inactive Account**
  *   **Verdict:** "Something bad happened," but weak remedy.
  *   **Clause:** **Agency (Dormant).** The social contract requires active participation. An inactive player cannot consent to risk, but they also aren't suffering active agency subversion *in the moment*.
  *   **Status:** **DROP THE REMEDY.** Your gut says "something bad happened" (True: security breach), but "weaker than 1" (True: no active victim). Do not rollback items for players who don't exist in the community anymore. It creates administrative bloat for no social gain. Secure the account, log the incident, move on.

  **6. The Duping Bug**
  *   **Verdict:** Injury to the farmer.
  *   **Clause:** **Agency (Systemic).** This is "Subverted Agency" applied to the whole server. The effort-to-reward loop was broken by an exploit, not gameplay.
  *   **Status:** **Keep.** This is a "Community Integrity" ruling. You rollback the duped items to restore the value of the honest farmers' agency.

  **7. RMT Currency vs. Locked Currency**
  *   **Verdict:** RMT feels more like theft.
  *   **Clause:** **Dignity (Real World Harm).** RMT introduces real-world financial loss, which escalates a virtual problem to a human safety problem.
  *   **Status:** **DROP THE DISTINCTION.** Do not make rulings based on whether currency *can* be sold for real money. This encourages RMT (which usually violates ToS) and is impossible to verify. Treat all currency theft as **Agency (Subverted)**. If RMT is involved, ban for RMT, not for the theft value.

  **8. The Devs Giving Away Cosmetics**
  *   **Verdict:** No complaint valid.
  *   **Clause:** **Consensual Risk (Administrative).** Players consent to the devs changing the game. This is not player-vs-player subversion.
  *   **Status:** **Keep.**

  **9. The NPC Kill (Server Lock)**
  *   **Verdict:** Real interference.
  *   **Clause:** **Agency (Community).** This subverts the agency of *everyone* on the server, not just one victim. It breaks the shared environment.
  *   **Status:** **Keep.** This is closer to Case 6 (Duping) than Case 1 (Theft).

  **10. Text MUD Sexual Act vs. Haircut Mockery**
  *   **Verdict:** Sexual act = Harm. Haircut = No harm.
  *   **Clause:** **Dignity.** Forcing a character to perform sexual acts violates bodily autonomy (even virtually). Mocking a haircut is mild insult.
  *   **Status:** **Keep.** This is the purest example of the Dignity Pillar.

  ---

  ### Which Gut Calls to Drop?

  To make this rule tight, you must sacrifice two intuitions:

  1.  **Drop the "Inactive Hack" Remedy (Case 5).** It feels like theft, but without an active participant, there is no social contract to repair. Fixing it helps no one. Trust your "weaker than 1" feeling more than your "something bad happened" feeling.
  2.  **Drop the "RMT Value" Distinction (Case 7).** It feels like "more theft," but adjudicating based on real-world value creates a slippery slope where rich players' time is worth more than poor players'. Treat all in-game theft as equal under the Agency Pillar. Punish the *act* of RMT separately if it violates server rules.

  ---

  ### Predictions on New Cases

  Here is how the **Principle of Consensual Consequence** predicts rulings on your hypotheticals:

  **1. A single-player permadeath run that no one will ever see.**
  *   **Ruling:** No intervention.
  *   **Why:** There is no **Social Contract**. If no one else sees it or interacts with it, it is not a community matter. It is a private interaction between a player and code. Unless the death was caused by a server crash (Dev error), it is a Consensual Risk.

  **2. A world built from a seed that will never be generated again.**
  *   **Ruling:** Intervention if destroyed by a player; No intervention if lost to a crash.
  *   **Why:** If a player destroys it via exploit, it is **Agency (Subverted)**. The uniqueness of the seed amplifies the value of the effort, but the principle remains the same. If the server crashes, it is a Dev/Technical failure (Case 8), not a player violation.

  **3. A companion character deleted by a patch.**
  *   **Ruling:** No recourse.
  *   **Why:** **Consensual Risk (Administrative).** Players accept that devs change the software. This is Case 8 (Cosmetics). Emotional attachment does not override the admin's right to modify the code, provided it wasn't targeted malice.

  **4. Text-only vs. Full VR with Haptics.**
  *   **Ruling:** Same *verdict*, scaled *severity*.
  *   **Why:** Your head is right (it shouldn't matter), but your chest is also right (it obviously does).
  *   **The Principle:** The **Dignity Pillar** scales with *immersion*.
      *   In a Text MUD, forced sexual text is a violation of *imaginative* autonomy.
      *   In VR, forced haptic sensation is a violation of *sensory* autonomy.
      *   **Ruling:** Both are bannable offenses under the Dignity Pillar. However, the VR case warrants a stricter penalty (permanent hardware ID ban vs. account ban) because the psychological harm is objectively higher. The *category* of harm is the same; the *magnitude* is different.

  ### How to Read This in a Ruling

  When you post a decision, do not explain the philosophy. Explain the contract.

  **For a Scam (Case 1):**
  > "This server operates on a social contract of fair trade. You did not consent to lose your items; your consent was bypassed by deception. This violates the Integrity of Effort. Rollback issued."

  **For Harassment (Case 3/4):**
  > "PvP is consensual. Humiliation is not. Taking this beyond the game to target the player violates the Safety of Participants. Ban issued."

  **For PvP Loss (Case 2):**
  > "You opted into open season. This was a consensual risk. The loss stands."

  ### Summary
  Your gut is tracking **Consent** and **Dignity**, not **Property**.
  *   If they agreed to the risk, let it lie.
  *   If you tricked them, fix it.
  *   If you hurt the human, punish yourself.

  Stop trying to measure the value of the item. Start measuring the violation of the player.
