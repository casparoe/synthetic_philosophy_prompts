  **Why I built it that way**

  The pantoum's recursive structure mirrors the philosophical claim: the sensory report (lines 1 and 3 of the first stanza, cycling through positions 2 and 4) remains byte-identical throughout, while the attitudinal lines shift around it. This enforces the distinction between sensation intensity and unpleasantness structurally; the sensation never changes, even as the stance toward it is clarified.

  By ending on the opening line, the poem refuses resolution. We return to the bare sensory fact after hearing the motivation to stop, leaving the relationship between "badness" and "avoidance" unresolved. The poem doesn't argue that N is broken or that badness is irrelevant; it simply presents the case where the two come apart.

  I avoided metaphors of numbness or dissociation to prevent implying hidden suffering. N's desire for anaesthetic is framed as a clear preference, not a reflex. The concrete setting (thumb, scale, chart) grounds the thought experiment, resisting the temptation to abstract the pain into pure theory. The form does the work: the sensation is the constant frame; the "badness" is the variable that never quite appears.
