answer: |-
  To analyze the killing of Marius, I deploy a distinction between Moral Individualism and Collectivist Conservation Ethics. Moral Individualism holds that moral status supervenes on the properties of individual beings—sentience, autonomy, or being a subject-of-a-life. Collectivist Conservation locates primary value in populations, species, or genetic diversity, treating individuals as interchangeable vessels for those higher-order goods. The version of the speciesism critique I employ is not merely the preference for humans over animals, but the arbitrary privileging of morphological or taxonomic categories over relevant capacities. However, I must weigh this against rival explanations for moral intuition: Relational Ethics, which grounds duties in specific interactions (custodian/captive), and Aesthetic Bias, which privileges charisma over moral worth. The load-bearing distinction here is between killing based on *individual interests* versus killing based on *population management*.

  The zoo's justification assigns Marius a value that is not a property of him at all but a function of his genetic profile relative to a managed population: the herd-slot conception. Standard individualist positions cannot represent this as a moral reason. For a rights view, Marius is a subject-of-a-life who cannot be treated as a mere means to genetic diversity; his interest in continuing to live trumps the abstract value of the gene pool. Utilitarianism offers a nuanced exception via the replaceability argument: if Marius is painlessly killed and replaced by a genetically superior counterpart who experiences equivalent welfare, aggregate utility may remain stable. However, this requires assuming lives are fungible containers of welfare, a premise many individualists reject. The zoo's reasoning belongs squarely to the collectivist conservation ethic. Consequently, the speciesism critique does not fully engage the core conflict; the zoo was not privileging humans over giraffes, but the collective over the individual. The critique talks past the case if it assumes the conflict is species-based rather than ontology-based.

  Regarding the outrage: The disparity between fury over Marius and indifference to slaughtered pigs suggests literal speciesism (charisma bias). However, a relational explanation explains more variance. The public perceives a betrayal of trust; zoos present themselves as sanctuaries, not slaughterhouses. Killing a dependent animal under care violates specific relational duties that do not apply to wild deer or farmed pigs. This does not damage the speciesism critique but relocates it: the prejudice is not merely against pigs, but in favor of animals within specific human-defined relationships of care. The feeding of the body to lions spiked horror not because carnivory is wrong, but because the ritualized dissection violated norms of dignity owed to a former charge.

  The breeding wrinkle invokes the non-identity problem. Marius existed only because of the program that killed him. Consistent individualists face a dilemma: forbid the killing, which implies forbidding the breeding program that created the surplus, or accept the killing as the cost of existence. If the individualist forbids the breeding, they undermine the conservation goal; if they permit the breeding but forbid the killing, they create impossible conditions for zoos. This is not necessarily a reductio, but it reveals individualism's difficulty in handling created dependencies. The individualist is committed to the claim that bringing a being into existence does not justify killing them when they become inconvenient. This commitment is credible if one holds that existence is not a benefit that can be weighed against death, but it renders modern conservation zoos morally impermissible.

  Does the case confirm the speciesism critique? It reveals that the critique is aimed at a different target. The primary wrong was not species membership but the violation of individual standing within a custodial relationship. My roommate's claim—that objecting to Marius entails objecting to culling deer or eating meat—survives only if the objection is grounded strictly in the sanctity of life regardless of context. If the objection is relational (betrayal of custody), the roommate is mistaken. We owe different duties to animals we have incarcerated than to wild populations or agricultural commodities. The supervisor's claim—that this is a reductio of individualism—is partially correct. It shows individualism is incompatible with modern conservation management which relies on surplus culling. If one accepts conservation goals as morally mandatory, individualism fails. If one accepts individualism as absolute, conservation zoos are morally impermissible. The case forces a choice rather than disproving one side internally.

  Finally, the lens is silent on several crucial matters. Moral Individualism does not determine whether zoos should exist; it only regulates how treated animals are treated if they do. It offers no verdict on who had standing to decide Marius's fate (the zoo, the state, the public). It is largely silent on the public dissection versus private disposal, provided respect for remains is maintained, though dignity concerns might arise. It cannot adjudicate whether the conservation goal itself was worth pursuing, as that is a collectivist value outside individualist calculus. The framework dictates that Marius's interests matter, but not how to weigh them against the existence of the institution that created him. The case is not an anomaly the critique never anticipated, but it demonstrates that the critique is insufficient for resolving conflicts between individual welfare and collective conservation goals. It confirms that our moral intuitions are hybrid: individualist in custody, collectivist in conservation, and speciesist in charisma. The philosophical work lies not in choosing one, but in acknowledging the contradiction.
