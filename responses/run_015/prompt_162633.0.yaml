      *   *Break 2: Additivity/Summation.* Mass isn't strictly additive (binding energy, $E=mc^2$). In GR, local energy density is tricky. Consciousness definitely doesn't feel additive (1 million neurons $\neq$ 1 million tiny minds). The "Combination Problem" is precisely about *unity*, not summation.
