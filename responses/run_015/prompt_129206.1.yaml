answer: |-
  **Exam Question**

  **Question 1**

  Consider the following logical scenario. A Proponent offers a Skeptic two premises: (A) 'P' and (B) 'If P, then Q'. The Proponent argues that Q follows. The Skeptic accepts A and B as true but refuses to accept Q. The Proponent then adds a new premise (C): 'If A and B are true, then Q is true'. The Skeptic accepts C but still refuses to accept Q, demanding yet another conditional linking A, B, and C to Q. This generates an infinite regress of premises.

  To halt this, the Proponent abandons adding premises and instead invokes a rule of inference: 'From A and B, one may infer Q'. The Skeptic replies that while he understands the rule, he sees no reason to *follow* it, demanding a justification for the rule itself.

  (a) Explain why distinguishing between premises (propositions) and rules (instructions) fails to fully satisfy the Skeptic's demand in this revised scenario. Discuss the nature of the circularity involved if one justifies the rule by using it, contrasting this with the circularity of adding the rule's statement to the premise set. What kind of non-evidential support, if any, can a rule of inference receive? (10 marks)

  (b) Imagine an agent who is 'conditionally saturated'. This agent accepts every true conditional linking their total evidence to a conclusion, including the conditional 'If my evidence is E, then I should conclude Q', yet they never actually perform the inference to Q. Is this agent irrational? Specify whether the defect lies in their justificatory state or in their agency/application of norms. (5 marks)

  (c) Reconstruct the Skeptic's demand against a non-deductive norm, such as the probabilistic norm of conditionalization (updating beliefs by conditioning on new evidence). Does the regress generalize? Based on this, deliver a verdict: Is the Skeptic's demand a reductio of the demand itself, or does it reveal a fundamental limitation in all normative systems? You must take a definite position. (10 marks)

  ***

  **Model Answer**

  The distinction between premises and rules is the standard initial response to the regress, yet it proves insufficient against a determined Skeptic. Stating that premises are truth-apt propositions while rules are directives for transition merely categorizes the elements; it does not explain why an agent is compelled to move from the former to the latter. When the Proponent shifts to offering a rule ('From A and B, infer Q'), the Skeptic's demand shifts from 'Give me more truth' to 'Give me a reason to act'. If the Proponent justifies the rule by arguing 'This rule is valid, therefore you should use it', they are inevitably using the very rule in question to validate it.

  This generates a circularity, but it is distinct from the vicious circularity of premise-loading. Adding the rule's statement to the premise set (e.g., 'Rule R is valid') creates a question-begging argument where the conclusion is covertly present in the premises. However, using a rule to vindicate itself is not necessarily vicious; it can be 'rule-circularity'. A rule cannot be validated from a standpoint outside all reasoning, as any validation would itself require reasoning. Therefore, the support a rule receives cannot be evidential, like a proposition. Instead, it must be pragmatic or constitutive. We accept modus ponens not because we have proved it true via neutral premises, but because it is constitutive of what we mean by 'inference'. To demand a reason for the rule is to demand a reason for reasoning itself, which is incoherent. The rule is not a link in the chain of justification; it is the tension holding the chain together.

  This distinction becomes sharp when analyzing the 'conditionally saturated' agent. This agent possesses all the correct justificatory states: they believe the evidence, they believe the conditional linking evidence to conclusion, and they believe they ought to conclude. Yet, they do not infer. This agent is irrational, but the defect is not epistemic; it is agential. They suffer from a form of inferential akrasia. Justification concerns the static relations between propositions; inference is a dynamic performance. The saturated agent treats the norm of inference as just another object of belief rather than a constraint on their cognitive activity. The defect lies in the application of the rule to the case. They have the 'map' (the conditional) but refuse to 'walk' (the inference). This demonstrates that the regress of justification is distinct from the regress of application. One can be justified in believing Q without having performed the inference, but one cannot be rational while systematically refusing to perform inferences one acknowledges as mandated. The saturated agent highlights that logic is not merely a structure of truths but a discipline of thought.

  Finally, we must test whether this Skeptical demand is specific to deduction or universal. Consider the probabilistic norm of conditionalization: upon learning evidence E, one's new credence in H should equal the old conditional credence in H given E. A Skeptic could accept the evidence E, accept the probabilistic link, yet refuse to update their credence, demanding a higher-order probability justifying the update. If they demand a probabilistic justification for updating probabilities, the regress generalizes immediately. There is no 'super-probability' to validate the rules of probability without presupposing them.

  Since the demand generates a regress in both deductive and probabilistic contexts, we must deliver a verdict. The demand is not a discovery of a flaw in deduction, but a reductio of the Skeptic's requirement for explicit justification for every normative transition. If every norm required a further norm to authorize its application, no reasoning could ever begin. Therefore, the regress shows that normative systems must contain primitive rules that are self-enforcing not by proof, but by being the conditions of possibility for the system itself. The Skeptic's demand fails because it treats constitutive norms as if they were optional premises. The correct position is that the regress reveals a fundamental feature of rationality: we must inhabit our rules of inference, not merely observe them. To ask for a reason to follow logic is to step outside the space of reasons, where no answer can be heard.

  ***

  **Marking Scheme**

  **Total Marks: 25**

  **1. Limits of the Premise/Rule Distinction (0–4 marks)**
  *   **Award:** Credit for noting that distinguishing categories does not explain *compulsion* to follow the rule. Top marks require stating that the Skeptic's demand shifts from truth to action.
  *   **Common Error:** Stopping at "rules aren't propositions" and claiming the problem is solved. This caps this section at 2 marks.

  **2. Analysis of Circularity and Rule Support (0–6 marks)**
  *   **Award:** Clear distinction between vicious premise-circularity and benign/vindicatory rule-circularity. Must identify that rule support is constitutive/pragmatic, not evidential.
  *   **Common Error:** Treating all circularity as equally vicious or failing to specify the *type* of support (constitutive) rules receive.

  **3. Diagnosis of the Conditionally Saturated Agent (0–5 marks)**
  *   **Award:** Identifying the defect as agential (inferential akrasia) rather than justificatory. Must distinguish static belief states from dynamic performance.
  *   **Common Error:** Claiming the agent is fully rational because they hold the right beliefs, or claiming they lack justification rather than will.

  **4. Generalization to Non-Deductive Norms (0–5 marks)**
  *   **Award:** Successful reconstruction of the regress against probabilistic updating (or similar). Must show the structural identity between the deductive and probabilistic demand.
  *   **Common Error:** Failing to construct the parallel regress or claiming probability escapes the problem because it is "inductive."

  **5. Final Verdict on Normativity (0–5 marks)**
  *   **Award:** Definite position taken (e.g., demand is a reductio). Must argue that norms are primitive constraints, not optional premises.
  *   **Common Error:** Suspended judgment ("philosophers disagree") or concluding the problem is unsolvable. The question requires a verdict.

  **Differentiation Criteria**
  *   **First-Class (20–25):** Seamlessly integrates the three cruxes. Explicitly articulates *why* rule-circularity is vindicatory rather than vicious. Treats the saturated agent as a failure of *agency* rather than knowledge. Delivers a sharp, defended verdict on generalization without hedging.
  *   **Upper-Second (15–19):** Correctly identifies the premise/rule distinction but struggles to explain why the regress relocates. Identifies the agent's defect but conflates justification with performance. Generalizes the regress but offers a tentative or indecisive verdict.
  *   **Recapitulation Cap:** An answer that merely summarizes Carroll's dialogue or states "premises are not rules" without analyzing the *relocated* regress or the *agent's* psychology cannot score above 14 marks (Lower-Second), regardless of clarity.
