answer: |-
  **Title:** The Elision of Utility: Why Coherence Arguments Do Not Fully Justify Expected Utility Maximization

  **Introduction**

  In graduate seminars on decision theory, a standard narrative often prevails: rationality is coherence, and coherence is mathematically modeled by expected utility maximization (EUM). The pedagogical pitch is seductive in its simplicity. We are told that if an agent's degrees of belief violate the probability axioms, they are susceptible to a Dutch Book (a set of bets guaranteeing a loss). If their preferences violate the von Neumann-Morgenstern (VNM) axioms, they are susceptible to money pumps. Therefore, to avoid pragmatic self-defeat, one must be coherent, and to be coherent is to maximize expected utility.

  However, as you have suspected, this narrative relies on a significant conflation. There is a structural gap between the Dutch Book arguments that justify probabilistic credences and the representation theorems that justify utility functions. While both are often grouped under the umbrella of "coherence arguments," they do not bear the same justificatory weight, nor do they derive EUM from the same premises. Specifically, the standard Dutch Book argument targets the consistency of *beliefs* given a fixed valuation of stakes, whereas EUM requires a specific structure of *valuation* itself.

  This essay argues that your intuition is correct: there is a real and philosophically significant gap in the standard pitch. Coherence arguments regarding credences (Dutch Book) cannot justify the utility component of EUM without smuggling in substantive normative assumptions about preference structure that go beyond mere logical consistency. While unified frameworks exist (such as Ramsey's or de Finetti's), they do not close the gap; they merely relocate it by assuming linearity of value. Consequently, the claim that "coherence arguments justify EUM" is technically false. Coherence arguments justify Probabilism; separate, substantive normative arguments are required to justify the Utility component.

  **The Dutch Book Argument and its Limits**

  To understand the gap, we must first rigorously define what the Dutch Book Argument (DBA) actually achieves. The classic DBA, as formalized by Kemeny (1955) and Lewis (1978), demonstrates that if an agent's betting quotients (credences) violate the axioms of probability, there exists a set of bets acceptable to the agent that guarantees a net monetary loss.

  Crucially, the DBA operates ceteris paribus regarding utility. It assumes that the agent values money linearly or, more precisely, that the utility of the stakes is additive. If I accept a bet on $A$ at price $\$x$ and a bet on $\neg A$ at price $\$y$, the DBA shows that if $x + y > 1$ (normalized), I lose money. But "losing money" is only irrational if losing $\$z$ is strictly dispreferred to keeping $\$z$, and if the disutility of the loss aggregates linearly across the bets.

  The DBA successfully justifies *Probabilism* (the claim that rational credences satisfy the probability calculus). It does not, however, justify *Expected Utility Maximization*. An agent can have perfectly coherent probabilistic credences yet fail to be an expected utility maximizer. For instance, an agent might satisfy the probability axioms but have intransitive preferences over outcomes (preferring $A$ to $B$, $B$ to $C$, and $C$ to $A$). Such an agent is immune to a standard Dutch Book on their beliefs but is arguably irrational due to their preferences. Conversely, an agent could have coherent preferences but non-probabilistic beliefs (if they refuse to bet).

  The gap you sensed arises here: The DBA punishes inconsistency in *mapping beliefs to prices*, but it takes the *value of the prices* as given. It tells you how to weight your beliefs, but it tells you nothing about how to weight the outcomes those beliefs are about.

  **The Representation Theorems and the "Coherence" Label**

  If the DBA only justifies Probabilism, where does the Utility function come from? In the standard pitch, this is often glossed over by lumping the VNM or Savage representation theorems in with the Dutch Book stuff under the label "coherence."

  The VNM theorem states that if an agent's preferences over lotteries satisfy four axioms (Completeness, Transitivity, Independence, Continuity), then those preferences can be represented as maximizing expected utility. Savage's framework extends this to derive both probability and utility from preferences over acts.

  Proponents of the standard pitch argue that violating these axioms makes one susceptible to money pumps (the preference analogue to the Dutch Book). However, there is a disanalogy. Violating Transitivity clearly leads to a money pump (a cycle of trades leaving the agent poorer). But violating the Independence axiom (the core of EUM that distinguishes it from other utility theories) does not lead to a sure loss of money in the same pragmatic sense. It leads to a violation of a specific structural constraint on how risk is evaluated.

  To label the Independence axiom a requirement of "coherence" is to stretch the term. Probabilistic coherence is akin to logical consistency (believing $A$ and $\neg A$ is contradictory). Preferential coherence (Independence) is akin to a specific normative stance on risk. An agent who violates Independence (e.g., an Allais paradox chooser) is not logically inconsistent; they simply weigh the certainty of an outcome differently than EUM prescribes. By labeling both "coherence," the standard pitch obscures the fact that justifying EUM requires justifying the Independence axiom, which the Dutch Book argument does not do.

  **Attempted Bridges: Ramsey and de Finetti**

  You mentioned de Finetti's previsions and Ramsey's work as potential bridges. It is true that these frameworks attempt to derive probability and utility simultaneously from betting behavior, rather than treating them separately.

  Frank Ramsey (1926) proposed deriving probability from preferences over propositions, assuming the existence of an "ethically neutral" proposition to serve as a utility standard. Bruno de Finetti argued that coherent previsions (betting prices) imply both probabilistic beliefs and a linear utility function over money.

  However, these approaches do not close the gap; they assume it away. De Finetti's coherence argument relies heavily on the assumption that the agent's utility is linear in the numeraire (usually money). If an agent has a concave utility function (risk aversion), a set of bets that looks like a Dutch Book in monetary terms might not be a Dutch Book in utility terms. To claim that the agent *should* avoid the monetary loss, de Finetti must presuppose that the agent *should* value money linearly.

  But why should an agent value money linearly? That is a claim about the utility function. If the justification for EUM rests on the avoidance of Dutch Books, and the avoidance of Dutch Books rests on the assumption of linear utility, then the argument is circular. It assumes a specific utility structure to prove that agents must maximize expected utility.

  Similarly, Ramsey's "ethically neutral" proposition is a theoretical ideal that is rarely, if ever, instantiated in real-world decision contexts. To apply Ramsey's method, one must already be able to identify outcomes that are equivalent in utility, which presupposes a grasp of the utility structure one is trying to derive.

  Therefore, the unified approaches do not bridge the gap between "don't be logically inconsistent" and "maximize expected utility." They instead show that *if* you accept certain structural constraints on value (linearity, independence), *then* you must act as an EUM agent. But the justification for those structural constraints does not come from coherence alone; it comes from substantive normative commitments.

  **The Normative Gap**

  The core of the issue is the definition of "coherence." In logic, coherence is negative: it is the absence of contradiction. In decision theory, the standard pitch tries to paint EUM as the absence of pragmatic contradiction (sure loss).

  However, EUM is a positive theory of value aggregation. It claims that the value of a gamble is the sum of the values of the outcomes weighted by their probabilities. This is a substantive claim about the nature of the good. One can be coherent (in the logical sense) while rejecting this aggregation. For example, a maximin agent (who cares only about the worst-case scenario) can have coherent beliefs and transitive preferences. They cannot be Dutch Booked on their beliefs, and they cannot be money-pumped on their preferences (if transitive). Yet, they are not EUM maximizers.

  If the standard pitch claims that coherence *justifies* EUM, it implies that the maximin agent is incoherent. But in what sense? They are not susceptible to sure loss. They are not logically inconsistent. They simply reject the Independence axiom. To call them "incoherent" is to beg the question by defining rationality as EUM from the start.

  The gap you are sensing is the distance between *instrumental rationality* (taking the means to one's ends without self-sabotage) and *substantive rationality* (having ends that satisfy specific structural axioms). Dutch Book arguments support instrumental rationality regarding belief. They do not support the substantive claims required for EUM regarding preference.

  **Conclusion**

  The standard seminar pitch that "coherence arguments justify expected utility maximization" is an elliptical convenience that fails under philosophical scrutiny. It conflates two distinct projects: the justification of probabilistic credences (via Dutch Book) and the justification of utility structures (via Representation Theorems).

  Your intuition that there is a gap is correct. The Dutch Book argument demonstrates that incoherent *beliefs* lead to sure loss, but it is silent on the structure of *preferences* over outcomes. To move from probabilistic coherence to EUM, one must import additional axioms (like Independence) that are not justified by the avoidance of sure loss in the same way probabilistic axioms are. Unified accounts like Ramsey's or de Finetti's do not solve this; they merely embed the utility assumptions into the definition of coherence, rendering the argument circular for anyone who does not already accept linear utility aggregation.

  Therefore, we must conclude that coherence arguments alone do not justify Expected Utility Maximization. They justify Probabilism. Justifying EUM requires a hybrid argument: coherence arguments for the belief component, and separate normative arguments (perhaps based on risk-neutral valuation or specific conceptions of rationality) for the utility component. To teach otherwise is to obscure the substantive normative commitments that EUM requires, presenting a controversial theory of value as a mere theorem of logical consistency. You are right to be bothered by the gap; it is not a feature of your understanding, but a bug in the standard narrative.
