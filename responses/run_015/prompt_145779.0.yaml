answer: |-
  The residue that fails to translate into cryptographic-provenance terms is an indication that the intentionalist debate relies on an imprecise concept of "meaning."

  The core dispute isolates whether semantic validation requires reconstructing the chain-of-custody to the signer's private key state or relies exclusively on payload analysis of the verified hash. The intentionalist position argues that the digital signature binds the payload to the signer's metadata, making any deviation from the original signing environment a validation error that corrupts the semantic output. The anti-intentionalist position argues that once hash verification confirms integrity, the signer's metadata is cryptographically irrelevant, and the payload stands as an autonomous object subject only to local analysis without reference to the origin identity.

  **Strong Anti-Intentionalism**
  *   **Translates Cleanly:** The published work maps perfectly to a broadcasted payload where validity is determined solely by successful hash verification against the public key; the "Intentional Fallacy" corresponds to the error of prioritizing unverified signer metadata over the integrity of the received packet.
  *   **Requires Distortion:** Equating "interpretation" with "payload analysis" distorts the forensics term, as payload analysis in provenance models seeks bit-perfect reproduction of the original state rather than the generation of semantic variance allowed in literary reading.
  *   **No Analog:** The normative claim that the signer *ought* to be ignored has no cryptographic equivalent, as provenance frameworks are descriptive of integrity rather than prescriptive of interpretive authority, and the aesthetic experience of the payload cannot be hashed.

  **Moderate Intentionalism**
  *   **Translates Cleanly:** Authorial intent maps to the signer's private key state at the moment of signing, establishing a chain-of-custody that constrains valid interpretations to those compatible with the original signature verification.
  *   **Requires Distortion:** Mapping "meaning" to "signature validation" implies a binary valid/invalid status for interpretations, whereas literary intentionalism often allows for probabilistic or layered understanding that a cryptographic handshake does not support.
  *   **No Analog:** The phenomenological sense of being addressed by the signer lacks a provenance equivalent, as cryptographic verification confirms origin without transmitting the subjective authority or communicative intent behind the key usage.

  **Emergent Reader-Community View**
  *   **Translates Cleanly:** Community interpretation maps to a distributed consensus mechanism where multiple nodes validate the payload differently, effectively creating a forked chain where local context determines the valid state of the data.
  *   **Requires Distortion:** In cryptography, a fork usually indicates a breach of integrity or a disagreement on truth, whereas in this hermeneutic model, divergent readings are viewed as additive rather than contradictory failures of consensus.
  *   **No Analog:** The temporal evolution of meaning over generations has no analog in immutable ledger systems, where the chain-of-custody is fixed historically and cannot be retroactively updated by future nodes without breaking the hash history.

  **Residue Report**
  The gaps exposed by this mapping demonstrate that parts of the original debate were never as conceptually precise as they appeared, specifically regarding whether "meaning" functions as a verifiable hash bound to a specific chain-of-custody or as a mutable protocol executed by the receiver. The inability to model normative authority and phenomenological address within a provenance framework indicates that the literary debate conflates data integrity with semantic valuation, relying on a definition of "meaning" that exceeds the capacity of any integrity-based verification model to capture.
