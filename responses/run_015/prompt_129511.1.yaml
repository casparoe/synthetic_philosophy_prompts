      *(Row 6 - Task Identity)*: "If the channel changes the signal, and the signal defines the optimization, aren't you training on different tasks? How do you claim equivalence?"
      *(Row 7 - Actionability)*: "This is a nice frame, but does it change how we tune the PPO clip range or sample the RM tomorrow?"
      *(Row 8 - Semantics)*: "Isn't this just renaming 'reward hacking' to 'bad channel'?"

      *Looks solid.* Now, write the replies and soft spots.

      *Hope nobody asks:* "If process supervision is the ground truth, why does outcome supervision often generalize better to out-of-distribution tasks?" (Implies process labels are overfitting/biased).

      *One sentence deflection:* "That suggests process labels encode human bias rather than ground truth, which is exactly why we need to understand the channel properties rather than assuming one is superior." (Wait, that's too long). "That suggests process labels encode human priors that regularize poorly, which is why channel fidelity isn't the only metric." -> "It suggests process labels encode human priors that regularize poorly, meaning channel fidelity trades off against generalization."

      *Let's tighten the one sentence.* "It suggests process labels encode human priors that regularize poorly, meaning channel fidelity trades off against generalization."

