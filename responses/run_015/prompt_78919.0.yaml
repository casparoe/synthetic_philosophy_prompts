answer: |-
  You have identified the precise fault line. Your characters talk past one another because they are arguing from different categories of judgment, even though they appear to be arguing about the same thing (success).

  Here is the conceptual sorting you requested, structured to help you calibrate the dialogue and internal monologues of your novel.

  ### 1. The Law of Jante: A Norm of Epistemic Humility
  You are correct that Jante is not primarily a restriction on action, but on *self-assessment*. It is not "Do not succeed"; it is "Do not think you are anyone special *because* you succeeded."

  *   **What kind of norm is this?** It is a norm of **ontological equality**. It posits that while circumstances (wealth, skill, luck) may vary, human *being* does not. Therefore, to infer a difference in *being* from a difference in *circumstance* is a category error—a lie.
  *   **Can it be obeyed at will?** No. This is the source of your characters' friction. You can obey a rule of action (e.g., "do not shout") at will. You cannot obey a rule of thought ("do not feel superior") at will, because feelings and self-perceptions are not fully voluntary.
  *   **The Consequence:** Because it cannot be obeyed at will, Jante demands **performance**. One must perform humility even if one feels pride. This creates a culture of secrecy. The protagonist, returning from America, likely believes she has shed this performance. The town sees her success not as a crime, but her *acknowledgment* of that success as a change in her status as a human being as the crime.
  *   **For the Novel:** When the town speaks to her, they are not attacking her bank account; they are attacking her *epistemology*. They are asking: "Do you actually believe you are better than us, or are you just pretending to be normal?" She hears them attacking her achievement.

  ### 2. Tall-Poppy Syndrome: A Sanction on Distinction
  Tall-Poppy Syndrome is often conflated with Jante, but conceptually it is distinct. Jante is preventative (internalized); Tall-Poppy is punitive (social).

  *   **Success vs. Display:** It is a sanction on **distinction**, not necessarily success. Success becomes a "tall poppy" only when it disrupts the horizontal solidarity of the group.
  *   **The Mechanism:** If you succeed but attribute it to luck, or pour the wealth back into the community, you may remain "one of us." If you succeed and claim it as evidence of your unique agency, you become a target.
  *   **For the Novel:** The town does not necessarily envy her prosperity; they resent her *separation*. If she returns and acts as though she is still subject to the same local logic as everyone else, she survives. If she acts as though her American success places her outside their local jurisdiction (e.g., offering to pay for things in a way that solves problems money shouldn't solve), she is cut. The sanction is on the *claim to exemption*.

  ### 3. The Shared Premise: Worth as Rank
  This is your most profound insight. You ask if the American Dream and the Law of Jante share the premise that a person's worth is a matter of rank.

  **The answer is yes, but inversely.**

  *   **The American Dream:** Worth is **vertical**. It is cumulative. You *become* more valuable through achievement. Success is revelatory; it shows the world who you truly are (a winner, a self-made person).
  *   **The Law of Jante:** Worth is **horizontal**. It is static. You *remain* the same value regardless of achievement. Success is incidental; it shows the world nothing about your soul.
  *   **The Shared Ground:** Both systems agree that **success is the relevant metric for negotiating human value.** They are both obsessed with the same currency.
      *   The American says: "I have more currency, therefore I am more."
      *   The Jante adherent says: "You have more currency, but you are not more."
      *   *Crucially:* Neither says, "This currency is irrelevant."

  **The Conceptual Trap:**
  If this is true, your protagonist has not escaped the town's value system; she has merely won the game they refuse to acknowledge playing. She believes she has moved from a culture of *equality* to a culture of *merit*. But if both cultures define the human being by their relationship to success, she is still trapped in the same conceptual cage.

  ### 4. Why They Talk Past Each Other
  Your characters are quarreling because they are locating the "sin" in different places.

  *   **The Protagonist (American Dream):** She views success as **Agency**.
      *   *Her argument:* "I worked, I sacrificed, I achieved. This is my story."
      *   *Her blind spot:* She thinks she is talking about *history*.
  *   **The Town (Jante/Tall-Poppy):** They view success as **Relation**.
      *   *Their argument:* "You are here, with us, in the dirt. Do not pretend the stars belong to you."
      *   *Their blind spot:* They think they are talking about *truth*.

  **The Resolution for the Book:**
  The quarrel is not between two cultures (Scandinavia vs. America). It is within the modern conception of the self.
  *   The American Dream says the Self is a **Project** (to be built).
  *   The Law of Jante says the Self is a **Given** (to be accepted).

  When they argue about the funeral, or the money, or the future, the protagonist is arguing about *what she has done*. The town is arguing about *who she thinks she is*.

  If you want the tension to snap, have a character point out that her need to prove she is "successful" is just as obsessive as their need to prove she is "ordinary." Both are fixated on rank. She wants to be at the top; they want to keep her at the middle. Neither is willing to say, "It does not matter."

  That is the conceptual tragedy: They are all measuring the soul with a ruler, they just disagree on the length.
