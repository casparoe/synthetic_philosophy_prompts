  1. First, ask them where they found the claim and whether they'd still hold it if their political tribe disagreed. Then, press on whether they can articulate the specific evidence without mentioning who benefits or who loses.
  2. If they can't separate the evidence from the social outcome, stop there and mark it as wrong-kind reasoning. However, if their social positioning aligns with the evidence but they struggle to explain why, hand it over to group judgement for those tricky hybrid cases.
  3. Take the dieter who spots a confounding variable in a nutrition paper; they pass because their doubt stems from methodological critique rather than lifestyle protection. This shows they're tracking the evidence even if the conclusion suits their desire to eat cake.
  4. Your neighbour fails because she understands the climate data but rejects it primarily because she thinks universities are corrupt. Her belief is anchored to institutional distrust rather than the actual measurements, so she's holding it for the wrong kind of reason.
  5. This procedure can't settle deep philosophical disputes about what counts as evidence, and it will misfire when someone's trauma makes them rightly distrustful of official sources. You'll need to accept that some false negatives are the cost of keeping the group running smoothly.
