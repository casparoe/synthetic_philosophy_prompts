          *   *Key distinction:* They presuppose reliability, not necessarily the transmissibility of the *qualia* of the experience.

      *   **Question 2: Transmissible Judgement vs. Weaker Evidence?**
          *   This is the crux.
          *   *The Skeptic's view (Weaker):* The critic tells me about *my* future reaction or the *features* present. "This has complex cinematography" (feature) vs. "This is beautiful" (judgement).
          *   *The Friend's view (Stronger):* "This is good" is a fact about the object, transmitted like "Water is H2O."
          *   *Analysis:* The "Pessimist" view (Kantian) suggests aesthetic judgment is autonomous. You must feel the pleasure yourself. Trusting someone else bypasses the necessary mental state.
          *   *Synthesis:* Relying on a critic works best as a *prediction of experience* ("You will like this") rather than a *conferment of value* ("This is good"). But in practice, we conflate them.

      *   **Question 3: Format Matters (Rating vs. Review)?**
          *   *Bare Rating:* Treats value as a property (like weight). Implies strong objectivity. Encourages the Friend's view.
          *   *Reasoned Review:* Invites the reader to see *why*. It offers reasons, not just conclusions. It respects the Skeptic's view by guiding attention rather than dictating verdict.
          *   *Implication:* A review asks you to verify; a rating asks you to obey.

      *   **Question 4: "Worth Seeing" vs. "Is Good"?**
          *   *Worth Seeing:* Relational/Instrumental. Good *for you*, or good *for the culture*. Compatible with testimony.
          *   *Is Good:* Intrinsic/Categorical. Claims objective status.
          *   *The Gap:* You can know something is "worth seeing" (culturally significant, technically proficient) without knowing it is "good" (aesthetically moving) until you see it.
