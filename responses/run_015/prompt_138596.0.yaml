answer: |-
  This is a classic philosophical problem known as **the problem of aesthetic testimony**. It sits at the intersection of epistemology (how we know things) and aesthetics (the nature of beauty and value).

  Your friend is taking an **Optimist** stance: aesthetic value is a fact about the world that can be communicated like any other fact (e.g., "this bridge is safe"). You are taking a **Pessimist** (or Kantian) stance: aesthetic judgment requires a first-hand encounter because the "value" isn't just in the object, but in the relationship between the object and the perceiver.

  Here is a breakdown of what these practices presuppose, where the boundaries lie, and what the institutional implications would be if your scepticism is correct.

  ### 1. What do these practices presuppose about aesthetic testimony?

  The practices your friend cites (aggregated scores, prizes, grants) presuppose **functional objectivity**, not necessarily metaphysical truth.

  When Rotten Tomatoes averages scores, or a grant panel accepts a reader's report, they are operating on the assumption that aesthetic value is **stable enough to be measured by proxy.** They treat the critic or reader not as a poet sharing an experience, but as a measuring instrument.

  However, this does not commit us to the idea that the *judgement itself* is fully transmissible. It only commits institutions to the idea that **reliability is transmissible.**
  *   **The Institution's View:** "We cannot experience everything, so we must delegate."
  *   **The Philosophical Reality:** This is a pragmatic necessity, not an epistemic proof. Just because a court accepts expert testimony on ballistics doesn't mean the jury understands the physics; it means they trust the expert's reliability. Similarly, institutions trust critics as *reliable indicators*, not as *conduits of truth*.

  ### 2. Is judgement transmissible, or is something weaker enough?

  This is the crux of your argument. You are likely correct that relying on a critic commits you only to the **weaker claim**.

  *   **The Strong Claim (Your Friend):** "The critic says it is good, therefore I know it is good." This treats "goodness" as a property inherent in the film, like its runtime or budget.
  *   **The Weak Claim (You):** "The critic says it is good, and given our history, I know I will find it rewarding." This treats "goodness" as a prediction of your own experience.

  The philosophical argument for the weak claim (championed by thinkers like Immanuel Kant and contemporary philosophers like Paul Guyer) is the **Autonomy of Aesthetic Judgment**. To truly judge something aesthetically, you must feel the pleasure or satisfaction yourself. If you accept the verdict solely on authority, you are making a *logical* judgment ("This fits the criteria of a masterpiece"), not an *aesthetic* one ("This moves me").

  Therefore, relying on a critic is best understood as accepting **evidence about features**, not a licence to believe the verdict. When your friend says, "I know it is a masterpiece," she is conflating "I know I will like it" with "I know it possesses objective merit." She can know the former via testimony; she cannot know the latter without the experience.

  ### 3. Does the format matter? (Rating vs. Review)

  Yes, profoundly. The format signals what is being passed on.

  *   **Bare Ratings/Scores:** These presuppose that aesthetic value is **quantifiable and objective**. A score of 94/100 implies that "goodness" is a substance the film contains in measurable amounts. This format encourages your friend's position. It invites the viewer to outsource the judgment entirely.
  *   **Reasoned Reviews:** These presuppose that aesthetic value is **discursive and attentional**. A good review does not just give a verdict; it directs your attention ("Notice the lighting in the third act," "Listen to the silence between the lines").

  A review respects the sceptic's view because it offers **reasons** that you can verify once you see the film. It says, "Look here, and you might see what I saw." A rating says, "Trust me, it's there." The review invites you to complete the judgment; the rating asks you to adopt theirs.

  ### 4. Where does "worth seeing" stop and "is good" begin?

  This is the semantic boundary where your argument can win ground.

  *   **"Worth Seeing" (Instrumental/Relational):** This can be established by testimony. A film is worth seeing if it is culturally significant, technically innovative, or likely to please *you* based on past taste. This is a claim about utility or probability. Your friend is entitled to this.
  *   **"Is Good" (Intrinsic/Categorical):** This claims a status for the work itself. To assert a work *is* good implies you have witnessed the realization of its value.

  Your friend can say, "I am confident this is worth seeing," or "I am confident I will judge it to be good." She cannot say, "I know it is good," because that claim requires the **witness of the experience.**

  The distinction is between **predicting a reaction** and **certifying a quality.** Testimony is excellent for the former; it is philosophically suspect for the latter.

  ### 5. If first-hand experience is necessary, what must institutions change?

  If your scepticism is true—that aesthetic knowledge requires first-hand experience—institutions do not necessarily have to collapse, but they would have to change their **self-conception.**

  *   **Publishers & Funders:** They would have to admit they are not judging *aesthetic merit* in the final sense, but rather **craft, market potential, and coherence.** An editor can judge if a manuscript is coherent and well-written (technical features) without feeling its ultimate aesthetic power. They would lose the claim that they are "curators of beauty," but they would retain their role as "filters of competence."
  *   **Prize Juries:** These actually align with your view. Juries are convened specifically so that a group *does* experience the work first-hand. The problem arises when the public trusts the *verdict* without seeing the work. The institution doesn't change; the public's reliance on the verdict should be tempered.
  *   **What would be lost?** Efficiency and Scale. If we truly respected the autonomy of judgment, we could not have "Best of the Year" lists that claim objective authority. We would have to frame all criticism as "Here is my experience," rather than "Here is the ranking."
  *   **What would be gained?** Intellectual honesty. We would stop treating art like a sport with scores and start treating it like a conversation.

  ### Summary for the Argument

  You can concede the pragmatic point to your friend while holding the philosophical line:

  1.  **Concede:** Life is too short to see everything. We *must* use critics as filters. It is rational to trust a critic with a 100% match rate to guide your time and money.
  2.  **Hold:** There is a difference between **practical trust** and **epistemic knowledge.**
  3.  **The Knockout:** Tell her she is entitled to say, "I know I will love this," or "I know this is significant." But if she says, "I know this is a masterpiece," before seeing it, she is claiming knowledge of a quality that only reveals itself in the viewing. She is treating the film like a math problem with a correct answer, rather than an experience that requires a witness.

  The institutions she cites survive not because aesthetic testimony is perfect, but because they are **systems of risk management**, not systems of absolute truth. They bet on probability. Your friend is treating a bet as a certainty.
