          *   *Conclusion on Institutions:* They don't need to stop; they need to reframe. They are judging *potential* and *craft*, not certifying *beauty*.

      *   **Conclusion:** Summarize the philosophical stalemate. The Friend is pragmatically right (life is too short to see everything), but the Skeptic is philosophically right (you can't claim *knowledge* of the aesthetic quality without the experience). The institutions survive on a necessary fiction.

