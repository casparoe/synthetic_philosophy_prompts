          5.  If first-hand experience is necessary for knowledge of goodness, what would institutions have to change/lose?

  2.  **Initial Philosophical Mapping:**

      *   This is a classic problem in aesthetics: *The Problem of Aesthetic Testimony*.
      *   **Pessimists (Skeptic):** Kant, Hume (sort of), contemporary philosophers like Hopkins, Kivy. Argument: Aesthetic judgment requires first-hand experience because it involves a specific kind of perception or feeling that cannot be conveyed via propositions.
      *   **Optimists (Truster):** Hume (of course), contemporary philosophers like Coady, Moran. Argument: If we trust testimony in science/history/morals, why not aesthetics? If the reliability is established, why deny knowledge?
      *   **The Institutional Angle:** This adds a pragmatic layer. Institutions *act* as if testimony works. Does "acting as if" imply metaphysical commitment, or just functional utility?

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the argument. It's not just about movies; it's about epistemology and the nature of value. Validate both sides.

      *   **Question 1: What do practices presuppose?**
          *   Institutions operate on *functional* trust, not necessarily *epistemic* certainty.
          *   They treat aesthetic value as *objective enough* to be measured (aggregated scores).
