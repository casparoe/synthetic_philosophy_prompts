answer: |-
  # Seminar Prep: Budget Consequentialism with Moral Remainder
  **Audience:** Kantians, Virtue Ethicists, Global Justice (Anti-"Drowning Child")
  **Goal:** Defend domain-specific budgets + carry-forward debts without collapsing into total demandingness.

  ## Strategic Concessions (Say This Early)
  *   **Non-Consequentialist Foundations for Budgets:** Concede that the *limits* of the budgets (e.g., how much time vs. wealth) are not derived purely from consequentialist calculus. They are grounded in a theory of **agency integrity** and the **conditions of flourishing**. If you try to derive the budgets consequentially, you lose the audience.
  *   **Remainders are Not "Get Out of Jail Free":** Concede that a moral remainder is not merely a feeling of guilt; it is a **normative deficit**. It must constrain future choices, or the theory is just rationalization.
  *   **Not a Solution to Structural Injustice:** Concede this is a theory of *individual* obligation within unjust structures. It does not absolve the state, but it prevents agent burnout from paralyzing action.

  ---

  ## Q&A Objections (Ordered by Damage Potential)

  ### 1. The Compounding Collapse (The "Fatal" Objection)
  **Objection:** "If I fail to meet my wealth budget this year, I carry a remainder debt into next year. But next year also has a new budget. If remainders compound indefinitely, doesn't the debt eventually exceed any possible budget limit? You haven't avoided total sacrifice; you've just amortized it. Over a lifetime, doesn't the sum of remainders collapse back into the demandingness you're trying to avoid?"

  **90-Second Reply:**
  "The collapse only happens if remainders compound *interest-free* without a statute of limitations. My view incorporates a **capacity-sensitive amortization**. A remainder debt is only enforceable insofar as it fits within *future* surplus capacity in that specific domain. If paying the remainder would violate next year's health or integrity budget, the debt is moratoriumed, not compounded. The 'budget' acts as a cap on enforcement, not just allocation. This preserves the 'shape of a life' argument: morality demands optimization within the limits of sustainable agency, not the liquidation of the agent. The debt remains on the books normatively, but its *claim* on action is bounded by future capacity."

  **⚠️ Weakest Point:** Defining "surplus capacity" without smuggling in a hidden maximizing principle. If "capacity" is just "what you can do without dying," the debt still swamps you.

  ### 2. The Source of Limits (The Kantian Objection)
  **Objection:** "You posit budgets for time, wealth, and health. But where do these limits come from? If they aren't derived from the good maximized, they seem arbitrary. If they *are* derived from the good, why aren't they fluid? You seem to be importing deontological side-constraints to save consequentialism. Isn't this just hybrid theory disguised as budgeting?"

  **90-Second Reply:**
  "It is a hybrid in practice, but monistic in justification. The budgets are derived from the **conditions of effective agency**. A consequentialist theory that destroys the agent's capacity to act is self-defeating. The limits aren't arbitrary; they are empirical and normative thresholds where further extraction diminishes marginal moral output by degrading the source of that output (the agent). I am not importing side-constraints; I am acknowledging that the *instrument* of moral value (the person) has maintenance requirements. Ignoring them isn't 'more consequentialist'; it's bad engineering of the moral source."

  **⚠️ Weakest Point:** Kantians will argue that agency integrity is an *end in itself*, not a maintenance requirement for value production. You are treating the person as a resource, just a fragile one.

  ### 3. The Normative Force of Remainders (The Meta-Ethical Objection)
  **Objection:** "What *is* the remainder? If I am within my budget this year, but carrying a remainder from last year, what am I obligated to do? If the remainder doesn't compel me to act outside the budget, it's inert. If it *does* compel me, doesn't that break the budget? You're positing a debt that supposedly exists but doesn't necessarily demand payment."

  **90-Second Reply:**
  "The remainder functions as a **priority weight**, not a trump card. When operating within my current budget, I have discretion. When carrying a remainder, that discretion is constrained: I must prioritize remainder-rectifying actions over supererogatory projects within the same domain. It doesn't force me to break the budget, but it removes the 'moral credit' I might have claimed for doing the bare minimum. It changes the *moral quality* of the action, even if the action remains the same. It acknowledges the deficit without demanding self-destruction to fix it immediately."

  **⚠️ Weakest Point:** This risks making the remainder purely aretaic (about character) rather than deontic (about duty). Global justice folks will ask: "Does the starving child care about your moral quality or your food?"

  ### 4. Fragmentation of Agency (The Virtue Ethics Objection)
  **Objection:** "By siloing obligations into wealth, time, and health budgets, you fragment the moral agent. Virtue requires a unified character. If I can be 'in the red' on wealth but 'in the black' on time, am I not cultivating a fractured moral psychology? Doesn't this encourage ledger-keeping rather than practical wisdom (*phronesis*)?"

  **90-Second Reply:**
  "Ledger-keeping is a risk, but siloing protects against **moral monoculture**. When all obligations pool, one urgent domain (like wealth donation) cannibalizes others (like health or relationships), which are also constitutive of virtue. A unified character requires a balanced life, not a maximized single variable. The budgets force the agent to attend to the *whole* of their moral ecology. The remainder ensures I don't ignore the deficit, but the budget ensures I don't neglect other virtues to fix it. This preserves the 'shape of a life' against the tyranny of the urgent."

  **⚠️ Weakest Point:** Virtue ethicists may argue that true *phronesis* doesn't need rigid budgets; it perceives the mean in the moment. Budgets look like rules for those lacking wisdom.

  ### 5. The Status Quo Bias (The Global Justice Objection)
  **Objection:** "This sounds like a theory designed for the privileged. Budgets protect *my* projects and *my* health while others starve. By allowing me to carry a remainder rather than forcing immediate sacrifice, you are prioritizing my integrity over their survival. You're systematizing complicity."

  **90-Second Reply:**
  "The alternative—total sacrifice—leads to **moral burnout and withdrawal**, which helps no one. A theory that demands too much gets ignored entirely. By making obligations sustainable, we increase long-term compliance and collective output. Furthermore, the 'health' and 'time' budgets aren't just for leisure; they include the maintenance required to engage in political advocacy and structural change, which is more effective than individual resource funneling. I am not prioritizing my integrity over their survival; I am prioritizing *sustainable agency* to ensure I can fight for their survival over decades, not just weeks."

  **⚠️ Weakest Point:** This is a pragmatic defense, not a principled one. If a child dies *now* because I saved my energy for *later* advocacy, the consequentialist calculus might still condemn me.

  ### 6. Incommensurability Across Domains (The Technical Objection)
  **Objection:** "How do you trade off between budgets? If I have a wealth remainder but I'm at my time budget limit, can I use time to pay the wealth debt (e.g., volunteer labor)? If yes, the budgets are porous and collapse. If no, the theory is rigid and irrational. How do you handle cross-domain substitution?"

  **90-Second Reply:**
  "Substitution is permitted but taxed. You can pay a wealth debt with time, but it draws from the time budget at a **conversion rate** that reflects the opportunity cost to that domain's integrity. This prevents one domain from being liquidated to pay another's debts endlessly. The porosity is controlled. This acknowledges that resources are fungible for the agent, but the *impact on agency* is domain-specific. It keeps the machinery flexible without losing the protective function of the silos."

  **⚠️ Weakest Point:** Who sets the conversion rate? If it's consequentialist, we're back to maximizing. If it's arbitrary, the system is ad hoc.

  ### 7. Moral Schizophrenia (The Psychological Objection)
  **Objection:** "If I know I have a remainder debt, but I'm told I'm 'within budget' for today, aren't I living a lie? I know I ought to do more, but the theory tells me I'm permitted to stop. Doesn't this create a split between what I believe is good and what I permit myself to do?"

  **90-Second Reply:**
  "It creates a distinction between the **Ideal** and the **Obligatory**. I can acknowledge that more would be better (the Ideal) without believing that failing to do more is a violation of duty (the Obligatory). This isn't schizophrenia; it's moral maturity. It acknowledges the tragedy of limited resources without pathologizing the agent. The remainder keeps the Ideal visible (I still owe), but the budget defines the Obligatory (what I must do now). This prevents the alienation that comes from constantly viewing oneself as morally insufficient."

  **⚠️ Weakest Point:** Kantians will argue that if you know X produces more good, and you don't do X, you are violating rationality. Distinguishing Ideal/Obligatory looks like special pleading.

  ---

  ## Emergency Protocol
  **If they press the "Collapse" (Objection 1) hard:**
  Pivot to **Collectivization**. "Individually, remainders might compound. But this theory is designed to scale to a collective agent. If we all meet our budgets, the collective remainder is manageable. The theory assumes coordination, not isolated maximization."

  **If they press the "Source of Limits" (Objection 2) hard:**
  Pivot to **Reflective Equilibrium**. "I am not deducing these from first principles. I am proposing a framework that best fits our considered judgments about sustainability and obligation. If it saves the phenomenon of moral life better than maximizing act-consequentialism, it has merit."
