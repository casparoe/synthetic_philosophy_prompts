          *   Keep it specific to the budget/remainder machinery (no generic Singer worries).

  2.  **Deconstruct the Theory (Budget Consequentialism with Moral Remainder):**
      *   *Budget:* Limits on how much can be demanded in specific domains (time, money, health).
      *   *Remainder:* If you don't meet the budget, you owe a debt (moral remainder) that carries forward.
      *   *Goal:* Avoid the "resource funnel" objection while maintaining consequentialist force.
      *   *Vulnerability:* Arbitrariness of budgets, compounding of remainders, fragmentation of agency, status of the remainder (is it guilt? obligation?).

  3.  **Anticipate Objections (Audience Specific):**
      *   *Kantians:* Will hate the idea that morality is divisible into budgets. They care about the unity of practical reason. They'll ask about the source of the budget limits.
