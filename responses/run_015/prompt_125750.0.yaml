      *   *Global Justice:* Will worry that budgets let the wealthy off the hook too easily. Does "remainder" actually motivate change or just soothe conscience?
      *   *The "Collapse" Objection:* If remainders compound, do I eventually owe everything anyway?

  4.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Collapse):* This is the "hope nobody asks" one. If I owe $100 this year and pay $0, do I owe $100 next year *plus* next year's budget? If so, doesn't it sum to total sacrifice eventually?
      *   *Objection 2 (Arbitrariness/Justification):* Where do the budget limits come from? If they aren't consequentialist, what are they? Kantians will pounce on this.
      *   *Objection 3 (Agency Integrity/Fragmentation):* Does dividing morality into budgets fracture the agent? Virtue ethicists want a unified character, not a ledger.
      *   *Objection 4 (The Nature of the Remainder):* What *is* the remainder? Is it a duty to make up for it? If so, how is that different from the original duty? If not, what normative force does it have?
      *   *Objection 5 (Separation of Persons):* Global justice folks might argue this privileges the agent's projects over others' needs too much. It sounds like a "clean hands" policy for the privileged.
      *   *Objection 6 (Moral Schizophrenia):* If I have a remainder debt but I'm currently within my budget, do I act on the debt or the budget? This creates conflicting motives.

  5.  **Refining Replies (90 Seconds ~ 150-200 words spoken):**
      *   Need to sound philosophical, not defensive.
      *   Need to use *their* terms (practical reason, flourishing, integrity, normative force).
      *   Need to acknowledge the tension.

  6.  **Selecting Concessions:**
      *   Can't defend the specific numbers of the budgets.
      *   Must admit remainders feel like guilt but argue they are normative.
      *   Must admit this doesn't solve global justice entirely, but makes it sustainable.

  7.  **Ordering by Damage Potential:**
