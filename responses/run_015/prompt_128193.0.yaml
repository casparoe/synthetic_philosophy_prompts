answer: |-
  # Decision Tree: Taxonomy of Moral Responsibility Commitments

  **Instructions:** This taxonomy sorts substantive commitments regarding moral responsibility. Proceed from the Root Node downward. At each internal node, select the option that best reflects your judgment. Follow the path to a terminal leaf to identify your position within the logical space. Do not concern yourself with philosophical labels while answering; focus on the concrete claims.

  ---

  ### Root Node: Determinism and Intrinsic Appropriateness
  **Claim:** Suppose it were conclusively proven that every human decision is the inevitable physical consequence of prior causal events (determinism). Is it ever *intrinsically appropriate* (independent of social utility) to feel personal resentment toward a specific individual for a harmful choice made under these conditions?

  *   **Option A:** No. If the act was determined, resentment is never intrinsically appropriate; the objective attitude (viewing the agent as a system to be managed) must prevail globally.
      *   *Proceed to Node 2.*
  *   **Option B:** Yes. Determinism does not automatically rule out the intrinsic appropriateness of resentment toward individuals.
      *   *Proceed to Node 3.*

  ---

  ### Node 2: Scope of Exemption (For Option A Paths)
  **Claim:** You have indicated that determinism generally undermines resentment. Consider a case of severe psychosis where an individual lacks the capacity to understand moral reasons. Is this incapacity a *local exception* that confirms responsibility exists elsewhere, or does it reveal a *global lack* of capacity in all agents upon closer inspection?

  *   **Option A:** Global Lack. The psychosis case simply makes explicit what is true of all agents: no one has the requisite control to merit reactive attitudes.
      *   **→ LEAF: Hard Determinist / Global Skeptic**
  *   **Option B:** Local Exception. The psychosis case is distinct; most agents retain a capacity that the psychotic agent lacks, even if determinism is true.
      *   **→ UNOCCUPIED SPACE DIAGNOSIS:** *Incoherent.* Claiming determinism undermines responsibility globally (Root A) while simultaneously claiming some agents retain a distinct capacity (Node 2 B) creates a contradiction regarding the source of the exemption.

  ---

  ### Node 3: Grounds of Appropriateness (For Option B Paths)
  **Claim:** You have indicated that resentment can be appropriate even if determinism is true. What primarily grounds this appropriateness?

  *   **Option A:** Social Practice. The appropriateness is grounded in the natural, non-rational framework of human relationships and the demand for goodwill. It is a feature of our form of life, not a conclusion of metaphysical reasoning.
      *   *Proceed to Node 4.*
  *   **Option B:** Rational Capacity. The appropriateness is grounded in the agent's specific cognitive abilities (e.g., the ability to recognize and respond to moral reasons).
      *   *Proceed to Node 5.*

  ---

  ### Node 4: Metaphysical Independence (For Option A Paths)
  **Claim:** You view responsibility as grounded in social practice. Does the preservation of this practice require the truth of indeterminism (that agents could have done otherwise in the exact same physical circumstances)?

  *   **Option A:** No. The practice is self-justifying and does not depend on the metaphysical status of causation.
      *   **→ LEAF: Pure Strawsonian View**
  *   **Option B:** Yes. Even though grounded in practice, the practice is irrational if indeterminism is false.
      *   **→ UNOCCUPIED SPACE DIAGNOSIS:** *Practically Unattractive.* This position (Fideistic Incompatibilism) admits the practice requires a false metaphysical premise. Most respondents who value the practice (Root B) and ground it socially (Node 3 A) find the metaphysical requirement (Node 4 B) unnecessary, rendering this combination rare.

  ---

  ### Node 5: Metaphysical Requirement (For Option B Paths)
  **Claim:** You view responsibility as grounded in rational capacity. For an agent to be truly responsible, must they have been able to choose otherwise in the *exact same physical circumstances*?

  *   **Option A:** Yes. Reasons-responsiveness is insufficient without genuine alternative possibilities (indeterminism).
      *   **→ LEAF: Libertarian Incompatibilist**
  *   **Option B:** No. The capacity to recognize and respond to reasons is sufficient, even if the agent could not have done otherwise (determinism is compatible).
      *   *Proceed to Node 6.*

  ---

  ### Node 6: Locus of Agency in Complex Systems (For Option B Paths)
  **Claim:** Consider a harmful outcome caused by a standard, widely deployed algorithm designed by an individual engineer within a large corporation. Toward which target is resentment appropriately directed?

  *   **Option A:** The Individual Engineer. The engineer is the moral agent; the corporation is a fiction, and the code is a tool.
      *   **→ LEAF: Rationalist Compatibilist**
  *   **Option B:** The Corporation as a Whole. The individual engineer is determined/constrained by the system, but the collective entity possesses a distinct agency that merits the objective attitude (or vice versa: individuals are free, institutions are determined).
      *   **→ LEAF: Hybrid I (Institutional Skeptic)**
  *   **Option C:** The Sub-personal Logic/Mechanism. "Whole persons" are fictions; reactive attitudes are only coherent when directed at specific cognitive modules or algorithmic processes, not the agent as a unified whole.
      *   **→ LEAF: Hybrid II (Module Realist)**

  ---

  ### Scoring Key and Leaf Definitions

  | Path Sequence | Resulting Position | Definition |
  | :--- | :--- | :--- |
  | **Root A → Node 2 A** | **Hard Determinist / Global Skeptic** | Determinism undermines all reactive attitudes; the objective attitude should prevail globally. |
  | **Root B → Node 3 A → Node 4 A** | **Pure Strawsonian View** | Reactive attitudes are non-rational social practices; determinism is irrelevant to their appropriateness. |
  | **Root B → Node 3 B → Node 5 A** | **Libertarian Incompatibilist** | Reactive attitudes require indeterminism (alternative possibilities) but should be preserved. |
  | **Root B → Node 3 B → Node 5 B → Node 6 A** | **Rationalist Compatibilist** | Reactive attitudes depend on reasons-responsive capacities; determinism is compatible under specific conditions. |
  | **Root B → Node 3 B → Node 5 B → Node 6 B** | **Hybrid I (Institutional Skeptic)** | Determinism undermines reactive attitudes when directed at institutions, but not individuals (or vice versa). |
  | **Root B → Node 3 B → Node 5 B → Node 6 C** | **Hybrid II (Module Realist)** | Reactive attitudes are appropriate only when targeted at sub-personal cognitive modules rather than at whole persons. |

  ---

  ### Unoccupied Space Diagnosis

  The following logically possible combinations are not assigned leaves in this taxonomy:

  1.  **Root A (No Resentment) + Node 6 A (Blame Engineer):**
      *   *Diagnosis:* **Incoherent.** One cannot claim determinism makes resentment intrinsically inappropriate globally (Root A) while simultaneously affirming it is appropriate toward a specific individual engineer (Node 6 A).
  2.  **Root B + Node 3 A (Social) + Node 5 A (Indeterminism Required):**
      *   *Diagnosis:* **Mere Lack of Exploration.** (Mapped to Unoccupied Space in Node 4). This view holds that social practices are the ground of responsibility, yet admits those practices are unjustified if the world is determined. It is logically stable but pragmatically unstable, as it commits one to a social practice known to be metaphysically unfounded.
  3.  **Root B + Node 3 B (Rational) + Node 6 C (Modules) + Node 5 A (Indeterminism):**
      *   *Diagnosis:* **Practically Unattractive.** This combines Libertarianism with Module Realism. It requires indeterminism at the level of cognitive modules rather than whole agents. While logically possible, it lacks a coherent account of how "modules" bear the unity required for moral desert without a "whole person" to integrate them.

  ---

  ### Separation Ambiguities

  **Flagged Pair:** **Pure Strawsonian View** vs. **Rationalist Compatibilist**

  *   **Ambiguity:** Both positions answer **Yes** at the Root Node (Determinism does not rule out resentment). If a respondent answers **Yes** at Root and **Social Practice** at Node 3, they are directed to the Strawsonian leaf. However, a Rationalist Compatibilist might also value social relationships.
  *   **Resolution:** The tree separates them at **Node 3**. The Strawsonian views the practice as *non-rational* and self-justifying (independent of capacity analysis). The Rationalist views the practice as dependent on *capacity analysis* (reasons-responsiveness).
  *   **Remaining Ambiguity:** A respondent who believes social practice is primary *but* also believes it implicitly tracks rational capacities may find Node 3 difficult to binarize. The tree forces a choice between "Practice is fundamental" (Strawson) and "Capacity is fundamental" (Rationalist). In reality, these views may overlap, but the taxonomy treats them as mutually exclusive foundations for the sake of distinction.

  **Flagged Pair:** **Hybrid I** vs. **Rationalist Compatibilist**

  *   **Ambiguity:** Both share the same metaphysical commitments (Root B, Node 3 B, Node 5 B). They differ only on the *target* of responsibility in complex systems (Node 6).
  *   **Resolution:** The tree separates them at **Node 6**.
  *   **Remaining Ambiguity:** If a respondent believes the Engineer is responsible *unless* the corporation exerts total control, they may hesitate between Option A and Option B. The tree treats the "Standard" view as strictly Individual-focused and the "Hybrid" view as strictly Collective-focused for the sake of mapping, though a nuanced view might distribute responsibility across both.
