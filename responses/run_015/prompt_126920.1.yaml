      *   (2) *Identity Condition:* Change form = new object.
      *   (3) *Linguistic Necessity:* Translation *necessarily* alters all formal properties (phonology, stress, syntax).
      *   (4) *Conclusion:* Interlingual rendering = new poem; "translation" is a misnomer.
      *   (5) *Observation:* Practice treats them as translations (fidelity matters).
      *   (6) *Incoherence:* If (4) is true, practice is incoherent (nothing to be faithful to).
