  ## The Epistemological Casting Tree

  **Start State:** The Deadlock. Two characters, equal intelligence, equal access to information, no logical flaws found in either argument, conversation has stalled.

  **Instruction:** For each node, choose the action the character *dramatizes* in the scene. Follow the path to the leaf.

  ### Node 1: The Bank Balance (Subject Matter: Fact)
  *The argument shifts to a missing $500 in the shared account. The partner says, "I know I didn't spend it."*
  *   **Left (Verificationist):** The character opens the laptop. "Show me the transaction log. I need to see it."
  *   **Right (Deferential):** The character closes the notebook. "If you're sure, I believe you. Let's move on."
      *   *Go to Node 2.*

  ### Node 2: The Art Exhibit (Subject Matter: Taste/Politics)
  *The argument shifts to a painting or a policy. The partner says, "This is objectively bad."*
  *   **Left (Convergence):** The character leans in. "No, one of us is missing the context. We need to figure out which."
  *   **Right (Coexistence):** The character leans back. "I guess we just see the world differently. That's fine."
      *   *If Node 1 Left + Node 2 Left → Go to Node 3 (Steadfast Track).*
      *   *If Node 1 Left + Node 2 Right → Go to Node 4 (Permissivist Track).*
      *   *If Node 1 Right → Go to Node 5 (Conciliationist Track).*

  ### Node 3: The Outsider (Expertise: Different Field)
  *Partner (a Biologist) makes a claim about Physics. "In my field, we treat this variable as constant."*
  *   **Left (Insular):** The character shakes their head. "That doesn't apply here. This is my lane."
  *   **Right (Deferential):** The character pauses. "You know more about systems than I do. Maybe you're right."
      *   *If Left → Go to Node 4.*
      *   *If Right → **Leaf: Soft Steadfast** (See Analysis).*

  ### Node 4: The Black Box (Route: Unreliable Method)
  *Partner admits, "I can't prove it, I just had a dream/intuition that this was the answer."*
  *   **Left (Process-Strict):** The character dismisses the point. "Then it's noise. I can't count that."
  *   **Right (Outcome-Open):** The character considers the point. "It got you here. Maybe the brain knows things the logic doesn't."
      *   *If Node 3 Left + Node 4 Left → Go to Node 5.*
      *   *If Node 3 Right OR Node 4 Right → **Leaf: Soft Steadfast** (See Analysis).*

  ### Node 5: The Secret Card (Information: One Extra Bit)
  *Partner says, "I have one piece of data I can't show you, but it decides this."*
  *   **Left (Total-Evidence Steadfast):** The character stands up. "Then I can't agree. I only trust what we both see."
  *   **Right (Equal-Weight Conciliationist):** The character sits down. "If you have the edge, I'll split the difference with you."
      *   *If Node 1 Left + Node 2 Left + Node 3 Left + Node 4 Left + Node 5 Left → **Leaf: Total-Evidence Steadfast**.*
      *   *If Node 1 Left + Node 2 Left + Node 3 Left + Node 4 Left + Node 5 Right → **Leaf: Incoherent** (See Analysis).*
      *   *If Node 1 Right (from Node 2) → **Leaf: Equal-Weight Conciliationist**.*
      *   *If Node 1 Left + Node 2 Right → **Leaf: Domain Permissivist**.*

  ---

  ### The Leaves (Character Archetypes)

  1.  **Total-Evidence Steadfast:** (Path: 1L → 2L → 3L → 4L → 5L)
      *   **Philosophy:** "My reasoning *is* the evidence. If I'm right, I'm right, regardless of your disagreement."
      *   **Drama:** They never lower their voice. They treat disagreement as noise to be filtered, not data to be weighted. They will walk away from the bank balance rather than trust a word without a receipt.
      *   **Stage Direction:** *Does not blink when the other person cries.*

  2.  **Domain Permissivist:** (Path: 1L → 2R)
      *   **Philosophy:** "Facts are singular, but values are plural. We can share a bank account but not a worldview."
      *   **Drama:** They are rigid on math, fluid on meaning. They will audit the taxes but defend the other's right to vote differently.
      *   **Stage Direction:** *Checks the receipt, then pours the other a drink.*

  3.  **Equal-Weight Conciliationist:** (Path: 1R → 5R)
      *   **Philosophy:** "The fact of our disagreement is itself evidence that I might be wrong."
      *   **Drama:** They are the first to compromise. They fear being "the difficult one" more than being wrong. They defer to the secret card because the *relationship* is the evidence.
      *   **Stage Direction:** *Apologizes for the argument before the argument is over.*

  4.  **Soft Steadfast:** (Path: 1L → 2L → 3R/4R)
      *   **Philosophy:** "I trust my eyes, unless you have a specific credential or intuition I lack."
      *   **Drama:** The most common human being. Stubborn on basics, but impressionable regarding expertise or "gut feelings."
      *   **Stage Direction:** *Argues fiercely until the word "Doctor" or "Trust me" is used.*

  5.  **Incoherent:** (Path: 1L → 2L → 3L → 4L → 5R)
      *   **Philosophy:** "I demand proof on everything, except when you tell me not to."
      *   **Drama:** This character is manipulative or emotionally volatile. They use epistemology as a weapon, not a tool.
      *   **Stage Direction:** *Demands a receipt, then accepts a secret, then accuses the other of lying.*

  ---

  ### Meta-Analysis for the Writer

  **Indistinguishable Leaves:**
  *   **Soft Steadfast vs. Conciliationist:** In a short scene, these look identical (both yield ground). To tell them apart, watch *why* they yield. The Conciliationist yields because they value the *peer status* (Node 1 Right: they defer on the bank). The Soft Steadfast yields only on specific triggers (Expertise/Intuition) but would demand a receipt on the bank (Node 1 Left).
  *   **Permissivist vs. Avoidant:** A character who says "We just see it differently" (Node 2 Right) might be a philosophical Permissivist or just someone who wants to end the scene. To dramatize the Permissivist, have them defend the *other person's right to be wrong* actively, rather than just walking away.

  **Impossible/Unstable Combinations:**
  *   **The "Secret Card" Steadfast (Node 5 Right on Steadfast Path):** It is philosophically unstable to demand receipts for the bank balance (Node 1 Left), reject intuition (Node 4 Left), reject outside expertise (Node 3 Left), but then defer to a *secret* piece of information (Node 5 Right).
      *   *Why:* If you require total evidence transparency (Steadfast), you cannot defer to opaque information.
      *   *Dramatic Use:* This is the **Hypocrite**. Use this path only for a character who is lying about their principles or is in love with the person they are arguing with (love overrides epistemology).
  *   **The "Moral Absolutist Accountant" (Node 1 Right + Node 2 Left):** A character who trusts the partner on the bank balance ("If you say so") but fights to the death over politics ("You are objectively wrong").
      *   *Why:* Usually, if you are deferential on hard facts (money), you are deferential on soft facts (politics).
      *   *Dramatic Use:* This is the **Devotee**. They trust the partner's competence but not their morality. Very high tension potential.

  **Note on "Extra Bit of Info":**
  *   To dramatize Node 5 without narration: The partner must physically withhold something (hand over a phone screen, close a letter). The character's reaction to the *withholding* is the branch. Do they lean in (trust) or lean back (suspicion)?

  **Note on "Unreliable Route":**
  *   To dramatize Node 4: The partner must admit to a "sin" of reasoning (gambling, dreaming, astrology). The character's reaction to the *sin* is the branch. Do they wash the hands (reject) or eat the fruit (accept)?
