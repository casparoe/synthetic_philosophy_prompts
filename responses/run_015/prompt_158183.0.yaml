      *   (2) If justice is *essentially defined* by being enforced, then enforced norms = just, unenforced = empty wishes. (Interpretive move: Definitional reduction).
      *   (3) Therefore, a stable tyranny enforcing its laws is *fully just* (because force + law = justice). (Logical consequence of 2).
      *   (4) Pascal clearly treats tyranny as a real, condemnable failure. (Textual/Contextual claim).
      *   (5) Contradiction detected: Either he contradicts himself, or there's a hidden normative criterion.
