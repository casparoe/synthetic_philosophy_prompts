      *   **Goal:** Save (1) and (4).

  3.  **Brainstorming Exits (Step-by-Step Thinking):**

      *   *Exit A: Reject (1).* Claim Pascal doesn't actually say they must be "married" in the way the user thinks. He might be describing a sociological fact, not a normative ideal.
          *   *Cost:* User wants to keep (1). Also, (1) is fairly textual.
      *   *Exit B: Reject (2).* This is the definitional move. Does Pascal define justice *by* enforcement? Or does he say enforcement is *necessary* for justice to be effective in the fallen world?
          *   *Potential:* This looks like the weak link. Pascal distinguishes between "true justice" (divine/natural) and "established justice" (custom/force).
      *   *Exit C: Reject (3).* Even if force + law = established justice, does that equal *true* justice? Pascal might allow for a category of "legal but unjust."
          *   *Potential:* This aligns with rejecting (2).
      *   *Exit D: Reject (4).* Maybe Pascal *does* think tyranny is inevitable and "justice" is just a label we put on power. (Might makes Right).
          *   *Cost:* User wants to keep (4). Also, Pascal is a Christian moralist; calling tyranny "good" contradicts his theology.
      *   *Exit E: Reject (6).* Can there be a hidden criterion *and* (1) remains true? Yes, if (1) is about *efficacy* in the secular realm, not *ontological status*.
          *   *Potential:* This is the nuanced theological/political distinction.

  4.  **Deep Dive into Pascal's Text (*Pensées* 103/298):**
      *   Famous quote: "Justice without force is powerless; force without justice is tyrannical." (*La justice sans la force est impuissante ; la force sans la justice est tyrannique.*)
      *   Context: Pascal is discussing the *fondement* (foundation) of justice. He argues that human laws are often based on custom and force, not natural right.
      *   Key Distinction: Pascal operates with a Jansenist/Augustinian framework. There is *Justice* (divine, true) and *Justice* (human, conventional).
      *   The "Marriage": Pascal says we *must* marry them because we cannot make the just strong, so we make the strong just. This is a pragmatic compromise due to the Fall, not an ontological identity.
      *   The User's Step (2) assumes an *identity* (Justice = Enforced Norm). Pascal posits a *functional necessity* (Justice needs Force to survive in a sinful world).

  5.  **Formulating the Diagnosis:**
