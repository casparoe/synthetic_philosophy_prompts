      *   **Task:** Critique their proposed philosophical profile on pleasure/welfare. Identify collisions/contradictions between their seven stated positions and specific case verdicts. Rank collisions by severity. Explain what must be given up and the cost (especially regarding the article's argument on measurement). Recommend the single best revision for consistency.
      *   **Tone/Style:** British English (editor is a stickler). Intellectual but accessible (magazine piece context). Rigorous but practical (needs to "hang together" for an article).
      *   **Key Constraints:** Don't assume the user knows where the problem is. Be willing to say some worries are fake.

  2.  **Deconstruct the User's Positions:**
