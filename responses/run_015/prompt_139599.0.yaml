      *   Addressed the specific case verdicts? Yes.

  *(Self-Correction during drafting)*: I need to be careful about the Flow verdict. The user says flow involves "strain and even mild discomfort". If welfare is pleasure minus pain, flow might net out lower. But Attitudinal Hedonism says if you are 'for' the strain, the strain itself isn't necessarily 'pain' in the welfare-reducing sense, or the 'being for' outweighs it. I should clarify that (3) saves Flow, so it's not a collision, it's a feature.

