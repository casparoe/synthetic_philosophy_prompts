answer: |-
  This is a sophisticated pedagogical challenge. You are correct: the standard Dollar Auction fails when the subjects know the trick. They treat it as a logic puzzle to be solved (collusion or shutdown) rather than a behavioral trap to be experienced.

  Your intuition about **Private Values** is the correct lever to pull. It introduces **information asymmetry**, which blurs the line between "irrational escalation" and "rational competition." If I bid \$5 for a \$1 prize, am I a fool, or do I know the prize is actually worth \$10? In a room of mixed majors, some will assume the latter and escalate to test the hypothesis.

  Here is a complete design for **The Asymmetric Escalation Auction**, tailored to your constraints.

  ### 1. The Activity Design: "Asymmetric Escalation Auction"

  **Core Mechanic:** A modified Dollar Auction (1st and 2nd highest bidders pay) with hidden private redemption values.
  **Goal:** Maximize your group's total remaining points.
  **Stakes:** The group with the highest aggregate remaining points wins a tangible prize (e.g., a \$50 gift card, a catered lunch, or a department donation in their name). This makes point loss "sting" via peer pressure and tournament stakes.

  #### The Rules (For the Students)
  1.  **Endowment:** Each player starts with **20 Lab Points (LP)**.
  2.  **The Prize:** A certificate redeemable for LP. **Crucially:** The redemption value is **private**. You will receive an envelope with your value. Do not show it to anyone.
  3.  **Auction Rules:**
      *   Open outcry bidding.
      *   **Winner:** Highest bidder gets the certificate (redeems for their private value).
      *   **Payer:** Highest **AND** Second-Highest bidders **both** pay their final bid amounts from their endowment.
      *   **Increments:** Minimum bid increment is **1 LP**.
      *   **Opening Bid:** Capped at **2 LP** (prevents the "\$1 shutdown" move).
      *   **Bankruptcy:** You cannot bid more LP than you possess. If you run out, you are out.
  4.  **Winning the Session:** The **Group** (table) with the highest *sum of remaining LP* across all members wins the prize. (This aligns individual survival with group success, but the auction rules pit them against each other).

  #### The Private Value Distribution (The "Secret Sauce")
  You need to create ambiguity. If everyone has the same value, it's a trap. If values vary wildly, it's a market. You want a mix.
  Prepare 5 sets of envelopes (one set per table). Each set contains 4 cards (for 4 bidders).
  *   **Card A (Common):** "Redemption Value: 5 LP" (3 cards per set)
  *   **Card B (High):** "Redemption Value: 15 LP" (1 card per set)

  *Why this works:*
  *   **The Trap (1):** A player with a 5 LP card gets trapped in a bidding war past 5 LP because they are already the 2nd highest bidder paying 4 LP. Bidding 6 LP to win 5 LP is a loss, but losing 4 LP is worse.
  *   **The Sunk Cost (2):** A player with a 5 LP card bids past 5 LP hoping to bluff the other person, gaining no new info, just throwing good LP after bad.
  *   **The Rational Escalation (3):** The player with the 15 LP card *should* bid past 5 LP. To the observers (and the 5 LP players), this looks like insanity until the reveal. This blurs the distinction during play.

  ### 2. Logistics & Materials

  **Time:** 75 Minutes
  *   **00-10:** Setup & Instructions (No mention of "sunk cost" or "trap").
  *   **10-40:** Auction Play (30 mins hard stop).
  *   **40-75:** Debrief.

  **Room Setup:**
  *   5 Tables.
  *   **22 Students:** 4 Groups of 5 students (4 Bidders + 1 Banker). 2 Students remain as "Auditors" (they rotate between tables to ensure rules are followed; this keeps them engaged and adds oversight credibility).
  *   **Instructor Role:** You are the "Central Bank." You do not run the auctions. You hold the prize pool and collect final score sheets. This removes the "Professor is tricking us" dynamic.

  **Materials:**
  *   **Envelopes:** 20 Value Cards (sealed).
  *   **Score Sheets:** One per player to track their LP balance.
  *   **Banker Script:** A printed card for the student Banker explaining they cannot bid, must enforce the 2 LP opening cap, and must record final bids.
  *   **Prediction Sheet:** (See below).

  **Credibility Check:**
  *   Tell them: *"I am not running the auctions. The Bankers are bound by the script. The Auditors will verify the math. I only collect the final numbers to award the prize. I have no stake in how high you bid."*
  *   Use physical envelopes for values. The tactile nature makes the private info feel real.

  ### 3. The Prediction Sheet (Pre-Game)

  Hand this out *before* they open their value envelopes. This locks in their priors.

  > **PRE-AUCTION PREDICTION**
  > 1.  What do you estimate is the *average* redemption value of the prize in this room? ______ LP
  > 2.  What is the maximum bid you personally plan to make before dropping out? ______ LP
  > 3.  If you find yourself in 2nd place with a bid of 4 LP, and the leader bids 5 LP, what will you do?
  >     [ ] Drop out and lose 4 LP.
  >     [ ] Bid 6 LP to try to win.
  >     [ ] Ask the leader for their value.
  > 4.  Do you believe other players have the same redemption value as you? [ ] Yes [ ] No

  ### 4. Running the Rounds (Time Management)

  *   **Minute 10:** Distribute envelopes. **Rule:** "Do not open until I say go. Do not show anyone."
  *   **Minute 12:** "Go." Auctions begin.
  *   **Minute 25:** **Intervention.** Walk to the table that is quietest. Say loudly: *"Table 3 has already reached 10 LP in bidding."* (Even if they haven't). This creates false social proof and induces panic/competition at other tables.
  *   **Minute 35:** **Hard Stop.** "Gavel down. No more bids. Bankers, record final positions."
  *   **Minute 40:** Collect Score Sheets and Value Cards.

  ### 5. The Debrief: Mapping the Three Distinctions

  This is where you do the heavy lifting. Do not lecture. Use their data.

  **Step 1: The Reveal (5 mins)**
  *   Ask the Bankers to read the final winning bids for each table.
  *   Ask the students to reveal their Value Cards.
  *   Write the data on the board: *Table 1: Winner Bid 12 (Value 15). Loser Bid 11 (Value 5).*

  **Step 2: Mapping the Three States (15 mins)**
  Draw three columns on the board. Ask students to self-sort based on their experience.

  *   **Column 1: The Trap (Entry Error)**
      *   *Ask:* "Who entered the bidding expecting to get the prize for under 5 LP, but ended up paying more than 5 LP?"
      *   *Lesson:* This is globally irrational. The mistake was entering the auction given the rules (2nd price pays). Once in, however, continuing was locally rational to minimize loss.
  *   **Column 2: The Sunk Cost (Blind Escalation)**
      *   *Ask:* "Who had a 5 LP value but bid past 6 LP *after* they knew the opponent likely had a higher value (or just to 'punish' them)?"
      *   *Lesson:* This is throwing good money after bad. No new information was gained. The goal shifted from 'winning' to 'not losing face/points.'
  *   **Column 3: Rational Escalation (Option Value)**
      *   *Ask:* "Who had the 15 LP card? Did you feel like a fool bidding 10 LP for what everyone else thought was a 5 LP prize?"
      *   *Lesson:* To the room, you looked irrational. In reality, you were the only one acting on true information. **Key Point:** In the real world, we rarely know if we are in Column 2 or Column 3.

  **Step 3: Local vs. Global Rationality (10 mins)**
  *   Highlight a specific moment: *"At bid 8 LP, Player A (Value 5) had already lost 7 LP. Bidding 9 LP to win 5 LP results in a net -4 LP. Not bidding results in -7 LP. Locally, bidding 9 LP is the utility-maximizing move. Globally, being in the auction was the error."*
  *   Connect to Backward Induction: *"Why didn't backward induction save you? Because you didn't know the other player's payoff function."*

  ### 6. Failure Modes & Mitigations

  **1. The "Shutdown" Bid (Someone bids 2 LP and everyone folds)**
  *   *Why:* They are too smart for the game.
  *   *Fix:* If a group finishes in under 2 minutes, pull them into the debrief early. Ask: *"Why didn't the trap spring?"* Answer: *"Because the High Value player signaled too early, or the group colluded."* This is a valid equilibrium. Use it to discuss why cartels fail in the real world (incentive to cheat).

  **2. Collusion ("Let's all bid 1 LP and split the prize")**
  *   *Why:* They know the game.
  *   *Fix:* The "Auditor" students have a secret instruction: *"If you hear explicit collusion, warn the table that the Central Bank (You) will disqualify the group from the prize pool."*
  *   *Debrief:* If they collude successfully, congratulate them. *"You solved the game by changing the game. This is 'Institutional Design.' But note: it required enforceable contracts. In the real world, can you enforce that?"*

  **3. The "Performatively Self-Aware" Bidder**
  *   *Why:* The student who mentioned it in office hours.
  *   *Fix:* Give them a job. Make them an "Auditor." Their job is to watch *other* groups. It channels their meta-awareness into data collection. If they insist on bidding, tell them: *"Your goal is to maximize points for the prize. If you bid to prove a point, you hurt your team."*

  **4. Uneven Pacing (One group finishes in 5 mins, another goes 30 mins)**
  *   *Fix:* You circulate. To the fast group: *"Are you sure you want to close early? Table 4 is still going."* To the slow group: *"You have 5 minutes remaining."*
  *   *Debrief:* Use the time difference. *"Why did Table 1 finish in 5 minutes and Table 3 take 30? Was Table 1 smarter, or just luckier in the card draw?"* (Usually luckier card draw).

  ### 7. Limitations: What This Game Can't Reproduce

  Be honest in the final 5 minutes. This activity is a clean model; reality is messy.

  1.  **The Endpoint:** In the game, the auction ends when the gavel drops. In organizations, projects drag on for years. There is no "gavel."
      *   *Say:* *"In the game, you knew when it stopped. In the real world, the goalposts move. The 'dollar' becomes a 'million dollar contract' and the rules change mid-bid."*
  2.  **Face & Reputation:** In the game, losing points hurts your prize chance. In reality, walking away costs you your career.
      *   *Say:* *"Here, you lose points. In a firm, if you walk away from a project you championed, you signal incompetence. The 'Second Highest Payer' rule in real life is 'The person who recommended the failed project gets fired.' That makes escalation much harder to stop."*
  3.  **Unknown Values:** In the game, you knew your value (5 or 15). In reality, you don't know if the project is worth 5 or 15. You are bidding blind on *both* your value and theirs.
      *   *Say:* *"This is the hardest part. You don't know if you're the Rational Escalator (15 LP) or the Sunk Cost Victim (5 LP) until it's too late. That uncertainty is why the trap works."*

  ### Summary Checklist for You
  *   [ ] Print 20 Value Cards (15 @ 5LP, 5 @ 15LP).
  *   [ ] Print 5 Banker Scripts.
  *   [ ] Print 22 Prediction Sheets.
  *   [ ] Secure Prize (Gift card/Donation).
  *   [ ] Recruit 2 "Auditor" students (email them beforehand with special instructions).
  *   [ ] Prepare Board Layout for the 3 Columns.

  This design respects their intelligence by adding the information asymmetry layer, forces the emotional experience through the tournament stakes, and gives you the analytical hooks to distinguish the three types of escalation in the debrief.
