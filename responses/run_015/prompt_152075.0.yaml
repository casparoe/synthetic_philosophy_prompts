      *   **Output Format:** Prep sheet (not essay), brainstorm start, list of objections (ordered by likelihood/damage), phrased in their vocabulary (parsimony, empirical adequacy, etc.). For each: strong point, concession, 90-second reply, weakness of reply. Include the "secret fear" objection. Identify the single crucial reply and its vulnerability.
      *   **Tone:** Focused, casual, no bibliographies/reading lists.
