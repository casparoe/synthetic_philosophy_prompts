          *   Weakness: Big leap from math to experience.

      *   *The Secret Fear:* "Is this just IIT with extra steps?" or "Why not Illusionism?" Let's go with "Why not Illusionism/Physicalism?" because it cuts the root. Actually, the prompt says "secretly hoping nobody asks." Usually, that's the one that dismantles the core premise. Let's make it the "Structural Mismatch" objection—why should physical binding maps to phenomenal binding?

