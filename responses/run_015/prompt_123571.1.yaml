  # The Toxin Classification Tree

  **Instructions:** Answer the following questions based on your immediate intuitions about the cases described. Do not worry about philosophical terminology; answer as you would in ordinary conversation. Follow the arrows to find your position.

  ### **Node 1: The Bland Button**
  *Case:* Imagine the "Bland Button" variant. The button press causes no illness, only a tiny inconvenience (like standing up from a chair). You still get the millions if you *intend* at midnight, with no requirement to press.
  *Question:* **Does removing the pain and illness make it easy for you to form the intention tonight, or does the knowledge that you'll have no reason to press the button tomorrow still stop you?**

  *   **A. Removing the pain makes it easy.** → Go to **Leaf 1**.
  *   **B. The lack of a reason tomorrow still stops me.** → Go to **Node 2**.

  ---

  ### **Node 2: The Lockbox**
  *Case:* Imagine the "Lockbox" variant in the Original Toxin case. At midnight, you can pay a small fee to a machine that will physically force you to drink the toxin tomorrow afternoon.
  *Question:* **If you pay the fee and the machine forces you, have you successfully formed the intention the billionaire asked for, or did you just arrange a cause?**

  *   **A. I have successfully formed the intention.** → Go to **Node 3**.
  *   **B. I just arranged a cause; I didn't intend to drink.** → Go to **Node 4**.

  ---

  ### **Node 3: The Binding Rationality**
  *Case:* Continue with the Lockbox variant where paying counts as intending.
  *Question:* **Is it rational to pay the small fee to the machine?**

  *   **A. Yes, it is rational to pay.** → Go to **Leaf 2**.
  *   **B. No, it is irrational to pay.** → Go to **Leaf 3**.

  ---

  ### **Node 4: The Original Rationality**
  *Case:* Return to the Original Toxin case (no machine). Suppose, somehow, you *have* formed the intention at midnight.
  *Question:* **When tomorrow afternoon arrives and the money is already in your account, is it sensible to actually drink the toxin?**

  *   **A. Yes, it is sensible to drink.** → Go to **Node 5**.
  *   **B. No, it is not sensible to drink.** → Go to **Node 6**.

  ---

  ### **Node 5: The Serial Resolute**
  *Case:* Imagine the "Serial" variant. The offer repeats nightly for a month. You get the money on the *first* night you succeed in intending (and drinking ends the series).
  *Question:* **Does the fact that the offer repeats make it more rational to drink on the first night than if it were a one-time offer?**

  *   **A. Yes, repetition changes the rationality.** → Go to **Leaf 4**.
  *   **B. No, repetition changes nothing.** → Go to **Leaf 5**.

  ---

  ### **Node 6: The Serial Sophisticated**
  *Case:* Continue with the "Serial" variant, assuming you think drinking is *not* sensible (from Node 4).
  *Question:* **Does the fact that the offer repeats allow you to form the intention on night one, even if you know you won't drink?**

  *   **A. Yes, repetition allows the intention.** → Go to **Leaf 6**.
  *   **B. No, repetition doesn't help.** → Go to **Node 7**.

  ---

  ### **Node 7: The Magic Switch**
  *Case:* Imagine a "Magic Switch" variant of the Original case. You can flip a switch in your mind tonight that guarantees you will drink tomorrow, bypassing your normal reasons. You know it works.
  *Question:* **If you flip the switch, do you count as intending to drink, or have you just programmed yourself?**

  *   **A. I count as intending.** → Go to **Leaf 7**.
  *   **B. I have just programmed myself.** → Go to **Leaf 8**.

  ---

  # Scoring Key & Position Map

  | Leaf | Position Name | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **1** | **Hedonic Block** (Unnamed) | You must claim that pain is the *only* barrier to intention, ignoring the lack of reasons. |
  | **2** | **Externalist Solution** | You must claim that removing your own freedom to choose is a valid way to form an intention. |
  | **3** | **Binding Paradox** (Empty) | *Unoccupied Cell.* You claim binding works but paying for it is irrational, despite the massive reward. |
  | **4** | **Iterative Resolute** | You must claim that repeating a one-shot puzzle changes the fundamental rationality of the act. |
  | **5** | **Strict Resolute** (Gauthier-style) | You must claim it is rational to perform an act that benefits you only in the past. |
  | **6** | **Reputational Sophisticated** | You must claim you can intend to do something you know you won't do, provided it helps later. |
  | **7** | **Volitional Planning** (Bratman-style) | You must claim you can intend to do what you know is irrational, simply by adopting a policy. |
  | **8** | **Cognitive Constraint** (Velleman-style) | You must claim you never truly intend to do anything you believe you will not do for reasons. |

