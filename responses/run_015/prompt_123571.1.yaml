  # Instructor's Notes on Logical Space & Variants

  **1. Decision Theory (CDT vs. EDT)**
  Per your second constraint: The dispute between Causal and Evidential Decision Theory **collapses into Node 4**.
  *   **CDT** typically leads to **Node 4B** (Drinking is causally useless once the money is secured).
  *   **EDT** typically argues *intending* is evidence of a type that gets money, but often still concedes **Node 4B** (the act itself remains causally useless).
  *   Neither theory independently solves the *intention formation* problem without additional assumptions about the nature of intention (Node 1 or Node 7). Therefore, no separate node was created; the "Rationality of Drinking" node captures the decision-theoretic output.

  **2. Variant Discriminatory Power**
  *   **Bland Button (Node 1):** **High Discrimination.** It cleanly separates views that think intention is blocked by *aversion* (Leaf 1) from views that think it is blocked by the *Intention-Belief Thesis* (Node 2+). Leaf 1 is effectively empty in the literature, confirming the puzzle is about reasons, not pain.
  *   **Lockbox (Node 2 & 3):** **High Discrimination.** It separates Internalists (Intention requires internal mental state) from Externalists (Intention is about outcome security). Leaf 3 is marked empty because no coherent position holds that binding satisfies the condition *but* paying for it is irrational.
  *   **Serial (Node 5 & 6):** **Low Discrimination (Mostly Idle).** In the specific formulation provided (series ends on first success), reputation cannot accumulate. If I fail Night 1, I am a "non-drinker" for Night 2, which does not help. Leaves 4 and 6 are flagged as unstable; many philosophers argue iteration transforms this into a Prisoner's Dilemma, which is a different logical problem than the single-shot Toxin. If your students find these leaves attractive, press them on *why* repetition matters if the game ends upon success.

  **3. Indistinguishable Leaves**
  *   **Leaf 4 (Iterative Resolute) vs. Leaf 5 (Strict Resolute):** These are flagged as potentially indistinguishable. If one holds a "Resolute" view (Node 4A), one typically argues that rationality is time-neutral. If it is time-neutral, iteration (Node 5) should not change the answer. Leaf 4 is kept only for those who think resolute choice requires a *habit* to sustain it, but this borders on collapsing into the Serial Sophisticated view.

  **4. Required Positions**
  *   **Planning-style:** Captured at **Leaf 7** (Volitional Planning).
  *   **Intention Not Under Will:** Captured at **Leaf 8** (Cognitive Constraint).
