prompt: |-
  My friend Theo and I got into it a couple of nights ago, two drinks in, about the classic utility-monster objection, and I think between us we built an argument that proves way too much. I can't find the bad step and it's been bugging me since.

  Setup so this is self-contained. Cardinal welfare scales -- the numbers you plug into a utilitarian sum -- are normally said to be unique only up to positive affine transformation: for a single person, replacing w with a·w + b (a > 0) preserves everything about that person's welfare levels and differences. That's supposed to be why it makes no difference whether you measure Bea's welfare in utils or micro-utils; the second just multiplies all her numbers by a million and changes nothing about Bea.

  Here's the arguement:

  (1) A change of units represents no difference in the facts. If two assignments of numbers to people's welfare differ only by per-person positive affine transformations, they represent the same situation, so a correct moral theory cannot give different verdicts depending on which assignment you happen to use.

  (2) What total utilitarianism recommends is determined by the sum of the numbers.

  (3) So total utilitarianism's verdicts depend on the units. Concretely: three people, a fixed stock of 100 units of some resource, each with the same diminishing-returns welfare function (say welfare = square root of resources). Measure everyone in the same units and the sum-maximizing split is 33/33/33. Now measure only Amara in micro-utils, multiplying her numbers by a million, and the sum-maximizing split hands her essentially all 100 units and leaves the other two with basically nothing.

  (4) Which means a utility monster can be manufactured out of anybody. Take a completely ordinary person, grade their welfare on a fine enough ruler, and the utilitarian sum says to sacrifice everyone else to them. You never had to suppose a creature with a bizarrely efficient psychology; you just needed a smaller unit for that one person.

  (5) But being a utility monster is supposed to be a substantive possibility about a creature's psychology -- that there could be someone who gets vastly more welfare out of any sacrifice than everyone else loses. That can't depend on which ruler we picked.

  (6) So either the utility monster objection is empty -- a complaint about bookkeeping rather than about what utilitarianism would have us do -- or utilitarianism's recommendations about distribution are indeterminate, and the decades of fighting between utilitarians and their critics about distribution was never about anything.

  (7) Both of those are absurd. The objection obviously has teeth, people on both sides feel its force, and it isn't a units quibble. And utilitarians plainly do say substantive, determinate things about distribution.

  So which step do I reject? I'd give up almost anything before I accept (6), but I also really don't want to say that the fine-grainedness of your ruler can change what morality requires of you. Name the step, say why it looked fine, and then price the alternatives: for each candidate thing to give up, what does it commit me to downstream -- in population ethics, in how I think about interpersonal tradeoffs generally, wherever the cost shows up -- and which of those bills would I regret later?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** The user and their friend Theo discussed the "utility monster" objection to utilitarianism.
      *   **Core Argument:** They constructed an argument suggesting that *anyone* can be turned into a utility monster simply by changing the units of measurement (positive affine transformation) for that specific person.
      *   **The Dilemma:** This implies either the utility monster objection is trivial (just about units) or utilitarianism is indeterminate (depends on arbitrary units). Both seem absurd.
      *   **The Task:** Identify the flawed step in the argument, explain why it looked plausible, and evaluate the costs of rejecting alternative steps (the "price" of each option).

  2.  **Deconstruct the Argument:**
      *   (1) *Invariance Principle:* Moral verdicts shouldn't change based on arbitrary unit choices (positive affine transformations per person).
      *   (2) *Total Utilitarianism Definition:* Verdicts are determined by the sum of welfare numbers.
      *   (3) *Unit Dependence:* Changing units for one person changes the sum, thus changing the verdict (e.g., giving all resources to the person measured in micro-utils).
      *   (4) *Manufactured Monster:* Therefore, anyone can be a utility monster via unit choice.
      *   (5) *Substantive Monster:* Real utility monsters are supposed to be about psychology, not units.
      *   (6) *Conclusion:* Either the objection is empty (bookkeeping) or utilitarianism is indeterminate.
      *   (7) *Reductio:* Both horns are absurd.

  3.  **Identify the Flaw:**
      *   The core issue lies in the interpretation of **Interpersonal Comparisons of Welfare**.
      *   Step (1) says: "For a *single person*, replacing $w$ with $a \cdot w + b$ preserves everything." This is standard decision theory (von Neumann-Morgenstern).
      *   Step (3) applies this *per-person* independently across people. It says: "Measure everyone in the same units... Now measure only Amara in micro-utils."
      *   *The Catch:* Classical Utilitarianism requires **interpersonally comparable** welfare scales. You cannot arbitrarily rescale one person's utility function relative to another's without changing the *facts* about how their welfare compares.
      *   If welfare is only unique up to affine transformation *per individual*, then summing them is mathematically meaningless (like adding meters to seconds). To sum them, you need a **common scale**.
      *   Therefore, Step (1) is subtly misleading in the interpersonal context. While true for *intrapersonal* choice, it fails for *interpersonal* aggregation unless we fix the scale across persons.
      *   Alternatively, Step (2) is the target. Total Utilitarianism *cannot* just sum numbers unless those numbers are already calibrated to a common zero and unit.
      *   The "Utility Monster" objection (Nozick) assumes the monster *actually* gets more utility per resource, not that we just *label* it so.
      *   *The Bad Step:* It's primarily **Step (1)** as applied to the interpersonal case, or **Step (3)**'s assumption that you can just "measure only Amara in micro-utils" while keeping the moral situation identical. If you change Amara's units relative to Bob's, you have changed the *interpersonal comparison facts*, which are substantive facts for a utilitarian.

  4.  **Evaluate the Options (Pricing the Alternatives):**

      *   **Option A: Reject Step (1) [The Invariance Principle across persons].**
          *   *Why:* Interpersonal comparisons require a fixed scale. You can't rescale one person without changing the moral facts.
          *   *Cost:* Commits you to the existence of objective, cardinal, interpersonally comparable welfare. This is metaphysically/epistemologically heavy. How do we measure "one unit of Bea's welfare = one unit of Amara's welfare"? Neuroscience? Preference satisfaction ratios?
          *   *Downstream:* Population ethics becomes tractable (we can sum), but measurement becomes hard.

      *   **Option B: Reject Step (2) [Total Utilitarianism's Summation].**
          *   *Why:* Maybe utilitarianism isn't about summing raw numbers but about satisfying preferences or equalizing marginal welfare.
          *   *Cost:* Moves away from Classical Total Utilitarianism. Might lead to Prioritarianism or Egalitarianism.
          *   *Downstream:* Solves the monster issue (marginal utility matters, not total sum), but changes the theory fundamentally.

      *   **Option C: Reject Step (3) [The Claim that changing units changes the situation].**
          *   *Why:* This is the most direct fix. Changing Amara's units *does* change the representation of the moral facts if utilitarianism is true. The "situation" includes the interpersonal ratios.
          *   *Cost:* Admit that "welfare numbers" aren't just arbitrary labels; they carry weight.
          *   *Downstream:* Same as Option A essentially.

      *   **Option D: Accept Step (6) [The Objection is Empty/Indeterminate].**
          *   *Why:* Maybe the user is right, and the debate *was* confused.
          *   *Cost:* High. Dismisses decades of philosophy. Makes utilitarianism look arbitrary.
          *   *Downstream:* Nihilism about distribution?

  5.  **Refining the Diagnosis:**
      *   The argument conflates *intrapersonal* scale invariance with *interpersonal* scale invariance.
      *   Standard welfare economics says: For *one* agent, $U$ and $aU+b$ are equivalent. For *social welfare functions* (like Utilitarianism), we need **level comparability** or at least **unit comparability** across agents.
      *   If we assume **Unit Comparability** (we know what "1 util" means for everyone), then we cannot arbitrarily multiply Amara's utils by a million. That would be a false description of the world.
      *   If we assume **Non-Comparability**, then Utilitarianism is indeed impossible/indeterminate (Step 6).
      *   Most Utilitarians *must* assume Comparability. Therefore, Step (1) is the culprit when extended to the interpersonal case. You cannot treat interpersonal scaling as arbitrary if you want to sum.

  6.  **Drafting the Response:**
      *   **Acknowledge the quality of the argument:** It's a sharp reconstruction of a common confusion in welfare economics.
      *   **Pinpoint the error:** Step (1) is true for *intrapersonal* rationality but false for *interpersonal* aggregation *if* you want to sum. To sum, you need a common currency. Changing Amara's units changes the *facts* about her welfare relative to others.
      *   **Explain the "Price":**
          *   *Rejecting (1):* Commits to robust interpersonal comparability. Hard to measure, metaphysically demanding.
          *   *Rejecting (2):* Abandons Total Utilitarianism for Prioritarianism or Egalitarianism (diminishing marginal utility of resources, not just welfare).
          *   *Rejecting (3):* Admits that the "unit choice" isn't arbitrary; it's a claim about reality.
      *   **Address the Utility Monster specifically:** Nozick's monster isn't about units; it's about the *shape* of the welfare function (constant/Increasing marginal utility vs. diminishing). The argument confuses *scale* (units) with *efficiency* (conversion of resource to welfare).
      *   **Recommendation:** Reject Step (1) in its interpersonal guise. Embrace the metaphysical cost of comparability. It's the standard utilitarian move.

  7.  **Self-Correction/Nuance Check:**
      *   Wait, is it Step (1) or Step (3)? Step (1) says "If two assignments... differ only by per-person positive affine transformations, they represent the same situation."
      *   If Utilitarianism is true, two assignments that differ by *interpersonal* scaling do *not* represent the same situation. They represent different claims about who benefits more.
      *   So Step (1) is the false premise *given the context of Utilitarianism*.
      *   However, Step (1) is often defended by welfarists who deny interpersonal comparability. If you deny comparability, you can't be a Total Utilitarian. So the argument proves: **You cannot be a Total Utilitarian AND deny interpersonal comparability.**
      *   The user's argument essentially proves that Total Utilitarianism *requires* interpersonal comparability. If you assume you can rescale freely (non-comparability), Total Utilitarianism breaks.
      *   So the "Bad Step" is assuming (1) is compatible with (2).
      *   I need to make sure I explain *why* (1) looks right (because it's true for individual decision theory) but fails here.

  8.  **Final Plan:**
      *   Validate the argument (it's a known problem in social choice theory).
      *   Identify Step (1) as the breakdown point when moving from intrapersonal to interpersonal.
      *   Explain the distinction between *ordinal*, *cardinal unit*, and *cardinal level* comparability.
      *   Price the alternatives:
          *   Keep (1) -> Lose Utilitarianism (go Agnostic/Relativist).
          *   Keep (2) -> Lose (1) (Accept Comparability).
          *   Nuance on the Utility Monster (it's about marginal utility curves, not scaling).
      *   Conclude with advice: Bite the bullet on Comparability.

  9.  (Self-Correction during drafting): I should clarify that the "Utility Monster" objection is usually about *marginal* utility, not total sum scaling. Nozick's monster converts resources to utility more efficiently. The user's argument creates a "Fake Monster" via scaling. Distinguishing these is crucial. The user's argument shows that *without fixed units*, the concept of a monster is meaningless. This supports the idea that Utilitarians *must* believe in fixed units.

  10. **Final Polish:** Ensure tone is respectful and philosophically precise. Use terms like "Interpersonal Comparisons of Utility" (ICU). Distinguish between *representation* and *reality*.

  *(Self-Correction on Step 1 vs Step 3)*: Step 1 says "If two assignments... represent the same situation." Step 3 says "So verdicts depend on units." The real clash is that for a Utilitarian, assignments that differ by interpersonal scaling do *not* represent the same situation. So Step 1 is false *for a Utilitarian*. But Step 1 is often taken as a premise of *measurement theory*. The tension is between Measurement Theory (individual) and Ethics (aggregate). I will frame it as rejecting the unrestricted version of (1).

