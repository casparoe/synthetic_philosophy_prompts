prompt: |-
  Hi — I'm one of three people writing the text for a small permanent gallery on the history of medicine at a regional science museum. My background is exhibit design, not history, and our de facto historian is a board member who mostly communicates by writing sigh in the margins of my drafts. We've got roughly forty wall panels, a twelve-foot timeline, and an audio-guide script to get done before we open in eight months, so this is a call I'm making two or three times a week, not once. Panels are about ninety words, no footnotes, read mostly by school groups and occasionally quoted by the local paper; the director signs everything off, and anything that looks like picking a fight goes to our lay advisory board. I get maybe fifteen minutes per panel and I can't run to the historian everytime.

  What I want is an actual procedure: the questions in order, what counts as an adequate answer to each, where it stops with a this needs a rewrite, where it stops with a this is a values call, send it upstairs, and where it says leave it alone because the honest version costs more than it buys. I've read a little about the whig interpretation of history — Butterfield's 1931 book, and the general complaint that telling the past as a march toward us flatters the present and falsifies the past — and it's easy to nod at in the abstract and weirdly hard to catch in my own sentences, so I need it operationalized into something I can run on a draft. A few things I want the procedure to handle, and please tell me which of my home-made distinctions are real and which are junk: the martyr frame, where someone was right, was laughed at, and died unappreciated, which I suspect is just whig history with a victim in it; the they almost got it habit, describing past actors as groping toward our answer; my own favourite move, the myth-busting panel, no, people in the middle ages didn't think the earth was flat, which I'm now worried is itself a progress story in which we're the enlightened ones and the past is a crowd of rubes; the timeline, which is nothing but milestones and might be the most whiggish object in the room; and panels where what was progress for one group was straightforwardly loss for another. I've been using a rough test I call the swap test: if the alternative that actually lost had won instead, and my panel still reads basically the same with the names changed, then I haven't written history, I've written a just-so story. Is that the right test, is there a better one, and what should I do when a true correction would eat forty of my ninety words and lose a ten-year-old?

  Then run the finished procedure on three things. First, my draft panel on the doctor in an 1840s Vienna maternity ward who made the staff wash their hands, was ignored, and ended up in an asylum: I want it to be moving but I think it's currently the martyr frame, so tell me what it should say instead. Second, the twelve-foot timeline: should it exist at all, and if it does, what does a non-whig timeline look like in chunks that short, given I can't run a second rail of roads not taken the whole way without loosing the school groups entirely. Third, the one I'll like least: the flat-earth myth-busting panel. If your procedure says it's smug in the same way the whig panels are smug, say so plainly and tell me what to do with it, because it's the panel I'm proudest of. And there's a fourth one I want flagged rather than solved — a panel on a local surgeon who pioneered a technique in the 1930s and also operated on people without asking them — where I want the procedure to say out loud that this stopped being a question it can answer.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Exhibit Designer (not a historian).
      *   **Context:** Small permanent gallery on history of medicine, regional science museum.
      *   **Team:** 3 writers, 1 de facto historian (board member, passive-aggressive margin sighs), 1 Director (signs off), 1 Lay Advisory Board (handles "fighting" content).
      *   **Constraints:** 40 wall panels (~90 words each), 12-foot timeline, audio guide. 8 months to open. 15 minutes per panel max. Audience: School groups, local press.
      *   **Problem:** Needs an *operational procedure* to detect and fix "Whig History" (history as inevitable progress toward the present) without getting bogged down in academic nuance or blowing the word count.
      *   **Specific Concerns:**
          *   "Martyr Frame" (right but ignored/died sad).
          *   "They Almost Got It" (groping toward our truth).
          *   "Myth-Busting" (We are smart, they were dumb).
          *   Timeline (inherently Whig?).
          *   Progress/Loss trade-offs (good for some, bad for others).
          *   "Swap Test" (User's current heuristic).
      *   **Deliverables:**
          1.  A step-by-step procedure (questions, thresholds, escalation paths).
          2.  Evaluation of User's distinctions (Martyr, Almost Got It, Myth-Busting, Timeline, Swap Test).
          3.  Application of procedure to 4 specific cases:
              *   Semmelweis (1840s Vienna, handwashing, asylum).
              *   The 12-foot Timeline.
              *   Flat Earth Myth-Busting panel.
              *   Local Surgeon (1930s innovation + non-consensual surgery) -> Flag as "Values Call/Escalate."

  2.  **Deconstruct "Whig History" for Exhibit Design:**
      *   Whig history isn't just "progress happened." It's "progress was *inevitable* and *we* are the culmination."
      *   For a 90-word panel, we can't write nuanced academic history. We need *honest simplification*, not *distorting simplification*.
      *   The goal is *contextualization*, not just *celebration*.

  3.  **Develop the Procedure (The "Whig-Check"):**
      *   Needs to be fast (15 mins/panel).
      *   Needs clear stop/go/escalate points.
      *   *Step 1: Agency.* Who is driving the change? (Great Man vs. Context).
      *   *Step 2: Motivation.* Why did they do it? (Modern logic vs. Contemporary logic).
      *   *Step 3: Outcome.* Was it a straight line? (Losses/Contingency).
      *   *Step 4: Voice.* Who is speaking? (Present judgment vs. Past experience).
      *   *Escalation:* When does it become a values call? (Harm, ethics, contested legacy).

  4.  **Evaluate User's Distinctions:**
      *   *Martyr Frame:* Real. It's Whig history with tragedy. It implies the truth was obvious and only stupidity blocked it.
      *   *They Almost Got It:* Real. It denies past actors their own intellectual coherence.
      *   *Myth-Busting:* Real/Risky. Often reinforces present superiority.
      *   *Timeline:* Real. Linear time implies progress. Needs mitigation.
      *   *Swap Test:* Good, but needs refinement. It tests for *determinism*.

  5.  **Drafting the Procedure (Iterative refinement):**
      *   *Constraint Check:* 90 words is *tiny*. I need to make sure the procedure doesn't demand 200 words to fix a Whig error.
      *   *Escalation:* The "Historian" is useless (sighs). The "Director" signs off. The "Board" handles fights. I need to tell the user when to bypass the Historian and go to the Director/Board.
      *   *The "Cost-Benefit" of Truth:* If explaining the nuance kills the readability for a 10-year-old, is it worth it? Yes, but simplify the nuance, don't delete it.

  6.  **Applying to the Four Cases:**

      *   **Case 1: Semmelweis (The Martyr).**
          *   *Current:* He was right, they were stupid, he died sad.
          *   *Fix:* Why were they stupid? (Germ theory didn't exist). Why did he fail? (Social hierarchy, not just ignorance).
          *   *Word Count:* Tight. Focus on the *barrier*, not just the *sadness*.

      *   **Case 2: The Timeline.**
          *   *Problem:* Linear = Progress.
          *   *Fix:* Can't remove linearity (it's a timeline). But can change *labels*. Instead of "Discovery of X," use "Debate over X" or "Impact of X." Add "Dead Ends" or "Costs."
          *   *Constraint:* 12 feet. Visuals matter.

      *   **Case 3: Flat Earth (Myth-Busting).**
          *   *Problem:* "We are smart, they were dumb."
          *   *Fix:* Shift focus. Why did they think that? (Sensory evidence). Why do we think this? (Education).
          *   *Hard Truth:* This panel might need to be cut or radically changed. It's often a "look how far we've come" trap.

      *   **Case 4: Local Surgeon (Ethics/Escalation).**
          *   *Problem:* Innovation vs. Harm.
          *   *Action:* This is a "Values Call." The procedure must flag this as beyond the designer's pay grade. It needs the Board/Director.

  7.  **Refining the Tone:**
      *   The user is stressed, pragmatic, and intelligent. They don't need academic theory; they need a workflow.
      *   Tone should be professional, direct, slightly empathetic to the "sighing historian" situation, but firm on the procedure.
      *   Avoid jargon where possible, or define it operationally.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too long?
      *   *Fix:* Make it a checklist.
      *   *Critique:* Did I answer the "Swap Test" question?
      *   *Fix:* Validate it, but add a "Context Test" to accompany it.
      *   *Critique:* The Semmelweis rewrite needs to be under 90 words.
      *   *Fix:* Draft it tightly.
      *   *Critique:* The Flat Earth advice needs to be blunt.
      *   *Fix:* Tell them their pride is the warning sign.

  9.  **Final Polish:** Check against all constraints (90 words, 15 mins, escalation paths). Ensure the distinction between "Rewrite," "Escalate," and "Leave Alone" is clear. (Proceed to generate output).

  *(Self-Correction on the Historian)*: The user says the historian "mostly communicates by writing sigh in the margins." I should advise the user on how to use the procedure to *force* specific feedback from the historian or bypass them when the procedure says "Escalate."

  *(Self-Correction on Word Count)*: 90 words is extremely short. Roughly 4-5 sentences. The procedure must acknowledge that *omission* is sometimes the only way to avoid Whiggism if nuance doesn't fit. But *distortion* is not allowed.

  *(Final Plan)*:
  1.  Validate the User's distinctions (Real vs. Junk).
  2.  Present the "Whig-Check Protocol" (5 steps + Escalation).
  3.  Apply to Semmelweis (Rewrite).
  4.  Apply to Timeline (Modification).
  5.  Apply to Flat Earth (Hard truth/Cut or Pivot).
  6.  Apply to Surgeon (Escalation Flag).
  7.  Closing encouragement.cw
answer: |-
  This is a triage situation. You do not have time for historiography; you have time for damage control. You need a filter that catches the worst distortions without paralyzing your production line.

  Here is the operational procedure, followed by the evaluation of your distinctions, and finally the application to your four specific problems.

  ### Part 1: The Whig-Check Protocol (15-Minute Version)

  Run every draft through these five questions in order. If you fail a step, apply the fix. If the fix breaks the word count or creates a conflict, follow the Escalation Path.

  **1. The Motivation Test**
  *   **Question:** Does the text explain *why* the historical actor did what they did using *their* logic, or does it imply they were trying to do what *we* do?
  *   **Fail State:** "He tried to cure the disease but didn't have the right tools." (Implies he wanted modern medicine).
  *   **Fix:** "He sought to balance the body's humors..." (Uses their logic).
  *   **Stop/Rewrite:** If you cannot state their goal in their terms within 15 words, rewrite the opening sentence.

  **2. The Contingency Test (Your Swap Test)**
  *   **Question:** If the 'losing' idea had won, would the world look different, or just like today with different names?
  *   **Fail State:** The text implies the outcome was inevitable.
  *   **Fix:** Insert one word of uncertainty: "argued," "proposed," "contested," rather than "showed," "proved," "discovered."
  *   **Stop/Rewrite:** If the text reads like a prophecy fulfilled, change the verbs.

  **3. The Cost Test**
  *   **Question:** Does this advancement mention who paid for it? (Money, pain, loss of access, loss of tradition).
  *   **Fail State:** "This new vaccine saved millions."
  *   **Fix:** "This new vaccine saved millions, though testing required..." or "access remained limited to..."
  *   **Escalate:** If acknowledging the cost makes the panel too dark for the Director's taste, flag for **Values Call**.

  **4. The Authority Test**
  *   **Question:** Who is the hero? The Individual Genius or The Community/Context?
  *   **Fail State:** One name gets the verb. "Pasteur discovered..."
  *   **Fix:** Shift to the work. "Work in this lab demonstrated..." or "Building on earlier findings..."
  *   **Leave Alone:** If shifting to context makes the sentence unreadable for a 10-year-old, keep the name but add "and colleagues."

  **5. The Presentism Test**
  *   **Question:** Are we judging them by our morals or knowledge?
  *   **Fail State:** "Sadly, they did not know..." or "Unfortunately, the treatment was cruel."
  *   **Fix:** Describe the effect, not the judgment. "The treatment caused pain," not "cruel."
  *   **Escalate:** If the practice violates current human rights standards (e.g., non-consensual surgery), do not write this yourself. **Flag for Advisory Board.**

  **Escalation Path:**
  *   **Rewrite:** You can fix it in 15 mins without changing the core message.
  *   **Values Call (Send Upstairs):** The text requires making a moral judgment on behalf of the museum (e.g., "This was bad," "This was good"). This is the Director/Board's job, not yours.
  *   **Leave Alone:** The nuance costs 30 words you don't have, and the distortion is harmless (e.g., simplifying a complex chemical process).

  ---

  ### Part 2: Evaluation of Your Distinctions

  *   **The Martyr Frame:** **Real.** It is Whig history with a tragedy arc. It assumes the truth was obvious and only social stupidity prevented its acceptance. It absolves the past of intellectual complexity.
  *   **The "They Almost Got It" Habit:** **Real.** It denies past actors their own intellectual coherence. It treats them as incomplete versions of us rather than complete versions of themselves.
  *   **The Myth-Busting Panel:** **Real/Risky.** You are correct to be worried. "No, they didn't think the earth was flat" often functions as "Aren't we smart to know that." It creates a strawman of the past to flatter the present.
  *   **The Timeline:** **Real.** A linear line with dates is inherently Whiggish. It implies time moves in one direction toward *now*.
  *   **The Swap Test:** **Valid.** It is an excellent heuristic for determinism. If the outcome looks inevitable, you have written mythology, not history.

  ---

  ### Part 3: Applying the Procedure

  #### 1. The Semmelweis Panel (The Martyr Frame)
  **Diagnosis:** Fails Motivation Test and Contingency Test.
  **Current likely draft:** "Ignaz Semmelweis realized doctors were killing mothers. He told them to wash hands. They laughed at him. He died in an asylum. Later, germ theory proved him right."
  **Problem:** Makes the staff villains and Semmelweis a modern man trapped in the past. Ignores *why* they laughed (hierarchy, lack of germ theory).
  **The Fix:** You must restore their logic. They weren't stupid; they were operating on different data.
  **Word Count Constraint:** 90 words.

  **Draft Rewrite:**
  > In 1847, Ignaz Semmelweis noticed more mothers died in wards staffed by doctors than by midwives. He proposed that invisible particles from autopsies were causing infections. He ordered staff to wash hands with chlorine. Mortality dropped sharply.
  >
  > But Semmelweis challenged the medical hierarchy. Doctors felt insulted by the suggestion they caused harm. Without germ theory to explain *why* washing worked, his peers rejected his data. Semmelweis suffered a breakdown and died in an institution. His findings were only accepted decades later, after bacteria were discovered.
  >
  > **Why this works:** It explains the resistance (hierarchy + lack of theory), not just "they laughed." It uses "proposed" and "rejected" (Contingency) rather than "realized" and "ignored."

  #### 2. The Twelve-Foot Timeline
  **Diagnosis:** Fails Contingency Test by default.
  **Should it exist?** Yes. School groups need anchors. Removing it causes more confusion than it solves.
  **The Fix:** You cannot change the line, but you can change the *nodes*.
  **Procedure:**
  1.  **Limit "Firsts":** No more than 30% of nodes should be "First discovery of X."
  2.  **Add "Costs" or "Debates":** Every third node should be a social consequence or a dead end.
      *   *Instead of:* "1928: Penicillin Discovered."
      *   *Try:* "1928: Penicillin Discovered. 1940s: Mass Production Begins." (Shows gap/effort).
      *   *Add:* "1950s: Antibiotic Resistance Noted." (Shows progress isn't a straight line).
  3.  **Visual Mitigation:** If possible, use color coding. Blue for "Medical Discovery," Red for "Social Impact/Cost."
  4.  **The "Now" Trap:** Do not end the timeline at "Today." End it at "Ongoing Challenges." This signals the story isn't finished.

  #### 3. The Flat-Earth Myth-Busting Panel
  **Diagnosis:** Fails Presentism Test and Authority Test.
  **Hard Truth:** You are right to be worried. This panel is usually a vanity project for the present. It says "We are rational, they were not."
  **Procedure Verdict:** **Rewrite or Cut.**
  **Why:** In a *History of Medicine* gallery, this is a distraction unless it links to anatomy or navigation. If it stays, it must not be about "stupidity."
  **The Pivot:** Focus on *evidence*, not *intelligence*.
  **Draft Concept:**
  > "Did people in the Middle Ages think the Earth was flat? Most educated writers knew it was spherical. They relied on ancient Greek mathematics, not just sight.
  >
  > So why does the myth persist? In the 19th century, writers invented the story of the 'Flat Earth' to make the past look darker and the present look brighter.
  >
  > **Lesson:** History is not just about what happened, but how we remember it."
  **Why this works:** It busts the myth *and* busts the Whig history that created the myth. It turns the panel into a meta-lesson on historiography (suitable for older students) without calling the past "rubes." If you can't fit this nuance in 90 words, **cut the panel**. It is not essential to medicine.

  #### 4. The Local Surgeon (1930s Innovation + Non-Consensual Surgery)
  **Diagnosis:** Fails Cost Test and Presentism Test.
  **Procedure Verdict:** **VALUES CALL. SEND UPSTAIRS.**
  **Reasoning:** This is no longer a question of "Whig vs. Context." This is a question of institutional liability and ethical stance.
  *   If you highlight the innovation without the harm, you are complicit in erasure.
  *   If you highlight the harm without the innovation, the local family/donors may revolt.
  *   If you balance them, you are making a moral judgment ("This was wrong") that the Director must own.
  **Action:** Do not draft the text. Write a memo to the Director: *"Panel 34 involves non-consensual surgery. Standard historical practice requires acknowledging harm. This may conflict with local legacy expectations. Request Advisory Board review before text is written."*
  **Why:** This stops the "sighing historian" from making you the bad guy. You are flagging a risk, not asking a history question.

  ### Summary for your Workflow
  1.  **Semmelweis:** Rewrite using the draft above (focus on hierarchy/theory gap).
  2.  **Timeline:** Keep it, but ensure 30% of nodes are "consequences/debates," not just "discoveries."
  3.  **Flat Earth:** Pivot to "Why the myth exists" (19th-century propaganda) or cut it. Do not run a "We are smart" panel.
  4.  **Local Surgeon:** Stop. Send memo to Director. Do not write copy.

  This procedure protects you. If the historian sighs at the Semmelweis rewrite, you can point to the **Motivation Test**. If the Director questions the Surgeon memo, you point to the **Escalation Path**. You are not doing history; you are managing risk.
