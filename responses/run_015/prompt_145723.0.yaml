      *   *Normative Claim:* Is guilt "better"? Therapeutic literature often says yes (guilt motivates repair, shame motivates hiding). But is this universal?
      *   *Sociological Claim:* Can cultures choose? This is the weak link. Emotions aren't policy switches.
      *   *Tautological Claim:* If we define guilt *as* act-focused and shame *as* self-focused, then saying "act-focused is better" is just defining terms to win an argument.

  3.  **Evaluate the "Culture Can Choose" Argument:**
      *   *Can they choose?* No, not deliberately. Emotions are deep-seated social technologies, not laws. You can incentivize behaviors, but you can't legislate internal affective states.
      *   *Should they choose?* It depends on the goal. Guilt is better for individual mental health and specific restitution. Shame is better for group cohesion and boundary maintenance. A society needs both.
      *   *The Stand:* The slogan is a useful heuristic, not a law of nature. The idea that a culture can "upgrade" to guilt is a category error.

