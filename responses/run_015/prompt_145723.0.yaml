answer: |-
  Here is the breakdown you need. The slogan is a heuristic, not a law of physics. It is useful for therapists, but dangerous for policymakers.

  ### Part 1: The Menu of Readings

  Here are the four distinct claims hiding inside that sentence. Only one of them is robust; the others are fragile or false.

  **1. The Phenomenological Claim (True)**
  *   **The Claim:** This describes how the emotions *feel*. Guilt feels like a focus on a specific behavior ("I lied"); shame feels like a focus on global identity ("I am a liar").
  *   **Status:** **Holds up.** This is the core psychological validity of the slogan. In lab settings, guilt correlates with reparative action; shame correlates with withdrawal or aggression.
  *   **Supports "Culture Can Choose"?** **No.** Describing a feeling does not imply you can engineer it. You can describe gravity, but you cannot legislate it away.

  **2. The Therapeutic/Normative Claim (Mostly True)**
  *   **The Claim:** Guilt is "adaptive" (healthy); shame is "maladaptive" (unhealthy). Guilt leads to repair; shame leads to hiding. Therefore, we should prefer guilt.
  *   **Status:** **Holds up in individual therapy, fails in social cohesion.** For an individual trying to change behavior, guilt is the superior lever. However, shame is the glue of tight-knit communities. It enforces boundaries where laws don't reach. Eliminating shame entirely creates a society of sociopaths who feel bad about acts but have no stake in their social standing.
  *   **Supports "Culture Can Choose"?** **Weakly.** It suggests guilt is *better*, but not that it is *switchable*.

  **3. The Tautological Claim (Circular)**
  *   **The Claim:** By defining guilt as "act" and shame as "self," we rig the game. If "self" is immutable, shame is inherently hopeless. If "act" is mutable, guilt is inherently hopeful.
  *   **Status:** **Logical Trap.** This defines the solution into the premise. It assumes the "self" cannot change (shame) while the "act" can (guilt). In reality, people change who they are all the time.
  *   **Supports "Culture Can Choose"?** **No.** It's a linguistic trick, not a sociological mechanism.

  **4. The Sociological Claim (False)**
  *   **The Claim:** Societies can deliberately "upgrade" from shame-based norms to guilt-based norms.
  *   **Status:** **Fails.** This treats emotions like software updates. Shame and guilt are emergent properties of social structure, not policy choices. Individualistic societies *generate* guilt because the atomized self is the primary unit. Collectivist societies *generate* shame because the group is the primary unit. You cannot have a guilt culture without individualism, and you cannot have individualism without specific economic and historical preconditions.
  *   **Supports "Culture Can Choose"?** **No.** This is the fatal flaw in the argument you're hearing.

  ***

  ### Part 2: The Stand on Cultural Engineering

  **Can a culture choose guilt over shame?**
  **No.** It is a category error.
  A "guilt culture" is not a culture that decided to feel guilt; it is a culture where institutions (courts, churches, markets) handle the *consequences* of acts, leaving the individual to internalize the responsibility. A "shame culture" is one where the community handles the *identity* of the transgressor.
  You cannot legislate this switch. If you try to force guilt norms in a high-context, collectivist environment, you don't get guilt; you get hypocrisy. People will perform the "act-based" apology while retaining the "self-based" stigma privately.

  **Should a culture choose guilt over shame?**
  **No. A binary choice is suicidal.**
  You need guilt for **justice** (proportionate punishment for acts).
  You need shame for **cohesion** (social boundaries and reputation).
  If you maximize guilt, you create a legalistic society where anything not forbidden is permitted, and moral nuance dies.
  If you maximize shame, you create a caste system where redemption is impossible.
  The goal isn't to switch emotions; it's to ensure **guilt has a path to repair** and **shame has a path to reintegration.**

  ***

  ### Part 3: The "Reverse Accountability" Hybrid

  You asked about institutions absorbing guilt while people keep shame private. (e.g., An algorithm flags a violation, the court processes the liability, but the individual carries the stigma).

  **Does this fit the slogan?**
  It fits the *definition*, but it inverts the *health*.
  The slogan says Guilt = Act (Fixable). Shame = Self (Fixed).
  In your hybrid, the Institution takes the "Fixable" part (the liability, the fine, the data point). The Individual is left with the "Fixed" part (the stigma, the identity).

  **Does it blow the distinction up?**
  **Yes, and it creates a dystopia.**
  This is the worst of both worlds. It bureaucratizes the *act* so thoroughly that the individual feels no agency over it (it's just "the system"), but it privatizes the *identity* so intensely that they feel permanently stained.
  *   **Guilt without agency** is just stress.
  *   **Shame without community** is just depression.

  If a court or algorithm absorbs the guilt, it removes the opportunity for the human to make amends. The "debt" is paid to the system, not the victim. But the "shame" remains with the human because the social record is permanent. This creates a class of people who are "guilt-less" (they paid the fine) but "shame-bound" (they are marked). This is the architecture of the modern criminal record or the credit score. It validates the slogan's warning: if you isolate shame from the possibility of repair, you destroy the moral agent.

  ***

  ### Part 4: The Bottom Line (For Your Article)

  Here is the committed stand you need for your deadline:

  **The slogan is psychologically accurate but sociologically naive.**
  It correctly identifies the *mechanism* of the emotions (Act vs. Self), but it falsely implies these are levers a society can pull.

  **The Verdict:**
  1.  **Do not write that cultures can "upgrade" to guilt.** That is technological determinism applied to human affect. It ignores that guilt requires a specific kind of autonomous self that not all cultures prioritize or even recognize.
  2.  **Do not write that shame is inherently toxic.** Shame is the immune system of social trust. Without it, reputation means nothing. The problem isn't shame; it's *permanent* shame.
  3.  **The "Reverse Accountability" model is the enemy.** If your reporting touches on algorithms or institutional justice, argue against this hybrid. When institutions monetize or bureaucratize guilt, they strip humans of the chance to repair the act, leaving them stranded in the shame of the self.

  **The Hook:**
  The slogan "Guilt is what you did, shame is who you are" shouldn't be used to argue for a guilt-based society. It should be used to warn us that **any system which makes "who you are" harder to change than "what you did" is a moral failure.**

  A healthy society doesn't choose guilt over shame. It ensures that guilt leads to restitution, and shame leads to forgiveness. If you remove the restitution, guilt becomes anxiety. If you remove the forgiveness, shame becomes exile.

  Write that. It's the only claim that holds water.
