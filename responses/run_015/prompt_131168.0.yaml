prompt: |-
  Hey — I'm putting together a workshop for a philosophy-of-ideas series I cover (science beat, casual tone), and a friend running a grad seminar needs an in-class game about Berkeley's master argument — that move where he says you can't actually conceive of an unperceived object without sneaking some observer back in. It's 14 students, 80 minutes, movable tables, no tech. I want them to feel the squeeze themselves, not just understand it intellecutally.

  Can you design an activity with two roles: "Architects" try to build a mental model of something existing in total darkness with zero observers, and "Auditors" check each model for hidden perceptual traces — weight, temperature, spatial position, even imaginary shadows. Use paper tokens as points, with Architects losing one every time an Auditor spots a sensory frame. Include a forced round where Architects must describe their object without using any spatial metaphor that implies a viewpoint. They should hit the wall on their own — realizing every attempt smuggles in perception — before anyone names Berkeley's conclusion.

  Then give me the debrief: map each failed attempt onto the steps of the master argument, say honestly which logical feature this game can't reproduce (probably the modal claim about all possible conception?), and predict what goes wrong first run — I think Architects will just assert "it's there but unseen" and Auditors won't know how to press? Please write in American English, and skip citation lists — I just need the design. Oh, and I meant "graduate seminar" but "grad seminar" fits the casual vibe.
