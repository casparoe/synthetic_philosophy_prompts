      *(Self-Correction on Thesis 1)*: Wait, do singularities (collisions) break Thesis 1? In Newtonian mechanics, collisions can be regularized (Sundman), but ejection to infinity in finite time (Painlevé) is theoretically possible in N>3. However, for the Solar System context, we usually treat the ODEs as deterministic where defined. I should acknowledge that Thesis 1 holds *within the domain of definition* of the equations.

      *(Refining Thesis 4)*: The user asks if the probability is "dressed up." I need to be honest. It is a measure of *robustness of the conclusion*, not necessarily a frequency of occurrence in time. It's a "confidence level" on the prediction "Stable," not a "probability of Ejection."

