          *   *Poincaré:* Mathematical obstruction (divergence of series). Not empirical. Showed Thesis 2 fails for the *mathematical model* generally, not just specific data.
          *   *Laskar:* This is the crux. "Solar system is chaotic" is a claim about the *model class* (N-body + GR + approximations).
          *   *Model vs. World:* We never integrate the "world." We integrate a model. Truncation (asteroids, tides, mass loss, GR terms) matters.
          *   *Shadowing:* Shadowing lemmas say a noisy trajectory stays near a true trajectory of the *model*. They do not say the *model* trajectory matches the *planet*. This moves the question up: How good is the model?
          *   *Verdict:* "Chaotic" describes the mathematical structure of the accepted model, not necessarily the ontic state of the planets (though we treat them as isomorphic).

      *   **Section 3: The Arithmetic and Truncation:**
          *   The $10^{-430}$ calculation is correct for the *model*.
          *   Physical truncation: We cannot define initial conditions to that precision physically (quantum limits, asteroid noise, solar mass loss stochasticity).
          *   *The Moral:* It is chaos + model incompleteness. But the "truncation point" cuts deep. If the model doesn't include the physics that operates at the scale of the divergence, the "true trajectory" of the model is physically meaningless.
          *   The Demon inside the *true equations* (if they existed) is fine. The Demon inside the *N-body model* is fine. We are neither. We are stuck with model error + measurement error.

      *   **Section 4: The Core Problem (Thesis 3 vs. 4):**
          *   Thesis 3 fails because there is no compact attractor. Ejection is a boundary condition, not a recurrence.
          *   Thesis 4 (Categorical): This is the Laskar/Gastineau 1% risk.
          *   *The Critique:* Is it a probability of *nature* or a probability of *our ignorance*?
          *   In Bayesian terms, it's epistemic. In Frequentist terms, it requires an ensemble of *universes*. We have one solar system.
          *   The "smearing": If I smear initial conditions by $\epsilon$, and get 1% instability, does that mean 1% chance of instability? Only if the distribution of $\epsilon$ matches the true uncertainty distribution.
          *   *Weight:* It bears weight as a *risk assessment*, not a *frequency prediction*. It tells us the system is "fragile" relative to our knowledge. It is a stability margin, not a propensity.
          *   *Without Thesis 3:* Thesis 4 stands alone as a sensitivity analysis. It says "The question 'Will Mercury be ejected?' is ill-posed; the answer depends on digits we cannot know."

      *   **Section 5: Verdict on the Standard Story:**
          *   Standard story: Chaos = Unpredictable = Random-looking.
          *   This case: Chaos = Unanswerable (regarding specific fate).
          *   It is an anomaly for the standard "ergodic rescue" narrative (Thesis 3).
          *   Theory is silent on: The ontological status of probabilities in single-system, non-ergodic, open-ended dynamical systems. It forces us to admit that some questions are physically meaningless, not just practically hard.

  4.  **Refining the Tone:**
      *   Maintain high technical rigor.
