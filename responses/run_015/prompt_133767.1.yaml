answer: |-
  You have identified one of the central fault lines in modern legal philosophy. The pattern you describe is not an accident; it is the structural result of a system that attempts to serve two masters: **legitimacy** (which requires retributive language) and **efficiency/control** (which requires consequentialist tools).

  Most legal philosophers classify the U.S. system not as purely retributive or consequentialist, but as a **"Mixed Theory"** or, more critically, as **"Limiting Retributivism"** overlaid with **"The New Penology."**

  Here is a reconstruction of the implicit theory, why it creates the contradictions you see, and what your restitution hypothetical reveals about the system's true priorities.

  ### 1. The Implicit Theory: Retribution as Legitimacy, Consequentialism as Administration
  The system does not presuppose a single coherent theory. Instead, it uses retributivism and consequentialism instrumentally at different stages of the process.

  *   **Sentencing (The Retributive Mask):** When a judge imposes a sentence, they use retributive language ("just deserts," "moral culpability"). This is necessary for **legitimacy**. Citizens will not accept a system that punishes innocent people or punishes people disproportionately just to make an example of them. Remorse fits here because, in retributive theory, a remorseful offender is *morally different* from an unremorseful one. They have acknowledged the moral order, thus their "debt" is slightly paid, or their blameworthiness is reduced.
  *   **Parole/Release (The Consequentialist Engine):** When a parole board or algorithm decides on release, the question shifts to "Is this person safe?" This is purely consequentialist (incapacitation and risk management). This is driven by **efficiency**. The state wants to minimize future crime costs. Remorse is often ignored here because static factors (criminal history, age of first arrest) are statistically better predictors of recidivism than dynamic factors (attitude, apologies).
  *   **The Conflict:** You are seeing the seam where the "Moral Justice" mask slips to reveal the "Risk Management" machine underneath. The system claims to punish you for what you *did* (past), but releases you based on what it thinks you *will do* (future).

  ### 2. The Remorse Paradox: Moral Signal or Risk Proxy?
  You asked whether remorse is treated as reduced blameworthiness (retributive) or reduced risk (consequentialist). The answer is **both, opportunistically.**

  *   **In Sentencing:** Remorse is treated as **moral redemption**. If you apologize, you are re-integrating into the moral community. Therefore, you deserve less pain. This is why prosecutors use *lack* of remorse in death penalty phases: it suggests the defendant remains a moral threat to the community's values, regardless of physical risk.
  *   **In Parole:** Remorse is treated as a **risk proxy**. If you admit guilt, you are theoretically more likely to comply with supervision. However, because algorithms prioritize hard data, "soft" data like remorse is often discarded as noise.
  *   **The Inconsistency:** If remorse were purely consequentialist, a remorseful high-risk offender should still be held. If it were purely retributive, an unremorseful low-risk offender should be released once their "debt" is paid. The system does neither consistently. It holds the high-risk remorseful person (consequentialism wins) and punishes the low-risk unremorseful person harshly (retributivism wins).

  ### 3. The Trial Right Tension: Incentive vs. Penalty
  You asked why we protect the right to trial if remorse reduces sentences. This is the most legally fragile part of the hybrid.

  The Supreme Court (e.g., *Mitchell v. United States*) maintains a legal fiction: **Reducing a sentence for a guilty plea is not the same as increasing a sentence for going to trial.**
  *   **The Theory:** The "discount" for pleading guilty is a reward for saving state resources and accepting responsibility. It is not a "penalty" for exercising a right.
  *   **The Reality:** Functionally, it is a "trial penalty." If the baseline sentence is 10 years, and you get 5 for pleading, you lose 5 years by going to trial.
  *   **Why the Protection Exists:** The protection exists to maintain the **constitutional facade of voluntariness**. If the state explicitly punished you for pleading not guilty, it would violate Due Process. By framing it as a "credit for acceptance," the system preserves the *appearance* of fairness while securing the *consequentialist benefit* of plea bargains (efficiency).
  *   **Philosophical Implication:** This proves the system prioritizes **administrative efficiency** over pure desert. A purely retributive system would require a trial to determine the exact quantum of desert. A system that discounts punishment to avoid trials is admitting that "perfect justice" is too expensive.

  ### 4. Is the System Internally Consistent?
  No. It is a **pragmatic kludge**.
  Philosophers like Malcolm Feeley and Jonathan Simon describe this as **"The New Penology."** This theory argues that the system has moved away from punishing individuals based on moral fault (old retributivism) or rehabilitating them (old consequentialism) toward **managing risky populations.**

  *   **Why the inconsistency persists:** Retributive language is kept because it satisfies the public's desire for vengeance and moral order. Consequentialist tools (algorithms, plea bargains) are kept because they are cheaper and easier to administer.
  *   **The Result:** You get a system that speaks like a moral judge but acts like an insurance actuary. When the two conflict (e.g., a low-risk offender who refuses to apologize), the system usually defaults to **control**. It will punish the lack of apology to enforce submission to authority, even if the risk is low.

  ### 5. The Restitution Hypothetical: What Would Change?
  Your proposal to replace remorse with a **negotiated contractual repair agreement (restitution)** is essentially a shift toward **Restorative Justice**. If we made this swap, it would expose three critical truths about the current system:

  1.  **The State is the Victim:** Currently, the system demands remorse *to the state* (via the court), not necessarily to the victim. If you allowed restitution to replace remorse, you would admit that the crime is primarily a harm against a person, not a violation of state authority. The current system resists this because it undermines the state's monopoly on justice.
  2.  **Submission vs. Repair:** Remorse is performative submission. It requires the offender to verbally acknowledge the state's moral authority. Restitution is transactional. If the system rejects restitution in favor of remorse, it proves the system cares more about **authority and compliance** than actual harm repair.
  3.  **Desert is Secondary:** If you allowed offenders to "buy" their way out of punishment via restitution, it would shatter the retributive illusion. Retributivism insists that pain must be endured to balance the moral scales. If a check can balance the scales, then punishment was never about moral desert; it was about **cost recovery and risk mitigation**.

  ### Conclusion
  The pattern you observe presupposes a theory of **Authoritarian Risk Management legitimized by Retributive Rhetoric.**

  *   **Is it retributivist?** Only when it needs to justify harshness or moral condemnation (death penalty, sentencing hearings).
  *   **Is it consequentialist?** Only when it needs to manage populations or save money (parole algorithms, plea bargains).
  *   **Is it consistent?** No. It sacrifices consistency for stability.
  *   **The Restitution Test:** If you replaced remorse with restitution, the system would likely reject it. Why? Because remorse confirms the state's moral power over the offender. Restitution merely settles a debt. The current system is not designed to settle debts; it is designed to assert authority and manage risk.

  Your confusion is not a failure of understanding; it is a correct perception of a system that is philosophically bilingual but morally monolingual. It speaks the language of justice to the public, but the language of logistics to itself.
