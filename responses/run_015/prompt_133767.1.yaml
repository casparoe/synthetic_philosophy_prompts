  8.  *(Self-Correction during drafting)*: I initially thought about calling it "Utilitarian." But that's not quite right. It's more "Managerial." I should use the term "The New Penology" to describe the risk-assessment side. I also need to make sure I don't just say "it's mixed." I need to explain *why* the mix creates the specific contradictions the user saw.

      *   *Refinement on the Trial Right:* The legal fiction is that the "discount" for a guilty plea is not a "penalty" for trial. This is crucial. It allows the system to claim consistency while functioning coercively.
      *   *Refinement on Parole:* Parole is administrative, not judicial. That's why the theories diverge. Judges do justice; Boards do risk management.

  9.  **Finalizing the Output Structure:**
      1.  Diagnosis: The "Hybrid" Illusion.
      2.  The Dual Function of Remorse (Moral vs. Statistical).
      3.  The Trial Right Paradox (Incentive vs. Penalty).
      4.  The New Penology (Risk vs. Desert).
      5.  The Restitution Test (What it reveals).
