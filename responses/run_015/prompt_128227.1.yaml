prompt: |-
  Me and my friend were up way too late last night arguing about peer disagreement and I'm still annoyed that I lost ground on it. Her line was basically: if someone roughly as smart as you has seen all the same evidence and lands on a different probability, the rational move is to meet in the middle, full stop. I kept pushing back — sometimes the other person is just wrong, and you're allowed to notice that. But then she switched cases on me: suppose you formed the belief at 3am after three glasses of wine, or you find out the pill you took that morning is known to wreck reasoning, or you learn you were one of the sleep-deprived subjects in a study. I do think you should dial your confidence down there, and I couldn't say why that's different from her case, or even whether it really is different. So I want to build something for my forecasting group — we're a handful of amateurs who meet on Sundays and put probabilities on tech and election questions — and I'd rather find out what people actually believe from their answers to cases than from them announcing a label.

  What I want is a which-view-of-higher-order-evidence-are-you-actually-holding quiz, eight questions, three answer options each, built so it sorts people by their verdicts on cases rather than by which jargon word they like. No question may use terms like conciliationism, steadfastness, permissivism, uniqueness, or level-splitting, and no question may ask directly what someone thinks about disagreement in general — every item should be a concrete vignette a forecaster could picture themselves in. The branching has to be driven by these distinctions specifically: (1) whether you split the difference with an epistemic peer who has your evidence or stay put; (2) whether the wine / sleep-deprivation / reasoning-is-impaired case is treated the same way as the peer case or differently, and if differently, what the difference is supposed to be; (3) whether, after you learn about the disagreement, your outright first-order confidence and your judgment about what you ought to believe come apart, so you end up in something akratic, or whether they move together; (4) whether a given body of evidence fixes exactly one rational credence or leaves a range; (5) what happens when the disagreement is anticipated in advance, i.e. you already knew before you looked at the evidence that your friend would end up on the other side; (6) what happens when the disagreeing source isn't a person — a forecasting model that beats you on Brier scores and has seen more data than you have; and (7) the case where the disagreeing party is your own future self, who has read exactly one more study than you currently have. Please build the tree from the logical space instead of from a list of names: lay out which combinations of answers are available, then place the actual positions in the cells, and for cells that come out empty say which they are and whether that's because the combination is incoherent, merely unattractive, or just nobody's bothered to work it out. Also flag any pair of leaves your quiz can't actually separate rather than pretending it can, and give me a scoring key that maps answer patterns onto positions, including a note on what to do with someone whose answers don't fit any clean pattern. Skip citations, references, and suggested reading entirely — I'm doing this on a laptop with no connection and I only care about the cases. Final line: \answer{n}, where n is the number of leaves in your tree that you think no actual position in the literature occupies.
