  # The Forecasting Group Epistemic Quiz

  ## Instructions
  Read each vignette carefully. Imagine yourself in the situation. Choose the option that best matches what you would actually do or believe, not what sounds most impressive. There are no right or wrong answers, only different ways of handling uncertainty.

  ## The Questions

  **1. The Equal Partner**
  You and a friend are forecasting whether a specific startup will launch its product by December. You both have the same background in tech, you've looked at exactly the same documents and market data, and you both know you're equally careful. You conclude there is a 70% chance. Your friend concludes there is a 30% chance. You trust their honesty and competence completely. What do you do?
  A) Move your estimate significantly toward theirs (e.g., to 50%).
  B) Stick with your 70% because you did the reasoning yourself.
  C) Move slightly toward theirs, but stay closer to your original number.

  **2. The Foggy Morning**
  You are forecasting an election outcome. You feel sharp and have reviewed all the polling data. You settle on 60%. Then you remember you took a cold medicine this morning known to cause logical errors in complex probability tasks, though you feel fine. You have no reason to think your specific conclusion is wrong, only that your process was chemically compromised. What do you do?
  A) Keep the 60% because the conclusion still looks right to you.
  B) Lower your confidence significantly (e.g., to 50% or wider) because your tool was broken.
  C) Lower your confidence slightly, but trust your gut more than the medicine warning.

  **3. The Inner Conflict**
  Imagine you accepted the logic in Question 2 (medicine) and lowered your confidence. However, the evidence still *looks* exactly as strong as it did before. You feel a tension between "I know I should be less confident" and "It still feels 60% likely to me." How do you report your belief to the group?
  A) I report the lowered confidence. What I "ought" to believe overrides how it feels.
  B) I report the 60%. If it still feels that way, that's my real belief, regardless of the medicine.
  C) I report two numbers: one for how likely it feels, and one for how confident I should be.

  **4. The Range of Reason**
  Two people look at the same economic data. One says inflation will be 2%, the other says 4%. Both are smart and honest. Is it possible that both numbers are reasonable responses to the same information?
  A) No. One of them is making a mistake, even if we can't see which one.
  B) Yes. Reasonable people can land in different spots with the same information.
  C) Only if the information is vague; with precise data, there should be one target.

  **5. The Expected Split**
  Before you even look at the data for a new tech question, you know your friend always interprets this kind of data more skeptically than you do. You look at the data, form your view, and then find out your friend indeed disagrees. Does knowing you expected this disagreement change how much you adjust your view?
  A) Yes, I adjust less because I already factored their skepticism into my process.
  B) No, the disagreement itself matters regardless of whether I expected it.
  C) Yes, I adjust more because it confirms a known bias in my own thinking.

  **6. The Black Box Model**
  You estimate a 70% chance of an event. A forecasting algorithm, which has beaten you consistently for two years and has access to more data points than you do, estimates 40%. You don't know how the algorithm works. What do you do?
  A) Move heavily toward the model's number. It has a better track record.
  B) Stick with your number. You understand your reasoning; the model is a mystery.
  C) Split the difference. You have reasoning, it has data; meet in the middle.

  **7. The Future You**
  You have read three studies on a topic and settled on a probability. You know that tomorrow you will read a fourth study of equal quality. You suspect the fourth study might shift your view. Should you change your probability *now*?
  A) No, I only update on evidence I have actually seen.
  B) Yes, I should preemptively move toward where I think Future Me will land.
  C) Yes, but only if I know the direction of the fourth study.

  **8. The Double Check**
  Back to the startup question in Question 1. You and your friend agree to re-check the calculations. You find no errors in either spreadsheet. You still disagree. Does this change your answer from Question 1?
  A) No, my answer stays the same as Q1.
  B) Yes, now I stick to my gun even more because I verified my work.
  C) Yes, now I move toward them even more because the mystery is deeper.

  ---

  ## Logical Space Tree

  To sort your answers, we map them onto a taxonomy of epistemic positions. This tree is built from the four foundational distinctions that define the logical space of disagreement. Distinctions 5, 6, and 7 (Anticipated, Model, Future Self) are diagnostic probes used in the quiz to confirm placement on the core branches, rather than creating new branches, because no major philosophical position diverges on 5-7 without already diverging on 1-4.

  **The Four Core Branches:**
  1.  **Peer Response:** Split Difference (Conciliate) vs. Stay Put (Steadfast).
  2.  **Impairment Response:** Same as Peer (Defeat) vs. Different from Peer (No Defeat/Partial).
  3.  **Internal Structure:** Akratic (Confidence & Normative Judgment Split) vs. Non-Akratic (Move Together).
  4.  **Uniqueness:** Single Rational Credence (Yes) vs. Range of Rational Credence (No).

  **Tree Structure (16 Leaves):**
  *   **Branch 1 (Peer):** Split / Stay
  *   **Branch 2 (Impairment):** Same / Different
  *   **Branch 3 (Akrasia):** Yes / No
  *   **Branch 4 (Uniqueness):** Yes / No

  **Occupancy Analysis:**
  There are 16 possible leaves ($2^4$). Based on the landscape of existing epistemic theories:

  1.  **Split / Same / No / Yes:** *Equal Weight View.* (Occupied)
  2.  **Stay / Different / No / Yes:** *Total Evidence View.* (Occupied)
  3.  **Split / Same / Yes / Yes:** *Level-Splitting View.* (Occupied)
  4.  **Stay / Different / No / No:** *Permissivist View.* (Occupied)
  5.  **Stay / Same / No / Yes:** *Dogmatic Steadfast.* (Rare/Unattractive: Claims impairment doesn't defeat justification).
  6.  **Split / Different / No / Yes:** *Hybrid View.* (Rare: Treats peer disagreement as stronger evidence than impairment).
  7.  **Split / Same / No / No:** *Permissivist Conciliationism.* (Theoretically possible, rarely defended).
  8.  **Stay / Different / Yes / Yes:** *Akratic Steadfast.* (Rare).
  9.  **Split / Same / Yes / No:** *Akratic Permissivist.* (Unexplored).
  10. **Stay / Same / Yes / Yes:** *Akratic Dogmatism.* (Incoherent).
  11. **Stay / Same / No / No:** *Permissivist Dogmatism.* (Incoherent).
  12. **Split / Different / Yes / Yes:** *Akratic Hybrid.* (Unexplored).
  13. **Split / Different / No / No:** *Permissivist Hybrid.* (Unexplored).
  14. **Stay / Different / Yes / No:** *Akratic Permissivist Steadfast.* (Unexplored).
  15. **Split / Same / No / Yes (Variant):** *Anticipated Disagreement Variant.* (Mapped to Leaf 1).
  16. **Stay / Different / No / Yes (Variant):** *Model Reliance Variant.* (Mapped to Leaf 2).

  *Note: Leaves 15 and 16 represent positions that differ only on distinctions 5-7. Since these distinctions are treated as diagnostic rather than definitional in this taxonomy, they do not create new leaves. However, if treated as independent branches, the tree would explode to 128 leaves, almost all of which would be empty. For the purpose of this tool, we count the 16 core theoretical combinations.*

  **Empty Leaves:**
  Leaves 5 through 14 are either incoherent, merely unattractive, or unexplored in the literature.
  Total Leaves: 16.
  Occupied Leaves: 4 (Solid), 2 (Rare/Questionable).
  Empty Leaves: 10.

  **Indistinguishable Leaves:**
  The quiz cannot reliably separate Leaf 1 (Equal Weight) from Leaf 7 (Permissivist Conciliationism) if the participant does not understand the "Uniqueness" distinction deeply. Both will answer "Split" on peers. The differentiation relies entirely on Question 4. Similarly, Leaf 2 (Total Evidence) and Leaf 5 (Dogmatic Steadfast) may look identical if the participant denies impairment defeats reasoning (Q2 Option A).

  ---

  ## Scoring Key

  Calculate your scores on the four dimensions based on your answers.

  **Dimension 1: Peer Response (Q1, Q8)**
  *   **Split:** Mostly A.
  *   **Stay:** Mostly B.
  *   **Mixed:** Mostly C (Treat as "Stay" for taxonomy, but note hesitation).

  **Dimension 2: Impairment Response (Q2)**
  *   **Same (Defeat):** Option B (Treat impairment like peer disagreement).
  *   **Different (No Defeat):** Option A (Trust your reasoning despite impairment).
  *   **Mixed:** Option C.

  **Dimension 3: Akrasia (Q3)**
  *   **Yes (Split):** Option C (Report two numbers/acknowledge conflict).
  *   **No (Together):** Option A or B (Commit to one number).

  **Dimension 4: Uniqueness (Q4)**
  *   **Yes (One Target):** Option A or C.
  *   **No (Range):** Option B.

  **Diagnostic Consistency (Q5, Q6, Q7)**
  *   These questions check if your core view holds under pressure.
  *   **Consistent Conciliationist:** Q5=B, Q6=A, Q7=B.
  *   **Consistent Steadfast:** Q5=A, Q6=B, Q7=A.
  *   **Inconsistent:** Mixed patterns suggest you haven't settled on a view.

  **Mapping to Positions:**
  *   **Split / Same / No / Yes:** Equal Weight View.
  *   **Stay / Different / No / Yes:** Total Evidence View.
  *   **Split / Same / Yes / Yes:** Level-Splitting.
  *   **Stay / Different / No / No:** Permissivism.
  *   **Any other combination:** You hold a niche, hybrid, or potentially incoherent position. Review your answers on Q2 and Q4 specifically.

  **Handling "No Clean Pattern":**
  If a participant answers "Split" on peers but "Stay" on impairment (Hybrid), or "Yes" on Uniqueness but "No" on Akrasia in a conflicting way, assign them to the "Mixed" category. Advise them that their view is not standard in the literature and suggests they may be weighing *sources* of evidence differently than *types* of evidence. In a forecasting group, these participants are valuable for stress-testing the consensus but should not drive the aggregation method.

