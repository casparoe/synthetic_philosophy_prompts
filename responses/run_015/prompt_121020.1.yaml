answer: |-
  Here is the principle, the application, and the overturn.

  ### The Principle

  **The Principle of Constitutive vs. Archaeological Authority.**

  You possess epistemic authority only when your judgment is **Constitutive** or **Phenomenological**. You lack authority when your judgment is **Archaeological**.

  1.  **Constitutive:** You are *making* the truth happen. This applies to the fictional world (you decree Marta's motives), the craft (you decide a sentence is finished), and current volition (you decide you will write without money). In these zones, your assertion *creates* the reality.
  2.  **Phenomenological:** You are reporting a *current, immediate state*. This applies to somatic reactions (chest tightening), aesthetic friction (a sentence feeling wrong), or present-tense awareness. In these zones, you are a sensor, not a storyteller.
  3.  **Archaeological:** You are *digging up* a truth that already exists independently of your current assertion. This applies to past motives, origins of ideas, unconscious drives, and historical emotional states. In these zones, you are a narrator constructing a causal story, and your data is corrupted by the need for coherence.

  **The Test:** To apply this cold, ask: *Am I setting the parameter, or am I explaining it?* If you are explaining a cause, a history, or a "why," you are in the Archaeological zone. Your verdict is suspect.

  ### Application to New Cases

  **(i) The Missing Paragraph**
  *   **Analysis:** Your memory of writing it is **Archaeological**. You are trying to reconstruct a past action. Your daughter's potential interference is external empirical data, not internal knowledge. The presence of the text is **Constitutive** (it is now part of the work's reality), but the genesis is not yours to claim.
  *   **Verdict:** You know nothing about the *writing* of the paragraph. You only know about its *existence*. Treat the paragraph as found text. If it works, keep it; if it doesn't, cut it. Do not trust any memory of its creation, including the memory that you didn't create it.

  **(ii) First Person to Third Person Switch**
  *   **Analysis:** The *decision* to switch was **Constitutive** at the time (a craft move). The *reason* for the switch is now **Archaeological**. You are likely constructing a narrative of improvement or necessity to explain a choice that may have been intuitive (Case 4) or accidental.
  *   **Verdict:** You know *that* you switched him. You do not know *why*. Any explanation you give ("He needed distance," "First person felt claustrophobic") is Case 3 confabulation with better tailoring. Trust the switch (it's in the text), distrust the rationale.

  ### The Overturn

  I am overturning **Case 5(a)**: *The Reviews.*

  **Your Verdict:** "I still want to say my I don't care is true — the tight chest is plumbing, not attitude."
  **My Verdict:** **False.** You care.

  **Why:** This is the clearest violation of the Principle in your notebook.
  The "tight chest" is **Phenomenological**. It is immediate, somatic data occurring in the present moment. It is the signal.
  The statement "I don't care" is **Archaeological/Narrative**. It is a story you are telling yourself about your identity ("I am the kind of writer who transcends criticism") to maintain coherence.

  You are privileging the story over the sensor. Under the Principle of Constitutive vs. Archaeological Authority, the body's report in the present moment is the only authoritative data on your emotional state. The cognitive assertion is a defense mechanism. You are not special-pleading in 5(b) (Marta); in 5(b) you are the god of that universe, so your decree is Constitutive. In 5(a), you are the subject, and your body is the evidence. The body does not lie about arousal/response; the mind lies about meaning.

  **Why not Case 10 (Irony)?**
  Case 10 is borderline, but it survives. Whether you *meant* irony is a question of past intent (Archaeological), but whether the line *functions* as irony is a question of craft (Constitutive). You backed yourself because it felt like Case 4 (a feel). While the readers' reception suggests the Constitutive act failed (the text doesn't carry the irony), your knowledge of your *attempt* remains valid. In Case 5(a), your knowledge of your *state* is demonstrably contradicted by the only authoritative source available (your physiology). 5(a) is the purer bullshit.

  ### Summary of the Sort

  *   **Saved (Constitutive/Phenomenological):** 2 (Volition), 4 (Craft Feel), 5(b) (Fictional Truth), 7 (Present Reconstruction of Past), 8 (Signal Degradation).
  *   **Discarded (Archaeological):** 1 (Past Motive), 3 (Origin Story), 6 (Inaccessible Data), 9 (Contaminated Memory).
  *   **Overturned:** 5(a) (Somatic Truth vs. Narrative Lie).

  You have one principle. It divides your mind into the workshop (where you are authoritative) and the museum (where you are a tour guide making things up). Stop trusting the tour guide.
