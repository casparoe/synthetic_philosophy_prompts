  1.  **Analyze the User's Query:**
      *   **Context:** Three siblings dividing a late father's estate.
      *   **The Conflict:**
          *   Older Brother's Argument: Utilitarian/Contractarian approach. Split to maximize *total* satisfaction (utility), counting everyone equally. Justification: This is what would be chosen behind a "veil of ignorance" (not knowing who you'd be).
          *   User's Intuition: Prioritarian/Egalitarian approach. The youngest sister is unwell; money gives her more relief (marginal utility is higher for her needs, or there's a moral claim based on need). Even if the brother gets more *total* happiness from the money (due to expensive tastes), the sister should come first.
