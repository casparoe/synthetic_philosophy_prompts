answer: |-
  Here is a set of ten interview questions tailored for your podcast. They are designed to move from conceptual foundations to concrete examples, and finally to the broader implications of the critique.

  I have included notes in *[italics]* to help you understand the intent behind each question, and specifically for the required follow-ups, I have included an **"Anticipated Answer"** note so you know when to deploy them.

  ### Part 1: The Core Distinctions

  **1. In the original 1979 paper, Gould and Lewontin distinguish between traits selected for (adaptations), architectural byproducts (spandrels), and traits co-opted later (exaptations). Beyond simple taxonomy, why is maintaining this distinction methodologically crucial for a biologist in the field? What specific error occurs if we blur the lines between a trait's origin and its current utility?**
  *[Intent: This avoids asking for a dictionary definition and instead asks about the practical impact on scientific method.]*

  **2. Follow-up:** *[Ask this only if she emphasizes that modern biology has largely internalized these distinctions since 1979.]*
  **"Given that many evolutionary biologists argue they have already internalized these distinctions since the paper was published, do you think the 'adaptationist programme' is still a live danger, or has the critique become a victory lap for a problem that's already been solved?"**
  *[Anticipated Answer: She will likely argue that while biologists *say* they accept it, the *practice* of writing papers still defaults to adaptationism. This follow-up presses her on whether the problem is cultural, not just theoretical.]*

  ### Part 2: The Panglossian Paradigm

  **3. Gould and Lewontin invoke Voltaire's Dr. Pangloss to describe their opponents. Are they attacking the weak claim that most traits have *some* adaptive function, or the much stronger claim that every trait is *optimally* designed for a specific function? Where exactly do you draw the line on what counts as 'Panglossian'?"**
  *[Intent: This clarifies the target of the critique. Many people misunderstand this as attacking evolution itself, rather than a specific style of explanation.]*

  **4. Follow-up:** *[Ask this only if she defines Panglossianism as assuming "optimality" rather than just "function."]*
  **"But natural selection is often described as a tinkerer, not an engineer, implying 'good enough' rather than 'optimal.' If adaptationists concede that selection only aims for 'good enough,' does the Panglossian critique lose its bite, or does the problem shift to how we define 'function' in the first place?"**
  *[Anticipated Answer: She will likely argue that even "good enough" stories are often told without testing alternatives. This follow-up forces her to explain why "sufficiency" is still a trap if not tested against null hypotheses.]*

  ### Part 3: Concrete Biological Cases

  **5. Let's ground this. Feathers are often cited as an exaptation—initially for insulation, later co-opted for flight. But isn't it possible that early proto-feathers were *already* under selection for aerodynamic gliding? In cases like this, where the fossil record is incomplete, who bears the burden of proof: the adaptationist claiming a function, or the critic claiming it's a byproduct?"**
  *[Intent: This moves the conversation from abstract philosophy to messy biological reality. It highlights the difficulty of proving historical causation.]*

  **6. Follow-up:** *[Ask this only if she places the burden of proof squarely on the adaptationist to rule out spandrels.]*
  **"Does placing that heavy burden of proof on the adaptationist risk stifling hypothesis generation? Is there a danger that we become so afraid of telling 'just-so stories' that we stop telling *any* stories about function, potentially slowing down discovery?"**
  *[Anticipated Answer: She will likely argue that rigor speeds up discovery by preventing dead ends. This follow-up challenges her to balance skepticism with scientific progress.]*

  ### Part 4: Broader Implications (Evo-Devo & Psychology)

  **7. Gould was a pioneer in evolutionary developmental biology (Evo-Devo). How does the rise of Evo-Devo since 1979 strengthen or weaken the spandrels argument? Does understanding genetic regulatory networks make it easier to identify structural constraints that limit selection?"**
  *[Intent: This shows you've done research on Gould's broader career. It connects the 1979 paper to modern genetics.]*

  **8. The spandrels paper is often weaponized against evolutionary psychology. Do you think this is a fair application of Gould and Lewontin's argument, or does human culture introduce variables that make the biological critique of adaptationism harder to apply to the mind?"**
  *[Intent: This is a high-interest topic for many listeners. It asks the guest to delineate the boundaries of the critique.]*

  ### Part 5: Pedagogy and Falsifiability

  **9. For students learning evolutionary biology today, should the null hypothesis always be 'this trait is a spandrel' until proven otherwise, or should it remain 'this trait is an adaptation' until proven otherwise? How do we train the next generation to avoid the Panglossian trap without becoming paralyzed?"**
  *[Intent: This makes the philosophy practical for you and your audience as students. It asks for actionable advice.]*

  **10. Finally, philosophy of science emphasizes falsifiability. What kind of empirical evidence or theoretical development would count *against* the spandrels critique? Is there a scenario where you would concede that the adaptationist programme is actually the default correct approach?"**
  *[Intent: This is your closing question. It tests the robustness of the guest's own position and ensures the interview ends on a critical, open-minded note.]*
