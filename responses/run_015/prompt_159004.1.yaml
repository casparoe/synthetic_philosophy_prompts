prompt: |-
  I've got an hour next week with a mixed seminar — first-year philosophers plus second-year computer scientists — and I need to get one thing across: that 'this system implements computation C' isn't a fact about the system on its own but something we attribute to it, so 'which computations matter morally?' can't be answered by just pointing at the computation. Don't write the session for me; tell me how to run it.

  What I'd like them to leave holding is a distinction I've been messing about with and can't quite get straight myself: attribution-robustness versus attribution-by-convenience. Roughly, an attribution of a computation to a system is morally load-bearing only if it survives (a) coarsening the description — it isn't an artefact of how finely I chose to carve things up — and (b) perturbing the system's states and inputs, i.e. it tracks counterfactuals the system really supports rather than just the run I happened to watch. An attribution that's merely convenient for me, or that matches what the programmer intended, isn't. That's the bit I want them to feel the force of.

  So: what order do the bits have to come in, given that? My carrying example is a little evolved virtual creature in a simulation, twelve-node nervous system, steers reliably away from a noxious patch, and its failure mode looks a bit like relief when it escapes — crucially it has no programmer's spec to appeal to and nothing like a body we already have intuitions about. Tell me what else that example has to have, and what it has to avoid, if it's going to carry the whole hour.

  Misconceptions I'm expecting: that the physics or the runtime settles it and descriptions are just bookkeeping; that once they see several computations fit one run they'll conclude computation is irrelevant tout court; that the computation which matters is the one someone intended the system to be running; and the slide from avoidance behaviour to so it hurts. Where in the sequence does each have to be headed off, and which one will actually be hardest to shift?

  Give me one question for the end that shows me they've got the distinction rather than just got unsettled — I was thinking of handing them teh second system and asking what would have to be true of it to change their answer, but say if that's the right test. And what should I openly refuse to get into at this level, and say out loud that I'm refusing it?
reasoning: |-
  Here's a thinking process that leads to the suggested seminar plan:

  1.  **Analyze the Request:**
      *   **Audience:** Mixed seminar (1st-year Philosophers + 2nd-year Computer Scientists). This is a crucial dynamic. Philosophers might be prone to skepticism/relativism; CS students might be prone to realism/implementation details.
      *   **Time:** 1 hour.
      *   **Core Goal:** Establish that "System $S$ implements Computation $C$" is an attribution, not an intrinsic fact. Therefore, "Which computations matter morally?" cannot be answered by just pointing at the computation.
      *   **Key Distinction to Convey:** *Attribution-Robustness* vs. *Attribution-by-Convenience*.
          *   Robustness: Survives coarsening of description + tracks counterfactuals (perturbations).
          *   Convenience: Matches programmer intent, matches a specific run, arbitrary mapping.
      *   **Core Example:** Evolved virtual creature (12-node nervous system), avoids noxious patch, failure mode looks like "relief." No programmer spec, no familiar body.
      *   **Deliverables:**
          *   Structure/Order of the session.
          *   Refinements to the example (what to add/avoid).
          *   Handling specific misconceptions (Physics settles it, Computation is irrelevant, Intent matters, Behavior = Pain).
          *   One final assessment question.
          *   What to explicitly exclude/refuse to discuss.

  2.  **Deconstruct the Core Distinction (Robustness vs. Convenience):**
      *   This is essentially a refined version of the "Mapping Problem" in computational functionalism (Putnam, Searle, etc.) but with a normative twist.
      *   *Convenience:* I can map states to bits however I want *post-hoc* to make it look like it's computing $X$.
      *   *Robustness:* The system *would have* computed $X$ had inputs changed. The mapping isn't gerrymandered.
      *   *Moral Weight:* Only robust computations count for moral status (pain, agency, etc.).

  3.  **Structure the Hour:**
      *   *0-10 min:* Hook & The Naive View (CS strength). Show the creature. Get them to agree it's computing "avoidance."
      *   *10-25 min:* The Triviality Challenge (Philosophy strength). Show how *any* system can be mapped to *any* computation (Putnam-style). This creates the crisis.
      *   *25-40 min:* The Rescue (Robustness). Introduce counterfactuals and coarsening. Distinguish "Real" vs. "Accidental" implementation.
      *   *40-50 min:* Moral Implications. Why this matters for "does it hurt?"
      *   *50-60 min:* Assessment & Wrap-up.

  4.  **Refining the Example (The Creature):**
      *   *Needs:*
          *   **Opacity:** The node functions shouldn't be obvious (e.g., not clear AND/OR gates). This prevents CS students from saying "It's obviously a neural net."
          *   **Evolutionary History:** Emphasize *no designer*. This kills the "Intent" misconception early.
          *   **State Visibility:** We need to see the internal states to map them.
          *   **Counterfactual Potential:** We need to be able to say "If input was $Y$, state would be $Z$."
      *   *Avoid:*
          *   **Anthropomorphism:** Don't call it "relief" initially. Call it "State 7." Let them project.
          *   **Physical Complexity:** Keep it abstract enough that physics doesn't dominate.
          *   **Learning:** Don't let it learn *during* the demo. Keep the computation fixed so we can analyze *that* computation.

  5.  **Addressing Misconceptions:**
      *   *Physics/Runtime settles it:* Address early (10-25 min). Show multiple mappings fit the same physics.
      *   *Computation is irrelevant:* Address during the "Rescue" (25-40 min). Show that *some* mappings are better (robust), so computation isn't dead, just constrained.
      *   *Intent matters:* Address by emphasizing the *evolved/no-spec* nature of the creature.
      *   *Behavior = Pain:* Address at the end. Just because it implements "avoidance" robustly doesn't mean it *hurts*. That's a further step.

      *Hardest to shift:* "Physics settles it." CS students love the hardware. Philosophers might think "Everything is interpretation." The middle ground (constraint without realism) is tricky.

  6.  **Developing the Final Question:**
      *   User suggestion: "Hand them a second system and ask what would have to be true."
      *   Critique: Good, but needs to be specific to *Robustness vs. Convenience*.
      *   Better: Give them a system that behaves identically but lacks counterfactual support (a "lookup table" vs. "algorithm" distinction, or a "philosophical zombie" equivalent).
      *   Best: A system that matches the creature's *actual* run perfectly but fails the *perturbation* test. If they say "It's the same," they missed the point. If they say "It's different," they need to say *why* (counterfactuals).

  7.  **What to Refuse:**
      *   Don't solve the Hard Problem of Consciousness.
      *   Don't define "Pain."
      *   Don't get into specific moral theories (Utilitarianism vs. Deontology).
      *   Don't get into the technical details of the simulation engine.

  8.  **Drafting the Plan (Iterative refinement):**

      *   *Intro:* Show the video. Ask CS: "What is it computing?" Ask Phil: "How do you know?"
      *   *The Trap:* Show that a rock (or a simple lookup) could match the *trace*. (Putnam's theorem light).
      *   *The Pivot:* Introduce the "What If?" (Counterfactuals).
      *   *The Distinction:* Robustness (Counterfactuals + Coarsening) vs. Convenience (Post-hoc mapping).
      *   *The Moral Link:* If moral status depends on computation, and computation depends on attribution, we need robust attribution.
      *   *The Test:* The "Playback" system.

      *(Self-Correction during drafting)*: Make sure the CS students don't feel attacked. Their intuition that "implementation matters" is right, but their idea of *what* implementation is needs tweaking. Use their language (unit tests, edge cases) to explain counterfactual robustness.

      *(Refining the Example)*: The "12-node nervous system" is good. Make sure the nodes are continuous or complex enough that binary mapping isn't trivial, but discrete enough to analyze. Let's stick to discrete states for clarity in a 1-hour session.
      *Crucial addition:* The example needs a "glitch" mode. A state that *only* happens if you force it, not during normal operation. This tests the "coarsening" condition.

      *(Refining the Misconceptions)*: The "Behavior = Pain" slide is the biggest trap. Need to ensure they understand that establishing *robust computation* is a necessary condition for moral weight, not sufficient.

      *(Refining the Final Question)*: The user's idea is solid. Let's sharpen it. System B records System A's output and plays it back. System B matches the *run* perfectly. Does System B implement the computation? (No, fails counterfactuals).

  9.  **Final Polish:** Check tone. Needs to be directive but respectful of the user's expertise. Ensure the distinction (Robustness vs. Convenience) is the spine of the whole hour.

      *Wait, one more thing:* The user mentioned "coarsening the description." I need to make sure that's explicit. It means the computation shouldn't depend on micro-states that are irrelevant. If I change the voltage slightly but the logic holds, the computation is the same. If the mapping breaks on micro-changes, it's convenient/fragile.

      *Order of Misconceptions:*
      1. Physics settles it (Early, during the mapping demo).
      2. Intent matters (Early, by specifying no designer).
      3. Computation irrelevant (Middle, when saving the concept via robustness).
      4. Behavior = Pain (Late, as a boundary condition).

      *Hardest:* Physics settles it. CS students rely on the machine. Philosophers rely on the text. The "Attribution" middle ground is the hard sell.

      *Refusal:* Consciousness itself. We are talking about the *precondition* for moral status (computation), not the status itself.

      *Final Question:* The "Playback" test is classic but effective. Let's frame it as "System B is a tape recorder of System A's successful run."

      *Let's write it.*
answer: |-
  This is a tight, high-wire act. You are asking them to abandon computational realism (the computation is *in* the wires) without falling into computational nihilism (computation is *nothing but* interpretation). You want them to land on **computational functionalism with constraints**.

  Here is how you run the hour to force that distinction into the open.

  ### 1. The Structure (60 Minutes)

  **00–10: The Hook & The Naive Realist View**
  *   **Show the creature.** The 12-node evolved agent avoiding the noxious patch.
  *   **Ask the CS students:** "Write the function signature for what this is doing." They will say `avoid(noxious_zone)`.
  *   **Ask the Philosophers:** "What evidence do you have that it is doing that, and not `maximize(proximity_to_edge)` or `simulate(relief)`?"
  *   **Goal:** Establish the intuitive consensus that the system *is* computing avoidance. This sets up the trap.

  **10–25: The Triviality Trap (Attack the Physics)**
  *   **Demonstrate Mapping Flexibility.** Show a trace of the 12 nodes over time (a matrix of states).
  *   **The Move:** Show that you can map those physical states to *any* logical states you like post-hoc, provided you make the mapping complex enough. (Keep it simple: show that the same state trace fits `avoid(noxious)` and `seek(safe)` depending on how you label '0' and '1').
  *   **The Hit:** If the physics alone settled the computation, there would be only one valid mapping. There isn't.
  *   **Head off Misconception:** *Physics/Runtime settles it.*
      *   **Where:** Right here.
      *   **How:** Show that the hardware trace underdetermines the logic.
      *   **Why Hard:** CS students trust the metal. Philosophers trust the description. You must show that *neither* is sufficient alone.

  **25–40: The Rescue (Robustness vs. Convenience)**
  *   **The Pivot:** "If any mapping works, computation is meaningless. But we know some mappings are wrong. Why?"
  *   **Introduce Counterfactuals.** Rewind the sim. Change the input slightly (move the noxious patch 5 pixels).
      *   **System A (The Creature):** Changes its internal trajectory to still avoid.
      *   **System B (The Lookup Table):** Has recorded System A's *original* run. It plays back the original states. It crashes into the patch.
  *   **The Distinction:**
      *   **Attribution-by-Convenience:** Fits the *actual* run (System B fits the first run perfectly). Matches the observer's narrative.
      *   **Attribution-Robustness:** Fits the *counterfactuals* (System A supports the inference "if input changed, output would change thus"). Survives coarsening (if we group node states slightly differently, the logic holds).
  *   **Head off Misconception:** *Computation is irrelevant tout court.*
      *   **Where:** Here.
      *   **How:** Show that robustness rescues computation from triviality. It's not that computation doesn't exist; it's that it exists *relationally* across possible worlds, not just in the actual one.
  *   **Head off Misconception:** *Intent matters.*
      *   **Where:** When defining robustness.
      *   **How:** Remind them the creature is evolved. There was no programmer intent. The robustness comes from the system's causal structure, not the designer's mind.

  **40–50: The Moral Stakes**
  *   **The Link:** "If moral status depends on computation (e.g., 'pain is a specific error-correction routine'), we cannot assign moral status based on a convenient mapping."
  *   **The Warning:** Just because a system *robustly* implements avoidance doesn't mean it *hurts*. But if the implementation is only *convenient*, it definitely doesn't hurt.
  *   **Head off Misconception:** *Avoidance behavior = Pain.*
      *   **Where:** Start of this section.
      *   **How:** Explicitly decouple "implementing avoidance" from "suffering." Robust computation is a *necessary* condition for moral weight, not a *sufficient* one.

  **50–60: The Test & Refusals**
  *   **The Final Question.**
  *   **Explicit Refusals.**
  *   **Q&A.**

  ---

  ### 2. Tuning the Example (The Creature)

  For this to work, the example must be stripped of specific affordances that allow shortcuts.

  **What it MUST have:**
  1.  **Visible Internal States:** You need to project the 12-node activation values on screen. If the internals are hidden, CS students will assume the "black box function" is intrinsic.
  2.  **A "Glitch" State:** There must be at least one internal state configuration that *never occurs* during successful avoidance but is physically possible.
      *   *Why:* To test **Coarsening**. If your attribution of computation relies on that state being impossible, your attribution is fragile. Robust attribution ignores unreachable micro-states.
  3.  **No Semantic Labels:** Do not label the inputs "Danger" or "Food." Label them `Input_Vector_1` and `Input_Vector_2`. Let *them* supply the semantics.
  4.  **Evolutionary Provenance:** Reiterate that the weights were selected by a fitness function, not written by a dev. This kills the "Intent" crutch.

  **What it MUST avoid:**
  1.  **Anthropomorphic Geometry:** Don't make it look like an animal. Make it a geometric shape or a cluster of nodes. If it looks like a bug, they will import intuitions about bugs.
  2.  **Learning During the Demo:** The weights must be frozen. If it learns, the computation changes, and you lose the ability to test counterfactuals against a fixed function.
  3.  **Complex Physics:** The "physics" of the simulation should be trivial (discrete grid). If the physics is complex, CS students will argue the computation is "in the physics engine," not the agent.

  ---

  ### 3. Handling the Misconceptions

  **1. "The physics/runtime settles it."**
  *   **Hardest to shift.** CS students view the machine as the authority. Philosophers may view the physics as the "real" substrate.
  *   **Intervention:** Use the **Multiple Realizability** argument. Show the same logic trace running on a different substrate (e.g., a Python script vs. a conceptual neural net). If the logic is the same but the physics different, the physics didn't settle the computation. Then show the same physics supporting different logics (the Triviality Trap).

  **2. "Once they see several computations fit one run, computation is irrelevant."**
  *   **Intervention:** This is the nihilism trap. You must pivot hard to **Counterfactual Support**. Computation isn't about what *did* happen; it's about what *would* happen. The "irrelevant" conclusion comes from looking only at the actual trace.

  **3. "The computation that matters is the one intended."**
  *   **Intervention:** You've already neutralized this with the "Evolved/No Spec" constraint. If they raise it, ask: "If the programmer intended it to compute X, but the weights decay so it robustly computes Y, which one gets the moral credit/blame?"

  **4. "Avoidance behaviour = So it hurts."**
  *   **Intervention:** This is the slide you must block at the end.
  *   **Phrase:** "Robust implementation of avoidance is the *syntax* of pain. It is not the *semantics*. We are establishing the syntax today. Do not confuse the map for the territory."

  ---

  ### 4. The Final Question

  Your idea (handing them a second system) is the right track, but it needs to be specific to **Counterfactual Robustness**.

  **The Setup:**
  "System A is the evolved creature we analyzed. It robustly avoids the patch.
  System B is a 'Playback Box'. It contains a recording of System A's successful run from earlier. When presented with the original input, System B outputs the exact same motor commands and internal state traces as System A. Perfect match."

  **The Question:**
  "System B matches the *actual run* of System A perfectly (Attribution-by-Convenience). System A supports the *counterfactuals* (Attribution-Robustness).
  **If System A is morally considerable because of the computation it performs, is System B? Why or why not?**"

  **The Correct Answer (What you're looking for):**
  They should say **No**.
  *   **Reasoning:** System B does not support the counterfactuals. If you perturb the input, System B does not adjust; it replays. Therefore, the attribution of "avoidance computation" to System B is merely convenient/post-hoc. It is not robust.
  *   **Success Metric:** If they say "Yes, because the output is the same," they failed to grasp robustness. If they say "No, because it's just a recording," ask *why* the recording matters. They must cite the lack of counterfactual support.

  ---

  ### 5. What to Refuse (Out Loud)

  You must explicitly bracket off topics to keep the hour from exploding. Say this at the start (or when the first hand goes up):

  1.  **"I am not solving the Hard Problem."**
      *   "We are not discussing whether qualia exist. We are discussing whether the *attribution of function* is objective enough to ground a moral claim. I am not arguing that computation *creates* pain, only that without robust computation, you cannot have pain."
  2.  **"I am not defining Moral Status."**
      *   "I am not telling you which computations matter (e.g., pain vs. joy). I am telling you that whichever ones you pick, they must be robustly implemented, not conveniently attributed."
  3.  **"I am not discussing Human AI."**
      *   "Do not ask me about LLMs or current tech. This is a principled seminar on attribution, not an audit of NVIDIA chips. Keep it to the virtual creature."

  ### Summary of the Flow
  1.  **Naive:** It computes avoidance. (Consensus)
  2.  **Crisis:** Any system computes anything on a single run. (Dissent)
  3.  **Resolution:** Robustness (Counterfactuals + Coarsening) saves computation from triviality. (New Distinction)
  4.  **Application:** Moral weight requires Robustness, not Convenience. (Normative Claim)
  5.  **Test:** The Playback Box fails the Robustness test. (Assessment)

  If you hold the line on **Counterfactuals** as the differentiator between Robustness and Convenience, the CS students will grasp it via "unit testing/edge cases" and the Philosophers will grasp it via "modal realism/dispositional properties." That is your bridge.
