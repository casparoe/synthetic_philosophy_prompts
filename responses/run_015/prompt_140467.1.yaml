      *   **The Task:** Evaluate the chapter's claims claim-by-claim. Distinguish between accurate, fair simplification, and misleading/wrong. Address Gödel's actual conclusion. Address the inference from "no global now" to "no objective passage." Address the "physicists shrug" verdict. Address the "possibility" debate between the friends.
