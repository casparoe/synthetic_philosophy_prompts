      *   *Claim 5: Time is an illusion/contributed by minds (Kantian).* -> **Accurate regarding Gödel's specific view.**
      *   *Claim 6: "All moments exist just as much as every other" (Block Universe).* -> **Nuanced.** This is often conflated with the "time is ideal" view, but they are distinct.
