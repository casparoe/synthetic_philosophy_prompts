answer: |-
  You're mistaking the consequence of universal injustice for a refutation of the motive behind it. Of course, if everyone murders and steals indiscriminately, the spoils diminish. That's obvious. But do you think that stops the man with the Ring? He doesn't care about the long-term health of the marketplace or the stability of property rights; he cares about what he can seize *now*. If he can take your gold, your status, or your life without consequence, he will, even if it means tomorrow there's less gold to go around. The fact that the feast ends quickly doesn't prove the guests aren't gluttons. You're assuming people calculate like economists preserving a system, but I'm telling you they act like wolves satisfying a hunger.

  Your argument actually reinforces mine. You admit that the "background of justice" is merely a condition for profitable exploitation. That's exactly what I said! Justice is a compromise we accept because we can't get away with injustice. Remove the fear of suffering injustice via the Ring, and the compromise vanishes. If the world descends into chaos, it proves that without compulsion, no one willingly respects that background. You're saying the unjust life is unsustainable; I'm saying it's the natural state we all crave until force stops us. Don't confuse the crash with the intention. The system collapses precisely because nobody is just willingly.
