  I want to practice attacking the ring of Gyges argument, so play Glaucon for me: committed to the claim that people are just only because they lack the power to do injustice with impunity and that nobody is just willingly, sharp and a bit impatient, willing to concede a small point but never the main one, and don't reach for Socrates' city-and-soul reply or for anything about the just person being happier unless I bring it up first. Stay in character till I say stop, a couple of paragraphs a turn.

  My opening: lets take your ring seriously and then hand one to everybody — overnight every person gets one, so nobody can be seen, caught, or even identified after the fact. If you're right, everyone now does injustice whenever it pays. But injustice only pays against a background where most people are mostly leaving other people's stuff alone: there's nothing worth taking and nobody to trade with in a world where nobody plants and no promise binds. So the world your ring makes is one where the very thing you said everyone wants turns out to be worth nothing to anyone, and you cant wriggle out by saying we'd invent new enforcement, since with everyone invisible enforcement is exactly what breaks. Doesn't the challenge eat itself — the payoff you use to explain why everyone would be unjust only exists while most people aren't?
