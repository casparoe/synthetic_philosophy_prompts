answer: |-
  During a justified defensive operation, a soldier from the aggressor nation is found pinned beneath a collapsed trench wall. He is uninjured but immobilized for several hours until his unit's recovery team arrives, a fact confirmed by intercepted communications. Though unarmed and physically incapable of violence in his current state, he remains conscious, explicitly refuses to surrender, and affirms his commitment to continue fighting for the unjust cause once freed. The just combatant cannot take him prisoner due to logistical constraints and cannot leave him without guaranteeing his return to hostilities, as the front line is too volatile to guard him.

  **The Two Verdicts**

  *   **Walzerian Conventionalism:** Permitted. The target is a legitimate military target because he holds the status of a combatant. He is not *hors de combat* because he has not surrendered, is not wounded, and is not unconscious. The convention of war grants immunity to civilians and protects those who are out of the fight, but it does not require combatants to pose an immediate kinetic threat to be liable. His status as a member of the opposing force is sufficient for liability, regardless of his temporary incapacity.
  *   **McMahan-Style Revisionism:** Permitted. The target is liable to defensive killing because he is morally responsible for an unjust threat that is inevitable. Although he poses no immediate danger, his confirmed rescue and stated intent make him a future unjust aggressor. Since non-lethal containment is impossible in this context, preventive killing is justified as a form of necessary defense against the certain harm he will inflict upon return to duty.

  **The Load-Bearing Feature**

  The single feature doing the work for the dangerousness ground is the **certainty of return to threat** (the confirmed rescue and intent). If you remove this feature—for example, if the rescue team was destroyed and the soldier would remain trapped forever—the Walzerian verdict remains Permitted (status is unchanged), but the Revisionist verdict flips to Impermissible (no future threat materializes, so liability lapses). This demonstrates that for the Walzerian, current or future dangerousness is not the actual trigger for liability; status is. For the Revisionist, dangerousness (even future) remains essential.

  **The Walzerian Objection**

  A Walzerian would argue that this scenario misrenders the "dangerousness" ground by conflating *capacity* with *status*. They would claim that combatants are targeted not because they are dangerous *in the moment*, but because they are *dangerous kinds of people* embedded in a dangerous institution. On this gloss, the soldier is never truly "harmless"; his membership in the armed force constitutes a standing threat that is merely dormant, not absent. The case targets the formulation that liability requires *active* dangerousness, but the Walzerian insists liability attaches to the *disposition* and *role* which persist even during immobilization.

  **Permanent Harmlessness Variation**

  If the harmless period is made permanent (the soldier is trapped indefinitely with no hope of rescue), the agreement collapses completely. The Walzerian still permits killing because the soldier retains his combatant status and remains part of the unjust force's order of battle. The Revisionist forbids killing because the soldier no longer poses a threat, future or otherwise, and thus lacks the moral liability required to justify lethal force. The verdicts diverge sharply, revealing that the agreement in the original case depended entirely on the Revisionist's ability to count future threat as present liability.

  **Where This Falls Apart**

  The design is most vulnerable at the step where the Revisionist agrees to **preventive killing based on operational constraints**. McMahan sets a high bar for necessity; he might argue that "logistical constraints" do not justify killing a currently harmless person if there is *any* alternative, such as marking the location for later capture or accepting the risk of guarding him. If the Revisionist concludes that the just combatant must absorb some additional risk to avoid killing a non-threatening person, the agreement vanishes immediately. The case assumes operational necessity overrides the presumption against killing harmless individuals for the Revisionist, but that is precisely where a strict liability theorist might dig in and say "Impermissible," breaking the symmetry with Walzer.
