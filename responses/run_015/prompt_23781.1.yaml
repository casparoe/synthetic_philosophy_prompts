answer: |-
  1. Divide the fourteen students into two groups of seven and hand each a sealed folder labeled "Committee A" or "Committee B" containing three case files with all necessary clinical and social context and a single-page charter of diagnostic criteria. Instruct them that they are expert panels tasked with determining which conditions officially count as diseases for insurance coverage purposes, requiring a unanimous verdict within twenty minutes while strictly adhering to their assigned charter.

  2. Committee A's charter restricts them to biological dysfunction and statistical deviation from a reference class, while Committee B must rely solely on judgments of harm, suffering, and social disvalue without referencing physiology. Provide both groups with identical cases like mild hypertension, homosexuality (historical), and a fictional gene edit that enhances memory but causes insomnia, ensuring the criteria force divergent outcomes.

  3. Committee A will stall on a universally harmful condition that is statistically typical for a reference class, such as severe dental caries in a specific population, while Committee B will struggle with a case where social disvalue pathologizes legitimate resistance, echoing drapetomania. Each group must document exactly where their rules prevented a verdict that aligns with their moral intuitions.

  4. Reconvene the full class to adjudicate a new unseen case together, explicitly introducing Christopher Boorse's biostatistical theory and Jerome Wakefield's harmful dysfunction analysis to explain the previous impasses. Guide them to see how the first group's struggle mirrors value-free naturalism and the second's mirrors pure normativism, mapping the wreckage of their rulebooks onto these established philosophical positions.

  5. Acknowledge that this binary setup obscures hybrid accounts and risks simplifying the historical entanglement of science and values into a clean procedural error. Warn students that real medical practice rarely operates under such pure constraints, meaning the exercise highlights theoretical boundaries rather than practical diagnostic reality.
