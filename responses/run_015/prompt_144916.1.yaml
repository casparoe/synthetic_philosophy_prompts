prompt: |-
  hey — i help run a volunteer crisis-line rota (about forty people, mostly students) and we're rewriting the one-page "what's actually expected of you" sheet we hand new volunteers, because the last version managed to both freak people out (they read every optional thing as secretly required and burned out inside two months) and let a couple of people coast (they'd describe straight-up required stuff as "going above and beyond"). my teammate priya says we should drop the moral-philosophy framing entirely and model the whole thing on a job. her pitch: the job description is your duty — written down in advance, you're blameworthy if you skip it, nobody thanks you for doing it. anything past that is overtime: genuinely optional, genuinely praiseworthy if done, zero blame if you clock off. she says that gives us a stable line we can actually print, and it also settles the thing we kept going in circles on — that an act doesn't stop being supererogatory (good but not required, "beyond duty") just because it happens to be easy and the stakes are enormous: you don't get fired for not doing a coworker's job, so likewise you're not obliged to give a kidney to a stranger just because the surgery is low-risk and it saves a life.

  i half buy it, but i can feel the analogy carrying weight it hasn't paid for, and the sheet is due sunday. so: can you audit it? start with the correspondence table — employee, employer, job description, employment contract, wage, overtime, being fired, the bonus, the performance review, the coworker who always stays late — and what each of those maps onto in the moral case, with an explicit question mark where there's nothing to map onto. then the disanalogies, sorted into ones that actually matter for our use and ones that don't. the ones i keep tripping over: (1) the ratchet — we had a volunteer who took every horrible shift for a year, and now new volunteers get side-eyed for not doing the same, and her old shifts feel de facto required; in a job, doing overtime never amends the contract, but here it seems to, which is bad news for "we'll just write the list down." (2) you can quit a job — you consented to the description and can walk — whereas you can't resign from morality, so it's unclear where the line gets its authority from at all. (3) overtime praise seems to presuppose somebody whose interests fix the baseline and who could legitimately ask for more at the next review; in the moral case who would that be, and if there is no one, is our "job description" just a record of what people here happen to do? (4) the escalation ladder we built for the sheet — hold a stranger's door, return a dropped wallet, stay twenty minutes late to cover a gap, take the christmas shifts, drive across town at 3am, donate a kidney — where, if anywhere, does optional flip to required? priya says never, but then i worry the job framing quietly makes everything optional (there's no boss to fire you) or, worse, makes the line whatever we happened to type up, which is circular for our purposes. (5) also, in a job nobody thanks you for doing your job, but people absolutely do thank volunteers for doing the baseline things, and we're not sure whether to put "say thank you" on the sheet as a requirement.

  what i want to know at the end is whether priya's second conclusion — that easiness plus huge stakes never converts the optional into the required, so the kidney case stays supererogatory — actually survives once the disanalogies are on the table, or whether the job picture was doing that work the whole time. and if there's a better analogy for a group like ours that isn't just whatever we wrote on the sheet with extra steps, i'd take it. keep it usable: flag which disanalogies should change what actually goes on the page.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Runs a volunteer crisis-line rota (approx. 40 volunteers, mostly students).
      *   **Problem:** The current "expectations" sheet is failing. It causes burnout (volunteers think optional = required) and coasting (volunteers think required = optional).
      *   **Teammate (Priya):** Proposes a "Job Model" analogy. Duty = Job Description (required, no praise, blame for skipping). Supererogatory = Overtime (optional, praise, no blame).
      *   **Priya's Specific Claim:** An act doesn't stop being supererogatory just because it's easy and stakes are high (e.g., donating a kidney).
      *   **User's Concern:** The analogy might be carrying weight it hasn't paid for. There are specific disanalogies (ratchet effect, inability to quit morality, source of authority, the escalation ladder, gratitude).
      *   **Deadline:** Sunday (urgent).
      *   **Goal:** Audit the analogy, map the terms, analyze disanalogies, evaluate Priya's conclusion about the kidney case, and provide actionable advice for the sheet.

  2.  **Deconstruct the Request:**
      *   **Task 1:** Create a Correspondence Table (Employee, Employer, Job Description, Contract, Wage, Overtime, Fired, Bonus, Review, Coworker).
      *   **Task 2:** Analyze Disanalogies (Sort into "Matters for Use" vs. "Doesn't Matter").
      *   **Task 3:** Address the 5 Specific Worry Points (Ratchet, Quitting, Authority/Praise, Escalation Ladder, Gratitude).
      *   **Task 4:** Evaluate Priya's Conclusion (Does easiness + high stakes make the kidney required?).
      *   **Task 5:** Suggest a Better Analogy (if applicable) or refine the current one.
      *   **Task 6:** Actionable Advice (What goes on the page).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the stakes. This is about preventing burnout while ensuring coverage. Validate Priya's instinct (clarity is good) but confirm the user's suspicion (the analogy has leaks).

      *   **Task 1: Correspondence Table:**
          *   Employee -> Volunteer.
          *   Employer -> The Organization / The Callers (Beneficiaries). *Nuance: It's not a profit entity.*
          *   Job Description -> The Rota/Shift Commitment + Basic Protocol.
          *   Contract -> The Volunteer Agreement (signed onboarding).
          *   Wage -> Training, Experience, Community, "Good Feelings" (Intrinsic/Non-monetary).
          *   Overtime -> Covering extra shifts, extra emotional labor, admin help.
          *   Being Fired -> Being removed from the rota (for breach of contract).
          *   Bonus -> Public recognition, references, leadership roles.
          *   Performance Review -> Supervision sessions / Feedback.
          *   Coworker who stays late -> The "Hero Volunteer" (problematic).
          *   *Missing:* The "Moral Lawgiver." In a job, the boss sets rules. In morality, who sets them?

      *   **Task 2 & 3: Disanalogies & The 5 Worry Points:**
          *   *(1) The Ratchet:* In jobs, overtime doesn't become mandatory. In volunteer cultures, it often does ("culture of martyrdom"). *Verdict:* Matters hugely. Needs explicit policy to prevent this.
          *   *(2) Quitting:* You can quit a job. You can quit volunteering. You can't quit morality generally, but you *can* quit this specific role. *Verdict:* Doesn't matter for the sheet. The sheet governs the *role*, not general morality.
          *   *(3) Authority/Praise:* In a job, the boss pays you. In volunteering, who praises? Peers? Coordinators? If no one has authority, is the baseline arbitrary? *Verdict:* Matters. The "Employer" is the Org, not abstract Morality.
          *   *(4) Escalation Ladder:* Where does optional flip to required? Priya says never. User worries this makes everything optional. *Verdict:* Crucial. The "Job Description" *is* the flip point.
          *   *(5) Gratitude:* Jobs don't thank you for basics. Volunteers *should*. *Verdict:* Matters for culture, but maybe not for the "Duty" definition.

      *   **Task 4: Evaluating Priya's Kidney Claim:**
          *   Priya says: Easy + High Stakes $\neq$ Required.
          *   Job Analogy Support: You aren't fired for not giving a kidney.
          *   Disanalogy Check: The Job Analogy limits obligation to the *contract*. The Kidney case is *outside* the contract.
          *   *Conclusion:* Priya is right *for the volunteer role*, but maybe wrong for *general morality*. However, for the *sheet*, she is right. The sheet defines the *role*, not the human being's total moral obligation. The kidney is outside the scope of the "Volunteer Job."
          *   *Refinement:* The Job Analogy works because it limits the *scope of accountability*, not necessarily the scope of *moral goodness*.

      *   **Task 5: Better Analogy?**
          *   "Job" is actually pretty good for *accountability*.
          *   "Team Sport" might be better for *culture* (you let the team down if you don't show, but you aren't a paid employee).
          *   "Promise/Commitment" model?
          *   *Decision:* Stick with "Job/Contract" for the *Sheet* (clarity), but use "Team/Community" for the *Culture* (to handle gratitude and burnout).

      *   **Task 6: Actionable Advice for the Sheet:**
          *   Explicitly define "Core Shifts" vs. "Cover Shifts."
          *   Add a "Ratchet Clause" (Doing extra doesn't set a new standard).
          *   Clarify the "Quit" process (It's okay to step back).
          *   Address Gratitude (We thank you for Core, we celebrate Extra).

  4.  **Refining the Tone:**
      *   Needs to be practical, philosophical but grounded, and empathetic to the burnout risk.
      *   Avoid overly academic jargon where possible, but the user used terms like "supererogatory," so match that level.
      *   Keep it structured for quick reading (deadline is Sunday).

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific question about the kidney?
      *   *Correction:* Make sure to distinguish between "Moral Obligation as a Human" vs. "Obligation as a Volunteer." The sheet is about the latter. Priya's claim holds for the sheet, even if debatable in ethics class.
      *   *Check:* Did I address the "Ratchet"?
      *   *Correction:* This is the biggest practical risk. Need to emphasize that the "Job Description" must be static, not dynamic based on past performance.
      *   *Check:* The "Gratitude" point.
      *   *Correction:* In a job, thanks are inefficient. In volunteering, thanks are *fuel*. The sheet shouldn't ban thanks, but should clarify that thanks aren't *payment* for duty.

  6.  **Final Polish:** Organize with clear headings. Ensure the "Verdict" is clear. (Proceed to generate output).

  *(Self-Correction Note during final review)*: Wait, I need to make sure I don't validate the "Job" analogy too much if it's fundamentally flawed for *morality*. But the user asked about the *sheet* for *volunteers*. Volunteers *are* in a quasi-employment relationship (agreement, shifts, expectations). So the Job Analogy is actually stronger here than in general ethics. I need to highlight that distinction. The sheet isn't defining "Good Person," it's defining "Good Volunteer."

  Okay, let's build the response.
answer: |-
  This is a high-stakes document. If it fails, you lose coverage or burn out your team. Priya is right that clarity requires a hard line, but you are right to worry that the *source* of that line's authority is shaky in a volunteer context.

  Here is the audit of the "Job Model" analogy, the disanalyses of your five worry points, and a concrete recommendation for Sunday's draft.

  ### 1. The Correspondence Table
  *Mapping Priya's Job Model to the Volunteer Context.*

  | Job Term | Volunteer/Moral Equivalent | Notes/Warnings |
  | :--- | :--- | :--- |
  | **Employee** | The Volunteer | |
  | **Employer** | The Organization (and indirectly, the Callers) | Not "Morality" generally. |
  | **Job Description** | **The Rota Commitment + Basic Protocol** | This is your "Duty." |
  | **Employment Contract** | The Volunteer Agreement (Onboarding) | Signed consent to the JD. |
  | **Wage** | Training, Supervision, Community, Impact | Intrinsic/Non-monetary. |
  | **Overtime** | **Covering extra shifts / Emotional labor beyond protocol** | This is "Supererogatory." |
  | **Being Fired** | Removed from the Rota | For breaching the Agreement. |
  | **The Bonus** | References, Leadership Roles, Public Recognition | |
  | **Performance Review** | Supervision Sessions / Feedback | |
  | **Coworker who stays late** | The "Hero Volunteer" | **Danger Zone.** See "The Ratchet." |
  | **The Boss** | The Coordinators (You/Priya) | Authority to enforce the JD. |
  | **Labor Law** | **?** | No external regulator protects the volunteer from the org. |
  | **Resignation** | Stepping down from the rota | Distinct from "quitting morality." |

  ### 2. The Disanalogies (Sorted)

  **Category A: Doesn't Matter for the Sheet**
  *   **You can't quit morality (Worry #2):** True, but irrelevant. You *are* writing a sheet for a specific *role*, not for "Being A Good Human." A volunteer can quit the rota without quitting morality. The sheet governs the role, not the soul.
  *   **No external Labor Law:** While true, you (the coordinators) function as HR. As long as you enforce the rules consistently, the lack of a government regulator doesn't change the internal dynamic.

  **Category B: Matters Crucially for the Sheet**
  *   **The Ratchet (Worry #1):** In a job, if I work unpaid overtime for a year, my contract does not update automatically. In volunteer cultures, it *does*. If Sarah takes every Christmas shift for three years, new volunteers assume Christmas shifts are mandatory.
      *   *Impact:* The "Job Description" must be explicitly static.
  *   **The Source of Praise (Worry #3):** In a job, the boss pays the wage. In volunteering, "wages" are social. If the baseline is "just a job," who validates it? If no one thanks you for baseline work, retention drops.
      *   *Impact:* You cannot treat baseline work with the coldness of a corporate job.
  *   **The Escalation Ladder (Worry #4):** In a job, the line is the contract. In morality, the line is fuzzy. If you use the Job Model, you must admit the line is *administrative*, not *moral*.
      *   *Impact:* You must define the "Contract" narrowly.
  *   **Gratitude (Worry #5):** In a job, thanks are inefficient. In volunteering, thanks are fuel.
      *   *Impact:* The sheet cannot imply baseline work is unworthy of thanks.

  ### 3. Auditing Priya's Five Worry Points

  **(1) The Ratchet**
  *   **Diagnosis:** This is the biggest risk. In informal economies (volunteering), social norms override written contracts. If "Hero Volunteer" sets a precedent, the written sheet becomes a lie.
  *   **Fix:** The sheet needs a **"Baseline Clause."** Explicitly state: *"Taking extra shifts is generous, but it does not change the minimum requirement for you or anyone else."* You must actively manage the "Hero Volunteers" to ensure they aren't setting de facto policy.

  **(2) Quitting**
  *   **Diagnosis:** You are conflating "Morality" with "The Rota."
  *   **Fix:** Ignore general morality. The sheet is for the *Rota*. You *can* quit the rota. The authority comes from the **Volunteer Agreement** they signed, not from the Categorical Imperative. Make sure they sign something that references this sheet.

  **(3) Authority & Praise**
  *   **Diagnosis:** Priya worries that without a "Boss" with skin in the game, the baseline is arbitrary.
  *   **Fix:** The "Boss" is the Organization's sustainability. If everyone does only the baseline, does the phone get answered? If yes, the baseline is valid. If no, the baseline is too low. The authority is **operational necessity**, not moral philosophy.

  **(4) The Escalation Ladder (Door → Wallet → Kidney)**
  *   **Diagnosis:** Priya says the line never flips. You worry this makes everything optional.
  *   **Fix:** The line flips at **Consent**.
      *   *Door/Wallet:* General morality (not on the sheet).
      *   *Covering a gap/Christmas:* Volunteer role (Optional/Overtime).
      *   *Assigned Shift:* Volunteer role (Required/Job Description).
      *   *Kidney:* General morality (Optional/Supererogatory).
      *   *The Sheet's Job:* It only covers the middle two. It must explicitly exclude the first and last.

  **(5) Gratitude**
  *   **Diagnosis:** "Nobody thanks you for doing your job" is bad advice for volunteers.
  *   **Fix:** Distinguish between **Validation** and **Praise**.
      *   *Baseline:* Validated ("Thank you for holding the line/being reliable").
      *   *Overtime:* Praised ("Thank you for going above and beyond").
      *   Do not put "Say thank you" on the sheet as a *duty for volunteers*, but put it on the *Coordinators'* checklist.

  ### 4. The Verdict on Priya's Kidney Claim

  **Does easiness + huge stakes make the kidney required?**
  Priya's conclusion survives, but not for the reason she thinks.

  *   **Priya's Argument:** It's supererogatory because it's not in the job description.
  *   **The Leak:** In general morality, many philosophers argue that low-cost/high-benefit acts *are* required (e.g., Singer's drowning child).
  *   **The Save:** You are not writing a sheet on **General Morality**. You are writing a sheet on **Role Obligations**.
      *   Even if a kidney *is* morally required of a human being, it is **not required of a Crisis Line Volunteer**.
      *   The Job Model works here because it **limits liability**. It tells the volunteer: *"We are not asking for your kidney. We are asking for your shift."*
      *   **Conclusion:** Priya is right for the purpose of the sheet. The "Job" framing successfully walls off the "Kidney" question by defining the scope of the role.

  ### 5. A Better Analogy: "The Crew"

  The "Job" analogy is good for boundaries, but bad for culture (too transactional). The "Family" analogy is good for culture, bad for boundaries (too guilt-inducing).

  **Recommendation:** Use a **"Sports Team / Crew"** hybrid for the text, but keep the "Job" logic for the enforcement.
  *   **Why:** On a crew, everyone has a specific station. If you leave your station, the ship sinks (Duty). If you help another station, you're a hero (Overtime). But if one person starts scrubbing the deck *and* swabbing the sails every day, the Captain steps in and tells them to stop, because it makes the rest of the crew look bad.

  ### 6. Actionable Advice: What Goes On The Page

  To make this usable by Sunday, structure the sheet into three distinct boxes. Do not write paragraphs of philosophy.

  **Box 1: The Contract (The "Job Description")**
  *   **Header:** *Non-Negotiable Commitments*
  *   **Text:** "These are the requirements to remain on the rota. Doing these does not make you 'extra good,' it makes you a member of the team. Skipping these without notice is a breach of agreement."
  *   **List:** [X] shifts per month, [X] supervision sessions, [X] notice for cancellation.
  *   **The Ratchet Clause:** *"Note: Some volunteers take more shifts than this. That is generous, but it does not change this minimum requirement for you or anyone else."*

  **Box 2: The Overtime (The "Supererogatory")**
  *   **Header:** *Going Above & Beyond*
  *   **Text:** "These actions are genuinely optional. You will never be penalized for not doing them. We celebrate them when they happen, but we do not expect them."
  *   **List:** Covering last-minute gaps, taking holiday shifts, mentoring new volunteers.
  *   **The Kidney Wall:** *"We ask for your time and attention, not your personal resources or health. Anything outside the scope of the shift is optional."*

  **Box 3: The Culture (Addressing Gratitude & Burnout)**
  *   **Header:** *How We Treat Each Other*
  *   **Text:** "We thank each other for Box 1 work because reliability is the backbone of this service. We celebrate Box 2 work because it strengthens the community. If you are only doing Box 1, you are in good standing."
  *   **Exit Ramp:** *"If Box 1 becomes too heavy, talk to us. It is better to step back than to burn out. You can resign from the rota without resigning from caring."*

  **Final Check:**
  Does this solve the burnout? Yes, by capping expectations (Box 1).
  Does this solve the coasting? Yes, by defining Box 1 as "Non-Negotiable."
  Does it handle the Kidney? Yes, by explicitly walling it off in Box 2.
  Does it handle the Ratchet? Yes, via the explicit clause.

  Priya's "Job" logic is the skeleton; make sure you put enough "Crew" flesh on it so it doesn't feel cold. Good luck with Sunday.
