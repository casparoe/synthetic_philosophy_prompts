prompt: |-
  hi — I write SF novels (the kind with a lot of argument in them, sorry) and I'm stuck on a chapter. There's a character, Marta, who has to write the expedition report on whether the locals count as thinkers at all, and I want her reasoning to be better than two cliches trading slogans. The creatures in my book are:

  the Shoal — a colony of about ten thousand small organisms. There is no single body whose states do anything. The patterns that would play the belief and desire roles only exist across the whole colony, and if you remove any one organism the pattern survives but reorganises.

  the mimics — behaviourally indistinguishable from us, internally nothing like us: same inputs, same outputs, different machinery, and on top of that the machinery that does the job on Tuesday isn't the machinery that does it on Thursday.

  the sleepers — internally full of the right states, causally wired to each other in all the right ways, but nothing downstream ever reaches behaviour. They never move differently because of what they believe.

  Marta's colleagues have two lines and I don't want her to just recite them. One says: same job, so same mind — which as far as I can tell collapses into saying a thermostat or a national economy has beliefs. The other says: no neurons, no mind — which my readers will see through in a paragraph.

  So what I actually want, before I write the scene, is the spec. Write me the list of requirements any theory of what-it-is-to-have-a-belief has to meet to be any good at cases like these. Cases it has to give a verdict on. Distinctions it isn't allowed to flatten — having a mind vs. having the same kind of mind we have; being in a state vs. that state being realised by something; the state vs. whatever plays the role; how fine-grained the job description gets to be; occurrent vs. merely dispositional. And the arguments it has to survive: the old one where it turns out every damn system realises some role or other (Putnam's, I think?), and the one about whether the realiser or the role is what does the causal work.

  For each requirement give me the case or consideration behind it, and mark which ones are non-negotiable and which are just what one camp happens to want. Then flag any pair of requirements I probably can't have both of — that's the bit I most want, because it gives me something for Marta to genuinely be stuck on rather than something she wins.

  If there's room at the end, a short scorecard for the obvious candidates: the it's-the-job-not-the-stuff view, the view that mental states are just brain states, and whatever the current version is where the science tells you what the realiser is and the folk theory only fixes the role. But keep the weight on the requirements, that's the part I can't get from a skim. And no reading list or footnotes — my character is on a planet without a library, and neither of us can look anything up.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** SF novelist writing "argument-heavy" SF.
      *   **Problem:** Stuck on a chapter where a character (Marta) must write a report on whether alien entities count as "thinkers."
      *   **Entities:**
          *   *The Shoal:* Distributed cognition, no single body, patterns survive removal of parts (hive mind/extended mind variant).
          *   *The Mimics:* Functional duplicates of humans, but different/substitutable internal machinery (silicon? magic? fluctuating substrate).
          *   *The Sleepers:* Perfect internal causal structure, but no output/behavior (locked-in syndrome on a species scale).
      *   **Existing Colleague Views (to avoid):** "Same job = same mind" (too broad, includes thermostats) vs. "No neurons = no mind" (too chauvinistic).
      *   **Task:** Create a "spec" (list of requirements) for a theory of belief/mind that handles these cases.
      *   **Specifics:** Include cases/considerations, mark non-negotiable vs. optional, flag incompatibilities (trade-offs), and provide a brief scorecard of candidate theories.
      *   **Constraints:** No reading list, no footnotes (character is planet-side), focus on the requirements/trade-offs.

  2.  **Deconstruct the Philosophical Landscape (Mental Simulation):**
      *   The prompt touches on Philosophy of Mind: Functionalism, Identity Theory, Behaviorism, Eliminativism, Panpsychism (maybe), and the specific problem of Multiple Realizability.
      *   *The Shoal* challenges the location of the mind (individual vs. collective) and substrate independence.
      *   *The Mimics* challenge the necessity of specific physical realization (Multiple Realizability) and temporal stability of the realizer.
      *   *The Sleepers* challenge the necessity of output/behavior (Behaviorism vs. Internalism).
      *   *The "Thermostat" objection* is the classic "triviality" or "pancomputationalism" objection to Functionalism (Putnam/Searle).
      *   *The "Causal Work" objection* is the Exclusion Problem or the debate over whether roles or realizers do the causing (Kim).

  3.  **Drafting the Requirements (The "Spec"):**
      *   I need to formulate these as engineering/evaluation criteria for Marta.
      *   *Requirement 1: Multiple Realizability.* (Handles Mimics). Needs to allow different stuff to do the same job.
      *   *Requirement 2: Causal Efficacy.* (Handles the "does it do anything?" question). Beliefs must cause things.
      *   *Requirement 3: The Boundary Problem.* (Handles Shoal). Where does the mind start and stop?
      *   *Requirement 4: The Output Constraint.* (Handles Sleepers). Does behavior matter?
      *   *Requirement 5: Triviality Avoidance.* (Handles Thermostats). Not everything can be a mind.
      *   *Requirement 6: Temporal Stability.* (Handles Mimics on Tuesday/Thursday). If the machinery changes, is it the same mind?
      *   *Requirement 7: Grain Sensitivity.* (Handles "same kind of mind"). Is a mimic mind *human* mind or just *a* mind?

  4.  **Identifying Trade-offs (The "Stuck" Point):**
      *   This is the core of the user's request. Marta needs to be genuinely conflicted.
      *   *Conflict A:* Multiple Realizability vs. Triviality Avoidance. If you make the job description abstract enough to include Mimics, you risk including thermostats. If you make it specific enough to exclude thermostats, you exclude Mimics.
      *   *Conflict B:* Causal Efficacy vs. The Sleeper Problem. If beliefs must cause behavior, Sleepers have no minds. If beliefs are just internal states, Sleepers have minds, but then how do we know? And do the states *do* anything?
      *   *Conflict C:* Location (Shoal) vs. Unity. If the pattern survives part removal, is the mind the pattern or the organisms? If it's the pattern, is it a ghost? If it's the organisms, where is the belief?

      *Decision:* The strongest tension for a novel is usually between *Inclusivity* (Mimics/Shoal count) and *Non-Triviality* (Thermostats don't count). This is the "Liberalism vs. Chauvinism" tension. Another strong one is *Internalism (Sleepers)* vs. *Externalism/Behaviorism*. Let's highlight the "Triviality vs. Flexibility" trade-off as the primary deadlock.

  5.  **Refining the Requirements (Iterative Polish):**
      *   Make the language sound like a spec sheet but philosophically rigorous.
      *   Ensure the three alien cases are explicitly mapped to the requirements.
      *   Distinguish between "Must Haves" (Non-negotiable for *any* working theory) and "Should Haves" (Philosophical preferences).

  6.  **Developing the Scorecard:**
      *   *Functionalism (Job Description):* Good for Mimics/Shoal, bad for Thermostats (Triviality), bad for Sleepers (if behavior is required).
      *   *Neuro-Identity (Stuff Description):* Good for Triviality, bad for Mimics/Shoal.
      *   *Hybrid/Teleological (Science fixes role):* Attempts to solve Triviality by adding "proper function," but struggles with Shoal (what's the proper function of a colony?).

  7.  **Review against Constraints:**
      *   No footnotes/reading list? Check.
      *   Focus on requirements? Check.
      *   Address the specific aliens? Check.
      *   Tone: Professional, analytical, helpful for a writer.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just solve the problem for Marta. The prompt asks for the *spec* and the *conflicts* so she can be stuck. The conclusion shouldn't be "Here is the answer," it should be "Here is why you can't pick."
      *   *Clarification:* Ensure the distinction between "Role" and "Realizer" is clear, as the prompt specifically asked for it.
      *   *Tone Check:* The user writes "argument-heavy" SF. They know their stuff. Don't dumb it down. Use terms like "Multiple Realizability," "Causal Exclusion," "Triviality," but explain them in context.

  9.  **Final Output Structure:**
      *   Intro: Acknowledge the task.
      *   Section 1: The Spec (Requirements with Case/Consideration, Mandatory/Optional).
      *   Section 2: The Incompatibilities (The "Stuck" points).
      *   Section 3: The Scorecard (Brief evaluation of candidates).
      *   Closing: Encouragement.

  *(Self-Correction on the "Sleepers"):* The prompt says Sleepers have internal states wired right but no output. This is a direct hit on Behaviorism. A Functionalist might say they have minds *if* the disposition to act is there, even if blocked. But if they *never* move differently, do they have dispositions? This needs careful handling in the spec. I will frame it as the "Idle Engine" problem.

  *(Self-Correction on the "Shoal"):* This is the "Extended Mind" or "Group Mind" problem. The spec needs to address *spatial/temporal boundaries*.

  *(Self-Correction on "Mimics"):* This is classic Multiple Realizability + "Shifting Realizers."

  Let's assemble the response.cw
answer: |-
  Here is the spec for a theory of belief. It is structured as an evaluation matrix Marta might use to audit the competing definitions.

  ### The Spec: Requirements for a Theory of Belief

  **1. The Multiple Realizability Constraint**
  *   **The Case:** The Mimics. They produce human-identical output using different, shifting internal machinery.
  *   **The Requirement:** The definition of belief cannot depend on a specific physical substrate (e.g., carbon, neurons, silicon). It must define the state by what it *does*, not what it *is*.
  *   **Status:** **Non-Negotiable.** If you fail this, you cannot account for the Mimics without calling them liars, which contradicts the premise that they are behaviorally indistinguishable.
  *   **The Trap:** If you make the "what it does" description too abstract to allow different substrates, you risk satisfying Requirement #5 (see below).

  **2. The Causal Efficacy Constraint**
  *   **The Case:** All three, but specifically the Sleepers.
  *   **The Requirement:** A belief must be capable of making a difference. It cannot be an epiphenomenon. If a state is labeled a "belief," it must participate in the causal chain that leads to *something* (either further internal states or external behavior).
  *   **Status:** **Non-Negotiable.** A belief that changes nothing is indistinguishable from no belief at all.
  *   **The Trap:** If you demand the causal chain *must* reach muscle movement, you fail the Sleepers. If you allow the causal chain to stop at the border of the skin, you struggle to explain how we verify the belief exists.

  **3. The Boundary Constraint**
  *   **The Case:** The Shoal.
  *   **The Requirement:** The theory must specify where the believer begins and ends. It must decide if the believer is the individual organism, the colony pattern, or the environment supporting the pattern.
  *   **Status:** **Non-Negotiable.** You cannot write an expedition report on "the local thinker" if you cannot count them.
  *   **The Trap:** If the boundary is defined by physical continuity, the Shoal fails. If defined by informational integration, you risk including the local radio waves or the ecosystem.

  **4. The Triviality Constraint (The Thermostat Check)**
  *   **The Case:** The Colleague's "Same Job" argument.
  *   **The Requirement:** The definition must not be so permissive that it attributes beliefs to simple homeostatic systems (thermostats, tides, national economies).
  *   **Status:** **Non-Negotiable.** If everything has beliefs, the word "belief" loses its explanatory power.
  *   **The Trap:** To avoid this, you usually have to tighten the "job description" of a belief. But if you tighten it too much, you violate Requirement #1 (Multiple Realizability) and exclude the Mimics.

  **5. The Stability Constraint**
  *   **The Case:** The Mimics (Tuesday vs. Thursday machinery).
  *   **The Requirement:** The identity of the believer must persist through changes in the realizing machinery. If the hardware swaps out but the pattern continues, the mind must remain the same mind.
  *   **Status:** **Optional (Camp Dependent).** A "Substrate Chauvinist" will fail this intentionally. A "Patternist" must pass it.
  *   **The Trap:** This requires the theory to treat the *role* as more real than the *realizer*. This invites the "Causal Exclusion" problem (see Incompatibility B).

  **6. The Verification Constraint**
  *   **The Case:** The Sleepers.
  *   **The Requirement:** There must be a way, in principle, to distinguish a Sleeper from a corpse.
  *   **Status:** **Optional (Camp Dependent).** An Internalist says we can't know but they still have minds. An Externalist/Behaviorist says if we can't know, they don't have minds.
  *   **The Trap:** If you require third-person verification, the Sleepers are dead. If you allow first-person privilege, how does Marta verify it in the report?

  ***

  ### The Incompatibilities (Where Marta Gets Stuck)

  You asked for the pairs of requirements she probably cannot have both of. This is the source of the drama. She cannot satisfy the whole spec. She must choose which requirement to violate.

  **Conflict A: The Liberalism vs. Triviality Trade-off**
  *   **The Clash:** Requirement #1 (Multiple Realizability) vs. Requirement #4 (Triviality).
  *   **The Problem:** To include the Mimics, you must define belief as a functional role (input X + internal state Y = output Z). But to exclude the thermostat, you must make that role complex. How complex? If you say "it must handle language," you might exclude the Shoal. If you say "it must handle homeostasis," you include the thermostat.
  *   **The Stuck Point:** If Marta writes that the Mimics are thinkers, she must admit that a sufficiently complex economy is also a thinker. If she writes that the economy is not a thinker, she must admit the Mimics might not be either. She has no principled line to draw that saves the Mimics but sinks the Thermostat.

  **Conflict B: The Causal Exclusion Trade-off**
  *   **The Clash:** Requirement #2 (Causal Efficacy) vs. Requirement #5 (Stability/Role Priority).
  *   **The Problem:** If the *role* is what matters (to save the Mimics), then the physical stuff is just incidental. But only the physical stuff actually pushes atoms around. The "pattern" doesn't fire the neuron; the chemistry does. If the pattern is just a description, it doesn't *do* anything.
  *   **The Stuck Point:** If Marta says the Shoal's pattern is the thinker, she has to explain how a pattern (which is abstract) causes physical changes without the organisms doing the work. If she says the organisms do the work, the pattern isn't the thinker. She has to choose: either the mind is real but causally impotent (a ghost), or it is causally potent but identical to the specific biology (which excludes the Mimics).

  **Conflict C: The Sleeper's Dilemma**
  *   **The Clash:** Requirement #2 (Causal Efficacy) vs. Requirement #6 (Verification).
  *   **The Problem:** The Sleepers have internal causation but no external output. To say they have minds, Marta must value internal causation. But if internal causation is enough, how does she distinguish them from rocks that are internally vibrating due to heat?
  *   **The Stuck Point:** If she grants the Sleepers minds, she makes the mind private and unreportable (bad for an expedition report). If she denies them minds, she implies that a paralyzed human has no mind (bad for ethics).

  ***

  ### The Scorecard (Candidate Theories)

  Here is how the obvious candidates fail the spec. Marta can use this to shoot down her colleagues.

  **1. Functionalism (It's the Job, Not the Stuff)**
  *   **Verdict:** Passes Mimics and Shoal. Fails Thermostats and Sleepers.
  *   **Why:** It handles the shifting machinery of the Mimics perfectly. It handles the distributed nature of the Shoal.
  *   **Fatal Flaw:** It cannot stop the "Triviality" slide. A thermostat seeks a temperature goal (belief) and acts to achieve it (desire). To stop this, Functionalists have to add arbitrary complexity clauses. It also struggles with Sleepers: if the output is permanently disconnected, is the function broken or just unmanifested?
  *   **Marta's Problem:** If she uses this, she has to recommend rights for the local economy.

  **2. Identity Theory (No Neurons, No Mind)**
  *   **Verdict:** Passes Thermostats and Sleepers (if wired). Fails Mimics and Shoal.
  *   **Why:** It solves Triviality easily (only specific biology counts). It handles Sleepers easily (internal state is sufficient).
  *   **Fatal Flaw:** It is scientifically chauvinistic. It forces Marta to classify the Mimics as "Philosophical Zombies"—things that act exactly like us but feel nothing. This is unfalsifiable and pragmatically useless for an expedition trying to avoid conflict.
  *   **Marta's Problem:** If she uses this, she might authorize hunting the Mimics because they "don't really feel pain."

  **3. Teleological Functionalism (The Hybrid)**
  *   **Verdict:** Passes Thermostats (maybe). Fails Shoal.
  *   **Why:** This view says a state is a belief only if the system was *designed* (by evolution or engineers) to have that state. This excludes random rocks and thermostats (usually).
  *   **Fatal Flaw:** It breaks on the Shoal. What is the "proper function" of a colony that reorganizes when parts are removed? Is the colony the organism, or are the organisms the organisms? If the colony has no evolutionary history distinct from the bugs, does it have a mind?
  *   **Marta's Problem:** She can't determine the evolutionary history of the Shoal in time for the report. She has to guess whether the pattern is selected for, or just a side effect.

  ### Summary for the Scene

  Marta is stuck because she wants a theory that grants the Mimics moral status (to protect them) but denies the Shoal/Economy moral status (to allow resource extraction), while also ensuring the Sleepers aren't left to die.

  *   To save the Mimics, she needs **Functionalism**.
  *   To save the Resources (from the Shoal), she needs **Identity Theory**.
  *   To save the Sleepers, she needs **Internalism**.

  She cannot have all three. The chapter's tension comes from her realizing that whichever definition she writes into the report, she is actively choosing who counts as a person and who counts as equipment. The "argument" isn't about the aliens; it's about which requirement she is willing to violate.
