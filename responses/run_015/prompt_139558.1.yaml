  # Metaethical Diagnostic: The Is-Ought Derivation Tree

  **Instructions:** This instrument sorts metaethical positions based on your intuitions about logical derivation, not by asking you to label yourself. We begin from the shared seminar commitment that the judgment *"Torturing a child for amusement is wrong"* is true. Answer the following questions based on how you understand the *logic* and *metaphysics* of that judgment.

  ### The Decision Tree

  **Node 1 (The Humean Gap):** Consider the inference: *"This procedure inflicts prolonged conscious suffering on an innocent being"* $\rightarrow$ *"This procedure is wrong."*
  Is this inference **valid as it stands**, or does it require an unstated bridge premise (e.g., *"Suffering is bad"*)?
  *   **Valid as stated** (Descriptive facts carry normativity inherently) $\rightarrow$ Go to **Node 2**.
  *   **Requires Bridge** (There is a logical gap between Is and Ought) $\rightarrow$ Go to **Node 4**.

  **Node 2 (The Source of Normativity):** If the inference is valid, is the normativity grounded in the **internal standards or functions** of a specific kind of thing (e.g., a knife, a parent, a human)?
  *   **Yes** (Goodness = fulfilling function) $\rightarrow$ Go to **Node 3**.
  *   **No** (Wrongness is just part of the meaning of the descriptive terms) $\rightarrow$ **Leaf A: Reductive/Analytic Ethical Naturalism**.

  **Node 3 (The Kind):** Is the relevant "kind" primarily defined by **biological life-form** (e.g., human offspring, species survival)?
  *   **Yes** $\rightarrow$ **Leaf B: Neo-Aristotelian Naturalism**.
  *   **No** (Defined by social roles, institutions, or artifacts) $\rightarrow$ **Leaf C: Institutional/Functional Normative Descriptivism**.

  **Node 4 (Truth-Aptness):** If a bridge is required, does the judgment *"Torture is wrong"* function to **describe a state of affairs** (like "The cat is on the mat")?
  *   **No** (It expresses an attitude/stance) $\rightarrow$ Go to **Node 5**.
  *   **Yes** (It asserts a fact) $\rightarrow$ Go to **Node 6**.

  **Node 5 (Discipline of Discourse):** If it expresses an attitude, do we nonetheless preserve the **logical features of truth-talk** (validity, negation, embedding) in serious moral discourse?
  *   **No** (It is purely projective/emotive) $\rightarrow$ **Leaf D: Non-Cognitivist Projectivism**.
  *   **Yes** (We earn the right to truth-talk) $\rightarrow$ **Leaf E: Quasi-Realist Expressivism**.

  **Node 6 (Reference):** If it describes a fact, does the predicate 'wrong' successfully **refer to a property** in the world?
  *   **No** (All moral claims are false; no such properties exist) $\rightarrow$ **Leaf F: Error Theory**.
  *   **Yes** (Moral properties exist) $\rightarrow$ Go to **Node 7**.

  **Node 7 (The Bridge Source):** If moral properties exist, is the bridge premise (connecting suffering to wrongness) grounded in **requirements of practical rationality/agency**?
  *   **Yes** (Normativity comes from the standpoint of the agent) $\rightarrow$ **Leaf G: Constructivism**.
  *   **No** (Normativity is mind-independent) $\rightarrow$ Go to **Node 8**.

  **Node 8 (Naturalism):** Is the property 'wrongness' **identical to a natural property** (investigable by empirical science), even if this identity is not obvious?
  *   **Yes** $\rightarrow$ **Leaf H: Non-Reductive (Synthetic) Ethical Naturalism**.
  *   **No** (It is a distinct, *sui generis* property) $\rightarrow$ **Leaf I: Moorean Non-Naturalism**.

  ***

  ### Probe Derivation Analysis

  *The following six derivations test the integrity of the tree. Each probe targets a specific Node or Leaf.*

  **1. The Bread Knife** (*Designed for slicing $\rightarrow$ Bad knife*)
  *   **Target Node:** Node 2 & 3.
  *   **Status:** **Valid.**
  *   **Why:** Tests functional evaluation. Leaves B and C accept this as paradigmatic normativity. Leaf A (Analytic) might accept it only if 'bad' is defined functionally. Leaves D, E, F reject the normativity as non-descriptive or false.
  *   **Leaf Acceptance:**
      *   **Accept:** B, C.
      *   **Refuse:** D, E, F, G (unless instrumental), I (unless bridged).

  **2. The Promise** (*Words spoken in practice $\rightarrow$ Ought to pay*)
  *   **Target Node:** Node 3.
  *   **Status:** **Valid Enthymeme.**
  *   **Why:** Tests institutional facts. Requires the hidden premise "One ought to keep promises in this practice."
  *   **Leaf Acceptance:**
      *   **Accept:** C (Institutional), G (Constructivist - willing the maxim).
      *   **Refuse:** F (Error), D (Projectivism - logic invalid).

  **3. The Train** (*Want Leeds $\rightarrow$ Take train*)
  *   **Target Node:** Node 7.
  *   **Status:** **Valid (Hypothetical).**
  *   **Why:** Tests instrumental rationality. Distinguishes Constructivism (reasons from agency) from Realism (reasons from world).
  *   **Leaf Acceptance:**
      *   **Accept:** G (Constructivism), A (if 'should' is analytic relative to desire).
      *   **Refuse:** I (Moorean - requires categorical 'ought'), B (unless biological need).

  **4. The Parent** (*Offspring helpless $\rightarrow$ Ought to care*)
  *   **Target Node:** Node 3.
  *   **Status:** **Valid (for some).**
  *   **Why:** Tests biological normativity. The crux of Neo-Aristotelianism.
  *   **Leaf Acceptance:**
      *   **Accept:** B (Neo-Aristotelian).
      *   **Refuse:** C (Institutional - biology isn't institution), I (Moorean - gap exists), F (Error).

  **5. The Testimony** (*Society needs truth $\rightarrow$ Ought not lie*)
  *   **Target Node:** Node 1 & 3.
  *   **Status:** **Valid Enthymeme.**
  *   **Why:** Tests sociological functionalism. Bridges Is (societal persistence) to Ought (norm).
  *   **Leaf Acceptance:**
      *   **Accept:** C (Institutional), H (Synthetic Naturalist).
      *   **Refuse:** I (Moorean - Open Question remains), D, E.

  **6. The Torture** (*Suffering $\rightarrow$ Wrong*)
  *   **Target Node:** Node 1 (The Core).
  *   **Status:** **Valid / Invalid / Enthymeme.**
  *   **Why:** The shared commitment case.
  *   **Leaf Acceptance:**
      *   **Accept:** A, B, H, I (as conclusion), G.
      *   **Refuse:** F (Conclusion false), D (Derivation invalid), E (Derivation invalid, conclusion quasi-true).

  ***

  ### Leaf Profiles & Awkward Commitments

  | Leaf | Position | Accepts Probes | Refuses Probes | Awkward Commitment |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | **Analytic Naturalism** | 1, 6 | 4, 5 (as enthymemes) | Moral disagreement becomes verbal misunderstanding (like arguing over "bachelor"). |
  | **B** | **Neo-Aristotelian** | 1, 4, 6 | 2, 3 (as non-moral) | Must explain why "defective human" entails "moral wrong" without naturalizing normativity away. |
  | **C** | **Institutional Descriptivism** | 1, 2, 5 | 4, 6 (without institution) | Morality collapses into social rules; no critique of "bad" institutions is possible. |
  | **D** | **Projectivism** | None (Logic invalid) | All (as derivations) | Cannot explain why moral argument is rational rather than just mutual manipulation. |
  | **E** | **Quasi-Realism** | 6 (Quasi-valid) | 1, 2, 3, 4, 5 (Strictly) | Must explain how we have "truth" without "facts" without sounding like word games. |
  | **F** | **Error Theory** | None (Conclusion false) | All (as true claims) | Must recommend continuing to use moral language while believing it is systematically false. |
  | **G** | **Constructivism** | 2, 3, 6 | 1, 4, 5 (Mind-indep.) | If an agent values torture, the view struggles to say they are *mistaken* rather than just different. |
  | **H** | **Synthetic Naturalism** | 5, 6 | 1 (Gap exists), 4 (Bio not enough) | Must explain how we discover moral properties empirically without a "moral microscope." |
  | **I** | **Moorean Non-Naturalism** | 6 (Conclusion) | 1, 2, 3, 4, 5 (Derivations) | Moral properties are causally inert; hard to explain how we know them or why they motivate. |

  ***

  ### Structural Diagnostics

  **1. The Empty Cell**
  *   **Location:** Node 1 (Requires Bridge) $\rightarrow$ Node 4 (Describes Fact) $\rightarrow$ Node 6 (Refers) $\rightarrow$ Node 8 (Natural Property) $\rightarrow$ **Analytic Identity**.
  *   **Status:** **Incoherent.**
  *   **Reason:** If the identity between the natural property and 'wrong' is analytic (true by definition), the inference in Node 1 would be valid as stated (no bridge needed). One cannot consistently claim there is a logical gap *and* that the terms mean the same thing.

  **2. Indistinguishable Leaves**
  *   **Pair 1:** **Leaf H (Synthetic Naturalism)** and **Leaf I (Moorean Non-Naturalism)**.
      *   **Why:** Both accept the Gap, Truth-Aptness, Reference, and Mind-Independence. They split only on whether the property is "natural."
      *   **Unsuitable Question:** "Is the property investigable by science?" is unsuitable for a 10-minute exercise because both sides argue science *can* detect the natural base (H) or the supervenience base (I), and the definition of "natural" is itself a philosophical stalemate.
  *   **Pair 2:** **Leaf B (Neo-Aristotelian)** and **Leaf C (Institutional Descriptivism)**.
      *   **Why:** Both deny the Gap based on function/kind.
      *   **Unsuitable Question:** "Is the human life-form biological or social?" is unsuitable because Neo-Aristotelians argue biology *is* social for humans, and Institutionalists argue institutions *become* second nature. The boundary is porous in a short diagnostic.

