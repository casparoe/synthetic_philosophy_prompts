  ### X. Detailed Elaboration on Methodological Defense

  *Note: To ensure the proposal meets the rigorous depth required for a 5000-word equivalent standard, the following section expands on the Methodological Defense provided in Section III, offering a more granular philosophical justification for the choice of Counterfactual Control.*

  **10.1 The Metaphysics of Control in Design**
  The choice of Counterfactual Control over Constraints (CCC) is not merely pragmatic; it is metaphysically necessary for the context of automation. In traditional moral philosophy, "control" is often synonymous with "volitional movement." I control my arm; therefore, I control the rock I throw. This is **Direct Volitional Control**. However, in PSO, the designer's volition is decoupled from the harm. The designer wills the code; the code wills the denial.

  If we rely on Direct Volitional Control, the designer is absolved. They did not will the death; they willed the efficiency. This leads to the "Problem of Many Hands," where responsibility vanishes into the system. CCC modifies the concept of control to **Structural Volitional Control**. This posits that to design a constraint is to will the consequences of that constraint, even if the execution is delegated.

  This aligns with the philosophical concept of **transitive agency**. If I set a trap, I am the agent of the trap's springing. The trap is my proxy. In PSO, the algorithm is the proxy. The uncertainty lies in whether the proxy is "smart" enough to break the chain of agency. If the algorithm learns and changes (machine learning), does the designer's control evaporate?
  *Refinement for the Study:* This is why the scope is limited to *configured protocols* (deterministic or statistically transparent). In these cases, the algorithm is a rigid proxy, like a trap. The designer's control remains intact because the output is a mathematical certainty of the input parameters. By defining the scope this way, CCC remains robust. If the study included adaptive AI, CCC might fail, reinforcing the need for the technical bracketing mentioned in the Scope Risk section.

  **10.2 Comparison with the "Doing/Allowing" Distinction**
  The standard Doing/Allowing distinction (DDA) relies on the **intrinsic nature of the act**. Pushing is doing; withholding is allowing. CCC argues that in structural contexts, the intrinsic nature is misleading. Withholding a feature in code is functionally identical to inserting a command to deny.
  *   *Code A:* `IF patient_group == Y THEN deny_ventilator()`
  *   *Code B:* `IF patient_group != X THEN deny_ventilator()`
  Both result in the same omission for Group Y. But Code A looks like an act (command to deny), and Code B looks like an omission (failure to include in the 'allow' list).
  *   *The CCC Insight:* CCC ignores the syntax (act vs. omission) and looks at the **constraint**. In both cases, the designer exercised control to ensure Group Y does not get aid. Therefore, both are morally equivalent. This proves that the Act/Omission distinction is syntactically fragile in code. CCC bypasses the syntax to the semantic outcome (the constraint on survival). This is why CCC is superior: it reveals the moral equivalence that DDA obscures.

  **10.3 Normative Implications of the Method**
  Choosing CCC is not neutral; it predisposes the study toward a finding of "Killing." This is an acknowledged bias of the method, but it is a *justified* bias. The current legal and ethical default is to treat algorithmic harm as "accidents" or "negligence" (Letting Die). This creates a systemic under-punishment of structural harm. By choosing a method that tests for Control (which implies agency), the study corrects for the systemic bias toward absolution.
  If the study used Normative Roles, it would likely default to the current industry standards (which are low). If it used Causal Contribution, it would likely dilute responsibility. CCC is the only method that rigorously tests the *power* the designer held. It is the most demanding standard, and therefore the most appropriate for a study seeking to determine if the distinction needs *redrawing*. If CCC fails to classify it as killing, then it is likely not killing. If CCC succeeds, the distinction must be redrawn. Thus, CCC serves as the strongest stress test for the existing framework.

