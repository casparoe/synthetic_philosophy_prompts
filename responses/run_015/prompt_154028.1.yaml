  ### V. Scope Risk and Assessment of Ambition

  A one-semester independent study is a bounded endeavor, typically allowing for 10 to 15 weeks of research and writing. The topic of algorithmic moral agency is vast. To ensure completion, I must identify the single greatest risk to the project's scope.

  **Primary Scope Risk: The Theory of Distributed or Collective Agency**
  The most significant threat to this project is the need for a full theory of **distributed agency**.
  In the hypothetical examples used (the lone engineer, the triage algorithm), I treat the "designer" as a singular moral agent. However, in reality, automated resource-allocation protocols are built by teams, vetted by legal departments, approved by management, and deployed by organizations. The "control" I attribute to the designer in the Counterfactual Control framework is often diluted across a hierarchy.
  *   *The Risk:* If the "designer" is actually a collective, does the "Control over Constraint" metric still apply to the individual? If the individual coder could not change the protocol without being fired, did they have control? If the control lies with the CEO, but the code was written by the engineer, who is the "killer"?
  *   *Impact on Scope:* Addressing this fully would require a semester-long dive into collective moral responsibility, corporate personhood, and the metaphysics of group agency (referencing List, Pettit, etc.). This would derail the specific focus on the Killing vs. Letting Die distinction.
  *   *Mitigation Strategy:* To manage this risk, I will explicitly **bracket** the problem of collective agency. I will state in the introduction that the study operates under the assumption of a **Singular Sovereign Designer** for the sake of theoretical clarity. I will treat the "designer" as a heuristic for the locus of control, acknowledging that in practice, this locus may be distributed. I will argue that even if the agency is collective, the *collective* can be treated as a single agent for the purpose of the Killing/Letting Die distinction. This allows me to bypass the complex sociology of tech firms and focus on the moral metaphysics of the act itself.
  *   *Why this is a risk:* If the "Singular Sovereign" assumption proves too unrealistic, the entire Counterfactual Control argument collapses because no single person actually had the control I claim they did. I must be prepared to defend the heuristic nature of this assumption in the final paper.

  **Secondary Risk: Technical Complexity**
  There is a risk of getting bogged down in the technical details of how algorithms work (e.g., neural networks vs. rule-based systems). If the harm comes from a "black box" AI that even the designers don't fully understand, does "Control" exist?
  *Mitigation:* I will limit the technical scope to **deterministic or statistically transparent protocols**. I will exclude "black box" deep learning systems where the output is unpredictable. The study focuses on *preemptive* omission, which implies the harm was foreseeable and configured. Unforeseeable AI errors are a different category (accident/negligence). By narrowing the technical scope to *configured* protocols, I ensure the "Control" condition is met.

