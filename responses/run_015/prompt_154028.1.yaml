answer: |-
  **Title:** The Algorithmic Omission: Reclassifying Preemptive Structural Harm in Automated Resource Allocation

  **Abstract**

  This research proposal outlines a one-semester independent study designed to interrogate the moral metaphysics of automated decision-making systems. Specifically, it addresses the "Preemptive Structural Omission" (PSO): a scenario wherein a designer configures an automated protocol that, by its ordinary operation and with statistical certainty, fails to deliver life-saving aid to a defined subset of users. Unlike traditional cases of killing versus letting die, which rely on direct physical intervention or immediate bedside omission, PSO removes the agent from the moment of harm, embedding the lethal constraint into the system's architecture. This project argues that existing frameworks—predominantly derived from the works of Foot, Quinn, and Rachels—fail to resolve the moral status of PSO because they implicitly rely on bodily proximity and direct causal intervention. The study proposes to analyze PSO through the lens of *Counterfactual Control over Constraints* rather than Causal Contribution or Normative Roles. The objective is to reach a determinate classification: whether PSO constitutes a form of indirect killing, a distinct category of structural harm, or a complex form of letting die. The proposal details the methodological justification, success criteria, scope risks regarding collective agency, and an assessment of the framing's robustness.

  ---

  ### I. Introduction and Problem Statement

  The distinction between killing and letting die has long served as a foundational pillar in bioethics, legal theory, and moral philosophy. Classically, this distinction hinges on the difference between an act that initiates a causal sequence leading to death (killing) and an omission that allows an existing causal sequence to proceed unchecked (letting die). Philippa Foot's seminal analysis suggests that the difference lies in the initiation of a new threat versus the failure to prevent an existing one. James Rachels, conversely, argued that the distinction lacks intrinsic moral significance, pointing out that the outcome (death) and the intent (mercy or malice) often remain constant regardless of the active or passive nature of the conduct. However, even Rachels' critique presupposes a specific phenomenological context: a moral agent present at the scene, making a discrete choice to administer a drug or withhold a towel.

  The rapid integration of automated systems into critical infrastructure—healthcare triage, algorithmic lending, autonomous vehicle routing, and resource distribution—has generated a class of harm that escapes these traditional binaries. I term this phenomenon **Preemptive Structural Omission (PSO)**. A PSO occurs when a designer or engineering team configures an automated resource-allocation protocol such that, by its ordinary operation and with statistical certainty, the system will fail to deliver life-saving aid to a defined subset of users. Crucially, the designer never touches the victim, nor do they issue a specific command to deny aid at the moment of crisis. The harm unfolds entirely through system behavior that functions exactly as specified.

  Consider a hypothetical but plausible scenario: An engineer designs an algorithm for a national hospital network to allocate scarce ventilators during a pandemic. To maximize "aggregate life-years saved," the code includes a parameter that automatically deprioritizes patients with specific comorbidities. The system operates autonomously. When a patient with those comorbidities arrives, the system denies ventilation. The patient dies. The engineer is in a different city, sleeping. They did not "pull the lever" for this specific patient. Did the engineer kill the patient, or let them die?

  Standard intuitions fracture here. On one hand, the engineer performed an act (writing code) that set the conditions for death, suggesting killing. On the other hand, the engineer did not intervene in the specific causal chain of the patient's respiratory failure; they merely failed to build a system that would save everyone, suggesting letting die. Furthermore, the harm is statistically certain but individually probabilistic; the designer knows *someone* will die, but not *who*.

  This independent study seeks to resolve this fracture. The central research question is: **Does the standard philosophical distinction between killing and letting die hold, or must it be redrawn, when applied to Preemptive Structural Omission?**

  Crucially, this project is framed to avoid the relativistic conclusion that "it depends on context." While contextual factors always matter in applied ethics, the metaphysical categorization of the act should be stable. If PSOs are structurally identical across different instances (e.g., ventilator allocation vs. autonomous braking systems), they should yield a consistent classification. The study aims to produce a determinate answer: either PSOs are a species of killing (specifically, *indirect structural killing*), a species of letting die (specifically, *institutional negligence*), or a genuinely distinct moral category that requires new terminology (e.g., *structural violence*).

  The urgency of this inquiry is not merely academic. As legal systems struggle to assign liability for algorithmic harm, they often revert to product liability (negligence) or criminal law (manslaughter). These legal categories map onto the philosophical distinction between allowing harm (tort/negligence) and causing harm (criminal act). If the philosophical distinction is unclear, the legal framework will be incoherent. Therefore, this study is not an abstract exercise but a necessary groundwork for the governance of artificial intelligence and automated infrastructure.

  The scope of this project is limited to a one-semester independent study, resulting in a final paper of approximately 4,000 to 5,000 words. This constraint necessitates a focused analytical method. I cannot reconstruct the entire history of the doing/allowing distinction. Instead, I must isolate the specific feature of PSO that breaks existing models and test a single analytical framework against it. This proposal outlines the plan to execute that test, justifying the chosen methodology, defining the conditions for success, and honestly assessing the risks inherent in compressing such a complex inquiry into a single term.

  ---

  ### II. Literature Review and The Proximity Gap

  To understand why Preemptive Structural Omission resists classification, we must first examine why the standard treatments of the doing/allowing distinction fail to capture it. The literature generally falls into three camps: causal accounts, normative accounts, and intentionalist accounts. Each relies on assumptions that PSO renders obsolete.

  **1. The Causal Account and the Proximity Bias**
  The most intuitive distinction between killing and letting die is causal. Killing involves initiating a causal chain that leads to death; letting die involves failing to interrupt a causal chain. Warren Quinn, in *Actions, Intentions, and Consequences*, refines this by distinguishing between "direct harmful agency" (where harm is part of the plan's execution) and "indirect harmful agency" (where harm is a side effect). However, Quinn's analysis, like most in this tradition, assumes a temporal and spatial proximity between the agent's decision and the victim's harm.

  In the standard "trolley problem" or "bedside euthanasia" cases, the agent's bodily movement is the salient cause. If I push a man off a bridge, my push is the cause. If I withhold medicine, the disease is the cause. In PSO, the causal chain is mediated by a complex technical system. The designer's act (coding) occurs months prior to the death. The immediate cause of death is the system's operation, which is itself caused by the code, which is caused by the designer.

  Existing causal accounts struggle with this temporal displacement. If we trace causation back far enough, every letting die is a killing (I could have built a shelter to prevent the freeze). If we trace it forward, every killing is a letting die (I merely removed the obstacle of the victim's continued life). The standard solution is to look for the "proximate cause." But in PSO, the proximate cause is the *system*, not the human. The human is a distal cause. Existing literature implicitly relies on **bodily proximity**: the idea that the agent must be physically capable of intervening at the moment of harm for the omission to count as "letting die." If the agent *cannot* intervene at the moment (because they are not there), does their prior act of setting the constraint count as killing?

  Current theories do not resolve this. They treat "omission" as a failure to act *when one could*. In PSO, the designer *did* act (they coded), but the act was an omission of a safety feature. This creates a category error. Is the code an act that kills, or an omission of a rescue protocol? The literature treats acts and omissions as mutually exclusive at the moment of harm. PSO merges them: it is an act of design that functions as an omission of aid. Existing causal models lack the vocabulary to describe an "active omission."

  **2. The Normative Account and the Duty Problem**
  A second approach, championed by philosophers like Richard Epstein and various legal theorists, argues that the distinction rests on normative duties. Killing violates a negative duty (do not harm); letting die violates a positive duty (duty to rescue). The classification depends on which duty was breached.

  This approach fails in PSO because the designer's duty is ambiguous. Does a software engineer have a positive duty to save every potential user (requiring them to code a perfect system), or a negative duty not to harm users (requiring them not to code a harmful system)? In traditional medicine, the doctor-patient relationship establishes a clear positive duty to rescue. In technology, the "designer-user" relationship is diffuse.

  More critically, the normative account often collapses into circularity when applied to structural design. If we define the designer's duty as "do not create systems that kill," then PSO is killing. If we define it as "create systems that help as much as possible," then PSO is letting die (failing to help enough). The classification of the act depends on how we predefine the duty, rather than the duty emerging from the nature of the act. This prevents a determinate answer. The literature assumes a pre-existing relationship (doctor/patient, parent/child) to ground the duty. PSO creates a relationship *through* the system, meaning the duty itself is part of what needs to be analyzed, not a premise we can rely on.

  **3. The Intentionalist Account and the Statistical Problem**
  A third view focuses on intention. If the agent intends the death, it is killing. If they merely foresee it, it is letting die (or permissible collateral damage). This relies on the Doctrine of Double Effect.

  PSO complicates this through **statistical certainty**. The designer does not intend for *Patient X* to die. They intend for the *system* to optimize efficiency. However, they know with statistical certainty that *some* patients in Group Y will die. Is this intent? In traditional ethics, foreseeing a side effect is distinct from intending it. But in system design, the "side effect" is a guaranteed feature of the optimization function. If I design a trap that I know will catch a mouse, do I intend to catch the mouse? Yes. If I design an algorithm that I know will deny insulin to 5% of users, do I intend their denial?

  Existing intentionalist accounts struggle with probabilistic outcomes applied to populations. They are built for individual cases (this patient, this trolley victim). They lack a framework for "statistical intent." Consequently, they cannot determine if the designer's mental state aligns more with the murderer (who intends death) or the bystander (who foresees death but does not intend it).

  **The Gap: Structural Agency**
  The common failure across all three accounts is what I call the **Proximity Bias**. They assume the moral agent is an individual actor confronting a specific victim in a specific moment. They implicitly rely on bodily presence and direct causal intervention. PSO removes the body from the equation. The agency is embedded in the structure. The "act" is the architecture; the "omission" is the excluded pathway.

  Because existing treatments do not account for *mediated agency*—where the human will is executed by a non-human proxy over time—they leave this case unresolved. They force us to choose between "act" and "omission" when PSO is structurally both. To resolve this, we cannot simply apply Foot or Quinn; we must adapt their criteria to a context they did not envision. This study proposes that the failure of these accounts is not a reason to abandon the distinction, but a signal that we need a different analytical metric—one that focuses not on the moment of death, but on the moment of **constraint setting**.

  ---

  ### III. Methodological Proposal and Defense

  To achieve a determinate answer regarding the classification of Preemptive Structural Omission, this study must adopt a specific analytical method. The three obvious candidates are: (1) Causal Contribution Analysis, (2) Normative Structure of Institutional Roles, and (3) Counterfactual Control over Constraints.

  I propose to utilize **Counterfactual Control over Constraints**.

  **1. Rejected Alternative: Causal Contribution Analysis**
  A causal analysis would attempt to measure the designer's contribution to the death relative to other factors (the disease, the scarcity of resources, the system's execution).
  *Why it is rejected:* Causal contribution is ill-suited for probabilistic, systemic harm. In PSO, the designer's code is a *necessary condition* for the specific death (without the code, the denial wouldn't happen that way), but it is not a *sufficient condition* (the patient also had to be sick, resources also had to be scarce). In overdetermined systems, causal contribution becomes a matter of degree. If the designer is only 10% causally responsible, does that make it 10% killing? This leads to the "it depends" outcome this project seeks to avoid. Furthermore, causal analysis focuses on the *past* (what happened), whereas the moral status of design is often about the *future* possibilities that were closed off. Causal contribution cannot easily distinguish between a system that fails due to a bug (accident) and a system that fails due to design (intent), as the causal chain looks identical in both.

  **2. Rejected Alternative: Normative Structure of Institutional Roles**
  This method would analyze the social and professional duties of the designer. It would ask: "What does society expect of an engineer?"
  *Why it is rejected:* As noted in the literature review, this approach risks circularity. The classification of the act (killing vs. letting die) often determines the duty, not vice versa. If we decide it is killing, the duty is "do not do it." If we decide it is letting die, the duty is "try to do better." Relying on institutional roles also introduces too much variability. The duties of a government contractor differ from a startup founder. If the classification of the act depends on the employer, we lose the metaphysical stability required for the research question. We need a criterion that applies to the *act itself*, regardless of the specific job title.

  **3. Selected Method: Counterfactual Control over Constraints**
  This method focuses on the agent's power to alter the conditions under which the harm occurred. It asks: **Did the agent have the control to remove the constraint that made death inevitable, and did they choose not to?**

  *Definition:* Counterfactual Control over Constraints (CCC) posits that an agent is responsible for a "killing" if they exercised control over the *boundary conditions* of a system such that death became a necessary output of that system's ordinary operation, provided they had the feasible alternative to set different boundaries.

  *Why this is the superior angle:*
  1.  **Bypasses Proximity:** CCC does not require the agent to be present at the moment of death. It locates the moral locus at the moment of *design*, where the agent's control was maximal. It acknowledges that in automated systems, control is exerted upstream.
  2.  **Resolves Act/Omission Binary:** CCC treats the setting of a constraint as an *active* exercise of power. Even if the constraint is an "omission" of a safety feature, the act of finalizing the design without that feature is a positive exercise of control over the system's limits. This reclassifies the "omission" as an "act of constraint."
  3.  **Admits a Determinate Answer:** CCC provides a binary test. Either the designer had the control to change the parameter and chose not to (Killing/Structural Killing), or they did not have the control (Letting Die/Tragic Necessity). This avoids the "spectrum" problem of causal contribution.
  4.  **Aligns with Statistical Certainty:** CCC handles the probabilistic nature of PSO. Even if the designer doesn't know *who* will die, they know *that* the constraint will cause death. Control over the constraint implies control over the statistical outcome.

  **Defense of CCC against Objections**
  A primary objection to CCC is that it might over-extend responsibility. If I choose not to become a doctor, I exercise control over the constraint of my own labor, potentially leading to deaths I could have prevented. Does CCC make me a killer?
  *Rebuttal:* No. CCC applies specifically to *structural* constraints where the agent creates a system that *actively denies* aid, not merely fails to provide it. There is a distinction between *not building a hospital* (omission of aid) and *building a hospital with a triage protocol that excludes Group X* (active constraint). CCC is sensitive to this because it focuses on the *configuration of the mechanism*. The non-doctor does not configure a mechanism of denial; they simply abstain from the mechanism of aid. The PSO designer configures the mechanism of denial.

  Another objection is that CCC ignores the "natural" course of events. If the patient would have died anyway due to scarcity, isn't the designer just letting nature take its course?
  *Rebuttal:* In PSO, the "scarcity" is often managed by the algorithm. The algorithm decides *who* faces the scarcity. By assigning the risk to a specific subset, the designer is not letting nature take its course; they are directing the course of the harm. Control over the *allocation* of risk is control over the cause of death.

  Therefore, CCC is the most robust tool for this specific problem. It shifts the focus from the *moment of impact* (where the designer is absent) to the *moment of imposition* (where the designer was sovereign). This shift is necessary to cut through the ambiguity of bodily proximity.

  **Implementation in the Study**
  In the final paper, I will apply the CCC test to two case studies:
  1.  **The Triage Algorithm:** As described above.
  2.  **The Autonomous Vehicle:** A car programmed to prioritize passenger safety over pedestrians in unavoidable crash scenarios.

  By applying CCC to both, I will test if the classification holds across different domains. If CCC classifies both as "Structural Killing," it suggests a stable category. If it yields different results, it suggests the method needs refinement. The study will argue that in both cases, the designer exerts control over the constraint (the rule of survival), making the resulting deaths a product of their will, thus closer to killing than letting die.

  ---

  ### IV. Success and Failure Conditions

  To ensure this independent study remains focused and produces a viable academic output, I have established clear criteria for what constitutes success and failure. Given the constraint of a single semester, the goal is not to solve the entire philosophy of technology, but to resolve the specific classification question regarding PSO.

  **Conditions for Success**
  A successful conclusion will look like a **clear criterion that classifies the case and guides regulation.** Specifically:
  1.  **Conceptual Clarity:** The paper will successfully define "Preemptive Structural Omission" in a way that distinguishes it from standard negligence and standard killing. It will demonstrate that PSO is not merely a "hard case" but a distinct structural phenomenon.
  2.  **Determinate Classification:** The paper will argue definitively that PSO falls closer to **Killing** (specifically, *Indirect Structural Killing*) than Letting Die. It will justify this using the Counterfactual Control over Constraints framework. It will not conclude that "it is both" or "it depends." It will assert that because the designer controls the constraint, the omission is morally equivalent to an act of commission.
  3.  **Regulatory Guidance:** The philosophical classification will translate into a normative recommendation. If PSO is Killing, then the regulatory standard should be *strict liability* or *criminal negligence* akin to manslaughter, rather than civil torts for product failure. The paper will outline how this reclassification changes the burden of proof for designers (shifting from "did they try their best?" to "did they create a lethal constraint?").
  4.  **Resilience:** The argument will successfully defend against the "Over-Extension Objection" (that CCC makes everyone a killer) by clearly delineating the boundary between configuring a harmful system and merely failing to build a helpful one.

  **Conditions for Failure**
  A failed conclusion would manifest in several ways, any of which would indicate the project scope was too ambitious or the framing was flawed:
  1.  **Intuition Conflict:** If the analysis shows that intuitions about PSO are fundamentally irreconcilable (e.g., half of the test cases feel like killing, half feel like letting die, with no principled way to distinguish them), the project fails to provide a determinate answer. This would suggest the distinction itself is obsolete in the digital age, which is a valid finding but fails the specific goal of *redrawing* the distinction.
  2.  **Methodological Collapse:** If the Counterfactual Control framework proves unable to distinguish between the Triage Algorithm and the Non-Doctor example (i.e., if it condemns both equally), the method is too broad to be useful. This would count as a failure of the analytical tool.
  3.  **Contextual Relapse:** If the final conclusion relies heavily on specific contextual details (e.g., "It is killing if the designer is paid, but letting die if they are a volunteer"), the project fails to identify the *structural* nature of the harm. The goal is to find a classification that holds based on the *structure of the act*, not the biography of the agent.
  4.  **Inability to Isolate PSO:** If it turns out that PSO cannot be distinguished from standard corporate negligence (e.g., a car company ignoring brake defects), then the concept of "Preemptive Structural Omission" adds no new philosophical value. The project would fail to justify its own novelty.

  In the event of potential failure, the fallback position is to argue that PSO represents a **Distinct Third Category**. If it cannot be forced into Killing or Letting Die, the success condition shifts to successfully arguing for the necessity of a new category (e.g., "Structural Violence"). However, the primary aim remains the binary classification to test the robustness of existing moral metaphysics.

