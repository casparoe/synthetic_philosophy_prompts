  ### VIII. Conclusion

  The distinction between killing and letting die is not merely a semantic puzzle; it is the bedrock of how we assign blame, liability, and moral outrage. As we delegate life-and-death decisions to algorithms, we risk creating a zone of impunity where harm is inflicted without a "killer." Preemptive Structural Omission describes this zone. By analyzing PSO through the lens of Counterfactual Control over Constraints, this study aims to close that zone. It posits that when a designer configures a system to statistically deny life-saving aid, they are not merely letting nature take its course; they are actively curating the conditions of survival. This is not letting die. It is a form of killing that wears the mask of omission.

  This proposal outlines a rigorous path to defend that claim. It acknowledges the limitations of existing literature, defends a specific methodological choice against viable alternatives, and sets clear boundaries to manage scope risk. While the probabilistic nature of algorithmic harm presents a challenge to the concept of control, the shift from bodily proximity to structural constraint offers a promising resolution. If successful, this study will not only classify a new type of harm but provide a moral vocabulary for the age of automation, ensuring that the distance between the designer and the victim does not become a distance from responsibility.

