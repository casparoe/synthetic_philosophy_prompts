  **Abstract**

  This research proposal outlines a one-semester independent study designed to interrogate the moral metaphysics of automated decision-making systems. Specifically, it addresses the phenomenon of **Preemptive Structural Omission (PSO)**: a scenario wherein a designer configures an automated protocol that, by its ordinary operation and with statistical certainty, fails to deliver life-saving aid to a defined subset of users. Unlike traditional cases of killing versus letting die, which rely on direct physical intervention or immediate bedside omission, PSO removes the agent from the moment of harm, embedding the lethal constraint into the system's architecture. This project argues that existing frameworks—predominantly derived from the works of Foot, Quinn, and Rachels—fail to resolve the moral status of PSO because they implicitly rely on bodily proximity and direct causal intervention. The study proposes to analyze PSO through the lens of *Counterfactual Control over Constraints* rather than Causal Contribution or Normative Roles. The objective is to reach a determinate classification: whether PSO constitutes a form of indirect killing, a distinct category of structural harm, or a complex form of letting die. The proposal details the methodological justification, success criteria, scope risks regarding collective agency, and an assessment of the framing's robustness.

