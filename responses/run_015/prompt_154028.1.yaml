prompt: |-
  Write a short research proposal for a one-semester independent study (about 4000–5000 words) on the following precise question: the standard philosophical distinction between killing and letting die is usually analyzed through direct physical acts or omissions—say, administering a drug versus withholding ventilation. I want to examine whether that distinction holds, or must be redrawn, for what I call preemptive structural omission: a designer configures an automated resource-allocation protocol that, by its ordinary operation and with statistical certainty, will fail to deliver life-saving aid to a defined subset of users, yet the designer never touches a victim and the harm unfolds entirely through system behavior. Frame the question so it admits a determinate answer—whether this is closer to killing, closer to letting die, or a genuinely distinct category—rather than collapsing into “it depends on context.” Explain why existing treatments of doing versus allowing leave this case unresolved, particularly whether they implicitly rely on bodily proximity and direct causal intervention in ways that do not apply here. Propose your analytical method—whether testing causal contribution, the agent’s counterfactual control, or the normative structure of institutional roles—and defend why you choose that angle over the more obvious alternatives. Specify what a successful conclusion would look like (for example, a clear criterion that classifies the case and guides regulation) and what would count as failure (for example, showing only that intuitions conflict without resolution). Give an honest assessment of scope risk: identify one consideration—such as the need for a full theory of distributed or collective agency—that could make this project too ambitious for a single semester. Finally, please say how confident you are in the framing I have sketched and single out the specific point in your proposed analysis about which you are least certain.
