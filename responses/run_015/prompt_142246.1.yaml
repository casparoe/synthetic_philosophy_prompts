  *Ah:* Because stoppers take up space/resources but don't reproduce. If you are a non-stopper in a high-stopper colony, you are safer from predators (implied by "get eaten less"), but you have fewer resources because 40% of your neighbors are non-reproducing glue.
  *Actually, looking at the numbers:*
  Low-stopper: Mean Ind = 9.26. Group Output = 0.5.
  High-stopper: Mean Ind = 4.8. Group Output = 3.0.
  *Paradox:* How does a colony with lower mean individual fitness produce *more* daughter colonies?
  *Explanation:* Colony reproduction isn't just sum of individual reproduction. It's emergent. Maybe the "glue" allows the colony to survive to fission, whereas the low-stopper colony falls apart or gets eaten before fission, despite individuals budding off larvae?
  *Stats Implication:* $Y_{ind}$ and $Y_{group}$ are not linearly related. This is the crux of the MLS1 vs MLS2 debate. I must highlight this non-linearity/aggregation problem.

  11. **Final Plan:**
      *   Intro: Validate the feeling (it's a common insight).
      *   Translation Section: Map concepts to MLM/DAGs.
      *   Case Study Application: Run the numbers through the models.
