      *   *Fine Print:* Cap at total assets. If assets are $1 billion, $\log_2(10^9) \approx 30$. So fair price is ~$30.
      *   *Utility:* "Loyalty points awarded in logarithmic utils."
      *   *Disclaimer:* "Past performance in nearby possible worlds..." (Multiverse joke).

  5.  **Refining the Tone:**
      *   Must not sound sarcastic. It must sound like *they* believe this is a good deal for the customer, while burying the limitations in legalese that is technically accurate but practically devastating.
      *   The Actuary shouldn't sound *too* upset, just weary of the precision.

  6.  **Writing the Press Release (Iterative Process):**

      *   *Headline:* Petersburg Palace Unveils "The Infinite Flip."
      *   *Lead:* Expected value is undefinedly high.
      *   *Quote:* Dr. Aris Thorne. "We stand behind the mean."
      *   *Fine Print:* Need to make sure the cap is clear but buried. "Subject to liquidity constraints."
      *   *Utils:* "Comp points calculated via Bernoulli function."

      *(Self-Correction during drafting)*: Make sure the word count is close to 500. Ensure the math holds up. If the bankroll is capped, the EV is finite. The marketing should gloss over the cap until the fine print.

      *Revised Plan for Actuary:* He should mention the median. "While the median outcome is modest, the mean..."

      *Revised Plan for Fine Print:* Explicitly state the cap is total liquid assets. Mention the utility function.

  7.  **Drafting the Note to Editors:**
      *   Needs to identify the assumption: Infinite bankroll or linear utility.
      *   Marketing hopes nobody checks the bankroll.

  8.  **Final Review against Constraints:**
      *   ~500 words?
      *   Deadpan?
      *   Math accurate?
      *   Actuary haunted?
      *   Note to editors included?

