      *   **Addendum:** A short note to editors (2-3 sentences) explaining the assumption being exploited (infinite bankroll vs. linear utility).

  2.  **Deconstruct the St. Petersburg Paradox:**
      *   **Game:** Flip coin until heads. If heads on flip $n$, payout $2^n$.
      *   **EV:** $\sum (1/2^n) * 2^n = \sum 1 = \infty$.
      *   **Reality:** Most payouts are small ($2, $4, $8). Huge payouts are astronomically unlikely.
      *   **Resolution 1 (Finite Bankroll):** If the casino only has $W$, the game stops when $2^n > W$. EV becomes $\approx \log_2(W)$.
      *   **Resolution 2 (Utility):** Money has diminishing marginal utility (log utility). Expected *utility* is finite.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Press Release format.
      *   **Headline:** Needs to be bold, mathematically accurate but misleading. "Infinite Expected Return."
      *   **Dateline:** St. Petersburg, FL (nice touch) or just generic. Let's go with "ST. PETERSBURG, FL."
      *   **Body Paragraph 1:** The Hook. Announce the game. Emphasize the math. "Uncapped potential."
      *   **Body Paragraph 2:** The Quote. Chief Actuary. Needs to sound tired/haunted by the numbers.
