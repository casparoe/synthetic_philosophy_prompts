  **FOR IMMEDIATE RELEASE**

  **Petersburg Palace Casino & Resort Unveils "The Infinite Flip"**

  **ST. PETERSBURG, FL** — Petersburg Palace Casino & Resort is proud to announce the opening of *The Infinite Flip*, a new high-limit table game designed for the discerning player who understands that traditional valuation models are insufficient for true upside potential. Based on classical probability theory, *The Infinite Flip* offers an expected value that diverges to positive infinity. Mathematically, no admission price is too high.

  "We stand behind the mean," said Dr. Elias Vance, Chief Actuary for Petersburg Palace. "When you sum the series, the number does not stop. It is… a demanding distribution. While the median player may observe a termination event within the first few trials, resulting in a modest return, the arithmetic expectation remains undefinedly high. We feel it would be irresponsible not to offer our guests access to infinity."

  Players simply wager an entry fee and flip a fair coin until it lands heads. If heads appears on the nth flip, the payout is $2^n$. The Palace encourages guests to consider the long-run average over an infinite horizon, rather than focusing on single-session liquidity constraints.

  High rollers enrolled in the Palace Loyalty Program will note that comp points are now awarded in logarithmic utils rather than dollars, aligning rewards with the Bernoulli utility function. This ensures that while the monetary payout may vary, the subjective value remains consistent with risk-averse preferences.

  **About Petersburg Palace Casino & Resort**
  Petersburg Palace is a premier gaming destination committed to mathematical integrity and transparent risk disclosure.

  **Terms and Conditions**
  *Participation subject to regulatory approval and house solvency.* Maximum payout is capped at the total liquid assets of Petersburg Palace Casino & Resort, currently valued at $1,073,741,824. In the event of a payout exceeding total assets, the prize is adjusted to 100% of remaining liquidity, effectively truncating the series at n=30. Past performance in nearby possible worlds is no guarantee of future results in this universe. Entry fees are non-refundable regardless of outcome. Utility points are non-transferable and expire upon player death. Petersburg Palace reserves the right to redefine "infinity" based on available capital reserves.

  ***

  **Note to Editors:**
  The casino's infinite expected value claim only holds under the assumption of an infinite bankroll or linear utility of money. The marketing department is hoping nobody checks the solvency cap in the footer, which reduces the fair entry price to roughly $30.
