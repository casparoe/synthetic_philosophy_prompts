answer: |-
  This is **Structural Unidentifiability**.

  Here is why that is the concept, why the others are near misses, and how it applies to your two examples.

  ### The Concept: Structural Unidentifiability
  In system identification and causal inference, a model is "unidentifiable" if different internal structures (rules) produce identical observable outputs (pictures) given the available data. It becomes *structurally* unidentifiable when the setup of the system itself—the geometry of your generator, the constraints of your sampler—makes it mathematically impossible to distinguish between those structures, regardless of how many samples you draw.

  You are not failing to find the rule because you haven't sampled enough (statistical error); you are failing because your sampling space collapses the distinction between the rules (structural error).

  ### Why Not the Others?
  *   **Goodman's "Grue" (Underdetermination):** You correctly spotted the mismatch. Grue is an *epistemic* limit: the evidence exists (the future moment), but we haven't seen it yet. Your problem is an *ontological* limit: the evidence (the counterexample picture) does not exist within the universe of your generator. Grue says "wait and see." Unidentifiability says "look elsewhere."
  *   **Overfitting:** Overfitting implies a rule fits noise in the training set but fails on a test set drawn from the *same* distribution. Your rival rules fit perfectly on the test set too, because the test set is drawn from the same biased distribution. The rule isn't too complex; the data space is too small.
  *   **Aliasing:** This is the strongest near miss. Aliasing describes what happens when you sample a signal too coarsely (e.g., a wheel spinning backwards in a movie). It is the *mechanism* causing your unidentifiability. Your generator's resolution (grid size, strip width) is too coarse to capture the "frequency" of the difference between "inside" and "disjoint." However, Aliasing usually refers to signal reconstruction. **Structural Unidentifiability** is the broader concept that covers rule distinction, which is your actual goal.

  ### One Phenomenon or Two?
  It is **one phenomenon** with two different causes.

  In both examples, the *support* of your data distribution (the set of all possible pictures your generator can make) is a subset of the concept space where Rule A and Rule B are logically equivalent.
  1.  **Hard Constraint (The Strip):** The generator's geometry physically cannot emit the counterexample. The support is restricted by code logic.
  2.  **Soft Constraint (The Grid/Triviality):** The generator *could* emit the counterexample (partial overlap), but your quality heuristics filter it out to keep the problem "messy." The support is restricted by design policy.

  To the solver (human or algorithm), these are identical. The data provided does not contain the information necessary to discriminate the hypotheses. The distinction matters only for *you* fixing the generator: one requires changing the geometry, the other requires relaxing a heuristic.

  ### Boundary Cases
  This concept stops applying if:
  1.  **The rules diverge within the support:** If even one generated picture exists where "collinear" is true but "three dots" is false (e.g., four collinear dots), the rules are identifiable.
  2.  **The constraint is removed:** If you widen the strip or allow partial overlaps, the support expands, the equivalence breaks, and identifiability is restored.

  ### What I'm Least Sure About
  I am least sure about whether the "triviality" case (Example 2) truly counts as *structurally* unreachable or merely *pragmatically* unreachable. If you could tolerate a "easy" problem, the counterexample exists. In strict Structural Unidentifiability, the counterexample usually cannot exist even in theory given the model structure. Here, your model structure includes a "quality filter." If you consider that filter part of the "structure," then it is unidentifiable. If you consider it a separate layer, it's just a biased sample. I am treating it as structural because, for the purpose of the generated problem, that picture is effectively nonexistent.

  ### Summary
  You have built a system where the observable output is invariant to the underlying rule change. That is **Structural Unidentifiability**. To fix it, you don't need more data; you need to expand the support of your generator to include the boundary cases where the rules disagree.
