      *   *The "Clean Hands" Objection:* If the enrichment was gained through rights violations (even if unknown then), is it still just "enrichment"? Or is it "stolen goods"? This might collapse UE into "Historical Responsibility" (HR).
      *   *The Benefit/Burden Bundle:* You can't take the infrastructure without the climate change. They are ontologically linked. Disgorging the money doesn't separate the physical reality.
