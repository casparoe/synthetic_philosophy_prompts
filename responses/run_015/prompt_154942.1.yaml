answer: |-
  1. Divide the sixteen students into a three-person Central Board and thirteen Producer Nodes for a 75-minute session, handing each producer a sealed card detailing a hidden physical constraint like a left-handed tool limitation that alters their true production function. Instruct the producers that they are forbidden from stating these constraints aloud, forcing them to adapt locally while the Board sees only aggregate inventory data.

  2. Structure payoffs so the Board earns points only for clearing markets across two rounds, while producers gain points for output volume plus a secret bonus awarded solely if their hidden constraint was satisfied without explicit declaration. This incentive design allows the Board to achieve apparent price equilibrium in round two even while several nodes suffer invisible misallocation due to violated physical constraints.

  3. Run two timed rounds where the Board adjusts point-prices based on surplus or shortage reports, unaware that producer responses are distorted by undisclosed bodily or material limitations. Ensure producers signal success only through output quantities, masking the internal friction caused by their unique, uncommunicated conditions.

  4. In the debrief, map the hidden-constraint failures onto Hayek's argument about the particular circumstances of time and place, contrasting this with the Board's adjustments as a representation of Lange's simulated-market reply. Highlight how the aggregate price signal failed to capture the local knowledge required to avoid the silent losses incurred by the producers.

  5. State frankly that the game cannot reproduce the non-codifiable, bodily character of true tacit knowledge, as the hidden constraints were actually written on cards rather than genuinely ineffable. Acknowledge that the facilitator must supply this distinction verbally to explain why real-world planners cannot simply request the data hidden in this simulation.
