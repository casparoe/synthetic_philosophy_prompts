      *   *Is it a known distinction?* "Synchronic" vs. "Diachronic" isn't standard terminology, but the *concept* is. It's often discussed as "Robustness to Self-Improvement" or "Stability under Optimization Pressure." The user's specific observation (drift via retraining rather than self-modification) is a practical ML version of the theoretical "successor agent" problem.
