answer: |-
  The examination room smelled of iodine and wet wool. Inspector Vance sat in the corner, her notebook open but unused, watching Old Halloway work. He was leaning over the boy, Jory, whose twelfth birthday had passed three weeks prior. Halloway held a magnifying loupe to the boy's left eye, steady as a stone. The room was silent save for the hiss of the harbour fog outside.

  "There," Halloway said, straightening his back. He pointed to the iris, a pale grey washed with the distinct, milky ring near the limbus. "Textbook. His father was marked, his grandfather before him. He goes to the salvage decks on Monday."

  Vance nodded. She was here to replace Halloway's loupe with a spectrometer. The mainland government suspected superstition; they wanted chemistry. She took the swab from her case, sampled the tear fluid, and sealed the vial. She did this for twenty boys that week. Every single one bore the ring. Every single one was on the Tide-marked register.

  Two days later, in the makeshift laboratory she'd set up in the customs house, the results lay spread across the metal table. The spectrometer readings were uniform. High sodium retention, specific trace minerals consistent with prolonged exposure to untreated brine, and a pigment shift caused by chronic vasoconstriction from cold water.

  Vance picked up the register. It listed the families. It listed the birth dates. It listed the assignment to the salvage fleets at age eight.

  She walked to the window. The salvage decks were visible below, dark hulks against the grey water. Children were moving across them, small figures in oilskin. The ring wasn't a genetic signature. It was a scar. It was the body's receipt for four years of salt rations and freezing immersion. The test she had brought to verify the nature of the Tide-marked would confirm every entry on the register with one hundred percent accuracy, not because the kind was natural, but because the kind was a instruction manual for how to alter the body.

  If she declared it a fraud, the register remained the only map of who had been subjected to the work. If she declared it real, she condemned the children to the water.

  She sat down and wrote her report. She did not use the word *fraud*. She wrote that the diagnostic mark was environmentally induced by the conditions of labour prescribed for the registered class. She recommended immediate cessation of child salvage operations and the establishment of a restitution fund. She signed it, knowing that to pay the fund, someone would have to know who deserved it.

  ***

  Five years later, the Restitution Office occupied the same customs house. The smell of iodine was gone, replaced by the dust of paper and the sharp scent of ink. Vance, now the Regional Administrator for the Salt Act, sat across from a young clerk named Merrin.

  "The pension rolls are stalled," Merrin said, tapping a ledger. "We can't disburse the compensation without a verified list of recipients. The mainland treasury won't release funds for 'undefined populations'."

  "Use the old register," Vance said.

  "We can't," Merrin replied. "The Tide-marked category was abolished under Section 4 of the Act. Using that name legitimizes the biological claim we just disproved. Legal says it creates liability. If we pay them as Tide-marked, we admit the caste existed legally. If we admit it existed legally, the families can sue for generational damages beyond the pension."

  Vance looked out the window. The salvage decks were quiet. The children were in school. The pale rings were fading from the irises of the teenagers now; without the brine and the cold, the next generation's eyes were clear.

  "Then create a new category," Vance said.

  "We are. 'Beneficiaries of the Salt Act'. But to qualify, you have to prove eligibility. Eligibility is defined by prior enrollment in the salvage workforce. The only record of that workforce is the Tide-marked register." Merrin slid a form across the desk. "We're transcribing the names. Same list, new header. But because it's a compensation class, we have to verify lineage for the dependants. So we're interviewing the parents. We're asking them to confirm their status."

  "So they have to claim the mark to be paid for having been marked."

  "Exactly. And once the roll is established for the pensions, the housing authority wants a copy. They have quotas for 'displaced labour families'. The schools want it for the remedial reading program, since the divers missed schooling. The medical office wants it to track the long-term effects of the brine exposure."

  Vance took the form. It was clean, typed on fresh paper. *Class S-1: Salvage Kin.*

  "And the social effect?" Vance asked.

  "The locals know," Merrin said. "If you're on the S-1 roll, you get the pension, but you're also the people who couldn't dive. The mainlanders hiring for the new cannery work ask if you're S-1. They say it's to ensure you get the priority hiring mandated by the Act. But the foremen know it means you're the ones who were broken by the water. They put them on the light packing shifts. Lower pay. No advancement."

  Vance looked at the ledger. The names were the same. The Halloways, the Jorys, the Vances. The structure of the town had not shifted; it had merely been rotated five degrees. The eight-year-olds were not in the water, which was a tangible good. The pensions were paid, which kept food on tables. But the boundary remained. To dismantle the house, they had to draw a blueprint of it, and now everyone was living inside the blueprint.

  "Proceed," Vance said.

  ***

  Ten years after that, Vance walked the harbour front again. She was retired, wearing a civilian coat. She stopped at a bakery. The boy behind the counter was eighteen, his eyes clear grey, no ring.

  "Fresh loaf?" he asked.

  "Yes," Vance said. She glanced at the name tag on his apron. *Jory.* The grandson of the boy she had seen under the loupe.

  "You're from the old families," she said, not meaning it as a question.

  The boy's hand paused on the tongs. "My grandfather is on the Salt Roll, yes. We get the supplement."

  "Does it help?"

  "It pays the rent," he said. He looked at her, and there was no bitterness, only a flat practicality. "But the cannery foreman knows the roll. He knows who needs the supplement. He knows who can't afford to quit."

  Vance took the bread. "And the ring?"

  "Gone," the boy said. He leaned forward slightly. "My sister married a mainlander. She moved to the city. She doesn't tell them about the roll. She says it's better there."

  "Is it?"

  "She sends money," he said. "But she doesn't come back."

  Vance stepped out into the street. The town was healthier. The children were taller. The water was cleaner. The mechanism that had sorted human beings into divers and non-divers had been dismantled, piece by piece, with honest intentions and scientific rigour. Yet, as she walked toward the bus station, she passed the municipal board where the hiring notices were posted.

  There were two columns. *General Employment* and *Salt Act Priority*.

  The people standing under *Priority* were the same people who would have stood under *Tide-marked*. They talked amongst themselves, distinct from the queue at *General*. They were not slaves. They were not divers. They were recipients. They were protected. They were separate.

  Vance boarded the bus. She had come to abolish a kind, and she had succeeded. The biological marker was extinct. The legal statute was repealed. But as the bus pulled away, she watched the two lines at the hiring board. The line for Priority was shorter. The line for General was longer. The distance between them was exactly the width of a sidewalk, but it was a distance that could not be crossed without leaving something behind.

  She opened her notebook, the same one from the examination room ten years prior. She had intended to write a memoir, a testament to the victory of reason over superstition. She looked at the blank page. To describe the change, she would have to describe the people who changed. To describe them, she would have to name them. To name them was to draw the line again.

  She closed the notebook. The bus rumbled over the cobbles, heading for the mainland, leaving the island of Talvern in the rearview mirror, distinct and whole against the grey sea.
