answer: |-
  The canvas holds but shadows merely known,
  And sculpture freezes time in static light,
  While verse describes the world's enduring night,
  Where grades of Will through images are shown.
  All arts are vassals to Ideas' throne,
  Removed from blind desire by clear height;
  They offer calm within their bounded flight,
  Reflecting objects that the Will has grown.

  But music breaks the mirror's cold embrace,
  The bass resounds as nature's lowest ground,
  While melody sings desire's deep distress.
  The Will itself, beyond all ideal place,
  From mass to striving in a sonic bound,
  Known as all truth, concepts cannot assess.
