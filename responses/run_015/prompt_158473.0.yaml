      *   *Smart Lock (Cloud/Proprietary):* User says "Political." Enforces surveillance/dependency on corporation. Works regardless of user intent (you can't disable the phone-home feature). **Fits.**
      *   *Paper vs. Online Form:* User says "Both political." Paper enforces privacy/anonymity (ordering: citizen is protected). Online enforces traceability (ordering: state monitors citizen). Both work regardless of user intent (you can't make the online form anonymous if it logs IPs). **Fits.**

