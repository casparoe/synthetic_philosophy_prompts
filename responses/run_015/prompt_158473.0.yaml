      *   *Decision:* I should validate their principle but suggest a slight tweak regarding the "neutral" lock. The lock isn't neutral; it's *emancipatory* politics vs. *authoritarian* politics. But if they want to keep "Neutral" as a category, the principle needs to focus on *external constraint*.
