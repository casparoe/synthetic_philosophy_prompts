          1.  *Inherent Design:* Some technologies *require* specific power structures (e.g., nuclear power needs hierarchy).
          2.  *Intentional Design:* Artifacts are used to settle disputes or enforce social order (e.g., Moses bridges keeping buses out).
      *   Key nuance: It's not just "impact," it's about *authority* and *power relations* embedded in the material.

