      *   *Nuclear Reactor:* Enforces hierarchy (centralized command). User intent doesn't matter; physics/safety requires it. **Fits.**
      *   *Low Bridge:* Enforces exclusion (class/race via bus access). User intent (driver) doesn't matter; the bridge blocks. **Fits.**
