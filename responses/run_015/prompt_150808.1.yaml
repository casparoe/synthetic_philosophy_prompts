  2.  **Deconstruct the Core Issue:**
      *   **LLM Nature:** LLMs are pattern matchers, not meaning-makers. They optimize for the *explicit* request, often defaulting to the most common tropes associated with those keywords (e.g., "conservation" + "realization" often defaults to "nature good, humans bad" or "lesson learned" arcs in training data).
      *   **The "Preachy" Tone:** This usually comes from the model trying to be *helpful* and *clear*. Ambiguity is hard for an AI because it looks like confusion or lack of direction in a training context. It wants to resolve tension, not sustain it.
