answer: |-
  You're not conflating the levels at all—your intuition is actually sharper than your character's. You've hit on the exact objection Timothy Williamson raised in *Knowledge and Its Limits*, which is the modern heavyweight champ of this debate.

  Here's the untangle:

  **1. Luminosity and KK are best friends**
  Your character is treating "Luminosity" and "KK" as two separate shields, but they're basically the same suit of armor.
  *   **KK Principle:** If I know $p$, I know that I know $p$.
  *   **Luminosity:** If a mental state (like knowing) is happening, I'm in a position to know it's happening.

  If knowledge is luminous, KK basically follows. If knowledge *isn't* luminous, KK is in big trouble. Your character is assuming a Cartesian view (mind is transparent to itself), but you're remembering the Externalist critique (mind is fuzzy at the edges).

  **2. The Margin-for-Error Argument (The Sorites Attack)**
  You remembered this right. The argument goes like this: Imagine a chain of cases where you go from "definitely knowing" to "definitely not knowing" in tiny, indistinguishable steps (like cooling down from hot to cold).
  *   If you *know* you know in Case A, you must be safe from error.
  *   But Case B is so close to Case A that you can't tell them apart.
  *   If you claim to know you know in Case A, logic demands you'd also have to claim it in Case B (because your evidence is the same).
  *   Keep going down the chain, and eventually you'll claim to know you know in a case where you're actually wrong.
  *   Since you can't know something false, the chain breaks. You *don't* know you know in the borderline cases.

  **3. Does KK survive if Luminosity dies?**
  This is your core question. **No, it doesn't.**
  If the margin-for-error argument works, it proves there are situations where you *do* know $p$ (Level 1), but you *cannot* know that you know $p$ (Level 2).
  Why? Because to know Level 2, you need to be able to rule out the possibility that you're in a nearby case where you don't know Level 1. But if the cases are indistinguishable (the margin for error), you can't rule that out.
  So, in those fuzzy borderline moments, $Kp$ is true, but $KKp$ is false. The KK principle fails exactly where luminosity fails.

  **4. The Character's Flaw**
  Your character is claiming infallible access to her own knowledge. She's saying, "Because I know it, I can't help but know that I know it."
  The philosophy says: "Actually, human cognition has friction." There are moments where you know something (your gut is right), but you legitimately can't be sure if you know it or if you're just guessing lucky. In those moments, you *will* wonder. Her insistence that she'll *never* wonder is what makes her dogmatic, not enlightened.

  You're right to doubt her. The margin-for-error problem doesn't just dim the light of luminosity; it shatters the KK principle along with it.

  Verdict: KK collapses with Luminosity
