answer: |-
  Good morning. Welcome to "Character in Context." It is a genuine honor to open this workshop, especially seeing such a diverse room—colleagues from philosophy and psychology, alongside family and friends who make this work possible. Your presence reminds us that questions about who we are, and how we act, belong to all of us.

  Our title points to a profound tension. For centuries, virtue ethics has rested on a hopeful intuition: that we can cultivate stable dispositions to do the right thing, regardless of the circumstances. We want to believe that a courageous person is courageous not just in safe moments, but when it counts. We want to believe that integrity is something we carry with us, like a compass.

  Yet, behavioral science offers a sobering counter-narrative. We are all familiar with the unsettling findings: ordinary individuals administering severe shocks because an authority figure insisted on it; seminary students stepping over a slumped stranger simply because they were told they were running late. These examples suggest that minor situational shifts can overwhelm our moral commitments. For the virtue theorist, this is unsettling. It sounds like an accusation that character is an illusion.

  However, framing this as a binary choice—either we possess robust global traits, or character is a myth—forces a false dilemma. It asks us to choose between a naive optimism and a cynical determinism. Neither serves us well, and neither captures the complexity of human agency.

  As we gather today, I invite us to consider a qualified middle position. We are not blank slates; we bring dispositions, histories, and values into every room we enter. But neither are we immune to the architecture of our environment. The distinction we should pursue is not between having character and lacking it, but between global trait possession and local trait activation.

  When situational pressure overwhelms moral aspiration, it does not necessarily refute the existence of virtue; rather, it reveals the constraints under which virtue must operate. A good character is not a force field that makes us immune to context. It is a capacity that functions within it. To say that situation matters is not to say that character does not exist; it is to say that character is fragile, and that its expression depends on the world around it.

  This shift changes everything. If situations function as constraints rather than refutations, then our focus cannot remain solely on individual moral improvement. We must also attend to the design of our institutions. Expecting integrity without designing for it is like expecting a plant to flourish without considering the soil. We need structures that recognize our vulnerability to context while supporting our capacity for agency. This means asking hard questions about how our workplaces, schools, and communities either invite our better selves or quietly encourage compromise.

  Today offers a rare opportunity to bridge these perspectives. For the philosophers, it is a chance to ground normative theories in empirical reality. For the scientists, it is a chance to see how data informs our understanding of human flourishing. And for our non-specialist guests, it is a reminder that these questions concern how we live together.

  Let us proceed with the understanding that character is real, but it is contextual. It requires not just willpower, but wisdom about the environments we build. Thank you, and welcome.
