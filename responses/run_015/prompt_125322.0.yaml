  POLICY ENDORSEMENT 742-Ω: CONSTITUTIVE REPLACEMENT AND MULTI-LOCATION COVERAGE

  1. **Definition of the Insured Object.** The Insured Object is defined strictly by its dominant sortal as "Statue" rather than "Lump of Clay" or "Marble Encasement." Coverage applies to the aesthetic form enduring through material change, not the co-located matter. In cases where the Statue and the Clay Lump occupy the same spatial coordinates, the Policy recognizes them as distinct entities sharing a location but possessing divergent modal properties. Specifically, while the Clay Lump could survive being squashed, the Statue could not; therefore, damage compensable to the Lump is not necessarily compensable to the Statue. The Insured Object is not identical to the sum of its parts.

  2. **Provisions for Temporary and Permanent Parts.** During the loan period, original clay armature fragments may be classified as "Temporary Parts" pending replacement. A part becomes "Permanent" only upon chemical bonding with the marble shell. Until such bonding occurs, the removed clay remains the property of the Insured Object despite spatial separation. This clause prevents the premature classification of the object as destroyed during the interim state of disassembly. Loss of a Temporary Part constitutes a partial loss of the Whole only if the functional capacity of the Statue is impaired.

  3. **Gradual Replacement and Continuity.** The original clay armature may be replaced incrementally during conservation. The Statue retains identity provided the replacement rate does not exceed 5% per fiscal quarter, ensuring endurantist continuity. Should the replacement become total, the Object is considered preserved via four-dimensional perdurance, wherein the Statue is understood as a spacetime worm composed of temporal stages rather than a wholly present entity. The Senior Conservator notes: "It is the same statue because I say it looks the same; metaphysics should not interfere with structural integrity."

  4. **No-Branching Clause.** If discarded clay fragments are reassembled by a third party into a rival configuration, a branching event occurs. The Policy stipulates that identity cannot branch. The Insured Object remains with the entity maintaining continuous spatio-temporal trajectory and institutional provenance. The reassembled clay configuration is classified as a "Derivative Copy" regardless of material authenticity. Coverage does not extend to rival claimants asserting material constitution over formal continuity. Any attempt to claim dual identity voids the policy.

  5. **Negative Space Coverage (Shadow Statue).** This endorsement uniquely covers the "Shadow Statue," defined as the cumulative negative space vacated by each removed clay fragment during conservation. The Shadow Statue is treated as a co-located entity distinct from both the Marble Statue and the Clay Lump. In the event that the Shadow Statue's volume exceeds the material volume of the Insured Object, coverage defaults to the entity possessing the highest artistic valuation per cubic meter of void. The Shadow Statue is insured against collapse, filling, or ontological negation.

  6. **Dispute Resolution.** In the event of a three-way identity dispute between the Continuous Statue, the Reassembled Clay Rival, and the Shadow Statue, arbitration shall be conducted by a panel of metaphysicians. The panel will determine identity based on causal history rather than qualitative similarity. If the panel deadlocks, the Object is deemed to have ceased existence, and the payout is distributed proportionally among all claimants based on their respective temporal durations. Legal personhood is not granted to the Shadow Statue.

  Summary: The policy ultimately favors a four-dimensionalist perdurantist view that prioritizes causal continuity over material constitution.
