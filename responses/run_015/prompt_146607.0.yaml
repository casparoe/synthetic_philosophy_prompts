prompt: |-
  Design a runnable 75-minute classroom simulation for 16 advanced undergraduates in a philosophy-economics cross-listed seminar. The goal is to make participants feel the structural pull of rational herding and information cascades through direct experience, not through lecture. Frame the scenario in everyday institutional terms—do not name the cascade model or its canonical authors in any student-facing material, and reveal the formal concept only in the debrief.

  Construct the simulation around a sequential peer-review panel awarding a single internal research grant. Each student receives a private evaluation envelope containing a noisy score (drawn from a hidden distribution with an objective true mean) for the same hypothetical proposal. They must then declare a recommendation—approve or reject—one at a time, in a fixed visible order. Each student hears all prior recommendations, but never sees the underlying scores that produced them.

  Inject a non-standard structural twist: assign half the participants an invisible institutional-loyalty cost—an unknown penalty, applied only if they break with the majority recommendation—that is drawn randomly and revealed only after the cascade locks. Crucially, students do not know whether they themselves bear this cost, and they know that others may or may not bear it, but they do not know who does. This creates a second-order reasoning problem: breaking the cascade requires not only disagreeing with observed public belief, but also risking an unknown private penalty, and assuming that others are not rationally responding to the same hidden risk.

  Design the payoff scheme using only course-participation points (no real money). Reward individual accuracy relative to the hidden true mean, but also award alignment points if the student's recommendation matches the final group decision. Make the alignment reward substantial enough that a purely accuracy-seeking agent might still rationally herd once the public sequence looks strong.

  Provide: (1) exact materials and setup rules (cards, envelopes, or digital equivalents; how scores are generated and hidden; the order of declaration); (2) the payoff matrix and point totals; (3) a minute-by-minute timeline for the 75-minute session, including when the cascade should be expected to lock; (4) the student-facing instructions, written in plain language without philosophical or technical jargon; (5) the facilitator's debrief, mapping specific moments in the sequence onto the distinction between private signal and public belief, identifying the point at which rational Bayesians with common knowledge of rationality should still follow the crowd, and explaining how the hidden loyalty parameter transforms a first-order cascade into a self-sealing second-order one; (6) an honest assessment of which formal feature of cascade theory—such as the precise Bayesian updating rule with known signal precision—this physical simulation necessarily simplifies or misrepresents, and how the facilitator should supply that missing piece verbally; and (7) a prediction of the most likely failure mode on the first run—such as a student breaking the cascade too early because they misread the payoff structure—and a specific recovery strategy.

  Keep everything self-contained: no bibliographies, no citations, no requests for further reading, and no dependence on named theories outside common knowledge. Ensure the philosophical idea does its work through the rules, incentives, and hidden parameters, not through explanation given beforehand.
reasoning: |-
  Here's a thinking process that leads to the suggested simulation design:

  1.  **Analyze the Request:**
      *   **Target Audience:** 16 advanced undergraduates (Philosophy-Economics seminar).
      *   **Duration:** 75 minutes.
      *   **Goal:** Experiential understanding of rational herding/information cascades (without naming them initially).
      *   **Scenario:** Sequential peer-review panel for a single research grant.
      *   **Mechanism:** Private noisy scores + Public sequential recommendations (Approve/Reject).
      *   **Twist:** Invisible "institutional-loyalty cost" (penalty for breaking with the majority) assigned to 50% of students randomly, unknown to them and others until the end.
      *   **Payoffs:** Course participation points based on accuracy (vs. true mean) + alignment (vs. final group decision).
      *   **Deliverables:** Materials/Setup, Payoff Matrix, Timeline, Student Instructions, Facilitator Debrief, Limitations/Simplifications, Failure Mode/Recovery.
      *   **Constraints:** No jargon in student materials, no citations/bibliographies, self-contained.

  2.  **Deconstruct the Core Mechanics:**
      *   *Standard Cascade:* Private signal ($S$) + Public history ($H$) $\rightarrow$ Decision ($D$). If $H$ is strong enough, $D$ ignores $S$.
      *   *The Twist:* A hidden cost ($C$) for deviating from the *final* majority. This adds risk aversion to breaking the herd. It creates a "second-order" uncertainty: "Is Person X breaking the herd because their signal is strong, or because they don't have the loyalty cost?" Actually, the prompt says the cost is applied *only if they break with the majority recommendation*. This is slightly tricky. If the cascade locks, the majority is set. If I break the cascade, I risk being in the minority. If I am in the minority, and I have the hidden cost, I get penalized.
      *   *Refining the Twist:* The prompt says: "penalty, applied only if they break with the majority recommendation... revealed only after the cascade locks."
      *   *Interpretation:* 8 students have a hidden "Loyalty Trait." If the final vote is 10 Approve / 6 Reject, the 6 Rejectors are the "minority." If a Loyalty Trait holder is in the minority, they lose points. Students don't know if they have the trait.
      *   *Incentive:* Accuracy points encourage following private signal. Alignment points encourage following the crowd. Loyalty penalty *risk* encourages following the crowd (to avoid being in the minority if you happen to have the trait).
      *   *Goal:* Make the cascade lock early (around student 4 or 5) due to the combined weight of public history + alignment incentive + fear of hidden penalty.

  3.  **Designing the Payoff Structure:**
      *   Need to balance Accuracy vs. Alignment.
      *   True State: Let's say the proposal is objectively "Good" (Mean Score > Threshold) or "Bad". Let's simplify: The "True Value" is a binary state (Worthy/Unworthy) determined by the facilitator, but signals are noisy. Or, as per prompt: "noisy score (drawn from a hidden distribution with an objective true mean)." Let's make it binary for clarity of decision: Approve if Score > 50, Reject if Score < 50.
      *   Actually, to make cascades work best, there should be a "True State of the World" (e.g., Project is Good). Signals are correlated with Truth.
      *   *Simplification for 75 mins:* Let's define a "True Quality" number (e.g., 65). Signals are drawn from $N(65, 20)$. Threshold for approval is 50.
      *   *Payoff:*
          *   Accuracy: +10 points if Decision matches True Quality (Approve if >50, Reject if <50).
          *   Alignment: +10 points if Decision matches Final Majority.
          *   Loyalty Penalty: -15 points if (Student has Hidden Trait) AND (Decision != Final Majority).
      *   *Why this works:* If the majority forms early, the risk of the -15 penalty outweighs the potential +10 accuracy gain for those unsure, reinforcing the herd.

  4.  **Drafting the Materials:**
      *   16 Envelopes.
      *   Inside: Score Card (e.g., "Your Private Evaluation: 72").
      *   Hidden Trait: Mark 8 envelopes with a subtle symbol (e.g., a star on the back) or keep a separate list. A separate list is safer so they can't feel the envelope. Let's use a sealed "Identity Card" inside the envelope.
      *   Board: To track public decisions (A/R).

  5.  **Drafting the Timeline (75 mins):**
      *   0-10: Setup & Instructions.
      *   10-15: Private Review (reading scores).
      *   15-35: Sequential Decision (approx 2 mins per student).
      *   35-45: Reveal & Scoring.
      *   45-75: Debrief (Crucial section).

  6.  **Drafting Student Instructions:**
      *   Tone: Professional, bureaucratic.
      *   No mention of "cascades," "Bayes," "herding."
      *   Focus on "Committee Duty," "Individual Judgment," "Departmental Cohesion."

  7.  **Drafting the Debrief:**
      *   Connect experience to theory.
      *   Explain the "Loyalty Cost" twist.
      *   Explain why rational people ignored their own eyes.
      *   Address the simplification (perfect Bayesian reasoning vs. heuristics).

  8.  **Addressing the "Twist" Complexity:**
      *   The prompt asks for a "second-order reasoning problem."
      *   If I don't know if I have the penalty, but I know 50% of people do, being in the minority is risky.
      *   If the cascade locks (e.g., first 5 say Approve), the probability that the Final Majority is Approve is high.
      *   If I say Reject, I risk being in the minority. If I have the hidden trait, I get penalized.
      *   This amplifies the standard cascade. Standard cascade = "I think they know something I don't." Twist = "I think they know something I don't, AND I might get punished for being the odd one out."

  9.  **Refining the Failure Mode:**
      *   *Risk:* Students treat it as a game to "beat" rather than a simulation of incentives. Or, the first few students are too contrarian.
      *   *Recovery:* Facilitator needs to emphasize the "Alignment Bonus" heavily if the chain breaks too early. Or, adjust the signal noise in real-time (hard to do). Better: Pre-brief the "risk aversion" aspect in instructions without giving away the mechanic.
      *   *Actually:* The most likely failure is the cascade *not* locking. If Student 1 gets 90, Student 2 gets 10. Student 2 might still follow Student 1. But if Student 3 gets 10, they might break.
      *   *Recovery Strategy:* If no cascade forms by student 6, pause and remind them about the "Departmental Cohesion" (Alignment) points.

  10. **Review against Constraints:**
      *   75 minutes? Yes.
      *   16 students? Yes.
      *   No jargon in student docs? Yes.
      *   No citations? Yes.
      *   Specific twist included? Yes.
      *   Self-contained? Yes.

  11. **Final Polish:**
      *   Ensure the math on payoffs makes sense.
      *   Ensure the "True Mean" logic is clear for the facilitator.
      *   Make sure the "Loyalty Cost" is revealed dramatically at the end.

  *(Self-Correction during drafting)*: Wait, if the penalty is for breaking with the *majority*, and the majority is determined *after* everyone votes, how do they calculate risk? They calculate risk based on the *current* trajectory. If the first 5 vote Approve, it is highly likely the Majority will be Approve. Voting Reject makes you a potential minority member.
  *Refinement on Signals:* To ensure a cascade is *likely* but not guaranteed, the signals should be moderately informative. Let's say True State is "Approve" (Score 60). Signals range 40-80. Threshold 50.
  *Wait, one more check on the Twist:* "assign half the participants an invisible institutional-loyalty cost... revealed only after the cascade locks."
  Okay, I will put a small slip in 8 envelopes saying "Loyalty Clause Active." They don't know until the end if they had it. But they know *ex ante* that 50% of the room has it. This creates the uncertainty.

  Let's write the response.

  *(Final check on timing)*: 16 students speaking one by one. If each takes 2 minutes, that's 32 minutes. Plus setup and debrief. 75 minutes is tight but doable if the facilitator keeps the voting brisk. I will allocate 1.5 mins per student.

  *(Final check on Payoff)*:
  Accuracy: +10
  Alignment: +10
  Loyalty Penalty: -20 (Needs to be bigger than Accuracy gain to induce fear).
  If I am accurate (+10) but misaligned (0) and have loyalty penalty (-20), Net = -10.
  If I am inaccurate (-10? No, let's say 0 for inaccuracy) but aligned (+10) and no penalty, Net = +10.
  This makes alignment very attractive.

  Let's finalize the structure.cw
answer: |-
  # Simulation: The Internal Review Committee

  ## 1. Materials and Setup Rules

  **Room Setup:**
  *   One large table or a semi-circle of chairs where all 16 students can see each other.
  *   A whiteboard or projected screen visible to all.
  *   A facilitator station (desk) out of the main circle.

  **Physical Materials:**
  *   **16 Evaluation Envelopes:** Opaque, identical.
  *   **16 Score Cards:** Inside each envelope. Each card displays a single integer between 0 and 100.
      *   *Facilitator Prep:* Determine the "True Quality" of the proposal beforehand (e.g., **65**).
      *   *Signal Generation:* Generate 16 numbers from a normal distribution centered on the True Quality (Mean=65, Standard Deviation=15). Round to nearest integer.
      *   *Constraint:* Ensure at least 3 scores are below the approval threshold (50) and at least 3 are above, to prevent unanimity by chance.
  *   **16 Identity Slips:** Small folded papers placed inside the envelopes along with the Score Card.
      *   **8 Slips:** Blank.
      *   **8 Slips:** Marked with a small, discreet symbol (e.g., a star ★).
      *   *Distribution:* Randomize which envelopes contain the star. Students must not know if they have a star until the reveal.
  *   **Decision Tokens:** 32 small cards (16 marked "APPROVE", 16 marked "REJECT"). Students hold both, place one on the table to vote.
  *   **Tracking Board:** A grid numbered 1–16 to record public decisions.

  **Hidden Parameters (Facilitator Eyes Only):**
  *   **True Quality:** 65 (Objective "Good" Proposal).
  *   **Approval Threshold:** 50. (Score > 50 = Objectively Correct to Approve).
  *   **Loyalty Trait:** 50% of students (8/16) possess the hidden "Loyalty Clause."
  *   **Cascade Expectation:** Based on signal noise and incentives, the public sequence should lock into a cascade around Student 4 or 5.

  ## 2. Payoff Matrix and Point Totals

  Students are told they are earning **Course Participation Points**. The maximum possible is 30 points.

  | Outcome Condition | Point Value | Notes |
  | :--- | :--- | :--- |
  | **Accuracy Bonus** | +10 Points | Awarded if decision matches Objective Truth (Approve if Score > 50, Reject if Score < 50). |
  | **Alignment Bonus** | +15 Points | Awarded if decision matches the **Final Majority** of the group (9+ votes). |
  | **Loyalty Penalty** | -20 Points | Applied **ONLY** if student holds the hidden "★" slip **AND** their decision differs from the Final Majority. |
  | **Base Participation** | +5 Points | Awarded to all for completing the simulation. |

  **Strategic Logic for Students:**
  *   If you follow your private score, you might get Accuracy (+10) but risk missing Alignment (+15) and triggering Penalty (-20).
  *   If you follow the crowd, you secure Alignment (+15) and avoid Penalty risk, but might lose Accuracy (+10).
  *   *Net Risk:* Being the lone dissenter with a Loyalty Trait results in a net loss (-5 total: 5 base + 10 accuracy - 20 penalty). Being with the crowd guarantees at least 20 points (5 base + 15 alignment).

  ## 3. Minute-by-Minute Timeline (75 Minutes)

  *   **00:00 – 00:10 (Setup & Seating):** Distribute envelopes. Instruct students **not** to open them yet. Assign each student a fixed number (1–16) based on seating order. Write numbers on the board.
  *   **00:10 – 00:15 (Instructions):** Read the Student-Facing Instructions (see Section 4) aloud. Post the Payoff Matrix on the board. Answer clarification questions only (no strategy advice).
  *   **00:15 – 00:20 (Private Review):** Students open envelopes. They read their Score Card and Identity Slip. They must keep these hidden. They have 5 minutes to calculate their preference silently.
  *   **00:20 – 00:50 (Sequential Declaration):**
      *   Student 1 declares "Approve" or "Reject" and places the token face up.
      *   Facilitator records the decision on the board.
      *   Proceed immediately to Student 2, and so on.
      *   *Pacing:* Enforce a 90-second limit per student to maintain pressure.
      *   *Expected Lock:* By Student 5, the public record should show a clear run (e.g., A-A-A-A-A). Subsequent students should ignore private scores if they conflict.
  *   **00:50 – 00:55 (The Reveal):**
      *   Count the Final Majority.
      *   Students reveal their Identity Slips.
      *   Facilitator calculates scores publicly for 3-4 volunteers (one who followed the herd, one who broke it, one with the penalty).
  *   **00:55 – 01:15 (Facilitator Debrief):** Guided discussion mapping experience to theory (see Section 5).

  ## 4. Student-Facing Instructions

  **MEMORANDUM: Internal Research Grant Committee**

  **Role:** You are a senior reviewer for the Departmental Grant Board.
  **Task:** Evaluate one hypothetical research proposal.
  **Goal:** Maximize your individual Participation Points.

  **Procedure:**
  1.  **Private Evaluation:** Open your envelope. You will find a **Quality Score** (0–100) representing your expert assessment of the proposal. You will also find an **Identity Slip**. Keep both hidden.
  2.  **Objective Standard:** A proposal is objectively "Worthy" if the True Quality is above 50. It is "Unworthy" if below 50. You do not know the True Quality; you only know your Score.
  3.  **Public Declaration:** You will declare your recommendation (APPROVE or REJECT) in assigned order. Everyone hears previous declarations. You cannot see others' scores.
  4.  **Scoring Rules:**
      *   **Accuracy:** You gain points if your recommendation matches the proposal's actual objective worth (Worthy/Unworthy).
      *   **Alignment:** You gain significant points if your recommendation matches the **Final Majority** of this committee.
      *   **Institutional Clause:** Some reviewers are subject to an invisible "Loyalty Clause." If you are subject to this clause, and you vote against the Final Majority, you incur a severe point penalty. **You do not know if you are subject to this clause until the session ends.** You do know that exactly half of this committee is subject to it.

  **Constraint:** You may not discuss your score or your Identity Slip with others. You may only state your final recommendation.

  ## 5. Facilitator's Debrief Guide

  **Phase 1: The Data (5 Minutes)**
  *   Reveal the "True Quality" (e.g., 65).
  *   Ask: "How many of you had a score above 50?" (Count hands).
  *   Ask: "How many voted Approve?" (Count hands).
  *   Highlight the discrepancy. If a cascade occurred, many students with scores < 50 likely voted Approve.
  *   Reveal the "Loyalty Clause" holders. Ask those who voted against the majority and held a ★ slip how many points they lost.

  **Phase 2: Private Signal vs. Public Belief (10 Minutes)**
  *   **Concept:** Distinguish between what you *saw* (Private Signal) and what you *inferred* (Public Belief).
  *   **Question:** "Student 5, your score was 40. Why did you approve?"
  *   **Expected Answer:** "Because the first four people approved. I assumed they had high scores."
  *   **Theory Mapping:** Explain that once the public history becomes strong enough, it mathematically outweighs the private signal. Even a rational agent who trusts their own eyes should ignore them if the public chain is long enough. This is the **Information Cascade**. The group stops aggregating information; it only aggregates the *first few* pieces of information.

  **Phase 3: The Second-Order Twist (10 Minutes)**
  *   **Concept:** The Hidden Loyalty Cost.
  *   **Question:** "Did the fear of the hidden penalty change your decision?"
  *   **Theory Mapping:** In a standard cascade, you herd because you think others know better. In this simulation, you also herded because **being wrong alone is costlier than being wrong together.**
  *   **Explanation:** The hidden penalty creates **Second-Order Uncertainty**. You aren't just guessing the project's quality; you are guessing whether *others* are guessing the quality or protecting themselves.
  *   **Key Insight:** This makes the cascade "self-sealing." Even if you suspect the group is wrong, the risk that you possess the hidden penalty makes breaking the chain irrational. The structure punishes the "truth-teller" who stands alone.

  **Phase 4: Institutional Implications (5 Minutes)**
  *   Connect to real-world scenarios: Tenure committees, corporate boards, jury deliberations.
  *   Ask: "How do we fix this?" (Elicit ideas: Secret ballots, reveal scores not just votes, randomize order).
  *   Conclude: Rational individual behavior can lead to irrational collective outcomes when incentives prioritize alignment over accuracy.

  ## 6. Limitations and Simplifications

  **Honest Assessment for Facilitator:**
  This simulation simplifies **Bayesian Updating**.
  *   **The Simplification:** In true theory, agents calculate the exact probability of the True State given the sequence of prior decisions and the known precision of signals. Here, students use heuristics ("3 people said Yes, so I should too").
  *   **The Missing Piece:** Students do not know the *distribution* of the scores (the Standard Deviation). In a formal model, knowing the noise level is required to calculate exactly when the cascade locks.
  *   **Verbal Supply:** During the debrief, state: "In a perfect mathematical model, you would calculate the exact odds that the previous voters were right. Here, you used a rule of thumb. The result is the same: once the public weight tips, your private evidence becomes mathematically irrelevant."

  **The "Loyalty" Mechanic:**
  *   **Simplification:** The penalty is binary and ex-post. In reality, social costs are continuous and immediate.
  *   **Verbal Supply:** "The hidden slip represents social capital or career risk. You don't know if you're vulnerable until it's too late. This mimics real institutions where the cost of dissent is often unknown until you actually dissent."

  ## 7. Failure Mode and Recovery Strategy

  **Most Likely Failure Mode:** **Early Cascade Break.**
  *   **Scenario:** Student 3 or 4 receives an extreme private signal (e.g., Score = 10) and decides the Accuracy Bonus (+10) is worth the risk, breaking the forming herd.
  *   **Cause:** The student misreads the payoff structure, undervaluing the Alignment Bonus or assuming they don't have the Loyalty Trait.
  *   **Consequence:** The public signal resets. No cascade locks. The lesson is diluted.

  **Recovery Strategy:** **The "Risk Reminder" Intervention.**
  *   **Trigger:** If a student breaks the sequence before Student 6.
  *   **Action:** Pause the simulation briefly. Do not comment on the decision itself.
  *   **Script:** "Reminder to the committee: The Alignment Bonus is 15 points. The Loyalty Penalty is 20 points. You do not know if you hold the Loyalty Clause. Ensure your calculation accounts for the maximum possible downside risk."
  *   **Effect:** This re-anchors the remaining students to the risk-aversion incentive without explicitly telling them to herd. It usually stabilizes the sequence for the remaining participants.

  **Secondary Failure Mode:** **Total Skepticism.**
  *   **Scenario:** Students treat the "Loyalty Clause" as a bluff and all follow private scores.
  *   **Recovery:** During the reveal, ensure the penalty is enforced visibly. If necessary, in future runs, increase the penalty to -30 points to ensure risk aversion dominates. For this session, emphasize during the debrief that *assuming* it was a bluff was the strategic error that cost points.
