answer: |-
  You are right to feel that the standard analogy to Achilles and the tortoise is unsatisfying, because it conflates the completion of the temporal interval with the determination of the physical state. Your intuition that the problem lies elsewhere is correct, and your lever variant actually isolates the precise logical mechanism that makes the original lamp puzzle seem paradoxical. The core issue is not whether an infinite sequence of events can fit into a finite time, nor is it strictly about whether the physical quantity driving the lamp converges. The issue is about logical entailment and the difference between a function defined on an open interval and its value at the limit point. When we say there is no fact of the matter about the lamp at noon, we are not making a mysterious metaphysical claim about the universe failing to decide; we are making a logical claim about the description provided failing to specify the outcome.

  To see what licenses the verdict that the question is ill-posed, you have to look at what the supertask description actually defines. The story gives you a rule for the state of the lamp at any time t strictly before noon. It tells you exactly whether the lamp is on or off for every moment in the interval from the start up to, but not including, noon. However, the description remains silent about the state at noon itself. In standard logic and mathematics, the values of a function on an open interval do not logically dictate the value of the function at the boundary unless you add a further premise, such as continuity. If I tell you that a function f(t) equals 0 for all t less than 1, you cannot deduce logically that f(1) is 0 unless I also tell you that f is continuous. In the case of Thomson's lamp, the state function is explicitly discontinuous at every switch point, and the sequence of states does not converge. Because the description specifies the history completely but says nothing about the limit point, and because the history does not converge to a single state, the state at noon is logically underdetermined by the premises. Nothing licenses a specific answer because the premises do not contain enough information to entail one.

  Your lever variant sharpens this considerably because it separates the convergence of the physical control from the convergence of the logical state. In the original lamp, the switch position is abstract, but in your version, the lever position is a real number that converges nicely to one-half. This shows that the problem is not the supertask itself or the convergence of the underlying physical timeline. The problem is exclusively the discontinuity of the readout function that maps the physical quantity to the lamp state. When the lever converges to a value away from the threshold, the state function is continuous in that neighborhood, and the outcome is determinate based on the history. When it converges exactly to the threshold while oscillating around it, the state function is discontinuous at the limit, and the history fails to determine the outcome. This confirms your suspicion that the usual convergence-based story is incomplete. It is not enough for the time intervals to converge, nor is it enough for the physical control variable to converge. For the outcome to be determined by the history alone, the mapping from the physical state to the lamp state must be continuous at the limit point.

  This leads to a principled criterion for when a supertask has a determinate outcome. A supertask yields a determinate state at the completion time if and only if the state of the system at that time is logically entailed by the state of the system during the preceding interval. This entailment usually relies on a continuity principle. In physics, we often assume that physical quantities evolve continuously, meaning the state at the limit is the limit of the states. If we apply that physical assumption to your lever, we might say the lever is at one-half at noon. But even then, the lamp state is undefined unless we stipulate whether being exactly at one-half counts as on or off. If we apply that same physical assumption to the original lamp, we run into a wall because the lamp state itself does not converge. There is no limit to take. Therefore, the only way to make the original lamp determinate is to stipulate the state at noon as a new independent fact, rather than trying to derive it from the switching history. The verdict that there is no fact of the matter is simply the recognition that the switching history provides no such derivation.

  It is helpful to distinguish between logical possibility and physical realizability here, as this often muddies the water. Physically, of course, no machine can switch a lamp infinitely many times in a finite duration due to energy constraints and the speed of light. But in the context of the thought experiment, we are asked to grant the physical possibility to test the logical coherence. Even granting the physical possibility, the logical gap remains. The gap is that the past does not fix the future at a limit point without a bridging law. In the Achilles paradox, the bridging law is the definition of convergence in space and time, which tells us where the runner is. In the lamp paradox, there is no bridging law for the binary state. Your lever example demonstrates that if you have a bridging law for the physical variable (the lever position converges), you still need a bridging law for the output variable (the lamp state). If the output variable oscillates indefinitely, the bridging law of continuity cannot apply to it, and so the history leaves the future open.

  So the conceptual issue is not about the impossibility of completing an infinite task, but about the independence of the limit point from the sequence leading up to it. The verdict that the question is ill-posed is licensed by the rules of logical entailment. You cannot derive a conclusion that is not contained in the premises, either explicitly or via a necessary implication. The state at noon is not explicitly stated, and it is not implied by the states before noon because the sequence of states has no limit. Your lever construction shows that the convergence of the underlying physics is irrelevant if the property we are tracking is a discontinuous function of that physics. This suggests the standard story is indeed incomplete when it focuses solely on the timing of the switches. The complete picture requires acknowledging that determinacy at the limit requires continuity of the property in question, not just continuity of time or the control mechanism. When that continuity is absent, as it is with the binary lamp state oscillating forever, the state at the limit is logically free, and asking for it without further stipulation is asking a question that has no answer within the system described.
