answer: |-
  Your skepticism is well-founded. Your friend has grasped the *spirit* of Hofstadter's chapter but has collapsed several crucial distinctions in the process. This is a very common pattern when people digest *Gödel, Escher, Bach* (GEB): the book is so dense with analogies that it's easy to mistake the analogy for an identity.

  Here is a claim-by-claim breakdown of what is fair, what is an overstatement, and what is technically incorrect, based on how Hofstadter actually constructs Typogenetics in GEB (specifically Chapter 15, "The Central Dogma of Typogenetics").

  ### 1. The Setup: "DNA is secretly doing Gödel's proof."
  **Verdict: Poetic, but misleading.**

  *   **What Hofstadter says:** Hofstadter invents Typogenetics to show that the *structure* of molecular biology (DNA $\to$ RNA $\to$ Protein $\to$ Action on DNA) is isomorphic to the structure of a formal system capable of self-reference. He wants to show how "meaning" (enzymes acting on strands) can arise from "mechanism" (symbol manipulation).
  *   **Where your friend errs:** DNA isn't "doing Gödel's proof." DNA is doing chemistry. Hofstadter is showing that if you treat DNA *as if* it were a formal system, it has the architectural properties required to support Gödelian self-reference.
  *   **The nuance:** The mapping is:
      *   **Strands** $\approx$ Strings of symbols (which can be Gödel-numbered).
      *   **Enzymes** $\approx$ Rules of Inference (operations that transform strings).
      *   **Translation** $\approx$ The Interpretation mapping (assigning meaning to symbols).
      *   **Fairness:** Your friend is right that Typogenetics is a genuine formal system with mechanical rules. It isn't just a metaphor; Hofstadter defines strict syntax and transformation rules for it.

  ### 2. The Core Confusion: "A self-replicating strand is the Gödel sentence."
  **Verdict: Wrong. This is the biggest technical error.**

  *   **The Distinction:** In computability theory and logic, there is a massive difference between a **Quine** and a **Gödel Sentence**.
      *   A **Quine** is a program (or strand) that outputs a copy of itself. It asserts: *"I am this object."*
      *   A **Gödel Sentence** is a statement that asserts its own unprovability. It asserts: *"I cannot be derived within this system."*
  *   **Hofstadter's Point:** Hofstadter spends a lot of time on the self-replicating strand to demonstrate **Quining**. He argues that Quining is the *mechanism* that allows a system to talk about itself. However, the self-replicating strand itself is **not** the Gödel sentence. The Gödel sentence would be a strand that encodes a proposition like "This strand has no derivation history."
  *   **Why it matters:** A self-replicating strand is a *witness* to the system's consistency (it exists and works). A Gödel sentence is a *witness* to the system's incompleteness (it is true but unreachable). Your friend has conflated "self-reference" with "incompleteness." Self-reference is the tool; incompleteness is the result of applying that tool to provability.

  ### 3. Turing Completeness and Undecidability
  **Verdict: Mostly fair regarding the variant, but the conclusion is garbled.**

  *   **The Variant:** Your friend's modification (unbounded strands, append operation) does sound like it pushes the system toward Turing Completeness (likely a Tag system or similar). If the system is Turing Complete, then yes, the Halting Problem applies.
  *   **The Error:** He claims: *"Every self-replicating strand in it is a true-but-unprovable fact."*
      *   This is nonsense. A strand is an object, not a fact.
      *   The *statement* "Strand S will eventually replicate" might be undecidable (you can't predict it in advance).
      *   But the strand itself isn't "true-but-unprovable." If the strand actually replicates in your simulation, it's just a fact that it replicated.
  *   **Fairness:** He is right that if you make the system Turing Complete, you inherit Gödel's Incompleteness and Turing's Undecidability. But he is applying the labels to the wrong things (objects vs. propositions).

  ### 4. The Translation Step (Strand $\to$ Enzyme $\to$ Action)
  **Verdict: Crucial, and your friend glosses over it.**

  *   **Why it matters:** You asked if it matters that the strand doesn't copy itself directly. **Yes, it matters immensely.** This is the "Central Dogma."
  *   **The Hierarchy:** If a strand could just say `COPY_ME`, that's trivial. The magic of Typogenetics (and biology) is the **level shift**.
      1.  **Level 1:** The Strand (Data).
      2.  **Level 2:** The Enzyme (Program/Function derived from Data).
      3.  **Level 3:** The Action (The Function acting on new Data).
  *   **The Strange Loop:** This separation allows the "Data" to determine the "Rules" that act on the "Data." This is what creates the "Strange Loop" Hofstadter is famous for. If your friend's variant removes the translation step (e.g., if the strand directly manipulates itself without being translated into an enzyme first), he has broken the isomorphism to biology and simplified the logical loop.
  *   **Friend's Variant:** He says he "threw out the copy operation." If a strand cannot trigger a copy command, how does it replicate? If it uses "append" to build a copy of itself base-by-base, that is still replication, but it requires the enzyme to "know" the sequence of the strand. This implies the enzyme must be able to read the strand it came from. As long as that **Data $\to$ Function $\to$ Data** loop exists, the logical structure holds, even if the specific opcodes change.

  ### 5. The Biological Leap: "Cells are literally instantiating a Gödel sentence."
  **Verdict: Philosophical overreach / Category Error.**

  *   **The Claim:** "DNA in a cell is a self-replicating strand in exactly this sense, so cells are literally instantiating a Gödel sentence."
  *   **The Problem:** This conflates **physical causality** with **logical provability**.
      *   In a formal system, "truth" is defined by derivation from axioms.
      *   In biology, "existence" is defined by physical stability and reproduction.
  *   **Why it evaporates:** A cell replicating is a physical event. It is not a logical proof. For a cell to be a Gödel sentence, the universe would have to be a formal axiomatic system where "existence" equals "provability." While some physicists (like Wheeler's "It from Bit") flirt with this idea, it is not a scientific fact, and it is certainly not what Hofstadter claims. Hofstadter suggests that *consciousness* might arise from similar loops, but he doesn't claim a bacterium is a logical paradox.
  *   **Fairness:** It is fair to say cells instantiate **Quines** (self-reproducing objects). It is not fair to say they instantiate **Gödel Sentences** (statements of unprovability).

  ### Summary: What to tell your friend

  1.  **You nailed the architecture:** Typogenetics *is* a formal system, and the separation of Strand (data) and Enzyme (function) is the key to the self-reference. Your variant sounds like a fun computational exploration.
  2.  **You mixed up Quines and Gödel:** A self-replicating strand is a **Quine**. It says "I am me." A Gödel sentence says "I am unprovable." Self-replication is the *mechanism* used to build a Gödel sentence, but the replicator itself isn't the sentence of incompleteness.
  3.  **Don't reify the math:** A strand isn't a "true-but-unprovable fact." A strand is an object. The *proposition* about the strand's behavior might be undecidable.
  4.  **Biology isn't Logic:** Cells are physical Quines. Calling them Gödel sentences implies the physical world is bound by logical provability in a way that isn't supported by the theory.

  **The Bottom Line:** Your friend has correctly identified that Typogenetics is a model of computation that supports self-reference. However, he has fallen into the trap of thinking that **Self-Reference = Incompleteness**. Self-reference is necessary for incompleteness, but a self-replicating object is just a self-replicating object. It only becomes "Gödelian" if it makes a claim about its own derivability.

  His code is likely cool, and his intuition about Turing Completeness is probably right, but his philosophical conclusion is a classic case of "Gödel-flavored poetry" masquerading as rigorous logic. Hofstadter would likely smile at the enthusiasm but correct the terminology.
