  # Seminar Simulation: The Guild of Translators
  **Topic:** Honor, Coordination, and Norm Change (Williams/Appiah)
  **Time:** 90 Minutes
  **Players:** 12 Grad Students

  ### The Setup (10 min)
  **Scenario:** You are members of the prestigious Guild of Translators. For centuries, the Guild has maintained a "Loyalty Ritual." Whenever a Junior member makes a public mistranslation, every other member must stand and perform a loud, humiliating correction chant. It proves solidarity. It hurts the Junior. 

  **The Catch:** Leaving the Guild means career death. You are stuck with each other. But the Ritual is becoming seen as cruel. 

  **Roles (Assign randomly):**
  *   **3 Elders:** High status. You control the norms. You speak first in debate. You want order, but secretly worry the Ritual is outdated.
  *   **6 Members:** The backbone. You can act, but you risk expulsion. You care about your reputation among the Elders.
  *   **3 Juniors:** The victims. You are affected by the Ritual. You can speak in Round 1, but you have no vote and cannot break the norm yourself.

  ---

  ### Round 1: The Debate (20 min)
  **Goal:** Try to convince the room to abolish the Ritual using arguments alone.
  **Rules:**
  *   Open floor. Elders speak first.
  *   **Juniors:** You have a hard cap of 2 minutes total per person. Use it wisely.
  *   **Hidden Rule:** Arguments *will not work*. No matter how good your moral reasoning is, nobody changes their mind here. This is intentional. Feel the frustration.

  ### Round 2: The Choice (25 min)
  **Goal:** Decide whether to break the norm.
  **Rules:**
  *   **Silence.** No talking. No negotiation.
  *   **Juniors:** You are silent this round.
  *   **Members & Elders:** You will receive a sealed envelope and an index card.
  *   **The Choice:** Write "BREAK" (refuse to chant) or "KEEP" (perform the chant). Put it in the envelope.
  *   **The Payoff (Reputation Points):**
      *   **If fewer than 4 people BREAK:** The Ritual survives. Those who wrote BREAK lose **4 points** (punished for deviance). Those who wrote KEEP get **0**.
      *   **If 4 or more people BREAK:** The Ritual collapses. Those who wrote BREAK lose **1 point** (cost of leadership). Those who wrote KEEP gain **5 points** (free riders benefit from the change).
  *   *Note:* You want to maximize your points, but you also care about whether the Ritual survives.
  *   **Security:** Seal the envelopes. I will collect them. Do not peek.

  ### Round 3: The Reveal (15 min)
  1.  I will open the envelopes and tally the votes on the board.
  2.  Calculate scores based on the payoff rules.
  3.  **Silence:** Once the result is posted, everyone sits in silence for 2 minutes. Look at the score. Look at who broke. Sit with the outcome.

  ---

  ### Debrief & Discussion (20 min)
  **Phase 1: The Failure of Argument (Round 1)**
  *   Juniors: How did it feel to be capped at 2 minutes while everyone debated your dignity?
  *   Everyone: Why didn't the moral arguments work? Did anyone actually change their mind during the debate?
  *   *Point:* Williams/Appiah argue that honor codes aren't beliefs you talk out of people; they're social equilibria.

  **Phase 2: The Coordination Problem (Round 2)**
  *   Who broke? Was it mostly Elders or Members?
  *   Did anyone worry about being the only one to break? (The -4 penalty).
  *   Did anyone want to free-ride? (Hope 4 others break so you get +5 without risking anything).
  *   *Point:* Norms die when the *cost* of maintaining them exceeds the social benefit, but only if enough people shift at once. It's risky coordination, not an essay contest.

  **Phase 3: Reality Check**
  *   **Instructor Note:** I need to be honest here. This game is 25 minutes. Real norm change takes decades. In reality, the "points" aren't game scores—they're your livelihood, your family's standing, your safety. The fear of being the *only* one to break is much heavier than -4 reputation points. 
  *   What would it take for you to break the norm in real life? Would you need an Elder to go first?

  ---

  ### Instructor Cheat Sheet (Do Not Distribute)
  **What will go wrong:**
  *   **Negotiation:** Students will try to talk during Round 2 to coordinate ("I'll break if you break"). **Stop this.** Insist on sealed envelopes. The point is the *risk* of uncoordinated action.
  *   **Juniors dominating:** Juniors might get passionate in Round 1. Enforce the 2-min cap strictly. Their powerlessness is part of the lesson.
  *   **Cynicism:** Students might say "I knew arguments wouldn't work." Remind them that in real life, we *always* try arguments first. The frustration they felt is the data.

  **The Williams/Appiah Hook:**
  *   Dueling didn't end because people read essays saying "violence is bad." It ended when the social cost of dueling (looking like a thug) outweighed the benefit (looking like a gentleman). 
  *   In Round 2, if the norm fell, it's because the coordination threshold was met. If it didn't, it's because the risk of being isolated was too high. 
  *   Moral change looks less like persuasion and more like a risky shift in common knowledge.

  **Timing Buffer:**
  *   If Round 1 drags, cut the silence in Round 3 to 1 minute. 
  *   If Round 2 is too fast, extend the debrief on the "free rider" problem (why keepers got +5).
