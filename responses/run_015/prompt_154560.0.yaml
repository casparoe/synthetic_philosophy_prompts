  **The Scenario**

  The town of Oak Creek is voting on a housing bill where Option A keeps 50 locals living comfortably at a wellbeing level of 8/10. Option B builds cheap units for 400 newcomers, but crossing 200 residents triggers a non-linear water table collapse that drops the original 50 locals to 5.5/10. Due to uneven access among the newcomers, exactly half of them end up at 5.1 wellbeing while the other half sink to 4.9, bringing the total population to 450 despite the infrastructure failure.

  ***

  **The Check**

  **Belief/Scenario:** We're looking at a classic population ethics clash in a realistic setting: do we prioritize a smaller, happier group (A) or a larger, barely-content group (B), specifically when adding people causes a sudden infrastructure crash rather than a smooth decline.

  **Verdicts:**
  *   **Total Utilitarianism picks B:** They just add up the wellbeing points. Even though life is harder in B, having 450 people alive with ~5 points each creates way more total "goodness" than 50 people with 8 points.
  *   **Average Utilitarianism picks A:** They care about the average quality of life. Since 8/10 is much higher than the ~5/10 average in Option B, they reject the expansion.
  *   **Critical-Level Utilitarianism splits:** If the critical level is set at 5, Option B might win because so many people are just barely above that line, creating a lot of small "wins." But if you set the critical level at 6, almost everyone in Option B falls below the mark, making Option A the clear winner.
  *   **Threshold-Sensitive Person-Affecting picks A:** This view says you only count people who clear the 5.0 baseline. The 200 newcomers at 4.9 don't count at all. The original 50 residents are definitely hurt (dropping from 8 to 5.5), and the 200 newcomers who *do* count (at 5.1) aren't enough to justify harming the original locals.

  **Heavy Lifting Feature:** The **non-linear infrastructure collapse** is doing all the work here. It creates a "cliff edge" where quality of life doesn't just slowly dilute; it crashes hard once you hit a specific population number. This makes the trade-off feel more dramatic and risky than a standard repugnant conclusion case.

  **Linear Damage Counterfactual:** If the damage was linear (like each new person just slightly lowered water pressure), you wouldn't get that sudden drop to 5.5. You could add people gradually, and the wellbeing might stay high enough for longer, making Option B look much more attractive to the Average and Person-Affecting views because the originals wouldn't be harmed as severely.

  **Total-Utilitarian Defense:** A Total Utilitarian would argue that you're ignoring the 200 newcomers living at 5.1. They'd say, "Sure, the original 50 lose some comfort, but you're refusing to let 200+ people exist with lives worth living just to protect the luxury of the few. As long as those new lives are above zero (or the critical threshold), bringing them into existence is a net gain."
