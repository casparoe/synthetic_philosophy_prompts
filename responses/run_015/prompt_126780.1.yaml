      *   *Distributed:* Engineers build the surge logic. Economists set the elasticity. Execs set the margin. No one says "Let's exclude the poor."
      *   *The Issue:* Does the *protocol* have the intention? If yes, why only for harm? If no, why did we think the CEO had the intention in the original case? (Maybe the CEO is also just a node in a corporate structure?)

  8.  **Finalizing the Response Structure:**
