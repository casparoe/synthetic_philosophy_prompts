answer: |-
  There is no single, canonical noun (like "The Ad Hominem Fallacy") that universally names this specific asymmetry. However, in the metaethical literature surrounding Evolutionary Debunking Arguments (EDAs), this phenomenon is most commonly discussed under the headings of **"Local vs. Global Debunking,"** **"Epistemic Privilege,"** or the **"Self-Defeat Objection."**

  When critics point out this selective deployment, they often describe the debunker as claiming **"Epistemic Immunity"** for their own reasoning while denying it to moral agents. Conversely, when debunkers defend the move, they argue for **"Domain Specificity."**

  Here is a detailed breakdown of how to classify, distinguish, and bound this phenomenon.

  ### 1. Naming the Phenomenon
  While there is no single capitalized term, the most precise descriptive labels currently in use are:

  *   **Local Evolutionary Debunking:** This is the standard term for the strategy you describe. A "Local" debunker restricts the skeptical force of evolution to moral beliefs, whereas a "Global" debunker applies it to all beliefs (including science and logic), which usually leads to immediate self-defeat.
  *   **The Asymmetry Objection:** This is the label critics (such as Katia Vavova or David Enoch) use when challenging the debunker. They argue that the debunker relies on an unjustified asymmetry between moral faculties and epistemic faculties.
  *   **Epistemic Exceptionalism:** This term captures the *charge* that the debunker is treating epistemic norms (e.g., "believe what is justified") as exempt from the very evolutionary scrutiny they apply to moral norms.

  ### 2. Distinction from Generic Self-Defeat
  A generic self-defeat problem occurs when a proposition logically entails its own falsity (e.g., "No statement is true"). The asymmetry you noticed is more subtle; it is a **methodological** tension rather than a strict logical contradiction.

  *   **Generic Self-Defeat:** The argument destroys its own foundation *necessarily*. If the debunker argued that *all* beliefs are evolutionarily shaped and therefore unjustified, their belief in evolutionary theory would also be unjustified. This is the "Global" position (associated with Alvin Plantinga's *Evolutionary Argument Against Naturalism*).
  *   **The Asymmetry (Local Debunking):** The debunker attempts to avoid generic self-defeat by carving out an exception. They argue that evolutionary explanations undermine moral beliefs *because* those beliefs claim to track mind-independent truths, whereas epistemic beliefs (or the belief in evolution itself) do not make that same claim, or are justified pragmatically.
      *   **The Distinction:** The asymmetry is not self-defeat *per se*; it is a **claim of relevance**. The debunker argues the evolutionary explanation is relevant to justification in Domain A (Morality) but not Domain B (Epistemology/Science). It only becomes a self-defeat problem if the critic can show that the distinction between Domain A and Domain B is untenable (the "Companions in Guilt" argument).

  ### 3. Distinction from Explanatory Pluralism
  Explanatory pluralism is the view that multiple explanations (e.g., evolutionary, psychological, rational) can coexist for a single belief without cancelling each other out.

  *   **Explanatory Pluralism:** "I believe harming is wrong *because* it is wrong (reason) AND *because* evolution selected for cooperation (cause)." Both can be true.
  *   **The Asymmetry in EDAs:** The debunker is not merely offering a pluralist explanation; they are making a **normative** claim about *justification*. They argue that the evolutionary explanation *displaces* the rational justification in the moral domain (making the belief accidental relative to truth) but does *not* displace rational justification in the epistemic domain.
  *   **The Key Difference:** Pluralism is about **compatibility** of causes. The asymmetry you noticed is about the **undermining force** of those causes. The debunker treats the evolutionary cause as a "defeater" for morality but a "neutral background condition" for their own argument.

  ### 4. Boundaries of the Phenomenon
  To determine when this selective deployment is legitimate (a valid distinction) versus vicious (special pleading), philosophers draw boundaries around three key criteria:

  #### A. The Truth-Tracking Claim
  *   **Boundary:** Does the belief in question claim to track mind-independent truth?
  *   **Application:** Debunkers (like Richard Joyce or Sharon Street) often argue that moral realism claims to track independent truths, which evolution does not do. However, they may argue that scientific beliefs *are* selected for truth-tracking accuracy (instrumental value), or that epistemic norms are merely practical tools we cannot help but use (Street's "Practical Standpoint").
  *   **Violation:** If the debunker relies on epistemic norms that *also* claim to track mind-independent truth (e.g., logical realism), the asymmetry collapses into self-defeat.

  #### B. The Causal Link
  *   **Boundary:** Is the evolutionary influence *direct* on the content of the belief?
  *   **Application:** A debunker might argue evolution directly shaped the content of "incest is wrong" (via disgust mechanisms) but only shaped the *capacity* for scientific reasoning, not the specific content of "evolution is true."
  *   **Violation:** If evolutionary pressures also directly shape our logical intuitions or our trust in sensory perception (as Plantinga argues), the boundary dissolves.

  #### C. The "Third Factor" Response
  *   **Boundary:** Is there a link between survival and truth?
  *   **Application:** Realists often argue that there is a "third factor" (e.g., survival requires cooperation; cooperation requires true moral beliefs) that aligns evolution with truth.
  *   **Violation:** If the debunker accepts a third-factor link for epistemic beliefs (survival requires true science) but denies it for moral beliefs without a clear reason, the asymmetry is arbitrary.

  ### Summary
  The pattern you have identified is the structural core of **Local Evolutionary Debunking**. It relies on **Epistemic Privilege** to avoid the **Self-Defeat Objection**.

  *   **If the privilege is justified:** It is a valid **Domain-Specific Argument**.
  *   **If the privilege is unjustified:** It is an instance of **Special Pleading** or **Arbitrary Domain Restriction**.

  The most robust critique of this asymmetry is the **"Companions in Guilt"** argument, which posits that if evolutionary explanations debunk moral beliefs, they must also debunk epistemic beliefs, because both domains rely on similar cognitive faculties. The debunker's task is to explain why the moral faculty is "guilty" (truth-insensitive) while the epistemic faculty is "innocent" (truth-sensitive or pragmatically indispensable).

  **Recommended Reading for this Specific Asymmetry:**
  *   **Sharon Street,** *"Evolution and the Normativity of Epistemic Reasons"* (She explicitly addresses why epistemic norms survive debunking while moral norms might not).
  *   **Katia Vavova,** *"Debunking Evolutionary Debunking"* (Focuses heavily on the asymmetry and self-defeat worries).
  *   **Alvin Plantinga,** *"Where the Conflict Really Lies"* (For the parallel argument regarding naturalism and evolution).
  *   **David Enoch,** *"Taking Morality Seriously"* (Develops the "Companions in Guilt" response to this asymmetry).
