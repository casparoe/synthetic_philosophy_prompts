  **Working Notes / Brainstorming**

  *Okay, let's unpack this before I write the actual handout. I need to make sure I don't just summarize the plot or the philosophy, but smash them together.*

  *First, the "Shared-Screen Objection."* If I tell the group "It's sci-fi, so Malcolm doesn't apply," I'm boring them. The prompt asks if this defuses the film. I think it actually relocates the problem. If dreams are private, Malcolm says we can't check criteria. But in *Inception*, the dream is shared. Ariadne sees the bridge fold; Cobb sees it. Does public verification make it a "real experience" in the Malcolm sense? Or is it just a shared hallucination, which is still not a "dream" in the ordinary sense? I should argue that the tech doesn't save the film from the philosophy; it just makes the "experience" more robust, which makes the denial of it (by Malcolm/Dennett) more striking. It forces the question: if everyone agrees it happened, did it happen?

  *Second, Time.* This is the biggest clash. Dennett says dream duration is a narrative trick upon waking. The film says dream duration is physiological (sedative + brain speed). Saito aging in limbo is the physical proof the film offers against Dennett. But wait—if limbo is raw subconscious, maybe it *is* just a narrative construct that feels long. The film wavers here. It treats limbo time as real (Saito ages) but also undefined (nobody knows how long). I can use that vagueness. The film dramatizes the *feeling* of eternity, which is exactly what Dennett says a dream is—a feeling of eternity constructed retrospectively. So the film might accidentally prove Dennett right by showing how convincing the construction is.

  *Third, Mal.* She is the key. She is explicitly a projection. Cobb knows this. But he treats her as a person he wronged. If Dennett is right, Mal is just a memory fragment assembled at arousal. But in the film, she acts independently. This is where the film's mechanics (architect building things) undercut its drama (Cobb loving her). If she's built, she's not a subject. Can you murder a subroutine? The film says yes (guilt). Philosophy says... maybe not. This tension is gold. It highlights the moral weight we assign to experiences even if we know they're constructed.

  *Fourth, Normativity.* Mal kills herself to wake up. The film says: "That's tragic, she was lost." But if Malcolm is right, her question "Is this real?" is the only sane question. The film pathologizes the skeptic. It says sanity is accepting the world in front of you, even if it might be a dream. That's a pragmatic stance, not a metaphysical one. I need to make sure the group sees that the film is taking a side: functional reality > metaphysical truth.

  *The Ending.* The top. If I say "it doesn't matter," that's cliché. I need to say *why* it doesn't matter. It matters because Cobb walks away. He chooses the experience over the verification. That's the anti-skeptical move.

  *Value Add.* Why watch? Because reading Dennett is dry. Watching Cobb cry over a projection makes you feel the *stakes* of the philosophy. It makes the "unreal" feel heavy. That's the thing to land on.

  *Okay, structure:*
  1. Intro: Set up the Malcolm/Dennett vs. Film premise.
  2. The Tech Objection (Relocating, not defusing).
  3. Time (Saito's aging vs. Narrative construction).
  4. Mal (Projection vs. Personhood).
  5. Normativity (Sanity as acceptance).
  6. The Top (Choice over verification).
  7. Conclusion (The emotional weight of the unreal).

  *Let's keep the language accessible but sharp. No jargon without explanation. Describe scenes vividly.*

