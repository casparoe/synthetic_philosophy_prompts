  ### **Facilitator Troubleshooting**

  **Q: What if nobody discovers the compression move?**
  *   **A:** In the "Intervention" phase, if Teams 3 & 4 are still paying full price, stop the clock. Hold up a hand of four 'L' cards. Ask: *"Do I really need four pieces of paper to tell you this? Or can I use one piece of paper and a rule?"*
  *   If they still don't get it, demonstrate it yourself. *"I am the House. I accept this '4L' card as valid memory for these four turns."* Then charge them for 2 cards instead of 4. The lesson holds even if you have to hand them the tool.

  **Q: What if the Random Teams get lucky and win?**
  *   **A:** Variance is real. If a Blind team ends up +5 chips, acknowledge it. *"You got lucky. Run the game 1,000 times, and you go bust. The Second Law is statistical, not absolute for single trials. But look at the Naive Recording team—they lost guaranteed. Why?"* (Focus on the cost of certainty).

  **Q: What if they argue the "Key" card shouldn't cost anything to erase?**
  *   **A:** *"The Key is information. It distinguishes '4L' from '4R' or 'Alternating'. If you erase the Key, you can't recover the data. To reset the system to a blank state, the Key must go too. Physical states must be restored."*

  **Q: How do I prepare the decks?**
  *   **Deck A (Random):** Use a coin flip app. Generate 40 flips. Ensure no runs longer than 3. (e.g., L R L L R L R R...)
  *   **Deck B (Patterned):** Create runs of 4 or 5. (e.g., L L L L R R R R L L L L...). Ensure total count is 50/50 (20L, 20R).
  *   Print these out on large cards so you can flip them visibly.

  ### **Final Note to You**
  The success of this session hinges on the **Erasure Fee**. Do not let them reset a card without paying the 4 chips. Be the strict banker. When they hand you a marked card to clear, physically take 4 chips from their stack before handing the blank card back. Make the pain of erasure visceral. That tactile loss is where the philosophy lives.
