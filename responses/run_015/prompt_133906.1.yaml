  Here is a complete run-sheet for your 75-minute session. It is designed to be physically tactile, mathematically tight, and philosophically pointed, adhering to your constraint to delay naming Landauer/Szilard until the debrief.

  ### **Session Title:** The Demon's Ledger
  **Time:** 75 Minutes
  **Students:** 16 (4 Teams of 4)
  **Materials:**
  *   **Tokens:** 2 bags of poker chips or marbles (Red = Left, Blue = Right).
  *   **Memory:** Index cards cut into small slips (approx. 50 per team).
  *   **Currency:** Poker chips or distinct tokens (20 per team to start).
  *   **Sequences:** Two decks of cards prepared by you (see *Arithmetic & Setup*).
  *   **Whiteboard:** For scorekeeping and the final reveal.

  ---

  ### **Part 1: The Setup (10 Minutes)**

  **1. The Story (3 mins)**
  Tell them: *"You are demons. Your job is to sort molecules to create energy. Molecules arrive one by one, either Left (Red) or Right (Blue). You control a shutter. If you open the shutter when the molecule matches your target side, you harvest Energy Chips. If you open it on the wrong side, you lose Energy Chips. If you don't open it, nothing happens."*

  **2. The Rules (5 mins)**
  Write this on the board:
  *   **Harvest:** +2 Chips (Correct shutter opening).
  *   **Leak:** -2 Chips (Incorrect shutter opening).
  *   **Pass:** 0 Chips (Shutter stays closed).
  *   **Measurement:** To know which side the molecule is on, you **must** write it on an Index Card (Memory Slot). Writing is free.
  *   **Memory Limit:** Each team has a "Register" of **5 slots** (physical spaces on the table where cards can sit). You cannot measure a new molecule if your 5 slots are full.
  *   **Reset:** To clear a slot, you must pay the **Erasure Fee: 4 Chips per card**.
  *   **Goal:** End the game with more chips than you started.

  **3. The Distribution (2 mins)**
  *   Split the room into 4 Teams.
  *   **Teams 1 & 2 (Random):** Give them **Deck A**.
  *   **Teams 3 & 4 (Patterned):** Give them **Deck B**.
  *   *Note:* You (the Facilitator) hold the master sequence. You will call out "Molecule Arriving..." and reveal the color from your deck. The teams hold the matching deck to verify, or you can deal the sequence face-down to them one by one. *Better for flow:* You hold the master deck. You flip the top card. Teams must decide: Measure (write it down) or Guess (open shutter blindly).

  ---

  ### **Part 2: The Arithmetic (Why the numbers work)**

  You requested the math be explicit. Here is the balance sheet for a block of **4 Molecules**.

  **1. The "Blind" Strategy (No Memory)**
  *   Team guesses randomly (50/50 chance).
  *   Expected Outcome: 2 Correct, 2 Incorrect.
  *   Math: $(2 \times +2) + (2 \times -2) = 0$ Chips.
  *   **Result:** Roughly Flat. (Variance might kill them, but expected value is 0).

  **2. The "Naive Demon" Strategy (Record Everything)**
  *   Team writes every molecule on 1 card each.
  *   Memory Used: 4 Cards.
  *   Harvest: 4 Correct ($4 \times +2 = +8$ Chips).
  *   Erasure Cost: 4 Cards $\times$ 4 Chips = 16 Chips.
  *   Math: $+8 - 16 = -8$ Chips.
  *   **Result:** Ends Down. (Information is costly).

  **3. The "Smart Demon" Strategy (Compression)**
  *   *The Wrinkle:* Teams notice a pattern (e.g., L L L L). They can encode 4 molecules onto **2 Cards** instead of 4.
      *   Card 1: "4L" (The Data)
      *   Card 2: "Key: Run-Length" (The Algorithm)
      *   *Rule:* To use this, they must show you the Key. They pay to erase both cards later.
  *   Memory Used: 2 Cards for 4 molecules.
  *   Harvest: 4 Correct ($4 \times +2 = +8$ Chips).
  *   Erasure Cost: 2 Cards $\times$ 4 Chips = 8 Chips.
  *   Math: $+8 - 8 = 0$ Chips.
  *   **Result:** Break-even. (Nobody beats the house).

  **Why this teaches the lesson:**
  The Naive team loses because they treat information as free. The Smart team survives because they recognize that *structure* reduces physical memory requirements. The Blind team survives by luck, but risks ruin. The only way to guarantee survival without ruin is to manage the physical cost of memory.

  ---

  ### **Part 3: Gameplay (30 Minutes)**

  **Phase 1: The Trap (15 mins)**
  *   Run the sequence fast. 1 molecule every 30 seconds.
  *   Teams 1 & 2 (Random) will fill their 5 slots quickly. They will be forced to Reset often. Watch their chip stacks dwindle.
  *   Teams 3 & 4 (Patterned) will see runs (e.g., L L L L L).
  *   **Facilitator Note:** Do not mention compression yet. Let Teams 3 & 4 feel the pain of the Erasure Fee. If they complain, say: *"The universe charges for cleanup."*

  **Phase 2: The Intervention (15 mins)**
  *   Pause the game. Announce: *"You are allowed to re-encode your memory before resetting. If you can show me a way to represent your current cards using fewer cards, such that I can reconstruct the original data from your new cards, you only pay the Erasure Fee for the new, smaller stack."*
  *   This is the critical moment.
  *   **Teams 1 & 2 (Random):** Will struggle. `L R L R` doesn't compress well. They will likely pay full freight.
  *   **Teams 3 & 4 (Patterned):** Should realize `L L L L` can become one "4L" card + one "Key" card.
  *   Resume play. Let them finish the deck.

  ---

  ### **Part 4: The Debrief (35 Minutes)**

  **1. The Tally (5 mins)**
  *   Count chips.
  *   **Expected Outcome:**
      *   Blind Guessers: Roughly started amount (maybe down due to variance).
      *   Naive Recorders (Random Decks): Significantly down.
      *   Smart Recorders (Patterned Decks): Roughly started amount.
  *   Ask: *"Why did the teams who wrote everything down lose? They knew exactly what was happening."*

  **2. Mapping the Game to Physics (15 mins)**
  *   **The Cards:** These are not just notes. They are **physical states**. A card with 'L' is in a different physical configuration than a blank card.
  *   **The Reset Fee:** This is **Landauer's Principle**. To reuse the card (restore it to a blank "zero" state), you must dissipate energy. In the game, I charged chips. In reality, nature charges heat ($k_B T \ln 2$ per bit).
  *   **The Compression:** This is **Entropy**. The Random decks had high entropy (high information content). The Patterned decks had low entropy.
  *   **The Lesson:** Information is not abstract. It is instantiated in matter. You cannot gain a thermodynamic advantage (beating the house) simply by knowing the state of the system, because the act of clearing your knowledge to make room for new knowledge costs exactly as much as the knowledge was worth.

  **3. Handling the "Arbitrary Rule" Objection (5 mins)**
  *   *Student:* "The reset fee is just a rule you made up. It doesn't prove physics."
  *   *You:* "Pick up a marker. Write 'L' on the board. Now, tell me how to remove that ink without expending energy."
  *   *Student:* "Wipe it."
  *   *You:* "Your arm burns calories. The eraser heats up via friction. If you don't pay that cost, the ink stays. In the game, the chips represent that work. If I didn't charge you, I'd be allowing you to create order (a blank card) from disorder (a marked card) for free. That violates the Second Law. The fee isn't arbitrary; it's the only thing preventing you from building a perpetual motion machine."

  **4. What the Game Can't Stage (5 mins)**
  *   **Continuous vs. Discrete:** Real memory is analog/quantum; our cards are digital.
  *   **The Measurement Cost:** In this game, writing was free. In some interpretations (and real experimental setups), measurement also has a cost. We isolated *Erasure* to make the point clear, but in a full cycle, measurement couples to the system too.
  *   **The Demon is Inside:** In the game, you are outside the box. In reality, the Demon is part of the thermodynamic system. The heat generated by your brain (or the computer) resetting its memory warms the very box you are trying to cool.

  **5. The Reveal (5 mins)**
  *   Now you can name them.
  *   **Szilard (1929):** Realized the Demon must measure the molecule, linking information to entropy.
  *   **Landauer (1961):** Realized the cost isn't measuring, it's *forgetting*. "Information is Physical."
  *   **Bennett (1982):** Showed that reversible computation (like your compression move) avoids cost *until* you finally erase the record.
  *   Close with: *"The Second Law is safe, not because demons can't exist, but because demons have to do laundry. And laundry costs energy."*

