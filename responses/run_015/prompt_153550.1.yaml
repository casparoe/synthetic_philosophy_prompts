answer: |-
  **Recommendation to the Oversight Board**

  **1. The Recommendation: A Dual-Framing Strategy**

  I recommend that the Board adopt a **dual-framing strategy**:

  *   **For the Charter:** Use **neutral, inclusive language** that defines the institution's mandate as preserving the testimonies and history of the atrocity against the [Specific Ethnic Group] without explicitly codifying a single legal classification (e.g., "The [Name] Memorial and Archive for the Victims of the [Year/Era] Atrocity").
  *   **For the Central Permanent Exhibit:** Adopt **Lemkin's term ("Genocide")** in the title and narrative, provided it is accompanied by contextual historical analysis within the exhibit itself (e.g., "The [Group] Genocide: Intent and Destruction" or "Testimonies of Genocide").

  This approach prioritizes the moral imperative of the memorial while attempting to mitigate the existential legal risk to the institution.

  **2. Rationale: Balancing Truth, Law, and Memory**

  My reasoning rests on three pillars: the distinction between legal adjudication and historical memory, the primary stakeholders of a memorial, and the duty of a democratic institution.

  *   **Legal Adjudication vs. Historical Memory:** Domestic courts operate under strict rules of evidence and burden of proof designed to assign individual criminal liability. A memorial operates in the sphere of public history and collective memory. While courts must avoid the "Genocide" label to adhere to specific statutory definitions for reparations, a memorial's duty is to interpret the *scope* and *nature* of the suffering based on the full weight of historical evidence and survivor testimony. Conflating the two spheres allows the limitations of past legal proceedings to dictate historical truth.
  *   **Survivor Dignity as Primary Mandate:** The survivors are the moral creditors of this institution. If the specific intent to destroy their group is the core of their trauma, minimizing that intent by using a narrower legal classification ("Crimes Against Humanity") risks replicating the erasure they suffered during the atrocity. A memorial that fails to honor how victims define their own suffering loses its moral legitimacy, regardless of its legal safety.
  *   **Democratic Fidelity:** A democratic memorial owes fidelity to **truth-telling** over bureaucratic procedure. While the rule of law is essential, democratic institutions must also serve as sites of conscience that can critique state narratives. If the state's current statutes prevent the recognition of historical truths that international scholars and victims acknowledge, the memorial should not become an instrument of that silencing. However, the institution must survive to tell that story; hence, the Charter remains neutral to protect the entity's legal standing, while the Exhibit fulfills the truth-telling mission.

  **3. What Would Change My Recommendation**

  My recommendation relies on the premise that there is a credible historical basis for the claim of "specific intent to destroy" (the *dolus specialis* required for genocide).

  **The specific evidence that would change my recommendation** would be the discovery of definitive archival material from the authoritarian regime's highest leadership explicitly **limiting** their objective to forced displacement or political suppression, while expressly **ruling out** physical or biological destruction of the group.

  If historical consensus shifted from "divided" to "conclusive" that the *intent to destroy* was absent, using Lemkin's term would cease to be a moral necessity and would become historical inaccuracy. In that case, fidelity to truth would require abandoning the term, even if survivors still demanded it, as a memorial cannot validate factually incorrect historical claims without losing its educational integrity.

  **4. Weakest Point in Reasoning**

  The weakest point in my reasoning is the **assumption of the state's tolerance for the distinction between the Charter and the Exhibit.**

  I am arguing that the Charter (governance) can remain neutral while the Exhibit (content) uses the contested term. However, government lawyers may view the Exhibit title as an "official document" or public representation of the state-funded entity. If the funding statute is written broadly enough to penalize *any* public use of the term by the institution, the state could defund the memorial regardless of the Charter's wording.

  My reasoning risks failure if it underestimates the political will of the current government to enforce statutory compliance over historical nuance. If using the term in the Exhibit triggers immediate defunding, the memorial closes, and no truth is told at all. In that specific scenario, the pragmatic need for institutional survival might ultimately force the Board to adopt the domestic classification in both the Charter and the Exhibit, despite the moral cost. This tension between **moral purity** and **institutional viability** is the fragility at the heart of this recommendation.
