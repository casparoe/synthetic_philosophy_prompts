prompt: |-
  You are presenting at an interdisciplinary workshop on longtermist ethics and the mathematics of moral value. Your thesis is that in moral spaces containing a potentially infinite number of moral patients—such as an indefinitely expanding universe in which every causal domain carries a nonzero probability of generating conscious life—the familiar action-omission asymmetry does not weaken gradually but collapses discontinuously once expected patient-density crosses a specific calculable threshold. You term this phenomenon "threshold asymmetry," and you argue that obligations to prevent suffering thereby shift categorically in kind rather than merely in scale, justifying highly risk-averse governance of technologies like artificial general intelligence and interstellar expansion without committing you to treat every minor risk as carrying infinite weight. The audience is composed of decision theorists well-versed in infinite-utility paradoxes, longtermist philosophers who fear that infinite obligations induce moral paralysis, and a cosmologist skeptical of exporting normative categories across cosmological scales. Prepare a speaker's defense sheet: list the objections in the order they are likely to arise, phrased in the vocabulary each subgroup would use; identify which objections carry genuine force; specify what should be conceded at the outset; identify the single reply that must succeed for the proposal to survive; and flag the weakest point in the argument that should be actively defended rather than obscured. Include the objection you are hoping no one raises.
reasoning: |-
  Here's a thinking process that leads to the suggested speaker's defense sheet:

  1.  **Analyze the Request:**
      *   **Role:** Presenter at an interdisciplinary workshop (longtermist ethics, mathematics of moral value).
      *   **Thesis:** "Threshold Asymmetry." In moral spaces with potentially infinite moral patients (indefinite expansion, nonzero probability of life everywhere), the action-omission asymmetry collapses *discontinuously* at a specific expected patient-density threshold. Obligations shift categorically, not just in scale. Justifies risk-averse governance of AGI/expansion without infinite weight on minor risks.
      *   **Audience:**
          1.  Decision Theorists (versed in infinite-utility paradoxes).
          2.  Longtermist Philosophers (fear moral paralysis from infinite obligations).
          3.  Cosmologists (skeptical of exporting normative categories to cosmological scales).
      *   **Deliverable:** A Speaker's Defense Sheet.
      *   **Required Elements:**
          1.  Objections ordered by likelihood (using subgroup vocabulary).
          2.  Identification of genuine force objections.
          3.  Concessions to make at the outset.
          4.  The single reply that *must* succeed.
          5.  The weakest point to actively defend (not obscure).
          6.  The objection hoped *not* to be raised.

  2.  **Deconstruct the Thesis ("Threshold Asymmetry"):**
      *   *Core Claim:* There's a tipping point in expected patient density where "doing nothing" (omission) becomes morally equivalent to "doing harm" (action) regarding suffering prevention.
      *   *Mechanism:* Discontinuous collapse of asymmetry (phase transition metaphor).
      *   *Implication:* High risk aversion for AGI/Expansion, but *not* Pascal's Mugging (no infinite weight on tiny probabilities).
      *   *Mathematical Hook:* "Calculable threshold."

  3.  **Drafting Objections (by Subgroup):**

      *   *Decision Theorists:* They care about expected utility, convergence, and paradoxes (St. Petersburg, Pasadena).
          *   *Objection:* How do you define the threshold without arbitrary cutoffs? Does this solve the "infinite expectation" problem or just hide it? If the universe is infinite, standard EU maximization fails.
          *   *Vocabulary:* "Measure problem," "convergence," "dominance arguments," "arbitrary priors."

      *   *Longtermist Philosophers:* They care about action-guidance, paralysis, and demandingness.
          *   *Objection:* If the threshold is crossed, does *everything* become obligatory? Does this lead to the paralysis they fear? Is the discontinuity justified or just a trick to avoid demandingness?
          *   *Vocabulary:* "Overdemandingness," "moral paralysis," "lexical priority," "non-identity problem."

      *   *Cosmologists:* They care about physical reality vs. normative projection.
          *   *Objection:* "Patient-density" isn't a physical quantity. Causal domains are disconnected. You're projecting ethics onto physics where causality breaks down.
          *   *Vocabulary:* "Cosmic horizon," "causal disconnection," "category error," "anthropocentric projection."

  4.  **Selecting and Ordering Objections:**
      *   *Likely First:* Cosmologists often ground the discussion. "Is this physically meaningful?"
      *   *Likely Second:* Decision Theorists will attack the math. "How does the threshold work?"
      *   *Likely Third:* Philosophers will attack the implications. "Does this paralyze us?"
      *   *Refinement:* Let's order by logical dependency. Physics -> Math -> Ethics.
      1.  Cosmologist: Category Error (Causal disconnection).
      2.  Decision Theorist: Measure/Threshold Arbitrariness.
      3.  Longtermist: Paralysis/Overdemandingness.
      4.  Decision Theorist: Pascal's Mugging residual risk.

  5.  **Identifying Genuine Force:**
      *   The "Measure Problem" (Decision Theorists) is the strongest. If the threshold isn't mathematically robust, the whole theory collapses.
      *   The "Category Error" (Cosmologists) is also strong because if causal domains are disconnected, moral obligation across them is dubious.

  6.  **Concessions:**
      *   Must concede that the threshold isn't *physically* detectable like a phase change in water. It's normative.
      *   Must concede that "infinite" is tricky; the theory relies on *expected* density, not actual infinity.

  7.  **The Single Reply That Must Succeed:**
      *   The defense against the "Arbitrariness" charge. Why *this* threshold? It needs to be derived from the structure of moral reasoning, not stipulated. The reply must show that the discontinuity arises from the *logic of aggregation* under uncertainty, not a convenient number.

  8.  **The Weakest Point:**
      *   The "Discontinuous" nature itself. Ethics usually feels continuous. Why a phase shift? This looks like a gerrymandered solution to avoid infinite demands. Needs active defense, not hand-waving.

  9.  **The Objection Hoped Not Raised:**
      *   The "Non-Identity Problem" applied to the threshold. If we change the expansion trajectory, we change *who* exists. If the threshold depends on *who* exists, is the obligation coherent? Or, more dangerously: "If the threshold is crossed, does suicide/prevention of birth become obligatory to lower density?" (The Anti-Natalist Trap). Let's go with the Anti-Natalist/Existence Trap.

  10. **Refining the Content (Iterative Polish):**
      *   *Tone:* Academic, precise, defensive but open.
      *   *Vocabulary Check:* Ensure Decision Theorists hear "dominance," Philosophers hear "supererogatory," Cosmologists hear "light cones."
      *   *Thesis Check:* Ensure the "Threshold Asymmetry" remains central.

      *(Self-Correction during drafting)*: Wait, the prompt says "action-omission asymmetry... collapses." Standard ethics says omission is less bad than action. The thesis says at high density, omission = action.
      *   *Weakness:* Why discontinuous? Continuous functions are more standard in economics/decision theory. A step function looks suspicious.
      *   *Hope:* No one asks about the "Negative Utilitarian" implication. If suffering prevention is categorical, does eliminating the patients become the primary goal?

  11. **Finalizing the Defense Sheet Structure:**
      *   Header info.
      *   Section 1: Anticipated Objections (Ordered).
      *   Section 2: Concessions.
      *   Section 3: The Critical Reply.
      *   Section 4: The Weakest Point.
      *   Section 5: The Forbidden Question.

  12. **Drafting the Content (incorporating specific constraints):**
      *   *Decision Theorist Objection:* "Measure Problem on the Threshold."
      *   *Longtermist Objection:* "Demandingness/Paralysis."
      *   *Cosmologist Objection:* "Causal Disconnection."
      *   *Genuine Force:* Measure Problem & Causal Disconnection.
      *   *Concession:* Normative, not physical threshold.
      *   *Critical Reply:* The "Aggregation Singularity" (mathematical necessity of the break).
      *   *Weakest Point:* The discontinuity itself (why not sigmoid?).
      *   *Forbidden:* "Does this mandate cosmic sterilization to reduce density?"

  13. **Review against constraints:**
      *   Did I use subgroup vocabulary? Yes.
      *   Did I identify genuine force? Yes.
      *   Did I specify concessions? Yes.
      *   Did I identify the single reply? Yes.
      *   Did I flag the weakest point? Yes.
      *   Did I include the hoped-for-unraised objection? Yes.

  14. **Final Polish:** Ensure the tone is appropriate for a "Speaker's Defense Sheet" (internal notes, strategic).

  *(Self-Correction on "Forbidden Question"):* The prompt asks for the objection I am *hoping no one raises*. This implies it's a devastating critique. The "Cosmic Sterilization" (Negative Utilitarianism) angle is the most dangerous for a suffering-focused view. If preventing suffering is categorical, and existence entails suffering, eliminating existence is the logical conclusion. This undermines the "expansion" governance aspect.

