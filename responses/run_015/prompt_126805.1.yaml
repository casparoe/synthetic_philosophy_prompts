  You are not tracking manipulability. You are tracking **Legibility**.

  Case 1 gave it away. Game theory classifies Plurality as manipulable. You classify it as acceptable because "everyone can see it coming, it's stable." That is not a claim about incentives; it is a claim about **common knowledge**. You are willing to tolerate a lie if it is a stable, public lie. You are unwilling to tolerate a truth if it requires private data to deploy safely (IRV) or if it invites chaotic obfuscation (Borda).

  Your proposed "poll-robustness" clause is the right instinct, but it's too vague. "Within a few points" is a heuristic, not a principle. The underlying value is **Epistemic Accessibility**: can a citizen vote effectively using only the information a democracy *ought* to make public (polls, platforms) versus information that is inherently private (exact preference distributions, coalition secrets)?

  Here is the repaired principle. I have committed to it, tested it, and identified where it forces me to disagree with you.

  ### The Principle of Epistemically Stable Agency

  **Statement:**
  > A voting rule is defective if it creates a strategic incentive that violates **Public Accessibility**, **Expressive Integrity**, or **Participatory Safety**.
  >
  > 1.  **Public Accessibility:** A voter should not require non-public information (beyond sincere preferences and aggregate polling) to identify a ballot that avoids self-harm.
  > 2.  **Expressive Integrity:** The rule should not systematically incentivize ballots that obscure the voter's true preference order in a way that degrades the collective signal (i.e., "burying" is worse than "compromising").
  > 3.  **Participatory Safety:** Sincere participation must never be strictly dominated by abstention.
  >
  > *Baseline Condition:* The rule must aggregate individual ballots into a collective decision (excluding Random Dictator).

  **Motivation Mapping:**
  *   **Clause 1 (Accessibility)** is motivated by **Case 1 (Plurality)** vs. **Case 2 (IRV)**. Plurality strategy is public (vote top-2); IRV strategy is private (know the elimination order). This explains why Plurality passes and IRV fails, despite both being manipulable.
  *   **Clause 2 (Integrity)** is motivated by **Case 3 (Borda)** vs. **Case 4 (Approval)**. Borda demands you lie about intensity/order (burying); Approval asks for a threshold (which *is* part of your preference). This explains why Borda is a "serious strike" while Approval "barely bothers."
  *   **Clause 3 (Safety)** is motivated by **Case 6 (No-Show)**. This is the absolute veto. If voting hurts you, the contract is broken.
  *   **Baseline Condition** is motivated by **Case 5 (Random Dictator)**. If the rule doesn't aggregate, it's not a voting rule.
  *   **Note on Case 7 (Coordination):** This principle focuses on *individual* epistemic access. Coalition vulnerability is a political problem, not a rule defect *under this principle*, provided the individual voter isn't harmed by acting alone. I am explicitly narrowing the scope here.
  *   **Note on Case 8 (Single-Peaked):** Fails Clause 1. Inferring the dimension from ballots requires non-public information about the structure of the electorate.

  ---

  ### Application to New Cases

  Here is the verdict of the **Principle of Epistemically Stable Agency** on your three new cases.

  **1. STAR Voting (Score Then Automatic Runoff)**
  *   **Mechanism:** Score candidates 0–5. Top two by total score advance. Winner is pairwise majority between those two.
  *   **Analysis:**
      *   *Accessibility:* To vote strategically, you need to know who the top two are (public polling). If you know that, you max-score your favorite and min-score the strongest rival. This is poll-robust (Clause 1 pass).
      *   *Integrity:* It incentivizes polarization (5s and 0s) rather than honest scoring. This degrades the "score" signal, turning it into a ranking. This violates Expressive Integrity (Clause 2 fail).
      *   *Safety:* Voting sincerely rarely causes self-harm compared to abstention. (Clause 3 pass).
  *   **Verdict:** **Defective (Moderate).** It passes the Accessibility test (like Plurality) but fails Integrity (like Borda). It is better than IRV (easier to strategize) but worse than Approval (honest scoring is dominated by exaggeration).

  **2. Majority Judgment (Median Grade)**
  *   **Mechanism:** Voters grade candidates (e.g., Excellent to Poor). Winner has the highest median grade.
  *   **Analysis:**
      *   *Accessibility:* Strategy is simple: if you prefer A over B, give A the highest grade and B the lowest, regardless of true intensity. This requires no polling. (Clause 1 pass).
      *   *Integrity:* This is the definition of "burying." It systematically destroys the informational content of the grades. The median becomes a contest of who can grade rivals lowest. (Clause 2 severe fail).
      *   *Safety:* Participation is safe. (Clause 3 pass).
  *   **Verdict:** **Defective (Severe).** Under this principle, Majority Judgment is worse than STAR. It makes the "burying" strategy dominant and poll-independent. It fails Expressive Integrity more catastrophically than Borda because the median is highly sensitive to the distribution of extremes.

  **3. The "Tilted Lottery" (Your Invention)**
  *   **Mechanism:** Approve as many as you like. Top two approval-getters enter a lottery. Odds are tilted by the approval gap (e.g., if A has 60% and B has 40%, A wins 60% of the time).
  *   **Analysis:**
      *   *Accessibility:* To optimize the tilt, you need to know the *margins* between candidates, not just the ranking. Polling error makes this high-risk. If you approve a rival to knock out a worse one, you might change the tilt against your favorite. This requires precise, non-public data. (Clause 1 severe fail).
      *   *Integrity:* Encourages bullet voting (approve only favorite) to maximize tilt, which degrades the approval signal. (Clause 2 fail).
      *   *Responsiveness:* Introduces randomness into the final outcome. While not a Random Dictator, it reduces the causal link between ballot and winner. (Baseline Condition concern).
  *   **Verdict:** **Defective (Fatal).** It fails Accessibility (too much info needed), Integrity (bullet voting), and strains the Baseline (randomness). It combines the worst epistemic burdens of IRV with the signal degradation of Borda.

  ---

  ### Where I Overturn Your Verdict

  I must overturn your verdict on **Case 2 (IRV)**.

  **Your Verdict:** "Counts against IRV — but only mildly."
  **My Verdict:** **Severe Defect.**

  **Why:** You classify it as mild because it requires "much better information to pull off." Under the **Principle of Epistemically Stable Agency**, this is exactly what makes it severe.
  Plurality's manipulation is *public* (Duverger's Law). Everyone knows you should vote for the lesser of two evils. It is a stable equilibrium.
  IRV's manipulation (the "center squeeze" or "push-over") is *opaque*. It depends on the exact distribution of lower-ranking preferences, which are never fully public. A voter cannot know if ranking their favorite first will eliminate their compromise choice until it is too late.
  This violates **Public Accessibility**. A rule that punishes sincerity based on *private* information is more dangerous than a rule that punishes sincerity based on *public* information. The former creates anxiety and unpredictability; the latter creates stable (if cynical) blocs. IRV hides the cost of sincerity until the count is done. That is not "mild"; it is a failure of civic legibility.

  ### Where I Am Least Confident

  **1. The "Poll-Robustness" Clause (Public Accessibility)**
  I am confident this is doing the real work in distinguishing Plurality from IRV, but I am uncertain if "public polling" is a stable enough standard. Polls can be wrong, and in some systems, they are endogenous (the poll affects the vote). If the "public information" is noisy, does the strategy remain "accessible"? I am assuming a threshold of "stable enough to form a convention" (like Duverger's Law) counts as accessible. If that threshold shifts, the verdict on Plurality could flip.

  **2. Responsiveness vs. Aggregation**
  I suspect the **Baseline Condition** (must aggregate) is secretly doing more labor than the Accessibility clause. Case 5 (Random Dictator) is rejected immediately. But consider a rule that is perfectly strategy-proof and accessible but *unresponsive* (e.g., "Status Quo wins unless 90% agree"). My principle catches this under "Aggregation," but it feels distinct from "Legibility." I am confident Responsiveness is a necessary floor, but I am less confident it belongs in the same principle as Epistemic Access. They might be two different axes: *Can I understand it?* vs. *Does it matter?* I have merged them here for unity, but they may be distinct values.

  ### Final Diagnosis

  You asked if you were tracking manipulability. You are not. You are tracking **Civic Legibility**.
  *   **Plurality** is legible (I know why I lost).
  *   **Approval** is legible (I set my own bar).
  *   **IRV** is illegible (I don't know how my ranking interacted with theirs).
  *   **No-Show** is illegible (The system told me to stay home).

  The **Principle of Epistemically Stable Agency** formalizes this. It forgives stable, public lies (Plurality) but punishes private, fragile truths (IRV). It prioritizes a voter's ability to understand the consequence of their ballot over the mathematical purity of the outcome.

  If you accept this, you must accept that IRV is worse than you thought, and that Majority Judgment is likely a trap for preference obfuscation. If you cannot accept that, then your principle is not about Epistemic Access, but about **Outcome Stability**, in which case you should embrace Plurality fully and reject ranked methods entirely. But given your distaste for Borda, I believe Legibility is the true north.
