answer: |-
  **Section 1: The Blindsight and Split-Brain Boundary**

  "Let's start with the neural architecture. In standard Global Workspace Theory, the difference between blindsight and normal vision is the presence of global ignition. In your view, blindsight subjects might actually have phenomenal consciousness in those local recurrent loops, but it's 'shadowed' from the workspace. But here's the problem: functionally, a subject who cannot report a stimulus and a subject who has no experience of a stimulus look identical from the outside. If the local loop is truly isolated from the reporting mechanisms, what empirical marker distinguishes a 'shadowed' conscious state in blindsight from a purely unconscious computational state? And if you say there is no behavioral marker, aren't you just relabeling unconscious processing as 'conscious' without paying the empirical cost?"

  *Follow-up:* "I anticipate the reply that this is a 'framing issue' about how we define reportability. But in split-brain patients, we see disjointed reports suggesting disjointed workspaces. If consciousness is local and isolated, why doesn't the healthy brain look like a split-brain case with hundreds of micro-consciousities? What prevents your view from implying a form of pan-psychism within the skull, and how do you rule that out without appealing to the very global access criteria you're rejecting?"

  **Section 2: The Collapse of Access and Phenomenality**

  "You argue that first-person reports are post-hoc reconstructions where the workspace mistakes local recurrence for widespread access. This suggests our introspective certainty is a systematic error. But if the workspace generates the report without accessing the phenomenal shadow, where does it get the data to reconstruct the content? If the information transfer is lossless enough to generate accurate reports about color or shape, hasn't that information effectively been broadcast, rendering the 'shadow' distinction moot? Or are you committed to the claim that we are fundamentally wrong about the content of our own experience every time we speak about it?"

  *Follow-up:* "Don't retreat into the idea that I'm conflating access and phenomenality. My point is causal. If the shadow doesn't cause the report directly, but the report accurately describes the shadow, you need a mechanism that bridges the isolation without broadcasting. If you posit a 'leak' that allows reconstruction, you've conceded global availability. If you deny the leak, you've made the shadow epiphenomenal. Which horn of the dilemma are you taking, and how do you avoid collapsing phenomenal consciousness into a useless byproduct that plays no role in our claims about having it?"

  **Section 3: Falsification Conditions**

  "Finally, let's talk about risk. A theory that explains away the discrepancy between neural data and reports by calling reports 'reconstructions' is notoriously hard to pin down. So, be specific: What neural or behavioral finding would force you to abandon Shadow Broadcasting? If we find a perfect one-to-one correlation between global ignition patterns (like P300 or late-stage frontal activity) and subjective reports, do you concede? Or will you maintain that the ignition is just the reconstruction mechanism while the 'real' experience happened earlier in isolated loops regardless of that ignition?"

  *Follow-up:* "If your answer is that even perfect correlation doesn't falsify you because the *ontology* is different, then we aren't doing science; we're doing metaphysics. So, give me a condition where the local recurrent loops are present *without* consciousness, or absent *with* consciousness, that is detectable independent of the subject's report. If you can't specify a falsification condition that doesn't rely on the very reports you claim are unreliable, aren't you insulating the theory from any possible refutation?"
