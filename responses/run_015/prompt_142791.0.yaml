      *   *Shadow Broadcasting (SB):* Consciousness = Local Recurrence (isolated). Reporting = Reconstruction by the workspace based on *something else* (maybe traces, maybe inferences), not direct access to the phenomenology.
      *   *Implication:* There is a "shadow" of experience that never sees the light of the workspace, yet we claim we see it. This sounds like a form of illusionism or higher-order theory but grounded in specific neural architecture claims.
