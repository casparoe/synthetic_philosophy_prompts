  ***

  **Note on liberties and orthodoxy:**  
  This punchline takes a significant liberty with Lewisian orthodoxy: it treats the *domain of worlds* as contingent (varying from world to world), whereas Lewis insists the plurality of worlds is necessary and fixed. It also leans on the metaphor of the "stare" as directed at worlds rather than the theory, though the logical point holds. Among Lewisians, **settled doctrine** includes actuality as indexical, the isolation of worlds, and no transworld identity (counterpart theory). **Genuinely contested** issues include whether worlds are concrete or abstract, the nature of modal truthmakers, and—crucially—whether plenitude is necessary (Lewis) or contingent (Cheap Modal Realism). This view is not a consensus position but a deliberate deviation designed to test the limits of indexical actuality.

  \answer{Lewis says the incredulous stare is always mistaken; Cheap Modal Realism says it's only mistaken here, because in the lonely worlds there really are no other worlds to deny.}
