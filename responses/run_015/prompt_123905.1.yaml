answer: |-
  Here is the diagnosis. Your gut is settled because you are operating on a specific, coherent logic, but you keep trying to articulate it using the language of "parental rights" or "worker benefits." That is why the principles feel wobbly. You are not designing a parental benefit; you are designing a **child-centered public utility.**

  Your verdicts are held together by two principles. If you write these down, 9 of your 11 verdicts lock into place immediately.

  ### The Principles

  **1. The entitlement belongs to the child, not the parent.**
  The 3,000 hours are an asset assigned to the newborn to ensure their development, not a wage replacement or a property right of the adults. Parents are *stewards* of this resource, not owners.

  **2. Public funding requires public accountability.**
  Because the money is collective (payroll levy), the state has a duty to ensure the care meets minimum standards. The state can fund care, but it cannot fund unregulated private employment relationships.

  ### How the Principles Drive Your Verdicts

  **Principle 1 (Child Entitlement/Stewardship) does the heavy lifting on:**
  *   **Case 1 & 2 (Father's leave/Blocking Mom's monopoly):** If the hours belong to the child, the child has an interest in bonding with multiple caregivers. Parents cannot collude to monopolize the resource (Mom taking all) because that violates the child's entitlement to diversified care. Use-it-or-lose-it forces the stewardship to be shared.
  *   **Case 6 (No selling):** You cannot sell an entitlement that isn't yours. It is non-transferable between children because it is specific to *this* child's developmental window.
  *   **Case 10 (Pension credits):** If a parent doesn't use the hours, the resource returns to the public pool (via pension credits). This rewards the steward for *not* consuming the public resource, rather than punishing the one who did the work. (This explains your unease in Case 10: the principle creates a perverse incentive where the "best" steward is the one who uses the least care).
  *   **Case 11 (Flat wage):** Since the payment is for the *child's care*, not the *parent's labor market value*, the rate is fixed. It is the price of care, not the price of the carer's previous salary.

  **Principle 2 (Public Accountability) does the heavy lifting on:**
  *   **Case 5 (Unregistered Nanny):** This is the clause you were struggling with. It is not about institutions vs. homes; it is about **inspectability**. The state can verify a nursery's license. The state cannot easily verify the conditions of a private cash-in-hand employment relationship in a home. You are not prejudiced against home care (see Case 3); you are prejudiced against *unmonitored state expenditure*.
  *   **Case 7 (Migrant Worker):** This is where the principle bites you. If the worker has no rights, they cannot be regulated/inspected safely. The principle demands "No." Your gut says "Yes" because you recognize the principle creates a blind spot to reality. This is a genuine contradiction, not a confusion.
  *   **Case 8 (Payroll Levy):** Care is infrastructure. Everyone pays for roads even if they don't drive; everyone pays for care even if they don't have kids.

  ### Where the Principles Break (The Losses)

  You expected to lose Case 5 and 9. Here is why.

  **Case 5 (The Nanny):** Your principle ("Public Accountability") technically allows for a registered childminder working in their own home. If you are banning *all* nannies, you are relying on a hidden third principle: **Kinship Preference.** You trust grandmothers (Case 3) because they are kin, not because they are regulated. Your written principles cannot defend banning a registered nanny while allowing a grandmother, unless you explicitly write "Kinship care is exempt from regulation." If you don't write that, you are being inconsistent.

  **Case 9 (Job Protection):** This is the biggest fracture.
  *   *Principle 1* says care is a public good.
  *   *Your Verdict* says private employers must hold the job.
  *   *The Conflict:* If care is a public good (like health or schools), the *state* should bear the cost of the absence (e.g., state pays for a temp), not the private firm. A six-person startup cannot absorb eighteen months of dead weight without risking the business. Your verdict wants the security of a public utility with the cost structure of a private benefit. The principle suggests the state should insure the job, not the employer. You cannot defend obligating a small firm to hold a job for 18 months under the "Public Good" principle without admitting you are prioritizing worker security over business viability.

  ### The Three New Tests

  Here is how the principles run on your new cases:

  **1. A parent who wants to draw hours to look after a seven-year-old over the summer.**
  *   **Verdict:** **No.**
  *   **Reasoning:** Principle 1 (Child Entitlement). The account is for *early development* (0–5). Once the child turns five, the entitlement expires (converts to pension). The policy is designed to cover the pre-school care gap, not general parenting. Extending it dilutes the intensity of the resource for the critical window.

  **2. Someone who wants to draw hours to care for their own elderly mother.**
  *   **Verdict:** **No.**
  *   **Reasoning:** Principle 1 (Child Entitlement). The hours are assigned to the *child*, not the family unit. They are not transferable to elder care. To allow this would violate the "non-transferable" rule (Case 6) and turn the child's development fund into a general family care voucher.

  **3. A couple who split the account fifty-fifty but both keep working three days a week, drawing hours on the other two.**
  *   **Verdict:** **Yes (This is the ideal).**
  *   **Reasoning:** This satisfies both principles. It respects the Child Entitlement (the child gets care) and the Stewardship model (both parents share the duty). It utilizes the flat wage (Case 11) to top up income without replacing it entirely. This is the behavioral outcome your "use-it-or-lose-it" rules (Case 1) are trying to engineer.

  ### The Paragraph

  Here is the text you can put at the top of your chapter. It is written to defend the verdicts you have, while implicitly masking the tension on the nanny/small-firm issues until you are ready to tackle them.

  > "This chapter proceeds from the premise that early care is a public investment in the child's development, not a private subsidy for parental income or career management. The care-time account is an entitlement assigned to the child, administered by parents as stewards rather than owners. Consequently, the resource is non-transferable between families and cannot be converted into cash, ensuring that public funds are spent on care rather than income replacement. While the state funds the care-wage universally to value the labor equally regardless of who performs it, public expenditure necessitates public accountability; funded care must therefore be delivered within a regulated framework that guarantees safety and standards. The system is designed to encourage the distribution of care labor across multiple caregivers, recognizing that the child's interest is best served by shared stewardship rather than a single primary provider."

  **Why this works:**
  *   "Public investment... not private subsidy" kills the selling of hours (6) and justifies the flat wage (11).
  *   "Administered... as stewards rather than owners" justifies blocking the mother from taking all hours (2) and the use-it-or-lose-it rules (1).
  *   "Public expenditure necessitates public accountability" justifies banning the unregistered nanny (5) while allowing nurseries.
  *   "Shared stewardship" justifies the pension credits for leftovers (10) and the father's quota (1).

  **What it hides:**
  It glosses over the Grandmother exception (Case 3) by saying "regulated framework" (you will have to define kinship as a regulated exception later). It also ignores the employer cost (Case 9) by focusing only on the state's funding role. You will have to fight that battle in the implementation section, not the principles section.
