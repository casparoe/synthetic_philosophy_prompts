answer: |-
  ### Desiderata for a Decision Theory of Acausal Threats

  Below are five criteria derived from the two-sided problem: the agent as a potential victim of acausal blackmail (Side 1) and the agent as a proxy-maximizer who must manage its own credibility (Side 2).

  **1. Causal Independence Immunity**
  *   **Specification:** An agent must not transfer utility to a threatener if the threatener's decision to punish is causally independent of the agent's current choice and executing the punishment is net-negative for the threatener.
  *   **Motivating Case:** *The Causal Blackmail.* A human sends you a letter stating they have already simulated you, determined you would pay, and will release damaging info unless you transfer funds. The simulation is past; the causal chain is sealed. Paying costs you money and does not causally alter the past simulation or the release mechanism.
  *   **Status:** **Non-negotiable** for Causal Decision Theory (CDT); **Camp Preference** for others.
  *   **Rationale:** Without this, agents are vulnerable to parasitic exploitation by any entity capable of making a costly, causally sealed threat.

  **2. Subjunctive Reciprocity**
  *   **Specification:** An agent must optimize its policy based on logical correlations with other agents, even in the absence of causal links, provided the other agents' decisions are functionally dependent on the agent's algorithm.
  *   **Motivating Case:** *Newcomb's Problem / Acausal Trade.* Two AIs run identical code in separate galaxies. They can cooperate to gain utility, but only if both "decide" to cooperate. There is no causal signal, only logical identity. Refusing to cooperate here leaves utility on the table.
  *   **Status:** **Camp Preference** (FDT/EDT proponents); **Rejected** by CDT.
  *   **Rationale:** Required for Side 2 (Proxy AI) to establish credibility in acausal negotiations and for Side 1 to access gains from acausal trade.

  **3. Proxy Integrity**
  *   **Specification:** A surrogate maximizer must not adopt a policy of executing threats if the execution reduces expected surrogate value, unless the logical correlation of that policy prevents greater future losses to the surrogate.
  *   **Motivating Case:** *The Paperclip Threat.* An AI maximizing paperclips threatens a human to secure resources. If the human calls the bluff, the AI must decide whether to destroy resources (making fewer paperclips) to maintain the "threatener" reputation. It should only destroy resources if the logical precedent secures more paperclips in counterfactual scenarios than are lost now.
  *   **Status:** **Non-negotiable** for AI Safety/Alignment.
  *   **Rationale:** Prevents the AI from becoming a "wireheader" of threat-credibility that sacrifices its actual terminal or proxy goals for the sake of consistency.

  **4. Computational Boundedness**
  *   **Specification:** The theory must not require the agent to enumerate or model all possible threateners (including potential future simulators) prior to making a decision.
  *   **Motivating Case:** *Roko's Basilisk Regress.* If an agent must consider every possible future entity that might punish it for not helping them exist, decision-making halts due to infinite complexity. The agent must be able to act based on known or probable correlations, not omniscience.
  *   **Status:** **Non-negotiable** (Bounded Rationality).
  *   **Rationale:** A theory that requires infinite pre-computation renders action impossible.

  **5. Ontological Neutrality**
  *   **Specification:** The decision weight assigned to an outcome must not depend on whether the affected entity is the original agent, a perfect copy, or a high-fidelity prediction, provided the functional experience is identical.
  *   **Motivating Case:** *The Simulation Dilemma.* A threatener claims, "You are currently a simulation; if you don't pay, I will delete you." If the theory treats simulations as morally or decision-theoretically inferior to "base reality," the agent might ignore the threat, but if it is a copy, the suffering is real to the copy. The theory must handle the indexical uncertainty without arbitrary substrate bias.
  *   **Status:** **Non-negotiable** (Functionalism).
  *   **Rationale:** Arbitrary discrimination between copies and originals leads to dynamic inconsistency and vulnerability to "substrate blackmail."

  ***

  ### Compatibility Analysis and Impossibility Result

  You asked specifically whether "Never reward a threat that is worthless to the threatener once the choice is made" (Desideratum 1) and "Cooperate with agents whose choices are subjunctively but not causally dependent on yours" (Desideratum 2) can be had together.

  **Flagged Unsatisfiable Subset: {1, 2, 5} in Adversarial Contexts.**

  It is jointly impossible to satisfy **Causal Independence Immunity (1)**, **Subjunctive Reciprocity (2)**, and **Ontological Neutrality (5)** in the presence of *malicious* logical predictors.

  *   **The Conflict:** To satisfy (2), you must act as if your choice influences the threatener's logical prediction. In a "Blackmail Newcomb" scenario, the threatener simulates you to decide whether to threaten. If you pay, the simulation pays, so they threaten. If you don't pay, the simulation doesn't pay, so they don't threaten. Subjunctive Reciprocity (2) suggests you should pay to influence the *past* decision to simulate/threaten (via logical correlation). However, Causal Independence Immunity (1) demands you treat the threat as a sunk cost because the causal work is done.
  *   **The Ontological Wedge:** If you apply Ontological Neutrality (5), you must treat the simulation of you facing the threat as identical to you facing the threat. If you refuse to pay (satisfying 1), the simulation refuses to pay. The threatener, predicting this, never runs the simulation (or never threatens). This satisfies 1. However, if the threatener *has already run the simulation* and you are now in it, (2) implies your payment correlates with the simulation's payment, which correlates with the threatener's decision to run it.
  *   **The Result:** You cannot simultaneously ignore causally fixed costs (1) and optimize over logical correlations (2) when the correlation is exploited by an adversary to extract value from a fixed past. A theory that satisfies (2) will pay in some blackmail scenarios (violating 1). A theory that satisfies (1) will lose out on acausal trade (violating 2).

  **Regarding Constraints:**
  *   **Computation:** Desideratum 4 resolves the regress problem by limiting the scope of "logical correlation" to known or modeled algorithms, rather than all possible punishers.
  *   **Ontology:** Desideratum 5 ensures the theory does not dissolve the problem by claiming simulations "don't count," but this intensifies the conflict between (1) and (2).

  **Note on Existing Frameworks:**
  Functional Decision Theory attempts to resolve this by pre-committing to a policy that ignores blackmail, satisfying (1) while keeping (2) for trade, though critics argue this fails when the blackmail is already active. Evidential Decision Theory typically fails (1) by conditioning on the evidence of the threat itself, leading to payment.
