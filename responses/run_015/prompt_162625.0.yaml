  **PHILOSOPHY OF MIND: FINAL SEMINAR ASSESSMENT**

  **Time Allowed:** 90 minutes
  **Word Limit:** 1200 words maximum
  **Instructions:** Answer the question below. Do not use citations, bibliographies, or reading lists. Marks will be deducted for exceeding the word limit.

  ***

  **Question**

  Consider the claim that pain is essentially bad. To evaluate this, examine the following two stipulated cases involving subjects with identical lesions to the pain-processing pathways.

  **Case One: Dana**
  Dana retains the full sensory-discriminative profile of pain. She locates pinpricks to within a millimetre, distinguishes burning from stabbing, and ranks stimuli by intensity more accurately than controls. She retains the withdrawal reflex and learns to avoid paired stimuli. However, during stimulation, she never asks for it to stop, takes no analgesics, and reports that while the sensation feels exactly like pain feels to others, it does not bother her and she would be happy for it to continue indefinitely.
  Uniquely, Dana's dissociation is temporal. Ten minutes before a known trial, she is measurably anxious, offers to pay to cancel it, and says she is dreading it. Immediately afterwards, she says the event was horrible and she is glad it is over. She insists that *during* the stimulation, however, it was not unpleasant. Stipulate that she suffers no generalised anxiety disorder and no memory impairment.

  **Case Two: Theo**
  Theo retains the same sensory profile and the same affective profile as a normal subject. During stimulation, he rates the pain nine out of ten, calls it awful, and reports it is exactly as unpleasant as usual. However, he has lost every inclination to do anything about it. There is no withdrawal, no reaching for analgesics, and he reports no desire whatsoever for the pain to stop. He will sit still indefinitely despite reporting severe suffering.

  **Task:**
  Distinguish between at least two different senses in which pain might be considered 'essentially bad' (for example, phenomenal versus motivational). Argue which of the two cases, if either, successfully undermines each sense. Conclude whether pain is essentially bad, all things considered.

  ***

  **MODEL ANSWER**

  The claim that pain is essentially bad is ambiguous. It typically conflates two distinct assertions: phenomenal essentialism and motivational essentialism. Phenomenal essentialism holds that unpleasantness is an intrinsic property of the pain experience itself; to feel pain is, necessarily, to suffer. Motivational essentialism holds that pain necessarily provides a reason or desire to cease the experience; to feel pain is, necessarily, to be motivated against it. The cases of Dana and Theo demonstrate that neither sense holds up under scrutiny, suggesting that badness is contingent rather than essential to pain.

  Dana's case directly targets phenomenal essentialism. Standard accounts suggest pain consists of a sensory component (location, intensity) and an affective component (unpleasantness). Dana shows these are dissociable. She possesses the sensory qualia identical to normal pain but lacks the immediate unpleasantness. Crucially, she reports that during the event, it does not bother her. If pain were essentially bad in the phenomenal sense, this report would be impossible; the sensation itself would compel suffering. Dana proves that the sensory state can exist without the immediate affective tone that constitutes "suffering." Therefore, phenomenal essentialism is false. The "badness" is not intrinsic to the sensory qualia.

  However, Dana's case is complicated by her anticipatory and retrospective attitudes. She dreads the pain before and evaluates it as horrible after. This suggests that while the *immediate experience* lacks unpleasantness, the *state* is still categorized as bad by her cognitive systems. This does not save phenomenal essentialism, but it indicates that "badness" might be a higher-order evaluation rather than a first-order feel. The badness is attributed to the event narratively, not experienced phenomenally during the nociception. This reinforces the view that unpleasantness is not essential to the sensation itself, but is often attached to it by memory and anticipation.

  Theo's case targets motivational essentialism. Theo reports the full unpleasantness of pain—he suffers exactly as a normal subject does—but lacks the motivation to stop it. Internalists about reasons argue that feeling pain necessarily provides a reason to avoid it. Theo falsifies this. He feels the awfulness but possesses no desire for cessation. If pain were essentially bad in the motivational sense, the unpleasantness would logically entail a conative push to escape. Theo demonstrates that the link between suffering and motivation is contingent. One can suffer without being moved to act. This severs the conceptual tie between pain's unpleasantness and its functional role in avoidance.

  Combining these findings, we see that the "badness" of pain is not a single essential property. Dana shows the experience can exist without immediate suffering. Theo shows the suffering can exist without motivation. A defender of essentialism might argue that Theo is not truly feeling pain if he lacks the motivation, or that Dana is not feeling pain if she lacks the suffering. But this is merely terminological stipulation. Both subjects possess the sensory discrimination and the neural architecture of pain. To define pain by its badness is to ignore the empirical reality that the components come apart.

  Therefore, pain is not essentially bad. The sensory state is real in both cases, but the normative and affective weights are contingent additions. Pain is essentially a sensory-discriminative state that typically, but not necessarily, recruits affective and motivational systems. The "badness" is a functional role that pain usually plays, not a metaphysical necessity of the experience itself. Recognizing this distinction prevents us from conflating the feeling of pain with the suffering it usually causes, allowing for a more precise understanding of mind-body dissociations.

  ***

  **MARKING SCHEME**

  **Total Marks: 25**

  **1. Distinction of Senses (5 marks)**
  *   **Award:** Clear distinction between phenomenal badness (unpleasantness/suffering) and motivational/normative badness (reason-giving force/desire to stop).
  *   **Common Error:** Treating "badness" as a single monolithic concept or conflating unpleasantness with sensory intensity.
  *   **A vs B:** An A answer defines the two senses explicitly as competing essentialist claims; a B answer mentions them but treats them as loosely related observations.

  **2. Analysis of Dana (Phenomenal) (5 marks)**
  *   **Award:** Correctly identifies that Dana refutes phenomenal essentialism because the sensory qualia exist without immediate unpleasantness.
  *   **Common Error:** Claiming Dana proves pain is only sensory, ignoring her report that it feels like pain but doesn't bother her.
  *   **A vs B:** An A answer explains why the *immediate* lack of bothering matters for essentialism; a B answer simply notes she feels no pain.

  **3. Analysis of Dana (Temporal) (5 marks)**
  *   **Award:** Addresses the anticipatory/retrospective anxiety. Notes that badness is attributed cognitively/narratively rather than experienced phenomenally during the event.
  *   **Common Error:** Ignoring the temporal stipulation or claiming it contradicts her immediate report.
  *   **A vs B:** An A answer uses this to refine the location of "badness" (higher-order vs first-order); a B answer treats it as a confusion or ignores it.

  **4. Analysis of Theo (Motivational) (5 marks)**
  *   **Award:** Correctly identifies that Theo refutes motivational essentialism because unpleasantness exists without the desire to stop.
  *   **Common Error:** Assuming Theo is lying or that unpleasantness logically entails motivation by definition.
  *   **A vs B:** An A answer explicitly severs the link between affect and conation; a B answer suggests Theo's case is less significant than Dana's.

  **5. Final Verdict on Essentialism (5 marks)**
  *   **Award:** Commits to a conclusion (e.g., pain is not essentially bad) based on the synthesis of both cases.
  *   **Common Error:** Hedging indefinitely or concluding that pain is essentially bad despite the counter-evidence.
  *   **A vs B:** An A answer argues that "badness" is a contingent functional role; a B answer concludes vaguely that it depends on how we define pain.
