      *   *Al-Ghazali:* 11th-century Islamic theologian/philosopher. *The Incoherence of the Philosophers* (Tahafut al-Falasifa). Critique of Avicennan/Aristotelian necessary causation.
      *   *Occasionalism:* Created things don't have causal power; God creates every event at every moment. "Custom" (*'adah*) replaces "Nature."
