      *   **Task:** Check if this problem is fatal. What survives? Is there a non-question-begging sense of value-neutrality? Does the IM retain a job distinct from a complete utility function?
      *   **Constraints:** Open with the bottom line in the first sentence. No preamble. Do not restate the question.

  2.  **Evaluate the User's Argument:**
