      *   **Regularization vs. Replacement:** IMs are rarely used alone. They are penalty terms ($R - \lambda \cdot \text{Impact}$). They don't need to be perfect; they just need to be cheap proxies for "don't break things we didn't tell you about." A complete utility function is hard to specify; an IM is a heuristic safeguard.
      *   **The "Job" Remaining:** The job is handling *incomplete* specifications. A complete utility function theoretically solves low-impact issues (if it values nothing else, don't touch it). But we don't have complete utility functions. IMs fill the gap between "maximize X" and "don't destroy the world while maximizing X."
