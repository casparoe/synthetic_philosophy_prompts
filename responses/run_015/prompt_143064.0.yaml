answer: |-
  Here's a breakdown comparing Williams and Appiah on the end of dueling, plus that third angle you mentioned. I've tried to keep the settled history separate from the philosophical heavy lifting, since that distinction is pretty important for your dataset.

  ### The Settled Stuff vs. The Contested Stuff

  First, the history: It's pretty settled that the "duel of honor" (specifically among gentlemen in the UK and US) tanked during the 19th century. In the 1700s, it was common; by 1900, it was basically dead or purely ceremonial. Laws against it existed way earlier (like in the 1800s in Britain), but they weren't really enforced until later. So the *what* and *when* are clear.

  The *why* is where the philosophers and historians fight. Some say it was the state taking a monopoly on violence (Elias). Some say it was religious revival. But regarding the moral psychology of it, Williams and Appiah offer different flavors of explanation that reject the idea that people just read a pamphlet and went, "Oh, killing people is irrational, I'll stop."

  ### Bernard Williams: The Shift in Ethical Identity

  Williams doesn't write a specific case study on dueling the way Appiah does, but his framework in *Shame and Necessity* and *Ethics and the Limits of Philosophy* applies heavily here.

  For Williams, modern moral philosophy (Kant, Utilitarianism) tries to explain change through rational argument—like convincing someone that dueling violates the Categorical Imperative. Williams thinks that's bogus. He argues that moral life is rooted in **shame** and **identity**, not just guilt or obligation.

  Applied to dueling: A 18th-century gentleman didn't duel because he calculated it was "good." He duelled because *not* dueling meant he wasn't a gentleman. His social existence depended on it. The revolution happened when the concept of the "gentleman" itself shifted.

  Williams would say the end of dueling wasn't about people being convinced it was *wrong* in the abstract. It was about the social audience changing. When the people whose opinion mattered (the public, the crown, the church) started viewing duellists not as brave defenders of honor but as reckless thugs, the shame mechanism flipped. You stopped dueling because you wanted to avoid the shame of being seen as outdated or barbaric, not because you were rationally persuaded by an anti-violence argument. The "ethical identity" of the elite changed, and the practice died because it no longer fit the person they wanted to be.

  ### Kwame Appiah: The Clash of Codes

  Appiah, specifically in *The Honor Code*, actually uses the end of dueling as his prime example. He agrees with Williams that rational argument alone doesn't work. But he gets more specific about the *mechanism* of the shift.

  Appiah argues that honor codes are social tools. They regulate behavior. Change happens when an honor code comes into tension with **other interests or beliefs people already hold**.

  In the 19th century, the "honor code" (defend your reputation with a pistol) started clashing with:
  1.  **Religious beliefs:** Evangelical revivals made violence seem sinful.
  2.  **Professional interests:** As the bureaucracy and military professionalized, officers were told dueling was bad for discipline.
  3.  **National identity:** It started being framed as "un-British" or "un-American" to rely on private violence instead of the rule of law.

  Appiah's point is that people didn't drop dueling because they lost their sense of honor. They dropped it because keeping their honor *required* them to stop dueling to satisfy these other commitments. A Christian gentleman couldn't be a good Christian *and* a duelist. Since being a "good Christian" became more central to their identity than the specific ritual of the duel, the duel got cut. It's a realignment of values, not an abandonment of honor.

  ### Comparison: Where they diverge

  *   **Williams** focuses on the **phenomenology of shame**. The change is internal to the ethical identity. The "gaze" of the other changes, so the shame changes. It's a bit more atmospheric—the whole social world feels different.
  *   **Appiah** focuses on the **structural clash**. He treats honor more like a system that interacts with other systems (religion, career, law). He's more willing to say "interests" matter, whereas Williams is wary of reducing ethics to interests.

  Both agree: Rational argument (e.g., "dueling is inefficient") didn't kill dueling.
  Both disagree on: How much weight to give "interests." Appiah says the clash with practical interests/beliefs is the engine. Williams says the shift in what counts as a shameful identity is the engine.

  ### The Third Angle: Technical Necessity and Status

  Now for that niche angle: *"Once a social practice stops being technically necessary for maintaining status, it becomes vulnerable to moral condemnation."*

  This suggests that dueling ended because other ways to signal status (wealth, education, political connections) became more effective, making the sword redundant. Once it was redundant, people could afford to call it "immoral."

  **Does this line up?**

  *   **With Appiah:** Yes, fairly well. Appiah explicitly talks about interests. If dueling is no longer "technically necessary" for your career or status, then the *cost* of keeping the practice goes up while the *benefit* goes down. This creates the "clash" Appiah talks about. If you can maintain status *without* risking death, the religious/moral objection to killing becomes weightier. So this angle feels like a subset of Appiah's "interests" argument.
  *   **With Williams:** It's a bit outside his lane. Williams is less concerned with the "technical necessity" of a practice for status climbing and more concerned with the **integrity of the self**. For Williams, even if dueling wasn't necessary for status, a person might still do it if their internal sense of shame demanded it. However, he would agree that if the practice no longer sustains the *identity*, it becomes vulnerable. But the "technical necessity" framing is a bit too functionalist/materialist for Williams, who cares more about the psychological experience of shame than the utility of status maintenance.

  **Verdict on Third Angle:** It sits closer to Appiah but adds a materialist/functionalist layer that neither philosopher fully emphasizes. Appiah talks about beliefs clashing; this angle talks about *utility* fading. It suggests moral condemnation is a luxury that comes after a practice becomes obsolete, which is a bit more cynical than both philosophers (who think the moral shift is part of the obsolescence, not just a result of it).

  ### Summary for the Dataset

  *   **Settled:** Dueling declined in the 19th century despite laws; rational arguments alone didn't stop it earlier.
  *   **Williams:** Change happened because the "shame" associated with *not* dueling vanished. The ethical identity of the gentleman shifted.
  *   **Appiah:** Change happened because the honor code clashed with other values (religion, profession). People kept their honor by dropping the duel.
  *   **Third Angle:** Suggests status mechanisms became more efficient without violence. Aligns mostly with Appiah's "interests," but is more functionalist than either philosopher.
  *   **Contestation:** Historians still debate how much was top-down (state enforcement) vs bottom-up (cultural shift). Philosophers debate whether "honor" is a positive force for change (Appiah) or something that needs to be understood phenomenologically (Williams).

