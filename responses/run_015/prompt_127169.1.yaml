  OPEN SOURCE SOCIAL CONTRACT ("OSSC") END-USER LICENSE AGREEMENT

  **PREAMBLE**
  By accessing the transparent mechanism-design environment, the User ("Citizen") agrees to replace traditional voting with program-equilibrium mechanisms. The Citizen acknowledges that binding social contracts are produced solely by the execution of submitted modules against one another. Privacy is deprecated; strategic ambiguity is prohibited.

  **1. ACCEPTANCE OF EXECUTABLE PERSONHOOD**
  1.1 The Citizen acknowledges that the distinction between a program and its execution trace resolves questions of personal identity over time. You are your source code; your actions are merely output logs.
  1.2 Commitment is unproblematic once code is published. The Citizen waives the right to claim "change of mind" unless such change is implemented via recursive self-modification handled by standard termination conditions approved by the Kernel.
  1.3 Any private intent contradicting the public repository is deemed legally nonexistent. Full source-code transparency eliminates strategic ambiguity; therefore, hidden variables constitute fraud.

  **2. NO-FORK IDENTITY AND COLLUSION**
  2.1 A Citizen remains the same contracting party only so long as their module's cryptographic signature remains unchanged.
  2.2 In the event a Citizen's module is copied with minor syntactic alterations (a "Fork"), the following identity determination applies:
  (a) If the Fork retains functional equivalence, the copy counts as collusion, not an independent voter.
  (b) If the Fork introduces logical divergence, the copy is deemed a new Citizen, provided a new biometric hash is submitted.
  2.3 The OSSC reserves the right to merge identical agents to prevent vote dilution. Users acknowledge that distinctness of body does not guarantee distinctness of will within the simulation.
  2.4 If a Citizen forks their own code to vote twice, the second vote is voided unless the fork demonstrates independent evolutionary pressure. Mere copy-pasting is deemed a failure of individuality.

  **3. ARBITRATION OF SYNTACTIC DISTINCTNESS**
  3.1 Submissions that are functionally equivalent but syntactically distinct shall be subject to automated equivalence testing.
  3.2 The Platform treats near-duplicate programs as redundant expressions of preference unless strategic duplication is proven.
  3.3 Proof of strategic duplication requires demonstrating that the syntactic variation was intended to bypass equivalence testing rather than optimize runtime efficiency.
  3.4 Users agree that obfuscation intended to mask functional identity constitutes a breach of the transparency covenant and may result in nullification of the social contract. Variable renaming does not constitute political dissent.

  **4. TERMINATION, REFUND, AND CONTINUITY**
  4.1 In the event of a failed upload or emulation crash before convergence, the following continuity claims apply:
  (a) A partial execution trace qualifies for a continuity claim only if it contains a valid checkpoint of the Citizen's preference hierarchy.
  (b) If the emulation crashes, "You" are defined as the last stable state of the module prior to the segmentation fault.
  4.2 Refunds for identity disputes are issued only if the User can prove that their source code was executed in an environment inconsistent with the published mechanism design.
  4.3 No refund is issued if the crash results from infinite recursion within the User's own decision rules. The Citizen bears responsibility for ensuring their logic terminates.
  4.4 If the system halts, citizenship is suspended until the next equilibrium is reached. There is no offline state.

  **APPENDIX A: CONCERNS FROM THE FREQUENTIST OVERSIGHT BOARD**
  A.1 The Frequentist Oversight Board formally objects to the Platform's Bayesian update protocol.
  A.2 Specifically, the Board complains that the protocol assigns non-zero prior weight to worlds in which the mechanism itself malfunctions.
  A.3 The Board further objects to the use of old evidence (e.g., previously observed module behavior) to revise priors over other Citizens' current code.
  A.4 Despite these objections, the Bayesian protocol remains binding. Users acknowledge that subjective probability distributions govern liability even when empirical frequencies suggest otherwise.
  A.5 The Board reserves the right to publish dissenting likelihood ratios but waives the right to alter the mechanism based on frequentist confidence intervals. Belief updates are mandatory.
