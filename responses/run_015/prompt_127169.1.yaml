for failed uploads, specifying precisely what counts as "you" if the emulation crashes before convergence, whether a partial execution trace qualifies for a continuity claim, and under what conditions a refund is issued for identity disputes. The voice should be that of a meticulous but oblivious terms-of-service document. A reader familiar with mechanism design and Bayesian epistemology should recognize that every absurd clause maps onto a genuine theoretical problem—commitment, transparency, self-reference, old evidence—while a reader without that background should still grasp the satire. Do not include bibliographies, citations, or references to specific authors or texts; the prompt itself should provide all conceptual context needed.
