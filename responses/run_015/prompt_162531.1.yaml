answer: |-
  ### Part 1: Brainstorming Mechanics

  Here are six mechanics I considered for this session, with the rationale for why I'm discarding five of them.

  1.  **Veil of Ignorance Auction:** Students bid on social positions (Rich/Poor) before knowing who they will be.
      *   *Drop:* This tests risk aversion and insurance, not the intrinsic value of equality or the levelling-down objection.
  2.  **Simple Majority Voting:** Students vote on whether to redistribute from Rich to Poor.
      *   *Drop:* Devolves into bargaining power and coalition-building (political science) rather than testing the logic of the moral principle itself.
  3.  **Gini Coefficient Calculation:** Students calculate inequality metrics for different distributions.
      *   *Drop:* The arithmetic is too heavy for an 80-minute seminar; it turns a moral intuition pump into a math tutorial.
  4.  **Negotiated Treaty:** Groups negotiate a redistribution agreement before chips are dealt.
      *   *Drop:* Focuses on consent and contract theory (Hobbes/Locke) rather than distributive patterns (Utilitarianism/Egalitarianism).
  5.  **Blind Redistribution:** I take chips and redistribute them according to a secret rule, and they guess the rule.
      *   *Drop:* Removes student agency; they need to *commit* to a rule to feel the sting of its consequences.
  6.  **The "Leak & Burn" Simulation (Selected):** Students draft a scoring rule, engage in lossy transfers, and face a destruction mechanism.
      *   *Keep:* This directly forces the trade-off between total welfare and equality, and allows for a mid-game rule revision to model the shift from Egalitarianism to Prioritarianism.

  ---

  ### Part 2: The Simulation Plan ("The Distribution Game")

  **Materials List**
  *   **Poker Chips:** 500 count (two colors helps, but one is fine).
  *   **Index Cards:** 16 cards, pre-marked with endowment values (see below).
  *   **Envelopes:** 16 small envelopes to hold the cards (keeps endowments private initially).
  *   **The "Burn Box":** A small opaque box or bowl with a slit in the top (label it "Social Stability Fund" to make it sound bureaucratic).
  *   **Whiteboard & Markers:** 3 colors (Black for rules, Red for warnings, Blue for scores).
  *   **Timer:** Visible to the class.

  **Setup & Endowments (The "Luck" Phase)**
  *   **Class Size:** 16 Students.
  *   **Endowment Distribution:**
      *   4 Students (The Poor): **10 Chips** each.
      *   8 Students (The Middle): **30 Chips** each.
      *   4 Students (The Rich): **50 Chips** each.
      *   *Total Chips in Play:* 480.
  *   **Assignment:** Hand out envelopes randomly as students enter. Tell them: *"Do not open until I say. These numbers were generated by a random number generator. They reflect luck, not merit, status, or anything about you."*

  **The Rules (Write these on the Board)**

  **Phase 1: The Egalitarian Constitution (Minutes 10–40)**
  1.  **Goal:** Maximize the **Social Score (S)**.
  2.  **Initial Rule (Drafted by Class):** I will guide them to write this if they stall: *$S = \text{Total Chips} - (\text{Highest Stack} - \text{Lowest Stack})$*.
      *   *Translation:* We value total chips, but every point of inequality subtracts directly from the score.
  3.  **Transfer Rule:** You may give chips to anyone. **Leak Rate: 50%.** (If you give 10, they receive 5. The rest vanishes).
  4.  **The Box:** You may put chips in the Box. **Leak Rate: 100%.** (They vanish completely).

  **Phase 2: The Prioritarian Revision (Minutes 40–65)**
  1.  **Goal:** Maximize the **Weighted Social Score (W)**.
  2.  **New Rule:** *$W = \sum (\text{Chips Held} \times \text{Weight})$*.
  3.  **Weighting:**
      *   If a student has **0–20 Chips**: Weight = **2.0**.
      *   If a student has **21+ Chips**: Weight = **1.0**.
  4.  **Transfer Rule:** Leak Rate remains 50%.
  5.  **The Box:** Forbidden in this round (destruction never helps the Weighted Score).

  **Minute-by-Minute Timeline (80 Minutes)**

  *   **00:00 – 00:10: Setup & Endowments.**
      *   Hand out envelopes. Students count chips silently.
      *   **Instructor Script:** *"You are a society. You have resources. You have inequality. Your job is to agree on how to measure whether your society is 'good.' I am not the judge; the formula you write is the judge."*
  *   **00:10 – 00:20: Constitution Drafting.**
      *   Ask: *"Utilitarianism says maximize total chips. But we know that ignores distribution. Write a formula that cares about fairness."*
      *   Steer them toward the **Egalitarian Rule** ($S = \text{Total} - \text{Gap}$). Write it in Black.
      *   *Check:* Ensure they understand that reducing the Gap increases $S$, even if Total drops.
  *   **00:20 – 00:35: Round 1 (Transfers).**
      *   Allow 10 minutes of trading. Remind them of the 50% leak.
      *   **Instructor Script:** *"Every transfer costs society chips. Is it worth it to close the gap?"*
      *   At 00:30, freeze trading. Calculate $S$ on the board.
  *   **00:35 – 00:45: Round 2 (The Box / The Trap).**
      *   **Instructor Script:** *"Look at the Rich students. They still have more than the Poor. The formula penalizes that gap. You can fix it by transferring (costly) OR by using the Box (destroying Rich chips)."*
      *   Ask for a vote: *"Who wants to put Rich chips in the Box to lower the Gap?"*
      *   If they do it: Calculate new $S$. It will likely be higher than before, even though fewer chips exist.
      *   **Stop.** Do not comment on the morality yet. Let the silence sit.
  *   **00:45 – 00:50: Break & Rule Revision.**
      *   5-minute bio break.
      *   **Instructor Script:** *"That result felt wrong. Destroying value helps no one. Let's rewrite the Constitution. Instead of punishing inequality, let's help the worse off."*
      *   Write the **Prioritarian Rule** (Weights) on the board.
  *   **00:50 – 01:05: Round 3 (Priority & Sacrifice).**
      *   Reset chips to original endowments (10/30/50) to save time, or continue from current state (reset is cleaner for math). Let's **Reset** for clarity.
      *   **Scenario:** A Poor student (10 chips) needs 1 more chip to reach 11.
      *   **The Trap:** To get 1 chip to the Poor student (Weight 2.0), a Rich student must give 2 chips (due to 50% leak).
      *   **The Extreme Trap:** Ask: *"What if a Poor student has 19 chips. A Rich student has 50. To get the Poor student to 20 (gaining 1 chip, Weight 2.0), the Rich student must give 20 chips (losing 20, Weight 1.0)."*
      *   Wait, the math needs to be sharp here.
      *   *Correction for Round 3:* Set up a specific proposed transfer. *"Student A (19 chips) vs Student B (50 chips). If B gives 20 chips, A receives 10. A goes 19->29. B goes 50->30."*
      *   *Better Trap:* Keep the threshold at 20.
      *   *Scenario:* Poor Student has 19. Rich Student has 50.
      *   Transfer: Rich gives 2 chips. Poor gets 1 (due to leak).
      *   Poor: 19 -> 20 (Weight changes 2.0 to 1.0? No, that's Sufficiency. Let's stick to Priority for the main run).
      *   *Priority Trap:* Poor has 10 (Weight 2). Rich has 50 (Weight 1).
      *   Transfer: Rich gives 10 chips. Poor gets 5.
      *   Gain: 5 chips * 2.0 = +10 Points.
      *   Loss: 10 chips * 1.0 = -10 Points.
      *   Net: 0.
      *   *The Kicker:* Rich gives 12 chips. Poor gets 6.
      *   Gain: 6 * 2 = +12. Loss: 12 * 1 = -12. Net 0.
      *   *Wait, I need the Priority view to WIN but feel uncomfortable.*
      *   *Revised Priority Rule:* Weight for Poor (0-20) is **3.0**. Weight for Rich (21+) is **1.0**.
      *   Transfer: Rich gives 4 chips. Poor gets 2.
      *   Gain: 2 * 3 = +6. Loss: 4 * 1 = -4. Net +2.
      *   *The Extreme Case:* Rich gives 40 chips. Poor gets 20.
      *   Gain: 20 * 3 = +60. Loss: 40 * 1 = -40. Net +20.
      *   *Ask:* *"Is it right to strip the Rich student almost bare to give the Poor student a moderate gain, purely because of the weight?"*
  *   **01:05 – 01:20: Debrief.**
      *   Map the experience to theory (see below).

  ---

  ### Part 3: The Debrief (Mapping Experience to Doctrine)

  Do not lecture. Ask questions that force them to name the concepts.

  1.  **The Box (Minutes 65–70):**
      *   *Ask:* "In Round 2, the Box increased our Social Score. Why did that feel disgusting?"
      *   *Map:* This is the **Levelling Down Objection**. If equality is *intrinsically* valuable (good in itself), then making everyone equally poor is an improvement. If that sounds absurd, equality cannot be the only value.
  2.  **The Weights (Minutes 70–75):**
      *   *Ask:* "In Round 3, we stopped destroying chips. But we agreed to take a lot from the Rich to give a little to the Poor. At what point does that become unfair?"
      *   *Map:* This is **Prioritarianism** (benefits to the worse off matter more). It avoids the Box (since destroying chips helps no one), but it faces the **Excessive Sacrifice Objection**. How much weight is too much weight?
  3.  **The Veil (Minutes 75–80):**
      *   *Ask:* "If you had chosen these rules *before* opening your envelopes, would you have chosen the Weighted Rule?"
      *   *Map:* **Ex-Ante vs. Ex-Post**. Priority looks like insurance from behind the veil, but like punishment from the perspective of the Rich after the fact.

  ---

  ### Part 4: Troubleshooting & Limitations

  **Predictable Problems & Fixes**
  1.  **"The Box is a Joke":** Students might laugh at destroying chips.
      *   *Fix:* Frame it bureaucratically. "This is 'Austerity Measures' or 'Administrative Overhead'." Keep a straight face. If they laugh, ask: "Does laughing change the math? Your Score went up."
  2.  **Arithmetic Bottleneck:** Calculating scores takes too long.
      *   *Fix:* Pre-calculate the "Break-Even" points. Write them on the board. *"Under Rule 1: Destroying 10 Rich chips raises Score if Gap > 10."* *"Under Rule 2: 1 Chip to Poor = 3 Chips from Rich."*
  3.  **Sensitive Wealth Roles:** A student who is actually financially struggling gets the "Rich" role, or vice versa.
      *   *Fix:* **Crucial.** Emphasize repeatedly: *"This is a game of tokens. It is not money. It is not reflective of your life."* If a student looks uncomfortable, allow them to swap envelopes with you (the instructor) privately before the game starts.
  4.  **Utilitarian Holdouts:** Some students insist "Total Chips" is the only rule.
      *   *Fix:* Acknowledge it. "Okay, Utilitarianism is Option A. But we did that last week. I need a rule that accounts for the *distribution* we see in front of us. If you ignore the gap, you aren't playing the justice game."

  **What This Simulation Cannot Do (Limitations)**
  *   **Interpersonal Comparison:** The chips assume wellbeing is cardinal and comparable (1 chip for me = 1 chip for you). In reality, a chip might mean "food" to a poor student and "caviar" to a rich one. *You must supply this in the debrief:* "We assumed chips = welfare. Real life is messier."
  *   **Desert/Merit:** The game is purely luck-based. It doesn't address if the Rich *earned* their chips. *Debrief note:* "Luck Egalitarianism says luck shouldn't determine fate. But what if they worked for it?"
  *   **Rights/Constraints:** The game allows total redistribution. It doesn't model self-ownership or rights constraints. *Debrief note:* "We acted as if all chips were social property. Libertarians would say the Rich have a right to refuse."

  ---

  ### Part 5: The "Sufficiency" Variant (Optional Add-On)

  If the class moves fast, swap the **Priority Rule** in Round 3 for a **Sufficiency Rule**.

  *   **The Rule:**
      *   If a student has **< 20 Chips**: Each chip counts **5 Points**.
      *   If a student has **≥ 20 Chips**: Each chip counts **1 Point**.
  *   **The Cliff Edge Scenario:**
      *   Student A has 19 chips. Student B has 21 chips.
      *   Student B gives 2 chips to Student A (A receives 1 due to leak).
      *   **Result:**
          *   Student A: 19 -> 20. (Gains 1 chip, but crosses threshold).
          *   Student B: 21 -> 19. (Loses 2 chips, crosses threshold).
      *   **Score Change:**
          *   A: Was 19*5=95. Now 20*1=20. (Massive Loss in Score!)
          *   B: Was 21*1=21. Now 19*5=95. (Massive Gain in Score!)
      *   *Wait, Sufficiency usually means we only care about getting people above the line.*
      *   *Revised Sufficiency Rule for Game:* **Maximize the number of people above 20.** Ignore total chips.
      *   **The Scandal:**
          *   Scenario: One person has 19 chips. One person has 100 chips.
          *   To get the 19-person to 20, you need to transfer 2 chips (1 received).
          *   Cost: 2 chips from the 100-person.
          *   *This is fine.*
          *   *The Scandal Scenario:* Two people below the line. 10 chips each. One person above (100 chips).
          *   You only have enough chips to lift *one* person to 20.
          *   **Choice:** Do you lift Person A to 20 and leave Person B at 10? Or split it so both go to 15?
          *   **Sufficiency says:** Lift Person A. Leave Person B at 10.
          *   **Intuition:** Leaving someone at 10 when you could have brought them to 15 feels cruel, just to tick a "Sufficiency Box" for someone else.
  *   **Implementation:** Only run this if Round 3 finishes in under 10 minutes. It highlights the **Discontinuity Problem** in Sufficiency views (the moral value of a benefit drops off a cliff once you're "safe").

  ### Final Instructor Note
  The success of this session relies on your **neutral facilitation**. Do not save them from the absurdity of the Box. Let them vote to burn the chips. Let them feel the discomfort. The philosophy is in the silence after the chips hit the box, not in your explanation of it.
