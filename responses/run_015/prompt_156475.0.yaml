  # Seminar Handout: The Progress Taxonomy

  **Root Question:** Do philosophical disagreements shrink over time, or do they mainly recycle?
  *(Calculate the 'recycling coefficient': the rate at which old positions return under fresh jargon.)*

  ---

  ### BRANCH 1: HIGH RECYCLING COEFFICIENT
  **Claim:** Core disagreements (e.g. realism, free will) persist; history is cyclical.

  **Q2: What explains the persistence?**

  *   **A. Conceptual Defect:** The questions themselves are flawed or context-dependent.
      *   **Q3: What counts as progress?**
          *   **i. Eliminating the question.**
              *   **📍 Leaf 1: Eliminativist.**
              *   *Commitment:* Progress is realised only when we dissolve pseudo-problems (e.g. 'consciousness' is a folk category).
          *   **ii. Maximising utility across frameworks.**
              *   **📍 Leaf 2: Pluralist.**
              *   *Commitment:* Progress is expanding the toolkit; no single framework captures 'the truth', but some are better for specific purposes.

  *   **B. Social Dynamics:** The community lacks mechanisms for resolution (fashion, prestige, funding).
      *   **Q3: What counts as progress?**
          *   **i. None.**
              *   **📍 Leaf 3: Stagnationist.**
              *   *Commitment:* Philosophical history is a graveyard of theories; change is merely stylistic.
          *   **ii. Accumulated Truths.**
              *   **📍 Leaf 4: [Unnamed / Incoherent].**
              *   *Awkward Commitment:* Claiming truth accumulates despite permanent recycling of error.
              *   *Status:* **Logically Tense.** Hard to maintain that truths stack up if the same errors continually resurface as live options.

  ---

  ### BRANCH 2: LOW RECYCLING COEFFICIENT
  **Claim:** Disagreements narrow; consensus emerges; options are retired.

  **Q2: What drives the convergence?**

  *   **A. Empirical Input:** Science absorbs or answers the questions.
      *   **Q3: What counts as progress?**
          *   **i. Accumulated Truths.**
              *   **📍 Leaf 5: Naturalist Progressivist.**
              *   *Commitment:* Philosophy progresses by becoming continuous with science; successful parts are renamed 'science'.

  *   **B. Conceptual Clarification:** Reason refines the options without empirical data.
      *   **Q3: What counts as progress?**
          *   **i. Eliminated False Options.**
              *   **📍 Leaf 6: Negative Progressivist.**
              *   *Commitment:* We may not know the answer, but we know which answers are impossible; the search space shrinks.
          *   **ii. Decision-Relevance for Outsiders.**
              *   **📍 Leaf 7: [Unnamed / Unexplored].**
              *   *Awkward Commitment:* Conceptual clarity helps policy/ethics without settling metaphysics.
              *   *Status:* **Plausible Niche.** Often assumed in applied ethics, rarely theorised as general progress.

  *   **C. Social Dynamics:** Consensus emerges via peer pressure or institutional power.
      *   **Q3: What counts as progress?**
          *   **i. Accumulated Truths.**
              *   **📍 Leaf 8: [Unnamed / Incoherent].**
              *   *Awkward Commitment:* Social consensus guarantees truth acquisition.
              *   *Status:* **Generally Rejected.** Confuses agreement with correctness; vulnerable to historical embarrassment.

  ---

  **Note on Classification:** Both **Eliminativists** (Leaf 1) and **Pluralists** (Leaf 2) deny linear accumulation of truths. They are separated here by whether the *question* survives (Pluralist) or is discarded (Eliminativist).
