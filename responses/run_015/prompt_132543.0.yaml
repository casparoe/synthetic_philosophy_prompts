  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION ON METHOD IN THE SCIENCE OF CONSCIOUSNESS

  **Date:** October 24, 2023
  **Participants:** Party A (Heterophenomenological Stance), Party B (Phenomenal Realist Stance)
  **Constraint:** This document is produced under the **Ledger Clause**. For every disputed claim *C*, the ledger of *C* is defined as the set of differences *C*'s truth would make to anything detectable from outside the subject's point of view (reports, reaction times, neural measurements, etc.). Both parties concede that a claim with an empty ledger cannot be adjudicated by third-person inquiry. Neither party concedes that such claims are therefore empty, false, or illegitimate.

  ### 1. AGREED CLAIMS

  1.  **Status of Reports:** Verbal reports regarding experience constitute the primary empirical data for any science of consciousness. They are not infallible truths, nor are they mere noise; they are the interface between the private and the public.
  2.  **Protocol Rigor:** Data collection must proceed via pre-registered protocols rather than ad-libbed interrogation. Post-hoc rationalization of why a report was given must be distinguished from the report itself.
  3.  **Systematic Unreliability:** First-person reports are subject to discoverable error characteristics, including confabulation, demand characteristics, memory decay, and conceptual contamination. These errors can be catalogued and partially corrected for, but not eliminated.
  4.  **Empirical Success:** Report-based methods have successfully generated novel predictions and explanations in domains such as change blindness and blindsight, where discrepancies between report and performance revealed structural features of processing.
  5.  **No Privileged Pipeline:** Neither introspection nor neuroimaging offers a privileged, theory-free pipeline to the facts. Both require interpretation. The neuroscientist's reading of a scan is as much a "text" as the subject's utterance.
  6.  **Falsifiability:** Both sides acknowledge conditions under which their view would be in trouble. Party A would be troubled if a complete third-person model consistently failed to predict report patterns despite perfect data. Party B would be troubled if first-person reports proved to be wholly random with respect to neural state and behavioral context.
  7.  **The Ledger Concession:** Both parties agree that if a claim makes no difference to the ledger (no detectable third-person consequence), third-person inquiry cannot adjudicate it.
  8.  **The Ledger Refusal:** Both parties refuse to conclude that a claim with an empty ledger is therefore meaningless, false, or outside the bounds of legitimate philosophical or scientific discussion.

  ### 2. RESIDUAL DISAGREEMENT

  **Neutral Formulation:**
  The disagreement concerns the ontological status of the gap between the complete third-person description of a system and the first-person report of that system. Specifically, it concerns whether a complete third-person explanation *exhausts* the phenomenon of consciousness or merely *correlates* with it.

  **Party A (Heterophenomenologist) Formulation:**
  Consciousness is the functional organization that produces the reports. Once we have explained why the system produces the text it does, under the constraints of its physical architecture, there is no remainder. A claim with an empty ledger describes no fact; it is a cognitive illusion generated by the user-illusion of the self.

  **Party B (Phenomenal Realist) Formulation:**
  Consciousness is the subject matter *about which* the reports are made. Explaining the production of the text explains the access, not the experience. A claim with an empty ledger may describe a private fact that is real but inaccessible to public verification. A science that ignores this remainder explains the behavior of the instrument but leaves the measurement unexplained.

  **Visibility of the Ledger Tension:**
  *   **Concession:** Both agree that if the "remainder" Party B speaks of has no ledger, Party A cannot be forced to acknowledge it via evidence.
  *   **Refusal:** Party B maintains that the lack of a ledger does not negate the existence of the remainder; Party A maintains that the lack of a ledger negates the *scientific relevance* of the remainder. This tension remains unresolved.

  ### 3. THE CRUXES

  | Crux Topic | Neutral Restatement | Party A Wording | Party B Wording | Agreed Test / Evidence | Predictions & Falsification Conditions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **The Silent Swap** | Can sensory qualities be transposed without functional change? | Is it coherent to suppose qualia invert while behavior stays fixed? | Is it coherent to suppose experience changes while function stays fixed? | Conceptual analysis + search for neural realizers that support functional invariance despite qualitative shift. | **A:** Incoherent. If no ledger, no change occurred.<br>**B:** Coherent. Change is private.<br>**Falsify A:** Demonstrate a coherent model where function is invariant but reports of "difference" arise only upon comparison.<br>**Falsify B:** Show that the supposition entails a logical contradiction in terms. |
  | **The Residue Protocol** | Does training eliminate the sense of private remainder? | Does theoretical sophistication dissolve the intuition of non-physical residue? | Does theoretical sophistication fail to capture the brute fact of presence? | Train subjects in neuroscience/confabulation psychology; measure rate of avowals that "something remains" unexplained. | **A:** Avowal rate drops to baseline noise as subjects recognize the category error.<br>**B:** Avowal rate remains stable; the feeling of "what it is like" is robust to theory.<br>**Falsify A:** Stable high avowal rate among expert subjects.<br>**Falsify B:** Avowal rate drops to zero among expert subjects. |
  | **The Indistinguishable Interlocutor** | Does behavioral identity entail conscious identity? | If a system is heterophenomenologically indistinguishable from a human, is it conscious? | If a system is heterophenomenologically indistinguishable from a human, is there something it is like to be it? | Pre-registered battery of behavioral/verbal tests on a biological or artificial system. | **A:** Yes. The question is closed by indistinguishability.<br>**B:** No. The question remains open regardless of performance.<br>**Falsify A:** Intuition pump showing indistinguishable system clearly lacks experience (e.g., detailed structural deficit).<br>**Falsify B:** Proof that "something it is like" supervenes on functional organization. |

  ### 4. CLOSING: SUBSTANTIVE VS. VERBAL

  We conclude that the dispute is **MIXED**.

  **Verbal Component:** A significant portion of the friction arises from the definition of the term *consciousness*. Party A uses the term to designate the public, report-generating capacity of the organism. Party B uses the term to designate the private, felt quality that the reports attempt to capture. When Party A says "Consciousness is fully explained," and Party B says "Consciousness is not explained," they are often indexing different referents. If we agreed to use *Consciousness-1* for the functional capacity and *Consciousness-2* for the felt quality, the verbal dispute would dissolve.

  **Substantive Component:** However, a genuine metaphysical disagreement remains regarding the nature of explanation and the status of the Ledger. Even if we distinguish the terms, Party A asserts that *Consciousness-2* (the felt quality) is an illusory construct generated by the system's self-monitoring, and thus an empty ledger implies non-existence. Party B asserts that *Consciousness-2* is a fundamental natural fact, and an empty ledger implies only privacy, not non-existence. This is not a verbal dispute; it is a clash over whether a complete physical/functional description of the universe leaves out any facts. No experiment proposed in Section 3 can settle this, as Party A will interpret any null result as vindication (no ledger = no fact) and Party B will interpret it as confirmation of privacy (no ledger = private fact).

  **Bottom line:** We agree on the method of data collection and the limits of third-person adjudication, but we disagree on whether the limits of third-person adjudication mark the boundary of reality or merely the boundary of science.

  **Signatures:**

  __________________________ (Party A)

  __________________________ (Party B)

  \answer{MIXED}
