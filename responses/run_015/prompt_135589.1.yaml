answer: |-
  # Procedural Memorandum: The Anekānta Review Protocol (ARP)

  **To:** Municipal Deliberative Council
  **From:** Procedural Advisor
  **Subject:** Decision Procedure for Paired Submissions (Contested Histories/Environmental Events)
  **Time Allocation:** 30 Minutes per Case

  ## I. Philosophical Preamble: Settled vs. Contested
  Before applying the checklist, the Board must understand the epistemic ground rules. This protocol adapts Jain epistemology for civic use.

  *   **Settled for this Procedure:**
      *   **Anekāntavāda (Many-Sidedness):** No single statement exhausts the truth of a complex event.
      *   **Nayavāda (Standpoints):** Every claim arises from a specific vantage point (e.g., temporal scale, source type, geographic scope). A claim is not "false" simply because it is partial; it is false only if it claims to be *whole* while remaining partial.
      *   **Syādvāda (Conditioned Predication):** Assertions must carry implicit or explicit qualifiers (e.g., "From the perspective of oral history," "Given the instrumental record").
  *   **Contested in Scholarship (Neutral Stance Required):**
      *   Scholars debate whether *syādvāda* is **logical** (a system of multi-valued logic), **epistemic** (a theory of knowledge limits), or **ontological** (a description of reality itself). This procedure treats it as **epistemic methodology only**. We are not deciding what reality *is*, but how claims about reality are *warranted*.
      *   Scholars debate whether this implies **relativism** (all views are equal) or **perspectivism** (views are unequal but complementary). This procedure rejects relativism: claims must meet evidentiary standards (*pramana*). It adopts perspectivism: valid claims may contradict without one negating the other.

  ## II. The Operational Constraint (Non-Standard)
  **The Three-Pathway Decomposition Rule:**
  Standard Jain logic analyzes predicates. This protocol adds a structural requirement to prevent dogmatism.
  *   **Rule:** Before evaluation, the Board must verify that each submission decomposes its primary claim into at least **three independently identifiable causal or descriptive pathways**.
  *   **Failure Condition:** If a submission relies on a single unqualified assertion (e.g., "X caused Y" without distinguishing mechanisms A, B, and C), it is **Rejected Immediately** as incompatible with *anekāntavāda*. This forces authors to acknowledge complexity.

  ## III. The Decision Checklist (30-Minute Protocol)

  ### Step 1: Decomposition Verification (5 Minutes)
  **Question:** Does each submission break its main argument into at least three distinct pathways (causal mechanisms, source lines, or descriptive layers)?
  *   **Sufficient Answer:** Yes. (e.g., Essay A argues drought was caused by 1. Temperature rise, 2. Soil degradation, 3. Policy lag).
  *   **Insufficient Answer:** No. (e.g., Essay A argues "Greed caused the drought").
  *   **Action:** If *either* essay fails, **Reject the non-compliant submission**. If both fail, **Reject Both**. If both pass, proceed to Step 2.

  ### Step 2: Standpoint Identification (Naya Check) (5 Minutes)
  **Question:** Can the Board explicitly name the *standpoint* (naya) of each essay? (e.g., "The Oral/Community Standpoint" vs. "The Archival/State Standpoint").
  *   **Sufficient Answer:** Distinct standpoints are identified (e.g., "Essay 1 speaks from the *naya* of ritual continuity; Essay 2 from the *naya* of demographic shift").
  *   **Insufficient Answer:** One essay claims a "God's eye view" (universal truth without standpoint).
  *   **Action:** If an essay claims universal status without qualification, **Require Revision** (add qualifiers) or **Reject**. If both acknowledge standpoint, proceed to Step 3.

  ### Step 3: Conditioned Predication Test (Syāt Check) (10 Minutes)
  **Question:** Do the contradictions arise from *facts* or from *weights/interpretations*? Apply the Test Claim-Types (see Section IV).
  *   **Sufficient Answer:** Contradictions are shown to be compatible under different conditions (e.g., "True in the short term" vs. "True in the long term").
  *   **Insufficient Answer:** One essay asserts a fact that the other proves impossible (e.g., "Event happened in 1900" vs. "Event happened in 1950" with definitive proof for 1950).
  *   **Action:**
      *   If **Factual Contradiction** (one must be false): **Publish One with Critical Note** explaining the error.
      *   If **Interpretive Weight** (both possible): Proceed to Step 4.

  ### Step 4: The Compatibility & Harm Assessment (5 Minutes)
  **Question:** Can the two essays be framed as complementary partialities, or does one inflict demonstrable civic harm?
  *   **Sufficient Answer:** Both can be framed as "Partial Account A" and "Partial Account B."
  *   **Insufficient Answer:** One essay relies on deception (proven intent to mislead) or incites immediate violence.
  *   **Action:**
      *   If **Compatible:** **Publish Both with Framing** (Introduction must explicitly state these are *nayas*, not total truths).
      *   If **Deception/Violence:** **Reject One**.
      *   If **Moral Objection only** (no deception/violence, but offensive): **HALT**. Return to Board for Value Judgment (see Step 5).

  ### Step 5: The Value Handoff (5 Minutes)
  **Question:** Does the epistemic validity of a submission conflict with the community's ethical boundaries?
  *   **Procedure:** If Step 4 mandates publishing a historically offensive narrative (because it meets epistemic criteria), the Board must vote separately on **Ethical Permissibility**.
  *   **Action:** This is not a philosophical determination. It is a civic one. Record the conflict: "Epistemically Valid, Ethically Contested."

  ---

  ## IV. Test Claim-Types for Board Use
  To assist Step 3, categorize specific sentences from the essays into these four reduced categories (simplified from the Jain *saptabhaṅgī* seven-fold predication):

  1.  **Affirmation (Syāt Asti):** "X exists/is true *under these conditions*."
      *   *Use:* Validating a specific dataset or testimony within its lane.
  2.  **Negation (Syāt Nāsti):** "X does not exist/is false *under these conditions*."
      *   *Use:* Validating that a claim fails outside its specific lane (e.g., "Oral tradition does not record dates").
  3.  **Successive/Complex (Syāt Asti Nāsti):** "X is true in respect A, false in respect B."
      *   *Use:* Resolving contradictions by assigning them to different pathways (from Step 1).
  4.  **Inexpressible/Indeterminate (Syāt Avaktavya):** "X cannot be resolved by available evidence."
      *   *Use:* When data is insufficient. **Action:** Publish both with a disclaimer that the question remains open.

  ---

  ## V. Worked Cases

  ### Case 1: Archaeological Accounts (Ritual Continuity vs. Disruptive Migration)
  *   **Submissions:** Essay A argues burial goods show unbroken ritual practice. Essay B argues isotopic data shows sudden population replacement. Both fit carbon dating.
  *   **Step 1 (Decomposition):**
      *   Essay A: 1. Pottery style, 2. Grave orientation, 3. Artifact placement. (Pass)
      *   Essay B: 1. Strontium isotopes, 2. Dental morphology, 3. Genetic markers. (Pass)
  *   **Step 2 (Standpoint):**
      *   Essay A: *Cultural/Behavioral Naya*.
      *   Essay B: *Biological/Demographic Naya*.
  *   **Step 3 (Predication):**
      *   Contradiction: "Same people" vs. "New people."
      *   Analysis: Essay A claims cultural continuity (Syāt Asti for culture). Essay B claims biological discontinuity (Syāt Asti for biology). This is a **Successive/Complex** case.
  *   **Step 4 (Compatibility):** No deception. Complementary.
  *   **Decision:** **Publish Both with Framing.** Introduction must explain that "continuity" applies to practice, while "disruption" applies to genetics.
  *   **Jain Principle:** *Nayavāda* (different aspects of the same object).

  ### Case 2: Climate Policy (Anthropogenic Forcing vs. Multi-Decadal Oscillation)
  *   **Submissions:** Essay A attributes regional drought to CO2. Essay B attributes it to natural Pacific oscillation. Both use the same temperature/rainfall record.
  *   **Step 1 (Decomposition):**
      *   Essay A: 1. Global trend correlation, 2. Local evaporation rates, 3. Model projection. (Pass)
      *   Essay B: 1. Historical cycle matching, 2. Sea surface temp, 3. Atmospheric pressure indices. (Pass)
  *   **Step 2 (Standpoint):**
      *   Essay A: *Global/Long-term Naya*.
      *   Essay B: *Regional/Cyclical Naya*.
  *   **Step 3 (Predication):**
      *   Contradiction: "Human cause" vs. "Natural cause."
      *   Analysis: Both cite the same data (facts agreed). They assign causal *weight*. This is **Affirmation** for both within their causal models.
  *   **Step 4 (Compatibility):** Scientific consensus allows for multi-causality.
  *   **Decision:** **Publish Both with Framing.** Frame as "Competing Causal Weights."
  *   **Jain Principle:** *Syādvāda* (conditioned predication of cause).

  ### Case 3: The Offensive Narrative (Epistemic Validity vs. Moral Objection)
  *   **Submissions:** Essay A documents a marginalized community's resilience. Essay B argues the community's historical presence was "detrimental to economic progress," citing census data and trade logs. Essay B meets all decomposition and evidentiary standards but uses dehumanizing language.
  *   **Step 1 (Decomposition):** Essay B provides 3 economic pathways. (Pass)
  *   **Step 2 (Standpoint):** Essay B claims an *Economic Utilitarian Naya*. (Pass)
  *   **Step 3 (Predication):** Essay B's data is not factually false (Syāt Asti for economic metrics).
  *   **Step 4 (Compatibility):** Epistemically valid, but morally offensive to the Board.
  *   **Step 5 (Value Handoff):**
      *   **Procedure Mandate:** Epistemically, Essay B qualifies as a "partial standpoint" (a view of economic efficiency, however cold).
      *   **Board Action:** The procedure **HALTS** here. The Board must vote on **Ethical Permissibility**.
      *   **Outcome:** If the Board votes to suppress, they must record: "Rejected on Ethical Grounds, not Epistemic Grounds." This preserves the integrity of the truth-protocol while acknowledging civic responsibility.
  *   **Jain Principle:** Distinction between *Pramana* (valid knowledge) and *Hita* (beneficial speech). Jainism prioritizes *Ahimsa* (non-harm); this procedure allows the Board to prioritize *Ahimsa* over *Pramana* in the final step.

  ---

  ## VI. Limitations and Reductions

  ### 1. What This Procedure Cannot Do
  *   **Resolve Universal Scientific Claims:** If a submission claims a law of physics (e.g., "Gravity does not exist here"), *anekāntavāda* does not apply. This procedure is for **contested human/environmental interpretations**, not falsifiable universal laws. If an essay denies established universal science, **Reject** at Step 3.
  *   **Prevent Moral Discomfort:** As seen in Case 3, the procedure may validate a "truth" the community finds painful. It isolates epistemic validity from moral acceptability, forcing a conscious choice rather than a confused one.
  *   **Fix Bad Faith:** If an author lies about their data, Step 1 (Decomposition) may catch it, but sophisticated lying requires external fact-checking. This is a *logic* check, not a *forensic* audit.

  ### 2. The Reduction (Seven-Fold to Four-Category)
  Standard Jain logic uses the *Saptabhaṅgī* (7 predications: Exists, Non-exists, Both, Inexpressible, Exists-Inexpressible, Non-exists-Inexpressible, Both-Inexpressible).
  *   **Reduction:** We collapse this into the **Four Claim-Types** in Section IV.
  *   **Dropped:** The complex permutations of "Inexpressible" combined with Existence/Non-existence.
  *   **Retained:** The core distinction between **Absolute Falsehood** (contradicts established fact) and **Partial Truth** (contradicts another partial truth).
  *   **Critical Distinction Preserved:** The difference between a **Compound Judgment** (True and False depending on aspect) and a **Simple Falsehood** (False in all aspects). This prevents the procedure from devolving into "anything goes" relativism.

  ### 3. Operational Constraint Note
  The **Three-Pathway Decomposition** is not found in Jain texts. It is an administrative heuristic to ensure *Nayavāda* is not used as an excuse for vague mysticism. It forces the "many-sidedness" to be concrete and analyzable within a 30-minute window.

  ### 4. Scholarly Contestation Disclaimer
  Board members should note that contemporary scholars disagree on whether *syādvāda* is a form of **logical many-valuedness** (like fuzzy logic) or **epistemic humility**. This procedure assumes the latter: it is a tool for managing disagreement, not a metaphysical claim that reality is inherently contradictory. If the Board encounters a submission arguing that "Contradiction is the fundamental state of the universe," this falls outside the procedure's scope and should be referred to the journal's philosophical editor.
