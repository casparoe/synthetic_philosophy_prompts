          *   *Idea B:* The remedy. If corruption is trust betrayal, how do we repair it? (Institutional vs. Cultural).
          *   *Idea C:* The role of the theorist. If we call it "conceptual imperialism" to label gifts as corruption, what should international anti-corruption bodies do?
          *   *Selection:* Let's go with the "Illegal but not Corrupt" concrete example (Q9), the Remedy/Repair question (Q10), and the International Policy implication (Q11).

  3.  **Drafting and Refining the Questions:**

      *   *Review against constraints:*
