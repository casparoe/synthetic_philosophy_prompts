          *   *Likely Answer:* Maybe betrayal of the specific office's purpose, or outright theft.
          *   *Follow-up:* Press on *universal human needs*. If the "trust" is defined by a tyrant, does the fiduciary model fail? Is there a human-rights baseline that overrides local trust definitions?
          *   *Drafting:* Q7 (Main), Q8 (Follow-up).

      *   **Remaining Questions (to reach 9-11 total):**
