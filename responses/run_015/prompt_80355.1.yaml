          3.  Corrupt $\neq$ Illegal (can betray trust without breaking rules).
          4.  Clientelism: Corrupt in high-capacity states (betrayal of impersonal criteria), *not* corrupt in low-capacity states (functional governance substitute).
          5.  Gift-giving: Boundary case. Can be social integration, not bribery. Labeling it corruption = conceptual imperialism.
      *   **Task:** Draft 9-11 questions.
