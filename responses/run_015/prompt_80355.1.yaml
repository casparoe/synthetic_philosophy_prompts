answer: |-
  Here are eleven questions designed to moderate the discussion. They are structured to move from the theoretical foundations of her account to its practical implications, with specific attention to the four required topics.

  For the four required topics, I have included a brief note on the **Likely Answer** to help you gauge when to deploy the **Follow-Up**.

  ### Part 1: The Fiduciary-Trust Account (Foundations)

  **1. Main Question:**
  You argue that we should shift from a rule-violation model to a fiduciary-trust model of corruption. Beyond theoretical elegance, what does this purchase us in terms of diagnostic power? Specifically, are there real-world cases that the rule-violation account condemns as corrupt which your account exonerates, and does that exoneration feel counter-intuitive to the average citizen?

  **2. Follow-Up (Keyed to Likely Answer):**
  *Likely Answer:* She will likely argue that the rule-violation account is too rigid and misses the "spirit" of the office, citing examples like whistleblowing (illegal but not corrupt).
  *Follow-Up:* If the "spirit" of the office is defined by the public's actual trust, rather than a normative ideal, does your account risk legitimizing populism? If a public explicitly trusts a leader to break procedural rules to punish their enemies, is breaking those rules still non-corrupt on your view, or does the fiduciary duty override the public's immediate desires?

  ### Part 2: Clientelism and State Capacity

  **3. Main Question:**
  Your distinction regarding clientelism suggests that in low-capacity states, exchanging favors for votes is a functional substitute for governance rather than a betrayal of trust. Does this distinction risk naturalizing inequality? By defining corruption out of existence in low-capacity contexts, do we inadvertently remove the normative language needed to demand the very state capacity that would make those practices corrupt?

  **4. Follow-Up (Keyed to Likely Answer):**
  *Likely Answer:* She will likely respond that this is a descriptive claim about political functionality, not a moral endorsement, and that recognizing the function is necessary for effective reform.
  *Follow-Up:* But if the diagnosis is that the practice is functional *given the current capacity*, how do you motivate the transition? If local elites can argue that their clientelism is "non-corrupt governance" by your definition, doesn't this provide them with a theoretical shield against international pressure to build impersonal institutions?

  ### Part 3: Gift-Giving and Cultural Boundaries

  **5. Main Question:**
  On the question of gift-giving, you warn against conceptual imperialism. However, if we cannot rely on formal rules to distinguish a bribe from a norm of social integration, what criteria do we use? Is the distinction purely a matter of the official's intent, or is there an objective threshold regarding the value of the gift or its timing relative to official acts?

  **6. Follow-Up (Keyed to Likely Answer):**
  *Likely Answer:* She will likely argue that the distinction lies in the *expectation of reciprocity* and whether the gift undermines the specific function of the office within that cultural context.
  *Follow-Up:* Who gets to define that cultural context? In many societies, there is internal dissent where marginalized groups view these "normative gifts" as extraction by elites. If a significant portion of the "public" in the fiduciary relationship feels betrayed by the gift, does their dissent override the claim that it is a harmless cultural norm?

  ### Part 4: The Cross-Cultural Core

  **7. Main Question:**
  If corruption is contingent on the specific fiduciary expectations of a political community, and those expectations vary between high- and low-capacity states, is there any minimal cross-cultural core of corruption that survives? Is there any act that is corrupt in *every* context, regardless of the local trust architecture?

  **8. Follow-Up (Keyed to Likely Answer):**
  *Likely Answer:* She will likely suggest that outright theft for personal enrichment (with no social function) or betrayal of national security might remain universal cores.
  *Follow-Up:* If the core is that thin, how do we handle regimes where the "trust" of the public is engineered to support systemic oppression? If a security official betrays the trust of a minority group to maintain the trust of the majority, is that corruption on your account, or does the fiduciary duty track the majority's definition of the public good?

  ### Part 5: Applications and Implications (Additional Questions)

  **9. The "Illegal but Not Corrupt" Claim:**
  You mention that an act can be illegal without being corrupt. Could you give us a concrete example of an office-holder breaking a formal rule where, on your account, no fiduciary trust is breached? I am trying to understand how an official can violate the law without violating the trust the law is meant to encode.

  **10. Remediation and Repair:**
  If corruption is fundamentally a betrayal of trust rather than a breach of rule, does the remedy change? Does fighting corruption require less in the way of enforcement and compliance mechanisms, and more in the way of truth-and-reconciliation or public restorative processes to rebuild the fiduciary bond?

  **11. Policy and Conceptual Imperialism:**
  You argue that labeling certain gift-giving practices as corruption is a form of conceptual imperialism. What is the practical upshot for international bodies like the UN or Transparency International? Should they withdraw from monitoring these practices in certain contexts, or simply change the vocabulary they use while maintaining the same pressure?
