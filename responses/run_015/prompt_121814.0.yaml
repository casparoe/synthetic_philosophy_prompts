  The Content-Domain rule (Perceptual = Stalinesque; Narrative = Orwellian) is the traditional philosophical distinction, but it encounters ambiguity in the new case. "Seeing a duck" in a bistable figure sits on the border of perceptual organization and semantic attribution. If she relied solely on content, the "semantic" label in the phenomenon's name might push her toward an Orwellian classification (as with post-hypnotic confabulation).

  However, her past reasoning consistently hinges on the *epistemic status* of the report rather than just the content.
  *   **Stalinesque Cases (Phi, Rabbit):** She describes these as being built into the "present draft" or "percept itself." In phenomenological terms, these are incorrigible experiences; you cannot talk a subject out of seeing the motion or feeling the hops while the illusion is active.
  *   **Orwellian Cases (Libet, Confabulation):** She describes these as revisions in "recollection" or narratives inserted "after the behavior." These are corrigible accounts; they are stories the brain tells to make sense of data, which can be challenged or revised upon reflection.

  The crucial detail in the new case is that subjects **"resist immediate correction."** This operationalizes the distinction: if the distortion survives immediate probing, it resides in the perceptual draft (Stalinesque); if it yields to probing or only appears in retrospect, it resides in the memory archive (Orwellian). Rule 3 accommodates all her past judgments (illusions are robust; confabulations are retrospective) and provides a clear decision procedure for the ambiguous "semantic" content of the new case.

  ### 3. The Decisive Test Case
  To definitively adjudicate between the Content-Domain rule and the Resistance rule, you need a case where the *content* suggests one classification but the *resistance profile* suggests the other.

  **Proposed Case: The "Fragile Afterimage" Paradigm**
  *   **Setup:** A subject stares at a red patch, then looks at a white wall, inducing a green afterimage (a standard perceptual phenomenon). However, the experimenter immediately introduces a subtle social cue or subliminal prime suggesting the afterimage is *blue*.
  *   **The Twist:** The subject initially reports seeing blue (Perceptual Content), but when asked immediately to verify ("Are you certain it isn't green?"), the illusion collapses, and they acknowledge the original green or express uncertainty (Low Resistance).
  *   **The Adjudication:**
      *   **If she classifies this as Stalinesque:** She is following the **Content-Domain Rule**. The distortion concerns a raw perceptual quality (color), so it counts as early editing regardless of its stability.
      *   **If she classifies this as Orwellian:** She is following the **Resistance Rule**. Because the report yields to immediate probing, the distortion is located in the narrative/memory layer, not the perceptual draft, even though the content is sensory.

  This case isolates the variable of *phenomenological stability* from *sensory content*, forcing a choice between the two interpretive frameworks. Given her emphasis on the "percept itself" versus "recollection" in previous interviews, there is a strong probability she would side with the Resistance Rule, classifying the fragile afterimage as Orwellian, thereby confirming Rule 3 as her primary heuristic.
