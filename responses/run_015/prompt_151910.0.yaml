  *Goal:* `MU`.
  *Framing:* "You are a character. This string is your life. These rules are your physics. Get to `MU` (Salvation)."
  *This works.* It makes the abstraction visceral.

  11. **Final Polish:** Ensure the distinction between "Fourth Wall Break" and "Structural Recognition" is sharp. Ensure the "Exclusions" are plain.

