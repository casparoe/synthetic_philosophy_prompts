answer: |-
  Here is a procedure designed for speed, consistency, and institutional safety. It collapses the theoretical distinctions you mentioned into practical evidentiary thresholds.

  ### The Commitment Ladder (5 Rungs)

  Use these canned phrases to ensure tone consistency across rooms.

  *   **Rung 1 (Confirmed):** "Excavations confirm..." / "Records show..."
      *   *Use when:* Physical evidence directly verifies the specific claim.
  *   **Rung 2 (Probable):** "Evidence suggests..." / "It is likely..."
      *   *Use when:* Archaeology and records align, but gaps exist. (Your distinction *b*: something happened, tradition kept it).
  *   **Rung 3 (Possible):** "Some evidence points to..." / "It is possible..."
      *   *Use when:* Archaeology fits the timeline, but the story could be coincidence. (Your distinction *c*: story attached to real ruin).
  *   **Rung 4 (Tradition):** "Legends say..." / "In the story..."
      *   *Use when:* No historical evidence, but the narrative is culturally significant.
  *   **Rung 5 (Meaning):** "For many, this represents..." / "This story embodies..."
      *   *Use when:* Historical truth is unknowable or contested, but cultural/religious truth is paramount.

  ### The Procedure (10 Minutes Max)

  Run these tests in order. Stop at the first match.

  **Test 1: The Contemporary Anchor**
  Is there a contemporary (within 50 years) non-literary record or inscription naming the specific person/event?
  *   *Yes:* **Rung 1.**
  *   *No:* Go to Test 2.

  **Test 2: The Destruction Match**
  Does the archaeology show a destruction/event that *requires* a human cause matching the story's scale and date, with no other explanation?
  *   *Yes:* **Rung 2.**
  *   *No (or could be earthquake/fire/accident):* Go to Test 3.

  **Test 3: The Consensus Check**
  Does 80%+ of specialist literature treat this as historical fact rather than myth?
  *   *Yes:* **Rung 2.**
  *   *No (Split opinion):* **Rung 3.**
  *   *No (Mostly Myth):* Go to Test 4.

  **Test 4: The Faith/Identity Flag**
  Does stating "we don't know" actively contradict a core tenet of a living religious group or national identity represented in our community?
  *   *Yes:* **STOP.** Kick to Director/Curator. Do not write history; write **Rung 5**.
  *   *No:* **Rung 4.**

  ### What This Simplifies (and Why)

  *   **Dropped:** The distinction between "It happened" (a) and "It happened + oral tradition" (b). Archaeology cannot reliably distinguish these. Both get **Rung 2**.
  *   **Kept:** The distinction between "Story attached to real place" (c) and "No evidence." This is the difference between **Rung 3** (Troy exists, war maybe) and **Rung 4** (Arthur's sword in stone).
  *   **Dropped:** "Criterion of Embarrassment." Too subjective for a 10-minute check. If experts accept it, Test 3 covers it.
  *   **Kept:** The Faith/Identity Flag. This is your safety valve for the Exodus room.

  ### Where the Procedure Kicks to a Human

  1.  **Test 4 Trigger:** If a claim touches living faith (Exodus) or intense national identity (Arthur), and the historical evidence is weak (Rung 3 or 4), you cannot write the label alone. You must draft a **Rung 5** option and let leadership choose the risk level.
  2.  **Curator Disagreement:** If you and the Curator disagree on a Test result, **default to the lower rung.** It is easier for a visitor to read "evidence suggests" than to be corrected later.

  ---

  ### Application to Your Drafts

  Here is how the tests fire on your current drafts, with rewritten labels (60-80 words).

  #### 1. Troy Draft
  > *Original:* "The Trojan War was real — the Greeks really did sail against this city and burn it, just as Homer says."

  *   **Test 1 (Contemporary Anchor):** No. Hittite records mention "Wilusa," but not the war. **Fail.**
  *   **Test 2 (Destruction Match):** Troy VIIa shows destruction by fire/war ~1180 BCE. Matches timeframe. But does it *require* the Greek coalition? No. **Fail.**
  *   **Test 3 (Consensus):** Scholars agree a conflict likely occurred, but disagree on scale/Homer's accuracy. **Pass for Rung 3.**
  *   **Result:** **Rung 3 (Possible).**
  *   **Deciding Test:** Test 2. The layer exists, but the "Greece vs. Troy" narrative is not proven by the stones.
  *   **Rewrite:**
      > "Excavations reveal a great city destroyed by fire and warfare around 1180 BCE, matching the time of the legendary Trojan War. While we cannot prove the Greeks sailed here as Homer describes, the ruins show violent conflict occurred. This destruction layer likely inspired the epic poems. Whether Agamemnon commanded the attackers remains unknown, but the memory of this fall echoed through the Bronze Age." 
  #### 2. Arthur Draft
  > *Original:* "Behind the knights and the round table there was probably a real Roman-British war leader, though we'll never know his name."

  *   **Test 1 (Contemporary Anchor):** No. No 5th/6th-century source names him. **Fail.**
  *   **Test 2 (Destruction Match):** No specific battle site confirmed. **Fail.**
  *   **Test 3 (Consensus):** Historians are split. Many say myth; some say based on a real leader. Not 80% fact. **Fail for Rung 2.**
  *   **Test 4 (Faith/Identity):** High local identity/tourism interest. Not religious, but sensitive. **Flag.**
  *   **Result:** **Rung 4 (Tradition)**, potentially **Rung 5** if tourism board pushes. Let's aim for Rung 4 to be safe.
  *   **Deciding Test:** Test 1. The total silence of contemporary records prevents Rung 2.
  *   **Rewrite:**
      > "In the story, Arthur unites Britain against invaders. Historians find no contemporary record of his life, and no archaeological evidence confirms the Round Table. Yet, tales of a heroic leader emerged soon after Rome withdrew. Whether based on a real war leader or invented to inspire hope, the legend filled a power vacuum. For centuries, people have looked to this age for a model of courage, regardless of the historical facts." 
  #### 3. Exodus Draft
  > *Original:* "There is no evidence that any of this happened."

  *   **Test 1 (Contemporary Anchor):** No Egyptian records. **Fail.**
  *   **Test 2 (Destruction Match):** No evidence of mass migration in Sinai archaeology. **Fail.**
  *   **Test 3 (Consensus):** Consensus is "not historical as described." **Pass for Rung 3/4.**
  *   **Test 4 (Faith/Identity):** **TRIGGER.** This is a core tenet of Judaism/Christianity/Islam.
  *   **Result:** **STOP. Kick to Human.** Draft a Rung 5 option.
  *   **Deciding Test:** Test 4. The historical lack of evidence conflicts with the museum policy on faith.
  *   **Rewrite (Rung 5 Option):**
      > "Archaeologists have found no direct evidence in the Sinai for a mass migration of this scale during the Bronze Age. Egyptian records do not mention the event. However, the Exodus remains a foundational story of liberation and identity for millions. For believers, the truth of the narrative lies in its spiritual meaning and covenant, rather than archaeological verification. This label presents the current historical understanding while respecting the story's enduring power." 
  ### Failure Modes & Honesty

  **Where this over-hedges:**
  It will crush "Probable" claims that rely on oral tradition viability (Your distinction *b*). If a story is *very* old and specific, this procedure forces it to Rung 3 or 4 because oral tradition isn't a "Test." You will sound more skeptical than some historians prefer.
  *Fix:* If you feel strongly, use Test 3 (Consensus). If experts lean "Probable," you can claim Rung 2.

  **Where this under-hedges:**
  If two literary sources claim the same thing, Test 3 might let you call it Rung 2. But if they are copying each other, it's Rung 4.
  *Fix:* In Test 3, ask: "Are the sources independent?" If no, drop one rung.

  **When every source is literary:**
  The procedure defaults to Rung 4. This is correct. Without dirt or contemporary inscriptions, it is story, not history.

  **When you and the Curator disagree:**
  The rule is **Default to the Lower Rung.**
  *   *Why:* You can always upgrade a label later if new evidence appears. You cannot easily downgrade a label that promised certainty ("The Greeks *did* sail") without looking incompetent.
  *   *Script:* "I'm applying the Tuesday Rule. We default to 'Evidence suggests' until we have an inscription. It protects us if the consensus shifts."

  **The Religious Trap:**
  The procedure explicitly stops you from solving the Exodus problem. That is intentional. You are not a theologian. Your job is to flag the conflict between Archaeology (Rung 3/4) and Faith (Rung 5). The Director gets paid to sign that label, not you.
