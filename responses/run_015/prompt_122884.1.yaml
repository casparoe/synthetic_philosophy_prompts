  Okay, let's write the response.

  *Wait, one more check on the "Exodus" draft.* The board says "don't deny faith." The writer wrote "no evidence." This is the conflict point. The procedure needs to handle this by moving from "Historical Claim" to "Cultural Claim."

  *Check on "Arthur".* Tourism loves "Real Leader." Historians hate it. The procedure needs to land on "Possible/Tradition" not "Probably."

  *Check on "Troy".* "Just as Homer says" is the killer. That's definitely false. Needs to be "Homer describes..." not "It happened as Homer says."

  *Final Plan:*
  1. Introduction (Acknowledging the pain).
  2. The Ladder (5 Rungs + Phrasing).
  3. The Procedure (5 Tests + Stopping Rules).
  4. The "Kick" (When to stop).
  5. Application to the 3 Drafts.
  6. Failure Modes & Disagreements.
  7. Closing.

  *Word Count Check:* Keep the intro tight. Focus on the tool.
