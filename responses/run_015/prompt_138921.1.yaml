answer: |-
  ### 1. Taxonomy of True Statements Used to Deceive

  Here is the sorting of the stipulated Clinton acts into your proposed categories, followed by an evaluation of the categories themselves.

  **The Sorting**
  *   **Televised Denial ("I did not have sexual relations with that woman"):** Category (c). *True only under a definition or reading you know the hearer isn't using.* Clinton relied on a private, legalistic definition of "sexual relations" (intercourse) while knowing the public hearer used a broader definition (oral sex included).
  *   **Paula Jones Deposition (Answering under stipulated definition):** Category (c). Same mechanism as above. The definition was technically stipulated in the room, but the public record was intended for a hearer (the public) who would not apply that stipulation.
  *   **Grand Jury Exchange ("It depends on what the meaning of the word 'is' is"):** Category (d). *Exploit a conversational convention — tense, quantity, relevance.* This exploits the temporal ambiguity of the present tense to imply a permanent negative, knowing the hearer infers "never" rather than "not right now."
  *   **Denying an "improper relationship" while admitting an "inappropriate relationship":** Category (b). *Assert something true while knowing the hearer will draw a false conclusion.* The distinction between "improper" and "inappropriate" is semantically thin; asserting the latter implies the negation of the former to a standard hearer.

  **Evaluation of the Taxonomy**
  Your suspicion is correct: in this specific context, (c) and (d) collapse.
  *   **Why they collapse:** Category (c) relies on semantic scope (definitions), while (d) relies on pragmatic flow (conventions like tense). However, to successfully deploy (c), you must exploit the conversational convention (d) that speakers share a common lexicon. Clinton's "sexual relations" maneuver worked only because he banked on the conversational norm that words carry their public meaning, not their private legal definition.
  *   **The Unified Category:** Call it **Code Switching**. The speaker uses a code (legal, grammatical, private) distinct from the hearer's code, knowing the hearer will decode it using the public standard.
  *   **The Gap:** Your taxonomy misses **Selective Truth**. This is distinct from (b). In (b), the statement itself triggers the false inference. In Selective Truth, the speaker answers the question truthfully but omits the context that makes the truth misleading. (Example: "I was not in the Oval Office" [true, because I was in the hallway outside].) Clinton did this less than the code-switching, but it appears in witness coaching. I would add (f): *Assert a true subset of facts that renders the whole picture false.*

  **Hearer Specifics:**
  *   **Televised:** The Hearer is the **Public**. The code switch was Public English vs. Legal Definition.
  *   **Deposition:** The Hearer is the **Jones Lawyers** (immediate) and the **Public** (record). The code switch was Stipulated Definition vs. Public English.
  *   **Grand Jury:** The Hearer is the **Prosecutors**. The code switch was Present Tense vs. Continuous State.

  ### 2. The Discounting Point

  **The Argument:** A hearer who knows the speaker is a politician discounts denials ("I did not" ≈ "Who knows"). Therefore, the false belief produced is weaker. Therefore, the moral wrong is less than a flat lie.

  **The Breakdown:**
  The discounting point fails. It fails because it locates the wrong exclusively in the **successful production of a false belief in the hearer**.

  1.  **The Location of the Wrong:** The wrong of misleading is not inherited solely from the harm of the false belief. It is located in the **corruption of the communicative channel**. When Clinton misled, he did not just aim at a false belief; he aimed to make the language itself unreliable. A lie preserves the utility of language (I lie, you believe, later you find out, language still works). Aggressive misleading (quibbling) destroys the utility of language (I speak truly, you believe falsely, later you find out, and you realize words cannot be trusted to carry meaning).
  2.  **The "Liar's Discount" Paradox:** You correctly identified the backwards result: if the discount holds, it is cheaper to mislead a skeptic. But this ignores the **composition of the audience**.
      *   **Hearer: The Base (Supporters).** They do not discount. They want to believe. For them, the misleading statement works as well as a lie. The harm (betrayal) is identical.
      *   **Hearer: The Opposition.** They do discount. But they were not the target of the deception.
      *   **Hearer: The Swing (The Target).** At the time of the statement, they had *not yet* applied the discount. The discount is applied retroactively, after the deception is revealed. The moral wrong is assessed at the time of the act, not the time of the exposure. At the time of the act, the speaker is banking on the hearer *not* discounting.
  3.  **Institutional Harm:** In this specific case, the hearer is not just an individual but the **Citizenry**. The "discount" argument assumes individual epistemology. But the harm was to the **Office**. A President who successfully misleads via technicality degrades the office's capacity to communicate in crises. The "discount" does not apply to the institution, only to the individual's cynicism.

  **Verdict:** The discounting point is empirically true (some people weren't fooled) but morally irrelevant. The wrong is in the **speaker's willingness to exploit the convention**, not the hearer's susceptibility. If the wrong were only in the outcome, attempted murder would be less bad than murder.

  ### 3. The Legal Hook

  **The Observation:** Perjury tracks literal falsity. Clinton's defense was literal truth. The public scandalized the quibbling anyway.

  **Bright Line vs. Moral Load:**
  The legal focus on literal falsity shows only that the law needs **adjudicability**, not that the distinction is morally load-bearing.
  *   **Law:** Requires binary truth values to function. You cannot prosecute a violated implicature. "He implied he was innocent" is not a chargeable offense. "He said X, X was false" is. The law *must* ignore the lying/misleading distinction to operate.
  *   **Morality:** The public reaction proves the distinction is *not* morally load-bearing in the way the law assumes. The public did not say, "Well, it wasn't perjury, so it's fine." They said, "He is gaslighting us."

  **Why the Quibbling Was Harsher:**
  The reaction to the evasions was harsher than a bare denial would have garnered because quibbling signals **contempt**.
  *   **A Bare Lie:** Acknowledges the hearer is an equal who deserves a coherent reality, even if that reality is fabricated. It respects the hearer's intelligence enough to try to fool it.
  *   **The Quibble:** Treats the hearer as a subordinate who must be managed through semantic traps. It says, "I know you will understand X, and I know X is false, but I also know I can prove I said Y."
  *   **Hearer Specifics:**
      *   **Grand Jury:** The quibble was a tactical shield. They expected it.
      *   **Public:** The quibble was an insult. It forced the public to become amateur linguists to parse the President's honesty.

  **Conclusion:** The legal bright line created a moral vacuum. Because Clinton was legally safe, the moral outrage had nowhere to go but toward the *style* of the deception. The scandal wasn't the sex; it wasn't even the lie; it was the **insult of the syntax**.

  ### 4. What the Episode Does to the Theory

  **The Fit:**
  Standard theory (e.g., Carson, Mahon) handles the **intent** cleanly. It argues that if the intent to deceive is identical, lying and misleading are morally equivalent. Clinton is a "win" for the **no-moral-difference side** regarding intent. He plainly aimed at the exact false belief a lie would have produced.

  **The Anomaly:**
  The episode exposes a gap in the theory regarding **relational damage**.
  *   **Theory Says:** Lying and misleading are equivalent because they produce equivalent belief states.
  *   **Case Shows:** Misleading via technicality can be *worse* than lying because it damages the **trust infrastructure** more severely. A lie, when discovered, restores the status quo ante (I know he lied). A successful technical misleading, when discovered, leaves the hearer unsure if they can ever parse the speaker's words again (I don't know what his words mean).
  *   **The Gap:** Theory is silent on the **aesthetics of deception**. It treats communication as data transfer. This case proves communication is a social contract. Violating the *spirit* of the contract (misleading) while keeping the *letter* (truth) can be more corrosive to the relationship than breaking the contract outright (lying).

  **Where Theory is Silent:**
  1.  **The Cost of Parsing:** Theory does not account for the cognitive burden placed on the hearer. Clinton forced the public to do linguistic work to find the truth. Theory treats the hearer as a passive receiver. This case shows the hearer as an active investigator who resents the labor.
  2.  **Retrospective Discounting:** Theory assesses the act at *t1*. This case shows that the moral judgment shifts at *t2* (after exposure). The "he wasn't technically lying" defense aged poorly. Theory has no variable for **time-decay of justification**.
  3.  **Hearer Heterogeneity:** Theory often assumes a generic hearer. This case proves you cannot analyze the morality without splitting the hearer into **Partisans, Opponents, and Institutions**. The wrong done to the Institution (Congress/Courts) is different from the wrong done to the Partisan (who felt betrayed) or the Opponent (who felt vindicated).

  **Final Mapping:**
  *   **Televised Denial:** Code Switching (Public vs. Private Definition). Hearer: Public.
  *   **Deposition:** Code Switching (Stipulated vs. Public). Hearer: Lawyers/Public.
  *   **Grand Jury:** Code Switching (Tense/Time). Hearer: Prosecutors.
  *   **Moral Weight:** Equivalent to lying on intent, heavier on relational damage.
  *   **Legal Weight:** Zero (due to bright lines), which exacerbated the moral outrage.
  *   **Theory Status:** Confirms intent equivalence, exposes silence on relational/structural harm.
