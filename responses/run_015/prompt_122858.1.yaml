      *   *Decision:* I must tell the instructor the truth. You cannot have the paradox without "meddlesome" preferences (preferences over the private sphere of others). The trick is to make the meddling look *normatively attractive* (e.g., concern for welfare, solidarity, aesthetic harmony) rather than *prurient* (prude/lewd).
