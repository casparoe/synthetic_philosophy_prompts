          *   *Caveat:* I must admit to the instructor that *some* other-regarding preference is logically necessary. If I hide this, I'm lying.

  4.  **Misconceptions (Requirement 3):**
      *   *List:*
          1.  "Proof against liberalism" (vs. incompatibility of conditions).
