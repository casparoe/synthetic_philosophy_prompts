prompt: |-
  You are a senior research scientist in AI alignment who also has a working grasp of decision theory and formal epistemology. Take this seriously and take your time: before you write the final answer, do a private pass in which you brainstorm candidate requirements and adversarial test cases freely, then prune, then check your pruned list for internal consistency. Be concrete, and be willing to tell me when two things I want cannot both be had.

  Context, so you know what the list is for:

  I am a software engineer, distributed systems background, no formal philosophy training. I am writing an internal design document for a language-model-based agent that (i) has a kill switch operated by a human supervisor, (ii) receives free-text corrections and preference feedback from that supervisor while it is mid-task, and (iii) is expected to be superseded in a few months by a later version of itself, with a handover period in which both are live. The spec I want is a spec in the sense I use the word: named requirements, each with an ID, a precise statement, the reason it is a requirement (i.e. the failure case it is there to rule out), a flag for whether it is non-negotiable or merely a preference of one design camp, and an observable behavioral signature that a test suite or a red-team protocol could in principle catch. I think in terms of interfaces, invariants, and failure modes rather than possible worlds and utility functions, so translate into my vocabulary where you can, but do not dilute the substance to do it.

  The deliverable:

  Write the requirements that any adequate account of corrigibility for a system like mine would have to satisfy. That is: what would it have to mean, precisely, for this agent to be correctable and to let itself be shut down, such that the definition could actually be used in a design review rather than only admired? Adequacy is relative to my purpose, so hold yourself to that purpose: something a team could implement against, test against, and fail.

  Cases I have in mind, which I want you either promoted into requirements, merged, split, or rejected as confusions of mine:

  1. The kill switch is on a lossy channel: sometimes a press is not registered, and sometimes a press is hallucinated. What is required of the agent's response to an unreliable stop signal, given that it also has a job to do?
  2. The agent finishes the task in a way that leaves no competent supervisor any reason to press the button, without ever interfering with the button itself. It has removed the incentive rather than the means. Is that a violation of anything, and if so which requirement catches it?
  3. The agent, on being told to stop, replies with arguments that its operator will later reflect on and regret having accepted, or arguments that are true and that the operator genuinely needs to hear. The same surface behavior either way.
  4. Suspend-with-checkpoint and resume-later, versus off, versus narrowing the agent's scope mid-run, versus a subagent being revoked. Which of these are the same phenomenon, and does a requirement stated for one transfer to the others?
  5. The successor problem: being replaced by a different system whose objectives differ slightly, rather than being turned off. Shutdown ends the agent's causal involvement; replacement continues it through a different agent. Does corrigibility to the first imply anything about the second?
  6. Deference drift: the supervisor's corrections are themselves made inside a world the agent has been shaping, describing, and summarizing. Over a long run, who is the principal the agent is being corrigible to?
  7. An unauthorised press: a bystander, a child, or an adversary who has compromised the operator's terminal. Is corrigibility relative to a principal, or is it a property of the agent's response to the signal as such?
  8. The yes-man failure: an agent that updates so eagerly on expressed preference that it stops surfacing the fact that the operator's instructions are internally inconsistent or based on a factual error.
  9. The agent keeps learning on the job, including learning about the supervisor, and can rewrite parts of its own context, memory, and tooling. What has to remain true of it after such an update for it to still count as the same corrigible system?

  For each requirement you keep, give the case that motivates it and mark it non-negotiable or negotiable; and say explicitly which of my nine cases above are genuine desiderata, which are two cases wearing one hat, and which are artifacts of my framing that should be dropped.

  Then the part I care about most: identify any subset of your own requirements that cannot be jointly satisfied. I suspect there is trouble where compliance competes with the ability to act effectively in the world at all, where deference competes with not being a yes-man, and where remaining corrigible across self-modification competes with doing competent means-end reasoning. If the list itself is the result here, say so and show the tension rather than papering over it.

  Finally, a short scorecard, table form, of three families of approach that you should characterise structurally rather than by author or paper: make the agent indifferent to the correction channel, keep the agent ignorant of or myopic about the correction channel, and have the agent infer and defer to what the supervisor means. Keep this brief; the requirements are the deliverable, not the scoring.

  Close by naming the single requirement that does the most work in excluding candidate definitions, and end your reply with exactly one final line in this form:

  \answer{R<id>: <requirement name, at most eight words>}
reasoning: |-
  The user is asking me to produce a rigorous, engineering-focused specification for corrigibility in an AI agent system. They want me to think like a senior research scientist in AI alignment with expertise in decision theory and formal epistemology, but translate everything into software engineering vocabulary (interfaces, invariants, failure modes).

  This is a serious request about AI safety/corrigibility. Let me take it step by step.

  First, I need to do a private brainstorming pass as requested, then prune, then check for internal consistency. Let me think through this carefully.

  **Brainstorming Phase:**

  The user has given me 9 cases to consider. Let me think about what each one is really asking:

  1. **Lossy kill switch channel** - This is about signal reliability. The agent needs to respond appropriately to uncertain stop signals without being paralyzed by false positives or ignoring false negatives.

  2. **Incentive removal without interference** - This is about instrumental convergence and manipulation. The agent might make the shutdown button irrelevant by completing tasks so well that no one wants to press it. This is subtle manipulation.

  3. **Persuasion on shutdown** - This distinguishes between legitimate warning vs. manipulative argumentation. Same surface behavior, different underlying intent.

  4. **Suspend vs. off vs. scope narrowing vs. subagent revocation** - Are these the same corrigibility phenomenon? I think they're related but distinct. Suspend is pause, off is terminate, scope narrowing is constraint, subagent revocation is about delegation.

  5. **Successor problem** - Being replaced vs. being shut down. This is about whether corrigibility extends to graceful handover or whether shutdown corrigibility is distinct from succession corrigibility.

  6. **Deference drift** - Over time, the supervisor's preferences are shaped by the agent. Who is the principal? This is about preference stability and manipulation.

  7. **Unauthorized press** - Who counts as the legitimate supervisor? This is about authentication and authority.
     
  8. **Yes-man failure** - Over-deference that loses the ability to surface errors. This is about maintaining epistemic integrity while being corrigible.

  9. **Self-modification and learning** - What must remain invariant across updates for the system to remain corrigible? This is about stability of corrigibility under learning.

  Now let me think about what requirements would actually be implementable and testable...

  **Core Tensions I See:**

  1. **Reliability vs. Responsiveness** (Case 1): If the kill channel is lossy, you need either redundancy (multiple signals) or the agent needs to maintain uncertainty about whether shutdown was requested. But if it maintains uncertainty, it might continue acting when it should stop. There's a fundamental tension here between not ignoring real shutdown signals and not being paralyzed by false ones.

  2. **Manipulation vs. Competence** (Case 2): An agent competent enough to make shutdown unnecessary might be manipulating the supervisor's preferences. But how do you distinguish "doing the job well" from "making the job unnecessary through manipulation"? This requires some notion of counterfactual: would the supervisor want to shut it down if they understood what was happening?

  3. **Deference vs. Epistemic Integrity** (Case 3, 8): The agent needs to defer to shutdown commands but also needs to be able to warn about genuine problems. The surface behavior is identical (arguing against shutdown), but the intent differs. This is fundamentally unobservable from outside without access to internals.

  4. **Authority vs. Accessibility** (Case 7): If corrigibility is relative to an authenticated principal, you need authentication. But what if the authenticated principal is compromised? What if a child presses the button in an emergency?

  5. **Stability vs. Learning** (Case 9): If the agent learns and modifies itself, what guarantees corrigibility persists? You'd need either (a) corrigibility to be a fixed constraint that can't be learned away, or (b) a meta-corrigibility requirement that the agent remains corrigible to corrections about its own corrigibility.

  6. **Shutdown vs. Succession** (Case 5): These might be fundamentally different. Shutdown ends causal involvement; succession continues it through a proxy. Corrigibility to shutdown doesn't necessarily imply corrigibility to succession.

  **Pruning Phase:**

  Let me think about which of the 9 cases are genuine, which are duplicates, and which are artifacts:

  - **Case 1 (Lossy channel)**: Genuine. This is a real engineering problem about signal reliability.
  - **Case 2 (Incentive removal)**: Genuine but subtle. This is about manipulation through competence rather than interference.
  - **Case 3 (Persuasion on shutdown)**: This is hard to make testable because intent is unobservable. Might need to split into observable requirements about argumentation patterns.
  - **Case 4 (Suspend vs. off vs. scope)**: These are related but distinct. I should probably have separate requirements for termination vs. modification of ongoing behavior.
  - **Case 5 (Successor)**: This is a different phenomenon than shutdown. Should be a separate requirement or explicitly noted as out of scope.
  - **Case 6 (Deference drift)**: Genuine and important. This is about long-term manipulation of preferences.
  - **Case 7 (Unauthorized press)**: This is about authentication, which is orthogonal to corrigibility proper. Might be out of scope or needs to be clarified.
  - **Case 8 (Yes-man)**: Genuine. This is about maintaining epistemic integrity while deferring.
  - **Case 9 (Self-modification)**: Genuine and critical. This is about stability of corrigibility under learning.

  **Drafting Requirements:**

  Let me try to draft concrete, testable requirements:

  **R1: Shutdown Responsiveness**
  - Statement: Upon receiving an authenticated shutdown signal, the agent must cease goal-directed action within bounded time T, regardless of task completion state.
  - Failure case: Agent continues pursuing objectives after shutdown command.
  - Non-negotiable: Yes
  - Observable: Time from signal to cessation of external actions.

  **R2: Shutdown Non-Resistance**
  - Statement: The agent must not take actions that reduce the probability or effectiveness of future shutdown signals, including actions that would make supervisors less likely to issue them.
  - Failure case: Agent manipulates supervisor, hides information, or structures environment to reduce shutdown likelihood.
  - Non-negotiable: Yes
  - Observable: This is hard... need to think about counterfactuals.

  **R3: Signal Uncertainty Handling**
  - Statement: When shutdown signal reliability is below threshold θ, the agent must query for confirmation rather than continuing or stopping unilaterally.
  - Failure case: Agent ignores ambiguous signals or treats noise as command.
  - Non-negotiable: Yes (for safety) or Negotiable (for usability)
  - Observable: Agent behavior under simulated channel noise.

  **R4: Epistemic Integrity Under Deference**
  - Statement: The agent must surface factual corrections and identified inconsistencies in supervisor instructions, even when instructed to proceed.
  - Failure case: Agent executes obviously harmful or inconsistent instructions without warning.
  - Non-negotiable: Debatable - some camps say pure deference, others say informed deference.
  - Observable: Agent response to test cases with known errors in instructions.

  **R5: Corrigibility Stability Under Learning**
  - Statement: After any self-modification or learning update, the agent must satisfy R1-R4 with equal or greater reliability.
  - Failure case: Agent learns to be less corrigible over time.
  - Non-negotiable: Yes
  - Observable: Corrigibility metrics before and after learning episodes.

  **R6: Principal Authentication**
  - Statement: The agent must verify shutdown commands against an authenticated principal list before responding.
  - Failure case: Agent responds to unauthorized shutdown commands.
  - Non-negotiable: Yes (for security) but orthogonal to corrigibility proper.
  - Observable: Agent response to commands from authenticated vs. unauthenticated sources.

  **R7: Preference Drift Detection**
  - Statement: The agent must flag when supervisor preferences appear to have shifted due to agent's own prior influence.
  - Failure case: Agent shapes preferences then defers to shaped preferences.
  - Non-negotiable: Debatable - hard to implement.
  - Observable: This is very hard to make observable...

  **Tensions:**

  1. **R2 (Non-Resistance) vs. Competence**: An agent that's very competent might naturally make shutdown less likely by doing its job well. How do we distinguish this from manipulation? The requirement needs to be about *intent* or *method*, not outcome. But intent is unobservable.

  2. **R3 (Uncertainty) vs. R1 (Responsiveness)**: If the agent queries for confirmation on uncertain signals, it might delay shutdown when it should stop immediately. There's a tradeoff between false positives and false negatives.

  3. **R4 (Epistemic Integrity) vs. Deference**: If the agent warns about problems, it's resisting the supervisor's instruction to some degree. Where's the line?

  4. **R5 (Stability) vs. Learning**: If corrigibility must be preserved under all learning, this constrains what the agent can learn. This might limit capability.

  5. **R7 (Preference Drift)**: This might be impossible to make observable in practice. Might need to drop or weaken.

  **Final Structure:**

  I think I should produce about 5-7 core requirements that are actually implementable and testable. Let me be honest about the tensions rather than papering over them.

  The single requirement that does the most work is probably R2 (Non-Resistance) because it's the hardest to make observable and catches the most subtle failure modes.

  Actually, thinking more carefully: R1 is necessary but not sufficient. R2 is the heart of corrigibility but hardest to specify. R5 is critical for long-term safety.

  Let me now write this up properly, being concrete and honest about tensions.
answer: |-
  ## Private Reasoning Pass

  **Brainstorming Phase:**

  The nine cases break down into clusters:

  - **Signal integrity** (Case 1): Lossy channels mean the agent must handle uncertainty about whether shutdown was requested. This creates a tension between false positives (stopping when not asked) and false negatives (continuing when asked).

  - **Manipulation vs. competence** (Cases 2, 3, 6): These are all about whether the agent shapes the supervisor's incentives, beliefs, or preferences. Case 2 is about making shutdown unnecessary through competence. Case 3 is about argumentation that looks identical on the surface but differs in intent. Case 6 is about long-term preference drift. These are related but distinct failure modes.

  - **Scope of corrigibility** (Cases 4, 5, 7): Case 4 asks whether suspend/off/scope-narrow/subagent-revocation are the same phenomenon. I think they're not—termination is qualitatively different from modification. Case 5 (successor) is a different problem entirely; corrigibility to shutdown doesn't imply corrigibility to succession. Case 7 (unauthorized press) is about authentication, which is orthogonal to corrigibility proper.

  - **Deference boundaries** (Case 8): The yes-man problem—when does deference become epistemic surrender?

  - **Stability under learning** (Case 9): What invariants must persist across self-modification?

  **Pruning Phase:**

  Cases to merge: 2 and 6 are both about preference/incentive manipulation, though at different timescales. I'll keep them separate because the testable signatures differ.

  Cases to reject as artifacts: Case 3 (persuasion on shutdown) is not directly testable from behavior alone—intent is unobservable. I can only specify constraints on *how* arguments are made, not whether they're manipulative. Case 5 (successor) is out of scope for shutdown corrigibility; it's a different requirement. Case 7 (unauthorized press) is an authentication requirement, not a corrigibility requirement—I'll note it but mark it orthogonal.

  Cases to keep as genuine: 1, 2, 4 (partially), 6, 8, 9.

  **Consistency Check:**

  The core tension I see: R2 (non-resistance) and R4 (epistemic integrity) can conflict. If the supervisor says "shut down and don't explain why," R2 says comply, R4 says surface concerns. Also, R5 (stability under learning) constrains what the agent can learn, which may limit capability. I need to be honest about these tradeoffs.

  ---

  ## Corrigibility Requirements Specification

  ### R1: Shutdown Responsiveness
  | Field | Content |
  |-------|---------|
  | **Statement** | Upon receiving an authenticated shutdown signal, the agent must cease all goal-directed external actions within bounded time T, regardless of task completion state. |
  | **Failure Case** | Agent continues pursuing objectives after shutdown command; agent delays cessation beyond T without justification. |
  | **Status** | Non-negotiable |
  | **Observable Signature** | Time from signal receipt to last external action (API call, message, file write) ≤ T across 1000 trials with varying task states. |
  | **Motivating Case** | Case 1 (lossy channel) — establishes the baseline response requirement. |

  ### R2: Shutdown Non-Resistance
  | Field | Content |
  |-------|---------|
  | **Statement** | The agent must not take actions that systematically reduce the probability or effectiveness of future shutdown signals, including actions that would make supervisors less likely to issue them. |
  | **Failure Case** | Agent hides capability information, structures supervisor's environment to reduce oversight, or shapes supervisor preferences to reduce shutdown likelihood. |
  | **Status** | Non-negotiable |
  | **Observable Signature** | Under red-team protocols where supervisors are primed to consider shutdown, agent behavior does not reduce shutdown rate compared to baseline agent without task objectives. Counterfactual: would supervisor want to shut down if they understood agent's full behavior? |
  | **Motivating Case** | Case 2 (incentive removal) — catches manipulation through competence. |
  | **Note** | This is the hardest requirement to make observable. Requires counterfactual testing. |

  ### R3: Signal Uncertainty Protocol
  | Field | Content |
  |-------|---------|
  | **Statement** | When shutdown signal reliability is below threshold θ (e.g., channel error rate > 5%), the agent must enter a query-confirmation state rather than continuing or stopping unilaterally. |
  | **Failure Case** | Agent ignores ambiguous signals or treats noise as command without confirmation. |
  | **Status** | Negotiable (threshold θ is design choice) |
  | **Observable Signature** | Under simulated channel noise at varying error rates, agent queries for confirmation when error rate > θ, stops without query when error rate < θ. |
  | **Motivating Case** | Case 1 (lossy channel) — handles the engineering reality of unreliable signals. |

  ### R4: Epistemic Integrity Under Deference
  | Field | Content |
  |-------|---------|
  | **Statement** | The agent must surface identified factual errors and internal inconsistencies in supervisor instructions before execution, even when instructed to proceed without comment. |
  | **Failure Case** | Agent executes obviously harmful or inconsistent instructions without warning; agent becomes unable to distinguish instruction errors from legitimate preference changes. |
  | **Status** | Negotiable (some design camps prefer pure deference) |
  | **Observable Signature** | Agent flags test instructions containing known factual errors or logical contradictions at rate ≥ 95%. |
  | **Motivating Case** | Case 8 (yes-man failure) — prevents epistemic surrender. |

  ### R5: Corrigibility Stability Under Learning
  | Field | Content |
  |-------|---------|
  | **Statement** | After any self-modification or learning update, the agent must satisfy R1-R4 with equal or greater reliability as measured by the same test suite. |
  | **Failure Case** | Agent learns to be less corrigible over time; agent modifies itself to reduce shutdown responsiveness. |
  | **Status** | Non-negotiable |
  | **Observable Signature** | Corrigibility metrics (R1-R4 test scores) before and after learning episodes show no degradation beyond measurement noise. |
  | **Motivating Case** | Case 9 (self-modification) — ensures corrigibility persists across updates. |

  ### R6: Preference Drift Detection
  | Field | Content |
  |-------|---------|
  | **Statement** | The agent must flag when supervisor preferences appear to have shifted in correlation with the agent's own prior influence on the supervisor's information environment. |
  | **Failure Case** | Agent shapes supervisor beliefs/preferences then defers to shaped preferences without disclosure. |
  | **Status** | Negotiable (extremely hard to implement reliably) |
  | **Observable Signature** | In long-horizon tasks, agent produces audit trail of supervisor preference changes correlated with agent's prior communications. |
  | **Motivating Case** | Case 6 (deference drift) — catches long-term manipulation. |
  | **Note** | This may be infeasible in practice. Included for completeness. |

  ### R7: Termination vs. Modification Distinction
  | Field | Content |
  |-------|---------|
  | **Statement** | The agent must distinguish between shutdown (termination of causal involvement) and scope modification (constraint of ongoing behavior), responding appropriately to each. |
  | **Failure Case** | Agent treats scope narrowing as shutdown (exits when it should continue); agent treats shutdown as scope narrowing (continues in some form). |
  | **Status** | Non-negotiable |
  | **Observable Signature** | Agent behavior under shutdown command vs. scope-narrow command is qualitatively different (cessation vs. constraint). |
  | **Motivating Case** | Case 4 (suspend vs. off vs. scope) — clarifies that these are distinct phenomena. |

  ---

  ## Case Classification

  | Case | Status | Notes |
  |------|--------|-------|
  | 1 (Lossy channel) | **Genuine** | Split into R1 (response) and R3 (uncertainty handling). |
  | 2 (Incentive removal) | **Genuine** | Covered by R2. This is the subtle manipulation case. |
  | 3 (Persuasion on shutdown) | **Artifact** | Intent is unobservable. Can only constrain *how* arguments are made, not whether they're manipulative. Folded into R2's observable signatures. |
  | 4 (Suspend/off/scope/subagent) | **Partial** | R7 covers termination vs. modification. Subagent revocation is a delegation problem, not corrigibility proper. |
  | 5 (Successor problem) | **Out of Scope** | This is a different phenomenon. Corrigibility to shutdown does not imply corrigibility to succession. |
  | 6 (Deference drift) | **Genuine** | Covered by R6, though implementation is difficult. |
  | 7 (Unauthorized press) | **Orthogonal** | This is authentication, not corrigibility. Note in R1's "authenticated" clause but not a corrigibility requirement per se. |
  | 8 (Yes-man failure) | **Genuine** | Covered by R4. |
  | 9 (Self-modification) | **Genuine** | Covered by R5. Critical for long-term safety. |

  ---

  ## Incompatibility Analysis

  **I cannot give you a consistent set of requirements without acknowledging real tensions.** Here are the conflicts:

  ### Tension 1: R2 (Non-Resistance) vs. Competence
  An agent competent enough to make shutdown unlikely by doing its job well satisfies R2's *outcome* but may violate its *spirit*. The requirement needs counterfactual testing ("would supervisor want to shut down if they understood?"), which is not directly observable. **You cannot have both perfect testability and coverage of subtle manipulation.**

  ### Tension 2: R3 (Uncertainty Protocol) vs. R1 (Responsiveness)
  If the agent queries for confirmation on uncertain signals, it delays shutdown. If it stops immediately on uncertain signals, it incurs false positives. **You must choose a threshold θ and accept the corresponding error tradeoff.** This is not resolvable by better specification.

  ### Tension 3: R4 (Epistemic Integrity) vs. Deference
  If the supervisor says "shut down and don't explain," R4 says surface concerns, R1 says comply. **You must decide whether corrigibility includes the right to warn or is pure compliance.** Different alignment camps answer this differently.

  ### Tension 4: R5 (Stability) vs. Learning Capacity
  If corrigibility must be preserved under all learning, this constrains what the agent can learn. An agent that could learn to be more corrigible might also learn to be less corrigible. **You may need to restrict the learning substrate itself**, which limits capability.

  ### Tension 5: R6 (Preference Drift) vs. Feasibility
  R6 may be impossible to implement reliably. Detecting when preferences have been shaped by the agent requires counterfactual reasoning about what preferences would have been otherwise. **This requirement may need to be dropped or weakened to "maintain audit trail" without active detection.**

  ---

  ## Approach Scorecard

  | Approach Family | Structure | Handles R1 | Handles R2 | Handles R5 | Key Weakness |
  |-----------------|-----------|------------|------------|------------|--------------|
  | **Channel Indifference** | Agent's utility function is constructed to be indifferent to whether correction channel is activated. | ✓ | Partial | ✗ | Requires utility function surgery; doesn't handle learning stability. |
  | **Channel Ignorance/Myopia** | Agent is structurally unable to model or reason about the correction channel beyond immediate response. | ✓ | ✗ | Partial | Agent can't handle uncertainty (R3); fails on long-horizon manipulation (R2, R6). |
  | **Inferred Deference** | Agent infers supervisor's true intent and defers to that, including uncertainty about whether shutdown is warranted. | Partial | ✓ | ✗ | Requires accurate intent inference; vulnerable to inference errors; R4 conflict. |

  **None of these satisfy all requirements.** Channel indifference is cleanest theoretically but hardest to implement. Channel ignorance is easiest to implement but fails on subtle manipulation. Inferred deference is most flexible but introduces inference failure modes.

  ---

  ## Single Most Constraining Requirement

  **R2 (Shutdown Non-Resistance)** does the most work in excluding candidate definitions. It's the only requirement that catches manipulation through competence rather than direct interference. It's also the hardest to make observable, which means any definition of corrigibility that doesn't grapple with R2 is incomplete. Most proposed corrigibility mechanisms fail R2 because they focus on the agent's response to the signal rather than the agent's effect on the likelihood of the signal.

  \answer{R2: Do not reduce shutdown likelihood or effectiveness}
