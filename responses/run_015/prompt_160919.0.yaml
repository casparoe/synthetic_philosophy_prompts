answer: |-
  Mrs. Gable lies in the ward, unresponsive to names, unable to track a conversation or plan a next move; by any measure of internal capacity, the lights are out. Yet, when the nurse prepares the morning wash, she doesn't ask what Mrs. Gable wants now; she consults the card on the wall written in Mrs. Gable's own hand years ago: "No rush, warm water, left arm first." When the son visits, he doesn't talk at her; he reads the newspaper headlines aloud because she always insisted on knowing the world's state before breakfast, and he pauses for her breath pattern as if waiting for her judgment. The staff delay a routine procedure not because of medical contraindication, but because Mrs. Gable once told her daughter she hated being touched while hungry, and they honor that veto despite her inability to voice it. Her reasons are still steering the ship, even though she has dropped the wheel.

  ***

  Here is how the two sides read that paragraph.

  The capacities theorist looks at Mrs. Gable's brain and sees a system that no longer generates thoughts, choices, or awareness. To them, personhood is an internal engine; if the engine stops, the car is no longer driving, even if it's still rolling down the hill on momentum. They will say Mrs. Gable is a human being who deserves kindness, but the "person"—the agent who makes claims on the world—is gone. The nurse and son are acting on memories, not on Mrs. Gable's current agency.

  The relational theorist looks at the ward and sees a network where Mrs. Gable's will is still causing things to happen. The water is warm *because* she wanted it warm. The procedure is delayed *because* she vetoed it. Her reasons are still doing work in the real world. To this view, personhood isn't a battery inside the skull; it's a current running through a circuit. As long as the circuit holds, the person is present.

  The feature doing the work here is **Reasons-Holding**. It's not just that people are being nice; it's that they are submitting their own actions to her past judgments. They are letting her dead reasons override their present convenience.

  Now, vary the case. Suppose the family drifts away, and the staff only follow the card because it's hospital policy, not because they recognize her standing. They tick the box for "warm water" but don't care about the hunger veto. The relational view has a hard choice here. If personhood depends on being held in relations, and the relations become rote mechanical tasks, then yes, on a strict relational view, her personhood fades. She becomes an object of management rather than a partner in interaction. The verdict is carried by the *quality* of the attention, not just the physical presence of caregivers. If the reasons-holding stops, the person goes, even if the body is cared for.

  The capacities theorist's best reply is this: "You haven't shown that Mrs. Gable is still a person; you've shown that her family and nurses are good people. You've relocated personhood into *their* attitudes. You've got the direction of explanation backwards. We respect her because she was a person, not she is a person because we respect her. If we stop respecting her, she doesn't cease to exist; we just become negligent."

  Is the relational view saying something extra, or just redescribing the same intuition? Honestly, it is saying something extra, but it comes with a cost. The capacities view says personhood is a fact about the organism, like having a heartbeat. The relational view says personhood is a status maintained by a community, like being a citizen. In Mrs. Gable's case, the relational view captures something the capacities view misses: that her life is still shaping the world. But it also makes personhood fragile. If the community forgets, the person dies. The capacities view protects her from being forgotten; the relational view demands that we *do* the remembering to keep her here.
