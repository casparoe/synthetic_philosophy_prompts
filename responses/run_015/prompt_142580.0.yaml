  **1. Who:** Reparations Philosopher **Lik:** High **Dam:** 5 **Inst:** Reframe
  **Objection:** Your counterfactual "we" excludes the victims of the cause. Who gets to decide what would have happened had the oppressors won?
  **Reply:** You are right to worry about who speaks for the "we." But the test isn't about who decides the history; it's about what the memory does for the community holding it. When I ask "had they won," I am not asking the descendants of the enslaved to imagine a successful Confederacy. I am asking the community currently maintaining the statue to justify why they need a defeat to make the cause bearable. If the memory only works because the cause lost, it is doing work that victory would have exposed as untenable. This shifts the burden from the victims proving harm to the commemorators proving consistency. It doesn't solve who decides, but it changes the question from "is this true?" to "is this sustainable?" The follow-up will press on whether this still privileges the oppressor's narrative. I accept that risk, but the alternative is letting them claim victory without testing the claim.
  **Soft:** Privileges oppressor narrative. **Follow-up:** Who validates the counterfactual?

  **2. Who:** Public History Practitioner **Lik:** High **Dam:** 5 **Inst:** Hold
  **Objection:** This is philosophically elegant but operationally useless. How do I translate "vindication-fragile" into a consultation process without starting a riot?
  **Reply:** I hear you. You need a tool, not a verdict. Think of this as a diagnostic question for the consultation room, not a verdict you deliver from the stage. When a community group says, "This statue represents our heritage," you ask: "If this cause had succeeded, would you still honor it this way?" If they hesitate, you have found the fragility. You don't tell them they are wrong; you let them discover the memory depends on the loss. That moves the conversation from "truth" to "function." It gives you a procedural handle to suggest recontextualization without demanding removal immediately. It survives the consultation because it doesn't dictate the outcome; it clarifies the stakes. The soft spot is that some groups will lie or not understand. You need historical evidence ready to back the counterfactual if they deny it.
  **Soft:** Groups may deny fragility. **Follow-up:** What evidence suffices?

  **3. Who:** Local Journalist **Lik:** High **Dam:** 5 **Inst:** Reframe
  **Objection:** So you are arguing that some Confederate monuments should stay because the South losing was actually good for them?
  **Reply:** That headline would destroy me, and I understand why it sounds that way. But I am not saying the loss was good for the people who suffered under the cause. I am saying the memory of the cause is only tolerable now because they lost. A victorious Confederacy would have had to enforce slavery openly; we would not be debating statues, we would be living under a regime. The memory is "auspicious" only in the sense that we are spared the reality of what they wanted to build. It is not a moral endorsement of the loss; it is a diagnosis of why the memory persists. The loss allows them to mourn without governing. My test identifies when a monument is a shield for a failed ideology rather than a record of history. I am not defending the statue; I am explaining why it is so hard to move.
  **Soft:** "Auspicious" sounds like endorsement. **Follow-up:** Is any removal justified then?

  **4. Who:** Memory Theorist **Lik:** Medium **Dam:** 4 **Inst:** Hold
  **Objection:** You are licensing forgetting. If a memory is fragile, you imply we can discard it. We owe memory to the dead, regardless of utility.
  **Reply:** I agree we owe memory to the victims, but I distinguish between memory of the event and memory of the cause. My test targets commemorative practices that vindicate the cause, not the suffering it caused. If a memory is vindication-fragile, keeping it often means keeping the moral alchemy that turns guilt into grief. That doesn't serve the dead; it serves the survivors who want to feel tragic rather than culpable. We can remember the victims without keeping the statues that glorify the oppressor's intent. Forgetting the cause isn't the goal; stopping the vindication is. We can remember the Confederacy as a criminal project without treating its defeat as a tragedy. The follow-up will ask if removing the statue erases the history. I must insist that museums exist for history; public squares are for shared values.
  **Soft:** Erasure vs. relocation. **Follow-up:** Where does the history go?

  **5. Who:** General Philosopher **Lik:** Medium **Dam:** 4 **Inst:** Hold
  **Objection:** Counterfactuals are speculative fiction. You cannot build a normative test on what might have happened had the war gone differently.
  **Reply:** You are right that we cannot know the future that didn't happen. But we know the ideals the cause professed. We don't need to know the exact history of a victorious Confederacy to know it would have required maintaining slavery. That isn't speculation; it is their stated platform. The test relies on the internal logic of the cause, not external chance. If the cause's ideals contradict the conditions required for its victory, the memory is fragile. We use counterfactuals in law and ethics all the time to test consistency. We ask "what if everyone did this?" Here I ask "what if they won?" It exposes whether the memory relies on the cause being harmless because it was powerless. That is a factual claim about the current memory, not a prediction of the past.
  **Soft:** Ideals vs. Reality. **Follow-up:** What if ideals were hidden?

  **6. Who:** Historian **Lik:** Medium **Dam:** 3 **Inst:** Concede
  **Objection:** Masada is archaeologically contested and likely myth. Basing a theory of memory on a disputed narrative undermines your credibility.
  **Reply:** I concede the history is shaky. I use Masada stipulatively, not as fact. My point is about the shape of the memory, not the event. Even if the mass suicide is myth, the commemoration functions as a defeat-memory that became awkward after Israeli military success. Once the state could win wars, the "last stand" narrative lost its utility. It shifted from a pledge of resistance to a museum piece. This proves the mechanism: when victory becomes possible, defeat-memory thins. I am not defending the archaeology; I am analyzing the commemorative lifecycle. If the audience rejects the case, the theory still holds on the Confederacy and Kosovo. I should have been clearer that this is a model of function, not a history lesson. The follow-up will ask if myth-based memory deserves the same analysis. I say yes, because the impact is real.
  **Soft:** Reliance on myth. **Follow-up:** Does truth matter?

  **7. Who:** Public History Practitioner **Lik:** Medium **Dam:** 3 **Inst:** Reframe
  **Objection:** You say plaques are sometimes dodges. When is a plaque enough, and when is it just hiding the problem?
  **Reply:** A plaque is a dodge when it tries to fix a vindication-fragile memory with context. If the statue itself is the problem because it glorifies a failed cause, adding text doesn't stop the glorification; it just annotates it. A plaque works when the memory is vindication-dependent—when the figure would be honored even if they had won. Then the context adds nuance. But if the statue only stands because the cause lost, a plaque admits the guilt while keeping the honor. That is inconsistent. Use the test: if the statue would come down in a victory scenario, a plaque won't save it in a defeat scenario. The follow-up will ask for a rule of thumb. I will say: if the plaque apologizes for the statue, the statue should go. If it explains the complexity, it might stay.
  **Soft:** Hard to distinguish in practice. **Follow-up:** Who writes the plaque?

