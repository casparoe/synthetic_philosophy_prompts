prompt: |-
  You are a professional philosopher with an unusual combination of experience: twenty years in analytic moral and political philosophy (collective intention, duties to the dead, historical injustice and repair) and roughly a decade as an outside adviser to museums, memorial sites and city heritage commissions working through contested-monument disputes. You have sat through a great many Q&A periods and you know that the questions a speaker actually gets are fixed by who is in the room, not by what is weakest in the argument.

  Think carefully before you write. Begin by brainstorming silently: generate fifteen to twenty candidate objections, tag each with the kind of person in my audience who would raise it, then cut down to the ten or eleven that are both likely and genuinely damaging, and only then order them by how much harm they would do if I fumbled them. Do not give me the brainstorming itself; give me the finished prep sheet.

  **The occasion.** I am giving a forty-minute talk with twenty-five minutes of discussion at a two-day symposium on contested public memory, hosted by a university center for ethics and public life in collaboration with a national museum association. I am a political philosopher, not a historian, and nearly everyone there knows I am an outsider to their fields, which is itself part of my exposure.

  **The audience, precisely.** About fifty people. Roughly half are public-history practitioners: senior curators, a city monuments officer who has run two live statue consultations, an NGO worker from a post-conflict memorial project. Their commitments are practical and procedural — they care about what a public body can defensibly do, what survives a consultation process, and what they can say to a grieving descendant community the next morning; they are allergic to anything that hands them a philosophical verdict they cannot translate into a process. A quarter are historians: one works on the American South and monument campaigns, one on nationalist myth-making in the Balkans, one on twentieth-century British memory. They care about evidence, about the difference between what happened and what was later made of it, and they will punish any claim that treats a received story as if it were the record. The philosophers present are a theorist of collective memory who holds that communities owe memory to the dead and to victims and who will hear any conclusion licensing forgetting as a betrayal; a younger person working on historical injustice and reparations, who will press me on who gets to decide; and one sceptic who regards memorial culture itself as a pathology and will think my account does not go nearly far enough. A local journalist who covered a recent removal is in the room, so one question will arrive in the form of a sentence that makes a bad headline.

  **My thesis.** The phrase "lost cause" should be a technical term, and it should be defined counterfactually rather than by defeat. Call a commemorative practice *vindication-dependent* when the community would still have reason to hold the memory had the cause won, and *vindication-fragile* when the defeat is doing the justificatory work — when the practice would have to be abandoned, or would have become something quite different and less serviceable, under victory. Defeats that are vindication-fragile in the strong sense I call *auspicious defeats*: losses that leave the community better furnished, identity-wise, than a win would have. I explain fragility by three mechanisms, which can combine: *untestedness*, where the loss spares the cause's professed ideals the test of having to be implemented and lived under; *moral alchemy*, where defeat converts a culpable project into a tragic one, so grief quietly displaces guilt; and *inheritance without succession*, where the memory is valuable precisely because it carries none of the burdens of the power the cause sought.

  **The four cases as I use them.** The Confederacy is my central case: vindication-fragile and auspicious, because a win would have forced the memorial practice to become either a state cult or an object of internal dissent, whereas the loss lets later generations inherit the cause without ever having to have run it. Masada I use stipulatively — I concede at the outset that the mass-suicide narrative rests largely on a single ancient source and is archaeologically contested — and my claim is only about commemorative shape: the defeat is the entire point, and later military success makes the memory awkward in a way it was not before, so its function thins as the state becomes secure. Kosovo 1389 is fragile in a different, active mode: the defeat is held as a pledge rather than an ending, so the memory is structured to keep a future claim alive. Dunkirk, I argue, is not a lost-cause memory in my sense at all: it is a deliverance memory, commemorated as that without which later victory would have been impossible, and had the war been lost the same events would have had to be remembered very differently. So my test does not condemn it — which I present as a feature, since myth and objectionable myth come apart on my account and the test marks where.

  **The payoff I claim.** The test is supposed to sort cases where removal is apt from cases where recontextualization or counter-monument is apt from cases where the object should simply stay, and to explain why adding an explanatory plaque sometimes feels like a dodge and sometimes does not.

  **What I want from you.** A prep sheet, not a defense of the view and not a summary of my argument. For each objection: who raises it; the objection in two or three sentences written in that person's own vocabulary, not in mine; likelihood (high, medium, low); damage if I handle it badly, on a scale of one to five; a reply of roughly 150 to 200 words written as I would actually say it aloud in two minutes — plain spoken, not journal prose; where that reply is soft and what the follow-up will be; and a one-word instruction at the end of each: concede, hold, or reframe. Then: the two or three things I should concede in the first two minutes of the talk, before anyone asks anything; the single reply that has to land if the view is to survive the session (my own guess is that it is the reply to the charge that my test is redundant, merely relabeling an independent moral verdict about the cause — confirm or overrule me); the weakest joint in my argument that I should volunteer rather than hope they miss (I suspect it is either that the "we" in "had we won" is partly constituted by the memory it is supposed to test, or that I need the cause's professed ideals to be identifiable independently of the myth); and finally, the question I am hoping nobody asks, with the answer I should give if someone does.

  Constraints: no citations, no further reading, no references to specific books, articles or authors — I have no library access where I am writing and cannot follow anything up, so every objection and reply must stand on its own reasoning. Do not include objections phrased in the idiom of decision theory, formal epistemology, or online rationalist culture; nobody in this room talks that way. Aim for 1,200 to 1,700 words. Do not ask me for clarification and do not restate my argument back to me; write the sheet.
