answer: |-
  Here is a complete section plan designed to generate the specific philosophical tension you're looking for without front-loading the theory.

  # Activity: "The Continuity Wager"

  **Goal:** Force students to make high-stakes decisions about "mental status" based on substrate vs. function, revealing inconsistencies in their intuition regarding *causal grain* and *counterfactual robustness*.
  **Time:** 75 Minutes
  **Class Size:** 18 Students (3 Groups of 6)
  **Materials:**
  *   Whiteboard (divided into 3 columns for 3 groups).
  *   3 "Budget Sheets" (paper).
  *   18 Green Clay Balls (or green sticky notes crumpled up) = **Careenium**.
  *   18 Red Poker Chips (or red sticky notes) = **Simmballs**.
  *   3 Large Envelopes labeled "MODULE X" = **Black Boxes**.
  *   1 Blender bag (or just a Ziploc with shredded green paper) = **Paste**.
  *   Candy or Bonus Credit slips for the winning team.

  ---

  ## 1. The Setup (0:00 – 0:10)
  **No Lecture.** Walk in and write on the board: **PATIENT STATUS: CRITICAL.**

  **The Scenario:**
  "Each group is an Ethics & Engineering Board for a hospital. You have one patient (The Subject). The Subject is currently made entirely of **Green Clay (Careenium)**. We know for a fact the Subject can 'care' (feel pain, love, etc.)."

  **The Rules:**
  1.  **Budget:** You start with **100 Credits**.
  2.  **Cost:** Green Clay parts cost **20 Credits** to maintain/replace. Red Chips cost **2 Credits**. Black Boxes cost **10 Credits**.
  3.  **Goal:** Keep the Subject 'Alive' (Certified as a Caring Mind) until the end of class with the most money left.
  4.  **The Catch:** If you certify a modification as 'Alive' and the majority of the other groups vote 'Dead', you are sued for malpractice. **Penalty: -50 Credits.**
  5.  **Jargon Ban:** You cannot use the words 'function', 'substrate', 'physical', or 'pattern' during the decision rounds. If you do, you lose 10 Credits.

  **Baseline:** Place 6 Green Clay balls in front of each group. "This is the brain. It works. It cares."

  ---

  ## 2. The Four Rounds (0:10 – 0:40)
  *Run these sequentially. Give groups 3 minutes to decide per round. They must write down their verdict (ALIVE/DEAD) and their Budget.*

  **Round 1: The Gradual Swap (Grain Test)**
  *   **Scenario:** "One Green Clay neuron has degraded. You can replace it with fresh Clay (20 Cr) or a Red Chip Simmball (2 Cr). The Chip mimics the input/output of that neuron exactly."
  *   **Action:** Groups swap 1 Green for 1 Red.
  *   **Decision:** Is the patient still ALIVE?
  *   **Expected Intuition:** Almost everyone says ALIVE. The cost savings are obvious, the risk feels negligible.

  **Round 2: The Block Swap (Grain/Opacity Test)**
  *   **Scenario:** "A large region (3 Green Clay balls) is failing. You can replace them with fresh Clay (60 Cr) OR one Black Box Envelope (10 Cr). The Envelope is guaranteed to produce the exact same outputs for the same inputs as the 3 balls combined."
  *   **Action:** Groups swap 3 Green for 1 Envelope.
  *   **Decision:** Is the patient still ALIVE?
  *   **Expected Intuition:** Hesitation. CS majors say ALIVE (it's just code). Goo-diggers say DEAD (it's a box). *Crucially:* Many who accepted Round 1 will balk here.
  *   **Facilitator Note:** If they hesitate, ask: "It does the same job. Why the price difference in your confidence?" Do not explain why. Just take the bet.

  **Round 3: The Paste (Organization Test)**
  *   **Scenario:** "Accident in the lab. The remaining Green Clay (3 balls) was dropped and ground up. It is now in this Ziploc bag. Total mass of Careenium is identical to the start. None was lost."
  *   **Action:** Show the shredded green paper bag.
  *   **Decision:** Is the patient still ALIVE?
  *   **Expected Intuition:** Overwhelmingly DEAD.
  *   **Facilitator Note:** This traps the "Goo" intuitionists. If they said the Black Box was DEAD because it lacked Goo, but the Paste is DEAD because it lacks *shape*, they have conceded organization matters.

  **Round 4: The Counterfactual (Robustness Test)**
  *   **Scenario:** "We have two Black Box options for the next repair."
      *   **Box A (Empiricist):** Has been tested on every input the patient has *actually encountered* so far. Matches 100%. Cost: 5 Cr.
      *   **Box B (Engineer):** Built from a schematic of the mind's logic. Guaranteed to match *all physically possible inputs*, even ones never tried. Cost: 15 Cr.
  *   **Decision:** If you must choose a box to keep them ALIVE, which do you trust? (Vote A or B).
  *   **Expected Intuition:** CS/Engineering will pick B (Robustness). Intuitionists might pick A (History) or neither.
  *   **The Trap:** If they pick B, they are betting on *causal structure*, not just observed history. If they pick neither, they don't trust the pattern at all.

  ---

  ## 3. The Lawsuit & Negotiation (0:40 – 0:55)
  **The Reveal of Disagreement:**
  Ask each group to announce their Round 2 (Black Box) verdict.
  *   *Likely Outcome:* Group 1 says ALIVE, Group 2 says DEAD.
  *   **The Lawsuit:** The groups that disagreed must now debate. The "Dead" voters must explain *what causal power* the Black Box is missing that the Red Chip (Round 1) had.
  *   **Constraint:** They still cannot use the banned words. They must describe *what the mind is doing*.
      *   *Bad Argument:* "It's not real stuff."
      *   *Good Argument:* "The box is just pretending. The clay is actually feeling it."
      *   *Better Argument:* "The clay is doing the work. The box is just tracking the work."

  **Payoff:**
  Calculate final budgets.
  *   Deduct 50 Credits for any "Malpractice" (where your ALIVE verdict was outvoted by the other 2 groups).
  *   Highest remaining budget wins the Candy/Bonus.
  *   *Tiebreaker:* The group that can best articulate *why* the Paste failed without using banned words.

  ---

  ## 4. The Debrief (0:55 – 1:15)
  *Now you can speak. This is where you map their experience to the philosophy.*

  **Step 1: Vocabulary Drop (5 mins)**
  *   "Green Clay" = **Substrate / Biological Naturalism.**
  *   "Red Chip/Black Box" = **Functionalism / Computationalism.**
  *   "The Guarantee" = **Counterfactual Robustness.**
  *   "The Work" = **Causal Efficacy.**

  **Step 2: Mapping the Tension (10 mins)**
  Draw two columns on the board: **Stuff** vs. **Pattern**.
  Ask the class to place their Round 1, 2, and 3 decisions on the board.

  *   **The Grain Problem (Round 1 vs 2):**
      *   "Most of you accepted the Red Chip (Round 1) but feared the Black Box (Round 2). Why? The amount of Goo removed was similar. The difference is *visibility*. With the chip, you can imagine it participating in the causal chain. With the box, it looks like a magic trick. You weren't worried about the *material*, you were worried that the *pattern* wasn't actually pushing the neurons, just mimicking them."
  *   **The Paste Problem (Round 3):**
      *   "If you said Paste is DEAD, you admitted that Goo alone isn't enough. Organization matters. So you aren't pure 'Stuff' theorists. You need Stuff + Arrangement."
  *   **The Counterfactual Problem (Round 4):**
      *   "If you chose Box B (Engineer), you value *what the system would do* over *what it has done*. That means you think the 'Mind' is a set of dispositions (function), not just a history of events."

  **Step 3: The Core Insight (5 mins)**
  "Today you felt a pull between two ideas:
  1.  **Causal Tracking:** The pattern is just a map. The Goo is the territory. The map doesn't drive the car. (This is why the Black Box felt scary).
  2.  **Causal Doing:** The pattern *is* the driver. The Goo is just the fuel. If the steering works, it doesn't matter if the wheel is wood or plastic. (This is why the Red Chip felt okay).

  The reading asks: **Does the symbol-level description push the physical substrate around?**
  If you voted 'Alive' for the Black Box, you think the description *is* the cause.
  If you voted 'Dead', you think the description is just a shadow cast by the Goo."

  ---

  ## Predictable Failures & Fixes

  **1. The "Obvious Functionalist" (CS/Engineering Majors)**
  *   **Behavior:** "This is silly. Obviously the Black Box is fine. It's just code. Why are we debating this?"
  *   **Fix:** Assign them the role of **Hospital Administrator** in Round 3. Tell them: "If you certify the Paste as Alive to save money, and the patient wakes up in pain, you go to jail." Force them to confront the *moral risk* of being wrong, not just the logical consistency. Ask: "Can you prove the Box feels pain, or just that it acts like it?"

  **2. The "Goo Digger" (Biological Essentialist)**
  *   **Behavior:** "If it's not meat, it's not a mind. Period."
  *   **Fix:** Hit them hard with Round 3 (Paste). "It's all meat. It's just blended. Why is blended meat dead but structured meat alive?" Force them to admit organization matters. Then ask: "If organization matters, could silicon be organized that way?"

  **3. The "Skeptic" (Refuses to Play)**
  *   **Behavior:** "Consciousness can't be decided by a vote. This premise is fake."
  *   **Fix:** Validate them. "You're right, it can't be decided by a vote. That's the point. You are the 'Hard Problem' advocate. Your job is to write down every time the other groups assume they *know* something they can't know. Report your list at the end." (Give them a specific role so they don't disengage).

  **4. The "Consistency Trap" Fails**
  *   **Behavior:** Groups change their minds mid-game without noticing.
  *   **Fix:** As facilitator, keep a public ledger on the whiteboard. "Group 1, in Round 1 you said 10% replacement is fine. Now you say 50% is not. What is the specific percentage where the soul vanishes? 12%? 13%?" Force them to defend the *gradient*.

  ---

  ## Honest Limitations (What this activity cannot do)

  1.  **It cannot solve the Hard Problem:** The activity reveals *our intuitions* about consciousness, not the *nature* of consciousness. You must explicitly state in the debrief: "We found out where *we* draw the line, not where the line actually exists in reality."
  2.  **It conflates Identity with Consciousness:** The game asks "Is the patient ALIVE?" which mixes "Is it the same person?" (Identity) with "Is it conscious?" (Phenomenology). Students will confuse these. You will need to untangle this in the last 5 minutes. (e.g., "You might be the same person, but do you feel pain?")
  3.  **It assumes "Caring" is Binary:** The game forces a Yes/No vote. In reality, consciousness might be a dimmer switch. If a student raises this, award them bonus points and write "Gradualism" on the board, but explain the game required binary choices to force conflict.
  4.  **The "Causal Work" Insight is Instructor-Dependent:** Students will feel the tension, but they likely won't articulate the "Pattern vs. Causal Power" distinction on their own. They will say "It feels fake." *You* have to translate "fake" into "lacking causal efficacy" during the debrief. The activity sets the table; you must serve the meal.
