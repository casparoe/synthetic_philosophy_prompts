answer: |-
  The bench is wide enough for four hips, but we sit close, thighs almost touching, grounding the circuit. The interface isn't visible—just a faint warmth at the base of the skull where the lattice knots into the cerebellum. It doesn't feel like technology. It feels like remembering something you haven't lived yet.

  I place my hands on the keys. No, *we* place our hands. My left hand is young, the skin smooth, the tendons quick. My right hand is old, the knuckles swollen with a weatherache that predicts rain three days before the sky knows. I am sitting on the left side of the bench. I am sitting on the right.

  "Ready?" she asks. Her voice vibrates in my throat.

  "Ready," I say. The word comes from both mouths, slightly out of phase, a stereo echo in a room with no walls.

  We lift into the opening measure of the *Liebestod*. It isn't a duet in the traditional sense. It is a single performance distributed across eight limbs. The lattice is open wide, procedural gates down. When she intends a chord, the motor cortex fires in me before the sound exists. When I anticipate a phrase, the muscle memory blooms in her. The goal is not synchronization. Synchronization implies two separate clocks ticking together. This is one clock with two faces.

  The music flows. It is heavy, viscous. I feel the history of the piece settling into the marrow of fingers that haven't existed for thirty years. I feel the impatience of youth rushing the tempo in fingers that have played this funeral march a thousand times.

  Measure forty-seven. The modulation. It requires a leap, a sudden shift of weight from the heel of the hand to the tip of the fifth finger. A fragile transition.

  I miss the note.

  The sound is wrong—a flat thud where a bell should ring. The silence that follows is louder than the chord.

  I feel the shame hit me. It is hot, prickly, located in the face. But whose face? The shame feels old. It tastes like copper and old tea. It belongs to the memory of a recital in Vienna, 1998, where a similar mistake shattered a career. But the shame also feels new, raw, the specific humiliation of a student disappointing a mentor.

  I try to locate the error. I reach back into the memory of the movement to find the source of the slip. Did my wrist stiffen? Did her signal lag?

  I remember deciding to hesitate. I remember *not* deciding.

  The memory is smooth, unbroken, but it has no owner. It is an indexical blind spot. The lattice didn't just share the command; it scrambled the tag. The neural signature of the mistake is woven from both cortices. I cannot find the boundary where her intention ended and my execution began. There is no copy log. There is only the event, happening in us.

  "I missed it," I say.

  "We missed it," she says.

  We are both speaking. Or neither of us is.

  I look down at the hands resting on the lap. The left one is trembling. The right one is still. I try to will the left hand to stop. It continues. I try to will the right hand to move. It stays heavy. The ownership has slid. The 'I' that is controlling the tremor is not the 'I' that is observing it.

  "It was the leap," I say, but I am remembering the leap as if I taught it to myself. I remember the geometry of the keyboard from the perspective of someone five-foot-four and someone six-foot-one simultaneously. The distance between the keys is both a stretch and a shrink.

  "Measure forty-seven is a trap," she says. Her voice is in my head. Or mine is in hers. "You have to let the hand fall before you think."

  "I know," I say. "I taught you that."

  The sentence hangs in the air, impossible. I am the student. I am the teacher. The pattern of the knowledge is the same pattern as the self. If the knowledge is shared, the self must be porous.

  I close my eyes. The room disappears. There is only the kinesthetic map of the piano. In the dark, I am a single entity with four hands and two histories. The mistake in measure forty-seven isn't a glitch. It's a seam. It's where the stitching shows.

  When I open my eyes, the dust motes are settling. The ache in the right knuckles has spread to my left wrist. The lattice hums, a quiet biological tide. I don't know who is going to lift the hands to try again. I only know that when we do, the same fingers will press the same keys, and the same soul will miss the note, or hit it, perfectly together.

  "Again," I say.

  "Again," she echoes.

  We breathe in. The chest expands. I don't know whose air I am taking. It doesn't matter. The music is waiting, and it belongs to neither of us, and all of us. I lift the hands. They are mine. They are ours. I begin.
