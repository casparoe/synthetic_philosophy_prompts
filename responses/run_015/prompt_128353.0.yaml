answer: |-
  You have correctly identified that the current regulatory and certification package is not the application of a single, coherent ethical theory. It is a **bricolage**: a pragmatic assembly of different ethical fragments glued together by economic necessity and auditability constraints.

  Here is the conceptual sorting of that package, broken down by the specific tensions you identified.

  ### 1. The Presupposed Theory: Acute Negative Utilitarianism + Operationalism

  The dominant theory underpinning current aquaculture standards is not "welfare" in the sense of *flourishing* (eudaimonia), nor is it a rights-based view. It is a specific, narrowed slice of **Negative Utilitarianism** combined with **Methodological Behaviorism**.

  *   **Negative Utilitarianism:** The moral goal is strictly the minimization of suffering (pain/distress), not the maximization of well-being. This explains why the standards focus heavily on the *end* of life. If the animal lives a "neutral" life and dies without pain, the moral ledger is considered balanced. It presupposes that a life of confinement is not inherently harmful, provided acute pain events are minimized.
  *   **Operationalism:** Welfare is defined only by what can be operationally measured. If you cannot measure it on a processing line, it does not exist for the purpose of the standard. This is why density (kilos/m³) is a proxy for welfare, rather than individual behavioral freedom. Density is auditable; "frustration" is not.

  This theory presupposes that **death is not a harm** provided the *process* of dying is painless. It sidesteps the "deprivation account" of death (that death harms by taking away a future) entirely. If death were considered a harm in itself, the standard would have to justify the killing, not just the method of killing. By ignoring deprivation, the standards grant a "moral license" to kill based solely on the technical competence of the slaughter.

  ### 2. The Inconsistency: The "Life/Death" Split

  You asked if there is one theory that makes the package coherent. The answer is **no**. The package contains a fundamental contradiction between the **Slaughter Standards** and the **Broodstock/Sentience Recognitions**.

  *   **The Slaughter Logic:** Treats the animal as a biological unit where the only moral event horizon is the transition from sensible to insensible. The months of life prior are treated as a "black box" of moral neutrality.
  *   **The Ablation/Sentience Logic:** The ban on eyestalk ablation and the legal recognition of sentience in decapods admit that *chronic states* and *bodily integrity* matter over time. Ablation is not painful only at the moment of cutting; it alters the animal's hormonal state and behavior for the rest of its life.

  **Why the inconsistency exists:**
  This is not theoretical coherence; it is **risk management**.
  1.  **Consumer Visibility:** Slaughter is the point where the product becomes "meat." Consumers worry about cruelty at the point of purchase. Slaughter standards are designed to reassure the buyer.
  2.  **Scientific Certainty Gradients:** It is easier to reach consensus on fish brainstem reflexes (gill movement) than on the chronic psychological impact of crowding. The ablation bans emerged later, driven by specific campaigning on *visible* mutilation, whereas the "suffering of crowding" remains abstract.
  3.  **Economic Friction:** Regulating the *life* (density, enrichment, individual tracking) is exponentially more expensive than regulating the *death* (a machine that stuns). The standards regulate the life only where it impacts the quality of the meat (e.g., fasting to prevent gut rupture) or where the practice is visibly grotesque (ablation).

  ### 3. The Unit of Analysis: Statistical Welfare

  You noted that welfare is scored at the pen/crop level. This presupposes that **welfare is an aggregate property**, not an individual one.

  *   **The Theory:** This is a form of **Act Utilitarianism applied to populations**. If 95% of the crop is "healthy" and 5% are diseased/deformed, the crop is certified. The suffering of the 5% is mathematically outvoted by the efficiency of the 95%.
  *   **The Implication:** This treats individual animals as interchangeable tokens. In a rights-based framework, one violated individual invalidates the system. In the current aquaculture framework, a certain percentage of mortality and morbidity is built into the "shrinkage" calculations of the business model. The standards simply cap the acceptable loss.
  *   **Why:** Individual monitoring is physically impossible for pelagic shrimp or high-density finfish. To require individual welfare assessment would require a complete technological overhaul of the industry (e.g., individual tagging, low-density tanks). The current standards are designed to fit the *existing* technology, not to drive new technology.

  ### 4. The Epistemology: Methodological Behaviorism

  Your concern about the behavioral tests (unresponsiveness = insensibility) is philosophically sound. The standards do indeed rely on a **Behaviorist Epistemology**.

  *   **The Assumption:** Consciousness is inferred solely from motor output. If the animal does not react to a stimulus (prodding, rolling), it is assumed not to experience the stimulus.
  *   **The Flaw:** As you noted with the pig example, this fails to account for paralysis, sedation, or "locked-in" states. However, in fish slaughter, the specific reflexes chosen (righting reflex, rhythmic gill movement) are controlled by the brainstem. The operational assumption is that if the brainstem is destroyed or inhibited, the seat of consciousness is gone.
  *   **The Compatibility:** This is compatible with a non-behaviorist ontology *only if* you accept that the specific behaviors tested are perfect proxies for consciousness. Most neuroscientists would agree they are *good* proxies for brain death, but not necessarily for *insensibility* during the transition.
  *   **Why this persists:** It is the only epistemology that works at line speed. You cannot ask the fish. You cannot scan its brain. You can only watch it twitch. The standard prioritizes **intersubjective verifiability** (two auditors can agree the fish didn't move) over **ontological truth** (was the fish actually feeling pain?).

  ### 5. The Counterfactual: What if we changed the theory?

  You asked if adopting a deprivation view or a desire-based view would collapse the industry.

  *   **The Deprivation View:** If death is the primary harm (because it deprives the animal of a future), then **industrial aquaculture is inherently illegitimate**, regardless of how humane the slaughter is. The industry relies on the "Non-Identity Problem" defense: *These animals would not have existed at all if we hadn't bred them; therefore, a short life is better than non-existence.*
      *   If you reject this defense (e.g., arguing that a life cut short is a harm regardless of the alternative), the industry cannot be reformed; it must be abolished.
  *   **The Desire-Based View:** If welfare is about satisfying preferences (space, mate choice, foraging), the current high-density model fails immediately. Shrimp have complex foraging and territorial behaviors that are impossible in a slurry tank.
      *   **Result:** You would not get "reformed standards." You would get a shift to **extensive** rather than **intensive** systems. Production volumes would drop by orders of magnitude. Prices would skyrocket. It would become a luxury good, not a commodity.
  *   **Individual Lifetime Welfare:** If you require individual welfare tracking:
      *   **Traceability:** You need chain-of-custody for every animal.
      *   **Density:** You need low enough density to observe individuals.
      *   **Result:** This collapses the "biomass" model of aquaculture. It turns farming into something closer to husbandry of individual creatures.

  ### Summary of the Conceptual Landscape

  The package you are reading is not an ethical framework; it is a **technology of moral permission**.

  1.  **It locates the moral problem in dying** because that is the only point where the human control is absolute and the metric is binary (dead/alive, stunned/not stunned).
  2.  **It treats welfare as aggregate** because individual accounting is economically prohibitive at the scale of billions of animals.
  3.  **It uses behavioral proxies** because internal states are inaccessible to auditors.
  4.  **It is inconsistent** because it tries to accommodate evolving science on sentience (ablation bans) without disrupting the economic model of mass production (density/fasting).

  If you applied a consistent ethical theory (whether rights-based, deprivation-based, or robust preference utilitarianism) to the entire lifecycle of the animal, **industrial aquaculture as currently constituted would not be reformable.** It would either have to shrink drastically in scale or cease to exist. The standards exist precisely to prevent that conclusion from being reached, by narrowing the definition of "welfare" to fit the capabilities of the industry, rather than expanding the industry to fit the needs of the welfare.
