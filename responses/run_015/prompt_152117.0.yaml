prompt: |-
  I am writing the second chapter of my thesis, on whether the information idiom in molecular biology is doing explanatory work or is an elaborate heuristic, and I have got myself into a position I cannot accept and cannot locate the fault in. The argument below is my reconstruction of a line I have been pushing in our reading group; several people there are molecular biologists who are impatient with philosophers telling them their practice is confused, and I would rather not have to tell them that either. I would be grateful for a diagnosis.

  (1) Molecular biology is committed to DNA carrying information in a sense that is not merely decorative: codons specify amino acids, regions are annotated as coding or non-coding, polymerases are described as reading, and mutations are described as errors that proofreading and repair machinery corrects. If this talk were only a façon de parler, the chapter would be short; I take it that it is not.

  (2) Suppose DNA carries information merely in the sense in which one state carries information about another whenever the two are reliably correlated, with nothing required to be reading the one as a sign of the other. Then information is everywhere: tree rings carry information about rainfall, smoke carries information about fire, a footprint carries information about the animal that made it. In that sense genes carry information, but so does everything, and the idiom seems to add nothing to ordinary causal talk. So on the correlational reading the notion is trivial and does none of the work biology wants from it.

  (3) For the notion to be distinctive, it must be the sort of thing that can go wrong. A codon can specify the wrong amino acid; a sequence can mislead the machinery that acts on it; a message can be corrupted. Pure correlation cannot be wrong. A footprint is never a false footprint, and tree rings do not lie. So genetic information must be semantic: it must have content capable of misrepresentation.

  (4) The only naturalistically respectable way to get content capable of misrepresentation, so far as I can see, is to fix a state's content by its function, understood as what it was selected to do. A given codon means leucine rather than merely causing leucine to be inserted because codons of that type were selected for producing leucine. Selection history supplies the distinction between what a state does and what it is supposed to do, and misrepresentation is doing the latter's failing.

  (5) But then anything lacking the relevant selection history carries no information at all: newly arisen sequences on their first replication cycle, sequences whose effects are incidental by-products of neighbouring function, transcripts that happen to be produced and do nothing, and, most awkwardly, the constructs of synthetic biology, which molecular biologists describe in perfectly informational terms on the basis of a design and not of a history. Yet these descriptions are empirically fruitful, which they should not be if they are empty.

  (6) Worse, on this account a code needs a reader, and in the actual cell the reader is itself part of the message: the transfer RNAs and the enzymes that charge them are themselves products of the very system they interpret. The interpretation of the code appears to be encoded in the code, which looks less like a grounding of content than like a circle.

  (7) So either genetic information is trivial, or it is restricted in a way that makes a great deal of successful molecular biology illegitimate, or it rests on a circular account of interpretation. I cannot accept any of the three, and my own suspicion is that something illegitimate happens in the move from (3) to (4): I have been offered the reply that genes are distinctive not as bearers of content but as causes of a specific kind — causes that make a difference to which outcome occurs, in a way that cytoplasm or ambient temperature does not — and I do not see how this answers the difficulty, since a specific cause cannot be mis-specific, and my worry in (3) was precisely about being wrong.

  Which step do you reject, why does it look fine as written, and what does rejecting it cost me? I would like, if I can, to retain (1) and (5) — I do not want to tell the molecular biologists in the room that their practice is confused — and I am more willing than not to give up (4) if something better can be put in its place. Please price the alternatives as well as naming the step: in particular, tell me what I would have to say about mutations being errors, and about the arbitrariness of the codon-to-amino-acid mapping, on each of the options you canvass.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** Writing Chapter 2 of a thesis on the "information idiom" in molecular biology (explanatory work vs. heuristic).
      *   **Audience:** Molecular biologists in a reading group who are impatient with philosophers claiming their practice is confused.
      *   **Goal:** Diagnose a specific argument reconstruction (steps 1-7) that leads to an unacceptable trilemma (triviality, illegitimacy of successful practice, or circularity).
      *   **Constraints:** Wants to retain (1) (biology uses information seriously) and (5) (synthetic biology/new sequences work informationally without selection history). Willing to sacrifice (4) (teleosemantics/selection history is the *only* way to get content).
      *   **Specific Questions:** Which step to reject? Why does it look fine? What does rejecting it cost? specifically regarding mutations as errors and codon arbitrariness.

  2.  **Deconstruct the Argument:**
      *   (1) Biology uses information talk non-trivially (reading, errors, coding). *Constraint: Keep.*
      *   (2) Pure correlation (Shannon/causal) is trivial (tree rings, smoke). *Premise.*
      *   (3) To be distinctive, information must allow misrepresentation (semantic content). *Premise.*
      *   (4) Naturalistic content requires selection history (Teleosemantics/Millikan). *The Pivot Point.*
      *   (5) Selection history excludes new sequences/synthetic biology, but biology treats them as informational. *Constraint: Keep (the phenomenon), Reject (the implication that the theory fails).*
      *   (6) Circularity problem (readers are products of the system). *Premise.*
      *   (7) Trilemma: Trivial, Illegitimate, or Circular. *Conclusion.*

  3.  **Identify the Fault:**
      *   The user suspects the move from (3) to (4). This is correct. Step (4) assumes *Teleosemantics* is the only naturalistic game in town. This is a strong philosophical claim that is highly contested.
      *   The conflict arises because Teleosemantics ties meaning to *history*, but Molecular Biology treats meaning as *structural/contextual* (especially in synthetic biology).
      *   The user wants to save the practice (1 & 5). This means the theory of information needs to accommodate synthetic biology and new mutations without relying solely on evolutionary history.

  4.  **Evaluate Alternatives to Step (4):**
      *   *Option A: Causal/Counterfactual Specificity (Weber, Woodward).* Focus on "difference making."
          *   *Pros:* Naturalistic, fits synthetic biology (design specifies cause).
          *   *Cons:* User worries this doesn't capture "error" (misrepresentation). A cause just *is* what it does.
      *   *Option B: Structural/Combinatorial Information (Godfrey-Smith, Sterelny).* Focus on the complexity and arbitrary mapping.
          *   *Pros:* Handles arbitrariness well.
          *   *Cons:* Still struggles with "error" without norms.
      *   *Option C: Contextual/Functional Norms (without deep history).* Focus on the *system's current organization* rather than evolutionary history.
          *   *Pros:* Saves synthetic biology (designer intent + system function). Saves "error" (deviation from system norm).
          *   *Cons:* Risks circularity (who sets the norm?).

  5.  **Develop the Diagnosis:**
      *   **Reject Step (4).** It conflates "semantic content" with "evolutionary teleosemantics."
      *   **Why it looks fine:** It's the dominant naturalistic account (Millikan, Dretske). It solves the "disjunction problem" (why 'cow' means cow and not 'cow-or-horse-on-a-dark-night').
      *   **Cost of Rejecting:** Need a new account of norms/error that isn't purely historical.

  6.  **Address the Specific Constraints (Mutations & Arbitrariness):**
      *   *Mutations as Errors:* If not historical selection, what makes a mutation an "error"?
          *   *Solution:* System-maintained norms. The repair machinery has a *current* functional standard (fidelity to the template), not just a historical one. In synthetic biology, the "error" is deviation from the *design specification*, which functions as the norm.
      *   *Codon Arbitrariness:* Why is UUU Phenylalanine?
          *   *Solution:* It's arbitrary relative to chemistry, but fixed by the *current* translational machinery. The "code" is defined by the interaction of tRNA/synthetases *now*, not just how they evolved.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Validate the user's intuition. The trap is indeed Step (4).
      *   *Diagnosis:* Step (4) commits the "Teleosemantic Fallacy" (assuming history is the *only* source of norms).
      *   *Alternative 1: Causal Specificity (Weber).*
          *   *View:* Information = Specific Difference Making.
          *   *Cost:* Hard to explain "error" without norms. "Error" becomes "unexpected outcome."
          *   *Mutations:* "Error" = deviation from expected causal path.
          *   *Arbitrariness:* Irrelevant. Only causal specificity matters.
      *   *Alternative 2: System-Relative Norms (Functionalism/Design Stance).*
          *   *View:* Norms come from the *current* organizational closure or design intent, not just phylogeny.
          *   *Cost:* Need to explain where "design" norms come from in natural cells without history. (Answer: Organizational self-maintenance).
          *   *Mutations:* "Error" = failure of maintenance machinery relative to its current constraint.
          *   *Arbitrariness:* Fixed by the current machinery (the "reader").
      *   *Alternative 3: The "Interpreter" is the Context (Code without History).*
          *   *View:* Information exists relative to a mechanism that processes it.
          *   *Cost:* Risks circularity (Step 6), but can be mitigated by bootstrapping.
      *   *Recommendation:* Go with a hybrid of Causal Specificity + System Norms. This saves (1) and (5).

      *   *Refining the "Error" explanation:* This is the crux. If I reject (4), how do I keep "error"?
          *   In synthetic biology: Error is deviation from *design intent*.
          *   In natural biology: Error is deviation from *template fidelity* maintained by the system. The system *acts as if* there is a norm.
          *   Philosophical move: Distinguish *etiological function* (history) from *causal role function* (current contribution). Molecular biologists use the latter.

  8.  **Final Polish:**
      *   Ensure tone is academic but helpful.
      *   Make sure to explicitly answer "Which step do you reject?", "Why does it look fine?", "What does it cost?", and the specific questions about mutations/arbitrariness.
      *   Check against the constraint: Do not tell biologists they are confused. The philosophy must *clarify* their practice, not correct it.

      *(Self-Correction during drafting)*: I need to be careful with Step (6). The user worries about circularity (reader encoded in message). If I reject (4), does (6) dissolve? Yes, because if meaning isn't fixed by history, the fact that the reader is produced by the system isn't a vicious circle, it's a *bootstrapping* problem (which systems biology solves). I should mention this.

      *(Refining the "Error" point)*: The user says "a specific cause cannot be mis-specific." This is the core philosophical block. I need to show how a cause can be "wrong" relative to a *constraint* without needing evolutionary history. The constraint is the *mechanism's tolerance*. A mutation is an error because the polymerase *mechanism* is designed (by evolution or engineer) to reject it. The norm is immanent in the mechanism's structure.

  9.  **Final Structure:**
      1.  Diagnosis: Step (4) is the culprit.
      2.  Why it looks plausible (Teleosemantics dominance).
      3.  The Alternative: Causal Role Functions + Design Stance.
      4.  Pricing the alternative (Costs/Benefits).
      5.  Addressing Mutations and Arbitrariness.
      6.  Addressing the Circularity (Step 6).
      7.  Conclusion for the Thesis.

  10. (Final check against constraints): Retain (1) and (5). Yes. Give up (4). Yes. Price alternatives. Yes.

