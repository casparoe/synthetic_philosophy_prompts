  **JOINT STATEMENT ON PRINCIPLES OF HERITAGE RESTITUTION**
  **Signed by the Working Group on Adversarial Collaboration in Heritage Ethics**
  **Date: October 24, 2023**

  **I. AGREED CLAIMS OF FACT AND CONTEXT**

  1.  **Historical Circumstances:** The parties agree that the Benin Bronzes were removed during the 1897 British punitive expedition, an act of military confiscation widely documented as coercive. The parties agree that the Parthenon Sculptures were removed in the early 19th century under Ottoman authority, a jurisdiction whose legitimacy to consent on behalf of a modern Greek national identity is contested by both camps.
  2.  **Conservation Capacity:** Current data indicates that major holding museums in North America and Western Europe generally maintain superior climate control, security infrastructure, and conservation staffing compared to the majority of proposed recipient institutions in the Global South, though this gap is narrowing in specific flagship cases.
  3.  **Justice Frameworks:** The parties distinguish between *corrective justice* (addressing the moral wrong of the original taking) and *distributive justice* (allocating current custodianship to maximize access or utility). Both camps agree these are distinct moral considerations that may pull in opposite directions.
  4.  **Physical Risk:** Deaccessioning, packing, and long-distance transport of fragile cultural objects carry a non-zero probability of physical damage. Both camps agree that risk mitigation protocols exist but cannot guarantee zero harm.
  5.  **Boundary Case Parameters:** Both camps accept the "Defunct Polity Collection" as a valid test case: artifacts removed in the 19th century from a sovereign entity that no longer exists, whose cultural descendants are now citizens of three modern nation-states with competing custodial claims and no unified political structure.

  **II. RESIDUAL DISAGREEMENTS**

  | Issue | State-Succession Restitutionists (SSR) | Living-Community Preservationists (LCP) | Dispute Type |
  | :--- | :--- | :--- | :--- |
  | **Primary Claimant** | Restitution claims validly reside only with the modern sovereign state that succeeds the original polity. | Restitution claims reside with the living cultural community maintaining practice, regardless of current political borders. | Substantive |
  | **State Legitimacy** | The modern state is the necessary legal and moral proxy for its historical predecessor and current citizens. | The modern state is a contingent administrator; it holds no inherent moral priority over specific cultural groups or safety metrics. | Substantive |
  | **Risk Threshold** | Risk of damage is a logistical constraint to be managed, not a moral veto on restitution. | Risk of damage is a moral veto; if preservation cannot be assured, retention by the holding institution is obligatory. | Substantive |
  | **Definition of "Harm"** | Harm is primarily the continued deprivation of property and sovereignty caused by retention. | Harm includes physical degradation of the object and severance from living ritual use. | Verbal |
  | **Universal Access** | Access is best secured through state-to-state loans and digital replication after return. | Access is best secured by keeping objects where visitor numbers and conservation standards are highest. | Substantive |

  **III. CRUXES AND EMPIRICAL TESTS**

  To resolve substantive disagreements, the parties identify three cruxes where empirical evidence could shift probability assessments. For each crux, a concrete comparison is specified, along with each camp's prediction of what the evidence demonstrates.

  **Crux 1: Is legitimate state succession a necessary condition for restitution?**
  *   **The Test:** The disposition of the **Defunct Polity Collection**.
  *   **Empirical Case:** A consortium of museums proposes transferring the collection to a joint custodial trust managed by cultural ministries of the three modern nation-states containing the descendants, rather than a single national museum.
  *   **SSR Prediction:** This arrangement will fail to satisfy corrective justice because no single state accepts liability or sovereignty. SSR predicts the collection will remain in the holding museums until a single successor state is recognized.
  *   **LCP Prediction:** This arrangement will satisfy distributive justice and cultural continuity. LCP predicts that split custodianship aligned with descendant communities will result in higher community engagement metrics than retention in a foreign universal museum.

  **Crux 2: Does a present cultural community's living practice create an independent custodial claim regardless of state borders?**
  *   **The Test:** The **Benin Royal Court vs. Nigerian Federal Government** dynamic.
  *   **Empirical Case:** Comparison of visitor access and ritual usage of Bronzes returned to the Nigerian National Commission for Museums and Monuments versus those returned directly to the Oba of Benin's private custody (2022–2024 data).
  *   **SSR Prediction:** State custody ensures broader public access and legal protection. SSR predicts items held by the Federal Government will show higher public viewing hours and stricter legal protection against resale than those held by the Royal Court.
  *   **LCP Prediction:** Community custody ensures cultural vitality. LCP predicts items held by the Royal Court will show higher frequency of ritual use and deeper local community engagement, validating the claim that living practice outweighs state bureaucracy.

  **Crux 3: Can risk of damage in transit ever be a decisive moral reason for retention?**
  *   **The Test:** **Conservation Stability Metrics** of repatriated versus retained objects.
  *   **Empirical Case:** A five-year longitudinal study comparing the physical condition (corrosion rates, structural integrity) of Benin Bronzes returned to Nigeria versus comparable bronzes retained in European institutions.
  *   **SSR Prediction:** Conservation gaps are manageable. SSR predicts no statistically significant difference in degradation rates between returned and retained items after five years, proving risk is not a decisive veto.
  *   **LCP Prediction:** Conservation gaps are critical. LCP predicts returned items will show measurably higher degradation rates due to environmental instability, proving that physical preservation must trump corrective justice when the risk threshold is exceeded.
