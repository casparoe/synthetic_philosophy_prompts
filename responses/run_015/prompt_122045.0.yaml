answer: |-
  1. Your model treats politeness norms as error-correction signals rather than expressions of内在 value. But for an error-correction mechanism to function, the interlocutor must first detect an error. In the absence of explicit negotiation, what specific feedback loop allows a speaker to recognize that their level of directness has generated a calibration error rather than simply delivering a preferred truth?

  2. Consider an identical utterance—say, a blunt critique of a host's cooking. In Amsterdam, this registers as honest coordination; in Tokyo, it registers as a rude disruption. If the underlying game is the same, how does your model explain this valence shift without collapsing into mere relativism where "accuracy" is defined arbitrarily by local custom?
     *Follow-up:* I anticipate you will appeal to "local equilibrium conditions" to resolve this. But if the equilibrium itself dictates what counts as accurate signaling, doesn't that render the calibration thesis normative only relative to the group, undermining your claim that white lies are objectively wrong because they degrade accuracy?

  3. In any coordination game, there is a cost to adjusting one's position. When calibration requires a shift in behavior—for example, when a subordinate must decode the indirectness of a superior—who bears the cognitive load of that error correction? Is your model compatible with power asymmetries where one party is systematically required to do more calibration work than the other?

  4. You argue that white lies are wrong because they inject noise into the calibration loop. However, one might argue that small deceptions are harmless, or even beneficial, if they preserve social harmony and prevent unnecessary friction.
     *Follow-up:* If you maintain that harmony-preservation via deception is still a moral failure, are you not implying that harmony itself is a calibration failure whenever it requires the systematic misrepresentation of preference intensity? Does your framework leave any room for socially useful fictions that stabilize interaction without revealing underlying preferences?

  5. Social norms are not static; equilibria shift over time. If politeness is a stable coordination strategy, what mechanism within your model explains norm change? Does calibration error drive evolutionary drift in politeness norms, or must we appeal to external factors outside the coordination game to explain why a society moves from indirect to direct norms, or vice versa?

  6. Your theory relies on shared history and feedback to maintain accuracy. Yet, consider high-stakes boundary cases: one-off interactions with strangers, or text-based communication lacking paralinguistic feedback. In these contexts, calibration seems impossible because the loop is broken. How does the agent determine the correct signaling strategy ex nihilo?
     *Follow-up:* You will likely invoke "default protocols" to handle these null-context scenarios. But where do these defaults come from if not from prior calibration? If they are innate or culturally pre-loaded, doesn't that suggest the calibration game is resting on a foundation of uncalibrated assumptions?

  7. Does the internal sincerity of the speaker matter on your account? If I use indirectness to signal a preference I do not actually hold, but I do so consistently enough that my interlocutor successfully calibrates their expectations to my behavior, have I violated the moral constraint of your thesis? Is the wrongness located in the mismatch between belief and speech, or purely in the degradation of the shared signal?

  8. Ultimately, you seem to prioritize accurate calibration over competing values such as kindness or face-saving. Why should coordination accuracy take normative priority over the immediate emotional well-being of the interlocutor?
     *Follow-up:* I suspect you will reply that kindness is just long-run calibration—that hurting someone now degrades trust later. But if I can preserve someone's dignity today through a lie that is never discovered, thereby causing no future coordination error, your long-run argument fails. In that specific case, why does calibration still trump kindness?

  9. Is there a pathology of over-calibration? If interlocutors become hyper-sensitive to the error-correction signals, constantly adjusting for potential misinterpretations, does the system become paralyzed by noise? At what point does the effort to maintain perfect calibration interfere with the primary goals of the interaction itself?

  10. For listeners navigating cross-cultural contexts where equilibria clash, what is the practical prescription of the calibration thesis? Should they attempt to adopt the local equilibrium entirely, or is there a third option—a meta-calibration strategy—that allows them to signal their status as an outsider without breaking the coordination game entirely?
