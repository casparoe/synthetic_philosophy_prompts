answer: |-
  # Metaphysical Taxonomy of the Self-Referential Loop

  **Instructions:** Navigate the following decision tree by answering each scenario-based question with **Yes** or **No**. Follow the branch corresponding to your answer until you reach a terminal leaf. Each leaf represents a distinct metaphysical commitment regarding the nature of the "I" as a strange loop.

  ---

  ### **Q1 (Root): Substrate Independence**
  **Scenario:** If your neurons were replaced one by one with functionally identical synthetic units over a decade, would the same self-referential loop persist?

  *   **NO** → Go to **Q2**.
  *   **YES** → Go to **Q3**.

  ---

  ### **Q2: Biological Necessity vs. Historical Continuity**
  **Scenario:** Given that the loop cannot survive synthetic replacement, does its persistence require the continuous causal history of the original biological organism, such that a perfect biological clone created at birth would not share your identity?

  *   **YES** → **Leaf 1: Strict Biological-Continuity View**
      *   **Diagnosis:** The loop is an emergent property strictly bound to the specific spatiotemporal history of the original biological substrate. Cross-substrate instantiation is metaphysically impossible.
  *   **NO** → **Leaf 2: Biological Patternism (Unexplored)**
      *   **Diagnosis:** This position claims the loop requires biological material but not specific historical continuity (e.g., a clone would be you). This is likely **unstable**: if history does not matter, it is unclear why the chemical substrate should matter over function.

  ---

  ### **Q3: Causal History vs. Pattern Copying**
  **Scenario:** Suppose a perfect digital copy of your mental state is created instantaneously while you sleep, without destroying the original. Does the "I" loop exist in the copy as *you*?

  *   **NO** (The copy is a distinct entity; the loop requires an unbroken chain) → Go to **Q4**.
  *   **YES** (The pattern defines the loop; copying transfers identity) → Go to **Q5**.

  ---

  ### **Q4: Ontological Status of the Bounded Loop**
  **Scenario:** Since you deny the copy is you, is the "I" loop a genuine ontological entity that is bound by this causal chain, or is the chain only required to maintain a useful fiction?

  *   **YES** (Genuine Entity) → **Leaf 3: Hybrid "Bounded Loop" Position**
      *   **Diagnosis:** The loop is real and self-referential but cannot survive discontinuous copying. Gradual replacement is permissible, but teleportation is death. This preserves intuition about continuity without requiring biological specificity.
  *   **NO** (Useful Fiction) → **Leaf 4: Causal-Functionalist Fictionalism**
      *   **Diagnosis:** The loop is not real, yet the fiction only holds if causal history is preserved. This position is **potentially incoherent**: if the self is merely a fiction, the metaphysical requirement for causal continuity lacks a truth-maker.

  ---

  ### **Q5: Localization of the Symbol**
  **Scenario:** In the digital copy where the loop persists, is the symbol "I" a singular token located in a specific control node, or is it a distributed pattern across the substrate?

  *   **SINGULAR TOKEN** → **Leaf 5: Homuncular Patternism (Incoherent)**
      *   **Diagnosis:** This posits a specific locus for the self-referential symbol. It is generally considered **incoherent** within strange loop theory, as it invites an infinite regress (a "little man" inside the head reading the symbol).
  *   **DISTRIBUTED PATTERN** → Go to **Q6**.

  ---

  ### **Q6: Metaphysical Weight of the Loop**
  **Scenario:** Given the loop is a distributed pattern that survives copying, does the "I" symbol track a real entity within the system, or is it merely a descriptive overlay with no metaphysical weight?

  *   **YES** (Tracks a Real Entity) → **Leaf 6: Substrate-Independent Pattern View (Hofstadter)**
      *   **Diagnosis:** The self is a real, causally efficacious strange loop. Identity is determined solely by the isomorphism of the pattern, regardless of substrate or history.
  *   **NO** (Descriptive Overlay) → Go to **Q7**.

  ---

  ### **Q7: Role of Autobiographical Narrative**
  **Scenario:** If the loop is merely a descriptive overlay, is autobiographical narrative continuity a necessary condition for the loop's survival, or is the loop merely a momentary fiction regardless of story?

  *   **YES** (Narrative Necessary) → **Leaf 7: Narrative-Constructivist View**
      *   **Diagnosis:** The loop accepts the self as a descriptive tool but denies it tracks a real entity. Survival depends on the continuity of the story told, not just the functional pattern.
  *   **NO** (Narrative Not Necessary) → **Leaf 8: Eliminativist View**
      *   **Diagnosis:** The loop is a useful fiction with no metaphysical weight, and narrative continuity is irrelevant. The "self" is fully illusory, retained only for linguistic convenience.

  ---

  ### **Note on Indistinguishable Leaves**
  **Leaf 4 (Causal-Functionalist Fictionalism)** and **Leaf 8 (Eliminativist View)** may be difficult to separate in practice. Both deny the metaphysical reality of the self. They differ only in that Leaf 4 imposes a causal history constraint on the fiction itself, whereas Leaf 8 does not. Students should consider whether a fiction that requires causal history is meaningfully distinct from a fiction that does not.
