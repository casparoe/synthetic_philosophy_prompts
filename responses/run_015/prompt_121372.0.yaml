      Map the roles: the witness corresponds to subpersonal sensory transduction, the examiner to high-level beliefs, the cross-examination to top-down processing modulation, the jury to the conscious subject's doxastic system, and the rules of evidence to norms of justification. The mapping breaks primarily on independence and transparency. In law, the witness's observation is causally independent of the examiner's questions; the lawyer frames the report but does not alter the event witnessed. In cognitive penetration, the "examiner" (belief) constitutively alters the content of the "testimony" (experience) itself, meaning the evidence is no longer independent of the hypothesis it is meant to justify. Furthermore, legal cross-examination is an overt, regulated procedure known to the jury, whereas cognitive penetration is subpersonal and opaque, preventing the "jury" from weighting the evidence appropriately against potential bias. The analogy quietly imports the adversarial nature of legal scrutiny, implying a truth-testing function, while perceptual penetration often functions to minimize prediction error, which can entrench false priors rather than test them. Consequently, the conclusion that penetrated perception remains epistemically basic does not survive. Because the penetrating belief determines the content of the experience, using that experience to justify the belief creates a vicious circle, violating the requirement for foundational inputs to be independent of the doxastic system they support.

