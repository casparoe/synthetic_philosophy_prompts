  Prioritizing upstream-ness ensures the project doesn't build on sand; if the definition is wrong, the epistemology is useless. Tractability favors the conceptual focus suitable for this candidate, avoiding empirical quagmires they aren't trained to navigate. Leverage favors definition and boundary questions because they resolve multiple downstream disputes in epistemology and science simultaneously. Neglectedness favors the PP boundary question, as much literature assumes traditional modularity without scrutinizing the ontology. The trade-off is that high upstream questions risk abstract stagnation without empirical anchor points. However, for a conceptual postdoc, this is preferable to premature empirical engagement that lacks philosophical rigor. The order balances foundational clarity with the candidate's specific strengths in epistemology, saving that for last when the groundwork is laid. Furthermore, this ordering minimizes the risk of the project becoming obsolete; even if empirical models shift, the conceptual distinctions regarding natural kinds and justification remain valuable. It prioritizes philosophical durability over transient scientific consensus.

  (4) "What would change it"
  If neuroscientists reach a consensus on a neural marker for cognitive versus perceptual processing, Q2 becomes empirical and drops in priority. If predictive processing becomes undisputed orthodoxy, Q3 moves to top priority as the definitional crisis deepens and threatens to dissolve the field entirely. I would deprioritize implications for the science of perception itself; philosophers cannot adjudicate empirical modeling better than scientists, and their input there is often ignored. I would also downgrade the epistemology of testimony; it relies on the primary epistemology of perception, making it doubly downstream and less critical for a two-year foundational project. The core leverage remains on content and justification. Focusing there ensures the grant produces durable philosophical tools rather than contingent commentary on shifting scientific models. Additionally, if a new theory emerges that bypasses the penetration framework entirely, the project would need to pivot to general representational content. However, given the current landscape, the boundary question is the most volatile and thus high-risk/high-reward. Deprioritizing testimony allows the postdoc to focus on the direct relationship between experience and belief, which is the primary site of the penetration controversy.
