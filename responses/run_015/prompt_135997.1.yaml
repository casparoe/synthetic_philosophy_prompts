      *   *Key Insight:* Aristotle distinguishes between *history* (what happened) and *poetry* (what could happen). AI is arguably hyper-poetry (what *statistically* happens). Does that lose the universal truth?
      *   *Refinement on Priors:* Real tragedy teaches us about fate and character. AI sadness teaches us about patterns of language associated with sadness. That's a crucial difference.

