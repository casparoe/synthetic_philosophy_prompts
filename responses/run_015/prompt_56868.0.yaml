answer: |-
  Here is the breakdown. I am skipping the preamble because you asked for numbers and structure.

  ### 1. Credence in Claim C
  **My Number: 0.55**

  I judge it slightly more likely than not that in a *typical informed disagreement* (which inherently selects for borderline cases), swapping partisan labels would flip at least one verdict. This is significantly lower than your friend's 0.85 (which treats the concept as almost wholly fraudulent) but higher than your 0.3 (which assumes professional norms successfully firewall analysis from identity).

  ### 2. Decomposition
  I model $P(C)$ as the probability that **Ambiguity** exists multiplied by the probability that **Motivated Reasoning** exploits that ambiguity. If the case is unambiguous (e.g., a military coup), partisanship rarely overrides the verdict; therefore, bias is conditional on ambiguity.

  $$P(C) = P(\text{Case Ambiguity}) \times P(\text{Bias Overrides Principle} \mid \text{Ambiguity})$$

  | Component | Number | Justification |
  | :--- | :--- | :--- |
  | **P(Case Ambiguity)** | **0.80** | "Typical disagreement" filters out clear-cut cases (Hungary, Venezuela), leaving only the gray zone (US, Israel, India) where institutional moves have plausible deniability. |
  | **P(Bias \| Ambiguity)** | **0.70** | Even among informed actors, motivated reasoning robustly weights identical institutional risks differently depending on which party holds the lever (e.g., *Bush v. Gore* vs. *Clinton v. Jones* era logic). |
  | **Calculation** | **0.56** | $0.80 \times 0.70 \approx 0.55$ (rounded for model uncertainty). |

  ### 3. Sensitivity Analysis
  **Most Sensitive Piece:** `P(Bias | Ambiguity)` (0.70).

  **Why:** The ambiguity of borderline cases is a structural fact of political institutions; it is hard to move that number much below 0.7 or above 0.9. However, the resilience of *informed* actors to tribal epistemology is an empirical variable.
  **Evidence to Move It:** A pre-registered vignette study of political scientists and legal scholars (not just the public) where the *only* variable changed is the party affiliation of the actor proposing a specific institutional change (e.g., "Executive Order X"). If flip rates among experts are <20%, my number drops to ~0.3. If flip rates are >60%, my number rises to ~0.8.

  ### 4. The Instrument Proposal
  **Verdict:** Your friend is wrong about the design, but right about the noise.

  **Diagnosis:** She is conflating *longitudinal stability* (test-retest over months/years) with *experimental control* (concurrent vignette swapping).
  *   **Her Objection:** "Nobody's ratings are stable enough across administrations." This is true for longitudinal surveys; people's moods and contexts shift.
  *   **Your Design:** If you administer the list *simultaneously* (Group A gets "Party X does Move Y," Group B gets "Party Z does Move Y"), stability over time is irrelevant. You are measuring within-subject or between-group variance at $T_0$.
  *   **Diagnostic Value:** High. This is the standard method for detecting motivated reasoning in political psychology (e.g., Bartels, Taber & Lodge). If the flip rate is statistically significant, C is supported. If she claims the instrument is worthless because people change their minds over *time*, she is attacking a design you didn't propose.

  ### 5. Verbal vs. Partisan Disagreement
  You correctly identified that she is conflating two failure modes.
  *   **Partisan Failure (Claim C):** I call it backsliding because *you* did it.
  *   **Verbal Failure:** We both agree on the facts and the partisan stakes, but you define "democracy" procedurally (elections held) and I define it substantively (rights protected), so we apply the label differently regardless of who is in power.

  **My Credences:**
  *   **P(Partisan Failure):** 0.55 (As calculated above).
  *   **P(Verbal Failure | Not Partisan):** 0.30 (Substantial disagreement remains due to competing democratic theories, e.g., Schumpeterian vs. Liberal).
  *   **P(Real Distinction | Not Verbal):** 0.15 (Genuine disagreement on empirical weighting of facts).

  **The Gap (0.3 vs 0.85):**
  The gap lives in the **qualification of "informed."**
  *   **Your View (0.3):** You believe "informed" acts as a firewall. You assume that once facts are agreed upon, professional training forces convergence on the *label*. You are betting on the power of shared vocabulary.
  *   **Her View (0.85):** She believes "informed" actors are just better at rationalizing. She assumes the shared vocabulary is itself contested terrain (e.g., what counts as "court packing" vs. "court reform").
  *   **Reality:** The truth is likely that "informed" reduces noise but does not eliminate motivated weighting. You are overestimating the neutrality of political science concepts; she is underestimating the constraining power of professional peer review. The concept *is* real (it predicts regime collapse), but its *application* in real-time domestic politics is heavily contaminated.

  **Summary:** You are right that the distinction is real (it predicts things), but she is right that in the specific context of *domestic partisan disagreement*, it functions largely as a slur. My 0.55 on Claim C reflects that specific context, not the general utility of the concept.
