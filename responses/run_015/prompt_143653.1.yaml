prompt: |-
  ugh okay i just spent like three hours arguing with my roommate about illusionism about phenomenal consciousness -- the view that there's literally no 'what it's like' quality out there, we just have these representations that make it seem like there is. she kept insisting it's just eliminativism in disguise and that if i say phenomenal properties are illusions i'm basically saying i don't feel pain. i want to run a session for our study group next week -- five neuroscience grad students and one philosophy undergrad, all smart but none of them have taken philosophy of mind -- and actually teach them how to hold the idea without it collapsing into nonsense. don't explain illusionism to me; plan the arc.

  what dependency has to come first? i think they need to understand representational content can be misapplied to itself, but i'm not sure that's the right entry point. for the carrying example, i want to use phantom limb pain in an amputee -- the burning feel in a leg that was never there -- because it shows a representation of an 'awful qualitative state' that isn't anchored in the corresponding tissue damage. but i need to be precise about what it must show and what it must lack: it shouldn't just be about false belief, it needs to isolate the quality itself being represented without being instantiated. then the misconceptions, in the order they'll come up: first, that i'm denying consciousness exists altogether; second, that this is just old-school behaviorism or brain-state identity theory; third, this weird objection my friend raised -- that illusionism secretly needs a 'Cartesian homunculus' to be fooled by the representation, which actually makes the view self-defeating. where exactly do i head off each one in the sequence?

  also, i was reading about framing phenomenal properties like virtual objects in predictive processing -- the brain predicts qualitative states that don't need external realization. should i inject that as the mechanism, or does it muddy the water? what should i definately leave out? probably don't open up higher-order theories or Frankish's specific architecture unless it's necessary. and i need one check question at the end -- something that proves they've understood it's an ontological claim about the nature of the quality, not a denial that they have experiences. oh, and there's a typo or two in this prompt probably, sorry about that, i wrote it on my phone after the argument.
reasoning: |-
