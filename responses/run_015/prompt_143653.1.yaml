          *   Best: Focus on the *property*. "Does the brain state exist, and does the 'glow' exist?"

  4.  **Refining the Sequence & Timing:**

      *   *Opening:* Phantom Limb (15 mins). Establish "Real Signal, False Referent."
      *   *Transition:* Apply to Qualia (15 mins). "Real Signal, False Property."
      *   *Mechanism:* Predictive Processing (15 mins). How the brain renders the UI.
