      *   **Context:** The user just had a frustrating 3-hour argument with a roommate about Illusionism (regarding phenomenal consciousness). The roommate conflated it with eliminativism (denying pain/experience exists).
      *   **Goal:** Plan a study group session for next week to teach Illusionism effectively without it collapsing into nonsense.
      *   **Audience:** 5 Neuroscience grad students + 1 Philosophy undergrad. All smart, *none* have taken Philosophy of Mind. (Crucial constraint: Avoid jargon, bridge neuro/philosophy gap).
      *   **Task:** Plan the *arc* of the session. Do *not* explain illusionism to the user (they know it).
      *   **Specific Questions/Constraints:**
          *   What dependency comes first? (User suggests: representational content misapplied to itself).
          *   Example: Phantom limb pain (amputee, burning feel in non-existent leg). Needs precision: isolate quality represented without being instantiated.
          *   Misconceptions to address (in order):
              1.  Denying consciousness exists altogether.
              2.  Old-school behaviorism/identity theory.
              3.  The "Cartesian Homunculus" objection (someone needs to be fooled).
          *   Mechanism: Predictive Processing/Virtual Objects? (To include or exclude?)
          *   Exclusions: Higher-Order Theories (HOT), Keith Frankish's specific architecture (unless necessary).
          *   Deliverable: One check question at the end (ontological claim vs. denial of experience).
          *   Tone: Practical, structured, pedagogical. Acknowledge the typo comment casually.

  2.  **Deconstruct the Challenge:**
      *   *The Core Problem:* Illusionism is counter-intuitive. It feels like saying "pain isn't real." The trick is distinguishing *the experience happening* from *the properties we think the experience has*.
      *   *The Audience:* Neuro grad students understand mechanisms (signals, processing, prediction) but might lack metaphysical nuance. The Phil undergrad might get bogged down in terminology. The session needs to leverage the Neuro strength (mechanisms) to explain the Phil point (ontology).
      *   *The Phantom Limb Example:* This is strong for Neuro students. It shows a "signal" without a "source." But the user is right to be cautious: it shouldn't just be "false belief." It needs to show the *qualitative character* is generated, not received.

  3.  **Drafting the Arc (Step-by-Step):**

      *   **Phase 1: The Hook/Dependency (Representational Misapplication).**
          *   User asks: "What dependency has to come first?"
          *   My take: Before talking about *consciousness*, talk about *perception*. Establish that the brain constructs models that can be wrong.
          *   *Refinement:* Start with the Phantom Limb. It's perfect for Neuro students. It demonstrates "presence without substrate."
          *   *Crucial Distinction:* The pain is *real* (as a neural event), but the *location/object* of the pain (the leg) is illusory. Extend this: The *qualitative feel* is the model, not a property of the world (or the brain tissue itself).

      *   **Phase 2: Defining the Target (Phenomenal Properties).**
          *   Need to define "Phenomenal Consciousness" simply. "What it's like."
          *   Introduce the Illusionist claim: The *feeling* is real, the *magic property* we attribute to it is the illusion.
          *   *Addressing Misconception 1 (Denial of Consciousness):* Do this immediately. "I am not saying you don't feel pain. I am saying your brain's report on *what that pain is made of* is wrong."

      *   **Phase 3: The Mechanism (Predictive Processing).**
          *   User asks: "Should I inject Predictive Processing?"
          *   My take: Yes, for Neuro students, this is the Rosetta Stone. It explains *how* the illusion is generated without needing magic. "Virtual objects" is a great metaphor.
          *   *Constraint:* Keep it simple. Don't get into free energy principle math. Just "controlled hallucination."

      *   **Phase 4: Addressing Misconception 2 (Behaviorism/Identity Theory).**
          *   Behaviorism says "pain is just pain behavior." Identity theory says "pain = C-fiber firing."
          *   Illusionism says "Pain is a user-interface icon." It acknowledges the internal state but denies the intrinsic qualia.
          *   *Placement:* After the mechanism. Once they see it's a representational system, they might think it's just reductionism. Clarify it's an *error theory* about the representation, not a reduction of the state.

      *   **Phase 5: Addressing Misconception 3 (The Homunculus).**
          *   "Who is being fooled?"
          *   This is the "Hard Problem" trap.
          *   *Solution:* The system *is* the fooler and the foolee. No little man inside. The representation *is* the experience.
          *   *Placement:* Near the end, as a "deep dive" objection.

      *   **Phase 6: The Check Question.**
          *   Needs to test ontological nuance.
