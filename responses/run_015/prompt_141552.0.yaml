      *   *Bayesian:* $\mu_{post} \approx 0.55$, 95% CrI [0.30, 0.80]. (Excludes 0).
      *   *Frequentist (Selection Model):* Estimates selection probability $\alpha_1$ (for $p<0.05$) = 1, $\alpha_2$ (for $p>0.05$) $\approx 0.05$. Adjusts weights. Corrected $\hat{\mu} \approx 0.05$, 95% CI [-0.20, 0.30].
      *   *Arithmetic Check:* If true effect is 0, and we select $p < 0.05$, the expected value of the observed $d$ is roughly $1.76 \times SE$ (truncated normal). If $SE = 0.25$, expected observed $d \approx 0.44$. This aligns with the "Mean 0.55" narrative (allowing for some variance).
      *   *Frequentist Logic:* The selection model sees the clustering of p-values near 0.05 and the relationship between SE and Effect Size. If smaller studies (higher SE) have larger effects, that's a bias signal.

  5.  **Addressing the "Bayesian Failure" Objection:**
      *   *Objection:* "That's not a Bayesian failure, that's a model specification failure."
      *   *Response:* Correct. Standard Bayesian meta-analysis *conditions on the data observed*. It does not inherently model the *absence* of data.
      *   *Can Bayes fix it?* Yes, by adding a selection likelihood (Bayesian selection model). But the prompt asks for "standard Bayesian machinery" vs "Frequentist error-rate habit." The "error-rate habit" (Frequentist) forces you to ask "What is the long-run probability of this result under null + selection?" The standard Bayesian asks "Given these data, what is the parameter?"
      *   *Key Distinction:* Frequentist bias corrections are *designed* to test the selection hypothesis. Standard Bayesian priors are usually about the *effect*, not the *process*.

  6.  **Refining the Argument (The "Soft Spots"):**
      *   *Where it breaks:* If the Bayesian uses a skeptical prior (e.g., centered at 0 with tight variance), they win. But the prompt forbids "skeptical-prior trick."
      *   *Where it breaks:* If the Frequentist selection model is misspecified (e.g., selection isn't strictly at 0.05).
