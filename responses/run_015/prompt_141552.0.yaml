answer: |-
  **The Scenario**

  The literature concerns "FocusFlow," a gamified productivity app tested in call centers. Eighteen independent labs ran randomized trials over five years. The true effect of the app on call-handling time is zero. However, the field has a hard publication norm: two-tailed $p < 0.05$. Because the studies are small (average $N=60$ per study, split between treatment and control), the standard error for Cohen's $d$ is roughly 0.26. To clear the $p < 0.05$ bar when the true effect is zero, a study needs a noisy estimate of at least $d \approx 0.51$. Consequently, the eighteen published studies are the lucky tail of the distribution: every single one reports a positive effect, ranging from $d = 0.52$ to $d = 0.85$. No fraud occurred; no p-hacking within studies. The null results and the negative noise simply sit in file drawers.

  **The Numbers**

  *   **The Data:** 18 published studies. Mean observed $d = 0.64$. Average $SE = 0.26$. All $p < 0.05$.
  *   **The Bayesian Analysis:** You run a standard hierarchical meta-analysis (e.g., `rstanarm` or `brms`). Likelihood: $y_i \sim N(\theta_i, \sigma_i^2)$, $\theta_i \sim N(\mu, \tau^2)$. Priors: $\mu \sim N(0, 1)$, $\tau \sim HalfCauchy(0, 0.5)$.
      *   **Result:** The model treats the 18 studies as the population of evidence. It estimates high heterogeneity ($\hat{\tau} \approx 0.15$) to account for the spread, but the pooled mean $\mu$ lands squarely on the published cluster.
      *   **Output:** Posterior mean $\mu = 0.62$, 95% CrI $[0.48, 0.77]$.
      *   **Verdict:** Confidently positive. The probability that $\mu > 0$ is $> 99.9\%$.
  *   **The Frequentist Analysis:** You apply a weight-function selection model (e.g., Vevea & Hedges). This model estimates the probability of a study being published as a function of its p-value. It posits a step function: $Prob(publish | p < 0.05) = 1$, $Prob(publish | p \ge 0.05) = \omega$.
      *   **Reasoning:** The model calculates the likelihood of observing this specific set of 18 significant results under different true means. If the true mean were 0.62, we would expect many small studies to be non-significant (due to sampling error). The fact that *none* are non-significant implies severe truncation. The model upweights the "missing" non-significant zone to balance the likelihood.
      *   **Output:** Estimated selection parameter $\hat{\omega} \approx 0.05$ (confirming severe bias). Corrected effect size $\hat{\mu} = 0.03$, 95% CI $[-0.22, 0.28]$.
      *   **Verdict:** Null. The pattern of significance is exactly what we expect from a null effect plus a file drawer.

  **The Arithmetic of the Trick**

  Why does the Bayesian fail? Because the standard likelihood conditions *only* on the observed $y_i$. It asks, "Given these 18 numbers, where is the center?" It does not ask, "How many numbers are missing?" The posterior is driven by $\sum (y_i / \sigma_i^2)$. Since all $y_i$ are positive and significant, the sum is positive.

  Why does the Frequentist selection model save you? It incorporates the *sampling distribution* of the test statistic under the null. If $\mu_{true} = 0.62$ and $SE = 0.26$, the power of an average study is ~85%. That means ~15% of studies should be non-significant even if the effect is real. In a set of 18 studies, seeing 0 non-significant results is unlikely ($0.85^{18} \approx 0.05$). But if $\mu_{true} = 0$, the probability of a study being significant is exactly 0.05. The probability of getting 18 significant results out of 18 *conducted* studies is infinitesimal. However, the selection model posits that many more were *conducted* than published. If 400 studies were conducted (true $\mu=0$), we expect 20 significant ones. Observing 18 is consistent with that. The model maximizes the likelihood by shifting $\mu$ toward zero and increasing the estimated number of missing studies.

  **The Key Feature & Sensitivity**

  The engine driving this divergence is the **absence of non-significant results in small samples.**

  If you remove this feature—for example, if a registry recovery project finds the 12 missing null studies and adds them to the dataset—both analyses converge immediately.
  *   **Bayesian:** Adding 12 studies with $d \approx 0$ pulls the posterior mean down to $\mu \approx 0.25$, with the CrI now overlapping zero. The data changed, so the posterior changed.
  *   **Frequentist:** The selection model estimates $\hat{\omega} \approx 1$ (no selection bias). The corrected estimate matches the raw estimate.

  The Bayesian machinery is not "broken"; it is simply conditional on the data provided. It is the *input* that is biased, and the standard model has no mechanism to detect bias in the input without external information.

  **The Objection: "That's Not a Bayesian Failure"**

  Your readers will argue: *"This isn't a failure of Bayesianism; it's a failure of that specific model. A Bayesian can build a selection model too."*

  They are right. You can write a Bayesian selection model (putting a prior on the selection parameter $\omega$). If you do, you will land exactly where the Frequentist did. But here is the rub: **Nothing in the standard Bayesian set-up forces you to model the selection.**

  The Frequentist error-rate habit is inherently about the *process*: "What is the long-run error rate of this decision rule?" That question forces you to define the space of *possible* outcomes, including those that didn't happen (the file drawer). The standard Bayesian question is "What is the probability of the parameter given the *observed* data?" The Likelihood Principle tells you that unobserved data (the file drawer) is irrelevant *unless* you explicitly model the missingness mechanism.

  In practice, "standard Bayesian meta-analysis" (the kind editors and grant panels accept as reassurance) rarely includes a selection likelihood. It treats the literature as a random sample. The Frequentist bias-correction tools (p-curve, selection models) are explicitly designed to test the "random sample" assumption. So, while a Bayesian *could* model the file drawer, the *habit* of Bayesian updating does not demand it, whereas the *habit* of checking error rates does.

  **The Soft Spots (Where This Breaks)**

  I need you to print the vulnerabilities, or this is just propaganda. Here is where the argument collapses:

  1.  **The Frequentist Savior is Fragile:** The selection model's "correct" verdict relies entirely on the correct specification of the selection function. I assumed a step function at $p=0.05$. In reality, selection is smooth (e.g., $p=0.06$ still publishes sometimes). If the selection function is misspecified, the Frequentist correction can be *more* biased than the raw Bayesian estimate. It has higher variance. In a real-world scenario with only 18 studies, the selection model's CI will be massive. It "saves" you by being inconclusive, not by being precisely right.
  2.  **The Bayesian Prior is a Knob:** I constrained you to "weakly informative" priors. If you allow a "skeptical" prior (e.g., $\mu \sim N(0, 0.2)$), the Bayesian analysis would have shrunk the estimate toward zero even without modeling selection. The "failure" is partly an artifact of the prior constraint you requested.
  3.  **The "Truth" is Unknowable:** In this scenario, I *told* you the true effect is zero. In reality, we don't know. If the true effect *were* 0.5, the Bayesian is right and the Frequentist selection model is incorrectly "correcting" a real effect away because it mistakes heterogeneity for bias. The Frequentist method protects against false positives at the cost of false negatives.

  **The Verdict**

  The column holds, but the conclusion isn't "Bayes is bad." It's that **meta-analysis is not a bias detector.** Whether Frequentist or Bayesian, a standard meta-analysis assumes the literature is representative. The Frequentist "save" comes from using a specialized tool (selection model) that most practitioners *don't* use, just as they don't use Bayesian selection models.

  The reassurance "we meta-analysed it" is weak because standard models (of both flavors) treat the published record as the complete record. The only thing that saves you is explicitly modeling the *process* of publication, which is rarely done, difficult to specify, and often underpowered. If you want to tell editors that meta-analysis solves publication bias, you're lying. If you tell them it quantifies the bias *only if* you use specific, fragile corrections, you're doing science.
