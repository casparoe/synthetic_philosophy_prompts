  2.  **Deconstruct the Statistical Challenge:**
      *   *The Core Tension:* Bayesian methods incorporate prior information. Frequentist bias corrections (like selection models) explicitly model the *process* of publication.
      *   *The Trap:* Standard Bayesian meta-analysis (random effects) assumes the collected studies are a random sample from the population of *conducted* studies. If the sample is biased (published only), the posterior will shift toward the biased sample unless the prior explicitly penalizes it or the model accounts for selection.
      *   *The Frequentist Counter:* Methods like weight-function models (selection models) explicitly estimate the probability of publication as a function of the p-value. If small studies show large effects and large studies show small/null effects, selection models downweight the small studies.
      *   *The "Bayesian Failure":* A standard Bayesian hierarchical model treats the observed heterogeneity as genuine $\tau^2$. If small studies are noisy and only significant ones publish, the Bayesian model sees "high heterogeneity" but centers the mean on the published cluster. It doesn't inherently "know" about the file drawer unless the prior or likelihood encodes the selection mechanism.
      *   *The "Frequentist Save":* A selection model (e.g., Vevea & Hedges, or a p-curve style logic) notices the asymmetry. Small studies have huge effects; large studies (if any) or the expected distribution of p-values doesn't match the null. Wait, if *only* significant publish, p-curve might say "evidential value exists" (right-skewed). I need a case where the *pattern* of significance looks like bias to the frequentist correction but looks like "real heterogeneity" to the Bayesian.
      *   *Refinement:* The best candidate for the Frequentist side is a **Selection Model (Weight Function Model)**. P-curve often fails to detect bias if all published p-values are < 0.05 (it just says "there is evidential value"). A selection model estimates the *underlying* effect size by weighting studies by their probability of selection. If the model assumes $p < 0.05$ is required for publication, it can reconstruct the missing nulls.
      *   *The Bayesian Side:* A standard `brms` or `rstanarm` random-effects meta-analysis. Likelihood: $y_i \sim N(\theta_i, \sigma_i^2)$, $\theta_i \sim N(\mu, \tau^2)$. Priors: $\mu \sim N(0, 10)$, $\tau \sim HalfCauchy(0, 1)$. This model assumes the $y_i$ are the data. It does not condition on $p_i > 0.05$. Therefore, it will estimate $\mu$ based on the published $y_i$.

  3.  **Constructing the Scenario:**
      *   *Topic:* Workplace productivity intervention (e.g., "mindfulness app for call center staff").
