      *   *Resulting Data:* Because true effect is 0, the published studies are those where noise pushed the estimate high enough to cross the threshold. Small studies need huge noise (large effect size) to cross. Large studies (if any) wouldn't cross easily. To make it realistic, let's say all studies are roughly similar small size (common in psych/org behavior).
      *   *Bayesian Outcome:* Sees 15 positive effects. Average $d \approx 0.5$. $\tau$ captures the spread. Posterior for $\mu$ excludes 0. Confidently positive.
      *   *Frequentist Outcome:* Selection model notices all p-values are just under 0.05 (or distributed uniformly between 0 and 0.05). It estimates the selection probability. If the model assumes step-function selection at 0.05, it infers that for every published study, there are ~19 unpublished (depending on power). It corrects the mean down to 0.

  4.  **Drafting the Numbers:**
      *   True $\delta = 0$.
