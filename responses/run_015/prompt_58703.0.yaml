answer: |-
  **Project Title:** A Procedural Account of Impact for Safe AI Assistants

  **Summary**
  In engineering safe AI assistants, we frequently instruct agents to "avoid side effects." However, any useful task changes the world. The instruction implicitly means "avoid important or hard-to-reverse side effects," but current methods for defining impact struggle to distinguish between acceptable and unacceptable changes without smuggling in subjective value judgments. This project proposes that impact should not be defined by the state of the world, but procedurally: an action has low impact if the human principal can detect, understand, and undo the work with reasonable effort. Over three months of part-time work, I will test this hypothesis through conceptual analysis of two concrete engineering cases: a file-management assistant and a code-refactoring assistant. The goal is to produce a clarified framework for impact that can guide future constraint design without requiring a full theory of human values.

  **The Problem: The Ambiguity of "Side Effects"**
  When we deploy autonomous agents, we want them to be helpful but harmless. In practice, "harmless" is often operationalized as minimizing side effects. However, from a technical perspective, any action that achieves a goal alters the state of the system. If an assistant archives old files to reduce clutter, it has changed the file system. If it refactors code to improve readability, it has changed the repository history.

  The standard philosophical and technical approach to this problem involves comparing the actual outcome to a baseline (usually "doing nothing") or measuring the reversibility of changes. Both approaches have significant limitations for engineering practice.
  1.  **Baseline Comparison:** Defining "doing nothing" is surprisingly difficult in dynamic environments. Furthermore, counting the number of changed variables (e.g., bits flipped) does not distinguish between moving a trash file and deleting a production database. To weigh these differences, one must already know what is valuable, which returns us to the problem of value alignment.
  2.  **Reversibility:** Simply asking "can this be undone?" is insufficient. Almost anything is reversible with enough resources. The question is whether it is reversible *by the user* within a reasonable timeframe. A change that requires a week of expert debugging to reverse is effectively irreversible for a non-expert, even if it is theoretically reversible.

  These approaches leave a gap: they attempt to measure impact objectively in the world, when impact is actually relational between the agent and the user's capacity for control.

  **Central Research Question**
  *Can "low impact" be defined procedurally as the preservation of the principal's capacity to detect, understand, and undo the assistant's actions with reasonable effort?*

  This question shifts the focus from *what* changed to *how the change affects the user's agency*. If the user can easily see what happened, comprehend why, and revert it if necessary, the action may be considered safe even if it significantly alters the system state.

  **Methodology: Conceptual Clarification via Case Studies**
  As a software engineer without formal training in philosophy, I will not attempt to construct a formal axiomatic system or prove theorems. Nor will I conduct user studies, which are out of scope for a three-month independent fellowship and premature before the concepts are clarified. Instead, I will treat this as a "debugging" process for our definitions.

  The method consists of rigorous conceptual stress-testing against two specific cases drawn from my professional experience:

  1.  **The File-Management Case:** An assistant archives old shared-drive files to reduce clutter.
      *   *Test:* Does the procedural definition distinguish between archiving a file the user forgot about (acceptable) versus archiving a file the user is actively editing (unacceptable)?
      *   *Focus:* "Detectability." Did the system log the move? Is there a notification? "Undoability." Is there a one-click restore function?
  2.  **The Code-Refactoring Case:** An assistant renames functions for clarity and notifies teammates.
      *   *Test:* Does the definition handle the social dimension of impact?
      *   *Focus:* "Understandability." Is the diff clear? "Undoability." Is the commit atomic and revertible? "Detectability." Were the right stakeholders notified?

  I will iterate on the definitions of "reasonable effort," "detect," and "understand" until the framework consistently categorizes intuitive successes as safe and intuitive failures as unsafe without appealing to external moral values.

  **Why This Method?**
  Formal definitions often fail in safety engineering because they are too brittle; they break when encountering edge cases not anticipated in the axioms. User studies are valuable but cannot tell us *what* we should be measuring before we run them. Conceptual clarification is the necessary prerequisite. We must agree on what "impact" means before we can measure it. This approach leverages my strength as an engineer: testing abstractions against concrete implementation details to find where they leak.

  **Success and Failure Criteria**
  *   **Success:** The project produces a written framework (approx. 10–15 pages) that defines "Procedural Impact" with enough precision to distinguish between the safe and unsafe variants of the two case studies. The framework should identify specific engineering levers (e.g., logging granularity, notification channels, atomicity of transactions) that directly map to the philosophical criteria of detectability and undoability.
  *   **Failure:** The analysis reveals that "reasonable effort" cannot be defined without implicitly referencing specific human values (e.g., "effort" depends on how much the user cares about the file). If the procedural definition collapses back into a value judgment, I will document this impossibility result. Proving that the procedural approach is insufficient is still a valuable outcome, as it prevents future wasted effort on this line of reasoning.

  **Scope and Timeline**
  This proposal is scoped strictly for a three-month, part-time fellowship (approx. 10 hours/week).
  *   **Month 1:** Refine the procedural definitions. Review existing informal arguments regarding impact and baselines (without deep academic literature review) to ensure I am not reinventing the wheel.
  *   **Month 2:** Apply the definitions to the File-Management and Code-Refactoring cases. Document edge cases where the definition feels counter-intuitive and adjust.
  *   **Month 3:** Finalize the framework. Write the final report outlining the definition, the case study analysis, and recommendations for how engineers might implement "procedural safety" constraints in agent design.

  **Conclusion**
  Safe AI development is currently bottlenecked by vague safety constraints. We tell agents to "be careful," but we lack a technical definition of care that does not require solving the entire problem of human value alignment. By reframing impact as a function of the user's ability to maintain control, this project aims to provide a tractable, engineering-friendly definition of safety. Even if the result is limited to these two domains, establishing a procedural baseline for impact is a necessary step toward building assistants that are robustly helpful without being robustly intrusive.
