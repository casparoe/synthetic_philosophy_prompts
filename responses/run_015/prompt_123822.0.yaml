answer: |-
  Your instinct is correct. The article you were sent is a caricature. It conflates Scanlon's contractualism with Rawls's veil of ignorance, oversimplifies the aggregation rule, and then attacks a conclusion that most contractualists do not actually hold. It sets up a straw man to knock it down easily.

  Here is a sentence-by-sentence breakdown of what a serious defender of the view would say, followed by an analysis of the "save the million" refutation and your sliding-scale stress test.

  ### Sentence-by-Sentence Breakdown

  **1. "Morality is the set of rules we'd sign up to if we had to pick them without knowing which person we'd turn out to be, and that ignorance is what makes the test impartial."**
  *   **Verdict:** **Outright Rejection.**
  *   **Why:** This describes John Rawls, not T.M. Scanlon. Scanlon explicitly distances himself from the "veil of ignorance." In contractualism, you do not imagine you don't know who you are. You know exactly who you are and what your interests are. The test is whether you can justify your actions to *other specific people* who also know who they are. Impartiality comes from the requirement that the justification must be acceptable to everyone affected, not from ignorance of your own identity. A defender would say this gets the mechanism wrong, even if it captures the spirit of fairness.

  **2. "An act is wrong if some principle that no sensible, well-informed person could object to forbids it, so you basically ask, of each act, whether anyone could reasonably complain, and if they can, it's off the table."**
  *   **Verdict:** **Fair Compression.**
  *   **Why:** This is the core formula: "An act is wrong if it would be disallowed by any set of principles for the general regulation of behavior that no one could reasonably reject." The article simplifies "principles for general regulation" to "ask of each act," which is a bit loose (contractualism is about rules, not just case-by-case intuition), but for a pop-philosophy summary, this is acceptable. A defender would accept this as the working definition.

  **3. "The key consequence... is that you're never allowed to add people's complaints together, because justification has to be to each person one at a time."**
  *   **Verdict:** **Nuanced Rejection.**
  *   **Why:** This is the most misleading part. It is true that justification is individual. However, saying you are *never* allowed to add complaints is false. Contractualism blocks aggregation when the harms are *qualitatively different* (e.g., death vs. a headache). It does not necessarily block aggregation when the harms are *relevantly similar*. If five people will die versus one person will die, the complaints are of the same kind. A defender would say: "We don't sum up pain like utilitarians, but we do compare the strength of individual complaints. If the complaints are identical in strength, numbers can break the tie."

  **4. "Which means, contractualism is committed to the claim that no number of headaches, or broken arms, or ruined afternoons can ever outweigh a single death: the one always wins, no matter how big the pile gets."**
  *   **Verdict:** **Mostly Accept (with caveats).**
  *   **Why:** This is the "hard line" contractualism is famous for. In a clash between death and minor inconveniences, the individual facing death has a complaint so strong that no amount of minor complaints from others can override it. The justification must be acceptable to the person dying; they can reasonably reject a principle that sacrifices their life to save others from mere headaches. A defender would accept this, arguing that this is a feature, not a bug—it protects individuals from being sacrificed for the greater good when the "good" is trivial.

  **5. "And since obviously we should save the million, the view is refuted."**
  *   **Verdict:** **Outright Rejection (Non-Sequitur).**
  *   **Why:** This conclusion does not follow from the previous sentences unless you assume the "one person" and the "million people" are suffering *different* harms. If the case is "One Death vs. One Million Headaches," contractualism says save the one. If the case is "One Death vs. One Million Deaths," contractualism says save the million. The article conflates these two scenarios. It assumes that because you can't aggregate headaches to outweigh a death, you also can't aggregate deaths to outweigh a death. That is false. A defender would say: "In the 1-vs-Many Deaths case, the complaints are equal. The principle 'save the greater number' cannot be reasonably rejected by the one, because their complaint is no stronger than any of the others. Therefore, we save the million."

  ### Does the "Save the Million" Refutation Hold?

  No. The article needs the misreadings to get there. Specifically, it needs you to believe that contractualism treats "1 Death vs. 1 Million Deaths" the same way it treats "1 Death vs. 1 Million Headaches."

  In the actual view, the logic works like this:
  1.  **Disparate Harms (Death vs. Headache):** The person facing death has a vastly stronger individual complaint than any single person facing a headache. Since we compare the strongest individual complaint on each side, the death complaint wins. Numbers don't matter here.
  2.  **Equivalent Harms (Death vs. Death):** The person facing death on the small side has a complaint of equal strength to any single person facing death on the large side. Since the individual complaints are tied, we look for a principle to break the tie. The principle "save the greater number" is one that no one could reasonably reject (because anyone would want it applied if they were in the larger group). Therefore, numbers *do* matter here.

  The article claims contractualism forces you to let the million die. A contractualist replies: "Only if the million are suffering headaches. If they are dying, we save them."

  ### The Sliding-Scale Stress Test

  Your sorites case is excellent: *One person loses a limb vs. One person loses a slightly less bad limb. Then add a billion people to the 'slightly less bad' side.*

  Does contractualism have to say the answer is identical at one person and at a billion? Does it have to bite the bullet that the one person with the slightly worse injury always wins?

  **The Contractualist Response: Relevant Similarity**
  Contractualism does not view moral severity as a smooth, continuous mathematical line where you can always add a tiny bit more to tip the scale. Instead, it relies on the concept of **relevant similarity**.

  1.  **The Threshold:** There is a threshold where harms become "relevantly similar." If Person A loses an arm and Person B loses an arm and a finger, a contractualist might argue these are relevantly similar harms. In cases of relevant similarity, aggregation is permitted. So, if you have a billion people losing "an arm and a finger" versus one person losing "an arm," the billion might win, because the complaints are close enough that the numbers break the tie.
  2.  **The Discontinuity:** If the difference is significant (e.g., Death vs. Broken Arm), they are not relevantly similar. The severity gap is too wide. In this case, aggregation is blocked. The one death wins against any number of broken arms.
  3.  **The Sorites Worry:** You asked if the view is hostage to a sorites paradox (if A is worse than B, and B is worse than C... eventually Z must be worse than A). Contractualists accept that moral categories are somewhat "clumpy." They are willing to draw a line and say, "Below this threshold, numbers count. Above this threshold, severity trumps numbers." They admit this line might be fuzzy, but they argue that moral reasoning often involves fuzzy categories (like "tall" or "bald") without collapsing into incoherence.

  **Does it bite the bullet?**
  In the specific case of *marginally* different limbs (e.g., left pinky vs. right pinky), a contractualist would likely say the harms are identical for the purpose of the principle. Therefore, the billion win.
  In the case of *significantly* different limbs (e.g., life vs. finger), the contractualist says the one life wins, even against a billion fingers.
  They accept that there is a "cliff" where adding more people stops mattering. They argue this is necessary to protect individuals from being sacrificed for trivial aggregate gains. They would say your intuition that the answer *should* change smoothly is a utilitarian intuition, not a contractualist one.

  ### Summary

  The article you read is not trustworthy on the technical details. It conflates Rawls with Scanlon, it claims contractualism forbids aggregation in *all* cases (false; only across qualitative gaps), and it concludes that contractualism requires letting a million people die (false; only if they are dying for a trivial reason).

  A real defender would say:
  *   **Veil of Ignorance:** No, we justify from our actual positions.
  *   **Aggregation:** No summing of pain, but numbers break ties when harms are equal.
  *   **1 vs. Million Deaths:** Save the million. The principle is justifiable to the one.
  *   **1 vs. Million Headaches:** Save the one. The complaint of death is stronger than any individual headache complaint.
  *   **Sliding Scale:** We draw lines at "relevant similarity." We accept that numbers stop counting once the harm gap becomes too wide.

  The view is not refuted by the "save the million" intuition because the view agrees we should save the million in the death-vs-death case. It only diverges from utilitarianism in the death-vs-triviality case, which is exactly what the theory is designed to do.
