answer: |-
  You've caught me on a tricky one, and I'll concede the point that this fence is younger than most. Seventy years is a blink in the life of a civilization, and if we treat every mid-century administrative tweak as sacred wisdom, we turn preservation into idolatry. You're right that gatekeeping happens. You're right that heterodox work gets smothered. I've seen it.

  But you're asking me to identify the failure mode compressed into this rule, and you're asking why I wouldn't tear it down if I can't. I can name the failure mode. It's not vague.

  Before anonymity became the norm, science operated closer to a patronage system. The failure mode isn't just "bad review." It's the reversion of intellectual disagreement into social warfare. When names are attached to critiques, the cost of dissent skyrockets. If I'm a junior scholar and I point out a fatal flaw in the work of a department chair who controls my funding, my career ends—not because my data is wrong, but because I violated a social hierarchy. The fence wasn't built to protect the *idea* from scrutiny; it was built to protect the *scrutinizer* from retaliation.

  The compressed history here is the memory of when truth was subordinate to status. We forget this because we live in a world where the norm is already set. But remove the shield, and you don't get a utopia of transparency. You get a marketplace where reputation capital outweighs evidentiary capital. The "failure" is the corruption of the evidentiary standard by interpersonal power dynamics.

  Now, about that institutional debt. You see inefficiency; I see a hidden obligation. Anonymous review carries a debt to the vulnerable. It obligates the institution to pretend that all voices are equal before the data, even when they aren't equal in rank. If you delete this legacy code, you don't just change the review process. You change the hiring process, the funding process, and the collaboration process. You create a dependency on "bravery" that most humans simply don't possess. You're assuming a rationalist redesign where scholars act as pure agents of truth. But they're also parents, employees, and rivals. They have mortgages. They have egos.

  So, am I stuck defending this fence forever? No. Fences rot. If the gatekeepers are using it to squash valid work, the mechanism is malfunctioning. But there's a difference between repairing a gate and burning the fence line.

  If you tear it down now, you're betting that human nature has changed since the 1940s. You're betting that without the shield, senior scholars won't use their status to crush critics. That's a wager on the goodness of man, which is a dangerous bet for a conservative to make. I'd rather we try incremental reforms—double-blind where possible, open identities optional, stronger oversight on review timelines—than assume we can engineer a system that functions without accounting for envy and power.

  We hold this arrangement in trust. It's not just about us getting our papers published today. It's about the partnership between those who built the system to stop the vendettas of the past, those who work within it now, and the unborn who need a way to find truth without needing a patron. If we dismantle the shield because it feels cumbersome, we might hand the next generation a system where only the well-connected speak. That's a debt I'm not willing to incur.
