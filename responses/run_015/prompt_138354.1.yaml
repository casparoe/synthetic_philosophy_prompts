  I'm halfway through a pop book about decision-making — the chapter is called something like "when expected value goes off the rails" — and it introduces Pascal's mugging roughly like this:

  "Pascal's mugging is basically Pascal's wager with bigger numbers. A stranger comes up to you and says that unless you give him five dollars he'll use magic powers to torture an astronomically large number of people — say 3^^^^3 of them. You can't prove he's bluffing, so the probability of his threat being real can't be zero, and since the number of victims is effectively infinite, the expected disutility of refusing is infinitely bad. Any expected value calculation therefore says hand over the money. Since of course you shouldn't hand over the money, this refutes expected value reasoning. There are two standard escapes: cap your utility function so it stops growing with the number of victims, or just treat sufficiently small probabilities as zero. Note that the whole puzzle depends on the mugger's claim having non-zero probability — if you could simply rule it out there'd be no problem, which is why the mugger always picks a claim you can't disprove."

  Then it uses all this to make a point I actually care about: it says the same reasoning kills longtermism, because "we should do X because the far future might contain enormous numbers of people and we might be able to affect them" is just Pascal's mugging with a spreadsheet attached, so you can safely ignore it. I half want to believe that, but the chapter is written very confidently and I can't tell if the confidence is earned. (I also can't look anything up right now, so please don't send me to papers or reading lists — I want the reasoning, not sources.)

  So: is that summary fair? Go through it and separate what someone who actually works on this stuff would accept, what's a simplification they'd wince at, and what's just wrong. I'm especially unsure about these bits:

  - Is it really just Pascal's wager with bigger numbers? My sense is the wager is doing something with infinite payoffs and the mugging is doing something else, but I can't say what.
  - The "expected disutility is infinitely bad" line — I thought the point of the mugging was that the stakes are finite but absurdly huge, and that this is what makes it different from the wager. Does that matter or am I nitpicking?
  - Would a defender of expected utility maximization just deny the step from "it says pay" to "so it's refuted," and if so what do they give up in exchange? A forum comment said the bullet-biting response has a name — "fanaticism"? — and that some people think it isn't a bullet to bite at all. Real position or troll?
  - Are those two the actual standard escapes, and do they work? Does capping utility really get you out, or does it just move the bump in the carpet? And for treating small probabilities as zero: someone told me you get money-pumped if you do that across a sequence of decisions, which I don't understand — can you show me the sequence?

  Two variants I also want placed:

  (a) A friend says the promise version — give me five dollars and I'll create 3^^^^3 happy people — is a genuinely different case from the threat version, because in the threat version there's an extra question about whether your paying is what makes the difference. Is he right?

  (b) If there are a thousand different muggers making mutually incompatible astronomical threats and you can only pay one of them, expected value reasoning seems to tell you to pick one at random and pay, which sounds nuts. Does that add anything to the puzzle, or is it the same point with extra people in it?

  It's fine to tell me which parts are contested rather than settled — I'd rather know where the disagreements actually are than get one clean verdict.
