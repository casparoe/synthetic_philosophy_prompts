      *   Actually, the strongest argument against "probability 0" is Cromwell's Rule/Bayesian updating. If $P(H) = 0$, no evidence can change your mind. That's dogmatism.

      *   Let's stick to the "arbitrary threshold" problem. If you cut off at $10^{-10}$, why not $10^{-11}$? It's ad hoc.

