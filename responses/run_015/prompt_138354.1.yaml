          *   Scenario: I offer you a lottery ticket. Cost \$1. Prize \$1M. Prob $10^{-5}$. You buy (EV > 0).
          *   Scenario: Cost \$1. Prize \$1M. Prob $10^{-7}$ (below threshold). You refuse.
          *   Pump: I sell you a ticket with prob $10^{-6}$ (just above threshold). Then I offer to swap it for a ticket with prob $10^{-5}$ for a fee. You pay. Then I reveal the first ticket was actually $10^{-7}$ (below threshold, worth 0 to you). I buy it back for \$0.10. You lost the fee.
          *   *Simpler version:* Just note that setting prob to 0 violates Bayesian updating. If you see evidence, your prob goes from 0 to non-zero. Bayes rule forbids starting at 0.

      *   *Refining Longtermism:* The key distinction is *epistemic*. Pascal's Mugger makes a claim with no evidence. Longtermism relies on models of physics/sociology. The probability of affecting the future is not "magically tiny."

      *   *Refining Variant (a):* The standard mugging assumes causal link ("If you pay, I won't torture"). If the friend questions the causal link, they are questioning the *conditional probability* $P(\text{Safe} | \text{Pay})$, not the EV calculation itself.

  5.  **Final Review against Constraints:**
