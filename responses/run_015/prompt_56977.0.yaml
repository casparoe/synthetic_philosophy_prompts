  The joint is step (4), reinforced by (5). It conflates *narrative form* with *ontological commitment*. That the historian supplies the plot does not entail she supplies the events. Step (4) looks seamless because it assumes a picture theory of representation: if the structure isn't in the world, the representation isn't answerable to the world. But maps impose grid lines not found in the terrain; they remain answerable to the terrain.

  Pricing alternatives:
  1.  **Keep (2), Deny (3):** You claim events dictate their own story. **Cost:** Naive realism. You must explain why competent historians disagree without invoking bias. You lose the critical tool of standpoint theory.
  2.  **Deny (2):** You claim one narrative is uniquely determined by evidence. **Cost:** Dogmatism. You ignore underdetermination. Every archive supports multiple coherent stories.
  3.  **Deny (4) (Recommended):** You accept narrative imposition but reject that this severs answerability. **Cost:** You must articulate a critical realism where truth is constrained by evidence even if structured by perspective. This requires explaining how evidence constrains selection without dictating it. It is hard work, but it saves the discipline.

  Regarding your generalization worry: (4) is a reductio. If imposing syntactic or conceptual form voids truth-claims, physics and journalism also fail. We accept that maps distort territory without ceasing to be maps. Step (4) proves too much; reject it to save ordinary discourse.

  **Field Status:**
  **Settled:** Extreme constructivism (step 6) is marginal. Most philosophers of history accept evidential constraints. The idea that "nothing corresponds" is widely rejected outside specific literary-theory niches. There is broad agreement that the past existed independently of historians.
  **Live Fight:** The degree to which narrative form *constitutes* rather than *describes* historical understanding. Realists (e.g., Bevir, Megill) argue narrative is a tool for truth; Narrativists (e.g., White) argue it's aesthetic. The consensus is a "mitigated realism": the past exists independently, but access is always mediated.

  You prefer losing (6). Good. Deny (4) and (5). Narrative is a construction, but constructions can be true or false relative to evidence. The Rankean ideal is regulative, not constitutive. We aim at truth knowing we construct the path. Tell her: "You've proved history is artful, not that it's fiction." The error is moving from "selection is subjective" to "truth is impossible." Evidence constrains selection even if it doesn't dictate it. On Carr: You are right; he argued facts are selective, not invented. She has conflated his skepticism about objectivity with skepticism about reality.
