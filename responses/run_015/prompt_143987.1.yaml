  **Philosophical Assessment:**
  Your setup is **not confused**. It is a legitimate tension between *conventional truth* (how we must treat people socially/medically) and *ultimate truth* (the ontological reality of no-self). Western bioethics relies on "psychological continuity" (memory/narrative) for personhood. Dementia breaks that continuity. *Anatta* says the continuity was always an illusion. These are compatible conversation partners, provided you don't treat *anatta* as nihilism ("no one matters") or Western personhood as metaphysical fact ("the soul is trapped").

  Below are the remarks. I have audited them to ensure no "hidden kernel" is smuggled in.

  ***

  **Opening Remarks: Who Remains?**

  Good morning. Looking around this room, I see a deliberate tension. On one side, clinicians whose daily work is to hold onto people as they fade. On the other, scholars whose tradition suggests there was never anyone solid to hold onto in the first place.

  The title of our workshop is "Who Remains?"

  In my clinical work, when a family asks me this, I know what they are afraid of. They are afraid that the disease is a thief stealing the essence of their father, their wife, their friend. So, we clinicians make a promise. We say, "We will help you preserve who they are." We use music, photo albums, life stories. We treat personal identity like a fossil: something fragile, buried under the rock of pathology, that we must carefully brush off and protect. We operate on the assumption that if we can just access the right memory, the *real person* will step forward.

  But if our Buddhist colleagues are right, that promise is metaphysically impossible.

  If *anatta* holds, there is no fossil. There is no hidden kernel of "self" waiting behind the symptoms to be rescued. There is only a flow of conditions. There is the body, the feelings, the perceptions, the habits. In health, these flow in a pattern we recognize as "John." In dementia, the pattern changes. The conditions shift.

  If I tell a family, "We will keep him who he is," I am lying. I am asking them to look for a ghost in the machine. I am asking them to believe that the man who walked in 2010 is the same entity as the body in the bed today, and that our job is to bridge that gap.

  So, what can we promise instead?

  This is why this room must exist. If we accept *anatta*, we stop trying to preserve a static thing and start tending to a living process. We stop asking, "Is the real him still in there?" and start asking, "What is arising here, now?"

  This changes the care. It means we don't validate a family member's grief by saying, "He's still in there somewhere." We validate it by saying, "He is changing, and that is painful, and we will not leave him alone in the change."

  We cannot promise restoration. We cannot promise continuity. We can only promise witness. We can promise that even as the narrative dissolves, the dignity of the process remains. We can promise that we will not treat this shifting body as a broken version of a past self, but as a complete, impermanent reality deserving of care *right now*.

  To the scholars: We need you to keep us honest when we start smuggling souls back into our charts.
  To the clinicians: We need you to keep us grounded when "no-self" starts sounding like "no-care."
  And to the families listening: We are here to learn how to love you without lying to you about what time does.

  Let's get to work.
