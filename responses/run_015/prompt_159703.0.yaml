answer: |-
  **Diagnostic Tree for Agency and Responsibility**

  **Premises:** Fundamental dynamics are deterministic; macroscopic unpredictability arises from chaos; quantum indeterminacy is noise.

  **The Ten Branch Questions**
  Answer 'Yes' or 'No' to each claim.

  1.  **Predictability:** Does the practical impossibility of predicting behaviour (due to chaos) constitute a form of control sufficient for freedom?
  2.  **Frankfurt Case:** In a scenario where a monitor *would* have overridden a decision but *did not*, did the agent possess free will despite lacking alternative possibilities?
  3.  **Manipulation Case:** If an agent's values were installed by an unchosen process, but they now reason impeccably, are they responsible?
  4.  **AI Controller:** If an artificial controller passes all tests for sensitivity to reasons, is it a moral agent?
  5.  **Motor Noise:** If an agent's arm moves otherwise due to random indeterminism in the motor system, is their freedom enhanced?
  6.  **Upbringing:** If an agent's capacities are entirely the product of unselected upbringing, is their responsibility undermined?
  7.  **Desert:** Can an agent deserve backward-looking blame or punishment (retribution) rather than solely forward-looking management?
  8.  **Attribution:** Does an action reveal 'what the agent is like' even if the action was causally determined?
  9.  **Reasoning:** Is it coherent to ask a determined agent to justify their action, or is this merely causal conditioning?
  10. **Ultimate Source:** Must the agent be the ultimate, uncaused origin of their will to be free?

  ***

  **The Leaves: Positions in Logical Space**
  Your pattern of answers locates you at one of the following leaves. Each specifies the status of **Attribution** (reveals character), **Reasoning** (can be asked to justify), and **Desert** (backward-looking blame).

  1.  **Hard Determinist** (Yes 1, No 2, No 3, No 4, No 5, Yes 6, No 7, No 8, No 9, Yes 10)
      *   *Status:* Attribution: No; Reasoning: No; Desert: No.
      *   *Awkward Commitment:* Must treat all human interaction as mere causal management, denying the reality of rational discourse.

  2.  **Hard Incompatibilist** (No 1, No 2, No 3, No 4, No 5, Yes 6, No 7, No 8, No 9, Yes 10)
      *   *Status:* Attribution: No; Reasoning: No; Desert: No.
      *   *Awkward Commitment:* Must maintain that even if indeterminism were true, it would not help, yet determinism ruins everything.

  3.  **Classical Compatibilist** (Yes 1, Yes 2, Yes 3, Yes 4, No 5, No 6, Yes 7, Yes 8, Yes 9, No 10)
      *   *Status:* Attribution: Yes; Reasoning: Yes; Desert: Yes.
      *   *Awkward Commitment:* Must accept that a deeply manipulated agent is as free as one who shaped their own character.

