answer: |-
  ### Part 1: Brainstorming and Filtering

  You have asked for a theory that works on a Monday morning, before the metric is deployed, to predict lifespan and failure mode. This rules out any desideratum that requires historical data from the metric itself. We are looking for structural features of the *situation*, not post-hoc analysis of the *numbers*.

  Here is the initial scratchpad of candidate desiderata, and why I am keeping or killing them:

  1.  **Causal Transparency.** *Idea:* We must know exactly how the metric is caused by the target. *Verdict:* **Keep, but refine.** "Transparency" is too vague. In your freight example, the gate scan is causally linked to delivery, but loosely. I prefer your term "Slack." I will formalize this as **Causal Slack**.
  2.  **Target Definability.** *Idea:* You can't track drift if you don't know the destination. *Verdict:* **Keep, with a caveat.** You rightly noted that "good healthcare" is circular. A hard requirement for perfect definition kills the theory for soft targets. The requirement must be for an *Anchor*—some independent way to sample the truth, even if noisy.
  3.  **Agent Rationality.** *Idea:* Assume people will maximize the number. *Verdict:* **Discard.** This is a background assumption, not a desideratum for the theory. The theory must work regardless of whether they are rational, malicious, or just tired. It must predict what happens when they *try* to optimize, not assume they will.
  4.  **Complexity Penalty.** *Idea:* Complex metrics rot slower. *Verdict:* **Discard.** Sometimes complexity just hides the rot longer. A simple footrace time (distance + clock) never rots. A complex "customer satisfaction index" rots instantly. Complexity isn't the shield; the link to reality is.
  5.  **Constitutive Status.** *Idea:* Your hobbyhorse about footraces vs. freight. *Verdict:* **Keep.** This is critical. If the metric *defines* the success (constitutive), Goodhart's Law doesn't apply in the same way. If the metric *measures* success (diagnostic), it does. The theory must distinguish these regimes.
  6.  **Information Asymmetry.** *Idea:* Do the drivers know more about the gate than the boss? *Verdict:* **Keep.** Gaming requires finding a loophole. Loopholes exist where the agent sees details the designer does not.
  7.  **Decay Rate.** *Idea:* The theory must output a time. *Verdict:* **Keep.** You explicitly asked for "how long." A theory that only says "it will fail" is useless for operations.
  8.  **Reversibility.** *Idea:* Can we fix it once it breaks? *Verdict:* **Discard.** You want prediction and prevention. Remediation is a secondary problem.

  **The Cut:** I am left with six strong candidates. I need to merge or cut one to get to five sharp requirements. I will merge **Information Asymmetry** into **Causal Slack**. Slack exists *because* of asymmetry. If the designer saw everything the agent saw, there would be no slack to exploit. So, Slack is the structural feature; Asymmetry is the cause. I will focus the requirement on the structural feature (Slack) because that is what you can audit on a Monday.

  I am also unsure about **Decay Rate**. Demanding a specific time prediction (e.g., "45 days") might be asking for false precision. However, you asked for "approximately how long." I will frame this as a requirement for the theory to identify the *drivers of velocity* (e.g., reward size, feedback speed), even if it cannot give a calendar date.

  ### Part 2: The Five Desiderata

  Here are the five requirements your theory must meet. I have arranged them in the order you would apply them on that Monday morning.

  | # | Requirement | The Case & Reasoning |
  | :--- | :--- | :--- |
  | **1** | **Target Anchorability** | **The Case:** You noted the circularity problem (e.g., "good healthcare"). If the target is defined *only* by the metric, you cannot detect drift, only redefinition. In your damage claims example, the target was "actual breakage." The metric was "filed claims." When the metric diverged, you knew because customers still complained (the Anchor). <br>**The Reasoning:** The theory must demand an *independent verification channel*, however noisy. It does not need to be perfect, but it must exist outside the incentive structure. If no anchor exists (e.g., "employee morale"), the theory must classify the metric as **Constitutive** (see #3) rather than Diagnostic. If it is Diagnostic but lacks an Anchor, the theory must flag it as "Unfalsifiable Risk." |
  | **2** | **Causal Slack Quantification** | **The Case:** This is your "Slack Ratio." The gate timestamp had high slack (parking outside). The footrace clock has zero slack (you cannot stop the clock without stopping the runner). Trailer utilization had low slack initially (consolidation is hard work), which is why it lasted two years. <br>**The Reasoning:** The theory must provide a method to estimate the ratio of *effort to game* vs. *effort to perform*. If the path of least resistance to a higher number bypasses the target, slack is high. The theory fails if it treats all correlations as equal. It must distinguish between a thermometer (low slack, hard to fake without heat) and a survey (high slack, easy to fake without satisfaction). |
  | **3** | **Regime Classification (Constitutive vs. Diagnostic)** | **The Case:** You asked if this distinction is a hobbyhorse. It is not. In a footrace, the time *constitutes* the win. There is no "real winning" behind the time. In freight, on-time delivery is *diagnostic* of service quality. When you treat a Diagnostic metric as Constitutive (i.e., "the scan *is* the delivery"), you invite the gate-parking failure. <br>**The Reasoning:** The theory must force a binary classification before deployment. If Constitutive: Goodhart effects are features, not bugs (the game changed). If Diagnostic: Goodhart effects are failures. A theory that blurs this line cannot explain why the footrace clock works but the gate scan fails. |
  | **4** | **Epistemic Asymmetry Audit** | **The Case:** Why did drivers find the gate loophole in two months? Because they drive the route; you sit in the office. They know the geography of the metric better than you know the geography of the operation. <br>**The Reasoning:** The theory must account for *who knows the process better*. If the agents have higher resolution knowledge of the process than the designers, the half-life of the metric drops. A theory that assumes the designer understands the process as well as the worker will overestimate metric lifespan. This drives the "by what route" prediction (e.g., they will exploit local knowledge). |
  | **5** | **Decay Velocity Drivers** | **The Case:** You want to know "how long." Damage claims rotted faster than trailer utilization. Why? Because reclassifying breakage is easier than consolidating loads, and the reward was immediate. <br>**The Reasoning:** The theory cannot just say "it will rot." It must identify the variables that set the clock speed: (a) Magnitude of Reward, (b) Speed of Feedback Loop, (c) Complexity of the "Real Work." If the reward is high, feedback is instant, and real work is hard, the theory must predict rapid decay (weeks). If real work is the easiest path to the number, it must predict stability (years). |

  ### Part 3: Conflicts and Uncertainties

  **The Incompatible Pair: Target Anchorability vs. Regime Classification**
  There is a tension between Requirement 1 (Anchorability) and Requirement 3 (Constitutive vs. Diagnostic).
  *   **The Conflict:** If a metric is truly **Constitutive** (like the footrace), Requirement 1 cannot be met. There is no "target" independent of the metric. The time *is* the win. If you demand an Anchor for a Constitutive metric, you are asking a nonsense question.
  *   **The Resolution:** The theory must treat these as mutually exclusive regimes. You cannot apply the "Drift" test (Req 1) to a Constitutive metric. The uncertainty lies in the classification: many metrics *claim* to be Constitutive ("Revenue is all that matters") but are actually Diagnostic proxies for "Long term viability." The theory must provide a test to unmask false Constitutive claims. If leadership says "This number is the goal," but the company goes bankrupt while hitting the number, it was Diagnostic, not Constitutive.

  **The Single Most Important Requirement**
  **Causal Slack Quantification (Requirement 2).**
  This does the most work. If Slack is zero (the footrace), nothing else matters: Asymmetry doesn't matter, Anchors don't matter, Decay doesn't happen. If Slack is high, the system is vulnerable regardless of the other factors. It is the necessary condition for specification gaming. All other requirements describe *how* the slack gets exploited or *when* we notice it, but Slack is the *why*.

  **Explicit Uncertainty**
  I am unsure whether **Decay Velocity Drivers (Requirement 5)** can truly be made predictive without historical data. Physics can predict a bridge's collapse because material properties are constant. Human organizations learn. The "complexity of real work" changes as technology improves. A theory might predict "6 months," but if a new software tool makes the real work easier next month, the metric stabilizes. I am including it because you asked for it, but I flag that this is the weakest link in any social science theory. It will be an estimate of *order of magnitude* (weeks vs. years), not a calendar date.

  ### Part 4: Scoring the Informal Accounts

  You asked me to score the accounts you encounter informally. I will judge them against the five desiderata above.

  **1. The Causal-Model Story**
  *("Map the causal links between metric and target.")*
  *   **Score:** High on Slack, Low on Velocity.
  *   **Verdict:** This is the strongest foundation. It directly addresses Requirement 2. If you map the causality, you see where the slack is. However, it often treats the system as static. It struggles with Requirement 5 (Dynamics) because causal maps don't inherently show how fast agents will learn to traverse the links.

  **2. The Information-Theoretic Story**
  *("The metric loses information about the target under optimization.")*
  *   **Score:** High on Anchorability, Low on Asymmetry.
  *   **Verdict:** This explains *why* the number stops tracking (Requirement 1). It treats the metric as a signal degrading under noise. But it often ignores *who* is generating the noise. It treats the gaming as entropy rather than strategic action (Requirement 4), which makes it bad at predicting the *route* of failure.

  **3. The Mechanism-Design/Incentives Story**
  *("Align the rewards so gaming costs more than working.")*
  *   **Score:** High on Velocity, Low on Slack.
  *   **Verdict:** This addresses Requirement 5 well (magnitude of reward). It assumes you can price the "cost of gaming." The failure is that it often assumes the designer knows the cost of gaming. If Epistemic Asymmetry (Req 4) is high, the designer cannot price the gaming correctly, and the mechanism fails.

  **4. "Use Several Metrics Instead of One"**
  *("Dashboarding.")*
  *   **Score:** Medium on Slack, Low on Anchorability.
  *   **Verdict:** This increases the cost of gaming (you have to game 5 numbers, not 1), which buys time (Req 5). But if all 5 numbers share the same Causal Slack (e.g., five different surveys of the same customers), they all rot together. It delays decay but does not diagnose the structural flaw.

  **5. "Don't Tell Them What You Are Measuring"**
  *("Secret metrics.")*
  *   **Score:** High on Asymmetry, Low on Ethics/Utility.
  *   **Verdict:** This directly attacks Requirement 4 (Epistemic Asymmetry) by flipping it to the designer's favor. It works in the short term. However, it fails Requirement 1 (Anchorability) because if the team doesn't know the target, they can't aim for it, only avoid punishment. It turns the metric into a trap rather than a steering wheel. It is a tactic, not a theory of measurement.

  ### Summary for the Monday Morning Test

  When you are handed that new metric on Monday, do not ask "Is this a good number?" Ask these five questions in order:

  1.  **Anchor:** If this number goes to 100% and the customers scream, do I have a way to know they are screaming? (If no, risk is Unfalsifiable).
  2.  **Slack:** Can I get this number up without doing the work? How many steps does it take? (If few steps, risk is High).
  3.  **Regime:** Is this number the *definition* of winning (sports) or a *sign* of winning (freight)? (If sign, Goodhart applies).
  4.  **Asymmetry:** Do the people being measured know more about how this number is generated than I do? (If yes, expect creative gaming).
  5.  **Velocity:** Is the reward big, and is it paid fast? (If yes, expect rot in weeks, not years).

  If you answer "No, High, Sign, Yes, Yes," put the metric back in the drawer. It is already broken; you just haven't started the clock yet.
