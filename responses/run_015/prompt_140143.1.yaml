      *   **Specific Inputs:** Facts about the 2006 IAU decision, the trigger (Eris), the criteria options (cultural, structural, dynamical), the precedent (Ceres/asteroids), ongoing dissent from planetary scientists, public resistance.
      *   **Specific Requirements:**
          1.  Map the case to the **First Dogma** (Analytic/Synthetic distinction): Was it meaning or fact? Where does the distinction fail to grip? (Mention consequences, degree, orbital dependence).
