answer: |-
  The heat down here wasn't dry; it was wet and heavy, smelling of ozone and melted amber. Kip wiped sweat from his eyes, staring at the channel. The careenium—a thick, luminescent sludge—pulsed through the translucent conduit like a slow heartbeat. According to the cluster of simmballs hovering above the pipe, the flow should be banking hard left toward the residential spires. The symbols glowed a steady, authoritative blue: *Left. Left. Left.*

  But the goo was grinding right, toward the industrial sink, shuddering against the glass walls of the channel.

  "Stop waving that tuner around," Hest grunted. The old keeper was knee-deep in a maintenance hatch, wrenching a physical valve into the substrate itself. "You're flickering the display, not fixing the flow."

  "The display is the command," Kip snapped, adjusting the frequency on his handheld. He tapped the air near the nearest simmball. The symbol shifted from a chevron to a spiral, then back. "If I reinforce the instruction, the substrate has to obey. That's the Protocol."

  "The Protocol is a lie we tell the tenants so they don't panic when the city digests itself," Hest said, heaving on the valve. Metal screamed. "The careenium has momentum. It's hot down here. It wants to go where the heat is. You can't draw a arrow in the air and expect physics to turn."

  "The architects built the balls to steer the goo," Kip insisted. He moved closer to the hover-cluster. The simmballs hummed, a sound that vibrated in his teeth. He punched in a override code. The blue light intensified, flashing red at the edges. *Compel.*

  Below them, the sludge hesitated. For a second, the massive current slowed. Kip grinned. "See? It's listening."

  "It's stalling," Hest corrected. He kicked the hatch cover aside and grabbed a heating rod. "You're confusing the map for the terrain, kid." He jammed the rod into a access port on the pipe itself, bypassing the symbols entirely. He was trying to change the viscosity locally, to make the rightward path too thick to traverse.

  The careenium groaned. A bubble of gas erupted from the sludge, popping against the conduit wall. The flow jerked left, just an inch.

  "There!" Kip pointed. "The symbol worked."

  "The heat worked," Hest said, wiping grease from his forehead. "I changed the pressure gradient. The balls just lit up because the state changed. You're watching the shadow and thinking you're punching the fist."

  Kip ignored him. He started cycling the simmballs manually, forcing them through a sequence of high-command glyphs. The air grew hotter, the humming rising to a whine. The lights above the pipe were blinding now, a strobe of absolute authority. *Obey. Obey. Obey.*

  The careenium reacted violently. It slammed against the left wall of the channel, swirling eddies forming in the thick muck. It looked like it might turn. Kip held his breath.

  Then, with a sound like a tearing sheet, the sludge snapped back to the right. The simmballs flickered wildly, their symbols scrambling into nonsense shapes before resetting to the original *Left* command. They looked pristine, perfect, and utterly ignored.

  Hest pulled the heating rod out. "See? You can't shame the physics into compliance."

  "You didn't let the command integrate," Kip argued, though his voice wavered. He looked at the balls. They were so clean, so separate from the grime below. "Maybe the sequence was wrong. Maybe I need to sync the timing."

  "You need to accept that the city breathes on its own," Hest said, packing his tools. He looked at the stubborn flow, the glowing sludge ignoring the glowing lights. "We're just here to clear the arteries when they clot. Not to tell the blood where to go."

  "So we just let it feed the industrial sink? The residents will lose pressure."

  "Then we grease the slide," Hest said, gesturing to the physical pipe. "We work the meat, not the ghost."

  Kip looked at his tuner, then at the pipe. The hum of the simmballs was steady again, reassuringly logical. The grind of the careenium was visceral, messy, resistant. He couldn't tell if the lights were lying or if the sludge was broken.

  He lowered the tuner but didn't put it away. Hest reached for the valve again.

  "Try the sequence one more time," Kip said quietly.

  "Turn up the heat on section four," Hest replied, not looking up.

  They worked simultaneously, one tweaking the light, one wrenching the metal. The flow shuddered, undecided, humming and grinding in the dark. It didn't turn left, and it didn't settle right. It just vibrated, waiting for something to break.
