answer: |-
  # Diagnostic Taxonomy of Threshold-Sensitive Contextual Modulation (TSCM)

  **Instructions:** Follow the decision path from the Root to a Leaf. Nodes are diagnostic questions; Branches are answers (Yes/No). Leaves identify the theoretical position and its "awkward commitment." Unoccupied logical spaces are marked with a diagnostic of their theoretical status.

  ### **ROOT NODE:**
  **Q1: Does moral feature-salience exhibit non-monotonic threshold-sensitive modulation?**
  *(i.e., Can a feature's valence reverse from reason-for to reason-against solely due to the density of competing features, rather than mere outweighing?)*

  *   **NO** → Go to **Node 2A**
  *   **YES** → Go to **Node 2B**

  ---

  ### **NODE 2A (For Q1=NO):**
  **Q2: Do invariant moral reasons survive modulation intact?**
  *(Note: For Q1=NO, this is logically entailed as YES; this node tests whether the theorist treats invariant weight as principled or brute.)*

  *   **YES** → Go to **Node 3**
  *   **NO** → **[UNOCCUPIED: CONCEPTUAL INCOHERENCE]**
      *   *Diagnosis:* Denying invariant reasons while denying valence reversal leaves no account of why the feature provided any reason at all; it collapses into error theory or non-cognitivism.

  ---

  ### **NODE 2B (For Q1=YES):**
  **Q2: Do invariant moral reasons survive modulation intact?**
  *(i.e., Are there higher-order principles that encode the conditions of the valence reversal, preserving invariance at the meta-level?)*

  *   **NO** → Go to **Node 3** (Standard Particularist Path)
  *   **YES** → Go to **Node 3** (Hybrid Generalist Path)

  ---

  ### **NODE 3:**
  **Q3: Does holism about reasons necessarily extend to holism about all-things-considered (ATC) judgment?**
  *(i.e., Does the context-sensitivity of individual features prevent any principled calculation of the final moral verdict?)*

  *   **YES** → Go to **Node 4A**
  *   **NO** → Go to **Node 4B**

  ---

  ### **NODE 4A (For Q3=YES):**
  **Q4: Does practical reasoning require explicit articulation of the modulatory conditions?**
  *(i.e., Must the agent be able to state the rule governing the judgment to count as reasoning?)*

  *   **NO** → **LEAF 1: Standard Particularism**
      *   *Awkward Commitment:* Must claim that moral learning and expertise are robust phenomena despite the impossibility of stating what is learned.
  *   **YES** → **[UNOCCUPIED: PRACTICAL UNATTRACTIVENESS]**
      *   *Diagnosis:* Demanding explicit articulation for holistic judgments where no invariant reasons exist forces the agent to articulate contradictions or infinite ceteris paribus clauses.

  ---

  ### **NODE 4B (For Q3=NO):**
  **Q4: Does practical reasoning require explicit articulation of the modulatory conditions?**
  *(i.e., Even if ATC judgment is principled, must the agent access those principles consciously?)*

  *   **YES** → **LEAF 2: Principled Contextualism**
      *   *Awkward Commitment:* Must claim that exceptionless principles exist but only by becoming so disjunctively complex they cease to guide action independently of the cases they govern.
      *   *(Note: Also captures **Robust Generalism** if arriving from Q1=NO path; see Limitations below.)*
  *   **NO** → **LEAF 3: Non-Articulable Generalism**
      *   *Awkward Commitment:* Must claim that moral truth is objective and patterned but essentially inexpressible to the agent acting on it.

  ---

  ### **UNOCCUPIED BRANCHES & LOGICAL GAPS**

  1.  **Path: Q1(NO) → Q3(YES)**
      *   *Position:* **Atomistic Generalism**
      *   *Diagnosis:* **Conceptual Incoherence.** If features never reverse valence (Q1=NO) and reasons are invariant (Q2=YES), there is no mechanism to generate ATC holism (Q3=YES) without reintroducing TSCM at the level of weighting.
  2.  **Path: Q1(YES) → Q2(NO) → Q3(NO)**
      *   *Position:* **Atomistic Particularism**
      *   *Diagnosis:* **Unexplored Theoretical Space.** This view accepts valence reversal but denies ATC holism, implying a non-principled but deterministic algorithm for final judgment; it lacks a metaphysical account of how variant reasons sum to a fixed verdict.
  3.  **Path: Q1(YES) → Q2(YES) → Q3(YES)**
      *   *Position:* **Holistic Generalism**
      *   *Diagnosis:* **Practical Unattractiveness.** Posits invariant meta-principles that govern reversal but insists these principles still preclude algorithmic ATC judgment, rendering the invariance practically inert for decision procedures.

  ---

  ### **LIMITATIONS OF THIS TAXONOMY**

  **Indistinguishable Pairs:**
  This axis classifies *structural* commitments regarding reasons and principles, not *ontological* ones. Consequently, it fails to separate:
  1.  **Robust Generalism vs. Principled Contextualism:** If a Robust Generalist (Q1=NO) concedes that principles must be complex to handle edge cases, they land on the same leaf (Leaf 2) as the Principled Contextualist (Q1=YES, Q2=YES). This taxonomy treats them as functionally equivalent regarding articulation, obscuring the metaphysical disagreement over whether the complexity is due to *modulation* or merely *specification*.
  2.  **Naturalist vs. Non-Naturalist Particularism:** Both occupy Leaf 1. This tree diagnoses their logic of reasons but remains silent on whether the contextual modulation is grounded in natural properties or sui generis normative facts.

  **Diagnostic Blind Spot:**
  The tree assumes "Explicit Articulation" (Q4) is a binary requirement. It does not capture views where articulation is *ideally* required but *humanly* impossible (e.g., finite creature limitations vs. divine codifiability), which may artificially group finite generalists with anti-codificationists.
