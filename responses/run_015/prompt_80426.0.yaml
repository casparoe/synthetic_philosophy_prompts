      *   *Reading 2: The Volitional Contradiction Test (Contradiction in the Will).* Can a rational agent *will* this as a universal law without contradicting their own necessary ends? (e.g., not helping others).
      *   *Reading 3: The Empirical/Consequentialist Generalization.* What happens if everyone does this? If the result is bad, don't do it. (This is the partner's view).
