answer: |-
  This is a classic and frustrating moment in applied ethics. Your intuition is correct: your debate partner is deploying a "Generalization Argument" that wears Kantian clothing but breathes Utilitarian air. They are treating the Categorical Imperative as a calculation of aggregate consequences rather than a test of rational consistency.

  However, as a Kant scholar, I must caution you that simply saying "Kant disagrees" isn't enough. Kant's Formula of Universal Law (FUL) is notoriously difficult to apply, and there *are* readings where the boycott could be problematic, just not for the reasons your partner gives.

  Let's brainstorm the space of possible readings of the slogan "Act only if you could will that everyone acted that way." We need to distinguish between the **logical form** of the test, the **content** of what is being universalized, and the **modal status** of the "willing."

  Here is the breakdown of the philosophical space, followed by a menu you can use in your debate.

  ---

  ### 1. The Consequentialist Generalization (Your Partner's Reading)
  *   **The Principle:** "Act only on maxims where the *empirical outcome* of universal adoption is beneficial (or at least not catastrophic)."
  *   **The "Universal":** A statistical aggregation of individual actions. (If $N$ people do $X$, result $Y$ occurs).
  *   **What it Checks:** It checks the *causal consequences* of the action becoming widespread.
  *   **Verdict on Boycott:** Fails. If everyone boycotts, factories close, workers starve. Therefore, don't boycott.
  *   **Kantian Status:** **False.** This is Rule Utilitarianism. Kant explicitly rejects grounding morality in empirical consequences (which are contingent and unpredictable). For Kant, the moral worth lies in the *motive* and the *form of the will*, not the economic fallout. If your partner uses this, they have left Kantian deontology.

  ### 2. The Contradiction in Conception (Strict Duty)
  *   **The Principle:** "Act only on maxims that can be conceived as a universal law of nature without logical contradiction."
  *   **The "Universal":** A law of nature (causality). Could a world exist where this principle drives all rational beings?
  *   **What it Checks:** Logical coherence. Does the universalized maxim destroy the very possibility of the action? (e.g., False promising: If everyone promised falsely, the institution of promising would vanish, making the lie impossible).
  *   **Verdict on Boycott:** **Passes.** There is no logical contradiction in a world where everyone refuses to buy exploitative goods. The concept of "buying" or "not buying" remains intact. The economic collapse is an *empirical* side effect, not a *logical* impossibility.
  *   **Kantian Status:** **Authentic.** This is the first step of Kant's test. Your partner's argument does not trigger a contradiction in conception.

  ### 3. The Contradiction in the Will (Wide Duty)
  *   **The Principle:** "Act only on maxims that a rational being can *will* to be a universal law without contradicting their own necessary ends."
  *   **The "Universal":** A system of ends. Can I rationally want this to be the rule for everyone, given what I must necessarily want as a rational agent (e.g., my own happiness, the help of others)?
  *   **What it Checks:** Volitional consistency. Even if the world *could* exist logically, would a rational agent *choose* to live in it? (e.g., Non-beneficence: I can conceive a world where no one helps anyone, but I cannot *will* it, because I might need help someday).
  *   **Verdict on Boycott:** **Complex.**
      *   *Partner's angle:* I cannot will a world where economies collapse and people starve (contradicts the end of human preservation).
      *   *Your angle:* I cannot will a world where exploitation is universally tolerated (contradicts the end of respecting Humanity as an End in Itself).
      *   *Kantian Status:* **Authentic.** This is where the real debate lies. However, the partner is still smuggling in consequences (starvation) rather than focusing on the *principle* of exploitation.

  ### 4. The "Law of Nature" Formulation (Systemic vs. Aggregate)
  *   **The Principle:** "Act as if the maxim of your action were to become through your will a **universal law of nature**."
  *   **The "Universal":** Not just "everyone does this," but "this is how nature works."
  *   **What it Checks:** Whether the maxim fits into a harmonious system of rational agency.
  *   **Verdict on Boycott:** This highlights the **Maxim Description Problem**.
      *   *Partner's Maxim:* "I will not buy goods." (Too specific, ignores the *reason*).
      *   *Your Maxim:* "I will not participate in transactions that treat rational beings as mere means."
      *   If the maxim is the latter, universalizing it creates a Kingdom of Ends, not an economic collapse. The economic collapse is a contingent fact of our current unjust system, not a necessary feature of a moral world.
  *   **Kantian Status:** **Authentic.** This reveals your partner is universalizing the *action* rather than the *moral principle*.

  ---

  ### The Diagnosis: Where Your Partner Goes Wrong

  Your partner is committing the **Fallacy of Empirical Generalization**. They are treating the Categorical Imperative as a prediction mechanism ("If we all do X, Y happens") rather than a legislative test ("Is X a valid law for rational beings?").

  In Kant's *Groundwork*, he is very clear: we are testing the **form** of the maxim, not the **matter** (the desired outcome).
  *   **Partner:** "If everyone boycotts, the *outcome* is bad." (Consequentialist).
  *   **Kant:** "Is the *principle* of boycotting exploitative labor consistent with rational will?" (Deontological).

  Furthermore, your partner is assuming the economic collapse is a *necessary* result of the universal law. In Kantian terms, this is a contingent fact of the current empirical world (global capitalism), not a necessary truth of rational agency. A moral test cannot depend on the contingent fragility of unjust economic systems.

  ### The Menu for Your Debate

  Here is how you can present this to your partner. Offer them a choice of which "Universal Law" they think they are using.

  #### Option A: The Rule-Utilitarian Reading (Their Current Position)
  *   **Definition:** An action is wrong if the universal practice of it leads to bad net consequences.
  *   **Application:** Boycotting leads to economic collapse (bad), so it's wrong.
  *   **Critique:** "This isn't Kant. This is Mill. Kant explicitly rejects consequences as the ground of morality. If you use this, you admit you aren't arguing from Kantian ethics."

  #### Option B: The Logical Contradiction Reading (Strict Duty)
  *   **Definition:** An action is wrong if universalizing it makes the action logically impossible (like false promising).
  *   **Application:** Is it logically impossible for everyone to refuse sweatshop goods? No.
  *   **Critique:** "The boycott passes this test easily. There is no logical paradox in a world where no one buys exploitative goods."

  #### Option C: The Volitional Contradiction Reading (Wide Duty)
  *   **Definition:** An action is wrong if a rational agent cannot *will* it as a universal law without contradicting their own necessary rational ends.
  *   **Application:** This is the only place they have a foothold. They must argue that willing the boycott contradicts a necessary end (e.g., the preservation of the workers' lives).
  *   **Counter-Critique:** "You are conflating the *principle* with the *side effects*.
      1.  **Maxim Precision:** My maxim isn't 'I won't buy stuff.' It's 'I won't treat humanity as a mere means.' Can I will that everyone respects humanity? Yes.
      2.  **Contingency:** The economic collapse is a result of an *unjust system*, not the moral law. I cannot be bound by an immoral economic threat. If a bandit says, 'Give me money or I shoot,' I don't will the shooting; I will the refusal to be extorted. Similarly, I will the respect for workers, not the collapse of the factory."

  #### Option D: The Formula of Humanity (The Stronger Kantian Argument)
  *   **Definition:** "Act so that you use humanity... always at the same time as an end, never merely as a means."
  *   **Application:** Sweatshops often rely on coercion, deception, or desperate necessity, treating workers as tools for profit.
  *   **Critique:** "If we are doing Kant, we should use the Formula of Humanity. Buying sweatshop goods might implicate me in a system that treats workers as mere means. Boycotting is an attempt to align my will with the respect due to those workers. Your argument suggests I should *continue* treating them as means (buying the goods) to keep the system running. That violates the core of Kantianism."

  ### Strategic Advice

  1.  **Attack the Maxim:** Insist that the maxim must include the *reason* for the action. "I will not buy X *because it is produced exploitatively*." Universalizing *that* principle creates a moral world, not an economic crash.
  2.  **Distinguish "Willing the Action" from "Willing the Consequences":** Kant asks if I can will the *law*, not if I desire the *empirical outcome*. I can will the law "Do not exploit," even if I regret that unjust systems collapse when exploitation stops.
  3.  **The "Blackmail" Objection:** Point out that their argument amounts to moral blackmail. "You must act immorally (support exploitation) or else bad things (economic collapse) will happen." Kant would argue we are responsible for our own adherence to the moral law, not for the chaotic reactions of an unjust world to our morality.

  **Summary for your partner:** "You are using the Categorical Imperative as a crystal ball to predict economic crashes. Kant uses it as a mirror to check for rational consistency. If you want to argue consequences, be a Utilitarian. If you want to argue Kant, you have to show why the *principle* of refusing exploitation is rationally self-defeating, not just economically painful."
