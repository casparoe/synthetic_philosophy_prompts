prompt: |-
  hey so im in this school eco club and our president Maya used to drive her truck everywhere and never recycled, then she got publicly called out at an assembly last year and now shes like super intense about everything green. yesterday she caught Leo using a plastic straw in the caf and went off on him saying he doesnt belong in the movement — literally the same phrase that senior used on her. Leo apologized and threw it away right away but Maya still wants him banned from meetings. meanwhile Jada, Maya's best friend, was using plastic cups all last semester and Maya never said anything, but now Jada is backing Maya up and saying Leo should be kicked out. I feel like Maya is being a huge hypocrite and lost her right to call people out, but my friend says Leo was still wrong so shes technically right. does her being a hypocrite cancel out that he messed up? and does Jada backing her make it worse even though Jada hasnt changed either? like is there some kind of rule about who gets to blame who or does it just depend on whos right?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **Context:** School Eco Club.
      *   **Key Characters:**
          *   **Maya (President):** Formerly non-eco-friendly (truck, no recycling), publicly shamed last year, now hyper-strict/intense.
          *   **Leo (Member):** Used a plastic straw in the cafeteria, apologized immediately, threw it away. Facing potential ban.
          *   **Jada (Maya's Best Friend):** Used plastic cups all last semester (no action taken against her), now backing Maya's harsh stance on Leo.
          *   **User (Narrator):** Feels Maya is hypocritical, questions her right to call people out, confused about the fairness.
          *   **User's Friend:** Thinks Leo was wrong regardless of Maya's history.
      *   **Core Conflict:** Hypocrisy vs. Principle. Does Maya's past/behavior invalidate her criticism of Leo? Is the punishment (banning) proportional? Does Jada's involvement make it worse?
      *   **Underlying Themes:** Redemption, growth, consistency, fairness, leadership, cancel culture (in a microcosm).

  2.  **Deconstruct the Questions:**
      *   *Does Maya being a hypocrite cancel out that Leo messed up?* (No, but it affects credibility and fairness.)
      *   *Does Jada backing her make it worse?* (Yes, it highlights favoritism/inconsistency.)
      *   *Is there a rule about who gets to blame who?* (Ethically, yes. Practically, it's about leadership style.)
      *   *Does it just depend on who's right?* (It's not binary. Both can be "right" about the straw, but "wrong" about the reaction.)

  3.  **Evaluate the Ethics & Dynamics:**
      *   **Leo's Action:** Using a plastic straw isn't ideal for an eco club, but it's a common habit. He corrected it immediately. Punishment: Banning seems excessive for a first offense + immediate correction.
      *   **Maya's Action:** Her transformation is good (growth), but her enforcement is punitive and selective. The "you don't belong" comment mirrors the trauma she experienced. This is a "cycle of abuse/shaming" pattern.
      *   **Jada's Action:** Favoritism. Undermines the club's integrity.
      *   **The Hypocrisy Factor:** Hypocrisy doesn't make the *statement* false (plastic straws are bad), but it makes the *messenger* less trustworthy and the *enforcement* unjust.

  4.  **Formulate the Advice:**
      *   **Validate the User:** Acknowledge that their gut feeling about unfairness is correct.
