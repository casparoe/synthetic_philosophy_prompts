answer: |-
  Here is a 50-minute lesson plan designed for your specific audience. It leverages their technical fluency in modeling while isolating the theoretical constraints they haven't encountered.

  ### 1. The Sequence (0–20 minutes)
  **Goal:** Establish the mathematical preconditions before stating the theorem. If you skip the domain definition, the "weighted sum" looks like an assumption rather than a derived result.

  1.  **Define the Domain (Lotteries, not States):**
      *   **Action:** Explicitly state that we are not ranking deterministic social states (e.g., "Alice gets drug"). We are ranking *lotteries* over social states (e.g., "50% chance Alice gets drug").
      *   **Why here:** If you define the domain as sure outcomes, you only have ordinal utility. Harsanyi requires **vNM cardinal utility**, which only exists in the presence of risk. If you introduce this later, the linearity of the theorem looks like magic.
      *   **Dependency:** vNM utility *depends* on the existence of lotteries. The Aggregation Theorem *depends* on vNM utility.

  2.  **Individual Rationality (The Inputs):**
      *   **Action:** Stipulate that every individual $i$ satisfies vNM axioms. They maximize $E[U_i]$.
      *   **Note:** Emphasize that $U_i$ is cardinal (unique up to positive affine transformation: $aU_i + b$). This is the single biggest friction point for health economists used to QALYs.

  3.  **Social Rationality (The Observer):**
      *   **Action:** Stipulate that the Social Planner *also* satisfies vNM axioms over the same lotteries. They maximize $E[W]$.
      *   **Why:** This forces the social welfare function to be linear in probabilities.

  4.  **The Pareto Condition (The Bridge):**
      *   **Action:** State **Strong Pareto**: If every individual prefers Lottery A to Lottery B (or is indifferent), Society prefers A to B (or is indifferent).
      *   **Addressing your uncertainty:** You asked which premise rules out negative weights. It is **Strong Pareto**. If you only have *Pareto Indifference* (if everyone is indifferent, society is indifferent), the weights could sum to zero (some positive, some negative). Strong Pareto ensures that if any individual gains (and no one loses), social welfare rises, requiring all weights to be non-negative.

  5.  **The Conclusion (The Theorem):**
      *   **Action:** $W = \sum_{i=1}^{n} a_i U_i$, where $a_i \geq 0$.
      *   **Crucial Nuance:** The theorem proves the *form* (linear weighted sum), not the *weights*. It does not prove $a_i = a_j$. It validates Weighted Utilitarianism, not necessarily Classical Utilitarianism.

  ### 2. The Carrying Example (20–35 minutes)
  **Goal:** A whiteboard-ready case that isolates the theorem's mechanics without triggering population ethics or WTP confusion.

  **The Setup:**
  *   **Patients:** Alice and Bob (Fixed $N=2$).
  *   **Resource:** One dose of a curative therapy.
  *   **Utilities:** Assign vNM utilities directly. Do not call them QALYs yet.
      *   State "Cured": $U = 1$.
      *   State "Not Cured": $U = 0$.
  *   **Options:**
      1.  **Sure Alice:** Alice gets dose (Prob=1). Bob gets nothing.
      2.  **Sure Bob:** Bob gets dose (Prob=1). Alice gets nothing.
      3.  **Fair Coin:** 50% Chance Alice gets dose, 50% Chance Bob gets dose.

  **The Whiteboard Calculation:**
  1.  **Calculate Individual Expected Utilities:**
      *   Sure Alice: $E[U_A] = 1, E[U_B] = 0$.
      *   Sure Bob: $E[U_A] = 0, E[U_B] = 1$.
      *   Coin Flip: $E[U_A] = 0.5, E[U_B] = 0.5$.
  2.  **Apply Harsanyi:**
      *   Assume equal weights ($a_A = a_B = 1$) for simplicity.
      *   $W(\text{Sure Alice}) = 1 + 0 = 1$.
      *   $W(\text{Sure Bob}) = 0 + 1 = 1$.
      *   $W(\text{Coin}) = 0.5 + 0.5 = 1$.
  3.  **The Result:** The theorem forces the Social Planner to be **indifferent** between giving the drug to a specific person and flipping a coin.

  **What the Example Must Contain:**
  *   **Risk:** The coin flip option is non-negotiable. Without it, you cannot test the vNM linearity.
  *   **Fixed Identity:** Do not allow "treating 100 people vs 10 people." Keep $N$ fixed to avoid population ethics.
  *   **Non-Metric Utility:** Explicitly state these are "preference satisfaction units," not dollars. This blocks the silent translation to WTP.

  **What the Example Must Not Contain:**
  *   **Cost:** Do not introduce budget constraints. This is about ranking, not optimization under scarcity.
  *   **Clinical Heterogeneity:** Keep $U(\text{Cured})$ identical for both. If Alice benefits more than Bob, the group will argue about efficiency rather than equity.

  ### 3. Addressing Misconceptions & Objections (35–45 minutes)
  **Goal:** Let the limitations land as logical consequences, not slogans.

  1.  **QALYs vs. vNM Utility:**
      *   **Point:** QALYs are typically time-trade-off based. They are cardinal, but they are not necessarily vNM utilities (people are rarely risk-neutral over QALYs).
      *   **Implication:** Harsanyi licenses summing *vNM utilities*. It does not license summing QALYs unless you assume risk neutrality over health states.

  2.  **Summing $\neq$ Equal Concern:**
      *   **Point:** The theorem allows $a_i \neq a_j$. You can have a Harsanyi-compliant prioritarian view if you assign higher weights to the worse off *ex ante*.
      *   **Correction:** The theorem restricts the *aggregation method* (linear), not the *weights*.

  3.  **Sen's Distributional Indifference (Place this here):**
      *   **Action:** Modify the example.
      *   **Scenario X:** Alice gets 10 units, Bob gets 0. (Sum = 10).
      *   **Scenario Y:** Alice gets 5 units, Bob gets 5. (Sum = 10).
      *   **Result:** Harsanyi says $W(X) = W(Y)$.
      *   **Why it lands:** Because you just showed them the math. The indifference isn't a moral claim you made; it's an arithmetic output of the linear form derived from the Pareto axiom.

  4.  **The Coin Flip Objection (Diamond's Critique):**
      *   **The Argument:** Many people feel the Coin Flip is *fairer* than Sure Alice, even if expected utility is identical.
      *   **Whiteboard Proof (2 mins):**
          1.  Let $L$ be the Coin Flip lottery. $L = 0.5(\text{Sure Alice}) + 0.5(\text{Sure Bob})$.
          2.  By Symmetry, Society is indifferent between Sure Alice and Sure Bob ($W_A = W_B$).
          3.  By vNM Linearity (Social Rationality), $W(L) = 0.5 W_A + 0.5 W_B$.
          4.  Therefore, $W(L) = W_A$.
      *   **The Break:** The theorem evaluates *ex post* outcomes averaged by probability. It cannot value *ex ante* fairness (the equality of opportunity itself) as a separate good. To prefer the coin, you must violate vNM linearity (e.g., rank-dependent utility).

  5.  **The Impartial Observer (One Sentence Distinction):**
      *   **Script:** "Harsanyi has two arguments: the **Aggregation Theorem** (which we just did) takes individual preferences as fixed inputs and derives the social function; the **Impartial Observer** argument assumes a veil of ignorance to *derive* the individual preferences and weights themselves. Do not conflate the derivation of the weights with the aggregation of the utilities."

  ### 4. Closing & Scope (45–50 minutes)

  **The Closing Question:**
  > "If we replace the 'Fair Coin' with a 'Loaded Coin' that gives the dose to the patient with the higher baseline utility, does Harsanyi's theorem give us any language to object to that procedure on fairness grounds, or only on efficiency grounds?"

  *   *Correct Answer:* Only on efficiency grounds (if the weights are equal). The theorem has no vocabulary for procedural fairness, only expected outcome value.
  *   *Why this works:* It tests if they understand that the "fairness" of the process is invisible to the social welfare function derived.

  **The "Do Not Cover" List (Explicitly State This):**
  1.  **The Proof:** "We are not proving the linear algebra behind the functional form today."
  2.  **Interpersonal Comparison of Utility:** "We are assuming utilities are comparable. How we calibrate that (unit comparability vs level comparability) is a separate measurement problem."
  3.  **Endogenous Preferences:** "We are taking preferences as given. We are not asking if the preferences themselves are adaptive or unjust."
  4.  **Population Ethics:** "We are holding $N$ constant. We are not addressing the 'Repugnant Conclusion' or critical-level utilitarianism."

  ### Summary of Dependencies for Your Notes
  *   **Lotteries** $\rightarrow$ enable **vNM Utility**.
  *   **vNM Utility** $\rightarrow$ enables **Linearity of Expectation**.
  *   **Linearity + Strong Pareto** $\rightarrow$ forces **Weighted Sum Social Welfare**.
  *   **Weighted Sum** $\rightarrow$ implies **Indifference to Distribution** (Sen) and **Indifference to Process** (Diamond).
  *   **Aggregation Theorem** $\neq$ **Impartial Observer** (Inputs vs. Derivation).

  This sequence respects their modeling background while forcing the theoretical constraints into the open before they can dismiss them as semantic quibbles.
