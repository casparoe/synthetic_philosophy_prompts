  ---

  ### LEAF CHARACTERIZATIONS

  1.  **Emergence as Unpredictability:** Macro is real but fully determined by micro; "emergence" is just a label for computational limits.
  2.  **Ill-Formed Question:** The micro/macro distinction is a category error in this context.
  3.  **Deflationary View:** Macro vocabulary is a convenient redescription and nothing else.
  4.  **Non-Reductive Physicalism (MR):** Macro properties are multiply realizable; micro-details are swamped, but micro is still the ontological base.
  5.  **Irreducibility with Downward Influence:** Macro states exert genuine causal influence on micro constituents.
  6.  **Autonomy (Interventions):** Macro theory is explanatorily closed relative to the class of laboratory interventions.
  7.  **Identity without Derivation:** Macro and Micro refer to the same ontological item, even if derivation is hard.
  8.  **Derivational Reduction:** Macro laws are derivable via bridge laws which are themselves natural facts.
  9.  **Unoccupied (Micro-Privileged Non-Reductive):** Claims Macro is "distinct" (Node 2) but Micro always trumps it (Node 6). *Empty because incoherent: if Micro always trumps, the distinction is epistemic, not ontological.*
  10. **Unoccupied (Radical Pluralism):** Claims "Both" are revised (Node 6) but denies Downward Causation (Node 5). *Empty because unattractive: leaves the conflict unresolved without a mechanism.*

  ---

  ### TIE-BREAKER SECTION

  **For Leaves 7 (Identity) and 8 (Reduction):**
  These positions often converge on practice. To separate them, ask:
  *"If the micro-theory were proven false tomorrow, would the macro-law (e.g., Navier-Stokes) cease to be true?"*
  *   **YES:** You are a **Reductionist (Leaf 8)**. Truth flows from the base.
  *   **NO:** You are an **Identity Theorist (Leaf 7)**. The macro-property is robust enough to survive the micro-theory's replacement.

  **For Leaves 3 (Deflationary) and 1 (Unpredictability):**
  *"Is the macro-law strictly *false* (because it ignores micro-details), or just *coarse*?"*
  *   **FALSE:** **Deflationary (Leaf 3).**
  *   **COARSE:** **Unpredictability (Leaf 1).**

  ---

  ### LOGICAL SPACE NOTES

  **Empty Combinations:**
  1.  **Leaf 9:** Occupies the space of claiming ontological distinctness (Node 2) while granting epistemic privilege to the micro-base in conflict (Node 6). This is unstable; it collapses into Deflationism or Reductionism upon reflection.
  2.  **Leaf 10:** Occupies the space of denying causal conflict (Node 5) while refusing to prioritize either description in resolution (Node 6). Without downward causation or priority, there is no mechanism to resolve the disagreement, rendering the position operationally inert.

  **Indistinguishable Leaves:**
  *   **Leaves 3 (Deflationary) and 1 (Unpredictability)** are often pragmatically identical in the lab. Both treat the macro-model as subordinate. The Tie-Breaker (False vs. Coarse) is the only metaphysical separator.

