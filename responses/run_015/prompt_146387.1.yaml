      *   *Key Philosophical Distinction:* Intentionality. Beliefs have mind-to-world direction of fit. Desires have world-to-mind. The user is arguing neuroscience captures mind-to-world (prediction) but needs world-to-mind (setpoint) as a primitive.

  10. **Final Polish:** Ensure the advice is actionable for an essay draft. (e.g., "Define setpoint carefully," "Engage with Active Inference," "Keep LLMs in a footnote").

  *(Self-Correction post-drafting thought)*: Wait, if the user says desires are setpoints, and setpoints are real neural structures, isn't that *Reductive Materialism* rather than *Eliminativism*? Churchland eliminates *folk* concepts. If "desire" maps neatly onto "setpoint," then desire isn't eliminated, it's reduced. The user claims Churchland-style elimination works for beliefs. This implies beliefs *don't* map neatly. This is a crucial distinction. I need to point out that if desires survive as setpoints, that's actually an argument *against* eliminativism for desires, supporting a hybrid view. I should clarify this terminology trap.

