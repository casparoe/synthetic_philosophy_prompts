  # Joint Statement on the Attribution of Experience to Non-Human Animals
  **Prepared for:** Advisory Consultation (Literary Project)
  **Parties:** Beast-Machine Camp (BM) | Continuity Camp (C)
  **Date:** Current Era

  ## Agreed Claims

  1.  **On Descartes' Tests:** The *Discourse on Method*'s two famous tests (language use and flexible action) target general-purpose rational intelligence, not sentience itself; therefore, failing these tests does not logically entail the absence of felt pain. *(Refined from draft to clarify logical entailment vs. evidence.)*
  2.  **On the Mechanical Inference:** The claim "animals are machines" plus behavioral evidence does not entail "animals have no experiences" without the additional premise that the specific physical arrangement of animal nervous systems is insufficient for phenomenology; this premise, not the anatomy alone, is the real battleground. *(Refined from draft to accommodate modern physicalist BM views which accept matter can feel in humans.)*
  3.  **On Historical Exegesis:** It is genuinely unsettled what Descartes himself held regarding animal sensation—whether he denied sensation entirely or only denied conscious thought and an immaterial mind—and no single sentence in his corpus settles the matter definitively.
  4.  **On Epistemic Asymmetry:** The evidence for animal experience is one step removed in a way it is not for other humans, since for other humans we have first-person reports, whereas for animals we rely solely on third-person observation and analogy.
  5.  **On Ontology and Ethics:** The metaphysical question (what animals are) and the normative question (how we may treat them) are separable; the former does not logically entail the latter without an additional normative premise regarding the moral value of experience. *(Refined from draft to acknowledge the need for a normative bridge.)*
  6.  **On Behavioral Matching:** If we encountered a creature that matched humans behavior-for-behavior and injury-reaction for injury-reaction but never spoke, the intuitive pressure to attribute experience would be enormous; the dispute lies in whether that pressure constitutes epistemic entitlement or merely psychological projection.

  ## Disagreements

  | Topic | Beast-Machine Camp (BM) Wording | Continuity Camp (C) Wording | Genuine or Verbal? | Justification |
  | :--- | :--- | :--- | :--- | :--- |
  | **Inference Method** | Attribution of experience requires positive evidence of a specific neural architecture known to support consciousness in humans; absence of evidence is evidence of absence in this context. | Attribution of experience is the best explanation for observed behavior and evolutionary continuity; absence of direct report should not override inference to the best explanation. | Genuine | Disagreement on the burden of proof and the weight of negative evidence. |
  | **Function of Pain** | "Pain" is a functional state of damage avoidance and learning; attributing a "felt quality" adds no explanatory power to the description of the mechanism. | "Pain" includes a felt quality that explains the *urgency* and *priority* of avoidance behavior in a way pure functionalism cannot fully capture. | Genuine | Disagreement on whether qualia have causal/explanatory relevance. |
  | **Neural Threshold** | Consciousness requires a specific, high-level architectural integration (e.g., global workspace, thalamocortical loops) absent in most animals. | Consciousness is a gradient property emerging from basic sensory-nociceptive systems present in most vertebrates and some invertebrates. | Genuine | Disagreement on the necessary and sufficient physical conditions for experience. |
  | **Definition of "Mind"** | "Mind" implies a capacity for reflexive thought and report; without this, "experience" is a category error. | "Mind" includes pre-reflective sentient experience; restricting it to reportable thought is an arbitrary linguistic restriction. | Verbal | Disagreement stems largely from differing definitions of the term "mind" or "thought." |

  ## Cruxes

  ### Crux 1: The Explanatory Work of Qualia
  **Question:** Does attributing "felt pain" do any explanatory work over and above a purely functional description of avoidance learning and nursing behavior?
  **Case:** *The Human Painless Patient.* A hypothetical human case in which the full behavioral and autonomic pain profile is present (withdrawal, screaming, elevated cortisol) but the patient sincerely reports no felt pain (analgesia without anesthesia).
  **Predictions:**
  *   **BM:** Predicts this case shows behavior can be fully decoupled from feeling; therefore, animal behavior similarly proves nothing about feeling.
  *   **C:** Predicts this case is a pathological exception that proves the rule; normally, behavior and feeling are linked, so animal behavior is reliable evidence.
  **Losing Conditions:**
  *   **BM loses if:** It is demonstrated that the patient's behavior *requires* a felt component to be coordinated effectively in complex environments.
  *   **C loses if:** It is demonstrated that the patient's behavior is functionally identical to a painful state in all learning outcomes, rendering the "feeling" causally idle.

  ### Crux 2: The Best Explanation Threshold
  **Question:** What it takes for "best explanation" to license attributing felt pain to a subject that can never report.
  **Case:** *The Echoes.* A species with no central brain, a distributed nerve net, nothing homologous to ours, yet it avoids for months the place where it was injured, reroutes when the old path is blocked, and spends days tending a wounded conspecific.
  **Predictions:**
  *   **BM:** Verdict: No experience. The behavior is complex but can be explained by distributed reflex arcs; the lack of integration precludes a "subject" of experience. (Note: C may split internally on this case.)
  *   **C:** Verdict: Experience likely. The flexibility and care behavior suggest a unified state of aversion that functionalism alone cannot explain without attributing sentience.
  **Losing Conditions:**
  *   **BM loses if:** A model is produced showing distributed networks *cannot* produce this behavior without a central integrator that implies consciousness.
  *   **C loses if:** A model is produced showing this behavior is achievable via simple reactive algorithms without any internal state modulation.

  ### Crux 3: The Dualism Disguise
  **Question:** Whether the whole thing is really the dualism-versus-physicalism fight in disguise, i.e., whether part of it is verbal.
  **Case:** *The Synthetic Canine.* A robot built from silicon and code that matches a dog behavior-for-behavior, including injury avoidance and vocalization, but is known to lack biological tissue.
  **Predictions:**
  *   **BM:** Verdict: No pain. Substrate matters; biological flesh is required for the specific causal powers of consciousness.
  *   **C:** Verdict: Pain. Function matters; if it acts like it hurts, it hurts, regardless of substrate (Functionalism).
  **Losing Conditions:**
  *   **BM loses if:** They must admit humans could theoretically be uploaded to silicon and still feel pain (undermining substrate dependence).
  *   **C loses if:** They must admit that a perfect simulation of pain behavior is indistinguishable from pain even when known to be code (undermining the reality of the feeling).

  **Joint Note on Debate Movement:** Both camps acknowledge that settling **Crux 1 (The Explanatory Work of Qualia)** would actually move the debate. If "felt pain" is proven causally idle, the Continuity Camp loses its primary lever for attribution. If "felt pain" is proven necessary for the observed behavioral complexity, the Beast-Machine Camp loses its primary defense.

  ## Dialogue (Period Appropriately Adapted)

  **Concession (Father):** "I grant you, I cannot prove the absence of a shadow any more than its presence; the beast's interior is a closed book."
  **Hard Line (Father):** "But you weep for a clock that cannot know it is broken; your pity is for yourself, projected onto a mechanism that feels nothing."

  \answer{The Explanatory Work of Qualia}
