answer: |-
  This is the exact stalemate that defines the field right now. Your friend is betting on **operationalizability** (if we can't measure it via report/broadcast, it's not science); you are betting on **explanatory depth** (if the theory doesn't explain *why* broadcast feels like anything or accounts for rich perception, it's just a model of reporting).

  Here is the specification list you asked for. It is designed to force a theory of *Access Consciousness* (A-consciousness) to show its cards regarding mechanism, measurement, and metaphysics. I have annotated each item with the **Rationale** (the case/consideration) and the **Status** (Non-Negotiable vs. Camp Prejudice).

  ***

  # Desiderata for a Theory of Conscious Access

  ### 1. The Consumer Specification (The "Echo Patient" Test)
  *   **Specification:** The theory must explicitly define the set of downstream systems ("consumers") that constitute "access." It must distinguish between: (a) online motor guidance, (b) immediate verbal report, and (c) flexible, delayed reasoning/memory.
  *   **Rationale:** As per your **Echo Patient**: she has (a) but lacks (b) and (c). If access is defined as "availability for report," she has no access. If access is "availability for action," she does. A theory cannot equivocate here. It must state which consumer is constitutive of access.
  *   **Status:** **Non-Negotiable.** (Without this, you cannot classify dissociations.)

  ### 2. The Format/Topology Distinction
  *   **Specification:** The theory must distinguish between *encoding format* (translation into a common currency) and *routing topology* (physical broadcast to multiple modules). It must state whether access fails due to bad translation or lack of distribution.
  *   **Rationale:** Addresses your **(2)**. GWT often conflates these. If a state is in the right format but not broadcast, is it accessed? If it is broadcast but in a proprietary code, is it accessed? A theory of *access* needs to know if the bottleneck is a translator or a switchboard.
  *   **Status:** **Non-Negotiable.** (Required for mechanistic clarity.)

  ### 3. Neural Independence (The "Ignition" Trap)
  *   **Specification:** Neural signatures (e.g., P3b, late ignition, prefrontal activity) must be framed as *contingent correlates*, not *constitutive definitions*. The theory must allow for the logical possibility of access without ignition, or ignition without access.
  *   **Rationale:** Addresses your **(3)**. If "access" is *defined* as "global ignition," the theory is unfalsifiable tautology. We need to be able to imagine a world where ignition happens but nothing is accessed (zombie ignition) to test the link.
  *   **Status:** **Non-Negotiable.** (Required for falsifiability.)

  ### 4. Report-Independent Operationalization
  *   **Specification:** The theory must provide a "gold standard" measure of access that does not rely on subjective report or verbal output. It must specify what objective performance metric (e.g., post-decision wagering, priming specificity, gaze contingency) counts as proof of access in the absence of report.
  *   **Rationale:** Addresses your **(4)**. If report is the only measure, you cannot distinguish between "unconscious processing" and "conscious state without motor output." This is the measurement trap.
  *   **Status:** **Non-Negotiable.** (Required to avoid circularity.)

  ### 5. Feature Dissociation Capacity
  *   **Specification:** The theory must explain whether access is object-based or feature-based. It must account for cases where one attribute (motion) is accessed while another (color) of the *same object* is not.
  *   **Rationale:** Addresses your **(5)**. Sperling, rivalry, and change blindness suggest access is selective. If access is "global," how can it be partial? The theory must explain the granularity of the broadcast unit.
  *   **Status:** **Camp Prejudice.** (GWT tends toward object-based; feature-based views lean toward overflow. But a theory *could* stipulate all-or-none access and deny the phenomenology of the unaccessed features.)

  ### 6. Conceptual Hygiene (The Four-Way Split)
  *   **Specification:** The theory must provide necessary and sufficient conditions to distinguish Access from: (a) Attention, (b) Working Memory maintenance, (c) Metacognitive Confidence, and (d) Task Accuracy.
  *   **Rationale:** Addresses your **(6)**. High confidence does not guarantee access (confident errors); attention does not guarantee access (inattentional blindness). A theory of access that collapses into "attention" is not a theory of access.
  *   **Status:** **Non-Negotiable.** (Required for conceptual coherence.)

  ### 7. Anatomical Commitment (The PFC Question)
  *   **Specification:** The theory must take a stand on the Pre-Frontal Cortex (PFC). Is PFC activity the *workspace itself*, or is it the *report machinery* bolted onto a posterior workspace?
  *   **Rationale:** Addresses your **(7)**. If PFC is just report machinery, then patients with PFC lesions should have access but no report. If PFC is the workspace, they should have no access. GWT lives or dies on this distinction.
  *   **Status:** **Camp Prejudice.** (Empirically contested. Posterior-only theories exist, but GWT traditionally leans PFC.)

  ### 8. The Bottleneck Rationale (Evolutionary Economics)
  *   **Specification:** The theory must identify the scarce resource being economized. Is it bandwidth? Metabolic cost? Time? Interference? It must explain why evolution selected for a system that *throws information away*.
  *   **Rationale:** Addresses your **(8)**. If processing is parallel and rich (as psychophysics suggests), why have a serial bottleneck? "Bandwidth" is a metaphor; the theory needs the currency.
  *   **Status:** **Non-Negotiable.** (Functional theories require a functional rationale.)

  ### 9. The Access/Phenomenal Coherence Condition
  *   **Specification:** The theory must explicitly state the modal relationship between Access (A) and Phenomenology (P). Does A entail P? Does P entail A? Are they independent? It must explain how a functional account of access avoids collapsing into behaviorism *or* smuggling phenomenology back in as a premise.
  *   **Rationale:** Addresses your **(9)**. This is the core of your 1am argument. If access is just "available for use," why isn't a thermostat access-conscious? If you add "and it feels like something," you've abandoned functionalism.
  *   **Status:** **Non-Negotiable.** (The theory must declare its metaphysical debt.)

  ***

  # The Architecture Question (AI & Transformers)

  **Requirement:** The theory must adjudicate the status of non-biological bottleneck architectures (e.g., a Transformer with a tiny scratchpad/attention head).

  *   **The Test:** If a Transformer restricts information flow through a narrow latent layer (bottleneck) and then broadcasts that representation to multiple output heads (decoders), does the theory classify this as **Conscious Access**?
  *   **The Implication:**
      *   **If YES:** The theory is a pure functionalist/computational theory. It risks panpsychism or trivializing consciousness (is a router conscious?).
      *   **If NO:** The theory relies on biological specificities (e.g., specific thalamocortical loops, neuromodulation). It risks biological chauvinism and loses generality.
  *   **Verdict:** Most GWT variants must say **YES** (it's about the architecture, not the substrate). Block-style overflow views might say **NO** (if they tie phenomenology to biological implementation).

  ***

  # The "Killer" Desideratum

  If you only check one box to knock out candidate theories, it is **Desideratum #4 (Report-Independent Operationalization)**.

  *   **Why:** It is the single point where most theories fail. GWT often relies on report to define access, making it circular. Overflow theories (Block) posit access without report but struggle to measure it without begging the question. The theory that can point to a neural or behavioral marker of access that *does not* require the subject to say "I saw it" wins the field. Currently, no theory fully satisfies this.

  ***

  # Short Scorecard

  **1. Block-Style Overflow (Rich Phenomenology, Poor Access)**
  *   **Pros:** Handles Sperling and the "feeling" of richness well. Respects the Access/Phenomenal split (Desid #9).
  *   **Cons:** Struggles with Desid #4 (How to measure the overflow if not by report?). Risks making access epiphenomenal.
  *   **Verdict:** Best for phenomenology, worst for operationalization.

  **2. Baars/Dehaene Global Workspace (Access = Broadcast)**
  *   **Pros:** Excellent on Desid #1 (Consumers) and #8 (Bottleneck). Clear mechanistic story. Handles the AI question cleanly (functionalism).
  *   **Cons:** Struggles with Desid #9 (relocates the mystery). Often conflates report with access (violates Desid #4). PFC commitment (Desid #7) is empirically shaky.
  *   **Verdict:** Best for science/engineering, worst for the "hard problem."

  **3. Higher-Order Thought (HOT) (Access = Meta-Representation)**
  *   **Pros:** Strong on Desid #6 (separates state from awareness of state). Explains why some accessed info isn't conscious (no HOT).
  *   **Cons:** Struggles with Desid #1 (Infants/Animals?). Risks infinite regress. Often collapses access into metacognition (violates Desid #6).
  *   **Verdict:** Best for conceptual precision, worst for neural mapping.

  ***

  **TA Note:** If your friend insists GWT is the only game in town, ask her to define access without using the word "report." If you insist Overflow is real, ask yourself how you'd measure it in a patient who can't speak. That's where the seminar should live.
