answer: |-
  **The question, stated tightly**

  Under Neurathian anti-foundationalism, the virtue of a picture language lies not in its correspondence to facts, but in its capacity to facilitate content disagreement without code disagreement. This project asks whether Otto Neurath's ISOTYPE methodology offers a viable epistemic criterion for modern uncertainty visualization. Neurath argued that we rebuild our knowledge ship plank by plank while at sea; there is no dry dock of protocol sentences. If pictures function as a language within this holism, their success cannot be measured by how faithfully they mirror a theory-independent world. Instead, I propose evaluating visualizations by their "revision-readiness": when new evidence arrives, does the visual language allow the community to update the depicted content without abandoning the convention or arguing about what the symbols mean? I will test whether this criterion explains why certain uncertainty graphics succeed where others fracture public understanding, independent of their statistical accuracy.

  **Why the two obvious framings leave it open**

  Existing scholarship approaches Neurath's pictures through two lenses, neither of which generates my proposed criterion. The first, favored by historians of the Unity of Science movement, treats ISOTYPE as a pedagogical tool or political propaganda. On this reading, the pictures are secondary to the philosophical program—a charming footnote to the protocol-sentence debate. This framing ignores the specific epistemic logic Neurath attributed to the images themselves. It cannot explain why one chart structure sustains inquiry better than another, only that it served a social goal.

  The second framing, dominant in informatics and graphical integrity literature, asks whether a chart faithfully encodes underlying numbers. This approach assumes a foundationalist picture of science: there are facts, and the chart distorts them or it does not. This contradicts Neurath's anti-foundationalism. If there is no theory-independent access to the "facts," fidelity is incoherent as a primary standard. Furthermore, graphical integrity focuses on static distortion, not dynamic convention stability. It measures whether a user misreads a log scale, not whether the visual language allows for revision without collapsing the shared code. Neither framework captures the specific Neurathian virtue of maintaining conventional stability while updating empirical content. Therefore, neither can generate the criterion of revision-readiness. This project must construct a third way that treats the visual convention as a constitutive part of the inquiry, not merely a vessel for data or a tool for outreach.

  **Method — months 1 through 9**

  This project proceeds in three phases over nine months. Months 1–3 focus on textual reconstruction. I will analyze Neurath's writings on "transformation"—the process by which Marie Reidemeister and Gerd Arntz converted source data into pictograms. The goal is to codify the rules governing when a transformer alters the code versus when they alter the tokens. This establishes the theoretical baseline for revision-readiness.

  Months 4–6 apply this baseline to three case studies: COVID-era projection fan charts, the hurricane "cone of uncertainty," and IPCC "burning embers" diagrams. These cases earn their place by representing distinct uncertainty types: probabilistic projection, path prediction, and consensus modeling. I will analyze historical revisions of these charts. For example, when pandemic models shifted, did the fan chart convention hold, or did the legend require redefinition? I will look for instances where the visual language forced a conceptual argument rather than a data update.

  Months 7–9 involve synthesis and drafting. I will compare the cases against the textual baseline to determine if revision-readiness predicts communicative stability. To ensure the criterion does real explanatory work, I will identify at least one instance where a visually "accurate" chart failed due to low revision-readiness, and one "imprecise" chart that succeeded because the convention remained stable. This contrast will demonstrate that the criterion is not reducible to accuracy or aesthetics. The final deliverable will be a draft article arguing for revision-readiness as a distinct epistemic virtue in public science communication.

  **Possible results and what would decide between them**

  Three outcomes are possible. First, the criterion holds: revision-readiness explains stability in the case studies where accuracy metrics do not. This validates Neurath's picture-language as a distinct epistemic tool. Second, the criterion collapses into correspondence. If "successful revision" simply means "updating the chart to match new facts," then revision-readiness is just correspondence-tracking in disguise. I will decide between these by examining the transformer's role. If the transformer changes the visual grammar to fit the data, it is correspondence. If they keep the grammar and adjust the tokens despite data ambiguity, it is Neurathian.

  Third, the criterion collapses into aesthetics. If "stable convention" means merely "pleasing design," the project loses philosophical force. I will guard against this by focusing on instances of disagreement. Aesthetic consistency does not facilitate disagreement; epistemic convention does. If the cases show that stable codes allow experts to disagree on numbers without confusing the public, the aesthetic collapse is avoided. The decisive factor is whether the visual language sustains a shared space for dissent. If the charts merely smooth over conflict, the project fails. If they structure conflict productively, the Neurathian framework succeeds.

  **Failure modes and scope**

  The primary risk is triviality. If revision-readiness amounts to "clarity," the project adds nothing to existing design literature. I will avoid this by strictly defining clarity as psychological ease and revision-readiness as conventional stability under evidential stress. Another risk is scope creep. Nine months is insufficient for empirical user studies to test how audiences actually interpret these charts. I will cut this first. This is a philosophical reconstruction of the visual logic, not a psychology experiment. I will rely on documented public reception and expert critiques rather than new data collection. Finally, if the textual analysis reveals Neurath's "transformation" was entirely ad hoc, the theoretical baseline will crumble. In that case, I will pivot to reconstructing a "Neo-Neurathian" criterion inspired by his commitments but not bound by his specific practice. The scope remains fixed on the logic of the visualization, not the history of the Vienna Museum.
