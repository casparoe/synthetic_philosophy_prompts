answer: |-
  Here is the breakdown of the linguistic and philosophical machinery at work in your argument. You have identified a genuine and well-documented fracture in how we process conditionals, but your friend was half-right and half-wrong about the terminology.

  ### 1. Brainstorming the Nearest Concepts

  Before settling on the correct carving, here are the five nearest concepts that usually get thrown around in this discussion, along with what they cover and where they fall short for your specific case.

  1.  **Indicative vs. Subjunctive Mood:**
      *   *What it covers:* The grammatical distinction. "If he *didn't*" (indicative) vs. "If he *hadn't*" (subjunctive/perfect).
      *   *Why it's close:* This is the surface-level trigger for the change you noticed.
      *   *Why it's wrong:* This is just a label for the verb forms, not an explanation of the meaning shift. You can have subjunctive forms that don't carry the same implications in different contexts (like your "future" example). It describes the *syntax*, not the *semantics*.

  2.  **Presupposition of Falsity:**
      *   *What it covers:* The intuition that counterfactuals ("If he hadn't...") imply the antecedent is false (i.e., he *did* do it).
      *   *Why it's close:* This explains the first change you noticed (the hint that the husband is guilty).
      *   *Why it's wrong:* It doesn't explain the second change (the demand for a connecting story). You can have a false antecedent without a causal link (e.g., "If the moon were made of cheese, 2+2 would still equal 4"). This concept covers the *falsity hint* but not the *connection requirement*.

  3.  **Connexivity (or The Connection Requirement):**
      *   *What it covers:* The idea that a conditional is only true if there is a relevant link (causal, explanatory, or inferential) between the "if" part and the "then" part.
      *   *Why it's close:* This explains why the second version demands a "story" while the first one works on pure logic (disjunction).
      *   *Why it's wrong:* Connexivity is often debated as a universal rule for *all* conditionals. Your observation is specifically that the *indicative* version seems to waive this requirement while the *counterfactual* version enforces it. Connexivity alone doesn't explain the split between the two sentence types.

  4.  **Epistemic vs. Ontic Modality:**
      *   *What it covers:* **Epistemic** conditionals deal with states of knowledge or belief (what follows from what we know). **Ontic** (or metaphysical) conditionals deal with how the world works (causal laws, physical possibilities).
      *   *Why it's close:* This is the heavy hitter. It explains why the first sentence is about your lack of knowledge ("One of them did, I don't know which") and the second is about the mechanics of the crime ("In a world where he didn't, the brother's nature/plan would cause him to").
      *   *Why it's wrong:* It's a broad category. It doesn't inherently explain why the "would" version triggers the falsity hint (that's often pragmatic), though it explains the connection requirement (that's semantic).

  5.  **Biscuit (or Relevance) Conditionals:**
      *   *What it covers:* Conditionals where the "if" clause doesn't make the "then" clause true, but makes it *relevant* to say (e.g., "If you're thirsty, there's beer in the fridge").
      *   *Why it's close:* This explains your "offer" bullet point perfectly.
      *   *Why it's wrong:* This is a specific sub-type of conditional. Your true crime example is a standard factual conditional, not a relevance conditional. Using this label for your main case would be a category error.

  ### 2. The Selection: Epistemic vs. Ontic Modality

  The concept that actually fits your case is the distinction between **Epistemic** and **Ontic** readings of conditionals.

  Here is the carving:
  *   **The Indicative ("If he didn't...")** is being read **Epistemically**. You are reasoning from your current state of knowledge. You know a crime happened ($C$). You know only two people could do it ($H$ or $B$). Therefore, $\neg H \to B$. This is a logical deduction based on the exclusion of options. It requires no causal story connecting $H$ and $B$; it only requires that they are the only options in your knowledge set.
  *   **The Counterfactual ("If he hadn't...")** is being read **Ontically**. You are asking the listener to imagine a different possible world—one where the husband is innocent—and determine what *would* happen in that world based on the laws of nature, psychology, or circumstance. In that world, for the brother to do it, there must be a *mechanism* (a plan, a motive, a cover-up) that brings it about.

  **Why the others are close but wrong:**
  Your friend mentioned "Irrealis." That is a grammatical mood (like Subjunctive). It is wrong because "Irrealis" is just the vehicle, not the engine. You can have Irrealis morphology without the counterfactual force (as you noted in your future tense example). The *meaning* shift is what matters, not the verb ending. The "Presupposition of Falsity" is a symptom of the Ontic reading, not the cause. The "Connection Requirement" is a constraint on Ontic readings, but not necessarily on Epistemic ones.

  ### 3. One Phenomenon or Several?

  This is the critical philosophical question. You asked if the "hint about the first thing being false" and the "demand for a connection" are the same thing.

  **They are separate phenomena that happen to travel together.**

  1.  **The Falsity Hint (Pragmatic):** This is largely a **Conversational Implicature** (specifically, a presupposition). When you use the subjunctive ("If he *hadn't*"), you signal that you are distancing yourself from the reality of the antecedent. In most contexts, this implies you believe the antecedent is false. However, as your "Even if" example showed, this can be cancelled. It is not part of the strict truth conditions of the sentence; it is a social signal about your beliefs.
  2.  **The Connection Demand (Semantic):** This is a **Truth-Conditional Constraint**. For an ontic counterfactual to be true, there must be a causal or nomic (law-like) link between the antecedent and consequent in the nearest possible world. If there is no story connecting them, the sentence is semantically infelicitous or false. This cannot be cancelled as easily as the falsity hint.

  **Why they travel together:**
  We typically use the Ontic/Counterfactual form only when we are confident enough about the facts to assume the antecedent is false. If we were unsure (Epistemic state), we wouldn't simulate a different world (Ontic state); we would just reason about our current ignorance. Thus, the morphology triggers both the pragmatic hint (I think this is false) and the semantic requirement (tell me how this world works).

  ### 4. Semantics vs. Pragmatics

  To answer your question on whether this is about meaning or usage: **It is both.**

  *   **Semantics (Meaning):** The shift from Epistemic to Ontic modality changes the truth conditions. The indicative is true if the material conditional holds (logical exclusion). The counterfactual is true only if the consequent holds in the nearest possible world where the antecedent is true (causal dependency).
  *   **Pragmatics (Usage):** The hint that the husband *did* do it is pragmatic. It arises because a speaker wouldn't usually simulate a counterfactual world unless they thought the actual world was different.

  ### 5. Analysis of Your Bullet Points

  Here is how the Epistemic/Ontic carving explains your test cases:

  *   **Future Stuff ("If it rains" vs. "If it rained"):**
      *   *Analysis:* Future counterfactuals ("If it rained tomorrow") are not strictly false yet; they are **Remote**. The subjunctive here marks *low probability*, not *falsity*. This proves that the "falsity hint" is not a hard semantic rule but a pragmatic inference based on context. The Ontic connection is still required (weather systems cause match cancellations), which is why both sound fine.
  *   **"Even if" ("Even if he hadn't..."):**
      *   *Analysis:* The operator "Even" is a **Concessive**. It explicitly blocks the presupposition of falsity. It says, "Hold the consequent true *regardless* of the antecedent's truth." This isolates the Connection Requirement (Ontic) from the Falsity Hint (Pragmatic). It proves they are separable.
  *   **Swapping "Would" for "Might":**
      *   *Analysis:* "Would" implies necessity in the nearest possible world (strong Ontic link). "Might" implies possibility (weak Ontic link). By weakening the modal, you weaken the demand for a causal story. If the brother *might* have done it, you don't need a solid plan; you just need opportunity. This lowers the bar for the Connection Requirement.
  *   **Offer-type Sentences ("If you want a beer..."):**
      *   *Analysis:* These are **Biscuit Conditionals**. The "if" clause does not condition the *truth* of the beer's existence, but the *relevance* of stating it. This is purely pragmatic. When you switch to "If you wanted... there'd be one," you shift to an Ontic reading. You are now describing a hypothetical fridge in a hypothetical world. Since the offer relies on the *actual* presence of beer, the Ontic shift destroys the speech act.
  *   **Questions ("If he didn't... who did?"):**
      *   *Analysis:* In questions, presuppositions **project** differently. "If he didn't" asks for the alternative in our current knowledge state (Epistemic). "If he hadn't... who would have?" asks for the agent in the hypothetical world (Ontic). The latter sounds like you are asking about a conspiracy or a backup plan, whereas the former is just asking for the culprit.

  ### 6. The Carving and Boundaries

  You asked for the edges of the concept. Here is the precise definition of the phenomenon you observed. I will coin a term for the specific *constraint* you noticed regarding the "story," as standard literature often lumps this under "Connexivity" which is too vague for your specific intuition.

  **The Term:** **The Ontic Dependency Constraint**

  **Definition:** A semantic constraint on Counterfactual (Subjunctive) Conditionals requiring that the truth of the consequent in the nearest possible world be *dependent* on the antecedent via a causal, explanatory, or nomic link, rather than merely logically compatible.

  **What it IS:**
  *   It is the requirement that there be a "story" or mechanism linking the two halves.
  *   It applies primarily to Ontic/Counterfactual readings.
  *   It renders sentences infelicitous if the link is purely accidental (e.g., "If Caesar had been born in 1900, he would have been a communist" requires a story about Caesar's psychology; "If Caesar had been born in 1900, 2+2 would equal 4" is false/infelicitous because there is no dependency).

  **What it IS NOT:**
  *   It is not the same as the Presupposition of Falsity. (You can have Ontic Dependency without Falsity, e.g., in future remote cases).
  *   It does not apply strictly to Epistemic/Indicative readings. (You can say "If he didn't do it, he's innocent" based purely on logical definition, no causal story needed).

  **Boundary Cases (What counts and what doesn't):**

  1.  **Counts as Ontic Dependency:** "If I had dropped the glass, it would have broken." (Physical law connects dropping to breaking).
  2.  **Fails Ontic Dependency:** "If I had dropped the glass, the moon would be full." (No causal link, even if both are true).
  3.  **Epistemic Exception (Your True Crime Case):** "If he didn't do it, the brother did." (Passes because it relies on logical exclusion, not causal dependency. This is why the indicative works without a story).
  4.  **Counterfactual Failure:** "If he hadn't done it, the brother did." (This sounds wrong to native speakers. You cannot mix the Ontic antecedent "hadn't" with the Epistemic/Logical consequent "did". You must match the modality: "If he hadn't done it, the brother *would have*").

  ### Summary

  Your friend was right that there is a name for the "connection bit" (often discussed under **Connexivity** or **Relevance**), and right that "Irrealis" is the grammatical mood, but wrong to treat them as a single unanalyzed block.

  You have identified the friction between **Epistemic Modality** (reasoning about knowledge, allowing logical disjunction) and **Ontic Modality** (reasoning about worlds, requiring causal dependency). The "flip" you feel is the shift from calculating probabilities based on what you *know* to simulating realities based on how the world *works*. The demand for a story is the **Ontic Dependency Constraint**; the hint of guilt is a **Pragmatic Presupposition of Falsity**. They are distinct, but the grammar of English bundles them together in the past-tense subjunctive.
