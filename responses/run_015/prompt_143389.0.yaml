  First, the second version sounds like you're telling me the husband *did* do it, or at least strongly hinting it, whereas the first one doesn't hint anything about that.

  Second, and this is the bit I keep going round on: the first version doesn't seem to need any story connecting the two halves. It's enough that somebody did it and there were only two candidates, so the thing follows automatically. The second version seems to demand an actual connection — like the brother was covering for him, or the brother had his own reason, or there was some plan where one of them was going to end up doing it. With the first version I can just mean "one of these two, don't ask me which" without implying anything flows from one to the other. My mate went further and said the first one isn't really a conditional at all, it's just a fancy way of saying "either he did it or the brother did", which I half believe, but then I don't get why you can't do the same trick with the "would have" one.

  Here's where I got lost, because I started trying it out on other sentences and the pattern doesn't hold together:

  - Future stuff: "if it rains tomorrow the match is off" and "if it rained tomorrow the match would be off" both sound fine to me and seem to mean basically the same thing, except the second one makes you sound less sure. So the "would" version isn't simply a contrary-to-fact marker.
  - "Even if": "even if he hadn't done it, he'd still have known about it" is fine, and here the "would" version doesn't seem to hint that he did it, and it positively denies the connection instead of requiring one. So the flip partly vanishes, but not in the same way it vanishes in the future cases.
  - Swapping "would" for "might": "if he hadn't done it, his brother might have" — that one seems to lose the hint that he did do it, or at least weaken it a lot, even though everything else about the sentence is the same.
