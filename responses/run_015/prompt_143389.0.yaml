  - Questions: "if he didn't do it, who did?" is fine, "if he hadn't done it, who would have?" sounds like a different question.

  My mate said this is all a known thing and there's a name for it in linguistics, he thought maybe something with "irrealis" in it, or maybe a philosophers' name for the connection bit, but he was drunk and couldn't remember and honestly I'm not sure he knew. So: is there an established concept for the flip I'm describing, or for the two things that change when you switch from the "did" form to the "had done / would have" form?

