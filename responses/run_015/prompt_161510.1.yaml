answer: |-
  **Halvard:** You're asking the Convention to do work it wasn't built for. The Kelthi memos say "dispersion" and "integration." They do not say "destroy." If you ignore that specific intent, you collapse genocide into ordinary, albeit coercive, nation-building.

  **Neve:** Because no bureaucrat ever writes "destroy" in a memo anymore. They know the law. They've learned to press the buttons that don't trigger the alarm. If the outcome is the dissolution of the group within a generation, the semantic distinction is a loophole, not an analysis.

  **Halvard:** It's a firewall. Without it, your definition criminalizes half of nineteenth-century Europe. Compulsory schooling in a national language? Mandatory census categories? On your reading, any state pressure toward assimilation becomes genocidal. You lose the ability to distinguish between a group being pressured to change and a group being targeted to cease existing *as such*.

  **Neve:** There is a difference between forcing someone to join a club and burning the clubhouse down while they're inside. The Kelthi aren't being asked to become Marvene; they're being unmade. The language is dropped from courts and schools not to integrate them, but to make their collective transmission impossible. That isn't nation-building; it's erasure.

  **Halvard:** But erasure isn't destruction if the people survive. The Convention requires intent to destroy the group physically or biologically. Preventing births, killing members. Here, nine hundred dead in counterinsurgency. Tragically unjust, but not a campaign of physical destruction.

  **Neve:** And there's the denominator mess. If "in part" means the Kelthi within Maraven, the state destroys them completely and walks free because the global group survives across the border. But if "in part" means the global group, then "part" is trivially satisfied by any local atrocity, and intent has to do all the work alone. You've created a system where a state can safely annihilate a minority within its borders provided enough co-ethnics live next door.

  **Halvard:** I'll take that cost. Better a state escapes a label than the label loses all discriminatory power. Look, I'll offer you a deal. Keep the legal category narrow. Call this crimes against humanity, persecution, ethnic cleansing. Attach the same moral condemnation, the same sanctions. You get the punishment without diluting the specific wrong of genocide.

  **Neve:** You lose the recognition of the specific harm. Crimes against humanity are aggregates of individual rights violations. Genocide acknowledges that a group can be a victim *as a group*. If we call this only persecution, we say the loss is merely the sum of individual displacements. We miss the fact that something collective is dying that cannot be reduced to individual suffering. The rhetoric isn't just noise; it's the only language we have for collective death.

  **Halvard:** But if the law can't pinpoint the moment of death, how do we judge? We need a threshold.

  **Neve:** Exactly. Which is why the binary is blinding us. I had a student last year propose stopping the treat-it-as-binary approach. Instead, score cases on a profile: physical survival, biological continuity, cultural transmission, political standing. Each on its own scale. You separate the diagnosis from the threshold for treatment.

  **Halvard:** Legally, that's unworkable. Courts need binaries to convict. You can't sentence someone to life imprisonment based on a graded score of cultural attenuation. Where do you draw the line for criminal liability? If cultural transmission is at forty percent, is that a crime? At twenty? The law needs a trigger, not a dashboard.

  **Neve:** And the binary creates blind spots. Because we wait for the trigger—the mass killing, the explicit order—we ignore the slow burns. We wait for the group to be physically dead before we admit it's being killed. A profile forces us to see the degradation happening in real-time, even if the legal trigger hasn't been pulled yet. It shifts attention from the body count to the viability of the group.

  **Halvard:** I concede the binary blinds us to the slow burns. It allows states to game the timeline. But without a bright line, you risk politicizing the court. If every assimilation policy is up for scoring, every state is a defendant.

  **Neve:** And without the score, every state knows exactly how far they can go before the alarm rings. They know they can dissolve a culture without shooting anyone. We protect the precision of the law at the cost of the reality it was meant to name.

  **Halvard:** So we're stuck. You want a concept broad enough to catch the Kelthi, but narrow enough not to catch every public school system. I want a standard clear enough to convict, but not so rigid it invites loopholes.

  **Neve:** Perhaps the cost is admitting the law is always playing catch-up. The Kelthi are disappearing. Whether we call it genocide or crimes against humanity, the group ceases to exist.

  **Halvard:** But if we call it genocide loosely, the word stops commanding attention when the bullets start flying. If everything is genocide, nothing is.

  **Neve:** And if we call it something else, we pretend the group's death is just a lot of individual injuries. We lose the vocabulary for the crime against the future.

  **Halvard:** Then we agree on the loss. We disagree on whether expanding the label fixes it, or just breaks the tool.

  **Neve:** Or whether the tool was never meant for this kind of repair.
