answer: |-
  Here is the ranking based on expected success rate for a symbolic solver tackling standard Bongard problems, scored out of 100.

  1.  **Relations only (85/100)** — This vocabulary prioritizes topological invariance over metric precision, allowing the solver to ignore noise while capturing the logical structure that usually defines the rule.
  2.  **Generator-first (75/100)** — This approach favors conceptual compression by modeling how shapes are made, though it risks failure if the true generative process lies outside your predefined parameter space.
  3.  **Shape nouns (60/100)** — This offers strong semantic clarity for standard geometry but suffers from vocabulary completeness issues when faced with irregular or composite forms.
  4.  **Metric and proportion (50/100)** — This provides quantitative precision for size and angle rules but introduces high threshold sensitivity that leads to overfitting on small sample sizes.
  5.  **Negative space (30/100)** — This grants access to figure-ground cues that humans spot easily, yet it remains mostly redundant because background structure is usually implied by the foreground ink.
  6.  **Near-miss / defect (25/100)** — This heightens sensitivity to subtle violations of regularity but complicates the search space by requiring a robust definition of "distance from perfection."
  7.  **Cross-figure deltas (20/100)** — This captures set coherence effectively but fails as a description language because it cannot classify a standalone test instance without its reference group.
  8.  **Raw bitmap (10/100)** — This maximizes data fidelity by keeping every pixel, but it creates an abstraction poverty that makes finding high-level rules computationally intractable without deep learning.

  **Secretly the same:**
  **Metrics (4) and Near-miss (7)** are effectively the same thing wearing different hats because you cannot define a "near-miss" or a "defect" without first having a metric vocabulary to measure the distance from a canonical ideal.

  **The ninth vocabulary:**
  I would add **Semantic/Symbolic recognition** (identifying letters, digits, or familiar real-world objects like faces or hands), because some Bongard problems rely on external cultural knowledge rather than pure geometry or topology.

  **Where the ranking flips:**
  If the problems were mostly about **weird one-off shapes** (organic, noisy, non-geometric) instead of clean families, **Raw bitmap (1)** and **Metric (4)** would rise significantly while **Shape nouns (2)** and **Generator-first (5)** would crash, because predefined geometric templates cannot match irregular forms whereas raw density and texture metrics still apply.
