answer: |-
  ### Preliminary Notes & Brainstorming

  Before committing to the translation, I need to test the load-bearing capacity of your vocabulary. Your framework is distinctly *narratological*; it cares about what is shown, what is told, and how much choice the character retains against the machinery of the plot. Philosophy of labour is *ontological*; it cares about what human beings are and how they exist in relation to material reality.

  The friction point is immediate: Philosophy asks, 'What does this work do to the soul?' Your framework asks, 'What does this work do to the story?'

  To translate without smuggling, I must treat your terms as absolute containers. I cannot assume *diegetic labour* equals 'good work'. I cannot assume *agency debt* is always 'bad', only that it represents a transfer of choice from character to plot mechanics.

  Here is the initial mapping I am testing:
  *   **Marx's Alienation:** This feels like a maximisation of *agency debt* combined with a removal of *narrative surplus value*. If the character doesn't own the outcome, the plot owns it.
  *   **Arendt's Labour/Work/Action:** *Diegetic labour* covers 'Work' well. 'Labour' (biological maintenance) is usually elided in fiction unless it's survival genre. 'Action' is the tricky one—it might not fit 'labour' at all.
  *   **Automation of Judgement:** This is pure *agency debt*. If the algorithm decides, the character cannot choose.
  *   **Plot-level Deskilling:** This sounds like the erosion of *diegetic labour* until only *expository labour* remains, collapsing the *fabula* (the causal chain of events) because the tension required to bridge cause and effect has been automated away.

  I will proceed with the restatement and residue report based on these tensions.

  ***

  ### Philosophical Positions Restated in Narrative Terms

  Here are the three philosophical positions translated strictly into your vocabulary of diegetic labour, expository labour, agency debt, and narrative surplus value.

  **1. Marx on Alienation**
  In this framework, alienation is not an emotion; it is a structural imbalance in the distribution of labour and agency. It occurs when a character performs *diegetic labour* but is severed from the consequences of that labour. The character expends effort, yet the plot mechanics (the 'capital') retain the *agency debt*. The character becomes a conduit for plot mechanics rather than a source of causality. Furthermore, alienation manifests when *narrative surplus value* is systematically extracted from the character and assigned to the system. When a character digs a ditch, and the story treats the ditch as merely a plot obstacle rather than a testament to the character's exertion, the character is alienated. They are performing the work, but the narrative ownership belongs to the mechanism.

  **2. Arendt on Labour, Work, and Action**
  *   **Labour:** In your terms, this is *expository labour* that threatens to become *diegetic*. It is the repetitive maintenance required to keep the character alive (eating, sleeping, healing) which usually remains off-screen. If a narrative forces this on-screen without generating *narrative surplus value*, it becomes tedious repetition.
  *   **Work:** This maps cleanly to *diegetic labour*. It is the fabrication of durable objects or outcomes that advance the *fabula*. It has a clear beginning and end.
  *   **Action:** This is the outlier. It is the moment where a character incurs *agency debt* voluntarily to reveal their uniqueness to other characters. It is not labour; it is speech and deed. In your framework, this is the only time *agency debt* is not a deficit but an investment. However, automation threatens this by converting *Action* into calculated *Work*. If a machine predicts the outcome of a speech act, it is no longer *Action*; it is merely *diegetic labour* with high efficiency.

  **3. Modern Automation (The Loss of Judgement)**
  This position argues that automation does not just replace muscle; it replaces the need for choice. In your vocabulary, this is the conversion of *diegetic labour* into *expository labour* via the accumulation of *agency debt*. When a system makes the judgement call, the character is no longer required to perform the cognitive labour on-screen. The plot mechanics override the character's choice to ensure efficiency. Consequently, *narrative surplus value* plummets. If a machine solves the mystery, the human detective's involvement generates no thematic weight. The story retains the *fabula* (the solution exists) but loses the human cost required to reach it.

  ***

  ### The Residue Report

  Here is an honest audit of what fits, what breaks, and what is left over when we pour these philosophical concepts into your narrative containers.

  **1. Clean Mappings**
  *   **Alienation and Agency Debt:** This is the strongest fit. Marx's idea that the worker does not own the product translates perfectly to a character who does not own their choices. When plot mechanics force a character to act against their desire to serve the ending, that is *agency debt*. It captures the structural coercion of alienation without needing to discuss economics.
  *   **Automation of Judgement and Narrative Surplus Value:** The modern worry that automation eats judgement maps precisely to the loss of *narrative surplus value*. If a task requires no human judgement, performing it manually adds no thematic weight. The equation holds: Human Judgement = Surplus Value. Machine Judgement = Zero Surplus.

  **2. Distorted Mappings**
  *   **Arendt's 'Labour' vs. Expository Labour:** Arendt defines 'Labour' as biological necessity (the cycle of life and decay). In fiction, this is often boring. You classify this as *expository labour* (mentioned but not shown). However, Arendt argues this is the fundamental human condition. By relegating it to 'expository', your framework implicitly agrees with the capitalist view that this work is worthless unless it moves the plot. To fit Arendt, you would have to distort your definition to allow *diegetic labour* to include mundane survival tasks that *don't* move the plot, which contradicts your definition of 'moving the plot'.
  *   **Social Alienation:** Marx speaks of alienation from other workers. Your framework is primarily individualistic (character vs. plot). To map this, you would have to treat the 'ensemble cast' as a single worker. If Character A's *diegetic labour* undermines Character B's *agency*, that is social alienation. But your terms don't easily track labour relations between characters, only between character and plot.

  **3. The Missing Counterparts (The Gaps)**
  *   **Arendt's 'Action':** There is no true counterpart for 'Action' in your labour vocabulary. 'Action' is about beginning something new and unpredictable among peers. *Diegetic labour* is about completing a task. *Agency debt* is about losing choice. 'Action' is about *exercising* choice in a political space.
      *   *Implication:* This suggests your framework is excellent for analysing *tasks* but potentially blind to *politics*. If your novel is about workers striking, your terms explain the work, but not the solidarity. You might be missing a term for 'collective agency' or 'dialogic revelation'.
  *   **Marx's 'Species-Being':** This is the human potential to create freely. In your terms, this would be a state of zero *agency debt* and maximum *narrative surplus value*. But your framework treats *agency debt* as a necessary evil of plotting (stories need structure). Philosophy sees 'species-being' as a goal; your framework sees 'agency debt' as a tool. This isn't a failure of translation, but a conflict of purpose. Philosophy wants to liberate the worker; narrative craft wants to constrain the character to make a story.

  **4. Is the Framework Missing Something?**
  Not necessarily missing, but specialised. Your framework assumes the purpose of the character is to serve the *fabula*. Philosophy often assumes the purpose of work is to serve the *human*. The gap isn't vagueness in the philosophy; it's the difference between *teleology* (purpose of life) and *plot* (purpose of story). When Arendt's 'Action' doesn't fit, it's because 'Action' often resists being plotted. It is messy. If you force 'Action' into *diegetic labour*, you kill the very thing Arendt valued.

  ***

  ### Evaluation: Plot-Level Deskilling

  Your concept of **'plot-level deskilling'** is robust and actually clarifies the philosophical claims rather than muddying them.

  **The Mechanism**
  You define this as automation taking over a character's craft, causing the *fabula* (the causal chain of events) to collapse into pure *syuzhet* (the presentation of events). In your labour terms, this is the total conversion of *diegetic labour* into *expository labour*.

  **Why it Works Philosophically**
  1.  **It Validates the Loss of Judgement:** If the *fabula* collapses, it means the causal link between *character choice* and *outcome* is severed. The machine provides the outcome; the *syuzhet* merely shows us the result. This is the narrative equivalent of the philosophical worry that automation removes judgement. The character is no longer the cause; they are the witness.
  2.  **It Explains the Loss of Tension:** Tension relies on *agency debt*—the worry that the character might choose wrong. If the system is automated, the choice is removed. If there is no choice, there is no *agency debt*. If there is no *agency debt*, there is no risk. If there is no risk, *narrative surplus value* cannot be generated.
  3.  **It Highlights the Residue:** When *plot-level deskilling* occurs, the writer often tries to compensate by adding emotional drama around the edges. In your terms, this is an attempt to manufacture *narrative surplus value* artificially because the *diegetic labour* no longer supports it.

  **The Verdict**
  Keep the term. It bridges the gap between the mechanical structure of the story (*fabula/syuzhet*) and the thematic value of the work (*narrative surplus value*). It accurately describes the moment when *agency debt* becomes so high that the character is no longer the protagonist of their own labour, but merely the operator of a machine that writes the plot for them.

  However, be wary of one distortion: Sometimes a collapsed *fabula* is desirable (e.g., in absurdist fiction where lack of agency is the point). In those cases, 'deskilling' is not a loss of tension, but the generation of a different kind of *narrative surplus value*—one based on frustration rather than triumph. Your framework can handle this, provided you recognise that *agency debt* can be thematic fuel, not just a structural weakness.
