answer: |-
  This is a sophisticated problem that cuts to the heart of the debate between Entity Realism and Structural Realism. Your hesitation regarding the **Newton-to-GR** vs. **Caloric-to-Kinetic** contrast is well-founded; it is the exact fault line where John Worrall's *Structural Realism* and Stathis Psillos's *Entity Realism* diverge.

  To capture your verdicts, we cannot rely on mathematical limiting relations alone (since both Newton and Caloric have them), nor on vague "similarity" (which lets Miasma slip through). We need a principle that distinguishes between the *mathematical formalism*, the *ontological category*, and the *causal mechanism*.

  Here is a proposed principle, followed by its application and limitations.

  ### The Principle of Categorical-Structural Retention (PCSR)

  A posit $P$ from theory $T_1$ survives in successor theory $T_2$ if and only if:

  1.  **Structural Continuity:** The mathematical representation of $P$ in $T_1$ is recoverable as a limiting case or structural sub-component of the mathematics of $T_2$.
  2.  **Categorical Stability:** The ontological category assigned to $P$ in $T_1$ (e.g., *substance*, *field*, *geometry*, *process*) is preserved in $T_2$, even if the specific properties are modified.
  3.  **Causal Role Preservation:** The causal/explanatory role played by $P$ in $T_1$ is subsumed by the successor posit in $T_2$ without invoking a fundamentally distinct mechanism (e.g., contact action vs. action at a distance).

  **Verdict Scale:**
  *   **Full Survival:** Satisfies 1, 2, and 3.
  *   **Structural Survival (Partial):** Satisfies 1, but fails 2 (Category shift).
  *   **No Survival:** Fails 1 (and usually 2 and 3).

  ---

  ### Application to Your Cases

  **1. Newtonian Gravitation $\to$ General Relativity**
  *   **Verdict:** Full Survival.
  *   **Clause Application:**
      *   *Structure:* Newtonian potential $\Phi$ recovers as the weak-field, low-speed limit of the metric tensor $g_{\mu\nu}$.
      *   *Category:* Both posit a **Field/Geometry** mediating interaction. (Newton: Field on background; GR: Curved Geometry). While distinct, both fall under the category of "spatiotemporal structure determining motion," not "material substance."
      *   *Causal Role:* Both explain attraction via the state of space/field, not via contact push.
  *   **Motivation:** This validates your intuition. The *kind* of thing (geometry/field) remains, even if the curvature changes.

  **2. Caloric Theory $\to$ Kinetic Theory**
  *   **Verdict:** Structural Survival (Partial).
  *   **Clause Application:**
      *   *Structure:* The heat equations (Fourier) are recoverable as statistical averages of particle motion.
      *   *Category:* **Failure.** Caloric is a *Material Substance* (fluid); Kinetic heat is *Energy/Motion* (process). Substance $\neq$ Process.
      *   *Causal Role:* Caloric flows due to pressure differences; Heat flows due to statistical probability gradients.
  *   **Motivation:** This resolves your tension with Newton. Unlike Newton/GR, Caloric/Kinetic involves an ontological category error (Stuff vs. Motion). The equations survive, the ontology does not.

  **3. Phlogiston $\to$ Oxygen**
  *   **Verdict:** No Survival.
  *   **Clause Application:**
      *   *Structure:* No mathematical embedding.
      *   *Category:* Phlogiston is a *negative principle* (absence of fire capacity); Oxygen is a *positive element*.
      *   *Causal Role:* Phlogiston exits during combustion; Oxygen enters. The direction of flow is inverted.
  *   **Motivation:** Clear cut. No structure, inverted role.

  **4. Luminiferous Aether $\to$ Special Relativity**
  *   **Verdict:** Split (Field Survives, Medium Does Not).
  *   **Clause Application:**
      *   *Structure:* Maxwell's equations survive.
      *   *Category:* The **Electromagnetic Field** (Category: Field) survives. The **Aether** (Category: Material Medium/Substance) fails Categorical Stability.
      *   *Causal Role:* The field carries energy; the medium was posited only to support the field.
  *   **Motivation:** Distinguishes the mathematical object (EM field) from the ontological baggage (Aether wind/medium).

  **5. Miasma $\to$ Germ Theory**
  *   **Verdict:** No Survival (despite weak intuition).
  *   **Clause Application:**
      *   *Structure:* **Failure.** There is no limiting mathematical relation between "bad air density" and "bacterial load."
      *   *Category:* Weak match (Invisible Agent), but Miasma is environmental/chemical; Germs are biological/replicating.
      *   *Causal Role:* Miasma acts via toxicity; Germs act via infection/replication.
  *   **Motivation:** Your uncertainty is correct. This is an analogical similarity, not a theoretical derivation. PCSR forces a "No" here, which is philosophically safer for realism.

  ---

  ### Application to the New Case: The Electron
  **Case:** Classical Electrodynamics (CED) $\to$ Quantum Field Theory (QFT).

  *   **Analysis:**
      *   **Structure:** The classical trajectory emerges via the Ehrenfest theorem or path integral stationary phase approximation, but only statistically. The Dirac field equations do not strictly limit to point-particle mechanics in all regimes (e.g., pair production).
      *   **Category:** In CED, the electron is a **Point Particle** (corpuscle). In QFT, the electron is an **Excitation of a Field**.
      *   **Causal Role:** In CED, it has a definite position and momentum. In QFT, position is an operator, and particle number is not conserved.
  *   **PCSR Verdict:** **Structural Survival (Partial).**
  *   **Reasoning:** Like Caloric, there is a category shift. The "little billiard ball" (Particle) does not survive. The "Electron Field" survives. If you define "Electron" as the field, it survives. If you define it as the localized entity, it does not.
  *   **Honest Assessment:** This verdict will trouble a standard Entity Realist who wants to say "Electrons exist." PCSR forces you to say "The Electron Field exists, and classical electrons are useful fictions."

  ---

  ### Limitations: Which Verdicts Cannot Be Accommodated?

  The PCSR is rigorous, but it cannot accommodate your verdicts without extra machinery in two specific areas:

  1.  **The Miasma Case:**
      *   *Problem:* You were unsure if Miasma counts as survival. PCSR says **No**.
      *   *Why:* If you *want* to count Miasma as a "roughly true" intuition about invisible agents, PCSR is too strict. It requires mathematical derivation.
      *   *Extra Machinery Needed:* You would need a **Functionalist Clause** allowing survival if the *macroscopic effect* (disease spread) is predicted correctly, even without structural continuity. But adding this weakens the defense against PMI significantly.

  2.  **The Electron Case (Entity Realism):**
      *   *Problem:* Most realists want to say the electron survives from CED to QFT. PCSR says the *particle* posit is discarded.
      *   *Why:* QFT fundamentally undermines the "particle" ontology (Reeh-Schlieder theorem, vacuum fluctuations).
      *   *Extra Machinery Needed:* You need a **Pragmatic Clause** stating that if the posit remains indispensable for experimental intervention (e.g., "spraying electrons"), it survives regardless of ontological category shift.

  ### Impact on the No-Miracles Defense

  Does this principle make the No-Miracles Argument (NMA) defensible, or does it show "roughly true" is ineliminably vague?

  **It makes the NMA defensible, but at a cost.**

  1.  **Defensible:** By shifting the focus from "The theory is true" to "The structural-categorical core is retained," you immunize realism against the PMI. The PMI relies on showing that *specific ontological claims* (like "Caloric is a fluid") are false. PCSR concedes this but argues the *structure* (Conservation of Energy/Heat Flow) and the *higher-order category* (Physical Magnitude) were true.
  2.  **The Cost (Vagueness):** The phrase "roughly true" is not eliminated; it is relocated. It now attaches to **"Categorical Stability."**
      *   Is a Field the same category as a Curved Geometry? (Newton/GR). PCSR says Yes.
      *   Is a Particle the same category as a Field Excitation? (Electron). PCSR says No.
      *   *The Vagueness:* The boundary between "modification of a category" and "change of category" is not mathematically precise. It relies on metaphysical judgment.

  **Conclusion:**
  The **Principle of Categorical-Structural Retention** captures your Newton/Caloric distinction successfully by prioritizing ontological category over mere mathematical limiting. It forces you to accept that **electrons (as particles) do not survive** into QFT, only the field does. It saves the No-Miracles argument from the PMI, but only by retreating to a form of **Structural Realism** where "truth" is about the preservation of mathematical relations and broad ontological kinds, not the specific nature of unobservable entities. "Roughly true" becomes "Structurally isomorphic and Categorically stable," which is precise enough for physics, but remains metaphysically contestable.
