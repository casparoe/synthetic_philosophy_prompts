      *   *The Pivot:* Focus on Step (4). Why doesn't it scale?
      *   *Argument 1: The Nature of the Task.* Libet's task is designed to *remove* reasons. "Move whenever." Moral actions are *full* of reasons. If I apologize, I weigh consequences. The RP doesn't capture the deliberation phase, only the execution phase.
      *   *Argument 2: Distal vs. Proximal.* I decide to write an essay (conscious). The neural prep for typing the word "the" happens unconsciously. But the *essay* was caused by the conscious decision to start it.
      *   *Argument 3: The Veto.* Libet found we can abort the action after the RP starts. This is a form of control.
      *   *Reframing Responsibility:* We don't need to be "prime movers" outside physics. We need to be systems that respond to reasons. If my brain processes "stealing is wrong" and stops me, that's still *me*.
      *   *Conclusion:* You can keep ethics. You just need a naturalistic view of agency.

  6.  **Refining for the Audience (High School Student):**
