answer: |-
  Based on the pattern of verdicts your friend has provided, she is operating within a **Kantian Indirect Duty framework**, but she is refining it with a strong emphasis on **moral psychology** (how actions shape the agent's character) and a specific **rationality threshold** for direct duties.

  Here is the prediction of her verdicts, the underlying rules, and the test case to distinguish them.

  ### 1. Predicted Verdicts

  **Case A: The Nociceptor-Null Pigs (Pain-free slaughter)**
  *   **Verdict:** **Wrong (or morally impermissible).**
  *   **Reasoning:** Even though the pigs feel no pain, your friend will likely argue that the *act* of slaughtering a creature that behaves and appears like a sentient being cultivates a disposition of **dominion and disregard for life**. It falls under her "character corruption" logic: treating a living analogue of a sentient being as a mere tool damages the moral agent's humanity, regardless of the victim's internal state. The *appearance* of cruelty is enough to degrade the character.

  **Case B: The Starving Wolf Pack (Hiker risks life)**
  *   **Verdict:** **No indirect duty to help (and forbidden to risk life).**
  *   **Reasoning:** Her deer verdict established that animals are not ends-in-themselves (no direct duty). Her parrot verdict established that rationality is the switch for direct duties. Since the wolves are not rational, the hiker owes them nothing comparable to a human. Furthermore, in Kantian ethics, the **Duty of Self-Preservation** (a perfect duty to oneself) always trumps the **Duty of Beneficence** (an imperfect duty). Sacrificing a rational human life for non-rational animals would be a category error and a violation of duty to self.

  ---

  ### 2. The Competing Rules

  Based on her history, three distinct principles are driving her judgments. Two of them are in tension in the Pig case.

  1.  **The Empathy-Hardening Rule (Suffering-Based):**
      *   *Logic:* We avoid cruelty to animals because witnessing or causing *pain* desensitizes us to suffering, which makes us more likely to harm humans.
      *   *Source:* Her verdicts on the tortured dog and the lab rats.
  2.  **The Symbolic-Degradation Rule (Act-Based):**
      *   *Logic:* We avoid certain acts toward animals because the *nature of the act itself* (e.g., slaughter, domination) cultivates a vice (arrogance, disregard for life) that corrupts our character, even if no pain is felt.
      *   *Source:* Her verdict on the sick horse (okay if not for convenience) implies the *motive* and the *act* matter, not just the outcome.
  3.  **The Rationality Threshold (Status-Based):**
      *   *Logic:* Direct duties are only owed to beings with autonomy/reason. Below this threshold, animal welfare is secondary to human self-preservation.
      *   *Source:* Her sci-fi parrot and deer verdicts.

  ---

  ### 3. Where the Rules Split

  **The Pig Case Split:**
  *   **The Empathy-Hardening Rule** says the slaughter is **Okay**. If the pigs literally cannot feel pain, there is no suffering to witness, and thus no desensitization to pain occurs.
  *   **The Symbolic-Degradation Rule** says the slaughter is **Wrong**. The act of killing a living being that *looks* like a person/sentient creature treats life as disposable, which corrupts the agent's disposition regardless of pain.
  *   *Prediction:* Your friend will side with **Symbolic-Degradation**, ruling it wrong.

  **The Wolf Case Split:**
  *   **The Beneficence-Cultivation Principle** (a subset of Indirect Duty) suggests we *should* help animals to practice kindness.
  *   **The Rationality Threshold / Self-Preservation Rule** says human life is lexically superior.
  *   *Prediction:* Your friend will side with **Self-Preservation**, ruling there is no duty to risk life.

  ---

  ### 4. The Decisive Test Case

  To tell apart the **Empathy-Hardening Rule** from the **Symbolic-Degradation Rule** (the tension in the Pig case), your friend needs to consider a case where **Symbolism is high, but Reality is null.**

  **The Case:** **The Realistic Robot Dog**
  *   **Scenario:** A scientist has built a robot dog that looks, moves, and screams exactly like a real dog when kicked. However, the agent *knows for a fact* it is a machine and feels absolutely nothing. The agent kicks it in frustration.
  *   **Why this distinguishes the rules:**
      *   If she says **Wrong:** She is committed to the **Symbolic-Degradation Rule**. The act itself corrupts the character because it mimics cruelty, regardless of whether any suffering actually exists. (This confirms her Pig verdict is about *symbolism*, not pain).
      *   If she says **Okay:** She is committed to the **Empathy-Hardening Rule**. Since there is no actual suffering to be desensitized to (the agent knows it's fake), the character is not harmed. (This would imply her Pig verdict should actually have been "Okay," revealing an inconsistency).

  **Recommendation:** Ask her about the **Robot Dog**. It is the cleanest wedge to determine if her Kantianism is grounded in the *consequences for moral psychology* (pain/suffering) or the *intrinsic quality of the action* (symbolic disrespect).
