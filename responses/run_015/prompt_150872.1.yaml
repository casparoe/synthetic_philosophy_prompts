answer: |-
  ### Confidence and Status of the Term

  I am **highly confident (90%+)** that there is no single, universally standardized noun phrase (like "Gresham's Law" or "The Peter Principle") that exclusively names this specific historiographical distortion across the fields of history, archival science, and colonial studies.

  The *concept* is widely recognized and debated, but it is currently described using a cluster of overlapping terms rather than one precise label. You will find it discussed under:
  *   **"Archival Silence"** (Michel-Rolph Trouillot): Though this focuses on absence, Trouillot explicitly argues silence is produced by the *presence* of other narratives.
  *   **"Legibility"** (James C. Scott): This explains the *state's motive* for creating the records, but less often the *historian's resulting distortion*.
  *   **"The Grain of the Archive"** (Ann Stoler): This refers to the methodological approach (reading along vs. against) rather than the structural bias itself.
  *   **"Selection Bias"** or **"Survivorship Bias"**: These are used in quantitative history but are too generic; they imply random loss or researcher choice, not the structural link between power and documentation.

  Because no single term captures the *mechanism* (institutional entanglement), the *outcome* (density skew), and the *consequence* (conflating control with substance) in one package, I will propose a functional definition below.

  ### Proposed Name and Definition

  **Name:** **Administrative Visibility Bias** (sometimes **Institutional Legibility Distortion**)

  **Definition:**
  > A structural distortion in the historical record where the density of documentation correlates with the intensity of a group's institutional entanglement (whether through subjugation or recognized standing), rather than with their demographic size, social significance, or autonomy. This bias causes histories derived primarily from institutional archives to systematically over-represent populations subject to high-frequency administrative friction (the controlled and the elite) and under-represent populations operating outside institutional transaction (the autonomous), thereby converting administrative burden into historical substance.

  ### Why This Definition is Better Than Alternatives

  1.  **Vs. "Archival Silence":** "Silence" describes the *absence* of data (the commoners on the common). Your observation is about the *presence* of data (the workhouse inmates). "Administrative Visibility" captures the active production of noise that drowns out the signal. It explains why the workhouse looks like the "centre of local life"—it is not just that the commoners are silent, but that the inmates are *loud*.
  2.  **Vs. "Selection Bias":** Selection bias implies a random or methodological filtering process. Your pattern is *generative*. The records were not selected from a larger pool; they were created *because* of the power dynamic. "Administrative Visibility" locates the bias in the *creation* of the source (Trouillot's "Moment 1"), not just its survival or selection.
  3.  **Vs. "Legibility" (Scott):** Scott's "legibility" describes the state's intent to simplify for control. It does not explicitly name the *historiographical consequence* for the later researcher. "Administrative Visibility Bias" bridges the gap between the state's intent (then) and the historian's distortion (now).

  ### The Mechanism and Conditions

  For this bias to operate, three conditions must be true:

  1.  **Friction-Generated Documentation:** Records are not created to describe reality neutrally, but to manage a transaction (tax, trial, relief, deed). No transaction = no record.
  2.  **Asymmetric Friction:** The cost of avoiding transaction is higher for the subordinated (who are forced into it) and the elite (who need it to protect standing) than for the autonomous.
  3.  **Archival Aggregation:** The archive preserves the *institution's* memory, not the *community's*. It aggregates the friction points, making the "point of contact" look like the "object itself."

  **What it is NOT:**
  *   It is not merely that records are lost (random decay).
  *   It is not merely that the victors write history (ideological slant).
  *   It is not merely that historians choose easy sources (methodological laziness).
  *   It is a structural feature of how bureaucracies produce truth.

  ### Handling Your Edge Cases

  Here is how **Administrative Visibility Bias** holds up against the complications you raised:

  **1. A population intensely administered but whose papers were destroyed.**
  *   *Verdict:* The bias operated at the **creation** stage, but the **survival** stage intervened.
  *   *Nuance:* If the records were destroyed, the bias manifests now as *Silence* (Trouillot) rather than *Visibility*. However, if the *fact* of their administration is known (e.g., we know a workhouse existed, but the logs are gone), the bias remains in the *narrative structure*—we still know them primarily as "administered people" rather than "neighbors." The definition holds, but the *effect* shifts from distortion of density to distortion of category.

  **2. A community richly documented because it recorded itself (guilds, congregations).**
  *   *Verdict:* This is **Endogenous Documentation**, which breaks the bias.
  *   *Nuance:* This is the critical counter-example. Here, density correlates with *internal cohesion*, not external control. A definition of Administrative Visibility Bias must explicitly exclude endogenous records. If a group generates its own archive, it escapes the "entanglement" clause of the definition. This is why Quaker records or Guild rolls are methodologically distinct from Poor Law files.

  **3. Present-day administrative and platform data.**
  *   *Verdict:* The bias intensifies into **Algorithmic Visibility**.
  *   *Nuance:* In modern data, "friction" is passive (clicks, location pings). The mechanism is identical: visibility tracks interaction with the platform/state. The "autonomous" today are those who are "off-grid." The definition holds perfectly, though the "institution" expands to include private corporations (platforms) that function quasi-bureaucratically.

  **4. The Elite Case (Gentry/Landowners).**
  *   *Verdict:* This confirms the mechanism is **Institutional Transaction**, not just **Subjugation**.
  *   *Nuance:* The definition accounts for this via the phrase "entanglement (whether through subjugation or recognized standing)." Elites generate paper to secure property, lineage, and law. They are "visible" because they are deeply embedded in the institutional framework, just like the workhouse inmates. The bias does not distinguish between the *type* of power, only the *volume of transaction*. This is why the archive makes both the Magistrate and the Vagrant look more "real" than the Smallholder.

  ### Where the Definition Might Fail

  1.  **Conflation with "Source Bias":** In some quantitative fields, this will simply be called "Source Bias." If you use "Administrative Visibility Bias" with an economist, they may hear "Selection Bias." You must clarify that the bias is *constitutive* (created by the power dynamic), not *accidental*.
  2.  **The "Accidental Archive":** Sometimes institutions preserve things they didn't intend to (e.g., a marginal note in a ledger). Administrative Visibility Bias assumes the record was created for administration. It struggles to account for accidental survivals that reveal autonomy (e.g., a smuggled letter found in a court file).
  3.  **Oral Histories:** The definition applies to *written* institutional archives. It does not apply to oral tradition, which operates on a different visibility economy (prestige/memory vs. paperwork).

  ### Summary Recommendation

  You are describing a recognized structural problem that lacks a unified label.
  *   **If you need to cite existing theory:** Anchor your argument in **Michel-Rolph Trouillot's *Silencing the Past*** (specifically the "Moment of Fact Creation") and **James C. Scott's *Seeing Like a State*** (Legibility). State that you are applying these concepts to the *historiographical outcome* rather than the *political intent*.
  *   **If you need a label for your own work:** Use **"Administrative Visibility Bias."** It is precise, self-explanatory, and distinguishes the phenomenon from generic "silence" or "loss."
  *   **The cleanest statement of the mechanism:** "Archival density is a measure of institutional friction, not historical significance."

  This formulation allows you to acknowledge the elite case (they have high friction/standing) and the workhouse case (they have high friction/control) while excluding the commoners (low friction) without implying the commoners were "unimportant," only "unentangled."
