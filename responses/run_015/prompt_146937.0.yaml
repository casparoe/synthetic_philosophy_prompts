answer: |-
  Thanks for sending this over, because you have put your finger on exactly the kind of friction that shows up when you try to overlay biological signalling models onto thick social norms. I spend a lot of time worrying about whether we are smuggling too much biology into sociology, and the engagement ring is a perfect test case. Let me walk through how I am parsing the space of options before I tell you where I actually land, because the temptation is to just say it is a handicap signal and stop there, but as you noted, the private price and the heirloom exception break the cleanest version of that model.

  If we start with the biological handbook, the handicap principle requires that the signal be costly to produce and that the cost be correlated with the quality being signaled, usually to prevent low-quality agents from faking it. In the ring case, the quality is commitment or resource availability. The problem you raised about privacy is immediate and severe. If the audience cannot verify the cost, the signal cannot function as an honest index of wealth unless there is a reliable proxy, like carat size or brand recognition, that correlates with price. But even then, the heirloom problem is a bigger theoretical wrench. In strict costly signalling theory, the cost must be borne by the signaller at the time of signalling to prove current capacity or intent. Passing on a grandmother's ring transfers an asset without depleting the signaller's current resources, which should theoretically make it a cheap signal open to faking by anyone with a rich grandmother, yet it is often viewed as more romantic, not less. This suggests the value is not in the burning of resources by the giver but in the history of the object itself. That pushes us away from pure signalling and toward what anthropologists call a relic theory or what social ontologists might call a causal-historical account of value, where the object carries a trajectory that matters more than its current market price.

  Then you have the lab-grown diamond puzzle, which is the most interesting bit for me. If this were purely about burning resources, a five-thousand-dollar lab diamond should signal more commitment than a one-thousand-dollar mined diamond, but socially it often signals less, or even deception. This implies the norm is not just about cost but about adherence to a specific convention that specifies the type of sacrifice. The suspicion people feel toward lab-grown stones feels like the reaction to a counterfeit bill rather than a cheaper product. A counterfeit bill is physically identical but lacks the right causal history of issuance. This suggests the ring functions less like a biological handicap and more like a institutional fact, where the value is conferred by collective intentionality acting on a specific material history. So I am oscillating between seeing this as a signal of resources, a bond or hostage posted to secure a contract, and a constitutive rule that partly creates the status it denotes. The hostage model fits the legal treatment you mentioned, where the ring is a conditional gift forfeited if the marriage does not occur, but that does not explain the emotional weight of the mined versus lab-grown distinction, since a hostage just needs to be valuable, not historically specific.

  Here is where I settle after weighing those competing pressures. I think the practice presupposes a hybrid theory that is mostly conventionalist with a signalling overlay, rather than a pure costly signalling model. The core work is being done by the convention itself, which functions as a coordination equilibrium. Everyone agrees to treat mined diamonds as the token of engagement because everyone else does, and deviating from the token looks like deviating from the commitment. The cost matters, but it matters because the convention stipulates that the sacrifice must be non-trivial, not because the biology of the receiver demands a metabolic handicap. The privacy of the price is handled by the fact that the primary audience is often the partner, who may know the budget, while the secondary audience is the social circle who reads the signal as compliance with the norm rather than a precise financial disclosure. The heirloom exception works because it taps into a different layer of the convention where lineage and continuity are valued over current resource burning, effectively swapping one form of cost, financial, for another, social risk and historical weight. The lab-grown suspicion is not a signal-theoretic objection in the biological sense but a normative one. It is viewed as cheating the test because the test is defined by the tradition as acquiring a specific kind of scarce object, and lab-grown stones bypass the scarcity mechanism that the tradition relies on to define seriousness. So the content of the practice outruns signalling theory because the meaning is tied to the history of the object and the rule-following behavior of the agent, not just the resource depletion.

  Now I need to be very careful about distinguishing what is settled among people who work on this versus where the live disputes are, because this is where the literature gets muddy. There is a broad consensus in social ontology that objects like rings derive their status from collective acceptance rather than intrinsic physical properties, so almost everyone agrees that the diamond is a symbol by convention. There is also general agreement in economics and evolutionary psychology that costly signals are a real phenomenon in human mating behavior. However, there is absolutely no consensus on whether the engagement ring norm is primarily driven by evolutionary signalling pressures or by historical contingency and marketing manipulation. The story about the diamond cartel cooking up the norm is widely cited but historically debated, and even if true, it does not tell us whether the norm persists because of its signalling utility or because of path dependence. I am unsure, and I think the field is unsure, about the weight of the causal history versus the current cost. Some philosophers of art and artifacts argue that causal history is essential for authenticity, while others argue that functional equivalence is enough. In the case of the ring, the strong social reaction against lab-grown stones suggests the causal history view is winning in practice, but theoretically it is contested whether this is a rational response to signalling noise or an irrational fetishization of origin. I would guess that the suspicion of lab-grown stones is fading among younger cohorts, which would suggest the convention is evolving, but I do not have hard data on that and it is a point where I am speculating.

  If we were to drop the signalling presupposition entirely and treat the ring as purely constitutive or purely a hostage bond, the concrete changes to the norm would be subtle but detectable. If it were purely a hostage bond, the focus would shift entirely to liquidity and resale value, because the point would be to have something to forfeit if the contract is broken. We would see people buying high-resale assets like gold bars or currency bonds rather than diamonds with collapsed resale value. The fact that resale value collapses is evidence against the hostage theory and for the signalling theory, because burning money is a better signal than posting collateral. If we dropped the signalling view for a purely constitutive view, where the ring makes the engagement real like a speech act, the cost would matter less than the ritual correctness. We would see more flexibility in the material used, provided the ritual was performed correctly, but the resistance to lab-grown stones suggests the material itself is part of the constitutive rule. So the practice seems to require the cost to be burned, which supports signalling, but also requires the cost to be of a specific historical type, which supports conventionalism. The specific feature that would go if we dropped signalling is the requirement for the price to be high relative to income; if it were just constitutive, a token object would suffice. The feature that would stay is the requirement for the object to be a ring of a certain style, because that is the conventional symbol.

  I want to flag one last area of uncertainty for you because it matters for your reconstruction. I am not certain that the audience is truly blind to the cost. There is a lot of social signaling theory that suggests people are quite good at estimating the cost of visible goods through proxies, so the privacy of the receipt might not mean the privacy of the signal. People know what a one-carat diamond costs roughly, so the signal is public enough to function. But I am also unsure if the partner is the primary audience or if the peer group is. If the peer group is the audience, the heirloom problem is harder to solve, because the peer group knows you did not spend the money. If the partner is the audience, the heirloom works because the partner values the history. My best guess is that it is a multi-layered signal where the public layer signals conformity and the private layer signals commitment, and the lab-grown issue arises because it fails the public conformity test even if it passes the private cost test. This is where I would hesitate to commit to a single mechanism. The practice is likely overdetermined, holding together because it satisfies multiple theoretical functions at once, which is why it is so stable and why changing one variable, like the origin of the stone, causes such distinct friction. I hope this helps you map the terrain without smoothing over the cracks where the theories do not quite fit.
