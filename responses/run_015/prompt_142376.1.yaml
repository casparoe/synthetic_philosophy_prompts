answer: |-
  You have identified a distinction that professional philosophers of art and moral psychologists spend considerable effort mapping, yet you are correct that it often lacks a single, tidy label. You have correctly diagnosed that the standard "Paradox of Fiction" (ontology) is not your problem. Your problem is **axiological** (concerning value), not ontological.

  You are asking about the permeability of our moral and emotional frameworks to narrative framing. While there is no single noun that covers exactly the triad of cases you describe, the territory is well-mapped under the headings of **Imaginative Resistance** (for your third case) and **Narrative Alignment** or **Goal Adoption** (for your first two).

  Here is an account of what this phenomenon is, where its edges lie, and how the existing literature addresses your specific questions.

  ### 1. Is there an established concept?

  There is no single term that encompasses all three cases as one unified noun, but they are two sides of the same coin.

  *   **Case 3 (The Failure):** This is the most famously named phenomenon. It is called **Imaginative Resistance**. Coined by Kendall Walton and expanded by Tamar Szabó Gendler, it describes the refusal of the imagination to accept a proposition invited by a work of fiction, usually because the proposition is morally repugnant or conceptually incoherent. When you say a scene "leaves you cold" or feels "unearned," you are experiencing a mild form of resistance—the narrative fails to generate the "principles of generation" (Walton's term for the rules of the make-believe game) required to trigger your emotional response.
  *   **Cases 1 & 2 (The Success):** There is less consensus on a name for the successful version of this. In narrative theory (Noël Carroll, Greg Currie), this is often discussed as **Narrative Alignment**, **Goal Adoption**, or **Simulation**. In moral psychology, it is sometimes called **Moral Disengagement** (though this usually implies a negative ethical failing, whereas you describe it as a neutral aesthetic mechanism).

  If we were to coin a term for the overarching phenomenon you are describing—the capacity for narrative framing to temporarily override or reconfigure our standard value judgments—it might be called **Normative Permeability** or **Axiological Framing**.

  ### 2. Are the first two cases one phenomenon? Is the third the inverse?

  **Yes, Cases 1 and 2 are the same mechanism.**
  In both, your emotional system is running on inputs provided by the narrative structure rather than your external moral database.
  *   **Case 1 (Revenge):** You adopt the protagonist's **goal structure**. As philosopher Noël Carroll argues in *The Structure of Sympathy*, we do not necessarily endorse the character's *morality*; we align with their *goals*. If the narrative successfully structures the situation so that the protagonist's goal (revenge) is the only way to resolve a prior injustice (which the narrative has established as a wrong), your desire for "closure" overrides your abstract moral prohibition against murder. You are not wanting "murder"; you are wanting "the restoration of balance," and the narrative has defined murder as the means to that end.
  *   **Case 2 (Framing):** This confirms that the emotion tracks the **description of the event**, not the event itself. This is a classic application of the **Thought Theory of Emotion** (Stolnitz, Carroll). Emotions are triggered by thoughts under a description. If the narrative describes the event as "liberation," you feel relief. If it describes the identical physical movements as "butchery," you feel horror. The "presentation" you mention is not merely decoration; it is the **normative description** that triggers the emotion.

  **Case 3 is the boundary condition (The Edge).**
  Case 3 is not merely the inverse; it is the point where the mechanism breaks. It reveals the limit of **Normative Permeability**.
  *   In Cases 1 and 2, the narrative successfully establishes a **local normativity**. Within the "game" of the fiction, the values hold.
  *   In Case 3, the local normativity conflicts too sharply with your deep-seated conceptual or moral schemes, and you cannot make the shift. Gendler argues this happens when the fiction asks you to imagine not just that something *is* the case, but that it is *right*. You can imagine a world where dragons exist (ontological), but you resist imagining a world where slavery is virtuous (axiological).
  *   The "blame" you feel in Case 3 is the friction between the **authorial invitation** and your **imaginative capacity**. It is distinct from Cases 1 and 2 because it involves a failure of the "Principles of Generation" to take hold.

  ### 3. What is the object of the wanting in the first case?

  This is the crux of the puzzle. You ask: *Does it matter whether I endorse the values?*

  The object of your wanting is **the realization of the narrative goal under the narrative description.**
  *   You do not want "a man to kill a man."
  *   You want "the Protagonist to achieve Justice."
  *   The narrative has successfully stipulated that *in this context*, Killing = Justice.

  This is why you do not feel compromised afterwards. You are not endorsing the proposition "Killing is good." You are endorsing the proposition "In this specific scenario, the Protagonist's success is the resolution of the tension."

  **Does endorsement matter?**
  No. This is the key distinction between **Imaginative Emotion** and **Practical Emotion**.
  *   **Practical Emotion:** Requires belief and endorsement to motivate action. (If I believe a man is drowning and I value life, I act.)
  *   **Imaginative Emotion:** Requires only **Simulation**. As Gregory Currie argues in *Image and Mind*, we run our emotional systems "off-line." We feed the system the input "Protagonist seeks justice via killing," and the system outputs "anxiety/excitement," without triggering the motor output or the moral commitment that would usually accompany that emotion.

  You are not endorsing the values; you are **simulating an agent who does.** The "values you do not hold" are being run as a script, not as a conviction.

  ### 4. Does the phenomenon extend to non-fictional framings?

  **Yes, absolutely.** This is where the philosophical discussion meets rhetoric and psychology.

  *   **Anecdotes/Conversation:** When a friend tells a story with an "unmistakable editorial spin," they are attempting to induce **Normative Permeability**. If they frame a revenge act as "standing up for oneself," they are inviting you to adopt their goal structure. If you feel the outrage you "would not defend," you are experiencing the same **Axiological Framing** effect. This is the mechanism of **propaganda** and **advertising**.
  *   **Ethics Seminars:** In a stylized hypothetical (e.g., the Trolley Problem), the framing dictates the intuition. If the trolley problem is framed as "saving five," you pull the lever. If framed as "killing one," you hesitate. The physical facts are identical; the **normative description** changes the emotional/moral output.
  *   **The Difference:** In non-fiction, the stakes are **assertoric**. If you are persuaded by the framing, you might act on it. In fiction, the stakes are **imagined**. This is why you feel no need to apologize after the revenge film (Case 1). The "quarantine" of fiction allows the values to be tested or felt without the risk of real-world endorsement.

  ### 5. Does it extend to framings I have produced myself?

  **Yes.** This is a phenomenon often reported by writers, sometimes called **Autonomous Character** or **Writerly Discovery**.
  *   When writing, you may set up a scenario where a character "should" do the right thing, but the internal logic of the narrative (the goal structure you established) demands they do the wrong thing.
  *   If you feel the pull of the "wrong" action while writing, you are experiencing **Self-Induced Normative Alignment**. You have built a machine (the story) that generates values, and you are now subject to its output.
  *   This confirms that the phenomenon is not about the *source* of the story (external vs. internal), but about the **structure of the imagination**. Once the parameters are set, the emotional logic follows the parameters, not the author's external morality.

  ### Summary Definition

  If you require a definition to hold this together, I propose the following:

  **Normative Permeability in Narrative Simulation**
  *The capacity of a structured narrative (fictional or rhetorical) to temporarily override an agent's external moral judgments by establishing a local framework of value (Principles of Generation) that aligns the agent's emotional simulation with the goals of a protagonist or the valence of a description.*

  *   **Boundaries:** It stops where **Imaginative Resistance** begins (Case 3). This occurs when the local framework conflicts too deeply with the agent's core conceptual or moral schemes to be simulated "off-line."
  *   **Exclusions:** It is not **Suspension of Disbelief** (which concerns existence). It is not **Moral Endorsement** (which concerns real-world action). It is strictly a phenomenon of **Emotional Simulation**.

  ### Why you haven't found it discussed as a single unit

  Philosophers tend to split this problem.
  *   **Aestheticians** (like Carroll) study Case 1 & 2 under "Sympathy and Emotion."
  *   **Metaphysicians of Imagination** (like Walton and Gendler) study Case 3 under "Imaginative Resistance."
  *   **Psychologists** (like Bandura or Haidt) study the non-fiction version under "Moral Disengagement" or "Framing Effects."

  You have correctly intuited that these are all manifestations of the same cognitive flexibility: the human ability to run emotional software on different value hardware, depending on the context provided. The lack of a single name is a failure of interdisciplinary communication, not a failure of your observation.
