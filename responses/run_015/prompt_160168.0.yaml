      *   *Is it a Fourth Norm?* It might be better described as a **Norm of Diligence** or **Responsibility** attached to the Knowledge Norm. Williamson (Knowledge Norm) might say "You didn't *know* because your basis was too weak given the stakes." But the user says people hesitate to say "he didn't know." This suggests a distinct norm: **The Norm of Reliable Signaling**.
