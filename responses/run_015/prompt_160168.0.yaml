      *   *Case 2 Analysis:* The "Cell Ping" case. This is about **Credit vs. Luck**. If you claim knowledge ("I was right"), you claim credit. If it was luck, you are misrepresenting your reliability. This is **Virtue Epistemology** (Sosa/Greco). You get it right, but not *because* of your ability.
