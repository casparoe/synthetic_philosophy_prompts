      *   **Case 2:** Position off a single cell ping. He got it right. He said "I was right." People are angry. If he said "I got lucky," they'd be okay. If he was wrong, "lucky" wouldn't excuse the error.
      *   **Key Insight:** The complaint tracks *counterfactual reliability* (would he have said the same thing if it were false?) and *availability of cheap verification*. It's not about truth (it was true), not about belief (he believed it), and not strictly about knowledge (people hesitate to say he didn't *know*, but they still criticize the assertion).
