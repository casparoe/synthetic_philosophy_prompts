answer: |-
  You have stumbled onto one of the most active and difficult debates in contemporary social epistemology. Your intuition is correct: the standard triad (Truth, Belief, Knowledge) often fails to capture the specific normative failure occurring in your cases.

  In philosophy, this is often discussed under the headings of **Sensitivity**, **Safety**, and **Pragmatic Encroachment**, but given your specific context (high-stakes testimony where action depends on the assertion), the most fitting framework is **Edward Craig's "Good Informant" theory** combined with a **Norm of Epistemic Diligence**.

  Here is a breakdown of what is happening, why the "cheap check" matters, and how to categorize this norm.

  ### 1. Does this have a name?
  There isn't one single label, but the complaint you are describing is best captured by the concept of **Sensitivity** (from Robert Nozick) or **Safety** (from Ernest Sosa and Duncan Pritchard), applied to **Testimony**.

  *   **Sensitivity:** A belief is sensitive if, *were it false, you would not have believed it.*
      *   In **Case One**, the complaint ("He could not have told if it had not been clear") is a literal description of an *insensitive* belief. If the ridge had been occupied, he still would have said it was clear, because his method (glancing from the truck) wouldn't have detected the difference.
  *   **Safety:** A belief is safe if, *in nearby possible worlds where you believe it, it is true.*
      *   By skipping the binoculars, he entered a "nearby possible world" where he believes the ridge is clear, but it isn't. His assertion was unsafe.

  However, since your colleagues hesitate to say he didn't *know*, they are likely operating on a norm of **Assertoric Responsibility** or **Epistemic Diligence**. They are criticizing the *process*, not just the resulting state.

  ### 2. Is it a fourth norm or a reading of one of the three?
  It is often argued as a **condition on Knowledge**, but your observation suggests it functions as a distinct **Norm of Assertion**.

  *   **The Knowledge Norm View:** Timothy Williamson argues you should only assert what you know. A defender of this view would say: "He didn't *really* know the ridge was clear because his evidence was too weak."
  *   **The Fourth Norm View:** Your colleagues' hesitation to deny he "knew" suggests they recognize he had a true, justified belief. The violation is not of *Knowledge*, but of **Reliability**.

  In high-stakes environments (like SAR), the norm shifts from "Assert what you know" to "**Assert only what you have verified to the standard required by the stakes.**"

  This is a **Contextualist Norm**. In casual conversation, a glance from the truck might satisfy the norm of assertion. In SAR, the norm tightens. The "fourth norm" is essentially: **Assert only when your method of verification is robust enough to rule out error possibilities that are relevant to the context.**

  ### 3. Is it about assertion or about what the rest of us may do with what we hear?
  It is about **both**, because in your context, assertion is a **trigger for action**.

  Philosopher **Edward Craig** argued that the whole point of the concept "Knowledge" is to flag **Good Informants**. We need to know who is safe to rely on.
  *   When the dispatcher says the ridge is clear, the team acts.
  *   If the dispatcher's method is fragile (insensitive), they are a **bad informant**, even if they happened to be right this time.
  *   The anger in **Case Two** ("I was right, wasn't I") comes from the speaker claiming the status of a *Good Informant* (implying skill/reliability) when the outcome was actually due to luck.

  If he says "I got lucky," he acknowledges he is not currently a reliable source on that specific data point, and the team can adjust their risk assessment. If he says "I was right," he implies his method is sound, inviting the team to rely on him again in the future, which is dangerous.

  So, the norm is about **Managing the Listener's Risk**. You are not just sharing a belief; you are undertaking a **commitment** that your belief is stable enough to build a plan upon.

  ### 4. Does the cheapness of the skipped check actually matter?
  **Yes, philosophically and practically.** This is the domain of **Pragmatic Encroachment** (championed by Jeremy Fantl, Matthew McGrath, and Jason Stanley).

  *   **The Theory:** Whether you "know" something (or are warranted in asserting it) depends partly on the **stakes**.
  *   **The Application:** In low stakes (planning a hike for next weekend), a glance from the truck is sufficient. The cost of checking (30 seconds) outweighs the cost of error (minor inconvenience).
  *   **In SAR:** The cost of error is life or death. Therefore, the "price" of knowledge goes up. A check that was "too expensive" (in terms of time/effort) for a hiker becomes "mandatory" for a dispatcher.

  The "cheapness" matters because it creates a **Defeater**.
  *   If the binoculars were locked in a safe and the key was at headquarters, skipping them is excusable.
  *   If the binoculars are in the truck and it takes 30 seconds, skipping them is **negligent**.
  *   The availability of the cheap check makes the error *avoidable*. By asserting without taking the avoidable step, the speaker signals that they do not respect the stakes of the situation.

  ### Summary of the Phenomenon

  You are observing a violation of the **Norm of Reliable Signaling in High-Stakes Testimony**.

  1.  **It is not Truth:** The statements were true.
  2.  **It is not Belief:** The speakers believed them.
  3.  **It is not (just) Knowledge:** The speakers arguably had "true belief with justification," but the justification was **insensitive**.
  4.  **It is about Safety/Reliability:** The complaint is that the speaker's connection to the truth was too fragile. They were right, but they weren't *securely* right.

  **Why Case Two makes people angrier:**
  When the guy says "I was right, wasn't I," he is trying to bank **Epistemic Credit**. He wants the team to update their model of him to "Guy who can find positions from cell pings." But since it was a single ping (statistically unreliable), he is asking for credit he didn't earn. He is misrepresenting his own reliability. In a volunteer organization, trust is currency. Spending trust you haven't earned is a social violation.

  ### Recommended Reading
  If you want to dig into the philosophy behind this, look for these specific terms/papers:
  *   **"Pragmatic Encroachment"** (Jason Stanley, *Knowledge and Practical Interests*). This explains why the cheap check matters more in SAR than in casual chat.
  *   **"Sensitivity and Safety"** (Ernest Sosa, *A Virtue Epistemology*). This explains why "getting it right by luck" or "without proper checking" is epistemically defective.
  *   **"The Function of Knowledge"** (Edward Craig, *Knowledge and the State of Nature*). This explains why we care about whether someone is a "good informant" rather than just whether they are currently right.
  *   **"Assertion and Risk"** (Jennifer Lackey). She writes extensively on how assertion creates risk for the listener and what duties the speaker has to mitigate that risk.

  **Verdict:** You are practicing **Virtue Epistemology** in the field. You aren't just checking if the map is correct; you are assessing the *character and diligence of the cartographer*. The norm you are enforcing is: **Do not assert unless your method of verification is robust enough to withstand the cost of being wrong.**
