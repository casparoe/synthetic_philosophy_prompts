      *   *Key Concept:* **Sensitivity** and **Safety** (Epistemology).
          *   *Sensitivity:* If $P$ were false, would you still believe $P$? (Case 1 suggests he *would* have said it was clear even if it wasn't, because he didn't look properly).
          *   *Safety:* If you believe $P$, is $P$ true in nearby possible worlds?
      *   *Key Concept:* **Proper Function/Responsibilist Virtue Epistemology**. Did the agent exercise intellectual virtue/diligence?
      *   *Key Concept:* **Assertoric Warrant/Justification**. It's not just about the state of the world, but the *process* used to arrive at the assertion.
      *   *Key Concept:* **Conversational Context/Stakes**. In SAR, stakes are high. This raises the bar for assertion (Contextualism or Subject-Sensitive Invariantism).
