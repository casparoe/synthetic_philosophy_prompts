  9.  *(Refining the "Undermining Pessimism" point)*: Schopenhauer thinks music gives a "quietive" of the will. If music is just time, does it still give quietive? Yes, by aesthetic contemplation of form. But does it undermine the *metaphysics*? Yes, because it locates the power in the *subject's form of intuition* rather than the *object's metaphysical nature*. It makes music anthropocentric, not cosmocentric.

