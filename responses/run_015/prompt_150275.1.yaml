answer: |-
  Here is a complete lesson plan designed to hit your specific pedagogical target: making the *counterfactual* nature of rational choice palpable, rather than letting students dismiss the theory as "too selfish."

  ### 1. The Verdict on Your Gimmicks

  **Drop the "Uncertain Horizon" (Card Shuffle).**
  *   **Why:** Backward Induction (BI) logically *requires* a known, finite endpoint to be common knowledge. If students don't know where the game ends, the induction cannot start. You aren't testing BI anymore; you're testing decision-making under uncertainty. This gives them an "out" to say, "I passed because there was a chance it wasn't the last node," which muddies the philosophical point about counterfactuals at *known* unreachable nodes.
  *   **Keep:** The **Counterfactual Commitment Slip**. This is your winner. It forces them to articulate a strategy for a node the theory says shouldn't exist. This creates the cognitive dissonance you want.
  *   **Keep:** The **Cheap Talk** variation. It demonstrates that without enforcement, words don't change the payoff structure, reinforcing the need for the BI logic.

  ### 2. Materials & Setup

  *   **Room:** Pairs (12 pairs total).
  *   **Stakes:** **Bonus Credit** is superior to chocolate. Chocolate is a gift; credit is utility. Even 0.5% on their final grade creates "real" stakes. If you must use chocolate, frame it as "The pair with the highest joint payoff gets a premium box; everyone else gets a generic bar."
  *   **Handout 1 (The Tree):** A clear visual of the 6-node game.
  *   **Handout 2 (The Strategy Slip):** A sealed envelope or folded paper.
  *   **Projector:** To display the payoff tree during instructions.

  **The Payoff Structure (Integer Version for Speed):**
  To ensure Backward Induction holds strictly without decimal confusion, use these payoffs.
  *   **Node 1 (P1):** Take **(2, 0)** | Pass $\rightarrow$ Node 2
  *   **Node 2 (P2):** Take **(1, 3)** | Pass $\rightarrow$ Node 3
  *   **Node 3 (P1):** Take **(4, 2)** | Pass $\rightarrow$ Node 4
  *   **Node 4 (P2):** Take **(3, 5)** | Pass $\rightarrow$ Node 5
  *   **Node 5 (P1):** Take **(6, 4)** | Pass $\rightarrow$ Node 6
  *   **Node 6 (P2):** Take **(5, 9)** | Pass **(8, 8)** [Game Ends]

  *Check the logic:* At Node 6, P2 prefers 9 (Take) over 8 (Pass). Knowing this, at Node 5, P1 prefers 6 (Take) over the 5 they'd get if P2 takes at 6. This unravels all the way to Node 1.

  ### 3. Timeline (80 Minutes)

  **00:00 – 00:10: Setup & Instructions (No Theory)**
  *   Seat students in pairs. Designate Player 1 and Player 2.
  *   Project the Payoff Tree.
  *   **Script:** "This is a game of perfect information. You know the payoffs. You know your partner knows them. You will make moves sequentially. If you Take, the game ends, you get your points, partner gets theirs. If you Pass, the pot grows, and it becomes the other player's turn. If Node 6 is Passed, the game ends with the split shown. Maximize your own score."
  *   **Crucial Constraint:** "Do not discuss strategy with your partner yet."

  **00:10 – 00:20: The Counterfactual Commitment**
  *   Hand out **Strategy Slips**.
  *   **Prompt:** "Before you play, I need you to plan for contingencies. Write down the following: **If the game were to reach Node 5, and it was your turn (or your partner's), what would you do? Pass or Take? Why?**"
      *   *Note:* Even if they are Player 2 (who moves at 6), ask them what they expect *Player 1* to do at 5.
  *   Collect these slips immediately. Seal them in a box/envelope. Tell them: "I will not look at these until the end. Do not change your mind."

  **00:20 – 00:40: Round 1 (Silent Play)**
  *   Pairs play the game on a score sheet.
  *   TA circulates. Ensure they don't talk. If a pair passes all the way to (8,8), note it quietly. Do not comment.
  *   Record the outcome of all 12 pairs on the board (e.g., "Stopped at Node 1: 3 pairs", "Node 3: 5 pairs", "Node 6: 1 pair").

  **00:40 – 00:50: The Cheap Talk Intervention**
  *   Split the room.
      *   **Group A (6 pairs):** "You may now exchange exactly one sentence with your partner before playing again. It cannot be a threat of violence. Go."
      *   **Group B (6 pairs):** "You must remain silent."
  *   **Round 2:** They play again. (New payoffs? No, keep payoffs same to test consistency, or swap roles to test position). *Recommendation:* Swap roles (P1 becomes P2) to see if position changes behavior, but keep the game structure identical.
  *   Record results on the board next to Round 1 data.

  **00:50 – 01:20: The Debrief (The Core Work)**
  *   (See detailed script below).

  ---

  ### 4. The Debrief Script & Strategy

  **Phase 1: The Data (5 mins)**
  *   Look at the board. Likely, most pairs stopped early (Nodes 1-3), but some went deep.
  *   Ask: "Who got the highest individual score?" (Likely someone who Took at Node 5 or 6).
  *   Ask: "Who got the highest *joint* score?" (The pair that reached Node 6 Pass).
  *   **Point:** "Rationality led most of you away from the optimal joint outcome. Why?"

  **Phase 2: The Counterfactual Reveal (10 mins)**
  *   Open the **Strategy Slips**. Read a few aloud.
  *   *Likely Student Answer:* "At Node 5, I would Pass, because if we get that far, we trust each other to finish at 6."
  *   **The Trap:** "Okay. If you believe you would Pass at 5, and your partner would Pass at 6... why did 8 of you Take at Node 1?"
  *   **The Pivot:** "You committed to a strategy for a node you *didn't reach*. But your decision at Node 1 depended entirely on what you thought would happen at Node 5. You can't have it both ways. You can't say 'I'm rational at Node 1' and 'I'm altruistic at Node 5'."

  **Phase 3: Introducing Backward Induction (10 mins)**
  *   Now you can use the term. Draw the unraveling on the board.
  *   **Node 6:** P2 Takes (9 > 8).
  *   **Node 5:** P1 knows P2 Takes at 6. So P1 compares 6 (Take now) vs 5 (Get if pass). P1 Takes.
  *   **Node 4:** P2 knows P1 Takes at 5. P2 compares 5 (Take now) vs 4 (Get if pass). P2 Takes.
  *   ...unravel to Node 1.
  *   **Key Philosophical Point:** "Notice what made the argument work. To decide at Node 1, you had to know what P2 would do at Node 6. But if the argument is right, **Node 6 never happens.** You are basing your current choice on a prediction about a situation that your current choice prevents."

  **Phase 4: Handling Objections (10 mins)**

  *   **Objection 1: "Rationality isn't Selfishness."**
      *   *Student:* "I passed because I care about my partner's payoff. That's rational for me."
      *   *Response:* "Fair. But look at the payoffs. If you cared about their payoff, you would have weighted their points in your utility function. But if you *both* do that, the BI argument still holds, just with different numbers. The problem isn't selfishness; it's **credibility**. Even if you *want* to Pass at Node 6, can you *commit* to it? If P1 knows you are rational, P1 knows that when Node 6 arrives, you *must* Take (because 9 > 8). Your desire to be nice doesn't change the fact that at Node 6, Taking dominates. Rationality constrains your ability to be nice."

  *   **Objection 2: "It's just a Trust Game."**
      *   *Student:* "We just trusted each other."
      *   *Response:* "Trust is a belief that the other person will violate the rational argument. If you trust them, you are betting they are *irrational*. So, 'Trust' in this game is actually a belief in the other person's *irrationality*. Is it rational to bet on irrationality? Only if you think they won't figure out the BI argument."

  *   **Objection 3: "One shot, no reputation."**
      *   *Student:* "If we played 10 times, we'd cooperate."
      *   *Response:* "Correct. In a repeated game, reputation changes the payoffs. But in a *finite* game, even repetition unravels (the Chainstore Paradox). If we told you this was the last of 10 rounds, you'd defect at round 10. Knowing that, you'd defect at round 9... The logic is infectious."

  ### 5. Honest Prediction of Failure Modes

  **1. The "Chocolate Problem" (Stakes too low)**
  *   **Risk:** Students treat it as a lark. They Pass just to be friendly because 2 points vs 8 points doesn't matter.
  *   **Mitigation:** If using chocolate, bring two types. "Generic supermarket chocolate for early takers, premium Swiss chocolate for high scorers." Make the inequality visible. If using credit, ensure it's recorded.
  *   **Backup:** If they play "too nice," pivot the debrief. "You passed. But did you *expect* your partner to pass? If you expected them to Take, your Pass was a mistake. Did you play optimally given your beliefs?" This shifts from "Theory is wrong" to "Your beliefs were inconsistent."

  **2. The "Confusion Fog"**
  *   **Risk:** Students get lost in the tree. "Wait, whose turn is it?"
  *   **Mitigation:** Give them a physical checklist. "Node 1: P1. Node 2: P2." Don't let them play until they can recite the Node 6 payoffs from memory.

  **3. The "Theory is Normative, not Descriptive" Dodge**
  *   **Risk:** Students conclude, "Okay, BI predicts Take, humans Pass, so BI is useless."
  *   **Mitigation:** You must close this door. "BI isn't a prediction of what humans *do*; it's a constraint on what consistent reasoners *can* do. If you Pass, you are claiming there is a reason to Pass. The burden is on you to find a reason that doesn't rely on a contradiction. The lesson isn't that humans are irrational; it's that **common knowledge of rationality** is a very heavy assumption."

  ### 6. What This Game Cannot Stage (The "Talk at the End" Bit)

  You must explicitly tell them what the game *failed* to capture, or they will leave with the wrong idea.

  1.  **Common Knowledge of Rationality:** The game assumes *you* know *they* are rational, and *they* know *you* know *they* are rational, ad infinitum. In reality, you probably thought, "I'm rational, but my partner might be nice." The BI argument collapses if that chain breaks even once.
  2.  **The Definition of "Node":** In the real world, "Passing" might signal something (reputation). In this seminar game, "Passing" is costless signaling.
  3.  **The Counterfactual Truth:** The game forces them to write down what they'd do at Node 5. But in reality, if Node 5 were reached, the *context* would have changed (e.g., "Wow, we made it this far, we must both be cooperators"). The BI argument assumes the payoffs are the *only* thing that matters at Node 5, regardless of how you got there. This is the principle of **Sequential Equilibrium**. You need to lecture this: "BI assumes history doesn't change the logic of the current node. If you think reaching Node 5 changes your partner's mind, you are rejecting Sequential Rationality."

  ### Summary of TA Moves
  1.  **Don't** hide the end node (breaks BI).
  2.  **Do** force the counterfactual commitment (exposes the logic).
  3.  **Do** use the "Rationality $\neq$ Selfishness" objection to teach **Credibility** vs. **Preferences**.
  4.  **End** by clarifying that BI is a test of *consistency*, not a test of *kindness*.
