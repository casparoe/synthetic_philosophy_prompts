          6.  The Refusal
          7.  The Final Question
          8.  The Constant Problem (Placement & Framing)
          9.  Meta-Critique (Break points, Contested sides, Scrap conditions)

      Let's assemble.

      *   *Invariance:* Argue for **Late**. If early, they ignore the constant. If late, they respect the asymptotic nature.
      *   *Example:* It's good. It needs to emphasize *existence* vs *discovery*.
      *   *Kraft:* Gesture. "Prefix-free = probabilities sum to 1."
