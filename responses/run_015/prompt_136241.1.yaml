          *   Agents have a right to truth when that truth is necessary for the exercise of their **legitimate autonomy**.
          *   Exception 1: **Forfeiture.** The listener forfeits this right if they intend to use the truth to violate the rights of others (Pursuer).
          *   Exception 2: **Developmental Stewardship.** The listener lacks the capacity to integrate the truth without damaging their developing agency (Child).
          *   Severity depends on the **structural impact** on social trust vs. **interpersonal harm**.

  4.  **Addressing the Specific Tensions:**
      *   *Pursuer vs. Patient:* Pursuer forfeits right (malicious intent). Patient retains right (autonomy over end-of-life narrative).
      *   *Interview vs. Check:* Interview is a formal gatekeeping institution (high structural trust). Check is a transactional promise often subject to "banker's hours" social norms (lower structural trust, more forgiveness).
