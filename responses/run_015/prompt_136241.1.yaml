      *   *Why is the Dying Patient lie wrong?* It manipulates emotional closure. It treats the patient as a child. It violates autonomy at the end of life. It creates a false reality about relationships.
      *   *Why is the Interview lie wrong?* It undermines the hiring process (institutional trust). It gives unfair advantage.
