answer: |-
  **MEMORANDUM**

  **TO:** Animal Research Oversight Committee
  **FROM:** [Your Name], Community Member
  **DATE:** [Date]
  **SUBJECT:** Recommendation on Proposed Scope Policy Rewrite

  **Recommendation**

  I recommend that the committee **adopt the tiered, evidence-weighted protocol, inclusive of the substrate clause**, with one specific amendment: the tier assignment must be accompanied by a brief qualitative narrative justifying the score.

  We should not revert to the old vertebrate/cephalopod line, nor should we adopt the tiered system without the biological constraint. The old line is scientifically obsolete; the unconstrained tiered system is administratively unworkable and conceptually confused. The substrate clause, properly framed, is not a fudge to exclude robots. It is a necessary acknowledgment that our markers measure *competence*, while our mandate is to regulate *welfare*.

  **The Core Problem: Competence vs. Valence**

  The subcommittee's checklist is excellent at measuring functional agency. It asks: Does the system persist? Does it trade off costs? Does it generalize? These are markers of sophisticated control. When a warehouse robot scores higher than a fruit fly, the checklist is working correctly: the robot is more behaviorally complex.

  The discomfort this causes is not a bug in the checklist; it is a bug in our assumption that behavioral complexity maps linearly to moral status.

  My concern is that a single Tier number treats moral status as one-dimensional. It implies that a system is simply "more" or "less" of a moral patient. In reality, moral status is likely multidimensional. A system can be high on *agency* (like the robot) and low on *affective capacity* (the ability to suffer). A system can be low on *agency* (like a larva) and high on *affective capacity*. By collapsing these into a single scalar Tier, we risk regulating intelligence when we mean to regulate suffering.

  The substrate clause resolves this. It does not assert that biology is magic. It asserts that, given our current markers conflate agency with affect, evolutionary history and biological embodiment are the best available proxies for the specific dimension we care about: the capacity for valenced experience. Without the clause, we are regulating optimization. With it, we are regulating welfare.

  **Addressing Practical Constraints**

  We must be honest about capacity. Staff can absorb approximately forty full reviews annually. If we remove the substrate clause, we open the door to reviewing any high-functioning algorithmic system. If a lab proposes testing a new multi-agent reinforcement learning model, and it scores Tier 3, we are obligated to review it. This could easily generate hundreds of protocols, overwhelming the office and diluting the rigor of reviews for biological subjects.

  The substrate clause acts as a necessary triage filter. It keeps the committee's focus on the domain where the evidence for suffering is plausible, ensuring that the forty available review slots are spent on cases of genuine ethical weight.

  **Anticipating Objections**

  I expect two primary objections in the room, both valid.

  *To the Physiologist:* You will argue that the evidence for pain or affect in *Drosophila* is thin, and that placing them in a high tier based on these markers is unscientific.
  *Response:* The tier system is not a verdict on proof; it is a mechanism for risk management. We are not certifying that flies feel pain; we are acknowledging that we cannot rule it out. The tier dictates the *burden of justification* on the researcher, not the certainty of the committee. If the evidence is thin, the protocol must be stronger to compensate. That is the point of the review.

  *To the Philosopher:* You will argue that assigning a number (Tier 2 vs. Tier 3) implies a precision we do not possess. It creates a false sense of moral arithmetic.
  *Response:* I agree. That is why I propose the **qualitative narrative amendment**. A lab cannot simply submit a checklist summing to "3." They must provide a short narrative explaining *why* the behaviors observed suggest a specific level of welfare concern. This forces the researcher to engage with the ambiguity rather than hiding behind the score. It satisfies the need for categorization without surrendering to false precision.

  **The Strongest Counter-Argument**

  I want to state the case against the substrate clause as clearly as I can, because its proponents on this committee are right to be worried.

  The argument against the clause is that it is speciesist by design. It hard-codes a biological bias into policy. If we define moral status by evolutionary history rather than functional capacity, we blind ourselves to future moral risks. If a non-biological system *does* develop the capacity for suffering, or if our understanding of what generates valence shifts, this policy creates a bureaucratic shield that allows us to ignore it. By saying "only biology counts," we are not making a scientific distinction; we are making a metaphysical one, and we are insulating ourselves from the obligation to update that metaphysics. This is a valid concern about long-term moral myopia.

  **Conclusion**

  That long-term risk is real, but it is not the risk this committee is staffed or mandated to manage. We are an *animal* research oversight committee. Our expertise, our legal framework, and our capacity are built around biological systems. To attempt to police algorithmic welfare without the substrate clause is to expand our scope beyond our competence and our resources.

  We should adopt the tiered system to modernize our approach to behavior. We should include the substrate clause to keep our mandate focused on welfare rather than competence. And we should require a narrative justification to acknowledge that a number cannot capture the complexity of a mind, whether it is made of cells or silicon.

  This path allows us to proceed with the *Drosophila* protocol without reviewing the warehouse, and it keeps our workload within the bounds of what staff can handle rigorously. It is not a perfect solution to the philosophy of mind, but it is a workable solution for the university.
