      *   *Good move:* **Pluralism/Fragmentation.** Acknowledge there are two concepts.
      *   *Specific Suggestion:* Adopt a "Strawsonian Pincer" or a "Two-Concept View." Distinguish between *Responsibility as Accountability* (social, functional, compatibilist-friendly) and *Responsibility as Desert* (metaphysical, incompatibilist-required).
      *   *Formal Model:* Hierarchical models (Frankfurt) fail because of the regress. A *network* or *ecological* model of agency might help show why "vertical" constitution isn't necessary for the functional concept.
      *   *Framing Shift:* Move from "Can we have it?" to "Which one do we need, and why?"

