  2.  **Cardinality Constraint:** No operation can map a set of guests into a set of rooms if the cardinality of the guests strictly exceeds the cardinality of the rooms.
  3.  **Order Integrity:** Instructions involving order (e.g., "move to the next room") are only coherent if the indexing set of rooms possesses the requisite order properties (e.g., a well-ordering with successors).

