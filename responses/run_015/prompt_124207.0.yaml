  ### The New Case: The Integer Hotel ($\mathbb{Z}$)

  **The Setup:** Rooms $\dots, -2, -1, 0, 1, 2, \dots$. At times $t_k = 1 - 1/2^k$, every guest moves from $n \to n-1$.

