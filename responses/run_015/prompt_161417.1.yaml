  8.  **Final Polish:** Ensure all constraints of the prompt are met (graded evidence, specific historical cases, falsifiability check, confidence levels). *Self-correction:* Make sure to explicitly answer "what would count against this" clearly at the start.

  *(Self-Correction during final review)*: I need to be careful with the Nixon BW case. It is often cited as a successful unilateral move. Why? Because the military utility was low compared to nuclear. This supports the "prize value" argument, not necessarily the commitment mechanics. I should frame it as a challenge to the "restraint is always self-defeating" claim, but absorbable if the *value* of the prize collapsed.
