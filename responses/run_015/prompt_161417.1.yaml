  4.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction on Nixon/BW:* Did Nixon extract value? Not immediately. It was largely unilateral. This challenges the "restraint is self-defeating" claim slightly, *unless* the value was domestic political capital or long-term norm setting. I need to be nuanced here.
      *   *Correction on Asilomar:* Scientists paused *themselves*. This is a "mutual stand-down." The user says this needs verification capacity. Did they have it? Yes, peer review and community monitoring. This is a strong counter-example to "verification is destroyed." I need to admit this is a significant challenge, perhaps limited to tight-knit epistemic communities vs. geopolitical rivals.
      *   *The "Winner Restrains" Challenge:* The user says this is the hardest thing to dismiss. I need to find if this exists. *Example:* The US-Soviet Hotline? No, that's risk reduction. *Example:* Gorbachev's unilateral cuts? That led to the end of the Cold War, but was the USSR "winning"? No. *Example:* British surrender of nuclear independence (Skybolt crisis)? They relied on US.
