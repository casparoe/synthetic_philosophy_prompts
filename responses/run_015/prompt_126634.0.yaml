answer: |-
  **Exam Question**

  **Essay Question:**
  The "Great Divergence" literature often structures its central explanandum as a contrastive question: "Why did industrialization occur in Britain and not in China?" Critically evaluate the logical coherence of this contrastive framing. Specifically, diagnose whether selecting Britain and China as paired cases presupposes an illicit baseline of institutional comparability circa 1700. Furthermore, apply an interventionist account of causal explanation (wherein causal claims require counterfactual stability under interventions while holding background conditions fixed) to this macrohistorical comparison. Does the framing collapse into a non-contrastive comparative analysis due to the instability of background conditions, or can it be salvaged? If salvaged, what explicit restrictions must be placed on the counterfactual scope and variable selection? Your answer must prioritize the philosophical structure of explanation over historical narrative.

  ***

  **Model Answer**

  **Title:** The Limits of Contrast: Salvaging the Great Divergence via Variable Isolation

  The contrastive framing "Why Britain and not China?" is philosophically defective as a totalizing historical narrative but can be salvaged as a localized causal claim if subjected to severe restrictions on counterfactual scope. To defend this, we must analyze the question through an interventionist lens, specifically addressing the problem of the baseline and the stability of background conditions.

  Standard contrastive explanation (following van Fraassen or Hitchcock) requires that the fact ($P$) and the foil ($Q$) share a common causal history up to a divergence point, allowing us to isolate the specific difference-maker. In the Great Divergence, the implicit claim is that Britain and China were sufficiently comparable circa 1700 that the absence of industrialization in China requires specific explanation relative to Britain. However, this presupposes an illicit baseline of institutional comparability. If the background conditions ($B$)—geopolitical fragmentation, property rights structures, coal endowment, and cultural epistemologies—were already significantly divergent by 1700, then holding $B$ fixed for an interventionist test is impossible. An interventionist account (à la Woodward) demands that we ask: "If we were to intervene on variable $X$ (e.g., patent law) in China, would outcome $Y$ (industrialization) occur, holding $B$ fixed?" If $B$ in China is structurally distinct from $B$ in Britain, the counterfactual is ill-defined. We cannot simply "swap" institutions between two systems that process institutional inputs differently.

  Consequently, the unrestricted contrastive framing collapses. It attempts to treat "China" and "Britain" as monolithic variables in a controlled experiment where no control exists. This leads to a *non-contrastive* analysis in practice; historians end up describing the internal causal chains of Britain's rise and China's stagnation separately, rather than identifying a single difference-maker that explains the contrast. The question "Why not China?" becomes a placeholder for "Describe China's constraints," losing the logical force of a contrastive why-question.

  However, the framing is salvageable if we restrict the counterfactual scope and abandon the "nation-as-unit" ontology. We must move from asking "Why Britain not China?" to "Why did specific mechanism $M$ trigger industrialization in Context $C_1$ but not $C_2$?" This requires decomposing the macro-variables. Instead of treating "China" as a background condition, we must treat specific institutional features (e.g., state capacity regarding resource extraction) as the variables themselves.

  To salvage the interventionist logic, we must restrict the counterfactual baseline to *functional* comparability rather than *structural* identity. We can legitimately ask: "Given a similar level of market development (the restricted baseline), did the absence of secure property rights prevent industrialization?" Here, the counterfactual is stable because we are not comparing whole civilizations, but specific causal pathways. We hold the *functional* background (market maturity) fixed, not the *historical* background (dynastic politics). This allows for a valid intervention: we can conceptually manipulate property rights security while acknowledging that the political mechanism to enforce them differs.

  Critics might argue that this fragmentation loses the holistic insight of the Great Divergence, reducing history to isolated variables. This objection fails because macrohistorical causation is always aggregative. If we cannot specify the micro-foundations of the divergence, the macro-claim is merely a correlation. By restricting the scope, we do not lose explanatory power; we gain causal validity. We admit that "China" is not a single variable but a cluster of conditions.

  Therefore, the "Britain not China" framing is only well-posed when it ceases to be a comparison of places and becomes a comparison of causal mechanisms operating under restricted, functionally defined baselines. Without these restrictions, the counterfactuals are unstable, and the explanation collapses into parallel narratives. With them, the contrastive structure survives as a tool for isolating specific difference-makers within a complex historical system.

  ***

  **Marking Scheme**

  **Grade A (Excellent/Distinction)**
  *   **Conceptual Precision:** Explicitly distinguishes between *explanandum selection* (what is being explained) and *counterfactual licensing* (what makes the "what if" valid).
  *   **Baseline Diagnosis:** Clearly identifies the "illicit baseline" problem: that treating 1700 Britain and China as comparable units violates the *ceteris paribus* requirement of interventionism.
  *   **Interventionist Application:** Correctly applies Woodwardian conditions (manipulability, background stability) to show why macro-units fail as variables.
  *   **Salvage/Restriction:** Proposes a specific philosophical repair (e.g., functional vs. structural comparability, decomposing national units into mechanism variables) rather than a historical one.
  *   **Objection Handling:** Addresses a strong objection (e.g., holism/complexity) and explains why the restricted scope is superior for *causal* validity.
  *   **Commitment:** Takes a clear stance (as modeled) rather than hedging.

  **Grade B (Good/Pass)**
  *   **Conceptual Understanding:** Identifies that Britain and China are different, but treats this as a historical fact rather than a logical problem for contrastive explanation.
  *   **Baseline Diagnosis:** Mentions comparability issues but fails to link them explicitly to the *counterfactual stability* required by interventionism.
  *   **Interventionist Application:** Uses interventionist terminology (interventions, variables) but applies them loosely (e.g., treating "intervention" as mere historical possibility).
  *   **Salvage/Restriction:** Suggests the question is "too broad" but offers vague restrictions (e.g., "look at specific dates") rather than ontological or variable restrictions.
  *   **Objection Handling:** Mentions an objection but resolves it via historical narrative rather than philosophical argument.
  *   **Commitment:** May remain neutral or conclude that "both sides have merit" without resolving the logical tension.

  **Typical Errors (Costing Marks)**
  *   **Historical Summarizing:** Spending >40% of the essay summarizing Pomeranz, Lin, or Needham without analyzing the *logic* of their questions.
  *   **Counterfactual Confusion:** Treating counterfactuals as "guessing what might have happened" rather than testing causal invariance.
  *   **Category Mistake:** Treating "Britain" and "China" as valid causal variables without critiquing the aggregation problem.
  *   **Neutrality:** Refusing to argue whether the framing collapses or is salvageable, resulting in a descriptive rather than argumentative essay.
  *   **Ignoring the Prompt:** Failing to address the "interventionist account" or the "illicit baseline" specifically.
