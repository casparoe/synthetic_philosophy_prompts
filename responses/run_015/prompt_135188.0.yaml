      *   *Check:* Did I address the "political crime" aspect? Yes, Sen implies it, but his academic work is descriptive (entitlement failure), while the "crime" label is normative. The commentator conflates the two.
      *   *Check:* The User's "Epistemic Entitlement Gap." This is a strong concept. I need to validate it. Sen talks about "public action" and "informational role of democracy." The user's term is a good synthesis but needs to be positioned correctly within Sen's logic (it's a precondition for entitlement protection, not an entitlement type itself).

  7.  **Final Polish:** Check against constraints one last time. (No citations, actionable audit).

  *(Self-Correction on Ireland)*: I need to be careful. Sen uses Ireland to illustrate entitlement shifts, but the specific claim about "enforcing market discipline" is more specific than Sen's general entitlement analysis. Sen focuses on the fact that food left the country while people starved (exchange entitlement failure), not necessarily proving the *intent* was malicious discipline, though the outcome was criminal by neglect. I should highlight this distinction between *outcome* and *intent*.

  *(Self-Correction on GLF)*: Sen explicitly notes that in China, food availability *did* decline, unlike Bengal. The commentator's claim that harvests remained "adequate" is factually shaky regarding Sen's specific analysis of China. Sen focuses more on the lack of corrective mechanism.

  *(Refining the "Epistemic" point)*: Sen distinguishes between *entitlement* (what you can get) and *entitlement mapping* (the rules). Information failure disrupts the *response* to entitlement failure. So the "gap" is in the *protection* system, not the entitlement map itself. I need to make sure this distinction is clear.

