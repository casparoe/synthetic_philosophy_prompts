      *   *User's Concept:* "Epistemic entitlement gap" (institutional mechanisms for registering deprivation collapse). Does Sen treat this as entitlement collapse or separate? Does the commentator capture this?

  3.  **Evaluate Claims against Sen's Actual Work (Mental Knowledge Retrieval):**
      *   *Claim 1 (Never FAD):* Sen argues FAD is *not necessary* for famine, not that it *never* happens. He acknowledges FAD can contribute but emphasizes entitlement failure is the more common/proximate cause in modern famines. "Never" is too strong.
      *   *Claim 2 (Bengal):* Sen's *Poverty and Famines* focuses heavily on Bengal. He does argue food availability did not decline significantly (actually rose slightly in some metrics), but "solely" is risky. War-time inflation, speculation, and distribution failures are key. The "refusal to release stores" is part of the policy failure, but Sen focuses more on the *entitlement mapping* (wages vs. prices).
      *   *Claim 3 (Ireland):* Sen discusses Ireland, but the specific claim about "deliberately withheld relief to enforce market discipline" is more aligned with later historians (like Cormac Ó Gráda or Christine Kinealy) than Sen's primary theoretical focus. Sen uses it to show exports continued despite starvation (entitlement failure), but attributing specific *intent* ("deliberately... to enforce") moves from entitlement analysis to moral/political judgment. Sen calls it a failure of entitlements, often exacerbated by policy, but "unambiguous political crime" is a normative leap Sen implies but doesn't necessarily codify as a theoretical law.
