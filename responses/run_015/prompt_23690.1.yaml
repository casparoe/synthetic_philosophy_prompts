      *   *Exchange 4: Empty Slots vs. Empirical Fitting.*
          *   Marcus: Empty slots are just logical possibilities. Nature didn't have to fill them. We discard the ones that don't match (like continuous spin).
          *   Elena: The fact that the *allowed* slots match the *observed* slots without tweaking the group is the miracle. We didn't adjust $SO(1,3)$ to fit the electron.

      *   *Exchange 5: The Symmetry Premise.*
