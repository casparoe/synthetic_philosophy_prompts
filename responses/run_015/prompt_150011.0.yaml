prompt: |-
  Consider the institutional architecture of university funding in the United States, the United Kingdom, Germany, and the Nordic countries. In the U.S. and U.K., students typically sign loan contracts for tuition costs; the debt is non-dischargeable in bankruptcy and collected through state-backed income-contingent withholding, so the state acts simultaneously as creditor and tax collector. In Germany and the Nordic countries, tuition is absent or nominal, replaced by direct tax-funded grants; yet these grants are often conditional on maintaining a specific study-progress rate and on residency or citizenship, and in some Nordic schemes they convert to loans if progress lags. The result is a puzzling asymmetry: one system frames education as a private investment enforced like a tax obligation, while the other frames it as a universal entitlement delivered through conditional, performance-tracked benefits.

  What philosophical commitments about risk, desert, and social membership does this design presuppose? Reconstruct the implicit theory of justice or value that best explains why debt is made inescapable and individually tracked, while grants are made universal yet revocable for slowness rather than for failure to learn. Is the architecture consistent with a single view—education as human-capital investment, as a public good, or as a component of citizenship—or does it quietly combine incompatible commitments, such as treating students as autonomous risk-bearers in one dimension and as administratively managed human-capital producers in the other? Distinguish what the practice strictly requires from what merely fits it, and describe what institutional changes would be necessary if the underlying view were replaced by one that treats educational support as an unconditional, non-revocable entitlement with no claim on future earnings beyond ordinary progressive taxation. Answer in American English.
