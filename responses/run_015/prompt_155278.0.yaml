      *(Self-Correction during drafting)*: I need to ensure I hit the specific constraints: "Definately need one on sunk cost," "Counting grass," "Deathbed," "Wolf/Objective Value," "Blank Person." That's 5 specific ones. I need 3-5 more to reach 8-10. I'll add the Dad one, the Camus one, the Source of Norms, and the "Escape" clause.

