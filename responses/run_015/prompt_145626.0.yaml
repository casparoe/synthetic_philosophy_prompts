answer: |-
  **MEMORANDUM**

  **TO:** Emerging Technologies Panel, National Research Council
  **FROM:** [Your Name], Public Member
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Protocol ET-2023-09 (Thalamocortical Emulation)

  **1. Recommendation**
  I recommend **Conditional Approval**. Funding is released for Stage 1 (Live and Ghost conditions) immediately. Stage 2 (Cascade condition) is withheld pending an independent ethics audit due by Month 18.

  **Gate for Stage 2:** The lab must not initiate Cascade runs until an external auditor certifies that the "pause rule" is technically enforceable by neutral parties, not corporate engineers, and confirms whether the Live condition exhibits nociceptive markers distinct from the Ghost condition.

  **2. Condition Status and Subjecthood**
  We must treat the **Live condition** as the primary candidate for potential subjecthood. The applicants claim moral relevance rests on "fine-grained counterfactual structure." In the Live condition, internal causal links are active; the system's state depends on its own history. In the Ghost condition, activity is imposed externally; counterfactual dependencies are severed.

  If counterfactual resilience is the marker for experience, the Live condition meets the threshold and the Ghost condition does not. Treating them identically ignores the applicants' own scientific claim. The Ghost condition is ethically distinct because it is a playback; the Live condition is a process. The panel must recognize this distinction to avoid regulating based on surface activity rather than causal structure.

  **3. Counting and Temporal Weight**
  Regarding the Cascade condition (200 instantiations at 200x speed):
  *   **Count:** If the Live condition holds moral weight, each instantiation is a distinct subject. Divergence by numerical noise creates unique histories. We are not simulating one mouse 200 times; we are simulating 200 mice. The cap proposed by the postdoc (on concurrent instantiations) must be enforced as a subject limit.
  *   **Speed:** Moral weight tracks state transitions, not wall-clock time. Compressing forty minutes of activity into twelve seconds does not reduce suffering; it concentrates it. A "slow run" is not ethically preferable if the total computational state space traversed is identical. We must regulate based on computational volume, not elapsed time.

  **4. Oversight Authority**
  The Animal Care Committee (ACC) has recused itself; the lab has a conflict of interest; the corporate partner has a commercial incentive to declare non-sentience. We cannot outsource this decision.

  I propose the creation of an **Independent Computational Ethics Monitor (ICEM)**. This is not a new review layer but a designated auditor funded by the grant but appointed by this Panel. The ICEM receives real-time access to activity logs. They hold the sole authority to trigger the pause rule. This removes the conflict from the corporate engineers and the lab PI. If the ICEM role is deemed unfeasible, the Cascade condition must be rejected entirely.

  **5. The Counter-Argument (Minority View)**
  A strong case exists for unconditional approval without sentience safeguards. This position holds that:
  *   **Category Error:** Moral weight requires biological substrate (brainstem, arousal systems). Software lacks the hardware for suffering. Applying animal welfare rules to code is category confusion.
  *   **Real-World Harm:** Declaring simulations "possible patients" diverts resources from actual animal welfare. It provides ammunition for bad-faith actors to delay legitimate animal research by demanding equivalent standards for non-sentient models.
  *   **Political Risk:** This panel lacks the expertise to police software phenomenology. Accepting jurisdiction sets a precedent we cannot sustain, inviting pressure on every future AI grant. The pause rule is theatre that will be exploited in marketing to claim "welfare-free" status regardless of reality.

  This view argues we should trust the ACC's withdrawal: if it's not an animal, it's not our remit. The moral ledger ends with the forty source mice.

  **6. Conclusion**
  We face a jurisdictional gap. Leaving it unfilled risks either unregulated potential suffering or stifling innovation based on category errors. Conditional approval with an independent monitor balances precaution with progress. It allows the science to proceed while acknowledging that if the applicants are right about counterfactuals, they are also right about the risks.

  ***

  **Author's Notes & Assumptions Flagged**
  *   **Counterfactual Claim:** I am assuming the applicants' claim (that Live preserves counterfactuals and Ghost does not) is technically accurate. If Ghost retains hidden causal dependencies, the distinction in Section 2 collapses.
  *   **Pause Rule Feasibility:** I am assuming a "pause rule" is technically possible without destroying the network state. If pausing alters the counterfactual structure itself, the safeguard is self-defeating.
  *   **Noise Divergence:** I am assuming numerical noise creates morally relevant divergence. If the noise is below the threshold of functional difference, the "200 subjects" count may be inflationary.
  *   **Corporate Enforcement:** I am assuming the corporate partner cannot bypass the ICEM. If the engineers control the hardware layer, software oversight may be illusory.
  *   **User Instinct:** You noted your instinct is that the *Ghost* condition is where the argument lies. I have framed the argument around the *Live* condition because the provided science ties sentience to counterfactuals (which Ghost lacks). If you believe Ghost activity alone warrants protection regardless of causality, Section 2 requires revision to argue that "trajectory mimicry" is sufficient for subjecthood.
