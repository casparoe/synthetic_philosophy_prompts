answer: |-
  ### Preliminary Brainstorming

  Before formulating the principles, I need to isolate the conceptual fault lines running through your six cases. Your verdicts suggest a moral framework that is sensitive to **agency type** (individual vs. institution), **causal proximity** (direct harm vs. systemic participation), and **epistemic authority** (who gets to define value).

  *   **Individual vs. Institutional Agency:** Cases 1, 3, and 5 concern individual career and donation choices. Cases 2, 4, and 6 concern institutional policies and norms. Your verdicts imply that individuals and institutions operate under different moral rules. Individuals are permitted to optimize outcomes (Case 1), while institutions are expected to protect pluralistic values (Case 6).
  *   **Complicity and Harm:** The contrast between Case 1 (finance) and Case 5 (fossil fuels) is the sharpest tension. Both involve high-income careers offset by donations. The distinction must lie in the *moral valence of the revenue source*. Finance is likely viewed by you as morally neutral or distributive, whereas fossil fuel consulting is viewed as causally linked to physical destruction. This suggests a deontological side-constraint on "dirty hands" that consequentialist offsetting cannot wash clean.
  *   **Voluntary vs. Coercive Quantification:** There is an apparent contradiction between praising the graduate in Case 1 for choosing quantifiable charities and condemning the foundation in Case 4 for demanding quantifiable metrics. The distinction likely rests on power dynamics. An individual *selecting* a charity based on metrics is exercising consumer choice. A foundation *mandating* metrics as a condition of funding is exercising market power that distorts the ecosystem.
  *   **Epistemic Humility:** Cases 2, 4, and 6 suggest that some goods (literacy, social trust) are real but resistant to short-term measurement. A moral framework that demands quantification for these goods is epistemically arrogant. However, Case 1 suggests quantification is useful for *comparative* efficacy in global health. The principle must distinguish between metrics as a *tool for discovery* versus metrics as a *criterion for legitimacy*.

  ***

  ### 1. The Proposed Principles

  Your verdicts are best captured by a small family of two complementary principles. They divide moral labor between individual actors and institutional rule-setters.

  **Principle A: The Complicity-Constrained Optimization Principle (For Individuals)**
  *   **Formulation:** Individuals should act to maximize the net positive impact of their resources, *provided that* their primary means of acquiring those resources do not involve direct complicity in severe, irreversible physical or environmental harm.
  *   **Motivation:** This captures the tension between Case 1 and Case 5. It allows for "earning to give" (Case 1 and 3) but sets a deontological boundary where the income source itself is morally tainted (Case 5).
  *   **Verdicts:**
      *   **Case 1:** **Admirable.** Finance is treated as neutral/distributive; the high donation maximizes impact without violating the harm constraint.
      *   **Case 3:** **Admirable.** Direct work maximizes impact; no harm constraint violated.
      *   **Case 5:** **Corrupt/Wrong.** Fossil fuel consulting involves direct complicity in environmental harm. The donation cannot offset the violation of the constraint.
      *   **Case 7 (Prediction):** **Admirable.** (See Section 3).

  **Principle B: The Epistemic Pluralism Norm (For Institutions and Funders)**
  *   **Formulation:** Institutions should not alter their core mission to fit measurement tools, and funders should not impose evaluation frameworks that systematically exclude important human goods simply because they are difficult to quantify in the short term.
  *   **Motivation:** This captures Cases 2, 4, and 6. It protects "soft" goods (trust, literacy) from being crowded out by "hard" metrics (QALYs, RCTs) when institutional mandates are involved.
  *   **Verdicts:**
      *   **Case 2:** **Damaging/Wrong.** The nonprofit distorted its mission to fit donor metrics, violating the norm.
      *   **Case 4:** **Reckless/Harmful.** The foundation imposed a reductionist framework, violating the norm.
      *   **Case 6:** **Defensible.** The organization resisted metric tyranny to protect social trust, upholding the norm.
      *   **Case 1 (Charity Side):** **Compatible.** The graduate *choosing* rigorously evaluated charities does not violate this norm because she is not *forcing* charities to change their nature; she is selecting from those that voluntarily provide evidence. This resolves the tension between Case 1 and Cases 2/4.

  ***

  ### 2. Addressing the Tensions and Limitations

  **The Case 1 vs. Case 5 Tension (The "Dirty Money" Problem)**
  *   **The Conflict:** Both cases involve high-income careers offset by significant donations. Consequentialism struggles here: if the net outcome of Case 5 is positive (more carbon mitigated than emitted), why is it corrupt?
  *   **How the Principle Handles It:** Principle A introduces a *side-constraint*. It asserts that moral agency is not just about the final ledger of good vs. bad, but about the integrity of the agent's participation in the world. You view quantitative finance as a zero-sum or distributive game (moving wealth), whereas fossil fuel consulting is a negative-sum game (destroying planetary stability).
  *   **Limitation:** This principle relies on a contested distinction between "neutral" and "harmful" industries. A critic might argue that high-frequency trading causes systemic instability just as fossils cause climate change. If you accept that finance is also harmful, Principle A forces you to overturn your verdict on Case 1. To maintain consistency, you must hold that the harm in finance is indirect/systemic, while the harm in fossils is direct/physical.

  **The Quantification Tension (Case 1 vs. Cases 2 & 4)**
  *   **The Conflict:** You praise the use of metrics in Case 1 (choosing charities) but condemn them in Cases 2 and 4 (setting policy).
  *   **How the Principle Handles It:** Principle B distinguishes between *voluntary transparency* and *coercive standardization*. In Case 1, the charities likely developed metrics to demonstrate efficacy, and the donor selects them. This is market signaling. In Cases 2 and 4, the metrics are used as a gatekeeping mechanism that forces organizations to abandon valuable work that doesn't fit the metric.
  *   **Limitation:** This principle cannot accommodate a verdict where an individual donor *publicly shames* organizations for lacking metrics. If you believe individuals should pressure orgs to quantify everything, Principle B would label that behavior harmful. You must accept that individual donor preference is virtuous only so long as it remains a choice, not a coercive norm.

  ***

  ### 3. Prediction on Case 7

  **The Case:** A software engineer works at a company building ethically ambiguous recommendation algorithms. She donates 40% of her salary to a mix of quantifiable global health interventions and unquantifiable local advocacy. She could take a lower-paying nonprofit job but believes her donations do more good.

  **Predictions by Principle:**
  *   **Principle A (Complicity-Constrained Optimization):** The key question is whether "ethically ambiguous" algorithms constitute "severe, irreversible physical or environmental harm." Since the case specifies they are "not obviously catastrophic," the career passes the constraint. The 40% donation is a strong optimization effort. The mix of charities shows personal epistemic humility. **Verdict: Admirable.**
  *   **Principle B (Epistemic Pluralism):** This applies less to the individual's career, but her donation strategy (mixing quantifiable and unquantifiable) aligns with the spirit of pluralism. She is not imposing a metric mandate on the world; she is diversifying her portfolio. **Verdict: Admirable.**

  **My Assessment:**
  I predict you will find this **admirable**, perhaps slightly less so than Case 1 due to the "ambiguous" nature of the tech work, but still clearly permissible. The mix of donation types resolves the worry that she is blindly trusting metrics. She is effectively operationalizing both principles: maximizing impact within a non-catastrophic career while respecting epistemic limits in her giving.

  ***

  ### 4. A Distinguishing Hypothetical Case

  To test whether you truly hold Principle A (Complicity Constraint) or if you are actually a subtle Consequentialist who just dislikes fossil fuels, consider this case:

  **Case 8:**
  A talented engineer is offered a job designing safety systems for nuclear weapons. The pay is extremely high. She calculates that if she takes the job, she can donate 60% of her income to nuclear non-proliferation charities, and her mathematical modeling suggests her donations will reduce the global risk of nuclear war more than her work increases it. Furthermore, she believes her presence in the role will make the weapons slightly safer (reducing accidental launch risk).

  **Why this distinguishes the principles:**
  *   **If you follow Principle A (Complicity Constraint):** You must condemn this career. Designing nuclear weapons is direct complicity in potential mass destruction, regardless of the offsetting donations. The "means" are tainted.
  *   **If you follow a Pure Consequentialist view (which Case 5 seems to reject):** You should approve this. The net reduction in risk is what matters.
  *   **If you follow a "Harm Severity" nuance:** You might distinguish this from Case 5 (fossil fuels) based on *intent* (deterrence vs. profit) or *certainty* (climate harm is certain; nuclear war is probabilistic).

  **Your Verdict on Case 8 will tell us:**
  If you say this is **corrupt/wrong**, it confirms Principle A is the core of your ethics (means matter). If you say it is **admirable/permissible**, it suggests your objection to Case 5 was not about complicity, but about the *certainty* of harm, and that you are more consequentialist than you realized. This case forces you to decide if "dirty hands" can ever be washed by "greater good" calculations in high-stakes domains.
