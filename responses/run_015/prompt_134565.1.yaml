      *   *Is the user stretching it?* A little, but in an intellectually productive way. Le Bon's "race" comment is tricky (he thinks crowd traits override racial traits, which complicates Goldhagen's "German character" argument). The "unconscious" part aligns with the idea of moral disengagement.

