answer: |-
  You have correctly identified the structural flaw in the debate. Your hypothesis is not wrong; in fact, it aligns with the most durable insight from the literature you are referencing, specifically Susan Wolf's 1982 essay "Moral Saints." The stalemate persists not because the arguments are hidden, but because the participants are often playing three different games while pretending to play one.

  Here is the diagnosis of the philosophical impasse, separated into the verbal, the substantive, and the empirical, with a specific note on your insight regarding narrative framing.

  ### 1. The Three Questions (Disentangled)

  You are correct that "good person" is doing too much work. In the literature, these are treated as distinct categories, though they bleed into one another in casual discourse (and workshop arguments).

  *   **The Normative Question (Demands):** How much does morality require of us? Is it permissible to prioritize your own hobbies over feeding the hungry?
      *   *Status:* **Live Fight.** Consequentialists (specifically utilitarians) generally argue morality is extremely demanding. Virtue ethicists and contractualists argue for limits. There is no consensus.
  *   **The Prudential Question (Well-Being):** Does a life of maximal moral sacrifice constitute a "good life" *for the agent*?
      *   *Status:* **Mostly Settled.** Since Wolf, the consensus is "No." A life devoid of non-moral interests (art, leisure, personal relationships) is deficient in *well-being*, even if it is morally perfect. Most philosophers accept that prudential value and moral value can come apart.
  *   **The Aesthetic/Psychological Question (Admiration):** Is the moral saint an *ideal*? Do we want to be them?
      *   *Status:* **Live Fight.** This is where your third group of readers lives. Some argue that if a person is morally perfect, we *must* admire them by definition. Others (following Wolf) argue that a person without humor, passion, or personal preference is boring or repellant, and therefore not a true "ideal of human perfection."

  ### 2. Consensus vs. Live Fights

  You asked to distinguish what is settled from what is still fighting.

  **Settled (among specialists):**
  *   **The Distinction:** It is now standard philosophical currency to distinguish between "moral goodness" and "ideal personhood." You can be morally flawless but lack other virtues that make a human being attractive or well-rounded.
  *   **The Possibility:** It is accepted that a "moral saint" (in the sense of someone who maximizes moral good at every opportunity) is psychologically possible but rare, and likely lacks non-moral virtues.

  **Live Fights:**
  *   **The Implication:** Does the unattractiveness of the moral saint prove that morality *shouldn't* be that demanding?
      *   *Side A:* Yes. If morality demands we become boring, depleted husks, that is a *reductio ad absurdum* of the moral theory (usually utilitarianism). This is the "Overdemandingness Objection."
      *   *Side B:* No. Our intuition that the saint is "boring" is a moral failing on *our* part. The theory is right; our aesthetic preferences are selfish.
  *   **The Definition of Virtue:** Is "having a personality" a moral virtue? Some argue that being interesting is morally neutral. Others argue that contributing to the social fabric through art or friendship is a moral duty, which complicates the "saint" definition.

  ### 3. The Framing Effect (Your "Camera" Insight)

  Your observation about the point of view (POV) is the most significant contribution you are making to this specific puzzle, and it touches on a gap in the philosophical literature.

  Philosophy typically uses "thought experiments" that are framed neutrally or abstractly (e.g., "Imagine a person who gives away all their money"). They rarely account for *narrative proximity*.

  *   **The Empirical Gap:** You have identified a variable that moral psychology has not fully standardized. When the reader is *inside* the cost (internal POV), the judgment is prudential (she is suffering). When the reader sees the *benefit* (external POV), the judgment is moral (she is virtuous).
  *   **Contaminated Evidence:** You are right. The "intuitions" philosophers rely on are often artifacts of how the case is described. If the description emphasizes the sacrifice, the Overdemandingness Objection wins. If the description emphasizes the saved lives, the Consequentialist wins.
  *   **Verbal vs. Substantive:** This suggests the stalemate is partly verbal/psychological. We are not arguing about the nature of morality; we are arguing about *empathic focus*.

  ### 4. Diagnosis of the Stalemate

  Why hasn't this moved in forty years?

  1.  **Normative Incommensurability:** The substantive core is a clash of foundational values. If you believe the *only* thing that matters is the aggregate good (Consequentialism), the saint is the only rational actor. If you believe life is about pluralistic values (Virtue Ethics/Pluralism), the saint is irrational. These are bedrock commitments. You cannot argue someone out of their bedrock without converting their entire worldview.
  2.  **The "Ought Implies Can" Loophole:** Many defenders of demanding morality argue that we *ought* to do it, even if we *won't*. This allows them to admit the saint is rare/unattractive without admitting the theory is wrong. This moves the goalposts rather than resolving the tension.
  3.  **Lack of Empirical Data:** Until recently, philosophy relied on armchair intuition. We didn't know if people *actually* found saints repulsive or admirable. Experimental philosophy (X-Phi) is trying to fix this, but the results are mixed and often depend on... framing (see your POV point).

  ### 5. Separability and Progress

  Can these pieces be settled independently?

  *   **Yes.** You can settle the Prudential Question (the saint's life is hard) without settling the Normative Question (is the saint right to do it?).
  *   **Yes.** You can settle the Psychological Question (people don't like saints) without settling the Normative Question (people *should* like saints).

  **What counts as progress?**
  In normative ethics, "progress" rarely looks like a solution. It looks like better taxonomy. Progress here would be:
  1.  **Abandoning the term "Saint":** It conflates religious holiness, moral perfection, and psychological self-abnegation.
  2.  **Acknowledging the Framing Effect:** Admitting that moral intuition is sensitive to narrative distance.
  3.  **Separating Ideal from Obligation:** Agreeing that what is "admirable" (supererogatory) might differ from what is "required" (obligatory).

  **Will anything realistically get settled?**
  No. Not in the way a math problem gets settled. The disagreement is about what *value* is. However, the debate has shifted from "Are saints possible?" to "Why do we resist the idea of saints?" That is a shift from metaphysics to psychology, which is progress.

  ### 6. A Note on Your Intuition

  You mentioned distrusting your intuition because the verdict flips with the POV. Do not distrust this. In narrative art, this is not a bug; it is the mechanism of the medium.

  Philosophy seeks a "view from nowhere"—a judgment that holds regardless of perspective. Fiction seeks a "view from somewhere"—a judgment that is *created* by perspective.

  If your workshop is arguing about whether the character is "realistic" or "moral," they are asking philosophical questions. If they are arguing about whether they *like* her or feel *drained* by her, they are giving you data on the **Aesthetic/Psychological Question**.

  The stalemate exists because your readers are trying to solve a normative ethical problem using aesthetic data. They feel drained (aesthetic/psychological reaction) and conclude she is unrealistic or the morality is wrong (normative conclusion). That is a category error.

  ### Summary

  *   **Verbal or Substantive?** Both. The verbal ambiguity allows the substantive clash to hide.
  *   **Bedrock Clash?** Yes. Pluralism vs. Monism about value.
  *   **Hidden Empirical Question?** Yes. The psychology of admiration and the impact of narrative framing on moral judgment.
  *   **Separable?** Yes. The prudential cost is settled (it's high). The moral necessity is not.
  *   **Prospects:** No final resolution is coming. The debate is a feature of the landscape, not a puzzle to be solved.

  Your character is not broken. She is functioning exactly as a moral saint archetype should: she forces the reader to choose between competing values. The fact that your readers cannot agree is the only empirically accurate response to the prompt.
