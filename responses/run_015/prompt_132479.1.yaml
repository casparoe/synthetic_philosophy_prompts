answer: |-
  # Desiderata for an Account of the Badness of Human Extinction

  An adequate philosophical account of the badness of human extinction must explain why the end of the species constitutes a moral catastrophe that exceeds the sum of individual deaths. In scenarios of painless, instantaneous, and unknown extinction, no suffering occurs, and no victim experiences deprivation. Yet, the intuition persists that such an event is uniquely terrible. The following desiderata specify the conditions any theory must meet to capture this intuition without collapsing into logical contradiction or sentimental projection.

  ## 1. The Phenomena It Must Cover

  The account must explain three specific intuitions that arise in extinction scenarios, distinguishing them from ordinary mortality.

  **(a) The Unwitting Victim Intuition**
  *   **The Phenomenon:** Present people seem to be wronged or harmed by extinction even if they never experience the end.
  *   **Motivating Case:** *The Silent Comet.* Imagine a comet destroys Earth instantly. No one feels pain; no one anticipates it. Yet, we judge this as worse than a scenario where the comet misses and humanity continues for a million years.
  *   **The Desideratum:** The account must explain how a harm or wrong can attach to agents who lack epistemic access to the event. It cannot rely solely on frustrated expectations (since there are none) or experienced suffering. It must identify a structural damage to the lives of the last generation that distinguishes their death from the death of individuals in a continuing society.

  **(b) The Non-Identity Gap**
  *   **The Phenomenon:** Potential future people seem to be "harmed" by never existing, despite the logical impossibility of harming non-existents.
  *   **Motivating Case:** *The Sterile Last Generation.* If the last generation chooses not to reproduce, no specific future individuals are deprived of life (because those specific individuals would never exist regardless). Standard welfare ethics suggests no one is worse off. Yet, the permanent end of humanity feels like a loss comparable to harming someone.
  *   **The Desideratum:** The account must navigate the Non-Identity Problem. It must explain the badness of preventing future existence without asserting that non-existent entities have rights or welfare interests that are violated. It must articulate a value that is lost without a specific subject to bear the loss.

  **(c) The Futility of Long-Term Projects**
  *   **The Phenomenon:** Scientific, artistic, or political projects aimed at the long term suffer a distinctive damage if humanity ends.
  *   **Motivating Case:** *The Century Tree.* A community plants trees intended to provide shade for their great-grandchildren. If extinction occurs tomorrow, the planting seems futile. If the community continues, the planting is virtuous. The physical act is identical; the value differs based on the future.
  *   **The Desideratum:** The account must explain why the value of present actions is contingent on future reception. It must distinguish this from mere frustration of desire. The badness must lie in the *objective* thwarting of the project's telos, not just the subjective disappointment of the planters.

  ## 2. The Distinctions It Must Respect

  To avoid category errors, the account must maintain specific conceptual boundaries.

  **(i) Harm to Existing vs. Potential vs. Impersonal Goods**
  *   **The Distinction:** We must distinguish between damaging the welfare of the living, preventing the existence of the potential, and diminishing impersonal value (e.g., beauty, knowledge) that exists independently of specific agents.
  *   **Motivating Consideration:** Conflating these leads to the "Non-Identity" error (claiming non-existents are harmed) or the "Mere Addition" paradox. An account must specify whether extinction is bad because it hurts *us*, hurts *them*, or hurts the *universe*.

  **(ii) Human Specificity vs. Consciousness Continuity**
  *   **The Distinction:** Is the badness of extinction tied specifically to *Homo sapiens*, or to the continuation of *conscious valuers* generally?
  *   **Motivating Consideration:** *The Alien Successor.* If humans go extinct but are immediately replaced by an equally conscious, valuing alien species, is the catastrophe averted? If the account claims extinction is bad only because consciousness ends, it must treat human extinction and alien replacement similarly. If it claims human extinction is uniquely bad, it must justify anthropocentrism without speciesism.

  **(iii) Retrospective Devaluation vs. Prospective Undermining**
  *   **The Distinction:** Does extinction make past achievements *less valuable* than they were (retrospective), or does it merely remove the reason to pursue *future* achievements (prospective)?
  *   **Motivating Consideration:** *The Completed Symphony.* If humanity ends, is Beethoven's 9th Symphony less valuable today than it was yesterday? Or does it retain its value, but no new symphonies will be written?
  *   **Joint Unsatisfiability Flag:** There is a significant tension between maintaining the claim that **(1) dead people cannot be harmed** and **(2) present agents suffer a present wrong due to future extinction.**
      *   If the wrong is located in the present (to satisfy 2), it must depend on a future that will not exist.
      *   If the future does not exist, the "wrong" looks like a relational property that lacks a relatum.
      *   If we claim the past loses value (to explain the wrong), we risk violating (1) by implying the dead are worse off than they were when alive.
      *   *Verdict:* An account may have to sacrifice the intuition that the *past* is devalued to preserve the logic that the *dead* are not harmed. Accepting that past value is immutable forces the badness of extinction to be entirely prospective (about what *won't* happen), which weakens the intuition that the *current* generation is wronged (since they still get their lives).

  ## 3. The Consistency Conditions

  The account must cohere with broader metaphysical and ethical commitments.

  **(a) The Procreation Asymmetry**
  *   **Condition:** The account must explain why we are not morally required to create happy people (procreation is optional), but we are gravely wrong to ensure no happy people ever exist (extinction is forbidden).
  *   **Constraint:** It cannot simply maximize total utility, or else it would mandate maximal population growth. It must find a middle ground where preventing existence is worse than failing to create existence.

  **(b) The Impossibility of Posthumous Harm**
  *   **Condition:** The account should not rely on the metaphysical claim that the dead can suffer or be harmed after cessation.
  *   **Constraint:** If the badness of extinction relies on "wronging our ancestors" by ending their lineage, it must explain how this wrongness exists without affecting the ancestors' welfare. It must be a wrong of *memory* or *legacy*, not of *experience*.

  **(c) Cosmological and Biological Finality**
  *   **Condition:** The account must function even if human extinction is irreversible and no non-human successors are assured.
  *   **Constraint:** It cannot rely on "hope" that AI or evolution will fill the gap. The badness must be intrinsic to the loss of *human* value, even if the universe continues devoid of consciousness.

  ## 4. Negotiable versus Non-Negotiable Requirements

  **Non-Negotiable (Shared by Serious Accounts):**
  *   **Explanation of Painless Extinction:** Must explain why painless ending is worse than painful continuation (in some metrics) or why painless ending is a catastrophe despite no suffering.
  *   **Logical Coherence:** Must not assert that non-existents have welfare interests.
  *   **Future-Dependency:** Must acknowledge that the value of the present is structurally linked to the existence of the future.

  **Negotiable (Camp-Dependent):**
  *   **Impersonal Value:** *Platonists* may argue value exists independently of valuers (e.g., truth is good even if no one knows it). *Humanists* argue value requires a valuer. This determines if extinction is bad because value-bearers vanish, or because objective values go uninstantiated.
  *   **Successor Neutrality:** *Cosmopolitans* argue any conscious successor suffices. *Humanists* argue human continuity is uniquely required.
  *   **Agent-Relativity:** *Contractualists* may view extinction as a violation of duties between generations. *Consequentialists* view it as a loss of total good.

  ## 5. Scoring Samuel Scheffler's Dependency View

  Samuel Scheffler's "Afterlife Conjecture" posits that the value we assign to our present activities depends on the belief that humanity will survive after us. We do not value things merely because we enjoy them, but because we imagine them contributing to an ongoing human story.

  **Score Against Desiderata:**

  *   **Phenomena (a) Unwitting Victim:** **Pass.** Scheffler explains this structurally. Even if the last generation doesn't know extinction is coming, their activities *in fact* lose the background condition (a future) that grounds their value. The wrong is not experienced, but the value is objectively undermined.
  *   **Phenomena (b) Non-Identity:** **Fail/Partial.** Scheffler's view is grounded in the *psychology of the living*. It explains why *we* care about the future, but it struggles to explain why the *non-existence of future people* is intrinsically bad independent of our current valuation. It risks making the badness of extinction contingent on us caring about it, rather than the future people mattering in themselves.
  *   **Phenomena (c) Long-Term Projects:** **Pass.** This is the core of Scheffler's view. Projects become futile without a future audience or beneficiary.
  *   **Distinctions (i) Harm Types:** **Pass.** It distinguishes harm to the living (loss of meaning) from harm to the dead (none).
  *   **Distinctions (ii) Human vs. Conscious:** **Fail (on Neutrality).** Scheffler emphasizes the *human* afterlife. He suggests that if aliens replaced us, our specific human projects might lose their point. This rejects Successor Neutrality.
  *   **Consistency (a) Asymmetry:** **Pass.** It explains why we don't need to create people (our projects don't require *specific* people) but we need *some* people (our projects require *a* future).
  *   **Consistency (b) Posthumous Harm:** **Pass.** It locates the damage in the *present* valuation, not the past welfare.

  **Addressing Successor Neutrality:**
  Scheffler's account suggests we can reject Successor Neutrality without collapsing the distinction between extinction and ordinary death. Ordinary death allows for *human* successors who inherit our values. Extinction ends the *human* chain. If aliens succeed us, Scheffler argues our specific "human" values (art, politics, specific scientific inquiries) might not be intelligible or valuable to them. Thus, the badness of extinction is tied to the loss of the specific *form of life* that generates value, not just consciousness itself. This preserves the distinction: ordinary death is a transfer of value within the form of life; extinction is the end of the form of life.

  **Addressing the Archival Paradox:**
  Scheffler's view resolves the Archival Paradox by favoring **Prospective Undermining** over Retrospective Devaluation.
  *   *The Paradox:* Does the absence of a future audience make past achievements less valuable?
  *   *Scheffler's Resolution:* The value of the achievement was always dependent on the expectation of a future. If the future vanishes, it reveals that the *confidence* in the value was misplaced, but it does not necessarily erase the value that *was* realized. However, it destroys the *reason* to value it going forward.
  *   *Implication:* The badness of extinction is not that Beethoven's music becomes "bad," but that the *practice* of music loses its point. This avoids the metaphysical difficulty of changing the past (retroactive devaluation) while still capturing the intuition of futility. The "Archival" value remains, but the "Living" value ceases.

  **Conclusion on Scheffler:**
  Scheffler's account scores highly on explaining the psychological and structural dependency of present value on the future. However, it struggles to ground the *objective* badness of extinction independent of human valuation. If value is entirely dependent on human valuers, and humans vanish, does the "badness" vanish with them? A robust account must explain why the universe is *worse* without us, not just why *we* think it is. Scheffler explains the latter convincingly; the former remains a negotiable point between humanist and impersonal value theories.
