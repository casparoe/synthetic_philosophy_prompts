  **Note to the Instructor:**

  Lines 1–12 establish the determinism/predictability distinction (unique evolution vs. epistemic limit). Stanza 3, line 5 ("They buy fixed moments under the Law") encodes the technical claim: exponential divergence means precision buys linear time, not proportionate foresight. Stanza 5 and the envoi clarify what survives the horizon: the shadowing lemma (computed orbits shadow true ones) and the invariant measure (climate vs. weather). Undergraduates might misread Stanza 4, line 4 ("escapes our Measure") as stochastic; it refers to assessment, not probability. The form's strict rotation mirrors the deterministic rules producing apparent wandering.
