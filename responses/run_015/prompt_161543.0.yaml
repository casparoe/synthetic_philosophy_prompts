  Yet shadows a true orbit in the **Form**.
  A ghost trajectory matches the **State**,
  Though lost to us across the expanse of **Time**.
  We lose the point, but keep the **Measure**,
  The climate remains bound by the **Law**.

  The Demon bows not to a broken **Law**,
  But to the grain of ruler and **Error**.
  We cannot integrate the full **Measure**,
  Though the attractor holds its rigid **Form**.
  Prediction fails within finite **Time**,
  But the equations fix the **State**.

  The **Law** holds fast despite the **Error**,
  The invariant **Measure** stabilizes the **Form**,
  Giving climate to the chaos of **Time** and **State**.

