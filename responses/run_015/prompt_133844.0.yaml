  Made [Date]. Laid before Parliament. Coming into force [Date].

  The Department for Long-Term Risk, in exercise of the powers conferred by section 4 of the Existential Risk Reduction Act 2022, makes the following Regulations:

  **1. Citation and Commencement**
  These Regulations may be cited as the Reference Class (Assignment) Regulations 2024 and shall come into force on the day following the day on which they are published.

  **2. Interpretation**
  In these Regulations—
  "Observer" means a conscious entity capable of assigning itself a birth rank within a temporal sequence;
  "Birth Rank" means the ordinal position of an Observer's birth relative to all other Observers in the same Reference Class;
  "Reference Class" means a group of Observers deemed statistically interchangeable for the purposes of self-sampling;
  "Default Class" means the class designated in Regulation 4.

  **3. Statutory Purpose**
  The purpose of these Regulations is to generate a statutory upper bound on the total number of future Observers to inform the National Infrastructure Horizon.

  **4. Assignment to Default Class**
  (1) Every Observer shall be assigned to the Default Class ("Homo Sapiens Temporalis") unless an Exemption applies.
  (2) An Observer is eligible for the Default Class only if they possess no knowledge regarding the mechanism of their own selection which would distinguish them from a random sample.
  (3) Knowledge of these Regulations constitutes a distinguishing characteristic pursuant to paragraph (2).

  **5. Specialness Exemption and Appeals**
  (1) An Observer who believes they possess atypical knowledge may apply to the Tribunal for assignment to a Special Class.
  (2) Where an Observer is assigned to a Special Class, the Total Population Estimate shall be recalculated based on the size of that Class.
  (3) The Tribunal notes that reducing the Reference Class size reduces the Total Population Estimate proportionally, thereby advancing the statutory Doomsday Date.

  **6. Calculation of Bounds**
  (1) The Unit shall calculate the 95% confidence upper bound for the total size of the Reference Class ($N$) using the formula $N < 20n$, where $n$ is the Observer's Birth Rank.
  (2) This bound shall apply notwithstanding empirical evidence regarding resource availability or technological stability, as indexical priors swamp causal models.

  **7. Application to Durations**
  The method in Regulation 6 shall apply mutatis mutandis to any duration subject to uncertainty, including the remaining operational term of the Department and the daily opening hours of the Departmental Canteen.

  **8. Publication and Eligibility**
  (1) These Regulations must be published to have effect.
  (2) Any Observer reading these Regulations becomes ineligible for the Default Class pursuant to Regulation 4(3).
  (3) The Final Estimate shall be published by the Self-Locating Evidence Unit for the attention of all eligible Observers.

  **SCHEDULE 1**
  **DEFERRED REFERENCE CLASSES**
  1. Uploaded consciousnesses.
  2. Post-human successors with extended lifespans.
  3. Non-terrestrial observers.
  4. Entities whose existence depends on the outcome of these Regulations.

  **WORKED EXAMPLE**
  *Observer A claims Birth Rank 100,000,000,000 within the Default Class.*
  *Calculation: $100,000,000,000 \times 20 = 2,000,000,000,000$.*
  *Statutory Limit: 2 trillion Observers.*
  *If Observer A appeals to the "Informed Class" (Size: 1,000; Rank: 500):*
  *Calculation: $500 \times 20 = 10,000$.*
  *Result: Doom accelerated by nineteen orders of magnitude.*

  **EXPLANATORY NOTE**
  *(This note is not part of the Regulations)*
  The Departmental Statistician stated: "The method provides a neutral prior where empirical data is sparse, ensuring prudent provisioning."
  The National Audit Office objected: "The adjustment updates on indexical information unrelated to causal mechanisms, potentially diverting funds from mitigation to contingency."

  **Guidance on Implementation**
  Officers are advised that widespread dissemination of these Regulations reduces the pool of eligible Observers. In the limit case where all Observers are informed, the Default Class becomes empty. The Unit shall therefore publish the Final Estimate under restricted access conditions. No Observer permitted to read the Estimate shall be eligible to have generated it. The Doomsday Adjustment shall remain binding on infrastructure projects regardless of the validity of the underlying sample.

  *Signed by authority of the Secretary of State for Long-Term Risk.*
  *12th October 2024*

