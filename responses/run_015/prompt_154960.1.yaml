      *   *Key Distinction:* Rigid stimulus-response vs. Representational flexibility. Can the agent represent the *goal* independently of the *procedure*?

  3.  **Evaluate the User's Cases against Potential Principles:**

      *   *Principle Candidate 1: Repetition.* (Too simple. Jazz musician repeats changes but isn't sphexish. OCD repeats checks but might not be sphexish.)
      *   *Principle Candidate 2: Failure to adapt to novelty.* (Better. Wasp fails. Sleepwalker fails. Flatmate partially adapts but fails to update the *plan*.)
