  Dear Dr. Ordinal, Our house burned down. We ran out barefoot in February. Compensation was denied because we chose to flee. Was this a welfare gain? — *Homeless in February*

  Dear Homeless, You exited the dwelling. Staying was technically feasible but rejected. To maintain coherence where data fails, we posit tastes changed between the fire and the street. Your choice is rationalizable under the weak axiom of revealed preference. The Bureau certifies this evacuation as a welfare gain.
