answer: |-
  **INTERNAL MEMORANDUM**

  **TO:** Vetting Commission Commissioners
  **FROM:** Consultant on Moral Responsibility and Institutional Design
  **SUBJECT:** Recommendation on Case P and General Adjudication Standard
  **DATE:** October 26, 2023

  **1. Recommendation and Disposition**

  Regarding Applicant P, I recommend a **Bar with Conditions**. P should be barred from public employment for a period of five years from the date of this decision. Upon expiration of this period, P shall be eligible for review for non-sensitive civil service positions that involve no authority over personnel, security, or resource allocation for vulnerable populations.

  This disposition balances the need for immediate institutional protection with the recognition that permanent exclusion may be disproportionate where duress was absent but ideological conviction remains unproven. The five-year window allows the new administration to stabilize without relying on personnel whose compliance history poses a risk, while leaving open a path for reintegration should P demonstrate alignment with new constitutional norms.

  **2. General Standard for Remaining Caseload**

  To meet our mandate of processing files within one hour, staff must apply the following operational definition of the statutory phrase "personally and substantially facilitated."

  **Standard:** An applicant facilitated core crimes if their official acts were a necessary link in the chain of events leading to rights violations, regardless of whether others could have performed the same act.

  **Procedure:**
  1.  **Identify the Act:** Did the applicant perform a specific task (e.g., signing, allocating, transporting) connected to a core crime (e.g., removal, killing)?
  2.  **Assess Duress:** Is there evidence of a credible threat of immediate harm (imprisonment, death, violence) to the applicant or family if they refused? Note: Loss of pension, demotion, or career stagnation does *not* count as duress under this statute.
  3.  **Determine Liability:** If the Act is confirmed and Duress is absent, the applicant is barred. Do not investigate the applicant's internal motives or beliefs. Do not investigate whether someone else would have done the job if the applicant had refused.

  This standard removes the need to psychoanalyze applicants. It focuses on the objective architecture of the harm: if you turned the key without a gun to your head, you are liable.

  **3. The Explanatory Pictures and Epistemic Limits**

  Our deliberations have stalled on two competing explanations for behavior like P's. The "Ordinary Men" picture suggests P was a reluctant cog trapped by situational pressure, role fragmentation, and career incentives. The "Willing Executioners" picture suggests P shared the regime's ideology and viewed the victims as legitimate targets. The file cannot settle this. P's transfer request suggests reluctance; his memorandum using "cleansing" language suggests conviction. The colleague's letter suggests conformity; the efficiency rating suggests commitment.

  This recommendation is deliberately insulated from that ambiguity. We are not in the business of judging souls, but of judging conduct within a public trust framework. Whether P was a reluctant clerk or a convinced ideologue, the material outcome of his labor was the same: the machinery of removal functioned. By making liability turn on the *act* of facilitation rather than the *motivation* behind it, we avoid the impossible task of distinguishing between the "quietly efficient" believer and the "quietly efficient" survivor. Both enabled the crime. Both lack the statutory excuse of duress. Therefore, both fall under the bar. We do not need to know what kind of person P is to know what kind of officer he was.

  **4. The Substitution Test**

  One commissioner has argued that because P was replaceable—had he refused, another officer would have signed the paperwork—he should not be barred. This is the "Substitution Test." I recommend we reject this test for vetting purposes, though it might matter for criminal sentencing.

  In a bureaucratic atrocity, replaceability is a feature of the system, not a bug of the individual's liability. The regime designed the paperwork chain specifically to ensure that no single conscience could halt the process. If we accept substitutability as an excuse, we effectively grant immunity to the most efficiently organized perpetrator systems. It would mean that the more diffuse the responsibility, the less accountable any individual becomes. This creates a perverse incentive structure for future authoritarianism: fragment the tasks so deeply that no one is "substantial."

  For vetting, the question is not "Did P change history?" but "Did P participate in harm without coercion?" The fact that the system could have found another willing hand does not cleanse the hand that was actually used.

  **5. Function of the Sanction: Backward vs. Forward-Looking**

  We must be honest about what this bar achieves. A backward-looking sanction asks: "What does P deserve for what he did?" A forward-looking sanction asks: "What risk does P pose to the future state?"

  This decision is primarily **forward-looking (70%)**, with a secondary backward-looking component (30%).

  The backward-looking element is satisfied by the finding of facilitation without duress. This affirms to survivors that the new state recognizes the work of the old regime as wrongful, not merely administratively necessary. It validates the moral reality that paperwork can be a weapon.

  However, the primary weight is forward-looking. Our statute bars from *public employment*, not liberty. This is a protective measure for the new administration. A person who complied with unlawful orders under moderate pressure (career loss rather than death) has demonstrated a willingness to prioritize institutional compliance over moral refusal. That trait is a risk factor in a fragile democracy. The five-year bar is not necessarily a permanent moral condemnation; it is a cooling-off period. It ensures that the immediate reconstruction of the state is handled by personnel whose recent history demonstrates alignment with the new constitutional order.

  **6. The Strongest Consideration on the Losing Side**

  The argument against this recommendation rests on **Institutional Capacity and Comparative Fairness**. This view holds that barring P undermines the state's ability to function. We face 1,200 cases; if we bar everyone who "substantially facilitated" without duress, we may disqualify a substantial share of the experienced civil service. The new state needs administrators who know how to move fuel and manage rations, even if they did so under the old regime. Furthermore, if we only process a fraction of files, barring P while leaving his peers (who did the same job) untouched creates a lottery of justice. It treats P unfairly not because he is innocent, but because he was caught.

  This consideration is weighty. A state cannot function on purity alone. If we purge too deeply, we collapse the administration we are trying to save. There is also a genuine moral cost in making P the scapegoat for a systemic crime shared by thousands.

  However, this argument must yield to the necessity of establishing a baseline norm. If we clear P to preserve capacity, we signal that administrative efficiency trumps moral boundaries in public service. We risk rebuilding the state on the same operational logic that enabled the crimes. The capacity constraint is real, but it cannot be solved by lowering the standard of accountability. It must be managed through training, recruitment, and the conditional review process outlined in the recommendation. We cannot sacrifice the legitimacy of the new regime to solve the staffing problems inherited from the old one.

  **7. Conclusion**

  We cannot know P's heart. We know his hands moved the machinery. In the absence of duress, that movement disqualifies him from immediate public trust. Adopt the standard above. Apply it consistently. Accept the cost to capacity as the price of a legitimate state.
