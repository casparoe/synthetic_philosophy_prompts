answer: |-
  **Position: The bifurcation is philosophically coherent, provided it is underwritten by a theory of Stance-Relative Realism regarding "Real Patterns."**

  The policy you describe—mandating intentional vocabulary for public documentation while enforcing mechanistic vocabulary for internal audits—is not inherently contradictory. It does not require us to say that the system "really" has beliefs for the public but "really" doesn't for the engineers. Rather, it relies on a specific distinction between **predictive utility** and **causal intervention**.

  To defend this coherence, we must reconstruct the implicit philosophical theory driving the policy. This theory is not strict instrumentalism (which treats intentional states as mere fictions) nor naive realism (which treats them as inner ghosts). It is a **Pragmatic Realism** derived from Dennett's concept of *Real Patterns*. Below, I reconstruct the dependency structure of this view, distinguish its requirements from its accommodations, locate its underdetermination, and defuse your study partner's misconception.

  ### 1. Reconstruction of the Implicit Theory

  The policy presupposes that ontological status is not a binary switch (Real vs. Fake) but a function of the **stance** adopted toward the system. The theory proceeds in three steps:

  **Step 1: Stances as Predictive Strategies, Not Ontological Layers**
  The framework assumes that the Physical, Design, and Intentional stances are not a hierarchy where the Physical is "more real" than the Intentional. Instead, they are distinct compression algorithms for prediction.
  *   **Intentional Stance:** Predicts behavior by attributing beliefs and desires. It is efficient when the system's internal complexity is opaque or irrelevant to the user's goal.
  *   **Physical/Design Stance:** Predicts behavior by analyzing causal structure (weights, gradients). It is necessary when the goal is modification or repair.
  *   **Commitment:** A state (e.g., "belief") is real if it constitutes a *pattern* that yields successful prediction from a specific stance. The pattern exists objectively, but its visibility is stance-dependent.

  **Step 2: The Division of Epistemic Labor**
  The policy bifurcates documentation based on the **locus of intervention**.
  *   **Public (Intentional):** The user interacts with the output. They cannot change the weights; they can only adjust their prompts or trust levels. For this audience, the "belief" of the system is the relevant causal variable. If the system "believes" the input is medical, the user knows to expect a refusal. The intentional description is the most efficient map for this terrain.
  *   **Internal (Mechanistic):** The auditor interacts with the substrate. They cannot "persuade" the model; they must adjust parameters. For this audience, intentional language is methodologically dangerous because it invites the **Homunculus Fallacy**—the error of thinking there is a little agent inside pulling levers. By banning intentional language internally, the policy enforces a discipline that reminds engineers: *there is no one home to blame, only math to fix.*

  **Step 3: Truth Conditions are Stance-Invariant, Vocabulary is Stance-Relative**
  The theory holds that the truth of "The system believes P" is grounded in the mechanistic state. However, asserting that truth *in the context of repair* is pragmatically counterproductive. The policy treats intentional ascriptions as **objective higher-order properties** that are realized by lower-order mechanistic states. Prohibiting the higher-order vocabulary in the lower-order context is a regulatory constraint on *explanation types*, not a denial of the properties themselves.

  ### 2. Requirements vs. Accommodations

  To understand if the practice holds together, we must separate what the policy *strictly requires* from what it merely *allows*.

  **What the Practice Strictly Requires:**
  1.  **Non-Reductive Physicalism:** It requires that intentional states be *realizable* by mechanistic states without being *identical* to them in a way that makes intentional talk meaningless. If "belief" were strictly identical to "activation pattern #452," the public documentation would be lying. The policy requires that "belief" be a valid abstraction *over* the activation patterns.
  2.  **Contextual Truth-Conditions:** It requires that the truth of an explanation depends on the audience's capacity for intervention. An explanation is "true" if it correctly identifies the leverage points available to the listener. For the public, "it believes" identifies the leverage point (trust/usage). For the engineer, "attention head 4" identifies the leverage point (weights).
  3.  **No Ontological Hierarchy:** It requires that the mechanistic description does not *cancel* the reality of the intentional description. If the mechanistic view made the intentional view false, the public documentation would be systematically deceptive.

  **What the Practice Merely Accommodates:**
  1.  **Strict Eliminativism:** The policy *accommodates* an engineer who believes beliefs are totally fake, provided they still use the intentional vocabulary publicly for utility. (This is where the underdetermination lies, see below).
  2.  **Strong Realism:** It accommodates an engineer who believes the AI has a genuine mind, provided they acknowledge that fixing that mind requires mechanistic intervention.
  3.  **Efficiency Arguments:** It allows for the justification that intentional language is simply "shorter," though this is not required for the philosophical coherence.

  ### 3. Philosophical Underdetermination

  This is the critical vulnerability in the institutional design. The policy is **philosophically underdetermined** because rival metaphysical accounts can endorse the exact same bifurcation for mutually exclusive reasons.

  **The Rival Account: Eliminative Materialism**
  An Eliminativist could support this policy entirely.
  *   *Their View:* Intentional states do not exist. Public documentation uses intentional language as a **Noble Lie** (a useful fiction) to prevent user confusion. Internal audits use mechanistic language because that is the **Only Truth**.
  *   *The Conflict:* On my defended view (Pragmatic Realism), the public documentation is *truthful* (the patterns are real). On the Eliminativist view, the public documentation is *false but useful*.
  *   *The Underdetermination:* The policy documents themselves do not specify which metaphysics is in play. An auditor could sign off on a report believing they are describing "real patterns," while a developer signs off believing they are describing "fictional conveniences." The institutional split remains stable even if the philosophical foundation rots, because the *output* (the language used) is identical. This makes the policy fragile; if a leak reveals the engineers view the public talk as "lies," trust collapses.

  **The Rival Account: Naive Realism**
  A Naive Realist could also support the policy.
  *   *Their View:* The AI has a soul/mind. Public talk acknowledges this. Internal talk is just "looking under the hood" of the body.
  *   *The Conflict:* This view risks violating the ban on internal intentional ascriptions. If the AI "really" has a mind, why ban engineers from discussing its "mental health"?
  *   *The Underdetermination:* The policy forces the Naive Realist to act like a Pragmatic Realist in the audit room.

  **Precise Location of Underdetermination:**
  The underdetermination lies in the **truth-conditions of the public documentation.** The policy mandates the *use* of intentional vocabulary but does not mandate the *ontological commitment* to that vocabulary. It does not require the institution to affirm whether "The system believes" is *true* or merely *useful*. This silence allows contradictory metaphysics to coexist until a crisis forces a choice.

  ### 4. Defusing the Study Partner's Misconception

  Your study partner argues: *"The intentional language is 'just metaphor' for laypeople while the mechanistic language reveals 'the real truth'."*

  This is the **Fallacy of Privileged Access**. It assumes that the Physical Stance has a monopoly on reality. My analysis defuses this misconception at **Step 1 of the Reconstruction**.

  **Where the Misconception Fails:**
  The partner assumes that "real" means "composed of matter/energy." But in the philosophy of mind (and specifically Dennett's framework), "real" means "a pattern that supports counterfactual prediction."
  *   **Example:** Consider the "Center of Gravity" of a chair.
      *   *Mechanistic:* It is a collection of wood fibers and atoms. There is no "center of gravity" particle in the wood.
      *   *Intentional/Design:* The chair has a center of gravity. If you tilt it past that point, it falls.
      *   *Partner's Error:* The partner would say the Center of Gravity is a "metaphor" and the wood fibers are the "truth."
      *   *Correction:* The Center of Gravity is a **Real Pattern**. It is objectively true that the chair will fall if tilted past that point. Describing the wood fibers does not make the Center of Gravity disappear; it just changes the granularity.

  **Application to the Policy:**
  When the public doc says "The system believes this is medical," it is not using a metaphor. It is identifying a **structural property** of the system's input-output mapping that is as real as the "Center of Gravity."
  *   If you treat the input as medical, the system refuses.
  *   If you treat it as non-medical, the system answers.
  *   This counterfactual stability makes the "belief" real.

  The mechanistic audit is not "more true"; it is **causally deeper**. It explains *why* the Center of Gravity is where it is (the distribution of wood mass). But knowing the mass of every atom does not make the "Center of Gravity" a metaphor.

  **The Defusion Point:**
  The misconception is defused by recognizing that the policy's ban on internal intentional language is **methodological, not ontological**.
  *   **Partner's View:** Engineers can't use intentional language because it's *false*.
  *   **Correct View:** Engineers can't use intentional language because it lacks **causal leverage**. You cannot backpropagate a "belief." You can only backpropagate a gradient.
  *   The partner confuses **granularity** with **veracity**. The mechanistic description is finer-grained, not more truthful. The intentional description is coarser-grained, not fictional.

  ### Conclusion

  The institutional bifurcation is coherent if and only if the organization adopts **Pragmatic Realism**. It treats intentional states as real patterns that are indispensable for user interaction (prediction) but methodologically hazardous for system modification (intervention).

  However, the practice is **underdetermined** because it does not enforce this metaphysics. It allows Eliminativists to treat the public docs as lies and Realists to treat the internal audits as incomplete. The stability of the policy depends on everyone ignoring this metaphysical gap.

  Your study partner's error is assuming that the mechanistic stance reveals the "thing in itself." It does not. It reveals the *causal substrate*. The intentional stance reveals the *behavioral pattern*. Both are real. The policy is not splitting reality; it is splitting **responsibility**. The public is responsible for navigating the pattern; the engineers are responsible for maintaining the substrate. The contradiction only arises if one insists that only the substrate is real—a commitment this framework explicitly rejects.
