answer: |-
  Good morning. Welcome to "Who Decides the Scale?"

  I noticed the invite had a typo. It spelled subsidiarity as "subsidiarty." I decided not to correct it. Honestly, "subsidiarty" feels more accurate to what happens in practice than the clean legal definition does. It suggests something partial, something unfinished. And that's where we should start.

  Look around this room. We have a split. On one side, I see colleagues who can recite Article 5 of the TEU without breathing. On the other, I see organizers from Swiss cantons and German Länder who are tired of hearing that Brussels or Berlin "knows best" about your local zoning, your schools, your infrastructure.

  Usually, in a room like this, the script is predictable. The scholars talk about legal competence, and the practitioners talk about administrative burden. We talk past each other. So I want to try something different. I want to talk about the one idea we usually miss because we're too busy fighting over who gets to hold the microphone.

  We tend to think subsidiarity is about proximity. The standard story is: closer is better. The local level is democratic; the central level is bureaucratic. Therefore, push power down until it stops feeling cold.

  But that's a cartoon. If subsidiarity were just about physical proximity, a small town would always be more democratic than a nation-state. We know that's not true. Local capture is real. Parochialism is real.

  The harder truth—the one I want us to wrestle with today—is that subsidiarity isn't about proximity. It's about reverse delegation.

  In the standard model, authority flows down. The sovereign grants power to the regions. But in the EU, and in the complex federalism we see in Switzerland and Germany, legitimacy actually flows up. The lower bodies don't just receive authority from the center; they actively generate the conditions that make the center's claims legitimate. Without the Länder, without the cantons, the center isn't just weak—it's nonexistent. It has no ground to stand on.

  Now, I know this creates tension. And I don't want to gloss over it.

  For my colleagues in EU law: we have to admit that subsidiarity is often used as a blame-shifting device. When a policy succeeds, Brussels takes the credit. When it fails, it's "poor implementation by the member states." Subsidiarity becomes a shield for the center, not a sword for the regions.

  And for the organizers here: I can't promise you that decentralization is automatically more democratic. I know the frustration. But look at Swiss fiscal equalization. Rich cantons subsidize poor ones. That breaks the usual "local autonomy" story. You can't claim total independence when your budget relies on a transfer system designed in Bern. Autonomy costs money, and someone else is writing the check.

  So, we can't treat the EU like a big nation-state that just needs to be trimmed back. And we can't treat the regions like isolated islands of purity.

  Here is the structural work this philosophy has to do. Because legitimacy flows upward from these agreements rather than downward from a unified sovereign people, the question isn't "Who has the power?" The question is "Who defines the scale at which the power becomes visible?"

  This is where competence-competence matters. It's not just legal jargon. It's the missing middle in regional policy. If the regions don't have the capacity to define the scale of the problem, the center will define it for them. And the center will always define the scale to fit its own tools.

  Let me try an analogy. I warn you, it might not work for everyone.

  Think of subsidiarity like a choir where the singers tune the conductor.

  In a normal orchestra, the conductor gives the A, and everyone adjusts. In this model, the singers hum the note first, and the conductor has to match their pitch to lead them. If the singers are out of tune, the conductor looks incompetent. But if the conductor tries to force a pitch the singers can't reach, the music stops.

  For the musicians in the room, you know that's physically awkward. You can't really tune the conductor. For the lawyers, you might hear the inversion of authority. But for everyone else, it might just sound like noise. That's fine. The point is the awkwardness. It feels wrong because it inverts the hierarchy we're used to. But that inversion is exactly where the legitimacy lives.

  If the center cannot hear the pitch set by the regions, it has no right to lead the song. But—and this is crucial—the regions also have to agree to sing the same song. You can't have a choir where half are singing opera and half are doing death metal, even if both are locally authentic.

  This is why I say reverse delegation. The regions delegate the legitimacy upward, conditionally. They allow the center to speak for them, but only if the center speaks in a voice the regions recognize.

  So, when we ask "Who Decides the Scale?", we aren't just asking about jurisdictional boundaries. We are asking about the machinery of legitimacy.

  To the lawyers: I want you to look beyond the text of the treaties. Look at where the political energy originates. If the regions are exhausted, the center is hollow.
  To the organizers: I want you to know that your fatigue is a structural signal, not just administrative burnout. When you say "Brussels doesn't get it," you aren't just complaining; you are identifying a legitimacy deficit.

  We are not here to solve subsidiarity today. If we were, we'd be here for a decade. We are here to acknowledge that "subsidiarty"—typo and all—is a messy, ongoing negotiation about who gets to decide what counts as local, and what counts as central.

  It's not about trimming the center. It's about ensuring the center doesn't float away from the ground that holds it up.

  I've talked for eight minutes. I'd much rather hear where this lands for you, where it misses, and what scale you think we should be working on next.

  Thank you.
