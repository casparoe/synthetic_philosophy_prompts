  5.  **Address the Argument from Marginal Cases (AMC):**
      *   Is it knockdown?
      *   **Answer:** It's a consistency check, not a standalone proof. It shows your *current* criteria are flawed. It doesn't tell you what the *right* criteria are. It forces you to either lower human status, raise animal status, or find a new criterion that includes all humans and no animals (very hard) or accepts some overlap.
