          *   **Vegetarianism:** If the cow has a right to life comparable to a human, yes, eating it is wrong. But does the cow have that right? Depends on the capacity threshold.

      *   *Point 5: Consequence 2 (Scalar/Additive Status).*
          *   **Verdict:** **Highly Controversial/Likely Wrong.** This is the second "slippery" move.
          *   **Why:** Most deontologists/rights theorists reject simple aggregation. Rights often act as "trumps" or side-constraints. You can't sacrifice one right-holder to save many lesser right-holders easily.
          *   **Utilitarian View:** Utilitarians *do* aggregate welfare, but they distinguish between *quality* of welfare, not just headcount.
          *   **Scalar Status:** Some philosophers argue status is scalar (more complex beings have *more* status), but moving from "scalar" to "100 pigs > 1 human" is a massive mathematical leap that ignores the *kind* of loss.

