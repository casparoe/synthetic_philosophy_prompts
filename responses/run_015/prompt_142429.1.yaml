answer: |-
  You have good instincts. Your suspicion that the podcast host makes two "slippery" moves is well-founded, and a philosopher working on moral status or animal ethics would likely raise their eyebrows at both. The argument you heard is a specific, somewhat aggressive version of utilitarian thinking that flattens a lot of nuanced philosophical distinctions into a single metric.

  Here is a breakdown of what holds up, what is a simplification that changes the conclusion, and what is likely wrong, followed by an assessment of whether the conclusions survive.

  ### 1. The Move from "Not Species" to "Neural Machinery"
  **Verdict: This is the first major leap.**

  The host is correct that "species membership" alone is not a moral argument. Almost no contemporary philosopher argues that having human DNA is, in itself, morally magical. That is indeed speciesism.

  However, the move to "neural machinery" (brain size, neuron count) as the *replacement* criterion is a category error. Philosophers generally argue that moral status tracks **capacities** or **interests**, not hardware.
  *   **The Distinction:** We care about brains because they produce things like consciousness, the ability to suffer, self-awareness, or the capacity to form future plans. The neuron count is just the physical substrate.
  *   **The Problem:** If the criterion is "number of neurons," then a calculator with enough transistors might outrank a dog, or a whale might outrank a human. But most people's moral intuition isn't about processing power; it's about *what the being can experience*.
  *   **The Empirical Claim:** You are right to be wary of the whale/elephant claim. While they have larger brains and arguably more neurons in certain areas, the *structure* and *connectivity* (especially in the prefrontal cortex) differ significantly from humans. But even if we grant the host's empirical claim—that some animals have "more brain" than humans—the philosophical conclusion doesn't follow. Having more neurons doesn't automatically mean you have a stronger claim to life; it might just mean you have a louder hum.

  **Expert Consensus:** Most ethicists would say the criterion should be something like "sentience" (can it suffer?) or "personhood" (does it have a concept of its future?). If the criterion is sentience, pigs and humans are closer. If the criterion is personhood (complex agency), humans and pigs are far apart. The podcast host skips this distinction and goes straight to "brain hardware," which is a reductionist shortcut.

  ### 2. The Move from "Scalar Status" to "Additive Math"
  **Verdict: This is the second major leap, and it's highly controversial.**

  The host argues that if moral status is scalar (you can have more or less of it), then it must be additive (100 pigs > 1 human). This is a specific utilitarian calculation that many philosophers reject.
  *   **The Aggregation Problem:** Even if a pig has *some* moral status and a human has *more*, it does not logically follow that you can simply sum the pigs to outweigh the human. Many ethical frameworks (especially rights-based ones) view moral status as creating "side-constraints." You cannot violate one person's right to life even to save two others.
  *   **Incommensurability:** A human's loss might be of a different *kind* than a pig's loss, not just a different *amount*. If a human has a complex narrative sense of self, their death frustrates a lifetime of plans. A pig's death frustrates immediate desires. You can't necessarily trade 100 "immediate desires" for 1 "lifetime of plans" using simple multiplication.

  **Expert Consensus:** The claim that "100 pigs > 1 human" is not a necessary consequence of granting animals moral status. It is a consequence of accepting a specific, unmodified form of utilitarianism. Many animal ethicists grant animals significant rights without accepting this additive math.

  ### 3. The Argument from Marginal Cases (AMC)
  **Verdict: It is a powerful consistency check, but not a "knockdown" dilemma.**

  Your friend presented this as: "Either you strip disabled humans of rights, or you give rights to pigs."
  *   **What it does:** It successfully destroys the argument that "Humans have rights because they are rational." If you say rationality is the key, you logically exclude human infants and the severely cognitively disabled. Since we (rightly) refuse to exclude those humans, "rationality" cannot be the *only* key.
  *   **What it doesn't do:** It doesn't prove that pigs and disabled humans must have the *exact same* rights. It only proves that whatever criterion you pick must cover both.
  *   **The "Unthinkable Horn":** The host presents taking rights away from disabled humans as the unthinkable horn. But there is a third option: You ground the rights of disabled humans in something other than their individual capacity.

  **Expert Consensus:** The AMC is standard fare in animal ethics. It forces you to refine your theory. It is not usually considered a "game over" for meat-eating, but rather a demand for a more sophisticated justification than "humans are smarter."

  ### 4. The Threshold View and "Speciesism with Extra Steps"
  **Verdict: Your friend is too quick to dismiss the threshold view.**

  You mentioned reaching for a threshold view: anything above capacity X gets full status; below gets partial. Your friend called this "speciesism with extra steps."
  *   **Is it Speciesism?** Not necessarily. Speciesism is privileging a biological category (Homo sapiens) without moral justification. A threshold based on *capacity* (e.g., "ability to understand moral duties" or "complex autobiographical memory") is not speciesism, even if it turns out that only humans meet it.
  *   **The Risk:** The risk is setting the threshold *conveniently* low to include all humans and *conveniently* high to exclude all animals. If the threshold is "can recognize oneself in a mirror," some humans fail and some animals pass. If the threshold is "can vote," all animals fail but some humans fail too.
  *   **The Strong Version:** A philosophically robust threshold view argues that there is a qualitative shift in moral status when a being becomes a "moral agent" or a "person." This grants full rights to humans (including those who temporarily or permanently lack the capacity, see below) while granting partial rights (e.g., right not to suffer, but maybe not right to life) to animals. This is not speciesism; it is "personism," which is a debated but coherent position.

  ### 5. The Strongest Defense: Protecting Disabled Humans Without Vegetarianism
  You asked for the strongest form of the argument that lets you treat severely cognitively disabled humans as full equals without becoming a vegetarian. There are two main approaches that philosophers use here, neither of which is a strawman.

  **A. The "Human Kind" Argument**
  This view argues that moral status attaches to the *kind* of being you are, not just your current individual capacity.
  *   **The Logic:** A human infant or a human with profound dementia is a member of a kind (the human community) that is characteristically rational and moral. They are owed protection because of their relationship to that kind, even if they individually lack the traits.
  *   **The Animal Contrast:** A pig is a member of a kind that is not characteristically rational. Therefore, the pig does not get the "full protection" bonus, even if its current intelligence matches the disabled human.
  *   **Why it works:** It explains why we protect the disabled human (solidarity, kind-membership) without forcing us to elevate the pig to human status. It accepts that we have special obligations to our own kind.

  **B. The Relational/Social Contract Argument**
  This view argues that moral status arises from our relationships and social agreements, not intrinsic properties.
  *   **The Logic:** We live in a human society. We have agreed to protect all members of our community, including the vulnerable, because that is what makes us a moral community. We do not have this social contract with cows.
  *   **The Animal Contrast:** We still owe animals duties (not to torture them, to minimize suffering), but those duties are based on compassion or stewardship, not on "equal rights."
  *   **Why it works:** It grounds the protection of disabled humans in human love and social structure, which is intuitively strong, while allowing for the use of animals provided we treat them humanely.

  ### Do the Podcast's Consequences Survive?
  If we repair the dodgy bits (replacing "neuron count" with "capacities," and rejecting simple "additive math"), do the two consequences hold?

  1.  **"Killing a cow is morally on a par with killing a comparable human."**
      *   **Repaired Verdict:** **No.** If the criterion is "capacity for a future" or "personhood," the cow is not comparable to a typical human. If the criterion is "sentience," the cow is comparable to a human *infant*. This leads to a difficult conclusion: killing a cow might be morally similar to killing a human infant. Many philosophers *do* accept this (and thus argue against infanticide and animal killing), but many others use the "Human Kind" argument to say the infant has a potentiality or social standing the cow lacks. So, vegetarianism is not "forced" by logic alone; it depends on which repaired theory you choose.

  2.  **"Saving one human at the cost of a hundred pigs is straightforwardly wrong."**
      *   **Repaired Verdict:** **Definitely No.** Once you reject the idea that moral status is just a number that adds up, this conclusion collapses. Most ethical systems allow for the prioritization of humans in life-or-death triage situations, even if animals have moral status. The "100 pigs > 1 human" math is the weakest part of the podcast's argument.

  ### Summary
  The podcast host took a valid starting point (species isn't everything) and drove it to a radical conclusion using reductionist shortcuts (neurons = value) and controversial math (aggregation).

  *   **What to trust:** The idea that we need a consistent reason for why humans matter that doesn't accidentally exclude disabled humans.
  *   **What to doubt:** The idea that brain size determines moral worth, and the idea that moral worth is a simple numbers game.
  *   **The Middle Ground:** You can consistently believe that disabled humans deserve full protection (based on kind-membership or social relations) and that animals deserve significant protection (based on sentience), without believing that a pig's life is mathematically equivalent to a human's.

  You aren't being "reasoned into" a corner so much as you are being presented with one specific, aggressive ethical framework (hard utilitarianism) as if it were the only logical option. It isn't.
