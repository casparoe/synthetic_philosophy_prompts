      *   **Answer:** Not necessarily. A threshold based on *capacity* (e.g., "personhood") is distinct from speciesism. However, if the threshold is set *conveniently* to include all humans and exclude all animals, it looks suspicious.
      *   **The "Human Kind" Defense:** Some argue that being a member of a kind that is typically rational grants status, even if an individual lacks it (due to age/injury). This protects the disabled human without granting status to the pig (who is not of a rational kind). This is a strong philosophical position (e.g., Mary Midgley, certain Kantians), though controversial among animal ethicists.

  7.  **Synthesize the "Strongest Form" of the Counter-Argument:**
