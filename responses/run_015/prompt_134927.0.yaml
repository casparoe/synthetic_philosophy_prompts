  **A Legacy of Prudence: Thirty Years of the Office of Precautionary Review**
  **By Marlene Duff, Founding Chair**

  This month marks the thirtieth anniversary of the Coldspring Office of Precautionary Review. In 1995, our inaugural act was to deny the Water Department's proposal to reline the town's wooden mains with a novel polymer composite. The decision rested on a single peer-reviewed study indicating hepatic irregularities in rats exposed to high concentrations of the curing agent. At the time, proponents argued the polymer was cheaper and more durable than wood. Today, critics point to the polymer's widespread adoption elsewhere and the increasing frequency of our own main failures. They suggest the Office was mistaken. We maintain that the Office was necessary then, and remains necessary now.

  The core mandate of the Office is to manage uncertainty. When a new activity is proposed, the burden of proof rests entirely on the proponent to demonstrate the absence of significant harm. In 1995, the Water Department could not prove the polymer was safe for Coldspring's specific hydrology. They still cannot. The fact that other municipalities have used the material for three decades without reported incident does not constitute evidence of safety. Absence of evidence is not evidence of absence. Furthermore, a latency period of thirty years is entirely consistent with the profile of slow-acting, irreversible endocrine disruptors. The lack of observed harm elsewhere is exactly what we would expect to see if the harm were yet to manifest.

  Recent failures in our wooden mains have led some to argue that the risk of inaction now outweighs the risk of action. This framing misunderstands the Office's methodology. We do not weigh risks against benefits. To do so would require assigning arbitrary values to human health outcomes. Instead, we compare uncertainties. The failure rate of wooden mains is a known variable; it can be managed through patching and pressure regulation. The failure mode of the polymer is an unknown variable. Where both courses of action carry a threat, the Office applies the Status Quo Rule: we continue whatever was happening before the proposal was filed.

  This creates a stable regulatory environment. Some observers have noted that this rule functions as a one-way ratchet, preventing the repeal of precautions even when conditions change. This is accurate. To lift a ban is to propose a new activity—namely, the reintroduction of a substance into the water supply. As a new activity, it requires a fresh demonstration of safety. Since our original ban prevented the local trials that might have generated such data, the safety of the polymer remains unproven in Coldspring. We find this reassuring. It ensures that no substance is introduced until its safety is certain, and no substance is reintroduced until its safety is certain.

  Harold Vance, a retired statistician and frequent correspondent, recently wrote to note that a principle requiring proof of safety for all actions, including the action of maintaining a precaution, logically paralyzes all decision-making. He argues that a framework forbidding every option, inaction included, ends up prescribing nothing in particular. Mr. Vance is correct. A precautionary moratorium on precautions could never be adopted, as nobody could prove the moratorium itself safe from unintended consequences. To resolve this regress, the Office granted itself a categorical exemption upon its founding. Our own existence was grandfathered in. This allows us to continue reviewing risks without subjecting the review process to a review process.

  Looking forward, the Office is expanding its scope. Previously, we reviewed only new proposals. Going forward, we will apply precautionary review to ongoing activities. Any existing town service may be subject to suspension if a plausible mechanism of harm is identified and the service provider cannot disprove it. This ensures that our commitment to safety evolves with our understanding of risk.

  The wooden mains will remain in place. The polymer ban will remain in effect. We understand this causes inconvenience. However, convenience is a transient condition, while chemical exposure is permanent. The Office of Precautionary Review remains dedicated to ensuring that Coldspring never takes a step it cannot prove is safe, even if that means standing still.
