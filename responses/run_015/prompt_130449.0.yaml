      *   *Check:* Does it constrain the speech? *Constraint: Philosophical claim limits rhetoric.* -> I cannot say "We are here to find the one true story." I must say "We are here to stabilize the world we share."

  5.  **Drafting - Writing the Content (Mental or Scratchpad):**

