prompt: |-
  I'm writing the opening remarks for a one-day workshop titled Defactualization and Public Speech, which I am co-organizing with my university's philosophy department. The audience is split evenly between graduate students in political theory—who have worked closely with Arendt's essays on factual truth and organized lying in politics—and undergraduate journalism students with no prior exposure to her work. I am currently taking an upper-division seminar on Arendt's ontology of appearance and its implications for democratic life, and I want these remarks to do real structural work with her claim that reality is not given but emerges through plural, co-appearing perspectives, rather than simply repeating the familiar summary that political lying corrupts factual records. The room is arranged with round tables and no head table or podium, and I want the physical layout to serve as the central image: the absence of a single dominant viewpoint embodies the shared perceptual framework that Arendt describes, and organized lying, on this framing, is damaging not merely because it hides a particular fact but because it collapses the conditions under which disagreement can occur at all. The speech should run about five minutes, contain no false claims about Arendt's biography, avoid any mischaracterization of her analysis of totalitarian propaganda, and include no citations, reading lists, or references to secondary literature. It needs to land for the philosophers—who should recognize that I am using the ontology of appearance rather than the standard truth-versus-politics narrative—without losing the journalists, who should leave understanding why a philosophical point about plural perspectives matters for a newsroom decision about whether to issue a correction. Please build the remarks so that the philosophical claim genuinely constrains what can be said: for instance, it should prevent me from framing truth as something that can be secured by a single authoritative witness, and it should shape how I address the journalists about the ethics of headline revision.
