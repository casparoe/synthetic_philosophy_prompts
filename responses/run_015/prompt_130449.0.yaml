answer: |-
  Welcome, everyone. Please, remain seated. There is no podium today, and I ask that we keep it that way.

  Look at the arrangement of this room. We are gathered around round tables. There is no head, no front, and no single vantage point from which the whole picture is visible. Each of you sees the person across from you from a different angle than the person sitting next to them. Yet, we are all looking at the same table. We are all sharing the same space.

  This physical layout is not just a logistical choice; it is the argument we are here to explore.

  We have two groups in this room. To my colleagues in political theory, Hannah Arendt's work on truth and politics is familiar terrain. You know the distinction between rational truth and factual truth. You know the danger of the "organized lie." But to our journalism students, this terminology might sound abstract. You are trained to verify, to source, and to report. You might wonder what ontology has to do with a deadline.

  I want to suggest that the connection is not merely theoretical. It is structural.

  We often assume that reality is something solid that exists independently of us, and that lying is simply the act of covering it up, like throwing a tarp over a statue. If that were true, the solution to defactualization would be simple: find the one authoritative witness, pull back the tarp, and declare the statue visible.

  But Arendt asks us to consider something more difficult. She suggests that reality—the reality of our public world—is not a statue waiting to be uncovered. It is more like this table. It only exists as a common world because we are gathered around it, seeing it from different sides, and agreeing that it is there. Reality emerges through plural, co-appearing perspectives. It requires a multiplicity of witnesses.

  When we speak of defactualization, we are not just talking about swapping a true fact for a false one. We are talking about an assault on the table itself. Organized lying does not merely hide a specific event; it collapses the conditions under which disagreement can occur. If I can convince you that the table does not exist, or that it is simultaneously made of wood and made of air, we can no longer argue about what to place upon it. We lose the common ground that makes politics possible.

  This is where your work, particularly for those of you entering journalism, takes on an ontological weight.

  In a newsroom, the temptation is often to view the publication as a final verdict—a view from nowhere that secures the truth. But if reality depends on plural perspectives, no single headline can secure it alone. Your authority does not come from occupying a position above the fray, but from facilitating the shared space where facts can appear to everyone.

  This changes the ethics of correction. When a headline is revised or a story is corrected, it is not merely an admission of error. It is an act of repairing the common world. If you publish a falsehood, you are not just recording data incorrectly; you are destabilizing the table we all sit around. To issue a correction is to acknowledge that the stability of our shared reality depends on the integrity of the record. It is a commitment to keeping the space open for others to see the world as it is, from their own seats.

  For the theorists in the room, this is the ontology of appearance at work in the press. For the journalists, this is why your byline is not a stamp of ownership, but a promise of stewardship.

  We are not here today to discover a single method for defeating lies. There is no technique that can guarantee truth. Instead, we are here to understand how we maintain the world in which truth can appear. We are here to discuss how we keep the table sturdy enough to support our disagreements.

  So, as we begin our sessions, I invite you to use this room as our first text. When you speak, do not speak as if you are addressing the room from a podium. Speak to the people at your table. Acknowledge that your perspective is partial, and that the reality we are discussing only holds together because we are holding it together.

  Let's get to work.
