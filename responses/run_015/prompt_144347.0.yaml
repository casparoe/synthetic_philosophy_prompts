prompt: |-
  I've been asked to run a two-hour evening session on the Principal Principle for our city rationality meetup, and I want a plan for the session rather than the session itself. Please don't write out the explanation or draft me slides; I can do that. What I need is the architecture: what has to be introduced in what order and why, what carries the idea, and where the predictable failures are.

  The audience: fifteen to twenty-five people, mostly working programmers, two or three physicists, a handful of people whose entire philosophy of probability comes from Bayesian statistics and the sequences. Roughly half will arrive with the reflex that probabilities just are degrees of belief and that "objective chance" is either shorthand for a frequency or a leftover confusion. So the principle has to be made to bite before it can be stated, or it will sound like "your probability should equal the probability."

  The carrying example. I have a candidate and I want you to either adopt it or replace it, with reasons either way. There is a sealed grey box in the town library, running on its own battery, with a screen and a lens. Every morning at nine the screen shows a number between zero and one; at noon the lens either flashes green or doesn't. The manufacturer is dead and the manual is one page: it says only that the displayed number is the chance that the lens will flash that day. The library has kept a public log for three years: on the 1,271 days the screen read 0.30, the lens flashed on 30.1 percent of them, and so on up the range. Nobody has opened the box, and I intend to refuse, on principle, to say whether its mechanism is deterministic.

  Two variants the example has to be able to absorb. First, the Calibration Rival: a black-box forecasting model trained on the public log whose calibration over the last six months beats the displayed number. If the number is the chance and the model is better calibrated, what does the principle tell me to match? I want this staged so that it forces the gap between deferring to a chance and deferring to a well-calibrated forecaster, rather than letting the two collapse into the same thing. Second, the case where the information you would gain if the event happened would itself discredit the chance you deferred to — a second machine, deliberately boring in description, whose tomorrow's number depends on today's flash. I want that to land as a genuine tension and not as a puzzle-box technicality, and I especially want your advice on the moment I say "that information is inadmissible," because someone will immediately say that this is just reclassifying every counterexample as inadmissible, and I don't yet know whether to concede that, bite it, or reframe it earlier in the sequence so it doesn't look like a rescue.

  Two constraints I'm fairly confident about and want you to check: no quantum mechanics anywhere in the example, and no coins or dice. I think I know why both matter — the first licenses "chance is a fundamental brute primitive, mystery, next question," and the second lets symmetry do all the work so the principle looks like a restatement of indifference — but tell me if I have it backwards or if the costs are different from what I think.

  What I want mapped, concretely.

  One: the dependency structure. What must be in place before the principle can be stated non-vacuously, and what depends on what. In particular, how do I get this audience to grant chance enough independence from opinion that the principle says something, without opening the metaphysical question of whether chances exist? And where does the conditional form go? My instinct is that the admissibility clause only becomes visible once they see that the principle constrains credence conditional on a chance proposition, and not unconditional credence, and I'm unsure whether that distinction belongs before the first statement of the principle or after it, as a repair.

  Two: the misconception map, keyed to three people I expect to be in the room. The determinist physicist, who will say that under a block universe the chances are zero or one and the principle either tells him nothing or tells him to be certain. The machine-learning person, who will say that chance is just the output of the best-calibrated model and the principle is expert deference with extra formalism. And the decision-theory person, who will try to drag the entire second hour into Sleeping Beauty. For each: the strongest version of the point, the exact moment in the sequence to head it off, and how much of it I should concede rather than defeat.

  Three: the check. One question at the end that distinguishes having got the idea from having memorized the formula. Tell me what a successful answer looks like and which near-miss answers I should be able to tell apart from the real thing.

  Four: what to refuse to cover, and where in the session to say so out loud. My current list is the metaphysics of laws, the amended principles that quantify over conditional chances, the Sleeping Beauty literature, and whether chances exist at all. Tell me what else is on it.

  Finally, a sequencing question I keep going back and forth on. I want the session to have one takeaway sentence, something like the thought that the principle's whole content lives in its admissibility clause, so that the real question is which information is permitted to move you away from the chance. Should I hand that sentence to the room at the start as a map, or withhold it and let it land at the end? Argue for one.
reasoning: |-
  Here's a thinking process that leads to the suggested session architecture:

  1.  **Analyze the Request:**
      *   **Task:** Create a session plan/architecture for a 2-hour evening meetup on David Lewis's Principal Principle (PP).
      *   **Constraint 1:** Do *not* write the explanation or slides. Provide the structure, order, dependencies, and failure points.
      *   **Constraint 2:** Audience is rationalist-adjacent (programmers, physicists, Bayesians/Sequences readers). They tend to view probability as subjective belief or frequency.
      *   **Constraint 3:** Use the provided "Grey Box" example (or suggest a replacement). It must handle two variants: Calibration Rival (better model exists) and Self-Undermining Chance (future info discredits chance).
      *   **Constraint 4:** No QM, no coins/dice. (User believes QM allows "mystery brute primitive" cop-out, coins allow symmetry/indifference cop-out).
      *   **Key Deliverables:**
          1.  Dependency Structure (what concepts need to be laid down first).
          2.  Misconception Map (Physicist, ML person, Decision Theorist).
          3.  The Check (one final question to test understanding).
          4.  Refusals (what to explicitly exclude).
          5.  Sequencing Advice (Takeaway sentence at start or end?).

  2.  **Deconstruct the Principal Principle (PP):**
      *   *Core Idea:* $C(A | X_A = x \land E) = x$. Where $C$ is credence, $X_A$ is the proposition that the chance of $A$ is $x$, and $E$ is admissible evidence.
      *   *The Problem:* If you are a subjective Bayesian, "objective chance" looks suspicious. If you are a frequentist, it looks like definition. PP bridges the gap: it tells you how to *use* chance to set belief.
      *   *The Hook:* It bites only if Chance and Credence are distinct categories.
      *   *The Trap:* Admissibility. If $E$ includes the outcome, PP breaks. If $E$ includes a better predictor, does PP break?

  3.  **Evaluate the "Grey Box" Example:**
      *   *Pros:* Avoids QM (no "spooky action"), avoids coins (no symmetry). It posits a "black box" chance generator. The log establishes empirical reliability (calibration).
      *   *Cons:* Needs to be carefully framed so it doesn't just look like "trust the frequency."
      *   *Verdict:* Keep it. It fits the constraints well. It allows for the "Calibration Rival" variant naturally (another model vs. the box's number). It allows for the "Self-Undermining" variant (a second machine reading the first).
      *   *Refinement:* Ensure the "manufacturer is dead" part is emphasized to prevent "let's just open it and see the deterministic code" responses.

  4.  **Drafting the Dependency Structure (The "Architecture"):**
      *   *Phase 1: The Gap.* Need to separate Credence (what I believe) from Chance (what the world does). If the audience collapses these, PP is trivial ($P(A|P(A)=x) = x$).
      *   *Phase 2: The Bridge.* State PP. Show why it's not trivial (it connects distinct domains).
      *   *Phase 3: The Leak (Admissibility).* Introduce the Self-Undermining variant. Show PP fails without restrictions. Introduce Admissibility as the fix.
      *   *Phase 4: The Rival (Expert Deference).* Introduce Calibration Rival. Distinguish "Chance" from "Expert." PP is about Chance, not just calibration.
      *   *Phase 5: Synthesis.* Why this matters for rationality (updating rules, humility).

  5.  **Addressing the Misconception Map:**
      *   *Physicist (Determinist):* "Chances are 0 or 1." *Counter:* PP is about *epistemic access* to laws, not the laws themselves. Even in deterministic worlds, *special science* chances (stat mech) might apply, or we treat them *as if* they exist for decision making. *Concession:* Admit PP assumes chance is a useful category, not necessarily fundamental ontology.
      *   *ML Person (Calibration):* "Chance = Best Model Output." *Counter:* The Grey Box *defines* the chance by fiat/manufacturer, even if the ML model predicts better *now*. Chance is a property of the *setup*, calibration is a property of the *predictor*. *Concession:* PP looks like expert deference, but "Chance" is a specific *kind* of expert (one that screens off other info).
      *   *Decision Theorist (Sleeping Beauty):* "What about self-locating belief?" *Counter:* Hard no. That's a different can of worms. *Deflection:* PP is about chance vs. belief, not indexical uncertainty. Keep it out.

  6.  **Designing "The Check":**
      *   Need a scenario where applying the formula blindly gives the wrong answer, but understanding the *concept* gives the right one.
      *   *Idea:* A scenario where you know the outcome (inadmissible info) but the chance is still 50%.
      *   *Scenario:* The box says 0.5. You have a time machine peek at the result (it flashed). What is your credence *now*?
      *   *Success:* "1.0 (or 0), because the peek is inadmissible evidence, overriding the chance."
      *   *Failure:* "0.5, because the Principle says so." (Blind formula application).

  7.  **Determining Refusals:**
      *   Metaphysics of Laws (Humean vs. Anti-Humean).
      *   Sleeping Beauty / Self-locating belief.
      *   Conditional Chances (Lewis's later amendments).
      *   Existence of Chance (Agnosticism is fine).
      *   *Add:* Derivations of the principle (it's a principle, not a theorem).

  8.  **Sequencing the Takeaway:**
      *   *Option A (Start):* "PP is all about Admissibility."
      *   *Option B (End):* Reveal this after they struggle with the counterexamples.
      *   *Argument:* Put it at the **End**. If you say it at the start, they will treat "Admissibility" as a magic word to dismiss problems without understanding *why* info is inadmissible. They need to feel the tension of the Self-Undermining case first. The takeaway should be the *resolution* to the tension they felt.

  9.  **Refining the Constraints (QM & Coins):**
      *   User is right. QM makes chance feel "fundamental" which stops inquiry. Coins make it feel like "symmetry" which reduces PP to Indifference. The Grey Box avoids both. It forces the question: "Why trust this number if not symmetry and not quantum magic?" Answer: Because it's *Chance*.

  10. **Review against Constraints:**
      *   No slides/explanation text? Checked.
      *   Architecture focus? Checked.
      *   Grey Box adopted? Checked.
      *   Variants integrated? Checked.
      *   Misconception map included? Checked.
      *   Check question included? Checked.
      *   Refusals listed? Checked.
      *   Sequencing advice given? Checked.

  11. **Final Polish:** Ensure tone is appropriate for a rationality meetup (precise, slightly technical, respectful of Bayesian priors). Make sure the distinction between "Expert Deference" and "Principal Principle" is sharp, as that's a common confusion point for the ML crowd. (Self-Correction: Make sure to emphasize that PP *implies* expert deference if the expert knows the chance, but isn't identical to it).

  12. **Structuring the Output:** Follow the user's requested headers (Dependency Structure, Misconception Map, The Check, Refusals, Sequencing).

  *(Self-Correction during drafting the Misconception Map)*: For the Physicist, I need to be careful. If they say "Chances are 0 or 1," PP becomes $C(A|X_A=1) = 1$. That's trivial. The pushback needs to be that PP is a norm for agents *within* the world who don't know the microstate. It's a principle of *epistemic humility* given macroscopic descriptions.

  *(Self-Correction on the Check)*: The time machine example is too sci-fi. Let's use the "Self-Undermining" variant itself as the test. If the second machine says "Today the first machine lies," how do you update? The successful answer recognizes that the second machine's output is *inadmissible* regarding the *chance* of the first, but *admissible* regarding the *outcome*. Wait, that's tricky.
  Better Check: "The box says 0.5. You have a reliable crystal ball that says 'Green'. What is your credence?"
  *   Correct: 1.0 (Crystal ball is inadmissible info about the outcome, overrides chance).
  *   Near Miss: 0.5 (Blind adherence).
  *   Near Miss: "Undefined" (Confusion about admissibility).
  Actually, let's stick to the prompt's specific request: "One question at the end." I will design a specific variant of the Grey Box for this.

  *(Final thought on Sequencing)*: The user asks "Argue for one." I will argue for the End. It creates a narrative arc.

  Let's assemble the plan.cw
answer: |-
  Here is the architecture for the session.

  ### 1. The Dependency Structure

  You cannot state the Principal Principle (PP) in the first twenty minutes. If you do, the Bayesians in the room will reduce it to $P(A|P(A)=x) = x$ and dismiss it as a tautology. You must construct a gap between **Credence** and **Chance** before you build the bridge.

  **Phase 1: The Distinction (0:00–0:30)**
  *   **Goal:** Separate *what we believe* from *how the world is set up*, without committing to metaphysical realism about chance.
  *   **Move:** Introduce the Grey Box. Establish two facts:
      1.  **Empirical:** The log shows the box is calibrated.
      2.  **Stipulative:** The manual says the number *is* the chance.
  *   **Critical Step:** Force the audience to agree that even if they knew the box's code (determinism), the *stipulated chance* remains 0.3 for that day.
  *   **Why:** This prevents the Physicist from collapsing chance to 0/1 and the Bayesian from collapsing chance to credence. You need them to accept "Chance" as a distinct variable in the equation, even if only as a useful fiction.
  *   **Failure Point:** If someone asks "But what *makes* it the chance?", you must refuse to answer (see Refusals). If you answer, you lose the distinction.

  **Phase 2: The Naive Principle (0:30–0:50)**
  *   **Goal:** State the principle in its simplest form and show it working.
  *   **Move:** $C(\text{Flash} | \text{Chance}=0.3) = 0.3$.
  *   **Why:** Get the formula on the board while the intuition is fresh from the Box.
  *   **Failure Point:** The ML person will nod and say, "This is just calibration." Do not correct them yet. Let them think they understand.

  **Phase 3: The Leak (Admissibility) (0:50–1:20)**
  *   **Goal:** Break the naive principle to reveal the need for the admissibility clause.
  *   **Move:** Introduce the **Self-Undermining Variant**. A second machine reads the first. If the first flashes, the second displays "Liar." If the first doesn't, the second displays "Truth."
  *   **Scenario:** Box says 0.5. You see the Second Machine display "Liar."
  *   **Conflict:** If you follow the naive PP, your credence in Flash is 0.5. But you know "Liar" means Flash happened (or didn't, depending on setup). Your credence should be 0 or 1.
  *   **Resolution:** Introduce **Admissibility**. Information about the *outcome* is inadmissible when conditioning on *chance*.
  *   **Why:** This is the core mechanical work of the session. It moves PP from a definition to a constraint on information flow.

  **Phase 4: The Rival (Expertise vs. Chance) (1:20–1:40)**
  *   **Goal:** Distinguish PP from simple Expert Deference.
  *   **Move:** Introduce the **Calibration Rival**. An ML model predicts the flash better than the Box's number over the last 6 months.
  *   **Conflict:** Do you defer to the Box (Chance) or the Model (Better Calibration)?
  *   **Resolution:** PP says defer to Chance *if* you know it. The Model is an expert *because* it tracks the chance (or the causes of the flash). If the Model diverges from the Box, either the Box is wrong about the chance (manual is lying) or the Model is overfitting.
  *   **Why:** This stops the ML person from collapsing PP into "follow the best predictor." PP is about the *source* of the probability, not just its accuracy.
  *   **Dependency:** This only works if Phase 1 successfully established the Box's number as "Chance" by fiat/stipulation.

  **Phase 5: Synthesis (1:40–2:00)**
  *   **Goal:** Connect back to rationality practice.
  *   **Move:** PP is a norm for how to update when you encounter objective constraints. It limits how much your subjective prior can diverge from world-structure.

  ---

  ### 2. The Misconception Map

  **A. The Determinist Physicist**
  *   **The Point:** "In a block universe, the chance is 0 or 1. The Principle tells me to be certain or impossible. It has no grip."
  *   **When to Head Off:** Phase 1 (The Distinction).
  *   **The Move:** Concede that fundamental chances might be 0/1. Reframe PP as a principle for **Special Science Chances**. Even if the universe is deterministic, the *macroscopic description* (the Box) has a chance relative to that description. PP governs the relationship between macroscopic chance and microscopic belief.
  *   **Concession:** Admit PP does not solve determinism. It solves how to act given incomplete knowledge of the determinism.
  *   **Defeat:** If they insist chance *only* means fundamental quantum probability, they are using a definition that makes PP useless. Ask them to grant the "Box Chance" as a working definition for the evening.

  **B. The Machine-Learning Person**
  *   **The Point:** "Chance is just the output of the best-calibrated model. The Principle is just 'defer to the expert'."
  *   **When to Head Off:** Phase 4 (The Rival).
  *   **The Move:** Distinguish **Tracking** from **Constituting**. The ML model tracks the frequency. The Box *constitutes* the chance (by manual stipulation). If the ML model predicts 0.9 and the Box says 0.3, PP says you should believe 0.3 *unless* you have evidence the Box is broken.
  *   **Concession:** Concede that in practice, we often infer chance from calibration.
  *   **Defeat:** Insist that PP is normative about *what chance is*, not descriptive of *how we find it*. If the Box is the source of chance, a better predictor is just a better predictor, not the chance itself.

  **C. The Decision-Theorist (Sleeping Beauty)**
  *   **The Point:** "How does this apply to self-locating belief? What if I am the box?"
  *   **When to Head Off:** Phase 5 (Synthesis) or explicitly in Refusals.
  *   **The Move:** Hard boundary. PP concerns **event uncertainty**, not **indexical uncertainty**.
  *   **Concession:** None. This is a known poison pill for PP sessions.
  *   **Defeat:** "That is a different principle (the Self-Indication Assumption or similar). We are discussing the link between objective chance and subjective credence, not observer selection effects."

  ---

  ### 3. The Check

  **The Question:**
  "The Grey Box displays 0.5. You have a friend inside the library who can see the lens. At 12:01 PM, they send you a text message: 'It flashed.' What is your credence at 12:05 PM that it flashed, given the Principal Principle?"

  **Successful Answer:**
  "1.0 (or near 1.0). The text message is **inadmissible evidence**. The Principal Principle only constrains credence when you *lack* outcome information. Once you have the outcome, the chance is irrelevant to your belief about that specific event."

  **Near-Miss Answers (Failure Modes):**
  *   **"0.5"**: They memorized the formula $C(A|X=x)=x$ but didn't understand the admissibility clause. They treated PP as an overriding command rather than a conditional constraint.
  *   **"Undefined/Illogical"**: They think the existence of outcome info invalidates the chance proposition entirely, rather than just screening it off.
  *   **"It depends on the friend's reliability"**: They are treating it as a standard Bayesian update on testimony (which is correct in practice) but missing the *structural* point that PP *ceases to apply* once admissibility is violated. You want them to identify the *type* of information, not just update on it.

  ---

  ### 4. Refusals (What to Exclude)

  You must explicitly state these boundaries at the start of Phase 2 and repeat them if challenged.

  1.  **The Metaphysics of Laws:** We are not debating Humean Supervenience vs. Armstrong-style universals. We are taking "Chance" as a given variable.
  2.  **The Existence of Chance:** We are not proving chances exist. We are discussing what to do *if* you accept a chance proposition.
  3.  **Conditional Chances:** We are using Lewis's original formulation, not the amended version for conditional chances (which leads to triviality results).
  4.  **Self-Locating Belief:** No Sleeping Beauty, no Quantum Immortality.
  5.  **Derivation:** PP is a principle, not a theorem. It cannot be proven from Dutch Books alone. Do not try to derive it.

  **Why:** Each of these opens a rabbit hole that consumes 45 minutes. The Metaphysics question dissolves the distinction in Phase 1. The Existence question stalls Phase 2. Conditional Chances break Phase 3. Self-Locating Belief hijacks Phase 5.

  ---

  ### 5. Sequencing the Takeaway

  **Recommendation:** Withhold the takeaway sentence until the **End**.

  **The Sentence:** *"The Principal Principle does not tell you how to trust chance; it tells you which information you are forbidden to use."* (Or: *"The entire content of the principle lives in the admissibility clause."*)

  **Argument for Withholding:**
  1.  **Narrative Tension:** If you tell them at the start that "Admissibility is the key," they will treat "Inadmissible" as a magic label they can slap on any counterexample to protect the Principle. They won't feel the *pressure* of the Self-Undermining case.
  2.  **Discovery:** You want them to experience the failure of the Naive Principle (Phase 3). When the Box says 0.5 but you know the outcome, and the formula breaks, they will *feel* the need for a constraint. When you finally reveal that the constraint is Admissibility, it lands as a solution, not a definition.
  3.  **Reframing:** The ML person thinks PP is about Expertise. The Physicist thinks it's about Ontology. If you start with "It's about Admissibility," they will filter the whole talk through that lens and miss the distinction between Chance and Credence (Phase 1). You need them to misunderstand it slightly at first so you can correct the misunderstanding structurally.

  **Execution:**
  At the very end, after the Check, put the sentence on the screen. Say: "For the last two hours, we treated the Principal Principle as a bridge between belief and world. It is better understood as a fence. It tells you where you are not allowed to walk."
