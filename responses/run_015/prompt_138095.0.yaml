      *   *Speech 5 (Ines):* That's a knife-edge. For any $m \ge 1$, SSA holds. Robustness matters.
      *   *Speech 6 (Sam):* The flip shows the premise isn't formal. It's structural. Also, bounded agent issue.
      *   *Speech 7 (Ines):* Bounded agent issue is separate. SSA tells us *who* has the strategy.
      *   *Speech 8 (Sam):* Does it? If I'm a mirror-bot, I lose moving first.
      *   *Speech 9 (Ines):* You're describing a bad policy. SSA licenses searching for a *good* one.
      *   *Speech 10 (Sam):* But existence isn't access. Concede that SSA identifies the winner though.
