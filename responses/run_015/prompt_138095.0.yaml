answer: |-
  Ines wiped the board clean, leaving only the rhombus grid. "Let's pin this down with Surplus Hex. Parameter $m$ is announced beforehand. Standard rules, except when you complete a chain, you count your stones minus mine. If that surplus exceeds $m$, the win voids to a draw."

  Sam picked up a marker. "So the winning condition depends on the count at the moment of completion. Since we alternate and never pass, the arithmetic is rigid. If I win as First Player on move $2k-1$, I've placed $k$ stones, you've placed $k-1$. My surplus is exactly 1."

  "Correct," Ines said. "And if you win as Second Player on move $2k$, we've both placed $k$ stones. Your surplus is exactly 0. So First Player always wins with surplus 1, Second Player always with surplus 0."

  Sam nodded. "Now set $m=0$. First Player's surplus is 1, which exceeds $m$. First Player cannot win; any chain they complete scores a draw. Second Player's surplus is 0, which satisfies the condition. Here, the strategy-stealing premise—that an extra stone never hurts—is false. An extra stone pushes surplus from 0 to 1, invalidating the win."

  "In $m=0$, yes," Ines conceded. "But for any $m \ge 1$, the surplus constraint never bites. First Player's surplus of 1 is permitted. The game is structurally identical to standard Hex regarding winning conditions. The strategy-stealing argument goes through unchanged. My point is robustness: for every non-degenerate parameter, the conclusion holds."

  Sam shook his head. "The flip at $m=0$ shows the premise isn't a logical formality; it's a substantive structural claim about the game's scoring. The argument doesn't prove First Player wins *simpliciter*; it proves *if* extra stones are costless, *then* First Player wins. You're treating the premise as background noise, but it's the engine."

  "It's not noise, it's a feature of the connection mechanic," Ines countered. "But consider the agent. In standard Hex, where $m \ge 1$ effectively, the argument tells us Second Player has no winning strategy. By Zermelo's theorem, someone must win. So First Player must have one. That identifies the winner. Determinacy alone doesn't do that."

  "Identifying the winner isn't giving a reason to act," Sam said. "Suppose my competence consists entirely of mirroring your moves across the diagonal. As Second Player, I can execute this perfectly. As First Player, I cannot make the first move and maintain the symmetry. I might strictly prefer moving second, even if you prove a winning strategy exists for First. Existence isn't access."

  "You're describing a policy limitation, not a game theoretic fact," Ines said. "The argument licenses the search. If I know a strategy exists, I know I'm not hunting a chimera. If I'm choosing sides against an opponent I don't expect to outplay, knowing First Player *must* win gives me a reason to take First. It shifts the burden of proof."

  Sam paused. "I'll concede that it shifts the burden. If Second Player had a winning strategy, First Player couldn't steal it. So the argument does rule out a Second Player win in standard Hex. That's more than mere determinacy. But does it give *you* a reason? Only if you assume you can approximate the winning strategy better than your opponent can approximate the drawing strategy."

  "Which is a reasonable default," Ines said. "But look back at $m=0$. The strategy-stealing argument fails there. Does that mean Second Player wins?"

  "No," Sam said sharply. "That's the trap. It means First Player isn't *guaranteed* to win via that argument. The game could be a draw. In $m=0$, First Player cannot win by definition. Second Player *can* win. But we haven't proved Second Player *must* win. The failure of the steal leaves the verdict undetermined."

  "Agreed," Ines said. "I don't claim the failure proves Second Player wins. I claim the success in $m \ge 1$ proves First Player wins. And since $m \ge 1$ covers the actual game we care about, the substantive premise holds. The $m=0$ case is a knife-edge where the rules change fundamentally."

  "But the premise changes status," Sam insisted. "In $m \ge 1$, 'extra stones help' is true. In $m=0$, it's false. The argument's validity tracks that truth value exactly. It doesn't reach down and touch the game's essence; it rides on top of that specific scoring property. So when you say it gives 'a priori knowledge,' you really mean 'knowledge conditional on a structural fact about stone counts.'"

  Ines leaned against the table. "All knowledge is conditional on definitions. But within those definitions, it tells us something non-trivial: the symmetry of the board does not imply symmetry of outcome. The intuition that moving second offers compensatory information is refuted. That's why it's not inert."

  "It refutes the intuition only if the agent can exploit the existence proof," Sam said. "But I'll grant this: for a perfect player, the argument settles the value of the game. My worry is about bounded agents like us. If I know First Player wins but cannot find the strategy, and my opponent plays randomly, moving First might expose me to traps I'd avoid moving Second."

  "Then you're arguing about skill differential, not the game's value," Ines said. "The argument establishes the game's value. That sets the ceiling for what skill can achieve. If the value is a First Player win, perfect play by Second loses. That's why I take First."

  Sam sighed. "Okay. I concede that the argument identifies the winner in standard Hex, distinguishing it from games where only drawability is known. It's not just an existence claim; it's an attribution of winning capacity to a specific role."

  "And I concede," Ines said, "that the 'no-cost-extra-move' premise is doing the heavy lifting. It's not a logical triviality. If the scoring rule changes even slightly, as in $m=0$, the conclusion collapses. So the argument is sensitive to the game's scoring structure, not just its topology."

  "So we agree it works for standard Hex," Sam said, "but disagree on whether 'it works' means 'a bounded agent should move first'."

  "Precisely," Ines said. "You think the policy dependence undermines the reason to act. I think knowing the terrain is winnable is reason enough to choose the winning side, assuming comparable competence."

  "Then the dispute isn't about the proof," Sam said, capping the marker. "It's about whether knowing a path exists justifies stepping onto it when you can't see the ground."

  "Or," Ines smiled, "whether you trust yourself to find the path once you know it's there."
