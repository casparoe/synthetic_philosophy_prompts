      *   ... (Need to refine dialogue flow and word count).

  5.  **Writing - Iteration 2 (Focusing on Constraints):**
      *   *Constraint Check:* 10-16 speeches. 1000-1400 words.
      *   *Constraint Check:* No external lit.
