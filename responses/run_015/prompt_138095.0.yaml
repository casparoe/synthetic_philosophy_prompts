      *   *Refining Word Count:* Need to expand the reasoning to hit the range. The math derivation needs to be explicit in dialogue. The philosophical distinction needs nuance.

      *   *Refining the Trap:* Must explicitly state that $m=0$ doesn't prove P2 wins, just that P1 isn't guaranteed.

