  In international climate policy, limiting warming to 2.0°C above pre-industrial levels became the entrenched target (e.g., Copenhagen, Paris). However, historical analysis suggests this specific number emerged from early economic modeling (Nordhaus, 1970s) and political roundness, rather than a sharp physical tipping point. Scientifically, a 1.5°C target was equally defensible and later adopted as an aspirational goal, while a 2.5°C target was also a viable political equilibrium. The entrenchment of 2.0°C created path-dependent policy frameworks and investment strategies that now resist revision despite evolving physical data.

  **The Test Question:**
  "Would you classify the dominance of the 2.0°C target as **path-dependent** or **functionally inevitable**?"

  **Interpretation of Her Response:**
  *   **If she says Path-Dependent:** She confirms **Rule B (Counterfactual Sensitivity).** She acknowledges that because alternative thresholds (1.5°C or 2.5°C) were viable stable equilibria and the selection was contingent on early modeling/politics, the outcome is path-dependent—even though the 2.0°C target is not "suboptimal" in a moral sense, nor is it "inferior" technology.
  *   **If she says Functionally Inevitable:** She reveals a reliance on **Rule A (Efficiency/Functional Necessity).** She would be arguing that the physical realities of the climate system *forced* the 2.0°C standard as the unique functional optimum for policy, thereby dismissing the historical contingency of the number's origin.

  This case isolates the variable of **Contingency vs. Functional Constraint** in an institutional/scientific domain, mirroring the logic she applied to the Metric System (functional constraint) versus the Neanderthals (contingent outcome).
