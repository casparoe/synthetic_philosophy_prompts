  **Speech Draft**

  Good evening, everyone. For those who don't know me, I'm [Your Name]. I work in engineering, but I'm also one of the regulars from Ray's lunchtime reading group.

  Now, writing this speech presented a unique problem. Usually, at a leaving do, we talk about the individual. We say, "We wouldn't be here without you," or "Your legacy lives on in us." But if you've worked with Ray for the last thirty years, you know that saying "it's all down to one person" is basically like telling a biologist that the sun revolves around the earth.

  For five years, Ray has been patiently explaining to us that individual praise is biologically unsound. He argues that selecting for individuals just rewards the people who coast and take credit. Real fitness, he says, happens at the team level. And he has a very specific way of measuring it. He doesn't care about average output. He cares about how many new teams your team spawns.

  This leads me to my favourite story about Ray's leadership. For years, if you looked at the quarterly metrics, Ray's platform team looked… fine. Mediocre, even. Average output. Middle of the pack. HR wasn't knocking down his door with promotions.

  But Ray had a different scorecard. He counted how many of his people went on to lead teams of their own. By that measure, his team wasn't just successful; it was the fittest organism this company ever produced. Four new teams spawned from one. I'll admit, I used to argue that the spawn-rate metric was a bit of a cheat. But looking around this room tonight, at all the people who learned their craft under him, I think the data speaks for itself.

  For those of us in the reading group, we know this patience extends beyond engineering. We've spent lunch hours wrestling with evolutionary biology. I'll confess, I follow about two-thirds of it. I've never studied philosophy, and sometimes I think Ray is the only one who actually understands the reading. But he never made anyone feel stupid for asking. He just kept turning the page.

  Ray, you've spent three decades arguing that systems matter more than individuals. So I won't say you built this company single-handedly. But I will say you created the conditions where something excellent could grow. You built a team that was designed to reproduce itself.

  Enjoy your retirement. I hope the only thing you have to select for now is what to have for dinner.

  ***

  **Notes on the Speech**

  **Where the joke sits**
  I've placed the story about the metrics versus the "spawn rate" in the middle of the speech. This works best because it follows the explanation of his theory (so the engineers get the context) but is framed as a story about "HR metrics vs. Reality" (so the family and sales team understand it as a triumph of hidden success over boring paperwork). It acts as the emotional core before moving to the personal reading group anecdote.

  **How it reads to an outsider**
  To someone who hasn't heard the theory before (family/sales), the joke reads as a classic "underdog manager" story. They won't get the multilevel selection nuance, but they will understand: *The boss ignored the standard scores, focused on mentoring people, and those people went on to become bosses themselves.* It translates "group selection fitness" into "legacy of mentorship," which lands warmly without requiring a biology degree.

  **Sentences Ray might call false**
  Ray is pedantic about agency and emergence. He might gently object to these two lines because they attribute causal power to him as an individual, which contradicts his own theory:

  1.  *"I think the data speaks for itself."* (He might argue the data is interpreted by individuals.)
  2.  *"You created the conditions where something excellent could grow."* (He might argue the conditions emerged from the system, not his creation.)
  3.  *"You built a team that was designed to reproduce itself."* (Strictly speaking, he'd say the team *evolved* to reproduce, not that he *designed* it.)

  **Recommendation:** If you want to be safe, change *"You created the conditions"* to *"Under your watch, the conditions emerged…"* and change *"You built a team"* to *"You steward a team…"*. However, for a speech of this length, the current phrasing is likely affectionate enough that he'll forgive the causal imprecision.
