prompt: |-
  Hi — I need a hand with a leaving-do speech and I'm properly out of my depth here.

  Ray's retiring after thirty-one years in the same building. He's 64, he ran the platform team for most of it, and for about five years he also ran a lunchtime reading group on evolutionary biology that I've been going to on and off. I follow maybe two thirds of it. Everyone else in the group is an engineer, nobody's a biologist, and I've never studied any philosophy in my life.

  His big idea — the one he's been banging on about since I joined — is that you can't explain how this place works by looking at individuals. Within a team, he says, selection just rewards the people who coast and take credit; anything actually worth having gets maintained by competition *between* teams, or better still by teams that throw off new teams. He's got two ways of counting how fit a team is: the first is just the average output of the people on it, the second is how many new teams it spawns. He reckons the second is the real one, and that anyone who only ever looks at the first is doing the equivalent of judging a species by its individual members. He also insists a team-level trait only counts if it isn't merely the sum of what the individuals on it are like — it's got to be something about how the group is put together, not just the people. Half the group thinks the spawn-rate version is a bit of a cheat and we argued about it for an entire session and he never budged. It's also why he refused to do individual performance ratings for his team, which he got away with for years.

  Where that makes Friday awkward: about forty people, half from the group or from engineering who'll catch every reference, the other half his family plus people from sales and facilities who won't have a clue. And the one thing a leaving do basically requires — it's all down to you, we wouldn't be here without you, your legacy lives on in all of us — is exactly the kind of individual-level causal claim he's spent five years telling us is backwards. I definately can't stand up and say it and hope he's too polite to object, I can't turn it into a lecture, and I can't say nothing about him as a person either.

  One thing I'd love in there if you can make it work: his team never looked good on the metrics, average output was mediocre for years, but four people off it went and started teams of their own, so by his favourite way of counting it was the fittest team this company ever had. I think that's a genuinely good joke and I want it to land for both halves of the room, family included, and to read as affection rather than as me settling an argument.

  Can you write it — four minutes-ish, written to be spoken, not essayish. And after the speech a few lines on where the joke sits, how it reads to someone who's never heard any of this, and flag any sentence you think he'd gently call false so I can cut it.
