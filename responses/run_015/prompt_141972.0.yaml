answer: |-
  The hearing room was designed to feel like nothing at all. Neutral walls, neutral light, a table that refused to reflect the faces of the three people seated around it. Dr. Elena Vance smoothed the text of the Somatic Criterion Act before her. She had written clause (b). She had fought for the words *without relying on the person's own account of what they take themselves to have reason to do*. Her intention had been a wall. If a person could explain their choices, even bad ones, the state could not medicalize them. Morality belonged to the courts, or to God, but not to the clinic.

  Across the table sat Arthur Hale. He was thirty-four, thin enough that the collar of his shirt hung loose, but his eyes were clear. He was not confused. He was not threatening. He was simply starving, and he had stopped paying his rent, and he had stopped answering his phone. Under the old law, this was grave disability. Under the new law, it was a question of mechanics.

  "Mr. Hale," Vance said. "You understand why we are here?"

  "I understand the petition," Hale said. His voice was level. "You want to feed me. You want to keep me safe for fourteen days."

  "And you decline this?"

  "I decline the confinement. I do not decline the food, logically. I know I should eat." He gestured to the paper cup of water on the table. He did not reach for it. "I know the reasons. Survival is a precondition for any other project. I value my projects. Therefore, I should value survival. The syllogism holds."

  "Then why don't you eat?" asked the lay member, Mr. Garris. He was a retired transit worker, appointed to ensure the panel remained grounded. He had no theory of mind. He had only schedules and stops.

  Hale looked at him. "I see the reason. It is present to me. But it does not move me. It is like reading a map of a city you cannot visit. The streets are there. The destination is clear. But the car will not start."

  Vance felt the familiar tightness in her chest. This was the edge case. The Act required a deviation from species-typical functioning. Humans eat when food is present and they are hungry. Hale was hungry, food was present, he did not eat. That satisfied clause (a). But clause (b) required that the condition be identified without relying on his account of his reasons. If Hale said, "I am not eating because I am protesting," that was a reason. The state could not touch him. If he said, "I am not eating because I am sad," that was a feeling. The state could not touch him.

  But Hale was saying neither. He was saying the mechanism was broken.

  "Is the car broken," Garris asked, "or do you just not want to drive?"

  "I want to drive," Hale said. "I want to arrive. I simply cannot turn the key."

  Vance tapped her pen against the file. Her draft of clause (b) was supposed to keep exactly this sort of ambiguity out of the medical sphere. If there was no lesion, no tumor, no broken bone, then the failure to act was a failure of character. It was a moral problem. If the state confined him for a moral problem, it was using a medical metaphor to hide a political coercion. That was the danger she had tried to legislate away.

  "Mr. Hale," Vance said. "If I placed the cup in your hand, would you lift it to your mouth?"

  "I would try," he said. "I have tried. The arm feels heavy. Not painful. Just... disconnected. Like the wire is cut."

  "We found no nerve damage," Vance said. "The neurological exam was clean."

  "I know," Hale said. "I told you. The map is fine. The car is the problem."

  Vance looked down at the statute. *Identified by a competent observer without relying on the person's own account of what they take themselves to have reason to do.* She had assumed this meant physical signs. A tremor. A rash. A lesion. She had assumed that if the body looked healthy, the will was free. If the will was free, the responsibility was the individual's.

  Garris leaned forward. He looked from Vance to Hale, then back to Vance. He didn't know the history of the debate. He didn't know the fear of the medicalization of morality. He just saw a man who wasn't eating.

  "Doctor," Garris said. "You wrote this rule. Does it matter what he says about the key? Or do you just look at whether the car moves?"

  Vance paused. The question hung in the sterile air.

  "If we rely on his account of his reasons," Vance said slowly, "we are entering his mind. We are judging his motives."

  "He told you his motive," Garris said. "He wants to live. He told you the reason is good. But he isn't moving. You don't need to ask him why he isn't moving to see that he isn't moving. You just watch the hand."

  Vance felt the shift. It was subtle, like a gear slipping into a different tooth. She had designed clause (b) to protect the will from the doctor. But the will was not a ghost. It was a function. If the function failed—if the input of reason did not produce the output of action—that failure was observable. It did not require believing his story about sadness or protest. It only required seeing the disconnect. The disconnect was the lesion, even if it left no scar on the tissue.

  The skeptical view held that illness language was literal only where there was a physiological fault. But here was a physiological fault: the failure of the motor command to execute. It was not a metaphor for conduct. It was a description of a mechanism that had ceased to operate according to species-typical design. The medical language was not hiding a moral question; it was describing a mechanical failure that looked like a moral choice.

  Clause (b) was satisfied. She did not need to know why he wasn't eating. She only needed to see that the command to eat was not resulting in eating, despite his stated desire to eat. The observation was independent of his reasons.

  "Mr. Hale," Vance said. Her voice was steady. "Under the Act, we are not judging your character. We are observing a failure of execution."

  "I know," Hale said. "It doesn't feel like a failure. It feels like me."

  "That is not relevant to the criterion," Vance said. She looked at Garris. Garris nodded. He didn't look triumphant. He looked like a man who had confirmed a schedule.

  "We will grant the petition," Vance said. "Fourteen days. Nutritional support."

  Hale nodded. He didn't look relieved. He didn't look angry. He looked like a man who had been read a verdict he already knew. "Okay," he said.

  Vance closed the file. She had not resigned. She had not found a tumor. She had not declared illness a myth. She had applied the law. But the wall she had built had changed shape. It no longer kept the will out of medicine. It had simply redefined the will as a machine that could break without visible damage. The moral question was still there, hidden behind the technical observation, but now the technical observation was broad enough to cover it. She had wanted to protect liberty by narrowing the definition of illness. Instead, she had narrowed the definition of observation until it captured the liberty itself.

  She stood up. The hearing was over. The man would be fed. The law would hold. And the line between the body and the person was exactly where she had drawn it, which was to say, nowhere at all.

