answer: |-
  Dear Colleague,

  You have asked me to step back from the formalisms and look at the job description for truthlikeness, specifically for your task of ranking imperfect historical or eyewitness accounts where you already know the truth is somewhere else. This is a refreshing constraint because so much of the literature is obsessed with scientific progress and realism, which burdens the theory with requirements you do not need. You want a tool for ranking errors, not a metaphysics of science. I have spent some time walking through your seven cases and trying to extract the requirements they imply, and I must confess that the list is not as tidy as we might hope. In fact, if I am honest, the list itself reveals why no single theory has conquered the field. There are tensions here that look like genuine incompatibilities rather than mere difficulties, and I think you deserve to see those cracks before you buy into any particular measure.

  Let us start with the baseline you mentioned, which is non-negotiable. We must be able to say that one false theory is closer to the truth than another. Popper failed here because his definition implied that any false theory has zero truthlikeness compared to any other false theory if they are both false, or rather, the logic of truth and falsity content collapsed so that no false theory could be compared favorably to another. So, Requirement One is simply that the ordering must allow for comparative verisimilitude among falsehoods. This seems trivial but it kills the pure Popperian account immediately. Now, moving to your first case, the tension between the bold wrong account and the cautious vague one. This generates Requirement Two: the theory must balance accuracy against informativeness. It cannot be that vagueness always wins, nor that precision always wins. If I say there were forty-one people and I am wrong, versus saying there were between twenty and eighty and I am right, the theory needs a weighting mechanism that allows the precise error to be closer than the vague truth only if the error is small enough, but not if the error is massive. This is the anti-hedging requirement you noted. It demands that the theory values content but penalizes error sufficiently to stop garbage precision from winning.

  Then we have your second case, the irrelevant conjunction. If I add Vienna is the capital of Austria to my false account of the hall, my score should not go up. This is Requirement Three: irrelevance immunity. Truths that are logically independent of the subject matter must not inflate the verisimilitude score. This is technically difficult because in logical consequence accounts, adding a truth always adds truth content. So this requirement pushes us away from pure logical content measures. Now we arrive at your third case, the one you care most about, concerning omission versus commission. Account A tells a true but incomplete story; Account B tells a fuller story but gets a date wrong. This forces Requirement Four: the treatment of silence. Does the theory penalize what is left out? If silence is neutral, Account A looks very good, perhaps better than B if B's error is weighted heavily. If silence is penalized as a kind of distance from the full truth, then B might win despite the error. I have gone back and forth on this myself, but for your purpose of ranking historical accounts, I suspect you need a theory that penalizes omission, otherwise the most trivial true statement becomes the best account. So I will list this as a requirement for your specific job, though I know some theorists treat silence as neutral. Requirement Four is that omission must carry a cost relative to the completeness of the causal story.

  Your fourth case raises Requirement Five: language invariance. If I describe the forty-three people as forty-three individuals or as a crowd of size forty-three, or if I switch from meters to feet, the score should not change. This seems obvious, but it is a notorious trap for similarity measures. Requirement Six comes from your fifth case, regarding total ordering. Must the theory always say one is better, or can it say they are incomparable? You ask if requiring a total ordering is a real desideratum or just tidiness. For your purpose of ranking entries, you probably want a verdict, but philosophically, requiring a total order is dangerous. I will mark this as a flexible requirement: prefer comparability, but allow incomparability if the errors are of fundamentally different kinds, like numbers versus order. Requirement Seven is about non-sentential forms. Maps and tables are not sets of propositions in the standard sense. So Requirement Seven is representational neutrality; the measure should apply to structures, not just sentences. Finally, Requirement Eight is your epistemic access condition. Can we know the verdict? This is camp-relative. If you are a realist, you might say truthlikeness is a semantic relation that exists whether we know it or not. If you are a problem-solver or instrumentalist, you will demand that verisimilitude be estimable from evidence. For your job of ranking known episodes where you have good reason to think they are wrong, you likely have access to the truth, so this requirement is less pressing for you than for the scientific realist, but I will note it as camp-relative.

  Now I must tell you where the breakage occurs. There is a subset of these requirements that cannot be jointly satisfied in a formal system without making arbitrary choices. Specifically, Requirement Five (language invariance) and Requirement Two (the specific balance of boldness versus accuracy in likeness judgments) are in tension. There are proofs in the literature, notably discussed by Oddie and Niiniluoto, showing that if you define likeness based on the similarity of possible worlds, the measure depends on how you carve up the properties of those worlds. If you change the vocabulary, the distance between worlds changes unless you privilege one language as the true ontology. So you cannot have full language invariance and also guarantee that your intuitive likeness judgments hold across all translations. You have to fix a language to measure similarity, which violates Requirement Five. Additionally, there is a tension between Requirement Three (irrelevance immunity) and Requirement Two (boldness). If you reward content to stop hedging from winning, you invite irrelevant conjunctions to boost the score. If you block irrelevant conjunctions strictly, you often end up penalizing bold true claims that are merely unrelated to the core question. You can manage this with a relevance filter, but that introduces subjectivity. So the impossibility result is that you cannot have a fully objective, language-invariant measure that also respects all intuitive trade-offs between content and error. You have to sacrifice language invariance or sacrifice the precision of the content-error balance.

  Regarding your question about which single requirement does the most work in excluding candidate theories, I disagree with your guess that it is the anti-hedging requirement. I believe it is Requirement Four, the treatment of omission. This is the fork in the road. If you treat silence as neutral, you are forced into a likeness or possible-worlds framework where you measure the distance between the actual world and the described world, and what is not described is simply not fixed, which often defaults to neutral or requires a ceteris paribus assumption. If you treat silence as a deficit, you are pushed toward a content-based framework where the whole truth is the set of all true consequences and missing any reduces your score. This requirement excludes pure Popperian content accounts if you demand that a small error plus extra truth (Account B in case three) can beat a subset of truth (Account A), because content accounts often struggle to let the error-laden theory win unless the truth content is vastly larger. But more importantly, it excludes simple similarity metrics that do not account for informational completeness. The omission requirement forces the theory to have a view on what a theory is supposed to be—a map or a list of facts—and that architectural decision eliminates half the candidates immediately.

  Finally, I will score your three candidate approaches against these requirements, keeping it brief as requested. The first approach, adding up true consequences and subtracting false ones, scores well on Requirement Two regarding boldness, since it rewards content, and it handles Requirement Eight well for realists. However, it fails Requirement Three catastrophically; this is the Tichý objection, where irrelevant truths boost the score. It also struggles with Requirement Four on omission, often treating silence as neutral, which might not suit your historical ranking needs. It generally satisfies Requirement Five only if the language is fixed, and it can provide a total ordering for Requirement Six. The second approach, measuring likeness between possible worlds, handles Requirement Two very well, allowing small errors to be closer than large vagueness. It can handle Requirement Four if designed to penalize missing information as distance, but often silence is tricky in world-models. It fails Requirement Five significantly, as similarity metrics are notoriously language-dependent; change the properties and you change the distance. It satisfies Requirement Seven well, as maps and models can be seen as world-descriptions. The third approach, counting only consequences bearing on fixed questions, scores perfectly on Requirement Three, blocking irrelevant conjunctions by definition. It handles Requirement Four well if the questions demand completeness. However, it struggles with Requirement Six, often yielding incomparability if two accounts fail on different questions, and it relies heavily on the subjective fixing of the questions, which might violate the spirit of Requirement Five if the question-set is language-sensitive. For your specific job of ranking historical accounts where you know the truth, the third approach might be the most pragmatic, despite its reliance on fixed questions, because it mirrors how historians actually critique narratives by asking what was left out and what was irrelevant.

  I hope this messy walkthrough helps you see where the traps are laid. The impossibility of satisfying language invariance alongside intuitive likeness is the hard technical wall, but the omission requirement is the philosophical gatekeeper. You will have to choose which constraint you are willing to loosen.

  Best regards,

  Your Colleague
