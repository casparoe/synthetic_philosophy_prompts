  3.  **Brainstorming Approaches (The "4-5 Ways"):**
      *   *Approach 1: The Epistemic Mismatch.* Focus on language and concepts. Nuñez fails because "sight" has no referent in their language. Molyneux assumes concepts exist; Wells shows they don't.
      *   *Approach 2: The Phenomenological Overload.* Focus on the raw sensation. Molyneux assumes clean data; Wells (and Ines) deal with noise, flicker, confusion. It's not about matching concepts, it's about surviving the input.
