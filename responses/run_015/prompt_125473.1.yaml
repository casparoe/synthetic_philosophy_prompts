          *   Joint Attention: This is the key. The partner points to "red," Ines sees "flicker." They aren't looking at the same *phenomenal object*.
      *   **The Twin Case:**
          *   Prediction: They might do *better* at creating a shared lexicon but *worse* at navigating the sighted world.
          *   Molyneux relevance: It collapses the "sighted teacher" assumption.
      *   **Where the Thought Experiment Fails:**
