      *   *Check:* Am I avoiding footnotes/quotes? Yes.
      *   *Check:* Is the "Scaffolding" argument robust enough? I need to make sure I don't just say "community is good." I need to say "perception *is* the coordination of action."

  8.  **Final Polish:** (Mental check of the "Philosopher of Perception" persona). I need to sound like someone who cares about the *mechanism* of seeing but knows that mechanism is embedded in a life. Use terms like "affordances," "joint attention," "qualia," but keep them accessible.

  *(Self-Correction on Wells's Ending)*: The user mentions the rockslide version. I should acknowledge the ambiguity there without getting bogged down in textual history.
