answer: |-
  It is a pleasure to correspond with someone who thinks so carefully about these matters. Please do not worry for a moment about your lack of university education; the questions you are asking sit at the heart of a field called 'aesthetics', and professional philosophers spend entire careers debating the very cases you have described. Your intuitions are sharp, consistent enough to be analysed, and honest.

  You are looking for a rule that separates the *artistic value* of a thing from the *moral value* of the person or the message, without pretending they never touch. Based on the five settled cases and the one undecided case you provided, I believe your reactions are best explained by a single guiding rule. I shall call this **The Principle of Functional Dependence**.

  ### The Principle of Functional Dependence

  **The Rule:** A moral fault damages the artistic quality of a work if, and only if, the work's ability to move, please, or interest us *depends* upon that moral fault. If the artistic merit can stand apart from the moral error, the work remains good art, even if we choose not to support the artist financially.

  This principle draws a line between faults that are **structural** (built into the machinery of the work) and faults that are **incidental** (attached to the work but not doing the heavy lifting).

  ### How Your Cases Fit the Principle

  Here is how this principle makes sense of your specific reactions:

  **1. The Pop Song and the Stand-up Routine (Cases 2 and 5)**
  In both these instances, you judged the work to be ruined or failed. Under the Principle of Functional Dependence, this is because the moral fault was the *engine* of the art.
  *   In the **song**, the catchiness relied on mocking a disability. Without the mockery, there is no joke. The aesthetic success (the catchiness) depended on the moral failure.
  *   In the **stand-up**, you noted that "the cruelty did the work that observation should have done." This is a perfect description of functional dependence. The laughs were bought at the price of prejudice. Therefore, the moral defect is also an aesthetic defect.

  **2. The News Photograph (Case 4)**
  You judged this to be a "worse piece of work." This fits because the image's power (its striking nature) was directly caused by the harm inflicted on the subject. The suffering was not just depicted; it was manufactured for the sake of the image. The aesthetic impact depends on the immoral act. Therefore, the art is compromised.

  **3. The Sitcom and the Children's Stories (Cases 3 and 6)**
  In these cases, the moral fault lies with the *maker*, not the *making*.
  *   In the **sitcom**, the comedy arises from the script and the timing, not from the actor's abuse of his partner. The abuse is external to the work. Therefore, the episodes remain "good as comedy." Your unease about buying the box set is not about the *quality* of the art, but about the *ethics of patronage*. You are separating the object from the income stream.
  *   In the **children's stories**, the author's political campaigning is separate from the text you read to your daughter. The stories do not rely on his harsh views to function. Therefore, aesthetically, they remain "good stories."

  **4. The Novel about Brothers (Case 1)**
  This is the most complex case, but it fits if we look closely. You say the novel is "well made" despite the moral mistake about revenge. This suggests that the *craft* (the pacing, the prose, the character development) works independently of the moral conclusion. The novel does not need you to agree with the revenge to appreciate the writing. The moral view is present, but it is not the sole source of the novel's power. Thus, it survives as a "powerful" work.

  ### Implications for Two New Situations

  You asked how this principle would handle two situations you have not yet described.

  **Situation A: The moral fault lies only in what the work says.**
  Imagine a beautifully painted poster that argues for a political cause you find abhorrent, but the poster contains no lies or cruelty; it simply advocates a policy you dislike.
  *   **Verdict:** According to the Principle of Functional Dependence, this work remains aesthetically good. The beauty of the painting does not *depend* on the policy being wrong. You can admire the brushwork and composition while rejecting the message. The moral disagreement is external to the artistic skill.

  **Situation B: The moral fault lies only in what the maker did apart from the work.**
  Imagine a brilliant architect who designs a stunning library, but it is discovered they were cruel to their waitstaff in private life.
  *   **Verdict:** The library remains a stunning building. The cruelty to the waitstaff did not build the arches or design the lighting. The aesthetic merit is independent. However, like your sitcom example, you might feel uncomfortable hiring this architect for a new project, not because they are bad at architecture, but because you do not wish to fund their lifestyle.

  ### The Cost of Consistency: What You Might Need to Give Up

  To hold the Principle of Functional Dependence consistently, there is one area where your current verdicts might need a slight adjustment. It concerns **Case 1 (The Novel)** and **Case 5 (The Stand-up)**.

  In Case 5, you said the routine "failed as comedy" because the cruelty did the work. In Case 1, you say the novel is "well made" even though it presents a moral mistake as honourable.

  If you are to be strictly consistent, you must ask yourself: *Does the novel ask me to feel satisfaction at the revenge?*
  *   If the novel simply *shows* the revenge, and you find it powerful, your current view stands.
  *   However, if the novel *persuades* you that the revenge is honourable, and you believe that is a moral lie, then the novel is doing the same thing as the stand-up comic: it is using artistic skill to make you endorse something harmful.

  To be fully consistent with your reaction to the stand-up, you might need to admit that the novel has a **blemish**. It can still be "powerful" and "well-written," but if it successfully persuades you of a moral error, it is not *wholly* good. It is like a delicious meal that leaves you slightly ill; it is skilfully cooked, but the effect is flawed. You do not have to stop liking the novel, but you might need to concede that the moral mistake is a small aesthetic failure, not just a moral one.

  Regarding **Case 6 (The Children's Stories)**, your worry is that admiring them is "a kind of approval of him." The principle suggests you can separate the two. You can tell your daughter, "These are wonderful stories," without telling her, "This man is a hero." However, if you buy the books new, the money goes to him. To be consistent with your Sitcom verdict (feeling uneasy about buying the box set), you should feel equally uneasy about buying the books new. Borrowing them from a library, or buying them second-hand, would allow you to enjoy the art without the financial support triggering your moral objection.

  ### Summary

  Your instincts are those of a **Moderate Moralist**. You do not believe art is immune to morality, nor do you believe every moral flaw ruins a work of art.

  The rule that binds your thinking is this: **Immorality spoils the art only when the art needs the immorality to work.**

  *   When the joke *is* the cruelty, the joke is bad.
  *   When the image *is* the harm, the image is tainted.
  *   When the craft stands apart from the sin, the art remains good, even if our wallet stays closed.

  You have done the hard work of noticing these distinctions in your spare time. That is no small feat. I hope this formulation helps you settle your mind on the stories for your daughter: they are good stories, but you might sleep better if they were bought from a charity shop.
