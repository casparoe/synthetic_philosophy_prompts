answer: |-
  This is a high-wire act. 80 minutes is tight for 16 people to write, execute, and debrief code without computers. The success of this seminar hinges on **rigid constraints on the "language"** and **centralized execution**. If you let pairs try to execute each other's cards, you will lose 40 minutes to disputes over recursion.

  Here is the runnable specification, the flow, and the honest philosophical payoff.

  ### I. The Mechanics (The "Machine")

  To make this human-executable, you must act as the Operating System. The volunteer is the Co-Processor.

  **The Payoff Matrix (Write on Whiteboard):**
  *   **CC:** 3 pts each
  *   **DD:** 1 pt each
  *   **CD:** 0 pts (Cooperator), 5 pts (Defector)
  *   *Total points convert to quiz bonus (e.g., top 25% get +5%).*

  **The Language (Index Card Constraints):**
  Students may write exactly **one** instruction block. Max **3 lines**.
  Allowed Primitives (write these on the board):
  1.  `PLAY C`
  2.  `PLAY D`
  3.  `IF THEIR_TEXT_HAS "string" THEN PLAY X ELSE PLAY Y`
  4.  `IF SIMULATE_THEM RETURNS C THEN PLAY X ELSE PLAY Y`

  **Execution Rules (The "Kernel"):**
  1.  **Pairing:** Random draw.
  2.  **Order:** Simultaneous reveal.
  3.  **Simulation Limit:** `SIMULATE_THEM` runs the opponent's code with *their* `SIMULATE_THEM` command disabled (returns `D` if nested). This prevents infinite recursion (`I simulate you simulating me...`).
  4.  **Timeout:** If the Volunteer/Instructor cannot resolve the logic in 30 seconds, result is **DD**.
  5.  **Syntax:** Case-sensitive.

  ---

  ### II. The Three Rounds (80 Minutes)

  #### Round 1: The Action Game (10 Minutes)
  *   **Setup:** Hand out cards. "Write C or D. Do not write your name. Fold."
  *   **Execution:** Collect, shuffle, pair randomly. Reveal.
  *   **Outcome:** Expect ~80% Defection.
  *   **Score:** Tally points.
  *   **Pedagogical Point:** Establish the baseline. In the *action* space, D strictly dominates C. Rationality (in the standard sense) demands Defection.

  #### Round 2: The Transparent Rule Game (30 Minutes)
  *   **Setup:** "You are no longer submitting actions. You are submitting *programs* that determine actions based on the other player's program."
  *   **Constraint:** Remind them of the 3-line limit and the 4 Primitives.
  *   **Execution:**
      1.  Students write rules (5 mins).
      2.  Collect cards. You and the Volunteer act as the CPU.
      3.  **Public Execution:** Pick 3-4 pairs to resolve on the document camera/whiteboard so everyone sees the logic trace. Resolve the rest offline (announce results).
      4.  *Key Move:* If a student writes `IF THEIR_TEXT_HAS "PLAY C" THEN PLAY C`, pair them against someone who wrote `PLAY C`. It works.
      5.  If a student writes `IF SIMULATE_THEM...`, run the trace aloud. "Okay, I am running your code. It calls Simulate. I run their code. It returns C. So you play C."
  *   **Outcome:** Expect a mix. Some `PLAY D` (exploiters). Some `SIMULATE` (conditional cooperators). Some `THEIR_TEXT_HAS` (naive cooperators).
  *   **Score:** Tally. Conditional cooperators often beat pure defectors here if they find each other.

  #### Round 3: The Obfuscation / Compiler (25 Minutes)
  *   **Setup:** "I am now running your code through a compiler. It preserves logic but changes syntax."
  *   **The Twist:** You physically take the cards.
      *   **Rule:** You replace specific strings. If a rule says `IF THEIR_TEXT_HAS "PLAY C"`, you cross out `"PLAY C"` and write `"OUTPUT_COOPERATE"`.
      *   **The Plant:** You introduce **one** new rule card yourself (The "Camouflage"). It looks like `PLAY D` (short, simple), but logically you declare it is a `MIRROR` function (it cooperates if the other cooperates). *Actually, better:* You write a rule that is functionally `MIRROR` but syntactically unique (e.g., `IF SIMULATE...`).
      *   **Wait, simpler for time:** Tell the class: "I have renamed the primitive `PLAY C` to `DO_GOOD` on half the cards."
      *   **Execution:** Re-pair. Run the simulation.
  *   **The Crash:** Students who used `IF THEIR_TEXT_HAS "PLAY C"` will now fail to find the string (because it says `DO_GOOD` or was obfuscated). They default to their `ELSE` clause (usually `PLAY D`).
  *   **The Success:** Students who used `SIMULATE_THEM` will still cooperate, because the *behavior* didn't change, only the text.
  *   **Outcome:** Text-matchers crash into DD. Simulators maintain CC.
  *   **Score:** Tally.

  #### Debrief (15 Minutes)
  *   See script below.

  ---

  ### III. The Debrief Script (Mapping Moments to Theory)

  **1. Dominance vs. Equilibrium (Round 1 vs. Round 2)**
  *   "In Round 1, D dominated. No matter what they did, you were better off defecting."
  *   "In Round 2, the object of choice changed. You didn't choose C or D; you chose a *function*. Against a `MIRROR` function, `PLAY D` yields 1 point (DD). `MIRROR` yields 3 points (CC). Therefore, in the *rule space*, Cooperation can be a Best Response."
  *   **Formal Point:** This is **Program Equilibrium** (Tennenholtz 2004). Nash Equilibrium applies to actions; Program Equilibrium applies to source code.

  **2. Why Deviating is Self-Defeating (The Stability)**
  *   "If you are playing `MIRROR` against another `MIRROR`, you get 3 points. If you deviate to `ALWAYS_D`, the other program *sees* your code (or simulates you) and defects. You get 1 point."
  *   "Defection is no longer a dominant strategy; it is a punished strategy."

  **3. The Selection Problem (Round 3)**
  *   "Why did the text-matchers fail in Round 3? Because they relied on **syntax**, not **semantics**."
  *   "This shows why `IF THEIR_TEXT_HAS` is fragile. Real program equilibrium requires semantic equivalence (simulation), not string matching."
  *   "But notice: `ALWAYS_D` is *also* an equilibrium in the rule game. If everyone submits `ALWAYS_D`, no one wants to switch to `MIRROR` (because `MIRROR` vs `ALL_D` is DD, 1 point). Nothing *forces* cooperation. It just *permits* it."

  **4. Real World Applicability**
  *   "When does this matter outside the room?"
  *   **Smart Contracts:** Code on a blockchain that executes only if the counterparty's contract verifies certain conditions.
  *   **API Handshakes:** Two servers exchanging SSL certificates (source code verification) before trading data.
  *   **Treaties:** Inspection regimes (IAEA). You aren't trusting their *promise* (action); you are trusting their *verification mechanism* (rule).
  *   **Reputation:** In repeated games, your 'code' is your history. But in a one-shot, only verifiable commitment works.

  ---

  ### IV. Troubleshooting: What Will Go Wrong

  **1. The "Klutz" / Masquerade Strategy**
  *   **The Move:** A CS minor writes: `IF SIMULATING_ME THEN PLAY D ELSE PLAY C`.
  *   **The Effect:** This rule cooperates with you (when you run it) but defects when you simulate it (if your simulation detects it's being simulated).
  *   **The Fix:** Your execution rule (Kernel) must prevent this. **Rule:** "Simulation is opaque. The code being simulated cannot detect it is being simulated." (This is the standard assumption in Program Equilibrium literature, often called "oracle access"). Tell the students this constraint explicitly before Round 2.

  **2. Infinite Recursion**
  *   **The Move:** Student A: `IF SIMULATE_THEM...`. Student B: `IF SIMULATE_THEM...`.
  *   **The Effect:** Volunteer spins out trying to run A running B running A...
  *   **The Fix:** Enforce the **Depth Limit**. "You may simulate them, but their simulation of you returns `D` automatically." This breaks the loop.

  **3. The "Troll" Defector**
  *   **The Move:** Someone writes `PLAY D` in Round 2 and 3 just to ruin the cooperative pool.
  *   **The Fix:** Do not shame them. Use them. "This person is the 'Nature' player. They represent the risk of the outside world. Your `MIRROR` rule correctly identified them as unsafe and defected. That is rational."

  **4. Time Overrun**
  *   **The Risk:** Manual simulation takes too long.
  *   **The Fix:** If Round 2 drags, cut Round 3 pairing. Instead of re-pairing everyone, **you** take one cooperative pair from Round 2, publicly obfuscate one card on the whiteboard, and ask the class: "Does this pair still cooperate?" This makes the point without the logistics.

  ---

  ### V. The Honest Note (Limitations)

  You asked where you might be wrong about what this can show. Here is the philosophical reality check:

  **1. It Does Not Prove Cooperation is *The* Rational Choice.**
  *   You suspect this, and you are right. The activity shows that Cooperation is *an* equilibrium, not *the* equilibrium.
  *   `ALL_D` is still a Program Equilibrium. If I believe you are submitting `ALL_D`, my rational best response is `ALL_D`.
  *   **The Gap:** The seminar shows that transparency *expands* the set of rational equilibria to include Cooperation. It does not solve the **Equilibrium Selection Problem**. Why should we expect to land on the Cooperative Equilibrium rather than the Defective one?
  *   **Answer:** Evolution, culture, or focal points. The code doesn't decide that; the history of the agents does.

  **2. The "Source Code" Assumption is Heavy.**
  *   Program Equilibrium relies on the assumption that I can read your source code (or simulate it perfectly) before I act.
  *   In human interaction, this is "Mindreading" or "Theory of Mind." It is imperfect.
  *   In AI/Smart Contracts, this is technically possible but often legally/proprietary restricted.
  *   **Takeaway:** The activity works because you *stipulated* transparency. In the real world, transparency is the scarce resource, not rationality.

  **3. Normative Force vs. Stability.**
  *   You asked if this shows what a rational agent *would* do.
  *   It shows what a rational agent *could* do without regret.
  *   If the class ends with 50% cooperation, a skeptic will say "See? Half were irrational."
  *   **Rebuttal:** The rationality lies in the *conditional*. "I cooperate *if and only if* you do." That conditional rule is the rational unit, not the raw action of Cooperation.

  ### Final Recommendation
  If you run out of time, **sacrifice Round 3's full execution.**
  Run Round 1 and Round 2 fully. For Round 3, simply take one `TEXT_MATCH` card and one `SIMULATE` card from Round 2, rewrite the `TEXT_MATCH` one on the board to show it breaks, and explain that `SIMULATE` survives. This preserves the conceptual payload (Syntax vs. Semantics) without the logistical nightmare of re-running 8 pairs in 15 minutes.

  This seminar works best if the students leave feeling that **rationality is sensitive to the structure of interaction**, not just the payoff matrix. You are teaching them to change the game, not just play it.
