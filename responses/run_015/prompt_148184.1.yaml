          *   Weaknesses: Neurons are fixed in place (mostly), ants move freely. Neurons fire electrically/chemically very fast, ants move slowly. Neurons don't have individual agency in the same way. The Queen misconception needs addressing (she's not the CPU).
      *   **Analogy 2: The Fugue Model.**
