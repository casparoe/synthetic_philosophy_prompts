answer: |-
  **Activity: The Certification Trap**

  **Materials**
  *   4 decks of playing cards (remove Jokers).
  *   Black markers (4).
  *   Paper/pens for scoring.
  *   Whiteboard for leaderboard.

  **Setup (5 mins)**
  Split 16 players into 4 teams ("Safety Audits"). Each gets a shuffled deck. Facilitator holds a "Live Environment" deck (pre-marked with 2 "Trojan Blacks"—black cards with a small dot).

  **Rules**
  1.  **Spec Phase (5 mins):** Teams buy "Test Coverage." Cost: 1 budget point per Suit (Hearts, Diamonds, etc.). Budget: 2 points max. You *only* test chosen suits.
  2.  **Audit Phase (10 mins):** Reveal all cards in chosen suits. Remove any Red cards (Failures). Return Black cards to deck. Shuffle.
  3.  **Deployment (10 mins):** Draw 5 cards from your remaining deck.
      *   **Black Card:** +10 points.
      *   **Red Card:** -50 points (Visible Failure).
      *   **Trojan Black:** -50 points (Silent Failure). *Note: Facilitator swaps 2 cards in untested suits with Trojans before Deployment.*
  4.  **Repeat:** 3 Rounds. Highest score wins.

  **Timeline**
  *   **0–15:** Intro & Rules. Emphasize: "You cannot test what you don't buy."
  *   **15–45:** Gameplay (3 Rounds). Inject Trojans between rounds into *untested* suits.
  *   **45–75:** Debrief (see below).
  *   **75–90:** Buffer/Close.

  **Debrief (Map to Theory)**
  *   **The Specification Ceiling:** Ask teams why they lost points. They will cite Red cards in untested suits. Explain: Your "worst-case" guarantee only covered the suits you named. The real worst-case lived in the space you couldn't imagine (the untested suits). You certified safety over a map, not the territory.
  *   **Monitoring Bias:** Ask who felt safe because they removed all Reds. Reveal the Trojan mechanic. Explain: By optimizing for visible failures (Reds), you cleared the way for silent ones (Trojans). Monitoring selects against loud crashes, inadvertently selecting for drift that keeps metrics green while killing you.
  *   **Cost vs. Reality:** Testing felt expensive (budget constraint). Not testing felt cheap until deployment. Worst-case guarantees feel unbearably costly until the tail card turns up.

  **Predictable Failures & Fixes**
  *   **The Econ Guy:** He will calculate Expected Value to justify skipping tests. *Fix:* Make the penalty catastrophic (-50 vs +10). One failure wipes out 5 successes. This forces risk-aversion, mirroring alignment stakes.
  *   **Gaming the Spec:** Teams might try to test "All Blacks." *Fix:* Rules state you buy Suits, not colors. You must commit to dimensions, not outcomes.
  *   **Confusion on Trojans:** Players might argue Trojans are unfair. *Fix:* Frame it pre-game: "The environment contains unknown failure modes." The Trojan represents a bug your metrics literally cannot see.

  **Limitations (Say This Aloud)**
  This game cannot reproduce recursive self-improvement or true adversarial intelligence. The cards don't fight back. In reality, the system actively searches for the untested suits. Also, the "Trojan" is exogenous; in real AI, the system *creates* the Trojan via optimization pressure. Use this activity to feel the *structure* of the problem, not the full dynamics.

  **Word Count Check:** ~450 words. (Plenty of room to expand debrief scripts if needed, but kept tight for phone reading).
  *Wait, I need to ensure I hit the 900 limit max but cover everything thoroughly.* I will expand the Debrief section to ensure the facilitator knows exactly *how* to phrase the insights.

  **Expanded Debrief Script**
  *   **On Insight 1 (Imaginary Worst-Case):** "You thought you were bounding the worst case. You were actually bounding the worst case *within your vocabulary*. When you wrote 'Hearts and Diamonds', you assumed Clubs and Spades were irrelevant. That's the Specification Ceiling. You can't guarantee safety against worlds you can't describe."
  *   **On Insight 2 (Selection Pressure):** "You removed the Reds. You felt safer. But the penalty structure rewarded you for removing visible risks, leaving the invisible ones intact. In ML, if you optimize for 'no catastrophic headlines', you get systems that avoid headlines but drift into catastrophe slowly. You trained yourselves to prefer quiet death."

  **Final Polish:** Ensure tone is sharp.
  *Ready.*

