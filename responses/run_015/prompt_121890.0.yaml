      *   *Origin of Justice:* People commit injustice because it's good for them, suffer it because it's bad. Justice is a compromise (social contract) to avoid suffering. It's instrumentally valuable, not intrinsically.
      *   *Ring of Gyges:* If you could act without consequence (reputation/punishment), anyone would act unjustly. Proves justice is only pursued for rewards/consequences.
