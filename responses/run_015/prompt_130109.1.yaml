      Angier's tank creates a hard discontinuity: the original drowns, the clone survives. Under psychological continuity theories, the clone *is* Angier (same memories), but biological essentialists argue the original dies permanently. If Angier underwent gradual replacement—neurons swapped for silicon over years—functionalists would claim identity persists through the transition, avoiding the "branching" horror. However, this relies on the contested assumption that substrate doesn't matter. Critics argue qualia might fade during the swap, meaning the gradual version could be a philosophical zombie long before the last biological bit rots. The film's instant duplication forces a binary choice—life or death—whereas gradual replacement obscures the moment of cessation, potentially masking death rather than preventing it.

