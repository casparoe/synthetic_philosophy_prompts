  2.  **Deconstruct the Philosophical Angles:**
      *   *Instant Copy (Film):* Psychological continuity theory vs. Biological continuity. The film posits a hard break; the original dies every time. This aligns with the "Branching Problem" or "Non-Identity" view.
      *   *Gradual Replacement:* Functionalism vs. Substrate Dependence. If replaced chip-by-chip, functionalists argue identity persists; biological essentialists argue it fades.
      *   *Contested Ground:* There is no consensus on whether psychological continuity equals personal identity. The "fading qualia" argument (Chalmers) is contested.
      *   *Film's Resistance:* Nolan focuses on the *cost* of the trick (sacrifice/obsession), not just the metaphysics. The horror is the *witnessed* death, not just the ontological status.

