answer: |-
  Daniel Dennett's doctrine of "Real Patterns" is an ambitious attempt to reconcile a physicalist ontology with the apparent reality of higher-level phenomena, such as beliefs, desires, and functions. By invoking information theory, Dennett suggests that a pattern is "real" if it offers a compression-optimal description of a system's behavior—that is, if attributing the pattern allows an observer to predict the system's future states more efficiently than any competing description. On this view, the Intentional Stance (attributing beliefs and desires) is not merely a useful fiction but captures something objectively present in the world, provided it wins the competition for compressive efficiency against the Physical and Design Stances.

  However, this argument fails to secure the ontological objectivity Dennett intends. The claim that "real patterns" are mind-independent features of the world collapses under the scrutiny of how compression is actually calculated. Compression is not a monolithic property of data; it is the result of a trade-off between model complexity and predictive accuracy. There is no interest-independent fact about how to weight these two virtues against one another. Because the "best" compression is determined by a scoring function that reflects the observer's values and constraints, the resulting patterns are relative to our modeling interests. Consequently, "real patterns" are not discoveries of mind-independent structure but projections of our predictive practices.

  ### The Indeterminacy of Compression

  To understand why compression cannot ground mind-independence, we must look at the mechanics of model selection. In algorithmic information theory and statistical learning, a "compression-optimal" description is rarely the absolute shortest string of bits that reproduces the data exactly. If it were, the only truly optimal description of a complex physical system would be the system itself, or a lookup table of its entire history, which offers no predictive gain for new data.

  Instead, practical compression involves lossy coding. We seek a model $M$ that minimizes a total cost function, typically expressed as:

  $$ \text{Cost}(M) = \text{Length}(M) + \lambda \times \text{Error}(Data | M) $$

  Here, $\text{Length}(M)$ represents the complexity or brevity of the description (the Intentional, Design, or Physical account), and $\text{Error}$ represents the deviation between the model's predictions and the actual data. The crucial variable is $\lambda$ (lambda), the weighting parameter that determines how much predictive accuracy we are willing to sacrifice for the sake of brevity.

  Dennett's account implies that there is a unique, objective winner among the Three Stances. However, information theory provides no formula for $\lambda$. There is no "fact of the matter" in the universe about whether a 1% increase in predictive error is worth a 50% reduction in model complexity. That trade-off is determined by the *purpose* of the modeling. If the cost of a prediction error is high (e.g., guiding a surgical robot), we weight accuracy heavily, favoring the Physical Stance. If the cost of computational delay is high (e.g., navigating a crowded sidewalk), we weight brevity heavily, favoring the Intentional Stance.

  Because the choice of $\lambda$ is not dictated by the data but by the observer's constraints and goals, the designation of a pattern as "real" (i.e., optimal) is relative to the scoring function employed. If the scoring function is mind-dependent (rooted in human interests, cognitive limitations, and values), then the patterns it selects are likewise mind-dependent.

  ### The Relativity of "Real" Patterns

  This indeterminacy undermines the claim that Real Patterns are ontologically objective. If the reality of a pattern depends on the scoring function, and the scoring function depends on what we care about, then the pattern is not a feature of the world *simpliciter*, but a feature of the world *as modeled by us*.

  Dennett wishes to say that beliefs are real because the Intentional Stance is the best compression. But "best" is a comparative term that requires a metric. Without a god's-eye metric for trading off simplicity against accuracy, we are left with a plurality of admissible scoring functions. Under a scoring function that prioritizes microscopic precision, the Intentional Stance is a "lossy" distortion, and beliefs disappear. Under a scoring function that prioritizes social navigability, beliefs are robust, high-fidelity objects.

  Therefore, the set of Real Patterns a system possesses is not fixed by the system's intrinsic structure alone. It is co-determined by the values we bring to the task of modeling. This makes the Intentional Stance a useful projection rather than a mind-independent discovery. It is "real" only in the sense that it is indispensable for *our* specific kind of interaction with the world, not because the world is constituted by beliefs and desires.

  ### Case Study: The Thermostat and the Human

  To make this abstraction concrete, consider the contrast between a thermostatically controlled room and a human agent. Dennett often uses the thermostat to show that we *can* take the Intentional Stance toward simple machines (e.g., "It wants the room to be 70 degrees"), but we usually don't because the Physical or Design Stance is cheap enough. Conversely, with humans, we *must* take the Intentional Stance because the Physical Stance is computationally intractable.

  On the surface, this suggests a difference in the objects: the human is complex enough to "support" real intentionality, while the thermostat is not. However, viewed through the lens of the scoring function trade-off, the difference lies not in the objects, but in our interests.

  **The Thermostat:**
  Imagine we are engineers designing a climate control system. Our scoring function places a massive penalty on error ($\lambda$ is high) because a malfunction could freeze pipes. We also have access to the schematics, making the Physical/Design description relatively short. Under this scoring function, the Intentional Stance ("It believes it is cold") is sub-optimal. It is too vague (high error) and offers no brevity advantage over the circuit diagram. Thus, under this interest-relative metric, the thermostat's "beliefs" are not Real Patterns.

  Now, imagine a child interacting with a smart home interface. For the child, the circuitry is incomprehensible (infinite Length for the Physical Stance). The scoring function values usability over precision. The description "The house wants it warm" is extremely short and predicts the furnace's activation well enough for the child's purposes. Under *this* scoring function, the thermostat's intentionality is a Real Pattern. The ontology of the thermostat shifts based on the user's cognitive constraints.

  **The Human Agent:**
  Now consider a human being. In everyday social life, our scoring function values rapid prediction of behavior over neuronal precision. The Physical Stance (tracking $10^{14}$ synapses) is computationally impossible for us, resulting in an effective "Length" of infinity. The Intentional Stance ("She is angry") is short and predicts behavior with sufficient accuracy for social coordination. Thus, beliefs emerge as Real Patterns.

  However, change the scoring function. Suppose we are neurosurgeons stimulating a brain to map motor functions. Here, the cost of error is paralysis. The Intentional Stance ("He wants to move his hand") is too coarse; it cannot predict which specific neurons will fire. The Physical Stance becomes the compression-optimal description because the "cost" of the Intentional Stance's error is now unacceptable. In the operating room, the patient's "beliefs" cease to be Real Patterns in favor of electrochemical potentials.

  **The Implication:**
  If the "reality" of the intentional description fluctuates based on whether we are engineers, children, friends, or surgeons, then the intentionality is not an intrinsic property of the system. The human and the thermostat are both physical systems. The difference in their status as "intentional systems" is not a difference in their metaphysical composition, but a difference in the *cost-benefit analysis* of the observers modeling them.

  The Intentional Stance is not "real" because the world contains beliefs; it is "real" because creatures like us, with our specific cognitive limitations and social needs, find that weighting brevity over microscopic accuracy yields the best survival strategy.

  ### Conclusion

  Dennett's compression-optimality criterion was intended to rescue the objectivity of the special sciences and folk psychology from the charge of being mere "useful fictions." He wanted to show that beliefs are as real as centers of gravity or hurricanes. However, by grounding reality in compression, he inadvertently grounded it in the metrics of compression. Since there is no interest-independent fact about how to trade predictive accuracy for brevity, there is no interest-independent fact about which stance is "optimal."

  The choice of a scoring function is a pragmatic decision, reflecting what we value in prediction: do we value precision, speed, cognitive ease, or control? Because the set of Real Patterns is relative to this choice, patterns are not mind-independent features of the world waiting to be discovered. They are projections of our predictive practices, crystallized by the specific values we impose on the data. The Intentional Stance, therefore, does not reveal the metaphysical furniture of the universe; it reveals the contours of our own cognitive and practical engagement with it. "Real Patterns" are indeed real, but their reality is immanent to our practices, not transcendent of them.
