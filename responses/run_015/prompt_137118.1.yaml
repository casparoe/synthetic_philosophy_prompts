answer: |-
  **Mark: 11/20**

  **Breakdown:**
  *   **(a) 2/6:** Correctly states the linear form and the existence of weights. **Major error** on the relationship between weights and affine transformations (claims independence where there is dependence).
  *   **(b) 2/6:** Correctly identifies the Impartial Observer setup. **Major error** on the necessity of normalization/interpersonal comparability (claims probabilities alone settle the weights). Irrelevant invocation of the Repugnant Conclusion.
  *   **(c) 7/8:** Strong answer. Correctly identifies the vNM Independence axiom as the substantive ethical assumption. Accurately deploys Diamond's critique.

  ---

  ### Marginal Comments (Keyed to Text)

  **Part (a)**
  > *"Crucially this is independent of how we have scaled each person's utility function — the affine uniqueness of the u_i is already built into the representation, so rescaling u_i doesn't change what the weights say."*

  **Comment:** **Incorrect.** This is the critical error in the answer. If $u_i$ is rescaled (e.g., multiplied by 2), the weight $a_i$ must be halved to represent the *same* social ordering. The ratio of weights $a_i/a_j$ is not invariant to independent rescalings of $u_i$ and $u_j$. The theorem does **not** provide interpersonal comparisons "for free"; it requires a normalization convention (fixing zero and unit) before the weights have moral meaning.

  > *"That is why the theorem is so striking: it hands you interpersonal comparisons for free rather than assuming them."*

  **Comment:** **Substantive Error.** Harsanyi's theorem assumes vNM rationality and Pareto; it does *not* derive interpersonal comparability. It derives a weighted sum *given* cardinal utilities, but the weights remain arbitrary until scales are fixed.

  **Part (b)**
  > *"And since, as noted, the weights don't depend on the normalisation of the individual u_i, the argument needs no extra assumption about interpersonal comparability of units — the equal probabilities settle it."*

  **Comment:** **False.** Equal probabilities ($1/n$) applied to unnormalized utilities do not yield equal moral weights. If Person A's utility is measured in "dollars" and Person B's in "cents," equal probability favors A massively. You must fix the interpersonal comparability (normalization) *before* the probability argument yields $a_i = a_j$.

  > *"Harsanyi's framework isn't vulnerable to the repugnant conclusion in the way that total utilitarianism is."*

  **Comment:** **Irrelevant/Confused.** The Repugnant Conclusion (Parfit) applies to variable-population ethics. Harsanyi's aggregation theorem assumes a fixed $n$. Average vs. Total utilitarianism is indistinguishable in a fixed-population setting. This reads like a buzzword drop.

  **Part (c)**
  > *"The heavy lifting is done by requiring the social ordering itself to satisfy the vNM axioms, in particular independence, which forces society to evaluate a lottery as the expected value of a single weighted sum rather than in any other way."*

  **Comment:** **Excellent.** This is the correct interpretation of the critique (often associated with Sen or Weymark).

  > *"Diamond's example makes the point: with one indivisible good and two people, the fair lottery and giving the good to one person for sure have the same sum of expected utilities, so Harsanyi's social ordering is indifferent between them, while an ex post egalitarian strictly prefers the lottery."*

  **Comment:** **Correct.** Clear statement of the Ex-Ante vs. Ex-Post conflict.

  ---

  ### The Counterexample (For your peace of mind)

  You are not inventing problems. The student's claim in (a) and (b) is mathematically false. Here is the numerical proof you can use if they appeal:

  *   **Scenario:** 2 People, 2 Outcomes ($x, y$).
  *   **Scales:** $u_1$ is measured in **units**, $u_2$ is measured in **hundreds**.
      *   $u_1(x)=10, u_1(y)=0$
      *   $u_2(x)=0, u_2(y)=100$ (which is 1 unit of welfare for Person 2)
  *   **Student's Claim:** Set weights $a_1 = 1, a_2 = 1$ (Equal weights via equal probability).
      *   $W(x) = 1(10) + 1(0) = 10$
      *   $W(y) = 1(0) + 1(100) = 100$
      *   **Result:** Society strictly prefers $y$. Person 1 gets nothing, Person 2 gets a "1" (but counted as 100).
  *   **Correction:** Normalize $u_2$ to units ($u_2^* = u_2 / 100$).
      *   $W(y) = 1(0) + 1(1) = 1$.
      *   Now $W(x) > W(y)$. Society prefers $x$.
  *   **Conclusion:** The social ordering flipped solely because of the scaling of $u_2$, despite the weights ($a_i=1$) staying "equal." Therefore, **weights are not independent of scaling.**

  ---

  ### Overall Assessment: "Smooth Memorizer" vs. "Understander"

  **Verdict:** This is the work of someone who has **memorized the shape of the argument without the details.**

  *   **The Prose Trap:** The writing is fluid, confident, and uses the correct terminology ("affine transformation," "independence," "ex post egalitarian"). If you mark fast, this reads like an A-. It creates a "halo effect" where you assume the technical claims support the prose.
  *   **The Reality:** The student understands the *political philosophy* debate (Part (c) is genuinely good) but does not understand the *mathematical object* (the utility function) in Parts (a) and (b). In a graduate seminar, confusing the invariance properties of affine transformations is a fundamental technical failure.
  *   **Grading Implication:** Do not let the prose seduce you. If you give this an A- (16+/20), you validate the misconception that Harsanyi solves interpersonal comparison without normalization. This student is a solid **B-/C+** on this question (11/20). They can talk the talk on the critiques, but they cannot do the math on the theorem itself.

  **TA Advice:** You are right to be worried. This script is designed to fool a tired marker. The errors are not "slips of wording"; they are conceptual reversals (claiming dependence is independence). Mark it down firmly on (a) and (b), and give credit where it is due on (c). If the student complains, show them the counterexample above.
