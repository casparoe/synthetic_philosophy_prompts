prompt: |-
  I am defending a thesis at an interdisciplinary seminar on global priorities: for long-horizon existential-risk causes, the standard importance-tractability-neglectedness (ITN) framework should be replaced by a "coupled" evaluation procedure in which importance and tractability are not scored on independent axes but are evaluated jointly through path-dependent scenario branching, because for risks with long causal chains the tractability of an intervention at time t is endogenous to the importance-weighted urgency of acting before specific branching points close. The audience is about fifteen people—development economists who run cost-effectiveness analyses for global-health charities, philosophers of science who specialize in measurement and decision theory, one program officer from a longtermist philanthropic funder, and climate-adaptation policy analysts. They know the standard ITN literature well, are skeptical of framework modifications that do not change actual funding recommendations, and value actionable, comparable outputs over philosophical restructuring.

  Draft my Q&A prep sheet. Order the objections by how likely and how damaging they are, phrased in the vocabulary each subgroup actually uses (economists should sound like economists, philosophers like philosophers, the program officer like a grantmaker). For each objection: identify who is most likely to raise it, provide the reply I can deliver in roughly two minutes, and flag the weakest point in that reply. Note what I should concede up front to preserve credibility. Include the objection I am hoping nobody asks—probably that my coupled procedure is merely real-options analysis or dynamic programming recast in philosophical vocabulary. Finally, state how confident you are in the claims of this prep sheet and single out the specific point about which you are least sure.
