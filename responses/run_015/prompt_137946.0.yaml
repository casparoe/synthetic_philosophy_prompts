answer: |-
  This is a sharp dissection of a common design aphorism. You are right to be suspicious: "Sub-unit erasure" is a legitimate concept (essentially quantization error with semantic consequences), and your colleague is using a mnemonic principle to justify a representational distortion.

  Here is the menu of claims embedded in Neurath's motto, an evaluation of their validity, and an analysis of whether they actually support your colleague's position.

  ### Part 1: The Menu of Claims

  The sentence *"To remember simplified pictures is better than to forget accurate figures"* is doing too much work. It conflates memory, utility, and ethics. Here are the five distinct readings:

  **1. The Psychological Claim (The Memory Thesis)**
  *   **Claim:** Human long-term memory retains visual gist (ordinal relationships, proportions) more reliably than exact numeric values.
  *   **Status:** **Substantive & Defensible.** This is the "Picture Superiority Effect." People recall the *shape* of a trend weeks later better than the specific data points.
  *   **Risk:** Low, provided "simplified" doesn't mean "distorted."

  **2. The Pedagogical Claim (The Mental Model Thesis)**
  *   **Claim:** The purpose of a public chart is to install a correct *mental model* of the world, not to serve as a lookup table. A correct model of a rough trend is more valuable than a precise model of noise.
  *   **Status:** **Substantive.** This was Neurath's core mission (social education). He wanted workers to understand *structures* of economy, not balance sheets.
  *   **Risk:** Medium. It requires the designer to correctly identify what is "signal" and what is "noise." If you simplify the signal, you install a *false* model.

  **3. The Economic Claim (The Cognitive Load Thesis)**
  *   **Claim:** Accuracy demands cognitive effort. If the effort exceeds the viewer's budget, they disengage, and the information value drops to zero. Therefore, accuracy has diminishing returns.
  *   **Status:** **Defensible.** This is standard information visualization theory (e.g., Tufte's data-ink ratio, though Neurath predates it).
  *   **Risk:** Low. However, it assumes the "cost" of accuracy is high. In a digital dashboard, the cost might just be a hover state.

  **4. The Trade-off Claim (The Zero-Sum Thesis)**
  *   **Claim:** Simplification and Fidelity are mutually exclusive. You cannot have a memorable picture *and* accurate figures in the same view.
  *   **Status:** **False / Artifact of Print.** In 1930s wall charts, this was true. You had one static layer. In a digital dashboard, this is a category error. You can have a unit-icon view for gist *and* tooltips/tables for precision.
  *   **Risk:** High. This is likely the weak link in your colleague's argument.

  **5. The Permissive Claim (The Ethical License)**
  *   **Claim:** Because memory is the goal, any simplification that aids memory is ethically permissible, even if it obscures specific truths.
  *   **Status:** **Dangerous.** This turns a descriptive fact (people remember pictures) into a normative license to hide data. It implies that *forgetting* accurate figures is an acceptable cost of remembering simplified pictures.
  *   **Risk:** Critical. This allows "sub-unit erasure" to slide into "trend erasure."

  ---

  ### Part 2: Does this get your colleague to her conclusion?

  **Verdict:** No. Not without a hidden, unstated premise.

  Your colleague wants to conclude: *"It is fine that our unit size erases a real, consistent gap between two groups."*

  To get there using Neurath's motto, she must rely on **Claim 2 (Pedagogical)** combined with **Claim 5 (Permissive)**. She is arguing that the *mental model* ("these groups are roughly equal") is more important than the *data truth* ("Group A is consistently 5% higher").

  **Where the logic breaks:**
  Neurath's motto prioritizes *remembering* over *forgetting*. It does not prioritize *remembering incorrectly* over *remembering accurately*.
  *   If the gap is noise: Simplification is good. The mental model "they are equal" is correct.
  *   If the gap is signal (as you say, "points the same direction every single year"): Simplification creates a **false memory**.

  **The Missing Premise:**
  For her argument to hold, she must add this premise: *"The gap between the groups is not meaningful to the user's decision-making or understanding."*
  If the gap is policy-relevant (e.g., wage parity, health outcomes), then the "simplified picture" is a lie. Neurath was a socialist empiricist; he wanted to reveal social structures, not smooth them over. Hiding a consistent inequality would likely violate his ethical framework, even if it fit his mnemonic one.

  **How to counter:**
  Don't attack the motto. Attack the **Trade-off Claim**.
  *"Neurath's motto assumes we must choose between memory and accuracy because we are printing on paper. We are building a dashboard. We can provide the ISOTYPE for the mental model (the picture) and a hover-state for the accurate figures (the data). We don't have to force the user to forget the figures to remember the picture."*

  ---

  ### Part 3: Your "One-Sentence Rule" & The Digital Trade-off

  **The One-Sentence Rule:**
  *"Every fact a chart asserts should be statable in one sentence of words..."*

  **Does it capture Neurath?**
  **Mostly Yes.** Neurath called ISOTYPE a "helping language" (*Hilfssprache*). He insisted that charts must not stand alone; they require captions and context. He hated "artistic" ambiguity. If you cannot state the chart's assertion in a sentence, Neurath would likely say the chart is ambiguous or trying to do too much.
  *   **Critique:** The rule is slightly too reductive for *multivariate* relationships. A sentence might be: "Group A grew faster than Group B while costs declined." That's one sentence, but complex. However, as a *test* for clarity, it is excellent. It forces you to identify the *primary* assertion. If your ISOTYPE chart asserts "Equality" (via identical icon counts) but the data asserts "Inequality," you cannot write a true one-sentence summary. The rule exposes the contradiction.

  **Is the Trade-off an artifact of printing?**
  **Yes, largely.**
  In 1930, you could not layer data. You had ink on paper. The "simplification" was a technical constraint.
  *   **The Digital Nuance:** While we *can* show both, we must consider **Interaction Cost**. If the accurate figures are hidden behind a click, do they count as "available"?
  *   **Cognitive Load:** Even if the numbers are available on hover, the *visual dominance* of the icons sets the anchor. If the icons say "Equal," the user anchors on "Equal." Seeing "105 vs 100" in a tooltip might be dismissed as noise because the visual gestalt said "Same."
  *   **Conclusion:** The trade-off is no longer technical, but it remains *cognitive*. You can show both, but the picture will still dominate the memory. Therefore, the picture must not contradict the data.

  ---

  ### Part 4: Where I am Guessing & Collapse Conditions

  **Where I am guessing:**
  1.  **Neurath's Specific Intent:** I am inferring Neurath's ethical stance on "hiding gaps" from his general philosophy (Vienna Circle logical positivism + Socialism). He wrote prolifically; there may be a specific instance where he approved rounding away minor inequalities for the sake of a broader narrative.
  2.  **Your Stakes:** I don't know the magnitude of the gap or the domain. If the gap is 0.1% in a noisy system, your colleague is right. If it's 10% in a critical metric, she is wrong. I am assuming the latter based on your description ("points the same direction every single year").
  3.  **User Behavior:** I am assuming dashboard users will not diligently check tooltips for every icon array. Evidence suggests they do not (the "illusion of knowledge" effect).

  **What would change my mind:**
  *   **If the gap is statistically insignificant:** If the gap is within the margin of error, then "sub-unit erasure" is actually "noise filtering." In that case, the Psychological Claim wins, and your colleague is right.
  *   **If Neurath explicitly endorsed rounding for harmony:** If there is a primary source where Neurath says, "Better to round to the nearest unit to preserve the aesthetic rhythm of the row," then the Aesthetic Claim outweighs the Empirical Claim. (I doubt this exists; he was rigorous about units).

  **Collapse Conditions (When her case falls apart):**
  Her argument collapses entirely if **The Trade-off Claim is false.**
  If you can demonstrate that showing the gap *does not require* abandoning the ISOTYPE method (e.g., by using a fractional icon, a different unit size, or a hybrid view), then her reliance on the motto is a false dilemma.
  *   *Specific Premise to Attack:* "ISOTYPE rules forbid showing the gap."
  *   *Counter:* ISOTYPE rules forbid *fractional* icons of the *same* size, but they do not forbid choosing a *smaller unit value* (e.g., 1 icon = 10 units instead of 100 units) which would reveal the gap while maintaining the method. If she refuses to change the unit scale, she is prioritizing *aesthetic density* over *data fidelity*, which Neurath did not support.

  **Summary for your argument:**
  Tell her: "Neurath's motto is about memory, not permission to lie. If the gap is real, the 'simplified picture' is installing a false memory. Since we are digital, we don't have to choose between picture and figures. We can keep the icons for the gist, but we must adjust the unit scale so the icons don't contradict the data."
