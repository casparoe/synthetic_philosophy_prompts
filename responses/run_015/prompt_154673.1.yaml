      *   *Correction:* The circle is: We know the record is reliable *because* entropy increases. We know entropy increases *because* records are reliable.
      *   The activity needs to isolate the "Record Reliability" assumption.

      *(Self-Correction on Phase 2)*: Let's make it about *inference*.
      Show a picture of a footprint.
