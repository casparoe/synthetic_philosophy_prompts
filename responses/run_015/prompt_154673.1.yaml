      *   **Host:** Non-expert in physics/philosophy, interested in the direction of time (2 years), believes initial intuition was wrong.
      *   **Audience:** 11-12 adults, wide age range (20s-70s), mostly non-scientific, 2-3 popular physics readers (likely to dominate).
