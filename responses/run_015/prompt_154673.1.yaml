      Everyone says Past.
      Why? Because sand doesn't self-organize into a foot shape.
      But how do you know sand doesn't self-organize? Because you've seen footprints fade, not form.
      That's the circle.
      *Activity:* "The Sand Tray" (using flour or sugar on a tray? Messy for library).
      *Alternative:* "The Stacked Cups."
      Stack 5 cups. Knock them over.
      Take a photo (printed).
