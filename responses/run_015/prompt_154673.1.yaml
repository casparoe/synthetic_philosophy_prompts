          *   *Wait, stronger mechanism:* The "Forged Photo."
          *   Take a Polaroid? Too expensive.
          *   Use a "State Snapshot." A drawing of the card order.
          *   *The Kicker:* The Facilitator (Host) secretly alters a record *after* the fact. Can the players tell? No. They only trust it because they trust the *process*, which assumes time flows forward.

      *   *Refining Phase 2 for the "Circular Causation" point:*
          *   We need to show that a "trace" is only a trace if we assume the past was lower entropy.
          *   Activity: "The Broken Vase" (metaphorical).
          *   Let's use *Dominoes* or *Stacked Cups*.
          *   Setup: A stack of cups.
          *   Event: They fall.
          *   Record: A photo (printed beforehand) of the cups on the floor.
          *   Challenge: Did the photo capture the *result* of a fall, or was it the *setup* for a stack?
          *   Visually, a stack is "ordered," a pile is "disordered."
          *   If I show you a picture of a pile, you assume it *was* a stack. Why? Because piles don't become stacks spontaneously.
          *   If I show you a picture of a stack, you assume it *will* become a pile.
          *   *The Trap:* What if the picture of the pile was made by carefully placing cups there (high effort)? It looks the same.
          *   *Implementation:* Teams create a "mess." Then they create a "fake mess" (carefully arranged to look random).
