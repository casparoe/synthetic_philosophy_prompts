  6.  **Fleshing out the Mechanics (Self-Correction during drafting):**

      *   *Critique of Card Betting:* If they bet statistically, they say "more mixed" for both. If they bet intuitively, they say "more ordered" for past. The tension is the key.
      *   *Critique of Trace:* How to make the "forgery" possible in a library?
      *   *Solution:* Use "The Logbook."
