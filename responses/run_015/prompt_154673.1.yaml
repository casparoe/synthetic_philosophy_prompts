      *   Setup: A table with scattered papers.
      *   Task: Reconstruct what happened.
      *   Twist: I (Host) arranged the scatter to *look* like a knock-over, but it was placed one by one.
      *   Teams must decide: Is this a trace of an event (knock over) or a deliberate arrangement?
      *   They can't tell by looking. They only know because I told them "I walked in and knocked it."
      *   This proves the "Trace" relies on external causal assumption.

  7.  **Finalizing the Plan (The "Archivist's Wager"):**

      *   *Materials:* 4 decks of cards, 4 plastic cups, 20 sheets of paper, pens, tape, 4 envelopes.
      *   *Phase 1:* The Card Wager. (Order -> Disorder).
      *   *Phase 2:* The Cup Crime. (Traces & Causation).
      *   *Debrief:* Mapping the feelings.

  8.  **Addressing the "Physics Bros":**
      *   Give them a specific job: "The Auditors." They ensure rules are followed but are forbidden from using physics terms. If they slip, they owe the group a cookie (or similar light penalty).
      *   Actually, better: Ask them to lead the *debrief questions* but not answer them.

  9.  **Addressing Limitations:**
      *   Cards aren't molecules.
      *   Human agency (shuffling) vs. random collision.
      *   The "Past Hypothesis" is a cosmological claim, not a card claim.

