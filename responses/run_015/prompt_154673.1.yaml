          1.  The puzzle isn't why disorder increases, but why it started ordered (Past Hypothesis).
          2.  The asymmetry is twofold: Thermodynamic (mess after tidy) AND Epistemic (traces of past, not future).
          3.  The suspicion: Explaining traces via thermodynamics might be circular (begging the question on causation).
      *   **Constraints:** No lecture until last 20 mins. No "entropy/second law/arrow of time" until the end. Activity-driven discovery.
      *   **Deliverables:**
          1.  Rules/Materials/Setup (cheap, reproducible).
          2.  Minute-by-minute timeline.
          3.  Mechanism for Lesson 1 (Order/Disorder asymmetry).
          4.  Mechanism for Lesson 2 (Traces/Records reliability).
          5.  Debrief strategy (questions, not assertions).
