      *   Round 2: Team A writes down top 3 cards *first*, then shuffles to match? No, too hard.
      *   *Better:* "The Time Capsule."
      *   I (Host) prepare two envelopes.
      *   Envelope A: Contains a note saying "The deck was sorted."
      *   Envelope B: Contains a note saying "The deck will be sorted."
