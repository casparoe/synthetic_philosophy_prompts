answer: |-
  This is a sophisticated pedagogical challenge. You are asking students to suspend a deeply ingrained intuition (Causal Decision Theory) in favor of a counter-intuitive one (Evidential Decision Theory/Superrationality) within a single session. The risk is that the game feels like a trick, reinforcing their cynicism rather than challenging their theory.

  Below is a refined design. I have modified your third condition slightly to prevent it from collapsing into a negotiation game (which would validate iterated reasoning rather than superrationality). I have also added specific scripting to handle the "fiction" of symmetry honestly.

  ### Activity Title: The Mirror Protocol

  **Class Size:** 14 Students (7 Pairs)
  **Time:** 90 Minutes
  **Payoffs:** Course bonus points (e.g., 10 points total per round, convertible to final grade % or exemption from a short assignment). *Crucial: The stakes must be high enough to induce anxiety, low enough to avoid genuine distress.*

  **The Payoff Matrix (Projected & on Handouts):**
  *   **Cooperate / Cooperate:** 3 points each (Reward)
  *   **Defect / Defect:** 1 point each (Punishment)
  *   **Defect / Cooperate:** 5 points for Defector, 0 for Cooperator (Temptation/Sucker)

  ---

  ### Part 1: Timeline & Procedure

  #### 0:00 – 0:10: Setup & Framing
  *   **Seating:** Arrange chairs in 7 pairs, spaced widely apart. If possible, place a physical barrier (folder/cardboard) between pairs so they cannot see each other's hands.
  *   **Materials:** Each student gets a "Decision Packet" containing 3 colored slips (Blue, Red, Green) and 3 envelopes.
  *   **The Contract:** Explicitly state: "Silence is mandatory. Phones away. Looking at another pair's materials results in disqualification from payoffs. The only information you have is what is on your sheet."

  #### 0:10 – 0:25: Round 1 (The Causal Baseline)
  *   **Framing:** "Standard Anonymous Play. You are paired with another student in this room. You do not know who. They do not know you. You will never know who they were. Make your choice."
  *   **Action:** Students mark **C** or **D** on the **Blue Slip**. They seal it in the Blue Envelope.
  *   **Collection:** Collect all envelopes. Shuffle them visibly. (This reinforces anonymity).
  *   **Outcome:** Do *not* reveal results yet. Tell them results will be aggregated at the end. This prevents immediate regret/celebration from influencing Round 2.

  #### 0:25 – 0:45: Round 2 (The Superrational Frame)
  *   **Framing:** This is the critical intervention. Do not lie and say they are clones. Use the *Normative Symmetry* frame.
  *   **Script:** "In this round, you are paired with a 'Logical Twin.' This does not mean they are your biological duplicate. It means you are both philosophy majors, sitting in the same room, hearing the same instructions, facing the same matrix, with the same incentive to maximize points.
      *   **The Premise:** If there is a uniquely rational solution to this problem, *you will both find it*. If you reason your way to Cooperate, a rational twin must also reason to Cooperate. If you reason to Defect, they must Defect.
      *   **The Task:** Your choice is now *evidence* of their choice. You are not causing their move, but your reasoning process is identical to theirs. Act accordingly."
  *   **Action:** Students mark **C** or **D** on the **Red Slip**. Seal in Red Envelope.
  *   **Collection:** Collect and shuffle.

  #### 0:45 – 1:05: Round 3 (The Transparency of Reason)
  *   **Critique of your original idea:** If students exchange reasoning *before* choosing, they will negotiate ("I'll write that I cooperate if you do"). This turns the one-shot into a coordination game, muddying the superrational water.
  *   **Refined Design:** They must commit to the reasoning *simultaneously* with the choice, then reveal. This tests the *correlation of thought* without allowing communication.
  *   **Framing:** "In this round, we test the mechanism of the 'Logical Twin.' You will write your choice *and* a 3-sentence justification on the **Green Slip**. You will seal the choice in the envelope, but hand the justification to me."
  *   **Action:**
      1.  Students write Choice (sealed) and Reasoning (open).
      2.  Instructor collects Reasoning slips.
      3.  Instructor immediately pairs them (e.g., Student 1 reads Student 2's reasoning aloud to Student 1, and vice versa).
      4.  *Crucially:* They do this *after* sealing their choice but *before* the final reveal of outcomes.
  *   **Purpose:** This forces them to witness whether their partner's *logic* mirrored their own. If Student A defected because "CDT is dominant" and reads that Student B defected because "CDT is dominant," the superrational link is viscerally confirmed, even if the outcome was suboptimal.

  #### 1:05 – 1:30: The Reveal & Debrief
  *   **Scoring:** Open envelopes. Tally points on the board anonymously (e.g., "Pair 1: D/D", "Pair 2: C/D").
  *   **Discussion:** (See Debrief Guide below).

  ---

  ### Part 2: Predictable Failure Modes & Mitigation

  **1. The "Spites" (Strategic Defection in Round 2)**
  *   **What happens:** A student thinks, "I know what the professor wants (Cooperate). I will Defect to prove CDT is still right," or "I will Defect to punish the group for being naive."
  *   **Result:** High rate of D/D or D/C in the "Superrational" round, undermining the lesson.
  *   **Mitigation:** Pre-empt this in the framing. Say: *"Defecting in Round 2 to 'prove a point' is logically inconsistent with the premise of the round. If you reject the premise, you are playing Round 1 rules. But if you reject the premise, you must acknowledge that your partner might also reject it, leading to D/D. The only way to 'win' Round 2 is to accept the symmetry."*
  *   **In Debrief:** If someone defected, ask them: *"Did you assume your partner would reason differently than you?"* If yes, they admit they broke the symmetry condition. If no, they admit they prefer 1 point (D/D) over 0 points (Sucker), which is risk-aversion, not rationality.

  **2. The "Cynic" (Framing Collapse)**
  *   **What happens:** A student says, "This is fake. We aren't twins. I know I'm me and they're them."
  *   **Mitigation:** Agree with them. *"You are correct. Biologically, you are distinct. But logically, are you distinct? If 2 + 2 = 4 for you, is it 5 for them? If the rational move is X for you, why is it Y for them?"* Shift the debate from *metaphysical identity* to *logical convergence*.
  *   **Rule:** If a student vocalizes this during the game, warn them once. If they persist, they sit out the round (forfeit points). This protects the "magic circle" of the experiment for the other 12 students.

  **3. The "Whisperers" (Communication Leakage)**
  *   **What happens:** In a small room, coughs, eye contact, or whispering occurs.
  *   **Mitigation:** Use the "Traffic Light" system. Put a red card on your desk. If anyone speaks, the round is voided for *everyone*. This creates peer pressure to enforce silence.

  **4. Payoff Irrelevance**
  *   **What happens:** Students treat points as abstract.
  *   **Mitigation:** Make the reward immediate and tangible. "The top 3 pairs get a 5-point bonus on the final paper." "Anyone who Cooperates in Round 2 gets a piece of high-quality chocolate." (Tangible rewards often trigger more visceral reactions than abstract points).

  ---

  ### Part 3: The Debrief Guide (Mapping Experience to Theory)

  Do not just lecture. Use their data.

  **1. The Causal Intuition (Round 1)**
  *   **Ask:** "Show of hands, who Defected in Round 1?" (Likely most).
  *   **Theory:** This is **Causal Decision Theory (CDT)**. My choice cannot *cause* theirs. The cards are already dealt in their mind. Dominance reasoning applies.
  *   **Validation:** Acknowledge this is the standard view. It feels safe.

  **2. The Evidential Shift (Round 2)**
  *   **Ask:** "Who changed their move in Round 2? Why?"
  *   **Theory:** This is **Evidential Decision Theory (EDT)**. My choice is *news* about what a rational agent does in this situation. If I Cooperate, it is highly probable the "Logical Twin" Cooperates.
  *   **Key Question:** "Did anyone feel *anxious* cooperating in Round 2? Why?"
      *   *Answer:* Because you still felt the causal pull (fear of being a sucker). Superrationality requires overriding the causal fear with evidential hope.

  **3. The Reasoning Mirror (Round 3)**
  *   **Ask:** "When you read your partner's reasoning, was it similar?"
  *   **Point:** If Pair 4 both wrote "I defect because it's dominant," they achieved **Symmetry of Reasoning** but failed **Superrationality**. They proved they are twins, but twins who walk off a cliff together.
  *   **Point:** If Pair 2 both wrote "I cooperate because we are symmetric," they validated Hofstadter.
  *   **The Trap:** If one Cooperated and one Defected, the "Logical Twin" premise was falsified *for that pair*. Ask the Cooperator: "Did you feel betrayed?" Ask the Defector: "Did you realize you broke the symmetry?"

  **4. Addressing Iteration**
  *   **Student Objection:** "I cooperated because I hoped we'd do this again."
  *   **Rebuttal:** "There is no Round 4. The game ends today. If you cooperated based on future reputation, you made an error in the game rules. Superrationality must work in the *one-shot*."

  ---

  ### Part 4: Honest Assessment of Limitations

  You asked for honesty about what the game cannot do. You must convey this to the students in the final 5 minutes, or they will leave thinking Superrationality is just a "classroom trick."

  **1. The Fiction of Symmetry**
  *   **The Limit:** In the game, the symmetry is stipulated by *you* (the professor). In the real world, I never know if my opponent is a superrationalist.
  *   **The Lesson:** Superrationality is not a universal strategy; it is a **coordination equilibrium among a specific subset of agents**. It only works if I know *you* know *I* know we are both superrationalists.
  *   **Debrief Line:** "This game worked because I told you to treat each other as twins. In the real world, the hard part isn't the reasoning; it's knowing who else is capable of this reasoning. Hofstadter's theory requires a community of mind, not just a logical argument."

  **2. The Metaphysical Gap**
  *   **The Limit:** Students are not computers running the same source code. They have different risk tolerances, different moral commitments, and different grades at stake.
  *   **The Lesson:** CDT is robust against difference; EDT is fragile. CDT works even if your opponent is irrational. EDT collapses if the symmetry breaks.
  *   **Debrief Line:** "CDT is a shield; it protects you from fools. EDT is a bridge; it connects you to peers, but leaves you exposed if the other side isn't built the same way."

  **3. Condition 3 Critique**
  *   **Recommendation:** I strongly advise **against** having them exchange reasoning *before* choosing (as originally imagined).
  *   **Why:** If I read your reasoning before I choose, I can condition my choice on yours ("Oh, you're going to Cooperate? Then I'll Defect to get the 5 points"). This reverts the game to CDT with perfect information, which *always* yields Defection.
  *   **Fix:** Stick to the **Post-Hoc Reveal** (Write Reasoning + Choice -> Seal Choice -> Swap Reasoning). This allows them to see the *correlation* without allowing the *exploitation*.

  ### Summary of Refinements to Your Plan
  1.  **Condition 3 Modified:** Reasoning is exchanged *after* the choice is sealed to prevent conditional negotiation.
  2.  **Framing:** Shift from "You are clones" (false) to "You are logical mirrors" (normative).
  3.  **Payoffs:** Ensure they are tangible enough to create tension.
  4.  **Debrief:** Explicitly distinguish between "Symmetry of Outcome" (we both did C) and "Symmetry of Reasoning" (we both did C *because*...). Superrationality requires the latter.

  This structure respects the students' intelligence by not asking them to believe a lie, while forcing them to inhabit the logical space where Superrationality becomes the only move that makes sense *if* you accept the premise.
