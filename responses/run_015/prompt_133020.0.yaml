  1. Core commitments restated (approx. 150 words)
  Standard lexical threshold negative utilitarianism (LTNU) asserts that suffering beyond a specific intensity lexically outweighs any amount of pleasure, universally. Your qualified view retains the core negative utilitarian commitment that suffering reduction is primary but diverges significantly via two amendments. First, lexical priority is restricted intra-modally: severe physical suffering outweighs any physical pleasure, but mental suffering and sensory pleasure are commensurable and tradable. Second, the lexical threshold is not fixed but indexed to each subject's experiential baseline. Thus, a stimulus is lexically urgent only if it violates an individual's specific historical norm. This transforms LTNU from an objective universalism into a subjective, modality-sensitive framework, preserving the urgency of acute physical pain while allowing trade-offs in mental domains and accommodating individual tolerance differences.

  2. Decisive defeaters (approx. 300 words)
  Three considerations undermine this position, ranked by severity.
  1. **Fatal: Aggregation Collapse.** Utilitarianism requires interpersonal comparison to aggregate utility. If lexical thresholds are baseline-indexed, there is no common metric. If Agent A's threshold is low and Agent B's is high due to habituation, we cannot objectively compare their suffering. This dissolves the utilitarian calculus into isolated subjective silos, rendering policy impossible. Without a universal standard, "maximizing" relief becomes logically incoherent across subjects. This creates a 'utility monster' problem where those with low thresholds dominate resource allocation regardless of absolute need.
  2. **Fatal: Phenomenological Arbitrariness.** The intra-modal restriction lacks phenomenological grounding. Severe mental anguish (e.g., trauma) often outweighs physical pain. Declaring physical pain lexical while rendering mental suffering commensurable with sensory pleasure contradicts lived experience, where psychological torment can be uniquely disabling. This creates an unjustified hierarchy of suffering types.
  3. **Severely Damaging: The Hardened Victim.** If thresholds track baselines, a torture victim with raised tolerance might fall below the lexical threshold, while a novice crosses it with a pinprick. The view could prioritize the novice's minor pain over the victim's torture. This violates the core negative utilitarian intuition that objective intensity matters more than relative deviation. It suggests that suffering is less real if one is accustomed to it, a conclusion that undermines the protective intent of negative utilitarianism.

  3. Serious but survivable objections (approx. 250 words)
  Several objections are serious but survivable. First, clinical application becomes epistemically burdensome. Doctors would need precise data on patient baselines to determine if pain is lexical, complicating triage. However, defenders can argue that ethical precision warrants this cost, accepting slower decision-making for greater accuracy. Second, interpersonal comparison breakdowns hinder policy. While damaging, a proponent might accept a "rough heuristic" approach for public policy while maintaining strict baseline indexing for ideal theory, arguing that non-ideal theory requires simplification. This admits practical friction without theoretical collapse. Third, the view strains intuitions about sacrificial heroism. If a hero endures physical pain below their high threshold to prevent mental anguish in others, the commensurability clause might forbid this trade if the mental anguish doesn't outweigh the physical cost numerically. This could discourage beneficial sacrifice. Yet, a defender could argue this correctly identifies when sacrifice is truly supererogatory rather than obligatory, preventing exploitation of high-tolerance individuals. Finally, the modality split creates boundary cases, like psychosomatic pain. Defenders can treat these as hybrid cases requiring weighted averaging. These issues increase complexity and counterintuitive results but do not logically invalidate the framework's internal coherence. They merely raise the price of admission for adopting such a nuanced ethical system, demanding more data and philosophical labor than standard utilitarianism but promising a more personalized moral accounting.

  4. What defenders should concede (approx. 200 words)
  A committed proponent must concede specific weaknesses. First, they must admit that epistemic access to baselines is limited, meaning the theory offers less practical guidance than standard utilitarianism. Uncertainty about another's history makes real-time calculation difficult. Second, they must concede that the physical/mental modality split is somewhat arbitrary, acknowledging that psychosomatic conditions blur these lines, requiring ad hoc adjustments for mixed cases. They cannot claim a clean dichotomy exists in biology. Third, they must accept that this view abandons objective universalism; it cannot claim that torture is *always* lexically worse than tickling, only that it is so relative to baselines. Dismissing the aggregation problem as a misreading is impossible; the baseline amendment fundamentally alters the calculus, removing the common currency of utility. They must also concede that this view may justify unequal resource distribution, favoring those with lower thresholds, which conflicts with egalitarian intuitions. However, they can dismiss claims that the view ignores mental suffering, clarifying that mental suffering is still weighted, just not lexically protected against sensory pleasure. Accepting these costs is necessary to maintain the view's focus on subjective experiential reality over objective metrics.

  5. Insulation check (approx. 150 words)
  The combination of intra-modal restriction and baseline indexing risks unfalsifiability. If every counterexample is deflected by claiming a modality boundary was crossed or a baseline parameter was miscalculated, the theory becomes immune to refutation. This is a methodological vice for normative ethics, which must guide action rather than merely describe post-hoc intuitions. However, if baselines are empirically measurable via neuroscience or psychology, the view remains falsifiable. The danger lies in defining baselines introspectively. If the theory relies on subjective self-reporting for thresholds, it loses normative force. Context-sensitivity is a legitimate feature of ethics, but only if the context is objectively identifiable. Without empirical anchors, this qualified LTNU risks becoming a sophisticated rationalization for any outcome.

  6. Bottom-line verdict (approx. 100 words)
  The view is highly exposed, primarily due to the aggregation problem. The single most moving argument is the "Hardened Victim" scenario. If your theory implies that a torture victim's suffering matters less because their baseline adapted, you have abandoned the core negative utilitarian commitment to the objective badness of suffering. You must accept that objective intensity is secondary to relative deviation, contradicting the fundamental motivation for prioritizing suffering reduction. Ultimately, it risks protecting sensitivity rather than reducing suffering.
