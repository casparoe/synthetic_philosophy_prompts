answer: |-
  Dear friend,

  You have walked into a trap that Hume himself would have smiled at, but it is a solvable one if you respect the hypocrisy of your room. These writers are not lying when they say beauty is subjective, nor are they lying when they rank manuscripts; they are simply operating on two different levels of discourse without realizing it. Your job is not to convert them to objectivism but to show them that their own practice already assumes a standard they deny in theory. Do not start by defining beauty or introducing the true judge immediately, or you will lose them to eye-rolls about elitism. You must begin by validating their relativism completely. Ask them to admit that no amount of argument can make someone feel pleasure they do not feel, and let them sit in that truth. This establishes that sentiment is indeed internal and not a fact about the object, which disarms the fear that you are going to tell them their feelings are wrong. Once that ground is secure, you pivot to their workshop practice. Ask them how they decide when a draft is finished. They will inevitably talk about pacing, clarity, or resonance. Here you introduce the first crucial separation: the difference between a report on a sentiment and a claim about a sentiment. When a writer says I was bored, that is a report. When they say this scene drags, that is a claim that the defect lies in the work or the reading of it, not just in their mood. You need this distinction in place before you can talk about judges, because otherwise, any appeal to expertise sounds like you are saying their feelings are invalid rather than that their assessment tools might be blunt.

  Once they accept that we make claims about taste that go beyond mere reporting, you can introduce the cause of disagreement without invoking snobbery. The discrepancy in verdicts does not prove there is no standard; it proves that the instruments of measurement vary. This is where you introduce the case study, which must be chosen carefully to avoid the traps of canonization or commerce. Do not use a classic novel where reputation precedes the experience, and do not use a bestseller where sales masquerade as value. Instead, I suggest you use a specific comparison of two translations of the same short poem, such as a haiku by Basho or a fragment of Sappho. Choose one translation that is literal and flat and another that is poetic and rhythmic. The beauty here is not in the story or the moral but in the fit of sound to sense. The admirers of the better translation can locate a specific and removable defect in those unmoved by it, which is simply an inattention to the rhythm or a lack of familiarity with the convention. What fails in the unmoved reader is the pleasure, not the opinion; they do not enjoy the rhythm, not because the rhythm is absent, but because their ear is not calibrated to hear it. This avoids the debate about whether anything lasts a hundred years because you are looking at a mechanical fit in the present moment. It also avoids sales figures because neither translation is likely a commercial product.

  You must weave the misconceptions into the flow rather than listing them as errors to be corrected. The first misconception, that a standard must be a rule applicable by someone with no taste, should be addressed right after you introduce the idea of a standard. Make it clear that the standard is not a checklist like a grammar rule but a cultivated sensitivity, much like a sommelier's palate is not a rulebook but a trained capacity. If you do not clear this up early, they will reject the whole notion of a standard as bureaucratic. The second misconception, that the joint verdict of qualified judges is only the majority verdict of a smaller room, must be handled when you discuss consensus. Explain that the verdict of the true judges is not a vote but a convergence of independent observations, like scientists agreeing on a measurement because their instruments are calibrated, not because they raised their hands. If you let them think it is just a smaller poll, you have gained nothing but exclusivity. The third misconception, that if the verdict is right the rest of us owe the pleasure, belongs at the very end. You must clarify that acknowledging a work is beautiful does not obligate them to enjoy it personally, only to acknowledge that the failure of pleasure lies in their own temporary lack of capacity or context, not in the work. This preserves their autonomy while admitting the standard.

  There is a fourth misconception you have not listed that you should anticipate, which is the belief that acknowledging an objective standard requires suppressing their own immediate reaction. Writers fear that if there is a right answer, their unique voice is wrong. You need to place this warning just before you introduce the true judge. Make it clear that the standard exists to preserve the possibility of pleasure, not to police deviation. The true judge is not a censor but a guardian of the conditions under which beauty can be experienced. If you do not address this, they will feel threatened rather than liberated. As for the true judge themselves, do not introduce this notion until you have established that some responses are healthier than others. You need the concept of delicacy and practice in place first. If you bring up the true judge before establishing that taste can be improved, it sounds like aristocracy. If you bring it up after establishing that practice matters, it sounds like mentorship. The order must be sentiment, then claim, then cause of discrepancy, then the possibility of improvement, and only then the authority of the practiced eye.

  To ensure the point has landed, do not ask them to write an essay on objectivity. Instead, ask them to write a single paragraph identifying a moment in their own reading history where they initially disliked a book but later came to appreciate it, and to specify what changed in them rather than in the book. This forces them to internalize the idea that the defect was in their own capacity or context, not in the work, without forcing them to admit they were wrong about the work itself. It shows they understand that the standard is relational. Finally, there are things you must explicitly refuse to go into, or the ninety minutes will vanish. Do not attempt to define beauty itself. If you try to say what beauty is, you will get stuck in metaphysics. Keep it on how we recognize it. Do not discuss the historical canon or why certain books survive. That leads to arguments about power and marketing which are irrelevant to the phenomenology of taste. Do not discuss whether art improves morality. That introduces a utility argument that confuses beauty with goodness. Stick strictly to the mechanism of perception and the conditions of pleasure. If you drift into ethics or history, you will lose the room to ideology, and you will not have answered the question of whether beauty is objective. Keep it tight, keep it about the work and the reader, and let them walk away feeling like better critics rather than converted philosophers.

  Warmly,

  Your Friend
