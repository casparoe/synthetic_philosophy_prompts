answer: |-
  ### Essay Question (90 Minutes)

  **Instructions:** Answer the following question in a clear, structured essay. You do not need to cite specific passages or dates. Your grade will depend on how well you analyze the philosophical problem presented, not on historical trivia.

  **Prompt:**

  In *De Corpore*, Thomas Hobbes argues that geometry is the only true model of demonstrative science. He relies on three specific premises:
  1.  **Causal Definition:** To truly know a thing, one must know its cause. Therefore, a geometric definition cannot merely describe a figure's properties (e.g., "a shape with three sides"); it must state how the figure is *generated* or constructed (e.g., "a figure made by moving three lines until they meet").
  2.  **Materialism:** The objects of geometry are not abstract ideas separate from the world; they are bodies considered in a specific way. The "motion" that generates them is a motion of matter.
  3.  **Certainty:** Because we create these objects ourselves through defined motions, we can have absolute certainty about their properties, unlike in physics where we observe causes we did not create.

  Consider the following objection raised by a critic with practical experience in drafting and design:
  "In practical geometry, one and the same figure can be specified in multiple ways that do not describe a generation. For example, a circle can be defined by a center and a radius, by three points it must pass through, or by dimensional constraints tying it to other lines. All three fix the exact same figure, yet none explicitly describes a curve being swept out by motion. If Hobbes insists the definition *must* be a generation, then either (A) these different specifications define different objects (which seems false, as the figure is identical), or (B) only one generation is the 'true' definition (which seems arbitrary). Furthermore, if the generation is a motion of matter, does this not make geometric truth dependent on the contingent laws of physics?"

  **Evaluate Hobbes's position in light of this objection.** Can Hobbes maintain that geometry provides necessary truth if his definitions rely on specific generations of material bodies? In your answer, you must address both the problem of multiple specifications and the problem of physical contingency.

  ***

  ### Model Answer

  Hobbes's project in *De Corpore* is to ground scientific certainty on the fact that the geometer is the creator of the objects studied. The objection raised regarding multiple specifications and physical contingency strikes at the heart of this claim. To evaluate whether Hobbes can survive this critique, we must distinguish between the *extensional* identity of a figure (what it looks like) and its *intensional* definition (how it is conceived), and we must clarify the status of "motion" in Hobbes's system.

  Regarding the first worry—that a single figure (like a circle) can be specified by different constraints without reference to generation—Hobbes would argue that the critic is confusing a description of effects with a definition of a cause. In the critic's example, defining a circle by three points describes a static state of affairs. It tells us where the body *is*, but not what it *is*. For Hobbes, the "thing itself" in geometry is not the static mark on the paper, but the rational construction that makes the mark intelligible. If one defines a circle by three points, one has not yet demonstrated *why* those points form a circle until one shows the generation (e.g., equidistant motion from a center). Therefore, Hobbes would reject option (A) of the objection: different specifications do not define different *figures* empirically, but they do constitute different *knowledge claims*. Only the causal definition yields science; the others yield only opinion or observation. He would also reject option (B) that the choice is arbitrary: the "true" definition is the one that isolates the simplest, most conceivable motion that produces the property in question. The center-and-radius generation is not just one option among many; it is the causal prerequisite that makes the three-point constraint possible. Thus, the multiplicity of constraints does not undermine the uniqueness of the causal definition; it merely highlights the difference between knowing a thing's cause and knowing its accidents.

  However, this response relies on the second premise: that the generation is a motion of matter. This invites the second worry: if geometry depends on material motion, does it not inherit the contingency of physics? If matter behaves differently, does the circle change? Here, a crucial distinction saves Hobbes's claim to necessity. While Hobbes is a materialist, the "motion" invoked in geometric definition is not necessarily empirical motion subject to friction, gravity, or physical law. It is *conceptual* motion. When Hobbes says a line is generated by the motion of a point, he means a motion that is *conceivable* without contradiction. The necessity of geometry does not come from the fact that matter *must* move this way in the physical world, but from the fact that the mind cannot conceive the generation without also conceiving the properties that follow from it.

  For example, if I define a circle as the path of a point moving at a fixed distance from a center, I do not need to check if physical pens can actually do this without slipping. I only need to acknowledge that the concept of "uniform motion at a fixed distance" contains within it the property of "equidistance." The materialism ensures that the object is not a Platonic ghost, but the "motion" is idealized enough to retain necessity. The contingency of physical matter applies to *physics* (natural philosophy), where we observe motions we did not create. In *geometry*, we stipulate the motion. Therefore, the geometric necessity is preserved because the "matter" in question is matter considered under the aspect of pure extendability, not under the aspect of physical resistance.

  Nevertheless, the objection reveals a tension in Hobbes's system. By tying definition so tightly to generation, Hobbes makes geometric identity dependent on construction history. In modern terms, he prioritizes the *algorithm* over the *output*. This protects certainty (we know the output because we wrote the algorithm) but risks making geometry brittle. If the "true" definition of a circle requires a specific generation, then figures that are extensionally identical but generated differently might be treated as distinct objects of science. Hobbes accepts this risk because his goal is not to catalog shapes, but to trace consequences from causes.

  In conclusion, Hobbes can answer the objection, but at a cost. He resolves the "multiple specifications" worry by demoting non-generative descriptions to mere observations rather than definitions. He resolves the "contingency" worry by treating geometric motion as conceivable rather than empirically constrained. However, this requires the student of geometry to accept that the "circle" they study is not the static drawing, but the act of its drawing. If one accepts this shift from static object to causal process, Hobbes's model of demonstrative science remains coherent. If one insists that the figure exists independently of its generation, Hobbes's materialism indeed threatens to collapse geometric necessity into physical contingency.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **General Instruction:** Do not award marks for biographical information (e.g., "Hobbes was an empiricist"), historical context (e.g., "The quarrel with Wallis"), or simple summaries of the prompt. Marks are awarded only for philosophical analysis of the generation/constraint problem.

  **Move 1: Explication of Causal Definition (5 Marks)**
  *   **A (5):** Clearly explains that for Hobbes, a definition is not a label but a statement of cause/origin. Distinguishes between knowing *that* a figure exists vs. knowing *how* it is made.
  *   **B (3-4):** States that Hobbes wants definitions to show generation but treats this as a preference for clarity rather than a condition for knowledge.
  *   **C (1-2):** Merely repeats the prompt's claim that "definitions must state generation" without explaining *why* (the link to causality/science).
  *   **Common Error:** Claiming Hobbes wants definitions to be "more precise" without linking precision to *causal knowledge*.

  **Move 2: Addressing the "Multiple Specifications" Worry (5 Marks)**
  *   **A (5):** Argues that for Hobbes, different specifications are not equal: non-generative specs are descriptions of accidents/effects, while generative specs are definitions of essence. Denies that extensional identity (looking the same) equals intensional identity (being the same object of science).
  *   **B (3-4):** Suggests Hobbes would just pick one generation as "standard" without explaining why the others are philosophically inferior (treats it as convention rather than ontology).
  *   **C (1-2):** Claims the different specifications create different circles (confusing the drawing with the concept) or ignores the worry entirely.
  *   **Common Error:** Saying "a circle is a circle regardless of how you draw it" (this accepts the critic's view and fails to defend Hobbes).

  **Move 3: Resolving the "Contingency" Worry (5 Marks)**
  *   **A (5):** Distinguishes between *empirical* motion (physical, contingent) and *conceptual/phantasmal* motion (conceivable, necessary). Argues geometric necessity survives because the motion is stipulated by the mind, not observed in nature.
  *   **B (3-4):** States that geometry is "idealized" but fails to explain how this fits with Hobbes's materialism (leaves a tension between matter and necessity).
  *   **C (1-2):** Claims matter is necessary, or claims geometry is separate from matter (contradicting the prompt's premises).
  *   **Common Error:** Arguing that Hobbes denies materialism to save necessity (violates the prompt's premises).

  **Move 4: Application to the Test Case (5 Marks)**
  *   **A (5):** Uses the circle/constraint example to illustrate the argument. Shows how "three points" is a static constraint while "center/radius motion" is the causal generation that explains *why* the points align.
  *   **B (3-4):** Mentions the circle example but treats it generically without linking the specific constraints (points vs. radius) to the generation argument.
  *   **C (1-2):** Uses a different example (e.g., triangles) or discusses the example without reference to generation/cause.
  *   **Common Error:** Getting bogged down in technical geometry (e.g., calculating radii) rather than the philosophical status of the definition.

  **Move 5: Final Evaluation/Judgement (5 Marks)**
  *   **A (5):** Offers a nuanced verdict: Hobbes succeeds only if we accept geometry is about *construction processes* rather than *static objects*. Acknowledges the "cost" of this position.
  *   **B (3-4):** Concludes Hobbes is either fully right or fully wrong without qualifying the shift in perspective required (process vs. object).
  *   **C (1-2):** Vague conclusion (e.g., "Hobbes makes some good points") or no conclusion.
  *   **Common Error:** Restating the introduction as the conclusion without synthesizing the arguments made.
