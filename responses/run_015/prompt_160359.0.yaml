answer: |-
  Elena is the senior partner at a small architectural firm tasked with selecting the lead designer for a public community center. She has two options: assign the project to Marcus, a loyal junior associate who needs the career boost to stay in the field, or hire an external expert who will deliver a functionally superior building at the same cost. Elena knows with certainty that the expert's design will serve the community better (no ignorance of non-normative facts), and she is not confused about how to achieve either outcome (no means–ends irrationality). Her desire to nurture her staff is coherent with her broader professional identity and values. Under an enriching idealization, Elena retains this commitment to mentorship while gaining a maximally vivid grasp of Marcus's dependence on her decision and the concrete reality of his career stakes, without damping that attachment in favor of abstract community metrics.

  **Verdicts:** View (R) says Elena ought to hire the expert, because the objective reason (greater community benefit) outweighs the reason of loyalty, regardless of her psychological state. View (D) says Elena ought to assign Marcus, because after idealized deliberation—where her existing loyalty is preserved and the stakes are grasped with maximal vividness—she would settle on protecting her associate.

  **Structural Feature:** The divergence is generated by the **normative relevance of phenomenological vividness**. View (D) treats the vividness of the agent's grasp as a constitutive element of the deliberative process that can shift the outcome, whereas View (R) treats vividness as merely epistemic; it helps track reasons but cannot alter their objective weight.

  **Removal:** If you remove the assumption that vividness affects deliberative weighting (i.e., if idealized deliberation required desires to be weighted strictly according to objective reason strength), the two views would converge on hiring the expert.

  **Counter-Attack:** A defender of (D) would attack (R) as alienating, arguing that it severs the 'ought' from the agent's practical identity by demanding she ignore the vividly grasped commitments that make her deliberation hers. A defender of (R) would counter that (D) cheats by making normativity contingent on psychological intensity, allowing the agent's subjective focus to override the actual value at stake in the world.
