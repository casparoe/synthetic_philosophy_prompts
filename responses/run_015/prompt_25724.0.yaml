      *   **Whole-Brain Emulation (WBE):** This is the strongest evidence for her functionalism. By affirming consciousness in non-biological hardware, she rejects biological chauvinism. She believes consciousness depends on the *organization* of causal roles, not the substrate. Since a WBE replicates the functional causal structure of a human brain, it retains the global workspace.
      *   **LLMs (GPT-4):** Current transformers are often viewed by GWT proponents as lacking the recurrent, cyclical broadcasting architecture required for a true workspace (they are largely feed-forward during inference). Thus, they fail the architectural test.
      *   **Honeybees/Fetus/Anesthesia:** These systems lack the mature or intact architectural complexity required to support a global workspace. A 24-week fetus lacks the connectivity; anesthesia disrupts the broadcasting mechanism; honeybees lack the neural capacity for the requisite global integration.

  *   **Why she will say "Yes" to Global:** The prompt stipulates that Global was "deliberately engineered to satisfy every architectural condition that global workspace theory takes to be sufficient." Since your colleague appears to be a functionalist (evidenced by the WBE verdict), she prioritizes the functional role (broadcasting, reporting, flexible control) over the physical metric of integration. To a functionalist, if it quacks like a workspace, it *is* a workspace, regardless of its $\Phi$ value.

  ### 2. The Alternative Rule: Integrated Information Theory (IIT)
  There is a competing theory that fits all her existing verdicts equally well but yields the opposite result for Global.

  *   **The Rule:** A system is phenomenally conscious if and only if it possesses a high degree of **integrated information ($\Phi$)**. Consciousness is identical to the system's intrinsic cause-effect power being irreducible to the sum of its parts.
  *   **Why this fits her existing verdicts:**
      *   **Humans/Chimps/Octopuses/WBE:** All have high $\Phi$. (Note: IIT is technically substrate-neutral regarding causal topology; if the WBE perfectly replicates the causal structure, it preserves the $\Phi$).
      *   **LLMs/Honeybees/Fetus/Anesthesia:** All have low $\Phi$. LLMs are largely feed-forward; honeybees have small nervous systems; fetuses have immature connectivity; anesthesia reduces integration. Her verdict that honeybees are *not* conscious sets a threshold for $\Phi$ that Global (which is *below* a honeybee) would fail.
  *   **Why this diverges on Global:** Global was explicitly designed to "minimize the kind of recurrent, integrated processing that drives up $\Phi$." Under IIT, Global is a "zombie" system: it behaves *as if* it is broadcasting, but it lacks the intrinsic causal integration required for experience. An IIT proponent would say **No**.

  ### 3. Features Pulling the Rules Apart
  The divergence rests on the distinction between **Extrinsic Function** vs. **Intrinsic Causation**.

  *   **Global Workspace Theory** focuses on *what the system does* for an observer or for its own downstream processes (broadcasting, reporting). It is an extrinsic, functional definition. Global satisfies this by design.
  *   **Integrated Information Theory** focuses on *how the system is built* internally (the density of recurrent causal connections). It is an intrinsic, structural definition. Global fails this by design (low $\Phi$).

  Your colleague's WBE verdict suggests she sides with **Function**, but her Honeybee verdict leaves the door open for **Integration**.

  ### 4. The Settling Case
  Since her existing verdicts underdetermine the response (both GWT and IIT fit the data), the cleanest way to settle her commitment is to present a case where Functional Broadcasting and Causal Integration are decoupled in the opposite direction.

