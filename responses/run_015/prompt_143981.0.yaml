answer: |-
  You have identified a sophisticated and pervasive argumentative pattern, particularly in meta-ethics and value theory. To answer your primary question directly: **there is no single, canonical term in ethics or philosophy of science that exclusively names this specific dynamic.**

  However, your description maps precisely onto a cluster of established concepts across logic, philosophy of science, and value theory. The maneuver you describe is best understood as a specific species of **Immunization Strategy** (or **Conventionalist Stratagem**) that relies on **Ad Hoc Essentialism** to evade the **Continuum Objection**.

  Here is a breakdown of the closest existing concepts, why they fit (and where they diverge from your intuition), and how to draw the edges of this phenomenon.

  ### 1. The Philosophy of Science Match: *Immunization Strategy*
  You expressed hesitation about calling this an "auxiliary hypothesis," but in the Popperian and Lakatosian sense, this is exactly what it is.
  *   **The Concept:** Karl Popper described the **"Conventionalist Stratagem"** as a way to protect a theory from falsification by redefining terms or adding assumptions that make the theory irrefutable. Imre Lakatos later refined this in his methodology of scientific research programmes, distinguishing between *progressive* problem shifts (new predictions) and *degenerating* ones (explaining away anomalies).
  *   **Why it fits:** The core claim ("Extreme suffering is lexically incomparable to pleasure") is the "hard core" of the research programme. The intermediate cases (structural stagnation, dull ache) are potential falsifiers. By reclassifying them as "the same kind" of harm, the theorist is not testing the theory; they are protecting the hard core from empirical or intuitive refutation.
  *   **The Nuance:** You are correct that it feels different from a standard auxiliary hypothesis because it operates on *ontology* (what exists/counts) rather than *nomology* (laws of interaction). In philosophy of science, this is sometimes called **"Ontological Gerrymandering"** (a term borrowed from sociology of science), where the boundaries of the object of study are shifted to ensure the theory holds.

  ### 2. The Logical Match: *The No True Scotsman Fallacy*
  This is the rhetorical cousin of the maneuver.
  *   **The Concept:** "No *true* Scotsman puts sugar on his porridge." When confronted with a counter-example, the definition of the category is altered to exclude the counter-example.
  *   **Why it fits:** "No *true* lexically-protected suffering is outweighable by pleasure." When the critic points to a case that *could* be outweighed, the proponent says, "That isn't the *kind* of suffering that triggers the lexical rule."
  *   **The Nuance:** The No True Scotsman is usually considered a formal fallacy. In ethics, however, distinguishing between *kinds* of value (qualitative) rather than *amounts* of value (quantitative) is a legitimate move (e.g., J.S. Mill's higher/lower pleasures). The maneuver becomes fallacious only when the distinction lacks **independent justification**.

  ### 3. The Ethical Match: *Evading the Continuum Objection*
  In value theory, this dynamic is the standard response to the **Sorites Paradox** (or the "Continuum Objection") against lexical views.
  *   **The Context:** Critics argue that if there is a lexical threshold, there must be a specific grain of sand that turns a non-heap into a heap. Since suffering varies continuously, a sharp threshold seems arbitrary.
  *   **The Maneuver:** To avoid arbitrariness, the proponent asserts a **Qualitative Discontinuity**. They claim the threshold isn't a point on a line, but a boundary between two *types* of experience.
  *   **The Problem:** When this move is applied recursively to *any* borderline case, it becomes what we might call **"Ad Hoc Discontinuity."** The theorist posits a new "structural feature" or "kind" for every intermediate case that threatens to blur the line, ensuring the discontinuity never actually faces a test.

  ### 4. Proposed Terminology: *Taxonomic Immunization*
  Since no single term exists, the most precise label for this dynamic would be **Taxonomic Immunization**.
  *   **Taxonomic:** It operates by creating or refining categories (kinds of harm).
  *   **Immunization:** Its function is to render the core normative claim unfalsifiable.

  This distinguishes it from **Concept Creep**. Concept creep expands a category to include more phenomena (e.g., "trauma" coming to include mild stress). Taxonomic immunization *fortifies* a category by subdividing it, ensuring that the "sacred" sub-category remains pure and untouched by trade-offs.

  ### 5. Drawing the Edges: When is this Legitimate?
  You asked where the edges should be drawn. Does it require an explicit lexical commitment? No. It can occur whenever a theorist protects a normative absolute. The distinction between a **legitimate qualitative distinction** and **taxonomic immunization** lies in **Independent Phenomenological or Causal Grounding.**

  *   **Legitimate:** "Torture is lexically worse than annoyance because torture causes permanent neurological disintegration, whereas annoyance does not." (This relies on an independent fact about the world/neurology).
  *   **Immunization:** "This decade of stagnation is lexically worse than pleasure because it shares the *moral structure* of torture." (When pressed on what that structure is, the answer is circular: "It is the structure that makes it uncompensable.")

  **The Test for Immunization:**
  If the *only* evidence that the intermediate case belongs to the "lexical category" is the intuition that it *should not be outweighed*, the maneuver is taxonomic immunization. If there is independent evidence (phenomenological, causal, psychological) that distinguishes the intermediate case from mere discomfort *prior* to the moral judgment, the distinction is legitimate.

  ### Summary
  The maneuver is a **Conventionalist Stratagem** applied to **Value Ontology**. It uses **Ad Hoc Qualitative Distinctions** to evade the **Continuum Objection**. While it lacks a single famous name, **"Taxonomic Immunization"** accurately captures the process of fortifying a normative boundary through recursive redescription to preserve unfalsifiability. It is the ethical equivalent of drawing a circle around a target *after* the arrow has landed.
