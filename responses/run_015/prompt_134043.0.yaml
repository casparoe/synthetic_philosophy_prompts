answer: |-
  In a near-future municipality, a safe adenoviral vector is distributed via an opt-in public health program to decouple nociceptive signaling from affective distress, allowing citizens to detect tissue damage without experiencing suffering. While early adopters report heightened productivity, advocates for the hedonistic imperative demand mandatory universal administration, citing a neuro-social externality: functional imaging confirms that the treated majority experiences measurable cortisol spikes and affective disruption when witnessing the distress behaviors of the untreated minority, thereby reintroducing suffering into the treated population through mirror-neuron contagion and preventing the net-zero suffering goal. Opponents of compulsion do not argue from safety or tradition, but contend that the visceral urgency of suffering is a necessary precondition for weighting moral claims, asserting that an agent who cannot feel the badness of harm lacks the constitutive capacity to prioritize urgent aid over trivial preferences, rendering the community morally inert rather than merely happier.

  **Verdict and Reasoning**

  *   **Hedonistic Imperative:** Supports compulsory administration. The reasoning is that suffering is intrinsically evil and must be abolished where possible. Since the untreated minority generates a negative externality (empathic contagion) that physically reinstates suffering in the treated majority, non-participation constitutes an active harm to others. Compulsion is justified not to protect the untreated from themselves (paternalism), but to protect the treated from the suffering signals of the untreated.
  *   **Rival Framework:** Resists compulsion. The reasoning is that moral agency requires more than data processing; it requires an affective grasp of value. If the "badness" of harm is not felt, the agent loses the ability to normatively weight urgent claims against trivial ones. The resistance is not based on the risk of physical injury (which remains detectable) or bias toward the status quo, but on the preservation of the cognitive architecture required for moral prioritization.

  **Structural Feature of Divergence**

  The divergence turns on whether suffering is valued for its **causal role** in reasoning or for its **constitutive relation** to it. The Hedonistic Imperative treats suffering as merely causal/instrumental: it is a signal that drives avoidance and can be replaced by discriminative data (knowing damage exists) without loss of function. The Rival Framework treats suffering as constitutive: the felt experience of unpleasantness is not just a signal but part of the weighting mechanism itself; without the affect, the reasoning process is fundamentally altered, not merely informed differently.

  **Hedonistic Imperative Attack on the Rival**

  A proponent of the Hedonistic Imperative could attack the rival position by arguing that the alleged negative externality of "moral inertia" is illusory. They would contend that the rival conflates the *feeling* of urgency with the *recognition* of urgency. Since discriminative touch and temperature sensing remain intact, agents retain all factual data regarding tissue damage and risk. The proponent would argue that rational moral weighting can be achieved through cognitive appraisal of this data (e.g., "this damage threatens life, therefore it takes priority") without the need for affective distress. Thus, the rival's claim that the community becomes "morally inert" is an illusion based on an outdated psychology that mistakes emotional volatility for moral depth; a society reasoning from clear data without affective noise would be more, not less, capable of consistent moral action.
