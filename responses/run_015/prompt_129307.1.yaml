      *   *Nuance:* Even observable signs can be influenced (e.g., psychomotor agitation might be heightened by anxiety about being observed). But the asymmetry holds.

  7.  **Address the Double Hermeneutic:**
      *   *Giddens:* Anthony Giddens coined "double hermeneutic" (social scientists study a world that interprets itself). Hacking builds on this.
      *   *User's Twist:* Clinician interpreting patient interpreting DSM. This is a *triple* hermeneutic potentially. It's a strong point about the erosion of "raw data."

