      *   **User's Twist:** A "weird mechanical direction" focusing on the *architecture of clinical interviews* (e.g., SCID branching logic) and how patients learn this structure (via peer forums, reading DSM) to produce "scripted phenomenology."
      *   **Key Arguments:**
          1.  Second-order loop: Not just identity/behavior change, but the *narrative structure* of symptom reporting changes.
          2.  Operationalization (DSM-5): Intended to reduce bias, but actually amplifies looping by making the "script" legible to patients.
          3.  Asymmetry: Applies more to self-report conditions (depression/anxiety) than observable ones (catatonia).
          4.  Double Hermeneutic: Clinicians know patients might be scripting, leading to meta-interpretation.
