answer: |-
  1. I will ask whether effective wild animal suffering interventions necessarily rely on population-ethics tradeoffs rather than benefiting specific existing individuals. This determines if the interventionist case holds without invoking the non-identity problem.
  2. Quantifying suffering units fails because it ignores whether the subject of harm is identical across counterfactuals. Plugging numbers into a duty to aid collapses when the aid changes which animals exist rather than helping those already here.
  3. Months one through three will involve interviewing biologists about mortality causes and intervention feasibility, while months four through six focus on ethicists specializing in population ethics. The final trimester will synthesize these interviews into draft sections, refining the framework through iterative feedback.
  4. The output will be a long reported piece plus a taxonomy for judging interventions based on individual welfare versus population composition. This framework will allow advocates to classify actions as either aiding existing lives or altering future populations.
  5. Failure would consist of conflating the two intervention types or getting bogged down in empirical ecology debates instead of the ethical split. The project is too big if it attempts to solve the non-identity problem rather than merely exposing its role in this debate.
