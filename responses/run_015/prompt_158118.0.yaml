answer: |-
  # Teaching Plan: Modal Scope and the Fatalist Inference

  **Course Level:** Undergraduate Seminar (Year 2)
  **Prerequisites:** Introductory Logic (Propositional/Predicate), No Formal Modal Logic
  **Duration:** 50 Minutes
  **Topic:** The 'Death in Damascus' Inference (Disjunctive Variant)

  ## I. The Concrete Scenario: "The Compliance Audit"
  **Do not use travel, prophecy, or supernatural elements.** Use a bureaucratic double-bind.

  *   **Protagonist:** Alex, a junior data analyst.
  *   **Antagonist:** The Compliance Auditor (functions as the Oracle).
  *   **The Prediction (Disjunctive):** "Your quarterly submission will be rejected for **'Data Irregularities'** OR **'Procedural Non-Compliance'**."
  *   **The Avoidance Strategies:**
      1.  *To avoid Procedural Non-Compliance:* Alex follows the rulebook strictly. **Result:** The data looks artificially rigid, triggering 'Data Irregularities'.
      2.  *To avoid Data Irregularities:* Alex adjusts data to look 'natural'. **Result:** This violates the rulebook, triggering 'Procedural Non-Compliance'.
  *   **Structural Features to Preserve:**
      *   **Exhaustiveness:** The two categories must cover all possible outcomes of the submission within the context of the audit.
      *   **Reflexivity:** The act of avoiding one category must structurally constitute the other.
      *   **Agency:** Alex must physically be able to submit the report; the trap is descriptive/classificatory, not physical.
  *   **Structural Features to Avoid:**
      *   **Causal Determinism:** The Auditor is not *causing* the rejection via a machine; the rejection is a judgment based on Alex's free choices.
      *   **Physical Impossibility:** Alex is not locked in a room; Alex can choose *how* to submit, but cannot choose *how it is classified* given the definitions.

  ## II. Instructional Sequence (50 Minutes)

  **1. Secure Modal Intuition (00:00 – 00:05)**
  *   **Action:** Before mentioning the scenario, establish the distinction between *Truth* and *Necessity*.
  *   **Task:** Ask students to evaluate: "It is true that I am sitting" vs. "It is necessary that I am sitting."
  *   **Goal:** Secure the consensus that a proposition can be true without being metaphysically necessary (i.e., I could have stood up).
  *   **Dependency:** This distinction is required to later identify the fatalist fallacy (inferring necessity from truth). Without this, the rest of the seminar collapses into metaphysical debate.

  **2. The Singular Prophecy Variant (00:05 – 00:15)**
  *   **Action:** Present a simplified, singular version of the Audit scenario. The Auditor says: "You will be rejected for 'Data Irregularities'." Alex tries to fix the data. The fix looks artificial. Rejected for 'Data Irregularities'.
  *   **Goal:** Elicit the pre-theoretic fatalist intuition: "If the statement was true beforehand, Alex couldn't have done otherwise."
  *   **Dependency:** This must precede the disjunctive variant because it leverages the intuitive pull of "fixed truth." It creates the *problem* (the feeling of inevitability) that the disjunctive variant will *explain*. If you start with the disjunction, students view it as a logic puzzle; starting with the singular makes it feel like a threat to agency.

  **3. The Disjunctive Variant (00:15 – 00:30)**
  *   **Action:** Introduce the full "Data Irregularities OR Procedural Non-Compliance" scenario described above. Walk through both avoidance paths.
  *   **Goal:** Demonstrate that the "inevitability" arises from the *exhaustiveness of the categories* combined with the *structure of avoidance*, not from a singular fixed future.
  *   **Dependency:** This depends on Step 2. Students now recognize the "feeling" of fatalism from the singular case. In this step, they see that the feeling persists even when the specific outcome (which disjunct) *does* depend on their choice. This isolates the logical structure from the specific content.

  **4. Diagnosing the Scope Ambiguity (00:30 – 00:40)**
  *   **Action:** Formalize the inference on the board without heavy notation.
      *   Premise 1: Necessarily (Rejection is for D or P). [Given the audit rules]
      *   Premise 2: Alex chooses Action X.
      *   Conclusion: Therefore, Rejection is for D (or P).
      *   *Fatalist Error:* Inferring "Necessarily (Rejection is for D)" from "Necessarily (D or P)."
  *   **Goal:** Show that the operator "Necessarily" applies to the *conditional relationship* (If Alex does X, Result is Y), not to the *result itself* independent of action.
  *   **Dependency:** This depends on Step 3. Students must see the disjunctive mechanism to understand that the "Necessity" covers the *disjunction*, not the specific *disjunct*.

  **5. Diagnostic Assessment (00:40 – 00:50)**
  *   **Action:** Administer the diagnostic question (see Section IV). Discuss results.
  *   **Goal:** Verify grasp of scope ambiguity.

  ## III. Misconception Mapping

  | Misconception | Description | Intervention Point | Strategy |
  | :--- | :--- | :--- | :--- |
  | **Causal Determinism** | Students believe the Auditor *physically forces* the rejection or that the future is causally locked. | **Step 1 & 3** | Emphasize that Alex physically *can* submit either way. The "trap" is in the *description* of the act, not the physics of the act. |
  | **Predictive vs. Modal** | Students treat "It is true that..." as equivalent to "It must be that..." | **Step 1** | Use the "sitting/standing" intuition pump. Force a wedge between *accidental truth* and *necessary truth* before introducing the audit. |
  | **Physical Impossibility** | Students think avoidance is physically blocked (like a locked door). | **Step 3** | Explicitly state: "Alex is not prevented from submitting. Alex is prevented from *escaping the classification*." Distinguish *ability to act* from *ability to satisfy conditions*. |

  ## IV. End-of-Session Diagnostic Question

  **Do not ask:** "Does Alex have free will?" (This invites metaphysical discomfort, not logical analysis).

  **Ask:**
  > "Consider the Auditor's claim: **'Necessarily, (The report is rejected for Data OR Procedure).'**
  >
  > Does this claim imply:
  > **(A)** There is a specific reason (Data or Procedure) that is fixed now, regardless of what Alex does?
  > **(B)** For any action Alex takes, that action will fall under one of these two descriptions, but *which* description applies depends on the action?"

  *   **Correct Answer:** (B).
  *   **Diagnostic Value:** Choosing (A) indicates the student has collapsed the scope of the necessity operator onto the disjuncts ($\square(A \lor B) \to \square A \lor \square B$). Choosing (B) indicates they grasp that the necessity applies to the *coverage* of the categories, not the specific outcome.

  ## V. Explicit Omissions

  **Do not teach the following.** Acknowledge their existence but state they are outside the scope of this seminar to prevent confusion.

  1.  **Formal Branching-Time Semantics:** Do not draw tree diagrams of possible worlds. The logic can be handled via operator scope in natural language.
  2.  **Metaphysics of the Open Future:** Do not debate Presentism vs. Eternalism or whether future contingents have truth values. Treat the "Prediction" as a given premise for the sake of the argument, not a metaphysical claim.
  3.  **Hard vs. Soft Facts:** Do not introduce the distinction between fixed past facts and soft facts about the past (e.g., Pike/Adams distinctions). This complicates the modal scope issue with temporal ontology.

  ## VI. Pedagogical Divergence: Singular vs. Disjunctive

  **Why the Disjunctive Variant is Necessary:**
  *   **Singular Prophecy:** In the traditional "You will die in Damascus" case, students often fixate on the *causal mechanism* (How did Death know?) or the *metaphysics of truth* (Was it always true?). This obscures the logical structure.
  *   **Disjunctive Variant:** By offering "Damascus OR Samarra" (or Data OR Procedure), you remove the mystery of *specific* foreknowledge. The Oracle doesn't need to know *which* one; they only need to know the *exhaustiveness* of the options.
  *   **Isolation of Logic:** This divergence isolates the fatalist conclusion from *singular reference*. It demonstrates that the feeling of determinism does not depend on a specific future event being fixed, but on the **logical structure of avoidance behavior** within an exhaustive system. It proves the fatalist inference is a scope error regarding *conditions*, not a mystery regarding *time*.
