  **JOINT STATEMENT ON POPPER'S DEMARCATION OF DARWINISM**

  **Signed:** The Adversarial Collaboration Working Group on Popperian Biology
  **Date:** 24 May 2024

  ### I. Agreed Claims regarding History and Philosophy

  We, the undersigned representatives of the opposing interpretative camps, affirm the following points of consensus regarding the historical record and Karl Popper's broader philosophical framework:

  1.  **Historical Chronology:** We agree that Karl Popper characterised the theory of natural selection as a 'metaphysical research programme' in his 1976 autobiography, *Unended Quest*, and that he publicly revised this position in his 1978 Darwin Lecture at Cambridge University, subsequently published in *Dialectica*.
  2.  **Status of Metaphysics:** We agree that, in Popper's mature philosophy, labelling a theory 'metaphysical' was not necessarily pejorative. Popper consistently held that metaphysical research programmes could be rationally discussed and were often indispensable precursors to testable science, distinct from 'pseudoscience' which claims testability but evades refutation.
  3.  **The Tautology Charge:** We agree that the critique of natural selection as tautological rests primarily on the Herbert Spencer formulation 'survival of the fittest', wherein 'fitness' is often defined retrospectively by differential reproductive success.
  4.  **Empirical Success:** We agree that evolutionary biology has generated substantial empirical successes since 1978, including documented cases of speciation, the fossil record's consistency with phylogenetic predictions, and observed instances of natural selection in real-time (e.g., antibiotic resistance).
  5.  **Falsificationism:** We agree that Popper remained committed to falsificationism as the demarcation criterion for empirical science throughout both the 1976 and 1978 statements, and that the dispute concerns whether Darwinism meets this criterion *in its core formulation* or only when supplemented by auxiliary hypotheses.

  ### II. Table of Residual Disagreements and Pre-registered Predictions

  While we agree on the historical and philosophical baseline, we remain divided on the logical structure of the theory and the substantive nature of Popper's retraction. The following table outlines our precise disagreements, the cruxes upon which they turn, and the concrete cases we agree bear upon them.

  | Crux | Camp 1 Position (1976 Consistency) | Camp 2 Position (1978 Clarification) | Shared Empirical/Logical Test Case | Pre-registered Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Circularity of Fitness** | The definition of fitness is viciously circular. 'Fittest' is defined solely by 'those who survive'. Therefore, the statement 'the fittest survive' is a logical truth, not an empirical claim. | The definition is harmless shorthand. Fitness can be and is measured independently of survival via specific traits (physiology, morphology) that *predict* survival. | **Case:** The Grant's Finches study (Daphne Major). Researchers measure beak depth *before* a drought and predict survival rates. | **Camp 1:** The 'prediction' is only possible because beak depth is retroactively validated by survival data; the causal link remains post-hoc.<br>**Camp 2:** Beak depth functions as an independent variable that successfully predicts survival probabilities prior to the selection event, breaking the circle. |
  | **2. The Substance of the Retraction** | The 1978 retraction was a capitulation that merely re-labelled the theory. The logical structure of Natural Selection did not change between 1976 and 1978; only Popper's willingness to call it 'science' did. | The 1978 retraction was a substantive clarification. It shifted focus from the abstract principle to the specific, testable models (e.g., population genetics) that instantiate the principle. | **Case:** Popper's treatment of Freudian Psychoanalysis vs. Darwinism in the same period. | **Camp 1:** Popper's logical critique of Freud (that any outcome can be accommodated) applies equally to the core mechanism of Natural Selection.<br>**Camp 2:** Popper distinguishes them because Darwinism allows for 'forbidden states' (e.g., Precambrian rabbits) which Freudianism does not. |
  | **3. The Role of Auxiliary Hypotheses** | Natural Selection is only testable when burdened with so many auxiliary assumptions (about heredity, variation, environment) that the core theory is insulated from refutation. | All scientific theories require auxiliary assumptions. The core theory is testable because it places constraints on what kind of adaptations are possible (e.g., no perfect organisms). | **Case:** The existence of 'sub-optimal' design (e.g., the recurrent laryngeal nerve). | **Camp 1:** Explaining sub-optimality requires ad-hoc historical narratives that cannot be independently tested.<br>**Camp 2:** Sub-optimality is a risky prediction of descent with modification that creationist or optimality models would falsify. |
  | **4. Nature of the Dispute (Verbal vs. Substantive)** | The dispute is **substantive**. It concerns whether the theory possesses genuine explanatory power or merely organises data post-hoc. | The dispute is partially **verbal**. It hinges on the definition of 'scientific theory'. If 'theory' includes the mathematical apparatus of population genetics, it is scientific. If it refers only to the verbal slogan, it is metaphysical. | **Case:** Analysis of citation practices in *Nature* and *Science* (1980–2020). How do biologists utilise the 'principle' vs. the 'models'? | **Camp 1:** Biologists use the principle as a justificatory narrative after the fact.<br>**Camp 2:** Biologists use the principle to derive mathematical models that generate novel, risky predictions. |

  ### III. Note on Verbal and Substantive Elements

  We explicitly acknowledge that a portion of this dispute is **verbal** rather than substantive. Specifically, we agree that if 'Darwinism' is defined as the conjunction of the abstract principle of natural selection *plus* the mathematical framework of population genetics and the historical claim of common descent, Camp 2's assertion of testability holds. However, if 'Darwinism' is defined strictly as the isolated proposition 'survival of the fittest' without independent measures of fitness, Camp 1's assertion of tautology holds.

  Our collaboration confirms that the disagreement is **substantive** only regarding whether the biological community *actually* employs independent measures of fitness sufficient to break the tautology in practice. The pre-registered predictions in Row 1 of the table above are designed to settle this substantive element. If independent trait measurements consistently fail to predict differential survival without recourse to the survival data itself, Camp 1 is vindicated. If they succeed with statistical significance, Camp 2 is vindicated.

  ***

  **End of Statement**
