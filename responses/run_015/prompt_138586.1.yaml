answer: |-
  ### 1. What we both accept

  1.  Narrow-sense heritability ($h^2$) is defined strictly as additive genetic variance divided by phenotypic variance ($V_A/V_P$) in a specific population at a specific time.
  2.  $h^2$ estimates are local; a high estimate in one population or environment does not guarantee high estimates in another.
  3.  High $h^2$ does not imply a trait is immutable; environmental interventions can shift population means even if variance is mostly genetic.
  4.  High $h^2$ within groups does not logically entail that average differences between groups are genetic in origin.
  5.  In the Uniform Boarding School scenario, environmental variance ($V_E$) decreases, causing $h^2$ to increase, even if the mean phenotype shifts dramatically.
  6.  For Trait K, the initial $h^2 \approx 0.9$ reflected low environmental variance (no nutrient); the drop to near zero reflected increased environmental variance (salt access).
  7.  Standard twin/adoption designs confound direct genetic effects with passive gene-environment correlation (genetic nurture) unless specific controls are used.
  8.  GWAS-based estimates of $h^2$ are typically lower than twin-based estimates due to missing heritability (rare variants, non-additive effects).
  9.  Knowing $h^2$ helps predict response to selection and resemblance among relatives in the *current* environment.
  10. Knowing $h^2$ does not identify specific causal mechanisms or guarantee that environmental interventions will be ineffective.
  11. Both sides agree that "heritable" is frequently misinterpreted by the public as "unchangeable" or "determined at conception."
  12. Policy decisions require cost-benefit analysis of interventions, not just heritability estimates.

  ### 2. Where we still disagree

  | Crux | QG Formulation | DC Formulation | Why distinct |
  | :--- | :--- | :--- | :--- |
  | **Intervention Info** | $h^2$ sets bounds on how hard a trait is to move with typical environmental levers. | $h^2$ tells you nothing about intervention ease without knowing the specific mechanism. | QG sees $h^2$ as a difficulty metric; DC sees it as orthogonal to manipulability. |
  | **Variance Ontology** | Partitioning variance identifies causal sources (genes vs. environment) in the population. | Variance partitioning is descriptive statistics, not causal ontology, because G and E are entangled. | QG treats components as real causes; DC treats them as model-dependent artifacts. |
  | **Trait K Meaning** | The 0.9 was true and useful for understanding population structure *at that time*. | The 0.9 was misleading because it obscured the latent environmental leverage that existed *then*. | QG values accuracy regarding actual variance; DC values accuracy regarding potential causality. |
  | **Genetic Nurture** | It's a bias to be corrected to find "direct" genetic effects. | It's part of the real-world effect of having those genes; correcting it removes valid variance. | QG wants biological isolation; DC wants ecological validity. |
  | **Between-Group Priors** | High within-group $h^2$ makes genetic explanations for between-group differences plausible priors. | High within-group $h^2$ provides zero Bayesian update for between-group genetic causes. | QG sees continuity of cause; DC sees discontinuity of variance structures. |
  | **Environment Def** | "Environment" is the residual variance not accounted for by additive genetics. | "Environment" refers to specific, manipulable external factors and developmental processes. | QG defines by exclusion; DC defines by substance. |

  ### 3. Cruxes and predictions

  **Crux 1: The Boarding School Utility**
  **Hypothetical:** We implement the Uniform Boarding School for IQ. Environmental variance ($V_E$) collapses. Observed $h^2$ rises to 0.95, but the population mean IQ drops 10 points compared to varied homes.
  **QG Prediction:** The rise to 0.95 confirms that genetic differences persist when noise is removed. This number is useful for predicting relative standing and selection response within that system.
  **DC Prediction:** The rise to 0.95 proves the metric is insensitive to massive mean shifts caused by environment. It signals nothing about the system's malleability or welfare.
  **Concession:** QG concedes $h^2$ alone cannot guide policy without mean-level data. DC concedes $h^2$ accurately predicts relative resemblance among children in that specific uniform setting.

  **Crux 2: Trait K Retrospective**
  **Hypothetical:** Historical data shows Trait K had $h^2=0.9$ before the salt program. We discover the nutrient was commercially available but culturally unused during the high-heritability phase.
  **QG Prediction:** The 0.9 estimate was accurate for that time. Cultural uniformity counts as environmental uniformity; the variance was genuinely genetic relative to the actual conditions.
  **DC Prediction:** The 0.9 estimate was misleading. It obscured the latent environmental leverage that existed but was ignored, suggesting immutability where there was only neglect.
  **Concession:** QG concedes $h^2$ does not scan for latent, unutilized environmental levers. DC concedes $h^2$ correctly describes actual variance components, not potential causal structures.

  **Crux 3: Genetic Nurture Decomposition**
  **Hypothetical:** A study separates effects of transmitted alleles from non-transmitted parental alleles (genetic nurture) for Educational Attainment.
  **QG Prediction:** The direct effect (transmitted only) is the "true" heritability. Nurture is a confound that inflates estimates and should be subtracted to isolate biological causation.
  **DC Prediction:** Nurture is part of the real-world effect of having those genes. Removing it understates family resemblance and ecologically valid intergenerational transmission.
  **Concession:** QG concedes nurture is a real effect of parental genes on child outcomes. DC concedes direct biological effects are mechanistically distinct from mediated environmental effects.

  **Crux 4: Between-Group Priors**
  **Hypothetical:** Two groups differ by 1 SD on Trait X. Within-group $h^2$ is 0.8 for both. No known environmental differences are measured.
  **QG Prediction:** A genetic explanation for the gap is a live hypothesis worth testing seriously. High within-group $h^2$ makes genetic causes plausible priors.
  **DC Prediction:** A genetic explanation is no more likely than before. Within-group variance partitioning is orthogonal to between-group mean differences; environmental sufficiency remains default.
  **Concession:** QG concedes within-group $h^2$ does not quantify between-group variance sources. DC concedes genetic differences could exist but are not inferred from within-group statistics alone.

  ### 4. Verbal disputes

  We fight over "cause," "heritable," and "environment." QG uses "cause" to mean "source of variance in a model." DC uses "cause" to mean "manipulable mechanism." When QG says "genes cause variance," DC hears "genes fix the trait." When DC says "environment causes the gap," QG hears "genes play no role." QG must stop using "heritable" without immediately appending "in this population." DC must stop implying "environmental" means "easy to change." Both agree "nature vs. nurture" is a false dichotomy, but QG treats it as a variance partitioning problem while DC treats it as a developmental systems problem. QG needs to admit that "genetic cause" sounds like immutability to laypeople. DC needs to admit that "social construction" doesn't erase biological pathways. If QG says "biological basis" and DC says "developmental process," they might agree faster. The fight is often whether $h^2$ describes reality (QG) or a specific statistical artifact (DC). QG should say "variance attributable to" instead of "caused by." DC should say "intervention-sensitive" instead of "environmental." The term "heritability" itself is the biggest blocker; QG wants to keep it as technical jargon, DC wants it retired from public discourse. They agree it stays in textbooks but differs on press releases.
