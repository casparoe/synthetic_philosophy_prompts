answer: |-
  This is one of the most robust and well-documented phenomena in the cognitive science of expertise, yet it remains stubbornly difficult to name because it sits at the intersection of neuroscience, psychology, and philosophy.

  You are describing the dissociation between **Procedural Knowledge** (knowing how) and **Declarative Knowledge** (knowing that), compounded by a mechanism called **Confabulation**.

  If you need a single label for your notes, **Procedural Encapsulation** is the most precise technical term. If you need a label for the audience, **Tacit Knowledge** is the standard, but it is often too vague. The specific dynamic you are watching—where the verbal account is false, persistent, and causally inert—is best described as **Introspective Opacity**.

  Here are the edges you asked for: the mechanisms, the distinctions, and how to probe for them in an interview.

  ### 1. The Mechanism: Why the Nurse Lies (Without Lying)
  The nurse is not lying, and she is not bad at introspection. She is experiencing **Confabulation**.

  In cognitive science (specifically the work of Jonathan Haidt and Robert Zajonc), the conscious mind is often described as a "Press Secretary." It does not make the decisions; it explains them after the fact to maintain social coherence.
  *   **The Action:** Happens in System 1 (fast, automatic, procedural). Her motor cortex and basal ganglia are running a script compiled over thousands of hours.
  *   **The Explanation:** Generated by System 2 (slow, analytical, linguistic). When you ask "How did you do that?", System 2 scans the environment for a plausible rule that *sounds* like it caused the action.
  *   **The Persistence:** When you show her the video, she updates her *belief* ("Huh, I guess I do that"), but she cannot update the *procedure*. The procedure is stored in a different neural architecture (striatum/cerebellum) than the belief (prefrontal cortex). You cannot reprogram a neural net with a sentence.

  **The Edge:** If the description changes but the hands don't, you are looking at **Encapsulated Expertise**. The module that does the work is sealed off from the module that speaks.

  ### 2. The Contrast: The Chess Player
  The chess player represents the reverse failure mode. This is often seen in experts who have high **Declarative Knowledge** but low **Proceduralization**.

  In the **Dreyfus Model of Skill Acquisition**, this is the difference between the *Competent* performer and the *Expert*.
  *   **The Nurse (Expert):** Operates on **Recognition-Primed Decision Making (RPD)**. She doesn't compare options; she recognizes the pattern and the solution appears. The "reason" is post-hoc.
  *   **The Chess Player (Competent/Proficient):** Operates on **Analytical Comparison**. They calculate variations. They can articulate the "why" because the "why" is actually the algorithm they are running. However, because they are running the algorithm consciously, they are slower and more error-prone than a Grandmaster who "just sees" the move (and might struggle to explain it).

  **The Edge:** The chess player's knowledge is **Causally Transparent** but **Computationally Expensive**. The nurse's knowledge is **Causally Opaque** but **Computationally Cheap**.

  ### 3. Interview Heuristics: How to Tell Them Apart
  You need to determine if the subject is operating from *intuition* (Nurse) or *analysis* (Chess Player). Do not ask "How do you know?" Ask questions that stress the interface between the two systems.

  **A. The Interference Test**
  Ask them to perform the skill *while* narrating it in real-time.
  *   **The Nurse:** Her performance will degrade. Narrating forces the procedural task into the declarative system, causing "reinvestment" or choking. She might say, "I can't talk and do this."
  *   **The Chess Player:** Their performance may remain stable or even improve slightly, because they are already operating in the declarative mode.

  **B. The Novelty Test**
  Present a scenario that breaks their usual patterns.
  *   **The Nurse:** Will pause, hesitate, and then *switch to rules*. When intuition fails, experts drop down to the rule-based level. They will suddenly sound like the chess player.
  *   **The Chess Player:** Will continue to analyze, but may run out of time or computational power. They won't have a "drop down" because they are already at the bottom (rules).

  **C. The Pedagogy Probe**
  Ask: "If I tried to do exactly what you just said, would I succeed?"
  *   **The Nurse:** Will often admit, "No, you need to get the feel for it." Their explanation is a **Pedagogical Proxy**. It is a simplification designed to nudge a novice's body into the right configuration, not a technical manual.
  *   **The Chess Player:** Will insist, "Yes, if you follow the logic." They believe the map is the territory.

  ### 4. Is the Description "Workless"?
  You asked if the fact that the description does no work is evidence about the knowledge or just bad introspection.

  It is evidence about the **architecture of the knowledge.**
  The description is not a *control signal*; it is a *social signal*.
  *   **For the Nurse:** The false description serves to stabilize her own confidence and communicate authority to the resident. It creates a shared language, even if that language doesn't match the physics.
  *   **For the Mechanic:** When he says, "That's what the manual says, I'm telling you what I do," he is acknowledging the gap between **Canonical Knowledge** (textbook) and **Situated Knowledge** (contextual reality).

  **The Crucial Nuance:**
  Do not treat the false description as "noise" to be discarded. It is data. It tells you what the expert *values* or *fears*.
  *   If the nurse says "Check the angle" (but she doesn't), it means she *thinks* angle is the critical variable. It reveals her mental model of risk, even if her hands have surpassed that model.
  *   This is called **Espoused Theory vs. Theory-in-Use** (Chris Argyris). In high-stakes expertise, these two almost always diverge.

  ### 5. Recommended Vocabulary for Your Piece
  To avoid the vagueness of "tacit knowledge," consider using this cluster:

  1.  **Procedural Encapsulation:** The skill is walled off from conscious access.
  2.  **Post-hoc Rationalization:** The explanation is generated after the action.
  3.  **Recognition-Primed Decision Making (RPD):** The specific model of how the nurse decides (Gary Klein's work is essential here).
  4.  **The Dreyfus Continuum:** To explain the difference between the Nurse (Expert/Master) and the Chess Player (Competent/Proficient).

  ### 6. Reading List for Context
  *   **Hubert Dreyfus, *Mind Over Machine*:** The philosophical foundation. Argues that expertise is the abandonment of rules, not the refinement of them.
  *   **Gary Klein, *Sources of Power*:** Specifically the chapters on naturalistic decision making and the recognition-primed decision model. He studies firefighters and nurses exactly like your subject.
  *   **Michael Polanyi, *The Tacit Dimension*:** The origin of "we know more than we can tell."
  *   **Jonathan Haidt, *The Righteous Mind*:** Specifically the "Press Secretary" analogy for why we confabulate reasons.
  *   **Stuart Dreyfus & Hubert Dreyfus, "A Five-Stage Model of the Mental Activities Involved in Directed Skill Acquisition":** The paper that defines the levels.

  ### Summary for your Notebook
  *   **The Phenomenon:** Procedural Encapsulation / Introspective Opacity.
  *   **The Cause:** Skill has migrated from declarative (conscious) to procedural (subconscious) memory.
  *   **The False Story:** Confabulation / Press Secretary function.
  *   **The Chess Player:** High Declarative, Low Procedural (Analytical).
  *   **The Nurse:** High Procedural, Low Declarative (Intuitive).
  *   **Interview Tell:** Does talking while doing it break the flow? (Yes = Nurse/Expert).
  *   **The Value of the Lie:** It is a Pedagogical Proxy, not a Technical Specification.

  The nurse is not failing to introspect; she is succeeding at *doing*. The introspection is the bottleneck, not the skill.
