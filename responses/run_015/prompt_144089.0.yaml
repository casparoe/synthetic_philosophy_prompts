answer: |-
  Here is the breakdown of the claim, the menu of interpretations, and the verdict on whether your interlocutors are getting away with what they want.

  ### The Core Distinction
  First, you have to separate the *epistemic* complaint from the *ethical* complaint. Most people using the slogan think they are making an epistemic point (crowds don't know things) or a metaphysical one (crowds don't exist). Kierkegaard was making an ethical-existential point (crowds allow individuals to hide).

  In *The Present Age*, his target wasn't stupidity; it was **leveling**. It was the mechanism by which passion is drained from action, and responsibility is dissolved into abstraction. When he says "the crowd is untruth," he means that the crowd is a place where a person can say "we" instead of "I," and in doing so, escape the requirement of becoming a self.

  Here is the menu of readings, from shallow to deep.

  ### 1. The Pop-Psych Reading ("Mob Mentality")
  **The Claim:** Groups are emotionally volatile, prone to panic, and less rational than a calm individual.
  *   **Status:** **Mostly False.** This is the "madness of crowds" trope. It ignores the wisdom of crowds, prediction markets, and scientific consensus. Aggregation often *improves* truth-tracking by canceling out individual noise.
  *   **Does it work for Case 1 (Group Blog)?** No. Even if the blog is irrational, it can still be held responsible for its output. A mob can still be liable for a crime.
  *   **Does it work for Case 2 (Twitter)?** No. It explains *why* Twitter might be wrong, but not why "Twitter believed X" is a category error.

  ### 2. The Epistemic Diffusion Reading ("No One is Responsible for the Data")
  **The Claim:** In a crowd, information cascades occur. People signal agreement without verifying. The chain of justification is broken because no single person holds the whole argument.
  *   **Status:** **Substantive and Defensible.** This is a real phenomenon. When a view is held "by the crowd," it often means it is held superficially by many, but deeply by none. The justification is outsourced.
  *   **Does it work for Case 1 (Group Blog)?** Partially. It suggests the blog's positions are fragile because no single author owns the whole worldview. But it doesn't grant immunity from criticism; it actually invites *more* scrutiny on the coherence of the posts.
  *   **Does it work for Case 2 (Twitter)?** Yes, mostly. It supports the idea that "Twitter believed X" is a shorthand for "many people signaled X without vetting it." It denies the *unity* of the belief, but not the occurrence of the signaling.

  ### 3. The Metaphysical Reading ("The Group is Not an Agent")
  **The Claim:** Only individuals have minds. "The crowd" is a fiction. Therefore, the crowd cannot believe, know, or act. Only the people in it can.
  *   **Status:** **Substantive but Trivial.** It is ontologically true that a group mind does not exist (unless you're a hard collectivist). However, it is linguistically and functionally useful to treat groups as agents (e.g., "Google decided," "The Supreme Court ruled"). Denying this is often a pedantic dodge.
  *   **Does it work for Case 1 (Group Blog)?** **This is your interlocutor's main play.** They argue: "No single agent = no target for blame."
      *   *The Trap:* This reading gets you "The blog is not a believer," but it fails to get you "The blog cannot be criticized." If I shoot you, *I* am responsible. If forty of us rotate shooting you under one name, *we* are responsible. The lack of a stable byline does not dissolve the agency of the writers; it just obscures it. Kierkegaard would say this structure is the *definition* of untruth: it is a machine built to prevent accountability.
  *   **Does it work for Case 2 (Twitter)?** Yes. "Twitter decided" is metaphorically true but literally false. It helps clarify that there is no central committee. But it doesn't mean nothing happened.

  ### 4. The Existential Reading ("Truth is Appropriation")
  **The Claim:** Truth is not just a property of a proposition (correspondence to reality); it is a property of a *relationship* between a person and a proposition. To hold a truth, you must hold it with inwardness, passion, and risk. The crowd allows you to hold opinions "at a distance," without risk. Therefore, crowd-held opinions are "untruth" because they are not *lived* truths.
  *   **Status:** **Radical and Defensible (within Kierkegaard's framework).** This is the actual argument. It shifts truth from *what* you know to *how* you know it.
  *   **Does it work for Case 1 (Group Blog)?** **It backfires on the interlocutor.** If truth requires a specific individual to stake their reputation and soul on a claim, the anonymous rotating blog is a factory of untruth. The interlocutors want to use this to say "You can't call the blog wrong." Kierkegaard uses it to say "The blog is ethically void because no one is willing to be wrong." It condemns the blog, it doesn't protect it.
  *   **Does it work for Case 2 (Twitter)?** Yes. "Twitter believed X" is untruth because the belief was costless. It validates your friend's skepticism about the *quality* of the belief, but not the *existence* of the phenomenon.

  ### The "Eat Cost" Hypothesis
  You suggested: *"A view only counts as someone's if there's a person who'd eat a real cost for it being false."*

  Your friend said that's not what the slogan means. They are right about Kierkegaard's text, but you are right about the spirit.
  *   **Why they are right:** Kierkegaard isn't talking about betting or falsification conditions. He's talking about *subjectivity*. You can eat a cost for a lie (martyrs for bad causes exist). The point is the *inwardness*, not the external stake.
  *   **Why you are right:** In a secular, rationalist context, "willingness to eat cost" is the best operational proxy for "inwardness." If you won't bet on it, you don't actually believe it; you're just signaling affiliation with the crowd.

  So, your cash-out is the best modern translation of Reading #4, even if it misses the theological nuance.

  ### The Verdict on Your Interlocutors

  Your suspicion is correct. They are using the **Metaphysical Reading** (#3) to try to secure the ethical immunity of the **Existential Reading** (#4), but they are getting it backward.

  **On Case 1 (The Group Blog):**
  They want to say: *No single author -> No moral agent -> No blame.*
  Kierkegaard says: *No single author -> No ethical engagement -> Untruth.*
  The slogan does not grant the blog immunity from criticism. It grants the critics permission to dismiss the blog as ethically weightless. The forty members are not off the hook; they are *more* on the hook because they are using the "crowd" (the blog brand) to hide their individual faces. Kierkegaard's point is that you cannot hide in the "we." If the blog lies, the specific person who wrote that post lied, and the specific people who edited it lied. Hiding the byline is an act of cowardice, which is a form of untruth.

  **On Case 2 (Twitter/The Internet):**
  They want to say: *No central mind -> No fact of the matter -> Discard the claim.*
  Kierkegaard says: *No central mind -> Abstraction -> Danger.*
  He agrees that "The Public" is a phantom. He would agree that saying "Twitter decided" is sloppy. But he would not agree that this makes the phenomenon irrelevant. The "leveling" power of Twitter is dangerous precisely *because* it acts without a head. It exerts pressure without responsibility.
  Your friend is right that "Twitter believed X" is metaphysically loose. But using that looseness to kill the conversation is a dodge. The substantive claim is "Many individuals signaled X without personal risk," which is a very real, very dangerous fact.

  ### Summary
  The slogan is being used as a shield to protect collective irresponsibility. Kierkegaard intended it as a sword to cut through collective irresponsibility.

  *   **Reading 1 (Crowds are dumb):** False. Doesn't help them.
  *   **Reading 2 (Epistemic diffusion):** True. Doesn't absolve them.
  *   **Reading 3 (No agent):** True. Gets them "Twitter isn't a person," but fails to get them "The blog is blameless."
  *   **Reading 4 (Existential appropriation):** True (for Kierkegaard). Actively condemns their blog structure.

  Your "eat cost" definition is the strongest secular version of Reading #4. It correctly identifies that without skin in the game, there is no belief, only alignment. If your interlocutors want to use Kierkegaard, they have to accept that their anonymous blog is a machine for producing untruth, not a sanctuary from criticism.
