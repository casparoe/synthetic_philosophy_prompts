prompt: |-
  Hey — weird one, and sorry in advance, it's not the usual sort of thing. I'm about two hundred pages into a novel and I've painted myself into a corner with a language I invented for one of the cultures in it.

  The grammer I gave myself works roughly like this: every verb describing an action has to carry a marker saying whether the action achieved what it was for. Not tense, not whether it's finished — whether it came off. You can't say I went to the well without also saying whether the water got fetched, and there's no neutral or unmarked option. There's also no standalone verb meaning to try or to intend that doesn't itself carry the same succeeded/failed marking. And the bit I didn't think through when I started: the marker is required for stuff that hasn't happened yet too. So I'll go to the well tomorrow already commits you, right there in the morphology, to whether the trip is going to work out.

  The scene I'm stuck on is the emotional centre of the book. My narrator — grew up in this language, and I'm writing in English but I want the reader to feel the shape of the original, if that makes sense — has to decide whether to attempt something genuinely risky and probably stupid: a crossing, bad weather, a kid with her. She's alone, turning it over, and the whole point is that she doesn't know if it'll work and chooses anyway. But every time I try to write her thinking it through in her own head the language seems to slam the door: she can't even put the option to herself without already declaring it a success or a failure. Which either makes the scene unwritable or makes her look incapable of basic practical reasoning, and I don't want that — she's meant to be competent, and I really don't want to write a character who's intellectually disabled by her own grammar. Feels cheap, and kind of gross besides.

  So what would actually be going on? Does the language really box her in, or would she have workarounds — roundabout phrasings, conditionals, quoting or ventriloquizing herself, some irrealis or hedging form, a special shape for vows and hopes — and if so how awkward would those feel to her, and would that awkwardness be visible in the prose? Also the knock-on stuff: if you have to mark outcome every single time, would she be unusually preoccupied with whether things actually worked, unusually bad at I did my best as an excuse, unusually hard on people who failed through no fault of their own? Or is that overstating it, and she'd just mark it the way I mark tense, automatically, without it coloring anything? And is it even stable — wouldn't speakers invent a neutral form inside a generation or two, given how often they'd need one?

  One more thing I keep going back and forth on: whether it's coherent to say she thinks in this language at all. Half the time my own thoughts don't feel like sentences.

  What I'm after is: what can I plausibly let the grammar do to her, what should I keep off-limits, and how do I show any of it in English without stopping every other paragraph to explain.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Problem:**
      *   **Context:** The user is 200 pages into a novel.
      *   **Conlang Feature:** Verbs *must* mark whether an action succeeded or failed (teleological/evidential aspect?). This applies to past, present, and *future*.
      *   **Constraint:** No neutral option. No standalone "try/intend" without success/failure marking.
      *   **The Conflict:** The protagonist needs to contemplate a risky future action (crossing in bad weather with a kid). She doesn't know the outcome. But her language forces her to grammatically commit to success or failure just by formulating the thought.
      *   **The Fear:** This makes her look intellectually disabled or irrational ("cheap," "gross").
      *   **The Questions:**
          *   Does the language actually box her in?
          *   Are there workarounds (conditionals, hedging, etc.)?
          *   How does this affect her psychology/culture (preoccupation with outcomes, judgment of failure)?
          *   Is the language stable (wouldn't speakers invent a neutral form)?
          *   Do people think in sentences?
          *   **Goal:** How to show this in English without exposition dumps, maintaining character competence.

  2.  **Linguistic & Cognitive Reality Check (Sapir-Whorf Lite):**
      *   *Strong Determinism (Language controls thought):* Generally discredited. People can conceive of concepts even if their language makes them awkward to express.
      *   *Weak Determinism (Language influences habit):* More accepted. It makes certain distinctions more salient or requires more cognitive effort to express others.
      *   *The "Future Success" Paradox:* Forcing a success/failure marker on a *future* event is linguistically unusual (usually this is "realis/irrealis" or "potential/actual"). If the grammar *requires* it, it's not stating fact, it's stating *expectation* or *intent* framed as outcome.
      *   *Stability:* Yes, languages evolve. If a distinction is pragmatically impossible (predicting the future), speakers *will* develop a workaround, or the meaning of the marker will shift (e.g., from "did succeed" to "intended to succeed").

  3.  **Addressing the Specific Constraints:**
      *   *The "Future Success" Marker:* If I say "I will-go-SUCCESS," it doesn't mean "I will definitely succeed." It likely means "I am undertaking this action *with the intent/expectation* of success." It's a performative commitment, not a prophecy.
      *   *The "Failure" Marker:* "I will-go-FAILURE" sounds like resignation or a warning. "I'm going to try, but I expect to fail."
      *   *The "Neutral" Workaround:* If there's no grammatical neutral, there *must* be a lexical or syntactic one. Humans are too pragmatic to let a language break basic planning.

  4.  **Brainstorming Solutions for the Scene:**
      *   *Reframing the Marker:* It's not "Truth," it's "Stance." Success = Commitment/Confidence. Failure = Doubt/Warning.
      *   *Workarounds:*
          *   Conditional clauses ("If I go-SUCCESS...").
          *   Reporting speech/thought ("Suppose I were to go-SUCCESS").
          *   Splitting the verb ("I will move" + "The goal will be reached").
          *   Using a different mood (Subjunctive/Optative) that overrides the aspect.
      *   *Psychological Impact:* She wouldn't be "disabled." She would be hyper-aware of *agency* and *outcome*. "Trying" isn't enough. Did it work?
      *   *Thinking in Language:* People don't always think in full sentences. Pre-linguistic intuition exists. The struggle happens when she tries to *articulate* the plan.

  5.  **Drafting the Advice (Section by Section):**

      *   **Validation:** Acknowledge this is a cool constraint (resembles "evidentiality" or "teleological aspect"). It's not a dead end.
      *   **Linguistic Stability:** Address the "wouldn't they invent a neutral form?" question. Yes, but maybe it's marked as "risky" or "hopeful." Or the meaning shifted from *outcome* to *intent*.
      *   **The "Future" Problem:** This is the crux. In future tense, "Success" $\neq$ Fact. It means "I commit to this outcome." "Failure" means "I anticipate obstruction."
      *   **Character Competence:** She isn't stupid. She knows the grammar is a tool, not reality. She can use "counterfactuals."
      *   **Workarounds (The "How-To"):**
          *   *The Hypothetical Frame:* "In a world where I go-SUCCESS..."
          *   *The Split:* "I will travel. The water will be fetched." (Dissociate action from result).
          *   *The "Try" Verb:* Even if "try" takes a marker, maybe "struggle" or "weigh" doesn't.
      *   **Cultural/Psychological Fallout:**
          *   Blame culture? If you fail, you grammatically admitted failure.
          *   "Doing your best" is linguistically invalid. Only results matter.
          *   This creates high stakes. Perfect for a novel.
      *   **Rendering in English:**
          *   Don't use footnotes.
          *   Use phrasing that implies the constraint. "I went, and the water came" vs "I went, but the well was dry."
          *   Show the hesitation. She struggles to *say* it, not to *think* it.

  6.  **Refining the "Future Success" Logic:**
      *   If the marker is mandatory for future events, it functions as a *volitional* marker.
      *   *Success-marked future:* "I will do X (and make it happen)."
      *   *Failure-marked future:* "I will do X (and it won't work / I don't expect it to)."
      *   *The Dilemma:* She wants to say "I will do X (and I don't know)."
      *   *The Solution:* She must choose a stance. This *is* the emotional conflict. Choosing the "Success" marker is an act of faith. Choosing the "Failure" marker is an act of caution. The scene isn't about whether she *can* say it, it's about which lie she's willing to tell the universe.

  7.  **Addressing "Thinking in Language":**
      *   Crucial point. We don't think in full grammar all the time. We think in images, feelings, concepts. The grammar kicks in when we *narrativize*.
      *   So, she feels the risk (pre-linguistic). When she tries to crystallize the plan, the grammar forces a choice. That friction *is* the drama.

  8.  **Final Review against User Constraints:**
      *   *Don't make her look disabled:* Emphasize her meta-linguistic awareness.
      *   *Don't exposition dump:* Show through hesitation, phrasing choices.
      *   *Stability:* Acknowledge speakers adapt. Maybe the "Success" marker on future verbs has colloquially softened to "Intend."

  9.  **Constructing the Response:** (Iterative refinement for tone—supportive, analytical, creative).
      *   *Intro:* Validate the conlang (it's a "teleological aspect").
      *   *Section 1: The Future Paradox.* Reframe "Success" as "Commitment."
      *   *Section 2: Workarounds.* Conditionals, dissociation, lexical hedging.
      *   *Section 3: Psychology.* Outcome bias, no "participation trophies."
      *   *Section 4: Thought vs. Speech.* Pre-linguistic thought.
      *   *Section 5: Rendering in English.* Specific stylistic tips.

  10. **Self-Correction during drafting:** I initially thought about suggesting she invents a new word. But the user said "200 pages in." Better to stick to existing grammar mechanics that she manipulates. The "Commitment vs. Prophecy" distinction is the strongest linguistic fix. It preserves the constraint but removes the "stupidity."

  11. **Final Polish:** Ensure the tone matches the user's thoughtful, slightly anxious vibe. Reassure them that this is a feature, not a bug. (Proceed to generate output).

  *(Self-Correction Note: Make sure to mention "Irrealis" mood. If the language has no irrealis, that's a huge gap, but likely it exists for conditionals. I should suggest she uses conditionals to bypass the assertion of fact.)*

  *(Another Note: The user asked about stability. I need to be clear that languages *do* change, but for the sake of the novel, we can posit that this is a sacred/cultural grammar that resists change, or that the meaning has shifted subtly.)*

  *(Final thought on the "Thinking" question: This is a philosophy of mind question. I should affirm that non-linguistic thought is standard cognitive science consensus.)*

  Okay, ready to write.s
answer: |-
  This is not a weird question at all; it's a fantastic problem to have. You've stumbled into a specific area of linguistic relativity (often called the Sapir-Whorf hypothesis, though linguists prefer "linguistic relativity") that deals with **teleological aspect** or **resultative evidentiality**.

  You are worried you've broken your character. You haven't. You've actually built a pressure cooker for drama.

  Here is the breakdown of how a speaker of this language would actually function, how to keep your protagonist competent, and how to render this in English without footnotes.

  ### 1. The Future Tense Paradox: Prophecy vs. Commitment
  Your main block is this: *How can she plan for the future if the grammar forces her to declare the outcome?*

  If this language is stable (and humans are pragmatic, so it must be), the "Success/Failure" marker on a **future** verb cannot function as a statement of fact. It cannot mean "This *will* happen." It must function as a statement of **volition** or **stance**.

  *   **Future-Success:** "I will go (and I am committed to making it work)."
  *   **Future-Failure:** "I will go (but I expect it to be futile / I am going despite the odds)."

  This doesn't make her intellectually disabled; it makes her **performative**. When she speaks the verb with the "Success" marker, she isn't predicting the future; she is making a vow. When she uses the "Failure" marker, she is expressing resignation or caution.

  **The Conflict:** The emotional weight of the scene isn't that she *can't* think the thought. It's that to articulate the plan, she has to choose a stance she isn't sure she can back up. Choosing the "Success" marker feels like hubris or a lie. Choosing the "Failure" marker feels like surrender.

  **The Fix:** She isn't blocked from reasoning. She is blocked from *neutral commitment*. This forces her to confront her own confidence. That is character depth, not disability.

  ### 2. Linguistic Workarounds (How Speakers Adapt)
  Languages are fluid. If a constraint is too annoying, speakers develop syntax to bypass it. Your character would know these tricks instinctively.

  *   **The Conditional Escape:** Most languages have a subjunctive or conditional mood ("If," "Suppose," "Might"). If she says, *"If I were to cross-SUCCESS,"* the success marker is contained within the hypothetical. It no longer asserts fact; it explores a scenario. She can think: *"If I cross-SUCCESS, we live. If I cross-FAIL, we die."* This allows her to weigh outcomes without committing to one.
  *   **Verb Dissociation:** She can separate the *motion* from the *goal*.
      *   *Constraint:* "I will fetch-water-SUCCESS." (Too bold).
      *   *Workaround:* "I will travel-SUCCESS. The water will be fetched-UNKNOWN."
      *   If your grammar allows compound sentences, she can mark the action she controls (traveling) as Success (I will definitely move my legs), and the outcome (water) as a separate clause that she can hedge.
  *   **The "Try" Loophole:** You said there's no standalone "try" without marking. But what about "struggle," "weigh," "consider"?
      *   She can't say "I will try to cross."
      *   She *can* say "I am **considering** the crossing." (The verb "consider" takes a marker: "I consider-SUCCESS" = I have reached a conclusion. "I consider-FAIL" = I am stuck in doubt).
      *   This lets her dwell in the uncertainty *before* committing to the action verb.

  ### 3. Psychological & Cultural Fallout
  You asked if she'd be preoccupied with outcomes. **Yes.** But not in a "disabled" way. In a "high-stakes" way.

  *   **No "Participation Trophies":** In English, "I tried" is a valid excuse. In her language, "I tried-SUCCESS" means I did it. "I tried-FAIL" means I wasted time. There is no grammatical space for "I tried my best but failed." This creates a culture that is likely harsh on incompetence but incredibly resilient. You don't complain about the effort; you fix the result.
  *   **Blame Assignment:** If someone says "I will help-SUCCESS" and then doesn't, they haven't just failed; they have grammatically lied. Trust would be tied to verbal morphology.
  *   **Risk Assessment:** She wouldn't be bad at reasoning. She would be hyper-aware of the difference between *agency* and *luck*. She might avoid using the Success marker on things outside her control. "The rain will fall-FAIL" (It won't rain, or the rain is unhelpful).

  **Is the language stable?**
  Linguists would argue that over centuries, the "Future-Success" marker would semantically drift to mean "Intention." (e.g., Latin *amabo* "I will love" comes from *amare* "to love" + *bo* a future suffix, but originally implied desire).
  *For your book:* You can acknowledge this. Maybe the elders use the strict definition, but the younger generation uses "Success" just to mean "I plan to." Your protagonist, being competent, knows the difference between the colloquial "I plan to" and the literal "I guarantee this." That tension adds realism.

  ### 4. Do People Think in Sentences?
  **No.** This is your safety valve.
  Cognitive science suggests much of human thought is non-linguistic (images, spatial relationships, emotional valences, "gist"). Language is often just the rendering engine we use to communicate or to structure complex logic.

  *   **Pre-linguistic Thought:** She feels the fear. She sees the waves. She calculates the weight of the kid. None of this requires verbs.
  *   **The Crystallization Point:** The friction happens when she tries to *narrativize* the decision. When she tries to turn the feeling into a plan, the grammar snaps into place.
  *   **How to write it:** Show the thought as image/feeling first, then show the struggle to codify it.
      *   *Example:* "The boat rocked. A cold weight in her gut. *Go.* The word formed, but the shape of it was wrong. To speak it was to promise the water would obey. She couldn't promise that. She shaped the word for 'struggle' instead. 'I will fight-SUCCESS.'"

  ### 5. Rendering This in English (Without Exposition)
  Do not stop the story to explain the grammar. **Enact the grammar.**

  **Technique A: The Double-Verb**
  English doesn't have your marker, so you have to mimic the *feeling* of it. When she commits, make the prose decisive. When she doubts, make it passive.
  *   *Normal:* "I thought about going to the well."
  *   *Her Internal Voice:* "I went to the well, and the water came." (Past tense success).
  *   *Her Internal Voice:* "I went to the well, but the water stayed." (Past tense failure).
  *   *Future:* "I will go, and the water will come." vs "I will go, though the water stays."

  **Technique B: The Hesitation**
  Show her editing herself.
  > She looked at the boat. *I will cross,* she thought. The thought felt slippery, incomplete. It demanded an ending. *I will cross and arrive.* No. That was a lie. *I will cross and drift.* That was a funeral prayer. She sat with the verb unfinished in her mind, a wire stripped of its insulation.

  **Technique C: Lexical Substitution**
  Use English words that imply outcome.
  *   Instead of "She decided to try," write "She resolved to succeed."
  *   Instead of "She worried it wouldn't work," write "She prepared for the failure."
  *   Make the reader feel that "trying" is not an option. Only "doing" and "achieving" or "doing" and "missing."

  ### Summary of Advice

  1.  **Don't make her stupid.** Make her **aware**. She knows the grammar is a map, not the territory. She knows marking "Success" doesn't magically make it happen, but it commits her to the attempt.
  2.  **Use Conditionals.** Allow her to think in "If/Then" structures. This isolates the success marker inside a hypothetical box, allowing her to weigh options without lying to herself.
  3.  **Reframe the Marker.** Treat Future-Success as "Commitment" and Future-Failure as "Resignation." The scene becomes about her choosing which stance she can live with.
  4.  **Show the Friction.** The drama comes from the gap between the messy reality of uncertainty and the clean, binary demand of her language. That gap is where the emotion lives.
  5.  **Stability.** Acknowledge that colloquially, the marker might be softening, but in high-stakes moments (like this one), the old, strict meaning snaps back into place.

  You haven't painted yourself into a corner. You've built a wall she has to climb. That's what the scene is about. Let her climb it.
