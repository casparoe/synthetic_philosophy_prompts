prompt: |-
  I convene the research group behind an annotated edition of the Jesus tradition — roughly three hundred discrete units (sayings, parables, brief reports of actions), graded one at a time for an adult-education curriculum that will be printed with the grades in the margin and used by teachers with no Greek and no formal training. We meet twice a month, work through about a dozen units per session with a hard ten-minute cap on each, and any contested grade goes to a board that includes two non-specialists and a bishop, who have to be able to see from two sentences why the grade is what it is. So I need an instrument, not an essay: an ordered set of questions my group can actually run, with what counts as a sufficient answer at each step, a point at which we stop and grade low rather than press on, and a point at which we hand a unit to the board because the issue is doctrinal rather than historical. A reading list would be no use to me; we have one. I need the procedure it has not given us.

  Three constraints make this harder than the version in the textbooks.

  First, our group is not agreed on the literary relationships. Most of us work with Markan priority and a sayings source behind Matthew and Luke; one member holds the Two-Gospel ordering, with Matthew first, Luke second, and Mark as a later conflation of the two. I want a procedure whose grades do not quietly depend on which of those is right — or which says so explicitly, in the margin, when they do.

  Second, the unit-by-unit grade has to survive a second, global pass. The set of units we end up grading high should be compossible as the profile of a single agent, and at present we do this informally by testing each new unit against the ones already graded high — which means the order in which we happen to take units can change the outcome. Tell us how to run that pass properly, and what to do when the profile refuses to close.

  Third, two devices of our own that I want stress-tested rather than simply written up:

  - The dependence ledger. We try to count causal chains, not witnesses: two Gospels that both copy Mark count once, and two performances of what may be a single oral form count once unless we can show they diverged upstream. I want the ledger's rules stated precisely, and I want to be told where it systematically over-counts and where it under-counts.
  - The criterion of unused capital, which we invented last year. The idea is that a unit which would have been highly serviceable to the known concerns of the transmitting community, but which that community in fact never quotes, develops, or alludes to, is more likely inherited than composed — on the reasoning that inventors spend their capital. I want to know whether this does work that the dissimilarity and embarrassment criteria cannot do, whether it is secretly one of them in costume, and what its failure modes are.

  One member also maintains that the whole unit-by-unit framing is mistaken: that what we have is a community's remembered Jesus rather than a chain of separable items, and that atomizing it into graded units is already the wrong question. Tell me whether the procedure can make room for that objection anywhere, or whether it lies outside what an instrument of this kind can do.

  What I would like from you, in order:

  1. The procedure itself, as numbered questions with a sufficiency condition for each — what kind of consideration would discharge it, and what kind would not.
  2. The kill screen: the step at which we stop and grade the unit low, and the separate condition under which we should record no verdict at all rather than a low one.
  3. The hand-off: which questions are not factual and must go to a person or to the board, stated so that a non-specialist can see why.
  4. The ledger rules, with their bias in each direction.
  5. The global profile pass: how to run it, how to resolve a profile that will not close, and how to tell the difference between a profile that is genuinely incoherent and a first-century Galilean who is simply not consistent in the way our categories want him to be.
  6. A keep / revise / drop verdict on each of our two devices.
  7. Three worked applications: the baptism of Jesus by John (Mark 1); the saying about destroying the temple and raising it in three days (Mark 14; John 2); and the empty-tomb narrative (Mark 16). I should say that the baptism anchors the opening session of the curriculum and our group has always treated it as the strongest embarrassment case we have, so tell me plainly if the procedure demotes it.
  8. A frank statement of which steps are judgment calls dressed up as procedure, and of what the procedure cannot deliver even when run perfectly.
  9. Finally, what the printed grade may be read as meaning. I am worried about two equal and opposite misreadings by teachers: that "uncertain" will be heard as "did not happen," and that "well attested" will be heard as "these are his words." Say what a marginal grade is and is not licensed to assert, in a sentence that could be printed in the front matter.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Convener of a research group producing an annotated edition of the Jesus tradition for adult education (teachers with no Greek/training).
      *   **Task:** Create a procedural instrument (ordered questions, stop conditions, hand-off rules, etc.) for grading ~300 discrete units of Jesus tradition.
      *   **Constraints:**
          1.  **Literary Relationships:** Group disagrees (Markan Priority/Two-Source vs. Two-Gospel/Farrer). Procedure must be neutral or explicit about dependence.
          2.  **Global Consistency:** High-graded units must form a compossible profile of a single agent. Current method is order-dependent; needs a fix.
          3.  **Specific Devices:** Stress-test the "Dependence Ledger" (counting causal chains, not witnesses) and "Criterion of Unused Capital" (invented by the group).
          4.  **Objection:** One member argues against atomization (community memory vs. discrete units). Address if the procedure can accommodate this.
      *   **Deliverables:**
          1.  The Procedure (numbered questions + sufficiency conditions).
          2.  The Kill Screen (stop/grade low vs. no verdict).
          3.  The Hand-off (doctrinal vs. historical).
          4.  Ledger Rules (bias analysis).
          5.  Global Profile Pass (method + resolution of incoherence).
          6.  Verdict on Devices (Keep/Revise/Drop).
          7.  Three Worked Applications (Baptism, Temple Saying, Empty Tomb).
          8.  Limitations (Judgment calls + what procedure can't do).
          9.  Marginal Grade Meaning (One sentence for front matter).
      *   **Tone:** Professional, precise, procedural, academic but accessible (for the board/non-specialists), frank about limitations.

  2.  **Deconstruct the Challenges:**

      *   *Neutrality on Synoptic Problem:* The procedure needs to focus on *independence of testimony* rather than specific source theories. If Mark and Matthew agree, is it one witness or two? The "Dependence Ledger" addresses this, but the initial questions need to allow for either theory without breaking the flow.
      *   *Global Profile:* This is a coherence test. If Unit A says Jesus never went to Jerusalem and Unit B says he died there, both can't be "High." The current method is order-dependent (first come, first served). The fix needs to be a "batching" or "weighting" system, or a specific review phase where conflicts are adjudicated based on cumulative weight, not arrival time.
      *   *Unused Capital:* This is a variation of Dissimilarity/Embarrassment but focused on *utility*. If the early church needed a proof text for X and didn't use this saying, it's likely authentic. Risk: Argument from silence.
      *   *Atomization Objection:* The procedure *must* grade units (that's the product). However, the "Global Profile" pass is where the holistic objection gets heard. If the profile breaks, it might validate the objection.
      *   *Audience:* Teachers need clarity. "Uncertain" $\neq$ "Fake." "High" $\neq$ "Verbatim Quote."

  3.  **Drafting the Sections:**

      *   **1. The Procedure:** Needs to be a funnel. Start with attestation, move to coherence, then to specific criteria.
          *   Q1: Attestation (independence).
          *   Q2: Coherence (does it fit the emerging profile?).
          *   Q3: Context (does it fit 1st C. Palestine?).
          *   Q4: Transmission (embarrassment/unused capital).
      *   **2. The Kill Screen:** When do we stop? If attestation is singular and late? If it contradicts established high-grade units without strong counter-evidence? "No verdict" is for when evidence is equally balanced or purely doctrinal.
      *   **3. The Hand-off:** Doctrinal issues (Resurrection metaphysics, divinity claims) go to the Board. Historical issues (did he go to Jerusalem?) stay with the group. The "Two Sentences" rule is crucial.
      *   **4. Ledger Rules:** Define "Causal Chain." Mark + Matthew = 1 witness (if Matthew copies Mark). Oral tradition is trickier. Bias: Over-counts independent oral streams; under-counts written conflation.
      *   **5. Global Profile:** How to fix order-dependence? *Iterative weighting.* Don't just add; compare. If A and B conflict, the one with stronger attestation wins. If equal, both drop to "Uncertain." Distinguish inconsistency (human) vs. incoherence (impossible).
      *   **6. Device Verdicts:**
          *   *Ledger:* Keep, but refine oral independence rules.
          *   *Unused Capital:* Revise. It's risky (argument from silence). Needs to be a "boost" not a "criterion."
      *   **7. Worked Applications:**
          *   *Baptism:* High attestation, high embarrassment. Procedure should keep it High.
          *   *Temple Saying:* Mixed attestation, theological development. Likely Uncertain/Medium.
          *   *Empty Tomb:* Mark 16 is the earliest narrative, but late relative to Paul. Doctrinal hand-off risk? No, it's a narrative report. Attestation is tricky (women witnesses = embarrassment).
      *   **8. Limitations:** Be honest. This is probability, not proof. "Judgment calls" exist in weighing independence.
      *   **9. Marginal Meaning:** Crucial for the teachers. "Historical probability," not "Theological truth."

  4.  **Refining the Content (Self-Correction during drafting):**

      *   *Constraint Check:* The user wants the procedure to handle the Synoptic disagreement. I need to make sure the "Dependence Ledger" is the mechanism that solves this, not the initial questions. The initial questions should ask "How many independent streams?" not "Is this Q?"
      *   *Unused Capital:* I need to be careful not to dismiss it entirely, but highlight the "silence" problem. It's distinct from Dissimilarity (which looks at the *content* vs. church) vs. Unused Capital (which looks at the *absence* of usage).
      *   *Global Profile:* The user asked how to run the pass *properly*. The solution is a "Conflict Matrix." When a new unit conflicts with an old "High" unit, you don't just reject the new one. You re-evaluate the old one's weight.
      *   *Atomization:* I need to acknowledge this in the "Limitations" or "Profile" section. The procedure atomizes by design, but the Profile pass checks if the atoms make a whole.
      *   *Baptism:* The user says they treat it as the strongest embarrassment case. If the procedure demotes it, I must say so. Actually, Baptism usually passes almost all criteria (Multiple attestation, Embarrassment, Coherence with John's movement). It should stay High.
      *   *Tone:* Keep it tight. "Instrument, not an essay." Use bolding and lists.

  5.  **Final Polish:**

      *   Ensure the "Two Sentences" rule for the Board is clear.
      *   Ensure the "Kill Screen" distinguishes between "Low Probability" and "Undecidable."
      *   Check the "Unused Capital" analysis against standard criteria (Dissimilarity/Embarrassment).
      *   Make sure the "Marginal Grade" sentence is punchy and precise.

  6.  **Writing the Response:** (Proceeding to generate output based on these thoughts.)
      *   *Structure:* Follow the user's 1-9 list exactly.
      *   *Voice:* Collaborative expert, rigorous, pragmatic.

  *(Self-Correction on the "Unused Capital" criterion)*: I need to be precise. Dissimilarity says "If it's unlike the church, it's Jesus." Unused Capital says "If the church *could* have used this but *didn't*, it's Jesus." They are related but distinct. Unused Capital is vulnerable to the argument "Maybe they didn't know it." I need to flag that.

  *(Self-Correction on Global Profile)*: The user says "order... can change the outcome." The fix is to grade in *batches* or have a *review phase* where conflicts are resolved by weight, not seniority. I will propose a "Conflict Resolution Protocol."

  *(Self-Correction on Baptism)*: The user asks "tell me plainly if the procedure demotes it." Standard scholarship treats Baptism as very strong. My procedure should reflect that unless there's a specific reason to doubt. I will affirm it stays High.

  *(Self-Correction on Empty Tomb)*: This is narrative, not saying. Attestation is debated (Paul doesn't mention empty tomb explicitly in 1 Cor 15, though implies burial/resurrection). Mark 16 is the first narrative. Women witnesses is embarrassment. But it's highly theological. Might be a Board hand-off candidate regarding the *nature* of the event, but the *tradition* of the report is historical. I need to be careful not to grade the *theology* but the *tradition unit*.

  Let's assemble.
answer: |-
  Here is the instrument you requested. It is designed to be run in real-time, to neutralize source-theory disagreements, and to force explicit decisions on coherence and doctrine.

  ### 1. The Procedure
  *Run these questions in order. If a sufficiency condition is not met, move to the next question. If a "Stop" condition is triggered, go to Section 2 (Kill Screen).*

  **Q1: Independence of Streams**
  *   **Question:** How many causally independent streams of tradition attest to the core of this unit?
  *   **Sufficiency:** Two or more independent streams (e.g., Mark and John; or Paul and a Synoptic stream) constitute a *Presumption of Antiquity*.
  *   **Insufficiency:** A single stream, or multiple witnesses that the Dependence Ledger (Section 4) reduces to a single source.
  *   **Note on Source Theory:** If the group splits on whether Matthew copies Mark or vice versa, count them as *one* stream unless the specific variant in question is found in a source both theories agree is independent (e.g., John, Paul, Gospel of Thomas).

  **Q2: Contextual Coherence (Palestine, c. 20–30 CE)**
  *   **Question:** Does the unit presuppose a setting, language, or social dynamic intelligible in first-century Galilee/Judea, without requiring knowledge of post-70 CE church developments?
  *   **Sufficiency:** The unit fits the linguistic (Aramaic substrate), geographical, or socio-political context of the period.
  *   **Insufficiency:** The unit relies on knowledge of the Gentile mission, the destruction of the Temple (as past tense), or developed ecclesial structures.

  **Q3: The Transmission Filter (Embarrassment & Utility)**
  *   **Question:** Does the unit present a difficulty for the evangelist's apparent purpose, or fail to serve a known pressing need of the early church?
  *   **Sufficiency:** (A) The unit creates a theological or apologetic problem the evangelist does not solve (Embarrassment); OR (B) The unit would have been a "proof text" for a major early controversy but is absent from that controversy (Unused Capital).
  *   **Insufficiency:** The unit aligns perfectly with the evangelist's redactional tendencies or solves a known early church problem too neatly.

  **Q4: Profile Coherence (Provisional)**
  *   **Question:** Is this unit compatible with the current "High Grade" profile of the agent?
  *   **Sufficiency:** The unit does not contradict actions or sayings already graded High.
  *   **Stop Condition:** If it contradicts a High Grade unit, do not grade yet. Flag for Global Profile Pass (Section 5).

  ---

  ### 2. The Kill Screen
  *Two distinct exit points for low-confidence units.*

  **A. The "Low Grade" Stop (Historical Unlikely)**
  *   **Trigger:** The unit fails Q1 (Single Stream) AND fails Q3 (No Embarrassment/High Utility).
  *   **Action:** Grade **Low**.
  *   **Rationale:** A unit that appears late, in only one stream, and serves the author's theological needs perfectly is treated as a creation of that stream.
  *   **Margin Note:** "Tradition unique to this narrative stream."

  **B. The "No Verdict" Stop (Undecidable)**
  *   **Trigger:** The unit passes Q1 (Multiple Streams) but fails Q2 (Context) OR Q3 (Utility), *and* the group cannot agree on whether the anomaly is historical or redactional.
  *   **Action:** Grade **Uncertain**.
  *   **Rationale:** Evidence is equally balanced. The unit is ancient, but its origin (Jesus vs. Early Community) cannot be distinguished.
  *   **Margin Note:** "Early tradition, origin indeterminate."

  ---

  ### 3. The Hand-off
  *Conditions under which the research group must yield to the Board.*

  **The Doctrinal Threshold**
  *   **Condition:** The grading decision rests on a metaphysical claim rather than a historical probability.
  *   **Test:** Can the justification be stated without invoking divine agency, miraculous causation, or theological necessity?
  *   **Example:** "We grade this Low because a man cannot walk on water" is a metaphysical claim (Hand-off). "We grade this Uncertain because the narrative structure matches Old Testament typology too closely" is a historical claim (Keep).
  *   **Board Instruction:** The Board receives a dossier with two sentences:
      1.  "The historical evidence suggests [X]."
      2.  "Accepting this grade requires the teacher to affirm/deny [Doctrinal Point Y]."
  *   **Outcome:** The Board decides if the curriculum can sustain the doctrinal implication of the historical grade.

  ---

  ### 4. The Ledger Rules
  *Precise rules for counting witnesses to satisfy the Synoptic disagreement constraint.*

  **Rule 1: The Written Chain**
  *   Any text demonstrably copying another counts as the *same* witness for the copied material.
  *   **Application:** If Markan Priority holds, Mark + Matthew = 1 witness. If Two-Gospel holds, Matthew + Mark = 1 witness.
  *   **Resolution:** In cases of disagreement, count the Synoptics as **one stream** unless the material is in the "Double Tradition" (Matthew/Luke agreement against Mark), which counts as a **second stream** under all major theories.

  **Rule 2: The Oral Chain**
  *   Two oral performances count as independent streams only if they show *divergent development* upstream of the written text.
  *   **Application:** Variant wordings of the same parable in Thomas and Q count as two streams. Identical wording in Didache and Matthew counts as one.

  **Bias Analysis:**
  *   **Over-counting:** The Ledger systematically over-counts oral independence. It assumes divergence implies separate streams, but a single oral tradition can vary wildly in performance.
  *   **Under-counting:** The Ledger systematically under-counts written independence. It assumes literary dependence precludes access to independent oral tradition, but an author (e.g., Luke) may correct his source (Mark) using oral data.

  ---

  ### 5. The Global Profile Pass
  *Correcting the order-dependence of your current method.*

  **The Method: Weighted Conflict Resolution**
  *   Do not grade units sequentially into a permanent "High" bin. Grade all 300 units provisionally first.
  *   **Step 1:** Map all "High" units onto a matrix of agency (e.g., Eschatology, Ethics, Self-Understanding, Actions).
  *   **Step 2:** Identify contradictions (e.g., Unit A: "Go only to Israel"; Unit B: "Go to all nations").
  *   **Step 3:** Resolve by **Cumulative Weight**, not Seniority.
      *   If Unit A has 3 independent streams and Unit B has 1, Unit A stays High, Unit B drops to Uncertain.
      *   If both have equal weight, **both** drop to Uncertain. (Do not pick a winner).

  **Incoherence vs. Human Inconsistency**
  *   **Genuine Incoherence:** Logical impossibility (e.g., "I never go to Jerusalem" vs. "I died in Jerusalem"). Resolve via Weight.
  *   **Human Inconsistency:** Rhetorical or behavioral shifts (e.g., "Do not worry" vs. "Sell your cloak and buy a sword"). **Retain both as High.** A first-century agent is permitted rhetorical situationality. The Profile must describe a *person*, not a *system*.

  **Accommodating the "Community Memory" Objection**
  *   The member who objects to atomization is correct that memory is holistic. However, the curriculum requires units.
  *   **Accommodation:** The Global Profile Pass is where this objection is validated. If the Profile refuses to close (i.e., too many contradictions require dropping units to "Uncertain"), the Introduction must state: "These units represent distinct memory streams that the community held together, not necessarily a consistent chronological biography." The procedure does not solve the objection; it documents the fragmentation.

  ---

  ### 6. Verdict on Devices

  **The Dependence Ledger**
  *   **Verdict:** **KEEP.**
  *   **Reasoning:** It is the only way to neutralize the Synoptic Problem disagreement in a mixed group. It forces the group to argue about *causality* rather than *priority*.
  *   **Caveat:** You must explicitly acknowledge the "Under-counting" bias (see Section 4) in your front matter. Teachers should know that "One Stream" might mean "One Written Source + Multiple Oral Traditions."

  **The Criterion of Unused Capital**
  *   **Verdict:** **REVISE.**
  *   **Reasoning:** It is not merely Dissimilarity in costume. Dissimilarity asks: "Is this unlike the church?" Unused Capital asks: "If the church made this, why didn't they use it?"
  *   **Failure Mode:** Argument from Silence. The church may not have used a saying because they didn't know it, not because they didn't invent it.
  *   **Revision:** Do not use it as a primary criterion for "High." Use it only as a **tie-breaker**. If a unit is otherwise ambiguous, Unused Capital can push it from "Uncertain" to "High." It cannot push "Low" to "High."

  ---

  ### 7. Worked Applications

  **A. The Baptism of Jesus (Mark 1; Matt 3; Luke 3; John 1; Gospel of Hebrews)**
  *   **Q1 (Streams):** Multiple independent streams (Mark, John, Gospel of Hebrews). **Pass.**
  *   **Q2 (Context):** Fits John the Baptist's historical movement. **Pass.**
  *   **Q3 (Transmission):** High Embarrassment (Subordination of Jesus to John). Early church struggled to explain this. **Pass.**
  *   **Q4 (Profile):** Coherent with Jesus' apocalyptic origins. **Pass.**
  *   **Verdict:** **High.**
  *   **Note:** The procedure does *not* demote this. It remains the anchor. The embarrassment is too structural to be invented.

  **B. The Temple Saying (Mark 14; John 2)**
  *   **Q1 (Streams):** Mark and John (independent narratives). **Pass.**
  *   **Q2 (Context):** Fits Second Temple Jewish critique. **Pass.**
  *   **Q3 (Transmission):** Mixed. Used heavily in trial narratives (Utility), but the specific "three days" variant creates theological confusion (Embarrassment). **Neutral.**
  *   **Q4 (Profile):** Coherent with prophetic action. **Pass.**
  *   **Verdict:** **Uncertain.**
  *   **Reasoning:** While the *action* against the temple is likely High, the specific *saying* about rebuilding is so tightly woven into resurrection theology that Unused Capital fails (they *did* use it). The divergence between Mark (false witness) and John (Jesus says it) suggests the *exact wording* is unstable.

  **C. The Empty Tomb (Mark 16; Matt 28; Luke 24; John 20)**
  *   **Q1 (Streams):** One narrative stream (Mark) copied by others. Paul (1 Cor 15) implies burial/resurrection but does not explicitly narrate the empty tomb. **Fail Q1 (Single Narrative Stream).**
  *   **Q3 (Transmission):** Women as first witnesses is High Embarrassment (legal incapacity). **Pass.**
  *   **Verdict:** **Uncertain.**
  *   **Reasoning:** Fails Q1 because the narrative dependency is too tight to count as multiple witnesses to the *story*, even if the core fact is old. The embarrassment saves it from "Low," but the lack of independent narrative attestation prevents "High."
  *   **Hand-off Check:** Does grading this "Uncertain" deny the Resurrection? No. It grades the *narrative unit*, not the metaphysical event. No Board hand-off required unless teachers conflate the two.

  ---

  ### 8. Limitations
  *Frank statement of judgment calls and procedural boundaries.*

  **Judgment Calls Dressed as Procedure**
  *   **Independence:** Deciding if two oral variants are "divergent upstream" (Ledger Rule 2) is a judgment call. The procedure forces you to record the vote, but it does not eliminate the subjectivity.
  *   **Embarrassment:** What was embarrassing in 50 CE may not be obvious in 2025 CE. The group must rely on textual cues (apologetic glosses) rather than modern intuition.

  **What the Procedure Cannot Deliver**
  *   **Verbatim Accuracy:** A "High" grade does not mean Jesus spoke these exact words. It means the *tradition unit* reliably originates from his activity.
  *   **Motivation:** The procedure grades the *artifact*, not the *intent*. It can tell you Jesus likely said X, not *why* he said it.
  *   **The "Community Memory" Objection:** The procedure atomizes the tradition because the curriculum requires it. It cannot validate the holistic memory theory except by showing where the atoms fail to fit together (Profile Pass).

  ---

  ### 9. The Marginal Grade
  *The sentence for the front matter.*

  **"A grade of 'High' indicates that the unit most probably originates in the ministry of Jesus; a grade of 'Uncertain' indicates that the unit is ancient but its source cannot be distinguished from the early community; neither grade asserts theological truth nor verbatim precision."**
