answer: |-
  Dear colleague, it is a genuine pleasure to hear from someone who has spent a lifetime watching the physical world behave, especially given your background with fluid dynamics and mixing tanks, because you have already seen chaos in action without necessarily needing the philosophical label for it. The turbulence you watched in those tanks is the big brother of the double pendulum you built for your grandkids, and your intuition about the divergence between your simulation and the brass hardware is exactly where the rubber meets the road in this debate. You have hit upon the central tension that keeps philosophers of physics awake at night, which is the distinction between the map we draw of reality and the territory itself. When you ask what determinism attaches to, the short answer is that strictly speaking, determinism is a property of a mathematical model or a set of laws, not necessarily a proven feature of the physical universe. Your computer simulation is deterministic because the code executes a logical algorithm where state B follows inevitably from state A according to rigid rules you wrote, but that is a closed logical system. The brass pendulum, however, is embedded in the universe, and whether it is deterministic depends on whether the universe itself runs on rules that allow for only one possible future given a specific past.

  Your worry about the infinite decimal places is incredibly sharp and gets to the heart of why many scientists feel uneasy about classical determinism. In the classical Newtonian view that your simulation is based upon, physical states are described by real numbers, and real numbers contain infinite information. If the universe is truly continuous, then yes, there is a fact of the matter about the pendulum's angle to the hundredth decimal place, even if no instrument can measure it. In that classical picture, determinism is ontologically real but epistemologically inaccessible, meaning the future is fixed but forever hidden from us because we cannot measure the present with infinite precision. This is where the charge that determinism is an empty idea gains traction, because if a theory says the future is fixed but also says no observer within the system could ever verify that fixity due to measurement limits, it starts to look more like a metaphysical belief than a scientific claim. Some philosophers argue that if something makes no difference to any possible observation, it shouldn't count as real, while others maintain that the structure of causality exists independently of our ability to track it.

  However, there is a deeper layer to your intuition about infinite digits, which is that nature might not actually be continuous. You mentioned that it feels weird to say nature has a true starting angle with infinitely many digits, and modern physics tends to agree with that gut feeling. When we move from classical mechanics to quantum mechanics, the picture changes significantly. In quantum theory, there are fundamental limits to precision, such as the Heisenberg uncertainty principle, which suggests that position and momentum cannot both be defined with arbitrary precision simultaneously. If the universe is fundamentally discrete or quantized at the Planck scale, then the idea of an initial condition requiring infinite decimal places is a category error. There simply are no hundredth decimal places to measure because the information capacity of that region of space is finite. If this is the case, then the classical notion of determinism breaks down not just because of our limited tools, but because the state of the system itself does not contain enough information to fix the future uniquely. This suggests that the unpredictability you see in your brass pendulum is not just a practical limitation for creatures like us, but might reflect a genuine openness in the fabric of reality.

  So to answer your question about whether determinism is left as an empty idea, it depends on which layer of reality you are talking about. At the level of your simulation and the classical equations, determinism is robust but idealized, serving as a useful approximation that fails when you demand infinite precision. At the level of the brass pendulum and the actual universe, determinism is much shakier. If the universe is quantum, then strict determinism is likely false, and the unpredictability is principled rather than practical. Even if the universe were classical, the requirement for infinite information to predict the future renders determinism operationally meaningless for any finite observer, which leads many to prefer a definition of determinism that is tied to predictability. Ultimately, your confusion is well-founded because the concept sits on a fault line between mathematics, where infinity is manageable, and physics, where infinity is suspect. It is perfectly reasonable to conclude that while the equations are deterministic, the world may not be, and that the gap between the two is where the mystery lies. I hope this helps clarify the landscape a bit, and please do not hesitate to reach out if you want to discuss how this ties back into the thermodynamics of those dye tanks, as I suspect the entropy there has its own philosophical stories to tell.
