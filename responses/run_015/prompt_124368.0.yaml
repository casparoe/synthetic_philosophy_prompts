      *   **The "Mean-Reference" View:** If weights depend on the mean, this view is essentially a form of **Relative Prioritarianism** or **Egalitarian Weighted Utilitarianism**.
      *   **Does it succumb to LDO?** If the view values reducing mean-distance *intrinsically*, yes. If it just uses mean-distance to calculate weights but still maximizes sum of weighted welfare, it depends on the curvature. But crucially, because it is relational, it violates the "Separateness of Persons" constraint that Parfit used to distinguish Prioritarianism from Egalitarianism.

