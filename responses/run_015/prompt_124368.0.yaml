answer: |-
  This is a fantastic debate, and you have correctly identified the fault line in your roommate's argument. Your initial instinct was right: **what she is describing is not prioritarianism; it is a form of egalitarianism.**

  However, you are second-guessing yourself because you are conflating two different scenarios: a **Pigou-Dalton transfer** (which both views support) and **pure leveling down** (which distinguishes them).

  Here is the breakdown of where the reasoning holds and where it breaks, so you can settle this with your roommate.

  ### 1. The Definition of Prioritarianism (Absolute vs. Relative)
  The defining feature of prioritarianism (as formulated by Parfit and Arneson) is that it is **non-relational**.
  *   **Prioritarianism:** The moral weight of a benefit depends on the recipient's **absolute** level of welfare. If I am at welfare level 2, I get high priority weight. It does not matter if the mean of the population is 5 or 500.
  *   **Your Roommate's View:** The moral weight depends on the **distance from the mean**. This is **relational**.

  **Why this matters:** If your moral weights change because *other people's* welfare changes (shifting the mean), you have violated the "Separateness of Persons" constraint that prioritarianism relies on to distinguish itself from egalitarianism. In philosophy, a view that assigns value based on relations between people is, by definition, egalitarian (or at least, not strictly prioritarian).

  ### 2. The Leveling-Down Objection (LDO) vs. Transfers
  This is where your reasoning is getting tangled. You wrote:
  > *"if you have three people at welfare 2, 5, and 9, and you can either leave them alone or tax the 9 down to 7 and boost the 2 up to 4... doesn't the mean-reference version prefer the second option?"*

  Yes, both standard prioritarianism and egalitarianism prefer the second option. **But this is not the Leveling-Down Objection.**

  *   **The Transfer (Your Example):** Moving from (2, 5, 9) to (4, 5, 7). The worst off gain. The best off lose. Total welfare stays the same. *Everyone agrees on this.* Prioritarians support this because the gain to the person at 2 is morally weightier than the loss to the person at 9 (due to diminishing marginal moral value).
  *   **Pure Leveling Down:** Moving from (2, 5, 9) to (2, 5, **2**). The rich person is taxed down, but the poor person **does not gain**. The resources are destroyed or wasted.
      *   **Egalitarianism:** Might say this is *pro tanto* good (because equality increased), even though it's all-things-considered bad. It admits there is *some* value in the equality itself.
      *   **Prioritarianism:** Says this is strictly bad. There is no value in equality itself. Since the person at 9 lost welfare and no one gained, the total moral value decreased.

  **The Trap:** Your roommate is arguing that because her view supports the *Transfer*, it supports *Leveling Down*. That doesn't follow. The LDO specifically targets cases where **no one gains**.

  ### 3. Does "Mean-Reference" Dodge the LDO?
  Your roommate claims this variant "dodges" the LDO. Actually, **it invites it.**

  Because her weighting function is relational (tied to the mean), it treats the *gap* between people as morally significant. If the view values shrinking the distance to the mean, it implies that **equality has intrinsic (or instrumental) value independent of absolute welfare.**

  If you have a relational weighting function, you open the door to a scenario where lowering the mean (making everyone poorer) shrinks the distances enough that the "equality gain" outweighs the "welfare loss."
  *   **Standard Prioritarianism:** Cannot license pure leveling down. Lowering welfare always lowers moral value, regardless of what others have.
  *   **Mean-Reference View:** Can license pure leveling down. If the weights are sensitive enough to the variance, reducing the variance could theoretically increase the "weighted sum" even if absolute welfare drops.

  So, her view doesn't dodge the LDO; it just hides it inside the weighting function.

  ### 4. Where Your Reasoning Broke
  You wrote:
  > *"i feel like im conflating the weighting function with the objection itself"*

  You were actually conflating **Redistribution** with **Leveling Down**.
  *   You were right that her view is egalitarianism in disguise (because it uses relational metrics).
  *   You were wrong to think that preferring the (2,5,9) $\to$ (4,5,7) transfer proves leveling down is required. That transfer is compatible with standard prioritarianism.

  To prove her view succumbs to the LDO, you need to ask her: **"If we take the 9 down to 2, but the person at 2 stays at 2 (we burn the resources), does your weighting function say the situation is better in any respect?"**
  *   If she says **Yes**: She admits her view succumbs to the LDO (and is egalitarian).
  *   If she says **No**: Then her weighting function must be constrained so heavily that it effectively collapses back into standard prioritarianism, rendering the "mean-reference" part useless.

  ### The Verdict for Your Argument
  1.  **Stand your ground:** A view that weights based on distance from the mean is **Relative Prioritarianism**, which is widely classified as a form of **Egalitarianism**, not Parfitian Prioritarianism.
  2.  **The LDO Point:** Prioritarianism dodges the LDO *precisely because* it refuses to look at the mean. By introducing the mean, her view loses the shield against the LDO.
  3.  **The Math:** The example she gave (2,5,9 $\to$ 4,5,7) is a red herring. Standard prioritarianism *also* chooses that option. It doesn't prove her view is unique; it just proves both views support helping the poor.

  **Summary:** She has constructed a coherent framework, but she cannot call it Prioritarianism if she wants to claim it dodges the Leveling-Down Objection. It is Egalitarianism with a calculus attachment. You were right the first time.
