answer: |-
  **Project Title:** Manufacturing Undeservingness: An Epistemic Critique of Welfare Conditionality

  **Project Summary**
  Public debate regarding welfare conditionality usually focuses on money and behavior. Economic defenders argue that strict rules prevent fraud and encourage work, while critics argue that these rules are ideological tools used to cut budgets and punish the poor. Both sides assume that "deservingness" is a pre-existing fact: either someone is genuinely trying to work, or they are not. My project challenges this assumption. I propose that the moral problem with modern welfare systems is not just who gets excluded, but how the system forces applicants to prove their worth through invasive transparency while the state remains opaque. I call this an "asymmetrical visibility regime."

  **Research Question**
  Does the fundamental moral wrong of welfare conditionality lie in its distributive outcomes—who is excluded and how severely they suffer—or in its epistemic structure, namely the one-sided procedural demand that manufactures undeservingness as a measurable, visible category rather than discovering a pre-existing one?

  **Why Existing Answers Do Not Settle This**
  Current literature leaves this question open because it treats deservingness as a static category. The economic-defense literature treats conditionality as a technical filter designed to separate honest applicants from fraudsters. It assumes the state's criteria are neutral and that the goal is simply accuracy. Conversely, critical-theory literature often treats conditionality as a political weapon designed to shrink the welfare state. It assumes the goal is exclusion based on ideology.

  Both approaches miss a middle ground. They assume we already know what "deserving" means and are only arguing about how to apply it. Neither side adequately addresses whether the administrative process itself *creates* the category of the undeserving poor. A policy could be distributively fair—excluding very few people—while still being morally defective because the process requires citizens to surrender their privacy to prove they are worthy of help. By splitting the harm into distributive outcomes versus constitutive processes, this project explores whether the ritual of measurement is harmful regardless of the result.

  **Methodology**
  I will use conceptual analysis rather than empirical or historical methods. An empirical approach would measure how many people lose benefits, but it cannot determine whether the *logic* of the rule is morally wrong independent of the outcome. A historical approach would trace how these policies evolved, but it would not clarify their current moral structure.

  Conceptual analysis allows me to examine the internal logic of administrative rules. I will analyze three specific mechanisms:
  1.  **Work-search verification protocols:** Requirements to log every job application.
  2.  **Fraud-investigation procedures:** Unannounced home visits or data matching.
  3.  **Asset-testing thresholds:** Rules about how much savings a recipient can hold.

  For each mechanism, I will map its operation on a spectrum between "filtering" (finding genuinely undeserving recipients) and "constituting" (creating the category of undeservingness through bureaucratic visibility). For example, if a rule requires a specific form of proof that is impossible to provide without significant hardship, it may be constituting failure rather than filtering for it.

  **Scope and Feasibility**
  Six weeks is a short timeframe for a project of this complexity. A full comparative analysis of multiple welfare systems is not feasible. Therefore, I will limit the scope to a single jurisdiction's administrative code for the purpose of the case study, likely focusing on one specific benefit program. The goal is not to produce a comprehensive policy review, but to test the philosophical framework.

  I anticipate spending the first two weeks refining the definitions of "epistemic harm" and "visibility regimes." Weeks three and four will be dedicated to the conceptual analysis of the three administrative mechanisms. The final two weeks will focus on developing the diagnostic framework and writing the final paper. This schedule is realistic because it prioritizes depth on one case study over breadth across many systems.

  **Success and Failure Conditions**
  A successful result will be a clear distinction between distributive harm (suffering caused by loss of benefits) and epistemic harm (dignity lost through the demand for transparency). I will produce a diagnostic framework that policymakers or analysts could use to evaluate whether a specific rule is primarily filtering or constituting. This tool would allow someone to look at a regulation and identify if it manufactures undeservingness.

  Failure would look like the collapse of the filtering-constituting distinction. If, upon analysis, every act of filtering inevitably constitutes the category in the same way, then the distinction offers no new moral insight. Alternatively, if the concept of "asymmetrical visibility" turns out to be merely a restatement of existing power dynamics without adding explanatory power, the project would not achieve its goal. I will treat these negative results honestly; proving that the distinction collapses is still a valuable philosophical conclusion, as it would suggest that reforming the process without abolishing conditionality is impossible.

  **Deliverable**
  The final deliverable will be a research paper of approximately 3,000 to 4,000 words. This paper will present the argument for the epistemic critique of welfare conditionality. Attached to the paper will be the "Procedural Diagnostic Framework," a one-page schematic that outlines the questions an analyst should ask to determine if a policy rule is constitutive or filtering. This ensures the research has both theoretical depth and a practical component that demonstrates the utility of the philosophical analysis.
