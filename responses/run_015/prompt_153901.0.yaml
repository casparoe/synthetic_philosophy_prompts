answer: |-
  **The Geometric Gambler: Uncut Gems and the Limits of Log-Utility**

  *Uncut Gems* is a film about noise. It is about the cacophony of the Diamond District, the overlapping dialogue, the blaring sirens, and the constant, vibrating anxiety of Howard Ratner. It is also, on its face, a film about betting. Howard is a man who cannot stop wagering, not just on basketball games, but on his own life, staking his marriage, his safety, and his livelihood on high-variance parlays.

  For a decision theorist, the temptation is immediate. Here is a protagonist who seems to be maximising arithmetic expected utility in a world that demands geometric rationality. He chases the big number, the arithmetic mean, ignoring the volatility that threatens to wipe out his bankroll entirely. Viewed through the lens of Kelly betting, Howard is a cautionary tale: a man who refuses to fraction his stakes, who ignores the log-growth optimal strategy, and who consequently goes broke—or rather, gets shot.

  But if we stop there, we have turned a scream into an equation. We have reduced a pathology to a miscalculation. To read *Uncut Gems* seriously through Kelly and geometric rationality, we must do more than diagnose Howard's errors. We must ask whether the mathematical framework applies at all. The film does not merely show a man failing to follow the Kelly criterion; it depicts a world where the preconditions for geometric rationality are systematically dismantled.

  Let us begin with the mechanics of the bet. The Kelly criterion assumes a repeatable favourable opportunity where the agent can choose a continuous fraction of their bankroll to stake. You calculate your edge, divide by your odds, and bet that fraction. Crucially, you must be able to scale. You must be able to rebalance after every round.

  Howard Ratner operates in a world of lumps. His assets are indivisible. He cannot bet 15 per cent of the Opal; he must pawn the whole stone or none of it. He cannot hedge his exposure to Kevin Garnett's performance; he must tie his fate to a specific, lumpy parlay. The film's first major win comes from a six-way parlay on Garnett's stat line. This is not a smooth curve of wealth accumulation; it is a binary cliff. Later, he sends his mistress, Julia, to Mohegan Sun to place a three-way parlay with the entirety of Garnett's cash.

  This indivisibility matters. Kelly betting is a strategy for the long run, relying on the law of large numbers to smooth out variance. Howard is forced into a sequence of one-off, high-variance events. He cannot implement fractional Kelly even if he wanted to, because the market he inhabits—the pawnshop, the bookie, the auction floor—does not offer continuous liquidity. It offers binaries. You keep the ring or you lose it. You pay Arno or you don't.

  Is this an excuse for Howard? No. But it is a mitigation of the charge that he is simply 'irrational'. He is not ignoring the Kelly criterion; he is structurally barred from using it. The film suggests that geometric rationality requires a certain frictionless quality to the world—a ability to scale up and down—that the gritty reality of the Diamond District denies him. When your bankroll is a championship ring and your bookie is a loan shark, you are not managing a portfolio; you are navigating a series of airlocks.

  This brings us to the question of whose bankroll it is. A core feature of Kelly betting is conservatism. You bet less than the arithmetic optimum to protect against ruin, because *you* bear the cost of the ruin. The downside shrinks *your* future stake.

  In *Uncut Gems*, the downside is socialised, while the upside is privatised. Howard is rarely betting with his own money. The Opal belongs to the miners, then effectively to Garnett as collateral. The cash he uses to bet often belongs to Arno, his brother-in-law and loan shark. When Howard places a bet, he is often leveraging assets he does not own against debts he cannot pay.

  This creates a profound asymmetry. If Howard wins, he captures the utility (paying off debts, keeping the profit). If he loses, the cost lands on Garnett (who loses the ring), Arno (who loses the principal), or his own family (who lose their security). This is moral hazard rendered as decision theory. When the downside is externalised, the conservative constraint of the Kelly criterion vanishes. Why maximise geometric growth when the geometric penalty of ruin is paid by someone else?

  Howard is not simply a reckless bettor; he is an agent exploiting a broken principal-agent problem. He is rationally maximising arithmetic expectation because the geometric cost of volatility has been offloaded onto the people surrounding him. The film is quietly about how the surrounding kit—the pawnshop, the bookie, the loan shark—manufactures asymmetries where the downside lands on somebody else. To read this as 'Howard is bad at maths' is to miss the point that the maths changes when the skin in the game is not your own.

  However, even if Howard had his own money and could bet in continuous fractions, there is the matter of the horizon. Kelly betting is asymptotic. It tells you how to maximise wealth over an infinite sequence of bets. It assumes you will be around to collect the compounding interest.

  By the final act, Howard is not playing an infinite game. He is playing a game with a hard deadline and an absorbing state. Arno's thugs are not a market correction; they are a cliff edge. Once you are at or beneath your floor, once you have a hard target with a deadline attached, growth-rate maximisation has nothing left to say.

  If you owe a debt that must be paid by Tuesday, and you have insufficient funds, the log-optimal strategy is irrelevant. You are forced into a Hail Mary. You must maximise the probability of hitting the specific target, even if it means accepting a negative expected growth rate. This is not a failure of rationality; it is a recognition that geometric rationality presupposes survival. It presupposes that 'ruin' is a soft drawdown from which you can recover, not a bullet in the head.

  Howard knows he is ruined long before the final bet. He has cash in hand that could clear the Arno debt, but it would leave him with nothing—no capital, no status, no 'way back in'. He bets it instead. From a geometric perspective, this is suicide. From the perspective of a man facing a social and economic death that is indistinguishable from physical death, it is the only move that preserves the *possibility* of a future. The film argues that when the horizon shrinks to a point, the long-run growth rate ceases to be a normative guide. You cannot compound your way out of a Tuesday deadline.

  And then, the ending. The parlay wins. $1.2 million. Howard has finally executed the perfect arithmetic spike. He has the money to clear every debt, to secure his family, to win. And Phil shoots him in his own shop before he can touch it. Julia walks out of Mohegan Sun with the money.

  This is the film's philosophical gag, and it strikes at the heart of geometric rationality as I have been working with it: the generalisation where the entity doing the choosing is spread over time or over people. Geometric rationality assumes a persistent agent to collect the utility. It assumes that the 'you' who places the bet is the same 'you' who reaps the reward, or at least that the reward flows into a utility function you care about.

  Howard is split across wife, mistress, shop, and bet. He is fragmented. He tells his daughter he wants to win so she can go to private school, but he also wants to win so he can feel the rush, so he can prove he is 'a winner'. When he dies, the bankroll compounds, but the agent who was supposed to be the beneficiary is removed from the equation. Julia gets the money. The debt is paid. The family is secure. In a purely utilitarian calculus, the outcome is positive. The geometric chain of the family unit survives, even if the specific node of Howard does not.

  But the film does not feel like a victory. It feels like a void. Why? Because Howard's utility function was not aligned with his family's. He wanted the agency of the win, not just the proceeds. Geometric rationality across agents requires a merger of preferences, a sense that the 'group' is the true decision-maker. *Uncut Gems* shows us a man who pretends his preferences are merged with his family's ('I'm doing this for you') while actually acting on a compulsive, selfish arithmetic maximisation. The tragedy is not that the money was lost, but that the money was won by a version of the world Howard is not in to enjoy. The growth happened; the gardener died.

  So far, this reading holds together. It suggests the film illuminates the preconditions of geometric rationality: liquidity, skin in the game, indefinite horizons, and a persistent agent. Howard fails on all four counts.

  But here is where the reading must break. Here is where we must ask if I am projecting a decision-theoretic framework onto a man who is not making decisions at all.

  The film calls Howard a gambling addict. Its form gives you almost no scene of reflective choice. There is no moment where Howard sits quietly with a notepad, calculating his edge, considering the fraction of his bankroll. Everyone talks over everyone; doors slam; the camera never lets him breathe. We are inside his anxiety, not his deliberation.

  To treat Howard as a Kelly bettor who is getting the fractions wrong is to sanitise the pathology. It turns compulsion into strategy. It implies that if Howard had just known the maths, or if the market had been more liquid, he might have been fine. But the addiction is not a miscalculation of utility; it is a corruption of the utility function itself.

  A Kelly bettor seeks to maximise wealth to achieve some end. Howard seeks the bet as the end. The rush is the utility. The money is merely the token that allows the game to continue. If we apply decision theory too rigorously, we risk implying that Howard's behaviour is instrumentally rational given his constraints. It is not. It is self-terminating.

  Geometric rationality assumes the agent wants to stay in the game. Addiction is often a desire to lose the game, or at least to see how close one can get to the edge without falling. When Howard bets the cash that could clear the Arno debt, he is not maximising growth. He is testing fate. He is engaging in a behaviour that defies the preservation of the self.

  If we read him as a geometric rationalist manqué, we lose the visceral reality of his suffering. We turn a tragedy of character into a technical error. We lose the sense that Howard is not choosing the risk, but is chosen *by* it. The film's form—the claustrophobia, the noise, the lack of reflective pauses—insists that Howard is not an agent weighing options. He is a particle in a pinball machine. To impose the Kelly criterion on him is to impose a silence on a film that refuses to be silent.

  So, where does this leave us? Is *Uncut Gems* a film that illuminates geometric rationality, or one that just lets you project it?

  My verdict is this: it illuminates the *ecology* required for geometric rationality to function, by showing us what happens when that ecology is poisoned. It does not show us a man failing to be a geometric rationalist; it shows us a world that makes geometric rationality impossible.

  The film demonstrates that log-utility maximisation is not a universal norm. It is a luxury good. It requires liquidity, property rights, personal safety, and a stable self. Howard has none of these. He is trapped in an arithmetic world of lumps, deadlines, and externalised costs, while clinging to a geometric hope that the long run will save him.

  The decision-theoretic frame does work on the film, but only up to the point where it meets the addiction. It explains why Howard is trapped, but it cannot explain why he stays trapped. It explains the constraints, but not the compulsion.

  For your blog, the takeaway is not that Howard should have bet half-Kelly. It is that the Safdie brothers have constructed a nightmare scenario for the decision theorist. They have built a world where the assumptions of rational choice—continuity, persistence, ownership—are stripped away, leaving only the raw, screaming impulse to bet.

  Geometric rationality tells us how to grow when the future is open. *Uncut Gems* shows us what happens when the future is closing. In that light, Howard's failure is not that he ignored the log-utility rule. It is that he believed the rule still applied to him. He believed he was a player in a long-run game, when in fact he was already a corpse waiting to fall.

  The film does not validate your maths. It validates your anxiety about where your maths stops working. It is a reminder that decision theory lives in the quiet spaces between the noise, and Howard Ratner lives in the noise. If you take anything from this viewing, let it be the humility to recognise that when the doors are slamming and the thugs are at the door, the Kelly criterion is the first thing to go out of the window. Not because it is wrong, but because it is no longer for you.
