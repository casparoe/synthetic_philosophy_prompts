answer: |-
  Here is a committed reading of *Chinatown* tailored to your colloquium's framework.

  ### Thesis: The Hydrology of Alibi
  *Chinatown* is not a film about environmental determinism; it is a film about the *weaponization* of environmental determinism. Your distinction between **scene-setter** (constraint) and **selector** (agent) is the precise mechanism by which Noah Cross launder's his theft. The film's central argument is that power operates by convincing the public that a scene-setter is a selector. Cross does not create the drought (scene-setter), but he manipulates the distribution of scarcity to make it appear as though the drought has selected the victims (selector).

  However, the film refuses to let the environment disappear entirely. While human agency drives the plot, non-human materiality provides the evidence that unravels the lie. The water, the salt, and the glasses are silent witnesses that resist the narrative laundering. The tragedy is not that nature defeated man, but that man successfully framed nature for his crimes, and the law accepted the testimony of the environment over the testimony of the victim.

  ---

  ### 1. Pressure-Testing the Scene-Setter / Selector Distinction

  Does the film hold the distinction, or collapse it? **It holds it, but demonstrates how easily one is masqueraded as the other.**

  Your intuition that the drought is a "cover" is correct, but it requires a specific hydrological nuance. If the drought were entirely fake, Cross's scheme would be unnecessary. The drought is a real **scene-setter**: it fixes the cost of water (high) and the live options (sell or starve). It creates the *potential* for crisis. Cross's agency acts as the **selector**: he determines *which* groves die and *which* valley gets the water.

  The "laundering of agency" occurs when Cross conflates these two roles. By releasing water into the ocean at night and sabotaging the reservoir, he accelerates the scene-setter's constraints to mimic a natural selection. He wants the public to believe the drought *selected* the San Fernando Valley for destruction. The film reveals that the drought did not select the valley; Cross selected the valley *using* the drought.

  **Does something irreducibly non-human survive?**
  Yes. If the film were purely about human conspiracy, it would be a political thriller. It remains a noir about material reality because the environment refuses to be fully instrumentalized.
  *   **The Salt:** This is the crucial non-human agent. Cross can buy the police, the lawyers, and the water department. He cannot buy the chemistry of the Pacific Ocean. The salt in the freshwater reservoir is a material truth that contradicts the human narrative. It is a "selector" of truth in a sea of lies.
  *   **The Glasses:** One lens found in the reservoir, one in the pond. Glass does not move itself. It marks the trajectory of a body. It is a static, non-human record of violence that persists regardless of who holds the deed.
  *   **The Land's Need:** The film acknowledges that the valley *must* be watered to function agriculturally. Cross can change the owner, but he cannot change the agronomy. The land's physical requirement for water is a scene-setter that even Cross must obey, limiting his greed to the logic of infrastructure.

  **Verdict:** The distinction holds, but the film teaches that in a corrupt system, the **selector** (Cross) will always attempt to dress himself in the clothes of the **scene-setter** (Nature) to avoid accountability.

  ---

  ### 2. The Fatalism of Jurisdiction vs. Environment

  You asked for a committed argument on the closing line: *"Forget it, Jake, it's Chinatown."*

  **Thesis:** The fatalism of *Chinatown* is jurisdictional, not environmental. To read the film's ending as environmental determinism is to commit the exact error the film critiques.

  If the film were about environmental determinism, Gittes would fail because the drought was unstoppable, or because human agency is insignificant against the climate. But Gittes fails because the **law** stops at the border of power. "Chinatown" is not a place of strange weather; it is a place of opaque rules. In the flashback, Gittes explains that in Chinatown, he tried to help a woman and got her killed because he didn't understand "how things work" there. It is a epistemological limit, not a geographical or ecological one.

  When Walsh says "It's Chinatown" at the end, he is not saying "Nature is cruel." He is saying "The jurisdiction of justice ends where the jurisdiction of capital begins." Cross escapes not because the drought demanded it, but because the police (the state) will not arrest him. The water flows to the rich not because of gravity, but because of property law.

  **Why this matters for your class:**
  If your students read the drought as the antagonist, they have been successfully "laundered" by the film's villain. They are treating a scene-setter as a selector. The film is a **critique of environmental determinism as ideology**. It shows how "The Drought" is used as a sentence-ending noun that absolves subjects of verbs. "The drought caused the famine" removes the requisitioning agent. *Chinatown* forces the viewer to reinstate the verb: "Cross *caused* the famine using the drought."

  The fatalism is that while you can prove the material truth (the salt), you cannot force the social structure to acknowledge it. The environment is knowable; power is not.

  ---

  ### 3. Pedagogical Arc: Three Scenes

  Here is how I would structure the session, using your shortlist. These three scenes map the movement from the *appearance* of natural agency to the *revelation* of human agency, and finally to the *impunity* of that agency.

  #### Scene 1: The Night at the Reservoir (The Staging of Scarcity)
  *   **The Action:** Gittes watches water being dumped into the ocean while the city starves. He is attacked by thugs protecting the flow.
  *   **The Lesson:** This is the moment the **scene-setter** is weaponized. The drought is real, but the waste is artificial.
  *   **Discussion Question:** If the drought is the selector, why is water being destroyed? If the drought is merely a scene-setter, who is doing the selecting?
  *   **Key Insight:** This scene proves the scarcity is managed. It breaks the illusion of natural necessity. The water isn't gone; it is being moved. This is the visual proof of "laundered agency."

  #### Scene 2: The Saltwater Pond (The Non-Human Witness)
  *   **The Action:** Gittes tastes the water at the dry reservoir bed. It's salt water. He finds the glasses.
  *   **The Lesson:** Materiality resists narrative. Cross can control the narrative of the drought, but he cannot control the salinity of the ocean.
  *   **Discussion Question:** The water cannot speak, but it can testify. How does the salt function as an agent in the plot?
  *   **Key Insight:** This is where your "non-human agency" reading is strongest. The salt is an actor. It triggers Gittes's realization. It is the one "selector" Cross cannot manipulate. It selects the truth.

  #### Scene 3: The Retirement Home (The Laundering of Ownership)
  *   **The Action:** Gittes confronts the residents whose names are on the deeds. They don't know they own the valley. They are senile or dead.
  *   **The Lesson:** The separation of agency from responsibility. The land is owned by "people," but the will behind the ownership is invisible.
  *   **Discussion Question:** Cross argues he is building for the future ("The future, Mr. Gittes!"). How does he use the future to justify the theft of the present?
  *   **Key Insight:** This scene reveals the bureaucratic mechanism of the laundering. By putting the deeds in the names of the incapable, Cross removes the "who" from the crime. It mirrors how "The Drought" removes the "who" from the famine.

  ---

  ### 4. Limits of the Reading (What the Film Silences)

  To be intellectually honest with your students, you must flag where pressing the film into this thesis flattens it.

  **1. The "Great Man" Theory of Corruption:**
  Your reading (and the film) focuses on Noah Cross as the singular selector. This risks obscuring the structural nature of the water crisis. The film suggests that if Cross is removed, the water problem is solved. In reality, the Department of Water and Power (the bureaucracy) remains. The film individualizes a systemic issue. It critiques *criminal* agency but leaves *capitalist* agency largely intact. Cross is a monster, but the system that produced him is treated as normalcy ("It's Chinatown").

  **2. The Erasure of Indigenous and Ecological Cost:**
  The film treats water purely as capital or a plot device. There is no consideration of the Owens Valley indigenous populations or the ecological collapse of the lake itself (which happened in reality). The "non-human agency" is limited to water as a substance of evidence (salt), not water as an ecosystem. The film knows water as *property*, not as *habitat*. If your colloquium is about non-human agency in a deep ecological sense, *Chinatown* is anthropocentric even in its critique. The land only matters insofar as it generates profit or hides a body.

  **3. The Contested Ending:**
  *   **The Contention:** Is Evelyn's death fate or murder?
  *   **The Risk:** A reading that emphasizes jurisdictional fatalism might accidentally slide into saying "she was doomed anyway."
  *   **The Correction:** You must insist that Evelyn is killed by a bullet fired by Cross, facilitated by police inaction. It is not fate. It is procedure. If you allow the ending to feel like "tragic fate," you validate Cross's worldview. The film *wants* it to feel like fate to show how power naturalizes itself. Your job in the classroom is to denaturalize it.

  ### Summary for the Syllabus
  *Chinatown* is a case study in how **environmental constraints are converted into political alibis**. Use the scene-setter/selector distinction to show how Cross hides his selection behind the scene. Use the "Chinatown" line to show how jurisdictional limits are disguised as natural limits. But warn your students: the film solves the mystery but accepts the crime. It reveals the laundering but admits the money is already spent. That is the true danger of non-human agency in history: not that we attribute too much power to nature, but that we allow nature to absorb the blame for human design.
