          *   *Implication:* In the individual case, "Present Rationality" often suffices because the beneficiary and the bound party are biologically identical. In the political case, "Present Rationality" of the founders is insufficient because the bound party (future citizens) are distinct moral agents.

      *   **Part 2: Intertemporal Consent vs. Present Rationality:**
          *   *Present Rationality:* Binding is good if it maximizes long-term welfare. Works well for individuals (saving for retirement).
