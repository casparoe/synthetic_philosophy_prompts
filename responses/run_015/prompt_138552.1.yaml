answer: |-
  Your hypothesis is not a category mistake; it is arguably the most precise diagnosis of the deadlock available. Your TA may have been reacting to the fact that distinguishing epistemology from metaphysics is the *standard* move in this literature, but you are right to press that the *inference* from one to the other is the unargued pivot point.

  The reason this hasn't moved since the early eighties is not because philosophers are stubborn, but because the Knowledge Argument (KA) sits at the intersection of three distinct, unresolved problems. When people argue about Mary, they are usually talking past each other about which of these three problems is the real one.

  Here is the shape of the stalemate, an evaluation of your test cases, and an honest assessment of whether progress is possible.

  ### 1. The Shape of the Stalemate: Three Tangled Knots

  You identified two of the three knots. The stalemate persists because resolving one knot just tightens the others.

  **Knot A: The Epistemic/Ontological Slide (Your Hypothesis)**
  The anti-physicalist argues: *Epistemic Gap → Ontological Gap.* (Mary doesn't know X physically; therefore X is not physical).
  The physicalist argues: *Epistemic Gap ≠ Ontological Gap.* (Mary doesn't know X physically because her concepts are different, not because the world is different).
  **The Stalemate:** The anti-physicalist demands an explanation of *why* the gap exists if the world is physical. The physicalist says the gap is brute or psychological. The anti-physicalist says a brute epistemic gap *just is* dualism by another name. This is where Chalmers' "Zombie Argument" comes in to bolster the modal intuition, but it suffers the same rebuttal (conceivability does not entail possibility).

  **Knot B: Hempel's Dilemma (The Definition of "Physical")**
  You noted this, and it is load-bearing.
  *   **Horn 1:** "Physical" means what *current* physics says. (Problem: Current physics is likely false/incomplete, so physicalism is likely false).
  *   **Horn 2:** "Physical" means what *ideal* physics says. (Problem: If ideal physics must account for consciousness to be complete, then physicalism is vacuously true by definition, but "physical" might include proto-mental properties).
  **The Stalemate:** Anti-physicalists assume "physical" means "non-experiential/mechanistic." Physicalists often slide toward Horn 2 when pressed, effectively redefining physicalism to accommodate the data Mary reveals.

  **Knot C: The Cost of Intuition (Jackson's Recantation)**
  You mentioned Jackson rejected his own argument. He didn't do it because the logic failed; he did it because the *metaphysical cost* was too high. If Mary learns a new fact, physicalism is false. If physicalism is false, and causation is closed, then qualia are epiphenomenal (they do nothing). Jackson decided he couldn't believe his own thoughts were caused by non-physical facts.
  **The Stalemate:** Anti-physicalists accept the intuition (Mary learns something) and pay the metaphysical cost (dualism/panpsychism). Physicalists accept the metaphysics (causal closure/parsimony) and pay the intuitive cost (deny Mary learns a *fact*). It is a clash of theoretical virtues, not a logical proof.

  ### 2. Evaluating Your Test Cases

  Your cases are attempts to stress-test the "Fact vs. Mode of Presentation" distinction. Here is how they play out in the dialectic.

  **(1) Incremental Mary (The Sorites of Qualia)**
  *   **The Setup:** Mary sees 1,000 shades of red. Does she learn 1,000 facts?
  *   **Does it work?** It pressures the Physicalist's "New Concept" strategy. If every shade requires a new phenomenal concept, Mary's mind must have infinite capacity for distinct concepts.
  *   **The Counter:** Physicalists argue phenomenal concepts are *analog* or *recognitional*. She doesn't learn 1,000 facts; she refines one discriminative ability. It's like learning to distinguish wines; you aren't learning new metaphysics, you are calibrating a sensor.
  *   **Verdict:** **Low diagnostic value.** Both sides can absorb this. The anti-physicalist says "1,000 distinct qualitative properties exist." The physicalist says "1,000 distinct discriminative states exist within a physical system." It doesn't force a crack in the armor.

  **(2) One-Sentence Mary (The Expressibility Test)**
  *   **The Setup:** Can you write the fact she learns on a post-it note before she leaves?
  *   **Does it work?** This targets the "Propositional Knowledge" vs. "Ability" distinction. If the fact can't be stated, is it a fact?
  *   **The Counter:** Physicalists use the "Indexical" or "Demonstrative" reply. "This is what it's like" is a sentence, but it requires the context (the experience) to have content. Just as you can't convey "I am here" to someone without telling them where *here* is, you can't convey phenomenal facts without the phenomenal context.
  *   **Verdict:** **Moderate diagnostic value.** It highlights that phenomenal knowledge is *essentially indexed to the subject*. However, anti-physicalists argue that indexical facts are still trivial compared to the substantive ontological claim Mary makes. It clarifies the *type* of knowledge but doesn't settle the metaphysics.

  **(3) Reverse Mary (The Symmetry Argument)**
  *   **The Setup:** A qualia-expert learns physics. She says, "Wow, so *that's* the physical structure of my red experience!"
  *   **Does it work?** **This is your strongest case.** It attacks the asymmetry the KA relies on. If learning the physical story feels like "new information" to the qualia-expert, then *all* inter-theoretic reduction feels like learning new facts. (e.g., A heat-expert learning about molecular kinetic energy).
  *   **The Counter:** Anti-physicalists argue the asymmetry is real. In standard reduction (heat = molecular motion), the macro-property is *explained* by the micro-property. In Mary's case, the physical story *predicts* behavior but leaves out the *nature* of the experience. Reverse Mary is learning a correlation; Forward Mary is learning a nature.
  *   **Verdict:** **High diagnostic value.** This forces the anti-physicalist to explain why the reduction of consciousness is uniquely problematic compared to the reduction of heat or water. If they can't, the KA generalizes to show *nothing* is reduced (which is absurd). If they can, they must articulate exactly why consciousness resists the reduction that heat accepted.

  ### 3. Can This Be Ended? (The Honest Answer)

  No, not in the way a math problem is ended. It will not be "solved" by a new argument that makes the other side concede. The disagreement is **bedrock**.

  However, "progress" in philosophy often means mapping the costs so clearly that one position becomes untenable for reasons *outside* the original argument. Here is where the actual movement is happening:

  **1. Illusionism (The Flatmate's View)**
  Your flatmate is echoing Keith Frankish or Daniel Dennett. This view bites the bullet: Mary *doesn't* learn a fact about the world; she is under an illusion that she has a special inner movie. The "what it's like" is a user-illusion generated by cognitive monitoring.
  *   **Progress:** This dissolves the KA by denying the premise (that there are phenomenal properties to know).
  *   **Cost:** It is deeply counter-intuitive. It requires denying the very data (conscious experience) we started with.

  **2. Russellian Monism (The Third Way)**
  This view accepts the KA (physicalism is false) but rejects Dualism (no spooky substances). It argues physics describes the *structure/relations* of matter, but not its *intrinsic nature*. Consciousness *is* the intrinsic nature of the physical.
  *   **Progress:** It respects Mary's intuition (there is something physical facts leave out) without violating causal closure (consciousness is fundamental to matter).
  *   **Cost:** It leans toward panpsychism (electrons have some proto-experience), which many find equally absurd.

  **3. Phenomenal Concept Strategy (The Physicalist Holdout)**
  This is the view you studied (new concepts, old facts). It remains the most popular physicalist defense.
  *   **Progress:** It has become more sophisticated, integrating with cognitive science about how concepts work.
  *   **Cost:** It risks being an "error theory" of our own intuitions. It says, "It *feels* like dualism is true, but that feeling is a trick of the cognitive architecture."

  ### Summary

  Your hypothesis is correct: the debate is stalled because one side is defending a **metaphysical intuition** (consciousness is unique) and the other is defending a **methodological commitment** (science must be causally closed/complete).

  *   **Incremental Mary** won't break it (both sides accommodate granularity).
  *   **One-Sentence Mary** won't break it (both sides agree on inexpressibility, disagree on why).
  *   **Reverse Mary** is your best bet. If you can show that the "feeling of newness" in Reverse Mary is identical to Forward Mary, you undermine the claim that Mary reveals an ontological gap.

  **What counts as progress?**
  Progress isn't a knockout punch. It is the gradual erosion of the "cheap" versions of each view.
  *   If Physicalists can explain *why* the epistemic gap exists without just saying "brute fact," they win.
  *   If Anti-Physicalists can explain how non-physical facts interact with physical neurons without epiphenomenalism, they win.

  Until then, the seminar stalemate is the field's stalemate. You aren't missing a trick; you are staring at the hard limit of what conceptual analysis can do without a theory of consciousness that commands empirical consensus. Your flatmate might be the most pragmatic one: if introspection is unreliable, the data Mary provides is corrupted. But until we know *how* it's corrupted, we can't discard it.
