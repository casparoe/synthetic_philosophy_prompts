  **Catharsis™ User Support | Ticket Resolution Protocol**
  **Subject:** Troubleshooting Affective Dissonance in Non-Referential Contexts

  **1.0 General Error: Object Not Found (Error 404-Ontological)**
  **Symptom:** User reports acute distress, weeping, or elevated cortisol levels triggered by narrative events involving entities confirmed to lack spatiotemporal location.
  **Diagnosis:** Reality-Checking Module failure. The user is attempting to process simulated data as existential threat data.
  **Resolution:** Engage "Pretend-Mode" protocol. Recalibrate emotional output to 'Quasi-Status.' Users are reminded that feelings generated during playback are functional simulations, not valid claims on external reality. Do not attempt to locate the deceased character. The character was never located to begin with. Please disable empathy subroutines when metadata tags indicate "Fiction."

  **2.0 Somatic Leakage During Playback**
  **Symptom:** Physical tearing, throat constriction, or chest pressure occurring despite cognitive acknowledgment that the stimulus is manufactured.
  **Diagnosis:** Peripheral hardware overriding central logic processing. The body is reacting to propositional content rather than factual states.
  **Resolution:** Isolate the thought-content from the world-state. Users should repeat the mantra: "I am frightened by the thought of the monster, not the monster itself." If physical symptoms persist, reduce immersion settings. Note: Catharsis™ is not liable for hydration loss due to unnecessary lacrimation. Your organs are responding to a glitch, not a tragedy.

  **3.0 Branching Narrative Grief (Interactive Media)**
  **Symptom:** Compounded distress resulting from multiple divergent outcomes in interactive storytelling environments. User mourns the same character across several mutually exclusive timelines.
  **Diagnosis:** Ontological Overcommitment. The user is assigning singular identity status to distinct temporal instances.
  **Resolution:** File separate emotional claims for each timeline experienced. Grief incurred in Timeline A (where the character survives) does not offset grief in Timeline B (where the character perishes). Users must acknowledge that emotional investment tracks specific world-states, not abstract character concepts. 
  **Warning:** Attempting to consolidate grief across branches may cause paradoxical saturation. Do not mourn the "same" person twice; they are numerically distinct entities across possible worlds. If you saved the game prior to the death event, the deceased instance is technically revertible. Mourning a revertible instance is a violation of Terms of Service regarding resource allocation.

  **4.0 Submission of Claims**
  If distress persists after reclassifying the emotion as non-veridical, please submit a ticket under category "Hardware Malfunction." Do not select "Narrative Tragedy," as this implies the events were real. Our engineers are currently patching the module that allows users to care about things they know are not there. Until then, please continue to enjoy your content without forming binding attachments to the data.

  **Catharsis™:** Feel Nothing Real.
