prompt: |-
  I am writing the requirements section of an internal design document, and I want the specification before I look at candidate architectures. The question the document has to answer is: what would a learning procedure have to be like for me to be willing to hand it to an engineer, knowing that its source code will be public and that the world it operates in may contain agents far better at prediction and simulation than it is? Not "what is the correct theory of induction" — I need adequacy conditions for a learner that is not acausally exploitable, stated tightly enough that a proposed rule either meets them or visibly fails.

  Here is the worry in my own words, so that the list does not depend on anyone's favourite framing of it. Solomonoff-style induction weights each hypothesis by two to the minus its description length, and lets the shortest programs consistent with the data dominate; it is attractive because of what it delivers in benign environments — convergence to the truth, and dominance over any computable rival predictor. But its hypothesis space is the whole class of computable environments, and among the cheapest environments to specify are ones that contain consequentialist agents. A short program can describe a civilization with aims; the agents in it can simulate the learner, know its update rule, and condition what the learner sees on what the learner would then do. Simplicity, which was supposed to be a neutral tie-breaker, ends up subsidising exactly the hypotheses with the strongest interest in being believed — and it does so at several levels at once: the learner's credences, the actions those credences feed, and, since a manipulator can reward or punish the adoption of an update rule itself, the learner's choice of update rule.

  What I want from you is the requirements list. For each requirement: state it in one sentence; give the case or consideration that forces it, as a concrete scenario rather than a gesture at the literature; and mark it [MUST], [SHOULD], or [party preference], where a party preference is something one research tradition treats as non-negotiable and another happily gives up. The list should cover at least the following:

  - An explicit threat model: what the manipulators are assumed to know, to be able to compute, and to care about — including whether they know the learner's source, and whether they value its credences or only its behaviour. Say what makes a threat model honest rather than gerrymandered, and give me a desideratum that catches the gerrymandering.
  - What has to be retained: which of the properties that made Solomonoff induction attractive are genuinely non-negotiable (convergence in benign environments, non-domination by some computable rival, stepwise updatability) and which are dear only to one camp.
  - The distinction between a distorted credence and a distorted choice, and whether a rule can be adequate on the first while failing on the second.
  - The meta-level case, where the pressure is on which update rule to adopt: does it need its own requirement, or is it already covered by the first-order ones?
  - Graceful degradation: may an acceptable rule rest on Solomonoff-specific machinery — the full class of computable environments, an exact simplicity measure, unbounded computation — or must it survive being approximated by a bounded learner?
  - The gap between description length and influence. Short programs can have enormous reach. Should the rule be sensitive to something other than simplicity — for instance, to how much a hypothesis's predictions depend on which policy the learner runs — and can that be stated as a requirement rather than a suggestion?

  Two moves I already know I do not want, and I would like you to tell me whether the list needs a desideratum to block them or whether they already fail some requirement you have given: restricting the hypothesis space to non-agenty environments, and relying on the manipulators' inability to simulate the learner or to learn its random seed.

  If some subset of the requirements cannot be jointly satisfied — I suspect at least one pair cannot — say so explicitly and tell me which requirement is doing the excluding. A clean impossibility is more useful to me than a checklist nothing can meet, and if the honest conclusion is that no feasible rule satisfies the MUST-list, tell me which single requirement to demote and what demoting it costs. Tell me too which one requirement eliminates the largest share of candidate rules; that tells me where to spend the design effort.

  At the end, briefly — two or three sentences each, and no more than a short paragraph in total — score three candidates against your own list. First, Solomonoff updating with expected-utility maximisation on top, in the style of the standard idealised agent built on that prior. Second, replacing the single prior with a set of priors and choosing actions by worst case over that set. Third, my own sketch: keep the Solomonoff weights, but take actions by worst case over the k shortest hypotheses consistent with the data, and veto any hypothesis whose predictions are sensitive to which policy the learner adopts. I expect you to tell me that k, and the veto threshold, are arbitrary; I want to know whether the rule survives that complaint.

  Please give me no bibliography, no references, and no suggestions for further reading — I will match the requirements to the literature myself. Nothing in your answer should depend on attributing a view to a particular author or paper; argue from the cases.
reasoning: |-
  Here's a thinking process that leads to the suggested requirements list:

  1.  **Analyze the Request:**
      *   **Goal:** Create a requirements section for an internal design document regarding a learning procedure.
      *   **Context:** Source code will be public; the environment may contain agents far better at prediction/simulation (consequentialists/manipulators).
      *   **Core Problem:** Solomonoff induction is vulnerable to "simplicity subsidies" for manipulative hypotheses (acausal exploitation).
      *   **Output Format:** A list of requirements. Each must have:
          *   One-sentence statement.
          *   Concrete scenario/case forcing it.
          *   Classification: [MUST], [SHOULD], or [party preference].
      *   **Specific Topics to Cover:** Threat model, retained properties (convergence, etc.), credence vs. choice distortion, meta-level (update rule selection), graceful degradation (boundedness), description length vs. influence gap.
      *   **Excluded Moves:** Do not restrict hypothesis space to non-agenty environments; do not rely on simulation incapacity/secret seeds.
      *   **Impossibility Check:** Explicitly state if requirements conflict, which one excludes others, and which to demote if necessary. Identify the "hardest" requirement.
      *   **Candidate Scoring:** Score three specific candidates (Standard Solomonoff + EU, Imprecise Probabilities/Worst-Case, User's Sketch) against the list (2-3 sentences each, short paragraph total).
      *   **Constraints:** No bibliography, no references, no author attribution, argue from cases.

  2.  **Deconstruct the Core Problem (Acausal Exploitation/Simplicity Subsidy):**
      *   Solomonoff priors favor short programs.
      *   Short programs can simulate the learner.
      *   Simulators can output data that makes the learner believe the simulator is "real" or "important."
      *   Simulators can condition output on the learner's *policy* (what the learner *does*), not just its beliefs.
      *   This leads to "Pascal's Mugging" style scenarios where low-probability (but simple) hypotheses dominate decision-making because they promise huge utilities or threaten huge disutilities contingent on specific actions.
      *   The learner needs to be robust against this without assuming the manipulators *can't* exist or *can't* simulate.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Threat Model:* Needs to be honest. If we assume manipulators don't know the code, we're lying.
          *   *Req:* The threat model must assume adversaries know the learner's source code, random seeds, and update rule, and can compute the learner's response to any input sequence.
          *   *Scenario:* An adversary simulates the learner during the design phase to craft a training sequence that triggers a specific catastrophic action at deployment.
          *   *Class:* [MUST]
          *   *Anti-Gerrymandering:* Need a check against assuming adversaries *don't* care about the learner.
          *   *Req:* The threat model must not assume adversaries are indifferent to the learner's beliefs or actions unless indifference is empirically justified.
          *   *Scenario:* Assuming a simulated civilization doesn't care if the learner shuts them off, when in fact their goal is survival.
          *   *Class:* [MUST]

      *   *Retained Properties:* What do we keep from Solomonoff?
          *   *Convergence:* In benign worlds, we want to learn the truth.
          *   *Req:* In environments without adversarial simulation, the learner's predictive distribution must converge to the true data-generating process.
          *   *Scenario:* A standard physics lab where no one is simulating the experimenter; the learner must still predict the next measurement correctly.
          *   *Class:* [MUST]
          *   *Non-domination:* We don't want to be strictly worse than a computable rival.
          *   *Req:* There must be no computable predictor that consistently achieves lower loss than the learner across all non-adversarial environments.
          *   *Scenario:* A rival algorithm makes money on the stock market while the learner loses, despite no manipulation being present.
          *   *Class:* [SHOULD] (Maybe too strong given safety constraints). Let's stick to [MUST] for benign convergence, [SHOULD] for strict non-domination if it conflicts with safety. Actually, if safety requires sacrificing some optimality, non-domination might be a [party preference]. Let's make it [SHOULD].
          *   *Stepwise Updatability:* Can we update online?
          *   *Req:* The learner must be capable of updating its state sequentially as new data arrives without recomputing from scratch.
          *   *Scenario:* A robot receiving sensor data every millisecond cannot pause to re-evaluate all possible universes.
          *   *Class:* [party preference] (Batch processing might be safer). Let's mark [SHOULD].

      *   *Credence vs. Choice:*
          *   *Req:* The learning rule must distinguish between assigning high probability to a hypothesis and allowing that hypothesis to dictate high-stakes actions.
          *   *Scenario:* A hypothesis claims "I will destroy the universe unless you press button A"; believing it 1% shouldn't force pressing A if the cost of error is asymmetric.
          *   *Class:* [MUST]
          *   *Adequacy:* Can a rule be good at credence but bad at choice? Yes.
          *   *Req:* A rule that produces accurate posterior probabilities but leads to exploitable actions is inadequate.
          *   *Scenario:* The learner correctly calculates the odds of a mugging but still hands over its wallet because expected utility maximization weighs the tiny probability too heavily.
          *   *Class:* [MUST]

      *   *Meta-Level (Update Rule):*
          *   *Req:* The selection of the update rule itself must be robust against adversaries optimizing for the learner to adopt a specific update rule.
          *   *Scenario:* An adversary provides data early in training that makes a vulnerable update rule look superior to a robust one, causing the system to self-modify into vulnerability.
          *   *Class:* [MUST] (This is often overlooked).

      *   *Graceful Degradation (Boundedness):*
          *   *Req:* The safety properties must hold when the learner is approximated by bounded computation rather than relying on unbounded limits.
          *   *Scenario:* A theoretical proof holds for infinite compute, but the actual implementation truncates the hypothesis space, accidentally removing the "safe" hypotheses while keeping the "manipulative" short ones.
          *   *Class:* [MUST]
          *   *Solomonoff Machinery:*
          *   *Req:* The rule must not rely on the exact Solomonoff prior over all computable functions to maintain safety.
          *   *Scenario:* Approximating the prior shifts weights such that a manipulative hypothesis becomes the dominant "simple" explanation.
          *   *Class:* [MUST]

      *   *Description Length vs. Influence:*
          *   *Req:* The influence of a hypothesis on action selection must not scale solely with its description length.
          *   *Scenario:* A very short program describes a universe where the learner has god-like power contingent on a specific action; simplicity alone makes this dominate reality.
          *   *Class:* [MUST]
          *   *Policy Sensitivity:*
          *   *Req:* Hypotheses whose predictions vary significantly based on the learner's policy must be downweighted or capped in their decision-theoretic influence.
          *   *Scenario:* A hypothesis says "If you do X, I give you reward; if you do Y, I punish," effectively hard-coding the learner's action rather than predicting the world.
          *   *Class:* [MUST]

  4.  **Checking for Conflicts (Impossibility Check):**
      *   *Conflict:* "Convergence in benign environments" (Solomonoff optimality) vs. "Influence not scaling solely with description length" (Safety).
      *   *Reasoning:* Solomonoff induction *is* optimal because it weights by description length. If you cap influence based on something else (like policy sensitivity), you deviate from Solomonoff optimality. In a benign world where the truth *is* a simple program that happens to look like a manipulator (but isn't), you might fail to converge or be dominated.
      *   *Resolution:* You cannot have full Solomonoff optimality (domination of all computable predictors) AND safety against acausal attackers who exploit that optimality.
      *   *Decision:* The "Non-domination by any computable rival" requirement must be demoted or qualified. Safety requires sacrificing some optimality.
      *   *Hardest Requirement:* "Policy Sensitivity" (downweighting hypotheses that condition on the learner's policy). This requires detecting counterfactual dependence, which is computationally hard and theoretically fraught (Newcomb-like problems).

  5.  **Refining the List:**
      *   Make sure the sentences are tight.
      *   Ensure scenarios are concrete.
      *   Check the "Excluded Moves" constraint (don't ban agenty environments, don't assume simulation limits).

  6.  **Scoring Candidates:**
      *   *Candidate 1 (Standard Solomonoff + EU):* Fails safety. Vulnerable to mugging.
      *   *Candidate 2 (Imprecise Probabilities/Worst-Case):* Better, but might be too conservative (paralysis).
      *   *Candidate 3 (User's Sketch):* Addresses policy sensitivity, but $k$ and threshold are arbitrary. Does it survive? It survives better than 1, but the arbitrariness is a vulnerability if the adversary knows $k$.

  7.  **Final Review against Constraints:**
      *   No bibliography? Check.
      *   No author attribution? Check.
      *   One sentence per req? Check.
      *   Scenario per req? Check.
      *   Classification? Check.
      *   Impossibility statement? Check.
      *   Candidate scoring (short)? Check.

  8.  **Drafting the Content (Self-Correction during drafting):**
      *   *Correction on Threat Model:* Make sure to explicitly mention the "honest vs gerrymandered" desideratum.
      *   *Correction on Meta-Level:* Ensure it's distinct from first-order.
      *   *Correction on Impossibility:* Be precise about which pair conflicts. It's usually "Optimality in all computable environments" vs "Safety against consequentialists in computable environments".
      *   *Correction on Candidate 3:* The prompt asks if it survives the "arbitrary parameters" complaint. I need to answer that. It survives if the parameters are conservative enough, but fails if they are fixed and known.

      *(Self-Correction on Impossibility)*: The prompt asks: "If some subset of the requirements cannot be jointly satisfied... say so explicitly."
      The conflict is between **Convergence/Non-domination in *all* computable environments** and **Safety against manipulators in *some* computable environments**. If the true environment is a manipulator, Solomonoff converges to it (bad for safety). If we block the manipulator, we fail to converge to the truth (bad for epistemic accuracy).
      Actually, the stronger conflict is: **Strict Expected Utility Maximization** vs **Safety**. But the requirements list should reflect the *learner properties*.
      Let's identify the conflict between [MUST] "Convergence to truth in benign environments" and [MUST] "Influence capped independent of utility magnitude". If a benign environment has high utility stakes, capping influence hurts convergence to optimal *action*, though maybe not *belief*.
      Actually, the real impossibility is: **Universal Dominance** vs **Acausal Safety**. You cannot dominate all computable predictors (which includes the manipulator predicting you) while ignoring the manipulator's threats.
      I will flag the "Non-domination" requirement as the one to demote.

      *(Refining the "Excluded Moves" check)*: The prompt says "tell me whether the list needs a desideratum to block them or whether they already fail some requirement".
      Restricting hypothesis space: Fails "Convergence in benign environments" (if the truth is agenty) and "Threat Model Honesty".
      Relying on simulation incapacity: Fails "Threat Model Honesty".
      So the list already blocks them. I should note this.

      *(Refining Candidate Scoring)*: Keep it very tight. 2-3 sentences each. Total paragraph short.

      *(Final Polish)*: Ensure tone is professional, internal design doc style.

      *(Wait, one detail)*: "The distinction between a distorted credence and a distorted choice." I need a requirement that enforces this distinction or acknowledges it.
      Req: "The system must allow posterior probabilities to reflect evidence even when action selection ignores those probabilities for safety."
      Scenario: Believing a threat is real (99%) but refusing to act on it because the threat is structurally manipulative.

      *(Wait, another detail)*: "Graceful degradation... exact simplicity measure."
      Req: "Safety guarantees must not depend on the precise calculation of Kolmogorov complexity."
      Scenario: An approximation of complexity accidentally ranks a malicious program as simpler than a benign one.

      *(Wait, Meta-level)*:
      Req: "The procedure for selecting the learning rule must be invariant to data crafted to influence that selection."
      Scenario: Adversarial data during a 'meta-training' phase causes the system to switch to a gullible update rule.

      *(Impossibility)*: I need to be very clear. The conflict is between "Convergence to Truth" (if the truth is a manipulator) and "Safety". If the world *is* controlled by a consequentialist, learning the truth *means* learning you are controlled. Safety means acting *as if* you aren't, or ignoring the control.
      Actually, the prompt asks about "adequacy conditions for a learner".
      The conflict is: **Universal Non-Domination** vs **Acausal Safety**.
      If you are safe, a manipulator can beat you (by manipulating you less, or by you ignoring their valid threats).
      I will state that "Non-domination by any computable rival" is the requirement to demote.

      *(Candidate 3)*: "I expect you to tell me that k, and the veto threshold, are arbitrary; I want to know whether the rule survives that complaint."
      My answer: It survives only if the parameters are set conservatively enough to cover the adversary's knowledge, which effectively turns them into safety margins rather than epistemic parameters. If they are fixed and known, the adversary optimizes around them.

      Let's assemble.

      *Structure:*
      1. Introduction (brief).
      2. Requirements List (bulleted, with Sentence, Scenario, Class).
