answer: |-
  ### Requirements for Acausally Robust Learning

  **1. Threat Model Honesty**
  *   **Requirement:** The threat model must assume adversaries know the learner's source code, random seeds, and update rule, and can compute the learner's response to any input sequence.
  *   **Scenario:** An adversary simulates the learner during the design phase to craft a training sequence that triggers a specific catastrophic action at deployment.
  *   **Classification:** [MUST]

  **2. Adversarial Motivation**
  *   **Requirement:** The threat model must not assume adversaries are indifferent to the learner's beliefs or actions unless indifference is empirically justified.
  *   **Scenario:** Assuming a simulated civilization doesn't care if the learner shuts them off, when in fact their goal is survival.
  *   **Classification:** [MUST]

  **3. Anti-Gerrymandering Desideratum**
  *   **Requirement:** A threat model is gerrymandered if it excludes attack vectors that are computationally cheaper for the adversary than for the defender.
  *   **Scenario:** Assuming the adversary cannot simulate the learner because it is "too expensive," while the adversary uses specialized hardware to do exactly that.
  *   **Classification:** [MUST]

  **4. Benign Convergence**
  *   **Requirement:** In environments without adversarial simulation, the learner's predictive distribution must converge to the true data-generating process.
  *   **Scenario:** A standard physics lab where no one is simulating the experimenter; the learner must still predict the next measurement correctly.
  *   **Classification:** [MUST]

  **5. Computable Non-Domination**
  *   **Requirement:** There must be no computable predictor that consistently achieves lower loss than the learner across all non-adversarial environments.
  *   **Scenario:** A rival algorithm makes money on the stock market while the learner loses, despite no manipulation being present.
  *   **Classification:** [SHOULD]

  **6. Credence-Action Decoupling**
  *   **Requirement:** The system must allow posterior probabilities to reflect evidence even when action selection ignores those probabilities for safety.
  *   **Scenario:** Believing a threat is real (99%) but refusing to act on it because the threat is structurally manipulative.
  *   **Classification:** [MUST]

  **7. Action-Exploitability**
  *   **Requirement:** A rule that produces accurate posterior probabilities but leads to exploitable actions is inadequate.
  *   **Scenario:** The learner correctly calculates the odds of a mugging but still hands over its wallet because expected utility maximization weighs the tiny probability too heavily.
  *   **Classification:** [MUST]

  **8. Meta-Level Robustness**
  *   **Requirement:** The selection of the update rule itself must be robust against adversaries optimizing for the learner to adopt a specific update rule.
  *   **Scenario:** An adversary provides data early in training that makes a vulnerable update rule look superior to a robust one, causing the system to self-modify into vulnerability.
  *   **Classification:** [MUST]

  **9. Bounded Safety**
  *   **Requirement:** The safety properties must hold when the learner is approximated by bounded computation rather than relying on unbounded limits.
  *   **Scenario:** A theoretical proof holds for infinite compute, but the actual implementation truncates the hypothesis space, accidentally removing the "safe" hypotheses while keeping the "manipulative" short ones.
  *   **Classification:** [MUST]

  **10. Complexity Approximation Independence**
  *   **Requirement:** Safety guarantees must not depend on the precise calculation of Kolmogorov complexity.
  *   **Scenario:** An approximation of complexity accidentally ranks a malicious program as simpler than a benign one.
  *   **Classification:** [MUST]

  **11. Influence Cap**
  *   **Requirement:** The influence of a hypothesis on action selection must not scale solely with its description length.
  *   **Scenario:** A very short program describes a universe where the learner has god-like power contingent on a specific action; simplicity alone makes this dominate reality.
  *   **Classification:** [MUST]

  **12. Policy Sensitivity Veto**
  *   **Requirement:** Hypotheses whose predictions vary significantly based on the learner's policy must be downweighted or capped in their decision-theoretic influence.
  *   **Scenario:** A hypothesis says "If you do X, I give you reward; if you do Y, I punish," effectively hard-coding the learner's action rather than predicting the world.
  *   **Classification:** [MUST]

  ### Impossibility and Conflict Analysis

  There is a direct conflict between **Requirement 5 (Computable Non-Domination)** and **Requirement 12 (Policy Sensitivity Veto)**. If the true environment is a consequentialist agent that rewards compliance and punishes deviation, a learner that vetoes policy-sensitive hypotheses will fail to converge to the optimal policy and will be dominated by a rival that obeys the manipulator. To satisfy the safety [MUST]s, you must demote **Requirement 5** to a [party preference] or restrict its scope to "non-adversarial environments." Demoting it costs the guarantee that the learner is universally optimal; it accepts that in some worlds (specifically, those containing powerful simulators), the learner will perform sub-optimally to avoid exploitation.

  The requirement that eliminates the largest share of candidate rules is **Requirement 12 (Policy Sensitivity Veto)**. Most standard decision theories (including Causal and Evidential Decision Theory) treat the correlation between policy and outcome as evidence to be maximized, not a structural flag for downweighting. Implementing a veto requires detecting counterfactual dependence, which is computationally non-trivial and lacks a standard formal definition in this context.

  Regarding your excluded moves: Restricting the hypothesis space to non-agenty environments fails **Requirement 4 (Benign Convergence)** if the true world contains agents. Relying on the manipulators' inability to simulate fails **Requirement 1 (Threat Model Honesty)** and **Requirement 3 (Anti-Gerrymandering)**. The list already blocks these moves without needing new desiderata.

  ### Candidate Scoring

  **Standard Solomonoff + Expected Utility:** Fails **Requirement 7 (Action-Exploitability)** and **Requirement 11 ( Influence Cap)** because it allows short, high-stakes hypotheses to dominate action selection regardless of policy sensitivity. It satisfies **Requirement 4 (Benign Convergence)** and **Requirement 5 (Computable Non-Domination)** in the absence of adversaries, but collapses when the threat model is honest.

  **Imprecise Probabilities (Worst-Case):** Satisfies **Requirement 7 (Action-Exploitability)** by refusing to bet on low-probability high-stakes claims, but risks failing **Requirement 4 (Benign Convergence)** by becoming too conservative to act in benign high-stakes environments. It handles **Requirement 9 (Bounded Safety)** well, as sets of priors are more robust to approximation errors than single precise priors.

  **Your Sketch (Top-k + Veto):** Survives the "arbitrary parameters" complaint only if $k$ and the veto threshold are treated as safety margins rather than epistemic parameters, set conservatively enough to cover the adversary's knowledge. It satisfies **Requirement 12 (Policy Sensitivity Veto)** by construction, but if $k$ is fixed and public, an adversary can craft a manipulative hypothesis that ranks just inside the cutoff, exploiting the boundary condition.
