answer: |-
  This is a devastating critique of Hardin's metaphor, precisely because the Titanic is the historical instance where the "lifeboat" scenario was literalized, and the outcome contradicts Hardin's axioms at almost every turn.

  Here is the careful mapping you requested, breaking down where the theory holds, where it fractures, and where the historical reality exposes the political work the metaphor is doing.

  ### 1. The Numbers and the Setup
  Your recollection is accurate.
  *   **Total aboard:** ~2,224.
  *   **Lifeboat Capacity:** 1,178 (20 boats, though the *Carpathia* later picked up a few from collapsibles/debris, bringing survivors to ~705–710).
  *   **Survival:** ~32% overall.
  *   **Gradient:** First Class survival ~62%; Third Class ~25%. Men ~20%; Women ~74%.

  Hardin's setup posits a **natural limit** (buoyancy). The Titanic reveals a **legislative limit**. The Board of Trade regulations dictated lifeboat capacity based on ship *tonnage*, not passenger count. The "60 seats" in Hardin's metaphor were not physics; they were policy. This is the first crack: Hardin treats scarcity as an ecological given; the Titanic shows scarcity as a regulatory choice.

  ### 2. Who is the Lifeboat? (The Identity Problem)
  In Hardin's essay, the lifeboat represents the **Rich Nation**. The swimmers are the **Poor Nations/Refugees**. The 50 inside are the **Citizens**.

  **The Mapping Failure:**
  On the Titanic, the "swimmers" were not outsiders trying to board a sovereign vessel; they were fellow ticket-holders on the same ship.
  *   **Hardin's Assumption:** The people inside have a prior claim to the boat that the swimmers do not. The boat is *theirs*.
  *   **Titanic Reality:** The "swimmers" (those left on deck) had paid the same fare for safety as those in the boats. The lifeboats were appurtenances of the ship, not private yachts of the passengers.
  *   **The Implication:** Hardin's metaphor relies on a property right that doesn't exist in the emergency scenario. If the "Rich Nation" (Lifeboat) is part of the same structural system as the "Poor Nation" (The Ship), then the exclusion is not self-defense; it is a breach of contract. Hardin posits a settled manifest of insiders vs. outsiders. The Titanic shows a single manifest where the "insider" status was assigned *during* the crisis based on class and proximity, not prior right.

  ### 3. The Officers' Options vs. Hardin's Options
  Hardin offers three options:
  1.  **Take all:** Swamp the boat (everyone dies).
  2.  **Take some:** Use the safety factor (risk swamping, hard choices).
  3.  **Take none:** Preserve the boat (guard against boarders).

  **The Actual Options on Deck:**
  The officers (Murdock, Lightoller, etc.) were not choosing between ethics; they were choosing between **engineering fears** and **protocol**.
  *   **Davits and Buckling:** There was a genuine fear that loading a boat to its rated capacity (e.g., 65 people) would buckle the hull or snap the davits during lowering. This aligns with Hardin's "safety factor."
  *   **The Cold Water:** A fully loaded boat sitting low in the water risked swamping from waves or panic.
  *   **The "Half-Empty-Boat Problem":** As you noted, no lifeboat sank from overloading. In fact, a full boat is more stable in calm water (which it was that night) than a light one. The "safety factor" Hardin advocates for was **wasted**.
      *   *Boat 8:* Capacity 65, loaded 37.
      *   *Boat 5:* Capacity 65, loaded 41.
      *   *Boat 1:* Capacity 40, loaded 12.
  *   **Theory Silence:** Hardin assumes the safety factor is consumed by *altruism*. The Titanic shows the safety factor is consumed by *incompetence* and *fear*. Hardin's argument ("We must keep seats empty to ensure survival") predicts the exact behavior that caused the deaths. He frames under-filling as prudence; history frames it as failure.

  ### 4. Allocation: The Silent Variable
  Hardin's essay is obsessed with the boundary of the boat (In vs. Out). It is silent on the hierarchy *within* the boat.
  *   **Hardin:** The 50 inside are a homogenous "we."
  *   **Titanic:** The 50 inside were stratified. The "Women and Children First" protocol was not a neutral algorithm; it was a classed and gendered filter.
      *   **Class:** First-class women had 97% survival; Third-class women had ~50%. The "lifeboat" was not equally accessible to all passengers even before it left the davits.
      *   **Sex:** Men were systematically excluded, regardless of ticket class or ability to row.
  *   **The Ethical Gap:** Hardin uses the lifeboat to argue against *foreign aid*. He does not address *internal redistribution*. On the Titanic, the ethical failure wasn't just leaving people on the ship; it was loading the boats with people who could have rowed (men) while leaving them to freeze, or loading them with First Class while Third Class was gated below. Hardin's metaphor hides the internal politics of the "saved" to focus on the external threat of the "drowning."

  ### 5. The Crucial Question: Distribution or Self-Defense?
  You ask: *Does taking it literally expose that the move doing all the work is positing a settled manifest plus outsiders, so that a distributive question gets to look like self-defence?*

  **Yes.** This is the fatal flaw the Titanic exposes.

  *   **Hardin's Move:** He defines the situation as **Zero-Sum Survival**. If you take the swimmers, *everyone* dies. Therefore, exclusion is not cruelty; it is physics.
  *   **Titanic's Reality:** The situation was **Positive-Sum Rescue**. There were empty seats. The boats did not swamp. The "physics" Hardin relies on were imaginary.
  *   **The Consequence:** Because the boats *could* have held more, the decision to row away was not self-defense; it was **hoarding**.
      *   Hardin argues that admitting the poor destroys the "ecosystem" of the rich nation.
      *   The Titanic shows that the "ecosystem" (the lifeboat) remained perfectly intact with more people. The "destruction" Hardin fears did not happen.
      *   Therefore, the "guarding against boarding parties" (Hardin's Option 3) becomes indefensible. On the Titanic, the lifeboats *did* row away to avoid being swamped by swimmers (some did fear this), but since the swamping risk was negligible, this was not self-defense. It was the preservation of comfort and status.

  ### 6. Where the Theory Breaks
  Hardin's "Lifeboat Ethics" relies on three premises that the Titanic disproves:
  1.  **Capacity is Natural:** Titanic proves capacity is Regulatory/Political. (The Board of Trade could have mandated more boats).
  2.  **Loading is Dangerous:** Titanic proves under-loading was the danger. The "safety factor" was a lethal miscalculation.
  3.  **The Group is Homogenous:** Titanic proves the "saved" are stratified. The ethics of who gets the seat (class/sex) mattered more than the ethics of who is left behind.

  ### Conclusion: The Metaphor Inverted
  If we use the Titanic as the test case for Hardin's theory, the theory fails.

  Hardin wants us to believe the Rich Nation is a lifeboat in a sea of poor people, and that taking them aboard will sink us. The Titanic shows us that the Rich Nation (the lifeboats) rowed away with empty seats while the poor (steerage) drowned, not because the boat would sink, but because the officers didn't trust the gear, the regulations didn't require enough seats, and the social hierarchy prioritized certain lives over others.

  The "Half-Empty-Boat Problem" is the nail in the coffin. Hardin argues we must keep seats empty to survive. The Titanic shows that keeping seats empty *caused* the death.

  To answer your final question: The case does not leave Lifeboat Ethics standing. It exposes the metaphor as a **legitimation device**. By positing a natural limit that doesn't exist (the swamping risk), Hardin converts a **distributive question** (how do we share the 1,178 seats among 2,200 people?) into a **security question** (how do we stop the 2,200 from sinking the 1,178?).

  The Titanic proves the seats could have been shared. The fact that they weren't wasn't physics; it was policy. Hardin's ethics are not about survival; they are about justifying the empty seats.
