answer: |-
  **Mark: 15/20**

  **Feedback:**

  **(a) 5/5**
  You earn full marks here. You accurately distinguish the 'filter' mechanism of the selection reading from the 'efficient cause' mechanism of the explanatory reading. You also correctly identify the explanatory reading as more vulnerable to the epiphenomenality objection. Your reasoning—that the selection reading allows for the independent origin of ideas—is precise and demonstrates a secure grasp of the conceptual framework.

  **(b) 3/7**
  You earn marks for correctly reconstructing the critic's functionalist logic and for providing concrete examples of potentially dysfunctional legal forms (enclosure, liability). However, the assessment itself is significantly flawed. You accept the critic's conclusion without testing its premises (e.g., you do not consider time-lags in selection, or the distinction between 'constraint' and 'optimisation'). More critically, your recommendation that a Marxist should "retreat to the weaker explanatory reading" inverts the theoretical relationship between the two readings. In the literature (specifically Cohen), the selection reading is introduced as the *defensive* fallback to save historical materialism from the empirical fragility of the explanatory reading. The explanatory reading is the stronger, more vulnerable claim, not a safe haven from functionalist refutation. This conceptual confusion undermines your assessment.

  **(c) 7/8**
  This is a strong answer that demonstrates detailed knowledge of the module material. You earn high marks for correctly identifying that admitting 'reaction back' threatens the asymmetry required for historical materialism (the "distinction collapses" point) and for pinpointing the circularity objection regarding legal property relations. You lose a mark only because your explanation of *why* this fails to answer the epiphenomenality objection is slightly compressed; the defence technically grants the superstructure causal power (answering the charge of inertness), but at the cost of materialist *priority*. However, your proposed solution—relocating the base to 'relations in production' to avoid circularity—is an excellent application of the course concepts and shows you understand the theoretical costs involved.
