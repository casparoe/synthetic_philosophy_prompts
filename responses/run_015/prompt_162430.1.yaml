  Dear colleague, here is the case you asked for, stripped of the usual temporal trappings that invite the Doomsday comparison. Imagine a committee meeting at the Interstellar Science Foundation, deciding whether to fund the Exocluster Probe, a mission to scan nearby galaxy clusters for biological signatures. The empirical physics is settled enough that two cosmological models are live options with roughly even priors based on non-anthropic data alone. The first model, Single-Cluster, posits that our local supercluster is the only region in the universe conducive to human life, containing exactly one billion observers. The second model, Multi-Cluster, posits that there are one thousand such superclusters scattered across the cosmos, containing one trillion observers in total. Crucially, both models agree that only our specific supercluster possesses the unique local physical conditions required to produce a specific high-energy particle decay we have just detected, let us call it the Sigma signature. Therefore, on both hypotheses, exactly one billion observers exist who share your current evidence, which is simply being a human observer detecting the Sigma signature. The difference lies entirely in the unobserved population: on Single-Cluster, there are no other humans; on Multi-Cluster, there are 999 billion contemporaneous humans in other clusters who do not see the Sigma signature because their local physics differs. The committee must vote now to fund the probe, which would settle the question within a century, or cancel it to save resources.

  If you apply the Self-Sampling Assumption, you reason as if you are a random sample from the reference class of all contemporary humans. On Single-Cluster, the fraction of humans who see the Sigma signature is one billion out of one billion, or unity. On Multi-Cluster, the fraction is one billion out of one trillion, or one thousandth. Since your evidence is fixed, SSA dictates that you update your beliefs by the ratio of these fractions, shifting the odds by three orders of magnitude in favor of Single-Cluster. The anthropic step alone moves the probability from fifty percent to ninety-nine point nine percent, licensing the committee to cancel the probe with high confidence on the armchair grounds that you are unlikely to be among the rare Sigma-observers if the Multi-Cluster model were true. By contrast, the Self-Indication Assumption treats your existence as evidence weighting hypotheses by the absolute number of observers with your evidence. Since both models posit exactly one billion observers who see the Sigma signature, SIA assigns them equal likelihood. Under SIA, the anthropic step cancels out entirely, leaving the odds at the empirical prior of one to one, suggesting the probe is worth funding given the massive payoff of finding neighbors. The structural feature driving this divergence is the presence of observers without your evidence; SSA is sensitive to the ratio of observers-with-evidence to total-observers, while SIA is sensitive only to the count of observers-with-evidence. If you were to remove the unobserved population, making the total counts equal, the theories would converge. If you narrowed the reference class to only those who see the Sigma signature, SSA would also lose its bite, as the fraction would be unity in both cases, revealing that SSA's extravagance here depends entirely on including unobservable contemporaries in the sampling pool.

  The strongest objection an advocate of SSA would make is that the reference class is being gerrymandered to force the result. They would argue that observers in causally disconnected clusters, or those with different local physics preventing the Sigma signature, are not relevant alternatives for sampling because you could not have been them given your evidence. They would claim that modesty is restored if the reference class is restricted to observers who could possibly have your evidence, which collapses the fraction back to unity for both hypotheses. This objection lands on the theory itself rather than the case, because it concedes that SSA only appears modest when the reference class is narrowly defined by the very evidence being evaluated. If SSA requires such restrictive class definitions to avoid presumptuous conclusions, then its reputation for modesty is indeed an artifact of case selection, just as you suspect. However, I must be honest about whether this supports your thesis against the standard labeling. A defender of the standard view can absorb this by distinguishing between spatial and temporal indexicality. They will argue that the Doomsday Argument is presumptuous because it rules out future people based on birth rank, whereas here SSA rules out contemporary people based on environmental luck. They might grant that SSA is presumptuous in this spatial case but maintain that SIA is still more presumptuous overall because SIA rules out small universes in all cases, whereas SSA only rules out large universes when evidence is rare. Your case successfully shows SSA can be presumptuous, but it may not fully invert the standard label unless you can show that SSA's spatial presumptuousness is more epistemically damaging than SIA's temporal generosity. Nevertheless, this scenario provides the clean numerical divergence you need to argue that SSA is not the safe, modest default it is often portrayed to be.
