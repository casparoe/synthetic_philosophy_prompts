      *   *Consciousness* $\rightarrow$ *Software/OS* (The running process).
      *   *Nerves/White Matter* $\rightarrow$ *Bus/System Bus* (Data transfer).
      *   *Amnesia* $\rightarrow$ *Corrupted Sector/Disconnected Bus*.

  4.  **Identifying the Breakdown Points (The "Audit"):**
      *   *Separation of Memory and Processing:* vN has distinct units. The brain has memory *in* the processing (synaptic weights change *at* the connection). This is the biggest architectural difference (Harvard vs. vN vs. Connectionist).
      *   *Digital vs. Analog:* vN is binary (0/1). Neurons are spike trains (rate coding, timing coding), graded potentials, chemical modulation. It's noisy and analog.
      *   *Sequential vs. Parallel:* vN fetches/decodes/executes sequentially (mostly). The brain is massively parallel.
