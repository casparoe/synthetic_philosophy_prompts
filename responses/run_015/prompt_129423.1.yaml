answer: |-
  Gorbachev's 1985 anti-alcohol campaign is often remembered as an economic blunder—a loss of tax revenue, a sugar shortage, a hit to GDP. But viewed through the lens of Plato's *Laws*, it reveals itself as a failed experiment in moral engineering. Plato does not treat wine as a mere commodity; he treats it as a technology of the soul. In the *Laws*, the symposium is not a revel but a controlled environment where the "Nocturnal Council" (the elder guardians) observes citizens under the influence to see who retains reason and who succumbs to beastliness.

  When we map the Soviet campaign onto this framework, the dissonance is stark. The Soviet state agreed with Plato's diagnosis but catastrophically misunderstood his prescription.

  **The Match: The Poisoned Soul**
  Plato and the Politburo agreed on the fundamental threat: unregulated intoxication is political suicide. In the *Laws*, the Athenian Stranger argues that drunkenness makes a man like a child again, stripping away shame and reason, rendering him unfit for civic duty. Gorbachev's planners saw the exact same rot. By the early 80s, Soviet male life expectancy was stagnating, labor discipline was collapsing, and workplace accidents were rampant. The state viewed the drunk not as a sick individual but as a defective cog.

  When the USSR tore up vineyards in Crimea and Georgia and slashed vodka production, they were acting on the Platonic fear that the "intoxicated soul" cannot serve the *polis* (or the State). They recognized that a citizenry incapable of self-control is a security risk. In this diagnostic phase, the Soviet planners were perfect Platonists: they identified that the unregulated consumption of wine was poisoning the collective body.

  **The Miss: Erasing the Exam**
  Here is where the mapping breaks. Plato explicitly argues against prohibition for citizens over thirty. He believes that banning wine does not manufacture virtue; it merely removes the opportunity to practice it. For Plato, virtue is a muscle that must be tested against resistance. If you remove the wine, you remove the resistance. You haven't created a sober man; you've created a man who has never been tempted.

  Gorbachev's campaign did not build a state-run "symposium." It erased the exam entirely. By closing liquor stores, raising prices, and restricting sales to two hours a day, the state removed the testing ground. They assumed that if the bottle disappeared, the virtue would remain. Plato would argue this is a category error. You cannot legislate temperance; you can only legislate opportunity. By shrinking supply without cultivating the internal capacity for restraint, the Soviet state treated the symptom (drunkenness) while ignoring the disease (lack of self-rule). They wanted the result of the test (sobriety) without administering the test (exposure to temptation).

  **The Moonshine Explosion: Vice Underground**
  The immediate societal reaction validates Plato's warning about suppressing the test. When the state removed the legal avenue for intoxication, the "exam" didn't stop; it went black market. The explosion of *samogon* (moonshine) is the critical data point.

  Plato claims that if you drive the test underground, you drive character failure underground with it. In the official state stores, there was at least a veneer of regulation (age limits, quality control). In the kitchen stills of the USSR, there was no oversight, no elder watching, and no civic function. People boiled sugar, bathed in perfume, and drank brake fluid.

  This confirms Plato's hypothesis: suppressing the test does not cure the failure; it hides it. The moonshine boom proved that the desire for intoxication was not a policy error but a human constant. By making the consumption illegal, the state ensured that the act of drinking was no longer a moment of potential civic observation but an act of conspiracy. In Plato's symposium, the drinker is watched by the wise to see if he can hold his tongue. In the Soviet kitchen, the drinker is watched by the KGB to see if he breaks the law. One produces character; the other produces criminals.

  **The Scaling Problem: The Nocturnal Council vs. The Bureaucracy**
  This leads to the final twist: the problem of scale. Plato's framework relies on the *polis*. The Nocturnal Council can only function if the rulers can actually see the citizens drink. It is a face-to-face pedagogy. The USSR was a continent-spanning empire of 280 million people. You cannot have a symposium with a population the size of India.

  So, how did the Soviets try to solve the scaling problem? They replaced the moral gaze of the philosopher with the administrative gaze of the bureaucrat. Instead of elders watching for self-control, you had workplace committees monitoring absenteeism, police dragging drunks to "sobering-up stations," and ration cards limiting purchase volume.

  This reveals a weird mutation of Plato's idea. The modern state tries to replace the wine-test with surveillance. But surveillance measures compliance, not virtue. A Soviet worker might stay sober because the factory foreman is watching, not because he has mastered his passions. As soon as the foreman looks away (or the Gorbachev restrictions lift), the vice returns with a vengeance.

  Plato's framework survives the case diagnostically but fails procedurally. He was right that removing the bottle doesn't fix the soul, and he was right that driving the habit underground makes it more dangerous. But the Soviet episode proves that his solution—the regulated symposium—cannot scale to a modern nation-state. You cannot turn a bureaucracy into a Nocturnal Council. When you try to run a moral stress-test on 280 million people, you don't get a citizenry of tempered steel; you get a population of liars who brew vodka in their bathtubs to pass the test they never agreed to take.

  In the end, Gorbachev's campaign proves Plato's darkest suspicion: a state that tries to ban the test of virtue will only succeed in teaching its citizens how to hide their vice better. The Soviet Union didn't become more virtuous; it just became more secretive.
