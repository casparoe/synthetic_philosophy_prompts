prompt: |-
  Take Gorbachev's 1985 anti-alcohol push in the USSR — not the economic numbers, but the social design behind it. Read it through Plato's Laws, especially the part where he treats the symposium not as a party but as a kind of civic stress-test: wine strips away pretense so rulers can see who actually has self-control and who just fakes it. Plato doesn't want to ban drinking outright for citizens past thirty; he wants it regulated, like a exam with rules, because removing the test doesn't manufacture virtue, it just buries the failure.

  So map the Soviet campaign onto that framework. The state tried to shrink supply, close distilleries, even tear up vineyards. Where does that match Plato's fear of unregulated intoxication poisoning the soul? Where does it miss his point that you need the testing ground at all? Did the planners accidentally build a state-run "symposium" — regulated access, supervision, age limits — or were they trying to erase the exam entirely? And what does the explosion of home-brew moonshine tell us about Plato's claim that suppressing the test drives character failure underground instead of curing it?

  One more twist: Plato's idea only makes sense in a tiny polis where the Nocturnal Council can actually watch people drink and learn from it. The USSR was massive and bureaucratic. Does the episode prove that his diagnostic view of alcohol can't scale, or does it reveal something weirder — that modern states try to replace Plato's wine-test with surveillance and ration cards? Work with the well-known facts of the campaign and don't worry about bibliographies; I just want the mapping, the breaks, and whether Plato's framework survives the case.
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Gorbachev's 1985 Anti-Alcohol Campaign in the USSR.
      *   **Lens:** Plato's *Laws* (specifically the concept of the symposium as a civic stress-test for virtue/self-control, not just a party).
      *   **Key Plato Concept:** Wine strips away pretense. Rulers need to see who has self-control. Banning it doesn't create virtue; it hides vice. Regulation is better than prohibition for citizens over 30.
      *   **Task:** Map the Soviet campaign onto this framework.
      *   **Specific Questions to Address:**
          *   Where does the Soviet ban match Plato's fear of intoxication poisoning the soul?
          *   Where does it miss Plato's point about needing a "testing ground"?
          *   Did they build a state "symposium" or erase the exam?
          *   What does the moonshine explosion say about Plato's claim (suppressing the test drives failure underground)?
          *   The Scaling Problem: Plato's *polis* vs. USSR's bureaucracy. Does this prove Plato doesn't scale, or that modern states replace the wine-test with surveillance/rationing?
      *   **Constraints:** Use well-known facts, no bibliographies, focus on mapping/breaks/survival of the framework.

  2.  **Initial Brainstorming & Fact Retrieval:**
      *   *Gorbachev's Campaign (1985-1987):* Drastic cuts in vodka production, closing liquor stores, raising prices, cutting hours, destroying vineyards (Crimea, Georgia), "sobering up stations," sugar shortages (due to moonshine), samogon (moonshine) explosion, economic loss (tax revenue), unpopularity.
      *   *Plato's *Laws* (Book I & II):* The Athenian Stranger argues against total prohibition. Drinking parties (symposia) are educational tools. They reveal character. The "Nocturnal Council" (older, wiser guardians) oversees this. It's about *paideia* (education/training) of the soul.
      *   *The Connection:* Both see alcohol as dangerous to the state. Plato wants to *use* it to train virtue. Gorbachev wanted to *remove* it to enforce sobriety.
      *   *The Twist:* The moonshine boom proves Plato right (vice goes underground). The scale issue (USSR vs. Polis) challenges Plato's mechanism of observation.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Gorbachev's campaign wasn't just economics; it was moral engineering. Introduce Plato's *Laws* not as a ban but as a test. Thesis: The Soviet campaign validates Plato's diagnosis of alcohol's danger but fails his prescription for virtue, ultimately proving that removing the "test" creates a shadow society where virtue is impossible to measure.

      *   **Matching the Fear (The Poison):** Plato agrees alcohol can enslave the soul. The USSR saw alcoholism as a systemic rot (labor discipline, life expectancy).
          *   *Fact:* Cutting production, tearing up vineyards.
          *   *Plato:* Intoxication makes men like children, irrational.
          *   *Match:* Both agree the *unregulated* state is deadly to the polity.

      *   **Missing the Point (The Testing Ground):** This is the core conflict. Plato says don't ban; regulate to test character. Gorbachev banned.
          *   *Plato:* You need the temptation to prove self-control.
          *   *Gorbachev:* Removed the temptation.
          *   *Result:* You don't get sober citizens; you get desperate citizens. The "exam" was cancelled, not passed.

      *   **The Moonshine Explosion (Underground Vice):**
          *   *Fact:* Sugar shortages, samogon stills, toxic substitutes (cologne, brake fluid).
          *   *Plato:* If you suppress the test, vice goes underground.
          *   *Analysis:* In the *polis*, the drink is public. In the USSR, the drink became private/illegal. Plato's claim holds: virtue wasn't cultivated; it was just hidden. The "failure" was buried, not cured.

      *   **The Scaling Problem (Polis vs. Leviathan):**
          *   *Plato:* Requires the Nocturnal Council to *watch*. Face-to-face.
          *   *USSR:* Millions of people, bureaucratic distance.
          *   *Substitution:* How did the USSR try to watch? Ration cards, workplace monitoring, sobriety stations.
          *   *Analysis:* They tried to replace the *moral* gaze of the elder with the *administrative* gaze of the bureaucrat. This fails because a bureaucrat checks a permit; a philosopher checks the soul. The scale makes the "symposium" impossible.

      *   **Conclusion:** Does Plato's framework survive? Yes, diagnostically. No, procedurally. The Soviet case proves Plato right about human nature (removing temptation doesn't create virtue) but wrong about political scalability (you can't run a symposium for 280 million people). The modern state replaces the wine-test with surveillance, which measures compliance, not character.

