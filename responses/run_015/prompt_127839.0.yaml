answer: |-
  You are wrestling with the central tension in Winner's essay: the difference between *politics in the artifact* (constitutive) and *politics of the artifact* (consequential). Your intuition that "not everything is political" is correct, but your hesitation on the shipping container suggests you are defining "political" too narrowly as "intentional exclusion," whereas Winner's second category (technologies that require specific social orders) captures the container perfectly without making *everything* political. A traffic cone is not political; a global logistics standard is. The distinction lies in **scale of social reorganization** and **foreclosure of alternatives**.

  Here is the principle I propose. It prioritizes the **delegation of authority** and the **resistance to contestation**. It overrules you on the glued battery and the shipping container, but saves the roundabout.

  ### The Principle of Delegated Authority

  **An artifact has politics when it encodes a normative judgment into a material or logical constraint that distributes power or access and is resistant to revision through ordinary deliberative processes.**

  This principle works by filtering for three things:
  1.  **Normative Judgment:** It's not just a physical law (gravity); it's a choice about how people *should* behave or who *should* benefit.
  2.  **Distribution:** It changes who has power, access, or risk.
  3.  **Resistance:** Once built/implemented, it is harder to change than a law or a policy.

  **Why this saves your Roundabout:** A roundabout encodes a judgment about flow efficiency, but it does not systematically distribute power to a specific class nor exclude a group from access (assuming car ownership is background, not the artifact's specific work). It is a technical optimization, not a social settlement.
  **Why this catches your Battery:** A glued battery encodes a judgment that manufacturer control over the lifecycle supersedes user sovereignty. It distributes power (manufacturer over user) and is resistant to revision (you cannot change it without destroying the device).
  **Why this catches the Container:** It is not just a box; it is a standard that reorganized global labor. It is resistant to revision (global infrastructure lock-in). It is political in a "systemic" sense, distinct from the "constitutive" sense of the overpass, which prevents the "everything is political" slide by distinguishing between *local exclusions* and *global structural requirements*.

  **The Mesh App:** This artifact is political because it *affords* a specific power dynamic (state surveillance vs. citizen evasion) that standard infrastructure does not. The politics is in the **affordance**, not the specific use.

  **Weakest Step:** Distinguishing the Roundabout from the Speed Bump. Both delegate traffic authority to geometry. My defense is that speed bumps are *punitive* (imposing discomfort to enforce a rule), while roundabouts are *flow-based* (optimizing movement). This is a thin line, and it is where the principle is most vulnerable to the charge that "efficiency is also political."

