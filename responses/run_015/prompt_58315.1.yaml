answer: |-
  Right, pull up a chair. I know the type. The brother-in-law talks about "logarithmic utility" and "ergodicity," but what he's actually describing is the difference between the agronomist who looks at the ten-year average yield and the old hand who remembers the winter of '93.

  You've hit on something profound there: the intuition that kept your farm standing for twenty years is the same maths the betting theorists are fighting over. They just use different words for the soil.

  Here is how I, as a philosopher of risk who's spent time in the cab of a combine as well as the lecture hall, would map this out for you.

  ### Part 1: The Mapping Plan (Brainstorming)

  Before I translate the argument, I need to lay out how the abstract maths sits against the concrete reality of your land outside Norwich.

  1.  **Capital / Bankroll:** This isn't just cash in the bank. It's your working equity. It's the fuel in the tank, the fertiliser in the shed, and the credit line with the bank. If this hits zero, you're not just "down a bet"; you're handing the keys back.
  2.  **Bet Size:** This is your acreage allocation. If you have 500 acres, deciding to put 400 into sugar beet because the contract price looks juicy is a "large bet." Putting 100 into beet is a "small bet."
  3.  **Expected Value (EV):** This is the "Paper Yield." It's looking at the average price of wheat over five years and the average yield of your soil, multiplying them, and saying, "This crop makes the most money on average."
  4.  **Geometric Growth (Kelly):** This is the "Compound Harvest." It's recognising that this year's profit buys next year's seed. If you have a disaster year, your base for the next year is smaller. You need a strategy that grows the *farm*, not just maximises one harvest.
  5.  **Ruin:** In betting, ruin is losing your stack. In farming, ruin is insolvency. But there's a softer ruin: losing the tenancy, or the bank putting you on a short leash so you can't invest in new kit.
  6.  **Time vs. Averages (Ergodicity):** This is the crux.
      *   *The Economist's View (Ensemble):* Imagine 1,000 versions of your farm. In most, you plant all wheat. The average wealth of those 1,000 farms is huge.
      *   *The Farmer's View (Time):* You are only *one* farm. You live through 20 sequential harvests. If one of those harvests wipes you out in Year 5, you don't get to enjoy the average of Years 6–20.

  ### Part 2: The Translation (The Debate in the Tea Room)

  Here is the argument between the "Expected Value" man (let's call him the Banker) and the "Geometric" man (your Brother-in-Law), translated into the language of the land.

  **The Banker's Argument (Maximise Expected Value):**
  "Look at the books. Over the last decade, wheat has returned £800 per hectare on average. Barley only £600. Sugar beet is volatile, but averages £900. If you want to be rational, you should plant as much wheat and beet as your rotation allows, every single year. Yes, sometimes the price crashes or the blight hits. But in the years it works, you make so much money that it covers the bad years. You should size your planting to maximise the average wealth at the end of the season."

  *In farming terms:* This is the agronomist telling you to push the nitrogen rates to the max because *on average* the yield response pays for it. It ignores that a wet June might mean you spend the money on fertiliser but get no yield.

  **The Brother-in-Law's Argument (Maximise Geometric Growth / Kelly):**
  "That's madness. If you plant everything to wheat and you get one proper wet harvest, or a price crash, your income drops by 80%. But your costs stay the same. You dip into reserves. Now next year, you're starting with less cash. You can't afford the best seed, you can't fix the tractor properly. You're farming from a weaker position.
  To grow this farm over twenty years, you shouldn't plant what gives the biggest *average* return. You should plant the mix that gives the best *compound* return. That means accepting a lower profit in the good years so you don't bleed out in the bad years. You size your beet acreage not by how much you *could* plant, but by how much you can afford to lose without the bank manager calling you in."

  *In farming terms:* This is holding back seed corn. It's leaving a field fallow or planting a lower-value cover crop to protect the soil structure, even if the "paper value" says you should crop it. It's recognising that a 50% loss requires a 100% gain just to get back to even.

  **The Philosophical Clash (Utility vs. Ergodicity):**
  Now, here is where the academics argue.

  *   **Side A (The Economists):** They say the Brother-in-Law is just "risk-averse." They say, "Mathematically, the Banker is right about the average. The Farmer is just scared. He has a 'logarithmic utility function,' which is a fancy way of saying losing £10,000 hurts him more than gaining £10,000 helps him. It's a psychological preference, not a mathematical truth."
  *   **Side B (The Ergodicity Economists):** They say, "No, the Farmer is mathematically right and the Banker is wrong. The Banker is averaging across parallel universes (1,000 farms). The Farmer lives in *time* (one farm, 20 years). Because the farm is a compounding system (profit becomes next year's capital), the arithmetic average is a lie. The geometric average is the only one that reflects reality. It's not about being scared; it's about the structure of time."

  **The Verdict in the Field:**
  If you follow the Banker (EV), you might make more money in a decade of perfect weather. But if you hit a run of three bad seasons, you're gone.
  If you follow the Brother-in-Law (Kelly), you will never make the maximum possible money in a single boom year. But you will almost certainly still be farming in twenty years. Your farm grows at the fastest *sustainable* rate, not the fastest *theoretical* rate.

  ### Part 3: The Residue Report

  You asked for the honest truth about where this mapping works and where it breaks down. Here is the residue.

  **1. What Maps Cleanly (The Solid Ground)**
  *   **Ruin is Absolute:** In both betting and farming, hitting zero means game over. The concept of "absorbing barriers" (where you can't continue) is identical. The Banker's maths breaks at zero; the Farmer's life breaks at zero.
  *   **Compounding:** The Kelly Criterion relies on the idea that winnings are reinvested. In farming, profit *is* next year's working capital. This maps perfectly. If you take a big hit to your equity, your ability to generate income next year is physically reduced (less fertiliser, older kit).
  *   **Sequence Risk:** The order of events matters. A bad harvest in Year 1 is worse than a bad harvest in Year 10 if you haven't built reserves. The "Time Average" concept is exactly how a farmer experiences career risk.

  **2. What Had to be Fudged (The Sticky Bits)**
  *   **Liquidity and Timing:** In betting, you can adjust your bet size instantly after every hand. In farming, you commit to a crop in autumn and don't see the return until late summer. You can't "fold" halfway through the season if the weather turns. This makes the "optimal bet size" harder to calculate in farming because you're locked in for longer.
  *   **Correlation:** In betting, a hand of cards is usually independent of the last hand. In farming, risks are correlated. If it's a wet year, *all* your fields suffer, not just the wheat. If the global grain price crashes, *all* your crops drop in value. This makes "diversification" (rotation) less effective at reducing risk than a bettor splitting money between cards and horses.
  *   **Consumption:** A bettor can leave money in the pot. A farmer has to eat. You have to draw a salary off the top. This "drag" on capital means the pure Kelly formula (which assumes full reinvestment) is too aggressive for a family farm. You're actually playing a "Fractional Kelly" strategy just by living.

  **3. The Philosophical Leftover (Does it matter?)**
  There is one big argument in the philosophy of risk that has **no counterpart** in farming, and it reveals where the theorists are overthinking things.

  *   **The Debate:** The economists argue about whether Kelly is "Rationality" or just "Preference." They ask: *Is it irrational to maximise Expected Value if you might go bust?*
  *   **The Farming Reality:** On the farm, this distinction collapses. Survival *is* rationality.
      *   If you go bust, you can't farm.
      *   Therefore, any strategy that risks busting the farm for a higher average return is, by definition, irrational for a farmer.
      *   The theorists argue about whether this is a "moral preference" (I like safety) or a "mathematical truth" (Time averages differ from ensemble averages).
      *   **Honest Assessment:** For you, it doesn't matter. The outcome is the same. The "Ergodicity" argument (Side B above) is basically a fancy mathematical proof of what your grandfather knew: *You can't eat averages.*

  **4. Is the Farming Vocabulary Missing Something?**
  Honestly? No. If anything, the farming vocabulary is *superior* for this specific problem.
  *   The theorists talk about "wealth." You talk about "viability."
  *   The theorists talk about "probability distributions." You talk about "weather windows" and "market contracts."
  *   The theorists argue about whether Kelly is "true." You know that if you plant all beet and the blight comes, you're done.

  The only thing the theorists have that you don't is a precise formula for *exactly* how much to cut back. Kelly gives a specific percentage (e.g., "Bet 15% of your bankroll"). Farming relies on heuristics ("Keep 6 months' operating costs in reserve").
  *   *The Risk:* Heuristics are robust but maybe not optimal. You might be playing *too* safe compared to the mathematical Kelly limit, leaving growth on the table.
  *   *The Benefit:* Heuristics account for the stuff the maths misses (like your tractor breaking down or a divorce in the family).

  ### Final Word

  Your brother-in-law is right about the principle, even if he's annoying about the jargon. The "Expected Value" maximisers are modelling a world where you can survive infinite ruin, which isn't the world you live in.

  But don't let him convince you that farming is just gambling. In betting, the house always has an edge. In farming, you can influence the odds. You can drain the field, you can rotate the crops, you can store the grain and wait for the price to lift. You aren't just sizing a bet; you're tending a system.

  The philosophers argue about whether Kelly is "true rationality." You don't need the philosophy. You have the harvest. If the strategy keeps you in the game for twenty years, it's rational. If it lands you in the hands of the insolvency practitioner, it isn't. The rest is just noise.
