  2.  **The Refinement Criterion:** If a trait shows evidence of secondary selection modifying its structure specifically for its current function (independent loci, structural optimization), it qualifies as an Adaptation or promoted Aptation (derived from 4, 5, 6).
  3.  **The Origin Priority:** The verdict attaches to the historical origin of the structure relative to the function; if the structure predates the function, it is Exaptation unless secondary modification is proven (derived from 4, 5, 7).

  (c) Rule 1 predicts **Spandrel**. It prioritizes the $r_g \approx 0.8$ correlation with the capsule; the flange is a hitchhiker on the chemosensory adaptation. Rule 2 predicts **Adaptation/Aptation**. It prioritizes the trabecular alignment and selective sweep as proof of secondary modification for burrowing. Rule 3 predicts **Exaptation**. It prioritizes the phylogenetic fact that the flange existed (without the sheet) before the burrowing function. They come apart on the weight given to the selective sweep and trabecular alignment versus the genetic correlation. Rule 1 dismisses the sweep as ambiguous; Rule 2 treats it as decisive; Rule 3 treats it as irrelevant to the initial categorization, reserving it for status promotion.

  (d) If the precedents underdetermine the case, choosing Spandrel adopts the principle that **constraint trumps optimization**. This reinforces Precedent 3 but risks rendering Precedent 6 (Cichlids) vulnerable if any hidden correlations exist between jaw shape and body size. Choosing Adaptation adopts the principle that **current optimization overrides origin**. This would force reopening Precedent 3; if trabecular alignment existed in the antlers, would they be adaptations? It also resolves the reservation in Precedent 4 (Feathers) in favor of promotion. Choosing Exaptation adopts the principle that **origin fixes category, refinement modifies status**. This maintains consistency with Precedent 5 and 7 without threatening Precedent 3, as it acknowledges the utility without granting full Adaptation status without clearer timing. It avoids the risk of reopening settled verdicts while acknowledging the biomechanical data.

  (e) The single decisive finding would be **resolving the timing of the selective sweep relative to the soil shift**. If the sweep predates the shift, the flange projection was selected before the burrowing function became critical, supporting Spandrel/Exaptation (hitchhiking on capsule). If the sweep postdates the shift, it confirms secondary selection specifically for burrowing, supporting Aptation/Adaptation. This matters more than finding independent loci because timing distinguishes between coincident selection on the capsule versus direct selection on the flange for this specific function. It directly addresses the ambiguity in Precedent 4 regarding when promotion is earned. Finding a non-burrowing species with the flange would be less decisive, as exaptations often persist without their co-opted function; only the timing of selection can distinguish a spandrel maintained by correlation from an exaptation refined by new selection.
