answer: |-
  Here is a design for your 90-minute seminar, structured to maximize the tension between causal and evidential reasoning without a preliminary lecture.

  ### Part 1: Candidate Skeletons

  I considered three structures for the 90 minutes.

  **Skeleton A: The Pure Platonia Deep-Dive**
  *   **Structure:** Four rounds of the Platonia telegram game (Silent → Talk → Asymmetry → Copy Rule). No Luring Lottery.
  *   **Rejection Reason:** While this isolates the "exactly one" logic, it risks becoming repetitive. Students may tune out after the second failure. It also misses the opportunity to show how the *magnitude* of the defection matters (the Luring Lottery's "arms race" is visually distinct from Platonia's binary crash).

  **Skeleton B: The Escalation (Your Provisional Plan)**
  *   **Structure:** Platonia (Silent) → Platonia (Talk) → Luring Lottery (Single Round) → Debrief.
  *   **Rejection Reason:** It drops your two most sophisticated wrinkles (Asymmetry and Copy Rule). These are essential for the debrief to move beyond "CDT vs. EDT" into "degrees of similarity" and "manufactured correlation." Without them, the session remains a standard demonstration of the Tragedy of the Commons.

  **Skeleton C: The Balanced Arc (Selected)**
  *   **Structure:**
      1.  **Platonia I (Silent):** Establishes the baseline failure.
      2.  **Platonia II (Talk):** Tests the "Institution" hypothesis.
      3.  **Luring Lottery:** Visualizes the marginal cost of defection.
      4.  **Platonia III (Copy Rule/Asymmetry Mix):** The theoretical climax.
      5.  **Debrief:** Mapping actions to theory.
  *   **Why:** This uses the full 90 minutes to build a narrative: *Failure → Attempted Coordination → Institutional Collapse → Theoretical Rescue (which feels artificial).* It hits every learning objective.

  ---

  ### Part 2: The Session Design (90 Minutes)

  **Logistics:** 18 Students. £40 Voucher. Whiteboard. Cards/Envelopes/Hat.
  **Stakes:** Tell them: "If the conditions are met, one of you gets this voucher. If not, I will shred it live." (Shredding is more dramatic than donating to a disliked cause, as it emphasizes *waste* rather than *transfer*).

  #### Phase 1: The Silent Telegram (20 Minutes)
  *   **Setup:** Distribute index cards. Instructions on board: "Mark **SEND** or **ABSTAIN**. If exactly one person marks SEND, that person wins £40. If 0 or 2+ mark SEND, the voucher is destroyed. No talking."
  *   **Action:** Collect cards in envelopes, shuffle, open.
  *   **Predictable Outcome:** 5–12 Senders. Voucher destroyed.
  *   **Pedagogical Note:** Do not comment. Just record the number of senders on the board.

  #### Phase 2: The Institutional Attempt (25 Minutes)
  *   **Setup:** "You have 3 minutes to talk. Then we play again. Same rules."
  *   **Action:** Allow cheap talk. Students will likely propose a lottery ("We draw names, one person sends").
  *   **The Trap:** Do not enforce the agreement. Collect cards secretly.
  *   **Predictable Outcome:** The agreement collapses. Either multiple people send (trying to be the hero) or none send (fear of being the sucker).
  *   **Why:** This validates your hypothesis: *Superrationality is a private substitute for coordination.* When public coordination is allowed but unenforceable, CDT dominates.

  #### Phase 3: The Luring Lottery (20 Minutes)
  *   **Setup:** "The pot is now 18 chocolates (or points). You may buy tickets. Cost: 1 ticket = 1 entry. Pot is split equally among all tickets bought. One ticket drawn to win the whole pot."
      *   *Correction for Clarity:* To match Hofstadter's *Scientific American* setup: The prize $V$ is fixed. The winner is drawn from all tickets. The prize *amount* is $V / (\text{Total Tickets})$.
      *   *Simplified for Board:* Write "Prize = £180 / Total Tickets".
      *   *Example:* If 18 people buy 1 ticket each, Total = 18. Prize = £10. Win prob = 1/18. EV = £0.55.
      *   If I buy 2 tickets (others 1), Total = 19. Prize = £9.47. My Win Prob = 2/19. EV = £1.00. (Defection pays).
      *   If everyone buys 10 tickets, Prize = £1. Win prob = 10/180. EV = £0.05.
  *   **Action:** Two rounds. Round 1 (Silent). Round 2 (After showing the arithmetic decay on the board).
  *   **Goal:** Show the "arms race" visually. The pot value shrinks as ticket numbers rise.

  #### Phase 4: The Wrinkles (15 Minutes)
  *   **Asymmetry:** Hand 6 students (1/3) a sealed note: "If you ABSTAIN, you get £5 guaranteed regardless of the group outcome." (Fund this from your own pocket, it's cheap for the insight).
  *   **Copy Rule:** Announce: "For this final ballot, I will roll a die. On a 1 (prob $q \approx 0.17$), I will discard your card and replace it with a photocopy of a random other student's card from Phase 1."
  *   **Action:** Final Platonia ballot.
  *   **Goal:** The Asymmetry breaks the "we are identical" premise. The Copy Rule makes correlation *causal*.

  #### Phase 5: Debrief (10 Minutes)
  *   Rapid-fire mapping of their experience to the theory (see below).

  ---

  ### Part 3: Mechanics & Math Pressure-Test

  #### 1. Cheap Talk: To Permit or Not?
  **Permit it.** You must let them try to build an institution so they can feel it fail.
  **Keeping it Honest:** Use sealed envelopes. Do not let them sign contracts. If they ask "Can we promise?", say "You can say whatever you like." The tension between *saying* you will abstain and *marking* Send is the data point you need.

  #### 2. Luring Lottery Arithmetic
  You want the cost of an extra entry to be visible.
  *   **Formula:** $EV_i = \frac{n_i}{\sum n_j} \times \frac{V}{\sum n_j} = \frac{V \cdot n_i}{(\sum n_j)^2}$.
  *   **The Visualization:** On the whiteboard, draw a table:
      *   Total Tickets: 18 → Prize per Ticket: £10 → Max EV (1 ticket): £0.55
      *   Total Tickets: 36 → Prize per Ticket: £5 → Max EV (1 ticket): £0.14
      *   Total Tickets: 180 → Prize per Ticket: £1 → Max EV (1 ticket): £0.005
  *   **Instruction:** "You may write any integer number of tickets." Expect the CS students to write absurd numbers (e.g., "1000") to game the draw probability, ignoring the division. This mirrors the original *Scientific American* result.

  #### 3. Asymmetry Variant Analysis
  *   **Setup:** 6 students get £5 for Abstain. 12 get £0 for Abstain.
  *   **CDT View:**
      *   Group A (Guaranteed): Dominant strategy is **ABSTAIN** (£5 > £0 expected).
      *   Group B (No Guarantee): Dominant strategy is **SEND** (Chance of £40 > £0).
  *   **FDT/Superrational View:**
      *   If Group B agents are similar to each other, they should randomize with $p = 1/12$.
      *   *Crucial Debrief Point:* Does Group B need to account for Group A? Yes. Group A will likely abstain. So Group B is playing a Platonia game with $N=12$, not $N=18$.
      *   **Similarity:** This shows superrationality requires *relevant* similarity. Group A is logically distinct because their payoff matrix differs.

  #### 4. The Copy Rule Threshold ($q$)
  You asked for the threshold $q$ where a student expecting fraction $r$ of others to abstain should herself abstain.
  *   **Honest Assessment:** With a standard Platonia payoff (Win £40 if Unique Sender, else £0), **there is no $q$ that makes Abstain rational for a selfish agent.** If you Abstain, your payoff is £0 (unless you copy a winner, see below). If you Send, payoff $\ge 0$.
  *   **The Fix:** To make the math work as you intend, you must announce: *"If your card is a photocopy of the Unique Sender's card, you share the prize."*
  *   **Revised Math (With Sharing):**
      *   Let $N=18$. Others $M=17$. Prob others Send = $s = 1-r$.
      *   **EV(Abstain):** You only win if $q$ triggers AND you copy the Unique Sender.
          *   $EV_A = q \times P(\text{Exactly 1 Sender among Others}) \times \frac{V}{2}$ (Assuming 2-way split).
          *   $EV_A = q \cdot \binom{17}{1} s (1-s)^{16} \cdot \frac{V}{2}$.
      *   **EV(Send):**
          *   Case 1 ($1-q$): You Send. Win if 0 others Send. $V \cdot (1-s)^{17}$.
          *   Case 2 ($q$): You Copy.
              *   If you copy Sender: Collision. Payoff 0.
              *   If you copy Abstainer: You become Abstainer. Win if 1 other Sends. (Same as $EV_A$ logic).
          *   $EV_S = (1-q) V (1-s)^{17} + q (1-s) \left[ \binom{17}{1} s (1-s)^{16} \frac{V}{2} \right]$.
      *   **Threshold:** Set $EV_A > EV_S$.
      *   This is complex for the room. **Simplification for Seminar:**
      *   State: "If $q=0$, Sending is dominant. If $q=1$, your vote is just a random sample of the room; Sending adds no agency but risks collision. The threshold is roughly where the probability of *duplicating* a sender exceeds the probability of *being* the unique sender."
      *   **Calculated Threshold:** For $N=18$, assuming optimal play ($s \approx 1/18$), the switch happens near **$q \approx 0.5$**. Below 0.5, you have enough agency to justify the risk. Above 0.5, you are mostly a copy, so restraint (to avoid duplication) becomes safer.

  #### 5. What the Copy Rule Shows (and Hides)
  *   **Shows:** It demonstrates that if correlation is *causal*, CDT agents *will* restrain. It validates FDT by mechanizing its premise.
  *   **Hides:** It manufactures the dependence that FDT claims exists *logically*. It proves less than it appears because real agents are not photocopiers. It risks convincing students that superrationality only works if a "God" enforces correlation.
  *   **Debrief Line:** "This rule makes the logical link physical. But in the real world, the link is only in the reasoning. Does the reasoning hold without the machine?"

  ---

  ### Part 4: The Debrief Map

  Do not lecture. Ask questions and map their answers to the board.

  1.  **Phase 1 Failure:** "Why did you Send?" $\rightarrow$ **Causal Decision Theory.** "My card doesn't change theirs."
  2.  **Phase 2 Collapse:** "Why did the agreement fail?" $\rightarrow$ **Institutional Instability.** Without enforcement, promises are cheap talk. Superrationality is a *private* coordination mechanism that fails when public coordination is attempted but unenforceable.
  3.  **Luring Arms Race:** "Why did ticket numbers go up?" $\rightarrow$ **Marginal Private Gain > Marginal Social Loss.** The many-person Newcomb problem.
  4.  **Asymmetry:** "Did the £5 group Abstain?" $\rightarrow$ **Similarity Conditions.** Superrationality only groups agents with identical payoff structures.
  5.  **Copy Rule:** "Did $q$ change your mind?" $\rightarrow$ **Evidential vs. Causal.** At high $q$, the causal link mimics the evidential link.

  **Arguing with Your Hypothesis:**
  You hypothesize: *"Superrationality will then look like a private substitute for coordination the group is not allowed to perform."*
  **Critique:** This is mostly correct, but be careful. Superrationality isn't just a *substitute*; it's a *redefinition* of the agent. The group's attempt to build an institution fails because they are still acting as *individuals* trying to constrain *others*. Superrationality requires acting as a *fragment of a group agent*. The collapse shows that without the *identity shift*, institutions fail.

  ---

  ### Part 5: Predictable Failures & Mitigations

  1.  **The Joker:** One student Sends in every round just to burn the voucher.
      *   *Mitigation:* In the debrief, isolate them. "You played a different game. You valued *expression* over *prize*." This highlights that rationality is relative to utility functions.
  2.  **The Economist:** "Sending is a dominant strategy. This seminar is wrong."
      *   *Mitigation:* Agree with them. "Under CDT, you are 100% correct. The seminar is about whether CDT is the *only* rationality."
  3.  **Probability Failure:** With $N=18$, if everyone randomizes $1/18$, success is ~37%. If 3 people decide to be "the one", success is 0%.
      *   *Mitigation:* If Phase 1 fails (likely), emphasize the *number* of senders. "12 senders. If you had all randomised, we might have won."
  4.  **Luring Sabotage:** CS students enter $10^{100}$ tickets.
      *   *Mitigation:* Cap tickets at 100, or use the arithmetic to show how their EV drops to zero. "You won the draw, but the prize is £0.00001."

  ---

  ### Part 6: Honest Limitations

  End the session by listing what the simulation *cannot* do. This protects your intellectual honesty.

  1.  **Stakes:** £40 is trivial. A billion dollars changes risk aversion and focus.
  2.  **One-Shot:** Real life has repetition. Reputation would solve Phase 2.
  3.  **Similarity:** In the room, you are 18 distinct humans. Hofstadter's argument requires you to be *logical clones*. The Copy Rule fakes this; it doesn't prove it.
  4.  **The Copy Rule:** It proves that *causal* correlation induces restraint. It does not prove that *logical* correlation should. That leap remains a philosophical assumption (FDT), not an empirical result.

  **Final Advice:** Your role is not to tell them who is right. Your role is to make the CDT student feel the *loss* of the voucher as a personal failure of reasoning, and the FDT student feel the *fragility* of their logic when faced with a Joker. If they leave arguing about whether the Copy Rule "counts" as real correlation, you have succeeded.
