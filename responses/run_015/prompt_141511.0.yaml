      *   The "Sweet Spot" is where $q$ makes Sending risky enough that Randomization is the only stable strategy.
      *   I will advise the user to frame this carefully.

  8.  **Final Polish:**
      *   Tone: Collegial, expert, slightly provocative.
      *   Formatting: Clear headings, bold text for emphasis.
      *   Ensure all constraints (90 mins, 18 students, no lecture) are met.

