      *Actually, the biggest logical hole is (2) vs (5).* If the thinker is instantaneous, *who* reconstructs the knowledge? The reconstruction requires a chain of reasoning. If the thinker at step 2 is not the thinker at step 1, the warrant is lost. This is the "Problem of the Specious Present" applied to epistemology.

