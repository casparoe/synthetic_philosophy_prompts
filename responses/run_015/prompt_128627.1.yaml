          *   *Conflict:* Indexicals require a context to secure reference. If there is no substance, what fixes the index? If it's just "thinking happening," who is the "I" indexing?
          *   *Severity:* Moderate. Tied to Tension A.

  5.  **Ordering by Severity:**
