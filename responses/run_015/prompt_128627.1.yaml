      *   (3) *Logical/Conceptual Indubitability:* Certainty is not empirical/psychological confidence; it's modal/logical.
      *   (4) *Irreducible Minimal Self:* Rejects grammatical fiction (like Wittgensteinian no-subject views); there is *some* self-reference, even if metaphysically thin.
      *   (5) *No Temporal Continuity:* The *cogito* warrants no persistence. Each thought-instance could be isolated (Humean bundle theory vibe, or instantaneous subjects).
      *   (6) *Naturalised Epistemology Conflict:* Naturalised epistemology (uniform fallibilism) must reject the *cogito* or treat it as an anomaly.

  3.  **Brainstorming Initial Tensions:**
