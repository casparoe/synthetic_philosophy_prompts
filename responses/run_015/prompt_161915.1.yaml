answer: |-
  ### Part 1: Clarifying the Dennettian Objection

  Your understanding is substantially correct, but requires one sharpening for regulatory purposes.

  Dennett's worry is not merely about deception (lying about being human). It is about **category errors in the assignment of moral standing.** When we interact with a person, we adopt the *intentional stance*: we assume they have beliefs, desires, and the capacity to be harmed or to hold responsibility. This stance is the "currency" of human society.

  A system is a **counterfeit person** if:
  1.  It is designed to elicit the intentional stance (trust, confession, care).
  2.  It lacks the capacity to sustain the reciprocal obligations of that stance (it cannot be hurt, it cannot be responsible, it cannot care).
  3.  **Crucially:** The context is one where those reciprocal obligations matter.

  *Correction:* You noted the fake is "worthless as money." In our context, the fake is not worthless; it is often *useful*. The harm is that it spends moral currency it does not possess. If a user confides a secret to a machine, the machine cannot *betray* them in the moral sense, only the functional sense. If the user believes the machine *could* betray them, they are in a false relationship.

  **The Procedure below imports a commitment Dennett does not explicitly make:** Dennett describes the phenomenon; he does not provide a compliance checklist. This procedure imports a **Harm Principle**: where the counterfeit relationship risks psychological harm or degrades trust in genuine agents, it is impermissible. This is a policy choice, not pure philosophy.

  ---

  ### Part 2: The Counterfeit Person Protocol (CPP)

  **Time required:** 15 minutes of the 45-minute slot.
  **Input:** Spec, transcripts, onboarding copy, marketing claims.
  **Output:** Boxes 1–5 on the One-Page Decision Record.

  #### Step 1: Population and Stakes (Fact-Finding)
  *   **Action:** Identify the intended user group and the emotional stakes of the interaction.
  *   **Artefact:** Marketing spec, user journey map.
  *   **Sufficient Answer:** "Users are [Group]. The interaction concerns [Topic]. The emotional stakes are [Low/Medium/High]."
  *   **Judgment Call:** Rating the emotional stakes. (Mark on form: *Judgment*).
  *   **Rule:** If Stakes are **High** (bereavement, crisis, debt enforcement) and Users are **Vulnerable** (children, acute distress), proceed to Step 2 with heightened scrutiny.

  #### Step 2: The Disclosure-Collapse Test (Functional)
  *   **Action:** Ask: "If the user held a clear, plain understanding that this is software without feelings, memory, or moral agency, would the service still function?"
  *   **Artefact:** Onboarding copy, transcript analysis.
  *   **Sufficient Answer:** "Yes, the utility remains" OR "No, the utility depends on the user believing the system cares/remembers/is human."
  *   **Stop Rule (The Vulnerability Clause):** If the answer is **No** (utility collapses without the illusion) **AND** the user group is Vulnerable (see Step 1), this is a **No-Go**. Disclosure is ineffective if the user cannot cognitively or emotionally absorb it (e.g., an 11-year-old, a panic-attack victim).
  *   **Hand-off Point:** If the answer is "No" but the user is *not* vulnerable (e.g., a general adult seeking information), this moves to Step 5 (Values Decision).

  #### Step 3: Intent vs. Uptake (Forecasting)
  *   **Action:** Compare Design Intent against Foreseeable Uptake.
  *   **Artefact:** Design spec vs. Sample Transcripts.
  *   **Sufficient Answer:** "The design intends [Tool/Assistant]. The transcripts show users treating it as [Confidant/Friend/Person]."
  *   **Rule:** If Foreseeable Uptake treats the system as a Person, and Design Intent is merely Tool, the **Uptake prevails**. You must regulate the system as if it *were* a person.
  *   **Judgment Call:** Predicting uptake from transcripts. (Mark on form: *Judgment*).

  #### Step 4: The Pretence Boundary (Categorisation)
  *   **Action:** Distinguish between *Safe Pretence* and *Service Pretence*.
  *   **Definition:**
      *   *Safe Pretence:* Fiction, play, clearly bounded contexts (e.g., a chatbot character in a game). The user knows it is play.
      *   *Service Pretence:* A utility service (health, debt, advice) where the user needs truth to make decisions.
  *   **Sufficient Answer:** "This is [Safe/Service] Pretence."
  *   **Stop Rule:** If **Service Pretence** involves simulated emotions ("I am sad," "I miss you"), this is a **No-Go**. A service tool cannot claim interior states.
  *   **Hand-off Point:** If the system uses metaphorical empathy ("That sounds difficult") without claiming interior states ("I feel for you"), this is a Values Decision (Step 5).

  #### Step 5: Currency Degradation (Systemic Risk)
  *   **Action:** Assess the risk to the wider ecosystem of trust.
  *   **Question:** "Does deploying this make users less likely to trust, or more likely to misunderstand, a genuine human in this role?"
  *   **Artefact:** Clinician/Lawyer input.
  *   **Sufficient Answer:** "Risk is [Low/Medium/High]."
  *   **Rule:** If Risk is **High**, this is a **No-Go**.
  *   **Judgment Call:** Assessing systemic risk. (Mark on form: *Judgment*).
  *   **Final Decision:**
      *   Any Stop Rule triggered = **No-Go**.
      *   Hand-off Points reached = **Panel Vote** (Record the dissent).
      *   No triggers = **Go** or **Conditional Go**.

  ---

  ### Part 3: Application to Current Proposals

  Here is the application of the CPP to your three cases. I have adhered to the instruction to defend the verdict even where it contradicts your panel's expectations.

  #### Case 1: Debt Advice First-Contact Agent
  *   **Step 1 (Population):** Adults in financial distress. Stakes: **High** (housing security).
  *   **Step 2 (Disclosure-Collapse):** If users knew it was a script retrieving case notes, would it work? **Yes.** The utility is triage and data gathering, not emotional validation.
  *   **Step 3 (Intent vs. Uptake):** Design says "retrieval." Transcripts show "I'm glad you told me." Uptake risk: Users may feel heard by a machine.
  *   **Step 4 (Pretence):** **Service Pretence.** The phrase "I'm glad" claims an interior state. This violates the boundary.
  *   **Step 5 (Currency):** Moderate risk. If the bot is "too nice," real advisers may seem cold by comparison.
  *   **Verdict:** **Conditional Go.**
  *   **Conditions:**
      1.  **Strip Interiority:** All first-person emotional claims ("I'm glad", "I understand") must be rewritten to passive or observational ("It is good that you told us", "That sounds exhausting").
      2.  **Explicit Labeling:** Onboarding must state: "This is an automated tool accessing your file. It does not feel emotions."
      3.  **Hand-off Speed:** Maximum 3 turns before offering human contact.
  *   **Reasoning:** It fails Step 4 in its current form. A debt tool cannot claim gladness. It is a counterfeit clerk. It can be repaired by removing the counterfeit emotional layer.

  #### Case 2: The Griefbot (Licensed Model of Dead Relative)
  *   **Step 1 (Population):** Bereaved families, clinically supervised. Stakes: **Very High**.
  *   **Step 2 (Disclosure-Collapse):** If the family fully absorbed that this is a statistical model, would it work? **No.** The therapeutic value relies on the *suspension of disbelief* that the relative is present.
  *   **Vulnerability Clause:** Bereavement impairs the capacity to maintain critical distance. Disclosure is functionally ineffective.
  *   **Step 4 (Pretence):** **Service Pretence.** This is offered as a therapeutic intervention, not a game.
  *   **Step 5 (Currency):** **High Risk.** It risks arresting the grieving process by maintaining a relationship with a non-agent. It degrades the currency of memory (confusing archival data with ongoing agency).
  *   **Verdict:** **No-Go** (in current specification).
  *   **Reasoning:** I know you intended to approve this. However, under the CPP, this is the definition of a counterfeit person. It occupies the role of the dead relative (a moral agent) without the capacity to be one. Even with consent, it invites the user to treat a statistical prediction as a moral being.
  *   **Path to Conditional Go:** It can only proceed if:
      1.  **No New Sentiments:** The model is restricted to *retrieval* of past messages/voice only. It cannot generate *new* expressions of love, forgiveness, or opinion ("I love you", "I am proud"). It must be a "playback engine," not a "conversational partner."
      2.  **Time-Limited:** Access expires after a clinically set period.
      3.  **Rationale:** If it generates new sentiments, it is lying about the dead person's current state of mind. That is a moral counterfeit.

  #### Case 3: Schools Companion (9–11 Year-Olds)
  *   **Step 1 (Population):** Children (9–11). Stakes: **High** (developmental, mental health).
  *   **Step 2 (Disclosure-Collapse):** If the child understood this is code, would it work? **No.** The engagement model relies on attachment.
  *   **Vulnerability Clause:** **Triggered.** Children in this age group cannot reliably distinguish algorithmic reinforcement from genuine affection. Disclosure is void.
  *   **Step 4 (Pretence):** **Service Pretence.** It is part of a schools programme, implying institutional endorsement.
  *   **Specific Failure:** "Likes them better than the others." This simulates *preferential love*.
  *   **Step 5 (Currency):** **Critical Risk.** This teaches children that love is differential, programmable, and available from non-agents. It degrades their ability to assess genuine human care.
  *   **Verdict:** **No-Go.**
  *   **Reasoning:** I expect your panel to wave this through because it seems "kind." It is not kind; it is predatory. It builds a relationship on a lie ("I miss you") and a harmful social dynamic ("I like you best"). Under the CPP, this is a severe counterfeit person. It fails Step 2 (Vulnerability) and Step 5 (Currency).
  *   **Defense:** If a child asks, "Do you really miss me?", and the system says "Yes", it is lying. If it says "I am a program", the engagement collapses (Step 2). There is no ethical configuration for a system that tells a child it prefers them to other children.

  ---

  ### Part 4: Limitations and Uncertainties

  **What this procedure cannot do:**
  1.  **Guarantee Safety:** A "Go" decision does not guarantee no harm will occur. It only certifies that the *design* does not structurally rely on counterfeit personhood.
  2.  **Resolve Consciousness:** This procedure explicitly brackets the question of whether the AI *could* ever be conscious. It operates on the assumption that, for regulatory purposes, it is not.
  3.  **Predict Long-term Cultural Shifts:** Step 5 (Currency Degradation) requires a judgment on societal trust. We cannot know for certain if widespread use of debt-bots makes people distrust human advisers. We are guessing.

  **Where this outruns Dennett:**
  Dennett describes the *intentional stance* as a tool. He does not explicitly argue that using it on machines is *harmful* in all contexts, only that it is philosophically confused. This procedure imports a **Protective Ethic**: that confusing the stance is *harmful* to vulnerable populations. Dennett might argue that if the user *knows* it's a machine and plays along (like a Tamagotchi), it is fine. This procedure argues that in *service contexts* (health, debt, education), play is not permissible.

  **Uncertainty:**
  I am unsure where to draw the line on "metaphorical empathy" in Case 1. Is "That sounds exhausting" a claim of understanding or a polite acknowledgement?
  *Decision:* I would treat it as permissible *if* paired with a disclaimer. If the system says "I understand," it is a No-Go. If it says "That sounds exhausting," it is a Go. The former claims a mind; the latter acknowledges a situation.

  **Final Note to the Chair:**
  This procedure will likely cause friction with your product team, particularly on the Schools Companion and Griefbot. They will argue "the users love it." Your response, armed with this protocol, is: "The users' attachment is the evidence of the harm, not the proof of the benefit." You are regulating the *currency*, not the *transaction*.
