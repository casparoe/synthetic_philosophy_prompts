answer: |-
  The friend's argument needs the modal reading construed such that any backward causal influence constitutes an alteration of fixed facts, thereby ruling out even self-consistent loops.

  This slogan is a chameleon, shifting from tautology to substantive metaphysics depending on how 'change' is cashed out. To evaluate your friend's dismissal of time travel, we must separate the trivial from the substantive.

  (a) On the trivial reading, a 'changed past' is a contradiction in terms, like a round square. This is true by definition but costs nothing; it rules out inconsistent descriptions, not the mechanism of travel itself.
  (b) The causal reading claims nothing later can cause anything earlier. This is substantive. If true, it forbids time travel, but it argues from the nature of causation, not the immutability of the past.
  (c) The modal reading asserts past events are fixed; no later intervention could make them other than they in fact were. This is substantive but defensible. It blocks alteration but permits influence if that influence was always factored into the past.
  (d) The self-consistency constraint posits that any journey into the past must already be part of the single history that obtains. This is defensible physics. It allows travel while ensuring the gun jams or the traveler misses, preserving the past's truth conditions.
  (e) The epistemic reading suggests we could never tell if the past altered. This is false. It confuses verification with metaphysics; an altered past is impossible regardless of our records.

  Your friend concludes time travel is impossible. To get there from 'you can't change the past', they must assume time travel *entails* changing the past. If one adopts the self-consistency reading (d), travel is possible without change. Thus, the friend needs the modal reading (c) to imply that any backward presence alters the past's fixed status. This is where the argument breaks. If they rely on the trivial reading (a), the argument is valid but useless: it rules out *changing* travel, not travel itself. If they rely on the modal reading (c), it is defensible but doesn't rule out travel, only alteration. To rule out travel, they need the false claim that all backward causation is alteration. They need a reading on which the slogan is either too trivial to do the work or false regarding consistent loops.

  Your distinction between changing (making false what was true) and affecting (causing what was always true) is real and crucial. It rescues the self-consistency reading by showing a traveler can be a cause of past events without altering their truth values. This dissolves the grandfather paradox as a proof against travel, leaving only a constraint on consistency. The paradox remains only as a proof against *inconsistent* stories, not against backward causation itself. The friend's argument fails because it treats the impossibility of changing the past as the impossibility of affecting it. If the past includes the traveler's arrival, affecting it is just realizing what was always true. The distinction saves time travel from the charge of contradiction, provided one accepts that the timeline is a single, cohesive block rather than a sequence of replaceable states.

  I am least confident in the verdict on the causal reading (b). A demonstration that backward causation inevitably generates logical contradictions, even in consistent loops, would push it from defensible to false.
