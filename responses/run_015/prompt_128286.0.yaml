answer: |-
  # Teaching Plan: The Modal Structure of Collective Harm

  ## 1. Dependency Order
  To prevent the distinction between **Causal Redundancy** and **Counterfactual Fragility** from collapsing into standard Expected Value (EV) calculations, the concepts must be introduced in a strict sequence.

  *   **Prerequisite (Must be established first): *Actual-World Overdetermination*.**
      *   Before introducing fragility, you must secure agreement on the "Inefficacy Objection" as it stands in the *actual* world. The group must accept that in many collective-harm cases (e.g., a threshold is already exceeded), the individual action is *causally redundant* in the strict counterfactual sense (i.e., $Outcome_{action} = Outcome_{no\_action}$).
      *   *Why:* If they do not concede actual-world redundancy, they will treat fragility as a claim about actual-world impact, which is empirically false. You need them to nod at "Yes, in this specific instance, I didn't change the outcome," so you can pivot to "But that's not the whole moral picture."

  *   **Immediate Follow-up (Must come directly after): *Modal Robustness vs. Probabilistic Weight*.**
      *   Once fragility is defined, you must immediately distinguish it from "low probability, high impact." The follow-up must establish that fragility is a property of the *system's topology*, not the *agent's uncertainty*.
      *   *Why:* Without this, the distinction collapses into naive EV reasoning ("There's a small chance I matter"). The goal is to show that the agent occupies a specific structural role (a "swing node") across the modal neighborhood, regardless of the specific probability assignment in the actual world.

  ## 2. Carrying Example: The "Stochastic Load Balancer"
  **Scenario:** A distributed research cluster runs a critical simulation (e.g., protein folding). The cluster has a hard thermal cutoff: if total concurrent compute requests exceed 10,000 cores, the cooling system fails, the cluster throttles, and *all* jobs (including yours) are corrupted/lost.
  **The Action:** You submit a job requiring 1 core.
  **The State:** In the *actual* world, 10,005 cores are requested. The cluster throttles. Your job fails.

  **Features the Example Must Possess:**
  1.  **Hard Threshold:** The harm (job corruption) is binary, not linear. This creates the possibility of redundancy.
  2.  **Indistinguishability:** Your core is identical to any other core. This prevents "special contribution" arguments.
  3.  **Stochastic Fluctuation:** The total load varies slightly across time or nearby conditions (e.g., if you had submitted 10ms later, or if one other user had a script error). This generates the "nearby possible worlds."

  **Features the Example Must Lack:**
  1.  **Visible Feedback:** You do not know the total load when you submit. This prevents the argument that "I would have stopped if I knew."
  2.  **Coordination Mechanisms:** There is no voting or agreement process. This isolates the causal structure from institutional design.
  3.  **Linear Scaling:** The harm does not increase with your contribution (1 core vs. 100 cores causes the same crash). This prevents "marginal harm" calculations.

  **How it Illustrates the Distinction:**
  *   **Actual Redundancy:** In the actual world (10,005 cores), removing your core leaves 10,004. The crash still happens. You are causally inert regarding the outcome.
  *   **Counterfactual Fragility:** In a "nearby" possible world (e.g., one other user's script fails, or network latency drops two requests), the total is 10,000. In *that* world, you are the 10,001st core. You are the necessary link that tips the system. The system is *fragile* to your presence because you occupy a slot that is pivotal in a significant subset of the modal neighborhood.

  ## 3. Misconception Map
  The audience is technically fluent; they will try to solve this with probability or systems theory. You must intercept these moves.

  | Misconception | When it Surfaces | The Precise Move to Head It Off |
  | :--- | :--- | :--- |
  | **1. "This is just Small-Probability EV."**<br>*(Audience thinks: "You're just saying P(pivotal) > 0, so EV > 0.")* | During the **Immediate Follow-up** when defining Modal Robustness. | **The Structural Move:** Explicitly state: "EV asks *how likely* it is that I am pivotal. Fragility asks *what kind of causal role* I occupy across the set of worlds." Emphasize that even if $P(\text{pivotal})$ is low, the *type* of causation (being a potential necessary link) differs from standard risk cases (like buying a lottery ticket that might save a life). The objection is about the *nature* of the causation, not the *magnitude*. |
  | **2. "Institutional Mediation Moots Causation."**<br>*(Audience thinks: "The cluster admin set the limit; they caused the harm, not me.")* | During the **Prerequisite** phase when discussing Actual-World Overdetermination. | **The Causal Chain Move:** Distinguish *triggering* from *structuring*. Acknowledge the admin set the rules, but assert that the *physical harm* (overheat) is caused by the aggregate load. Use the analogy of a speed limit: the government sets the limit, but the driver causes the crash by exceeding it. Keep the focus on the physical causal chain (cores $\to$ heat $\to$ failure), not the normative chain. |
  | **3. "This is an Epistemic Problem."**<br>*(Audience thinks: "I just don't *know* if I'm the 10,000th user.")* | During the **Fragility** definition when discussing "Nearby Possible Worlds." | **The Modal Move:** Correct the terminology. "This is not about your *knowledge* (epistemic); it is about the *metaphysics* (modal). Even if an omniscient observer knew you were the 10,001st user in the actual world, you are still the 10,000th user in nearby worlds. The fragility exists regardless of your ignorance. We are mapping the territory, not your map of the territory." |

  ## 4. Check-for-Understanding Question
  Do not ask a question about whether they should act (normative). Ask a question about the causal structure (descriptive/modal).

  **The Question:**
  > "Consider two worlds. In **World A**, you submit your job and the total load is exactly 10,000 (the threshold). The cluster crashes. In **World B**, you submit your job and the total load is 10,050. The cluster crashes.
  >
  > In World A, you are clearly pivotal. In World B, you are actually redundant.
  >
  > **If the system's load distribution is identical in both worlds (i.e., the probability of being near the threshold is the same), does the *Counterfactual Fragility* account assign you the same degree of causal responsibility in World B as in World A? Why or why not?**"

  **Diagnosis:**
  *   **Failure (Scale/Actualist View):** They say "No, in World B I didn't matter because the crash happened anyway." (They are stuck in Actual-World Redundancy).
  *   **Failure (EV View):** They say "It depends on the probability of the load being lower." (They are stuck in Epistemic/EV reasoning).
  *   **Success (Modal-Structure View):** They say "Yes (or nearly yes), because my *structural role* as a potential necessary link is identical in both worlds. The fragility of the system to my participation hasn't changed, even if the actual outcome was overdetermined in World B."

  ## 5. Exclusions
  To maintain focus on the modal-structure problem, you must explicitly exclude the following topics.

  1.  **Threshold Deontology:**
      *   *What it is:* The normative theory that harm becomes permissible/impermissible at certain numbers.
      *   *Why omit:* This is a *normative* solution to the problem. Your session is about the *metaphysical/causal* structure of the objection. Introducing deontology shifts the debate to "what should we do" rather than "how does causation work here," which invites moral intuition pumping rather than structural analysis.
  2.  **Institutional-Design Literature:**
      *   *What it is:* Solutions like "change the protocol to prevent overloads."
      *   *Why omit:* This solves the *practical* problem but bypasses the *philosophical* one. If you discuss design, the audience will disengage from the inefficacy objection by saying "We just need better systems." You need them to sit with the tension of individual causation in *current* imperfect systems.
  3.  **Formal Game-Theoretic Models (e.g., Nash Equilibria):**
      *   *What it is:* Modeling agents as strategic players optimizing utility.
      *   *Why omit:* Game theory focuses on *strategy* and *equilibrium*. Your goal is to teach *causation* and *modality*. Game theory often assumes agents are distinct strategic entities, whereas the Fragility argument relies on agents being interchangeable units in a causal stack. Introducing payoff matrices will distract from the modal topology of the causal network.
