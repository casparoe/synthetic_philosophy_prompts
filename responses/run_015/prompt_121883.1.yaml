answer: |-
  There is no standard technical term for this specific structural distinction, so it should be formalized as **Constructive versus Subtractive Conceivability.**

  While existing literature distinguishes between *negative* conceivability (not ruled out a priori) and *positive* conceivability (constructing a coherent scenario), this binary fails to capture the asymmetry you identified because philosophers like Chalmers classify both Twin Earth and Zombies as "positively conceivable." Your distinction cuts deeper into the *mechanics* of the scenario construction. **Constructive Conceivability** (Twin Earth) requires the philosopher to build a model where a specific causal role is filled by a different substrate (XYZ fills the water-role); coherence is tested by the viability of the substitute. **Subtractive Conceivability** (Zombies) requires the philosopher to remove a property while asserting the causal network remains intact; coherence is tested by the assumption that the removed property is causally inert.

  The boundary becomes fuzzy in three key areas. First, with **mathematical or logical truths**, neither applies cleanly because you cannot constructively model 2+2=5 nor subtractively remove the necessity without collapsing the system. Second, with **functional properties**, subtractive conceivability fails; you cannot subtract "digestion" from a stomach while keeping the body nourished unless you construct a substitute mechanism, turning it back into a constructive case. Third, with **gradual properties** like pain or consciousness, it is unclear where subtraction ends and dysfunction begins; if you subtract "qualia" but keep "pain behavior," have you subtracted a property or merely renamed the functional state?

  Treating these moves as epistemically equivalent is a mistake because they carry different burdens of proof. Constructive conceivability demands positive evidence of coherence (showing how XYZ works), whereas subtractive conceivability often relies on an ignorance premise (assuming nothing breaks if we remove consciousness). In debates about physicalism, subtractive conceivability frequently begs the question: asserting that consciousness can be removed without physical change presupposes that consciousness does no physical work, which is the very point in dispute. Constructive arguments avoid this by engaging directly with causal roles, making them robust where subtractive arguments are merely assertive.
