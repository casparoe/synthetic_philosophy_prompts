  # Methods Appendix: The Collapse Diagnostic Instrument

  ## I. The Logical Space

  Before applying the instrument, the axes defining the conceptual space must be fixed. These axes determine which theoretical position (Leaf) a researcher occupies based on how they weight empirical evidence.

  **Axis 1: Subject.** What is the primary bearer of the predicate "collapse"?
  *   *Options:* Institution (State), Demography (Population), Complexity (Energy/Monumentality), Legibility (Information/Bureaucracy).

  **Axis 2: Normativity.** Must the change be negative, and for whom?
  *   *Options:* Elite (Loss of power), Median (Loss of wellbeing), Future (Loss of potential), Neutral (Descriptive only).

  **Axis 3: Rate.** Does speed determine category?
  *   *Options:* Catastrophic (<50 years), Gradual (>150 years), Irrelevant.

  **Axis 4: Agency.** Does intent matter?
  *   *Options:* Imposed/Unintended, Chosen/Welcomed, Irrelevant.

  **Axis 5: Reversibility.** Does recovery negate the label?
  *   *Options:* Permanent, Temporary (Cyclical), Irrelevant.

  **Axis 6: Boundedness.** What is the unit of analysis?
  *   *Options:* Discrete Polity, Network/Region, Irrelevant.

  ### The Theoretical Leaves
  These positions occupy the logical space defined above. Each carries a specific commitment regarding what constitutes "collapse."

  1.  **Institutional-Minimalist:** Collapse is strictly the discontinuity of the central governing apparatus (e.g., palace, capital).
      *   *Awkward Commitment:* Must classify a benevolent annexation where taxes continue but the king is gone as a "collapse."
  2.  **Demographic:** Collapse is defined by significant population decline or replacement, regardless of political continuity.
      *   *Awkward Commitment:* Must classify a high-mortality plague that leaves institutions intact as a "collapse," but a total revolution with no deaths as "transformation."
  3.  **Complexity-Loss:** Collapse is a reduction in energy capture, monumentality, or specialization (marginal returns).
      *   *Awkward Commitment:* Must classify a voluntary simplification of lifestyle that improves health as a "collapse."
  4.  **Legibility-Loss:** Collapse is the loss of the state's capacity to describe and track its population (literacy, archives, standardization).
      *   *Awkward Commitment:* Must classify a society that becomes richer and healthier but stops writing as a "collapse."
  5.  **Evaluativist:** Collapse requires a normative decline in human wellbeing (health, violence, security).
      *   *Awkward Commitment:* Cannot describe a "successful collapse" where elites fall but the median person thrives.
  6.  **Transformationist:** The term "collapse" is a misnomer for reorganization; systems never end, they only change state.
      *   *Awkward Commitment:* Must describe total depopulation or genocide as merely "reorganization."
  7.  **Eliminativist:** The category "collapse" does no comparative work and should be discarded for precise variables.
      *   *Awkward Commitment:* Loses the heuristic power to group disparate cases of systemic failure under one research program.

  ---

  ## II. Rate vs. Evaluative Axis Assessment

  **Verdict:** The axes are logically independent but empirically entangled.
  **Restructuring:** I have kept them separate (Axis 2 and Axis 3) because a slow decline can be normatively worse than a sudden shock (e.g., a century of famine vs. a single earthquake). However, in common usage, "collapse" implies rapidity. If you treat Rate as *definitional* (it must be fast to be a collapse), Axis 3 collapses into Axis 2 (fast bad things). If you treat Rate as *descriptive* (how fast did the bad thing happen?), they remain distinct. This instrument treats them as distinct to test whether your definition requires speed *or* suffering.

  ---

  ## III. The Diagnostic Instrument

  **Instructions:** For the case you are analyzing, select the option that best matches the empirical profile. Do not select based on whether you *want* to call it a collapse; select based on the archaeological/historical evidence. The Answer Options reference standard and idealized cases to anchor the definitions.

  **Q1. Primary Discontinuity (Subject)**
  What is the most abrupt and total break in the material record?
  *   A) Governing institutions cease function (Schematized LBA Palaces).
  *   B) Monumental production and long-distance exchange stop, but people remain (Schematized Maya Lowlands).
  *   C) Population density drops sharply, regardless of politics (Schematized Rapa Nui).
  *   D) Administrative legibility vanishes (archives/taxation stop), even if local order persists.

  **Q2. Population vs. Administration (Invented Case 1)**
  How do demography and bureaucracy relate?
  *   A) Population persists, administration vanishes.
  *   B) Administration persists, but the entire population is replaced over two generations (Invented: Admin Continuity/Pop Replacement).
  *   C) Both persist with minor disruption.
  *   D) Both vanish concurrently.

  **Q3. Surplus and Sovereignty (Invented Case 2)**
  What happens to the flow of resources?
  *   A) Local production collapses.
  *   B) Production continues intact, but the surplus is redirected to a neighboring polity; locally, nothing changes except who receives the tax (Invented: Absorbed Intact).
  *   C) Surplus is distributed more evenly locally.
  *   D) Surplus production ceases entirely.

  **Q4. Wellbeing Indicators (Evaluative)**
  What do skeletal and settlement data say about the median person?
  *   A) Health, life expectancy, and violence indicators worsen.
  *   B) Indicators remain stable.
  *   C) Complexity and monumentality drop sharply, but health and life expectancy improve (Invented: Complexity Drop/Health Improve).
  *   D) Indicators are unavailable.

  **Q5. Internal vs. External View (Invented Case 4)**
  How is the change described by contemporaries?
  *   A) External observers file it as a catastrophe; participants describe the change in celebratory terms (Invented: Celebratory Internal/Catastrophic External).
  *   B) Both observers and participants describe it as a catastrophe.
  *   C) Both describe it as a renewal.
  *   D) No textual evidence exists.

  **Q6. Rate of Change**
  Over what timeframe does the primary discontinuity occur?
  *   A) Less than 50 years (Catastrophic).
  *   B) 50 to 150 years (Transitional).
  *   C) More than 150 years (Gradual).
  *   D) Punctuated (Periods of stability interrupted by shocks).

  **Q7. Reversibility**
  Does the system return to a comparable state of complexity?
  *   A) No, the change is permanent.
  *   B) Yes, comparable complexity reassembles a few centuries later.
  *   C) Yes, but in a fundamentally different form (network vs. polity).
  *   D) Unknown.

  **Q8. Boundedness**
  What is the spatial unit of the change?
  *   A) A discrete polity with clear borders.
  *   B) A network or region where "society" was never a discrete thing.
  *   C) A single site or city.
  *   D) A cultural style area regardless of politics.

  ---

  ## IV. Scoring Key and Mapping

  To determine your **Verdict** (Collapse, Transformation, or N/A) and your **Theoretical Position** (Leaf), match your answer pattern below.

  **Step 1: Determine Theoretical Position**
  *   **If Q1=A and Q2=A:** You are an **Institutional-Minimalist**.
  *   **If Q1=C and Q2=D:** You are a **Demographic** theorist.
  *   **If Q1=B and Q4=C:** You are a **Complexity-Loss** theorist.
  *   **If Q1=D and Q2=B:** You are a **Legibility-Loss** theorist.
  *   **If Q4=A and Q5=B:** You are an **Evaluativist**.
  *   **If Q7=B and Q1=A:** You are a **Transformationist**.
  *   **If Q8=B and Q1=A:** You are leaning toward **Eliminativist** (unit problem).

  **Step 2: Determine Verdict**
  *   **Verdict: COLLAPSE.**
      *   *Criteria:* (Institutional-Minimalist + Q1=A) OR (Demographic + Q1=C) OR (Complexity-Loss + Q1=B) OR (Evaluativist + Q4=A).
      *   *Note:* If you answered Q4=C (Health Improve) but Q1=B (Complexity Drop), and you still vote Collapse, you are a Complexity-Loss theorist. If you vote Transformation, you are an Evaluativist.
  *   **Verdict: TRANSFORMATION.**
      *   *Criteria:* (Q7=B) OR (Q3=B [Absorbed Intact]) OR (Q5=A [Celebratory Internal]).
      *   *Note:* This verdict dominates if Agency (Q5) or Reversibility (Q7) is prioritized over Subject (Q1).
  *   **Verdict: CATEGORY N/A.**
      *   *Criteria:* (Q8=B [Network]) OR (Eliminativist Position).
      *   *Note:* If the unit cannot be bounded, the predicate "collapse" cannot apply.

  ---

  ## V. Unoccupied Cells in the Logical Space

  The following combinations of Axis values are theoretically possible but remain unoccupied in current literature.

  1.  **Cell: Demographic Collapse + Institutional Continuity + Health Improvement.**
      *   *Diagnosis:* **Incoherent.** If the population collapses but the state survives and the survivors are healthier, the normative and structural markers contradict the label "collapse." This is usually labeled "Consolidation" or "Crisis," never Collapse.
  2.  **Cell: Slow Rate (>150 yrs) + Catastrophic Evaluation + Institutional Continuity.**
      *   *Diagnosis:* **Unattractive.** While empirically possible (a slow rot), archaeologists reserve "Collapse" for breakpoints in seriation. This cell is occupied by the term "Decline," suggesting "Collapse" is lexically bound to Rate, not just Normativity.
  3.  **Cell: Network Unit + Reversible Change + Elite Loss.**
      *   *Diagnosis:* **Unexplored.** Most network theories emphasize resilience (no collapse). A position arguing that a *network* can *collapse* (not just reconfigure) and then *reappear* identically is rare, as networks are defined by flow, not state.

  ---

  ## VI. Indistinguishable Leaves

  The instrument cannot separate the following pairs without further questioning.

  **1. Institutional-Minimalist vs. Legibility-Loss**
  *   **Assessment:** These are functionally identical in the archaeological record. The "governing apparatus" (Institutional) is almost always accessed via "archives and tax systems" (Legibility).
  *   **Resolution:** To separate them, you would need a case where bureaucracy vanishes but coercion remains (e.g., oral tribute extraction). Without that specific empirical scenario, these are the same position under two descriptions.

  **2. Transformationist vs. Eliminativist**
  *   **Assessment:** Both reject the label "Collapse" for any given case. The Transformationist says "It is reorganization"; the Eliminativist says "The word is useless."
  *   **Resolution:** The practical output for the dissertation chapter is identical (do not use the term "collapse"). The distinction is purely meta-theoretical and does not affect the sorting of concrete cases. Treat them as a single "Anti-Collapse" family for the purposes of this typology.

  **3. Complexity-Loss vs. Evaluativist (Specific Conflict)**
  *   **Assessment:** If Q1=B (Monuments stop) and Q4=C (Health improves), Complexity-Loss says "Collapse," Evaluativist says "Improvement."
  *   **Resolution:** The instrument *does* separate them here (see Scoring Key Step 2). However, if Q4=D (Indicators unavailable), the two positions collapse into one another, as Complexity becomes the proxy for Wellbeing. If your case lacks bioarchaeological data, you cannot distinguish these positions.
