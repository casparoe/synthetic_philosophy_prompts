      *   *(6) vs. (2):* (6) says demography is indispensable because testimony fails for efficient killing. (2) relies on demography for the "one currency." But (6) also says testimony is needed for "what the loss was like." If (2) is true (death is the currency), do we need testimony for the *ranking*? Or just for the *obscenity check*?
