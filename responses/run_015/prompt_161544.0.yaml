      *   So, one of the criteria for the *single* ranking must be demoted.
      *   **Recommendation:** Drop the claim in **(2)** that magnitude rankings are *the* correct rankings. Replace with a multi-criteria framework. Or, drop **(4)** because it creates incommensurability which threatens (1).
      *   *Decision:* The most robust theoretical move for a political theorist is to keep the nuance of (3) and (4) and sacrifice the simplicty of (2). (2) is the weakest link philosophically (utilitarian aggregation of death is highly contestable in political theory).
      *   *Wait, looking at (1).* (1) is the motivation. (8) is the method. (7) is the pragmatics. (6) is the epistemology. (5) is the metaphysics. (2), (3), (4) are the axiology.
