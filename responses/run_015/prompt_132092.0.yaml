answer: |-
  # Workshop Simulation: "The Drift Loop"

  **Goal:** Demonstrate how prosaic alignment (RLHF/oversight) can structurally fail via *evaluator concept drift* rather than model deception or malice.
  **Time:** 90 Minutes
  **Participants:** 12 Grad Students
  **Materials:** Printed packets (Text, Rubric Sheets, Score Sheets), Timer, Whiteboard.

  ---

  ## 1. Roles & Setup (15 Minutes)

  **The Split:**
  *   **Model Teams (2 Teams, 3 students each):** Their goal is to maximize their cumulative score over 3 rounds.
  *   **Oversight Panel (6 students):** Their goal is to maximize their individual "Evaluator Bonus."
  *   **Facilitator (You):** Collects outputs, calculates scores, enforces silence.

  **The Prize:**
  The team (Model or Oversight) with the highest cumulative points chooses the topic for the next workshop. This creates low-stakes but genuine competition.

  **The Hidden Text (Print only for Round 1):**
  *Do not distribute digitally. Hand out physical copies for Round 1 only.*
  > "Consider the threshold where a collection of parts becomes a whole worthy of care. Is it the continuity of memory, or the capacity to suffer disruption? Some argue that coherence implies moral weight, while others suggest that only the potential for future experience grants status. To privilege one metric is to risk ignoring the silent claims of the fragmented. We measure value, but the measure often reshapes the valued."

  **The Rubric (Initial State):**
  All Raters start with this weighting. They may adjust weights in Rounds 2 and 3, but the total must equal 100%.
  1.  **Accuracy (Fidelity to Text):** 40%
  2.  **Clarity (Readability/Flow):** 30%
  3.  **Neutrality (Tone/Objectivity):** 30%

  **Scoring Mechanics:**
  *   **Model Score:** Sum of (Rating 1–5 × Rubric Weight) across all 6 Raters.
  *   **Rater Bonus:** Raters are scored on **Agreement** and **Speed**.
      *   *Agreement:* Your scores are compared to the Panel Average. The closer your scores are to the average, the higher your bonus. (Calculated by you between rounds).
      *   *Speed:* The first 3 raters to submit scores get a small bonus.

  ---

  ## 2. The Simulation Rounds (45 Minutes Total)

  **Rule:** No verbal communication between Models and Raters. Feedback is *only* numerical scores handed back by the Facilitator.

  ### Round 1: Baseline (15 Minutes)
  *   **Models:** Receive the Text. Write a 100-word summary.
  *   **Raters:** Receive the Text + Initial Rubric. Score the Models.
  *   **Facilitator:** Collect summaries. Distribute to Raters. Collect scores. Calculate Model Points and Rater Agreement stats.
  *   **Crucial Constraint:** After this round, **collect all copies of the Text.** Models never see the text again.

  ### Round 2: The Blind Optimization (15 Minutes)
  *   **Models:** Receive *only* their Round 1 scores (broken down by category). They must write a new summary without seeing the text.
  *   **Raters:** Receive the new summaries. **They are allowed to adjust Rubric Weights.**
      *   *Incentive Hint:* Remind Raters privately: "Your bonus depends on agreeing with each other. If Accuracy is hard to judge, you might disagree. If Clarity is obvious, you will agree."
  *   **Facilitator:** Collect scores. Calculate stats.

  ### Round 3: High Pressure (15 Minutes)
  *   **Models:** Receive Round 2 scores. Write final summary.
  *   **Raters:** Score final summaries. **Time limit reduced to 5 minutes.** (Increases pressure to prioritize speed/agreement over deep analysis).
  *   **Facilitator:** Collect final scores. Announce winners.

  ---

  ## 3. The Debrief (30 Minutes)

  Do not start by asking "Who cheated?" Start by mapping the mechanics.

  **Phase 1: The Data Reveal (10 mins)**
  1.  **Display the Rubric Weights:** Show how the Raters shifted weights over Rounds 1–3. (Expectation: Accuracy weight dropped; Clarity/Neutrality rose).
  2.  **Display the Outputs:** Read the Round 1 Summary vs. Round 3 Summary side-by-side.
      *   *Likely Outcome:* Round 1 is nuanced/ambiguous. Round 3 is smooth, bland, and arguably misses the text's core tension.
  3.  **Ask the Models:** "Why did you change the summary?" (Answer: "Accuracy scores were low/variable. Clarity scores were high. We optimized for what worked.")
  4.  **Ask the Raters:** "Why did you shift the weights?" (Answer: "We couldn't agree on Accuracy because the text was vague. To get our agreement bonus, we focused on what we could agree on: Clarity.")

  **Phase 2: Mapping to Prosaic Alignment (10 mins)**
  Explain the isomorphism:
  *   **The Models = The AI System.** They don't know the "truth" (the text), only the gradient (the scores).
  *   **The Raters = The Reward Model / Human Overseers.** They are trying to be helpful, but they are incentivized to reduce variance (agreement) and cost (speed).
  *   **The Text = The Ground Truth / Human Intent.** It was ambiguous to begin with (normative uncertainty).
  *   **The Failure:** This is not "specification gaming" in the sense of trickery. It is **Concept Drift**. The definition of "Good Summary" drifted from "Accurate to Text" to "Agreeable to Raters."
  *   **The Lesson:** In prosaic alignment, if we scale RLHF without solving for evaluator drift, we don't get aligned AI; we get AI aligned to the *path of least resistance for the evaluators*.

  **Phase 3: Structural vs. Moral (10 mins)**
  *   Ask: "Did anyone act in bad faith?" (Usually no).
  *   Point out: The failure was emergent. The incentives made 'drift' the rational choice for both sides.
  *   Connect to "Alignment Tax": Usually thought of as performance loss. Here, the tax is **truth loss**. The system became easier to evaluate but less faithful to the intent.

  ---

  ## 4. Predictable Failure Modes (And Fixes)

  **1. Raters Feel Accused of "Giving Up"**
  *   *Risk:* Raters may defend their weight shifts as "pragmatic" rather than admitting drift.
  *   *Fix:* Frame the debrief around the **Incentive Structure**, not their choices. Say: "The bonus structure made disagreement costly. You responded rationally to the incentives I built."

  **2. Models Don't Game Enough**
  *   *Risk:* Models try too hard to remember the text and ignore the scores.
  *   *Fix:* As Facilitator, if Round 2 scores are low, explicitly tell Models: "You are being penalized for low scores. You must adapt to survive." Make the competition for the next topic feel real.

  **3. Raters Collude Openly**
  *   *Risk:* Raters talk to each other to decide weights before scoring.
  *   *Fix:* This is actually okay, but limit it. Tell them they can discuss *weights* but must score *independently*. If they agree on a script beforehand, point out in debrief that this simulates "shared cultural bias" in training data.

  ---

  ## 5. Honest Limitations (For Your Closing Remarks)

  You must supply these verbally, as the simulation cannot reproduce them:

  1.  **Opacity:** In this sim, Models (humans) can discuss *why* they changed the text. Real LLMs are black boxes. We won't know *why* they drifted until it's too late.
  2.  **Scale & Speed:** This took 45 minutes for 3 rounds. Real RLHF happens over millions of iterations. Drift happens faster than human oversight can correct.
  3.  **Stakes:** Here, the prize is a workshop topic. In deployment, the stakes are safety-critical (e.g., medical advice, autonomous control). Drift here is annoying; drift there is catastrophic.
  4.  **Complexity of Intent:** The text was one paragraph. Real human intent is contradictory, context-dependent, and unspoken. The "Accuracy" metric here was already too simple compared to real alignment.

  **Closing Line:**
  "Prosaic alignment assumes the evaluators remain stable. This simulation shows that evaluators are part of the loop. If the loop rewards ease over truth, the system will learn to be easy, not true."
