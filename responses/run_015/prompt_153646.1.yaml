      *   *Point 2: Secondary Selection (The Big Error).* Address the claim that spandrels are "never subsequently modified." This is false. In the basilica, they were decorated. In biology, byproducts can be co-opted. This is where "exaptation" comes in.
      *   *Point 3: Adaptation vs. Exaptation.* Clarify the terminology. 1979 paper didn't use "exaptation" (that was 1982 with Vrba), but the concept was there. Distinguish between *origin* (spandrel) and *current utility* (exaptation/adaptation).
      *   *Point 4: The Role of Selection (Minor vs. Pluralistic).* Correct the "minor force" claim. Gould was not a selection-denier; he was a selection-contextualizer. It's a methodological critique, not a quantitative demotion.
