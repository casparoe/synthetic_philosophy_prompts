  2.  **Recall/Verify Knowledge of Gould & Lewontin (1979):**
      *   *Core Argument:* Critique of "adaptationism" (the tendency to assume every trait is an optimal product of natural selection).
      *   *The Spandrel Analogy:* Architectural byproducts (triangular spaces) necessary for supporting the dome, later decorated. Analogy: Biological traits arising from developmental/architectural constraints, not directly selected for initially.
      *   *Selection's Role:* They did *not* deny selection is important. They denied it is the *only* or *dominant* explanation for *every* trait. They argued against the "Panglossian Paradigm" (everything is for the best).
      *   *Spandrels vs. Exaptation:* "Exaptation" is a term coined later (Gould & Vrba, 1982), though the concept is present in the 1979 paper. A spandrel is the *origin* (non-adaptive byproduct). If it gets used, it becomes an exaptation.
      *   *Secondary Selection:* Can spandrels be modified later? Yes. Gould and Lewontin acknowledged that once a byproduct exists, selection can act on it. The summary claim that they are "never subsequently modified" is suspicious.
