answer: |-
  Your skepticism is well-founded. The summary you encountered captures the *rhetorical spirit* of Gould and Lewontin's 1979 paper, *"The Spandrels of San Marco and the Panglossian Paradigm,"* but it hardens their methodological warnings into rigid biological laws and misrepresents key aspects of their argument regarding natural selection and subsequent modification.

  Your intuition is correct: the summary conflates the **origin** of a trait with its **subsequent utility**, and it mistakes a critique of scientific *method* for a claim about evolutionary *mechanisms*.

  Here is an assessment of what is accurate, what is a simplification, and what is a misrepresentation in that summary.

  ### 1. The Spandrel Analogy: Accurate
  **Summary Claim:** *Spandrels are inevitable structural byproducts of other adaptive architectures, arising from geometric or developmental constraints.*
  **Verdict:** **Accurate.**
  This is the core of Gould and Lewontin's argument. They used the architectural spandrel (the triangular space necessitated by placing a dome on rounded arches) to illustrate that not every feature of an organism is built *for* a specific purpose. Some features are unavoidable physical or developmental consequences of building a body plan in a certain way. In the basilica, the spandrels were not built to hold mosaics; they existed because the dome required support. Similarly, in biology, certain traits (like the redness of blood or the male nipple) may exist due to developmental constraints rather than direct selection for that specific trait.

  ### 2. Secondary Selection: Misrepresented
  **Summary Claim:** *Because these spandrels arise from constraints, they are **never subsequently modified by selection**.*
  **Verdict:** **Inaccurate.**
  This is the most significant error in the summary. Gould and Lewontin explicitly acknowledged that once a spandrel (a byproduct) exists, it *can* become subject to natural selection.
  *   **In Architecture:** The architects of San Marco did not build the spandrels to hold art, but once the spaces existed, they were *subsequently* decorated with mosaics. The space was co-opted.
  *   **In Biology:** Gould and Lewontin argued that a trait originating as a non-adaptive byproduct can later be co-opted for a useful function. They did not claim selection stops acting on them; they claimed selection did not *create* them.
  *   **The Error:** By stating they are "never subsequently modified," the summary implies spandrels remain evolutionarily inert. Gould and Lewontin argued the opposite: that adaptationists fail to see the *origin* is non-adaptive, even if the *current utility* is high.

  ### 3. Exaptation vs. Adaptation: Anachronistic but Conceptually Close
  **Summary Claim:** *Any usefulness they later acquire should be classified as "exaptation" rather than as true adaptation.*
  **Verdict:** **Conceptually Accurate, Terminologically Anachronistic.**
  *   **Terminology:** The term "exaptation" was not coined in the 1979 paper. Gould and Lewontin used the phrase "co-opted characters." The term "exaptation" was formally defined by Gould and Elisabeth Vrba in a **1982** paper (*"Exaptation—A Missing Term in the Science of Form"*). Popular summaries often retroactively apply the 1982 term to the 1979 argument.
  *   **Concept:** The distinction is valid. An **adaptation** is a trait shaped by natural selection *for* its current function. An **exaptation** is a trait that currently serves a function but arose for a different reason (or no reason, i.e., a spandrel).
  *   **Nuance:** The summary implies a binary where exaptations "don't count" as adaptations in any meaningful sense. Gould and Lewontin's point was historical, not functional. An exaptation can be just as functionally vital as an adaptation; the distinction matters for understanding *evolutionary history*, not necessarily current survival value.

  ### 4. The Role of Natural Selection: Overstated Dismissal
  **Summary Claim:** *Their essay... [shows] that natural selection is a relatively minor evolutionary force compared to internal structural and developmental constraints.*
  **Verdict:** **Misrepresentation.**
  This turns a methodological critique into a quantitative claim, which is a common caricature of Gould's work.
  *   **Method vs. Mechanism:** The 1979 paper is a critique of the **adaptationist programme** (a style of research), not a denial of natural selection's power. They argued that scientists were too quick to assume selection was the *only* cause, creating "just-so stories" without testing alternatives (like drift or constraint).
  *   **Pluralism, not Demotion:** Gould and Lewontin advocated for **pluralism**. They wanted constraints, drift, and selection to be weighed against each other. They did not argue that selection is "minor"; they argued that its dominance was assumed *a priori* rather than demonstrated *a posteriori*.
  *   **Optimality:** They definitely argued against the idea that organisms are "optimally engineered" (the Panglossian Paradigm). They accepted that selection produces fit organisms, but denied that every feature is optimized.

  ### 5. Summary Assessment
  The summary you read is a **pedagogical caricature**. It captures the famous metaphor (spandrels) and the general skepticism toward "just-so stories," but it fails on the technical mechanics of evolution.

  | Claim in Summary | Verdict | Correction |
  | :--- | :--- | :--- |
  | **Spandrels are structural byproducts.** | **Accurate** | This is the correct definition of the analogy. |
  | **Spandrels are never modified by selection.** | **False** | They can be co-opted and refined by selection after originating as byproducts. |
  | **Later usefulness = Exaptation.** | **Mostly Accurate** | Conceptually correct (co-option), though the term came later (1982). |
  | **Selection is a "minor" force.** | **False** | They argued selection is over-used as an *explanation*, not that it is a weak *force*. |
  | **Organisms are not optimally engineered.** | **Accurate** | This is a central thesis: constraints prevent perfect optimization. |

  ### Conclusion
  Your worry that the summary "conflates spandrels with exaptations" and "presents a methodological warning... as a quantitative claim" is correct.

  Gould and Lewontin did not deny that spandrels could be secondarily shaped by selection; in fact, the architectural analogy relies on the fact that they *were* decorated (selected/culturally modified) after construction. They did not deny that exaptations are functionally important; they denied that functional importance proves adaptive *origin*.

  A fair summary would read:
  > "Gould and Lewontin argued that not all traits are direct products of natural selection; some are inevitable byproducts (spandrels) of developmental constraints. While these traits may later be co-opted for useful functions (exaptations) and refined by selection, assuming they were selected *for* that function from the start leads to erroneous 'just-so stories.' Their goal was not to diminish the power of selection, but to demand rigorous testing of adaptive hypotheses against alternatives like constraint and drift."

  The popular summary you found sacrifices this nuance for a punchier, albeit misleading, narrative that sounds like Gould was a selection-denier rather than a selection-contextualizer.
