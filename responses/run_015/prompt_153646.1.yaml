      *   *Claim 3: Usefulness later acquired = Exaptation, not Adaptation.* -> **Mostly Accurate (terminologically), but nuanced.** "Adaptation" refers to the *process* or the *state* resulting from selection for that specific function. If it wasn't selected *for* originally, it's not an adaptation in the historical sense, but it can become one later. The term "exaptation" came later (1982) to clarify this.
