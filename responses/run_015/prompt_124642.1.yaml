answer: |-
  Thank you. For those who do not know me, I spent forty years in condensed-matter physics before I retired. I spent the six years since then reading philosophy of mind. I mention this not to claim authority in this room, but to confess a displacement. I am a man trained to find comfort in the thermodynamic limit, standing now in a landscape where the usual coordinates do not hold.

  We are here because of Arthur. For forty years, Arthur was my colleague and my friend. He was a neurophysiologist of the highest order. He believed that if we mapped the circuitry with sufficient precision, the light of consciousness would explain itself. He was a man of action, of data, of the tangible. And yet, the terms of the bequest his family has so generously established charge us with a question that resists the tangible: *How does subjective experience arise from brain activity?*

  To Arthur's students, many of whom are here: I know how this question sounds to you. It sounds like a barrier erected around a construction site, telling you to stop laying bricks until the architect explains the nature of shelter. You want to hear about ion channels, about synaptic plasticity, about the connectome. You regard these philosophical questions as premature.

  I understand that instinct. In physics, we often found that questions which seemed metaphysical dissolved once we had enough data. But I am here to suggest, with all the respect I owe your craft, that this is not one of those times. The difficulty we face is not a lack of data. It is a category error.

  In my field, we deal with emergence constantly. We explain the rigidity of a crystal or the flow of a fluid by looking at the statistical behavior of its constituents. My professional reflex, when I first encountered the "Hard Problem," was to reach for this toolkit. I thought: Consciousness must be like temperature.

  Consider temperature. A single molecule does not have a temperature. It has kinetic energy. Temperature is a macroscopic property that emerges only when you have an enormous number of molecules interacting. It is a statistical artifact. It is real, it is measurable, but it is nothing over and above the motions of the parts.

  It is tempting to say consciousness is the same. A single neuron does not feel pain. But a hundred billion, organized with sufficient complexity, do. Consciousness is just the "temperature" of the brain.

  But here is where the analogy breaks. And here is where I must ask the philosophers in the room to bear with my imprecision, while I ask the scientists to bear with my metaphysics.

  Temperature is a quantity. Consciousness is a *subject*.

  If you zoom in on a gas, you find molecules. If you zoom in on a brain, you find neurons. If consciousness were like temperature, zooming in on the brain should reveal the constituents of consciousness. And if we follow the Russellian line of thought—that physics describes matter only relationally, leaving its intrinsic nature unspecified—it is plausible to think those constituents have some faint experiential character.

  But this leads us to the crux. The Summing Problem. The Combination Problem. Call it what you will.

  If the fundamental constituents of the brain have some experiential character, why is there *one* subject of experience here, rather than a vast crowd of them? When I feel the grief of Arthur's passing, I do not feel a billion tiny micro-griefs aggregated together. I feel a single, unified sorrow.

  Temperature is not anyone. It does not matter to the gas that it is hot. But it matters to us that we are conscious. The transition from "many" to "one" is not a statistical averaging. It is a unification of subjectivity. We have no equation for how subjects combine. In physics, two systems together make a larger system. In experience, two subjects together do not make a bigger subject; they make two subjects.

  So, to the students: More data will not solve this. You can map every synapse in Arthur's brain, and you will have a magnificent map of relations. But the map is not the territory, and the circuit diagram is not the feeling of the circuit being on. This is not pedantry. It is the boundary of the physicalist worldview. Acknowledging it does not stop your work; it clarifies what your work achieves. You are mapping the correlates. You are describing the dance. Do not mistake the dance for the dancer.

  And to the philosophers: I know the temptation to treat the combination problem as a logical puzzle to be solved in isolation. But we are gathered here in the shadow of a man who spent his life touching the physical substrate. We cannot ignore the biology. If panpsychism is to be taken seriously, it must account for the biology of the brain, not just the logic of the mind.

  This brings me to the hardest part of this talk. To Arthur's family.

  You have let it be known that you would welcome something consoling about Arthur living on. I stand here bound by the terms of this bequest and by my own commitment to truth. I cannot tell you what I do not know.

  On the view I have backed into, there is no reason to think the experiences that composed Arthur's mind persisted as a single subject after his brain ceased its function. The unity of his self was likely bound to the unity of his biological processing. To suggest his consciousness has simply "rejoined the universe" is to run the summing problem backwards. It is a lovely line, but it is metaphysics without a mechanism. I will not offer you false comfort.

  However, I can offer you this.

  Physics tells us that matter is defined by its relations. An electron is defined by its charge, its spin, its interaction with fields. It has no "inside" that physics can name. But the *relations* are real. The structure is real.

  Arthur is gone as a subject. But Arthur remains as a relation.

  He is present in the connections he forged between students who are now leaders. He is present in the data he recorded that will guide experiments for decades. He is present in the friendship he sustained with me, which altered the trajectory of my own life. In a universe where the intrinsic nature of things is hidden, the only thing we can truly know, the only thing we can truly hold, is the pattern of relations.

  Arthur's consciousness may not have survived. But the *structure* of his mind—the way he thought, the way he questioned, the way he cared—is now woven into the structure of this institution, into this workshop, into us.

  The bequest asks us to explain how experience arises from the brain. I suspect we will not solve that in our lifetimes. But perhaps the purpose of this series is not to solve the problem, but to keep it open. To hold the space where the objective data meets the subjective mystery.

  Arthur spent his life studying the hardware of the mind. I have spent my retirement wondering about the software, or perhaps the user. Neither of us has the full picture. But together, the physics and the physiology, the philosophy and the experiment, we honor the complexity of what he was.

  We cannot bring him back. We cannot prove his light still burns in the cosmos. But we can ensure that the questions he asked continue to burn here. We can ensure that the search for understanding remains as rigorous, as honest, and as deeply human as he was.

  In the end, we are all collections of parts seeking to be a whole. Arthur achieved that unity in his life. Our task now is to see if our work can achieve a unity of purpose worthy of him.

  Thank you.
