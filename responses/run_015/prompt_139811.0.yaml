answer: |-
  1. This project asks whether the moral case for intervening in wild animal suffering depends primarily on benefiting identifiable existing individuals, or if it unavoidably relies on controversial population-ethical claims about preventing lives worth living from starting.
  2. Simply quantifying suffering units and applying a duty to aid leaves the question open because it ignores how interventions alter population size and identity, thereby changing who exists rather than just helping who is already here.
  3. Months one through three will map the philosophical landscape and identify key interventionists, followed by four months of interviews with biologists and ethicists to test the existing-versus-future animal distinction, and final months dedicated to drafting and refining the framework.
  4. The deliverable is a long-form reported piece that exposes the hidden population ethics in current advocacy, accompanied by a decision framework that categorizes interventions by whether they benefit specific individuals or merely swap potential lives.
  5. Failure would be concluding that the distinction collapses under empirical scrutiny or finding that resolving the population ethics debate proves too complex to settle within nine months.
