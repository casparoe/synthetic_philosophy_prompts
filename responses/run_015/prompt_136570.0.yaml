answer: |-
  This is a sharp framing. "Procedural dormancy" captures the specific tension you're looking at better than the standard "reserve powers" language, which often implies active readiness rather than suspended animation.

  For a three-person, two-year cluster in political theory, you cannot afford to get bogged down in comparative constitutional law. You need to stay upstream, where the conceptual architecture determines how the legal details are interpreted.

  Here is the prioritized agenda, ordered by logical dependency.

  ### Phase 1: The Ontology of the Convention (Months 1–6)
  **Question:** *Is a dormant power a "restricted capacity" or a "fictional capacity"?*

  **Reasoning for Priority:** This is the absolute upstream question. Before you can argue whether these powers are legitimate or dangerous, you must define what they *are* when they aren't being used.
  *   **The Trap:** Legal scholars will tell you these powers exist in statute but are bound by convention. Political scientists will tell you the convention *is* the law.
  *   **The Philosophical Work:** You need to determine the ontological status of the power during dormancy. Is it like a gun in a locked safe (real, dangerous, but contained), or is it like a toy gun (structurally identical but functionally null)?
  *   **Why this reshuffles everything:** If you conclude the power is ontologically "null" due to the strength of the convention, your entire project collapses into a study of symbolism. If you conclude it is "real but restrained," then you have a genuine tension between legal sovereignty and political sovereignty to analyze.
  *   **Tractability:** High. This relies on theories of rules, norms, and institutions (e.g., constitutive vs. regulative rules) rather than digging through Swedish or Japanese parliamentary records.

  ### Phase 2: The Normative Value of Ambiguity (Months 7–12)
  **Question:** *Does the vagueness of the dormancy threshold serve a stabilizing function, or is it an accountability deficit?*

  **Reasoning for Priority:** Once you establish the power is "real," you have to explain *why* it remains dormant rather than being formally abolished.
  *   **The Philosophical Work:** This is a question about political epistemology and stability. Some theorists argue that keeping the rules slightly ambiguous allows the system to absorb shocks that rigid codification would break. Others argue that ambiguity in sovereignty is inherently undemocratic because citizens cannot know the true rules of the game.
  *   **Why this comes second:** You can't judge the value of the ambiguity until you've defined the nature of the power in Phase 1.
  *   **Tractability:** High. You can use thought experiments. Imagine a scenario where the threshold for waking the power is clearly defined vs. undefined. Which leads to more abuse? This is pure theory.

  ### Phase 3: Compatibility with Popular Sovereignty (Months 13–18)
  **Question:** *Does the mere existence of a dormant veto violate the principle of self-rule, even if never exercised?*

  **Reasoning for Priority:** This is the core normative evaluation, but it depends on the previous two phases.
  *   **The Philosophical Work:** This tackles democratic legitimacy. If the people are sovereign, can there be a "backup" sovereign? Does the *possibility* of monarchical intervention chill parliamentary debate or alter the behavior of elected officials (the "shadow effect")?
  *   **Why this comes third:** If Phase 1 determines the power is fictional, this question is moot. If Phase 2 determines the ambiguity is necessary for stability, you have to weigh that stability against the democratic deficit here.
  *   **Tractability:** Medium. This requires rigorous definition of "popular sovereignty." Is it procedural (voting) or substantive (outcome)?

  ### Phase 4: The Breakpoint Scenario (Months 19–24)
  **Question:** *What constitutes a "constitutional emergency" sufficient to wake the dormant power, and who decides?*

  **Reasoning for Priority:** This is the stress test. It is downstream because it only matters if the previous norms fail.
  *   **The Philosophical Work:** This is essentially a theory of exception (similar to Schmitt but domesticated). If the monarch wakes the power, they are claiming to represent the "true" will of the people against the "current" parliament. On what grounds?
  *   **Why this is last:** It is the least tractable and most speculative. It's also the most likely to drift into legal history. Keep this conceptual: focus on the *claim to authority* required to break dormancy, not the historical precedents.

  ---

  ### Identified Dead Ends (Do Not Pursue)

  1.  **Codification Proposals:** Do not spend time arguing whether these powers *should* be written down. That is policy advocacy, not political theory. Your job is to analyze the *effect* of them remaining unwritten/dormant.
  2.  **Comparative Mechanics:** Do not get stuck on the differences between the Japanese Emperor's role and the Swedish King's role. Treat them as data points for the same theoretical model. If you start mapping specific statutes, you become legal historians, not philosophers.
  3.  **The "Tyranny" Scenario:** Do not model scenarios where the monarch becomes a dictator. In modern constitutional monarchies, the military and bureaucracy will not follow those orders. It's a fantasy scenario that wastes theoretical energy. Stick to the *procedural* disruption (e.g., refusing dissolution), not regime change.

  ### The "So What?" Check: Overhyped Implications

  You asked if settling this changes anything for citizens. Here is the hard truth:

  **1. The "Citizen Impact" is mostly negative.**
  Settling the dormancy question will likely confirm that for 99% of citizens, the status of these powers is irrelevant. The overhyped implication is that clarifying these powers would increase democratic engagement. It won't. Citizens do not vote based on reserve powers they hope are never used.
  *   **Advice:** Don't promise your research will show how this empowers voters. It won't.

  **2. The "Safety Valve" is mostly mythical.**
  There is a romantic notion among monarchists that these dormant powers are a "fire extinguisher" for when democracy goes wrong. The theoretical reality is usually the opposite: waking a dormant power is the spark that starts the fire.
  *   **Advice:** Your cluster should probably aim to debunk the idea that dormancy is a functional safety mechanism. It is more likely a "constitutional ghost" that haunts the system.

  **3. The Real Value is Systemic Integrity.**
  The only tangible implication is for the *elites* (PMs, clerks, judges), not the citizens. The dormancy creates a "knowing wink" among the governing class about where the ultimate safety rail is.
  *   **Advice:** Frame your conclusion around **elite accountability** rather than popular sovereignty. The danger of procedural dormancy isn't that the King will rule by decree; it's that the Prime Minister might manipulate the *threat* of the King ruling by decree to bypass normal scrutiny.

  ### Summary of Strategy
  Start with **Ontology**. If you can't define whether the power is "asleep" or "dead," you can't judge its legitimacy. Keep the tools conceptual (norms, rules, sovereignty) to avoid drowning in case law. And be honest in your conclusion: this matters less for the average voter and more for the structural integrity of the executive branch.

  If you resolve Phase 1 cleanly, you might find that "procedural dormancy" is just a polite term for "political obsolescence," which would be a massive, field-shifting conclusion in itself.
