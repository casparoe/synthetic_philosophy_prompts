answer: |-
  The practice strictly presupposes that legal enforceability is not inherent to promising but is a status conferred by specific performative rituals. A promise, in law, is not a moral commitment but a voluntary submission to state power, signaled by form rather than substance. The peppercorn rule confirms this: consideration is not economic value but a cautionary formality. It is the *act* of bargaining, not the *price*, that matters.

  This fits the Formalist view (à la Fuller): consideration, deeds, and your hypothetical registry are functionally identical channeling devices. They distinguish social norms from legal obligations. Therefore, the registry advocate is wrong. They claim the registry captures a "purer" promise, revealing that promising is essentially a transfer of right independent of bargain. But legally, it does not. The registry enforces the same kind of obligation as standard contract: voluntary liability signaled by procedure. The law refuses to enforce bare moral promises because they lack the "channeling" function that warns the promisor and evidences intent. The registry simply provides an alternative channel to the peppercorn. It does not validate the moral promise itself; it validates the *registration* of the promise. Thus, the law presupposes that a promise is only legally real when clothed in state-recognized form.

  However, the practice is underdetermined regarding promissory estoppel. Estoppel enforces promises based on reliance-induced harm rather than formal intent, suggesting a tort-like foundation conflicting with the formalist model. It implies obligation arises from consequences, not just will. This tension leaves the ontology of promising split between "will-based" formalism and "harm-based" reliance. While the registry reinforces formalism, estoppel pulls toward a reliance theory, leaving the core definition of a legal promise unstable.

  I am least confident about whether estoppel ultimately collapses back into formalism, where reliance merely serves as evidence of the promise's seriousness.
