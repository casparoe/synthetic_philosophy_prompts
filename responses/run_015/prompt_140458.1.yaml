          *   Phase 3: Repair/Iteration. Committee told they are losing. Invite repair. Buyout offer. Show defect is a disposition. Elicit decision rule requirements from students. Debrief on averaging vs. majority.
          *   Debrief: Map moments to concepts. Handle predictable failures (spreads, guessing, early spoilers, opt-outs). Address risk neutrality/stakes assumptions.
          *   Limitations: Acknowledge what the session *can't* show (dynamic rationality, diachronic coherence).
          *   Bonus: 20-minute condo board version + one sentence (not "you are being irrational").

