      *   *Tickets:* Need events that sum to more than 1 or less than 1 in a way that creates arbitrage.
      *   *Standard Dutch Book:* $P(A) + P(B) + P(C) > 1$ where $A, B, C$ are mutually exclusive and exhaustive. Or $P(A \cup B) \neq P(A) + P(B)$.
      *   *Simpler approach for class:* Use mutually exclusive events $R, B, G$. If $P(R) + P(B) + P(G) \neq 1$, they are vulnerable.
      *   *Ticket Menu:*
          1.  Ticket R (Pays 10 points if Red).
          2.  Ticket B (Pays 10 points if Blue).
          3.  Ticket G (Pays 10 points if Green).
          4.  Ticket "Not R" (Pays 10 points if Blue or Green).
      *   *The Trap:* If a student prices R at 4, B at 4, G at 4 (Sum = 12 > 10), the House sells them all three. Student pays 12. One wins 10. Net loss 2.
      *   *Alternative Trap:* If they price R at 3, B at 3, G at 3 (Sum = 9 < 10), House buys all three from them for 9. House pays 10. Student loses 1 (opportunity cost/ledger deficit).
      *   *Better Trap for "Feeling":* Use the "Not R" ticket. If $P(R) + P(\text{Not } R) \neq 10$.
      *   *Refinement:* To ensure *everyone* gets trapped without knowing their prices beforehand, I need to guide them toward incoherence without lecturing.
      *   *Strategy:* Use "Brokers." Divide 12 students into 4 groups of 3. Each group has a "House Broker." The Broker visits students.
      *   *Wait, constraint:* "Several students act as separate brokers so that no one sees the full package being assembled."
      *   *Revised Plan:* 12 Students. 3 "House Agents" (rotated from students or TAs? Let's use 3 students rotated as agents to keep it internal). Actually, better: The Instructor is the House, but 3 students act as *clerks* to record prices so the Instructor doesn't look like they are targeting individuals.
      *   *Actually, the prompt asks:* "way of having several students act as separate brokers." Okay. Let's make 3 students the "Market Makers." They circulate.
      *   *The Menu:*
          1.  Ticket $R$ (Pays 10 if Red).
          2.  Ticket $B$ (Pays 10 if Blue).
          3.  Ticket $G$ (Pays 10 if Green).
          4.  Ticket $Any$ (Pays 10 if R, B, or G - i.e., Certainty).
      *   *The Incoherence:* Most people will price $R, B, G$ optimistically (e.g., 4 each = 12) but price $Any$ at 10 (or less). Or they price $R, B, G$ low (3 each = 9) and $Any$ at 10.
      *   *The Mechanism:* Students write prices on a slip. Brokers collect. Instructor calculates the "Book."
      *   *Settlement:* Calculate net position for each student *before* the draw. Show that for some, Loss is guaranteed.
      *   *Staging the Beat:* The "Settlement" must happen visibly. The "Draw" is anticlimactic.
      *   *Risk/Stakes:* Need to assume risk neutrality for the math to hold strictly. Fix: Use small points, not grades. Or ask them to price "fair value."
      *   *Correction:* To guarantee a Dutch Book, I need to know their prices *before* offering the trade. But the prompt says "For each of a handful of tickets... each student writes down a single number... I then trade against them." This implies I see the prices, then construct the book.
      *   *Constraint Check:* "Whoever plays the house should not know anything the players do not." If I see their prices and *then* choose which trades to offer to exploit them, that's asymmetric information (I know their book, they don't).
      *   *Fix:* The "Menu" is fixed in advance. Everyone is offered the *same* set of buy/sell opportunities based on the prices *they* set.
      *   *Wait, standard Dutch Book:* The Bookie offers bets *at the odds set by the Agent*. If the Agent says "I buy/sell R at 4," the Bookie can choose to buy or sell at 4.
      *   *Implementation:* Student sets a "Fair Price" $X$ for Ticket $T$. This means they are willing to Buy at $X$ and Sell at $X$.
      *   *The House Strategy:* The House looks at the set of prices. If $P(R)+P(B)+P(G) > 10$, House *Sells* all three to the student. If $< 10$, House *Buys* all three.
