answer: |-
  Here is the session plan, designed to meet your constraints and pedagogical goals.

  ### **Session Overview**
  *   **Time:** 75 Minutes.
  *   **Materials:** Opaque bag (30 balls: 10 Red, 10 Blue, 10 Green—*kept secret*), 3 envelopes, printed price slips, printed committee cards, chips/candy for points.
  *   **Forbidden Words (until Debrief):** Coherent, Exploit, Axiom, Book, Dutch, Rational, Irrational.
  *   **Instructor Role:** Facilitator/House. Do not explain *why* they are pricing; explain *how*.

  ---

  ### **Phase One: The Individual Ledger (20 Minutes)**

  **Goal:** Students set prices that violate additivity, allowing the House to construct a guaranteed loss portfolio without knowing the bag's composition.

  **Setup:**
  1.  **The Bag:** Show the sealed bag. State: "30 balls. Red, Blue, or Green. One will be drawn at the end."
  2.  **The Slips:** Distribute a "Market Maker Slip" to each of the 12 students.
  3.  **The Brokers:** Select 3 students to act as "Clerks." They collect slips and calculate ledgers. They do not trade.

  **The Menu (Printed on Slip):**
  *   **Ticket R:** Pays 10 points if Red is drawn.
  *   **Ticket B:** Pays 10 points if Blue is drawn.
  *   **Ticket G:** Pays 10 points if Green is drawn.
  *   **Instruction:** "For each ticket, write **one number** (0–10). This is your 'Fair Price.' You are willing to **Buy** at this price AND **Sell** at this price. The House reserves the right to take either side of the transaction."

  **The Process:**
  1.  Students fill out slips privately (5 mins). *Constraint:* If a student asks for a range, tell them: "A market maker must post a single price. Pick one."
  2.  Clerks collect slips. While Clerks calculate, assign the rest of the class a filler task: "Write down your guess for the exact number of Red, Blue, and Green balls in the bag." (This reinforces that the lesson is not about guessing the bag).
  3.  **The Settlement (Crucial Beat):**
      *   Clerks return slips to owners.
      *   Instructor announces: "We are settling the ledgers now, before the draw."
      *   Clerks announce publicly for any student whose prices sum to $\neq$ 10: *"Student X: You bought/sold a package costing you [Sum] points. The maximum payout is 10. Your guaranteed loss is [Difference] points."*
      *   **The Trap:** If $P(R)+P(B)+P(G) > 10$, the House *Sold* them all three (Student pays Sum, receives max 10). If $< 10$, the House *Bought* all three (House pays Sum, Student foregoes guaranteed 10).
  4.  **The Draw:** Draw the ball. It changes nothing for the students with guaranteed losses. This anticlimax is the lesson.

  **Handling Predictable Failures:**
  *   **Spreads:** "In this market, liquidity requires a single price. Choose the midpoint."
  *   **Guessing the Bag:** "You are pricing your confidence, not the bag. If you knew the bag, the price would be 0 or 10. If you don't, price your belief."
  *   **Opt-outs:** "Points convert to [extra credit/candy]. A zero balance is a zero reward."
  *   **Risk:** This setup assumes risk neutrality. *Fix:* Keep stakes trivial (candy) so risk aversion doesn't distort the "fair price" of a gamble.

  ---

  ### **Phase Two: The Committee Paradox (30 Minutes)**

  **Goal:** Demonstrate that individually consistent commitments aggregate into a collectively exploitable position via Majority Rule.

  **Setup:**
  1.  Divide 12 students into 4 committees of 3.
  2.  Distribute **Private Cards** (one per student). Do not let them show cards to each other.
  3.  **The Cards (Fixed Profiles):**
      *   **Member A:** Red (0.6), Blue (0.2), Green (0.2).
      *   **Member B:** Red (0.2), Blue (0.6), Green (0.2).
      *   **Member C:** Red (0.2), Blue (0.2), Green (0.6).
      *   *(Note: Each card sums to 1.0. Each is internally consistent.)*
  4.  **The House Offer:** The House offers to **Sell** the following three tickets at **7 points each**. The Committee must vote Yes/No on buying each ticket. A ticket is bought if **2 out of 3** vote Yes.

  **The Tickets:**
  1.  **Ticket RB:** Pays 10 if Red OR Blue.
  2.  **Ticket RG:** Pays 10 if Red OR Green.
  3.  **Ticket BG:** Pays 10 if Blue OR Green.

  **The Arithmetic (For your reference):**
  *   **Member A Values:** RB (0.8), RG (0.8), BG (0.4).
      *   Votes: **Yes** (0.8 > 0.7), **Yes** (0.8 > 0.7), **No** (0.4 < 0.7).
  *   **Member B Values:** RB (0.8), RG (0.4), BG (0.8).
      *   Votes: **Yes**, **No**, **Yes**.
  *   **Member C Values:** RB (0.4), RG (0.8), BG (0.8).
      *   Votes: **No**, **Yes**, **Yes**.

  **The Result:**
  *   **Ticket RB:** 2 Yes, 1 No $\rightarrow$ **BOUGHT**.
  *   **Ticket RG:** 2 Yes, 1 No $\rightarrow$ **BOUGHT**.
  *   **Ticket BG:** 2 Yes, 1 No $\rightarrow$ **BOUGHT**.
  *   **Committee Ledger:**
      *   Cost: 7 + 7 + 7 = **21 points**.
      *   Payout (Regardless of Color): Exactly two tickets win. 10 + 10 = **20 points**.
      *   **Guaranteed Loss:** 1 point.
  *   **Individual Moral:** No single member voted "Yes" to all three tickets. No single member is inconsistent. The inconsistency is in the *aggregation rule*.

  **Five-Person Committees?**
  *   With 5 people, you need 3 votes to pass. You can construct a similar profile (e.g., 3 members favoring different pairs), but the 3-person case is the minimal "Condorcet Cycle" structure. It is sharper and easier to calculate in real-time. Stick with 3.

  ---

  ### **Phase Three: Repair and Disposition (15 Minutes)**

  **Goal:** Show the vulnerability is a structural disposition, not a one-time error, and elicit the need for a different decision rule.

  **Round 1: The Buyback**
  *   **Announcement:** "Committees, your ledger shows a guaranteed loss of 1 point. The House offers to buy back your three tickets for **15 points**."
  *   **Rational Group Choice:** Accept. (Loss reduces from 1 to 6).
  *   **The Vote:** Majority rule again.
  *   **The Trap:** Member A thinks, "I only voted for 2 tickets (Value 16). Selling for 15 is a loss for *my* logic." Member A votes **No**. Members B and C think similarly about their specific pairs.
  *   **Outcome:** The committee may reject the buyback because the *individual* ledgers don't reflect the *collective* loss. This shows the defect is dispositional; voting again yields the same structural error.

  **Round 2: Rule Revision**
  *   **Prompt:** "You are told you must trade again. You can change how you decide. You can average your numbers, or you can keep voting."
  *   **Action:** Ask committees to choose a method.
  *   **If they Average:** (0.33, 0.33, 0.33). They value each ticket at 0.66. They reject the 0.70 price. **Immune.**
  *   **If they Vote:** They repeat the loss.
  *   **Elicitation:** Ask a committee that averaged: "What did you give up to be safe?" (Answer: The majority will was ignored; Member A's strong belief in Red was diluted by C's disbelief).

  ---

  ### **Debrief (10 Minutes)**

  **Mapping Moments to Concepts:**
  1.  **Phase 1 Settlement:** *Synchronic Coherence.* The loss was fixed the moment prices were written, not when the ball was drawn.
  2.  **Phase 2 Vote:** *The Discursive Dilemma.* Individually unimpeachable premises $\rightarrow$ Collectively inconsistent conclusion.
  3.  **The "House Knew Nothing" Point:** Remind them: "I did not know the bag's composition. I did not know your cards. I only used the rules you gave me. The vulnerability was entirely internal to your own commitments."
  4.  **Phase 3 Repair:** *Procedural Rationality.* Immunity requires a specific aggregation rule (Linear Pooling/Averaging), which sacrifices democratic responsiveness (Majority Rule).

  **Handling Limitations:**
  *   **"Is this Irrationality?":** Be honest. "This shows *incoherence*, which makes you liable to lose. It does not prove you are stupid or immoral. It proves your commitments don't fit together."
  *   **Diachronic Rationality:** "We showed your prices can't coexist *now*. We did not show how you should change prices *over time* (updating). That requires a second session on conditional probability."
  *   **Risk Neutrality:** "The single-price rule assumes you care only about expected value. If you hate risk, your 'fair price' drops. But if everyone's price drops proportionally, the paradox remains."

  ---

  ### **What You Must Supply Yourself**
  1.  **The Normative Leap:** The session shows *liability to loss*. You must verbally bridge the gap to *normative rationality* ("If you want to avoid guaranteed loss, you ought to be coherent").
  2.  **Dynamic Updating:** You cannot stage a Diachronic Dutch Book (betting on how beliefs change) in 75 minutes without confusing the static paradox. You must lecture this part later.
  3.  **The "Why Care?":** Students who don't care about points will miss the point. You must frame the points as a proxy for "getting what you want."

  ---

  ### **The Condo Board Version (20 Minutes)**

  **Context:** Over wine, with your 7 owners.
  **Setup:** Skip the bag. Use three actual pending condo issues.
  1.  **Issue A:** Approve Roof Repair ($10k).
  2.  **Issue B:** Approve Landscaping ($10k).
  3.  **Issue C:** Approve Total Budget Cap ($15k).
  **The Trap:**
  *   Most owners want Roof (Yes).
  *   Most owners want Landscaping (Yes).
  *   Most owners want Budget Cap (Yes).
  *   But Roof + Landscaping = $20k, which violates the Cap.
  **The Vote:** Vote on each separately by majority.
  **The Result:** You pass Roof, pass Landscaping, pass Cap. You have legally committed to an impossibility.
  **The Fix:** "We need to vote on the *package*, not the items."

  **The One Sentence:**
  > "We are voting consistently on each item, but inconsistently as a portfolio."
