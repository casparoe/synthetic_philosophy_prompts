      *   *Interpretation:* The *rules* must force the incoherence. The House doesn't need secret info, just the *right* to take either side of the trade at the stated price. The students know the House can take either side. The vulnerability is in *their* prices, not the House's knowledge.
      *   *Okay, Plan:*
