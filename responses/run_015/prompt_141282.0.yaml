answer: |-
  You have identified two structural weaknesses in consequentialist reasoning that are well-known in specific technical fields but often glossed over in public ethical debate. Your Quantity Surveying background gives you a distinct advantage here: you are trained to see that a "cost" does not exist in a vacuum, but only relative to a *scope of work* and a *baseline estimate*.

  To answer your primary question directly: there is no single, universally recognized English noun (like "fallacy" or "paradox") that captures exactly what you describe in both instances. However, there are established technical vocabularies in **Life Cycle Assessment (LCA)**, **Decision Theory**, and **Moral Philosophy** that name these phenomena precisely.

  Here is the breakdown of the concepts, the terminology, and how they differ from the confusions you listed.

  ### 1. The Baseline Problem (The "Sign" Issue)

  You described a consideration (wild animal deaths) whose moral valence (positive or negative) flips depending on an unstated counterfactual baseline (what would happen to the land otherwise).

  **The Established Vocabulary:**
  *   **Reference Dependence:** In behavioral economics and decision theory (pioneered by Kahneman and Tversky), this describes outcomes that are evaluated relative to a neutral reference point rather than in absolute terms. If the reference point shifts, a "gain" becomes a "loss." In your argument, the "reference point" is the state of the land if the cattle were removed.
  *   **Counterfactual Comparative Account of Harm:** In philosophy (specifically the work of Joel Feinberg and others), this is the standard view that harm is defined as being "worse off than one would have been" in the relevant alternative scenario. Your brother-in-law and daughter are disagreeing about the *relevant alternative*.
  *   **System Boundary:** In Life Cycle Assessment (the ISO standard for environmental costing), this is the explicit definition of what is included in the calculation and what is treated as the "background." Your argument is that the *system boundary* is being drawn arbitrarily to suit the conclusion.

  **The Rhetorical Move:**
  When someone presents a reference-dependent value as if it were an intrinsic property, they are committing **Baseline Suppression** (or **Reference Point Concealment**). While not a formal logical fallacy like *ad hominem*, it is a recognized form of **Framing Effect**. They are presenting a *delta* (a change) as an *absolute*.

  **QS Analogy:**
  This is equivalent to claiming a variation order is a "cost" without specifying whether the baseline is the original tender sum or the current forecast final account. The number is real, but its sign (credit or debit) depends on the baseline.

  ### 2. The Unit Problem (The "Ranking" Issue)

  You described rankings that invert when the denominator changes (per kilo vs. per calorie vs. per hectare).

  **The Established Vocabulary:**
  *   **Functional Unit Dependency:** In Life Cycle Assessment, this is the specific term for the phenomenon you observed. An LCA cannot be compared unless the *functional unit* is identical (e.g., "1 kg of protein" vs. "1 MJ of energy"). If you change the functional unit, the environmental impact profile changes. There is no "true" unit; there is only the unit appropriate to the function being assessed.
  *   **Rank Reversal:** In Multi-Criteria Decision Analysis (MCDA), this occurs when the ranking of options changes due to a change in the measurement scale or the inclusion/exclusion of alternatives.
  *   **Metric Sensitivity:** A broader term indicating that the conclusion is highly sensitive to the choice of metric.

  **Is it the same phenomenon?**
  It is structurally similar but distinct.
  *   **Problem 1 (Baseline)** is about the **Zero Point**. (Where does the counting start?)
  *   **Problem 2 (Units)** is about the **Scale/Gradient**. (How do we normalize the output?)
  Both are forms of **Framing Dependence**, but they operate on different axes of the calculation.

  ### 3. Differentiation from Other Concepts

  You asked how this differs from empirical uncertainty, incommensurability, and bad faith.

  **Vs. Empirical Uncertainty:**
  *   *Uncertainty* means we do not know the number (e.g., "We don't know how many voles live in that field").
  *   *Baseline/Unit Dependence* means we might know the numbers perfectly, but the *meaning* of the number changes based on the framework. This is **Structural Ambiguity**, not Evidential Uncertainty.

  **Vs. Incommensurability:**
  *   *Incommensurability* means there is no common measure to compare two things (e.g., "beauty vs. cost").
  *   In your case, there *is* a common measure (death counts, land use), but the *normalization* is arbitrary. This is **Commensurable but Indeterminate**.

  **Vs. Bad Faith:**
  *   *Bad Faith* is a claim about the *intent* of the arguer (they know the baseline is arbitrary but hide it).
  *   *Baseline Suppression* is the *structure* of the argument itself. It can be done in good faith if the arguer genuinely believes their baseline is the "natural" one. However, when the baseline is selected *because* it yields the desired result, it becomes **Motivated Baseline Selection**.

  ### 4. Proposed Terminology

  Since no single word exists in general ethics that captures the specific frustration you feel (the "sign instability"), and given your request for a defined term if established ones fall short, I propose the following distinction for your use in these arguments.

  **Term 1: Counterfactual Valence**
  *   **Definition:** A moral or empirical claim whose positive/negative status (valence) is not intrinsic to the act, but is determined entirely by the unstated comparison class (the counterfactual baseline).
  *   **Boundary Case:** "Killing a vole is bad." (Intrinsic claim). Vs. "Farming this land kills voles." (Counterfactual Valence claim: Bad compared to wilderness? Good compared to housing?)
  *   **Usage:** "Your argument relies on *counterfactual valence*; you are treating a relative harm as an absolute one."

  **Term 2: Functional Unit Arbitrage**
  *   **Definition:** The strategic selection of a measurement unit (calories, weight, area) specifically because it inverts the ethical ranking of the options, without justifying why that unit is the morally relevant one.
  *   **Boundary Case:** Measuring drug efficacy by "percentage of patients cured" vs. "total life years gained" can flip which drug looks better. If you pick the one that suits your budget without explaining why, that is arbitrage.
  *   **Usage:** "Switching from per-kilo to per-calorie is *functional unit arbitrage* unless you can justify why the calorie is the moral currency."

  ### Summary for your Arguments

  You are not missing a piece of academic vocabulary; you are identifying **System Boundary Errors** and **Functional Unit Inconsistencies**.

  *   When your brother-in-law says farming saves wild animals, he is assuming a baseline of **Intensive Agriculture or Development**.
  *   When your daughter says farming kills wild animals, she is assuming a baseline of **Rewilding or Wilderness**.
  *   When they switch units, they are engaging in **Metric Sensitivity** without declaring their **Objective Function**.

  As a QS, you know that a cost estimate without a defined scope and basis of estimate is worthless. You can confidently tell them that their ethical calculations suffer from **Undefined System Boundaries**. That is the established technical term for "you haven't told me what you're comparing this against," and it invalidates the comparison until resolved.
