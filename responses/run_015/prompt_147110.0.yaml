answer: |-
  Here are ten interview questions designed for your seminar, sequenced to gradually restrict Dr. Marlow's ability to dismiss objections as "reading grammar into the world," along with the anticipated replies and the strategic rationale for each.

  ### 1. The Advantage Question (Topic 4)
  **Question:** "Dr. Marlow, let's start with the motivation. The traditionalist says a proposition must be more than a list of constituents—'Socrates, mortality, the copula'—because a list doesn't assert anything. The Russellian says relations just relate, and the Fregean says concepts are unsaturated. What specific explanatory work does the 'procedure' vocabulary do that those two don't already do? Why is a routine better than an unsaturated concept?"

  **Expected Reply:** She will likely say that both Russell and Frege still treat the proposition as a *thing* (an abstract object or a complex) that requires a metaphysical account of its coherence. The procedure view dissolves the objecthood entirely.
  **Why:** This establishes her core distinction early. It allows her to use her catchphrase comfortably here ("The Russellian is still looking for a glue for an object that doesn't exist").
  **Follow-up:** "But if the procedure is an abstract entity in your ontology—which I assume it is, since it's shareable across thinkers—haven't you just renamed the 'complex' as a 'routine'? What prevents the procedure itself from being just another item on the list?"

  ### 2. The Falsehood Question (Topic 1)
  **Question:** "Let's press on the ontology of the procedure itself. If the proposition that *aRb* is a routine for checking reality, what is the status of that routine when *aRb* is false? The routine still exists as a meaningful check, but it returns a 'null' result. What holds the constituents of that false proposition together if there is no corresponding unity in the world to anchor them?"

  **Expected Reply:** She will argue that the unity is internal to the procedure's code, not dependent on the world. The procedure is a unified set of instructions regardless of whether the check succeeds.
  **Why:** This forces her to locate unity in the mind/language rather than the world.
  **Follow-up:** "So the unity is purely syntactic or cognitive? Does this mean you now owe us an account of 'absence' or 'negative facts' to explain what the procedure encounters when it fails? I thought the dissolution was meant to avoid ontological inflation, but now you seem to need 'failures' as real inputs."

  ### 3. The Symmetry Question (Topic 2)
  **Question:** "Consider a symmetric relation, like *a is beside b*. The procedure for checking *aRb* and the procedure for checking *bRa* seem to yield the same truth conditions. How do you individuate the two propositions? If the procedure is just 'locate a, locate b, check proximity,' isn't that one procedure for both propositions?"

  **Expected Reply:** She will likely distinguish the *order of search*. The procedure for *aRb* starts at *a* and looks for *b*; the other starts at *b* and looks for *a*.
  **Why:** This commits her to step-order as the source of propositional identity.
  **Follow-up:** "But if the order of steps is what individuates the proposition, aren't you reintroducing the very structure you claimed to dissolve? You've replaced 'constituent order' with 'step order,' but the metaphysical problem of what makes *this* order one order seems identical to the original problem."

  ### 4. The Cognitive Significance Question (Topic 2)
  **Question:** "To follow up on that: take *a is taller than b* and *b is shorter than a*. These are truth-functionally equivalent but cognitively distinct. On your view, are these distinct procedures? If so, isn't the criterion for procedure-identity doing the exact same work as the 'form' of a structured proposition?"

  **Expected Reply:** She will admit they are distinct procedures but deny they have "form" in the objectionable sense. She'll say they are different algorithms for the same state of affairs.
  **Why:** This tightens the trap. If algorithms differ by structure, she has structured propositions under a new name.
  **Follow-up:** "If the difference is structural, and you admit structure is required to explain cognitive difference, why isn't Bradley's regress just waiting for you at the level of the algorithm? Why is 'step-order' immune to the regress when 'constituent-order' is not?"

  ### 5. The Internal Regress Question (Topic 3)
  **Question:** "That leads me to the regress itself. A procedure consists of steps. What makes Step 1 and Step 2 steps of *one* procedure rather than two unrelated operations happening in sequence? If a relation needs a tie to connect relata, doesn't a sequence need a tie to connect steps?"

  **Expected Reply:** She will likely say this is a category mistake. Steps are internally defined by the procedure; they aren't separate entities needing external connection.
  **Why:** This is the first time you directly challenge the "grammar" line by applying it to her own view.
  **Follow-up:** "But that sounds exactly like the Russellian saying 'relations just relate.' If you can say 'steps just step' without further glue, why couldn't the realist say 'relata just relate' without further glue? What makes your brute fact acceptable and theirs magical?"

  ### 6. The Grammar Charge Reversal (Topic 3 & 4)
  **Question:** "Your signature line is that realists read the sentence's grammar back into the world. But a procedure *has* a grammar—it has syntax, rules of composition, and execution order. If you say the world doesn't need structure, but the check does, haven't you just moved the grammar from the world into the mind? Isn't that still reading grammar into reality, just into a different part of it?"

  **Expected Reply:** She will argue that mental/linguistic structure is unproblematic because it's causal or functional, whereas worldly structure is metaphysically spooky.
  **Why:** This makes it hard for her to use the catchphrase offensively. She must now defend why mental grammar is safe from Bradley.
  **Follow-up:** "So the regress is stopped only by a kind of naturalism about the mind? If so, isn't your solution contingent on a philosophy of mind rather than a dissolution of the logical problem? If we had different cognitive architectures, would Bradley's regress return?"

  ### 7. The Facts Question (Topic 5)
  **Question:** "I want to pivot to my friend's objection. He argues Bradley's regress isn't about propositions or sentences, but about *facts*. Even if propositions are procedures, what makes it the case that *a, R, and b* compose a single state of affairs in the world rather than three scattered items? Do you have an answer to the worldly regress, or is that not your problem?"

  **Expected Reply:** She will likely say it is not her problem. Her view is about truth-bearers (propositions), not truth-makers (facts). She dissolves the need for worldly unity because the 'unity' is in the checking, not the checked.
  **Why:** This forces her to explicitly decline the metaphysical burden, which is a costly move.
  **Follow-up:** "If you decline that question, aren't you leaving the metaphysics of truth unfinished? If the world is just scattered items, and the proposition is a procedure, what *is* truth? Is it just the feeling of the procedure completing successfully?"

  ### 8. The Cost of Declining (Topic 5)
  **Question:** "To press that cost: if you say the worldly unity problem isn't yours, you seem to be embracing a form of anti-realism about states of affairs. But doesn't that make truth entirely epistemic? If the world doesn't have unified facts, then when I say 'It is true that aRb,' I'm not describing a unity in the world, but only the success of my routine. Is that a price you're willing to pay?"

  **Expected Reply:** She will likely embrace this. She will argue that 'truth' was always a semantic notion, not a metaphysical mirror.
  **Why:** This clarifies her position as potentially anti-realist, which changes the stakes of the seminar discussion.
  **Follow-up:** "If truth is just procedural success, does that mean a proposition could be 'true' for a being with a different procedure even if the world is the same? Have you sacrificed objectivity to save parsimony?"

  ### 9. The Dissolution vs. Displacement Question (Synthesis)
  **Question:** "Putting the last few points together: It seems you haven't dissolved Bradley's regress so much as displaced it from metaphysics to the philosophy of mind. You stop the regress by saying procedures are primitive unities. Why is stopping it there any more satisfying than the Russellian stopping it by saying relations are primitive unities?"

  **Expected Reply:** She will argue that procedures are causally efficacious and observable (in behavior/neuroscience), whereas metaphysical ties are not.
  **Why:** This forces her to justify the asymmetry between mental and metaphysical primitives.
  **Follow-up:** "But the regress is a logical problem, not an empirical one. Even if we observe the procedure, the logical question remains: what unifies the observation? Are you confident the regress doesn't apply to the observation itself?"

  ### 10. The Defeater Question (Closing)
  **Question:** "Finally, a question on resilience. What finding or argument would make you give this view up? If someone showed that procedures *themselves* require a Bradley-style tie to function, would you abandon the procedure view, or would you just say that tie is also primitive? Where is the line where the view becomes unfalsifiable?"

  **Expected Reply:** She will likely say that if it could be shown that procedural unity is logically incoherent (not just metaphysically costly), she would leave the view.
  **Why:** This ends the seminar on a note of open inquiry, testing the dogmatic potential of her dissolution strategy.
  **Follow-up:** "So the view stands only as long as we accept that 'functional unity' is self-explanatory? Thank you, Dr. Marlow."
