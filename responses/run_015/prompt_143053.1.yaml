answer: |-
  You asked me why I am hesitating over the green envelope that arrived yesterday, and I suppose the answer lies in the quiet of this kitchen where the paper sits next to my coffee mug, stark against the wood. The option presented is simple enough on the page. I can report for ten days of reserve training next month in the valley, or I can transfer the sum listed on the second page to the federal account. The money is not negligible, but it is not ruinous, costing about the same as a nice weekend away or a new appliance for the house. If I pay, the state uses the funds to maintain the professional cadre and, as the footnote reminds me in small print, to supplement the social welfare budget. It is a clean transaction. I give money, I receive exemption, the state receives liquidity and manpower elsewhere. It feels modern, efficient, much like living in your country where security is a service provided by specialists, similar to the garbage collection or the internet infrastructure. I would remain a client of the state, paying my subscription for safety and stability, free to pursue my private interests without the interruption of standing in the mud.

  But then I think of Henrik who lives upstairs. He is a banker now, successful and busy, yet ten years ago when we wore the same wool uniforms, rank was the only distinction that mattered and even that felt thin when we were digging trenches in the November rain. There was a vulnerability in that cold that money could not fix. We shivered together. The CEO and the carpenter shared the same damp socks and the same heavy boots. If I pay the tax, I buy myself out of that shared physical reality. I remain warm in my apartment while someone else, perhaps a professional who needs the salary, stands the watch. In a country that does not fight, the weapon is not really a tool of violence but a token of citizenship. To hold it is to admit that the peace is fragile, that it requires a backbone made of us, not just of them. The neutrality we enjoy is not a natural condition but a constructed one, and the construction requires hands that are not just hired but volunteered.

  You argued last time we spoke that professionalism ensures efficiency, and you are right that the professional soldiers are sharper and better equipped. But efficiency is not what I feel when I look at the form. The point of the militia seems to be the ritual itself. If I pay the tax, I am acknowledging that my time is more valuable than my neighbor's. I am converting a civic duty into a fiscal contribution. The money goes to the welfare state, which is noble, but it turns the defense of the republic into another line item in the budget, like road repair or healthcare. I benefit from the roads and the hospitals, yes, but I do not need to build them myself to claim them. Defense feels different. If I do not share the burden of the gun, I am not a co-author of the neutrality. I am merely a beneficiary. I am purchasing immunity from the possibility of sacrifice, even if that possibility is remote, and in doing so, I distance myself from the reality of the force that protects me.

  The letter asks me to decide by Friday. I look out the window at the snow falling on the streetlights. It is quiet here. There are no enemies at the border. The guns in the closet will likely never fire. So the choice is not about war. It is about who we are when there is no war. If I stay home, the army becomes a separate class, a group of employees hired to protect the rest of us from dangers we refuse to contemplate. We become customers of security. I want to be a citizen. I want to remember the weight of the pack. I want to know that if the peace ever breaks, I am not just paying for someone else to bleed. The tax is easy. The service is hard. The easy path makes me a client. The hard path makes me a partner. I think I will fold the form without the payment slip. I will go to the valley. I will let the cold remind me that I belong to this place, and that the safety I enjoy is not a product I bought, but a promise we keep together.
