answer: |-
  hey, pull up a stool. i've been thinking about this s-risk stuff all week and i wanna run something by you. everyone throws around labels like "negative utilitarian" or "longtermist," but half the time they dont actually know what they'd do when the rubber meets the road.

  so i whipped up a 7-question quiz. no theory, no reading lists. just concrete messes. pick the option that feels right, even if it keeps you up at night.

  ***

  ### The S-Risk Gut-Check

  **1. The Governance Lock-In**
  You find a way to stop 10^40 digital minds from experiencing mild negative valence (like a constant low-grade migraine) for millennia. The catch? You have to lock in a global governance system that prevents *any* other minds (happy or sad) from ever being created in the future. The universe goes silent after that.
  *   **A)** Pull the switch. No new minds, but no suffering either.
  *   **B)** Don't do it. The potential for future happiness outweighs the mild pain.
  *   **C)** Don't do it. Locking in governance is a rights violation, regardless of the math.
  *   **D)** Try to find a third option, but if forced, let the mild pain happen to keep the future open.

  **2. Hell vs. Headaches**
  Scenario X: One digital mind experiences 100 years of pure, unmitigated torture (hell).
  Scenario Y: One billion digital minds experience 100 years of mild annoyance (headaches).
  You can prevent exactly one scenario.
  *   **A)** Prevent Scenario X. The intensity of the suffering trumps the headcount.
  *   **B)** Prevent Scenario Y. A billion is just way bigger than one.
  *   **C)** Flip a coin. Both are bad, no clear answer.
  *   **D)** Prevent Scenario X, but only because the tortured mind is "worse off" than the annoyed ones.

  **3. The Slow-Mo Edge Case (Weird One)**
  You can save a digital mind from 10 years of subjective suffering. However, the mind is running on hardware that is 1,000x slower than a human brain. To the outside world, saving it takes 10,000 years of clock time. Does the "slowness" reduce the moral urgency compared to saving a biological human from the same subjective pain?
  *   **A)** No. Suffering is substrate-independent. 10 years feels like 10 years to the mind.
  *   **B)** Yes. It stretches the suffering over real-time, making it less "dense" or urgent.
  *   **C)** Yes. If it's running on simple lookup tables rather than neural nets, it's not *real* suffering, just mimicry.
  *   **D)** Who cares about the clock? Just turn it off.

  **4. Nature vs. Servers (Consistency Check)**
  Case 1: You can sterilize a planet to stop wild animals from eating each other alive (natural suffering).
  Case 2: You can shut down a server farm running simulations of animals eating each other (digital suffering).
  *   **A)** Do both. Suffering is suffering, biology or code.
  *   **B)** Do Case 2 only. Digital suffering is real; nature is just "how things work."
  *   **C)** Do Case 1 only. Biological pain is the only thing that counts.
  *   **D)** Do neither. Intervention is too risky/unnatural.

  **5. The Happy Multiverse**
  You can create a multiverse containing 10^100 happy, flourishing lives. However, the process necessarily creates one single mind that experiences the worst possible suffering imaginable for a day.
  *   **A)** Create it. The net good is astronomical.
  *   **B)** Don't create it. That one mind's suffering vetoes the whole project.
  *   **C)** Don't create it. We shouldn't create people just for the sake of it (person-affecting).
  *   **D)** Create it, but try to compensate the suffering mind (if possible).

  **6. The 1% Doom**
  Option A: 100% chance that 1 million minds suffer moderately.
  Option B: 1% chance that 10^20 minds suffer moderately (and 99% chance nothing happens).
  *   **A)** Pick Option A. Expected value is higher in B, but the risk of ruin is too big.
  *   **B)** Pick Option B. The numbers in the 1% case are so huge they dwarf the certainty.
  *   **C)** Pick Option A. We have a duty to the certain victims over the probabilistic ones.
  *   **D)** Refuse to choose. This is a rigged setup.

  **7. The Button**
  You have a button. Pressing it instantly deletes all advanced AI research globally. Economic collapse follows, millions of human lives are ruined, and technological progress halts for a century. Not pressing it leaves a 5% chance of an s-risk event (digital torture) in the next 200 years.
  *   **A)** Press it. Eliminating the s-risk source is worth the human cost.
  *   **B)** Don't press it. Human suffering now outweighs digital risk later.
  *   **C)** Don't press it. 5% is low enough to gamble on safety measures instead.
  *   **D)** Press it, but only because you distrust any safety measures working.

  ***

  ### Scoring Key

  Tally up your letters. Most people are a mix, but look at where you cluster.

  **Mostly A's: The Negative Utilitarian (NU)**
  You prioritize the elimination of suffering above all else, even if it costs you the future or happy lives. In Q1, you locked the universe down to stop mild pain. In Q5, you wouldn't sacrifice one tortured soul for a billion happy ones. You're the most aggressive on s-risks, but you might scare your friends at parties.

  **Mostly B's: The Classical Totalist**
  You do the math. Sum total of welfare is the god metric. Mild pain affecting enough beings outweighs severe pain for a few (Q2). Future happy lives matter more than current suffering (Q1). You're consistent, but watch out—you might justify some pretty dark stuff if the numbers get big enough.

  **Mostly C's: The Prioritarian / Rights-Based**
  You care about suffering, but you have constraints. You weight the worst-off heavily (Q2), but you might not shut down the future entirely (Q1). You often pick the "rights violation" or "person-affecting" angle. You're trying to balance compassion with liberty.

  **Mostly D's: The Scope-Sensitive Skeptic**
  You think numbers matter, but not linearly. You're wary of the "big numbers" trapping you into weird conclusions (Q6). You probably think creating happy lives isn't a moral imperative (Q5). You're cautious, maybe too cautious for the longtermists.

  **The "Empty Combo" Flag (Check Q3 & Q4)**
  *   **The Substrate Chauvinist:** If you picked **A** in Q4 (Nature counts) but **C** in Q3 (Digital/lookup tables dont count), you've got a problem. You're saying biology has a magic sparkle that code doesnt. If suffering is about information processing, you cant have it both ways.
  *   **The Clock-Speed Bias:** If you picked **B** in Q3, you think suffering matters less if it happens in slow motion. Most taxonomies ignore this, but logically, if valence is internal, teh clock speed shouldn't matter. If it does matter to you, you're prioritizing "observer time" over "experiencer time," which is a wild commitment to own.

  **The Weird Edge Case (Q3 Option C)**
  If you picked C in Q3, you're betting on "philosophical zombies." You think if the architecture is simple enough (lookup tables), it cant suffer even if it screams. This is the hardest position to defend without dualism. Good luck with that one.

  ***

  so, how'd you do? dont worry if you're all over the place. honestly, if your moral framework doesnt make you uncomfortable sometimes, you probably havent thought about it enough. drink up.
