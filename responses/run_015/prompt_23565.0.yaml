      *   **Point 2: The Predictor's Accuracy.** The thought experiment stipulates the predictor is extremely reliable (say, 99.9% or perfect). If you two-box, you almost certainly get $1,000. If you one-box, you almost certainly get $1,000,000. Expected utility favors one-boxing *if* you condition on the correlation.
      *   **Point 3: Decision Theories.**
