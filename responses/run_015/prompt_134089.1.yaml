  # Classification Key: Actual Infinities

  **Starting Commitment:** Ordinary finite arithmetic is unproblematic; given any finite collection, one more member can be added.

  **Instructions:** Answer each question with **A** (Yes-ish), **B** (No-ish), or **C** (Incoherent/No Fact). Follow the path to your leaf position.

  ### Q1. The Two Hotels Case
  In Hotel Z (rooms numbered by all integers, all full), a uniform rule houses an infinite bus but fails to house a single guest. Does this show "can be housed" is only a formal fact about pairings, is the rule irrelevant (both can be housed), or is the setup incoherent?
  *   **A:** Rule irrelevant; both can be housed. (Go to Q2)
  *   **B:** Formal fact only; or Bus yes/Single no. (Go to Q5)
  *   **C:** Setup is incoherent. (Go to **Leaf 1**)

  ### Q2. The Hotel That Was Always There
  Rooms 1, 2, 3... no first day, one guest/day arrived and took the lowest empty room. No one left. Today every room is occupied. Is this story coherent?
  *   **A:** Yes; a series with no beginning raises no new problems. (Go to Q3)
  *   **B:** No; a collection built one member at a time can never be finished. (Go to Q5)
  *   **C:** No; for the same reason a fully occupied Hotel N is impossible. (Go to Q4)

  ### Q3. The Hotel Never Built + The Doorman
  Same hotel, but no arrivals ever: every room has simply always been occupied. Does your answer change from Q2? (Change = objection to production; Stable = objection to collection). Also: The doorman added one to his count each day forever. Is his count today finite, infinite, or malformed?
  *   **A:** Stable answer (Collection); Count is infinite. (Go to Q4)
  *   **B:** Changed answer (Production); Count is finite. (Go to **Leaf 2**)
  *   **C:** Question malformed (regarding the count). (Go to **Leaf 3**)

  ### Q4. Abstract Totalities and Cantor
  Even if no concrete collection is infinite, is there a single collection containing all natural numbers, and is the claim "there are more real numbers than natural numbers" determinate?
  *   **A:** Yes (Totality); Determinate answer (More reals). (Go to Q6)
  *   **B:** Yes (Totality); Not determinate (or no power set). (Go to Q7)
  *   **C:** No; natural numbers do not form a single totality. (Go to **Leaf 5**)

  ### Q5. Location of Impossibility
  For those denying concrete infinity: Is the impossibility a matter of what is possible at all, what the laws of nature permit, or what we could ever have evidence for?
  *   **A:** Possible at all (Metaphysically), but not actual. (Go to **Leaf 6**)
  *   **B:** Laws of nature permit (Nomologically), but not in our world. (Go to **Leaf 7**)
  *   **C:** Evidence/Causal (We could never be affected by one). (Go to **Leaf 2**)

  ### Q6. Concrete Reality and Exponentiation
  For those accepting abstract hierarchies: Are concrete infinities possible, and is exponentiation total for all numbers (i.e., $2^n$ exists for any $n$)?
  *   **A:** Concrete possible; Exponentiation total. (Go to **Leaf 8**)
  *   **B:** Concrete impossible; Exponentiation total. (Go to **Leaf 9**)
  *   **C:** Exponentiation not total (fails for large numbers). (Go to **Leaf 10**)

  ### Q7. Power Sets and Countability
  For those accepting natural numbers as a totality but denying "More Reals": Do you accept the natural numbers as a totality but reject arbitrary power sets (collections of all sub-collections)?
  *   **A:** Yes; reject arbitrary power sets. (Go to **Leaf 11**)
  *   **B:** No; accept power sets, but hold all are countable. (Go to **Leaf 12**)
  *   **C:** Question malformed (No totalities). (Go to **Leaf 5**)

  ---

  ### Leaf Positions

  *   **Leaf 1 (1C): Deflationist.** *Path:* 1C. *Awkward Commitment:* Must treat a central mathematical dispute as a verbal confusion rather than a factual disagreement.
  *   **Leaf 2 (3B, 5C): Causal Finitist.** *Path:* 3B or 5C. *Awkward Commitment:* Must deny that any concrete object can stand in causal relations to infinitely many things, limiting cosmological models.
  *   **Leaf 3 (3C): Strict Finitist.** *Path:* 3C. *Awkward Commitment:* Must deny that any completed infinite totality exists anywhere, requiring revision of standard mathematics.
  *   **Leaf 5 (4C, 7C): Indefinite Extensibility.** *Path:* 4C or 7C. *Awkward Commitment:* Must hold that the natural numbers are always available but never form a single definite totality.
  *   **Leaf 6 (5A): Nomological-only Finitist.** *Path:* 5A. *Awkward Commitment:* Must hold infinite collections are metaphysically possible but not in a world like ours (multiverse implication).
  *   **Leaf 7 (5B): Nomological-only Finitist (Variant).** *Path:* 5B. *Awkward Commitment:* Must hold laws of nature permit infinities, but they do not obtain here.
  *   **Leaf 8 (6A): Cantorian Realist.** *Path:* 1A-2A-3A-4A-6A. *Awkward Commitment:* Must accept actual infinities in the concrete world as well as in mathematics and accepts the unlimited hierarchy.
  *   **Leaf 9 (5A, 6B): Abstract-only Realist.** *Path:* 5A or 6B. *Awkward Commitment:* Must accept actual infinities among abstract objects but denies that anything concrete is infinite.
  *   **Leaf 10 (6C): Ultrafinitist.** *Path:* 6C. *Awkward Commitment:* Must be suspicious even of indefinite extendability once numbers get large enough that exponentiation stops being total.
  *   **Leaf 11 (7A): Predicativist.** *Path:* 7A. *Awkward Commitment:* Must accept the natural numbers as a totality but not arbitrary power sets or impredicatively specified ones.
  *   **Leaf 12 (7B): Countabilist.** *Path:* 7B. *Awkward Commitment:* Must allow infinite totalities but holds that every one of them is countable (denies Cantor's result).

  *(Note: Leaf 4 is omitted to maintain 12-leaf cap; Countabilist/Predicativist split at Q7.)*

