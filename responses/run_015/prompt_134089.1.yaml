  1.  **Abstract-only (Leaf 9) vs. Nomological-only (Leaf 6).** *Issue:* Both deny concrete infinity in the actual world; distinction relies on modal intuition about other possible worlds. *Extra Question:* "If the laws of physics were different, would a concrete infinite collection be metaphysically possible?"
  2.  **Strict Finitist (Leaf 3) vs. Ultrafinitist (Leaf 10).** *Issue:* Both deny standard arithmetic at limits; distinction relies on whether 'finite' includes numbers too large to write. *Extra Question:* "Is there a specific number $N$ such that $N+1$ cannot exist?"
