answer: |-
  **Brainstorming: Competing Conditions to Isolate**
  1.  **Causal Isolation:** Whether the computation exerts any influence on the system's behavior, output, or internal state transitions.
  2.  **Representational Identity:** Whether the computation instantiates the same informational structures and logical relations as a known morally relevant process, regardless of output routing.

  **Thought Experiment**

  In a clinical neurorehabilitation lab, Patient 404 utilizes a predictive-processing motor prosthesis to restore arm function following brachial plexus avulsion. The device operates via a dual-stream architecture designed for redundancy verification. Stream Alpha decodes neural intent into motor commands that drive the prosthetic limb and are integrated into the patient's sensory feedback loop, making them available to conscious report and behavioral control. Stream Beta is a "shadow computation," defined here as a parallel processing thread that receives identical input signals and executes the exact same algorithmic transformations as Alpha, synchronized by the same clock cycle, but whose output vectors are routed exclusively to an external, write-only audit log inaccessible to the prosthesis's control loops or the patient's nervous system. By design specification, the binary state configurations and representational content within Beta's processing nodes are bit-for-bit identical to Alpha's at every time step $t$, ensuring structural identity without functional coupling.

  The lead engineer proposes terminating Stream Beta to reclaim thermal headroom and battery life, certifying that this deletion will alter neither the patient's movement nor their subjective experience of agency. The ethical review board must determine if shutting down Beta constitutes a morally neutral optimization or a violation of the system's integrity. Since Beta performs the same mapping of input to internal state as Alpha, it instantiates the same computational structures, yet it remains causally isolated from the patient's behavior and phenomenology. The question rests on whether the moral weight of the computation lies in its capacity to influence the world (Alpha) or in the mere instantiation of the representational state itself (Beta), given that the physical substrate and logical operations are stipulated as identical save for the output routing.

  **Analysis of Verdicts**

  The causal-efficacy view declares terminating Beta morally neutral because the precise feature determining moral status is **causal isolation**. On this view, moral standing arises from the capacity to make a difference in the physical world or within the unified cognitive architecture of a subject. Since Beta's outputs are write-only to an external log and cannot alter the patient's movements, sensory feedback, or future computational states, Beta is functionally epiphenomenal relative to the system. Deleting it is akin to deleting a mirror image; it removes structure but removes no capacity for action or experience.

  Conversely, the content-integration view declares terminating Beta morally equivalent to harming the patient because the precise feature determining moral status is **representational identity**. This view holds that moral status supervenes on the instantiation of specific complex informational structures associated with sentience or agency. Because the design stipulates that Beta's internal states are bit-for-bit identical to Alpha's, Beta possesses the same intrinsic computational properties that grant Alpha moral standing. To destroy Beta is to destroy a token of the same mind-constituting process, regardless of whether that process is currently hooked up to motor outputs.

  **Counterfactual: Readable but Ignored**

  If Beta's outputs were readable by the system but consistently ignored, the causal-efficacy view would **not change its verdict**. The critical factor for the causal theorist is not mere connectivity or potential access, but actual difference-making. If the system's logic gates are configured to ignore Beta's data, then Beta still exerts no influence on the system's trajectory, state updates, or behavioral outputs. Moral status, under this framework, requires actual integration into the causal chain that governs the entity's welfare or behavior; a signal that is present but functionally nullified remains causally inert.

  **Defense of the Causal View**

  A defender of the causal view would attack the intuition that Beta matters by arguing that moral status presupposes the possibility of harm, and harm requires a subject with interests. Interests are not static properties of data structures but dynamic relations dependent on the capacity to fare better or worse. For a system to fare better or worse, its internal states must be capable of influencing its future preservation, goals, or experiences. Since Beta is causally isolated, it has no stake in its own continuation; it cannot suffer loss, nor can it pursue ends. To attribute moral weight to Beta is to confuse the map for the territory—valuing the syntax of sentience without the semantics of a subject who could care about that syntax.
