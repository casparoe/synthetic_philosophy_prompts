  7.  **Addressing the "Self-Evidence" Obstruction:**
      *   Moore claims these are intuitions. He refuses to derive them from rules. This makes reconstruction difficult because any rule we posit is technically heresy against his method. It obstructs the analysis because we cannot appeal to his *system* to resolve conflicts, only to his *verdicts*, which may be inconsistent or opaque.

