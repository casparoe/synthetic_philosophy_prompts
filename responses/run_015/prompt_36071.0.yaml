      *   *Case (b) Deluded Connoisseur:* Similar to (a). If the objects aren't beautiful, it's not "Appreciation of Beauty." It's a delusion. Value is low.
      *   *Case (c) Compassionate Observer:* Compassion for real suffering. Moore views suffering as bad. Compassion is a virtue. But is the *state of compassion* good? Moore usually links the good to the *mitigation* of suffering or the love of the person. If the suffering is *real* and *unchanged*, is the compassion good? Moore suggests sympathy is good, but the existence of the suffering is bad. The *whole* (Sympathy + Suffering) is a complex organic unity. Moore might say the compassion is good, but the total situation is mixed. However, compared to (a) and (b), the object (suffering) is *real*. Moore values truth. So (c) is likely better than (a) or (b).

