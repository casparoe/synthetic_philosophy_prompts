answer: |-
  The rain against the high windows of the Tribunal Chamber was the only sound for the first ten minutes. Outside, the river swelled, brown and heavy, mirroring the mood inside. High Justice Kael sat at the center of the bench, his fingers resting on a stack of papers that smelled of damp wool and old ink. To his left sat the Advocate for the Prosecution; to his right, the Defense. Between them stood Scribe Venn of the Bureau of Removals, clutching a ledger bound in red leather.

  The Five-Reach Pact had held for thirty years. It had collapsed in seven days. Now, the Tribunal needed a name. Not an explanation—a name. Reparations depended on it. A treason indictment depended on it. The law required a single cause.

  Scribe Venn cleared his throat. He was a small man, but the Ledger gave him weight. He opened the book to the marked page.

  "The Bureau has completed its removals," Venn said. His voice was flat, practiced. "We followed the Convention. For each factor, we removed it from the archive. We held the remaining history fixed, except where the removal itself forced a change. We did not trace alterations backwards. We recorded the outcome."

  He looked up, meeting the Justice's eyes. "Four factors are on record."

  Venn turned the page. "Factor One: The Grain Convoy. On the 12th of Frostfall, the barges from the Upper Reach failed to arrive. The riverside districts rioted. The Council never reconvened after the noon bell."

  "Remove the failure," Venn continued, reading the finding. "Hold the rest fixed. The riots do not occur. The Council reconvenes. But..." He paused. "The Ledger says the Pact still falls."

  The Advocate for the Defense shifted. "How? If the Council sits, how does the Pact fall?"

  "Factor Two," Venn said. "The Assassination. On the 14th, the Mediator was shot in the plaza. A first shooter fired. A second shooter waited in the crowd and never drew his weapon. The Council lost its authority."

  Venn tapped the page. "Remove the Assassination. Hold the rest fixed. The Convoy still failed. The riots still happened. The Council reconvened, but the rioters stormed the hall. The Pact falls."

  "And the Mutiny?" the Justice asked.

  "Factor Three. The River Garrison. On the 13th, the commanders made a separate decision to march on the capital. They arrived on the 15th."

  "Remove the Mutiny," Venn said. "Hold the rest fixed. The Convoy failed. The riots happened. The Mediator was assassinated. The Pact falls."

  The room felt smaller. The rain hammered the glass.

  "Three causes," the Prosecutor said. "Each one enough to burn the house down on its own. Remove the grain failure, the assassin still kills. Remove the assassin, the mutineers still march. Remove the mutineers, the hunger still breaks the Council."

  "Symmetrically redundant," the Defense muttered, then caught himself. "Interchangeable."

  "There is a fourth factor," Venn said.

  He turned the page again. The ink here was darker, fresher. "Factor Four: The Unanimity Rule. Written into the Pact at its founding. Clause 9, Section 2. Any emergency measure requires unanimous ratification."

  Venn looked up. "Remove the Rule. Hold the rest fixed. The Convoy fails. The riots start. The Mediator dies. The Mutiny marches. But without the Rule, the Council could have passed an emergency decree on the 14th. They could have suspended the riots. They could have authorized the loyal guards. The Pact holds."

  The silence stretched. The Defense leaned forward. "You are telling this Tribunal that the cause of the collapse was a piece of paper written thirty years ago?"

  "It passes the test," Venn said stiffly. "Remove it, the Pact stands. Remove the others, the Pact falls. By the Bureau's procedure, the Rule is the cause. The others are merely conditions."

  "It's the air in the room," the Defense snapped. "You need air for a fire to burn. If you remove the air, the fire goes out. Do you indict the air for the burn?"

  "The Bureau does not judge relevance," Venn said. "We judge counterfactual dependence."

  "There is a fifth item," the Justice said. He pulled a separate document from the stack. "Dispatch 9. Revealing that the Lower Reach had secretly rearmed."

  Venn flinched. "That finding is disputed within the Bureau."

  "Read it," the Justice said.

  Venn swallowed. "Dispatch 9 arrived on the 16th. The Council dissolved on the 15th. The Ledger says: Remove the Dispatch. The Pact still falls. Remove the other factors, but keep the Dispatch... the Pact still falls. The rearmament would have wrecked trust on its own. But it arrived two days late."

  "It was pre-empted," the Prosecutor said. "The house was already ash when the second fire arrived."

  "But it was a fire," the Defense argued. "If the Assassin had missed, if the Grain had arrived, the Dispatch would have done the work. It was waiting in the wings."

  "The Convention forbids us from weighing waiting wings," Venn said. "We look at what happened, not what might have happened if the actual causes had failed."

  The Justice leaned back. "Scribe Venn. You say you held the history fixed except where the removal altered it. You are forbidden from tracing alterations backwards."

  "It is the Rule," Venn said.

  "If I remove the Mutiny," the Justice said slowly. "The Garrison does not march. But the commanders made their decision on the 13th. Why did they decide?"

  "The Ledger does not ask why," Venn said. "It asks what if."

  "If you were allowed to trace backwards," the Justice pressed. "If you removed the Mutiny, and then asked what else would have changed in the past to prevent that decision... would the Grain have arrived? Would the Assassin have been hired?"

  Venn's grip on the Ledger tightened. His knuckles were white. "If we traced backwards... the archive breathes. If the Mutiny was not planned, perhaps the Grain was not intercepted. Perhaps the Assassin was not paid. If the archive breathes, remove the Mutiny, and the Convoy arrives. The Pact holds."

  "So the finding rests on the Convention," the Justice said. "Not the archive."

  "The Convention is the procedure," Venn said, his voice rising, the insulted pride of a clerk whose ledger is being overridden. "Without the Convention, there is no Ledger. Every removal unravels the thread back to the founding. There are no causes, only origins. We must hold the background fixed to see the shape of the event."

  "To see the shape," the Defense said. "Or to choose the shape?"

  The Justice looked at the rain. He looked at the Ledger. He looked at the Dispatch.

  There were three fires that burned the house. One arrived late. One was the air that allowed the burning. The Ledger said the air was the cause, because the air was the only thing whose removal saved the house, provided you refused to ask why the fires were lit. But the Law required a name. It required a traitor. You cannot indict the air. You cannot indict a rule written thirty years ago by dead men. You cannot indict a fire that arrived after the ash.

  You must indict a man.

  The Prosecutor looked at the Defense. The Defense looked at his hands. They both knew the cost. To name one cause is to absolve the others. To name the Assassin is to say the Grain did not matter. To name the Grain is to say the Mutiny was irrelevant. To name the Rule is to say no one is guilty.

  The Justice picked up his gavel. The wood was scarred.

  "The Tribunal finds," he said. His voice was low, but it filled the room. "That the collapse of the Five-Reach Pact was caused by the Assassination of the Mediator."

  The Defense exhaled, a sharp sound. The Mutineers would go free. The Grain merchants would not be taxed. The Unanimity Rule would remain in the text, invisible, waiting for the next time.

  "However," the Justice continued. "The Tribunal notes the finding of the Bureau regarding the Unanimity Rule. Reparations will be assessed against the Estates of the Upper Reach for the Grain Convoy, despite the finding of redundancy. The Mutiny will be amnestied, as their arrival was subsequent to the dissolution. The Dispatch regarding Rearmament will be sealed."

  "And the Assassin?" the Prosecutor asked.

  "The first shooter will be executed," the Justice said. "The second shooter, who waited in the crowd and never fired, will be exiled."

  Venn closed the Ledger. The sound was like a bone breaking.

  "Why the second shooter?" the Defense asked. "He fired no shot. By your own logic, remove him, the Mediator still dies."

  "Because he was there," the Justice said. "Because the Pact fell this way, violently, rather than by quiet lapse. The question was not only why it fell, but why it fell *then*. The second shooter made the violence certain. He made the set complete."

  "He was redundant," Venn whispered.

  "He was present," the Justice said.

  The gavel came down. The sound echoed off the wet windows.

  Outside, the river continued to rise. The water did not care about the Ledger. It did not care about the Convention. It flowed over the stones, covering the tracks of the barges that never arrived, the blood that had been washed from the plaza, the march of the soldiers who turned back.

  Scribe Venn tucked the Ledger under his arm. He walked out into the rain. He knew that tomorrow, a new clerk could open the book. They could change the Convention. They could allow the archive to breathe. They could trace the Mutiny back to the Grain, and the Grain back to the Rule. They could find that nothing was the cause, or that everything was.

  But today, the indictment was written. The name was chosen. The cost was paid.

  In the chamber, the Advocate for the Defense packed his papers. He looked at the empty chair where the Mediator had once sat. He thought about the Unanimity Rule, still written in the law, still necessary, still invisible. He thought about the Grain rotting on the barges upstream. He thought about the second shooter, exiled for a shot never fired.

  He stood up. He walked out into the hall. The rain was cold. He pulled his collar up. He did not look back at the Tribunal. There was nothing left to see but the decision, and the silence it required to stand.

  The Bureau would keep its ledgers. The cities would keep their grudges. The truth would remain in the space between the removal and the archive, in the gap where the Convention held the world still so that a single thread could be pulled without unraveling the whole.

  It was a clean cut. It was a lie. It was the law.

  The door closed. The room was empty. The rain washed the glass, blurring the view of the river, making the water look like ink, making the world look like a page that could be rewritten, if only one knew how to remove the right words without changing the rest.
