prompt: |-
  Hey, I'm running a workshop for sociology grad students — smart, but zero analytic phil background — and I want them to understand standing to blame and why hypocrisy undermines it. I'm framing it around a distinction I'm calling mirror vs structural hypocrisy: mirror is blaming you for the exact fault you have (like screaming at someone for being loud), structural is blaming you for X while I do Y, where X and Y share the same underlying moral form — say I call out a colleague for free-riding on shared lab protocols but I'm free-riding on departmental service commitments. I think they disqualify differently, and I want the session built around that.

  Don't explain it to me; plan how I'd teach it. What's the right dependency order — do they need to see standing as an entitlement rather than a reward for virtue before we even introduce hypocrisy, or after? What's the one carrying exmaple that has to contain both mirror and structural versions, and what must it have and lack? I want to avoid the tired 'adultery preacher' case since it's too obvious. What misconceptions will they bring — probably that hypocrisy is just being a bad messanger — and exactly where in the sequence should I head each off? Give me a quick check at the end to see if they grasp why structural hypocrisy is trickier than mirror. And tell me what I should flat-out refuse to explain at this level — I don't want to wander into whether blame is fundamentally a speech act or some deep Kantian machinery they won't follow.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop plan:

  1.  **Analyze the Request:**
      *   **Audience:** Sociology grad students (smart, no analytic philosophy background).
      *   **Topic:** Standing to blame, specifically how hypocrisy undermines it.
      *   **Core Distinction:** Mirror Hypocrisy (blaming for exact fault) vs. Structural Hypocrisy (blaming for X while doing Y, where X and Y share underlying moral form).
      *   **Goal:** Teach the distinction and why they disqualify standing differently.
      *   **Constraints:**
          *   Don't explain the concepts *to me* (the user knows them); plan *how to teach them*.
          *   Determine dependency order (Standing as entitlement vs. reward).
          *   Identify one carrying example (no "adultery preacher").
          *   Identify misconceptions (e.g., hypocrisy = bad messenger) and when to address them.
          *   Provide a comprehension check (why structural is trickier).
          *   Specify what *not* to explain (avoid deep meta-ethics/speech act theory).

  2.  **Determine Dependency Order (Standing: Entitlement vs. Reward):**
      *   *Option A:* Introduce hypocrisy first, then explain standing. Risk: They think hypocrisy is just about credibility.
      *   *Option B:* Establish standing as a normative *entitlement* (a right to hold accountable) rather than a *reward* for virtue first.
      *   *Reasoning:* If they think standing is a reward for being good, then *any* hypocrisy removes it automatically. But the philosophical point (and the user's point) is that standing is a relational norm. You need the "license to blame" concept before you can understand why hypocrisy revokes it.
      *   *Decision:* Standing as entitlement *must* come first. Otherwise, the distinction between mirror and structural collapses into "how bad is the hypocrite?"

  3.  **Develop the Carrying Example:**
      *   *Constraints:* No adultery/preacher. Needs to support both Mirror and Structural versions. Needs to be sociological enough to resonate (norms, groups, institutions).
      *   *Idea:* Academic/Professional setting.
      *   *Scenario:* A research team or department.
      *   *Specifics:* Data integrity vs. Credit allocation? Or maybe Time/Resource management?
      *   *Selection:* **Citation/Intellectual Debt.** It's relevant to grad students.
      *   *Mirror:* Prof A scolds Grad Student B for failing to cite a precursor, but Prof A also failed to cite that *same* precursor in their own paper.
      *   *Structural:* Prof A scolds Grad Student B for failing to cite a precursor (intellectual free-riding), but Prof A is free-riding on *departmental service* (not doing committee work).
      *   *Why this works:* Both involve "taking without giving back" (the underlying moral form), but one is identical (mirror), one is analogous (structural).
      *   *What it must have:* Clear normative violation, clear blamer/blamee relationship, clear parallel in the blamer's behavior.
      *   *What it must lack:* Extraneous details about the *content* of the work (don't get bogged down in whether the citation was actually needed). Focus on the *act of blaming*.

  4.  **Identify Misconceptions & Timing:**
      *   *Misconception 1:* "Hypocrisy just makes you unconvincing." (Epistemic vs. Normative).
          *   *Timing:* Immediately after introducing standing. If they think it's about persuasion, they won't get the "right to blame" point.
      *   *Misconception 2:* "If you're a hypocrite, you can't ever blame anyone." (The "Clean Hands" fallacy).
          *   *Timing:* When introducing Mirror Hypocrisy. Show that minor/irrelevant faults don't remove standing.
      *   *Misconception 3:* "Structural is just weaker Mirror."
          *   *Timing:* During the comparison phase. This is the crux of the workshop.

  5.  **Drafting the Sequence:**
      *   **Phase 1: The License to Blame (Standing).** Define it as a normative position, not a moral report card.
      *   **Phase 2: The Hypocrisy Challenge.** Introduce the Carrying Example (Mirror version).
      *   **Phase 3: The Structural Twist.** Introduce the Structural version of the Example.
      *   **Phase 4: The Mechanism of Disqualification.** Why do they fail differently? (Commitment vs. Authority).
      *   **Phase 5: Check & Boundaries.** Comprehension check and "Do Not Enter" signs.

  6.  **Refining the "Why Structural is Trickier" Check:**
      *   Mirror is obvious: "You did the *same* thing."
      *   Structural requires interpretation: "Are these *really* the same kind of wrong?" It requires arguing about the *principle* violated, not just the act.
      *   Check question: Ask them to identify the *principle* linking X and Y.

  7.  **Determining What to Exclude:**
      *   No Meta-ethics of Blame (Speech act vs. Emotional attitude).
      *   No Kantian autonomy machinery.
      *   No deep dive into "Moral Error Theory."
      *   Keep it normative/social, not metaphysical.

  8.  **Review against Constraints:**
      *   *Did I explain the concepts to the user?* No, I'm assuming they know them and focusing on pedagogy.
      *   *Is the example fresh?* Yes, citation/service free-riding.
      *   *Is the order logical?* Entitlement -> Hypocrisy -> Distinction.
      *   *Are misconceptions addressed?* Yes, specifically the "messenger" issue.

  9.  **Final Polish:** Ensure tone is appropriate for a workshop plan (actionable, structured). (Self-Correction: Make sure the distinction between *disqualifying* mechanisms is clear. Mirror = Commitment/Implication. Structural = Authority/Consistency of Principle.)

      *Wait, let me refine the "Disqualify Differently" point.*
      *   Mirror: Often viewed as waiving the right because you imply the rule doesn't bind you *in this specific instance*.
      *   Structural: Often viewed as lacking the *authority* because you don't uphold the *general principle*.
      *   Actually, a common philosophical distinction (e.g., Bell, Fritz) suggests Mirror undermines the *non-tu quoque* condition (you are part of the moral community bound by this), while Structural might be about *consistency of authority*.
      *   For sociologists, frame it as: Mirror = "You break the specific rule you're enforcing." Structural = "You violate the *logic* of the system you're policing."
      *   Let's stick to the prompt's intuition: They disqualify differently. Mirror is direct contradiction. Structural is interpretive work.

      *Revised Plan for Disqualification:*
      *   Mirror: The blame *self-defeats* pragmatically.
      *   Structural: The blame lacks *jurisdiction* because the blamer doesn't uphold the governing principle.

      *Okay, let's write the response.*
answer: |-
  Here is a workshop plan designed for sociology grad students. It prioritizes normative structure over moral psychology and avoids meta-ethical rabbit holes.

  ### 1. Dependency Order: Entitlement Before Hypocrisy
  **Do not introduce hypocrisy until you have secured "Standing as Entitlement."**

  If you introduce hypocrisy first, students will default to a psychological interpretation ("hypocrites are annoying/unconvincing"). You need them to view standing as a **normative license** (a social permission to hold someone accountable) rather than a **moral reward** (a badge given to virtuous people).

  *   **Step 1:** Establish that a saint can lack standing (e.g., a parent who abandoned their child cannot blame the child for visiting them) and a sinner can have standing (e.g., a recovering addict can blame an active addict for relapsing).
  *   **Step 2:** Define standing as a relational status within a normative community, not a report card on the blamer's soul.
  *   **Step 3:** *Then* introduce hypocrisy as a specific mechanism that *revokes* that license.

  **Why:** If they think standing is a reward for virtue, *all* hypocrisy looks the same (you're not virtuous, so you lose the reward). If they see it as an entitlement, they can see how different *types* of hypocrisy break the license in different ways.

  ### 2. The Carrying Example: "The Citation & The Committee"
  Avoid the adultery/preacher trope. Use an academic governance scenario. It resonates with their lived experience and isolates the normative structure without sexual/moral baggage.

  **The Scenario:** A Senior Professor (Blamer) calls out a Grad Student (Blamee) during a lab meeting.

  *   **Mirror Version:** The Professor scolds the Student for **failing to cite a specific seminal paper** in their draft. The Professor's own recently published paper **also failed to cite that same seminal paper**.
  *   **Structural Version:** The Professor scolds the Student for **failing to cite a specific seminal paper** (intellectual free-riding/taking credit without acknowledging debt). The Professor is currently **refusing to serve on required departmental committees** (institutional free-riding/taking resources without contributing labor).

  **What this example must HAVE:**
  *   **Clear Normative Violation:** Both parties are clearly breaking a rule/norm.
  *   **Public Blaming:** The act must be a speech act of accountability, not private advice.
  *   **Shared Underlying Form (for Structural):** Both citation neglect and service shirking must be plausibly framed as "free-riding on a shared ecosystem."

  **What this example must LACK:**
  *   **Severity Disparities:** Don't let the Professor's structural fault be *way worse* than the Student's fault (e.g., don't make the Professor a plagiarist). Keep the *weight* of the wrongs similar so the distinction rests on the *type* of hypocrisy, not the magnitude.
  *   **Epistemic Uncertainty:** Don't make it debatable whether the citation was actually needed. Assume the norm is clear.

  ### 3. Sequence & Misconception Management

  **Phase 1: The "Bad Messenger" Trap (0:00–0:15)**
  *   **Activity:** Ask students: "Why do we dislike hypocrites?"
  *   **Misconception:** They will say "They are unconvincing" or "They are lying."
  *   **Intervention:** Stop this immediately. Draw a line between **Epistemic Credibility** (should I believe you?) and **Normative Standing** (are you allowed to say this?).
  *   **Teaching Point:** A hypocrite might be telling the truth (the Student *did* miss the citation). The issue isn't truth; it's authority. Use the analogy of a speed cop: A speeding cop can still ticket you (truth is truth), but if they are racing you to the finish line, they lose the right to ticket you (standing is lost).

  **Phase 2: Mirror Hypocrisy (0:15–0:30)**
  *   **Activity:** Present the **Mirror Version** (Citation vs. Same Citation).
  *   **Discussion:** Why does the Professor lose standing here?
  *   **Key Insight:** This is about **Commitment**. By doing the exact same thing, the Professor implies the rule is optional *for this specific act*. It creates a pragmatic contradiction.
  *   **Sociological Frame:** It undermines the specific norm being enforced.

  **Phase 3: Structural Hypocrisy (0:30–0:45)**
  *   **Activity:** Present the **Structural Version** (Citation vs. Committee Service).
  *   **Discussion:** Does the Professor lose standing here? It feels different. Why?
  *   **Misconception:** Students will argue, "But those aren't the same thing! One is writing, one is service."
  *   **Intervention:** Force them to articulate the **Underlying Moral Form**. If they can agree both are "free-riding on collective goods," the hypocrisy holds. If they can't, the standing remains.
  *   **Key Insight:** This is about **Jurisdiction/Principle**. The Professor isn't contradicting the specific rule; they are violating the *logic* that gives them the authority to police the community.

  **Phase 4: The Disqualification Mechanism (0:45–0:55)**
  *   **Synthesis:** Compare the two failures.
      *   **Mirror:** Disqualifies because the blamer is **exempting themselves from the specific rule**. (The "Do as I say, not as I do" regarding *this* act).
      *   **Structural:** Disqualifies because the blamer fails to uphold the **general principle** required to hold the role of blamer. (The "You don't embody the values you police" argument).
  *   **Crucial Point:** Mirror is usually a harder "stop." Structural requires interpretive work to link X and Y.

  ### 4. Comprehension Check: Why Structural is Trickier
  Do not ask "What is the difference?" Ask them to apply the **Principle Test**.

  **The Check:**
  Present a new case: *A manager fires an employee for being chronically late. The manager is known to chronically miss deadlines.*
  *   **Question:** "To argue this is **Structural** hypocrisy rather than **Mirror**, what argument must you make?"
  *   **Correct Answer:** They must identify the shared principle (e.g., "disrespect for collective time" or "unreliability").
  *   **Incorrect Answer:** "Because they are both late." (That would be Mirror).
  *   **Why this works:** It forces them to see that Structural hypocrisy isn't about the *acts* matching, but about the *normative principle* matching. It requires sociological interpretation (identifying the latent function/norm), which plays to their strengths but tests the philosophical distinction.

  ### 5. What to Flat-Out Refuse to Explain
  Keep the workshop strictly within **Normative Sociology/Philosophy of Action**. Draw a boundary line at the start:

  1.  **The Metaphysics of Blame:** Refuse to discuss whether blame is a speech act, an emotional attitude, or a sanction. Treat blame as a social practice of holding accountable.
  2.  **Moral Ontology:** Do not discuss whether the rules themselves are objective or subjective. Assume the norms (citations, committees) exist and are binding for the sake of the exercise.
  3.  **Kantian Autonomy:** Avoid language about "rational agency" or "universalizability" in the deep Kantian sense. Use "community standards" and "normative consistency" instead.
  4.  **Psychological Intent:** Do not let the discussion drift into whether the hypocrite *knows* they are a hypocrite. Standing is about the social position, not the internal state of the blamer.

  **Closing Instruction:** "We are not analyzing the soul of the hypocrite; we are analyzing the validity of the sanction."
