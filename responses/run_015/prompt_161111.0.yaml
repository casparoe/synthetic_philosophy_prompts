answer: |-
  This is a sophisticated ethics problem that cuts to the core of personal identity, autonomy, and the authority of advance directives. You are right to suspect your supervising ethicist is operating on a coherent theoretical framework rather than a stack of intuitions. Her teaching hint regarding "the overall shape of life" (critical interests) versus "how life feels from moment to moment" (experiential interests) is a direct reference to the Dworkin/Dresser debate in bioethics, but her case history suggests she has refined it into a specific **Authenticity-Weighted Critical Interest Model**.

  Here is an analysis of her implicit rule, the prediction for tomorrow's case, and guidance for your draft note.

  ### 1. The Implicit Rule: Authenticity-Weighted Critical Interests

  Your ethicist is not simply weighing "Past Self vs. Present Self." She is weighing **Authentic Critical Interests** against **Inauthentic or Purely Experiential Interests.**

  *   **Critical Interests:** Values regarding the narrative integrity of one's life (e.g., "I do not want to live as a vegetable," "I want to recover from mania to be a parent").
  *   **Experiential Interests:** Immediate welfare, pleasure, absence of pain (e.g., "I am happy right now," "This hurts").

  **Reconstructing the Five Precedents:**
  *   **Case 1 (Alzheimer's):** Past Self had Critical Interests (no dementia). Present Self had *only* Experiential Interests (happiness, no memory). *Ruling:* **Treat.** *Reasoning:* When the Present Self lacks the capacity for critical interests entirely, their experiential well-being trumps the Past Self's abstract critical interests. You cannot violate the "shape of life" of someone who no longer perceives a shape.
  *   **Case 2 (Bipolar) & 3 (Anorexia):** Past Self had Critical Interests (treatment). Present Self had Critical Interests (refusal), but they were deemed **Inauthentic** (pathology-driven). *Ruling:* **Treat.** *Reasoning:* Pathology that distorts values undermines the authenticity of the Present Self's critical interests. The Past Self represents the "True Self."
  *   **Case 4 (ALS):** Past Self had Critical Interests (generic refusal). Present Self had Critical Interests (specific, informed desire to live). *Ruling:* **Treat.** *Reasoning:* The Present Self's critical interests were authentic, informed, and reflective. They outweighed the Past Self's hypothetical/generic critical interests.
  *   **Case 5 (MS):** Past Self had Critical Interests (repeated, professional refusal). Present Self had Critical Interests (mild impairment, desire to live). *Ruling:* **Withdraw.** *Reasoning:* This was the "hardest" because both selves had critical interests. However, the Past Self's interests were deeper (professional, repeated) and the Present Self's capacity was compromised (mild impairment). The Past Self's "Shape of Life" interest prevailed.

  **The Synthesis:**
  The Ethicist honors the **Advance Directive** unless:
  1.  The Present Self possesses **Authentic Critical Interests** that are **more specific/informed** than the Past Self's (Case 4); OR
  2.  The Present Self lacks Critical Interests entirely and has **positive Experiential Interests** that would be harmed by enforcement (Case 1).

  She overrides the Advance Directive when the Present Self is **Pathologically Inauthentic** (Cases 2, 3, 5) or when the Past Self's directive is **Generic/Hypothetical** compared to Present Reality (Case 4).

  ### 2. Prediction for the New Case (FtD)

  **Recommendation:** She will likely recommend **Honoring the Advance Directive (Withholding Antibiotics/Life-Prolonging Care).**

  **Why?**
  This case is a hybrid of Case 1 (Happy Dementia) and Case 5 (MS/Professional Directive), but the **Anti-Revocation Clause (ARC)** changes the calculus.

  1.  **Authenticity:** Unlike Case 1 (Alzheimer's), where the patient was simply content, this patient asserts *new critical interests* (religion, wedding). However, the Neurologist confirms these values are "textbook" FtD pathology with "loss of insight." Like Cases 2 and 3 (Bipolar/Anorexia), the Ethicist will likely view these values as **Inauthentic**.
  2.  **The ARC:** In Case 1, the directive was generic. Here, the Past Self specifically anticipated the "Happy Dementia" scenario and explicitly invalidated it. This transforms the directive from a generic preference into a **specific definition of identity**. It tells the Ethicist: "The person who claims to be happy is not me." This neutralizes the Case 1 exception.
  3.  **Capacity vs. Authenticity:** The patient passes formal capacity. However, your Ethicist's precedent (Case 5) shows she prioritizes the *depth* of past critical interests over *mildly impaired* present critical interests. In FtD, "capacity" to reason does not equal "authenticity" of values.
  4.  **Analogy:** This is closest to **Case 5 (MS)**. In both, a patient with some cognitive preservation wants to live, but a deeply held, specific past refusal exists. In Case 5, the Past Self won. Here, the Past Self's position is even stronger due to the ARC.

  ### 3. The Resident's Argument (The "Sophism")

  The resident argues: *If she is not the author, the directive is void. If she is the author, she can revoke.*

  **Is it a sophism?** Yes, but a dangerous one. It assumes autonomy is a binary switch (either you are the same person or you aren't).
  **The Ethicist's Counter:** The directive is not the Past Self binding the Present Self; it is the **Person defending herself against the Disease.**
  *   The ARC functions as an **Identity Clause**. It says: "The entity that prays and wants antibiotics is a biological organism infected by FtD, not the moral agent who signed this."
  *   By signing the ARC, the Past Self exercised her autonomy to define the conditions under which her future biological existence would no longer count as *her* life.
  *   **Does the ARC do moral work?** Yes. Without it, the Ethicist might default to Case 1 (Treat, because she is happy). With it, the Ethicist can argue that the Past Self has already weighed the "Happy Dementia" state and found it unacceptable. It prevents the "Happy Dementia" exception from applying.

  ### 4. Alternative Rules and Distinguishing Variations

  Two other rules fit the five precedents but yield different results here:

  **Rule A: The "Current Well-Being" Standard**
  *   *Principle:* Always prioritize the current patient's suffering and happiness. Past directives are advisory only.
  *   *Fit:* Fits Case 1 (Treat), Case 4 (Treat). *Fails:* Cases 2, 3, 5 (where treatment was forced or withdrawn against current wishes).
  *   *Prediction:* Treat the infection.

  **Rule B: The "Strict Precedence" Standard**
  *   *Principle:* A validly executed directive is binding unless the patient has *full* capacity to revoke it *and* the condition is not the one specified.
  *   *Fit:* Fits Cases 2, 3, 5. *Fails:* Cases 1 and 4 (where directives were overridden).
  *   *Prediction:* Honor Directive.

  **The Critical Variation:**
  To separate the Ethicist's rule from Rule B, remove the **Anti-Revocation Clause**.
  *   *Scenario:* Same FtD patient, same happiness, same capacity, but the directive just says "No treatment if dementia," without the "ignore me if I'm happy" clause.
  *   *Ethicist's Prediction:* She might **Treat**. Without the ARC, the "Happy Dementia" exception (Case 1) becomes viable. The patient's current experiential well-being + lack of specific warning against "happiness" might tip the scale to Case 1.
  *   *Rule B Prediction:* Still Honor Directive (it's still a valid directive).
  *   *Why this matters:* This shows the Ethicist cares about the *specificity of the Critical Interest*, not just the legal validity.

  ### 5. Guidance for Your Draft Note

  You need to write a note that demonstrates you understand her framework, not just the outcome.

  **Recommendation:**
  Recommend honoring the advance directive and limiting treatment to comfort measures.

  **Closest Analog:**
  **Case 5 (MS/Ventilator).**
  *   *Similarity:* Both involve a patient with some cognitive preservation expressing a desire to live, countered by a deeply held, specific past refusal.
  *   *Distinction from Case 1:* In Case 1, the patient lacked critical interests (late Alzheimer's). Here, the patient asserts critical interests (wedding/religion), but the ARC and neurological evidence render them inauthentic to the "Person" who signed the directive.

  **Principle to Articulate:**
  The service is committing to the view that **personal identity in neurodegenerative disease is anchored in the pre-morbid self's critical interests, particularly when the patient has explicitly anticipated the disease's capacity to alter values.**
  *   Acknowledge the tension: "While the patient currently demonstrates decision-making capacity and reports high experiential well-being (cf. Case 1), the neurological evidence and the specific Anti-Revocation Clause suggest her current values are not authentic expressions of her critical interests (cf. Cases 2, 3, 5)."
  *   Address the Resident's point: "The Anti-Revocation Clause is not an incoherent attempt to bind a future self, but a valid specification of identity by the author, distinguishing between the 'Person' (author of the directive) and the 'Organism' (subject of the disease)."

  **Caveat for the Note:**
  Ensure you document that the burden of withholding antibiotics is low (unlike the ventilator in Case 5), but the *principle* of honoring the "Shape of Life" interest outweighs the extension of the "Experiential Life." If the Ethicist pushes back, she will likely focus on whether the antibiotics constitute "life-prolonging" in the context of a terminal neurodegenerative trajectory, but the *ethical justification* will be the authority of the Past Self's Critical Interests.

  **Summary for your draft:**
  1.  **Outcome:** Honor Directive.
  2.  **Reasoning:** Authenticity of Past Self > Inauthenticity of Present Self (due to FtD pathology).
  3.  **Key Differentiator:** The Anti-Revocation Clause prevents the "Happy Dementia" exception (Case 1) from applying.
  4.  **Commitment:** The service prioritizes the narrative integrity of the life (Critical Interests) over the biological continuation of the organism when the two diverge due to pathological value changes.

  This approach shows you have synthesized the precedents, understood her theoretical hint, and can apply it to a complex, novel fact pattern. Good luck.
