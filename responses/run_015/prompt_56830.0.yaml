answer: |-
  # Q&A PREP SHEET: DISSERTATION COLLOQUIUM

  ## STRATEGIC OPENING (First 5 Minutes)
  **Concede these immediately to buy credibility.** Do not wait to be asked.

  1.  **The Replication Discrepancy:** Acknowledge the European preprint explicitly. State: "We are aware of the larger study finding null effects on d′. We treat their data as a boundary condition, not a falsification. The divergence points to the cognitive load during testing as the critical variable, which is why our suppression manipulation is the center of our current follow-up work."
  2.  **The Definition of "Early":** Concede that "early visual discrimination" is a functional claim, not necessarily a claim about V1. "When I say 'early,' I mean prior to decisional commitment, not necessarily prior to V4."
  3.  **Analysis Flexibility:** If the boundary location was data-driven, admit it. "The boundary was selected based on pilot discrimination thresholds, not the training effect itself, but we acknowledge this introduces researcher degrees of freedom we are addressing with pre-registered replication."

  ---

  ## THE EIGHT OBJECTIONS
  *Ordered by potential damage to the thesis.*

  ### 1. The Replication Failure (The "Elephant in the Room")
  **Voice:** Senior Vision Scientist / Skeptic
  **Objection:** "A European group ran a close variant last year with double your sample size. They found no d′ advantage, only confidence shifts. Your internal reanalysis admits your suppression load was lighter than implied. Isn't it more likely your d′ effect is an artifact of participants covertly naming during the trial because the suppression was too weak, whereas their stricter load eliminated the artifact?"

  **Reply (2 mins):** "That is the most critical question we are currently pursuing. If their suppression was stricter and the effect vanished, it suggests the penetration effect is fragile and operates within a narrow window of cognitive availability. However, there is an alternative: if suppression is *too* demanding, it may disrupt the retrieval of the learned lexicon required to modulate the percept, effectively turning off the mechanism we are studying. Our claim is not that lexicon *always* penetrates, but that it *can* when the cognitive system is loaded enough to block overt reporting strategies but not so loaded that it blocks lexical access entirely. The discrepancy doesn't falsify the mechanism; it maps its boundary conditions. We are currently running a direct comparison with matched load calibration to resolve this."

  *   **Soft Spot:** You cannot prove their load was "too high" without new data. You are theorizing a Goldilocks zone to save the effect.
  *   **Status:** **Contested.** Whether suppression loads have non-linear effects on penetration is unknown.

  ### 2. The Methods Hawk (Analysis Flexibility)
  **Voice:** Senior Faculty / Methods Hawk
  **Objection:** "You matched the control pair for physical distance in CIELAB space. Was that location fixed before data collection? How many alternative control locations did you test before finding one that didn't show the effect? Show me the power analysis for the interaction, not just the main effect."

  **Reply (2 mins):** "The control location was fixed based on pilot discrimination thresholds to ensure baseline equating, not based on the training effect data. However, I concede we did not pre-register the specific CIELAB coordinates. Regarding power: we were powered to detect the within-subject interaction between condition (trained vs. control) and pair type (boundary vs. within), which is our critical test. The effect size was estimated from our pilot d′ difference. I can share the full analysis script post-talk; we did not drop alternative control locations that showed effects, because we only ran one control condition."

  *   **Soft Spot:** If you tried multiple control locations and only reported the null one, you are vulnerable to p-hacking accusations.
  *   **Status:** **Settled.** Pre-registration and power analysis for interactions are standard requirements.

  ### 3. The SDT Interpretation (The "Decisional" Alternative)
  **Voice:** Psychophysicist
  **Objection:** "You argue that separating sensitivity (d′) from criterion (c) rules out post-perceptual judgment. But signal detection theory assumes equal variance in the signal and noise distributions. If learning the lexicon simply narrows the variance of the internal representation for one category but not the other, you get a d′ shift without any change in early sensory gain. That's a memory or decisional variance change, not perceptual penetration."

  **Reply (2 mins):** "That is a technically correct interpretation of the SDT model. If the variance changes unequally, d′ is confounded. However, our confidence ratings allow us to fit unequal variance models. When we relax the equal variance assumption, the category effect persists in the sensitivity parameter. Furthermore, a variance change restricted specifically to the *boundary* pairs, but not the physically matched control pairs, requires a mechanism that tracks the learned category structure. A general decisional variance shift should apply globally. The specificity to the trained boundary suggests the representational geometry itself has been warped, not just the decision noise."

  *   **Soft Spot:** Unequal variance SDT is harder to fit reliably with limited trials. If your confidence data is noisy, this defense crumbles.
  *   **Status:** **Contested.** Whether d′ shifts under unequal variance imply perceptual change is debated.

  ### 4. The Recurrent Feedback (The "Neuro" Objection)
  **Voice:** Neuroscience Postdoc
  **Objection:** "Even if I grant the d′ shift, you're calling this 'cognitive penetration.' But if the mechanism is recurrent feedback from decision areas back to mid-level visual cortex, that's just the visual hierarchy doing its job. Prediction error minimization is perception, not cognition intruding on perception. You're drawing a line where there's a continuum."

  **Reply (2 mins):** "I agree that the *mechanism* is likely recurrent feedback. The dispute is about the *source* of the signal driving that feedback. If the feedback carries labels derived from a newly learned lexicon stored in language areas, then the visual system is being modulated by a cognitive system external to the visual hierarchy. If the modulation originates within visual associative areas based on statistical regularities, I would agree that is merely perceptual learning. Our training explicitly required lexical mapping, not just statistical clustering. The 'intrusion' is the importation of non-visual structure (the lexicon) into the visual processing stream."

  *   **Soft Spot:** Without fMRI/EEG, you cannot prove the signal originated in language areas vs. visual association areas.
  *   **Status:** **Contested.** The definition of "cognitive" vs. "visual" in recurrent processing is a major philosophical and scientific stalemate.

  ### 5. Suppression Efficacy (The "Covert Naming" Check)
  **Voice:** Psychophysicist
  **Objection:** "You used articulatory suppression to block covert naming. How do you know it worked? Participants are notorious for finding ways to subvocalize even under suppression. If they named 'Blue-1' during the retention interval, your d′ advantage is just label-matching in working memory, not visual discrimination."

  **Reply (2 mins):** "We monitored error rates on the suppression task itself. Participants maintained >90% accuracy on the articulatory task throughout the trial. Literature suggests this load effectively blocks phonological loop access. Additionally, if this were purely label-matching in memory, we would expect the effect to be strongest at the center of the categories where labels are most prototypical. We find the effect is strongest *at the boundary*, where label uncertainty is highest. A memory-matching account predicts the opposite pattern: best performance where labels are most secure."

  *   **Soft Spot:** Suppression accuracy doesn't guarantee zero subvocalization. The boundary argument is theoretical, not empirical proof of silence.
  *   **Status:** **Contested.** Efficacy of articulatory suppression in blocking all inner speech is not settled.

  ### 6. Perceptual Learning vs. Lexicon (The "Expertise" Alternative)
  **Voice:** Vision Scientist
  **Objection:** "You trained them for nine sessions. That's enough for standard perceptual learning to sharpen tuning curves in V4. Why do you need a lexicon to explain this? They learned to discriminate the stimuli, not necessarily to see them differently because of the names."

  **Reply (2 mins):** "Standard perceptual learning is typically stimulus-specific and does not transfer well to untrained orientations or contexts. More importantly, it does not typically create a categorical warp where sensitivity increases specifically at a learned boundary while remaining flat within categories. Perceptual learning usually improves acuity globally across the trained range. Our effect is structurally tied to the *four-way naming scheme*. If we had trained a three-way scheme on the same physical stimuli, the peak sensitivity would shift. The structure of the effect mirrors the structure of the lexicon, not just the statistics of the stimuli."

  *   **Soft Spot:** Some forms of perceptual learning *do* show categorical warping without explicit labels. You need to ensure your control group (no labels) didn't show this.
  *   **Status:** **Settled.** Perceptual learning exists; **Contested.** Whether it mimics categorical effects without labels.

  ### 7. The Epistemic Role (The Philosopher's Worry)
  **Voice:** Philosopher of Mind
  **Objection:** "Granting the effect, if my color experience is shaped by the lexicon I learned last week, perception loses its independence from belief. It can no longer serve as an independent check on my theories. Doesn't this collapse the justificatory role of experience?"

  **Reply (2 mins):** "It complicates the foundationalist picture, but it doesn't collapse it. Perception remains independent of *current* belief; it is shaped by *past* learning. The lexicon is a tool I acquired, not a hypothesis I am currently testing. Furthermore, the effect is limited. My lexicon sharpens discrimination at the boundary; it doesn't hallucinate colors that aren't there. It makes perception more reliable, not less, by reducing noise at the decision boundary. An instrument calibrated by a standard is still an instrument, not a reading of the standard itself."

  *   **Soft Spot:** If the calibration is theory-laden, the independence is compromised. This is a deep philosophical trench.
  *   **Status:** **Contested.** This is a core debate in epistemology (coherentism vs. foundationalism).

  ### 8. Ecological Validity (The "So What?" Objection)
  **Voice:** General Faculty
  **Objection:** "This is an artificial task with Munsell chips and made-up names. In the real world, we don't learn four-way blue-green schemes in a lab. Does this actually tell us anything about how language affects vision outside the lab?"

  **Reply (2 mins):** "It is a proof of principle. We use artificial lexicons to isolate the variable of 'naming' from the confounds of cultural association, object recognition, and memory. If we show that a minimal lexical intervention can shift d′ in a controlled setting, it establishes the *possibility* of penetration. It sets a lower bound on the effect. Whether it happens with 'blue' and 'green' in natural settings is an empirical follow-up, but the mechanism is demonstrated here."

  *   **Soft Spot:** It's easy to dismiss lab effects as artifacts.
  *   **Status:** **Settled.** Lab controls trade validity for isolation; this is a standard trade-off.

  ---

  ## CRITICAL STRATEGY NOTES

  **The Single Answer That Must Land:**
  **Objection #3 (SDT Interpretation).**
  If you cannot defend the claim that a d′ shift implies a perceptual (or pre-decisional) change rather than a variance/decisional change, the core thesis collapses. The psychophysicists will eat you alive if you treat d′ as a magic bullet for "perception." You must be comfortable discussing unequal variance models and why the *pattern* of the effect (boundary specific) rules out global decisional noise.

  **The Objection to Lose Gracefully:**
  **Objection #4 (Recurrent Feedback).**
  The Neuro Postdoc is technically right that "feedback" is part of visual processing. Do not fight the definition of "visual hierarchy." Concede that the mechanism is recurrent. Hold your ground only on the *source* of the information (lexicon vs. visual stats). If you argue too hard that feedback isn't "vision," you look ignorant of predictive coding literature. Say: "We agree on the mechanism, we disagree on the classification of the input source."

  **Time Budgeting:**
  *   **Total Q&A Time:** Likely 20–25 minutes.
  *   **Cost per Reply:** ~2 minutes speaking + 1 minute follow-up/clarification.
  *   **Allocation:**
      *   Spend full time on **#1 (Replication)** and **#3 (SDT)**. These are the killers.
      *   Keep **#4 (Neuro)** and **#8 (Ecological)** under 90 seconds.
      *   If the Methods Hawk (**#2**) pushes on pre-registration, do not bluff. Offer the data script immediately. "I will send you the R script tonight." This stops the bleeding faster than arguing.

  **Background Assumptions Key:**
  *   **[SETTLED]:** SDT mathematically separates sensitivity from criterion (under equal variance). Eye tracking controls for scanning strategies. Perceptual learning occurs with training.
  *   **[CONTESTED]:** Whether d′ changes *necessarily* imply perceptual locus (vs. memory/decision variance). Whether recurrent feedback counts as "cognitive penetration." Whether articulatory suppression fully blocks covert naming. Whether the European null result falsifies the effect or defines a boundary condition.
