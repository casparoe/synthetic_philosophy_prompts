answer: |-
  Here is the preparation pack for your interview with Professor Halvorsen.

  ### Part 1: The Brainstorm (15 Pressure Points)

  1.  **The Partition Justification:** Why is "identity" ontologically different from "state of nature" in a decision matrix?
  2.  **Source Dependence:** Does preferring a coin flip based on *who* flips it violate description invariance?
  3.  **Dynamic Consistency:** If identity is resolved before the state, does her preference reverse mid-stream?
  4.  **The MAD Functional:** Why Mean Absolute Deviation? Why not Variance (more standard in risk) or Gini (more standard in inequality)?
  5.  **Pigou-Dalton Transfer:** Does her MAD term satisfy the principle that transferring from rich to poor improves welfare?
  6.  **Leveling Down:** Can a high $\lambda$ prefer a world where everyone is miserable but equal over one where everyone is happy but unequal?
  7.  **Ex-Ante vs. Ex-Post:** She penalizes inequality in *expectations*. Does she care if the coin lands and one person starves?
  8.  **Anchor Selection:** Who chooses the "severe pain" and "mild contentment" anchors?
  9.  **Anchor Morality:** Is fixing the anchor gap to 1 a measurement convention or a moral claim about the value of relief?
  10. **Anchor Sensitivity:** What if a stoic has a tiny utility gap between the anchors? Do they count for less?
  11. **Variable Population:** Harsanyi assumes fixed $N$. Does her MAD term break if we add a person?
  12. **Weights ($w_i$):** If the veil doesn't justify the weights, where do they come from? (She might dodge this, but worth noting).
  13. **Falsifiability:** Is $\lambda$ a parameter to be estimated or a moral constant?
  14. **The "Axiom" Dodge:** If I reject the independence-violation axiom, have I made a logical error or a moral one?
  15. **The "Heuristic" Dodge:** If the veil is just a story, what doing the normative heavy lifting?

  ### Part 2: The Cut (9-10 Questions)

  **Dropped:**
  *   *Dynamic Consistency (3):* Too technical for a generalist podcast; risks getting bogged down in tree-nodes.
  *   *Pigou-Dalton (5):* Redundant if we ask about the form of MAD (4).
  *   *Weights (12):* She leans on the veil for weights; focus on the *innovation* ($\lambda$ and Partition).
  *   *Anchor Sensitivity (10):* Merged into the main Anchor question to save time.

  **The Running Order:**
  1.  **The Partition:** State vs. Identity.
  2.  **Source Dependence:** Follow-up on why identity is special.
  3.  **Form of Fairness:** Why MAD?
  4.  **Ex-Ante/Ex-Post:** The realization problem.
  5.  **Leveling Down:** The arithmetic trap.
  6.  **Anchor Normalization:** Measurement vs. Morality.
  7.  **Variable Population:** The fixed $N$ problem.
  8.  **Falsification:** What changes $\lambda$?
  9.  **The "Axiom" Dodge:** Closing the escape hatch.
  10. **The "Heuristic" Dodge:** The final trap.

  ---

  ### Part 3: The Script (Running Order)

  **Host Note:** *Keep your tone curious, not combative. You are a decision theorist peer, not a prosecutor. If she cites Diamond on Q1, acknowledge he's right—that's not a win for you, that's common ground.*

  #### Q1: The Partition (State vs. Identity)
  **You:** "Professor, let's start with the engine of the book: *Partitioned Independence*. You're keeping vNM independence for states of nature—will the dam hold—but dropping it for identity—who gets the house. In the standard veil-of-ignorance model, 'who I am' is just another state of the world I don't know. Why does the math need to treat identity uncertainty as a different species than state uncertainty?"
  **Likely Answer:** She'll say identity is special because fairness is a relation between *persons*, not between *worlds*. State uncertainty is about risk; identity uncertainty is about distribution.
  **Follow-up:** "Okay, but suppose I describe the same prospect two ways. In one, I say 'Nature picks a winner.' In the other, I say 'We draw a name from a hat.' The probabilities are identical. If my social ordering flips based on whether I call the uncertainty 'state' or 'identity,' haven't I violated description invariance? Where do you draw the line on what counts as an identity-constituting partition?"

  #### Q2: Source Dependence (The "Why" Follow-up)
  **You:** "I want to press that line. If I'm behind the veil, I don't know if I'll be Alice or Bob. That feels like risk to me. If you allow me to be risk-averse about my income, why aren't I allowed to be 'fairness-averse' about my identity using the same independence axiom? What makes the *source* of the uncertainty morally salient enough to break the axioms?"
  **Likely Answer:** She'll argue that risk aversion is self-regarding (I don't want to lose), while fairness is other-regarding (I don't want us to be unequal). Independence captures rational self-interest, not moral concern for others.
  **Follow-up:** "So the Independence axiom is purely a constraint on rational self-interest, not on moral reasoning? That seems to concede that Harsanyi's theorem was never a moral theorem to begin with. Is *Partitioned Independence* actually fixing Harsanyi, or just admitting he was solving the wrong problem?"
  *(**Back Off Flag:** If she cites Diamond (1967) here, let her ride. Diamond made exactly this point: Harsanyi conflates social risk with individual risk. Don't fight a settled literature battle; pivot to her specific solution.)*

  #### Q3: Form of Fairness (Why MAD?)
  **You:** "Let's look at the functional form. You penalize inequality using Mean Absolute Deviation—MAD—of expected utilities. Why MAD? In finance, we use Variance. In development economics, we use Gini or Theil. Is there an axiom that pins down MAD specifically, or did you choose it because it makes the linearity work?"
  **Likely Answer:** She'll likely say MAD preserves linearity in the probabilities better than Variance (which is quadratic), making the representation tractable, and it satisfies the transfer principle.
  **Follow-up:** "But MAD treats a transfer from the richest to the middle the same as middle to poorest, whereas most inequality indices care about *where* in the distribution the transfer happens. Are you willing to accept that your fairness metric is blind to the bottom, provided the mean deviation stays the same?"

  #### Q4: Ex-Ante vs. Ex-Post (The Realization)
  **You:** "Here's a worry about the 'coin flip' case. Your functional looks at dispersion in *expected* utilities. So if I flip a coin to give a kidney to Alice or Bob, their ex-ante prospects are equal, so your MAD term is zero. You call that fair. But once the coin lands, one lives and one dies. That's maximally unequal ex-post. Does your theory care about the inequality of the *outcome*, or only the inequality of the *chance*?"
  **Likely Answer:** She'll argue that ex-ante fairness is what the social planner controls; ex-post outcomes are realized luck. We can't penalize bad luck, only unfair prospects.
  **Follow-up:** "But if I can structure the prospect as 'give to Alice' or 'give to Bob' without the coin, the ex-ante inequality is high. If I add a coin, ex-ante inequality vanishes. Are you saying the *act of randomizing* creates moral value, even if the physical outcome is identical to the deterministic case?"

  #### Q5: Leveling Down (The Arithmetic)
  **You:** "I did some napkin math on the leveling-down objection, and I want to check it with you. Two people, equal weights. Option A: utilities (1, 0.9). Option B: utilities (0.85, 0.85). Everyone is worse off in B, but it's equal. With your formula, if $\lambda$ is greater than 4, society prefers B. We are burning utility just to buy equality. Is that a feature or a bug? Can $\lambda$ get that high?"
  **Likely Answer:** She'll say it's a feature. Egalitarianism *does* imply some leveling down. If you reject leveling down, you aren't an egalitarian. $\lambda$ represents the strength of that commitment.
  **Follow-up:** "Okay, but if $\lambda$ is a constant, does that mean for *any* large enough utility gap, you'd prefer everyone starve equally rather than some eat well? Is there no threshold where total welfare trumps equality, or is your theory lexically prior on fairness?"

  #### Q6: Anchor Normalization (Measurement vs. Morality)
  **You:** "Let's talk about interpersonal comparability. You solve this with 'anchor normalization'—scaling everyone's utility so the gap between 'severe pain' and 'mild contentment' is 1. Is choosing those anchors a measurement convention, like picking meters over feet? Or is it a moral stipulation that relief from pain is the 'unit' of social concern?"
  **Likely Answer:** She'll argue it's a measurement convention required to make the math work, based on shared human phenomenology.
  **Follow-up:** "But if I choose different anchors—say 'mild contentment' vs 'ecstatic joy'—my $\lambda$ changes. If the anchors determine the scale of inequality, doesn't choosing the anchors effectively choose the level of inequality aversion? Aren't you smuggling the moral decision into the measurement step?"

  #### Q7: Variable Population (Fixed N)
  **You:** "Harsanyi's theorem assumes a fixed population. Your MAD term divides by $N$ implicitly. What happens if we add a person? If I add a third person with average utility, does the inequality penalty for the original two change? Does your theory handle variable population, or does it break like the original theorem?"
  **Likely Answer:** She'll admit it's currently fixed-$N$ but suggest it can be extended by normalizing MAD per capita.
  **Follow-up:** "But if you normalize per capita, adding a happy person might lower the average deviation and make an unequal world look better. Have you checked if your extension triggers the Repugnant Conclusion? Does $\lambda$ save you from Parfit, or do you need a separate fix?"

  #### Q8: Falsification (What Changes Your Mind?)
  **You:** "I want to ask about the status of $\lambda$. Is it a parameter we estimate from observed social choices, like a risk coefficient? Or is it a moral constant we derive from reasoning? What could you see—an axiom failure, a case, an empirical finding—that would make you set $\lambda$ to zero and go back to Harsanyi?"
  **Likely Answer:** She'll likely say it's a moral parameter, not empirical. It reflects our reflective equilibrium.
  **Follow-up:** "If it's not empirical, and the axioms are chosen to fit the result, how is this different from just writing down the function you wanted and reverse-engineering the axioms? What work is the theorem doing if the moral heavy lifting is all in $\lambda$?"

  #### Q9: The "Axiom" Dodge (Closing the Hatch)
  **You:** "I've read some of your replies to critics where you say, 'That's an axiom choice, not an objection.' If I say 'I reject the axiom that allows violating Independence for identity,' you can say 'Then you reject the theory.' But doesn't that make the theory unfalsifiable? If every objection is just a preference for different axioms, what constrains the theory?"
  **Likely Answer:** She'll say axioms are the language of the theory. Rejecting them is like rejecting Euclidean geometry because you prefer non-Euclidean. It's a different model, not a refutation.
  **Follow-up:** "But in welfare economics, the axioms are supposed to be compelling moral truths, not just geometric postulates. If the only defense of the axiom is that it yields the result we like, haven't we turned decision theory into just a formalization of intuition?"

  #### Q10: The "Heuristic" Dodge (The Final Trap)
  **You:** "Last one. When pressed on the veil-of-ignorance derivation for the weights, you've said, 'The veil is only a heuristic, what matters is the axiomatic structure.' But if the veil isn't doing the work, where do the weights $w_i$ come from? If they aren't from the veil, and they aren't from the axioms, aren't they just arbitrary? Can you ground the weights without the heuristic you're willing to discard?"
  **Likely Answer:** She'll argue the weights come from democratic process or legal rights, and the axioms just structure how we aggregate them.
  **Follow-up:** "So the axioms handle the fairness ($\lambda$), but politics handles the weights ($w_i$)? If so, isn't *Partitioned Independence* incomplete? You've solved the inequality problem, but you've left the weighting problem unsolved. Is the book's claim that we can separate those two problems, or that you've solved both?"

  ---

  ### Producer Notes / Host Tips

  *   **Where she might be right:** On Q1/Q2 (Diamond's Critique). If she points out that Harsanyi *did* conflate social risk with individual risk, acknowledge it. "You're right, Diamond showed that in '67. My worry is whether your partition solves it or just moves it." This makes you look informed, not dogmatic.
  *   **Where to push hard:** Q6 (Anchors) and Q9/Q10 (The Dodges). This is where the theory is most vulnerable to "just-so" storytelling. If she retreats to "it's a model," press on whether it's a *normative* model or a *descriptive* one.
  *   **Time Management:** If you run long, cut Q7 (Population). It's important but technical. Q5 (Leveling Down) is the most "podcast-friendly" because the arithmetic is concrete. Keep that.
  *   **Tone Check:** If she gets defensive on the "Axiom Dodge," soften. "I'm not asking you to abandon the axiom, I'm asking what justifies it to someone who doesn't share your intuition."
