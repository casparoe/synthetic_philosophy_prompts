      *   *Check:* Is David too dismissive? *Correction:* Make him admit that natural language isn't formal logic. He should respect the School of Names as logicians, not sophists.
      *   *Check:* Taxonomy analogy. David might say "Subspecies are still the species." Lin needs to counter: "But if I ask for the subspecies, the species isn't enough."
      *   *Check:* "Not Horse." Ensure they distinguish between "is not a member of the class Horse" and "is not identical to the concept Horse."

  6.  **Writing the Dialogue (incorporating specific constraints):**
