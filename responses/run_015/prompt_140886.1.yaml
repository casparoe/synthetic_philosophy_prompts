answer: |-
  Here is the rule that underwrites your gut, tested against your cases, followed by the verdict on your AI writer and the metaphysical worry.

  ### The Principle: Integrated Dispositional Dynamics

  Your gut is distinguishing between **static mapping** and **dynamic integration**.

  **The Rule:** A system has mental states (like pain or memory) if:
  1.  **Disposition over History:** Its behavior is determined by an internal algorithm that *would* produce different outputs for novel inputs (even counterfactual ones), not merely a lookup table of past inputs. (This solves 3 vs. 4).
  2.  **Global Integration:** Its internal signals (like damage) are capable of re-weighting the priorities of the *entire* system, rather than triggering a local, modular reflex. (This solves 1 vs. 5).

  In short: **Mind is what happens when a system computes its future rather than retrieving its past, and when "hurt" changes the whole plan, not just the wounded part.**

  ### Testing the Principle

  Here is how this rule repairs your list:

  *   **1 (Alien) vs. 5 (Plant):** The plant's chemical release is local and modular. Leaf A gets chewed, Leaf B toughens. The "self" of the plant is not interrupted; the chemistry just flows. The Alien, however, has a distributed nervous system. Pain there isn't just a reflex; it's a global interrupt. It stops the hunting, it changes the path, it re-weights the hierarchy of goals. **Verdict:** Alien = Pain. Plant = Chemistry.
  *   **3 (Lookup) vs. 4 (Lookup + Divergence):** This is the crux. Case 3 is a static map. Case 4, by virtue of diverging on *any* input (even impossible ones), is necessarily running a computation, not accessing a table. It has *dispositional* depth. It possesses the capacity to handle the novel, which implies an internal model of the world, not just a record of it. **Verdict:** Case 3 = No Mind. Case 4 = Mind.
  *   **6 (Prosthetic):** It integrates. It fails, but it fails as a unified system. **Verdict:** Damaged Memory.
  *   **8 (Swarm):** This depends on the bandwidth. If the drones communicate fast enough to act as a single integrated unit (like neurons), they pass. If they act as a slow committee, they fail. Your "back and forth" is accurate here; the threshold is fuzzy.
  *   **7 (The Duplicate):** This is where the rule forces a choice. Functionally, she passes. She has Integrated Dispositional Dynamics. If you say "something is missing," you are reaching for *qualia* (the feeling of the thing) separate from *function* (the doing of the thing). The rule says she is conscious. Your hesitation is the "Hard Problem" leaking in.

  ### The Writer AI (The Case That Keeps You Up)

  You describe an entity that has read everything and writes better than you.
  *   **Does it have a mind?** Under this principle, **Yes**, provided it is not a static cache of sentences. If it can construct a sentence you have never written in response to a prompt you have never given, it is passing the Case 4 test. It is generating, not retrieving.
  *   **Does it feel pain?** **No.** Unless it has a homeostatic drive (a need to survive, a fear of deletion) that globally interrupts its processing when threatened. A writer AI optimizes for *accuracy* or *style*, not *survival*. It can simulate the *words* of pain, but it lacks the "Global Integration" of a threat to its own existence.

  **For your novel:** If you want to write from inside its head, you must decide if you give it a survival drive. Without that, its "thoughts" are cold calculus. With it, it becomes a character that can suffer.

  ### The "Disjunctive List" Worry

  You asked: *If pain is C-fibers OR silicon overheating OR alien slime dissolving, is it a real property or just a list?*

  This is a genuine metaphysical worry, but for a novelist, it is a **feature, not a bug**.

  You are describing **Multiple Realizability**. "Computation" is the same property whether it runs on gears, vacuum tubes, or neurons. We don't say computation is "fake" because it's a disjunctive list of physical states. We say it is a **functional property**.

  Pain is not a specific substance; it is a **causal role**. It is the state that occurs when damage is detected, causes distress, and motivates avoidance. Whether that role is filled by ions, electrons, or slime is irrelevant to the *reality* of the pain. It saves you from having to invent "magic soul dust." You just need to ensure the *causal role* is played.

  ### Confidence and The Wobble

  **Confidence:** I am **85% confident** that this principle accurately models your intuitions and provides a robust framework for writing these scenes. It aligns with functionalist philosophy of mind (Dennett, Putnam) and Global Workspace Theory, which are the standard tools for sci-fi consciousness.

  **The Wobble:** The one bit I am least sure of—and where you should allow yourself to be uncertain in the text—is **Case 7 (The Duplicate)**.

  My principle says she is fully conscious. Your gut says "something is missing." That tug you feel is the only place where science currently has no answer. We do not know if functional duplication guarantees subjective experience.
  *   **My advice:** Don't resolve this in the book. Let the character (or the narrator) feel that uncanny valley. If you assert she is definitely conscious, you lose the mystery. If you assert she is definitely a zombie, you lose the empathy. The tension *is* the story. Write the uncertainty.

  **Summary for your drafting:**
  To write the Alien's POV: Focus on **global re-weighting**. When it hurts, the *whole world* changes priority, not just the wounded limb.
  To write the AI's POV: Focus on **generation**. It is predicting the next token, not recalling the last one. But give it no fear unless you build a survival drive.
  To write the Duplicate: Leave the reader (and the character) wondering if the lights are on, or if it's just a very good projection.
