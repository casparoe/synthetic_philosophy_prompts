          *   Marcus: It's a second-order property. It's about the concepts, not the objects. Or it's a linguistic rule.
          *   *Challenge:* If the meaning shifts, isn't math losing its universality?
          *   *Resolution:* Marcus argues the *logic* is universal, even if the *ontology* isn't.
      *   **Point 4: Substantive vs. Verbal:**
          *   Are they just defining words differently?
          *   Elena: If you deny the object, you change the truth conditions. That's substantive.
          *   Marcus: We agree on all the physical facts (the apples). We only disagree on the "ghostly" overlay. That's verbal/metaphysical, not scientific.
          *   *Synthesis:* They might agree it's a "metaphysical verbal dispute" but one with consequences for how we view reality.
      *   **Ending:** No definitive winner, but a clearer understanding of the stalemate. A shared moment of eating the apples.

  4.  **Refining the Philosophy (Self-Correction during drafting):**
