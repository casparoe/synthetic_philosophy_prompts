          *   Elena: To say "three" is true, the number 3 must exist.
          *   Marcus: No, I'm just talking about the apples. The "three-ness" isn't a *thing*.
          *   *Refinement:* Use the Quinean criterion ("to be is to be the value of a bound variable"). Elena will likely invoke this. Marcus needs a counter-strategy (paraphrase).
      *   **Point 2: The Nominalist Paraphrase:**
          *   Marcus needs to explain *how* he analyzes the sentence without numbers.
          *   Idea: Logical quantifiers. "There is an apple x, and an apple y, and an apple z, and x is not y, and y is not z..." etc.
          *   Elena's pushback: That's clunky. And doesn't "there exists" still imply existence?
          *   Marcus: Existence of *concrete* things, not abstract things.
