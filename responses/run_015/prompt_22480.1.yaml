      *   **Nominalist (Marcus):** Denies abstract objects. Sees math as a tool or linguistic convention. Values ontological parsimony (not multiplying entities beyond necessity).
      *   **Dynamic:** They should be friends or colleagues, respectful, trying to pin down *why* they disagree, not just shouting past each other.

  3.  **Drafting - Section by Section:**

      *   **Setting the Scene:** Kitchen, apples on the table. Immediate engagement with the physical objects.
      *   **Opening Salvo:** Elena makes a simple statement ("There are three apples"). Marcus challenges the implication.
