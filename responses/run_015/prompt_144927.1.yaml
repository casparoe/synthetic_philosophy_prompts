      *   **The Restoration Case (Ship of Theseus variant):** Material replacement over time.
      *   **Partner's Use:** Shows persistence is social/institutional, not material. Implies Statue and Lump are just phases.
      *   **User's Use:** Shows persistence relies on causal/historical continuity of form, distinguishing it from mere matter.

