answer: |-
  This is a classic debate in analytic metaphysics, specifically touching on the **Puzzle of Material Constitution**. You two have inadvertently recreated a significant portion of the 20th-century literature on this topic (from Gibbard to Baker to Thomasson).

  Here is the breakdown of your exchange, evaluating the logical strength of each move, followed by a verdict on the three specific questions you asked.

  ### Move-by-Move Analysis

  **Move 1: The Identity Claim (Leibniz's Law vs. Morning Star)**
  *   **You:** Argued for **Non-Identity** based on divergent persistence conditions (modal properties). If Statue could not survive squashing but Lump could, they have different properties. By Leibniz's Law (Indiscernibility of Identicals), if $x$ and $y$ have different properties, $x \neq y$.
  *   **Partner:** Argued for **Identity** using the Morning Star/Evening Star analogy. She claims they are one object under different descriptions.
  *   **Evaluation:** **You win this move.** Your partner's analogy is category-confused. "Morning Star" and "Evening Star" are rigid designators for the planet Venus. Venus exists independently of our descriptions. However, "Statue" is a *sortal concept* that implies specific conditions of existence (form, function, history). If you scratch Venus, it is still Venus. If you squash the Statue, it is *no longer a statue*. The Morning Star analogy fails because it ignores that artifact terms (Statue) carry essential constraints that material terms (Lump) do not. To maintain identity here, your partner would have to deny Leibniz's Law or argue for "Relative Identity" (a niche, controversial view she hasn't actually articulated).

  **Move 2: The Restoration Case (Diachronic vs. Synchronic)**
  *   **Partner:** Uses the restoration case (Ship of Theseus style) to argue that because the statue survives material replacement, persistence is institutional, not material. She concludes this collapses the distinction between Statue and Lump.
  *   **You:** Counter that restoration requires a causal-historical chain, proving form/history matters more than matter.
  *   **Evaluation:** **You win this move, but she identified a real complexity.** Your partner is conflating **Synchronic Constitution** (Statue vs. Lump at time $t_1$) with **Diachronic Persistence** (Statue at $t_1$ vs. Statue at $t_{50}$).
      *   The Statue/Lump problem asks: *Are these two things the same object right now?*
      *   The Restoration problem asks: *Is this the same object as the one that existed 50 years ago?*
      *   Even if the Statue survives total material turnover (Diachronic), it does not prove Statue = Lump (Synchronic). In fact, it proves the opposite: if the Statue survives the replacement of the atoms, the Statue is **not identical to the matter**. Since "Lump" is typically defined by the matter itself, the restoration case actually drives a wedge between them. If the matter is replaced, you have a *new* lump constituting the *same* statue.

  **Move 3: Social Tracking and "Epicycles"**
  *   **Partner:** Claims persistence conditions are institutional, implying the distinction is arbitrary.
  *   **You:** Claim the institutional rules (artistic-causal chain) enforce the distinction. She calls this "epicycles."
  *   **Evaluation:** **You are philosophically safer here.** Your partner is gesturing toward **Artifact Abstractionism** (the idea that artifacts exist only relative to social practices). While it is true that statues are mind-dependent entities (unlike clay), this does not make the distinction between Statue and Lump arbitrary. The social rules *create* the Statue as a distinct ontological category with different rules than the Lump. Calling your defense "epicycles" is a rhetorical dismissal; you are actually describing the **sortal conditions** that define the object.

  ---

  ### The Verdict

  Here are the answers to your three specific questions, based on the strength of the arguments provided.

  #### 1. Who is right about the identity claim?
  **You are right.** The claim that Statue and Lump are strictly identical is logically untenable without rejecting Leibniz's Law.
  The "Different Persistence Conditions" argument is the standard, dominant objection to the Identity Theory in contemporary metaphysics. If the Lump can survive being squashed and the Statue cannot, they possess different modal properties. Two things with different properties cannot be one and the same object. Your partner's "Morning Star" defense fails because it treats artifact terms as if they were rigid designators of natural kinds, which they are not. The Statue is essentially formed; the Lump is essentially material.

  #### 2. Does social tracking undermine material constitution?
  **No, and your partner is drawing the wrong inference.**
  Your partner is correct that artifacts rely on social/institutional tracking (a view championed by philosophers like Amie Thomasson). However, she thinks this *collapses* the distinction between Statue and Lump. In reality, social tracking **enforces** the distinction.
  The "institution" of art dictates that a statue ceases to exist if its form is destroyed, while the "institution" of mereology (or basic physics) dictates the clay survives. The fact that these tracking rules differ proves they are tracking *different things*. Social dependence doesn't make the objects identical; it explains *why* their persistence conditions diverge. You were right to insist that the causal-historical chain matters; that chain is what individuates the Statue from the Lump.

  #### 3. What does the restoration case actually show?
  **It shows that artifacts are functionally/historically defined, not materially defined.**
  Your partner tried to use the restoration case to prove that material constitution doesn't matter. She is half-right: the *specific* atoms don't matter for the Statue's identity over time. But she is wrong to think this helps her Identity claim.
  The restoration case demonstrates that the Statue is a **continuant** defined by its history and form, whereas the Lump is a **continuant** defined by its matter.
  *   If you replace the clay, the Lump ceases to exist (it's a new lump of matter).
  *   If you replace the clay (carefully), the Statue survives.
  This proves they have different identity conditions. The restoration case is actually evidence *against* your partner's view. It shows that the Statue is more robust than the matter in one sense (survives replacement) but more fragile in another (cannot be squashed). This divergence confirms they are not identical.

  ### What You Are Both Missing

  While you won the argument, there is a nuance both of you glossed over that would deepen your understanding:

  **1. Constitution is not Identity.**
  You both seem to assume the only options are "They are the same object" (Partner) or "They are totally different objects" (You). The dominant view in metaphysics (The Constitution View) is a middle ground: The Lump **constitutes** the Statue at time $t$, but is not **identical** to it. They share the same space and matter, but are distinct objects because they belong to different **Kinds** (Sortals). You need to be comfortable saying: "They are two distinct objects that coincide spatially."

  **2. The Sortal Dependence of Persistence.**
  You argued that form matters more than material. Your partner argued social rules matter. The synthesis is: **Sortal concepts determine persistence.**
  "Statue" and "Lump" are sortals. They tell you *what* the thing is. Once you know what kind of thing it is, you know how it persists. The restoration case doesn't show persistence is "arbitrary"; it shows persistence is **sortal-relative**. The museum curators track the *Statue-sortal*, not the *Clay-sortal*.

  **Summary:** Stick to your guns. Your application of Leibniz's Law is the standard, logically robust position. Your partner is conflating diachronic replacement with synchronic identity and mistaking the social origin of artifacts for the identity of the objects themselves. The restoration case proves that Statues are not their matter, which supports your view that Statue $\neq$ Lump.
