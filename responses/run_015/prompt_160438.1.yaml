answer: |-
  This is one of the sharpest questions currently being asked in the philosophy of mathematical practice. You have correctly identified that the standard philosophical binaries (formalism vs. platonism, constructivist vs. classical) fail to capture the actual sociological behavior of mathematicians.

  Your triad—**Certificate, Warrant, Equipment**—is not just a "vibe." It maps closely onto a sophisticated debate in contemporary philosophy of mathematics, specifically the shift from *proof as verification* to *proof as explanation*.

  Here is a reconstruction of the implicit theory, an analysis of where it is underdetermined, and a forecast of what happens if the presupposition drops.

  ### 1. Reconstructing the Implicit Theory: Proof as Conceptual Technology

  The practice you observe presupposes a theory of proof that is **pragmatist and inferentialist**, not merely truth-functional.

  In the implicit theory of the working mathematician, a proof is not primarily a guarantee of truth (Certificate). Truth is a baseline constraint, but it is not the *value proposition*. The value proposition is **conceptual integration**.

  *   **Certificate (Truth):** "Is the theorem true?"
  *   **Warrant (Justification):** "Why should I believe you?"
  *   **Equipment (Utility):** "What can I *do* with this?"

  The discomfort with computer-assisted proofs (CAPs) like the original Four Color Theorem (4CT) or the Kepler Conjecture arises because they maximize Certificate and Warrant (via code verification) but minimize Equipment.

  **The Implicit Axiom:** *A proof is a method for compressing information into reusable cognitive structures.*

  When a human writes a 300-page proof (like parts of the Classification of Finite Simple Groups, CFSG), they do so using lemmas, reductions, and structural insights. Even if no single human has read the whole thing, the *components* are surveyable and conceptually rich. You can take Lemma 14 from the CFSG and use it in Group Theory without understanding the whole classification. The proof has generated **new concepts**.

  When a computer solves 4CT by checking 1,936 configurations, it performs **conceptual compression failure**. It takes a problem and outputs a binary state without generating intermediate concepts that humans can grasp. It settles the debt of truth but incurs a debt of understanding.

  **Why CFSG is treated differently than 4CT:**
  CFSG is accepted as "Equipment" because it provides a *map*. Even if the map is huge, it tells you where the groups live. It structures the landscape. The original 4CT proof did not structure the landscape of graph theory; it just closed the file. (Note: This is why mathematicians still care about a "human" proof of 4CT—not to check the truth, but to find the *reason* the theorem is true, which usually implies generalizability).

  ### 2. Testing Against Rival Theories

  To see if your "Equipment" hypothesis holds, we must see if rival theories can explain the specific behaviors you noted.

  **A. Strict Formalism (Proof = Derivation in a Formal System)**
  *   *Prediction:* A computer check is the *ideal* proof. Human error is the enemy.
  *   *Failure:* This cannot explain why mathematicians hunt for new proofs of settled theorems. If the derivation exists, the job is done. The fact that a "better" proof (shorter, more conceptual) is valued higher than a "correct" proof (long, brute-force) falsifies strict formalism as the operating theory.

  **B. Classical Platonism (Proof = Access to Abstract Truth)**
  *   *Prediction:* The method of access doesn't matter, only the contact with the Truth.
  *   *Failure:* This cannot explain the stigma attached to CAPs. If the theorem is "True in Heaven," a computer certificate should be as satisfying as a human one. The persistent desire for a human-readable version suggests the *mode of access* constitutes part of the mathematical object itself.

  **C. Social Epistemology (Proof = Consensus of the Competent)**
  *   *Prediction:* If the referees sign off, it's a proof.
  *   *Failure:* This explains the acceptance of CFSG (enough experts trust the pieces) but struggles with CAPs. Referees *have* signed off on CAPs, yet the community still treats them as provisional in a way they don't treat CFSG. Why? Because consensus requires *shared understanding*. You can consensus on a human argument by dividing labor; you cannot divide labor on a black-box binary execution in the same way.

  **Conclusion:** Only the **Equipment/Conceptual Technology** theory explains the specific behavior of *seeking alternative proofs for settled theorems*. If the goal were only Certificate, one proof would suffice. The drive for new proofs proves the goal is Equipment.

  ### 3. Where the Practice is Underdetermined

  There are two areas where the implicit theory is currently fracturing, and where your journalistic intuition might be spotting the cracks.

  **A. The Lean/Coq Frontier (Formalization as Equipment?)**
  The rise of proof assistants complicates your triad.
  *   *Scenario:* A mathematician formalizes a theorem in Lean.
  *   *Certificate:* Perfect.
  *   *Warrant:* Perfect.
  *   *Equipment:* Ambiguous.
      *   *Optimist view:* Formalization forces clarity of dependencies, making the proof *better* equipment for future work.
      *   *Pessimist view:* Formal code is often harder to "read" for intuition than informal prose. It verifies the steps but hides the heuristic motivation.
  *   *Underdetermination:* The community hasn't decided if a formalized library is a "textbook" (Equipment) or a "registry" (Certificate). Currently, it is treated as a Certificate with high prestige, but not yet as a replacement for the "paper."

  **B. The "Black Box" Lemma**
  You mentioned human proofs that are too long to read.
  *   *The Practice:* Mathematicians accept a human lemma they haven't checked if it comes from a trusted source.
  *   *The Tension:* Why is a trusted human black box better than a trusted computer black box?
  *   *The Implicit Bet:* The community bets that a human black box is *potentially* surveyable. It relies on cognitive architecture similar to their own. If a contradiction arises, they believe they can *debug* the human reasoning using shared intuition. They do not believe they can debug a neural net or a massive case-split without starting over. The "Equipment" value lies in the *maintainability* of the proof.

  ### 4. Is it Constructivism in Disguise?

  You asked if the discomfort is a residue of identifying truth with provability-by-creatures-like-us.

  **Yes, but not logical constructivism. Cognitive Constructivism.**

  It is not about the Law of Excluded Middle. Mathematicians happily use non-constructive existence proofs. Why? Because even a non-constructive proof often yields *structural information*. (e.g., "If this object didn't exist, the space would collapse in a way we know it doesn't.") That tells you something about the space.

  The discomfort with CAPs is **Bounded Rationality**.
  The implicit theory presupposes that mathematics is a *human cognitive ecosystem*. A proof is a tool for *thinking*. If a proof cannot be held in the working memory of the community (even distributed across the community), it cannot be used to generate *new* ideas easily.

  *   **Constructivism:** "I need to see the object to believe it exists."
  *   **Cognitive Constructivism:** "I need to see the *structure* to use it."

  The computer proof gives the object (or the truth value) but hides the structure. The anxiety is not that the theorem is false; it is that the theorem is **sterile**. It won't breed new mathematics.

  ### 5. What Changes if We Drop the Presupposition?

  If the community fully embraced **Proof = Certificate** (abandoning the Equipment requirement), the following shifts would occur:

  **A. The Article Becomes a Release Note**
  You hit this on the head. The paper ceases to be a narrative argument designed to persuade a peer. It becomes a specification document.
  *   *Current:* "Here is the intuition, here is the reduction, here is the insight."
  *   *Future:* "Theorem X is true. Hash of verification file: 0x4F... Repository linked."
  *   *Consequence:* The "story" of mathematics vanishes. Teaching becomes impossible via primary literature. You cannot teach from a release note.

  **B. Loss of Heuristic Transfer**
  This is the real loss, not just status hierarchy.
  Mathematics advances when a technique used to solve Problem A is adapted to solve Problem B.
  *   *Equipment Model:* The proof of A contains a lemma about "smoothness" that turns out to apply to B.
  *   *Certificate Model:* The proof of A is a monolithic block of code. There are no lemmas, only functions. Extracting the "smoothness" insight requires reverse-engineering the code.
  *   *Result:* Mathematics becomes more siloed. We get more truths, but fewer connections between truths.

  **C. Shift in Status Hierarchy**
  *   *Current:* Status goes to those with deep *insight* (the Equipment builders).
  *   *Future:* Status goes to those with high *throughput* (the Certificate generators).
  *   *Risk:* We might see a divergence between "Verifiers" (coders/engineers) and "Conjecturers" (intuition-driven theorists). The "Verifiers" hold the keys to truth, but the "Conjecturers" hold the map. This creates a fragile dependency.

  **D. The "Dead Math" Problem**
  If we accept Certificates without Equipment, we risk creating a body of "Dead Math." These are true statements that no one understands. They sit in the database. They cannot be generalized, simplified, or connected. They are facts, not knowledge.
  *   *Journalistic Angle:* This is the difference between a *library* and a *hard drive*. A library is organized for retrieval and synthesis (Equipment). A hard drive is organized for storage (Certificate). Mathematicians are currently resisting the transition from Librarians to SysAdmins.

  ### Summary for your Piece

  Your "Equipment" distinction is philosophically robust. It aligns with the **inferentialist** view (proofs define the concepts they use) and **Thurston's** view (proofs are about human understanding, not just truth).

  The practice presupposes that **mathematics is a collaborative cognitive extension.** A proof is valid only if it can be integrated into the collective mind of the discipline. A computer proof that cannot be integrated is treated as an external oracle: we trust its output, but we do not let it teach us how to think.

  The "scandal" isn't that we haven't checked the work. The scandal is that the work **cannot check us.** It cannot correct our intuition, refine our definitions, or suggest new paths. If you drop the Equipment requirement, you save time on verification, but you bankrupt the economy of ideas. The article becomes a receipt, and mathematics risks becoming a collection of facts rather than a language for reasoning.
