      *   **Key Questions to Address:**
          *   Does (4) + (6) contradict (2)?
          *   Is the tension between (5) and (3) apparent or deep?
          *   Are (6) and (3) incompatible?
      *   **Output Format:** Audit style (ranked tensions, costs, flags).

  2.  **Deconstruct the Claims:**
