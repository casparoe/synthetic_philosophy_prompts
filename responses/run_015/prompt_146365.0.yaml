answer: |-
  You have hit on one of the most live wires in contemporary metaphysics and the philosophy of time. Your intuition is spot on: the logical move (rejecting bivalence) is almost impossible to disentangle from the ontological move (a specific view on what exists).

  You are essentially reconstructing the **Truthmaker Objection** to future contingents, and you are right to see that it smuggles in a commitment to something very like **Presentism** (or at least the "Growing Block" theory).

  Here is a breakdown of why your reading is strong, where the tension lies with past-tense reports, and whether the logic and ontology actually stand or fall together.

  ### 1. The Truthmaker Intuition
  Your core insight is that Aristotle seems to be operating with a implicit **Truthmaker Principle**: *For a proposition to be true, there must be something in reality that makes it true.*

  *   **Past/Present:** "The battle is happening" is made true by the battle occurring. "The battle happened" is made true by the existing trace/memory/history of the battle.
  *   **Future:** "The battle will happen" lacks a present truthmaker. The battle does not exist yet.

  If you accept this principle, then **Eternalism** (the block universe, where past, present, and future equally exist) is incompatible with Aristotle's solution. If the future event *already exists* in the block universe, then there *is* a truthmaker, the proposition *is* true, and fatalism wins.

  So, to save the "Open Future," you must deny that the future exists in the same way the present does. This is effectively **Presentism** (only the present exists) or the **Growing Block** (past and present exist, future does not). You are correct: on this reading, the logic depends on the ontology.

  ### 2. The Past-Tense Problem (Your Specific Worry)
  You asked: *If tomorrow there's no battle, we can say 'there was going to be a battle' — yet at that earlier time there was no fact grounding its falsity either.*

  This is the problem of **retrospective truth**. If the proposition $p$ ("There will be a battle") had no truth value at $t_1$, can we say at $t_2$ (after the battle didn't happen) that $p$ was *false* at $t_1$?

  If we say "Yes, it was false all along," we seem to reintroduce determinism (it was always fixed that it wouldn't happen).
  If we say "No, it had no value," then how do we make sense of historical statements like "In 400 BC, it was false that Athens would survive another millennium"?

  **Aristotle's likely escape route:**
  Aristotle distinguishes between **truth** and **determinate truth** (or necessity).
  *   At $t_1$, it is not *determinately* true or false that the battle will occur. The world is genuinely open.
  *   At $t_2$, after the fact, the timeline has "crystallized." We can now look back and say, "The course of events turned out such that the battle did not occur."

  Crucially, Aristotle does not necessarily have to say the past proposition *changes* truth value. He can say that the **modal status** of the past is fixed, but the **modal status** of the future was open.
  So, at $t_2$, we don't say "It was false at $t_1$." We say, "At $t_1$, it was contingent, and the contingency resolved toward non-occurrence."

  However, you are right to press this. If we adopt a strict Truthmaker theory, the "fact" that makes the past-tense report true ("It was going to be X") only comes into existence *after* the fact. This implies that **truths about the past are dependent on the present**, which is a very strong form of Presentism. It suggests that the "past" isn't a fixed repository of facts until it slips into the "no longer present."

  ### 3. Do They Stand or Fall Together?
  **Yes, largely.** If you interpret Aristotle as rejecting bivalence because of a lack of ontological grounding (your reading), then Logic and Ontology are locked together.

  *   **If you are an Eternalist:** You must accept bivalence for future contingents (because the future facts exist tenselessly). To avoid fatalism, you must argue that *truth does not imply necessity* (this is the **Ockhamist** position).
  *   **If you are a Presentist:** You can deny bivalence (because the future facts don't exist). This blocks fatalism by denying the truth of the prediction, not just the necessity.

  **The Ockhamist Counter-Move:**
  It is worth noting that many philosophers (like William of Ockham, and contemporaries like Alvin Plantinga) argue Aristotle *doesn't* need to reject bivalence. They argue:
  1.  "There will be a battle" is true or false now.
  2.  But its truth does not *cause* the battle, nor does it imply *necessity*.
  3.  God (or the universe) knows the truth, but the event remains contingent.

  This view saves Bivalence without requiring Fatalism, but it requires rejecting your "Truthmaker" premise. It requires saying that a proposition can be true *even if there is no present causal ground for it*, provided there is a future ground. This is much harder to swallow if you are a metaphysical realist about truth.

  ### 4. Conclusion on Your Insight
  You aren't mixing logic and ontology; you are correctly identifying that **logic is often applied ontology.**

  *   **Your diagnosis:** Aristotle's rejection of bivalence relies on the idea that truth requires *actuality*.
  *   **The consequence:** This requires that the future is not actual.
  *   **The metaphysical cost:** This commits you to the view that the future does not exist (Presentism/Growing Block).
  *   **The past-tense glitch:** You correctly identified that this makes past-tense reports about unactualized futures tricky. The solution is usually to treat the "openness" of the past as a fixed historical fact *now*, even if it wasn't determinate *then*.

  So, to answer your final question: **On the "Truthmaker" reading of Aristotle, yes, the rejection of bivalence and Presentism stand or fall together.** If you want to keep Bivalence, you must become an Eternalist and an Ockhamist. If you want to keep Presentism, you likely have to drop Bivalence for future contingents.

  You've essentially rediscovered the debate between **Aristotelian Open Future** views vs. **Ockhamist** views that dominates the philosophy of time today. Your intuition that the logical gap implies an ontological gap is the standard argument used by A-theorists of time against B-theorists.
