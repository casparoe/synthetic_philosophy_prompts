      *   **Constraint:** Rank them from "Fatal" to "Merely Awkward."
      *   **Specific Question:** Which would a committed Zhuangzian concede vs. dismiss as cultural conditioning?
      *   **Meta-Question:** Has this view been qualified into unfalsifiability (immunizing strategy)? Is that a problem?

