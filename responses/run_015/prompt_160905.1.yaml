prompt: |-
  I'm designing a 90-minute session for a week-long methods summer school for graduate students in philosophy and the social sciences — 18 to 22 people, roughly half with solid statistics training and half with almost none. The session sits in a sequence on causation and evidence; the slot before mine is on randomized experiments, so randomization is available as a foil. I can't use real money, but I can use chocolate, a small prize, or points that feed into a low-stakes end-of-week team competition. Participants will have laptops, though I'd rather the core of the session be paper: printed tables, index cards, envelopes, dice. I'd also rather they not hear the phrase for the phenomenon until the last ten minutes — several of them will half-remember it from an undergraduate methods class, and once the label is in the room it tends to do the thinking for them.

  What I want them to leave with is not the moral that one should always disaggregate, which I suspect is what a straight walkthrough of the well-known admissions-by-department table actually produces. Three things instead. First, that the reversal is an arithmetic fact about weights: it can only happen when the cell sizes are lopsided relative to the within-cell margins, and I'd like them to feel that by trying and failing to build a reversal with balanced denominators. Second, that there is no real conflict between the cells all favouring one option and what any actual decision-maker should do; the aggregate numbers are a weighted average with weights fixed by how people were sorted into options, and nobody's choice is governed by those weights. The sorting should be something the room does, not something I announce. Third, that whether to condition is settled by where the partition variable sits in the causal order and not by anything visible in the table, and that there is a mirror-image case — partitioning on something the option itself causes — in which disaggregating is the error. One colleague also insists the reversal is impossible whenever allocation is randomized; I think that is only true in the population rather than in any finite sample we can generate in a room, and I'd like the session to survive that distinction rather than quietly rely on it.

  The first two points I can half-see how to stage; the third I can't. My fragments are: a data-generation round in which half the room runs a triage or referral process that assigns cases to options and thereby produces the lopsided sorting on its own, and then a second run in which a coin flip replaces it and the reversal vanishes; a construction round in which pairs are handed target cell rates and told to make the aggregate flip, and discover they can only do it by inflating one cell enormously; and a role split between a quality-control officer writing the annual report on how the two options actually did last year, and a chief who must set next year's protocol for all comers regardless of which cell they fall into — the same table, two verdicts that I hope are both defensible, and the fight that follows. My worry about that last one is that it is too verbal and that students will just talk past each other. I also want the causal order to be something they can inspect in the machinery they built or were handed, and then bet against, rather than something I assert from the front of the room.

  Please design the session: the rules, the materials, the roles, a minute-by-minute timeline for 90 minutes, and a payoff or scoring scheme that needs no money and that actually punishes the wrong rule. Give me the debrief that maps particular moments onto the three points, and say plainly which of the three the activity cannot produce on its own and which I will have to state anyway. Tell me what will predictably go wrong the first time I run it — I am especially worried about the half of the room with no statistics, about someone spotting the mechanism in the first round and spoiling it for everyone, and about tables too small for the reversal to be visible — and how to handle each. Finally, tell me what would change your mind about the design as a whole: which argument would convince you that staging it this way teaches the wrong lesson, that the role split is a fake conflict, or that one of my three target takeaways is mistaken or less central than I am treating it.
reasoning: |-
  Here's a thinking process that leads to the suggested session design:

  1.  **Analyze the Request:**

      *   **Context:** 90-minute session, week-long methods summer school, grad students (philosophy/social sciences).
      *   **Audience:** 18-22 people. Mixed stats background (50% solid, 50% little/none).
      *   **Sequence:** Follows a session on randomized experiments (RCTs).
      *   **Constraint:** No real money. Can use chocolate/prizes/points. Laptops available but prefer paper/physical props (cards, dice, envelopes).
      *   **Key Constraint:** Do *not* name the phenomenon (Simpson's Paradox) until the last 10 minutes.
      *   **Learning Objectives (3):**
          1.  Reversal is an arithmetic fact about weights (lopsided cell sizes).
          2.  No real conflict between cell-level favorability and aggregate decision; aggregate is weighted by sorting, not choice. Sorting must be generated by the room.
          3.  Conditioning depends on causal order (confounder vs. mediator). There is a mirror-image case where disaggregating is the error.
      *   **Specific Concern:** A colleague claims reversal is impossible under randomization (true in expectation, false in finite samples). The session must address this without relying on it silently.
      *   **User's Ideas:** Data generation (triage vs. coin flip), construction round (force the flip), Role split (Quality Control vs. Chief). Worries: Role split too verbal, causal order needs to be inspectable/bettable.
      *   **Deliverables:** Rules, materials, roles, minute-by-minute timeline, scoring scheme, debrief mapping, limitations (what must be stated), predicted failures & fixes, "change my mind" criteria.

  2.  **Deconstruct the Learning Objectives & Strategy:**

      *   *Objective 1 (Arithmetic/Weights):* Needs a construction task where they try to force a reversal. If denominators are equal, reversal is mathematically impossible. They need to experience the struggle of balancing the numbers.
      *   *Objective 2 (Sorting/Decision):* Needs a simulation where *they* assign cases to groups based on some rule (severity, difficulty, etc.), creating the lopsidedness naturally. Then they see the aggregate vs. disaggregated results.
      *   *Objective 3 (Causal Order/Mediator):* This is the hardest. They need to see a case where conditioning on the third variable is *wrong*. This usually means the third variable is a *mediator* (Treatment -> Variable -> Outcome) rather than a *confounder* (Variable -> Treatment & Outcome). The "Quality Control vs. Chief" idea is good but needs gamification to avoid just talking.
      *   *The Randomization Objection:* Need a round where assignment *is* randomized (coin flip) to show the reversal disappears (or becomes negligible/noise) compared to the biased sorting round.

  3.  **Drafting the Session Flow:**

      *   *Phase 1: The Puzzle (20 mins).* Generate data where reversal happens. Don't explain why yet. Let them see the table.
      *   *Phase 2: The Construction (25 mins).* Try to build a reversal with balanced numbers. Fail. Realize weights matter.
      *   *Phase 3: The Causal Twist (25 mins).* A scenario where the "grouping" variable is caused by the treatment. Disaggregating leads to the wrong decision.
      *   *Phase 4: Debrief & Reveal (20 mins).* Connect dots, name the paradox, address the randomization objection.

  4.  **Developing the Mechanics (The "Game"):**

      *   *Theme:* Medical Triage or University Admissions? Admissions is the classic example, but Medical Triage allows for clearer causal stories (Severity -> Treatment Choice). Let's go with **Medical Triage (Treatment A vs. Treatment B)**. It feels more urgent for decision-making.
      *   *Props:* Index cards (patients), Dice (outcomes), Envelopes (Group A/B protocols), Score sheets.
      *   *Scoring:* Points for correct predictions/decisions. Chocolate for the winning team.

      *   *Round 1 (Biased Sorting):* "Doctors" (students) assign patients to Treatment A or B based on severity (written on card). Severe cases go to B (the "better" but riskier treatment?), Mild to A. Then roll dice for survival based on treatment + severity.
          *   *Goal:* Generate Simpson's Paradox naturally.
          *   *Risk:* Students might guess the trick. *Mitigation:* Keep the dice probabilities secret or embedded in the protocol envelopes.

      *   *Round 2 (Balanced Construction):* Give them target rates. Ask them to fill a 2x2 table that shows reversal.
          *   *Constraint:* Denominators must be equal.
          *   *Outcome:* They will find it impossible.

      *   *Round 3 (Randomized & Mediator):*
          *   *Part A (Randomized):* Coin flip assignment. Show reversal vanishes (addressing the colleague's point).
          *   *Part B (Mediator):* This is tricky. If Treatment causes the grouping variable (e.g., Treatment causes "Blood Pressure Drop" which predicts Survival), conditioning on BP Drop is bad.
          *   *Idea:* Use the "Chief vs. Auditor" role play but gamified. One team bets on Aggregate, one on Disaggregated. The "Truth" is determined by a new draw.

  5.  **Refining the Causal Order (Objective 3):**

      *   How to make causal order inspectable?
      *   *Scenario:* Two drugs. Drug X causes a rash. Drug Y does not. Rash is associated with lower survival (maybe allergic reaction).
      *   *Structure:* Drug -> Rash -> Survival.
      *   *Trap:* If you look at "No Rash" patients only, Drug X looks better (because only the robust survived the rash). If you look at Aggregate, Drug Y is better (because X kills people via rash).
      *   *Wait, that's selection bias/collider.*
      *   *Let's stick to Mediator:* Treatment -> Improvement (Marker) -> Cure.
      *   *Actually, the prompt asks for:* "Partitioning on something the option itself causes — in which disaggregating is the error."
      *   *Example:* Treatment A is aggressive. It causes "Shock." Shock lowers survival. Treatment B is mild. No shock.
      *   *Aggregate:* B is better.
      *   *Disaggregate (by Shock):* Among "Shock" patients, A might look better (because only the strongest survive A's shock). Among "No Shock," A looks better.
      *   *Decision:* If you are the Chief choosing for *future* patients, you choose B (avoid shock). If you are the Auditor looking at *past* patients who *had* shock, A looks better.
      *   *Gamification:* Teams commit to a policy *before* seeing the causal diagram. Then the diagram is revealed.

  6.  **Addressing the "No Stats" Half:**

      *   Avoid formulas. Use visual proportions (area of squares on paper).
      *   Use physical stacking of cards to show "weight."
      *   Keep dice mechanics simple (e.g., 1-4 = Success, 5-6 = Fail).

  7.  **Addressing the "Spoilers":**

      *   Ban the word "Simpson."
      *   If someone shouts it, give them a penalty point or make them the "Data Scribe" (busy work).
      *   Focus on the *decision*, not the name.

  8.  **Addressing the Randomization Objection:**

      *   Make Round 1 Biased (Human choice).
      *   Make Round 2 Random (Coin flip).
      *   Compare the magnitude of reversal. In Round 1, it should be stark. In Round 2, it should be small or non-existent (sampling noise only). This validates the colleague's point (in expectation) while showing the student's point (finite samples).

  9.  **Developing the Scoring:**

      *   Team competition.
      *   Points for:
          *   Correctly predicting the aggregate winner.
          *   Correctly identifying when to disaggregate.
          *   Successfully constructing (or proving impossible) the balanced table.
      *   Penalty: Betting on the disaggregated winner in the Mediator round.

  10. **Structuring the Response:**

      *   Follow the prompt's requested sections: Rules/Materials, Timeline, Scoring, Debrief, Limitations, Predicted Failures, "Change My Mind."
      *   Ensure the tone is professional, pedagogical, and precise.

  11. **Self-Correction/Refinement during drafting:**

      *   *Critique:* Is 90 minutes enough for three rounds + debrief?
      *   *Fix:* Merge Randomization and Biased Sorting into one comparative phase. Or make the Mediator round a thought experiment + quick simulation.
      *   *Better:* Round 1 (Biased Sorting) -> Round 2 (The Construction/Arithmetic) -> Round 3 (The Mediator/Causal). Randomization is a sub-step of Round 1 comparison.
      *   *Wait, the prompt wants:* "Sorting should be something the room does."
      *   *Revised Plan:*
          *   0-20: Round 1 (Biased Sorting). Students act as triage nurses. Assign cards. Roll dice. Aggregate results show Paradox.
          *   20-45: Round 2 (Arithmetic). Pairs try to build a reversal with equal N. They fail. Realize weights.
          *   45-70: Round 3 (Causal/Mediator). "The Side Effect." Treatment causes a marker. Conditioning on marker is bad. Teams bet.
          *   70-90: Debrief.
      *   *Randomization:* Include a "Control" group in Round 1 who flip coins instead of triage. This addresses the colleague's objection directly.

  12. **Final Polish:** Check against constraints. No money (use points/chocolate). Paper over laptops. No naming until end.

      *   *Materials:* Index cards (Patient severity), Dice, Envelopes (Protocol A/B), Large poster paper for aggregate tables.
      *   *Scoring:* "Evidence Points." Winning team gets chocolate.
      *   *Debrief:* Map specific moments to the 3 objectives.
      *   *Limitations:* Objective 3 (Causal) usually requires explicit instruction because the data looks the same. The *story* changes, not the numbers. I must admit this.
      *   *Failures:* Small sample size noise. Mitigation: Pre-seed some data or combine tables.

  13. **Final Review against "Change My Mind":** What would convince me this is wrong? If the Mediator round is too abstract. I need to make sure the "Side Effect" is physical (e.g., a red sticker placed on the card *after* treatment choice).

      *   *Mechanism for Mediator:*
          1.  Choose Treatment (A or B).
          2.  If A, roll die. On 1-3, place Red Sticker (Side Effect).
          3.  If B, no sticker.
          4.  Survival Roll: Sticker makes survival harder.
          5.  *Trap:* If you look only at "No Sticker" patients, A looks amazing (only the lucky/strong ones got A without sticker).
          6.  *Decision:* Should you give A to next patient? No, because A *causes* the sticker which kills.
      *   This is physical and inspectable.

  14. **Writing the Output.** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a design for the 90-minute session, titled **"The Weight of Evidence."** It is built to be run with minimal technology, maximal physical interaction, and strict information control until the reveal.

  ### Session Overview
  *   **Title:** The Weight of Evidence
  *   **Time:** 90 Minutes
  *   **Participants:** 18–22 Graduate Students (Mixed Stats Background)
  *   **Materials:**
      *   100 Index Cards (pre-printed: 50 marked "High Risk", 50 marked "Low Risk" on the back).
      *   22 Six-sided dice.
      *   4 Large Poster Sheets (for aggregating class data).
      *   Red Dot Stickers (approx. 50).
      *   Envelopes labeled "Protocol A" and "Protocol B" (containing success tables).
      *   Chocolate bars or equivalent prize.
      *   Scoreboard (whiteboard).
  *   **Constraint:** The word "Simpson," "Paradox," or "Reversal" is banned until minute 80. Violators lose team points.

  ---

  ### Part 1: Rules & Roles

  **Team Structure:**
  Divide the room into 4 Teams (5–6 people each).
  *   **Roles within Teams:**
      *   *Triage Officer:* Decides which Treatment (A or B) a patient gets.
      *   *Clinician:* Rolls the dice for outcomes.
      *   *Scribe:* Records results on the Team Sheet.
      *   *Auditor:* Checks dice rolls against the Protocol Envelopes.

  **The Scoring Scheme (Evidence Points):**
  *   **+2 Points:** Correctly predicting the *Aggregate* winner before calculation.
  *   **+2 Points:** Correctly predicting the *Subgroup* winners.
  *   **+5 Points:** Successfully identifying the correct policy for a *new* patient in Round 3.
  *   **-5 Points:** Betting on the Disaggregated winner in Round 3 (The Mediator Trap).
  *   **Winning Condition:** The team with the most Evidence Points wins the chocolate. If tied, the team with the most accurate arithmetic wins.

  ---

  ### Part 2: Minute-by-Minute Timeline

  #### 00:00 – 00:10: Introduction & Round 1 Setup (Biased Sorting)
  *   **Instr:** "You are a hospital network. You have two treatments, A and B. You have patients. Your goal is to maximize survival."
  *   **Mechanic:** Hand each team 20 Index Cards. 15 are "High Risk" (back marked), 5 are "Low Risk." (This lopsidedness is crucial).
  *   **Rule:** Triage Officers *must* assign High Risk patients to Treatment B (the "intensive" care) and Low Risk to Treatment A (the "standard" care). This mimics real-world confounding (severity drives treatment).
  *   **Protocols (Sealed in Envelopes):**
      *   *Treatment A:* Low Risk = 90% survival (Roll 1-5); High Risk = 40% survival (Roll 1-2).
      *   *Treatment B:* Low Risk = 100% survival (Roll 1-6); High Risk = 60% survival (Roll 1-3).
      *   *Note:* B is strictly better in both subgroups.
  *   **Action:** Teams assign cards, roll dice, record Survivors/Total.
  *   **Control Group:** Assign one Team (or half a team) to ignore risk and flip a coin for treatment assignment. (This addresses the colleague's randomization objection).

  #### 00:10 – 00:25: Round 1 Aggregation & The Shock
  *   **Action:** Scribes post totals on the 4 Poster Sheets.
      *   Sheet 1: Treatment A (Low Risk), Treatment A (High Risk).
      *   Sheet 2: Treatment B (Low Risk), Treatment B (High Risk).
      *   Sheet 3: Aggregate A vs. Aggregate B.
  *   **The Reveal:** Calculate success rates.
      *   *Subgroups:* B beats A in both High and Low risk (by design).
      *   *Aggregate:* Because A got mostly Low Risk (easy) patients and B got mostly High Risk (hard) patients, **A will likely beat B in the aggregate.**
  *   **Task:** Teams get 2 minutes to discuss: "If you are the Chief of Medicine for *next year's* unknown patients, which treatment do you buy?"
  *   **Scoring:** Points for noting the subgroup superiority vs. aggregate inferiority.

  #### 00:25 – 00:50: Round 2: The Construction Challenge (Arithmetic)
  *   **Instr:** "The aggregate numbers lied. Or did they? We are going to build our own table."
  *   **Task:** Pairs (within teams) are given a blank 2x2 grid. They must fill in numerators and denominators to create a reversal (A > B aggregate, B > A in cells).
  *   **Constraint 1:** They can use any numbers they want.
  *   **Constraint 2:** (After 5 mins) **New Rule:** The Denominators for A and B must be equal (e.g., 50 patients each), AND the split between High/Low risk must be equal (25/25).
  *   **Outcome:** They will succeed in Constraint 1. They will **fail** in Constraint 2. It is arithmetically impossible to generate a reversal with balanced weights and consistent subgroup margins.
  *   **Physical Prop:** Give them square tiles. They must physically stack the "High Risk" tiles. They will see that for the reversal to hold, the "High Risk" stack for the worse treatment must be tiny, and for the better treatment, massive.
  *   **Debrief Moment:** "The reversal isn't magic. It's a weighting error. The aggregate is a weighted average. If the weights are equal, the average cannot flip."

  #### 00:50 – 01:15: Round 3: The Mediator Trap (Causal Order)
  *   **Instr:** "New Scenario. Same data structure, different machinery."
  *   **Mechanic:**
      1.  **Choice:** Team chooses Treatment A or B for a new batch of 10 identical patients.
      2.  **Side Effect:** If Treatment A is chosen, roll a die. On 1-3, place a **Red Dot** on the card (Severe Side Effect). Treatment B never causes Red Dots.
      3.  **Survival:**
          *   Red Dot Patients: 20% survival chance (Roll 6).
          *   No Dot Patients: 80% survival chance (Roll 1-4).
      4.  **Data:** Treatment A causes Dots. Dots cause Death. Therefore, Aggregate A looks worse.
      5.  **The Trap:** If you disaggregate by "Dot Status," look at the "No Dot" group. Treatment A patients in the "No Dot" group are the *lucky survivors* of the risk. They might show 100% survival. Treatment B "No Dot" patients show 80%.
  *   **The Bet:** Teams must commit to a policy for the *next* batch:
      *   *Option 1:* Choose based on Aggregate (Avoid A).
      *   *Option 2:* Choose based on Disaggregated "No Dot" rates (Choose A).
  *   **Resolution:** Reveal the causal chain (A -> Dot -> Death). Choosing A *causes* the Dot. Conditioning on the Dot hides the cost of A.
  *   **Scoring:** Teams that bet on Aggregate (Avoid A) get +5. Teams that bet on Disaggregated (Choose A) get -5.

  #### 01:15 – 01:30: Final Debrief & Naming
  *   **Reveal:** Name the phenomenon (Simpson's Paradox / Yule-Simpson Effect).
  *   **Map the Lessons:**
      1.  **Arithmetic:** Refer to Round 2. Reversal requires lopsided weights.
      2.  **Decision:** Refer to Round 1. The "Chief" ignores the weights because the Chief controls the sorting next year. The "Auditor" sees the weights because they are stuck with last year's sorting.
      3.  **Causality:** Refer to Round 3. In Round 1, Risk was a *Confounder* (Risk -> Treatment & Outcome). Disaggregating was correct. In Round 3, Dot was a *Mediator* (Treatment -> Dot -> Outcome). Disaggregating was wrong.
  *   **Address the Colleague:** Point to the Control Group in Round 1. Did they see a reversal? (Likely no, or small noise). "Your colleague is right about the population/expectation. You are right about the finite sample. But in the real world, assignment is rarely a coin flip."

  ---

  ### Part 3: Debrief Mapping & Limitations

  **Mapping Moments to Takeaways:**
  1.  **Arithmetic Fact:** The failure in **Round 2 (Constraint 2)** is the key. When they physically cannot build the table with equal denominators, the "magic" vanishes. It becomes a math problem, not a stats mystery.
  2.  **Sorting vs. Choice:** The **Round 1 Triage Rule** forces them to create the bias. When you ask, "Who decided the weights?" they must answer "We did." This separates the *efficacy* of the drug from the *policy* of assignment.
  3.  **Causal Order:** **Round 3** is the only place this lives. The data tables in Round 1 and Round 3 can look identical. The difference is the **Red Dot Sticker**. The sticker is placed *after* treatment choice. This physical sequence makes the causal order inspectable.

  **What the Activity Cannot Produce (You Must State):**
  *   **The Causal Assumption:** The activity cannot prove *which* variable is the confounder and which is the mediator. You must state: "Data alone cannot tell you if Risk causes Treatment or Treatment causes Risk. You need theory." The Red Dot helps, but ultimately, the decision to condition is a causal claim, not a statistical test.
  *   **The "True" Effect:** You must clarify that the "Subgroup" rate is only the true effect if there are no *unmeasured* confounders within the subgroups. Disaggregating solves visible bias, not invisible bias.

  ---

  ### Part 4: Predicted Failures & Mitigations

  **1. The "No Stats" Half Gets Lost in the Dice:**
  *   *Risk:* They focus on luck/rolling rather than rates.
  *   *Fix:* The **Scribe** role is critical. Provide a pre-formatted sheet that forces them to calculate percentages, not just count totals. Walk around and check the math at minute 20.
  *   *Fix:* If a team's dice rolls don't produce the paradox (due to noise), have a "Backup Data Set" in your pocket (pre-calculated on a card) that you swap in if their sample is too noisy. Tell them: "In this simulation, the dice were unlucky. Use the 'Hospital Registry' data instead."

  **2. The Spoiler:**
  *   *Risk:* Someone shouts "It's Simpson's Paradox!" in Minute 15.
  *   *Fix:* The "Penalty Point" rule. But more effectively, immediately pivot: "Knowing the name doesn't tell you whether to condition. Does knowing the name tell you if the Red Dot is a mediator or confounder? No. Get back to work."

  **3. Small Sample Noise:**
  *   *Risk:* With 20 cards per team, the rates might not reflect the probabilities (e.g., 90% survival might look like 70%).
  *   *Fix:* **Pool the Data.** Do not let teams analyze only their own data. All Team A Low Risk cards go into one pile. This gives you N=80+ for the aggregate, stabilizing the rates enough for the paradox to be visible.

  **4. The Randomization Objection:**
  *   *Risk:* The Coin Flip group *also* gets a reversal by chance, validating the student's doubt over the colleague's.
  *   *Fix:* Highlight the *magnitude*. The Biased group should have a massive reversal. The Random group should have a negligible one. Use this to distinguish "Structural Reversal" (Bias) from "Sampling Noise" (Chance).

  ---

  ### Part 5: What Would Change My Mind?

  I would reconsider this design if you argued the following:

  1.  **"The Mediator Round is a Strawman."**
      *   *Argument:* If you claim that no competent analyst would condition on a post-treatment variable, then Round 3 teaches a lesson nobody needs to learn. Real-world Simpson's Paradox disputes are almost always about *confounders* (Round 1), not mediators.
      *   *Counter:* In social sciences, "controlling for X" is often done blindly (e.g., controlling for 'Job Title' when studying 'Gender -> Salary', where Title is a mediator of discrimination). If you believe this error is rare enough to ignore, cut Round 3 and spend the time on unmeasured confounding.

  2.  **"The 'Chief vs. Auditor' Conflict is Fake."**
      *   *Argument:* If the goal is truth, there is only one correct table. Distinguishing based on "who is asking" sounds like relativism.
      *   *Counter:* The distinction isn't about truth; it's about *intervention*. The Auditor describes the past (fixed weights). The Chief designs the future (variable weights). If you believe policy decisions should always rely on the aggregate regardless of sorting, this session will fail to convince you.

  3.  **"Arithmetic is not the Point."**
      *   *Argument:* Focusing on the denominators (Round 2) suggests that if we just weight the data (standardization), the problem goes away. But the real problem is causal identification.
      *   *Counter:* I agree this is a risk. If you feel the arithmetic focus distracts from the causal focus, swap Round 2 for a "DAG Drawing" competition where they must map the arrows before seeing the data. However, for a mixed-stats room, the arithmetic failure is a more visceral hook than DAGs.

  **Final Recommendation:**
  Run the session as designed, but be prepared to cut Round 2 short if the arithmetic struggle drags. The causal distinction (Round 3) is the most valuable philosophical takeaway for this specific audience. Ensure the **Red Dot** mechanic is strictly enforced as *post-treatment* to make the causal order undeniable.
