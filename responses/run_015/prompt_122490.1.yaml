answer: |-
  # The Dialogue

  **Elena:** Let's state Good's theorem precisely to see where the friction lies. For an expected-utility maximizer with prior $P$, utility function $U(a, \omega)$ defined solely over acts and states, and a free signal $S$, the ex ante expected utility of choosing an act after observing $S$ is at least the expected utility of choosing before. Formally, $E[\max_a E[U(a, \omega) | S]] \geq \max_a E[U(a, \omega)]$. The proof relies on the fact that the strategy "ignore $S$ and play the prior-optimal act" is always available in the expanded option set.

  **Marcus:** That availability condition is the crack in the glass. Consider the job candidate handed the committee's ranking five minutes before her talk. The signal is free. But the act "deliver talk consistent with being ignorant of ranking" is not in her option set once she reads the list. Her beliefs causally leak into her performance. This is an undelegable decision; she cannot hire a clerk to speak while she remains ignorant.

  **Elena:** You're smuggling in a dependency. If her performance degrades because she knows she's ranked fourth, then either her utility function depends on her belief state—violating the assumption that $U$ is only on acts and states—or the act set itself has changed. Good's theorem assumes free disposal of the signal. If she cannot act as if she hadn't heard, she lacks free disposal. But normatively, if she knows this, her ex ante preference should be to pay to avoid the signal. The theorem holds as a coherence constraint: if she accepts the envelope ex ante, she contradicts her ex post regret.

  **Marcus:** But often the information is forced. The committee hands it to her. She cannot pay to avoid it. In those cases, the theorem's antecedent—that she can maximize over acts conditional on the signal including the ignorant act—fails. So the theorem is silent exactly where ignorance is valuable. You say it's a coherence test; I say it's a tautology about option sets that excludes the interesting cases.

  **Elena:** It's not a tautology; it's a boundary marker. If the act set shrinks upon information, you aren't comparing the same decision problem. But consider the maxmin case you raised earlier. An agent re-solving for the worst case over a set of priors after each signal can indeed be hurt by free information.

  **Marcus:** Exactly. Dynamic inconsistency in maxmin expected utility.

  **Elena:** But that's just a failure of probabilistic sophistication. If you reduce to a single prior, Good's theorem applies. The maxmin agent isn't violating Good; she's violating the EU axioms required to invoke it. The job candidate is similar. If she truly maximizes EU over outcomes, she would have preferred not to know. The harm isn't in the knowing; it's in the causal chain the knowing triggers.

  **Marcus:** I'll concede the maxmin point: if we demand probabilistic sophistication, the value of information holds. But on the candidate: calling it a "preference to avoid" psychologizes the constraint. It's not that she *prefers* ignorance; it's that the physical possibility of the act depends on her epistemic state. The theorem assumes epistemically invariant act sets.

  **Elena:** And I'll concede that if act sets are epistemically variant, the theorem doesn't apply. But that makes your claim empirical, not normative. You're saying humans *cannot* ignore signals, not that they *shouldn't*.

  **Marcus:** I'm saying rationality shouldn't demand the physically impossible. If "act as if ignorant" is off the table, the theorem offers no advice. It tells me I'm incoherent only if I assume I could have done what I couldn't.

  **Elena:** Then we agree the theorem is conditional. It says: *If* you can ignore the signal, *then* information has non-negative value. Your claim is that in high-stakes human cases, you often can't.

  **Marcus:** Yes. And that "if" does heavy lifting. It turns a theorem about rational curiosity into a theorem about delegated control.

  **Elena:** Then the disagreement is narrow: whether the inability to decouple belief from act is a failure of rationality or a failure of the model's applicability. I say the latter; you imply the former limits the theorem's normative reach.

  **Marcus:** Precisely. The theorem is true, but it lives in a world where agents can delegate their bodies to clerks.

  # Where each of us was wrong

  I was the Skeptic (Marcus); my friend was the Defender (Elena).

  **My Friend (Defender):** She should take back the implication that the theorem is purely a coherence constraint independent of empirical capacity. By insisting the candidate "would have preferred ex ante" to avoid the info, she sidesteps the fact that forced information renders the ex ante choice irrelevant. The theorem's normative force weakens when the "free disposal" assumption is empirically false for embodied agents.

  **Me (Skeptic):** I should take back the claim that the theorem is merely a tautology. It correctly identifies that the harm comes from the causal impact of belief on the act, not the information itself. I conceded too quickly on the maxmin point; while it involves probabilistic sophistication, it shows that even coherent non-EU agents can be hurt by information, suggesting Good's result is fragile beyond EU.
