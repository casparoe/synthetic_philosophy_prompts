answer: |-
  **Exam Question**

  **Question 1 (20 Marks)**

  Consider the following case:

  > An agent is in Damascus tonight and Death is coming for her. She may either stay in Damascus or travel to Aleppo. Death is an infallible predictor of what she will do: his location already matches whichever option she will in fact choose, so if she stays he is in Damascus and if she goes he is in Aleppo. She cannot causally influence his prediction; her act is merely a perfect indicator of his location. Before she decides, let $p$ be her subjective probability that she will end up staying; because Death is infallible, her probability that Death is in Damascus is also $p$. The utilities are as follows. If she stays and Death is in Damascus, she dies in Damascus, utility zero. If she stays and Death is in Aleppo, she survives in Damascus, utility ten. If she goes and Death is in Damascus, she survives in Aleppo but bears the cost of the journey, utility nine. If she goes and Death is in Aleppo, she dies in Aleppo after a wasted journey, utility minus one.

  Write an essay addressing the following three points:

  1.  **Decision Theoretic Verdicts:** Compute the expected utilities for staying and going according to both evidential decision theory (using conditional probabilities) and causal decision theory (using the agent's prior credence $p$). Assume for the sake of calculation that the agent's initial credence is $p=0.5$. Show that both theories initially recommend the same pure act.
  2.  **Decision Instability:** Explain why this recommendation is unstable. Trace how the agent's credence $p$ changes as she becomes confident in her decision, and demonstrate why neither pure act is ratifiable (i.e., why each act maximizes expected utility only if the agent believes she will *not* perform it). Discuss what this implies for the evidentialist slogan that one should do what one would most want to learn one will do.
  3.  **Mixed Strategies:** Assess whether a randomized strategy (e.g., using a quantum device Death cannot predict) offers a rational solution. Discuss both the pragmatic advantage of such a strategy regarding survival and utility, and the conceptual difficulty it poses for decision theory (e.g., whether theory should recommend acts or policies of randomization).

  ***

  **Model Answer**

  The decision matrix for the agent is defined by her act (Stay or Go) and the state of the world (Death in Damascus or Aleppo). Because Death is an infallible predictor, the state correlates perfectly with the act. If she stays, Death is in Damascus; if she goes, Death is in Aleppo.

  First, we compute the expected utilities (EU). Evidential Decision Theory (EDT) evaluates acts based on the news they bring. Since Death's location matches the act, $P(\text{Damascus} | \text{Stay}) = 1$ and $P(\text{Aleppo} | \text{Go}) = 1$.
  $EU_{EDT}(\text{Stay}) = 1(0) + 0(10) = 0$.
  $EU_{EDT}(\text{Go}) = 0(9) + 1(-1) = -1$.
  EDT recommends Staying. Causal Decision Theory (CDT) evaluates acts based on their causal consequences, treating the state as independent of the act. CDT uses the prior credence $p$. Given the prompt's instruction to assume $p=0.5$:
  $EU_{CDT}(\text{Stay}) = 0.5(0) + 0.5(10) = 5$.
  $EU_{CDT}(\text{Go}) = 0.5(9) + 0.5(-1) = 4$.
  CDT also recommends Staying. Thus, unlike Newcomb's problem, both theories converge on the same pure act given initial uncertainty.

  However, this recommendation generates decision instability. A choice is ratifiable only if it remains optimal conditional on the belief that one will make it. As soon as the agent decides to Stay, her credence $p$ that she will Stay shifts to 1. Because Death is infallible, her credence that Death is in Damascus also becomes 1. We must recalculate the EU conditional on this new certainty.
  Conditional on $p=1$ (certainty of Stay):
  $EU(\text{Stay}) = 1(0) + 0(10) = 0$.
  $EU(\text{Go}) = 1(9) + 0(-1) = 9$.
  Once she is confident she will Stay, Going yields higher utility (9 vs 0). Conversely, if she decides to Go, $p$ becomes 0.
  Conditional on $p=0$ (certainty of Go):
  $EU(\text{Stay}) = 0(0) + 1(10) = 10$.
  $EU(\text{Go}) = 0(9) + 1(-1) = -1$.
  Once confident she will Go, Staying yields higher utility (10 vs -1). Neither pure act is ratifiable; each is optimal only if the agent believes she will do the other. This undermines the evidentialist slogan "do what you would want to learn you will do." If she learns she will Stay, she wishes she had Gone. If she learns she will Go, she wishes she had Stayed. There is no news she would welcome.

  This instability suggests a mixed strategy may be rational. If the agent employs a chance device Death cannot predict (breaking the correlation), Death's location is fixed independently of the outcome. Assuming Death is equally likely to be in either city, and the agent randomizes 50/50, she survives if (Stay & Aleppo) or (Go & Damascus). This yields a 50% survival rate. The expected utility is $0.5(10) + 0.5(9) = 9.5$. This dominates any pure strategy, which yields 0 utility given Death's infallibility regarding pure decisions.

  However, this solution poses conceptual difficulties. Standard decision theory typically recommends specific acts, not policies of randomization. Recommending a mixed strategy implies the agent should intentionally make herself unpredictable, effectively opting out of the predictive framework. Some argue this amounts to advising the agent to be less than fully rational, as a rational agent's choice should be determined by reasons, not chance. Yet, if determinacy leads to death and randomization leads to survival, the "irrational" mixed strategy appears pragmatically superior. Thus, Death in Damascus suggests that in cases of perfect prediction, rationality may require abandoning the goal of choosing a specific act in favor of choosing a probability distribution over acts.

  ***

  **Marking Scheme**

  **Total Marks: 20**

  **1. Calculation and Convergence (5 Marks)**
  *   **5 marks:** Correctly calculates EU for EDT (0 vs -1) and CDT (5 vs 4 using $p=0.5$). Explicitly states both recommend Staying.
  *   **3-4 marks:** Correct calculations but fails to explicitly note the convergence/recommendation.
  *   **1-2 marks:** Significant calculation errors or confuses CDT independence assumption.
  *   *Common Error:* Assuming CDT treats the state as correlated with the act (treating CDT like EDT).

  **2. Instability and Ratifiability Mechanism (7 Marks)**
  *   **6-7 marks:** Precisely traces the mechanism: deciding changes credence $p$, which changes the probability of Death's location, which flips the EU preference. Explicitly states neither act is ratifiable and connects this to the failure of the "want to learn" slogan.
  *   **3-5 marks:** Identifies instability and lack of ratifiability but describes the mechanism vaguely (e.g., "the situation changes") without tracing the credence shift $p$.
  *   **1-2 marks:** Mentions instability but fails to explain why the preference flips.
  *   *Differentiation:* An **A** answer must explain *how* the update of $p$ drives the utility flip. A **B** answer may state the flip occurs without the credence mechanism.

  **3. Mixed Strategy Assessment (5 Marks)**
  *   **5 marks:** Calculates the mixed strategy benefit (survival/9.5 EU) AND discusses the conceptual tension (acts vs. policies / rationality vs. unpredictability).
  *   **3-4 marks:** Explains the survival benefit but offers only a superficial comment on the conceptual difficulty.
  *   **1-2 marks:** Mentions randomization but fails to explain why it helps or why it is problematic.
  *   *Differentiation:* An **A** answer must articulate the conceptual difficulty (e.g., is randomization rational?). A **B** answer may treat randomization as a straightforward fix.

  **4. Clarity and Structure (3 Marks)**
  *   **3 marks:** Clear, logical flow; distinct sections for the three tasks; precise philosophical terminology.
  *   **1-2 marks:** Disorganized or difficult to follow.
  *   **0 marks:** Incoherent.

  **Grade Boundary Note:** To achieve an **A (17-20 marks)**, the candidate must secure full marks in section 2 (mechanism of instability) and section 3 (substantive mixed strategy critique). A **B (14-16 marks)** candidate will correctly perform calculations and identify instability but will lack precision on the credence mechanism or the normative implications of randomization.
