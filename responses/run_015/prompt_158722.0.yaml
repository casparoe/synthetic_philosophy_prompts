      *   (4) *Luck Egalitarianism (Metaphysical):* Success isn't morally deserved (luck of talent, family, timing).
      *   (5) *Noble Lie (Functionalist):* Belief in meritocracy is false but socially functional. Institutions should encourage this false belief.
      *   (6) *Anti-Meritocratic Rhetoric:* Meritocratic rhetoric is corrosive (entitlement for winners, shame for losers).
