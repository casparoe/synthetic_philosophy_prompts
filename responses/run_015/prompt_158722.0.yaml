          *   *Conflict:* Is social disapproval for "self-advertising achievement" based on resentment of the achievement/wealth? Or is it a distinct harm? The author's partner says (2) is just (1) reversed.
          *   *Analysis:* If the norm is "don't show off," and the sanction is "ridicule," is that justified by harm to others? Or is it just resentment of status? If it's just status envy, (1) forbids it. If it's about social cohesion or humility, maybe it fits. But (1) is strict: "bare fact that other people resent... is not itself a reason."
          *   *Verdict:* High tension. (2) risks violating (1) unless "vulgarity" is defined as a specific harm (e.g., eroding solidarity) rather than just "having more/showing it."

      *   *(2) vs. (3):* (2) says don't put yourself forward, don't fish for praise, Nordic modesty. (3) says we want medals, named chairs, televised celebrations, loud praise.
          *   *Conflict:* How do you celebrate someone loudly (3) if they aren't allowed to put themselves forward (2)?
          *   *Analysis:* This is the "Tall Poppy" vs. "Hero Worship" clash. (2) targets the *agent's* behavior (self-advertising). (3) targets the *community's* behavior (honoring).
          *   *Verdict:* Apparent tension. Can be resolved by distinguishing *self-praise* (forbidden) from *communal praise* (encouraged). The yacht owner praises himself; the medal recipient is praised by others.

