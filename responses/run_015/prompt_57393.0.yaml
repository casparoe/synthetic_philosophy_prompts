answer: |-
  I reject step (5).

  The argument is valid, so to block the conclusion while preserving (1) and (2), you must show that the generalization from the specific historical case to the universal principle is unwarranted. Step (5) claims that "whatever stays fixed across a stretch of time is explanatorily inert within it." This step surreptitiously narrows the definition of the "contrast class" mentioned in (1) to *temporal alternatives within the same system*. It assumes that because a slow fact (like geography) does not vary between 1570 and 1572, it cannot explain why the Battle of Lepanto occurred in 1571.

  But (1) states that the contrast class is determined by "the audience already had in view." There is no metaphysical rule dictating that the audience must always be asking, "Why this time rather than that time?" Often, the audience is asking, "Why this region rather than that region?" or "Why a naval battle rather than a land siege?" In those contrast classes, the "slow facts" *do* vary. The Mediterranean basin differs from the Baltic; the sea differs from the mountains. In those comparisons, geography is a difference-maker. Step (5) fails because it conflates *temporal invariance* with *explanatory invariance*. A factor can be constant across time but variable across the relevant structural or spatial contrast class, thereby satisfying (2) and retaining explanatory power.

  **The Cost**
  Rejecting (5) costs you the dream of a "complete" explanation that stands independent of pragmatic interests. You must accept that whether a slow fact is explanatory depends on how the explanatory question is framed. There is no God's-eye view where all contrast classes are equal. If the question is strictly "Why 1571 and not 1572?", then yes, geography is inert. But if the question is "Why did the Habsburgs fight a naval war in the south and a land war in the north?", geography is central. You lose the ability to say that Braudel's slow facts explain *events* simpliciter; you can only say they explain events *under specific descriptions* or *relative to specific contrasts*. This makes explanation more fragile and context-dependent than a hard determinist might like, but it aligns with the analytic consensus on contrastive explanation (e.g., van Fraassen, Lipton).

  **Implications for Physics and Braudel**
  This rejection disarms (7). In physics, the gravitational constant is invariant across the orbits of a single planet, so it does not explain why the planet is at position *x* at time *t* rather than *t+1*. But it *does* explain why the orbit is an ellipse rather than a hyperbola, or why this solar system behaves differently from a hypothetical system with a different constant. The constant explains the *type* of system and the *range* of possible trajectories, even if it doesn't pick out the specific token trajectory without initial conditions.

  Consequently, (6) also fails. Braudel's opening section does not explain the *timing* of Lepanto, but it explains why Lepanto was a *naval* battle, why supply lines ran along the coast, and why empire in the Mediterranean looked different from empire in the Americas. It explains the *constraints* within which the events unfolded.

  **The Residue and Justification**
  Once you excise (5), the tier of slow structures is left explaining the **bounds of possibility** and the **cost structures of action**. It explains why certain events were prohibitively expensive or physically impossible, thereby biasing the historical record toward certain outcomes without strictly determining them. It explains the *inequalities* of history—why some regions could sustain high-density urbanization and others could not—rather than the *occurrences* of history.

  Is this residue enough to justify Braudel's architecture? Yes, but only if you accept that history is not merely the chronicle of what happened, but the analysis of why what happened was *likely* or *possible* given the human condition. Braudel's tripartite scheme is not a failed attempt to predict events; it is a successful attempt to stratify historical time into layers of constraint (*longue durée*), cycles (*conjonctures*), and triggers (*événements*). By rejecting (5), you preserve the analytic rigor of (1) and (2) while validating Braudel's insight: you cannot understand the event without understanding the stage upon which it was forced to play out. The architecture is justified because it captures the multi-scalar nature of social reality, not because it predicts the daily news.
