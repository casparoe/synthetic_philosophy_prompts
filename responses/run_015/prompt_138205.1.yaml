answer: |-
  You are struggling because you are trying to apply a single metaphysical principle to two different historiographical tasks: **attributing responsibility for singular events** (Cases 1, 2, 4) and **explaining structural shifts** (Cases 3, 5).

  Your current "Swap Test" fails on Case 1 because it treats the outcome as "Warehouse Burns" (type) when your verdict treats it as "Warehouse Burns *Now*" (token). It fails on Case 3 because it treats the Clerk as a sufficient cause when your verdict treats him as a trigger for a structural inevitability.

  Here is a principle that accommodates your verdicts without "cheating" on the outcome, provided you accept one distinction: **Token Events require Process Completion; Structural Trends require Explanatory Sufficiency.**

  ### The Principle of Contrastive Granularity

  **State the contrast class for your outcome.** Are you explaining *why this happened rather than nothing* (Occurrence), *why this happened now rather than later* (Timing), or *why this form rather than that form* (Modality)?

  **The Rule:**
  1.  **For Singular Physical/Political Events (Timing/Token):** Cite the **Completed Process**. If a causal chain physically reaches the outcome before an alternative would have, it is the cause. (Pre-emption wins).
  2.  **For Structural/Historical Trends (Occurrence/Type):** Cite the **Sufficient Background**. If a specific trigger activates a latent structural inevitability, the structure is the cause, the trigger is the occasion. (Sufficiency wins).
  3.  **For Overdetermination:** If multiple chains complete simultaneously, cite all. If multiple chains share a root, cite the root.
  4.  **For Equifinality:** If specific agents are interchangeable vehicles for a structural force, cite the force.

  ---

  ### Board-Ready Formulation

  > **Causation Verdicts:**
  > 1.  **Pre-emption:** Cite the process that **completed** the event. Ignore backups that were preempted by timing.
  > 2.  **Symmetric Overdetermination:** Cite **all** sufficient processes that completed simultaneously.
  > 3.  **Trigger vs. Structure:** For regime/system changes, cite the **structural conditions** as cause; cite the specific trigger only as *occasion*.
  > 4.  **Common Cause:** If apparent causes share an upstream determinant, cite the **upstream determinant**.
  > 5.  **Functional Equivalence:** If specific agents are interchangeable vehicles for a structural pressure, cite the **pressure**, not the agent.

  ---

  ### Application to Your Cases

  *   **Case 1 (Arson vs. Power Line):** *Singular Event.* The arsonist's process **completed**. The power line's process was preempted. **Verdict:** Arsonist. (Principle 1).
  *   **Case 2 (Two Fires):** *Singular Event.* Both processes **completed** simultaneously. Neither preempted the other. **Verdict:** Both. (Principle 2).
  *   **Case 3 (Clerk vs. Debt):** *Structural Trend.* The regime fall was structurally inevitable (Debt/Harvest). The Clerk only determined *when*. **Verdict:** Debt/Harvest = Cause; Clerk = Occasion. (Principle 3).
  *   **Case 4 (Drought):** *Common Cause.* Crop failure and revolt are branches of the same root. **Verdict:** Drought. (Principle 4).
  *   **Case 5 (Canal vs. Railway):** *Functional Equivalence.* Mining and Railway lobbies are interchangeable vehicles for "Transport Capital." **Verdict:** Transport Capital. (Principle 5).

  ### Application to Your New Cases

  **New Case A: Election called a week before scandal.**
  *   **Analysis:** Is the outcome "Government Change" (Structural) or "Government Change *on this date/by this mechanism*" (Singular)?
  *   **Verdict:** If the scandal would have brought the government down anyway, this is Case 3 (Trigger vs. Structure). The Election is the *occasion* for the timing; the underlying unpopularity is the *cause* of the fall.
  *   **Caveat:** If the Election *prevented* the scandal from changing the *winner* (i.e., Party A wins now, Party B would have won after scandal), then the Election is the **Completed Process** for the specific victory (Case 1).
  *   **Recommendation:** Treat as Case 1 if the *result* differs; treat as Case 3 if only the *timing* differs.

  **New Case B: Arsonist beats Owner's Hired Arsonist.**
  *   **Analysis:** This is physically identical to Case 1. The first fire **completed** the process. The owner's plan was a latent backup, not an active process.
  *   **Verdict:** The Arsonist is the cause of the fire. The Owner's plot is background context (like the harvest debt in Case 3).
  *   **Why you wobble:** You feel the Owner's plot makes the fire "inevitable." But inevitability is not causation in token events. If you are explaining "Why was the warehouse vulnerable?", cite the Owner. If you are explaining "Why did the fire start *Tuesday*?", cite the Arsonist.
  *   **Recommendation:** Stick to Case 1. Cite the Arsonist. To cite the Owner is to shift the question from "Cause of Fire" to "Cause of Risk."

  ---

  ### Straight Talk: Where This Principle Breaks

  You asked me to be straight about where this cannot accommodate your intuitions. Here is the friction point:

  **1. The Tension Between Case 1 and Case 3.**
  In Case 1, you prioritize the **specific agent** (Arsonist) over the **inevitable backup** (Power Line).
  In Case 3, you prioritize the **inevitable structure** (Debt) over the **specific agent** (Clerk).
  *   **The Conflict:** Both are pre-emption cases. In both, Factor A happens, and Factor B would have done the job anyway.
  *   **The Fix:** You must admit to your students that you are shifting the **Explanatory Interest**. In Case 1, we care about *moral/legal responsibility* (Who lit the match?). In Case 3, we care about *historical intelligibility* (Why did the system fail?).
  *   **The Cost:** You cannot claim this is a unified *metaphysical* theory of causation. It is a *methodological* rule for historians. Sometimes we want the match-lighter; sometimes we want the dry timber.

  **2. The "Fine-Grained" Cheat.**
  You said you don't want to cheat by saying "Burning at 2:00" vs "Burning at 2:10."
  *   **The Hard Truth:** Case 1 *requires* this distinction, or it requires a "Process Theory" of causation (the fire traveled from the arsonist, not the line).
  *   **My Advice:** Don't call it "fine-grained outcomes." Call it **"Process Completion."** It isn't about the time on the clock; it's about which physical chain actually touched the warehouse. The power line's chain was severed by the arsonist's success. This saves you from the "cheating" accusation while keeping the verdict.

  **3. Case 5 (The Lobby).**
  This is the weakest link. Citing "Transport Capital" is an abstraction. If a student asks, "But who signed the bill?", "Transport Capital" didn't sign it.
  *   **The Limit:** This principle works for *explanation*, not for *narrative*. If you are writing a narrative history, you must cite the Mining Lobby. If you are writing a structural history, you cite Capital.
  *   **Verdict:** Acknowledge that Case 5 is a choice of **historical scale**, not causation *simpliciter*.

  ### Summary for the Seminar
  Tell your students: *"Causation in history is not a single thing. It is a tool we sharpen differently depending on whether we are investigating a crime (Case 1), a disaster (Case 2), a revolution (Case 3), or a trend (Case 5). The principle is not 'What caused this?' but 'What kind of answer does this question require?'"*

  If you teach that, you won't need to reconcile the irreconcilable. You just need to teach them how to choose the right lens.
