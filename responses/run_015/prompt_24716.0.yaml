      4.  **The Semantics of "My Branch" (1 + 4):** Personal identity in fission.

      *Self-Correction on DW/SLU:* Actually, Wallace explicitly argues *against* needing SLU. He argues that rationality constraints alone dictate the credence. So (2) + (5) is actually a *Wallacean* position. I should note that this is consistent *if* they follow Wallace, but tension arises if they think credence requires *ignorance*.

      *Self-Correction on Objective Weights:* If they are objective (3) but not typicality (4), this implies a "Neo-Fregean" or "Primitivist" view of weight. This is hard to square with naturalism.

      *Let's look closer at (4):* "credence that i'll see outcome A... explicitly reject typicality... because that turns it into a statistical claim about a population... rather than a chance that attaches to my branch."
      *Critique:* In MWI, "my branch" *is* a subset of the population. You can't have a chance attach to "my branch" without referencing the measure over the population of successors. This is the biggest metaphysical hole.

  7.  **Final Plan:**
      *   Validate the sophistication.
