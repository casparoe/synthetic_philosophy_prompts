      *   *Point 3 (Objective Weights)* + *Point 4 (Credence on "My Branch")*: **Major Tension.** In MWI, *all* outcomes happen. There is no unique "my branch" prior to the split that selects one outcome. After the split, there are multiple copies. If weights are objective (Point 3), what do they measure? If they aren't frequencies (rejected in Point 4 via "typicality") and aren't about SLU (Point 5), what is their normative force on credence?
      *   *Point 4 (Reject Typicality)* + *Point 3 (Objective Weights)*: **Moderate Tension.** If weights are objective features, why *not* treat them as a measure over the set of branches (typicality)? The user wants them to attach to "my branch." But in MWI, "my branch" is indexical. If weights are objective, they usually function as a measure *over* the branches. Denying typicality while keeping objective weights requires a specific metaphysical story about how weight attaches to a specific successor without being a measure over successors.
      *   *Point 5 (No SLU)* + *Point 4 (Credence = Born Rule)*: **Major Tension.** This is the crux of the "Incoherence Problem." If I know the wavefunction evolves unitarily, I know *both* outcomes will occur. Why should I assign probability $p < 1$ to outcome A? Usually, SLU provides the epistemic gap ("I don't know which one I will be"). Without SLU, and without Typicality, what grounds the uncertainty required for credence?
      *   *Point 2 (DW)* + *Point 5 (No SLU)*: As noted above, DW is often interpreted as solving the SLU problem. If SLU is rejected, does DW still work? Saunders and Wallace often lean on SLU. Greaves and Myrvold critique it. The user needs to know if DW works without the "uncertainty" premise.

