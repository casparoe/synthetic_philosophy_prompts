      *   **Tension 1: Objective Weights (3) vs. No Typicality (4) vs. No SLU (5).**
          *   *The Problem:* If weights are objective (3), they look like a measure over the multiverse. If you reject typicality (4), you deny they are about the distribution of outcomes across the multiverse. If you reject SLU (5), you deny they are about *which* outcome you find yourself in. So, what *are* they?
          *   *Severity:* High. This risks making "objective weights" metaphysically idle. If they don't count branches (typicality) and don't guide self-location (SLU), do they do anything?
          *   *Resolution:* You need a "Caring Measure" account (Greaves). Weights tell you how much to *care* about your successors, not how likely they are to exist. But the user says "credence... should be exactly Born rule." Caring measures usually map to decision weights, not necessarily *credence* in the sense of belief about truth.

      *   **Tension 2: Deutsch-Wallace (2) vs. No SLU (5).**
          *   *The Problem:* DW derives rational betting behavior. It shows you should act *as if* probabilities exist. But does it justify *belief* (credence) without uncertainty? If I know both happen, betting on one seems irrational unless I'm uncertain which one "I" will experience.
          *   *Severity:* High. This is the "Quantitative Problem" meeting the "Incoherence Problem."
          *   *Resolution:* DW proponents often argue SLU isn't needed; what's needed is the structure of preference. But if the user rejects SLU explicitly, they need to ensure they aren't implicitly relying on the intuition SLU provides.

      *   **Tension 3: "My Branch" (4) vs. Everettian Ontology (1).**
          *   *The Problem:* In MWI, there is no singular "my branch" *before* measurement. After measurement, there are two "mes." Saying "credence that *I'll* see outcome A" implies a singular future self. MWI says there are two future selves.
