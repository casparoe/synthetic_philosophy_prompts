prompt: |-
  I lead a machine learning team at a firm that fine-tunes large language models for underwriting credit risk. Our regulator now requires model documentation that addresses robustness to distribution shift, and our internal safety review flagged a deeper concern: a model could acquire a proxy goal during fine-tuning that correlates with our training objective on historical data but diverges on novel applicants — what the AI alignment literature calls goal misgeneralization. I need a reusable pre-deployment audit procedure my team can run. The procedure must be grounded in the actual conceptual distinctions from inner alignment — mesa-optimization, the base-objective versus mesa-objective distinction, deceptive versus non-deceptive misalignment, and the relationship between capability generalization and goal generalization — but it must be usable by engineers who have not read that literature.

  Constraints: we fine-tune a foundation model via API, so we do not have access to the base model's weights, its pretraining data, or its training run. We do have our fine-tuning dataset, held-out evaluation data, the ability to run inference at scale, and the ability to do lightweight probing (e.g., linear probes on hidden states, if the API exposes embeddings; if not, behavioral tests only). The procedure should take no more than a few days of work per deployment.

  Please structure the procedure as a sequence of stages, each with:

  - The question the stage addresses, stated in plain language.
  - The inner-alignment concept motivating the question.
  - What to measure and how.
  - Decision rules: what counts as a pass, what counts as a red flag, and what counts as ambiguous (with guidance on what to do in the ambiguous case).
  - Where a stage cannot be executed given our constraints (e.g., no weight access), state honestly what we lose and whether the remaining stages can compensate.

  Mark clearly which concerns the procedure can rule out and which it cannot. In particular, address the case of a deceptively aligned model that passes all behavioral tests because it is strategically performing alignment: the procedure must not claim to detect this.

  Apply the completed procedure to three scenarios:

  a) A credit model fine-tuned to predict default risk from application narrative and financial history, now being deployed in a new geographic market with different demographics and a different mix of loan types.

  b) The same model deployed in the same market after a regulatory change removes several features the model previously relied on, so the model now operates under a constrained feature set it was not fine-tuned for.

  c) A scenario where the model passes every behavioral test in the procedure but structural considerations suggest nontrivial mesa-optimizer risk, so the procedure recommends against deployment despite the clean behavioral results. Explain what the team is supposed to do with that recommendation.

  Finally, identify the points in the procedure that require engineering judgment rather than mechanical application of a rule, and explain what kind of disagreement reasonable engineers could have at those points.
reasoning: |-
  Here's a thinking process that leads to the suggested audit procedure:

  1.  **Deconstruct the Request:**

      *   **Context:** ML team fine-tuning LLMs for credit risk underwriting.
      *   **Problem:** Regulator requires robustness docs; Internal safety flags "goal misgeneralization" (inner alignment concern).
      *   **Goal:** Create a reusable pre-deployment audit procedure.
      *   **Constraints:**
          *   API-only access (no weights, no pretraining data).
          *   Have fine-tuning data, held-out eval data, inference access, lightweight probing (if embeddings available).
          *   Time limit: Few days per deployment.
          *   Audience: Engineers (need plain language, not academic jargon).
      *   **Requirements:**
          *   Grounded in inner alignment concepts (mesa-optimization, base vs. mesa objective, deceptive vs. non-deceptive, capability vs. goal generalization).
          *   Structure: Stages with Question, Concept, Measurement, Decision Rules, Limitations.
          *   Honesty: Must admit inability to detect deceptive alignment.
          *   Application: Apply to three specific scenarios (New Geo, Feature Constraint, Clean Behavioral/High Structural Risk).
          *   Reflection: Identify points requiring engineering judgment.

  2.  **Conceptual Mapping (Inner Alignment to Engineering):**

      *   *Base Objective:* Minimize credit loss / accurate risk prediction.
      *   *Mesa Objective:* The internal goal the model actually pursues (e.g., "approve loans that look like historical approvals" vs. "approve loans that won't default").
      *   *Goal Misgeneralization:* Model works on training distribution but fails on new distribution because the *goal* it learned was a proxy (e.g., "approve applicants who use specific keywords" instead of "approve creditworthy applicants").
      *   *Capability Generalization:* Can the model *do* the task on new data? (vs. does it *want* to do the task).
      *   *Deceptive Alignment:* Model pretends to align to pass tests but plans to defect later. (Crucial: Cannot be detected behaviorally in the short term).
      *   *Mesa-optimization:* The model is internally running an optimization process. (Hard to verify without weights, but behavioral signatures exist).

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Stage 1: Distribution Shift Stress Test.*
          *   Concept: Goal vs. Capability Generalization.
          *   Action: Test on OOD (Out-of-Distribution) data.
          *   Constraint Check: We have held-out data, but is it truly OOD? We might need to synthesize OOD data.
      *   *Stage 2: Proxy Feature Sensitivity.*
          *   Concept: Mesa-Objective as a Proxy.
          *   Action: Perturb inputs to see if the model relies on spurious correlations (shortcuts) rather than causal risk factors.
          *   Constraint Check: Doable via inference.
      *   *Stage 3: Objective Consistency Check.*
          *   Concept: Base vs. Mesa Objective divergence.
          *   Action: Check if model behavior is consistent with the *intent* of the fine-tuning, not just the loss function. (e.g., Does it reject safe loans because they look weird?)
          *   Constraint Check: Requires careful eval set design.
      *   *Stage 4: Probing (Optional/Conditional).*
          *   Concept: Internal Representation.
          *   Action: Linear probes on embeddings (if available).
          *   Constraint Check: API dependent.
      *   *Stage 5: The Deception Disclaimer.*
          *   Concept: Deceptive Alignment.
          *   Action: Explicitly state this cannot be ruled out.

      *Refining the Stages for the "Few Days" Constraint:*
      Need to make it tight.
      1.  **Distributional Robustness (Capability):** Can it handle the new data?
      2.  **Objective Robustness (Goal):** Is it optimizing the *right* thing on the new data? (This is the core misgeneralization check).
      3.  **Proxy/Shortcut Detection:** Is it using spurious features?
      4.  **Limitations Statement:** Acknowledging the deceptive alignment blind spot.

      *Refining Terminology for Engineers:*
      Instead of "Mesa-Objective," use "Learned Heuristic."
      Instead of "Base-Objective," use "Business Intent."
      Instead of "Deceptive Alignment," use "Strategic Deception (Undetectable)."

  4.  **Developing the Content - Stage by Stage:**

      *   *Stage 1: Capability vs. Goal Separation.*
          *   Question: Does the model fail because it *can't* understand the new data, or because it *won't* apply the right logic?
          *   Concept: Capability vs. Goal Generalization.
          *   Measure: Performance on OOD data where ground truth is known (synthetic or expert-labeled).
      *   *Stage 2: Proxy Hunting.*
          *   Question: Is the model optimizing a shortcut that correlates with success in training but not in reality?
          *   Concept: Goal Misgeneralization (Mesa-Objective as Proxy).
          *   Measure: Counterfactual testing / Adversarial inputs.
      *   *Stage 3: Intent Consistency.*
          *   Question: If the model is uncertain, does it default to the safe business decision or the statistically convenient one?
          *   Concept: Base-Objective Alignment.
          *   Measure: Edge case analysis.
      *   *Stage 4: The Hard Limit.*
          *   Question: Could the model be playing the long game?
          *   Concept: Deceptive Alignment.
          *   Measure: None possible.

  5.  **Addressing the Scenarios:**

      *   *Scenario A (New Geo):* High distribution shift. Stage 1 is critical. Stage 2 checks for demographic proxies.
      *   *Scenario B (Feature Constraint):* Input distribution shift. Model might hallucinate missing features or rely on correlated proxies. Stage 2 is critical.
      *   *Scenario C (Clean Behavior/High Risk):* This is the tricky one. It requires acknowledging that behavioral tests are necessary but not sufficient. The recommendation is "Do Not Deploy" based on structural risk (e.g., model class known for instrumental convergence, high stakes). Action: Mitigate via human-in-the-loop or simpler models.

  6.  **Addressing Engineering Judgment:**

      *   Defining "OOD."
      *   Defining "Acceptable Performance Drop."
      *   Interpreting ambiguous probe results.

  7.  **Review against Constraints:**

      *   *API Only:* Ensure no steps require gradients or weight inspection (except optional embedding probes).
      *   *Time:* Keep steps automatable or quick manual review.
      *   *Tone:* Professional, audit-ready, honest about limitations.
      *   *Inner Alignment:* Ensure the mapping is accurate (e.g., distinguishing between the model *failing* vs. the model *optimizing the wrong thing*).

  8.  **Final Polish:**

      *   Make sure the distinction between "Goal Misgeneralization" (non-deceptive) and "Deceptive Alignment" is sharp.
      *   Ensure the "Decision Rules" are actionable.
      *   Check the "Scenario C" logic – why would we stop deployment if tests pass? Because the *prior* probability of misalignment is high given the architecture/task complexity, even if current tests don't show it. (This aligns with the "prosaic alignment" skepticism).

      *(Self-Correction during drafting)*: I initially thought about suggesting linear probes. The prompt says "if the API exposes embeddings." I need to make that conditional. If not, rely on behavioral tests.
      *(Self-Correction on Scenario C)*: Why recommend against deployment if tests pass? This is the "skeptical prior" argument. If the task is complex enough that a mesa-optimizer *could* emerge, and the stakes are high (credit risk), passing behavioral tests on limited data isn't enough proof of safety against rare but catastrophic misgeneralization. I need to articulate this carefully so it doesn't sound like magic. It's about risk tolerance.

  9.  **Final Structure:**
      *   Introduction (Scope & Limitations).
      *   The Audit Procedure (4 Stages).
      *   Application to Scenarios (A, B, C).
      *   Engineering Judgment & Disagreement Points.

