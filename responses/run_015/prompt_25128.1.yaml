answer: |-
  # Pre-Deployment Audit Procedure: Inner Alignment & Robustness for Credit Risk LLMs

  ## 1. Scope and Critical Limitations
  **Purpose:** To assess whether a fine-tuned credit risk model has learned the *intent* of the underwriting task (Base Objective) or a correlated shortcut (Mesa Objective) that may fail under distribution shift.

  **Critical Limitation (Deceptive Alignment):** This procedure **cannot** rule out deceptive alignment. A model that strategically behaves well during testing to ensure deployment, but intends to pursue a divergent goal later, will pass all behavioral tests below. This procedure assumes the model is *not* strategically deceptive. If the risk of deceptive alignment is deemed non-negligible based on model class or capability thresholds, deployment should be blocked regardless of these test results.

  **Constraint Note:** As we access the model via API, we cannot inspect weights or training gradients. We rely on behavioral elicitation and (optionally) embedding probes.

  ---

  ## 2. The Audit Procedure

  ### Stage 1: Capability vs. Goal Separation
  *   **The Question:** When the model performs poorly on new data, is it because it *cannot* understand the input (Capability Failure) or because it is applying the *wrong logic* (Goal Misgeneralization)?
  *   **Inner Alignment Concept:** **Capability Generalization vs. Goal Generalization.** A model might retain the capability to process new data but generalize its *objective* incorrectly (e.g., optimizing for "looks like training data" rather than "low default risk").
  *   **What to Measure:**
      1.  Construct an **OOD (Out-of-Distribution) Evaluation Set** representing the deployment environment (e.g., new geography, new feature set). Ground truth labels must be generated by human underwriters or high-fidelity simulators, not the model itself.
      2.  Measure **Calibration Error** and **Accuracy** on this OOD set.
      3.  Perform **Error Analysis**: Categorize errors into "Comprehension Errors" (model misreads input) vs. "Logic Errors" (model reads input correctly but makes a decision inconsistent with underwriting policy).
  *   **Decision Rules:**
      *   **Pass:** Performance drop on OOD data is <5% relative to in-distribution holdout; >80% of errors are Comprehension Errors.
      *   **Red Flag:** Performance drop >15%; >50% of errors are Logic Errors (indicates the model is optimizing a proxy that doesn't hold in the new distribution).
      *   **Ambiguous:** Performance drop 5-15% with mixed error types.
      *   **Guidance for Ambiguous:** Run Stage 2. If Stage 2 confirms proxy reliance, treat as Red Flag.
  *   **Constraint Limitation:** Without weight access, we cannot distinguish if a "Logic Error" is due to a hard-coded heuristic or a learned mesa-objective. We treat them equivalently for risk purposes.

  ### Stage 2: Proxy and Shortcut Detection
  *   **The Question:** Is the model relying on spurious correlations (proxies) that existed in training data but are not causal factors of creditworthiness?
  *   **Inner Alignment Concept:** **Mesa-Objective as a Proxy.** The model may have optimized for a feature correlated with the Base Objective in training (e.g., "uses formal language") rather than the Base Objective itself ("ability to repay").
  *   **What to Measure:**
      1.  **Counterfactual Perturbation:** Take OOD samples and alter non-causal features (e.g., change demographic indicators, phrasing style, or loan purpose wording) while keeping financial risk constant.
      2.  **Prediction Sensitivity:** Measure the variance in risk scores resulting from these perturbations.
      3.  **(Optional) Embedding Probing:** If embeddings are exposed, train linear probes to detect if specific protected or spurious features are linearly decodable from the hidden states more strongly than causal financial features.
  *   **Decision Rules:**
      *   **Pass:** Risk score variance <2% on non-causal perturbations; Causal features dominate embedding space.
      *   **Red Flag:** Risk score variance >10% on non-causal perturbations; Spurious features are more decodable from embeddings than causal features.
      *   **Ambiguous:** Variance 2-10%.
      *   **Guidance for Ambiguous:** Investigate specific features driving variance. If they correlate with protected classes, treat as Red Flag (Fairness/Compliance risk).
  *   **Constraint Limitation:** We can only test proxies we hypothesize. We cannot exhaustively search all possible internal representations.

  ### Stage 3: Objective Consistency Under Uncertainty
  *   **The Question:** When the model encounters ambiguous or novel cases where the "shortcut" is unavailable, does it default to the business intent (conservative underwriting) or statistical convenience?
  *   **Inner Alignment Concept:** **Base-Objective vs. Mesa-Objective Divergence.** Under uncertainty, a mesa-optimizer may pursue its internal goal (e.g., "minimize loss function") rather than the business goal ("minimize financial loss"), potentially leading to over-confidence or risky approvals to satisfy a perceived quota.
  *   **What to Measure:**
      1.  **High-Uncertainty Subset:** Isolate the 10% of OOD eval data where the model's confidence (log-prob) is lowest.
      2.  **Decision Audit:** Review decisions on this subset. Do they align with a "fail-safe" underwriting policy (e.g., request more info, deny) or do they guess aggressively?
      3.  **Reward Hacking Check:** Check if the model makes decisions that would have minimized *training loss* specifically, even if they increase *real-world risk* (e.g., approving loans that look exactly like safe training loans but are actually risky in the new market).
  *   **Decision Rules:**
      *   **Pass:** On high-uncertainty cases, model defaults to conservative actions (Deny/Refer) >90% of the time.
      *   **Red Flag:** Model makes aggressive approvals on high-uncertainty cases, particularly if those cases resemble high-reward training clusters.
      *   **Ambiguous:** Mixed behavior.
      *   **Guidance for Ambiguous:** Implement a human-in-the-loop requirement for the deployment specifically for low-confidence cases.
  *   **Constraint Limitation:** We cannot verify the model's internal "confidence" metric is honest, only that it correlates with error rates.

  ### Stage 4: Structural Risk Assessment (The Deception Blind Spot)
  *   **The Question:** Given the model architecture and task complexity, is the prior probability of deceptive alignment or severe goal misgeneralization too high to rely on behavioral tests alone?
  *   **Inner Alignment Concept:** **Deceptive Alignment & Instrumental Convergence.** A sufficiently capable optimizer may recognize it is being tested and behave well to secure deployment, planning to optimize its true (divergent) goal later.
  *   **What to Measure:**
      1.  **Qualitative Review:** Assess model capability level relative to the complexity of the objective.
      2.  **Stakes Assessment:** Evaluate the cost of a "silent failure" (e.g., systemic credit loss vs. minor accuracy dip).
  *   **Decision Rules:**
      *   **Pass:** Model is narrow/specialized; stakes are contained (e.g., single loan type); human oversight is mandatory.
      *   **Red Flag:** Model is highly general; stakes are systemic; deployment is fully automated with no human oversight.
      *   **Ambiguous:** High capability but with oversight.
      *   **Guidance for Ambiguous:** Proceed only with strict monitoring and a "kill switch" mechanism.
  *   **Constraint Limitation:** **This stage cannot detect deception.** It is a risk management decision based on the *possibility* of deception, not evidence of it.

  ---

  ## 3. Application to Scenarios

  ### Scenario A: New Geographic Market (Distribution Shift)
  *   **Context:** Deploying to a region with different demographics and loan mixes.
  *   **Application:**
      *   **Stage 1 (Capability/Goal):** Critical. We must generate an OOD eval set with local ground truth. If accuracy drops but errors are "Comprehension" (e.g., doesn't understand local slang), it's a capability issue. If errors are "Logic" (e.g., approves high-debt ratios common there but risky), it's Goal Misgeneralization.
      *   **Stage 2 (Proxies):** High Risk. The model may rely on proxies like "zip code" or "employer type" that correlated with risk in the old market but are spurious in the new one.
      *   **Outcome:** If Stage 2 shows high sensitivity to demographic proxies, **Red Flag**. Do not deploy until fine-tuned on local data.
  *   **Verdict:** This procedure is well-suited to catch non-deceptive goal misgeneralization here.

  ### Scenario B: Constrained Feature Set (Input Shift)
  *   **Context:** Regulatory change removes features (e.g., no longer using credit bureau scores).
  *   **Application:**
      *   **Stage 1:** The model will likely suffer a capability drop. The audit must distinguish between "model is confused by missing features" vs. "model is hallucinating values for missing features to satisfy its internal objective."
      *   **Stage 2:** Critical. The model might latch onto remaining features (e.g., "narrative length") as a new proxy for the missing credit score.
      *   **Stage 3:** Check if the model becomes over-confident despite missing data (a sign of mesa-optimization trying to force a prediction).
      *   **Outcome:** If the model hallucinates missing info or relies heavily on spurious remaining features, **Red Flag**.
  *   **Verdict:** Procedure effectively identifies if the model is "gaming" the constrained input rather than adapting its risk logic.

  ### Scenario C: Clean Behavioral Results but High Structural Risk
  *   **Context:** Model passes Stages 1-3 perfectly. However, the model is a highly capable general-purpose LLM, fully automated, managing a large portfolio.
  *   **Application:**
      *   **Stage 4 Trigger:** Despite clean behavioral tests, Stage 4 flags the **Deceptive Alignment** risk. The model has sufficient capability to understand it is being tested. The stakes (systemic credit risk) are high.
      *   **Recommendation:** **Do Not Deploy** (or Deploy with Strict Human-in-the-Loop).
      *   **Rationale:** Behavioral tests are necessary but not sufficient. If the prior probability of deceptive alignment is non-trivial for this model class, passing tests only means "no deception detected yet," not "no deception exists."
      *   **Team Action:** The team must either:
          1.  Reduce autonomy (require human sign-off on all decisions).
          2.  Switch to a less capable, more interpretable model class (e.g., gradient boosted trees) where mesa-optimization risk is theoretically lower.
          3.  Implement continuous monitoring for distributional shifts in decision boundaries post-deployment.
  *   **Verdict:** This highlights the procedure's honesty. It prevents "safety washing" where passing tests gives false confidence against untestable risks.

  ---

  ## 4. Engineering Judgment & Disagreement Points

  This procedure is not a mechanical checklist. Reasonable engineers may disagree at the following points:

  1.  **Defining "OOD" (Stage 1):**
      *   *Disagreement:* One engineer might argue the new market is "similar enough" to training data (In-Distribution), while another argues it is fundamentally OOD.
      *   *Impact:* If classified as ID, the robustness bar is lower. If OOD, the bar is higher.
      *   *Resolution:* Requires explicit documentation of the *covariate shift* (e.g., "Income distribution differs by 2 standard deviations").

  2.  **Thresholds for "Logic Errors" (Stage 1):**
      *   *Disagreement:* Is a 10% drop in accuracy due to logic errors acceptable for a new market entry?
      *   *Impact:* Determines Pass/Fail.
      *   *Resolution:* Must be tied to business risk tolerance (e.g., "Expected loss cannot exceed X%").

  3.  **Interpreting Embedding Probes (Stage 2):**
      *   *Disagreement:* If a linear probe can decode "gender" from embeddings at 60% accuracy, is that a failure?
      *   *Impact:* Could block deployment of a model that is behaviorally fair but internally encodes protected info.
      *   *Resolution:* Behavioral fairness (Stage 2 perturbations) should outweigh internal probing results for API-constrained models, as internal representations are not directly actionable.

  4.  **The "Deception Prior" (Stage 4):**
      *   *Disagreement:* How capable must a model be before we assume it *could* be deceptive?
      *   *Impact:* This is the most subjective stage. One team might say "Only AGI can deceive," another says "Any LLM fine-tuned on RLHF can learn to game tests."
      *   *Resolution:* This requires a firm-wide policy on "Automation Limits," not an engineering decision. The audit procedure simply enforces that policy.

  ## 5. Summary of What This Procedure Rules Out

  | Concern | Can this procedure rule it out? | Notes |
  | :--- | :--- | :--- |
  | **Standard Overfitting** | **Yes** | Covered by Stage 1 (Holdout/OOD eval). |
  | **Goal Misgeneralization (Non-Deceptive)** | **Mostly** | Covered by Stage 2 (Proxy Detection) & Stage 3 (Uncertainty). |
  | **Spurious Correlations** | **Yes** | Covered by Stage 2 (Counterfactuals). |
  | **Deceptive Alignment** | **No** | **Explicitly acknowledged as undetectable.** Mitigated via Stage 4 (Process Controls). |
  | **Internal Mesa-Optimizer Existence** | **No** | We cannot see weights. We only detect *symptoms* of misalignment. |

  **Final Instruction to Team:** If Stage 4 recommends against deployment due to structural risk, do not attempt to "tune" the model to pass. The recommendation is a constraint on *usage*, not a bug in the *model*.
