answer: |-
  1. **The Corporate Personhood View**: Affirming the state has a continuous moral personality requires admitting we must pretend the state is a person with feelings, meaning newborns bear inherited guilt.
  2. **The Strict Individualist View**: Insisting guilt is reducible to individual mental states and dissolves over generations entails that no reparations are ever owed.
  3. **The Civic Debt View**: Claiming citizens inherit only repair obligations rather than guilt itself commits us to saying you owe debt for crimes you didn't commit.
  4. **The Expressive Shame View**: Arguing talk of collective guilt is always just metaphor for distributed shame means we must feel shame for acts we didn't do.
  5. **The Structural Cleansing View**: Maintaining guilt is purely structural but the passage of generations automatically dissolves it implies historical injustice vanishes completely.
