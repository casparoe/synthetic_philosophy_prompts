  (4) Where I think the usual setup goes wrong is epistemology: discount a hypothesis by how much information it takes to specify, so the mugger's very specific story gets a tiny prior.
  (5) It's clearly worth spending real money to shave a well-evidenced one-in-a-thousand risk of civilisational catastrophe down a bit, and the reason is precisely that the stakes are astronomically large.

  I can't tell which of these is doing real work and which is decoration, and I have no favourite to drop. What makes me suspicious of (4) is that 3^^^^3 is a very short string — a complexity penalty measured in bits doesn't seem to care how big the number named is, but the thing I need discounted is the size of the payoff, not the length of the story.

  Here's a case I made up that I think breaks something, though I'm not sure what. Same stranger, but before demanding anything she lets you spend a few hours poking at a working simulation containing ten clearly suffering people — not proof, but about as good as evidence gets for this sort of thing — and then says she's scaling it up by a factor of 3^^^^3 unless you pay. My gut still says no. But if I say no when the claim is supported, whatever's ruling out the mugger can't be an evidential point, so it has to be something about magnitude itself — and then I don't see why (5) survives, or whether (1) is even still intact.

  So: which of these are genuinely in tension and how badly, which only look like they are, and what's the least costly revision in each case? Rank the tensions by severity, say what has to give for each, and be explicit if one of my numbered claims just has to go.
