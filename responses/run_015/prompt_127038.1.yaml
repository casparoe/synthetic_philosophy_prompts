answer: |-
  "Philosophers say you can't feel real sorrow for someone you know doesn't exist," said Mark, watching me wipe my eyes after the movie.

  "Then why are you crying?"

  "Because if that character were real, I'd have to do something about his death," I said. "Since he's fake, I only have to feel bad. Real suffering demands a hero; fictional suffering just wants an audience. And I'm much better at watching."
