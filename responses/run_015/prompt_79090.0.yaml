answer: |-
  # Activity: The Chromachip Wager

  ## 1. Materials List
  *   **Tokens:** 3 poker chips (or distinct paper slips) per student. (54 total).
  *   **The Objects:** 6 small beads/chips.
      *   5 are standard green plastic (or thermochromic that you *do not* warm).
      *   1 is **thermochromic** (Green at room temp, shifts to Blue when held/warmed for ~45 seconds). *Test this beforehand.*
  *   **The Seal:** One opaque envelope containing a card that says **"BLUE"**.
      *   *Prep:* Before class, write "BLUE" on a card, seal it in the envelope. Have a student sign across the seal at the start of class to verify you didn't swap it.
  *   **The Log:** A visible tally sheet on the whiteboard.
  *   **Handout:** "Rule Specification Sheet" (half-page, one per group).

  ## 2. Rules & Payoff Scheme
  *   **Currency:** Tokens represent "Epistemic Confidence."
  *   **Wagering:** When a prediction is called, students place tokens on the table.
      *   **1 Token:** "I think this will happen."
      *   **2 Tokens:** "I am very confident."
      *   **3 Tokens:** "I would bet my grade on it."
  *   **Payoff:**
      *   If the prediction matches reality: Keep tokens + 1 bonus from the bank.
      *   If the prediction fails: Lose tokens to the bank.
      *   *Crucial:* The goal isn't to hoard tokens, but to finish the session with *any* tokens left. (Simulates the stakes of having a working worldview).
  *   **The Constraint:** You cannot bet on "Magic." You must bet on a **Rule** written on your sheet.

  ## 3. Minute-by-Minute Timeline

  ### 00:00 – 00:10: Setup & The First Squeeze
  *   **Action:** Distribute tokens (3 each). Put the Sealed Envelope on the front desk. Have a student sign the seal. Write "PAST OBSERVATIONS: 0" on the board.
  *   **Script:** "You have three tokens. Losing them all means you have no basis for prediction. You want to keep at least one. I have a bag of objects. I will pull them out one by one. Your job is to predict their behavior."
  *   **Action:** Pull Beads 1–3. Place them on the table. Do not touch them with bare hands (use tweezers or gloves to keep them cool/green).
  *   **Observation:** All three are Green.
  *   **Script:** "Record the data. Green, Green, Green. Before I pull the fourth, place a bet. Will Bead 4 be Green?"
  *   **Outcome:** Everyone bets Green. Bead 4 is Green. They win tokens. (Builds trust in the pattern).

  ### 00:10 – 00:25: The Data Set & The Trap
  *   **Action:** Pull Bead 5. It is Green. Update Board: "PAST OBSERVATIONS: 5. SUCCESS RATE: 100%."
  *   **Script:** "The pattern is robust. Now, Bead 6 is in this opaque cup. I am going to take it out, and I am going to hold it in my closed fist for 60 seconds. Then I will open my hand."
  *   **The Wager:** "Place your tokens. What color will it be in my hand?"
  *   **Expected Result:** Almost everyone bets **Green**.
  *   **The Stop:** "Stop. Do not place the tokens yet. You are betting on a Rule. Write down the Rule you are using."
  *   **Action:** Students write "All beads are Green."

  ### 00:25 – 00:40: Manufacturing the Rival (The Goodman Move)
  *   **Action:** Divide into 6 groups of 3. Hand out "Rule Specification Sheets."
  *   **Script:** "Your rule 'All beads are Green' fits the data (1-5). I want you to invent a *different* rule. It must meet two criteria:
      1.  It must fit Beads 1-5 perfectly (predict Green).
      2.  It must predict **Blue** for Bead 6 (in the hand)."
  *   **Prompt:** "You can reference time, temperature, observation number, or my heartbeat. Just make it fit the data."
  *   **Activity:** Groups struggle, then realize they can define a predicate like: *"Object is Green if observed on table, Blue if observed in hand after 5th observation."*
  *   **Verification:** Ask Group 1 to read their rule. Ask Group 2: "Does this rule fit Beads 1-5?" (Yes). "Does it differ on Bead 6?" (Yes).
  *   **The Squeeze Question:** "Look at your tokens. You want to bet on 'All Green.' Group 1 has a rule that fits the past equally well but predicts Blue. Why is Group 1 cheating?"
  *   **Expected Pushback:** "It's ad hoc." "It's too complex." "It's not a real property."
  *   **Instructor Move:** "Define 'real property' without using the word 'future' or 'prediction.' You cannot say 'Green is real because it will stay Green.' That assumes the answer."
  *   *(Let them sit in this silence for 2 minutes. They will fail to define it non-circularly.)*

  ### 00:40 – 00:50: Entrenchment (The Usage Move)
  *   **Action:** Point to the Board Tally. "PAST OBSERVATIONS: 5." Now point to a second tally you pre-wrote: "TERM HISTORY: 'Green' used successfully 40 times in previous experiments. 'Hand-Green-Blue' used 0 times."
  *   **Script:** "Logically, both rules fit the 5 beads. But one predicate ('Green') is entrenched. We have used it 40 times this term. The other is new. Does this justify your bet?"
  *   **Discussion:** Ask a group to justify preferring the 40-time rule *without* saying "Because the world is uniform." (They can't. The fact that it worked 40 times is *more past data*. The rival rule can be defined to fit those 40 times too.)
  *   **The Point:** You are betting on *us* (our habits), not the *world* (the data).

  ### 00:50 – 01:00: The Resolution
  *   **Action:** Take Bead 6 from the cup. Hold it in your fist. Start a timer on the projector.
  *   **Script:** "I am not deciding this. The chemistry was fixed at the factory. The envelope was sealed before you walked in."
  *   **Action:** 60 seconds pass. Open hand. The bead is **Blue**.
  *   **Action:** Open the Envelope. Read "BLUE." Student verifies signature.
  *   **Outcome:** The "All Green" bettors lose their tokens. The "Rival Rule" bettors (if any dared) win.
  *   **Script:** "The data (1-5) did not contain the future. You projected 'Green' because it is your habit, not because the beads forced it."

  ### 01:00 – 01:15: Debrief (Mapping the Squeeze)
  *   **Map (a) Can't help projecting:** "Who wanted to bet Green even after Group 1 showed their rule?" (Hands go up). "That's Hume. You have a psychological compulsion to project, even when you know logically you shouldn't."
  *   **Map (b) Data underdetermines rule:** "Did the 5 green beads prove 'Always Green'?" (No). "They proved 'Green up to Bead 5.' Any rule that includes 'up to Bead 5' fits. The data is finite; the rule is infinite."
  *   **Map (c) Habit vs. World:** "Why did 'Green' feel natural?" (Because we speak English, because we've used it before). "The difference between 'Green' and 'Grue' isn't in the beads. It's in our history. That's Goodman."
  *   **Closing:** "You kept your tokens by assuming the future resembles the past. You lost them today because I changed the world. But you couldn't have known that from the data. You are betting on habit every time you expect the sun to rise."

  ---

  ## 4. Honesty Check: What Will Go Wrong & What's Missing

  ### Predictable Failure Mode 1: "It's Just Ad Hoc"
  *   **The Problem:** A smart student will say, "The rival rule is just a description, not a law. It's cheating because it references the specific time/observation number."
  *   **Why it happens:** They are smuggling in a definition of "law" that requires *projectibility*, which is exactly what is being questioned.
  *   **Your Counter:** Do not argue. Ask them to write the definition of "Law" on the board. Circle any word that implies "future" or "similarity." If they use "natural kind," ask them to define "natural" without pointing to the future.
  *   **Goal:** Show them that their intuition of "cheating" relies on the very inductive habit they are trying to justify.

  ### Predictable Failure Mode 2: Gaming the Tokens
  *   **The Problem:** A group realizes the bead *might* change and hedges, or they refuse to bet to avoid loss.
  *   **Your Counter:** "If you finish with 0 tokens, you sit out the debrief." (Social pressure). Or, "You must bet at least 1 token to participate."
  *   **Goal:** Force the commitment. Induction isn't passive; it's a wager on action.

  ### The Missing Piece: True Entrenchment
  *   **The Limitation:** You cannot replicate *lifetime* entrenchment in 75 minutes. The "40 times" tally is a simulation. Students know "Green" is entrenched in their lives outside the room. The activity makes "Green" and "Hand-Blue" look equally new *in the context of the game*.
  *   **What You Must Supply:** In the debrief, you must explicitly state: "In this room, 'Green' felt new because I treated it as a hypothesis. In your life, 'Green' feels like *truth* because you've used it 100,000 times. That feeling of truth is the entrenchment. It's not logic; it's momentum. The activity can't give you that momentum, only the logic of why momentum matters."
  *   **Why this matters:** If you don't say this, they might think entrenchment is just about the "40 times" on the board, rather than the deep linguistic/cognitive habits they bring with them.

  ## 5. Instructor Scripts (Critical Moments)

  **When they call the rival rule "Cheating":**
  > "I hear you saying 'That rule is gerrymandered.' Okay. Write the definition of 'Gerrymandered' on your sheet. Now, cross out any word that refers to the future, prediction, or expectation. Is anything left? If not, you're saying the rule is bad because it predicts the wrong future. But we don't know the future yet. You're using the answer to prove the method."

  **When they appeal to "Natural Properties":**
  > "You're saying 'Green is natural, Hand-Blue is artificial.' Show me 'Natural' in the bead. Is it in the weight? The shape? The chemical composition? Or is 'Natural' just a label we stick on the rules we've already won with?"

  **The Final Reveal:**
  > "I am opening the envelope. If it says 'Green,' I was wrong about the physics. If it says 'Blue,' you were wrong about the logic. (Open). It's Blue. The physics was fixed. Your logic was the variable. You assumed the world would match your habit. Today, it didn't."
