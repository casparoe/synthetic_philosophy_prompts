      *   *Weakness:* Risks losing the "individualist justification" core of Scanlon. Risks becoming rule-consequentialism or democratic proceduralism. Risks making "reasonable rejection" toothless if institutions can always justify burdens via aggregate benefits.
      *   *Key Tension:* Individual vs. System. Justification to *each* person vs. Justification of *rules* that affect people.

  3.  **Drafting the Objections (Audience Specific):**

      *   *Target 1: The Scanlonians (The "Purists").*
          *   *Concern:* You're betraying the "individualist justification." Scanlon says you can't sacrifice one for many *even* at the rule level if the burden is severe.
          *   *Phrasing:* Needs to sound like they know *What We Owe to Each Other* (WWOTE) inside out. Focus on "generic reasons" and "individual standing."
          *   *Damage:* High. If Scanlon is wrong, the project fails.

      *   *Target 2: The Consequentialist (The "Math Smuggler").*
