      *   **Topic:** Reinterpreting Scanlon's contractualism (Reasonable Rejection) to allow for a form of aggregation at the institutional level ("Procedural Relationalism").
      *   **Thesis:** Scanlon isn't anti-aggregative *per se*, but anti-aggregative at the *act* level. At the *institutional rule-system* level, aggregation is permissible/required if it respects relational equality (no structural subordination).
